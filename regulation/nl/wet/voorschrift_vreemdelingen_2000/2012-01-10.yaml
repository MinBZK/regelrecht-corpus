  - number: 2.1a
    text: |-
      1 De vervoerder, bedoeld in [artikel 2.2a, eerste lid, van het Besluit][ref1], verzamelt de passagiersgegevens,
      bedoeld in artikel 2.2a, derde lid, van het Besluit ten aanzien van alle passagiers die hij naar de luchthaven
      Schiphol vervoert vanaf een luchthaven, genoemd in [bijlage 1a][ref2].

      2 De vervoerder zendt de krachtens het eerste lid verzamelde passagiersgegevens elektronisch, voor het einde van de
      instapcontroles aan de ambtenaar belast met de grensbewaking aan het door die ambtenaar aangegeven adres.

      3 De ingevolge het tweede lid te zenden gegevens worden verzonden in een bericht met de structuur die is gebaseerd
      op de vanwege de Economische Commissie voor Europa van de Verenigde Naties vastgestelde indeling voor elektronische
      gegevensuitwisseling voor overheid, handel en vervoer, gepubliceerd onder de titel: Electronic Data Interchange For
      Administration, Commerce and Transport (EDIFACT) Passenger List Message (PAXLST).


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2.2a
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel2.1a
