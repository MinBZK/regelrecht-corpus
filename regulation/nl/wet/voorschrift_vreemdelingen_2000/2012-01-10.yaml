articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *het Besluit:* het [Vreemdelingenbesluit 2000][ref1];

      b. *EVRM*: Verdrag tot bescherming van de rechten van de mens en de fundamentele vrijheden;

      c. *de TWV:* de tewerkstellingsvergunning, bedoeld in [artikel 1, onder e, van de Wet arbeid vreemdelingen][ref2];

      d. *de GBA:* de Gemeentelijke Basisadministratie persoonsgegevens, bedoeld in de
      [Wet Gemeentelijke Basisadministratie persoonsgegevens][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011825
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006723
