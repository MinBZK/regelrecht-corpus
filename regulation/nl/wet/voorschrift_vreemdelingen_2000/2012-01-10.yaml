  - number: 3.37b
    text: |-
      1 Een gegronde vrees voor vervolging in de zin van het Vluchtelingenverdrag of een reëel risico
      op folteringen, onmenselijke of vernederende behandelingen of bestraffingen als bedoeld in
      [artikel 29, eerste lid, onder b, van de Wet][ref1] kan gegrond zijn op gebeurtenissen die hebben plaatsgevonden
      nadat de vreemdeling het land van herkomst heeft verlaten.

      2 Een gegronde vrees voor vervolging in de zin van het Vluchtelingenverdrag of een reëel risico
      op folteringen, onmenselijke of vernederende behandelingen of bestraffingen als bedoeld in
      [artikel 29, eerste lid, onder b, van de Wet][ref2] kan gegrond zijn op activiteiten van de vreemdeling sedert
      hij het land van herkomst heeft verlaten, met name wanneer wordt vastgesteld dat de betrokken activiteiten de
      uitdrukking en de voortzetting vormen van overtuigingen of strekkingen die de betrokkene in het land van herkomst
      aanhing.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel29
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel3.37b
    references:
