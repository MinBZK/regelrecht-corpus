  - number: 3.33b
    text: |-
      De aanvraag tot het verlenen of wijzigen van de verblijfsvergunning, bedoeld in [artikel 20 van de Wet][ref1],
      wordt ingediend bij de Immigratie- en Naturalisatiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel3.33b
