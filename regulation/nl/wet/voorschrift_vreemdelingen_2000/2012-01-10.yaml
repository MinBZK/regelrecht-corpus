  - number: 3.2a
    text: |-
      1 In afwijking van [artikel 3.2, tweede lid][ref1], wordt op de documenten en verklaringen, bedoeld in het eerste
      lid van dat artikel, de aantekening gesteld: ‘arbeid in loondienst alleen toegestaan indien werkgever beschikt over
      TWV’, indien het een vreemdeling betreft die de nationaliteit bezit van Bulgarije of Roemenië. Dezelfde aantekening
      wordt gesteld op de documenten en verklaringen van de echtgenote dan wel geregistreerde partner, van de in de
      voorgaande volzin bedoelde vreemdeling, en bloedverwanten in neergaande lijn beneden de leeftijd van 21 jaar of
      die te hunnen laste zijn, ongeacht hun nationaliteit, voorzover zij geen onderdaan zijn van een staat die op 31
      december 2006 partij was, bedoeld in [artikel 3.2, eerste lid, onder b][ref2], en evenmin van Cyprus of Malta.

      2 Het voorgaande lid is niet van toepassing indien de vreemdeling, bedoeld in de eerste volzin ervan, op of na 1
      januari 2007 legaal in Nederland verbleef en diens toegang tot de Nederlandse arbeidsmarkt die dag gold voor de
      duur van ten minste twaalf onafgebroken maanden, ingevolge een tewerkstellingsvergunning of blijkens een daartoe
      strekkende aantekening op een eerder verleende verblijfsvergunning, bedoeld in [artikel 14 van de Wet][ref3], van
      zodanige duur.


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0012002#Artikel3.2
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel14
