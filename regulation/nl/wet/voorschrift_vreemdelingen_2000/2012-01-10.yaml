  - number: '3.40'
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in [artikel 33 van de Wet][ref1], wordt gedaan
      door indiening van een formulier van het in [bijlage 13][ref2] bij deze regeling met j-1 aangeduide model.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0012002
