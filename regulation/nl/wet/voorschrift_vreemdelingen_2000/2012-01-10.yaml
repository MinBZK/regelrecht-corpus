  - number: '2.9'
    text: |-
      Voor de ondertekening door een daartoe solvabele derde van de garantverklaring, bedoeld in
      [artikel 2.11, derde lid, van het Besluit][ref1], wordt bij het verlenen van toegang aan:

      a. een zeeman of meerdere zeelieden gebruik gemaakt van het model, dat als [bijlage 6a][ref2] onderscheidenlijk als
      [bijlage 6b][ref3] bij deze regeling is gevoegd;

      b. een andere vreemdeling gebruik gemaakt van het model, dat als [bijlage 6c][ref4] bij deze regeling is gevoegd.


