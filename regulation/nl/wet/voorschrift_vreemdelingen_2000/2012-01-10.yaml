      - id: ref2
        bwb_id: BWBR0012002
  - number: '4.10'
    text: |-
      De aantekening, bedoeld in [artikel 4.29 van het Besluit][ref1], omtrent het voldoen aan een
      verplichting tot aanmelding of vervoeging bij een korpschef ingevolge de [artikelen 4.39][ref2],
      [4.47 tot en met 4.51 van het Besluit luidt][ref3]: 'Aangemeld op (datum)'. Indien het betreft een vreemdeling die
      naar Nederland is gekomen om als zeeman werk te zoeken aan boord van een zeeschip, wordt de aantekening aangevuld
      met de zinsnede 'voor verblijf als zeeman tot (datum)'.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.29
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4.39
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel4.47
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4.29'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '4.39'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '4.47'
  - number: '4.11'
    text: |-
      1 In de reis- en identiteitspapieren van een vreemdeling wiens uitzetting gedurende enige tijd achterwege blijft,
      wordt een aantekening gesteld, luidende: 'vertrek voor (datum)'.

      2 In de reis- en identiteitspapieren van een vreemdeling wiens uitzetting achterwege blijft hangende de beslissing
      op een door hem ingediend verzoek om een voorlopige voorziening wordt de aantekening: 'verzoek voorlopige
      voorziening ingediend (datum). Arbeid is wel/niet toegestaan. Een tewerkstellingsvergunning is wel/niet verplicht.
      Geldig tot (datum), tenzij voor deze datum op voormeld verzoek is beslist' gesteld. Tevens worden aangetekend het
      V-nummer en het paspoortnummer.

      3 De aantekening, bedoeld in het tweede lid, heeft een geldigheidsduur van ten hoogste zes maanden. Indien de
      geldigheidsduur van de aantekening is verstreken voordat een beslissing is genomen op het verzoek om een voorlopige
      voorziening, kan de desbetreffende aantekening wederom worden gesteld met een geldigheidsduur van ten hoogste zes
      maanden. Indien afwijzend is beslist, wordt de aantekening 'vervallen' geplaatst.

      4 Voor de aantekeningen, bedoeld in het tweede lid, wordt gebruik gemaakt van de Sticker Aantekening Voorlopige
      Voorziening, waarvan het model als [bijlage 7k][ref1] bij deze regeling is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0012002
  - number: '4.12'
    text: |-
      De aantekening omtrent verandering van woon- of verblijfplaats binnen Nederland, bedoeld in
      [artikel 4.29, eerste lid, onder b, van het Besluit][ref1], luidt: 'verhuisd op (datum)'.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.29
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4.29'
  - number: '4.13'
    text: |-
      De korpschef is bevoegd om met toepassing van [artikel 4.51 van het Besluit][ref1]:

      a. ontheffing te verlenen van de verplichting tot periodieke aanmelding, bedoeld in
      [artikel 4.51 van het Besluit][ref2], en

      b. de termijn van een week, genoemd in [artikel 4.51, tweede lid, van het Besluit][ref3], te verkorten of te
      verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.51
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4.51
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel4.51
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4.51'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '4.51'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '4.51'
  - number: '4.14'
    text: |-
      1 De aantekening omtrent de ontheffing met toepassing van [artikel 4.51, tweede lid, van het Besluit][ref1] van de
      verplichting tot wekelijkse aanmelding, luidt: 'ontheffing verleend van de verplichting tot wekelijkse aanmelding
      onder de volgende beperking(en) en/of voorschrift(en) (beperkingen/voorschriften) (datum)'.

      2 Indien met toepassing van [artikel 4.51, tweede lid, van het Besluit][ref2] een andere dan een wekelijkse
      termijn voor periodieke aanmelding is gesteld, wordt de aantekening gesteld 'Verplichting tot periodieke aanmelding
      krachtens [artikel 4.51 Vreemdelingenbesluit 2000][ref3]', aangevuld met de periode van aanmelding en eventuele
      bijzonderheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4.51
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4.51
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel4.51
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel4.14
