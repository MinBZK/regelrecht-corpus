        bwb_id: BWBR0011823
        artikel: '47'
  - number: '5.4'
    text: |-
      De ambtenaar van de Dienst Terugkeer en Vertrek en de hulpofficier van justitie die
      bevoegd is tot inbewaringstelling, zijn bevoegd tot het nemen van het besluit, bedoeld in
      [artikel 5.5, eerste lid, van het Besluit][ref1] en tot het doen van de kennisgeving, bedoeld in artikel 5.5,
      tweede lid, van het Besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel5.5
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '5.5'
  - number: '6.1'
    text: |-
      1 De ambtenaren belast met de grensbewaking of met het toezicht op vreemdelingen zijn bevoegd tot uitzetting over
      te gaan en daartoe alle benodigde handelingen te verrichten.

      2 De ambtenaren, bedoeld in het eerste lid, gaan niet dan ingevolge een bijzondere aanwijzing van de Minister over
      tot uitzetting van de vreemdeling die te kennen geeft dat hij asiel wenst.
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel6.1
  - number: '6.2'
    text: |-
      De korpschef en de bevelhebber van de Koninklijke marechaussee zijn bevoegd de kosten van verwijdering te verhalen
      op de vreemdeling of op een vervoersonderneming.
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel6.2
  - number: '6.3'
    text: |-
      1 De verlenging, bedoeld in [artikel 62, derde lid, van de Wet][ref1], van de vertrektermijn, bedoeld in artikel
      62, eerste lid, van de Wet, vindt uitsluitend plaats indien de vreemdeling ervoor zorg heeft gedragen dat de voor
      zijn vertrek uit eigen beweging noodzakelijke bescheiden voorhanden zijn dan wel binnen korte termijn voorhanden
      zullen zijn.

      2 De verlenging van de vertrektermijn bedraagt maximaal 90 dagen.

      3 In afwijking van het tweede lid, kan de vertrektermijn met ten hoogste zes maanden worden verlengd indien de
      vreemdeling op verzoek van het Internationale Strafhof in Nederland verblijft en de maximale duur van het aan hem
      verleende visum niet kan worden verlengd.

      4 Bij het besluit omtrent verlenging van de vertrektermijn worden onder meer de aanwezigheid van schoolgaande
      kinderen of het bestaan van andere gezinsbanden en sociale banden betrokken.

      5 Het verzoek om de vertrektermijn te verlengen, wordt in persoon ingediend bij de ambtenaar belast met het
      begeleiden van de terugkeer of het loket van de IND.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
  - number: '6.4'
    text: |-
      1 De kennisgeving, bedoeld in [artikel 62a, eerste lid van de Wet][ref1], wordt gegeven door de ambtenaar
      van de Immigratie- en Naturalisatiedienst die daartoe bevoegd is, of door de ambtenaar, bedoeld in
      [artikel 47, eerste lid, onder a of b, van de Wet][ref2].

      2 Indien de kennisgeving, bedoeld in [artikel 62a, eerste lid, van de Wet][ref3], wordt gegeven, wordt de
      vreemdeling in een taal die de vreemdeling begrijpt of redelijkerwijze geacht mag worden te begrijpen mondeling of
      schriftelijk op de inhoud en de rechtsgevolgen daarvan gewezen, en wordt de vreemdeling gewezen op de mogelijkheid
      daartegen rechtsmiddelen aan te wenden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62a
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel62a
    url: https://wetten.overheid.nl/BWBR0012002/2012-01-10#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 62a
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 62a
  - number: '6.5'
    text: |-
      1 Het inreisverbod, bedoeld in [artikel 66a van de Wet][ref1], wordt uitgevaardigd, gewijzigd of opgeheven door
      de ambtenaar van de Immigratie- en Naturalisatiedienst die daartoe bevoegd is, of door de ambtenaar, bedoeld in
      [artikel 47, eerste lid, onder a en b, van de Wet][ref2], die tevens hulpofficier van justitie is.

      2 Het inreisverbod wordt uitgevaardigd, gewijzigd of opgeheven door de ambtenaar van de Immigratie-
      en Naturalisatiedienst die daartoe bevoegd is, indien daaraan de rechtgevolgen, bedoeld in
      [artikel 66a, zevende lid, van de Wet][ref3], zijn verbonden.

      3 Indien het inreisverbod wordt uitgevaardigd, wordt in een taal die de vreemdeling begrijpt of redelijkerwijze
      geacht mag worden te begrijpen mondeling of schriftelijk op de inhoud en de rechtsgevolgen daarvan gewezen, en
      wordt de vreemdeling gewezen op de mogelijkheid daartegen rechtsmiddelen aan te wenden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel66a
