  - number: 3.37a
    text: |-
      Actoren van vervolging in de zin van het Vluchtelingenverdrag, dan wel van folteringen, onmenselijke of
      vernederende behandelingen of bestraffingen als bedoeld in [artikel 29, eerste lid, onder b, van de Wet][ref1]
      kunnen onder meer zijn:

      a. de staat;

      b. partijen of organisaties die de staat of een aanzienlijk deel van zijn grondgebied beheersen;

      c. niet-overheidsactoren, indien aannemelijk is gemaakt dat de actoren als bedoeld onder a en b, inclusief
      internationale organisaties, geen bescherming als bedoeld in [artikel 3.37c][ref2] kunnen of willen bieden
      tegen vervolging in de zin van het Vluchtelingenverdrag, dan wel tegen folteringen, onmenselijke of vernederende
      behandelingen of bestraffingen als bedoeld in [artikel 29, eerste lid, onder b, van de Wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0012002#Artikel3.37c
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel29
