    text: |-
      De aanvraag tot het verlenen of het wijzigen van een verblijfsvergunning als bedoeld in
      [artikel 20 van de Wet][ref1], wordt gedaan door indiening van een formulier van het in [bijlage 13][ref2] bij deze
