  - number: 4.35.1
    text: |-
      De referent van een vreemdeling die in Nederland verblijft of wil verblijven in het kader van arbeid als
      kennismigrant of als houder van de Europese blauwe kaart, neemt met betrekking tot de vreemdeling wiens referent
      hij is in de administratie op:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35
  - number: 4.35.1.a
    text: de arbeidsovereenkomst waaruit de duur en de aard van het dienstverband en het overeengekomen inkomen blijkt;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35
  - number: 4.35.1.b
    text: |-
      indien de vreemdeling in Nederland in Nederland verblijft of wil verblijven in het kader van arbeid als
      kennismigrant,
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35
  - number: 4.35.1.b.1°
    text: |-
      loonspecificaties waaruit blijkt dat de vreemdeling na toelating aan het looncriterium, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___, voldoet;


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
  - number: 4.35.1.b.2°
    text: |-
      loonspecificaties waaruit blijkt dat de vreemdeling na toelating voldoet aan het looncriterium, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______ en bewijsstukken waaruit blijkt dat de vreemdeling na toelating voldoet aan de voorwaarden voor een
      verblijfsvergunning regulier voor bepaalde tijd onder de beperking ‘het zoeken naar en verrichten van arbeid al dan
      niet in loondienst’, bedoeld in [artikel 3.42 van het Besluit][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 4.35.1.b.3°
    text: |-
      indien het looncriterium niet van toepassing is, loonspecificaties waaruit blijkt dat de vreemdeling na toelating
      zelfstandig en duurzaam over voldoende middelen van bestaan beschikt;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35
  - number: 4.35.1.c
    text: |-
      indien de vreemdeling in Nederland verblijft of wil verblijven als houder van de Europese blauwe kaart,
      loonspecificaties waaruit blijkt dat de vreemdeling na toelating aan het looncriterium, bedoeld in
      [artikel 2.2, eerste lid, onderdeel b, van het Besluit uitvoering Wet arbeid vreemdelingen 2022][ref1], voldoet;


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
  - number: 4.35.1.d
    text: |-
      indien de vreemdeling in Nederland verblijft in het kader van arbeid als kennismigrant, voor zover het
      looncriterium van toepassing is, of als houder van de Europese blauwe kaart, een afschrift van een zakelijke
      bankrekening of een ander soortgelijk bewijsstuk, waaronder begrepen, maar niet beperkt tot een overzicht van een
      batchbetaling, waaruit blijkt dat het loon is bijgeschreven op een bankrekening, bestemd voor girale betaling, op
      naam van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35
  - number: 4.35.1.e
    text: |-
      een bewijs van inschrijving in het opleidingsregister van de Medisch Specialisten Registratie Commissie, de
      Sociaal-Geneeskundigen Registratie Commissie of de Huisarts en Verpleeghuisarts Registratie Commissie in het geval
      de vreemdeling een arts in opleiding tot specialist is;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35
  - number: 4.35.1.f
    text: |-
      de erkenning van de beroepskwalificaties in de zin van
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1], voor zover de vreemdeling in Nederland
      verblijft of wil verblijven als houder van de Europese blauwe kaart en een gereguleerd beroep in de zin van
      [artikel 1 van die wet][ref2] uitoefent, dan wel, voor zover hij een niet-gereguleerd beroep uitoefent, de voor dat
      beroep of de desbetreffende sector benodigde getuigschriften van hoger onderwijs in de zin van artikel 2, onder 8,
      van [Richtlijn 2021/1883/EU](32021L1883) of bewijsstukken ter staving van hogere beroepsvaardigheden, als bedoeld
      in [artikel 3.30b, derde lid, van het Besluit][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
      - id: ref2
