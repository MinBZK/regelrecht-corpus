    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.11
  - number: '3.12'
    text: |-
      De kosten, bedoeld in [artikel 3.98b, tweede lid, van het Besluit][ref1] bedragen € 150 en worden voldaan door
      storting of overschrijving van het verschuldigde bedrag in Euro op een door de Minister van Sociale Zaken en
      Werkgelegenheid aan te wijzen bankrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.12
