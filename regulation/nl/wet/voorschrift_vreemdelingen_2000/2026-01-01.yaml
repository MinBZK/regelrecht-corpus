        artikel: '5'
  - number: 3.16.4
    text: |-
      Ter zake van het advies, bedoeld in het tweede lid, is de vreemdeling aan de door de Minister voor Sociale Zaken en
      Werkgelegenheid aangewezen onafhankelijk medisch adviseur een bedrag van € 240,79 verschuldigd.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.16
  - number: 3.16a
    text: |-
      Als categorie vreemdelingen, bedoeld in [artikel 3.4, vierde lid, van het Besluit][ref1], is aangewezen
      vreemdelingen met het verblijfsdoel verblijf in het kader van de pilot huisvesting Akense niet-EU studenten.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.16a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.16b.1
    text: |-
      Gelet op [artikel 3.4, vierde lid, van het Besluit][ref1] kan de verblijfsvergunning regulier voor bepaalde tijd
      worden verleend onder de beperking grenswachter van de grensbewakingsdienst van het Verenigd Koninkrijk aan de
      vreemdeling die:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.16b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.16b.1.a
    text: |-
      op grond van een geldige arbeidsovereenkomst of aanstelling in dienst is bij de grensbewakingsdienst van het
      Verenigd Koninkrijk; en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.16b
  - number: 3.16b.1.b
    text: |-
      grenscontroles verricht ten behoeve van het rechtstreekse treinverkeer op het traject tussen Nederland en het
      Verenigd Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.16b
  - number: 3.16b.2
    text: Het verblijfsrecht is tijdelijk.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.16b
  - number: 3.16b.3
    text: |-
      De verblijfsvergunning wordt verleend voor de duur van de arbeidsovereenkomst of aanstelling en ten hoogste voor
      vijf jaar. De verblijfsvergunning is niet verlengbaar na vijf jaar.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.16b
  - number: 3.16b.4
    text: |-
      Aan de gezinsleden van de vreemdeling, bedoeld in [artikel 3.14 van het Besluit][ref1], kan een verblijfsvergunning
      regulier voor bepaalde tijd worden verleend, bedoeld in [artikel 3.13, eerste lid, van het Besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.16b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
  - number: '3.17'
    text: |-
      De situatie waarin wordt voldaan aan de voorwaarden voor de overgangsregeling van de Terugtrekkingsregeling wordt
      aangewezen als geval, bedoeld in [artikel 3.6c, eerste lid, van het Besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.17
