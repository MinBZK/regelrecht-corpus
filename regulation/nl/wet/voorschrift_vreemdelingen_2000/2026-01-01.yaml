        artikel: '8'
  - number: 3.34j.5
    text: |-
      In afwijking van het eerste lid is de vreemdeling een bedrag van € 171 verschuldigd ter zake van de afgifte van
      een vervangend document waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder a, van de Wet][ref1] blijkt,
      voor zover de verblijfsvergunning is verleend onder een beperking verband houdend met verblijf als familie- of
      gezinslid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
