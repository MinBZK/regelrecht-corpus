        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.9a.1.a
    text: |-
      de Oekraïense nationaliteit hebben en die na 26 november 2021 Oekraïne zijn ontvlucht of die in de periode van
      27 november 2021 tot en met 23 februari 2022 naar het grondgebied van de Europese Unie zijn gereisd;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.9a
  - number: 3.9a.1.b
    text: |-
      de Oekraïense nationaliteit hebben en die kunnen aantonen dat zij in de periode vóór 27 november 2021 feitelijk al
      in Nederland verbleven; of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.9a
  - number: 3.9a.1.c
    text: 'beschikken over een op 23 februari 2022 geldige Oekraïense permanente verblijfsvergunning en ten aanzien van wie:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.9a
  - number: 3.9a.1.c.1°
    text: aannemelijk is dat zij Oekraïne na 26 november 2021 hebben verlaten; en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.9a
  - number: 3.9a.1.c.2°
    text: niet is gebleken dat zij na 23 februari 2022 naar het land van herkomst zijn teruggekeerd.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.9a
  - number: 3.9a.2
    text: |-
      [Artikel 3.1a, eerste lid, aanhef en onder b tot en met d, van het Besluit][ref1], is van overeenkomstige
      toepassing op familieleden van vreemdelingen als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.9a
