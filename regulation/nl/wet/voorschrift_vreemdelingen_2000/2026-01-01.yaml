  - number: 3.34c.1
    text: |-
      In afwijking van [artikel 3.34][ref1] en [3.34a][ref2] is de vreemdeling geen leges verschuldigd ter zake
      van de afdoening van een aanvraag tot het verlenen of verlengen van een verblijfsvergunning als bedoeld in
      [artikel 14 van de Wet][ref3], onder een beperking verband houdend met niet-tijdelijke humanitaire gronden op grond
      van [artikel 3.51, derde lid, van het Besluit][ref4] en [artikel 3.24aa, tweede lid, aanhef en onder j][ref5], in
      verband met een gezagsbeëindiging.


