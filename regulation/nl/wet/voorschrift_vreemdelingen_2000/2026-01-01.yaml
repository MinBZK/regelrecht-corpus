        artikel: '8'
  - number: 3.3.7
    text: |-
      De aantekening, bedoeld in het derde lid, heeft een geldigheidsduur van ten hoogste drie maanden. Indien
      de geldigheidsduur van de aantekening verstrijkt voordat een beslissing op de aanvraag is genomen, kan de
      desbetreffende aantekening wederom worden gesteld met een geldigheidsduur van ten hoogste drie maanden. Indien
      afwijzend is beslist, wordt de aantekening ‘vervallen’ geplaatst.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.3
  - number: 3.3.8
    text: |-
      De aantekeningen, bedoeld in het vierde en vijfde lid, hebben een geldigheidsduur van ten hoogste zes maanden.
      Indien de geldigheidsduur van de aantekening verstrijkt voordat een beslissing is genomen op de aanvraag,
      onderscheidenlijk het bezwaar of beroep, kan de desbetreffende aantekening wederom worden gesteld met een
      geldigheidsduur van ten hoogste zes maanden. Indien afwijzend is beslist, wordt de aantekening 'vervallen'
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.3
  - number: 3.4.1
    text: |-
