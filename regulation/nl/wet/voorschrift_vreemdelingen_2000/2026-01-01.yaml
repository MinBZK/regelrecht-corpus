        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.34h.1
    text: |-
      Ter zake van de afdoening van een aanvraag om toetsing aan het gemeenschapsrecht en afgifte van het daaraan
      verbonden verblijfsdocument, is de vreemdeling een bedrag van € 85 verschuldigd.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34h
  - number: 3.34h.2
    text: |-
      Onverminderd [artikel 3.34g, derde en vierde lid][ref1], is de vreemdeling die valt onder artikel 41, eerste
      lid, van het op 23 november 1970 te Brussel tot stand gekomen Aanvullend Protocol bij de op 12 september 1963
      te Ankara gesloten Overeenkomst waarbij een associatie tot stand wordt gebracht tussen de Europese Economische
      Gemeenschap en Turkije (Trb. 1971, 70) of artikel 6, 7 of 13 van het Besluit 1/80 van de Associatieraad EEG-Turkije
      betreffende de ontwikkeling van de Associatie, ter zake van de afdoening van een aanvraag tot het verlenen van een
      verblijfsvergunning als bedoeld in [artikel 20 van de Wet][ref2], een bedrag van € 85 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34h
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 3.34ha.1
    text: |-
      Ter zake van de afdoening van een aanvraag om toetsing aan het terugtrekkingsakkoord en afgifte van het daaraan
      verbonden verblijfsdocument, is de vreemdeling een bedrag van € 85 verschuldigd.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34ha
  - number: 3.34ha.2
    text: |-
      In afwijking van het eerste lid is de vreemdeling geen leges verschuldigd ter zake van de afdoening van een
      aanvraag tot het verlenen van een verblijfsdocument als bedoeld in artikel 19 van het terugtrekkingsakkoord indien
      de vreemdeling die deze aanvraag indient reeds in het bezit is van een document, waaruit het verblijfsrecht als
      bedoeld in [artikel 8.17 van het Besluit][ref1] blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34ha
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
  - number: 3.34ha.3
    text: |-
      Ter zake van de afdoening van een aanvraag om toetsing aan zijn rechten als grensarbeider uit hoofde van titel
      II van het terugtrekkingsakkoord en afgifte van het daaraan verbonden document, bedoeld in artikel 26 van het
      terugtrekkingsakkoord, is de vreemdeling een bedrag van € 85 verschuldigd.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34ha
  - number: 3.34j.1
    text: |-
      Ter zake van de afgifte ter uitvoering van [artikel 4.22, eerste lid, van het Besluit][ref1], van een vervangend
      document waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder a, van de Wet][ref2] blijkt of ter zake van
      de afgifte van een vervangend document ter correctie van naar het oordeel van de Minister gedateerde of onjuiste
      gegevens, is de vreemdeling een bedrag van € 171 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34j
