  - number: 4.35.2
    text: 'Bewijsstukken als bedoeld in het eerste lid, onderdeel b, subonderdeel 2, zijn:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35
  - number: 4.35.2.a
    text: |-
      een kopie van het diploma, het getuigschrift, of de verklaring op welke datum aan alle voorwaarden is voldaan voor
      het verkrijgen van een diploma of getuigschrift;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35
  - number: 4.35.2.b
    text: |-
      indien van toepassing, ten minste twee afschriften waaruit blijkt dat de buitenlandse instelling, waar vreemdeling
      een masteropleiding of een postdoctorale opleiding heeft afgerond of is gepromoveerd, is aangewezen, bedoeld in
      [artikel 3.23][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 4.35.2.c
    text: |-
      indien van toepassing, een testrapport, diploma, getuigschrift, certificaat of ander document waaruit
      blijkt dat de vreemdeling het minimale kennisniveau van de Engelse of Nederlandse taal bezit, als bedoeld in
      [art. 3.42, eerste lid, onder e van het Besluit][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 4.35.2.d
    text: indien van toepassing, een schriftelijke Internationale Diplomawaardering.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35
  - number: 4.35.3
    text: |-
      De referent, bedoeld in het eerste lid, neemt met betrekking tot de nakoming van zijn verplichtingen als referent
      in de administratie op de stukken omtrent de wijze waarop hij invulling heeft gegeven aan de zorgplicht.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35
  - number: 4.35a.1
    text: |-
      De referent van een vreemdeling die in Nederland verblijft of wil verblijven in het kader van een overplaatsing
      binnen een onderneming, neemt met betrekking tot de vreemdeling wiens referent hij is in de administratie op:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35a
  - number: 4.35a.1.a
    text: |-
      de arbeidsovereenkomst met de buiten de Europese Unie gevestigde onderneming en de opdrachtbrief van de werkgever
      of, indien de vreemdeling een trainee-werknemer is, de trainee-overeenkomst;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35a
  - number: 4.35a.1.b
    text: |-
      (loon)specificaties waaruit blijkt dat de vreemdeling na toelating een arbeidsplaats vervult van welke de
      arbeidsvoorwaarden, arbeidsverhoudingen of arbeidsomstandigheden ten minste op het niveau dat wettelijk vereist is
      en in de desbetreffende bedrijfstak gebruikelijk is, liggen;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35a
  - number: 4.35a.1.c
    text: |-
      een bewijs van inschrijving in het opleidingsregister van de Medisch Specialisten Registratie Commissie, de
      Sociaal-Geneeskundigen Registratie Commissie of de Huisarts en Verpleeghuisarts Registratie Commissie in het geval
      de vreemdeling een arts in opleiding tot specialist is;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35a
  - number: 4.35a.1.d
    text: |-
      de voor de desbetreffende sector benodigde getuigschriften van hoger onderwijs in de zin van
      [artikel 2, onder h, van de Algemene wet erkenning EU-beroepskwalificaties][ref1], voor zover de vreemdeling een
      gereglementeerd beroep in de zin van [artikel 5 van die wet][ref2] uitoefent;


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35a
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 4.35a.1.e
    text: |-
      de door de vreemdeling ingevulde en ondertekende antecedentenverklaring, bedoeld in
      [artikel 3.77, elfde lid, van het Besluit][ref1], indien de referent erkend is krachtens
      [artikel 2c van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2c
  - number: 4.35a.2
    text: |-
      De referent, bedoeld in het eerste lid, neemt met betrekking tot de nakoming van zijn verplichtingen als referent
      in de administratie op de stukken omtrent de wijze waarop hij invulling heeft gegeven aan de zorgplicht.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.35a
  - number: '4.36'
    text: |-
      De referent van een vreemdeling die in Nederland verblijft of wil verblijven in het kader van onderzoek in de zin
      van richtlijn (EU) 2016/801, neemt met betrekking tot de vreemdeling wiens referent hij is in de administratie op:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.36
  - number: 4.36.a
    text: de gastovereenkomst bedoeld in artikel 10 van richtlijn (EU) 2016/801;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.36
  - number: 4.36.b
    text: een kopie van het passend diploma van hoger onderwijs dat toegang geeft tot doctoraal programma’s;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.36
  - number: 4.36.c
    text: |-
      de eigen verklaring waaruit blijkt dat de vreemdeling zelfstandig en duurzaam beschikt over voldoende middelen van
      bestaan en de bewijsmiddelen die daaraan ten grondslag liggen;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.36
  - number: 4.36.d
    text: |-
      de door de vreemdeling ingevulde en ondertekende antecedentenverklaring, bedoeld in
      [artikel 3.77, elfde lid, van het Besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.36
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: '4.37'
    text: |-
      Bewijsstukken als bedoeld in [artikel 4.36, onder c][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.37
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: 4.37.a
    text: |-
      een afschrift van de arbeidsovereenkomst, een recente werkgeversverklaring voorzien van datum, handtekening van de
      werkgever en firmastempel en afschriften van loonspecificaties;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.37
  - number: 4.37.b
    text: |-
      een verklaring inkomen van een gevestigde ondernemer en een uittreksel van de Kamer van Koophandel, voor zover
      inschrijving van de zelfstandig ondernemer op grond van de [Handelsregisterwet 2007][ref1] is vereist;


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.37
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: 4.37.c
    text: sponsorovereenkomst(en) waaruit de hoogte van de sponsorgelden en de duur van de sponsorovereenkomst(en) blijken;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.37
  - number: 4.37.d
    text: |-
      schriftelijke bewijsstukken waaruit de hoogte van de beurs of het stipendium blijkt en het tijdvak waarover de
      beurs of het stipendium is toegekend;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.37
  - number: 4.37.e
    text: |-
      bewijsstukken van periodieke betalingen waaruit blijkt dat voldoende zekerheid bestaat over het ongestoorde verloop
      van de geldstroom;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.37
  - number: 4.37.f
    text: |-
      in geval van een dienstbetrekking van de vreemdeling met een in het buitenland gevestigde werkgever een verklaring
      van die werkgever waaruit de duur van de dienstbetrekking en de hoogte van het salaris blijkt.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.37
  - number: 4.38.1
    text: |-
      De referent van een vreemdeling die in Nederland verblijft of wil verblijven in het kader van verblijf als familie-
      of gezinslid, neemt met betrekking tot de vreemdeling wiens referent hij is in de administratie op:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.1.a
    text: indien er sprake is van een huwelijk tussen de referent en vreemdeling, de gelegaliseerde huwelijksakte;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.1.b
    text: indien er sprake is van toelating van een partner, de gelegaliseerde ongehuwdverklaring van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.1.c
    text: indien er sprake is van toelating van een kind, de gelegaliseerde geboorteakte;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.1.d
    text: |-
      indien het rechtmatig gezag bij de toelating is aangetoond, de gelegaliseerde bescheiden waaruit het rechtmatig
      gezag van de ouder over het kind blijkt;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.1.e
    text: bewijsstukken waaruit blijkt dat de referent zelfstandig en duurzaam beschikt over voldoende middelen van bestaan.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.2
    text: |-
      De referent van een minderjarige vreemdeling die ter adoptie in Nederland verblijft of wil verblijven in het kader
      van verblijf als familie- of gezinslid, neemt met betrekking tot de vreemdeling wiens referent hij is of was in de
      administratie op:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.2.a
    text: het document waaruit de identiteit van de minderjarige vreemdeling blijkt;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.2.b
    text: |-
      de gelegaliseerde bescheiden waaruit blijkt dat de afstand door de ouder(s) van de minderjarige vreemdeling naar
      behoren is geregeld;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.2.c
    text: |-
      het gelegaliseerde bewijs van instemming van de daartoe bevoegde autoriteiten in het land van herkomst met opneming
      van de vreemdeling door de referent in zijn gezin.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.3
    text: |-
      De referent van een minderjarige vreemdeling die in afwachting van het onderzoek naar de geschiktheid van de
      referent als adoptieouder in Nederland verblijft of wil verblijven in het kader van verblijf als familie- of
      gezinslid, neemt met betrekking tot de vreemdeling wiens referent hij is of was in de administratie op:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.3.a
    text: het document waaruit de identiteit van de minderjarige vreemdeling blijkt;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.3.b
    text: |-
      de gelegaliseerde bescheiden waaruit blijkt dat de ouders van het kind, of als deze zijn overleden of een onbekende
      verblijfplaats hebben, de autoriteiten van het land van herkomst vóór de komst naar Nederland hebben ingestemd met
      het vertrek van de vreemdeling en met de opneming van het kind ter adoptie in het gezin van de referent.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.4
    text: |-
      De referent van een minderjarige vreemdeling die als pleegkind in Nederland verblijft of wil verblijven in het
      kader van verblijf als familie- of gezinslid, neemt met betrekking tot de vreemdeling wiens referent hij is of was
      in de administratie op:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.4.a
    text: de gelegaliseerde bescheiden waaruit de familierechtelijke relatie tussen de vreemdeling en referent blijkt;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.4.b
    text: |-
      de gelegaliseerde bescheiden waaruit blijkt dat de ouder(s) of wettelijk vertegenwoordiger(s) alsmede, indien het
      recht van het land van herkomst dit vereist, de autoriteiten van het land van herkomst, instemmen met het verblijf
      van het kind in het gezin van de referent;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.4.c
    text: bewijsstukken waaruit blijkt dat de referent zelfstandig en duurzaam beschikt over voldoende middelen van bestaan;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.4.d
    text: de gelegaliseerde bescheiden waaruit blijkt dat de referent het gezag heeft over het kind.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.5
    text: 'Van het vereiste van legalisatie zijn vrijgesteld:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.5.a
    text: |-
      stukken die vallen onder een verdrag dat voorziet in vrijstelling of afschaffing van legalisatie en die afkomstig
      zijn uit een land dat partij is bij het betreffende verdrag;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.5.b
    text: |-
      afschriften en uittreksels van akten van de burgerlijke stand, opgemaakt en afgegeven in Indonesië, Nieuw Guinea
      of Suriname, voordat deze landen op 27 december 1949, 1 oktober 1962 onderscheidenlijk 25 november 1975 de
      onafhankelijkheid verkregen; en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: 4.38.5.c
    text: |-
      uit het buitenland afkomstige stukken, overgelegd door een in Nederland woonachtig persoon die met betrekking
      tot hetzelfde rechtsfeit reeds eerder een gelegaliseerd stuk heeft overgelegd dat de basis heeft gevormd voor
      het opmaken van een akte van de burgerlijke stand in Nederland of voor de opname van gegevens over de betreffende
      persoon in de BRP, voorzover het later overgelegde niet-gelegaliseerde stuk inhoudelijk overeenstemt met de op
      grond van het eerder overgelegde gelegaliseerde stuk in de akte of in de BRP opgenomen gegevens en het latere stuk
      overeenstemt met het gelegaliseerde stuk.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.38
  - number: '4.39'
    text: |-
      Bewijsstukken als bedoeld in [4.38, eerste lid, onder e en vierde lid, onder c][ref1], zijn:


