    text: 'indien de referent beschikt over inkomen uit arbeid in loondienst:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.a.1°
    text: een afschrift van de arbeidsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.a.2°
    text: een recente werkgeversverklaring voorzien van datum, handtekening van de werkgever en firmastempel, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.a.3°
    text: afschriften van loonstroken over de drie maanden direct voorafgaand aan de aanvraag;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.b
    text: |-
      indien de referent beschikt over middelen van bestaan als bedoeld in
      [artikel 3.75, derde lid, van het Besluit][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 4.39.b.1°
    text: de bewijsstukken genoemd onder a;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.b.2°
    text: |-
      afschriften van arbeids- of uitzendovereenkomsten van de drie jaren voorafgaand aan het tijdstip waarop de aanvraag
      is ontvangen of de beschikking wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.b.3°
    text: |-
      afschriften van jaaropgaven over de drie jaren voorafgaand aan de datum van indiening van de aanvraag om verlening
      van de verblijfsvergunning, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.b.4°
    text: |-
      voor zover van toepassing uitkeringsbeschikkingen en specificaties over de drie jaren voorafgaand aan de datum van
      de aanvraag om verlening van de verblijfsvergunning;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.c
    text: |-
      indien de referent beschikt over middelen van bestaan als bedoeld in [artikel 3.24b][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 4.39.c.1°
    text: de bewijsstukken genoemd onder a;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.c.2°
    text: |-
      afschriften van arbeids- of uitzendovereenkomsten van het jaar voorafgaand aan het tijdstip waarop de aanvraag is
      ontvangen of de beschikking wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.c.3°
    text: |-
      afschriften van jaaropgaven over het jaar voorafgaand aan de datum van indiening van de aanvraag om verlening van
      de verblijfsvergunning, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.c.4°
    text: |-
      voor zover van toepassing uitkeringsbeschikkingen en specificaties over het jaar voorafgaand aan de datum van de
      aanvraag om verlening van de verblijfsvergunning;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.d
    text: 'indien de referent beschikt over inkomen als zelfstandige:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.d.1°
    text: een verklaring inkomen van een gevestigde ondernemer, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.d.2°
    text: |-
      een uittreksel van de Kamer van Koophandel, voor zover inschrijving van de zelfstandig ondernemer op grond van de
      [Handelsregisterwet 2007][ref1] is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: 4.39.e
    text: 'indien de referent naar het oordeel van de Minister blijvend en volledig arbeidsongeschikt is:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.e.1°
    text: |-
      de toekenningsbeschikking van de uitkerende instantie ingevolge de
      [Wet op de Arbeidsongeschiktheidsverzekering][ref1], de [Wet arbeidsongeschiktheid zelfstandigen][ref2],
      de [Wet werk en inkomen naar arbeidsvermogen][ref3] of de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4] waaruit blijkt dat de referent volledig
      arbeidsongeschikt is, en


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0008657
  - number: 4.39.e.2°
    text: de uitkeringsspecificaties;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.f
    text: 'indien de referent blijvend niet in staat is aan de plicht tot arbeidsinschakeling te voldoen:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.f.1°
    text: |-
      alle toekenningsbesluiten ingevolge de [Participatiewet][ref1] die betrekking hebben op de vijf jaar voorafgaand
      aan het tijdstip waarop de aanvraag is ontvangen of de beschikking wordt gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 4.39.f.2°
    text: |-
      voor zover van toepassing correspondentie met het college van burgemeester en wethouders omtrent ontheffing van
      de plicht tot arbeidsinschakeling, die betrekking heeft op de vijf jaar voorafgaand aan het tijdstip waarop de
      aanvraag is ontvangen of de beschikking wordt gegeven, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.f.3°
    text: |-
      voor zover van toepassing bescheiden waaruit blijkt dat een arbeidsinschakeling binnen een jaar niet te verwachten
      valt;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.g
    text: 'indien de referent beschikt over inkomen uit eigen vermogen:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.g.1°
    text: de laatst afgegeven definitieve aanslag Inkomstenbelasting afgegeven door de rijksbelastingdienst;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.g.2°
    text: de laatst afgegeven voorlopige aanslag Inkomstenbelasting afgegeven door de rijksbelastingdienst;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.g.3°
    text: de meest recente aangifte Inkomstenbelasting aan de rijksbelastingdienst;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.39.g.4°
    text: |-
      bescheiden waaruit het eigen vermogen op het moment van de indiening van de aanvraag om verlening van de
      verblijfsvergunning blijkt.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.39
  - number: 4.41.1
    text: |-
      De referent of de gewezen referent houdt de administratie ter plaatse waar hij in Nederland kantoor houdt, dan wel
      ter plaatse waar hij in Nederland een vaste inrichting voor de uitoefening van zijn bedrijf of beroep heeft, of ter
      plaatse waar hij woont of gevestigd is. Bij gebreke aan een van vorenstaande plaatsen houdt hij de administratie
      onder zijn berusting. De referent doet bij het model, bedoeld in [artikel 2a, derde lid, van de Wet][ref1], opgave
      van de plaats waar de administratie wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2a
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.41
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2a
  - number: 4.41.2
    text: |-
      Indien het adres ter plaatse waar de administratie wordt gevoerd, wijzigt, doet de referent binnen twee weken
      melding van het nieuwe adres aan de Minister.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.41
  - number: 4.41.3
    text: |-
      De referent of gewezen referent verstrekt schriftelijk op verzoek van de Minister de gegevens of bescheiden binnen
      een periode van vier weken na ontvangst van het daartoe strekkend verzoek, of, indien dit redelijkerwijs niet
      mogelijk is, binnen een door de Minister te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.41
  - number: 4.41.4
    text: In bijzondere gevallen kan de Minister de in het derde lid bedoelde termijn verkorten.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.41
  - number: '4.42'
    text: |-
      Indien de referent of gewezen referent niet aan de op hem ingevolge [artikel 4.53 van het Besluit][ref1] rustende
      verplichtingen kan voldoen, stelt hij de Minister daarvan binnen vier weken op de hoogte, alsmede van de redenen
      daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.42
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
  - number: '5.1'
    text: |-
      Indien de korpschef of de Commandant der Koninklijke marechaussee de bevoegdheid, bedoeld in
      [artikel 50, vierde lid, van de Wet][ref1], mandateert, doet hij dat niet dan aan een ambtenaar, belast met het
      toezicht op vreemdelingen, die tevens hulpofficier van justitie is, of aan de ambtenaar met ter zake voldoende
      kennis en kunde van politie of van de Koninklijke marechaussee die daartoe is aangewezen door de korpschef,
      respectievelijk de Commandant der Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel50
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '50'
  - number: '5.2'
    text: |-
      De maatregel, bedoeld in [artikel 56, eerste lid, van de Wet][ref1], wordt opgelegd, gewijzigd en opgeheven
      door de ambtenaar bedoeld in [artikel 47, eerste lid, onder a en b, van de Wet][ref2], die tevens hulpofficier
      van justitie is, door de ambtenaar van politie met ter zake voldoende kennis en kunde die daartoe is aangewezen
      door de korpschef, of door de ambtenaar van de Dienst Terugkeer en Vertrek en de ambtenaar van de Immigratie- en
      Naturalisatiedienst die daartoe bevoegd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel47
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '47'
  - number: 5.3.1
    text: |-
      De maatregel, bedoeld in [artikel 59][ref1], [59a][ref2] of [59b van de Wet][ref3], wordt opgelegd en opgeheven
      door de ambtenaar bedoeld in [artikel 47, eerste lid, onder a en b, van de Wet][ref4], die tevens hulpofficier
      van justitie is, door de ambtenaar met ter zake voldoende kennis en kunde van politie of van de Koninklijke
      marechaussee die daartoe is aangewezen door de korpschef, respectievelijk de Commandant der Koninklijke
      marechaussee, of door de daartoe door de Minister aangewezen ambtenaar van de Dienst Terugkeer en Vertrek of de
      Immigratie- en Naturalisatiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel59a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel59b
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel47
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 59a
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 59b
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '47'
  - number: 5.3.2
    text: |-
      De maatregel, bedoeld in [artikel 59][ref1] of [59a van de Wet][ref2], wordt gewijzigd en opgeheven door
      de ambtenaar van Dienst Terugkeer en Vertrek, die daartoe bevoegd is, of door de ambtenaar bedoeld in
      [artikel 47, eerste lid, onder a en b, van de Wet][ref3] die tevens hulpofficier van justitie is of door de
      ambtenaar met ter zake voldoende kennis en kunde van politie of van de Koninklijke marechaussee die daartoe is
      aangewezen door de korpschef, respectievelijk de Commandant der Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel59a
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel47
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 59a
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '47'
  - number: 5.3.3
    text: |-
      De maatregel, bedoeld in [artikel 59, eerste lid, van de Wet][ref1], wordt verlengd als bedoeld in artikel 59,
      zesde lid, van de Wet, door de ambtenaar van de Dienst Terugkeer en Vertrek die daartoe bevoegd is, of door
      de ambtenaar, bedoeld in [artikel 47, eerste lid, onder a of b, van de Wet][ref2], die tevens hulpofficier
      van justitie is of door de ambtenaar met ter zake voldoende kennis en kunde van politie of van de Koninklijke
      marechaussee die daartoe is aangewezen door de korpschef, respectievelijk de Commandant der Koninklijke
      marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel47
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '47'
  - number: '5.4'
    text: |-
      De ambtenaren genoemd in [artikel 5.3, eerste lid][ref1], zijn bevoegd tot het nemen van het besluit, bedoeld
      in [artikel 5.5, eerste lid, van het Besluit][ref2] en tot het doen van de kennisgeving, bedoeld in artikel 5.5,
      tweede lid, van het Besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel5
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '5'
  - number: 6.1.1
    text: |-
      De ambtenaren belast met de grensbewaking of met het toezicht op vreemdelingen zijn bevoegd tot uitzetting of
      overdracht over te gaan en daartoe alle benodigde handelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.1
  - number: 6.1.2
    text: |-
      De ambtenaren, bedoeld in het eerste lid, gaan niet dan ingevolge een bijzondere aanwijzing van de Minister over
      tot uitzetting of overdracht van de vreemdeling die te kennen geeft dat hij asiel wenst.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.1
  - number: 6.1a
    text: |-
      [Artikel 6.1c van het Besluit][ref1] is niet van toepassing op de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel6
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.1a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '6'
  - number: 6.1a.a
    text: wiens vrijheid rechtens is ontnomen;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.1a
  - number: 6.1a.b
    text: die door de Minister is geïnformeerd over de datum van de vlucht ter fine van zijn verwijdering;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.1a
  - number: 6.1a.c
    text: |-
      tegen wie de Minister het overdrachtsbesluit, bedoeld in de [artikelen 44a][ref1] en [62b van de Wet][ref2], heeft
      uitgevaardigd en die in afwachting is van de overdracht naar de verantwoordelijke lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel44a
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel62b
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 44a
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 62b
  - number: '6.2'
    text: |-
      De korpschef en de Commandant der Koninklijke marechaussee zijn bevoegd de kosten van verwijdering te verhalen op
      de vreemdeling of op een vervoersonderneming.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.2
  - number: 6.2a
    text: |-
      De hoogte van de kosten van uitzetting worden vastgesteld aan de hand van de kostensoort vermeld in kolom A
      van [bijlage 22][ref1] bij deze regeling en de bijbehorende tarieven vermeld in kolom B van bijlage 22 bij deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.2a
    references:
      - id: ref1
        bwb_id: BWBR0012002
  - number: 6.3.1
    text: |-
      De verlenging, bedoeld in [artikel 62, derde lid, van de Wet][ref1], van de vertrektermijn, bedoeld in artikel 62,
      eerste lid, van de Wet, vindt uitsluitend plaats indien de vreemdeling ervoor zorg heeft gedragen dat de voor zijn
      vertrek uit eigen beweging noodzakelijke bescheiden voorhanden zijn dan wel binnen korte termijn voorhanden zullen
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '62'
  - number: 6.3.2
    text: De verlenging van de vertrektermijn bedraagt maximaal 90 dagen.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.3
  - number: 6.3.3
    text: |-
      In afwijking van het tweede lid, kan de vertrektermijn met ten hoogste zes maanden worden verlengd indien de duur
      van het aan de vreemdeling verleende visum niet kan worden verlengd en zijn aanwezigheid in Nederland noodzakelijk
      is voor de goede uitvoering van de procedure voor het Internationale Strafhof, het Speciale Tribunaal voor Libanon,
      het Internationaal Joegoslavië Tribunaal, het Speciale Hof voor Sierra Leone, het Kosovo Relocated Specialist
      Judicial Institution, dan wel het Internationaal Residumechanisme voor Straftribunalen.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.3
  - number: 6.3.4
    text: |-
      Bij het besluit omtrent verlenging van de vertrektermijn worden onder meer de aanwezigheid van schoolgaande
      kinderen of het bestaan van andere gezinsbanden en sociale banden betrokken.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.3
  - number: 6.3.5
    text: |-
      Het verzoek om de vertrektermijn te verlengen, wordt in persoon ingediend bij de ambtenaar belast met het
      begeleiden van de terugkeer of het loket van de IND.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.3
  - number: 6.4.1
    text: |-
      De kennisgeving, bedoeld in [artikel 62a, eerste lid, van de Wet][ref1], wordt gegeven door de daartoe
      bevoegde ambtenaar van de Immigratie- en Naturalisatiedienst, de daartoe bevoegde ambtenaar van de Dienst
      Terugkeer en Vertrek of de ambtenaar, bedoeld in [artikel 2, onder b, van de Politiewet 2012][ref2],
      die is aangewezen als buitengewoon opsporingsambtenaar en belast is met de uitvoering van wettelijke
      voorschriften gesteld bij of krachtens de [Vreemdelingenwet 2000][ref3], dan wel door de ambtenaar, bedoeld in
      [artikel 47, eerste lid, onder a of b, van de Wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62a
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011825
      [ref4]: https://wetten.overheid.nl/BWBR0011823#Artikel47
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 62a
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0011825
      - id: ref4
        bwb_id: BWBR0011823
        artikel: '47'
  - number: 6.4.2
    text: |-
      Indien de kennisgeving, bedoeld in [artikel 62a, eerste lid, van de Wet][ref1], wordt gegeven, wordt de vreemdeling
      in een taal die de vreemdeling begrijpt of redelijkerwijze geacht mag worden te begrijpen mondeling of schriftelijk
      op de inhoud en de rechtsgevolgen daarvan gewezen, en wordt de vreemdeling gewezen op de mogelijkheid daartegen
      rechtsmiddelen aan te wenden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel62a
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 62a
  - number: 6.5.1
    text: |-
      Het inreisverbod, bedoeld in [artikel 66a van de Wet][ref1], wordt uitgevaardigd, gewijzigd of opgeheven door de
      daartoe bevoegde ambtenaar van de Immigratie- en Naturalisatiedienst, de daartoe bevoegde ambtenaar van de Dienst
      Terugkeer en Vertrek of de ambtenaar, bedoeld in [artikel 47, eerste lid, onder a en b, van de Wet][ref2], die
      tevens hulpofficier van justitie is, of door de ambtenaar met ter zake voldoende kennis en kunde van politie of
      van de Koninklijke marechaussee die daartoe is aangewezen door de korpschef, respectievelijk de Commandant der
      Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel66a
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel47
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 66a
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '47'
  - number: 6.5.2
    text: |-
      Het inreisverbod wordt uitgevaardigd, gewijzigd of opgeheven door de ambtenaar van de Immigratie-
      en Naturalisatiedienst die daartoe bevoegd is, indien daaraan de rechtgevolgen, bedoeld in
      [artikel 66a, zevende lid, van de Wet][ref1], zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel66a
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 66a
  - number: 6.5.3
    text: |-
      Indien het inreisverbod wordt uitgevaardigd, wordt in een taal die de vreemdeling begrijpt of redelijkerwijze
      geacht mag worden te begrijpen mondeling of schriftelijk op de inhoud en de rechtsgevolgen daarvan gewezen, en
      wordt de vreemdeling gewezen op de mogelijkheid daartegen rechtsmiddelen aan te wenden.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.5
  - number: 6.6.1
    text: |-
      Het inreisverbod wordt ambtshalve opgeheven indien door of namens de vreemdeling tegen wie het inreisverbod
      is uitgevaardigd een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref1] is aangevraagd en
      door de Immigratie- en Naturalisatiedienst is vastgesteld dat de vreemdeling voor verlening van de gevraagde
      verblijfsvergunning in aanmerking komt, indien het betreft een vergunning die verband houdt met een beperking als
      bedoeld in [artikel 3.4, eerste lid, onder a tot en met e, g, j, m, n, q en s, van het Besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 6.6.2
    text: |-
      Het eerste lid is niet van toepassing op de vreemdeling tegen wie een inreisverbod is uitgevaardigd waaraan de
      rechtgevolgen, bedoeld in [artikel 66a, zevende lid, van de Wet][ref1], zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel66a
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 66a
  - number: 6.6.3
    text: |-
      Het inreisverbod wordt ambtshalve opgeheven indien uit een door Nederland aangegane verdragsrechtelijke
      verplichting volgt dat aan de vreemdeling een verblijfsvergunning dient te worden verleend.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel6.6
  - number: 7.1.1
    text: |-
      Het bestuursorgaan of orgaan als bedoeld in [artikel 107 van de Wet][ref1], dat de Minister met toepassing van
      [artikel 8.1, derde lid, van het Besluit][ref2] vraagt om onverwijld nadere gegevens over de verblijfsrechtelijke
      positie van de vreemdeling te verstrekken, maakt daarvoor gebruik van het formulier van het in [bijlage 17a][ref3]
      bij deze regeling aangeduide model. Op dit formulier wordt tevens aangegeven om welke reden onduidelijkheid bestaat
      over de verblijfsrechtelijke positie van de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0012002
  - number: 7.1.2
    text: |-
      De verstrekking van de nadere gegevens over de verblijfsrechtelijke positie van een vreemdeling aan de
      in het eerste lid bedoelde bestuursorgaan, vindt plaats door gebruikmaking van het formulier van het in
      [bijlage 17b][ref1] bij deze regeling aangeduide model.


      [ref1]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0012002
  - number: 7.1.3
    text: |-
      Bij het vragen van gegevens omtrent de toekenning of beëindiging van een verstrekking, voorziening,
      uitkering, ontheffing of vergunning bij het in het eerste lid bedoelde bestuursorgaan of orgaan op grond
      van [artikel 8.2, eerste lid, van het Besluit][ref1], wordt gebruik gemaakt van het formulier van het in
      [bijlage 17c][ref2] van deze regeling aangeduide model.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0012002
  - number: 7.1.4
    text: |-
      Het in het eerste lid bedoelde bestuursorgaan of orgaan dat de Minister desgevraagd of uit eigen beweging op
      grond van [artikel 8.2, tweede of derde lid, van het Besluit][ref1], gegevens verstrekt omtrent de toekenning of
      beëindiging van een verstrekking, voorziening, uitkering, ontheffing of vergunning, maakt daarvoor gebruik van het
      formulier van het in [bijlage 17d][ref2] bij deze regeling aangeduide model.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0012002
  - number: 7.1a.1
    text: |-
      De verwerking van bijzondere categorieën van persoonsgegevens en persoonsgegevens van strafrechtelijke aard als
      bedoeld in [artikel 107a, eerste lid, van de Wet][ref1] is noodzakelijk:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107a
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 107a
  - number: 7.1a.1.a
    text: |-
      voor de beoordeling van het bij een aanvraag om een verblijfsvergunning als bedoeld in de [artikelen 14][ref1]
      en [20 van de Wet][ref2] beoogde verblijfsdoel, voor de beoordeling van een aanvraag om verlenging van de
      geldigheidsduur alsmede voor de beoordeling van de algemene weigeringsgronden of intrekkingsgronden van de
      verblijfsvergunning en ambtshalve beoordelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 7.1a.1.b
    text: |-
      voor het beoordelen van een aanvraag om een verblijfsvergunning als bedoeld in de [artikelen 28][ref1] en
      [33 van de Wet][ref2], voor de beoordeling van een aanvraag om verlenging van de geldigheidsduur alsmede voor de
      beoordeling van de algemene weigeringsgronden of intrekking van de verblijfsvergunning en ambtshalve beoordelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
