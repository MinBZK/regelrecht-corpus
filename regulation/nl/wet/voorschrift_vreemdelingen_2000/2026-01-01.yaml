        artikel: '108'
  - number: 7.1i
    text: |-
      Als bestand in de vreemdelingenadministratie, bedoeld in [artikel 8.29, eerste lid, van het Besluit][ref1], is
      aangewezen de Basisvoorziening vreemdelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1i
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
  - number: 7.1j
    text: |-
      De vreemdeling van wie is vastgesteld dat de vingers niet blijvend fysiek beschadigd zijn, wordt uitgenodigd om op
      een tijdstip, gelegen uiterlijk binnen een jaar na de vaststelling, opnieuw zijn vingerafdrukken te laten afnemen.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1j
  - number: 7.1k
    text: |-
      Als documenten, bedoeld in [artikel 8.32, eerste lid, van het Besluit][ref1], zijn aangewezen de documenten,
      bedoeld in [artikel 3.3, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012002#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1k
    references:
