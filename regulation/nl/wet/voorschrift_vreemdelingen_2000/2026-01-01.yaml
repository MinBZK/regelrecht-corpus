  - number: 3.16.2
    text: |-
      Bij een beroep op [artikel 3.80a, derde lid][ref1], of [artikel 3.96a, derde lid, van het Besluit][ref2]
      overlegt de aanvrager de deskundigenverklaring als bedoeld in
      [artikel 2.7, eerste lid, van het Besluit inburgering 2021 ][ref3]of het advies als bedoeld in
      [artikel 2.8, eerste lid, van het Besluit inburgering][ref4], zoals dat besluit luidde onmiddellijk voorafgaand
      aan de inwerkingtreding van het [Besluit inburgering 2021][ref5], dat niet ouder is dan zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0045555#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0045555
