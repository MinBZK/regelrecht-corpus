        artikel: '3'
  - number: 7.1a.1.i
    text: |-
      bij de uitoefening van de bevoegdheid tot het uitzetten van een vreemdeling als bedoeld in
      [artikel 6.1a van het Besluit][ref1], daaronder begrepen de verwerking van bijzondere gegevens in het kader van de
      beoordeling of de uitzetting achterwege dient te blijven als bedoeld in [artikel 64 van de Wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel64
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '64'
  - number: 7.1a.1.j
    text: |-
      voor de beoordeling van de voorwaarden voor de erkenning als referent, bedoeld in [artikel 2c van de Wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
  - number: 7.1a.1.k
    text: |-
      voor de beoordeling van de gronden voor het uitvaardigen van een inreisverbod tegen een vreemdeling en de opheffing
      of tijdelijke opheffing van het inreisverbod.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1a
  - number: 7.1a.2
    text: |-
      De bijzondere categorieën van persoonsgegevens en persoonsgegevens van strafrechtelijke aard worden ten behoeve
      van de in het eerste lid bedoelde doeleinden opgenomen in documenten die in een persoonsgebonden dossier en in een
      geautomatiseerd bestand worden neergelegd. De gegevens in het geautomatiseerde bestand worden gebruikt voor het
      opstellen van beschikkingen.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1a
  - number: 7.1b.1
    text: |-
      Voorzover de bijzondere categorieën van persoonsgegevens en persoonsgegevens van strafrechtelijke aard zijn
      opgeslagen in de vreemdelingenadministratie, wordt dit bestand beveiligd tegen ongeautoriseerd gebruik door:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1b
  - number: 7.1b.1.a
    text: |-
      het toekennen van autorisaties aan alleen die personen, die voor het uitoefenen van hun taak toegang tot de
      opgeslagen informatie moeten hebben;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1b
  - number: 7.1b.1.b
    text: het bewaren van een reservebestand op een voor niet-geautoriseerde personen ontoegankelijke plaats.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1b
  - number: 7.1b.2
    text: |-
      De autorisaties als bedoeld in het eerste lid worden toegekend aan medewerkers van de Immigratie-
      en Naturalisatiedienst (IND) en de Dienst Terugkeer en Vertrek en de ambtenaren, bedoeld in de
      [artikelen 46 tot en met 48 van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel46
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '46'
  - number: 7.1b.3
    text: |-
      De Minister stelt richtlijnen op voor het verwerken van bijzondere categorieën van persoonsgegevens en
      persoonsgegevens van strafrechtelijke aard in het geautomatiseerde systeem.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1b
  - number: 7.1c.1
    text: |-
      Bijzondere categorieën van persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in
      [artikel 107a, eerste lid, van de Wet][ref1] kunnen worden verstrekt aan de volgende derde personen en instanties:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107a
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 107a
  - number: 7.1c.1.a
    text: |-
      de Minister van Buitenlandse Zaken of door de Minister van Buitenlandse Zaken voorgedragen onderzoekers of
      onderzoeksbureaus, voor het verrichten van onderzoek in het buitenland op verzoek van de Minister alsmede ten
      behoeve van de beoordeling van visumaanvragen;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1c
  - number: 7.1c.1.b
    text: |-
      artsen, voor het beoordelen van de gezondheidstoestand van de vreemdeling op basis van de door de vreemdeling
      ondertekende toestemmingsverklaring, alsmede de overdracht van medische gegevens van een vreemdeling in het kader
      van uitzetting.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1c
  - number: 7.1c.2
    text: |-
      De verstrekking van bijzondere categorieën van persoonsgegevens en persoonsgegevens van strafrechtelijke aard aan
      de in het eerst lid genoemde personen geschiedt op geen andere wijze dan schriftelijk.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1c
  - number: 7.1d.1
    text: |-
      De onverenigbare verwerking van bijzondere categorieën van persoonsgegevens en persoonsgegevens van
      strafrechtelijke aard wordt op de volgende wijze tegengegaan:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1d
  - number: 7.1d.1.a
    text: |-
      de toegang tot de gegevens in het persoonsgebonden dossier en het geautomatiseerde bestand is voorbehouden aan die
      personen, die voor het uitoefenen van hun taak, bedoeld in de [artikelen 7.1a][ref1] en [7.1c][ref2] toegang tot de
      informatie moeten hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012002#Artikel7
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1d
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0012002
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.1d.1.b
    text: |-
      de verwerkingsverantwoordelijke stelt een Functionaris voor de Gegevensbescherming aan, die toeziet op de naleving
      van de Algemene verordening gegevensbescherming;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1d
  - number: 7.1d.1.c
    text: |-
      de verwerkingsverantwoordelijke verricht integriteits- en kwaliteitsaudits ten aanzien van de verwerking van de
      persoonsgegevens en rapporteert deze aan de Functionaris voor de Gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1d
  - number: 7.1d.2
    text: |-
      De vernietiging van de gezichtsopnames en vingerafdrukken na afloop van de bewaartermijn, bedoeld in
      [artikel 8.35 van het Besluit][ref1], en de verwijdering en de vernietiging van de gezichtsopname en
      vingerafdrukken op verzoek van de vreemdeling, op grond dat deze de hoedanigheid heeft gekregen van
      gemeenschapsonderdaan anders dan door verkrijging van het Nederlanderschap, geschiedt op de wijze als
      voorgeschreven in artikel 8 van de Wbp-regeling Basisvoorziening vreemdelingen en paragraaf 8.2 van het Protocol
      Identificatie en Labeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1d
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
