  - number: 7.2a.1
    text: |-
      Indien de vreemdeling, bedoeld in [artikel 8.7, eerste lid, van het Besluit][ref1], zich aanmeldt voor inschrijving
      in de vreemdelingenadministratie, legt hij de volgende gegevens en bescheiden over:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
  - number: 7.2a.1.a
    text: een geldige identiteitskaart of een geldig paspoort;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2a
  - number: 7.2a.1.b
    text: |-
      voor zover hij in Nederland verblijft als werknemer: een werkgeversverklaring of arbeidsovereenkomst waaruit blijkt
      dat hij in Nederland reële en daadwerkelijke arbeid verricht anders dan louter marginaal en bijkomstig van aard;.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2a
  - number: 7.2a.1.c
    text: |-
      voor zover hij in Nederland verblijft als zelfstandige: een bewijs van inschrijving in het handelsregister en
      bewijs waaruit blijkt dat hij in Nederland reële en daadwerkelijke arbeid verricht anders dan louter marginaal
      en bijkomstig van aard, zoals een daartoe strekkende balans, winst- of verliesrekening, maandelijkse opgaven van
      bedrijfsresultaten of, als de genoemde bewijsstukken nog niet aanwezig zijn, verklaring of prognose, opgesteld door
      een accountant of financieel adviseur;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2a
  - number: 7.2a.1.d
    text: |-
      voor zover hij in Nederland verblijft als student: een bewijs van inschrijving voor een opleiding, bedoeld in
      [artikel 8.12, eerste lid, onder c, van het Besluit][ref1], een verklaring of een gelijkwaardig middel naar zijn
      keuze waaruit blijkt hij beschikt over voldoende middelen van bestaan en een bewijs van een verzekering die de
      ziektekosten in Nederland volledig dekt;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
  - number: 7.2a.1.e
    text: |-
      voor zover hij in Nederland verblijft als economisch niet-actieve: een bewijsstuk waaruit blijkt dat wordt beschikt
      over toereikende bestaansmiddelen om te voorkomen dat de vreemdeling tijdens het verblijf ten laste komt van de
      algemene middelen en een bewijs van een verzekering die de ziektekosten in Nederland volledig dekt.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2a
  - number: 7.2a.2
    text: |-
      Indien de vreemdeling, bedoeld in [artikel 8.7, tweede, derde of vierde lid, van het Besluit][ref1], die de
      nationaliteit bezit van een staat als bedoeld in het eerste lid van dat artikel, zich aanmeldt voor inschrijving in
      de vreemdelingenadministratie, legt hij de volgende gegevens en bescheiden over:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
  - number: 7.2a.2.a
    text: een geldige identiteitskaart of een geldig paspoort;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2a
  - number: 7.2a.2.b
    text: |-
      de verklaring van inschrijving van de vreemdeling, bedoeld in [artikel 8.7, eerste lid, van het Besluit][ref1], bij
      wie hij in Nederland verblijft;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
  - number: 7.2a.2.c
    text: |-
      een document waaruit de familierechtelijke relatie of duurzame relatie blijkt met de vreemdeling, bedoeld onder
      b; en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2a
  - number: 7.2a.2.d
    text: |-
      voor zover hij in Nederland verblijft als familielid als bedoeld in
      [artikel 8.7, tweede lid, onder c of d, van het Besluit][ref1]: bewijs dat hij een dergelijk familielid is;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
  - number: 7.2a.2.e
    text: |-
      voor zover hij in Nederland verblijft als familielid als bedoeld in
      [artikel 8.7, derde lid, van het Besluit][ref1]: een door de bevoegde instantie van het land van herkomst afgegeven
      verklaring dat hij ten laste komt van of inwoont bij de vreemdeling, bedoeld onder b, onderscheidenlijk bewijs van
      ernstige gezondheidsredenen die de persoonlijke zorg door die vreemdeling noodzakelijk maken;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
  - number: 7.2a.2.f
    text: |-
      voor zover hij in Nederland verblijft als partner als bedoeld in [artikel 8.7, vierde lid, van het Besluit][ref1]:
      een relatieverklaring als bedoeld in bijlage 23 bij deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
  - number: 7.2a.2.g
    text: |-
      voor zover hij in Nederland verblijft als rechtstreekse bloedverwant in de neergaande
      lijn, jonger dan 18 jaar, van een partner als bedoeld onder f: bewijs dat is voldaan aan de
      [artikelen 3.13 tot en met 3.22 van het Besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 7.2b
    text: |-
      Een op het tijdstip van inwerkingtreding van de [Wet modern migratiebeleid][ref1] geldige verblijfsvergunning,
      verleend onder een beperking als genoemd in kolom A, wordt vanaf dat tijdstip aangemerkt als een
      verblijfsvergunning, verleend onder een beperking als genoemd in kolom B:






                  A


                  B






                  Beschikking conform minister op grond van B20 Vc 2000 eergerelateerd geweld


                  Tijdelijke humanitaire gronden




                  Beschikking conform minister op grond van B20 Vc 2000 huiselijk geweld


                  Tijdelijke humanitaire gronden




                  Beschikking conform minister op grond van [B9/12 Vc 2000](onbekend) slachtoffer van mensenhandel


                  Tijdelijke humanitaire gronden




                  Beschikking conform minister op grond van [B19 Vc 2000](onbekend) verblijf op religieuze of
      levensbeschouwelijke gronden


                  Arbeid in loondienst




                  Beschikking conform minister op grond van [B7/5](onbekend) Europees vrijwilligerswerk


                  Uitwisseling




                  Verblijf in het kader van de [Zetelovereenkomst B12](onbekend)


                  Arbeid in loondienst




                  Overgangsregeling langdurig verblijvende kinderen


                  Niet-tijdelijke humanitaire gronden




                  Definitieve regeling langdurig verblijvende kinderen


                  Niet-tijdelijke humanitaire gronden




                  Verblijf als alleenstaande minderjarige vreemdeling


                  Tijdelijke humanitaire gronden


      [ref1]: https://wetten.overheid.nl/BWBR0027930
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2b
    references:
      - id: ref1
        bwb_id: BWBR0027930
  - number: 7.2c
    text: |-
      Op aanvragen om verlening van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref1], waarbij de
      vreemdeling in het bezit dient te zijn van een machtiging tot voorlopig verblijf, en de aanvraag om de machtiging
      tot voorlopig verblijf is ingediend voor inwerkingtreding van de [Wet modern migratiebeleid][ref2], is het
      processuele recht en het bijbehorende legesbedrag van toepassing zoals dat gold op de dag voor inwerkingtreding van
      de Wet modern migratiebeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0027930
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0027930
  - number: 7.2d
    text: |-
      Een op 1 oktober 2017 geldige verblijfsvergunning voor bepaalde tijd regulier, verleend onder de beperking
      ‘tijdsverloop asiel’, wordt vanaf dat tijdstip aangemerkt als een verblijfsvergunning voor bepaalde tijd regulier,
      verleend onder de beperking verband houdend met niet-tijdelijk humanitaire gronden.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.2d
  - number: '7.3'
    text: Het Voorschrift Vreemdelingen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.3
  - number: '7.4'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de [Wet][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: '7.5'
    text: 'Deze regeling kan worden aangehaald onder de titel: [Voorschrift Vreemdelingen 2000](onbekend).'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.5
