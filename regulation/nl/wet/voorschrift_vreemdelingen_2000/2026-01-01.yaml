  - number: 3.3.3
    text: |-
      De aantekening, bedoeld in het eerste lid, onder d, luidt: ‘verlenging aangevraagd voor een verblijfsvergunning op
      grond van [artikel 14 Vw 2000][ref1] op (datum). TWV niet vereist voor specifieke arbeid, andere arbeid toegestaan
      mits TWV is verleend. Geldig tot (datum), tenzij voor deze datum op voormelde aanvraag is beslist’.


