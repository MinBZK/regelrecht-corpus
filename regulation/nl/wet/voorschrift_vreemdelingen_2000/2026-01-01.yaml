  - number: 3.19.2
    text: |-
      Voor degene die het verblijf in Nederland financiert van een vreemdeling die in Nederland verblijft
      of wil verblijven in het kader van uitwisseling, voor zover de vreemdeling als au pair verblijft of
      wil verblijven of van medische behandeling, zijn de middelen van bestaan in ieder geval voldoende,
      indien de in het eerste lid bedoelde som ten minste gelijk is aan het in het eerste lid of
      [artikel 3.74, eerste lid, onderdeel a, van het Besluit][ref1] bedoelde bedrag voor de categorie waartoe die
      persoon behoort, aangevuld met 50 procent van het in het eerste lid bedoelde minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.19.3
    text: |-
      Voor degene die het verblijf in Nederland financiert van een vreemdeling die in Nederland
      verblijft of wil verblijven in het kader van studie, zijn de middelen van bestaan voldoende,
      indien de in het eerste lid bedoelde som ten minste gelijk is aan het normbedrag voor uitwonende
      studenten, bedoeld in de [Wet op de Studiefinanciering 2000][ref1], aangevuld met het eerste lid of
      [artikel 3.74, eerste lid, onderdeel a, van het Besluit][ref2] bedoelde bedrag voor de categorie waartoe de persoon
      behoort die het verblijf financiert.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.19.4
    text: |-
      Voor degene die het verblijf in Nederland financiert van een vreemdeling die in Nederland verblijft of wil
      verblijven in het kader van medische behandeling en van zijn gezinsleden, zijn de middelen van bestaan in ieder
      geval voldoende, indien de in het eerste lid bedoelde som ten minste gelijk is aan het in het eerste lid of
      [artikel 3.74, eerste lid, onderdeel a, van het Besluit][ref1] bedoelde bedrag voor de categorie waartoe die
      persoon behoort, aangevuld met:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.19.4.a
    text: |-
      90 procent van het in het eerste lid bedoelde minimumloon in het geval dat hij het verblijf van de vreemdeling die
      alleenstaande ouder is financiert of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.19
  - number: 3.19.4.b
    text: 100 procent in het geval dat de derde het verblijf van een gezin financiert.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.19
  - number: 3.20.1
    text: |-
      Middelen van bestaan uit arbeid als zelfstandige zijn eerst duurzaam, indien zij gedurende ten minste anderhalf
      jaar zijn verworven en nog een jaar beschikbaar zijn op het tijdstip waarop de aanvraag is ontvangen of de
      beschikking wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20
  - number: 3.20.2
    text: |-
      Het eerste lid is niet van toepassing, indien de aanvraag strekt tot het verlenen van een verblijfsvergunning als
      bedoeld in [artikel 14 van de Wet][ref1] onder een beperking verband houdend met het verrichten van arbeid als
      zelfstandige.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.20.3
    text: |-
      Indien de aanvraag strekt tot het verlengen van een verblijfsvergunning als bedoeld in
      [artikel 14 van de Wet][ref1] onder een beperking verband houdend met het verrichten van arbeid als
      zelfstandige, in het geval deze vergunning direct volgt op een vergunning die is verleend in het kader van
      [artikel 3.30, zesde lid, van het Besluit][ref2], geldt dat middelen van bestaan uit arbeid als zelfstandige
      tevens als duurzaam worden aangemerkt, wanneer de Minister beoordeelt dat de continuïteit en solvabiliteit van
      de onderneming voldoende is gewaarborgd. Voor deze beoordeling wordt advies gevraagd aan de Rijksdienst voor
      Ondernemend Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.20a.1
    text: |-
      Bij de beoordeling van het wezenlijk Nederlands belang, bedoeld in
      [artikel 3.30, eerste lid, onder a, van het Besluit][ref1] betrekt de Minister het advies van de Minister van
      Economische Zaken. De Minister van Economische Zaken baseert zijn advies op het puntenstelsel dat is opgenomen in
      [bijlage 8a][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0012002
  - number: 3.20a.2
    text: |-
      Met de arbeid als zelfstandige is een wezenlijk Nederlands belang gediend, indien aan de vreemdeling met toepassing
      van het puntenstelsel, bedoeld in het eerste lid, ten minste 30 punten worden toegekend voor elk van de drie
      navolgende criteria: diens persoonlijke ervaring, diens ondernemingsplan als voor diens toegevoegde waarde voor de
      Nederlandse economie.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20a
  - number: 3.20a.3
    text: |-
      In afwijking van het tweede lid geldt dat met de arbeid als zelfstandige tevens een wezenlijk Nederlands belang
      is gediend, indien aan de vreemdeling met toepassing van het puntenstel, bedoeld in het eerste lid, minder dan 30
      punten worden toegekend voor diens toegevoegde waarde voor de Nederlandse economie en ten minste 45 punten worden
      toegekend voor diens persoonlijke ervaring en ten minste 45 punten voor diens ondernemingsplan.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20a
  - number: 3.20a.4
    text: |-
      Het puntenstelsel is niet van toepassing op vreemdelingen met de nationaliteit van de Republiek Turkije die
      zelfstandig een beroep of bedrijf uitoefenen. De toetsingscriteria waar de vreemdeling met de nationaliteit
      van de Republiek Turkije die zelfstandig een beroep of bedrijf uitoefent aan moet voldoen zijn opgenomen in
      [bijlage 8aa][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20a
    references:
      - id: ref1
        bwb_id: BWBR0012002
  - number: 3.20a.5
    text: |-
      In afwijking van het eerste tot en met derde lid, betrekt de Minister bij de beoordeling van het wezenlijk
      Nederlands belang bij de arbeid als zelfstandig kunstenaar het advies van de Minister van Onderwijs, Cultuur en
      Wetenschap. De Minister van Onderwijs, Cultuur en Wetenschap baseert zijn advies op het beoordelingskader dat is
      opgenomen in [bijlage 8aaa][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20a
    references:
      - id: ref1
        bwb_id: BWBR0012002
  - number: 3.20b.1
    text: |-
      Verblijf in het kader van arbeid als zelfstandige als bedoeld in [artikel 3.30, zesde lid, van het Besluit][ref1],
      is mogelijk indien de vreemdeling naar het oordeel van Onze Minister beschikt over een betrouwbare deskundige
      begeleider en voldoet aan artikel 3.30, zesde lid, van het Besluit. De beoordeling geschiedt aan de hand van
      [bijlage 8b][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0012002
  - number: 3.20b.2
    text: Het verblijf kan door de vreemdeling of een persoon of rechtspersoon gezamenlijk worden bekostigd.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20b
  - number: 3.20b.3
    text: |-
      Indien het verblijf middels periodieke betalingen wordt bekostigd, zijn middelen van bestaan slechts duurzaam,
      indien naar het oordeel van Onze Minister voldoende zekerheid is verschaft over het ongestoorde verloop van de
      periodieke geldstroom.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20b
  - number: 3.20b.4
    text: |-
      Middelen van bestaan zijn duurzaam, indien deze op het tijdstip waarop de aanvraag is ontvangen of de beschikking
      wordt gegeven, voor een jaar of zoveel korter als het voorgenomen verblijf in Nederland zal duren, beschikbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20b
  - number: 3.20b.5
    text: |-
      Middelen van bestaan zijn eveneens duurzaam, indien op een ten name van de vreemdeling gestelde bankrekening in
      Nederland, dan wel op de bankrekening van de begeleider, een bedrag beschikbaar is, gelijk aan het maandelijkse
      normbedrag, bedoeld in [artikel 3.19, eerste lid][ref1], vermenigvuldigd met twaalf, of zoveel minder als het
      voorgenomen verblijf in Nederland zal duren.


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20b
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 3.20b.6
    text: |-
      De verblijfsvergunning kan worden afgewezen indien de vreemdeling en de begeleider van elkaar bloedverwant zijn tot
      en met de derde graad.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20b
  - number: 3.20c
    text: |-
      Middelen van bestaan zijn duurzaam, indien deze op het tijdstip waarop de aanvraag is ontvangen of de beschikking
      wordt gegeven, voor een jaar of zoveel korter als het voorgenomen verblijf in het kader van een overplaatsing
      binnen een onderneming zal duren, beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20c
  - number: 3.20d
    text: |-
      Een verblijfsvergunning onder een beperking verband houdend met onderzoek in de zin van richtlijn (EU) 2016/801 kan
      worden verleend indien de vreemdeling een gastovereenkomst heeft gesloten met de referent, en daarin is opgenomen:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20d
  - number: 3.20d.a
    text: de titel of het doel van de onderzoeksactiviteit of het onderzoeksgebied;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20d
  - number: 3.20d.b
    text: een verklaring van de vreemdeling dat hij zal trachten de onderzoeksactiviteit volledig uit te voeren;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20d
  - number: 3.20d.c
    text: |-
      een verklaring van de onderzoeksinstelling dat zij de vreemdeling ontvangt met het oog op de voltooiing van het
      onderzoek;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20d
  - number: 3.20d.d
    text: de begindatum en de einddatum of de geschatte duur van de onderzoeksactiviteit;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20d
  - number: 3.20d.e
    text: |-
      informatie over de voorgenomen mobiliteit in een of meerdere tweede lidstaten, indien die mobiliteit op het moment
      van de aanvraag in de eerste lidstaat bekend is;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20d
  - number: 3.20d.f
    text: informatie over de rechtsbetrekking tussen de onderzoeksinstelling en de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20d
  - number: 3.20d.g
    text: informatie over de arbeidsvoorwaarden van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20d
  - number: 3.20e.1
    text: |-
      Onder geldige medewerkersparticipatie als bedoeld in
      [artikel 2.7, eerste lid, onderdeel b, van het Besluit uitvoering Wet arbeid vreemdelingen 2022][ref1] wordt
      verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20e
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
  - number: 3.20e.1.a)
    text: 'aandelen in de onderneming ter grootte van:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20e
  - number: 3.20e.1.a).1°
    text: |-
      minimaal 1% van het geplaatste kapitaal van de onderneming op datum van het sluiten van de
      participatieovereenkomst; of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20e
  - number: 3.20e.1.a).2°
    text: |-
      een aandelenbelang dat een financiële waarde vertegenwoordigt van minimaal € 65.000 op datum van het sluiten van
      de participatieovereenkomst.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20e
  - number: 3.20e.1.b)
    text: 'certificaten van aandelen ter grootte van:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20e
  - number: 3.20e.1.b).1°
    text: minimaal 1% van het geplaatste kapitaal van de onderneming; of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20e
  - number: 3.20e.1.b).2°
    text: |-
      die een financiële waarde vertegenwoordigen van minimaal € 65.000 op datum van het sluiten van de
      participatieovereenkomst.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20e
  - number: 3.20e.1.c)
    text: 'aandelenopties die recht geven om, tegen een vooraf bij het tekenen van de participatieovereenkomst bepaalde prijs:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20e
  - number: 3.20e.1.c).1°
    text: aandelen ter grootte van minimaal 1% van het aandelenkapitaal in de onderneming, te verkrijgen; of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20e
  - number: 3.20e.1.c).2°
    text: |-
      Een aantal aandelen te verkrijgen dat gezamenlijk een aandelenbelang vertegenwoordigt met een financiële waarde van
      minimaal € 65.000 op datum van het sluiten van de participatieovereenkomst, na aftrek van de vooraf bepaalde prijs.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20e
  - number: 3.20e.2
    text: |-
      Aan het recht om het minimale percentage aan aandelen, bedoeld in het eerste lid, te verkrijgen of wanneer deze
      onvoorwaardelijk worden, mogen geen individuele prestatievoorwaarden verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20e
  - number: 3.20e.3
    text: |-
      De eventueel overeengekomen periode waarin de medewerkersparticipatie onvoorwaardelijk wordt, valt binnen de
      termijn van drie jaar nadat de arbeidsovereenkomst in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20e
  - number: 3.20e.4
    text: |-
      Onze Minister van Justitie en Veiligheid beoordeelt of een onderneming startend en innovatief
      is met schaalbare bedrijfsactiviteiten aan de hand van het toetsingskader, bedoeld in
      [artikel 2.7, tweede lid, van het Besluit uitvoering Wet arbeid vreemdelingen 2022][ref1] dat is opgenomen in de
      bij deze regeling behorende [bijlage 8c][ref2]. Voor deze beoordeling wordt advies gevraagd aan de Rijksdienst voor
      Ondernemend Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.20e
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012002
  - number: '3.21'
    text: |-
      Als opleiding of studie, bedoeld in [artikel 3.41, eerste lid, onder c, van het Besluit][ref1] zijn aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.21.a
    text: |-
      opleidingen die worden verzorgd in het kader van het ontwikkelingssamenwerkingsbeleid van het Ministerie van
      Buitenlandse Zaken;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.21
  - number: 3.21.b
    text: |-
      opleidingsactiviteiten in het kader van de [Wet op het specifiek cultuurbeleid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005904
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0005904
  - number: 3.21.c
    text: een opleiding aan een Academie voor Bouwkunst waarbij werkervaring en studie worden gecombineerd.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.21
  - number: 3.22.1
    text: 'In het kader van studie wordt onder voldoende middelen van bestaan verstaan:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.22
  - number: 3.22.1.a
    text: |-
      indien de vreemdeling of een buiten Nederland gevestigde persoon of rechtspersoon de studie en het verblijf
      bekostigt: een netto-inkomen als bedoeld in [artikel 3.74, tweede lid, van het Besluit][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.22.1.b
    text: |-
      indien een in Nederland gevestigde persoon of rechtspersoon de studie en het verblijf van de vreemdeling bekostigt:
      een netto-inkomen als bedoeld in [artikel 3.74, eerste lid, van het Besluit][ref1], aangevuld met het in artikel
      3.74, tweede lid, van het Besluit bedoelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.22.2
    text: |-
      Indien de studie en het verblijf middels periodieke betalingen worden bekostigd, zijn middelen van bestaan in
      afwijking van [artikel 3.75 van het Besluit][ref1] slechts duurzaam, indien naar het oordeel van Onze Minister
      voldoende zekerheid is verschaft over het ongestoorde verloop van de periodieke geldstroom.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.22.3
    text: |-
      Middelen van bestaan zijn duurzaam, indien deze op het tijdstip waarop de aanvraag is ontvangen of de beschikking
      wordt gegeven, voor een jaar of zoveel korter als de voorgenomen studie in Nederland zal duren, beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.22
  - number: 3.22.4
    text: |-
      Middelen van bestaan zijn eveneens duurzaam, indien op een ten name van de vreemdeling gestelde bankrekening in
      Nederland, dan wel op de bankrekening van de onderwijsinstelling waar de student zich heeft ingeschreven, een
      bedrag beschikbaar is, gelijk aan het maandelijkse normbedrag, bedoeld in het eerste lid, vermenigvuldigd met
      twaalf of zoveel minder als het aantal maanden dat de voorgenomen studie in Nederland zal duren.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.22
  - number: '3.23'
    text: |-
      Als buitenlandse onderwijsinstelling, bedoeld in [artikel 3.42, eerste lid, onderdeel e, van het Besluit][ref1],
      zijn aangewezen de onderwijsinstellingen die in de top 200 van ten minste twee van afzonderlijke uitgevers
      afkomstige algemene ranglijsten of beschikbare ranglijsten per faculteit en vakgebied vermeld staan van:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.23.a
    text: de Times Higher Education World University Rankings;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.23
  - number: 3.23.b
    text: de QS World University Rankings;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.23
  - number: 3.23.c
    text: de Academic Ranking of World Universities.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.23
  - number: 3.24.1
    text: 'Verblijf in het kader van uitwisseling is mogelijk indien de vreemdeling minimaal achttien jaar is en indien:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.1.a
    text: de vreemdeling die als au pair in Nederland verblijft of wil verblijven jonger dan zesentwintig jaar is, of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.1.b
    text: de vreemdeling die niet als au pair in Nederland verblijft of wil verblijven jonger dan eenendertig jaar is.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.2
    text: |-
      In afwijking van het eerste lid is verblijf mogelijk als de vreemdeling tussen de vijftien en achttien jaar is,
      voor zover:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.2.a
    text: de vreemdeling niet als au pair in Nederland verblijft of wil verblijven, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.2.b
    text: de mogelijkheid daartoe is opgenomen in het culturele uitwisselingsprogramma.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.3
    text: |-
      In een uitwisselingsprogramma, als bedoeld in [artikel 3.43, eerste lid, onder a, van het Besluit][ref1], wordt in
      ieder geval opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.24.3.a
    text: |-
      op welke wijze de vreemdeling gedurende het tijdelijk verblijf in Nederland kennis maakt met de Nederlandse
      samenleving en cultuur;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.3.b
    text: de wijze waarop de referent invulling geeft aan de zorgplicht;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.3.c
    text: de aard en omvang van de werkzaamheden die de vreemdeling gaat verrichten;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.3.d
    text: |-
      indien het een uitwisselingsprogramma voor au pairs betreft, dat de au pair en het gastgezin de dagindeling
      overeenkomen;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.3.e
    text: |-
      indien het een uitwisselingsprogramma voor au pairs betreft, dat de au pair en het gastgezin de bewustverklaring
      ondertekenen. De bewustverklaring is opgenomen in [bijlage 10a][ref1] van deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0012002
  - number: 3.24.3.f
    text: indien het een uitwisselingsprogramma voor au pairs betreft, dat de au pair ongehuwd is, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.3.g
    text: indien het een uitwisselingsprogramma voor au pairs betreft, dat de au pair geen kinderen of pleegkinderen heeft.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.5
    text: |-
      Een verblijfsvergunning onder een beperking verband houdend met uitwisseling in het kader van Europees
      Vrijwilligerswerk kan worden verleend indien de vreemdeling een overeenkomst heeft gesloten met de referent, en
      daarin is opgenomen:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.5.1°
    text: een beschrijving van het vrijwilligersprogramma;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.5.2°
    text: de duur van het vrijwilligerswerk;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.5.3°
    text: de voorwaarden voor plaatsing en voor het toezicht op het vrijwilligerswerk;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.5.4°
    text: het aantal uren dat de vreemdeling aan het vrijwilligerswerk moet besteden;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.5.5°
    text: |-
      de beschikbare middelen ter dekking van de kosten van levensonderhoud en onderkomen van de vreemdeling en een
      minimumbedrag aan zakgeld voor de duur van het verblijf, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24.5.6°
    text: |-
      indien van toepassing, de opleiding die de vreemdeling zal ontvangen om hem te helpen bij het verrichten van zijn
      vrijwilligerswerk.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24
  - number: 3.24a
    text: |-
      De aanvraag om een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref1] in het kader van
      uitwisseling, ten behoeve van een uitwisselingsjongere, niet zijnde een au pair, wordt niet op grond van
      [artikel 16, eerste lid, onder c, van de Wet][ref2] afgewezen indien de uitwisselingsjongere in zijn eigen
      levensonderhoud voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.24aa.1
    text: |-
      Als categorieën vreemdelingen, bedoeld in [artikel 3.48, tweede lid, aanhef en onder b, van het Besluit][ref1],
      zijn aangewezen vreemdelingen met het volgende verblijfsdoel:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.24aa
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
