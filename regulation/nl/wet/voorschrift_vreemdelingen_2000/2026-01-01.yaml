      vreemdeling van Turkse nationaliteit is en de vreemdeling direct voorafgaande aan de aanvraag houder is van een
      verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref2] onder een beperking verband houdend met het
      verrichten van arbeid als zelfstandige;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
