  - number: 7.1ga.2
    text: De gegevens, bedoeld in het eerste lid, worden niet doorgeleverd.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1ga
  - number: 7.1h
    text: |-
      Als voorschriften vastgesteld bij of krachtens de Schengengrenscode, bedoeld in
      [artikel 108, eerste lid, van de Wet][ref1], zijn aangewezen: - Bijlage VI, onder 2.2.3, van de Schengengrenscode
        - Bijlage VI, onder 2.3.1, van de Schengengrenscode
        - Bijlage VI, onder 3.1.2, van de Schengengrenscode
        - Bijlage VI, onder 3.1.4, van de Schengengrenscode
        - Bijlage VI, onder 3.1.5, van de Schengengrenscode
        - Bijlage VI, onder 3.2.1, van de Schengengrenscode
        - Bijlage VI, onder 3.2.5, van de Schengengrenscode
        - Bijlage VI, onder 3.2.6, van de Schengengrenscode
        - Bijlage VI, onder 3.2.9, i, van de Schengengrenscode


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel108
