  - number: 3.34j.4
    text: |-
      In afwijking van het eerste lid is de vreemdeling een bedrag van € 85 verschuldigd ter zake van de afgifte van een
      vervangend document:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34j
  - number: 3.34j.4.a
    text: |-
      waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder a, van de Wet][ref1] blijkt, voor zover de
      vreemdeling van Turkse nationaliteit is en de verblijfsvergunning is verleend onder een beperking verband houdend
      met het verrichten van arbeid als zelfstandige;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34j
