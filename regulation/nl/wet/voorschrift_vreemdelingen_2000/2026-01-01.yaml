    text: |-
      Australië, Canada, Israël, Japan, Monaco, Nieuw Zeeland, Suriname, de Verenigde Staten van Amerika en Zwitserland,
      en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.18
  - number: 3.18.d
    text: |-
      de overige staten die op de landenlijst van de Commissie Praktische Tuberculosebestrijding zijn uitgezonderd van de
      binnenkomstscreening op tuberculose.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.18
  - number: 3.19.1
    text: |-
      Voor alleenstaanden in de zin van [artikel 4, onderdeel a, van de Participatiewet][ref1] en
      alleenstaande ouders in de zin van artikel 4, onderdeel b, van de Participatiewet zijn de in
      [artikel 16, eerste lid, onder c, van de Wet][ref2] bedoelde middelen van bestaan in ieder geval voldoende,
      indien de som van het loon, bedoeld in [artikel 16 van de Wet financiering sociale verzekeringen][ref3], uit
      arbeid in loondienst, het bruto inkomen uit een inkomensvervangende uitkering krachtens een socialeverzekeringswet
      waarvoor premies zijn afgedragen, de bruto-winst uit arbeid als zelfstandige en het inkomen uit eigen vermogen
      ten minste gelijk is aan 70 procent van het minimumloon, bedoeld in de [artikelen 8, eerste lid, onder a][ref4],
      en [14, van de Wet minimumloon en minimumvakantiebijslag][ref5], met inbegrip van de vakantiebijslag, bedoeld in
      [artikel 15 van die wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0002638#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0002638#Artikel15
