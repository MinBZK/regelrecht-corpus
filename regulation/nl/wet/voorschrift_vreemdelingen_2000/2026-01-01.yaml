  - number: 4.1a.2
    text: |-
      Bij de uitoefening van zijn taak draagt de ambtenaar, bedoeld in het eerste lid, een legitimatiebewijs als
      opgenomen in [bijlage 12a][ref1], bij zich.


      [ref1]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.1a
    references:
      - id: ref1
        bwb_id: BWBR0012002
  - number: 4.1b
    text: |-
      Met het toezicht op de naleving en de uitvoering van de Schengengrenscode en de wettelijke voorschriften met
      betrekking tot de grensbewaking zijn tevens belast de daartoe door de korpschef aangewezen ambtenaren van politie
      als bedoeld in [artikel 2, onder a en c, van de Politiewet 2012][ref1] die met inachtneming van artikel 16, eerste
      lid, van de Schengengrenscode voldoende zijn opgeleid. Deze aanwijzing geldt voor een periode van ten hoogste zes
      maanden en kan telkenmale worden verlengd met ten hoogste zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.1b
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 4.2.1
    text: |-
      Als de plaatsen waar grensdoorlaatposten zijn gevestigd, zijn aangewezen de plaatsen vermeld in kolom A van
      [bijlage 4][ref1] bij deze regeling. Personencontrole in het kader van de grensbewaking kan worden uitgevoerd op de
      locaties, vermeld in kolom B van [bijlage 4][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012002
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0012002
      - id: ref2
        bwb_id: BWBR0012002
  - number: 4.2.2
    text: |-
      De grensdoorlaatposten, bedoeld in het eerste lid, zijn voor het inreizen en uitreizen van personen opengesteld
      gedurende de tijden, vermeld in kolom C van [bijlage 4][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0012002
  - number: 4.2a.1
    text: |-
      De grenscontrole vindt plaats na de tijdige kennisgeving van de afvaart. De tijdige kennisgeving van afvaart,
      bedoeld in punt 3.1.5. van bijlage VI van de Schengengrenscode, wordt gedaan tenminste drie uur en ten hoogste drie
      dagen voor het moment waarop het schip de buitengrens van het Schengengebied daadwerkelijk zal overschrijden.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.2a
  - number: 4.2a.2
    text: |-
      In onvoorziene en uitzonderlijke situaties of indien het schip zich korter dan drie uur bevindt bij de
      grensdoorlaatpost waar de kennisgeving moet plaatsvinden, wordt de kennisgeving als bedoeld in het eerste lid
      gedaan op een zodanig tijdstip dat de met de bediening van de grensdoorlaatpost belaste ambtenaar in staat is de
      door hem uit te oefenen personencontrole uit te voeren.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.2a
  - number: 4.2b
    text: |-
      De gezagvoerder verstrekt de in punt 2.3.1. van Bijlage VI van de Schengengrenscode bedoelde 'algemene
      verklaring' (general declaration) tenminste twee uur voor vertrek langs digitale weg aan de grenswachters.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.2b
  - number: '4.3'
    text: |-
      Het teken, bedoeld in [artikel 4.9, onder a, van het Besluit][ref1], is een blauw flikkerlicht.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
  - number: 4.4.1
    text: |-
      Het model van de bemanningslijst, bedoeld in [artikel 4.11, eerste lid onder a, van het Besluit][ref1] is opgenomen
      in [bijlage 14a][ref2] en [14b][ref3] bij deze regeling. Op de bemanningslijst worden de gegevens verstrekt omtrent
      de familienaam, voornamen, rang, nationaliteit, geboortedatum en geboorteplaats, van zowel de gezagvoerder als
      van alle bij het binnenvaren van Nederland aan boord aanwezige personen die deel uitmaken van de bemanning en als
      zodanig op de monsterrol voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012002
      [ref3]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012002
      - id: ref3
        bwb_id: BWBR0012002
  - number: 4.4.2
    text: |-
      Voor schepen die zijn gecertificeerd voor het vervoer van ten hoogste twaalf passagiers wordt de schriftelijke
      opgave, bedoeld in [artikel 4.11, eerste lid onder b, van het Besluit][ref1], verstrekt met het model van de
      passagierslijst, opgenomen in [bijlage 14c][ref2] en [14d][ref3] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012002
      [ref3]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012002
      - id: ref3
        bwb_id: BWBR0012002
  - number: 4.4a.1
    text: |-
      De gezagvoerder, scheepsagent, of een ander door de gezagvoerder naar behoren gemachtigd persoon van een zeeschip
      of ander schip, daaronder begrepen schepen die vanuit Nederlandse havens veerverbindingen met havens in derde
      landen verzorgen, zendt de in [artikel 4.11 van het Besluit][ref1] en [artikel 4.4][ref2] bedoelde gegevens
      elektronisch aan het hoofd van de grensdoorlaatpost via een elektronisch platform waarvoor de autoriteit belast met
      grenstoezicht het Nederlandse Maritiem Single Window heeft aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012002#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.4a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012002
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '1'
  - number: 4.4a.2
    text: |-
      De gegevens worden, onverminderd specifieke bepalingen betreffende aanmelding opgenomen in andere toepasselijke
      wet- en regelgeving, door de gezagvoerder, scheepsagent of een andere, door de gezagvoerder naar behoren gemachtigd
      persoon, verstuurd aan het hoofd van de grensdoorlaatpost:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.4a
  - number: 4.4a.2.a)
    text: uiterlijk vierentwintig uur voor aankomst in de haven, of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.4a
  - number: 4.4a.2.b)
    text: |-
      uiterlijk op het tijdstip waarop het schip de vorige haven verlaat, indien de reisduur minder dan vierentwintig uur
      bedraagt, of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.4a
  - number: 4.4a.2.c)
    text: indien de aanloophaven nog niet bekend is of tijdens de reis wordt gewijzigd, zodra deze informatie bekend is.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.4a
  - number: 4.4a.3
    text: De gegevens worden verzonden in een bericht met de structuur Extensible Markup Language (XML).
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.4a
  - number: 4.4a.4
    text: |-
      De gezagvoerder, scheepsagent, of een ander door de gezagvoerder naar behoren gemachtigd persoon ontvangt van
      het hoofd van de grensdoorlaatpost via een elektronisch platform, waarvoor de autoriteit belast met grenstoezicht
      het Nederlandse Maritiem Single Window heeft aangewezen, een automatische elektronische ontvangstbevestiging als
      bedoeld in [artikel 4.12 van het Besluit][ref1], van de informatie die hij verstrekt heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.4a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
  - number: 4.5.1
    text: |-
      Het model van de bemanningslijst, bedoeld in [artikel 4.15, eerste lid, onder a, van het Besluit][ref1], is
      opgenomen in [bijlage 15][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012002
  - number: 4.5.2
    text: |-
      Het model van de passagierslijst, bedoeld in [artikel 4.15, eerste lid, onder a, van het Besluit][ref1], is
      opgenomen in [bijlage 16][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012002
  - number: 4.6.1
    text: |-
      De aantekening, bedoeld in de [artikelen 4.24, eerste lid, onder d][ref1], en [4.26 van het Besluit][ref2], luidt:
      'aanmelden binnen drie dagen bij de korpschef te (plaats), (datum waarop de aantekening wordt gesteld, handtekening
      en stempel)'.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '4'
  - number: 4.6.2
    text: |-
      Het opleggen van een verplichting tot aanmelding bij de korpschef aan een vreemdeling, aan wie een bijzonder
      doorlaatbewijs als bedoeld in [bijlage 3 onder I][ref1] bij deze regeling is afgegeven, geschiedt door in dat
      document achter de woorden 'zich melden binnen drie dagen na afgifte van dit doorlaatbewijs bij' aan te tekenen:
      'de korpschef te (plaats)'.


      [ref1]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0012002
  - number: 4.7.1
    text: |-
      De aantekening, bedoeld in de [artikelen 4.24, eerste lid, onder f,][ref1] en [4.27 van het Besluit][ref2], luidt:
      'toegang geweigerd (datum) (handtekening en stempel)'.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '4'
  - number: 4.7.2
    text: |-
      De aantekening, bedoeld in het eerste lid, kan worden aangevuld met een aantekening omtrent de grond waarop de
      weigering van toegang tot Nederland berust.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.7
  - number: 4.8.1
    text: |-
      De aantekening, bedoeld in de [artikelen 4.24, eerste lid, onder g][ref1], en [4.28 van het Besluit][ref2], luidt:
      'vertrokken/uitgezet verwijderd op (datum) (handtekening en stempel)'.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '4'
  - number: 4.8.2
    text: |-
      De aantekening, bedoeld in het eerste lid, kan worden aangevuld met een aantekening omtrent de reden van de
      verwijdering uit Nederland.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.8
  - number: '4.9'
    text: |-
      Voor het stellen van aantekeningen in de reis- en identiteitspapieren van de vreemdeling, bedoeld in
      [artikel 4.29 van het Besluit][ref1], wordt gebruik gemaakt van het model dat als [bijlage 7j][ref2] bij deze
      regeling is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012002
  - number: '4.10'
    text: |-
      De aantekening, bedoeld in [artikel 4.29 van het Besluit][ref1], omtrent het voldoen aan een
      verplichting tot aanmelding of vervoeging bij een korpschef ingevolge de [artikelen 4.39][ref2],
      [4.47 tot en met 4.51 van het Besluit luidt][ref3]: 'Aangemeld op (datum)'. Indien het betreft een vreemdeling die
      naar Nederland is gekomen om als zeeman werk te zoeken aan boord van een zeeschip, wordt de aantekening aangevuld
      met de zinsnede 'voor verblijf als zeeman tot (datum)'.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '4'
  - number: 4.11.1
    text: |-
      In de reis- en identiteitspapieren van een vreemdeling wiens uitzetting gedurende enige tijd achterwege blijft,
      wordt een aantekening gesteld, luidende: 'vertrek voor (datum)'.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.11
  - number: 4.11.2
    text: |-
      In de reis- en identiteitspapieren van een vreemdeling wiens uitzetting achterwege blijft hangende de beslissing op
      een door hem ingediend verzoek om een voorlopige voorziening wordt de aantekening: 'verzoek voorlopige voorziening
      ingediend (datum). Arbeid is wel/niet toegestaan. Een tewerkstellingsvergunning is wel/niet verplicht. Geldig tot
      (datum), tenzij voor deze datum op voormeld verzoek is beslist' gesteld. Tevens worden aangetekend het V-nummer en
      het paspoortnummer.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.11
  - number: 4.11.3
    text: |-
      De aantekening, bedoeld in het tweede lid, heeft een geldigheidsduur van ten hoogste zes maanden. Indien de
      geldigheidsduur van de aantekening is verstreken voordat een beslissing is genomen op het verzoek om een voorlopige
      voorziening, kan de desbetreffende aantekening wederom worden gesteld met een geldigheidsduur van ten hoogste zes
      maanden. Indien afwijzend is beslist, wordt de aantekening 'vervallen' geplaatst.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.11
  - number: 4.11.4
    text: |-
      Voor de aantekeningen, bedoeld in het tweede lid, wordt gebruik gemaakt van de Sticker Aantekening Voorlopige
      Voorziening, waarvan het model als [bijlage 7k][ref1] bij deze regeling is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0012002
  - number: '4.12'
    text: |-
      De aantekening omtrent verandering van woon- of verblijfplaats binnen Nederland, bedoeld in
      [artikel 4.29, eerste lid, onder b, van het Besluit][ref1], luidt: 'verhuisd op (datum)'.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
  - number: 4.12a
    text: |-
      Als de landen, bedoeld in [artikel 4.46, tweede lid, van het Besluit][ref1], zijn aangewezen de landen, bedoeld
      in [artikel 3.18][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012002#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.12a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '4.13'
    text: |-
      De korpschef is bevoegd om met toepassing van [artikel 4.51 van het Besluit][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
  - number: 4.13.a
    text: |-
      ontheffing te verlenen van de verplichting tot periodieke aanmelding, bedoeld in
      [artikel 4.51 van het Besluit][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
  - number: 4.13.b
    text: |-
      de termijn van een week, genoemd in [artikel 4.51, tweede lid, van het Besluit][ref1], te verkorten of te
      verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
  - number: 4.14.1
    text: |-
      De aantekening omtrent de ontheffing met toepassing van [artikel 4.51, tweede lid, van het Besluit][ref1] van de
      verplichting tot wekelijkse aanmelding, luidt: 'ontheffing verleend van de verplichting tot wekelijkse aanmelding
      onder de volgende beperking(en) en/of voorschrift(en) (beperkingen/voorschriften) (datum)'.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
  - number: 4.14.2
    text: |-
      Indien met toepassing van [artikel 4.51, tweede lid, van het Besluit][ref1] een andere dan een wekelijkse termijn
      voor periodieke aanmelding is gesteld, wordt de aantekening gesteld 'Verplichting tot periodieke aanmelding
      krachtens [artikel 4.51 Vreemdelingenbesluit 2000][ref2]', aangevuld met de periode van aanmelding en eventuele
      bijzonderheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '4'
  - number: 4.15.1
    text: |-
      Indien met toepassing van [artikel 54, derde lid, van de Wet][ref1] een individuele verplichting tot periodieke
      aanmelding is opgelegd, wordt de aantekening gesteld 'Verplichting tot periodieke aanmelding krachtens artikel 54,
      derde lid, Vreemdelingenwet 2000', aangevuld met de periode van aanmelding en eventuele bijzonderheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
  - number: 4.15.2
    text: |-
      Indien de verplichting, bedoeld in [artikel 54, derde lid, van de Wet][ref1], wordt opgeheven, wordt de aantekening
      gesteld: 'Verplichting tot periodieke aanmelding opgeheven op (datum)'.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel54
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '54'
  - number: 4.15a.1
    text: |-
      Aan de verplichting op grond van [artikel 4.52 van het Besluit][ref1], om het verblijfsdocument in te leveren,
      wordt voldaan door inlevering in persoon door de vreemdeling, diens referent of gemachtigde bij een loket van de
      Immigratie- en Naturalisatiedienst of door verzending per post naar een door de Immigratie- en Naturalisatiedienst
      bepaald postadres.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.15a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
  - number: 4.15a.2
    text: |-
      Indien de vreemdeling een nieuw verblijfsdocument in persoon komt afhalen bij het loket van de Immigratie- en
      Naturalisatiedienst, kan aan de verplichting om het verblijfsdocument in te leveren uitsluitend worden voldaan door
      inlevering in persoon door de vreemdeling, bij het loket van de Immigratie- en Naturalisatiedienst.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.15a
  - number: 4.15a.3
    text: |-
      Indien de vreemdeling gebruikmaakt van terugkeerfaciliteiten, kan aan de verplichting om het verblijfsdocument
      in te leveren uitsluitend worden voldaan door inlevering in persoon door de vreemdeling, bij het loket van de
      Immigratie- en Naturalisatiedienst.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.15a
  - number: 4.16.1
    text: |-
      De korpschef, de Commandant der Koninklijke marechaussee, alsmede de daartoe bevoegde ambtenaar van de Immigratie-
      en Naturalisatiedienst zijn bevoegd om
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.16
  - number: 4.16.1.a
    text: |-
      de plaats aan te wijzen waar de vreemdeling met rechtmatig verblijf als bedoeld in
      [artikel 8, onder f, van de Wet][ref1], zich in verband met het onderzoek naar de inwilligbaarheid van de aanvraag
      om een verblijfsvergunning dient op te houden; en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 4.16.1.b
    text: |-
      aanwijzingen als bedoeld in [artikel 55, eerste lid, van de Wet][ref1], te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel55
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '55'
  - number: 4.16.2
    text: |-
      De korpschef of de Commandant der Koninklijke marechaussee is bevoegd om de verstrekking van gegevens, bedoeld in
      [artikel 4.38 van het Besluit][ref1], te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
  - number: 4.16.3
    text: |-
      Een vordering als bedoeld in het tweede lid wordt niet bij algemene bekendmaking gedaan dan na goedkeuring van, en
      volgens voorschrift te geven door, de Minister.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.16
  - number: 4.17.1
    text: |-
      De inlichtingen, bedoeld in deze paragraaf, worden binnen vier weken door de vreemdeling, diens wettelijk
      vertegenwoordiger, diens referent of diens gewezen referent verstrekt, voor zover hij daarvan kennis heeft of kan
      hebben, in een door de Minister ter beschikking gesteld formulier.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.17
  - number: 4.17.2
    text: 'In de verklaring wordt in ieder geval melding gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.17
  - number: 4.17.2.a
    text: het feit waarover hij inlichtingen dient te verstrekken;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.17
  - number: 4.17.2.b
    text: de personalia van de vreemdeling waarop de inlichtingen betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.17
  - number: 4.17.2.c
    text: de relevante feiten en omstandigheden;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.17
  - number: 4.17.2.d
    text: vanaf wanneer de wijziging of omstandigheden zich voordoen of voordeden.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.17
  - number: 4.18.1
    text: 'De referent verstrekt inlichtingen over de vreemdeling wiens referent hij is indien:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.18
  - number: 4.18.1.a
    text: |-
      de vreemdeling niet langer in Nederland verblijft en deze wijziging niet tijdig is gemeld bij het college van
      burgemeester en wethouders van de gemeente waar de vreemdeling als ingezetene is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.18
  - number: 4.18.1.b
    text: de vreemdeling geen overkomst naar Nederland meer wenst.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.18
  - number: 4.18.2
    text: 'De erkende referent geeft kennis van het feit dat:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.18
  - number: 4.18.2.a
    text: |-
      een uitschrijving van de onderneming, organisatie of rechtspersoon in het handelsregister, als bedoeld in
      [artikel 2 van het Handelsregisterwet][ref1], heeft plaatsgevonden;


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: 4.18.2.b
    text: |-
      een surseance van betaling of faillissement van de onderneming, organisatie, natuurlijke of rechtspersoon is
      uitgesproken of aangevraagd;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.18
  - number: 4.18.2.c
    text: de onderneming, organisatie of rechtspersoon is beëindigd;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.18
  - number: 4.18.2.d
    text: er geen aansluiting meer is bij een voor erkenning als referent verplicht gestelde gedragscode;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.18
  - number: 4.18.2.e
    text: |-
      de registratie in het register van de Stichting normering arbeid wordt beëindigd, indien de erkende referent een
      onderneming is die zich bezighoudt met het ter beschikking stellen van arbeidskrachten of payrolling, bedoeld in
      [artikel 1, aanhef en onder c en d, van de Wet allocatie arbeidskrachten door intermediairs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel1
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '1'
  - number: 4.19.1
    text: |-
      De referent van een vreemdeling, die in Nederland verblijft of wil verblijven in het kader van uitwisseling
      verstrekt inlichtingen over de vreemdeling wiens referent hij is indien:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
  - number: 4.19.1.a
    text: |-
      de tussen het gastgezin en de au pair overeengekomen dagindeling niet wordt nageleefd
      of zodanig is gewijzigd dat niet meer wordt voldaan aan de voorwaarden, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________________;


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '3'
  - number: 4.19.1.b
    text: |-
      de vreemdeling arbeid in strijd met de [Wet arbeid vreemdelingen][ref1] verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0007149
  - number: 4.19.1.c
    text: de vreemdeling bij een ander gastgezin gaat verblijven;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
  - number: 4.19.1.d
    text: |-
      de vreemdeling, niet zijnde een au pair, werkzaamheden verricht welke niet vallen binnen de kaders van het door de
      Minister goedgekeurde uitwisselingsprogramma;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
  - number: 4.19.1.e
    text: de samenstelling van het gastgezin wijzigt;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
  - number: 4.19.1.f
    text: |-
      het gastgezin waarin de au pair verblijft niet langer zelfstandig en duurzaam beschikt over voldoende middelen
      van bestaan;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
  - number: 4.19.1.g
    text: de vreemdeling, niet zijnde een au pair, niet langer in zijn levensonderhoud kan voorzien;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
  - number: 4.19.1.h
    text: de vreemdeling niet langer in het gastgezin verblijft;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
  - number: 4.19.1.i
    text: de vreemdeling niet langer deelneemt aan het uitwisselingsprogramma;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
  - number: 4.19.1.j
    text: hij weet of redelijkerwijs vermoedt dat er sprake is van onregelmatigheden, misstanden of misbruik.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
  - number: 4.19.2
    text: |-
      De referent, bedoeld in het eerste lid, verstrekt inlichtingen over de nakoming van zijn verplichtingen als
      referent indien hij:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
  - number: 4.19.2.a
    text: niet meer kan voldoen aan een zorgvuldige werving en selectie van de uitwisselingsjongeren of gastgezinnen;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
  - number: 4.19.2.b
    text: |-
      niet meer kan voldoen aan het toezicht op de naleving van de tussen het gastgezin en de au pair overeengekomen
      dagindeling;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
  - number: 4.19.2.c
    text: niet meer kan voldoen aan het toezicht op de activiteiten die de uitwisselingsjongere onderneemt.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
  - number: 4.19.3
    text: |-
      De referent, bedoeld in het eerste lid, verstrekt inlichtingen over diens positie als referent indien hij
      voornemens is het uitwisselingsprogramma te wijzigen.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
  - number: 4.19.4
    text: |-
      De referent, bedoeld in het eerste lid, verstrekt inlichtingen over diens positie als referent, indien en voor
      zover van toepassing, een wijziging optreedt in de accreditatie door het Nederlands Jeugdinstituut.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.19
  - number: 4.20.1
    text: |-
      De referent van een vreemdeling, die in Nederland verblijft of wil verblijven in het kader van studie aan het hoger
      onderwijs verstrekt inlichtingen over de vreemdeling wiens referent hij is indien:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.20
  - number: 4.20.1.a
    text: de vreemdeling niet meer voltijds aan de instelling studeert;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.20
  - number: 4.20.1.b
    text: de vreemdeling zijn opleiding voortijdig heeft gestopt of voor de geplande einddatum heeft afgerond;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.20
  - number: 4.20.1.c
    text: |-
      de vreemdeling aan de onderwijsinstelling komt studeren en al in het bezit is van een geldige verblijfsvergunning
      voor studie aan het hoger onderwijs;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.20
  - number: 4.20.1.d
    text: de accreditatie van de opleiding die de vreemdeling volgt, is vervallen;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.20
  - number: 4.20.1.e
    text: |-
      er sprake is van onvoldoende studievoortgang als bedoeld in artikel 6.5 van de Gedragscode internationale student
      hoger onderwijs;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.20
  - number: 4.20.1.f
    text: |-
      de vreemdeling aan het begin van een nieuw studiejaar niet zelfstandig en duurzaam beschikt over voldoende middelen
      van bestaan;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.20
  - number: 4.20.1.g
    text: |-
      de vreemdeling, die onder een uniaal of multilateraal programma met mobiliteitsmaatregelen of onder een
      overeenkomst tussen twee of meer instellingen voor hoger onderwijs valt, voornemens is gebruik te maken van
      uitgaande mobiliteit.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.20
  - number: 4.20.2
    text: |-
      De referent, bedoeld in het eerste lid, verstrekt inlichtingen over de nakoming van zijn verplichtingen als
      referent indien de zorgplicht niet wordt nagekomen.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.20
  - number: 4.20.3
    text: 'De referent, bedoeld in het eerste lid, verstrekt inlichtingen over zijn positie als referent indien:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.20
  - number: 4.20.3.a
    text: |-
      de hoger onderwijsinstelling niet meer geregistreerd is bij de registerbeheerder van de Gedragscode internationale
      student hoger onderwijs;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.20
  - number: 4.20.3.b
    text: |-
      er geen opleiding meer wordt verzorgd in het kader van het ontwikkelingssamenwerkingsbeleid van het Ministerie van
      Buitenlandse Zaken;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.20
  - number: 4.20.3.c
    text: |-
      er geen opleidingsactiviteiten meer worden gefaciliteerd in het kader van de
      [Wet op het specifiek cultuurbeleid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005904
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0005904
  - number: 4.20.4
    text: |-
      Indien de vreemdeling naar Nederland is gekomen voor een verblijf op grond van
      [artikel 3.3, vijfde lid, van het Besluit][ref1] doet de erkend referent, na machtiging daartoe door de
      vreemdeling, schriftelijk de aanmelding als bedoeld in [artikel 4.47, vierde lid, van het Besluit][ref2]. De
      erkend referent verstrekt dezelfde bescheiden en gegevens als bij een aanvraag voor een verblijfsvergunning onder
      een beperking verband houdend met studie. Tevens meldt de referent in het kader van welk uniaal of multilateraal
      programma met mobiliteitsmaatregelen, of welke overeenkomst tussen twee of meer instellingen voor het hoger
      onderwijs, de mobiliteit plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '4'
  - number: 4.21.1
    text: |-
      De referent van een vreemdeling, die in Nederland verblijft of wil verblijven in het kader van studie aan het
      voortgezet of beroepsonderwijs, verstrekt inlichtingen indien:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.21
  - number: 4.21.1.a
    text: de vreemdeling niet meer voltijds onderwijs volgt bij de instelling;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.21
  - number: 4.21.1.b
    text: de vreemdeling zijn opleiding voortijdig heeft gestopt of voor de geplande einddatum heeft afgerond;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.21
  - number: 4.21.1.c
    text: |-
      de vreemdeling aan het begin van een nieuw studiejaar niet zelfstandig en duurzaam beschikt over voldoende middelen
      van bestaan.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.21
  - number: 4.21.2
    text: |-
      De referent van een vreemdeling, die in Nederland verblijft of wil verblijven in het kader van het volgen van het
      Internationaal Baccalaureaat diplomaprogramma, verstrekt inlichtingen over zijn positie als referent indien hij:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.21
  - number: 4.21.2.a
    text: niet langer door de Internationale Baccalaureaat Organisatie geaccrediteerd is;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.21
  - number: 4.21.2.b
    text: |-
      geen deel meer uitmaakt van een internationale organisatie, waarbij een uitwisseling van leerlingen over de wereld
      plaatsvindt en het land van plaatsing wordt bepaald door landelijke comités van deze internationale organisatie of
      deze internationale organisatie zijn leerlingen niet langer in een internaat plaatst.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.21
  - number: 4.21.3
    text: |-
      De referent van een vreemdeling, die in Nederland verblijft of wil verblijven in het kader van het volgen van een
      studie aan het middelbaar beroepsonderwijs niveau 4, verstrekt inlichtingen over zijn positie als referent indien:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.21
  - number: 4.21.3.a
    text: de vreemdeling niet meer voltijds onderwijs volgt bij de instelling;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.21
  - number: 4.21.3.b
    text: de vreemdeling zijn opleiding voortijdig heeft gestopt of voor de geplande einddatum heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.21
  - number: '4.22'
    text: |-
      De referent van een vreemdeling, die in Nederland verblijft of wil verblijven in het kader van seizoenarbeid,
      lerend werken of arbeid in loondienst verstrekt inlichtingen indien:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.22
  - number: 4.22.a
    text: de vreemdeling niet meer bij de referent werkzaam is;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.22
  - number: 4.22.b
    text: de vreemdeling niet meer zelfstandig en duurzaam beschikt over voldoende middelen van bestaan;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.22
  - number: 4.22.c
    text: de vreemdeling andere werkzaamheden gaat verrichten.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.22
  - number: 4.23.1
    text: |-
      De referent van een vreemdeling, die in Nederland verblijft of wil verblijven in het kader van arbeid als
      kennismigrant of als houder van de Europese blauwe kaart, verstrekt inlichtingen indien:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.23
  - number: 4.23.1.a
    text: de vreemdeling niet meer bij de referent werkzaam is;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.23
  - number: 4.23.1.b
    text: |-
      de vreemdeling, die in Nederland verblijft of wil verblijven in het kader
      van arbeid als kennismigrant, niet meer aan het looncriterium, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________, voldoet of, indien het looncriterium niet van toepassing is, de vreemdeling niet meer zelfstandig en
      duurzaam over voldoende middelen van bestaan beschikt;


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
  - number: 4.23.1.c
    text: |-
      de vreemdeling, die in Nederland verblijft of wil verblijven als houder
      van de Europese blauwe kaart, niet meer aan het looncriterium, bedoeld in
      [artikel 2.2, eerste lid, onderdeel b, van het Besluit uitvoering Wet arbeid vreemdelingen 2022][ref1], voldoet;


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
  - number: 4.23.1.d
    text: |-
      de vreemdeling, die een beroep in de individuele gezondsheidszorg verricht of wil verrichten waarvoor registratie
      verplicht is, niet of niet meer in het Beroepen Individuele Gezondheidszorg register is geregistreerd;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.23
  - number: 4.23.1.e
    text: |-
      de vreemdeling, die in Nederland verblijft of wil verbijven als houder van de Europese blauwe kaart, een
      gereguleerd beroep in de zin van [artikel 1 van de Algemene wet erkenning EU-beroepskwalificaties][ref1] uitoefent
      en niet meer beschikt over een erkenning van de beroepskwalificaties in de zin van [artikel 5 van die wet][ref2],
      dan wel, voor zover hij een niet-gereguleerd beroep uitoefent, niet meer beschikt over voor dat beroep
      of de desbetreffende sector benodigde getuigschriften van hoger onderwijs in de zin van artikel 2, onder
      8, van [Richtlijn 2021/1883/EU](32021L1883) of relevante hogere beroepsvaardigheden, als bedoeld in
      [artikel 3.30b, derde lid, van het Besluit][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 4.23.1.f
    text: |-
      de vreemdeling, die in Nederland verblijft of wil verblijven als houder van de Europese blauwe kaart, arbeid
      verricht of gaat verrichten die niet voldoet aan de voorwaarden die zijn vastgelegd uit hoofde van het
      toepasselijke recht, in collectieve overeenkomsten of door praktijken in de relevante beroepssectoren voor
      hooggekwalificeerde banen.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.23
  - number: 4.23.2
    text: |-
      De referent, bedoeld in het eerste lid, verstrekt inlichtingen over de nakoming van zijn verplichtingen als
      referent indien hij niet meer kan voldoen aan een zorgvuldige werving en selectie van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.23
  - number: 4.23a.1
    text: |-
      De referent van een vreemdeling, die in Nederland verblijft of wil verblijven in het kader van een overplaatsing
      binnen een onderneming, verstrekt inlichtingen indien:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.23a
  - number: 4.23a.1.a
    text: de vreemdeling niet meer bij de referent of de buiten de Europese Unie gevestigde onderneming werkzaam is;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.23a
  - number: 4.23a.1.b
    text: |-
      de vreemdeling niet langer een functie vervult die voldoet aan de definitie van leidinggevende, specialist of
      trainee-werknemer in de zin van artikel 3, onder e, f of g, van richtlijn 2014/66/EU;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.23a
  - number: 4.23a.1.c
    text: de vreemdeling niet langer in Nederland verblijft voor een overplaatsing binnen een onderneming;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.23a
  - number: 4.23a.1.d
    text: |-
      de vreemdeling geen arbeidsplaats meer vervult waarvan de arbeidsvoorwaarden, arbeidsverhoudingen of
      arbeidsomstandigheden ten minste op het niveau dat wettelijk vereist is en in de desbetreffende bedrijfstak
      gebruikelijk is, liggen;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.23a
  - number: 4.23a.1.e
    text: |-
      de vreemdeling, die een beroep in de individuele gezondheidszorg verricht of wil verrichten waarvoor registratie
      verplicht is, niet of niet meer in het Beroepen Individuele Gezondheidszorg register is geregistreerd;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.23a
  - number: 4.23a.1.f
    text: |-
      de vreemdeling een gereglementeerd beroep in de zin van
      [artikel 1 van de Algemene wet erkenning EU-beroepskwalificaties][ref1] uitoefent en niet meer beschikt over een
      erkenning van de beroepskwalificaties in de zin van [artikel 5 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.23a
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 4.23a.2
    text: |-
      De referent, bedoeld in het eerste lid, verstrekt inlichtingen over diens positie als referent indien de referent
      niet langer behoort tot dezelfde onderneming of tot dezelfde groep van ondernemingen als de buiten het grondgebied
      van de Europese Unie gevestigde onderneming, als bedoeld in artikel 3, onder l, van richtlijn 2014/66/EU.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.23a
  - number: 4.24.1
    text: |-
      De referent van een vreemdeling, die in Nederland verblijft of wil verblijven in het kader van onderzoek in de zin
      van richtlijn (EU) 2016/801, verstrekt inlichtingen indien:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.24
  - number: 4.24.1.a
    text: de vreemdeling geen onderzoek meer verricht bij de referent;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.24
  - number: 4.24.1.b
    text: de vreemdeling niet langer aan de onderzoeksinstelling is verbonden;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.24
  - number: 4.24.1.c
    text: de vreemdeling niet langer zelfstandig en duurzaam beschikt over voldoende middelen van bestaan;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.24
  - number: 4.24.1.d
    text: |-
      de vreemdeling voornemens is gebruik te maken van uitgaande mobiliteit en in het kader van welk uniaal of
      multilateraal programma met mobiliteitsmaatregelen, of welke overeenkomst tussen twee of meer instellingen voor het
      hoger onderwijs, de mobiliteit plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.24
  - number: 4.24.1.e
    text: |-
      de vreemdeling, die een beroep in de individuele gezondheidszorg verricht of wil verrichten waarvoor registratie
      verplicht is, niet of niet meer in het Beroepen Individuele Gezondheidszorg register is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.24
  - number: 4.24.2
    text: 'De referent, bedoeld in het eerste lid, verstrekt inlichtingen over diens positie als referent indien:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.24
  - number: 4.24.2.a
    text: |-
      hij geen publieke onderzoeksinstelling die is opgenomen in de [bijlage behorende bij de Wet op het hoger onderwijs
      en wetenschappelijk onderzoek](onbekend) meer is;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.24
  - number: 4.24.2.b
    text: |-
      hij geen onderzoeksinstelling als bedoeld in
      [artikel 2.1, eerste lid, onderdeel b, van het Besluit uitvoering Wet arbeid vreemdelingen 2022][ref1] meer is;


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
  - number: 4.24.2.c
    text: |-
      hij niet meer als particuliere onderzoeksinstelling in het National Academic Research and Collaborations
      Information System is opgenomen;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.24
  - number: 4.24.2.d
    text: |-
      de verklaring betreffende Speur- en Ontwikkelingswerk, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____________, is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel1
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0007746
        artikel: '1'
  - number: 4.24.3
    text: |-
      Indien de vreemdeling naar Nederland is gekomen voor een verblijf op grond van
      [artikel 3.3, vierde lid, van het Besluit][ref1] doet de erkend referent, na machtiging daartoe door de
      vreemdeling, schriftelijk de aanmelding als bedoeld in [artikel 4.47, vierde lid, van het Besluit][ref2]. De erkend
      referent verstrekt dezelfde bescheiden en gegevens als bij een aanvraag voor een verblijfsvergunning onder een
      beperking verband houdend met onderzoek in de zin van richtlijn (EU) 2016/801.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '4'
  - number: '4.25'
    text: |-
      De referent van een vreemdeling, die in Nederland verblijft of wil verblijven als familie- of gezinslid, verstrekt
      inlichtingen indien:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.25
  - number: 4.25.a
    text: de gezinsband met de vreemdeling is verbroken;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.25
  - number: 4.25.b
    text: |-
      de vreemdeling en de referent niet meer samenwonen en deze wijziging niet tijdig is gemeld bij het betreffende
      college van burgemeester en wethouders van de gemeente waar de vreemdeling als ingezetene is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.25
  - number: '4.26'
    text: |-
      De vreemdeling die in Nederland verblijft in het kader van uitwisseling, studie, seizoenarbeid, lerend werken,
      arbeid in loondienst, arbeid als kennismigrant, als houder van de Europese blauwe kaart of in het kader van
      onderzoek in de zin van richtlijn (EU) 2016/801, verstrekt inlichtingen indien hij van uitwisselings- of au
      pairorganisatie, onderwijsinstelling of werkgever wijzigt.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.26
  - number: '4.27'
    text: |-
      De referent, met uitzondering van de referent van een vreemdeling die in Nederland verblijft als familie- of
      gezinslid, neemt met betrekking tot de vreemdeling wiens referent hij is, het woonadres van de vreemdeling in de
      administratie op.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.27
  - number: 4.28.1
    text: |-
      De referent van een vreemdeling die in Nederland verblijft of wil verblijven in het kader van uitwisseling, neemt
      met betrekking tot de vreemdeling wiens referent hij is in de administratie op:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.28
  - number: 4.28.1.a
    text: de tussen de au pair en gastgezin overeengekomen dagindeling;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.28
  - number: 4.28.1.b
    text: |-
      de naam en het adres van de hoofdpersonen van alle gastgezinnen waarbij de vreemdeling verblijft of heeft
      verbleven, de periode waarin de vreemdeling bij deze gastgezinnen heeft verbleven en de gezinssamenstelling van
      deze gastgezinnen;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.28
  - number: 4.28.1.c
    text: |-
      bewijsmiddelen waaruit blijkt dat het gastgezin, voor zover het een gastgezin van een au pair betreft, zelfstandig
      en duurzaam beschikt over voldoende duurzame middelen van bestaan;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.28
  - number: 4.28.1.d
    text: de door het gastgezin en au pair ondertekende bewustverklaring;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.28
  - number: 4.28.1.e
    text: |-
      de overeenkomst bedoeld in artikel 14, eerste lid, onder a, van richtlijn (EU) 2016/801, indien de vreemdeling
      Europees Vrijwilligerswerk gaat verrichten;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.28
  - number: 4.28.1.f
    text: |-
      de door de vreemdeling ingevulde en ondertekende antecedentenverklaring, bedoeld in
      [artikel 3.77, elfde lid, van het Besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.28
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 4.28.1.g
    text: een gelegaliseerd en vertaald uittreksel (ongehuwdverklaring) uit de burgerlijke stand van het land van herkomst.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.28
  - number: 4.28.2
    text: |-
      De referent, bedoeld in het eerste lid, neemt met betrekking tot de nakoming van zijn verplichtingen als referent
      in de administratie op:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.28
  - number: 4.28.2.a
    text: |-
      een overzicht, voorzien van data en handelingen, van de meldingen van de vreemdeling aan de referent over het
      gastgezin en de gevolgen die hij daaraan heeft verbonden;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.28
  - number: 4.28.2.b
    text: |-
      een overzicht van de inspanningen, voorzien van data en handelingen, die de referent heeft gepleegd opdat de au
      pair en het gastgezin de overeengekomen afspraken in de dagindeling nakomen;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.28
  - number: 4.28.2.c
    text: |-
      een overzicht, voorzien van data en handelingen, waaruit blijkt op welke wijze de referent opgetreden heeft bij
      problemen, misstanden, misbruik of noodsituatie;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.28
  - number: 4.28.2.d
    text: |-
      een overzicht van de inspanningen, voorzien van data en handelingen, die de referent heeft gepleegd om zich te
      vergewissen van het welzijn en welbevinden van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.28
  - number: 4.28.3
    text: |-
      De referent, bedoeld in het eerste lid, neemt met betrekking tot zijn positie als referent in de administratie het
      door de Minister goedgekeurde uitwisselingsprogramma op.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.28
  - number: 4.29.1
    text: |-
      De referent van een vreemdeling die in Nederland verblijft of wil verblijven in het kader van studie aan het hoger
      onderwijs, neemt met betrekking tot de vreemdeling wiens referent hij is in de administratie op:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.29
  - number: 4.29.1.a
    text: |-
      de voorlopige en de definitieve inschrijving van de student aan de onderwijsinstelling, zowel van het eerste
      inschrijvingsjaar als van de opvolgende jaren waarin de onderwijsinstelling de vreemdeling als student inschrijft
      of als het een uitwisselingstudent betreft een verklaring van registratie;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.29
  - number: 4.29.1.b
    text: een registratie van de studievoortgang van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.29
  - number: 4.29.1.c
    text: |-
      een registratie van de vreemdeling die onvoldoende studievoortgang boekt vanwege een persoonlijke omstandigheid,
      alsmede het feit dat er geen afmelding bij de Minister heeft plaatsgevonden als bedoeld in artikel 6.5 van de
      Gedragscode internationale student hoger onderwijs;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.29
  - number: 4.29.1.d
    text: |-
      de bewijsstukken die ten grondslag hebben gelegen aan de eigen verklaring bij de aanvraag om toelating van de
      vreemdeling, waarin de instelling stelt dat de vreemdeling zelfstandig en duurzaam beschikt over voldoende middelen
      van bestaan;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.29
  - number: 4.29.1.e
    text: |-
      de eigen verklaring of eigen verklaringen waarin de vreemdeling na toelating jaarlijks verklaart zelfstandig en
      duurzaam te beschikken over voldoende middelen van bestaan;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.29
  - number: 4.29.1.f
    text: |-
      de door de vreemdeling ingevulde en ondertekende antecedentenverklaring, bedoeld in
      [artikel 3.77, elfde lid, van het Besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.29
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 4.29.2
    text: |-
      De referent, bedoeld in het eerste lid, neemt met betrekking tot de nakoming van zijn verplichtingen als referent
      bewijsstukken waaruit voldoende blijkt dat de student toelaatbaar tot de opleiding is gebleken, in de administratie
      op.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.29
  - number: 4.30.1
    text: |-
      De referent van een vreemdeling die in Nederland verblijft of wil verblijven in het kader van studie aan het
      voortgezet onderwijs of beroepsonderwijs, neemt met betrekking tot de vreemdeling wiens referent hij is in de
      administratie op:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.1.a
    text: een bewijs van inschrijving van de vreemdeling aan de onderwijsinstelling;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.1.b
    text: een registratie van de studievoortgang van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.1.c
    text: een bewijsstuk waaruit blijkt dat Nederland het meest aangewezen land is;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.1.d
    text: een bewijsstuk waaruit blijkt dat de vreemdeling een positieve bijdrage kan leveren aan zijn land;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.1.e
    text: |-
      de bewijsstukken die ten grondslag hebben gelegen aan de eigen verklaring bij de aanvraag om toelating van de
      vreemdeling, waarin de instelling stelt dat de vreemdeling zelfstandig en duurzaam beschikt over voldoende middelen
      van bestaan;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.1.f
    text: |-
      de eigen verklaring of eigen verklaringen waarin de vreemdeling na toelating jaarlijks verklaart zelfstandig en
      duurzaam te beschikken over voldoende middelen van bestaan;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.1.g
    text: |-
      de door de vreemdeling ingevulde en ondertekende antecedentenverklaring, bedoeld in
      [artikel 3.77, elfde lid, van het Besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 4.30.2
    text: |-
      In afwijking van het eerste lid neemt de referent van een vreemdeling die in Nederland verblijft of wil verblijven
      in het kader van het volgen van het Internationaal Baccalaureaat diplomaprogramma, met betrekking tot de
      vreemdeling wiens referent hij is in de administratie op:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.2.a
    text: een bewijs van inschrijving van de vreemdeling aan de onderwijsinstelling;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.2.b
    text: een registratie van de studievoortgang van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.2.c
    text: |-
      de bewijsstukken die ten grondslag hebben gelegen aan de eigen verklaring bij de aanvraag om toelating van de
      vreemdeling, waarin de instelling stelt dat de vreemdeling zelfstandig en duurzaam beschikt over voldoende middelen
      van bestaan;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.2.d
    text: |-
      de eigen verklaring of eigen verklaringen waarin de vreemdeling na toelating jaarlijks verklaart zelfstandig en
      duurzaam te beschikken over voldoende middelen van bestaan;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.2.e
    text: |-
      een bewijsstuk waaruit blijkt dat door de vreemdeling het Internationale Baccalaureaat diplomaprogramma wordt
      gevolgd;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.2.f
    text: |-
      de door de vreemdeling ingevulde en ondertekende antecedentenverklaring, bedoeld in
      [artikel 3.77, elfde lid, van het Besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 4.30.3
    text: |-
      De referent van een vreemdeling die in Nederland verblijft of wil verblijven in het kader van studie aan het
      middelbaar beroepsonderwijs niveau 4, neemt met betrekking tot de vreemdeling wiens referent hij is in de
      administratie op:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.3.a
    text: een bewijs van inschrijving van de vreemdeling aan de onderwijsinstelling;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.3.b
    text: een registratie van de studievoortgang van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.3.c
    text: |-
      de bewijsstukken die ten grondslag hebben gelegen aan de eigen verklaring bij de aanvraag om toelating van de
      vreemdeling, waarin de instelling stelt dat de vreemdeling zelfstandig en duurzaam beschikt over voldoende middelen
      van bestaan;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: 4.30.3.d
    text: |-
      de door de vreemdeling ingevulde en ondertekende antecedentenverklaring, bedoeld in
      [artikel 3.77, elfde lid, van het Besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 4.30.4
    text: |-
      De referent van een vreemdeling, die in Nederland verblijft of wil verblijven in het kader van het volgen van
      het Internationaal Baccalaureaat diplomaprogramma neemt met betrekking tot zijn positie als referent in de
      administratie een bewijs van zijn accreditatie door de Internationale Baccalaureaat Organisatie op.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.30
  - number: '4.31'
    text: |-
      Bewijsstukken als bedoeld in de [artikelen 4.29, eerste lid, onderdeel d][ref1] en
      [4.30, eerste lid, onderdeel e, tweede lid, onderdeel c en derde lid, onderdeel c][ref2], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012002#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.31
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0012002
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
        afdeling: '2'
  - number: 4.31.a
    text: 'indien de middelen van bestaan worden gefinancierd door de vreemdeling zelf:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.31
  - number: 4.31.a.1°
    text: |-
      een kopie van een bankafschrift van een bankrekening mede of uitsluitend op naam van de vreemdeling, waarop het
      saldo dat voor het studiejaar ter beschikking staat is vermeld, of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.31
  - number: 4.31.a.2°
    text: |-
      een originele verklaring van de bank waaruit blijkt welk bedrag maandelijks ten gunste van de student wordt
      overgemaakt op een bankrekening, die mede of uitsluitend op naam van de vreemdeling staat;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.31
  - number: 4.31.b
    text: 'indien de middelen van bestaan worden gefinancierd door middel van een beurs:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.31
  - number: 4.31.b.1°
    text: een kopie van het document waaruit blijkt dat de studiebeurs is toegekend, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.31
  - number: 4.31.b.2°
    text: |-
      indien een derde partij via de onderwijsinstelling de beurs betaalt een kopie van de overeenkomst tussen een derde
      partij en de onderwijsinstelling;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.31
  - number: 4.31.c
    text: 'indien de middelen van bestaan worden gefinancierd door een derde financier die in het buitenland woont:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.31
  - number: 4.31.c.1°
    text: |-
      een originele verklaring van de bank waaruit blijkt welk bedrag maandelijks ten gunste van de vreemdeling wordt
      overgemaakt op de persoonlijke bankrekening van de vreemdeling, gedurende het verblijf in Nederland, of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.31
  - number: 4.31.c.2°
    text: |-
      een originele verklaring van de financier, waarin deze verklaart welk bedrag maandelijks wordt overgemaakt naar de
      persoonlijke bankrekening van de vreemdeling gedurende diens verblijf in Nederland, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.31
  - number: 4.31.c.3°
    text: een kopie van het paspoort van de financier, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.31
  - number: 4.31.c.4°
    text: een recent(e) bankafschrift of rekeningsspecificatie waar het rekeningsaldo van de financier op staat;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.31
  - number: 4.31.d
    text: 'indien de middelen van bestaan worden gefinancierd door een derde financier die in Nederland woont:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.31
  - number: 4.31.d.1°
    text: bewijsstukken omtrent het inkomen van de financier en van de eventuele (huwelijks)partner van de financier, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.31
  - number: 4.31.d.2°
    text: |-
      een kopie van het identiteitsbewijs van de financier en van de eventuele (huwelijks)partner als hij of zij
      Nederlander is;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.31
  - number: 4.31.e
    text: |-
      indien de middelen van bestaan worden gefinancierd uit middelen die zijn gestort op een rekening van de
      onderwijsinstelling een kopie van een bankafschrift van de onderwijsinstelling waarop het bedrag staat dat is
      gestort ten behoeve van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.31
  - number: '4.32'
    text: |-
      De referent van een vreemdeling die in Nederland verblijft of wil verblijven in het kader van seizoenarbeid, neemt
      met betrekking tot de vreemdeling wiens referent hij is in de administratie op:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.32
  - number: 4.32.a
    text: |-
      een door de vreemdeling ondertekende verklaring waarin deze verklaart direct voorafgaand aan de aanvraag om
      toelating in het kader van seizoenarbeid gedurende een aaneengesloten periode van tenminste veertien weken buiten
      Nederland te hebben verbleven;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.32
  - number: 4.32.b
    text: het aanvullend document;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.32
  - number: 4.32.c
    text: de arbeidsovereenkomst waaruit de duur en aard van het dienstverband en het overeengekomen inkomen blijken;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.32
  - number: 4.32.d
    text: de loonspecificaties;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.32
  - number: 4.32.e
    text: |-
      de door de vreemdeling ingevulde en ondertekende antecedentenverklaring, bedoeld in
      [artikel 3.77, elfde lid, van het Besluit][ref1], indien de referent erkend is krachtens
      [artikel 2c van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.32
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2c
  - number: '4.33'
    text: |-
      De referent van een vreemdeling die in Nederland verblijft of wil verblijven in het kader van lerend werken, neemt
      met betrekking tot de vreemdeling wiens referent hij is in de administratie op:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.33
  - number: 4.33.a
    text: |-
      de overeenkomst voor lerend werken, het leerplan of het stageprogramma waaruit de duur en de aard van het
      dienstverband of de stage en de overeengekomen onkostenvergoeding blijken;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.33
  - number: 4.33.b
    text: |-
      de originele tewerkstellingsvergunning of, indien een gecombineerde vergunning is verleend, het aanvullend
      document;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.33
  - number: 4.33.c
    text: de loonspecificaties of de specificaties van de stagevergoeding;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.33
  - number: 4.33.d
    text: |-
      de stageovereenkomst bedoeld in artikel 13, eerste lid, onderdelen a en i tot en met v, van richtlijn (EU)
      2016/801;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.33
  - number: 4.33.e
    text: |-
      de door de vreemdeling ingevulde en ondertekende antecedentenverklaring, bedoeld in
      [artikel 3.77, elfde lid, van het Besluit][ref1], indien de referent erkend is krachtens
      [artikel 2c van de Wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.33
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2c
  - number: '4.34'
    text: |-
      De referent van een vreemdeling die in Nederland verblijft of wil verblijven in het kader van arbeid in loondienst,
      neemt met betrekking tot de vreemdeling wiens referent hij is in de administratie op:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.34
  - number: 4.34.a
    text: |-
      de originele tewerkstellingsvergunning of, indien een gecombineerde vergunning is verleend, het aanvullend
      document;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.34
  - number: 4.34.b
    text: de arbeidsovereenkomst waaruit de duur en de aard van het dienstverband en het overeengekomen inkomen blijken;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.34
  - number: 4.34.c
    text: de loonspecificaties;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel4.34
  - number: 4.34.d
    text: |-
      de door de vreemdeling ingevulde en ondertekende antecedentenverklaring, bedoeld in
      [artikel 3.77, elfde lid, van het Besluit][ref1], indien de referent erkend is krachtens
      [artikel 2c van de Wet][ref2].


