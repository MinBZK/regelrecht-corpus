      [artikel 8, onder a of b, van de Wet][ref1] blijkt, aan de minderjarige vreemdeling die voor de eerste keer een
      zelfstandig verblijfsdocument aanvraagt, is de vreemdeling een bedrag van € 138 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34k
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.34k.2
    text: |-
      Ter zake van de afgifte van een document waaruit het rechtmatig verblijf, bedoeld in
      [artikel 8, onder e, van de Wet][ref1] blijkt, is de minderjarige vreemdeling een bedrag van € 46 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34k
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.34k.3
    text: |-
      In afwijking van het eerste lid is de minderjarige vreemdeling die het gezinslid is van een vreemdeling als bedoeld
      in [artikel 3.34j, vierde lid, onderdeel c][ref1] een bedrag van € 46 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34k
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.34l.1
    text: |-
      Als administraties, bedoeld in [artikel 24a, eerste lid, onder a, van de Wet][ref1], zijn aangewezen de
      administraties vermeld in kolom A van [bijlage 21][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34l
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 24a
      - id: ref2
        bwb_id: BWBR0012002
  - number: 3.34l.2
    text: |-
      Als gegevens en bescheiden, bedoeld in [artikel 24a, vierde lid, van de Wet][ref1], zijn aangewezen de gegevens en
      bescheiden vermeld in kolom B van [bijlage 21][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34l
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 24a
      - id: ref2
        bwb_id: BWBR0012002
  - number: 3.34m
    text: |-
      Indien de referent de eigen verklaring, bedoeld in [artikel 24a, tweede lid, van de Wet][ref1], niet kan afleggen,
      legt hij voor zover dit redelijkerwijs mogelijk is, de gegevens en bescheiden over op basis waarvan de Minister kan
      vaststellen of aan de voorwaarden wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel24a
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34m
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 24a
  - number: 3.36.1
    text: 'Daden van vervolging in de zin van artikel 1A van het Vluchtelingenverdrag moeten:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.36
  - number: 3.36.1.a
    text: |-
      zo ernstig van aard zijn of zo vaak voorkomen dat zij een ernstige schending vormen van de grondrechten van de
      mens, met name de rechten ten aanzien waarvan geen afwijking mogelijk is uit hoofde van artikel 15, tweede lid, van
      het EVRM; of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.36
  - number: 3.36.1.b
    text: |-
      een samenstel zijn van verschillende maatregelen, waaronder mensenrechtenschendingen, die voldoende ernstig zijn om
      iemand op een soortgelijke wijze te treffen als omschreven onder a.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.36
  - number: 3.36.2
    text: 'Daden van vervolging in de zin van het eerste lid kunnen onder meer de vorm aannemen van:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.36
  - number: 3.36.2.a
    text: daden van lichamelijk of geestelijk geweld, inclusief seksueel geweld;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.36
  - number: 3.36.2.b
    text: |-
      wettelijke, administratieve, politiële of gerechtelijke maatregelen die op zichzelf discriminerend zijn of op
      discriminerende wijze worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.36
  - number: 3.36.2.c
    text: onevenredige of discriminerende vervolging of bestraffing;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.36
  - number: 3.36.2.d
    text: |-
      ontneming van de toegang tot rechtsmiddelen, waardoor een onevenredig zware of discriminerende straf wordt
      opgelegd;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.36
  - number: 3.36.2.e
    text: |-
      vervolging of bestraffing wegens de weigering militaire dienst te vervullen tijdens een conflict, wanneer het
      vervullen van militaire dienst strafbare feiten of handelingen inhoudt die onder de uitsluitingsclausule van
      artikel 1F van het Vluchtelingenverdrag vallen;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.36
  - number: 3.36.2.f
    text: daden van genderspecifieke of kindspecifieke aard.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.36
  - number: 3.36.3
    text: |-
      Er moet een verband zijn tussen enerzijds de gronden voor vervolging genoemd in artikel 1A van het
      Vluchtelingenverdrag en anderzijds de daden, bedoeld in het eerste lid, die als vervolging worden aangemerkt of het
      ontbreken van bescherming tegen dergelijke daden.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.36
  - number: 3.37.1
    text: |-
      Bij de beoordeling van de gronden van vervolging in de zin van het Vluchtelingenverdrag wordt rekening gehouden met
      de volgende elementen:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37
  - number: 3.37.1.a
    text: het begrip «ras» omvat met name de aspecten huidskleur, afkomst of het behoren tot een bepaalde etnische groep;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37
  - number: 3.37.1.b
    text: |-
      het begrip «godsdienst» omvat met name theïstische, niet-theïstische en atheïstische geloofsovertuigingen, het
      deelnemen aan of het zich onthouden van formele erediensten in de particuliere of openbare sfeer, hetzij alleen
      of in gemeenschap met anderen, andere religieuze activiteiten of uitingen, dan wel vormen van persoonlijk of
      gemeenschappelijk gedrag die op een godsdienstige overtuiging zijn gebaseerd of daardoor worden bepaald;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37
  - number: 3.37.1.c
    text: |-
      het begrip «nationaliteit» is niet beperkt tot staatsburgerschap of het ontbreken daarvan, maar omvat met name ook
      het behoren tot een groep die wordt bepaald door haar culturele, etnische of linguïstische identiteit, door een
      gemeenschappelijke geografische of politieke oorsprong of door verwantschap met de bevolking van een andere staat;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37
  - number: 3.37.1.d
    text: 'een groep wordt geacht een specifieke sociale groep te vormen als met name:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37
  - number: 3.37.1.d.1°
    text: |-
      leden van de groep een aangeboren kenmerk vertonen of een gemeenschappelijke achtergrond hebben die niet gewijzigd
      kan worden, of een kenmerk of geloof delen dat voor de identiteit of de morele integriteit van de betrokkenen
      dermate fundamenteel is, dat van de betrokkenen niet mag worden geëist dat zij dit opgeven, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37
  - number: 3.37.1.d.2°
    text: |-
      de groep in het betrokken land een eigen identiteit heeft, omdat zij in haar directe omgeving als afwijkend wordt
      beschouwd;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37
  - number: 3.37.1.d
    text: |-
      Afhankelijk van de omstandigheden in het land van herkomst kan een specifieke sociale groep een groep zijn die
      als gemeenschappelijk kenmerk seksuele gerichtheid heeft. Seksuele gerichtheid omvat geen handelingen die volgens
      het nationale recht van de lidstaten als strafbaar worden beschouwd. Wanneer moet worden vastgesteld of iemand tot
      een bepaalde sociale groep behoort of wanneer een kenmerk van een dergelijke groep wordt geïdentificeerd, wordt er
      terdege rekening gehouden met genderaspecten, waaronder genderidentiteit;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37
  - number: 3.37.1.e
    text: |-
      het begrip «politieke overtuiging» houdt met name in dat de vreemdeling een opvatting, gedachte of mening heeft
      betreffende een aangelegenheid die verband houdt met de in [artikel 3.37a][ref1] genoemde potentiële actoren en hun
      beleid of methoden, ongeacht of de vreemdeling zich in zijn handelen door deze opvatting, gedachte of mening heeft
      laten leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 3.37.2
    text: |-
      Bij de beoordeling of de vrees van de vreemdeling voor vervolging in de zin van het Vluchtelingenverdrag gegrond
      is, doet het niet ter zake of de vreemdeling in werkelijkheid de raciale, godsdienstige, nationale, sociale of
      politieke kenmerken vertoont die aanleiding geven tot de vervolging indien deze kenmerken hem door de actor van de
      vervolging worden toegeschreven.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37
  - number: 3.37a
    text: 'Actoren van vervolging in de zin van het Vluchtelingenverdrag, dan wel van ernstige schade kunnen onder meer zijn:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37a
  - number: 3.37a.a
    text: de staat;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37a
  - number: 3.37a.b
    text: partijen of organisaties die de staat of een aanzienlijk deel van zijn grondgebied beheersen;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37a
  - number: 3.37a.c
    text: |-
      niet-overheidsactoren, indien kan worden aangetoond dat de actoren als bedoeld onder a en b, inclusief
      internationale organisaties, geen bescherming als bedoeld in [artikel 3.37c][ref1] kunnen of willen bieden tegen
      vervolging in de zin van het Vluchtelingenverdrag, dan wel tegen ernstige schade.


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37a
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 3.37b.1
    text: |-
      Een gegronde vrees voor vervolging in de zin van het Vluchtelingenverdrag of een reëel risico op ernstige schade
      kan gegrond zijn op gebeurtenissen die hebben plaatsgevonden nadat de vreemdeling het land van herkomst heeft
      verlaten.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37b
  - number: 3.37b.2
    text: |-
      Een gegronde vrees voor vervolging in de zin van het Vluchtelingenverdrag of een reëel risico op ernstige schade
      kan gegrond zijn op activiteiten van de vreemdeling sedert hij het land van herkomst heeft verlaten, met name
      wanneer wordt vastgesteld dat de betrokken activiteiten de uitdrukking en de voortzetting vormen van overtuigingen
      of strekkingen die de betrokkene in het land van herkomst aanhing.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37b
  - number: 3.37c.1
    text: 'Bescherming tegen vervolging, dan wel tegen ernstige schade kan alleen worden geboden door:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37c
  - number: 3.37c.1.a
    text: de staat, of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37c
  - number: 3.37c.1.b
    text: |-
      partijen of organisaties, met inbegrip van internationale organisaties, die de staat of een aanzienlijk deel van
      zijn grondgebied beheersen,
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37c
  - number: 3.37c.2
    text: |-
      Bescherming tegen vervolging of ernstige schade moet doeltreffend en van niet-tijdelijke aard zijn. In het algemeen
      wordt dergelijke bescherming geboden wanneer de actoren als bedoeld in het eerste lid, onder a en b, redelijke
      maatregelen tot voorkoming van vervolging of ernstige schade treffen, onder andere door de instelling van een
      doeltreffend juridisch systeem voor de opsporing, gerechtelijke vervolging en bestraffing van handelingen die
      vervolging of ernstige schade vormen, en wanneer de verzoeker toegang tot een dergelijke bescherming heeft.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37c
  - number: 3.37d.1
    text: |-
      Bij de beoordeling of een vreemdeling op grond van [artikel 29, eerste lid, onder a of b, van de Wet][ref1] in
      aanmerking komt voor een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28 van die wet][ref2] geldt
      dat een vreemdeling geen behoefte heeft aan bescherming, indien hij in een deel van het land van herkomst:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37d
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 3.37d.1.a
    text: geen gegronde vrees heeft voor vervolging of geen reëel risico op ernstige schade loopt; of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37d
  - number: 3.37d.1.b
    text: |-
      toegang heeft tot bescherming als bedoeld in [artikel 3.37c][ref1] tegen vervolging of tegen ernstige schade,


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37d
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
  - number: 3.37d.2
    text: |-
      Bij de beoordeling of de vreemdeling een gegronde vrees heeft voor vervolging of een reëel risico op ernstige
      schade loopt, of toegang heeft tot bescherming tegen vervolging of tegen ernstige schade in een deel van
      het land van herkomst overeenkomstig het eerste lid, wordt rekening gehouden met de algemene omstandigheden
      in dat deel van het land en met de persoonlijke omstandigheden van de vreemdeling in overeenstemming met
      [artikel 31 van de Wet][ref1]. Daartoe wordt ervoor gezorgd dat wordt beschikt over nauwkeurige en actuele
      informatie uit relevante bronnen, zoals de Hoge Commissaris van de Verenigde Naties voor vluchtelingen en het
      Europees Ondersteuningsbureau voor asielzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel31
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37d
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '31'
  - number: 3.37e.1
    text: |-
      De beoordeling of een derde land een veilig derde land is, als bedoeld in
      [artikel 30a, eerste lid, onder c, van de Wet][ref1], dient te stoelen op een reeks informatiebronnen, waaronder in
      het bijzonder informatie uit andere lidstaten, het Europees Ondersteuningsbureau voor asielzaken (EASO), de UNHCR,
      de Raad van Europa en andere relevante internationale organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37e
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30a
  - number: 3.37e.2
    text: De Minister onderzoekt de situatie in derde landen die zijn aangemerkt als veilige derde landen regelmatig opnieuw.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37e
  - number: 3.37e.3
    text: |-
      Bij de beoordeling of de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde
      tijd, als bedoeld in [artikel 28 van de Wet][ref1], niet-ontvankelijk wordt verklaard op grond van
      [artikel 30a, eerste lid, onder c, van de Wet][ref2], worden betrokken de verklaringen van de vreemdeling
      inhoudende dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37e
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 30a
  - number: 3.37e.3.a
    text: hij in het derde land zal worden blootgesteld aan vervolging of ernstige schade;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37e
  - number: 3.37e.3.b
    text: de band tussen hem en het derde land niet zodanig is dat het voor hem redelijk zou zijn naar dat land te gaan.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37e
  - number: 3.37e.4
    text: |-
      Eerder verblijf, als bedoeld in [artikel 3.106a, derde lid, van het Besluit][ref1] wordt in ieder geval aangenomen
      indien uit objectieve feiten of omstandigheden blijkt dat de vreemdeling in het land van herkomst niet de intentie
      had om naar Nederland te reizen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37e
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.37e.5
    text: |-
      Bij de uitvoering van een uitsluitend op [artikel 30a, eerste lid, onder c, van de Wet][ref1] gebaseerde
      beslissing, wordt aan de vreemdeling een document verschaft waarin de autoriteiten van het derde land in de taal
      van dat land ervan in kennis gesteld worden dat de asielaanvraag niet inhoudelijk is onderzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30a
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37e
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30a
  - number: 3.37f.1
    text: |-
      Een land wordt als veilig land van herkomst beschouwd als bedoeld in
      [artikel 30b, eerste lid, onder b, van de Wet][ref1], wanneer op basis van de rechtstoestand, de toepassing van
      de rechtsvoorschriften in een democratisch stelsel en de algemene politieke omstandigheden kan worden aangetoond
      dat er algemeen gezien en op duurzame wijze geen sprake is van vervolging, noch van foltering of onmenselijke
      of onterende behandeling of bestraffing, noch van bedreiging door willekeurig geweld in het kader van een
      internationaal of intern gewapend conflict.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30b
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37f
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30b
  - number: 3.37f.2
    text: |-
      Bij de beoordeling of een land als veilig land van herkomst wordt beschouwd, wordt onder meer rekening gehouden met
      de mate waarin bescherming wordt geboden tegen vervolging of mishandeling door middel van:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37f
  - number: 3.37f.2.a
    text: de desbetreffende wetten en andere voorschriften van het betrokken land en de wijze waarop die worden toegepast;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37f
  - number: 3.37f.2.b
    text: |-
      de naleving van de rechten en vrijheden die zijn neergelegd in het EVRM en/of het Internationaal Verdrag inzake
      burgerrechten en politieke rechten en/of het Verdrag van de Verenigde Naties tegen foltering, in het bijzonder de
      rechten waarop geen afwijkingen uit hoofde van artikel 15, lid 2, van het EVRM zijn toegestaan;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37f
  - number: 3.37f.2.c
    text: de naleving van het beginsel van non-refoulement overeenkomstig het Vluchtelingenverdrag;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37f
  - number: 3.37f.2.d
    text: |-
      het beschikbaar zijn van een systeem van daadwerkelijke rechtsmiddelen tegen schendingen van voornoemde rechten
      en vrijheden.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37f
  - number: 3.37f.3
    text: |-
      Met inachtneming van het eerste en het tweede lid zijn als veilige landen van herkomst als bedoeld in
      [artikel 3.105ba, eerste lid, van het Besluit][ref1] aangewezen de landen die zijn opgenomen in [bijlage 13][ref2]
      bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37f
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0012002
  - number: 3.37f.4
    text: 'Een land kan als veilig land van herkomst worden aangewezen met een uitzondering voor:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37f
  - number: 3.37f.4.a
    text: één of meer groepen;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37f
  - number: 3.37f.4.b
    text: een deel van het grondgebied.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37f
  - number: 3.37g
    text: |-
      Bij de beoordeling of een verblijfsvergunning voor bepaalde tijd, die is verleend op grond
      van [artikel 29, eerste lid, onder a of b, van de Wet][ref1], wordt ingetrokken op grond van
      [artikel 32, eerste lid, onder c, van de Wet][ref2], of de aanvraag voor verlenging van de geldigheidsduur ervan
      wordt afgewezen op die grond, wordt in aanmerking genomen of de wijziging van de omstandigheden een voldoende
      ingrijpend en niet-voorbijgaand karakter heeft om de gegronde vrees voor vervolging dan wel het reële risico op
      ernstige schade weg te nemen. De rechtsgrond voor verlening van de desbetreffende verblijfsvergunning heeft niet
      opgehouden te bestaan indien de vreemdeling dwingende redenen kan aanvoeren die voorvloeien uit vroegere vervolging
      dan wel uit vroegere ernstige schade, om te weigeren de bescherming in te roepen van het land waarvan hij de
      nationaliteit bezit, of, in het geval van een staatloze, van het land waar hij vroeger zijn gewone verblijfsplaats
      had.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel32
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.37g
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '32'
  - number: '3.41'
    text: |-
      Bij de indiening van de aanvraag, bedoeld in de [artikelen 28][ref1] en [33 van de Wet][ref2], verklaart de
      vreemdeling of de wettelijk vertegenwoordiger ermee bekend te zijn dat de verblijfsrechtelijke gegevens via de
      koppelingen tussen het IND-informatiesysteem en de BRP worden doorgegeven aan instanties die deze gegevens voor de
      beoordeling van voorzieningen nodig hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.41
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
  - number: '3.42'
    text: |-
      Voor de termijnen, genoemd in [artikel 3.110, eerste en tweede lid, van het Besluit][ref1],
      tellen mee de met algemeen erkende feestdagen gelijkgestelde dagen, bedoeld in
      [artikel 3, tweede en derde lid, van de Algemene termijnenwet][ref2], met uitzondering van 14 april 2017.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.42
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002448
        artikel: '3'
  - number: 3.43b.1
    text: |-
      Ter zake van de afdoening van een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 33 van de Wet][ref1], is de vreemdeling een bedrag van € 254 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.43b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
  - number: 3.43b.2
    text: |-
      In afwijking van het eerste lid is de vreemdeling van Turkse nationaliteit ter zake van de afdoening van een
      verblijfsvergunning als bedoeld in [artikel 33 van de Wet][ref1], een bedrag van € 85 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.43b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '33'
  - number: 3.43b.3
    text: |-
      De leges, bedoeld in het eerste lid, worden door de vreemdeling door middel van een in opdracht van de IND
      toegezonden acceptgirokaart voldaan.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.43b
  - number: 3.43b.4
    text: |-
      Ter zake van de afgifte ter uitvoering van [artikel 4.22, tweede lid, van het Besluit][ref1], van een vervangend
      document waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder c en d, van de Wet][ref2] blijkt, is de
      vreemdeling een bedrag van € 85 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.43b
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.43c.1
    text: |-
      Ter zake van de afgifte ter uitvoering van [artikel 4.22, eerste lid, van het Besluit][ref1], van een vervangend
      document waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder c, van de Wet][ref2] blijkt of ter zake van
      de afgifte van een vervangend document ter correctie van naar het oordeel van de Minister gedateerde of onjuiste
      gegevens, is de vreemdeling een bedrag van € 171 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.43c
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.43c.2
    text: |-
      Ter zake van de afgifte ter uitvoering van [artikel 4.22, eerste lid, van het Besluit][ref1], van een vervangend
      document waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder d, van de Wet][ref2] blijkt of ter zake van
      de afgifte van een vervangend document ter correctie van naar het oordeel van de Minister gedateerde of onjuiste
      gegevens, is de vreemdeling een bedrag van € 171 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.43c
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.43c.3
    text: |-
      In afwijking van het eerste en tweede lid is de vreemdeling van Turkse nationaliteit ter zake van de afgifte van
      een vervangend document waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder c of d, van de Wet][ref1]
      blijkt, een bedrag van € 85 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.43c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.43c.4
    text: |-
      In afwijking van het eerste en tweede lid is de vreemdeling die het gezinslid is van een vreemdeling als bedoeld
      in het derde lid ter zake van de afgifte van een vervangend document waaruit het rechtmatig verblijf, bedoeld in
      [artikel 8, onder c of d, van de Wet][ref1] blijkt, een bedrag van € 85 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.43c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.43d
    text: |-
      In afwijking van de [artikelen 3.43b, tweede en vierde lid][ref1] en [3.43c, derde en vierde lid][ref2], is de
      minderjarige vreemdeling een bedrag van € 46 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012002#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.43d
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0012002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: 3.43e
    text: |-
      In afwijking van de [artikelen 3.43b, eerste lid][ref1], en [3.43c, eerste en tweede lid][ref2], is de minderjarige
      vreemdeling een bedrag van € 85 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012002#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.43e
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0012002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '3'
  - number: '3.45'
    text: |-
      De persoon die de in [Hoofdstuk 3, Afdeling 5, Paragraaf 2 van het Besluit][ref1] bedoelde gehoren afneemt, draagt
      geen militair uniform of politie-uniform.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.45
    references:
      - id: ref1
        bwb_id: BWBR0011825
        paragraaf: '2'
  - number: 3.45a.1
    text: |-
      Van minderjarige vreemdelingen kunnen de in [Hoofdstuk 3, Afdeling 5, Paragraaf 2 van het Besluit][ref1]
      bedoelde gehoren worden afgenomen indien zij:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.45a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        paragraaf: '2'
  - number: 3.45a.1.a
    text: niet alleenstaand zijn en de leeftijd van vijftien jaar hebben bereikt;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.45a
  - number: 3.45a.1.b
    text: |-
      niet alleenstaand en tussen de twaalf en vijftien jaar zijn en zij dan wel hun wettelijk vertegenwoordiger hebben
      verzocht om te worden gehoord of indien er naar het oordeel van Onze Minister een goede reden is om hen te horen;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.45a
  - number: 3.45a.1.c
    text: alleenstaand zijn en de leeftijd van zes jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.45a
  - number: 3.45a.2
    text: De gehoren van minderjarige vreemdelingen worden afgenomen op een kindvriendelijke manier.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.45a
  - number: 3.45a.3
    text: |-
      De gehoren van de in het eerste lid, onder a en b, bedoelde vreemdelingen worden afgenomen door personen die zijn
      opgeleid om rekening te houden met de behoeften van minderjarige vreemdelingen.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.45a
  - number: 3.45a.4
    text: |-
      De gehoren van de in het eerste lid, onder c, bedoelde vreemdelingen worden afgenomen door personen die zijn
      opgeleid om rekening te houden met de behoeften van alleenstaande minderjarige vreemdelingen, zoveel mogelijk
      in aanwezigheid van hun voogd en, totdat zij de leeftijd van twaalf jaar hebben bereikt, in een kindvriendelijke
      hoorruimte.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.45a
  - number: 3.45b.1
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 28 van de Wet][ref1], kan met toepassing van [artikel 30c, eerste lid, onder a, van de Wet][ref2]
      buiten behandeling worden gesteld, nadat de vreemdeling twee keer in de gelegenheid is gesteld om informatie te
      verstrekken die van wezenlijk belang is voor zijn aanvraag en heeft verzuimd die informatie te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30c
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.45b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 30c
  - number: 3.45b.2
    text: |-
      De termijn van twee weken, bedoeld in [artikel 30c, eerste lid, onder b en c, van de Wet][ref1], vangt aan
      met ingang van de dag na die waarop bekend is geworden dat de vreemdeling niet is verschenen bij een gehoor
      onderscheidenlijk is verdwenen of zonder toestemming van de Minister is vertrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel30c
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.45b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 30c
  - number: '3.46'
    text: |-
      De in [artikel 3.122 van het Besluit][ref1] bedoelde informatie wordt verschaft door het verzenden dan wel
      uitreiken van een brochure aan de vreemdeling tegelijk met, dan wel zo spoedig mogelijk na de bekendmaking van
      de beschikking waarin de aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de Wet][ref2] wordt ingewilligd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.46
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: '3.47'
    text: |-
      Indien de aanvraag tot het verlenen van de verblijfsvergunning, bedoeld in de [artikelen 28][ref1] en
      [33 van de Wet][ref2], wordt ingetrokken, wordt daarvan een aantekening gemaakt in het dossier van de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.47
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '33'
  - number: 3.48.1
    text: |-
      Bij een beroep op [artikel 3.107a, tweede lid, onder e, van het Besluit][ref1]
      overlegt de aanvrager de beschikking, waarbij ontheffing van de inburgeringsplicht
      op grond van [artikel 5, eerste of tweede lid, van de Wet inburgering 2021][ref2] of
      [artikel 6, eerste of tweede lid, van de Wet inburgering][ref3], zoals die wet luidde onmiddellijk voorafgaand aan
      het tijdstip waarop de [Wet inburgering 2021][ref4] in werking treedt is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0020611
      [ref4]: https://wetten.overheid.nl/BWBR0044770
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.48
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0044770
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0020611
      - id: ref4
        bwb_id: BWBR0044770
  - number: 3.48.2
    text: |-
      Bij een beroep op [artikel 3.107a, derde lid, van het Besluit][ref1] overlegt de aanvrager de deskundigenverklaring
      als bedoeld in [artikel 2.7, eerste lid, van het Besluit inburgering 2021][ref2] of het advies als bedoeld in
      [artikel 2.8, eerste lid, van het Besluit inburgering][ref3], zoals dat besluit luidde onmiddellijk voorafgaand
      aan de inwerkingtreding van het [Besluit inburgering 2021][ref4], dat niet ouder is dan zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045555#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0045555
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.48
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0045555
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0045555
  - number: 3.48.3
    text: |-
      Het [derde en vierde lid van artikel 3.16][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.48
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '3.49'
    text: |-
      Duidelijke aanwijzingen dat de vreemdeling de eerste opvolgende asielaanvraag heeft ingediend
      louter teneinde de uitvoering van het terugkeerbesluit te vertragen of te verhinderen als bedoeld in
      [artikel 3.1, tweede lid, onder e, van het Besluit][ref1], zijn in ieder geval dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.49
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.49.a
    text: |-
      de vreemdeling bekend is met de datum waarop hij wordt uitgezet en de aanvraag indient kort voorafgaand aan zijn
      uitzetting terwijl:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.49
  - number: 3.49.a.1
    text: |-
      hij voldoende mogelijkheid heeft gehad om de aanvraag eerder in te dienen, maar hij daarvan geen gebruikt heeft
      gemaakt;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.49
  - number: 3.49.a.2
    text: hij de aanvraag niet heeft onderbouwd;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.49
  - number: 3.49.a.3
    text: |-
      de argumenten of bewijzen die hij heeft voorgelegd, evident niet relevant zijn voor de beoordeling van de aanvraag
      of evident niet kunnen leiden tot inwilliging van de aanvraag; of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.49
  - number: 3.49.a.4
    text: hij zijn eerder afgelegde verklaringen essentieel wijzigt of aanvult;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.49
  - number: 3.49.b
    text: |-
      de vreemdeling eerst na aanhouding of een periode van feitelijk verblijf te kennen geeft dat hij een aanvraag
      wil indienen, en er duidelijke aanwijzingen zijn dat hij daarvoor niet de bedoeling had zich uit vrije wil bij de
      autoriteiten te melden en een aanvraag te doen.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.49
  - number: '3.50'
    text: |-
      [Artikel 3.118b van het Besluit][ref1] is niet van toepassing op de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.50
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.50.a
    text: aan wie rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.50
  - number: 3.50.b
    text: |-
      die aannemelijk heeft gemaakt dat hij na afwijzing van de eerdere aanvraag is teruggekeerd naar het land van
      herkomst;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.50
  - number: 3.50.c
    text: die door de Minister is geïnformeerd over de datum van de vlucht ter fine van zijn verwijdering, of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.50
  - number: 3.50.d
    text: |-
      wiens eerdere aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de Wet][ref1] niet in behandeling is genomen op grond van [artikel 30 van de Wet][ref2] of niet-
      ontvankelijk is verklaard op grond van [artikel 30a, eerste lid, onder a, b, c of e, van de Wet](onbekend) en:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel30
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.50
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '30'
  - number: 3.50.d.1°
    text: deze afwijzingsgrond niet meer van toepassing is; of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.50
  - number: 3.50.d.2°
    text: |-
      de vreemdeling na afwijzing van de eerdere aanvraag vrijwillig is teruggekeerd naar of overgedragen is aan het land
      dat verantwoordelijk is voor de behandeling van zijn aanvraag.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.50
  - number: 3.51.1
    text: |-
      Ter zake van de afgifte ter uitvoering van [artikel 4.22, eerste lid, van het Besluit][ref1], van een vervangend
      document waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder b en d, van de Wet][ref2] blijkt, is de
      vreemdeling een bedrag van € 171 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.51
    references:
