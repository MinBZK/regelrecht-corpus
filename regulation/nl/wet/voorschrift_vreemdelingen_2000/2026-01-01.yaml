        artikel: 67e
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67f
  - number: 7.1g.2
    text: De gegevens, bedoeld in het eerste lid, worden niet doorgeleverd.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1g
  - number: 7.1ga.1
    text: |-
      De Immigratie- en Naturalisatiedienst kan desgevraagd aan de vereniging het Nederlandse
      Rode Kruis persoonsgegevens verstrekken die noodzakelijk zijn voor de taak als bedoeld in
      [artikel 3, vierde lid, onder c, van het Besluit Rode Kruis 1988][ref1], zijnde het opsporen van vermiste personen
      en het herstellen van contact tussen familieleden die van elkaar gescheiden zijn geraakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004470#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1ga
    references:
