  - number: 7.1f
    text: |-
      Indien aan een vreemdeling die arbeid voor een religieuze of levensbeschouwelijke organisatie wil verrichten
      rechtmatig verblijf op grond van [artikel 8, onder a, van de Wet][ref1], wordt verleend stelt de Minister de Dienst
      Uitvoering Onderwijs, in het kader van de uitvoering van de [Wet inburgering][ref2], daarvan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1f
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0020611
  - number: 7.1g.1
    text: |-
      De rijksbelastingdienst verstrekt de Minister desgevraagd gegevens over fiscale vergrijpboetes die op grond van de
      [artikelen 67d][ref1], [67e][ref2] en [67f van de Algemene wet inzake de Rijksbelastingen][ref3] zijn opgelegd, ten
      behoeve van de beoordeling van de erkenning als referent.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67d
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67e
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1g
    references:
