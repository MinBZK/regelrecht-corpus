        bwb_id: BWBR0011825
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.51.2
    text: |-
      In afwijking van het eerste lid is de vreemdeling een bedrag van € 85 verschuldigd ter zake van de afgifte van een
      vervangend document:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.51
  - number: 3.51.2.a
    text: |-
      waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder b, van de Wet][ref1] blijkt voor zover de
      vreemdeling van Turkse nationaliteit is en de vreemdeling direct voorafgaande aan de aanvraag houder is van een
      verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref2] onder een beperking verband houdend met het
      verrichten van arbeid als zelfstandige;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.51
