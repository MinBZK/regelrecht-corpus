      op grond van [artikel 8, onder a, f of g, van de Wet][ref1] – voor zover sprake is van een aanvraag tot het
      verlenen, verlengen of wijzigen van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref2], voor
      een verblijfsdoel als bedoeld in [artikel 3.4, eerste lid, onder p, van het Besluit][ref3] in het kader van
      mensenhandel of eergerelateerd geweld – blijkt, verstrekt door de korpschef.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
