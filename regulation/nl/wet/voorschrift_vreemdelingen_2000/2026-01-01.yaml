        artikel: '14'
  - number: 3.34j.4.c
    text: |-
      waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder a, b of l, van de Wet][ref1] blijkt voor zover de
      vreemdeling van Turkse nationaliteit is en het verrichten van arbeid is toegestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34j
    references:
