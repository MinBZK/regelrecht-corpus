  - number: '3.13'
    text: |-
      De vreemdeling met de Surinaamse nationaliteit die lager onderwijs in de Nederlandse taal, als bedoeld in
      [artikel 16, derde lid, van de Wet][ref1], heeft gevolgd, overlegt:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel16
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '16'
  - number: 3.13.a
    text: |-
      een schooldiploma of getuigschrift behaald in Suriname voor 25 november 1975 waaruit blijkt dat tenminste de
      lagere school in de Nederlandse taal is afgerond en een verklaring van het Centraal Bureau Burgerzaken voorzien
      van een apostille waaruit blijkt dat de vreemdeling ten tijde van afronding van deze school woonachtig is geweest
      in Suriname;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.13
  - number: 3.13.b
    text: |-
      een door het Surinaamse Ministerie van Onderwijs en Volksontwikkeling afgegeven schooldiploma of getuigschrift,
      behaald in Suriname na 25 november 1975, waaruit blijkt dat tenminste de lagere school in de Nederlandse taal is
      afgerond, dan wel een verklaring van het Examenbureau van het Ministerie van Onderwijs en Volksontwikkeling waaruit
      dit blijkt. Het diploma, het getuigschrift of de verklaring dient te zijn voorzien van een apostille;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.13
  - number: 3.13.c
    text: een in Nederland gehaald diploma hoger dan dat van het lager onderwijs;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.13
  - number: 3.13.d
    text: |-
      een historisch overzicht uit het Vestigingsregister te Den Haag waaruit blijkt dat de vreemdeling ten tijde van
      de afronding van de lagere school, op de leeftijd van elf dan wel twaalf of dertien jaar, woonachtig is geweest in
      Nederland; of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.13
  - number: 3.13.e
    text: |-
      een afschrift uit de BRP waaruit blijkt dat de vreemdeling ten tijde van de afronding van de lagere school, op de
      leeftijd van elf dan wel twaalf of dertien jaar, woonachtig is geweest in Nederland.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.13
  - number: 3.16.1
    text: |-
      Bij een beroep op [artikel 3.80a, tweede lid, onder e][ref1], of
      [artikel 3.96a, tweede lid, onder e, van het Besluit][ref2] overlegt de aanvrager de beschikking, waarbij ontheffing
      van de inburgeringsplicht op grond van [artikel 5, eerste of tweede lid, van de Wet inburgering 2021][ref3] of
      [artikel 6, eerste of tweede lid, van de Wet inburgering][ref4], zoals die wet luidde onmiddellijk voorafgaand aan
      het tijdstip waarop de [Wet inburgering 2021][ref5] in werking treedt is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0044770#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel6
