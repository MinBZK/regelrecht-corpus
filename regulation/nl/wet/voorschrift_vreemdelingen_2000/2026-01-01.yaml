  - number: 3.10.1
    text: |-
      De vreemdeling die een beroep doet op [artikel 3.71a, tweede lid, onder c, van het Besluit][ref1] en daarbij
      medische omstandigheden aanvoert, overlegt een verklaring van het model dat als bijlage 19 bij deze regeling is
      gevoegd, dat is ingevuld en ondertekend door een door het hoofd van de Nederlandse diplomatieke of consulaire
      vertegenwoordiging aangewezen arts. De verklaring mag niet ouder zijn dan zes maanden bij de indiening van de
      aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.10.2
    text: |-
      De kosten van een consult bij een door het hoofd van de Nederlandse diplomatieke of consulaire vertegenwoordiging
      aangewezen arts of deskundige zoals bedoeld in het eerste lid, komen voor rekening van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.10
  - number: 3.10.3
    text: |-
      De in het eerste lid bedoelde verklaring wordt aan de aangewezen arts aangeboden met de in [bijlage 19][ref1]
      opgenomen begeleidende brief en het in bijlage 19 opgenomen ingevulde registratieformulier.


      [ref1]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0012002
  - number: 3.11.1
    text: |-
      De examenprogramma’s, bedoeld in [artikel 3.98a, derde en zesde lid, van het Besluit][ref1], die zijn opgenomen in
      het zelfstudiepakket Naar Nederland, zijn verkrijgbaar bij alle erkende boekhandels en via internetboekhandels.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.11
