  - number: 3.16.3
    text: |-
      Ter zake van de door de Dienst Uitvoering Onderwijs (DUO) van het Ministerie van Onderwijs, Cultuur
      en Wetenschap afgenomen toets of de vreemdeling het leervermogen heeft om het examen, bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Wet inburgering][ref1], zoals die wet luidde onmiddellijk voorafgaand
      aan de inwerkingtreding van de [Wet inburgering 2021][ref2] of een diploma, certificaat of ander document als
      bedoeld in [artikel 5, eerste lid, onderdeel c, van die wet][ref3], te behalen, is de vreemdeling aan DUO een
      bedrag van € 150 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0044770
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.16
