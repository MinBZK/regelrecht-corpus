  - number: 3.34b
    text: |-
      In aanvulling op [artikel 3.34][ref1] en [3.34a][ref2] kan de Minister in overleg met de Minister van Buitenlandse
      Zaken bepalen dat de vastgestelde leges niet zijn verschuldigd in het belang van de internationale betrekkingen.


