      In aanvulling op [artikel 3.75, eerste lid, van het Besluit][ref1], zijn in het kader van verblijf als familie- of
      gezinslid middelen van bestaan verkregen uit arbeid in loondienst eveneens duurzaam, indien op het tijdstip waarop
      de aanvraag is ontvangen of de beschikking wordt gegeven een aaneengesloten periode van een jaar voldoende middelen
      van bestaan uit arbeid in loondienst zijn verworven en de middelen van bestaan nog zes maanden beschikbaar zijn.


