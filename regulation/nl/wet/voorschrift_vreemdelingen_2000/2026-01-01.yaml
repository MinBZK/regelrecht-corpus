articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *de BRP:* de basisregistratie personen;
        - *ernstige schade:* daden als bedoeld in artikel 15 van [richtlijn 2011/95/EU](32011L0095) van het Europees
      Parlement en de Raad van 13 december 2011 inzake normen voor de erkenning van onderdanen van derde landen of
      staatlozen als personen die internationale bescherming genieten, voor een uniforme status voor vluchtelingen of
      voor personen die in aanmerking komen voor subsidiaire bescherming, en voor de inhoud van de verleende bescherming
      (herschikking) (PbEU 2011 L 337);
        - *EVRM:* Verdrag tot bescherming van de rechten van de mens en de fundamentele vrijheden;
        - *het Besluit:* het Vreemdelingenbesluit 2000;
        - *Terugtrekkingsakkoord:* Akkoord van 12 november 2019 inzake de terugtrekking van het Verenigd Koninkrijk van
      Groot-Brittannië en Noord-Ierland uit de Europese Unie en de Europese Gemeenschap voor Atoomenergie (PbEU 2019, CI
      384); vervolging: vervolging als bedoeld in het Vluchtelingenverdrag.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.1
  - number: '1.2'
    text: |-
      Ter uitvoering van een verdrag waarbij de grenscontrole is verlegd naar de buitengrenzen, wordt onder 'Nederland'
      in de [artikelen 4.7][ref1] en [4.8][ref2] mede verstaan het grondgebied van andere bij dat verdrag aangesloten
      landen waarover de werking van dat verdrag zich uitstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012002#Artikel4
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0012002
