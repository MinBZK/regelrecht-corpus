        hoofdstuk: '4'
        afdeling: '1'
  - number: '1.3'
    text: |-
      Voorzover uit een wettelijk voorschrift niet anders voortvloeit, worden de bevoegdheden genoemd in deze regeling
      uitgeoefend namens de Minister. Bij de uitoefening van deze bevoegdheden worden de algemene en bijzondere
      aanwijzingen van de Minister in acht genomen.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.3
  - number: '1.4'
    text: |-
      De referent van een vreemdeling die in Nederland verblijft of wil verblijven voor arbeid als kennismigrant, voor
      een overplaatsing binnen een onderneming of voor arbeid als houder van een Europese blauwe kaart draagt er zorg
      voor dat de vreemdeling bij de werving en selectie op de hoogte wordt gesteld van de relevante regelgeving.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.4
  - number: '1.5'
    text: |-
      De referent van een vreemdeling die in het kader van uitwisseling als au pair in Nederland verblijft of wil
      verblijven draagt er zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.5
  - number: 1.5.a
    text: op zorgvuldige wijze wordt bemiddeld tussen de vreemdeling en het gastgezin;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.5
  - number: 1.5.b
    text: het gastgezin op zorgvuldige wijze wordt geselecteerd;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.5
  - number: 1.5.c
    text: |-
      indien hij op de hoogte is of vermoedens heeft van misbruik van een vreemdeling door een gastgezin plaatsing bij
      dit gastgezin achterwege blijft;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.5
  - number: 1.5.d
    text: |-
      het gastgezin en de vreemdeling bij de werving en selectie op de hoogte worden gesteld van de relevante
      regelgeving;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.5
  - number: 1.5.e
    text: hij zich ervan vergewist dat zowel het gastgezin als de vreemdeling zich aan de verplichtingen houden;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.5
  - number: 1.5.f
    text: |-
      hij zich vergewist van het welzijn en welbevinden van de vreemdeling gedurende het verblijf van de vreemdeling in
      het gastgezin;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.5
  - number: 1.5.g
    text: de vreemdeling zich te allen tijde kan wenden tot de referent met vragen en klachten;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.5
  - number: 1.5.h
    text: hij de vreemdeling op de hoogte stelt van het bestaan en de werking van het Meldpunt Misbruik au pairs, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.5
  - number: 1.5.i
    text: |-
      hij bij kennis of een redelijk vermoeden van onregelmatigheden, misstanden of misbruik en bij meldingen hiervan
      passende maatregelen treft.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.5
  - number: '1.6'
    text: |-
      De referent van een vreemdeling die in het kader van uitwisseling als uitwisselingsjongere, niet zijnde een au
      pair, in Nederland verblijft of wil verblijven draagt er zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.6
  - number: 1.6.a
    text: |-
      indien sprake is van verblijf in een gastgezin er op zorgvuldige wijze wordt bemiddeld tussen de vreemdeling en
      het gastgezin;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.6
  - number: 1.6.b
    text: |-
      de vreemdeling en, indien sprake is van verblijf in een gastgezin het gastgezin op zorgvuldige wijze wordt
      geselecteerd;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.6
  - number: 1.6.c
    text: |-
      indien hij op de hoogte is of vermoedens heeft van misbruik van een vreemdeling door een gastgezin plaatsing in dit
      gastgezin achterwege blijft;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.6
  - number: 1.6.d
    text: |-
      het gastgezin en de vreemdeling bij de werving en selectie op de hoogte worden gesteld van de relevante
      regelgeving;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.6
  - number: 1.6.e
    text: hij zich ervan vergewist dat de vreemdeling zich aan de verplichtingen houdt;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.6
  - number: 1.6.f
    text: hij zich vergewist van het welzijn en welbevinden van de vreemdeling gedurende zijn verblijf;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.6
  - number: 1.6.g
    text: de vreemdeling zich te allen tijde kan wenden tot de referent met vragen en klachten, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.6
  - number: 1.6.h
    text: |-
      hij bij kennis of een redelijk vermoeden van misbruik of misstanden en bij meldingen hiervan passende maatregelen
      treft.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.6
  - number: '1.8'
    text: |-
      De referent van een vreemdeling die in Nederland wil verblijven voor studie in het hoger onderwijs draagt er
      zorg voor dat alleen studenten worden geworven die toelaatbaar tot de opleiding zijn en dat de vreemdeling bij de
      werving en selectie op de hoogte wordt gesteld van de relevante regelgeving.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.8
  - number: 1.9.1
    text: |-
      Ten behoeve van het verblijf van een vreemdeling die in Nederland verblijft of wil verblijven voor
      studie, kan ook als referent optreden de krachtens [artikel 2c van de Wet][ref1] als referent erkende
      onderwijsinstelling, waaraan de vreemdeling voortgezet onderwijs volgt of wil volgen, die, voor zover op
      grond van de [Handelsregisterwet 2007][ref2] vereist, is ingeschreven in het handelsregister, bedoeld in
      [artikel 2 van die wet][ref3], en die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0021777
      [ref3]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
      - id: ref2
        bwb_id: BWBR0021777
      - id: ref3
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 1.9.1.a
    text: door de Internationale Baccalaureaat Organisatie geaccrediteerd is;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.9
  - number: 1.9.1.b
    text: het Internationale Baccalaureaat diplomaprogramma aanbiedt, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.9
  - number: 1.9.1.c
    text: |-
      deel uitmaakt van een internationale organisatie, waarbij een uitwisseling van leerlingen over de wereld
      plaatsvindt en het land van plaatsing wordt bepaald door landelijke comités van deze internationale organisatie, of
      die zijn leerlingen in een internaat plaatst.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.9
  - number: 1.9.2
    text: |-
      Ten behoeve van het verblijf van een vreemdeling die in Nederland verblijft of wil verblijven voor
      studie, kan ook als referent optreden de krachtens [artikel 2c van de Wet][ref1] als referent erkende
      onderwijsinstelling, waaraan de vreemdeling middelbaar beroepsonderwijs volgt of wil volgen die, voor zover
      op grond van de [Handelsregisterwet 2007][ref2] vereist, is ingeschreven in het handelsregister, bedoeld
      in [artikel 2 van de wet][ref3], en die is aangesloten bij de Gedragscode internationale student middelbaar
      beroepsonderwijs niveau 4 en is opgenomen in het daarbij behorende register.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0021777
      [ref3]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
      - id: ref2
        bwb_id: BWBR0021777
      - id: ref3
        bwb_id: BWBR0021777
        artikel: '2'
  - number: '1.10'
    text: |-
      Als referent van een vreemdeling die arbeid voor een religieuze of levensbeschouwelijke organisatie verricht of wil
      verrrichten kan slechts optreden:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.10
  - number: 1.10.a
    text: een religieuze of levensbeschouwelijke organisatie met rechtspersoonlijkheid, of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.10
  - number: 1.10.b
    text: |-
      een religieuze of levensbeschouwelijke organisatie die deel uitmaakt van een organisatie die rechtspersoonlijkheid
      heeft.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.10
  - number: 1.11.1
    text: |-
      Ter zake van de afdoening van een aanvraag om de erkenning als referent is de aanvrager een bedrag van € 5.080
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.11
  - number: 1.11.2
    text: |-
      In afwijking van het eerste lid is de aanvrager ter zake van de afdoening van een aanvraag om de erkenning als
      referent een bedrag van € 2.539 verschuldigd, indien:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.11
  - number: 1.11.2.a
    text: de aanvraag verband houdt met uitwisseling;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.11
  - number: 1.11.2.b
    text: |-
      de aanvraag verband houdt met arbeid en de aanvrager een onderneming met ten hoogste 50 medewerkers of een
      onderneming van een concern met ten hoogste 50 medewerkers betreft, of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.11
  - number: 1.11.2.c
    text: |-
      het een aanvraag om erkenning met toepassing van [artikel 1.13, tweede lid, onderdeel b tot en met d][ref1],
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel1
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: '1.12'
    text: |-
      De aanvrager om erkenning als referent die niet op grond van de [Handelsregisterwet 2007][ref1]
      inschrijvingsplichtig is en niet is ingeschreven in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref2], verstrekt bij de aanvraag de naam, de voornamen, de
      geboortedatum, de geboorteplaats, de nationaliteit, het burgerservicenummer en de functie van iedere bestuurder van
      de onderneming of rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0021777
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0021777
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 1.13.1
    text: |-
      De aanvrager om erkenning als referent legt bij de aanvraag een verklaring van betalingsgedrag als bedoeld in
      [artikel 1.1.12 van de Leidraad Invordering 2008](onbekend) over, die op de datum van de aanvraag niet ouder is dan
      drie maanden.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.13
  - number: 1.13.2
    text: |-
      In afwijking van het eerste lid verstrekt de aanvrager een ondernemingsplan indien de onderneming nog geen
      anderhalf jaar bestaat of nog geen anderhalf jaar bedrijfsactiviteiten heeft verricht, tenzij:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.13
  - number: 1.13.2.a
    text: |-
      de aanvrager een onderneming of rechtspersoon betreft die het volledige eigendom met volledige zeggenschap is
      van een onderneming of rechtspersoon die indien deze onderneming of rechtspersoon zelf de aanvraag indient niet
      verplicht is een ondernemingsplan ingevolge dit artikel over te leggen, in welk geval de aanvrager een verklaring
      van betalingsgedrag als bedoeld in [artikel 1.1.12 van de Leidraad Invordering](onbekend) van de onderneming of
      rechtspersoon waarvan het volledig eigendom is over legt;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.13
  - number: 1.13.2.b
    text: |-
      de aanvrager een onderneming of rechtspersoon betreft die voortkomt uit een fusie tussen twee ondernemingen of
      rechtspersonen die beide direct voorafgaand aan de aanvraag om erkenning zijn erkend als referent;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.13
  - number: 1.13.2.c
    text: |-
      de aanvrager een onderneming of rechtspersoon betreft die volledig is overgenomen door een onderneming of
      rechtspersoon die direct voorafgaand aan de aanvraag om erkenning zelf als referent is erkend;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.13
  - number: 1.13.2.d
    text: |-
      sprake is van een aanvraag om erkenning als referent vanwege een wijziging in de rechtsvorm van de onderneming of
      rechtspersoon van een erkend referent en uit de notariële akte blijkt dat:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.13
  - number: 1.13.2.d.1°
    text: de aard van de ondernemingsactiviteiten niet is uitgebreid, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.13
  - number: 1.13.2.d.2°
    text: de zeggenschap in de nieuwe onderneming of rechtspersoon gelijk blijft; of
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.13
  - number: 1.13.2.e
    text: |-
      de aanvrager een uitwisselingsorganisatie in het kader van uitwisseling van au pairs die is gevestigd in een andere
      lidstaat van de Europese Unie of Europese Economische Ruimte betreft.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.13
  - number: 1.13.3
    text: |-
      Indien de aanvrager een vestiging van een onderneming betreft die onderdeel uitmaakt van een buitenlandse
      onderneming, kan de aanvrager, in afwijking van het eerste en tweede lid, de continuïteit en solvabiliteit aantonen
      door een verklaring van bekendheid van de Netherlands Foreign Investment Agency van het Ministerie van Economische
      Zaken over te leggen.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.13
  - number: 1.13.4
    text: |-
      Indien er naar het oordeel van de Minister of de Minister van Economische Zaken twijfel bestaat of de continuïteit
      en solvabiliteit voldoende zijn gewaarborgd verstrekt de aanvrager, in afwijking van het eerste, tweede en derde
      lid:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.13
  - number: 1.13.4.a
    text: |-
      in het geval de aanvrager een onderneming betreft die nog geen anderhalf jaar bestaat of nog geen anderhalf jaar
      bedrijfsactiviteiten heeft verricht een ondernemingsplan;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.13
  - number: 1.13.4.b
    text: |-
      in het geval de aanvrager een onderneming betreft die langer dan anderhalf jaar maar korter dan drie jaar bestaat
      of langer dan anderhalf jaar maar korter dan drie jaar bedrijfsactiviteiten heeft verricht een ondernemingsplan en
      de beschikbare, door een onafhankelijke partij geverifieerde jaarrekeningen en geverifieerde exploitatieprognoses
      en liquiditeitsprognoses voor de komende twee jaar inclusief toelichting op de uitgangspunten;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.13
  - number: 1.13.4.c
    text: |-
      in het geval de aanvrager een onderneming betreft die langer dan drie jaar bestaat of langer dan drie jaar
      bedrijfsactiviteiten heeft verricht, door een onafhankelijke partij geverifieerde jaarrekeningen van de afgelopen
      drie jaren en geverifieerde exploitatieprognoses en liquiditeitsprognoses voor de komende twee jaar inclusief
      toelichting op de uitgangspunten.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.13
  - number: 1.13.5
    text: |-
      Voor de beoordeling of de continuïteit en solvabiliteit van de onderneming voldoende zijn gewaarborgd, worden de
      bewijsmiddelen, bedoeld in het tweede en vierde lid, ter advisering voorgelegd aan de Rijksdienst voor Ondernemend
      Nederland.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.13
  - number: 1.13.6
    text: |-
      Indien de aanvrager om erkenning als referent in het kader van uitwisseling van au pairs een
      uitwisselingsorganisatie betreft die is gevestigd in een andere lidstaat van de Europese Unie of Europese
      Economische Ruimte, is een verklaring die vergelijkbaar is met de verklaring, bedoeld in het eerste lid, vereist,
      voor zover die in de betreffende lidstaat verkrijgbaar is. Indien een vergelijkbare verklaring niet verkrijgbaar
      is, toont de aanvrager op andere wijze de continuïteit en solvabiliteit aan.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.13
  - number: '1.14'
    text: |-
      Een onderneming die zich bezighoudt met het ter beschikking stellen van arbeidskrachten of payrolling, bedoeld in
      [artikel 1, aanhef en onder c en d, van de Wet allocatie arbeidskrachten door intermediairs][ref1] wordt alleen
      erkend als referent indien de onderneming is opgenomen in het register van de Stichting normering arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel1
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '1'
  - number: '1.15'
    text: |-
      De aanvrager om erkenning als referent legt desgevraagd een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1] over.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.15
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 1.15a
    text: 'De erkenning als referent kan worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.15a
  - number: 1.15a.a
    text: |-
      er in de afgelopen drie jaar ten behoeve van een vreemdeling geen machtiging tot voorlopig verblijf of een
      verblijfsvergunning als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref1] is verleend, en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.15a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 1.15a.b
    text: er geen vreemdeling is waarvoor de referent als erkend referent optreedt.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.15a
  - number: 1.16.1
    text: |-
      Als administraties, bedoeld in [artikel 2d, eerste lid][ref1], en [2t, eerste lid, onder a, van de Wet][ref2], zijn
      aangewezen de administraties vermeld in kolom A van [bijlage 20][ref3] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2d
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2t
      [ref3]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.16
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2d
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2t
      - id: ref3
        bwb_id: BWBR0012002
  - number: 1.16.2
    text: |-
      Als gegevens en bescheiden, bedoeld in [artikel 2d, derde lid][ref1], en [2t, vierde lid, van de Wet][ref2], zijn
      aangewezen de gegevens en bescheiden vermeld in kolom B van [bijlage 20][ref3] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2d
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2t
      [ref3]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.16
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2d
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2t
      - id: ref3
        bwb_id: BWBR0012002
  - number: 1.17.1
    text: |-
      Ter zake van de afdoening van een aanvraag tot het verlenen of wijzigen van een terugkeervisum is de vreemdeling
      een bedrag van € 197 verschuldigd.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.17
  - number: 1.17.2
    text: |-
      In afwijking van het eerste lid is de vreemdeling die valt onder
      [artikel 1, eerste lid, van de Wet betreffende de positie van Molukkers][ref1], geen leges verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003052#Artikel1
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.17
    references:
      - id: ref1
        bwb_id: BWBR0003052
        artikel: '1'
  - number: 1.17.3
    text: |-
      In afwijking van het eerste lid is de vreemdeling die valt onder artikel 41, eerste lid, van het op 23 november
      1970 te Brussel tot stand gekomen Aanvullend Protocol bij de op 12 september 2963 te Ankara gesloten Overeenkomst
      waarbij een associatie tot stand wordt gebracht tussen de Europese Economische Gemeenschap en Turkije
      (Trb. 1971,70) of artikel 6, 7 of 13 van het Besluit 1/80 van de Associatieraad EEG-Turkije betreffende de
      ontwikkeling van de Associatie, een bedrag van € 57 verschuldigd.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel1.17
  - number: 2.1.1
    text: |-
      Als luchthavens, bedoeld in [artikel 2.2, eerste lid, van het Besluit][ref1], zijn aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '2'
  - number: 2.1.1.a
    text: |-
      de luchthavens die zijn opgenomen in [bijlage 1][ref1] bij deze regeling, en


      [ref1]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0012002
  - number: 2.1.1.b
    text: |-
      de luchthavens, vanaf welke vluchten vertrekken voor het vervoer van personen in het ongeregeld vervoer, als
      bedoeld in het [Besluit Vracht- en overige vluchten][ref1] van de Minister van Infrastructuur en Milieu, met
      uitzondering van de vluchten die door onze Minister door tussenkomst van de Minister van Infrastructuur en Milieu
      van de verplichting tot het maken van een afbeelding zijn ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0003376
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0003376
  - number: 2.1.2
    text: |-
      De Minister kan bepalen dat de verplichtingen ingevolge [artikel 2.2 van het Besluit][ref1] voor één of meer
      vervoerders vanaf één of meer van de in het eerste lid, onder a, genoemde luchthavens tijdelijk worden opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '2'
  - number: 2.1.3
    text: |-
      De Minister kan bepalen dat de verplichtingen ingevolge [artikel 2.2 van het Besluit][ref1] van toepassing zijn op
      één of meer vervoerders door wiens tussenkomst de aanvoer van niet- of onvoldoende gedocumenteerde vreemdelingen op
      korte termijn vanaf een bepaalde, niet in het eerste lid, onder a, genoemde luchthaven aanzienlijk is toegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '2'
  - number: 2.1a.1
    text: |-
      De vervoerder, bedoeld in [artikel 2.2a, eerste lid, van het Besluit][ref1], verzamelt de passagiersgegevens,
      bedoeld in artikel 2.2a, derde lid, van het Besluit, ten aanzien van alle passagiers die hij naar een luchthaven
      in Nederland vervoert vanaf een luchthaven die niet in de Europese Unie of een land dat betrokken is bij de
      uitvoering, de toepassing en de ontwikkeling van het Schengenacquis gelegen is.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.1a
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '2'
  - number: 2.1a.2
    text: |-
      De vervoerder zendt de krachtens het eerste lid verzamelde passagiersgegevens elektronisch, voor het einde van de
      instapcontroles aan de ambtenaar belast met de grensbewaking aan het door die ambtenaar aangegeven adres.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.1a
  - number: 2.1a.3
    text: |-
      De ingevolge het tweede lid te zenden gegevens worden verzonden in een bericht met de structuur die is gebaseerd
      op de vanwege de Economische Commissie voor Europa van de Verenigde Naties vastgestelde indeling voor elektronische
      gegevensuitwisseling voor overheid, handel en vervoer, gepubliceerd onder de titel: Electronic Data Interchange For
      Administration, Commerce and Transport (EDIFACT) Passenger List Message (PAXLST).
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.1a
  - number: '2.2'
    text: |-
      Als de staten, bedoeld in [artikel 2.3, derde lid, onder a, van het Besluit][ref1], zijn aangewezen de staten,
      vermeld in [bijlage 2][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012002
  - number: '2.3'
    text: |-
      Als de categorieën vreemdelingen, bedoeld in [artikel 2.3, derde lid, onder b, van het Besluit][ref1] zijn
      aangewezen de vreemdelingen die behoren tot een van de categorieën, opgenomen in [bijlage 3][ref2] bij deze
      regeling, voor zover de vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012002
  - number: 2.3.a
    text: voldoet aan de voor hem gestelde voorwaarden, en
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.3
  - number: 2.3.b
    text: zich naar Nederland begeeft voor een tijdsduur of doel als aangegeven bij die categorie.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.3
  - number: '2.4'
    text: |-
      Als de vliegvelden in Nederland, bedoeld in [artikel 2.4, derde lid, van het Besluit][ref1], zijn aangewezen de
      vliegvelden, vermeld in [bijlage 4][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012002
  - number: 2.6.1
    text: |-
      De aantekening, bedoeld in [artikel 2.4, vijfde lid, van het Besluit][ref1], luidt: 'Toegang tot het Beneluxgebied
      verleend van (datum) tot (datum), [artikel 2.4, tweede/vijfde lid, Vreemdelingenbesluit][ref2] (inreisstempel en
      handtekening van ambtenaar die toegang verleent)'.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '2'
  - number: 2.6.2
    text: |-
      Het model van de afzonderlijke verklaring, waaruit het verlenen van toegang op grond van
      [artikel 2.4, tweede lid, van het Besluit][ref1] blijkt, is opgenomen in [bijlage 5][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012002
  - number: '2.9'
    text: |-
      Voor de ondertekening door een daartoe solvabele derde van de garantverklaring, bedoeld in
      [artikel 2.11, derde lid, van het Besluit][ref1], wordt bij het verlenen van toegang aan:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel2
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '2'
  - number: 2.9.a
    text: |-
      een zeeman of meerdere zeelieden gebruik gemaakt van het model, dat als [bijlage 6a][ref1] onderscheidenlijk als
      [bijlage 6b][ref2] bij deze regeling is gevoegd;


      [ref1]: https://wetten.overheid.nl/BWBR0012002
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0012002
      - id: ref2
        bwb_id: BWBR0012002
  - number: 2.9.b
    text: |-
      een andere vreemdeling gebruik gemaakt van het model, dat als [bijlage 6c][ref1] bij deze regeling is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0012002
  - number: 2.10.1
    text: |-
      De ambtenaren, bedoeld in [artikel 46, eerste lid, onder a en b][ref1], dan wel
      [47, eerste lid, onder a en b, van de Wet][ref2], zijn bevoegd een machtiging tot voorlopig verblijf
      dan wel terugkeervisum in te trekken dan wel te annuleren op de gronden en in de gevallen, bedoeld in
      [artikel 2m, derde en vierde lid, van de Wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel2m
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 2m
  - number: 2.10.2
    text: |-
      De ambtenaren belast met de grensbewaking zijn bevoegd de vreemdeling aan wie de toegang is geweigerd, de
      maatregel, bedoeld in [artikel 6, eerste lid, van de Wet][ref1], op te leggen dan wel deze in overeenstemming met
      [artikel 6a van de Wet][ref2] voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel6a
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 6a
  - number: 2.10.3
    text: |-
      De bevoegde ambtenaren van de Immigratie- en Naturalisatiedienst kunnen besluiten de maatregel, bedoeld in artikel
      6, eerste en tweede lid, voort te zetten in overeenstemming met [artikel 6a van de Wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6a
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 6a
  - number: 2.10.4
    text: |-
      De oplegging of opheffing van de maatregel, bedoeld in [artikel 6, eerste en tweede lid, van de Wet][ref1], met
      toepassing van artikel 6, zesde lid, van de Wet vindt plaats door de bevoegde ambtenaren van de Immigratie- en
      Naturalisatiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel6
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '6'
  - number: 3.1.1
    text: |-
      Als document waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder a tot en met d, van de Wet][ref1],
      blijkt, zijn aangewezen de volgende documenten en schriftelijke verklaringen, waarbij het vastgestelde model van
      dat document of die schriftelijke verklaring wordt aangegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.1.1.a
    text: |-
      voor vreemdelingen met rechtmatig verblijf als bedoeld in [artikel 8, onder a, van de Wet][ref1]: het document
      I van het model dat als [bijlage 7a][ref2] bij deze regeling is gevoegd of een schriftelijke verklaring, waaruit
      volgt dat een onderdaan van het Verenigd Koninkrijk of zijn familielid hier een tijdelijk verblijfsrecht op grond
      van [artikel 3.4, derde lid, van het Besluit][ref3] geniet, dat als [bijlage 7a2][ref4] en [bijlage 7a3][ref5] bij
      deze regeling is gevoegd;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012002
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0012002
      [ref5]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0012002
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0012002
      - id: ref5
        bwb_id: BWBR0012002
  - number: 3.1.1.b
    text: |-
      voor vreemdelingen met rechtmatig verblijf als bedoeld in [artikel 8, onder b, van de Wet][ref1]: het document II
      van het model dat als [bijlage 7b][ref2] bij deze regeling is gevoegd indien de vreemdeling rechtmatig verblijf
      heeft op grond van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 20 van de Wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012002
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0012002
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 3.1.1.c
    text: |-
      voor vreemdelingen met rechtmatig verblijf als bedoeld in [artikel 8, onder c, van de Wet][ref1]: het document III
      van het model dat als [bijlage 7c][ref2] bij deze regeling is gevoegd;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012002
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0012002
  - number: 3.1.1.d
    text: |-
      voor vreemdelingen met rechtmatig verblijf als bedoeld in [artikel 8, onder d, van de Wet][ref1]: het document IV
      van het model dat als [bijlage 7d][ref2] bij deze regeling is gevoegd indien de vreemdeling rechtmatig verblijf
      heeft op grond van een verblijfsvergunning voor onbepaalde tijd als bedoeld in [artikel 33 van de Wet][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012002
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel33
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0012002
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '33'
  - number: 3.1.1.e
    text: |-
      voor vreemdelingen met rechtmatig verblijf als bedoeld in [artikel 8, onder b en d, van de Wet][ref1]: het
      document V van het model dat als [bijlage 7d2][ref2] bij deze regeling is gevoegd indien de vreemdeling
      rechtmatig verblijf heeft op grond van een EU-verblijfsvergunning voor langdurig ingezetenen als bedoeld in
      [artikel 45a van de Wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012002
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel45a
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0012002
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 45a
  - number: 3.1.2
    text: |-
      De beperking waaronder de verblijfsvergunning voor bepaalde tijd, bedoeld in [artikel 14 van de Wet][ref1], wordt
      verleend, wordt vermeld op het document of de schriftelijke verklaring, bedoeld in het eerste lid, onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.1.3
    text: |-
      Op het document, bedoeld in het eerste lid, onder a, worden onder de rubriek ‘opmerkingen’ de volgende opmerkingen
      vermeld:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.3.a
    text: |-
      indien Nederland aan de houder van de Europese blauwe kaart internationale bescherming heeft verleend:
      ‘Internationale bescherming verleend door Nederland op [datum]’;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.3.b
    text: |-
      indien de houder van de Europese blauwe kaart in een andere lidstaat internationale bescherming geniet:
      ‘Internationale bescherming verleend door [naam van de lidstaat] op [datum]’;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.3.c
    text: |-
      indien de Europese blauwe kaart wordt verleend op basis van hogere beroepsvaardigheden in overige beroepen,
      als bedoeld in [artikel 3.30b, derde lid, onder b, van het Besluit][ref1]: ‘Beroepen die niet in bijlage I zijn
      opgenomen’.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.1.4
    text: |-
      Voor zover van toepassing, wordt op het document, bedoeld in het eerste lid, onder e, onder de rubriek
      ‘opmerkingen’ vermeld ‘voormalig houder van een Europese blauwe kaart’.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5
    text: |-
      Op het document of de schriftelijke verklaring, bedoeld in het eerste lid, onder b, c, d en e, wordt de aantekening
      gesteld ‘arbeid vrij toegestaan, TWV niet vereist’. Op het document of de schriftelijke verklaring, bedoeld in het
      eerste lid, onder a, wordt de aantekening gesteld:
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5.a
    text: ‘Arbeid vrij toegestaan, TWV niet vereist’;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5.b
    text: ‘TWV niet vereist voor specifieke arbeid, andere arbeid niet toegestaan’;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5.c
    text: ‘TWV vereist voor arbeid van bijkomende aard, andere arbeid in loondienst niet toegestaan’;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5.d
    text: ‘Arbeid toegestaan mits TWV is verleend’;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5.e
    text: ‘TWV vereist voor specifieke arbeid, andere arbeid niet toegestaan’;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5.f
    text: ‘TWV niet vereist voor specifieke arbeid, andere arbeid toegestaan mits TWV is verleend’;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5.g
    text: ‘Arbeid als kennismigrant en zelfstandige toegestaan, andere arbeid toegestaan met TWV’;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5.h
    text: ‘Arbeid als houder van de Europese blauwe kaart en zelfstandige toegestaan, andere arbeid toegestaan met TWV’;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5.i
    text: ‘Arbeid in loondienst alleen toegestaan met TWV’;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5.j
    text: Arbeid als zelfstandige toegestaan, arbeid in loondienst alleen toegestaan met TWV;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5.k
    text: ‘Arbeid toegestaan, TWV alleen gedurende eerste 12 maanden vereist’;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5.l
    text: ‘Arbeid niet toegestaan’;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5.m
    text: ‘arbeid toegestaan conform aanvullend document’;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5.n
    text: |-
      ‘arbeid wegens overplaatsing binnen een onderneming en arbeid als zelfstandige toegestaan, andere arbeid toegestaan
      met TWV;’
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5.o
    text: ‘TWV niet vereist voor incidentele arbeid in het kader van WHP/WHS, andere arbeid niet toegestaan’;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.5.p
    text: arbeid als zelfstandige toegestaan, arbeid vrij toegestaan, TWV niet vereist.
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
  - number: 3.1.6
    text: |-
      De aantekening, bedoeld in [artikel 3.4, derde lid, van het Besluit][ref1] luidt: ‘beroep op algemene middelen kan
      gevolgen hebben voor verblijfsrecht’.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 3.1.7
    text: |-
      De documenten, bedoeld in het eerste lid, zijn ingevolge [artikel 4.21, eerste lid, onder a, van het Besluit][ref1]
      tevens vastgesteld als document ter vaststelling van de identiteit, nationaliteit en verblijfsrechtelijke positie
      van vreemdelingen met rechtmatig verblijf als bedoeld in [artikel 8, onder a tot en met d, van de Wet][ref2].
      Voor de schriftelijke verklaring als bedoeld in het eerste lid, onder a, geldt dat deze enkel in combinatie
      met een geldig grensoverschrijdend document wordt beschouwd als document ter vaststelling van de identiteit,
      nationaliteit en verblijfsrechtelijke positie van vreemdelingen met rechtmatig verblijf als bedoeld
      in[ artikel 8, onder a, van de Wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.1
