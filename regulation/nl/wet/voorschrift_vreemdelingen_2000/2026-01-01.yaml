    text: |-
      Als vreemdelingen, bedoeld in [artikel 3.1a, eerste lid, aanhef en onder e, van het Besluit][ref1], zijn aangewezen
      vreemdelingen die:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.9a
    references:
