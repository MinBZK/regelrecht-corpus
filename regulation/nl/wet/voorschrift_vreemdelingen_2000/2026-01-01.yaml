        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7.1l.1
    text: |-
      Als gemachtigden, bedoeld in [artikel 8.34, eerste lid, van het Besluit][ref1], zijn aangewezen de ambtenaren,
      bedoeld in artikel 9 van de Wbp-regeling Basisvoorziening vreemdelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1l
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
  - number: 7.1l.2
    text: |-
      Als gemachtigden, bedoeld in [artikel 8.34, derde lid, van het Besluit][ref1], zijn aangewezen de ambtenaar of
      medewerker van de ketenpartners, bedoeld in hoofdstuk 2.2 van het Protocol Identificatie en Labeling die uit hoofde
      van hun functie de verificatie van persoonsgegevens uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1l
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '8'
  - number: 7.1l.3
    text: |-
      Ten behoeve van de verstrekking van gegevens uit de vreemdelingenadministratie, bedoeld in
      [artikel 107 van de Wet][ref1], op basis van vergelijking van vingerafdruksporen met vingerafdrukken uit het
      biometrieregister in de vreemdelingenadministratie, zijn slechts de ambtenaren van politie bevoegd die uit hoofde
      van hun functie als dactyloscopisch expert werkzaam of aangesteld zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel7.1l
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: '7.2'
    text: |-
      De [artikelen 3.1][ref1] en [3.2][ref2] zijn niet van toepassing op kinderen beneden de leeftijd van twaalf
      jaar, die bij een van hun ouders inwonen, indien in het aan deze ouder verstrekte document, bedoeld in de
      [artikelen 3.1][ref3] en [3.2][ref4], is aangetekend dat de hem verleende verblijfsvergunning mede voor deze
      kinderen geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012002#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0012002#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0012002#Artikel3
