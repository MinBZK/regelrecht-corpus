    text: |-
      de door de vreemdeling ingevulde en ondertekende antecedentenverklaring, bedoeld in
      [artikel 3.77, elfde lid, van het Besluit][ref1], indien de referent erkend is krachtens
      [artikel 2c van de Wet][ref2].


