  - number: 3.34c.2
    text: |-
      In afwijking van [artikel 3.34][ref1] en [3.34a][ref2] is de vreemdeling voor een aanvraag tot het wijzigen van
      een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref3], onder een beperking verband houdend met
      tijdelijke humanitaire gronden op grond van [artikel 3.48, tweede lid, aanhef en onder b, van het Besluit][ref4]
      en [artikel 3.24aa, eerste lid, aanhef en onder f][ref5], in verband met een ondertoezichtstelling, in een
      verblijfsvergunning als bedoeld in artikel 14 van de Wet, onder een beperking verband houdend met niet-tijdelijke
      humanitaire gronden op grond van [artikel 3.51, derde lid, van het Besluit][ref6] en artikel 3.24aa, tweede lid,
      aanhef en onder j, in verband met een ondertoezichtstelling, een bedrag van € 85 verschuldigd.


