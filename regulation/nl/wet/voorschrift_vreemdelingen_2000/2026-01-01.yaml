  - number: 3.34d
    text: |-
      In afwijking van [artikel 3.34][ref1] is de vreemdeling geen leges verschuldigd ter zake van de afdoening van een
      aanvraag tot het verlengen van een verblijfsvergunning als bedoeld in [artikel 14 van de Wet][ref2], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0012002#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34d
    references:
      - id: ref1
        bwb_id: BWBR0012002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 3.34d.a
    text: |-
      deze aanvraag gelijktijdig is ontvangen met een aanvraag tot het wijzigen van een verblijfsvergunning, tenzij deze
      aanvragen zijn ontvangen een jaar of langer voordat de geldigheidsduur van de verblijfsvergunning afloopt;
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34d
  - number: 3.34d.b
    text: |-
      deze aanvraag gelijktijdig is ontvangen met een aanvraag tot het verlenen van een verblijfsvergunning als
      bedoeld in [artikel 20 van de Wet][ref1], tenzij deze aanvragen zijn ontvangen een jaar of langer voordat de
      geldigheidsduur van de vergunning afloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34d
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 3.34g.1
    text: |-
      Ter zake van de afdoening van een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 20 van de Wet][ref1] of een EU-verblijfsvergunning voor langdurig ingezetenen, is de vreemdeling een
      bedrag van € 254 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34g
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 3.34g.2
    text: |-
      In afwijking van het eerste lid is de vreemdeling van Turkse nationaliteit aan wie het verrichten van arbeid is
      toegestaan ter zake van de afdoening van een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld
      in [artikel 20 van de Wet][ref1] of een EU-verblijfsvergunning voor langdurig ingezetenen, een bedrag van € 85
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34g
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 3.34g.3
    text: |-
      In afwijking van het eerste lid is het toegelaten gezinslid van een vreemdeling als bedoeld in het tweede
      lid, ter zake van de afdoening van een aanvraag tot het verlenen van een verblijfsvergunning als bedoeld in
      [artikel 20 van de Wet][ref1] of een EU-verblijfsvergunning voor langdurig ingezetenen, een bedrag van € 85
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel20
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34g
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '20'
  - number: 3.34g.4
    text: |-
      Ter zake van de afgifte ter uitvoering van [artikel 4.22, tweede lid, van het Besluit][ref1], van een vervangend
      document waaruit het rechtmatig verblijf, bedoeld in [artikel 8, onder b en e, van de Wet][ref2] blijkt, is de
      vreemdeling een bedrag van € 85 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0012002/2026-01-01#Artikel3.34g
