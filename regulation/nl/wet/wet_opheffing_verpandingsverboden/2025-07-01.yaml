publication_date: '2025-03-19'
valid_from: '2025-07-01'
bwb_id: BWBR0050864
url: https://wetten.overheid.nl/BWBR0050864/2025-07-01
preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het onwenselijk is dat partijen in het handelsverkeer overeenkomen dat
    geldvorderingen op naam voortvloeiend uit de uitoefening van een beroep of bedrijf niet kunnen worden overgedragen
    of verpand omdat dit de kredietverlening aan het bedrijfsleven belemmert;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050864/2025-07-01#ArtikelAanhef
articles:
  - number: III
    text: >-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0050864/2025-07-01#ArtikelIII
  - number: IV
    text: 'Deze wet wordt aangehaald als: Wet opheffing verpandingsverboden.'
    url: https://wetten.overheid.nl/BWBR0050864/2025-07-01#ArtikelIV
