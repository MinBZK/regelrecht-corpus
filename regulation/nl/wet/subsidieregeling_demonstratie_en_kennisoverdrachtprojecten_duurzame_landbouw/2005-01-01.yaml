  - number: '2.1'
    text: |-
      Ter bevordering van de concurrentiekracht van de land- en bosbouw en van productiemethoden die verenigbaar zijn
      met de eisen inzake milieubescherming en natuurbeheer, kan de minister overeenkomstig de navolgende bepalingen, op
      aanvraag een subsidie verstrekken voor de uitvoering van projecten aan:
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel2
  - number: 2.1.a
    text: |-
      ondernemers die voor eigen rekening en risico een land- of bosbouwbedrijf exploiteren of een onderneming drijven
      die land- of bosbouwproducten be- of verwerkt of verhandelt;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel2
  - number: 2.1.b
    text: verenigingen en stichtingen op het gebied van de onder a bedoelde ondernemingen;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel2
  - number: 2.1.c
    text: publiekrechtelijke rechtspersonen, en
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel2
  - number: 2.1.d
    text: samenwerkingsverbanden tussen de onder a, b en c bedoelde rechtspersonen en ondernemers.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel2
  - number: '2.2'
    text: |-
      Indien de aanvraag betrekking heeft op een project van een samenwerkingsverband bedoeld in het eerste lid,
      onderdeel d, wordt één van hen tot het indienen van de aanvraag gemachtigd.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel2
  - number: '2.3'
    text: |-
      Geen subsidie wordt verstrekt aan ondernemingen en instellingen die werkzaam zijn op het terrein van onderzoek,
      scholing, opleiding, voorlichting, advies of begeleiding.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel2
  - number: '3.1'
    text: |-
      Subsidie ten behoeve van demonstratie- en kennisoverdrachtprojecten, wordt uitsluitend verstrekt indien deze
      projecten betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.a
    text: biologische landbouw, geïntegreerde landbouw of gesloten teeltsystemen;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.b
    text: milieuverantwoorde benutting van meststoffen;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.c
    text: terugdringing van het gebruik of de emissie van gewasbeschermingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.d
    text: beperking van de ammoniak-emissies in de veehouderij;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.e
    text: energiebesparing energie-efficiency en energiemanagement;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.f
    text: beheersmaatregelen die de verdroging van natuurgebieden tegengaan;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.g
    text: verwijdering en verwerking van organische afvalstoffen voor zover betrekking hebbende op de substraatteelt;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.h
    text: behoud en ontwikkeling van natuur- en landschapswaarden in agrarische gebieden;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.i
    text: |-
      toepassing van nieuwe marktgerichte productiemethoden of verwerkingstechnieken, waaronder de ontwikkeling van
      nieuwe landbouwproducten of bijproducten en het openen van nieuwe markten;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.j
    text: |-
      diversificatie van bedrijfsactiviteiten, met name door toeristische en ambachtelijke activiteiten of de productie
      en verkoop van ambachtelijke producten op het primaire land- of bosbouwbedrijf;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.k
    text: verbetering van logistieke systemen en informatietechnologie;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.l
    text: verbetering van arbeidsomstandigheden;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.m
    text: verbetering van hygiëne;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.n
    text: verbetering van de gezondheid of het welzijn van dieren;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.o
    text: verbetering van de diergezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.p
    text: verbetering van de kwaliteit van productieprocessen of -systemen, waaronder integrale borgingssystemen;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.q
    text: |-
      verbetering van de horizontale, onderscheidenlijk verticale samenwerking in, onderscheidenlijk tussen opeenvolgende
      schakels in de productieketen van land- of bosbouwproducten, of
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.1.r
    text: |-
      beperking van milieubelasting door bedrijven die zich richten op de be- of verwerking van, of handel in producten
      van de land- of bosbouw.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: '3.2'
    text: 'De subsidie wordt voorts slechts verstrekt voor projecten:'
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.2.a
    text: |-
      die kunnen bijdragen aan de bevordering van de toepassing van nieuwe kennis of technologieën, die verder gaat dan
      de wettelijke minimumnormen;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.2.b
    text: |-
      die betrekking hebben op vernieuwingen in de productiekolom van land- en bosbouwproducten die voldoende perspectief
      bieden voor toepassing op bedrijfsniveau;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.2.c
    text: |-
      die zijn voorzien van een op het project toegesneden communicatieplan, waaruit blijkt dat de organisatie die met de
      uitvoering daarvan is belast beschikt over de terzake benodigde ervaring en expertise;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.2.d
    text: |-
      die zijn voorzien van een opinieverslag waaruit blijkt dat het project voldoende draagvlak heeft bij de, gelet op
      de doelstelling van het project, relevante vaktechnische, dienstverlenende, branche- of standsorganisaties;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.2.e
    text: |-
      die, gelet op de doelstelling, de inhoud en het geografisch bereik, niet gelijk zijn aan projecten waaraan in het
      kader van deze regeling eerder een subsidie is verleend;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.2.f
    text: |-
      waarvan de uitvoeringstermijn ten hoogste drie jaar bedraagt vanaf het moment van de beschikking tot
      subsidieverlening;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.2.g
    text: waarvan de resultaten openbaar worden gemaakt, en
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: 3.2.h
    text: waarvan de subsidiabele kosten tenminste € 11.344,51 bedragen.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel3
  - number: '4.1'
    text: |-
      Geen subsidie wordt verstrekt voor projecten met de uitvoering waarvan reeds is begonnen voor de datum van
      ontvangstbevestiging van de aanvraag tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel4
  - number: '4.2'
    text: |-
      Voor de toepassing van het eerste lid worden voorbereidende activiteiten, welke worden verricht om te komen tot een
      voldoende gespecificeerde aanvraag buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel4
  - number: '5.1'
    text: 'Als subsidiabele kosten worden uitsluitend aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel5
  - number: 5.1.a
    text: opleidings- en trainingskosten van de met de uitvoering van het project belaste personen;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel5
  - number: 5.1.b
    text: kosten van leveringen en diensten door derden;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel5
  - number: 5.1.c
    text: kosten voor het verstrekken van informatie en het verzorgen van publiciteit;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel5
  - number: 5.1.d
    text: kosten van huur of lease van voor het project noodzakelijke bedrijfsmiddelen;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel5
  - number: 5.1.e
    text: |-
      loonkosten, voorzover deze kosten betrekking hebben op personeel dat ten behoeve van het project is ingezet,
      alsmede kosten van eigen arbeid van de aanvrager in het kader van het project te waarderen tegen € 18,15 per uur;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel5
  - number: 5.1.f
    text: uitvoeringskosten, zoals reiskosten en de kosten van de huur van vergaderzalen.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel5
  - number: '5.2'
    text: |-
      De kosten bedoeld in het eerste lid worden, indien van toepassing berekend, exclusief ingevolge de
      [Wet op de omzetbelasting 1968][ref1] verschuldigde omzetbelasting, tenzij op het moment van indiening van de
      aanvraag wordt aangetoond dat deze niet in aftrek kan worden gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: '5.3'
    text: 'Als niet-subsidiabele kosten worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel5
  - number: 5.3.a
    text: overheadkosten;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel5
  - number: 5.3.b
    text: de investeringskosten in bedrijfsmiddelen;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel5
  - number: 5.3.c
    text: de kosten die betrekking hebben op het kunnen indienen van een voldoende gespecificeerde aanvraag;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel5
  - number: 5.3.d
    text: ten behoeve van de financiering van het project te betalen rente en kosten;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel5
  - number: 5.3.e
    text: de kosten van een accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel5
  - number: '5.4'
    text: |-
      Het derde lid, onderdeel b, is niet van toepassing indien aangetoond wordt dat de beschikking over deze
      bedrijfsmiddelen niet op andere wijze kan worden verkregen, in welk geval slechts het bij de aanvraag tot
      subsidievaststelling aangegeven verschil tussen de aankoopprijs en de getaxeerde verkoopprijs, zoals deze is
      vastgesteld voor de datum waarop de uitvoering van het project is voltooid, voor een subsidie in aanmerking komt.
      Indien de gerealiseerde verkoopprijs hoger is dan de getaxeerde verkoopprijs, wordt bij de subsidievaststelling de
      gerealiseerde verkoopprijs gehanteerd.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel5
  - number: '6.1'
    text: De subsidie bedraagt maximaal 50% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien voor de subsidiabele kosten of een gedeelte daarvan reeds uit anderen hoofde een subsidie is of zal worden
      verstrekt, wordt slechts een zodanig bedrag aan subsidie verstrekt dat het totale subsidiebedrag niet meer bedraagt
      dan 90% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel6
  - number: '7.1'
    text: De minister kan één of meer aanvraagperioden vaststellen.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel7
  - number: '7.2'
    text: |-
      De minister kan per aanvraagperiode één of, indien uitvoering wordt gegeven aan het derde of vierde lid, meerdere
      subsidieplafonds vaststellen voor de verlening van subsidies ingevolge deze regeling.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel7
  - number: '7.3'
    text: |-
      De minister kan per aanvraagperiode besluiten dat slechts voor projecten inzake bepaalde thema's als bedoeld
      in [artikel 3, eerste lid][ref1], of door bepaalde categorieën aanvragers als bedoeld in [artikel 2][ref2] een
      aanvraag kan worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012670#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012670#Artikel2
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012670
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012670
        artikel: '2'
        paragraaf: '2'
  - number: '7.4'
    text: |-
      De minister kan per aanvraagperiode besluiten dat ter zake van één of meer thema's als bedoeld in
      [artikel 3, eerste lid][ref1], slechts aanvragen voor projecten kunnen worden ingediend die betrekking hebben op
      door de minister bij dat besluit vast te stellen subthema's.


      [ref1]: https://wetten.overheid.nl/BWBR0012670#Artikel3
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012670
        artikel: '3'
        paragraaf: '2'
  - number: '7.5'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 10, eerste lid][ref1] kan de minister nader bepalen dat bij de
      beoordeling, bedoeld in [artikel 10, vijfde lid][ref2], prioriteit wordt gegeven aan projecten inzake bepaalde
      thema's als bedoeld in [artikel 3, eerste lid][ref3], danwel de per openstelling eventueel te benoemen subthema's,
      bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0012670#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0012670#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0012670#Artikel3
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012670
        artikel: '10'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012670
        artikel: '10'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0012670
        artikel: '3'
        paragraaf: '2'
  - number: '7.6'
    text: De minister maakt de besluiten, bedoeld in het eerste tot en met het vijfde lid, bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel7
  - number: '8.1'
    text: De subsidieaanvraag wordt ingediend bij Dienst Regelingen, op een daartoe vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel8
  - number: '8.2'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel8
  - number: 8.2.a
    text: |-
      in voorkomend geval, het aan het samenwerkingsverband ten grondslag liggende samenwerkingscontract, met daarin
      in elk geval een overzicht van de deelnemers aan het samenwerkingsverband, alsmede van de verdeling van de
      verantwoordelijkheden, bevoegdheden en financiële verplichtingen tussen de verschillende deelnemers;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel8
  - number: 8.2.b
    text: |-
      een projectplan, inhoudende een beschrijving van de doelstellingen en achtergronden van het project, de
      activiteiten, een tijdsplanning van de activiteiten en de wijze van uitvoering;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel8
  - number: 8.2.c
    text: |-
      een op het project toegesneden voorlichtings- of onderwijsplan, waaruit onder meer blijkt dat de organisatie die
      met de uitvoering daarvan is belast beschikt over de terzake benodigde ervaring en expertise;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel8
  - number: 8.2.d
    text: |-
      een verslag waaruit blijkt dat de aanvrager tijdens de voorbereiding van het project overleg heeft gepleegd
      met de, gelet op de doelstelling van het project, relevante vaktechnische, dienstverlenende, branche- of
      standsorganisaties;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel8
  - number: 8.2.e
    text: een begroting van de kosten en een opgave van de financieringswijze van het project, en
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel8
  - number: 8.2.f
    text: |-
      in voorkomend geval, bewijsstukken waaruit blijkt dat de aanvrager, of de deelnemers aan het samenwerkingsverband,
      rechtspersonen zijn als bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012670#Artikel2
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012670
        artikel: '2'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      Behoudens in het geval dat toepassing wordt gegeven aan [artikel 10][ref1], verdeelt de minister het
      voor een kalenderjaar of aanvraagperiode beschikbare bedrag in de volgorde van de datum van ontvangst
      van de aanvragen, met dien verstande dat ingeval sprake is van een onvolledige aanvraag in de zin van
      [artikel 4:5 Algemene wet bestuursrecht][ref2], de aanvraag pas voor subsidie in aanmerking komt op de dag waarop
      de aanvraag volledig is aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0012670#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012670
        artikel: '10'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '9.2'
    text: |-
      Indien door toewijzing van subsidieaanvragen met dezelfde datum van ontvangst, het subsidieplafond zou worden
      overschreden, geschiedt de toewijzing volgens een rangschikking van de subsidieaanvragen, waarbij telkenmale de
      hoogst gerangschikte subsidie-aanvraag het eerst voor toewijzing in aanmerking komt. De rangschikking vindt plaats
      volgens loting, welke geschiedt door een door de minister aan te wijzen notaris.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel9
  - number: '9.3'
    text: |-
      De minister kan een commissie instellen die tot taak heeft de haar daartoe voorgelegde aanvragen te beoordelen
      en advies uit te brengen aan de minister omtrent de verenigbaarheid van het project waarop de aanvraag betrekking
      heeft met deze regeling en met name met de thema's bedoeld in [artikel 3, eerste lid][ref1], zoals deze in
      voorkomend geval met toepassing van [artikel 7, derde of vierde lid][ref2], nader zijn uitgewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0012670#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012670#Artikel7
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012670
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012670
        artikel: '7'
        paragraaf: '2'
  - number: '9.4'
    text: |-
      De in het derde lid bedoelde commissie bestaat uit een voorzitter, tevens lid, en ten minste drie doch ten hoogste
      tien leden. De minister benoemt op basis van hun specifieke kennis en deskundigheid de voorzitter en de leden van
      de commissie voor een termijn van drie jaar behoudens tussentijds ontslag door de minister. Ze zijn te allen tijde
      opnieuw benoembaar.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel9
  - number: '9.5'
    text: |-
      De commissie, bedoeld in het derde lid, stelt met inachtneming van door de minister te stellen regels haar
      werkwijze vast. Het secretariaat wordt gevoerd door door de minister aan te wijzen ambtenaren van het Ministerie
      van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel9
  - number: '10.1'
    text: |-
      De minister kan besluiten dat gelijktijdig wordt beslist, op in eenzelfde aanvraagperiode ingediende aanvragen, op
      basis van een vergelijking van de projecten waarvoor een aanvraag is ingediend met betrekking tot hun geschiktheid
      om bij te dragen aan de doelstellingen van deze regeling. De minister maakt dit besluit bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel10
  - number: '10.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, stelt de minister één of meer beoordelingscommissies in die
      tot taak heeft, onderscheidenlijk hebben de haar daartoe voorgelegde aanvragen overeenkomstig het vijfde lid te
      beoordelen en hierover advies uit te brengen aan de minister.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel10
  - number: '10.3'
    text: |-
      De beoordelingscommissie bestaat uit een voorzitter, tevens lid, en tenminste drie doch ten hoogste tien
      leden. De minister benoemt op basis van hun specifieke kennis en deskundigheid de voorzitter en de leden van de
      beoordelingscommissie voor een termijn van drie jaar, behoudens tussentijds ontslag door de minister. De leden zijn
      te allen tijde opnieuw benoembaar.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel10
  - number: '10.4'
    text: |-
      De beoordelingscommissie stelt met inachtneming van door de minister te stellen regels haar werkwijze vast. Het
      secretariaat wordt gevoerd door door de minister aan te wijzen ambtenaren van het Ministerie van Landbouw, Natuur
      en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel10
  - number: '10.5'
    text: |-
      De beoordelingscommissie beoordeelt of en in welke mate het project bijdraagt aan het bereiken van de
      doelstellingen van deze regeling en toetst daarbij op de aspecten bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012670#Artikel11
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012670
        artikel: '11'
        paragraaf: '3'
  - number: '10.6'
    text: De beoordelingscommissie kan de minister adviseren een aanvraag geheel of gedeeltelijk af te wijzen.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel10
  - number: '10.7'
    text: |-
      De beoordelingscommissie brengt na de beoordeling van de projecten advies uit aan de minister in de vorm van een
      rangschikking van de aanvragen waarover de commissie ingevolge het zesde lid niet afwijzend adviseert, waarbij
      aanvragen:
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel10
  - number: 10.7.a
    text: |-
      hoger worden gerangschikt naarmate ze naar het oordeel van de beoordelingscommissie meer voldoen aan het in het
      vijfde lid bedoelde criterium en
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel10
  - number: 10.7.b
    text: |-
      die in gelijke mate aan het in het in het vijfde lid bedoelde criterium voldoen, hoger worden gerangschikt naarmate
      ze meer voldoen aan de door de minister ingevolge [artikel 7, vijfde lid][ref1], vastgestelde prioriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0012670#Artikel7
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012670
        artikel: '7'
        paragraaf: '2'
  - number: '10.8'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid beslist de minister, gehoord hebbende het advies van de
      beoordelingscommissie, gelijktijdig op de aanvragen die van een dergelijk advies zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel10
  - number: '10.9'
    text: |-
      De minister geeft de beschikking tot subsidieverlening binnen vier maanden na afloop van de aanvraagperiode waarin
      de aanvraag is ingediend. Indien deze termijn niet kan worden gehaald, stelt de minister de aanvrager daarvan in
      kennis en noemt hij daarbij een redelijke termijn waarop de beschikking tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel10
  - number: '11.1'
    text: |-
      Indien uitvoering wordt gegeven aan [artikel 10, eerste lid][ref1], worden subsidie-aanvragen zodanig gerangschikt
      dat een project hoger wordt gerangschikt naarmate:


      [ref1]: https://wetten.overheid.nl/BWBR0012670#Artikel10
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012670
        artikel: '10'
        paragraaf: '3'
  - number: 11.1.a
    text: de vernieuwing waarop het project betrekking heeft meer perspectief heeft voor toepassing op bedrijfsniveau;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel11
  - number: 11.1.b
    text: de vernieuwing zich in een meer vergevorderd stadium van ontwikkeling bevindt;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel11
  - number: 11.1.c
    text: |-
      het project meer bijdraagt aan het bevorderen van de toepassing van nieuwe kennis of technologiëen in de gehele
      sector;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel11
  - number: 11.1.d
    text: |-
      het voor het project uit te werken communicatieplan aantoont dat de relevante doelgroepen op de juiste wijze worden
      benaderd;
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel11
  - number: 11.1.e
    text: het draagvlak bij relevante vaktechnische-, dienstverlenende-, branche- of standsorganisaties, groter is.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel11
  - number: '11.2'
    text: |-
      De minister kan in aanvulling op de rangschikkingscriteria, bedoeld in het eerste lid, nadere
      rangschikkingscriteria vaststellen.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel11
  - number: '11.3'
    text: De minister maakt besluiten bedoeld in het tweede lid bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel11
  - number: '12.1'
    text: |-
      De subsidieverlening wordt geweigerd indien een gegronde reden bestaat om aan te nemen dat de financiering van de
      te subsidiëren activiteit niet toereikend zal zijn.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel12
  - number: '12.2'
    text: |-
      De subsidieverlening wordt geweigerd of ingetrokken indien de aanvrager naast de aanvraag tot subsidieverlening in
      het zelfde kalenderjaar een andere aanvraag tot subsidieverlening of vaststelling bij een Nederlands bestuursorgaan
      heeft ingediend, waarop dezelfde hoofdstukken van [Verordening (EG) nr. 1257/1999](31999R1257) van toepassing zijn
      en deze andere aanvraag is door ernstige nalatigheid of opzet onjuist.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel12
  - number: '12.3'
    text: |-
      De subsidieverlening wordt geweigerd of ingetrokken, indien de aanvrager naast de aanvraag tot subsidieverlening
      of -vaststelling in het voorafgaande kalenderjaar een andere aanvraag tot subsidieverlening of vaststelling bij
      een Nederlands bestuursorgaan heeft ingediend waarop dezelfde hoofdstukken van [Verordening (EG) nr. 1257/1999]
      (31999R1257) van toepassing zijn en deze andere aanvraag is door opzet onjuist.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel12
  - number: '13.1'
    text: 'De subsidieontvanger voert het project uit:'
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
  - number: 13.1.a
    text: |-
      overeenkomstig het projectplan waarop de beschikking tot subsidieverlening betrekking heeft, behoudens goedgekeurde
      wijzigingen van het project als bedoeld in het tweede lid,
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
  - number: 13.1.b
    text: in Nederland, behoudens toestemming van de minister tot gedeeltelijke uitvoering buiten Nederland en
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
  - number: 13.1.c
    text: |-
      binnen de in [artikel 3, tweede lid onderdeel f][ref1], bedoelde uitvoeringstermijn, met dien verstande dat met de
      uitvoering van het project uiterlijk zes maanden na de beschikking tot subsidieverlening moet zijn begonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0012670#Artikel3
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012670
        artikel: '3'
        paragraaf: '2'
  - number: '13.2'
    text: 'Wijzigingen in het projectplan gedurende de looptijd van het project zijn toegestaan mits:'
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
  - number: 13.2.a
    text: deze geen wijzigingen ten aanzien van de doelstelling van het project betreffen en
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
  - number: 13.2.b
    text: deze vooraf zijn gemeld aan Dienst Regelingen en zijn goedgekeurd door de minister.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
  - number: '13.3'
    text: |-
      Indien de projectduur langer dan één jaar is, rapporteert de subsidieontvanger steeds nadat een jaar van de
      projectduur is verstreken binnen 3 maanden in de vorm van een tussenverslag omtrent de voortgang van het project op
      een door de minister te bepalen wijze. Dit verslag bestaat ten minste uit een beschrijving van:
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
  - number: 13.3.a
    text: de activiteiten die tot dan toe in het kader van het project zijn verricht en
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
  - number: 13.3.b
    text: de mate waarin deze activiteiten hebben bijgedragen aan de in het projectplan omschreven doelstellingen.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
  - number: '13.4'
    text: |-
      Na afloop van de projectduur rapporteert de subsidieontvanger in de vorm van een evaluatieverslag over het project.
      Dit verslag bestaat ten minste uit een beschrijving van:
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
  - number: 13.4.a
    text: de activiteiten die in het kader van het project zijn verricht,
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
  - number: 13.4.b
    text: de mate waarin deze activiteiten hebben bijgedragen aan de in het projectplan omschreven doelstellingen,
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
  - number: 13.4.c
    text: de kennis en informatie die met het project zijn opgedaan en
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
  - number: 13.4.d
    text: de wijze waarop deze kennis en informatie openbaar is of zal worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
  - number: '13.5'
    text: |-
      De subsidieontvanger is verplicht de kennis en informatie die met het project wordt opgedaan, onmiddellijk na
      afloop van het project openbaar te maken. Aan de beschikking tot subsidieverlening kan de minister voorschriften
      verbinden omtrent de wijze waarop deze openbaarmaking dient te geschieden.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
  - number: '13.6'
    text: |-
      De subsidieontvanger is verplicht een administratie te voeren die zodanig is ingericht dat daaruit te allen tijde
      op eenvoudige en duidelijke wijze alle projectkosten kunnen worden afgelezen, gespecificeerd overeenkomstig de in
      [artikel 5, eerste lid][ref1], onderscheiden kostensoorten, met dien verstande dat ter zake van de loonkosten en de
      kosten voor eigen arbeid een door middel van een sluitende tijdschrijving vastgestelde urenverantwoording aanwezig
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0012670#Artikel5
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012670
        artikel: '5'
        paragraaf: '2'
  - number: '13.7'
    text: |-
      De minister kan de subsidieontvanger ook andere verplichtingen opleggen die strekken tot verwezenlijking van het
      doel van de subsidie.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel13
  - number: '14.1'
    text: |-
      De subsidieontvanger is verplicht handelsdocumenten gedurende ten minste 3 jaren te bewaren, ingaande na afloop van
      het jaar waarin zij zijn opgesteld, en ingeval de met de controle belaste functionarissen of daartoe gemachtigde
      personen hierom verzoeken, uittreksels of kopieën van de handelsdocumenten te verstrekken.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel14
  - number: '14.2'
    text: |-
      De subsidieontvanger is verplicht de fysieke en administratieve controles toe te laten door de door de Minister
      aangewezen toezichthouders en van de krachtens het EG-Verdrag bevoegde Europese controleurs.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel14
  - number: '15'
    text: |-
      Met het toezicht op de naleving van deze regeling zijn belast de door de minister aangewezen ambtenaren van het
      Ministerie van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel15
  - number: '16.1'
    text: |-
      De subsidievaststelling wordt geweigerd of ingetrokken indien een gegronde reden bestaat om aan te nemen dat de
      financiering van de te subsidiëren activiteit niet toereikend zal zijn.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel16
  - number: '16.2'
    text: |-
      De subsidievaststelling wordt geweigerd of ingetrokken indien de subsidieaanvraag niet heeft voldaan aan de
      verplichtingen bedoeld in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012670#Artikel13
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012670
        artikel: '13'
        paragraaf: '4'
  - number: '16.3'
    text: |-
      De subsidievaststelling wordt geweigerd of ingetrokken indien de aanvrager naast de aanvraag tot
      subsidievaststelling in het zelfde kalenderjaar een andere aanvraag tot subsidieverlening of -vaststelling bij
      een Nederlands bestuursorgaan heeft ingediend, waarop dezelfde hoofdstukken van [Verordening (EG) nr. 1257/1999]
      (31999R1257) van toepassing zijn en deze andere aanvraag is door ernstige nalatigheid of opzet onjuist.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel16
  - number: '16.4'
    text: |-
      De subsidievaststelling wordt geweigerd of ingetrokken, indien de aanvrager naast de aanvraag tot
      subsidievaststelling in het voorafgaande kalenderjaar een andere aanvraag tot subsidieverlening of vaststelling
      bij een Nederlands bestuursorgaan heeft ingediend waarop dezelfde hoofdstukken van [Verordening (EG) nr. 1257/1999]
      (31999R1257) van toepassing zijn en deze andere aanvraag is door opzet onjuist.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel16
  - number: '17.1'
    text: |-
      De aanvraag voor de vaststelling van de subsidie wordt binnen vier maanden na afloop van het project ingediend bij
      Dienst Regelingen, op een daartoe door Dienst Regelingen vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel17
  - number: '17.2'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel17
  - number: 17.2.a
    text: |-
      een afschrift van het in [artikel 13, vierde lid][ref1], bedoelde evaluatieverslag, en


      [ref1]: https://wetten.overheid.nl/BWBR0012670#Artikel13
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012670
        artikel: '13'
        paragraaf: '4'
  - number: 17.2.b
    text: |-
      een financiële verantwoording van het project, alsmede een verklaring van een accountant of een accountant-
      administratieconsulent als bedoeld in [artikel 2:393, eerste lid, van het Burgerlijk Wetboek][ref1] waaruit blijkt
      dat is voldaan aan de in deze regeling gestelde voorwaarden en verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 17.2.c
    text: |-
      De accountant of accountant-administratieconsulent, bedoeld in het tweede lid, onderdeel b, controleert met
      inachtneming van het in de bijlage bij deze regeling opgenomen controleprotocol.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel17
  - number: 17.2.d
    text: |-
      De minister behoudt zich het recht voor om de Auditdienst van het Ministerie van Landbouw, Natuur en
      Voedselkwaliteit een hercontrole te laten uitvoeren op de door de accountant van de aanvrager verrichte
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel17
  - number: '18.1'
    text: |-
      De minister kan de subsidieontvanger op diens aanvraag ten hoogste 80% van het maximum verleende subsidiebedrag en
      ten hoogste een maal per zes maanden voorschotten verlenen.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel18
  - number: '18.2'
    text: De aanvraag tot voorschotverlening gaat vergezeld van een overzicht van de liquiditeitsbehoefte.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel18
  - number: '18.3'
    text: De beschikking tot voorschotverlening vermeldt het bedrag van het voorschot.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel18
  - number: '19'
    text: |-
      Onverschuldigd betaalde subsidiebedragen en voorschotten kunnen met inbegrip van de wettelijke rente over de
      periode die aanvangt op het tijdstip van uitbetaling van het subsidiebedrag en die eindigt op het tijdstip van
      volledige terugbetaling, worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel19
  - number: '20.1'
    text: |-
      Een subsidie als bedoeld in [artikel 2][ref1], of een voorschot daarop, wordt verleend onder voorbehoud van
      goedkeuring van deze regeling of het Plattelandsontwikkelingsplan Nederland door de Commissie van de Europese
      Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0012670#Artikel2
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0012670
        artikel: '2'
        paragraaf: '2'
  - number: '20.2'
    text: |-
      De beslissing tot verlening van een subsidie als bedoeld in [artikel 2][ref1], of een voorschot daarop, kan worden
      ingetrokken of gewijzigd indien dit noodzakelijk is ter verkrijging van de goedkeuring van de Commissie van de
      Europese Gemeenschappen, voor deze regeling dan wel het Plattelandsontwikkelingsplan Nederland, of wegens het
      uitblijven daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0012670#Artikel2
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0012670
        artikel: '2'
        paragraaf: '2'
  - number: '20.3'
    text: |-
      Ingeval van wijziging of intrekking van de subsidieverlening of de beschikking tot het verstrekken van een
      voorschot, bedoeld in het tweede lid, worden de uitbetaalde bedragen met inbegrip van de wettelijke rente
      teruggevorderd .
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel20
  - number: '21'
    text: |-
      De Subsidieregeling demonstratieprojecten markt en concurrentiekracht wordt ingetrokken, met dien verstande dat
      deze van toepassing blijft ten aanzien van subsidieaanvragen die zijn ingediend vóór inwerkingtreding van de
      onderhavige regeling.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel21
  - number: 21a
    text: |-
      Deze regeling berust mede op [artikel 4 Kaderwet LNV-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009194#Artikel4
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0009194
        artikel: '4'
  - number: '22'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel22
  - number: '23'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling demonstratie- en kennisoverdrachtprojecten duurzame landbouw.'
    url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#Artikel23
