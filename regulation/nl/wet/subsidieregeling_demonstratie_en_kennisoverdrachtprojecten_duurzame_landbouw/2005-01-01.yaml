preamble:
  text: |-
    Gelet op artikel 2 van de Kaderwet LNV-subsidies;

    Gelet op Verordening (EG) Nr. 1257/1999 van de Raad van 17 mei 1999 inzake steun voor plattelandsontwikkeling uit
    het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en tot wijziging en instelling van een aantal
    verordeningen;

    Gelet op verordening (EG) nr. 1750/1999 van de Commissie van 23 juli 1999 tot vaststelling van
    uitvoeringsbepalingen voor verordening (EG) nr. 1257/1999 van de Raad inzake steun voor plattelandsontwikkeling uit
    het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) (PbEG L 214);

    Gelet op verordening (EEG) nr. 4045/89 van de Raad van 21 december 1989 inzake de door de Lid-Staten uit te voeren
    controles op de verrichtingen in het kader van de financieringsregeling van de afdeling Garantie van het Europees
    Oriëntatie- en Garantiefonds voor de Landbouw en houdende intrekking van Richtlijn 77/435/EEG (PbEG L 388);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012670/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *minister:*


              Minister van Landbouw, Natuur en Voedselkwaliteit;



            b

              *Dienst Regelingen:*


              Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



            c

              *beroepsopleidingen:*


              beroepsopleidingen als bedoeld in [artikel 1.2.1., tweede lid van de Wet educatie beroepsonderwijs][ref1]
      en [artikel 7.3, tweede lid van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2];



            d

              *cursus:*


              reeks van lessen die een afgesloten geheel vormen;



            e

              *demonstratieproject:*


              samenhangend geheel van activiteiten gericht op het in de praktijk uittesten en demonstreren van de
      resultaten van vernieuwingen op land- of bosbouwbedrijven of in ondernemingen die zich richten op be- of verwerking
      van, of handel in land- of bosbouwproducten;



            f

              *kennisoverdrachtprojecten:*


              samenhangend geheel van activiteiten, met inbegrip van de ontwikkeling en productie van noodzakelijke
      leer- en communicatiemiddelen, gericht op het overdragen van kennis en informatie over vernieuwingen op
      land- of bosbouwbedrijven of in ondernemingen die zich richten op be- of verwerking van of handel in land- of
      bosbouwproducten, met uitzondering van beroepsopleidingen en aan beroepsopleidingen gerelateerde cursussen; g.
      project: demonstratie-, of kennisoverdrachtproject;



            g

              *project:*


              demonstratie-, of kennisoverdrachtproject;



            h

              *landbouw:*


              akkerbouw, tuinbouw en veeteelt;



            i

              *bosbouw:*


              activiteiten gericht op het aanleggen, onderhouden of exploiteren van bossen;



            j

              *ondernemer:*


              natuurlijke of privaatrechtelijke rechtspersoon, dan wel een samenwerkingsverband van natuurlijke personen
      of privaatrechtelijke rechtspersonen die, onderscheidenlijk dat, voor eigen rekening en risico een land- of
      bosbouwbedrijf drijft, of een onderneming drijft die land- of bosbouwproducten be- of verwerkt of verhandelt;



            k

              *publiekrechtelijke rechtspersonen:*


              provincies, gemeenten, waterschappen en product- en bedrijfsschappen op het gebied van land- of bosbouw;



            l

              *biologische landbouw:*


              landbouwproductiemethode als bedoeld in
      [artikel 1, eerste lid, van het Landbouwkwaliteitsbesluit biologische productiemethode][ref3];



            m

              *geïntegreerde landbouw:*


              bedrijfssysteem waarbij het (kunst)mestgebruik wordt beperkt en de chemische gewasbeschermingsmiddelen
      zo veel mogelijk worden vervangen door een optimale inzet van preventieve maatregelen en niet-chemische
      gewasbeschermingsmiddelen;



            n

              *gesloten teeltsysteem:*


              bedrijfssysteem in niet-grondgebonden sectoren van de plantaardige productie waarbij bodem, water en lucht
      niet of nauwelijks worden belast en de overblijvende rest- en afvalstoffen op verantwoorde wijze worden afgevoerd
      en elders worden hergebruikt of vernietigd;



            o

              *bedrijfsmiddelen:*


              tot het bedrijfsvermogen behorende slijtende zaken of voorwerpen die in een productieproces meerdere jaren
      meegaan en waarop doorgaans wordt afgeschreven, welke als duurzame kapitaalgoederen het vaste kapitaal van het
      bedrijf vormen, met uitzondering van grond, gereedschappen, vee en investeringen die dienen voor het instandhouden
      van reeds op het bedrijf aanwezige duurzame productiemiddelen;



            p

              *handelsdocumenten:*


              alle boeken, registers, nota's en bewijsstukken, de boekhouding en de briefwisseling met betrekking tot
      de bedrijfsactiviteiten van de onderneming evenals de commerciële gegevens, in welke vorm dan ook, voorzover deze
      documenten direct of indirect betrekking hebben op de verrichtingen waarvoor de subsidie is aangevraagd;



            q

              *Plattelandsontwikkelingsplan Nederland:*


              het door de Commissie van de Europese Gemeenschappen goedgekeurde programmeringsdocument voor
      plattelandsontwikkeling voor Nederland met betrekking tot de programmeringsperiode 2000-2006, met inbegrip van de
      door de Commissie van de Europese Gemeenschappen goedgekeurde wijzigingen;



            r

              *EG-Verdrag:*


              Verdrag tot oprichting van de Europese Gemeenschap;



            s

              *wettelijke minimumnormen:*


              de geldende nationale en Europese minimumnormen op het gebied van milieu, dierenwelzijn en
      hygiëne, hetgeen in ieder geval omvat de geldende normen bij of krachtens de [Wet milieubeheer][ref4], de
      [Wet verontreiniging oppervlaktewater][ref5], de [Meststoffenwet][ref6], de [Wet bodembescherming][ref7],
      de [Bestrijdingsmiddelenwet 1962][ref8], de [Gezondheids- en welzijnswet voor dieren][ref9], de
      [Diergeneesmiddelenwet][ref10] en de [Plantenziekenwet][ref11].


