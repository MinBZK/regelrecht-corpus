---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_financiele_dienstverlening
regulatory_layer: WET
publication_date: '2006-12-07'
valid_from: '2006-12-29'
bwb_id: BWBR0018329
url: https://wetten.overheid.nl/BWBR0018329/2006-12-29
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen voor de financiële dienstverlening;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt – voor zover niet anders is bepaald – verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.a
    text: |-
      aanbieden: het rechtstreeks of middellijk doen van een voldoende bepaald voorstel tot het als wederpartij aangaan
      van een overeenkomst met een consument inzake een financieel product;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.b
    text: 'adviseren: het aanbevelen van een of meer specifieke financiële producten aan een bepaalde consument;'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.c
    text: |-
      adviseur: degene die adviseert, voorzover hij ten aanzien van het aanbevolen financiële product niet tevens
      optreedt als aanbieder, gevolmachtigde agent, ondergevolmachtigde agent of bemiddelaar;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.d
    text: |-
      beleggingsobject: een zaak of een recht op een zaak welke door een consument tegen betaling wordt verkregen, bij
      welke verkrijging aan de consument door de financiële dienstverlener een rendement in geld in het vooruitzicht
      wordt gesteld en waarbij het beheer van de zaak hoofdzakelijk door de financiële dienstverlener wordt uitgevoerd
      of door een derde in opdracht van de financiële dienstverlener of de consument. Onder beleggingsobject worden niet
      verstaan de financiële producten, bedoeld in onderdeel m, onder 1° tot en met 6°, 8° en 9°;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.e
    text: |-
      bemiddelen: alle werkzaamheden gericht op het als tussenpersoon tot stand brengen van overeenkomsten inzake
      financiële producten tussen consumenten en aanbieders, of, voor zover het overeenkomsten ten aanzien van
      verzekeringen of krediet betreft, bestaande uit het assisteren bij het beheer en de uitvoering van dergelijke
      overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.f
    text: |-
      bijkantoor: een bijkantoor als bedoeld in
      [artikel 1, eerste lid, onderdeel k, van de Wet toezicht kredietwezen 1992][ref1] of
      [artikel 1, eerste lid, onderdeel n, van de Wet toezicht verzekeringsbedrijf 1993][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel1
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '1'
  - number: 1.g
    text: |-
      consument: de niet in de uitoefening van zijn bedrijf of beroep handelende natuurlijke persoon aan wie een
      financiële dienstverlener een financiële dienst verleent of aan wie deze voornemens is een financiële dienst te
      verlenen;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.h
    text: |-
      duurzame drager: ieder hulpmiddel dat een consument in staat stelt om persoonlijk aan hem gerichte informatie op
      te slaan op een wijze die deze informatie toegankelijk maakt voor toekomstig gebruik gedurende een periode die
      is afgestemd op het doel waarvoor de informatie kan dienen, en die een ongewijzigde reproductie van de opgeslagen
      informatie mogelijk maakt;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.i
    text: |-
      effect: een effect als bedoeld in [artikel 1, onderdeel a, van de Wet toezicht effectenverkeer 1995][ref1] in
      samenhang met [artikel 2 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel2
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007657
        artikel: '2'
  - number: 1.j
    text: |-
      effectief kredietvergoedingspercentage: de bij de uitvoering van een overeenkomst inzake krediet overeenkomstig
      de betalingsregeling aan de consument in rekening te brengen kredietvergoeding, uitgedrukt in een percentage op
      jaarbasis van het uitstaand saldo, berekend op bij ministeriële regeling vast te stellen wijze;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.k
    text: |-
      elektronisch geld: een betaalmiddel als bedoeld in
      [artikel 1, eerste lid, onderdeel p, van de Wet toezicht kredietwezen 1992][ref1], uitgegeven door een onderneming
      of instelling als bedoeld in [artikel 1, eerste lid, onderdeel a, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '1'
  - number: 1.l
    text: 'financiële dienst:'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.l.1°
    text: aanbieden;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.l.2°
    text: |-
      adviseren, voorzover dit niet plaatsvindt door een financiële dienstverlener die tevens optreedt als aanbieder,
