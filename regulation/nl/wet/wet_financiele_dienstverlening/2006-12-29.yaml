    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.m.8°
    text: een bij algemene maatregel van bestuur aan te wijzen ander financieel product;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.m.9°
    text: een combinatie van twee of meer van de onder 1° tot en met 8° genoemde producten;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.n
    text: 'gemeentelijke kredietbank: een aanbieder van krediet, opgericht door een of meer gemeenten;'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.o
    text: |-
      gevolmachtigde agent: degene die als gevolmachtigd vertegenwoordiger van een aanbieder voor diens rekening
      overeenkomsten aangaat met consumenten inzake verzekeringen.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.p
    text: |-
      Groep: een groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1], met dien verstande dat
      indien een natuurlijke persoon, rechtspersoon of vennootschap:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 1.p.1°
    text: |-
      via een formele of feitelijke zeggenschapsstructuur invloed kan uitoefenen op een of meer andere natuurlijke
      personen, rechtspersonen of vennootschappen; of
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.p.2°
    text: |-
      in een of meer andere rechtspersonen of vennootschappen een deelneming heeft als bedoeld in
      [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref1], dan wel, voor zover het natuurlijke personen betreft,
      een met een deelneming overeenkomende positie, die natuurlijke persoon, rechtspersoon of vennootschap tezamen
      met die andere natuurlijke persoon, rechtspersoon of vennootschap dan wel natuurlijke personen, rechtspersonen of
      vennootschappen wordt aangemerkt als groep;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24c
  - number: 1.q
    text: |-
      herverzekeringsbemiddelen: alle werkzaamheden gericht op het als tussenpersoon tot stand brengen van overeenkomsten
      waarbij risico’s uit overeenkomsten inzake verzekeringen worden overgenomen, of bestaande uit het assisteren bij
      het beheer en de uitvoering van dergelijke overeenkomsten;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.r
    text: 'krediet: geldkrediet of goederenkrediet, waarbij wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.r.1°
    text: |-
      geldkrediet: het aan een consument ter beschikking stellen van een geldsom, waarbij de consument gehouden is ter
      zake een of meer betalingen te verrichten;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.r.2°
    text: |-
      goederenkrediet: het aan een consument verschaffen van het genot van een roerende zaak of een effect of het
      verlenen van een bij algemene maatregel van bestuur aan te wijzen dienst, dan wel het aan een consument of een
      derde ter beschikking stellen van een geldsom terzake van het aan die consument verschaffen van het genot van
      een roerende zaak of een effect of het verlenen van een bij algemene maatregel van bestuur aan te wijzen dienst,
      waarbij de consument gehouden is ter zake een of meer betalingen te verrichten;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.s
    text: |-
      levensverzekering: de verzekering, bedoeld in
      [artikel 1, eerste lid, onder b, van de Wet toezicht verzekeringsbedrijf 1993][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel1
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '1'
  - number: 1.t
    text: |-
      lidstaat: een staat die lid is van de Europese Unie alsmede een staat, niet zijnde een lidstaat van de Europese
      Unie, die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.u
    text: |-
      moederonderneming: een moederonderneming als bedoeld in artikel 1 van de zevende [richtlijn nr. 83/349/EEG]
      (31983L0349) van de Raad van de Europese Gemeenschappen van 13 juni 1983 op de grondslag van artikel 54, lid 3, sub
      g, van het Verdrag betreffende de geconsolideerde jaarrekening (PbEG L 193);
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.v
    text: 'onderbemiddelaar: de bemiddelaar die bemiddelt voor een andere bemiddelaar;'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.w
    text: |-
      ondergevolmachtigde agent: degene aan wie een gevolmachtigde agent of een ondergevolmachtigde agent een
      ondervolmacht heeft afgegeven;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.x
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.y
    text: |-
      overeenkomst op afstand: elke overeenkomst inzake een financieel product tussen een financiële dienstverlener en
      een consument die wordt gesloten in het kader van een door de financiële dienstverlener georganiseerd systeem voor
      verkoop of dienstverrichting op afstand, waarbij tot en met de totstandkoming van deze overeenkomst uitsluitend
      gebruik gemaakt wordt van een of meer technieken voor communicatie op afstand;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.z
    text: |-
      reclame-uitingen: iedere vorm van informatieverstrekking door, namens of mede namens een financiële dienstverlener,
      gericht op consumenten, die dient ter aanprijzing of een wervend karakter kent ter zake van een bepaalde financiële
      dienst;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.aa
    text: |-
      Richtlijn verzekeringsbemiddeling: [richtlijn nr. 2002/92/EG](32002L0092) van het Europees Parlement en de Raad van
      de Europese Unie van 9 december 2002 betreffende verzekeringsbemiddeling (PbEG L 9);
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.bb
    text: |-
      techniek voor communicatie op afstand: ieder middel dat, zonder gelijktijdige fysieke aanwezigheid van financiële
      dienstverlener en consument, kan worden gebruikt voor het verlenen van financiële diensten tussen die partijen;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.cc
    text: 'toezichthouder: de Stichting Autoriteit Financiële Markten;'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.dd
    text: |-
      verbonden bemiddelaar: de bemiddelaar bedoeld in [artikel 12, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel12
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 1.ee
    text: |-
      verordening 2006/2004: verordening (EG) nr. 2006/2004 van het Europees Parlement en de Raad van de Europese
      Unie van 27 oktober 2004 betreffende samenwerking tussen de nationale instanties die verantwoordelijk zijn voor
      handhaving van de wetgeving inzake consumentenbescherming (PbEU L 364);
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.ff
    text: |-
      verzekering: de verbintenis tot het doen van een of meer uitkeringen tegen het genot van een door de consument te
      betalen premie, waarbij voor partijen geen zekerheid bestaat, dat, wanneer of tot welk bedrag enige uitkering moet
      worden gedaan, of hoe lang de premiebetaling zal duren en waarbij de uitkering zowel een geldelijke als een niet-
      geldelijke prestatie kan zijn.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: '2.1'
    text: |-
      Deze wet is niet van toepassing op financiële diensten die niet worden verricht in de uitoefening van een beroep
      of bedrijf.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
  - number: '2.2'
    text: 'Deze wet is voorts niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
  - number: 2.2.a
    text: |-
      financiële diensten die worden verleend door verenigingen en onderlinge waarborgmaatschappijen als bedoeld in
      [artikel 9, eerste lid, van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel9
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '9'
  - number: 2.2.b
    text: |-
      financiële diensten die worden verleend door verzekeraars als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __;


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel13
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '13'
  - number: 2.2.c
    text: |-
      financiële diensten die worden verleend door effectenbemiddelaars als bedoeld in
      [artikel 1, onderdeel b, van de Wet toezicht effectenverkeer 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel1
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '1'
  - number: 2.2.d
    text: |-
      financiële diensten die worden verleend door vermogensbeheerders als bedoeld in
      [artikel 1, onderdeel c, van de Wet toezicht effectenverkeer 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel1
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '1'
  - number: 2.2.e
    text: het aanbieden van effecten bij uitgifte;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
  - number: 2.2.f
    text: |-
      financiële diensten die worden verleend door beleggingsinstellingen als bedoeld in
      [artikel 1, onderdeel c, van de Wet toezicht beleggingsinstellingen][ref1], alsmede door beheerders als bedoeld
      in [artikel 1, onderdeel e, van die wet][ref2], voor zover het betreft het verrichten van financiële diensten
      ten aanzien van rechten van deelneming in de betrokken beleggingsinstellingen door de beleggingsinstellingen zelf
      onderscheidenlijk door de aan die beleggingsinstellingen verbonden beheerders;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel1
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '1'
  - number: 2.2.g
    text: 'het bemiddelen in verzekeringen, voorzover:'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
  - number: 2.2.g.1°
    text: de verzekering slechts kennis vergt van de verzekeringsdekking die geboden wordt;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
  - number: 2.2.g.2°
    text: de verzekering geen levensverzekeringovereenkomst is en geen aansprakelijkheidsrisico’s dekt;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
  - number: 2.2.g.3°
    text: de betreffende bemiddelaar een andere hoofdberoepswerkzaamheid heeft dan verzekeringsbemiddeling;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
  - number: 2.2.g.4°
    text: |-
      de verzekering een aanvulling is op de levering van een zaak of de verrichting van een dienst door de betreffende
      bemiddelaar, hetgeen het geval is indien de betreffende verzekering het risico dekt van defect, verlies of
      beschadiging van door die bemiddelaar geleverde zaken dan wel het risico dekt van beschadiging of verlies van
      bagage of andere risico’s die verband houden met een bij die bemiddelaar geboekte reis, ook indien de verzekering
      levensverzekering- of aansprakelijkheidsrisico’s dekt mits dat een bijkomende dekking is ten opzichte van de
      hoofddekking betreffende de met die reis verband houdende risico’s; en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
  - number: 2.2.g.5°
    text: |-
      het bedrag van de jaarlijkse premie niet hoger is dan € 500 en de volledige looptijd van de verzekering, met
      inbegrip van eventuele verlengingen, niet langer is dan een periode van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
  - number: 2.2.h
    text: |-
      financiële diensten ten aanzien van verzekeringen met betrekking tot buiten de lidstaten gesitueerde risico’s en
      verplichtingen;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
  - number: 2.2.i
    text: het door openbare lichamen ter uitvoering van een wettelijke taak aanbieden van krediet;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
  - number: 2.2.j
    text: |-
      financiële diensten die worden verleend door geregistreerde geldtransactiekantoren als bedoeld in
      [artikel 2, eerste lid, van de Wet inzake de geldtransactiekantoren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel2
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '2'
  - number: 2.2.k
    text: |-
      financiële diensten ten aanzien van krediet waarbij het effectief kredietvergoedingspercentage op het tijdstip
      van aangaan van de overeenkomst inzake het krediet niet meer bedraagt dan de wettelijke rente, bedoeld in
      [artikel 120, tweede lid, van Boek 6 van het Burgerlijk Wetboek][ref1], indien geen openbaar aanbod wordt gedaan
      tot het deelnemen aan die overeenkomst;


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel120
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '120'
  - number: 2.2.l
    text: |-
      financiële diensten ten aanzien van krediet bestaande uit een overeenkomst van huur en verhuur of waartoe een
      zodanige overeenkomst behoort, tenzij deze betrekking heeft op bij algemene maatregel van bestuur aan te wijzen
      zaken en de strekking heeft dat het verschaffen van het genot van de zaak waarop de overeenkomst betrekking heeft,
      al dan niet door verlenging van die overeenkomst of het aangaan van een nieuwe overeenkomst, langer dan zes maanden
      zal duren;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
  - number: 2.2.m
    text: |-
      financiële diensten ten aanzien van krediet bestaande uit het in ontvangst nemen van roerende zaken van een
      consument tegen het ter beschikking stellen van een geldsom aan de consument waarbij de consument gehouden
      is terzake een of meer betalingen te verrichten, voor zover de vordering op de consument uit hoofde van deze
      betalingsverplichting teniet gaat indien de betreffende roerende zaken door de financiële dienstverlener te gelde
      worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
  - number: 2.2.n
    text: |-
      financiële diensten ten aanzien van krediet waarbij is overeengekomen dat geen van de terzake verschuldigde
      betalingen van de consument later plaatsvindt dan drie maanden nadat de geldsom ter beschikking is gesteld, het
      genot van een roerende zaak is verschaft, dan wel een bij algemene maatregel van bestuur aangewezen dienst is
      verleend.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel2
  - number: '3.1'
    text: |-
      Deze wet is niet van toepassing op financiële diensten die kunnen worden aangemerkt als dienst van de
      informatiemaatschappij als bedoeld in [artikel 15d, derde lid, van Boek 3 van het Burgerlijk Wetboek][ref1], indien
      de dienstverlener is gevestigd in een andere lidstaat dan Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15d
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15d
  - number: '3.2'
    text: |-
      Indien ter bescherming van een van de belangen, bedoeld in het vierde lid, onder a, van
      [artikel V van de Aanpassingswet richtlijn inzake elektronische handel][ref1] maatregelen noodzakelijk zijn,
      kan de toezichthouder, zonodig met toepassing van het vijfde lid van dat artikel, bepalen dat deze wet geheel of
      gedeeltelijk, in afwijking van het eerste lid, van toepassing is op een financiële dienst als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016726#ArtikelV
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016726
        artikel: V
  - number: '4.1'
    text: |-
      Hetgeen bij of krachtens de [hoofdstukken 2][ref1] en [5][ref2], alsmede [artikel 28, eerste lid][ref3],
      is bepaald is niet van toepassing op de financiële dienstverlening door een gemeentelijke kredietbank waarop
      [artikel 55][ref4] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0018329#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0018329#Artikel55
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018329
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018329
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0018329
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0018329
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.2'
    text: |-
      Hetgeen bij of krachtens de [artikelen 26, eerste en tweede lid][ref1], en [27, eerste lid][ref2], is bepaald is
      niet van toepassing op de gemeentelijke kredietbank die geen rechtspersoonlijkheid bezit.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel27
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '5'
    text: |-
      Hetgeen bij of krachtens de paragrafen 2 en 3 van [hoofdstuk 3][ref1] en [hoofdstuk 4][ref2] is bepaald, is, met
      uitzondering van [artikel 37][ref3], niet van toepassing op herverzekeringsbemiddeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0018329#Artikel37
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018329
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0018329
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0018329
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '6'
    text: |-
      Ingeval van financiële diensten ten aanzien van een verzekering of ten aanzien van een financieel product dat
      bestaat uit een combinatie van financiële producten waarvan een verzekering deel uitmaakt, wordt voor de toepassing
      van deze wet met uitzondering van de [artikelen 40][ref1] en [41][ref2] onder consument mede verstaan de in de
      uitoefening van zijn bedrijf of beroep handelende natuurlijke persoon of rechtspersoon aan wie een financiële
      dienstverlener een financiële dienst verleent of aan wie deze voornemens is een financiële dienst te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel41
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '7'
    text: |-
      Voor de toepassing van deze wet wordt onder aanbieden van een financieel product mede verstaan het als wederpartij
      aangaan, beheren of uitvoeren van een overeenkomst met een consument inzake een financieel product.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel7
  - number: '8'
    text: |-
      [Paragraaf 2 van hoofdstuk 3][ref1] is niet van toepassing op financiële diensten ten aanzien van de verzekering van
      grote risico’s als bedoeld in [artikel 1, eerste lid, onder k, van de Wet toezicht verzekeringsbedrijf 1993][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel1
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018329
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '1'
  - number: '9.1'
    text: |-
      Indien de belangen die deze wet beoogt te beschermen anderszins voldoende worden beschermd kan bij ministeriële
      regeling vrijstelling worden verleend van het in [artikel 10][ref1] bedoelde verbod en van hetgeen overigens bij of
      krachtens deze wet is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel10
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.2'
    text: |-
      Aan een vrijstelling als bedoeld in het eerste lid kunnen voorschriften worden verbonden en beperkingen worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel9
  - number: '10'
    text: |-
      Het is verboden in of vanuit Nederland een financiële dienst te verlenen zonder daartoe van de toezichthouder een
      vergunning te hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel10
  - number: '11.1'
    text: |-
      De toezichthouder verleent een vergunning indien de aanvrager heeft aangetoond te voldoen aan hetgeen bij en
      krachtens [paragraaf 1 van hoofdstuk 3][ref1] van deze wet is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018329
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '11.2'
    text: |-
      De toezichthouder vermeldt in de vergunning de financiële producten en de financiële diensten waarvoor zij is
      verleend.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel11
  - number: '11.3'
    text: |-
      De toezichthouder kan aan een vergunning voorschriften verbinden en beperkingen stellen met het oog op een adequaat
      toezicht op de naleving van de bij en krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel11
  - number: '12.1'
    text: |-
      Het verbod, bedoeld in [artikel 10][ref1], is niet van toepassing op de bemiddelaar die bemiddelt voor een
      aanbieder, of meerdere aanbieders indien het niet om onderling concurrerende financiële producten gaat, en die,
      ingeval het bemiddeling in verzekeringen betreft, in naam en voor rekening van de aanbieder of aanbieders bemiddelt
      zonder daarbij premies of voor de consument bestemde bedragen te innen, indien de aanbieder voor wie de bemiddelaar
      bemiddelt:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel10
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 12.1.a
    text: |-
      volledig verantwoordelijk is voor de bemiddelaar, in die zin dat de aanbieder er voor zorg draagt dat de
      bemiddelaar voldoet aan hetgeen bij of krachtens deze wet is bepaald, en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel12
  - number: 12.1.b
    text: de betrokken bemiddelaar als «verbonden bemiddelaar» heeft aangemeld bij de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel12
  - number: '12.2'
    text: |-
      De aanbieder die niet langer verantwoordelijk is als bedoeld in het eerste lid, onder a, voor een bemiddelaar, doet
      daarvan mededeling aan de toezichthouder en de betrokken bemiddelaar.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel12
  - number: '13.1'
    text: |-
      Het verbod, bedoeld in [artikel 10][ref1], is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel10
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 13.1.a
    text: |-
      de verzekeraar met zetel buiten Nederland, voor zover het die verzekeraar ingevolge de
      [Wet toezicht verzekeringsbedrijf 1993][ref1] of de [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref2] is
      toegestaan in Nederland werkzaamheden te verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0006509
      [ref2]: https://wetten.overheid.nl/BWBR0007477
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006509
      - id: ref2
        bwb_id: BWBR0007477
  - number: 13.1.b
    text: |-
      de verzekeringsbemiddelaar of herverzekeringsbemiddelaar die in een andere lidstaat is geregistreerd in de zin
      van artikel 3 van de Richtlijn Verzekeringsbemiddeling en aan wie het ingevolge artikel 3, vijfde lid, van die
      richtlijn is toegestaan zijn werkzaamheden in Nederland aan te vangen, voor zover het de werkzaamheden betreft die
      het deze bemiddelaar volgens het register van zijn lidstaat van herkomst is toegestaan te verrichten;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel13
  - number: 13.1.c
    text: |-
      de kredietinstelling of de financiële instelling met zetel in een andere lidstaat, voor zover het die instelling
      ingevolge de [Wet toezicht kredietwezen 1992][ref1] is toegestaan in Nederland werkzaamheden te verrichten, met
      uitzondering van het aanbieden van krediet.


      [ref1]: https://wetten.overheid.nl/BWBR0005792
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005792
  - number: '13.2'
    text: |-
      [Paragraaf 1 van hoofdstuk 3][ref1] is niet van toepassing op de financiële dienstverleners, bedoeld in het eerste
      lid. In afwijking van de vorige volzin is [artikel 28][ref2] van toepassing op de financiële dienstverlener aan wie
      het ingevolge de [Wet toezicht kredietwezen 1992][ref3] is toegestaan door middel van een bijkantoor in Nederland
      werkzaamheden te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005792
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018329
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005792
  - number: '14.1'
    text: |-
      De volgende financiële dienstverleners beschikken van rechtswege over een vergunning als bedoeld in
      [artikel 10][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel10
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 14.1.a
    text: |-
      de kredietinstelling, bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1° van de Wet toezicht kredietwezen 1992][ref1], die ingevolge
      [artikel 52, tweede lid, onder a, van die wet][ref2] is ingeschreven in het in dat artikel bedoelde register;


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '52'
  - number: 14.1.b
    text: |-
      de kredietinstelling, bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 2°, van de Wet toezicht kredietwezen 1992][ref1], die ingevolge
      [artikel 52, tweede lid, onder a, van die wet][ref2] is ingeschreven in het in dat artikel bedoelde register, voor
      zover het die kredietinstelling is toegestaan werkzaamheden als bedoeld in die wet te verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '52'
  - number: 14.1.c
    text: |-
      de kredietinstelling of financiële instelling die ingevolge
      [artikel 52, tweede lid, onder b, c, d, f of g, van de Wet toezicht kredietwezen 1992][ref1] is ingeschreven in het
      in dat artikel bedoelde register, voor zover het die instelling is toegestaan krediet aan te bieden;


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '52'
  - number: 14.1.d
    text: |-
      de verzekeraar die in het bezit is van de in
      [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1] bedoelde vergunning, voor zover het
      die verzekeraar is toegestaan werkzaamheden als bedoeld in die wet te verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '24'
  - number: 14.1.e
    text: |-
      de verzekeraar die in het bezit is van de in
      [artikel 11 van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref1] bedoelde vergunning, voor zover het die
      verzekeraar is toegestaan werkzaamheden als bedoeld in die wet te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel11
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '11'
  - number: '14.2'
    text: |-
      De [artikelen 20, onder b, c en e][ref1], [26][ref2], [27, eerste lid][ref3], [28, derde lid][ref4], en [29][ref5]
      zijn niet van toepassing op de financiële dienstverleners, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0018329#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0018329#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0018329#Artikel29
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018329
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0018329
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0018329
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '14.3'
    text: |-
      De toezichthouder stuurt de in het eerste lid bedoelde financiële dienstverleners een bevestiging van de
      vergunning.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel14
  - number: '15.1'
    text: |-
      Aan de financiële dienstverlener, bedoeld in [artikel 14, eerste lid][ref1], waarvan de vergunning is ingetrokken
      op grond van [artikel 20][ref2], verleent de toezichthouder op verzoek een vergunning indien de financiële
      dienstverlener aantoont dat de intrekkingsgrond op grond waarvan de van rechtswege verleende vergunning is
      ingetrokken, niet langer op hem van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel20
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      [Artikel 20, onder e][ref1], is niet van toepassing op een financiële dienstverlener aan wie de toezichthouder op
      grond van het eerste lid een vergunning heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel20
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '16.1'
    text: |-
      De toezichthouder kan aan een rechtspersoon met volledige rechtsbevoegdheid een vergunning verlenen die mede strekt
      ten behoeve van bij die rechtspersoon aangesloten instellingen, indien die rechtspersoon:
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel16
  - number: 16.1.a
    text: |-
      krachtens zijn statuten en de statuten van de bij hem aangesloten instellingen of krachtens een overeenkomst met
      de bij hem aangesloten instellingen beschikt over voldoende bevoegdheden jegens de aangesloten instellingen om een
      handelen van een zodanige instelling in strijd met het bij of krachtens deze wet bepaalde tegen te kunnen gaan;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel16
  - number: 16.1.b
    text: beschikt over voldoende mogelijkheden tot deskundige ondersteuning van de aangesloten instellingen; en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel16
  - number: 16.1.c
    text: |-
      gemachtigd is die instellingen bij de vergunningaanvraag en ook overigens voor de toepassing van dit hoofdstuk
      te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel16
  - number: '16.2'
    text: |-
      Voor de toepassing van deze wet gelden handelingen van de aangesloten instelling als handelingen van de
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel16
  - number: '16.3'
    text: |-
      Indien na het verlenen van een vergunning als bedoeld in het eerste lid een instelling zich aansluit bij de
      rechtspersoon geldt de vergunning mede voor die instelling, indien de rechtspersoon ten aanzien van deze instelling
      voldoet aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel16
  - number: '16.4'
    text: |-
      De houder van een vergunning als bedoeld in het eerste lid maakt bij de toezichthouder onverwijld melding van
      de aansluiting van een instelling als bedoeld in het derde lid en van de beëindiging van de aansluiting van een
      aangesloten instelling.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel16
  - number: '17.1'
    text: |-
      De toezichthouder stelt regels ten aanzien van de wijze waarop de aanvraag om een vergunning wordt ingediend, de
      gegevens die daarbij worden verstrekt en de bescheiden die daarbij worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel17
  - number: '17.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de aanmelding, bedoeld in
      [artikel 12, eerste lid, onder b][ref1], en de mededeling, bedoeld in [artikel 12, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel12
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '18.1'
    text: |-
      De toezichthouder kan, op aanvraag, ontheffing verlenen van het in [artikel 10][ref1] bedoelde verbod, en van
      hetgeen overigens bij of krachtens deze wet is bepaald, indien de doeleinden die deze wet beoogt te bereiken
      anderszins voldoende worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel10
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '18.2'
    text: |-
      De toezichthouder kan aan een ontheffing als bedoeld in het eerste lid voorschriften verbinden of beperkingen
      stellen met het oog op het adequaat functioneren van de financiële markten of de positie van de consument op die
      markten.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel18
  - number: '19.1'
    text: 'De vergunning of de ontheffing vervalt, behoudens het bepaalde in het tweede lid:'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel19
  - number: 19.1.a
    text: door overlijden van de houder;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel19
  - number: 19.1.b
    text: indien de rechtspersoon waaraan de vergunning of ontheffing is verleend ophoudt te bestaan.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel19
  - number: '19.2'
    text: |-
      Indien zich een van de in het eerste lid bedoelde feiten of omstandigheden voordoet ten aanzien van een van de
      aangesloten instellingen als bedoeld in [artikel 16][ref1], dan wel de aansluiting van een dergelijke instelling
      is beëindigd, vervalt de werking van de vergunning ten behoeve van de betrokken instelling. Indien zich de
      in het eerste lid, onder b, bedoelde omstandigheid voordoet ten aanzien van de in [artikel 16][ref2] genoemde
      rechtspersoon zelf, vervalt de vergunning in haar geheel.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel16
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '19.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op de financiële dienstverlener die beschikt over een vergunning
      op grond van de [artikelen 14][ref1] of [15][ref2]. Een zodanige vergunning vervalt zodra:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel15
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 19.3.a
    text: |-
      de inschrijving, bedoeld in [artikel 14, eerste lid, onder a, b of c][ref1], vervalt;


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel14
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 19.3.b
    text: |-
      van het besluit tot intrekking van een vergunning als bedoeld in
      [artikel 14, eerste lid, onder d][ref1], mededeling is gedaan in de Staatscourant overeenkomstig
      [artikel 150, tweede lid, van de Wet toezicht verzekeringsbedrijf 1993][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel150
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '150'
  - number: 19.3.c
    text: |-
      van het besluit tot intrekking van een vergunning als bedoeld in
      [artikel 14, eerste lid, onder e][ref1], mededeling is gedaan in de Staatscourant overeenkomstig
      [artikel 61, tweede lid, van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007477#Artikel61
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007477
        artikel: '61'
  - number: '19.4'
    text: |-
      Indien op grond van het eerste of tweede lid een vergunning, dan wel de werking daarvan ten behoeve van een
      aangesloten instelling, vervalt, en de onderneming waarvoor de vergunning werd verleend, onderscheidenlijk waarvoor
      de vergunning mede geldt, aan een andere natuurlijke persoon of rechtspersoon is overgedragen of op een andere
      natuurlijke persoon of rechtspersoon is overgegaan, blijft de vergunning voor deze andere natuurlijke persoon of
      rechtspersoon gelden gedurende twee maanden na de dag waarop ingevolge het eerste of tweede lid de vergunning,
      dan wel de werking daarvan, zou vervallen en, indien binnen die periode door die natuurlijke of rechtspersoon
      een nieuwe vergunning is aangevraagd, daarna tot het tijdstip waarop de beslissing op de aanvraag onherroepelijk
      is geworden.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel19
  - number: '20'
    text: |-
      De toezichthouder kan de voorschriften en beperkingen, bedoeld in de [artikelen 11, derde lid][ref1], en
      [18, tweede lid][ref2], wijzigen, aanvullen of intrekken, alsnog voorschriften verbinden of beperkingen stellen aan
      een vergunning of ontheffing, dan wel de vergunning of ontheffing intrekken:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel18
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 20.a
    text: op verzoek van de houder;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel20
  - number: 20.b
    text: |-
      indien de gegevens of bescheiden die zijn verstrekt ter verkrijging van de vergunning of ontheffing zodanig
      onjuist of onvolledig blijken, dat de vergunning of ontheffing zou zijn geweigerd, dan wel onder het verbinden van
      voorschriften of het stellen van beperkingen zou zijn verleend, als bij de behandeling van de aanvraag de juiste
      gegevens volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel20
  - number: 20.c
    text: |-
      indien zich omstandigheden voordoen of feiten bekend worden op grond waarvan de vergunning of ontheffing zou zijn
      geweigerd, dan wel onder het verbinden van voorschriften of het stellen van beperkingen zou zijn verleend, als deze
      omstandigheden of feiten op het tijdstip waarop de vergunning of ontheffing werd verleend zich hadden voorgedaan of
      bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel20
  - number: 20.d
    text: |-
      indien de houder in staat van faillissement is komen te verkeren, of indien ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, of indien door een rechterlijke
      beschikking één of meer goederen van de houder onder een bewind als bedoeld in [artikel 380][ref1], [409][ref2] of
      [431 van Boek 1 van het Burgerlijk Wetboek][ref3] zijn gesteld, of indien de ondercuratelestelling van de houder
      is uitgesproken;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel380
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel409
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel431
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '380'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '409'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '431'
  - number: 20.e
    text: 'indien de houder:'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel20
  - number: 20.e.1°
    text: |-
      binnen een termijn van twaalf maanden na verlening van de vergunning of de ontheffing geen financiële diensten
      heeft verricht waarop de vergunning of ontheffing betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel20
  - number: 20.e.2°
    text: |-
      het verrichten van financiële diensten waarop de vergunning of ontheffing betrekking heeft gedurende een termijn
      van meer dan zes maanden heeft gestaakt; of
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel20
  - number: 20.e.3°
    text: kennelijk opgehouden heeft financiële dienstverlener te zijn;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel20
  - number: 20.f
    text: indien de houder niet voldoet aan bij of krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel20
  - number: '21.1'
    text: |-
      De toezichthouder kan aan een financiële dienstverlener als bedoeld in [artikel 13][ref1] een verbod opleggen tot
      het verrichten van financiële diensten in Nederland, indien de financiële dienstverlener niet of niet genoegzaam
      uitvoering heeft gegeven aan een door de toezichthouder op grond van [artikel 70][ref2] van deze wet gegeven
      aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel70
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '70'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '21.2'
    text: |-
      De toezichthouder stelt de toezichthoudende autoriteit van de lidstaat van de zetel van de financiële
      dienstverlener in kennis van het door hem opgelegde verbod.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel21
  - number: '22.1'
    text: |-
      Het in [artikel 10][ref1] bedoelde verbod is, voor zover het de afwikkeling van overeenkomsten betreft, niet van
      toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel10
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 22.1.a
    text: |-
      de voormalige vergunninghouder, onderscheidenlijk de voormalige aangesloten instelling, of de curator in het
      faillissement van de voormalige vergunninghouder, onderscheidenlijk de voormalige aangesloten instelling, vanaf het
      tijdstip waarop de vergunning is vervallen of ingetrokken, onderscheidenlijk de werking daarvan is vervallen;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel22
  - number: 22.1.b
    text: |-
      de financiële dienstverlener, bedoeld in [artikel 13][ref1], waarop dat artikel niet langer van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel13
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 22.1.c
    text: |-
      de financiële dienstverlener waaraan een verbod als bedoeld in [artikel 21][ref1] is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel21
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '22.2'
    text: |-
      De toezichthouder kan op een daartoe strekkend verzoek, met het oog op de voortzetting van het bedrijf van een
      bemiddelaar, indien dit verantwoord is in verband met de adequate functionering van de financiële markten en met de
      positie van de consument op die markten, ontheffing verlenen van het in [artikel 10][ref1] bedoelde verbod aan:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel10
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 22.2.a
    text: |-
      een der personen die met een overleden bemiddelaar tot het tijdstip van diens overlijden een duurzame
      gemeenschappelijke huishouding heeft gehad; of
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel22
  - number: 22.2.b
    text: een der niet tot de huishouding behorende kinderen van een overleden bemiddelaar.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel22
  - number: '22.3'
    text: |-
      De in het tweede lid bedoelde ontheffing kan met terugwerkende kracht worden verleend tot de datum van overlijden.
      De ontheffing geldt voor ten hoogste een jaar en kan ten hoogste tweemaal met een jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel22
  - number: '22.4'
    text: |-
      Het eerste lid is niet van toepassing op de gevolmachtigde agent, indien de aanbieder ingeval van beëindiging van
      de volmacht gebruik maakt van het in [artikel 61, tweede lid][ref1], bedoelde recht om op een andere wijze dan door
      belasting van de gevolmachtigde agent te voorzien in het beheer en de afwikkeling van de door de gevolmachtigde
      agent gevormde verzekeringsportefeuille.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel61
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '22.5'
    text: |-
      De toezichthouder kan terzake van de afwikkeling van overeenkomsten en de voortzetting van een bedrijf door een
      financiële dienstverlener voorschriften geven met het oog op het adequaat functioneren van de financiële markten of
      de positie van de consument op die markten.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel22
  - number: '23.1'
    text: |-
      De toezichthouder houdt een register waarin de vergunninghouders, verbonden bemiddelaars, financiële
      dienstverleners als bedoeld in de [artikelen 13, eerste lid][ref1], en [22, eerste lid][ref2], en ontheffinghouders
      zijn ingeschreven, alsmede de aan de desbetreffende vergunning of ontheffing verbonden voorschriften en de daaraan
      gestelde beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel22
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '23.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de gegevens betreffende de financiële
      dienstverleners die in het register worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel23
  - number: '23.3'
    text: |-
      De toezichthouder haalt de inschrijving in het register door zodra de vergunning of ontheffing onherroepelijk is
      ingetrokken of vervallen, dan wel een mededeling als bedoeld in [artikel 12, tweede lid][ref1], is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel12
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '23.4'
    text: |-
      De toezichthouder brengt de nodige wijzigingen in de ingeschreven gegevens aan indien zich de situatie, bedoeld in
      [artikel 16, derde lid][ref1], voordoet, dan wel de werking van een vergunning voor een aangesloten instelling als
      bedoeld in [artikel 16, eerste lid][ref2], vervalt ingevolge [artikel 19, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0018329#Artikel19
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018329
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '23.5'
    text: |-
      De toezichthouder kan de nodige wijzigingen in de ingeschreven gegevens aanbrengen indien haar is gebleken dat de
      ten aanzien van een financiële dienstverlener ingeschreven gegevens niet overeenstemmen met de werkelijke situatie.
      Hij doet hiervan aan de financiële dienstverlener onverwijld schriftelijk mededeling.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel23
  - number: '24.1'
    text: Het register is openbaar en ligt voor een ieder kosteloos ter inzage.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel24
  - number: '24.2'
    text: |-
      De toezichthouder verstrekt aan een ieder op aanvraag inlichtingen over, kopieën van of uittreksels uit in het
      register opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel24
  - number: '24.3'
    text: |-
      De toezichthouder stelt de voor de schriftelijke verstrekking van de in het tweede lid bedoelde gegevens
      verschuldigde bedragen vast, op zodanige wijze dat deze bedragen niet hoger zijn dan de werkelijke kosten, en maakt
      deze bedragen openbaar.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel24
  - number: '25.1'
    text: |-
      De bemiddelaar in verzekeringen en de herverzekeringsbemiddelaar aan wie een vergunning is verleend als bedoeld
      in [artikel 10][ref1] of die beschikt over een vergunning als bedoeld in [artikel 14, eerste lid, onder a][ref2],
      die voornemens is voor het eerst in een of meer andere lidstaten te bemiddelen in verzekeringen, stelt de
      toezichthouder daarvan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel14
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '25.2'
    text: |-
      Binnen een maand na de in het eerste lid bedoelde kennisgeving stelt de toezichthouder de bevoegde autoriteiten
      van de betreffende lidstaten van dit voornemen in kennis. De toezichthouder meldt de bemiddelaar dat de betreffende
      lidstaten in kennis zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel25
  - number: '25.3'
    text: |-
      De bemiddelaar kan één maand nadat hij de in het tweede lid bedoelde melding van de toezichthouder heeft ontvangen
      zijn bemiddelingswerkzaamheden in de betreffende lidstaat aanvangen.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel25
  - number: '25.4'
    text: |-
      De bemiddelaar kan zijn bemiddelingswerkzaamheden onmiddellijk aanvangen indien van de Europese Commissie is
      vernomen dat de betreffende lidstaat geen mededeling heeft gedaan als bedoeld in artikel 6, tweede lid, van de
      Richtlijn verzekeringsbemiddeling. Indien dit het geval is meldt de toezichthouder dit aan de bemiddelaar.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel25
  - number: '26.1'
    text: |-
      De financiële dienstverlener draagt er zorg voor dat de betrouwbaarheid van de personen die het beleid van de
      financiële dienstverlener bepalen of medebepalen buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel26
  - number: '26.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen andere bij financiële dienstverleners betrokken categorieën
      van personen worden aangewezen ten aanzien van wie de financiële dienstverlener er zorg voor draagt dat de
      betrouwbaarheid buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel26
  - number: '27.1'
    text: |-
      De financiële dienstverlener draagt er zorg voor dat de personen die het dagelijks beleid van de financiële
      dienstverlener bepalen deskundig zijn in verband met de bedrijfsvoering van de financiële dienstverlener.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel27
  - number: '27.2'
    text: |-
      De financiële dienstverlener draagt zorg voor de deskundigheid van zijn werknemers en van andere personen, die zich
      onder zijn verantwoordelijkheid rechtstreeks bezighouden met financiële dienstverlening. Hiertoe beschikt in ieder
      geval een zodanig aantal feitelijk leidinggevenden van de financiële dienstverlener over voldoende vakbekwaamheid
      dat de kwaliteit van de financiële dienstverlening aan de consument kan worden gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel27
  - number: '28.1'
    text: |-
      De administratieve organisatie en het systeem van interne controle van de financiële dienstverlener stellen de
      toezichthouder in staat toezicht te houden op de naleving van de bij en krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel28
  - number: '28.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met het oog op het adequaat functioneren van de financiële
      dienstverlener en het toezicht op de naleving van de bij en krachtens deze wet gestelde regels, regels worden
      gesteld ten aanzien van een adequate administratieve organisatie en systeem van interne controle.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel28
  - number: '28.3'
    text: |-
      Met het oog op het bevorderen en handhaven van een integere bedrijfsvoering, draagt de financiële dienstverlener
      zorg voor adequate maatregelen, gericht op:
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel28
  - number: 28.3.a
    text: |-
      het voorkomen van betrokkenheid van de financiële dienstverlener en van zijn werknemers bij strafbare feiten die
      het vertrouwen in de financiële dienstverlener of in de financiële markten in het algemeen schaden;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel28
  - number: 28.3.b
    text: andere bij algemene maatregel van bestuur te noemen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel28
  - number: '29'
    text: |-
      De bemiddelaar in verzekeringen en de herverzekeringsbemiddelaar beschikken over een
      beroepsaansprakelijkheidsverzekering of een daarmee vergelijkbare voorziening.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel29
  - number: '30.1'
    text: |-
      De financiële dienstverlener draagt er zorg voor dat de door of namens hem verstrekte informatie terzake van een
      financieel product of financiële dienst, waaronder reclame-uitingen, geen afbreuk doet aan de bij of krachtens deze
      wet aan de consument te verstrekken informatie.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel30
  - number: '30.2'
    text: |-
      De krachtens deze wet door de financiële dienstverlener verstrekte informatie is feitelijk juist, voor de consument
      begrijpelijk en niet misleidend.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel30
  - number: '31.1'
    text: |-
      Voorafgaande aan de totstandkoming van een overeenkomst inzake een financieel product verstrekt de financiële
      dienstverlener de consument informatie voor zover dit redelijkerwijs relevant is voor een adequate beoordeling van
      dat product.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel31
  - number: '31.2'
    text: |-
      In afwijking van het eerste lid kan bij of krachtens algemene maatregel van bestuur worden bepaald dat de
      financiële dienstverlener in daarbij te bepalen gevallen de in dat lid bedoelde informatie geheel of gedeeltelijk
      na het aangaan van de overeenkomst verstrekt.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel31
  - number: '31.3'
    text: |-
      Gedurende de looptijd van een overeenkomst inzake een financieel product verstrekt de financiële dienstverlener de
      consument tijdig informatie over:
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel31
  - number: 31.3.a
    text: |-
      wezenlijke wijzigingen in de informatie, bedoeld in het eerste lid, voor zover deze informatie redelijkerwijs
      relevant is voor de consument;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel31
  - number: 31.3.b
    text: bij of krachtens algemene maatregel van bestuur aan te wijzen andere onderwerpen.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel31
  - number: '31.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat de informatie, bedoeld in het derde lid, in
      daarbij aan te wijzen gevallen uitsluitend op verzoek van de consument wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel31
  - number: '32.1'
    text: 'Indien de financiële dienstverlener een consument adviseert:'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel32
  - number: 32.1.a
    text: |-
      wint hij in het belang van de consument informatie in over diens financiële positie, kennis, ervaring,
      doelstellingen en risicobereidheid, voor zover dit redelijkerwijs relevant is voor het advies;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel32
  - number: 32.1.b
    text: |-
      draagt hij er zorg voor dat zijn advies, voor zover redelijkerwijs mogelijk, rekening houdt met de onder a.
      bedoelde informatie;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel32
  - number: 32.1.c
    text: |-
      licht hij de overwegingen toe die ten grondslag liggen aan het advies, voorzover dit nodig is voor een goed begrip
      van het advies.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel32
  - number: '32.2'
    text: |-
      Indien de financiële dienstverlener bij het verlenen van een financiële dienst aan een consument deze niet
      adviseert, maakt hij dat bij aanvang van de dienstverlening aan deze kenbaar.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel32
  - number: '33.1'
    text: |-
      Onverminderd de [artikelen 31][ref1] en [32][ref2] informeert de bemiddelaar, voorafgaande aan de totstandkoming
      van een overeenkomst inzake een financieel product, de consument over de volgende onderwerpen:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel32
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 33.1.a
    text: of hij adviseert op grond van de in het tweede lid bedoelde verplichting tot een objectieve analyse; dan wel
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel33
  - number: 33.1.b
    text: |-
      of hij een contractuele verplichting heeft uitsluitend voor een of meer aanbieders te bemiddelen, in welk geval hij
      de consument tevens desgevraagd de namen van deze aanbieders mededeelt; dan wel
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel33
  - number: 33.1.c
    text: |-
      dat hij geen contractuele verplichting heeft uitsluitend voor een of meer aanbieders te bemiddelen en hij niet
      adviseert op grond van de in het tweede lid bedoelde verplichting tot een objectieve analyse, in welk geval hij de
      consument desgevraagd tevens de namen mededeelt van de aanbieders waarvoor hij bemiddelt of kan bemiddelen; en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel33
  - number: 33.1.d
    text: op welke wijze hij wordt beloond; en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel33
  - number: 33.1.e
    text: |-
      of hij een rechtstreeks of middelijke deelneming van 10% of meer van de stemrechten of van het kapitaal van een
      bepaalde aanbieder bezit; en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel33
  - number: 33.1.f
    text: |-
      of een bepaalde aanbieder of een bepaalde moederonderneming van een aanbieder een rechtstreekse of middelijke
      deelneming van meer dan 10% van de stemrechten of van het kapitaal van de bemiddelaar bezit; en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel33
  - number: 33.1.g
    text: bij of krachtens algemene maatregel van bestuur aan te wijzen andere onderwerpen.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel33
  - number: '33.2'
    text: |-
      Indien de bemiddelaar de consument adviseert op grond van een objectieve analyse, baseert hij zijn advies op een
      analyse van een toereikend aantal op de markt verkrijgbare vergelijkbare financiële producten, zodat hij in staat
      is een financieel product aan te bevelen dat aan de behoeften van de consument voldoet.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel33
  - number: '33.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ter zake van een beloning of vergoeding voor het
      bemiddelen in financiële producten, in welke vorm ook, alsmede ter zake van de wijze van uitbetaling daarvan.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel33
  - number: '34.1'
    text: |-
      Onverminderd de [artikelen 31][ref1] en [32][ref2] informeert de adviseur, voorafgaande aan de totstandkoming van
      een overeenkomst inzake een financieel product, de consument over de volgende onderwerpen:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel32
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 34.1.a
    text: of hij adviseert op grond van de in het tweede lid bedoelde verplichting tot een objectieve analyse; dan wel
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel34
  - number: 34.1.b
    text: |-
      of hij een contractuele verplichting heeft uitsluitend voor een of meer aanbieders te adviseren, in welk geval hij
      de consument tevens desgevraagd de namen van deze aanbieders mededeelt; dan wel
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel34
  - number: 34.1.c
    text: |-
      dat hij geen contractuele verplichting heeft uitsluitend voor een of meer aanbieders te adviseren en hij niet
      adviseert op grond van de in het tweede lid bedoelde verplichting tot een objectieve analyse, in welk geval hij de
      consument desgevraagd tevens de namen mededeelt van de aanbieders waarvoor hij adviseert of kan adviseren; en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel34
  - number: 34.1.d
    text: op welke wijze hij wordt beloond; en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel34
  - number: 34.1.e
    text: |-
      of hij een rechtstreeks of middelijke deelneming van 10% of meer van de stemrechten of van het kapitaal van een
      bepaalde aanbieder bezit; en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel34
  - number: 34.1.f
    text: |-
      of een bepaalde aanbieder of een bepaalde moederonderneming van een aanbieder een rechtstreekse of middelijke
      deelneming van meer dan 10% van de stemrechten of van het kapitaal van de bemiddelaar bezit; en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel34
  - number: 34.1.g
    text: bij of krachtens algemene maatregel van bestuur aan te wijzen andere onderwerpen.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel34
  - number: '34.2'
    text: |-
      Indien de adviseur de consument adviseert op grond van een objectieve analyse, baseert hij zijn advies op een
      analyse van een toereikend aantal op de markt verkrijgbare vergelijkbare financiële producten, zodat hij in staat
      is een financieel product aan te bevelen dat aan de behoeften van de consument voldoet.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel34
  - number: '34.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ter zake van een beloning of vergoeding voor het
      adviseren over financiële producten, in welke vorm ook, alsmede ter zake van de wijze van uitbetaling daarvan.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel34
  - number: '35'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de
      informatievoorziening aan de consument door de financiële dienstverlener.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel35
  - number: '36.1'
    text: |-
      Het bij of krachtens [artikel 31, eerste en derde lid][ref1], bepaalde is niet van toepassing op de financiële
      dienstverlener die een financiële dienst verleent door tussenkomst van een bemiddelaar, een gevolmachtigde agent of
      een ondergevolmachtigde agent.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel31
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '36.2'
    text: |-
      De financiële dienstverlener kan met de bemiddelaar, de gevolmachtigde agent of de ondergevolmachtigde
      agent overeenkomen dat in afwijking van het eerste lid, niet de bemiddelaar, de gevolmachtigde agent of de
      ondergevolmachtigde agent maar de financiële dienstverlener zelf aan [artikel 31, eerste en derde lid][ref1],
      voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel31
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '37.1'
    text: |-
      De financiële dienstverlener draagt zorg voor een adequate behandeling van klachten van consumenten over financiële
      producten of financiële diensten van de financiële dienstverlener. Hiertoe:
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel37
  - number: 37.1.a
    text: |-
      beschikt de financiële dienstverlener over een interne klachtenprocedure, gericht op een spoedige en zorgvuldige
      behandeling van klachten; en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel37
  - number: 37.1.b
    text: |-
      is de financiële dienstverlener aangesloten bij een door Onze Minister erkende geschilleninstantie, die geschillen
      behandelt ten aanzien van de financiële producten of financiële diensten van de financiële dienstverlener.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel37
  - number: '37.2'
    text: |-
      De in het eerste lid onder b genoemde verplichting geldt niet indien er geen erkende geschilleninstantie is
      die geschillen behandelt ten aanzien van de financiële producten of financiële diensten van de financiële
      dienstverlener.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel37
  - number: '37.3'
    text: Bij algemene maatregel van bestuur worden regels gesteld ten aanzien van de erkenning van geschilleninstanties.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel37
  - number: '38.1'
    text: |-
      De financiële dienstverlener houdt zich aan bij of krachtens algemene maatregel van bestuur te stellen nadere
      regels ten aanzien van de bij de behandeling van de consument in acht te nemen zorgvuldigheid.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel38
  - number: '38.2'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur die strekt tot
      wijziging van een reeds vastgestelde algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat
      het ontwerp aan beide kamers der Staten-Generaal is overgelegd, behoudens indien het vaststellen van de algemene
      maatregel van bestuur naar het oordeel van Onze Minister spoedeisend is.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel38
  - number: '39'
    text: |-
      Indien de financiële dienstverlener werkzaamheden uitbesteedt aan een derde, draagt hij er zorg voor dat deze
      derde bij de uitvoering van die werkzaamheden de regels die bij of krachtens deze wet zijn gesteld ten aanzien van
      die werkzaamheden naleeft. Het uitbesteden van werkzaamheden aan een derde is niet toegestaan indien hierdoor het
      toezicht op de naleving van het bij of krachtens deze wet bepaalde wordt gehinderd.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel39
  - number: '40.1'
    text: |-
      De consument kan een overeenkomst op afstand zonder een boete verschuldigd te zijn en zonder opgave van redenen
      ontbinden gedurende veertien kalenderdagen met ingang van de dag waarop die overeenkomst is aangegaan, dan wel,
      indien dit later is, gedurende veertien kalenderdagen met ingang van de dag waarop de informatie die de financiële
      dienstverlener hem overeenkomstig [artikel 31, eerste lid][ref1], dient te verstrekken, door hem is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel31
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '40.2'
    text: |-
      In afwijking van het eerste lid kan de consument een overeenkomst op afstand inzake een levensverzekering zonder
      boete en zonder opgave van redenen ontbinden gedurende dertig kalenderdagen met ingang van de dag waarop hij van
      het tot stand komen van de overeenkomst in kennis wordt gesteld, dan wel, indien dit later is, gedurende dertig
      kalenderdagen met ingang van de dag waarop de informatie die de financiële dienstverlener hem overeenkomstig
      [artikel 31, eerste lid][ref1], dient te verstrekken, door hem is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel31
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '40.3'
    text: |-
      Indien de consument gebruik wenst te maken van het in het eerste of tweede lid bedoelde recht, dient hij
      daarvan voor het verstrijken van de vastgestelde termijn kennis te geven aan de financiële dienstverlener
      volgens de instructies voor de uitoefening van het in eerste of tweede lid bedoelde recht die hem overeenkomstig
      [artikel 31, eerste lid][ref1], zijn gegeven. De kennisgeving wordt als tijdig aangemerkt indien zij schriftelijk
      of op een voor de financiële dienstverlener beschikbare en toegankelijke duurzame drager is verzonden voor het
      verstrijken van de termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel31
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '40.4'
    text: 'Het eerste en tweede lid zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel40
  - number: 40.4.a
    text: |-
      overeenkomsten inzake financiële producten waarvan de waarde gedurende de termijn, bedoeld in het eerste of tweede
      lid, afhankelijk is van ontwikkelingen op de financiële markten of andere markten;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel40
  - number: 40.4.b
    text: overeenkomsten inzake kortetermijnverzekeringen met een looptijd van minder dan één maand;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel40
  - number: 40.4.c
    text: |-
      overeenkomsten die op uitdrukkelijk verzoek van de consument volledig zijn uitgevoerd voordat de consument gebruik
      maakt van het in het eerste of tweede lid genoemde recht;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel40
  - number: 40.4.d
    text: |-
      overeenkomsten inzake krediet die zijn ontbonden als bedoeld in de [artikelen 7:46e][ref1] en
      [7:48e van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46e
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel48e
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46e
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 48e
  - number: 40.4.e
    text: overeenkomsten inzake krediet waarbij hypothecaire zekerheid wordt verleend;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel40
  - number: 40.4.f
    text: bij algemene maatregel van bestuur aan te wijzen andere overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel40
  - number: '40.5'
    text: |-
      Indien aan de overeenkomst op afstand een andere overeenkomst verbonden is ten aanzien van een zaak of dienst
      die door de financiële dienstverlener wordt geleverd of door een derde op grond van een overeenkomst tussen de
      dienstverlener en deze derde, brengt de ontbinding van de overeenkomst op afstand overeenkomstig het eerste of
      tweede lid van rechtswege en zonder dat de consument een boete verschuldigd is, de ontbinding mee van die verbonden
      overeenkomst.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel40
  - number: '41.1'
    text: Met de uitvoering van een overeenkomst op afstand wordt pas na toestemming van de consument een begin gemaakt.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel41
  - number: '41.2'
    text: |-
      Indien de consument gebruik maakt van zijn in [artikel 40, eerste of tweede lid][ref1], bedoelde recht, kan
      de financiële dienstverlener uitsluitend een vergoeding vragen voor het financiële product dat krachtens de
      overeenkomst op afstand is geleverd. Deze vergoeding is:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel40
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 41.2.a
    text: |-
      niet hoger dan een bedrag evenredig aan de verhouding tussen het reeds geleverde product en de volledige uitvoering
      van de overeenkomst op afstand; en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel41
  - number: 41.2.b
    text: in geen geval zo hoog dat deze als een boete kan worden opgevat.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel41
  - number: '41.3'
    text: 'De financiële dienstverlener kan slechts betaling op grond van het tweede lid verlangen indien hij:'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel41
  - number: 41.3.a
    text: |-
      kan aantonen dat de consument overeenkomstig [artikel 31, eerste lid][ref1], is geïnformeerd over de in het tweede
      lid bedoelde vergoeding; en


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel31
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 41.3.b
    text: |-
      op uitdrukkelijk verzoek van de consument met de uitvoering van de overeenkomst is begonnen voor het verstrijken
      van de in [artikel 40, eerste of tweede lid][ref1], genoemde ontbindingstermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel40
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '41.4'
    text: |-
      De financiële dienstverlener betaalt de consument zo spoedig mogelijk en uiterlijk binnen 30 kalenderdagen nadat
      hij de kennisgeving van de in [artikel 40][ref1] bedoelde ontbinding heeft ontvangen, al hetgeen hij krachtens de
      overeenkomst op afstand van hem ontvangen heeft terug, verminderd met het in het tweede lid bedoelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel40
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '41.5'
    text: |-
      De consument geeft de financiële dienstverlener onverwijld, en uiterlijk binnen 30 kalenderdagen nadat hij de
      kennisgeving van de in [artikel 40][ref1] bedoelde ontbinding heeft verzonden, alle geldbedragen of zaken terug die
      hij van de financiële dienstverlener heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel40
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '42.1'
    text: |-
      Met uitzondering van [artikel 43][ref1] is het bepaalde in deze paragraaf met betrekking tot de verhouding tussen
      de aanbieder en de bemiddelaar van overeenkomstige toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel43
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 42.1.a
    text: de verhouding tussen de gevolmachtigde agent en de bemiddelaar;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel42
  - number: 42.1.b
    text: de verhouding tussen de ondergevolmachtigde agent en de bemiddelaar; en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel42
  - number: 42.1.c
    text: de verhouding tussen de bemiddelaar en de onderbemiddelaar.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel42
  - number: '42.2'
    text: |-
      Het bepaalde in deze paragraaf met betrekking tot de verhouding tussen de aanbieder en de gevolmachtigde agent is
      van overeenkomstige toepassing op:
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel42
  - number: 42.2.a
    text: de verhouding tussen de gevolmachtigde agent en de ondergevolmachtigde agent;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel42
  - number: 42.2.b
    text: |-
      de verhouding tussen de ondergevolmachtigde agent en een andere ondergevolmachtigde agent aan wie hij een
      ondervolmacht heeft verleend.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel42
  - number: '43'
    text: |-
      De aanbieder draagt ervoor zorg dat de verbonden bemiddelaar, via welke hij overeenkomsten met consumenten aangaat,
      voldoet aan hetgeen bij en krachtens deze wet is bepaald.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel43
  - number: '44.1'
    text: |-
      Het is verboden te bemiddelen of als gevolmachtigde agent op te treden voor een aanbieder waarop het verbod,
      bedoeld in [artikel 10][ref1], van toepassing is en die niet is ingeschreven in het register, bedoeld in
      [artikel 23][ref2], of voor een aanbieder als bedoeld in [artikel 13][ref3] waaraan een verbod als bedoeld in
      [artikel 21][ref4] is opgelegd. Het verbod te bemiddelen of op te treden als gevolmachtigde agent geldt niet voor
      zover het de aanbieder is toegestaan overeenkomsten af te wikkelen op grond van [artikel 22][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0018329#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0018329#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0018329#Artikel22
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0018329
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0018329
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0018329
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '44.2'
    text: |-
      De bemiddelingsactiviteiten en de activiteiten van de gevolmachtigde agent hebben slechts betrekking op de
      financiële producten die de aanbieder op grond van deze wet mag aanbieden.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel44
  - number: '44.3'
    text: |-
      Het is een aanbieder verboden financiële producten aan te bieden door middel van een bemiddelaar of een
      gevolmachtigde agent die niet is ingeschreven in het register, bedoeld in [artikel 23][ref1], of door een
      bemiddelaar als bedoeld in [artikel 13, eerste lid, onderdeel b][ref2], waaraan een verbod als bedoeld in
      [artikel 21][ref3] is opgelegd. Het verbod geldt niet voor zover het de bemiddelaar of de gevolmachtigde agent is
      toegestaan overeenkomsten af te wikkelen op grond van [artikel 22][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0018329#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0018329#Artikel22
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018329
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0018329
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '44.4'
    text: |-
      Indien een aanbieder financiële producten aanbiedt door middel van een bemiddelaar of een gevolmachtigde agent,
      hebben de activiteiten van de aanbieder slechts betrekking op de financiële producten ten aanzien waarvan het de
      bemiddelaar of de gevolmachtigde agent op grond van deze wet is toegestaan te bemiddelen dan wel op te treden als
      gevolmachtigde agent.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel44
  - number: '45.1'
    text: |-
      De aanbieder die door een bemiddelaar voor de eerste maal wordt benaderd met een voorstel tot het aangaan van een
      overeenkomst inzake een financieel product gaat slechts tot behandeling van dat voorstel over indien hij zich ervan
      heeft vergewist dat de bemiddelaar voor het bemiddelen in dat financiële product is ingeschreven in het register,
      bedoeld in [artikel 23][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel23
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '45.2'
    text: |-
      De aanbieder gaat eenmaal per twaalf maanden na of de bemiddelaar via wie hij overeenkomsten inzake financiële
      producten aangaat of die assisteert bij het beheer en de uitvoering van een overeenkomst inzake een financieel
      product, nog voor deze activiteit in het register, bedoeld in [artikel 23][ref1], is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel23
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '45.3'
    text: |-
      De aanbieder gaat tevens na of de bemiddelaar, bedoeld in het tweede lid, nog voor de in dat lid bedoelde
      activiteit is ingeschreven in het register, bedoeld in [artikel 23][ref1], indien hij in het kader van de normale
      bedrijfsvoering signalen ontvangt die bij hem twijfel oproept over deze inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel23
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '46.1'
    text: |-
      De aanbieder gaat pas over tot het verlenen van een volmacht, indien hij zich ervan heeft vergewist dat de
      gevolmachtigde agent is ingeschreven in het register, bedoeld in [artikel 23][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel23
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '46.2'
    text: |-
      De aanbieder gaat eenmaal per twaalf maanden na of de gevolmachtigde agent aan wie hij een volmacht heeft verleend,
      nog in het register, bedoeld in [artikel 23][ref1], is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel23
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '46.3'
    text: |-
      De aanbieder gaat tevens na of de gevolmachtigde agent aan wie hij een volmacht heeft verleend, nog in het
      register, bedoeld in [artikel 23][ref1], is ingeschreven, indien hij in het kader van de normale bedrijfsvoering
      signalen ontvangt die bij hem twijfel oproept over deze inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel23
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '47.1'
    text: |-
      Indien de aanbieder in het kader van de normale bedrijfsvoering constateert dat een bemiddelaar of een
      gevolmachtigde agent het bij of krachtens [paragraaf 1 van dit hoofdstuk][ref1] bepaalde overtreedt, meldt de
      aanbieder de geconstateerde overtreding onverwijld aan de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0018329
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '47.2'
    text: |-
      Indien de aanbieder in het kader van de normale bedrijfsvoering constateert dat een bemiddelaar of
      een gevolmachtigde agent het bij of krachtens deze wet bepaalde, met uitzondering van het bepaalde in
      [paragraaf 1 van dit hoofdstuk][ref1], stelselmatig overtreedt, meldt de aanbieder de geconstateerde overtreding
      onverwijld aan de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0018329
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '48'
    text: |-
      Degene die tot een melding op de voet van [artikel 47][ref1] is overgegaan, is niet aansprakelijk voor schade die
      een derde dientengevolge lijdt, tenzij gelet op alle feiten en omstandigheden in redelijkheid niet tot melding had
      mogen worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel47
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '49'
    text: |-
      Financiële dienstverleners stellen elkaar over en weer in staat te voldoen aan hetgeen bij of krachtens deze wet is
      bepaald, voor zover zij daarvoor van elkaar afhankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel49
  - number: '50'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de in deze paragraaf
      geregelde verhoudingen tussen financiële dienstverleners.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel50
  - number: '51.1'
    text: |-
      De aanbieder wint in het belang van de consument voorafgaande aan de totstandkoming van een overeenkomst
      inzake krediet, informatie in over de financiële positie van de consument en beoordeelt, ter voorkoming van
      overkreditering van de consument, of het aangaan van de overeenkomst verantwoord is.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel51
  - number: '51.2'
    text: |-
      De aanbieder gaat geen overeenkomst inzake krediet aan met een consument, indien dit, met het oog op voorkoming van
      overkreditering van de consument, onverantwoord is.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel51
  - number: '52'
    text: De aanbieder van krediet neemt deel aan een stelsel van kredietregistratie.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel52
  - number: '53.1'
    text: |-
      Het is de bemiddelaar verboden voor het verlenen van bemiddeling terzake van krediet een beloning of vergoeding, in
      welke vorm ook, te bedingen of te aanvaarden van, dan wel in rekening te brengen aan een ander dan de aanbieder van
      het krediet.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel53
  - number: '53.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen, ten einde een zorgvuldige bemiddeling in krediet te bevorderen, regels
      worden gesteld ter zake van de beloning of vergoeding, bedoeld in het eerste lid, alsmede ter zake van de wijze van
      uitbetaling daarvan.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel53
  - number: '53.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op overeenkomsten inzake krediet, bij het aangaan waarvan
      hypothecaire zekerheid wordt verleend, dan wel overeenkomsten inzake krediet met betrekking waartoe reeds
      hypothecaire zekerheid bestaat, mits het krediet wordt verleend tegen een voor hypothecaire financieringen van de
      betrokken aanbieder gebruikelijk effectief kredietvergoedingspercentage.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel53
  - number: '54'
    text: |-
      Een gemeentelijke kredietbank wordt opgericht en opgeheven bij een daartoe strekkend besluit van burgemeester en
      wethouders. Het besluit wordt onderworpen aan de goedkeuring van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel54
  - number: '55.1'
    text: |-
      Burgemeester en wethouders stellen voor de bedrijfsvoering van de gemeentelijke kredietbank een reglement vast,
      waaruit voor het aanbieden van krediet in het kader van het uitoefenen van de publieke taak ten minste blijkt op
      welke wijze zal worden voldaan aan hetgeen is bepaald bij of krachtens deze paragraaf, [hoofdstuk 3][ref1] van deze
      wet en de [hoofdstukken IV][ref2] en [V van de Wet op het consumentenkrediet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0004815#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0004815#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0018329
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0004815
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004815
        hoofdstuk: V
  - number: '55.2'
    text: Het reglement wordt onderworpen aan de goedkeuring van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel55
  - number: '55.3'
    text: |-
      Burgemeester en wethouders zien toe op de naleving door de gemeentelijke kredietbank van het reglement, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel55
  - number: '56'
    text: Deze paragraaf is uitsluitend van toepassing op financiële dienstverlening inzake verzekeringen.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel56
  - number: '57'
    text: |-
      Het bepaalde in deze paragraaf met betrekking tot de verhouding tussen de aanbieder en de bemiddelaar is van
      overeenkomstige toepassing op:
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel57
  - number: 57.a
    text: de verhouding tussen de bemiddelaar en de onderbemiddelaar;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel57
  - number: 57.b
    text: de verhouding tussen de gevolmachtigde agent en de bemiddelaar; en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel57
  - number: 57.c
    text: de verhouding tussen de ondergevolmachtigde agent en de bemiddelaar.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel57
  - number: '58'
    text: |-
      Een verzekering welke door bemiddeling van een bemiddelaar tot stand is gekomen of naar de portefeuille van een
      bemiddelaar is overgeboekt behoort in de relatie tot de betrokken aanbieder tot de portefeuille van die bemiddelaar
      zolang die verzekering daaruit niet is overgeboekt.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel58
  - number: '59.1'
    text: |-
      De aanbieder kan slechts met toestemming van de bemiddelaar of diens rechtverkrijgenden een deel of het geheel van
      diens portefeuille overboeken naar de portefeuille van een andere bemiddelaar.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel59
  - number: '59.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid boekt de aanbieder op schriftelijk verzoek van een consument diens
      verzekering uit de portefeuille van een bemiddelaar over naar die van een andere bemiddelaar, tenzij de aanbieder
      gegronde bezwaren heeft tegen die bemiddelaar.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel59
  - number: '59.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op het door een aanbieder in eigen beheer nemen van
      een verzekering.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel59
  - number: '59.4'
    text: |-
      De aanbieder verleent op schriftelijk verzoek van een bemiddelaar zijn medewerking aan de gehele of gedeeltelijke
      overdracht van de portefeuille van die bemiddelaar aan een andere bemiddelaar, tenzij de aanbieder gegronde
      bezwaren heeft tegen die bemiddelaar.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel59
  - number: '60.1'
    text: |-
      Tenzij anders wordt overeengekomen of de bemiddelaar zich bij de verzekering tegenover de aanbieder tot betaling
      van premie en kosten als eigen schuld heeft verbonden, verzorgt de bemiddelaar voor de aanbieder het incasso van
      de premies. Ter zake van dit premie-incasso is hij jegens de aanbieder te allen tijde rekening en verantwoording
      schuldig.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel60
  - number: '60.2'
    text: |-
      Tenzij tussen een aanbieder en een bemiddelaar anders is overeengekomen kan de aanbieder de bemiddelaar van het
      premie-incasso ontheffen, indien:
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel60
  - number: 60.2.a
    text: |-
      de bemiddelaar niet meer is ingeschreven in het register, bedoeld in [artikel 23][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel23
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 60.2.b
    text: de bemiddelaar het premie-incasso in ernstige mate verwaarloost;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel60
  - number: 60.2.c
    text: de bemiddelaar in gebreke blijft namens de aanbieder door hem geïnde premies tijdig aan deze af te dragen; of
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel60
  - number: 60.2.d
    text: |-
      de bemiddelaar zich schuldig heeft gemaakt aan handelingen, die de vrees wettigen dat hij niet zal voldoen aan zijn
      uit het premie-incasso voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel60
  - number: '60.3'
    text: |-
      In de gevallen waarin in verband met het bepaalde in het tweede lid het premie-incasso door een bemiddelaar
      eindigt, wordt dit door de aanbieder overgenomen.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel60
  - number: '61.1'
    text: |-
      De beëindiging van een volmacht van een gevolmachtigde agent heeft geen werking tegen derden tot het tijdstip
      waarop de aanbieder of de gevolmachtigde agent van die beëindiging mededeling heeft gedaan aan de toezichthouder en
      de toezichthouder het register heeft aangepast.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel61
  - number: '61.2'
    text: |-
      Ingeval een volmacht is beëindigd, kan de aanbieder de gevolmachtigde agent, wiens volmacht is vervallen, belasten
      met het beheer en de afwikkeling van de door hem gevormde verzekeringsportefeuille. Aan de aanbieder blijft het
      recht voorbehouden op andere wijze in het beheer en de afwikkeling van die portefeuille te voorzien.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel61
  - number: '62.1'
    text: |-
      Het bepaalde in [artikel 61][ref1] met betrekking tot de gevolmachtigde agent is van overeenkomstige toepassing op
      de ondergevolmachtigde agent.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel61
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '62.2'
    text: |-
      Voor de toepassing van [artikel 61][ref1] wordt onder de aanbieder mede verstaan de gevolmachtigde agent in zijn
      kwaliteit van verlener van ondervolmachten.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel61
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '63'
    text: Het toezicht op de naleving van hetgeen bij en krachtens deze wet is bepaald, berust bij de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel63
  - number: '64'
    text: |-
      De toezichthouder verstrekt Onze Minister desgevraagd de inlichtingen die nodig zijn voor de beoordeling van de
      uitvoerbaarheid van voorgenomen wettelijke voorschriften en algemene beleidsvoornemens, voor zover deze betrekking
      hebben op het gedrag van financiële dienstverleners jegens consumenten en op het adequaat functioneren van de
      financiële markten.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel64
  - number: '65.1'
    text: |-
      Onze Minister kan aan de toezichthouder de gegevens of inlichtingen vragen die naar zijn oordeel nodig zijn voor
      een onderzoek naar de toereikendheid van deze wet of de wijze waarop de toezichthouder deze wet uitvoert of heeft
      uitgevoerd, indien dat ter wille van het toezicht, bedoeld in [artikel 63][ref1], nodig blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel63
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '63'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '65.2'
    text: |-
      De toezichthouder verstrekt aan Onze Minister de in het eerste lid bedoelde gegevens of inlichtingen. Indien Onze
      Minister de toezichthouder vraagt bepaalde gegevens of inlichtingen te verstrekken die onder [artikel 84][ref1]
      vallen, is de toezichthouder niet verplicht deze gegevens of inlichtingen te verstrekken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel84
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '84'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 65.2.a
    text: |-
      deze betrekking hebben op of herleidbaar zijn tot een afzonderlijke rechtspersoon, vennootschap of natuurlijke
      persoon, met uitzondering van gegevens of inlichtingen die betrekking hebben op of herleidbaar zijn tot een
      afzonderlijke financiële dienstverlener die in het bezit is van een vergunning als bedoeld in [artikel 11][ref1]
      of waarvan die vergunning is ingetrokken of vervallen, tot een afzonderlijke verbonden bemiddelaar of
      tot een afzonderlijke financiële dienstverlener als bedoeld in [artikel 13, eerste lid][ref2], en ten
      aanzien waarvan overeenkomstig [artikel 66 van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref3],
      [artikel 156 van de Wet toezicht verzekeringsbedrijf 1993][ref4] of
      [artikel 71 van de Wet toezicht kredietwezen 1992][ref5] de noodregeling is uitgesproken, surseance van betaling
      is verleend of die in staat van faillissement is verklaard, de schuldsaneringsregeling natuurlijke personen van
      toepassing is verklaard of op grond van een rechterlijke uitspraak is ontbonden;


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel66
      [ref4]: https://wetten.overheid.nl/BWBR0006509#Artikel156
      [ref5]: https://wetten.overheid.nl/BWBR0005792#Artikel71
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007477
        artikel: '66'
      - id: ref4
        bwb_id: BWBR0006509
        artikel: '156'
      - id: ref5
        bwb_id: BWBR0005792
        artikel: '71'
  - number: 65.2.b
    text: |-
      deze betrekking hebben op ondernemingen of instellingen die betrokken zijn of zijn geweest bij een poging een
      aanbieder in staat te stellen zijn bedrijf voort te zetten; of
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel65
  - number: 65.2.c
    text: |-
      deze zijn ontvangen van een instantie als bedoeld in [artikel 94, eerste lid][ref1], of zijn verkregen naar
      aanleiding van een verificatie bij een in een andere staat gelegen bijkantoor van een in Nederland gevestigde
      financiële dienstverlener, tenzij de uitdrukkelijke instemming is verkregen van die instantie onderscheidenlijk van
      de toezichthoudende autoriteit van de staat waar de verificatie ter plaatse is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel94
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '94'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: '65.3'
    text: |-
      Onze Minister kan een derde opdragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn verstrekt
      te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze Minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel65
  - number: '65.4'
    text: |-
      Onze Minister gebruikt de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen
      uitsluitend voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de
      toezichthouder deze wet uitvoert of heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel65
  - number: '65.5'
    text: |-
      Onze Minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van het
      tweede lid, tweede volzin, ontvangen gegevens of inlichtingen. [Artikel 84][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel84
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '84'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '65.6'
    text: |-
      Niettegenstaande het vierde en vijfde lid kan Onze Minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de Staten-Generaal mededelen en de conclusies in algemene zin
      uit het onderzoek openbaar maken.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel65
  - number: '65.7'
    text: |-
      De [Wet openbaarheid van bestuur][ref1] en de [Wet Nationale ombudsman][ref2] zijn niet van toepassing met
      betrekking tot de in dit artikel bedoelde gegevens of inlichtingen die Onze Minister of de in zijn opdracht
      werkende derde onder zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0003372
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0003372
  - number: '66.1'
    text: |-
      De toezichthouder brengt jaarlijks over zijn werkzaamheden en bevindingen ingevolge deze wet aan Onze Minister
      verslag uit.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel66
  - number: '66.2'
    text: De toezichthouder maakt het verslag openbaar.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel66
  - number: '67'
    text: |-
      Onze Minister kan de toezichthouder voorschriften geven ter implementatie van richtlijnen van de Raad van de
      Europese Unie dan wel van het Europees Parlement en de Raad van de Europese Unie gezamenlijk op het gebied van
      financiële dienstverlening in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel67
  - number: '68.1'
    text: 'De toezichthouder kan bij:'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel68
  - number: 68.1.a
    text: de aanvrager van een vergunning;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel68
  - number: 68.1.b
    text: de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel68
  - number: 68.1.c
    text: |-
      degene op wie een vrijstelling of ontheffing als bedoeld in de [artikelen 9][ref1] onderscheidenlijk [18][ref2] van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel18
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '9'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 68.1.d
    text: degene die deel uitmaakt van een groep waartoe een vergunninghouder behoort;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel68
  - number: 68.1.e
    text: |-
      degene waarvan kan worden vermoed dat deze handelt in strijd met de bij of krachtens deze wet gestelde regels, alle
      inlichtingen inwinnen, of doen inwinnen, die redelijkerwijs geacht kunnen worden nodig te zijn voor het toezicht op
      de naleving van deze wet.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel68
  - number: '68.2'
    text: |-
      Degene van wie de inlichtingen, bedoeld in het eerste lid, worden verlangd, verstrekt deze binnen een door de
      toezichthouder te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel68
  - number: '69'
    text: |-
      Ten aanzien van de personen die door de toezichthouder zijn belast met het inwinnen van inlichtingen of met
      de uitoefening van andere taken en bevoegdheden die de toezichthouder heeft op grond van het bij of krachtens
      deze wet bepaalde, zijn de [artikelen 5:12][ref1], [5:13][ref2], [5:15][ref3], [5:16][ref4], [5:17][ref5] en
      [5:20 van de Algemene wet bestuursrecht][ref6] van overeenkomstige toepassing, met dien verstande dat indien een
      onderzoek als bedoeld in [artikel 95][ref7] wordt ingesteld, degene bij wie het onderzoek wordt ingesteld en die
      niet ingevolge deze wet onder toezicht staat, slechts is gehouden tot het verlenen van inzage in zakelijke gegevens
      en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0018329#Artikel95
