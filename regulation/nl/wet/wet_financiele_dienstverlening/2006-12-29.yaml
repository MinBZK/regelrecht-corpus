  - number: '3.1'
    text: |-
      Indien een boete wordt opgelegd voor het overtreden van een bepaling als genoemd in tabel 1, is bij de vaststelling
      van de hoogte van deze boete de volgende categorie-indeling naar balanstotaal, dan wel naar personeelsbezetting
      in fte’s, van toepassing met de daarbij behorende factor: Categorie I: Financiële dienstverleners, bedoeld in
      artikel 2, onderdeel a, met een balanstotaal van minder dan € 45 378 000; Financiële dienstverleners, bedoeld in
      artikel 2, onderdeel b, met een balanstotaal van minder dan € 4 538 000; Financiële dienstverleners, bedoeld in
      artikel 2, onderdeel c, met een balanstotaal van minder dan € 13 613 000; Financiële dienstverleners, bedoeld in
      artikel 2, onderdeel d, met een balanstotaal van minder dan € 4 538 000; en Financiële dienstverleners, bedoeld in
      artikel 2, onderdeel e, met een personeelsbezetting waarvan het aantal werknemers dat zich rechtstreeks bezighoudt
      met financiële dienstverlening minder dan 5 fte bedraagt; Factor: 1; Categorie II: Financiële dienstverleners,
      bedoeld in artikel 2, onderdeel a, met een balanstotaal van ten minste € 45 378 000 maar minder dan € 453 780 000;
      Financiële dienstverleners, bedoeld in artikel 2, onderdeel b, met een balanstotaal van ten minste € 4 538 000 maar
      minder dan € 22 689 000; Financiële dienstverleners, bedoeld in artikel 2, onderdeel c, met een balanstotaal van
      ten minste € 13 613 000 maar minder dan € 68 067 000; Financiële dienstverleners, bedoeld in artikel 2, onderdeel
      d, met een balanstotaal van ten minste € 4 538 000 maar minder dan € 22 689 000; Financiële dienstverleners,
      bedoeld in artikel 2, onderdeel e, met een personeelsbezetting waarvan het aantal werknemers dat zich rechtstreeks
      bezighoudt met financiële dienstverlening ten minste 5 fte maar minder dan 10 fte bedraagt; Factor: 2; Categorie
      III: Financiële dienstverleners, bedoeld in artikel 2, onderdeel a, met een balanstotaal van ten minste € 453
      780 000 maar minder dan € 4 537 800 000; Financiële dienstverleners, bedoeld in artikel 2, onderdeel b, met
      een balanstotaal van ten minste € 22 689 000 maar minder dan € 113 445 000; Financiële dienstverleners, bedoeld
      in artikel 2, onderdeel c, met een balanstotaal van ten minste € 68 067 000 maar minder dan € 340 335 000;
      en Financiële dienstverleners, bedoeld in artikel 2, onderdeel d, met een balanstotaal van ten minste € 22
      689 000 maar minder dan € 113 445 000; Financiële dienstverleners, bedoeld in artikel 2, onderdeel e, met een
      personeelsbezetting waarvan het aantal werknemers dat zich rechtstreeks bezighoudt met financiële dienstverlening
      ten minste 10 fte maar minder dan 15 fte bedraagt; Factor: 3; Categorie IV: Financiële dienstverleners, bedoeld
      in artikel 2, onderdeel a, met een balanstotaal van ten minste € 4 537 800 000 maar minder dan € 45 378 020 000;
      Financiële dienstverleners, bedoeld in artikel 2, onderdeel b, met een balanstotaal van ten minste € 113 445 000
      maar minder dan € 453 780 000; Financiële dienstverleners, bedoeld in artikel 2, onderdeel c, met een balanstotaal
      van ten minste € 340 335 000 maar minder dan € 1 361 340 000; Financiële dienstverleners, bedoeld in artikel
      2, onderdeel d, met een balanstotaal van ten minste € 113 445 000 maar minder dan € 453 780 000; Financiële
      dienstverleners, bedoeld in artikel 2, onderdeel e, met een personeelsbezetting waarvan het aantal werknemers dat
      zich rechtstreeks bezighoudt met financiële dienstverlening ten minste 15 fte maar minder dan 20 fte bedraagt;
      Factor: '4; Categorie V: Financiële dienstverleners, bedoeld in artikel 2, onderdeel a, met een balanstotaal van'
      ten minste € 45 378 020 000; Financiële dienstverleners, bedoeld in artikel 2, onderdeel b, met een balanstotaal
      van ten minste € 453 780 000; Financiële dienstverleners, bedoeld in artikel 2, onderdeel c, met een balanstotaal
      van ten minste € 1 361 340 000; Financiële dienstverleners, bedoeld in artikel 2, onderdeel d, met een
      balanstotaal van ten minste € 453 780 000; Financiële dienstverleners, bedoeld in artikel 2, onderdeel e, met een
      personeelsbezetting waarvan het aantal werknemers dat zich rechtstreeks bezighoudt met financiële dienstverlening
      ten minste 20 fte bedraagt; Factor: 5.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel3
  - number: '3.2'
    text: |-
      De boete wordt vastgesteld door het bedrag, bedoeld in artikel 1, te vermenigvuldigen met de factor behorende bij
      de categorie naar balanstotaal, dan wel naar personeelsbezetting in fte’s, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel3
  - number: '3.3'
    text: |-
      Indien de gegevens omtrent de balanstotaal of de personeelsbezetting in fte’s niet aan de toezichthouder
      beschikbaar zijn gesteld, kan de toezichthouder aan degene aan wie de boete wordt opgelegd verzoeken deze gegevens
      binnen een door hem te stellen termijn te verstrekken. Indien de betrokkene niet binnen de gestelde termijn voldoet
      aan dit verzoek, is bij de vaststelling van de hoogte van de boete categorie V van toepassing.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel3
