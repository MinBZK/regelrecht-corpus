  - number: 1.m.2°
    text: een effect;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.m.3°
    text: elektronisch geld;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.m.4°
    text: krediet;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.m.5°
    text: een spaarrekening met inbegrip van de daaraan verbonden spaarfaciliteiten;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.m.6°
    text: een verzekering;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel1
  - number: 1.m.7°
