  - number: '102.1'
    text: 'Het is een financiële dienstverlener die op het tijdstip van inwerkingtreding van deze wet:'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel102
  - number: 102.1.a
    text: |-
      beschikt over een vergunning als bedoeld in [artikel 9 van de Wet op het consumentenkrediet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel9
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '9'
  - number: 102.1.b
    text: |-
      is ingeschreven in het register als bedoeld in [artikel 3][ref1] of
      [artikel 20 van de Wet assurantiebemiddelingsbedrijf][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004993#Artikel20
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004993
        artikel: '20'
  - number: 102.1.c
    text: |-
      beschikt over een ontheffing als bedoeld in [artikel 5][ref1]
      of [21a van de Wet assurantiebemiddelingsbedrijf ][ref2]of de
      [artikelen 6, derde lid][ref3], of [31, vijfde lid][ref4], of [32, vierde lid][ref5], of
      [artikel 38, vierde lid, van de Wet toezicht kredietwezen 1992][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0004993#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004993#Artikel21a
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005792#Artikel31
      [ref5]: https://wetten.overheid.nl/BWBR0005792#Artikel32
      [ref6]: https://wetten.overheid.nl/BWBR0005792#Artikel38
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0004993
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0004993
        artikel: 21a
      - id: ref3
        bwb_id: BWBR0005792
        artikel: '6'
      - id: ref4
