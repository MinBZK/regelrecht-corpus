      - id: ref4
        bwb_id: BWBR0018329
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0018329
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref6
