        artikel: '31'
      - id: ref5
        bwb_id: BWBR0005792
        artikel: '32'
      - id: ref6
        bwb_id: BWBR0005792
        artikel: '38'
  - number: 102.1.d
    text: |-
      bemiddelt in krediet en in dat verband een schriftelijke provisieovereenkomst is aangegaan met een financiële
      dienstverlener als bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel102
  - number: 102.1.e
    text: optreedt als adviseur; of
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel102
  - number: 102.1.f
    text: |-
      overeenkomsten inzake krediet, bij het aangaan waarvan hypothecaire zekerheid wordt verleend, dan wel met
      betrekking waartoe reeds hypothecaire zekerheid bestaat, aanbiedt of daarin bemiddelt, toegestaan zonder vergunning
      of ontheffing zijn werkzaamheden voort te zetten, onder de in het tweede lid genoemde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel102
  - number: '102.2'
    text: |-
      De financiële dienstverlener vraagt binnen een maand na inwerkingtreding van deze wet een vergunning of ontheffing
      aan bij de toezichthouder en legt binnen drie maanden na deze aanvraag de gegevens en bescheiden, bedoeld in
      [artikel 17][ref1], aan de toezichthouder over.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel17
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '102.3'
    text: |-
      Het eerste lid is van toepassing op de financiële dienstverlener totdat de toezichthouder op zijn
      vergunningaanvraag heeft beslist. Indien een vergunningaanvraag door de toezichthouder is afgewezen, is op deze
      financiële dienstverlener [artikel 22][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel22
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '102.4'
    text: |-
      De toezichthouder beslist binnen 12 maanden na inwerkingtreding van deze wet op een aanvraag als bedoeld in het
      tweede lid. Bij ministeriële regeling kan deze termijn twee maal worden verlengd met een periode van maximaal een
      half jaar.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel102
  - number: '102.5'
    text: |-
      De financiële dienstverlener die op grond van het tweede lid een vergunning of ontheffing heeft aangevraagd wordt
      ingeschreven in het register, bedoeld in [artikel 23][ref1]. De toezichthouder haalt de inschrijving door zodra hij
      op de aanvraag heeft beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel23
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '116'
    text: |-
      De [Wet assurantiebemiddelingsbedrijf][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004993
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0004993
  - number: '117'
    text: |-
      Onze Minister zendt binnen 4 jaar na de inwerkingtreding van deze wet en vervolgens telkens na 5 jaar aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel117
  - number: '118'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel118
