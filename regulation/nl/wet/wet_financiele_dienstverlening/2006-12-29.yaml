  - number: '73.2'
    text: De bestuurlijke boete komt toe aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel73
  - number: '73.3'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Justitie, regels stellen ter zake van de uitoefening
      van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel73
  - number: '74.1'
    text: |-
      Het bedrag van de boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de boete voor
      een afzonderlijke overtreding ten hoogste € 900 000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel74
  - number: '74.2'
    text: De bijlage bepaalt bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen boete.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel74
  - number: '74.3'
    text: De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel74
  - number: '74.4'
    text: |-
      De toezichthouder kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het bedrag van de
      boete in een bepaald geval onevenredig hoog is.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel74
  - number: '74.5'
    text: |-
      Voor overtreding van voorschriften, gesteld bij of krachtens een algemene maatregel van bestuur op grond van de
      [artikelen 26, tweede lid][ref1], [28, tweede lid][ref2], [31, tweede en vierde lid][ref3], [35][ref4], [38][ref5],
      [50][ref6], [53, tweede lid][ref7] of [100][ref8] wordt het bedrag van de boete bepaald op de wijze als voorzien in
      die algemene maatregel van bestuur. Het eerste tot en met vierde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0018329#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0018329#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0018329#Artikel38
      [ref6]: https://wetten.overheid.nl/BWBR0018329#Artikel50
      [ref7]: https://wetten.overheid.nl/BWBR0018329#Artikel53
      [ref8]: https://wetten.overheid.nl/BWBR0018329#Artikel100
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel74
    references:
      - id: ref1
