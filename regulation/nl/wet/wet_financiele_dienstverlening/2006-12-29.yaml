  - number: '70.1'
    text: |-
      De toezichthouder kan aan de financiële dienstverlener die handelt in strijd met de bij of krachtens deze wet
      gestelde regels of de aan een vergunning verbonden voorschriften of gestelde beperkingen, een aanwijzing geven om
      ten aanzien van met name aan te geven punten een bepaalde gedragslijn te volgen, teneinde deze strijdigheid op te
      heffen. De financiële dienstverlener volgt de gegeven aanwijzing op binnen een door de toezichthouder te stellen
      termijn.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel70
  - number: '70.2'
    text: |-
      De aanwijzing vermeldt de handelingen welke de financiële dienstverlener naar het oordeel van de toezichthouder
      dient te verrichten of na te laten.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel70
  - number: '70.3'
    text: |-
      Indien de toezichthouder een aanwijzing geeft aan een instelling als bedoeld in [artikel 13][ref1], stelt de
      toezichthouder de toezichthoudende autoriteit van de lidstaat van de zetel van de financiële dienstverlener daarvan
      in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel13
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '71.1'
    text: |-
      Indien naar het oordeel van de toezichthouder niet of onvoldoende gevolg is gegeven aan een aanwijzing als bedoeld
      in [artikel 70][ref1], kan de toezichthouder, indien hij dit met het oog op het adequaat functioneren van de
      financiële markten en het vertrouwen van de consument daarin noodzakelijk acht, de financiële dienstverlener met
      een vergunning, bedoeld in [artikel 11][ref2], schriftelijk aanzeggen, dat vanaf een bepaald tijdstip alle of
      bepaalde organen van de financiële dienstverlener hun bevoegdheden slechts mogen uitoefenen na goedkeuring van door
      een of meer door de toezichthouder aangewezen personen en met inachtneming van de opdrachten van deze personen,
      welke aanzegging terstond van kracht wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel11
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '70'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '71.2'
    text: |-
      De in het eerste lid bedoelde aanzegging kan ook zonder voorafgaande aanwijzing worden gedaan indien de
      toezichthouder oordeelt dat ten aanzien van de betreffende financiële dienstverlener onverwijld maatregelen
      noodzakelijk zijn, nadat hij de financiële dienstverlener in de gelegenheid heeft gesteld zijn mening over de
      onmiddellijke uitvoering te geven.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel71
  - number: '71.3'
    text: 'Met betrekking tot een aanzegging, bedoeld in het eerste of tweede lid, is het volgende van toepassing:'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel71
  - number: 71.3.a
    text: |-
      de organen van de financiële dienstverlener verlenen de door de toezichthouder aangewezen personen alle
      medewerking;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel71
  - number: 71.3.b
    text: |-
      de toezichthouder kan de betrokken organen van de financiële dienstverlener toestaan bepaalde handelingen zonder
      machtiging te verrichten;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel71
  - number: 71.3.c
    text: |-
      de door de toezichthouder aangewezen personen oefenen hun bevoegdheden uit gedurende ten hoogste twee jaren na de
      aanzegging, bedoeld in het eerste lid, behoudens de bevoegdheid van de toezichthouder om deze termijn telkens voor
      ten hoogste een jaar te verlengen, welke verlenging terstond van kracht wordt;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel71
  - number: 71.3.d
    text: de toezichthouder kan te allen tijde de door hem aangewezen personen vervangen;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel71
  - number: 71.3.e
    text: |-
      voor schade ten gevolge van handelingen, welke zijn verricht in strijd met een aanzegging als bedoeld in het
      eerste lid, zijn degenen die deel uit maken van het orgaan van de financiële dienstverlener dat deze handelingen
      verrichtte, persoonlijk aansprakelijk tegenover de financiële dienstverlener; de financiële dienstverlener kan
      de ongeldigheid van deze handelingen inroepen, indien de wederpartij wist dat de vereiste goedkeuring ontbrak of
      daarvan redelijkerwijs niet onkundig kon zijn;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel71
  - number: 71.3.f
    text: |-
      zodra de toezichthouder van oordeel is dat de naleving van de regels, bedoeld in [artikel 70, eerste lid][ref1],
      voldoende is gewaarborgd, beslist hij dat de betrokken organen van de financiële dienstverlener hun bevoegdheden
      weer onbeperkt kunnen uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel70
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '70'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '71.4'
    text: |-
      Het eerste tot en met het derde lid zijn niet van toepassing op de financiële dienstverleners, bedoeld in de
      [artikelen 13][ref1], [14][ref2] en [15][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0018329#Artikel15
