  - number: '75'
    text: |-
      Degene jegens wie door de toezichthouder een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking
      kan verbinden dat hem wegens een overtreding een boete zal worden opgelegd, is niet verplicht ter zake daarvan
      enige verklaring af te leggen. Hij wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt
      gevraagd.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel75
  - number: '76.1'
    text: |-
      Indien de toezichthouder voornemens is een boete op te leggen, geeft zij de betrokkene daarvan kennis onder
      vermelding van de gronden waarop het voornemen berust.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel76
  - number: '76.2'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1], stelt de toezichthouder de betrokkene in
      de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de boete wordt
      opgelegd, tenzij het een overtreding betreft die in de bijlage, bedoeld in [artikel 74][ref2], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel74
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '74'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '77.1'
    text: De toezichthouder legt de boete op bij beschikking.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel77
  - number: '77.2'
    text: 'De beschikking vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel77
  - number: 77.2.a
    text: het feit ter zake waarvan de boete wordt opgelegd, alsmede het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel77
  - number: 77.2.b
    text: het bedrag van de boete en de gegevens op basis waarvan dit bedrag is bepaald; en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel77
  - number: 77.2.c
    text: |-
      de termijn, bedoeld in [artikel 79][ref1], waarbinnen de boete moet worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel79
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '79'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '78.1'
    text: |-
      De werking van de beschikking tot oplegging van een boete wordt opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel78
  - number: '78.2'
    text: |-
      In afwijking van het eerste lid wordt de werking van de beschikking tot oplegging van een boete voor een
      overtreding die op grond van [artikel 76, tweede lid][ref1], is aangewezen, opgeschort totdat de bezwaartermijn is
      verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel76
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '79.1'
    text: De boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel79
  - number: '79.2'
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de bekendmaking
      van de beschikking zes weken zijn verstreken, tenzij het een overtreding betreft die op grond van
      [artikel 76, tweede lid][ref1], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel76
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '79.3'
    text: |-
      Indien de boete niet tijdig is betaald, stuurt de toezichthouder schriftelijk een aanmaning om binnen twee weken
      de boete, verhoogd met de kosten van de aanmaning, alsnog te betalen. De aanmaning bevat de aanzegging dat de
      boete, voor zover deze niet binnen de gestelde termijn wordt betaald, overeenkomstig het vierde lid zal worden
      ingevorderd.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel79
  - number: '79.4'
    text: |-
      Bij gebreke van tijdige betaling kan de toezichthouder de boete, verhoogd met de kosten van de aanmaning en van de
      invordering, bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel79
  - number: '79.5'
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale titel
      op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '79.6'
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      rechtspersoon die de boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel79
  - number: '79.7'
    text: Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter desgevraagd anders beslist.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel79
  - number: '79.8'
    text: |-
      Het verzet kan niet worden gegrond op de stelling dat de boete ten onrechte of op een te hoog bedrag is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel79
  - number: '80.1'
    text: |-
      De bevoegdheid een boete op te leggen vervalt indien ter zake van de overtreding een strafvervolging is ingesteld
      en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen
      ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '80.2'
    text: |-
      Het recht tot strafvervolging met betrekking tot een overtreding als bedoeld in [artikel 72][ref1] vervalt, indien
      de toezichthouder ter zake van die overtreding reeds een boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel72
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '72'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '81.1'
    text: De bevoegdheid een boete op te leggen vervalt drie jaren na de dag waarop de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel81
  - number: '81.2'
    text: |-
      De termijn, bedoeld in het eerste lid, wordt gestuit door de bekendmaking van de beschikking waarbij een boete
      wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel81
  - number: '82'
    text: |-
      De werkzaamheden in verband met het opleggen van een dwangsom of van een boete worden verricht door personen die
      niet betrokken zijn geweest bij het vaststellen van de overtreding en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel82
  - number: '83.1'
    text: |-
      Met het oog op het adequaat functioneren van de financiële markten en de positie van de consument op die markten,
      kan de toezichthouder, in afwijking van [artikel 84, eerste en tweede lid][ref1], het feit ter zake waarvan de
      last onder dwangsom of de bestuurlijke boete is opgelegd, het overtreden voorschrift, het feit dat de last onder
      dwangsom of de bestuurlijke boete is opgelegd, alsmede de naam, het adres en de woonplaats van degene aan wie de
      last onder dwangsom of de bestuurlijke boete is opgelegd, ter openbare kennis brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel84
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '84'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '83.2'
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel83
  - number: '84.1'
    text: |-
      Gegevens en inlichtingen die ingevolge het bij of krachtens deze wet bepaalde omtrent financiële dienstverleners
      zijn verstrekt of zijn verkregen en gegevens die van een instantie als bedoeld in [artikel 95][ref1] zijn
      ontvangen, worden niet gepubliceerd en zijn geheim.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel95
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '95'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: '84.2'
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wet verstrekt, of van een instantie
      als bedoeld in [artikel 94][ref1] en [95][ref2] ontvangen, of van gegevens of inlichtingen, bij het onderzoek
      van zakelijke gegevens en bescheiden verkregen, verder of anders gebruik te maken of daaraan verder of anders
      bekendheid te geven dan voor de uitoefening van zijn taak of door deze wet wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel95
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '94'
        hoofdstuk: '5'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '95'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: '84.3'
    text: |-
      Het eerste en tweede lid laten, ten aanzien van degene op wie het tweede lid van toepassing is, onverlet de
      toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '84.4'
    text: |-
      Het eerste en tweede lid laten evenzo, ten aanzien van degene op wie het tweede lid van toepassing is,
      onverlet de toepasselijkheid van de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] en
      van [artikel 66 van de Faillissementswet][ref2] die betrekking hebben op het als getuige of als partij in een
      comparitie van partijen dan wel als deskundige in burgerlijke zaken afleggen van een verklaring omtrent gegevens
      of inlichtingen verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak, voor zover het gaat
      om gegevens of inlichtingen omtrent een financiële dienstverlener die in staat van faillissement is verklaard
      of op grond van een rechterlijke uitspraak is ontbonden. De vorige volzin is niet van toepassing op gegevens of
      inlichtingen die betrekking hebben op financiële dienstverlener die betrokken zijn of zijn geweest bij een poging
      de desbetreffende financiële dienstverlener in staat te stellen haar beroep of bedrijf voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel66
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '66'
  - number: '84.5'
    text: |-
      In afwijking van het eerste en tweede lid kan de toezichthouder met gebruikmaking van gegevens of inlichtingen
      verkregen bij de vervulling van de hem ingevolge deze wet opgedragen taak, mededelingen doen mits deze niet kunnen
      worden herleid tot individuele instellingen.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel84
  - number: '85'
    text: |-
      De toezichthouder kan, in afwijking van [artikel 84][ref1], teneinde de naleving van de wet te bevorderen ter
      openbare kennis brengen:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel84
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '84'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 85.a
    text: |-
      haar weigering om een aangevraagde vergunning of ontheffing te verlenen, wanneer deze weigering niet meer in beroep
      kan worden getroffen en de aanvrager handelt als was hem de vergunning of de ontheffing verleend;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel85
  - number: 85.b
    text: |-
      het feit dat een financiële dienstverlener waarop naar haar oordeel het verbod, bedoeld in [artikel 10][ref1] van
      toepassing is, niet over een vergunning beschikt en handelt als was hem een vergunning verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel10
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 85.c
    text: |-
      het feit dat degene op wie een vrijstelling als bedoeld in [artikel 9][ref1] van toepassing is zich niet houdt aan
      de voorschriften die aan die vrijstelling zijn verbonden;


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel9
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '9'
        hoofdstuk: '1'
  - number: 85.d
    text: |-
      het feit dat een financiële dienstverlener een op grond van [artikel 70][ref1] gegeven aanwijzing niet heeft
      opgevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel70
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '70'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 85.e
    text: |-
      het feit dat aan een financiële dienstverlener bedoeld in [artikel 13][ref1] een verbod bedoeld in
      [artikel 21][ref2] is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel21
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018329
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '86'
    text: |-
      Degene jegens wie door de toezichthouder een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking
      kan verbinden dat de toezichthouder zijn handelen of nalaten op grond van [artikel 85][ref1] ter openbare kennis
      zal brengen, is niet verplicht ter zake daarvan enige verklaring af te leggen. Hij wordt hiervan in kennis gesteld
      alvorens hem mondeling om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel85
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '85'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '87.1'
    text: |-
      De toezichthouder geeft, indien hij voornemens is op grond van [artikel 85][ref1] een handelen of nalaten ter
      openbare kennis te brengen, de betrokkene daarvan kennis onder vermelding van de gronden waarop het voornemen
      berust.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel85
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '85'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '87.2'
    text: |-
      In aanvulling op [artikel 4:8 van de Algemene wet bestuursrecht][ref1] is de toezichthouder niet gehouden de
      betrokkene in de gelegenheid te stellen om zijn zienswijze naar voren te brengen, indien van de betrokkene geen
      adres bekend is en het adres ook niet met redelijke inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '88'
    text: |-
      De beschikking om op grond van [artikel 85][ref1] een feit ter openbare kennis te brengen vermeldt in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel85
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '85'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 88.a
    text: het feit dat ter openbare kennis wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel88
  - number: 88.b
    text: de wijze waarop het feit ter openbare kennis wordt gebracht; en
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel88
  - number: 88.c
    text: de termijn waarna het feit ter openbare kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel88
  - number: '89'
    text: |-
      Tenzij de bevordering van de naleving van deze wet geen uitstel toelaat, wordt de werking van de beschikking om
      op grond van [artikel 85][ref1] een feit ter openbare kennis te brengen opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel85
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '85'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '90'
    text: |-
      In afwijking van [artikel 3:40 van de Algemene wet bestuursrecht][ref1] treedt de beschikking in werking op de dag
      waarop het feit ter openbare kennis is gebracht zonder dat de werking voor de duur van de beroepstermijn of, indien
      beroep is ingesteld, van het beroep wordt opgeschort, indien van de betrokkene geen adres bekend is en het adres
      ook niet met een redelijke inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '91.1'
    text: |-
      De bevoegdheid om op grond van [artikel 85][ref1] een feit ter openbare kennis te brengen vervalt indien ter zake
      van het feit een strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan
      wel het recht tot strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '85'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '91.2'
    text: |-
      Het recht tot strafvervolging met betrekking tot een feit als bedoeld in [artikel 85][ref1] vervalt, indien de
      toezichthouder het feit reeds ter openbare kennis heeft gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel85
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '85'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '92.1'
    text: |-
      De bevoegdheid om op grond van [artikel 85][ref1] een feit ter openbare kennis te brengen vervalt drie jaren na de
      dag waarop het feit heeft plaats gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel85
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '85'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '92.2'
    text: |-
      De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij het feit ter
      openbare kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel92
  - number: '93'
    text: |-
      De werkzaamheden in verband met het op grond van [artikel 85][ref1] ter openbare kennis brengen van een feit worden
      verricht door personen die niet betrokken zijn geweest bij het vaststellen van het feit en het daaraan voorafgaande
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel85
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '85'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '94.1'
    text: |-
      De toezichthouder kan, in afwijking van [artikel 84, eerste lid][ref1], gegevens of inlichtingen verkregen
      bij de vervulling van de hem ingevolge deze wet opgedragen taak, verstrekken aan Nederlandse of buitenlandse
      overheidsinstanties dan wel aan Nederlandse of buitenlandse van overheidswege aangewezen instanties die belast zijn
      met het toezicht op financiële markten of op natuurlijke personen, rechtspersonen en vennootschappen die op die
      markten werkzaam zijn, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel84
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '84'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 94.1.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel94
  - number: 94.1.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op financiële markten
      of op natuurlijke personen, rechtspersonen en vennootschappen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel94
  - number: 94.1.c
    text: de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel94
  - number: 94.1.d
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel94
  - number: 94.1.e
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel94
  - number: 94.1.f
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel94
  - number: '94.2'
    text: |-
      Indien een buitenlandse instantie als bedoeld in het eerste lid aan de toezichthouder verzoekt om de gegevens of
      inlichtingen die op grond van dat lid zijn verstrekt te mogen gebruiken voor een ander doel dan waarvoor zij zijn
      verstrekt, wordt dat verzoek slechts ingewilligd:
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel94
  - number: 94.2.a
    text: indien het beoogde gebruik niet in strijd is met het eerste lid; dan wel
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel94
  - number: 94.2.b
    text: |-
      indien die buitenlandse instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met inachtneming
      van de daarvoor geldende procedures voor dat andere doel de beschikking over die gegevens of inlichtingen zou
      kunnen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel94
  - number: '94.3'
    text: |-
      De toezichthouder kan voorts, in afwijking van [artikel 84, eerste lid][ref1], gegevens
      of inlichtingen die betrekking hebben op een intracommunautaire inbreuk als bedoeld in
      [artikel 1.1, onderdeel g, van de Wet handhaving consumentenbescherming][ref2] verstrekken aan een
      verbindingsbureau of bevoegde autoriteit als bedoeld in verordening 2006/2004, indien deze verstrekking op grond
      van artikel 6, eerste lid, of artikel 7, eerste lid, van verordening 2006/2004 nodig is. Het eerste lid, onderdeel
      a en onderdelen c tot en met f, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0020586#Artikel1
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '84'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0020586
        artikel: '1'
  - number: '94.4'
    text: |-
      Indien het in het tweede lid of artikel 6, eerste lid, van verordening 2006/2004 bedoelde verzoek betrekking
      heeft op een onderzoek naar strafbare feiten wordt dit niet ingewilligd dan na toestemming van Onze Minister van
      Justitie.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel94
  - number: '95.1'
    text: |-
      Ter uitvoering van verdragen tot uitwisseling van gegevens of inlichtingen dan wel ter uitvoering van bindende
      besluiten van volkenrechtelijke organisaties met betrekking tot het toezicht op financiële markten of op
      natuurlijke personen, rechtspersonen en vennootschappen die op die markten werkzaam zijn, kan de toezichthouder
      ten behoeve van een instantie die werkzaam is in een Staat die met Nederland partij is bij een verdrag of die met
      Nederland valt onder eenzelfde bindend besluit van een volkenrechtelijke organisatie, en die in die Staat belast
      is met de uitvoering van wettelijke regelingen inzake het toezicht op financiële dienstverleners, inlichtingen
      vragen aan of een onderzoek instellen of doen instellen bij iedere financiële dienstverlener die ingevolge deze
      wet onder hun toezicht valt dan wel bij een ieder waarvan redelijkerwijs kan worden vermoed dat hij over gegevens
      of inlichtingen beschikt die van belang kunnen zijn voor de uitvoering van de wettelijke regelingen als hiervoor
      bedoeld.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel95
  - number: '95.2'
    text: |-
      Degene aan wie gegevens of inlichtingen als bedoeld in het eerste lid worden gevraagd, verstrekt deze gegevens of
      inlichtingen binnen een door de toezichthouder te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel95
  - number: '96.1'
    text: |-
      De toezichthouder verstrekt aan de autoriteiten die ingevolge de [Wet toezicht kredietwezen 1992][ref1], de
      [Wet toezicht verzekeringsbedrijf 1993][ref2], de [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref3], de
      [Wet toezicht beleggingsinstellingen][ref4] of de [Wet toezicht effectenverkeer 1995][ref5], belast zijn met
      het toezicht op kredietinstellingen, verzekeraars, beleggingsinstellingen onderscheidenlijk effectenbemiddelaars
      en vermogensbeheerders, de gegevens of inlichtingen die hij heeft verkregen bij de vervulling van de hem
      ingevolge deze wet opgedragen taak en die betrekking hebben op de betrouwbaarheid van de personen, bedoeld in
      [artikel 26][ref6], voor zover deze naar het oordeel van de toezichthouder van belang zijn of zouden kunnen zijn
      voor het toezicht dat door die andere autoriteiten wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0005792
      [ref2]: https://wetten.overheid.nl/BWBR0006509
      [ref3]: https://wetten.overheid.nl/BWBR0007477
      [ref4]: https://wetten.overheid.nl/BWBR0004809
      [ref5]: https://wetten.overheid.nl/BWBR0007657
      [ref6]: https://wetten.overheid.nl/BWBR0018329#Artikel26
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005792
      - id: ref2
        bwb_id: BWBR0006509
      - id: ref3
        bwb_id: BWBR0007477
      - id: ref4
        bwb_id: BWBR0004809
      - id: ref5
        bwb_id: BWBR0007657
      - id: ref6
        bwb_id: BWBR0018329
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '96.2'
    text: |-
      De in het eerste lid bedoelde verplichting geldt niet in het geval de gegevens of inlichtingen zijn verkregen van
      een buitenlandse instantie als bedoeld in [artikel 94][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel94
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '94'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: '97.1'
    text: |-
      De toezichthouder kan toestaan dat een functionaris van een buitenlandse instantie als bedoeld in
      [artikel 95, eerste lid][ref1], deelneemt aan de uitvoering van een verzoek als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel95
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '95'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: '97.2'
    text: |-
      Degene bij wie een onderzoek als bedoeld in [artikel 95, eerste lid][ref1], wordt ingesteld, verleent aan de in
      het eerste lid bedoelde functionaris alle medewerking die nodig is voor een goede uitvoering van dat onderzoek,
      met dien verstande dat degene bij wie het onderzoek wordt ingesteld en die niet ingevolge deze wet onder toezicht
      staat, slechts gehouden is tot het verlenen van inzage in zakelijke gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel95
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '95'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: '97.3'
    text: |-
      De in het eerste lid bedoelde functionaris volgt de aanwijzingen op van de persoon die met de uitvoering van het
      verzoek is belast.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel97
  - number: '98'
    text: |-
      De toezichthouder kan de kosten die zijn verbonden aan de uitvoering van het toezicht op de naleving van deze wet
      volgens bij ministeriële regeling te stellen regels in rekening brengen bij financiële dienstverleners. Tot de
      kosten behoren tevens de kosten die hij heeft gemaakt ter voorbereiding van de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel98
  - number: '99'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '100'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van het bepaalde in
      de [artikelen 16, eerste lid onder a en b][ref1], [26, eerste lid][ref2], [27, eerste en tweede lid][ref3],
      [28, derde lid, aanhef en onder a][ref4], [29][ref5], [31, eerste en derde lid][ref6],
      [32, eerste en tweede lid][ref7], [33, eerste lid, aanhef en onder a tot en met d, en tweede lid][ref8],
      [34, eerste lid, aanhef en onder a tot en met d, en tweede lid][ref9], [37, eerste lid][ref10], [39][ref11],
      [43][ref12], [47, eerste en tweede lid][ref13], [49][ref14] en [51, eerste en tweede lid][ref15].


      [ref1]: https://wetten.overheid.nl/BWBR0018329#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0018329#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0018329#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0018329#Artikel29
      [ref6]: https://wetten.overheid.nl/BWBR0018329#Artikel31
      [ref7]: https://wetten.overheid.nl/BWBR0018329#Artikel32
      [ref8]: https://wetten.overheid.nl/BWBR0018329#Artikel33
      [ref9]: https://wetten.overheid.nl/BWBR0018329#Artikel34
      [ref10]: https://wetten.overheid.nl/BWBR0018329#Artikel37
      [ref11]: https://wetten.overheid.nl/BWBR0018329#Artikel39
      [ref12]: https://wetten.overheid.nl/BWBR0018329#Artikel43
      [ref13]: https://wetten.overheid.nl/BWBR0018329#Artikel47
      [ref14]: https://wetten.overheid.nl/BWBR0018329#Artikel49
      [ref15]: https://wetten.overheid.nl/BWBR0018329#Artikel51
    url: https://wetten.overheid.nl/BWBR0018329/2006-12-29#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0018329
        artikel: '16'
