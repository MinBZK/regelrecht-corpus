  - number: '7'
    text: |-
      In de gevallen, bedoeld in de [artikelen 14, eerste lid][ref1], [15, eerste lid][ref2], [16][ref3],
      [17, eerste lid][ref4], [18, eerste lid][ref5], en [24, eerste lid, van het besluit][ref6], worden het
      plaatsgebonden risico, onderscheidenlijk het groepsrisico, berekend met toepassing van de rekenmethodiek Bevi, met
      dien verstande dat voor de berekening van het groepsrisico in het gebied, gelegen tussen de risicocontour 10-5 per
      jaar en de grens van het invloedsgebied, worden meegerekend:

      a. de in dat gebied op het tijdstip waarop de berekening wordt uitgevoerd aanwezige kwetsbare en beperkt kwetsbare
      objecten, en

      b. de in dat gebied op het tijdstip waarop de berekening wordt uitgevoerd geprojecteerde kwetsbare en beperkt
      kwetsbare objecten.


