articles:
  - number: '1'
    text: |-
      a. besluit: [Besluit externe veiligheid inrichtingen][ref1];

      b. bijlage: de bij deze regeling behorende bijlage;

      c. categoriale inrichting: inrichting als bedoeld in
      [artikel 4, vijfde lid, onderdelen a tot en met d, van het besluit][ref2];

      d. Handleiding Risicoberekeningen: Handleiding Risicoberekeningen Bevi, versie nr. 4, uitgave 2019;

      e insluitsysteem: een of meer toestellen, waarvan de eventuele onderdelen blijvend met elkaar in open
      verbinding staan en die bestemd zijn om een of meer stoffen te omsluiten, waarbij een verlies van inhoud van
      een insluitsysteem niet leidt tot het vrijkomen van significante hoeveelheden gevaarlijke stof uit andere
      insluitsystemen;

      f. licht ontvlambare stof: stof die overeenkomstig de [titel 9.2 van de Wet milieubeheer][ref3] is aangeduid met
      het symbool F;

      g. meststoffen groep 2: vaste minerale anorganische meststoffen behorende tot groep 2 als bedoeld in PGS 7;

      h. PGS: Publicatiereeks Gevaarlijke Stoffen, gepubliceerd onder verantwoordelijkheid van de Ministeries van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van Binnenlandse Zaken en Koninkrijksrelaties, van Sociale
      Zaken en Werkgelegenheid en van Verkeer en Waterstaat;

      i. PGS 7: publicatie nr. 7 van de PGS, getiteld ‘Opslag van vaste minerale anorganische meststoffen’, uitgave 2007;

      j. PGS 15: publicatie nr. 15 van de PGS, getiteld ‘Opslag van verpakte gevaarlijke stoffen’, uitgave 2005;

      k. propaan: product, hoofdzakelijk bestaande uit propaan en propeen, met geringe hoeveelheden ethaan, butanen
      en butenen, voor zover de dampspanning bij 343 Kelvin (70 graden Celsius) ten hoogste 3100 kilopascal (31 bar)
      bedraagt;

      l. rekenmethodiek Bevi: rekenmethodiek, bestaande uit Safeti-NL en de Handleiding Risicoberekeningen Bevi;

      m. Safeti-NL: softwareprogramma voor de berekening van risico’s, getiteld Safeti-NL versie nr. 8, uitgave 2019;

      n. vergiftige stof: stof die overeenkomstig de [titel 9.2 van de Wet milieubeheer][ref4] is aangeduid met het
      symbool T;

      o. zeer licht ontvlambare stof: stof die overeenkomstig de [titel 9.2 van de Wet milieubeheer][ref5] is aangeduid
      met het symbool F+, en

      p. zeer vergiftige stof: stof die overeenkomstig de [titel 9.2 van de Wet milieubeheer][ref6] is aangeduid met het
      symbool T+.


