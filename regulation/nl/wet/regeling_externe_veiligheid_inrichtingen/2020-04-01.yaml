        artikel: '7'
        paragraaf: '6'
  - number: 8c
    text: |-
      Indien in een geval als bedoeld in [artikel 7][ref1] de rekenmethodiek Bevi vanwege specifieke omstandigheden niet
      passend is, kan Onze Minister op verzoek van het bevoegd gezag besluiten dat een andere, passende rekenmethodiek
      mag worden toegepast. De toe te passen rekenmethodiek is transparant en reproduceerbaar. Voordat Onze Minister
      een besluit als bedoeld in de eerste volzin neemt, wint hij advies in bij het Rijksinstituut voor Volksgezondheid
      en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0017168#Artikel7
    url: https://wetten.overheid.nl/BWBR0017168/2020-04-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0017168
        artikel: '7'
        paragraaf: '6'
  - number: 8d
    text: |-
      1 Met de rekenmethodiek Bevi worden gelijkgesteld rekenmethodieken die rechtmatig zijn vervaardigd of in de handel
      zijn gebracht in een lidstaat van de Europese Unie of in een staat, niet zijnde een lidstaat van de Europese Unie,
      die partij is bij een tot een douane-unie strekkend Verdrag, dan wel rechtmatig zijn vervaardigd in een staat
      die partij is bij een tot een vrijhandelszone strekkend Verdrag dat Nederland bindt, en waarvan de resultaten
      gelijkwaardig zijn aan de resultaten van de rekenmethodiek Bevi.

      2 Onze Minister besluit, nadat hij het Rijksinstituut voor Volksgezondheid en Milieu gehoord heeft, op verzoek van
      het bevoegd gezag, of die rekenmethodiek gelijkwaardig is aan de rekenmethodiek Bevi. Daarbij betrekt Onze Minister
      in elk geval de transparantie, reproduceerbaarheid, het toepassingsgebied en de ruimtelijke consequenties.
    url: https://wetten.overheid.nl/BWBR0017168/2020-04-01#Artikel8d
  - number: '9'
    text: |-
      1 De afstanden tot kwetsbare objecten, bedoeld in [artikel 17, tweede en vijfde lid, van het besluit][ref1], zijn
      de afstanden die zijn vermeld in [bijlage 1, tabel 2][ref2], indien het risico wordt veroorzaakt door een LPG-
      tankstation als bedoeld in [artikel 4, vijfde lid, onderdeel a, van het besluit][ref3].

      2 De afstanden tot kwetsbare objecten, bedoeld in [artikel 18, tweede lid, van het besluit][ref4], zijn de
      afstanden die zijn vermeld in of volgen uit:

      a. [bijlage 1, tabel 1][ref5], indien het risico wordt veroorzaakt door een LPG-tankstation als bedoeld in
      [artikel 4, vijfde lid, onderdeel a, van het besluit][ref6];

      b. [bijlage 1, tabel 3][ref7], indien het risico wordt veroorzaakt door een inrichting waar verpakte gevaarlijke
      afvalstoffen of verpakte gevaarlijke stoffen, niet zijnde nitraathoudende kunstmeststoffen worden opgeslagen als
      bedoeld in [artikel 4, vijfde lid, onderdeel b, van het besluit][ref8];

      c. [bijlage 1, tabel 6][ref9], indien het risico wordt veroorzaakt door een inrichting waarin een koel- of
      vriesinstallatie als bedoeld in [artikel 4, vijfde lid, onderdeel c, van het besluit][ref10], aanwezig is;

      d. [bijlage 1, tabel 7][ref11], indien het risico wordt veroorzaakt door een inrichting waarin meerdere koel- of
      vriesinstallaties als bedoeld in [artikel 4, vijfde lid, onderdeel c, van het besluit][ref12] in een machinekamer
      aanwezig zijn;

      e. [bijlage 1, tabel 8][ref13], indien het risico wordt veroorzaakt door een inrichting als bedoeld in
      [artikel 1c, onderdeel a][ref14], en

      f. [bijlage 1, tabellen 9 en 10][ref15], indien het risico wordt veroorzaakt door een inrichting als bedoeld in
      [artikel 1c, onderdeel b][ref16].

      3 [Artikel 2, tweede, derde en vierde lid][ref17], zijn van overeenkomstige toepassing.


