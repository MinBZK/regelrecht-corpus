  - number: 1b
    text: |-
      Als inrichtingen als bedoeld in [artikel 2, eerste lid, onderdeel d, van het besluit][ref1] worden aangewezen:

      a. inrichtingen waar meer dan 1.500 kg ammoniak in een insluitsysteem aanwezig is, niet zijnde een onderdeel van
      een koel- of vriesinstallatie met ammoniak;

      b. inrichtingen waar meer dan 150m3 zeer licht ontvlambare of licht ontvlambare vloeistof in een bovengronds
      insluitsysteem aanwezig is;

      c. inrichtingen waar acetyleen in een insluitsysteem met een inhoud van meer dan 13 m3 aanwezig is;

      d. inrichtingen waar propaan aanwezig is in een insluitsysteem met een inhoud van:

      1°. meer dan 13 m3 en ten hoogste 50 m3 en met een jaarlijkse doorzet van meer dan 600 m3;

      2°. meer dan 50 m3;

      e. inrichtingen waar een cyanidehoudend bad ten behoeve van het aanbrengen van metaallagen aanwezig is met een
      inhoud van meer dan 100 liter;

      f. inrichtingen waar een vergiftige of zeer vergiftige stof, niet zijnde benzine of methanol, in een insluitsysteem
      met een inhoud van meer dan 1.000 liter aanwezig is;

      g. inrichtingen waar in enige opslagvoorziening een vergiftige of zeer vergiftige stof in gasflessen aanwezig is en
      waarbij de totale waterinhoud van de gasflessen met vergiftige of zeer vergiftige inhoud in die opslagvoorziening
      meer bedraagt dan 1.500 liter;

      h. inrichtingen waar aardgasdruk gereduceerd wordt of aardgashoeveelheid gemeten wordt, voor zover de
      gastoevoerleiding een grotere diameter heeft dan 20 inch, en

      i. inrichtingen die een mijnbouwwerk zijn als bedoeld in [artikel 1, onderdeel n, van de Mijnbouwwet][ref2],
      bestemd voor de winning, opslag, bewerking of het gereedmaken voor transport van gevaarlijke stoffen, met
      uitzondering van:

      1° mijnbouwinstallaties als bedoeld in [artikel 1, onderdeel o, van de Mijnbouwwet][ref3], en

      2° inrichtingen als bedoeld in [artikel 2, eerste lid, onderdeel a, van het besluit][ref4].


