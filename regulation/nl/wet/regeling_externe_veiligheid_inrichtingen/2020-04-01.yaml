  - number: '6'
    text: |-
      1 Voor de toepassing van de [artikelen 12, eerste lid, aanhef en onderdeel a][ref1], en
      [13, eerste lid, aanhef en onderdeel a, van het besluit][ref2] met betrekking tot de verantwoording van het
      groepsrisico van een inrichting als bedoeld in [artikel 4, vijfde lid, van het besluit][ref3], worden de personen
      meegeteld die aanwezig zijn in het invloedsgebied dat in [bijlage 2][ref4] is vermeld bij de desbetreffende
      inrichting en, in geval van geprojecteerde kwetsbare en beperkt kwetsbare objecten, de personen die na uitvoering
      van het bestemmingsplan voorzover dat plan betrekking heeft op dat invloedsgebied, in dat invloedsgebied aanwezig
      zijn.

      2 De afstanden tot de grens van het invloedsgebied, bedoeld in [bijlage 2, tabellen 1 tot en met 4][ref5], gelden
      onderscheidenlijk:

      a. voor LPG-tankstations: vanaf het vulpunt voor LPG, het ondergrondse of ingeterpte, onderscheidenlijk
      bovengrondse, reservoir, gerekend vanaf de aansluitpunten van de leidingen alsmede het bovengrondse deel van de
      leidingen en de pomp bij het reservoir;

      b. voor inrichtingen waar verpakte gevaarlijke afvalstoffen, meststoffen groep 2, of verpakte gevaarlijke stoffen,
      niet zijnde nitraathoudende kunstmeststoffen worden opgeslagen: vanaf de uitwendige scheidingsconstructie, bedoeld
      in [artikel 5, eerste lid, onderdeel b][ref6], of, indien van toepassing, de buitenzijde van de opslagplaats in
      de buitenlucht;

      c. voor koel- en vriesinstallaties met ammoniak: vanaf de machinekamer of, indien van toepassing, de leidingen en
      het afscheidervat of vloeistofvat, bedoeld in [artikel 5, eerste lid, onderdeel c][ref7], en

      d. voor insluitsystemen met propaan: vanaf het vulpunt en de opslagtank, gerekend vanaf de aansluitpunten van de
      leidingen alsmede het bovengrondse deel van de leidingen en de pomp bij de opslagtank.


