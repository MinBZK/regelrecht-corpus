  - number: '8'
    text: |-
      1 In de gevallen, bedoeld in de [artikelen 14, eerste lid][ref1], [15, eerste lid][ref2], [16][ref3],
      [17, eerste lid][ref4], [18, eerste lid][ref5], en [24, eerste lid, van het besluit][ref6], worden het
      plaatsgebonden risico, onderscheidenlijk het groepsrisico, berekend op basis van gegevens met betrekking tot:

      a. de aard en de hoeveelheid gevaarlijke stoffen die in een inrichting als bedoeld in
      [artikel 15, eerste lid, onderdelen a tot en met d, van het besluit][ref7], die het plaatsgebonden risico en het
      groepsrisico veroorzaakt of mede veroorzaakt, aanwezig kan zijn;

      b. de insluitsystemen waarin die gevaarlijke stoffen voorkomen;

      c. de toegepaste maatregelen ter beperking van het plaatsgebonden risico en het groepsrisico, en

      d. het aantal personen en de spreiding van personen binnen het invloedsgebied van een inrichting als bedoeld in
      onderdeel a.

      2 Voor de berekening van het plaatsgebonden risico en het groepsrisico, bedoeld in het eerste lid, wordt
      uitsluitend gebruikgemaakt van gegevens die zijn opgenomen in:

      a. de voor een inrichting als bedoeld in
      [artikel 15, eerste lid, onderdelen a tot en met d, van het besluit][ref8] geldende vergunning krachtens
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref9];

      b. de op een vergunning als bedoeld in onderdeel a betrekking hebbende aanvraag en de bij die aanvraag gevoegde
      stukken;

      c. een met betrekking tot een hogedrempelinrichting als bedoeld in
      [artikel 1, eerste lid, van het Besluit risico’s zware ongevallen 2015][ref10] ingediend veiligheidsrapport dat
      overeenkomstig artikel 10 van dat besluit door het bevoegd gezag is beoordeeld, en

      d. de basisregistratie personen en, voor kwetsbare en beperkt kwetsbare objecten, niet zijnde een woning
      als bedoeld in [artikel 1, eerste lid, onderdeel s, van het besluit][ref11], de door de desbetreffende
      gemeente verstrekte documenten over het aantal personen en het redelijkerwijs te verwachten aantal
      personen en de spreiding van personen binnen het invloedsgebied van een inrichting als bedoeld in
      [artikel 15, eerste lid, onderdelen a tot en met d, van het besluit][ref12].


