  - number: 1c
    text: |-
      Als inrichtingen als bedoeld in [artikel 2, eerste lid, onderdeel h][ref1], van het besluit worden aangewezen:

      a. inrichtingen waar meer dan 100.000 kg meststoffen groep 2 worden opgeslagen, en

      b. inrichtingen waar propaan in een insluitsysteem aanwezig is met een inhoud van meer dan 13 m3 en ten hoogste
      50 m3 en waar de jaarslijkse doorzet van propaan ten hoogste 600 m3 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
