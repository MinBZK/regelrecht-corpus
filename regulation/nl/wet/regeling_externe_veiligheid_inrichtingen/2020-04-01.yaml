  - number: '5'
    text: |-
      1 De afstanden, bedoeld in de [artikelen 2][ref1] en [9][ref2], gelden tot de gevel van kwetsbare objecten en
      beperkt kwetsbare objecten en vanaf:

      a. het vulpunt voor LPG, het ondergrondse of ingeterpte, onderscheidenlijk bovengrondse, reservoir, gerekend vanaf
      de aansluitpunten van de leidingen alsmede het bovengrondse deel van de leidingen en de pomp bij het reservoir en,
      indien [bijlage 1, tabel 1][ref3], van toepassing is, de afleverzuil;

      b. de uitwendige scheidingsconstructie, bedoeld in [artikel 1.1 van het Bouwbesluit 2012][ref4], van het gebouw
      of het onderdeel daarvan of van de buitenzijde van de opslagplaats in de buitenlucht, waar verpakte gevaarlijke
      afvalstoffen, meststoffen groep 2, of verpakte gevaarlijke stoffen, niet zijnde nitraathoudende kunstmeststoffen
      worden opgeslagen;

      c. de machinekamer van de koel- of vriesinstallatie en de bij die installatie behorende, met de buitenlucht in
      verbinding staande leidingen naar de verdamper of verdampers en het afscheidervat of vloeistofvat, en

      d. het vulpunt en de opslagtank voor propaan, gerekend vanaf de aansluitpunten van de leidingen alsmede het
      bovenste deel van de leidingen en de pomp bij de opslagtank.

      2 In afwijking van het eerste lid gelden de afstanden, bedoeld in de [artikelen 2][ref5] en [9][ref6], tot:

      a. de grens van het gebied dat bestemd is voor het verblijf van zieken, ouderen, gehandicapten of minderjarigen,
      indien het desbetreffende object een ziekenhuis, bejaardenhuis, verpleeghuis, school, gebouw of een gedeelte van
      een gebouw dat bestemd is voor dagopvang van minderjarigen, openluchtzwembad of speeltuin is, en

      b. de grens van het gebied dat bestemd is voor het verblijf van personen, indien het desbetreffende object een
      sportterrein of een kampeer- of ander recreatieterrein bestemd voor het verblijf van personen gedurende meerdere
      aaneengesloten dagen is.

      3 Met betrekking tot geprojecteerde kwetsbare en beperkt kwetsbare objecten gelden de afstanden, bedoeld in
      [artikel 2][ref7], tot de plaats waar de gevel van het desbetreffende object gebouwd mag worden.

      4 Indien het desbetreffende object een object is als bedoeld in het tweede lid, onderdeel a of b, gelden de
      afstanden, bedoeld in [artikel 2, in afwijking van het derde lid][ref8], tot de grens van het gebied waar een
      dergelijk object op grond van het bestemmingsplan is toegelaten.


