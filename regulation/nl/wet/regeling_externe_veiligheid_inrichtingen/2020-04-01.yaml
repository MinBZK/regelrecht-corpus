    text: |-
      1 Aan de grenswaarden, genoemd in de [artikelen 6, eerste lid][ref1], [7, eerste lid][ref2],
      [8, eerste en derde lid][ref3], [17, eerste lid][ref4], [18, eerste lid][ref5], en
      [24, eerste lid, van het besluit][ref6], en aan de richtwaarden, genoemd in de [artikelen 6, tweede lid][ref7],
      [7, tweede lid][ref8], en [8, tweede lid, van het besluit][ref9], wordt voldaan, onderscheidenlijk zoveel mogelijk
      voldaan, op de gevel van kwetsbare objecten en beperkt kwetsbare objecten.

      2 In afwijking van het eerste lid wordt aan de grens- en richtwaarden, bedoeld in het eerste lid, voldaan,
      onderscheidenlijk zoveel mogelijk voldaan, op:

      a. de grens van het gebied dat bestemd is voor het verblijf van zieken, ouderen, gehandicapten of minderjarigen,
      indien het desbetreffende object een ziekenhuis, bejaardenhuis, verpleeghuis, school, gebouw of een gedeelte van
      een gebouw dat bestemd is voor dagopvang van minderjarigen, openluchtzwembad of speeltuin is, en

      b. de grens van het gebied dat bestemd is voor het verblijf van personen, indien het desbetreffende object een
      sportterrein of een kampeer- of ander recreatieterrein bestemd voor het verblijf van personen gedurende meerdere
      aaneengesloten dagen is.

      3 Met betrekking tot geprojecteerde kwetsbare en beperkt kwetsbare objecten wordt aan de grenswaarden, genoemd
      in de [artikelen 6, eerste lid][ref10], [7, eerste lid][ref11], en [24, eerste lid, van het besluit][ref12] en de
      richtwaarden, genoemd in de [artikelen 6, tweede lid][ref13], en [7, tweede lid, van het besluit][ref14], voldaan,
      onderscheidenlijk zoveel mogelijk voldaan, op de plaats waar de gevel van het desbetreffende object gebouwd mag
      worden.

      4 Indien het desbetreffende object een object is als bedoeld in het tweede lid, onderdeel a of onderdeel b,
      wordt in afwijking van het derde lid aan de grenswaarden, genoemd in de [artikelen 6, eerste lid][ref15],
      [7, eerste lid][ref16], en [24, eerste lid, van het besluit][ref17] en de richtwaarden, genoemd in de
      [artikelen 6, tweede lid][ref18], en [7, tweede lid, van het besluit][ref19], voldaan, onderscheidenlijk zoveel
      mogelijk voldaan, op de grens van het gebied waar een dergelijk object op grond van het bestemmingsplan is
      toegelaten.


