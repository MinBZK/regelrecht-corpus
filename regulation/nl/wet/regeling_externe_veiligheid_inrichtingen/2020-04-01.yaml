  - number: '2'
    text: |-
      1 De afstanden tot al dan niet geprojecteerde kwetsbare en beperkt kwetsbare objecten, bedoeld in de
      [artikelen 4, vijfde lid][ref1], en [5, derde lid, van het besluit][ref2], zijn de afstanden die zijn vermeld in of
      volgen uit:

      a. [bijlage 1, tabel 1][ref3], indien het risico wordt veroorzaakt door een LPG-tankstation als bedoeld in
      [artikel 4, vijfde lid, onderdeel a, van het besluit][ref4];

      b. [bijlage 1, tabel 3][ref5], indien het risico wordt veroorzaakt door een inrichting waar verpakte gevaarlijke
      afvalstoffen of verpakte gevaarlijke stoffen, niet zijnde nitraathoudende kunstmeststoffen, worden opgeslagen als
      bedoeld in [artikel 4, vijfde lid, onderdeel b, van het besluit][ref6];

      c.

      d. [bijlage 1, tabel 6][ref7], indien het risico wordt veroorzaakt door een inrichting waarin een koel- of
      vriesinstallatie aanwezig is als bedoeld in [artikel 4, vijfde lid, onderdeel c, van het besluit][ref8];

      e. [bijlage 1, tabel 7][ref9], indien het risico wordt veroorzaakt door een inrichting waarin meerdere koel- of
      vriesinstallaties als bedoeld in [artikel 4, vijfde lid, onderdeel c, van het besluit][ref10] in een machinekamer
      aanwezig zijn;

      f. [bijlage 1, tabel 8][ref11], indien het risico wordt veroorzaakt door een richting als bedoeld in
      [artikel 1c, onderdeel a][ref12], en

      g. [bijlage 1, tabellen 9 en 10][ref13], indien het risico wordt veroorzaakt door een inrichting als bedoeld in
      [artikel 1c, onderdeel b][ref14].

      2 Voor de toepassing van [bijlage 1, tabel 3][ref15], geldt dat:

      a. indien binnen een opslagvoorziening het zwavelgehalte, uitgedrukt in gewichtspercentage, danwel het gehalte
      van chloor, fluor en broom gezamenlijk, uitgedrukt in gewichtspercentage, hoger is dan de in tabel 3 genoemde
      stikstofcategorie, de afstand behorende bij de in de tabel 3 daarop volgende hogere stikstofcategorie wordt
      gehanteerd, en

      b. indien er sprake is van een sterk wisselende, op het moment van de aanvraag om een vergunning als bedoeld
      in [artikel 4, eerste tot en met vierde lid][ref16], juncto [artikel 15 van het besluit][ref17] onbekende,
      samenstelling van de aanwezige gevaarlijke stoffen, bij de toepassing van tabel 3 een stikstofgehalte van 10% wordt
      gehanteerd.

      3 Voor de toepassing van [bijlage 1, tabel 6][ref18]:

      a. is de hoogste afscheider- of verdampingstemperatuur bepalend. Indien die hoogste temperatuur wordt bepaald door
      een afscheidervat waarin minder dan 400 kg ammoniak aanwezig is, mag in afwijking van de vorige zin de afstand
      worden toegepast die behoort bij de werktemperatuur die heerst in het afscheidervat met de op een na hoogste
      werktemperatuur, en

      b. wordt, indien de desbetreffende installatie niet is uitgerust met een pompbeveiliging, de bij de
      opstellingsuitvoeringen 2 en 3 vermelde afstand vermeerderd met 30 meter.

      4 Voor de toepassing van [bijlage 1, tabel 7][ref19], wordt, indien een of meer van de installaties in
      opstellingsuitvoering 2 of 3 niet is uitgerust met een pompbeveiliging, de afstand die volgt uit tabel 7
      vermeerderd met 30 meter.

      5 Indien bij de vaststelling van een besluit als bedoeld in de [artikelen 3.1, eerste tot en met derde lid][ref20],
      [3.6, eerste lid][ref21], [3.26, eerste lid][ref22], [3.28, eerste lid][ref23],
      [4.2, eerste lid][ref24], of [4.4, eerste lid, onder a, van de Wet ruimtelijke ordening][ref25]
      en bij het verlenen van een omgevingsvergunning waarbij met toepassing van
      __REF006___________________________________________________________________________________________________________
      _______ van het bestemmingsplan of de beheersverordening wordt afgeweken dan wel krachtens
      [artikel 11 van de Woningwet][ref27] van de bouwverordening wordt afgeweken zodanige voorschriften
      aan dat besluit zijn verbonden of op zodanige wijze toepassing is gegeven aan [artikel 2.30][ref28] of
      __REF009___________________________________________________________________________________________________________
      __________, dat binnen drie jaar na vaststelling van dat besluit aan de afstanden, bedoeld in het eerste lid,
      voorzover het betreft kwetsbare objecten, wordt voldaan, zijn, in afwijking van dat lid, gedurende die drie jaar
      de in acht te nemen afstanden tot de op het tijdstip van vaststelling van dat besluit aanwezige kwetsbare objecten,
      de op dat tijdstip bestaande afstanden, indien die afstanden groter zijn dan de afstanden die overeenkomen met de
      risicocontour 10–5 per jaar.


