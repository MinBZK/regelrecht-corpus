  - number: 8a
    text: |-
      Indien toepassing van de rekenmethodiek Bevi voor een inrichting als bedoeld in
      [artikel 15, eerste lid, onderdeel c van het besluit][ref1] leidt tot een afstand die kleiner is dan de bij een
      inrichting uit dezelfde categorie behorende grootste afstand genoemd in [tabel 6 of 7 van bijlage 1][ref2], geldt
      de in [die bijlage][ref3] genoemde grootste afstand als minimaal aan te houden afstand.


