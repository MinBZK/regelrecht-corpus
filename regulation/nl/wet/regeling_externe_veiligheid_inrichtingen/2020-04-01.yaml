      1 De inrichtingen, bedoeld in [artikel 4, zesde lid, van het besluit][ref1], en de gevallen, bedoeld in
      [artikel 5, vierde lid, van het besluit][ref2], waarvoor het plaatsgebonden risico, in afwijking van artikel 4,
      vijfde lid, onderscheidenlijk artikel 5, derde lid, van het besluit, mag worden berekend, zijn:

      a. de inrichtingen, bedoeld in [artikel 4, vijfde lid, onderdeel b, van het besluit][ref3], onderscheidenlijk de
      besluiten, bedoeld in [artikel 5, eerste en tweede lid, van het besluit][ref4], voor zover die besluiten betrekking
      hebben op een gebied dat geheel of gedeeltelijk ligt binnen het invloedsgebied van een inrichting als bedoeld in
      artikel 4, vijfde lid, onderdeel b, van het besluit, en

      b. de inrichtingen, bedoeld in [artikel 1c, onderdeel b][ref5], onderscheidenlijk de besluiten, bedoeld in
      [artikel 5, eerste en tweede lid, van het besluit][ref6], voor zover die besluiten betrekking hebben op een gebied
      dat geheel of gedeeltelijk ligt binnen het invloedsgebied van een inrichting als bedoeld in artikel 1c, onderdeel
      b.

      2 Indien het bevoegd gezag toepassing geeft aan het eerste lid, wordt:

      a. het plaatsgebonden risico berekend met gebruikmaking van de rekenmethodiek Bevi, en

      b. ten aanzien van besluiten als bedoeld in het eerste lid, onderdeel a, in het belang van een doelmatige
      brandbestrijding en brandpreventie een zodanige afstand, gerekend vanaf de uitwendige scheidingsconstructie,
      bedoeld in [artikel 1.1 van het Bouwbesluit 2012][ref7], van het gebouw of het onderdeel daarvan of van de
      buitenzijde van de opslagplaats in de buitenlucht, waar verpakte gevaarlijke afvalstoffen of verpakte gevaarlijke
      stoffen, niet zijnde nitraathoudende kunstmeststoffen worden opgeslagen, tot al dan niet geprojecteerde kwetsbare
      en beperkt kwetsbare objecten in acht genomen, dat dat gebouw of dat onderdeel daarvan of die opslagplaats
      bij brand voldoende bereikbaar is en dat het overslaan van brand naar andere gebouwen of opslagplaatsen wordt
      voorkomen.


