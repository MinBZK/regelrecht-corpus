  - number: 8b
    text: |-
      Indien in een geval als bedoeld in [artikel 7][ref1] de rekenmethodiek Bevi vanwege specifieke
      invoergegevenstechnische omstandigheden niet passend is, kan het bevoegd gezag bepalen dat van de invoergegevens
      uit de Handleiding Risicoberekeningen mag worden afgeweken en op welke wijze deze afwijking plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0017168#Artikel7
    url: https://wetten.overheid.nl/BWBR0017168/2020-04-01#Artikel8b
