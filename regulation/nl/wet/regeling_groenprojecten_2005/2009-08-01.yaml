      project als bedoeld in [artikel 2, onderdeel a, e, onder 3° en 4°, f, g, i, j of k][ref1], waarvoor ten minste
      zes maanden voor de dag waarop de aanvraag tot afgifte van een verklaring wordt ingediend een begin met de
      uitvoering van de werkzaamheden is gemaakt;


