  - number: '1.2'
    text: |-
      Tot het projectvermogen met betrekking tot een project als bedoeld in [artikel 2, onderdeel e, onder 3°][ref1],
      wordt niet gerekend het vermogen dat nodig is voor de financiering van de grond, de kosten voor goederen waarop
      niet wordt afgeschreven, tuinbouwgewassen, transportsystemen en onderhoud en de kosten, exclusief de kosten voor
      gelijktijdig opwekken van warmte/kracht of de kosten van een warmtepomp en/of warmte en koudeopslag, per vierkante
      meter kasoppervlak die meer bedragen dan € 100,–.


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel1
