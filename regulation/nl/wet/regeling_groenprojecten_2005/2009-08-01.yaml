  - number: 1.1.g
    text: |-
      Groen Label Kas: tuinbouwkas die bestemd is voor het bedrijfsmatig telen van tuinbouwgewassen, en ter zake waarvan,
      door middel van een certificaat afgegeven door een bij de Raad voor Accreditatie erkende organisatie, is aangetoond
      dat deze kas voldoet aan de eisen van het Certificatieschema Groen Label Kas 8.0 en minimaal 85 punten behaalt voor
      de extensieve stookteelt of 115 punten voor de intensieve stookteelt volgens de aldaar vermelde systematiek. Het
      Certificatieschema Groen Label Kas 8.0 dat als bijlage bij deze regeling behoort, ligt ter inzage in de bibliotheek
      van het Ministerie van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel1
  - number: 1.1.h
    text: |-
      woning: gebouw, bedoeld voor bewoning, dat voortdurend als hoofdverblijf ter beschikking zal staan aan een of
      meer natuurlijke personen en per wooneenheid ten minste is voorzien van een eigen toegang, een gescheiden leef- en
      slaapgedeelte, een eigen toilet, een eigen bad- of douchevoorziening, alsmede van een energieaansluiting, bedoeld
      voor een kooktoestel om een maaltijd te kunnen bereiden;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel1
  - number: 1.1.i
    text: |-
      eigenaar-bewoner: natuurlijk persoon die een woning in eigendom heeft dan wel verkrijgt en daarin zijn
      hoofdverblijf heeft of zal hebben, dan wel de erfpachter, vruchtgebruiker of gerechtigde tot een appartementsrecht
      als bedoeld in [artikel 106 van Boek 5 van het Burgerlijk Wetboek][ref1], voorzover deze rechten betrekking hebben
      op een woning zoals bedoeld in [artikel 1, eerste lid, onder h][ref2];


