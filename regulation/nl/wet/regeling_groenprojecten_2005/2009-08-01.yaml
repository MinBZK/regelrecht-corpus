      geproduceerd hout is, en waarbij energiebesparende maatregelen worden doorgevoerd, en die voldoen aan één van de
      volgende niveaus:
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel2
  - number: 2.h.5°.b
    text: |-
      de Energie-index van de woning is na renovatie ten minste vier labelstappen lager dan ervoor en de woning verkrijgt
      na renovatie minimaal een B-label;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel2
  - number: 2.h.5°.c
    text: |-
      de Energie-index van de woning is na renovatie ten minste vijf labelstappen lager dan ervoor en de woning verkrijgt
      na renovatie een A label;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel2
  - number: 2.i
    text: |-
      projecten die zijn gericht op de realisatie van vrijgelegen dan wel verhoogde fietspaden die verhard zijn met
      asfalt en die:
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel2
  - number: 2.i.1°
    text: de directe bereikbaarheid van transferia bevorderen,
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel2
  - number: 2.i.2°
    text: |-
      knelpunten opheffen in het recreatieve landelijk fietsroutenet als aangegeven in het Structuurschema Groene Ruimte,
      bedoeld in [artikel 2, onder b, onderdeel 2°][ref1], en gelegen zijn buiten de bebouwde kom,


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: 2.i.3°
    text: |-
      buiten de bebouwde kom gelegen zijn en de directe verbinding vormen tussen: - woonkernen met meer dan 50.000
      inwoners en de direct omringende woonkernen en leiden tot een vermindering van de reistijd,
        - Vinex-locaties en de direct omringende woonkernen, of
        - een woonkern, waaronder begrepen een verblijfsrecreatieconcentratie, en het landelijk net, bedoeld onder 2°;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel2
  - number: 2.j
    text: |-
      projecten die zijn gericht op het vrijwillig saneren van verontreinigde bodems of waterbodems ter zake waarvan
      overeenkomstig [artikel 29 van de Wet op de bodembescherming][ref1] is beslist dat er sprake is van een geval van
      ernstige verontreiniging en overeenkomstig [artikel 39, tweede lid, van die wet][ref2] goedkeuring is gegeven aan
      het saneringsplan en waaraan naar zijn oordeel voorrang moet worden verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel39
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '39'
  - number: 2.k
    text: |-
      andere innovatieve en hoogwaardige projecten die naar zijn oordeel in het belang zijn van de bescherming van het
      milieu, waaronder natuur en bos.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel2
  - number: '3.1'
    text: 'Een verklaring wordt niet afgegeven op aanvragen voor:'
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel3
  - number: 3.1.a
    text: een bestaand project;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel3
  - number: 3.1.b
    text: een project waarvan het projectvermogen minder bedraagt dan € 22.689;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel3
  - number: 3.1.c
    text: |-
      een project waarvan het niet aannemelijk is dat het enig eigen rendement heeft, subsidies van overheden en
      convenantsmiddelen daaronder begrepen;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel3
  - number: 3.1.d
    text: |-
      een project waarvan het te verwachten economisch rendement in verhouding tot het risico en het milieubelang zodanig
      is dat het zonder toepassing van deze regeling tot stand kan komen;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel3
  - number: 3.1.e
    text: |-
      een project als bedoeld in [artikel 2, onderdeel h, onder 1° of 2°][ref1], indien per kalenderjaar reeds voor
      5000 woningen een verklaring is afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: 3.1.f
    text: |-
      een project als bedoeld in [artikel 2, onderdeel h, onder 3°][ref1], indien per kalenderjaar reeds voor 5000
      woningen een verklaring is afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: 3.1.g
    text: |-
      een project betreffende een woning als bedoeld in [artikel 2, onderdeel h, onder 1° of 2°][ref1], waarvan de
      stichtingskosten meer dan € 272.268 bedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: 3.1.h
    text: |-
      een project betreffende een utiliteitsgebouw als bedoeld in [artikel 2, onderdeel h, onder 4°][ref1], indien de
      aanvraag voor een groenverklaring is ingediend voor 1 januari 2005;


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: 3.1.i
    text: |-
      een project betreffende een utiliteitsgebouw als bedoeld in [artikel 2, onderdeel h, onder 4°][ref1], indien per
      kalenderjaar reeds voor 50.000 m2 bruto vloeroppervlak een verklaring is afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: 3.1.j
    text: |-
      een project, indien dit tot gevolg zou hebben dat op een bouwwerk gelijktijdig een verklaring op grond van
      [artikel 2, onderdeel h, onder 4°][ref1], en een verklaring op grond van [artikel 2, onderdeel g of k][ref2], van
      toepassing zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018466
        artikel: '2'
  - number: 3.1.k
    text: |-
      een project, waarvoor vanwege de overheid of de Commissie van de Europese Gemeenschappen uit anderen hoofde dan
      toekenning van een financieel of ander voordeel dat op grond van deze regeling door de projectbeheerder wordt
      genoten, een zodanig voordeel is of zal worden verstrekt, dat door die toekenning het totale op grond van de
      communautaire regelgeving toegestane voordeel, zou worden overschreden.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel3
  - number: '3.2'
    text: |-
      Het eerste lid, onderdeel c, is niet van toepassing op projecten als bedoeld in [artikel 2, onderdeel i][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: '3.3'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op projecten als bedoeld in
      [artikel 2, onderdeel g.3°, g.4°, of g.7°][ref1], die worden uitgevoerd op of aan een woning en die worden
      uitgevoerd voor rekening en risico van de eigenaar-bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: '4.1'
    text: |-
      Een verklaring kan slechts worden aangevraagd door en afgegeven worden aan een kredietinstelling of een
      beleggingsinstelling als bedoeld in [artikel 5.14, tweede lid, van de Wet inkomstenbelasting 2001][ref1], die
      voornemens is in belangrijke mate bij te dragen aan het verstrekken van kredieten ten behoeve van het project dan
      wel het direct of indirect beleggen van vermogen in het project.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '4.2'
    text: |-
      Een aanvraag voor projecten als bedoeld in [artikel 2, onderdelen a tot en met f][ref1], wordt ingediend bij
      de Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit en voor andere projecten bij
      SenterNovem.


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: '4.3'
    text: |-
      Voor projecten waarvoor reeds eerder een verklaring is afgegeven kan een nieuwe aanvraag eerst drie jaar voor de
      afloop van de geldende verklaring worden ingediend.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel4
  - number: '4.4'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van een formulier dat door de Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer op aanvraag beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel4
  - number: '4.5'
    text: |-
      Aan een aanvrager kan worden verzocht een accountantsverklaring te overleggen, waaruit de juistheid of
      aannemelijkheid van de in de aanvraag vermelde gegevens blijkt.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel4
  - number: '5.1'
    text: |-
      De Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer beslist, in overeenstemming met de Minister
      van Financiën en na overleg met de Minister van Landbouw, Natuur en Voedselkwaliteit en de Minister van Verkeer en
      Waterstaat, op een aanvraag binnen acht weken na de indiening ervan.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel5
  - number: '5.2'
    text: Een afschrift van het besluit wordt gezonden aan de projectbeheerder.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel5
  - number: '6.1'
    text: |-
      De verklaring kan maximaal negen maanden na de afgifte van de verklaring in werking treden en kan niet langer
      gelden dan de verwachte levensduur van het project en dan een duur van ten hoogste:
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
  - number: 6.1.a
    text: tien jaren;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
  - number: 6.1.b
    text: |-
      dertig jaren, indien het een project betreft als bedoeld in [artikel 2, onderdeel a, b, c of d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: 6.1.c
    text: |-
      vijftien jaren, indien het een project betreft als bedoeld in [artikel 2, onderdeel g.3°, g.4°, of g.7°][ref1],
      die worden uitgevoerd op of aan een woning en die worden uitgevoerd voor rekening en risico van de eigenaar-
      bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: '6.2'
    text: |-
      De verklaring vermeldt de aard van het project, het projectvermogen, de datum waarop de verklaring in werking
      treedt en de periode waarvoor de verklaring geldt.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
  - number: '6.3'
    text: |-
      Ter zake van een project als bedoeld in [artikel 2, onderdeel d, onder 5° en 6°][ref1]., komt voor een verklaring
      in aanmerking een bedrag van:


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: 6.3.1°
    text: ten hoogste € 2.268 per hectare indien het project betrekking heeft op passief beheer;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
  - number: 6.3.2°
    text: ten hoogste € 4.538 per hectare indien het project betrekking heeft op licht beheer;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
  - number: 6.3.3°
    text: ten hoogste € 6.808 per hectare indien het project betrekking heeft op zwaar beheer.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
  - number: '6.4'
    text: |-
      Ter zake van een project als bedoeld in [artikel 2, onderdeel d, onder 2°][ref1], komt voor een verklaring in
      aanmerking een bedrag van:


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: 6.4.1°
    text: |-
      ten hoogste € 2.268 per hectare voor projecten als bedoeld in de
      [bijlagen 19 tot en met 22 bij de Subsidieregeling agrarisch natuurbeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 6.4.2°
    text: |-
      ten hoogste € 4.538 per hectare voor projecten als bedoeld in de [bijlagen 15 tot en met 17][ref1],
      [24 tot en met 30][ref2], [32][ref3] en [45 bij de Subsidieregeling agrarisch natuurbeheer][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
      [ref4]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
      - id: ref4
        bwb_id: BWBR0011000
  - number: 6.4.3°
    text: |-
      ten hoogste € 6.808 per hectare voor projecten als bedoeld in de [bijlagen 6 tot en met 14][ref1], [18][ref2],
      [23][ref3] en [41 tot en met 43 bij de Subsidieregeling agrarisch natuurbeheer][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
      [ref4]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
      - id: ref4
        bwb_id: BWBR0011000
  - number: '6.5'
    text: |-
      In afwijking van het vierde lid komen projecten die betrekking hebben op beheerspakketten als bedoeld
      in de [bijlagen 19 tot en met 22 bij de Subsidieregeling agrarisch natuurbeheer][ref1], waarvan de
      bijbehorende subpakketten inhoudelijk gelijk zijn aan een gelijknamig beheerspakket als bedoeld in de
      [bijlagen 12 tot en met 18 bij die regeling][ref2], in aanmerking voor een bedrag dat gelijk is aan het bij die
      beheerspakketten behorende bedrag, genoemd in de [bijlagen 12 tot en met 18 bij die regeling][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
  - number: '6.6'
    text: |-
      Ter zake van een project als bedoeld in [artikel 2, onderdeel e, onder 3°][ref1], komt voor een verklaring in
      aanmerking een bedrag van ten hoogste € 100 per m2 kasoppervlak, exclusief de kosten voor het gelijktijdig opwekken
      van warmte en kracht of de kosten van een warmptepomp en/of warmte en koudeopslag.


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: '6.7'
    text: |-
      Ter zake van een project als bedoeld in [artikel 2, onderdeel h, onder 4°][ref1], komt voor een verklaring in
      aanmerking een bedrag van ten hoogste € 400 per m2 bruto vloeroppervlak.


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: '6.8'
    text: |-
      Ter zake van een project als bedoeld in [artikel 2, onderdeel h, onder 4°][ref1], komt voor een verklaring in
      aanmerking maximaal 5000 m2 bruto vloeroppervlak per project.


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: '6.9'
    text: |-
      Het projectvermogen van een project onder [artikel 2, onderdeel k][ref1], wordt, indien het meer bedraagt dan
      € 25.000.000, beperkt tot dat bedrag, tenzij bij besluit van de Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer in overeenstemming met de Minister van Financiën anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: '6.10'
    text: |-
      Het projectvermogen kan niet meer bedragen dan het bedrag dat op grond van het mededingingsbeleid van de Europese
      Unie is toegestaan.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
  - number: '6.11'
    text: |-
      Voor een woning als bedoeld in [artikel 2, onderdeel h, onder 1°, 2° of 3°][ref1], komt ten hoogste een bedrag
      van € 34.034 voor een verklaring in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: '6.12'
    text: Het projectvermogen kan, indien het meer bedraagt dan € 34.033.516, tot dat bedrag worden beperkt.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
  - number: '6.13'
    text: |-
      De verklaring voor een project als bedoeld in [artikel 2, onderdeel a, e, f, g, h.1° t/m h.4°, i, j of k][ref1]
      vervalt indien binnen 2 jaar na de dag van afgifte van een verklaring geen aanvang is gemaakt met de uitvoering van
      de werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: '6.14'
    text: In de verklaring kunnen nadere voorwaarden worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
  - number: '6.15'
    text: |-
      Voor een woning als bedoeld in [artikel 2, onderdeel h, onder 5°][ref1], komt voor een verklaring in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: 6.15.b
    text: |-
      een bedrag van maximaal € 50.000 voor projecten die voldoen aan de eisen zoals bedoeld in
      [artikel 2, onderdeel h, onder 5°, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: 6.15.c
    text: |-
      een bedrag van maximaal € 100.000 voor projecten die voldoen aan de eisen zoals bedoeld in
      [artikel 2, onderdeel h, onder 5°, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: '7'
    text: |-
      Indien het projectvermogen meer bedraagt dan € 25 000 000, of het bedrag dat met de verklaring, bedoeld in
      [artikel 2][ref1], mogelijk als een financieel of ander voordeel kan worden verworven, meer bedraagt dan € 5 000
      000, meldt de Minister het project overeenkomstig artikel 88, derde lid, van het EG-verdrag aan bij de Commissie
      van de Europese Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: '8.1'
    text: |-
      De Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer kan, in overeenstemming met de Minister
      van Financiën en na overleg met de Minister van Landbouw, Natuur en Voedselkwaliteit en de Minister van Verkeer en
      Waterstaat, de verklaring intrekken indien:
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel8
  - number: 8.1.a
    text: |-
      de ter zake verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de aanvraag een andere beslissing zou
      zijn genomen als bij de beoordeling daarvan de juiste of volledige gegevens bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel8
  - number: 8.1.b
    text: |-
      blijkt dat de uitvoering van het project in aanzienlijke mate afwijkt van het project op grond waarvan de
      verklaring is afgegeven;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel8
  - number: 8.1.c
    text: blijkt dat de projectbeheerder de vermogenstoestand van het project niet afzonderlijk administreert;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel8
  - number: 8.1.d
    text: niet wordt voldaan aan de voorwaarden die in de verklaring zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel8
  - number: 8.1.e
    text: |-
      de melding, bedoeld in [artikel 8][ref1], niet onverwijld is geschied;


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel8
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '8'
  - number: 8.1.f
    text: |-
      bij projecten als bedoeld in [artikel 2, onderdeel h, onder 5°][ref1], de werkzaamheden niet zijn beëindigd binnen
      twee jaar na de dag waarop de hypotheekakte werd gepasseerd dan wel de leenovereenkomst werd gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: '8.2'
    text: Het besluit tot intrekking kan terugwerkende kracht hebben.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel8
  - number: '8.3'
    text: Het besluit tot intrekking wordt gezonden aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel8
  - number: '8.4'
    text: Een afschrift van het besluit wordt gezonden aan de projectbeheerder en de inspecteur.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel8
  - number: '9'
    text: |-
      Indien de uitvoering van een project wordt gewijzigd doet de instelling die kapitaal verschaft ten behoeve van
      een project waarvoor een verklaring is afgegeven, daarvan onverwijld melding aan de Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel9
  - number: '10'
    text: |-
      Ten behoeve van de vaststelling van een verklaring van de daartoe van belang zijnde gegevens en van de
      daaraan verbonden rechten en plichten is ten aanzien van de kredietinstelling of beleggingsinstelling,
      bedoeld in [artikel 5.14, tweede lid, van de Wet inkomstenbelasting 2001][ref1] en de projectbeheerder
      [hoofdstuk VIII, afdeling 2, van de Algemene wet inzake rijksbelastingen][ref2] van overeenkomstige toepassing,
      waarbij de aldaar jegens de inspecteur opgelegde verplichtingen mede gelden jegens de door de Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002320
        afdeling: '2'
  - number: '11.1'
    text: |-
      De in [artikel 2, onderdeel g, onder 2°][ref1], gegeven verwijzing naar NVN-norm 11400-0, heeft betrekking op de
      laatst uitgegeven NVN-norm, met de daarop uitgegeven aanvullingen en correctiebladen. Een uitgegeven aanvulling,
      onderscheidenlijk correctieblad, wordt eerst van toepassing op 1 januari van het jaar volgende op dat waarin de
      uitgifte heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: '11.2'
    text: |-
      Met de in deze regeling bedoelde normen, meetvoorschriften, tests, verklaringen en certificaten, worden
      gelijkgesteld normen, meetvoorschriften, tests, verklaringen en certificaten die worden toegepast in een andere
      staat en die ten minste een gelijkwaardig beschermingsniveau bieden dan wel indien het verklaringen en certificaten
      betreft, deze zijn afgegeven op basis van onderzoekingen die een beschermingsniveau bieden dat ten minste
      gelijkwaardig is aan het niveau dat met de nationale onderzoekingen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel11
  - number: '12.1'
    text: |-
      De Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer kan, in overeenstemming met de Minister
      van Financiën en na overleg met de Minister van Landbouw, Natuur en Voedselkwaliteit en de Minister van Verkeer en
      Waterstaat, een verklaring afgeven voor:
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel12
  - number: 12.1.a
    text: |-
      projecten als bedoeld in [artikel 2, onderdeel e, onder 3°, van de Regeling groenprojecten 2002][ref1], zoals deze
      luidde voor de datum van inwerkingtreding van deze regeling, indien een aanvraag daartoe binnen twee weken na de
      datum van inwerkingtreding van deze regeling wordt ingediend en voor dit project een bouwvergunning is afgegeven
      die rechtsgeldig is ten tijde van de aanvraag en waarvoor de verplichting tot levering van de kas voor de datum van
      inwerkingtreding van deze regeling is aangegaan;


      [ref1]: https://wetten.overheid.nl/BWBR0013274#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013274
        artikel: '2'
  - number: 12.1.b
    text: |-
      projecten als bedoeld in [artikel 2, onderdeel h, van de Regeling groenprojecten 2002][ref1], zoals deze luidde
      voor de datum van inwerkingtreding van deze regeling, indien een aanvraag daartoe binnen negen weken na de datum
      van inwerkingtreding van deze regeling wordt ingediend en waarvoor voor de datum van inwerkingtreding van deze
      regeling een aanvraag voor een bouwvergunning is ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0013274#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013274
        artikel: '2'
  - number: 12.1.c
    text: |-
      projecten als bedoeld in [artikel 2, onderdeel h][ref1], van de Regeling groenprojecten 2005, zoals deze luidde
      voor de datum van inwerkingtreding van de regeling groenprojecten 2006, indien een aanvraag daartoe binnen twaalf
      weken na de datum van inwerkingtreding van deze regeling wordt ingediend en waarvoor voor 1 januari 2006 een
      aanvraag voor een bouwvergunning is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0018466#Artikel2
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0018466
        artikel: '2'
  - number: '12.2'
    text: |-
      Aan een verklaring voor een project als bedoeld in het eerste lid, onder a, is de voorwaarde verbonden dat
      binnen drie maanden na het onherroepelijk worden van de bouwvergunning een begin met de uitvoering van de
      bouwwerkzaamheden wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel12
  - number: '13.1'
    text: |-
      De [Regeling groenprojecten 2002][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0013274
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013274
  - number: '13.2'
    text: |-
      De regeling, genoemd in het eerste lid, blijft van toepassing op projecten waaarvoor voor de datum van
      inwerkingtreding van deze regeling een aanvraag voor een verklaring is ingediend.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel13
  - number: '14'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel14
  - number: '15'
    text: 'Deze regeling wordt aangehaald als: Regeling groenprojecten 2005.'
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel15
