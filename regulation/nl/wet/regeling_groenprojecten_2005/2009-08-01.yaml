  - number: '2'
    text: |-
      De Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer kan, in overeenstemming met de Minister
      van Financiën en na overleg met de Minister van Landbouw, Natuur en Voedselkwaliteit en de Minister van Verkeer en
      Waterstaat, een verklaring afgeven voor:
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel2
  - number: 2.a
    text: |-
      projecten, bestaande uit aaneengesloten gebieden met een oppervlakte van ten minste vijf hectare, die gericht
      zijn op de ontwikkeling en instandhouding van bos en andere houtopstanden, met uitzondering van vruchtbomen,
      windsingels, wegbeplantingen en bomen die bestemd zijn om te dienen als kerstbomen en kweekgoed;
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel2
  - number: 2.b
    text: 'projecten die zijn gericht op de ontwikkeling en instandhouding van natuur- en landschappelijke waarden in:'
    url: https://wetten.overheid.nl/BWBR0018466/2009-08-01#Artikel2
