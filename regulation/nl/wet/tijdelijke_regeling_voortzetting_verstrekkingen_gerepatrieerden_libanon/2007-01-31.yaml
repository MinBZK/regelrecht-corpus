  - number: '3'
    text: |-
      1 De in [artikel 2][ref1] bedoelde verstrekkingen kunnen geheel of gedeeltelijk worden onthouden, indien de in
      [dit artikel][ref2] bedoelde Nederlander, zijn niet-Nederlandse partner of huwelijkspartner, zijn kind, stief-
      of pleegkind, niet desgevraagd de gegevens verstrekt die nodig zijn voor het vaststellen van het recht op
      verstrekkingen. Daartoe behoren in ieder geval gegevens die noodzakelijk zijn voor het vaststellen van de naam, de
      geboortedatum, de nationaliteit, het land van herkomst, de gezinssamenstelling, de datum van aankomst in Nederland,
      de middelen waarover in Nederland kan worden beschikt en de aanwezige verzekeringen voor ziektekosten en wettelijke
      aansprakelijkheid.

      2 De SVB kan een verstrekking als bedoeld in [artikel 2, eerste lid, onderdelen a en b][ref3], geheel of
      gedeeltelijk weigeren, indien blijkt dat de Nederlander, zijn niet-Nederlandse partner of huwelijkspartner, zijn
      kind, stief- of pleegkind hier te lande over voldoende middelen kan beschikken om geheel of gedeeltelijk in de
      kosten van die verstrekking te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0020553#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020553#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020553#Artikel2
    url: https://wetten.overheid.nl/BWBR0020553/2007-01-31#Artikel3
