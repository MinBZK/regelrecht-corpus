preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, en9 van de Kaderwet SZW-subsidies en de artikelen 34, eerste lid, onderdeel e,
    en 77 van de Wet structuur uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020553/2007-01-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. buitengewone kosten: noodzakelijke, onvermijdbare kosten die in Nederland worden gemaakt en die vanwege hun aard
      of hoogte in redelijkheid niet geacht kunnen worden door de gerepatrieerde zelf te worden betaald;

      b. Minister: de Minister van Sociale Zaken en Werkgelegenheid;

      c. SVB: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0020553/2007-01-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: '2'
    text: |-
      1 De Nederlander, zijn niet-Nederlandse partner of huwelijkspartner, zijn
      kind, stief- of pleegkind, die op 24 oktober 2006 een verstrekking op grond van
      [artikel 3 van de Tijdelijke regeling verstrekkingen gerepatrieerden Libanon][ref1] ontving, heeft gedurende zijn
      verblijf in Nederland recht op de volgende verstrekkingen, zolang de Nederlander geen recht heeft op algemene
      bijstand op grond van de [Wet werk en bijstand][ref2]:

      a. een wekelijkse financiële toelage voor de aanschaf van voedsel, kleding en andere persoonlijke uitgaven;

      b. betaling van buitengewone kosten;

      c. de dekking van de kosten van medische verstrekkingen overeenkomstig een daartoe te treffen ziektekostenregeling
      voorzover deze kosten niet uit hoofde van een andere ziektekostenregeling worden vergoed; of

      d. een verzekering tegen de financiële gevolgen van wettelijke aansprakelijkheid voorzover deze kosten niet uit
      hoofde van een andere verzekering worden vergoed.

      2 De niet-Nederlandse partner of huwelijkspartner van de Nederlander, zijn
      kind, stief- of pleegkind, die op 24 oktober 2006 een verstrekking op grond van
      [artikel 3 van de Tijdelijke regeling verstrekkingen gerepatrieerden Libanon][ref3] ontving en waarvan de
      Nederlandse partner algemene bijstand op grond van de [Wet werk en bijstand][ref4] ontvangt, heeft gedurende zijn
      verblijf in Nederland recht op de volgende verstrekkingen, zolang hij geen recht heeft op algemene bijstand op
      grond van de [Wet werk en bijstand][ref5]:

      a. de dekking van de kosten van medische verstrekkingen overeenkomstig een daartoe te treffen ziektekostenregeling
      voorzover deze kosten niet uit hoofde van een andere ziektekostenregeling worden vergoed; of

      b. een verzekering tegen de financiële gevolgen van wettelijke aansprakelijkheid voorzover deze kosten niet uit
      hoofde van een andere verzekering worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0020126#Artikel3
