  - number: '8'
    text: |-
      Indien blijkt dat een Nederlander, zijn niet-Nederlandse partner of huwelijkspartner, zijn kind, stief- of
      pleegkind, in strijd met de waarheid gegevens heeft verstrekt of verzwegen, waardoor hij of anderen ten onrechte,
      of tot een te hoog bedrag, de verstrekkingen, bedoeld in [artikel 2][ref1], heeft verkregen, dan wel dit op andere
      wijze heeft bewerkstelligd, is de SVB bevoegd de waarde van de ten onrechte toegekende verstrekkingen terug te
      vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0020553#Artikel2
    url: https://wetten.overheid.nl/BWBR0020553/2007-01-31#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020553
        artikel: '2'
  - number: '9'
    text: |-
      1 De lasten van deze regeling voor de SVB worden gefinancierd uit een subsidie in de vorm van een rijksbijdrage aan
      de SVB.

      2 De middelen, bedoeld in het eerste lid, worden op basis van een raming van de minister ter beschikking
      gesteld aan de SVB via de rekening-courant bij de Minister van Financiën, die de SVB op grond van
      [artikel 120, eerste lid, van de Wet financiering sociale verzekeringen][ref1] aanhoudt.

      3 Op de lasten van deze regeling voor de SVB komt in mindering de waarde van de ten onrechte toegekende
      verstrekkingen, die wordt teruggevorderd op grond van [artikel 9][ref2].

      4 [Artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] en
      [artikel 120, derde lid, van de Wet financiering sociale verzekeringen][ref4] zijn van overeenkomstige toepassing.

      5 De SVB zendt uiterlijk vóór 1 juni van het jaar volgend op het jaar waarop de jaarrekening betrekking heeft op
      basis van de jaarrekening over dat jaar een overzicht van zijn uitgaven op grond van deze regeling ten laste van
      de rijksbijdrage.

      6 De minister stelt vóór 31 oktober van het jaar volgend op het jaar waarop de jaarrekening betrekking heeft de
      rijksbijdrage vast.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel120
