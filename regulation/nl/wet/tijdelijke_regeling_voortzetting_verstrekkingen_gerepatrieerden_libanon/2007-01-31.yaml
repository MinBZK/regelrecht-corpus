        artikel: '2'
  - number: '7'
    text: |-
      1 Het treffen van een ziektekostenregeling als bedoeld in
      [artikel 2, eerste lid, onderdeel c, en tweede lid, onderdeel a][ref1], houdt in het door de Minister
      ten behoeve van de Nederlander, zijn niet-Nederlandse partner of huwelijkspartner, zijn kind, stief-
      of pleegkind sluiten van een verzekering tegen de in [artikel 10 van de Zorgverzekeringswet][ref2] en
      [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref3] bedoelde risico’s, alsmede het door de Minister
      betalen van de daarvoor verschuldigde kosten.

      2 Het verzekeren tegen de financiële gevolgen van wettelijke aansprakelijkheid, bedoeld in
      [artikel 2, eerste lid, onderdeel d, en tweede lid, onderdeel b][ref4], houdt in het door de Minister ten behoeve
      van de Nederlander, zijn niet-Nederlandse partner of huwelijkspartner, zijn kind, stief- of pleegkind, sluiten van
      een verzekering voor de wettelijke aansprakelijkheid van deze personen jegens een derde voor een som van maximaal
      € 1.000.000,– per gebeurtenis, alsmede het door de Minister betalen van de daarvoor verschuldigde kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0020553#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0020553#Artikel2
    url: https://wetten.overheid.nl/BWBR0020553/2007-01-31#Artikel7
