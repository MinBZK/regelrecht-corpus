  - number: '4'
    text: |-
      De in [artikel 2][ref1] bedoelde verstrekkingen eindigen in ieder geval:

      a. met ingang van de dag waarop de Nederlander, zijn niet-Nederlandse partner of huwelijkspartner, zijn kind,
      stief- of pleegkind, Nederland verlaat; of

      b. indien een Nederlander, zijn niet-Nederlandse partner of huwelijkspartner, zijn kind, stief- of pleegkind,
      in strijd met de waarheid gegevens heeft verstrekt of verzwegen, met het oogmerk om aldus voor zichzelf of voor
      anderen, ten onrechte een aanspraak te doen ontstaan op de verstrekkingen, dan wel ten onrechte de hoogte van de
      verstrekkingen te doen stijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0020553#Artikel2
    url: https://wetten.overheid.nl/BWBR0020553/2007-01-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020553
        artikel: '2'
  - number: '5'
    text: |-
      1 De hoogte van de in [artikel 2, eerste lid, onderdeel b][ref1], bedoelde financiële toelage bedraagt voor:

      a. een volwassene € 40,–, doch voor een alleenstaande ouder met een kind jonger dan 18 jaar € 67,–.;

      b. een kind tot en met 11 jaar € 8,–;

      c. een kind ouder dan 11 jaar en jonger dan 18 jaar € 12,–.

      2 De financiële toelage wordt op een door de SVB te bepalen tijdstip en wijze aan de Nederlander, zijn niet-
      Nederlandse partner of huwelijkspartner, zijn kind, stief- of pleegkind beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020553#Artikel2
    url: https://wetten.overheid.nl/BWBR0020553/2007-01-31#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020553
        artikel: '2'
  - number: '6'
    text: |-
      1 Een Nederlander, zijn niet-Nederlandse partner of huwelijkspartner, zijn kind, stief- of pleegkind, kan een
      vergoeding ontvangen voor buitengewone kosten, bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], die hij heeft
      gemaakt.

      2 Buitengewone kosten worden slechts betaald voor zover vooraf door de SVB aan de Nederlander, zijn niet-
      Nederlandse partner of huwelijkspartner, zijn kind, stief- of pleegkind toestemming is verleend voor het maken van
      deze kosten, met uitzondering van kosten die voortvloeien uit noodsituaties waarin geen mogelijkheid bestond tot
      het verzoeken om toestemming.

      3 De toestemming, bedoeld in het tweede lid, wordt verleend voor zover de kosten noodzakelijk zijn en niet op
      andere wijze in de betaling kan worden voorzien.

      4 Kosten die samenhangen met een door de Nederlander, zijn niet-Nederlandse partner of huwelijkspartner, zijn kind,
      stief- of pleegkind, gepleegde onrechtmatige daad, gepleegd misdrijf of begane overtreding zijn in ieder geval geen
      buitengewone kosten als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020553#Artikel2
    url: https://wetten.overheid.nl/BWBR0020553/2007-01-31#Artikel6
    references:
      - id: ref1
