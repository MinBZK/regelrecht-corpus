    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst, werkt terug tot en met 25 oktober 2006 en vervalt met ingang van 1 mei 2007.

      2 De regeling, zoals die voor de datum waarop deze vervalt geldt, blijft van toepassing op de financiële
      afwikkeling van deze regeling.
