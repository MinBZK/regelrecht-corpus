articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *IBBAD:* het [Inkomstenbesluit burgerlijke ambtenaren defensie][ref1]
        - *groep 1:* de ambtenaar met een hoger salaris dan dat van een sergeant-majoor van de Koninklijke landmacht of de
      Koninklijke luchtmacht met een salarisnummer 19;
        - *groep 2:* de ambtenaar met een hoger salaris dan dat van een korporaal der eerste klasse van de Koninklijke
      landmacht of de Koninklijke luchtmacht met een salarisnummer 7, maar welk salaris niet hoger is dan dat van een
      sergeant-majoor van de Koninklijke landmacht of de Koninklijke luchtmacht met een salarisnummer 19;
        - *groep 3:* de ambtenaar die niet behoort tot groep 1 of groep 2.


