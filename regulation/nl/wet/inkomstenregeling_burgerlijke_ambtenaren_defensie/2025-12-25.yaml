  - number: '4.1'
    text: |-
      In dit artikel wordt verstaan onder: - *categorie A:* a. het onschadelijk maken van explosieven – munitie daaronder
      begrepen – die door welke oorzaak dan ook in een gevaarlijke toestand zijn komen te verkeren of waarvan wordt
      aangenomen dat zij zich in een gevaarlijke toestand bevinden; daaronder wordt niet mede verstaan het door middel
      van een vernietigingslading doen springen van niet-geëxplodeerde munitie bij schietoefeningen; b. het gereedmaken
      van gevaarlijke explosieven of munitie voor vernietiging; c. het vervoeren van explosieven, bedoeld onder a, indien
      daarbij ontploffingsgevaar bestaat.
        - *categorie B:* a. renovatiewerkzaamheden aan eigen munitie of munitie van bekende samenstelling, omvattende:
      1°. het verwijderen van niet afgevuurde ontstekingsdoppen uit hulzen; 2°. het plaatsen van ontstekingsdoppen
      in hulzen; 3°. het verwijderen van de voortdrijvende lading uit hulzen; 4°. het plaatsen van de voortdrijvende
      lading in hulzen; 5°. het depatorneren van patroonmunitie; 6°. het patroneren van patroonmunitie; 7°. het
      monteren van munitie, gevuld met springstof, rooksas, lichtsas of brandsas; 8°. het verwijderen van buizen of
      ontstekingsinrichtingen van munitie, indien dit op andere wijze dan met de normale munitie moet geschieden; 9°.
      het demonteren van buizen of ontstekingsinrichtingen; 10°. het schoonstralen met staalgrit van munitie, gevuld met
      springstof, rooksas, lichtsas of brandsas; 11°. het verwijderen van springstof, rooksas, lichtsas of brandsas uit
      munitie door middel van branden, stomen, steken, spoelen of schrappen; 12°. het boren, zagen, afdraaien of persen
      van springstof, rooksas, lichtsas of brandsas; b. onderzoekingswerkzaamheden aan eigen munitie of munitie van
      bekende samenstelling, waarbij tot gehele of gedeeltelijke demontage moet worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel4
  - number: '4.2'
    text: |-
      De ambtenaar die in opdracht van de commandant tot categorie A behorende werkzaamheden verricht, heeft aanspraak
      op een toelage, waarvan het bedrag wordt vastgesteld met toepassing van de bedragen genoemd in tabel 9 onder
      ‘Toelage munitieruimen ad [artikel 19, tweede lid’, van de Inkomstenregeling regeling militairen][ref1]en de
      groepsindeling, bedoeld in [artikel 1, onder d, e en f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039974#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0039881#Artikel1
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0039974
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0039881
        artikel: '1'
        hoofdstuk: '1'
  - number: '4.3'
    text: |-
      De ambtenaar die in opdracht van de commandant tot categorie B behorende werkzaamheden verricht, heeft aanspraak op
      een toelage, waarvan het bedrag wordt vastgesteld met toepassing van de bedragen genoemd in tabel 9 onder ‘Toelage
      munitieruimen ad [artikel 19, vierde lid’, van de Inkomstenregeling militairen][ref1] en de groepsindeling,
      bedoeld in [artikel 1, onder d, e en f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039974#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0039881#Artikel1
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0039974
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0039881
        artikel: '1'
        hoofdstuk: '1'
  - number: '4.4'
    text: |-
      Aanspraak op de toelage, bedoeld in het derde lid, heeft ook de ambtenaar die zich in opdracht van de commandant in
      een ruimte bevindt waarin te zelfder tijd tot de in het eerste lid behorende werkzaamheden worden verricht, indien
      dat met het oog op die werkzaamheden noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel4
  - number: '5.1'
    text: |-
      In dit artikel wordt verstaan onder: - *adviseur arbeidsomstandigheden:* de functionaris, belast met de adviestaak
      ten aanzien van arbeidsomstandigheden bij het Defensieonderdeel;
        - *bezwarende arbeidsomstandigheden:* arbeidsomstandigheden met één of meer bezwarende omstandigheden van het
      type: '(1) Huid- of slijmvliesirriterende stoffen: werken met stoffen die irritatie aan huid of slijmvlies geven.'
      (2) Verontreinigingen: werken met stoffen die huidverontreiniging geven en niet direct afwasbaar zijn. (3) Afkeer:
      werken in een omgeving waarbij sterk onaangename geuren worden ingeademd, of werken met onaangenaam aandoende of
      sterke afkeer oproepende materialen; (4) Hitte en koude: het verrichten van werkzaamheden waarbij men langdurig is
      blootgesteld aan een zeer onaangenaam hoge of lage temperatuur of aan sterke temperatuurwisselingen; (5) Lawaai:
      werken in situaties waarbij men is blootgesteld aan een zodanig aanhoudend lawaai dat onderling contact nauwelijks
      mogelijk is en/of de geluidsterkte gelijk is aan of groter is dan 80 db A; (6) Trillingen: het werken met sterk
      trillende apparatuur; (7) Hinderlijke beschermingsmiddelen: het werken met beschermingskleding of -middelen die
      zeer hinderlijk zijn, bijv. doordat deze een belemmering vormen voor de normale ademhaling, dan wel een ernstige
      belemmering vormen voor huidoppervlakte-uitwaseming of bewegingsmogelijkheden; (8) Persoonlijk risico/gevaar: het
      werken onder omstandigheden die een verhoogd risico/gevaar voor de persoon meebrengen.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
  - number: '5.2'
    text: |-
      Het hoofd defensieonderdeel kent een toelage bezwarende arbeidsomstandigheden toe aan de ambtenaar die
      werkzaamheden verricht onder bezwarende arbeidsomstandigheden op basis van het aantal uren gedurende welke onder
      die omstandigheden is gewerkt. Toekenning vindt plaats indien alle redelijkerwijs mogelijke preventieve maatregelen
      zijn genomen om de bezwarende omstandigheid zoveel mogelijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
  - number: '5.3'
    text: De toelage wordt niet toegekend, indien sprake is van een oefening.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
  - number: '5.4'
    text: |-
      De ambtenaar die meer dan 360 uur per jaar de in het tweede lid bedoelde werkzaamheden verricht of heeft
      verricht wordt jaarlijks onderworpen aan een periodiek bedrijfsgeneeskundig onderzoek als bedoeld in
      [artikel 56, tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref1]. Het hoofd defensieonderdeel
      besluit na het onderzoek of de ambtenaar zijn arbeid geheel of gedeeltelijk blijft verrichten of dat hem andere
      werkzaamheden worden opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel56
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '56'
  - number: '5.5'
    text: 'De bezwarende arbeidsomstandigheden worden onderverdeeld in drie toelagecategorieën:'
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
  - number: 5.5.a
    text: 'toelagecategorie 1: één type bezwarende arbeidsomstandigheden;'
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
  - number: 5.5.b
    text: 'toelagecategorie 2: twee typen bezwarende arbeidsomstandigheden;'
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
  - number: 5.5.c
    text: 'toelagecategorie 3: drie of meer typen bezwarende arbeidsomstandigheden.'
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
  - number: '5.6'
    text: |-
      De toelage bedraagt een percentage van het salaris per uur doch ten hoogste van het
      salaris per uur afgeleid van het salaris behorend bij het maximum van salarisschaal 7 van
      [bijlage A van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref1], te weten:


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: 5.6.a
    text: '5% van het salaris per uur: voor toelagecategorie 1;'
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
  - number: 5.6.b
    text: '10% van het salaris per uur: voor toelagecategorie 2;'
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
  - number: 5.6.c
    text: '15% van het salaris per uur: voor toelagecategorie 3.'
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
  - number: '5.7'
    text: |-
      Het hoofd defensieonderdeel beoordeelt en stelt vast, na verkregen advies van de adviseur arbeidsomstandigheden,
      of sprake is van bezwarende arbeidsomstandigheden en stelt vervolgens vast welke toelagecategorie wordt toegepast.
      Het hoofd defensieonderdeel kan indien sprake is van uitzonderlijk bezwarende arbeidsomstandigheden in plaats van
      het in het vorige lid aangegeven bij een toelagecategorie behorende toelagepercentage het toelagepercentage van een
      hogere toelagecategorie toepassen onverminderd het in het tweede tot en met vierde lid bepaalde. Deze bevoegdheden
      kunnen niet worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
  - number: '5.8'
    text: |-
      De ambtenaar die gedurende meer dan 360 uur per jaar de in het tweede lid bedoelde werkzaamheden verricht heeft
      aanspraak op een verhoging van de in het zesde lid bedoelde toelage:
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
  - number: 5.8.a
    text: van 75% voor het werken onder bezwarende omstandigheden van 361 tot 500 uur per jaar.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
  - number: 5.8.b
    text: van 100% voor het werken onder bezwarende omstandigheden van 501 tot 600 uur per jaar.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
  - number: 5.8.c
    text: van 200% voor het werken onder bezwarende omstandigheden boven 600 uur per jaar.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5
  - number: 5a.1
    text: |-
      De bindingspremie, bedoeld in [artikel 47 van het besluit][ref1], heeft een tijdelijk karakter en wordt voor een
      periode van ten hoogste vijf jaar toegekend. De aanspraak op de premie ontstaat eerst na afloop van de periode
      waarvoor de bindingspremie is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel47
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '47'
  - number: 5a.2
    text: |-
      Met inachtneming van het eerste lid kan bij wijze van voorschot voor ten hoogste 60% van het in het jaar van
      toekenning geldende salaris vooraf worden uitbetaald met dien verstande dat nooit meer kan worden uitbetaald dan de
      totale bindingspremie.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5a
  - number: 5a.3
    text: Het is toegestaan na ommekomst van de bindingsperiode opnieuw een bindingspremie toe te kennen.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5a
  - number: 5a.4
    text: |-
      Bindingspremies worden niet toegekend aan ambtenaren op wie reeds een maatregel met een bindende werking van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5a
  - number: 5a.5
    text: |-
      Over de periode waarvoor de bindingspremie is toegekend, bedraagt de premie gemiddeld jaarlijks maximaal 30% van
      het in het betreffende jaar genoten salaris Indien een bindingspremie wordt toegekend over een periode langer dan
      één jaar, dan kunnen over de onderscheidenlijke jaren afwijkende opbouwende percentages per jaar worden toegekend.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5a
  - number: 5a.6
    text: |-
      Uitbetaling van de premie vindt plaats binnen twee maanden nadat de ambtenaar de in het eerste lid bedoelde periode
      heeft voltooid.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5a
  - number: 5a.7
    text: |-
      Indien binnen de periode waarvoor de bindingspremie is toegekend ontslag wordt verleend, betaalt de ambtenaar de
      vooraf betaalde premiebedragen terug.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5a
  - number: 5a.8
    text: |-
      Indien de billijkheid dat vordert kan het hoofd defensieonderdeel gehele of gedeeltelijke ontheffing van de
      terugbetalingsverplichting vaststellen. Hiervan is in elk geval sprake indien het ontslag het gevolg is van
      omstandigheden die niet aan de ambtenaar te wijten zijn.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5a
  - number: 5b
    text: |-
      Bij toekenning van een aanspraak op een wervingstoelage als bedoeld in [artikel 18 van het besluit][ref1], een
      functioneringstoelage, als bedoeld in [artikel 46 van het besluit][ref2], een bindingspremie, als bedoeld in
      [artikel 47 van het besluit][ref3], of een beloning, als bedoeld in [artikel 45 van het besluit][ref4], bedraagt de
      totale waarde van die aanspraken, gerekend over de voorafgaande 12 maanden, maximaal 40% van het tot een jaarbedrag
      herleide salaris in de maand van de toekenning.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0018191#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0018191#Artikel45
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '46'
      - id: ref3
        bwb_id: BWBR0018191
        artikel: '47'
      - id: ref4
        bwb_id: BWBR0018191
        artikel: '45'
  - number: '6.1'
    text: |-
      De ambtenaar die als duiker of leerling-duiker een dienstopdracht buiten een onderwaterlaboratorium in het water
      of onder water uitvoert, heeft aanspraak op een toelage, waarvan het bedrag wordt vastgesteld met toepassing van
      [tabel 14 van de Inkomstenregeling militairen](onbekend) en de groepsindeling, zoals vermeld in [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039881#Artikel1
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0039881
        artikel: '1'
        hoofdstuk: '1'
  - number: '6.2'
    text: 'Voor de toepassing van het eerste lid wordt:'
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6
  - number: 6.2.a
    text: |-
      het aantal minuten voor elk verblijf in het water of onder water – daaronder begrepen het verblijf in een
      recompressietoestel in aansluiting op een verblijf onder water – afzonderlijk vastgesteld en ten aanzien van
      de duiker en de leerling-duiker berekend naar de tijd, gedurende welke benodigde lucht op kunstmatige wijze is
      toegevoerd of ververst;
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6
  - number: 6.2.b
    text: |-
      een tijd van een halve minuut of minder verwaarloosd en een tijd van meer dan een halve minuut aangemerkt als een
      volle minuut.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6
  - number: '6.3'
    text: |-
      De in [tabel 14 van de Inkomstenregeling militairen](onbekend) genoemde bedragen worden verdubbeld, indien de
      diensten, bedoeld in het eerste lid, worden verricht binnen de poolcirkel of in het tijdvak van 1 oktober tot
      en met 30 april in de gematigde luchtstreken. Het vorenstaande is niet van toepassing bij het verrichten van die
      diensten in water dat kunstmatig op temperatuur is gebracht.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6
  - number: 6a.1
    text: |-
      In dit artikel wordt verstaan onder onderwaterlaboratorium: een in het water neergelaten toestel waarin de druk
      gelijk kan worden gemaakt aan de omgevende waterdruk en waarin zodanige voorzieningen zijn aangebracht dat één
      of meerdere personen daarin gedurende langere tijd en zonder gebruikmaking van ademhalingsapparatuur kunnen
      verblijven.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6a
  - number: 6a.2
    text: |-
      De ambtenaar die in opdracht van de commandant voor het verrichten van duikopdrachten, voor het verrichten
      of ondergaan van een keuring of een medische behandeling of voor een proefneming moet verblijven in een
      onderwaterlaboratorium, heeft aanspraak op een toelage, waarvan het bedrag wordt vastgesteld met toepassing van
      [tabel 15 van de Inkomstenregeling militairen](onbekend) en de groepsindeling, zoals vermeld in [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039881#Artikel1
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0039881
        artikel: '1'
        hoofdstuk: '1'
  - number: 6a.3
    text: |-
      De bedragen, bedoeld in het tweede lid, worden verdubbeld, indien wordt verbleven in een onverwarmd
      onderwaterlaboratorium binnen de poolcirkel of in het tijdvak van 1 oktober tot en met 30 april in de gematigde
      luchtstreken.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6a
  - number: 6a.4
    text: 'Voor de toepassing van het tweede lid wordt:'
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6a
  - number: 6a.4.a
    text: |-
      het aantal minuten, onderscheidenlijk het aantal etmalen voor elk verblijf in een onderwaterlaboratorium
      afzonderlijk vastgesteld;
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6a
  - number: 6a.4.b
    text: |-
      als aanvang van het verblijf gerekend het tijdstip waarop de ambtenaar het onderwaterlaboratorium binnengaat en als
      einde van het verblijf het tijdstip waarop de ambtenaar dat toestel verlaat;
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6a
  - number: 6a.4.c
    text: een gedeelte van een dag korter dan elf uren berekend per minuut;
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6a
  - number: 6a.4.d
    text: |-
      een tijd van een halve minuut of minder verwaarloosd en een tijd van meer dan een halve minuut aangemerkt als een
      volle minuut;
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6a
  - number: 6a.4.e
    text: een gedeelte van een etmaal aangemerkt als een vol etmaal.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6a
  - number: 6a.5
    text: |-
      De wijze van berekenen van de toelage, bedoeld in het tweede lid, voor de tijd, bedoeld in het vierde
      lid, onder b, heeft geen invloed op de aanspraak van de ambtenaar op de duiktoelage, bedoeld in
      [artikel 15 van de Inkomstenregeling militairen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039974#Artikel15
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0039974
        artikel: '15'
  - number: 6b.1
    text: |-
      De ambtenaar, die in opdracht van de commandant voor het verrichten of ondergaan van een keuring, een
      medische behandeling of een proefneming moet verblijven in een recompressietoestel waarin de druk is verhoogd,
      heeft aanspraak op een toelage, waarvan het bedrag wordt vastgesteld met toepassing van [tabel 16 van de
      Inkomstenregeling militairen](onbekend).
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6b
  - number: 6b.2
    text: 'Voor de toepassing van het eerste lid wordt:'
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6b
  - number: 6b.2.a
    text: het aantal minuten voor elk verblijf in een recompressietoestel afzonderlijk vastgesteld;
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6b
  - number: 6b.2.b
    text: |-
      een tijd van een halve minuut of minder verwaarloosd en een tijd van meer dan een halve minuut aangemerkt als een
      volle minuut.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel6b
  - number: '7.1'
    text: |-
      In dit artikel wordt verstaan onder: - *dienstreis:* een dienstreis in de zin van
      [artikel 1 van het Besluit dienstreizen defensie][ref1];
        - *ZZF-dag:* een dag als bedoeld in
      [artikel 31g, eerste en tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel31g
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 31g
  - number: '7.2'
    text: |-
      De commandant kent een toelage meerdaagse dienstreis ZZF toe aan de ambtenaar die in vaste dienst is aangesteld en
      die een dienstreis maakt, indien:
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel7
  - number: 7.2.a
    text: de dienstreis een etmaal of langer duurt, en
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel7
  - number: 7.2.b
    text: de dienstreis geheel of gedeeltelijk plaatsvindt op een ZZF-dag, en
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel7
  - number: 7.2.c
    text: op de ZZF-dag minimaal drie aaneengesloten uren daadwerkelijk wordt gereisd.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel7
  - number: '7.3'
    text: |-
      De ambtenaar heeft aanspraak op € 55,74 voor iedere ZZF-dag waarop aan de in het tweede lid bedoelde voorwaarden
      zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel7
  - number: 7a.1
    text: |-
      In dit artikel wordt verstaan onder: - *activiteiten:* 1°. het uitvoeren van inspecties of kleine reparaties
      aan het vliegtuig bij tussenlandingen; 2°. het ophalen van met het vliegtuig te vervoeren zieken, gewonden of
      hulpbehoevenden, alsmede van stoffelijke overschotten of van arrestanten; 3°. het beladen en ontladen van het
      vliegtuig; 4°. het verlenen van assistentie bij het redden van in nood verkerenden;
        - *dienstvluchten onder bijzondere omstandigheden:* 1°. de dienstvluchten die in vliegtuigen met straalvoortstuwing
      worden verricht; 2°. de dienstvluchten met een helikopter tijdens een opsporings- en reddingsactie; 3°. de
      dienstvluchten met een vliegtuig, waarbij wordt gestart van of geland op een schip buitengaats.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel7a
  - number: 7a.2
    text: |-
      De ambtenaar die in opdracht van de commandant tijdens een dienstvlucht werkzaamheden in de lucht verricht of op
      grond van een vluchtopdracht activiteiten verricht, heeft aanspraak op vlieggeld.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel7a
  - number: 7a.3
    text: |-
      Het vlieggeld waarop per uur aanspraak bestaat, wordt vastgesteld door het basisbedrag, bedoeld in [tabel 11 van de
      Inkomstenregeling militairen](onbekend), te vermenigvuldigen met een waarderingsfactor van 0,85.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel7a
  - number: 7a.4
    text: |-
      De ambtenaar die anders dan als passagier een dienstvlucht maakt onder naar het oordeel van het hoofd
      defensieonderdeel bijzondere omstandigheden, heeft – naast de aanspraken op grond van het tweede lid – aanspraak op
      bijzonder vlieggeld.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel7a
  - number: 7a.5
    text: |-
      Het bijzonder vlieggeld waarop per uur aanspraak bestaat, wordt vastgesteld door het basisbedrag, bedoeld in [tabel
      11 van de Inkomstenregeling militairen](onbekend), te vermenigvuldigen met een waarderingsfactor van 1,2.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel7a
  - number: 7a.6
    text: |-
      Het vlieggeld en het bijzonder vlieggeld waarop de ambtenaar aanspraak heeft, worden vastgesteld per maand, waarbij
      de totale tijdsduur van de dienstvluchten naar boven wordt afgerond op een vol kwartier.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel7a
  - number: 7a.7
    text: |-
      De maximumbedragen die per kwartaal aan vlieggeld en bijzonder vlieggeld mogen worden genoten, zijn opgenomen in
      [tabel 13 van de Inkomstenregeling militairen](onbekend).
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel7a
  - number: 7a.8
    text: |-
      Het hoofd defensieonderdeel kan maxima stellen aan het aantal vlieguren dat wordt vergolden met vlieggeld of
      bijzonder vlieggeld.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel7a
  - number: 7b
    text: |-
      De ambtenaar met een Nederlands militair parachutistenbrevet, of in opleiding daarvoor, heeft, indien hij in
      opdracht van de commandant een conditiesprong, onderscheidenlijk oefensprong met een parachute uit een vliegtuig of
      luchtballon tijdens de vlucht maakt, aanspraak op een toelage, waarvan het bedrag wordt vastgesteld met toepassing
      van tabel 9 van de Inkomstenregeling militairen.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel7b
  - number: '8.1'
    text: |-
      De commandant kent aan de ambtenaar een diensttijdgratificatie toe bij het bereiken van een diensttijd bij de
      overheid van 12½, 25, 40 of 50 jaar trouwe dienst. De gratificatie bedraagt 25% van de maandelijkse bezoldiging
      bij een 12½-jarig ambtsjubileum, 75% van de maandelijkse bezoldiging bij een 25-jarig ambtsjubileum en 100% van
      de maandelijkse bezoldiging bij een 40- en bij een 50-jarig ambtsjubileum, naar boven af te ronden op een veelvoud
      van € 2,50.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: '8.2'
    text: |-
      Indien aan de ambtenaar bij een hem uit een eerdere betrekking verleend ontslag een proportionele
      diensttijdgratificatie is toegekend, wordt de in het eerste lid bedoelde gratificatie verminderd met het bedrag van
      die proportionele diensttijdgratificatie.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: '8.3'
    text: |-
      Toekenning van een diensttijdgratificatie vindt niet plaats indien de ambtenaar voor zijn dienstvervulling reeds
      een gratificatie of uitkering heeft ontvangen, welke naar haar aard overeenkomt met de gratificatie volgens deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: '8.4'
    text: |-
      Indien de ambtenaar jubileert tijdens buitengewoon verlof dat hem is verleend, mede dan wel overwegend in algemeen
      belang, wordt op de datum van het ambtsjubileum geen diensttijdgratificatie toegekend. De toekenning van de
      gratificatie vindt plaats zodra de ambtenaar na beëindiging van het verlof zijn werkzaamheden heeft hervat, tenzij
      hij in de betrekking welke tijdens het verlof werd vervuld, een gratificatie of uitkering heeft ontvangen welke
      naar haar aard overeenkomt met de gratificatie volgens deze regeling.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: '8.5'
    text: 'Als diensttijd voor de toekenning van een diensttijdgratificatie geldt de tijd, doorgebracht:'
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: 8.5.a
    text: |-
      in een burgerlijke betrekking bij de Nederlandse overheid, waaronder mede begrepen de NV Nederlandse Spoorwegen
      (tot 24 december 1992) en de voormalige NV ‘Artillerie-Inrichtingen’;
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: 8.5.b
    text: |-
      in een betrekking (vóór 1 januari 1966) als bedoeld in artikel 4, eerste lid van de Pensioenwet 1922, een
      betrekking als bedoeld in artikel B2 van de Algemene burgerlijke pensioenwet of een betrekking als bedoeld in
      artikel B3 van evengenoemde wet, alsmede (vóór en na 1 januari 1966) in een betrekking als bedoeld in artikel U2
      van die wet;
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: 8.5.c
    text: |-
      in burgerlijke dienst bij de overheid in de landen Suriname (tot 25 november 1975), de Nederlandse Antillen en
      Aruba, bij de voormalige gouvernementen van Suriname, Curaçao en Nieuw-Guinea en (tot 27 december 1949) bij de
      voormalige Indische Pensioenfondsen;
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: 8.5.d
    text: |-
      in dienst bij het niet-openbaar onderwijs in de onder c genoemde landen en voormalige overzeese rijksdelen, voor
      zover zulks de ambtenaar onder de werkingssfeer van een overheidspensioenregeling bracht of zou hebben gebracht
      indien hij in vaste dienst was geweest;
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: 8.5.e
    text: |-
      tot en met 31 december 1954 in dienst van de Republiek Indonesië, voor zover die tijd door de
      [Garantiewet Burgerlijk Overheidspersoneel Indonesië][ref1] wordt bestreken;


      [ref1]: https://wetten.overheid.nl/BWBR0002060
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002060
  - number: 8.5.f
    text: |-
      in Nederlandse militaire dienst of daarmee voor de toepassing van het
      [Burgerlijk ambtenarenreglement defensie][ref1] gelijkgestelde, waaronder begrepen dienst bij het voormalig KNIL en
      de troepen in Suriname (tot 25 november 1975) en de Nederlandse Antillen en Aruba;


      [ref1]: https://wetten.overheid.nl/BWBR0006040
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006040
  - number: 8.5.g
    text: als volontair met een volledige dagtaak;
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: 8.5.h
    text: de tijd waarover rechtsherstel is verleend.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: '8.6'
    text: |-
      Als diensttijd in de zin van deze regeling wordt niet aangemerkt de diensttijd die niet in actieve dienst is
      doorgebracht wegens het bekleden van een politiek ambt.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: '8.7'
    text: |-
      Voorts komt als diensttijd niet in aanmerking de diensttijd die, zonder dat werkzaamheden zijn verricht, is
      doorgebracht buiten het genot van inkomsten uit de dienstbetrekking, behoudens voor zoveel het tijd betreft,
      gedurende welke de ambtenaar mede dan wel overwegend in het algemeen belang buitengewoon verlof heeft genoten.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: '8.8'
    text: |-
      Evenmin wordt als diensttijd aangemerkt fictieve diensttijd, onverminderd het gestelde in het vijfde lid, onderdeel
      h.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: '8.9'
    text: |-
      Diensttijd, gelijktijdig in meer dan één betrekking doorgebracht telt voor de vaststelling van de datum van het
      ambtsjubileum slechts eenmaal mee.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: '8.10'
    text: |-
      Voor de berekening van de gratificatie wordt onder bezoldiging verstaan: de bezoldiging, die voor de ambtenaar op
      de datum van het ambtsjubileum geldt, vermeerderd met de vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: '8.11'
    text: |-
      Indien de ambtenaar aanspraak heeft op een of meerdere toelage(n) genoemd in
      [hoofdstuk 3 van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref1], wordt dit bezoldigingsdeel
      vastgesteld op het bedrag dat de ambtenaar in de drie kalender-maanden voorafgaande aan zijn jubileum aan bedoelde
      toelagen gemiddeld per maand heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018191
        hoofdstuk: '3'
  - number: '8.12'
    text: |-
      Indien de ambtenaar op de datum van zijn ambtsjubileum geen aanspraak heeft op bezoldiging, omdat hem mede dan
      wel overwegend in het algemeen belang buitengewoon verlof zonder behoud van bezoldiging is verleend, wordt voor de
      berekening van zijn diensttijdgratificatie uitgegaan van de bezoldiging waarop hij aanspraak heeft op met moment
      van de toekenning.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: '8.13'
    text: |-
      Indien de ambtenaar, na een aantal jaren en maanden te hebben gewerkt in een voltijdaanstelling tegen de daarbij
      behorende volledige bezoldiging is gaan werken in een deeltijdaanstelling, wordt bij het bereiken van het
      vereiste aantal jaren van 12½, 25, 40 of 50 de gratificatie berekend naar het aantal jaren en maanden dat in een
      voltijdaanstelling en het aantal jaren en maanden dat in deeltijdaanstelling is gewerkt. Voor de berekening van de
      jaren en maanden gewerkt in een voltijdaanstelling wordt gerekend met de voltijdbezoldiging dat zou behoren bij de
      aanstelling op de datum van het ambtsjubileum. Voor de overige jaren en maanden dat in een deeltijdaanstelling is
      gewerkt wordt gerekend met de werkelijk geldende deeltijdbezoldiging op de datum van het ambtsjubileum.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel8
  - number: '9.1'
    text: |-
      De commandant kent aan de ambtenaar een proportionele diensttijdgratificatie toe, indien de ambtenaar wordt
      ontslagen met toepassing van één van de volgende artikelen uit het [Burgerlijk ambtenarenreglement defensie][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0006040
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006040
  - number: 9.1.a
    text: |-
      [artikel 114][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel114
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '114'
  - number: 9.1.b
    text: |-
      [artikel 116][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel116
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '116'
  - number: 9.1.c
    text: |-
      [artikel 121, eerste lid, onderdeel f of h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel121
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '121'
  - number: '9.2'
    text: |-
      De proportionele diensttijdgratificatie bedoeld in het eerste lid wordt uitsluitend toegekend indien de ambtenaar
      zonder dat ontslag binnen een periode van:
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel9
  - number: 9.2.a
    text: |-
      tweeëneenhalf jaar na de datum van ingang van dat ontslag een gratificatie wegens trouwe dienst bij het bereiken
      van een diensttijd van twaalfeneenhalf jaar zou zijn toegekend, danwel binnen een periode van:
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel9
  - number: 9.2.b
    text: |-
      vijf jaar na de datum van ingang van dat ontslag een gratificatie wegens trouwe dienst bij het bereiken van een
      diensttijd van vijfentwintig, veertig of vijftig jaar zou zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel9
  - number: '9.3'
    text: |-
      De commandant kent aan de nabestaanden van de ambtenaar, bedoeld in
      [artikel 127 van het Burgerlijk ambtenarenreglement defensie][ref1], een proportionele diensttijdgratificatie toe.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel127
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '127'
  - number: '9.4'
    text: |-
      De proportionele diensttijdgratificatie, bedoeld in het derde lid, wordt uitsluitend toegekend, indien de overleden
      ambtenaar is overleden binnen een periode van:
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel9
  - number: 9.4.a
    text: |-
      tweeëneenhalf jaar vóór de datum waarop hij aanspraak zou hebben gehad op een gratificatie wegens trouwe dienst bij
      het bereiken van een diensttijd van twaalfeneenhalf jaar, danwel binnen een periode van:
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel9
  - number: 9.4.b
    text: |-
      vijf jaar vóór de datum waarop hij aanspraak zou hebben gehad op een gratificatie wegens trouwe dienst bij het
      bereiken van een diensttijd van vijfentwintig, veertig of vijftig jaar.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel9
  - number: '9.5'
    text: |-
      De proportionele diensttijdgratificatie wordt vastgesteld op een evenredig deel van de gratificatie wegens trouwe
      dienst ingevolge [artikel 8][ref1], gemeten naar de verhouding van de daadwerkelijke diensttijd in jaren en maanden
      en de in dat artikel genoemde diensttijd in jaren en maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0039881#Artikel8
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0039881
        artikel: '8'
        hoofdstuk: '3'
  - number: '9.6'
    text: |-
      De loonheffing en inhoudingen, bedoeld in [paragraaf 5 van de Wet financiële voorzieningen privatisering ABP][ref1],
      die in voorkomend geval zijn verschuldigd over een proportionele diensttijdgratificatie die is afgeleid van een
      diensttijdgratificatie wegens vijfentwintig of veertig jaar trouwe dienst, als bedoeld in het tweede lid, onderdeel
      b, en in het vierde lid, onderdeel b, komen voor rekening van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007211
        paragraaf: '5'
  - number: '10'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel10
  - number: '11.1'
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder representatie: het op formele wijze ontvangen en bezoeken
      van zakenrelaties met het oogmerk de belangen van de Staat, het Ministerie van Defensie, een defensieonderdeel of
      een tot een defensieonderdeel behorende organisatie-eenheid te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel11
  - number: '11.2'
    text: |-
      De ambtenaar die een functie bekleedt waarvan voor de vervulling naar het oordeel van het hoofd defensieonderdeel
      voortdurende representatie is vereist, in verband waarmee hij is gehouden zelf het initiatief te nemen, heeft
      aanspraak op een maandelijkse tegemoetkoming in de daaraan verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel11
  - number: '11.3'
    text: |-
      De tegemoetkoming wordt toegekend door het hoofd defensieonderdeel en wordt gevonden door het in het zesde lid
      opgenomen basisbedrag te vermenigvuldigen met een door het hoofd defensieonderdeel toe te kennen aantal punten.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel11
  - number: '11.4'
    text: |-
      Het toe te kennen aantal punten wordt bepaald door de mate waarin representatie is vereist en is voor functies
      in Nederland niet hoger dan 100 punten en voor functies buiten Nederland en bij internationale organisaties in
      Nederland niet hoger dan 250 punten.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel11
  - number: '11.5'
    text: |-
      Het basisbedrag wordt afzonderlijk vastgesteld voor Nederland en voor de overige landen. Het basisbedrag voor de
      overige landen wordt verhoogd of verlaagd met een door de minister vast te stellen duurtecorrectie ter zake van het
      verschil in de kosten van levensonderhoud in het betreffende land ten opzichte van Nederland.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel11
  - number: '11.6'
    text: 'De basisbedragen zijn:'
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel11
  - number: 11.6.a
    text: 'voor Nederland: € 3,40;'
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel11
  - number: 11.6.b
    text: 'voor de overige landen: € 7,67.'
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel11
  - number: '12.1'
    text: 'De ambtenaar die een receptie houdt ter gelegenheid van:'
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel12
  - number: 12.1.a
    text: zijn pensionering of een daarmee overeenkomende wijze van dienstverlating;
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel12
  - number: 12.1.b
    text: het aan hem toekennen van een diensttijdgratificatie;
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel12
  - number: 12.1.c
    text: |-
      zijn afscheid in verband met verandering van werkkring, waarbij als voorwaarde geldt dat hij ten minste 12½
      achtereenvolgende jaren bij het ministerie, een onderdeel, eenheid, kazerne of dienst werkzaam is geweest, heeft
      aanspraak op een éénmalige tegemoetkoming in de kosten, tot een maximumbedrag van € 123,89.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel12
  - number: '12.2'
    text: |-
      De ambtenaar die met toestemming van het hoofd defensieonderdeel voor de gelegenheden bedoeld in het eerste lid,
      functionarissen uitnodigt die werkzaam zijn buiten het eigen defensieonderdeel waarmee hij, uit hoofde van zijn
      functie, veelvuldige en intensieve zakelijke contacten onderhoudt, kan aanspraak maken op een tegemoetkoming in de
      daaraan verbonden kosten tot een maximumbedrag van € 8,44 per genodigde.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel12
  - number: '13.1'
    text: |-
      In dit artikel wordt verstaan onder: - *een maaltijd:* een eenvoudige warme maaltijd, bestaande uit ten minste
      een hoofdschotel;
        - *overwerk:* hetgeen daaronder wordt verstaan in [artikel 49 van het IBBAD][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel49
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '49'
  - number: '13.2'
    text: |-
      Indien de dagelijkse werktijd van de ambtenaar op de dag waarop overwerk wordt verricht, met ten minste twee
      overwerkuren wordt verlengd en het dienstbelang naar het oordeel van de commandant dientengevolge niet toelaat,
      dat hij zijn maaltijd op de hiervoor bestemde tijd op de voor hem gebruikelijke plaats nuttigt, gelden de in de
      volgende leden vermelde regels.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel13
  - number: '13.3'
    text: |-
      Aan de ambtenaar wordt zo mogelijk een maaltijd voor rekening van Defensie verstrekt. Indien een voorziening als
      vorenbedoeld niet mogelijk is ontvangt de ambtenaar:
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel13
  - number: 13.3.a
    text: |-
      die aantoonbaar een maaltijd in een daarvoor bestemde gelegenheid buiten Defensie
      heeft genuttigd en betaald een vergoeding gelijk aan de dinercomponent als bedoeld in
      [artikel 12, vierde lid, van de Regeling dienstreizen defensie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039787#Artikel12
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0039787
        artikel: '12'
  - number: 13.3.b
    text: |-
      die niet aantoonbaar een maaltijd in een daarvoor bestemde gelegenheid buiten Defensie heeft
      genuttigd en betaald, een vergoeding gelijk aan de helft van de dinercomponent als bedoeld in
      [artikel 12, vierde lid, van de Regeling dienstreizen defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039787#Artikel12
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0039787
        artikel: '12'
  - number: '13.4'
    text: |-
      Deze regeling is niet van toepassing voor zover een andere regeling in een vergoeding van de in deze regeling
      bedoelde kosten voorziet.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel13
  - number: '14.1'
    text: |-
      De ambtenaar heeft aanspraak op een gehele of gedeeltelijke vergoeding van de kosten verbonden aan het bezit
      dan wel het gebruik van een privé-telefoonaansluiting voor dienstdoeleinden indien naar het oordeel van de
      commandant de ambtenaar aannemelijk heeft gemaakt dat de telefoonaansluiting voor meer dan 10% wordt gebruikt voor
      dienstdoeleinden.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel14
  - number: '14.2'
    text: |-
      De vergoeding bedraagt 100% van de door de ambtenaar verschuldigde aansluitings- gespreks- en abonnementskosten
      indien de ambtenaar op het huisadres niet beschikt over een vaste telefoonaansluiting en naar het oordeel van de
      commandant over een dergelijke aansluiting dient te beschikken voor het benaderen van geautomatiseerde systemen
      en het voeren van diensttelefoongesprekken. Deze telefoonaansluiting mag uitsluitend voor dienstdoeleinden worden
      gebruikt. Vergoeding van de kosten vindt slechts plaats indien de vaste aansluiting is aangelegd na toestemming van
      de commandant.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel14
  - number: '14.3'
    text: |-
      Indien de ambtenaar op het huisadres reeds beschikt over een vaste telefoonaansluiting en naar het oordeel van
      de commandant een dergelijke aansluiting dient te benutten voor het benaderen van geautomatiseerde systemen dan
      wel het voeren van diensttelefoongesprekken kan maandelijks een percentage van de verschuldigde abonnements- en
      gesprekskosten worden vergoed. Dit percentage bedraagt:
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel14
  - number: 14.3.1°
    text: |-
      25% bij incidenteel gebruik (enkele uitgaande diensttelefoongesprekken per week) van de privé-telefoonaansluiting
      voor dienstdoeleinden;
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel14
  - number: 14.3.2°
    text: |-
      50% bij regelmatig gebruik (enkele uitgaande diensttelefoongesprekken per dag) van de privé-telefoonaansluiting
      voor dienstdoeleinden.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel14
  - number: 14b.1
    text: |-
      In dit artikel wordt verstaan onder: - *inzet:* een aaneengesloten periode van tenminste één maand van operationele
      inzet dan wel varen, vliegen of oefenen;
        - *zorgplicht:* de duurzame verzorging en opvoeding van een kind als eigen kind, waarbij de ambtenaar volgens de
      gemeentelijke basisadministratie op hetzelfde adres woont als dat kind;
        - *voorzieningen:* maatwerkoplossingen voor knelpunten in de gezinssituatie.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel14b
  - number: 14b.2
    text: |-
      De ambtenaar met een zorgplicht kan een aanvraag indienen bij de commandant voor financiële bijstand bij het
      treffen van voorzieningen tijdens inzet, mits het kind waarvoor de zorgplicht geldt de leeftijd van vijf jaar nog
      niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel14b
  - number: 14b.3
    text: |-
      De ambtenaar met een zorgplicht heeft aanspraak op een tegemoetkoming in de noodzakelijke extra kosten voor
      het treffen van voorzieningen, als bedoeld in het tweede lid, voor zover hiervoor niet al op basis van de
      [Wet kinderopvang][ref1] een tegemoetkoming wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: 14b.4
    text: |-
      Het maximumbedrag voor de tegemoetkoming, genoemd in het derde lid, bedraagt per maand een bedrag dat berekend
      wordt als het product van het aantal kinderen dat de leeftijd van vijf jaar nog niet heeft bereikt en het
      bedrag van € 150 netto. Het genoemde bedrag geldt na aftrek van de loonheffing en inhoudingen, bedoeld in
      [paragraaf 5 van de Wet financiële voorzieningen privatisering ABP][ref1], die in voorkomend geval zijn
      verschuldigd en voor rekening van Defensie komen.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0007211
        paragraaf: '5'
  - number: 14b.5
    text: |-
      Dit artikel is van overeenkomstige toepassing op de ambtenaar, die is belast met mantelzorg voor zijn echtgenote of
      echtgenoot alsmede diegene die hieronder volgens [artikel 4 van het Burgerlijk ambtenarenreglement defensie][ref1]
      wordt verstaan of de kinderen waarvoor de ambtenaar duurzaam de verzorging en opvoeding op zich heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel4
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '4'
  - number: 14b.6
    text: De commandant kan de ambtenaar vragen bewijsstukken van de te maken of gemaakte kosten te overleggen.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel14b
  - number: '15'
    text: |-
      De berekeningsbasis als bedoeld in [artikel 61, eerste lid, van het IBBAD][ref1] wordt indien het een woning
      betreft die in het buitenland is gelegen, verhoogd met de duurtecorrectie – voor zover deze positief is –, berekend
      over het voor de ambtenaar geldende standaard netto Nederland in de zin van het Voorzieningenstelsel buitenland
      defensiepersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel61
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '61'
  - number: '16.1'
    text: |-
      Het maximum van het verschuldigde bedrag voor het vanwege Defensie verstrekte gebruik van kost, bedoeld in
      [artikel 60, eerste lid, van het IBBAD][ref1], wordt gesteld op € 165,34 per maand.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel60
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '60'
  - number: '16.2'
    text: |-
      Het maximum van het verschuldigde bedrag voor het vanwege Defensie verstrekte gebruik van inwoning, bedoeld in
      [artikel 60, eerste lid, van het IBBAD][ref1], wordt gesteld op € 321,31 per maand.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel60
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '60'
  - number: '16.3'
    text: |-
      Het verschuldigde bedrag voor kost voor de ambtenaar, bedoeld in [artikel 60, tweede lid, van het IBBAD][ref1],
      wordt gesteld op € 143,52 per maand.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel60
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '60'
  - number: '16.4'
    text: |-
      Het verschuldigde bedrag voor inwoning voor de ambtenaar, bedoeld in [artikel 60, tweede lid, van het IBBAD][ref1],
      wordt gesteld op € 219,14 per maand.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel60
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '60'
  - number: '16.5'
    text: |-
      Bij geoorloofde afwezigheid wordt het bedrag dat voor het genot van kost verschuldigd zou zijn voor elke dag dat
      dit emolument niet wordt genoten, verminderd met € 4,78 per dag.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel16
  - number: '17.1'
    text: |-
      Het maximum van het verschuldigde bedrag voor het vanwege Defensie verstrekte gebruik van verwarming van de woning,
      bedoeld in [artikel 61, eerste lid, onderdeel b, van het IBBAD][ref1], wordt gesteld op € 188,97.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel61
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '61'
  - number: '17.2'
    text: |-
      Het maximum van het verschuldigde bedrag voor het vanwege Defensie verstrekte gebruik van energie voor
      kookdoeleinden, bedoeld in [artikel 61, eerste lid, onderdeel c, van het IBBAD][ref1], wordt gesteld op € 60,61.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel61
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '61'
  - number: '17.3'
    text: |-
      Het maximum van het verschuldigde bedrag voor het vanwege Defensie verstrekte gebruik van elektrische energie,
      bedoeld in [artikel 61, eerste lid, onderdeel d, van het IBBAD][ref1], wordt gesteld op € 28,20.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel61
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '61'
  - number: '17.4'
    text: |-
      Het maximum van het verschuldigde bedrag voor het vanwege Defensie verstrekte gebruik van leidingwater, bedoeld in
      [artikel 61, eerste lid, onderdeel e, van het IBBAD][ref1], wordt gesteld op € 23,39.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel61
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '61'
  - number: '18.1'
    text: |-
      In dit artikel wordt verstaan onder: - *ambtenaar:* de ambtenaar van wie de arbeidsduur van zijn rooster met
      toepassing van [artikel 30c van het Burgerlijk ambtenarenreglement defensie][ref1] is teruggebracht;
        - *inkomen:* het salaris van de ambtenaar na de inhouding ter grootte van 5% of 10% op basis van
      [artikel 30c van het Burgerlijk ambtenarenreglement defensie][ref2];
        - *deeltijdsalaris:* het salaris bedoeld in
      [artikel 12, eerste lid, van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref3], dat voor de ambtenaar zou
      zijn vastgesteld indien voor hem de teruggebrachte arbeidsduur als deeltijdaanstelling zou gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel30c
      [ref3]: https://wetten.overheid.nl/BWBR0018191#Artikel12
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel18
