        bwb_id: BWBR0018191
        artikel: '12'
  - number: '18.2'
    text: |-
      Het inkomen wordt verminderd met een bedrag ter hoogte van de neveninkomsten die de ambtenaar geniet of gaat
      genieten uit of in verband met arbeid of bedrijf, ter hand genomen met ingang van of na de dag waarop de
      arbeidsduur van zijn rooster is teruggebracht.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel18
  - number: '18.3'
    text: |-
      Wanneer de ambtenaar arbeid of bedrijf ter hand heeft genomen vóór de dag waarop de arbeidsduur van zijn rooster
      is teruggebracht en hij met ingang van of na die dag daaruit neveninkomsten of meer neveninkomsten gaat genieten,
      is het tweede lid van toepassing, tenzij de ambtenaar aannemelijk maakt dat die neveninkomsten of vermeerdering
      van neveninkomsten of een gedeelte daarvan geen verband houden met een verhoogde werkzaamheid, in welk geval die
      inkomsten, die meerdere inkomsten of dat gedeelte daarvan niet in aanmerking worden genomen voor de toepassing van
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel18
  - number: '18.4'
    text: |-
      Met arbeid of bedrijf ter hand genomen met ingang van of na de dag waarop de arbeidsduur van het rooster van de
      ambtenaar is teruggebracht, wordt gelijkgesteld arbeid of bedrijf, aangevangen tijdens non-activiteit, vakantie of
      ander verlof of verhindering tot dienstverrichting wegens ziekte, onmiddellijk voorafgaande aan het terugbrengen
      van de arbeidsduur van het rooster.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel18
  - number: '18.5'
    text: |-
      Het bedrag van de in het tweede en derde lid bedoelde neveninkomsten, die op een maand betrekking hebben of aan
      een maand kunnen worden toegerekend, wordt in mindering gebracht op het inkomen over die maand. De vermindering
      bedraagt ten hoogste het verschil tussen het inkomen en het deeltijdsalaris.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel18
  - number: '18.6'
    text: |-
      Neveninkomsten uit arbeid of bedrijf waarvoor reeds in verband met verleend buitengewoon verlof een inhouding op
      de bezoldiging van de ambtenaar plaatsvindt of een verlaging van de bezoldiging van de ambtenaar geldt, dan wel ter
      zake waarvan de ambtenaar een storting in ’s Rijks kas verricht, zijn geen neveninkomsten uit arbeid of bedrijf in
      de zin van het tweede en derde lid tot het bedrag van die inhouding, verlaging of storting.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel18
  - number: '18.7'
    text: |-
      De ambtenaar doet aan de commandant zo mogelijk vooraf opgave van de neveninkomsten of van de vermeerdering van
      neveninkomsten als bedoeld in het tweede en derde lid, en van de wijzigingen daarin.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel18
  - number: '18.8'
    text: |-
      Indien de neveninkomsten slechts over een langere termijn kunnen worden berekend, geschiedt de opgave
      dienovereenkomstig en wordt het inkomen met een voorlopig bedrag verminderd. De vermindering overeenkomstig het
      tweede tot en met het zesde lid vindt vervolgens plaats aan het einde of zo spoedig mogelijk na afloop van die
      termijn.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel18
  - number: '18.9'
    text: De commandant kan nadere voorschriften geven met betrekking tot de wijze van opgave door de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel18
  - number: '18.10'
    text: |-
      Indien de ambtenaar de gegevens die noodzakelijk zijn voor het in mindering brengen van neveninkomsten op het
      inkomen niet, niet volledig, of onjuist verstrekt kan de commandant een vermindering toepassen op het inkomen van
      ten hoogste het verschil tussen het inkomen en het deeltijdsalaris.
    url: https://wetten.overheid.nl/BWBR0039881/2025-12-25#Artikel18
  - number: '18.11'
    text: |-
      De ambtenaar wordt door het aanvaarden van het terugbrengen van de arbeidsduur met toepassing van
      [artikel 30c van het Burgerlijk ambtenarenreglement defensie][ref1] geacht er in toe te stemmen dat allen die
      daarvoor naar het oordeel van de commandant in aanmerking komen omtrent zijn omstandigheden alle inlichtingen geven
      welke voor de uitvoering van dit artikel noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30c
