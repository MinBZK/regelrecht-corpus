  - number: '51'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen regelen worden gesteld ter bevordering van een goede uitvoering van
      deze wet.

      2 Een gedraging in strijd met een dergelijke regel is een strafbaar feit, voorzover uitdrukkelijk als zodanig
      aangeduid.
    url: https://wetten.overheid.nl/BWBR0002252/2019-01-01#Artikel51
  - number: '53'
    text: |-
      1

      2 De rechten, lasten, verplichtingen en bezittingen van de Stichting "Voedselvoorziening Import Bureau" gaan bij
      haar opheffing over op het voedselvoorzieningsin- en verkoopbureau.
    url: https://wetten.overheid.nl/BWBR0002252/2019-01-01#Artikel53
  - number: '54'
    text: |-
      1 De Landbouw-Crisiswet 1933 wordt ingetrokken.

      2 Het Voedselvoorzieningsbesluit en alle op grond van, ter uitvoering van of krachtens dit besluit uitgevaardigde
      voorschriften vervallen.
    url: https://wetten.overheid.nl/BWBR0002252/2019-01-01#Artikel54
  - number: '56'
    text: |-
      1 Deze wet kan worden aangehaald als "Landbouwwet".

      2 Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002252/2019-01-01#Artikel56
