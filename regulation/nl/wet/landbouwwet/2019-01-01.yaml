  - number: '29'
    text: |-
      Degene, die ingevolge een voorschrift, krachtens een bepaling van dit Hoofdstuk vastgesteld, in het bezit dient
      te zijn van een of meer bescheiden, is verplicht die bescheiden steeds bij zich te hebben bij gedragingen met
      betrekking tot welke het bezit van zodanige bescheiden verplicht is gesteld. Hij is verplicht deze bescheiden
      op eerste vordering te tonen of tegen bewijs van ontvangst af te geven aan de ambtenaren, die zijn belast met de
      opsporing van overtredingen van voorschriften, gesteld bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0002252/2019-01-01#Artikel29
  - number: '30'
    text: |-
      Onze Minister brengt ieder kwartaal verslag uit aan de Staten-Generaal over de toepassing van de bepalingen van
      dit Hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0002252/2019-01-01#Artikel30
  - number: '47'
    text: |-
      Het is verboden terzake van een aanvrage om een vergunning of een ontheffing onjuiste of onvolledige gegevens te
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0002252/2019-01-01#Artikel47
  - number: '48'
    text: |-
      Indien aan een vergunning of een ontheffing, krachtens de bepalingen van deze wet verleend, voorwaarden zijn
      verbonden, wordt degene, die de voorwaarden niet nakomt, in zoverre geacht zonder vergunning of ontheffing te
      handelen.
    url: https://wetten.overheid.nl/BWBR0002252/2019-01-01#Artikel48
  - number: 48a
    text: |-
      1 Onze Minister wijst in overeenstemming met Onze bij algemene maatregel van bestuur aangewezen Ministers
      ambtenaren aan, belast met het toezicht op de naleving van de bij of krachtens deze wet gestelde regelen.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002252/2019-01-01#Artikel48a
  - number: '49'
    text: |-
      1 Hetgeen krachtens [artikel 13][ref1] is verschuldigd, kan door de Staat bij dwangbevel worden ingevorderd.

      2 Verzet tegen de executie geschiedt door het instellen van een vordering tegen de Staat bij de burgerlijke rechter
      van de rechtbank van het arrondissement, binnen hetwelk zijn woonplaats is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
