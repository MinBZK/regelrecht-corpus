  - number: '18'
    text: |-
      1 Ter verwezenlijking van de in het [eerste lid van artikel 13][ref1] vermelde doeleinden kunnen bij of krachtens
      algemene maatregel van bestuur regelen worden vastgesteld ten aanzien van de in het tweede lid , onder *a*, van dat
      artikel genoemde gedragingen.

      2 Een algemene maatregel van bestuur als bedoeld in het eerste lid, die strekt ter verwezenlijking van de in het
      [eerste lid van artikel 13, onder a][ref2], vermelde doeleinden wordt slechts vastgesteld, indien zulks naar Ons
      oordeel noodzakelijk is in verband met een aan [artikel 13][ref3], [15][ref4] of [17][ref5] gegeven toepassing.

      3

      4 Tegelijk met de afkondiging in het *Staatsblad* van een algemene maatregel van bestuur, als bedoeld in het eerste
      lid, zendt Onze Minister een toelichting op het besluit aan de Staten-Generaal.


