  - number: '22'
    text: |-
      1 Ter verwezenlijking van de in [het eerste lid van artikel 13][ref1] vermelde doeleinden kan Onze Minister bij in
      de *Staatscourant* bekend te maken regeling de verplichting opleggen tot het ter beschikking houden van produkten
      voor of het inleveren daarvan bij een door hem aan te wijzen natuurlijke of rechtspersoon.

      2 Een verplichting, als bedoeld in het eerste lid, die strekt ter verwezenlijking van de in het
      [eerste lid van artikel 13, onder a][ref2], vermelde doeleinden, wordt slechts opgelegd, indien zulks naar het
      oordeel van Onze Minister noodzakelijk is in verband met een aan artikel 13, [15][ref3], [17][ref4], [18][ref5] of
      [19][ref6] gegeven toepassing.

      3 Voor de ingeleverde produkten wordt door Onze Minister een redelijke vergoeding uitbetaald.

      4 Onze Minister kan een geldelijke tegemoetkoming verlenen in de kosten, vallende op het ter beschikking houden
      van produkten.


