        artikel: 22a
        hoofdstuk: III
        paragraaf: '1'
  - number: 23a
    text: |-
      Ten aanzien van beschikkingen, gegeven krachtens regelen als bedoeld in [de artikelen 18, eerste lid][ref1],
      [19, eerste lid][ref2], en [20, eerste lid][ref3], blijven de [artikelen 4:7][ref4] en
      [4:8 van de Algemene wet bestuursrecht][ref5] buiten toepassing, indien de gestelde regelen strekken tot
      verwezenlijking van de in [artikel 13, eerste lid, onder ][ref6], vermelde doeleinden.


