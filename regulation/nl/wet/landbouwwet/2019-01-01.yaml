  - number: '20'
    text: |-
      1 Ter verwezenlijking van de in [het eerste lid van artikel 13][ref1] vermelde doeleinden kan Onze Minister bij in
      de *Staatscourant* bekend te maken regeling regelen vaststellen met betrekking tot het ge- en verbruik van grond-
      en hulpstoffen en verpakkingsmateriaal voor produkten, alsmede met betrekking tot het voorhanden- en in voorraad
      hebben, gebruiken en vervoeren van fust en van machines, werktuigen en gereedschappen - alsmede onderdelen daarvan
        - welke worden gebezigd voor het broeden en bij het bereiden en vervaardigen van produkten.

      2 De in het eerste lid bedoelde regelen, die strekken ter verwezenlijking van de in het eerste lid van
      [artikel 13, onder a][ref2], vermelde doeleinden, worden slechts vastgesteld, indien zulks naar het oordeel van
      Onze Minister noodzakelijk is in verband met een aan [artikel 18][ref3] of [19][ref4] gegeven toepassing.


