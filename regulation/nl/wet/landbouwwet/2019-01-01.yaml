  - number: '15'
    text: |-
      Ter verwezenlijking van de in [het eerste lid van artikel 13][ref1] vermelde doeleinden kan Onze Minister bij in
      de *Staatscourant* bekend te maken regeling regelen vaststellen ten aanzien van het verstrekken van een subsidie
      of andere geldelijke bijdrage aan producenten of groepen van producenten van en aan handelaren of groepen van
      handelaren in produkten.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
    url: https://wetten.overheid.nl/BWBR0002252/2019-01-01#Artikel15
