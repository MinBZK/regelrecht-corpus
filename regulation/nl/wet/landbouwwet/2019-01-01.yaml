preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen vast te stellen om de voortbrenging, de
    afzet en een redelijke prijsvorming van voortbrengselen van de landbouw en de visserij te bevorderen en in verband
    daarmede ten behoeve van de afnemers van produkten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002252/2019-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bepaalde bij of krachtens deze wet wordt verstaan onder:

      *Onze Minister:* Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

      *landbouw:* akkerbouw, weidebouw, veehouderij, pluimveehouderij, tuinbouw - daaronder begrepen fruitteelt en het
      kweken van bomen, bloemen en bloembollen - teelt van griendhout en elke andere vorm van bodemcultuur hier te lande
      met uitzondering van bosbouw;

      *produkten:*

      a. alle voortbrengselen, welke, al dan niet na be- of verwerking, kunnen dienen als voedsel voor mens of dier,
      alsmede de bij be- of verwerking van die voortbrengselen verkregen derivaten en afvallen;

      b. de niet reeds onder *a* begrepen voortbrengselen van de landbouw.

      2 Voor de toepassing van het bepaalde bij of krachtens deze wet wordt mede verstaan onder:

      *handelaren:* tussenpersonen;

      *visserij:* de mosselteelt, de oesterteelt en de viskwekerij.
    url: https://wetten.overheid.nl/BWBR0002252/2019-01-01#Artikel1
  - number: '13'
    text: |-
      1 Onze Minister kan bij in de *Staatscourant* bekend te maken regeling de verplichting opleggen tot het betalen
      van een geldsom terzake van een of meer der in [het tweede lid van dit artikel][ref1] genoemde gedragingen. Een
      zodanige regeling wordt slechts vastgesteld:

      a. ter bevordering van de voortbrenging, de afzet en een redelijke prijsvorming van voortbrengselen van de landbouw
      en de visserij en in verband daarmede ten behoeve van de afnemers van produkten;

      b. ter uitvoering van verordeningen, richtlijnen, beschikkingen en aanbevelingen van de Europese Economische
      Gemeenschap, voorzover deze betrekking hebben op het gemeenschappelijk landbouwbeleid, voorzien in
      [de tweede titel van het tweede deel][ref2] van het verdrag tot oprichting van die Gemeenschap.

      2 De in het eerste lid bedoelde gedragingen zijn:

      a. het telen, kweken, fokken, vangen en broeden van produkten;

      b. het bereiden, vervaardigen, oogsten, voorhanden en in voorraad hebben, bewaren, opslaan, be- en verwerken, ge-
      en verbruiken, vervoederen, slachten, vervoeren, aanvoeren, veilen, ontvangen, afleveren, te koop aanbieden, kopen
      en vervreemden van produkten.

      3 Onze Minister kan in door hem te bepalen gevallen of groepen van gevallen tot gehele of gedeeltelijke restitutie
      overgaan van hetgeen ingevolge het bepaalde krachtens het eerste lid is betaald en gehele of gedeeltelijke
      ontheffing verlenen van een krachtens het eerste lid opgelegde verplichting tot het betalen van een geldsom.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel13
    url: https://wetten.overheid.nl/BWBR0002252/2019-01-01#Artikel13
