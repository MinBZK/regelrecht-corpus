  - number: 22a
    text: |-
      1 Onze Minister kan een vergoeding van kosten heffen overeenkomstig een door hem vastgesteld tarief ter zake van:

      a. de behandeling van een aanvraag om een krachtens deze wet voorgeschreven vergunning, toelating, aanwijzing,
      erkenning of registratie danwel een aanvraag tot wijziging daarvan;

      b. de instandhouding van de krachtens deze wet verleende vergunning, toelating, aanwijzing, erkenning of
      registratie.

      2 Onverminderd [artikel 13, eerste lid][ref1], kan Onze Minister bij of krachtens algemene maatregel van bestuur
      een vergoeding van kosten heffen overeenkomstig een door hem vastgesteld tarief ter zake van bij die maatregel
      benoemde onderzoeken of verrichtingen met betrekking tot producten.

      3 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de betaling van de vergoeding, bedoeld
      in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
    url: https://wetten.overheid.nl/BWBR0002252/2019-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: 22b
    text: |-
      Een tarief als bedoeld in [artikel 22a, eerste en tweede lid][ref1], wordt zodanig vastgesteld dat de geraamde
      baten niet uitgaan boven de geraamde kosten die in een rechtstreeks verband staan met de werkzaamheden waarvoor
      het tarief wordt opgelegd, onverminderd de daaromtrent bij besluit krachtens het [Verdrag tot oprichting van de
      Europese Gemeenschap](onbekend) vastgestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel22a
    url: https://wetten.overheid.nl/BWBR0002252/2019-01-01#Artikel22b
    references:
