  - number: '24.1'
    text: |-
      Onze Minister kan aan degenen, die in de landbouw hun hoofdbestaan of een gedeelte van hun bestaan vinden of plegen
      te vinden, beschrijvingsbiljetten uitreiken of zenden, bestemd tot het doen van opgave van de landbouwkundige en
      technische gegevens van hun onderneming.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel24
  - number: '24.2'
    text: |-
      Degene, aan wie een beschrijvingsbiljet is uitgereikt of gezonden, is verplicht de daarin gestelde vragen
      duidelijk, zonder voorbehoud en naar waarheid te beantwoorden en het aldus ingevulde biljet ondertekend binnen de
      daartoe door Onze Minister vastgestelde termijn in te leveren.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel24
  - number: '25.1'
    text: |-
      De tijdvakken, waarin of het tijdstip, waarop een landbouwtelling plaats heeft, zomede het model van het
      beschrijvingsbiljet worden door Onze Minister vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel25
  - number: '25.2'
    text: Onze Minister kan nadere regelen vaststellen met betrekking tot de uitvoering van de landbouwtelling.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel25
  - number: '25.3'
    text: Regelingen, als bedoeld in de voorgaande leden, worden bekend gemaakt in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel25
  - number: '26'
    text: |-
      Indien krachtens enige bepaling van deze wet regelen zijn vastgesteld ten aanzien van het voorzien zijn van
      produkten van merken of kentekenen dan wel het voorzien zijn van produkten van zodanige merken of kentekenen als
      vereiste wordt gesteld voor de bevoegdheid tot enige gedraging met betrekking tot die produkten, kan Onze Minister
      bij in de *Staatscourant* bekend te maken regeling regelen vaststellen ten aanzien van het vervaardigen, vervoeren,
      te koop aanbieden, verkopen, voorhanden en in voorraad hebben, afleveren en gebruiken van zodanige merken of
      kentekenen en van stempels en andere werktuigen, waarmede de merken en kentekenen kunnen worden vervaardigd of
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel26
  - number: '27'
    text: |-
      Onze Minister kan aan producenten van en aan handelaren in produkten de verplichting opleggen, aan door hem
      aangewezen gemachtigden desgevraagd binnen de daarvoor gestelde termijn duidelijk, zonder voorbehoud en naar
      waarheid de inlichtingen met betrekking tot hun onderneming te verstrekken, die naar zijn oordeel nodig zijn ter
      voorbereiding of uitvoering van enige krachtens deze wet te nemen of genomen maatregel.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel27
  - number: '28'
    text: |-
      Bij of krachtens algemene maatregel van bestuur, als bedoeld in artikel 18, en bij een regeling krachtens
      [de artikelen 13][ref1], [15][ref2], [17][ref3], [19][ref4], [20][ref5], [21][ref6] en [22][ref7] kan worden
      bepaald, dat tot een bepaalde groep of tot bepaalde groepen behorende producenten van of handelaren in produkten
      verplicht zijn, van alles wat hun onderneming betreft op zodanige wijze aantekening te houden, dat daaruit te allen
      tijde de produktie, de voorraad en de ontvangen, be- of verwerkte en afgeleverde hoeveelheden van enig produkt,
      alsmede de op een en ander betrekking hebbende financiële gegevens kunnen worden gekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002252#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0002252#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0002252#Artikel20
      [ref6]: https://wetten.overheid.nl/BWBR0002252#Artikel21
      [ref7]: https://wetten.overheid.nl/BWBR0002252#Artikel22
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel28
