  - number: '29'
    text: |-
      Degene, die ingevolge een voorschrift, krachtens een bepaling van dit Hoofdstuk vastgesteld, in het bezit dient
      te zijn van een of meer bescheiden, is verplicht die bescheiden steeds bij zich te hebben bij gedragingen met
      betrekking tot welke het bezit van zodanige bescheiden verplicht is gesteld. Hij is verplicht deze bescheiden
      op eerste vordering te tonen of tegen bewijs van ontvangst af te geven aan de ambtenaren, die zijn belast met de
      opsporing van overtredingen van voorschriften, gesteld bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel29
  - number: '30'
    text: |-
      Onze Minister brengt ieder kwartaal verslag uit aan de Staten-Generaal over de toepassing van de bepalingen van
      dit Hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel30
  - number: '47'
    text: |-
      Het is verboden terzake van een aanvrage om een vergunning of een ontheffing onjuiste of onvolledige gegevens te
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel47
  - number: '48'
    text: |-
      Indien aan een vergunning of een ontheffing, krachtens de bepalingen van deze wet verleend, voorwaarden zijn
      verbonden, wordt degene, die de voorwaarden niet nakomt, in zoverre geacht zonder vergunning of ontheffing te
      handelen.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel48
  - number: 48a.1
    text: |-
      Onze Minister wijst in overeenstemming met Onze bij algemene maatregel van bestuur aangewezen Ministers ambtenaren
      aan, belast met het toezicht op de naleving van de bij of krachtens deze wet gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel48a
  - number: 48a.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel48a
  - number: '49.1'
    text: |-
      Hetgeen krachtens de [artikelen 13][ref1] en [14][ref2] is verschuldigd, kan door de Staat, onderscheidenlijk door
      de voorzitter van het betrokken bedrijfslichaam of samenwerkingslichaam bij dwangbevel worden ingevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel14
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
  - number: '49.2'
    text: |-
      Verzet tegen de executie geschiedt door dagvaarding van de Staat, onderscheidenlijk het betrokken productschap,
      bedrijfschap of samenwerkingslichaam voor de rechtbank van het arrondissement, binnen hetwelk zijn woonplaats is
      gelegen.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel49
  - number: '51.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld ter bevordering van een goede uitvoering van deze
      wet.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel51
  - number: '51.2'
    text: |-
      Een gedraging in strijd met een dergelijke regel is een strafbaar feit, voorzover uitdrukkelijk als zodanig
      aangeduid.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel51
  - number: '53.2'
    text: |-
      De rechten, lasten, verplichtingen en bezittingen van de Stichting "Voedselvoorziening Import Bureau" gaan bij haar
      opheffing over op het voedselvoorzieningsin- en verkoopbureau.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel53
  - number: '54.1'
    text: De Landbouw-Crisiswet 1933 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel54
  - number: '54.2'
    text: |-
      Het Voedselvoorzieningsbesluit en alle op grond van, ter uitvoering van of krachtens dit besluit uitgevaardigde
      voorschriften vervallen.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel54
  - number: '56.1'
    text: Deze wet kan worden aangehaald als "Landbouwwet".
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel56
  - number: '56.2'
    text: Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel56
