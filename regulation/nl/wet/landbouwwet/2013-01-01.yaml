---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: landbouwwet
regulatory_layer: WET
publication_date: '2011-12-21'
valid_from: '2013-01-01'
bwb_id: BWBR0002252
url: https://wetten.overheid.nl/BWBR0002252/2013-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen vast te stellen om de voortbrenging, de
    afzet en een redelijke prijsvorming van voortbrengselen van de landbouw en de visserij te bevorderen en in verband
    daarmede ten behoeve van de afnemers van produkten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze wet wordt verstaan onder: *Onze Minister:* Onze Minister
      van Landbouw, Visserij en Voedselvoorziening; *landbouw:* akkerbouw, weidebouw, veehouderij, pluimveehouderij,
      tuinbouw - daaronder begrepen fruitteelt en het kweken van bomen, bloemen en bloembollen - teelt van griendhout en
      elke andere vorm van bodemcultuur hier te lande met uitzondering van bosbouw; *produkten:*
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel1
  - number: 1.1.a
    text: |-
      alle voortbrengselen, welke, al dan niet na be- of verwerking, kunnen dienen als voedsel voor mens of dier, alsmede
      de bij be- of verwerking van die voortbrengselen verkregen derivaten en afvallen;
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel1
  - number: 1.1.b
    text: |-
      de niet reeds [onder ][ref1] begrepen voortbrengselen van de landbouw;


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel1
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '1'
        hoofdstuk: I
  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze wet wordt mede verstaan onder: *handelaren:*
      tussenpersonen; *visserij:* de mosselteelt, de oesterteelt en de viskwekerij.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel1
  - number: '13.1'
    text: |-
      Onze Minister kan bij in de *Staatscourant* bekend te maken regeling de verplichting opleggen tot het betalen
      van een geldsom terzake van een of meer der in [het tweede lid van dit artikel][ref1] genoemde gedragingen. Een
      zodanige regeling wordt slechts vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: 13.1.a
    text: |-
      ter bevordering van de voortbrenging, de afzet en een redelijke prijsvorming van voortbrengselen van de landbouw en
      de visserij en in verband daarmede ten behoeve van de afnemers van produkten;
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel13
  - number: 13.1.b
    text: |-
      ter uitvoering van verordeningen, richtlijnen, beschikkingen en aanbevelingen van de Europese Economische
      Gemeenschap, voorzover deze betrekking hebben op het gemeenschappelijk landbouwbeleid, voorzien in
      [de tweede titel van het tweede deel][ref1] van het verdrag tot oprichting van die Gemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.2'
    text: 'De in het eerste lid bedoelde gedragingen zijn:'
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel13
  - number: 13.2.a
    text: het telen, kweken, fokken, vangen en broeden van produkten;
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel13
  - number: 13.2.b
    text: |-
      het bereiden, vervaardigen, oogsten, voorhanden en in voorraad hebben, bewaren, opslaan, be- en verwerken, ge- en
      verbruiken, vervoederen, slachten, vervoeren, aanvoeren, veilen, ontvangen, afleveren, te koop aanbieden, kopen en
      vervreemden van produkten.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel13
  - number: '13.3'
    text: |-
      Onze Minister kan in door hem te bepalen gevallen of groepen van gevallen tot gehele of gedeeltelijke restitutie
      overgaan van hetgeen ingevolge het bepaalde krachtens het eerste lid is betaald en gehele of gedeeltelijke
      ontheffing verlenen van een krachtens het eerste lid opgelegde verplichting tot het betalen van een geldsom.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel13
  - number: '14.1'
    text: |-
      Ter verwezenlijking van de in het eerste lid van [artikel 13, onder ][ref1], vermelde doeleinden kan het bestuur
      van het betrokken bedrijfslichaam bij verordening de verplichting opleggen tot het betalen van een geldsom ter zake
      van een of meer der in het tweede lid van dat artikel genoemde gedragingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '14.2'
    text: |-
      In een verordening, als bedoeld in het eerste lid, kan worden bepaald, dat een daarbij aangewezen orgaan van het
      produktschap of bedrijfschap kan besluiten in door hem te bepalen gevallen of groepen van gevallen tot gehele of
      gedeeltelijke restitutie over te gaan van hetgeen krachtens de verordening is betaald en gehele of gedeeltelijke
      ontheffing te verlenen van de bij de verordening opgelegde verplichting tot het betalen van een geldsom.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel14
  - number: '14.3'
    text: |-
      Een verordening, als bedoeld in het eerste lid, behoeft de goedkeuring van Onze Minister; bij de goedkeuring
      kan worden bepaald, dat krachtens die verordening vast te stellen nadere regelen en te nemen besluiten eveneens
      zodanige goedkeuring behoeven.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel14
  - number: '14.4'
    text: |-
      Een verordening, als bedoeld in het eerste lid, is verbindend voor een ieder voorzover daarin niet anders is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel14
  - number: '15'
    text: |-
      Ter verwezenlijking van de in [het eerste lid van artikel 13][ref1] vermelde doeleinden kan Onze Minister bij in
      de *Staatscourant* bekend te maken regeling regelen vaststellen ten aanzien van het verstrekken van een subsidie
      of andere geldelijke bijdrage aan producenten of groepen van producenten van en aan handelaren of groepen van
      handelaren in produkten.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '16'
    text: |-
      Ter verwezenlijking van de in [het eerste lid van artikel 13][ref1] vermelde doeleinden kan Onze Minister subsidies
      in de vorm van al dan niet rentedragende kredieten verstrekken aan openbare lichamen en andere instellingen,
      werkzaam op het gebied van de landbouw, de visserij en de voedselvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '17'
    text: |-
      Ter verwezenlijking van de in [het eerste lid van artikel 13][ref1] vermelde doeleinden kan Onze Minister bij in de
      *Staatscourant* bekend te maken regeling regelen vaststellen ten aanzien van de prijzen voor produkten.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '18.1'
    text: |-
      Ter verwezenlijking van de in het [eerste lid van artikel 13][ref1] vermelde doeleinden kunnen bij of krachtens
      algemene maatregel van bestuur regelen worden vastgesteld ten aanzien van de in het tweede lid , onder *a*, van dat
      artikel genoemde gedragingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '18.2'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid, die strekt ter verwezenlijking van de in het
      [eerste lid van artikel 13, onder a][ref1], vermelde doeleinden wordt slechts vastgesteld, indien zulks naar Ons
      oordeel noodzakelijk is in verband met een aan [artikel 13][ref2], [14][ref3], [15][ref4] of [17][ref5] gegeven
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002252#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0002252#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0002252#Artikel17
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002252
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002252
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0002252
        artikel: '17'
        hoofdstuk: III
        paragraaf: '1'
  - number: '18.4'
    text: |-
      Tegelijk met de afkondiging in het *Staatsblad* van een algemene maatregel van bestuur, als bedoeld in het eerste
      lid, zendt Onze Minister een toelichting op het besluit aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel18
  - number: '19.1'
    text: |-
      Ter verwezenlijking van de in het [eerste lid van artikel 13][ref1] vermelde doeleinden kan Onze Minister bij in de
      *Staatscourant* bekend te maken regeling regelen vaststellen ten aanzien van de in het tweede lid, onder b, van dat
      artikel genoemde gedragingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '19.2'
    text: |-
      De in het eerste lid bedoelde regelen, die strekken ter verwezenlijking van de in het
      [eerste lid van artikel 13, onder a][ref1], vermelde doeleinden, worden slechts vastgesteld, indien zulks naar
      het oordeel van Onze Minister noodzakelijk is in verband met een aan [artikel 13][ref2], [14][ref3], [15][ref4] of
      [17][ref5] gegeven toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002252#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0002252#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0002252#Artikel17
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002252
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002252
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0002252
        artikel: '17'
        hoofdstuk: III
        paragraaf: '1'
  - number: '20.1'
    text: |-
      Ter verwezenlijking van de in [het eerste lid van artikel 13][ref1] vermelde doeleinden kan Onze Minister bij in
      de *Staatscourant* bekend te maken regeling regelen vaststellen met betrekking tot het ge- en verbruik van grond-
      en hulpstoffen en verpakkingsmateriaal voor produkten, alsmede met betrekking tot het voorhanden- en in voorraad
      hebben, gebruiken en vervoeren van fust en van machines, werktuigen en gereedschappen - alsmede onderdelen daarvan
        - welke worden gebezigd voor het broeden en bij het bereiden en vervaardigen van produkten.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '20.2'
    text: |-
      De in het eerste lid bedoelde regelen, die strekken ter verwezenlijking van de in het eerste lid van
      [artikel 13, onder ][ref1], vermelde doeleinden, worden slechts vastgesteld, indien zulks naar het oordeel van Onze
      Minister noodzakelijk is in verband met een aan [artikel 18][ref2] of 19 gegeven toepassing of in verband met een
      verordening van een bedrijfslichaam. In het laatste geval worden de regelen slechts vastgesteld op verzoek van het
      betrokken produktschap of bedrijfschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel18
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '18'
        hoofdstuk: III
        paragraaf: '1'
  - number: '21'
    text: |-
      Onze Minister kan bij in de *Staatscourant* bekend te maken regeling regelen vaststellen inzake het verlenen van
      vergoedingen aan degenen, die door enige maatregel krachtens [de artikelen 18][ref1], [19][ref2] of [20][ref3] naar
      zijn oordeel ernstig economisch nadeel ondervinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002252#Artikel20
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '18'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '19'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002252
        artikel: '20'
        hoofdstuk: III
        paragraaf: '1'
  - number: '22.1'
    text: |-
      Ter verwezenlijking van de in [het eerste lid van artikel 13][ref1] vermelde doeleinden kan Onze Minister bij in de
      *Staatscourant* bekend te maken regeling de verplichting opleggen tot het ter beschikking houden van produkten voor
      of het inleveren daarvan bij een door hem aan te wijzen natuurlijke of rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: '22.2'
    text: |-
      Een verplichting, als bedoeld in het eerste lid, die strekt ter verwezenlijking van de in het
      [eerste lid van artikel 13, onder a][ref1], vermelde doeleinden, wordt slechts opgelegd, indien zulks naar het
      oordeel van Onze Minister noodzakelijk is in verband met een aan artikel 13, [14][ref2], [15][ref3], [17][ref4],
      [18][ref5] of [19][ref6] gegeven toepassing of in verband met een verordening van een bedrijfslichaam. In het
      laatste geval wordt een verplichting slechts opgelegd op verzoek van het betrokken bedrijfslichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0002252#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0002252#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0002252#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0002252#Artikel19
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002252
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002252
        artikel: '17'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0002252
        artikel: '18'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0002252
        artikel: '19'
        hoofdstuk: III
        paragraaf: '1'
  - number: '22.3'
    text: Voor de ingeleverde produkten wordt door Onze Minister een redelijke vergoeding uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel22
  - number: '22.4'
    text: |-
      Onze Minister kan een geldelijke tegemoetkoming verlenen in de kosten, vallende op het ter beschikking houden van
      produkten.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel22
  - number: 22a.1
    text: 'Onze Minister kan een vergoeding van kosten heffen overeenkomstig een door hem vastgesteld tarief ter zake van:'
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel22a
  - number: 22a.1.a
    text: |-
      de behandeling van een aanvraag om een krachtens deze wet voorgeschreven vergunning, toelating, aanwijzing,
      erkenning of registratie danwel een aanvraag tot wijziging daarvan;
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel22a
  - number: 22a.1.b
    text: de instandhouding van de krachtens deze wet verleende vergunning, toelating, aanwijzing, erkenning of registratie.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel22a
  - number: 22a.2
    text: |-
      Onverminderd [artikel 13, eerste lid][ref1], kan Onze Minister bij of krachtens algemene maatregel van bestuur een
      vergoeding van kosten heffen overeenkomstig een door hem vastgesteld tarief ter zake van bij die maatregel benoemde
      onderzoeken of verrichtingen met betrekking tot producten.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
  - number: 22a.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de betaling van de vergoeding, bedoeld in
      het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel22a
  - number: 22b
    text: |-
      Een tarief als bedoeld in [artikel 22a, eerste en tweede lid][ref1], wordt zodanig vastgesteld dat de geraamde
      baten niet uitgaan boven de geraamde kosten die in een rechtstreeks verband staan met de werkzaamheden waarvoor
      het tarief wordt opgelegd, onverminderd de daaromtrent bij besluit krachtens het [Verdrag tot oprichting van de
      Europese Gemeenschap](onbekend) vastgestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel22a
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: 22a
        hoofdstuk: III
        paragraaf: '1'
  - number: '23.1'
    text: |-
      Onze Minister kan bevoegdheden, welke hem ingevolge het bij of krachtens de [artikelen 13][ref1], [15][ref2],
      [17][ref3], [19][ref4], [20][ref5], [21][ref6], [22][ref7], [22a][ref8] en [26][ref9] dan wel bij of krachtens
      een algemene maatregel van bestuur, als bedoeld in [artikel 18][ref10] bepaalde toekomen, aan het bestuur van een
      bedrijfslichaam of een samenwerkingslichaam delegeren.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002252#Artikel17
