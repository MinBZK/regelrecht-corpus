  - number: '23.2'
    text: |-
      Verordeningen, vastgesteld met gebruikmaking van een overgedragen bevoegdheid behoeven de goedkeuring van Onze
      Minister. Krachtens de verordening vastgestelde genomen besluiten behoeven, voorzover dit bij de overdracht,
      bedoeld in het eerste lid, is bepaald, de goedkeuring van de daarbij aangewezen autoriteit. Verordeningen zijn
      verbindend voor een ieder behoudens voorzover bij de overdracht dan wel in de verordening zelf anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel23
  - number: '23.3'
    text: |-
      Besluiten zonder algemene gelding, tot het nemen waarvan de bevoegdheid is gedelegeerd, kunnen worden genomen ten
      aanzien van een ieder.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel23
  - number: '23.4'
    text: |-
      Het bedrijfslichaam stelt jaarlijks een begroting en een jaarrekening op met betrekking tot de werkzaamheden
      voortvloeiend uit de overgedragen bevoegdheden, bedoeld in het eerste lid. De begroting en de jaarrekening behoeven
      de goedkeuring van Onze Minister. Bij of krachtens een algemene maatregel van bestuur kunnen terzake nadere
      voorschriften worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel23
  - number: '23.5'
    text: |-
      Een krachtens het eerste lid vastgestelde regeling wordt, evenals een regeling tot haar wijziging of intrekking, in
      de *Staatscourant* bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel23
  - number: 23a
    text: |-
      Ten aanzien van beschikkingen, gegeven krachtens regelen als bedoeld in [de artikelen 18, eerste lid][ref1],
      [19, eerste lid][ref2], en [20, eerste lid][ref3], dan wel krachtens [artikel 23][ref4] in samenhang met
      [deze artikelen][ref5], blijven de [artikelen 4:7][ref6] en [4:8 van de Algemene wet bestuursrecht][ref7]
      buiten toepassing, indien de gestelde regelen strekken tot verwezenlijking van de in
      [artikel 13, eerste lid, onder ][ref8], vermelde doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002252#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0002252#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0002252#Artikel23a
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref8]: https://wetten.overheid.nl/BWBR0002252#Artikel13
    url: https://wetten.overheid.nl/BWBR0002252/2013-01-01#Artikel23a
