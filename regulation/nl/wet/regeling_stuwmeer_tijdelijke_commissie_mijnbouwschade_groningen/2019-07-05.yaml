  - number: '6'
    text: |-
      1 Een verzoek als bedoeld in [artikel 3, eerste of tweede lid][ref1], wijzigt alle aanvragen die de aanvrager
      heeft ingediend op grond van [artikel 3, tweede lid, van het Besluit][ref2] waarop ten tijde van het verzoek tot
      wijziging van de aanvraag nog geen besluit is genomen door de Commissie.

      2 Indien de Commissie een aanvraag, bedoeld in [artikel 3, eerste of tweede lid][ref3], afwijst, herleeft de
      aanvraag op grond van [artikel 3, tweede lid, van het Besluit][ref4] zodra het afwijzende besluit op grond van deze
      regeling onherroepelijk is geworden.


