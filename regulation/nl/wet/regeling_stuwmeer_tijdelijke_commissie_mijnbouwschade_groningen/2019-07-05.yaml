  - number: '5'
    text: |-
      1 Het verzoek tot wijziging van een aanvraag als bedoeld in [artikel 3, tweede lid, van het Besluit][ref1] in een
      aanvraag als bedoeld in[ artikel 3, eerste of tweede lid][ref2], wordt bij de Commissie ingediend door middel van
      een door de Commissie vastgesteld digitaal formulier.

      2 Het verzoek bevat ten minste:

      a. de naam en het adres van de aanvrager;

      b. het dossiernummer van de aanvraag, bedoeld in [artikel 3, tweede lid, van het Besluit][ref3];

      c. het adres van het gebouw waarop de aanvraag betrekking heeft;

      d. het rekeningnummer van de aanvrager.

      3 Het verzoek heeft betrekking op een aanvraag als bedoeld in [artikel 3, tweede lid, van het Besluit][ref4] die
      ziet op een gebouw of werk dat is gelegen op een locatie:

      a. binnen een afstand van 6 km of minder van het Groningenveld of de Gasopslag Norg, of

      b. waar als gevolg van een beving met een epicentrum in het Groningenveld of de Gasopslag Norg een trillingssterkte
      van 2 mm/s met een overschrijdingskans van 1% is opgetreden.

      4 De aanvrager is ten tijde van het besluit op de aanvraag, bedoeld in [artikel 3, eerste of tweede lid][ref5],
      rechthebbende tot de schadevergoeding voor de fysieke schade aan het gebouw of werk.

      5 Indien de aanvraag, bedoeld in [artikel 3, eerste of tweede lid][ref6], niet voldoet aan één van de in deze
      regeling bedoelde voorwaarden, wijst de Commissie de aanvraag af.

      6 De Commissie kan:

      a. in afwijking van [artikel 3, tweede lid][ref7], een variabele vergoeding toekennen ten aanzien van een aanvraag
      waarvoor een rapport als bedoeld in [artikel 6, tweede lid, van Bijlage I bij het Besluit][ref8] is uitgebracht, en

      b. afwijken van [artikel 3, derde lid, onderdeel c][ref9], ten einde onbillijkheden van overwegende aard te
      voorkomen.


