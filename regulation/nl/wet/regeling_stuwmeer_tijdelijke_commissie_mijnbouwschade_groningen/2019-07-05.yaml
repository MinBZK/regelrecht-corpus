  - number: '4'
    text: |-
      1 De Commissie verbindt aan een besluit op een aanvraag als bedoeld in [artikel 3, eerste of tweede lid][ref1], de
      voorwaarde dat aanvrager desgevraagd medewerking verleent of laat verlenen aan het uitvoeren van een nulmeting aan
      het gebouw of werk waarop de aanvraag betrekking had.

      2 Uit de facturen, bedoeld in [artikel 3, tweede lid, onderdeel b][ref2], blijkt in voldoende mate dat de kosten
      zijn gemaakt ten behoeve van herstel van de schade waarop de aanvraag betrekking heeft.

      3 De Commissie kan aan haar besluit op een aanvraag als bedoeld in [artikel 3, tweede lid][ref3], nadere
      voorwaarden stellen waaraan de facturen moeten voldoen. De Commissie publiceert deze voorwaarden ook op haar
      website.


      [ref1]: https://wetten.overheid.nl/BWBR0042372#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0042372#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0042372#Artikel3
