  - number: '2'
    text: |-
      1 De Commissie heeft tot taak te besluiten op verzoeken om vergoeding als bedoeld in
      [artikel 3, eerste en tweede lid][ref1], het nemen van beslissingen op bezwaren tegen die besluiten, het voeren
      van verweer in beroepsprocedures tegen de beslissingen op bezwaar en het voeren van hoger beroepsprocedures tegen
      uitspraken van de rechtbank.

      2 Aan de leden van de Commissie wordt ieder voor zich mandaat, volmacht en machtiging verleend voor
      aangelegenheden die verband houden met de in het eerste lid bedoelde taak waaronder begrepen het nemen
      van besluiten, het verrichten van privaatrechtelijke rechtshandelingen en overige handelingen op het
      gebied van de [Wet openbaarheid van bestuur][ref2], de Algemene verordening gegevensbescherming, de
      [Wet hergebruik overheidsinformatie][ref3] en voor de afhandeling van interne klachten en verzoeken van de
      Nationale Ombudsman.

      3 De leden van de Commissie, het aan haar ter beschikking gestelde personeel en de door de Commissie ingeschakelde
      deskundigen verlangen of ontvangen geen instructies van derden die op een individuele zaak betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0042372#Artikel3
