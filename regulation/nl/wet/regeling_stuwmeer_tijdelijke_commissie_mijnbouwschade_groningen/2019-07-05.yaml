  - number: '3'
    text: |-
      1 Een aanvrager die vóór 13 juni 2019 een aanvraag als bedoeld in [artikel 3, tweede lid, van het Besluit][ref1]
      heeft ingediend, kan, indien ten tijde van zijn verzoek op grond van dit artikel nog geen besluit op die aanvraag
      is genomen door de Commissie, de Commissie verzoeken zijn aanvraag als bedoeld in artikel 3, tweede lid, van het
      Besluit te wijzigen in een aanvraag op grond van deze regeling om eenmalig een vaste vergoeding in geld toe te
      kennen ter hoogte van € 5.000,-, bestaande uit;

      a. een vergoeding van € 4.000,– voor alle tot de datum van het besluit aan de gebouwen of werken van aanvrager
      waarop de aanvraag betrekking had ontstane fysieke schade en;

      b. een vaste forfaitaire vergoeding van € 1.000,– voor overige schade.

      2 Een aanvrager die vóór 1 januari 2019 een aanvraag als bedoeld in [artikel 3, tweede lid, van het Besluit][ref2]
      heeft ingediend, kan, indien ten tijde van zijn verzoek op grond van deze regeling nog geen
      besluit op die aanvraag is genomen door de Commissie en nog geen rapport als bedoeld in
      [artikel 6, tweede lid, van Bijlage I bij het Besluit][ref3] is uitgebracht, in plaats van het bepaalde in het
      eerste lid, de Commissie verzoeken zijn aanvraag als bedoeld in artikel 3, tweede lid, van het Besluit te wijzigen
      in een aanvraag op grond van deze regeling om toe te kennen:

      a. een eenmalige variabele vergoeding ter hoogte van maximaal € 10.000,– voor de ten tijde van het besluit aan de
      gebouwen of werken van aanvrager waarop de aanvraag betrekking had, ontstane fysieke schade, uit te betalen aan de
      hand van door de aanvrager ná het besluit bij de Commissie in te dienen facturen, en:

      b. een eenmalige vaste forfaitaire vergoeding van € 1.000,– voor overige schade.

      3 Een aanvrager kan geen gebruik meer maken van deze regeling:

      a. indien de Commissie voorafgaand aan het indienen van een verzoek op grond van deze regeling, een besluit op de
      aanvraag op grond van het [Besluit][ref4] heeft genomen,

      b. na 31 december 2019, of

      c. indien de aanvrager er ná 14 juli 2019 voor heeft gekozen om de procedure uit [bijlage I van het Besluit][ref5]
      voort te zetten, door:

        - in te stemmen met een opname van de schade of rapportage over de aard van de schade door een deskundige als
      bedoeld in [artikel 5, eerste lid, van bijlage I van het Besluit][ref6], of;
        - een zienswijze te geven op een uitgebracht rapport van een deskundige als bedoeld in
      [artikel 6, vijfde lid, van bijlage I van het Besluit][ref7] of de daarvoor geldende termijn ongebruikt te laten
      verstrijken zonder een verzoek als bedoeld in het eerste of tweede lid in te dienen.

      4 Indien een aanvrager met betrekking tot hetzelfde gebouw, werk of adres meerdere aanvragen als bedoeld in
      [artikel 3, tweede lid, van het Besluit][ref8] heeft gedaan waarop ten tijde van het verzoek als bedoeld in het
      eerste of het tweede lid nog geen besluit is genomen, wordt door de Commissie op al deze aanvragen, in één keer op
      grond van deze regeling beslist.

      5 De Commissie informeert aanvragers die aanvragen als bedoeld in [artikel 3, tweede lid, van het Besluit][ref9]
      hebben ingediend schriftelijk vóór 14 juli 2019 of zij in aanmerking komen voor het gebruik van deze regeling en,
      voor zover zij voor het gebruik van deze regeling in aanmerking komen, dat het voortzetten van de procedure op
      grond van het [Besluit][ref10] na die datum er ingevolge het derde lid, onderdeel c, toe leidt dat zij geen beroep
      kunnen doen op deze regeling.


