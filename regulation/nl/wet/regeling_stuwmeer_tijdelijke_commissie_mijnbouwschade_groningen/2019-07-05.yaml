articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *Besluit:* [Besluit mijnbouwschade Groningen][ref1];
        - *fysieke schade:* fysieke schade aan gebouwen en werken die is ontstaan door beweging van de bodem als gevolg van
      de aanleg of de exploitatie van een mijnbouwwerk ten behoeve van het winnen van gas uit het Groningenveld of als
      gevolg van de gasopslag Norg;
        - *Commissie:* Tijdelijke commissie mijnbouwschade Groningen, bedoeld in
      [artikel 3, eerste lid, van het Besluit][ref2];
        - *gebouwen en werken:* gebouwen en werken met uitzondering van: a. industriegebouwen zoals gebouwen voor
      de vervaardiging van chemische producten; b. infrastructurele werken zoals openbare wegen, openbare bruggen,
      openbare riolering, dijken en netten als bedoeld in [artikel 1 van de Elektriciteitswet 1998][ref3] en
      [artikel 1 van de Gaswet][ref4];
        - *overige schade:* a. materiële schade die het gevolg is van fysieke schade, waaronder de
      bijkomende kosten genoemd in [bijlage 2 van het Besluit][ref5]; b. overlastvergoeding als bedoeld in
      [bijlage 2 van het Besluit][ref6]; c. wettelijke rente.


