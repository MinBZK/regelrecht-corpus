preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in een aantal wettelijke bepalingen op het terrein van
    het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties enkele wetstechnische gebreken te herstellen alsmede
    daarin andere wijzigingen van ondergeschikte aard aan te brengen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035826/2015-01-01#ArtikelAanhef
