      1 Deze wet, met uitzondering van de [artikelen XIVa][ref1], [XVIa][ref2] en [XXIII, onderdeel Fa][ref3], treedt in
      werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin hij wordt geplaatst.

      2 De [artikelen III][ref4] en [VIII, onderdeel B][ref5], werken terug tot en met 16 maart 2013.

      3 De [artikelen IV][ref6] en [XVI, onderdeel E][ref7], werken terug tot en met 19 maart 2014.

      4 [Artikel XIVa][ref8] treedt in werking op het tijdstip waarop de [Huisvestingswet 2014][ref9] in werking treedt.
      Indien het Staatsblad waarin deze wet wordt geplaatst, wordt uitgegeven na het tijdstip waarop die wet in werking
      is getreden, treedt artikel XIVa in werking met ingang van de dag na de datum van uitgifte van het Staatsblad
      waarin deze wet wordt geplaatst en werkt het terug tot en met het tijdstip waarop die wet in werking is getreden.

      5 [Artikel XVI, onderdeel A][ref10], werkt terug tot en met 1 januari 2011.

      6 [Artikel XVI, onderdeel B][ref11], werkt terug tot en met 1 januari 2012.

      7 [Artikel XVI, onderdeel C][ref12], werkt terug tot en met 1 januari 2013.

      8 [Artikel XVI, onderdeel D][ref13], werkt terug tot en met 1 januari 2014.

