    - number: XXIV
      text: |-
        1 Deze wet, met uitzondering van de [artikelen XIVa][ref1], [XVIa][ref2] en [XXIII, onderdeel Fa][ref3], treedt in
        werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin hij wordt geplaatst.

        2 De [artikelen III][ref4] en [VIII, onderdeel B][ref5], werken terug tot en met 16 maart 2013.

        3 De [artikelen IV][ref6] en [XVI, onderdeel E][ref7], werken terug tot en met 19 maart 2014.

        4 [Artikel XIVa][ref8] treedt in werking op het tijdstip waarop de [Huisvestingswet 2014][ref9] in werking treedt.
        Indien het Staatsblad waarin deze wet wordt geplaatst, wordt uitgegeven na het tijdstip waarop die wet in werking
        is getreden, treedt artikel XIVa in werking met ingang van de dag na de datum van uitgifte van het Staatsblad
        waarin deze wet wordt geplaatst en werkt het terug tot en met het tijdstip waarop die wet in werking is getreden.

        5 [Artikel XVI, onderdelen A][ref10], werkt terug tot en met 1 januari 2011.

        6 [Artikel XVI, onderdeel B][ref11], werkt terug tot en met 1 januari 2012.

        7 [Artikel XVI, onderdeel C][ref12], werkt terug tot en met 1 januari 2013.

        8 [Artikel XVI, onderdeel D][ref13], werkt terug tot en met 1 januari 2014.

        9 [Artikel XVIa][ref14] treedt in werking op het tijdstip waarop
        __REF001___________________________________________________________________________________________________________
        ___________________________________________________________________________________________________________________
        ___________________________________________________________________________________ (Stb.
        2014, 306) in werking treedt. Indien artikel I, onderdeel D, van de wet van 9 juli 2014 tot wijziging van de
        Wet gemeenschappelijke regelingen en een aantal andere wetten in verband met de dualisering van het gemeente- en
        provinciebestuur en de invoering van een bedrijfsvoeringsorganisatie met rechtspersoonlijkheid, alsmede regeling
        van diverse andere onderwerpen reeds in werking is getreden op het tijdstip van inwerkingtreding van deze wet,
        treedt artikel XVIa van deze wet in werking met ingang van de dag na de datum van uitgifte van het Staatsblad
        waarin deze wet wordt geplaatst en werkt het terug tot en met het tijdstip waarop artikel I, onderdeel D, van de
        wet van 9 juli 2014 tot wijziging van de Wet gemeenschappelijke regelingen en een aantal andere wetten in verband
        met de dualisering van het gemeente- en provinciebestuur en de invoering van een bedrijfsvoeringsorganisatie met
        rechtspersoonlijkheid, alsmede regeling van diverse andere onderwerpen in werking is getreden.

        10 [Artikel XXIII, onderdeel Fa][ref16], treedt in werking op het tijdstip waarop de wet van 4 juni 2014 tot
        wijziging van de Woningwet in verband met het versterken van het handhavingsinstrumentarium (Stb. 2014, 249) in
        werking treedt. Indien het Staatsblad waarin deze wet wordt geplaatst, wordt uitgegeven na het tijdstip waarop die
        wet in werking is getreden, treedt artikel XXIII, onderdeel Fa, in werking met ingang van de dag na de datum van
        uitgifte van het Staatsblad waarin deze wet wordt geplaatst en werkt het terug tot en met het tijdstip waarop die
        wet in werking is getreden.


