preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: Er is een Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel1
  - number: '1.2'
    text: De Inspectie Verkeer en Waterstaat staat onder leiding van de Inspecteur-Generaal.
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel1
  - number: '1.3'
    text: De Inspectie Verkeer en Waterstaat ressorteert rechtstreeks onder de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel1
  - number: '1.4'
    text: Van de Inspectie Verkeer en Waterstaat maakt deel uit de Scheepvaartinspectie in Nederland.
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel1
  - number: '2'
    text: |-
      De Inspectie Verkeer en Waterstaat is, voorzover dit niet bij of krachtens de wet aan anderen is opgedragen of
      gemandateerd, belast met uitvoering en handhaving van de wetgeving op het terrein van:
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel2
  - number: 2.a
    text: het personen- en goederenvervoer over de weg,
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel2
  - number: 2.b
    text: de spoorwegen;
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel2
  - number: 2.c
    text: de scheepvaart;
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel2
  - number: 2.d
    text: de luchtvaart.
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel2
  - number: 2a
    text: 'De Inspectie Verkeer en Waterstaat is voorts belast met de volgende taken op het terrein van het water:'
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel2a
  - number: 2a.a
    text: |-
      de handhaving van de [Wet verontreiniging oppervlaktewateren][ref1], de [Wet verontreiniging zeewater][ref2], de
      [Wet op de waterhuishouding][ref3], de [Wet bodembescherming][ref4] en de [Wet milieubeheer][ref5], voorzover dit
      niet bij of krachtens de wet aan anderen is opgedragen of gemandateerd;


      [ref1]: https://wetten.overheid.nl/BWBR0003994
      [ref2]: https://wetten.overheid.nl/BWBR0003994
      [ref3]: https://wetten.overheid.nl/BWBR0003994
      [ref4]: https://wetten.overheid.nl/BWBR0003994
      [ref5]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0003994
      - id: ref2
        bwb_id: BWBR0003994
      - id: ref3
        bwb_id: BWBR0003994
      - id: ref4
        bwb_id: BWBR0003994
      - id: ref5
        bwb_id: BWBR0003245
  - number: 2a.b
    text: |-
      de aansturing van de uitvoering van de onder a genoemde wetten, voorzover deze geschiedt door andere ambtenaren die
      werkzaam zijn onder verantwoordelijkheid van de Minister van Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel2a
  - number: 2a.c
    text: |-
      de uitvoering en handhaving van de Wet verontreiniging oppervlaktewateren, de Wet verontreiniging
      zeewater, de Wet op de waterhuishouding, de Wet op de bodembescherming, de [Wet milieubeheer][ref1], de
      [Wet beheer Rijkswaterstaatswerken][ref2], de [Ontgrondingenwet][ref3] en de [Scheepvaartverkeerswet][ref4],
      voorzover deze betrekking heeft op besluiten gericht tot de Minister van Verkeer en Waterstaat;


      [ref1]: https://wetten.overheid.nl/BWBR0002505
      [ref2]: https://wetten.overheid.nl/BWBR0002505
      [ref3]: https://wetten.overheid.nl/BWBR0002505
      [ref4]: https://wetten.overheid.nl/BWBR0004364
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002505
      - id: ref2
        bwb_id: BWBR0002505
      - id: ref3
        bwb_id: BWBR0002505
      - id: ref4
        bwb_id: BWBR0004364
  - number: 2a.d
    text: |-
      het verrichten van audits ten aanzien van de uitvoering en handhaving van de onder c genoemde wetten, voor zover
      deze geschieden door ambtenaren die werkzaam zijn onder verantwoordelijkheid van de Minister van Verkeer en
      Waterstaat.
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel2a
  - number: '3'
    text: 'Bij regeling van de Minister van Verkeer en Waterstaat kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel3
  - number: 3.a
    text: de taakuitoefening, de werkwijze en het beheer van de Inspectie Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel3
  - number: 3.b
    text: de positie en bevoegdheden van de Inspecteur-Generaal Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel3
  - number: 3.c
    text: |-
      de informatie-uitwisseling en het overleg over beleidsvoornemens en ontwikkelingen en voorgenomen maatregelen op
      het terrein van uitvoering en handhaving tussen de Inspectie en de Inspecteur-Generaal Verkeer en Waterstaat en de
      overige onderdelen en ambtenaren van het Ministerie van Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel3
  - number: 3.d
    text: |-
      de externe voorlichting van de Inspectie en de Inspecteur-Generaal Verkeer en Waterstaat met betrekking tot de
      taakuitoefening en de werkwijze;
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel3
  - number: 3.e
    text: |-
      de openbaarmaking van de adviezen en rapporten van de Inspecteur-Generaal Verkeer en Waterstaat, met inbegrip van
      de overlegging daarvan aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel3
  - number: '4'
    text: Dit besluit treedt in werking met ingang van 1 juli 2001.
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel4
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Instellingsbesluit Inspectie Verkeer en Waterstaat.'
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel5
