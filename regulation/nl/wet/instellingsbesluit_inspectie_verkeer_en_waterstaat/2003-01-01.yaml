  - number: '3'
    text: |-
      Bij regeling van de Minister van Verkeer en Waterstaat kunnen regels worden gesteld omtrent:

      a. de taakuitoefening, de werkwijze en het beheer van de Inspectie Verkeer en Waterstaat;

      b. de positie en bevoegdheden van de Inspecteur-Generaal Verkeer en Waterstaat;

      c. de informatie-uitwisseling en het overleg over beleidsvoornemens en ontwikkelingen en voorgenomen maatregelen op
      het terrein van uitvoering en handhaving tussen de Inspectie en de Inspecteur-Generaal Verkeer en Waterstaat en de
      overige onderdelen en ambtenaren van het Ministerie van Verkeer en Waterstaat;

      d. de externe voorlichting van de Inspectie en de Inspecteur-Generaal Verkeer en Waterstaat met betrekking tot de
      taakuitoefening en de werkwijze;

      e. de openbaarmaking van de adviezen en rapporten van de Inspecteur-Generaal Verkeer en Waterstaat, met inbegrip
      van de overlegging daarvan aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel3
