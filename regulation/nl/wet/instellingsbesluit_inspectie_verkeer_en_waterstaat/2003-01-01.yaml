articles:
  - number: '1'
    text: |-
      1 Er is een Inspectie Verkeer en Waterstaat.

      2 De Inspectie Verkeer en Waterstaat staat onder leiding van de Inspecteur-Generaal.

      3 De Inspectie Verkeer en Waterstaat ressorteert rechtstreeks onder de secretaris-generaal.

      4 Van de Inspectie Verkeer en Waterstaat maakt deel uit de Scheepvaartinspectie in Nederland.
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel1
  - number: '2'
    text: |-
      De Inspectie Verkeer en Waterstaat is, voorzover dit niet bij of krachtens de wet aan anderen is opgedragen of
      gemandateerd, belast met uitvoering en handhaving van de wetgeving op het terrein van:

      a. het personen- en goederenvervoer over de weg,

      b. de spoorwegen;

      c. de scheepvaart;

      d. de luchtvaart.
    url: https://wetten.overheid.nl/BWBR0012546/2003-01-01#Artikel2
  - number: 2a
    text: |-
      De Inspectie Verkeer en Waterstaat is voorts belast met de volgende taken op het terrein van het water:

      a. de handhaving van de [Wet verontreiniging oppervlaktewateren][ref1], de [Wet verontreiniging zeewater][ref2], de
      [Wet op de waterhuishouding][ref3], de [Wet bodembescherming][ref4] en de [Wet milieubeheer][ref5], voorzover dit
      niet bij of krachtens de wet aan anderen is opgedragen of gemandateerd;

      b. de aansturing van de uitvoering van de onder a genoemde wetten, voorzover deze geschiedt door andere ambtenaren
      die werkzaam zijn onder verantwoordelijkheid van de Minister van Verkeer en Waterstaat;

      c. de uitvoering en handhaving van de Wet verontreiniging oppervlaktewateren, de Wet verontreiniging
      zeewater, de Wet op de waterhuishouding, de Wet op de bodembescherming, de [Wet milieubeheer][ref6], de
      [Wet beheer Rijkswaterstaatswerken][ref7], de [Ontgrondingenwet][ref8] en de [Scheepvaartverkeerswet][ref9],
      voorzover deze betrekking heeft op besluiten gericht tot de Minister van Verkeer en Waterstaat;

      d. het verrichten van audits ten aanzien van de uitvoering en handhaving van de onder c genoemde wetten, voor
      zover deze geschieden door ambtenaren die werkzaam zijn onder verantwoordelijkheid van de Minister van Verkeer
      en Waterstaat.


