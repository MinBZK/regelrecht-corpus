preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#ArtikelAanhef
articles:
  - number: '1.1'
    text: Er is een Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel1
  - number: '1.2'
    text: De Inspectie Verkeer en Waterstaat staat onder leiding van de Inspecteur-Generaal.
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel1
  - number: '1.3'
    text: De Inspectie Verkeer en Waterstaat ressorteert rechtstreeks onder de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel1
  - number: '1.5'
    text: De organisatie van de Inspectie Verkeer en Waterstaat wordt nader vastgesteld door de Inspecteur-Generaal.
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel1
  - number: '2.1'
    text: |-
      De Inspectie Verkeer en Waterstaat is, voorzover dit niet bij of krachtens de wet aan anderen is opgedragen of
      gemandateerd, belast met uitvoering en handhaving van de wetgeving op het terrein van:
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel2
  - number: 2.1.a
    text: het personen- en goederenvervoer over de weg,
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel2
  - number: 2.1.b
    text: de spoorwegen;
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel2
  - number: 2.1.c
    text: de scheepvaart;
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel2
  - number: 2.1.d
    text: de luchtvaart;
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel2
  - number: 2.1.e
    text: kabelbaaninstalllaties.
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel2
  - number: '2.2'
    text: |-
      De Inspectie Verkeer en Waterstaat is onverminderd het bepaalde in het eerste lid, belast met de taken van de
      veiligheidsinstantie, bedoeld in artikel 3, onderdeel g, van richtlijn nr. 2004/49/EG, van het Europees Parlement
      en de Raad van de Europese Unie van 29 april 2004 inzake veiligheid op de communautaire spoorwegen en tot
      wijziging van richtlijn 95/18/EG van de Raad betreffende de verlening van vergunningen aan spoorwegondernemingen,
      en van richtlijn 2001/14/EG van de Raad inzake de toewijzing van spoorweginfrastructuurcapaciteit en de
      heffing van rechten voor het gebruik van spoorweginfrastructuur alsmede inzake veiligheidscertificering
      (Spoorwegveiligheidsrichtlijn) (PbEG L 164).
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel2
  - number: '2.3'
    text: |-
      De Inspectie Verkeer en Waterstaat is voorts belast met de taken van de nationale toezichthoudende instantie,
      bedoeld in artikel 4, eerste lid, van verordening (EG) Nr. 549/2004 van het Europees Parlement en de Raad van
      10 maart 2004 tot vaststelling van het kader voor de totstandbrenging van het gemeenschappelijke Europese luchtruim
      (de kaderverordening) (PbEG L 96/1).
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel2
  - number: 2a
    text: 'De Inspectie Verkeer en Waterstaat is belast met de volgende taken op het gebied van het waterbeheer:'
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel2a
  - number: 2a.a
    text: |-
      het toezicht op de uitvoering en handhaving van het bij of krachtens gestelde in de [Waterwet][ref1], de
      [Waterschapswet][ref2], de [Ontgrondingenwet][ref3] en de [Scheepvaartverkeerswet][ref4] voor zover die uitvoering
      en handhaving geschiedt door een provincie of een waterschap;


      [ref1]: https://wetten.overheid.nl/BWBR0025458
      [ref2]: https://wetten.overheid.nl/BWBR0005108
      [ref3]: https://wetten.overheid.nl/BWBR0002505
      [ref4]: https://wetten.overheid.nl/BWBR0004364
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0025458
      - id: ref2
        bwb_id: BWBR0005108
      - id: ref3
        bwb_id: BWBR0002505
      - id: ref4
        bwb_id: BWBR0004364
  - number: 2a.b
    text: |-
      het toezicht op de uitvoering en handhaving van het bij of krachtens gestelde in de [Waterwet][ref1], de
      [Wet milieubeheer][ref2], de [Ontgrondingenwet][ref3], de [Wrakkenwet][ref4] en de [Scheepvaartverkeerswet][ref5],
      voor zover de uitvoering en handhaving geschiedt door een andere dienst dan de Inspectie Verkeer en Waterstaat, die
      werkzaam is onder verantwoordelijkheid van de Minister van Verkeer en Waterstaat; en


      [ref1]: https://wetten.overheid.nl/BWBR0025458
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0002505
      [ref4]: https://wetten.overheid.nl/BWBR0001963
      [ref5]: https://wetten.overheid.nl/BWBR0004364
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0025458
      - id: ref2
        bwb_id: BWBR0003245
      - id: ref3
        bwb_id: BWBR0002505
      - id: ref4
        bwb_id: BWBR0001963
      - id: ref5
        bwb_id: BWBR0004364
  - number: 2a.c
    text: |-
      de uitvoering en handhaving van de onder b genoemde wetten, voor zover die betrekking hebben op besluiten van de
      Minister van Verkeer en Waterstaat, die:
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel2a
  - number: 2a.c.1°
    text: gericht zijn tot de Minister van Verkeer en Waterstaat; of
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel2a
  - number: 2a.c.2°
    text: |-
      gericht zijn tot derden in het kader van activiteiten waarvoor door of namens de directeur-generaal Rijkswaterstaat
      opdracht is verleend;
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel2a
  - number: 2a.d
    text: |-
      de uitvoering en handhaving van [hoofdstuk 2 van het Besluit bodemkwaliteit][ref1] voorzover dat betrekking heeft
      op besluiten genomen door de Minister van Verkeer en Waterstaat en de Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0022929
        hoofdstuk: '2'
  - number: '3'
    text: 'Bij regeling van de Minister van Verkeer en Waterstaat kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel3
  - number: 3.a
    text: de taakuitoefening, de werkwijze en het beheer van de Inspectie Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel3
  - number: 3.b
    text: de positie en bevoegdheden van de Inspecteur-Generaal Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel3
  - number: 3.c
    text: |-
      de informatie-uitwisseling en het overleg over beleidsvoornemens en ontwikkelingen en voorgenomen maatregelen op
      het terrein van uitvoering en handhaving tussen de Inspectie en de Inspecteur-Generaal Verkeer en Waterstaat en de
      overige onderdelen en ambtenaren van het Ministerie van Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel3
  - number: 3.d
    text: |-
      de externe voorlichting van de Inspectie en de Inspecteur-Generaal Verkeer en Waterstaat met betrekking tot de
      taakuitoefening en de werkwijze;
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel3
  - number: 3.e
    text: |-
      de openbaarmaking van de adviezen en rapporten van de Inspecteur-Generaal Verkeer en Waterstaat, met inbegrip van
      de overlegging daarvan aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel3
  - number: '4'
    text: Dit besluit treedt in werking met ingang van 1 juli 2001.
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel4
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Instellingsbesluit Inspectie Verkeer en Waterstaat.'
    url: https://wetten.overheid.nl/BWBR0012546/2010-12-16#Artikel5
