preamble:
  text: |-
    Gelet op de artikelen 8, 9 en 10 van het Frequentiebesluit 2013;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel1
  - number: 1.a
    text: '*aanvrager:* degene die een aanvraag heeft ingediend;'
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel1
  - number: 1.b
    text: '*bekendmakingsbesluit:* [Besluit bekendmaking veiling kavels B27 en B31](onbekend);'
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel1
  - number: 1.c
    text: |-
      *bod:* bieding, uitgebracht via het elektronisch veilingsysteem van de minister en bevestigd door middel van dit
      elektronisch veilingsysteem;
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel1
  - number: 1.d
    text: |-
      *capaciteitseenheid:* 1/18e deel van de capaciteit van het frequentieblok dat ingevolge nationale voetnoot HOL006
      van het Nationaal Frequentieplan 2014 gekoppeld is aan de vergunning voor kavel B27 respectievelijk de vergunning
      voor kavel B31;
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel1
  - number: 1.e
    text: '*deelnemer:* aanvrager die toegelaten is tot de betrokken veiling;'
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel1
  - number: 1.f
    text: '*minister:* Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel1
  - number: 1.g
    text: |-
      *niet-landelijke commerciële radio:* frequentieruimte in de FM-band, aangewezen in
      __REF000___________________________________________________________________________________________________________
      _;


      [ref1]: https://wetten.overheid.nl/BWBR0014740#Artikel7
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014740
        artikel: '7'
  - number: 1.h
    text: |-
      *rente:* volgens actual/360 berekende rente op basis van de door de Europese Centrale Bank vastgestelde Euro
      Overnight Index Average, minus 100 basispunten, met een minimum van 0%;
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel1
  - number: 1.i
    text: '*rondeprijs:* door de minister per biedronde vastgestelde prijs;'
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel1
  - number: 1.j
    text: |-
      *verbonden instelling:* instelling die, ingevolge [artikel 22 van het Mediabesluit 2008][ref1], met de aanvrager
      als één instelling wordt aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0025036#Artikel22
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025036
        artikel: '22'
  - number: 1.k
    text: '*vergunning kavel B27:* vergunning als omschreven in [bijlage 1 van het bekendmakingsbesluit](onbekend);'
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel1
  - number: 1.l
    text: '*vergunning kavel B31:* vergunning als omschreven in [bijlage 2 van het bekendmakingsbesluit](onbekend).'
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel1
  - number: '2'
    text: |-
      Ingevolge het [bekendmakingsbesluit](onbekend) zijn de vergunning kavel B27 en de vergunning kavel B31 beschikbaar
      om door middel van een veiling te worden verdeeld.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel2
  - number: '3.1'
    text: |-
      Degene die voor een vergunning als bedoeld in [artikel 2][ref1] in aanmerking wil komen, dient daartoe een aanvraag
      in.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel2
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      Een aanvraag wordt in de periode van 15 september 2016 tot 6 oktober 2016 om 14.00 uur per aangetekende post
      ontvangen dan wel door middel van persoonlijke overhandiging ingediend op het volgende adres en met de volgende
      adressering: '*Agentschap Telecom* *Ter attentie van: Projectteam uitgifte vergunningen kavels B27 en B31*'
      *Emmasingel 1* *9726 AH Groningen*
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel3
  - number: '3.3'
    text: |-
      Bij persoonlijke overhandiging van de aanvraag wordt een bewijs van ontvangst afgegeven dat is voorzien van datum
      en tijdstip van ontvangst en ondertekening.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel3
  - number: '3.4'
    text: In de aanvraag wordt vermeld op welke vergunning of vergunningen de aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel3
  - number: '3.5'
    text: |-
      In de aanvraag wordt, voor zover van toepassing, vermeld van welke vergunningen voor landelijke of niet-landelijke
      commerciële radio in de FM-band de aanvrager en een met de aanvrager verbonden instelling reeds houder zijn.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel3
  - number: '3.6'
    text: |-
      In de aanvraag worden de namen vermeld van ten minste één en ten hoogste vier natuurlijke personen, die ieder voor
      zich zelfstandig bevoegd zijn om namens de aanvrager handelingen te verrichten gedurende de veilingprocedure en die
      daartoe beschikken over een rechtsgeldige en toereikende volmacht.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel3
  - number: '3.7'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van het in [bijlage I][ref1] opgenomen model en gaat, onverminderd de
      overige in deze regeling gestelde eisen, vergezeld van de in dit model genoemde gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0038511
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0038511
  - number: '3.8'
    text: De aanvraag is in de Nederlandse taal gesteld.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel3
  - number: '3.9'
    text: |-
      Met de gegevens en bescheiden, bedoeld in het zevende lid, worden gelijkgesteld zodanige gegevens en bescheiden,
      opgesteld krachtens het recht van een van de andere lidstaten van de Europese Unie of een van de andere staten die
      partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte, behoudens voor zover in deze regeling
      gebruikmaking van een model wordt voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel3
  - number: '3.10'
    text: |-
      De gegevens en bescheiden, bedoeld in het negende lid, mogen in afwijking van het achtste lid, in een van de
      officiële talen van de Europese Unie of Europese Economische Ruimte worden gesteld. In dat geval worden die
      gegevens en bescheiden vergezeld van een Nederlandse vertaling van die gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel3
  - number: '3.11'
    text: |-
      De aanvrager informeert de minister per brief, die wordt geadresseerd op de in het tweede lid genoemde wijze,
      onverwijld over wijzigingen met betrekking tot de in [bijlage I][ref1] bedoelde gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0038511
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0038511
  - number: '4.1'
    text: |-
      Teneinde te kunnen voldoen aan het Nationaal Frequentieplan 2014 doet de aanvrager die een aanvraag doet voor
      vergunning kavel B27 zijn aanvraag, bedoeld in [artikel 3][ref1], vergezeld gaan van een aanvraag voor een
      vergunning voor gebruik van een capaciteitseenheid in allotment 9D-N, onder de voorwaarde dat aan hem op grond
      van [artikel 13, eerste lid][ref2], of op grond van [artikel 26, eerste lid][ref3], de vergunning kavel B27 wordt
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038511#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0038511#Artikel26
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0038511
        artikel: '13'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0038511
        artikel: '26'
        paragraaf: '6'
  - number: '4.2'
    text: |-
      Teneinde te kunnen voldoen aan het Nationaal Frequentieplan 2014 doet de aanvrager die een aanvraag doet voor
      vergunning kavel B31 zijn aanvraag, bedoeld in [artikel 3][ref1], vergezeld gaan van een aanvraag voor een
      vergunning voor gebruik van een capaciteitseenheid in allotment 7A, onder de voorwaarde dat aan hem op grond van
      [artikel 13, tweede lid][ref2], of op grond van [artikel 26, eerste lid][ref3], de vergunning kavel B31 wordt
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038511#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0038511#Artikel26
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0038511
        artikel: '13'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0038511
        artikel: '26'
        paragraaf: '6'
  - number: '4.3'
    text: |-
      De voorwaardelijke aanvraag, bedoeld in het eerste en tweede lid, wordt ingediend met gebruikmaking van het daartoe
      in [bijlage I][ref1], onderdeel B, opgenomen model.


      [ref1]: https://wetten.overheid.nl/BWBR0038511
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0038511
  - number: '5'
    text: |-
      Onverminderd het bepaalde in [artikel 3.18 van de wet][ref1], wijst de minister de aanvraag af indien niet is
      voldaan aan [artikel 3, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038511#Artikel3
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038511
        artikel: '3'
        paragraaf: '3'
  - number: '6.1'
    text: |-
      Een aanvrager verstrekt als zekerheid voor de betaling van het bod en teneinde te borgen dat de vergunning
      wordt verleend aan een financieel bestendige vergunninghouder een waarborgsom of een bankgarantie ter
      grootte van de waarde, opgenomen in tabel 1, corresponderend met de vergunning waar de aanvraag ingevolge
      [artikel 3, vierde lid][ref1], betrekking op heeft.
            Tabel 1: hoogte bedrag waarborgsom of bankgarantie






                    Aangevraagde vergunning


                    Bedrag waarborgsom of bankgarantie






                    Vergunning kavel B27


                    € 10.000,–




                    Vergunning kavel B31


                    € 10.000,–


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel3
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '3'
        paragraaf: '3'
  - number: '6.2'
    text: 'De waarborgsom wordt verstrekt voor de periode tot:'
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel6
  - number: 6.2.a
    text: in geval van afwijzing van de aanvraag, het tijdstip van de afwijzing;
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel6
  - number: 6.2.b
    text: |-
      in geval van niet in behandeling nemen van de aanvraag, het tijdstip van het besluit om de aanvraag niet te
      behandelen;
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel6
  - number: 6.2.c
    text: |-
      in geval van toewijzing van de aanvraag, het tijdstip waarop het bod als bedoeld in [artikel 24, derde lid][ref1],
      volledig is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel24
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '24'
        paragraaf: '5'
  - number: '6.3'
    text: |-
      Een aanvrager zorgt ervoor dat uiterlijk op het in [artikel 3, tweede lid][ref1], bedoelde tijdstip:


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel3
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '3'
        paragraaf: '3'
  - number: 6.3.a
    text: |-
      de waarborgsom is ontvangen op bankrekeningnummer 705001199, IBAN: NL41INGB0705001199, BIC: INGBNL2A, ten name
      van Ministerie van Economische Zaken, Agentschap Telecom, Afdeling Finance & Control, onder vermelding van de
      desbetreffende vergunning, of
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel6
  - number: 6.3.b
    text: |-
      de bankgarantie, verstrekt volgens het model, bedoeld in [bijlage II][ref1], is ontvangen op het in
      [artikel 3, tweede lid][ref2], genoemde adres.


      [ref1]: https://wetten.overheid.nl/BWBR0038511
      [ref2]: https://wetten.overheid.nl/BWBR0038511#Artikel3
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0038511
      - id: ref2
        bwb_id: BWBR0038511
        artikel: '3'
        paragraaf: '3'
  - number: '7.1'
    text: |-
      Indien de aanvraag niet is afgewezen op grond van [artikel 5][ref1] en de aanvrager niet heeft voldaan aan een
      van de in artikel 3, vierde tot en met achtste en het tiende lid, artikel 4 en artikel 6, gestelde eisen, deelt de
      minister dit de aanvrager mee en stelt de minister de aanvrager in de gelegenheid het verzuim te herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel5
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '5'
        paragraaf: '3'
  - number: '7.2'
    text: |-
      De aanvrager heeft gedurende zes werkdagen, te rekenen vanaf de dag na dagtekening van de mededeling, bedoeld in
      het eerste lid, de gelegenheid het verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel7
  - number: '7.3'
    text: |-
      De gegevens of bescheiden ten behoeve van het verzuimherstel worden per aangetekende post ontvangen dan wel door
      middel van persoonlijke overhandiging ingediend op het adres, genoemd in [artikel 3, tweede lid][ref1], binnen de
      in het tweede lid bedoelde termijn, met dien verstande dat de ontvangst geschiedt vóór 14.00 uur van de laatste
      werkdag van die termijn. Verzuimherstel aangaande de waarborgsom geschiedt binnen dezelfde termijn, en met
      gebruikmaking van het bankrekeningnummer, genoemd in [artikel 6, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038511#Artikel6
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0038511
        artikel: '6'
        paragraaf: '3'
  - number: '7.4'
    text: |-
      [Artikel 3, derde lid][ref1], is van overeenkomstige toepassing met dien verstande dat als datum en tijdstip
      van ontvangst gelden de datum en het tijdstip waarop de gegevens en bescheiden, bedoeld in het derde lid, zijn
      ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel3
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '3'
        paragraaf: '3'
  - number: '7.5'
    text: |-
      Indien het verzuim niet binnen de termijn, bedoeld in het tweede en het derde lid, en op
      de wijze, vermeld in het derde lid, is hersteld of indien na herstel niet wordt voldaan aan
      de in [artikel 3, vierde tot en met achtste en het tiende lid][ref1], [artikel 4][ref2] en
      [artikel 6][ref3], gestelde eisen, kan de minister besluiten de aanvraag met toepassing van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref4] niet te behandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038511#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0038511#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0038511
        artikel: '4'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0038511
        artikel: '6'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '8'
    text: |-
      Een aanvrager verstrekt ter onderbouwing van zijn financiële draagkracht om te kunnen voldoen aan diens aan de
      vergunning voor digitale etherradio verbonden verplichtingen en de daaruit voortvloeiende investeringen:
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel8
  - number: 8.a
    text: |-
      een bankverklaring overeenkomstig [bijlage III][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0038511
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0038511
  - number: 8.b
    text: |-
      een kopie van een bankafschrift van de rekening op naam van de aanvrager waaruit ten tijde van de aanvraag of in
      ten hoogste vier weken voorafgaande aan het indienen van de aanvraag een positief saldo van ten minste € 15.000,–
      of, in geval de aanvraag ingevolge [artikel 3, vierde lid][ref1], op twee vergunningen betrekking heeft, ten minste
      € 30.000,– blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel3
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '3'
        paragraaf: '3'
  - number: '9'
    text: |-
      Een aanvrager heeft zich blijkens een door hem ondertekende verklaring overeenkomstig [bijlage IV][ref1]
      bij deze regeling ertoe verplicht dat een krachtens deze regeling aan hem verleende vergunning als bedoeld
      in [artikel 2][ref2], zal worden gebruikt voor het uitzenden van een radioprogramma van een commerciële
      omroepinstelling dat, voor zover het gepresenteerde programmaonderdelen tussen 07.00 uur en 19.00 uur betreft, voor
      ten minste 50 procent in de Nederlandse of Friese taal wordt gepresenteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0038511
      [ref2]: https://wetten.overheid.nl/BWBR0038511#Artikel2
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0038511
      - id: ref2
        bwb_id: BWBR0038511
        artikel: '2'
        paragraaf: '2'
  - number: '10'
    text: |-
      De aanvrager beschikt over de vereiste toestemming van het Commissariaat voor de Media, bedoeld in
      [artikel 3.1 van de Mediawet 2008][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3'
  - number: '11.1'
    text: |-
      De aanvrager is een privaatrechtelijke rechtspersoon naar Nederlands recht of het equivalent daarvan naar het
      recht van een van de overige lidstaten van de Europese Unie of een van de overige staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte, en heeft zijn statutaire zetel, zijn hoofdbestuur of zijn
      hoofdvestiging binnen de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel11
  - number: '11.2'
    text: 'De aanvrager voldoet voorts aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel11
  - number: 11.2.a
    text: |-
      de aanvrager verkeert niet in staat van faillissement of liquidatie, noch is door de aanvrager faillissement
      aangevraagd, en
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel11
  - number: 11.2.b
    text: de aanvrager is geen surseance van betaling verleend, noch is door de aanvrager surseance van betaling aangevraagd.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel11
  - number: '11.3'
    text: |-
      Met de eisen, bedoeld in het tweede lid, worden gelijkgesteld zodanige eisen volgens het recht van een van de
      andere lidstaten van de Europese Unie of een van de andere staten die partij zijn bij de Overeenkomst betreffende
      de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel11
  - number: '11.4'
    text: |-
      De minister wijst de aanvraag af, indien uit de aanvraag niet blijkt dat aan de eisen, bedoeld in het eerste en
      tweede lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel11
  - number: '12.1'
    text: |-
      Een aanvrager verklaart door middel van een door hem ondertekende verklaring, overeenkomstig [bijlage V][ref1]
      bij deze regeling, dat hij zich voorafgaand aan de indiening van de aanvraag heeft onthouden van afspraken of
      onderling afgestemde feitelijke gedragingen die afbreuk doen of kunnen doen aan de mededinging in het kader van de
      veilingprocedure en zich na het indienen van de aanvraag zal onthouden van het maken van dergelijke afspraken of
      het verrichten van dergelijke gedragingen.


      [ref1]: https://wetten.overheid.nl/BWBR0038511
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038511
  - number: '12.2'
    text: |-
      De minister kan een aanvraag afwijzen als naar zijn oordeel aannemelijk is dat de aanvrager afspraken heeft gemaakt
      of onderling afgestemde feitelijke gedragingen heeft verricht die afbreuk doen of kunnen doen of gedaan hebben of
      gedaan kunnen hebben aan de mededinging in het kader van de veilingprocedure.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel12
  - number: '13.1'
    text: |-
      Indien de minister ten aanzien van de vergunning kavel B27 vaststelt dat, uitgezonderd de aanvragers waarvan de
      aanvraag op grond van de [artikelen 5][ref1], [11][ref2] of [12][ref3] is afgewezen, de aanvraag op grond van
      [artikel 7][ref4] buiten behandeling is gesteld, of de aanvraag op grond van [artikel 3.18 van de wet][ref5] is
      geweigerd, slechts één aanvraag, die voldoet aan de in [paragraaf 3][ref6] van deze regeling gestelde eisen en die
      is ingediend door een aanvrager die voldoet aan die eisen, betrekking heeft op de vergunning kavel B27, vindt geen
      veiling van de vergunning kavel B27 plaats en wordt die vergunning aan de betreffende aanvrager verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0038511#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0038511#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0038511#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0038511#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0038511
        artikel: '11'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0038511
        artikel: '12'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0038511
        artikel: '7'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0009950
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0038511
        paragraaf: '3'
  - number: '13.2'
    text: |-
      De minister stelt de noodzaak van veilen van de vergunning kavel B31 vast na verdeling van de vergunning kavel
      B27. In afwijking hiervan kan de minister de noodzaak van veilen van de vergunning kavel B31 eerder vaststellen in
      geval de uitkomst van de verdeling van vergunning kavel B27 voor die vaststelling niet relevant is of in geval na
      toepassing van deze regeling de vergunning voor kavel B27 onverdeeld blijft. Het eerste lid is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel13
  - number: '14.1'
    text: |-
      Indien na toepassing van [artikel 13][ref1] de noodzaak van veilen van de betrokken vergunning is komen vast
      te staan, deelt de minister de aanvragers, van wie de aanvragen ingevolge artikel 13 zijn betrokken bij de
      vaststelling van de noodzaak van veilen, dit telkens schriftelijk mee.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel13
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '13'
        paragraaf: '4'
  - number: '14.2'
    text: |-
      Bij de mededeling, bedoeld in het eerste lid, wordt telkens tevens het totaal aantal deelnemers aan de veiling
      bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel14
  - number: '15'
    text: |-
      De veiling vindt telkens plaats overeenkomstig het bepaalde in deze paragraaf, met dien verstande dat de veiling
      van de vergunning kavel B27 voorafgaat aan verdeling van de vergunning kavel B31, een en ander voor zover na
      toepassing van [artikel 13][ref1] de noodzaak van veiling is komen vast te staan.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel13
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '13'
        paragraaf: '4'
  - number: '16.1'
    text: |-
      De veiling vindt plaats via internet, met behulp van een elektronisch veilingsysteem, waarbij de minister de
      rondeprijzen bepaalt en de deelnemer de keuze heeft om voor de door de minister vastgestelde rondeprijs een bod uit
      te brengen op de vergunning.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel16
  - number: '16.2'
    text: Biedingen worden uitsluitend uitgebracht door middel van het elektronisch veilingsysteem.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel16
  - number: '16.3'
    text: |-
      Andere communicatie vindt plaats via het elektronisch veilingsysteem dan wel telefonisch of per e-mail, waarbij
      de deelnemer bereikbaar is op het door hem in zijn aanvraag opgegeven telefoonnummer en e-mailadres en de minister
      bereikbaar is op het telefoonnummer en e-mailadres bedoeld in [artikel 17, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel17
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '17'
        paragraaf: '5'
  - number: '16.4'
    text: De veiling wordt uitsluitend op werkdagen gehouden.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel16
  - number: '16.5'
    text: De minister leidt de veiling en draagt zorg voor een goed verloop van de veiling.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel16
  - number: '17.1'
    text: 'De minister deelt een deelnemer uiterlijk twee weken voor de aanvang van de veiling schriftelijk mee:'
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel17
  - number: 17.1.a
    text: de datum, de aanvangstijd en de duur van de eerste biedronde;
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel17
  - number: 17.1.b
    text: de voor de veiling benodigde programmatuur;
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel17
  - number: 17.1.c
    text: het telefoonnummer en het e-mailadres waarop de minister bereikbaar is;
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel17
  - number: 17.1.d
    text: de combinatie van een inlogcode en wachtwoord van de deelnemer, en
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel17
  - number: 17.1.e
    text: het internetadres waarop de deelnemer inlogt teneinde aan de veiling deel te nemen.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel17
  - number: '17.2'
    text: |-
      In aanvulling op het eerste lid, verstrekt de minister een deelnemer uiterlijk twee weken voor de aanvang van de
      veiling het certificaat om in te kunnen loggen.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel17
  - number: '18.1'
    text: |-
      Een deelnemer, inbegrepen diegene die een deelnemer ten behoeve van de veiling bijstaat, onthoudt zich van
      afspraken of onderling afgestemde feitelijke gedragingen die afbreuk doen of kunnen doen aan de mededinging in het
      kader van de veilingprocedure.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel18
  - number: '18.2'
    text: |-
      De minister kan de veiling stopzetten of opschorten indien naar zijn oordeel sprake is van afspraken of gedragingen
      in strijd met het eerste lid.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel18
  - number: '18.3'
    text: |-
      Indien een deelnemer naar het oordeel van de minister in strijd heeft gehandeld met het eerste lid, kan de
      minister:
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel18
  - number: 18.3.a
    text: de betrokken deelnemer uitsluiten van verdere deelname aan de veiling;
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel18
  - number: 18.3.b
    text: de uitkomst van een of meer biedronden ongeldig verklaren, of
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel18
  - number: 18.3.c
    text: besluiten dat een of meer biedronden opnieuw moeten worden gehouden.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel18
  - number: '19.1'
    text: De minister bepaalt wanneer de biedronden van de veiling plaatsvinden en de duur van die biedronden.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel19
  - number: '19.2'
    text: Een deelnemer is onvoorwaardelijk en onherroepelijk aan zijn bod gebonden.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel19
  - number: '19.3'
    text: |-
      Indien een deelnemer in een biedronde of verlengde biedronde, bedoeld in [artikel 20, eerste lid][ref1], geen bod
      uitbrengt, is de betreffende deelnemer, behoudens de situatie bedoeld in [artikel 25][ref2], niet gerechtigd in de
      volgende biedronden een bod uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0038511#Artikel25
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '20'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0038511
        artikel: '25'
        paragraaf: '5'
  - number: '20.1'
    text: |-
      Indien een deelnemer een biedronde laat verstrijken zonder dat hij een bod uitbrengt, wordt die biedronde voor die
      deelnemer eenmalig van rechtswege verlengd met een termijn van 30 minuten.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel20
  - number: '20.2'
    text: |-
      Een verlenging als bedoeld in het eerste lid vindt in ten hoogste twee biedronden plaats, niet meegerekend
      biedronden waarvoor de minister:
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel20
  - number: 20.2.a
    text: |-
      op grond van [artikel 21, derde lid][ref1], heeft besloten dat de uitgebrachte biedingen in die ronde vervallen,


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel21
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '21'
        paragraaf: '5'
  - number: 20.2.b
    text: |-
      op grond van [artikel 18, derde lid][ref1] of [artikel 21, derde lid][ref2] heeft besloten dat de biedronde
      ongeldig wordt verklaard, of


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0038511#Artikel21
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '18'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0038511
        artikel: '21'
        paragraaf: '5'
  - number: 20.2.c
    text: |-
      op grond van [artikel 18, derde lid][ref1], [artikel 21, derde lid][ref2] of [artikel 25, tweede lid][ref3], heeft
      besloten dat de biedronde opnieuw moet worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0038511#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0038511#Artikel25
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '18'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0038511
        artikel: '21'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0038511
        artikel: '25'
        paragraaf: '5'
  - number: '20.3'
    text: |-
      In de situatie dat alle actieve deelnemers een bod in de biedronde of verlengde biedronde hebben uitgebracht,
      bedoeld in [artikel 21, derde lid, aanhef en onder a][ref1], maar een deelnemer daartoe gebruik heeft moeten maken
      van een verlenging, bedoeld in het eerste lid, omdat technische problemen zijn ontstaan voor het verstrijken van
      de biedronde, kan de minister, onverminderd het bepaalde in het tweede lid, besluiten dat die verlengde biedronde
      overeenkomstig het tweede lid niet wordt meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel21
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '21'
        paragraaf: '5'
  - number: '20.4'
    text: 'Een op grond van het eerste lid verlengde biedronde is afgelopen zodra:'
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel20
  - number: 20.4.a
    text: alle deelnemers wiens biedronde is verlengd, een bod hebben uitgebracht, of
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel20
  - number: 20.4.b
    text: de termijn van de verlengde biedronde, bedoeld in het eerste lid, is verstreken.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel20
  - number: '20.5'
    text: |-
      De minister deelt in het geval, bedoeld in het eerste lid, zo spoedig mogelijk aan alle deelnemers mee dat de
      biedronde ten behoeve van een of meer deelnemers is verlengd.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel20
  - number: '21.1'
    text: |-
      De minister kan de veiling opschorten indien zich naar zijn oordeel bijzondere omstandigheden voordoen buiten de
      beïnvloedingssfeer van de minister of de deelnemers of indien technische problemen optreden waardoor de veiling
      tijdelijk geen doorgang kan vinden. Een bijzondere omstandigheid of technisch probleem wordt door een deelnemer
      onverwijld maar uiterlijk binnen 10 minuten na afloop van een biedronde of verlengde biedronde per telefoon gemeld
      aan de minister.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel21
  - number: '21.2'
    text: |-
      Indien de technische problemen optreden bij een deelnemer, kan de minister verlangen dat zijn biedingen worden
      uitgebracht door middel van een computer die de minister ter beschikking stelt op een door hem te bepalen locatie.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel21
  - number: '21.3'
    text: |-
      Indien de veiling wordt opgeschort, kan de minister ten aanzien van de biedronde of verlengde biedronde waarin de
      bijzondere omstandigheden of technische problemen zijn opgetreden besluiten dat:
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel21
  - number: 21.3.a
    text: |-
      alle biedingen uitgebracht in die ronde vervallen, tenzij alle nog actieve deelnemers reeds een bod in die ronde
      hebben uitgebracht;
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel21
  - number: 21.3.b
    text: die biedronde ongeldig wordt verklaard en opnieuw moet worden gehouden.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel21
  - number: '22.1'
    text: De prijs in de eerste biedronde is € 0,–
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel22
  - number: '22.2'
    text: De minister bepaalt de rondeprijs in de tweede biedronde.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel22
  - number: '22.3'
    text: |-
      In de derde en volgende biedronden verhoogt de minister de rondeprijs zodanig dat de verhoging van de rondeprijs in
      een biedronde ten hoogste 100% is ten opzichte van de rondeprijs in de daaraan voorafgaande ronde.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel22
  - number: '22.4'
    text: |-
      Indien dit naar het oordeel van de minister nodig is voor een evenwichtige vraagontwikkeling of een efficiënt
      verloop van de veiling kan hij afwijken van het derde lid.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel22
  - number: '23.1'
    text: 'De minister deelt elke deelnemer zo spoedig mogelijk na het einde van een biedronde mee:'
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel23
  - number: 23.1.a
    text: het rondenummer van deze biedronde;
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel23
  - number: 23.1.b
    text: |-
      het aantal deelnemers dat nog actief is in de veiling, waarbij de identiteit van de overige deelnemers geheim
      blijft;
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel23
  - number: 23.1.c
    text: de rondeprijs die in de volgende biedronde geldt;
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel23
  - number: 23.1.d
    text: de aanvangstijd en de duur van de volgende biedronde, en
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel23
  - number: 23.1.e
    text: het rondenummer van de volgende biedronde.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel23
  - number: '23.2'
    text: |-
      In aanvulling op het eerste lid deelt de minister elke deelnemer zo spoedig mogelijk na het einde van een biedronde
      mee:
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel23
  - number: 23.2.a
    text: zijn bod in die biedronde, of het gebrek daaraan;
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel23
  - number: 23.2.b
    text: zijn verlengingsmogelijkheden in de volgende biedronde.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel23
  - number: '23.3'
    text: |-
      In afwijking van het eerste en tweede lid, wordt geen informatie over een volgende biedronde gegeven indien de
      laatste biedronde, bedoeld in [artikel 24, eerste lid][ref1], heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel24
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '24'
        paragraaf: '5'
  - number: '24.1'
    text: De laatste biedronde is de eerste biedronde waarin één geldig bod is uitgebracht.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel24
  - number: '24.2'
    text: |-
      De deelnemer die het in het eerste lid uitgebrachte bod heeft uitgebracht wint de vergunning tegen de prijs van de
      laatste biedronde.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel24
  - number: '24.3'
    text: Het in het eerste lid bedoelde bod is het winnende bod.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel24
  - number: '25.1'
    text: Indien in een biedronde geen bod is uitgebracht, komt deze biedronde te vervallen.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel25
  - number: '25.2'
    text: |-
      De biedronde wordt opnieuw gehouden, waarbij de minister de rondeprijs in deze biedronde vaststelt op een bedrag
      hoger dan de rondeprijs in de laatste ronde waarin tenminste twee biedingen zijn uitgebracht, maar lager dan de
      rondeprijs in de laatst gehouden biedronde waarin geen bod is uitgebracht.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel25
  - number: '25.3'
    text: |-
      Aan de opnieuw te houden biedronde, bedoeld in het tweede lid, nemen uitsluitend die deelnemers deel die een bod
      hebben uitgebracht in de laatst gehouden biedronde waarin twee of meer biedingen zijn uitgebracht.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel25
  - number: '25.4'
    text: |-
      Op deze biedronde zijn de [artikelen 22, derde en vierde lid][ref1], en [24][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0038511#Artikel24
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '22'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0038511
        artikel: '24'
        paragraaf: '5'
  - number: '26.1'
    text: |-
      Na beëindiging van de veiling van de vergunning kavel B27 onderscheidenlijk de vergunning kavel B31 verleent de
      minister de betreffende vergunning, aan de deelnemer die ingevolge [artikel 24][ref1] het winnende bod voor die
      vergunning heeft uitgebracht. De minister deelt alle deelnemers mee aan wie de vergunning wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel24
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '24'
        paragraaf: '5'
  - number: '26.2'
    text: De minister wijst de overige aanvragen af, voor zover de aanvraag op de desbetreffende vergunning betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel26
  - number: '27.1'
    text: |-
      Uiterlijk twee weken nadat de mededeling, bedoeld in [artikel 26, eerste lid][ref1], is gedaan:


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel26
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '26'
        paragraaf: '6'
  - number: 27.1.a
    text: stort de minister de waarborgsom van iedere deelnemer aan wie geen vergunning is verleend, terug;
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel27
  - number: 27.1.b
    text: |-
      stuurt de minister aan de bank van iedere deelnemer aan wie geen vergunning wordt verleend en die ter
      zekerheidstelling een bankgarantie heeft overgelegd, een schriftelijke verklaring dat de bankgarantie vervalt. Een
      kopie van voornoemde verklaring stuurt de minister aan de deelnemer.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel27
  - number: '27.2'
    text: |-
      Het door de deelnemer aan wie de vergunning op grond van [artikel 26, eerste lid][ref1], wordt verleend
      verschuldigde bedrag is gelijk aan de van toepassing zijnde rondeprijs die gold in de ronde waarin zijn winnende
      bod is uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel26
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '26'
        paragraaf: '6'
  - number: '27.3'
    text: |-
      De deelnemer aan wie een vergunning is verleend, betaalt het door hem verschuldigde bedrag binnen twee weken na
      inwerkingtreding van die vergunning op de wijze die is bepaald in zijn vergunning.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel27
  - number: '27.4'
    text: |-
      Indien de deelnemer aan wie een vergunning is verleend een bankgarantie heeft verstrekt, stuurt de minister, zodra
      het verschuldigde bedrag ingevolge het derde lid van de deelnemer is ontvangen, een schriftelijke verklaring dat
      de bankgarantie vervalt aan de bank van die deelnemer. Een kopie van voornoemde verklaring stuurt de minister aan
      de deelnemer.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel27
  - number: '27.5'
    text: |-
      Indien de deelnemer aan wie een vergunning is verleend een waarborgsom heeft gestort wordt de waarborgsom aangewend
      voor de betaling van het voor de vergunning verschuldigde bedrag, bedoeld in het tweede lid, met dien verstande
      dat:
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel27
  - number: 27.5.a
    text: |-
      indien de waarborgsom van een deelnemer minder dan het voor de vergunning verschuldigde bedrag bedraagt, die
      deelnemer het restant van het verschuldigde bedrag betaalt overeenkomstig het derde lid, en
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel27
  - number: 27.5.b
    text: |-
      indien de waarborgsom van een deelnemer meer dan het voor de vergunning verschuldigde bedrag bedraagt, het bedrag
      van de waarborgsom dat resteert, aan die deelnemer wordt teruggestort uiterlijk twee weken nadat de mededeling,
      bedoeld in [artikel 26, eerste lid][ref1], is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel26
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '26'
        paragraaf: '6'
  - number: '27.6'
    text: |-
      De minister vergoedt de rente over de gestorte waarborgsom vanaf de dag waarop hij de waarborgsom heeft ontvangen
      op het bankrekeningnummer, genoemd in [artikel 6, derde lid, onder a][ref1], met dien verstande dat de rente wordt
      vergoed tot en met de dag:


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel6
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '6'
        paragraaf: '3'
  - number: 27.6.a
    text: |-
      voorafgaand aan de dag waarop de waarborgsom door de minister wordt teruggestort: voor de deelnemer aan wie geen
      vergunning wordt verleend, of
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel27
  - number: 27.6.b
    text: |-
      waarop de mededeling, bedoeld in [artikel 26, eerste lid][ref1], is gedaan: voor de deelnemer aan wie de vergunning
      wordt verleend, met dien verstande dat er alleen rente wordt betaald over het door de deelnemer gestorte bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel26
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '26'
        paragraaf: '6'
  - number: '27.7'
    text: |-
      De minister vergoedt voorts aan een deelnemer van wie de waarborgsom meer bedraagt dan het voor de vergunning
      verschuldigde bedrag, rente over het restant, bedoeld in het vijfde lid, onderdeel b, over de periode vanaf de dag
      na de dag dat de mededeling, bedoeld in [artikel 26, eerste lid][ref1], is gedaan tot en met de dag voorafgaand aan
      de dag waarop de waarborgsom door de minister wordt teruggestort, met dien verstande dat alleen rente wordt betaald
      over dat restant.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel26
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '26'
        paragraaf: '6'
  - number: '27.8'
    text: |-
      De minister stort de rente, bedoeld in het zesde en zevende lid, terug op dezelfde dag waarop hij de waarborgsom of
      het bedrag dat resteert van de waarborgsom, terugstort.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel27
  - number: '28'
    text: |-
      Op grond van de aanvraag, bedoeld in [artikel 4][ref1], wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel4
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '4'
        paragraaf: '3'
  - number: 28.a
    text: |-
      aan de deelnemer aan wie op grond van [artikel 13, eerste lid][ref1] of op grond van
      [artikel 26, eerste lid][ref2], de vergunning kavel B27 is verleend, een vergunning verleend voor digitale radio-
      omroep, betrekking hebbende op een capaciteitseenheid in allotment 9D-N,


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0038511#Artikel26
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '13'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0038511
        artikel: '26'
        paragraaf: '6'
  - number: 28.b
    text: |-
      aan de deelnemer aan wie op grond van [artikel 13, tweede lid][ref1], of op grond van
      [artikel 26, eerste lid][ref2], de vergunning kavel B31 is verleend, een vergunning verleend voor digitale radio-
      omroep, betrekking hebbende op een capaciteitseenheid in allotment 7A.


      [ref1]: https://wetten.overheid.nl/BWBR0038511#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0038511#Artikel26
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0038511
        artikel: '13'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0038511
        artikel: '26'
        paragraaf: '6'
  - number: '30'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel30
  - number: '31'
    text: 'Deze regeling wordt aangehaald als: Regeling aanvraag- en veilingprocedure kavels B27 en B31.'
    url: https://wetten.overheid.nl/BWBR0038511/2016-09-13#Artikel31
