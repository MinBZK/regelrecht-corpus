preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het naar aanleiding van de evaluatie van de Wet bevordering
    integriteitsbeoordelingen door het openbaar bestuur wenselijk is gebleken die wet te wijzigen in verband met de
    uitbreiding van de reikwijdte ervan en het aanbrengen van enkele verbeteringen en de Wet op de kansspelen, de Wet
    justitiële en strafvorderlijke gegevens en de Wet milieubeheer in verband hiermee te wijzigen;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0033159/2014-11-29#ArtikelAanhef
articles:
  - number: V
    text: 'Deze wet wordt aangehaald als: Evaluatie- en uitbreidingswet Bibob.'
    url: https://wetten.overheid.nl/BWBR0033159/2014-11-29#ArtikelV
  - number: VI
    text: >-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033159/2014-11-29#ArtikelVI
