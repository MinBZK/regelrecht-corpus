  - number: '7'
    text: |-
      Ten aanzien van een rechtspersoon die reeds voor de inwerkingtreding van het
      [Aanwijzingsbesluit rechtspersonen met een beperkte kasbeheerfunctie][ref1] een rekening-courant bij ’s Rijks
      schatkist aanhield, kan de Minister, in afwijking van deze regeling, de in het verleden contractueel overeengekomen
      modaliteiten continueren.


      [ref1]: https://wetten.overheid.nl/BWBR0017117
    url: https://wetten.overheid.nl/BWBR0021734/2007-04-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017117
  - number: '8'
    text: |-
      1 Deze regeling treedt in werking op de tweede dag na de dagtekening van de Staatscourant waarin zij wordt
      geplaatst en werkt terug tot 1 september 2004.

      2 Deze regeling wordt aangehaald als: Regeling rekening-courant- en leningenbeheer derden.

      3 De [Regeling liquidemiddelenbeheer rechtspersonen ex artikel 45, tweede lid, CW 2001][ref1] wordt ingetrokken.


