preamble:
  text: |-
    Gelet op artikel 49a van de Comptabiliteitswet 2001 en op artikel 2, derde lid, van het Besluit kasbeheer 1998;

    Na overleg met de Algemene Rekenkamer (brief van 20 februari 2007, kenmerk 6007579R);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0021734/2007-04-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. actuele marktwaarde: de waarde die kan worden berekend aan de hand van de actuele marktrente van de resterende
      looptijden van de toekomstige kasstromen (rente en aflossing) van een financieel product;

      b. deposito: het creditbedrag op een aan de rekening-courant gekoppelde rekening, waarover een vooraf vastgestelde
      rente wordt vergoed en waarover gedurende een vooraf vastgestelde periode door de rechtspersoon niet vrij beschikt
      kan worden;

      c. Euro Overnight Index Average (EONIA): de dagelijkse vaststelling door de Europese Centrale Bank van de rente
      waartegen gemiddeld genomen overnight en zonder onderpand liquiditeiten zijn geleend in de eurogeldmarkt door een
      panel van ‘prime banks’;

      d. Euro Interbank Offered Rate (Euribor): de dagelijks door de European Banking Federation vastgestelde rente
      waartegen op de geldmarkt interbancair deposito's in euro's van verschillende looptijden worden aangeboden in de
      landen waar de euro betaalmiddel is;

      e. krediet in rekening-courant: het rekening-courantkrediet, bedoeld in
      [artikel 49, eerste lid, van de Comptabiliteitswet 2001][ref1];

      f. lening: de lening, bedoeld in [artikel 48, eerste lid, van de Comptabiliteitswet 2001][ref2];

      g. Minister: de Minister van Financiën;

      h. rechtspersoon: de rechtspersoon die op grond van het
      [Aanwijzingsbesluit rechtspersonen met een beperkte kasbeheerfunctie][ref3] zijn opgenomen
      in [bijlage A behorende bij dat besluit][ref4] dan wel de andere derde, bedoeld in
      [artikel 24, zesde lid, van de Comptabiliteitswet 2001][ref5];

      i. rekening-courant: de rekening-courant, bedoeld in [artikel 24, zesde lid, van de Comptabiliteitswet 2001][ref6];

      j. Staat-swapspread: het verschil tussen het effectieve rendement op staatsleningen en het effectieve rendement
      waartegen banken rentestromen met elkaar uitwisselen;

      k. trekkingsrecht: het recht van een derde partij om op eerste afroep te kunnen beschikken over een maximaal
      overeengekomen bedrag van een rechtspersoon die gelden in rekening-courant bij ’s Rijks schatkist aanhoudt.


