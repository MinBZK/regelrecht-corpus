  - number: '2'
    text: |-
      1 Het aanhouden van liquide middelen in ’s Rijks schatkist door een rechtspersoon geschiedt in de vorm van een
      rekening-courant. Aan een rekening-courant kan een depositorekening worden gekoppeld.

      2 Met de rechtspersoon wordt daartoe door de Minister een rekening-courantovereenkomst gesloten.

      3 De Minister kan in een rekening-courantovereenkomst nadere voorwaarden opnemen, waaronder de voorwaarden inzake
      de wijze waarop de rekening-courant en een daarmee verbonden depositorekening worden gedebiteerd en gecrediteerd.

      4 De looptijd van een deposito wordt uitgedrukt in dagen, weken, maanden of jaren.

      5 Het vervroegd laten vrijvallen van een deposito is uitsluitend mogelijk tegen de actuele marktwaarde.
    url: https://wetten.overheid.nl/BWBR0021734/2007-04-22#Artikel2
  - number: '3'
    text: |-
      1 Over aangehouden liquide middelen in rekening-courant wordt een daggeldrente vergoed waarvan de hoogte gelijk is
      aan de Euro Overnight Index Average (EONIA).

      2 Over een deposito wordt rente vergoed. De hoogte van de rente is afhankelijk van de looptijd van het deposito,
      waarbij geldt dat voor een deposito met een looptijd van maximaal 12 maanden een rente wordt vergoed waarvan de
      hoogte gekoppeld is aan de Euro Interbank Offered Rate (Euribor), en voor een deposito met een looptijd van meer
      dan 12 maanden een rente wordt vergoed waarvan het percentage gekoppeld is aan het effectief rendement van openbare
      staatsleningen met een corresponderende looptijd en een uitstaand volume van tenminste 2,5 miljard euro.

      3 Over een opgenomen lening wordt rente in rekening gebracht. De hoogte van de rente is afhankelijk van de duur
      van de rentevaste periode dan wel, wanneer er binnen dat tijdvak een aflossing plaatsvindt, van de tijdsduur dat
      de gelden van die lening gemiddeld binnen de rentevaste periode zullen uitstaan. De rentevaste periode gaat in op
      de ingangsdatum van de lening. Indien de rente vastligt voor een periode van maximaal 12 maanden, is de hoogte van
      de rente gekoppeld aan de Euro Interbank Offered Rate (Euribor). Indien de rente vastligt voor een periode van meer
      dan 12 maanden is de hoogte van de rente gekoppeld aan het effectief rendement van openbare staatsleningen met een
      corresponderende looptijd en een uitstaand volume van tenminste 2,5 miljard euro.

      4 Over een krediet in rekening-courant en over een debetstand van een rekening-courant wordt rente in rekening
      gebracht. De hoogte van de rente is gelijk aan de Euro Overnight Index Average (EONIA), tenzij een rentevaste
      periode is overeengekomen in welk geval de rente gekoppeld is aan de Euro Interbank Offered Rate (Euribor).

      5 Indien een rechtspersoon in enig jaar gemiddeld meer gelden in deposito met een oorspronkelijke looptijd van
      langer dan 12 maanden in ’s Rijks schatkist heeft aangehouden dan hij aan leningen bij ’s Rijks schatkist had
      uitstaan, wordt over het netto in deposito uitstaande bedrag een bonusrente vergoed die gebaseerd is op de Staat-
      swapspread.

      6 Bij de berekening van rente, bedoeld in dit artikel, wordt zowel het jaar als de periode waarop de rente
      betrekking heeft op het juiste aantal dagen gesteld, resulterend in de formule ‘actual/actual’, indien de
      overeengekomen rentevaste periode minimaal gelijk is aan een jaar en een dag. In de overige gevallen wordt het jaar
      op 360 dagen gesteld (‘actual/360’).
    url: https://wetten.overheid.nl/BWBR0021734/2007-04-22#Artikel3
  - number: '4'
    text: |-
      1 Een lening heeft een looptijd van minimaal twaalf maanden.

      2 De rentevaste periode van een lening kan afwijken van de looptijd van een lening.

      3 Een lening kan in tranches worden opgenomen en kan in haar geheel of in gedeelten worden afgelost.

      4 Vervroegde gehele of gedeeltelijke aflossing van een lening is uitsluitend mogelijk tegen de actuele marktwaarde.

      5 Een lening en een krediet in rekening-courant worden door de Minister in de vorm van een overeenkomst gesloten.

      6 De Minister kan met inachtneming van deze regeling in een overeenkomst nadere voorwaarden opnemen.
    url: https://wetten.overheid.nl/BWBR0021734/2007-04-22#Artikel4
  - number: '5'
    text: |-
      De Minister kan een trekkingsrecht voor derden toestaan op middelen die een rechtspersoon in ’s Rijks schatkist
      aanhoudt, mits die rechtspersoon daartoe een verzoek heeft ingediend en haar middelen in ’s Rijks schatkist
      toereikend zijn.
    url: https://wetten.overheid.nl/BWBR0021734/2007-04-22#Artikel5
  - number: '6'
    text: |-
      1 De producten, bedoeld in [artikel 45, tweede lid, van de Comptabiliteitswet 2001][ref1] hebben uitsluitend de
      vorm van:

      a. producten waarbij de hoofdsom tenminste aan het einde van de looptijd intact is, uitgezet bij een instelling die
      voldoet aan de in het tweede lid bedoelde eisen;

      b. vastrentende waarden, uitgegeven door een instelling die voldoet aan de in het tweede lid bedoelde eisen.

      2 De producten en vastrentende waarden worden uitsluitend betrokken van instellingen die voldoen aan de eisen,
      bedoeld in [artikel 2 van de Regeling uitzettingen en derivaten decentrale overheden][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0012076#Artikel2
