regulatory_layer: WET
publication_date: '2017-02-23'
valid_from: '2017-05-01'
bwb_id: BWBR0039217
url: https://wetten.overheid.nl/BWBR0039217/2017-05-01
preamble:
  text: |-
    Wij Willem-Alexander, bij gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is de mogelijkheid te verruimen om fouten in het
    geluidregister te herstellen en dat enkele artikelen in de Tracéwet, de Wet milieubeheer en de Wet geluidhinder
    verduidelijking behoeven;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0039217/2017-05-01#ArtikelAanhef
articles:
  - number: IV.1
    text: |-
      [Artikel 11.36, derde, vierde en vijfde lid, van de Wet milieubeheer][ref1] zijn van overeenkomstige toepassing
      ten aanzien van besluiten waarin geen gebied is aangegeven als bedoeld in artikel 11.36, derde lid, van de Wet
      milieubeheer en die zijn vastgesteld voor de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0039217/2017-05-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '11'
  - number: IV.2
    text: |-
      In de in [artikel 11.36, derde lid, van de Wet milieubeheer][ref1] bedoelde mededeling geeft de beheerder aan op
      welke geluidproductieplafonds [artikel 11.20 van de Wet milieubeheer][ref2] niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel11
    url: https://wetten.overheid.nl/BWBR0039217/2017-05-01#ArtikelIV
    references:
