        artikel: '4.4'
  - number: '6'
    text: |-
      1 Gedeputeerde staten betrekken bij de voorbereiding van het provinciale verkeers- en vervoersplan de naar hun
      oordeel meest belanghebbende bestuursorganen. Daartoe behoren in ieder geval Onze Minister, de colleges van
      burgemeester en wethouders, gedeputeerde staten van de aangrenzende provincies en de besturen van waterschappen die
      tevens wegbeheerder zijn.

      2 Op de voorbereiding van het provinciale verkeers- en vervoerplan is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009642/2009-12-22#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '7'
    text: |-
      1 Onze Minister kan provinciale staten een aanwijzing geven omtrent de inhoud van het provinciale verkeers- en
      vervoersplan. De aanwijzing kan alleen worden gegeven voorzover het een essentieel onderdeel van het nationale
      verkeers- en vervoersplan betreft. De aanwijzing wordt slechts gegeven nadat tevoren met gedeputeerde staten
      terzake overleg is gepleegd.

      2 Bij de aanwijzing stelt Onze Minister de termijn vast, waarbinnen het provinciale verkeers- en vervoerplan
      in overeenstemming dient te zijn gebracht met de aanwijzing. Onze Minister doet van het besluit, houdende de
      aanwijzing, mededeling aan de Staten-Generaal en publiceert het besluit in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009642/2009-12-22#Artikel7
  - number: '8'
    text: |-
      De gemeenteraad onderscheidenlijk het college van burgemeester en wethouders dragen zorg voor het – zichtbaar –
      voeren van een samenhangend en uitvoeringsgericht verkeers- en vervoersbeleid, dat richting geeft aan de door de
      raad en het college te nemen beslissingen inzake verkeer en vervoer. De gemeenteraad onderscheidenlijk het college
      van burgemeester en wethouders neemt hierbij de essentiële onderdelen van het nationale verkeers- en vervoerplan en
      van het provinciale verkeers- en vervoerplan in acht en houdt rekening met het beleid van naburige gemeenten.
    url: https://wetten.overheid.nl/BWBR0009642/2009-12-22#Artikel8
  - number: '9'
    text: |-
      1 Gedeputeerde staten kunnen de gemeenteraad de verplichting opleggen tot het vaststellen van een gemeentelijk
      verkeers- en vervoersplan indien de gemeenteraad onderscheidenlijk het college van burgemeester en wethouders
      aantoonbaar nalatig is in de uitoefening van de hen in [artikel 8][ref1] opgedragen taak. De verplichting wordt
      niet eerder opgelegd dat nadat tevoren met de gemeenteraad onderscheidenlijk het college van burgemeester en
      wethouders overleg is gepleegd.

      2 Het plan bevat in ieder geval:

      a. de uitwerking van de essentiële onderdelen van het nationale verkeers- en vervoerplan en van het provinciale
      verkeers- en vervoerplan;

      b. de afstemming met andere beleidsterreinen, zoals ruimtelijke ordening, economie en milieu;

      c. de fasering, de prioriteitsstelling en een indicatie van de bekostiging;

      d. de termijn waarvoor het plan geldt.

      3 Bij het opleggen van de verplichting tot het vaststellen van een gemeentelijk verkeers- en vervoerplan stellen
      gedeputeerde staten de termijn vast waarbinnen het plan moet worden vastgesteld. Gedeputeerde staten kunnen hierbij
      tevens een aanwijzing geven als bedoeld in [artikel 11, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009642#Artikel11
    url: https://wetten.overheid.nl/BWBR0009642/2009-12-22#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009642
        artikel: '8'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009642
        artikel: '11'
        paragraaf: '4'
  - number: '10'
    text: |-
      1 De gemeenteraad onderscheidenlijk het college van burgemeester en wethouders betrekt bij de voorbereiding van het
      gemeentelijk verkeers- en vervoerbeleid of van het gemeentelijk verkeers- en vervoerplan de naar zijn oordeel meest
      belanghebbende bestuursorganen en stelt hen op de hoogte van het door de gemeenteraad onderscheidenlijk het college
      te voeren beleid. Daartoe behoren in ieder geval gedeputeerde staten van de provincie, de colleges van burgemeester
      en wethouders van de aangrenzende gemeenten, de besturen van betrokken waterschappen die tevens wegbeheerder zijn
      en, in voorkomende gevallen, Onze Minister.

      2 Op de voorbereiding van het gemeentelijk verkeers- en vervoerplan is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.

      3 Voor zover het gemeentelijk verkeers- en vervoerbeleid gevolgen heeft voor het ruimtelijk beleid, geeft de
      gemeenteraad onderscheidenlijk het college van burgemeester en wethouders in ieder geval aan binnen welke termijn
      de daarvoor aangewezen procedures op basis van de [Wet ruimtelijke ordening][ref2] in gang gezet worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0009642/2009-12-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0020449
  - number: '11'
    text: |-
      1 Gedeputeerde staten kunnen de gemeenteraad een aanwijzing geven omtrent de inhoud van het gemeentelijk verkeers-
      en vervoerplan. De aanwijzing kan alleen worden gegeven voorzover het een essentieel onderdeel van het nationale of
      provinciale verkeers- en vervoerplan betreft. De aanwijzing wordt slechts gegeven nadat tevoren met de gemeenteraad
      terzake overleg is gepleegd.

      2 Bij de aanwijzing stellen gedeputeerde staten de termijn vast, waarbinnen het gemeentelijk verkeers- en
      vervoerplan in overeenstemming dient te zijn gebracht met de aanwijzing.

      3 Gedeputeerde staten doen van een besluit als bedoeld in het eerste lid, mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009642/2009-12-22#Artikel11
  - number: '12'
    text: |-
      1 Met het oog op de uitvoering van het nationale verkeers- en vervoerplan, de provinciale verkeers- en
      vervoerplannen en het verkeers- en vervoerbeleid van gemeenten kunnen bestuurlijke overeenkomsten worden gesloten.
      De noodzaak daartoe kan in het nationale of provinciale verkeers- en vervoerplan of in het gemeentelijke beleid
      worden aangegeven.

      2 Voor het geval bestuurlijke overeenkomsten niet tot stand komen, kan ieder der betrokken bestuursorganen zich
      wenden tot een door Onze Minister in te stellen commissie. De leden van deze commissie worden benoemd op voordracht
      van Rijk, provincies en gemeenten.
    url: https://wetten.overheid.nl/BWBR0009642/2009-12-22#Artikel12
  - number: '13'
    text: |-
      1 Ten behoeve van de onderlinge afstemming van het verkeers- en vervoerbeleid van Rijk, provincies en gemeenten en
      de uitvoering daarvan is er op nationaal en provinciaal niveau een verkeers- en vervoerberaad.

      2 Onze Minister draagt zorg voor de organisatie van het verkeers- en vervoerberaad op nationaal niveau en
      gedeputeerde staten dragen zorg voor de organisatie van het verkeers- en vervoerberaad op provinciaal niveau.
    url: https://wetten.overheid.nl/BWBR0009642/2009-12-22#Artikel13
  - number: '14'
    text: |-
      Onze Minister doet jaarlijks verslag van zijn bevindingen met betrekking tot de voortgang van de uitvoering van
      het nationale verkeers- en vervoerplan en verbindt daar conclusies aan. Hij maakt daarbij gebruik van de gegevens
      van provincies en gemeenten over de voortgang van de uitvoering van provinciale verkeers- en vervoerplannen en het
      gemeentelijk verkeers- en vervoerbeleid. Dit verslag maakt deel uit van het Meerjarenprogramma Infrastructuur en
      Transport als bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel4
    url: https://wetten.overheid.nl/BWBR0009642/2009-12-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009642
        artikel: '4'
        paragraaf: '2'
  - number: '15'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0009642/2009-12-22#Artikel15
  - number: '16'
    text: |-
      1 Het bestuur van een regionaal openbaar lichaam als bedoeld in
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] dat de gemeente of gemeenten Amsterdam, Arnhem en
      Nijmegen, Eindhoven en Helmond, Enschede en Hengelo, ’s-Gravenhage, Rotterdam of Utrecht omvat, stelt een regionaal
      verkeers- en vervoerplan vast, dat richting geeft aan de voor het gebied van dat regionaal openbaar lichaam te
      nemen beslissingen inzake verkeer en vervoer. Het bestuur neemt hierbij de essentiële onderdelen van het nationale
      verkeers- en vervoerplan in acht, evenals de essentiële onderdelen van het provinciale verkeer- en vervoerplan,
      voor zover die betrekking hebben op de bovenregionale samenhang.

      2 Voor de openbare lichamen als bedoeld in het eerste lid is de onderhavige wet van overeenkomstige toepassing, met
      dien verstande, dat:

      a. voor de toepassing van de [artikelen 2, tweede lid][ref2], [3, derde lid, onder b][ref3], [12][ref4],
      [13, eerste lid][ref5], en [14][ref6] regionale openbare lichamen gelijkgesteld worden met provincies;

      b. voor de toepassing van [artikel 3, derde lid, onder a en b][ref7], na «provincies» ingevoegd wordt: ,regionale
      openbare lichamen;

      c. het in [artikel 5][ref8] bedoelde provinciale verkeers- en vervoerplan uitsluitend betrekking heeft op het
      gebied van een in de provincie gelegen regionaal openbaar lichaam voor zover daarin essentiële onderdelen van
      beleid zijn opgenomen die noodzakelijk zijn voor de bovenregionale samenhang en het bestuur van de provincie over
      deze onderdelen overleg heeft gevoerd met het bestuur van het betrokken regionaal openbaar lichaam;

      d. in [artikel 6, eerste lid, tweede volzin][ref9], na «provincies» toegevoegd wordt: , alsmede het algemeen
      bestuur van het in de provincie bestaand regionaal openbaar lichaam;

      e. voor de toepassing van [artikel 7][ref10] «provinciale staten» en «het provinciale verkeers- en vervoerplan»
      vervangen worden door «het algemeen bestuur van een regionaal openbaar lichaam» respectievelijk «het regionaal
      verkeers- en vervoerplan»;

      f. de [artikelen 8 tot en met 10][ref11] niet toepassing zijn;

      g. voor de toepassing van [artikel 11][ref12] het «gemeentebestuur» en het «gemeentelijk verkeers- en vervoerplan»
      wordt vervangen door: «het bestuur van een regionaal openbaar lichaam» respectievelijk het «regionaal verkeers-
      en vervoerplan» en in de tweede volzin van het eerste lid de aanwijzing van het provinciaal bestuur uitsluitend
      betrekking heeft op de essentiële onderdelen van beleid van het provinciale verkeers- en vervoerplan die
      noodzakelijk zijn voor de bovenregionale samenhang.


