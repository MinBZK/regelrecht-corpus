preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voor het voeren van een samenhangend verkeers- en
    vervoerbeleid, waarbij de drie bestuurslagen zijn betrokken, een planstructuur te introduceren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009642/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      Onze Minister: Onze Minister van Verkeer en Waterstaat;

      Onze Ministers: Onze Minister van Verkeer en Waterstaat tezamen met Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer;

      essentiële onderdelen van het nationale verkeers- en vervoerplan: de nationale doelstellingen en de andere
      onderdelen van het nationale verkeers- en vervoerbeleid, die in dit plan als zodanig worden aangemerkt;

      essentiële onderdelen van het provinciale verkeers- en vervoerplan: provinciale doelstellingen en andere onderdelen
      van het provinciale verkeers- en vervoerbeleid die een uitwerking vormen van de essentiële onderdelen van het
      nationale verkeers- en vervoerplan.
    url: https://wetten.overheid.nl/BWBR0009642/2009-12-22#Artikel1
  - number: '2'
    text: |-
      1 Er is een nationaal verkeers- en vervoerplan, dat richting geeft aan de te nemen beslissingen inzake verkeer en
      vervoer. Voor zover een nationaal verkeers- en vervoersplan het karakter heeft van een structuurvisie, wordt dit in
      het plan bepaald en is [artikel 2.3 van de Wet ruimtelijke ordening][ref1] hierop van toepassing.

      2 Het nationale verkeers- en vervoerplan wordt voorbereid door Onze Minister, die daartoe in overleg treedt met
      gedeputeerde staten en de colleges van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0009642/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2.3'
  - number: '3'
    text: |-
      1 Het plan bevat de hoofdzaken van het nationale verkeers- en vervoerbeleid.

      2 In het plan wordt rekening gehouden met de mogelijke economische, milieu-, ruimtelijke en maatschappelijke
      ontwikkelingen, alsmede met de van belang zijnde internationale ontwikkelingen.

      3 Het plan bevat in ieder geval:

      a. de essentiële onderdelen van het nationale verkeers- en vervoerbeleid;

      b. een beschrijving van de te verwachten activiteiten van Rijk, provincies en gemeenten;

      c. de afstemming met aangrenzende beleidsterreinen, zoals economie en milieu;

      d. de fasering, de prioriteitsstelling en een indicatie van de bekostiging van de uitvoering;

      e. de termijn waarbinnen het provinciale plan moet worden vastgesteld of herzien.
    url: https://wetten.overheid.nl/BWBR0009642/2009-12-22#Artikel3
  - number: '4'
    text: |-
      1 Het door het Rijk te voeren beleid wordt neergelegd in een afzonderlijk hoofdstuk van het nationale verkeers-
      en vervoerplan.

      2 Het Meerjarenprogramma Infrastructuur en Transport, bedoeld in [artikel 4 van de Wet Infrastructuurfonds][ref1],
      geldt tevens als uitvoeringsprogramma van het in het eerste lid bedoelde hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0006001#Artikel4
    url: https://wetten.overheid.nl/BWBR0009642/2009-12-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006001
        artikel: '4'
  - number: '5'
    text: |-
      1 Provinciale staten stellen een of meer provinciale verkeers- en vervoersplannen vast, die richting geven aan de
      door provinciale staten en gedeputeerde staten te nemen beslissingen inzake verkeer en vervoer. Provinciale staten
      nemen hierbij de essentiële onderdelen van het nationale verkeers- en vervoersplan in acht.

      2 Het plan bevat de hoofdzaken van het door de provincie te voeren verkeers- en vervoerbeleid.

      3 Het plan bevat in ieder geval:

      a. de uitwerking van de essentiële onderdelen van het nationale verkeers- en vervoerplan;

      b. de afstemming met andere beleidsterreinen, zoals ruimtelijke ordening, economie en milieu;

      c. de fasering, de prioriteitsstelling en een indicatie van de bekostiging van de uitvoering en van de voor
      gemeenten beschikbare middelen;

      d. de termijn waarvoor het plan geldt;

      e. de termijn waarbinnen het gemeentelijk beleid in overeenstemming moet zijn gebracht met het plan.

      4 Voor afloop van de in het derde lid, onder d, bedoelde termijn stellen provinciale staten een nieuw provinciaal
      verkeers- en vervoerplan vast.

      5 In het plan geven provinciale staten in ieder geval aan, in hoeverre het voorgenomen beleid leidt
      tot aanpassing van het provinciale ruimtelijke beleid of het provinciale milieubeleid en in hoeverre
      en binnen welke termijn zij voornemens zijn een of meer geldende structuurvisies als bedoeld in
      [artikel 2.2 van de Wet ruimtelijke ordening][ref1], het geldende provinciale milieubeleidsplan, bedoeld in
      [artikel 4.9, eerste lid, van de Wet milieubeheer][ref2], of het geldende regionale waterplan, bedoeld in
      [artikel 4.4 van de Waterwet][ref3], te herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel4.9
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel4.4
    url: https://wetten.overheid.nl/BWBR0009642/2009-12-22#Artikel5
    references:
      - id: ref1
