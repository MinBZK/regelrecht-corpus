preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voor het voeren van een samenhangend verkeers- en
    vervoerbeleid, waarbij de drie bestuurslagen zijn betrokken, een planstructuur te introduceren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: Onze Minister: Onze Minister van Verkeer en
      Waterstaat; Onze Ministers: Onze Minister van Verkeer en Waterstaat tezamen met Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer; essentiële onderdelen van het nationale verkeers- en vervoerplan: de
      nationale doelstellingen en de andere onderdelen van het nationale verkeers- en vervoerbeleid, die in dit plan
      als zodanig worden aangemerkt; essentiële onderdelen van het provinciale verkeers- en vervoerplan: provinciale
      doelstellingen en andere onderdelen van het provinciale verkeers- en vervoerbeleid die een uitwerking vormen van de
      essentiële onderdelen van het nationale verkeers- en vervoerplan.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel1
  - number: '2.1'
    text: |-
      Er is een nationaal verkeers- en vervoerplan, dat richting geeft aan de te nemen beslissingen inzake verkeer en
      vervoer. Voor zover een nationaal verkeers- en vervoersplan het karakter heeft van een structuurvisie, wordt dit in
      het plan bepaald en is [artikel 2.3 van de Wet ruimtelijke ordening][ref1] hierop van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2'
  - number: '2.2'
    text: |-
      Het nationale verkeers- en vervoerplan wordt voorbereid door Onze Minister, die daartoe in overleg treedt met
      gedeputeerde staten en de colleges van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel2
  - number: '3.1'
    text: Het plan bevat de hoofdzaken van het nationale verkeers- en vervoerbeleid.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel3
  - number: '3.2'
    text: |-
      In het plan wordt rekening gehouden met de mogelijke economische, milieu-, ruimtelijke en maatschappelijke
      ontwikkelingen, alsmede met de van belang zijnde internationale ontwikkelingen.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel3
  - number: '3.3'
    text: 'Het plan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel3
  - number: 3.3.a
    text: de essentiële onderdelen van het nationale verkeers- en vervoerbeleid;
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel3
  - number: 3.3.b
    text: een beschrijving van de te verwachten activiteiten van Rijk, provincies en gemeenten;
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel3
  - number: 3.3.c
    text: de afstemming met aangrenzende beleidsterreinen, zoals economie en milieu;
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel3
  - number: 3.3.d
    text: de fasering, de prioriteitsstelling en een indicatie van de bekostiging van de uitvoering;
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel3
  - number: 3.3.e
    text: de termijn waarbinnen het provinciale plan moet worden vastgesteld of herzien.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het door het Rijk te voeren beleid wordt neergelegd in een afzonderlijk hoofdstuk van het nationale verkeers- en
      vervoerplan.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het Meerjarenprogramma Infrastructuur en Transport, bedoeld in [artikel 4 van de Wet Infrastructuurfonds][ref1],
      geldt tevens als uitvoeringsprogramma van het in het eerste lid bedoelde hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0006001#Artikel4
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006001
        artikel: '4'
  - number: '5.1'
    text: |-
      Provinciale staten stellen een of meer provinciale verkeers- en vervoersplannen vast, die richting geven aan de
      door provinciale staten en gedeputeerde staten te nemen beslissingen inzake verkeer en vervoer. Provinciale staten
      nemen hierbij de essentiële onderdelen van het nationale verkeers- en vervoersplan in acht.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel5
  - number: '5.2'
    text: Het plan bevat de hoofdzaken van het door de provincie te voeren verkeers- en vervoerbeleid.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel5
  - number: '5.3'
    text: 'Het plan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel5
  - number: 5.3.a
    text: de uitwerking van de essentiële onderdelen van het nationale verkeers- en vervoerplan;
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel5
  - number: 5.3.b
    text: de afstemming met andere beleidsterreinen, zoals ruimtelijke ordening, economie en milieu;
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel5
  - number: 5.3.c
    text: |-
      de fasering, de prioriteitsstelling en een indicatie van de bekostiging van de uitvoering en van de voor gemeenten
      beschikbare middelen;
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel5
  - number: 5.3.d
    text: de termijn waarvoor het plan geldt;
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel5
  - number: 5.3.e
    text: de termijn waarbinnen het gemeentelijk beleid in overeenstemming moet zijn gebracht met het plan.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel5
  - number: '5.4'
    text: |-
      Voor afloop van de in het derde lid, onder d, bedoelde termijn stellen provinciale staten een nieuw provinciaal
      verkeers- en vervoerplan vast.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel5
  - number: '5.5'
    text: |-
      In het plan geven provinciale staten in ieder geval aan, in hoeverre het voorgenomen beleid leidt
      tot aanpassing van het provinciale ruimtelijke beleid of het provinciale milieubeleid en in hoeverre
      en binnen welke termijn zij voornemens zijn een of meer geldende structuurvisies als bedoeld in
      [artikel 2.2 van de Wet ruimtelijke ordening][ref1], het geldende provinciale milieubeleidsplan, bedoeld in
      [artikel 4.9, eerste lid, van de Wet milieubeheer][ref2], of het geldende regionale waterplan, bedoeld in
      [artikel 4.4 van de Waterwet][ref3], te herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel4
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '4'
  - number: '6.1'
    text: |-
      Gedeputeerde staten betrekken bij de voorbereiding van het provinciale verkeers- en vervoersplan de naar hun
      oordeel meest belanghebbende bestuursorganen. Daartoe behoren in ieder geval Onze Minister, de colleges van
      burgemeester en wethouders, gedeputeerde staten van de aangrenzende provincies en de besturen van waterschappen die
      tevens wegbeheerder zijn.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel6
  - number: '6.2'
    text: |-
      Op de voorbereiding van het provinciale verkeers- en vervoerplan is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '8'
    text: |-
      De gemeenteraad onderscheidenlijk het college van burgemeester en wethouders dragen zorg voor het – zichtbaar –
      voeren van een samenhangend en uitvoeringsgericht verkeers- en vervoersbeleid, dat richting geeft aan de door de
      raad en het college te nemen beslissingen inzake verkeer en vervoer. De gemeenteraad onderscheidenlijk het college
      van burgemeester en wethouders neemt hierbij de essentiële onderdelen van het nationale verkeers- en vervoerplan en
      van het provinciale verkeers- en vervoerplan in acht en houdt rekening met het beleid van naburige gemeenten.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel8
  - number: '9'
    text: 'Het plan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel9
  - number: 9.a
    text: |-
      de uitwerking van de essentiële onderdelen van het nationale verkeers- en vervoerplan en van het provinciale
      verkeers- en vervoerplan;
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel9
  - number: 9.b
    text: de afstemming met andere beleidsterreinen, zoals ruimtelijke ordening, economie en milieu;
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel9
  - number: 9.c
    text: de fasering, de prioriteitsstelling en een indicatie van de bekostiging;
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel9
  - number: 9.d
    text: de termijn waarvoor het plan geldt.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel9
  - number: '10.1'
    text: |-
      De gemeenteraad onderscheidenlijk het college van burgemeester en wethouders betrekt bij de voorbereiding van het
      gemeentelijk verkeers- en vervoerbeleid of van het gemeentelijk verkeers- en vervoerplan de naar zijn oordeel meest
      belanghebbende bestuursorganen en stelt hen op de hoogte van het door de gemeenteraad onderscheidenlijk het college
      te voeren beleid. Daartoe behoren in ieder geval gedeputeerde staten van de provincie, de colleges van burgemeester
      en wethouders van de aangrenzende gemeenten, de besturen van betrokken waterschappen die tevens wegbeheerder zijn
      en, in voorkomende gevallen, Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel10
  - number: '10.2'
    text: |-
      Op de voorbereiding van het gemeentelijk verkeers- en vervoerplan is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '10.3'
    text: |-
      Voor zover het gemeentelijk verkeers- en vervoerbeleid gevolgen heeft voor het ruimtelijk beleid, geeft de
      gemeenteraad onderscheidenlijk het college van burgemeester en wethouders in ieder geval aan binnen welke termijn
      de daarvoor aangewezen procedures op basis van de [Wet ruimtelijke ordening][ref1] in gang gezet worden.


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: '12.1'
    text: |-
      Met het oog op de uitvoering van het nationale verkeers- en vervoerplan, de provinciale verkeers- en vervoerplannen
      en het verkeers- en vervoerbeleid van gemeenten kunnen bestuurlijke overeenkomsten worden gesloten. De noodzaak
      daartoe kan in het nationale of provinciale verkeers- en vervoerplan of in het gemeentelijke beleid worden
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel12
  - number: '12.2'
    text: |-
      Voor het geval bestuurlijke overeenkomsten niet tot stand komen, kan ieder der betrokken bestuursorganen zich
      wenden tot een door Onze Minister in te stellen commissie. De leden van deze commissie worden benoemd op voordracht
      van Rijk, provincies en gemeenten.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel12
  - number: '13.1'
    text: |-
      Ten behoeve van de onderlinge afstemming van het verkeers- en vervoerbeleid van Rijk, provincies en gemeenten en de
      uitvoering daarvan is er op nationaal en provinciaal niveau een verkeers- en vervoerberaad.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel13
  - number: '13.2'
    text: |-
      Onze Minister draagt zorg voor de organisatie van het verkeers- en vervoerberaad op nationaal niveau en
      gedeputeerde staten dragen zorg voor de organisatie van het verkeers- en vervoerberaad op provinciaal niveau.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel13
  - number: '14'
    text: |-
      Onze Minister doet jaarlijks verslag van zijn bevindingen met betrekking tot de voortgang van de uitvoering van
      het nationale verkeers- en vervoerplan en verbindt daar conclusies aan. Hij maakt daarbij gebruik van de gegevens
      van provincies en gemeenten over de voortgang van de uitvoering van provinciale verkeers- en vervoerplannen en het
      gemeentelijk verkeers- en vervoerbeleid. Dit verslag maakt deel uit van het Meerjarenprogramma Infrastructuur en
      Transport als bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel4
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009642
        artikel: '4'
        paragraaf: '2'
  - number: '15'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel15
  - number: '16.1'
    text: |-
      Het bestuur van een openbaar lichaam als bedoeld in [artikel 20, derde lid, van de Wet personenvervoer 2000][ref1],
      stelt een regionaal verkeer- en vervoerplan vast, dat richting geeft aan de voor het krachtens artikel 20, derde
      lid, van de Wet personenvervoer aangewezen gebied te nemen beslissingen inzake verkeer en vervoer. Het bestuur
      neemt hierbij de essentiële onderdelen van het nationale verkeers- en vervoerplan in acht, evenals de essentiële
      onderdelen van het provinciale verkeers- en vervoerplan, voor zover die betrekking hebben op de bovenregionale
      samenhang.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
  - number: '16.2'
    text: |-
      Voor een openbaar lichaam als bedoeld in het eerste lid is de onderhavige wet van overeenkomstige toepassing, met
      dien verstande, dat:
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel16
  - number: 16.2.a
    text: |-
      voor de toepassing van de [artikelen 2, tweede lid][ref1], [12][ref2], [13, eerste lid][ref3], en [14][ref4],
      openbare lichamen als bedoeld in [artikel 20, derde lid van de Wet personenvervoer 2000][ref5] gelijkgesteld worden
      met provincies;


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009642#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0009642#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0009642#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009642
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009642
        artikel: '12'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009642
        artikel: '13'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0009642
        artikel: '14'
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0011470
        artikel: '20'
  - number: 16.2.b
    text: |-
      voor de toepassing van [artikel 3, derde lid, onderdeel b][ref1], na «provincies» ingevoegd wordt:, openbare
      lichamen;


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel3
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009642
        artikel: '3'
        paragraaf: '2'
  - number: 16.2.c
    text: |-
      het in [artikel 5][ref1] bedoelde provinciale verkeers- en vervoerplan uitsluitend betrekking heeft op het
      krachtens [artikel 20, derde lid, van de Wet personenvervoer 2000][ref2] aangewezen gebied voor zover daarin
      essentiële onderdelen van beleid zijn opgenomen die noodzakelijk zijn voor de bovenregionale samenhang en het
      bestuur van de provincie over deze onderdelen overleg heeft gevoerd met het bestuur van het openbaar lichaam;


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009642
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '20'
  - number: 16.2.d
    text: |-
      in [artikel 6, eerste lid, tweede volzin][ref1], na «provincies» ingevoegd wordt:, alsmede het bestuur van het in de
      provincie bestaand openbaar lichaam als bedoeld in [artikel 20, derde lid, van de Wet personenvervoer 2000][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009642
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '20'
  - number: 16.2.e
    text: |-
      de [artikelen 8][ref1] en [10][ref2] niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009642#Artikel10
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009642
        artikel: '8'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009642
        artikel: '10'
        paragraaf: '4'
  - number: '18'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel18
  - number: '19'
    text: 'Deze wet wordt aangehaald als: Planwet verkeer en vervoer.'
    url: https://wetten.overheid.nl/BWBR0009642/2015-01-01#Artikel19
