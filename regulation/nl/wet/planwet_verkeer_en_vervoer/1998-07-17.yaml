$id: planwet_verkeer_en_vervoer
regulatory_layer: WET
publication_date: '2020-06-17'
valid_from: '1998-07-17'
bwb_id: BWBR0009642
url: https://wetten.overheid.nl/BWBR0009642/1998-07-17
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voor het voeren van een samenhangend verkeers- en
    vervoerbeleid, waarbij de drie bestuurslagen zijn betrokken, een planstructuur te introduceren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: Onze Minister: Onze Minister van Verkeer en
      Waterstaat; Onze Ministers: Onze Minister van Verkeer en Waterstaat tezamen met Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer; essentiële onderdelen van het nationale verkeers- en vervoerplan: de
      nationale doelstellingen en de andere onderdelen van het nationale verkeers- en vervoerbeleid, die in dit plan
      als zodanig worden aangemerkt; essentiële onderdelen van het provinciale verkeers- en vervoerplan: provinciale
      doelstellingen en andere onderdelen van het provinciale verkeers- en vervoerbeleid die een uitwerking vormen van de
      essentiële onderdelen van het nationale verkeers- en vervoerplan.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel1
  - number: '2.1'
    text: |-
      Er is een nationaal verkeers- en vervoerplan, dat richting geeft aan de te nemen beslissingen inzake verkeer en
      vervoer. Het plan is een plan als bedoeld in [artikel 2a van de Wet op de Ruimtelijke Ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel2a
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 2a
  - number: '2.2'
    text: |-
      Het nationale verkeers- en vervoerplan wordt voorbereid door Onze Minister, die daartoe in overleg treedt met
      de besturen van provincies en gemeenten. Na afloop van dit overleg doen Onze Ministers aan de Staten-Generaal
      mededeling van het voornemen tot voorbereiding van het nationale verkeers- en vervoerplan als bedoeld in
      [artikel 2a, eerste lid, vierde volzin, van de Wet op de Ruimtelijke Ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel2a
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 2a
  - number: '3.1'
    text: Het plan bevat de hoofdzaken van het nationale verkeers- en vervoerbeleid.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel3
  - number: '3.2'
    text: |-
      In het plan wordt rekening gehouden met de mogelijke economische, milieu-, ruimtelijke en maatschappelijke
      ontwikkelingen, alsmede met de van belang zijnde internationale ontwikkelingen.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel3
  - number: '3.3'
    text: 'Het plan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel3
  - number: 3.3.a
    text: de essentiële onderdelen van het nationale verkeers- en vervoerbeleid;
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel3
  - number: 3.3.b
    text: een beschrijving van de te verwachten activiteiten van Rijk, provincies en gemeenten;
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel3
  - number: 3.3.c
    text: de afstemming met aangrenzende beleidsterreinen, zoals economie en milieu;
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel3
  - number: 3.3.d
    text: de fasering, de prioriteitsstelling en een indicatie van de bekostiging van de uitvoering;
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel3
  - number: 3.3.e
    text: de termijn waarbinnen het provinciale plan moet worden vastgesteld of herzien.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel3
  - number: '4.1'
    text: |-
      Het door het Rijk te voeren beleid wordt neergelegd in een afzonderlijk hoofdstuk van het nationale verkeers- en
      vervoerplan.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel4
  - number: '4.2'
    text: |-
      Het Meerjarenprogramma Infrastructuur en Transport, bedoeld in [artikel 4 van de Wet Infrastructuurfonds][ref1],
      geldt tevens als uitvoeringsprogramma van het in het eerste lid bedoelde hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0006001#Artikel4
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006001
        artikel: '4'
  - number: '5.1'
    text: |-
      Het provinciaal bestuur stelt een of meer provinciale verkeers- en vervoerplannen vast, die richting geven aan
      de door de provincie te nemen beslissingen inzake verkeer en vervoer. Het provinciaal bestuur neemt hierbij de
      essentiële onderdelen van het nationale verkeers- en vervoerplan in acht.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel5
  - number: '5.2'
    text: Het plan bevat de hoofdzaken van het door de provincie te voeren verkeers- en vervoerbeleid.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel5
  - number: '5.3'
    text: 'Het plan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel5
  - number: 5.3.a
    text: de uitwerking van de essentiële onderdelen van het nationale verkeers- en vervoerplan;
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel5
  - number: 5.3.b
    text: de afstemming met andere beleidsterreinen, zoals ruimtelijke ordening, economie en milieu;
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel5
  - number: 5.3.c
    text: |-
      de fasering, de prioriteitsstelling en een indicatie van de bekostiging van de uitvoering en van de voor gemeenten
      beschikbare middelen;
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel5
  - number: 5.3.d
    text: de termijn waarvoor het plan geldt;
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel5
  - number: 5.3.e
    text: de termijn waarbinnen het gemeentelijk beleid in overeenstemming moet zijn gebracht met het plan.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel5
  - number: '5.4'
    text: |-
      Voor afloop van de in het derde lid, onder d, bedoelde termijn stelt het provinciaal bestuur een nieuw provinciaal
      verkeers- en vervoerplan vast.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel5
  - number: '5.5'
    text: |-
      In het plan geeft het provinciaal bestuur in ieder geval aan, in hoeverre het voorgenomen beleid
      leidt tot aanpassing van het provinciale ruimtelijke beleid of het provinciale milieubeleid en in
      hoeverre en binnen welke termijn het voornemens is een of meer geldende streekplannen als bedoeld in
      [artikel 4a, eerste lid, van de Wet op de Ruimtelijke Ordening][ref1], het geldende provinciale milieubeleidsplan,
      bedoeld in [artikel 4.9, eerste lid, van de Wet milieubeheer][ref2], of het geldende provinciale plan voor de
      waterhuishouding, bedoeld in [artikel 7, eerste lid, van de Wet op de waterhuishouding][ref3], te herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004575#Artikel7
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0004575
        artikel: '7'
  - number: '6.1'
    text: |-
      Het provinciaal bestuur betrekt bij de voorbereiding van het provinciale verkeers- en vervoerplan de naar zijn
      oordeel meest belanghebbende bestuursorganen. Daartoe behoren in ieder geval Onze Minister, de besturen van
      gemeenten, van de aangrenzende provincies en van waterschappen die tevens wegbeheerder zijn.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel6
  - number: '6.2'
    text: |-
      Op de voorbereiding van het provinciale verkeers- en vervoerplan is de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '6.3'
    text: |-
      Zo spoedig mogelijk na de bekendmaking wordt het vastgestelde of herziene provinciale verkeers- en vervoerplan
      voor een ieder ter inzage gelegd in het provinciehuis. [Artikel 3:12 van de Algemene wet bestuursrecht][ref1] is
      van overeenkomstige toepassing. Van het vastgestelde of herziene provinciale verkeers- en vervoerplan wordt tevens
      mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '7.1'
    text: |-
      Onze Minister kan het provinciaal bestuur een aanwijzing geven omtrent de inhoud van het provinciale verkeers-
      en vervoerplan. De aanwijzing kan alleen worden gegeven voorzover het een essentieel onderdeel van het nationale
      verkeers- en vervoerplan betreft. De aanwijzing wordt slechts gegeven nadat tevoren met het provinciaal bestuur
      terzake overleg is gepleegd.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel7
  - number: '7.2'
    text: |-
      Bij de aanwijzing stelt Onze Minister de termijn vast, waarbinnen het provinciale verkeers- en vervoerplan
      in overeenstemming dient te zijn gebracht met de aanwijzing. Onze Minister doet van het besluit, houdende de
      aanwijzing, mededeling aan de Staten-Generaal en publiceert het besluit in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel7
  - number: '8'
    text: |-
      Het gemeentebestuur draagt zorg voor het – zichtbaar – voeren van een samenhangend en uitvoeringsgericht verkeers-
      en vervoerbeleid, dat richting geeft aan de door het gemeentebestuur te nemen beslissingen inzake verkeer en
      vervoer. Het gemeentebestuur neemt hierbij de essentiële onderdelen van het nationale verkeers- en vervoerplan en
      van het provinciale verkeers- en vervoerplan in acht en houdt rekening met het beleid van naburige gemeenten.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel8
  - number: '9.1'
    text: |-
      Het provinciaal bestuur kan het gemeentebestuur de verplichting opleggen tot het vaststellen van een gemeentelijk
      verkeers- en vervoerplan indien het gemeentebestuur aantoonbaar nalatig is in de uitoefening van de hem
      in [artikel 8][ref1] opgedragen taak. De verplichting wordt niet eerder opgelegd dan nadat tevoren met het
      gemeentebestuur terzake overleg is gepleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel8
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009642
        artikel: '8'
        paragraaf: '4'
  - number: '9.2'
    text: 'Het plan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel9
  - number: 9.2.a
    text: |-
      de uitwerking van de essentiële onderdelen van het nationale verkeers- en vervoerplan en van het provinciale
      verkeers- en vervoerplan;
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel9
  - number: 9.2.b
    text: de afstemming met andere beleidsterreinen, zoals ruimtelijke ordening, economie en milieu;
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel9
  - number: 9.2.c
    text: de fasering, de prioriteitsstelling en een indicatie van de bekostiging;
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel9
  - number: 9.2.d
    text: de termijn waarvoor het plan geldt.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel9
  - number: '9.3'
    text: |-
      Bij het opleggen van de verplichting tot het vaststellen van een gemeentelijk verkeers- en vervoerplan stelt
      het provinciaal bestuur de termijn vast waarbinnen het plan moet worden vastgesteld. Het provinciaal bestuur kan
      hierbij tevens een aanwijzing geven als bedoeld in [artikel 11, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel11
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009642
        artikel: '11'
        paragraaf: '4'
  - number: '10.1'
    text: |-
      Het gemeentebestuur betrekt bij de voorbereiding van het gemeentelijk verkeers- en vervoerbeleid of van het
      gemeentelijk verkeers- en vervoerplan de naar zijn oordeel meest belanghebbende bestuursorganen en stelt hen op
      de hoogte van het door het gemeentebestuur te voeren beleid. Daartoe behoren in ieder geval het bestuur van de
      provincie, de besturen van aangrenzende gemeenten, de besturen van betrokken waterschappen die tevens wegbeheerder
      zijn en, in voorkomende gevallen, Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel10
  - number: '10.2'
    text: |-
      Op de voorbereiding van het gemeentelijk verkeers- en vervoerplan is de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] neergelegde procedure van toepassing. Zo spoedig mogelijk
      na de bekendmaking wordt het vastgestelde of herziene gemeentelijke verkeers- en vervoerplan voor een ieder ter
      inzage gelegd in het gemeentehuis. [Artikel 3:12 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '10.3'
    text: |-
      Voor zover het gemeentelijk verkeers- en vervoerbeleid gevolgen heeft voor het ruimtelijk beleid, geeft het
      gemeentebestuur in ieder geval aan binnen welke termijn de daarvoor aangewezen procedures op basis van de
      [Wet op de Ruimtelijke Ordening][ref1] in gang gezet worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002375
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002375
  - number: '11.1'
    text: |-
      Het provinciaal bestuur kan het gemeentebestuur een aanwijzing geven omtrent de inhoud van het gemeentelijk
      verkeers- en vervoerplan. De aanwijzing kan alleen worden gegeven voorzover het een essentieel onderdeel van het
      nationale of provinciale verkeers- en vervoerplan betreft. De aanwijzing wordt slechts gegeven nadat tevoren met
      het gemeentebestuur terzake overleg is gepleegd.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel11
  - number: '11.2'
    text: |-
      Bij de aanwijzing stelt het provinciaal bestuur de termijn vast, waarbinnen het gemeentelijk verkeers- en
      vervoerplan in overeenstemming dient te zijn gebracht met de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel11
  - number: '11.3'
    text: Het provinciaal bestuur doet van een besluit als bedoeld in het eerste lid, mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel11
  - number: '12.1'
    text: |-
      Met het oog op de uitvoering van het nationale verkeers- en vervoerplan, de provinciale verkeers- en vervoerplannen
      en het verkeers- en vervoerbeleid van gemeenten kunnen bestuurlijke overeenkomsten worden gesloten. De noodzaak
      daartoe kan in het nationale of provinciale verkeers- en vervoerplan of in het gemeentelijke beleid worden
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel12
  - number: '12.2'
    text: |-
      Voor het geval bestuurlijke overeenkomsten niet tot stand komen, kan ieder der betrokken bestuursorganen zich
      wenden tot een door Onze Minister in te stellen commissie. De leden van deze commissie worden benoemd op voordracht
      van Rijk, provincies en gemeenten.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel12
  - number: '13.1'
    text: |-
      Ten behoeve van de onderlinge afstemming van het verkeers- en vervoerbeleid van Rijk, provincies en gemeenten en de
      uitvoering daarvan is er op nationaal en provinciaal niveau een verkeers- en vervoerberaad.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel13
  - number: '13.2'
    text: |-
      Onze Minister draagt zorg voor de organisatie van het verkeers- en vervoerberaad op nationaal niveau en het
      provinciaal bestuur draagt zorg voor de organisatie van het verkeers- en vervoerberaad op provinciaal niveau.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel13
  - number: '14'
    text: |-
      Onze Minister doet jaarlijks verslag van zijn bevindingen met betrekking tot de voortgang van de uitvoering van
      het nationale verkeers- en vervoerplan en verbindt daar conclusies aan. Hij maakt daarbij gebruik van de gegevens
      van provincies en gemeenten over de voortgang van de uitvoering van provinciale verkeers- en vervoerplannen en het
      gemeentelijk verkeers- en vervoerbeleid. Dit verslag maakt deel uit van het Meerjarenprogramma Infrastructuur en
      Transport als bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel4
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009642
        artikel: '4'
        paragraaf: '2'
  - number: '15'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel15
  - number: '16'
    text: |-
      Indien in een samenwerkingsgebied als bedoeld in [artikel 1 van de Kaderwet bestuur in verandering][ref1] een
      regionaal openbaar lichaam bestaat als bedoeld in [artikel 1 van die wet][ref2], is de onderhavige wet van
      overeenkomstige toepassing, met dien verstande, dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006620#Artikel1
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006620
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006620
        artikel: '1'
  - number: 16.a
    text: |-
      voor de toepassing van de [artikelen 2, tweede lid][ref1], [3, derde lid, onder b][ref2], [12][ref3],
      [13, eerste lid][ref4], en [14][ref5] regionale openbare lichamen gelijkgesteld worden met provincies;


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009642#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009642#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0009642#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0009642#Artikel14
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009642
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009642
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009642
        artikel: '12'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0009642
        artikel: '13'
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0009642
        artikel: '14'
        paragraaf: '5'
  - number: 16.b
    text: |-
      voor de toepassing van [artikel 3, derde lid, onder a en b][ref1], na «provincies» ingevoegd wordt: ,regionale
      openbare lichamen;


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel3
    url: https://wetten.overheid.nl/BWBR0009642/1998-07-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009642
        artikel: '3'
        paragraaf: '2'
  - number: 16.c
    text: |-
