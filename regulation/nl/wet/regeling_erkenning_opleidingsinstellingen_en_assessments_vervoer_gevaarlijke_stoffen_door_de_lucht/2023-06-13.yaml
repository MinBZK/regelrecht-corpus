preamble:
  text: |-
    Gelet op de artikelen 6.55, zesde lid, en 6.56, derde lid, van de Wet luchtvaart;

    BESLUIT:
  url: https://wetten.overheid.nl/BWBR0047902/2023-06-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *assessment:* beoordeling van de geschiktheid van een persoon voor de uitvoering van zijn taken en
      verantwoordelijkheden horende bij zijn functie;
        - *erkende opleidingsinstelling:* door de minister erkende opleidingsinstelling voor het geven van opleidingen en
      het afnemen van assessments ter verkrijging van een certificaat inzake het vervoer van gevaarlijke stoffen door
      de lucht;
        - *erkenning:* erkenning als bedoeld in [artikel 6.56, eerste lid, van de Wet luchtvaart][ref1];
        - *minister:* Minister van Infrastructuur en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6.56
    url: https://wetten.overheid.nl/BWBR0047902/2023-06-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6.56'
  - number: '2'
    text: |-
      Een erkenning wordt aangevraagd door elektronische of schriftelijke indiening bij de minister van een volledig
      ingevuld en ondertekend aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0047902/2023-06-13#Artikel2
  - number: '3'
    text: |-
      De aanvraag voor een erkenning gaat vergezeld van:

      a. een verklaring waarin de aanvrager aangeeft dat de aangeleverde informatie juist is en dat de opleiding zal
      worden uitgevoerd in overeenstemming met deze regeling;

      b. een overzicht en de curricula vitae van de bij de opleiding betrokken instructeurs;

      c. een beschrijving van de accommodatie, theorie-instructievoorzieningen en theorie-assessmentorganisatie;

      d. een bewijs van beschikbaarheid van de vereiste opleidingsuitrusting, voorzieningen en instructeurs;

      e. een organogram van de aanvrager, inclusief een korte toelichting daarop, en

      f. een opleidingsprogramma bestaande uit minimaal een opleidingsplan, een opleidingssyllabus en een
      assessmentoverzicht, als bedoeld in [bijlage A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047902
    url: https://wetten.overheid.nl/BWBR0047902/2023-06-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0047902
  - number: '4'
    text: |-
      De minister verleent een erkenning indien de aanvrager:

      a. de aanvraag volledig en op de juiste wijze heeft ingediend;

      b. voldoet aan het gestelde in [bijlage A][ref1];

      c. wat betreft de inhoud van de opleidingen voldoet aan de eisen bedoeld in [bijlage B][ref2]; en

      d. wat betreft de assessments voldoet aan de eisen bedoeld in [hoofdstuk 3][ref3] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0047902
      [ref2]: https://wetten.overheid.nl/BWBR0047902
      [ref3]: https://wetten.overheid.nl/BWBR0047902#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0047902/2023-06-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0047902
      - id: ref2
        bwb_id: BWBR0047902
      - id: ref3
        bwb_id: BWBR0047902
        hoofdstuk: '3'
  - number: '5'
    text: |-
      Van een erkenning geeft de minister een bewijs af waarop is aangegeven voor welke opleiding de erkenning is
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0047902/2023-06-13#Artikel5
  - number: '6'
    text: |-
      Op de website van de Inspectie Leefomgeving en Transport wordt een overzicht van de afgegeven erkenningen
      gepubliceerd, met daarbij de volgende gegevens:

      a. de naam van de opleidingsinstelling; en

      b. een overzicht en omschrijving van de opleidingen die door de erkende opleidingsinstelling worden gegeven.
    url: https://wetten.overheid.nl/BWBR0047902/2023-06-13#Artikel6
  - number: '7'
    text: |-
      1 De [artikelen 3][ref1] en [4][ref2] zijn van toepassing op een wijziging van een erkenning, met dien verstande
      dat kan worden volstaan met de gegevens die voor de aangevraagde wijziging relevant zijn.

      2 De [artikelen 5][ref3] en [6][ref4] zijn van overeenkomstige toepassing op een wijziging van een erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0047902#Artikel3
