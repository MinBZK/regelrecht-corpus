  - number: '8'
    text: |-
      1 De assessments ter verkrijging van een certificaat als bedoeld in [artikel 9, eerste lid][ref1], worden
      uitgevoerd conform de toetsmatrijs in [bijlage B][ref2].

      2 De assessments worden uitgevoerd door een erkende opleidingsinstelling en kunnen worden bijgewoond door een door
      de minister aangewezen gecommitteerde.

      3 De minister kan een assessmentreglement vaststellen, met onder meer aanvullende voorwaarden omtrent de uitvoering
      van assessments.

      4 Een assessment is met goed gevolg afgelegd als ten minste tachtig procent van de vragen en opdrachten juist is
      beantwoord of uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0047902#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0047902
    url: https://wetten.overheid.nl/BWBR0047902/2023-06-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0047902
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0047902
  - number: '9'
    text: |-
      1 Wanneer de kandidaat een assessment met goed gevolg heeft afgelegd, verstrekt de erkende opleidingsinstelling de
      kandidaat een certificaat inzake het vervoer van gevaarlijke stoffen door de lucht.

      2 Op het certificaat worden in ieder geval vermeld voor welke erkenning als bedoeld in
      [artikel 9 van het Besluit vervoer gevaarlijke stoffen door de lucht][ref1], en voor welke taken en
      verantwoordelijkheden het certificaat is afgegeven, de behaalde score bij de assessments en de geldigheidsduur van
      het certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0013514#Artikel9
    url: https://wetten.overheid.nl/BWBR0047902/2023-06-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013514
        artikel: '9'
  - number: '10'
    text: |-
      Een certificaat als bedoeld in [artikel 9][ref1] wordt afgegeven voor een periode van 24 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0047902#Artikel9
    url: https://wetten.overheid.nl/BWBR0047902/2023-06-13#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0047902
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '11'
    text: |-
      1 Een erkenning als bedoeld in [artikel 2][ref1] afgegeven vóór de inwerkingtreding van onderhavige regelingingevolge
      de [Regeling erkenning opleidingsinstellingen en examinering vervoer gevaarlijke stoffen door de lucht][ref2],
      wordt geacht te zijn afgegeven conform deze regeling met dien verstande dat:

      a. het opleidingsprogramma per 1 juli 2023 voldoet aan de opleidingseisen uit [bijlage B][ref3];

      b. de vóór de inwerkingtreding van onderhavige regeling erkende opleidingsinstelling tot 1 juli 2023 op verzoek van
      de minister een assessmentoverzicht als bedoeld in [Bijlage A][ref4], kan overleggen.

      2 De [Regeling erkenning opleidingsinstellingen en examinering vervoer gevaarlijke stoffen door de lucht][ref5]
      zoals deze luidde tot aan de inwerkingtreding van deze regeling blijft tot 1 juli 2023 van toepassing op de
      opleiding van personen bedoeld in [bijlage B][ref6] door reeds vóór de inwerkingtreding van onderhavige regeling
      erkende opleidingsinstellingen.

      3 Een certificaat als bedoeld in [artikel 9][ref7] dat zijn geldigheid niet heeft
      verloren, behoudt vanaf de inwerkingtreding van deze regeling zijn geldigheid voor
      zover gedurende die periode de geldigheidsduur overeenkomstig de voorwaarden waaronder
      het certificaat is afgegeven niet is verlopen, en voor zover aan hetgeen ingevolge de
      [Regeling erkenning opleidingsinstellingen en examinering vervoer gevaarlijke stoffen door de lucht][ref8], zoals
      deze gold voor de inwerkingtreding van deze regeling, is voldaan.


