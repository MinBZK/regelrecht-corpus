    text: |-
      1 Deze regeling treedt in werking met ingang van 1 april 2023.

      2 In afwijking van het eerste lid treedt onderdeel IV van [Bijlage B][ref1] bij de Regeling erkenning
      opleidingsinstellingen en assessments vervoer gevaarlijke stoffen door de lucht in werking op het tijdstip waarop
      het Besluit tot wijziging van het Besluit vervoer gevaarlijke stoffen door de lucht in verband met de introductie
      van de D-erkenning inzake het vervoer van gevaarlijke stoffen door de lucht en enkele andere aanpassingen in
      werking treedt.


