preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat er met het oog op de naleving van Europeesrechtelijke verplichtingen
    een voorziening beschikbaar dient te zijn waarmee effectief uitvoering kan worden gegeven aan een besluit van de
    Europese Commissie tot terugvordering van staatssteun, en het derhalve wenselijk is te voorzien in een algemene
    wettelijke grondslag en regels voor de terugvordering van staatssteun;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0040718/2018-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *begunstigde:* onderneming in de zin van de artikelen 101, eerste lid, en 107, eerste lid, van het Verdrag
      betreffende de werking van de Europese Unie, die staatssteun ontvangt als gevolg van een steunmaatregel als bedoeld
      in laatstgenoemd artikelonderdeel;
        - *beschikking tot betaling:* beschikking die verplicht tot betaling van een geldsom;
        - *bestuursorgaan dat het aangaat:* a. bestuursorgaan dat de desbetreffende staatssteun heeft verstrekt;
      b. bestuursorgaan dat verantwoordelijk is voor: 1°. de verstrekking van de desbetreffende staatssteun door
      de publiekrechtelijke rechtspersoon waarvan het deel uitmaakt, of 2°. het direct of indirect uitoefenen van
      overheidszeggenschap in de privaatrechtelijke rechtspersoon die de staatssteun heeft verstrekt of in de niet
      krachtens het publiekrecht ingestelde entiteit door middel waarvan de staatssteun is verstrekt, en er geen ander
      bestuursorgaan met een dergelijke verantwoordelijkheid is dat reeds uitvoering geeft of heeft gegeven aan het
      desbetreffende Commissiebesluit; c. bestuursorgaan dat belast is met de uitvoering van de wet- of regelgeving die
      rechtstreeks tot de verstrekking van de desbetreffende staatssteun heeft geleid;
        - *Commissiebesluit:* terugvorderingsbevel of terugvorderingsbesluit van de Europese Commissie in de zin
      van artikel 13, tweede lid, van de procedureverordening, onderscheidenlijk artikel 16, eerste lid, van de
      procedureverordening, of een rechtstreeks op artikel 108, derde lid, van het Verdrag betreffende de werking van de
      Europese Unie gebaseerd besluit van de Europese Commissie dat verplicht tot terugvordering;
        - *procedureverordening:* Verordening (EU) 2015/1589 van de Raad van 13 juli 2015 tot vaststelling van nadere
      bepalingen voor de toepassing van artikel 108 van het Verdrag betreffende de werking van de Europese Unie (PbEU
      2015, L 248).
    url: https://wetten.overheid.nl/BWBR0040718/2018-07-01#Artikel1
  - number: '2'
    text: |-
      1 De terugvordering van staatssteun die ingevolge een Commissiebesluit moet worden teruggevorderd, geschiedt
      uitsluitend op grond en met inachtneming van het bepaalde in deze wet.

      2 Indien ingevolge een Commissiebesluit staatssteun dient te worden teruggevorderd
      en die staatssteun voortvloeit uit de toepassing van een belastingwet als bedoeld in
      [artikel 2, eerste lid, onderdeel a, van de Algemene wet inzake rijksbelastingen][ref1]
      of de [Invorderingswet 1990][ref2], wordt die staatssteun voor zover mogelijk met
      toepassing van [hoofdstuk IVbis van de Algemene wet inzake rijksbelastingen][ref3] of
      [hoofdstuk VIIbis van de Invorderingswet 1990][ref4] teruggevorderd en ingevorderd.

      3 Onder staatssteun die voortvloeit uit de toepassing van een belastingwet als bedoeld in het tweede lid wordt voor
      de toepassing van deze wet tevens verstaan staatssteun die voortvloeit uit belastingen die worden geheven op grond
      van de [Provinciewet][ref5], de [Gemeentewet][ref6] of de [Waterschapswet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
