  - number: '3'
    text: |-
      1 Het bestuursorgaan dat het aangaat vordert de ingevolge een Commissiebesluit van een begunstigde terug te
      vorderen staatssteun terug door het geven van een tot die begunstigde gerichte beschikking tot betaling.

      2 Voor zover het Commissiebesluit de hoogte van de rente die deel uitmaakt van de terug te vorderen staatssteun
      niet bepaalt, wordt de rente berekend overeenkomstig het bepaalde bij of krachtens de artikelen 16, tweede lid, en
      33, onderdeel e, van de procedureverordening.

      3 In de beschikking tot betaling bepaalt het bestuursorgaan dat het aangaat dat nog openstaande
      betalingsverplichtingen jegens de desbetreffende begunstigde vervallen, indien naleving ervan zou leiden tot de
      verstrekking van gelijksoortige staatssteun als op grond van het Commissiebesluit moet worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0040718/2018-07-01#Artikel3
  - number: '4'
    text: |-
      Een begunstigde die de op de verstrekking van staatssteun betrekking hebbende of met die verstrekking samenhangende
      informatie niet gedurende de termijn, bedoeld in artikel 17, eerste en tweede lid, van de procedureverordening,
      heeft bewaard, kan zich voor de toepassing van deze wet niet beroepen op krachtens Nederlands recht geldende
      verjarings-, bewaar- of vernietigingstermijnen.
    url: https://wetten.overheid.nl/BWBR0040718/2018-07-01#Artikel4
  - number: '5'
    text: |-
      1 De [afdelingen 4.4.2][ref1], met uitzondering van [artikel 4:97][ref2], en
      [4.4.3 van de Algemene wet bestuursrecht][ref3] zijn niet van toepassing op een geldschuld vastgesteld bij een
      beschikking tot betaling als bedoeld in [artikel 3, eerste lid][ref4].

      2 Het bestuursorgaan dat het aangaat kan de door een begunstigde te betalen geldsom invorderen bij dwangbevel.

      3 Een door het bestuursorgaan dat het aangaat geïnde geldsom komt toe aan de rechtspersoon die de desbetreffende
      staatssteun heeft verstrekt of waartoe het bestuursorgaan behoort dat de desbetreffende staatssteun heeft
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.4.2
