  - number: '8'
    text: |-
      Indien voor de inwerkingtreding van [artikel 2][ref1] al rechtshandelingen zijn verricht ter uitvoering van een
      Commissiebesluit, is op die terugvordering de verplichting van artikel 2, eerste lid, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040718#Artikel2
