  - number: '6'
    text: |-
      Het bestuursorgaan dat het besluit tot verstrekking van staatssteun heeft genomen dan wel het bestuursorgaan dat
      belast is met de uitvoering van de wet- of regelgeving die rechtstreeks tot de verstrekking van de desbetreffende
      staatssteun heeft geleid, kan in verband met de terugvordering van die staatssteun op grond van deze wet, ter
      nadere regeling van de rechtsverhouding met een begunstigde besluiten tot het ambtshalve wijzigen of intrekken
      van een aan een begunstigde gegeven beschikking dan wel tot het ambtshalve geven van een beschikking aan een
      begunstigde.
    url: https://wetten.overheid.nl/BWBR0040718/2018-07-01#Artikel6
  - number: '7'
    text: |-
      1 Indien er geen sprake is van een Commissiebesluit, is een bestuursorgaan gehouden een door hem gegeven
      beschikking te wijzigen, indien die beschikking in strijd met artikel 108, derde lid, van het Verdrag betreffende
      de werking van de Europese Unie is vastgesteld.

      2 Bij de toepassing van het eerste lid is rente verschuldigd over het te vorderen bedrag die wordt berekend
      overeenkomstig het bepaalde bij of krachtens de artikelen 16, tweede lid, en 33, onderdeel e, van de
      procedureverordening.

      3 [Artikel 4:57, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige
      toepassing en de [afdelingen 4.4.2][ref2], met uitzondering van [artikel 4:97][ref3], en
      [4.4.3 van de Algemene wet bestuursrecht][ref4] zijn niet van toepassing. Uit de toepassing van
      een belastingwet voortvloeiende staatssteun als bedoeld in [artikel 2, tweede en derde lid][ref5],
      of staatssteun die voortvloeit uit de toepassing van de [Invorderingswet 1990][ref6] kan
      ter uitvoering van het eerste lid teruggevorderd en ingevorderd worden met overeenkomstige
      toepassing van [hoofdstuk IVbis van de Algemene wet inzake rijksbelastingen][ref7] of
      [hoofdstuk VIIbis van de Invorderingswet 1990][ref8].

      4 In het geval staatssteun voortvloeit uit een overeenkomst naar Nederlands recht en die staatsteun ongedaan
      gemaakt wordt wegens strijd met artikel 108, derde lid, van het Verdrag betreffende de werking van de Europese
      Unie, is, indien er geen sprake is van een Commissiebesluit, het tweede lid van overeenkomstige toepassing op de
      rente over het ongedaan te maken staatssteunbedrag.


