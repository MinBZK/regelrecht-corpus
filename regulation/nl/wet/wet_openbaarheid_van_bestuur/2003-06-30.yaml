preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede gelet op artikel 110 van de Grondwet, met het oog op een goede
    en democratische bestuursvoering wenselijk is gebleken de regelen met betrekking tot de openheid en openbaarheid
    van bestuur aan te passen en deze zoveel mogelijk in de wet op te nemen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. document: een bij een bestuursorgaan berustend schriftelijk stuk of ander materiaal dat gegevens bevat;

      b. bestuurlijke aangelegenheid: een aangelegenheid die betrekking heeft op beleid van een bestuursorgaan, daaronder
      begrepen de voorbereiding en de uitvoering ervan;

      c. intern beraad: het beraad over een bestuurlijke aangelegenheid binnen een bestuursorgaan, dan wel binnen
      een kring van bestuursorganen in het kader van de gezamenlijke verantwoordelijkheid voor een bestuurlijke
      aangelegenheid;

      d. niet-ambtelijke adviescommissie: een van overheidswege ingestelde instantie, met als taak het adviseren van
      een of meer bestuursorganen en waarvan geen ambtenaren lid zijn, die het bestuursorgaan waaronder zij ressorteren
      adviseren over de onderwerpen die aan de instantie zijn voorgelegd. Ambtenaren, die secretaris of adviserend lid
      zijn van een adviesinstantie, worden voor de toepassing van deze bepaling niet als leden daarvan beschouwd;

      e. ambtelijke of gemengd samengestelde adviescommissie: een instantie, met als taak het adviseren van één of meer
      bestuursorganen, die geheel of gedeeltelijk is samengesteld uit ambtenaren, tot wier functie behoort het adviseren
      van het bestuursorgaan waaronder zij ressorteren over de onderwerpen die aan de instantie zijn voorgelegd;

      f. persoonlijke beleidsopvatting: een opvatting, voorstel, aanbeveling of conclusie van een of meer personen over
      een bestuurlijke aangelegenheid en de daartoe door hen aangevoerde argumenten;

      g. milieu-informatie: alle beschikbare informatie in geschreven, visuele, auditieve of geautomatiseerde vorm
      betreffende de toestand van water, lucht, bodem, fauna, flora, akkers en natuurgebieden, betreffende activiteiten,
      met inbegrip van activiteiten die hinder veroorzaken, zoals lawaai, en maatregelen die hierop een ongunstig effect
      hebben of waarschijnlijk zullen hebben, en betreffende beschermende activiteiten en maatregelen ter zake, met
      inbegrip van bestuursrechtelijke maatregelen en milieubeheersprogramma's.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel1
  - number: 1a
    text: |-
      1 Deze wet is van toepassing op de volgende bestuursorganen:

      a. Onze Ministers;

      b. de bestuursorganen van provincies, gemeenten, waterschappen en publiekrechtelijke bedrijfsorganisatie;

      c. bestuursorganen die onder de verantwoordelijkheid van [de onder a][ref1] en [b][ref2] genoemde organen werkzaam
      zijn;

      d. andere bestuursorganen, voor zover niet bij algemene maatregel van bestuur uitgezonderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel1a
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: 1a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005252
        artikel: 1a
        hoofdstuk: I
  - number: '2'
    text: |-
      Een bestuursorgaan verstrekt bij de uitvoering van zijn taak, onverminderd het elders bij de wet bepaalde,
      informatie overeenkomstig deze wet.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel2
  - number: '3'
    text: |-
      1 Een ieder kan een verzoek om informatie neergelegd in documenten over een bestuurlijke aangelegenheid richten tot
      een bestuursorgaan of een onder verantwoordelijkheid van een bestuursorgaan werkzame instelling, dienst of bedrijf.

      2 De verzoeker vermeldt bij zijn verzoek de bestuurlijke aangelegenheid of het daarop betrekking hebbend document,
      waarover hij informatie wenst te ontvangen.

      3 Een verzoek om informatie wordt ingewilligd met inachtneming van het bepaalde in de [artikelen 10][ref1] en
      [11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel11
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '11'
        hoofdstuk: V
  - number: '4'
    text: |-
      Indien het verzoek betrekking heeft op gegevens in documenten die berusten bij een ander bestuursorgaan dan dat
      waarbij het verzoek is ingediend, wordt de verzoeker zo nodig naar dat orgaan verwezen. Is het verzoek schriftelijk
      gedaan, dan wordt het doorgezonden onder mededeling van de doorzending aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel4
  - number: '5'
    text: |-
      1 De beslissing op een verzoek om informatie wordt mondeling of schriftelijk genomen.

      2 Een gehele of gedeeltelijke afwijzing van een schriftelijk verzoek om informatie vindt schriftelijk plaats. In
      geval van een mondeling verzoek vindt een afwijzing schriftelijk plaats, indien de verzoeker daarom vraagt. De
      verzoeker wordt op deze mogelijkheid gewezen.

      3 De beslissing wordt eveneens schriftelijk genomen indien het verzoek om informatie een derde betreft en deze
      daarom heeft verzocht. In dat geval wordt tevens aan de derde de op hem betrekking hebbende informatie toegezonden.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel5
  - number: '6'
    text: |-
      Het bestuursorgaan beslist op het verzoek om informatie zo spoedig mogelijk, doch uiterlijk binnen twee weken na
      de dag waarop het verzoek is ontvangen. Het bestuursorgaan kan de beslissing voor ten hoogste twee weken verdagen.
      Van de verdaging wordt voor de afloop van de eerste termijn schriftelijk gemotiveerd mededeling gedaan aan de
      verzoeker.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel6
  - number: '7'
    text: |-
      1 Het bestuursorgaan verstrekt de informatie met betrekking tot de documenten die de verlangde informatie bevatten
      door:

      a. kopie ervan te geven of de letterlijke inhoud ervan in andere vorm te verstrekken,

      b. kennisneming van de inhoud toe te staan,

      c. een uittreksel of een samenvatting van de inhoud te geven, of

      d. inlichtingen daaruit te verschaffen.

      2 Bij het kiezen tussen de vormen van informatie, genoemd in het eerste lid, houdt het bestuursorgaan rekening met
      de voorkeur van de verzoeker en met het belang van een vlotte voortgang van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel7
  - number: '8'
    text: |-
      1 Het bestuursorgaan dat het rechtstreeks aangaat, verschaft uit eigen beweging informatie over het beleid, de
      voorbereiding en de uitvoering daaronder begrepen, zodra dat in het belang is van een goede en democratische
      bestuursvoering.

      2 Het bestuursorgaan draagt er zorg voor dat de informatie wordt verschaft in begrijpelijke vorm, op zodanige
      wijze, dat belanghebbende en belangstellende burgers zoveel mogelijk worden bereikt en op zodanige tijdstippen, dat
      deze hun inzichten tijdig ter kennis van het bestuursorgaan kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel8
  - number: '9'
    text: |-
      1 Het bestuursorgaan dat het rechtstreeks aangaat draagt zorg voor het openbaar maken, zo nodig en mogelijk met
      toelichting, van door niet-ambtelijke adviescommissies aan het orgaan uitgebrachte adviezen met het oog op het te
      vormen beleid, tezamen met de door het orgaan aan de commissies voorgelegde adviesaanvragen en voorstellen.

      2 Uiterlijk binnen vier weken nadat de adviezen zijn ontvangen heeft openbaarmaking plaats en wordt daarvan
      mededeling gedaan in de *Staatscourant* of een andere vanwege de overheid algemeen verkrijgbaar gestelde periodiek.
      Van een gehele of gedeeltelijke niet-openbaarmaking wordt op gelijke wijze mededeling gedaan.

      3 De in het eerste lid bedoelde stukken kunnen worden openbaar gemaakt door deze:

      a. op te nemen in een algemeen verkrijgbare uitgave,

      b. afzonderlijk uit te geven en algemeen verkrijgbaar te stellen, of

      c. ter inzage te leggen, in kopie te verstrekken of uit te lenen.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel9
  - number: '10'
    text: |-
      1 Het verstrekken van informatie ingevolge deze wet blijft achterwege voor zover dit:

      a. de eenheid van de Kroon in gevaar zou kunnen brengen;

      b. de veiligheid van de Staat zou kunnen schaden;

      c. bedrijfs- en fabricagegegevens betreft, die door natuurlijke personen of rechtspersonen vertrouwelijk aan de
      overheid zijn meegedeeld.

      d. persoonsgegevens betreft als bedoeld in
      [paragraaf 2 van hoofdstuk 2 van de Wet bescherming persoonsgegevens][ref1], tenzij de verstrekking kennelijk geen
      inbreuk op de persoonlijke levenssfeer maakt.

      2 Het verstrekken van informatie ingevolge deze wet blijft eveneens achterwege voor zover het belang daarvan niet
      opweegt tegen de volgende belangen:

      a. de betrekkingen van Nederland met andere staten en met internationale organisaties;

      b. de economische of financiële belangen van de Staat, de andere publiekrechtelijke lichamen of de in
      [artikel 1a, onder c en d][ref2], bedoelde bestuursorganen;

      c. de opsporing en vervolging van strafbare feiten;

      d. inspectie, controle en toezicht door bestuursorganen;

      e. de eerbiediging van de persoonlijke levenssfeer;

      f. het belang, dat de geadresseerde erbij heeft als eerste kennis te kunnen nemen van de informatie;

      g. het voorkomen van onevenredige bevoordeling of benadeling van bij de aangelegenheid betrokken natuurlijke
      personen of rechtspersonen dan wel van derden.

      3 Het tweede lid, aanhef en onder b, is van toepassing op het verstrekken van milieu-informatie voor zover deze
      handelingen betreft met een vertrouwelijk karakter.

      4 Het tweede lid, aanhef en onder g, is niet van toepassing op het verstrekken van milieu-informatie. Het
      verstrekken van deze informatie ingevolge deze wet kan achterwege blijven voor zover het gegevens betreft waarvan
      openbaarmaking aantasting van het milieu waarschijnlijker zou maken.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel1a
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011468
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005252
        artikel: 1a
        hoofdstuk: I
  - number: '11'
    text: |-
      1 In geval van een verzoek om informatie uit documenten, opgesteld ten behoeve van intern beraad, wordt geen
      informatie verstrekt over daarin opgenomen persoonlijke beleidsopvattingen.

      2 Over persoonlijke beleidsopvattingen kan met het oog op een goede en democratische bestuursvoering informatie
      worden verstrekt in niet tot personen herleidbare vorm. Indien degene die deze opvattingen heeft geuit of zich
      erachter heeft gesteld, daarmee heeft ingestemd, kan de informatie in tot personen herleidbare vorm worden
      verstrekt.

      3 Met betrekking tot adviezen van een ambtelijke of gemengd samengestelde adviescommissie kan het verstrekken van
      informatie over de daarin opgenomen persoonlijke beleidsopvattingen plaatsvinden, indien het voornemen daartoe
      door het bestuursorgaan dat het rechtstreeks aangaat aan de leden van de adviescommissie voor de aanvang van hun
      werkzaamheden kenbaar is gemaakt.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel11
  - number: '12'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor de centrale overheid regels worden gesteld met
      betrekking tot in rekening te brengen vergoedingen voor het ingevolge een verzoek om informatie vervaardigen van
      kopieën van documenten en uittreksels of samenvattingen van de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel12
  - number: '13'
    text: |-
      Deze wet verplicht niet tot het openbaar maken van adviezen van de Raad van State en van niet-ambtelijke
      adviescommissies die zijn uitgebracht voor 1 mei 1980.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel13
  - number: '14'
    text: |-
      Nadere regels omtrent de uitvoering van het bij of krachtens deze wet bepaalde kunnen worden gesteld:

      a. voor de centrale overheid bij of krachtens een besluit van Onze Minister-President in overeenstemming met het
      gevoelen van de ministerraad;

      b. voor de provincies, gemeenten, waterschappen en de andere in [artikel 1a, onder c en d][ref1], bedoelde
      bestuursorganen door hun besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel1a
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: 1a
        hoofdstuk: I
  - number: '16'
    text: |-
      Op de ten tijde van inwerkingtreding van deze wet ingestelde beroepen tegen beschikkingen op grond van de Wet
      openbaarheid van bestuur (*Stb.* 1978, 581) blijven de bepalingen van die wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel16
  - number: '17'
    text: |-
      Onze Minister-President, Minister van Algemene Zaken, en Onze Minister van Binnenlandse Zaken zenden binnen
      vijf jaar na het in werking treden van deze wet aan de Staten-Generaal een verslag over de wijze waarop zij is
      toegepast.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel17
  - number: '19'
    text: |-
      Voor adviezen, voordrachten en andere voorstellen van de Raad van State, uitgebracht voor het tijdstip van
      inwerkingtreding van deze wet, blijven de op de dag voor de inwerkingtreding geldende wettelijke bepalingen van
      kracht.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel19
  - number: '21'
    text: |-
      Op verzoeken op grond van de [Archiefwet 1962][ref1] (*Stb.* 1962, 313) tot raadpleging of gebruik van vóór
      de inwerkingtreding van deze wet in een archiefbewaarplaats berustende archiefbescheiden blijven de voor de
      inwerkingtreding van deze wet gestelde beperkingen ten aanzien van de openbaarheid van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '25'
    text: De Wet openbaarheid van bestuur (*Stb.* 1978, 581) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel25
  - number: '26'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel26
  - number: '27'
    text: Deze wet kan worden aangehaald als Wet openbaarheid van bestuur.
    url: https://wetten.overheid.nl/BWBR0005252/2003-06-30#Artikel27
