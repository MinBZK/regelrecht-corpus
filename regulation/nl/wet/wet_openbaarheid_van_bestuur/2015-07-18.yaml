---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_openbaarheid_van_bestuur
regulatory_layer: WET
publication_date: '2021-10-27'
valid_from: '2015-07-18'
bwb_id: BWBR0005252
url: https://wetten.overheid.nl/BWBR0005252/2015-07-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede gelet op artikel 110 van de Grondwet, met het oog op een goede
    en democratische bestuursvoering wenselijk is gebleken de regelen met betrekking tot de openheid en openbaarheid
    van bestuur aan te passen en deze zoveel mogelijk in de wet op te nemen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel1
  - number: 1.a
    text: 'document: een bij een bestuursorgaan berustend schriftelijk stuk of ander materiaal dat gegevens bevat;'
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel1
  - number: 1.b
    text: |-
      bestuurlijke aangelegenheid: een aangelegenheid die betrekking heeft op beleid van een bestuursorgaan, daaronder
      begrepen de voorbereiding en de uitvoering ervan;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel1
  - number: 1.c
    text: |-
      intern beraad: het beraad over een bestuurlijke aangelegenheid binnen een bestuursorgaan, dan wel binnen een kring
      van bestuursorganen in het kader van de gezamenlijke verantwoordelijkheid voor een bestuurlijke aangelegenheid;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel1
  - number: 1.d
    text: |-
      niet-ambtelijke adviescommissie: een van overheidswege ingestelde instantie, met als taak het adviseren van een
      of meer bestuursorganen en waarvan geen ambtenaren lid zijn, die het bestuursorgaan waaronder zij ressorteren
      adviseren over de onderwerpen die aan de instantie zijn voorgelegd. Ambtenaren, die secretaris of adviserend lid
      zijn van een adviesinstantie, worden voor de toepassing van deze bepaling niet als leden daarvan beschouwd;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel1
  - number: 1.e
    text: |-
      ambtelijke of gemengd samengestelde adviescommissie: een instantie, met als taak het adviseren van één of meer
      bestuursorganen, die geheel of gedeeltelijk is samengesteld uit ambtenaren, tot wier functie behoort het adviseren
      van het bestuursorgaan waaronder zij ressorteren over de onderwerpen die aan de instantie zijn voorgelegd;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel1
  - number: 1.f
    text: |-
      persoonlijke beleidsopvatting: een opvatting, voorstel, aanbeveling of conclusie van een of meer personen over een
      bestuurlijke aangelegenheid en de daartoe door hen aangevoerde argumenten;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel1
  - number: 1.g
    text: |-
      milieu-informatie: hetgeen daaronder wordt verstaan in [artikel 19.1a van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
  - number: 1a.1
    text: 'Deze wet is van toepassing op de volgende bestuursorganen:'
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel1a
  - number: 1a.1.a
    text: Onze Ministers;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel1a
  - number: 1a.1.b
    text: de bestuursorganen van provincies, gemeenten, waterschappen en publiekrechtelijke bedrijfsorganisatie;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel1a
  - number: 1a.1.c
    text: bestuursorganen die onder de verantwoordelijkheid van de onder a en b genoemde organen werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel1a
  - number: 1a.1.d
    text: andere bestuursorganen, voor zover niet bij algemene maatregel van bestuur uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel1a
  - number: 1a.2
    text: |-
      In afwijking van het eerste lid, onder d, is deze wet op de krachtens die bepaling uitgezonderde bestuursorganen
      van toepassing voorzover het gaat om het verstrekken van milieu-informatie.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel1a
  - number: '2.1'
    text: |-
      Een bestuursorgaan verstrekt bij de uitvoering van zijn taak, onverminderd het elders bij wet bepaalde, informatie
      overeenkomstig deze wet en gaat daarbij uit van het algemeen belang van openbaarheid van informatie.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel2
  - number: '2.2'
    text: |-
      Het bestuursorgaan draagt er zo veel mogelijk zorg voor dat de informatie die het overeenkomstig deze wet
      verstrekt, actueel, nauwkeurig en vergelijkbaar is.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel2
  - number: '3.1'
    text: |-
      Een ieder kan een verzoek om informatie neergelegd in documenten over een bestuurlijke aangelegenheid richten tot
      een bestuursorgaan of een onder verantwoordelijkheid van een bestuursorgaan werkzame instelling, dienst of bedrijf.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel3
  - number: '3.2'
    text: |-
      De verzoeker vermeldt bij zijn verzoek de bestuurlijke aangelegenheid of het daarop betrekking hebbend document,
      waarover hij informatie wenst te ontvangen.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel3
  - number: '3.3'
    text: De verzoeker behoeft bij zijn verzoek geen belang te stellen.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel3
  - number: '3.4'
    text: |-
      Indien een verzoek te algemeen geformuleerd is, verzoekt het bestuursorgaan de verzoeker zo spoedig mogelijk om
      zijn verzoek te preciseren en is het hem daarbij behulpzaam.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel3
  - number: '3.5'
    text: |-
      Een verzoek om informatie wordt ingewilligd met inachtneming van het bepaalde in de [artikelen 10][ref1] en
      [11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel11
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '11'
        hoofdstuk: V
  - number: '4'
    text: |-
      Indien het verzoek betrekking heeft op gegevens in documenten die berusten bij een ander bestuursorgaan dan dat
      waarbij het verzoek is ingediend, wordt de verzoeker zo nodig naar dat orgaan verwezen. Is het verzoek schriftelijk
      gedaan, dan wordt het doorgezonden onder mededeling van de doorzending aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel4
  - number: '5.1'
    text: De beslissing op een verzoek om informatie wordt mondeling of schriftelijk genomen.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel5
  - number: '5.2'
    text: |-
      Een gehele of gedeeltelijke afwijzing van een schriftelijk verzoek om informatie vindt schriftelijk plaats. In
      geval van een mondeling verzoek vindt een afwijzing schriftelijk plaats, indien de verzoeker daarom vraagt. De
      verzoeker wordt op deze mogelijkheid gewezen.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel5
  - number: '5.3'
    text: |-
      De beslissing wordt eveneens schriftelijk genomen indien het verzoek om informatie een derde betreft en deze daarom
      heeft verzocht. In dat geval wordt tevens aan de derde de op hem betrekking hebbende informatie toegezonden.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel5
  - number: '6.1'
    text: |-
      Het bestuursorgaan beslist op het verzoek om informatie zo spoedig mogelijk, doch uiterlijk binnen vier weken
      gerekend vanaf de dag na die waarop het verzoek is ontvangen.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel6
  - number: '6.2'
    text: |-
      Het bestuursorgaan kan de beslissing voor ten hoogste vier weken verdagen. Van de verdaging wordt voor de afloop
      van de eerste termijn schriftelijk gemotiveerd mededeling gedaan aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel6
  - number: '6.3'
    text: |-
      Onverminderd [artikel 4:15 van de Algemene wet bestuursrecht][ref1] wordt de termijn voor het geven van een
      beschikking opgeschort gerekend vanaf de dag na die waarop het bestuursorgaan de verzoeker meedeelt dat toepassing
      is gegeven aan [artikel 4:8 van de Algemene wet bestuursrecht][ref2], tot de dag waarop door de belanghebbende of
      belanghebbenden een zienswijze naar voren is gebracht of de daarvoor gestelde termijn ongebruikt is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '6.4'
    text: |-
      Indien de opschorting, bedoeld in het derde lid, eindigt, doet het bestuursorgaan daarvan zo spoedig mogelijk
      mededeling aan de verzoeker, onder vermelding van de termijn binnen welke de beschikking alsnog moet worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel6
  - number: '6.5'
    text: |-
      Indien het bestuursorgaan heeft besloten informatie te verstrekken, wordt de informatie verstrekt tegelijk met de
      bekendmaking van het besluit, tenzij naar verwachting een belanghebbende bezwaar daar tegen heeft, in welk geval de
      informatie niet eerder wordt verstrekt dan twee weken nadat de beslissing is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel6
  - number: '6.6'
    text: 'Voor zover het verzoek betrekking heeft op het verstrekken van milieu-informatie:'
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel6
  - number: 6.6.a
    text: |-
      bedraagt de uiterste beslistermijn in afwijking van het eerste lid twee weken indien het bestuursorgaan voornemens
      is de milieu-informatie te verstrekken terwijl naar verwachting een belanghebbende daar bezwaar tegen heeft;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel6
  - number: 6.6.b
    text: |-
      kan de beslissing slechts worden verdaagd op grond van het tweede lid, indien de omvang of de gecompliceerdheid van
      de milieu-informatie een verlenging rechtvaardigt;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel6
  - number: 6.6.c
    text: zijn het derde en vierde lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel6
  - number: '7.1'
    text: |-
      Het bestuursorgaan verstrekt de informatie met betrekking tot de documenten die de verlangde informatie bevatten
      door:
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel7
  - number: 7.1.a
    text: kopie ervan te geven of de letterlijke inhoud ervan in andere vorm te verstrekken,
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel7
  - number: 7.1.b
    text: kennisneming van de inhoud toe te staan,
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel7
  - number: 7.1.c
    text: een uittreksel of een samenvatting van de inhoud te geven, of
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel7
  - number: 7.1.d
    text: inlichtingen daaruit te verschaffen.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel7
  - number: '7.2'
    text: 'Het bestuursorgaan verstrekt de informatie in de door de verzoeker verzochte vorm, tenzij:'
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel7
  - number: 7.2.a
    text: het verstrekken van de informatie in die vorm redelijkerwijs niet gevergd kan worden;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel7
  - number: 7.2.b
    text: |-
      de informatie reeds in een andere, voor de verzoeker gemakkelijk toegankelijke vorm voor het publiek beschikbaar
      is.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel7
  - number: '7.3'
    text: |-
      Indien het verzoek betrekking heeft op milieu-informatie als bedoeld in
      [artikel 19.1a, eerste lid, onder b, van de Wet milieubeheer][ref1], verstrekt het bestuursorgaan, zo nodig, en
      indien deze informatie voorhanden is, tevens informatie over de methoden die zijn gebruikt bij het samenstellen van
      eerstbedoelde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
  - number: '8.1'
    text: |-
      Het bestuursorgaan dat het rechtstreeks aangaat, verschaft uit eigen beweging informatie over het beleid, de
      voorbereiding en de uitvoering daaronder begrepen, zodra dat in het belang is van een goede en democratische
      bestuursvoering.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel8
  - number: '8.2'
    text: |-
      Het bestuursorgaan draagt er zorg voor dat de informatie wordt verschaft in begrijpelijke vorm, op zodanige wijze,
      dat belanghebbende en belangstellende burgers zoveel mogelijk worden bereikt en op zodanige tijdstippen, dat deze
      hun inzichten tijdig ter kennis van het bestuursorgaan kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel8
  - number: '9.1'
    text: |-
      Het bestuursorgaan dat het rechtstreeks aangaat draagt zorg voor het openbaar maken, zo nodig en mogelijk met
      toelichting, van door niet-ambtelijke adviescommissies aan het orgaan uitgebrachte adviezen met het oog op het te
      vormen beleid, tezamen met de door het orgaan aan de commissies voorgelegde adviesaanvragen en voorstellen.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel9
  - number: '9.2'
    text: |-
      Uiterlijk binnen vier weken nadat de adviezen zijn ontvangen heeft openbaarmaking plaats en wordt daarvan
      mededeling gedaan in de *Staatscourant* of een andere vanwege de overheid algemeen verkrijgbaar gestelde periodiek.
      Van een gehele of gedeeltelijke niet-openbaarmaking wordt op gelijke wijze mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel9
  - number: '9.3'
    text: 'De in het eerste lid bedoelde stukken kunnen worden openbaar gemaakt door deze:'
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel9
  - number: 9.3.a
    text: op te nemen in een algemeen verkrijgbare uitgave,
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel9
  - number: 9.3.b
    text: afzonderlijk uit te geven en algemeen verkrijgbaar te stellen, of
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel9
  - number: 9.3.c
    text: ter inzage te leggen, in kopie te verstrekken of uit te lenen.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel9
  - number: '10.1'
    text: 'Het verstrekken van informatie ingevolge deze wet blijft achterwege voor zover dit:'
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: 10.1.a
    text: de eenheid van de Kroon in gevaar zou kunnen brengen;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: 10.1.b
    text: de veiligheid van de Staat zou kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: 10.1.c
    text: |-
      bedrijfs- en fabricagegegevens betreft, die door natuurlijke personen of rechtspersonen vertrouwelijk aan de
      overheid zijn meegedeeld;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: 10.1.d
    text: |-
      persoonsgegevens betreft als bedoeld in [paragraaf 2 van hoofdstuk 2 van de Wet bescherming persoonsgegevens][ref1],
      tenzij de verstrekking kennelijk geen inbreuk op de persoonlijke levenssfeer maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011468
        paragraaf: '2'
  - number: '10.2'
    text: |-
      Het verstrekken van informatie ingevolge deze wet blijft eveneens achterwege voor zover het belang daarvan niet
      opweegt tegen de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: 10.2.a
    text: de betrekkingen van Nederland met andere staten en met internationale organisaties;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: 10.2.b
    text: |-
      de economische of financiële belangen van de Staat, de andere publiekrechtelijke lichamen of de in
      [artikel 1a, onder c en d][ref1], bedoelde bestuursorganen;


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel1a
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: 1a
        hoofdstuk: I
  - number: 10.2.c
    text: de opsporing en vervolging van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: 10.2.d
    text: inspectie, controle en toezicht door bestuursorganen;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: 10.2.e
    text: de eerbiediging van de persoonlijke levenssfeer;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: 10.2.f
    text: het belang, dat de geadresseerde erbij heeft als eerste kennis te kunnen nemen van de informatie;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: 10.2.g
    text: |-
      het voorkomen van onevenredige bevoordeling of benadeling van bij de aangelegenheid betrokken natuurlijke personen
      of rechtspersonen dan wel van derden.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: '10.3'
    text: |-
      Het tweede lid, aanhef en onder e, is niet van toepassing voorzover de betrokken persoon heeft ingestemd met
      openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: '10.4'
    text: |-
      Het eerste lid, aanhef en onder c en d, het tweede lid, aanhef en onder e, en het zevende lid, aanhef en onder a,
      zijn niet van toepassing voorzover het milieu-informatie betreft die betrekking heeft op emissies in het milieu.
      Voorts blijft in afwijking van het eerste lid, aanhef en onder c, het verstrekken van milieu-informatie uitsluitend
      achterwege voorzover het belang van openbaarmaking niet opweegt tegen het daar genoemde belang.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: '10.5'
    text: |-
      Het tweede lid, aanhef en onder b, is van toepassing op het verstrekken van milieu-informatie voor zover deze
      handelingen betreft met een vertrouwelijk karakter.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: '10.6'
    text: Het tweede lid, aanhef en onder g, is niet van toepassing op het verstrekken van milieu-informatie.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: '10.7'
    text: |-
      Het verstrekken van milieu-informatie ingevolge deze wet blijft eveneens achterwege voorzover het belang daarvan
      niet opweegt tegen de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: 10.7.a
    text: de bescherming van het milieu waarop deze informatie betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: 10.7.b
    text: de beveiliging van bedrijven en het voorkomen van sabotage.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: '10.8'
    text: |-
      Voorzover het vierde lid, eerste volzin, niet van toepassing is, wordt bij het toepassen van het eerste, tweede
      en zevende lid op milieu-informatie in aanmerking genomen of deze informatie betrekking heeft op emissies in het
      milieu.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel10
  - number: '11.1'
    text: |-
      In geval van een verzoek om informatie uit documenten, opgesteld ten behoeve van intern beraad, wordt geen
      informatie verstrekt over daarin opgenomen persoonlijke beleidsopvattingen.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel11
  - number: '11.2'
    text: |-
      Over persoonlijke beleidsopvattingen kan met het oog op een goede en democratische bestuursvoering informatie
      worden verstrekt in niet tot personen herleidbare vorm. Indien degene die deze opvattingen heeft geuit of zich
      erachter heeft gesteld, daarmee heeft ingestemd, kan de informatie in tot personen herleidbare vorm worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel11
  - number: '11.3'
    text: |-
      Met betrekking tot adviezen van een ambtelijke of gemengd samengestelde adviescommissie kan het verstrekken van
      informatie over de daarin opgenomen persoonlijke beleidsopvattingen plaatsvinden, indien het voornemen daartoe
      door het bestuursorgaan dat het rechtstreeks aangaat aan de leden van de adviescommissie voor de aanvang van hun
      werkzaamheden kenbaar is gemaakt.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel11
  - number: '11.4'
    text: |-
      In afwijking van het eerste lid wordt bij milieu-informatie het belang van de bescherming van de persoonlijke
      beleidsopvattingen afgewogen tegen het belang van openbaarmaking. Informatie over persoonlijke beleidsopvattingen
      kan worden verstrekt in niet tot personen herleidbare vorm. Het tweede lid, tweede volzin, is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel11
  - number: '12'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor de centrale overheid regels worden gesteld met
      betrekking tot in rekening te brengen vergoedingen voor het ingevolge een verzoek om informatie vervaardigen van
      kopieën van documenten en uittreksels of samenvattingen van de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel12
  - number: '13'
    text: |-
      Deze wet verplicht niet tot het openbaar maken van adviezen van de Raad van State en van niet-ambtelijke
      adviescommissies die zijn uitgebracht voor 1 mei 1980.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel13
  - number: '14'
    text: 'Nadere regels omtrent de uitvoering van het bij of krachtens deze wet bepaalde kunnen worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel14
  - number: 14.a
    text: |-
      voor de centrale overheid bij of krachtens een besluit van Onze Minister-President in overeenstemming met het
      gevoelen van de ministerraad;
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel14
  - number: 14.b
    text: |-
      voor de provincies, gemeenten, waterschappen en de andere in [artikel 1a, onder c en d][ref1], bedoelde
      bestuursorganen door hun besturen.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel1a
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: 1a
        hoofdstuk: I
  - number: '17'
    text: |-
      Onze Minister-President, Minister van Algemene Zaken, en Onze Minister van Binnenlandse Zaken zenden binnen
      vijf jaar na het in werking treden van deze wet aan de Staten-Generaal een verslag over de wijze waarop zij is
      toegepast.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel17
  - number: '19'
    text: |-
      Voor adviezen, voordrachten en andere voorstellen van de Raad van State, uitgebracht voor het tijdstip van
      inwerkingtreding van deze wet, blijven de op de dag voor de inwerkingtreding geldende wettelijke bepalingen van
      kracht.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel19
  - number: '21'
    text: |-
      Op verzoeken op grond van de [Archiefwet 1962][ref1] (*Stb.* 1962, 313) tot raadpleging of gebruik van vóór
      de inwerkingtreding van deze wet in een archiefbewaarplaats berustende archiefbescheiden blijven de voor de
      inwerkingtreding van deze wet gestelde beperkingen ten aanzien van de openbaarheid van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '25'
    text: De Wet openbaarheid van bestuur (*Stb.* 1978, 581) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel25
  - number: '26'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel26
  - number: '27'
    text: Deze wet kan worden aangehaald als Wet openbaarheid van bestuur.
    url: https://wetten.overheid.nl/BWBR0005252/2015-07-18#Artikel27
