  - number: 1a
    text: |-
      1 Deze wet is van toepassing op de volgende bestuursorganen:

      a. Onze Ministers;

      b. de bestuursorganen van provincies, gemeenten, waterschappen en publiekrechtelijke bedrijfsorganisatie;

      c. bestuursorganen die onder de verantwoordelijkheid van de onder a en b genoemde organen werkzaam zijn;

      d. andere bestuursorganen, voor zover niet bij algemene maatregel van bestuur uitgezonderd.

      2 In afwijking van het eerste lid, onder d, is deze wet op de krachtens die bepaling uitgezonderde bestuursorganen
      van toepassing voorzover het gaat om het verstrekken van milieu-informatie.
    url: https://wetten.overheid.nl/BWBR0005252/2018-07-28#Artikel1a
  - number: '2'
    text: |-
      1 Een bestuursorgaan verstrekt bij de uitvoering van zijn taak, onverminderd het elders bij wet bepaalde,
      informatie overeenkomstig deze wet en gaat daarbij uit van het algemeen belang van openbaarheid van informatie.

      2 Het bestuursorgaan draagt er zo veel mogelijk zorg voor dat de informatie die het overeenkomstig deze wet
      verstrekt, actueel, nauwkeurig en vergelijkbaar is.
    url: https://wetten.overheid.nl/BWBR0005252/2018-07-28#Artikel2
  - number: '3'
    text: |-
      1 Een ieder kan een verzoek om informatie neergelegd in documenten over een bestuurlijke aangelegenheid richten tot
      een bestuursorgaan of een onder verantwoordelijkheid van een bestuursorgaan werkzame instelling, dienst of bedrijf.

      2 De verzoeker vermeldt bij zijn verzoek de bestuurlijke aangelegenheid of het daarop betrekking hebbend document,
      waarover hij informatie wenst te ontvangen.

      3 De verzoeker behoeft bij zijn verzoek geen belang te stellen.

      4 Indien een verzoek te algemeen geformuleerd is, verzoekt het bestuursorgaan de verzoeker zo spoedig mogelijk om
      zijn verzoek te preciseren en is het hem daarbij behulpzaam.

      5 Een verzoek om informatie wordt ingewilligd met inachtneming van het bepaalde in de [artikelen 10][ref1] en
      [11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel11
    url: https://wetten.overheid.nl/BWBR0005252/2018-07-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '11'
        hoofdstuk: V
  - number: '4'
    text: |-
      Indien het verzoek betrekking heeft op gegevens in documenten die berusten bij een ander bestuursorgaan dan dat
      waarbij het verzoek is ingediend, wordt de verzoeker zo nodig naar dat orgaan verwezen. Is het verzoek schriftelijk
      gedaan, dan wordt het doorgezonden onder mededeling van de doorzending aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0005252/2018-07-28#Artikel4
  - number: '5'
    text: |-
      1 De beslissing op een verzoek om informatie wordt mondeling of schriftelijk genomen.

      2 Een gehele of gedeeltelijke afwijzing van een schriftelijk verzoek om informatie vindt schriftelijk plaats. In
      geval van een mondeling verzoek vindt een afwijzing schriftelijk plaats, indien de verzoeker daarom vraagt. De
      verzoeker wordt op deze mogelijkheid gewezen.

      3 De beslissing wordt eveneens schriftelijk genomen indien het verzoek om informatie een derde betreft en deze
      daarom heeft verzocht. In dat geval wordt tevens aan de derde de op hem betrekking hebbende informatie toegezonden.
    url: https://wetten.overheid.nl/BWBR0005252/2018-07-28#Artikel5
  - number: '6'
    text: |-
      1 Het bestuursorgaan beslist op het verzoek om informatie zo spoedig mogelijk, doch uiterlijk binnen vier weken
      gerekend vanaf de dag na die waarop het verzoek is ontvangen.

      2 Het bestuursorgaan kan de beslissing voor ten hoogste vier weken verdagen. Van de verdaging wordt voor de afloop
      van de eerste termijn schriftelijk gemotiveerd mededeling gedaan aan de verzoeker.

      3 Onverminderd [artikel 4:15 van de Algemene wet bestuursrecht][ref1] wordt de termijn voor het geven van een
      beschikking opgeschort gerekend vanaf de dag na die waarop het bestuursorgaan de verzoeker meedeelt dat toepassing
      is gegeven aan [artikel 4:8 van de Algemene wet bestuursrecht][ref2], tot de dag waarop door de belanghebbende of
      belanghebbenden een zienswijze naar voren is gebracht of de daarvoor gestelde termijn ongebruikt is verstreken.

      4 Indien de opschorting, bedoeld in het derde lid, eindigt, doet het bestuursorgaan daarvan zo spoedig mogelijk
      mededeling aan de verzoeker, onder vermelding van de termijn binnen welke de beschikking alsnog moet worden
      gegeven.

      5 Indien het bestuursorgaan heeft besloten informatie te verstrekken, wordt de informatie verstrekt tegelijk met de
      bekendmaking van het besluit, tenzij naar verwachting een belanghebbende bezwaar daar tegen heeft, in welk geval de
      informatie niet eerder wordt verstrekt dan twee weken nadat de beslissing is bekendgemaakt.

      6 Voor zover het verzoek betrekking heeft op het verstrekken van milieu-informatie:

      a. bedraagt de uiterste beslistermijn in afwijking van het eerste lid twee weken indien het bestuursorgaan
      voornemens is de milieu-informatie te verstrekken terwijl naar verwachting een belanghebbende daar bezwaar tegen
      heeft;

      b. kan de beslissing slechts worden verdaagd op grond van het tweede lid, indien de omvang of de gecompliceerdheid
      van de milieu-informatie een verlenging rechtvaardigt;

      c. zijn het derde en vierde lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel415
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel48
