  - number: '7'
    text: |-
      1 Het bestuursorgaan verstrekt de informatie met betrekking tot de documenten die de verlangde informatie bevatten
      door:

      a. kopie ervan te geven of de letterlijke inhoud ervan in andere vorm te verstrekken,

      b. kennisneming van de inhoud toe te staan,

      c. een uittreksel of een samenvatting van de inhoud te geven, of

      d. inlichtingen daaruit te verschaffen.

      2 Het bestuursorgaan verstrekt de informatie in de door de verzoeker verzochte vorm, tenzij:

      a. het verstrekken van de informatie in die vorm redelijkerwijs niet gevergd kan worden;

      b. de informatie reeds in een andere, voor de verzoeker gemakkelijk toegankelijke vorm voor het publiek beschikbaar
      is.

      3 Indien het verzoek betrekking heeft op milieu-informatie als bedoeld in
      [artikel 19.1a, eerste lid, onder b, van de Wet milieubeheer][ref1], verstrekt het bestuursorgaan, zo nodig, en
      indien deze informatie voorhanden is, tevens informatie over de methoden die zijn gebruikt bij het samenstellen van
      eerstbedoelde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19.1a
    url: https://wetten.overheid.nl/BWBR0005252/2018-07-28#Artikel7
    references:
