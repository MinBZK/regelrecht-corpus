  - number: '17'
    text: |-
      Onze Minister-President, Minister van Algemene Zaken, en Onze Minister van Binnenlandse Zaken zenden binnen
      vijf jaar na het in werking treden van deze wet aan de Staten-Generaal een verslag over de wijze waarop zij is
      toegepast.
    url: https://wetten.overheid.nl/BWBR0005252/2018-07-28#Artikel17
  - number: '19'
    text: |-
      Voor adviezen, voordrachten en andere voorstellen van de Raad van State, uitgebracht voor het tijdstip van
      inwerkingtreding van deze wet, blijven de op de dag voor de inwerkingtreding geldende wettelijke bepalingen van
      kracht.
    url: https://wetten.overheid.nl/BWBR0005252/2018-07-28#Artikel19
  - number: '21'
    text: |-
      Op verzoeken op grond van de [Archiefwet 1962][ref1] (*Stb.* 1962, 313) tot raadpleging of gebruik van vóór
      de inwerkingtreding van deze wet in een archiefbewaarplaats berustende archiefbescheiden blijven de voor de
      inwerkingtreding van deze wet gestelde beperkingen ten aanzien van de openbaarheid van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0005252/2018-07-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '25'
    text: De Wet openbaarheid van bestuur (*Stb.* 1978, 581) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005252/2018-07-28#Artikel25
  - number: '26'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0005252/2018-07-28#Artikel26
  - number: '27'
    text: Deze wet kan worden aangehaald als Wet openbaarheid van bestuur.
    url: https://wetten.overheid.nl/BWBR0005252/2018-07-28#Artikel27
