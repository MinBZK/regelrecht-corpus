preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede gelet op artikel 110 van de Grondwet, met het oog op een goede
    en democratische bestuursvoering wenselijk is gebleken de regelen met betrekking tot de openheid en openbaarheid
    van bestuur aan te passen en deze zoveel mogelijk in de wet op te nemen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005252/2018-07-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. document: een bij een bestuursorgaan berustend schriftelijk stuk of ander materiaal dat gegevens bevat;

      b. bestuurlijke aangelegenheid: een aangelegenheid die betrekking heeft op beleid van een bestuursorgaan, daaronder
      begrepen de voorbereiding en de uitvoering ervan;

      c. intern beraad: het beraad over een bestuurlijke aangelegenheid binnen een bestuursorgaan, dan wel binnen
      een kring van bestuursorganen in het kader van de gezamenlijke verantwoordelijkheid voor een bestuurlijke
      aangelegenheid;

      d. niet-ambtelijke adviescommissie: een van overheidswege ingestelde instantie, met als taak het adviseren van
      een of meer bestuursorganen en waarvan geen ambtenaren lid zijn, die het bestuursorgaan waaronder zij ressorteren
      adviseren over de onderwerpen die aan de instantie zijn voorgelegd. Ambtenaren, die secretaris of adviserend lid
      zijn van een adviesinstantie, worden voor de toepassing van deze bepaling niet als leden daarvan beschouwd;

      e. ambtelijke of gemengd samengestelde adviescommissie: een instantie, met als taak het adviseren van één of meer
      bestuursorganen, die geheel of gedeeltelijk is samengesteld uit ambtenaren, tot wier functie behoort het adviseren
      van het bestuursorgaan waaronder zij ressorteren over de onderwerpen die aan de instantie zijn voorgelegd;

      f. persoonlijke beleidsopvatting: een opvatting, voorstel, aanbeveling of conclusie van een of meer personen over
      een bestuurlijke aangelegenheid en de daartoe door hen aangevoerde argumenten;

      g. milieu-informatie: hetgeen daaronder wordt verstaan in [artikel 19.1a van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19.1a
