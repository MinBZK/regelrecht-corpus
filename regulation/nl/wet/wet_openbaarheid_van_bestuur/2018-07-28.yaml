  - number: 15a
    text: |-
      1 In afwijking van [artikel 7:1, eerste lid, onderdeel f, van de Algemene wet bestuursrecht][ref1] kan degene aan
      wie het recht is toegekend beroep bij de bestuursrechter in te stellen tegen het niet tijdig nemen van een besluit
      op grond van deze wet, alvorens beroep in te stellen bezwaar maken.

      2 Het bezwaarschrift kan worden ingediend zodra het bestuursorgaan in gebreke is tijdig een besluit te nemen.
      [Artikel 6:12, eerste en vierde lid, van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.

      3 [Artikel 6:20 van de Algemene wet bestuursrecht][ref3] is van overeenkomstige toepassing, met dien verstande
      dat de in het eerste lid van dat artikel bedoelde verplichting niet geldt gedurende de periode dat het bezwaar
      aanhangig is.

      4 De vergoeding van kosten op grond van [artikel 7:15, tweede lid, van de Algemene wet bestuursrecht][ref4] blijft
      achterwege, indien:

      a. de indiener van het bezwaarschrift, gelet op de omvang van het verzoek, kennelijk onvoldoende heeft
      meegewerkt aan het bereiken van overeenstemming over een opschorting van de beslistermijn als bedoeld in
      [artikel 4:15, tweede lid, onderdeel a, van de Algemene wet bestuursrecht][ref5], of

      b. het niet tijdig nemen van een besluit kennelijk het gevolg is van de wijze van indiening van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel71
