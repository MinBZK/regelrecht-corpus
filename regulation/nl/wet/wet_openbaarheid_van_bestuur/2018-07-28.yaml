  - number: '11'
    text: |-
      1 In geval van een verzoek om informatie uit documenten, opgesteld ten behoeve van intern beraad, wordt geen
      informatie verstrekt over daarin opgenomen persoonlijke beleidsopvattingen.

      2 Over persoonlijke beleidsopvattingen kan met het oog op een goede en democratische bestuursvoering informatie
      worden verstrekt in niet tot personen herleidbare vorm. Indien degene die deze opvattingen heeft geuit of zich
      erachter heeft gesteld, daarmee heeft ingestemd, kan de informatie in tot personen herleidbare vorm worden
      verstrekt.

      3 Met betrekking tot adviezen van een ambtelijke of gemengd samengestelde adviescommissie kan het verstrekken van
      informatie over de daarin opgenomen persoonlijke beleidsopvattingen plaatsvinden, indien het voornemen daartoe
      door het bestuursorgaan dat het rechtstreeks aangaat aan de leden van de adviescommissie voor de aanvang van hun
      werkzaamheden kenbaar is gemaakt.

      4 In afwijking van het eerste lid wordt bij milieu-informatie het belang van de bescherming van de persoonlijke
      beleidsopvattingen afgewogen tegen het belang van openbaarmaking. Informatie over persoonlijke beleidsopvattingen
      kan worden verstrekt in niet tot personen herleidbare vorm. Het tweede lid, tweede volzin, is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005252/2018-07-28#Artikel11
  - number: '12'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor de centrale overheid regels worden gesteld met
      betrekking tot in rekening te brengen vergoedingen voor het ingevolge een verzoek om informatie vervaardigen van
      kopieën van documenten en uittreksels of samenvattingen van de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0005252/2018-07-28#Artikel12
  - number: '14'
    text: |-
      Nadere regels omtrent de uitvoering van het bij of krachtens deze wet bepaalde kunnen worden gesteld:

      a. voor de centrale overheid bij of krachtens een besluit van Onze Minister-President in overeenstemming met het
      gevoelen van de ministerraad;

      b. voor de provincies, gemeenten, waterschappen en de andere in [artikel 1a, onder c en d][ref1], bedoelde
      bestuursorganen door hun besturen.


