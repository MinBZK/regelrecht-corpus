  - number: 15b
    text: |-
      1 In geval van een gegrond beroep tegen het niet tijdig nemen van een besluit op grond van deze wet
      of een beslissing op bezwaar tegen een dergelijk besluit waarbij nog geen besluit is bekendgemaakt,
      bepaalt de bestuursrechter, indien de omvang van het verzoek hiertoe aanleiding geeft, in afwijking van
      [artikel 8:55d, eerste lid, van de Algemene wet bestuursrecht][ref1] de termijn waarbinnen het bestuursorgaan
      alsnog een besluit bekendmaakt.

      2 Indien de bestuursrechter oordeelt dat het niet tijdig nemen van een besluit kennelijk het gevolg is van de wijze
      van indiening van het verzoek en nog geen besluit is bekendgemaakt, bepaalt de bestuursrechter, indien het verzoek
      hiertoe aanleiding geeft, in afwijking van [artikel 8:55d, eerste lid, van de Algemene wet bestuursrecht][ref2] een
      langere termijn waarbinnen het bestuursorgaan alsnog een besluit bekendmaakt.

      3 De bestuursrechter kan [artikel 8:74, eerste lid, van de Algemene wet bestuursrecht][ref3] buiten toepassing laten
      en een proceskostenveroordeling op grond van [artikel 8:75, eerste lid, van de Algemene wet bestuursrecht][ref4]
      achterwege laten, indien de indiener van het beroepschrift, gelet op de omvang van het verzoek, onvoldoende heeft
      meegewerkt aan het bereiken van overeenstemming over:

      a. een opschorting van de beslistermijn als bedoeld in
      [artikel 4:15, tweede lid, onderdeel a, van de Algemene wet bestuursrecht][ref5], of

      b. verder uitstel van de beslistermijn als bedoeld in
      [artikel 7:10, vierde lid, onderdeel a of b, van de Algemene wet bestuursrecht][ref6].

      4 De bestuursrechter kan eveneens [artikel 8:74, eerste lid, van de Algemene wet bestuursrecht][ref7]
      buiten toepassing laten en een proceskostenveroordeling op grond van
      [artikel 8:75, eerste lid, van de Algemene wet bestuursrecht][ref8] achterwege laten, indien hij oordeelt dat het
      niet tijdig nemen van een besluit kennelijk het gevolg is van de wijze van indiening van het verzoek.


