  - number: '33'
    text: |-
      1 Op de percelen waarop blijkens de aanvraag oppervlakten maïs wordt geteeld en waarvoor op grond van deze
      regeling subsidie als bedoeld in [artikel 4][ref1] wordt aangevraagd, is onkruidbestrijding met behulp van
      fytofarmaceutische producten niet toegestaan in de periode vanaf 1 april tot en met 15 juli.

      2 In afwijking van het eerste lid is onkruidbestrijding met behulp van ingevolge de
      [Bestrijdingsmiddelenwet 1962][ref2] toegestane fytofarmaceutische producten toegestaan tot maximaal 1 kg werkzame
      stof per hectare, indien in de periode vanaf de inzaai tot en met 15 juli onkruidbestrijding tenminste één maal
      mechanisch wordt uitgevoerd op de betrokken percelen.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002380
