  - number: '23'
    text: |-
      1 In afwijking van [artikel 17][ref1] mogen producenten overeenkomstig de bepalingen van hoofdstuk II van
      [verordening 2461/1999](31999R2461) en de [artikelen 24][ref2] tot en met [30][ref3], de overeenkomstig
      [artikel 16][ref4] uit productie genomen oppervlakte gebruiken voor het verbouwen van de in bijlage I bij genoemde
      verordening genoemde grondstoffen.

      2 Geen subsidie als bedoeld in [artikel 16, zevende lid][ref5], wordt verstrekt voor de overeenkomstig
      [artikel 16][ref6] uit productie genomen percelen waarop de verbouw van aardperen, cichoreiwortels en suikerbieten
      plaatsvindt.

      3 De grondstoffen worden verbouwd specifiek met het oog op verwerking van de grondstoffen in de Europese
      Gemeenschap tot een of meer eindproducten welke zijn genoemd in bijlage III van [verordening 2461/1999](31999R2461)
      en welke niet zijn bestemd voor menselijke of dierlijke voeding.

      4 Grondstoffen van GN-code 0701 90 10 mogen slechts worden verbouwd onder de navolgende voorwaarden:

      a. de betrokken percelen zijn in de drie voorafgaande teeltseizoenen niet met aardappelen bebouwd geweest;

      b. ten hoogste 25% van de totale oppervlakte akkerland van het bedrijf wordt gebruikt voor de teelt van
      aardappelen;

      c. gedurende de vijf kalenderjaren, die volgen op de onderhavige aardappelteelt, blijft een grondontsmetting
      achterwege;

      d. voor de onderhavige aardappelteelt worden slechts aardappelrassen gebruikt, waaraan blijkens de meest
      recente Beschrijvende Rassenlijst voor landbouwgewassen ten minste het cijfer 6 is toegekend voor de eigenschap
      ’resistentie tegen Phytophthora in het loof’;

      e. voordat de onderhavige aardappelteelt aanvangt, wordt ieder daarvoor bestemd perceel door een door de minister
      aangewezen instelling onderzocht op aardappelmoeheid;

      f. indien een perceel, dat voor de onderhavige aardappelteelt wordt gebruikt, blijkens het in onderdeel c bedoelde
      onderzoek niet vrij is van aardappelmoeheid, worden daarop slechts aardappelen geteeld van rassen, die door de in
      onderdeel c bedoelde instelling zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel17
