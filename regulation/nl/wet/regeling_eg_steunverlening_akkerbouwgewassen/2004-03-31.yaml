  - number: '16'
    text: |-
      1 Een producent neemt per productieregio een zodanige oppervlakte akkerland, die bestaat uit percelen van tenminste
      20 meter breed met elk een oppervlakte van tenminste 0,3 hectare, uit productie dat de desbetreffende oppervlakte
      ten minste 5% uitmaakt van de oppervlakte die wordt gevormd door de som van:

      a. de totale oppervlakte van de percelen in de desbetreffende productieregio ingezaaid met akkerbouwgewassen
      waarvoor de producent subsidie aanvraagt, en

      b. de totale door de producent voor de desbetreffende productieregio op grond van deze regeling uit productie
      genomen oppervlakte aan percelen.

      2 In afwijking van het bepaalde in het eerste lid, is het de producent toegestaan om ook grond uit productie te
      nemen in de andere productieregio dan die waarin de akkerbouwgewassen worden ingezaaid mits de braak te leggen
      oppervlakte wordt aangepast om rekening te houden met de opbrengstverschillen tussen deze productieregio’s.

      3 Voor de uit productie genomen oppervlakte die groter is dan waartoe de producent ingevolge het eerste lid
      verplicht is, heeft de producent aanspraak op subsidie in het kader van deze regeling.

      4 In afwijking van het eerste lid geldt de verplichting tot het uit productie nemen van een oppervlakte niet voor
      een producent wiens aanvraag oppervlakten betrekking heeft op een kleinere oppervlakte dan die volgens de voor de
      desbetreffende productieregio of productieregio’s vastgestelde opbrengsten nodig is om 92 ton graan te produceren,
      tenzij

      a. het bedrijf van de producent na 30 juni 1992 is gevormd door de splitsing van een bestaand bedrijf, en

      b. de splitsing bedoeld in onderdeel a kennelijk voornamelijk tot doel heeft de verplichting bedoeld in het eerste
      lid te ontgaan.

      5 Een producent die overeenkomstig het vierde lid is vrijgesteld van de verplichting, bedoeld in het eerste lid,
      heeft voor de oppervlakte akkerland, die bestaat uit percelen van tenminste 20 meter breed met elk een oppervlakte
      van tenminste 0,3 hectare, die hij uit productie neemt recht op subsidie in het kader van deze regeling.

      6 In afwijking van de minimumbreedte genoemd in het eerste lid, is het de producent toegestaan percelen van ten
      minste 10 meter breed met elk een oppervlakte van ten minste 0,3 hectare, uit productie te nemen, indien zij
      grenzen aan nimmer opdrogende waterlopen of meren, onder de navolgende voorwaarden:

      a. de percelen worden ingezaaid met een groenbemester overeenkomstig [artikel 20, tweede lid][ref1];

      b. op de betrokken percelen worden in de periode vanaf 15 januari tot en met 30 september:

        - geen dierlijke of overige organische meststoffen gebruikt,
        - geen fytofarmaceutische producten, herbiciden daaronder begrepen, gebruikt, behoudens voor de pleksgewijze
      bestrijding van onkruid die uit landbouwkundig oogpunt noodzakelijk is.

      7 Voor de uit productie genomen percelen, bedoeld in het eerste, derde, vijfde en zesde lid bedraagt de subsidie
      per hectare 63 euro vermenigvuldigd met de gemiddelde graanopbrengst gemeten in tonnen per hectare van de
      desbetreffende productieregio.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel20
