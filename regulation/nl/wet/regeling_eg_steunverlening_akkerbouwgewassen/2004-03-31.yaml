  - number: '25'
    text: |-
      1 De producent doet aangifte bij LASER ter zake van de met grondstoffen bebouwde percelen en legt daarbij tevens
      een origineel exemplaar van de met de eerste verwerker of inzamelaar gesloten overeenkomst over.

      2 De aangifte, die deel uitmaakt van de aanvraag oppervlakten, bedoeld in [artikel 6][ref1], voldoet aan artikel 5
      van [verordening 2461/1999](31999R2461).

      3 De totale hoeveelheid grondstof die op de betrokken percelen is geproduceerd, wordt uiterlijk op 1 maart van het
      kalenderjaar volgend op het kalenderjaar waarin zij wordt geoogst, geleverd aan de eerste verwerker of inzamelaar.

      4 Ten bewijze dat is voldaan aan het bepaalde in het derde lid, legt de producent uiterlijk op 1 maart van het
      kalenderjaar volgend op het kalenderjaar waarin de aanvraag oppervlakten, bedoeld in [artikel 6, eerste lid][ref2],
      is ingediend, aan LASER een door de erkende eerste verwerker of diens gemachtigde of de inzamelaar of diens
      gemachtigde getekende verklaring van overname, alsmede fakturen en betalingsbewijzen met betrekking tot de
      geleverde grondstoffen over, tezamen met de aangifte, bedoeld in artikel 10, eerste lid, van [verordening
      2461/1999](31999R2461).

      5 De verklaring van overname, bedoeld in het vierde lid, wordt gesteld op een door LASER vastgesteld formulier dat
      door de erkende eerste verwerker of inzamelaar volledig en naar waarheid is ingevuld, ondertekend en gedagtekend.

      6 Voor grondstoffen als bedoeld in artikel 9, eerste lid, van [verordening 2461/1999](31999R2461) bepaalt LASER
      vóór de oogst de representatieve opbrengsten aan de hand van de oogstgegevens van het bedrijf van de producent en
      stelt de producent hiervan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008301#Artikel6
