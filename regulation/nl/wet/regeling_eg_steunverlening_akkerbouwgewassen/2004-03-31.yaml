  - number: '30'
    text: |-
      Door het productschap kunnen met inachtneming van [verordening 2461/1999](31999R2461) nadere regelen worden gesteld
      die noodzakelijk zijn voor de uitoefening van de aan het productschap in de voorgaande bepalingen toegekende
      bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel30
  - number: '31'
    text: |-
      1 In afwijking van [artikel 17][ref1] mogen producenten overeenkomstig de bepalingen van hoofdstuk III van
      [verordening 2461/1999](31999R2461) en [artikel 32][ref2], de overeenkomstig [artikel 16][ref3] uit productie
      genomen oppervlakte gebruiken voor het verbouwen van de in bijlage II bij genoemde verordening genoemde
      grondstoffen.

      2 De grondstoffen worden verbouwd specifiek met het ook op de verwerking van de grondstoffen in de Europese
      Gemeenschap tot een of meer eindproducten welke zijn genoemd in bijlage III van [verordening 2461/1999](31999R2461)
      en welke niet zijn bestemd voor menselijke of dierlijke voeding.

      3 In afwijking van [artikel 17][ref4] behoeven de betrokken percelen akkerland niet vanaf 15 januari uit productie
      te worden genomen mits de bepalingen in [verordening 2461/1999](31999R2461) en deze paragraaf in acht worden
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0008301#Artikel32
