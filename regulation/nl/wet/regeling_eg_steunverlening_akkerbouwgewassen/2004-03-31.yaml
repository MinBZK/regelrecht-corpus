preamble:
  text: |-
    Gelet op verordening (EEG) nr. 1765/92 van de Raad van 30 juni 1992 tot instelling van een steunregeling voor
    producenten van bepaalde akkerbouwgewassen (PbEG L 181) en de op grond van de artikelen 12 en 16 van deze
    verordening door de Commissie vastgestelde nadere bepalingen;

    Gelet op verordening (EEG) nr. 3508/92 van de Raad tot instelling van een geïntegreerd beheers- en controlesysteem
    van bepaalde steunregelingen (PbEG L 355) en de door de Commissie op grond van artikel 12 van deze verordening
    vastgestelde nadere bepalingen;

    Overwegende dat toepassing moet worden gegeven aan de hiervoor genoemde verordeningen en de ter uitvoering daarvan
    door de Commissie vastgestelde verordeningen;

    Overwegende dat deze bepalingen rechtstreekse werking in de Nederlandse rechtssfeer hebben maar dat ten behoeve van
    de juiste uitvoering en nadere invulling van deze bepalingen regelgeving noodzakelijk is;

    Overwegende dat als gevolg van vele wijzigingen in vorenbedoelde verordeningen een hercodificatie van de
    regelgeving wenselijk is;

    Voorts gelet op de artikelen 15, 19, 27 en 28 van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            minister:

              Minister van Landbouw, Natuur en Voedselkwaliteit;



            b
             LASER:

              Dienst Landelijke service bij regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit



            c
             AID:

              Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



            d
             productschap:

              Hoofdproductschap Akkerbouw.



            e
             raadsverordening:

              [verordening (EG) nr. 1251/1999](31999R1251) van de Raad van de Europese Unie van 17 mei 1999 tot
      instelling van een steunregeling voor producenten van bepaalde akkerbouwgewassen (PbEG L 160)



            f

              [verordening 3508/92](31992R3508):

              [verordening (EEG) nr.3508/92](31992R3508) van de Raad van 27 november 1992 tot instelling van een
      geïntegreerd beheers- en controlesysteem voor bepaalde communautaire steunregelingen (PbEG L 355);



            g

              [verordening 2419/2001](32001R2419):

              [verordening (EG) nr. 2419/2001](32001R2419) van de Commissie van de Europese Gemeenschappen van 11
      december 2001 houdende uitvoeringsbepalingen inzake het bij [verordening (EEG) nr. 3508/92](31992R3508) van de Raad
      van de Europese Gemeenschappen ingestelde geïntegreerde beheers- en controlesysteem voor bepaalde communautaire
      steunregelingen (PbEG L 327)



            h

              [verordening 2461/1999](31999R2461):

              [verordening (EG) nr. 2461/1999](31999R2461) van de Commissie van de Europese Gemeenschappen van 19
      november 1999 houdende uitvoeringsbepalingen van [Verordening (EG) nr. 1251/1999](31999R1251) van de Raad wat het
      gebruik betreft van uit productie genomen grond voor de productie van grondstoffen voor de vervaardiging in de
      Gemeenschap, van niet specifiek voor voeding of vervoedering bestemde producten (PbEG L 299);.



            i

              [verordening 2316/1999](31999R2316) :

              [verordening (EG) nr. 2316/1999](31999R2316) van de Commissie van de Europese Gemeenschappen van 22 oktober
      1999 houdende uitvoeringsbepalingen van [Verordening (EG) nr. 1251/1999](31999R1251) van de Raad tot instelling van
      een steunregeling voor producenten van bepaalde akkerbouwgewassen (PbEG L 280);.



            j

              [verordening 1782/2003](32003R1782):

              [verordening (EG) nr. 1782/2003](32003R1782) van de Raad van de Europese Unie van 29 september 2003 tot
      vaststelling van gemeenschappelijke voorschriften voor regelingen inzake rechtstreekse steunverlening in het kader
      van het gemeenschappelijk landbouwbeleid en tot vaststelling van bepaalde steunregelingen voor landbouwers en
      houdende wijziging van de [Verordeningen (EEG) nr. 2019/93](31993R2019), [(EG) nr. 1452/2001](32001R1452), [(EG)
      nr. 1453/2001](32001R1453), [(EG) nr. 1454/2001](32001R1454), [(EG) nr. 1868/94](31994R1868), [(EG) nr. 1251/1999]
      (31999R1251), [(EG) nr. 1254/1999](31999R1254), [(EG) nr. 1673/2000](32000R1673), [(EEG) nr. 2358/71](31971R2358)
      en [(EG) nr. 2529/2001](32001R2529) (PbEG L 270);



            k

              [verordening 2237/2003](32003R2237):

              [verordening (EG) nr. 2237/2003](32003R2237) van de Commissie van de Europese Gemeenschappen van 23
      december 2003 houdende uitvoeringsbepalingen voor bepaalde steunregelingen die zijn ingesteld bij Titel IV van
      [Verordening (EG) nr. 1782/2003](32003R1782) van de Raad tot vaststelling van gemeenschappelijke voorschriften
      voor regelingen inzake rechtstreekse steunverlening in het kader van het gemeenschappelijk landbouwbeleid en tot
      vaststelling van bepaalde steunregelingen voor landbouwers (PbEG L 339);



            l
            producent:

              individuele landbouwondernemer die op zijn bedrijf voor eigen rekening en risico akkerland inzaait met
      akkerbouwgewassen dan wel ander bouwland beteelt met energiegewassen, eiwithoudende gewassen of zetmeelaardappelen
      of beplant heeft met notenbomen, met de bedoeling deze gewassen te oogsten;



            m
            bedrijf:

              geheel van productie-eenheden dat door de producent wordt beheerd en dat zich bevindt op het Nederlandse
      grondgebied;



            n
             akkerland:

              geheel van tot het bedrijf behorende grond met uitzondering van grond die op 31 december 1991 als blijvend
      grasland, voor meerjarige teelten, als bosgrond of voor niet-agrarische doeleinden in gebruik was, en
      grond die uiterlijk op 31 december 1991 overeenkomstig de Beschikking ter zake van het uit productie nemen van
      bouwland uit productie is geweest met uitzondering van grond die overeenkomstig [artikel 4][ref1] is vervangen door
      andere gronden;.



            o
             perceel:

              aaneengesloten oppervlakte die daadwerkelijk wordt benut voor de teelt van een akkerbouwgewas dan wel voor
      het uit productie nemen als bedoeld in de onderhavige regeling, welke is gelegen in één productieregio;



            p
             akkerbouwgewassen:

              gewassen die worden genoemd in bijlage I van de raadsverordening;



            q
            verkoopseizoen:

              tijdvak dat begint op 1 juli van een kalenderjaar en eindigt op 30 juni van het daarop volgende
      kalenderjaar;



            r
            productieregio I:

              gebied dat is gelegen binnen de gemeentegrenzen welke op 1 mei 1991 golden voor de in bijlage 1 bij deze
      regeling genoemde gemeenten of gedeelten van gemeenten en de gebieden welke met een groene arcering zijn aangegeven
      op de kaarten in bijlage 4;



            s
             productieregio II:

              gebied in Nederland dat niet behoort tot productieregio I;



            t
            basisareaal:

              regionale basisareaal als bedoeld in [artikel 2, tweede lid][ref2], van de raadsverordening;



            u
             inzamelaar:

              inzamelaar als bedoeld in artikel 2, onderdeel b, van [verordening 2461/1999](31999R2461);.



            v
             eerste verwerker:

              eerste verwerker als bedoeld in artikel 2, onderdeel c, van [verordening 2461/1999](31999R2461);



            w
            aanvraag oppervlakten:

              aanvraag tot subsidievaststelling als bedoeld in artikel 6, eerste lid, van [verordening 3508/92]
      (31992R3508).


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008301#Artikel2
