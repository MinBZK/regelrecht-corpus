  - number: '13'
    text: |-
      1 Indien de producent één of meer verplichtingen als bedoeld in de in [artikel 1][ref1] genoemde verordeningen
      of van deze regeling niet kan nakomen wegens overmacht of buitengewone omstandigheden als bedoeld in artikel 48
      van [verordening 2419](onbekend)/2001, ontvangt LASER binnen 10 werkdagen vanaf het tijdstip waarop dit voor de
      producent mogelijk is, hiervan schriftelijk bericht.

      2 De producent voegt bij de berichtgeving, bedoeld in het eerste lid, bewijsstukken bij ter ondersteuning van zijn
      beroep op overmacht of buitengewone omstandigheden als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel1
