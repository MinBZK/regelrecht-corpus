  - number: '29'
    text: |-
      1 Indien de overeenkomst, bedoeld in [artikel 24][ref1], wordt gewijzigd of ontbonden nadat de producent een
      aanvraag oppervlakten heeft ingediend kan de producent slechts aanspraak maken op een subsidie indien de producent
      aan LASER respectievelijk de in Nederland gevestigde verwerker of inzamelaar aan het productschap, uiterlijk op de
      door de minister overeenkomstig [artikel 8][ref2] vastgestelde datum voor ontvangst van de aanvraag oppervlakten,
      een origineel exemplaar dan wel een gewaarmerkt afschrift van de schriftelijke overeenkomst tussen de producent en
      de eerste verwerker of inzamelaar, waarbij de overeenkomst wordt gewijzigd of ontbonden, overlegt.

      2 Onverminderd het bepaalde in het eerste lid staat LASER toe dat de overeenkomst wordt gewijzigd of, voorzover
      dit gerechtvaardigd is, wordt ontbonden indien de producent haar hiervan vooraf in kennis stelt en bewijsmateriaal
      overlegt waaruit blijkt, dat hij wegens specifieke omstandigheden de in de overeenkomst vermelde grondstoffen niet
      of niet volledig kan leveren. Indien de wijziging van de overeenkomst tot een vermindering van de oppervlakte leidt
      waarvoor de subsidie is aangevraagd, of indien de overeenkomst wordt ontbonden brengt de producent om aanspraak op
      een subsidie te kunnen blijven maken de betrokken percelen in onbeteelde toestand en draagt hij er zorg voor dat de
      grondstoffen onder toezicht van de AID worden ondergewerkt of vernietigd.

      3 Na verkregen toestemming van LASER als bedoeld in het tweede lid, legt de producent een origineel exemplaar
      van de schriftelijke overeenkomst, dan wel een gewaarmerkt kopie daarvan binnen 20 werkdagen na haar sluiting
      over aan LASER en stelt hij LASER in kennis van de datum van de wijziging of ontbinding van de overeenkomst en de
      datum waarop de betrokken percelen in onbeteelde toestand worden gebracht en de grondstof wordt ondergewerkt of
      vernietigd. Laatstgenoemde datum is ten minste twee weken na deze kennisgeving gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0008301#Artikel8
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel29
