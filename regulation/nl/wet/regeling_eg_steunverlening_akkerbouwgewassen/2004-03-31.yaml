      Bij de inzaai van lijnzaad wordt zaad gebruikt van vlasrassen die worden beschouwd als andere rassen dan die welke
      hoofdzakelijk zijn bestemd voor de productie van vezels als bedoeld in [artikel 15, eerste lid][ref1].


