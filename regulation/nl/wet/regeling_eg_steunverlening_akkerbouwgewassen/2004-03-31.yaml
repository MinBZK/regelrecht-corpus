    text: |-
      Overeenkomstig de voorwaarden van [verordening 1782/2003](32003R1782) en [verordening 2237/2003](32003R2237) komt
      een producent slechts in aanmerking voor subsidie voor eiwithoudende gewassen als bedoeld in [artikel 32a][ref1],
      indien de hoeveelheid zaad per hectare ingezaaid met eiwithoudende gewassen ten minste 70 kg is.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel32a
