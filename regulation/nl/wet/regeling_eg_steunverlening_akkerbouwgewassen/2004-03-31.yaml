      2 Ten bewijze dat de producent voor zijn gehele productie voldoet aan de voorschriften die zijn vastgesteld
      bij [verordening (EEG) nr. 2092/91](31991R2092) gaat de aanvraag oppervlakten vergezeld van een bewijs van
