  - number: '15'
    text: |-
      1 Bij de inzaai van vezelvlas en vezelhennep wordt zaad gebruikt als bedoeld in [artikel 7][ref1] bis, eerste lid,
      onderdeel b, eerste volzin, van [verordening 2316/1999](31999R2316). Voor vezelhennep geldt voorts dat het zaad
      gecertificeerd moet zijn overeenkomstig [richtlijn 69/208/EEG](31969L0208).

      2 De producent dient uiterlijk op 15 september van het verkoopseizoen waarop de aanvraag oppervlakten betrekking
      heeft, bij LASER een kopie in van het contract of de verbintenis bedoeld in [artikel 7][ref2] bis, eerste lid,
      onderdeel a, van [verordening 2316/1999](31999R2316).

      3 De producent doet aangifte bij LASER terzake de met vezelvlas en vezelhennep bebouwde percelen.

      4 De aangifte, die deel uit maakt van de aanvraag oppervlakten, voldoet aan artikel 7bis, derde lid, van
      [verordening 2316/1999](31999R2316).

      5 De teeltaangifte gaat vergezeld van de officiële etiketten van het gebruikte vezelvlaszaad en vezelhennepzaad
      bedoeld in [artikel 7][ref3] bis, tweede lid, van [verordening 2316/1999](31999R2316).

      6 In afwijking van het derde lid, gaat, indien op een perceel vezelvlas wordt geteeld voor de productie van
      zaaizaad, de teeltaangifte vergezeld van een kopie van de aanmelding van het betrokken perceel bij de stichting
      Nederlandse Algemene Keuringsdienst voor zaaizaad en pootgoed van landbouwgewassen.

      7 Indien ten behoeve van de teelt van vezelvlas zaad is gebruikt dat niet is gecertificeerd overeenkomstig het bij
      of krachtens [richtlijn 69/208/EEG](31969L0208) bepaalde, gaat de teeltaangifte vergezeld van bewijsstukken waaruit
      blijkt dat het ingezaaide zaad voldoet aan het eerste lid.

      8 In afwijking van het vijfde tot en met het zevende lid, worden, indien de inzaai plaatsvindt na de sluiting van
      de aanvraagperiode, de aldaar bedoelde bewijsstukken uiterlijk op 30 juni van het verkoopseizoen waarop de aanvraag
      oppervlakten betrekking heeft bij LASER ingediend.


