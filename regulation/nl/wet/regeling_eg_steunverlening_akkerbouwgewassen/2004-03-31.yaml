  - number: '3'
    text: |-
      Aan producenten van akkerbouwgewassen die een aanvraag oppervlakten indienen wordt door de minister jaarlijks
      ter zake van met akkerbouwgewassen ingezaaide oppervlakten of braakgelegde oppervlakten overeenkomstig de
      raadsverordening, [verordening 3508/92](31992R3508), [verordening 2419](onbekend)/2001, [verordening 2316/1999]
      (31999R2316), [verordening 2461/1999](31999R2461), deze regeling en het overeenkomstig [artikel 3][ref1] van de
      raadsverordening opgestelde regioplan, subsidie verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel3
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008301
        artikel: '3'
        paragraaf: '2'
  - number: '4'
    text: |-
      1 Onder de voorwaarden, die voortvloeien uit de in [artikel 3][ref1] genoemde verordeningen alsmede onder de
      bepalingen van deze regeling, komt de producent in aanmerking voor een subsidie voor percelen akkerland:

      a. met elk een oppervlakte van tenminste 0,3 hectare;

      b. die volledig worden ingezaaid met een akkerbouwgewas met inachtneming van de volgende minimum hoeveelheden
      ingezaaid zaad per hectare:




                    koolzaad en raapzaad:

                  4 kg;






                    zonnebloempitten:

                  3,5 kg;






                    sojabonen:

                  50 kg;






                    eiwithoudende gewassen:

                  70 kg






                    maïs:

                  15 kg;






                    boekweit:

                  25 kg;



                    kanariezaad:

                  20 kg;



                    overige granen:

                  50 kg;



                    lijnzaad van ander vlas dan vezelvlas:

                  30 kg;



                    vezelvlas:

                  70 kg;



                    vezelhennep:

                  25 kg;



                    vezelhennep voor de productie van zaaizaad:

                  8 kg;



                    quinoa:

                  3 kg;



                    Eragrostis

                  1 kg.



      c. die door de producent worden onderhouden behalve in uitzonderlijke, door de minister als zodanig erkende
      omstandigheden en onder de door hem daarbij gestelde voorwaarden;

      2 Suikermaïs en vezelhennep worden uiterlijk op 15 juni voorafgaand aan het betrokken verkoopseizoen ingezaaid.

      3 De producent kan percelen akkerland als bedoeld in het eerste lid vervangen door andere gronden indien:

      a. de perceelsindeling of de verkaveling van het bedrijf van overheidswege wordt gewijzigd of op grond van de
      [Plantenziektenwet][ref2] beperkingen worden gesteld aan het telen van akkerbouwgewassen op het bedrijf;

      b. de oppervlakte van de vervangende gronden niet groter is dan die van de te vervangen percelen akkerland;

      c. voor zover van toepassing, de eigenaar, beperkt gebruiksgerechtigde, verpachter dan wel pachter van de te
      vervangen percelen akkerland heeft ingestemd met het vervangen van deze percelen;

      d. en voorafgaande aan het betrokken verkoopseizoen schriftelijk toestemming is verkregen van LASER. Een
      schriftelijke aanvraag daartoe kan in de periode die loopt van 15 oktober tot en met 1 december worden ingediend.

      4 Onverminderd het bepaalde in de aanhef van het eerste lid komt de producent in aanmerking voor een subsidie voor
      percelen bestemd voor de teelt van vezelvlas of vezelhennep en eventueel voor de verplichte braaklegging daarvan,
      voor zover voor deze percelen in het kader van [verordening (EEG) nr. 1308/70](31970R1308) van de Raad van 29 juni
      1970 houdende een gemeenschappelijke ordening der markten in de sector vlas en hennep (PbEG 146) steun is toegekend
      gedurende ten minste één van de verkoopseizoenen 1998/1999 tot en met 2000/2001.

      5 In afwijking van het eerste en het vierde lid wordt geen subsidie verleend indien dit bedrag 50 euro of lager is.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002075
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel4
