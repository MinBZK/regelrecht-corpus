        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002075
  - number: '5'
    text: |-
      De subsidies worden berekend overeenkomstig [artikel 7][ref1] van de raadsverordening. Bij de berekening van
      de subsidie voor oliehoudende zaden wordt de gemiddelde graanopbrengst van de betrokken productieregio als
      uitgangspunt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel7
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008301
        artikel: '7'
        paragraaf: '3'
  - number: '6'
    text: |-
      1 Om voor een subsidie in aanmerking te komen dient de producent bij LASER een aanvraag oppervlakten in.

      2 Een aanvraag oppervlakten heeft betrekking op alle percelen die behoren tot het bedrijf van de producent .
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel6
  - number: '7'
    text: |-
      1 Voor een aanvraag oppervlakten of mededeling in het kader van deze regeling maakt de producent gebruik van
      een door LASER vastgesteld formulier dat door de producent volledig en naar waarheid is ingevuld, ondertekend en
      gedagtekend.

      2 Bij de indiening van een formulier, als bedoeld in het eerste lid, legt de producent alle bewijsstukken over ten
      aanzien waarvan zulks wordt verlangd ingevolge het betreffende formulier, dan wel ingevolge deze regeling.

      3 De producent is verplicht degene die belast is met de uitvoering van deze regeling op diens verzoek alle ter zake
      van die gegevens gewenste nadere inlichtingen terstond en naar waarheid te verstrekken.

      4 LASER is belast met de uitvoering van deze regeling waaronder begrepen het uitreiken van formulieren, alsmede met
      het wederom in ontvangst nemen van de formulieren met bijbehorende bescheiden.
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel7
  - number: 7a
    text: |-
      1 In afwijking van [artikel 7, eerste lid][ref1], kan de producent gebruik maken van een elektronisch formulier
      onder de voorwaarden van de [Regeling landbouwtelling en GDI 2004][ref2].

      2 De bewijsstukken die ingevolge deze regeling verlangd worden, overlegt de producent schriftelijk voor zover deze
      niet elektronisch overgelegd kunnen worden


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0016525
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0008301
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016525
  - number: '8'
    text: |-
      1 De aanvraagperiode voor de aanvraag oppervlakten loopt van 1 april tot en met 15 mei.

      2 Indien de aanvraag oppervlakten na sluiting van de aanvraagperiode, bedoeld in het eerste lid, door LASER wordt
      ontvangen, wordt de subsidie waarop de producent recht zou hebben indien LASER de aanvraag oppervlakten tijdig zou
      hebben ontvangen, verlaagd overeenkomstig artikel 13 van [verordening 2419/2001](32001R2419), behoudens overmacht
      of buitengewone omstandigheden als bedoeld in [artikel 13][ref1].

      3 Indien de aanvraag oppervlakten meer dan 25 kalenderdagen na sluiting van de aanvraagperiode, bedoeld in
      het eerste lid, door LASER wordt ontvangen, wordt de aanvraag afgewezen, behoudens overmacht of buitengewone
      omstandigheden als bedoeld in [artikel 13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008301#Artikel13
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008301
        artikel: '13'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0008301
        artikel: '13'
        paragraaf: '7'
  - number: '9'
    text: |-
      1 Na sluiting van de aanvraagperiode, doch uiterlijk op de datum die voor de inzaai of overeenkomstig de
      raadsverordening is vastgesteld, kan de aanvraag oppervlakten worden gewijzigd overeenkomstig artikel 8 van
      [verordening 2419](onbekend)/2001.

      2 Indien de wijzigingen, bedoeld in het eerste lid, na de aldaar bedoelde datum door LASER worden ontvangen,
      wordt de subsidie die betrekking heeft op het daadwerkelijke gebruik van de betrokken percelen verlaagd met 1% per
      werkdag dat de wijzigingen te laat worden ingediend.

      3 In afwijking van het tweede lid, worden de wijzigingen, bedoeld in het eerste lid, die meer dan 25 kalenderdagen
      na sluiting van de aanvraagperiode door LASER worden ontvangen, niet meer geaccepteerd. Indien deze uiterste datum
      evenwel ligt voor of op de in het eerste lid bedoelde datum voor de inzaai, worden de wijzigingen die na de datum
      voor de inzaai worden ontvangen niet meer geaccepteerd.

      4 In afwijking van het eerste lid kan de aanvraag oppervlakten in geval van een door LASER erkende kennelijke fout
      na de in het eerste lid bedoelde datum worden verbeterd.

      5 De aanvraag oppervlakten kan te allen tijde geheel of gedeeltelijk worden ingetrokken, echter indien LASER, de
      AID of het productschap de producent in kennis heeft gesteld van:

      a. onregelmatigheden in zijn aanvraag oppervlakten, of

      b. het voornemen bij hem een controle ter plaatse uit te voeren, waarbij vervolgens onregelmatigheden worden
      ontdekt, mogen de bij de onregelmatigheden betrokken gedeelten van de aanvraag niet worden ingetrokken.

      6 Van de wijziging bedoeld in het eerste lid, de verbetering bedoeld in het vierde lid en de intrekking bedoeld in
      het vijfde lid wordt LASER schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel9
  - number: 9a
    text: |-
      Indien een bedrijf volledig wordt overgedragen nadat de aanvraag oppervlakten is ingediend en voordat aan alle
      voorwaarden voor de toekenning van subsidie is voldaan, kan aan de cessionaris de door de cedent aangevraagde
      subsidie worden toegekend indien:

      a. LASER de schriftelijke melding door de cessionaris van de overdracht binnen een maand na de overdracht ontvangt,

      b. de cessionaris LASER verzoekt om betaling van de door de cedent aangevraagde subsidie,

      c. de cessionaris alle door LASER verlangde bewijsstukken overlegt, en

      d. wordt voldaan aan alle voorwaarden voor de toekenning van de subsidie.
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel9a
  - number: '11'
    text: |-
      1 De producent houdt op zijn bedrijf een afschrift van een volledig en naar waarheid ingevulde boekhouding voor de
      gewassen beschikbaar overeenkomstig het door LASER vastgestelde formulier.

      2 Bij de boekhouding, bedoeld in het eerste lid, bewaart de producent alle door LASER voorgeschreven bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel11
  - number: 11a
    text: |-
      1 De in [artikel 32][ref1] tot en met 35 van [verordening 2419](onbekend)/2001 bedoelde kortingen en uitsluitingen
      zijn niet van toepassing:

      a. indien de producent LASER feitelijk juiste gegevens heeft verschaft of hij anderszins kan bewijzen dat hem geen
      schuld treft, of

      b. op die onderdelen van de aanvraag oppervlakten ten aanzien waarvan een producent, nadat hij heeft vastgesteld
      dat zijn aanvraag fouten bevat of niet langer juist is, LASER daarvan schriftelijk in kennis stelt, tenzij de
      producent door LASER, de AID of het productschap in kennis is gesteld van het voornemen bij hem een controle ter
      plaatse te verrichten of reeds over onregelmatigheden in de betrokken aanvraag is ingelicht.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel32
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0008301
        artikel: '32'
        paragraaf: '11'
  - number: '12'
    text: |-
      1 Behoudens de gevallen waarin artikel 34, 34a of de kortingen en uitsluitingen, bedoeld in artikel 32 tot en met
      35 van [verordening 2419/2001](32001R2419) van toepassing zijn, vervalt het recht op een subsidie naar de mate van
      de ernst en omvang van de geconstateerde overtreding indien blijkt dat de producent een of meer bepalingen van de
      raadsverordening, van de in [artikel 1][ref1] genoemde verordeningen of van deze regeling geheel of gedeeltelijk
      niet heeft nageleefd of indien bij zijn aanvraag tot subsidieverlening onjuiste gegevens zijn verstrekt.

      2 Indien het recht op een subsidie vervalt zoals bedoeld in het eerste lid, betaalt de producent het reeds
      ontvangen bedrag terug, vermeerderd met de rente vanaf het moment dat de producent in kennis is gesteld van de
      verplichting het betrokken bedrag terug te betalen.

      3 De rente, bedoeld in het tweede lid, is de wettelijke rente in Nederland geldende op de laatste dag van de
      kalendermaand waarin de subsidie is betaald.

      4 De subsidie vermeerderd met de rente betaalt de producent terug op eerste vordering van LASER, zonder dat
      ingebrekestelling of rechterlijke tussenkomst is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel1
