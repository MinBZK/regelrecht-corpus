      1 In afwijking van [artikel 17][ref1] en met inachtneming van artikel 19 van [verordening 2316/1999](31999R2316)
      en [artikel 20, tweede tot en met zesde lid][ref2], mag de overeenkomstig [artikel 16][ref3] uit productie genomen
      oppervlakte worden gebruikt om, onder verstrekking van een door een overheidsinstantie verleende subsidie ter
      hoogte van de daadwerkelijke en redelijke kosten van de producent, een bijdrage te leveren aan de verbetering dan
      wel de instandhouding van natuurwaarden.

      2 De natuurwaarden, bedoeld in het eerste lid, hebben betrekking op zeldzame of sterk in aantal achteruitgaande
      diersoorten, plantensoorten en biotopen, waaronder:

      a. bloembezoekende insekten;

      b. zoogdieren, reptielen en amfibieën;

      c. akkervogels en roofvogels;

      d. akkerkruiden;

      e. trekvogels.


