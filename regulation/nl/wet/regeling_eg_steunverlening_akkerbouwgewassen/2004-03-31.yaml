  - number: '32'
    text: |-
      1 De producent die overeenkomstig [artikel 31][ref1] grondstoffen wil verbouwen met het oog om deze zelf te
      gebruiken dan wel te verkopen, verbindt zich er ten opzichte van de minister schriftelijk toe dat aan deze
      grondstoffen een bestemming conform bijlage III van [verordening 2461/1999](31999R2461) wordt gegeven.

      2 De producent voegt de verbintenis, bedoeld in het eerste lid, bij zijn aanvraag oppervlakten in de
      verkoopseizoenen waarin de verbouw van de grondstoffen overeenkomstig [artikel 31][ref2] plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0008301#Artikel31
