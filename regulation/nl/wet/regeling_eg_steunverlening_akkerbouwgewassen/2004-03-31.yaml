        paragraaf: '5'
  - number: 32b
    text: |-
      1 Overeenkomstig de voorwaarden van [verordening 1782/2003](32003R1782) en [verordening 2237/2003](32003R2237) komt
      een producent slechts in aanmerking voor subsidie voor de teelt van noten als bedoeld in artikel 32a, indien een
      boomgaard als bedoeld in artikel 19, eerste lid, van [verordening 2237/2003](32003R2237):

      a. een oppervlakte heeft van ten minste 0,3 hectare;

      b. voldoet aan het minimum aantal bomen genoemd in artikel 19, derde lid, van [verordening 2237/2003](32003R2237).

      2 In afwijking van het eerste lid, aanhef, mag het aantal andere bomen in een boomgaard niet meer zijn dan 10%
      van het minimum aantal notenbomen per hectare genoemd in artikel 19, derde lid, van [Verordening 2237/2003]
      (32003R2237), behoudens ingeval het kastanjebomen betreft.

      3 Het subsidiebedrag voor de teelt van noten bedraagt € 241,50 per hectare.
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel32b
  - number: 32c
    text: |-
      1 Overeenkomstig de voorwaarden van [verordening 1782/2003](32003R1782) en [verordening 2237/2003](32003R2237) komt
      een producent slechts in aanmerking voor subsidie voor energiegewassen als bedoeld in [artikel 32a][ref1], indien
      hij niet meer dan één leveringscontract per grondstof sluit.

      2 Als bevoegde autoriteit waaronder de verwerkers van energiegewassen, bedoeld in Hoofdstuk 8 van [verordening
      2237/2003](32003R2237) ressorteren, wordt het productschap aangewezen. Het productschap kan met inachtneming van
      [verordening 1782/2003](32003R1782) en 2237/2003 nadere regelen stellen die noodzakelijk zijn voor de uitoefening
      van de aan het productschap toegekende bevoegdheden.

      3 Uiterlijk binnen 14 dagen na ontvangst van de door de aanvrager geleverde grondstof doet de eerste verwerker van
      energiegewassen de kennisgeving, bedoeld in artikel 44, derde lid, van [verordening 2237/2003](32003R2237).


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel32a
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel32c
    references:
