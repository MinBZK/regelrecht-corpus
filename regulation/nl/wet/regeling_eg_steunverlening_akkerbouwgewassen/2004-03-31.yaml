        artikel: '4'
        paragraaf: '2'
  - number: '36'
    text: |-
      Aan de vereenvoudigde regeling kan niet worden deelgenomen door een producent wiens bedrijf na 30 juni 1992 is
      gevormd door de splitsing van een bestaand bedrijf, indien deze splitsing kennelijk slechts tot doel heeft het
      ontgaan van de verplichting tot het uit productie nemen van percelen akkerland overeenkomstig het bepaalde in
      [artikel 16, eerste lid][ref1], en [artikel 22, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0008301#Artikel22
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel36
