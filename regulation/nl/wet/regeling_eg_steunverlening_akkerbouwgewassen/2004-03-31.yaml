  - number: '35'
    text: |-
      De subsidie voor granen wordt berekend overeenkomstig het bepaalde in [artikel 4][ref1] van de raadsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel4
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel35
    references:
