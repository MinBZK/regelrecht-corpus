      1 Percelen die zijn bebost in het kader van de Regeling stimulering bosuitbreiding op landbouwgronden
      uit hoofde van een aanvraag die na 28 juni 1995 is ingediend, kunnen worden gebruikt om aan de in
      [artikel 16, eerste lid][ref1], bedoelde verplichting te voldoen.

      2 Voor percelen, bedoeld in het eerste lid, die tevens worden gebruikt voor de verplichting tot het uit productie
      nemen van een oppervlakte als bedoeld in [artikel 16, eerste lid][ref2], heeft de producent geen aanspraak op
      subsidie, bedoeld in [artikel 16, zevende lid][ref3].


