  - number: '14'
    text: |-
      1 Het bij de inzaai van koolzaad of raapzaad gebruikte zaad moet behoren tot één van de in artikel 4, tweede lid,
      onderdelen a, c en d, van [verordening 2316/1999](31999R2316), onderscheiden categorieën zaaizaad.

      2 Indien inzaai plaatsvindt met zaaizaad, als bedoeld in artikel 4, tweede lid, onderdeel c, van [verordening
      2316/1999](31999R2316), is de producent verplicht:

      a. het betreffende perceel aan te melden voor keuring bij de stichting Nederlandse Algemene Keuringsdienst voor
      zaaizaad en pootgoed van landbouwgewassen overeenkomstig het door deze stichting vastgestelde keuringsreglement;

      b. een bewijs terzake van de aanmelding van het perceel bij zijn boekhouding, als bedoeld in [artikel 11][ref1]
      te bewaren;

      c. in voorkomend geval schriftelijke stukken waaruit de projectmatige opzet en het doel van het onderzoek of de
      proef blijken alsmede de resultaten daarvan, bij zijn boekhouding, bedoeld in [artikel 11][ref2], te bewaren.

      3 Artikel 2 van de Beschikking controlevoorschriften inzake het gebruik of de bestemming van bepaalde
      landbouwprodukten 1979 is van overeenkomstige toepassing op de geteelde gewassen, zolang de voorgeschreven
      bestemming niet volledig is bereikt.


