  - number: '20'
    text: |-
      1 In afwijking van [artikel 17][ref1] is het de producent vanaf 15 juli toegestaan de overeenkomstig
      [artikel 16][ref2] uit productie genomen oppervlakte ten behoeve van de oogst van het daaropvolgende kalenderjaar
      in te zaaien met de in bijlage 3 bij deze regeling genoemde gewassen.

      2 In afwijking van [artikel 17][ref3] mag de producent de overeenkomstig [artikel 16][ref4] uit productie genomen
      oppervlakte inzaaien met een groenbemester onder de navolgende voorwaarden:

      a. het betreft een groenbemester, genoemd in bijlage 2 bij de regeling, die uiterlijk op 31 mei wordt ingezaaid;

      b. de groenbemester evenals het eventueel opgekomen onkruid wordt vóór 31 augustus niet van het perceel afgevoerd
      en wordt vanaf 31 augustus tot 15 januari niet van het bedrijf afgevoerd. De groenvoederproductie die onder meer
      door het inkuilen van de groenbemester in de periode tot 15 januari is ontstaan, mag niet van het bedrijf worden
      afgevoerd;.

      c. de groenbemester is niet bestemd voor de productie van zaaizaad of pootgoed;

      d. de groenbemester wordt niet vóór 31 augustus voor agrarische doeleinden gebruikt en geeft niet vóór 15 januari
      aanleiding tot een groenvoederproductie die bedoeld is om te worden gecommercialiseerd;

      e. de groenbemester wordt niet vóór 31 augustus door enigerlei vorm van bewerking vernietigd.

      3 Op percelen welke niet zijn of worden ingezaaid met een groenbemester, mogen gedurende de in [artikel 17][ref5]
      bedoelde periode geen dierlijke meststoffen of overige organische meststoffen worden gebruikt.

      4 Ter zake van de percelen bedoeld in het derde lid, verklaart de producent bij de in [artikel 21][ref6] bedoelde
      aangifte dat hij geen groenbemester inzaait en dat hij op de betrokken percelen geen dierlijke meststoffen of
      overige organische meststoffen zal gebruiken gedurende de in [artikel 17][ref7] bedoelde periode.

      5 Op percelen welke zijn of worden ingezaaid met een groenbemester, is het gebruik van dierlijke meststoffen of
      overige organische meststoffen onder de volgende aanvullende voorwaarden geoorloofd:

      a. de producent verklaart bij de in [artikel 21][ref8] bedoelde aangifte dat hij gebruik wil kunnen maken van de
      mogelijkheid om op de betrokken percelen dierlijke meststoffen of overige organische meststoffen te gebruiken.

      b. de inzaai met groenbemesters geschiedt met gebruikmaking van een zodanige hoeveelheid zaaizaad en op zodanige
      wijze dat een volledige en gelijkmatige opkomst van het gewas op het gehele betrokken perceel gegarandeerd is.

      c. in ieder geval in de periode van 15 juni tot en met 14 juli is het gewas zodanig ontwikkeld dat sprake is van
      een volledige en gelijkmatig bedekking van de betrokken percelen met een groenbemester.

      6 Het is verboden om op uit productie genomen percelen akkerland:

      a. organische afvalstoffen te gebruiken;

      b. dierlijke meststoffen te gebruiken indien zulks in strijd is met het bepaalde in het Besluit gebruik dierlijke
      meststoffen 1998;

      c. fytofarmaceutische producten, daaronder begrepen herbiciden, te gebruiken, uitgezonderd de ingevolge de
      [Bestrijdingsmiddelenwet 1962][ref9] (Stb. 288) toegestane middelen;

      d. overige organische meststoffen te gebruiken indien zulks in strijd is met het bepaalde in het Besluit kwaliteit
      en gebruik overige organische meststoffen.


