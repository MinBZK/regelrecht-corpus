  - number: '2'
    text: |-
      1 Nederland heeft één nationaal basisareaal van 441.700 hectare, waarvan een apart basisareaal voor maïs 208.300
      hectare beslaat.

      2 Op het in het eerste lid genoemde nationale basisareaal wordt in mindering gebracht het met maïs
      onderscheidenlijk overige akkerbouwgewassen ingezaaide areaal dat wordt gebruikt voor het verzoek om subsidie
      krachtens [verordening (EG) nr. 1254/1999](31999R1254) van de Raad van de Europese Unie van 17 mei 1999 houdende
      een gemeenschappelijke ordening der markten in de sector rundvlees (PbEG L 160).

      3 De gemiddelde graanopbrengst, bedoeld in [artikel 3, eerste en vijfde lid][ref1], van de raadsverordening en de
      gemiddelde opbrengst van maïs, bedoeld in [artikel 3, eerste, tweede en vijfde lid][ref2], van de raadsverordening
      wordt voor productieregio I vastgesteld op 6660 kg per hectare voor maïs en 7080 kg per hectare voor de overige
      akkerbouwgewassen, en voor productieregio II op 6660 kg per hectare voor maïs en 4920 kg per hectare voor de
      overige akkerbouwgewassen.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008301#Artikel3
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel2
