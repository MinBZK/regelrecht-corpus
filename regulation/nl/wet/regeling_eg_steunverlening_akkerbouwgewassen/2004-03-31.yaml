  - number: '37'
    text: |-
      1 De Regeling steunverlening producenten akkerbouwgewassen wordt ingetrokken.

      2 De in het eerste lid genoemde regeling blijft evenwel van toepassing op aanvragen ingediend vóór de
      inwerkingtreding van de onderhavige regeling en waarop nog niet onherroepelijk is beslist.

      3 De uiterste datum voor het indienen van een aanvraag voor een compenserende betaling vermeld in de Regeling
      vaststelling indieningsperiode 1996 aanvraag oppervlakten producenten akkerbouwgewassen geldt als uiterste
      ontvangstdatum als bedoeld in [artikel 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel8
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008301
        artikel: '8'
        paragraaf: '3'
  - number: '38'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel38
  - number: '39'
    text: 'De regeling wordt aangehaald als: Regeling EG-steunverlening akkerbouwgewassen.'
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel39
