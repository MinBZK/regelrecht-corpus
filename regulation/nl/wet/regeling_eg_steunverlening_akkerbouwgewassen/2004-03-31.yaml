  - number: 32a
    text: |-
      1 De minister verstrekt jaarlijks met inachtneming van het bepaalde in [verordening 1782/2003](32003R1782),
      [verordening 2237/2003](32003R2237) en [paragraaf 11a van deze regeling][ref1], subsidie aan producenten die
      een aanvraag oppervlakten indienen ter zake van teelt van noten, energiegewassen, eiwithoudende gewassen en
      zetmeelaardappelen.

      2 [Paragraaf 5 van deze regeling][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Paragraaf11a
      [ref2]: https://wetten.overheid.nl/BWBR0008301#Paragraaf5
