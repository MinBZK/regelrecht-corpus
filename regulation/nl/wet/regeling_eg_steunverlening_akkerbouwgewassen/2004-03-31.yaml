      1 In afwijking van [artikel 17][ref1] mag de producent die voor zijn gehele productie voldoet aan de voorschriften
      die zijn vastgesteld bij [verordening (EEG) nr. 2092/91](31991R2092), overeenkomstig [artikel 23][ref2] bis
      van [verordening 2316/1999](31999R2316), de overeenkomstig [artikel 16][ref3] uit productie genomen oppervlakte
