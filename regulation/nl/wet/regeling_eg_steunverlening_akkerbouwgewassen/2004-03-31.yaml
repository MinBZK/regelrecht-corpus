  - number: '27'
    text: |-
      De producent die gebruik maakt van de mogelijkheid van verbouw van niet voor menselijke of dierlijke
      voeding bestemde grondstoffen op uit productie genomen akkerland, heeft aanspraak op subsidie als bedoeld in
      [artikel 16, zevende lid][ref1], indien is vastgesteld dat is voldaan aan artikel 12, eerste lid, van [verordening
      2461/1999](31999R2461), alsmede aan de bepalingen van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel16
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel27
