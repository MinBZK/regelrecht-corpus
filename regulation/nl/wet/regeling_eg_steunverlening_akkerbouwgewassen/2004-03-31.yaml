  - number: '34'
    text: |-
      De subsidie die betrekking heeft op de percelen, bedoeld in [artikel 33, eerste lid][ref1], waarop in strijd met
      [artikel 33][ref2] onkruidbestrijding met behulp van fytofarmaceutische producten heeft plaatsgevonden, wordt
      verminderd met 25%.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0008301#Artikel33
    url: https://wetten.overheid.nl/BWBR0008301/2004-03-31#Artikel34
