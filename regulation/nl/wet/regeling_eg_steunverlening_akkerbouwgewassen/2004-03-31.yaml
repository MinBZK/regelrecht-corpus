        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0008301
        artikel: '33'
        paragraaf: '12'
  - number: 34a
    text: |-
      De subsidie die betrekking heeft op de percelen die op een andere wijze uit productie worden genomen dan als
      bedoeld in de [artikelen 20, eerste en tweede lid][ref1], [20a][ref2], [21a][ref3], [23][ref4] en [31][ref5], wordt
      verminderd met 25%.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008301#Artikel20a
