        artikel: '16'
        paragraaf: '10'
  - number: '28'
    text: |-
      De zekerheid, bedoeld in [artikel 26, eerste lid, onderdeel b][ref1], wordt door het productschap vrijgegeven
      overeenkomstig artikel 15, vierde lid, van [verordening 2461/1999](31999R2461).


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel26
