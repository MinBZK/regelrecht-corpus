  - number: '26'
    text: |-
      1 De in Nederland gevestigde erkende eerste verwerker of inzamelaar die een overeenkomst als bedoeld in
      [artikel 24][ref1] heeft gesloten met een producent wiens bedrijf zich in Nederland of in een andere Lid-Staat van
      de Europese Unie bevindt:

      a. dient een origineel exemplaar van de overeenkomst of een gewaarmerkt kopie daarvan in bij het productschap
      binnen de termijnen, genoemd in artikel 13, eerste lid, van [verordening 2461/1999](31999R2461) en verstrekt
      daarbij de nodige gegevens over de verwerkingsketen, bedoeld in artikel 13, tweede lid, van [verordening 2461/1999]
      (31999R2461);

      b. stelt bij het productschap de volledige zekerheid, bedoeld in artikel 15, tweede lid, van [verordening
      2461/1999](31999R2461) binnen de in [artikel 13, eerste lid][ref2], van genoemde verordening bedoelde termijn.

      c. bewaart een origineel exemplaar van de overeenkomst of een gewaarmerkte kopie daarvan in zijn
      bedrijfsadministratie;

      d. doet aan het productschap uiterlijk op 1 maart van het kalenderjaar volgend op het kalenderjaar waarin de
      grondstof wordt geoogst, opgave van de totale ontvangen hoeveelheid grondstof welke is geproduceerd op de percelen
      waarop de overeenkomst betrekking op heeft, onder vermelding van soort en ras, alsmede van de referentie van de
      overeenkomst en van de naam en het adres van de partij bij de overeenkomst die de grondstof heeft geleverd en van
      de plaats van levering.

      2 De in Nederland gevestigde eerste verwerker of inzamelaar verstrekt de in artikel 13, vierde lid, van
      [verordening 2461/1999](31999R2461) bedoelde informatie binnen de daar genoemde termijnen aan het productschap,
      onder vermelding van de referentie van de overeenkomst.

      3 Indien de eerste verwerker niet zelf de grondstoffen verwerkt tot de eindproducten welke zijn genoemd in de
      overeenkomst met de in het eerste lid bedoelde producent, verplicht hij de afnemers van de grondstoffen of van
      de tussenproducten bij schriftelijke overeenkomst de grondstoffen tot deze eindproducten te verwerken of te
      doen verwerken dan wel een gelijk beding op te nemen in de met opvolgende afnemers te sluiten schriftelijke
      overeenkomsten, waarbij laatsten verplicht worden op hun beurt gelijke verplichtingen op te nemen in de door hen
      met afnemers te sluiten schriftelijke overeenkomsten.

      4 De [artikelen 2][ref3] en [3][ref4] van de Beschikking controlevoorschriften inzake het gebruik op de
      bestemming van bepaalde landbouwprodukten 1979 is vanaf de aflevering van de grondstoffen aan de eerste verwerker
      of inzamelaar van toepassing op bedoelde grondstoffen en de daaruit geproduceerde tussenproducten, zolang nog
      geen sprake is van de eindproducten waarop de met de in het eerste lid bedoelde producent gesloten overeenkomst
      betrekking heeft, met dien verstande dat waar in genoemde artikelen sprake is van de Minister, respectievelijk
      LASER gelezen wordt: het productschap.

      5 De AID is belast met:

      a. de afgifte van controle-exemplaren T 5, als bedoeld, in artikel 17 van [verordening 2461/1999](31999R2461) bij
      verzending van de in genoemd artikellid bedoelde grondstoffen, tussenproducten of bijproducten naar andere Lid-
      Staten van de Europese Unie;

      b. de behandeling en aftekening van controle-exemplaren T 5 die betrekking hebben op de grondstoffen en producten
      die van andere Lid-Staten naar Nederland zijn verzonden.

      6 De eerste verwerker kan de geleverde grondstoffen, tussenproducten of eindproducten en de inzamelaar kan de
      geleverde grondstoffen vervangen door equivalente producten van dezelfde onderverdeling van de gecombineerde
      nomenclatuur, van dezelfde handelskwaliteit en met dezelfde technische kenmerken mits hij het productschap hiervan
      vooraf in kennis stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0008301#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0008301#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0008301#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0008301#Artikel3
