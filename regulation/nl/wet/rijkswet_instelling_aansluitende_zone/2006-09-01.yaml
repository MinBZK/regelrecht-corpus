$id: rijkswet_instelling_aansluitende_zone
regulatory_layer: WET
publication_date: '2005-08-02'
valid_from: '2006-09-01'
bwb_id: BWBR0018265
url: https://wetten.overheid.nl/BWBR0018265/2006-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de rechtsmacht van het Koninkrijk uit te breiden en
    daartoe over te gaan tot de instelling van een aansluitende zone, in het bijzonder om inbreuken op voorschriften
    inzake douane, belastingen, immigratie, volksgezondheid of monumenten te voorkomen alsmede om inbreuken daarop
    te bestraffen;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018265/2006-09-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: Er is een aansluitende zone van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0018265/2006-09-01#Artikel1
  - number: '1.2'
    text: |-
      De aansluitende zone van het Koninkrijk is het gebied buiten en grenzend aan de territoriale zee van het Koninkrijk
      dat zich niet verder uitstrekt dan 24 zeemijlen vanaf de basislijnen, vanwaar de breedte van de territoriale zee
      wordt gemeten.
    url: https://wetten.overheid.nl/BWBR0018265/2006-09-01#Artikel1
  - number: '2'
    text: De buitengrens van de aansluitende zone wordt vastgesteld bij algemene maatregel van rijksbestuur.
    url: https://wetten.overheid.nl/BWBR0018265/2006-09-01#Artikel2
  - number: '3'
    text: |-
      Deze rijkswet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor elk van de landen van
      het Koninkrijk verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018265/2006-09-01#Artikel3
  - number: '4'
    text: 'Deze rijkswet wordt aangehaald als: Rijkswet instelling aansluitende zone.'
    url: https://wetten.overheid.nl/BWBR0018265/2006-09-01#Artikel4
