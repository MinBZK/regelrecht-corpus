  text: |-
    gehoord de korpschef van politie,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0036512/2015-04-14#ArtikelAanhef
articles:
  - number: '1'
    text: Ingesteld wordt de ‘Eremedaille voor verdienste politie’, nader te noemen de Eremedaille.
    url: https://wetten.overheid.nl/BWBR0036512/2015-04-14#Artikel1
  - number: '2'
    text: De Eremedaille wordt verleend in goud en kent één graad.
    url: https://wetten.overheid.nl/BWBR0036512/2015-04-14#Artikel2
  - number: '3'
    text: |-
      De Eremedaille kan worden toegekend aan ambtenaren van politie die een uitzonderlijke prestatie van eenheid
      overstijgend of landelijk belang hebben geleverd dan wel zich op uitzonderlijke wijze verdienstelijk hebben gemaakt
      voor de politie.
    url: https://wetten.overheid.nl/BWBR0036512/2015-04-14#Artikel3
  - number: '4'
    text: De Eremedaille kan éénmalig aan een persoon worden toegekend en kan ook postuum worden toegekend.
    url: https://wetten.overheid.nl/BWBR0036512/2015-04-14#Artikel4
  - number: '5'
    text: |-
      1 De toekenning van de Eremedaille geschiedt door de Minister van Veiligheid en Justitie.

      2 De uitreiking van de Eremedaille geschiedt door de korpschef, voor zover het ambtenaren van politie betreft als
      bedoeld in [artikel 2, aanhef en onder a, b en c van de Politiewet 2012][ref1].

      3 De uitreiking van de Eremedaille geschiedt door de voorzitter van het College van procureurs-generaal voor zover
      het ambtenaren van politie betreft als bedoeld in [artikel 2, aanhef en onder d van de Politiewet 2012][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0036512/2015-04-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '6'
    text: |-
      Het versiersel, uitgevoerd in goud, bestaat uit een ster met zeven stralen met in het midden het politielogo. In de
      rand rondom het logo staat de tekst: Waakzaam en dienstbaar. Het lint bestaat uit de kleuren blauw en geel en heeft
      geen overeenkomst met bestaande Nederlandse onderscheidingen.
    url: https://wetten.overheid.nl/BWBR0036512/2015-04-14#Artikel6
  - number: '7'
    text: |-
      Degene aan wie de Eremedaille is toegekend is gerechtigd tot het dragen van het knoopsgat insigne, de baton voor
      geüniformeerden en de draagmedaille.
    url: https://wetten.overheid.nl/BWBR0036512/2015-04-14#Artikel7
  - number: '8'
    text: De toekenning van de Eremedaille gaat vergezeld van een op naam gestelde oorkonde, ondertekend door de minister.
    url: https://wetten.overheid.nl/BWBR0036512/2015-04-14#Artikel8
  - number: '9'
    text: |-
      1 De Eremedaille kan worden ingetrokken op grond van feiten of omstandigheden die bij de toekenning redelijkerwijs
      niet bekend konden zijn en op grond waarvan de toekenning niet zou hebben plaatsgehad.

      2 Na intrekking is de betrokkene niet langer gerechtigd de aan de toekenning verbonden versierselen te dragen en
      worden deze samen met de oorkonde onverwijld aan de minister teruggegeven.
    url: https://wetten.overheid.nl/BWBR0036512/2015-04-14#Artikel9
  - number: '10'
    text: |-
      De kosten van de vervaardiging van het versiersel met toebehoren komen ten laste van de begroting van het
      politiekorps.
    url: https://wetten.overheid.nl/BWBR0036512/2015-04-14#Artikel10
  - number: '11'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0036512/2015-04-14#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Besluit tot een Eremedaille voor verdienste politie.'
    url: https://wetten.overheid.nl/BWBR0036512/2015-04-14#Artikel12
