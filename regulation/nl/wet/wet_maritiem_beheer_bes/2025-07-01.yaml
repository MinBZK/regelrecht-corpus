---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_maritiem_beheer_bes
regulatory_layer: WET
publication_date: '2011-02-16'
valid_from: '2025-07-01'
bwb_id: BWBR0028550
url: https://wetten.overheid.nl/BWBR0028550/2025-07-01
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.a
    text: '*openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.b
    text: '*gezagvoerder:* de kapitein van een schip of degene die hem als zodanig vervangt;'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.c
    text: |-
      *scheepsbeheerder:* degene die het beheer over een schip heeft, hetzij hij eigenaar, reder of boekhouder van de
      rederij van het schip is, hetzij het schip hem in rompbevrachting of anderszins in gebruik is gegeven;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.d
    text: |-
      *schip:* elk vaartuig, gebruikt of geschikt om te worden gebruikt als middel van vervoer te water, met inbegrip
      van een zeevissersschip, een watervliegtuig, een draagvleugelboot, een luchtkussenvoertuig, een drijvend platform,
      een verplaatsbare boorinstallatie, een baggermolen, een drijvende kraan, een ponton en elk ander drijvend werktuig,
      drijvend voorwerp of drijvende inrichting van soortgelijke aard, gedurende de tijd dat het drijft;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.e
    text: '*bestuurscollege:* bestuurscollege van een openbaar lichaam;'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.f
    text: '*luchtvaartuig:* elk vaartuig, gebruikt of geschikt om te worden gebruikt als middel van vervoer door de lucht;'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.g
    text: |-
      *bouwwerk:* elk bouwsel door menselijk toedoen tot stand gebracht in de zin van artikel 60, eerste lid, van het VN-
      Zeerechtverdrag, geen schip zijnde;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.h
    text: |-
      *offshore-installatie:* elk vast of drijvend bouwwerk dat zich bevindt in de territoriale wateren of de exclusieve
      economische zone rond de eilanden Bonaire, Sint Eustatius of Saba, en wordt gebruikt ten behoeve van de exploratie,
      exploitatie of productie van aardgas of aardolie, dan wel het laden of lossen van aardolieproducten;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.i
    text: |-
      *maritiem archeologisch erfgoed:* alle onder water gelegen, vóór tenminste vijftig jaar vervaardigde zaken welke
      van algemeen belang zijn wegens hun schoonheid, hun betekenis voor de wetenschap of hun cultuurhistorische waarde
      alsmede terreinen welke van algemeen belang zijn vanwege de daar aanwezige voornoemde zaken;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.j
    text: |-
      *zee:* alle mariene wateren, met uitzondering van de binnenwateren van de landen van het Koninkrijk der Nederlanden
      en die van andere Staten;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.k
    text: |-
      *binnenwateren:* de wateren van Bonaire, Sint Eustatius en Saba, gelegen landinwaarts vanaf de basislijnen, als
      bedoeld in artikel 8 van het VN-Zeerechtverdrag;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.l
    text: |-
      *rede:* een deel van de territoriale zee, door de natuurlijke gesteldheid geschikt als ankerplaats, voor het
      overslaan van goederen dan wel het in- of ontschepen van passagiers, en gelegen in het verlengde van een haven op
      Bonaire, Sint Eustatius of Saba;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.m
    text: |-
      *territoriale zee:* de territoriale zee rond Bonaire, Sint Eustatius en Saba, vastgesteld bij of krachtens
      [artikel 1 van de Rijkswet uitbreiding territoriale zee van het Koninkrijk][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003749#Artikel1
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003749
        artikel: '1'
  - number: 1.n
    text: |-
      *aansluitende zone:* de door het Koninkrijk der Nederlanden ingestelde aansluitende zone, voorzover deze betrekking
      heeft op Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.o
    text: |-
      *exclusieve economische zone:* de door het Koninkrijk ingestelde exclusieve economische zone, voorzover deze
      betrekking heeft op Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.p
    text: |-
      *lozen:* elk vrijkomen van stoffen, hoe ook veroorzaakt, waaronder begrepen ontsnappen, over boord zetten,
      wegvloeien, weglekken, pompen of ledigen;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.q
    text: |-
      *gevaarlijke stoffen:* stoffen die gevaar voor explosie, brand, corrosie, vergiftiging, bedwelming of straling
      kunnen opleveren, waartoe in elk geval worden gerekend de stoffen in de International Maritime Dangerous Goods
      Code, de (International) Code for the Construction and Equipment of Ships Carrying Dangerous Chemicals in Bulk,
      de (International) Code for the Construction and Equipment of Ships Carrying Liquefied Gases in Bulk van de
      Internationale Maritieme Organisatie, gemerkt met de letter (s), alsmede elke andere stof aangewezen bij regeling
      van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.r
    text: |-
      *schadelijke stoffen:* stoffen en energie die, indien zij in zee terecht komen, gevaar kunnen opleveren voor de
      gezondheid van de mens, schade kunnen toebrengen aan het mariene milieu, de recreatiemogelijkheden die de zee biedt
      kan schaden of storend kunnen werken op enig ander rechtmatig gebruik van de zee;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.s
    text: |-
      *Interventieverdrag:* het op 29 november 1969 te Brussel tot stand gekomen Verdrag inzake optreden in volle zee bij
      ongevallen die verontreiniging door olie kunnen veroorzaken, met Bijlage (Trb. 1970, 107);
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.t
    text: |-
      *Zeeaanvaringsverdrag:* het op 20 oktober 1972 te Londen tot stand gekomen Verdrag inzake Internationale Bepalingen
      ter voorkoming van aanvaringen op zee, 1972, met Bijlagen (Trb. 1974, 51);
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.u
    text: |-
      *Interventieprotocol:* het op 2 november 1973 te Londen tot stand gekomen Protocol inzake optreden in volle zee bij
      ongevallen die verontreiniging door andere stoffen dan olie kunnen veroorzaken (Trb. 1977, 162);
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.v
    text: |-
      *Marpolverdrag:* het op 2 november 1973 te Londen tot stand gekomen Internationaal Verdrag ter voorkoming van
      verontreiniging door schepen met Protocollen en Bijlagen met Aanhangsels (Trb. 1975, 147 en Trb. 1978, 187);
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.w
    text: |-
      *Grensverdrag:* het op 31 maart 1978 te Willemstad tot stand gekomen Grensverdrag tussen het Koninkrijk der
      Nederlanden en de Republiek Venezuela (Trb. 1978, 61);
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.x
    text: |-
      *VN-Zeerechtverdrag:* het op 10 december 1982 te Montego-Bay tot stand gekomen Verdrag van de Verenigde Naties
      inzake het recht van de zee, met bijlagen (Trb. 1983, 83);
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.y
    text: |-
      *OPRC-Verdrag:* het op 30 november 1990 te Londen tot stand gekomen Internationaal Verdrag inzake de voorbereiding
      op, de bestrijding van en de samenwerking bij olieverontreiniging, met bijlage (Trb. 1992, 1);
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.z
    text: |-
      *SPAW-protocol:* het op 18 januari 1990 te Kingston getekende Protocol betreffende de bijzondere beschermde
      gebieden en de in de natuur levende dieren en planten, met bijlagen (Trb. 1990, 115), behorende bij het op 24 maart
      1983 te Cartagena de Indias gesloten Verdrag inzake de bescherming en ontwikkeling van het mariene milieu in het
      Caraïbisch gebied (Trb. 1983, 152);
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.aa
    text: |-
      *Protocol van 1996:* op 7 november 1996 te Londen tot stand gekomen Protocol bij het Verdrag inzake de voorkoming
      van verontreiniging van de zee ten gevolge van het storten van afval en andere stoffen van 1972 (Trb. 1998, 134);
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.bb
    text: |-
      *Wrakopruimingsverdrag:* het op 18 mei 2007 te Nairobi tot stand gekomen Internationaal Verdrag inzake het opruimen
      van wrakken, 2007 (Trb. 2008, 115);
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: 1.cc
    text: '*Onze Minister:* Onze Minister van Infrastructuur en Milieu.'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel1
  - number: '2.1'
    text: 'De bij of krachtens deze wet gegeven regels laten onverlet de volkenrechtelijke immuniteit van:'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel2
  - number: 2.1.a
    text: oorlogsschepen en militaire luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel2
  - number: 2.1.b
    text: schepen in gebruik als marinehulpschepen;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel2
  - number: 2.1.c
    text: |-
      schepen en luchtvaartuigen in eigendom van of in beheer bij een Staat, indien en voor zolang deze worden ingezet
      voor het verrichten van niet-commerciële overheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel2
  - number: '2.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen categorieën van schepen geheel of gedeeltelijk worden
      uitgezonderd van één of meer bij of krachtens deze wet gegeven regels.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel2
  - number: '3.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, ter uitvoering van voor de openbare lichamen bindende
      verdragen of bindende besluiten van volkenrechtelijke organisaties die dezelfde belangen dienen als deze wet,
      regels worden gegeven, waarbij van de bepalingen van deze wet wordt afgeweken of de bepalingen van deze wet geheel
      of gedeeltelijk buiten werking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel3
  - number: '3.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in het belang van de orde, de veiligheid, alsmede ter
      bescherming van het milieu, regels worden gegeven ter uitvoering van de voor de openbare lichamen bindende
      verdragen of bindende besluiten van volkenrechtelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel3
  - number: '3.3'
    text: |-
      Bij toepassing van het eerste of het tweede lid kan worden bepaald dat nadere regels worden gegeven bij of
      krachtens eilandsverordening.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel3
  - number: '3.4'
    text: |-
      De regels, bedoeld in het eerste of het tweede lid, kunnen voorschriften of verboden inhouden en tevens het
      toekennen van ontheffing of vrijstelling van deze voorschriften of verboden.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister is, voor zover het onderwerpen betreft die bij of krachtens deze wet worden geregeld en voor zover in
      deze wet geen ander bestuursorgaan wordt aangewezen, beheerder van de territoriale zee en de exclusieve economische
      zone.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel4
  - number: '4.2'
    text: De beheerder is bevoegd aanwijzingen te geven aan de gebruikers van de maritieme zone onder zijn beheer.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel4
  - number: '5.1'
    text: |-
      Bij regeling van Onze Minister kan een bestuurscollege worden aangewezen als beheerder van de territoriale zee
      gelegen rondom Bonaire, Sint Eustatius of Saba of delen daarvan.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel5
  - number: '5.2'
    text: |-
      Bij regeling van Onze Minister kan een bestuurscollege worden aangewezen als beheerder van een of meer delen van de
      exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel5
  - number: '5.3'
    text: Aan een aanwijzing als bedoeld in het eerste of tweede lid, kunnen voorschriften en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel5
  - number: '5.4'
    text: |-
      Desgewenst kan Onze Minister inlichtingen en andere gegevens opvragen bij een bestuurscollege, die deze zo spoedig
      mogelijk verstrekt.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister of een bestuurscollege, kan het beheer, bedoeld in [artikel 4][ref1] of in [artikel 5][ref2],
      mandateren aan een rechtspersoon die deze bevoegdheid namens hem, onder door hem te stellen voorschriften en
      beperkingen, uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel5
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028550
        artikel: '5'
        hoofdstuk: '2'
  - number: '6.2'
    text: |-
      Mandatering van het beheer, bedoeld in [artikel 5][ref1], door een bestuurscollege aan een rechtspersoon, behoeft
      de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel5
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '5'
        hoofdstuk: '2'
  - number: '7.1'
    text: |-
      Een mandaat als bedoeld in [artikel 6, eerste lid][ref1], bevat in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel6
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '6'
        hoofdstuk: '2'
  - number: 7.1.a
    text: een eenduidige beschrijving van de gemandateerde bevoegdheden;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel7
  - number: 7.1.b
    text: de duur van het mandaat;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel7
  - number: 7.1.c
    text: voorschriften inzake het vergunningenbeleid;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel7
  - number: 7.1.d
    text: voorschriften ten aanzien van het te voeren beheer;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel7
  - number: 7.1.e
    text: voorschriften inzake de administratieve organisatie van de mandataris;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel7
  - number: 7.1.f
    text: voorwaarden inzake de aan de bevoegdheid verbonden financiële consequenties.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel7
  - number: '7.2'
    text: |-
      Een mandataris brengt binnen zes maanden na afloop van een kalenderjaar een openbaar jaarverslag uit, waarin hij
      tevens een verantwoording opneemt van het door hem gevoerde beleid.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel7
  - number: '7.3'
    text: |-
      Desgewenst kan de mandans tussentijds inlichtingen en andere gegevens opvragen bij de mandataris, die deze
      onverwijld verstrekt.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel7
  - number: '8'
    text: |-
      De aanwijzing, bedoeld in [artikel 5, eerste lid of tweede lid][ref1], en het mandaat, bedoeld in
      [artikel 6, eerste lid][ref2], worden bekend gemaakt in de Staatscourant, alsmede in ten minste twee in het
      betrokken openbaar lichaam verschijnende dagbladen.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel6
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028550
        artikel: '6'
        hoofdstuk: '2'
  - number: '9.1'
    text: 'De mandans kan het mandaat intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel9
  - number: 9.1.a
    text: |-
      de mandans, na overleg met de mandataris, van oordeel is dat deze zonder rechtvaardigingsgrond buiten zijn
      bevoegdheid is getreden; of
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel9
  - number: 9.1.b
    text: de omstandigheden zodanig zijn gewijzigd dat het mandaat onder die omstandigheden niet zou zijn verleend.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel9
  - number: '9.2'
    text: De mandans trekt het mandaat in elk geval in, na vaststelling van kennelijke en herhaalde taakverwaarlozing.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel9
  - number: '9.3'
    text: |-
      Indien de mandans een bestuurscollege is, dan wordt Onze Minister geïnformeerd over het voornemen het mandaat in te
      trekken en over de wijze waarop na die intrekking zal worden voorzien in het beheer.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel9
  - number: '10.1'
    text: |-
      Bij regeling van Onze Minister kunnen vergoedingen worden vastgesteld, verschuldigd door degenen ten behoeve van
      wie werkzaamheden of diensten door of namens de beheerder zijn verricht of verleend.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel10
  - number: '10.2'
    text: |-
      Bij toepassing van [artikel 5, eerste lid][ref1], kunnen de vergoedingen, bedoeld in het eerste lid, worden
      vastgesteld bij eilandsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel5
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '5'
        hoofdstuk: '2'
  - number: '10.3'
    text: |-
      Alvorens over te gaan tot het verrichten van werkzaamheden of verlenen van diensten, kan vooruitbetaling van de
      vastgestelde tarieven worden verlangd.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel10
  - number: '11.1'
    text: |-
      De gezagvoerder van een vrachtschip met een tonnage van meer dan 100 GT, meldt bij binnenkomst in en vertrek uit de
      territoriale zee in elk geval het volgende aan de beheerder:
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel11
  - number: 11.1.a
    text: naam, IMO-nummer en roepletters van het schip;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel11
  - number: 11.1.b
    text: de nationaliteit van het schip;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel11
  - number: 11.1.c
    text: het tijdstip van binnenkomst of vertrek;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel11
  - number: 11.1.d
    text: het soort schip en de tonnage en
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel11
  - number: 11.1.e
    text: |-
      de lading, indien het een schip als bedoeld in [artikel 14, tweede lid][ref1], betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel14
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '11.2'
    text: |-
      Een gelijke verplichting als omschreven in het eerste lid, met uitzondering van de gegevens, bedoeld in het eerste
      lid, onderdeel e, rust op de gezagvoerder van een passagiersschip en op die van een zeevissersschip met een lengte
      van meer dan 24 meter, waarbij onder een passagiersschip wordt verstaan, een schip waarmee 12 of meer personen
      tegen betaling worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel11
  - number: '11.3'
    text: |-
      De verplichting, bedoeld in het eerste, onderscheidenlijk het tweede lid, rust mede op de scheepsbeheerder en diens
      vertegenwoordiger, ieder afzonderlijk. Zodra één van de personen, bedoeld in het eerste of tweede lid, aan zijn
      verplichting heeft voldaan, vervalt deze verplichting voor de anderen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel11
  - number: '11.4'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald in welke gevallen een melding op grond van andere wettelijke
      voorschriften tevens wordt aangemerkt als een melding als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel11
  - number: '11.5'
    text: |-
      Het eerste, onderscheidenlijk het tweede lid, zijn van overeenkomstige toepassing op de gezagvoerder van een
      buitenlands zeevissersschip, van een tankschip, van een nucleair voortgestuwd schip, of een schip dat radioactieve
      stoffen, onderscheidenlijk gevaarlijke of schadelijke stoffen vervoert, ingeval van binnenkomst in en vertrek uit
      de exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel11
  - number: '12'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel12
  - number: '13.1'
    text: |-
      Bij regeling van Onze Minister kunnen de te melden gegevens, genoemd in [artikel 11][ref1], met inachtneming van de
      volkenrechtelijke beperkingen, worden uitgebreid.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel11
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '13.2'
    text: |-
      Bij de ministeriële regeling, bedoeld in het eerste lid, kan de meldingsplicht worden uitgebreid met bepaalde delen
      van de exclusieve economische zone, waaronder beschermde gebieden als bedoeld in [artikel 29][ref1], en kan deze op
      andere categorieën schepen van toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel29
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '14.1'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel14
  - number: '14.2'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat het verboden is aan tankschepen, nucleair voortgestuwde
      schepen en schepen die radioactieve stoffen onderscheidenlijk gevaarlijke of schadelijke stoffen vervoeren, bij hun
      vaart door de territoriale zee zich buiten de vastgestelde verkeersscheidingsstelsels of buiten andere aangewezen
      scheepvaartroutes te begeven. Dit verbod geldt niet ingeval van overmacht of hulpverlening.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel14
  - number: '14.3'
    text: |-
      Bij regeling van Onze Minister kunnen voorts veiligheidszones rond bouwwerken in de exclusieve economische zone
      worden vastgesteld, in overeenstemming met artikel 60, vierde, vijfde en zevende lid, van het VN-Zeerechtverdrag.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel14
  - number: '14.4'
    text: |-
      In een veiligheidszone als bedoeld in het derde lid is de vaart beperkt tot het scheepvaartverkeer dat verband
      houdt met de activiteiten op het desbetreffende bouwwerk.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel14
  - number: '15.1'
    text: Als voorschriften ter voorkoming van aanvaringen op zee gelden de bepalingen van het Zeeaanvaringsverdrag.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel15
  - number: '15.2'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel15
  - number: '15.3'
    text: |-
      De bepalingen van het Zeeaanvaringsverdrag zijn van toepassing op schepen die zich bevinden in de binnenwateren en
      de havens van de openbare lichamen of in de territoriale zee of de exclusieve economische zone rond Bonaire, Sint
      Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel15
  - number: '15.4'
    text: |-
      Bij regeling van Onze Minister kunnen bijzondere voorschriften als bedoeld in voorschrift 1, onderdeel b, van
      het Zeeaanvaringsverdrag, worden gegeven voor de binnenwateren, de havens en de reden, die zoveel mogelijk
      overeenstemmen met de voorschriften van het Zeeaanvaringsverdrag.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel15
  - number: '15.5'
    text: |-
      Bij regeling van Onze Minister kunnen ten aanzien van oorlogsschepen en vissersvaartuigen bijzondere voorschriften
      als bedoeld in voorschrift 1, onderdeel c, van het Zeeaanvaringsverdrag worden gegeven. Indien deze voorschriften
      betrekking hebben op oorlogsschepen pleegt Onze Minister overleg met Onze Minister van Buitenlandse Zaken
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel15
  - number: '15.6'
    text: |-
      Bij regeling van Onze Minister kunnen voor schepen als bedoeld in het derde lid, onderdeel b, andere regels
      als bedoeld in voorschrift 1, onderdeel e, van het Zeeaanvaringsverdrag worden gegeven die zoveel mogelijk
      overeenstemmen met de voorschriften van het Zeeaanvaringsverdrag.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel15
  - number: '16.1'
    text: |-
      Een ontheffing of vrijstelling als bedoeld in voorschrift 38 van het Zeeaanvaringsverdrag, kan door of namens Onze
      Minister worden verleend.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel16
  - number: '16.2'
    text: |-
      De goedkeuring, bedoeld in de Bijlagen I en III van het Zeeaanvaringsverdrag, kan door of namens Onze Minister
      worden verleend.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel16
  - number: '17.1'
    text: |-
      Bij regeling van Onze Minister worden, in het belang van de veilige navigatie, verkeerstekens of
      verkeersaanduidingen vastgesteld, die gelden in de territoriale zee en de binnenwateren.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel17
  - number: '17.2'
    text: |-
      De beheerder is bevoegd verkeerstekens of verkeersaanduidingen te plaatsen in of te verwijderen uit het gebied dat
      onder zijn beheer valt.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel17
  - number: '17.3'
    text: |-
      De beheerder kan in noodgevallen aan de gezagvoerder toestemming verlenen tot het handelen in afwijking van de
      geplaatste verkeerstekens of verkeersaanduidingen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel17
  - number: '17.4'
    text: |-
      De beheerder is bevoegd in het belang van de veilige navigatie of de bescherming van het milieu, aanwijzingen te
      geven aan de gezagvoerder van een schip.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel17
  - number: '17.5'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gegeven ter uitvoering van het vierde lid.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel17
  - number: '17.6'
    text: |-
      De beheerder is bevoegd in verband met zich plotseling voordoende belemmeringen of risico’s voor de scheepvaart een
      tijdelijke veiligheidszone in te stellen, waarbinnen geen scheepvaart of slechts beperkte vaart is toegestaan. Hij
      draagt zorg voor bekendmaking aan de scheepvaart op de internationaal gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel17
  - number: '18.1'
    text: |-
      Het is verboden te handelen in strijd met een krachtens [artikel 17, tweede lid][ref1], geplaatst verkeersteken of
      geplaatste verkeersaanduiding.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel17
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '18.2'
    text: |-
      Het is verboden een verkeersteken of verkeersaanduiding te vernietigen, te beschadigen, weg te nemen of anderszins
      onbruikbaar te maken.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel18
  - number: '19'
    text: |-
      Het is verboden zonder of in afwijking van toestemming van de beheerder met een schip in de territoriale zee, de
      redes daaronder niet begrepen, ligplaats te nemen, voor anker te gaan of aldaar te verblijven zonder ligplaats te
      nemen. Het eerste lid is niet van toepassing ingeval van overmacht en hulpverlening.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel19
  - number: 19a.1
    text: |-
      De gezagvoerder van een schip dat zich bevindt in de territoriale zee, met inbegrip van de baaien en inhammen die
      hiermee in open verbinding staan, licht de beheerder in omtrent hem bekende schepen, overblijfselen van schepen
      en alle andere voorwerpen in zee gestrand, gezonken of aan de grond geraakt, of vastgeraakt op of in waterkeringen
      of andere waterstaatswerken of die zich op het zeestrand bevinden, die nog niet zijn aangegeven op een nautische
      kaart.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel19a
  - number: 19a.2
    text: |-
      De verplichting, bedoeld in het eerste lid, rust ook op degene die belast is met het beheer van een platform dat
      zich in de territoriale zee, met inbegrip van de baaien en inhammen die hiermee in open verbinding staan, bevindt.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel19a
  - number: 19b
    text: |-
      De gezagvoerder van een schip dat zich bevindt in de territoriale zee, met inbegrip van de baaien en inhammen die
      hiermee in open verbinding staan, meldt de beheerder zo uitgebreid mogelijk de volgende informatie met betrekking
      tot een schip, overblijfselen van schepen en alle andere voorwerpen in zee gestrand, gezonken of aan de grond
      geraakt, of vastgeraakt op of in waterkeringen of andere waterstaatswerken of die zich op het zeestrand bevinden:
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel19b
  - number: 19b.a
    text: de positie;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel19b
  - number: 19b.b
    text: het aantal personen en de aard van de lading aan boord;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel19b
  - number: 19b.c
    text: de aard van de schade;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel19b
  - number: 19b.d
    text: of het schip naar zijn oordeel een gevaar is voor de navigatie;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel19b
  - number: 19b.e
    text: andere nuttige informatie of bijzonderheden welke het opruimen van het schip vergemakkelijken.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel19b
  - number: 19c.1
    text: |-
      De beheerder is bevoegd overblijfselen van schepen en alle andere voorwerpen in de territoriale zee, met inbegrip
      van de baaien en inhammen die hiermee in open verbinding staan, die zijn gestrand, gezonken of aan de grond
      geraakt, of vastgeraakt op of in waterkeringen of andere waterstaatswerken of die zich op het zeestrand bevinden,
      niet zijnde een wrak als bedoeld in [paragraaf 4.6][ref1], op te ruimen zonder dat hij door belanghebbenden bij het
      wrak, of het opgeruimde voorwerp dan wel de zaken aan boord van of in of op het wrak of voorwerp, aansprakelijk kan
      worden gesteld voor door die opruiming aan hen toegebrachte schade.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel19c
    references:
      - id: ref1
        bwb_id: BWBR0028550
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 19c.2
    text: |-
      De kosten, krachtens het eerste lid gemaakt, komen ten laste van de beheerder, onverminderd diens bevoegdheid
      om de krachtens dit artikel te zijnen laste komende kosten te verhalen op degene, die volgens de wet daarvoor
      aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel19c
  - number: 19c.3
    text: |-
      Al hetgeen in verband met het opruimen op grond van het eerste lid wordt geborgen, wordt tegen voldoening van de
      ter zake van de opruiming gemaakte kosten of tegen het stellen van zekerheid voor de voldoening daarvan afgegeven
      aan belanghebbenden, die zich daartoe aanmelden en zich als zodanig kunnen legitimeren.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel19c
  - number: 19c.4
    text: De beheerder kan niet aansprakelijk worden gesteld voor afgifte van het geborgene aan een onbevoegde.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel19c
  - number: 19c.5
    text: |-
      Indien belanghebbenden zich niet aanmelden, dan wel in gebreke blijven binnen een door de beheerder te stellen
      termijn de in het derde lid bedoelde kosten te voldoen of voor de voldoening daarvan zekerheid te stellen, is de
      beheerder bevoegd het geborgene te verkopen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel19c
  - number: '20.1'
    text: |-
      Het is verboden zonder of in afwijking van een vergunning van de beheerder, bouwwerken te hebben, aan te leggen of
      te doen aanleggen in of op de bodem van de territoriale zee of de exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel20
  - number: '20.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op landaanwinning en op werkzaamheden die een verandering van het
      niveau of van de gesteldheid van de zeebodem tot gevolg hebben.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel20
  - number: '21.1'
    text: |-
      Bij de beoordeling van de aanvraag voor een vergunning als bedoeld in [artikel 20, eerste lid][ref1], worden de
      effecten van de aanleg en het gebruik van het voorgenomen bouwwerk op het mariene milieu, de natuur, de veiligheid
      van de scheepvaart en het maritiem archeologisch erfgoed uitdrukkelijk in overweging genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel20
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '21.2'
    text: Een aanvraag wordt bekendgemaakt in twee dagbladen die verschijnen in het betrokken openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel21
  - number: '21.3'
    text: |-
      De beoordeling, bedoeld in het eerste lid, geschiedt in overeenstemming met Onze Minister van Economisch Zaken,
      Onze Minister van Onderwijs, Cultuur en Wetenschap en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
      Indien de beheerder een bestuurscollege is, dan draagt Onze Minister zorg voor de noodzakelijke afstemming.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel21
  - number: '21.4'
    text: |-
      Indien het voor de beoordeling van de aanvraag noodzakelijk is onderzoek te verrichten, dan zijn de kosten hiervan,
      onverminderd [artikel 10][ref1], voor rekening van de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel10
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '10'
        hoofdstuk: '2'
  - number: '21.5'
    text: |-
      Een vergunning wordt geweigerd, indien één of meer belangen, genoemd in het eerste lid, op onoverkomelijke wijze in
      het gedrang zouden komen door verlening van de vergunning.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel21
  - number: '21.6'
    text: |-
      Aan een vergunning kunnen voorschriften en beperkingen worden verbonden in het belang van de veiligheid van de
      scheepvaart en de bescherming van het mariene milieu, de natuur en het maritiem archeologisch erfgoed.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel21
  - number: '21.7'
    text: 'Een vergunning kan worden ingetrokken of gewijzigd, indien:'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel21
  - number: 21.7.a
    text: |-
      de voor de beoordeling van de aanvraag verstrekte gegevens zodanig onjuist of onvolledig blijken te zijn, dat op de
      aanvraag een andere beslissing zou zijn genomen indien bij de beoordeling daarvan de juiste gegevens bekend waren
      geweest;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel21
  - number: 21.7.b
    text: geen gebruik wordt gemaakt van de vergunning binnen een daarin te stellen termijn;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel21
  - number: 21.7.c
    text: |-
      in verband met veranderde wetgeving, wijziging van omstandigheden of gewijzigde inzichten de bescherming van de
      belangen, genoemd in het eerste lid, zwaarder wegen dan het belang van de vergunninghouder bij een ongewijzigde
      vergunning.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel21
  - number: '21.8'
    text: Een vergunning is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel21
  - number: '22.1'
    text: |-
      Degene door wiens toedoen of nalaten een voorwerp of stof in de binnenwateren, de territoriale zee of in de
      exclusieve economische zone wordt aangebracht, terechtkomt of vrijkomt, waardoor gevaar, schade of hinder wordt
      veroorzaakt of dreigt te worden veroorzaakt, meldt dit onverwijld aan de beheerder.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel22
  - number: '22.2'
    text: |-
      In de exclusieve economische zone geldt de meldingsplicht, bedoeld in het eerste lid, uitsluitend ingeval er
      verontreiniging door schepen of off-shore installaties wordt veroorzaakt of dreigt te worden veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel22
  - number: '22.3'
    text: |-
      De persoon, bedoeld in het eerste lid, draagt er zorg voor dat het voorwerp of de stof onmiddellijk uit het water
      wordt verwijderd, tenzij dit redelijkerwijs niet uitvoerbaar is.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel22
  - number: '22.4'
    text: |-
      De beheerder is bevoegd het voorwerp of de stof, bedoeld in het eerste lid, te doen verwijderen voor rekening van
      degene door wiens toedoen of nalaten het voorwerp of de stof in het water is vrijgekomen of terecht gekomen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel22
  - number: '22.5'
    text: |-
      Dit artikel is niet van toepassing op het lozen van een schadelijke stof vanaf een schip in de gevallen en op de
      wijze vastgesteld in het Marpol-verdrag.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel22
  - number: '22.6'
    text: |-
      Het eerste tot en met het vijfde lid zijn niet van toepassing op het storten van afval of stoffen overeenkomstig de
      bij of krachtens deze wet gegeven voorschriften, ter uitvoering van het Protocol van 1996.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel22
  - number: '23'
    text: |-
      De [artikelen 20][ref1] en [21][ref2] zijn van overeenkomstige toepassing op het aanleggen en houden van kabels en
      leidingen in of over de bodem van de territoriale zee of de exclusieve economische zone.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel21
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0028550
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '24.1'
    text: |-
      Bij regeling van Onze Minister kunnen in het belang van de orde, de veiligheid en de bescherming van het mariene
      milieu, regels worden gegeven ten aanzien van scheepsactiviteiten, welke plaatsvinden in de territoriale zee,
      daaronder niet begrepen de redes.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel24
  - number: '24.2'
    text: |-
      Bij regeling van Onze Minister kunnen ter bescherming en behoud van het mariene milieu regels worden gegeven ten
      aanzien van scheepsactiviteiten, welke plaatsvinden in de exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel24
  - number: '24.3'
    text: |-
      De regels, bedoeld in het eerste lid, kunnen bij toepassing van [artikel 6, eerste lid][ref1], worden gegeven door
      het bestuurscollege.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel6
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '6'
        hoofdstuk: '2'
  - number: '25.1'
    text: |-
      Het is verboden, behoudens ingeval van overmacht, in de territoriale zee rook, roetdampen, gassen, stof of stoom op
      een zodanige wijze te laten ontsnappen dat daardoor gevaar, schade of hinder ontstaat of kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel25
  - number: '25.2'
    text: |-
      Het is verboden, behoudens ingeval van overmacht, in de nabijheid van bad- en zwemplaatsen of aanlegsteigers in
      de territoriale zee een dusdanig vaargedrag te vertonen, dat dientengevolge gevaar, schade of hinder ontstaat voor
      persoon of goed.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel25
  - number: '26.1'
    text: |-
      De beheerder kan een schip dat gevaar, schade of hinder veroorzaakt of dreigt te veroorzaken in de territoriale
      zee, verbieden ligplaats te nemen in het gebied dat onder zijn beheer valt.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel26
  - number: '26.2'
    text: Het verbod wordt medegedeeld aan de gezagvoerder van het schip en wordt op diens verzoek op schrift gesteld.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel26
  - number: '26.3'
    text: |-
      Bij regeling van Onze Minister kunnen, in het belang van orde en veiligheid, regels worden gegeven aangaande de
      vaart met snelle kleine schepen in de territoriale zee of daarmee in verbinding staande binnenwateren.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel26
  - number: 26a.1
    text: |-
      De beheerder is, in het belang van de orde, de veiligheid en ter bescherming van het milieu, bevoegd op kosten van
      de scheepsbeheerder een schip dat zich in de territoriale zee, met inbegrip van de baaien en inhammen die hiermee
      in open verbinding staan, bevindt te verhalen of te doen verhalen. Onder verhalen wordt in dit verband verstaan het
      verplaatsen van een schip naar een ligplaats of bewaarplaats.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel26a
  - number: 26a.2
    text: |-
      Met uitzondering van een spoedeisend geval, dan wel ingeval van een onbekende scheepsbeheerder, wordt van de
      bevoegdheid, bedoeld in het eerste lid, geen gebruik gemaakt dan nadat de beheerder schriftelijk opdracht heeft
      gegeven aan de scheepsbeheerder om dit schip vóór een in deze opdracht vermeld tijdstip te verhalen naar een door
      de beheerder aangewezen plaats en gebleken is dat op het genoemde tijdstip geen gevolg is gegeven aan de opdracht.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel26a
  - number: 26a.3
    text: |-
      Indien het schip in kennelijk onbeheerde toestand verkeert of de scheepsbeheerder onbekend is, roept de beheerder
      deze op om dit schip op te halen tegen betaling van de verhaalkosten en ligkosten. Bij deze oproep worden
      tenminste de naam, het type schip, alsmede het registratienummer of het brandmerk van het schip vermeld. De oproep
      geschiedt door middel van bekendmaking in de nieuwsbladen. Indien het een vreemd schip betreft geeft de beheerder
      zo spoedig mogelijk kennis van de oproep aan de consulaire ambtenaar van de vreemde Staat, voor zover zodanig
      consulair ambtenaar in de openbare lichamen Bonaire, Sint Eustatius en Saba benoemd is. Indien er geen consulaire
      ambtenaar in de openbare lichamen Bonaire, Sint Eustatius en Saba is benoemd, vindt deze kennisgeving plaats aan
      de ambassadeur of tijdelijk zaakgelastigde van de desbetreffende Staat tot wiens ambtsgebied de openbare lichamen
      Bonaire, Sint Eustatius en Saba behoren.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel26a
  - number: 26a.4
    text: |-
      Ten aanzien van het verhaal van de kosten, bedoeld in het eerste en derde lid, op de scheepsbeheerder van het
      betrokken schip is [artikel 70][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel70
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '70'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 26b.1
    text: |-
      Indien een schip dat zich in de territoriale zee, met inbegrip van de baaien en inhammen die hiermee in open
      verbinding staan, bevindt gevaar, schade of hinder veroorzaakt of dreigt te veroorzaken, kan de beheerder aan de
      gezagvoerder of de scheepsbeheerder van dit schip voorschriften stellen, houdende maatregelen ter voorkoming of
      beëindiging van dat gevaar, die schade of hinder.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel26b
  - number: 26b.2
    text: De gezagvoerder en de scheepsbeheerder zijn verplicht te voldoen aan de voorschriften, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel26b
  - number: 26b.3
    text: |-
      Indien één van de personen, bedoeld in het tweede lid, voldoet aan de verplichting, bedoeld in het tweede lid,
      vervalt deze verplichting voor de andere.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel26b
  - number: '27.1'
    text: |-
      Het is verboden zonder of in afwijking van een vergunning van de beheerder schadelijke of gevaarlijke stoffen te
      laden in of te lossen uit een schip, dat zich bevindt in de territoriale zee of in de exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel27
  - number: '27.2'
    text: |-
      Een vergunning kan worden geweigerd, indien het behoud of de bescherming van het mariene milieu of de natuur, of de
      veilige navigatie, op onoverkomelijke wijze in het gedrang zouden komen door verlening van de vergunning.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel27
  - number: '27.3'
    text: 'Een vergunning kan worden ingetrokken of gewijzigd, indien:'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel27
  - number: 27.3.a
    text: |-
      de voor de beoordeling van de aanvraag verstrekte gegevens zodanig onjuist of onvolledig blijken te zijn, dat op de
      aanvraag een andere beslissing zou zijn genomen indien bij de beoordeling daarvan de juiste gegevens bekend waren
      geweest;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel27
  - number: 27.3.b
    text: geen gebruik wordt gemaakt van de vergunning binnen een daarin te stellen termijn;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel27
  - number: 27.3.c
    text: |-
      in verband met veranderde wetgeving, wijziging van omstandigheden of gewijzigde inzichten de bescherming van de
      belangen, genoemd in het tweede lid, zwaarder wegen dan het belang van de vergunninghouder bij een ongewijzigde
      vergunning.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel27
  - number: '27.4'
    text: Aan een vergunning kunnen voorschriften en beperkingen worden verbonden. Een vergunning is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel27
  - number: '27.5'
    text: |-
      De gezagvoerder van een schip of degene, belast met het beheer van de overslagvoorziening, meldt aan de beheerder
      het tijdstip waarop de overslag van de stoffen, bedoeld in het eerste lid, zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel27
  - number: '28.1'
    text: |-
      De gezagvoerder, degene die is belast met de overslag, alsmede degene die is belast met het beheer van een
      overslagvoorziening, voeren de verrichtingen bij overslag in de binnenwateren of in de territoriale zee uit
      overeenkomstig de wettelijke voorschriften inzake de veiligheid van de scheepvaart en de bescherming van het
      mariene milieu en de natuur.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel28
  - number: '28.2'
    text: |-
      De verplichting, bedoeld in het eerste lid, rust mede op de scheepsbeheerder of diens vertegenwoordiger, ieder
      afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel28
  - number: '28.3'
    text: |-
      Het eerste lid is van toepassing in de exclusieve economische zone, met dien verstande dat de verrichtingen worden
      uitgevoerd overeenkomstig de wettelijke voorschriften ter bescherming van het mariene milieu en de natuur.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel28
  - number: 28a.1
    text: |-
      Een schip met een brutotonnage van 300 of meer dat op grond van Nederlandse rechtsregels gerechtigd is de vlag van
      het Koninkrijk te voeren, vaart niet een in Bonaire, Sint Eustatius of Saba, met inbegrip van de territoriale zee,
      gelegen haven of ankerplaats binnen of vertrekt daaruit niet, indien het voor dat schip overeenkomstig het gestelde
      in [artikel 28 van de Wet bestrijding maritieme ongevallen][ref1] dan wel artikel 12, veertiende lid, van het
      Wrakopruimingsverdrag afgegeven certificaat zich niet aan boord bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel28
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '28'
  - number: 28a.2
    text: |-
      Een niet in Nederland geregistreerd schip met een brutotonnage van 300 of meer vaart niet een in Bonaire, Sint
      Eustatius of Saba of in de territoriale zee gelegen haven of ankerplaats binnen of vertrekt daaruit niet, als voor
      dat schip niet overeenkomstig artikel 12 van het Wrakopruimingsverdrag een certificaat als bedoeld in dat artikel
      is afgegeven of indien dat certificaat zich niet aan boord bevindt.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel28a
  - number: 28a.3
    text: |-
      In afwijking van het eerste en tweede lid behoeft het certificaat zich niet aan boord te bevinden indien
      elektronisch, overeenkomstig artikel 12, dertiende lid, van het Wrakopruimingsverdrag, door of vanwege Onze
      Minister kan worden gecontroleerd of voor het desbetreffende schip een certificaat is afgegeven.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel28a
  - number: '29'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel29
  - number: '30.1'
    text: |-
      Voor het verrichten van wetenschappelijk onderzoek in de territoriale zee of de exclusieve economische zone, is
      toestemming van de beheerder vereist.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel30
  - number: '30.2'
    text: |-
      Indien het onderzoek zal plaatsvinden op of in de bodem van de territoriale zee, wordt de toestemming verleend in
      overleg met de Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel30
  - number: '30.3'
    text: Aan de toestemming, bedoeld in het eerste lid, kunnen voorschriften en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel30
  - number: '30.4'
    text: |-
      Onze Minister stelt, in overeenstemming met Onze Minister van Buitenlandse Zaken, Onze Minister van
      Volksgezondheid, Welzijn en Sport en Onze Minister van Onderwijs, Cultuur en Wetenschap, de procedure vast voor
      behandeling en toetsing van een aanvraag van een andere Staat of een bevoegde internationale organisatie, met
      inachtneming van de desbetreffende bepalingen van het VN-Zeerechtverdrag.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel30
  - number: '31'
    text: |-
      Onverminderd [artikel 4][ref1], is, ingeval van buitengewone omstandigheden veroorzaakt door een natuurramp,
      het bestuurscollege, en voor zover dit college niet in staat is op te treden, de Gezaghebber bevoegd de
      [artikelen 19c][ref2], [26a][ref3] en [26b][ref4] toe te passen op een schip of een wrak dat zich bevindt in de
      binnenwateren dan wel op het zeestrand van het betrokken eiland.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel19c
      [ref3]: https://wetten.overheid.nl/BWBR0028550#Artikel26a
      [ref4]: https://wetten.overheid.nl/BWBR0028550#Artikel26b
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028550
        artikel: 19c
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0028550
        artikel: 26a
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref4
        bwb_id: BWBR0028550
        artikel: 26b
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '32'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel32
  - number: '33'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel33
  - number: '34'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel34
  - number: '35.1'
    text: 'De regels gegeven bij of krachtens deze wet ter uitvoering van het OPRC-Verdrag zijn van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel35
  - number: 35.1.a
    text: havens en redes;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel35
  - number: 35.1.b
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel35
  - number: 35.1.c
    text: offshore-installaties.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel35
  - number: '35.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      uitvoering van het OPRC-Verdrag.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel35
  - number: '35.3'
    text: |-
      Een rampenplan als bedoeld in het OPRC-Verdrag is in overeenstemming met de bepalingen die de Internationale
      Maritieme Organisatie daartoe heeft aangenomen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel35
  - number: '35.4'
    text: |-
      Bij regeling van Onze Minister wordt het nationale systeem voor rampenplannen, in overeenstemming met artikel 6 van
      het OPRC-Verdrag, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel35
  - number: '36'
    text: |-
      Degene die het beheer voert over een offshore-installatie, haven, rede, havenfaciliteit of inrichting voor de
      overslag van olie, draagt zorg voor de vaststelling van een rampenplan voor olieverontreiniging, dat overeenstemt
      met het nationale systeem voor rampenplannen, bedoeld in [artikel 35, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel35
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '37.1'
    text: Een schip beschikt over een rampenplan als bedoeld in voorschrift 26 van bijlage I bij het MARPOL-verdrag.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel37
  - number: '37.2'
    text: |-
      Degene die belast is met het beheer van een offshore-installatie die zich bevindt in de territoriale zee of
      exclusieve economische zone rond Bonaire, Sint Eustatius en Saba meldt onverwijld elke gebeurtenis aan boord van de
      offshore-installatie die ertoe leidt of er vermoedelijk toe zal leiden dat olie wordt geloosd aan de beheerder van
      het betrokken zeegebied.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel37
  - number: '37.3'
    text: |-
      De personen, bedoeld in het tweede lid, melden onverwijld elke waargenomen gebeurtenis op zee die ertoe leidt of er
      vermoedelijk toe zal leiden dat olie wordt geloosd aan de beheerder van het betrokken zeegebied.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel37
  - number: '37.4'
    text: |-
      Beheerders van havens en redes, alsmede degenen die belast zijn met het beheer van inrichtingen voor de overslag
      van olie, welke zijn gelegen in de binnenwateren, de territoriale zee of de exclusieve economische zone, melden
      onverwijld elke gebeurtenis die er toe leidt of er vermoedelijk toe zal leiden dat olie wordt geloosd, alsmede de
      aanwezigheid van olie, aan de daartoe door Onze Minister aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel37
  - number: '37.5'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel37
  - number: '38.1'
    text: |-
      Een melding als bedoeld in [artikel 37, tweede lid][ref1] bevat in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel37
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 38.1.a
    text: de identiteit van de melder, van de betrokken offshore-installatie, dan wel van de overslaginstallatie;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel38
  - number: 38.1.b
    text: de tijd en de plaats van het voorval;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel38
  - number: 38.1.c
    text: de hoeveelheid en de soort schadelijke stof die bij het voorval is betrokken; en
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel38
  - number: 38.1.d
    text: de genomen of te nemen maatregelen voor hulpverlening en berging.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel38
  - number: '38.2'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gegeven omtrent de meldingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel38
  - number: '39'
    text: 'Indien Onze Minister een melding aangaande een olielozing ontvangt, brengt hij deze ter kennis van:'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel39
  - number: 39.a
    text: |-
      alle andere partijen aangesloten bij het OPRC-Verdrag wier belangen waarschijnlijk door zulk een voorval worden
      getroffen;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel39
  - number: 39.b
    text: de vlaggenstaat van het schip dat, of de schepen die bij de olielozing zijn betrokken; en
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel39
  - number: 39.c
    text: het betrokken bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel39
  - number: '40.1'
    text: |-
      Onze Minister kan in de territoriale zee en in de exclusieve economische zone de maatregelen nemen die noodzakelijk
      zijn ter voorkoming, vermindering of het ongedaan maken van schadelijke gevolgen voor Bonaire, Sint Eustatius
      of Saba van een ongeval op zee of van met zulk een ongeval verband houdende handelingen, nadat het heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel40
  - number: '40.2'
    text: |-
      Het eerste lid vindt uitsluitend toepassing, indien redelijkerwijs mag worden aangenomen dat de schadelijke
      gevolgen ernstig zullen zijn.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel40
  - number: '40.3'
    text: |-
      De maatregelen, bedoeld in het eerste lid, geschieden met inachtneming van artikel 221 van het VN-Zeerechtverdrag,
      het Interventieverdrag en het Interventieprotocol.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel40
  - number: '40.4'
    text: |-
      Onze Minister neemt de maatregelen, bedoeld in het eerste lid, na overleg met de gezaghebber van het meest
      betrokken openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel40
  - number: '40.5'
    text: |-
      Bij regeling van Onze Minister kunnen, na overleg met de bestuurscolleges, nadere regels worden gesteld voor de
      uitvoering van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel40
  - number: '41.1'
    text: |-
      Als onderdeel van de maatregelen, bedoeld in [artikel 40, eerste lid][ref1], kan Onze Minister aanwijzingen
      geven aan de gezagvoerder, de scheepseigenaar of degene die hulp verleent aan het schip. Zij zijn verplicht deze
      aanwijzingen op te volgen, tenzij dit de opvarenden van het schip of de hulpverleners in ernstig persoonlijk gevaar
      zou brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel40
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '41.2'
    text: |-
      De aanwijzingen dienen evenredig te zijn aan de schadelijke gevolgen van het ongeval en mogen niet verder gaan dan
      redelijkerwijs noodzakelijk is om die schadelijke gevolgen te voorkomen, te verminderen of ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel41
  - number: '42.1'
    text: |-
      De organisatie en de coördinatie van de rampenbestrijding in de territoriale zee en in de exclusieve economische
      zone vindt plaats overeenkomstig een Rampenbestrijdingsplan met bijbehorende operationele deelplannen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel42
  - number: '42.2'
    text: Voor de exclusieve economische zone wordt het Rampenbestrijdingsplan vastgesteld bij besluit van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel42
  - number: '42.3'
    text: |-
      Voor de territoriale zee, behorende bij een eilandgebied, wordt het Rampenbestrijdingsplan vastgesteld door de
      gezaghebber, na overleg met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel42
  - number: '43'
    text: |-
      Bij regeling van Onze Minister kunnen, na overleg met de bestuurscolleges, nadere regels worden gesteld voor de
      uitvoering van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel43
  - number: '44.1'
    text: 'Het is verboden zich vanuit schepen of bouwwerken, in de territoriale zee of in de exclusieve economische zone:'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel44
  - number: 44.1.a
    text: te ontdoen van afval of andere stoffen, dan wel deze te verbranden; of
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel44
  - number: 44.1.b
    text: afval of andere stoffen op enigerlei wijze op te slaan op de bodem van de zee of in de ondergrond hiervan.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel44
  - number: '44.2'
    text: |-
      Het is verboden schepen, luchtvaartuigen of bouwwerken in de territoriale zee of in de exclusieve economische zone
      tot zinken te brengen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel44
  - number: '44.3'
    text: |-
      Het eerste lid is niet van toepassing op een activiteit als bedoeld in [artikel 46a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel46a
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: 46a
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '44.4'
    text: |-
      Dit artikel is niet van toepassing op het lozen van een schadelijke stof vanaf een schip
      in de gevallen en op de wijze vastgesteld in het Marpolverdrag, zoals uitgezonderd in
      [artikel 6 van de Wet voorkoming van verontreiniging door schepen BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel6
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '6'
  - number: '44.5'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ter uitvoering van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel44
  - number: '45.1'
    text: |-
      Onze Minister kan voor één of meer stoffen, genoemd in Bijlage 1 van het Protocol van 1996, ontheffing verlenen van
      het verbod genoemd in [artikel 44, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel44
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '45.2'
    text: |-
      De beoordeling van de aanvraag voor een ontheffing geschiedt met inachtneming van Bijlage 2 van het Protocol van
      1996.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel45
  - number: '45.3'
    text: Aan de ontheffing kunnen voorschriften worden verbonden en de ontheffing kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel45
  - number: '45.4'
    text: |-
      Onverminderd het bepaalde in [artikel 10][ref1] zijn de kosten van het onderzoek bij de aanvraag van de ontheffing,
      bedoeld in het eerste lid, voor rekening van de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel10
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '10'
        hoofdstuk: '2'
  - number: '46.1'
    text: |-
      Onze Minister kan ontheffing verlenen van het verbod, bedoeld in [artikel 44, tweede lid][ref1], voor zover deze
      betrekking heeft op het afzinken van een schip of bouwwerk in de territoriale zee en het afzinken past binnen het
      economisch beleid van het betrokken openbare lichaam. Indien de beheerder een bestuurscollege is, wordt het besluit
      omtrent de ontheffing genomen in overeenstemming met Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel44
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '46.2'
    text: |-
      De [artikelen 21, vierde, vijfde en zesde lid][ref1], en [45, tweede lid][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel45
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0028550
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '46.3'
    text: Aan de ontheffing kunnen voorschriften worden verbonden en de ontheffing kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel46
  - number: 46a.1
    text: |-
      Het is zonder daartoe strekkende vergunning van Onze Minister verboden stoffen in zee te brengen vanaf of vanuit
      een schip, lucht- vaartuig of bouwwerk ten behoeve van een activiteit waarbij bewust wordt ingegrepen in het
      mariene milieu om natuurlijke processen te beïnvloeden en die als zodanig is aangewezen in bijlage 4 bij het
      Protocol van 1996.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel46a
  - number: 46a.2
    text: |-
      De beoordeling van de aanvraag voor een vergunning geschiedt met inachtneming van bijlage 4 en bijlage 5 bij het
      Protocol van 1996.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel46a
  - number: 46a.3
    text: Aan de vergunning kunnen voorschriften worden verbonden en de vergunning kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel46a
  - number: 46a.4
    text: |-
      Een wijziging van bijlage 4 bij het Protocol van 1996 gaat voor de toepassing van dit artikel gelden met ingang
      van de dag waarop die wijziging internationaal in werking treedt, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel46a
  - number: 46a.5
    text: |-
      Indien voorafgaand aan de dag waarop het eerste lid van toepassing wordt op een activiteit, voor die activiteit een
      ontheffing is verleend op grond van [artikel 45, eerste lid][ref1], of [artikel 46, eerste lid][ref2], wordt deze
      geacht te zijn verleend als een vergunning op grond van het eerste lid, mits de activiteit in bijlage 4 bij het
      Protocol van 1996 is aangemerkt als een activiteit waarvoor een vergunning kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel46
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0028550
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '47.1'
    text: |-
      In de gevallen, noodzakelijk voor de bescherming van mensenlevens, waarin het verbod, bedoeld in [artikel 44][ref1]
      wordt overtreden, maakt de gezagvoerder van het betrokken schip of luchtvaartuig van het voorval melding in het
      scheepsdagboek onderscheidenlijk het journaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel44
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '47.2'
    text: |-
      Een voorval als bedoeld in het eerste lid wordt door de gezagvoerders, bedoeld in het eerste lid, onverwijld gemeld
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel47
  - number: '47.3'
    text: Het tweede lid is van overeenkomstige toepassing op de beheerder van een bouwwerk.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel47
  - number: '48.1'
    text: |-
      Indien zich een noodgeval voordoet dat voor de menselijke gezondheid onaanvaardbare risico's met zich meebrengt
      en waarvoor geen andere oplossing mogelijk is, kan een ontheffing als bedoeld in [artikel 45, eerste lid][ref1],
      worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel45
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '48.2'
    text: |-
      Alvorens een ontheffing, bedoeld in het eerste lid, wordt verleend, raadpleegt Onze Minister elke andere Staat dat
      bij het storten betrokken zou kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel48
  - number: '49.1'
    text: |-
      De bij of krachtens deze wet gegeven regels ter uitvoering van het Grensverdrag zijn van toepassing op schepen met
      de Venezolaanse nationaliteit, alsmede op schepen die op grond van voor Nederland geldende rechtsregels gerechtigd
      zijn de vlag van het Koninkrijk te voeren of waarop de [Vaartuigenwet BES 1930][ref1] van toepassing is, voor zover
      zij zich bevinden in het zeegebied, bedoeld in het Grensverdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0028292
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0028292
  - number: '49.2'
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven ter uitvoering van het Grensverdrag.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49
  - number: '49.3'
    text: |-
      Bij toepassing van het tweede lid, kan bij of krachtens die algemene maatregel van bestuur worden bepaald dat
      nadere regels worden gegeven bij eilandsverordening.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49
  - number: 49a
    text: |-
      In deze paragraaf wordt verstaan onder: - *daarmee samenhangende belangen:* de belangen van een kuststaat die
      rechtstreeks worden getroffen of bedreigd door een wrak, zoals: 1°. maritieme activiteiten op of voor de kust,
      in een haven of in zeemondingen, met inbegrip van de visserij, die een essentieel middel van bestaan vormen voor
      de betrokken personen; 2°. toeristische attracties en andere economische belangen in het betrokken gebied; 3°. de
      gezondheid van de bevolking aan de kust en het welzijn van het betrokken gebied, met inbegrip van het behoud van de
      levende mariene rijkdommen en van de flora en fauna; 4°. infrastructuur buitengaats en onder water;
        - *exploitant van het schip:* eigenaar van het schip of elke andere organisatie of persoon, zoals de manager of
      rompbevrachter, die namens de eigenaar de verantwoordelijkheid heeft aanvaard voor de exploitatie van het schip en
      die bij de aanvaarding van die verantwoordelijkheid de verplichting op zich heeft genomen zich te kwijten van alle
      bijbehorende taken en verantwoordelijkheden die worden opgelegd door de Internationale Veiligheidsbeleidscode (ISM-
      code), zoals gewijzigd;
        - *geregistreerde eigenaar:* degene die als eigenaar van het schip is ingeschreven of, bij het ontbreken van
      registratie, de persoon of personen die eigenaar was of waren van het schip op het tijdstip van het maritiem
      ongeval, met dien verstande dat indien evenwel een schip eigendom is van een staat en geëxploiteerd wordt door een
      maatschappij die in die staat is geregistreerd als exploitant van het schip, onder «geregistreerde eigenaar» die
      maatschappij wordt verstaan;
        - *gevaar:* elke situatie of dreiging die: 1°. een gevaar of belemmering vormt voor de scheepvaart, of 2°. naar
      redelijkerwijs verwacht kan worden zal uitmonden in grote schadelijke gevolgen voor het mariene milieu of schade
      aan de kustlijn of daarmee samenhangende belangen van een of meer staten;
        - *maritiem ongeval:* aanvaring, stranding, ander navigatieincident of ander voorval aan boord van het schip
      of daarbuiten waardoor materiële schade aan een schip of zijn lading wordt veroorzaakt of dreigt te worden
      veroorzaakt;
        - *Nederlands schip:* schip dat op grond van Nederlandse rechtsregels gerechtigd is de vlag van het Koninkrijk
      te voeren;
        - *opruiming en opruimen:* elke vorm van voorkomen, beperken of ongedaan maken van het gevaar dat ontstaat door
      een wrak;
        - *schip:* zeeschip, ongeacht het type, met inbegrip van draagvleugelboten, luchtkussenvaartuigen,
      onderwatervaartuigen, drijvende vaartuigen en drijvende platforms, met uitzondering van platforms die ter plaatse
      worden ingezet bij de exploratie, exploitatie of productie van minerale rijkdommen van de zeebodem;
        - *staat waar het schip geregistreerd is:* met betrekking tot een geregistreerd schip, de staat waarin het schip is
      geregistreerd en met betrekking tot een niet-geregistreerd schip, de staat waarvan het schip gerechtigd is de vlag
      te voeren;
        - *wrak:* 1°. als gevolg van een maritiem ongeval gezonken of gestrand schip; 2°. als gevolg van een maritiem
      ongeval gezonken of gestrand deel van een schip, met inbegrip van zaken die zich aan boord van dat schip bevinden
      of hebben bevonden; 3°. als gevolg van een maritiem ongeval op zee door een schip verloren zaak die is gestrand,
      gezonken of op zee op drift geraakt, of 4°. schip dat als gevolg van een maritiem ongeval op het punt van zinken
      of stranden staat of naar redelijkerwijs verwacht kan worden zal zinken of stranden indien niet reeds doeltreffende
      maatregelen worden genomen om hulp te verlenen aan het in gevaar verkerend schip of andere zaak.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49a
  - number: 49b.1
    text: |-
      Deze paragraaf is van toepassing op een wrak dat als gevolg van een maritiem ongeval een gevaar vormt in de
      territoriale zee, met inbegrip van de baaien en inhammen die hiermee in open verbinding staan, en de exclusieve
      economische zone, voor zover niet elders in deze paragraaf anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49b
  - number: 49c
    text: |-
      Voor de toepassing van deze paragraaf en de daarop berustende bepalingen, wordt onder het verlenen van hulp aan
      een schip mede verstaan het verlenen van hulp aan zaken die zich aan boord daarvan bevinden of aan van dat schip
      afkomstige drijvende of gezonken zaken.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49c
  - number: 49d
    text: |-
      Indien het schip toebehoort aan een rederij die een boekhouder heeft aangesteld, of indien er sprake is van
      rompbevrachting, treedt de boekhouder, onderscheidenlijk de rompbevrachter voor de toepassing van deze paragraaf en
      de daarop berustende bepalingen in de plaats van de geregistreerde eigenaar.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49d
  - number: 49e.1
    text: 'Indien zich een maritiem ongeval heeft voorgedaan ten gevolge waarvan:'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49e
  - number: 49e.1.1°
    text: een schip is gezonken of gestrand;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49e
  - number: 49e.1.2°
    text: |-
      een deel van een schip, met inbegrip van zaken die zich aan boord van dat schip bevinden of hebben bevonden, is
      gezonken of gestrand;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49e
  - number: 49e.1.3°
    text: een door een schip op zee verloren zaak is gestrand, gezonken of op zee op drift geraakt, of
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49e
  - number: 49e.1.4°
    text: |-
      een schip op het punt van zinken of stranden staat of naar redelijkerwijs verwacht kan worden, zal zinken of
      stranden indien niet reeds doeltreffende maatregelen worden genomen om hulp te verlenen, maakt de gezagvoerder
      of de exploitant van het schip daarvan zo spoedig mogelijk melding en verstrekt daarbij de gegevens, bedoeld in
      artikel 5, tweede lid, van het Wrakopruimingsverdrag aan Onze Minister, die daarvoor een instantie kan aanwijzen.
      Zodra door de gezagvoerder of de exploitant van het schip aan de meldplicht uit hoofde van dit artikel is voldaan,
      is de ander daarvan ontslagen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49e
  - number: 49e.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de te verstrekken informatie,
      alsmede de wijze waarop de melding geschiedt en de informatie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49e
  - number: 49e.3
    text: |-
      Het eerste lid en het bepaalde krachtens het tweede lid is niet van toepassing voor zover op grond van
      [artikel 14 van de Wet voorkoming van verontreiniging door schepen BES][ref1] aan de bevoegde autoriteiten van het
      ongeval melding moet worden gemaakt en daarbij de in het tweede lid bedoelde informatie moet worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028453#Artikel14
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0028453
        artikel: '14'
  - number: 49f.1
    text: |-
      Zodra Onze Minister op de hoogte is van de aanwezigheid van een wrak, draagt hij er zorg voor dat onmiddellijk de
      deelnemers aan het scheepvaartverkeer en de betrokken staten worden gewaarschuwd.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49f
  - number: 49f.2
    text: |-
      Indien Onze Minister redenen heeft om aan te nemen dat een wrak een gevaar vormt, draagt hij er zorg voor dat alle
      redelijkerwijs uitvoerbare maatregelen worden getroffen om de precieze locatie van het wrak vast te stellen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49f
  - number: 49g.1
    text: |-
      Zodra Onze Minister op de hoogte is van de aanwezigheid van een wrak, neemt hij een beschikking, inhoudend
      dat het wrak een gevaar vormt, indien hij daarvoor met inachtneming van de criteria van artikel 6 van het
      Wrakopruimingsverdrag gronden aanwezig acht.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49g
  - number: 49g.2
    text: |-
      Indien Onze Minister overeenkomstig het eerste lid heeft vastgesteld dat een wrak een gevaar vormt, draagt hij er
      zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49g
  - number: 49g.2.a
    text: |-
      alle redelijke maatregelen worden getroffen om het wrak te markeren overeenkomstig het toepasselijke internationaal
      aanvaarde systeem voor bebakening;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49g
  - number: 49g.2.b
    text: |-
      de bijzonderheden van de markering van het wrak worden bekendgemaakt met behulp van alle gepaste middelen, met
      inbegrip van zeevaartkundige publicaties;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49g
  - number: 49g.2.c
    text: |-
      de beschikking wordt bekendgemaakt aan de geregistreerde eigenaar en zo spoedig mogelijk wordt medegedeeld aan de
      staat waar het schip geregistreerd is;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49g
  - number: 49g.2.d
    text: |-
      met het bevoegd gezag van de staat waar het schip geregistreerd is en van andere staten die negatieve gevolgen van
      het wrak ondervinden, overleg wordt gevoerd over de met betrekking tot het wrak te treffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49g
  - number: 49h.1
    text: |-
      Indien Onze Minister overeenkomstig [artikel 49g][ref1] heeft vastgesteld dat een wrak een gevaar vormt, draagt de
      geregistreerde eigenaar er zorg voor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel49g
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49h
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: 49g
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 49h.1.a
    text: het wrak wordt opgeruimd en
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49h
  - number: 49h.1.b
    text: |-
      aan Onze Minister een bewijs wordt overgelegd van verzekering of andere financiële zekerheid zoals vereist op grond
      van artikel 12 van het Wrakopruimingsverdrag, tenzij een andere belanghebbende een zodanig bewijs heeft overgelegd.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49h
  - number: 49h.2
    text: |-
      De geregistreerde eigenaar kan ter voldoening aan het eerste lid, aanhef en onderdeel a, een overeenkomst sluiten
      met een hulpverlener of andere persoon teneinde het wrak te doen opruimen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49h
  - number: 49i
    text: |-
      Indien Onze Minister overeenkomstig artikel 6 van het Wrakopruimingsverdrag heeft vastgesteld dat een wrak een
      gevaar vormt:
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49i
  - number: 49i.a
    text: |-
      stelt hij in een beschikking een redelijke termijn binnen welke de geregistreerde eigenaar het wrak moet opruimen,
      rekening houdend met de aard van het vastgestelde gevaar;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49i
  - number: 49i.b
    text: |-
      vermeldt hij bij de bekendmaking van de beschikking met de door hem gestelde termijn, dat hij het wrak
      overeenkomstig [artikel 49l][ref1] en [artikel 8:615 van het Burgerlijk Wetboek BES][ref2] voor rekening van de
      geregistreerde eigenaar kan doen opruimen, indien de geregistreerde eigenaar verzuimt het wrak binnen die termijn
      op te ruimen en


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel49l
      [ref2]: https://wetten.overheid.nl/BWBR0028753#Artikel615
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49i
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: 49l
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref2
        bwb_id: BWBR0028753
        artikel: '615'
  - number: 49i.c
    text: |-
      stelt hij de geregistreerde eigenaar schriftelijk ervan in kennis dat hij voornemens is onmiddellijk op te treden
      indien het gevaar bijzonder groot wordt.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49i
  - number: 49j
    text: |-
      Alvorens het opruimen aanvangt, kan Onze Minister in een tot de geregistreerde eigenaar gerichte beschikking
      voorschriften vastleggen voor dit opruimen, uitsluitend voor zover dat nodig is om te waarborgen dat het opruimen
      geschiedt in overeenstemming met overwegingen betreffende de veiligheid en de bescherming van het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49j
  - number: 49k
    text: |-
      Wanneer het opruimen door de geregistreerde eigenaar is aangevangen, kan Onze Minister besluiten tot optreden
      bij het opruimen voor zover dat nodig is om te waarborgen dat dit doeltreffend geschiedt, in overeenstemming met
      overwegingen betreffende de veiligheid en de bescherming van het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49k
  - number: 49l.1
    text: |-
      Indien de geregistreerde eigenaar verzuimt het wrak binnen de ingevolge [artikel 49i, aanhef en onder a][ref1],
      vastgestelde termijn op te ruimen, of indien geen contact kan worden gelegd met de geregistreerde eigenaar, kan
      Onze Minister het wrak langs de naar zijn oordeel meest praktische en snelle weg doen opruimen, in overeenstemming
      met overwegingen betreffende de veiligheid en de bescherming van het mariene milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel49i
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49l
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: 49i
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 49l.2
    text: |-
      Voorts kan Onze Minister in omstandigheden waarin onmiddellijk optreden vereist is en hij de staat waar het schip
      geregistreerd is en de geregistreerde eigenaar daarvan in kennis heeft gesteld, het wrak langs de naar zijn oordeel
      meest praktische en snelle weg doen opruimen, in overeenstemming met overwegingen betreffende de veiligheid en de
      bescherming van het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49l
  - number: 49l.3
    text: |-
      Al hetgeen in verband met het opruimen op grond van het eerste lid wordt geborgen, wordt tegen voldoening van de
      ter zake van de opruiming gemaakte kosten of tegen het stellen van zekerheid voor de voldoening daarvan afgegeven
      aan belanghebbenden, die zich daartoe aanmelden en zich als zodanig kunnen legitimeren.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49l
  - number: 49l.4
    text: Onze Minister kan niet aansprakelijk worden gesteld voor afgifte van het geborgene aan een onbevoegde.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49l
  - number: 49l.5
    text: |-
      Indien belanghebbenden zich niet aanmelden, dan wel in gebreke blijven binnen een door Onze Minister te stellen
      termijn de in het derde lid bedoelde kosten te voldoen of voor de voldoening daarvan zekerheid te stellen, is Onze
      Minister bevoegd het geborgene te verkopen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49l
  - number: 49m.1
    text: |-
      Met betrekking tot een wrak dat zich bevindt in de territoriale zee, met inbegrip van de baaien en inhammen
      die hiermee in open verbinding staan, zijn [artikel 49g, tweede lid, aanhef en onderdeel c][ref1], wat betreft
      mededeling aan de staat waar het schip geregistreerd is, en onderdeel d, alsmede de kennisgevingsverplichtingen van
      [artikel 49l, tweede lid][ref2], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel49g
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel49l
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49m
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: 49g
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref2
        bwb_id: BWBR0028550
        artikel: 49l
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 49n
    text: |-
      Indien Onze Minister ingevolge [artikel 49j][ref1], [49k][ref2] of [49l][ref3] een schip naar een haven in Bonaire,
      Sint Eustatius of Saba heeft doen brengen, vergoedt Onze Minister de redelijke kosten van die maatregelen van het
      daartoe bevoegde gezag die redelijkerwijs nodig zijn om het gevaar verbonden aan het brengen van het schip naar, en
      het verblijf in, de haven dan wel de gevolgen ervan, te voorkomen, te beperken of ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel49j
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel49k
      [ref3]: https://wetten.overheid.nl/BWBR0028550#Artikel49l
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49n
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: 49j
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref2
        bwb_id: BWBR0028550
        artikel: 49k
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref3
        bwb_id: BWBR0028550
        artikel: 49l
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 49o.1
    text: |-
      Indien een persoon, nadat een maritiem ongeval als bedoeld in[ artikel 49a][ref1] heeft plaatsgevonden, hulp
      heeft verleend aan het desbetreffende schip en als gevolg van een besluit of handeling van Onze Minister krachtens
      [artikel 49j][ref2], [49k][ref3] of [49l][ref4] bij de hulpverlening schade heeft geleden die hij niet kan verhalen
      op de geregistreerde eigenaar van dat schip of een andere persoon, kent Onze Minister de hulpverlener op diens
      verzoek een billijke tegemoetkoming in die schade toe.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel49a
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel49j
      [ref3]: https://wetten.overheid.nl/BWBR0028550#Artikel49k
      [ref4]: https://wetten.overheid.nl/BWBR0028550#Artikel49l
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49o
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: 49a
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref2
        bwb_id: BWBR0028550
        artikel: 49j
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref3
        bwb_id: BWBR0028550
        artikel: 49k
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref4
        bwb_id: BWBR0028550
        artikel: 49l
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 49o.2
    text: |-
      Een tegemoetkoming als bedoeld in het eerste lid wordt geweigerd, respectievelijk kan slechts gedeeltelijk worden
      toegekend, indien de door de hulpverlener geleden schade geheel respectievelijk gedeeltelijk is te wijten aan diens
      schuld of de schuld van degenen voor wie hij aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49o
  - number: 49o.3
    text: |-
      Onze Minister neemt bij de toepassing van het eerste lid bij de bepaling van de door de hulpverlener geleden schade
      in het bijzonder in aanmerking:
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49o
  - number: 49o.3.a
    text: de bij de hulpverlening gemaakte kosten;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49o
  - number: 49o.3.b
    text: het verlies of de beschadiging van het bij de hulpverlening ingezet materieel of gebruikte materialen;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49o
  - number: 49o.3.c
    text: de bij de hulpverlening gelopen risico's;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49o
  - number: 49o.3.d
    text: het gederfde hulploon.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel49o
  - number: '50.1'
    text: |-
      Met de opsporing van de in deze wet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde ambtenaren, belast de daartoe bij besluit van
      Onze Minister van Veiligheid en Justitie in overeenstemming met Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '50.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel50
  - number: '51.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de personen aangewezen in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1], alsmede de door Onze Minister aangewezen ambtenaren of
      personen. Een zodanige aanwijzing wordt bekendgemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '51.2'
    text: |-
      Voor zover het in het eerste lid bedoelde toezicht betrekking heeft op de naleving van door de bestuurscolleges
      ter uitvoering van deze wet gestelde voorschriften, wordt dit toezicht mede uitgeoefend door ambtenaren of personen
      die daartoe door het bestuurscollege zijn aangewezen. Een zodanige aanwijzing wordt bekendgemaakt in het blad
      waarin door het desbetreffende openbaar lichaam gebruikelijk officiële berichten worden bekendgemaakt en in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel51
  - number: '51.3'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening van de
      krachtens dit artikel aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel51
  - number: '51.4'
    text: Een ieder is verplicht aan de krachtens dit artikel aangewezen personen alle medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel51
  - number: 51a
    text: |-
      De ambtenaren, bedoeld in [artikel 51][ref1], zijn tevens belast met het uitvoeren van maatregelen genomen
      krachtens [artikel 49k][ref2] of [49l][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel49k
      [ref3]: https://wetten.overheid.nl/BWBR0028550#Artikel49l
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel51a
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '51'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0028550
        artikel: 49k
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref3
        bwb_id: BWBR0028550
        artikel: 49l
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: '52.1'
    text: |-
      De krachtens [artikel 51][ref1] aangewezen personen zijn, uitsluitend voor zover dat voor de vervulling van hun
      taak redelijkerwijze noodzakelijk is, bevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel51
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '51'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 52.1.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel52
  - number: 52.1.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel52
  - number: 52.1.c
    text: |-
      goederen aan opneming en onderzoek te onderwerpen, deze daartoe tijdelijk mee te nemen en daarvan monsters te
      nemen;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel52
  - number: 52.1.d
    text: |-
      alle plaatsen, met uitzondering van woningen, zonder uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van de door hen aangewezen personen;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel52
  - number: 52.1.e
    text: schepen en stilstaande voertuigen, alsmede de lading daarvan te onderzoeken;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel52
  - number: 52.1.f
    text: |-
      woningen of tot woning bestemde gedeelten van vaartuigen zonder uitdrukkelijke toestemming van de bewoner binnen
      te treden.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel52
  - number: '52.2'
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld in het eerste lid, onderdeel d, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel52
  - number: '52.3'
    text: |-
      Op het binnentreden van woningen of van tot woning bestemde gedeelten van vaartuigen als bedoeld in het
      derde lid, onderdeel f, is [Titel X van het Derde Boek van het Wetboek van Strafvordering BES][ref1] van
      overeenkomstige toepassing, met uitzondering van de [artikelen 155, vierde lid][ref2], [156, tweede lid][ref3],
      [157, tweede en derde lid][ref4], [158, eerste lid, laatste zinsnede][ref5], en [160, eerste lid][ref6], en
      met dien verstande dat de machtiging, indien het betreft de krachtens het eerste lid aangewezen personen, wordt
      verleend door de procureur-generaal en, indien het betreft de krachtens het tweede lid aangewezen personen, de
      gezaghebber.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel156
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel157
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel158
      [ref6]: https://wetten.overheid.nl/BWBR0028681#Artikel160
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '155'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '156'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '157'
      - id: ref5
        bwb_id: BWBR0028681
        artikel: '158'
      - id: ref6
        bwb_id: BWBR0028681
        artikel: '160'
  - number: '53'
    text: |-
      De met het toezicht belaste personen zijn bevoegd schepen aan of vast te houden indien het vermoeden bestaat
      dat er in strijd is of wordt gehandeld met het gestelde bij of krachtens [artikel 15][ref1], [artikel 19][ref2],
      [artikel 22, eerste lid][ref3], [artikel 25][ref4], [artikel 26][ref5], [artikel 27][ref6], [artikel 31][ref7],
      [artikel 28a][ref8], [artikel 41][ref9], [artikel 44][ref10], [artikel 45][ref11], [artikel 46][ref12] en
      [artikel 46a][ref13].


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0028550#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0028550#Artikel25
