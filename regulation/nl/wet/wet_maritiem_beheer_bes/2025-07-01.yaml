  - number: '83.2'
    text: Het eerste lid geldt ook indien niet wordt voldaan aan een aanwijzing.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel83
  - number: '84.1'
    text: |-
      Bij vermoeden van handelen in strijd met de bij of krachtens deze wet gegeven voorschriften, bedoeld
      in [artikel 4, tweede lid][ref1], [artikel 11][ref2], [artikel 18][ref3], [artikel 19][ref4],
      [artikel 20][ref5], [artikel 25][ref6], [artikel 26][ref7], [artikel 27][ref8], [artikel 28][ref9],
      [artikel 44][ref10], [artikel 46a, eerste lid][ref11], [artikel 51, vierde lid][ref12],
      [artikel 57, eerste, tweede, vierde en vijfde lid][ref13], of [artikel 62][ref14], kan aan de gezagvoerder bevel
      worden gegeven dat het schip een haven of binnenwater op of een rede bij Bonaire, Sint Eustatius of Saba niet zal
      verlaten dan nadat op een bij dat bevel aan te wijzen plaats een daarbij te bepalen geldsom is gestort, waarop de
      ter zake van die strafbare gedraging op te leggen geldboete zal kunnen worden verhaald. Het bevel wordt zonodig met
      behulp van de sterke arm ten uitvoer gelegd.


