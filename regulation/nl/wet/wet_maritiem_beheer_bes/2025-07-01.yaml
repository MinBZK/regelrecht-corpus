  - number: '81.1'
    text: |-
      Degene die opzettelijk handelt in strijd met het verbod gegeven bij of krachtens [artikel 18][ref1],
      [artikel 19][ref2], [artikel 19a][ref3], [artikel 19b][ref4], [artikel 20][ref5], [artikel 25][ref6],
