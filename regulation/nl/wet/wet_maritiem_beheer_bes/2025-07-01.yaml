      - id: ref12
        bwb_id: BWBR0028550
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref13
        bwb_id: BWBR0028550
        artikel: 46a
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '54'
    text: |-
      De met het toezicht belaste personen zijn bevoegd schepen die zich in de binnenwateren of de territoriale zee
      bevinden aan een onderzoek te onderwerpen, indien gegronde redenen zijn aan te nemen dat in de territoriale zee in
      strijd met [artikel 44][ref1] of [artikel 46a, eerste lid][ref2] is of wordt gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel46a
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0028550
        artikel: 46a
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '55'
    text: |-
      De met het toezicht belaste personen zijn bevoegd schepen die zich in de territoriale zee of exclusieve economische
      zone bevinden aan te houden, indien er gegronde redenen zijn om aan te nemen dat in de exclusieve economische zone
      in strijd met [artikel 44][ref1] of [artikel 46a, eerste lid][ref2] is of wordt gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel46a
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0028550
        artikel: 46a
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '56.1'
    text: |-
      In afwijking van [artikel 52, eerste lid][ref1], verschaft de gezagvoerder van een buitenlands schip bij aanhouding
      op eerste verzoek aan de toezichthouders:


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel52
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '52'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 56.1.a
    text: de identiteit van het schip;
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel56
  - number: 56.1.d
    text: de vorige en volgende aanloophaven, en
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel56
  - number: 56.1.c
    text: informatie over de vermoedelijke overtreding.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel56
  - number: '56.2'
    text: |-
      Onverminderd het eerste lid, zijn de toezichthouders bevoegd inzage te verkrijgen in de certificaten en documenten
      van het schip die ingevolge internationale normen en regels zijn vereist.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel56
  - number: '57.1'
    text: |-
      De gezagvoerder van een aangehouden schip is verplicht zijn schip na de aanhouding ligplaats te doen nemen of voor
      anker te doen gaan op de met het toezicht belaste persoon in overeenstemming met de gezaghebber of de beheerder,
      aan te wijzen plaats. Deze plaats kan ook een lig- of ankerplaats in een haven op of op een rede bij Bonaire, Sint
      Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel57
  - number: '57.2'
    text: |-
      Zolang de vasthouding voortduurt, is het de gezagvoerder verboden het schip te doen verplaatsen zonder voorafgaande
      toestemming van de met het toezicht belaste persoon.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel57
  - number: '57.3'
    text: |-
      Zonder deze toestemming weigeren alle betrokken ambtenaren hun medewerking bij het verplaatsen en het uitklaren van
      het schip.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel57
  - number: '57.4'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel57
  - number: '57.5'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op een buitenlands schip dat zich in de
      binnenwateren, de territoriale zee of de exclusieve economische zone bevindt.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel57
  - number: '58.1'
    text: |-
      De aanhouding geschiedt door de met het toezicht belaste persoon door middel van overhandiging aan de gezagvoerder
      van een ondertekende en gedagtekende kennisgeving, waarin de reden van aanhouding staat vermeld. Wanneer naar het
      oordeel van die toezichthoudende persoon overhandiging niet mogelijk is, geschiedt de aanhouding mondeling door een
      kennisgeving aan de naar zijn oordeel daarvoor meest gerede persoon, zo spoedig mogelijk gevolgd door overhandiging
      van de schriftelijke kennisgeving aan de gezagvoerder.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel58
  - number: '58.2'
    text: |-
      De beheerder van het desbetreffende zeegebied, alsmede de naar het oordeel van de met het toezicht belaste persoon
      in aanmerking komende diensten, worden onverwijld van het bevel tot aanhouding in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel58
  - number: '58.3'
    text: |-
      Indien de aanhouding geschiedt wegens verontreiniging of dreigende verontreiniging van het mariene milieu, dan
      worden de Inspectie Leefomgeving en Transport en de met de zorg voor het milieu belaste dienst van het betrokken
      openbaar lichaam Bonaire, Sint Eustatius of Saba ingelicht.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel58
  - number: '59.1'
    text: |-
      Zodra er geen reden is de vasthouding langer te laten voortduren en de mogelijk op grond van [artikel 10][ref1]
      verschuldigde vergoedingen zijn voldaan of de voldoening daarvan voldoende zeker is gesteld, heft de met het
      toezicht belaste persoon de vasthouding op.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel10
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '10'
        hoofdstuk: '2'
  - number: '59.2'
    text: Opheffing geschiedt door overhandiging aan de gezagvoerder van een ondertekende en gedagtekende kennisgeving.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel59
  - number: '59.3'
    text: |-
      Op deze opheffing en kennisgeving is [artikel 58][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel58
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '58'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '60'
    text: |-
      Indien een buitenlands schip wordt aangehouden, onderscheidenlijk vastgehouden, zijn de [artikelen 58][ref1] en
      [59][ref2] hierop van overeenkomstige toepassing, met dien verstande dat van de aanhouding en de opheffing daarvan
      tevens de consul of de diplomatieke vertegenwoordiger in de openbare lichamen Bonaire, Sint Eustatius of Saba en,
      bij diens afwezigheid, de regering van de vlaggestaat van het schip, onverwijld op de hoogte wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel59
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '58'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0028550
        artikel: '59'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '61.1'
    text: |-
      De met het toezicht belaste personen zijn bevoegd ter uitvoering en handhaving van dit hoofdstuk de nodige
      maatregelen te nemen en de nodige aanwijzingen te geven.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel61
  - number: '61.2'
    text: |-
      Eenieder is verplicht aan de met het toezicht belaste personen alle medewerking te verlenen die op grond van het
      eerste lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel61
  - number: '62'
    text: |-
      De met het toezicht belaste personen zijn bevoegd tot het stilleggen van werkzaamheden in de binnenwateren, de
      reden, de territoriale zee of de exclusieve economische zone, waarbij in strijd met het bepaalde bij of krachtens
      de [artikelen 24][ref1], [25][ref2], [27][ref3], [28][ref4], [44][ref5], [45][ref6], [46][ref7] en [46a][ref8],
      wordt gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0028550#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0028550#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0028550#Artikel44
      [ref6]: https://wetten.overheid.nl/BWBR0028550#Artikel45
      [ref7]: https://wetten.overheid.nl/BWBR0028550#Artikel46
      [ref8]: https://wetten.overheid.nl/BWBR0028550#Artikel46a
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0028550
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0028550
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref4
        bwb_id: BWBR0028550
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref5
        bwb_id: BWBR0028550
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref6
        bwb_id: BWBR0028550
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref7
        bwb_id: BWBR0028550
        artikel: '46'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref8
        bwb_id: BWBR0028550
        artikel: 46a
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '63.1'
    text: |-
      Het stilleggen van werkzaamheden geschiedt door middel van overhandiging door de met het toezicht belaste persoon
      aan de gezagvoerder van het schip of aan degene, belast met het beheer van het bouwwerk, van een ondertekende en
      gedagtekende kennisgeving, waarin de reden van stillegging van werkzaamheden staat vermeld.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel63
  - number: '63.2'
    text: |-
      Wanneer naar het oordeel van die persoon overhandiging niet mogelijk is, geschiedt het stilleggen mondeling
      door een kennisgeving aan de naar zijn oordeel daarvoor meest gerede persoon, zo spoedig mogelijk gevolgd door
      overhandiging van de schriftelijke kennisgeving aan de gezagvoerder van het schip of aan degene, belast met het
      beheer van het bouwwerk.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel63
  - number: '63.3'
    text: |-
      De beheerder alsmede de naar het oordeel van de met het toezicht belaste persoon in aanmerking komende diensten,
      worden onverwijld van het bevel tot stillegging van werkzaamheden in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel63
  - number: '63.4'
    text: |-
      Indien het stilleggen van werkzaamheden geschiedt wegens verontreiniging of dreigende verontreiniging van het
      mariene milieu, dan worden de Inspectie Leefomgeving en Transport en de met de zorg voor het milieu belaste dienst
      van het betrokken openbaar lichaam Bonaire, Sint Eustatius of Saba ingelicht.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel63
  - number: '64'
    text: |-
      De met het toezicht belaste persoon verzegelt de werktuigen en voorwerpen die ter uitvoering van de stilgelegde
      werkzaamheden worden of kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel64
  - number: '65.1'
    text: |-
      De met het toezicht belaste persoon is bevoegd ter uitvoering en handhaving van de stillegging de nodige
      maatregelen te nemen en de nodige aanwijzingen te geven.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel65
  - number: '65.2'
    text: |-
      Eenieder is verplicht aan de met het toezicht belaste personen alle medewerking te verlenen die op grond van het
      eerste lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel65
  - number: '66.1'
    text: |-
      Zodra er geen reden is de stillegging van werkzaamheden langer te laten voortduren en de mogelijk op grond van
      [artikel 10][ref1] verschuldigde kosten zijn voldaan of de voldoening daarvan voldoende zeker is gesteld, heft de
      met het toezicht belaste persoon de stillegging op.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel10
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '10'
        hoofdstuk: '2'
  - number: '66.2'
    text: |-
      Opheffing geschiedt door overhandiging aan de gezagvoerder of degene, belast met het beheer van het bouwwerk, van
      een ondertekende en gedagtekende kennisgeving.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel66
  - number: '66.3'
    text: |-
      Op deze opheffing en kennisgeving is [artikel 63][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel63
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '63'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '67.1'
    text: |-
      In dit hoofdstuk wordt onder bevoegd gezag verstaan het betrokken bestuurscollege, respectievelijk Onze Minister
      door wie of in overstemming met wie de vergunning, ontheffing of toestemming is verleend of in overeenstemming met
      wie de overtreden regel is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel67
  - number: '67.2'
    text: |-
      Het bevoegd gezag is bevoegd tot het doen wegnemen, ontruimen, beletten, in de vorige toestand herstellen of
      verrichten van hetgeen in strijd met de bij of krachtens deze wet gestelde bepalingen of met een voorschrift
      of beperking verbonden aan een bij of krachtens deze wet verleende vergunning is of wordt gedaan, gehouden of
      nagelaten.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel67
  - number: '67.3'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel67
  - number: '67.4'
    text: |-
      Het bevoegd gezag is eveneens bevoegd tot het in de vorige toestand herstellen van schade toegebracht aan
      overheidswerken, voor rekening van degene door wiens toedoen de schade is veroorzaakt, alsmede tot het treffen van
      maatregelen ter voorkoming van meerdere schade. De kosten wegens schade toegebracht aan overheidswerken, alsmede de
      kosten wegens de te nemen of genomen maatregelen, worden door een daartoe door het bevoegd gezag aangewezen persoon
      geraamd en vermeld in een proces-verbaal dat aan degene die de schade heeft toegebracht wordt toegezonden.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel67
  - number: '67.5'
    text: |-
      Het bevoegd gezag kan zekerheidsstelling als bedoeld in [artikel 84, eerste lid][ref1], vorderen met betrekking tot
      de in dit proces-verbaal vermelde kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel84
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '84'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '67.6'
    text: |-
      Bij toepassing van het eerste, het tweede of het derde lid, kan subsidiair de last onder dwangsom, bedoeld in
      [artikel 76, eerste lid][ref1], worden opgelegd. Artikel 76, tweede tot en met zesde lid, [artikel 77][ref2],
      [artikel 78][ref3] en [artikel 79][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel77
      [ref3]: https://wetten.overheid.nl/BWBR0028550#Artikel78
      [ref4]: https://wetten.overheid.nl/BWBR0028550#Artikel79
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '76'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0028550
        artikel: '77'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0028550
        artikel: '78'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref4
        bwb_id: BWBR0028550
        artikel: '79'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '67.7'
    text: |-
      Indien een besluit wordt genomen ingevolge dit artikel ten aanzien van een buitenlands schip, is [artikel 60][ref1]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel60
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '68.1'
    text: Een beslissing tot toepassing van bestuursdwang wordt op schrift gesteld en geldt als een beschikking.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel68
  - number: '68.2'
    text: De bekendmaking ervan geschiedt aan de overtreder en andere belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel68
  - number: '68.3'
    text: |-
      In de beschikking, bedoeld in het eerste lid, wordt een termijn gesteld waarbinnen de belanghebbenden de
      tenuitvoerlegging kunnen voorkomen door zelf de in de beschikking omschreven maatregelen te treffen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel68
  - number: '68.4'
    text: Indien de vereiste spoed zich daartegen verzet, behoeft geen termijn te worden gegund.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel68
  - number: '68.5'
    text: |-
      Indien de situatie dermate spoedeisend is dat het bevoegd gezag de beslissing tot toepassing van bestuursdwang niet
      tevoren op schrift kan stellen, zorgt hij alsnog zo spoedig mogelijk voor de opschriftstelling en de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel68
  - number: '69.1'
    text: |-
      De overtreder is de kosten verbonden aan de toepassing van bestuursdwang verschuldigd, tenzij de kosten
      redelijkerwijze niet of niet geheel te zijnen laste behoren te komen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel69
  - number: '69.2'
    text: |-
      De beschikking, bedoeld in [artikel 68, eerste lid][ref1], vermeldt dat de toepassing van bestuursdwang op kosten
      van de overtreder plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel68
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '68'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '69.3'
    text: |-
      Indien de kosten geheel of gedeeltelijk niet ten laste van de overtreder zullen worden gebracht, wordt zulks in de
      beschikking vermeld.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel69
  - number: '69.4'
    text: |-
      Onder kosten, worden tevens begrepen de kosten verbonden aan de voorbereiding van bestuursdwang, voorzover deze
      kosten zijn gemaakt na het tijdstip waarop de termijn, bedoeld in [artikel 68, derde lid][ref1], is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel68
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '68'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '69.5'
    text: |-
      De kosten zijn ook verschuldigd, indien de bestuursdwang door opheffing van de onrechtmatige situatie niet of niet
      volledig is uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel69
  - number: '70.1'
    text: |-
      Het bevoegd gezag kan van de overtreder bij dwangbevel de verschuldigde kosten, verhoogd met de op de invordering
      vallende kosten, invorderen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel70
  - number: '70.2'
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale titel
      op in de zin van het [Wetboek van Burgerlijke Rechtsvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: '70.3'
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van het
      openbaar lichaam Bonaire, Sint Eustatius of Saba respectievelijk de Staat der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel70
  - number: '70.4'
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van het openbaar lichaam Bonaire, Sint Eustatius of Saba
      respectievelijk de Staat der Nederlanden, kan de rechter de schorsing van de tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel70
  - number: '71'
    text: |-
      De kosten verbonden aan de toepassing van bestuursdwang zijn bevoorrecht op de
      zaak ten aanzien waarvan zij zijn besteed en worden na de kosten, bedoeld in
      [artikel 284, eerste lid, van Boek 3 van het Burgerlijk Wetboek BES][ref1], uit de opbrengst van de zaak betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel284
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '284'
  - number: '72.1'
    text: |-
      Om aan een beslissing tot toepassing van bestuursdwang uitvoering te geven, hebben de daartoe door het bevoegd
      gezag aangewezen personen toegang tot elke plaats voor zover dat redelijkerwijs voor de vervulling van hun taak
      nodig is.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel72
  - number: '72.2'
    text: |-
      [Artikel 52, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel52
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '52'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '72.3'
    text: |-
      Van een betreden als bedoeld in het tweede lid maakt de krachtens het eerste lid aangewezen persoon een proces-
      verbaal op, dat binnen tweemaal vierentwintig uur aan degene, wiens woning is betreden, in afschrift wordt
      toegezonden. In dit proces-verbaal wordt mede van het tijdstip van het betreden en van het daarmede beoogde doel
      melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel72
  - number: '73'
    text: |-
      Het bevoegd gezag is bevoegd ruimtes van schepen, alsmede gebouwen, terreinen, en hetgeen zich daarin of daarop
      bevindt, te verzegelen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel73
  - number: '74.1'
    text: |-
      Tot de bevoegdheid tot toepassing van bestuursdwang behoort het meevoeren en opslaan van daarvoor vatbare zaken
      voor zover de toepassing van bestuursdwang dit vereist.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel74
  - number: '74.2'
    text: |-
      Indien zaken zijn meegevoerd en opgeslagen, doet het bevoegd gezag daarvan proces-verbaal opmaken, waarvan
      afschrift wordt verstrekt aan de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel74
  - number: '74.3'
    text: |-
      Het bestuurscollege draagt zorg voor de bewaring van de opgeslagen zaken en geeft deze zaken terug aan de
      rechthebbende.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel74
  - number: '74.4'
    text: |-
      Het bevoegd gezag is bevoegd de afgifte op te schorten totdat de verschuldigde kosten zijn voldaan. Indien de
      rechthebbende niet tevens de overtreder is, is het bevoegd gezag bevoegd de afgifte op te schorten totdat de kosten
      van bewaring zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel74
  - number: '74.5'
    text: Het bevoegd gezag kan niet aansprakelijk worden gesteld voor afgifte van de opgeslagen zaak aan een onbevoegde.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel74
  - number: '75.1'
    text: |-
      Indien een opgeslagen zaak niet binnen dertien weken na de opslag kan worden teruggegeven, is het bevoegd gezag
      bevoegd, deze te verkopen of, indien verkoop naar zijn oordeel niet mogelijk is, de zaak om niet aan een derde in
      eigendom over te dragen of te laten vernietigen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel75
  - number: '75.2'
    text: |-
      Gelijke bevoegdheid heeft het bevoegd gezag ook binnen die termijn zodra de aan de toepassing van bestuursdwang
      verbonden kosten vermeerderd met de voor de verkoop, de eigendomsoverdracht om niet of de vernietiging geraamde
      kosten, in verhouding tot de waarde van de zaak onevenredig hoog worden.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel75
  - number: '75.3'
    text: |-
      Verkoop, eigendomsoverdracht of vernietiging vindt niet plaats binnen twee weken na de verstrekking van het
      afschrift van het proces-verbaal betreffende het meevoeren en opslaan, tenzij het gevaarlijke stoffen of eerder aan
      bederf onderhevige stoffen betreft.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel75
  - number: '75.4'
    text: |-
      Gedurende drie jaren na het tijdstip van verkoop heeft degene die op dat tijdstip rechthebbende was, recht op de
      opbrengst van de zaak onder aftrek van de aan de toepassing van bestuursdwang verbonden kosten en de kosten van de
      verkoop. Indien de rechthebbende niet tevens de overtreder is, wordt van de opbrengst de kosten van bestuursdwang
      niet in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel75
  - number: '75.5'
    text: |-
      Het bevoegd gezag kan niet aansprakelijk worden gesteld voor afgifte van de opbrengst uit de verkoop aan een
      onbevoegde.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel75
  - number: '76.1'
    text: |-
      Het bevoegd gezag kan in plaats van bestuursdwang toe te passen aan de overtreder een last onder dwangsom opleggen,
      indien het belang dat het overtreden voorschrift beoogt te beschermen zich daar niet tegen verzet.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel76
  - number: '76.2'
    text: |-
      Het bevoegd gezag stelt de dwangsom vast hetzij op een bedrag ineens hetzij op een bedrag per tijdseenheid waarin
      de last niet is uitgevoerd, of op een bedrag per overtreding van de last.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel76
  - number: '76.3'
    text: |-
      Het bevoegd gezag stelt tevens een bedrag vast, waarboven geen dwangsom meer wordt verbeurd. Het vastgestelde
      bedrag staat in redelijke verhouding tot de zwaarte van het geschonden belang en de beoogde werking van de
      dwangsomoplegging.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel76
  - number: '76.4'
    text: |-
      In de beschikking tot oplegging van een last onder dwangsom die strekt tot het ongedaan maken of het beëindigen
      van een overtreding wordt een termijn gesteld gedurende welke de overtreder de last kan uitvoeren zonder dat de
      dwangsom wordt verbeurd.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel76
  - number: '76.5'
    text: |-
      Onverminderd de bevoegdheid van de beheerder, bedoeld in [artikel 22, vierde lid][ref1], kan het bevoegd gezag een
      last onder dwangsom als bedoeld in het eerste lid, opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel22
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '77.1'
    text: |-
      Verbeurde dwangsommen komen toe aan het openbaar lichaam Bonaire, Sint Eustatius of Saba respectievelijk de Staat
      der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel77
  - number: '77.2'
    text: |-
      In het geval dat het bevoegd gezag de last onder dwangsom heeft opgelegd, is [artikel 68][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel68
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '68'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '78.1'
    text: |-
      Het bevoegd gezag kan op verzoek van de overtreder de last onder dwangsom opheffen of de looptijd ervan voor een
      bepaalde termijn opschorten, indien de overtreder blijvend of tijdelijk, geheel of gedeeltelijk niet in staat is
      aan zijn verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel78
  - number: '78.2'
    text: |-
      Het bevoegd gezag kan op verzoek van de overtreder de last onder dwangsom opheffen, indien de beschikking een jaar
      van kracht is geweest zonder dat de dwangsom is verbeurd.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel78
  - number: '79.1'
    text: |-
      De bevoegdheid tot invordering van verbeurde dwangsommen verjaart door verloop van één jaar na de dag waarop zij
      zijn verbeurd.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel79
  - number: '79.2'
    text: |-
      De verjaring wordt gestuit door faillissement van de overtreder en ieder wettelijk beletsel voor invordering van
      een dwangsom.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel79
  - number: '80.1'
    text: |-
      Degene die niet voldoet aan een aanwijzing van de beheerder als bedoeld in [artikel 4, tweede lid][ref1], of
      [artikel 17, vierde lid][ref2], of van Onze Minister als bedoeld in [artikel 41, eerste lid][ref3], begaat een
      overtreding en wordt gestraft met een geldboete van ten hoogste de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0028550#Artikel41
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel80
