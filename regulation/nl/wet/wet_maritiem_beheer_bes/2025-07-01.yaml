  - number: '98'
    text: |-
      Indien voorafgaand aan de inwerkingtreding van de wet van 14 maart 2018 tot wijziging van de Waterwet en van de
      Wet maritiem beheer BES in verband met de uitvoering van de wijziging van het Protocol van 1996 bij het Verdrag
      inzake de voorkoming van verontreiniging van de zee ten gevolge van het storten van afval en andere stoffen van
      1972 (mariene geo-engineering) (Stb. 98) voor een activiteit als bedoeld in [artikel 46a, eerste lid][ref1], een
      ontheffing is verleend op grond van [artikel 45, eerste lid][ref2], of [artikel 46, eerste lid][ref3], berust deze
      op artikel 46a, mits de activiteit in bijlage 4 bij het Protocol van 1996 is aangemerkt als een activiteit waarvoor
      een vergunning kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel46a
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0028550#Artikel46
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel98
