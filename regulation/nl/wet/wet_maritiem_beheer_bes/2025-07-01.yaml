      [ref11]: https://wetten.overheid.nl/BWBR0028550#Artikel45
      [ref12]: https://wetten.overheid.nl/BWBR0028550#Artikel46
      [ref13]: https://wetten.overheid.nl/BWBR0028550#Artikel46a
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel53
