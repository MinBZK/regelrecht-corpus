  - number: '83.1'
    text: |-
      Indien een handeling wordt verricht of een overtreding wordt begaan met of vanaf een buitenlands schip, kan, in
      afwijking van [artikel 80][ref1] en [artikel 81][ref2], enkel een geldboete worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel80
