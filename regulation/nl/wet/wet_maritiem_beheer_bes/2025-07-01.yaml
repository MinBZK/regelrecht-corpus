  - number: '81.2'
    text: |-
      Handelen als bedoeld in het eerste lid, voor zover niet opzettelijk begaan, is een overtreding en wordt gestraft
      met hechtenis van ten hoogste één jaar, hetzij met geldboete van maximaal de vijfde categorie, hetzij met beide
      straffen.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel81
  - number: '81.3'
    text: |-
      Bij herhaling van een overtreding als bedoeld in het eerste lid, kan de boete worden verhoogd door ten hoogste de
      keren van herhalen te vermenigvuldigen met ten hoogste het bedrag van een geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel81
  - number: '82'
    text: |-
      Degene die opzettelijk handelt in strijd met het gebod gegeven bij [artikel 26][ref1],
      [artikel 37, eerste lid][ref2], [artikel 61][ref3], [artikel 62][ref4] of [artikel 65][ref5], begaat een
      overtreding en wordt gestraft met een geldboete van maximaal de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028550#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0028550#Artikel61
