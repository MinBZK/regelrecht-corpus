  - number: '84.2'
    text: |-
      Het in het eerste lid bedoelde bevel wordt op vordering van de officier van justitie gegeven door de rechter
      voor wie de zaak wordt of zal worden vervolgd. De gezagvoerder wordt vooraf gehoord, althans daartoe behoorlijk
      opgeroepen. Het bevel is dadelijk uitvoerbaar en wordt onverwijld aan de gezagvoerder betekend.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel84
  - number: '84.3'
    text: |-
      Tegen het bevel of de beschikking tot afwijzing van de vordering kan de verdachte binnen drie dagen na de
      betekening en het Openbaar Ministerie binnen drie dagen nadat het bevel is gegeven of de beschikking is genomen,
      in beroep komen bij het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao en Sint Maarten en van Bonaire, Sint
      Eustatius en Saba. Het Hof beslist zo spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel84
  - number: '84.4'
    text: |-
      Zodra het in de strafzaak gewezen vonnis onherroepelijk is geworden, wordt de gestorte geldsom wederom ter
      beschikking van de rechthebbende gesteld, nadat daarop een bij dat vonnis opgelegde geldboete in mindering is
      gebracht. Tot dat tijdstip en te rekenen van de dag dat de geldsom werd gestort, wordt over die som de wettelijke
      rente vergoed.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel84
  - number: '85.1'
    text: |-
      Indien aan overheidswerken door een schip schade is toegebracht, kan aan de gezagvoerder bevel worden gegeven dat
      dit schip een haven of binnenwater op of een rede bij Bonaire, Sint Eustatius of Saba niet zal verlaten dan nadat
      op een bij dat bevel aan te wijzen plaats en daarbij te bepalen geldsom is gestort, waarop de kosten, bedoeld in
      [artikel 67, vierde lid][ref1], zullen kunnen worden verhaald. Het bevel wordt zo nodig met behulp van de sterke
      arm ten uitvoer gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028550#Artikel67
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0028550
        artikel: '67'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '85.2'
    text: |-
      Het in het eerste lid bedoelde bevel wordt gegeven door een daartoe door het bevoegd gezag aangewezen persoon. Het
      bevel is dadelijk uitvoerbaar en wordt onverwijld aan de gezagvoerder betekend.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel85
  - number: '85.3'
    text: |-
      Tegen het bevel kan de gezagvoerder of de scheepsbeheerder een kort geding aanspannen bij het Gerecht in Eerste
      Aanleg van Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel85
  - number: '85.4'
    text: |-
      Onverminderd het recht op volledige schadevergoeding, is het bevoegd gezag bevoegd het gestorte bedrag aan
      zekerheidsstelling, bedoeld in het eerste lid, aan te wenden tot herstel van de schade. Indien de werkelijke schade
      minder blijkt te bedragen dan het gestorte bedrag, dan wordt het overschot met de wettelijke rente daarvan, te
      rekenen van de dag van storting, ter beschikking gesteld van hem, die de zekerheid heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel85
  - number: '86.1'
    text: |-
      Een ieder die betrokken is bij de uitvoering van de regels geven bij of krachtens deze wet en daarbij de
      beschikking krijgt over gegevens waarvan hij het vertrouwelijk karakter kent of redelijkerwijs moet vermoeden, is
      verplicht tot geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht
      of uit zijn taak bij de uitvoering van deze wet de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel86
  - number: '86.2'
    text: |-
      De verplichting, genoemd in het eerste lid, geldt niet voor degene die reeds uit hoofde van ambt, beroep of
      wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt.
    url: https://wetten.overheid.nl/BWBR0028550/2025-07-01#Artikel86
