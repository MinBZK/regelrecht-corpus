preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is, ter implementatie van richtlijn nr. 2005/32/EG
    van het Europees Parlement en de Raad van de Europese Unie van 6 juli 2005 betreffende de totstandbrenging van een
    kader voor het vaststellen van eisen inzake ecologisch ontwerp voor energieverbruikende producten en tot wijziging
    van richtlijn 92/42/EEG van de Raad en de richtlijnen 96/57/EG en 2000/55/EG van het Europees Parlement en de
    Raad (PbEU L 191), in de Wet milieubeheer een regeling op te nemen teneinde eisen te kunnen stellen inzake het
    ecologisch ontwerp voor energieverbruikende producten en in verband daarmede de Wet energiebesparing toestellen en
    de Wet op de economische delicten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0022654/2010-11-20#ArtikelAanhef
articles:
  - number: IV
    text: |-
      1 Na de inwerkingtreding van deze wet berusten het [Besluit rendementseisen cv-ketels][ref1],
      het [Besluit energie-efficiëntienormen koel- en vriesapparatuur][ref2] en het
      [Besluit energierendementseisen voorschakelapparaten voor fluorescentielampen][ref3] mede op
      [artikel 9.4.4, eerste lid, van de Wet milieubeheer][ref4].

      2 Cv-ketels, koel- en vriesapparatuur, voorschakelapparaten voor fluorescentielampen, waarop een van de in
      het eerste lid genoemde besluiten van toepassing is, worden aangemerkt als categorieën van energiegerelateerde
      producten, aangewezen ingevolge [artikel 9.4.4, tweede lid, van de Wet milieubeheer][ref5].


