  - number: '17'
    text: |-
      Indien de in deze regeling genoemde werkzaamheden geheel of gedeeltelijk worden uitgevoerd op werkdagen tussen
      18.00 en 08.00 uur, op een zaterdag, op een zondag of op een in het [Algemeen Rijksambtenarenreglement][ref1]
      daaraan gelijkgestelde dag, is een aanvullend tarief verschuldigd van € 28 per uur per ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0014434/2003-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: '18'
    text: |-
      Indien werkzaamheden ten behoeve van de afgifte van documenten als bedoeld in deze regeling, buiten toedoen
      van de ambtenaren van de scheepvaartinspectie, niet leiden tot afgifte van dat document, is het volgende tarief
      verschuldigd:

      a. indien de werkzaamheden niet volledig zijn uitgevoerd € 57 per uur per ambtenaar;

      b. indien de werkzaamheden volledig zijn uitgevoerd, het tarief dat is vastgesteld voor de afgifte van het
      document.
    url: https://wetten.overheid.nl/BWBR0014434/2003-01-01#Artikel18
