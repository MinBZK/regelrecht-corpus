    text: |-
      Voor het aanbrengen van een extra ijkmerk, ijkplaat of ijkschaal, of het opnieuw aanbrengen van een ijkmerk,
      ijkplaat of ijkschaal is, naast het tarief, genoemd in [artikel 8][ref1], het volgende tarief verschuldigd:

      a. indien de werkzaamheden gelijktijdig met de meting, de hermeting of de controlemeting plaatsvinden, € 56 per
      schip;

      b. indien de werkzaamheden niet gelijktijdig met de meting, de hermeting of de controlemeting plaatsvinden, € 214
      per schip.


