  - number: '16'
    text: |-
      1 Indien de in de [hoofdstukken 1][ref1] en [2][ref2] van deze regeling genoemde onderzoeken geheel of
      gedeeltelijk buiten Nederland worden uitgevoerd, is een aanvullend tarief verschuldigd van € 57 per uur per
      ambtenaar voor de reistijd buiten Nederland en voor de eventuele wachttijd tijdens het verblijf buiten Nederland.
      Bij de berekening van de reistijd buiten Nederland en eventuele wachttijd geldt een maximum van acht uren per
      etmaal.

      2 De reis- en verblijfkosten van de ambtenaar, ten behoeve van de in de [hoofdstukken 1][ref3] en [2][ref4] van
      deze regeling genoemde onderzoeken buiten Nederland, komen voor rekening van de aanvrager. Deze kosten worden
      afzonderlijk in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0014434#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0014434#Hoofdstuk2
