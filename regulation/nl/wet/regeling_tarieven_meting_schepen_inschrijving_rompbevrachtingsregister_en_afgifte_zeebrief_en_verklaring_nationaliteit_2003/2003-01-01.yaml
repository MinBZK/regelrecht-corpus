      [Binnenschepenwet][ref2], de [Wet nationaliteit zeeschepen in rompbevrachting][ref3], de [Zeebrievenwet][ref4]
      of de [Maatregel teboekgestelde schepen 1992][ref5], die niet op grond van een ander artikel van deze regeling in
      rekening worden gebracht, is een tarief verschuldigd van € 57 per uur per ambtenaar.


