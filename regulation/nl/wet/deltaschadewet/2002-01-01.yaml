  - number: '10'
    text: |-
      Indien voortzetting van een bedrijf ter plaatse door het uitvoeren van werken of door het treffen van maatregelen
      tot aanpassing van het bedrijf mogelijk kan worden gemaakt, doch belanghebbende de voorkeur geeft aan verplaatsing,
      kan Onze Minister bepalen dat ter zake van deze verplaatsing een tegemoetkoming wordt verleend. Deze tegemoetkoming
      wordt nimmer hoger gesteld dan het bedrag van de tegemoetkoming, waarop de belanghebbende aanspraak zou kunnen
      maken bij aanpassing van het bedrijf.
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel10
  - number: '11'
    text: |-
      1 Indien een belanghebbende bij de voortzetting van het bedrijf schade lijdt, die niet of niet volledig door
      aanpassing of verplaatsing van het bedrijf kan worden voorkomen, wordt hem in de bedrijfsschade een tegemoetkoming
      verleend. De tegemoetkoming wordt vastgesteld op negen maal het verschil tussen 90 pct. van de gemiddelde
      jaarlijkse winst in de vijf boekjaren, voorafgaande aan het boekjaar waarin de schade is opgetreden en de geschatte
      gemiddelde jaarlijkse winst in dat boekjaar en de daarop volgende negen boekjaren voorzover deze ongunstig wordt
      beïnvloed door de in [artikel 2, eerste lid, onder ][ref1] genoemde oorzaken. Bedraagt het aantal boekjaren waarin
      het bedrijf werd uitgeoefend minder dan vijf, dan wordt aan de ontbrekende jaren een door schatting te bepalen
      winstbedrag toegerekend.

      2 Bij de schatting van de gemiddelde jaarlijkse winst in het boekjaar waarin de schade is opgetreden en de daarop
      volgende boekjaren wordt rekening gehouden met mogelijkheden tot omschakeling van het bedrijf en met nieuwe
      exploitatiemogelijkheden voor het bedrijf, voortvloeiende uit veranderingen in de economische situatie tengevolge
      van de afsluitingswerken.

      3 Indien een voldoend nauwkeurige schatting van de gemiddelde jaarlijkse winst in het boekjaar waarin de schade
      is opgetreden en de daarop volgende boekjaren niet aanstonds mogelijk is, kan Onze Minister bepalen dat gedurende
      de eerste drie boekjaren de tegemoetkoming in de bedrijfsschade overeenkomstig de in het eerste lid genoemde
      grondslagen jaarlijks wordt bepaald aan de hand van de werkelijke uitkomsten en jaarlijks aan de belanghebbende
      wordt uitgekeerd. Na afloop van deze drie boekjaren wordt aan belanghebbende een tegemoetkoming verleend tot
      een bedrag van zes en half maal de geschatte gemiddelde jaarlijkse bedrijfsschade in de daarop volgende zeven
      boekjaren. Deze tegemoetkoming wordt bepaald overeenkomstig de in het eerste lid genoemde grondslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel2
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel11
