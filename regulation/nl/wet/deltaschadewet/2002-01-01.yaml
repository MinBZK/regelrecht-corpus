  - number: '12'
    text: |-
      Indien tengevolge van schade een belanghebbende zijn bedrijf, de mogelijkheden tot aanpassing en verplaatsing
      mede in aanmerking genomen, niet kan voortzetten en deswege zijn bedrijf met goedkeuring van Onze Minister
      beëindigt wordt hem, tenzij hem uit hoofde van die schade reeds eerder een tegemoetkoming op grond van de
      [artikelen 6-11][ref1] is toegekend, een tegemoetkoming verleend in de vermogensschade en de bedrijfsschade, die
      door de beëindiging ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel6
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002748
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '13'
    text: |-
      1 De tegemoetkoming in de vermogensschade bedoeld in [artikel 12][ref1] wordt vastgesteld op het bedrag van
      de werkelijke waarde van de op het tijdstip van de beëindiging aan de belanghebbende toebehorende en tot de
      uitoefening van het bedrijf dienende goederen, verminderd met de geschatte waarde van deze goederen bij aanwending
      buiten het bedrijf.

      2 Tot de in het eerste lid bedoelde goederen worden mede gerekend de tot de uitoefening van het bedrijf dienende
      roerende zaken, die belanghebbende krachtens een overeenkomst van huurkoop gebruikt, alsmede de tot de uitoefening
      van het bedrijf dienende onroerende zaken waarvoor hij anders dan als eigenaar op grond van een overeenkomst
      aangegaan voor het tijdstip waarop de schade wordt geleden het risico draagt.

      3 Goederen die mede doch niet uitsluitend tot de uitoefening van het bedrijf dienen, worden voor de vaststelling
      van de tegemoetkoming in de vermogensschade slechts in aanmerking genomen in de mate, waarin zij tot de uitoefening
      van het bedrijf dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel12
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002748
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
  - number: '14'
    text: |-
      1 De tegemoetkoming in de bedrijfsschade bedoeld in [artikel 12][ref1] wordt vastgesteld op acht maal het verschil
      tussen de gemiddelde jaarlijkse winst van het bedrijf behaald in de vijf boekjaren voorafgaande aan het boekjaar
      waarin het bedrijf wordt beëindigd of waarin de schade is opgetreden en de geschatte waarde van de jaarlijkse
      opbrengsten van het vrijkomende kapitaal en van de vrijkomende arbeid van de belanghebbende. Bedraagt het aantal
      boekjaren, waarin het bedrijf werd uitgeoefend, minder dan vijf, dan wordt aan de ontbrekende jaren een door
      schatting te bepalen winstbedrag toegerekend.

      2 De in het eerste lid bedoelde tegemoetkoming kan worden verhoogd met een bedrag voor de uitgaven, die de
      belanghebbende na de beëindiging van zijn bedrijf verschuldigd is uit hoofde van verplichtingen ingevolge voordien
      gesloten overeenkomsten met betrekking tot andere dan de in [artikel 13][ref2] bedoelde goederen, waarover hij voor
      de uitoefening van zijn bedrijf de beschikking moest hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002748#Artikel13
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel14
    references:
