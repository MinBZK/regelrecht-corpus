preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat regelen dienen te worden gesteld omtrent het verlenen van een
    tegemoetkoming aan anderen dan oesterkwekers in de schade bedoeld in artikel 8 van de Deltawet en omtrent de
    verlening op overeenkomstige wijze van een tegemoetkoming in schade, die door de afsluiting van de Lauwerszee
    ontstaat, en dat de Deltawet en de Wet van 16 september 1966 (Stb. 399) aanvulling behoeven;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder:

      Onze Minister: Onze Minister van Verkeer en Waterstaat;

      afsluitingswerk: een werk als bedoeld in [artikel 1, onder I, van de Deltawet][ref1];

      belanghebbende: degene, die onder de termen van [artikel 2][ref2] valt;

      schade: het nadeel, dat voor een getroffene als bedoeld in [artikel 2][ref3] ontstaat ten gevolge van de in dat
      artikel genoemde oorzaken;

      gemiddelde jaarlijkse winst: het gemiddelde van de winsten in de aangegeven boekjaren bepaald volgens normen, die
      in het maatschappelijk verkeer als aanvaardbaar worden beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002283#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002748#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002748#Artikel2
