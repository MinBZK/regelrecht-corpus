  - number: '16'
    text: |-
      1 Indien de belanghebbende over de winst, die een gevolg is van tegemoetkomingen op grond van de
      [artikelen 11-14][ref1], alsmede in geval van de in [artikel 12][ref2] bedoelde beëindiging van zijn bedrijf over
      de winst die overigens met die beeindiging wordt behaald, meer inkomsten- of vennootschapsbelasting moet betalen
      dan de contante waarde van de belasting welke hij zou hebben moeten betalen, indien zonder het optreden van schade
      die winsten anders verdeeld en op andere tijdstippen aan hem zouden zijn toegekomen, wordt aan de belanghebbende
      een tegemoetkoming verleend gelijk aan het voor hem nadelige verschil.

      2 Voorzover de tegemoetkomingen bedoeld in het eerste lid betrekking hebben op in het verleden gederfde winsten
      wordt onder contante waarde van de belasting verstaan de belasting vermeerderd met rente.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002748#Artikel12
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel16
