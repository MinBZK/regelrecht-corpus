  - number: '8'
    text: |-
      1 Indien een belanghebbende tengevolge van schade zijn bedrijf ter plaatse niet meer kan voortzetten, de
      mogelijkheden tot aanpassing mede in aanmerking genomen en deswege zijn bedrijf wenst te verplaatsen, wordt hem,
      onverminderd het bepaalde in artikel 11, in de aan deze verplaatsing verbonden kosten een tegemoetkoming verleend.

      2 Onder de in het eerste lid bedoelde kosten worden verstaan de voor verplaatsing van het bedrijf in zijn bestaande
      vorm noodzakelijke kosten. Deze kosten worden zoveel mogelijk vooraf vastgesteld aan de hand van een door drie
      deskundigen verrichte taxatie. Bij de vaststelling daarvan wordt rekening gehouden met de voordelen, die bij
      verplaatsing worden verkregen uit hoofde van:

        - vervanging van oud door nieuw;
        - betere of andere exploitatiemogelijkheden, die door de verplaatsing alsmede door de voorzieningen bedoeld in
      [artikel 3, eerste lid][ref1], voor het bedrijf ontstaan;
        - de waarde van de door de verplaatsing vrijkomende zaken.

      Onze Minister kan voor de uitvoering van dit lid nadere regelen stellen.

      3 De in het eerste lid bedoelde verplaatsing behoeft de goedkeuring van Onze Minister. Deze overweegt daarbij of
      de verplaatsing economisch verantwoord is, alsmede welke de gevolgen zouden zijn van het achterwege blijven van
      de verplaatsing.

      4 Indien de verplaatsing is geschied voor de inwerkingtreding van deze wet dan wel zonder de in het derde lid
      bedoelde goedkeuring van Onze Minister, bepaalt deze of en in hoeverre de kosten daarvan voor een tegemoetkoming in
      aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel3
