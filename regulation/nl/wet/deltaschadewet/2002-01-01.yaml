        paragraaf: '4'
  - number: '17'
    text: |-
      Tegemoetkomingen als bedoeld in dit hoofdstuk worden niet verleend voorzover:

      a. de belanghebbende nalatig is om schade te voorkomen of te beperken, hetzij door geen gebruik te maken van
      voorzieningen als bedoeld in [artikel 3, eerste lid][ref1], hetzij door niet of niet tijdig zelf werken uit te
      voeren of maatregelen te treffen;

      b. schade voortvloeit uit handelingen, waarvan belanghebbende gelet op de voorzienbaarheid van de gevolgen van de
      afsluitingswerken had moeten begrijpen, dat deze handelingen economisch ondoelmatig zouden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel3
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002748
        artikel: '3'
        hoofdstuk: I
  - number: '18'
    text: |-
      1 De in [artikel 2, eerste lid, onder ][ref1] bedoelde belanghebbende heeft over elke dag waarover hij, ware
      zijn arbeidsverhouding niet beëindigd, loon zou hebben genoten recht op een tegemoetkoming die per week wordt
      uitbetaald.

      2 Het recht op de tegemoetkoming wordt niet onderbroken door de omstandigheid dat de belanghebbende een opleiding
      volgt met het oog op de verwerving van andere arbeid.

      3 Aan de toekenning van de tegemoetkoming kunnen voorwaarden worden verbonden gericht op de verwerving van andere
      arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel2
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002748
        artikel: '2'
        hoofdstuk: I
  - number: '19'
    text: |-
      1 De tegemoetkoming bedraagt per dag 80 pct. van het gemiddelde loon dat de belanghebbende zou hebben verdiend,
      indien zijn laatste arbeidsverhouding in het beroep dat hij gewoonlijk uitoefende op dezelfde voet zou zijn
      voortgezet.

      2 Volgens bij of krachtens algemene maatregel van bestuur te stellen regelen wordt de in het eerste lid bedoelde
      tegemoetkoming aan wijzigingen in het algemene loonpeil aangepast.

      3 Op de tegemoetkoming worden inkomsten van de belanghebbende op grond van aanspraken als bedoeld in
      [artikel 4][ref1] en andere door hem wegens loonderving genoten inkomsten ten volle in mindering gebracht. Onze
      Minister van Sociale Zaken en Volksgezondheid kan nadere regelen stellen, waarbij van het bepaalde in de vorige
      volzin kan worden afgeweken.

      4 Op de tegemoetkoming worden inkomsten van de belanghebbende uit arbeid voor 80 pct. in mindering gebracht.

      5 De in het derde en het vierde lid bedoelde inkomsten worden op de tegemoetkoming niet in mindering gebracht
      voorzover zij door de belanghebbende reeds werden genoten naast het loon uit de in het eerste lid bedoelde
      arbeidsverhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel4
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002748
        artikel: '4'
        hoofdstuk: I
  - number: '20'
    text: |-
      1 De tegemoetkoming wordt uitgekeerd over een periode van 12 maanden te rekenen vanaf de dag volgende op die,
      waarop de in [artikel 2, eerste lid, onder ][ref1] bedoelde arbeidsverhouding is beëindigd. Voor elk vol jaar
      waarmede de leeftijd van de belanghebbende bij beëindiging van de arbeidsverhouding 41 jaar overtreft, wordt de in
      de vorige volzin genoemde periode verlengd met:

      1 maand voor de jaren ouder dan 41 jaar, doch voor het bereiken van de leeftijd van 48 jaar;

      2 maanden voor de jaren ouder dan 47 jaar, doch voor het bereiken van de leeftijd van 52 jaar;

      3 maanden voor de jaren ouder dan 51 jaar, doch voor het bereiken van de leeftijd van 56 jaar;

      4 maanden voor de jaren ouder dan 55 jaar, doch voor het bereiken van de leeftijd van 60 jaar.

      2 Ten aanzien van de belanghebbende die op de dag van beëindiging van de arbeidsverhouding de leeftijd van 60 jaar
      heeft bereikt, wordt de tegemoetkoming uitgekeerd tot aan het tijdstip waarop hij de leeftijd van 65 jaar bereikt.

      3 De tegemoetkoming wordt voor bepaalde tijd verlaagd of ingetrokken indien de belanghebbende door een handelen of
      nalaten dat hem kan worden toegerekend, het verwerven van passende arbeid heeft belemmerd.

      4 Het recht op de tegemoetkoming gaat te niet indien de belanghebbende gedurende een al dan niet onderbroken
      periode van twee jaren uitsluitend ten gevolge van het in mindering brengen van inkomsten uit arbeid geen
      tegemoetkoming ingevolge deze wet heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel2
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002748
        artikel: '2'
        hoofdstuk: I
  - number: '21'
    text: |-
      Onze Minister van Sociale Zaken en Volksgezondheid kan voor de toepassing van [artikel 18, derde lid][ref1],
      [artikel 19, eerste lid][ref2] en [artikel 20, derde lid][ref3], nadere regelen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002748#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002748#Artikel20
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002748
        artikel: '18'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002748
        artikel: '19'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002748
        artikel: '20'
        hoofdstuk: III
  - number: '22'
    text: |-
      1 Indien de belanghebbende over de inkomsten genoten door de toekenning van een tegemoetkoming op grond van de
      [artikelen 18-20][ref1] meer loon- dan wel inkomstenbelasting moet betalen dan de contante waarde van de belasting
      welke hij zou moeten hebben betalen, indien zonder het optreden van schade die inkomsten op andere tijdstippen
      en anders verdeeld aan hem zouden zijn toegekomen, wordt hem een tegemoetkoming verleend gelijk aan het voor hem
      nadelige verschil.

      2 Voorzover de tegemoetkoming bedoeld in het eerste lid betrekking heeft op in het verleden gederfde inkomsten,
      wordt onder contante waarde van de belasting verstaan de belasting vermeerderd met rente.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel18
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002748
        artikel: '18'
        hoofdstuk: III
  - number: '23'
    text: |-
      Beslissingen op grond van deze wet of van de krachtens deze wet gestelde regelen worden voorzover niet anders is
      bepaald genomen door Onze Minister. Bij gemeenschappelijke regeling van Onze Minister en van een van Onze andere
      Ministers kunnen beslissingen op grond van deze wet ten aanzien van in die beschikking te noemen gevallen worden
      overgedragen aan deze andere Minister of, voorzover het de uitvoering van [hoofdstuk III][ref1] betreft, naar
      daarbij te stellen regelen aan in die beschikking aan te wijzen organen van lagere openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002748
        hoofdstuk: III
  - number: '24'
    text: |-
      1 De aanvraag om een tegemoetkoming in de schade moet uiterlijk een jaar nadat de schade zich voor het eerst heeft
      voorgedaan zijn ingekomen.

      2 Een aanvraag, die niet met inachtneming van de in het eerste lid genoemde termijn is ingekomen, wordt niet
      in behandeling genomen, tenzij de aanvrager aantoont dat hij de aanvraag heeft ingediend zo spoedig als dit
      redelijkerwijs verlangd kon worden.

      3 Bij algemene maatregel van bestuur kunnen tijdstippen worden vastgesteld, waarna met betrekking tot in die
      algemene maatregel te omschrijven groepen van gevallen geen aanvragen om tegemoetkoming meer kunnen worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel24
  - number: '25'
    text: |-
      De beschikking op een aanvraag om tegemoetkoming kan ook betrekking hebben op een daarbij aan te geven deel van
      de schade.
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel25
  - number: '26'
    text: |-
      Een tegemoetkoming kan op verzoek van de belanghebbende worden verleend voordat de schade in feite is opgetreden,
      indien naar het oordeel van Onze Minister daartoe in bijzondere omstandigheden aanleiding bestaat. Een zodanige
      tegemoetkoming wordt in ieder geval verleend indien de uitvoering van de afsluitingswerken de verkrijging van
      vervangende exploitatiemogelijkheden ernstig beperkt voor de belanghebbende, die door deze of andere werken in het
      betrokken gebied wordt getroffen.
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel26
  - number: '27'
    text: |-
      1 Een tegemoetkoming als bedoeld in [hoofdstuk II][ref1] wordt betaalbaar gesteld, zodra zij onherroepelijk is
      vastgesteld.

      2 Uit ’s Lands kas kunnen voorschotten op de te verwachten tegemoetkomingen worden verstrekt.

      3 Indien schade is opgetreden vóór de inwerkingtreding van deze wet wordt over het bedrag van de tegemoetkoming
      de wettelijke rente betaald. Deze worden berekend van de eerste dag van de maand waarin de schade is opgetreden
      tot de eerste dag van de maand waarin de tegemoetkoming betaalbaar is gesteld. Verstrekte voorschotten op de
      tegemoetkoming worden op het bedrag waarover de wettelijke rente wordt betaald in mindering gebracht vanaf de
      eerste dag van de maand waarin de betaling van de voorschotten heeft plaatsgevonden.

      4 Voor de berekening van de rente worden de bedragen van de tegemoetkoming naar beneden afgerond op € 50 of een
      veelvoud daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002748
        hoofdstuk: II
  - number: '28'
    text: |-
      1 De uitbetaling van een tegemoetkoming in vermogensschade of van een voorschot daarop ten aanzien van
      met hypotheek of pand bezwaarde goederen en de in [artikel 13, tweede lid][ref1], bedoelde roerende zaken,
      geschiedt niet dan overeenkomstig een regeling, die tussen de belanghebbende en de hypotheek- of pandhouder,
      onderscheidenlijk de huurverkoper is tot stand gekomen of op verzoek van één der partijen is vastgesteld
      door Onze Minister of door een van Onze andere Ministers, indien aan deze ingevolge [artikel 23][ref2] de
      beslissingsbevoegdheid in het betrokken geval is overgedragen.

      2 Bij de vaststelling van de in het eerste lid bedoelde regeling wordt gelet op de waardevermindering van het goed
      en op het belang dat de hypotheek- of pandhouder, onderscheidenlijk de huurverkoper bij het goed hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002748#Artikel23
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002748
        artikel: '13'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002748
        artikel: '23'
        hoofdstuk: IV
  - number: '35'
    text: |-
      1 De bepalingen van deze wet zijn van overeenkomstige toepassing op schade ontstaan door de afsluiting van de
      Lauwerszee.

      2 Voor de toepassing van het eerste lid wordt, waar in deze wet wordt gesproken van afsluitingswerk, daaronder
      verstaan het werk tot afsluiting van de Lauwerszee.
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel35
  - number: '38'
    text: Deze wet kan worden aangehaald als Deltaschadewet.
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel38
  - number: '39'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag na de datum van uitgifte van het *Staatsblad* waarin zij
      wordt geplaatst. De in [artikel 36][ref1] opgenomen wijziging van [artikel 7 van de Deltawet][ref2] vindt mede
      toepassing ten aanzien van buitendijkse gronden of wateren die na 1 juni 1970 tengevolge of mede tengevolge van
      de uitvoering van werken als bedoeld in [artikel 1 van de Deltawet][ref3] voor de inwerkingtreding van deze wet in
      waarde veranderen.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002283#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002283#Artikel1
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel39
