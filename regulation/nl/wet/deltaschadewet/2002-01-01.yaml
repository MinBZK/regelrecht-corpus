  - number: '2'
    text: |-
      1 Voor een tegemoetkoming volgens de bij deze wet gestelde regelen komt in aanmerking:

      a. degene, die als gevolg van de aanwezigheid van een afsluitingswerk rechtstreeks en onevenredig zwaar in zijn
      inkomsten uit bedrijf wordt getroffen door een der volgende omstandigheden:

        - de verandering van de waterbeweging in de binnenwaarts van de afsluitingswerken gelegen wateren;
        - de verandering van het zoutgehalte van de binnenwaarts van de afsluitingswerken gelegen wateren;
        - de belemmering van de vaart naar zee;
        - de veranderingen in de bodemfiguratie van de wateren buitenwaarts van de afsluitingswerken, rechtstreeks
      veroorzaakt door de aanwezigheid van die werken;
        - de wijzigingen in het visbestand in de buitenwaarts van de afsluitingswerken gelegen wateren, indien
      de getroffene de visserij pleegt uit te oefenen met een schip, waarvoor is afgegeven een certificaat van
      deugdelijkheid, als afgegeven krachtens de [Schepenwet][ref1], slechts geldig voor Vaargebied I, en voor zover de
      schade binnen 4 jaar na het tot stand komen van een afsluitingswerk is ontstaan;

      b. degene, die rechtstreeks en onevenredig zwaar in zijn in Nederland verworven inkomsten uit bedrijf wordt
      getroffen door het wegvallen, ten gevolge van de onder *a* genoemde oorzaken, van de vraag naar of het aanbod van
      goederen of diensten aan de zijde van een getroffene als bedoeld onder *a* uit hoofde van diens bedrijf;

      c. degene, wiens arbeidsverhouding wordt beëindigd in hoofdzaak doordat zijn werkgever als rechtstreeks gevolg van
      de onder *a* of *b* genoemde oorzaken zijn bedrijf niet op dezelfde voet kan voortzetten, indien en zolang hij in
      Nederland woonachtig is en hij bovendien:

        - op grond van de beëindiging van de arbeidsverhouding aanspraak heeft verkregen op een uitkering ingevolge de
      [Werkloosheidswet][ref2];
        - gedurende een tijdvak van ten minste twee jaren onmiddellijk voorafgaande aan de beëindiging van de
      arbeidsverhouding geheel of nagenoeg aaneengesloten hoofdzakelijk werkzaam is geweest in een door de onder *a*
      of *b* genoemde oorzaken getroffen bedrijf, hetzij in dat van zijn laatste werkgever, hetzij in een gelijksoortig
      bedrijf van een vorige werkgever, en
        - de leeftijd van 65 jaar niet heeft bereikt.

      2 Geen aanspraak op tegemoetkoming ingevolge deze wet heeft de oesterkweker in de zin van artikel 1, onder 2*e,*
      van de Wet van 16 september 1966 (*Stb.* 399).


      [ref1]: https://wetten.overheid.nl/BWBR0001876
      [ref2]: https://wetten.overheid.nl/BWBR0004045
