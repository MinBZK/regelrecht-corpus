  - number: '9'
    text: |-
      1 De tegemoetkoming in de in [artikel 8, eerste lid][ref1], bedoelde kosten wordt vastgesteld op het bedrag van
      de overeenkomstig het tweede lid van dat artikel vastgestelde verplaatsingskosten, verminderd met 70 pct. van
      de gemiddelde jaarlijkse winst in de vijf boekjaren voorafgaande aan het boekjaar waarin met de uitvoering van
      maatregelen tot verplaatsing is begonnen. Bedraagt het aantal boekjaren waarin het bedrijf werd uitgeoefend minder
      dan vijf, dan wordt aan de ontbrekende jaren een door schatting te bepalen winstbedrag toegerekend. Indien ten
      tijde van de goedkeuring van de verplaatsing van een bedrijf het promessendisconto van De Nederlandsche Bank hoger
      of lager is dan 4 pct. wordt voor elke 1/4 pct. waarmede dit disconto de 4 pct. over- of onderschrijdt het in de
      eerste volzin genoemde percentage van 70 verminderd dan wel vermeerderd met 1/2. Indien de belanghebbende voor
      de financiering van het ingevolge dit lid voor zijn rekening komende deel van de kosten van verplaatsing van het
      bedrijf een lening aangaat, worden de daaraan verbonden afsluitkosten bij de berekening van de tegemoetkoming mede
      in aanmerking genomen. Onze Minister van Financiën kan aan de belanghebbende ten aanzien van de in de vorige volzin
      bedoelde financiering faciliteiten verlenen.

      2 De tegemoetkoming die bij verplaatsing van een bedrijf op grond van de [artikelen 8][ref2], [9][ref3] en
      [11][ref4] aan de belanghebbende wordt toegekend, wordt niet hoger gesteld dan het bedrag van de tegemoetkoming
      waarop hij aanspraak zou kunnen maken bij beëindiging van het bedrijf. Onze Minister kan hiervan afwijken, indien
      naar zijn oordeel door de verplaatsing van het bedrijf ook schade voor anderen wordt voorkomen of beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel8
