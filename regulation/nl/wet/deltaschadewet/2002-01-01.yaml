  - number: '4'
    text: |-
      Een tegemoetkoming wordt niet verleend voorzover de belanghebbende aanspraken op een tegemoetkoming in schade aan
      andere regelingen van welke aard ook kan of heeft kunnen ontlenen.
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel4
  - number: '5'
    text: |-
      Voor de toepassing van deze wet wordt een onderdeel van een onderneming van een belanghebbende, dat naar
      bedrijfseconomische maatstaven een zelfstandige eenheid vormt, aangemerkt als een afzonderlijk bedrijf.
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel5
  - number: '6'
    text: |-
      1 Indien een belanghebbende ter voorkoming of beperking van schade werken of maatregelen tot stand wenst te brengen
      die noodzakelijk zijn ter aanpassing van zijn bedrijf aan de nieuwe omstandigheden na de totstandkoming van een
      afsluitingswerk komen, onverminderd het bepaalde in [artikel 11][ref1], voor verlening van een tegemoetkoming in
      aanmerking:

      a. de kosten van aan derden opgedragen onderzoekingen inzake de noodzaak, de mogelijkheid en de wijze van
      aanpassing van het bedrijf;

      b. de kosten van uitvoering van tot stand gebrachte werken of maatregelen tot aanpassing van het bedrijf;

      c. de kosten van voorbereiding en toezicht op de uitvoering van werken of maatregelen als bedoeld onder *b,*
      voorzover deze werkzaamheden zijn opgedragen aan derden.

      2 Onder de in het eerste lid onder *b* bedoelde kosten worden verstaan de voor de aanpassing van het bedrijf
      noodzakelijke kosten, verminderd met een aftrek voor:

        - vervanging van oud door nieuw;
        - betere of andere exploitatiemogelijkheden, die door de werken of maatregelen tot aanpassing van het bedrijf
      alsmede door de voorzieningen, bedoeld in [artikel 3, eerste lid][ref2], voor het bedrijf ontstaan;
        - de waarde van de door aanpassing van het bedrijf vrijkomende zaken.

      Onze Minister kan voor de uitvoering van dit lid nadere regelen stellen.

      3 De in het eerste lid onder *a* bedoelde onderzoekingen alsmede de plannen voor de tot stand te brengen werken
      of maatregelen met inbegrip van de raming van kosten behoeven de goedkeuring van Onze Minister. Deze overweegt
      daarbij of het verrichten van de onderzoekingen noodzakelijk is en of de tot stand te brengen werken of maatregelen
      economisch verantwoord zijn, alsmede welke de gevolgen zouden zijn van het achterwege blijven van deze werken of
      maatregelen.

      4 Indien onderzoekingen en werken of maatregelen zijn uitgevoerd voor de inwerkingtreding van deze wet dan wel
      zonder de in het derde lid bedoelde goedkeuring van Onze Minister, bepaalt deze of en in hoeverre de kosten daarvan
      voor een tegemoetkoming in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002748#Artikel3
    url: https://wetten.overheid.nl/BWBR0002748/2002-01-01#Artikel6
