  - number: '7'
    text: |-
      1 De tegemoetkoming in de in [artikel 6, eerste lid][ref1], bedoelde kosten wordt vastgesteld op het totale bedrag
      van deze kosten, berekend overeenkomstig het tweede lid van dat artikel, verminderd met 70 pct. van de gemiddelde
      jaarlijkse winst in de vijf boekjaren voorafgaande aan het boekjaar waarin met de uitvoering van de werken of
      het treffen van maatregelen tot aanpassing van het bedrijf is begonnen. Bedraagt het aantal boekjaren waarin
      het bedrijf werd uitgeoefend minder dan vijf, dan wordt aan de ontbrekende jaren een door schatting te bepalen
      winstbedrag toegerekend. Indien ten tijde van de goedkeuring van plannen voor werken of maatregelen ter aanpassing
      van een bedrijf het promessendisconto van De Nederlandsche Bank hoger of lager is dan 4 pct. wordt voor elke 1/4
      pct. waarmede dit disconto de 4 pct. over- of onderschrijdt het in de eerste volzin genoemde percentage van 70
      verminderd dan wel vermeerderd met 1/2. Indien de belanghebbende voor de financiering van het ingevolge dit lid
      voor zijn rekening komende deel van de kosten van werken of maatregelen ter aanpassing van het bedrijf een lening
      aangaat, worden de daaraan verbonden afsluitkosten bij de berekening van de tegemoetkoming mede in aanmerking
      genomen. Onze Minister van Financiën kan aan de belanghebbende ten aanzien van de in de vorige volzin bedoelde
      financiering faciliteiten verlenen.

      2 Indien onderzoekingen hebben plaats gevonden als bedoeld in [artikel 6, eerste lid, onder ][ref2] en op grond
      van de uitslag van die onderzoekingen of wegens nadien gewijzigde omstandigheden met instemming van Onze Minister
      geen werken of maatregelen tot aanpassing van het bedrijf tot stand worden gebracht, worden de kosten van die
      onderzoekingen volledig vergoed, zulks met inachtneming van het bepaalde in [artikel 6, derde en vierde lid][ref3].

      3 De tegemoetkoming die bij aanpassing van een bedrijf op grond van de [artikelen 6][ref4], [7][ref5] en
      [11][ref6] aan de belanghebbende wordt toegekend, wordt niet hoger gesteld dan het bedrag van de tegemoetkoming
      waarop hij aanspraak zou kunnen maken, indien deze werken of maatregelen niet mogelijk zouden zijn geweest. Onze
      Minister kan hiervan afwijken, indien naar zijn oordeel door de aanpassing van het bedrijf ook schade voor anderen
      wordt voorkomen of beperkt.

      4 Indien aanpassing van een bedrijf aan de nieuwe omstandigheden na de totstandkoming van een afsluitingswerk
      kan worden verkregen door aanpassing van de bestaande outillage, doch de belanghebbende de voorkeur geeft aan het
      treffen van andere maatregelen waardoor de schade eveneens op bevredigende wijze kan worden ondervangen, kan Onze
      Minister bepalen dat terzake van deze maatregelen een tegemoetkoming wordt verleend. Deze tegemoetkoming wordt
      nimmer hoger gesteld dan het bedrag van de tegemoetkoming waarop de belanghebbende aanspraak zou kunnen maken bij
      aanpassing van de bestaande outillage van het bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002748#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002748#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0002748#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0002748#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0002748#Artikel11
