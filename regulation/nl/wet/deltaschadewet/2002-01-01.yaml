      - id: ref2
        bwb_id: BWBR0002748
        artikel: '13'
        hoofdstuk: II
        paragraaf: '4'
  - number: '15'
    text: |-
      1 In gevallen, waarin de winst in de voorafgaande boekjaren, bedoeld in de [artikelen 11][ref1] en [14][ref2],
      buiten de wil van belanghebbende door bijzondere persoonlijke omstandigheden ongunstig is beïnvloed en toepassing
      van die artikelen tot onbillijkheid zou leiden, kan aan de berekening van de tegemoetkoming een hogere winst dan
      uit deze artikelen volgt ten grondslag worden gelegd.

      2 Indien bij de berekening van de gemiddelde jaarlijkse winst in de vijf boekjaren, bedoeld in de
      [artikelen 7, eerste lid][ref3], en [9, eerste lid][ref4], het laatste boekjaar voorafgaande aan het boekjaar
      waarin met de uitvoering van werken of maatregelen tot aanpassing of verplaatsing van het bedrijf is begonnen, nog
      niet is afgesloten, kan Onze Minister bepalen dat de gemiddelde jaarlijkse winst wordt vastgesteld over de vijf aan
      dat laatste boekjaar voorafgaande boekjaren.

      3 Voor landbouwbedrijven kan de gemiddelde winst in de vijf boekjaren, bedoeld in de
      [artikelen 7, eerste lid][ref5], [9, eerste lid][ref6], [11, eerste lid][ref7], en [14, eerste lid][ref8], worden
      bepaald aan de hand van een schatting van de netto opbrengst per hectare van de bij deze bedrijven in gebruik
      zijnde cultuurgrond.

      4 Indien de belanghebbende meer dan een maal schade lijdt, doordat afsluitingswerken achtereenvolgens tot stand
      komen, zal het aandeel dat de belanghebbende in de schade zelf moet dragen, nimmer meer bedragen dan het aandeel
      dat hij zou hebben moeten dragen indien de schade zich in één maal zou hebben voorgedaan. Voor de toepassing van
      het bepaalde in dit lid kunnen bij algemene maatregel van bestuur regelen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002748#Artikel14
