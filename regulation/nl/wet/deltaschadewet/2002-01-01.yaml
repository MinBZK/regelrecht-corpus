  - number: '3'
    text: |-
      1 Door en op kosten van het Rijk kunnen ter tegemoetkoming in schade ten behoeve van belanghebbenden of groepen van
      belanghebbenden voorzieningen worden getroffen.

      2 Belanghebbenden wordt op grond van de [hoofdstukken II][ref1] en [III][ref2] van deze wet een tegemoetkoming
      verleend voorzover door het totstandbrengen van voorzieningen als bedoeld in het eerste lid schade niet kan worden
      voorkomen.

      3 Volgens bij of krachtens algemene maatregel van bestuur te stellen regelen kunnen belanghebbenden als bedoeld in
      [artikel 2, eerste lid, onder ][ref3] die in verband met de door hen geleden schade van beroep willen veranderen
      dan wel van woonplaats moeten veranderen, teneinde de wederinschakeling in het arbeidsproces - al dan niet in het
      oude beroep - mogelijk te maken, tevens in aanmerking worden gebracht voor faciliteiten op het gebied van opleiding
      en migratie.

      4 Volgens bij of krachtens algemene maatregel van bestuur te stellen regelen kunnen belanghebbenden als bedoeld
      in [artikel 2, eerste lid, onder ][ref4] alsmede degenen die in een door hen geëxploiteerd bedrijf werkzaam zijn,
      indien zij van woonplaats moeten veranderen tengevolge van verplaatsing van het bedrijf, in aanmerking worden
      gebracht voor een tegemoetkoming in de kosten van migratie.


      [ref1]: https://wetten.overheid.nl/BWBR0002748#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0002748#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0002748#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0002748#Artikel2
