preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de mogelijkheden tot identificatie van verzekerden
    in de zin van de Ziekenfondswet te vereenvoudigen door het gebruik van het sociaal-fiscaal nummer in de
    verzekerdenadministratie van die sociale ziektekostenverzekering in te voeren, alsmede enige andere wijzigingen in
    die wet aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007771/1996-04-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      De verzekerden ingevolge de [Ziekenfondswet][ref1] die op het tijdstip van inwerkingtreding van
      [artikel I, onderdeel G][ref2], van deze wet zijn ingeschreven bij een ziekenfonds, delen uiterlijk binnen
      een maand nadat het ziekenfonds hen schriftelijk daarom heeft verzocht hun sociaal-fiscaal nummer mee aan dat
      ziekenfonds.

      Het vorenbedoeld verzoek wordt gedaan binnen twee maanden na het tijdstip waarop vorenbedoeld artikel in werking
      is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
      [ref2]: https://wetten.overheid.nl/BWBR0007771#ArtikelI
    url: https://wetten.overheid.nl/BWBR0007771/1996-04-01#ArtikelIII
