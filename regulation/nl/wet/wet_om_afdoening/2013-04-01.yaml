  - number: XII
    text: |-
      [Artikel 3.14, eerste lid, onderdeel e, van de Wet inkomstenbelasting 2001][ref1] alsmede
      [artikel 15b, eerste lid, onderdeel o, van de Wet op de loonbelasting 1964][ref2], zoals zij luidden voor het in
      werking treden van de [artikelen VIII][ref3] en [IX][ref4] van deze wet, blijven van toepassing in gevallen waarin
      vergoedingen zijn verstrekt ter zake van het voldoen aan gestelde voorwaarden ter voorkoming van strafvervolging
      in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.14
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel15b
