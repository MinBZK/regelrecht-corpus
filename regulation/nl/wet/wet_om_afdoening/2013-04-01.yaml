  - number: XV
    text: |-
      In de gevallen waarin de wet bepaalt dat een bestuursorgaan geen bestuurlijke boete oplegt indien voor hetzelfde
      feit het recht tot strafvordering is vervallen doordat is voldaan aan de voorwaarden die krachtens een wettelijk
      voorschrift zijn gesteld ter voorkoming van strafvervolging, legt dit bestuursorgaan tevens geen bestuurlijke boete
      op indien ter zake van dat feit een strafbeschikking is uitgevaardigd.
    url: https://wetten.overheid.nl/BWBR0020074/2013-04-01#ArtikelXV
  - number: XXIa
    text: |-
      Onze Minister van Justitie zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0020074/2013-04-01#ArtikelXXIa
  - number: XXII
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020074/2013-04-01#ArtikelXXII
  - number: XXIII
    text: 'Deze wet wordt aangehaald als: Wet OM-afdoening.'
    url: https://wetten.overheid.nl/BWBR0020074/2013-04-01#ArtikelXXIII
