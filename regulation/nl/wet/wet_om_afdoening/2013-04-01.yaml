preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het wettelijk kader voor buitengerechtelijke afdoening
    van strafzaken aan te passen en de mogelijkheden te verruimen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020074/2013-04-01#ArtikelAanhef
articles:
  - number: XI
    text: |-
      In strafzaken waarin voor het in werking treden van [artikel II, onderdelen O tot en met R][ref1],
      [artikel III][ref2], [artikel IV][ref3] en [artikel VI][ref4] van deze wet voorwaarden ter voorkoming van
      strafvervolging zijn gesteld overeenkomstig de [artikelen 74][ref5] en [74c van het Wetboek van Strafrecht][ref6],
      de [artikelen 36][ref7] en [37 van de Wet op de economische delicten][ref8],
      [artikel 76 van de Algemene wet inzake rijksbelastingen][ref9] dan wel [artikel 85 van de Waterschapswet][ref10],
      blijven de artikelen die door deze wet gewijzigd worden of vervallen van toepassing zoals zij luidden voor het in
      werking treden van het desbetreffende onderdeel van deze wet.


