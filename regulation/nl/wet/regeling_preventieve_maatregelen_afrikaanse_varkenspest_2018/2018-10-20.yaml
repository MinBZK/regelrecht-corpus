preamble:
  text: |-
    Gelet op de artikelen 17 en 32 van de Gezondheids- en welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0041456/2018-10-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In afwijking van [artikel 3.33, eerste lid, van de Wet natuurbescherming][ref1] is het degenen die wilde
      zwijnen doden op grond van een vrijstelling of ontheffing als bedoeld in [artikel 3.10, tweede lid][ref2],
      in samenhang met [artikel 3.8, eerste of tweede lid][ref3], een ontheffing als bedoeld in
      [artikel 3.17, eerste lid, aanhef][ref4] in samenhang met onderdeel c, of een opdracht als bedoeld in
      [artikel 3.18, eerste lid, van de Wet natuurbescherming][ref5], toegestaan daarbij tussen zonsopgang en
      zonsondergang een methode toe te passen waarbij hoogstens zes personen, in aanwezigheid van ten hoogste
      drie aangelijnde honden, voor wilde zwijnen hoorbaar in het gebied aanwezig zijn zonder deze opzettelijk te
      verontrusten, met het oogmerk om deze dieren binnen het schootsveld van hoogstens zes geweerdragers te bewegen,
      opdat zij deze dieren kunnen doden.

      2 Het eerste lid is alleen van toepassing in het grondgebied van de provincies:

      a. Gelderland, met uitzondering van het gebied, aangeduid op kaart 1 in de bijlage;

      b. Limburg, met uitzondering van de gebieden, aangeduid op kaart 2 in de bijlage;

      c. Noord-Brabant, en

      d. Overijssel.


