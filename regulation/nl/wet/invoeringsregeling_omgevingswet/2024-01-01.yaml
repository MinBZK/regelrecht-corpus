preamble:
  text: |-
    Gelet op de richtlijn gevaarlijke stoffen in de lucht, de richtlijn luchtkwaliteit, de richtlijn omgevingslawaai,
    de richtlijn storten afvalstoffen, de richtlijn winningsafval en het werelderfgoedverdrag;

    Gelet op het Arbeidsomstandighedenbesluit, het Besluit detectie radioactief besmet schroot, het Besluit genetisch
    gemodificeerde organismen milieubeheer 2013, het Besluit investeringsplan en kwaliteit elektriciteit en gas, het
    Besluit kerninstallaties, splijtstoffen en ertsen, het Besluit kostenverevening reductie C02-emissies glastuinbouw,
    het Besluit kwaliteit gastouderbureaus, gastouders en voorzieningen voor gastouderopvang, de artikelen 8.47,
    vijfde lid, 8.48, vijfde lid, 8.53, vijfde lid, 8.55, vijfde lid, 8.56, tweede lid, 8.57, derde lid, 8.57a,
