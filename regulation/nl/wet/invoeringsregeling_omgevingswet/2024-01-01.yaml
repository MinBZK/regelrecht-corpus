preamble:
  text: |-
    Gelet op de richtlijn gevaarlijke stoffen in de lucht, de richtlijn luchtkwaliteit, de richtlijn omgevingslawaai,
    de richtlijn storten afvalstoffen, de richtlijn winningsafval en het werelderfgoedverdrag;

    Gelet op het Arbeidsomstandighedenbesluit, het Besluit detectie radioactief besmet schroot, het Besluit genetisch
    gemodificeerde organismen milieubeheer 2013, het Besluit investeringsplan en kwaliteit elektriciteit en gas, het
    Besluit kerninstallaties, splijtstoffen en ertsen, het Besluit kostenverevening reductie C02-emissies glastuinbouw,
    het Besluit kwaliteit gastouderbureaus, gastouders en voorzieningen voor gastouderopvang, de artikelen 8.47,
    vijfde lid, 8.48, vijfde lid, 8.53, vijfde lid, 8.55, vijfde lid, 8.56, tweede lid, 8.57, derde lid, 8.57a,
    vierde lid, 8.57b, vierde lid, 8.59, tweede lid, 8.62c, vijfde lid, 8.62h, derde lid, 8.62i, derde lid, 8.62l,
    vierde lid, 8.66, derde lid, en 8.68, derde lid, van het Besluit kwaliteit leefomgeving, het Besluit melden
    bedrijfsafvalstoffen en gevaarlijke afvalstoffen, het Besluit politiegegevens, het Besluit stimulering duurzame
    energieproductie, het Besluit stortplaatsen en stortverboden afvalstoffen, het Besluit toegelaten instellingen
    volkshuisvesting 2015, het Besluit vervoer gevaarlijke stoffen, het Besluit vervoer gevaarlijke stoffen door de
    lucht, het Drinkwaterbesluit, de Drinkwaterwet, de Erfgoedwet, het Inrichtingsbesluit WVO, het Inrichtingsbesluit
    WVO BES, de artikelen 5.37, onder b en c, en 6.1 van het Invoeringsbesluit Omgevingswet, de artikelen 2.17, onder
    k en l, 2.27, onder c, 2.45, onder n, en 3.1 van de Invoeringswet Omgevingswet, de Invorderingswet 1990, het
    Kaderbesluit nationale EZ-subsidies, het Kaderbesluit subsidies I en M, de Kaderwet subsidies I en M, de Kaderwet
