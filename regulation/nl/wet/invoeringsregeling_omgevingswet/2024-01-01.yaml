  - number: 4.1.10
    text: |-
      1 Als voor de inwerkingtreding van de [Omgevingswet][ref1] een ontwerp van een besluit tot
      het stellen van maatwerkvoorschriften als bedoeld in [artikel 6.15, eerste lid][ref2], of
      [6.17, derde lid, van de Waterregeling][ref3] ter inzage is gelegd op de voorbereiding waarvan
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] van toepassing is, blijft het oude recht van toepassing tot
      het besluit onherroepelijk wordt.

      2 Als voor de inwerkingtreding van de [Omgevingswet][ref5] voor een besluit tot het
      stellen van maatwerkvoorschriften als bedoeld in [artikel 6.15, eerste lid][ref6],
      of [6.17, derde lid, van de Waterregeling][ref7] toepassing is gegeven aan
      [artikel 4:8 van de Algemene wet bestuursrecht][ref8] of het besluit is bekendgemaakt, blijft het oude recht van
      toepassing tot het besluit onherroepelijk wordt.

      3 Een besluit tot het stellen van maatwerkvoorschriften dat onherroepelijk is, geldt als:

      a. een besluit tot het stellen van maatwerkvoorschriften als bedoeld in [artikel 6.7, eerste lid][ref9], of
      [7.7, eerste lid, van het Besluit activiteiten leefomgeving][ref10], voor zover die voorschriften gaan over een
      onderwerp waarvoor het bevoegd gezag maatwerkvoorschriften kan stellen als bedoeld in dat artikel; of

      b. een besluit tot het verbinden van voorschriften aan een omgevingsvergunning, voor zover die voorschriften
      gaan over een onderwerp waarover voorschriften aan een omgevingsvergunning als bedoeld in [hoofdstuk 6][ref11] of
      [7 van het Besluit activiteiten leefomgeving][ref12] kunnen worden verbonden.


