  - number: 4.1.7
    text: |-
      1 Als voor de inwerkingtreding van de [Omgevingswet][ref1] voor een besluit tot het stellen van
      maatwerkvoorschriften als bedoeld in [artikel 6, eerste lid, van de Regeling omgevingsregime hoofdspoorwegen][ref2]
      toepassing is gegeven aan [artikel 4:8 van de Algemene wet bestuursrecht][ref3] of het besluit is bekendgemaakt,
      blijft het oude recht van toepassing tot het besluit onherroepelijk wordt.

      2 Als voor de inwerkingtreding van de [Omgevingswet][ref4] een aanvraag om een besluit tot het stellen van
      maatwerkvoorschriften als bedoeld in [artikel 6, tweede lid, van de Regeling omgevingsregime hoofdspoorwegen][ref5]
      is ingediend, blijft het oude recht van toepassing tot het besluit onherroepelijk wordt.

      3 Een besluit tot het stellen van maatwerkvoorschriften dat onherroepelijk is, geldt als:

      a. een besluit tot het stellen van maatwerkvoorschriften als bedoeld in
      [artikel 9.10, eerste lid, van het Besluit activiteiten leefomgeving][ref6], voor zover die voorschriften gaan over
      een onderwerp waarvoor het bevoegd gezag maatwerkvoorschriften kan stellen als bedoeld in dat artikel; of

      b. een besluit tot het verbinden van voorschriften aan een omgevingsvergunning, voor zover die
      voorschriften gaan over een onderwerp waarover voorschriften aan een omgevingsvergunning als bedoeld in
      [hoofdstuk 9 van het Besluit activiteiten leefomgeving][ref7] kunnen worden verbonden.


