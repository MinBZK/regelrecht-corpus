  - number: '5.1'
    text: |-
      1 Na de inwerkingtreding van [hoofdstuk 1][ref1] van:

      a. deze regeling;

      b. de Aanvullingsregeling geluid Omgevingswet;

      c. de Aanvullingsregeling bodem Omgevingswet;

      d. de Aanvullingsregeling natuur Omgevingswet; en

      e. de Aanvullingsregeling grondeigendom Omgevingswet;

      kan de Minister van Binnenlandse Zaken en Koninkrijksrelaties de nummering van een of meer hoofdstukken,
      afdelingen, paragrafen en artikelen van de Omgevingsregeling opnieuw vaststellen.

      2 De Minister van Binnenlandse Zaken en Koninkrijksrelaties brengt in de Omgevingsregeling en in de overige
      hoofdstukken van de regelingen, genoemd in het eerste lid, onder a tot en met e, met de nieuwe nummering in
      overeenstemming:

      a. als toepassing is gegeven aan het eerste lid: de aanhaling van de hoofdstukken, afdelingen, paragrafen en
      artikelen van de Omgevingsregeling;

      b. als toepassing is gegeven aan [artikel 5.5, eerste lid, van de Invoeringswet Omgevingswet][ref2]: de aanhaling
      van de hoofdstukken, afdelingen, paragrafen en artikelen van de [Omgevingswet][ref3]; en

      c. als toepassing is gegeven aan artikel 9.4, eerste lid, van het Invoeringsbesluit Omgevingswet: de aanhaling
      van de hoofdstukken, afdelingen, paragrafen en artikelen van het [Besluit activiteiten leefomgeving][ref4],
      het [Besluit bouwwerken leefomgeving][ref5], het [Besluit kwaliteit leefomgeving][ref6] en het
      [Omgevingsbesluit][ref7].

      3 Als toepassing is gegeven aan:

      a. het eerste en tweede lid: wordt de vernummerde tekst van de Omgevingsregeling in de Staatscourant geplaatst; en

      b. het tweede lid: wordt de vernummerde tekst van de betrokken hoofdstukken van de regelingen, genoemd in het
      eerste lid, onder a tot en met e, in de Staatscourant geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0044722#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0043660#Artikel5.5
      [ref3]: https://wetten.overheid.nl/BWBR0037885
