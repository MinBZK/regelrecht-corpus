  - number: 5.1.3.a
    text: 'het eerste en tweede lid: wordt de vernummerde tekst van de Omgevingsregeling in de Staatscourant geplaatst; en'
    url: https://wetten.overheid.nl/BWBR0044722/2024-01-01#Artikel5.1
  - number: 5.1.3.b
    text: |-
      het tweede lid: wordt de vernummerde tekst van de betrokken hoofdstukken van de regelingen, genoemd in het eerste
      lid, onder a tot en met e, in de Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0044722/2024-01-01#Artikel5.1
  - number: 5.2.1
    text: |-
      Deze regeling treedt in werking op een bij ministerieel besluit te bepalen tijdstip dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld, met uitzondering van de wijziging van artikel
      18.1 van de Omgevingsregeling in [artikel 1.1][ref1], die in werking treedt met ingang van de dag na de datum van
      uitgifte van de Staatscourant waarin deze regeling wordt geplaatst.


