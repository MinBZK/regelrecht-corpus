  - number: VIb
    text: |-
      1 Dit artikel is van toepassing op inrichtingen als bedoeld in
      [artikel 16.25, tweede lid, onder a, van de Wet milieubeheer][ref1] waarvoor na 1 oktober 2004 een
      verzoek om toepassing van artikel 27 van de EG-richtlijn handel in broeikasgasemissierechten, bedoeld in
      [artikel 1.1, eerste lid, van die wet][ref2], wordt ingediend bij de Commissie van de Europese Gemeenschappen.

      2 Met betrekking tot de eerste planperiode, welke loopt van 1 januari 2005 tot en met 31 december 2007, geldt dat
      de toewijzing van broeikasgasemissierechten, bedoeld in [artikel 16.32, tweede lid, van de Wet milieubeheer][ref3],
      voor inrichtingen als bedoeld in [artikel 16.25, tweede lid, onder a, van die wet][ref4], kan plaatsvinden onder
      de voorwaarde dat de Commissie van de Europese Gemeenschappen ten aanzien van de betrokken inrichting op grond van
      artikel 27 van de in het eerste lid genoemde richtlijn, niet heeft bepaald dat die inrichting tijdelijk buiten de
      reikwijdte van die richtlijn blijft.

      3 In afwijking van [artikel 16.35, derde lid, van de Wet milieubeheer][ref5] geldt met betrekking tot
      de eerste planperiode, welke loopt van 1 januari 2005 tot en met 31 december 2007, dat de verlening van
      broeikasgasemissierechten, bedoeld in dat artikellid, in het tweede of derde jaar van die planperiode aan degene
      die een inrichting drijft waarvoor in het besluit, bedoeld in [artikel 16.32, tweede lid, van die wet][ref6]
      voor die planperiode met toepassing van het tweede lid voorwaardelijk broeikasgasemissierechten zijn toegewezen,
      wordt opgeschort met ingang van 1 maart 2006 onderscheidenlijk 1 maart 2007 voorzover op 28 februari 2006
      onderscheidenlijk 28 februari 2007 de beslissing van de Commissie van de Europese Gemeenschappen op dat verzoek
      nog niet is bekendgemaakt in het Publicatieblad van de Europese Unie. De verlening wordt opgeschort tot en met de
      dag waarop sedert de bekendmaking in het Publicatieblad van de Europese Unie van de beslissing op het verzoek twee
      weken zijn verstreken. Dit lid is uitsluitend van toepassing op de eerste verlening van broeikasgasemissierechten
      binnen de planperiode, bedoeld in de eerste volzin, aan degene die een inrichting als bedoeld in die volzin drijft.

      4 In afwijking van [artikel 16.35, derde lid, van de Wet milieubeheer][ref7] worden broeikasgasemissierechten die
      met toepassing van het tweede lid voorwaardelijk zijn toegewezen, uitsluitend verleend voorzover de Commissie van
      de Europese Gemeenschappen het verzoek om toepassing van artikel 27 van de in het eerste lid genoemde richtlijn ten
      aanzien van de betrokken inrichting heeft afgewezen.


