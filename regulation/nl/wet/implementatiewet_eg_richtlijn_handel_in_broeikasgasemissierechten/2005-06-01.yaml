  - number: VIII
    text: |-
      1 Indien [artikel I, onderdeel B][ref1], en de [artikelen 2.1][ref2], [2.3 tot en met 2.16][ref3] en [2.16c][ref4]
      in [onderdeel C van artikel I][ref5] van het onderhavige wetsvoorstel, nadat dat tot wet is verheven, later
      in werking treden dan het tijdstip waarop [artikel I, onderdeel E][ref6], van dit wetvoorstel, nadat dat
      tot wet is verheven, in werking treedt, geldt tot het tijdstip van inwerkingtreding van onderdeel B en de
      [artikelen 2.1][ref7], [2.3 tot en met 2.16][ref8] en [2.16c][ref9] in [onderdeel C van artikel I][ref10] van dit
      wetsvoorstel het volgende:

      a. in de [Wet milieubeheer][ref11] en de daarop gebaseerde regelingen wordt in plaats van «emissieautoriteit»
      telkens gelezen: emissieautoriteit in oprichting, en in plaats van «het bestuur van de emissieautoriteit» telkens:
      de directeur van de emissieautoriteit in oprichting;

      b. de emissieautoriteit in oprichting, onderscheidenlijk de directeur van de emissieautoriteit in oprichting,
      zijn bij de uitvoering van de taken en de uitoefening van de bevoegdheden die aan de emissieautoriteit,
      onderscheidenlijk aan het bestuur van de emissieautoriteit, bij of krachtens de [Wet milieubeheer][ref12] zijn
      opgedragen, werkzaam onder verantwoordelijkheid van de Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer.

      2 In het geval, bedoeld in het eerste lid, worden de taken en bevoegdheden, bedoeld in het eerste lid, onder
      b, die zijn uitgevoerd onderscheidenlijk uitgeoefend door de emissieautoriteit in oprichting onderscheidenlijk
      de directeur van de emissieautoriteit in oprichting, met ingang van het tijdstip van inwerkingtreding van
      [artikel I, onderdeel B][ref13], en de [artikelen 2.1][ref14], [2.3 tot en met 2.16][ref15] en [2.16c][ref16] in
      [onderdeel C van artikel I][ref17] van het onderhavige wetsvoorstel, nadat dat tot wet is verheven, aangemerkt als
      taken onderscheidenlijk bevoegdheden die zijn uitgevoerd onderscheidenlijk uitgeoefend door de emissieautoriteit
      onderscheidenlijk het bestuur van de emissieautoriteit.


