  - number: V
    text: |-
      Met betrekking tot de voorbereiding van een nationaal toewijzingsbesluit als bedoeld in
      [artikel 16.29, eerste lid, van de Wet milieubeheer][ref1], voorzover dat besluit betrekking heeft op de eerste
      planperiode, welke loopt van 1 januari 2005 tot en met 31 december 2007, geldt het volgende:

      1. In afwijking van [artikel 3:16, eerste lid, van de Algemene wet bestuursrecht][ref2] bedraagt de termijn voor
      het naar voren brengen van zienswijzen vier weken.

      2. In afwijking van [artikel 16.30, derde lid, van de Wet milieubeheer][ref3] nemen Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en Onze Minister van Economische Zaken het besluit uiterlijk
      tien weken na de terinzagelegging van het ontwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16.29
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel316
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16.30
