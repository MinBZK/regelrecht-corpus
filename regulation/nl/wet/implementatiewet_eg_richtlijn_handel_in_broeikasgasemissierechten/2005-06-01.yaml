preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is ter implementatie van richtlijn nr. 2003/87/EG van
    het Europees Parlement en de Raad van de Europese Unie van 13 oktober 2003 tot vaststelling van een regeling voor
    de handel in broeikasgasemissierechten binnen de Gemeenschap en tot wijziging van Richtlijn 96/61/EG van de Raad
    (PbEU L 275) in de Wet milieubeheer een regeling te treffen die handel in emissierechten mogelijk maakt, dat de
    verordening inzake een gestandaardiseerd en beveiligd stelsel van registers als bedoeld in artikel 19, derde lid,
    van genoemde richtlijn, nadat deze verordening door de Commissie van de Europese Gemeenschappen is vastgesteld
    en in werking is getreden, moet worden uitgevoerd, en dat het wenselijk is in verband hiermee een zelfstandig
    bestuursorgaan, genaamd Nederlandse emissieautoriteit, in te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017265/2005-06-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      Het nationale toewijzingsplan dat ter uitvoering van artikel 9 van de EG-richtlijn handel in
      broeikasgasemissierechten is vastgesteld voor het tijdstip van inwerkingtreding van deze wet met betrekking tot de
      eerste planperiode, welke loopt van 1 januari 2005 tot en met 31 december 2007, wordt aangemerkt als een nationaal
      toewijzingsplan als bedoeld in [artikel 16.25, eerste lid, van de Wet milieubeheer][ref1] dat is vastgesteld
      overeenkomstig het daaromtrent bepaalde bij of krachtens [hoofdstuk 16 van de Wet milieubeheer][ref2] en geldt met
      terugwerkende kracht met ingang van de dag, bedoeld in [artikel 16.28 van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16.25
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk16
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16.28
    url: https://wetten.overheid.nl/BWBR0017265/2005-06-01#ArtikelIV
