  - number: VII
    text: |-
      [Artikel 16.35, tweede lid, van de Wet milieubeheer][ref1] is niet van toepassing op broeikasgasemissierechten die:

      a. zijn ingeleverd ter voldoening aan het bepaalde bij [artikel 16.37, eerste lid][ref2], met betrekking tot de
      eerste planperiode, welke loopt van 1 januari 2005 tot en met 31 december 2007, en

      b. door het bestuur van de emissieautoriteit zijn ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16.35
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16.37
