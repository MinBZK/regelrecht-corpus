  - number: XII
    text: |-
      1 Indien een aanvraag om een vergunning als bedoeld in [artikel 16.5, eerste lid, van de Wet milieubeheer][ref1]
      wordt ingediend vóór de inwerkingtreding van deze wet, wordt die aanvraag aangemerkt als een aanvraag om een
      vergunning als bedoeld in [artikel 16.5, eerste lid, van de Wet milieubeheer][ref2], zoals dat artikel komt te
      luiden na de inwerkingtreding van deze wet.

      2 Indien de voorbereiding als bedoeld in [artikel 16.7 van de Wet milieubeheer][ref3] heeft plaatsgevonden
      vóór de inwerkingtreding van deze wet, wordt die voorbereiding aangemerkt als een voorbereiding als bedoeld in
      [artikel 16.7 van de Wet milieubeheer][ref4], zoals dat artikel komt te luiden na de inwerkingtreding van deze wet.


