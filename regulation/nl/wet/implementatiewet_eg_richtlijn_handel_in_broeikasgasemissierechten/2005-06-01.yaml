  - number: VI
    text: |-
      Met betrekking tot de eerste planperiode, welke loopt van 1 januari 2005 tot en met 31 december 2007,
      geldt, in afwijking van [artikel 16.32, tweede lid, van de Wet milieubeheer][ref1], dat de toewijzing van
      broeikasgasemissierechten voor inrichtingen als bedoeld in [artikel 16.25, tweede lid, onder a, van die wet][ref2]
      gedeeltelijk kan plaatsvinden in het nationale toewijzingsbesluit, bedoeld in
      [artikel 16.29, eerste lid, van die wet][ref3], dat op bedoelde periode betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16.32
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel16.25
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel16.29
