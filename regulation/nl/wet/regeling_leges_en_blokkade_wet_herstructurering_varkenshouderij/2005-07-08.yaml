  - number: '7'
    text: |-
      1 Een aanmelding als bedoeld in [artikel 5, eerste lid][ref1], en [6, eerste lid][ref2], wordt eerst in aanmerking
      genomen nadat de hypotheekhouder een bedrag van € 27,23 heeft voldaan aan de Dienst Regelingen.

      2 Het bedrag, bedoeld in het eerste lid, geldt per aanmelding en per bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0009801#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009801#Artikel6
    url: https://wetten.overheid.nl/BWBR0009801/2005-07-08#Artikel7
