        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      1 Alvorens de Dienst Regelingen een kennisgeving in behandeling neemt, doet het van deze kennisgeving schriftelijk
      mededeling aan iedere hypotheekhouder die het bedrijf waarvandaan het varkensrecht, of een gedeelte daarvan,
      overgaat heeft aangemeld overeenkomstig [artikel 5][ref1]. De Dienst Regelingen neemt de kennisgeving niet in
      behandeling gedurende dertig dagen na dagtekening van deze mededeling.

      2 De termijn van dertig dagen wordt verlengd tot negentig dagen na dagtekening van de mededeling, indien een
      hypotheekhouder binnen de termijn van dertig dagen een verzoek daartoe bij de Dienst Regelingen indient.

      3 De termijn van negentig dagen wordt eenmalig met negentig dagen verlengd indien de hypotheekhouder die het in het
      tweede lid bedoelde verzoek heeft gedaan, een verzoek daartoe bij de Dienst Regelingen indient onder gelijktijdige
      overlegging van:

        - een rechterlijke uitspraak waaruit blijkt dat degene op wiens bedrijf de aanmelding betrekking heeft, de
      desbetreffende overgang geen doorgang kan laten vinden, of
        - een schriftelijke verklaring van een notaris, waarin deze stelt dat hij van de hypotheekhouder op grond van
      [artikel 3:268, eerste lid, van het Burgerlijk Wetboek][ref2] de opdracht heeft ontvangen om het desbetreffende
      registergoed, of in voorkomend geval de desbetreffende registergoederen in het openbaar te verkopen.

      4 Na afloop van de overeenkomstig het derde lid verlengde termijn wordt de kennisgeving onherroepelijk door de
      Dienst Regelingen in behandeling genomen.

      5 In afwijking van het eerste lid, onderscheidenlijk het tweede tot en met het vierde lid, wordt de kennisgeving
      door de Dienst Regelingen in behandeling genomen voordat de termijn van dertig dagen, onderscheidenlijk
      de verlengde termijn is verstreken, zodra het van elke hypotheekhouder die het bedrijf heeft aangemeld,
      onderscheidenlijk elke hypotheekhouder die om verlenging van de desbetreffende termijn heeft verzocht, een
      verklaring heeft ontvangen waaruit blijkt dat tegen inbehandelingneming geen bezwaar bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009801#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel268
    url: https://wetten.overheid.nl/BWBR0009801/2005-07-08#Artikel4
