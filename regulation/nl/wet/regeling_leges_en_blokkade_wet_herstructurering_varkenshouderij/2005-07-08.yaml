        artikel: '20'
  - number: '2'
    text: |-
      Een kennisgeving wordt eerst in behandeling genomen nadat degene naar wiens bedrijf het varkensrecht, of een
      gedeelte daarvan, moet overgaan, onderscheidenlijk indien het een bedrijfsoverdracht betreft, de verkrijger van het
      bedrijf een bedrag van € 181,51 heeft voldaan aan de Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0009801/2005-07-08#Artikel2
  - number: '3'
    text: |-
      Indien de Dienst Regelingen op grond van artikel 19, eerste lid, onderscheidenlijk artikel 20, derde lid,
      juncto [artikel 19, eerste lid, van de wet][ref1] niet tot registratie overgaat, wordt het bedrag, bedoeld in
      [artikel 2][ref2], aan de betaler gerestitueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0009801#Artikel2
    url: https://wetten.overheid.nl/BWBR0009801/2005-07-08#Artikel3
    references:
      - id: ref1
