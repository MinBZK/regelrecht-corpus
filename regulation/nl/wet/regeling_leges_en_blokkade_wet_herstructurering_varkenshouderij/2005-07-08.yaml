        artikel: '4'
        paragraaf: '3'
  - number: '10'
    text: |-
      1 De verzoeken, bedoeld in de [artikelen 4, tweede en derde lid][ref1], de verklaring, bedoeld in
      [artikel 4, vijfde lid][ref2], de mededeling, bedoeld in [artikel 5, tweede lid][ref3], de verklaring, bedoeld
      in [artikel 6, tweede lid][ref4], de intrekking, bedoeld in [artikel 6, derde lid][ref5], het verzoek, bedoeld in
      [artikel 6, vierde lid][ref6], het verzoek, bedoeld in [artikel 8, tweede lid][ref7], en de verklaring, bedoeld
      in [artikel 9][ref8], worden gedaan door indiening bij de Dienst Regelingen van een door de minister vastgesteld
      formulier, dat volledig en naar waarheid is ingevuld, ondertekend en gedagtekend.

      2 De formulieren, bedoeld in het eerste lid, worden eerst in aanmerking genomen vanaf het moment dat zij door de
      Dienst Regelingen zijn ontvangen.


