  - number: '8'
    text: |-
      1 Aan de hypotheekhouder die een aanmelding heeft gedaan, kunnen ter zake van het bedrijf waarop de aanmelding
      betrekking heeft, door de Dienst Regelingen de volgende gegevens worden verstrekt:

        - gegevens over het geregistreerde varkensrecht;
        - gegevens over het varkensrecht waarop de kennisgeving betrekking heeft;
        - de dagtekening van de mededeling, bedoeld in [artikel 6, eerste lid][ref1];
        - de naam en het adres van andere hypotheekhouders die het bedrijf hebben aangemeld;
        - de indiening of het achterwege blijven van de verklaring, bedoeld in [artikel 6, tweede lid][ref2];
        - gegevens over de overdracht van het gehele bedrijf en het mestnummer waaronder het bedrijf na de overdracht is
      geregistreerd.

      2 Aan degene die daartoe een verzoek bij de Dienst Regelingen heeft ingediend en ten genoegen van de Dienst
      Regelingen aannemelijk heeft gemaakt dat hij een hypotheek-recht heeft gevestigd op een registergoed van een
      bedrijf, wordt mededeling gedaan van de op enig moment na indiening van het verzoek plaatsvindende splitsing van
      dat bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0009801#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009801#Artikel6
    url: https://wetten.overheid.nl/BWBR0009801/2005-07-08#Artikel8
