preamble:
  text: |-
    Gelet op de artikelen 22, tweede en derde lid, en 23 van de Wet herstructurering varkenshouderij;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009801/2005-07-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:



              a
               wet:

                [Wet herstructurering varkenshouderij][ref1];



              b
               minister:

                Minister van Landbouw, Natuur en Voedselkwaliteit;



              c
               kennisgeving:

                kennisgeving van de overgang van een varkensrecht, of een gedeelte daarvan, als bedoeld in
      [artikel 18, eerste lid, van de wet][ref2];



              d
               hypotheekhouder:

                degene ten gunste van wie een recht van hypotheek is gevestigd op een registergoed van een bedrijf
      waarvandaan het varkensrecht, of een gedeelte daarvan, moet overgaan.




      2 Voor de toepassing van [paragraaf 2][ref3] wordt onder ‘kennisgeving’ mede verstaan kennisgeving van overgang van
      het varkensrecht als bedoeld in [artikel 20, eerste lid, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009542
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0009801#Paragraaf2
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel20
    url: https://wetten.overheid.nl/BWBR0009801/2005-07-08#Artikel1
