  - number: '9'
    text: |-
      Indien een hypotheekhouder een bedrijf overeenkomstig
      [artikel 2 van de Regeling blokkade verplaatsing mestproductie][ref1] heeft aangemeld, dan geldt deze aanmelding
      tevens als aanmelding als bedoeld in [artikel 4][ref2], tenzij de hypotheekhouder binnen negentig dagen na
      inwerkingtreding van de wet door middel van een daartoe vastgesteld formulier aan de Dienst Regelingen verklaart
      niet in aanmerking te willen komen voor overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006343#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009801#Artikel4
    url: https://wetten.overheid.nl/BWBR0009801/2005-07-08#Artikel9
