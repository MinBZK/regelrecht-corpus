  - number: '6'
    text: |-
      1 Het subsidieplafond voor subsidies op grond van [hoofdstuk 2][ref1] bedraagt voor het jaar 2025:

      a. € 12,5 miljoen voor het tijdvak in maart;

      b. € 12,5 miljoen voor het tijdvak in september.

      2 Het subsidieplafond voor subsidies op grond van [hoofdstuk 3][ref2] bedraagt voor het jaar 2025 € 20 miljoen.

      3 Indien een deel van het bedrag dat beschikbaar is in een aanvraagtijdvak niet volledig wordt benut, kunnen de
      resterende middelen worden toegevoegd aan de middelen van een ander aanvraagtijdvak van hetzelfde kalenderjaar.
      De minister maakt de verschuivingen van het beschikbare budget bekend op [www.uitvoeringvanbeleidszw.nl](http://
      www.uitvoeringvanbeleidszw.nl).


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk3
