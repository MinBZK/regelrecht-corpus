  - number: '3'
    text: |-
      Het doel van deze regeling is om door middel van subsidie een bijdrage te leveren aan initiatieven in mkb-
      ondernemingen, gericht op het stimuleren van leren en ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0043015/2024-12-21#Artikel3
  - number: '4'
    text: |-
      1 De minister kan op aanvraag subsidie verstrekken voor het bekostigen van onderstaande activiteiten die uiting
      geven aan het doel van deze regeling:

      a. de doorlichting van de onderneming uitmondend in een opleidings- of ontwikkelplan gericht op het inzichtelijk
      maken van ontwikkelbehoefte om de leerrijke werkomgeving te versterken vanuit het perspectief van de onderneming;

      b. het verkrijgen van loopbaan- of ontwikkeladviezen ten behoeve van werkenden in de onderneming, of in geval van
      een samenwerkingsverband werkenden in andere mkb-ondernemingen; of

      c. het ondersteunen en begeleiden bij het ontwikkelen of invoeren van een L&O-methode.

      2 Een activiteit komt niet voor subsidie in aanmerking, indien de werkenden in de onderneming waarop de activiteit
      zich richt, enkel bestaan uit werkenden die bestuurder van de onderneming zijn of in het handelsregister, bedoeld
      in [artikel 2 van de Handelsregisterwet 2007][ref1], zijn geregistreerd als degenen aan wie de onderneming
      toebehoort.

      3 Een loopbaan- of ontwikkeladviestraject als bedoeld in het eerste lid, onderdeel b, komt alleen voor subsidie
      in aanmerking indien de loopbaanadviseur individuele gesprekken met de deelnemer voert met een tijdsbeslag van in
      totaal minimaal vier uren.

      4 Een initiatief waarvoor subsidie wordt aangevraagd op grond van [hoofdstuk 2][ref2] en dat bestaat uit een
      activiteit als bedoeld in het eerste lid, onderdelen a en c, komt alleen voor subsidie in aanmerking indien de
      subsidiabele kosten ten minste € 5.000 bedragen.

      5 Een initiatief waarvoor subsidie wordt aangevraagd op grond van [hoofdstuk 3][ref3] komt alleen voor subsidie
      in aanmerking, indien het initiatief ten minste de activiteit, bedoeld in het eerste lid, onderdeel c, bevat en de
      subsidiabele kosten ten minste € 210.000 bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk3
