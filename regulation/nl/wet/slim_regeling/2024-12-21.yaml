  - number: '24'
    text: |-
      1 Een samenwerkingsverband waaraan subsidie is verleend op grond van deze regeling draagt zorg voor de evaluatie
      van de uitvoering van het initiatief op grond van deze regeling en het bereik, de doeltreffendheid en doelmatigheid
      daarvan.

      2 Het evaluatieverslag wordt gelijktijdig met de aanvraag tot subsidievaststelling aan de minister aangeboden.

      3 Het evaluatieverslag omvat in ieder geval:

      a. een beschrijving van het uitgevoerde initiatief;

      b. een beschrijving van het implementatie- en uitvoeringsproces en de leerervaringen die daarbij zijn opgedaan; en

      c. een overzicht van de bereikte resultaten.
    url: https://wetten.overheid.nl/BWBR0043015/2024-12-21#Artikel24
  - number: '25'
    text: |-
      De minister kan een of meer bepalingen van deze regeling buiten toepassing laten of daarvan afwijken voor
      zover toepassing gelet op het belang dat de desbetreffende bepaling beoogt te beschermen, zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0043015/2024-12-21#Artikel25
  - number: '26'
    text: |-
      1 De minister draagt zorg voor de evaluatie van de doeltreffendheid en doelmatigheid van deze regeling.

      2 De subsidieontvanger werkt mee aan door of namens de minister ingesteld onderzoek dat erop is gericht de minister
      inlichtingen te verschaffen die van belang zijn voor de evaluatie van de doeltreffendheid en doelmatigheid van deze
      regeling en de ontwikkeling van het beleid van de minister. De subsidieontvanger verstrekt in dat kader de daartoe
      benodigde inlichtingen, gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0043015/2024-12-21#Artikel26
  - number: '27'
    text: |-
      1 Deze regeling treedt in werking met ingang 1 januari 2020 en vervalt met ingang van 1 januari 2030.

      2 In afwijking van het eerste lid blijft deze regeling, zoals die luidde op 31 december 2029, van toepassing op de
      afwikkeling van verleende subsidies op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0043015/2024-12-21#Artikel27
  - number: '28'
    text: 'Deze regeling wordt aangehaald als: SLIM-regeling.'
