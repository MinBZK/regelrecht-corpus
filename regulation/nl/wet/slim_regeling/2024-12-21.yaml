  - number: '5'
    text: |-
      Een subsidieaanvraag kan voor het jaar 2025 bij de minister worden ingediend in de volgende tijdvakken:

      a. voor aanvragen op grond van [hoofdstuk 2][ref1]: van 3 maart 09:00 uur tot en met 31 maart 17:00 uur en van
      1 september 09:00 uur tot en met 30 september 17:00 uur;

      b. voor aanvragen op grond van [hoofdstuk 3][ref2]: van 2 juni 09:00 uur tot en met 30 juni 17:00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk3
