  - number: '16'
    text: |-
      1 Indien de subsidieontvanger een samenwerkingsverband is en het initiatief waarvoor subsidie is verleend een
      periode van meer dan twaalf maanden omvat, dient de subsidieontvanger uiterlijk acht weken na afloop van de eerste
      twaalf maanden een tussentijds voortgangsverslag in bij de minister, onder gebruikmaking van het daartoe door de
      minister elektronisch beschikbaar gestelde model.

      2 De minister kan bij de beschikking tot subsidieverlening een voorschot verlenen van:

      a. 50% van de verleende subsidie, indien de subsidie is aangevraagd door een subsidieaanvrager als bedoeld in
      [artikel 17][ref1];

      b. 25% van de verleende subsidie, indien de subsidie is aangevraagd door een subsidieaanvrager als bedoeld in
      [artikel 19, eerste lid][ref2];

      c. 50% van de verleende subsidie, in aanvulling op het voorschot, genoemd in onderdeel b, en uit te betalen na
      indiening van het tussentijdse voortgangsverslag, indien de looptijd van het initiatief meer dan twaalf maanden
      bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel17
