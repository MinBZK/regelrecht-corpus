    text: |-
      1 Subsidie op grond van dit hoofdstuk wordt aangevraagd door de hoofdaanvrager van het samenwerkingsverband.

      2 Onder hoofdaanvrager wordt verstaan een mkb-onderneming, brancheorganisatie, onderwijsinstelling, O&O-fonds of
      werknemers- of werkgeversvereniging, die gemachtigd is om de andere partijen in het samenwerkingsverband in en
      buiten rechte te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0043015/2024-12-21#Artikel19
  - number: '20'
    text: |-
      1 De subsidie die wordt verleend voor de activiteiten, bedoeld in [artikel 4, eerste lid][ref1], bedraagt maximaal
      € 500.000, waarbij geen enkele partij van het samenwerkingsverband aanspraak kan maken op € 200.000 of meer.

      2 In afwijking van het eerste lid is de maximale subsidie bij deelname aan een samenwerkingsverband voor
      landbouwbedrijven € 20.000, voor visserijbedrijven € 30.000 en voor goederenververvoer over de weg € 100.000.

      3 Voor de activiteiten, bedoeld in [artikel 4, eerste lid, onderdelen a en c][ref2], bedraagt
      de subsidie 60% van de subsidiabele kosten, voor zover het de kosten betreft, bedoeld in
      [artikel 12, eerste lid, onderdelen a tot en met c][ref3].


