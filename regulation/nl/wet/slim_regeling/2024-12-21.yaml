  - number: '7'
    text: |-
      1 De subsidieaanvrager dient de subsidieaanvraag in door middel van het daartoe bestemde elektronisch
      aanvraagformulier dat is getekend door een functionaris, bevoegd om namens de subsidieaanvrager te handelen, en
      voegt hierbij:

      a. een activiteitenplan;

      b. een begroting; en

      c. een bewijs dat de subsidieaanvrager de houder is van het bankrekeningnummer dat in de aanvraag is opgenomen.

      2 De subsidieaanvrager dient een de-minimisverklaring in en, indien de subsidieaanvrager een mkb-onderneming is,
      een mkb-verklaring. Indien sprake is van een samenwerkingsverband, is een de-minimisverklaring vereist van alle
      partijen van het samenwerkingsverband en een mkb-verklaring van alle partijen van het samenwerkingsverband die een
      mkb-onderneming zijn.

      3 Het activiteitenplan, de begroting, de de-minimisverklaring en de mkb-verklaring worden opgesteld overeenkomstig
      het door de minister vastgestelde model.

      4 Per aanvraagtijdvak wordt per subsidieaanvrager, of partij in een samenwerkingsverband, maximaal één
      subsidieaanvraag in behandeling genomen. Brancheorganisaties, onderwijsinstellingen, O&O-fondsen en werknemers- of
      werkgeversverenigingen kunnen binnen een aanvraagtijdvak deelnemen in meerdere samenwerkingsverbanden en daardoor
      partij zijn bij meerdere subsidieaanvragen binnen hetzelfde aanvraagtijdvak.

      5 Een subsidieaanvraag kan bestaan uit meerdere activiteiten.

      6 Voor zover de subsidieaanvrager voor dezelfde begrote kosten of een deel daarvan ook subsidie of een andere
      financiële bijdrage heeft aangevraagd of zal aanvragen bij een ander bestuursorgaan of rechtspersoon, doet hij
      daarvan mededeling in de subsidieaanvraag, onder vermelding van de stand van zaken van de beoordeling van die
      andere aanvraag.

      7 Door het indienen van een aanvraag stemt de subsidieaanvrager ermee in dat het subsidiedossier, met uitzondering
      van persoonsgegevens, openbaar wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0043015/2024-12-21#Artikel7
  - number: 7a
    text: |-
      De minister is bevoegd persoonsgegevens, die hij in het kader van deze subsidieregeling heeft verkregen, te
      verstrekken aan de aanbieder van een kennis- en ondersteuningsprogramma ten behoeve van deze subsidieregeling, ter
      uitvoering en verbetering van dat programma.
    url: https://wetten.overheid.nl/BWBR0043015/2024-12-21#Artikel7a
  - number: '8'
    text: |-
      1 Bij overschrijding van een subsidieplafond als bedoeld in [artikel 6, eerste lid][ref1], wordt na afloop van
      het aanvraagtijdvak door middel van loting de volgorde vastgesteld waarin de ontvangen subsidieaanvragen worden
      afgehandeld.

      2 Indien een subsidieaanvrager meerdere aanvragen heeft ingediend voor soortgelijke of vergelijkbare initiatieven,
      wordt slechts de als eerste ingediende aanvraag in de loting meegenomen.

      3 Onvolledige subsidieaanvragen voor subsidies op grond van hoofdstuk 2 worden, na aanvulling door de
      subsidieaanvrager, geplaatst aan het einde van de lijst die volgt uit de loting, waarbij het tijdstip van ontvangst
      van de volledige subsidieaanvraag bepalend is voor de volgorde van plaatsing op die lijst.

      4 Volledige subsidieaanvragen voor subsidies op grond van hoofdstuk 3 worden behandeld op volgorde van ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel6
