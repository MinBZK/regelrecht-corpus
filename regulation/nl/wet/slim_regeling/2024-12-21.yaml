    text: |-
      1 Onverminderd [artikel 4:48 van de Algemene wet bestuursrecht][ref1] wordt de beschikking tot subsidieverlening
      geheel ingetrokken indien:

      a. de subsidie niet is besteed aan de in de beschikking tot subsidieverlening toegekende subsidiabele kosten;

      b. de in de beschikking tot subsidieverlening opgegeven verplichtingen niet zijn nageleefd.

      2 De beschikking tot subsidieverlening of de beschikking tot subsidievaststelling kan, in afwijking van het eerste
      lid, gedeeltelijk worden ingetrokken indien er naar het oordeel van de minister geen aanleiding is de subsidie
      geheel in te trekken.

      3 Indien de beschikking tot subsidievaststelling geheel of gedeeltelijk wordt ingetrokken, wordt het
      subsidiebedrag dat tot dat moment is uitgekeerd, vermeerderd met de wettelijke rente, geheel of gedeeltelijk van de
      subsidieontvanger teruggevorderd.

      4 Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op de beschikking tot voorschotverlening,
      bedoeld in [artikel 16, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel448
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Artikel16
