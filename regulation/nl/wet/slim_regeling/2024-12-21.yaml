    text: |-
      1 In aanvulling op [artikel 7][ref1] bestaat de subsidieaanvraag voor samenwerkingsverbanden uit:

      a. de samenwerkingsovereenkomst van het samenwerkingsverband, ondertekend door alle partijen die onderdeel uitmaken
      van het samenwerkingsverband, vergezeld van een schriftelijke machtiging waaruit blijkt dat de subsidieaanvrager
      gemachtigd is de andere partijen in het samenwerkingsverband in en buiten rechte te vertegenwoordigen; en

      b. een begroting waaruit de verdeling van kosten tussen de partijen in het samenwerkingsverband volgt.

      2 De hoofdaanvrager is verantwoordelijk voor de administratievoorschriften van alle partijen in het
      samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel7
