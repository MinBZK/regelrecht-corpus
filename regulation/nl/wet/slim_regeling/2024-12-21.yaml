  - number: '12'
    text: |-
      1 Voor de subsidie van initiatieven als bedoeld onder [artikel 4, eerste lid, onderdeel a en c][ref1], komen de
      volgende kosten in aanmerking:

      a. externe kosten die daadwerkelijk zijn gemaakt ter uitvoering van een subsidiabel initiatief;

      b. directe loonkosten van de personen die zich in het bedrijf van de subsidieaanvrager of een van de partijen van
      het samenwerkingsverband bezighouden met de uitvoering van het initiatief, berekend op basis van het brutoloon van
      die personen en vermeerderd met een opslag van 32%, naar rato van individuele gerealiseerde uren en uitgaande van
      1.720 werkbare uren op jaarbasis;

      c. een toeslag van 15% op de onder a en b bedoelde kosten ter subsidiëring van overige gemaakte kosten; en

      d. de kosten van een controleverklaring, in de vorm van een vast bedrag van € 3.000, indien een controleverklaring
      voor de vaststelling van de subsidie is vereist.

      2 De kosten zijn, met uitzondering van het eerste lid, onderdeel c, door de subsidieaanvrager daadwerkelijk gemaakt
      en betaald, ten laste van het initiatief gebleven en rechtstreeks aan het initiatief toe te rekenen.

      3 Voor externe opdrachten wordt de marktconformiteit van de kosten bepaald door:

      a. een offerteprocedure waarbij ten minste drie offertes zijn aangevraagd en beoordeeld door de subsidieaanvrager,
      indien deze kosten meer bedragen dan € 50.000; of

      b. een transparante, objectieve en niet-discriminatoire aanbestedingsprocedure.

      4 Wordt gebruik gemaakt van een externe adviseur dan is het subsidiabele uurtarief maximaal € 125 per uur exclusief
      btw en is een offerteprocedure als bedoeld in het derde lid, aanhef en onderdeel a, niet vereist. Het uurtarief
      bedraagt maximaal € 135 per uur exclusief BTW voor subsidies die zijn aangevraagd in het jaar 2024 of 2025.

      5 Voor zover activiteiten zijn uitgevoerd door de volgende partijen, zijn uitsluitend de directe loonkosten als
      bedoeld in het eerste lid, onderdeel b, subsidiabel:

      a. de subsidieontvanger of een partij in het samenwerkingsverband;

      b. een organisatie die, direct of indirect, is vertegenwoordigd in het bestuur van de subsidieontvanger of in het
      bestuur van een partij in het samenwerkingsverband;

      c. een organisatie waarin één of meer van dezelfde partijen in het bestuur zijn vertegenwoordigd, die
      tegelijkertijd ook:

      1°. in het bestuur van de subsidieontvanger zijn vertegenwoordigd; of

      2°. in het bestuur van een partij in het samenwerkingsverband zijn vertegenwoordigd;

      d. een organisatie waarin een persoon een financieel belang heeft of in het bestuur zit van die organisatie, en die
      persoon ook werkzaam is voor:

      1°. de subsidieontvanger; of

      2°. een partij uit het samenwerkingsverband;

      e. een organisatie waarin de subsidieontvanger of een partij uit het samenwerkingsverband, direct of indirect
      invloed kan uitoefenen of een financieel belang heeft; of

      f. een organisatie waarin zich een belangenconflict voordoet of kan voordoen als gevolg van familiebanden,
      persoonlijke relaties, politieke gezindheid of nationaliteit, economische belangen of elk ander direct of indirect
      persoonlijk belang, waarmee de onpartijdige en objectieve uitoefening van de functies van een financiële actor
      of andere persoon die bij de uitvoering van het initiatief betrokken is, in gevaar is of in gevaar kan worden
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel4
