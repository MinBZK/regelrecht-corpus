  - number: '11'
    text: |-
      1 Een initiatief voor subsidies op grond van [hoofdstuk 2][ref1] wordt afgerond binnen een periode van 12 maanden.

      2 Een initiatief voor subsidies op grond van [hoofdstuk 3][ref2] wordt afgerond binnen een periode van 24 maanden.

      3 De voor subsidie in aanmerking komende kosten worden gemaakt in een door de minister aangewezen
      initiatiefperiode. Deze periode start de dag na dagtekening van het besluit tot verlening van de subsidie.

      4 Indien een subsidieontvanger vanwege omstandigheden die niet aan hem zijn toe te rekenen, het initiatief waarvoor
      subsidie is verleend naar verwachting niet binnen de initiatiefperiode, bedoeld in het derde lid, zal kunnen
      afronden, kan de subsidieontvanger de minister verzoeken om de duur van de initiatiefperiode te verlengen.

      5 De minister kan, in afwijking van het eerste en tweede lid, de duur van de initiatiefperiode verlengen tot ten
      hoogste drie maanden na de van toepassing zijnde periode, genoemd in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk3
