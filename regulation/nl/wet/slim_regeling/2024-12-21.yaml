  - number: '15'
    text: |-
      1 Onverminderd [artikel 5.2, eerste lid, van de Kaderregeling][ref1], bevat de administratie van de
      subsidieontvanger een bijlage met een overzicht van de KvK-nummers van alle ondernemingen die deelnemen aan het
      project, onder vermelding van de activiteiten waaraan is deelgenomen en, indien de subsidie is verleend voor een
      activiteit als bedoeld in:

      a. [artikel 4, eerste lid, onderdeel a][ref2], het opleidings- of ontwikkelplan dat voortkomt uit de
      doorlichting;

      b. [artikel 4, eerste lid, onderdeel b][ref3], een prestatieverklaring van de loopbaanscan of het
      ontwikkeladvies, getekend door de adviseur en de deelnemer;

      c. [artikel 4, eerste lid, onderdeel c][ref4], de met de gerealiseerde methode gemoeide producten.

      2 Onder een prestatieverklaring, genoemd in het eerste lid, onderdeel b, wordt verstaan: een verklaring in
      het daarvoor geldende format, getekend door de loopbaanadviseur en de deelnemer, waarin wordt bevestigd dat de
      deelnemer aan het ontwikkeltraject heeft deelgenomen, welke onderwerpen daarin aan bod zijn gekomen en welke
      resultaten hiervoor zijn behaald.


