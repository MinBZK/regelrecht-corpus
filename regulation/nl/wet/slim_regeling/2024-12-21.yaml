  - number: '10'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] wordt de subsidie in ieder geval geheel of
      gedeeltelijk geweigerd, indien:

      a. de subsidieaanvraag niet voldoet aan de bij deze regeling gestelde eisen;

      b. de beoogde initiatieven en resultaten onvoldoende meetbaar zijn geformuleerd;

      c. de haalbaarheid van de beoogde aanpak onvoldoende aannemelijk is gemaakt;

      d. de evaluatieopzet onvoldoende of ongeschikt is om de effectiviteit en bruikbaarheid van een initiatief te kunnen
      beoordelen;

      e. een initiatief niet uitvoerbaar is binnen bestaande wet- en regelgeving;

      f. onvoldoende is aangetoond dat subsidie noodzakelijk is voor het uitvoeren van een initiatief waarvoor subsidie
      wordt aangevraagd;

      g. op grond van deze regeling binnen hetzelfde aanvraagtijdvak reeds subsidie is verleend voor een soortgelijk of
      vergelijkbaar initiatief ten behoeve van dezelfde onderneming of hetzelfde samenwerkingsverband;

      h. er geen de-minimisverklaring en, indien van toepassing, mkb-verklaring is afgegeven;

      i. de subsidieaanvraag tot gevolg heeft dat een subsidieplafond als bedoeld in [artikel 6][ref2] wordt
      overschreden;

      j. de subsidieaanvraag ziet op het ontwikkelen van een initiatief niet bedoeld voor werkenden in de onderneming
      maar voor commerciële doeleinden; of

      k. de subsidieaanvraag ziet op een activiteit als bedoeld in [artikel 4, eerste lid, onderdeel a of c][ref3], en
      aan de subsidieaanvrager voor een dergelijke activiteit reeds subsidie is verleend die op het moment van indiening
      van de subsidieaanvraag nog niet is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel435
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0043015#Artikel4
