  - number: '9'
    text: |-
      1 Op een subsidieaanvraag op basis van hoofdstuk 2 wordt binnen 13 weken na afloop van het aanvraagtijdvak,
      bedoeld in [artikel 5][ref1] beslist. De subsidieaanvraag wordt beoordeeld op grond van de voorwaarden, bedoeld
      in [artikel 7][ref2].

      2 Op een subsidieaanvraag op basis van hoofdstuk 3 wordt binnen 13 weken na ontvangst beslist. De subsidieaanvraag
      wordt beoordeeld op grond van de voorwaarden, bedoeld in artikel 7, en de eisen, bedoeld in artikel 21.

      3 Indien de minister op grond van [artikel 16, tweede lid][ref3], een voorschot verleent, vermeldt de beschikking
      tot subsidieverlening, onverminderd [artikel 4.2, eerste lid, van de Kaderregeling][ref4], de wijze van
      bevoorschotting.

      4 In geval van een samenwerkingsverband vermeldt de beschikking tot subsidieverlening, in aanvulling op het
      derde lid, de partijen van het samenwerkingsverband en de verdeling van het subsidiebedrag van de partijen in het
      samenwerkingsverband.


