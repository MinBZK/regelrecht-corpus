  - number: '13'
    text: |-
      Met betrekking tot de initiatieven, bedoeld onder [artikel 4, eerste lid, onderdeel a en c][ref1], komen niet voor
      subsidie in aanmerking:

      a. onredelijk en niet noodzakelijk gemaakte kosten ter uitvoering van het initiatief of een onderdeel daarvan;

      b. loonverletkosten, zijnde de loonkosten van werkenden voor niet-productieve uren als gevolg van deelname
      aan subsidiabele activiteiten, voor zover die hebben geleid tot een vermindering van de werkbare uren voor de
      ondernemer;

      c. kosten voor overhead en aan overhead gerelateerde exploitatiekosten, zijnde alle niet directe kosten waaronder
      onder andere begrepen huisvestingskosten, kosten voor een werkplek, reiskosten, afschrijvingskosten en de
      kosten voor administratie en beheer, waaronder accountantskosten, met uitzondering van de kosten, bedoeld in
      [artikel 12, eerste lid, onderdeel d][ref2];

      d. kosten gemaakt buiten de initiatiefperiode;

      e. kosten die in aanmerking komen voor andere financiering van overheidswege;

      f. externe kosten waarvoor geen factuur kan worden overgelegd;

      g. kosten die voortvloeien uit wettelijk verplichte taken;

      h. opleidingskosten;

      i. btw;

      j. de kosten voor de doorlichting van de onderneming, bedoeld in artikel 4, eerste lid, onderdeel a, indien deze
      onvoldoende duidelijk is toegesneden op de scholingsbehoefte vanuit het perspectief van de desbetreffende mkb-
      onderneming; of

      k. de kosten voor de ondersteuning en begeleiding bij het ontwikkelen of invoeren van een methode in de
      onderneming als bedoeld in artikel 4, eerste lid, onderdeel c, indien deze onvoldoende duidelijk is toegesneden op
      desbetreffende mkb-onderneming.


