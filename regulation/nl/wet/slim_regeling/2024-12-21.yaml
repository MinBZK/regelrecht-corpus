  - number: '17'
    text: Subsidie op grond van dit hoofdstuk wordt aangevraagd door een mkb-onderneming.
    url: https://wetten.overheid.nl/BWBR0043015/2024-12-21#Artikel17
  - number: '18'
    text: |-
      1 Voor de activiteiten, bedoeld in [artikel 4, eerste lid][ref1], wordt op grond van dit hoofdstuk een subsidie
      verstrekt tot € 25.000, met uitzondering van landbouwbedrijven, waarvoor een maximum geldt van € 20.000.

      2 Voor de activiteiten, bedoeld in [artikel 4, eerste lid, onderdelen a en c][ref2], bedraagt de subsidie 60% van
      de subsidiabele kosten.


