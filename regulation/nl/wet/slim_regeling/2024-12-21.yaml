  - number: '22'
    text: |-
      1 De minister doet verzoeken als bedoeld in [artikel 7.4, eerste lid, van de Kaderregeling][ref1] op basis van een
      steekproef voorafgaande aan het vaststellen van de subsidie.

      2 Een samenwerkingsverband waaraan subsidie is verleend op grond van deze regeling dient door
      middel van een elektronisch formulier binnen 22 weken na afloop van de initiatiefperiode, bedoeld in
      [artikel 11, derde lid][ref2], bij de minister een verzoek in tot vaststelling van de subsidie.

      3 Het verzoek tot vaststelling gaat, onverminderd [artikel 7.8 van de Kaderregeling][ref3], vergezeld van een
      evaluatieverslag als bedoeld in [artikel 24][ref4].

      4 Het activiteitenverslag en het financieel verslag, bedoeld in de [Kaderregeling][ref5], worden opgesteld
      overeenkomstig het door de minister vastgestelde model.

      5 In afwijking van [artikel 1.1 van de Kaderregeling][ref6] is het bij het opstellen van de
      controleverklaring in acht te nemen accountantsprotocol, genoemd in dat artikel, gepubliceerd op de website
      [www.uitvoeringvanbeleidszw.nl](http://www.uitvoeringvanbeleidszw.nl/).

      6 Indien uit de beoordeling van het verzoek tot vaststelling blijkt, dat minder dan 60% van de totale subsidiabele
      kosten, genoemd in de laatst afgegeven beschikking tot subsidieverlening, is gerealiseerd, gaat de minister na of
      er aanleiding is om de subsidie lager of op nihil vast te stellen.


