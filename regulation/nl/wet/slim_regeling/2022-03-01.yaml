  - number: '12'
    text: |-
      1 Voor de subsidie van initiatieven als bedoeld onder [artikel 4, eerste lid, onderdeel a en c][ref1], komen de
      volgende kosten in aanmerking:

      a. externe kosten die daadwerkelijk zijn gemaakt ter uitvoering van een subsidiabel initiatief;

      b. directe loonkosten van de personen die zich in het bedrijf van de subsidieaanvrager of een van de partijen van
      het samenwerkingsverband bezighouden met de uitvoering van het initiatief, berekend op basis van het brutoloon van
      die personen en vermeerderd met een opslag van 32%, naar rato van individuele gerealiseerde uren en uitgaande van
      1.720 werkbare uren op jaarbasis; en

      c. een toeslag van 15% op de onder a en b bedoelde kosten ter subsidiëring van overige gemaakte kosten.

      2 De kosten zijn, met uitzondering van het eerste lid, onderdeel c, door de subsidieaanvrager daadwerkelijk gemaakt
      en betaald, ten laste van het initiatief gebleven en rechtstreeks aan het initiatief toe te rekenen.

      3 Voor externe opdrachten wordt de marktconformiteit van de kosten bepaald door:

      a. een offerteprocedure waarbij ten minste drie offertes zijn aangevraagd en beoordeeld door de subsidieaanvrager,
      indien deze kosten meer bedragen dan € 50.000; of

      b. een transparante, objectieve en niet-discriminatoire aanbestedingsprocedure.

      4 Wordt gebruik gemaakt van een externe adviseur dan is het subsidiabele uurtarief maximaal € 125 per uur exclusief
      btw en is een offerteprocedure als bedoeld in het derde lid, aanhef en onderdeel a, niet vereist.

      5 In afwijking van het eerste lid zijn kosten gemaakt door verbonden organisaties, samenwerkingspartners in het
      samenwerkingsverband of organisaties die worden vertegenwoordigd in het bestuur van de subsidieaanvrager of in het
      bestuur van een samenwerkingspartner, slechts subsidiabel op basis van directe loonkosten als bedoeld in het eerste
      lid, onderdeel b, en de toeslag, bedoeld in het eerste lid, onderdeel c.

      6 Onder een verbonden organisatie als bedoeld in het vijfde lid wordt verstaan een privaatrechtelijke of
      publiekrechtelijke organisatie:

      a. waarop de subsidieontvanger, dan wel een bij het project betrokken partij, direct of indirect een overheersende
      invloed kan uitoefenen;

      b. die direct of indirect een overheersende invloed op de subsidieontvanger, dan wel op een bij het project
      betrokken partij, kan uitoefenen; of

      c. die, tezamen met de subsidieontvanger, dan wel met een bij het project betrokken partij, direct of indirect
      onderworpen is aan de overheersende invloed van een andere organisatie uit hoofde van eigendom, financiële
      deelneming of op haar van toepassing zijnde voorschriften.

      7 Overheersende invloed als bedoeld in het zesde lid wordt vermoed, indien een organisatie direct of indirect, ten
      opzichte van een andere organisatie:

      a. de meerderheid van het geplaatste kapitaal van de organisatie bezit;

      b. over de meerderheid van de stemmen beschikt die aan de door de organisatie uitgegeven aandelen zijn verbonden;
      of

      c. meer dan de helft van de leden van het bestuurs-, leidinggevend of toezichthoudend orgaan van de organisatie
      kan benoemen.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel4
