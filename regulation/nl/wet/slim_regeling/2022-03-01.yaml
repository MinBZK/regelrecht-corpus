  - number: '10'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] wordt de subsidie in ieder geval geheel of
      gedeeltelijk geweigerd, indien:

      a. de subsidieaanvraag niet voldoet aan de bij deze regeling gestelde eisen;

      b. de beoogde initiatieven en resultaten onvoldoende meetbaar zijn geformuleerd;

      c. de subsidieaanvraag ziet op een beroepsopleiding in de beroepsbegeleidende of beroepsopleidende leerweg, bedoeld
      in [artikel 7.2.2, tweede lid, van de Wet educatie en beroepsonderwijs][ref2];

      d. de haalbaarheid van de beoogde aanpak onvoldoende aannemelijk is gemaakt;

      e. de evaluatieopzet onvoldoende of ongeschikt is om de effectiviteit en bruikbaarheid van een initiatief te kunnen
      beoordelen;

      f. een initiatief niet uitvoerbaar is binnen bestaande wet- en regelgeving;

      g. onvoldoende is aangetoond dat subsidie noodzakelijk is voor het uitvoeren van een initiatief waarvoor subsidie
      wordt aangevraagd;

      h. op grond van deze regeling binnen hetzelfde aanvraagtijdvak reeds subsidie is verleend voor een soortgelijk of
      vergelijkbaar initiatief ten behoeve van dezelfde onderneming of hetzelfde samenwerkingsverband;

      i. er geen de-minimisverklaring is afgegeven;

      j. de subsidieaanvraag tot gevolg heeft dat een subsidieplafond als bedoeld in [artikel 6][ref3] wordt
      overschreden; of

      k. de subsidieaanvraag ziet op het ontwikkelen van een initiatief niet bedoeld voor werkenden in de onderneming
      maar voor commerciële doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel435
