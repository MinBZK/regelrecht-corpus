  - number: '5'
    text: |-
      Een subsidieaanvraag kan jaarlijks bij de minister worden ingediend in de volgende tijdvakken:

      a. voor aanvragen op grond van [hoofdstuk 2][ref1], van 1 maart 09:00 uur tot en met 31 maart 17:00 uur en van
      1 september 09:00 uur tot en met 30 september 17:00 uur;

      b. voor aanvragen op grond van de [hoofdstukken 3][ref2] of [4][ref3], van 1 juni 09:00 uur tot en met 30 juni
      17:00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk4
