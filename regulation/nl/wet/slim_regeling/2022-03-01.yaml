        artikel: '6'
        hoofdstuk: '1'
  - number: '9'
    text: |-
      1 Op een subsidieaanvraag wordt binnen 18 weken na afloop van het aanvraagtijdvak, bedoeld in [artikel 5][ref1]
      beslist. De subsidieaanvraag wordt beoordeeld op grond van de voorwaarden, bedoeld in [artikel 7][ref2], en voor
      zover sprake is van een samenwerkingsverband de eisen, bedoeld in [artikel 21][ref3].

      2 De minister kan zich voor de beoordeling van de aanvraag laten adviseren door externe partijen.

      3 De beschikking tot subsidieverlening vermeldt in ieder geval het initiatief waarvoor subsidie wordt verleend, het
      subsidiebedrag en de start- en einddatum van het initiatief.

      4 In geval van een samenwerkingsverband vermeldt de beschikking tot subsidieverlening, in aanvulling op het
      derde lid, de partijen van het samenwerkingsverband en de verdeling van het subsidiebedrag van de partijen in het
      samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0043015#Artikel21
