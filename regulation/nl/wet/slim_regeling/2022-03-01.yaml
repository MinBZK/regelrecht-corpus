  - number: '15'
    text: |-
      1 De subsidieaanvrager houdt een inzichtelijke en controleerbare administratie bij met betrekking tot de uitvoering
      van het subsidiabele initiatief en de in verband daarmee gedane uitgaven en gerealiseerde opbrengsten. Deze
      administratie bestaat uit een financiële administratie en een administratie van de deelnemers per activiteit waarin
      alle noodzakelijke gegevens tijdig, juist en volledig zijn vastgelegd en ten behoeve van de vaststelling van de
      subsidiabiliteit zijn te verifiëren met bewijsstukken. Deze administratie is voor controle beschikbaar op een voor
      de subsidieontvanger vrij toegankelijke locatie.

      2 De administratie geeft inzicht in de geplande en gerealiseerde prestaties in termen van deelnemers dan wel in
      termen van geleverde producten of diensten.

      3 De financiële administratie geeft inzicht in de gemaakte subsidiabele kosten, de inkomsten en de wijze waarop
      de inkomsten en uitgaven aan de maatregelen van het initiatief worden toegerekend. De financiële administratie
      bevat in ieder geval de opdrachtbevestiging, facturen en betaalbewijzen van externe opdrachten en in het geval van
      directe loonkosten een onderbouwing van de bestede uren.

      4 De financiële administratie bevat een bijlage met een overzicht van de KvK-nummers van alle ondernemingen die
      deelnemen aan het project, onder vermelding van de activiteiten waaraan is deelgenomen.

      5 De deelnemersadministratie geeft inzicht in de verrichte activiteiten en behaalde resultaten per individuele
      deelnemer.

      6 In aanvulling op het eerste tot en met het vijfde lid, bevat de administratie van de subsidieaanvrager ten
      minste, indien het betreft een subsidieaanvraag voor een activiteit als bedoeld in:

      a. [artikel 4, eerste lid, onderdeel a][ref1], het opleidings- of ontwikkelplan dat voortkomt uit de doorlichting;

      b. [artikel 4, eerste lid, onderdeel b][ref2], een prestatieverklaring van de loopbaanscan of het ontwikkeladvies,
      getekend door de adviseur en de deelnemer. Onder prestatieverklaring wordt verstaan een verklaring in het daarvoor
      geldende format, getekend door de loopbaanadviseur en de deelnemer, waarin wordt bevestigd dat de deelnemer aan
      het ontwikkeltraject heeft deelgenomen, welke onderwerpen daarin aan bod zijn gekomen en welke resultaten hiervoor
      zijn behaald;

      c. [artikel 4, eerste lid, onderdeel c][ref3], de met de gerealiseerde methode gemoeide producten;

      d. [artikel 4, eerste lid, onderdeel d][ref4]:

      1°. een praktijkleerovereenkomst, die door alle noodzakelijke partijen is getekend en waaruit onder andere blijkt
      hoe de begeleiding heeft plaatsgevonden en welk deel van de leerdoelen, de kwaliteiten of kwalificaties in de
      beroepsvorming bij de ondernemer zijn behaald;

      2°. een administratie waaruit de begeleiding van de leerling, deelnemer of student blijkt en de wijze waarop de
      leerling, deelnemer of student heeft deelgenomen aan de praktijkleerplaats bij de beroepsopleiding in de derde
      leerweg.

      7 De subsidieontvanger verstrekt desgevraagd aan door de minister daartoe aangewezen instanties inzage in- of
      informatie uit de administratie.


