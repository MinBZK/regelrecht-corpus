  - number: '24'
    text: |-
      1 De subsidieaanvrager dient middels een elektronisch formulier binnen 22 weken na afloop van de initiatiefperiode,
      vastgelegd in de subsidieverlening, een verzoek tot vaststelling van subsidie in bij de minister, waarin onder
      andere is opgenomen een verslag van de uitgevoerde activiteiten in de desbetreffende mkb-onderneming of het
      grootbedrijf en een overzicht van de kosten per activiteit middels een voorgeschreven format. Indien het een
      verzoek tot vaststelling betreft voor een activiteit als bedoeld in [artikel 4, eerste lid, onderdeel b][ref1], dan
      is in het verzoek ook de prestatieverklaring, bedoeld in [artikel 15, zesde lid, onderdeel b][ref2], opgenomen. Bij
      dit verzoek tot vaststelling wordt een bewijs overgelegd, waaruit blijkt dat de houder van het bankrekeningnummer
      dat in het verzoek is opgenomen de hoofdaanvrager is, bedoeld in [artikel 19, eerste lid][ref3], dan wel de
      aanvraaggerechtigde, bedoeld in [artikel 22][ref4].

      2 Indien de verleende subsidie € 25.000 of meer bedraagt, bevat het verzoek tot vaststelling, in aanvulling op het
      eerste lid, een evaluatieverslag als bedoeld in [artikel 26][ref5].

      3 Indien de verleende subsidie € 125.000 of meer bedraagt, bevat het verzoek tot vaststelling, in aanvulling
      op het eerste lid, uit een controleverklaring omtrent de naleving van de aan de verleende subsidie verbonden
      verplichtingen door de subsidieaanvrager, opgesteld door een accountant overeenkomstig een door de minister
      vastgesteld model met inachtneming van een door de minister vastgesteld accountantsprotocol.

      4 Indien bij het indienen, dan wel bij het controleren van de einddeclaratie blijkt, dat minder dan 60% van de
      totale subsidiabele kosten, genoemd in de laatst afgegeven beschikking tot subsidieverlening, is gerealiseerd,
      wordt het subsidiebedrag op nihil vastgesteld.

      5 De minister beslist binnen 22 weken na ontvangst van het verzoek tot vaststelling van de subsidie.


