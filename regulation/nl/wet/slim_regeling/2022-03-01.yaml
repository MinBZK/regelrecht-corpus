  - number: '6'
    text: |-
      1 Het subsidieplafond voor subsidies op grond van [hoofdstuk 2][ref1] bedraagt voor het jaar 2022:

      a. € 15 miljoen voor het tijdvak van 1 maart 09:00 uur tot en met 31 maart 17:00 uur;

      b. € 14,2 miljoen voor het tijdvak van 1 september 09:00 uur tot en met 30 september 17:00 uur.

      2 Het subsidieplafond voor subsidies op grond van [hoofdstuk 3][ref2] bedraagt voor het jaar 2022 € 17,5 miljoen.

      3 Het subsidieplafond voor subsidies op grond van [hoofdstuk 4][ref3] bedraagt voor het jaar 2022 € 1,2 miljoen.

      4 Voor latere jaren stelt de minister telkens voor 1 januari van het jaar waarin het desbetreffende aanvraagtijdvak
      wordt opengesteld het subsidieplafond vast.


