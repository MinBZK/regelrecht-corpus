  - number: '8'
    text: |-
      1 Bij overschrijding van een subsidieplafond als bedoeld in [artikel 6][ref1], wordt na afloop van het
      aanvraagtijdvak door middel van loting de volgorde vastgesteld waarin de ontvangen subsidieaanvragen worden
      afgehandeld.

      2 Alleen volledige subsidieaanvragen worden in behandeling genomen.

      3 Onvolledige subsidieaanvragen worden, na aanvulling door de subsidieaanvrager, geplaatst aan het einde van de
      lijst die volgt uit de loting, waarbij het tijdstip van ontvangst van de volledige subsidieaanvraag bepalend is
      voor de volgorde van plaatsing op die lijst.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel6
    url: https://wetten.overheid.nl/BWBR0043015/2022-03-01#Artikel8
    references:
