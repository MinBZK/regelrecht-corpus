  - number: '3'
    text: |-
      Het doel van deze regeling is om door middel van subsidie een bijdrage te leveren aan initiatieven in mkb-
      ondernemingen en in grootbedrijven in de landbouw-, horeca- of recreatiesector, gericht op het stimuleren van leren
      en ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0043015/2022-03-01#Artikel3
  - number: '4'
    text: |-
      1 De minister kan op aanvraag subsidie verstrekken voor het bekostigen van onderstaande activiteiten die uiting
      geven aan het doel van deze regeling:

      a. de doorlichting van de onderneming uitmondend in een opleidings- of ontwikkelplan gericht op het inzichtelijk
      maken van de scholingsbehoefte vanuit het perspectief van de onderneming;

      b. het verkrijgen van loopbaan- of ontwikkeladviezen ten behoeve van werkenden in de onderneming, of in geval van
      een samenwerkingsverband werkenden in andere mkb-ondernemingen;

      c. het ondersteunen en begeleiden bij het ontwikkelen of invoeren van een methode in de onderneming die werkenden
      in de onderneming stimuleert hun kennis, vaardigheden en beroepshouding verder te ontwikkelen tijdens het werk; of

      d. het gedurende enige tijd bieden van praktijkleerplaatsen ten behoeve van een beroepsopleiding of een deel
      daarvan in de derde leerweg bij een erkend leerbedrijf.

      2 Een loopbaan- of ontwikkeladviestraject als bedoeld in het eerste lid, onderdeel b, komt alleen voor subsidie in
      aanmerking indien de loopbaanadviseur gesprekken met de deelnemer voert met een tijdsbeslag van in totaal minimaal
      vier uren.

      3 Een initiatief bestaande uit een activiteit als bedoeld in het eerste lid, onderdeel a, b en c, komt alleen voor
      subsidie in aanmerking indien de subsidiabele kosten van een subsidieaanvraag op grond van de hoofdstukken 2 of 4
      ten minste € 5.000 bedragen en van een subsidieaanvraag op grond van hoofdstuk 3 ten minste € 210.000.
    url: https://wetten.overheid.nl/BWBR0043015/2022-03-01#Artikel4
  - number: 4a
    text: |-
      1 De activiteiten, bedoeld in [artikel 4, eerste lid, onderdeel b][ref1], worden uitgevoerd door een
      loopbaanadviseur, die:

      a. een mens- of organisatiegerichte opleiding heeft afgerond op minimaal hbo-niveau, of minimaal een hbo-opleiding
      in een andere richting heeft afgerond en aanvullende mens- of organisatiegerichte cursussen en trainingen heeft
      afgerond;

      b. minimaal drie jaar relevante werkervaring heeft; en

      c. verklaart zich te houden aan de gedragscode in [bijlage II][ref2].

      2 Een loopbaanadviseur wordt geacht aan de eisen in het eerste lid, onderdelen a en c, te hebben voldaan, wanneer
      hij is geregistreerd bij Noloc als Register Loopbaanprofessional.

      3 Een loopbaanadviseur, gevestigd in een van de andere lidstaten van de Europese Unie, een andere staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, die een opleiding heeft afgerond
      overeenkomstig de opleiding, bedoeld in het eerste lid, onderdeel a, en overigens voldoet aan het eerste lid,
      onderdelen b en c, wordt gelijkgesteld met de loopbaanadviseur, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0043015
