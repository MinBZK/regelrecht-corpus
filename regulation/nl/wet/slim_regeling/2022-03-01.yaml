  - number: '26'
    text: |-
      1 De subsidieaanvrager draagt zorg voor de evaluatie van de uitvoering van het initiatief op grond van deze
      regeling en het bereik, de doeltreffendheid en doelmatigheid daarvan.

      2 Het evaluatieverslag wordt gelijktijdig met de aanvraag tot subsidievaststelling aan de minister aangeboden.

      3 Het evaluatieverslag omvat in ieder geval:

      a. een beschrijving van het uitgevoerde initiatief;

      b. een beschrijving van het implementatie- en uitvoeringsproces en de leerervaringen die daarbij zijn opgedaan; en

      c. een overzicht van de bereikte resultaten.
    url: https://wetten.overheid.nl/BWBR0043015/2022-03-01#Artikel26
  - number: '27'
    text: |-
      1 De minister draagt zorg voor de evaluatie van de doeltreffendheid en doelmatigheid van deze regeling.

      2 De subsidieaanvrager werkt mee aan door of namens de minister ingesteld onderzoek dat erop is gericht de minister
      inlichtingen te verschaffen die van belang zijn voor de evaluatie van de doeltreffendheid en doelmatigheid van deze
      regeling en de ontwikkeling van het beleid van de minister. De subsidieaanvrager verstrekt in dat kader de daartoe
      benodigde inlichtingen, gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0043015/2022-03-01#Artikel27
  - number: '28'
    text: |-
      1 Deze regeling treedt in werking met ingang 1 januari 2020 en vervalt met ingang van 1 januari 2025.

      2 In afwijking van het eerste lid blijft deze regeling, zoals die luidde op 31 december 2024, van toepassing op de
      afwikkeling van verleende subsidies op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0043015/2022-03-01#Artikel28
  - number: '29'
    text: |-
      Deze regeling wordt aangehaald als: Stimuleringsregeling voor leren en ontwikkelen in mkb-ondernemingen en
      specifiek voor de grootbedrijven in de landbouw-, horeca- of recreatiesector.
    url: https://wetten.overheid.nl/BWBR0043015/2022-03-01#Artikel29
