  - number: '16'
    text: |-
      1 Voor zover het initiatief waarvoor subsidie wordt verleend een periode van meer dan twaalf maanden omvat,
      wordt door de subsidieaanvrager, uiterlijk acht weken na afloop van de eerste twaalf maanden, een tussentijds
      voortgangsverslag aan de minister overgelegd onder gebruikmaking van het daartoe door de minister elektronisch
      beschikbaar gestelde formulier.

      2 Na ontvangst van het tussentijds voortgangsverslag kan de minister op verzoek van de subsidieaanvrager,
      bedoeld in [artikel 19, eerste lid][ref1], of [artikel 22][ref2], gedaan bij indiening van het tussentijdse
      voortgangsverslag, bij beschikking een voorschot verstrekken van 80% van de gerealiseerde kosten zoals deze volgen
      uit het tussentijds voortgangsverslag.

      3 Bij het tussentijds voortgangsverslag wordt een bewijs overgelegd, dat aantoont dat de houder van het in het
      voortgangsverslag opgenomen bankrekeningnummer de hoofdaanvrager is, bedoeld in [artikel 19, eerste lid][ref3], dan
      wel de aanvraaggerechtigde, bedoeld in [artikel 22][ref4].


