      1 De subsidie die wordt verleend voor een van de in [artikel 4][ref1] genoemde initiatieven bedraagt niet meer dan
      € 25.000, met uitzondering van landbouwbedrijven, waarvoor een maximum geldt van € 20.000.

      2 Voor initiatieven als bedoeld onder [artikel 4, eerste lid, onderdeel a, b en c][ref2], bedraagt de subsidie:

      a. voor een kleine onderneming: 80% van de subsidiabele kosten;

      b. voor een middelgrote onderneming: 60% van de subsidiabele kosten.


