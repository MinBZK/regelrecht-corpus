  - number: '7'
    text: |-
      1 In de subsidieaanvraag wordt onder meer vermeld:

      a. een beschrijving van het initiatief waarvoor subsidie wordt aangevraagd;

      b. het bedrag waarvoor subsidie wordt aangevraagd.

      2 De subsidieaanvrager dient de subsidieaanvraag in door middel van een elektronisch aanvraagformulier getekend
      door een functionaris, bevoegd om namens de subsidieaanvrager te handelen, en vergezeld van een activiteitenplan
      en begroting.

      3 De subsidieaanvrager dient een de-minimisverklaring in. Indien sprake is van een samenwerkingsverband, is een de-
      minimisverklaring van alle partijen van het samenwerkingsverband vereist.

      4 Voor de opzet van het activiteitenplan wordt in het daarvoor geldende format, onverminderd
      [artikel 3.4 van de kaderregeling][ref1], in ieder geval opgenomen:

      a. op welke wijze het initiatief bijdraagt aan het in [artikel 3][ref2] omschreven doel;

      b. op welke wijze het initiatief wordt geëvalueerd;

      c. waarom subsidiëring vanuit de rijksoverheid in de gevraagde omvang noodzakelijk is.

      5 Per aanvraagtijdvak wordt per subsidieaanvrager, of partij in een samenwerkingsverband, maximaal één
      subsidieaanvraag in behandeling genomen. Brancheorganisaties, onderwijsinstellingen, O&O-fondsen en werknemers- of
      werkgeversverenigingen kunnen binnen een aanvraagtijdvak deelnemen in meerdere samenwerkingsverbanden en daardoor
      partij zijn bij meerdere subsidieaanvragen binnen hetzelfde aanvraagtijdvak.

      6 Een subsidieaanvraag kan bestaan uit meerdere activiteiten.

      7 Voor zover de subsidieaanvrager voor dezelfde begrote kosten of een deel daarvan ook subsidie of een andere
      financiële bijdrage heeft aangevraagd of zal aanvragen bij een ander bestuursorgaan of rechtspersoon, doet hij
      daarvan mededeling in de subsidieaanvraag, onder vermelding van de stand van zaken van de beoordeling van die
      andere aanvraag.

      8 Door het indienen van een aanvraag stemt de subsidieaanvrager ermee in dat het subsidiedossier, met uitzondering
      van persoonsgegevens, openbaar wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel3.4
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Artikel3
