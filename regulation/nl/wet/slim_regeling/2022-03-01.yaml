    text: |-
      1 Op het aanvragen en verstrekken van subsidies op grond van deze regeling is de [kaderregeling][ref1], met
      uitzondering van de [artikelen 3.1][ref2] en [7.1][ref3], van toepassing.

      2 De formulieren, modellen en formats waarnaar in deze regeling wordt verwezen, zijn door de minister elektronisch
      beschikbaar gesteld op www.uitvoeringvanbeleidszw.nl.


