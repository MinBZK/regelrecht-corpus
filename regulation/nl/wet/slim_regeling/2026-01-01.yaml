  - number: '2.2'
    text: |-
      Op het aanvragen en verstrekken van subsidies op grond van dit hoofdstuk is de [Kaderregeling][ref1]
      van toepassing, met uitzondering van de [artikelen 3.1][ref2], [3.6][ref3], [5.5, tweede lid][ref4],
      [6.1, vijfde lid][ref5], en [7.1][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0037603
      [ref2]: https://wetten.overheid.nl/BWBR0037603#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037603#Artikel3
