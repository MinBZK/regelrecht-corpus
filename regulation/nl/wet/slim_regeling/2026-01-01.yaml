preamble:
  text: |-
    Gelet op artikelen 3, eerste lid, en 5 van de Kaderwet SZW-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *aanvraagtijdvak:* een tijdvak waarin aanvragen voor subsidie op grond van
      deze regeling kunnen worden ingediend;
        - *de-minimisverklaring:* verklaring als bedoeld in artikel 7, vierde lid, van [Verordening (EU) 2023/2831]
      (32023R2831) van de Commissie van 13 december 2023 betreffende de toepassing van de artikelen 107 en 108 van het
      Verdrag betreffende de werking van de Europese Unie op de-minimissteun (PbEU L 2023/2831) waarvan het model is
      vastgesteld door de minister;
        - *kaderregeling:* de [Kaderregeling subsidies OCW, SZW en VWS][ref1];
        - *minister:* de Minister van Sociale Zaken en Werkgelegenheid;
        - *onderneming:* hetgeen daaronder wordt verstaan in artikel 1 van de Bijlage van Aanbeveling van de Europese
      Commissie van 6 mei 2003 betreffende de definitie van kleine, middelgrote en micro-ondernemingen (PbEU 2003,
      L 124);
        - *subsidieaanvrager:* de aanvrager van een subsidie op grond van deze regeling;
        - *subsidieontvanger:* de subsidieaanvrager aan wie op grond van deze regeling een subsidie is verleend;
        - *werkgeversvereniging:* een vereniging van werkgevers met volledige rechtsbevoegdheid, die ten tijde van
      de subsidieaanvraag partij is bij een op het moment van aanvraag geldende collectieve arbeidsovereenkomst, of
      een collectieve arbeidsvoorwaardenregeling voor personen werkzaam in openbare dienst, dan wel bij afwezigheid
      daarvan bij de laatst geldende collectieve arbeidsovereenkomst of collectieve arbeidsvoorwaardenregeling,
      dan wel een vereniging met volledige rechtsbevoegdheid van werkgevers die is aangesloten bij een centrale
      werkgeversorganisatie;
        - *werknemersvereniging:* vereniging van werknemers met volledige rechtsbevoegdheid, niet zijnde zelfstandigen
      zonder personeel, die partij is bij een op het moment van aanvraag geldende collectieve arbeidsovereenkomst of een
      collectieve arbeidsvoorwaardenregeling voor personen werkzaam in openbare dienst, dan wel bij afwezigheid daarvan
      bij de laatst geldende collectieve arbeidsovereenkomst of collectieve arbeidsvoorwaardenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0037603
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0037603
  - number: '1.2'
    text: |-
      De formulieren, modellen en formats waarnaar in deze regeling wordt verwezen, zijn door de minister elektronisch
      beschikbaar gesteld op [www.uitvoeringvanbeleidszw.nl](http://www.uitvoeringvanbeleidszw.nl).
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel1.2
  - number: '2.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *brancheorganisatie:* een organisatie, opgericht voor 1 januari 2020, die
      het doel van de regeling blijkens de statuten onderschrijft en de belangen behartigt van leden die tot eenzelfde
      bedrijfstak behoren;
        - *brutoloon:* bruto salaris, inclusief eindejaarsuitkering of een beloning in de vorm van een dertiende maand,
      zijnde een vast bedrag of vastgesteld percentage van het salaris, dat werkenden als extra loon ontvangen,
      voor zover dit is geregeld in de geldende collectieve arbeidsovereenkomst of arbeidsovereenkomst, exclusief
      vakantiegeld, exclusief overige vergoedingen, bijzondere beloningen, winst- of prestatieafhankelijke uitkeringen en
      aanvullende werkgeverslasten;
        - *initiatief:* een activiteit of reeks van activiteiten die leidt tot het stimuleren van leren en ontwikkelen in
      een mkb-onderneming of in een grootbedrijf in de landbouw-, horeca- of recreatiesector en dat gesubsidieerd wordt
      overeenkomstig hoofdstuk 2 van deze regeling;
        - *initiatiefperiode:* periode tussen het tijdstip waarop een initiatief start en wordt beëindigd;
        - *kleine onderneming:* een onderneming waar minder dan 50 personen werkzaam zijn en waarvan de jaaromzet of het
      jaarlijkse balanstotaal € 10 miljoen niet overschrijdt, berekend over het laatst afgesloten boekjaar voorafgaand
      aan de subsidieaanvraag;
        - *landbouwbedrijven:* ondernemingen die vallen onder het toepassingsgebied van artikel 1 van [Verordening (EU) nr.
      1408/2013](32013R1408) van de Commissie van 18 december 2013 (PbEU 2013, L 352);
        - *L&O-methode:* structurele inbedding van leer- en ontwikkelactiviteiten, die primair is gericht op het aanleren
      van nieuwe vaardigheden, kennis en beroepshoudingen van werkenden in de onderneming;
        - *middelgrote onderneming:* een onderneming, niet zijnde een kleine onderneming, waar minder dan 250 personen
      werkzaam zijn en waarvan de jaaromzet € 50 miljoen of het jaarlijkse balanstotaal € 43 miljoen niet overschrijdt,
      berekend over het laatst afgesloten boekjaar voorafgaand aan de subsidieaanvraag;
        - *mkb-onderneming:* een kleine of middelgrote onderneming;
        - *mkb-verklaring:* verklaring waarmee een mkb-onderneming verklaart een kleine of middelgrote onderneming te zijn
      als bedoeld in dit hoofdstuk;
        - *Noloc:* beroepsvereniging van loopbaanprofessionals Noloc;
        - *O&O-fonds:* een Opleidings- en Ontwikkelingsfonds, opgericht bij een bij de minister aangemelde collectieve
      arbeidsovereenkomst;
        - *onderwijsinstelling:* een instelling als bedoeld in
      [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref1], een andere instelling voor beroepsonderwijs als
      bedoeld in [artikel 1.4.1 van de Wet educatie en beroepsonderwijs][ref2] of een instelling voor hoger onderwijs als
      bedoeld in [artikel 1.1, onderdeel g, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3];
        - *samenwerkingsverband:* een bij overeenkomst vastgelegde samenwerking tussen ten minste twee mkb-
      ondernemingen eventueel aangevuld met een of meer organisaties, niet zijnde verbonden organisaties als bedoeld in
      [artikel 2.14, vijfde lid][ref4], waarbij iedere partij van het samenwerkingsverband een activiteit, vastgelegd in
      het activiteitenplan, uitvoert en geen van de partijen meer dan 80% van de kosten van de samenwerking draagt;
        - *werkenden:* alle in de onderneming werkzame personen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
