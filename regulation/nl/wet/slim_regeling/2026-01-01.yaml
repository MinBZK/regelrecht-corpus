  - number: '2.3'
    text: |-
      Het doel van subsidies verstrekt op grond van dit hoofdstuk is om een bijdrage te leveren aan initiatieven in mkb-
      ondernemingen, gericht op het stimuleren van leren en ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.3
  - number: 2.4.1
    text: |-
      De minister kan op aanvraag subsidie verstrekken voor het bekostigen van onderstaande activiteiten die uiting geven
      aan het doel, bedoeld in [artikel 2.3][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.4.1.a
    text: |-
      de doorlichting van de onderneming uitmondend in een opleidings- of ontwikkelplan gericht op het inzichtelijk maken
      van ontwikkelbehoefte om de leerrijke werkomgeving te versterken vanuit het perspectief van de onderneming;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.4
  - number: 2.4.1.b
    text: |-
      het verkrijgen van loopbaan- of ontwikkeladviezen ten behoeve van werkenden in de onderneming, of in geval van een
      samenwerkingsverband werkenden in andere mkb-ondernemingen; of
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.4
  - number: 2.4.1.c
    text: het ondersteunen en begeleiden bij het ontwikkelen of invoeren van een L&O-methode.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Een activiteit komt niet voor subsidie in aanmerking, indien de werkenden in de onderneming waarop de activiteit
      zich richt, enkel bestaan uit werkenden die bestuurder van de onderneming zijn of in het handelsregister, bedoeld
      in [artikel 2 van de Handelsregisterwet 2007][ref1], zijn geregistreerd als degenen aan wie de onderneming
      toebehoort.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 2.4.3
    text: |-
      Een loopbaan- of ontwikkeladviestraject als bedoeld in het eerste lid, onderdeel b, komt alleen voor subsidie in
      aanmerking indien de loopbaanadviseur individuele gesprekken met de deelnemer voert met een tijdsbeslag van in
      totaal minimaal vier uren.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.4
  - number: 2.4.4
    text: |-
      Een initiatief waarvoor subsidie wordt aangevraagd op grond van [paragraaf 2.2][ref1] en dat bestaat uit een
      activiteit als bedoeld in het eerste lid, onderdelen a en c, komt alleen voor subsidie in aanmerking indien de
      subsidiabele kosten ten minste € 5.000 bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0043015
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.4.5
    text: |-
      Een initiatief waarvoor subsidie wordt aangevraagd op grond van [paragraaf 2.3][ref1] komt alleen voor subsidie
      in aanmerking, indien het initiatief ten minste de activiteit, bedoeld in het eerste lid, onderdeel c, bevat en de
      subsidiabele kosten ten minste € 210.000 bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0043015
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.5.1
    text: |-
      De activiteiten, bedoeld in [artikel 2.4, eerste lid, onderdeel b][ref1], worden uitgevoerd door een
      loopbaanadviseur, die:


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.5.1.a
    text: |-
      een mens- of organisatiegerichte opleiding heeft afgerond op minimaal hbo-niveau, of minimaal een hbo-opleiding
      in een andere richting heeft afgerond en aanvullende mens- of organisatiegerichte cursussen en trainingen heeft
      afgerond;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.5
  - number: 2.5.1.b
    text: minimaal drie jaar relevante werkervaring heeft; en
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.5
  - number: 2.5.1.c
    text: |-
      verklaart zich te houden aan de gedragscode in [bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043015
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0043015
  - number: 2.5.2
    text: |-
      Een loopbaanadviseur wordt geacht aan de eisen in het eerste lid, onderdelen a en c, te hebben voldaan, wanneer hij
      is geregistreerd bij Noloc als Register Loopbaanprofessional.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.5
  - number: 2.5.3
    text: |-
      Een loopbaanadviseur, gevestigd in een van de andere lidstaten van de Europese Unie, een andere staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, die een opleiding heeft afgerond
      overeenkomstig de opleiding, bedoeld in het eerste lid, onderdeel a, en overigens voldoet aan het eerste lid,
      onderdelen b en c, wordt gelijkgesteld met de loopbaanadviseur, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.5
  - number: '2.6'
    text: 'Een subsidieaanvraag kan voor het jaar 2025 bij de minister worden ingediend in de volgende tijdvakken:'
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.6
  - number: 2.6.a
    text: |-
      voor aanvragen op grond van [paragraaf 2.2][ref1]: van 3 maart 09:00 uur tot en met 31 maart 17:00 uur en van
      1 september 09:00 uur tot en met 30 september 17:00 uur;


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0043015
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.6.b
    text: |-
      voor aanvragen op grond van [paragraaf 2.3][ref1]: van 2 juni 09:00 uur tot en met 30 juni 17:00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0043015
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.7.1
    text: |-
      Het subsidieplafond voor subsidies op grond van [paragraaf 2.2][ref1] bedraagt voor het jaar 2025:


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0043015
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.7.1.a
    text: € 12,5 miljoen voor het tijdvak in maart;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.7
  - number: 2.7.1.b
    text: € 17,5 miljoen voor het tijdvak in september.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.7
  - number: 2.7.2
    text: |-
      Het subsidieplafond voor subsidies op grond van [paragraaf 2.3][ref1] bedraagt voor het jaar 2025 € 20 miljoen.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0043015
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.7.3
    text: |-
      Indien een deel van het bedrag dat beschikbaar is in een aanvraagtijdvak niet volledig wordt benut, kunnen de
      resterende middelen worden toegevoegd aan de middelen van een ander aanvraagtijdvak van hetzelfde kalenderjaar.
      De minister maakt de verschuivingen van het beschikbare budget bekend op [www.uitvoeringvanbeleidszw.nl](http://
      www.uitvoeringvanbeleidszw.nl).
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.7
  - number: 2.8.1
    text: |-
      De subsidieaanvrager dient de subsidieaanvraag in door middel van het daartoe bestemde elektronisch
      aanvraagformulier dat is getekend door een functionaris, bevoegd om namens de subsidieaanvrager te handelen, en
      voegt hierbij:
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.8
  - number: 2.8.1.a
    text: een activiteitenplan;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.8
  - number: 2.8.1.b
    text: een begroting; en
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.8
  - number: 2.8.1.c
    text: een bewijs dat de subsidieaanvrager de houder is van het bankrekeningnummer dat in de aanvraag is opgenomen.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.8
  - number: 2.8.2
    text: |-
      De subsidieaanvrager dient een de-minimisverklaring in en, indien de subsidieaanvrager een mkb-onderneming is,
      een mkb-verklaring. Indien sprake is van een samenwerkingsverband, is een de-minimisverklaring vereist van alle
      partijen van het samenwerkingsverband en een mkb-verklaring van alle partijen van het samenwerkingsverband die een
      mkb-onderneming zijn.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.8
  - number: 2.8.3
    text: |-
      Het activiteitenplan, de begroting, de de-minimisverklaring en de mkb-verklaring worden opgesteld overeenkomstig
      het door de minister vastgestelde model.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.8
  - number: 2.8.4
    text: |-
      Per aanvraagtijdvak wordt per subsidieaanvrager, of partij in een samenwerkingsverband, maximaal één
      subsidieaanvraag in behandeling genomen. Brancheorganisaties, onderwijsinstellingen, O&O-fondsen en werknemers- of
      werkgeversverenigingen kunnen binnen een aanvraagtijdvak deelnemen in meerdere samenwerkingsverbanden en daardoor
      partij zijn bij meerdere subsidieaanvragen binnen hetzelfde aanvraagtijdvak.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.8
  - number: 2.8.5
    text: Een subsidieaanvraag kan bestaan uit meerdere activiteiten.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.8
  - number: 2.8.6
    text: |-
      Voor zover de subsidieaanvrager voor dezelfde begrote kosten of een deel daarvan ook subsidie of een andere
      financiële bijdrage heeft aangevraagd of zal aanvragen bij een ander bestuursorgaan of rechtspersoon, doet hij
      daarvan mededeling in de subsidieaanvraag, onder vermelding van de stand van zaken van de beoordeling van die
      andere aanvraag.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.8
  - number: 2.8.7
    text: |-
      Door het indienen van een aanvraag stemt de subsidieaanvrager ermee in dat het subsidiedossier, met uitzondering
      van persoonsgegevens, openbaar wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.8
  - number: '2.9'
    text: |-
      De minister is bevoegd persoonsgegevens, die hij in het kader van subsidies die zijn aangevraagd op grond van dit
      hoofdstuk heeft verkregen, te verstrekken aan de aanbieder van een kennis- en ondersteuningsprogramma ten behoeve
      van subsidies die zijn aangevraagd op grond van dit hoofdstuk, ter uitvoering en verbetering van dat programma.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.9
  - number: 2.10.1
    text: |-
      Bij overschrijding van een subsidieplafond als bedoeld in [artikel 2.7, eerste lid][ref1], wordt na afloop van
      het aanvraagtijdvak door middel van loting de volgorde vastgesteld waarin de ontvangen subsidieaanvragen worden
      afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.10.2
    text: |-
      Indien een subsidieaanvrager meerdere aanvragen heeft ingediend voor soortgelijke of vergelijkbare initiatieven,
      wordt slechts de als eerste ingediende aanvraag in de loting meegenomen.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.10
  - number: 2.10.3
    text: |-
      Onvolledige subsidieaanvragen voor subsidies op grond van [paragraaf 2.2][ref1] worden, na aanvulling door de
      subsidieaanvrager, geplaatst aan het einde van de lijst die volgt uit de loting, waarbij het tijdstip van ontvangst
      van de volledige subsidieaanvraag bepalend is voor de volgorde van plaatsing op die lijst.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0043015
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.10.4
    text: |-
      Volledige subsidieaanvragen voor subsidies op grond van [paragraaf 2.3][ref1] worden behandeld op volgorde van
      ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0043015
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.11.1
    text: |-
      Op een subsidieaanvraag op basis van [paragraaf 2.2][ref1] wordt binnen 13 weken na afloop van het aanvraagtijdvak,
      bedoeld in [artikel 2.6][ref2] beslist. De subsidieaanvraag wordt beoordeeld op grond van de voorwaarden, bedoeld
      in [artikel 2.8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0043015
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.11.2
    text: |-
      Op een subsidieaanvraag op basis van [paragraaf 2.3][ref1] wordt binnen 13 weken na ontvangst beslist. De
      subsidieaanvraag wordt beoordeeld op grond van de voorwaarden, bedoeld in [artikel 2.8][ref2], en de eisen, bedoeld
      in [artikel 2.23][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0043015
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.11.3
    text: |-
      Indien de minister op grond van [artikel 2.18, tweede lid][ref1], een voorschot verleent, vermeldt de beschikking
      tot subsidieverlening, onverminderd [artikel 4.2, eerste lid, van de Kaderregeling][ref2], de wijze van
      bevoorschotting.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037603#Artikel4
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037603
        artikel: '4'
  - number: 2.11.4
    text: |-
      In geval van een samenwerkingsverband vermeldt de beschikking tot subsidieverlening, in aanvulling op het derde
      lid, de partijen van het samenwerkingsverband en de verdeling van het subsidiebedrag van de partijen in het
      samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.11
  - number: '2.12'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] wordt de subsidie in ieder geval geheel of
      gedeeltelijk geweigerd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.12.a
    text: de subsidieaanvraag niet voldoet aan de bij deze regeling gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.12
  - number: 2.12.b
    text: de beoogde initiatieven en resultaten onvoldoende meetbaar zijn geformuleerd;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.12
  - number: 2.12.c
    text: de haalbaarheid van de beoogde aanpak onvoldoende aannemelijk is gemaakt;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.12
  - number: 2.12.d
    text: |-
      de evaluatieopzet onvoldoende of ongeschikt is om de effectiviteit en bruikbaarheid van een initiatief te kunnen
      beoordelen;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.12
  - number: 2.12.e
    text: een initiatief niet uitvoerbaar is binnen bestaande wet- en regelgeving;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.12
  - number: 2.12.f
    text: |-
      onvoldoende is aangetoond dat subsidie noodzakelijk is voor het uitvoeren van een initiatief waarvoor subsidie
      wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.12
  - number: 2.12.g
    text: |-
      op grond van deze regeling binnen hetzelfde aanvraagtijdvak reeds subsidie is verleend voor een soortgelijk of
      vergelijkbaar initiatief ten behoeve van dezelfde onderneming of hetzelfde samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.12
  - number: 2.12.h
    text: er geen de-minimisverklaring en, indien van toepassing, mkb-verklaring is afgegeven;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.12
  - number: 2.12.i
    text: |-
      de subsidieaanvraag tot gevolg heeft dat een subsidieplafond als bedoeld in [artikel 2.7][ref1] wordt overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.12.j
    text: |-
      de subsidieaanvraag ziet op het ontwikkelen van een initiatief niet bedoeld voor werkenden in de onderneming maar
      voor commerciële doeleinden; of
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.12
  - number: 2.12.k
    text: |-
      de subsidieaanvraag ziet op een activiteit als bedoeld in [artikel 2.4, eerste lid, onderdeel a of c][ref1], en aan
      de subsidieaanvrager voor een dergelijke activiteit reeds subsidie is verleend die op het moment van indiening van
      de subsidieaanvraag nog niet is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.13.1
    text: |-
      Een initiatief voor subsidies op grond van [paragraaf 2.2][ref1] wordt afgerond binnen een periode van 12 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0043015
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.13.2
    text: |-
      Een initiatief voor subsidies op grond van [paragraaf 2.3][ref1] wordt afgerond binnen een periode van 24 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0043015
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.13.3
    text: |-
      De voor subsidie in aanmerking komende kosten worden gemaakt in een door de minister aangewezen initiatiefperiode.
      Deze periode start de dag na dagtekening van het besluit tot verlening van de subsidie.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.13
  - number: 2.13.4
    text: |-
      Indien een subsidieontvanger vanwege omstandigheden die niet aan hem zijn toe te rekenen, het initiatief waarvoor
      subsidie is verleend naar verwachting niet binnen de initiatiefperiode, bedoeld in het derde lid, zal kunnen
      afronden, kan de subsidieontvanger de minister verzoeken om de duur van de initiatiefperiode te verlengen.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.13
  - number: 2.13.5
    text: |-
      De minister kan, in afwijking van het eerste en tweede lid, de duur van de initiatiefperiode verlengen tot ten
      hoogste drie maanden na de van toepassing zijnde periode, genoemd in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.13
  - number: 2.14.1
    text: |-
      Voor de subsidie van initiatieven als bedoeld onder [artikel 2.4, eerste lid, onderdeel a en c][ref1], komen de
      volgende kosten in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.14.1.a
    text: externe kosten die daadwerkelijk zijn gemaakt ter uitvoering van een subsidiabel initiatief;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.1.b
    text: |-
      directe loonkosten van de personen die zich in het bedrijf van de subsidieaanvrager of een van de partijen van het
      samenwerkingsverband bezighouden met de uitvoering van het initiatief, berekend op basis van het brutoloon van die
      personen en vermeerderd met een opslag van 32%, naar rato van individuele gerealiseerde uren en uitgaande van 1.720
      werkbare uren op jaarbasis;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.1.c
    text: een toeslag van 15% op de onder a en b bedoelde kosten ter subsidiëring van overige gemaakte kosten; en
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.1.d
    text: |-
      de kosten van een controleverklaring, in de vorm van een vast bedrag van € 3.000, indien een controleverklaring
      voor de vaststelling van de subsidie is vereist.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.2
    text: |-
      De kosten zijn, met uitzondering van het eerste lid, onderdeel c, door de subsidieaanvrager daadwerkelijk gemaakt
      en betaald, ten laste van het initiatief gebleven en rechtstreeks aan het initiatief toe te rekenen.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.3
    text: 'Voor externe opdrachten wordt de marktconformiteit van de kosten bepaald door:'
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.3.a
    text: |-
      een offerteprocedure waarbij ten minste drie offertes zijn aangevraagd en beoordeeld door de subsidieaanvrager,
      indien deze kosten meer bedragen dan € 50.000; of
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.3.b
    text: een transparante, objectieve en niet-discriminatoire aanbestedingsprocedure.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.4
    text: |-
      Wordt gebruik gemaakt van een externe adviseur dan is het subsidiabele uurtarief maximaal € 125 per uur exclusief
      btw en is een offerteprocedure als bedoeld in het derde lid, aanhef en onderdeel a, niet vereist. Het uurtarief
      bedraagt maximaal € 135 per uur exclusief BTW voor subsidies die zijn aangevraagd in het jaar 2024 of 2025.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.5
    text: |-
      Voor zover activiteiten zijn uitgevoerd door de volgende partijen, zijn uitsluitend de directe loonkosten als
      bedoeld in het eerste lid, onderdeel b, subsidiabel:
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.5.a
    text: de subsidieontvanger of een partij in het samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.5.b
    text: |-
      een organisatie die, direct of indirect, is vertegenwoordigd in het bestuur van de subsidieontvanger of in het
      bestuur van een partij in het samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.5.c
    text: |-
      een organisatie waarin één of meer van dezelfde partijen in het bestuur zijn vertegenwoordigd, die tegelijkertijd
      ook:
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.5.c.1°
    text: in het bestuur van de subsidieontvanger zijn vertegenwoordigd; of
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.5.c.2°
    text: in het bestuur van een partij in het samenwerkingsverband zijn vertegenwoordigd;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.5.d
    text: |-
      een organisatie waarin een persoon een financieel belang heeft of in het bestuur zit van die organisatie, en die
      persoon ook werkzaam is voor:
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.5.d.1°
    text: de subsidieontvanger; of
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.5.d.2°
    text: een partij uit het samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.5.e
    text: |-
      een organisatie waarin de subsidieontvanger of een partij uit het samenwerkingsverband, direct of indirect invloed
      kan uitoefenen of een financieel belang heeft; of
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: 2.14.5.f
    text: |-
      een organisatie waarin zich een belangenconflict voordoet of kan voordoen als gevolg van familiebanden,
      persoonlijke relaties, politieke gezindheid of nationaliteit, economische belangen of elk ander direct of indirect
      persoonlijk belang, waarmee de onpartijdige en objectieve uitoefening van de functies van een financiële actor
      of andere persoon die bij de uitvoering van het initiatief betrokken is, in gevaar is of in gevaar kan worden
      gebracht.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.14
  - number: '2.15'
    text: |-
      Met betrekking tot de initiatieven, bedoeld onder [artikel 2.4, eerste lid, onderdeel a en c][ref1], komen niet
      voor subsidie in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.15.a
    text: onredelijk en niet noodzakelijk gemaakte kosten ter uitvoering van het initiatief of een onderdeel daarvan;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.15
  - number: 2.15.b
    text: |-
      loonverletkosten, zijnde de loonkosten van werkenden voor niet-productieve uren als gevolg van deelname aan
      subsidiabele activiteiten, voor zover die hebben geleid tot een vermindering van de werkbare uren voor de
      ondernemer;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.15
  - number: 2.15.c
    text: |-
      kosten voor overhead en aan overhead gerelateerde exploitatiekosten, zijnde alle niet directe kosten waaronder
      onder andere begrepen huisvestingskosten, kosten voor een werkplek, reiskosten, afschrijvingskosten en de
      kosten voor administratie en beheer, waaronder accountantskosten, met uitzondering van de kosten, bedoeld in
      [artikel 2.14, eerste lid, onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.15.d
    text: kosten gemaakt buiten de initiatiefperiode;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.15
  - number: 2.15.e
    text: kosten die in aanmerking komen voor andere financiering van overheidswege;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.15
  - number: 2.15.f
    text: externe kosten waarvoor geen factuur kan worden overgelegd;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.15
  - number: 2.15.g
    text: kosten die voortvloeien uit wettelijk verplichte taken;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.15
  - number: 2.15.h
    text: opleidingskosten;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.15
  - number: 2.15.i
    text: btw;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.15
  - number: 2.15.j
    text: |-
      de kosten voor de doorlichting van de onderneming, bedoeld in [artikel 2.4, eerste lid, onderdeel a][ref1], indien
      deze onvoldoende duidelijk is toegesneden op de scholingsbehoefte vanuit het perspectief van de desbetreffende mkb-
      onderneming; of


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.15.k
    text: |-
      de kosten voor de ondersteuning en begeleiding bij het ontwikkelen of invoeren van een methode in de onderneming
      als bedoeld in [artikel 2.4, eerste lid, onderdeel c][ref1], indien deze onvoldoende duidelijk is toegesneden op
      desbetreffende mkb-onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.16'
    text: |-
      De subsidie voor loopbaan- en ontwikkeladviezen als bedoeld in [artikel 2.4, eerste lid, onderdeel b][ref1],
      bedraagt € 700,– per afgerond loopbaan- of ontwikkeltraject.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.17.1
    text: |-
      Onverminderd [artikel 5.2, eerste lid, van de Kaderregeling][ref1], bevat de administratie van de
      subsidieontvanger een bijlage met een overzicht van de KvK-nummers van alle ondernemingen die deelnemen aan het
      project, onder vermelding van de activiteiten waaraan is deelgenomen en, indien de subsidie is verleend voor een
      activiteit als bedoeld in:


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel5
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '5'
  - number: 2.17.1.a
    text: |-
      [artikel 2.4, eerste lid, onderdeel a][ref1], het opleidings- of ontwikkelplan dat voortkomt uit de doorlichting;


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.17.1.b
    text: |-
      [artikel 2.4, eerste lid, onderdeel b][ref1], een prestatieverklaring van de loopbaanscan of het ontwikkeladvies,
      getekend door de adviseur en de deelnemer;


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.17.1.c
    text: |-
      [artikel 2.4, eerste lid, onderdeel c][ref1], de met de gerealiseerde methode gemoeide producten.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.17.2
    text: |-
      Onder een prestatieverklaring, genoemd in het eerste lid, onderdeel b, wordt verstaan: een verklaring in het
      daarvoor geldende format, getekend door de loopbaanadviseur en de deelnemer, waarin wordt bevestigd dat de
      deelnemer aan het ontwikkeltraject heeft deelgenomen, welke onderwerpen daarin aan bod zijn gekomen en welke
      resultaten hiervoor zijn behaald.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.17
  - number: 2.18.1
    text: |-
      Indien de subsidieontvanger een samenwerkingsverband is en het initiatief waarvoor subsidie is verleend een periode
      van meer dan twaalf maanden omvat, dient de subsidieontvanger uiterlijk acht weken na afloop van de eerste twaalf
      maanden een tussentijds voortgangsverslag in bij de minister, onder gebruikmaking van het daartoe door de minister
      elektronisch beschikbaar gestelde model.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.18
  - number: 2.18.2
    text: 'De minister kan bij de beschikking tot subsidieverlening een voorschot verlenen van:'
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.18
  - number: 2.18.2.a
    text: |-
      50% van de verleende subsidie, indien de subsidie is aangevraagd door een subsidieaanvrager als bedoeld in
      [artikel 2.19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.18.2.b
    text: |-
      25% van de verleende subsidie, indien de subsidie is aangevraagd door een subsidieaanvrager als bedoeld in
      [artikel 2.21, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.18.2.c
    text: |-
      50% van de verleende subsidie, in aanvulling op het voorschot, genoemd in onderdeel b, en uit te betalen na
      indiening van het tussentijdse voortgangsverslag, indien de looptijd van het initiatief meer dan twaalf maanden
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.18
  - number: '2.19'
    text: Subsidie op grond van dit hoofdstuk wordt aangevraagd door een mkb-onderneming.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.19
  - number: 2.20.1
    text: |-
      Voor de activiteiten, bedoeld in [artikel 2.4, eerste lid][ref1], wordt op grond van dit hoofdstuk een subsidie
      verstrekt tot € 25.000, met uitzondering van landbouwbedrijven, waarvoor een maximum geldt van € 20.000.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.20.2
    text: |-
      Voor de activiteiten, bedoeld in [artikel 2.4, eerste lid, onderdelen a en c][ref1], bedraagt de subsidie 60% van
      de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.21.1
    text: Subsidie op grond van dit hoofdstuk wordt aangevraagd door de hoofdaanvrager van het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.21
  - number: 2.21.2
    text: |-
      Onder hoofdaanvrager wordt verstaan een mkb-onderneming, brancheorganisatie, onderwijsinstelling, O&O-fonds of
      werknemers- of werkgeversvereniging, die gemachtigd is om de andere partijen in het samenwerkingsverband in en
      buiten rechte te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.21
  - number: 2.22.1
    text: |-
      De subsidie die wordt verleend voor de activiteiten, bedoeld in [artikel 2.4, eerste lid][ref1], bedraagt maximaal
      € 500.000, waarbij geen enkele partij van het samenwerkingsverband aanspraak kan maken op € 200.000 of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.22.2
    text: |-
      In afwijking van het eerste lid is de maximale subsidie bij deelname aan een samenwerkingsverband voor
      landbouwbedrijven € 20.000, voor visserijbedrijven € 30.000 en voor goederenververvoer over de weg € 100.000.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.22
  - number: 2.22.3
    text: |-
      Voor de activiteiten, bedoeld in [artikel 2.4, eerste lid, onderdelen a en c][ref1], bedraagt
      de subsidie 60% van de subsidiabele kosten, voor zover het de kosten betreft, bedoeld in
      [artikel 2.14, eerste lid, onderdelen a tot en met c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.23.1
    text: |-
      In aanvulling op [artikel 2.8][ref1] bestaat de subsidieaanvraag voor samenwerkingsverbanden uit:


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.23.1.a
    text: |-
      de samenwerkingsovereenkomst van het samenwerkingsverband, ondertekend door alle partijen die onderdeel uitmaken
      van het samenwerkingsverband, vergezeld van een schriftelijke machtiging waaruit blijkt dat de subsidieaanvrager
      gemachtigd is de andere partijen in het samenwerkingsverband in en buiten rechte te vertegenwoordigen; en
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.23
  - number: 2.23.1.b
    text: een begroting waaruit de verdeling van kosten tussen de partijen in het samenwerkingsverband volgt.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.23
  - number: 2.23.2
    text: |-
      De hoofdaanvrager is verantwoordelijk voor de administratievoorschriften van alle partijen in het
      samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.23
  - number: 2.24.1
    text: |-
      De minister doet verzoeken als bedoeld in [artikel 7.4, eerste lid, van de Kaderregeling][ref1] op basis van een
      steekproef voorafgaande aan het vaststellen van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel7
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '7'
  - number: 2.24.2
    text: |-
      Een samenwerkingsverband waaraan subsidie is verleend op grond van deze regeling dient door middel
      van een elektronisch formulier binnen 22 weken na afloop van de initiatiefperiode, bedoeld in
      [artikel 2.13, derde lid][ref1], bij de minister een verzoek in tot vaststelling van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.24.3
    text: |-
      Het verzoek tot vaststelling gaat, onverminderd [artikel 7.8 van de Kaderregeling][ref1], vergezeld van een
      evaluatieverslag als bedoeld in [artikel 2.26][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.24.4
    text: |-
      Het activiteitenverslag en het financieel verslag, bedoeld in de [Kaderregeling][ref1], worden opgesteld
      overeenkomstig het door de minister vastgestelde model.


      [ref1]: https://wetten.overheid.nl/BWBR0037603
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0037603
  - number: 2.24.5
    text: |-
      In afwijking van [artikel 1.1 van de Kaderregeling][ref1] is het bij het opstellen van de
      controleverklaring in acht te nemen accountantsprotocol, genoemd in dat artikel, gepubliceerd op de website
      [www.uitvoeringvanbeleidszw.nl](http://www.uitvoeringvanbeleidszw.nl/).


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel1
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '1'
  - number: 2.24.6
    text: |-
      Indien uit de beoordeling van het verzoek tot vaststelling blijkt, dat minder dan 60% van de totale subsidiabele
      kosten, genoemd in de laatst afgegeven beschikking tot subsidieverlening, is gerealiseerd, gaat de minister na of
      er aanleiding is om de subsidie lager of op nihil vast te stellen.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.24
  - number: 2.25.1
    text: |-
      Onverminderd [artikel 4:48 van de Algemene wet bestuursrecht][ref1] wordt de beschikking tot subsidieverlening
      geheel ingetrokken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.25.1.a
    text: de subsidie niet is besteed aan de in de beschikking tot subsidieverlening toegekende subsidiabele kosten;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.25
  - number: 2.25.1.b
    text: de in de beschikking tot subsidieverlening opgegeven verplichtingen niet zijn nageleefd.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.25
  - number: 2.25.2
    text: |-
      De beschikking tot subsidieverlening of de beschikking tot subsidievaststelling kan, in afwijking van het eerste
      lid, gedeeltelijk worden ingetrokken indien er naar het oordeel van de minister geen aanleiding is de subsidie
      geheel in te trekken.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.25
  - number: 2.25.3
    text: |-
      Indien de beschikking tot subsidievaststelling geheel of gedeeltelijk wordt ingetrokken, wordt het subsidiebedrag
      dat tot dat moment is uitgekeerd, vermeerderd met de wettelijke rente, geheel of gedeeltelijk van de
      subsidieontvanger teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.25
  - number: 2.25.4
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op de beschikking tot voorschotverlening,
      bedoeld in [artikel 2.18, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.26.1
    text: |-
      Een samenwerkingsverband waaraan subsidie is verleend op grond van deze regeling draagt zorg voor de evaluatie van
      de uitvoering van het initiatief op grond van deze regeling en het bereik, de doeltreffendheid en doelmatigheid
      daarvan.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.26
  - number: 2.26.2
    text: Het evaluatieverslag wordt gelijktijdig met de aanvraag tot subsidievaststelling aan de minister aangeboden.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.26
  - number: 2.26.3
    text: 'Het evaluatieverslag omvat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.26
  - number: 2.26.3.a
    text: een beschrijving van het uitgevoerde initiatief;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.26
  - number: 2.26.3.b
    text: een beschrijving van het implementatie- en uitvoeringsproces en de leerervaringen die daarbij zijn opgedaan; en
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.26
  - number: 2.26.3.c
    text: een overzicht van de bereikte resultaten.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel2.26
  - number: '3.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *aanbieder:* aanbieder in de zin van
      [artikel 1 van het Besluit NLQF][ref1];
        - *begunstigden:* personen waarop de leerplicht, bedoeld in [artikel 3 van de Leerplichtwet 1969][ref2] niet meer
      van toepassing is, die de pensioengerechtigde leeftijd, bedoeld in [artikel 7a van de Algemene ouderdomswet][ref3],
      nog niet hebben bereikt en die: a. betaalde arbeid verrichten; b. in aanmerking komen voor ondersteuning bij
      arbeidsinschakeling op grond van de [artikelen 30a van de Wet SUWI][ref4], [73 van de Werkloosheidswet][ref5]
      of [7, eerste lid, onderdeel a][ref6], of [7a, eerste lid, onderdeel a, van de Participatiewet][ref7];
      of c. een persoon zijn als bedoeld in de [artikelen 38b, eerste en tweede lid][ref8], of
      [38f, vijfde lid, van de Wet financiering sociale verzekeringen][ref9];
        - *beroepsgroepen in maatschappelijk cruciale sectoren:* de beroepsgroepen en beroepen die zijn opgenomen in
      [bijlage II][ref10] bij deze regeling en behoren tot de beroepsklassen pedagogische beroepen, technische beroepen,
      ICT-beroepen, transport en logistiekberoepen, beroepen in de agrifood en natuur & leefomgeving en zorg- en
      welzijnsberoepen;
        - *collectief:* een O&O-fonds of een bij overeenkomst vastgelegde samenwerking waaraan de volgende partijen
      deelnemen: a. een of meer werkgeversverenigingen en een of meer werknemersverenigingen die een band hebben met
      een of meer beroepsgroepen in maatschappelijk cruciale sectoren, eventueel aangevuld met een O&O-fonds, een
      koepelorganisatie of het college van burgemeester en wethouders van een of meer centrumgemeenten als bedoeld in
      [artikel 2.4, tweede lid, van het Besluit SUWI][ref11], en, indien een college van burgemeester en wethouders van
      een centrumgemeente deelneemt, de gedeputeerde staten van een of meer provincies; dan wel b. een O&O-fonds dan
      wel koepelorganisatie en ten minste een van de partijen, genoemd in onderdeel a, met inachtneming van het daarin
      bepaalde over de deelname van de gedeputeerde staten van een of meer provincies;
        - *geregistreerd gastouderbureau:* een geregistreerd gastouderbureau als bedoeld in de [Wet kinderopvang][ref12];
        - *koepelorganisatie:* een landelijk opererende organisatie die door een of meer werkgeversverenigingen en een of
      meer werknemersverenigingen die een band hebben met een of meer beroepsgroepen in maatschappelijk cruciale sectoren
      is aangewezen om een of meerdere sectoren te vertegenwoordigen;
        - *non-formele opleiding:* een non-formele opleiding als bedoeld in de [Wet NLQF][ref13], met uitzondering van non-
      formele opleidingen die alleen zijn bestemd voor werkenden in de eigen onderneming;
        - *O&O-fonds:* een stichting of vereniging die als doel heeft het optimaliseren van de werking van de
      arbeidsmarkt en die: a. is opgericht bij een bij de minister aangemelde collectieve arbeidsovereenkomst;
      b. paritair wordt bestuurd door vertegenwoordigers van een of meer arbeidsorganisaties, waarbij in ieder
      geval bij een arbeidsorganisatie ten minste 500 werknemers werkzaam zijn, alsmede vertegenwoordigers van
      een of meer werknemersverenigingen; of c. paritair wordt bestuurd door vertegenwoordigers van een of meer
      werkgeversverenigingen alsmede vertegenwoordigers van een of meer werknemersverenigingen;
        - *ontwikkelpad:* een overzicht van opeenvolgende functies en eventuele daarbij behorende specialisaties met
      de opleidingen of onderdelen daarvan die voor deze functies en specialisaties benodigd zijn, dat is bedoeld ter
      stimulering van: a. de instroom van werkzoekenden in een sector; b. de doorstroom of specialisatie van werkenden
      binnen een sector, gericht op de uitvoering van nieuwe functies of specialisaties; en c. het overstappen van
      werkenden naar een sector;
        - *opleider:* degene die: a. volgens de Registratie instellingen en opleidingen gerechtigd is een
      opleiding als bedoeld in [artikel 3.6, eerste lid, onderdeel c, subonderdelen 1 tot en met 3][ref14],
      aan te bieden; of b. in een scholingspakket als opleider bij de opleiding, genoemd in
      [artikel 3.6, eerste lid, onderdeel c, subonderdeel 4][ref15], is opgenomen;
        - *werkgever:* de subsidieaanvrager bij wie de werkzaamheden waarvoor wordt opgeleid worden uitgevoerd of die
      daartoe arbeidskrachten ter beschikking stelt aan een derde, en die: a. een arbeidsovereenkomst met de begunstigde
      van de scholing heeft; of b. afspraken heeft met de gemeente of het UWV over de scholing van de begunstigde,
      genoemd in artikel 3.1, onderdeel b, van de begripsbepaling begunstigden.


      [ref1]: https://wetten.overheid.nl/BWBR0050303#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel73
      [ref6]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0015703#Artikel7a
      [ref8]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
      [ref9]: https://wetten.overheid.nl/BWBR0017745#Artikel38f
      [ref10]: https://wetten.overheid.nl/BWBR0043015
      [ref11]: https://wetten.overheid.nl/BWBR0013267#Artikel2
      [ref12]: https://wetten.overheid.nl/BWBR0017017
      [ref13]: https://wetten.overheid.nl/BWBR0050058
      [ref14]: https://wetten.overheid.nl/BWBR0043015#Artikel3
      [ref15]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0050303
        artikel: '1'
      - id: ref2
