        artikel: '3'
        hoofdstuk: '3'
  - number: '3.2'
    text: |-
      Op het aanvragen en verstrekken van subsidies op grond van dit hoofdstuk is de [Kaderregeling][ref1] van
      toepassing, met uitzondering van de [artikelen 3.1][ref2], [3.6][ref3],[7.1][ref4] en [7.4, tweede lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037603
      [ref2]: https://wetten.overheid.nl/BWBR0037603#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037603#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037603#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0037603#Artikel7
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0037603
      - id: ref2
        bwb_id: BWBR0037603
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0037603
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0037603
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0037603
        artikel: '7'
  - number: '3.3'
    text: |-
      Het doel van subsidies verstrekt op grond van dit hoofdstuk is om met scholing de instroom in en doorstroom binnen
      sectoren en het overstappen tussen sectoren van werkenden en werkzoekenden in beroepsgroepen in maatschappelijk
      cruciale sectoren te vergroten.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      Subsidies op grond van dit hoofdstuk worden aangevraagd door een werkgever, een geregistreerd gastouderbureau of
      een collectief.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.4
  - number: 3.5.1
    text: |-
      De minister kan op aanvraag subsidie verstrekken aan een werkgever of geregistreerd gastouderbureau voor scholing
      die door hem is ingekocht en aan een collectief voor het inkopen van scholing of het vergoeden van scholingskosten.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.5
  - number: 3.5.2
    text: 'Een scholing is subsidiabel op grond van dit hoofdstuk, indien:'
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.5
  - number: 3.5.2.a
    text: |-
      de scholing op het moment van inkoop is opgenomen in een ontwikkelpad dat de minister op grond van
      [artikel 3.6][ref1] heeft erkend;


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.2.b
    text: |-
      het ontwikkelpad waarin de scholing is opgenomen voor het merendeel betrekking heeft op beroepsgroepen in
      maatschappelijk cruciale sectoren;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.5
  - number: 3.5.2.c
    text: |-
      het een scholing betreft als bedoeld in [artikel 3.6, eerste lid, onderdeel c, subonderdelen 1 tot en met 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.2.d
    text: |-
      de scholing wordt verzorgd door een opleider die gerechtigd is om de gehele non-formele opleiding te
      verzorgen, indien het scholing betreft die een onderdeel uitmaakt van een non-formele opleiding als bedoeld in
      [artikel 3.6, eerste lid, onderdeel c, subonderdeel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.2.e
    text: |-
      de scholing niet op grond van toepasselijk Unierecht, toepasselijk nationaal recht, een collectieve
      arbeidsovereenkomst of een regeling door of namens een daartoe bevoegd bestuursorgaan verplicht is om arbeid te
      kunnen blijven verrichten;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.5
  - number: 3.5.2.f
    text: de scholing niet op grond van wet- en regelgeving volledig wordt bekostigd;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.5
  - number: 3.5.2.g
    text: de scholing is bedoeld voor een begunstigde en kosteloos aan hem wordt aangeboden; en
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.5
  - number: 3.5.2.h
    text: |-
      de scholing op zijn vroegst is gestart op 28 februari 2025 en niet later dan 13 weken na indiening van de
      subsidieaanvraag, voor zover het scholing betreft waarvoor subsidie is aangevraagd door een werkgever of
      geregistreerd gastouderbureau.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.5
  - number: 3.5.3
    text: |-
      In afwijking van het tweede lid, onderdeel c, is tot 1 mei 2026 scholing als bedoeld in
      [artikel 3.6, eerste lid, onderdeel c, subonderdeel 5][ref1], tevens subsidiabel, indien de aanbieder van de
      scholing een aanvraag als bedoeld in [artikel 3.1 van de Wet NLQF][ref2] heeft ingediend voor de non-formele
      opleiding en het Nationaal coördinatiepunt NLQF, genoemd in de [Wet NLQF][ref3], heeft geoordeeld dat de aanvraag
      volledig is. Het tweede lid, onderdeel d, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050058#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0050058
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0050058
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0050058
  - number: 3.5.4
    text: |-
      Het derde lid is voor een aanbieder niet langer van toepassing als het Nationaal coördinatiepunt NLQF een negatief
      besluit heeft genomen over de validiteit, bedoeld in [artikel 5, tweede lid, van het Besluit NLQF][ref1] en dit
      is verwerkt in een scholingspakket. De scholing en volgende aanvragen van scholing van deze aanbieder zijn weer
      subsidiabel nadat het Nationaal coördinatiepunt NLQF alsnog een positief besluit heeft genomen en dit is verwerkt
      in een scholingspakket.


      [ref1]: https://wetten.overheid.nl/BWBR0050303#Artikel5
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0050303
        artikel: '5'
  - number: 3.5.5
    text: |-
      De minister neemt scholing die voldoet aan de criteria in het tweede lid, onderdelen a tot en met f,
      op in een scholingspakket en maakt dit bekend op [www.rijksoverheid.nl](http://www.rijksoverheid.nl) en
      [www.leeroverzicht.nl](http://www.leeroverzicht.nl).
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.5
  - number: 3.5.6
    text: |-
      De minister neemt scholing die voldoet aan de in het derde lid gestelde voorwaarden op in een scholingspakket
      indien de aanbieder de minister hierover gegevens heeft verstrekt en verwerkt de in het vierde lid bedoelde
      mutaties in een daaropvolgend vaststellingsmoment van een scholingspakket. De uiterste termijnen voor de ontvangst
      van deze gegevens, worden bekendgemaakt op [www.uitvoeringvanbeleid.nl](http://www.uitvoeringvanbeleid.nl/).
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.5
  - number: 3.6.1
    text: |-
      De minister erkent op aanvraag van een werkgeversvereniging en een werknemersvereniging dan wel een O&O-fonds een
      ontwikkelpad, indien het ontwikkelpad:
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.1.a
    text: tot stand is gekomen met medewerking van de minister;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.1.b
    text: |-
      is vastgesteld door werkgevers- en werknemersverenigingen dan wel een of meerdere O&O-fondsen die behoren tot de
      sector waarop het ontwikkelpad betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.1.c
    text: |-
      scholing bevat die bijdraagt aan de doelen van het ontwikkelpad, qua inhoud en niveau past bij de functies of
      specialisaties in het ontwikkelpad, praktijkgericht is, te combineren is met werken in een betaalde baan en bestaat
      uit:
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.1.c.1°
    text: |-
      beroepsopleidingen als bedoeld in de [artikelen 1.4.1, lid 1a][ref1], en
      [7.2.7, vierde lid, van de Wet educatie en beroepsonderwijs][ref2] of onderdelen daarvan,
      voor zover deze onderdelen kunnen worden afgerond met een certificaat als bedoeld in
      [artikel 7.2.3. van de Wet educatie en beroepsonderwijs][ref3] of een mbo-verklaring als bedoeld in
      [artikel 7.4.6a van de Wet educatie en beroepsonderwijs][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 3.6.1.c.2°
    text: |-
      opleidingen als bedoeld in
      [artikel 1.1, onderdeel m, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], voor zover deze
      deeltijds of duaal zijn ingericht als bedoeld in [artikel 7.7, eerste lid, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 3.6.1.c.3°
    text: |-
      opleidingen als bedoeld in
      [artikel 1.1, onderdeel dd1, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] en scholing die
      leidt tot het getuigschrift bekwaamheidsonderzoek of het getuigschrift pedagogisch-didactische scholing, genoemd
      in[ artikel 7a.3][ref2] en [7a.4][ref3] van die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7a
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 7a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 7a
  - number: 3.6.1.c.4°
    text: |-
      non-formele opleidingen met een branchewaardering waarvoor op grond van [artikel 3.1 van de Wet NLQF][ref1]
      een NLQF-niveau is vastgesteld dat ten minste op het niveau van de bijbehorende functies of specialisaties
      in het ontwikkelpad ligt of onderdelen van een zodanige opleiding, mits deze onderdelen beschikken over een
      branchewaardering; of


      [ref1]: https://wetten.overheid.nl/BWBR0050058#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0050058
        artikel: '3'
  - number: 3.6.1.c.5°
    text: |-
      non-formele opleidingen, anders dan de scholing, bedoeld in subonderdeel 4, of onderdelen hiervan met een
      branchewaardering;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.1.d
    text: 'ten minste de volgende informatie bevat over elke scholing die daarin is opgenomen:'
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.1.d.1°
    text: de naam van de scholing;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.1.d.2°
    text: |-
      het type scholing, aangeduid als mbo, hbo, wo of non-formeel met daarnaast, indien een scholing de aanduiding mbo
      of non-formeel heeft, een vermelding of de scholing een volledige opleiding is of een onderdeel daarvan;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.1.d.3°
    text: |-
      de opleidingscode van de scholing in de Registratie instellingen en opleidingen, genoemd in de
      [Wet educatie en beroepsonderwijs][ref1] en de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2],
      indien het een scholing betreft als bedoeld in onderdeel c, subonderdelen 1 en 2, met uitzondering van onderdelen
      van een beroepsopleiding als bedoeld in onderdeel c, subonderdeel 1, die kunnen worden afgerond met een mbo-
      verklaring; en


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0005682
  - number: 3.6.1.d.4°
    text: |-
      de naam en het nummer, bedoeld in [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref1], van de opleider
      die de scholing aanbiedt, de opleidingseenheidscode van de scholing in de Registratie instellingen en opleidingen;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel9
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '9'
  - number: 3.6.1.d.5°
    text: |-
      een specificatie van een branchewaardering, indien het een opleiding betreft als bedoeld in het eerste lid,
      onderdeel c, subonderdelen 4 en 5.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.2
    text: |-
      In afwijking van het eerste lid, onderdeel c, mag een ontwikkelpad scholing bevatten die qua inhoud en niveau niet
      volledig past bij een of meer van de functies of specialisaties in het ontwikkelpad en, indien van toepassing, een
      NLQF-niveau heeft dat lager ligt dan het niveau van de bijbehorende functie of specialisatie in het ontwikkelpad,
      mits wordt aangetoond dat de scholing bijdraagt aan de instroom in de functies of specialisaties waartoe de
      betreffende scholing behoort.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.3
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van een door de minister elektronisch beschikbaar gesteld
      aanvraagformulier dat vergezeld gaat van een specificatie dat de scholing bijdraagt aan de doelen van het
      ontwikkelpad, qua inhoud en niveau past bij de functies en specialisaties in het ontwikkelpad of voldoet aan het
      tweede lid, praktijkgericht is en te combineren is met werken in een betaalde baan, overeenkomstig het door de
      minister vastgestelde model.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.4
    text: |-
      Indien het ontwikkelpad scholing bevat als bedoeld in het eerste lid, onderdeel c, subonderdelen 4 en 5, gaat de
      aanvraag daarnaast vergezeld van een specificatie dat de betreffende scholing een branchewaardering heeft, wat
      blijkt uit:
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.4.a
    text: |-
      de opname van de scholing in een collectieve arbeidsovereenkomst die binnen de sector valt waarop het ontwikkelpad
      betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.4.b
    text: |-
      het aanbieden van de scholing door een O&O-fonds of een ander opleidingsfonds dat handelt ten behoeve van werkenden
      in de sector waarop het ontwikkelpad betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.4.c
    text: |-
      een verklaring of bewijs van accreditatie van een landelijke werkgeversorganisatie dan wel een organisatie die
      wordt bestuurd door ten minste een landelijke werkgeversorganisatie; of
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.4.d
    text: |-
      bewijzen van steunbetuiging, opgesteld overeenkomstig een door de minister vastgesteld model, van een
      representatieve groep van ondernemingen of andere organisaties.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.5
    text: |-
      Aanvragen tot erkenning van ontwikkelpaden kunnen worden ingediend van 28 februari 2025 tot en met 7 maart 2025
      en van 16 juni tot en met 31 juli 2025 en daarna jaarlijks van 17 maart tot en met 31 maart, 16 juni tot en met
      30 juni, 16 september tot en met 30 september en van 17 december tot en met 31 december.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.6
    text: |-
      De minister maakt ontwikkelpaden die hij heeft erkend, bekend op [www.rijksoverheid.nl](http://
      www.rijksoverheid.nl) en [www.leeroverzicht.nl](http://www.leeroverzicht.nl).
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.7
    text: 'De minister trekt de erkenning van een ontwikkelpad in:'
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.7.a
    text: zodra een ontwikkelpad is erkend dat in de plaats treedt van het betreffende ontwikkelpad;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.7.b
    text: op verzoek van degene die heeft verzocht om erkenning van het betreffende ontwikkelpad;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.6.7.c
    text: |-
      indien de minister verneemt dat een nieuw ontwikkelpad is vastgesteld dat in de plaats treedt van het
      erkende ontwikkelpad en degene die heeft verzocht om erkenning van het ontwikkelpad niet in de eerstvolgende
      aanvraagperiode, bedoeld in het vijfde lid, het vervangende ontwikkelpad heeft aangeboden voor erkenning.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.6
  - number: 3.7.1
    text: |-
      Indien een opleider van oordeel is dat zijn scholing voldoet aan het bepaalde in
      [artikel 3.6, eerste lid, onderdeel c][ref1], en, indien van toepassing, artikel 3.6, tweede lid, maar de partijen
      die een ontwikkelpad hebben vastgesteld dat door de minister is erkend, deze scholing niet hierin wil opnemen, kan
      de opleider aan de minister een verzoek tot bemiddeling doen.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.7.2
    text: 'De opleider voegt bij zijn verzoek:'
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.7
  - number: 3.7.2.a
    text: |-
      een verklaring waarom de scholing naar zijn oordeel voldoet aan het bepaalde in
      [artikel 3.6, eerste lid, onderdeel c][ref1], en, indien van toepassing, artikel 3.6, tweede lid, waar mogelijk
      voorzien van documenten ter onderbouwing; en


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.7.2.b
    text: |-
      schriftelijk bewijs waaruit blijkt dat de opleider aan een of meer van de partijen die het erkende ontwikkelpad
      hebben vastgesteld, heeft verzocht om opname van de scholing in dit ontwikkelpad en, indien hij hierover beschikt,
      dat dit verzoek is afgewezen en wat de redenen hiervoor waren.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.7
  - number: 3.7.3
    text: |-
      Na ontvangst van het verzoek treedt de minister in overleg met de partijen die het erkende ontwikkelpad hebben
      vastgesteld en gaat daarbij in elk geval na wat de redenen zijn geweest voor het niet opnemen van de scholing in
      het ontwikkelpad.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.7
  - number: 3.7.4
    text: |-
      Indien na het overleg overeenstemming wordt bereikt over het opnemen van de scholing in het ontwikkelpad, deelt de
      minister dit mede aan de opleider en dragen de partijen die het ontwikkelpad hebben vastgesteld er zorg voor dat
      de scholing in het ontwikkelpad wordt opgenomen en een aanvraag als bedoeld in [artikel 3.6, eerste lid][ref1],
      wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.7.5
    text: |-
      Indien geen overeenstemming wordt bereikt, brengt de minister aan de partijen die het ontwikkelpad hebben
      vastgesteld een advies uit over de opname van de scholing in het ontwikkelpad, dat hij tevens deelt met de
      opleider.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.7
  - number: 3.7.6
    text: |-
      De minister kan, onverminderd [artikel 3.6, eerste lid][ref1], een ontwikkelpad weigeren te erkennen, indien de
      scholing niet is opgenomen in het te erkennen ontwikkelpad en de minister van oordeel is dat de partijen die het
      ontwikkelpad hebben vastgesteld de opname van de scholing redelijkerwijs niet achterwege had kunnen laten.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.8.1
    text: |-
      Op grond van dit hoofdstuk komen de volgende kosten van werkgevers, geregistreerde gastouderbureaus en collectieven
      in aanmerking voor subsidie:
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.8
  - number: 3.8.1.a
    text: |-
      de in een factuur van de opleider vermelde externe kosten van een scholing als bedoeld in [artikel 3.5][ref1], voor
      zover het les-, cursus-, college- of examengeld betreft, alsmede kosten van door de opleider verplicht gestelde
      literatuur, mits deze literatuur direct noodzakelijk is voor het volgen en afronden van de scholing;


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.8.1.b
    text: |-
      de in een factuur van de opleider vermelde externe kosten van scholing die is gericht op verbetering
      van de Nederlandse taalbeheersing, mits deze wordt ingezet in combinatie met een scholing als bedoeld in
      [artikel 3.5][ref1] en nodig is voor het uitoefenen van de functie in het ontwikkelpad waar de scholing als bedoeld
      in artikel 3.5 toe behoort en voor zover deze kosten:


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.8.1.b.1°
    text: |-
      les-, cursus-, college- of examengeld betreffen, alsmede kosten van door de opleider verplicht gestelde literatuur,
      mits deze literatuur direct noodzakelijk is voor het volgen en afronden van de scholing;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.8
  - number: 3.8.1.b.2°
    text: niet meer dan 50% van het totaal aan kosten als bedoeld in dit lid bedragen; en
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.8
  - number: 3.8.1.b.3°
    text: door de opleider in rekening zijn gebracht bij de subsidieaanvrager.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.8
  - number: 3.8.2
    text: 'Onverminderd het eerste lid, wordt aan een collectief tevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.8
  - number: 3.8.2.a
    text: een toeslag van 15% op de kosten, bedoeld in het eerste lid, ter subsidiëring van overige gemaakte kosten;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.8
  - number: 3.8.2.b
    text: |-
      een tegemoetkoming in de kosten van een door een accountant opgesteld product als bedoeld in
      [artikel 3.24, vijfde lid][ref1], van € 3.000.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.8.3
    text: |-
      De subsidie voor de kosten, bedoeld in het eerste lid, bedraagt 90% van de kosten indien de scholing, bedoeld in
      het eerste lid, onderdeel a, NLQF-niveau 1, 2 of 3 heeft, en 40% indien de scholing NLQF-niveau 4 of hoger heeft.
      Indien een scholing een onderdeel is van een beroepsopleiding dan wel een non-formele opleiding als bedoeld in
      [artikel 3.6, eerste lid, onderdeel c, subonderdeel 1 respectievelijk 4][ref1], wordt het subsidiepercentage
      bepaald door het NLQF-niveau van de opleiding waar de scholing onderdeel van uitmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.8.4
    text: |-
      In het geval van scholing als bedoeld in [artikel 3.6, eerste lid, onderdeel c, subonderdeel 5][ref1], wordt
      voor de toepassing van het derde lid uitgegaan van het NLQF-niveau dat is vermeld in de aanvraag, bedoeld in
      [artikel 3.5, derde lid][ref2]. Het derde lid, tweede zin, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.8.5
    text: |-
      Voor zover de kosten, bedoeld in het eerste en tweede lid, bestaan uit kosten van externe opdrachten met een waarde
      van ten minste € 50.000, zijn deze kosten slechts subsidiabel, indien zij marktconform zijn, wat wordt aangetoond
      aan de hand van:
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.8
  - number: 3.8.5.a
    text: een offerteprocedure waarbij ten minste drie offertes zijn aangevraagd en beoordeeld door de subsidieontvanger; of
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.8
  - number: 3.8.5.b
    text: een transparante, objectieve en niet-discriminatoire aanbestedingsprocedure.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.8
  - number: '3.9'
    text: |-
      Niet subsidiabel zijn btw en kosten waarvoor op grond van deze of een andere regeling reeds subsidie of een andere
      financiële bijdrage is verstrekt of zal worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.9
  - number: '3.10'
    text: De subsidie die aan een collectief wordt verstrekt, bedraagt ten minste € 125.000 per aanvraag.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.10
  - number: 3.11.1
    text: |-
      De voor subsidie in aanmerking komende kosten van een collectief worden gemaakt in een door de minister aangewezen
      periode.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.11
  - number: 3.11.2
    text: De periode start de dag na de datum van indiening van de subsidieaanvraag en eindigt uiterlijk op 31 december 2027.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.11
  - number: '3.12'
    text: 'Een subsidieaanvraag kan in het jaar 2025 bij de minister worden ingediend in de volgende tijdvakken:'
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.12
  - number: 3.12.a
    text: |-
      van 10 maart 09:00 uur tot en met 30 juni 17:00 uur en van 1 juli 09:00 uur tot en met 10 november 17:00 uur door
      werkgevers en geregistreerde gastouderbureaus;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.12
  - number: 3.12.b
    text: van 1 september 09:00 uur tot en met 30 september 17:00 uur door collectieven.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.12
  - number: 3.13.1
    text: |-
      De subsidieplafonds voor de tijdvakken, genoemd in [artikel 3.12][ref1], bedragen voor het jaar 2025:


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.13.1.a
    text: |-
      € 4 miljoen voor het eerste tijdvak, genoemd in [artikel 3.12, onderdeel a][ref1], en € 4 miljoen voor het tweede
      tijdvak;


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.13.1.b
    text: |-
      € 23 miljoen voor het tijdvak, genoemd in [artikel 3.12, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.13.2
    text: |-
      De minister bepaalt per erkend ontwikkelpad dat voldoet aan [artikel 3.5, tweede lid, onderdeel b][ref1], of
      per groep van zodanige ontwikkelpaden welk deel van het subsidieplafond, genoemd in het eerste lid, onderdeel b,
      beschikbaar is voor de scholing in het ontwikkelpad, respectievelijk de tot de groep behorende ontwikkelpaden en
      maakt deze verdeling bekend op [www.uitvoeringvanbeleidszw.nl](http://www.uitvoeringvanbeleidszw.nl).


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.13.3
    text: |-
      Indien het bedrag dat beschikbaar is in een aanvraagtijdvak niet volledig wordt benut, kan de minister de
      resterende middelen toevoegen aan de middelen van een ander aanvraagtijdvak in hetzelfde kalenderjaar of, indien
      middelen zijn overgebleven in het aanvraagtijdvak, genoemd in [artikel 3.12, onderdeel b][ref1], de verdeling,
      bedoeld in het tweede lid, herzien. De minister maakt de verschuivingen van het beschikbare budget bekend op
      [www.uitvoeringvanbeleidszw.nl](http://www.uitvoeringvanbeleidszw.nl).


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.14.1
    text: |-
      Een werkgever of geregistreerd gastouderbureau dient de subsidieaanvraag in door middel van een door de minister
      elektronisch beschikbaar gesteld aanvraagformulier dat vergezeld gaat van:
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.14
  - number: 3.14.1.a
    text: |-
      een factuur waaruit blijkt dat scholing is ingekocht en die ten minste de door de minister te bepalen informatie
      bevat;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.14
  - number: 3.14.1.b
    text: een bewijs dat de subsidieaanvrager de scholing, bedoeld in onderdeel a, heeft betaald;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.14
  - number: 3.14.1.c
    text: |-
      een verklaring dat de scholing wordt ingezet in combinatie met een scholing als bedoeld in [artikel 3.5][ref1]
      en nodig is voor het uitoefenen van de functie in het ontwikkelpad waar de scholing, bedoeld in artikel 3.5, toe
      behoort, voor zover het scholing betreft, bedoeld in [artikel 3.8, eerste lid, onderdeel b][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.14.1.d
    text: |-
      de naam, geboortedatum en het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref1], van alle personen die de
      scholing volgen, hebben gevolgd of zullen volgen waarvoor subsidie wordt aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 3.14.2
    text: |-
      Een werkgever en een geregistreerd gastouderbureau kunnen per aanvraag subsidie aanvragen voor een bedrag dat lager
      is dan € 25.000.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.14
  - number: 3.14.3
    text: |-
      Door het indienen van een aanvraag stemt de subsidieaanvrager ermee in dat het subsidiedossier, met uitzondering
      van persoonsgegevens, openbaar wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.14
  - number: 3.14.4
    text: |-
      De minister maakt de informatie, bedoeld in het eerste lid, onderdeel a, en wijzigingen hiervan bekend op
      [www.uitvoeringvanbeleidszw.nl](http://www.uitvoeringvanbeleidszw.nl).
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.14
  - number: 3.15.1
    text: |-
      Een collectief dient de subsidieaanvraag in door middel van een door de minister elektronisch beschikbaar gesteld
      aanvraagformulier dat vergezeld gaat van:
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.15
  - number: 3.15.1.a
    text: een activiteitenplan;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.15
  - number: 3.15.1.b
    text: een begroting; en
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.15
  - number: 3.15.1.c
    text: |-
      een verklaring van alle partijen als bedoeld in [artikel 3.6, eerste lid, onderdeel b][ref1], dat de aanvraag wordt
      ondersteund.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.15.2
    text: |-
      Indien het collectief een bij overeenkomst vastgelegd samenwerkingsverband is, wordt de aanvraag ingediend door de
      hoofdaanvrager van het collectief en gaat de subsidieaanvraag, onverminderd het eerste lid, vergezeld van:
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.15
  - number: 3.15.2.a
    text: |-
      een door alle deelnemers aan het collectief getekende samenwerkingsovereenkomst, waaruit in ieder geval blijkt
      dat de hoofdaanvrager als zodanig is aangewezen en gemachtigd is om het collectief in en buiten rechte te
      vertegenwoordigen, en, indien een koepelorganisatie aan het collectief deelneemt, dat deze organisatie is
      aangewezen door een of meer werkgeversverenigingen en een of meer werknemersverenigingen die een band hebben met
      een of meer beroepsgroepen in maatschappelijk cruciale sectoren; en
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.15
  - number: 3.15.2.b
    text: |-
      een bewijs dat de hoofdaanvrager van het collectief de houder is van het bankrekeningnummer dat in de aanvraag
      is opgenomen.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.15
  - number: 3.15.3
    text: |-
      Alleen een werkgeversvereniging, werknemersvereniging, O&O-fonds of koepelorganisatie kunnen worden aangewezen als
      hoofdaanvrager van een collectief.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.15
  - number: 3.15.4
    text: |-
      Het activiteitenplan, de begroting en de verklaring, genoemd in het eerste lid, onderdeel c, worden opgesteld
      overeenkomstig het door de minister vastgestelde model.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.15
  - number: 3.15.5
    text: |-
      Voor zover het collectief voor dezelfde begrote kosten of een deel daarvan ook subsidie of een andere financiële
      bijdrage heeft aangevraagd of zal aanvragen bij een ander bestuursorgaan of rechtspersoon, doet hij daarvan
      mededeling in de subsidieaanvraag, onder vermelding van de stand van zaken van de beoordeling van die andere
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.15
  - number: 3.15.6
    text: |-
      Door het indienen van een aanvraag stemt het collectief ermee in dat het subsidiedossier, met uitzondering van
      persoonsgegevens, openbaar wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.15
  - number: 3.16.1
    text: |-
      Een centrumgemeente als bedoeld in [artikel 2.4, tweede lid, van het Besluit SUWI][ref1] kan voor 30 juni van het
      lopende kalenderjaar aan de minister melden dat zij onderdeel uit wil maken van een collectief dat op grond van
      deze regeling subsidie aan zal vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel2
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '2'
  - number: 3.16.2
    text: |-
      De centrumgemeente doet de melding met gebruikmaking van het door de minister ter beschikking gestelde formulier
      en geeft daarbij aan ten aanzien van welke van de volgende ontwikkelpaden zij onderdeel wil uitmaken van een
      collectief:
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.16
  - number: 3.16.2.a
    text: erkende ontwikkelpaden;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.16
  - number: 3.16.2.b
    text: ontwikkelpaden waarvoor op dat moment een aanvraag om erkenning is ingediend; of
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.16
  - number: 3.16.2.c
    text: |-
      ontwikkelpaden waarvan reeds bekend is dat die voor het volgende erkenningsmoment aan de minister worden
      aangeboden.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.16
  - number: 3.16.3
    text: |-
      De minister maakt de centrumgemeenten die een melding hebben gedaan en de erkende ontwikkelpaden waar de melding
      betrekking op heeft bekend op [www.uitvoeringvanbeleidszw.nl](http://www.uitvoeringvanbeleidszw.nl).
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.16
  - number: 3.16.4
    text: |-
      Indien een collectief subsidie aanvraagt voor scholing uit een of meer erkende ontwikkelpaden ten aanzien waarvan
      een of meer centrumgemeenten een melding hebben gedaan, maken deze centrumgemeenten tevens onderdeel uit van het
      collectief.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.16
  - number: 3.16.5
    text: 'Het vierde lid is niet van toepassing op de centrumgemeente die:'
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.16
  - number: 3.16.5.a
    text: na het doen van de melding heeft verklaard geen onderdeel uit te willen maken van het collectief;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.16
  - number: 3.16.5.b
    text: |-
      geen overeenstemming heeft bereikt met de partijen in het collectief over deelname aan het collectief, mits door
      het collectief is onderbouwd dat met de betreffende centrumgemeente redelijkerwijs geen overeenstemming kon worden
      bereikt.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.16
  - number: 3.16.6
    text: |-
      Indien er sprake is van de situatie, bedoeld in het vijfde lid, onderdeel b, voegt het collectief, onverminderd
      [artikel 3.15, eerste en tweede lid][ref1], bij de aanvraag een onderbouwing waaruit blijkt dat met de betreffende
      centrumgemeente redelijkerwijs geen overeenstemming over de deelname aan het collectief kon worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.17.1
    text: |-
      Subsidieaanvragen worden behandeld op volgorde van ontvangst, waarbij alleen volledige subsidieaanvragen in
      behandeling worden genomen.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.17
  - number: 3.17.2
    text: 'Een aanvraag is volledig wanneer:'
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.17
  - number: 3.17.2.a
    text: het elektronische formulier en de bijbehorende bijlagen volledig zijn;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.17
  - number: 3.17.2.b
    text: de aanvraag is ondertekend door een functionaris, bevoegd om namens de subsidieaanvrager te handelen; en
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.17
  - number: 3.17.2.c
    text: binnen het aanvraagtijdvak is ontvangen door de minister.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.17
  - number: 3.17.3
    text: |-
      Voor onvolledige subsidieaanvragen geldt, na aanvulling door de subsidieaanvrager, de datum van ontvangst van de
      volledige subsidieaanvraag als datum van binnenkomst.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.17
  - number: 3.17.4
    text: |-
      Indien na sluiting van het aanvraagtijdvak voor collectieven uit een beoordeling van de ontvangen subsidieaanvragen
      blijkt dat het van toepassing zijnde deel van het subsidieplafond, bedoeld in [artikel 3.13, tweede lid][ref1],
      zal worden overschreden, verdeelt de minister, in afwijking van het eerste lid, het beschikbare subsidieplafond
      evenredig over de ingediende aanvragen die voldoen aan de voorwaarden, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.17.4.a
    text: |-
      de subsidieverlening € 125.000 bedraagt als bedoeld in [artikel 3.10][ref1] indien door evenredige verdeling het
      bedrag lager uitvalt dan dit bedrag; en


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.17.4.b
    text: het resterende deel van het subsidieplafond naar rato over de resterende aanvragen wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.17
  - number: 3.18.1
    text: |-
      Op aanvragen van een werkgever en een geregistreerd gastouderbureau beslist de minister binnen 13 weken na de
      subsidieaanvraag.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.18
  - number: 3.18.2
    text: |-
      Op aanvragen van een collectief beslist de minister binnen 13 weken na afloop van het aanvraagtijdvak op de
      subsidieaanvraag.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.18
  - number: 3.18.3
    text: |-
      Onverminderd [artikel 4.2, eerste lid, van de Kaderregeling][ref1] vermeldt de beschikking tot subsidieverlening in
      ieder geval de wijze van bevoorschotting.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel4
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '4'
  - number: 3.19.1
    text: |-
      De minister kan bij de beschikking tot subsidieverlening aan een collectief een voorschot verlenen van 25% van de
      verleende subsidie en, indien de looptijd, bedoeld in [artikel 3.11][ref1], meer dan twaalf maanden bedraagt, een
      aanvullend voorschot van 50% van de verleende subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.19.2
    text: Het aanvullend voorschot, bedoeld in het eerste lid, wordt uitbetaald na indiening van de voortgangsrapportage.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.19
  - number: 3.20.1
    text: |-
      Onverminderd de [artikelen 4:25, tweede lid][ref1], en [4:35 van de Algemene wet bestuursrecht][ref2] wordt
      de subsidie geheel of gedeeltelijk geweigerd, indien de subsidieaanvraag niet voldoet aan de bij deze regeling
      gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 3.20.2
    text: 'Aanvragen voor scholing worden ook geweigerd indien de scholing wordt uitgevoerd door:'
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.20
  - number: 3.20.2.a
    text: de subsidieontvanger of een partij in het samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.20
  - number: 3.20.2.b
    text: |-
      een organisatie die, direct of indirect, is vertegenwoordigd in het bestuur van de subsidieontvanger of in het
      bestuur van een partij in het samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.20
  - number: 3.20.2.c
    text: |-
      een organisatie waarin één of meer van dezelfde partijen in het bestuur zijn vertegenwoordigd, die tegelijkertijd
      ook:
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.20
  - number: 3.20.2.c.1°
    text: in het bestuur van de subsidieontvanger zijn vertegenwoordigd; of
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.20
  - number: 3.20.2.c.2°
    text: in het bestuur van een partij in het samenwerkingsverband zijn vertegenwoordigd;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.20
  - number: 3.20.2.d
    text: |-
      een organisatie waarin een persoon een financieel belang heeft of bestuurder is van die organisatie, en die persoon
      ook werkzaam is voor:
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.20
  - number: 3.20.2.d.1°
    text: de subsidieontvanger; of
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.20
  - number: 3.20.2.d.2°
    text: een partij uit het samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.20
  - number: 3.20.2.e
    text: |-
      een organisatie waarin de subsidieontvanger of een partij uit het samenwerkingsverband, direct of indirect invloed
      kan uitoefenen of een financieel belang heeft; of
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.20
  - number: 3.20.2.f
    text: |-
      een organisatie waarin zich een belangenconflict voordoet of kan voordoen als gevolg van familiebanden,
      persoonlijke relaties, politieke gezindheid of nationaliteit, economische belangen of elk ander direct of indirect
      persoonlijk belang, waarmee de onpartijdige en objectieve uitoefening van de functies van een financiële actor
      of andere persoon die bij de uitvoering van het initiatief betrokken is, in gevaar is of in gevaar kan worden
      gebracht.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.20
  - number: 3.20.3
    text: |-
      Indien bij subsidieverlening het totaal aan subsidieverleningen aan één individuele aanvrager het bedrag van
      € 100.000,– per jaar zou overschrijden, wordt het deel van de aanvraag geweigerd dat zou leiden tot overschrijding
      van de € 100.000,–.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.20
  - number: 3.20.4
    text: |-
      De subsidie wordt ook geweigerd indien het activiteitenplan de aannemelijkheid van de omvang en invulling van de
      aanvraag, of de haalbaarheid van de realisatie van het plan onvoldoende onderbouwt.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.20
  - number: '3.21'
    text: |-
      Een collectief is verplicht om door haar ingekochte scholing aan te bieden aan alle begunstigden en, voor zover
      hij de verleende subsidie gebruikt voor het vergoeden van scholingskosten, om elke werkgever en elk geregistreerd
      gastouderbureau de gelegenheid te geven een verzoek tot vergoeding van scholingskosten bij het collectief in te
      dienen.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.21
  - number: 3.22.1
    text: |-
      Onverminderd [artikel 5.2 van de Kaderregeling][ref1], bevat de administratie van een collectief ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel5
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '5'
  - number: 3.22.1.a
    text: |-
      de naam, geboortedatum en het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref1], van alle personen die de
      scholing die met de verleende subsidie is ingekocht volgen of hebben gevolgd;


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 3.22.1.b
    text: |-
      een verklaring dat de scholing wordt ingezet in combinatie met een scholing als bedoeld in [artikel 3.5][ref1]
      en nodig is voor het uitoefenen van de functie in het ontwikkelpad waar de scholing, bedoeld in artikel 3.5, toe
      behoort, voor zover het scholing betreft, bedoeld in [artikel 3.8, eerste lid, onderdeel b][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.22.1.c
    text: |-
      schriftelijke verklaringen van de personen, bedoeld in onderdeel a, waaruit blijkt dat zij met de scholing zijn
      gestart en deze kosteloos volgen; en
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.22
  - number: 3.22.1.d
    text: facturen en betaalbewijzen van de ingekochte scholing.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.22
  - number: 3.22.2
    text: |-
      Indien het collectief een bij overeenkomst vastgelegd samenwerkingsverband is, ziet de hoofdaanvrager van
      het collectief erop toe dat wordt voldaan aan het eerste lid en [artikel 5.2 van de Kaderregeling][ref1] en
      verstrekt hij op verzoek aan de minister alle informatie uit de administratie die de minister in het kader van de
      subsidieverstrekking nodig acht.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel5
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '5'
  - number: 3.22.3
    text: |-
      De facturen, bedoeld in het eerste lid, onderdeel d, bevatten ten minste de door de minister te bepalen informatie.
      [Artikel 3.14, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Artikel3
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0043015
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.23.1
    text: |-
      Indien de duur van de subsidiabele activiteiten meer dan twaalf maanden bedraagt, dient een collectief waaraan
      subsidie is verleend op grond van dit hoofdstuk op de tijdstippen, genoemd in de beschikking tot subsidieverlening,
      een voortgangsrapportage in.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.23
  - number: 3.23.2
    text: |-
      De voortgangsrapportage heeft betrekking op een periode van twaalf maanden, gerekend vanaf de dag na de datum van
      indiening van de subsidieaanvraag dan wel, indien het een voortgangsrapportage betreft die volgt op een eerdere
      voortgangsrapportage, een periode van twaalf maanden volgend op de periode waarop de laatste voortgangsrapportage
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.23
  - number: 3.23.3
    text: De minister stelt het model van de voortgangsrapportage vast.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.23
  - number: 3.24.1
    text: |-
      De minister bepaalt voorafgaande aan het vaststellen van de subsidie op basis van een steekproef aan welke
      werkgevers en geregistreerde gastouderbureaus waaraan een subsidie is verleend op grond van deze regeling hij een
      verzoek doet als bedoeld in [artikel 7.4, eerste lid, van de Kaderregeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel7
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '7'
  - number: 3.24.2
    text: |-
      De minister neemt binnen 35 weken na indiening van de subsidieaanvraag ambtshalve een besluit over de vaststelling
      van de aan een werkgever of geregistreerd gastouderbureau verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.24
  - number: 3.24.3
    text: |-
      Een collectief waaraan subsidie is verstrekt op grond van dit hoofdstuk dient binnen 22 weken na afloop van de
      in de beschikking tot subsidieverlening bepaalde periode, een verzoek in tot vaststelling van de subsidie met
      gebruikmaking van een door de minister elektronisch beschikbaar gesteld formulier.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.24
  - number: 3.24.4
    text: |-
      Het activiteitenverslag en het financieel verslag, bedoeld in [artikel 7.8 van de Kaderregeling][ref1], worden
      opgesteld overeenkomstig het door de minister vastgestelde model.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel7
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '7'
  - number: 3.24.5
    text: |-
      In afwijking van [artikel 1.1 van de Kaderregeling][ref1], gaat het financieel verslag vergezeld van het door
      een accountant opgestelde product dat is voorgeschreven in het op [www.uitvoeringvanbeleidszw.nl](http://
      www.uitvoeringvanbeleidszw.nl) gepubliceerde accountantsprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0037603#Artikel1
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0037603
        artikel: '1'
  - number: 3.24.6
    text: |-
      De subsidieontvanger verstrekt bij het verzoek tot vaststelling van de subsidie het burgerservicenummer van alle
      personen die de scholing volgen of hebben gevolgd, die met de verleende subsidie is ingekocht.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.24
  - number: 3.25.1
    text: |-
      Onverminderd [artikel 4:48 van de Algemene wet bestuursrecht][ref1] wordt de beschikking tot subsidieverlening
      geheel ingetrokken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 3.25.1.a
    text: de subsidie niet is besteed aan de in de beschikking tot subsidieverlening toegekende subsidiabele kosten;
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.25
  - number: 3.25.1.b
    text: de in de beschikking tot subsidieverlening opgegeven verplichtingen niet zijn nageleefd.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.25
  - number: 3.25.2
    text: |-
      De beschikking tot subsidieverlening of de beschikking tot subsidievaststelling kan, in afwijking van het eerste
      lid, gedeeltelijk worden ingetrokken indien er naar het oordeel van de minister geen aanleiding is de subsidie
      geheel in te trekken.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.25
  - number: 3.25.3
    text: |-
      Indien de beschikking tot subsidieverlening of de beschikking tot subsidievaststelling geheel of gedeeltelijk
      wordt ingetrokken, wordt het aan de subsidieontvanger betaalde voorschot respectievelijk het subsidiebedrag dat
      tot dat moment is uitgekeerd, vermeerderd met de wettelijke rente, geheel of gedeeltelijk teruggevorderd van de
      subsidieontvanger.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel3.25
  - number: '4.1'
    text: |-
      De minister kan een of meer bepalingen van deze regeling buiten toepassing laten of daarvan afwijken voor
      zover toepassing gelet op het belang dat de desbetreffende bepaling beoogt te beschermen, zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel4.1
  - number: 4.1a
    text: |-
      Op subsidieaanvragen die zijn ingediend voor het tijdstip van inwerkingtreding van de Regeling van de Minister
      van Sociale Zaken en Werkgelegenheid van 1 juli 2025, nr. 2025-0000095142, tot wijziging van de SLIM-regeling met
      name in verband met het verduidelijken en aanscherpen van de regels voor de subsidieverstrekking ten behoeve van
      scholing in sectorale ontwikkelpaden, blijft de SLIM-regeling van toepassing zoals die luidde op de dag voor het
      genoemde tijdstip.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel4.1a
  - number: 4.2.1
    text: De minister draagt zorg voor de evaluatie van de doeltreffendheid en doelmatigheid van deze regeling.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel4.2
  - number: 4.2.2
    text: |-
      De subsidieontvanger werkt mee aan door of namens de minister ingesteld onderzoek dat erop is gericht de minister
      inlichtingen te verschaffen die van belang zijn voor de evaluatie van de doeltreffendheid en doelmatigheid van deze
      regeling en de ontwikkeling van het beleid van de minister. De subsidieontvanger verstrekt in dat kader de daartoe
      benodigde inlichtingen, gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel4.2
  - number: 4.3.1
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2020 en vervalt met ingang van 1 januari 2030, met
      uitzondering van hoofdstuk 3, dat vervalt met ingang van 1 januari 2028.
    url: https://wetten.overheid.nl/BWBR0043015/2026-01-01#Artikel4.3
  - number: 4.3.2
    text: |-
      In afwijking van het eerste lid blijft deze regeling, zoals deze luidde op 31 december 2027 respectievelijk
      31 december 2029, van toepassing op de afwikkeling van verleende subsidies op grond van [hoofdstuk 3][ref1]
      respectievelijk [hoofdstuk 2][ref2] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0043015#Hoofdstuk2
