articles:
  - number: '2'
    text: |-
      1 Als nationaal park zijn aangewezen:

        - De Alde Feanen;
        - De Biesbosch;
        - Drents-Friese Wold;
        - Duinen van Texel;
        - Dwingelderveld;
        - De Groote Peel;
        - Lauwersmeer;
        - De Loonse en Drunense Duinen;
        - De Maasduinen;
        - De Meinweg;
        - Nationaal beek- en esdorpenlandschap Drentsche Aa;
        - Nieuw Land;
        - Oosterschelde;
        - De Sallandse Heuvelrug;
        - Schiermonnikoog;
        - Utrechtse Heuvelrug;
        - Weerribben-Wieden;
        - Zuid-Kennemerland.

      2 De nationale parken, bedoeld in het eerste lid, omvatten de gebieden, zoals aangegeven op de kaarten, opgenomen
      in de bijlage bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0022396/2018-10-01#Artikel2
