preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet op de naburige rechten te wijzigen in verband
    met de omzetting van Richtlijn 2011/77/EU van het Europees Parlement en de Raad van 27 september 2011 tot wijziging
    van Richtlijn 2006/116/EG betreffende de beschermingstermijn van het auteursrecht en bepaalde naburige rechten;

    Zo is het, dat Wij, de Afdeling Advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034050/2013-10-18#ArtikelAanhef
articles:
  - number: III.1
    text: |-
      Overeenkomsten die behelzen de gehele of gedeeltelijke overdracht van rechten van een uitvoerende kunstenaar aan
      een producent van fonogrammen en zijn gesloten voor 1 november 2013 worden geacht van kracht te blijven tot het
      tijdstip waarop de uitvoerende kunstenaar niet langer beschermd is volgens [artikel 12 lid 3][ref1] zoals dat komt
      te luiden na inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel12
    url: https://wetten.overheid.nl/BWBR0034050/2013-10-18#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '12'
  - number: III.2
    text: |-
      Op uitvoerende kunstenaars die op 1 november 2013 nog beschermd zijn, zijn
      [artikel 9b, eerste en tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel9b
    url: https://wetten.overheid.nl/BWBR0034050/2013-10-18#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: 9b
  - number: IV
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0034050/2013-10-18#ArtikelIV
