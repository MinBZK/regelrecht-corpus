  - number: '5.1'
    text: |-
      Voor het onderzoek, bedoeld in
      [artikel 2.17, vijfde lid, van de Regeling keuring en handel dierlijke produkten][ref1] is de aanbieder een heffing
      verschuldigd bestaande uit een tarief van € 0,00919 per kg met dien verstande dat voor elke ter keuring aangeboden
      partij goederen ten minste € 55,97 en ten hoogste € 430,70 in rekening zal worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '2'
  - number: '5.2'
    text: |-
      In geval het in het eerste lid bedoelde onderzoek, gelet op
      [artikel 2.17, zevende lid, van de Regeling keuring en handel dierlijke producten][ref1], alleen bestaat uit een
      documentencontrole is de aanbieder, in afwijking van het eerste lid, een vergoeding verschuldigd bestaande uit een
      starttarief van € 30,72, verhoogd met € 15,36 per kwartier voor iedere assistent en met € 20,48 per kwartier voor
      iedere keuringsdierenarts die met de documentencontrole is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '2'
  - number: '5.3'
    text: |-
      In afwijking van het eerste lid, bedraagt de maximale vergoeding voor een te controleren partij vers vlees van
      pluimvee, die vervoerd en aangeboden wordt als stuksgoed:
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel5
  - number: 5.3.a
    text: € 798,82 per schip met een lading vers vlees van pluimvee tot 500 ton,
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel5
  - number: 5.3.b
    text: € 1597,65 per schip met een lading vers vlees van pluimvee tot 1000 ton,
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel5
  - number: 5.3.c
    text: € 3195,31 per schip met een lading vers vlees van pluimvee tot 2000 ton,
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel5
  - number: 5.3.d
    text: € 4799,52 per schip met een lading vers vlees van pluimvee vanaf 2000 ton.
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel5
  - number: '5.4'
    text: |-
      Indien de partij afkomstig is uit Nieuw-Zeeland is de aanbieder, in afwijking van het eerste lid, een vergoeding
      verschuldigd bestaande uit een tarief van € 0,0015 per kg met dien verstande dat voor elke ter keuring aangeboden
      partij ten minste € 30,00 en ten hoogste € 350,00 in rekening zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel5
  - number: '5.5'
    text: |-
      Onverminderd de voorgaande leden, is de aanbieder voor onderzoeken en keuringen die verricht worden op grond
      van [artikel 2.21, tweede lid, van de Regeling keuring en handel dierlijke producten][ref1], een vergoeding
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '2'
  - number: '5.6'
    text: |-
      De in het vijfde lid bedoelde vergoeding bedraagt de werkelijke kosten van de verrichte onderzoeken en keuringen,
      met inbegrip van en voor zover van toepassing, de administratiekosten, de loonkosten en de sociale premies van de
      met de onderzoeken en keuringen belaste personen van de VWA en de kosten van laboratoriumonderzoek.
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel5
  - number: 5a.1
    text: |-
      Voor het onderzoek, bedoeld in [artikel 2.35, derde lid][ref1], en
      [artikel 2.44, vijfde lid, van de Regeling handel levende dieren en levende producten][ref2], is de aanbieder:


