        artikel: 5f
  - number: '8.2'
    text: 'De melding, bedoeld in het eerste lid, omvat tenminste:'
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel8
  - number: 8.2.a
    text: de soorten te verrichten bedrijfsactiviteiten;
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel8
  - number: 8.2.b
    text: de soorten en de hoeveelheden van de goederen;
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel8
  - number: 8.2.c
    text: |-
      de datum en het tijdstip waarop de bedrijfsactiviteiten naar verwachting zullen aanvangen, en de datum en het
      tijdstip waarop de bedrijfsactiviteiten naar verwachting zullen eindigen.
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel8
  - number: '8.3'
    text: |-
      Indien de datum of het tijdstip van aanvang of beëindiging van de werkzaamheden, bedoeld in het derde lid, afwijkt
      van de datum of het tijdstip volgens de melding, bedoeld in het eerste lid, wordt degene die de melding heeft
      verricht, hiervan in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel8
  - number: '8.4'
    text: |-
      Indien gemelde bedrijfsactiviteiten niet zullen plaatsvinden, worden uitgesteld of overigens wijziging ondergaan,
      als gevolg van niet aan de VWA te wijten oorzaken of omstandigheden, dient dit door degene die de melding heeft
      verricht schriftelijk aan de VWA te worden bericht, uiterlijk om 14.00 uur van de werkdag, voorafgaande aan de dag
      waarop de activiteiten plaatsvinden dan wel zouden hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel8
  - number: '9'
    text: |-
      Betalingsplichtigen zijn verplicht aan ambtenaren van de VWA en de departementale accountantsdienst van het
      Ministerie van Landbouw, Natuurbeheer en Visserij, op verzoek, terstond en naar waarheid, alle inlichtingen te
      verstrekken die naar hun oordeel voor de uitvoering van deze regeling noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel9
  - number: '10'
    text: |-
      Ter verzekering van de voldoening van de ingevolge deze regeling verschuldigde heffingen kan de minister bepalen
      dat:
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel10
  - number: 10.a
    text: |-
      zekerheid gesteld moet worden, met dien verstande dat per geval het beloop en de vorm van de te stellen zekerheid
      worden bepaald;
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel10
  - number: 10.b
    text: niet eerder werkzaamheden van de VWA worden aangevangen dan nadat de verschuldigde heffingen betaald zijn.
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel10
  - number: '11'
    text: |-
      In artikel 2 van de Regeling zekerheidstelling en betaling RVV-keurlonen 1993 wordt ‘Regeling keuring en
      handelsverkeer pluimveevlees 1992’ vervangen door: [Regeling][ref1][RVV][ref2]-tarieven pluimveevlees en vlees van
      klein vrij wild 1994.


