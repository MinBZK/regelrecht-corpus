preamble:
  text: |-
    Gelet op Richtlijn nr. 85/73/EEG van de Raad van de Europese Gemeenschappen van 29 januari 1985 inzake de
    financiering van de keuringen en sanitaire controles van vers vlees en van vlees van pluimvee (PbEG L 32);

    Gelet op de artikelen 13, eerste en tweede lid, 19, eerste lid, en 27 van de Landbouwwet en op artikel 94, eerste
    lid, onderdelen a en d, en tweede lid, van de Gezondheids- en welzijnswet voor dieren;

    Gezien het advies van de Raad voor dierenaangelegenheden, het Produktschap voor Pluimvee en Eieren, het
    Bedrijfschap voor de Pluimveehandel en -industrie en de Vereniging van de Nederlandse Pluimveeverwerkende
    Industrie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:


              *minister:*


              Minister van Landbouw, Natuur en Voedselkwaliteit;




              *VWA:*


              de Voedsel en Waren Autoriteit, ingesteld bij het [Besluit organisatie VWA][ref1];




              *Vervallen*







              *openingstijd:*


              periode van maandag tot en met vrijdag, met uitzondering van algemeen erkende feestdagen, van 07.00 uur tot
      18.00 uur;




              *werkdag:*


              dag, niet zijnde een zaterdag, zondag of algemeen erkende feestdag;



            algemeen erkende feestdag:

              de Nieuwjaarsdag, de Christelijke tweede Paas- en Pinksterdag, de beide Kerstdagen, de Hemelvaartsdag, de
      dag waarop de verjaardag van de Koning(in) wordt gevierd en de vijfde mei;




              *werkzaamheden:*


              onderzoeken en keuringen;




              *starttarief:*


              toeslag op het tarief voor werkzaamheden die op één dag, in één aaneengesloten periode, reguliere pauzes
      daaronder begrepen, voor één aanbieder op één plaats worden verricht;




              *kwartier:*


              spanne tijd van één vierde deel van een uur, of enkel gedeelte daarvan, die besteed is of zou zijn aan
      werkzaamheden, met uitzondering van reistijd;




              *aanbieder:*


              degene die werkzaamheden laat verrichten of wenst te laten verrichten dan wel, indien het de toepassing
      van [artikel 5][ref2], 5aa of 5bb betreft, de importeur of diens douaneagent dan wel, indien het de toepassing van
      [artikel 5a][ref3] betreft, de importeur, diens douaneagent of de exploitant of de eigenaar van de desbetreffende
      inrichting;




              *betalingsplichtige:*


              degene die ingevolge een of meer bepalingen van deze regeling is verplicht dan wel zal zijn verplicht tot
      betaling van een op grond van deze regeling vastgestelde dan wel vast te stellen vergoeding;




              *overige produkten:*


              produkten als bedoeld in artikel 1.1, eerste lid, van de Regeling handel levende dieren en levende
      produkten, met uitzondering van broedeieren als bedoeld in dat artikellid;




              *partij:*


              hoeveelheid producten van dezelfde aard waarvoor eenzelfde handelsdocument of certificaat geldt, die met
      hetzelfde vervoermiddel wordt vervoerd en die afkomstig is uit hetzelfde derde land of gedeelte van een derde land;




              *certificaat:*


              schriftelijke door of vanwege de VWA afgegeven verklaring naar aanleiding van de werkzaamheden;




              *geleidebiljet:*


              door de [RVV][ref4] opgemaakt document dat het product steeds vergezeld en waarin wordt verklaard dat een
      product voldoet aan de voorwaarden die het land van import;




              *dierenarts:*


              bevoegde, door de VWA met de werkzaamheden belaste dierenarts;




              *assistent:*


              door de VWA met de werkzaamheden belaste persoon, niet zijnde een dierenarts.


