    text: |-
      De aanbieder is een extra vergoeding verschuldigd boven de ingevolge het eerste tot en met het zestiende lid
      verschuldigde vergoedingen, bestaande uit een bedrag van:
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel7
  - number: 7.17.a
    text: |-
      € 5,71 per kwartier per met de werkzaamheden belaste persoon of personen indien de werkzaamheden later zijn
      aangemeld dan 14.00 uur van de werkdag voorafgaand aan de dag waarop de werkzaamheden zouden plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel7
  - number: 7.17.b
    text: |-
      € 8,17 per kwartier dat door een dierenarts aan de werkzaamheden is besteed ingeval deze plaatsvinden buiten
      openingstijd;
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel7
  - number: 7.17.c
    text: |-
      € 5,66 per kwartier dat door een assistent aan de werkzaamheden is besteed ingeval deze plaatsvinden buiten
      openingstijd;
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel7
  - number: 7.17.d
    text: € 13,88 ingeval zowel de situatie, bedoeld in onderdeel a als b van toepassing is;
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel7
  - number: 7.17.e
    text: € 11,42 ingeval zowel de situatie, bedoeld in onderdeel a als c van toepassing is.
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel7
  - number: '8.1'
    text: |-
      De aanbieder meldt de werkzaamheden, bedoeld in de [artikelen 2][ref1] tot en met [4][ref2] en [5][ref3] tot en
      met [5f][ref4], die hij door de VWA wenst te laten verrichten schriftelijk bij de VWA.


      [ref1]: https://wetten.overheid.nl/BWBR0006726#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006726#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006726#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0006726#Artikel5f
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel8
