      de Raad met betrekking tot de veterinaire controles van uit derde landen in te voeren levende dieren (PbEG L 323)
      een vergoeding verschuldigd van € 0,00919 per kg levend gewicht, met dien verstande dat voor elke ter keuring
      aangeboden partij ten hoogste € 430,70 in rekening zal worden gebracht ;
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel5a
