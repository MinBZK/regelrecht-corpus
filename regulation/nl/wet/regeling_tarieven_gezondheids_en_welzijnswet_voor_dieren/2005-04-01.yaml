    text: De in het eerste lid bedoelde vergoeding bedraagt € 56,32 per aanvraag.
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel4a
  - number: 4a.3
    text: |-
      Voor zover naar het oordeel van de VWA voor de behandeling van de aanvraag inzet van een keuringsdierenarts of
      assistent nodig is, wordt de in het tweede lid bedoelde vergoeding per aanvraag verhoogd met een starttarief van €
      46,08 en een bedrag van € 20,48 per kwartier voor iedere keuringsdierenarts of met € 15,36 per kwartier voor iedere
      assistent die is belast met de behandeling van de in het eerste lid bedoelde aanvraag.
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel4a
