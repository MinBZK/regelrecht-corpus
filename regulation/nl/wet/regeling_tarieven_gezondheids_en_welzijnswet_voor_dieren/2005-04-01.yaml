  - number: '2.1'
    text: |-
      Voor de werkzaamheden binnen openingstijd ter zake van het slachten van pluimvee en loopvogels (Ratites) als
      bedoeld in de [Regeling keuring en handel dierlijke producten][ref1] is de aanbieder een vergoeding verschuldigd,
      bestaande uit een starttarief ten bedrage van € 31,67 en een tarief per dier voor de volgende categorieën:


      [ref1]: https://wetten.overheid.nl/BWBR0006727
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006727
  - number: 2.1.a
    text: pluimvee en loopvogels (Ratites) met een geslacht gewicht van minder dan 2 kilogram;
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel2
  - number: 2.1.b
    text: pluimvee en loopvogels (Ratites) met een geslacht gewicht van 2 tot en met 5 kilogram;
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel2
  - number: 2.1.c
    text: pluimvee en loopvogels (Ratites), met een geslacht gewicht van meer dan 5 kilogram.
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel2
  - number: '2.2'
    text: |-
      Onverminderd het derde en het vierde lid, wordt het tarief per dier, bedoeld in het eerste lid, onderdelen a,
      b en c, berekend door het aantal kwartieren dat op één en dezelfde dag door de met de werkzaamheden belaste
      dierenarts of dierenartsen aan keuring en onderzoek in verband met het slachten van dieren van dezelfde categorie
      in een slachterij is besteed, de tijd die met onderbrekingen en uitstel van de werkzaamheden is gemoeid hieronder
      begrepen, te vermenigvuldigen met € 24,68 en de uitkomst hiervan te delen door het aantal dieren van dezelfde
      categorie, dat op deze dag in de desbetreffende slachterij is geslacht.
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel2
  - number: '2.3'
    text: |-
      Indien de in het tweede lid bedoelde dierenarts of dierenartsen zich bij de werkzaamheden laten bijstaan door
      één of meer assistenten, wordt het tarief per dier, bedoeld in het eerste lid, berekend door het totaal aantal
      kwartieren dat op één en dezelfde dag door één of meer dierenartsen aan keuring en onderzoek in verband met het
      slachten van dieren van dezelfde soort in een slachterij is besteed te vermenigvuldigen met € 24,68 en de uitkomst
      van die vermenigvuldiging te verhogen met de uitkomst van de vermenigvuldiging van het totaal aantal door de
      assistent of de assistenten aan desbetreffende keuring en onderzoek bestede kwartieren met € 16,40.
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel2
  - number: '2.4'
    text: 'Het tarief per dier, bedoeld in het eerste lid, onderdelen a, b en c, bedraagt:'
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel2
