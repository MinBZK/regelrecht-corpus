    text: |-
      ter zake van runderen, paardachtigen, varkens, schapen en geiten, pluimvee, konijnen, klein vederwild en
      haarwild alsmede ter zake van dieren als bedoeld in [Richtlijn 92/65/EEG](31992L0065) van de Raad van de
      Europese Gemeenschappen van 13 juli 1992 tot vaststelling van veterinairrechtelijke voorschriften voor het
      handelsverkeer en de invoer in de Gemeenschap van dieren, sperma, eicellen en embryo's waarvoor ten aanzien van de
      veterinairrechtelijke voorschriften geen specifieke communautaire regelgeving als bedoeld in bijlage A, onder 1,
      van [Richtlijn 90/425/EEG](31990L0425) geldt (PbEG L 268) een vergoeding verschuldigd van € 0,00919 per kg levend
      gewicht, met dien verstande dat voor elke ter keuring aangeboden partij ten minste € 55,97 en ten hoogste € 430,70
      in rekening zal worden gebracht;
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel5a
  - number: 5a.1.b
    text: |-
