    text: |-
      Degene die een aanvraag indient om een vergunning, toelating, aanwijzing, erkenning of registratie als bedoeld in
      de bijlage bij deze regeling, is voor de behandeling van de aanvraag een vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0006726/2005-04-01#Artikel4a
