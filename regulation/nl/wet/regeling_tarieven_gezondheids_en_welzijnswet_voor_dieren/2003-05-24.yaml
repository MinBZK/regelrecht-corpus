  - number: '8'
    text: |-
      1 De aanbieder meldt de werkzaamheden, bedoeld in de [artikelen 2][ref1] tot en met [4][ref2] en [5][ref3] tot en
      met [5f][ref4], die hij door de VWA wenst te laten verrichten schriftelijk bij de VWA.

      2 De melding, bedoeld in het eerste lid, omvat tenminste:

      a. de soorten te verrichten bedrijfsactiviteiten;

      b. de soorten en de hoeveelheden van de goederen;

      c. de datum en het tijdstip waarop de bedrijfsactiviteiten naar verwachting zullen aanvangen, en de datum en het
      tijdstip waarop de bedrijfsactiviteiten naar verwachting zullen eindigen.

      3 Indien de datum of het tijdstip van aanvang of beëindiging van de werkzaamheden, bedoeld in het derde lid,
      afwijkt van de datum of het tijdstip volgens de melding, bedoeld in het eerste lid, wordt degene die de melding
      heeft verricht, hiervan in kennis gesteld.

      4 Indien gemelde bedrijfsactiviteiten niet zullen plaatsvinden, worden uitgesteld of overigens wijziging ondergaan,
      als gevolg van niet aan de VWA te wijten oorzaken of omstandigheden, dient dit door degene die de melding heeft
      verricht schriftelijk aan de VWA te worden bericht, uiterlijk om 14.00 uur van de werkdag, voorafgaande aan de dag
      waarop de activiteiten plaatsvinden dan wel zouden hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006726#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006726#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006726#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0006726#Artikel5f
    url: https://wetten.overheid.nl/BWBR0006726/2003-05-24#Artikel8
