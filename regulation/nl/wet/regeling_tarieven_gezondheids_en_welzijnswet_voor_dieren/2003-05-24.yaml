  - number: 5e
    text: |-
      Bij toepassing van artikel 4.4a, derde lid, van de Regeling keuring en handel dierlijke produkten is de eigenaar of
      houder van de pluimveehouderij een vergoeding verschuldigd, bestaande uit een starttarief ten bedrage van € 30,93
      en een bedrag van

      a. € 24,11 per kwartier dat aan de werkzaamheden door een dierenarts is besteed, en

      b. € 16,02 per kwartier dat aan de werkzaamheden door een assistent is besteed.
    url: https://wetten.overheid.nl/BWBR0006726/2003-05-24#Artikel5e
  - number: 5f
    text: |-
