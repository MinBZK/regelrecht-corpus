    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006726/2003-05-24#Artikel12
  - number: '13'
    text: |-
      Deze regeling wordt aangehaald als:

      [Regeling tarieven Gezondheids- en welzijnswet voor dieren][ref1].


