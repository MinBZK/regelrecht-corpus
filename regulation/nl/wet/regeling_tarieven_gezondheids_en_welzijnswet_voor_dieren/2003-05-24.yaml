  - number: '6'
    text: |-
      De aanbieder is een extra vergoeding verschuldigd boven de ingevolge de [artikelen 2][ref1], [2a][ref2],
      [2b][ref3], [3][ref4], [4][ref5], [5][ref6], [5a][ref7], [5aa][ref8], 5bb, [5b][ref9], [5c][ref10], [5d][ref11]
      en [5e][ref12] verschuldigde vergoedingen, bestaande uit een bedrag van

      a. € 5,59 per kwartier per voor de VWA met de werkzaamheden belaste persoon indien de werkzaamheden later zijn
      aangemeld dan 14.00 uur van de werkdag voorafgaande aan de dag waarop de werkzaamheden zouden plaatsvinden;

      b. € 7,98 per kwartier dat door een dierenarts aan de werkzaamheden is besteed ingeval deze plaatsvinden buiten
      openingstijd;

      c. € 5,59 per kwartier dat door een assistent aan de werkzaamheden is besteed ingeval deze plaatsvinden buiten
      openingstijd;

      d. € 13,58 ingeval zowel de situatie, bedoeld in onderdeel a als b van toepassing is;

      e. € 11,19 ingeval zowel de situatie, bedoeld in onderdeel a als c van toepassing is.


