  - number: '9'
    text: |-
      Betalingsplichtigen zijn verplicht aan ambtenaren van de VWA en de departementale accountantsdienst van het
      Ministerie van Landbouw, Natuurbeheer en Visserij, op verzoek, terstond en naar waarheid, alle inlichtingen te
      verstrekken die naar hun oordeel voor de uitvoering van deze regeling noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0006726/2003-05-24#Artikel9
  - number: '10'
    text: |-
      Ter verzekering van de voldoening van de ingevolge deze regeling verschuldigde heffingen kan de minister bepalen
      dat:

      a. zekerheid gesteld moet worden, met dien verstande dat per geval het beloop en de vorm van de te stellen
      zekerheid worden bepaald;

      b. niet eerder werkzaamheden van de VWA worden aangevangen dan nadat de verschuldigde heffingen betaald zijn.
    url: https://wetten.overheid.nl/BWBR0006726/2003-05-24#Artikel10
  - number: '11'
    text: |-
      In artikel 2 van de Regeling zekerheidstelling en betaling RVV-keurlonen 1993 wordt ‘Regeling keuring en
      handelsverkeer pluimveevlees 1992’ vervangen door: [Regeling][ref1][RVV][ref2]-tarieven pluimveevlees en vlees van
      klein vrij wild 1994.


