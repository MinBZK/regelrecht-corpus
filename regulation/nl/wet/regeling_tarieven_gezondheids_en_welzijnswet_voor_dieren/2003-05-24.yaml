  - number: 5b
    text: |-
      Voor het onderzoek, bedoeld in [artikel 77, tweede lid, van de Gezondheids- en welzijnswet voor dieren][ref1],
      voorzover dit betrekking heeft op het anders dan in doorvoer buiten Nederland brengen van vee, en voorzover dit
      binnen openingstijd wordt verricht, is de aanbieder een vergoeding verschuldigd, bestaande uit een starttarief van
      € 40,23 en een bedrag van

      a. € 32,10 per kwartier dat aan de werkzaamheden door een dierenarts is besteed, en

      b. € 19,09 per kwartier dat aan de werkzaamheden door een assistent is besteed.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel77
    url: https://wetten.overheid.nl/BWBR0006726/2003-05-24#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '77'
  - number: 5c
    text: |-
      1 Voor het onderzoek, bedoeld in [artikel 79 van de Gezondheids- en welzijnswet voor dieren][ref1], dat op verzoek
      van de aanbieder door de VWA binnen openingstijd wordt verricht, is de aanbieder een vergoeding verschuldigd.

      2 De in het eerste lid bedoelde vergoeding bedraagt € 20,00 per onderzoek.

      3 Voor zover voor het onderzoek inzet van een keuringsdierenarts of assistent nodig is, wordt de in het tweede
      lid bedoelde vergoeding verhoogd met een starttarief van € 34,16 en een bedrag van € 26,12 per kwartier dat aan
      het onderzoek door een dierenarts is besteed, en € 21,04 per kwartier dat aan de werkzaamheden door een assistent
      is besteed.

      4 Indien naar aanleiding van het verzoek van de aanbieder, bedoeld in het eerste lid, certificaten of geleide
      biljetten worden afgegeven, is de aanbieder boven de vergoeding, bedoeld in het tweede lid, een vergoeding
      verschuldigd van € 18,46 per certificaat of geleidebiljet.

      5 Indien in het kader van het in het eerste lid bedoelde onderzoek laboratoriumonderzoek noodzakelijk is, is
      boven de ingevolge het tweede lid verschuldigde vergoeding, een extra vergoeding ter hoogte van de kosten van het
      laboratoriumonderzoek verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel79
    url: https://wetten.overheid.nl/BWBR0006726/2003-05-24#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '79'
  - number: 5d
    text: |-
      Voor het onderzoek van het vervoermiddel, bedoeld in
      [artikel 9, eerste lid, van het Besluit dierenvervoer 1994][ref1], voorzover dit binnen openingstijd wordt
      verricht, is de aanbieder een vergoeding verschuldigd, bestaande uit een starttarief van € 40,23 en een bedrag van

      a. € 32,10 per kwartier dat aan de werkzaamheden door een dierenarts is besteed, en

      b. € 19,09 per kwartier dat aan de werkzaamheden door een assistent is besteed, en

      c. € 16,79 per afgegeven bewijsstuk en daarbij behorende dierenvervoerplaat, bedoeld in
      [artikel 9 van de Regeling dierenvervoer][ref2].


