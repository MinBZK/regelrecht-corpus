      1 Voor de werkzaamheden binnen openingstijd ter zake van het slachten van pluimvee en loopvogels (Ratites) als
      bedoeld in de Regeling keuring en handel dierlijke producten is de aanbieder een vergoeding verschuldigd, bestaande
      uit een starttarief ten bedrage van € 30,93 en een tarief per dier voor de volgende categorieën:

      a. pluimvee en loopvogels (Ratites) met een geslacht gewicht van minder dan 2 kilogram;

      b. pluimvee en loopvogels (Ratites) met een geslacht gewicht van 2 tot en met 5 kilogram;

      c. pluimvee en loopvogels (Ratites), met een geslacht gewicht van meer dan 5 kilogram.

      2 Onverminderd het derde en het vierde lid, wordt het tarief per dier, bedoeld in het eerste lid, onderdelen
      a, b en c, berekend door het aantal kwartieren dat op één en dezelfde dag door de met de werkzaamheden belaste
      dierenarts of dierenartsen aan keuring en onderzoek in verband met het slachten van dieren van dezelfde categorie
      in een slachterij is besteed, de tijd die met onderbrekingen en uitstel van de werkzaamheden is gemoeid hieronder
      begrepen, te vermenigvuldigen met € 24,11 en de uitkomst hiervan te delen door het aantal dieren van dezelfde
      categorie, dat op deze dag in de desbetreffende slachterij is geslacht.

      3 Indien de in het tweede lid bedoelde dierenarts of dierenartsen zich bij de werkzaamheden laten bijstaan door
      één of meer assistenten, wordt het tarief per dier, bedoeld in het eerste lid, berekend door het totaal aantal
      kwartieren dat op één en dezelfde dag door één of meer dierenartsen aan keuring en onderzoek in verband met het
      slachten van dieren van dezelfde soort in een slachterij is besteed te vermenigvuldigen met € 24,11 en de uitkomst
      van die vermenigvuldiging te verhogen met de uitkomst van de vermenigvuldiging van het totaal aantal door de
      assistent of de assistenten aan desbetreffende keuring en onderzoek bestede kwartieren met € 16,02.

      4 Het tarief per dier, bedoeld in het eerste lid, onderdelen a, b en c, bedraagt:

      a. voor pluimvee en loopvogels (Ratites) met een geslacht gewicht van minder dan 2 kilogram ten minste € 0,0045;

      b. voor pluimvee en loopvogels (Ratites) met een geslacht gewicht van 2 tot en met 5 kilogram ten minste € 0,0090;

      c. voor pluimvee en loopvogels (Ratites) met een geslacht gewicht van meer dan 5 kilogram ten minste € 0,0180.

      5 Onverminderd het tarief per dier is de aanbieder, bedoeld in het eerste lid, een vergoeding verschuldigd van €
      1,35 per ton geslacht gewicht voor de controles, bedoeld in bijlage B van [richtlijn 85/73/EEG](31985L0073).
    url: https://wetten.overheid.nl/BWBR0006726/2003-05-24#Artikel2
  - number: 2a
    text: |-
      1 In afwijking van [artikel 2][ref1] is de aanbieder, het hoofd of de bestuurder voor werkzaamheden binnen
      openingstijd ter zake van het slachten van pluimvee als bedoeld in de Regeling keuring en handel dierlijke
      producten, een vergoeding verschuldigd bestaande uit een starttarief van € 30,93 en een bedrag van

      a. € 24,11 per kwartier dat aan de werkzaamheden door een dierenarts is besteed, en

      b. € 16,02 per kwartier dat aan de werkzaamheden door een assistent is besteed

      indien in de slachterij een deel van de werkzaamheden overeenkomstig artikel 4.4, eerste lid, onderdeel d, van
      voornoemde regeling wordt uitgevoerd door hiertoe speciaal opgeleid personeel van deze slachterij.

      2 Onverminderd het eerste lid, is per kalenderjaar en, indien het slachten plaatsvindt met gebruikmaking van een
      band, voor elke band afzonderlijk tenminste een tarief verschuldigd van gemiddeld:

      a. € 0,0045 per geslacht dier indien het geslacht gewicht minder dan 2 kg bedraagt;

      b. € 0,0090 per geslacht dier indien het geslacht gewicht 2 kg tot en met 5 kg bedraagt;

      c. € 0,0180 per geslacht dier indien het geslacht gewicht meer dan 5 kg bedraagt.

      3

      Onverminderd het eerste en tweede lid is de aanbieder, bedoeld in het eerste lid, een heffing verschuldigd van €
      1,35 per ton geslacht gewicht voor de controles, bedoeld in bijlage B van [richtlijn 85/73/EEG](31985L0073).


      [ref1]: https://wetten.overheid.nl/BWBR0006726#Artikel2
    url: https://wetten.overheid.nl/BWBR0006726/2003-05-24#Artikel2a
