    url: https://wetten.overheid.nl/BWBR0006726/2003-05-24#Artikel2b
  - number: '3'
    text: |-
      Voor werkzaamheden binnen openingstijd ter zake van een op grond van artikel 4.16 van de Regeling keuring en handel
      dierlijke producten aan erkenning onderworpen uitsnijderij, is de eigenaar, het hoofd of de bestuurder van de
      uitsnijderij een vergoeding verschuldigd bestaande uit een starttarief van € 29,26 en een bedrag van

      a. € 19,24 per kwartier dat aan de werkzaamheden door een dierenarts is besteed, en

      b. € 12,39 per kwartier dat aan de werkzaamheden door een assistent is besteed.
    url: https://wetten.overheid.nl/BWBR0006726/2003-05-24#Artikel3
  - number: '4'
    text: |-
      Voor de werkzaamheden binnen openingstijd ter zake van een op grond van artikel 4.16 van de Regeling keuring en
      handel dierlijke producten aan erkenning onderworpen koel- of vrieshuis, is de eigenaar, het hoofd of de bestuurder
      van het koel- of vrieshuis een vergoeding verschuldigd bestaande uit een starttarief van € 29,26 en een bedrag van

      a. € 19,24 per kwartier dat aan de werkzaamheden door een dierenarts is besteed, en

      b. € 12,39 per kwartier dat aan de werkzaamheden door een assistent is besteed.
    url: https://wetten.overheid.nl/BWBR0006726/2003-05-24#Artikel4
  - number: 4a
    text: |-
      1 Degene die een aanvraag indient om een toelating, aanwijzing, erkenning of registratie als bedoeld in de bijlage
      bij deze regeling, is voor de behandeling van de aanvraag een vergoeding verschuldigd.

      2 De in het eerste lid bedoelde vergoeding bedraagt € 55,00 per aanvraag.

      3 Voor zover naar het oordeel van de VWA voor de behandeling van de aanvraag inzet van een keuringsdierenarts of
      assistent nodig is, wordt de in het tweede lid bedoelde vergoeding per aanvraag verhoogd met een starttarief van €
      45,00 en een bedrag van € 20,00 per kwartier voor iedere keuringsdierenarts of met € 15,00 per kwartier voor iedere
      assistent die is belast met de behandeling van de in het eerste lid bedoelde aanvraag.
    url: https://wetten.overheid.nl/BWBR0006726/2003-05-24#Artikel4a
  - number: 4b
    text: |-
      Voor de periodieke inspecties ten behoeve van de instandhouding van de in [artikel 4a][ref1] bedoelde toelating,
      aanwijzing, erkenning of registratie, is de houder van de toelating, aanwijzing, erkenning of registratie, een
      vergoeding verschuldigd bestaande uit een starttarief van € 30,00 vermeerderd met een bedrag van:

        - € 20,00 per kwartier dat aan de inspecties door een dierenarts is besteed, en
        - € 15,00 per kwartier dat aan de inspecties door een assistent is besteed.


      [ref1]: https://wetten.overheid.nl/BWBR0006726#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006726/2003-05-24#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006726
        artikel: 4a
  - number: '5'
    text: |-
      1 Voor het onderzoek, bedoeld in artikel 2.17, vijfde lid, van de Regeling keuring en handel dierlijke produkten is
      de aanbieder een heffing verschuldigd bestaande uit een tarief van € 0,0090 per kg met dien verstande dat voor elke
      ter keuring aangeboden partij goederen ten minste € 54,66 en ten hoogste € 420,56 in rekening zal worden gebracht.

      2 Indien de partij afkomstig is uit Nieuw-Zeeland is de aanbieder, in afwijking van het eerste lid, een vergoeding
      verschuldigd bestaande uit een tarief van € 0,0015 per kg met dien verstande dat voor elke ter keuring aangeboden
      partij ten minste € 30,00 en ten hoogste € 350,00 in rekening zal worden gebracht.

      3 Onverminderd het eerste en tweede lid, is de aanbieder voor onderzoeken en keuringen die verricht worden op grond
      van artikel 2.21, tweede lid, van de Regeling keuring en handel dierlijke producten, een vergoeding verschuldigd.

      4 De in het derde lid bedoelde vergoeding bedraagt de werkelijke kosten van de verrichte onderzoeken en keuringen,
      met inbegrip van en voor zover van toepassing, de administratiekosten, de loonkosten en de sociale premies van de
      met de onderzoeken en keuringen belaste personen van de VWA en de kosten van laboratoriumonderzoek.
    url: https://wetten.overheid.nl/BWBR0006726/2003-05-24#Artikel5
  - number: 5a
    text: |-
      1 Voor het onderzoek, bedoeld in artikel 2.35, derde lid, en artikel 2.44, vijfde lid, van de Regeling handel
      levende dieren en levende producten, is de aanbieder:

      a. ter zake van runderen, paardachtigen, varkens, schapen en geiten, pluimvee, konijnen, klein vederwild
      en haarwild alsmede ter zake van dieren als bedoeld in [Richtlijn 92/65/EEG](31992L0065) van de Raad van de
      Europese Gemeenschappen van 13 juli 1992 tot vaststelling van veterinairrechtelijke voorschriften voor het
      handelsverkeer en de invoer in de Gemeenschap van dieren, sperma, eicellen en embryo's waarvoor ten aanzien van de
      veterinairrechtelijke voorschriften geen specifieke communautaire regelgeving als bedoeld in bijlage A, onder 1,
      van [Richtlijn 90/425/EEG](31990L0425) geldt (PbEG L 268) een vergoeding verschuldigd van € 0,0090 per kg levend
      gewicht, met dien verstande dat voor elke ter keuring aangeboden partij ten minste € 54,66 en ten hoogste € 420,56
      in rekening zal worden gebracht;

      b. ter zake van diersoorten als bedoeld in Beschikking 92/432/EEG van de Commissie van de Europese Gemeenschappen
      van 23 juli 1992 tot vaststelling van bepaalde voorwaarden om af te wijken van het beginsel van individueel
      klinisch onderzoek van uit derde landen afkomstige dieren (PbEG L 237) een vergoeding verschuldigd van € 0,0090 per
      kg levend gewicht, met dien verstande dat voor elke ter keuring aangeboden partij ten hoogste € 420,56 in rekening
      zal worden gebracht ;

      c. ter zake van producten als bedoeld in de Regeling handel levende dieren en levende producten een vergoeding
      verschuldigd van € 0,0090 per kg levend gewicht, met dien verstande dat voor elke ter keuring aangeboden partij ten
      minste € 54, 66 en ten hoogste € 420,56 in rekening zal worden gebracht.

      2 Indien het een partij levende dieren als bedoeld in het eerste lid, onderdeel a of b, betreft, die afkomstig is
      uit Nieuw Zeeland, is de aanbieder, in afwijking van het eerste lid, een vergoeding verschuldigd bestaande uit een
      bedrag van € 0,0050 per kg, met dien verstande dat voor elke ter keuring aangeboden partij ten minste € 30,00 en
      ten hoogste € 350,00 in rekening zal worden gebracht.

      3 Indien het een partij producten als bedoeld in het eerste lid, onderdeel c, betreft, die afkomstig is uit Nieuw-
      Zeeland, is de aanbieder, in afwijking van het eerste lid, een vergoeding verschuldigd, bestaande uit een bedrag
      van € 0,0015 per kg, met dien verstande dat voor elke ter keuring aangeboden partij ten minste € 30,00 en ten
      hoogste € 350,00 in rekening zal worden gebracht.

      4 Onverminderd het eerste, tweede en derde lid, is de aanbieder voor onderzoeken en keuringen die verricht worden
      op grond van artikel 2.39, tweede lid, en artikel 2.48, tweede lid, van de Regeling handel levende dieren en
      levende producten, een vergoeding verschuldigd.

      5 De in het vierde lid bedoelde vergoeding bedraagt de werkelijke kosten van de verrichte onderzoeken en keuringen,
      met inbegrip van en voor zover van toepassing, de administratiekosten, de loonkosten en de sociale premies van de
      met de onderzoeken en keuringen belaste personen van de VWA en de kosten van laboratoriumonderzoek.
    url: https://wetten.overheid.nl/BWBR0006726/2003-05-24#Artikel5a
  - number: 5aa
    text: |-
      De kosten, bedoeld in artikel 2.23f van de Regeling keuring en handel dierlijke producten en
      [artikel 2.50f van de Regeling handel levende dieren en levende producten][ref1], bestaan uit een starttarief van €
      30,00 vermeerderd met een bedrag van:

        - € 20,00 per kwartier dat aan de keuringen en controles door een dierenarts is besteed, en
        - € 15,00 per kwartier dat aan de keuringen en controles door een assistent is besteed


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.50f
