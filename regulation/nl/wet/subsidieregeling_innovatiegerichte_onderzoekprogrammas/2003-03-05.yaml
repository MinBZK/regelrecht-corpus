        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009119
        artikel: '14'
        paragraaf: '3'
  - number: '16'
    text: |-
      1 De minister legt bij de subsidieverlening verplichtingen op met betrekking tot

      het geven van bekendheid aan het onderzoekproject en de resultaten ervan.

      2 De minister kan bij de subsidieverlening verplichtingen opleggen met betrekking tot de samenwerking met derden
      bij of in verband met de uitvoering van het onderzoekproject.
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel16
  - number: '17'
    text: |-
      1 Op een subsidie ter zake waarvan een beschikking tot subsidieverlening geldt, kunnen op aanvraag van de subsidie-
      ontvanger door de minister voorschotten worden verstrekt.

      2 Een voorschot wordt berekend naar rato van de gemaakte en betaalde projectkosten, voor zover deze nog niet eerder
      bij de verstrekking van een voorschot in aanmerking zijn genomen. In totaal zal het bedrag aan voorschotten niet
      groter zijn dan 80 procent van het bij de subsidieverlening vermelde maximale subsidiebedrag.

      3 Een voorschot wordt slechts verstrekt, indien het bedrag aan voorschot ten minste € 4 500 bedraagt.
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel17
  - number: '18'
    text: |-
      1 Een aanvraag wordt in behandeling genomen na het uitbrengen van een verslag als bedoeld in
      [artikel 13, eerste lid][ref1].

      2 Een aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat is opgenomen
      in de bij deze regeling behorende bijlage 5.


      [ref1]: https://wetten.overheid.nl/BWBR0009119#Artikel13
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009119
        artikel: '13'
        paragraaf: '3'
  - number: '19'
    text: |-
      De minister kan afwijzend beschikken op een aanvraag, indien een subsidie-ontvanger niet heeft voldaan aan
      ingevolge de subsidieverlening voor hem geldende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel19
  - number: '20'
    text: |-
      De minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag daartoe
      dan wel nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel20
  - number: '21'
    text: |-
      Op projecten waarvoor de aanvraag om subsidie is ingediend vóór de inwerkingtreding van deze regeling zijn de
