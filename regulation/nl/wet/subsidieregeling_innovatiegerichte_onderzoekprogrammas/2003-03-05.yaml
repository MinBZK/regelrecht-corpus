  - number: '4'
    text: |-
      1 Als projectkosten worden uitsluitend in aanmerking genomen de volgende rechtstreeks aan het onderzoekproject toe
      te rekenen, na de indiening van de aanvraag gemaakte en betaalde kosten:

      a. voor wat betreft loonkosten en daarmee verbonden opslagen:

      1°. voor zover een universiteit subsidie-ontvanger is: loonkosten van onderzoekers met wie een arbeidsovereenkomst
      is gesloten met het oog op het onderzoekproject, met inbegrip van een opslag voor de kosten van verbruikte
      materialen, hulpmiddelen en de inhuur van testpersonen, technici en analisten, met dien verstande dat per categorie
      van onderzoeker wordt uitgegaan van de in bijlage 2 bij deze regeling opgenomen bedragen;

      2°. voor zover een onderzoekinstelling subsidie-ontvanger is: loonkosten van betrokken onderzoekers, met
      inbegrip van een opslag voor algemene kosten, voor de kosten van verbruikte materialen, hulpmiddelen en de inhuur
      van testpersonen, technici en analisten, en voor de kosten in verband met het gebruik van apparatuur met een
      historische aanschafwaarde van minder dan € 45 400, met dien verstande dat wordt uitgegaan van een door de minister
      goedgekeurd tarief;

      b. de kosten van verbruikte materialen, hulpmiddelen en de inhuur van testpersonen, technici en analisten, voor
      zover deze meer bedragen dan € 11 400 per onderzoeker per jaar;

      c. de kosten van de voor het onderzoekproject aangeschafte machines en apparatuur;

      d. kosten van andere machines en apparatuur met een historische aanschafwaarde van € 45 400 of meer, met dien
      verstande dat wordt uitgegaan van de aan het onderzoekproject toe te rekenen lease-termijnen, met uitzondering van
      financieringskosten, of afschrijvingstermijnen, berekend op basis van de historische aanschafwaarde en een lineaire
      afschrijvingsmethode;

      e. aan een universiteit of onderzoekinstelling, niet zijnde een deelnemer in het samenwerkingsverband,
      verschuldigde kosten ter zake van het gebruik van machines en apparatuur als bedoeld onder d.

      2 Indien machines en apparatuur worden aangeschaft door middel van een lease-overeenkomst, is het vereiste dat de
      kosten moeten zijn betaald niet van toepassing en wordt de contante waarde van de in totaal verschuldigde lease-
      termijnen, verdisconteerd op jaarbasis tegen 6 procent, als kosten van aanschaf in aanmerking genomen.

      3 De kosten worden in aanmerking genomen met inbegrip van omzetbelasting, indien de subsidie-ontvanger die de
      kosten heeft gemaakt, omzetbelasting niet in aftrek kan brengen.
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel4
  - number: '5'
    text: |-
      1 De minister stelt bij ministeriële regeling perioden vast, waarbinnen aanvragen om subsidie in het kader van
      een onderzoekprogramma kunnen worden ingediend. De minister stelt voorts bij ministeriële regeling perioden vast,
      waarbinnen verzoeken om een preadvies inzake een onderzoekproject kunnen worden ingediend.

      2 De minister stelt voorts bij ministeriële regeling per onderzoekprogramma een subsidieplafond vast voor het
      verlenen van subsidies in het kader van een onderzoekprogramma op in een periode ontvangen aanvragen. Daarbij kan
      hij afzonderlijke subsidieplafonds vaststellen voor bepaalde onderdelen van een onderzoekprogramma.
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel5
  - number: '6'
    text: |-
      1 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat
      is opgenomen in de bij deze regeling behorende bijlage 3.

      2 De aanvraag gaat vergezeld van een begroting en van een projectplan alsmede van andere bescheiden, overeenkomstig
      hetgeen in het formulier is vermeld.

      3 De aanvrager dient te beschikken over een pre-advies van de stuurgroep, doch hij behoeft deze niet bij de
      aanvraag te voegen.

      4 Indien de aanvraag een project betreft dat wordt uitgevoerd door een samenwerkingsverband dient een deelnemer de
      aanvraag mede namens de andere deelnemers in.
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel6
  - number: 6a
    text: |-
      1 In afwijking van [artikel 6, eerste lid][ref1], kan de aanvraag om subsidie elektronisch worden ingediend, indien
      de aanvraag wordt ingediend met gebruikmaking van de elektronische weg die daartoe is geopend en de indiening
      geschiedt met toepassing van de pincode en het certificaat die aan de aanvrager zijn toegekend.

      2 De aanvraag gaat vergezeld van de documenten, bedoeld in [artikel 6, tweede lid][ref2].
      [Artikel 6, derde lid][ref3], is van overeenkomstige toepassing.

      3 Als tijdstip waarop de aanvraag is ontvangen, geldt het tijdstip waarop de aanvraag het systeem voor
      gegevensverwerking van de minister heeft bereikt.

      4 De minister bevestigt de ontvangst van de aanvraag.

      5 De minister kan weigeren de aanvraag te aanvaarden indien de betrouwbaarheid of vertrouwelijkheid daarvan
      onvoldoende is gewaarborgd, gelet op de aard en inhoud van de aanvraag. De minister deelt een weigering zo spoedig
      mogelijk aan de afzender mee.

      6 De ontvangstbevestiging, bedoeld in het vierde lid, en de weigering, bedoeld in het vijfde lid, worden
      elektronisch verzonden. Als tijdstip waarop het bericht is verzonden, geldt het tijdstip waarop het bericht een
      systeem voor gegevensverwerking bereikt waarover de minister geen controle heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009119#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009119#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009119#Artikel6
