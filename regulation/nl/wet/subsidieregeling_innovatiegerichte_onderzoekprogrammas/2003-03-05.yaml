  - number: '12'
    text: |-
      1 De subsidie-ontvanger voert het onderzoekproject uit overeenkomstig het projectplan waarop de subsidieverlening
      betrekking heeft en voor het bij de subsidieverlening bepaalde tijdstip, behoudens voorafgaande schriftelijke
      ontheffing van de minister voor het vertragen, het essentieel wijzigen, of het stopzetten van het onderzoekproject.

      2 De subsidie-ontvanger voert het onderzoekproject in Nederland uit, behoudens voorafgaande schriftelijke
      ontheffing van de minister voor gedeeltelijke uitvoering buiten Nederland.

      3 De subsidie-ontvanger voert een administratie die zodanig is ingericht, dat daaruit te allen tijde op
      eenvoudige en duidelijke wijze alle projectkosten kunnen worden afgelezen, gespecificeerd overeenkomstig de in
      [artikel 4][ref1] onderscheiden kostensoorten, met dien verstande dat ter zake van de loonkosten een door middel
      van een sluitende tijdschrijving vastgestelde urenverantwoording per werknemer aanwezig dient te zijn, dan wel,
      indien de subsidie-ontvanger een universiteit is, een arbeidsovereenkomst waaruit het aantal door de onderzoeker
      aan het onderzoekproject te besteden uren kan worden afgeleid.

      4 De subsidie-ontvanger doet onverwijld nadat een verzoek tot verlening van surséance van betaling aan of
      faillietverklaring van hem bij de rechtbank is ingediend daarvan mededeling aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009119#Artikel4
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel12
    references:
