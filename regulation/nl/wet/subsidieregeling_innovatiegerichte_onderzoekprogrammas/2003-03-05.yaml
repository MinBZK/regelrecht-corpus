        bwb_id: BWBR0009119
        artikel: '4'
        paragraaf: '1'
  - number: '13'
    text: |-
      1 De subsidie-ontvanger brengt steeds na afloop van een periode van zes maanden aan de minister schriftelijk
      verslag uit omtrent de uitvoering van het onderzoekproject, met inbegrip van een vergelijking van die uitvoering
      met het projectplan en de bij de subsidieverlening vermelde raming van de projectkosten.

      2 De subsidie-ontvanger dient zijn aanvraag tot subsidievaststelling in binnen zes maanden na het tijdstip waarop
      het onderzoekproject ingevolge [artikel 12, eerste lid][ref1], moet zijn uitgevoerd.

      3 De aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat is opgenomen
      in de bij deze regeling behorende bijlage 4.

      4 De aanvraag gaat vergezeld van een accountantsverklaring, indien het bedrag van de subsidieverlening meer dan €
      50 000 bedraagt, en een eindverslag omtrent de uitvoering en de resultaten van het onderzoekproject, overeenkomstig
      hetgeen in het formulier is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009119#Artikel12
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009119
        artikel: '12'
        paragraaf: '3'
  - number: '14'
    text: |-
      1 De subsidie-ontvanger draagt, behoudens voorafgaande schriftelijke ontheffing van de minister, met betrekking tot
      de resultaten van het onderzoekproject zorg voor:

      a. de tenaamstelling op eigen naam en de verwerving van rechten van intellectuele eigendom op de resultaten die
      daarvoor in aanmerking komen;

      b. de instandhouding van de in het eerste lid bedoelde rechten;

      c. de instandhouding van andere voor de uitvoering van het onderzoekproject van belang zijnde en door de uitvoering
      van het onderzoekproject opgedane kennis.

      2 De subsidie-ontvanger stelt, behoudens voorafgaande schriftelijke ontheffing van de minister en behoudens de
      toepassing die de minister geeft aan [artikel 16, eerste lid][ref1], niet ter beschikking aan derden:

      a. rechten van intellectuele eigendom op de resultaten van het onderzoekproject;

      b. aanspraken op een intellectueel eigendomsrecht op de resultaten van het onderzoekproject;

      c. rechten die voortvloeien uit een aanvraag om een intellectueel eigendomsrecht op de resultaten van het
      onderzoekproject;

      d. niet door rechten van intellectuele eigendom beschermde resultaten van het onderzoekproject.

      3 De subsidie-ontvanger belast, behoudens voorafgaande schriftelijke ontheffing van de minister, de in het tweede
      lid bedoelde rechten en aanspraken niet met een zekerheidsrecht ten behoeve van een derde.

      4 De subsidie-ontvanger brengt desgevraagd aan de minister verslag uit omtrent de toepassing van de resultaten van
      het onderzoekproject.


      [ref1]: https://wetten.overheid.nl/BWBR0009119#Artikel16
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009119
        artikel: '16'
        paragraaf: '3'
  - number: '15'
    text: |-
      De minister kan aan een ontheffing als bedoeld in de [artikelen 12][ref1] en [14][ref2] voorschriften verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0009119#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009119#Artikel14
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel15
