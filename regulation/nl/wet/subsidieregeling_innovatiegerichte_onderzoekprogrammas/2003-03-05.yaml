articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             universiteit:

              de onder a en b van de bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek
      genoemde instellingen voor hoger onderwijs en de in bijlage 1, onder I, bij deze regeling vermelde bijzondere
      onderzoekinstellingen;



            b
             onderzoekinstelling:

              een in bijlage 1, onder II, bij deze regeling vermelde instelling;



            c
            samenwerkingsverband:

              een geen rechtspersoonlijkheid bezittend verband, bestaande uit ten minste twee universiteiten of twee
      onderzoekinstellingen of bestaande uit een of meer universiteiten en een of meer onderzoekinstellingen;



            d
             onderzoekproject:

              een samenhangend geheel van voor Nederland nieuwe activiteiten, bestaande uit fundamenteel onderzoek of
      toepassingsgericht onderzoek of een combinatie daarvan;



            e
             stuurgroep:

              de Stuurgroep innovatiegerichte onderzoekprogramma's.



            f
             ondernemer:

              een natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht is
      ingesteld, die een onderneming in stand houdt.
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel1
  - number: '2'
    text: |-
      1 De minister verstrekt op een aanvraag subsidie aan een universiteit of een onderzoeksinstituut die al dan
      niet in een samenwerkingsverband voor eigen rekening en risico een onderzoekproject uitvoert dat past in een
      onderzoekprogramma.

      2 Als onderzoekprogramma’s worden aangewezen de door de stuurgroep vastgestelde meerjarenplannen met betrekking tot
      de volgende onderzoekgebieden:

      a. beeldverwerking;

      b. industriële eiwitten;

      c. katalyse;

      d. metalen;

      e. milieutechnologie met als onderwerp zware metalen;

      f. oppervlaktetechnologie;

      g. opto-electronica;

      h. verf;

      alsmede andere onderzoekprogramma’s die in een ministeriële regeling als bedoeld in

      [artikel 5, eerste lid][ref1], zijn aangewezen.

      3 Geen subsidie wordt verstrekt:

      a. indien voor het onderzoekproject reeds door de minister subsidie is verstrekt;

      b. indien de totale bijdrage van een of meer ondernemers met betrekking tot het onderzoekproject meer bedraagt dan
      15 procent van de projectkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0009119#Artikel5
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009119
        artikel: '5'
        paragraaf: '2'
  - number: '3'
    text: |-
      1 De subsidie bedraagt:

      a. voor zover een universiteit subsidie-ontvanger is:

      1°. 100 procent van de projectkosten, bedoeld in [artikel 4, eerste lid][ref1], aanhef en onder a, 1°, en b,

      2°. 50 procent van de projectkosten, bedoeld in [artikel 4, eerste lid][ref2], aanhef en onder c, d en e,

      3°. € 6 850 per onderzoeker in het geval van een in verband met het project doorgebrachte stage in het buitenland
      van drie maanden, indien ter zake kosten zijn gemaakt;

      b. voor zover een onderzoekinstelling subsidie-ontvanger is:

      1°. 50 procent van de projectkosten, bedoeld in [artikel 4, eerste lid][ref3], aanhef en onder a, 2°, c, d en e,

      2°. 100% van de projectkosten, bedoeld in [artikel 4, eerste lid][ref4], aanhef en onder b.

      2 Bij de toepassing van het eerste lid worden de bijdragen met betrekking tot de projectkosten van derden, niet
      zijnde ondernemers, op de projectkosten in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009119#Artikel4
