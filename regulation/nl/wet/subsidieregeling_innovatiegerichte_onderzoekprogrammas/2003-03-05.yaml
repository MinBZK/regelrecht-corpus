  - number: '7'
    text: De minister geeft een beschikking binnen vier maanden na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel7
  - number: '8'
    text: |-
      De minister beslist in ieder geval afwijzend op een aanvraag indien:

      a. de aanvraag niet voldoet aan deze regeling;

      b. hij het onaannemelijk acht dat het onderzoekproject binnen vier jaar kan worden voltooid;

      c. gegronde vrees bestaat dat de betrokkenen het onderzoekproject niet kunnen financieren.
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel8
  - number: '9'
    text: |-
      1 De minister wint omtrent de aanvragen waarop niet met toepassing van [artikel 8][ref1] afwijzend wordt beslist
      het advies in van de stuurgroep.

      2 De stuurgroep geeft aan de minister in ieder geval een negatief advies indien:

      a. onvoldoende vertrouwen bestaat dat betrokkenen de capaciteiten hebben het onderzoekproject naar behoren uit
      te voeren;

      b. van het onderzoekproject onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn.

      3 De stuurgroep rangschikt per onderzoekprogramma of onderdeel daarvan waarvoor een subsidieplafond geldt de
      aanvragen waaromtrent hij positief adviseert zodanig, dat een onderzoekproject hoger gerangschikt wordt naar mate
      het meer bijdraagt aan de verwezenlijking van de doelstellingen van het betrokken onderzoekprogramma of van het
      betrokken onderdeel daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0009119#Artikel8
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009119
        artikel: '8'
        paragraaf: '2'
  - number: '10'
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien de stuurgroep een negatief advies heeft uitgebracht.

      2 De minister verdeelt het beschikbare bedrag in de volgorde van de rangschikking van de aanvragen door de
      stuurgroep.

      3 De minister kan afwijken van het eerste en tweede lid, indien een advies van de stuurgroep in strijd is met deze
      regeling dan wel niet op zorgvuldige wijze tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0009119/2003-03-05#Artikel10
  - number: '11'
    text: |-
      1 Op alle subsidie-ontvangers rusten de in de [artikelen 12][ref1], [13][ref2] en [14][ref3] opgenomen
      verplichtingen, met dien verstande dat de in [artikel 13, eerste lid][ref4], opgenomen verplichting slechts rusten
      op de subsidie-ontvanger die als indiener van de aanvraag om subsidie is opgetreden.

      2 De in de [artikelen 12][ref5] en [13][ref6] opgenomen verplichtingen gelden tot aan de dag waarop de subsidie
      wordt vastgesteld. De in [artikel 14][ref7] opgenomen verplichtingen gelden totdat vijf jaren na die dag zijn
      verstreken.


