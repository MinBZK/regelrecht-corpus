$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: verordening_fokken_van_tse_ongevoelige_schapen_pvv_2004
regulatory_layer: WET
publication_date: '2007-09-14'
valid_from: '2006-05-21'
bwb_id: BWBR0017171
url: https://wetten.overheid.nl/BWBR0017171/2006-05-21
preamble:
  text: |-
    Gelet op artikel 8 van de Regeling aanvullende voorschriften besmettelijke dierziekten en de artikelen 96, 97 en 98
    van de Wet op de bedrijfsorganisatie;

    Gelet op Beschikking nr. (EG) 2003/100 van de Commissie van 13 februari 2003 tot vaststelling van minimumeisen voor
    fokprogramma’s ter verkrijging van resistentie tegen overdraagbare spongiforme encephalopathieën bij schapen (PbEU
    L 041);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening wordt verstaan onder:








                  1.


                  productschap


                  :


                  het Productschap Vee en Vlees;




                  2.


                  bestuur


                  :


                  het bestuur van het productschap;




                  3.


                  voorzitter


                  :


                  de voorzitter van het productschap;




                  4.


                  TSE-ongevoelig


                  :


                  erfelijk bepaalde ongevoeligheid bij schapen voor overdraagbare spongiforme encephalopathieën waarbij
      het erfelijk materiaal op beide DNA strengen codeert voor alanine op codon 136 (A) en arginine op codon 154(R) en
      codon 171 (R) in codering weergegeven als ARR/ARR;




                  5


                  TSE-semi-ongevoelig


                  :


                  erfelijk bepaalde semi-ongevoeligheid voor overdraagbare spongiforme encephalopathieën waarbij het
      erfelijk materiaal op één afzonderlijke DNA-streng codeert voor alanine op codon 136 (A) en arginine op codon 154
      (R) en codon 171 (R) in codering weergegeven als ARR/x; met uitzondering van die genotypes waarbij het erfelijk
      materiaal op de andere DNA- streng codeert voor valine op codon 136 (V) en arginine op codon 154 (R) en glutamine
      op codon 171 (Q), in de codering aangegeven als ARR/VRQ;




                  6


                  TSE-gevoelig


                  :


                  erfelijk bepaalde gevoeligheid voor overdraagbare spongiforme encephalopathieën waarbij het erfelijk
      materiaal op beide DNA strengen niet codeert voor ARR of waarbij het erfelijk materiaal codeert voor ARR/VRQ;




                  7


                  regeling


                  :


                  [Regeling erkenning en aanwijzing veterinaire laboratoria][ref1] (Stcrt.2006,nr.37).


      [ref1]: https://wetten.overheid.nl/BWBR0019575
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019575
  - number: '2.1'
    text: Het is verboden schapen te fokken.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel2
  - number: '2.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing, indien voor de ram waarmee gefokt wordt een
      certificaat is afgegeven.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel2
  - number: '2.3'
    text: Het certificaat vergezelt de ram te allen tijde.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel2
  - number: '3.1'
    text: |-
      De houder van een ooi controleert, voorafgaand aan het dekken van een ooi door een ram, of voor de ram een
      certificaat, als bedoeld in [artikel 2, tweede lid][ref1], is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0017171#Artikel2
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017171
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      Indien de ram is overgedragen aan een andere houder dient een leesbare fotokopie van het certificaat van de ram,
      bedoeld in het eerste lid, gedurende drie jaar op de onderneming van de voormalig houder te worden bewaard.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel3
  - number: '4.1'
    text: |-
      Het in [artikel 2, tweede lid][ref1], bedoelde certificaat wordt afgegeven, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0017171#Artikel2
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017171
        artikel: '2'
        paragraaf: '2'
  - number: 4.1.a
    text: erfelijkheidsonderzoek heeft aangetoond dat de ram TSE-ongevoelig is,
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel4
  - number: 4.1.b
    text: |-
      naar genoegen van de voorzitter is gebleken dat de ram afstamt van een ram en een ooi, waarvan op grond van een
      erfelijkheidsonderzoek is vastgesteld dat zij TSE-ongevoelig zijn of
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel4
  - number: 4.1.c
    text: |-
      erfelijkheidsonderzoek heeft aangetoond dat de ram TSE-semi-ongevoelig of TSE-gevoelig is en de ram behoort tot
      een ras met een lage frequentie aan ARR-allel mits het betreffende ras als zeldzaam ras is opgenomen in bijlage I
      bij [Verordening (EG) nr. 445/2002](32002R0445) van de Commissie van de Europese Unie van 26 februari 2002 (PbEU
      L 074) tot vaststelling van uitvoeringsbepalingen van [Verordening (EG) nr. 1257/1999](31999R1257) van de Raad
      inzake steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL),
      of de ram staat ingeschreven in een op grond van het Fokkerijbesluit erkend stamboek en het fokken geschiedt binnen
      hetzelfde ras of stamboek.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel4
  - number: '4.2'
    text: |-
      In het in het eerste lid, onderdeel c, bedoelde geval wordt het certificaat alleen afgegeven, indien er een door
      de voorzitter erkend fokprogramma is opgesteld overeenkomstig het nader bij verordening door het bestuur vast te
      stellen selectieregime.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel4
  - number: '4.3'
    text: |-
      Het in het eerste lid bedoelde erfelijkheidsonderzoek wordt verricht door een laboratorium dat beschikt over een
      erkenning als bedoeld in [artikel 3 van de regeling][ref1], dan wel over een besluit tot gelijkstelling als bedoeld
      in [artikel 4 van de regeling][ref2], voor het uitvoeren van de testmethode genoemd in [bijlage I, onder 9, van de
      regeling](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0019575#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019575#Artikel4
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019575
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0019575
        artikel: '4'
  - number: '5.1'
    text: |-
      Het certificaat, bedoeld in [artikel 2, tweede lid][ref1], wordt door de houder bij het productschap aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0017171#Artikel2
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0017171
        artikel: '2'
        paragraaf: '2'
  - number: '5.2'
    text: Het model van het certificaat wordt namens het bestuur door de voorzitter bij besluit vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel5
  - number: '5.3'
    text: Het certificaat wordt uitgegeven door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel5
  - number: '5.4'
    text: Het in het tweede lid bedoelde besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel5
  - number: '6.1'
    text: Voor het certificaat is een vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel6
  - number: '6.2'
    text: De hoogte van de vergoeding wordt namens het bestuur door de voorzitter bij besluit vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel6
  - number: '6.3'
    text: Het in het tweede lid bedoelde besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel6
  - number: '7.1'
    text: |-
      In geval van verlies of diefstal van het certificaat stelt de houder het productschap hiervan schriftelijk en
      onverwijld op de hoogte.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel7
  - number: '7.2'
    text: |-
      De houder dient in het eerste lid bedoeld geval overeenkomstig [artikel 5][ref1] een certificaataanvraag in onder
      vermelding van de opdruk “duplicaat certificaat”.


      [ref1]: https://wetten.overheid.nl/BWBR0017171#Artikel5
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017171
        artikel: '5'
        paragraaf: '4'
  - number: '8.1'
    text: |-
      De voorzitter kan op grond van door het bestuur bij besluit vast te stellen voorwaarden op schriftelijk verzoek van
      belanghebbende van het bepaalde in de [artikelen 2][ref1], [3][ref2] en [4, eerste en tweede lid, sub c][ref3],
      ontheffing dan wel vrijstelling verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0017171#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017171#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0017171#Artikel4
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017171
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017171
        artikel: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0017171
        artikel: '4'
        paragraaf: '4'
  - number: '8.2'
    text: Aan een vrijstelling of ontheffing kunnen voorschriften of voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel8
  - number: '8.3'
    text: Een vrijstelling of ontheffing kan onder beperkingen worden verleend en kan te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel8
  - number: '8.4'
    text: Het in het eerste lid bedoelde besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel8
  - number: '9.1'
    text: |-
      Het fokken van schapen met een ram waarvoor geen certificaat als bedoeld in [artikel 2, tweede lid][ref1], is
      afgegeven, is toegestaan indien de houder van de ram negen of minder ooien houdt van één van de rassen die genoemd
      staan in de bijlage van de Verordening, mits deze rassen ressorteren onder de Vereniging Het Gotland pelsschaap, de
      Federatie van Buitenlandse Schapenrassen of de Vereniging van Speciale Schapenrassen.


      [ref1]: https://wetten.overheid.nl/BWBR0017171#Artikel2
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017171
        artikel: '2'
        paragraaf: '2'
  - number: '9.2'
    text: |-
      Het fokken van schapen met een ram waarvoor geen certificaat als bedoeld in [artikel 2, tweede lid][ref1], is
      afgegeven, is eveneens toegestaan indien de ram wordt gehouden in de grote eenheden natuur, als bedoeld in de
      Leidraad Grote Grazers van de Minister van Landbouw, Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0017171#Artikel2
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017171
        artikel: '2'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Op overtreding van de bepalingen van [artikel 3, tweede lid][ref1], worden tuchtrechtelijke maatregelen gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017171#Artikel3
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017171
        artikel: '3'
        paragraaf: '3'
  - number: '10.2'
    text: 'De tuchtrechtelijke maatregelen bedoeld in het eerste lid zijn:'
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel10
  - number: 10.2.a
    text: een berisping;
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel10
  - number: 10.2.b
    text: |-
      een geldboete van ten hoogste het bedrag van de derde categorie bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1]welke geheel of gedeeltelijk voorwaardelijk kan
      worden opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 10.2.c
    text: het stellen van de betrokkene onder verscherpte controle op zijn kosten, voor ten hoogste 2 jaren;
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel10
  - number: 10.2.d
    text: openbaarmaking van de tuchtbeschikking op kosten van de veroordeelde.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel10
  - number: '11.1'
    text: |-
      Een door de Gezondheidsdienst voor Dieren op grond van het “Reglement scrapiebestrijding 2003” vóór 1 juli
      2005 afgegeven verklaring waaruit blijkt dat de ram TSE-ongevoelig is, geldt als certificaat als bedoeld in
      [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017171#Artikel2
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017171
        artikel: '2'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Rassen en stamboeken die staan vermeld op de bij deze verordening horende bijlage zijn tot 1 april 2005
      vrijgesteld van de verplichting tot het erkennen van hun fokprogramma door de voorzitter als bedoeld in
      [artikel 4, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017171#Artikel4
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017171
        artikel: '4'
        paragraaf: '4'
  - number: '12.1'
    text: 'Deze verordening wordt aangehaald als: Verordening fokken van TSE-ongevoelige schapen (PVV) 2004.'
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel12
  - number: '12.2'
    text: |-
      Deze verordening treedt in werking met ingang van de tweede dag na de dagtekening van het Verordeningenblad
      Bedrijfsorganisatie waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0017171/2006-05-21#Artikel12
