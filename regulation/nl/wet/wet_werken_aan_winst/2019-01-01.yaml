  - number: IX
    text: |-
      De vennootschapsbelasting over een boekjaar dat voor 1 januari 2007 aanvangt en op of na die datum eindigt, wordt,
      in afwijking in zoverre van [artikel 22 van de Wet op de vennootschapsbelasting 1969][ref1], berekend volgens de
      formule:

      belasting = (X/B x To) + (Y/B x Tn), waarin:

        - X voorstelt: het aantal voor 1 januari 2007 vallende dagen van het boekjaar;
        - Y voorstelt: het aantal na 31 december 2006 vallende dagen van het boekjaar;
        - B voorstelt: het totale aantal dagen van het boekjaar;
        - To voorstelt: de verschuldigde belasting over het belastbare bedrag of het belastbare Nederlandse bedrag op basis
      van het tarief van de vennootschapsbelasting zoals dat tarief luidt op 31 december 2006;
        - Tn voorstelt: de verschuldigde belasting over het belastbare bedrag of het belastbare Nederlandse bedrag op basis
      van het tarief van de vennootschapsbelasting zoals dat tarief luidt met ingang van 1 januari 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel22
