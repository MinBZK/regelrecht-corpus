  - number: XIII
    text: |-
      1 Deze wet treedt in werking met ingang van 1 januari 2007.

      2 In afwijking van het eerste lid treedt [artikel IV][ref1] in werking met ingang van 31 december 2006.

      3 De wijzigingen met betrekking tot de vennootschapsbelasting, uitgezonderd
      [artikel II, onderdeel M][ref2], voor zover dat betrekking heeft op de in te voegen [artikelen 12b][ref3] en
      [12c van de Wet op de vennootschapsbelasting 1969][ref4], vinden voor het eerst toepassing met betrekking tot
      boekjaren die aanvangen op of na 1 januari 2007.

      4 In afwijking van het eerste lid treedt [artikel II, onderdeel M][ref5], voor zover dat betrekking heeft op het
      in te voegen [artikel 12b van de Wet op de vennootschapsbelasting 1969][ref6], in werking op een bij koninklijk
      besluit te bepalen tijdstip waarbij dat tijdstip terugwerkende kracht kan hebben en vindt voor het eerst toepassing
      met betrekking tot boekjaren die aanvangen op of na dat tijdstip van inwerkingtreding.

      5

      6 In afwijking van het eerste lid treden [artikel I, onderdelen Da en Ea][ref7], in werking op een bij koninklijk
      besluit te bepalen tijdstip waarbij dat tijdstip terugwerkende kracht kan hebben.

      7 De wijzigingen ingevolge [artikel III][ref8] vinden toepassing op de opbrengst van de in
      [artikel 1 van de Wet op de dividendbelasting 1965][ref9] bedoelde aandelen, winstbewijzen en geldleningen, die op
      of na 1 januari 2007 ter beschikking is gesteld.


