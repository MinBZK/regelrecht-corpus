  - number: VIIId
    text: |-
      1 Ingeval de belastingplichtige een belang bezit dat geen deelneming is maar waarop tot en met 31 december
      2006 bij hem de deelnemingsvrijstelling van [artikel 13 van de Wet op de vennootschapsbelasting 1969][ref1],
      zoals [dat artikel][ref2] toen luidde, wel van toepassing was omdat dat bezit ingevolge
      [artikel 13, derde lid, laatste volzin][ref3], met een deelneming werd gelijkgesteld, wordt
      tot 1 januari 2010 dat belang gelijkgesteld met een deelneming als waarvan sprake is in
      [artikel 13, tweede lid, van de Wet op de vennootschapsbelasting 1969][ref4] zoals [dat artikel][ref5] luidt met
      ingang van 1 januari 2007.

      2 Het eerste lid is van overeenkomstige toepassing met betrekking tot een belang van een commanditaire vennoot
      in een open commanditaire vennootschap waarop tot en met 31 december 2006 de deelnemingsvrijstelling, bedoeld
      in [artikel 13 van de Wet op de vennootschapsbelasting 1969][ref6] zoals [dat artikel][ref7] toen luidde, werd
      toegepast, mits de belastingplichtige voor 1 april 2007 om die overeenkomstige toepassing heeft verzocht.


