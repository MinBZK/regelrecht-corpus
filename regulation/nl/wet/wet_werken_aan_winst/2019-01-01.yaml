  - number: XII
    text: |-
      Ingeval ten aanzien van een belastingplichtige voor de inwerkingtreding van deze wet een beschikking
      is vastgesteld krachtens [artikel 14, tweede lid][ref1], [artikel 14a, derde lid][ref2], of
      [artikel 14b, derde lid, van de Wet op de vennootschapsbelasting 1969][ref3], zoals die artikelen luidden op 31
      december 2006, worden de in die beschikking gestelde voorwaarden voor zover die betrekking hebben op de wettelijke
      termijnen voor verliesverrekening geacht te zijn vervangen door de wettelijke termijnen voor verliesverrekening
      zoals die gelden na inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel14a
