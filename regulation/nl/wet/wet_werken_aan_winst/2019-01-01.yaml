preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in het kader van het ondernemingsklimaat in Nederland wenselijk is
    fiscale wetgeving aan te passen om de doelstellingen uit de nota «Werken aan winst; naar een laag tarief en een
    brede grondslag» (Kamerstukken II 2004–2005, 30 107, nr. 2), te realiseren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020645/2019-01-01#ArtikelAanhef
articles:
  - number: VIII
    text: |-
      1 De wijzigingen ingevolge deze wet in de termijn van de voorwaartse verliesverrekening in de
      [Wet inkomstenbelasting 2001][ref1] vinden toepassing met betrekking tot verliezen die worden verrekend met
      inkomens genoten na 31 december 2006.

      2 In afwijking van het eerste lid kunnen ondernemingsverliezen geleden in het kalenderjaar 2002 of eerder nog
      voorwaarts worden verrekend tot en met het kalenderjaar 2011.

      3 In afwijking van het eerste lid kunnen verliezen uit aanmerkelijk belang geleden in het kalenderjaar 2002 of
      eerder nog voorwaarts worden verrekend tot en met het kalenderjaar 2011.

      4 In afwijking van het eerste lid kan een belastingkorting voor verlies uit aanmerkelijk belang geleden in het
      kalenderjaar 2002 of eerder nog tot en met het kalenderjaar 2011 in mindering worden gebracht op de belasting op
      het belastbare inkomen uit werk en woning.

      5 De wijzigingen ingevolge deze wet in de termijn van de voorwaartse verliesverrekening in de
      [Wet op de vennootschapsbelasting 1969][ref2] vinden toepassing met betrekking tot verliezen die worden verrekend
      met belastbare winsten, onderscheidenlijk Nederlandse inkomens genoten in boekjaren die aanvangen na 31 december
      2006.

      6 In afwijking van het vijfde lid kunnen verliezen geleden in het jaar 2002 of eerder nog voorwaarts worden
      verrekend tot en met boekjaren die aanvangen in het kalenderjaar 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002672
