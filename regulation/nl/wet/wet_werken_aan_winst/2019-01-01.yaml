  - number: VIIIb
    text: |-
      De wijziging ingevolge [artikel II, onderdeel J][ref1], van
      [artikel 10d, zevende lid, van de Wet op de vennootschapsbelasting 1969][ref2] vindt geen toepassing op schulden
      voortvloeiend uit een overeenkomst welke vergelijkbaar is met een overeenkomst van geldlening, die is aangegaan
      vóór 1 januari 2007.


