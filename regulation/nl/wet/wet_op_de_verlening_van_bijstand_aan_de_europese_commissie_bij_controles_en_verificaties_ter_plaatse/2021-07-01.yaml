preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regels te stellen ter uitvoering van Verordening
    (Euratom, EG) nr. 2185/96 van de Raad van 11 november 1996 betreffende de controles en verificaties ter plaatse die
    door de Commissie worden uitgevoerd ter bescherming van de financiële belangen van de Europese Gemeenschappen tegen
    fraudes en andere onregelmatigheden (PbEG 1996, L 292);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032091/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet wordt verstaan onder:

        - *Verordening 2185/96:* Verordening (Euratom, EG) nr. 2185/96 van de Raad van 11 november 1996 betreffende de
      controles en verificaties ter plaatse die door de Commissie worden uitgevoerd ter bescherming van de financiële
      belangen van de Europese Gemeenschappen tegen fraudes en andere onregelmatigheden (PbEG 1996, L 292);
        - *controle en verificatie ter plaatse:* controle en verificatie ter plaatse als bedoeld in [Verordening 2185/96]
      (31996R2185);
        - *de Commissie:* de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0032091/2021-07-01#Artikel1
  - number: '2'
    text: |-
      1 Onze Minister van Financiën wordt aangewezen als de bevoegde autoriteit in de zin van artikel 4 van [Verordening
      2185/96](31996R2185) aan wie de Commissie haar voornemen ter kennis brengt om op grond van deze Verordening een
      controle en verificatie ter plaatse te verrichten.

      2 Onze Minister die het aangaat verleent aan de Commissie de bijstand, bedoeld in [Verordening 2185/96]
      (31996R2185).

      3 Indien de bijstand, bedoeld in het tweede lid, betrekking heeft op een beleidsterrein waarvan niet duidelijk is
      welke van Onze Ministers het aangaat, verleent Onze Minister van Financiën de bijstand.

      4 Onze Minister die het mede aangaat verleent de medewerking die nodig is bij de verlening van de bijstand, bedoeld
      in het tweede lid.

      5 Onze Minister die het aangaat of mede aangaat wijst functionarissen aan ter uitvoering van de verlening van de
      bijstand, bedoeld in het tweede lid.

      6 Onze Minister die het aangaat verleent de instemming, bedoeld in artikel 6, tweede lid, eerste alinea, van
      [Verordening 2185/96](31996R2185).

      7 Onze Minister die het aangaat verleent de toestemming, bedoeld in artikel 8, eerste lid, tweede alinea, van
      [Verordening 2185/96](31996R2185), en vraagt in voorkomend geval die toestemming aan de desbetreffende lidstaat.
    url: https://wetten.overheid.nl/BWBR0032091/2021-07-01#Artikel2
  - number: '3'
    text: |-
      1 Op de in [artikel 2, vijfde lid][ref1], bedoelde functionarissen zijn de
      [artikelen 5:15 tot en met 5:19 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.

      2 De [artikelen 2:5][ref3] en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref4] zijn van
      overeenkomstige toepassing.

      3 Een functionaris als bedoeld in [artikel 2, vijfde lid][ref5], toont desgevraagd een geldig identiteitsbewijs en
      een document waarin zijn hoedanigheid wordt vermeld.

      4 Onze Minister die het aangaat is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref6] ten aanzien van de in het eerste lid bedoelde
      functionarissen.


