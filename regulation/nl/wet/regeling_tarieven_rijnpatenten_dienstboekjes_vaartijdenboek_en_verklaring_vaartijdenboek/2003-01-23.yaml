preamble:
  text: >-
    Gelet op artikel 14a van de Scheepvaart-verkeerswet en artikel 9 van de Wet vaartijden en bemanningssterkte
    binnenvaart;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0009085/2003-01-23#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      1 Voor de afgifte van een Rijnpatent is een vergoeding verschuldigd van € 46,30.


      2 Voor de uitbreiding, het verlengen, het vervangen of het omruilen van een Rijnpatent is een vergoeding
      verschuldigd van € 26,60.
    url: https://wetten.overheid.nl/BWBR0009085/2003-01-23#Artikel1
  - number: '2'
    text: |-
      1 Voor de afgifte van een dienstboekje, bedoeld in
      [artikel 23.04, eerste lid, van het Reglement onderzoek schepen op de Rijn 1995][ref1] en
      [artikel 2.06, eerste lid, van het Reglement Rijnpatenten 1998][ref2], is een vergoeding verschuldigd van € 11.

      2 Voor het jaarlijks afstempelen van een dienstboekje is een vergoeding verschuldigd van € 4.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel23.04
      [ref2]: https://wetten.overheid.nl/BWBR0008934#Artikel2.06
    url: https://wetten.overheid.nl/BWBR0009085/2003-01-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '23.04'
      - id: ref2
        bwb_id: BWBR0008934
        artikel: '2.06'
  - number: '3'
    text: |-
      1 Voor de afgifte van een vaartijdenboek, bedoeld in artikel 25, onder a, van de Wet vaartijden en bemanningssterkte
      binnenvaart en [artikel 23.08, eerste lid, van het Reglement onderzoek schepen op de Rijn 1995][ref1], is een
      vergoeding verschuldigd van € 13.

      2 Voor de afgifte van een verklaring bij het vaartijdenboek, bedoeld in artikel
      26, derde lid, van de Wet vaartijden en bemanningssterkte binnenvaart en
      [artikel 23.08, vierde lid, van het Reglement onderzoek schepen op de Rijn 1995][ref2], is een vergoeding
      verschuldigd van € 4.

      3 Voor het verrichten van mutaties in het vaartijdenboek is een vergoeding verschuldigd van € 4.

      4 Voor het verrichten van mutaties in een verklaring bij het vaartijdenboek is een vergoeding verschuldigd van € 4.


      [ref1]: https://wetten.overheid.nl/BWBR0007858#Artikel23.08
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel23.08
    url: https://wetten.overheid.nl/BWBR0009085/2003-01-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007858
        artikel: '23.08'
      - id: ref2
        bwb_id: BWBR0007858
        artikel: '23.08'
  - number: '4'
    text: De Regeling dienstboekje, vaartijdenboek en verklaring vaartijdenboek wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009085/2003-01-23#Artikel4
  - number: '5'
    text: Deze regeling treedt in werking met ingang van 1 januari 1998.
    url: https://wetten.overheid.nl/BWBR0009085/2003-01-23#Artikel5
  - number: '6'
    text: >-
      Deze regeling wordt aangehaald als: Regeling tarieven Rijnpatenten, dienstboekjes, vaartijdenboek en verklaring
      vaartijdenboek.
    url: https://wetten.overheid.nl/BWBR0009085/2003-01-23#Artikel6
