  - number: 2.151.1
    text: |-
      Een aanbestedende dienst die gebruik wil maken van een concessieovereenkomst voor openbare werken, maakt zijn
      voornemen hiertoe bekend in een aankondiging voor een overheidsopdracht.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.151
  - number: 2.151.2
    text: |-
      De bekendmaking van de aankondiging, bedoeld in het eerste lid, geschiedt langs elektronische weg, met
      gebruikmaking van het elektronische systeem voor aanbestedingen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.151
  - number: 2.151.3
    text: |-
      De aanbestedende dienst gebruikt voor de aankondiging, bedoeld in het eerste lid, het daartoe door middel van het
      elektronische systeem voor aanbestedingen beschikbaar gestelde formulier.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.151
  - number: 2.152.1
    text: |-
      Een aanbestedende dienst die gebruik wil maken van een concessieovereenkomst voor openbare werken, stelt voor
      het indienen van de inschrijvingen op de concessie een termijn vast van ten minste 45 dagen, te rekenen vanaf de
      verzenddatum van de aankondiging.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.152
  - number: 2.152.2
    text: |-
      [Artikel 2.73][ref1] is van overeenkomstige toepassing op de termijn voor het indienen van de inschrijvingen,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.152
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.3
        afdeling: 2.3.2
  - number: 2.153.1
    text: 'Een aanbestedende dienst:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.153
  - number: 2.153.1.a
    text: |-
      verplicht de houder van een concessie voor openbare werken opdrachten van ten minste 30 procent van de totale
      waarde van de werken waarvoor de concessie is verleend, aan derden uit te besteden, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.153
  - number: 2.153.1.b
    text: |-
      verzoekt de inschrijvers voor de concessie zelf in hun inschrijving aan te geven welk percentage van de totale
      waarde van de werken waarvoor de concessie wordt verleend, zij aan derden denken uit te besteden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.153
  - number: 2.153.2
    text: |-
      Bij de toepassing van het eerste lid, onderdeel a, neemt de aanbestedende dienst het desbetreffende percentage in
      de concessieovereenkomst voor openbare werken op.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.153
  - number: 2.153.3
    text: |-
      Een aanbestedende dienst waarborgt dat de houder van een door hem verleende concessie voor openbare werken die zelf
      geen aanbestedende dienst is, de [artikelen 2.154 tot en met 2.156][ref1] in acht neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.153
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.4
  - number: 2.154.1
    text: |-
      Een houder van een concessie voor openbare werken die zelf geen aanbestedende dienst is, past bij de plaatsing
      van een opdracht voor werken bij derden [artikel 2.154][ref1] toe indien de waarde van deze opdracht, exclusief
      omzetbelasting, gelijk is aan of hoger is dan het bedrag, genoemd in artikel 63, eerste lid, van [richtlijn nr.
      2004/18/EG](32004L0018).


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.154
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.4
  - number: 2.154.2
    text: |-
      Het eerste lid is niet van toepassing indien de opdracht voor werken voldoet aan de voorwaarden, genoemd in
      [artikelen 2.32 tot en met 2.36][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.154
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.2'
        paragraaf: 2.2.2.3
        afdeling: 2.2.2
  - number: 2.154.3
    text: |-
      De houder van een concessie, bedoeld in het eerste lid, berekent de waarde van een opdracht volgens de
      [artikelen 2.13 tot en met 2.22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.154
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.2.1
        afdeling: 2.1.2
  - number: 2.154.4
    text: |-
      Een samenwerkingsverband van ondernemingen dat gevormd is om de concessie te verwerven, of met dit
      samenwerkingsverband verbonden ondernemingen, worden niet als derden als bedoeld in het eerste lid beschouwd.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.154
  - number: 2.154.5
    text: 'Onder verbonden onderneming in de zin van dit artikel wordt verstaan een onderneming:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.154
  - number: 2.154.5.a
    text: waarop de concessiehouder direct of indirect een overheersende invloed kan uitoefenen,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.154
  - number: 2.154.5.b
    text: die een overheersende invloed kan uitoefenen op de concessiehouder, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.154
  - number: 2.154.5.c
    text: |-
      die, tezamen met de concessiehouder, onderworpen is aan de overheersende invloed van een andere onderneming uit
      hoofde van eigendom, financiële deelneming of op haar van toepassing zijnde voorschriften.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.154
  - number: 2.154.6
    text: |-
      Overheersende invloed als bedoeld in het vijfde lid wordt vermoed indien een onderneming, direct of indirect, ten
      opzichte van een andere onderneming:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.154
  - number: 2.154.6.a
    text: de meerderheid van het geplaatste kapitaal van de onderneming bezit,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.154
  - number: 2.154.6.b
    text: over de meerderheid van de stemmen beschikt die aan de door de onderneming uitgegeven aandelen zijn verbonden of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.154
  - number: 2.154.6.c
    text: |-
      meer dan de helft van de leden van het bestuurs-, leidinggevend of toezichthoudend orgaan van de onderneming kan
      benoemen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.154
  - number: 2.154.7
    text: |-
      Een onderneming die zich inschrijft voor een concessie, voegt bij de inschrijving een volledige lijst van verbonden
      ondernemingen en deelt de aanbestedende dienst de wijzigingen in deze lijst van verbonden ondernemingen steeds
      onverwijld mee.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.154
  - number: 2.154.8
    text: |-
      Een wijziging van het bedrag, genoemd in artikel 63 van [richtlijn nr. 2004/18/EG](32004L0018), gaat voor de
      toepassing van het eerste lid gelden met ingang van de dag waarop het desbetreffende besluit van de Europese
      Commissie in werking treedt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.154
  - number: 2.154.9
    text: Onze Minister doet mededeling in de Staatscourant van een besluit als bedoeld in het achtste lid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.154
  - number: 2.155.1
    text: |-
      Een houder van een concessie voor openbare werken die zelf geen aanbestedende dienst is en die een opdracht voor
      werken aan een derde wenst te gunnen, maakt zijn voornemen hiertoe bekend in een aankondiging van de opdracht.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.155
  - number: 2.155.2
    text: |-
      De bekendmaking van de aankondiging, bedoeld in het eerste lid, geschiedt langs elektronische weg, met
      gebruikmaking van het elektronische systeem voor aanbestedingen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.155
  - number: 2.155.3
    text: |-
      De houder van een concessie voor openbare werken gebruikt voor de aankondiging, bedoeld in het eerste lid, het
      daartoe door middel van het elektronische systeem voor aanbestedingen beschikbaar gestelde formulier.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.155
  - number: 2.156.1
    text: |-
      Bij opdrachten voor werken die worden geplaatst door een houder van een concessie voor openbare werken die zelf
      geen aanbestedende dienst is, bedraagt de door de concessiehouder vast te stellen termijn voor het indienen van de
      aanvragen tot deelneming ten minste 37 dagen, te rekenen vanaf de verzenddatum van de aankondiging van de opdracht,
      en de termijn voor het indienen van de inschrijvingen ten minste 40 dagen, te rekenen vanaf de verzenddatum van de
      aankondiging van de opdracht of van de uitnodiging tot inschrijving.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.156
  - number: 2.156.2
    text: |-
      De [artikelen 2.72][ref1] en [2.73][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.156
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.3
        afdeling: 2.3.2
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.3
        afdeling: 2.3.2
  - number: '2.157'
    text: |-
      Een aanbestedende dienst stelt de voorschriften met betrekking tot een prijsvraag vast overeenkomstig deze afdeling
      en stelt deze voorschriften ter beschikking aan belangstellende ondernemers.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.157
  - number: 2.158.1
    text: |-
      De aanbestedende dienst die een prijsvraag wil uitschrijven, maakt zijn voornemen hiertoe bekend in een
      aankondiging van een prijsvraag met gebruikmaking van het elektronische systeem voor aanbestedingen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.158
  - number: 2.158.2
    text: |-
      De aanbestedende dienst maakt voor de aankondiging, bedoeld in het eerste lid, gebruik van de formulieren die
      beschikbaar zijn gesteld op het elektronische systeem voor aanbestedingen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.158
  - number: 2.159.1
    text: |-
      Bij een prijsvraag met een beperkt aantal deelnemers stelt de aanbestedende dienst duidelijke en niet-
      discriminerende selectiecriteria vast.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.159
  - number: 2.159.2
    text: |-
      De aanbestedende dienst waarborgt dat in alle gevallen met het aantal kandidaten dat wordt uitgenodigd om aan de
      prijsvraag deel te nemen een daadwerkelijke mededinging wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.159
  - number: 2.159.3
    text: De aanbestedende dienst eerbiedigt de anonimiteit van gegadigden totdat het oordeel van de jury bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.159
  - number: 2.160.1
    text: |-
      Een aanbestedende dienst waarborgt dat de jury bestaat uit natuurlijke personen die onafhankelijk zijn van de
      deelnemers aan de prijsvraag.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.160
  - number: 2.160.2
    text: |-
      Een aanbestedende dienst die van de deelnemers aan een prijsvraag een bijzondere beroepskwalificatie eist,
      waarborgt dat ten minste een derde van de juryleden dezelfde kwalificatie of een gelijkwaardige kwalificatie heeft.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.160
  - number: 2.161.1
    text: De jury is onafhankelijk.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.161
  - number: 2.161.2
    text: |-
      De jury onderzoekt de projecten op basis van door de gegadigden anoniem voorgelegde ontwerpen en op grond van de
      criteria die in de aankondiging van de prijsvraag zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.161
  - number: 2.161.3
    text: |-
      De jury stelt een door haar leden ondertekend verslag op met de door haar op basis van de merites van elk project
      vastgestelde rangorde van de projecten, vergezeld van haar opmerkingen en eventuele punten die verduidelijking
      behoeven.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.161
  - number: 2.161.4
    text: De jury eerbiedigt de anonimiteit van gegadigden totdat het oordeel van de jury bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.161
  - number: 2.161.5
    text: |-
      De jury kan gegadigden zo nodig uitnodigen om door de jury in haar notulen vermelde vragen te beantwoorden teneinde
      duidelijkheid te verschaffen omtrent bepaalde aspecten van de projecten.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.161
  - number: 2.161.6
    text: |-
      Een aanbestedende dienst waarborgt dat van de dialoog tussen de leden van de jury en de gegadigden volledige
      notulen worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.161
  - number: '2.162'
    text: |-
      De jury neemt na afloop van de voor het indienen van plannen en ontwerpen gestelde termijn kennis van de inhoud
      daarvan.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.162
  - number: 2.163.1
    text: |-
      De aanbestedende dienst die een prijsvraag heeft uitgeschreven maakt een aankondiging betreffende de resultaten van
      de prijsvraag bekend met behulp van het elektronische systeem voor aanbestedingen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.163
  - number: 2.163.2
    text: |-
      Indien openbaarmaking van de gegevens over de uitslag van de prijsvraag de toepassing van de wet in de weg
      zou staan, met het openbaar belang in strijd zou zijn, de rechtmatige commerciële belangen van een onderneming
      zou kunnen schaden of afbreuk aan de eerlijke mededinging tussen dienstverleners zou kunnen doen, behoeft de
      aanbestedende dienst deze gegevens niet mee te delen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.163
  - number: 2.163.3
    text: |-
      [Artikel 2.64][ref1] is van toepassing op de aankondiging, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.163
