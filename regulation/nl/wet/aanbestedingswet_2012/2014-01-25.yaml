  - number: 4.32.a
    text: |-
      die rechtspersoon in het kader van die overtredingenvoor 1 mei 2004 vrijwillig zijn boekhouding bij de Nederlandse
      Mededingingsautoriteit heeft ingeleverd,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.32
  - number: 4.32.b
    text: |-
      die rechtspersoon in het kader van die overtredingen heeft meegewerkt aan een versnelde procedure bij de
      Nederlandse Mededingingsautoriteit of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.32
  - number: 4.32.c
    text: die rechtspersoon in het kader van die overtredingen heeft deelgenomen aan de Collectieve Regeling Bouwnijverheid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.32
  - number: '4.33'
    text: |-
      Indien de [artikelen 4.13][ref1] en [4.14][ref2] van deze wet op een later tijdstip in werking treden dan de
      [delen 2][ref3] en [3][ref4] van deze wet, wordt aan de in die delen opgenomen verplichtingen met betrekking tot
      het gebruik van het elektronische systeem voor aanbestedingen tot het eerstbedoelde tijdstip voldaan door gebruik
      van het door de Europese Commissie ter uitvoering van de [richtlijnen nrs. 2004/17/EG](32004L0017) en [2004/18/EG]
      (32004L0018) beschikbaar gestelde elektronische systeem.


