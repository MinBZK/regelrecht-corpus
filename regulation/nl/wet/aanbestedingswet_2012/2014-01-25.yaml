  - number: '1.8'
    text: |-
      Een aanbestedende dienst of een speciale-sectorbedrijf behandelt ondernemers op gelijke en niet-discriminerende
      wijze.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.8
  - number: 1.9.1
    text: Een aanbestedende dienst of een speciale-sectorbedrijf handelt transparant.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.9
  - number: 1.9.2
    text: |-
      Bij de toepassing van het eerste lid draagt de aanbestedende dienst of het speciale-sectorbedrijf in ieder geval
      zorg voor een passende mate van openbaarheid van de aankondiging van het voornemen tot het plaatsen van een
      overheidsopdracht of een speciale-sectoropdracht, tot het sluiten van een concessieovereenkomst voor openbare
      werken of het uitschrijven van een prijsvraag.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.9
  - number: 1.9.3
    text: 'Het tweede lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.9
  - number: 1.9.3.a
    text: |-
      ingeval van toepasselijkheid van [artikel 1.7][ref1], onderdeel a: indien het bepaalde bij of krachtens
      [deel 2][ref2] of [deel 3][ref3] van deze wet niet verplicht tot het bekendmaken van een aankondiging van het
      voornemen tot het plaatsen van een opdracht;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032203
      [ref3]: https://wetten.overheid.nl/BWBR0032203
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.9
    references:
