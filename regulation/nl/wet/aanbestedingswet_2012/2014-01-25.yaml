  - number: 1.18.1
    text: |-
      Aanbestedende diensten en speciale-sectorbedrijven die een aankondiging doen, maken die aankondiging bekend op het
      elektronische systeem voor aanbestedingen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.18
  - number: 1.18.2
    text: |-
      De in het eerste lid bedoelde bekendmaking geschiedt door middel van een op het elektronische systeem voor
      aanbestedingen beschikbaar gesteld formulier.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.18
  - number: 1.19.1
    text: |-
      Aanbestedende diensten en speciale-sectorbedrijven die uitsluitingsgronden en geschiktheidseisen stellen, verlangen
      van een ondernemer dat hij bij zijn verzoek tot deelneming of zijn inschrijving met gebruikmaking van het daartoe
      vastgestelde model een eigen verklaring indient en geven daarbij aan welke gegevens en inlichtingen in de eigen
      verklaring moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.19
  - number: 1.19.2
    text: |-
      De [artikelen 2.55][ref1], [2.84][ref2], [2.85][ref3] en [2 102][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.19
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.1.2
        afdeling: 2.3.1
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        afdeling: 2.3.4
      - id: ref3
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        afdeling: 2.3.4
      - id: ref4
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.6.4
        afdeling: 2.3.6
  - number: 1.20.1
    text: |-
      Een ondernemer kan jegens een aanbestedende dienst of een speciale-sectorbedrijf, die uitsluitingsgronden stelt die
      betrekking hebben op onherroepelijke veroordelingen, door middel van een gedragsverklaring aanbesteden aantonen dat
      die gronden op hem niet van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.20
  - number: 1.20.2
    text: |-
      De in het eerste lid bedoelde gedragsverklaring aanbesteden is op het tijdstip van indienen van het verzoek tot
      deelneming of de inschrijving niet ouder dan twee jaar.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.20
  - number: 1.20.3
    text: |-
      In een geval als bedoeld in het eerste lid kan niet om overlegging van een verklaring omtrent het gedrag als
      bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.20
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 1.20.4
    text: |-
      De aanbestedende dienst of het speciale-sectorbedrijf betrekt bij de toepassing van het eerste lid uitsluitend
      veroordelingen die in de vier jaar voorafgaand aan het tijdstip van het indienen van het verzoek tot deelneming of
      de inschrijving onherroepelijk zijn geworden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.20
  - number: 1.21.1
    text: |-
      Aanbestedende diensten en speciale-sectorbedrijven stellen op enigerlei wijze de aanbestedingsstukken voor de
      overheidsopdracht of speciale-sectoropdracht kosteloos ter beschikking.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.21
  - number: 1.21.2
    text: |-
      Indien de aanbestedende dienst of het speciale-sectorbedrijf de aanbestedingsstukken voor de opdracht ook op
      andere wijze dan ter uitvoering van het eerste lid beschikbaar stelt, kan de aanbestedende dienst of het speciale-
      sectorbedrijf de kosten voor die wijze van verstrekking in rekening brengen bij degenen die om die andere wijze van
      verstrekking van de aanbestedingsstukken hebben gevraagd.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.21
  - number: 1.22.1
    text: |-
      Bij algemene maatregel van bestuur wordt een richtsnoer aangewezen waarin voorschriften zijn vervat met betrekking
      tot de wijzen waarop door in die maatregel aangewezen aanbestedende diensten overheidsopdrachten voor werken
      beneden de in [afdeling 2.1.1][ref1] van deze wet bedoelde waarden kunnen worden geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.1
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.22
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.1'
        afdeling: 2.1.1
  - number: 1.22.2
    text: |-
      De aanbestedende dienst past de in het eerste lid bedoelde voorschriften toe, of motiveert een afwijking van een of
      meer van die voorschriften in de aanbestedingsstukken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.22
  - number: 1.22.3
    text: De in het tweede lid bedoelde motivering wordt op diens schriftelijk verzoek aan een ondernemer verstrekt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.22
  - number: '1.23'
    text: |-
      Een aanbestedende dienst of speciale-sectorbedrijf past bij het gunnen van overheidsopdrachten of speciale-
      sectoropdrachten op ondernemers uit de andere lidstaten van de Europese Unie even gunstige voorwaarden toe als die
      welke hij bij de tenuitvoerlegging in het kader van de Overeenkomst inzake overheidsopdrachten op ondernemers van
      derde landen toepast.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.23
  - number: '2.1'
    text: |-
      Het bepaalde bij of krachtens deel 2 van deze wet is van toepassing op overheidsopdrachten voor werken waarvan
      de geraamde waarde gelijk is aan of hoger is dan het in artikel 7, onderdeel c, van [richtlijn nr. 2004/18/EG]
      (32004L0018) genoemde bedrag, exclusief omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.1
  - number: 2.2.1
    text: |-
      Het bepaalde bij of krachtens deel 2 van deze wet is van toepassing op door de staat te plaatsen
      overheidsopdrachten voor leveringen en diensten waarvan de geraamde waarde gelijk is aan of hoger is dan het in
      artikel 7, onderdeel a, van [richtlijn nr. 2004/18/EG](32004L0018) genoemde bedrag, exclusief omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.2
  - number: 2.2.2
    text: |-
      In afwijking van het eerste lid is, indien de overheidsopdracht op het gebied van defensie ligt en de levering van
      een product betreft dat niet is opgenomen in bijlage V van [richtlijn nr. 2004/18/EG](32004L0018), het bepaalde
      bij of krachtens deel 2 van deze wet van toepassing indien de geraamde waarde van die overheidsopdracht gelijk
      is aan of hoger is dan het in artikel 7, onderdeel b, van [richtlijn nr. 2004/18/EG](32004L0018) genoemde bedrag,
      exclusief omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.2
  - number: 2.2.3
    text: |-
      In afwijking van het eerste lid is, indien de overheidsopdracht een dienst als bedoeld in artikel 7, onderdeel b,
      derde alinea, van [richtlijn nr. 2004/18/EG](32004L0018) betreft, het bepaalde bij of krachtens deel 2 van deze wet
      van toepassing indien de geraamde waarde van die overheidsopdracht gelijk is aan of hoger is dan het in artikel 7,
      onderdeel b, van [richtlijn nr. 2004/18/EG](32004L0018) genoemde bedrag, exclusief omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.2
  - number: '2.3'
    text: |-
      Het bepaalde bij of krachtens deel 2 van deze wet is van toepassing op het plaatsen van overheidsopdrachten voor
      leveringen en diensten door aanbestedende diensten, anders dan de staat, waarvan de geraamde waarde gelijk is
      aan of hoger is dan het in artikel 7, onderdeel b, van [richtlijn nr. 2004/18/EG](32004L0018) genoemde bedrag,
      exclusief omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.3
  - number: '2.4'
    text: |-
      Het bepaalde bij of krachtens deel 2 van deze wet is van toepassing op concessieovereenkomsten voor openbare
      werken waarvan de geraamde waarde overeenkomt met of hoger is dan het in artikel 56 van [richtlijn nr. 2004/18/EG]
      (32004L0018) genoemde bedrag, exclusief omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.4
  - number: 2.5.1
    text: |-
      Het bepaalde bij of krachtens deel 2 van deze wet is van toepassing op door de staat uit te schrijven prijsvragen
      waarvan de geraamde waarde gelijk is aan of hoger is dan het in artikel 67, onderdeel a, van [richtlijn nr.
      2004/18/EG](32004L0018) genoemde bedrag, exclusief omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.5
  - number: 2.5.2
    text: |-
      In afwijking van het eerste lid is, indien de prijsvraag diensten als bedoeld in artikel 67, onderdeel c, van
      [richtlijn nr. 2004/18/EG](32004L0018) betreft, het bij of krachtens deel 2 van deze wet bepaalde van toepassing
      indien de geraamde waarde gelijk is aan of hoger is dan het in artikel 67, onderdeel c, van die richtlijn genoemde
      bedrag, exclusief omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.5
  - number: '2.6'
    text: |-
      Het bepaalde bij of krachtens deel 2 van deze wet is van toepassing op door aanbestedende diensten, anders dan de
      staat, uit te schrijven prijsvragen waarvan de geraamde waarde gelijk is aan of hoger is dan het in artikel 67,
      onderdeel b, van [richtlijn nr. 2004/18/EG](32004L0018) genoemde bedrag, exclusief omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.6
  - number: 2.7.1
    text: |-
      Een wijziging van de bedragen, genoemd in de artikelen 7, 56 en 67 van [richtlijn nr. 2004/18/EG](32004L0018) en
      een wijziging van bijlage V van die richtlijn gaan voor de toepassing van de [artikelen 2.1 tot en met 2.6][ref1]
      gelden met ingang van de dag waarop het desbetreffende besluit van de Europese Commissie in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.1.1
        afdeling: 2.1.1
  - number: 2.7.2
    text: Onze Minister doet mededeling in de Staatscourant van een besluit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.7
  - number: 2.8.1
    text: |-
      Het bepaalde bij of krachtens deze wet voor aanbestedende diensten is tevens van toepassing op subsidie-ontvangers
      die overeenkomsten sluiten voor:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.8
  - number: 2.8.1.a
    text: |-
      werken die voor meer dan 50 procent rechtstreeks door één of meer aanbestedende diensten worden gesubsidieerd en
      die bestaan uit:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.8
  - number: 2.8.1.a.1°
    text: |-
      civieltechnische werkzaamheden als bedoeld in bijlage 1 van [richtlijn nr. 2004/18/EG](32004L0018) waarvan de
      geraamde waarde overeenkomt met of hoger is dan het in artikel 8, onderdeel a, van [richtlijn nr. 2004/18/EG]
      (32004L0018) genoemde bedrag, exclusief omzetbelasting, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.8
  - number: 2.8.1.a.2°
    text: |-
      bouwwerken voor ziekenhuizen, inrichtingen voor sportbeoefening, recreatie en vrijetijdsbesteding, school- en
      universiteitsgebouwen en gebouwen met een administratieve bestemming waarvan de geraamde waarde overeenkomt met
      of hoger is dan het in artikel 8, onderdeel a, van [richtlijn 2004/18/EG](32004L0018) genoemde bedrag, exclusief
      omzetbelasting;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.8
  - number: 2.8.1.b
    text: |-
      diensten die voor meer dan 50 procent rechtstreeks door een of meer aanbestedende diensten worden gesubsidieerd,
      verband houden met een overeenkomst voor werken als bedoeld in onderdeel a en waarvan de geraamde waarde
      overeenkomt met of hoger is dan het in artikel 8, onderdeel b, van [richtlijn nr. 2004/18/EG](32004L0018) genoemde
      bedrag, exclusief omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.8
  - number: 2.8.2
    text: |-
      Een wijziging van de bedragen, genoemd in artikel 8 van [richtlijn nr. 2004/18/EG](32004L0018) gaat voor de
      toepassing van dit artikel gelden met ingang van de dag waarop het desbetreffende besluitvan de Europese Commissie
      in werking treedt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.8
  - number: 2.8.3
    text: Onze Minister doet mededeling in de Staatscourant van een besluit als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.8
  - number: '2.9'
    text: |-
      Een subsidie-ontvanger als bedoeld in het [artikel 2.8, eerste lid][ref1], verstrekt een overheidsopdracht als
      bedoeld in het eerste lid overeenkomstig het bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.1.1
        afdeling: 2.1.1
  - number: '2.10'
    text: |-
      Een aanbestedende dienst die een bijzonder recht of een uitsluitend recht om openbare diensten te verrichten
      verleent aan een natuurlijke persoon of een rechtspersoon die zelf geen aanbestedende dienst is, bepaalt bij de
      verlening van dat recht dat degene aan wie dat recht wordt verleend, bij opdrachten voor leveringen in het kader
      van het verrichten van die openbare diensten geen onderscheid maakt naar nationaliteit.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.10
  - number: 2.11.1
    text: |-
      Een aanbestedende dienst kan via een aankoopcentrale een overheidsopdracht plaatsen, mits de aankoopcentrale het
      bij of krachtens deel 2 van deze wet voor aanbestedende diensten bepaalde met betrekking tot die overheidsopdracht
      naleeft.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.11
  - number: 2.11.2
    text: |-
      In het in het eerste lid bedoelde geval heeft de desbetreffende aanbestedende dienst voldaan aan de voor hem
      geldende verplichtingen op grond van deel 2 van deze wet.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.11
  - number: 2.12.1
    text: |-
      Indien ten aanzien van een opdracht of een prijsvraag zowel het bepaalde bij of krachtens deel 2 van deze wet
      voor overheidsopdrachten onderscheidenlijk door aanbestedende diensten uitgeschreven prijsvragen van toepassing
      is als het bij of krachtens [deel 3][ref1] bepaalde voor speciale-sectoropdrachten onderscheidenlijk door
      speciale-sectorbedrijven uitgeschreven prijsvragen, is het bepaalde bij of krachtens deel 2 van deze wet voor
      overheidsopdrachten dan wel door aanbestedende diensten uitgeschreven prijsvragen niet van toepassing op de
      desbetreffende opdracht of prijsvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0032203
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0032203
  - number: 2.12.2
    text: |-
      Indien een aanbestedende dienst tevens kan worden aangemerkt als speciale-sectorbedrijf en met het oog op de
      uitoefening van de desbetreffende activiteiten een concessieovereenkomst voor openbare werken heeft gesloten, zijn
      de [artikelen 2.22][ref1], [2.40][ref2], [2.41][ref3] en [2.151 tot en met 2.156][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.2.3
        afdeling: 2.1.2
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.2'
        paragraaf: 2.2.3.1
        afdeling: 2.2.3
      - id: ref3
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.2'
        paragraaf: 2.2.3.1
        afdeling: 2.2.3
      - id: ref4
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.4
  - number: '2.13'
    text: |-
      De aanbestedende dienst raamt de waarde van de voorgenomen overheidsopdracht, concessieovereenkomst
      voor openbare werken of prijsvraag of het voorgenomen dynamisch aankoopsysteem overeenkomstig de
      [artikelen 2.14 tot en met 2.22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.2.1
        afdeling: 2.1.2
  - number: 2.14.1
    text: |-
      De aanbestedende dienst splitst de voorgenomen overheidsopdracht, concessieovereenkomst voor openbare werken of
      prijsvraag of het voorgenomen dynamisch aankoopsysteem niet met het oogmerk om zich te onttrekken aan de toepassing
      van deze wet.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.14
  - number: 2.14.2
    text: |-
      De aanbestedende dienst maakt de keuze van de methode van berekening van de geraamde waarde niet met het oogmerk om
      zich aan de toepassing van deze wet te onttrekken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.14
  - number: 2.15.1
    text: |-
      De waarde van een overheidsopdracht wordt geraamd naar de waarde op het tijdstip van verzending van de aankondiging
      van die overheidsopdracht of, indien een aankondiging niet is vereist, naar de waarde op het tijdstip waarop de
      procedure voor de gunning door de aanbestedende dienst wordt ingeleid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.15
  - number: 2.15.2
    text: |-
      De aanbestedende dienst baseert de berekening van de geraamde waarde van een overheidsopdracht op het totale
      bedrag, exclusief omzetbelasting, met inbegrip van opties en verlengingen van het contract.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.15
  - number: 2.15.3
    text: |-
      De aanbestedende dienst gaat bij de berekening van de waarde van een raamovereenkomst uit van de geraamde waarde
      van alle voor de duur van de raamovereenkomst voorgenomen overheidsopdrachten.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.15
  - number: '2.16'
    text: |-
      Bij de raming van de waarde van een overheidsopdracht voor werken houdt de aanbestedende dienst rekening met
      de waarde van de werkenen met de geraamde totale waarde van de voor de uitvoering van die werken noodzakelijke
      leveringen en diensten die door de aanbestedende dienst ter beschikking van de aannemer worden gesteld.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.16
  - number: '2.17'
    text: 'De aanbestedende dienst raamt de waarde van een overheidsopdracht voor diensten:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.17
  - number: 2.17.a
    text: 'indien het een verzekeringsdienst betreft: op de grondslag van de te betalen premie en andere vormen van beloning;'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.17
  - number: 2.17.b
    text: |-
      indien het een bankdienst of andere financiële dienst betreft: op de grondslag van honoraria, provisies en rente,
      en andere vormen van beloning;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.17
  - number: 2.17.c
    text: 'betreffende een ontwerp: op de grondslag van de te betalen honoraria, provisies en andere vormen van beloning;'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.17
  - number: 2.17.d
    text: |-
      waarin geen totale prijs is vermeld en die een vaste looptijd heeft die gelijk is aan of korter is dan 48 maanden:
      op de grondslag van de totale geraamde waarde voor de gehele looptijd;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.17
  - number: 2.17.e
    text: |-
      waarin geen totale prijs is vermeld en die voor onbepaalde duur is of een looptijd heeft die langer is dan 48
      maanden: het maandelijks te betalen bedrag vermenigvuldigd met 48.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.17
  - number: 2.18.1
    text: |-
      Indien een voorgenomen werk of een voorgenomen aankoop van diensten kan leiden tot overheidsopdrachten die
      gelijktijdig in afzonderlijke percelen worden geplaatst, neemt de aanbestedende dienst de geraamde totale waarde
      van deze percelen als grondslag.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.18
  - number: 2.18.2
    text: |-
      Indien de samengestelde waarde van de percelen, bedoeld in het eerste lid, gelijk is aan of groter is dan het in
      de [artikelen 2.1][ref1], [2.2][ref2] of [2.3][ref3] bedoelde bedrag, is het bij of krachtens deel 2 van deze wet
      bepaalde van toepassing op de plaatsing van elk perceel.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.1.1
        afdeling: 2.1.1
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.1.1
        afdeling: 2.1.1
      - id: ref3
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.1.1
        afdeling: 2.1.1
  - number: 2.18.3
    text: 'Het tweede lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.18
  - number: 2.18.3.a
    text: |-
      overheidsopdrachten voor werken waarvan de geraamde waarde niet meer bedraagt dan € 1 000 000, exclusief
      omzetbelasting,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.18
  - number: 2.18.3.b
    text: |-
      overheidsopdrachten voor diensten waarvan de geraamde waarde niet meer bedraagt dan € 80 000, exclusief
      omzetbelasting,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.18
  - number: 2.19.1
    text: |-
      Indien een voorgenomen verkrijging van homogene leveringen kan leiden tot overheidsopdrachten die gelijktijdig in
      afzonderlijke percelen worden geplaatst, neemt de aanbestedende dienst de geraamde totale waarde van deze percelen
      als grondslag voor de raming.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.19
  - number: 2.19.2
    text: |-
      Indien de samengestelde waarde van de percelen, bedoeld in het eerste lid, gelijk is aan of groter is dan het in
      de [artikelen 2.2][ref1] of [2.3][ref2] bedoelde bedrag, is het bij of krachtens deel 2 van deze wet bepaalde van
      toepassing op de plaatsing van elk perceel.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.1.1
        afdeling: 2.1.1
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.1.1
        afdeling: 2.1.1
  - number: 2.19.3
    text: |-
      Het tweede lid is niet van toepassing op percelen waarvan de geraamde waarde niet meer bedraagt dan € 80 000,
      exclusief omzetbelasting, mits de totale geraamde waarde van die percelen gezamenlijk niet meer bedraagt dan 20%
      van de totale waarde van alle percelen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.19
  - number: '2.20'
    text: |-
      De aanbestedende dienst raamt de waarde van overheidsopdrachten voor leveringen die betrekking hebben op leasing,
      huur of huurkoop van producten op de volgende grondslag:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.20
  - number: 2.20.a
    text: |-
      bij overheidsopdrachten voor leveringen met een vaste looptijd: de totale geraamde waarde voor de gehele looptijd
      indien die ten hoogste twaalf maanden bedraagt, dan wel de totale waarde indien de looptijd meer dan twaalf maanden
      bedraagt, met inbegrip van de geraamde restwaarde;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.20
  - number: 2.20.b
    text: |-
      bij overheidsopdrachten voor leveringen voor onbepaalde duur of waarvan de looptijd niet kan worden bepaald: het
      maandelijks te betalen bedrag vermenigvuldigd met 48.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.20
  - number: '2.21'
    text: |-
      De aanbestedende dienst raamt de waarde van overheidsopdrachten voor leveringen of voor diensten die met een zekere
      regelmaat worden verricht of die de aanbestedende dienst gedurende een bepaalde periode wil hernieuwen, op de
      volgende grondslag:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.21
  - number: 2.21.a
    text: |-
      de totale reële waarde van de tijdens het voorafgaande boekjaar of tijdens de voorafgaande twaalf maanden
      geplaatste soortgelijke opeenvolgende overheidsopdrachten voor leveringen of voor diensten, indien mogelijk
      gecorrigeerd voor verwachte wijzigingen in de hoeveelheid of de waarde gedurende de twaalf maanden die volgen op de
      eerste opdracht, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.21
  - number: 2.21.b
    text: |-
      de geraamde totale waarde van de soortgelijke opeenvolgende overheidsopdrachten voor leveringen of voor diensten
      over de twaalf maanden die volgen op de eerste levering of dienstverrichting of over het boekjaar van de eerste
      levering of dienstverrichting, indien dat boekjaar zich over meer dan twaalf maanden uitstrekt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.21
  - number: 2.22.1
    text: |-
      De [artikelen 2.15 tot en met 2.21][ref1] zijn van overeenkomstige toepassing op de raming van de waarde van een
      voorgenomen concessieovereenkomst voor openbare werken, een dynamisch aankoopsysteem of een uit te reiken prijs.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.2.2
        afdeling: 2.1.2
  - number: 2.22.2
    text: 'In aanvulling op het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.22
  - number: 2.22.2.a
    text: |-
      gaat de aanbestedende dienst bij de berekening van de waarde van een dynamisch aankoopsysteem uit van de geraamde
      waarde van alle voor de totale duur van het dynamisch aankoopsysteem voorgenomen overheidsopdrachten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.22
  - number: 2.22.2.b
    text: |-
      berekent de aanbestedende dienst die voorziet in prijzengeld of betalingen aan gegadigden of inschrijvers deze door
      in de geraamde waarde;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.22
  - number: 2.22.2.c
    text: |-
      wordt, indien de aanbestedende dienst in de voorschriften van de prijsvraag niet uitsluit dat gunning van de
      overheidsopdracht geschiedt volgens de onderhandelingsprocedure zonder aankondiging, bij de bepaling van het totale
      bedrag van het prijzengeld of de vergoeding aan de deelnemers de waarde meegerekend van de overheidsopdracht die
      later kan worden gegund.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.22
  - number: 2.23.1
    text: |-
      In afwijking van de [artikelen 2.1 tot en met 2.6][ref1] is het bepaalde bij of krachtens deel 2 van deze wet niet
      van toepassing op overheidsopdrachten, concessieovereenkomsten voor openbare werken en prijsvragen:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.1.1
        afdeling: 2.1.1
  - number: 2.23.1.a
    text: |-
      die door aanbestedende diensten op het gebied van defensie worden geplaatst en die vallen onder de reikwijdte van
      artikel 346 van het Verdrag betreffende de werking van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
  - number: 2.23.1.b
    text: |-
      waarop de [Aanbestedingswet op defensie- en veiligheidsgebied][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0032898
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0032898
  - number: 2.23.1.c
    text: |-
      waarop de [Aanbestedingswet op defensie- en veiligheidsgebied][ref1] niet van toepassing is ingevolge de
      [artikelen 2.3][ref2], [2.16][ref3] en [2.17 van die wet][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0032898
      [ref2]: https://wetten.overheid.nl/BWBR0032898#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032898#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032898#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0032898
      - id: ref2
        bwb_id: BWBR0032898
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0032898
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0032898
        artikel: '2'
  - number: 2.23.1.d
    text: |-
      voor civiele aankopen die worden geplaatst in een derde land, indien strijdkrachten zijn ingezet buiten het
      grondgebied van de Europese Unie en de operationele omstandigheden vereisen dat de overheidsopdracht wordt gegund
      aan ondernemers die in het operatiegebied gevestigd zijn;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
  - number: 2.23.1.e
    text: |-
      die geheim zijn verklaard of waarvan de uitvoering overeenkomstig de geldende wettelijke en bestuursrechtelijke
      bepalingen met bijzondere veiligheidsmaatregelen gepaard moet gaan dan wel indien de bescherming van de wezenlijke
      belangen van Nederland zulks vereist;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
  - number: 2.23.1.f
    text: |-
      die in hoofdzaak tot doel hebben de aanbestedende diensten in staat te stellen openbare telecommunicatienetten
      beschikbaar te stellen, te exploiteren of aan het publiek telecommunicatiediensten te verlenen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
  - number: 2.23.1.g
    text: |-
      waarvoor andere procedurevoorschriften gelden en die worden geplaatst op grond van een internationale overeenkomst,
      gesloten tussen het Koninkrijk der Nederlanden en een of meer derde landen, overeenkomstig het Verdrag betreffende
      de werking van de Europese Unie, betreffende:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
  - number: 2.23.1.g.1°
    text: |-
      leveringen of werken die bestemd zijn voor gemeenschappelijke verwezenlijking of exploitatie van een werk door de
      ondertekenende staten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
  - number: 2.23.1.g.2°
    text: |-
      diensten die bestemd zijn voor de gemeenschappelijke verwezenlijking of exploitatie van een project door de
      ondertekenende staten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
  - number: 2.23.1.h
    text: |-
      waarvoor andere procedurevoorschriften gelden en die worden geplaatst als gevolg van een in verband met de legering
      van strijdkrachten gesloten internationale overeenkomst betreffende ondernemingen in een lidstaat of in een derde
      land;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
  - number: 2.23.1.i
    text: |-
      waarvoor andere procedurevoorschriften gelden en die worden geplaatst volgens de specifieke procedure van een
      internationale organisatie.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
  - number: 2.23.2
    text: 'Voor de toepassing van het eerste lid, onder d, wordt onder civiele aankopen verstaan, opdrachten die:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
  - number: 2.23.2.a
    text: |-
      niet onder het toepassingsgebied van [artikel 2.1 van de Aanbestedingswet op defensie- en veiligheidsgebied][ref1]
      vallen,


      [ref1]: https://wetten.overheid.nl/BWBR0032898#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0032898
        artikel: '2'
  - number: 2.23.2.b
    text: betrekking hebben op niet-militaire producten, werken of diensten voor logistieke doeleinden en
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
  - number: 2.23.2.c
    text: |-
      worden aanbesteed overeenkomstig een procedure als bedoeld in de
      [hoofdstukken 2.3 tot en met 3.2 van de Aanbestedingswet op defensie- en veiligheidsgebied][ref1] zonder dat
      daartoe een verplichting bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0032898#Hoofdstuk2.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0032898
        hoofdstuk: '2.3'
  - number: 2.23.3
    text: |-
      Een aanbestedende dienst brengt een internationale overeenkomst als bedoeld in het eerste lid, onderdeel g, ter
      kennis van de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.23
  - number: '2.24'
    text: |-
      In afwijking van de [artikelen 2.1 tot en met 2.6][ref1] is het bepaalde bij of krachtens deel 2 van deze wet niet
      van toepassing op overheidsopdrachten voor diensten:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.1.1
        afdeling: 2.1.1
  - number: 2.24.a
    text: |-
      die door een aanbestedende dienst worden gegund aan een andere aanbestedende dienst of aan een samenwerkingsverband
      van aanbestedende diensten op basis van een uitsluitend recht dat aan die andere aanbestedende dienst of het
      desbetreffende samenwerkingsverband is verleend, mits dit uitsluitend recht verenigbaar is met het Verdrag
      betreffende de werking van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.24
  - number: 2.24.b
    text: |-
      betreffende de verwerving of huur, ongeacht de financiële modaliteiten ervan, van grond, bestaande gebouwen of
      andere onroerende zaken of betreffende de rechten hierop, met uitzondering van de overeenkomsten betreffende
      financiële diensten die voorafgaand aan, gelijktijdig met of als vervolg op het koop- of huurcontract worden
      gesloten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.24
  - number: 2.24.c
    text: |-
      betreffende de aankoop, de ontwikkeling, de productie of de coproductie van programmamateriaal bestemd voor
      uitzendingen door omroeporganisaties en overeenkomsten betreffende zendtijd;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.24
  - number: 2.24.d
    text: betreffende arbitrage en bemiddeling;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.24
  - number: 2.24.e
    text: |-
      op financieel gebied betreffende de uitgifte, de aankoop, de verkoop en de overdracht van effecten of andere
      financiële instrumenten en door de centrale banken verleende diensten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.24
  - number: 2.24.f
    text: inzake arbeidsovereenkomsten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.24
  - number: 2.24.g
    text: |-
      betreffende onderzoek en ontwikkeling, met uitzondering van die opdrachten waarvan de resultaten in hun geheel
      bestemd zijn voor de aanbestedende dienst voor gebruik ervan in de uitoefening van zijn eigen werkzaamheden, mits
      de dienstverlening volledig door de aanbestedende dienst wordt betaald.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.24
  - number: '2.25'
    text: |-
      De aanbestedende dienst past voor het plaatsen van een overheidsopdracht de openbare procedure of de niet-openbare
      procedure toe.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.25
  - number: '2.26'
    text: 'De aanbestedende dienst die de openbare procedure toepast doorloopt de volgende stappen. De aanbestedende dienst:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.26
  - number: 2.26.a
    text: maakt een aankondiging van de overheidsopdracht bekend;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.26
  - number: 2.26.b
    text: toetst of een inschrijver valt onder een door de aanbestedende dienst gestelde uitsluitingsgrond;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.26
  - number: 2.26.c
    text: toetst of een niet-uitgesloten inschrijver voldoet aan de door de aanbestedende dienst gestelde geschiktheidseisen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.26
  - number: 2.26.d
    text: |-
      toetst of de inschrijvingen voldoen aan de door de aanbestedende dienst gestelde technische specificaties, eisen
      en normen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.26
  - number: 2.26.e
    text: |-
      beoordeelt de geldige inschrijvingen aan de hand van het door de aanbestedende dienst gestelde gunningscriterium,
      bedoeld in [artikel 2.114][ref1] en de nadere criteria, bedoeld in [artikel 2.115][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
  - number: 2.26.f
    text: maakt een proces-verbaal van de opdrachtverlening;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.26
  - number: 2.26.g
    text: deelt de gunningsbeslissing mee;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.26
  - number: 2.26.h
    text: kan de overeenkomst sluiten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.26
  - number: 2.26.i
    text: maakt de aankondiging van de gegunde opdracht bekend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.26
  - number: '2.27'
    text: |-
      De aanbestedende dienst die de niet-openbare procedure toepast doorloopt de volgende stappen. De aanbestedende
      dienst:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.27
  - number: 2.27.a
    text: maakt een aankondiging van de overheidsopdracht bekend;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.27
  - number: 2.27.b
    text: toetst of een gegadigde valt onder een door de aanbestedende dienst gestelde uitsluitingsgrond;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.27
  - number: 2.27.c
    text: toetst of een niet-uitgesloten gegadigde voldoet aan de door de aanbestedende dienst gestelde geschiktheidseisen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.27
  - number: 2.27.d
    text: |-
      beoordeelt de niet-uitgesloten of niet-afgewezen gegadigden aan de hand van de door de aanbestedende dienst
      gestelde selectiecriteria;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.27
  - number: 2.27.e
    text: nodigt de geselecteerde gegadigden uit tot inschrijving;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.27
  - number: 2.27.f
    text: |-
      toetst of de inschrijvingen voldoen aan de door de aanbestedende dienst gestelde technische specificaties, eisen
      en normen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.27
  - number: 2.27.g
    text: |-
      beoordeelt de geldige inschrijvingen aan de hand van het door de aanbestedende dienst gestelde gunningscriterium,
      bedoeld in [artikel 2.114][ref1] en de nadere criteria, bedoeld in [artikel 2.115][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.27
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
  - number: 2.27.h
    text: maakt een proces-verbaal van de opdrachtverlening;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.27
  - number: 2.27.i
    text: deelt de gunningsbeslissing mee;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.27
  - number: 2.27.j
    text: kan de overeenkomst sluiten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.27
  - number: 2.27.k
    text: maakt de aankondiging van de gegunde opdracht bekend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.27
  - number: 2.28.1
    text: |-
      De aanbestedende dienst kan, indien het naar zijn oordeel niet mogelijk is door toepassing van de openbare
      procedure of de niet-openbare procedure een bijzonder complexe overheidsopdracht te plaatsen, de procedure van de
      concurrentiegerichte dialoog toepassen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.28
  - number: 2.28.2
    text: 'Een overheidsopdracht is bijzonder complex indien de aanbestedende dienst objectief gezien niet is staat is:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.28
  - number: 2.28.2.a
    text: de technische middelen te bepalen waarmee aan de behoeften of het doel kan worden tegemoet gekomen, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.28
  - number: 2.28.2.b
    text: de juridische of financiële voorwaarden van een project te specificeren.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.28
  - number: '2.29'
    text: |-
      De aanbestedende dienst die de procedure van de concurrentiegerichte dialoog toepast doorloopt de volgende stappen.
      De aanbestedende dienst:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.29
  - number: 2.29.a
    text: maakt een aankondiging van de overheidsopdracht bekend;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.29
  - number: 2.29.b
    text: toetst of een gegadigde valt onder een door de aanbestedende dienst gestelde uitsluitingsgrond;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.29
  - number: 2.29.c
    text: toetst of een niet-uitgesloten gegadigde voldoet aan de door de aanbestedende dienst gestelde geschiktheidseisen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.29
  - number: 2.29.d
    text: |-
      beoordeelt de niet-uitgesloten of niet-afgewezen gegadigden aan de hand van de door de aanbestedende dienst
      gestelde selectiecriteria;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.29
  - number: 2.29.e
    text: nodigt de geselecteerde gegadigden uit tot deelname aan de dialoog;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.29
  - number: 2.29.f
    text: |-
      houdt met de geselecteerde gegadigden een dialoog met het doel te bepalen welke middelen geschikt zijn om zo goed
      mogelijk aan de behoeften van de aanbestedende dienst te voldoen en maakt een keuze welke oplossing of oplossingen
      aan zijn behoeften kunnen voldoen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.29
  - number: 2.29.g
    text: verzoekt de deelnemers aan de dialoog hun inschrijving in te dienen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.29
  - number: 2.29.h
    text: |-
      toetst of de inschrijvingen voldoen aan de tijdens de dialoog voorgelegde en gespecificeerde oplossing of
      oplossingen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.29
  - number: 2.29.i
    text: |-
      beoordeelt de geldige inschrijvingen aan de hand van het gunningscriterium de economische meest voordelige
      inschrijving en de door de aanbestedende dienst gestelde nadere criteria, bedoeld in [artikel 2.115][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.29
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
  - number: 2.29.j
    text: maakt een proces-verbaal van de opdrachtverlening;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.29
  - number: 2.29.k
    text: deelt de gunningsbeslissing mee;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.29
  - number: 2.29.l
    text: kan de overeenkomst sluiten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.29
  - number: 2.29.m
    text: maakt de aankondiging van de gegunde opdracht bekend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.29
  - number: 2.30.1
    text: 'De aanbestedende dienst kan de onderhandelingsprocedure met aankondiging toepassen:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.30
  - number: 2.30.1.a
    text: |-
      indien bij toepassing van de niet-openbare procedure, de openbare procedure, of de procedure van de
      concurrentiegerichte dialoog inschrijvingen zijn gedaan die onregelmatig zijn, of indien inschrijvingen zijn
      gedaan die onaanvaardbaar zijn, mits de oorspronkelijke voorwaarden van de overheidsopdracht niet wezenlijk worden
      gewijzigd,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.30
  - number: 2.30.1.b
    text: |-
      in buitengewone gevallen, indien het werken, leveringen of diensten betreft waarvan de aard en de onzekere
      omstandigheden het vaststellen vooraf van de totale prijs niet mogelijk maken,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.30
  - number: 2.30.1.c
    text: |-
      ingeval het een overheidsopdracht voor diensten als bedoeld in Bijlage II, onderdeel A, categorie 6 van [richtlijn
      nr. 2004/18/EG](32004L0018) of intellectuele diensten betreft, waarvoor, vanwege de aard van de te verlenen
      diensten, de specificaties voor de overheidsopdracht niet voldoende nauwkeurig kunnen worden vastgesteld om de
      overheidsopdracht overeenkomstig de niet-openbare procedure of de openbare procedure door de keuze van de beste
      inschrijving te plaatsen, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.30
  - number: 2.30.1.d
    text: |-
      ingeval het een overheidsopdracht voor werken betreft, die werken worden uitgevoerd ten behoeve van onderzoek,
      proefneming of ontwikkeling, en zonder het doel winst te maken of de kosten van onderzoek en ontwikkeling te
      dekken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.30
  - number: 2.30.2
    text: |-
      Een aanbestedende dienst kan, indien de omstandigheden, bedoeld in het eerste lid, aanhef en onderdeel
      a, zich voordoen, van de mededeling van een aankondiging van een overheidsopdracht afzien, indien hij
      bij de onderhandelingsprocedure alleen de inschrijvers betrekt die voldoen aan de criteria, genoemd in
      [afdelingen 2.3.4 tot en met 2.3.6][ref1] en die gedurende de voorafgaande openbare procedure of niet-openbare
      procedure of concurrentiegerichte dialoog inschrijvingen hebben ingediend die aan de formele eisen van de procedure
      voor het gunnen van overheidsopdrachten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        afdeling: 2.3.4
  - number: 2.31.1
    text: |-
      De aanbestedende dienst die de onderhandelingsprocedure met aankondiging toepast doorloopt de volgende stappen. De
      aanbestedende dienst:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.31
  - number: 2.31.1.a
    text: maakt een aankondiging van de overheidsopdracht bekend;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.31
  - number: 2.31.1.b
    text: toetst of een gegadigde valt onder een door de aanbestedende dienst gestelde uitsluitingsgrond;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.31
  - number: 2.31.1.c
    text: toetst of een niet-uitgesloten gegadigde voldoet aan de door de aanbestedende dienst gestelde geschiktheidseisen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.31
  - number: 2.31.1.d
    text: |-
      beoordeelt de niet-uitgesloten of niet-afgewezen gegadigden aan de hand van de door de aanbestedende dienst
      gestelde selectiecriteria;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.31
  - number: 2.31.1.e
    text: nodigt de geselecteerde gegadigden uit tot inschrijving;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.31
  - number: 2.31.1.f
    text: |-
      toetst of de inschrijvingen voldoen aan de door de aanbestedende dienst gestelde technische specificaties, eisen
      en normen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.31
  - number: 2.31.1.g
    text: |-
      beoordeelt de geldige inschrijvingen aan de hand van het door de aanbestedende dienst gestelde gunningscriterium,
      bedoeld in [artikel 2.114][ref1], en de nadere criteria, bedoeld in [artikel 2.115][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
  - number: 2.31.1.h
    text: onderhandelt met de inschrijvers;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.31
  - number: 2.31.1.i
    text: maakt een proces-verbaal van de opdrachtverlening;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.31
  - number: 2.31.1.j
    text: deelt de gunningsbeslissing mee;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.31
  - number: 2.31.1.k
    text: kan de overeenkomst sluiten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.31
  - number: 2.31.1.l
    text: maakt de aankondiging van de gegunde opdracht bekend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.31
  - number: 2.31.2
    text: |-
      Indien de aanbestedende dienst toepassing heeft gegeven aan [artikel 2.30, eerste lid, onder a en tweede lid][ref1],
      nodigt hij gelijktijdig en schriftelijk de inschrijvers uit die in de niet-openbare procedure, de openbare
      procedure of de procedure van de concurrentiegerichte dialoog een inschrijving hebben gedaan die voldeden aan de
      geschiktheidseisen en selectiecriteria, en waarop de uitsluitingsgronden niet van toepassing waren. In dat geval
      kan de aanbestedende dienst de onderdelen a tot en met e van het eerste lid achterwege laten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.2'
        paragraaf: 2.2.2.2
        afdeling: 2.2.2
  - number: '2.32'
    text: 'De aanbestedende dienst kan de onderhandelingsprocedure zonder aankondiging toepassen indien:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.32
  - number: 2.32.a
    text: |-
      bij toepassing van de niet-openbare procedure, de openbare procedure of de procedure van de concurrentiegerichte
      dialoog geen of geen geschikte inschrijvingen of geen verzoeken tot deelneming zijn ingediend, de oorspronkelijke
      voorwaarden van de overheidsopdracht niet wezenlijk worden gewijzigd en de Europese Commissie op haar verzoek een
      verslag van de oorspronkelijke procedure wordt overgelegd,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.32
  - number: 2.32.b
    text: |-
      de overheidsopdracht om technische of artistieke redenen of om redenen van bescherming van uitsluitende rechten
      slechts aan een bepaalde ondernemer kan worden toevertrouwd, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.32
  - number: 2.32.c
    text: |-
      voor zover zulks strikt noodzakelijk is, ingeval de termijnen van de niet-openbare procedure of de openbare
      procedure wegens dwingende spoed niet in acht kunnen worden genomen als gevolg van gebeurtenissen die door de
      aanbestedende dienst niet konden worden voorzien en niet aan de aanbestedende dienst zijn te wijten.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.32
  - number: '2.33'
    text: 'De aanbestedende dienst kan de onderhandelingsprocedure zonder aankondiging toepassen:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.33
  - number: 2.33.a
    text: |-
      voor de levering van producten die uitsluitend voor onderzoek, proefneming, studie of ontwikkeling worden
      vervaardigd en waarvan de productie niet in grote hoeveelheden plaatsvindt met het doel de commerciële haalbaarheid
      van het product vast te stellen of de kosten van onderzoek en ontwikkeling te delgen,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.33
  - number: 2.33.b
    text: 'voor door de oorspronkelijke leverancier verrichte aanvullende leveringen die bestemd zijn:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.33
  - number: 2.33.b.1°
    text: voor gedeeltelijke vernieuwing van leveringen of installaties voor courant gebruik, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.33
  - number: 2.33.b.2°
    text: |-
      voor de uitbreiding van bestaande leveringen of installaties, indien verandering van leverancier de aanbestedende
      dienst ertoe zou verplichten apparatuur aan te schaffen met andere technische eigenschappen die niet verenigbaar
      zijn met de technische eigenschappen van reeds geleverde apparatuur of zich bij gebruik en onderhoud van de aan te
      schaffen apparatuur onevenredige technische moeilijkheden voordoen, mits de looptijd van deze overheidsopdrachten
      voor leveringen en nabestellingen niet langer is dan drie jaar,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.33
  - number: 2.33.c
    text: voor op een grondstoffenmarkt genoteerde en aangekochte leveringen, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.33
  - number: 2.33.d
    text: |-
      voor de aankoop van leveringen tegen bijzonder gunstige voorwaarden bij een leverancier die definitief zijn
      handelsactiviteiten stopzet, bij curatoren of vereffenaars van een faillissement ofeen vonnis of bij de toepassing
      van de schuldsaneringsregeling natuurlijke personen of een in andere nationale regelgeving bestaande vergelijkbare
      procedure.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.33
  - number: '2.34'
    text: |-
      De aanbestedende dienst kan de onderhandelingsprocedure zonder aankondiging toepassen voor een overheidsopdracht
      voor diensten indien die overheidsopdracht voortvloeit uit een procedure van het uitschrijven van een prijsvraag en
      volgens de toepasselijke voorschriften aan de winnaar of aan een van de winnaars van die prijsvraag dient te worden
      gegund en de aanbestedende dienst alle winnaars van de prijsvraag tot de onderhandelingen uitnodigt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.34
  - number: '2.35'
    text: |-
      De aanbestedende dienst kan voor aanvullende werken of diensten de onderhandelingsprocedure zonder aankondiging
      toepassen voor zover die diensten of werken noch in het oorspronkelijk gegunde ontwerp, noch in de oorspronkelijk
      gegunde overheidsopdracht waren opgenomen en technisch of economisch niet los van de oorspronkelijke
      overheidsopdracht kunnen worden uitgevoerd zonder overwegende bezwaren voor de aanbestedende dienst dan wel de
      aanvullende werken of diensten strikt noodzakelijk zijn om de oorspronkelijke overheidsopdracht te vervolmaken en:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.35
  - number: 2.35.1°
    text: |-
      de aanvullende werken of diensten ten gevolge van een onvoorziene omstandigheid voor de uitvoering van deze
      overheidsopdracht noodzakelijk zijn geworden,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.35
  - number: 2.35.2°
    text: |-
      de gunning geschiedt aan de aannemer of dienstverlener die de oorspronkelijke overheidsopdracht voor werken of
      overheidsopdracht voor diensten uitvoert, en
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.35
  - number: 2.35.3°
    text: |-
      het totale bedrag van de voor de aanvullende werken of diensten gegunde overheidsopdracht niet hoger is dan 50
      procent van het bedrag van de oorspronkelijke overheidsopdracht.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.35
  - number: '2.36'
    text: |-
      De aanbestedende dienst kan voor nieuwe werken of diensten tot drie jaar volgend op de gunning van de
      oorspronkelijke overheidsopdracht de onderhandelingsprocedure zonder aankondiging toepassen, voor zover die werken
      of diensten bestaan uit herhaling van soortgelijke werken of diensten die door dezelfde aanbestedende diensten
      worden toevertrouwd aan de ondernemer waaraan de oorspronkelijke overheidsopdracht werd gegund en:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.36
  - number: 2.36.1°
    text: |-
      deze werken of diensten overeenstemmen met een basisproject dat het voorwerp vormde van de oorspronkelijke
      overheidsopdracht die met toepassing van de niet-openbare procedure of de openbare procedure is gegund,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.36
  - number: 2.36.2°
    text: |-
      de aanbestedende dienst reeds in de aankondiging van de aanbesteding van het basisproject vermeldde dat een
      procedure zonder aankondiging kan worden toegepast, en
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.36
  - number: 2.36.3°
    text: |-
      de aanbestedende dienst bij toepassing van [afdeling 2.1.2][ref1] het totale voor de volgende werken geraamde
      bedrag in aanmerking heeft genomen voor de raming van de waarde van de overheidsopdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.1
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.36
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.1'
        afdeling: 2.1.2
  - number: '2.37'
    text: |-
      De aanbestedende dienst die de onderhandelingsprocedure zonder aankondiging toepast doorloopt de volgende stappen.
      De aanbestedende dienst:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.37
  - number: 2.37.a
    text: onderhandelt met de betrokken ondernemers;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.37
  - number: 2.37.b
    text: maakt een proces-verbaal van de opdrachtverlening;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.37
  - number: 2.37.c
    text: deelt de gunningsbeslissing mee;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.37
  - number: 2.37.d
    text: kan de overeenkomst sluiten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.37
  - number: 2.37.e
    text: maakt de aankondiging van de gegunde opdracht bekend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.37
  - number: 2.38.1
    text: |-
      De aanbestedende dienst kan voor een overheidsopdracht betreffende diensten die zijn opgenomen in bijlage II-B van
      [richtlijn nr. 2004/18/EG](32004L0018) de procedure voor B-diensten toepassen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.38
  - number: 2.38.2
    text: |-
      Indien de opdracht, bedoeld in het eerste lid, zowel betrekking heeft op diensten als bedoeld in bijlage II-A van
      [richtlijn nr. 2004/18/EG](32004L0018) als op diensten als bedoeld in bijlage II-B van [richtlijn nr. 2004/18/EG]
      (32004L0018) kan de aanbestedende dienst de procedure voor B-diensten toepassen indien de geraamde waarde van de B-
      diensten gelijk is aan of hoger is dan die van de II-A diensten.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.38
  - number: 2.38.3
    text: |-
      Voor opdrachten betreffende diensten voor «gezondheidszorg en maatschappelijke dienstverlening», zoals opgenomen in
      bijlage II-B van [richtlijn nr. 2004/18/EG](32004L0018), wordt, met inachtneming van het tweede lid, de procedure
      voor B-diensten toegepast, tenzij de aanbestedende dienst anders besluit.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.38
  - number: 2.39.1
    text: |-
      De aanbestedende dienst die de procedure voor B-diensten toepast doorloopt de volgende stappen. De aanbestedende
      dienst:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.39
  - number: 2.39.1.a
    text: |-
      toetst of de inschrijvingen voldoen aan de door de aanbestedende dienst gestelde technische specificaties, eisen
      en normen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.39
  - number: 2.39.1.b
    text: maakt een proces-verbaal van de opdrachtverlening;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.39
  - number: 2.39.1.c
    text: deelt de resultaten van de gunning mee aan de Europese Commissie;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.39
  - number: 2.39.1.d
    text: kan een aankondiging van de gegunde opdracht bekend maken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.39
  - number: 2.39.2
    text: |-
      Bij toepassing van de procedure voor B-diensten zijn uitsluitend de [paragrafen 2.3.3.1][ref1] en
      [2.3.8.9 van hoofdstuk 2.3][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.39
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        paragraaf: 2.3.3.1
        afdeling: 2.3.3
      - id: ref2
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.9
        afdeling: 2.3.8
  - number: 2.39.3
    text: |-
      In afwijking van het tweede lid maakt de aanbestedende dienst een aankondiging van het voornemen tot het plaatsen
      van de overheidsopdracht bekend op het elektronische systeem voor aanbestedingen, indien die opdracht een duidelijk
      grensoverschrijdend belang heeft.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.39
  - number: 2.40.1
    text: |-
      De aanbestedende dienst die een concessieovereenkomst voor openbare werken wil sluiten past de procedure voor
      concessieovereenkomsten voor werken toe.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.40
  - number: 2.40.2
    text: |-
      Het eerste lid is niet van toepassing op aanvullende werken die noch in het aanvankelijk overwogen ontwerp
      van de concessieovereenkomst noch in de oorspronkelijk gesloten overeenkomst waren opgenomen en die als gevolg
      van onvoorziene omstandigheden voor de uitvoering van het werk zoals dat daarin is beschreven en dat door de
      aanbestedende dienst aan de concessiehouder wordt opgedragen, noodzakelijk zijn geworden:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.40
  - number: 2.40.2.a
    text: |-
      indien deze aanvullende werken uit technisch of economisch oogpunt niet los van de gesloten concessieovereenkomst
      kunnen worden uitgevoerd zonder de aanbestedende dienst grote ongemakken te bezorgen, en zij worden gegund aan de
      ondernemer met wie de concessieovereenkomst is gesloten, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.40
  - number: 2.40.2.b
    text: |-
      indien deze werken, hoewel zij van de uitvoering van de oorspronkelijke overheidsopdracht kunnen worden gescheiden,
      voor de vervolmaking ervan strikt noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.40
  - number: 2.40.3
    text: |-
      Het totale bedrag van de voor de aanvullende diensten of werken gegunde overheidsopdracht, bedoeld in het tweede
      lid, mag niet hoger zijn dan 50 procent van het bedrag van het hoofdwerk waarvoor de concessieovereenkomst is
      gesloten.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.40
  - number: '2.41'
    text: |-
      De aanbestedende dienst die een concessieovereenkomst voor openbare werken wil sluiten, doorloopt de volgende
      stappen. De aanbestedende dienst:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.41
  - number: 2.41.a
    text: maakt een aankondiging van de overheidsopdracht bekend;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.41
  - number: 2.41.b
    text: toetst of een inschrijver valt onder een door de aanbestedende dienst gestelde uitsluitingsgrond;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.41
  - number: 2.41.c
    text: toetst of een niet-uitgesloten inschrijver voldoet aan de door de aanbestedende dienst gestelde geschiktheidseisen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.41
  - number: 2.41.d
    text: |-
      toetst of de inschrijvingen voldoen aan de door de aanbestedende dienst gestelde technische specificaties, eisen
      en normen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.41
  - number: 2.41.e
    text: deelt de gunningsbeslissing mee;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.41
  - number: 2.41.f
    text: kan de concessieovereenkomst voor openbare werken sluiten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.41
  - number: 2.41.g
    text: |-
      waarborgt dat de concessiehouder bij de verlening van opdrachten de in [artikel 2.154 tot en met 2.156][ref1]
      gestelde eisen in acht neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.41
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.4
  - number: '2.42'
    text: Een aanbestedende dienst past voor het uitschrijven van een prijsvraag de procedure van een prijsvraag toe.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.42
  - number: 2.43.1
    text: |-
      De aanbestedende dienst die de procedure van een prijsvraag toepast, doorloopt de volgende stappen. De
      aanbestedende dienst:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.43
  - number: 2.43.1.a
    text: maakt een aankondiging van de prijsvraag bekend;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.43
  - number: 2.43.1.b
    text: toetst of een deelnemer valt onder een door de aanbestedende dienst gestelde uitsluitingsgrond;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.43
  - number: 2.43.1.c
    text: |-
      toetst of een niet-uitgesloten deelnemer voldoet aan de door de aanbestedende dienst gestelde criteria betreffende
      de geschiktheidseisen en selectiecriteria;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.43
  - number: 2.43.1.d
    text: stelt een jury in.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.43
  - number: 2.43.2
    text: 'De in het eerste lid, onderdeel d, bedoelde jury:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.43
  - number: 2.43.2.a
    text: onderzoekt de ingediende, geanonimiseerde plannen of ontwerpen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.43
  - number: 2.43.2.b
    text: nodigt desgewenst deelnemers uit tot het beantwoorden van vragen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.43
  - number: 2.43.2.c
    text: bepaalt haar oordeel;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.43
  - number: 2.43.2.d
    text: stelt een verslag op met daarin de rangorde van de deelnemers.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.43
  - number: 2.43.3
    text: |-
      De aanbestedende dienst maakt het oordeel van de jury bekend, voor zover deze tot een oordeel is gekomen, en maakt
      de resultaten van de prijsvraag bekend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.43
  - number: '2.44'
    text: 'Een aanbestedende dienst die een raamovereenkomst wil sluiten, past daartoe een van de volgende procedures toe:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.44
  - number: 2.44.a
    text: de openbare procedure;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.44
  - number: 2.44.b
    text: de niet-openbare procedure;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.44
  - number: 2.44.c
    text: |-
      indien dat op grond van [artikel 2.28][ref1] is toegestaan, de procedure van de concurrentiegerichte dialoog;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.44
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.2'
        paragraaf: 2.2.2.1
        afdeling: 2.2.2
  - number: 2.44.d
    text: |-
      indien dat op grond van [artikel 2.30][ref1] is toegestaan, de onderhandelingsprocedure met aankondiging;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.44
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.2'
        paragraaf: 2.2.2.2
        afdeling: 2.2.2
  - number: 2.44.e
    text: |-
      indien dat op grond van de [artikelen 2.32 tot en met 2.36][ref1] is toegestaan, de onderhandelingsprocedure zonder
      aankondiging;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.44
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.2'
        paragraaf: 2.2.2.3
        afdeling: 2.2.2
  - number: 2.44.f
    text: |-
      indien dat op grond van [artikel 2.38][ref1] is toegestaan, de procedure voor B-diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.44
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.2'
        paragraaf: 2.2.2.4
        afdeling: 2.2.2
  - number: 2.45.1
    text: |-
      Een aanbestedende dienst die een overheidsopdracht wil plaatsen met gebruikmaking van een raamovereenkomst die
      hij gesloten heeft met een enkele ondernemer, past de procedure voor het gunnen van een overheidsopdracht via een
      raamovereenkomst met een enkele ondernemer toe, indien deze raamovereenkomst overeenkomstig [artikel 2.44][ref1]
      is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.45
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.2'
        paragraaf: 2.2.3.3
        afdeling: 2.2.3
  - number: 2.45.2
    text: |-
      In het in het eerste lid bedoelde geval gunt de aanbestedende dienst de opdracht op basis van de in de
      raamovereenkomst gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.45
  - number: '2.46'
    text: |-
      Een aanbestedende dienst die een overheidsopdracht wil plaatsen met gebruikmaking van een raamovereenkomst
      die hij gesloten heeft met meerdere ondernemers, past de procedure voor het gunnen van een overheidsopdracht
      door middel van een raamovereenkomst met meerdere ondernemers toe, indien deze raamovereenkomst overeenkomstig
      [artikel 2.44][ref1] is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.46
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.2'
        paragraaf: 2.2.3.3
        afdeling: 2.2.3
  - number: 2.47.1
    text: |-
      In het in [artikel 2.46][ref1] bedoelde geval past de aanbestedende dienst de voorwaarden van de raamovereenkomst
      toe, zonder de betrokken ondernemers opnieuw tot mededinging op te roepen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.2'
        paragraaf: 2.2.3.3
        afdeling: 2.2.3
  - number: 2.47.2
    text: |-
      Indien niet alle voorwaarden in de raamovereenkomst zijn bepaald, doorloopt de aanbestedende dienst de volgende
      stappen. De aanbestedende dienst:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.47
  - number: 2.47.2.a
    text: vraagt de betrokken ondernemers de inschrijvingen in te dienen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.47
  - number: 2.47.2.b
    text: |-
      beoordeelt de aangevulde inschrijvingen volgens de in de raamovereenkomst of aanbestedingsstukken vastgestelde
      gunningscriteria;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.47
  - number: 2.47.2.c
    text: kan de overeenkomst sluiten.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.47
  - number: '2.48'
    text: |-
      Een aanbestedende dienst die een dynamisch aankoopsysteem wil instellen past daartoe de openbare procedure toe, met
      uitzondering van de fase van de gunning.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.48
  - number: '2.49'
    text: |-
      Een aanbestedende dienst die een dynamisch aankoopsysteem instelt met toepassing van de openbare procedure,
      doorloopt de volgende stappen. De aanbestedende dienst:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.49
  - number: 2.49.a
    text: maakt een aankondiging van de overheidsopdracht bekend;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.49
  - number: 2.49.b
    text: toetst of een inschrijver valt onder een door de aanbestedende dienst gestelde uitsluitingsgrond;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.49
  - number: 2.49.c
    text: toetst of een niet-uitgesloten inschrijver voldoet aan de door de aanbestedende dienst gestelde geschiktheidseisen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.49
  - number: 2.49.d
    text: |-
      toetst of de indicatieve inschrijvingen voldoen aan de door de aanbestedende dienst gestelde technische
      specificaties, eisen en normen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.49
  - number: 2.49.e
    text: |-
      laat de niet-uitgesloten inschrijvers die een geldige inschrijving hebben ingediend toe tot het dynamisch
      aankoopsysteem.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.49
  - number: '2.50'
    text: |-
      Een aanbestedende dienst die een overheidsopdracht wil plaatsen binnen een dynamisch aankoopsysteem past de
      procedure voor het plaatsen van een opdracht binnen een dynamisch aankoopsysteem toe.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.50
  - number: '2.51'
    text: |-
      Een aanbestedende dienst die de procedure voor het plaatsen van een opdracht binnen een dynamisch aankoopsysteem
      toepast doorloopt de volgende stappen. De aanbestedende dienst:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.51
  - number: 2.51.a
    text: maakt een vereenvoudigde aankondiging bekend;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.51
  - number: 2.51.b
    text: |-
      beoordeelt de indicatieve inschrijvingen en laat de niet-uitgesloten inschrijvers toe tot het dynamisch
      aankoopsysteem;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.51
  - number: 2.51.c
    text: publiceert een aankondiging in het systeem;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.51
  - number: 2.51.d
    text: nodigt alle toegelaten inschrijvers uit een inschrijving in te dienen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.51
  - number: 2.51.e
    text: beoordeelt de inschrijvingen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.51
  - number: 2.51.i
    text: deelt de gunningsbeslissing mee;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.51
  - number: 2.51.j
    text: kan de overeenkomst sluiten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.51
  - number: 2.51.k
    text: maakt de aankondiging van de gegunde opdracht bekend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.51
  - number: 2.52.1
    text: |-
      Een aanbestedende dienst wijst gegadigden of inschrijvers die krachtens de wetgeving van de lidstaat waarin zij
      zijn gevestigd, gerechtigd zijn de desbetreffende verrichting uit te voeren, niet af louter op grond van het feit
      dat zij een natuurlijke persoon of een rechtspersoon zijn.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.52
  - number: 2.52.2
    text: |-
      Een aanbestedende dienst kan voor overheidsopdrachten voor diensten, voor overheidsopdrachten voor werken
      en voor overheidsopdrachten voor leveringen die bijkomende diensten of installatiewerkzaamheden inhouden,
      van een rechtspersoon verlangen dat deze in de inschrijving of in het verzoek tot deelneming de namen en de
      beroepskwalificaties vermeldt van de personen die met de uitvoering van de opdracht worden belast.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.52
  - number: 2.52.3
    text: Een samenwerkingsverband van ondernemers kan zich inschrijven of zich als gegadigde opgeven.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.52
  - number: 2.52.4
    text: |-
      Een aanbestedende dienst verlangt voor het indienen van een inschrijving of een verzoek tot deelneming van een
      samenwerkingsverband van ondernemers niet dat het samenwerkingsverband van ondernemers een bepaalde rechtsvorm
      heeft.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.52
  - number: 2.52.5
    text: |-
      Een aanbestedende dienst kan van een samenwerkingsverband waaraan de overheidsopdracht wordt gegund, eisen dat het
      een bepaalde rechtsvorm aanneemt, indien dit voor de goede uitvoering van de overheidsopdracht noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.52
  - number: 2.53.1
    text: Een ondernemer kan inlichtingen vragen over een specifieke aanbesteding.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.53
  - number: 2.53.2
    text: |-
      De aanbestedende dienst beantwoordt de gestelde vragen in een nota van inlichtingen, die hij aan alle gegadigden of
      inschrijvers verzendt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.53
  - number: 2.53.3
    text: |-
      Een ondernemer kan de aanbestedende dienst verzoeken om bepaalde informatie niet in de nota van inlichtingen op te
      nemen indien openbaarmaking van deze informatie schade zou toebrengen aan de gerechtvaardigde economische belangen
      van de onderneming.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.53
  - number: 2.54.1
    text: |-
      Een aanbestedende dienst verstrekt nadere inlichtingen over de aanbestedingsstukken uiterlijk zes dagen voor de
      uiterste datum voor het indienen van de inschrijvingen, mits het verzoek om inlichtingen tijdig voor de uiterste
      datum voor het indienen van de inschrijvingen is gedaan.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.54
  - number: 2.54.2
    text: |-
      In afwijking van het eerste lid bedraagt de in dat lid bedoelde termijn in geval van toepassing van de niet-
      openbare procedure of onderhandelingsprocedure, waarbij toepassing wordt gegeven aan [artikel 2.74][ref1], vier
      dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.54
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.3
        afdeling: 2.3.2
  - number: '2.55'
    text: |-
      Een aanbestedende dienst kan een ondernemer vragen om zijn inschrijving of verzoek om deelneming nader toe te
      lichten of aan te vullen, met inachtneming van de [artikelen 2.84][ref1], [2.85][ref2] en [2.102][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.55
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        afdeling: 2.3.4
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        afdeling: 2.3.4
      - id: ref3
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.6.4
        afdeling: 2.3.6
  - number: '2.56'
    text: |-
      Een aanbestedende dienst neemt passende maatregelen om het verloop van een langs elektronische weg gevoerde
      procedure te documenteren.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.56
  - number: 2.57.1
    text: |-
      Onverminderd het in deze wet bepaalde maakt een aanbestedende dienst informatie die hem door een ondernemer als
      vertrouwelijk is verstrekt niet openbaar.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.57
  - number: 2.57.2
    text: |-
      Onverminderd het in deze wet bepaalde maakt een aanbestedende dienst geen informatie openbaar uit
      aanbestedingsstukken of andere documenten die de dienst heeft opgesteld in verband met een aanbestedingsprocedure,
      indien die informatie kan worden gebruikt om de mededinging te vervalsen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.57
  - number: '2.58'
    text: 'Een aanbestedende dienst kan een vooraankondiging bekendmaken waarin wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.58
  - number: 2.58.a
    text: |-
      het overeenkomstig [afdeling 2.1.2][ref1] geraamde bedrag en de hoofdkenmerken van de overheidsopdrachten voor
      werken die hij voornemens is te plaatsen of te sluiten, indien dat bedrag gelijk is aan of meer bedraagt dan het
      bedrag, bedoeld in [artikel 2.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.1
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.1'
        afdeling: 2.1.2
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.1.1
        afdeling: 2.1.1
  - number: 2.58.b
    text: |-
      het overeenkomstig [afdeling 2.1.2][ref1] geraamde totale bedrag per productgroep van de overheidsopdrachten voor
      leveringen die de aanbestedende dienst voornemens is in de loop van de komende twaalf maanden te plaatsen, indien
      dat bedrag € 750 000 of meer bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.1
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.1'
        afdeling: 2.1.2
  - number: 2.58.c
    text: |-
      het overeenkomstig [afdeling 2.1.2][ref1] geraamde totale bedrag per dienstencategorie van de overheidsopdrachten
      voor diensten voor elk van de dienstencategorieën als bedoeld in bijlage II, onderdeel A, van [richtlijn nr.
      2004/18/EG](32004L0018), die de aanbestedende dienst voornemens is in de loop van de komende twaalf maanden te
      plaatsen, indien dat bedrag, € 750 000 of meer bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.1
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.1'
        afdeling: 2.1.2
  - number: 2.59.1
    text: |-
      De bekendmaking van de vooraankondiging geschiedt langs elektronische weg, met gebruikmaking van het elektronische
      systeem voor aanbestedingen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.59
  - number: 2.59.2
    text: |-
      De aanbestedende dienst gebruikt voor de bekendmaking van de vooraankondiging het daartoe door middel van het
      elektronische systeem voor aanbestedingen beschikbaar gestelde formulier.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.59
  - number: 2.60.1
    text: |-
      Een aanbestedende dienst zendt de vooraankondiging, bedoeld in [artikel 2.58, onderdeel a][ref1], zo spoedig
      mogelijk nadat de beslissing is genomen tot goedkeuring van het programma voor de overheidsopdrachten voor werken
      die de aanbestedende dienst voornemens is te plaatsen of te sluiten, met behulp van het elektronische systeem voor
      aanbestedingen toe aan de Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.60
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.1
        afdeling: 2.3.2
  - number: 2.60.2
    text: |-
      Een aanbestedende dienst zendt de vooraankondiging, bedoeld in [artikel 2.58, onderdelen b en c][ref1], zo spoedig
      mogelijk na het begin van het begrotingsjaar met gebruikmaking van het elektronische systeem voor aanbestedingen
      toe aan de Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.60
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.1
        afdeling: 2.3.2
  - number: 2.61.1
    text: |-
      In afwijking van [artikel 2.60][ref1] kan de aanbestedende dienst de vooraankondiging ook bekend maken op zijn
      kopersprofiel.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.61
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.1
        afdeling: 2.3.2
  - number: 2.61.2
    text: |-
      Een kopersprofiel als bedoeld in het eerste lid is langs elektronische weg toegankelijk en kan informatie bevatten
      inzake vooraankondigingen, lopende aanbestedingsprocedures, voorgenomen aankopen, gegunde overheidsopdrachten,
      geannuleerde procedures en nuttige algemene informatie, zoals een contactpunt, een telefoon- en faxnummer, een
      postadres en een e-mailadres.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.61
  - number: 2.61.3
    text: |-
      In het in het eerste lid bedoelde geval zendt de aanbestedende dienst een kennisgeving van de vooraankondiging
      langs elektronische weg met gebruikmaking van het elektronische systeem voor aanbestedingen toe aan de Europese
      Commissie.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.61
  - number: 2.61.4
    text: |-
      De in het derde lid bedoelde kennisgeving geschiedt door middel van het daartoe door middel van het elektronische
      systeem voor aanbestedingen beschikbaar gestelde formulier.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.61
  - number: 2.61.5
    text: |-
      Een aanbestedende dienst maakt de vooraankondiging op zijn kopersprofiel niet eerder bekend dan nadat de
      kennisgeving van die bekendmaking aan de Europese Commissie is verzonden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.61
  - number: 2.61.6
    text: De vooraankondiging op het kopersprofiel bevat de datum van de kennisgeving, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.61
  - number: 2.62.1
    text: |-
      De aanbestedende dienst die voornemens is een overheidsopdracht te gunnen maakt hiertoe een aankondiging van de
      overheidsopdracht bekend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.62
  - number: 2.62.2
    text: |-
      De bekendmaking van de aankondiging geschiedt langs elektronische weg met gebruikmaking van het elektronische
      systeem voor aanbestedingen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.62
  - number: 2.62.3
    text: |-
      De aanbestedende dienst gebruikt voor de bekendmaking van de aankondiging het daartoe door middel van het
      elektronische systeem voor aanbestedingen beschikbaar gestelde formulier.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.62
  - number: 2.62.4
    text: |-
      Het eerste lid is niet van toepassing indien de aanbestedende dienst de onderhandelingsprocedure zonder
      aankondiging toepast.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.62
  - number: '2.63'
    text: |-
      De aanbestedende dienst geeft in de aankondiging aan, welke bewijsmiddelen met betrekking tot de financiële en
      economische draagkracht en de technische bekwaamheid en de beroepsbekwaamheid hij van de ondernemer verlangt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.63
  - number: '2.64'
    text: |-
      De aanbestedende dienst kan met behulp van de bevestiging van ontvangst van de bekendmaking van de Europese
      Commissie aantonen dat hij een aankondiging heeft bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.64
  - number: 2.65.1
    text: |-
      De aanbestedende dienst maakt de aankondiging of de inhoud ervan niet eerder op een andere wijze bekend dan nadat
      deze door middel van het elektronische systeem voor aanbestedingen aan de Europese Commissie is gezonden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.65
  - number: 2.65.2
    text: |-
      Indien de aanbestedende dienst de aankondiging ook op een andere wijze dan met gebruikmaking van het elektronische
      systeem voor aanbestedingen bekend maakt, bevat die aankondiging geen andere informatie dan die welke aan de
      Europese Commissie is gezonden of via het kopersprofiel is bekendgemaakt en bevat deze in ieder geval de datum van
      toezending aan de Europese Commissie dan wel de datum van de bekendmaking op het kopersprofiel.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.65
  - number: 2.66.1
    text: |-
      De aanbestedende dienst stelt de aanbestedingsstukken voor de overheidsopdracht op enigerlei wijze kosteloos ter
      beschikking.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.66
  - number: 2.66.2
    text: |-
      Indien de aanbestedende dienst de aanbestedingsstukken voor de overheidsopdracht ook op andere wijze dan ter
      uitvoering van het eerste lid beschikbaar stelt, kan de aanbestedende dienst de kosten voor die wijze van
      verstrekking in rekening brengen bij degenen die om die andere wijze van verstrekking van de aanbestedingsstukken
      hebben gevraagd.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.66
  - number: 2.67.1
    text: De aanbestedende dienst kan een rectificatie van een eerder gedane aankondiging bekendmaken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.67
  - number: 2.67.2
    text: |-
      De bekendmaking van de rectificatie geschiedt langs elektronische weg met gebruikmaking van het elektronische
      systeem voor aanbestedingen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.67
  - number: 2.67.3
    text: |-
      De aanbestedende dienst gebruikt voor de bekendmaking van de rectificatie het daartoe door middel van het
      elektronische systeem voor aanbestedingen beschikbaar gestelde formulier.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.67
  - number: '2.68'
    text: |-
      Indien de aanbestedende dienst bij toepassing van de openbare procedure niet langs elektronische weg vrije,
      rechtstreekse en volledige toegang biedt tot de aanbestedingsstukken en alle aanvullende stukken, zendt de
      aanbestedende dienst de aanbestedingsstukken en de aanvullende stukken binnen zes dagen na ontvangst van het
      verzoek daartoe aan de desbetreffende ondernemer toe, mits dit verzoek tijdig voor de uiterste datum voor het
      indienen van de inschrijvingen is gedaan.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.68
  - number: '2.69'
    text: |-
      Indien de aanbestedingsstukken bij een andere instantie moeten worden opgevraagd vermeldt de aanbestedende
      dienst in de uitnodiging tot deelname aan een niet-openbare procedure, de concurrentiegerichte dialoog of een
      onderhandelingsprocedure met aankondiging, het adres van deze instantie en, in voorkomend geval, de uiterste datum
      voor dit verzoek.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.69
  - number: '2.70'
    text: |-
      De aanbestedende dienst stelt de termijn voor het indienen van verzoeken tot deelneming of inschrijvingen vast
      met inachtneming van het voorwerp van de opdracht, de voor de voorbereiding van het verzoek of de inschrijving
      benodigde tijd en de in deze paragraaf gestelde regels omtrent termijnen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.70
  - number: 2.71.1
    text: |-
      Voor openbare procedures bedraagt de termijn voor het indienen van de inschrijvingen ten minste 45 dagen, te
      rekenen vanaf de verzenddatum van de aankondiging.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.71
  - number: 2.71.2
    text: |-
      Voor niet-openbare procedures, onderhandelingsprocedures met aankondiging en de concurrentiegerichte dialoog
      bedraagt de termijn voor het indienen van de verzoeken tot deelneming ten minste 30 dagen, te rekenen vanaf de
      verzenddatum van de aankondiging van de overheidsopdracht.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.71
  - number: 2.71.3
    text: |-
      Voor niet-openbare procedures bedraagt de termijn voor het indienen van de inschrijvingen ten minste 40 dagen, te
      rekenen vanaf de verzenddatum van de uitnodiging tot inschrijving.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.71
  - number: 2.71.4
    text: |-
      Indien de aanbestedende dienst een vooraankondiging als bedoeld in [paragraaf 2.3.2.1][ref1] heeft gedaan, kan hij
      de termijn voor het indienen van de inschrijvingen, bedoeld in het eerste en derde lid, inkorten tot 29 dagen, maar
      in geen geval tot minder dan 22 dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.71
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.1
        afdeling: 2.3.2
  - number: 2.71.5
    text: |-
      Het inkorten van de termijn, bedoeld in het vierde lid, is uitsluitend toegestaan, indien de vooraankondiging
      alle informatie bevat die in de aankondiging van de overheidsopdracht, bedoeld in bijlage VII, onderdeel A, van
      [richtlijn nr. 2004/18/EG](32004L0018), wordt verlangd, voor zover deze informatie beschikbaar is op het tijdstip
      dat de vooraankondiging wordt bekendgemaakt en mits deze vooraankondiging ten minste 52 dagen en ten hoogste 12
      maanden voor de verzenddatum van de aankondiging van de overheidsopdracht ter bekendmaking is verzonden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.71
  - number: '2.72'
    text: |-
      Een aanbestedende dienst kan de termijnen voor de het indienen van inschrijvingen, bedoeld in
      [artikel 2.71, eerste en derde lid][ref1], met vijf dagen inkorten indien hij met elektronische middelen en vanaf
      het doen van de aankondiging vrije, rechtstreekse en volledige toegang biedt tot de aanbestedingsstukken, met
      inachtneming van [paragraaf 2.3.2.2][ref2], en in de aankondiging het internetadres vermeldt dat toegang biedt tot
      deze documenten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.72
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.3
        afdeling: 2.3.2
      - id: ref2
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.2
        afdeling: 2.3.2
  - number: '2.73'
    text: |-
      Indien de tijdig aangevraagde aanbestedingsstukken en de aanvullende stukken of nadere inlichtingen niet binnen de
      in de [artikelen 2.54][ref1] en [2.68][ref2] gestelde termijnen zijn verstrekt, of indien de inschrijvingen slechts
      na een bezichtiging ter plaatse, of na inzage ter plaatse van de bij de aanbestedingsstukken behorende stukken
      kunnen worden gedaan, verlengt de aanbestedende dienst de termijn voor de het indienen van de inschrijvingen
      zodanig dat alle betrokken ondernemers van alle nodige informatie voor de opstelling van de inschrijvingen kennis
      kunnen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.73
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.1.2
        afdeling: 2.3.1
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.2
        afdeling: 2.3.2
  - number: '2.74'
    text: |-
      Indien om dringende redenen de in de [artikelen 2.71 tot en met 2.73][ref1] bepaalde termijnen niet in acht
      kunnen worden genomen, kan een aanbestedende dienst bij een niet-openbare procedure, de procedure van de
      concurrentiegerichte dialoog of een onderhandelingsprocedure met aankondiging de volgende termijnen vaststellen:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.74
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.3
        afdeling: 2.3.2
  - number: 2.74.a
    text: |-
      een termijn voor het indienen van de verzoeken tot deelneming van ten minste vijftien dagen, te rekenen vanaf de
      verzenddatum van de aankondiging van de overheidsopdracht, of tien dagen indien de aankondiging elektronisch is
      verzonden overeenkomstig het model in het derde punt van bijlage VIII van [richtlijn nr. 2004/18/EG](32004L0018);
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.74
  - number: 2.74.b
    text: |-
      in het geval van de niet-openbare procedure en de procedure van de concurrentie gerichte dialoog, een termijn
      voor de het indienen van de inschrijvingen van ten minste tien dagen, te rekenen vanaf de verzenddatum van de
      uitnodiging tot het indienen van een inschrijving.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.74
  - number: 2.75.1
    text: Een aanbestedende dienst neemt de door hem gestelde technische specificaties op in de aanbestedingsstukken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.75
  - number: 2.75.2
    text: |-
      De technische specificaties bieden de inschrijvers gelijke toegang en leiden niet tot ongerechtvaardigde
      belemmeringen in de openstelling van overheidsopdrachten voor mededinging.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.75
  - number: 2.76.1
    text: 'Een aanbestedende dienst formuleert de technische specificaties:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.76
  - number: 2.76.1.a
    text: |-
      door verwijzing naar technische specificaties en naar nationale normen waarin Europese normen zijn omgezet,
      Europese technische goedkeuringen, gemeenschappelijke technische specificaties, internationale normen, andere door
      Europese normalisatie-instellingen opgestelde technische referentiesystemen of, bij ontstentenis daarvan, nationale
      normen, nationale technische goedkeuringen dan wel nationale technische specificaties inzake het ontwerpen,
      berekenen en uitvoeren van werken en het gebruik van producten,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.76
  - number: 2.76.1.b
    text: |-
      in termen van prestatie-eisen en functionele eisen, die milieukenmerken kunnen bevatten, waarbij de eisen
      zodanig nauwkeurig zijn bepaald dat de inschrijvers het voorwerp van de overheidsopdracht kunnen bepalen en de
      aanbestedende dienst de overheidsopdracht kan gunnen,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.76
  - number: 2.76.1.c
    text: |-
      in termen van prestatie-eisen en functionele eisen als bedoeld in onderdeel b, waarbij onder vermoeden van
      overeenstemming met deze prestatie-eisen en functionele eisen wordt verwezen naar de specificaties, bedoeld in
      onderdeel a, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.76
  - number: 2.76.1.d
    text: |-
      door verwijzing naar de specificaties, bedoeld in onderdeel a, voor bepaalde kenmerken, en verwijzing naar de
      prestatie-eisen en functionele eisen, bedoeld in onderdeel b, voor andere kenmerken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.76
  - number: 2.76.2
    text: |-
      Een aanbestedende dienst doet een verwijzing als bedoeld in het eerste lid, onderdeel a, vergezeld gaan van de
      woorden «of gelijkwaardig».
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.76
  - number: 2.76.3
    text: |-
      Een aanbestedende dienst die milieukenmerken voorschrijft door verwijzing naar prestatie-eisen of functionele eisen
      als bedoeld in het eerste lid, onderdeel b, kan gebruik maken van de gedetailleerde specificaties of van gedeelten
      daarvan, zoals vastgesteld in milieukeurmerken, voor zover:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.76
  - number: 2.76.3.a
    text: |-
      die geschikt zijn voor de omschrijving van de kenmerken van de leveringen of diensten waarop de overheidsopdracht
      betrekking heeft,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.76
  - number: 2.76.3.b
    text: de vereisten voor de keurmerken zijn ontwikkeld op grond van wetenschappelijke gegevens,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.76
  - number: 2.76.3.c
    text: |-
      de milieukeurmerken zijn aangenomen via een proces waaraan alle betrokkenen, zoals regeringsinstanties,
      consumenten, fabrikanten, kleinhandel en milieuorganisaties kunnen deelnemen, en
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.76
  - number: 2.76.3.d
    text: de keurmerken toegankelijk zijn voor alle betrokken partijen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.76
  - number: 2.76.4
    text: |-
      Een aanbestedende dienst kan aangeven dat van een milieukeurmerk voorziene producten of diensten voldoen aan de
      technische specificaties van de aanbestedingsstukken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.76
  - number: 2.76.5
    text: |-
      Een aanbestedende dienst verwijst in de technische specificaties niet naar een bepaald fabrikaat, een bepaalde
      herkomst of een bijzondere werkwijze, een merk, keurmerk of certificaat betreffende duurzaamheid, milieu of
      dierenwelzijn, dan wel gebaseerd op sociale overwegingen, een octrooi of een type, een bepaalde oorsprong of een
      bepaalde productie, waardoor bepaalde ondernemingen of bepaalde producten worden bevoordeeld of uitgesloten, tenzij
      dit door het voorwerp van de overheidsopdracht gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.76
  - number: 2.76.6
    text: |-
      Een aanbestedende dienst kan de melding of verwijzing, bedoeld in het vijfde lid, opnemen in de technische
      specificatie indien:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.76
  - number: 2.76.6.a
    text: |-
      een voldoende nauwkeurige en begrijpelijke beschrijving van het voorwerp van de overheidsopdracht door toepassing
      van het eerste lid of van [artikel 2.77, eerste lid][ref1], niet mogelijk is en


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.76
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.3.1
        afdeling: 2.3.3
  - number: 2.76.6.b
    text: deze melding of verwijzing vergezeld gaat van de woorden «of gelijkwaardig».
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.76
  - number: 2.77.1
    text: |-
      Een aanbestedende dienst die verwijst naar de specificaties, bedoeld in
      [artikel 2.76, eerste lid, onderdeel a][ref1], wijst een inschrijving niet af omdat de aangeboden producten en
      diensten niet voldoen aan de specificaties waarnaar hij heeft verwezen, indien de inschrijver in zijn inschrijving
      tot voldoening van de aanbestedende dienst aantoont dat de door hem voorgestelde oplossingen op gelijkwaardige
      wijze voldoen aan de eisen in die technische specificaties.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.77
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.3.1
        afdeling: 2.3.3
  - number: 2.77.2
    text: |-
      Een aanbestedende dienst die prestatie-eisen of functionele eisen stelt als bedoeld in
      [artikel 2.76, eerste lid, onderdelen b en c][ref1], wijst een inschrijving voor werken, producten of diensten niet
      af indien die inschrijving voldoet:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.77
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.3.1
        afdeling: 2.3.3
  - number: 2.77.2.a
    text: aan een nationale norm waarin een Europese norm is omgezet,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.77
  - number: 2.77.2.b
    text: aan een Europese technische goedkeuring,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.77
  - number: 2.77.2.c
    text: aan een gemeenschappelijke technische specificatie,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.77
  - number: 2.77.2.d
    text: aan een internationale norm of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.77
  - number: 2.77.2.e
    text: aan een door een Europese normalisatie-instelling opgesteld technisch referentiesysteem,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.77
  - number: 2.77.3
    text: |-
      De aanbestedende dienst aanvaardt, indien hij gebruik maakt van de in [artikel 2.76, vierde lid][ref1], bedoelde
      mogelijkheid, elk ander passend bewijsmiddel, zoals een technisch dossier van de fabrikant of een testverslag van
      een erkende organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.77
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.3.1
        afdeling: 2.3.3
  - number: 2.77.4
    text: |-
      Een aanbestedende dienst aanvaardt certificaten van in andere lidstaten van de Europese Unie gevestigde erkende
      organisaties.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.77
  - number: '2.78'
    text: |-
      Een inschrijver toont in zijn inschrijving aan dat het product, de dienst of het werk in overeenstemming is met de
      norm en voldoet aan de functionele en prestatie-eisen van de aanbestedende dienst.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.78
  - number: '2.79'
    text: |-
      De aanbestedende dienst kan in de aanbestedingsstukken bepalen dat een inschrijver in zijn inschrijving
      aangeeft welk gedeelte van de overheidsopdracht hij voornemens is aan derden in onderaanneming te geven en welke
      onderaannemers hij voorstelt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.79
  - number: '2.80'
    text: |-
      Een aanbestedende dienst kan bijzondere voorwaarden verbinden aan de uitvoering van een overheidsopdracht,
      mits dergelijke voorwaarden met het Verdrag betreffende de werking van de Europese Unie verenigbaar zijn en in
      de aankondiging of de aanbestedingsstukken vermeld zijn. De voorwaarden waaronder de overheidsopdracht wordt
      uitgevoerd, kunnen verband houden met sociale of milieuoverwegingen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.80
  - number: 2.81.1
    text: |-
      In de aanbestedingsstukken geeft een aanbestedende dienst aan bij welk orgaan de gegadigden of inschrijvers
      informatie kunnen verkrijgen over verplichtingen omtrent de bepalingen inzake belastingen, milieubescherming,
      arbeidsbescherming en arbeidsvoorwaarden die gelden in Nederland of, indien de verrichtingen buiten Nederland
      worden uitgevoerd, die gelden in het gebied of de plaats waar de verrichtingen worden uitgevoerd en die gedurende
      de uitvoering van de overheidsopdracht op die verrichtingen van toepassing zullen zijn.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.81
  - number: 2.81.2
    text: |-
      Een aanbestedende dienst verzoekt de inschrijvers of de gegadigden aan te geven dat zij bij het opstellen
      van hun inschrijving rekening hebben gehouden met de verplichtingen uit hoofde van de bepalingen inzake de
      arbeidsbescherming en de arbeidsvoorwaarden die gelden op de plaats waar de verrichting wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.81
  - number: 2.82.1
    text: |-
      De aanbestedende dienst kan de deelneming aan een procedure voor de gunning van een overheidsopdracht of de
      uitvoering ervan voorbehouden aan sociale werkplaatsen in het kader van programma’s voor beschermde arbeid indien
      de meerderheid van de betrokken werknemers personen met een handicap zijn die wegens de aard of de ernst van hun
      handicaps geen beroepsactiviteit in normale omstandigheden kunnen uitvoeren.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.82
  - number: 2.82.2
    text: De aankondiging van de opdracht vermeldt een voorbehoud als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.82
  - number: 2.83.1
    text: |-
      Een aanbestedende dienst kan de inschrijvers toestaan varianten voor te stellen, indien hij voor de gunning het
      criterium van de economisch meest voordelige inschrijving hanteert.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.83
  - number: 2.83.2
    text: |-
      Een aanbestedende dienst vermeldt in de aankondiging van de overheidsopdracht of hij varianten toestaat. Een
      aanbestedende dienst staat alleen varianten toe indien hij in de aankondiging heeft vermeld dat deze zijn
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.83
  - number: 2.83.3
    text: |-
      Een aanbestedende dienst die varianten toestaat, vermeldt in de aanbestedingsstukken aan welke eisen deze varianten
      ten minste voldoen, en hoe zij worden ingediend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.83
  - number: 2.83.4
    text: Een aanbestedende dienst neemt uitsluitend de varianten in overweging die aan de gestelde eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.83
  - number: 2.83.5
    text: |-
      Bij procedures voor het gunnen van overheidsopdrachten voor leveringen of overheidsopdrachten voor diensten wijst
      een aanbestedende dienst die varianten heeft toegestaan, een variant niet af uitsluitend omdat deze variant, indien
      deze werd gekozen, veeleer tot een overheidsopdracht voor diensten dan tot een overheidsopdracht voor leveringen,
      dan wel veeleer tot een overheidsopdracht voor leveringen dan tot een overheidsopdracht voor diensten zou leiden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.83
  - number: 2.84.1
    text: 'Een eigen verklaring is een verklaring van een ondernemer waarin deze aangeeft:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.84
  - number: 2.84.1.a
    text: of uitsluitingsgronden op hem van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.84
  - number: 2.84.1.b
    text: of hij voldoet aan de in de aankondiging of in de aanbestedingsstukken gestelde geschiktheidseisen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.84
  - number: 2.84.1.c
    text: |-
      of hij voldoet of zal voldoen aan de technische specificaties en uitvoeringsvoorwaarden die milieu en dierenwelzijn
      betreffen of die gebaseerd zijn op sociale overwegingen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.84
  - number: 2.84.1.d
    text: of en op welke wijze hij voldoet aan de selectiecriteria.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.84
  - number: 2.84.2
    text: |-
      De gegevens en inlichtingen die in een verklaring kunnen worden verlangd en het model of de modellen van die
      verklaring worden bij of krachtens algemene maatregel van bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.84
  - number: 2.85.1
    text: |-
      De aanbestedende dienst verlangt van een ondernemer dat hij bij zijn verzoek tot deelneming of zijn inschrijving
      met gebruikmaking van het daartoe vastgestelde model een eigen verklaring indient en geeft daarbij aan welke
      gegevens en inlichtingen in de eigen verklaring moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.85
  - number: 2.85.2
    text: |-
      De aanbestedende dienst verlangt niet dat een ondernemer bij zijn verzoek tot deelneming of zijn inschrijving
      gegevens en inlichtingen op andere wijze verstrekt, indien deze gegevens en inlichtingen in de eigen verklaring
      gevraagd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.85
  - number: 2.85.3
    text: |-
      De aanbestedende dienst kan een ondernemer uitsluitend verzoeken bewijsstukken bij de door hem ingediende eigen
      verklaring te voegen die geen betrekking hebben op gegevens en inlichtingen die in de eigen verklaring gevraagd
      kunnen worden, tenzij het bewijsstukken betreft die genoemd zijn in [artikel 2.93, eerste lid, onder a of b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.85
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.6.1
        afdeling: 2.3.6
  - number: 2.86.1
    text: |-
      Een aanbestedende dienst sluit een gegadigde of inschrijver jegens wie bij een onherroepelijk geworden rechterlijke
      uitspraak een veroordeling als bedoeld in het tweede lid is uitgesproken waarvan de aanbestedende dienst kennis
      heeft, uit van deelneming aan een overheidsopdracht of een aanbestedingsprocedure.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.86
  - number: 2.86.2
    text: 'Voor de toepassing van het eerste lid worden aangewezen veroordelingen ter zake van:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.86
  - number: 2.86.2.a
    text: |-
      deelneming aan een criminele organisatie in de zin van artikel 2, eerste lid, van Gemeenschappelijk Optreden
      98/733/JBZ van de Raad, (PbEG 1998, L 351);
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.86
  - number: 2.86.2.b
    text: |-
      omkoping in de zin van artikel 3 van het besluit van de Raad van 26 mei 1997 (PbEG 1997, L 195) respectievelijk
      artikel 3, eerste lid, van Gemeenschappelijk Optreden 98/742/JBZ van de Raad (PbEG 1998, L 358);
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.86
  - number: 2.86.2.c
    text: |-
      fraude in de zin van artikel 1 van de overeenkomst aangaande de bescherming van de financiële belangen van de
      Gemeenschap (PbEG 1995, C 316);
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.86
  - number: 2.86.2.d
    text: |-
      witwassen van geld in de zin van artikel 1 van [richtlijn nr. 91/308/EEG](31991L0308) van de Raad van 10 juni 1991
      tot voorkoming van het gebruik van het financiële stelsel voor het witwassen van geld (PbEG L 1991, L 166) zoals
      gewijzigd bij [richtlijn nr. 2001/97/EG](32001L0097) van het Europees Parlement en de Raad (PbEG L 2001, 344).
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.86
  - number: 2.86.3
    text: |-
      Als veroordelingen als bedoeld in het tweede lid worden in ieder geval aangemerkt veroordelingen op grond
      van [artikel 140][ref1], [177][ref2], [177a][ref3], [178][ref4], [225][ref5], [226][ref6], [227][ref7],
      [227a][ref8], [227b][ref9] of [323a][ref10], [328ter, tweede lid][ref11], [420bis][ref12], [420ter][ref13] of
      [420quater van het Wetboek van Strafrecht][ref14].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel140
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel177
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel177a
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel178
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel225
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel226
      [ref7]: https://wetten.overheid.nl/BWBR0001854#Artikel227
      [ref8]: https://wetten.overheid.nl/BWBR0001854#Artikel227a
      [ref9]: https://wetten.overheid.nl/BWBR0001854#Artikel227b
      [ref10]: https://wetten.overheid.nl/BWBR0001854#Artikel323a
      [ref11]: https://wetten.overheid.nl/BWBR0001854#Artikel328ter
      [ref12]: https://wetten.overheid.nl/BWBR0001854#Artikel420bis
      [ref13]: https://wetten.overheid.nl/BWBR0001854#Artikel420ter
      [ref14]: https://wetten.overheid.nl/BWBR0001854#Artikel420quater
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.86
