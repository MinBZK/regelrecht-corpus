      jaar.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.3
  - number: 3.4.1
    text: |-
      Het bepaalde bij of krachtens deel 3 van deze wet is van toepassing op het plaatsen van speciale-sectoropdrachten
      met het oog op het beschikbaar stellen of exploiteren van netten, bestemd voor de openbare dienstverlening op het
      gebied van vervoer per trein, automatische systemen, tram, trolleybus, autobus of kabel onder door of vanwege de
      staat, een provincie of een gemeente gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.4
  - number: 3.4.2
    text: |-
      In afwijking van het eerste lid is het bepaalde bij of krachtens deel 3 van deze wet niet van toepassing op
      speciale-sectoropdrachten met het oog op de verzorging van openbare busdiensten indien die busdiensten, al dan niet
      in een bepaald geografisch gebied, ook door anderen dan het speciale-sectorbedrijf en onder dezelfde voorwaarden
      kunnen worden verzorgd.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.4
  - number: 3.5.1
    text: |-
      Het bepaalde bij of krachtens deel 3 van deze wet is van toepassing op het plaatsen van speciale-sectoropdrachten
      met het oog op het verlenen van postdiensten.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.5
  - number: 3.5.2
    text: Het bij of krachtens deel 3 van deze wet bepaalde is tevens van toepassing op
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.5
  - number: 3.5.2.a
    text: het beheer van postdiensten,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.5
  - number: 3.5.2.b
    text: |-
      diensten met een meerwaarde die verband houden met elektronische post en die volledig langs elektronische
      weg plaatsvinden, met inbegrip van de beveiligde doorgifte van gecodeerde documenten langs elektronische weg,
      adresbeheerdiensten en het doorzenden van geregistreerde elektronische post,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.5
  - number: 3.5.2.c
    text: diensten die betrekking hebben op postdoorzending,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.5
  - number: 3.5.2.d
    text: financiële diensten,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.5
  - number: 3.5.2.e
    text: filateliediensten en
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.5
  - number: 3.5.2.f
    text: logistieke diensten,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.5
  - number: '3.6'
    text: |-
      Het bepaalde bij of krachtens deel 3 van deze wet is van toepassing op het plaatsen van speciale-sectoropdrachten
      met het oog op activiteiten met betrekking tot de exploitatie van een geografisch gebied met het doel aan lucht-,
      zee- of riviervervoerders luchthaven-, zeehaven-, binnenhaven- of andere aanlandingsfaciliteiten beschikbaar te
      stellen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.6
  - number: 3.7.1
    text: |-
      Indien een speciale-sectorbedrijf een speciale-sectoropdracht plaatst met het oog op verschillende
      activiteiten, waaronder andere activiteiten dan die welke vallen onder het toepassingsbereik van de
      [artikelen 3.1 tot en met 3.6][ref1], geldt het bij of krachtens deel 3 van deze wet bepaalde voor speciale-
      sectoropdrachten indien de opdracht in hoofdzaak wordt geplaatst ten behoeve van het verrichten van een activiteit
      als bedoeld in die artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.1'
        afdeling: 3.1.1
  - number: 3.7.2
    text: |-
      Indien het niet mogelijk is objectief te bepalen dat een opdracht in hoofdzaak wordt geplaatst ten behoeve van het
      verrichten van activiteiten als bedoeld in de [artikelen 3.1 tot en met 3.6][ref1], wordt de opdracht geplaatst:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.1'
        afdeling: 3.1.1
  - number: 3.7.2.a
    text: |-
      overeenkomstig het bij of krachtens [deel 2][ref1] van deze wet bepaalde voor overheidsopdrachten indien de
      opdracht tevens een overheidsopdracht is;


      [ref1]: https://wetten.overheid.nl/BWBR0032203
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0032203
  - number: 3.7.2.b
    text: |-
      overeenkomstig het bij of krachtens deel 3 van deze wet bepaalde voor speciale-sectoropdrachten indien de opdracht
      niet tevens een overheidsopdracht is.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.7
  - number: 3.8.1
    text: |-
      Het bepaalde bij of krachtens deel 3 van deze wet is van toepassing op het plaatsen van speciale-sectoropdrachten
      waarvan de geraamde waarde, exclusief omzetbelasting, gelijk is aan of hoger is dan:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.8
  - number: 3.8.1.a
    text: |-
      het bedrag, genoemd in artikel 16, onderdeel b, van [richtlijn nr. 2004/17/EG](32004L0017) voor speciale-
      sectoropdrachten voor werken;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.8
  - number: 3.8.1.b
    text: |-
      het bedrag, genoemd in artikel 16, onderdeel a, van [richtlijn nr. 2004/17/EG](32004L0017) voor speciale-
      sectoropdrachten voor leveringen en voor diensten.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.8
  - number: 3.8.2
    text: |-
      Een wijziging van de bedragen, genoemd in artikel 16 van [richtlijn nr. 2004/17/EG](32004L0017), gaat voor de
      toepassing van dit artikel gelden met ingang van de dag waarophet desbetreffende besluitvan de Europese Commissie
      in werking treedt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.8
  - number: 3.8.3
    text: Onze Minister doet mededeling in de Staatscourant van een besluit als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.8
  - number: 3.9.1
    text: |-
      Het bepaalde bij of krachtens deel 3 van deze wet is van toepassing op door speciale-sectorbedrijven uit te
      schrijven prijsvragen voor diensten waarvan de geraamde waarde van de opdracht of het totale bedrag aan prijzengeld
      en betalingen aan deelnemers gelijk is aan of hoger is dan het in artikel 61 van [richtlijn nr. 2004/17/EG]
      (32004L0017) genoemde bedrag, exclusief omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.9
  - number: 3.9.2
    text: |-
      Een wijziging van het bedrag, genoemd in artikel 61 van [richtlijn nr. 2004/17/EG](32004L0017), gaat voor de
      toepassing van dit artikel gelden met ingang van de dag waarop het desbetreffende besluit van de Europese Commissie
      in werking treedt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.9
  - number: 3.9.3
    text: Onze Minister doet mededeling in de Staatscourant van een besluit als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.9
  - number: 3.10.1
    text: |-
      Een speciale-sectorbedrijf kan via een aankoopcentrale een opdracht plaatsen mits de aankoopcentrale het bepaalde
      bij of krachtens deel 3 van deze wet voor speciale-sectorbedrijven met betrekking tot die opdracht naleeft.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.10
  - number: 3.10.2
    text: |-
      In het in het eerste lid bedoelde geval heeft het desbetreffende speciale-sectorbedrijf voldaan aan de voor hem
      geldende verplichtingen op grond van deel 3 van deze wet.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.10
  - number: 3.11.1
    text: |-
      Het speciale-sectorbedrijf raamt de waarde van de voorgenomen speciale-sectoropdracht of prijsvraag overeenkomstig
      de [artikelen 3.12 tot en met 3.19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.1'
        paragraaf: 3.1.3.2
        afdeling: 3.1.3
  - number: 3.11.2
    text: |-
      [Artikel 2.14][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.2.1
        afdeling: 2.1.2
  - number: 3.12.1
    text: |-
      Het speciale-sectorbedrijf baseert de berekening van de geraamde waarde van een speciale-sectoropdracht op het
      totale bedrag, exclusief omzetbelasting, met inbegrip van opties en verlengingen van het contract.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.12
  - number: 3.12.2
    text: |-
      Het speciale-sectorbedrijf gaat bij de berekening van de waarde van een raamovereenkomst uit van de geraamde waarde
      van alle voor de duur van de raamovereenkomst voorgenomen speciale-sectoropdrachten.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.12
  - number: 3.12.3
    text: |-
      Indien het speciale-sectorbedrijf voorziet in prijzengeld of betalingen aan gegadigden of inschrijvers, berekent
      hij deze door in de geraamde waarde van de opdracht.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.12
  - number: 3.13.1
    text: |-
      [Artikel 2.16][ref1] is van overeenkomstige toepassing op de raming van de waarde van een speciale-sectoropdracht
      voor werken.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.2.2
        afdeling: 2.1.2
  - number: 3.13.2
    text: |-
      Het speciale-sectorbedrijf telt de waarde van leveringen of diensten die niet noodzakelijk zijn voor de uitvoering
      van een speciale-sectoropdracht voor werken niet bij de waarde van de opdracht op met de intentie om die leveringen
      of diensten aan de toepassing van deze wet te onttrekken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.13
  - number: '3.14'
    text: |-
      [Artikel 2.17][ref1] is van overeenkomstige toepassing op de raming van de waarde van een speciale-sectoropdracht
      voor diensten als bedoeld in dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.2.2
        afdeling: 2.1.2
  - number: 3.15.1
    text: |-
      Indien een voorgenomen werk of een voorgenomen aankoop van diensten kan leiden tot speciale-sectoropdrachten die
      gelijktijdig in afzonderlijke percelen worden geplaatst, neemt het speciale-sectorbedrijf de geraamde totale waarde
      van deze percelen als grondslag.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.15
  - number: 3.15.2
    text: |-
      Indien de samengestelde waarde van de percelen, bedoeld in het eerste lid, gelijk is aan of groter is dan het in
      [artikel 3.8, eerste lid, onderdelen a of b][ref1], bedoelde bedrag, is het bij of krachtens deel 3 van deze wet
      bepaalde van toepassing op de plaatsing van elk perceel.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.1'
        afdeling: 3.1.2
  - number: 3.15.3
    text: 'Het tweede lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.15
  - number: 3.15.3.a
    text: opdrachten voor werken waarvan de geraamde waarde niet meer bedraagt dan € 1 000 000, exclusief omzetbelasting,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.15
  - number: 3.15.3.b
    text: opdrachten voor diensten waarvan de geraamde waarde niet meer bedraagt dan € 80 000, exclusief omzetbelasting,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.15
  - number: 3.16.1
    text: |-
      Indien een voorgenomen verkrijging van homogene leveringen kan leiden tot speciale-sectoropdrachten die
      gelijktijdig in afzonderlijke percelen worden geplaatst, neemt het speciale-sectorbedrijf de geraamde totale waarde
      van deze percelen als grondslag voor de raming.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.16
  - number: 3.16.2
    text: |-
      Indien de samengetelde waarde van de percelen, bedoeld in het eerste lid, gelijk is aan of groter is dan het in
      [artikel 3.8, eerste lid, onderdelen a of b][ref1], bedoelde bedrag, past het speciale-sectorbedrijf het bij of
      krachtens deel 3 van deze wet bepaalde toe op de plaatsing van elk perceel.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.1'
        afdeling: 3.1.2
  - number: 3.16.3
    text: |-
      Het tweede lid is niet van toepassing op percelen waarvan de geraamde waarde niet meer bedraagt dan € 80 000,
      exclusief omzetbelasting, mits de totale geraamde waarde van die percelen gezamenlijk niet meer bedraagt dan 20%
      van de totale waarde van alle percelen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.16
  - number: '3.17'
    text: |-
      Het speciale-sectorbedrijf raamt de waarde van speciale-sectoropdrachten voor leveringen die betrekking
      hebben op leasing, huurkoop of huurkoop van producten met overeenkomstige toepassing van de in
      [artikel 2.20, onderdelen a en b][ref1], bedoelde grondslag.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.2.2
        afdeling: 2.1.2
  - number: '3.18'
    text: |-
      Het speciale-sectorbedrijf raamt de waarde van speciale-sectoropdrachten voor leveringen of voor diensten die
      met een zekere regelmaat worden verricht of die het speciale-sectorbedrijf gedurende een bepaalde periode wil
      hernieuwen, met overeenkomstige toepassing van de in [artikel 2.21, onderdelen a of b][ref1], bedoelde grondslag.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.2.2
        afdeling: 2.1.2
  - number: '3.19'
    text: |-
      Het speciale-sectorbedrijf raamt de waarde van speciale-sectoropdrachten die zowel leveringen als diensten
      betreffen op basis van de totale waarde van de leveringen en diensten gezamenlijk, ongeacht het respectieve aandeel
      ervan, en met de waarde van plaatsing en installatie daarin begrepen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.19
  - number: 3.20.1
    text: |-
      De [artikelen 3.12 tot en met 3.19][ref1] zijn van overeenkomstige toepassing op de raming van de waarde van een
      dynamisch aankoopsysteem of een uit te reiken prijs.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.1'
        paragraaf: 3.1.3.2
        afdeling: 3.1.3
  - number: 3.20.2
    text: 'In aanvulling op het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.20
  - number: 3.20.2.a
    text: |-
      gaat het speciale-sectorbedrijf bij de berekening van de waarde van een dynamisch aankoopsysteem uit van
      de geraamde waarde van alle voor de totale duur van het dynamisch aankoopsysteem voorgenomen speciale-
      sectoropdrachten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.20
  - number: 3.20.2.b
    text: |-
      berekent het speciale-sectorbedrijf dat voorziet in prijzengeld of betalingen aan gegadigden of inschrijvers deze
      door in de geraamde waarde;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.20
  - number: 3.20.2.c
    text: |-
      wordt, indien het speciale-sectorbedrijf in de voorschriften van de prijsvraag niet uitsluit dat gunning van de
      speciale-sectoropdracht geschiedt volgens de onderhandelingsprocedure zonder aankondiging, bij de bepaling van
      het totale bedrag van het prijzengeld of de vergoeding aan de deelnemers de waarde meegerekend van de speciale-
      sectoropdracht die later kan worden gegund.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.20
  - number: 3.21.1
    text: |-
      De [artikelen 3.1 tot en met 3.6][ref1] zijn niet van toepassing op activiteiten als bedoeld in die artikelen:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.1'
        afdeling: 3.1.1
  - number: 3.21.1.a
    text: |-
      die van het toepassingsgebied van [richtlijn nr. 2004/17/EG](32004L0017) zijn uitgezonderd op grond van een besluit
      van de Europese Commissie als bedoeld in artikel 30, vierde lid, van die richtlijn, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.21
  - number: 3.21.1.b
    text: |-
      ten aanzien van welke de Europese Commissie binnen de termijn, genoemd in artikel 30, zesde lid, van [richtlijn
      nr. 2004/17/EG](32004L0017) geen beslissing over de toepassing van artikel 30, eerste lid, van die richtlijn heeft
      genomen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.21
  - number: 3.21.2
    text: |-
      Een speciale-sectorbedrijf kan de Europese Commissie verzoeken te bepalen dat artikel 30, eerste lid, van
      [richtlijn nr. 2004/17/EG](32004L0017) van toepassing is. Het speciale-sectorbedrijf doet mededeling van het
      verzoek aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.21
  - number: 3.21.3
    text: |-
      Onze Minister doet mededeling in de Staatscourant van een besluit als bedoeld in het eerste lid, onderdeel a, dan
      wel van het niet nemen van een besluit binnen de in het eerste lid, onderdeel b, bedoelde termijn.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.21
  - number: 3.22.1
    text: |-
      In afwijking van de [artikelen 3.1 tot en met 3.6][ref1] is het bij of krachtens deel 3 van deze wet bepaalde niet
      van toepassing op speciale-sectoropdrachten en prijsvragen voor diensten:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.1'
        afdeling: 3.1.1
  - number: 3.22.1.a
    text: |-
      die geheim zijn verklaard of waarvan de uitvoering overeenkomstig de geldende wettelijke en bestuursrechtelijke
      bepalingen met bijzondere veiligheidsmaatregelen gepaard moet gaan dan wel indien de bescherming van de wezenlijke
      belangen van het land zulks vereist;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.22
  - number: 3.22.1.b
    text: 'waarvoor andere procedurevoorschriften gelden en die worden geplaatst:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.22
  - number: 3.22.1.b.1°
    text: |-
      op grond van een internationale overeenkomst, gesloten tussen het Koninkrijk der Nederlanden en een of meer derde
      landen, overeenkomstig het Verdrag betreffende de werking van de Europese Unie, betreffende werken, leveringen,
      diensten of prijsvragen die bestemd zijn voor gemeenschappelijke verwezenlijking of exploitatie van een project
      door de ondertekenende staten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.22
  - number: 3.22.1.b.2°
    text: |-
      op grond van een in verband met de legering van strijdkrachten gesloten internationale overeenkomst betreffende
      ondernemingen in Nederland of in een derde land;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.22
  - number: 3.22.1.c
    text: volgens de specifieke procedure van een internationale organisatie.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.22
  - number: 3.22.2
    text: |-
      Een speciale-sectorbedrijf brengt een internationale overeenkomst als bedoeld in het eerste lid, onderdeel b, onder
      1°, ter kennis van de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.22
  - number: 3.23.1
    text: |-
      In afwijking van de [artikelen 3.1 tot en met 3.6][ref1] is het bij of krachtens deel 3 van deze wet bepaalde niet
      van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.1'
        afdeling: 3.1.1
  - number: 3.23.1.a
    text: |-
      speciale-sectoropdrachten die worden geplaatst voor wederverkoop of verhuur aan derden, indien het speciale-
      sectorbedrijf niet een bijzonder of uitsluitend recht bezit om het voorwerp van de opdracht te verkopen of te
      verhuren en het anderen vrijstaat dit voorwerp te verkopen of te verhuren op dezelfde voorwaarden als het speciale-
      sectorbedrijf;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.23
  - number: 3.23.1.b
    text: |-
      speciale-sectoropdrachten en prijsvragen die worden geplaatst onderscheidenlijk uitgeschreven buiten het
      grondgebied van de Europese Unie in omstandigheden waarbij geen sprake is van fysieke exploitatie van een net of
      van fysieke exploitatie van een geografisch gebied binnen de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.23
  - number: 3.23.2
    text: |-
      Het speciale-sectorbedrijf doet de Europese Commissie op haar verzoek mededeling van de categorieën van producten
      en activiteiten die het ingevolge het eerste lid, onderdeel a, of de opdrachten en prijsvragen die het ingevolge
      het eerste lid, onderdeel b, als uitgesloten beschouwt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.23
  - number: 3.23.3
    text: |-
      Het speciale-sectorbedrijf wijst de Europese Commissie bij de mededeling, bedoeld in het tweede lid, op alle
      gevoelige commerciële informatie en verzoekt de Europese Commissie daarmee rekening te houden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.23
  - number: 3.24.1
    text: |-
      Het bij of krachtens deel 3 van deze wet bepaalde is niet van toepassing op het plaatsen van speciale-
      sectoropdrachten:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.24
  - number: 3.24.1.a
    text: door het speciale-sectorbedrijf bij een met dat bedrijf verbonden onderneming, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.24
  - number: 3.24.1.b
    text: |-
      door een gemeenschappelijke onderneming, uitsluitend bestaande uit speciale-sectorbedrijven, bij een onderneming
      die met een van de betrokken speciale-sectorbedrijven is verbonden,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.24
  - number: 3.24.2
    text: |-
      Indien in verband met de datum van oprichting of de aanvang van de bedrijfsactiviteiten van de verbonden
      onderneming geen gegevens beschikbaar zijn omtrent de omzet in de drie jaren, voorafgaande aan het plaatsen van de
      opdracht, voldoet de verbonden onderneming aan de in het eerste lid bedoelde eis indien zij aannemelijk kan maken
      dat die omzet in de komende periode wordt behaald.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.24
  - number: 3.24.3
    text: |-
      Indien dezelfde of soortgelijke werken, leveringen of diensten door verschillende met het speciale-sectorbedrijf
      verbonden ondernemingen worden verricht, wordt het in het eerste lid bedoelde percentage berekend op grond van de
      totale omzet van deze verbonden ondernemingen, afkomstig van die werken, leveringen of diensten.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.24
  - number: 3.24.4
    text: 'Voor de toepassing van dit artikel wordt onder verbonden onderneming verstaan:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.24
  - number: 3.24.4.a
    text: |-
      een onderneming waarvan de jaarrekening is geconsolideerd met die van het speciale-sectorbedrijf overeenkomstig
      de voorschriften van [richtlijn nr. 83/349/EEG](31983L0349) van de Raad van de Europese Gemeenschappen van 13
      juni 1983 op de grondslag van artikel 54, derde lid, onder g, van het Verdrag betreffende de geconsolideerde
      jaarrekening (PbEG L 3.17), of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.24
  - number: 3.24.4.b
    text: 'ingeval het speciale-sectorbedrijf niet onder de in onderdeel a bedoelde richtlijn valt, een onderneming:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.24
  - number: 3.24.4.b.1°
    text: waarop het speciale-sectorbedrijf direct of indirect overheersende invloed kan uitoefenen,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.24
  - number: 3.24.4.b.2°
    text: die een overheersende invloed op een speciale-sectorbedrijf kan uitoefenen, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.24
  - number: 3.24.4.b.3°
    text: |-
      die, tezamen met het speciale-sectorbedrijf, is onderworpen aan de overheersende invloed van een andere onderneming
      uit hoofde van eigendom, financiële deelneming of op haar van toepassing zijnde voorschriften.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.24
  - number: 3.24.5
    text: |-
      Overheersende invloed als bedoeld in het vierde lid wordt vermoed indien een speciale-sectorbedrijf, al dan niet
      rechtstreeks, ten aanzien van die onderneming:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.24
  - number: 3.24.5.a
    text: de meerderheid van het geplaatste kapitaal bezit,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.24
  - number: 3.24.5.b
    text: over de meerderheid van de stemmen beschikt die aan de door de onderneming uitgegeven aandelen zijn verbonden, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.24
  - number: 3.24.5.c
    text: |-
      meer dan de helft van de leden van het bestuurs-, leidinggevend of toezichthoudend orgaan van de onderneming kan
      benoemen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.24
  - number: 3.25.1
    text: |-
      Het bij of krachtens deel 3 van deze wet bepaalde is niet van toepassing op het plaatsen van speciale-
      sectoropdrachten:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.25
  - number: 3.25.1.a
    text: |-
      door een gemeenschappelijke onderneming, uitsluitend bestaande uit speciale-sectorbedrijven, bij een van die
      speciale-sectorbedrijven;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.25
  - number: 3.25.1.b
    text: |-
      door een speciale-sectorbedrijf bij een gemeenschappelijke onderneming waarvan zij zelf deel uitmaakt, mits die
      gemeenschappelijke onderneming is opgericht om de desbetreffende activiteit uit te oefenen gedurende ten minste
      drie jaar en de oprichtingsakte van die onderneming bepaalt dat de speciale-sectorbedrijven waaruit zij bestaat,
      ten minste drie jaar deel zullen uitmaken van die onderneming.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.25
  - number: '3.26'
    text: |-
      Het speciale-sectorbedrijf doet de Europese Commissie op haar verzoek mededeling van de toepassing van de
      [artikelen 3.24][ref1] en [3.25][ref2] met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.1'
        afdeling: 3.1.4
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.1'
        afdeling: 3.1.4
  - number: 3.26.a
    text: de namen van de betrokken ondernemingen of gemeenschappelijke ondernemingen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.26
  - number: 3.26.b
    text: de aard en de waarde van de desbetreffende speciale-sectoropdrachten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.26
  - number: 3.26.c
    text: |-
      de gegevens die de Europese Commissie nodig acht voor het bewijs dat de betrekkingen tussen het speciale-
      sectorbedrijf en de onderneming of de gemeenschappelijke onderneming bij welke de opdrachten worden geplaatst, aan
      de eisen, bedoeld in de [artikelen 3.24][ref1] en [3.25][ref2], voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.1'
        afdeling: 3.1.4
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.1'
        afdeling: 3.1.4
  - number: '3.27'
    text: |-
      Het bij of krachtens deel 3 van deze wet bepaalde is niet van toepassing op speciale-sectoropdrachten voor
      diensten:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.27
  - number: 3.27.a
    text: |-
      betreffende de verwerving of huur, ongeacht de financiële modaliteiten ervan, van grond, bestaande gebouwen of
      andere onroerende zaken of betreffende rechten hierop, met uitzondering van overeenkomsten met betrekking tot
      financiële diensten die voorafgaand aan, gelijktijdig met of als vervolg op het koop- of huurcontract worden
      afgesloten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.27
  - number: 3.27.b
    text: van arbitrage en bemiddeling;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.27
  - number: 3.27.c
    text: |-
      op financieel gebied betreffende de uitgifte, aankoop, verkoop of overdracht van effecten als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] of andere financiële instrumenten en door de centrale
      banken verleende diensten;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 3.27.d
    text: inzake arbeidsovereenkomsten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.27
  - number: 3.27.e
    text: |-
      voor onderzoek en ontwikkeling, met uitzondering van die waarvan de resultaten in hun geheel aan het
      speciale-sectorbedrijf toekomen voor gebruik ervan bij de uitoefening van zijn eigen werkzaamheden, mits de
      dienstverrichting geheel door het speciale-sectorbedrijf wordt betaald.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.27
  - number: '3.28'
    text: |-
      Het bij of krachtens deel 3 van deze wet bepaalde is niet van toepassing op speciale-sectoropdrachten voor diensten
      die door een speciale-sectorbedrijf worden gegund aan een ander speciale-sectorbedrijf of een samenwerkingsverband
      van speciale-sectorbedrijven op basis van een uitsluitend recht dat aan dat andere speciale-sectorbedrijf of
      het desbetreffende samenwerkingsverband is verleend, mits dit uitsluitend recht verenigbaar is met het Verdrag
      betreffende de werking van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.28
  - number: '3.29'
    text: |-
      Het bij of krachtens deel 3 van deze wet bepaalde is niet van toepassing op het plaatsen van speciale-
      sectoropdrachten voor de aankoop van water door een speciale-sectorbedrijf dat een activiteit als bedoeld in
      [artikel 3.3][ref1] uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.29
    references:
