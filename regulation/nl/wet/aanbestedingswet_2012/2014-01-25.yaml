      productie, het vervoer of de distributie van drinkwater;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.3
  - number: 3.3.1.b
    text: de drinkwatertoevoer naar netten als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.3
  - number: 3.3.2
    text: |-
      Het bepaalde bij of krachtens deel 3 van deze wet is tevens van toepassing op opdrachten of prijsvragen die worden
      geplaatst onderscheidenlijk uitgeschreven door een speciale-sectorbedrijf dat een activiteit als bedoeld in het
      eerste lid uitoefent en die verband houden met:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.3
  - number: 3.3.2.a
    text: |-
