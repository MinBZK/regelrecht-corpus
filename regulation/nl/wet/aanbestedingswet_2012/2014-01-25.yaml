  - number: 1.10.1
    text: |-
      Een aanbestedende dienst of een speciale-sectorbedrijf stelt bij de voorbereiding van en het tot stand brengen
      van een overheidsopdracht of een speciale-sectoropdracht, een concessieovereenkomst voor openbare werken of voor
      diensten of het uitschrijven van een prijsvraag uitsluitend eisen, voorwaarden en criteria aan de inschrijvers en
      de inschrijvingen die in een redelijke verhouding staan tot het voorwerp van de opdracht.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.10
  - number: 1.10.2
    text: |-
      Bij de toepassing van het eerste lid slaat de aanbestedende dienst of het speciale-sectorbedrijf, voor zover van
      toepassing, in ieder geval acht op:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.10
  - number: 1.10.2.a
    text: het al of niet samenvoegen van opdrachten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.10
  - number: 1.10.2.b
    text: de uitsluitingsgronden;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.10
  - number: 1.10.2.c
    text: de inhoud van de geschiktheidseisen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.10
  - number: 1.10.2.d
    text: het aantal te stellen geschiktheidseisen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.10
  - number: 1.10.2.e
    text: de te stellen termijnen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.10
  - number: 1.10.2.f
    text: de gunningscriteria;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.10
  - number: 1.10.2.g
    text: een vergoeding voor hoge kosten van een inschrijving;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.10
  - number: 1.10.2.h
    text: de voorwaarden van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.10
  - number: 1.10.3
    text: |-
      Bij algemene maatregel van bestuur wordt een richtsnoer aangewezen waarin voorschriften zijn vervat met betrekking
      tot de wijze waarop door bij die algemene maatregel van bestuur aan te wijzen aanbestedende diensten uitvoering
      wordt gegeven aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.10
  - number: 1.10.4
    text: |-
      De aanbestedende dienst past de in het derde lid bedoelde voorschriften toe of motiveert een afwijking van een of
      meer van die voorschriften in de aanbestedingsstukken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.10
  - number: 1.10.5
    text: |-
      De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. De voordracht wordt
      gedaan door Onze Minister van Economische Zaken in overeenstemming met Onze Minister of Ministers wie het mede
      aangaat.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.10
  - number: '1.11'
    text: |-
      De bepalingen in deze afdeling gelden voor aanbestedende diensten en speciale-sectorbedrijven waarop
      [artikel 1.7][ref1] niet van toepassing is en die, voordat zij een schriftelijke overeenkomst onder bezwarende
      titel sluiten tot het verrichten van werken, leveringen of diensten, met betrekking tot die overeenkomst uit eigen
      beweging een aankondiging hebben bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel1
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.11
    references:
