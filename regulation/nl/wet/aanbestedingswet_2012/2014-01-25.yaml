  - number: '4.32'
    text: |-
      In afwijking van [artikel 4.7, eerste lid, onderdelen c en d][ref1], betrekt Onze Minister van Veiligheid en
      Justitie geen gegevens inzake onherroepelijke beschikkingen wegens overtreding van de [Mededingingswet][ref2]
      als bedoeld in artikel 4.7, eerste lid, onderdeel c, of wegens overtreding van artikel 101 of artikel 102 van het
      Verdrag betreffende de werking van de Europese Unie als bedoeld in artikel 4.7, eerste lid, onderdeel d, bij zijn
      beoordeling van de aanvraag om een gedragsverklaring aanbesteden van een rechtspersoon die werkzaam is op het
      terrein van de bouwnijverheid indien;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.32
    references:
