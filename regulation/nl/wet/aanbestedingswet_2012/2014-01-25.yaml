      water groter is dan 20 % van de totale hoeveelheid water die door middel van deze projecten, bevloeiing of drainage
      beschikbaar komt of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.3
  - number: 3.3.2.b
    text: met de afvoer of behandeling van afvalwater.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.3
  - number: 3.3.3
    text: |-
      De toevoer van drinkwater naar netten bestemd voor openbare dienstverlening door een overheidsbedrijf dan wel een
      bedrijf of instelling waaraan door de staat, een provincie, een gemeente, een waterschap of een publiekrechtelijke
      instelling bij bijzonder recht of een uitsluitend recht is verleend, valt niet onder de activiteiten, bedoeld in
      het eerste lid, onderdeel b, indien:
