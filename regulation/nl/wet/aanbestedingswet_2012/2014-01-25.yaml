  - number: 1.15.1
    text: Een aanbestedende dienst of speciale sectorbedrijf behandelt de inschrijvers op gelijke wijze.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.15
  - number: 1.15.2
    text: |-
      De aanbestedende dienst of het speciale sectorbedrijf, bedoeld in het eerste lid, deelt aan alle inschrijvers de
      gunningsbeslissing met de relevante redenen voor deze beslissing mee.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.15
  - number: 1.16.1
    text: |-
      Een aanbestedende dienst of een speciale-sectorbedrijf stelt bij de voorbereiding en het tot stand brengen van
      een overeenkomst uitsluitend eisen, voorwaarden en criteria aan de inschrijvers en de inschrijvingen die in een
      redelijke verhouding staan tot het voorwerp van de opdracht.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.16
  - number: 1.16.2
    text: |-
      Bij de toepassing van het eerste lid slaat de aanbestedende dienst of het speciale-sectorbedrijf in ieder geval
