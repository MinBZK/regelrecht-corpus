  - number: 2.86.4
    text: |-
      De aanbestedende dienst betrekt bij de toepassing van het eerste lid uitsluitend rechterlijke uitspraken die
      in de vier jaar voorafgaand aan het tijdstip van het indienen van het verzoek tot deelneming of de inschrijving
      onherroepelijk zijn geworden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.86
  - number: 2.87.1
    text: |-
      De aanbestedende dienst kan een inschrijver of gegadigde uitsluiten van deelneming aan een overheidsopdracht of een
      aanbestedingsprocedure op de volgende gronden:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.87
  - number: 2.87.1.a
    text: |-
      de inschrijver of gegadigdeverkeert in staat van faillissement of liquidatie, diens werkzaamheden zijn gestaakt,
      jegens hem geldt een surseance van betaling of een (faillissements-)akkoord, of de gegadigde of inschrijver
      verkeert in een andere vergelijkbare toestand ingevolge een soortgelijke procedure die voorkomt in de op hem van
      toepassing zijnde wet- of regelgeving;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.87
  - number: 2.87.1.b
    text: |-
      jegens de gegadigde of inschrijver is een onherroepelijk geworden rechterlijke uitspraak gedaan op grond van de op
      hem van toepassing zijnde wet- en regelgeving wegens overtreding van een voor hem relevante beroepsgedragsregel;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.87
  - number: 2.87.1.c
    text: |-
      de inschrijver of gegadigde heeft in de uitoefening van zijn beroep een ernstige fout begaan die door de
      aanbestedende dienst aannemelijk kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.87
  - number: 2.87.1.d
    text: |-
      de inschrijver of gegadigde heeft niet voldaan aan verplichtingen op grond van op hem van toepassing zijnde
      wettelijke bepalingen met betrekking tot betaling van sociale zekerheidspremies of belastingen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.87
  - number: 2.87.1.e
    text: |-
      de gegadigde of inschrijver heeft zich in ernstige mate schuldig gemaakt aan valse verklaringen bij het verstrekken
      van inlichtingen die door een aanbestedende dienst van hem waren verlangd of hij heeft die inlichtingen niet
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.87
  - number: 2.87.2
    text: |-
      De aanbestedende dienst betrekt bij de toepassing van het eerste lid, onderdeel b, uitsluitend onherroepelijke
      uitspraken die in de vier jaar voorafgaand aan het tijdstip van het indienen van het verzoek tot deelneming of
      de inschrijving onherroepelijk zijn geworden en bij de toepassing van het eerste lid, onderdeel c, uitsluitend
      ernstige fouten die zich in de vier jaar voorafgaand aan het genoemde tijdstip hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.87
  - number: '2.88'
    text: |-
      De aanbestedende dienst kan afzien van toepassing van [artikel 2.86][ref1] of [artikel 2.87][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.88
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
  - number: 2.88.a
    text: om dwingende redenen van algemeen belang;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.88
  - number: 2.88.b
    text: |-
      indien de gegadigde of inschrijver naar het oordeel van de aanbestedende dienst voldoende maatregelen heeft genomen
      om het geschonden vertrouwen te herstellen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.88
  - number: 2.88.c
    text: |-
      indien naar het oordeel van de aanbestedende dienst uitsluiting niet proportioneel is met het oog op de tijd die is
      verstreken sinds de veroordeling en gelet op het voorwerp van de opdracht.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.88
  - number: 2.89.1
    text: |-
      Een gegadigde of inschrijver kan door middel van een uittreksel uit het handelsregister, dat op het tijdstip van
      het indienen van het verzoek tot deelneming of de inschrijving niet ouder is dan zes maanden, aantonen dat de
      uitsluitingsgrond van [artikel 2.87, onderdeel a][ref1], op hem niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.89
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
  - number: 2.89.2
    text: |-
      Een gegadigde of inschrijver kan door middel van een gedragsverklaring aanbesteden, die op het tijdstip van
      het indienen van het verzoek tot deelneming of de inschrijving niet ouder is dan twee jaar, aantonen dat de
      uitsluitingsgronden, bedoeld in de [artikelen 2.86][ref1] en [2.87, onderdelen b en c][ref2], voor zover het een
      onherroepelijke veroordeling of een onherroepelijke beschikking wegens overtreding van mededingingsregels betreft,
      op hem niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.89
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
  - number: 2.89.3
    text: |-
      Een gegadigde of inschrijver kan door middel van een verklaring van de belastingdienst, die op het tijdstip van
      het indienen van het verzoek tot deelneming of de inschrijving, niet ouder is dan zes maanden, aantonen dat de
      uitsluitingsgrond, bedoeld in [artikel 2.87, onderdeel d][ref1], niet op hem van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.89
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
  - number: 2.89.4
    text: |-
      Een aanbestedende dienst aan welke een gegadigde of inschrijvergegevens overlegt ten bewijze dat de
      uitsluitingsgronden, bedoeld in [artikel 2.86][ref1] of [artikel 2.87][ref2], niet op hem van toepassing zijn,
      aanvaardt ook gegevens en bescheiden uit een andere lidstaat die een gelijkwaardig doel dienen of waaruit blijkt
      dat de uitsluitingsgrond niet op hem van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.89
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
  - number: 2.90.1
    text: Een aanbestedende dienst kan geschiktheidseisen stellen aan gegadigden en inschrijvers.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.90
  - number: 2.90.2
    text: 'De geschiktheidseisen, bedoeld in het eerste lid, kunnen betreffen:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.90
  - number: 2.90.2.a
    text: de financiële en economische draagkracht;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.90
  - number: 2.90.2.b
    text: technische bekwaamheid en beroepsbekwaamheid;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.90
  - number: 2.90.2.c
    text: beroepsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.90
  - number: 2.90.3
    text: |-
      Indien de aanbestedende dienst geschiktheidseisen als bedoeld in het tweede lid, onder a, stelt, hebben deze
      eisen geen betrekking op de hoogte van de totale omzet en de omzet van de bedrijfsactiviteit die het voorwerp
      van de overheidsopdracht is, tenzij de aanbestedende dienst dit met zwaarwegende argumenten motiveert in de
      aanbestedingsstukken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.90
  - number: 2.90.4
    text: |-
      Indien de geschiktheidseisen als bedoeld in het tweede lid, onder a, betrekking hebben op de hoogte van de totale
      omzet en de omzet van de bedrijfsactiviteit die het voorwerp van de overheidsopdracht is, is die eis niet hoger
      dan:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.90
  - number: 2.90.4.a
    text: driemaal de geraamde waarde van de opdracht;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.90
  - number: 2.90.4.b
    text: |-
      indien de opdracht in percelen is verdeeld, driemaal de waarde van een perceel of een cluster van percelen dat
      gelijktijdig moet worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.90
  - number: 2.90.4.c
    text: |-
      indien het een opdracht op grond van een raamovereenkomst betreft, driemaal de waarde van de specifieke opdrachten,
      die gelijktijdig moeten worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.90
  - number: 2.90.4.d
    text: |-
      indien het een opdracht op grond van een raamovereenkomst betreft, waarvan de waarde van de specifieke opdrachten
      niet bekend is, driemaal de waarde van de raamovereenkomst.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.90
  - number: 2.90.5
    text: |-
      Een aanbestedende dienst stelt bij de voorbereiding en het tot stand brengen van een overeenkomst uitsluitend
      eisen aan de inschrijver en de inschrijving die verband houden met en die in een redelijke verhouding staan tot het
      voorwerp van de opdracht.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.90
  - number: 2.91.1
    text: |-
      Een ondernemer kan zijn financiële en economische draagkracht in ieder geval aantonen door een of meer van de
      volgende middelen:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.91
  - number: 2.91.1.a
    text: passende bankverklaringen of een bewijs van een verzekering tegen beroepsrisico’s,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.91
  - number: 2.91.1.b
    text: |-
      overlegging van balansen of van balansuittreksels, indien de wetgeving van het land waar de ondernemer is
      gevestigd, de bekendmaking van balansen voorschrijft, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.91
  - number: 2.91.1.c
    text: |-
      een verklaring betreffende de totale omzet en de omzet van de bedrijfsactiviteit die het voorwerp van de
      overheidsopdracht is, over ten hoogste de laatste drie beschikbare boekjaren, afhankelijk van de oprichtingsdatum
      van de onderneming of van de datum waarop de ondernemer met zijn bedrijvigheid is begonnen, voor zover de betrokken
      omzetcijfers beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.91
  - number: 2.91.2
    text: |-
      Een aanbestedende dienst geeft in de aankondiging van de overheidsopdracht of in de uitnodiging tot inschrijving
      aan welke van de in het eerste lid bedoelde gegevens en welke andere bewijsstukken overgelegd dienen te worden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.91
  - number: 2.91.3
    text: |-
      Indien de ondernemer om gegronde redenen niet in staat is de door de aanbestedende dienst gevraagde bewijsstukken
      over te leggen, kan hij zijn economische en financiële draagkracht aantonen met andere bescheiden die de
      aanbestedende dienst geschikt acht.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.91
  - number: 2.92.1
    text: |-
      Een ondernemer kan zich voor een bepaalde overheidsopdrachtberoepen op de financiële en economischedraagkracht
      van andere natuurlijke personen of rechtspersonen, ongeacht de juridische aard van zijn banden met die natuurlijke
      personen of rechtspersonen. Een ondernemer toont in dat geval bij de aanbestedende dienst aan dat hij daadwerkelijk
      kan beschikken over de voor de uitvoering van de overheidsopdracht noodzakelijke middelen van die natuurlijke
      personen of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.92
  - number: 2.92.2
    text: |-
      Onder de voorwaarden, genoemd in het eerste lid, kan een samenwerkingsverband van ondernemers zich beroepen op de
      draagkracht van de deelnemers aan het samenwerkingsverband of van andere natuurlijke personen of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.92
  - number: 2.93.1
    text: |-
      Een ondernemer toont zijn technische bekwaamheid of beroepsbekwaamheid aan op een of meer van de volgende manieren,
      afhankelijk van de aard, de hoeveelheid of omvang en het doel van de werken, leveringen of diensten:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.93
  - number: 2.93.1.a
    text: |-
      door middel van een lijst van de werken die de afgelopen vijf jaar zijn verricht, welke lijst vergezeld gaat van
      certificaten die bewijzen dat de belangrijkste werken naar behoren zijn uitgevoerd en waarin het bedrag van de
      werken, de plaats en het tijdstip waarop deze zijn uitgevoerd vermeld wordt, en waarin wordt aangegeven of de
      werken volgens de regels der kunst zijn uitgevoerd en tot een goed einde zijn gebracht en die in voorkomend geval
      door de bevoegde instantie rechtstreeks aan de aanbestedende dienst worden toegezonden;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.93
  - number: 2.93.1.b
    text: |-
      door middel van een lijst van de voornaamste leveringen of diensten die gedurende de afgelopen drie jaar werden
      verricht, met vermelding van het bedrag en de datum en van de publiek- of privaatrechtelijke instanties waarvoor
      zij bestemd waren;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.93
  - number: 2.93.1.c
    text: |-
      door middel van een opgave van de al dan niet tot de onderneming van de ondernemer behorende technici of
      technische organen, in het bijzonder van die welke belast zijn met de kwaliteitscontrole en, in het geval van
      overheidsopdrachten voor werken, van die welke de aannemer ter beschikking zullen staan om de werken uit te voeren;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.93
  - number: 2.93.1.d
    text: |-
      door middel van een beschrijving van de technische uitrusting van de leverancier of de dienstverlener, van de
      maatregelen die hij treft om de kwaliteit te waarborgen en de mogelijkheden die hij biedt ten aanzien van ontwerpen
      en onderzoek;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.93
  - number: 2.93.1.e
    text: |-
      in het geval van complexe producten of diensten of indien deze aan een bijzonder doel moeten beantwoorden, door
      middel van een controle door de aanbestedende dienst of, in diens naam, door een bevoegd officieel orgaan van
      het land waar de leverancier of de dienstverlener gevestigd is, onder voorbehoud van instemming door dit orgaan,
      welke controle betrekking heeft op de productiecapaciteit van de leverancier of op de technische capaciteit van de
      dienstverlener en, zo nodig, op diens mogelijkheden inzake ontwerpen en onderzoek en de maatregelen die hij treft
      om de kwaliteit te waarborgen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.93
  - number: 2.93.1.f
    text: |-
      door middel van de studie- en beroepsdiploma’s van de dienstverlener of de aannemer of het kaderpersoneel van de
      onderneming en in het bijzonder van degenen die met de dienstverlening of de leiding van de werken zijn belast;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.93
  - number: 2.93.1.g
    text: |-
      voor overheidsopdrachten voor werken of overheidsopdrachten voor diensten, door middel van de vermelding van de
      maatregelen inzake milieubeheer die de ondernemer kan toepassen voor de uitvoering van de overheidsopdracht;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.93
  - number: 2.93.1.h
    text: |-
      door middel van een verklaring betreffende de gemiddelde jaarlijkse personeelsbezetting van de onderneming van de
      dienstverlener of de aannemer en de omvang van het kaderpersoneel gedurende de laatste drie jaar;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.93
  - number: 2.93.1.i
    text: |-
      door middel van een verklaring omtrent de outillage, het materieel en de technische uitrusting waarover de
      dienstverlener of de aannemer voor de uitvoering van de overheidsopdracht beschikt;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.93
  - number: 2.93.1.j
    text: |-
      door middel van de omschrijving van het gedeelte van de overheidsopdracht dat de dienstverlener eventueel in
      onderaanneming wil geven;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.93
  - number: 2.93.1.k
    text: |-
      wat de te leveren producten betreft door middel van monsters, beschrijvingen of foto’s, waarvan op verzoek van
      de aanbestedende dienst de echtheid kan worden aangetoond of door middel van certificaten die door een erkende
      organisatie zijn afgegeven, waarin wordt verklaard dat duidelijk door referenties geïdentificeerde producten aan
      bepaalde specificaties of normen beantwoorden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.93
  - number: 2.93.2
    text: |-
      De leveringen en diensten, bedoeld in het eerste lid, onderdeel b, worden aangetoond in het geval van leveringen
      of diensten voor een aanbestedende dienst, door certificaten die de bevoegde autoriteit heeft afgegeven of
      medeondertekend of in het geval van leveringen of diensten voor een particuliere afnemer, door certificaten van de
      afnemer of, bij ontstentenis daarvan, door een verklaring van de ondernemer.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.93
  - number: 2.93.3
    text: |-
      Een aanbestedende dienst die als geschiktheidseis stelt dat de gegadigde eerdere opdrachten heeft verricht
      als bedoeld in het eerste lid, onderdelen a en b, vraagt op onderdelen van de opdracht naar eerder verrichte
      vergelijkbare opdrachten en niet naar eerder verrichte opdrachten die gelet op de aard, de hoeveelheid of omvang en
      het doel van de opdracht gelijk zijn.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.93
  - number: 2.94.1
    text: |-
      Een ondernemer kan zich voor bepaalde overheidsopdrachtenberoepen op de bekwaamheid van andere natuurlijke personen
      of rechtspersonen, ongeacht de juridische aard van zijn banden met die natuurlijke personen of rechtspersonen, mits
      hij aantoont dat hij kan beschikken over de voor de uitvoering van de overheidsopdracht noodzakelijke middelen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.94
  - number: 2.94.2
    text: |-
      Onder de voorwaarden, genoemd in het eerste lid, kan een samenwerkingsverband van ondernemers zich beroepen op de
      bekwaamheid van de deelnemers aan het samenwerkingsverband of van andere natuurlijke personen of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.94
  - number: '2.95'
    text: |-
      De aanbestedende dienst kan bij overheidsopdrachten voor werken, bij overheidsopdrachten voor leveringen waarvoor
      plaatsings- of installatiewerkzaamheden nodig zijn, en bij overheidsopdrachten voor diensten de geschiktheid van
      ondernemers om die diensten te verlenen of die installatiewerkzaamheden of werken uit te voeren, beoordelen op
      grond van met name hun praktische vaardigheden, technische kennis, efficiëntie, ervaring en betrouwbaarheid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.95
  - number: 2.96.1
    text: |-
      Indien een aanbestedende dienst de overlegging verlangt van een door een onafhankelijke instantie opgestelde
      verklaring dat de ondernemer aan bepaalde kwaliteitsnormen voldoet, verwijst hij naar kwaliteitsbewakingsregelingen
      die op de Europese normenreeksen op dit terrein zijn gebaseerd en die zijn gecertificeerd door instanties die
      voldoen aan de Europese normenreeks voor certificering.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.96
  - number: 2.96.2
    text: |-
      Een aanbestedende dienst aanvaardt gelijkwaardige certificaten van in andere lidstaten van de Europese Unie
      gevestigde instanties. Een aanbestedende dienst aanvaardt eveneens andere bewijzen inzake gelijkwaardige
      maatregelen op het gebied van de kwaliteitsbewaking.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.96
  - number: 2.97.1
    text: |-
      Indien een aanbestedende dienst in een geval als bedoeld in [artikel 2.93, eerste lid, onderdeel g][ref1], de
      overlegging verlangt van een door een onafhankelijke instantie opgestelde verklaring dat de ondernemer aan bepaalde
      normen inzake milieubeheer voldoet, verwijst hij naar het communautair milieubeheer- en milieuauditsysteem of
      naar normen inzake milieubeheer die gebaseerd zijn op de desbetreffende Europese of internationale normen die
      gecertificeerd zijn door erkende organisaties of organisaties die beantwoorden of aan de relevante Europese of
      internationale normen voor certificering.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.97
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.6.1
        afdeling: 2.3.6
  - number: 2.97.2
    text: |-
      Een aanbestedende dienst aanvaardt gelijkwaardige certificaten van in andere lidstaten gevestigde instanties. Hij
      aanvaardt eveneens andere bewijzen inzake gelijkwaardige maatregelen op het gebied van milieubeheer.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.97
  - number: 2.98.1
    text: |-
      De aanbestedende dienst kan een ondernemer die aan een overheidsopdracht wenst deel te nemen, verzoeken aan te
      tonen dat hij volgens de voorschriften van de lidstaat waar hij is gevestigd, in het beroepsregister of in het
      handelsregister is ingeschreven, of een verklaring onder ede of een attest te verstrekken als bedoeld in bijlage IX
      A van [richtlijn nr. 2004/18/EG](32004L0018) voor overheidsopdrachten voor werken, als bedoeld in bijlage IX B van
      [richtlijn nr. 2004/18/EG](32004L0018) voor overheidsopdrachten voor leveringen en als bedoeld in bijlage IX C van
      [richtlijn nr. 2004/18/EG](32004L0018) voor overheidsopdrachten voor diensten.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.98
  - number: 2.98.2
    text: |-
      Bij procedures voor het plaatsen van overheidsopdrachten voor diensten kan een aanbestedende dienst, indien
      de gegadigden of de inschrijvers over een bijzondere vergunning dienen te beschikken of indien zij lid van een
      bepaalde organisatie dienen te zijn om in hun land van herkomst de betrokken dienst te kunnen verlenen, verlangen
      dat zij aantonen dat zij over deze vergunning beschikken, of lid van de bedoelde organisatie zijn.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.98
  - number: 2.99.1
    text: |-
      De aanbestedende dienst kan bij toepassing van de niet-openbare procedure, de concurrentiegerichte dialoog en de
      onderhandelingsprocedure met aankondiging het aantal gegadigden dat hij zal uitnodigen tot inschrijving beperken
      mits er een voldoende aantal geschikte kandidaten is.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.99
  - number: 2.99.2
    text: De aanbestedende dienst vermeldt in de aankondiging het aantal gegadigden dat hij voornemens is uit te nodigen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.99
  - number: 2.99.3
    text: |-
      Het aantal gegadigden dat de aanbestedende dienst voornemens is uit te nodigen bedraagt bij de niet-openbare
      procedure ten minste vijf en bij de concurrentiegerichte dialoog en de onderhandelingsprocedure met aankondiging
      ten minste drie.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.99
  - number: 2.99.4
    text: Het aantal uitgenodigde gegadigden waarborgt een daadwerkelijke mededinging.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.99
  - number: 2.99.5
    text: |-
      Indien het aantal gegadigden dat niet wordt uitgesloten en dat aan de geschiktheidseisen en selectiecriteria
      voldoet lager is dan het door de aanbestedende dienst vastgestelde aantal voor een uitnodiging tot inschrijving,
      kan de aanbestedende dienst de procedure voortzetten door de gegadigde of gegadigden uit te nodigen die aan de
      geschiktheidseisen voldoen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.99
  - number: 2.99.6
    text: |-
      Bij toepassing van het vijfde lid nodigt de aanbestedende dienst geen ondernemers uit die niet om deelneming
      hebben verzocht, en evenmin ondernemers waarop een uitsluitingsgrond van toepassing is of die niet aan de
      geschiktheidseisen voldoen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.99
  - number: '2.100'
    text: |-
      Bij de toepassing van [artikel 2.99, eerste lid][ref1], beperkt de aanbestedende dienst het aantal gegadigden op
      een objectieve en niet-discriminerende wijze, met behulp van in de aankondiging vermelde regels of selectiecriteria
      en weging.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.100
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.6.3
        afdeling: 2.3.6
  - number: '2.101'
    text: |-
      De aanbestedende dienst gaat, alvorens hij de opdracht gunt, de geschiktheid van iedere niet-uitgesloten
      inschrijver na aan de hand van de eigen verklaring en de ingediende bewijsstukken die op grond van
      [artikel 2.85, derde lid][ref1], zijn verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.101
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        afdeling: 2.3.4
  - number: 2.102.1
    text: |-
      De aanbestedende dienst kan de juistheid nagaan van een of meer gegevens of inlichtingen in de eigen verklaring
      van de gegadigden die hij wil uitnodigen om een inschrijving in te dienen of van de inschrijvers bij welke hij
      voornemens is de overheidsopdracht te plaatsen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.102
  - number: 2.102.2
    text: |-
      Bij toepassing van het eerste lid kan de aanbestedende dienst een gegadigde of inschrijver als bedoeld in dat
      lid vragen de uit hoofde van de [artikelen 2.85][ref1], [2.89][ref2] en [2.91 tot en met 2.97][ref3] overgelegde
      verklaringen en bescheiden nader toe te lichten en aan te vullen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.102
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        afdeling: 2.3.4
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.2
        afdeling: 2.3.5
      - id: ref3
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.6.1
        afdeling: 2.3.6
  - number: 2.103.1
    text: |-
      Een aanbestedende dienst deelt de afwijzing of uitsluiting van betrokken gegadigden en betrokken inschrijvers zo
      spoedig mogelijk schriftelijk mede.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.103
  - number: 2.103.2
    text: |-
      Op verzoek van een betrokken partij stelt een aanbestedende dienst een afgewezen gegadigde zo spoedig mogelijk,
      doch uiterlijk binnen vijftien dagen na ontvangst van zijn schriftelijk verzoek, in kennis van de redenen voor
      de afwijzing.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.103
  - number: 2.103.3
    text: |-
      Op verzoek van een betrokken partij stelt de aanbestedende dienst iedere afgewezen inschrijver zo spoedig mogelijk,
      doch uiterlijk binnen vijftien dagen na ontvangst van zijn schriftelijk verzoek, in kennis van de redenen voor
      de afwijzing, inclusief voor de gevallen, bedoeld in de [artikelen 2.77][ref1] en [2.78][ref2], de redenen voor
      zijn beslissing dat er geen gelijkwaardigheid voorhanden is of dat de werken, leveringen of diensten niet aan de
      functionele en prestatie-eisen voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.103
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.3.1
        afdeling: 2.3.3
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.3.1
        afdeling: 2.3.3
  - number: '2.104'
    text: |-
      De aanbestedende dienst die een mededeling als bedoeld in [artikel 2.103, eerste lid][ref1], doet, verstrekt
      daarbij geen gegevens voor zover dat:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.104
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        afdeling: 2.3.7
  - number: 2.104.a
    text: in strijd zou zijn met enig wettelijk voorschrift,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.104
  - number: 2.104.b
    text: in strijd zou zijn met het openbare belang,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.104
  - number: 2.104.c
    text: de rechtmatige commerciële belangen van ondernemers zou kunnen schaden, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.104
  - number: 2.104.d
    text: afbreuk zou kunnen doen aan de eerlijke mededinging tussen ondernemers.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.104
  - number: 2.105.1
    text: |-
      Bij toepassing van de niet-openbare procedure, de concurrentiegerichte dialoog of de onderhandelingsprocedure
      met aankondiging nodigt de aanbestedende dienst de niet-uitgesloten en niet-afgewezen gegadigden gelijktijdig en
      schriftelijk uit tot inschrijving, tot deelneming aan de dialoog of tot onderhandelingen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.105
  - number: 2.105.2
    text: |-
      De aanbestedende dienst nodigt ten minste het aantal gegadigden uit dat in de aankondiging staat vermeld, met
      inachtneming van [paragraaf 2.3.6.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.105
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        paragraaf: 2.3.6.3
        afdeling: 2.3.6
  - number: 2.106.1
    text: |-
      De uitnodiging aan de gegadigden, bedoeld in [artikel 2.105][ref1], bevat een exemplaar van de
      aanbestedingsstukken, of indien de aanbestedingstukken overeenkomstig [artikel 2.72][ref2] langs elektronische weg
      beschikbaar zijn gesteld, vermeldt de wijze van toegang tot de aanbestedingsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.106
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.1
        afdeling: 2.3.8
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.3
        afdeling: 2.3.2
  - number: 2.106.2
    text: 'De uitnodiging, bedoeld in het eerste lid, bevat tevens:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.106
  - number: 2.106.2.a
    text: een verwijzing naar de bekendgemaakte aankondiging van de opdracht,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.106
  - number: 2.106.2.b
    text: |-
      indien de aanbestedende dienst de niet-openbare procedure of de onderhandelingsprocedure met aankondiging toepast,
      de uiterste datum voor het indienen van de inschrijvingen, het adres waar deze kunnen worden ingediend en de taal
      of talen waarin zij dienen te worden gesteld,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.106
  - number: 2.106.2.c
    text: |-
      indien de aanbestedende dienst de concurrentiegerichte dialoog toepast, de aanvangsdatum en het adres van de
      raadpleging, alsook de daarbij gebruikte taal of talen,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.106
  - number: 2.106.2.d
    text: |-
      opgave van de stukken die met inachtneming van [artikel 2.102][ref1] eventueel worden bijgevoegd, hetzij ter
      staving van de door de gegadigde overeenkomstig [artikel 2.84][ref2] verstrekte verklaring, hetzij ter aanvulling
      van de inlichtingen, bedoeld in [artikel 2.55][ref3], en zulks onder dezelfde voorwaarden als gesteld in de
      [artikelen 2.91 tot en met 2.97][ref4], en


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.106
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.6.4
        afdeling: 2.3.6
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        afdeling: 2.3.4
      - id: ref3
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.1.2
        afdeling: 2.3.1
      - id: ref4
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.6.1
        afdeling: 2.3.6
  - number: 2.106.2.e
    text: |-
      het relatieve gewicht van de gunningscriteria van de overheidsopdracht of de afnemende volgorde van belangrijkheid
      van de criteria, indien dat gewicht of die volgorde niet in de aankondiging van de overheidsopdracht of de
      aanbestedingsstukken zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.106
  - number: 2.107.1
    text: De inschrijving geschiedt schriftelijk.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.107
  - number: 2.107.2
    text: De aanbestedende dienst bepaalt de wijze van het indienen van de inschrijving.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.107
  - number: '2.108'
    text: |-
      De aanbestedende dienst neemt geen kennis van de inhoud van de inschrijving voordat de uiterste termijn voor het
      indienen is verstreken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.108
  - number: 2.109.1
    text: |-
      In geval van een storing van het elektronische systeem door middel waarvan de inschrijving ingediend moet worden,
      waardoor het indienen van de inschrijving kort voor het verstrijken van de uiterste termijn niet mogelijk is, kan
      de aanbestedende dienst deze termijn na afloop van de uiterste termijn verlengen, mits hij nog geen kennis heeft
      genomen van de inhoud van enige inschrijving.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.109
  - number: 2.109.2
    text: |-
      Alle niet-afgewezen gegadigden en inschrijvers worden door de aanbestedende dienst in kennis gesteld van de
      verlenging, bedoeld in het eerste lid, en krijgen de gelegenheid om hun inschrijving binnen de verlenging te
      wijzigen of aan te vullen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.109
  - number: 2.110.1
    text: |-
      Bij toepassing van de concurrentiegerichte dialoog geschiedt de gunning van de overheidsopdracht op basis van het
      criterium van de economisch meest voordelige inschrijving.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.110
  - number: 2.110.2
    text: |-
      Een aanbestedende dienst vermeldt in de aankondiging van de overheidsopdracht de behoeften en eisen die door hem in
      die aankondiging of het beschrijvend document worden omschreven.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.110
  - number: 2.110.3
    text: |-
      Een aanbestedende dienst opent met de overeenkomstig [paragraaf 2.3.6.3][ref1] geselecteerde gegadigden een dialoog
      om te bepalen welke middelen geschikt zijn om zo goed mogelijk aan zijn behoeften te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.110
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        paragraaf: 2.3.6.3
        afdeling: 2.3.6
  - number: 2.110.4
    text: |-
      Tijdens de dialoog kan de aanbestedende dienst met de geselecteerde gegadigden alle aspecten van de
      overheidsopdracht bespreken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.110
  - number: 2.110.5
    text: |-
      De aanbestedende dienst waarborgt tijdens de dialoog de gelijke behandeling van alle inschrijvers en verstrekt geen
      informatie die een of meer inschrijvers kan bevoordelen boven andere.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.110
  - number: 2.110.6
    text: |-
      De aanbestedende dienst deelt de voorgestelde oplossingen of andere door een deelnemer aan de dialoog verstrekte
      vertrouwelijke inlichtingen niet aan de andere deelnemers mee zonder de instemming van de desbetreffende deelnemer.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.110
  - number: 2.111.1
    text: |-
      Een aanbestedende dienst kan bepalen dat de procedure van de concurrentiegerichte dialoog in opeenvolgende fasen
      verloopt, zodat het aantal in de dialoogfase te bespreken oplossingen kan worden beperkt door middel van de
      gunningscriteria die in de aankondiging van de overheidsopdracht of in de aanbestedingsstukken zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.111
  - number: 2.111.2
    text: |-
      De aanbestedende dienst draagt er zorg voor dat in de slotfase het aantal oplossingen zodanig is dat daadwerkelijke
      mededinging kan worden gegarandeerd, voor zover er een voldoende aantal geschikte oplossingen of gegadigden is.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.111
  - number: 2.111.3
    text: |-
      Het eerste lid vindt slechts toepassing indien de aanbestedende dienst de mogelijkheid in de aankondiging van de
      overheidsopdracht of in de aanbestedingsstukken heeft vermeld.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.111
  - number: 2.111.4
    text: |-
      Een aanbestedende dienst zet de dialoog voort totdat hij, zo nodig na vergelijking, kan aangeven welke oplossingen
      aan zijn behoeften kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.111
  - number: 2.111.5
    text: |-
      Nadat een aanbestedende dienst de dialoog heeft beëindigd en de deelnemers daarvan op de hoogte heeft gesteld,
      verzoekt hij de deelnemers om hun definitieve inschrijvingen in te dienen op basis van de tijdens de dialoog
      voorgelegde en gespecificeerde oplossingen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.111
  - number: 2.111.6
    text: |-
      De uitnodiging tot het indienen van een inschrijving bevat de uiterste datum voor het indienen van de
      inschrijvingen, het adres waar deze kunnen worden ingediend en de taal of talen waarin zij dienen te worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.111
  - number: 2.111.7
    text: |-
      De inschrijver voorziet er in dat de inschrijving, bedoeld in het vijfde lid, alle vereiste en noodzakelijke
      elementen voor de uitvoering van het project bevat.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.111
  - number: 2.111.8
    text: |-
      Een aanbestedende dienst kan een inschrijver verzoeken om de inschrijving toe te lichten of nauwkeuriger te
      omschrijven.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.111
  - number: 2.111.9
    text: |-
      Indien een verzoek als bedoeld in het achtste lid wordt gedaan wijzigt de inschrijver de basiselementen van de
      inschrijving of de aanbesteding niet wezenlijk.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.111
  - number: 2.112.1
    text: |-
      Een aanbestedende dienst beoordeelt de ontvangen inschrijvingen op basis van de in de aankondiging van de
      overheidsopdracht of in de aanbestedingsstukken bepaalde gunningscriteria en kiest de economisch voordeligste
      inschrijving overeenkomstig [artikel 2.115][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.112
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
  - number: 2.112.2
    text: |-
      Een aanbestedende dienst kan de inschrijver waarvan de inschrijving is aangewezen als de economisch meest
      voordelige inschrijving, verzoeken aspecten van zijn inschrijving te verduidelijken of in de inschrijving opgenomen
      verbintenissen te bevestigen, mits dit de inhoudelijke aspecten van de inschrijving of van de aankondiging
      ongewijzigd laat en niet leidt of dreigt te leiden tot concurrentievervalsing of discriminatie.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.112
  - number: 2.112.3
    text: Een aanbestedende dienst kan voorzien in prijzen of betalingen aan de deelnemers aan de dialoog.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.112
  - number: '2.113'
    text: |-
      De aanbestedende dienst toetst de inschrijvingen aan de door hem in de aankondiging of de aanbestedingsstukken
      gestelde normen, functionele eisen en eisen aan de prestatie.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.113
  - number: 2.114.1
    text: |-
      De aanbestedende dienst gunt een overheidsopdracht op grond van de naar het oordeel van de aanbestedende dienst
      economisch meest voordelige inschrijving.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.114
  - number: 2.114.2
    text: |-
      Een aanbestedende dienst kan, in afwijking van het eerste lid, gunnen op grond van de laagste prijs. In dat geval
      motiveert de aanbestedende dienst de toepassing van dat criterium in de aanbestedingsstukken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.114
  - number: 2.115.1
    text: |-
      De aanbestedende dienst die het criterium «economisch meest voordelige inschrijving» toepast, maakt in de
      aankondiging van de overheidsopdracht bekend welke nadere criteria hij stelt met het oog op de toepassing van dit
      criterium.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.115
  - number: 2.115.2
    text: 'De in het eerste lid bedoelde nadere criteria kunnen onder meer betreffen:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.115
  - number: 2.115.2.a
    text: kwaliteit;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.115
  - number: 2.115.2.b
    text: prijs;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.115
  - number: 2.115.2.c
    text: technische waarde;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.115
  - number: 2.115.2.d
    text: esthetische en functionele kenmerken;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.115
  - number: 2.115.2.e
    text: milieukenmerken;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.115
  - number: 2.115.2.f
    text: gebruikskosten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.115
  - number: 2.115.2.g
    text: rentabiliteit;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.115
  - number: 2.115.2.h
    text: klantenservice en technische bijstand;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.115
  - number: 2.115.2.i
    text: datum van levering;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.115
  - number: 2.115.2.j
    text: termijn voor de levering of uitvoering.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.115
  - number: 2.115.3
    text: |-
      De aanbestedende dienst specificeert in de aankondiging van de overheidsopdracht of in de aanbestedingsstukken
      het relatieve gewicht van elk van de door hem gekozen criteria voor de bepaling van de economisch meest voordelige
      inschrijving. Dit gewicht kan worden uitgedrukt door middel van een marge met een passend verschil tussen minimum
      en maximum.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.115
  - number: 2.115.4
    text: |-
      Indien naar het oordeel van de aanbestedende dienst om aantoonbare redenen geen weging mogelijk is, vermeldt de
      aanbestedende dienst in de aankondiging van de overheidsopdracht of in de aanbestedingsstukken dan wel, bij de
      concurrentiegerichte dialoog, in het beschrijvend document, de criteria in afnemende volgorde van belang.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.115
  - number: 2.116.1
    text: |-
      Indien een inschrijving voor een overheidsopdracht wordt gedaan die in verhouding tot de te verrichten werken,
      leveringen of diensten abnormaal laag lijkt, verzoekt de aanbestedende dienst, voordat hij deze inschrijving
      afwijst, schriftelijk om de door hem noodzakelijk geachte verduidelijkingen over de samenstelling van de
      desbetreffende inschrijving.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.116
  - number: 2.116.2
    text: 'De verduidelijkingen, bedoeld in het eerste lid, kunnen onder meer verband houden met:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.116
  - number: 2.116.2.a
    text: de doelmatigheid van het bouwproces, van het productieproces van de producten of van de dienstverlening;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.116
  - number: 2.116.2.b
    text: |-
      de gekozen technische oplossingen of uitzonderlijk gunstige omstandigheden waarvan de inschrijver bij de uitvoering
      van de werken, de levering van de producten of het verlenen van de diensten kan profiteren;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.116
  - number: 2.116.2.c
    text: de originaliteit van het ontwerp van de inschrijver;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.116
  - number: 2.116.2.d
    text: |-
      de naleving van de bepalingen inzake arbeidsvoorwaarden en arbeidsomstandigheden die gelden op de plaats waar de
      overheidsopdracht wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.116
  - number: 2.116.2.e
    text: de ontvangst van staatssteun door de inschrijver.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.116
  - number: 2.116.3
    text: |-
      De aanbestedende dienst onderzoekt in overleg met de inschrijver de samenstelling van de desbetreffende
      inschrijving aan de hand van de ontvangen toelichting.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.116
  - number: 2.116.4
    text: |-
      Een aanbestedende dienst die constateert dat een inschrijving abnormaal laag is omdat de inschrijver staatssteun
      heeft gekregen, kan de inschrijving uitsluitend op enkel die grond afwijzen, indien de inschrijver desgevraagd niet
      binnen een door de aanbestedende dienst bepaalde voldoende lange termijn kan aantonen dat de betrokken steun niet
      in strijd met de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie is toegekend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.116
  - number: 2.116.5
    text: |-
      Indien de aanbestedende dienst in een geval als bedoeld in het vierde lid een inschrijving afwijst, stelt hij de
      Europese Commissie daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.116
  - number: 2.117.1
    text: |-
      De aanbestedende dienst kan bij de openbare procedure, de niet-openbare procedure en de onderhandelingsprocedure
      in een geval als bedoeld in [artikel 2.30, eerste lid, onderdeel a][ref1], de gunningsbeslissing vooraf laten gaan
      door een elektronische veiling, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.117
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.2'
        paragraaf: 2.2.2.2
        afdeling: 2.2.2
  - number: 2.117.1.a
    text: hij dit heeft gemeld in de aankondiging,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.117
  - number: 2.117.1.b
    text: hij in de aanbestedingsstukken de informatie heeft opgenomen met betrekking tot de elektronische veiling, en
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.117
  - number: 2.117.1.c
    text: nauwkeurige specificaties voor de overheidsopdracht kunnen worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.117
  - number: 2.117.2
    text: Het eerste lid is niet van toepassing voor de aanbesteding van werken of diensten voor intellectuele prestaties.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.117
  - number: 2.117.3
    text: |-
      De aanbestedende dienst maakt geen misbruik van de methode van elektronische veiling, noch gebruikt hij de methode
      om concurrentie te beletten, te beperken of te vervalsen of om wezenlijke wijzigingen aan te brengen in het
      voorwerp van de overheidsopdracht zoals omschreven in de aankondiging en vastgelegd in de aanbestedingsstukken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.117
  - number: 2.118.1
    text: |-
      In het kader van een dynamisch aankoopsysteem kan een aanbestedende dienst de gunning van de overheidsopdracht
      vooraf laten gaan door een elektronische veiling, indien nauwkeurige specificaties voor de overheidsopdracht kunnen
      worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.118
  - number: 2.118.2
    text: |-
      In het kader van een raamovereenkomst die met meerdere ondernemers is gesloten als bedoeld in
      [artikel 2.143, tweede lid, onderdeel b, onder 2°][ref1], kan een aanbestedende dienst de gunning van de
      overheidsopdracht vooraf laten gaan door een elektronische veiling, indien nauwkeurige specificaties voor de
      overheidsopdracht kunnen worden opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.118
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.1
  - number: '2.119'
    text: 'De aanbestedingsstukken over een elektronische veiling bevatten in ieder geval de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.119
  - number: 2.119.a
    text: |-
      de elementen waarvan de waarden vallen onder de elektronische veiling, voor zover deze elementen kwantificeerbaar
      zijn zodat ze kunnen worden uitgedrukt in cijfers of procenten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.119
  - number: 2.119.b
    text: |-
      de eventuele limieten van de waarden die kunnen worden ingediend, zoals zij voortvloeien uit de specificaties van
      het voorwerp van de overheidsopdracht;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.119
  - number: 2.119.c
    text: |-
      de informatie die tijdens de elektronische veiling ter beschikking van de inschrijvers zal worden gesteld en het
      tijdstip waarop die informatie ter beschikking zal worden gesteld;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.119
  - number: 2.119.d
    text: relevante informatie betreffende het verloop van de elektronische veiling;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.119
  - number: 2.119.e
    text: |-
      de voorwaarden waaronder de inschrijvers een bod kunnen doen en met name de vereiste minimumverschillen die voor de
      biedingen vereist zijn;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.119
  - number: 2.119.f
    text: |-
      relevante informatie betreffende het gebruikte elektronische systeem en de nadere technische bepalingen en
      specificaties voor de verbinding.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.119
  - number: '2.120'
    text: |-
      Alvorens over te gaan tot de elektronische veiling, verricht een aanbestedende dienst een eerste, volledige
      beoordeling van de inschrijvingen aan de hand van de vastgestelde gunningscriteria en de vastgestelde weging
      daarvan.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.120
  - number: 2.121.1
    text: |-
      Een aanbestedende dienst waarborgt dat alle inschrijvers die een aan de functionele en prestatie-eisen
      beantwoordende inschrijving hebben gedaan, tegelijkertijd langs elektronische weg worden uitgenodigd om nieuwe
      prijzen of nieuwe waarden in te dienen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.121
  - number: 2.121.2
    text: |-
      Een aanbestedende dienst waarborgt dat het verzoek, bedoeld in het eerste lid, alle relevante informatie bevat
      voor de individuele verbinding met het gebruikte elektronische systeem en de datum en het aanvangsuur van de
      elektronische veiling preciseert.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.121
  - number: '2.122'
    text: Een aanbestedende dienst kan de elektronische veiling in verschillende fasen laten verlopen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.122
  - number: 2.123.1
    text: |-
      Een aanbestedende dienst verstuurt de uitnodigingen voor een elektronische veiling uiterlijk twee werkdagen voor de
      aanvang van de veiling.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.123
  - number: 2.123.2
    text: |-
      Een aanbestedende dienst die voor de gunning het criterium van de economisch meest voordelige inschrijving
      hanteert, voegt bij de uitnodiging:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.123
  - number: 2.123.2.a
    text: het resultaat van de volledige beoordeling van de inschrijving van de betrokken inschrijver, en
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.123
  - number: 2.123.2.b
    text: |-
      de wiskundige formule die tijdens de elektronische veiling de automatische herklasseringen naar gelang van de
      ingediende nieuwe prijzen of nieuwe waarden zal bepalen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.123
  - number: 2.123.3
    text: |-
      In de formule, bedoeld in het tweede lid, onderdeel b, verwerkt de aanbestedende dienst het gewicht dat aan alle
      vastgestelde criteria wordt toegekend om de economisch meest voordelige inschrijving te bepalen. Eventuele marges
      worden daartoe door de aanbestedende dienst vooraf in een bepaalde waarde uitgedrukt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.123
  - number: 2.123.4
    text: Een aanbestedende dienst die varianten toestaat, verstrekt voor iedere variant de afzonderlijke formule.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.123
  - number: 2.124.1
    text: |-
      Tijdens alle fasen van de elektronische veiling deelt de aanbestedende dienst onverwijld aan alle inschrijvers in
      ieder geval de informatie mee die hen de mogelijkheid biedt op elk moment hun respectieve klassering te kennen.
      Indien dat in de aanbestedingsstukken vermeld is, kan de aanbestedende dienst ook andere informatie betreffende
      andere ingediende prijzen of waarden meedelen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.124
  - number: 2.124.2
    text: |-
      Een aanbestedende dienst kan tevens op ieder ogenblik aan de inschrijvers meedelen hoeveel inschrijvers aan de fase
      van de veiling deelnemen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.124
  - number: 2.124.3
    text: |-
      Een aanbestedende dienst deelt tijdens het verloop van de elektronische veiling in geen geval de identiteit van de
      inschrijvers mee.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.124
  - number: 2.125.1
    text: 'Een aanbestedende dienst sluit de elektronische veiling op een of meer van de onderstaande wijzen af:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.125
  - number: 2.125.1.a
    text: |-
      hij kan in de uitnodiging om deel te nemen aan de veiling een vooraf vastgestelde datum en een vooraf vastgesteld
      tijdstip voor de sluiting aangeven;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.125
  - number: 2.125.1.b
    text: |-
      hij kan de veiling afsluiten indien hij geen nieuwe prijzen of waarden meer ontvangt die beantwoorden aan de
      vereisten betreffende de minimumverschillen, indien hij in de uitnodiging om deel te nemen aan de veiling de
      termijn vermeldt die hij na ontvangst van de laatste aanbieding in acht zal nemen alvorens de veiling te sluiten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.125
  - number: 2.125.1.c
    text: |-
      hij kan de veiling afsluiten indien alle fasen van de veiling die in de uitnodiging om deel te nemen aan de veiling
      zijn vermeld, afgehandeld zijn.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.125
  - number: 2.125.2
    text: |-
      Een aanbestedende dienst die besloten heeft om de elektronische veiling overeenkomstig het eerste lid, onderdeel c,
      af te sluiten in combinatie met de toepassing van het eerste lid, onderdeel b, vermeldt in de uitnodiging om deel
      te nemen aan de veiling het tijdschema voor elk van de fasen van de veiling.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.125
  - number: 2.125.3
    text: |-
      Na de sluiting van de elektronische veiling gunt een aanbestedende dienst de overheidsopdracht overeenkomstig
      [artikel 2.114][ref1] op basis van de resultaten van de elektronische veiling.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.125
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
  - number: 2.126.1
    text: |-
      Bij toepassing van de onderhandelingsprocedure met aankondiging onderhandelt de aanbestedende dienst met
      de inschrijvers over de door hen ingediende inschrijvingen, teneinde deze aan te passen aan de eisen die de
      aanbestedende dienst in de aankondiging van de overheidsopdracht, de aanbestedingsstukken en de eventuele
      aanvullende documenten heeft gesteld en teneinde het beste bod voor de gunning van de overheidsopdracht te zoeken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.126
  - number: 2.126.2
    text: |-
      De aanbestedende dienst waarborgt tijdens de onderhandelingen de gelijke behandeling van alle inschrijvers en
      verstrekt geen informatie die een of meer inschrijvers kan bevoordelen boven andere.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.126
  - number: 2.126.3
    text: |-
      Een aanbestedende dienst kan bepalen dat de procedure van gunning door onderhandelingen in opeenvolgende fasen
      verloopt, zodat het aantal inschrijvingen waarover onderhandeld wordt, door toepassing van de gunningscriteria die
      in de aankondiging van de overheidsopdracht of in de aanbestedingsstukken zijn vermeld, verminderd wordt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.126
  - number: 2.126.4
    text: |-
      Het derde lid vindt slechts toepassing indien de aanbestedende dienst deze mogelijkheid heeft vermeld in de
      aankondiging van de overheidsopdracht of in de aanbestedingsstukken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.126
  - number: 2.126.5
    text: |-
      De aanbestedende dienst draagt er zorg voor dat in de slotfase het aantal oplossingen zodanig is dat daadwerkelijke
      mededinging kan worden gegarandeerd, voor zover er een voldoende aantal geschikte oplossingen of gegadigden is.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.126
  - number: 2.127.1
    text: |-
      Een aanbestedende dienst neemt een opschortende termijn in acht voordat hij de met de gunningsbeslissing beoogde
      overeenkomst sluit.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.127
  - number: 2.127.2
    text: |-
      De opschortende termijn, bedoeld in het eerste lid, vangt aan op de dag na de datum waarop de mededeling van de
      gunningsbeslissing is verzonden aan de betrokken inschrijvers en betrokken gegadigden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.127
  - number: 2.127.3
    text: De opschortende termijn, bedoeld in het eerste lid, bedraagt ten minste 20 kalenderdagen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.127
  - number: 2.127.4
    text: 'Een aanbestedende dienst behoeft geen toepassing te geven aan het eerste lid indien:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.127
  - number: 2.127.4.a
    text: |-
      deze wet geen bekendmaking van de aankondiging van de overheidsopdracht door middel van het elektronische systeem
      voor aanbestedingen vereist;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.127
  - number: 2.127.4.b
    text: |-
      de enige betrokken inschrijver degene is aan wie de overheidsopdracht wordt gegund en er geen betrokken gegadigden
      zijn;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.127
  - number: 2.127.4.c
    text: |-
      het gaat om opdrachten op grond van een raamovereenkomst of specifieke opdrachten op grond van een dynamisch
      aankoopsysteem als bedoeld in [afdeling 2.4.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.127
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.4'
        afdeling: 2.4.2
  - number: 2.128.1
    text: |-
      Een betrokken inschrijver als bedoeld in [artikel 2.127, tweede lid][ref1], is iedere inschrijver die niet
      definitief is uitgesloten. De uitsluiting is definitief wanneer de betrokken inschrijvers daarvan in kennis zijn
      gesteld en wanneer de uitsluiting rechtmatig is bevonden door een rechter, dan wel er niet langer een rechtsmiddel
      kan worden aangewend tegen de uitsluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.128
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.8
        afdeling: 2.3.8
  - number: 2.128.2
    text: |-
      Een betrokken gegadigde als bedoeld in [artikel 2.127, tweede lid][ref1], is iedere gegadigde aan wie de
      aanbestedende dienst geen informatie over de afwijzing van zijn verzoek tot deelneming ter beschikking heeft
      gesteld voordat de betrokken inschrijvers in kennis werden gesteld van de gunningsbeslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.128
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.8
        afdeling: 2.3.8
  - number: '2.129'
    text: |-
      De mededeling van de gunningsbeslissing van een aanbestedende dienst houdt geen aanvaarding in als bedoeld in
      [artikel 217, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref1] van een aanbod van een ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel217
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.129
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '217'
  - number: 2.130.1
    text: |-
      De mededeling van de gunningsbeslissing aan iedere betrokken inschrijver of betrokken gegadigde bevat de relevante
      redenen voor die beslissing, alsmede een nauwkeurige omschrijving van de opschortende termijn, bedoeld in
      [artikel 2.127, eerste lid][ref1], die van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.130
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.8
        afdeling: 2.3.8
  - number: 2.130.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder relevante redenen in ieder geval verstaan de kenmerken en
      voordelen van de uitgekozen inschrijving alsmede de naam van de begunstigde of de partijen bij de raamovereenkomst.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.130
  - number: 2.130.3
    text: |-
      De mededeling, bedoeld in het eerste lid, wordt in ieder geval elektronisch of per fax verzonden aan de betrokken
      inschrijvers en betrokken gegadigden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.130
  - number: '2.131'
    text: |-
      Indien gedurende de opschortende termijn, bedoeld in [artikel 2.127, eerste lid][ref1], een onmiddellijke
      voorziening bij voorraad wordt verzocht met betrekking tot de desbetreffende gunningsbeslissing, sluit de
      aanbestedende dienst de met die beslissing beoogde overeenkomst niet eerder dan nadat de rechter dan wel het
      scheidsgerecht een beslissing heeft genomen over het verzoek tot voorlopige maatregelen en de opschortende termijn
      is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.131
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.8
        afdeling: 2.3.8
  - number: '2.132'
    text: |-
      De aanbestedende dienst stelt over de gunning van een overheidsopdracht en de instelling van een dynamisch
      aankoopsysteem een proces-verbaal op dat, indien van toepassing, in ieder geval de volgende gegevens bevat:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.132
  - number: 2.132.a
    text: naam en adres van de aanbestedende dienst;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.132
  - number: 2.132.b
    text: voorwerp en waarde van de overheidsopdracht;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.132
  - number: 2.132.c
    text: namen van de uitgekozen gegadigden met motivering van die keuze;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.132
  - number: 2.132.d
    text: de namen van de uitgesloten en afgewezen gegadigden met motivering van die uitsluiting of afwijzing;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.132
  - number: 2.132.e
    text: de namen van de afgewezen inschrijvers met motivering van die afwijzing;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.132
  - number: 2.132.f
    text: |-
      of er inlichtingen zijn die op verzoek van een ondernemer geen deel hebben uitgemaakt van de nota van inlichtingen,
      bedoeld in [artikel 2.53, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.132
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.1.2
        afdeling: 2.3.1
  - number: 2.132.g
    text: de redenen voor de afwijzing van abnormaal laag bevonden inschrijvingen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.132
  - number: 2.132.h
    text: |-
      de naam van de uitgekozen inschrijver en motivering voor die keuze en, indien bekend, het gedeelte van de
      overheidsopdracht dat de uitgekozen inschrijver voornemens is aan derden in onderaanneming te geven;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.132
  - number: 2.132.i
    text: |-
      in geval van de procedure van de concurrentie gerichte dialoog, de omstandigheden, bedoeld in [artikel 2.28][ref1],
      die de toepassing van deze procedure rechtvaardigen;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.132
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.2'
        paragraaf: 2.2.2.1
        afdeling: 2.2.2
  - number: 2.132.j
    text: |-
      in geval van de onderhandelingsprocedure, de in [paragrafen 2.2.2.2][ref1] en [2.2.2.3][ref2] genoemde
      omstandigheden die de toepassing van de procedure rechtvaardigen;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.132
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.2'
        paragraaf: 2.2.2.2
        afdeling: 2.2.2
      - id: ref2
        bwb_id: BWBR0032203
        hoofdstuk: '2.2'
        paragraaf: 2.2.2.3
        afdeling: 2.2.2
  - number: 2.132.k
    text: |-
      in voorkomend geval de redenen waarom de aanbestedende dienst besloten heeft een overheidsopdracht niet te gunnen
      of geen dynamisch aankoopsysteem in te stellen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.132
  - number: '2.133'
    text: |-
      Een aanbestedende dienst zendt het proces-verbaal, bedoeld in [artikel 2.132][ref1], op haar verzoek aan de
      Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.133
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.9
        afdeling: 2.3.8
  - number: 2.134.1
    text: |-
      De aanbestedende dienst die een overheidsopdracht heeft gegund maakt de aankondiging van de gegunde
      overheidsopdracht bekend met behulp van het elektronische systeem voor aanbestedingen binnen 48 dagen na de gunning
      van die overheidsopdracht.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.134
  - number: 2.134.2
    text: |-
      De aanbestedende dienst gebruikt voor de mededeling van het resultaat van de procedure het daartoe door middel van
      het elektronische systeem voor aanbestedingen beschikbaar gestelde formulier.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.134
  - number: '2.135'
    text: |-
      [Artikel 2 134][ref1] is niet van toepassing op opdrachten die op basis van een overeenkomstig
      [afdeling 2.4.1][ref2] gesloten raamovereenkomst gegund worden.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.135
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.9
        afdeling: 2.3.8
      - id: ref2
        bwb_id: BWBR0032203
        hoofdstuk: '2.4'
        afdeling: 2.4.1
  - number: 2.136.1
    text: |-
      Binnen 48 dagen na de gunning van een afzonderlijke overheidsopdracht op basis van een dynamisch aankoopsysteem
      zendt een aanbestedende dienst met behulp van het elektronische systeem voor aanbestedingen een mededeling aan de
      Europese Commissie van het resultaat van de procedure.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.136
  - number: 2.136.2
    text: |-
      Een aanbestedende dienst kan de resultaten, bedoeld in het eerste lid, per kwartaal bundelen. Indien de
      aanbestedende dienst daarvoor kiest zendt hij de gebundelde resultaten binnen 48 dagen na het einde van elk
      kwartaal toe.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.136
  - number: '2.137'
    text: |-
      Met betrekking tot overheidsopdrachten voor diensten als bedoeld in bijlage II-B van [richtlijn nr. 2004/18/EG]
      (32004L0018) vermeldt een aanbestedende dienst bij de aankondiging van de gegunde overheidsopdracht of hij met de
      bekendmaking ervan instemt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.137
  - number: '2.138'
    text: |-
      De aanbestedende dienst maakt bepaalde gegevens betreffende de gunning van een overheidsopdracht niet bekend,
      indien openbaarmaking van die gegevens:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.138
  - number: 2.138.a
    text: in strijd zou zijn met enig wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.138
  - number: 2.138.b
    text: in strijd zou zijn met het openbaar belang;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.138
  - number: 2.138.c
    text: de rechtmatige commerciële belangen van ondernemers zou kunnen schaden;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.138
  - number: 2.138.d
    text: afbreuk zou kunnen doen aan de eerlijke mededinging tussen ondernemers.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.138
  - number: '2.139'
    text: |-
      Een aanbestedende dienst die een raamovereenkomst sluit na toepassing van een procedure als bedoeld in de
      [afdelingen 2.2.1][ref1] of [2.2.2][ref2], kan op basis van die raamovereenkomst overheidsopdrachten plaatsen
      overeenkomstig de procedures, bedoeld in [artikel 2.142][ref3] of [artikel 2.143][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.2
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.139
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.2'
        afdeling: 2.2.1
      - id: ref2
        bwb_id: BWBR0032203
        hoofdstuk: '2.2'
        afdeling: 2.2.2
      - id: ref3
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.1
      - id: ref4
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.1
  - number: 2.140.1
    text: |-
      De procedures, bedoeld in de [artikelen 2.142][ref1] en [2.143][ref2], kunnen uitsluitend worden toegepast tussen
      een aanbestedende dienst en de ondernemers die oorspronkelijk bij de raamovereenkomst partij zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.140
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.1
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.1
  - number: 2.140.2
    text: |-
      Bij de plaatsing van overheidsopdrachten die op een raamovereenkomst zijn gebaseerd, mogen de partijen geen
      substantiële wijzigingen aanbrengen in de in de raamovereenkomst gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.140
  - number: 2.140.3
    text: |-
      De looptijd van een raamovereenkomst is niet langer dan vier jaar, behalve in uitzonderingsgevallen die deugdelijk
      gemotiveerd zijn.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.140
  - number: '2.141'
    text: |-
      Een aanbestedende dienst gebruikt een raamovereenkomst niet om de mededinging te hinderen, te beperken of te
      vervalsen en maakt geen oneigenlijk gebruik van een raamovereenkomst.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.141
  - number: 2.142.1
    text: |-
      Indien een raamovereenkomst is gesloten met een enkele ondernemer worden de op die raamovereenkomst gebaseerde
      overheidsopdrachten gegund volgens de in de raamovereenkomst gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.142
  - number: 2.142.2
    text: |-
      Overheidsopdrachten op basis van raamovereenkomsten met een enkele ondernemer kunnen worden gegund door die
      ondernemer schriftelijk te raadplegen en hem indien nodig te verzoeken zijn inschrijvingen aan te vullen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.142
  - number: 2.143.1
    text: |-
      Als een raamovereenkomst wordt gesloten met meerdere ondernemers, wordt deze raamovereenkomst met ten minste drie
      ondernemers gesloten, mits het aantal ondernemers dat aan de selectiecriteria voldoet, of het aantal inschrijvingen
      dat aan de gunningscriteria voldoet, voldoende groot is.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.143
  - number: 2.143.2
    text: 'Overheidsopdrachten op basis van raamovereenkomsten met meerdere ondernemers kunnen worden gegund:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.143
  - number: 2.143.2.a
    text: |-
      door toepassing van de in de raamovereenkomst bepaalde voorwaarden, zonder de partijen opnieuw tot mededinging op
      te roepen, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.143
  - number: 2.143.2.b
    text: |-
      indien niet alle voorwaarden in de raamovereenkomst zijn bepaald, door de partijen opnieuw tot mededinging op te
      roepen onder de in de raamovereenkomst of in de aanbestedingsstukken van de raamovereenkomst bepaalde voorwaarden,
      volgens de onderstaande procedure:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.143
  - number: 2.143.2.b.1°
    text: |-
      voor een te gunnen overheidsopdracht raadpleegt de aanbestedende dienst schriftelijk de ondernemers die in staat
      zijn de overheidsopdracht uit te voeren,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.143
  - number: 2.143.2.b.2°
    text: |-
      de aanbestedende dienst stelt een voldoende lange termijn vast voor het indienen van inschrijvingen voor een
      specifieke overheidsopdracht, waarbij hij rekening houdt met elementen zoals de complexiteit van het voorwerp van
      de overheidsopdracht en de benodigde tijd voor de toezending van de inschrijvingen,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.143
  - number: 2.143.2.b.3°
    text: |-
      de inschrijvingen worden schriftelijk ingediend en de inhoud ervan blijft vertrouwelijk totdat de vastgestelde
      indieningstermijn is verstreken,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.143
  - number: 2.143.2.b.4°
    text: |-
      de aanbestedende dienst gunt een overheidsopdracht aan de inschrijver die op grond van de in de
      aanbestedingsstukken van de raamovereenkomst vastgestelde gunningscriteria de beste inschrijving heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.143
  - number: 2.144.1
    text: |-
      Een aanbestedende dienst stelt een dynamisch aankoopsysteem in door toepassing van alle fasen van de openbare
      procedure tot aan de gunning van de overheidsopdrachten die in het kader van dit dynamische aankoopsysteem worden
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.144
  - number: 2.144.2
    text: |-
      De aanbestedende dienst laat alle inschrijvers die aan de selectiecriteria voldoen en overeenkomstig de
      aanbestedingsstukken en de eventuele aanvullende documenten een indicatieve inschrijving hebben ingediend, tot het
      dynamische aankoopsysteem toe.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.144
  - number: 2.144.3
    text: |-
      Een aanbestedende dienst staat toe dat indicatieve inschrijvingen te allen tijde kunnen worden verbeterd, mits zij
      niet afwijken van de aanbestedingsstukken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.144
  - number: 2.145.1
    text: |-
      Voor het opzetten van een dynamisch aankoopsysteem en voor de plaatsing van overheidsopdrachten in
      het kader hiervan gebruikt een aanbestedende dienst elektronische middelen overeenkomstig de krachtens
      [artikel 4.12, eerste lid][ref1], gestelde regels omtrent elektronische middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.145
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.2'
        afdeling: 4.2.1
  - number: 2.145.2
    text: 'Bij de instelling van een dynamisch aankoopsysteem:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.145
  - number: 2.145.2.a
    text: |-
      maakt de aanbestedende dienst een aankondiging van een overheidsopdracht bekend en geeft daarbij aan dat het om een
      dynamisch aankoopsysteem gaat,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.145
  - number: 2.145.2.b
    text: |-
      verstrekt de aanbestedende dienst in de aanbestedingsstukken nadere gegevens over onder andere de aard van de
      overwogen aankopen waarop het dynamische aankoopsysteem betrekking heeft, alle nodige informatie omtrent het
      aankoopsysteem, de gebruikte elektronische apparatuur en de nadere technische bepalingen en specificaties voor de
      verbinding, en
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.145
  - number: 2.145.2.c
    text: |-
      biedt de aanbestedende dienst tegelijk met de bekendmaking van de aankondiging en tot aan het vervallen van
      het dynamische aankoopsysteem langs elektronische weg een vrije, rechtstreekse en volledige toegang tot de
      aanbestedingsstukken en alle aanvullende documenten en geeft de aanbestedende dienst in de aankondiging het
      internetadres aan waar deze documenten kunnen worden geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.145
  - number: 2.146.1
    text: |-
      Een ondernemer kan een indicatieve inschrijving indienen om toegelaten te worden tot een dynamische aankoopsysteem
      onder de voorwaarden, bedoeld in [artikel 2.144, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.146
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.2
  - number: 2.146.2
    text: De aanbestedende dienst beoordeelt de indicatieve inschrijving binnen vijftien dagen na indiening.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.146
  - number: 2.146.3
    text: |-
      De aanbestedende dienst kan de termijn, bedoeld in het tweede lid, verlengen, mits er tussentijds geen aankondiging
      van een overheidsopdracht wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.146
  - number: 2.146.4
    text: |-
      De aanbestedende dienst deelt een ondernemer als bedoeld in het eerste lid zo snel mogelijk mee dat hij is
      toegelaten tot het dynamische aankoopsysteem of dat zijn indicatieve inschrijving is afgewezen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.146
  - number: 2.147.1
    text: |-
      Alvorens een aankondiging voor een specifieke opdracht bekend te maken, maakt de aanbestedende dienst een
      vereenvoudigde aankondiging bekend waarin alle belangstellende ondernemers worden uitgenodigd om overeenkomstig
      [artikel 2.146, eerste lid][ref1], een indicatieve inschrijving in te dienen binnen een termijn van ten minste
      vijftien dagen, te rekenen vanaf de verzenddatum van de vereenvoudigde aankondiging.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.147
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.2
  - number: 2.147.2
    text: |-
      De aanbestedende dienst maakt een aankondiging voor een specifieke opdracht niet eerder bekend dan nadat de
      beoordeling is afgerond van alle indicatieve inschrijvingen die binnen de termijn, bedoeld in het eerste lid, zijn
      ingediend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.147
  - number: 2.148.1
    text: |-
      De aanbestedende dienst nodigt alle tot het dynamische aankoopsysteem toegelaten ondernemers uit om voor een
      specifieke overheidsopdracht die binnen dat dynamische aankoopsysteem wordt geplaatst een inschrijving in
      te dienen. Daartoe stelt de aanbestedende dienst een voldoende lange termijn vast voor het indienen van de
      inschrijvingen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.148
  - number: 2.148.2
    text: |-
      De aanbestedende dienst kan de overheidsopdracht gunnen aan de inschrijver die de beste inschrijving heeft
      ingediend op grond van de gunningscriteria die zijn vermeld in de aankondiging van de overheidsopdracht waarbij het
      dynamische aankoopsysteem wordt ingesteld. Deze criteria kunnen gepreciseerd worden in de uitnodiging, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.148
  - number: 2.149.1
    text: Een dynamisch aankoopsysteem duurt niet langer dan vier jaar.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.149
  - number: 2.149.2
    text: |-
      De aanbestedende dienst kan in uitzonderlijke, naar behoren gemotiveerde, gevallen van de termijn, bedoeld in het
      eerste lid, afwijken
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.149
  - number: 2.149.3
    text: |-
      De aanbestedende dienst maakt geen gebruik van een dynamisch aankoopsysteem om de mededinging te hinderen, te
      beperken of te vervalsen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.149
  - number: 2.149.4
    text: |-
      De aanbestedende dienst die gebruik maakt van een dynamisch aankoopsysteem, brengt aan de betrokken ondernemers
      geen administratiekosten in rekening.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.149
  - number: 2.150.1
    text: |-
      Een aanbestedende dienst kan teneinde die aannemer te kiezen die het meest geschikt is om mee samen te werken, een
      bijzondere procedure voor de gunning toepassen bij overheidsopdrachten betreffende het ontwerpen en bouwen van een
      complex sociale woningen waarvoor wegens de omvang, de complexiteit en de vermoedelijke duur van de desbetreffende
      werken, het plan van meet af aan wordt opgesteld op grond van een nauwe samenwerking in een team bestaande uit de
      afgevaardigden van de aanbestedende dienst, deskundigen en de aannemer die met de uitvoering van de werken wordt
      belast.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.150
  - number: 2.150.2
    text: |-
      Een aanbestedende dienst geeft in de aankondiging van de overheidsopdracht een zo nauwkeurig mogelijke beschrijving
      van de werken, bedoeld in het eerste lid, opdat de belangstellende aannemers zich een duidelijk beeld van het uit
      te voeren project kunnen vormen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.150
  - number: 2.150.3
    text: |-
      Een aanbestedende dienst vermeldt in deze aankondiging, overeenkomstig de kwalitatieve selectiecriteria, bedoeld
      in [afdeling 2.3.6][ref1], aan welke persoonlijke, technische, economische en financiële voorwaarden de gegadigden
      dienen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel2.150
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        afdeling: 2.3.6
  - number: 2.150.4
    text: |-
      Indien een aanbestedende dienst van de procedure, bedoeld in het eerste lid, gebruik maakt, past
      hij de [artikelen 2.54, eerste lid][ref1], [2.56][ref2], [2.58][ref3], [2.60][ref4], [2.61][ref5],
      [2.62, eerste lid][ref6], [2.68][ref7], [2.71, vierde en vijfde lid][ref8], [afdeling 2.3.6][ref9], de
      [artikelen 2.130][ref10], [2.132][ref11], [2.133][ref12], en [2.135 tot en met 2.138][ref13] toe en maakt voor het
      plaatsen van de opdrachten gebruik van het elektronische systeem voor aanbestedingen.


