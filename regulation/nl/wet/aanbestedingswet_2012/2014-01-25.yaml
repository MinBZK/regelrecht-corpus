      - id: ref2
        bwb_id: BWBR0032203
      - id: ref3
        bwb_id: BWBR0032203
  - number: 1.9.3.b
    text: |-
      ingeval van toepasselijkheid van [artikel 1.7][ref1], onderdelen b en c: indien met overeenkomstige toepassing
      van het bepaalde bij of krachtens [deel 2][ref2] of [deel 3][ref3] van deze wet geen verplichting geldt tot het
      bekendmaken van een aankondiging van het voornemen tot het plaatsen van een opdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032203
