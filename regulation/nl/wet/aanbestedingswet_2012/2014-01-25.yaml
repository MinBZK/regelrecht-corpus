    text: |-
      de [Aanbestedingswet op defensie- en veiligheidsgebied][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0032898
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.30a
    references:
      - id: ref1
