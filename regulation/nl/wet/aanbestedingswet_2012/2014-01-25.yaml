preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is richtlijn nr. 2004/17/EG van het Europees Parlement
    en de Raad van de Europese Unie van 31 maart 2004 houdende coördinatie van de procedures voor het plaatsen
    van opdrachten in de sectoren water- en energievoorziening, vervoer en postdiensten (PbEU L 134) en richtlijn
    nr. 2004/18/EG van het Europees Parlement en de Raad van de Europese Unie van 31 maart 2004 betreffende de
    coördinatie van de procedures voor het plaatsen van overheidsopdrachten voor werken, leveringen en diensten (PbEU
    L 134) opnieuw te implementeren ten behoeve van een goede uitvoering en naleving van de uit deze richtlijnen
    voortvloeiende voorschriften, en ten behoeve van verbetering en vereenvoudiging van de integriteitstoetsing en
    van voorschriften van administratieve aard, en voorts ook enige regels van inhoudelijke en administratieve aard te
    stellen met betrekking tot andere opdrachten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aanbestedende dienst:* de staat, een
      provincie, een gemeente, een waterschap of een publiekrechtelijke instelling dan wel een samenwerkingsverband van
      deze overheden of publiekrechtelijke instellingen;
        - *aanbestedingsstukken:* alle documenten in een aanbestedingsprocedure die door de aanbestedende dienst of het
      speciale-sectorbedrijf in de procedure zijn gebracht;
        - *aankoopcentrale:* een aanbestedende dienst die voor aanbestedende diensten onderscheidenlijk speciale-
      sectorbedrijven bestemde leveringen of diensten verwerft of opdrachten plaatst met betrekking tot voor
      aanbestedende diensten of speciale-sectorbedrijven bestemde werken, leveringen of diensten;
        - *aannemer:* een ieder die de uitvoering van werken op de markt aanbiedt;
        - *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *bijzonder recht:* een recht dat bij wettelijk voorschrift of bij besluit van een bestuursorgaan aan een
      beperkt aantal ondernemingen wordt verleend en waarbij binnen een bepaald geografisch gebied: a. het aantal van
      deze ondernemingen die een dienst mogen verrichten of een activiteit mogen uitoefenen op een andere wijze dan
      volgens objectieve, evenredige en niet-discriminerende criteria tot twee of meer wordt beperkt, b. verscheidene
      concurrerende ondernemingen die een dienst mogen verrichten of een activiteit mogen uitoefenen op een andere
      wijze dan volgens deze criteria worden aangewezen, of c. op een andere wijze dan volgens deze criteria aan een of
      meer ondernemingen die een dienst mogen verrichten of een activiteit mogen uitoefenen voordelen worden toegekend,
      waardoor enige andere onderneming aanzienlijk wordt belemmerd in de mogelijkheid om dezelfde activiteiten binnen
      hetzelfde geografische gebied onder in wezen dezelfde omstandigheden uit te oefenen;
        - *concessieovereenkomst voor diensten:* een overeenkomst met dezelfde kenmerken als een overheidsopdracht of
      speciale-sectoropdracht voor diensten waarbij de tegenprestatie voor de te verrichten diensten bestaat uit het
      recht de dienst te exploiteren, al dan niet gecombineerd met een betaling;
        - *concessieovereenkomst voor openbare werken:* een overeenkomst met dezelfde kenmerken als een overheidsopdracht
      of speciale-sectoropdracht voor werken waarbij de tegenprestatie voor de uit te voeren werken bestaat uit het recht
      het werk te exploiteren, al dan niet gecombineerd met een betaling;
        - *dienstverlener:* een ieder die diensten op de markt aanbiedt;
        - *dynamisch aankoopsysteem:* een elektronisch proces voor het doen van gangbare aankopen met algemeen op de markt
      beschikbare kenmerken, beperkt in de tijd en gedurende de gehele looptijd open voor een ondernemer die voldoet aan
      de selectiecriteria en die overeenkomstig de eisen van de aanbestedingsstukken een indicatieve inschrijving heeft
      gedaan;
        - *eigen verklaring:* een verklaring als bedoeld in [artikel 2.84, eerste lid][ref2];
        - *elektronisch middel:* een middel waarbij gebruik wordt gemaakt van elektronische apparatuur voor
      gegevensverwerking (met inbegrip van digitale compressie) en gegevensopslag, alsmede van verspreiding, overbrenging
      en ontvangst door middel van draden, straalverbindingen, optische middelen of andere elektromagnetische middelen;
        - *elektronisch systeem voor aanbestedingen:* het elektronische systeem voor aanbestedingen, bedoeld in
      [artikel 4.13][ref3];
        - *elektronische veiling:* een zich herhalend elektronisch proces voor de presentatie van nieuwe, verlaagde
      prijzen of van nieuwe waarden voor bepaalde elementen van de inschrijvingen, dat plaatsvindt na de eerste volledige
      beoordeling van de inschrijvingen en dat klassering op basis van elektronische verwerking mogelijk maakt;
        - *gedragsverklaring aanbesteden:* een verklaring als bedoeld in [artikel 4.1][ref4];
        - *gegadigde:* een ondernemer die bij toepassing van de niet-openbare procedure, de procedure van de
      concurrentiegerichte dialoog of de onderhandelingsprocedure heeft verzocht om toegelaten te worden tot de
      procedure;
        - *gunningsbeslissing:* de keuze van de aanbestedende dienst of het speciale sectorbedrijf voor de ondernemer met
      wie hij voornemens is de overeenkomst waarop de procedure betrekking had te sluiten, waaronder mede wordt verstaan
      de keuze om geen overeenkomst te sluiten;
        - *inschrijver:* een ondernemer die een inschrijving heeft ingediend;
        - *leverancier:* een ieder die producten op de markt aanbiedt;
        - *mededeling van de gunningsbeslissing:* een schriftelijke kennisgeving die voldoet aan de in
      [artikel 2.130][ref5] gestelde eisen;
        - *niet-openbare procedure:* procedure waarbij alle ondernemers een verzoek mogen doen tot deelneming, maar alleen
      de door de aanbestedende dienst of het speciale-sectorbedrijf geselecteerde ondernemers mogen inschrijven;
        - *ondernemer:* een aannemer, leverancier of dienstverlener;
        - *onderhandelingsprocedure:* procedure waarbij de aanbestedende dienst of het speciale-sectorbedrijf met door hem
      geselecteerde ondernemers overleg pleegt en door middel van onderhandelingen met een of meer van hen de voorwaarden
      voor de opdracht vaststelt;
        - *Onze Minister:* Onze Minister van Economische Zaken;
        - *openbare procedure:* procedure waarbij alle ondernemers mogen inschrijven;
        - *Overeenkomst inzake overheidsopdrachten:* de Overeenkomst van de Wereldhandelsorganisatie (WHO) inzake
      overheidsopdrachten en de uit de multilaterale handelsbesprekingen in het kader van de Uruguay-ronde (1986–1994)
      voortvloeiende overeenkomsten (PbEG L 1994, 336);
        - *overheidsbedrijf:* een bedrijf waarop een aanbestedende dienst rechtstreeks of middellijk een overheersende
      invloed kan uitoefenen uit hoofde van eigendom, financiële deelneming of de op het bedrijf van toepassing zijnde
      voorschriften;
        - *overheidsopdracht:* een overheidsopdracht voor werken, een overheidsopdracht voor leveringen, een
      overheidsopdracht voor diensten of een raamovereenkomst;
        - *overheidsopdracht voor diensten:* een schriftelijke overeenkomst onder bezwarende titel die is gesloten tussen
      een of meer dienstverleners en een of meer aanbestedende diensten en die a. uitsluitend betrekking heeft op het
      verrichten van in bijlage II van [richtlijn nr. 2004/18/EG](32004L0018) aangewezen diensten, b. betrekking heeft
      op het leveren van producten en het verrichten van diensten als bedoeld in onderdeel a, indien de waarde van
      die diensten hoger is dan de waarde van de te leveren producten, of c. betrekking heeft op het verrichten van in
      bijlage II van [richtlijn nr. 2004/18/EG](32004L0018) aangewezen dienstenen die slechts zijdelings betrekking heeft
      op werkzaamheden die in het kader van bijlage I van [richtlijn nr. 2004/18/EG](32004L0018) zijn aangewezen;
        - *overheidsopdracht voor leveringen:* een schriftelijke overeenkomst onder bezwarende titel die is gesloten tussen
      een of meer leveranciers en een of meer aanbestedende diensten en die betrekking heeft op: a. de aankoop, leasing,
      huur of huurkoop, met of zonder koopoptie, van producten of b. de levering van producten en die slechts zijdeling
      betrekking heeft op werkzaamheden voor het aanbrengen en installeren van die levering;
        - *overheidsopdracht voor werken:* een schriftelijke overeenkomst onder bezwarende titel die is gesloten tussen een
      of meer aannemers en een of meer aanbestedende diensten en die betrekking heeft op: a. de uitvoering of het ontwerp
      en de uitvoering van werken in het kader van in bijlage I van [richtlijn nr. 2004/18/EG](32004L0018) aangewezen
      werkzaamheden, b. de uitvoering of het ontwerp en de uitvoering van een werk, of c. het laten uitvoeren met welke
      middelen dan ook van een werk dat aan de door de aanbestedende dienst vastgestelde eisen voldoet;
        - *prijsvraag:* procedure die tot doel heeft een aanbestedende dienst of een speciale-sectorbedrijf een plan of
      een ontwerp te verschaffen dat na een oproep tot mededinging door een jury wordt geselecteerd, al dan niet met
      toekenning van prijzen;
        - *procedure van de concurrentiegerichte dialoog:* procedure waarbij alle ondernemers een verzoek mogen doen tot
      deelneming en waarbij de aanbestedende dienst een dialoog voert met de tot de procedure toegelaten ondernemers,
      teneinde een of meer oplossingen te zoeken die aan de behoeften van de aanbestedende dienst beantwoorden en op
      grond waarvan de geselecteerde ondernemers zullen worden uitgenodigd om in te schrijven;
        - *publiekrechtelijke instelling:* een instelling die specifiek ten doel heeft te voorzien in behoeften van
      algemeen belang, anders dan van industriële of commerciële aard, die rechtspersoonlijkheid bezit en waarvan:
      a. de activiteiten in hoofdzaak door de staat, een provincie, een gemeente, een waterschap of een andere
      publiekrechtelijke instelling worden gefinancierd, b. het beheer is onderworpen aan toezicht door de staat, een
      provincie, een gemeente, een waterschap of een andere publiekrechtelijke instelling of c. de leden van het bestuur,
      het leidinggevend of toezichthoudend orgaan voor meer dan de helft door de staat, een provincie, een gemeente, een
      waterschap of een andere publiekrechtelijke instelling zijn aangewezen;
        - *raamovereenkomst:* een schriftelijke overeenkomst tussen een of meer aanbestedende diensten of speciale-
      sectorbedrijven en een of meer ondernemers met het doel gedurende een bepaalde periode de voorwaarden inzake te
      plaatsen overheidsopdrachten of speciale-sectoropdrachten vast te leggen;
        - *richtlijn nr. 2004/17/EG:* [richtlijn nr. 2004/17/EG](32004L0017) van het Europees Parlement en de raad van de
      Europese Unie van 31 maart 2004 houdende coördinatie van de procedures in de sectoren water- en energievoorziening,
      vervoer en postdiensten (PbEU L 134);
        - *richtlijn nr. 2004/18/EG:* [richtlijn nr. 2004/18/EG](32004L0018) van het Europees Parlement en de Raad
      van de Europese Unie van 31 maart 2004 betreffende de coördinatie van de procedures voor het plaatsen van
      overheidsopdrachten voor werken, leveringen en diensten (PbEU L 134);
        - *schriftelijk:* elk uit woorden of cijfers bestaand geheel dat kan worden gelezen, gereproduceerd en vervolgens
      medegedeeld, daaronder begrepen met elektronische middelen overgebrachte of opgeslagen informatie;
        - *speciale-sectorbedrijf:* a. een aanbestedende dienst, b. een overheidsbedrijf, c. een bedrijf
      of instelling waaraan door een aanbestedende dienst een bijzonder recht of een uitsluitend recht is
      verleend, voorzover die dienst, dat bedrijf of die instelling een activiteit uitoefent als bedoeld in de
      [artikelen 3.1 tot en met 3.6][ref6], tenzij de desbetreffende activiteit op grond van [artikel 3.21][ref7] is
      uitgezonderd;
        - *speciale-sectoropdracht:* een speciale-sectoropdracht voor werken, een speciale-sectoropdracht voor leveringen,
      een speciale-sectoropdracht voor diensten of een raamovereenkomst;
        - *speciale-sectoropdracht voor diensten:* een schriftelijke overeenkomst onder bezwarende titel die tussen een of
      meer dienstverleners en een of meer speciale-sectorbedrijven is gesloten en die: a. uitsluitend betrekking heeft op
      verrichten van in bijlage XVI van [richtlijn nr. 2004/17/EG](32004L0017) aangewezen diensten, b. betrekking heeft
      op het leveren van de producten en het verrichten van diensten als bedoeld in onderdeel a, indien de waarde van die
      diensten hoger is dan de waarde van de te leveren producten, of c. betrekking heeft op het verrichten van diensten
      als bedoeld in onderdeel a, en die slechts zijdelings betrekking heeft op in het kader van in bijlage XII van
      [richtlijn nr. 2004/17/EG](32004L0017) aangewezen werkzaamheden;
        - *speciale-sectoropdracht voor leveringen:* een schriftelijke overeenkomst onder bezwarende titel die tussen een
      of meer leveranciers en een of meer speciale-sectorbedrijven is gesloten en die betrekking heeft op: a. de aankoop,
      leasing, huur of huurkoop, met of zonder koopoptie, van producten of b. de levering van producten en die slechts
      zijdeling betrekking heeft op werkzaamheden voor het aanbrengen en installeren van die levering;
        - *speciale-sectoropdracht voor werken:* een schriftelijke overeenkomst onder bezwarende titel die tussen een of
      meer aannemers en een of meer speciale-sectorbedrijven is gesloten en die betrekking heeft op: a. de uitvoering of
      het ontwerp en de uitvoering van werken in het kader van in bijlage XII van [richtlijn nr. 2004/17/EG](32004L0017)
      aangewezen werkzaamheden, b. de uitvoering of het ontwerp en de uitvoering van een werk of c. het laten uitvoeren
      met welke middelen dan ook van een werk dat aan de door het speciale-sectorbedrijf vastgestelde eisen voldoet;
        - *uitsluitend recht:* een recht dat bij wettelijk voorschrift of bij besluit van een bestuursorgaan aan een
      onderneming wordt verleend, waarbij voor die onderneming het recht wordt voorbehouden om binnen een bepaald
      geografisch gebied een dienst te verrichten of een activiteit uit te oefenen;
        - *werk:* het product van het geheel van bouwkundige of civieltechnische werken dat ertoe bestemd is als zodanig
      een economische of technische functie te vervullen.


