  - number: '1.2'
    text: |-
      Overheersende invloed als bedoeld in de begripsomschrijving van overheidsbedrijf in [artikel 1.1][ref1] wordt
      voor de toepassing van het bepaalde bij of krachtens deze wet vermoed indien een aanbestedende dienst, al dan niet
      rechtstreeks, ten aanzien van dat bedrijf:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel1
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '1'
        hoofdstuk: '1.1'
  - number: 1.2.a
    text: de meerderheid van het geplaatste kapitaal bezit,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.2
  - number: 1.2.b
    text: over de meerderheid van de stemmen beschikt die aan de door het bedrijf uitgegeven aandelen zijn verbonden of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.2
  - number: 1.2.c
    text: |-
      meer dan de helft van de leden van het bestuurs-, leidinggevend of toezichthoudend orgaan van het bedrijf kan
      benoemen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.2
  - number: 1.3.1
    text: |-
      Een wijziging van bijlage I of bijlage II van [richtlijn nr. 2004/18/EG](32004L0018) of van bijlage XII of bijlage
      XVI van [richtlijn nr. 2004/17/EG](32004L0017) gaat voor de toepassing van de in deze wet gegeven omschrijvingen
      van overheidsopdracht voor werken, overheidsopdracht voor diensten onderscheidenlijk speciale-sectoropdracht voor
      werken of speciale-sectoropdracht voor diensten gelden met ingang van de dag waarop het desbetreffende besluit van
      de Europese Commissie in werking treedt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.3
  - number: 1.3.2
    text: Onze Minister doet mededeling in de Staatscourant van een besluit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.3
  - number: 1.4.1
    text: |-
      Een aanbestedende dienst die of een speciale-sectorbedrijf dat voornemens is een schriftelijke overeenkomst onder
      bezwarende titel tot het verrichten van werken, leveringen of diensten te sluiten, bepaalt op basis van objectieve
      criteria:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.4
  - number: 1.4.1.a
    text: |-
      de keuze voor de wijze waarop de aanbestedende dienst of het speciale-sectorbedrijf voornemens is de overeenkomst
      tot stand te brengen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.4
  - number: 1.4.1.b
    text: de keuze voor de ondernemer of ondernemers die worden toegelaten tot de aanbestedingsprocedure.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.4
  - number: 1.4.2
    text: |-
      De aanbestedende dienst of het speciale-sectorbedrijf draagt zorg voor het leveren van zo veel mogelijk
      maatschappelijke waarde voor de publieke middelen bij het aangaan van een schriftelijke overeenkomst als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.4
  - number: 1.4.3
    text: |-
      De aanbestedende dienst of het speciale-sectorbedrijf verstrekt een ondernemer op diens schriftelijk verzoek de
      motivering van de in het eerste lid, onderdelen a en b, bedoelde keuze.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.4
  - number: 1.5.1
    text: |-
      Een aanbestedende dienst of speciale-sectorbedrijf voegt opdrachten niet onnodig samen. Alvorens samenvoeging
      plaatsvindt, wordt in ieder geval acht geslagen op:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.5
  - number: 1.5.1.a
    text: |-
      de samenstelling van de relevante markt en de invloed van de samenvoeging op de toegang tot de opdracht voor
      voldoende bedrijven uit het midden- en kleinbedrijf;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.5
  - number: 1.5.1.b
    text: |-
      de organisatorische gevolgen en risico's van de samenvoeging van de opdrachten voor de aanbestedende dienst, het
      speciale-sectorbedrijf en de ondernemer;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.5
  - number: 1.5.1.c
    text: de mate van samenhang van de opdrachten.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.5
  - number: 1.5.2
    text: |-
      Indien samenvoeging van opdrachten plaatsvindt, wordt dit door de aanbestedende dienst of het speciale-
      sectorbedrijf gemotiveerd in de aanbestedingsstukken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.5
  - number: 1.5.3
    text: |-
      Een aanbestedende dienst of een speciale-sectorbedrijf deelt een opdracht op in meerdere percelen, tenzij hij
      dit niet passend acht, in welk geval de aanbestedende dienst of het speciale-sectorbedrijf dit motiveert in de
      aanbestedingsstukken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.5
  - number: '1.6'
    text: |-
      Aanbestedende diensten die voornemens zijn een schriftelijke overeenkomst onder bezwarende titel tot het verrichten
      van werken, leveringen of diensten te sluiten, dragen zorg voor een zo groot mogelijke beperking van de met de
      totstandkoming van die overeenkomst samenhangende en daaruit voortvloeiende administratieve lasten.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.6
  - number: '1.7'
    text: 'De bepalingen in deze afdeling gelden voor aanbestedende diensten en speciale-sectorbedrijven bij:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel1.7
  - number: 1.7.a
    text: |-
      het plaatsen van een overheidsopdracht of speciale-sectoropdracht, het sluiten van een concessieovereenkomst
      voor openbare werken of het uitschrijven van een prijsvraag die op grond van het bepaalde bij of krachtens de
      [hoofdstukken 2.1][ref1] en [3.1][ref2] onder het toepassingsbereik van onderscheidenlijk [deel 2][ref3] of
      [deel 3][ref4] van de wet valt;


