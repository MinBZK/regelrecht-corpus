  - number: 3.31.1
    text: |-
      Ondernemingen die werkzaam zijn op het gebied van verkenning, opsporing of winning van delfstoffen, bedoeld in
      beschikking nr. 93/676/EEG van de Commissie van de Europese Gemeenschappen van 10 december 1993 (PbEG L 316)
      waarbij wordt vastgesteld dat de exploitatie van geografische gebieden met het oogmerk van prospectie of winning
      van aardolie of gas in Nederland niet een relevante activiteit vormt in de zin van artikel 2, tweede lid, onder
      b, punt i, van [richtlijn nr. 90/531/EEG](31990L0531) van de Raad en dat de diensten welke deze activiteit
      uitoefenen in Nederland niet geacht worden in aanmerking te komen voor bijzondere of uitsluitende rechten in de
      zin van artikel 2, derde lid, onder b, van deze richtlijn, stellen, voordat zij een schriftelijke overeenkomst
      onder bezwarende titel sluit tot het verrichten van werken, leveringen of diensten, die overeenkomst open voor
      concurrentie.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.31
  - number: 3.31.2
    text: |-
      Een onderneming als bedoeld in het eerste lid doet mededeling van het sluiten van overeenkomsten als bedoeld in
      dat lid overeenkomstig de voorwaarden, gesteld in beschikking nr. 93/327/EEG van de Commissie van de Europese
      Gemeenschappen van 13 mei 1993 tot vaststelling van de voorwaarden waaronder speciale-sectorbedrijfen die
      geografische gebieden exploiteren ter wille van de prospectie en de winning van aardolie, gas, steenkool of andere
      vaste brandstoffen, aan de Commissie informatie moeten verstrekken inzake door hen gegunde opdrachten (PbEG L 129).
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.31
  - number: '3.32'
    text: |-
      Het speciale-sectorbedrijf past voor het plaatsen van een opdracht de openbare procedure, de niet-openbare
      procedure of de onderhandelingsprocedure met aankondiging toe.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.32
  - number: '3.33'
    text: |-
      Het speciale-sectorbedrijf dat de openbare procedure toepast doorloopt de volgende stappen. Het speciale-
      sectorbedrijf:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.33
  - number: 3.33.a
    text: maakt een aankondiging van de speciale-sectoropdracht bekend;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.33
  - number: 3.33.b
    text: toetst of een inschrijver voldoet aan de door het speciale-sectorbedrijf gestelde eisen of de erkenningsregeling;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.33
  - number: 3.33.c
    text: |-
      toetst of de inschrijvingen voldoen aan de door het speciale-sectorbedrijf gestelde technische specificaties, eisen
      en normen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.33
  - number: 3.33.d
    text: |-
      beoordeelt de geldige inschrijvingen aan de hand van het door het speciale-sectorbedrijf gestelde
      gunningscriterium, bedoeld in [artikel 2.114][ref1] en de nadere criteria, bedoeld in [artikel 2.115][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
  - number: 3.33.e
    text: deelt de gunningsbeslissing mee;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.33
  - number: 3.33.f
    text: kan de overeenkomst sluiten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.33
  - number: 3.33.g
    text: maakt de aankondiging van de gegunde opdracht bekend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.33
  - number: '3.34'
    text: |-
      Het speciale-sectorbedrijf dat de niet-openbare procedure toepast doorloopt de volgende stappen. Het speciale-
      sectorbedrijf:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.34
  - number: 3.34.a
    text: maakt een aankondiging van de speciale-sectoropdracht bekend;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.34
  - number: 3.34.b
    text: toetst of een gegadigde voldoet aan de door het speciale-sectorbedrijf gestelde eisen of de erkenningsregeling;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.34
  - number: 3.34.c
    text: nodigt de niet-uitgesloten of niet-afgewezen gegadigden uit om een inschrijving in te dienen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.34
  - number: 3.34.d
    text: |-
      toetst of de inschrijvingen voldoen aan de door het speciale-sectorbedrijf gestelde technische specificaties, eisen
      en normen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.34
  - number: 3.34.e
    text: |-
      beoordeelt de geldige inschrijvingen aan de hand van het door het speciale-sectorbedrijf gestelde gunningscriterium
      en de nadere criteria, bedoeld in [artikel 2.115][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
  - number: 3.34.f
    text: deelt de gunningsbeslissing mee;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.34
  - number: 3.34.g
    text: kan de overeenkomst sluiten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.34
  - number: 3.34.h
    text: maakt de aankondiging van de gegunde opdracht bekend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.34
  - number: '3.35'
    text: |-
      Het speciale-sectorbedrijf dat de onderhandelingsprocedure met aankondiging toepast doorloopt de volgende stappen.
      Het speciale-sectorbedrijf:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.35
  - number: 3.35.a
    text: maakt een aankondiging van de speciale-sectoropdracht bekend;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.35
  - number: 3.35.b
    text: |-
      toetst of een gegadigde voldoet aan de door het speciale-sectorbedrijf gestelde objectieve criteria of de
      erkenningsregeling;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.35
  - number: 3.35.c
    text: |-
      toetst of een niet uitgesloten gegadigde voldoet aan de door het speciale-sectorbedrijf gestelde
      geschiktheidseisen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.35
  - number: 3.35.d
    text: kan met de niet-uitgesloten of niet-afgewezen gegadigden in overleg treden;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.35
  - number: 3.35.e
    text: nodigt de niet uitgesloten of niet afgewezen gegadigden uit tot inschrijving;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.35
  - number: 3.35.f
    text: |-
      toetst of de inschrijvingen voldoen aan de door het speciale-sectorbedrijf gestelde technische specificaties, eisen
      en normen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.35
  - number: 3.35.g
    text: kan met de inschrijvers in overleg treden;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.35
  - number: 3.35.h
    text: kan de inschrijvers vragen de inschrijving aan te vullen of een nieuwe inschrijving te doen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.35
  - number: 3.35.i
    text: |-
      beoordeelt de geldige inschrijvingen aan de hand van het door het speciale-sectorbedrijf gestelde
      gunningscriterium, bedoeld in [artikel 2.114][ref1], en de nadere criteria, bedoeld in [artikel 2.115][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
  - number: 3.35.j
    text: onderhandelt met de inschrijvers;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.35
  - number: 3.35.k
    text: deelt de gunningsbeslissing mee;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.35
  - number: 3.35.l
    text: kan de overeenkomst sluiten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.35
  - number: 3.35.m
    text: maakt de aankondiging van de gegunde opdracht bekend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.35
  - number: '3.36'
    text: 'Het speciale-sectorbedrijf kan de onderhandelingsprocedure zonder aankondiging toepassen indien:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.36
  - number: 3.36.a
    text: |-
      bij toepassing van de niet-openbare procedure, de openbare procedure geen of geen geschikte inschrijvingen of geen
      verzoeken tot deelneming zijn ingediend en de oorspronkelijke voorwaarden van de opdracht niet wezenlijk worden
      gewijzigd;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.36
  - number: 3.36.b
    text: |-
      een opdracht ten behoeve van onderzoek, proefneming, studie of ontwikkeling wordt geplaatst en zonder het doel de
      rentabiliteit te verzekeren dan wel de kosten van onderzoek en ontwikkeling te dekken, voor zover de plaatsing van
      een dergelijke opdracht niet verhindert dat een aankondiging wordt gedaan voor latere opdrachten die dit doel in
      het bijzonder beogen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.36
  - number: 3.36.c
    text: |-
      de uitvoering van de opdracht om technische of artistieke redenen of om redenen van bescherming van uitsluitende
      rechten slechts aan een bepaalde ondernemer kan worden toevertrouwd,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.36
  - number: 3.36.d
    text: |-
      voor zover zulks strikt noodzakelijk is, ingeval de termijnen van de niet-openbare procedure, de openbare procedure
      of de onderhandelingsprocedure met aankondiging wegens dwingende spoed niet in acht kunnen worden genomen als
      gevolg van gebeurtenissen die door het speciale-sectorbedrijf niet konden worden voorzien.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.36
  - number: '3.37'
    text: 'Het speciale-sectorbedrijf kan de onderhandelingsprocedure zonder aankondiging toepassen:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.37
  - number: 3.37.a
    text: 'voor door de oorspronkelijke leverancier verrichte aanvullende leveringen die bestemd zijn:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.37
  - number: 3.37.a.1°
    text: voor gedeeltelijke vernieuwing van veelvuldig gebruikte leveringen of installaties, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.37
  - number: 3.37.a.2°
    text: |-
      voor de uitbreiding van bestaande leveringen of installaties, indien verandering van leverancier het speciale-
      sectorbedrijf ertoe zou verplichten apparatuur aan te schaffen met andere technische eigenschappen die niet
      verenigbaar zijn met de technische eigenschappen van reeds geleverde apparatuur of zich bij gebruik en onderhoud
      van de aan te schaffen apparatuur onevenredige technische moeilijkheden voordoen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.37
  - number: 3.37.b
    text: |-
      voor aanvullende werken of diensten die niet in het oorspronkelijk gegunde ontwerp, noch in de eerste gegunde
      opdracht waren opgenomen, maar die ten gevolge van een onvoorziene omstandigheid voor de uitvoering van deze
      opdracht noodzakelijk zijn geworden, mits de gunning geschiedt aan de aannemer of dienstverlener die de eerste
      opdracht uitvoert:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.37
  - number: 3.37.b.1°
    text: |-
      indien deze aanvullende werken of diensten technisch of economisch niet los van de hoofdopdracht kunnen worden
      uitgevoerd zonder het speciale-sectorbedrijf grote ongemakken te bezorgen, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.37
  - number: 3.37.b.2°
    text: |-
      indien deze aanvullende werken of diensten, hoewel zij van de uitvoering van de oorspronkelijke opdracht kunnen
      worden gescheiden, strikt noodzakelijk zijn om deze te vervolmaken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.37
  - number: 3.38.1
    text: 'Het speciale-sectorbedrijf kan de onderhandelingsprocedure zonder aankondiging toepassen:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.38
  - number: 3.38.1.a
    text: |-
      ingeval van opdrachten voor werken, indien het gaat om nieuwe werken bestaande uit de herhaling van soortgelijke
      werken die door hetzelfde speciale-sectorbedrijf worden opgedragen aan de aannemer die belast is geweest met een
      eerdere opdracht, mits:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.38
  - number: 3.38.1.a.1°
    text: |-
      deze werken overeenstemmen met een basisproject en dit project het voorwerp vormde van een eerste opdracht die na
      een aankondiging werd gegund, en
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.38
  - number: 3.38.1.a.2°
    text: |-
      het speciale-sectorbedrijf reeds in de aankondiging van de aanbesteding van het basisproject vermeld heeft dat een
      procedure zonder voorafgaande aankondiging kan worden toegepast,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.38
  - number: 3.38.1.b
    text: voor op een grondstoffenmarkt genoteerde en aangekochte leveringen,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.38
  - number: 3.38.1.c
    text: |-
      voor gelegenheidsaankopen, indien zich gedurende zeer korte tijd een bijzonder voordelige gelegenheid tot aankopen
      voordoet en de te betalen prijs aanzienlijk lager ligt dan normaal op de markt het geval is,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.38
  - number: 3.38.1.d
    text: |-
      voor de aankoop van leveringen tegen bijzonder gunstige voorwaarden bij een leverancier die definitief zijn
      handelsactiviteit stopzet, bij curatoren of vereffenaars van een faillissement of een vonnis of bij de toepassing
      van de schuldsaneringsregeling natuurlijke personen of een in andere nationale regelgeving bestaande vergelijkbare
      procedure. of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.38
  - number: 3.38.1.e
    text: |-
      indien de opdracht voor diensten voortvloeit uit een overeenkomstig het bij of krachtens deel 3 van deze wet
      bepaalde georganiseerde prijsvraag en volgens de toepasselijke voorschriften aan de winnaar of aan één van de
      winnaars van die prijsvraag dient te worden gegund.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.38
  - number: 3.38.2
    text: |-
      Bij toepassing van het eerste lid, onderdeel e, worden alle winnaars van de prijsvraag tot deelneming aan de
      onderhandelingen uitgenodigd.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.38
  - number: '3.39'
    text: |-
      Het speciale-sectorbedrijf dat de onderhandelingsprocedure zonder aankondiging toepast doorloopt de in
      [artikel 3.35, onderdelen g tot en met m][ref1], genoemde stappen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.39
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.2'
        afdeling: 3.2.1
  - number: 3.40.1
    text: |-
      Het speciale-sectorbedrijf kan voor een speciale-sectoropdracht betreffende diensten die zijn opgenomen in bijlage
      XVII-B van [richtlijn nr. 2004/17/EG](32004L0017) de procedure voor B-diensten toepassen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.40
  - number: 3.40.2
    text: |-
      Indien de opdracht, bedoeld in het eerste lid, zowel betrekking heeft op diensten als bedoeld in bijlage XVII-A van
      [richtlijn nr. 2004/17/EG](32004L0017) als op diensten als bedoeld in bijlage XVII-B van [richtlijn nr. 2004/17/EG]
      (32004L0017) kan het speciale-sectorbedrijf de procedure voor B-diensten toepassen indien de geraamde waarde van de
      B-diensten gelijk is aan of hoger is dan die van de diensten, bedoeld in bijlage XVII-A van [richtlijn nr. 2004/17/
      EG](32004L0017).
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.40
  - number: 3.41.1
    text: |-
      Het speciale-sectorbedrijf dat de procedure voor B-diensten toepast doorloopt de volgende stappen. Het speciale-
      sectorbedrijf:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.41
  - number: 3.41.1.a
    text: |-
      toetst of de inschrijvingen voldoen aan de door het speciale-sectorbedrijf gestelde technische specificaties, eisen
      en normen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.41
  - number: 3.41.1.b
    text: deelt de resultaten van de gunning mee aan de Europese Commissie;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.41
  - number: 3.41.1.c
    text: kan een aankondiging van de gegunde opdracht bekend maken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.41
  - number: 3.41.2
    text: |-
      Bij toepassing van de procedure voor B-diensten zijn uitsluitend de [paragrafen 3.3.3.1][ref1] en 3.3.7.4 van
      [hoofdstuk 3.3][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk3.3
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk3.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.41
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '3.3'
        paragraaf: 3.3.3.1
        afdeling: 3.3.3
      - id: ref2
        bwb_id: BWBR0032203
        hoofdstuk: '3.3'
  - number: 3.41.3
    text: |-
      In afwijking van het tweede lid is draagt het speciale sectorbedrijf zorg voor een passende mate van openbaarheid
      van de aankondiging van het voornemen tot het plaatsen van een speciale sectoropdracht, indien die opdracht een
      duidelijk grensoverschrijdend belang heeft.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.41
  - number: '3.42'
    text: Een speciale-sectorbedrijf past voor het uitschrijven van een prijsvraag de procedure van een prijsvraag toe.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.42
  - number: 3.43.1
    text: |-
      Het speciale-sectorbedrijf dat de procedure van een prijsvraag toepast, doorloopt de volgende stappen. Het
      speciale-sectorbedrijf:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.43
  - number: 3.43.1.a
    text: maakt een aankondiging van de prijsvraag bekend;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.43
  - number: 3.43.1.b
    text: |-
      toetst of een deelnemer voldoet aan de door het speciale-sectorbedrijf gestelde objectieve criteria of
      erkenningsregeling;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.43
  - number: 3.43.1.c
    text: stelt een jury in.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.43
  - number: 3.43.2
    text: 'De in het eerste lid, onderdeel c, bedoelde jury:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.43
  - number: 3.43.2.a
    text: onderzoekt de ingediende, geanonimiseerde plannen of ontwerpen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.43
  - number: 3.43.2.b
    text: nodigt desgewenst deelnemers uit tot het beantwoorden van vragen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.43
  - number: 3.43.2.c
    text: bepaalt haar oordeel;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.43
  - number: 3.43.2.d
    text: stelt een verslag op met daarin de rangorde van de deelnemers.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.43
  - number: 3.43.3
    text: |-
      Het speciale-sectorbedrijf maakt het oordeel van de jury bekend, voor zover deze tot een oordeel is gekomen, en
      maakt de resultaten van de prijsvraag bekend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.43
  - number: '3.44'
    text: |-
      Een speciale-sectorbedrijf dat een raamovereenkomst wil sluiten, past daartoe de openbare, de niet-
      openbare procedure, de onderhandelingsprocedure met aankondiging of, indien dat op grond van
      [artikelen 3.36 tot en met 3.38][ref1] is toegestaan, de onderhandelingsprocedure zonder aankondiging toe.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.44
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.2'
        paragraaf: 3.2.2.1
        afdeling: 3.2.2
  - number: '3.45'
    text: |-
      Een speciale-sectorbedrijf dat een speciale-sectoropdracht wil plaatsen met gebruikmaking van een raamovereenkomst
      kan de onderhandelingsprocedure zonder aankondiging toepassen, indien deze raamovereenkomst overeenkomstig
      [artikel 3.44][ref1] is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.45
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.2'
        paragraaf: 3.2.3.2
        afdeling: 3.2.3
  - number: '3.46'
    text: |-
      Een speciale-sectorbedrijf maakt geen oneigenlijk gebruik van een raamovereenkomst, met als gevolg dat de
      mededinging zou worden beperkt, verhinderd of vervalst.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.46
  - number: 3.47.1
    text: |-
      Een speciale-sectorbedrijf dat een dynamisch aankoopsysteem wil instellen, past daartoe de openbare procedure toe,
      met uitzondering van de fase van de gunning.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.47
  - number: '3.48'
    text: |-
      Een speciale-sectorbedrijf dat een dynamisch aankoopsysteem instelt met toepassing van de openbare procedure,
      doorloopt de volgende stappen. Het speciale-sectorbedrijf:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.48
  - number: 3.48.a
    text: maakt een aankondiging van de speciale-sectoropdracht bekend;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.48
  - number: 3.48.b
    text: toetst of een inschrijver voldoet aan de door het speciale-sectorbedrijf gestelde objectieve criteria;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.48
  - number: 3.48.c
    text: |-
      toetst of de indicatieve inschrijvingen voldoen aan de door het speciale-sectorbedrijf gestelde technische
      specificaties, eisen en normen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.48
  - number: 3.48.d
    text: |-
      laat de niet-uitgesloten inschrijvers die een geldige inschrijving hebben ingediend toe tot het dynamisch
      aankoopsysteem.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.48
  - number: '3.49'
    text: |-
      De [artikelen 2.50][ref1] en [2.51][ref2] zijn van overeenkomstige toepassing op speciale-sectoropdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.49
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.2'
        paragraaf: 2.2.3.4
        afdeling: 2.2.3
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.2'
        paragraaf: 2.2.3.4
        afdeling: 2.2.3
  - number: '3.50'
    text: |-
      [Afdeling 2.3.1][ref1] is van overeenkomstige toepassing op speciale-sectoropdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.50
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        afdeling: 2.3.1
  - number: 3.51.1
    text: |-
      Een speciale-sectorbedrijf deelt ten minste eenmaal per jaar in een periodieke indicatieve aankondiging die door de
      Europese Commissie of door het speciale-sectorbedrijf zelf via zijn kopersprofiel wordt verspreid, mee:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.51
  - number: 3.51.1.a
    text: |-
      de hoofdkenmerken van de opdrachten voor werken of de raamovereenkomst voor werken die hij voornemens
      is in de loop van de komende twaalf maanden te plaatsen of te sluiten, indien het geraamde bedrag, met
      inachtneming van [afdeling 3.1.3][ref1], gelijk is aan of meer bedraagt dan het bedrag, bedoeld in in
      [artikel 3.8, onderdeel a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk3.1
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '3.1'
        afdeling: 3.1.3
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.1'
        afdeling: 3.1.2
  - number: 3.51.1.b
    text: |-
      het geraamde totale bedrag van de opdrachten voor leveringen of de raamovereenkomst voor leveringen per
      productgroep die hij voornemens is in de loop van de komende twaalf maanden te plaatsen of te sluiten, indien het
      geraamde totale bedrag, met inachtneming van [afdeling 3.1.3][ref1], € 750 000 of meer bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk3.1
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '3.1'
        afdeling: 3.1.3
  - number: 3.51.1.c
    text: |-
      het geraamde totale bedrag van de opdrachten voor diensten of de raamovereenkomst voor diensten voor elk van de
      diensten, genoemd in bijlage XVII-A van [richtlijn nr. 2004/17/EG](32004L0017), die hij voornemens is in de loop
      van de komende twaalf maanden te plaatsen of te sluiten, indien het geraamde totale bedrag, met inachtneming van
      [afdeling 3.1.3][ref1], € 750 000 of meer bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk3.1
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '3.1'
        afdeling: 3.1.3
  - number: 3.51.2
    text: |-
      [Artikel 2.59][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.1
        afdeling: 2.3.2
  - number: 3.52.1
    text: |-
      Een speciale-sectorbedrijf zendt de periodieke indicatieve aankondiging, bedoeld in
      [artikel 3.51, eerste lid, onderdeel a][ref1], zo spoedig mogelijk nadat de beslissing is genomen tot goedkeuring
      van het programma voor de speciale-sectoropdrachten voor werken die het speciale-sectorbedrijf voornemens is te
      plaatsen of te sluiten, met behulp van het elektronische systeem voor aanbestedingen toe aan de Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.52
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.3'
        paragraaf: 3.3.2.1
        afdeling: 3.3.2
  - number: 3.52.2
    text: |-
      Een speciale-sectorbedrijf zendt de periodieke indicatieve aankondiging, bedoeld in
      [artikel 3.51, eerste lid, onderdelen b en c][ref1], zo spoedig mogelijk na het begin van het begrotingsjaar met
      gebruikmaking van het elektronische systeem voor aanbestedingen toe aan de Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.52
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.3'
        paragraaf: 3.3.2.1
        afdeling: 3.3.2
  - number: 3.53.1
    text: |-
      In afwijking van [artikel 3.52][ref1] kan het speciale-sectorbedrijf de periodieke indicatieve aankondiging ook
      bekend maken op zijn kopersprofiel.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.53
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.3'
        paragraaf: 3.3.2.1
        afdeling: 3.3.2
  - number: 3.53.2
    text: |-
      [Artikel 2.61][ref1], tweede tot en met zesde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.53
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.1
        afdeling: 2.3.2
  - number: '3.54'
    text: |-
      Een speciale-sectorbedrijf kan een periodieke indicatieve aankondiging over belangrijke projecten meedelen of
      door de Europese Commissie bekend laten maken, zonder de reeds eerder in een periodieke indicatieve aankondiging
      vervatte inlichtingen te herhalen, mits duidelijk wordt vermeld dat deze aankondigingen een aanvulling zijn.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.54
  - number: 3.55.1
    text: |-
      Indien een speciale-sectorbedrijf een regeling voor de erkenning van ondernemers als bedoeld in
      [artikel 3.66][ref1] wil invoeren, stelt hij met gebruikmaking van het elektronische systeem voor aanbestedingen
      aangaande deze regeling een aankondiging op, waarin het doel van de regeling en de wijze waarop inzage in de
      regeling kan worden verkregen, worden aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.55
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.4'
        afdeling: 3.4.1
  - number: 3.55.2
    text: |-
      Indien de regeling, bedoeld in het eerste lid, drie jaar of langer duurt, deelt het speciale-sectorbedrijf de
      aankondiging jaarlijks mee.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.55
  - number: 3.55.3
    text: |-
      Indien de regeling, bedoeld in het eerste lid, minder dan drie jaar duurt, volstaat het speciale-sectorbedrijf met
      een eenmalige aankondiging.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.55
  - number: 3.56.1
    text: |-
      [Paragraaf 2.3.2.2][ref1], met uitzondering van de [artikelen 2.63][ref2] en [2.68][ref3], is van overeenkomstige
      toepassing op een speciale-sectorbedrijf dat voornemens is een speciale-sectoropdracht te gunnen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.56
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.2
        afdeling: 2.3.2
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.2
        afdeling: 2.3.2
      - id: ref3
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.2
        afdeling: 2.3.2
  - number: 3.56.2
    text: |-
      Het speciale-sectorbedrijf geeft in de aankondiging of in de uitnodiging tot inschrijving aan welke bewijsmiddelen
      met betrekking tot de gestelde eisen en de technische specificaties, eisen en normen hij van de ondernemer
      verlangt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.56
  - number: 3.56.3
    text: |-
      Als aankondiging als bedoeld in het eerste lid kan het speciale-sectorbedrijf volstaan met een aankondiging
      betreffende het bestaan van een erkenningsregeling of een periodieke indicatieve aankondiging, indien die laatste:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.56
  - number: 3.56.3.a
    text: specifiek verwijst naar werken, leveringen of diensten waarop de opdracht betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.56
  - number: 3.56.3.b
    text: |-
      vermeldt dat de opdracht zal worden gegund door middel van een niet-openbare procedure of een
      onderhandelingsprocedure met aankondiging en belangstellende ondernemers verzoekt hun belangstelling schriftelijk
      kenbaar te maken;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.56
  - number: 3.56.3.c
    text: ten minste twaalf maanden voor de uitnodiging tot deelname wordt verzonden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.56
  - number: '3.57'
    text: |-
      Indien het speciale-sectorbedrijf bij toepassing van de openbare procedure niet langs elektronische weg vrije,
      rechtstreekse en volledige toegang biedt tot de aanbestedingsstukken en alle aanvullende stukken, zendt het
      speciale-sectorbedrijf de aanbestedingsstukken en de aanvullende stukken binnen zes dagen na ontvangst van het
      verzoek daartoe aan de ondernemers toe, mits dit verzoek tijdig voor de uiterste datum voor het indienen van de
      inschrijvingen is gedaan.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.57
  - number: '3.58'
    text: |-
      Een speciale-sectorbedrijf stelt de termijn voor het indienen van verzoeken tot deelneming of inschrijvingen vast
      met inachtneming van het voorwerp van de opdracht, de voor de voorbereiding van het verzoek of de inschrijving
      benodigde tijd en de in deze paragraaf gestelde regels omtrent termijnen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.58
  - number: 3.59.1
    text: |-
      Voor openbare procedures bedraagt de termijn voor het indienen van de inschrijvingen ten minste 45 dagen, te
      rekenen vanaf de verzenddatum van de aankondiging.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.59
  - number: 3.59.2
    text: |-
      Voor niet-openbare procedures en onderhandelingsprocedures met aankondiging bedraagt de termijn voor het indienen
      van de verzoeken tot deelneming ten minste 30 dagen, te rekenen vanaf de verzenddatum van de aankondiging van de
      speciale-sectoropdracht.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.59
  - number: 3.59.3
    text: |-
      Bij de niet-openbare procedure en de onderhandelingsprocedure met aankondiging bedraagt de termijn
      voor het indienen van de verzoeken tot deelneming in antwoord op een aankondiging die uit hoofde van
      [artikel 3.56][ref1] is meegedeeld, of in antwoord op een uitnodiging van een speciale-sectorbedrijf overeenkomstig
      [artikel 3.73, eerste lid][ref2], ten minste 30 dagen vanaf de datum van verzending van de aankondiging of vanaf de
      datum van verzending van de uitnodiging.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.59
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.3'
        paragraaf: 3.3.2.2
        afdeling: 3.3.2
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.4'
        paragraaf: 3.4.3.1
        afdeling: 3.4.3
  - number: 3.59.4
    text: |-
      De termijn voor het indienen van de inschrijvingen, bedoeld in het derde lid, kan in afwijking van het tweede lid
      in onderling overleg tussen het speciale-sectorbedrijf en de uitgekozen gegadigden worden vastgesteld, mits alle
      gegadigden evenveel tijd krijgen om hun inschrijvingen voor te bereiden en in te dienen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.59
  - number: 3.59.5
    text: |-
      Indien geen overeenstemming als bedoeld in het vierde lid kan worden bereikt over de termijn voor het indienen van
      de inschrijvingen, stelt het speciale-sectorbedrijf een termijn vast die ten minste 24 dagen en niet minder dan 10
      dagen bedraagt, te rekenen vanaf de verzenddatum van de uitnodiging tot inschrijving.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.59
  - number: 3.60.1
    text: |-
      Indien het speciale-sectorbedrijf een periodieke indicatieve aankondiging als bedoeld in
      [artikel 3.51, eerste lid][ref1], heeft gedaan, bedraagt de termijn voor het indienen van de inschrijvingen bij
      openbare procedures ten minste 29 dagen en niet minder dan 22 dagen, te rekenen vanaf de verzenddatum van de
      aankondiging.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.60
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.3'
        paragraaf: 3.3.2.1
        afdeling: 3.3.2
  - number: 3.60.2
    text: |-
      De kortere termijnen, bedoeld in het eerste lid, zijn uitsluitend toegestaan, indien de periodieke indicatieve
      aankondiging, naast de op grond van bijlage XV A, deel I, van [richtlijn nr. 2004/17/EG](32004L0017) vereiste
      informatie, alle in bijlage XV A, deel II, van [richtlijn nr. 2004/17/EG](32004L0017) vereiste informatie bevat,
      voor zover deze informatie beschikbaar is op het tijdstip dat de aankondiging wordt gedaan, en de aankondiging ten
      minste 52 dagen en ten hoogste 12 maanden voor de verzenddatum van de aankondiging van de opdracht ter bekendmaking
      is verzonden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.60
  - number: 3.60.3
    text: |-
      Tenzij de termijn overeenkomstig [artikel 3.59, vierde lid][ref1], in onderling overleg is vastgesteld, kan
      het speciale-sectorbedrijf de termijn voor het indienen van de inschrijvingen bij openbare procedures, niet-
      openbare procedures en onderhandelingsprocedures met vijf dagen verkorten, indien het speciale-sectorbedrijf het
      beschrijvend document en alle aanvullende stukken vanaf de verzenddatum van de aankondiging van de opdracht, met
      elektronische middelen vrij, rechtstreeks en volledig toegankelijk maakt en in deze aankondiging het internetadres
      dat toegang biedt tot de documenten vermeldt.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.60
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.3'
        paragraaf: 3.3.2.3
        afdeling: 3.3.2
  - number: 3.60.4
    text: |-
      Bij openbare procedures mag het gecumuleerde effect van de termijnverkorting, bedoeld in het eerste tot en met het
      derde lid, in geen geval leiden tot een termijn van minder dan 15 dagen voor het indienen van de inschrijvingen, te
      rekenen vanaf de verzenddatum van de aankondiging van de opdracht.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.60
  - number: 3.60.5
    text: |-
      Het gecumuleerde effect van de termijnverkorting, bedoeld in het eerste tot en met het derde lid, mag in geen geval
      leiden tot een termijn van minder dan 15 dagen voor het indienen van verzoeken tot deelneming in antwoord op een
      aankondiging die overeenkomstig [paragraaf 2.3.2.2][ref1] is gedaan, of in antwoord op een uitnodiging van een
      speciale-sectorbedrijf overeenkomstig [artikel 3.73, eerste lid][ref2], te rekenen vanaf de verzenddatum van de
      aankondiging van de opdracht of van de uitnodiging.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.60
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        paragraaf: 2.3.2.2
        afdeling: 2.3.2
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.4'
        paragraaf: 3.4.3.1
        afdeling: 3.4.3
  - number: 3.60.6
    text: |-
      Bij niet-openbare procedures en onderhandelingsprocedures mag het gecumuleerde effect van de termijnverkorting,
      bedoeld in het eerste tot en met het derde lid, in geen geval leiden tot een termijn van minder dan tien dagen voor
      het indienen van de inschrijvingen, te rekenen vanaf de verzenddatum van de uitnodiging tot inschrijving, behalve
      indien de termijn overeenkomstig [artikel 3.59, vierde lid][ref1], in onderling overleg wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.60
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.3'
        paragraaf: 3.3.2.3
        afdeling: 3.3.2
  - number: 3.60.7
    text: |-
      Indien het beschrijvend document en de aanvullende stukken of nadere inlichtingen, hoewel tijdig aangevraagd,
      niet binnen de termijnen, bedoeld in deze paragraaf, zijn verstrekt, of indien de inschrijvingen slechts na een
      bezichtiging ter plaatse, of na inzage ter plaatse van de bij de aanbestedingsstukken behorende stukken kunnen
      worden gedaan, verlengt het speciale-sectorbedrijf de termijn voor het indienen van de inschrijvingen zodanig dat
      alle betrokken ondernemers op de hoogte kunnen zijn van alle informatie die voor de opstelling van de inschrijving
      nodig is, behalve indien de termijn overeenkomstig [artikel 3.59, vierde lid][ref1], in onderling overleg wordt
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.60
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.3'
        paragraaf: 3.3.2.3
        afdeling: 3.3.2
  - number: 3.61.1
    text: |-
      [Paragraaf 2.3.3.1][ref1], met uitzondering van [artikel 2.76, eerste en tweede lid][ref2], is van overeenkomstige
      toepassing op speciale-sectoropdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.61
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        paragraaf: 2.3.3.1
        afdeling: 2.3.3
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.3.1
        afdeling: 2.3.3
  - number: 3.61.2
    text: 'Een speciale-sectorbedrijf formuleert de technische specificaties:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.61
  - number: 3.61.2.a
    text: |-
      door verwijzing naar technische specificaties en naar nationale normen waarin Europese normen zijn omgezet,
      Europese technische goedkeuringen, gemeenschappelijke technische specificaties, internationale normen, andere
      door Europese normalisatie-instellingen opgestelde technische referentiesystemen of, bij ontstentenis daarvan,
      nationale normen, nationale technische goedkeuringen dan wel nationale technische specificaties, andere technische
      referentiesystemen, inzake het ontwerpen, berekenen en uitvoeren van werken en het gebruik van producten,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.61
  - number: 3.61.2.b
    text: |-
      in termen van prestatie-eisen en functionele eisen, die milieukenmerken kunnen bevatten, waarbij de eisen zodanig
      nauwkeurig zijn bepaald dat de inschrijvers het voorwerp van de speciale-sectoropdracht kunnen bepalen en het
      speciale-sectorbedrijf de opdracht kan gunnen,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.61
  - number: 3.61.2.c
    text: |-
      in termen van prestatie-eisen en functionele eisen als bedoeld in onderdeel b, waarbij onder vermoeden van
      overeenstemming met deze prestatie-eisen en functionele eisen wordt verwezen naar de specificaties, bedoeld in
      onderdeel a, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.61
  - number: 3.61.2.d
    text: |-
      door verwijzing naar de specificaties, bedoeld in onderdeel a, voor bepaalde kenmerken, en verwijzing naar de
      prestatie-eisen en functionele eisen, bedoeld in onderdeel b, voor andere kenmerken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.61
  - number: 3.61.3
    text: |-
      Een speciale-sectorbedrijf doet een verwijzing als bedoeld in het tweede lid, onderdeel a, vergezeld gaan van de
      woorden «of gelijkwaardig».
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.61
  - number: 3.62.1
    text: |-
      Een speciale-sectorbedrijf deelt de belangstellende ondernemers desgevraagd de technische specificaties mede die
      regelmatig in zijn opdrachten voor leveringen, werken of diensten worden beoogd, of de technische specificaties
      die hij voornemens is toe te passen voor opdrachten waarover periodieke indicatieve aankondigingen als bedoeld in
      [paragraaf 3.3.2.1][ref1] worden gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk3.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.62
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '3.3'
        paragraaf: 3.3.2.1
        afdeling: 3.3.2
  - number: 3.62.2
    text: |-
      Indien de technische specificaties, bedoeld in het eerste lid, gebaseerd zijn op documenten waarover
      belangstellende ondernemers kunnen beschikken, kan het speciale-sectorbedrijf ermee volstaan een verwijzing naar
      deze documenten op te nemen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.62
  - number: '3.63'
    text: |-
      De [paragrafen 2.3.3.2 tot en met 2.3.3.5][ref1] zijn van overeenkomstige toepassing op speciale-sectoropdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.63
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        paragraaf: 2.3.3.2
        afdeling: 2.3.3
  - number: '3.64'
    text: |-
      [Afdeling 2.3.4][ref1] is van overeenkomstige toepassing op speciale-sectoropdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.64
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        afdeling: 2.3.4
  - number: 3.65.1
    text: |-
      Het speciale-sectorbedrijf stelt objectieve voorschriften en selectiecriteria voor een openbare procedure vast en
      stelt die voorschriften en criteria ter beschikking aan belangstellende ondernemers.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.65
  - number: 3.65.2
    text: |-
      Een speciale-sectorbedrijf selecteert de gegadigden voor een niet-openbare procedure of een
      onderhandelingsprocedure op grond van door hem omschreven objectieve voorschriften en criteria, die aan
      belangstellende ondernemers ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.65
  - number: 3.65.3
    text: |-
      Bij een niet-openbare procedure of een onderhandelingsprocedure kan het speciale-sectorbedrijf de criteria baseren
      op de objectieve noodzaak voor het bedrijf om de gegadigden te beperken tot een aantal dat wordt gerechtvaardigd
      door het noodzakelijke evenwicht tussen enerzijds de specifieke kenmerken van de procedure en anderzijds de
      daarvoor vereiste middelen. Het speciale-sectorbedrijf stelt het aantal gegadigden zodanig vast dat voldoende
      concurrentie blijft gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.65
  - number: 3.65.4
    text: |-
      De voorschriften en criteria, bedoeld in het eerste en tweede lid, kunnen de in de [artikelen 2.86][ref1] en
      [2.87][ref2] genoemde uitsluitingsgronden omvatten, waarbij van de toepassing van deze artikelen kan worden
      afgezien op de in [artikel 2.88][ref3] genoemde gronden.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.65
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
      - id: ref3
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
  - number: 3.65.5
    text: |-
      Indien het speciale-sectorbedrijf de staat, een provincie, een gemeente, een waterschap, een publiekrechtelijke
      instelling of een samenwerkingsverband van deze overheden of publiekrechtelijke instellingen is, neemt dat
      bedrijf, in afwijking van het vierde lid, in ieder geval de in [artikel 2.86][ref1] genoemde uitsluitingsgronden
      in de voorschriften en criteria op waarbij van de toepassing van dit artikel kan worden afgezien op de in
      [artikel 2.88][ref2] genoemde gronden.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.65
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
  - number: 3.66.1
    text: |-
      Een speciale-sectorbedrijf kan een regeling voor de erkenning van ondernemers invoeren en beheren. Deze regeling
      kan verscheidene fasen van erkenning van geschiktheid omvatten.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.66
  - number: 3.66.2
    text: |-
      Een speciale-sectorbedrijf dat een regeling als bedoeld in het eerste lid invoert of beheert, waarborgt dat de
      ondernemers te allen tijde een erkenning kunnen aanvragen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.66
  - number: 3.66.3
    text: |-
      Een speciale-sectorbedrijf beheert de regeling, bedoeld in het eerste lid, op basis van door het bedrijf omschreven
      objectieve criteria en voorschriften. Indien deze criteria en voorschriften technische specificaties bevatten, zijn
      de [artikelen 2.75 tot en met 2.78][ref1] van toepassing. De criteria en voorschriften inzake erkenning kunnen zo
      nodig worden herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.66
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.3.1
        afdeling: 2.3.3
  - number: 3.66.4
    text: |-
      De criteria en voorschriften, bedoeld in het derde lid, kunnen de uitsluitingscriteria, genoemd in
      [artikel 2.86][ref1], omvatten onder de daarin genoemde voorwaarden, met dien verstande dat, indien een regeling
      voor de erkenning van ondernemers wordt ingevoerd door de staat, een provincie, een gemeente, een waterschap, een
      publiekrechtelijke instelling of een samenwerkingsverband van deze overheden of publiekrechtelijke instellingen die
      een speciale-sectoropdracht plaatst in het kader van een van de activiteiten, genoemd in [paragraaf 3.1.1][ref2],
      de [artikelen 2.86 tot en met 2.88][ref3] van overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk3.1
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.66
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
      - id: ref2
        bwb_id: BWBR0032203
        hoofdstuk: '3.1'
        afdeling: 3.1.1
      - id: ref3
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
  - number: 3.66.5
    text: |-
      Bij de toepassing van [artikel 2.86, bedoeld in het vierde lid][ref1], is [artikel 2.89][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.66
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.2
        afdeling: 2.3.5
  - number: 3.66.6
    text: |-
      Indien de criteria en voorschriften inzake erkenning, bedoeld in het derde lid, eisen omvatten betreffende de
      economische en financiële draagkracht van de ondernemer, kan deze zich beroepen op de draagkracht van andere
      natuurlijke personen of rechtspersonen ongeacht de juridische aard van zijn banden met die natuurlijke personen
      of rechtspersonen. In dat geval toont hij ten behoeve van het speciale-sectorbedrijf aan dat hij gedurende de
      geldigheidsduur van de regeling voor de erkenning van ondernemers daadwerkelijk kan beschikken over de voor de
      uitvoering van de opdracht noodzakelijke middelen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.66
  - number: 3.66.7
    text: |-
      Indien de criteria en voorschriften inzake erkenning, bedoeld in het derde lid, eisen omvatten betreffende de
      technische bekwaamheid of beroepsbekwaamheid van de ondernemer, kan deze zich beroepen op de bekwaamheid van andere
      natuurlijke personen of rechtspersonen, ongeacht de juridische aard van zijn banden met die natuurlijke personen
      of rechtspersonen. In dat geval toont hij ten behoeve van het speciale-sectorbedrijf aan dat hij gedurende de
      geldigheidsduur van de erkenningsregeling daadwerkelijk kan beschikken over de voor de uitvoering van de opdracht
      noodzakelijke middelen van die natuurlijke personen of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.66
  - number: 3.66.8
    text: |-
      Onder dezelfde voorwaarden als bedoeld in het zesde en zevende lid, kan een samenwerkingsverband van ondernemers
      zich beroepen op de draagkracht van de deelnemers aan het samenwerkingsverband of aan andere natuurlijke personen
      of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.66
  - number: 3.66.9
    text: |-
      Een speciale-sectorbedrijf stelt de criteria en voorschriften inzake erkenning, bedoeld in het derde lid,
      desgevraagd ter beschikking aan ondernemers. Indien deze criteria en voorschriften worden herzien, wordt dit de
      betrokken ondernemers medegedeeld.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.66
  - number: 3.66.10
    text: |-
      Een speciale-sectorbedrijf dat van oordeel is dat de regeling voor de erkenning van ondernemers van bepaalde andere
      instanties aan de voorwaarden voldoet, deelt de betrokken ondernemers de namen van deze andere instanties mede.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.66
  - number: 3.66.11
    text: |-
      Een speciale-sectorbedrijf houdt een lijst van erkende ondernemers bij, die volgens het type opdrachten waarvoor de
      erkenning geldt in categorieën kan worden ingedeeld.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.66
  - number: 3.66.12
    text: |-
      Een speciale-sectorbedrijf dat een aankondiging doet door een mededeling inzake het bestaan van een regeling
      voor de erkenning van ondernemers, kiest de inschrijvers bij een niet-openbare procedure of de deelnemers aan een
      onderhandelingsprocedure uit de volgens deze regeling in aanmerking komende gegadigden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.66
  - number: 3.67.1
    text: |-
      Een speciale-sectorbedrijf dat een regeling voor de erkenning van ondernemers invoert en beheert, stelt de
      verzoekers binnen zes maanden na het indienen van het verzoek om erkenning in kennis inzake hun erkenning.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.67
  - number: 3.67.2
    text: |-
      Indien de beslissing omtrent de erkenning meer dan vier maanden vanaf het indienen van het verzoek om erkenning
      in beslag neemt, informeert het speciale-sectorbedrijf de verzoeker binnen twee maanden na deze indiening over de
      redenen waarom deze termijn langer is en over de datum waarop op zijn verzoek wordt beslist.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.67
  - number: 3.67.3
    text: |-
      Een speciale-sectorbedrijf stelt degene van wie een verzoek om erkenning is afgewezen zo spoedig mogelijk na die
      beslissing, doch uiterlijk binnen vijftien dagen, daarvan in kennis en motiveert deze afwijzing aan de hand van de
      erkenningscriteria, bedoeld in [artikel 3.66, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.67
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.4'
        afdeling: 3.4.1
  - number: 3.67.4
    text: |-
      Een speciale-sectorbedrijf kan de erkenning van een ondernemer slechts intrekken op grond van de criteria, bedoeld
      in [artikel 3.66, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.67
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.4'
        afdeling: 3.4.1
  - number: 3.67.5
    text: |-
      Een speciale-sectorbedrijf brengt de betrokkene het voornemen om een erkenning in te trekken en de redenen daartoe,
      uiterlijk vijftien dagen vóór de datum waarop de erkenning zal worden ingetrokken schriftelijk ter kennis.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.67
  - number: 3.68.1
    text: |-
      Indien het speciale-sectorbedrijf uitsluitingsgronden heeft vastgesteld, is [2.3.5.2][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.68
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.2
        afdeling: 2.3.5
  - number: 3.68.2
    text: |-
      [Artikel 2 102][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.68
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.6.4
        afdeling: 2.3.6
  - number: 3.69.1
    text: 'Voor de selectie van deelnemers aan een procedure:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.69
  - number: 3.69.1.a
    text: |-
      sluit het speciale-sectorbedrijf dat voorschriften en criteria als bedoeld in
      [artikel 3.65, eerste, tweede of vierde lid][ref1], heeft vastgesteld voor de uitsluiting van gegadigden of
      inschrijvers, ondernemers die aan deze voorschriften of criteria voldoen, uit;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.69
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.3'
        afdeling: 3.3.5
  - number: 3.69.1.b
    text: |-
      selecteert het speciale-sectorbedrijf inschrijvers en gegadigden overeenkomstig de objectieve voorschriften en
      criteria, bedoeld in [artikel 3.65, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.69
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.3'
        afdeling: 3.3.5
  - number: 3.69.1.c
    text: |-
      beperkt het speciale-sectorbedrijf in niet-openbare procedures en in onderhandelingsprocedures met aankondiging het
      aantal geselecteerde gegadigden, overeenkomstig [artikel 3.65, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.69
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.3'
        afdeling: 3.3.5
  - number: 3.69.2
    text: |-
      Een speciale-sectorbedrijf dat een aankondiging doet door een mededeling inzake het bestaan van een regeling voor
      de erkenning van ondernemers met het oog op selectie van deelnemers in procedures voor de specifieke opdrachten
      waarop de aankondiging betrekking heeft:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.69
  - number: 3.69.2.a
    text: |-
      erkent de ondernemers overeenkomstig de [artikelen 3.66][ref1] en [3.67][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.69
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.4'
        afdeling: 3.4.1
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.4'
        afdeling: 3.4.1
  - number: 3.69.2.b
    text: |-
      beperkt in niet-openbare procedures en in onderhandelingsprocedures met aankondiging het aantal gegadigden
      overeenkomstig [artikel 3.65, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.69
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.3'
        afdeling: 3.3.5
  - number: 3.69.3
    text: |-
      Een speciale-sectorbedrijf toetst de door de aldus geselecteerde inschrijvers ingediende inschrijvingen aan de op
      de inschrijvingen toepasselijke bepalingen en voorschriften, en gunt de opdracht op basis van de criteria, bedoeld
      in de [artikelen 2.114][ref1], [2.115][ref2] en [2.116][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.69
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
      - id: ref3
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.5
        afdeling: 2.3.8
  - number: 3.70.1
    text: |-
      Een speciale-sectorbedrijf dat de deelnemers aan een niet-openbare procedure of onderhandelingsprocedure kiest, een
      beslissing neemt over erkenning of de erkenningscriteria of de regeling voor de erkenning van ondernemers herziet,
      eist geen bewijzen die een doublure zouden vormen met reeds beschikbare objectieve bewijzen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.70
  - number: 3.70.2
    text: |-
      Een speciale-sectorbedrijf dat de overlegging verlangt van een door een onafhankelijke instantie opgestelde
      verklaring dat de ondernemer aan bepaalde kwaliteitsnormen voldoet, verwijst naar kwaliteitsbewakingsregelingen die
      op de Europese normenreeksen op dit terrein zijn gebaseerd en die zijn gecertificeerd door instanties die voldoen
      aan de Europese normenreeks voor certificering.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.70
  - number: 3.70.3
    text: |-
      Een speciale-sectorbedrijf erkent gelijkwaardige verklaringen van in andere lidstaten van de Europese Unie
      gevestigde instanties. Een speciale-sectorbedrijf aanvaardt ook andere bewijzen inzake gelijkwaardige maatregelen
      op het gebied van de kwaliteitsbewaking van ondernemers.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.70
  - number: 3.70.4
    text: |-
      Voor speciale-sectoropdrachten voor werken of voor diensten, kan een speciale-sectorbedrijf, teneinde de technische
      bekwaamheid van de ondernemer te verifiëren, de vermelding eisen van de maatregelen inzake milieubeheer die de
      ondernemer kan toepassen in het kader van de uitvoering van de opdracht.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.70
  - number: 3.70.5
    text: |-
      Een speciale-sectorbedrijf dat de overlegging verlangt van een door een onafhankelijke instantie opgestelde
      verklaring dat de ondernemer aan bepaalde normen inzake milieubeheer als bedoeld in het vierde lid voldoet,
      verwijst naar het communautair milieubeheer- en milieuauditsysteem of naar normen inzake milieubeheer die gebaseerd
      zijn op Europese of internationale normen die gecertificeerd zijn door een erkende organisatie of door een
      organisatie die beantwoordt aan de relevante Europese of internationale normen voor certificering.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.70
  - number: 3.70.6
    text: |-
      Een speciale-sectorbedrijf erkent in het geval, bedoeld in het vijfde lid, gelijkwaardige verklaringen van in
      andere lidstaten van de Europese Unie gevestigde instanties. Een speciale-sectorbedrijf aanvaardt tevens andere
      bewijzen inzake gelijkwaardige maatregelen op het gebied van milieubeheer die de ondernemers overleggen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.70
  - number: '3.71'
    text: |-
      De [artikelen 2.103][ref1] en [2.104][ref2] zijn van overeenkomstige toepassing op speciale-sectoropdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        afdeling: 2.3.7
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        afdeling: 2.3.7
  - number: '3.72'
    text: |-
      De [artikelen 2.105, eerste lid][ref1], [2.106, eerste lid en tweede lid, onderdelen a, b en e][ref2], en
      [paragraaf 2.3.8.2][ref3] zijn van overeenkomstige toepassing op speciale-sectoropdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.72
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.1
        afdeling: 2.3.8
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.1
        afdeling: 2.3.8
      - id: ref3
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.2
        afdeling: 2.3.8
  - number: 3.73.1
    text: |-
      Indien een periodieke indicatieve aankondiging is gedaan nodigt het speciale-sectorbedrijf alle gegadigden uit om
      hun belangstelling te bevestigen aan de hand van nadere gegevens betreffende de betrokken opdracht, alvorens met de
      selectie van de inschrijvers of deelnemers aan de onderhandelingen te beginnen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.73
  - number: 3.73.2
    text: 'Een speciale-sectorbedrijf neemt in de uitnodiging, bedoeld in het eerste lid, ten minste op:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.73
  - number: 3.73.2.a
    text: 'de aard en de hoeveelheid, met inbegrip van eventuele opties voor latere opdrachten en, indien mogelijk:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.73
  - number: 3.73.2.a.1°
    text: een schatting van de termijn voor de uitoefening van deze opties, of
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.73
  - number: 3.73.2.a.2°
    text: |-
      in het geval van periodiek terugkerende opdrachten, een schatting van de termijnen waarop de latere oproepen tot
      mededinging voor werken, leveringen of diensten worden meegedeeld,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.73
  - number: 3.73.2.b
    text: type aanbestedingsprocedure, te weten niet-openbare procedure of onderhandelingsprocedure,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.73
  - number: 3.73.2.c
    text: de begin- of einddatum van de leveringen, de werken of de diensten,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.73
  - number: 3.73.2.d
    text: |-
      het adres en de uiterste datum voor het indienen van aanvragen om te worden uitgenodigd tot het indienen van een
      inschrijving en de taal waarin deze wordt gesteld,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.73
  - number: 3.73.2.e
    text: |-
      het adres van de instantie die de opdracht plaatst en de nodige informatie verstrekt voor het verkrijgen van
      specificaties en andere documenten;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.73
  - number: 3.73.2.f
    text: |-
      de economische en technische eisen, de financiële waarborgen en de inlichtingen die van de ondernemers worden
      verlangd,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.73
  - number: 3.73.2.g
    text: |-
      indien van toepassing: het te betalen bedrag voor het op andere wijze dan ter uitvoering van
      [artikel 1.20, eerste lid][ref1], verkrijgen van de aanbestedingsdocumenten en de wijze van betaling,


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel1
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.73
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '1'
        hoofdstuk: '1.3'
  - number: 3.73.2.h
    text: |-
      de contractvorm van de opdracht waarvoor inschrijvingen worden gevraagd, te weten aankoop, leasing, huur of
      huurkoop, of een combinatie van deze vormen, en
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.73
  - number: 3.73.2.i
    text: |-
      de gunningcriteria en de weging ervan, of de volgorde van belangrijkheid van die criteria, indien dit niet in
      de indicatieve aankondiging, het beschrijvend document of de uitnodiging tot aanbesteding of onderhandelingen is
      vermeld.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.73
  - number: '3.74'
    text: |-
      De [paragrafen 2.3.8.4][ref1], [2.3.8.5][ref2] en [2.3.8.6][ref3] zijn van overeenkomstige toepassing op speciale-
      sectoropdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.74
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
      - id: ref2
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.5
        afdeling: 2.3.8
      - id: ref3
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.6
        afdeling: 2.3.8
  - number: '3.75'
    text: |-
      [Paragraaf 2.3.8.8][ref1] is van overeenkomstige toepassing op speciale-sectoropdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.75
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.8
        afdeling: 2.3.8
  - number: 3.76.1
    text: |-
      Een speciale-sectorbedrijf past het tweede tot en met vijfde lid van dit artikel toe op inschrijvingen die
      producten bevatten uit derde landen waarmee de Europese Gemeenschappen geen multilateraal of bilateraal verdrag
      hebben gesloten dat de communautaire ondernemingen op vergelijkbare wijze daadwerkelijk toegang verschaft tot de
      markten van deze derde landen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.76
  - number: 3.76.2
    text: |-
      Een speciale-sectorbedrijf kan iedere inschrijving die wordt ingediend met het oog op de gunning van een opdracht
      voor leveringen, afwijzen indien het aandeel van de uit derde landen afkomstige goederen, waarvan de oorsprong
      wordt vastgesteld overeenkomstig [Verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese
      Gemeenschappen van 12 oktober 1992 tot vaststelling van het communautair douanewetboek (PbEG L 302), meer dan
      vijftig procent uitmaakt van de totale waarde van de goederen waarop deze inschrijving betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.76
  - number: 3.76.3
    text: |-
      Indien twee of meer inschrijvingen volgens de gunningcriteria van [artikelen 2.113][ref1] en [2.115][ref2]
      gelijkwaardig zijn, geeft het speciale-sectorbedrijf de voorkeur aan de inschrijving die niet krachtens het tweede
      lid kan worden afgewezen. Indien het prijsverschil niet meer dan drie procent bedraagt, wordt het bedrag van de
      inschrijving door het speciale-sectorbedrijf als gelijkwaardig beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.76
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.4
        afdeling: 2.3.8
  - number: 3.76.4
    text: |-
      Een speciale-sectorbedrijf kan afwijken van het derde lid indien hij hierdoor genoodzaakt zou zijn apparatuur aan
      te schaffen met technische kenmerken die afwijken van de bestaande apparatuur, en dit tot onverenigbaarheid of
      tot technische moeilijkheden bij het gebruik of het onderhoud zou leiden of buitensporige kosten met zich mee zou
      brengen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.76
  - number: 3.76.5
    text: |-
      Een speciale-sectorbedrijf laat bij het bepalen van het aandeel van uit derde landen afkomstige goederen, bedoeld
      in het tweede lid, de derde landen buiten beschouwing ten gunste waarvan de toepassing van [richtlijn nr. 2004/17/
      EG](32004L0017) bij besluit van de Raad van de Europese Unie overeenkomstig het eerste lid is uitgebreid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.76
  - number: 3.76.6
    text: |-
      Voor de toepassing van dit artikel worden de programmatuurtoepassingen die in telecommunicatienetten worden
      gebruikt, als producten beschouwd.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.76
  - number: 3.77.1
    text: |-
      Een speciale-sectorbedrijf bewaart de nodige gegevens over alle speciale-sectoropdrachten, opdat het bedrijf later
      de genomen beslissingen kan motiveren met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.77
  - number: 3.77.1.a
    text: de erkenning en de selectie van de ondernemers en de gunning van de opdracht;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.77
  - number: 3.77.1.b
    text: de toepassing van de onderhandelingsprocedure zonder aankondiging;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.77
  - number: 3.77.1.c
    text: |-
      het niet toepassen van de bepalingen voor speciale-sectoropdrachten op grond van de daaromtrent in deze wet
      opgenomen uitzonderingen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.77
  - number: 3.77.2
    text: |-
      De in het eerste lid bedoelde gegevens, alsmede de gegevens, bedoeld in [artikel 2.56][ref1], worden bewaard
      gedurende ten minste vier jaar na de datum van gunning van de opdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.77
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.1.2
        afdeling: 2.3.1
  - number: 3.77.3
    text: |-
      Het speciale-sectorbedrijf verstrekt binnen de in het tweede lid genoemde periode van vier jaar de Europese
      Commissie op haar verzoek de nodige informatie.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.77
  - number: 3.78.1
    text: |-
      De [artikelen 2.134][ref1], [2.135][ref2], [2.136][ref3] en [2.138][ref4] zijn van overeenkomstige toepassing op
      speciale-sectoropdrachten, met dien verstande dat de termijn telkens twee maanden bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.78
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.9
        afdeling: 2.3.8
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.9
        afdeling: 2.3.8
      - id: ref3
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.9
        afdeling: 2.3.8
      - id: ref4
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.9
        afdeling: 2.3.8
  - number: 3.78.2
    text: 'Indien een speciale-sectorbedrijf een opdracht plaatst in verband met onderzoeks- en ontwikkelingsdiensten:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.78
  - number: 3.78.2.a
    text: |-
      volgens een procedure zonder voorafgaande aankondiging overeenkomstig [artikel 3.36, onderdeel b][ref1], mag
      dat bedrijf de gegevens over de aard en de hoeveelheid van de verleende diensten, overeenkomstig bijlage XVI van
      [richtlijn nr. 2004/17/EG](32004L0017), beperken tot de vermelding «onderzoeks- en ontwikkelingsdiensten»,


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.78
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.2'
        paragraaf: 3.2.2.1
        afdeling: 3.2.2
  - number: 3.78.2.b
    text: |-
      die overeenkomstig [artikel 3.36, onderdeel b][ref1], niet volgens een procedure zonder voorafgaande aankondiging
      kan worden gegund, kan hij de gegevens over de aard en de hoeveelheid van de verleende diensten, bedoeld
      bijlage XVI van [richtlijn nr. 2004/17/EG](32004L0017), beperken indien de bescherming van het zakengeheim zulks
      noodzakelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.78
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.2'
        paragraaf: 3.2.2.1
        afdeling: 3.2.2
  - number: 3.78.3
    text: 'In de gevallen, bedoeld in het tweede lid, onderdelen a en b, ziet het speciale-sectorbedrijf er op toe dat:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.78
  - number: 3.78.3.a
    text: |-
      de verstrekte informatie ten minste even gedetailleerd is als die in de aankondiging, die met gebruikmaking van het
      elektronische systeem voor aanbestedingen is gepubliceerd, en
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.78
  - number: 3.78.3.b
    text: |-
      indien het speciale-sectorbedrijf van een erkenningsregeling gebruik maakt, deze informatie ten minste even
      gedetailleerd is als die in de desbetreffende categorie van de overeenkomstig [artikel 3.66, elfde lid][ref1],
      opgestelde lijst van erkende dienstverleners.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel3
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.78
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.4'
        afdeling: 3.4.1
  - number: '3.79'
    text: |-
      Met betrekking tot speciale-sectoropdrachten voor diensten als bedoeld in bijlage XVII, onderdeel B, van [richtlijn
      nr. 2004/17/EG](32004L0017) vermeldt het speciale-sectorbedrijf bij de aankondiging van de gegunde opdracht of hij
      met de bekendmaking ervan instemt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.79
  - number: 3.80.1
    text: |-
      Een speciale-sectorbedrijf maakt geen oneigenlijk gebruik van een raamovereenkomst en gebruikt deze evenmin om de
      mededinging te hinderen, te beperken of te vervalsen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.80
  - number: 3.80.2
    text: |-
      De [afdelingen 2.4.2][ref1] en [2.4.5][ref2] zijn van overeenkomstige toepassing op speciale-sectoropdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.4
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel3.80
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.4'
        afdeling: 2.4.2
      - id: ref2
        bwb_id: BWBR0032203
        hoofdstuk: '2.4'
        afdeling: 2.4.5
  - number: '4.1'
    text: |-
      Een gedragsverklaring aanbesteden is een verklaring van Onze Minister van Veiligheid en Justitie dat uit een
      onderzoek naar de in de [artikel 4.7][ref1] bedoelde gegevens is gebleken dat tegen de betrokken natuurlijke
      persoon of rechtspersoon geen bezwaren bestaan in verband met inschrijving op overheidsopdrachten, speciale-
      sectoropdrachten, concessieovereenkomsten voor openbare werken, prijsvragen of opdrachten als bedoeld in de
      [Aanbestedingswet op defensie- en veiligheidsgebied][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032898
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.1'
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0032898
  - number: '4.2'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder rechtspersoon verstaan een rechtspersoon als bedoeld
      in [boek 2 van het Burgerlijk Wetboek][ref1] alsmede daarmee gelijkgestelde organisaties als bedoeld in
      [artikel 51, derde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel51
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '51'
  - number: '4.3'
    text: |-
      De beslissing omtrent de afgifte van een gedragsverklaring aanbesteden wordt aangemerkt als een beschikking in de
      zin van [artikel 1:3, tweede lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 4.4.1
    text: |-
      Een aanvraag om de afgifte van een gedragsverklaring aanbesteden wordt ingediend bij Onze Minister van Veiligheid
      en Justitie door degene omtrent wiens gedrag een verklaring wordt gevraagd of door een vertegenwoordiger van de
      rechtspersoon omtrent wiens gedrag een verklaring wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.4
  - number: 4.4.2
    text: 'De aanvrager verstrekt bij zijn aanvraag:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.4
  - number: 4.4.2.a
    text: |-
      de in [artikel 32, eerste en tweede lid, van de Wet justitiële en strafvorderlijke gegevens][ref1] bedoelde
      gegevens en


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel32
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '32'
  - number: 4.4.2.b
    text: |-
      de naam, voornamen en adresgegevens van voormalige bestuurders, vennoten, maten of beheerders van de rechtspersoon
      in de 12 maanden voorafgaand aan de aanvraag die nog een beleidsbepalende functie binnen de rechtspersoon bekleden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.4
  - number: 4.4.3
    text: |-
      Onze Minister van Veiligheid en Justitie onderzoekt de volledigheid van de bij de aanvraag verstrekte gegevens en
      verschaft zich de nodige zekerheid over de identiteit van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.4
  - number: 4.4.4
    text: Bij ministeriële regeling kunnen nadere eisen worden gesteld ter uitvoering van het derde lid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.4
  - number: 4.5.1
    text: |-
      Onze Minister van Veiligheid en Justitie beslist op de aanvraag met betrekking tot de afgifte van de
      gedragsverklaring aanbesteden:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.5
  - number: 4.5.1.a
    text: 'indien de aanvraag een natuurlijke persoon betreft: binnen vier weken na ontvangst van de aanvraag;'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.5
  - number: 4.5.1.b
    text: 'indien de aanvraag een rechtspersoon betreft: binnen acht weken na ontvangst van de aanvraag.'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.5
  - number: 4.5.2
    text: |-
      De in het eerste lid, onderdelen a en b, genoemde beslistermijnen kunnen eenmaal worden verlengd met vier
      onderscheidenlijk acht weken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.5
  - number: '4.6'
    text: |-
      [Artikel 39 van de Wet justitiële en strafvorderlijke gegevens][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '39'
  - number: 4.7.1
    text: |-
      Onze Minister van Veiligheid en Justitie betrekt in zijn beoordeling van de aanvraag om een gedragsverklaring
      aanbesteden uitsluitend de gegevens met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.7
  - number: 4.7.1.a
    text: |-
      onherroepelijke veroordelingen als bedoeld in [artikel 2.86, derde lid][ref1], en
      onherroepelijke veroordelingen wegens overtreding van de [artikelen 134a][ref2], [140a][ref3]
      en [285, derde lid, van het Wetboek van Strafrecht][ref4] en wegens overtreding van de in
      [artikel 83 van het Wetboek van Strafrecht][ref5] bedoelde misdrijven indien aan het bepaalde in dat artikel is
      voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel134a
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel140a
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel285
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel83
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.5.1
        afdeling: 2.3.5
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 134a
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 140a
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '285'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '83'
  - number: 4.7.1.b
    text: |-
      onherroepelijke veroordelingen wegens misdrijven die zijn opgenomen in het [Wetboek van Strafrecht][ref1] voor
      zover aangewezen bij algemene maatregel van bestuur, onherroepelijke veroordelingen wegens misdrijven die zijn
      opgenomen in de [Wet op de economische delicten][ref2] en bij algemene maatregel van bestuur aangewezen andere
      misdrijven;


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0002063
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0002063
  - number: 4.7.1.c
    text: |-
      onherroepelijke beschikkingen op grond van [artikel 56 van de Mededingingswet][ref1] waarbij door de Autoriteit
      Consument en Markt geen boetevermindering op grond van clementie is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel56
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '56'
  - number: 4.7.1.d
    text: |-
      onherroepelijke beschikkingen van de Europese Commissie wegens overtreding van artikel 101 of artikel 102 van het
      Verdrag betreffende de werking van de Europese Unie waarbij door de Europese Commissie geen boete-immuniteit of
      boetevermindering op grond van clementie is verleend.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.7
  - number: 4.7.2
    text: |-
      Indien de aanvraag betrekking heeft op een rechtspersoon is
      [artikel 35, tweede lid, van de Wet justitiële en strafvorderlijke gegevens][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel35
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '35'
  - number: 4.7.3
    text: |-
      In het in het tweede lid bedoelde geval betrekt Onze Minister van Veiligheid en Justitie bij
      zijn beoordeling tevens de in het eerste lid, onderdelen a en b, bedoelde gegevens van de in
      [artikel 4,4 tweede lid, onderdeel b][ref1], bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.1'
        afdeling: 4.1.1
  - number: '4.8'
    text: |-
      Veroordelingen en beschikkingen als bedoeld in [artikel 4.7, eerste lid][ref1], worden in de beoordeling betrokken
      voor zover zij in de vier jaar voorafgaand aan de aanvraag onherroepelijk zijn geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.1'
        afdeling: 4.1.2
  - number: 4.9.1
    text: |-
      Onze Minister van Veiligheid en Justitie betrekt bij zijn onderzoek met betrekking tot de afgifte van een
      gedragsverklaring aanbesteden van een natuurlijk persoon de met betrekking tot de aanvrager vermelde justitiële
      gegevens in de justitiële documentatie, bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 4.9.2
    text: |-
      Onze Minister van Veiligheid en Justitie betrekt bij zijn onderzoek met betrekking tot de afgifte van een
      gedragsverklaring aanbesteden van een rechtspersoon de gegevens in de justitiële documentatie, bedoeld
      in de [Wet justitiële en strafvorderlijke gegevens][ref1], op naam van de rechtspersoon en omtrent de in
      [artikel 4.7, tweede en derde lid][ref2], bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0014194
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.1'
        afdeling: 4.1.2
  - number: 4.10.1
    text: |-
      Onze Minister van Veiligheid en Justitie weigert de afgifte van de gedragsverklaring aanbesteden, ingeval de
      aanvrager een natuurlijke persoon is, indien binnen de in [artikel 4.8][ref1] bedoelde termijn:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.1'
        afdeling: 4.1.2
  - number: 4.10.1.a
    text: |-
      een of meerdere veroordelingen als bedoeld in [artikel 4.7, eerste lid, onderdeel a][ref1], onherroepelijk zijn
      geworden;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.1'
        afdeling: 4.1.2
  - number: 4.10.1.b
    text: |-
      een of meer veroordelingen als bedoeld in [artikel 4.7, eerste lid, onderdeel b][ref1], onherroepelijk
      zijn geworden waarbij een onvoorwaardelijke gevangenisstraf of hechtenis is opgelegd of waarbij een of meer
      voorwaardelijke of onvoorwaardelijke geldboetes, taakstraffen of voorwaardelijke gevangenisstraffen of hechtenis
      zijn opgelegd met een gezamenlijke waarde van in totaal € 35 000 of meer;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.1'
        afdeling: 4.1.2
  - number: 4.10.1.c
    text: |-
      een beschikking als bedoeld in [artikel 4.7, eerste lid, onderdeel c][ref1], waarin de overtreding wordt aangemerkt
      als zwaar of zeer zwaar, of een beschikking als bedoeld in artikel 4.7, eerste lid, onderdeel d, onherroepelijk
      is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.1'
        afdeling: 4.1.2
  - number: 4.10.2
    text: |-
      Onze Minister van Veiligheid en Justitie weigert de afgifte van de gedragsverklaring aanbesteden, ingeval de
      aanvrager een rechtspersoon is, indien binnen de in [artikel 4.8][ref1] bedoelde termijn:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.1'
        afdeling: 4.1.2
  - number: 4.10.2.a
    text: |-
      een of meerdere veroordelingen als bedoeld in [artikel 4.7, eerste lid, onderdeel a][ref1], van die rechtspersoon
      of van een of meer personen als bedoeld in artikel 4.7, tweede lid, onherroepelijk zijn geworden;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.1'
        afdeling: 4.1.2
  - number: 4.10.2.b
    text: |-
      een of meer veroordelingen als bedoeld in [artikel 4.7, eerste lid, onderdeel b][ref1], van die rechtspersoon
      of van een of meer personen als bedoeld in artikel 4.7, tweede lid, onherroepelijk zijn geworden waarbij
      een onvoorwaardelijke gevangenisstraf of hechtenis is opgelegd of waarbij een of meer voorwaardelijke of
      onvoorwaardelijke geldboetes, taakstraffen of voorwaardelijke gevangenisstraffen of hechtenis zijn opgelegd met een
      gezamenlijke waarde van in totaal € 35 000 of meer;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.1'
        afdeling: 4.1.2
  - number: 4.10.2.c
    text: |-
      een beschikking als bedoeld in [artikel 4.7, eerste lid, onderdeel c][ref1], waarin de overtreding wordt aangemerkt
      als zwaar of zeer zwaar, of een beschikking als bedoeld in artikel 4.7, eerste lid, onderdeel d, onherroepelijk
      is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.1'
        afdeling: 4.1.2
  - number: 4.10.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing ingeval van veroordelingen van personen als bedoeld in
      [artikel 4.4, tweede lid, onderdeel b][ref1], die op het tijdstip van het nemen van het besluit omtrent de afgifte
      van de gedragsverklaring aanbesteden nog een beleidsbepalende functie binnen de rechtspersoon vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.1'
        afdeling: 4.1.1
  - number: 4.10.4
    text: |-
      Voor de toepassing van het eerste lid, onderdeel b, en tweede lid, onderdeel b, wordt een taakstraf van 1 uur
      gelijkgesteld met een geldboete van 80 euro en een voorwaardelijke gevangenisstraf of hechtenis van 1 dag met een
      geldboete van 160 euro.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.10
  - number: 4.11.1
    text: |-
      Alvorens te beslissen tot weigering van de afgifte van de gedragsverklaring aanbesteden,
      stelt Onze Minister van Veiligheid en Justitie degene van wie een of meer gegevens als
      bedoeld in [artikel 4.7, eerste lid, onderdelen a en b][ref1], ten grondslag hebben
      gelegen aan de beslissing, in de gelegenheid om binnen twee weken een verzoek als
      bedoeld in [artikel 22 van de Wet justitiële en strafvorderlijke gegevens][ref2] dan wel
      [artikel 36 van de Wet bescherming persoonsgegevens][ref3] te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel36
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.1'
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '36'
  - number: 4.11.2
    text: |-
      De in [artikel 4.5][ref1] gestelde termijn voor de beslissing op de aanvraag wordt opgeschort met ingang van de
      dag waarop Onze Minister van Veiligheid en Justitie de gelegenheid heeft geboden tot het doen van een verzoek als
      bedoeld in het eerste lid tot de dag waarop een schriftelijke mededeling is gedaan dat geen verzoek zal worden
      ingediend of twee weken zijn verstreken, dan wel tot de dag waarop de procedure naar aanleiding van een verzoek
      is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.1'
        afdeling: 4.1.1
  - number: 4.11.3
    text: De aanvrager van de gedragsverklaring aanbesteden wordt in kennis gesteld van de opschorting.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.11
  - number: 4.12.1
    text: |-
      Ter uitvoering van de [richtlijnen nrs. 2004/17/EG](32004L0017) en [nr. 2004/18/EG](32004L0018) wordenbij of
      krachtens algemene maatregel van bestuur nadere regels gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.12
  - number: 4.12.1.a
    text: |-
      het gebruik van de elektronische weg: voorwaarden die de aanbestedende dienst of het speciale-sectorbedrijf voor
      het gebruik daarvan kan stellen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.12
  - number: 4.12.1.b
    text: |-
      communicatie tussen aanbestedende dienst of het speciale-sectorbedrijf en ondernemer: de middelen, de wijze waarop
      gegevens aangeboden en opgeslagen worden, elektronisch indienen van inschrijvingen, elektronisch indienen van
      certificaten en de wijze waarop verzoeken tot deelneming kunnen worden gedaan.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.12
  - number: 4.12.2
    text: |-
      Ter uitvoering van [richtlijn nr. 2004/18/EG](32004L0018) kunnen bij of krachtens algemene maatregel van bestuur
      regels worden gesteld omtrent de instelling, afgifte en bewijskracht van certificaten dan wel de instelling van,
      opname in en bewijskracht van de opname op een erkenningslijst.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.12
  - number: 4.13.1
    text: |-
      Onze Minister draagt zorg voor het inrichten, instandhouden, de werking en het beveiligen van een elektronisch
      systeem voor aanbestedingen, met behulp waarvan:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.13
  - number: 4.13.1.a
    text: |-
      de aankondigingen worden gezonden aan de Europese Commissie ter publicatie in het Publicatieblad van de Europese
      Unie;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.13
  - number: 4.13.1.b
    text: aankondigingen en andere gegevens kunnen worden bekendgemaakt in het kader van een aanbestedingsprocedure;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.13
  - number: 4.13.1.c
    text: |-
      gegevens worden verzameld met het oog op het vervullen van de statistiekverplichtingen op grond van [richtlijnen
      nrs. 2004/17/EG](32004L0017) en [2004/18/EG](32004L0018);
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.13
  - number: 4.13.1.d
    text: |-
      gegevens worden verzameld ten behoeve van verslaglegging van Onze Minister aan de beide Kamers van de Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.13
  - number: 4.13.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de toegang tot en aansluiting op het
      elektronische systeem voor aanbestedingen ten behoeve van het doen van aankondigingen als bedoeld in het eerste
      lid, onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.13
  - number: 4.14.1
    text: |-
      Onze Minister stelt door middel van het elektronische systeem van aanbesteden de door de Europese Commissie met
      inachtneming van artikel 70 van [richtlijn nr. 2004/17/EG](32004L0017) en artikel 79 van [richtlijn nr. 2004/18/EG]
      (32004L0018) vastgestelde formulieren beschikbaar voor:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
  - number: 4.14.1.a
    text: de vooraankondiging van een overheidsopdracht;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
  - number: 4.14.1.b
    text: de periodieke indicatieve aankondiging van een speciale sectoropdracht;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
  - number: 4.14.1.c
    text: |-
      de aankondiging van een overheidsopdracht, speciale-sectoropdracht, concessieovereenkomst voor openbare werken
      of prijsvraag;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
  - number: 4.14.1.d
    text: de aankondiging door middel van een kopersprofiel;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
  - number: 4.14.1.e
    text: de vereenvoudigde aankondiging via een dynamisch aankoopsysteem;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
  - number: 4.14.1.f
    text: |-
      de aankondiging van een gegunde overheidsopdracht, speciale-sectoropdracht of concessieovereenkomst voor openbare
      werken;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
  - number: 4.14.1.g
    text: de bekendmaking van de resultaten van een prijsvraag;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
  - number: 4.14.1.h
    text: erkenningsregeling;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
  - number: 4.14.1.i
    text: rectificatie van een aankondiging;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
  - number: 4.14.1.j
    text: |-
      de aankondiging, bedoeld in [artikel 4.16, eerste lid, onder b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.3'
        afdeling: 4.3.1
  - number: 4.14.2
    text: |-
      Onze Minister kan door middel van het elektronische systeem voor aanbestedingen tevens formulieren ter beschikking
      stellen voor aankondigingen waarop [deel 2][ref1] of [deel 3][ref2] van deze wet niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0032203
      [ref2]: https://wetten.overheid.nl/BWBR0032203
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0032203
      - id: ref2
        bwb_id: BWBR0032203
  - number: 4.14.3
    text: |-
      Op verzoek van de aanbestedende dienst, het speciale-sectorbedrijf of de concessiehouder wijst Onze Minister de
      Europese Commissie op gegevens die niet voor publicatie bestemd zijn. Deze gegevens worden niet door middel van het
      elektronische systeem van aanbesteden bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
  - number: 4.14.4
    text: |-
      Onze Minister draagt er zorg voor dat door middel van het elektronische systeem van aanbesteden de mededelingen,
      genoemd in [artikel 4.13, onder a][ref1], langs elektronische weg ter publicatie worden gezonden aan de Europese
      Commissie overeenkomstig het model en op de wijze, bedoeld in bijlage XX van [richtlijn nr. 2004/17/EG](32004L0017)
      en in het derde punt van bijlage VIII van [richtlijn nr. 2004/18/EG](32004L0018).


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.2'
        afdeling: 4.2.2
  - number: 4.14.5
    text: |-
      Een wijziging van een formulier, bedoeld in artikel 70 van [richtlijn nr. 2004/17/EG](32004L0017) en artikel 79
      van [richtlijn nr. 2004/18/EG](32004L0018) gaat voor de toepassing van het eerste lid gelden met ingang van de dag
      waarop het desbetreffende besluit van de Europese Commissie in werking treedt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
  - number: 4.14.6
    text: |-
      Onze Minister is verantwoordelijke als bedoeld in
      [artikel 1, onder d, van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 4.14.7
    text: Onze Minister doet mededeling in de Staatscourant van een besluit als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.14
  - number: 4.15.1
    text: |-
      Een als resultaat van een gunningsbeslissing gesloten overeenkomst is in rechte vernietigbaar op een van de
      volgende gronden:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.15
  - number: 4.15.1.a
    text: |-
      de aanbestedende dienst of het speciale-sectorbedrijf heeft, in strijd met [deel 2][ref1] of [deel 3][ref2] van
      deze wet, de overeenkomst gesloten zonder voorafgaande bekendmaking van een aankondiging van de opdracht in het
      Publicatieblad van de Europese Unie;


      [ref1]: https://wetten.overheid.nl/BWBR0032203
      [ref2]: https://wetten.overheid.nl/BWBR0032203
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0032203
      - id: ref2
        bwb_id: BWBR0032203
  - number: 4.15.1.b
    text: |-
      de aanbestedende dienst of het speciale-sectorbedrijf heeft, in strijd met de wet, de termijnen, bedoeld in
      [artikel 2.127, eerste lid][ref1], onderscheidenlijk [2 131][ref2], niet in acht genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.8
        afdeling: 2.3.8
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.8
        afdeling: 2.3.8
  - number: 4.15.1.c
    text: |-
      de aanbestedende dienst of het speciale-sectorbedrijf heeft toepassing gegeven aan
      [artikel 2.127, vierde lid, onder c][ref1], bij de gunning van een opdracht waarvan de geraamde
      waarde gelijk is aan of hoger is dan het in de [artikelen 2.1 tot en met 2.7][ref2] respectievelijk de
      [artikelen 3.8][ref3] en [3.9][ref4] bedoelde toepasselijke bedrag, en heeft daarbij in strijd gehandeld met
      [artikel 2.143, tweede lid, onderdeel b][ref5], of de [artikelen 2.147][ref6] of [2.148][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0032203#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.8
        afdeling: 2.3.8
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.1'
        paragraaf: 2.1.1.1
        afdeling: 2.1.1
      - id: ref3
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.1'
        afdeling: 3.1.2
      - id: ref4
        bwb_id: BWBR0032203
        artikel: '3'
        hoofdstuk: '3.1'
        afdeling: 3.1.2
      - id: ref5
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.1
      - id: ref6
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.2
      - id: ref7
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.2
  - number: 4.15.2
    text: |-
      De vordering tot vernietiging wordt door een ondernemer die zich door een gunningsbeslissing benadeeld acht
      ingesteld:
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.15
  - number: 4.15.2.a
    text: |-
      voor het verstrijken van een periode van 30 kalenderdagen ingaande op de dag na de datum waarop - de aanbestedende
      dienst of het speciale-sectorbedrijf de aankondiging van de gegunde opdracht bekendmaakte overeenkomstig de
      [artikelen 2.134 tot en met 2.138][ref1], mits deze aankondiging ook de rechtvaardiging bevat van de beslissing van
      de aanbestedende dienst of het speciale-sectorbedrijf om de opdracht te gunnen zonder voorafgaande bekendmaking van
      een aankondiging van de opdracht, of
        - de aanbestedende dienst of het speciale-sectorbedrijf aan de betrokken inschrijvers en gegadigden een
      kennisgeving zond van de sluiting van de overeenkomst, op voorwaarde dat die kennisgeving vergezeld gaat van de
      relevante redenen voor de gunningsbeslissing;


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.9
        afdeling: 2.3.8
  - number: 4.15.2.b
    text: |-
      in andere gevallen dan bedoeld in onderdeel a, voor het verstrijken van een periode van zes maanden, ingaande op de
      dag na de datum waarop de overeenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.15
  - number: 4.16.1
    text: |-
      [Artikel 4.15, eerste lid, aanhef en onder a][ref1], is niet van toepassing indien de aanbestedende dienst of het
      speciale-sectorbedrijf:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.3'
        afdeling: 4.3.1
  - number: 4.16.1.a
    text: |-
      van mening is dat de gunning van een opdracht zonder voorafgaande bekendmaking van een aankondiging van de opdracht
      door middel van het elektronische systeem voor aanbestedingen op grond van deze wet is toegestaan,
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.16
  - number: 4.16.1.b
    text: |-
      de aankondiging van zijn voornemen om tot sluiting van de overeenkomst over te gaan door middel van het
      elektronische systeem voor aanbestedingen in het Publicatieblad van de Europese Unie heeft bekendgemaakt, en
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.16
  - number: 4.16.1.c
    text: |-
      de overeenkomst niet heeft gesloten voor het verstrijken van een termijn van ten minste twintig kalenderdagen,
      ingaande op de dag na de datum van de bekendmaking van bedoelde aankondiging.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.16
  - number: 4.16.2
    text: |-
      [Artikel 4.15, eerste lid, aanhef en onder c][ref1], is niet van toepassing indien de aanbestedende dienst of het
      speciale-sectorbedrijf:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.3'
        afdeling: 4.3.1
  - number: 4.16.2.a
    text: |-
      van mening is dat de gunning van een opdracht in overeenstemming is met[ 2 143, tweede lid, onderdeel b][ref1], of
      de [artikelen 2.147][ref2] of [2.148][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.1
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.2
      - id: ref3
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.4'
        afdeling: 2.4.2
  - number: 4.16.2.b
    text: |-
      het besluit tot gunning van de opdracht, tezamen met de relevante redenen, bedoeld in
      [artikel 2.130, eerste en tweede lid][ref1], aan de betrokken inschrijvers heeft gezonden, en


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
        hoofdstuk: '2.3'
        paragraaf: 2.3.8.8
        afdeling: 2.3.8
  - number: 4.16.2.c
    text: |-
      de overeenkomst niet is gesloten vóór het verstrijken van een termijn van ten minste twintig kalenderdagen,
      ingaande op de dag na de datum waarop het besluit tot gunning van de opdracht aan de betrokken inschrijvers is
      gezonden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.16
  - number: 4.17.1
    text: |-
      De aankondiging, bedoeld in [artikel 4.16, eerste lid, onder b][ref1], bevat tenminste de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.3'
        afdeling: 4.3.1
  - number: 4.17.1.a
    text: de naam en contactgegevens van de aanbestedende dienst of het speciale-sectorbedrijf;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.17
  - number: 4.17.1.b
    text: een beschrijving van het onderwerp van de opdracht;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.17
  - number: 4.17.1.c
    text: |-
      een rechtvaardiging van de beslissing om de opdracht te gunnen zonder voorafgaande bekendmaking van een
      aankondiging van de opdracht in het Publicatieblad van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.17
  - number: 4.17.1.d
    text: |-
      de naam en contactgegevens van de onderneming ten gunste van wie de beslissing om een opdracht te gunnen is
      genomen;
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.17
  - number: 4.17.1.e
    text: |-
      voor zover van toepassing alle andere informatie die de aanbestedende dienst of het speciale-sectorbedrijf nuttig
      acht.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.17
  - number: 4.17.2
    text: |-
      De bekendmaking van de aankondiging, bedoeld in het eerste lid, geschiedt langs elektronische weg, met
      gebruikmaking van het elektronische systeem voor aanbestedingen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.17
  - number: 4.17.3
    text: |-
      De aanbestedende dienst of het speciale-sectorbedrijf gebruikt voor de bekendmaking van de aankondiging, bedoeld
      in het eerste lid, het daartoe door middel van het elektronische systeem voor aanbestedingen beschikbaar gestelde
      formulier.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.17
  - number: 4.18.1
    text: |-
      De rechter kan besluiten een overeenkomst niet te vernietigen indien, alle relevante aspecten in aanmerking
      genomen, dwingende redenen van algemeen belang het noodzakelijk maken dat de overeenkomst in stand blijft.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.18
  - number: 4.18.2
    text: |-
      Economische belangen mogen alleen als een dwingende reden als bedoeld in het eerste lid worden beschouwd indien
      vernietiging in uitzonderlijke omstandigheden onevenredig grote gevolgen zou hebben. Economische belangen die
      rechtstreeks verband houden met de betrokken overeenkomst, mogen evenwel geen dwingende reden als bedoeld in
      het eerste lid vormen. Zodanige belangen omvatten onder meer de kosten die voortvloeien uit vertraging bij de
      uitvoering van de overeenkomst, de kosten van een nieuwe aanbestedingsprocedure, de kosten die veroorzaakt worden
      door het feit dat een andere onderneming de overeenkomst uitvoert, en de kosten van de wettelijke verplichtingen
      die voortvloeien uit de vernietiging.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.18
  - number: 4.19.1
    text: |-
      Indien de rechter toepassing geeft aan [artikel 4.18, eerste lid][ref1], kan de rechter op verzoek van een
      belanghebbende of ambtshalve de looptijd van de overeenkomst verkorten.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.3'
        afdeling: 4.3.1
  - number: 4.19.2
    text: |-
      De rechter houdt in ieder geval rekening met de ernst van de overtreding, het gedrag van de aanbestedende dienst of
      het speciale-sectorbedrijf, de aard van de overeenkomst en, in voorkomend geval, met de mogelijkheid om de werking
      van een vernietiging te beperken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.19
  - number: 4.20.1
    text: |-
      Indien de rechter toepassing heeft gegeven aan [artikel 4.18, eerste lid][ref1], of indien de overeenkomst wel
      wordt vernietigd op grond van [artikel 4.15, eerste lid][ref2], maar aan die vernietiging de werking geheel of
      gedeeltelijk wordt ontzegd, wordt door de griffie van de rechtbank onverwijld en kosteloos een afschrift van de
      uitspraak gezonden aan Onze Minister en aan de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.3'
        afdeling: 4.3.1
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.3'
        afdeling: 4.3.1
  - number: 4.20.2
    text: |-
      Onze Minister draagt zorg dat afschriften van uitspraken als bedoeld in het eerste lid eenmaal per jaar aan de
      Europese Commissie worden gezonden.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.20
  - number: 4.21.1
    text: |-
      De Autoriteit Consument en Markt legt de aanbestedende dienst die of het speciale-sectorbedrijf dat partij is bij
      een overeenkomst waarbij toepassing is gegeven aan [artikel 4.18, eerste lid][ref1], een bestuurlijke boete op.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.3'
        afdeling: 4.3.1
  - number: 4.21.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien de overeenkomst in rechte is vernietigd doch de werking
      geheel of gedeeltelijk aan die vernietiging is ontzegd.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.21
  - number: 4.21.3
    text: |-
      De in het eerste lid bedoelde boete is afschrikkend, evenredig en doeltreffend, beschouwd in samenhang met de in
      [artikel 4.19][ref1] bedoelde verkorting van de looptijd.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.3'
        afdeling: 4.3.1
  - number: 4.21.4
    text: |-
      De bestuurlijke boete bedraagt ten hoogste vijftien procent van de geraamde waarde van de desbetreffende opdracht.
      Bij het bepalen van de hoogte van de boete neemt de Autoriteit Consument en Markt de relevante omstandigheden van
      het geval, waaronder de ernst van de overtreding, in acht.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.21
  - number: 4.21.5
    text: De te betalen geldsom van de opgelegde bestuurlijke boete komt toe aan de Staat.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.21
  - number: 4.22.1
    text: |-
      De Autoriteit Consument en Markt neemt de beschikking, bedoeld in [artikel 4.21, eerste lid][ref1], niet dan nadat
      de uitspraak, bedoeld in [artikel 4.20, eerste lid][ref2], kracht van gewijsde heeft gekregen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.3'
        afdeling: 4.3.2
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.3'
        afdeling: 4.3.1
  - number: 4.22.2
    text: |-
      De werking van een beschikking waarmee een bestuurlijke boete is opgelegd, wordt opgeschort totdat de
      beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.22
  - number: 4.23.1
    text: |-
      De Autoriteit Consument en Markt kan onder haar ressorterende ambtenaren aanwijzen als toezichthouders als bedoeld
      in [artikel 5:48 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 4.23.2
    text: |-
      Alvorens een boete op te leggen kan de Autoriteit Consument en Markt de overeenkomst onderzoeken teneinde de voor
      het vaststellen van de boete in aanmerking komende financiële gegevens te bepalen.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.23
  - number: 4.23.3
    text: |-
      De aanbestedende dienst of het speciale-sectorbedrijf is verplicht mee te werken aan de onderzoeken, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.23
  - number: '4.24'
    text: |-
      Indien de overeenkomst, bedoeld in [artikel 4.21][ref1], is gesloten of mede is gesloten ten bate van de Autoriteit
      Consument en Markt, worden de bevoegdheden van de [artikelen 4.21 tot en met 4.23][ref2] uitgeoefend door Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Artikel4
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.3'
        afdeling: 4.3.2
      - id: ref2
        bwb_id: BWBR0032203
        artikel: '4'
        hoofdstuk: '4.3'
        afdeling: 4.3.2
  - number: '4.26'
    text: 'Indien terzake van een aanbestedingsgeschil arbitrage is overeengekomen:'
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.26
  - number: 4.26.a
    text: |-
      voldoet de voorzitter van het scheidsgerecht aan de eisen, genoemd in [artikelen 1c][ref1] en
      [1d van de Wet rechtspositie rechterlijke ambtenaren][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel1c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel1d
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.26
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 1c
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 1d
  - number: 4.26.b
    text: |-
      kan tegen een arbitraal vonnis een vordering tot vernietiging als bedoeld in
      [artikel 1.064 van het Wetboek van Burgerlijke Rechtsvordering][ref1] worden ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1064
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.26
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1064'
  - number: '4.27'
    text: |-
      Onze Minister bevordert de instelling van een commissie die tot doel heeft onafhankelijk advies te geven over
      klachten met betrekking tot aanbestedingsprocedures.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.27
  - number: 4.28.1
    text: |-
      Onze Minister onderzoekt binnen twee jaar na de inwerkingtreding van deze wet de wijze waarop aanbestedende
      diensten overheidsopdrachten voor leveringen en diensten beneden de in [afdeling 2.1.1][ref1] van deze wet bedoelde
      waarden plaatsen. Hij doet daarvan verslag aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk2.1
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.28
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '2.1'
        afdeling: 2.1.1
  - number: 4.28.2
    text: |-
      Indien uit de in het eerste lid bedoelde evaluatie blijkt dat het plaatsen van opdrachten als bedoeld in dat lid op
      onvoldoende uniforme wijze geschiedt kan bij algemene maatregel van bestuur een richtsnoer worden aangewezen waarin
      voorschriften zijn vervat met betrekking tot de wijzen waarop door bij die algemene maatregel van bestuur aan te
      wijzen aanbestedende diensten overheidsopdrachten als bedoeld in het eerste lid worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.28
  - number: 4.28.3
    text: |-
      Indien toepassing is gegeven aan het tweede lid, past de aanbestedende dienst de voorschriften toe of motiveert een
      afwijking van een of meer van die voorschriften in de aanbestedingsstukken.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.28
  - number: 4.28.4
    text: De in het derde lid bedoelde motivering wordt op diens schriftelijk verzoek aan een ondernemer verstrekt.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.28
  - number: 4.28.5
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overlegd. De voordracht wordt
      gedaan door Onze Minister van Economische Zaken in overeenstemming met Onze Minister of Ministers wie het mede
      aangaat.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.28
  - number: '4.29'
    text: |-
      Onze Minister onderzoekt binnen twee jaar na de inwerkingtreding van deze wet de doeltreffendheid en de effecten
      van deze wet in de praktijk en doet daarvan verslag aan de Staten-Generaal. In het verslag wordt in het bijzonder
      aandacht besteed aan de toegang van ondernemers tot opdrachten en aan de naleving.
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.29
  - number: 4.30.1
    text: |-
      Indien een aanbestedende dienst of een speciale-sectorbedrijf voor het tijdstip van inwerkingtreding
      van [deel 2][ref1] onderscheidenlijk [deel 3][ref2] van deze wet met toepassing van het
      [Besluit aanbestedingsregels voor overheidsopdrachten][ref3] of het [Besluit aanbestedingen speciale sectoren][ref4]
      een aankondiging van een aanbesteding heeft gedaan dan wel overeenkomstig de bepalingen van het desbetreffende
      besluit een aanbestedingsprocedure zonder aankondiging is gestart en in het kader daarvan een of meer ondernemers
      heeft verzocht een inschrijving in te dienen, is op die aanbesteding het recht van toepassing zoals dat gold
      onmiddellijk voor het tijdstip van inwerkingtreding van deel 2 onderscheidenlijk deel 3 van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0032203
      [ref2]: https://wetten.overheid.nl/BWBR0032203
      [ref3]: https://wetten.overheid.nl/BWBR0018607
      [ref4]: https://wetten.overheid.nl/BWBR0018608
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0032203
      - id: ref2
        bwb_id: BWBR0032203
      - id: ref3
        bwb_id: BWBR0018607
      - id: ref4
        bwb_id: BWBR0018608
  - number: 4.30.2
    text: |-
      De [afdelingen 1.2.2][ref1], [1.2.3][ref2] en [hoofdstuk 1.3][ref3] zijn niet van toepassing op aanbestedingen
      met betrekking waartoe voor het tijdstip van inwerkingtreding van [deel 1][ref4] van deze wet een aankondiging is
      bekendgemaakt of twee of meer ondernemers zijn uitgenodigd om een inschrijving in te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk1.2
      [ref2]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk1.2
      [ref3]: https://wetten.overheid.nl/BWBR0032203#Hoofdstuk1.3
      [ref4]: https://wetten.overheid.nl/BWBR0032203
    url: https://wetten.overheid.nl/BWBR0032203/2014-01-25#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0032203
        hoofdstuk: '1.2'
        afdeling: 1.2.2
      - id: ref2
        bwb_id: BWBR0032203
        hoofdstuk: '1.2'
        afdeling: 1.2.3
      - id: ref3
        bwb_id: BWBR0032203
        hoofdstuk: '1.3'
      - id: ref4
        bwb_id: BWBR0032203
  - number: '4.31'
    text: |-
      Tot een jaar na het tijdstip van inwerkingtreding van [artikel 2.89][ref1] kan een gegadigde of inschrijver,
      in afwijking van artikel 2.89, tweede lid, door middel van een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref2] die op het tijdstip van het indienen van het
      verzoek tot deelneming of de inschrijving niet ouder is dan een jaar, aantonen dat de uitsluitingsgronden, bedoeld
      in de [artikelen 2.86][ref3] en [2.87, onderdelen b en c][ref4]op hem niet van toepassing zijn.


