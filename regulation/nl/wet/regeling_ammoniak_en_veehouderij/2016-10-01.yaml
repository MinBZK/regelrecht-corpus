articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:




              *bijlage:*


              bij deze regeling behorende bijlage;




              *de wet:*


              de [Wet ammoniak en veehouderij][ref1];




              *de minister:*


              de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0013402
    url: https://wetten.overheid.nl/BWBR0013629/2016-10-01#Artikel1
