        bwb_id: BWBR0013402
  - number: '2'
    text: |-
      1 Voor de berekening van de ammoniakemissie van een veehouderij worden de emissiefactoren toegepast die zijn
      opgenomen in bijlage 1 bij deze regeling.

      2 Indien in een huisvestingssysteem een voer- of managementmaatregel zoals opgenomen in bijlage 2 bij deze regeling
      wordt toegepast, wordt de emissiefactor verlaagd met het bij die maatregel vermelde reductiepercentage.

      3 Indien in een huisvestingssysteem meer dan een voer- of managementmaatregel zoals opgenomen in bijlage 2 bij
      deze regeling wordt toegepast, wordt de emissiefactor verlaagd met het overeenkomstig [bijlage 3][ref1] berekende
      reductiepercentage op basis van twee maatregelen.

      4 Het tweede en derde lid gelden niet bij de toepassing van het [Besluit emissiearme huisvesting][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013629
      [ref2]: https://wetten.overheid.nl/BWBR0036748
    url: https://wetten.overheid.nl/BWBR0013629/2016-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013629
      - id: ref2
        bwb_id: BWBR0036748
  - number: '3'
    text: |-
      1 De minister kan voor een huisvestingssysteem dat niet in bijlage 1 is opgenomen een bijzondere emissiefactor
      vaststellen die bij de berekening van de ammoniakemissie wordt toegepast in plaats van de emissiefactor die anders
      zou worden toegepast ingevolge [artikel 2][ref1].

      2 Een bijzondere emissiefactor wordt vastgesteld op aanvraag van degene die de veehouderij drijft of gaat drijven.

      3 De minister kan een bijzondere emissiefactor vaststellen indien naar zijn oordeel:

      a. toepassing van het huisvestingssysteem voldoende bijdraagt aan de ontwikkeling van een huisvestingssysteem dat
      bijdraagt aan de bescherming van het milieu tegen de gevolgen van de ammoniakemissie,

      b. het huisvestingssysteem zich leent voor toepassing in de praktijk,

      c. de controleerbaarheid van de werking van het huisvestingssysteem voldoende is gewaarborgd, en

      d. voldoende is gewaarborgd dat de ammoniakemissie overeenkomstig het Protocol voor meting van ammoniakemissie uit
      huisvestingssystemen in de veehouderij 2013 of een gelijkwaardige meetmethode wordt gemeten en dat over de wijze
      van meten en de resultaten van de metingen aan hem wordt gerapporteerd.

      4 Voor eenzelfde type huisvestingssysteem kan voor ten hoogste vier veehouderijen – en per veehouderij slechts voor
      een huisvestingssysteem – een bijzondere emissiefactor worden vastgesteld.

      5 Op aanvragen als bedoeld in het tweede lid, die betrekking hebben op eenzelfde huisvestingssysteem en dezelfde
      diercategorie, wordt in volgorde van ontvangst beslist.

      6 De beschikking tot vaststelling van een bijzondere emissiefactor wordt gegeven binnen twintig weken na ontvangst
      van de aanvraag.

      7 Onder het voldoende bijdragen van een huisvestingssysteem aan de bescherming van het milieu tegen de gevolgen
      van de ammoniakemissie, bedoeld in het derde lid, onderdeel a, wordt in ieder geval verstaan dat de bijzondere
      emissiefactor niet hoger is dan:

      a. de laagste maximale emissiewaarde die voor betreffende diercategorie is opgenomen in
      [bijlage 1 van het Besluit emissiearme huisvesting][ref2], tenzij sprake is van huisvestingssystemen voor dieren
      waarop een uitzondering als bedoeld in [artikel 2, tweede lid, van het Besluit emissiearme huisvesting][ref3] van
      toepassing is;

      b. 75% van de emissiefactor voor overige huisvestingssystemen zoals opgenomen in bijlage 1 van deze
      regeling voor zover geen maximale emissiewaarde voor de betreffende diercategorie is opgenomen in
      [bijlage 1 van het Besluit emissiearme huisvesting][ref4].


