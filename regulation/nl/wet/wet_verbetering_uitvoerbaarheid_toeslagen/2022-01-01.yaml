  - number: VI
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 2021 met dien verstande dat:

      a. [artikel I][ref1] en [artikel IV, onderdelen A, onder 7, F en H][ref2], in werking treden op een bij koninklijk
      besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden
      vastgesteld;

      b. [artikel IIA][ref3] en [artikel IV, onderdelen B, Da en K][ref4], met ingang van 1 januari 2022 in werking
      treden;

      c. [artikel IV, onderdeel Lc][ref5], terugwerkt tot en met 1 november 2020.


