preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is maatregelen te treffen waarmee de uitvoerbaarheid van
    de inkomensafhankelijke regelingen wordt verbeterd door het versterken van de menselijke maat, het verbeteren van
    de praktische rechtsbescherming en het voorkomen van schrijnende situaties als gevolg van partnerschap en daartoe
    in de Algemene wet inkomensafhankelijke regelingen en enige andere wetten wijzigingen aan te brengen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0044577/2022-01-01#ArtikelAanhef
articles:
  - number: V
    text: |-
      1 De in [artikel IV, onderdeel D][ref1], opgenomen [artikelen 26a](onbekend) en [26b van de Algemene wet
      inkomensafhankelijke regelingen](onbekend) vinden voor het eerst toepassing met betrekking tot berekeningsjaren die
      aanvangen op of na 1 januari 2021.

      2 [Artikel 38 van de Algemene wet inkomensafhankelijke regelingen][ref2] zoals dat luidde op 31 december 2020
      blijft van toepassing met betrekking tot berekeningsjaren die zijn aangevangen voor 1 januari 2021.


      [ref1]: https://wetten.overheid.nl/BWBR0044577#ArtikelIV
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel38
