articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *minister:* Minister van Onderwijs, Cultuur en Wetenschap,

      b. Regeling: [Regeling op het specifiek cultuurbeleid][ref1],

      c. *handboek:* [bijlage bij de regeling][ref2], te weten het
      [Handboek verantwoording cultuursubsidies instellingen 2009–2012][ref3], en

      d. *instelling:* instelling als bedoeld in [artikel 4a][ref4] en
      [4b van de Wet op het specifiek cultuurbeleid][ref5] met uitzondering van:

      a. instellingen als bedoeld in de [artikelen 9k][ref6], [9m][ref7] en
      [9n van de Regeling subsidies en uitkeringen cultuuruitingen][ref8] zoals die luiden op de dag voorafgaande aan de
      inwerkingtreding van het Besluit op het specifiek cultuurbeleid,

      b. instellingen die zijn opgenomen in de bijlage bij deze regeling, en

      c. instellingen waarvan het beheer door middel van het [Mandaatbesluit FCP][ref9] is overgedragen aan de stichting
      Fonds voor cultuurparticipatie.


