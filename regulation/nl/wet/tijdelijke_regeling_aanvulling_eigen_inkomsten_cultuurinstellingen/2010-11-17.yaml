  - number: 1a
    text: |-
      Deze regeling berust op [artikel 4 van het Besluit op het specifiek cultuurbeleid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027600#Artikel4
    url: https://wetten.overheid.nl/BWBR0025390/2010-11-17#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0027600
        artikel: '4'
  - number: '2'
    text: |-
      1 De minister kan aan instellingen waaraan over de jaren 2009, 2010, 2011 en 2012 een vierjaarlijkse subsidie is
      verleend subsidie verlenen in aansluiting op de eigen inkomsten van die instellingen.

      2 De subsidie wordt verleend met het doel om instellingen te stimuleren de omvang van de eigen inkomsten te
      vergroten.

      3 In 2013 komen uitsluitend voor subsidie op grond van deze regeling in aanmerking instellingen waaraan over 2013
      door de minister of door een fonds als bedoeld in [artikel 4c van de Wet op het specifiek cultuurbeleid][ref1],
      subsidie, anders dan een projectsubsidie, wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel4c
    url: https://wetten.overheid.nl/BWBR0025390/2010-11-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: 4c
  - number: '3'
    text: |-
      Voor subsidieverlening op grond van deze regeling is voor het jaar 2010 een bedrag van € 10 miljoen beschikbaar en
      voor de jaren 2011, 2012 en 2013 een bedrag van € 0 beschikbaar.
    url: https://wetten.overheid.nl/BWBR0025390/2010-11-17#Artikel3
  - number: '4'
    text: |-
      1 De subsidie per subsidieontvanger is het bedrag dat overeenkomt met de extra eigen inkomsten die de instelling
      in onderscheidenlijk 2009, 2010, 2011 en 2012 heeft verworven ten opzichte van de gemiddelde eigen inkomsten in de
      jaren 2005, 2006, 2007 en 2008.

      2 Voor de berekening van de gemiddelde eigen inkomsten in de jaren 2005, 2006, 2007 en 2008 wordt het jaar met de
      hoogste eigen inkomsten en het jaar met de laagste eigen inkomsten buiten beschouwing gelaten, en wordt uitgegaan
      van het gemiddelde van de overige jaren.

      3 De subsidie wordt jaarlijks in 2010, 2011, 2012 en 2013 verstrekt als aanvulling op de vierjaarlijkse subsidie.
    url: https://wetten.overheid.nl/BWBR0025390/2010-11-17#Artikel4
  - number: '5'
    text: |-
      1 Eigen inkomsten in de zin van deze regeling zijn de volgende baten:

      a. publieksinkomsten,

      b. inkomsten uit het VSBfonds,

      c. andere eigen inkomsten, niet zijnde publiekinkomsten of inkomsten uit het VSBfonds, te weten:

      1. directe opbrengsten te weten sponsorinkomsten en overige inkomsten :

      2. indirecte opbrengsten, en

      3. overige subsidies/bijdragen voor zover het betreft bijdragen uit private middelen.

      2 Onder eigen inkomsten worden in elk geval niet begrepen de volgende baten als bedoeld in het handboek:

      a. subsidies die zijn verstrekt vanwege het Ministerie van Onderwijs, Cultuur en Wetenschap, een provincie of een
      gemeente,

      b. overige subsidies/bijdragen voor zover het betreft subsidies uit publieke middelen,

      c. rentebaten, en

      d. overige baten die geen relatie hebben met cultureel ondernemerschap.

      3 Voor de berekening van de extra eigen inkomsten wordt eerst de groei per onderdeel als bedoeld in het eerste lid
      berekend. Op basis daarvan worden de totale extra eigen inkomsten berekend.
    url: https://wetten.overheid.nl/BWBR0025390/2010-11-17#Artikel5
  - number: '6'
    text: |-
      1 De hoogte van de subsidie wordt bepaald op basis van de jaarrekening van de instelling.

      2 Indien aan een instelling geen vierjaarlijkse subsidie is verstrekt over de jaren 2005, 2006, 2007 en 2008,
      zendt de instelling de jaarrekeningen over die jaren voor 1 mei 2009 aan de minister. Indien een instelling slechts
      gedurende een aantal van die jaren bestond, zendt de instelling de jaarrekeningen over de betreffende jaren.
      Indien een instelling gedurende minder dan drie van die jaren bestond, blijft [artikel 4, tweede lid][ref1], buiten
      toepassing.

      3 De subsidieontvanger verschaft zo nodig nadere inlichtingen die noodzakelijk zijn voor het berekenen van de
      gemiddelde eigen inkomsten in de jaren 2005, 2006, 2007 en 2008.


      [ref1]: https://wetten.overheid.nl/BWBR0025390#Artikel4
    url: https://wetten.overheid.nl/BWBR0025390/2010-11-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0025390
        artikel: '4'
  - number: '7'
    text: |-
      Wanneer het subsidieplafond wordt overschreden wordt aan een instelling niet meer subsidie verstrekt dan € 500.000,
      met dien verstande dat:

      a. indien dit ertoe leidt dat het subsidieplafond niet wordt bereikt, dit maximumbedrag per instelling wordt
      verhoogd tot een zodanig bedrag dat daardoor het subsidieplafond wordt bereikt, en

      b. indien dit ertoe leidt dat het subsidieplafond wordt overschreden, alle te verstrekken subsidiebedragen naar
      rato worden verlaagd.
    url: https://wetten.overheid.nl/BWBR0025390/2010-11-17#Artikel7
  - number: '8'
    text: |-
      In geval van het niet vervullen van de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1], worden de met inachtneming van
      [artikel 3][ref2] te verstrekken subsidiebedragen verlaagd tot het bedrag van de subsidie dat na de vaststelling
      of goedkeuring van de begroting ter beschikking staat, een en ander naar rato van het aantal instellingen dat voor
      subsidie in aanmerking komt en van de hoogte van de subsidiebedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel434
      [ref2]: https://wetten.overheid.nl/BWBR0025390#Artikel3
    url: https://wetten.overheid.nl/BWBR0025390/2010-11-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:34
      - id: ref2
        bwb_id: BWBR0025390
        artikel: '3'
  - number: '9'
    text: |-
      De subsidie wordt onverminderd [artikel 2.16 van de Regeling][ref1] aangewend voor de activiteiten van de
      instelling waarvoor vierjaarlijkse subsidie is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2.16
    url: https://wetten.overheid.nl/BWBR0025390/2010-11-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2.16'
  - number: '10'
    text: |-
      De verklaring van de accountant van de jaarrekening van de instelling omvat tevens een oordeel over de rechtmatige
      besteding van de subsidie.
    url: https://wetten.overheid.nl/BWBR0025390/2010-11-17#Artikel10
  - number: '11'
    text: De minister betaalt de subsidie in 2010, 2011, 2012 en 2013 als voorschot.
    url: https://wetten.overheid.nl/BWBR0025390/2010-11-17#Artikel11
  - number: '12'
    text: |-
      De subsidie over 2009, 2010 en 2011, die wordt verleend in 2010, 2011 en 2012, wordt vastgesteld bij de
      vaststelling van de vierjaarlijkse subsidie die is verleend over de periode 2009–2012. De minister kan de subsidie
      die in 2013 wordt verleend over 2012, in 2014 vaststellen.
    url: https://wetten.overheid.nl/BWBR0025390/2010-11-17#Artikel12
  - number: '13'
    text: |-
      Onverminderd [artikel 4:46 van de Algemene wet bestuursrecht][ref1] kan de subsidie lager worden vastgesteld indien
      de subsidieontvanger activiteiten heeft verricht die het karakter hebben van oneigenlijk gebruik van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel446
    url: https://wetten.overheid.nl/BWBR0025390/2010-11-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:46
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke regeling aanvulling eigen inkomsten cultuurinstellingen.'
    url: https://wetten.overheid.nl/BWBR0025390/2010-11-17#Artikel14
  - number: '15'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 2009.

      2 Deze regeling vervalt met ingang van 1 januari 2018.
    url: https://wetten.overheid.nl/BWBR0025390/2010-11-17#Artikel15
