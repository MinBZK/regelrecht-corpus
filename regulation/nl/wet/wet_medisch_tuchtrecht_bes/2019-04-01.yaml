articles:
  - number: '1'
    text: 'In de artikelen van deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel1
  - number: 1.a
    text: |-
      *geneeskundige:* degene die tot de uitoefening van de geneeskunde bevoegd is op grond van bij of krachtens algemene
      maatregel van bestuur te stellen regels;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel1
  - number: 1.b
    text: |-
      *tandheelkundige:* degene die tot de uitoefening van de tandheelkunst bevoegd is op grond van bij of krachtens
      algemene maatregel van bestuur te stellen regels;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel1
  - number: 1.c
    text: |-
      *verloskundige:* degene die tot de uitoefening van de praktijk als verloskundige bevoegd is op grond van bij of
      krachtens algemene maatregel van bestuur te stellen regels;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel1
  - number: 1.d
    text: |-
      *apotheker:* degene die tot de uitoefening van de artsenijbereidkunde bevoegd is op grond van bij of krachtens
      algemene maatregel van bestuur te stellen regels;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel1
  - number: 1.e
    text: |-
      *College:* het college, bedoeld in [artikel 8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel8
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '8'
  - number: 1.f
    text: '*openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;'
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel1
  - number: 1.g
    text: '*openbare lichamen:* openbare lichamen Bonaire, Sint Eustatius en Saba;'
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel1
  - number: 1.h
    text: |-
      *Gemeenschappelijk Hof:* Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint
      Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel1
  - number: 1.i
    text: '*Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport.'
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel1
  - number: '2'
    text: |-
      De geneeskundige of tandheelkundige, die zich schuldig maakt aan gedragingen, welke het vertrouwen dat men in een
      geneeskundige of een tandheelkundige moet kunnen hebben ondermijnen, of aan nalatigheid, waardoor schade ontstaat
      voor een persoon, te wiens behoeve hem geneeskundige of tandheelkundige raad of bijstand gevraagd wordt of aan
      wie hij die raad of bijstand verleent, of die in de uitoefening van de geneeskunst of tandheelkunst blijk geeft
      van niet toelaatbare onkunde, kan, onverminderd zijn aansprakelijkheid ingevolge andere wettelijke voorschriften,
      worden onderworpen aan een van de maatregelen vermeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel7
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '7'
  - number: '3'
    text: |-
      De verloskundige, die zich schuldig maakt aan gedragingen, welke het vertrouwen dat men in een verloskundige moet
      kunnen hebben, ondermijnen, of aan nalatigheid, waardoor schade ontstaat voor een zwangere vrouw of kraamvrouw, te
      wier behoeve haar verloskundige raad of bijstand gevraagd wordt of aan wie zij die raad of bijstand verleent, of
      voor een met haar bijstand geboren kind, of die in de uitoefening van de verloskunst, voorzover zij daartoe bevoegd
      is, blijk geeft van niet toelaatbare onkunde, kan, onverminderd haar aansprakelijkheid ingevolge andere wettelijke
      voorschriften, worden onderworpen aan een van de maatregelen, vermeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel7
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '7'
  - number: '4'
    text: |-
      De apotheker, die zich schuldig maakt aan gedragingen, welke het vertrouwen dat men in een apotheker moet kunnen
      hebben, ondermijnen, of aan nalatigheid, waardoor schade ontstaat voor een persoon, te wiens behoeve hem wordt
      gevraagd geneesmiddelen te bereiden of tot geneeskundig doel af te leveren of voor wie hij geneesmiddelen bereidt
      of tot geneeskundig doel aflevert, of die in de uitoefening van de artsenijbereidkunde blijk geeft van niet
      toelaatbare onkunde, kan, onverminderd zijn aansprakelijkheid ingevolge andere wettelijke voorschriften, worden
      onderworpen aan een van de maatregelen, vermeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel7
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '7'
  - number: '5'
    text: |-
      Ten aanzien van een geneeskundige, een tandheelkundige, een verloskundige of een apotheker, die door ziels- of
      lichaamsziekte of door ouderdoms- of lichaamsgebreken ongeschikt moet worden geacht voor de uitoefening van de
      praktijk, kunnen de maatregelen, vermeld onder [artikel 7, eerste lid, onder d, e, f en g][ref1], worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel7
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '7'
  - number: '6.1'
    text: |-
      Ten aanzien van een geneeskundige, een tandheelkundige, een verloskundige of een apotheker, die de gewoonte maakt
      van drankmisbruik, misbruik van verdovende middelen als bedoeld in een bij of krachtens algemene maatregel van
      bestuur vast te stellen regeling, of misbruik van die pharmacologische middelen, waarbij psychische veranderingen
      kunnen optreden, wordt de maatregel vermeld in [artikel 7, eerste lid, onder g][ref1], toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel7
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '7'
  - number: '6.2'
    text: |-
      Het College kan bepalen, dat de ontzegging niet zal ingaan, mits de betrokkene zich onderwerpt aan een
      ontwenningskuur, de duur van twee jaar en zes maanden niet te boven gaande, en hij tijdens de duur daarvan geen
      gebruik maakt van zijn bevoegdheid. De ontzegging zal alsnog ingaan, wanneer het College zulks gelast op grond
      dat de betrokkene een ontwenningskuur, voorgeschreven door een ten genoegen van het College door hem te kiezen
      geneeskundige, binnen een door het College te stellen termijn niet naleeft of op grond dat hij geneeskunst,
      tandheelkunst, de verloskunde onderscheidenlijk de artsennijbereidkunde uitoefent voordat de geneeskundige, die de
      kuur heeft voorgeschreven, in overleg met de Inspectie gezondheidszorg en jeugd de kuur heeft beëindigd verklaard.
      Gelijke last kan het College geven op grond dat de betrokkene in gebreke blijft binnen de door het College gestelde
      termijn een geneeskundige ten genoegen van het College te kiezen.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel6
  - number: '6.3'
    text: |-
      Het voorschrift, regelende de ontwenningskuur, kan zo nodig inhouden, dat de betrokkene zich gedurende een bepaald
      tijdsverloop, de duur van twee jaren niet te boven gaande, ter verpleging laat opnemen in een daarbij aan te wijzen
      inrichting.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel6
  - number: '6.4'
    text: |-
      Met het toezicht op de naleving van de gegeven voorschriften zijn de ambtenaren van de Inspectie gezondheidszorg en
      jeugd belast.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel6
  - number: '7.1'
    text: |-
      De maatregelen, bedoeld in de [artikelen 2 tot en met 6][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel2
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '2'
  - number: 7.1.a
    text: waarschuwing;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel7
  - number: 7.1.b
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel7
  - number: 7.1.c
    text: oplegging van een bij of krachtens algemene maatregel van bestuur vast te stellen geldboete;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel7
  - number: 7.1.d
    text: |-
      schorsing in de uitoefening van de geneeskunde, tandheelkunst, verloskunde, onderscheidenlijk de
      artsenijbereidkunde voor ten hoogste één jaar;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel7
  - number: 7.1.e
    text: |-
      voorwaardelijke schorsing in de uitoefening van de geneeskunde, tandheelkunst, verloskunde, onderscheidenlijk de
      artsenijbereidkunde;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel7
  - number: 7.1.f
    text: |-
      gedeeltelijke ontzegging van de bevoegdheid om de geneeskunde, tandheelkunst, verloskunde, onderscheidenlijk de
      artsenijbereidkunde uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel7
  - number: 7.1.g
    text: |-
      ontzegging van de bevoegdheid om de geneeskunde, tandheelkunst, verloskunde, onderscheidenlijk de
      artsenijbereidkunde uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel7
  - number: '7.2'
    text: De geldboete, bedoeld in het eerste lid onder c, komt ten bate van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel7
  - number: '7.3'
    text: |-
      Een maatregel als bedoeld in het eerste lid, onderdeel e, wordt niet tenuitvoergelegd, dan nadat het College dat
      de maatregel heeft opgelegd, zulks heeft gelast op grond dat de betrokkene binnen een bij die oplegging bepaalde
      proeftijd van ten hoogste twee jaar een gestelde voorwaarde niet is nagekomen.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel7
  - number: '7.4'
    text: |-
      Indien een geldboete wordt opgelegd, kunnen in de beslissing twee of meer termijnen worden vastgesteld, waarin
      zij moet worden voldaan. De invordering van de boete geschiedt met overeenkomstige toepassing van de wettelijke
      regelingen die gelden ter zake van de invordering van belastingen door middel van dwangschriften alsmede van de
      rechtspleging inzake belastingen, bijdragen en vergoedingen.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel7
  - number: '7.5'
    text: |-
      Indien de beroepsbeoefenaar staat ingeschreven in een register als bedoeld in
      [artikel 8 van de Wet op de beroepen in de individuele gezondheidszorg][ref1], kan het College in het belang van
      de individuele gezondheidszorg bij het opleggen van een maatregel als bedoeld in het eerste lid, onder b en c,
      besluiten tot openbaarmaking in dat register van de opgelegde maatregel, al dan niet met de gronden waarop zij
      berust.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel8
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '8'
  - number: '8.1'
    text: |-
      De toepassing van de in [artikel 7][ref1] vermelde maatregelen geschiedt in eerste aanleg door het Medisch
      Tuchtcollege.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel7
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '7'
  - number: '8.2'
    text: |-
      Het College is gevestigd op een van de openbare lichamen en houdt zo nodig mede zitting op de andere openbare
      lichamen.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel8
  - number: 8a.1
    text: |-
      In gevallen waarin een der in [artikel 7, eerste lid, onder f en g][ref1], omschreven maatregelen is opgelegd,
      kan, zo bijzondere omstandigheden zulks wettigen, bij koninklijk besluit worden bepaald dat de betrokkene in de hem
      ontzegde bevoegdheid wordt hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel7
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '7'
  - number: 8a.2
    text: |-
      In een besluit krachtens het eerste lid kunnen, al dan niet met een beperking tot een in dat besluit te bepalen
      proeftijd, voorwaarden worden gesteld, door de betrokkene in acht te nemen. Indien blijkt dat de betrokkene zich
      schuldig heeft gemaakt aan niet-naleving van een gestelde voorwaarde, kan, onder intrekking van dat besluit, bij
      koninklijk besluit worden bepaald dat de opgelegde maatregel opnieuw van kracht wordt.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel8a
  - number: 8a.3
    text: |-
      De voordracht tot een besluit krachtens het eerste of tweede lid, tweede volzin, wordt gedaan door Onze Minister.
      Alvorens zodanige voordracht wordt gedaan, wint Onze Minister het advies in van het college.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel8a
  - number: 8b
    text: |-
      Herziening van een onherroepelijk geworden tuchtrechtelijke eindbeslissing waarbij een in
      [artikel 7, eerste lid][ref1], omschreven maatregel werd opgelegd, is mogelijk, wanneer naderhand omstandigheden
      zijn gebleken die naar ernstig vermoeden tot een afwijkende beslissing zouden hebben geleid, indien zij tijdig
      bekend waren geworden. Bij algemene maatregel van bestuur worden hieromtrent nadere regels gesteld. De herziening
      zal niet kunnen leiden tot een wijziging in hetgeen voorheen was beslist, ten nadele van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel7
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '7'
  - number: '9.1'
    text: Het College bestaat uit een rechtsgeleerde als voorzitter en twee geneeskundigen.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel9
  - number: '9.2'
    text: |-
      Indien een beslissing moet worden genomen ten aanzien van een tandheelkundige of een apotheker worden in het
      College de geneeskundigen vervangen door tandheelkundigen onderscheidenlijk apothekers.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel9
  - number: '9.3'
    text: |-
      Indien een beslissing moet worden genomen ten aanzien van een verloskundige, wordt in het College één geneeskundige
      vervangen door een verloskundige.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel9
  - number: '9.4'
    text: |-
      Bij ontstentenis worden de in het eerste tot en met derde lid bedoelde personen vervangen door plaatsvervangers,
      die aan dezelfde vereisten voor benoembaarheid voldoen als degenen ter vervanging van wie zij optreden. Tenzij
      anders bepaald, worden in de artikelen van deze wet onder de voorzitter en de leden van het College tevens hun
      plaatsvervangers begrepen.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel9
  - number: '10.1'
    text: |-
      Onverminderd [artikel 9][ref1] is vereist dat de voorzitter en leden van het College de Nederlandse nationaliteit
      bezitten. Ambtenaren van de Inspectie gezondheidszorg en jeugd, zijn niet benoembaar. Indien een lid van het
      College met dit toezicht wordt belast, houdt zijn lidmaatschap van dit College op.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel9
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '9'
  - number: '10.2'
    text: |-
      De voorzitter en de leden worden benoemd door Onze Minister voor een tijdvak van zes jaren en zijn terstond
      herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel10
  - number: '10.3'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel10
  - number: 10a.1
    text: 'De voorzitter en de leden van het College worden door Onze Minister ontslagen:'
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel10a
  - number: 10a.1.a
    text: op eigen verzoek;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel10a
  - number: 10a.1.b
    text: indien zij uit hoofde van ziekte of gebreken blijvend ongeschikt zijn om hun functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel10a
  - number: 10a.1.c
    text: bij het verlies van het Nederlanderschap.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel10a
  - number: 10a.2
    text: 'De voorzitter en de leden van het College kunnen door Onze Minister worden ontslagen:'
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel10a
  - number: 10a.2.a
    text: |-
      wanneer zij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf zijn veroordeeld, dan wel bij zulk
      een uitspraak een maatregel is opgelegd, die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel10a
  - number: 10a.2.b
    text: |-
      wanneer zij bij onherroepelijk geworden rechterlijke uitspraak onder curatele zijn gesteld, in staat van
      faillissement zijn verklaard of surséance van betaling hebben verkregen;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel10a
  - number: 10a.2.c
    text: |-
      wegens handelen of nalaten, dat ernstig nadeel toebrengt aan de goede gang van zaken bij de medische
      tuchtrechtspraak of aan het in haar te stellen vertrouwen;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel10a
  - number: 10a.2.d
    text: |-
      indien zij de verplichting tot geheimhouding, bedoeld in [artikel 16, eerste lid][ref1], hebben overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel16
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '16'
  - number: 10a.3
    text: In de gevallen, bedoeld in het eerste lid, wordt het ontslag eervol verleend.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel10a
  - number: 10b
    text: |-
      Indien Onze Minister van oordeel is dat een reden van ontslag als bedoeld in
      [artikel 10a, eerste lid, onderdeel b, of tweede lid][ref1], aanwezig is, is hij bevoegd het betrokken lid in
      afwachting van het ontslag te schorsen en in de waarneming van diens functie tijdelijk te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel10a
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: 10a
  - number: '11'
    text: |-
      Aan het College worden een secretaris zomede een plaatsvervangende secretaris toegevoegd. Deze worden door Onze
      Minister benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel11
  - number: '12.1'
    text: 'Een zaak wordt voor het College aanhangig gemaakt door een schriftelijke klacht van:'
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel12
  - number: 12.1.a
    text: een ter beoordeling van het College rechtstreeks belanghebbende,
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel12
  - number: 12.1.b
    text: de Inspectie gezondheidszorg en jeugd, of
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel12
  - number: 12.1.c
    text: |-
      het bestuur van de instelling waar de geneeskundige, tandheelkundige, verloskundige of apotheker in dienst is
      dan wel deze voor het verlenen van geneeskundige, tandheelkundige, verloskundige of artsenijbereidkundige hulp
      is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel12
  - number: '12.2'
    text: |-
      Zodra een klacht is binnengekomen, stelt de voorzitter een voorlopig onderzoek in. Blijkt dat de klacht is
      ingediend door iemand, die daartoe niet ingevolge het eerste lid bevoegd is, dan verklaart het College de klager
      zonder nader onderzoek niet ontvankelijk. Blijkt dat de klacht kennelijk ongegrond of van onbeduidende aard is, dan
      kan het College haar zonder nader onderzoek afwijzen. In andere gevallen neemt het College een beslissing niet dan
      nadat degene over wie geklaagd is opgeroepen en, ingeval van verschijning, gehoord is.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel12
  - number: '12.3'
    text: |-
      Intrekken van de klacht nadat zij is ingekomen en het neerleggen van de praktijk door de geneeskundige, de
      tandheelkundige, de verloskundige of de apotheker die bij de zaak is betrokken, heeft op de verdere behandeling
      geen invloed wanneer naar het oordeel van het College het algemeen belang vordert, dat de behandeling wordt
      voortgezet.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel12
  - number: '13.1'
    text: |-
      Ingeval er ten aanzien van de leden feiten of omstandigheden bestaan, waardoor in het algemeen de rechterlijke
      onpartijdigheid ernstig schade zou kunnen lijden, kan diens wraking schriftelijk of, ter terechtzitting, mondeling
      worden voorgedragen door degene over wie geklaagd is en degene die de klacht heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel13
  - number: '13.2'
    text: |-
      Wraking kan plaatsvinden totdat de voorzitter heeft uitgesproken dat het College uitspraak zal doen, tenzij de
      wraking is gebaseerd op feiten of omstandigheden die eerst nadat de voorzitter heeft uitgesproken dat het College
      uitspraak zal doen, bekend zijn geworden.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel13
  - number: '13.3'
    text: |-
      De [artikelen 509, eerste tot en met derde lid en het vijfde lid][ref1], en
      [510 tot en met 514 Wetboek van Strafvordering BES][ref2] zijn van overeenkomstige toepassing, met dien verstande
      dat waar in:


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel509
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel510
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '509'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '510'
  - number: 13.3.a
    text: |-
      de [artikelen 509, eerste en derde lid][ref1], [511, tweede lid][ref2],[512][ref3] en [513][ref4] wordt gesproken
      over «rechters», daaronder moet worden verstaan: leden van het tuchtcollege;


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel509
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel511
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel512
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel513
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '509'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '511'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '512'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '513'
  - number: 13.3.b
    text: |-
      [artikel 509, vijfde lid][ref1], wordt gesproken over «rechter», daaronder moet worden verstaan: het College;


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel509
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '509'
  - number: 13.3.c
    text: |-
      de [artikelen 510][ref1] en [511 eerste lid][ref2], wordt gesproken over «enig rechter» dan wel «rechter»,
      daaronder moet worden verstaan: het gehele college respectievelijk de leden van het College;


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel510
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel511
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '510'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '511'
  - number: 13.3.d
    text: |-
      [artikel 510][ref1] wordt gesproken over «verdachte», daaronder moet worden verstaan: degene over wie is geklaagd;


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel510
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '510'
  - number: 13.3.e
    text: |-
      [artikel 514][ref1] wordt gesproken over «verdachte», daaronder moet worden verstaan: degene over wie is geklaagd
      en de klager;


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel514
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '514'
  - number: 13.3.e
    text: |-
      waar in de [artikelen 512][ref1] en [513][ref2] wordt gesproken over «het onderzoek op de terechtzitting»,
      daaronder moet worden verstaan: de mondelinge behandeling van de zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel512
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel513
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '512'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '513'
  - number: '14.1'
    text: |-
      Indien de behandeling van een zaak niet mogelijk blijkt zonder dat degene over wie geklaagd is gehoord wordt, en
      deze, hoewel krachtens [artikel 12][ref1] opgeroepen, niet is verschenen en het College desondanks van oordeel is
      dat het algemeen belang de afdoening vordert, kan het College beslissen dat hij of zij op een daarbij te bepalen
      dag moet verschijnen. ledere beslissing houdt de overwegingen in waarop zij steunt.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel12
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '12'
  - number: '14.2'
    text: |-
      Het bepaalde in de [artikelen 198][ref1] en [463 van het Wetboek van Strafrecht BES][ref2] geldt mede ten aanzien
      van de geneeskundige, de tandheelkundige, de verloskundige of de apotheker, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel198
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel463
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '198'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '463'
  - number: '15.1'
    text: |-
      Ieder die als getuige of deskundige is opgeroepen, is verplicht aan die oproeping gevolg te geven. Hij die als
      getuige of deskundige is opgeroepen, is verplicht getuigenis af te leggen of zijn diensten als deskundige te
      verlenen, een en ander behoudens geldige redenen van verschoning op grond van de verplichting tot geheimhouding uit
      hoofde van stand, beroep of ambt, als in [artikel 252 van het Wetboek van Strafvordering BES][ref1] bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel252
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '252'
  - number: '15.2'
    text: |-
      [Artikel 251, van het Wetboek van Strafvordering BES][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel251
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '251'
  - number: 15a
    text: |-
      Indien tegen een geneeskundige, een tandheelkundige, een verloskundige of een apotheker een klacht is ingediend
      ingevolge [artikel 12 ][ref1]van deze wet en bij de behandeling van deze klacht blijkt, dat in de strafzaak ten
      aanzien van het feit waarop de klacht betrekking heeft, door de Rechter is gedaan óf blijkt, dat de betrokkene
      ten aanzien van dat feit een civiele procedure heeft gevoerd, kan op eenvoudig verzoek van de voorzitter van het
      College door de president van het Gemeenschappelijk Hof worden bepaald, dat het betreffende dossier geheel of ten
      dele door de griffier van dat Hof voor ten hoogste 14 dagen ter inzage van het college wordt gegeven. Indien de
      betreffende zaak nog in behandeling is kan zodanige inzage ook worden verleend, doch kan hierbij worden bepaald,
      dat zulks slechts ter Griffie van het Gemeenschappelijk Hof op een door de President eerder vermeld vast te stellen
      tijdstip plaats vinden. Bij een met redenen omklede beschikking kan inzage als bedoeld in lid 1 en 2 van dit
      artikel door de President van het Gemeenschappelijk Hof worden geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel12
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '12'
  - number: '16.1'
    text: |-
      De leden van het College, zomede de secretaris en de plaatsvervangende secretaris, zijn verplicht tot geheimhouding
      van de bij het College aanhangige zaken, van de beraadslagingen over en van de beslissingen op een zaak, voorzover
      niet bij of krachtens algemene maatregel van bestuur als bedoeld in [artikel 19][ref1], mededeling aan ambtenaren
      van politie of justitie wordt vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel19
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '19'
  - number: '16.2'
    text: |-
      Bij zijn beslissing kan het College bepalen dat die beslissing met het oog op het algemeen belang geheel of
      gedeeltelijk voor bekendmaking in aanmerking komt. Indien één van de in [artikel 7][ref1] genoemde maatregelen
      wordt opgelegd, wordt de beslissing bekendgemaakt op een bij algemene maatregel van bestuur te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel7
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '7'
  - number: '16.3'
    text: |-
      Aan de Inspectie gezondheidszorg en jeugd wordt van de beslissing afschrift gezonden. Deze is, behalve indien zijn
      ambtsvervulling anders vordert, gehouden tot geheimhouding.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel16
  - number: '16.4'
    text: |-
      Onze Minister ontvangt een afschrift van de beslissing indien een maatregel, bedoeld in
      [artikel 7, eerste lid][ref1], is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel7
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '7'
  - number: '17.1'
    text: Tegen de beslissingen van het College staat hoger beroep open bij het Gemeenschappelijk Hof.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel17
  - number: '17.2'
    text: 'Hoger beroep kan worden ingesteld:'
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel17
  - number: 17.2.a
    text: |-
      door degeen, ten aanzien waarvan een der maatregelen, bedoeld in [artikel 7, lid l][ref1] is toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel7
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '7'
  - number: 17.2.b
    text: |-
      door degeen, op wiens schriftelijke klacht, als bedoeld in [artikel 12][ref1], de zaak aanhangig is gemaakt, doch
      alleen indien niet-ontvankelijkverklaring, afwijzing zonder nader onderzoek, of niet-toepassing na onderzoek, van
      een der in [artikel 7, lid l][ref2] bedoelde maatregelen is gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028542#Artikel7
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0028542
        artikel: '7'
  - number: '17.3'
    text: |-
      Het Gemeenschappelijk Hof houdt de zaak aan zich en doet deze zelf af, behoudens de bevoegdheid het instellen van
      een nader onderzoek aan een rechter-commissaris op te dragen.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel17
  - number: '17.4'
    text: |-
      De [artikelen 13][ref1] en [15][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028542#Artikel15
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0028542
        artikel: '15'
  - number: '18'
    text: |-
      Het bepaalde in [artikel 201 van het Wetboek van Strafrecht BES][ref1] vindt overeenkomstige toepassing ten aanzien
      van de geneeskundige, tandheelkundige, verloskundige of apotheker, die


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel201
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '201'
  - number: 18.a
    text: |-
      hoewel hem of haar bij onherroepelijk geworden uitspraak schorsing in de uitoefening van het beroep is opgelegd,
      gedurende die schorsing het beroep uitoefent;
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel18
  - number: 18.b
    text: |-
      hoewel hem of haar bij onherroepelijk geworden uitspraak de bevoegdheid het beroep uit te oefenen is ontzegd, dit
      niettemin uitoefent.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel18
  - number: '19'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt verder geregeld de wijze van behandeling van klachten, zo in
      eerste aanleg als in hoger beroep, zomede alles wat voor de uitvoering van deze wet verder voorziening vordert.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel19
  - number: 19a
    text: |-
      Op klachten die aanhangig zijn gemaakt voor de datum van inwerkingtreding van deze wet zijn de bepalingen van de
      Landsverordening van de 4de maart 1957, houdende regeling van de tuchtrechtspraak over personen die geneeskunst
      uitoefenen, zomede over apothekers (P.B. 1957, no. 30), zoals deze luidden op het tijdstip van inwerkingtreding van
      deze wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel19a
  - number: '20'
    text: 'Deze wet wordt aangehaald als: Wet medisch tuchtrecht BES.'
    url: https://wetten.overheid.nl/BWBR0028542/2019-04-01#Artikel20
