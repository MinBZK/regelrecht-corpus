  - number: 15a
    text: |-
      Indien tegen een geneeskundige, een tandheelkundige, een verloskundige of een apotheker een klacht is ingediend
      ingevolge [artikel 12 ][ref1]van deze wet en bij de behandeling van deze klacht blijkt, dat in de strafzaak ten
      aanzien van het feit waarop de klacht betrekking heeft, door de Rechter is gedaan óf blijkt, dat de betrokkene
      ten aanzien van dat feit een civiele procedure heeft gevoerd, kan op eenvoudig verzoek van de voorzitter van het
      College door de president van het Gemeenschappelijk Hof worden bepaald, dat het betreffende dossier geheel of ten
      dele door de griffier van dat Hof voor ten hoogste 14 dagen ter inzage van het college wordt gegeven.

      Indien de betreffende zaak nog in behandeling is kan zodanige inzage ook worden verleend, doch kan hierbij worden
      bepaald, dat zulks slechts ter Griffie van het Gemeenschappelijk Hof op een door de President eerder vermeld vast
      te stellen tijdstip plaats vinden.

      Bij een met redenen omklede beschikking kan inzage als bedoeld in lid 1 en 2 van dit artikel door de President van
      het Gemeenschappelijk Hof worden geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel12
    url: https://wetten.overheid.nl/BWBR0028542/2024-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0028542
        artikel: '12'
  - number: '16'
    text: |-
      1 De leden van het College, zomede de secretaris en de plaatsvervangende secretaris, zijn verplicht tot
      geheimhouding van de bij het College aanhangige zaken, van de beraadslagingen over en van de beslissingen op een
      zaak, voorzover niet bij of krachtens algemene maatregel van bestuur als bedoeld in [artikel 19][ref1], mededeling
      aan ambtenaren van politie of justitie wordt vereist.

      2 Bij zijn beslissing kan het College bepalen dat die beslissing met het oog op het algemeen belang geheel of
      gedeeltelijk voor bekendmaking in aanmerking komt. Indien één van de in [artikel 7][ref2] genoemde maatregelen
      wordt opgelegd, wordt de beslissing bekendgemaakt op een bij algemene maatregel van bestuur te bepalen wijze.

      3 Aan de Inspectie gezondheidszorg en jeugd wordt van de beslissing afschrift gezonden. Deze is, behalve indien
      zijn ambtsvervulling anders vordert, gehouden tot geheimhouding.

      4 Onze Minister ontvangt een afschrift van de beslissing indien een maatregel, bedoeld in
      [artikel 7, eerste lid][ref3], is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0028542#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0028542#Artikel7
    url: https://wetten.overheid.nl/BWBR0028542/2024-01-01#Artikel16
