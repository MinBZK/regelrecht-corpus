        artikel: '7'
  - number: '17'
    text: |-
      1 Tegen de beslissingen van het College staat hoger beroep open bij het Gemeenschappelijk Hof.

      2 Hoger beroep kan worden ingesteld:

      a. door degeen, ten aanzien waarvan een der maatregelen, bedoeld in [artikel 7, lid l][ref1] is toegepast;

      b. door degeen, op wiens schriftelijke klacht, als bedoeld in [artikel 12][ref2], de zaak aanhangig is gemaakt,
      doch alleen indien niet-ontvankelijkverklaring, afwijzing zonder nader onderzoek, of niet-toepassing na onderzoek,
      van een der in [artikel 7, lid l][ref3] bedoelde maatregelen is gevolgd.

      3 Het Gemeenschappelijk Hof houdt de zaak aan zich en doet deze zelf af, behoudens de bevoegdheid het instellen van
      een nader onderzoek aan een rechter-commissaris op te dragen.

      4 De [artikelen 13][ref4] en [15][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028542#Artikel12
