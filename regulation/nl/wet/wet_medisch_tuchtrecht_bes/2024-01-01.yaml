  - number: '15'
    text: |-
      1 Ieder die als getuige of deskundige is opgeroepen, is verplicht aan die oproeping gevolg te geven. Hij die
      als getuige of deskundige is opgeroepen, is verplicht getuigenis af te leggen of zijn diensten als deskundige te
      verlenen, een en ander behoudens geldige redenen van verschoning op grond van de verplichting tot geheimhouding uit
      hoofde van stand, beroep of ambt, als in [artikel 252 van het Wetboek van Strafvordering BES][ref1] bedoeld.

      2 [Artikel 251, van het Wetboek van Strafvordering BES][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel251
