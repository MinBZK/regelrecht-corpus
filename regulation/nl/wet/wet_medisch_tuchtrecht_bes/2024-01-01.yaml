  - number: '9'
    text: |-
      1 Het College bestaat uit een rechtsgeleerd lid als voorzitter en twee leden-geneeskundigen.

      2 Indien een beslissing moet worden genomen ten aanzien van een tandheelkundige of een apotheker worden in het
      College de geneeskundigen vervangen door tandheelkundigen onderscheidenlijk apothekers.

      3 Indien een beslissing moet worden genomen ten aanzien van een verloskundige, wordt in het College één
      geneeskundige vervangen door een verloskundige.

      4 Bij ontstentenis worden de in het eerste tot en met derde lid bedoelde personen vervangen door plaatsvervangers,
      die aan dezelfde vereisten voor benoembaarheid voldoen als degenen ter vervanging van wie zij optreden. Tenzij
      anders bepaald, worden in de artikelen van deze wet onder de leden van het College tevens hun plaatsvervangers
      begrepen.
    url: https://wetten.overheid.nl/BWBR0028542/2024-01-01#Artikel9
  - number: '10'
    text: |-
      1 Onverminderd [artikel 9][ref1] is vereist dat de leden van het College de Nederlandse nationaliteit bezitten.
      Ambtenaren van de Inspectie gezondheidszorg en jeugd, zijn niet benoembaar. Indien een lid van het College met dit
      toezicht wordt belast, houdt zijn lidmaatschap van dit College op.

      2 De voorzitter van het College wordt bij koninklijk besluit op voordracht van Onze Minister benoemd voor een
      tijdvak van zes jaren en is herbenoembaar.

      3 De overige leden van het College worden door Onze Minister benoemd voor een tijdvak van zes jaren en zijn
      herbenoembaar.

      4 Aan een lid van het College wordt op zijn verzoek tussentijds ontslag verleend. Aan een lid van het College
      wordt in ieder geval ontslag verleend met het bereiken van de zeventigjarige leeftijd. In de gevallen genoemd in
      de eerste twee volzinnen van dit lid, vindt het ontslag van de voorzitter van het College plaats bij koninklijk
      besluit op voordracht van Onze Minister en vindt het ontslag van de overige leden plaats door Onze Minister.

      5 Een lid van het College blijft na het verstrijken van zijn benoemingstermijn of zijn ontslag vanwege het bereiken
      van de zeventigjarige leeftijd, bevoegd om deel te nemen aan de verdere behandeling van en de beslissing over
      klachten, aan de behandeling waarvan hij voor het verstrijken van zijn benoemingstermijn of zijn ontslag reeds
      heeft deelgenomen.


