  - number: '11'
    text: |-
      Aan het College worden een of meer secretarissen toegevoegd. Deze worden door Onze Minister aangewezen. De
      aanwijzing eindigt met ingang van de datum dat de uitoefening van de functie van secretaris geen onderdeel meer
      uitmaakt van de werkzaamheden van de betreffende ambtenaar.
    url: https://wetten.overheid.nl/BWBR0028542/2024-01-01#Artikel11
  - number: '12'
    text: |-
      1 Een zaak wordt voor het College aanhangig gemaakt door een schriftelijke klacht van:

      a. een ter beoordeling van het College rechtstreeks belanghebbende,

      b. de Inspectie gezondheidszorg en jeugd, of

      c. het bestuur van de instelling waar de geneeskundige, tandheelkundige, verloskundige of apotheker in dienst is
      dan wel deze voor het verlenen van geneeskundige, tandheelkundige, verloskundige of artsenijbereidkundige hulp
      is ingeschreven.

      2 Zodra een klacht is binnengekomen, stelt de voorzitter een voorlopig onderzoek in. Blijkt dat de klacht is
      ingediend door iemand, die daartoe niet ingevolge het eerste lid bevoegd is, dan verklaart het College de klager
      zonder nader onderzoek niet ontvankelijk. Blijkt dat de klacht kennelijk ongegrond of van onbeduidende aard is, dan
      kan het College haar zonder nader onderzoek afwijzen. In andere gevallen neemt het College een beslissing niet dan
      nadat degene over wie geklaagd is opgeroepen en, ingeval van verschijning, gehoord is.

      3 Intrekken van de klacht nadat zij is ingekomen en het neerleggen van de praktijk door de geneeskundige, de
      tandheelkundige, de verloskundige of de apotheker die bij de zaak is betrokken, heeft op de verdere behandeling
      geen invloed wanneer naar het oordeel van het College het algemeen belang vordert, dat de behandeling wordt
      voortgezet.
    url: https://wetten.overheid.nl/BWBR0028542/2024-01-01#Artikel12
  - number: '13'
    text: |-
      1 Ingeval er ten aanzien van de leden feiten of omstandigheden bestaan, waardoor in het algemeen de rechterlijke
      onpartijdigheid ernstig schade zou kunnen lijden, kan diens wraking schriftelijk of, ter terechtzitting, mondeling
      worden voorgedragen door degene over wie geklaagd is en degene die de klacht heeft ingediend.

      2 Wraking kan plaatsvinden totdat de voorzitter heeft uitgesproken dat het College uitspraak zal doen, tenzij de
      wraking is gebaseerd op feiten of omstandigheden die eerst nadat de voorzitter heeft uitgesproken dat het College
      uitspraak zal doen, bekend zijn geworden.

      3 De [artikelen 509, eerste tot en met derde lid en het vijfde lid][ref1], en
      [510 tot en met 514 Wetboek van Strafvordering BES][ref2] zijn van overeenkomstige toepassing, met dien verstande
      dat waar in:

      a. de [artikelen 509, eerste en derde lid][ref3], [511, tweede lid][ref4],[512][ref5] en [513][ref6] wordt
      gesproken over «rechters», daaronder moet worden verstaan: leden van het tuchtcollege;

      b. [artikel 509, vijfde lid][ref7], wordt gesproken over «rechter», daaronder moet worden verstaan: het College;

      c. de [artikelen 510][ref8] en [511 eerste lid][ref9], wordt gesproken over «enig rechter» dan wel «rechter»,
      daaronder moet worden verstaan: het gehele college respectievelijk de leden van het College;

      d. [artikel 510][ref10] wordt gesproken over «verdachte», daaronder moet worden verstaan: degene over wie is
      geklaagd;

      e. [artikel 514][ref11] wordt gesproken over «verdachte», daaronder moet worden verstaan: degene over wie is
      geklaagd en de klager;

      e. waar in de [artikelen 512][ref12] en [513][ref13] wordt gesproken over «het onderzoek op de terechtzitting»,
      daaronder moet worden verstaan: de mondelinge behandeling van de zaak.


