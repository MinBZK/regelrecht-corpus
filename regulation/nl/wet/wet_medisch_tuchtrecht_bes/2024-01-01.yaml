  - number: 10a
    text: |-
      Het in de [artikelen 46c, onderdelen b en c][ref1], [46ca, eerste lid, onderdeel d][ref2],
      [46d, tweede lid][ref3], [46f][ref4], [46i, met uitzondering van het eerste lid, onderdeel c][ref5],
      [46j][ref6], [46l, eerste lid, aanhef en onderdelen a en c, en derde lid][ref7], [46m][ref8], [46o][ref9] en
      [46p van de Wet rechtspositie rechterlijke ambtenaren][ref10] bepaalde is van overeenkomstige toepassing ten
      aanzien van de leden en de plaatsvervangende leden van de regionale tuchtcolleges en van het centrale tuchtcollege,
      met dien verstande dat de in het vijfde lid van artikel 46p bedoelde mededeling te hunnen aanzien eveneens wordt
      gedaan aan Onze Minister.

      De [artikelen 13a][ref11], [13b, uitgezonderd het eerste lid, onderdelen b en c, en vierde lid][ref12], en
      [13c tot en met 13g van de Wet op de rechterlijke organisatie][ref13] zijn van overeenkomstige toepassing ten
      aanzien van gedragingen van deze leden en plaatsvervangende leden, met dien verstande dat:

      a. voor de overeenkomstige toepassing van die artikelen onder «het betrokken gerechtsbestuur» wordt verstaan: de
      voorzitter van het Medisch Tuchtcollege; en

      b. de procureur-generaal niet verplicht is aan het verzoek, bedoeld in [artikel 13a][ref14], te voldoen, indien de
      verzoeker redelijkerwijs onvoldoende belang heeft bij een onderzoek als bedoeld in datzelfde artikel.


