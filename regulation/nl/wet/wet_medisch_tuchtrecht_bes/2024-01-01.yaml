  - number: '7'
    text: |-
      1 De maatregelen, bedoeld in de [artikelen 2 tot en met 6][ref1], zijn:

      a. waarschuwing;

      b. berisping;

      c. oplegging van een bij of krachtens algemene maatregel van bestuur vast te stellen geldboete;

      d. schorsing in de uitoefening van de geneeskunde, tandheelkunst, verloskunde, onderscheidenlijk de
      artsenijbereidkunde voor ten hoogste één jaar;

      e. voorwaardelijke schorsing in de uitoefening van de geneeskunde, tandheelkunst, verloskunde, onderscheidenlijk
      de artsenijbereidkunde;

      f. gedeeltelijke ontzegging van de bevoegdheid om de geneeskunde, tandheelkunst, verloskunde, onderscheidenlijk de
      artsenijbereidkunde uit te oefenen;

      g. ontzegging van de bevoegdheid om de geneeskunde, tandheelkunst, verloskunde, onderscheidenlijk de
      artsenijbereidkunde uit te oefenen.

      2 De geldboete, bedoeld in het eerste lid onder c, komt ten bate van het openbaar lichaam.

      3 Een maatregel als bedoeld in het eerste lid, onderdeel e, wordt niet tenuitvoergelegd, dan nadat het College dat
      de maatregel heeft opgelegd, zulks heeft gelast op grond dat de betrokkene binnen een bij die oplegging bepaalde
      proeftijd van ten hoogste twee jaar een gestelde voorwaarde niet is nagekomen.

      4 Indien een geldboete wordt opgelegd, kunnen in de beslissing twee of meer termijnen worden vastgesteld, waarin
      zij moet worden voldaan. De invordering van de boete geschiedt met overeenkomstige toepassing van de wettelijke
      regelingen die gelden ter zake van de invordering van belastingen door middel van dwangschriften alsmede van de
      rechtspleging inzake belastingen, bijdragen en vergoedingen.

      5 Indien de beroepsbeoefenaar staat ingeschreven in een register als bedoeld in
      [artikel 8 van de Wet op de beroepen in de individuele gezondheidszorg][ref2], kan het College in het belang van
      de individuele gezondheidszorg bij het opleggen van een maatregel als bedoeld in het eerste lid, onder b en c,
      besluiten tot openbaarmaking in dat register van de opgelegde maatregel, al dan niet met de gronden waarop zij
      berust.


