        bwb_id: BWBR0028542
        artikel: '7'
  - number: '4'
    text: |-
      De apotheker, die zich schuldig maakt aan gedragingen, welke het vertrouwen dat men in een apotheker moet kunnen
      hebben, ondermijnen, of aan nalatigheid, waardoor schade ontstaat voor een persoon, te wiens behoeve hem wordt
      gevraagd geneesmiddelen te bereiden of tot geneeskundig doel af te leveren of voor wie hij geneesmiddelen bereidt
      of tot geneeskundig doel aflevert, of die in de uitoefening van de artsenijbereidkunde blijk geeft van niet
      toelaatbare onkunde, kan, onverminderd zijn aansprakelijkheid ingevolge andere wettelijke voorschriften, worden
      onderworpen aan een van de maatregelen, vermeld in [artikel 7][ref1].


