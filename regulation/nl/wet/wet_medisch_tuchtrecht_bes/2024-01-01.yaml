      1 De toepassing van de in [artikel 7][ref1] vermelde maatregelen geschiedt in eerste aanleg door het Medisch
      Tuchtcollege.

      2 Het College is gevestigd op een van de openbare lichamen en houdt zo nodig mede zitting op de andere openbare
      lichamen.


