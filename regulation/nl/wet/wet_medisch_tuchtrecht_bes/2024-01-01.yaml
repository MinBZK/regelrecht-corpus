  - number: '18'
    text: |-
      Het bepaalde in [artikel 201 van het Wetboek van Strafrecht BES][ref1] vindt overeenkomstige toepassing ten aanzien
      van de geneeskundige, tandheelkundige, verloskundige of apotheker, die

      a. hoewel hem of haar bij onherroepelijk geworden uitspraak schorsing in de uitoefening van het beroep is opgelegd,
      gedurende die schorsing het beroep uitoefent;

      b. hoewel hem of haar bij onherroepelijk geworden uitspraak de bevoegdheid het beroep uit te oefenen is ontzegd,
      dit niettemin uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel201
    url: https://wetten.overheid.nl/BWBR0028542/2024-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '201'
  - number: '19'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt verder geregeld de wijze van behandeling van klachten, zo in
      eerste aanleg als in hoger beroep, zomede alles wat voor de uitvoering van deze wet verder voorziening vordert.
    url: https://wetten.overheid.nl/BWBR0028542/2024-01-01#Artikel19
  - number: 19a
    text: |-
      Op klachten die aanhangig zijn gemaakt voor de datum van inwerkingtreding van deze wet zijn de bepalingen van de
      Landsverordening van de 4de maart 1957, houdende regeling van de tuchtrechtspraak over personen die geneeskunst
      uitoefenen, zomede over apothekers (P.B. 1957, no. 30), zoals deze luidden op het tijdstip van inwerkingtreding van
      deze wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0028542/2024-01-01#Artikel19a
  - number: '20'
    text: 'Deze wet wordt aangehaald als: Wet medisch tuchtrecht BES.'
    url: https://wetten.overheid.nl/BWBR0028542/2024-01-01#Artikel20
