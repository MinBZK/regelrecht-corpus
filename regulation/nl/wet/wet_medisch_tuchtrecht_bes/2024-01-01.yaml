  - number: '1'
    text: |-
      In de artikelen van deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *geneeskundige:* degene die tot de uitoefening van de geneeskunde bevoegd is op grond van bij of krachtens
      algemene maatregel van bestuur te stellen regels;

      b. *tandheelkundige:* degene die tot de uitoefening van de tandheelkunst bevoegd is op grond van bij of krachtens
      algemene maatregel van bestuur te stellen regels;

      c. *verloskundige:* degene die tot de uitoefening van de praktijk als verloskundige bevoegd is op grond van bij of
      krachtens algemene maatregel van bestuur te stellen regels;

      d. *apotheker:* degene die tot de uitoefening van de artsenijbereidkunde bevoegd is op grond van bij of krachtens
      algemene maatregel van bestuur te stellen regels;

      e. *College:* het college, bedoeld in [artikel 8][ref1];

      f. *openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;

      g. *openbare lichamen:* openbare lichamen Bonaire, Sint Eustatius en Saba;

      h. *Gemeenschappelijk Hof:* Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire,
      Sint Eustatius en Saba;

      i. *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport.


      [ref1]: https://wetten.overheid.nl/BWBR0028542#Artikel8
