  - number: '5'
    text: |-
      Ten aanzien van een geneeskundige, een tandheelkundige, een verloskundige of een apotheker, die door ziels- of
      lichaamsziekte of door ouderdoms- of lichaamsgebreken ongeschikt moet worden geacht voor de uitoefening van de
      praktijk, kunnen de maatregelen, vermeld onder [artikel 7, eerste lid, onder d, e, f en g][ref1], worden toegepast.


