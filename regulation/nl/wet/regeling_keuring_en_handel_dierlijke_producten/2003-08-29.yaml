    text: |-
      In deze afdeling wordt onder gehakt vlees verstaan: gehakt vlees van kippen, kalkoenen, parelhoenders, eenden,
      ganzen, gekweekt of vrij vederwild, klein vrij wild en gekweekte konijnen en hazen.
