  - number: '5.9'
    text: |-
      1 is voorzien van een keurmerk als bedoeld in [artikel 5.2, eerste lid][ref1], dan wel, indien het vlees
      van oorsprong is uit een derde land of gedeelte van een derde land waaruit het op het grondgebied van
      de Europese Gemeenschap brengen van het vlees is toegestaan ingevolge beschikking 94/86/EG en het vlees
      in de lid-staat van verzending niet is omgepakt of verwerkt, van een origineel keurmerk als bedoeld in
      [artikel 5.11, eerste lid, onderdeel a][ref2];

      a. is voorzien van een keurmerk als bedoeld in [artikel 5.2, eerste lid][ref3];

      b. gaat vergezeld van het van toepassing zijnde bewijsstuk, bedoeld in [artikel 5.2, tweede lid][ref4];

      c. is op hygiënische wijze verpakt en wordt op hygiënische wijze vervoerd overeenkomstig
      [artikel 5.5, tweede lid, onderdeel d, onderscheidenlijk e][ref5], en vertoont geen tekenen van bederf of
      ondeugdelijkheid.

      2 Een partij gehele stukken grof vrij wild die is verzonden vanuit een lid-staat en die is bestemd voor Nederland
      of een lid-staat:

      a. gaat vergezeld van het gezondheidscertificaat, bedoeld in [artikel 5.3, eerste lid][ref6], met dien verstande
      dat zolang het model daarvan nog niet bij beschikking van de Commissie van de Europese Gemeenschappen of de Raad
      van de Europese Unie is vastgesteld, de partij vergezeld gaat van een door de bevoegde autoriteit van de lid-
      staat van verzending afgegeven bewijsstuk, waarin ten minste wordt verklaard dat de ingewanden een post mortem
      keuring hebben ondergaan in een erkende vrij-wildverwerkingsinrichting en dat het vlees geschikt is verklaard voor
      menselijke consumptie, en

      b. wordt op hygiënische wijze vervoerd overeenkomstig [artikel 5.5, tweede lid, onderdeel e][ref7], en vertoont
      geen tekenen van bederf of ondeugdelijkheid.

      3 Een partij gehele stukken klein vrij wild die is verzonden vanuit een lid-staat voldoet aan het tweede lid,
      onderdeel b, en gaat vergezeld van een door de bevoegde autoriteit van de lid-staat van verzending afgegeven
      bewijsstuk, waarin ten minste wordt verklaard dat een representatief monster van dieren van dezelfde herkomst is
      gekeurd en aan de hand van deze keuring de partij geschikt is bevonden voor menselijke consumptie.

      4 Onverminderd het eerste tot en met derde lid heeft eventuele opslag, verwerking of ompakking van vlees van vrij
      wild of gehele stukken vrij wild, verzonden vanuit een lid-staat en bestemd voor een lid-staat, onder bevredigende
      hygiënische omstandigheden plaatsgevonden in een op grond van [artikel 5.13, eerste lid][ref8], erkende vrij-
      wildverwerkingsinrichting of in een erkend koel- en vrieshuis.

      5 Indien de partij vlees of gehele stukken vergezeld gaat van een begeleidend handelsdocument als bedoeld
      in [artikel 5.2, tweede lid, onderdeel a][ref9], wordt dit document gedurende ten minste één jaar door de
      geadresseerde bewaard, zodat het desgevraagd aan de keuringsdierenarts kan worden overgelegd.


