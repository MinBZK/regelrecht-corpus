  - number: '9.1'
    text: |-
      1 In dit hoofdstuk wordt verstaan onder:

      werkplaats: plaats waar gehakt vlees wordt bereid.

      2 In dit hoofdstuk wordt onder ‘lid-staat’ mede verstaan: Noorwegen.

      3 In dit hoofdstuk wordt, in afwijking van [artikel 1.1, eerste lid, onder][ref1] ‘derde land’ verstaan: land, niet
      zijnde Nederland of een andere lid-staat van de Europese Unie, en niet zijnde Noorwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel1.1
