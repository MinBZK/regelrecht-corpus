  - number: '4.7'
    text: |-
      1 Vers vlees van pluimvee mag niet voor menselijke consumptie ongeschikt zijn verklaard en geen tekenen van bederf
      of ondeugdelijkheid vertonen.

      2 Onverminderd [artikel 4.4, eerste lid, onderdeel d][ref1], wordt vers vlees van kippen, kalkoenen, parelhoenders,
      eenden of ganzen door de minister voor menselijke consumptie ongeschikt verklaard, indien:

      a. het vlees tekortkomingen vertoont als bedoeld in hoofdstuk IX, punt 53, onderdeel a, van bijlage I van
      [richtlijn 71/118/EEG](31971L0118);

      b. door de minister na onderzoek in geval van verdenking is geconstateerd dat het vlees sporen van residuen
      vertoont in hoeveelheden die, indien ter zake ingevolge de regelgeving van de Europese Gemeenschap een besluit is
      genomen, de vastgestelde maximumwaarden overschrijden, of indien het vlees afkomstig is van een koppel pluimvee
      waarvan ander vlees dat onder technologisch vergelijkbare omstandigheden is verkregen, op een dergelijke wijze is
      behandeld, met dien verstande dat de minister voorts maatregelen kan nemen als bedoeld in artikel 4, eerste lid,
      laatste alinea, van [richtlijn 71/118/EEG](31971L0118);

      c. het vlees is behandeld met antibiotica, hormonen, ß-agonisten, malsmakers of conserveermiddelen, voor zover
      deze middelen niet zijn toegelaten krachtens de [Diergeneesmiddelenwet][ref2] of de [Warenwet][ref3], met
      waterretentiebevorderende agentia of, tenzij deze behandeling ingevolge de regelgeving van de Europese Gemeenschap
      is toegelaten, met ioniserende of ultraviolette stralen, of indien het afkomstig is van een koppel pluimvee
      waarvan ander vlees dat onder technologisch vergelijkbare omstandigheden is verkregen, op een dergelijke wijze
      is behandeld.

      3 Onverminderd [artikel 4.4, eerste lid, onderdeel d][ref4], wordt vers vlees van gekweekt vederwild door de
      minister voor menselijke consumptie ongeschikt verklaard, indien het:

      a. een van de gebreken vertoont, onderscheidenlijk een behandeling heeft ondergaan als bedoeld in artikel 13,
      onderdeel a, onderscheidenlijk onderdeel c, van [richtlijn 91/495/EEG](31991L0495);

      b. voor zover ter zake op grond van artikel 13, onderdeel b, van [richtlijn 91/495/EEG](31991L0495) een besluit is
      genomen, afkomstig is van dieren waaraan stoffen zijn toegediend waardoor het vlees gevaarlijk of schadelijk kan
      worden voor de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel4.4
