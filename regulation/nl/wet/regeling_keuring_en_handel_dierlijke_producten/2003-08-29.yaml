  - number: '4.6'
    text: |-
      Vers vlees van pluimvee dat afkomstig is uit een koel- of vrieshuis dat is erkend op grond van
      [artikel 4.16, eerste lid, onderdeel c][ref1], en dat nadien geen enkele goederenbehandeling anders dan verband
      houdend met de opslag heeft ondergaan:

      a. is op voldoende hygiënische wijze behandeld overeenkomstig hoofdstuk VII van bijlage I van [richtlijn 71/118/
      EEG](31971L0118) en voldoet aan de [artikelen 4.4, eerste lid, onderdelen f en g][ref2], en [4.5][ref3], dan wel.

      b. is, voor zover het vers vlees van pluimvee betreft dat afkomstig is uit een lid-staat of een derde land, in
      Nederland gebracht overeenkomstig afdeling 4, onderscheidenlijk 5 van dit hoofdstuk.


