  - number: '5.13'
    text: |-
      1 Een inrichting wordt als vrij-wildverwerkingsinrichting door de minister erkend, indien uit een door de
      keuringsdierenarts ingesteld onderzoek is gebleken dat:

      a. de inrichting voldoet aan de voorschriften van hoofdstuk I van bijlage I van [richtlijn 92/45/EEG](31992L0045),
      met dien verstande dat aan de VWA de volgende voorzieningen om niet ter beschikking worden gesteld:

        - indien gewoonlijk meer dan 2 uur per dag wordt gekeurd en gecertificeerd: 1º. een afsluitbare ruimte met een
      afsluitbare kast, een bureau, stoelen en een telefoon; 2º. een kleedruimte met wasgelegenheid en toilet; 3º. indien
      tijdens het slachtproces gewoonlijk meer dan 4 keurmeesters werkzaam zijn, een verblijfruimte ingericht met stoelen
      en tafels;
        - indien gewoonlijk minder dan 2 uur per dag wordt gekeurd en gecertificeerd, een afsluitbare kast en een telefoon;

      b. voor zover het een inrichting betreft die, in het geval van grof vrij wild, is erkend overeenkomstig
      [artikel 9 van het Besluit produktie en handel vers vlees][ref1] of is erkend op grond van de
      [Regeling uitvoer vers vlees en vleesbereidingen 1985][ref2], dan wel, in het geval van klein vrij vederwild, op
      grond van [artikel 4.16][ref3];

        - vrij wild in een erkend slachthuis in een slachtlokaal op andere tijdstippen dan het overige vlees wordt onthuid;
        - vrij wild in een erkende uitsnijderij in een ander lokaal dan dat waar uitsnijhandelingen worden verricht, wordt
      onthuid;
        - overigens, voor zover van toepassing, aan de voorschriften van hoofdstuk I van bijlage I van [richtlijn 92/45/
      EEG](31992L0045) is voldaan;
        - vlees van vrij wild duidelijk kan worden onderscheiden van vers vlees als bedoeld in [richtlijn 64/433/EEG]
      (31964L0433), vers vlees van pluimvee of konijne- of hazevlees als bedoeld in [richtlijn 91/495/EEG](31991L0495).

      2 De aanvraag voor een erkenning als bedoeld in het eerste lid wordt ingediend bij de directeur van de VWA. Bij de
      aanvraag dient de aanvrager een volledig en naar waarheid ingevuld en ondertekend aanvraagformulier over te leggen,
      waarvan het model door de directeur van de VWA is vastgesteld.

      3 De aanvraag voor erkenning wordt ingediend bij de VWA op een daartoe bestemd aanvraagformulier.


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003737
      [ref3]: https://wetten.overheid.nl/BWBR0006727#Artikel4.16
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel5.13
