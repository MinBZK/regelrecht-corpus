  - number: '9.6'
    text: |-
      1 Gehakt vlees:

      a. is overeenkomstig hoofdstuk II van bijlage I van [richtlijn 94/65/EG](31994L0065) verkregen van of met:

      1º. vers vlees van pluimvee, gekweekt of vrij vederwild dat overeenkomstig de [artikelen 4.4 tot en met 4.11][ref1]
      in de handel is gebracht, dan wel overeenkomstig afdeling 4 of 5 van [hoofdstuk 4][ref2] in Nederland is gebracht;

      2º. vers vlees van klein vrij wild dat overeenkomstig de [artikelen 5.5 tot en met 5.8][ref3] in de handel is
      gebracht, dan wel overeenkomstig afdeling 4 of 5 van [hoofdstuk 5][ref4] in Nederland is gebracht;

      3º. vlees van gekweekte konijnen of hazen dat overeenkomstig de
      [Regeling keuring en handelsverkeer konijne- en hazevlees 1993][ref5] in de handel is gebracht, dan wel
      overeenkomstig de [Regeling invoer konijne- en hazevlees 1993][ref6] in Nederland is gebracht;

      b. is verkregen in een op grond van [artikel 9.10][ref7] erkende of erkend geachte werkplaats;

      c. is overeenkomstig hoofdstuk VII van bijlage I van [richtlijn 94/65/EG](31994L0065) voorzien van een
      onmiddellijke en een eindverpakking;

      d. is of wordt overeenkomstig de punten 2 en 3 van hoofdstuk VIII van bijlage I van [richtlijn 94/65/EG]
      (31994L0065) opgeslagen;

      e. is of wordt op voldoende hygiënische wijze vervoerd;

      f. voldoet aan bijlage II, punt I, van [richtlijn 94/65/EG](31994L0065), en

      g. wordt uitsluitend in de handel gebracht, indien het is bestemd voor Nederland of een derde land.

      2 Voor zover aan gehakt vlees additieven worden toegevoegd, wordt voldaan aan het Additievenbesluit
      ([Warenwet][ref8]).


