  - number: 11.2a
    text: |-
      Zolang het in [artikel 11.2, onderdeel i, onder 1][ref1], bedoelde gezondheidscertificaat nog niet ingevolge de
      regelgeving van de Europese Gemeenschap is vastgesteld en in werking getreden, geldt als gezondheidscertificaat
      een door de minister afgegeven document waarop deze heeft verklaard dat is voldaan aan, voorzover van toepassing,
      hoofdstuk 14, onder l, onderdeel A, van bijlage I van [richtlijn 92/118/EEG](31992L0118).


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel11.2
