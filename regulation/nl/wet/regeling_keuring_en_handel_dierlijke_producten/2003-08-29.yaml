  - number: '11.15'
    text: |-
      In afwijking van hetgeen in deze regeling is bepaald omtrent het anders dan in doorvoer buiten Nederland brengen en
      het in Nederland brengen van produkten, gelden voor een voor Noorwegen bestemde, onderscheidenlijk vanuit Noorwegen
      verzonden partij:

      a. voor diervoeder bestemde, verwerkte dierlijke eiwitten, voor zover het vlees- of beendermeel betreft;

      b. reuzel of gesmolten vet, of

      c. produkten van de bijenteelt de voorschriften in deze regeling omtrent het anders dan in doorvoer buiten
      Nederland brengen, onderscheidenlijk het in Nederland brengen van genoemde produkten die bestemd zijn voor een
      derde land, onderscheidenlijk zijn verzonden vanuit een derde land.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel11.15
  - number: '11.16'
    text: |-
      De [artikelen 11.2, onderdeel 1][ref1], [11.5, veertiende lid][ref2], en [11.8, vijftiende lid][ref3], zijn niet
      van toepassing op voor menselijke consumptie bestemde gelatine die vóór 1 juni 2000 is vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel11.2
