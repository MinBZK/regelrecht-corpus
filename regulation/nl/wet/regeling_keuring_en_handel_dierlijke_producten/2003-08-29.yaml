        afdeling: '2'
  - number: '2.26'
    text: |-
      1 De minister houdt een register van handelaren bij, tenzij hij een door een andere instantie beheerd register als
      zodanig heeft aangewezen.

      2 Een handelaar wordt ingeschreven in het in het eerste lid bedoelde register indien hij zich ertoe heeft
      verbonden:

      a. een administratie te voeren waarin tenminste de leveringen van producten, voor zover zij bestemd zijn voor
      Nederland dan wel een lid-Staat, en de verdere bestemming hiervan zijn vermeld en alle op die producten betrekking
      hebbende bescheiden zijn opgenomen:

      b. de vorenbedoelde administratie ten minste drie jaren te bewaren;

      c. voorafgaand aan de ontvangst, onderscheidenlijk de verdere verdeling of verhandeling van elke partijna te gaan
      of de voor de desbetreffende producten vereiste merken zijn aangebracht en de vereiste bewijsstukken aanwezig zijn;

      d. nalatigheden en onregelmatigheden met betrekking tot een levering van een partij onmiddellijk aan de VWA te
      melden, en

      e. aan de keuringsdierenarts alle medewerking te verlenen en hem alle gegevens te verstrekken, die deze in verband
      met de controle op de naleving van dit artikel noodzakelijk acht.

      3 Indien een handelaar zich niet aan de in het tweede lid bedoelde voorschriften houdt, kan de minister beslissen
      tot doorhaling van de inschrijving van de handelaar in het in het eerste lid bedoelde register, dan wel niet-
      erkenning van diens inschrijving. Doorhaling dan wel niet-erkenning geschiedt niet dan na voorafgaande waarschuwing
      en na het verstrijken van een daarbij te stellen termijn, waarbinnen aan de desbetreffende voorschriften moet
      worden voldaan.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel2.26
  - number: '2.27'
    text: |-
      De belanghebbende bij de lading en de handelaar, alsmede elke natuurlijke persoon of rechtspersoon die een
      partij met het oog op het brengen buiten Nederland aan de keuringsdierenarts ten onderzoek aanbiedt, dan wel zijn
      gemachtigde, en elke natuurlijke persoon of rechtspersoon die producten over Nederlands grondgebied vervoert, zijn
      verplicht aan de keuringsdierenarts alle medewerking te verlenen die deze redelijkerwijs voor de vervulling van
      zijn taken in het kader van deze regeling noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel2.27
  - number: '2.28'
    text: |-
      1 De artikelen 2.17 tot en met [2.23f][ref1] zijn niet van toepassing op producten als bedoeld in artikel 16,
      eerste lid, van [richtlijn 97/78/EG](31997L0078), met dien verstande dat onder commerciële monsters als bedoeld
      in artikel 16, eerste lid, onder e, van [richtlijn 97/78/EG](31997L0078) wordt verstaan handelsmonsters, en mits,
      met inachtneming van artikel 5 van beschikking 93/13/EEG, wordt voldaan aan artikel 16, eerste lid, van [richtlijn
      97/78/EG](31997L0078).

      2 Producten als bedoeld in artikel 16, eerste lid, onderdelen e en f, van [richtlijn 97/78/EG](31997L0078) worden
      aangevoerd via een inspectiepost.

      3 Tenzij met de minister anders is overeengekomen, geeft de belanghebbende bij de lading van de aanvoer, bedoeld
      in het tweede lid, tenminste 24 uur voor de aankomst schriftelijk kennis aan de VWA, onder opgave van het
      vermoedelijke tijdstip van aankomst, van de hoeveelheid, van de herkomst en van de soort producten.

      4 Indien handelsmonsters via Nederland voor het eerst op het grondgebied van Europese Gemeenschap worden gebracht,
      zijn verzonden vanuit een derde land en zijn bestemd voor een lidstaat of Noorwegen, wordt de keuringsdierenarts
      de vergunning, bedoeld in artikel 13, derde lid, van [richtlijn 92/118/EEG](31992L0118) overgelegd, indien het land
      van bestemming de vergunning voorschrijft. Indien de vergunning is vereist, gaan de handelsmonsters tijdens het
      vervoer in Nederland vergezeld van de vergunning en vindt het vervoer plaats onder douanetoezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23f
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: 2.23f
        hoofdstuk: '2'
        paragraaf: 2a
        afdeling: '4'
  - number: '4.1'
    text: |-
      1 Onverminderd [artikel 1.1][ref1], wordt in dit hoofdstuk verstaan onder:



              separatorvlees:

                substantie verkregen door beenderen van kippen, kalkoenen, parelhoenders, eenden of ganzen machinaal te
      ontdoen van spierweefsel, merg en vet;



              karkas:

                gehele lichaam van pluimvee na uitbloeden, plukken en verwijderen van de ingewanden, al dan niet met
      wegneming van het hart, de lever, de longen, de spiermaag, de krop, de nieren, en eventueel na het afsnijden van de
      poten ter hoogte van het tarsaalgewricht of van de kop, de slokdarm en de luchtpijp;



              slachtafval:

                vers vlees van pluimvee dat geen deel uitmaakt van het karkas, ook indien het op natuurlijke wijze met
      het karkas verbonden blijft, alsmede de kop en de poten wanneer deze los worden aangeboden;



              ingewanden:

                slachtafval uit de borst-, buik- en bekkenholte, eventueel met inbegrip van de luchtpijp, de slokdarm en
      de krop;



              onmiddellijke verpakking:

                beschermen door middel van een eerste omhulsel of een eerste bergingsmiddel dat rechtstreeks in contact
      komt met het betrokken product, alsmede het eerste omhulsel of eerste bergingsmiddel zelf;



              eindverpakking:

                plaatsen van een of meer producten die al dan niet van een onmiddellijke verpakking zijn voorzien in een
      bergingsmiddel, alsmede het bergingsmiddel zelf;



              inrichting:

                slachthuis, uitsnijderij, koel- of vrieshuis of complex dat meerdere van deze instellingen omvat;



              detailhandel:

                bedrijf van het kopen en aan particulieren verkopen van waren als bedoeld in artikel 2 van het
      Instellingsbesluit Hoofdbedrijfschap Detailhandel, met uitzondering van verkoop op markten, door venthandel of
      via verzending;



              koppel:

                groep pluimvee behorende tot één soort, van dezelfde leeftijd, die op hetzelfde bedrijf wordt gehouden en
      afkomstig is uit één hok.




      2 In dit hoofdstuk wordt onder ‘lid-staat’ mede verstaan: Noorwegen.

      3 In dit hoofdstuk wordt, in afwijking van [artikel 1.1, eerste lid, onder][ref2] ‘derde land’ verstaan: land, niet
      zijnde Nederland of andere lid-staat van de Europese Unie, en niet zijnde Noorwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel1.1
