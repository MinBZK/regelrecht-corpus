  - number: '10.9'
    text: |-
      1 Een partij vleesbereidingen, met uitzondering van vleesbereidingen van vlees van eenhoevigen, die is verzonden
      vanuit een lid-staat en is bestemd voor Nederland of een lid-staat:

      a. is, voor zover het een partij vleesbereidingen betreft als bedoeld in [artikel 10.4][ref1], voorzien van het
      keurmerk, bedoeld in [artikel 10.2, eerste lid][ref2];

      b. gaat, voor zover het een partij vleesbereidingen betreft als bedoeld in [artikel 10.4][ref3], vergezeld van het
      op de partij betrekking hebbende bewijsstuk, bedoeld in [artikel 10.2, derde lid][ref4];

      c. is op hygiënische wijze voorzien van etikettering overeenkomstig [artikel 10.3, eerste lid, onderdeel e][ref5];

      d. is op hygiënische wijze voorzien van een onmiddellijke en een eindverpakking overeenkomstig
      [artikel 10.3, eerste lid, onderdeel f][ref6];

      e. wordt op hygiënische wijze vervoerd overeenkomstig [artikel 10.3, eerste lid, onderdeel g][ref7];

      f. vertoont geen tekenen van bederf of ondeugdelijkheid.

      2 Onverminderd het eerste lid heeft eventuele opslag, verwerking of ompakking in Nederland
      van vleesbereidingen die zijn verzonden vanuit een lid-staat en die zijn bestemd voor een lid-
      staat, onder bevredigende hygiënische omstandigheden plaatsgevonden in een overeenkomstig
      __REF000___________________________________________________________________________________________________________
      __, dan wel
      [artikel 31, eerste of tweede lid, van de Regeling keuring en handelsverkeer konijne- en hazevlees 1993][ref9]
      erkende inrichting.

      3 Indien de partij vleesbereidingen, bedoeld in het eerste lid, aanhef en onderdeel b, vergezeld gaat van een
      certificaat als bedoeld in dat onderdeel, wordt dat certificaat gedurende ten minste één jaar door de geadresseerde
      bewaard, zodat het desgevraagd aan de keuringsdierenarts kan worden overgelegd.


