  - number: '11.1'
    text: |-
      1 Onverminderd [artikel 1.1][ref1] wordt in dit hoofdstuk verstaan onder:



              handelsdocument:

                document waarop de aard van het produkt, de naam en, voor zover van toepassing, het erkenningsnummer
      van de geregistreerde inrichting, bedoeld in artikel 4, tweede lid, van [richtlijn 92/118/EEG](31992L0118), zijn
      vermeld;



              beenderen, hoornen of hoeven:

                beenderen, hoornen of hoeven als bedoeld in hoofdstuk 5 van bijlage I van [richtlijn 92/118/EEG]
      (31992L0118), bestemd voor andere doeleinden dan menselijke voeding;



              produkten uit beenderen, hoornen of hoeven:

                produkten uit beenderen, hoorn of hoeven als bedoeld in hoofdstuk 5 van bijlage I van [richtlijn 92/118/
      EEG](31992L0118), bestemd voor andere doeleinden dan menselijke voeding, met uitzondering van melen van beenderen,
      hoornen of hoeven;



              voor diervoeding bestemde, verwerkte dierlijke eiwitten:

                dierlijke eiwitten die zijn behandeld om ze geschikt te maken voor rechtstreeks gebruik als diervoeder of
      als een ingrediënt in diervoeder, waaronder vismeel, vleesmeel, beendermeel, meel van hoeven, hoornmeel, bloedmeel,
      verenmeel, gedroogde kanen en andere soortgelijke produkten, mengsels die deze produkten bevatten daaronder
      begrepen;



              produkt van de bijenteelt:

                was, honing, koninginnegelei, propolis of pollen die noch voor menselijke consumptie noch voor
      industrieel gebruik zijn bestemd;



              grondstoffen:

                grondstoffen als bedoeld in punt 1 van hoofdstuk 10 van bijlage I van [richtlijn 92/118/EEG](31992L0118);
      huiden: 'verse, gekoelde of behandelde dermale omhulsels van hoefdieren, met uitzondering van:'
                huiden die vallen onder de [richtlijnen 64/433/EEG](31964L0433) en [72/462/EEG](31972L0462);
      huiden waarop een volledig looiprocedé wordt toegepast;
      ‘wet blue’-huiden;
      ‘pickled-pelt’-huiden;
      huiden die gedurende tenminste 8 uur een behandeling met kalk met een pH van 12 tot 13 hebben ondergaan (‘gekalkte’
      huiden);



              behandelde huiden:

                huiden, die een behandeling als bedoeld in onderdeel I, onder B, van hoofdstuk 3 van bijlage I van
      [richtlijn 92/118/EEG](31992L0118) hebben ondergaan;



              gelatine:

                natuurlijk, oplosbaar eiwit, gelerend of niet-gelerend, verkregen door gedeeltelijke hydrolyse van
      collageen uit beenderen, huiden, ligamenten en pezen van dieren, met uitzondering van gelatine voor gebruik in
      de farmaceutische en de cosmetische sector of voor andere technische doeleinden, alsmede voor gebruik in medische
      hulpmiddelen en met dien verstande dat in deze definitie onder ‘huiden’ wordt verstaan: alle cutane en subcutane
      weefsels;



              looien:

                het harden van huiden met gebruikmaking van plantaardige looistoffen, van chroomzouten of andere
      stoffen zoals aluminiumzouten, ijzerzouten, siliciumzouten, aldehyden en chinonen, of van andere synthetische
      hardingsstoffen.




      2 In dit hoofdstuk wordt onder ‘lid-staat’ mede verstaan: Noorwegen.

      3 In dit hoofdstuk wordt, in afwijking van [artikel 1.1, eerste lid, onder][ref2] ‘derde land’ verstaan: land, niet
      zijnde Nederland of andere lid-staat van de Europese Unie, en niet zijnde Noorwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel1.1
