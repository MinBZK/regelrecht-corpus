      1. Vleesbereidingen zijn niet voor menselijke consumptie ongeschikt verklaard en vertonen geen tekenen van bederf
      of ondeugdelijkheid.

      2. Vleesbereidingen worden voor menselijke consumptie ongeschikt verklaard, indien zij gebreken vertonen of
      behandelingen hebben ondergaan als bedoeld in [artikel 4.7, tweede lid][ref1].


