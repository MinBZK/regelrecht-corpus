  - number: '11.7'
    text: |-
      1 De in [artikel 11.2][ref1] genoemde overige dierlijke producten die zijn verzonden vanuit een lid-staat en
      zijn bestemd voor Nederland of een lid-staat, gaan vergezeld van het voor de desbetreffende productsoort in
      [artikel 11.2][ref2] genoemde handelsdocument of certificaat en voldoen aan hetgeen omtrent het intracommunautaire
      handelsverkeer in de desbetreffende productsoort is bepaald in [richtlijn 92/118/EEG](31992L0118).

      2 Indien het overige dierlijke producten als bedoeld in [artikel 11.2, onderdeel f][ref3], betreft, is tevens
      voldaan aan [artikel 11.10][ref4], tenzij de daar bedoelde voorschriften uitsluitend betrekking hebben op producten
      afkomstig uit derde landenen met uitzondering van het voorschrift dat de producten onder veterinair toezicht worden
      vervoerd.

      3 Verwerkte dierlijke afvallen als bedoeld in artikel 4, eerste lid, van beschikking 97/735/EG worden niet in
      Nederland gebracht.


