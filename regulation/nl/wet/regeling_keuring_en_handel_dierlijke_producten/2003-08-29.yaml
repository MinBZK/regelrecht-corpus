  - number: 2.23i
    text: |-
      Een handelaar die de in [artikel 2.23g][ref1] bedoelde producten aflevert aan zeevervoermiddelen als proviand voor
      bemanning en passagiers, houdt een register bij dat voldoet aan de in artikel 13, tweede lid, onderdeel d, van
      [richtlijn 97/78/EG](31997L0078) gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23g
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel2.23i
    references:
