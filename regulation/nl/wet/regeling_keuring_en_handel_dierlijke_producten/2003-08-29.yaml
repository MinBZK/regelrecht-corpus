  - number: '5.10'
    text: |-
      1 Een partij vlees van vrij wild of gehele stukken vrij wild die via Nederland voor het eerst op het grondgebied
      van de Europese Gemeenschap wordt gebracht en die is bestemd voor Nederland of een lid-staat, is afkomstig uit een
      derde land of gedeelte van een derde land van waaruit het brengen op het grondgebied van de Europese Gemeenschap is
      toegestaan ingevolge beschikking 97/217/EG.

      2 Een partij vlees van vrij wild of gehele stukken vrij wild als bedoeld in het eerste lid gaat vergezeld van een
      op de partij betrekking hebbend gezondheidscertificaat waarvan het model overeenstemt met het voor de betrokken
      vleessoort uit het betrokken land van herkomst in beschikking 97/218/EG, onderscheidenlijk 97/220/EG vastgestelde
      model.

      3 Een partij vlees van vrij wild of gehele stukken vrij wild als bedoeld in het eerste lid voldoet, al naar
      gelang het soort vlees of de soorten gehele stukken, aan de voorschriften die zijn vermeld op de in het tweede lid
      bedoelde certificaten en in beschikking 97/218/EG, onderscheidenlijk 97/220/EG.

      4 Een partij vlees van vrij wild of gehele stukken vrij wild is afkomstig uit een inrichting die, zodra deze is
      vastgesteld en in werking getreden, voorkomt op de voor vlees van vrij wild en gehele stukken vrij wild uit het
      betrokken land van herkomst geldende voorlopige lijst van inrichtingen als bedoeld in beschikking 95/408/EG, die
      alsdan ter inzage ligt in de bibliotheek van het Ministerie van Landbouw, Natuurbeheer en Visserij in Den Haag, met
      dien verstande dat indien bij de vaststelling van voornoemde lijst is voorzien in overgangsbepalingen het vlees en
      de stukken met inachtneming van die bepalingen afkomstig mogen zijn uit een inrichting die voldoet aan [richtlijn
      92/45/EEG](31992L0045).
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel5.10
  - number: '5.12'
    text: |-
      Onverminderd de [artikelen 5.10][ref1] en [5.11][ref2] is, zolang de voorschriften voor het op het grondgebied
      van de Europese Gemeenschap brengen van vlees van vrij wild of gehele stukken vrij wild vanuit derde landen niet
      of slechts gedeeltelijk ingevolge de regelgeving van de Europese Gemeenschap zijn vastgesteld, het brengen in
      Nederland van vlees van vrij wild of gehele stukken vrij wild, bestemd voor een lid-staat, toegestaan indien is
      voldaan aan de voorschriften van de lidstaat van bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel5.10
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel5.11
