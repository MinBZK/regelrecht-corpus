  - number: '4.2'
    text: |-
      1 Vers vlees van pluimvee dat anders dan in doorvoer buiten Nederland wordt gebracht is voorzien van een keurmerk
      overeenkomstig hoofdstuk XII van bijlage I van [richtlijn 71/118/EEG](31971L0118).

      2 Een partij vers vlees van pluimvee die anders dan in doorvoer buiten Nederland wordt gebracht gaat vergezeld van:

      a. indien het een partij vers vlees van kippen, kalkoenen, parelhoenders, eenden of ganzen betreft:

      1º. een begeleidend handelsdocument als bedoeld in artikel 3, I, onderdeel A, onder i, eerste gedachtenstreepje,
      van [richtlijn 71/118/EEG](31971L0118), dan wel

      2º. een keuringscertificaat als bedoeld in bijlage VI van [richtlijn 71/118/EEG](31971L0118), wanneer het
      gaat om een partij die is verkregen in een slachthuis dat is gelegen in een gebied of zone waarvoor om
      veterinairrechtelijke redenen beperkingen gelden, of om een partij die voor een andere lid-staat is bestemd na
      doorvoer via een derde land in een met een loodje verzegeld vervoermiddel;

      b. indien het een partij vers vlees van gekweekt vederwild betreft, een gezondheidscertificaat als bedoeld in
      bijlage IV van [richtlijn 91/495/EEG](31991L0495).
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel4.2
  - number: '4.3'
    text: |-
      1 Het in de handel brengen van vers vlees van pluimvee is verboden.

      2 Het verbod, bedoeld in het eerste lid, geldt niet indien, voor zover van toepassing, is voldaan aan de
      [artikelen 4.4][ref1] tot en met [4.10][ref2], alsmede, voor zover het vers vlees van pluimvee betreft dat is
      bestemd voor Nederland, aan [artikel 4.11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel4.4
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel4.10
      [ref3]: https://wetten.overheid.nl/BWBR0006727#Artikel4.11
