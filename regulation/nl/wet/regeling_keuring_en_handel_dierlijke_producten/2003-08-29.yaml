  - number: '4.12'
    text: |-
      1 Vers vlees van pluimvee dat is verzonden vanuit een lid-staat en dat is bestemd voor Nederland of een lid-staat:

      a. is voorzien van het keurmerk, bedoeld in [artikel 4.2, eerste lid][ref1], dan wel, indien het vlees
      van oorsprong is uit een derde land of gedeelte van een derde land waaruit het op het grondgebied van
      de Europese Gemeenschap brengen van het vlees is toegestaan ingevolge beschikking 94/85/EEG en het vlees
      in de lid-staat van verzending niet is omgepakt of verwerkt, van een origineel keurmerk als bedoeld in
      [artikel 4.14, tweede lid][ref2];

      b. gaat vergezeld van het op de partij betrekking hebbende van toepassing zijnde bewijsstuk, bedoeld in
      [artikel 4.2, tweede lid, onderdeel a, onder 2° en 3°][ref3], of, indien het gekweekt vederwild betreft,
      [artikel 4.2, tweede lid, onderdeel b][ref4], met dien verstande dat, indien het vlees door onderdompeling is
      gekoeld, op het bewijsstuk wordt vermeld dat deze onderdompeling heeft plaatsgevonden overeenkomstig hoofdstuk VII,
      punten 42 en 43 van bijlage I van [richtlijn 71/118/EEG](31971L0118) en dat het vlees na koeling onmiddellijk is
      bevroren of diepgevroren;

      c. is op hygiënische wijze verpakt en wordt op hygiënische wijze vervoerd overeenkomstig
      [artikel 4.4, eerste lid, onderdeel f, onderscheidenlijk g][ref5], en vertoont geen tekenen van bederf of
      ondeugdelijkheid.

      2 Onverminderd het eerste lid, heeft eventuele opslag, verwerking of ompakking in Nederland van vers vlees van
      pluimvee dat is verzonden vanuit een lid-staat en dat is bestemd voor een lid-staat, onder bevredigende hygiënische
      omstandigheden plaatsgevonden in een op grond van [artikel 4.16, eerste lid][ref6], erkende inrichting.

      3 Indien de partij vers vlees van pluimvee vergezeld gaat van een handelsdocument als bedoeld in
      [artikel 4.2, tweede lid, onderdeel a, onder 2°][ref7], wordt dit document gedurende tenminste één jaar door de
      geadresseerde bewaard zodat het desgevraagd aan de keuringsdierenarts kan worden overgelegd.

      [Afdeling 5][ref8] Het brengen in Nederland van vers vlees van pluimvee uit derde landen ([artikelen 4.13][ref9]
      tot en met [4.15][ref10])


