  - number: 2.2a
    text: |-
      1 Van het verbod bedoeld in artikel 2.1, eerste lid, wordt, met inachtneming van [artikel 2.6][ref1], vrijstelling
      verleend voor het door een producent van dierlijke meststoffen anders dan in doorvoer buiten Nederland brengen van
      onverwerkte dierlijke mest om daar voor eigen gebruik te worden aangewend, mits:

      a. de producent dan wel diens gemachtigde door middel van een formulier zoals opgenomen in bijlage F, deel I,
      van deze regeling, dat voor het desbetreffende kalenderjaar is gewaarmerkt door het Bureau Heffingen, tijdens het
      vervoer kan aantonen dat de grond in de lid-staat van bestemming is aan te merken als tot het bedrijf van herkomst
      van de mest behorende, in een grensgebied gelegen grond die door het bedrijf feitelijk wordt gebruikt voor de
      landbouwkundige exploitatie, en

      b. de lid-staat van bestemming geen bezwaar heeft tegen het op zijn grondgebied brengen van de mest en is voldaan
      aan de voorschriften van die lid-staat, met dien verstande dat indien de mest is bestemd voor België, de mest
      tijdens het vervoer tevens vergezeld gaat van het formulier zoals opgenomen in bijlage F, deel II van deze
      regeling.

      2 Een formulier zoals opgenomen in bijlage F van deze regeling is jaarlijks te verkrijgen bij het Bureau Heffingen.
      Een formulier wordt gewaarmerkt indien de producent het formulier volledig en naar waarheid ingevuld en ondertekend
      heeft ingediend bij het Bureau Heffingen.


