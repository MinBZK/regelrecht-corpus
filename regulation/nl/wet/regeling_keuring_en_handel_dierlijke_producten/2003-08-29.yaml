  - number: '11.5'
    text: |-
      1 Indien het een partij niet voor menselijke consumptie bestemde vloeibare melk, melkpoeder of melkpoederprodukten
      betreft, wordt voldaan aan hetgeen in hoofdstuk 1 van bijlage I, van [richtlijn 92/118/EEG](31992L0118) omtrent het
      intracommunautaire handelsverkeer in deze produkten is bepaald.

      2 Indien het een partij huiden betreft, wordt voldaan aan hetgeen in hoofdstuk 3 van bijlage I van [richtlijn
      92/118/EEG](31992L0118) omtrent het intracommunautaire handelsverkeer in deze produkten is bepaald.

      3 Indien het een partij beenderen, hoornen of hoeven bestemd voor dierlijke voeding, dan wel een partij produkten
      uit beenderen, hoornen of hoeven bestemd voor dierlijke voeding betreft, wordt voldaan aan:

      a. de artikelen 3 en 4 van [richtlijn 72/461/EEG](31972L0461), voor zover het beenderen, hoornen of boeven betreft,
      dan wel

      b. de artikelen 3 en 4 van [richtlijn 80/215/EEG](31980L0215), voor zover het produkten uit beenderen, hoornen of
      hoeven betreft.

      4 Indien het een partij serum van paardachtigen betreft, wordt voldaan aan hetgeen in hoofdstuk 8, onderdeel 1, van
      bijlage I, van [richtlijn 92/118/EEG](31992L0118) omtrent het intracommunautaire handelsverkeer in deze produkten
      is bepaald.

      5 Indien het een partij grondstoffen voor de vervaardiging van diervoeder dan wel van farmaceutische of technische
      produkten betreft, wordt voldaan aan hetgeen in hoofdstuk 10, onderdelen 1, 2, 4, 5, 6 en 7 van bijlage I, van
      [richtlijn 92/118/EEG](31992L0118) omtrent het intracommunautaire handelsverkeer in deze produkten is bepaald.

      6 Indien het een partij produkten van de bijenteelt betreft, wordt voldaan aan hetgeen in hoofdstuk 12 van bijlage
      I van [richtlijn 92/118/EEG](31992L0118) omtrent het intracommunautaire handelsverkeer in deze produkten is
      bepaald en indien het een partij voor menselijke consumptie bestemde honing betreft, wordt, in voorkomend geval,
      voldaan aan de bij beschikking van de Commissie van de Europese Gemeenschappen of de Raad van de Europese Unie
      overeenkomstig hoofdstuk 2 van bijlage II van die richtlijn, voor het intra-communautaire handelsverkeer in deze
      produkten vastgestelde voorschriften, voor zover deze veterinairrechtelijk van aard zijn.

      7 Indien het een partij jachttrofeeën betreft, wordt voldaan aan hetgeen in hoofdstuk 13 van bijlage I van
      [richtlijn 92/118/EEG](31992L0118) omtrent het intracommunautaire handelsverkeer in deze produkten is bepaald.

      8 Indien het een partij verwerkte produkten uit mest of niet-verwerkt mest als bedoeld in hoofdstuk 14, van bijlage
      I, van [richtlijn 92/118/EEG](31992L0118) betreft, wordt voldaan aan hetgeen in voornoemd hoofdstuk omtrent het
      intracommunautaire handelsverkeer in deze produkten is bepaald.

      9 Indien het een partij onbewerkte schapewol, onbewerkt haar van herkauwers of van varkens dan wel onbewerkte veren
      of delen van veren als bedoeld in hoofdstuk 15, van bijlage I, van [richtlijn 92/118/EEG](31992L0118) betreft, niet
      zijnde sierveren of veren, bedoeld in onderdeel 3 van voornoemd hoofdstuk, wordt voldaan aan hetgeen in voornoemd
      hoofdstuk omtrent het intracommunautaire handelsverkeer in deze produkten is bepaald.

      10 Indien het een partij voor diervoeding bestemde verwerkte dierlijke eiwitten betreft, wordt voldaan aan hetgeen
      in de Verordening Vvr handel in dierlijke eiwitten 1994 omtrent het intracommunautaire handelsverkeer in deze
      produkten is bepaald.

      11 Indien het een partij voeder voor gezelschapsdieren als bedoeld in hoofdstuk 4 van bijlage I van [richtlijn
      92/118/EEG](31992L0118) betreft, wordt voldaan aan hetgeen in de Verordening Vvr hygiënische produktie en handel
      huisdiervoeders 1990 omtrent het intracommunautaire handelsverkeer in deze produkten is bepaald.

      12 Indien het een partij voor menselijke consumptie bestemde eieren betreft, wordt, in voorkomend geval,
      voldaan aan de bij beschikking van de Commissie van de Europese Gemeenschappen of de Raad van de Europese Unie
      overeenkomstig hoofdstuk 2 van bijlage II van [richtlijn 92/118/EEG](31992L0118), voor het intra-communautaire
      handelsverkeer in deze produkten vastgestelde voorschriften, voor zover deze veterinairrechtelijk van aard zijn.

      13 Indien het een partij voor menselijke consumptie bestemde slakken of voor menselijke consumptie bestemde
      kikkerbillen betreft, wordt, in voorkomend geval, voldaan aan de bij beschikking van de Commissie van de Europese
      Gemeenschappen of de Raad van de Europese Unie overeenkomstig hoofdstuk 2 van bijlage II van [richtlijn 92/118/EEG]
      (31992L0118), voor het intra-communautaire handelsverkeer in deze produkten vastgestelde voorschriften, voor zover
      deze veterinairrechtelijk van aard zijn.

      14 Indien het een partij voor menselijke consumptie bestemde gelatine of grondstoffen, die bestemd zijn voor
      de vervaardiging van voor menselijke consumptie geschikte gelatine, betreft, wordt voldaan aan de in bijlage
      II, hoofdstuk 4, van de [richtlijn 92/118/EEG](31992L0118) vastgestelde voorschriften, voor zover deze
      veterinairrechtelijk van aard zijn.

      15 Indien het een niet voor menselijke consumptie bestemde partij bloed of bloedproducten betreft, wordt voldaan
      aan hetgeen in hoofdstuk 7 van bijlage I van [richtlijn 92/118/EEG](31992L0118) omtrent het intra-communautaire
      handelsverkeer in deze producten is bepaald.

      16 Indien het een partij verwerkte dierlijke afvallen als bedoeld in artikel 4, eerste lid, van beschikking 97/735/
      EG bestemd voor ingevolge dat artikel toegelaten doeleinden betreft, wordt voldaan aan artikel 4, tweede lid,
      onderdelen a, b, c en e, van die beschikking.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel11.5
  - number: '11.6'
    text: |-
      1 Registratie van een inrichting als bedoeld in [artikel 11.3, onderdeel a][ref1], vindt plaats, indien de
      inrichting zich ertoe heeft verbonden:

      a. een administratie te voeren waarin tenminste de leveringen van de in [artikel 11.2][ref2] genoemde overige
      dierlijke produkten en de verdere bestemming hiervan zijn vermeld en alle op deze produkten betrekking hebbende
      bescheiden zijn opgenomen;

      b. de vorenbedoelde administratie tenminste drie jaren te bewaren;

      c. er zorg voor te dragen dat elke partij vergezeld gaat van de voorgeschreven certificaten of documenten, en

      d. er zorg voor te dragen dat, overeenkomstig hetgeen de minister daaromtrent heeft bepaald, in de inrichting de
      voorschriften van artikel 4, tweede lid, onderdeel a, van [richtlijn 92/118/EEG](31992L0118) worden nageleefd, en

      e. dat in de inrichting, voor zover van toepassing, de aanwijzingen van de toezichthoudende ambtenaar worden
      opgevolgd en deze alle medewerking wordt verleend die deze redelijkerwijs voor de vervulling van zijn taken in
      het kader van dit hoofdstuk noodzakelijk acht aan deze ambtenaar wordt desgevraagd toegang verleend tot het gehele
      bedrijf.

      2 De minister houdt een register bij van de in [artikel 11.3, onderdeel a][ref3], bedoelde inrichtingen, tenzij hij
      een door een andere instantie beheerd register als zodanig heeft aangewezen.

      3 Indien is gebleken dat de exploitant of de beheerder van de inrichting de in het eerste lid bedoelde
      voorschriften niet of niet meer naleeft, kan de minister beslissen tot doorhaling, dan wel niet-erkenning van
      diens registratie. Doorhaling dan wel niet-erkenning geschiedt niet dan na voorafgaande waarschuwing en na het
      verstrijken van een daarbij te stellen termijn, waarbinnen aan de desbetreffende voorschriften moet worden voldaan.

      4 De aanvraag voor erkenning wordt ingediend bij de VWA met een daartoe bestemd aanvraagformulier.


