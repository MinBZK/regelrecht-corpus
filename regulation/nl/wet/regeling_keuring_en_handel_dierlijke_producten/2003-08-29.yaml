  - number: '4.20'
    text: |-
      Dood pluimvee, delen daarvan of vers vlees van pluimvee, dat dan wel die voor menselijke consumptie ongeschikt
      is dan wel zijn verklaard of anderszins niet geschikt wordt, dan wel worden, bevonden voor menselijke consumptie,
      wordt:

      a. voor zover het vlees zich bevindt in een inrichting, onmiddellijk verzameld in de in hoofdstuk I, punt 4,
      onderdeel d, van bijlage I van [richtlijn 71/118/EEG](31971L0118) bedoelde bakken of lokalen dan wel, indien het
      een op grond van [artikel 4.16, tweede lid][ref1], erkende inrichting betreft, op de wijze, bedoeld in hoofdstuk I,
      punt 4, onderdeel c, van bijlage II van voornoemde richtlijn en onder toezicht van de keuringsdierenarts of diens
      assistent onbruikbaar gemaakt voor menselijke consumptie, en

      b. behandeld overeenkomstig de bij of krachtens de [Destructiewet][ref2] of de
      [Gezondheids- en welzijnswet voor dieren][ref3] aan de verwerking van derg elijk materiaal gestelde regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel4.16
      [ref2]: https://wetten.overheid.nl/BWBR0002244
      [ref3]: https://wetten.overheid.nl/BWBR0005662
