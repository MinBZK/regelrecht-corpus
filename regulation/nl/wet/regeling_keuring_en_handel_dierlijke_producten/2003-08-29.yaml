  - number: '4.16'
    text: |-
      1 Erkenning van:

      a. een slachthuis als bedoeld in artikel 3, onder I, onderdeel A, van [richtlijn 71/118/EEG](31971L0118) vindt
      plaats indien het slachthuis voldoet aan de hoofdstukken I en II van bijlage I van [richtlijn 71/118/EEG]
      (31971L0118);

      b. een uitsnijderij als bedoeld in artikel 3, onder I, onderdeel B, van [richtlijn 71/118/EEG](31971L0118) vindt
      plaats indien de uitsnijderij voldoet aan de hoofdstukken I en III van bijlage I van [richtlijn 71/118/EEG]
      (31971L0118);

      c. een koel- of vrieshuis als bedoeld in artikel 3, onder I, onderdeel C, van [richtlijn 71/118/EEG](31971L0118)
      vindt plaats indien het koel- of vrieshuis voldoet aan de hoofdstukken I en IV van bijlage I van [richtlijn 71/118/
      EEG](31971L0118);

      d. een inrichting als bedoeld in artikel 14 van [richtlijn 91/495/EEG](31991L0495) vindt plaats indien de
      inrichting:

      1º. indien het een slachthuis betreft, voldoet aan onderdeel a;

      2º. indien het een uitsnijderij betreft, voldoet aan onderdeel b;

      3º. indien het een koel- of vrieshuis betreft, voldoet aan onderdeel c, met dien verstande dat aan de VWA de
      volgende voorzieningen om niet ter beschikking worden gesteld:

        - indien gewoonlijk meer dan 2 uur per dag wordt gekeurd en gecertificeerd: 1. een afsluitbare ruimte met een
      afsluitbare kast, een bureau, stoelen en een telefoon; 2. een kleedruimte met wasgelegenheid en toilet; 3. indien
      tijdens het slachtproces gewoonlijk meer dan 4 keurmeesters werkzaam zijn, een verblijfruimte ingericht met stoelen
      en tafels;
        - indien gewoonlijk minder dan 2 uur per dag wordt gekeurd en gecertificeerd, een afsluitbare kast en een telefoon.

      2 Een inrichting wordt eveneens erkend:

      a. voor zover het een slachthuis betreft, indien in het slachthuis in totaal niet meer dan 3000 dieren per week en
      150.000 dieren per jaar worden geslacht en is voldaan aan de voorschriften van bijlage II van [richtlijn 71/118/
      EEG](31971L0118), met dien verstande dat de bevoegde autoriteit, genoemd in hoofdstuk II van voornoemde bijlage, de
      minister is;

      b. voor zover het een uitsnijderij betreft, indien:

        - de uitsnijderij niet in een inrichting als bedoeld in het eerste lid is gelegen;
        - voor zover de uitsnijderij tevens is erkend op grond van krachtens de [Vleeskeuringswet][ref1] ter implementatie
      van artikel 4, tweede lid, van [richtlijn 64/433/EEG](31964L0433) gestelde regelen, in die uitsnijderij in totaal
      niet meer dan 5 ton vlees per week wordt geproduceerd;
        - in andere gevallen dan als bedoeld onder het tweede gedachtenstreepje, in de uitsnijderij in totaal niet meer dan
      3 ton vlees per week wordt geproduceerd;
        - uit een door de keuringsdierenarts ingesteld onderzoek is gebleken dat is voldaan aan de voorschriften van
      hoofdstuk I van bijlage II van [richtlijn 71/118/EEG](31971L0118),

      met dien verstande dat aan de VWA een afsluitbare kast en een telefoon om niet ter beschikking worden gesteld.

      3 Een erkenning wordt door de minister verleend nadat uit een door de keuringsdierenarts ingesteld onderzoek is
      gebleken dat aan de voorschriften van het eerste of tweede lid is voldaan.

      4 De aanvraag voor erkenning wordt ingediend bij de VWA op een daartoe bestemd formulier.

      5 Aan een inrichting die op grond van dit artikel is erkend, wordt een erkenningsnummer toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001896
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0001896
  - number: '4.17'
    text: |-
      De exploitant of de eigenaar, dan wel diens vertegenwoordiger van een erkende inrichting draagt er zorg voor dat:

      a. indien het een slachthuis betreft, in het slachthuis de hygiënische voorschriften van de hoofdstukken
      V en VII van bijlage I van [richtlijn 71/118/EEG](31971L0118), alsmede de overige hygiënevoorschriften van
      die richtlijn worden nageleefd, met dien verstande dat, indien het een slachthuis is erkend op grond van
      [artikel 4.16, tweede lid][ref1], er tevens zorg voor wordt gedragen dat:

        - een register wordt bijgehouden op grond waarvan de volgende gegevens kunnen worden gecontroleerd: 1º. het
      inkomende pluimvee en de uitgaande slachtprodukten; 2º. de overeenkomstig [artikel 4.19][ref2] uitgevoerde
      controles; 3º. de resultaten van de onder 2° bedoelde controles, welke gegevens desgevraagd terstond aan de
      keuringsdierenarts worden overgelegd;
        - de keuringsdierenarts op de hoogte wordt gebracht van het tijdstip van slachten, het aantal dieren en de
      herkomst ervan en hem een afschrift toekomt van de in bijlage IV van [richtlijn 71/118/EEG](31971L0118) bedoelde
      gezondheidsverklaring, dan wel van het in bijlage A van deze regeling bedoelde document;
        - de keuringsdierenarts of diens assistent bij het verwijderen van de ingewanden aanwezig is om te
      controleren of de in de hoofdstukken VII en VIII van bijlage I van [richtlijn 71/118/EEG](31971L0118) bedoelde
      hygiënevoorschriften worden nageleefd, met dien verstande dat, ingeval geen van beiden bij het slachten aanwezig
      kan zijn, het vlees de inrichting slechts verlaat nadat een keuring na het slachten is verricht die op de dag van
      het slachten heeft plaatsgevonden;
        - het vlees afkomstig uit de inrichting wordt gemerkt met het merk, bedoeld in [artikel 4.10, eerste lid][ref3];

      b. indien het een uitsnijderij betreft:

        - in de uitsnijderij de voorschriften van de hoofdstukken X en, voor zover van toepassing, hoofdstuk V van bijlage
      I van richtijn 71/118/EEG alsmede de overige hygiënevoorschriften van die richtlijn worden nageleefd, met dien
      verstande dat de hoofdstukken VII en X en punt 64 van hoofdstuk XI van bijlage I van [richtlijn 71/118/EEG]
      (31971L0118) niet van toepassing zijn op het uitsnijden en opslaan in een uitsnijderij die is erkend op grond van
      [artikel 4.16, tweede lid][ref4];
        - in de uitsnijderij een register wordt bijgehouden van al het inkomende en uitgaande verse vlees van pluimvee,
      onder vermelding van de aard van het ingekomen vlees, dat op verzoek van de keuringsdierenarts of diens assistent
      wordt overgelegd;

      c. indien het een koel- of vrieshuis betreft, in het koel- of vrieshuis de voorschriften van de hoofdstukken
      X en, voor zover van toepassing, XIII van bijlage I van [richtlijn 71/118/EEG](31971L0118), alsmede de overige
      hygiënevoorschriften van die richtlijn worden nageleefd;

      d. in de inrichting de aanwijzingen van de keuringsdierenarts of diens assistent worden opgevolgd en dat deze alle
      medewerking wordt verleend die hij redelijkerwijs voor de vervulling van zijn taken in het kader van dit hoofdstuk
      noodzakelijk acht: aan de keuringsdierenarts of diens assistent wordt desgevraagd toegang verleend tot het gehele
      bedrijf.


