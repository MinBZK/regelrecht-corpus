  - number: '2.8'
    text: |-
      1 Het verbod, bedoeld in artikel 2.1, tweede lid, geldt niet ter zake van het brengen in Nederland van overige
      dierlijke producten, anders dan die genoemd in [artikel 11.2][ref1], die zijn verzonden vanuit:

      a. een lid-staat, dan wel

      b. een derde land en via het grondgebied van een lid-staat in Nederland worden gebracht en zijn bestemd voor
      Nederland of een lid-staat, dan wel

      c. een derde land en via het grondgebied van een lid-staat in Nederland worden gebracht en zijn bestemd voor een
      derde land voor zover het handelsmonsters betreft, mits, voor zover van toepassing, wordt voldaan aan het tweede
      lid, alsmede aan [artikel 2.13][ref2].

      2 Handelsmonsters die zijn verzonden vanuit een derde land en via het grondgebied van een lid-staat of Noorwegen
      in Nederland worden gebracht en zijn bestemd voor een lid-staat of Noorwegen gaan, indien het land van bestemming
      voor het brengen op haar grondgebied van die handelsmonsters een vergunning als bedoeld in artikel 13, derde lid,
      van [richtlijn 92/118/EEG](31992L0118) voorschrijft, tijdens het vervoer vergezeld van de vergunning. Indien de
      vergunning is vereist, vindt het vervoer plaats onder douanetoezicht.

      3 Het verbod, bedoeld in artikel 2.1, tweede lid, geldt, behalve indien het gehakt vlees van andere dieren dan
      runderen, varkens, schapen of geiten, vleesbereidingen van vlees van eenhoevigen, dan wel separatorvlees als
      bedoeld in [artikel 4.1][ref3] betreft, niet ter zake van het brengen in Nederland van producten die zijn verzonden
      vanuit een lid-staat, mits wordt voldaan aan:

      a. voor zover van toepassing, de [artikelen 2.9][ref4] tot en met [2.14][ref5], [2.26, tweede lid][ref6] en
      [2.27][ref7], en

      b. indien de producten zijn bestemd voor Nederland, een lid-staat of Noorwegen:

      1º. [afdeling 4][ref8] van [hoofdstuk 4][ref9], indien het vers vlees van pluimvee betreft;

      2º. [afdeling 4][ref10] van [hoofdstuk 5][ref11], indien het vlees van vrij wild of gehele stukken vrij wild
      betreft;

      3º. afdeling 3 van hoofdstuk 11, indien het in [artikel 11.2][ref12] genoemde overige dierlijke producten betreft,
      of.

      c. indien de producten zijn bestemd voor Nederland of een lid-staat:

      1º. afdeling 4 van hoofdstuk 9, indien het gehakt vlees van runderen, varkens, schapen of geiten betreft;

      2º. afdeling 4 van hoofdstuk 10, indien het vleesbereidingen, met uitzondering van vleesbereidingen van vlees van
      eenhoevigen, betreft;

      d. indien de producten zijn bestemd voor IJsland en het grondstoffen als bedoeld in [artikel 11.1][ref13] afkomstig
      van vis betreft, of voor dierlijke voeding bestemd vismeel dan wel producten of mengsels daarvan, aan afdeling 3
      van hoofdstuk 11 voor zover deze afdeling op die producten van toepassing is.

      4 Het verbod, bedoeld in artikel 2.1, tweede lid, is niet van toepassing op het brengen in Nederland van producten
      die, met inachtneming evenwel van [artikel 2.13][ref14]:

      a. in kleine hoeveelheden in de persoonlijke bagage van reizigers voor eigen gebruik worden vervoerd;

      b. zonder enig handelskarakter in kleine zendingen aan particulieren worden toegestuurd;

      c. zich als proviand voor personeel en passagiers bevinden in grensoverschrijdende vervoermiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel11.2
