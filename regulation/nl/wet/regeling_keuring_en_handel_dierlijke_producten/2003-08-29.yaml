  - number: '4.22'
    text: |-
      Degene die voornemens is pluimvee bedrijfsmatig te slachten of vers vlees van pluimvee bedrijfsmatig uit te
      snijden, dient de keuringsdierenarts ten behoeve van de keuring van het vlees de werkdag tevoren tussen 8.15 en
      17.00 uur te waarschuwen en de door de keuringsdieren-arts, dan wel zijn assistenten verlangde medewerking te
      verlenen of te doen verlenen.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel4.22
  - number: '4.23'
    text: |-
      1 De in dit hoofdstuk bedoelde werkzaamheden van de VWA geschieden in de periode van maandag tot en met vrijdag,
      met uitzondering van algemeen erkende feestdagen, van 07.00 uur tot 18.00 uur.

      2 In afwijking van het eerste lid geschieden de in dit hoofdstuk bedoelde werkzaamheden van de VWA tussen 05.00 uur
      en 07.00 uur, alsmede tussen 18.00 uur en 23.00 uur, indien:

      a. in het slachthuis gedurende een aaneengesloten periode van ten minste 6 maanden, die per periode uiterlijk 30
      dagen voor de aanvang aan de VWA bekend is gemaakt, ten minste 15 uren per week in de in het eerste lid genoemde
      tijdvakken in een tempo van ten minste 50 dieren per minuut per band wordt geslacht;

      b. er een mechanisme aanwezig is dat ten behoeve van de werkzaamheden van de VWA de aantallen dieren registreert
      die zijn geslacht tussen 05.00 uur en 07.00 uur, tussen 07.00 uur en 18.00 uur, tussen 18.00 uur en 23.00 uur,
      respectievelijk tussen 23.00 uur en 05.00 uur van de daaropvolgende dag.

      3 De minister kan in bijzondere gevallen toestemmen in afwijking van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel4.23
  - number: '4.24'
    text: |-
      1 Dit hoofdstuk is niet van toepassing op het uitsnijden en opslaan van vers vlees van pluimvee in
      detailhandelszaken of in lokalen die aan verkooppunten grenzen, waar het uitsnijden en opslaan uitsluitend met
      het oog op rechtstreekse verkoop aan de eindverbruiker geschiedt. In deze situaties zijn de voorschriften voor het
      uitoefenen van de detailhandel van toepassing.

      2 Met uitzondering van de [artikelen 4.2, tweede lid, onderdeel a, onder 1°, 4.8 en 4.9][ref1], is dit hoofdstuk
      niet van toepassing op vers vlees van pluimvee, voor zover afkomstig uit of bestemd voor een lid-staat of
      Noorwegen, dat is bestemd voor gebruik als bedoeld in artikel 3, onderdeel III, van [richtlijn 71/118/EEG]
      (31971L0118).

      3 De [artikelen 4.2, tweede lid, onderdeel a, onder 1°, en 4.8][ref2] zijn niet van toepassing op vers vlees van
      pluimvee, voor zover afkomstig uit een derde land, niet zijnde Noorwegen dat is bestemd voor gebruik als bedoeld in
      artikel 3, onderdeel B, van [richtlijn 91/494/EEG](31991L0494).

      4 Afdeling 4 van dit hoofdstuk is niet van toepassing op vers vlees van pluimvee dat is bestemd voor gebruik als
      bedoeld in artikel 8, tweede lid, van [richtlijn 91/494/EEG](31991L0494).


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel4.2
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel4.2
