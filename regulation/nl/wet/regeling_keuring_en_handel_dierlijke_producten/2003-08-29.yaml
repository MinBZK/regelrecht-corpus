  - number: 2.23l
    text: |-
      1 De Minister trekt een erkenning als bedoeld in [artikel 2.23g][ref1] in indien niet aan artikel 13, eerste lid,
      aanhef en onderdeel b, van [richtlijn 97/78/EG](31997L0078) wordt voldaan.

      2 Het eerste lid is van overeenkomstige toepassing indien niet wordt voldaan aan de [artikelen 2.23i][ref2] tot
      en met [2.23k][ref3] of aan de overige voorschriften die op grond van deze regeling van toepassing zijn op de in
      [artikel 2.23g, eerste lid][ref4], bedoelde producten.


