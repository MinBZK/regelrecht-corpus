  - number: '4.13'
    text: |-
      1 Een partij vers vlees van pluimvee die via Nederland voor het eerst op het grondgebied van de Europese
      Gemeenschap wordt gebracht en die is bestemd voor Nederland of een lid-staat, is verzonden vanuit een derde land of
      gedeelte van een derde land waaruit het op het grondgebied van de Europese Gemeenschap brengen van vers vlees van
      pluimvee is toegestaan ingevolge:

      a. bijlage I van beschikking 94/984/EG, indien het vers vlees van pluimvee als bedoeld in [richtlijn 71/118/EEG]
      (31971L0118) betreft, dan wel

      b. beschikking 97/217/EG, indien het vlees van gekweekt vederwild betreft, met dien verstande dat vlees van
      gekweekte loopvogels ook afkomstig mag zijn uit Namibië, Zimbabwe of Zuid-Afrika.

      2 Een partij vers vlees van pluimvee als bedoeld in het eerste lid, gaat vergezeld van:

      a. indien het vers vlees van pluimvee als bedoeld in [richtlijn 71/118/EEG](31971L0118) betreft:

      1º. een op de partij betrekking hebbend certificaat waarvan het model overeenstemt met het in bijlage I, deel 1 en,
      al naar gelang het ingevolge die beschikking voor het desbetreffende land voorgeschreven modelcertificaat, deel 2
      van beschikking 94/984/EG vastgestelde model, en

      2º. een op de partij betrekking hebbende verklaring waarvan het model overeenstemt met het in bijlage I van
      beschikking 96/712/EG vastgestelde model, dan wel

      b. indien het vlees van gekweekt vederwild, niet zijnde loopvogels betreft, een op de partij betrekking hebbend
      gezondheidscertificaat waarvan het model overeenstemt met het voor de betrokken vleessoort uit het betrokken land
      van herkomst in beschikking 97/219/EG vastgestelde model;

      c. indien het vlees van gekweekte loopvogels betreft, een op de partij betrekking hebbend gezondheidscertificaat
      waarvan het model overeenstemt met het bij beschikking van de Commissie van de Europese Gemeenschappen op grond van
      artikel 12, tweede lid, van [richtlijn 91/494/EEG](31991L0494) en artikel 10, tweede lid, van [richtlijn 92/118/
      EEG](31992L0118) vastgestelde model dan wel, zolang een dergelijke beschikking niet is vastgesteld en in werking
      getreden, een door de officiële dierenarts van het land van verzending ondertekend gezondheidscertificaat dat
      voldoet aan de voorschriften van artikel 12, eerste lid, onderdelen a tot en met f, van [richtlijn 91/494/EEG]
      (31991L0494) en dat is voorzien van een verklaring waaruit blijkt dat:

      1º. het vlees is verkregen overeenkomstig [richtlijn 71/118/EEG](31971L0118) of 91/495/EEG;

      2º. het vlees afkomstig is uit een inrichting die voldoet aan [richtlijn 71/118/EEG](31971L0118) of 91/495/EEG, en

      3º. voorzover het vlees afkomstig is uit Afrika of Azië, ten aanzien van het vlees en de loopvogels waarvan het
      vlees is vervaardigd is voldaan aan bijlage I van beschikking 96/659/EG.

      3 3. Een partij vers vlees van pluimvee is afkomstig uit een inrichting die, zodra deze is vastgesteld en in
      werking getreden, voorkomt op de voor vers vlees van pluimvee als bedoeld in [richtlijn 71/118/EEG](31971L0118),
      onderscheidenlijk van gekweekt vederwild uit het betrokken land van herkomst geldende voorlopige lijst van
      inrichtingen als bedoeld in beschikking 95/408/EG, die alsdan ter inzage ligt in de bibliotheek van het Ministerie
      van Landbouw, Natuurbeheer en Visserij in Den Haag, met dien verstande dat indien bij de vaststelling van
      voornoemde lijst is voorzien in overgangsbepalingen het vlees met inachtneming van die bepalingen afkomstig mag
      zijn uit een inrichting die voldoet aan [richtlijn 71/118/EEG](31971L0118), onderscheidenlijk 91/495/EEG.

      4 Een partij vers vlees van pluimvee als bedoeld in [richtlijn 71/118/EEG](31971L0118) is voorzien van een keurmerk
      als bedoeld in en overeenkomstig bijlage II van beschikking 96/712/EG.

      5 Een partij vers vlees van pluimvee als bedoeld in het eerste lid is op hygiënische wijze verpakt en wordt op
      hygiënische wijze vervoerd overeenkomstig [artikel 4.4, eerste lid, onderdeel f, onderscheidenlijk g][ref1], en
      vertoont geen tekenen van bederf of ondeugdelijkheid.

      6 Een partij vers vlees van pluimvee voldoet aan de voorschriften vermeld op het gezondheidscertificaat,
      onderscheidenlijk de verklaring, bedoeld in het tweede lid, met dien verstande dat ook een partij vlees van
      loopvogels is voorzien van een officieel keurmerk waaruit blijkt in welk slachthuis de loopvogels waarvan het vlees
      afkomstig is zijn geslacht, dan wel in welke uitsnijderij het vlees is uitgesneden.

      7) Aan het pluimvee waarvan het vlees afkomstig is, zijn geen stoffen of producten toegediend die ingevolge artikel
      3, onderdeel a, van [richtlijn 96/22/EG](31996L0022) niet aan pluimvee mogen worden toegediend, tenzij aan de
      voorwaarden ingevolge artikel 11 van genoemde richtlijn is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel4.4
