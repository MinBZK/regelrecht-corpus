  - number: '10.6'
    text: |-
      1 Vleesbereidingen:

      a. zijn overeenkomstig hoofdstuk IV, onderdelen a en c, van bijlage I van [richtlijn 94/65/EG](31994L0065) bereid
      uit:

      1º. vers vlees van pluimvee, gekweekt of vrij vederwild, niet zijnde separatorvlees, dat overeenkomstig de
      [artikelen 4.4][ref1] tot en met [4.11][ref2] in de handel is gebracht, dan wel overeenkomstig afdeling 4 of 5 van
      [hoofdstuk 4][ref3] in Nederland is gebracht;

      2º. vers vlees van klein vrij wild, niet zijnde separatorvlees, dat overeenkomstig de
      [artikelen 5.5 tot en met 5.8][ref4] in de handel is gebracht, dan wel overeenkomstig afdeling 4 of 5 van
      [hoofdstuk 5][ref5] in Nederland is gebracht, dan wel

      3º. vlees van gekweekte konijnen of hazen, niet zijnde separatorvlees, dat overeenkomstig de
      [Regeling keuring en handelsverkeer konijne- en hazevlees 1993][ref6] in de handel is gebracht, dan wel
      overeenkomstig de [Regeling invoer konijne- en hazevlees 1993][ref7] in Nederland is gebracht;

      b. zijn niet behandeld met ioniserende straling;

      c. zijn bereid in een op grond van [artikel 10.13][ref8] erkende of erkend geachte werkplaats;

      d. zijn overeenkomstig hoofdstuk VII van bijlage I van [richtlijn 94/65/EG](31994L0065) voorzien van een
      onmiddellijke en een eindverpakking;

      e. zijn of worden overeenkomstig de punten 2 en 3 van hoofdstuk VIII van bijlage I van [richtlijn 94/65/EG]
      (31994L0065) opgeslagen;

      f. zijn of worden op voldoende hygiënische wijze vervoerd.

      2 In afwijking van het eerste lid, onderdeel a, mogen vleesbereidingen zijn bereid van separatorvlees, mits zij
      zijn bestemd voor een derde land.

      3 Voor zover aan vleesbereidingen additieven worden toegevoegd, wordt voldaan aan het Additievenbesluit
      ([Warenwet][ref9]).


