        afdeling: '6'
  - number: '12.8'
    text: |-
      In afwijking van hetgeen in deze regeling is bepaald omtrent het aanbrengen van het merk met de letters
      ‘GOEDGEKEURD’, is het in bedrijven waar op de datum van inwerkingtreding van deze regeling gebruik werd gemaakt
      van het merk met de letters ‘GEZIEN’, tot één jaar na bedoelde datum toegestaan van laatstgenoemd merk gebruik te
      blijven maken, met inachtneming evenwel van de voorschriften die ten aanzien van het in deze regeling genoemde merk
      met de letters ‘GOEDGEKEURD’ zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel12.8
  - number: '12.9'
    text: |-
      1 Een wijziging van een in deze regeling genoemde richtlijn of beschikking treedt voor de toepassing van de
      artikelen waarin naar die richtlijn, onderscheidenlijk beschikking is verwezen, in werking met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijn, onderscheidenlijk wijzigingsbeschikking uitvoering moet zijn gegeven,
      tenzij, in geval van een wijzigingsrichtlijn, bij ministerieel besluit dat in de Staatscourant wordt bekendgemaakt,
      een ander tijdstip wordt vastgesteld.

      2 De minister doet van een wijziging van een richtlijn als bedoeld in het eerste lid mededeling in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel12.9
  - number: 12.9a
    text: |-
      Deze regeling berust mede op de [artikelen 68][ref1], [70][ref2] en [71 van de Veewet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0001900#Artikel71
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel12.9a
