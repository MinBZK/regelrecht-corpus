  - number: '2.15'
    text: |-
      1 Indien wordt vermoed of geconstateerd dat in de partij verwekkers van ziekten, zoönosen of andere aandoeningen,
      bedoeld in artikel 7, eerste lid, onderdeel a, van [richtlijn 89/662/EEG](31989L0662), aanwezig zijn of dat de
      producten afkomstig zijn uit een met een epidemische dierziekte besmet gebied kan de minister, indien hij de
      aanwezigheid van verwekkers van ziekten, zoönosen of andere aandoeningen vermoedt, gelasten dat de producten voor
      rekening van de verzender of diens gemachtigde, dan wel de afnemer, in tijdelijke afzondering worden geplaatst, dan
      wel worden, zonder vergoeding van Staatswege:

      a. en voor rekening van de verzender of diens gemachtigde, al naar gelang de minister daaromtrent heeft besloten en
      met inachtneming van diens aanwijzingen, de producten vernietigd, of

      b. voor rekening van de afnemer, al naar gelang de minister daaromtrent heeft besloten en met inachtneming van
      diens aanwijzingen, de producten voor andere doeleinden gebruikt dan waarvoor ze zijn bestemd.

      2 Het eerste lid geldt, behalve voor zover het betreft verwekkers van ziekten, zoönosen of andere aandoeningen,
      die een ernstig gevaar voor de mens kunnen opleveren, niet, indien de producten één van de behandelingen hebben
      ondergaan als bedoeld in artikel 4, eerste lid, van [richtlijn 80/215/EEG](31980L0215).

      3 Onverminderd het eerste lid en tenzij in deze regeling anders is bepaald worden, indien wordt vermoed of
      geconstateerd dat niet wordt voldaan aan de onderhavige regeling, zonder vergoeding van Staatswege en voor rekening
      van de verzender of diens gemachtigde, al naar gelang de minister daaromtrent heeft besloten en met inachtneming
      van diens aanwijzingen, de producten in tijdelijke afzondering geplaatst, indien de minister vermoedt dat niet
      wordt voldaan aan de onderhavige regeling, dan wel vernietigd of voor andere doeleinden gebruikt dan waarvoor ze
      zijn bestemd, bijvoorbeeld door terugzending met toestemming van de bevoegde veterinaire autoriteit van het land
      van oorsprong.

      4 Tenzij hygiënische of veterinairrechtelijke voorschriften zich hiertegen verzetten, laat de minister de keuze
      tussen de in het derde lid bedoelde maatregelen aan de verzender of diens gemachtigde.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel2.15
  - number: '2.23'
    text: |-
      Degene die voornemens is een partij in te slaan in of uit te slaan uit een douane-entrepot, een ruimte voor
      tijdelijke opslag of een vrij entrepot geeft hiervan uiterlijk tot 14.00 uur op de werkdag voorafgaand aan de dag
      van in- of uitslag melding aan de VWA, onder vermelding van de naam en het adres van de opslagfaciliteit, de dag
      van in- of uitslag en de aard en hoeveelheid van de producten.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel2.23
  - number: 2.23a
    text: |-
      1 Een partij die bestemd is:

      a. voor Nederland of een derde land en die voldoet aan de in deze regeling voor het desbetreffende product gestelde
      voorschriften voor het brengen op Nederlands grondgebied, of

      b. voor een lidstaat en die voldoet aan de voorschriften ter zake van het brengen van het desbetreffend
      product op het grondgebied van een desbetreffende lidstaat, wordt slechts in een op grond van
      [artikel 2.23c, eerste lid][ref1], erkend douane- entrepot of erkend vrij entrepot opgeslagen indien in dat
      entrepot de in dit artikellid bedoelde producten gescheiden van de in het tweede lid bedoelde producten kunnen
      worden opgeslagen.

      2 Opslag van een partij die bestemd is voor een derde land of van producten die bestemd zijn om aan
      zeevervoermiddelen te worden geleverd als proviand voor bemanning en passagiers vindt, indien de partij
      onderscheidenlijk de producten niet voldoen aan de in deze regeling voor het desbetreffende product
      gestelde voorschriften voor het brengen op Nederlands grondgebied, slechts plaats in een op grond van
      [artikel 2.23c, eerste lid][ref2], erkend douane-entrepot of erkend vrij entrepot.

      3 De in het eerste en tweede lid bedoelde opslag vindt slechts plaats indien de belanghebbende bij de lading
      voorafgaand aan de opslag heeft voldaan aan artikel 12, eerste lid, eerste zin, van [richtlijn 97/78/EG]
      (31997L0078), met dien verstande dat de bevoegde autoriteit, bedoeld in artikel 12, eerste lid, eerste zin, van
      [richtlijn 97/78/EG](31997L0078) de minister, tweede lid, is.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23c
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23c
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel2.23a
