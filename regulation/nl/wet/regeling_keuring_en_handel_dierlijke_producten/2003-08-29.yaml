  - number: '2.13'
    text: |-
      1 Op grond van de regelgeving van de Europese Gemeenschap zijn geen maatregelen genomen, houdende de instelling
      van een verbod om de producten uit de betrokken lid-staat uit te voeren of houdende de machtiging tot instelling
      van een verbod om de betreffende producten in Nederland te brengen, noch is de lid-staat van verzending ingevolge
      deze regelgeving gehouden de afgifte van de certificaten of vervoersdocumenten, zulks in verband met het brengen in
      Nederland, op te schorten.

      2 Ingevolge de regelgeving van de lid-staat van verzending is er geen verbod om de betrokken partij op het
      grondgebied van die lid-staat in de handel te brengen.

      3 Ten aanzien van de partij is, in voorkomend geval, voldaan aan de ingevolge artikel 9 van [richtlijn 89/662/EEG]
      (31989L0662) vastgestelde regelgeving van de Europese Gemeenschap of van de lid-staat van verzending zelf, in geval
      van een uitbraak van een epidemische dierziekte in de lid-staat van verzending.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel2.13
  - number: '2.14'
    text: |-
      1 Indien uit de certificaten of documenten, bedoeld in [artikel 2.9, eerste lid, onderdeel b][ref1], blijkt dat de
      een uit een derde land afkomstige partij bestemd is voor een derde land, geschiedt het vervoer onder douanetoezicht
      tot op de plaats waar het Nederlands grondgebied wordt verlaten in verzegelde voertuigen of verzegelde containers
      en zonder splitsing of, tenzij de partij overeenkomstig het tweede lid wordt opgeslagen, lossing van de partij.

      2 Op de in het eerste lid bedoelde partij zijn de [artikelen 2.23][ref2], [2.23a][ref3], [2.23c][ref4]
      en [2.23 e][ref5] van overeenkomstige toepassing, met dien verstande dat het certificaat, bedoeld in
      [artikel 2.23c, tweede lid, onderdeel a][ref6], respectievelijk 2.23c, vierde lid, voor de toepassing van dit
      artikellid een certificaat is als bedoeld in artikel 5, eerste lid, van [richtlijn 97/78/EG](31997L0078) en dat
      opslag in een van de in [artikel 2.23][ref7] genoemde opslagruimten is toegestaan, mits elders geen opslag heeft
      plaatsgevonden.


