  - number: '2.25'
    text: |-
      1 Het onderzoek, bedoeld in [artikel 2.3][ref1], geschiedt overeenkomstig hetgeen daaromtrent is bepaald in het
      voor het desbetreffende product van toepassing zijnde hoofdstuk.

      2 De keuringsdierenarts verricht zijn taken in het kader van afdeling 4 overeenkomstig hetgeen daaromtrent is
      bepaald bij of krachtens [richtlijn 97/78/EG](31997L0078).


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel2.25
