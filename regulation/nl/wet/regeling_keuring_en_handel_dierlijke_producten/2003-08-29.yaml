  - number: '1.2'
    text: |-
      1 De minister kan van het bepaalde in deze regeling vrijstelling of ontheffing verlenen.

      2 Aan een vrijstelling of ontheffing kunnen voorschriften of voorwaarden worden verbonden. Zij kunnen onder
      beperkingen worden verleend. Zij kunnen te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel1.2
  - number: '2.2'
    text: |-
      1 Het verbod, bedoeld in artikel 2.1, eerste lid, geldt niet indien het overige dierlijke producten betreft, anders
      dan die genoemd in [artikel 11.2][ref1] die zijn bestemd voor een lid-staat of Noorwegen met inachtneming evenwel
      van [artikel 2.6][ref2], en evenmin indien het handelsmonsters betreft die zijn bestemd voor een derde land, niet
      zijnde Noorwegen.

      2 Het verbod, bedoeld in artikel 2.1, eerste lid, alsmede het verbod, bedoeld in [artikel 68 van de Veewet][ref3],
      gelden niet, behalve indien het gehakt vlees van andere dieren dan runderen, varkens, schapen of geiten,
      vleesbereidingen van vlees van eenhoevigen, dan wel separatorvlees als bedoeld in [artikel 4.1][ref4] betreft, ten
      aanzien van producten indien zij, voor zover zij zijn bestemd voor een lid-staat of Noorwegen, vergezeld gaan van
      het bewijsstuk, onderscheidenlijk de bewijsstukken en zijn voorzien van het merk, genoemd of bedoeld in:

      a. [artikel 4.2][ref5], indien het vers vlees van pluimvee betreft;

      b. [artikel 5.2][ref6], indien het vlees van vrij wild betreft, en, voor wat betreft de bewijsstukken,
      [artikel 5.3][ref7], indien het gehele stukken vrij wild betreft;

      c. [artikel 9.2, eerste en derde lid][ref8], indien het gehakt vlees van runderen, varkens, schapen of geiten
      betreft;

      d. [artikel 10.2, eerste en derde lid][ref9], indien het vleesbereidingen betreft, met uitzondering van
      vleesbereidingen van vlees van eenhoevigen;

      e. voor wat betreft de bewijsstukken, [artikel 11.2][ref10], indien het in dat artikel genoemde overige dierlijke
      producten betreft.

      3 Het verbod, bedoeld in artikel 2.1, eerste lid, geldt niet ten aanzien van producten indien zij:

      a. voor zover zij zijn bestemd voor een derde land, niet zijnde Noorwegen, zijn voorzien van het merk, genoemd of
      bedoeld in:

      1º. [artikel 4.2][ref11], 4.9 of 4.10, indien het vers vlees van pluimvee betreft;

      2º. [artikel 5.2][ref12] of 5.9, indien het vlees van vrij wild betreft;

      3º. de onderscheiden onderdelen van [artikel 9.2, tweede lid][ref13], al naar gelang het gehakt vlees als bedoeld
      in die onderscheiden onderdelen betreft;

      4º. de onderscheiden onderdelen van [artikel 10.2, tweede lid][ref14], al naar gelang het vleesbereidingen als
      bedoeld in die onderscheiden onderdelen betreft;

      b. voor zover zij zijn bestemd voor IJsland, bovendien zijn voorzien van het bewijsstuk, genoemd of bedoeld in:

      1º. [artikel 11.2, onderdeel g][ref15], indien het grondstoffen als bedoeld in [artikel 11.1][ref16] voor zover
      afkomstig van vis betreft, dan wel

      2º. [artikel 11.2, onderdeel l][ref17], indien het voor dierlijke voeding bestemd vismeel dan wel producten of
      mengsels daarvan betreft.

      4 Van artikel 2 van het Besluit uitvoer dieren en producten van dierlijke oorsprong wordt vrijstelling verleend,
      voor wat betreft:

      a. het voorzien zijn van gehele stukken vrij wild en overige dierlijke producten die zijn bestemd voor een lid-
      staat of een derde land, van een of meer merken;

      b. het voorzien zijn van gehakt vlees of vleesbereidingen die zijn bestemd voor een derde land, van een of meer
      bewijsstukken;

      c. het voorzien zijn van producten die zijn bestemd voor een derde land, van een of meer bewijsstukken, tenzij het
      bewijsstuk voor IJsland betreft, bedoeld in het derde lid, onderdeel b, en

      d. het voorzien zijn van vers vlees van pluimvee van een of meer merken die zijn aangebracht op grond van een van
      Rijkswege ingesteld onderzoek, indien het vlees betreft dat is verkregen overeenkomstig en voldoet aan punt 49 van
      hoofdstuk VIII van bijlage I van [richtlijn 71/118/EEG](31971L0118).

      5 De bewijsstukken zijn volledig ingevuld, gedagtekend en ondertekend, terwijl de geldigheidsduur ervan niet is
      verstreken, en zijn, voor zover van toepassing, in overeenstemming met de regelgeving van de Europese Gemeenschap
      opgesteld en afgegeven.

      6 De in het tweede tot en met vijfde lid bedoelde bewijsstukken worden afgegeven door de minister.

      7 Het verbod, bedoeld in artikel 2.1, eerste lid, alsmede het verbod, bedoeld in [artikel 68 van de Veewet][ref18],
      zijn niet van toepassing op het anders dan in doorvoer buiten Nederland brengen van producten die, met inachtneming
      evenwel van [artikel 2.6][ref19];

      a. in kleine hoeveelheden in de persoonlijke bagage van reizigers voor eigen gebruik worden vervoerd;

      b. zonder enig handelskarakter in kleine zendingen aan particulieren worden toegestuurd;

      c. zich als proviand voor personeel en passagiers bevinden in grensoverschrijdende vervoermiddelen.


