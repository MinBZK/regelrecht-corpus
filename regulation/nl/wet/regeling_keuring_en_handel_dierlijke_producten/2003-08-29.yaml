      certificering voor de invoer van vlees van gekweekt wild en konijnenvlees uit derde landen (PbEG L 88);



              beschikking 97/220/EG:

                beschikking van de Commissie van de Europese Gemeenschappen van 28 februari 1997 tot vaststelling
      van de veterinairrechtelijke voorschriften, de gezondheidsvoorschriften en de voorschriften inzake veterinaire
      certificering voor de invoer van vlees van wilde varkens uit derde landen (PbEG L 88);



              beschikking 97/296/EG:

                beschikking van de Commissie van de Europese Gemeenschappen van 22 april 1997 tot vaststelling van de
      lijst van derde landen waaruit invoer van visserijproducten voor menselijke consumptie is toegestaan (PbEG L 122);



               beschikking 97/735/EG:

                beschikking (EG) nr. 97/735 van de Commissie van de Europese Unie van 21 oktober 1997 tot vaststelling
