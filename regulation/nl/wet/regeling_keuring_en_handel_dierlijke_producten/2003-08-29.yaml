  - number: 2.8b
    text: |-
      1 Van het verbod bedoeld in artikel 2.1, tweede lid, wordt, met inachtneming van [artikel 2.13][ref1], vrijstelling
      verleend voor het door een producent van dierlijke meststoffen in Nederland brengen van onverwerkte dierlijke
      mest om daar voor eigen gebruik te worden aangewend, mits de producent dan wel diens gemachtigde door middel van
      een door de bevoegde autoriteiten van het land van verzending verstrekt en gewaarmerkt formulier, dat tevens is
      gewaarmerkt door het Bureau Heffingen, tijdens het vervoer kan aantonen dat de grond in Nederland is aan te merken
      als tot het bedrijf van herkomst van de mest behorende, in een grensgebied gelegen grond die door het bedrijf
      feitelijk wordt gebruikt voor de landbouwkundige exploitatie.

      2 Een formulier als bedoeld in het tweede lid wordt door het Bureau Heffingen gewaarmerkt nadat het is gewaarmerkt
      door de autoriteiten van het land van verzending.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.13
