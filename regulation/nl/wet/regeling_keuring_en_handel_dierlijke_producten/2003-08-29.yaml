  - number: '4.8'
    text: |-
      1 Vers vlees van pluimvee is niet afkomstig van pluimvee dat is besmet met aviaire influenza of de ziekte van
      Newcastle.

      2 Onverminderd het eerste lid, is vers vlees van pluimvee dat is bestemd voor een lid-staat afkomstig van pluimvee
      dat:

      a. sedert de uitkomst op het grondgebied van de Europese Gemeenschap heeft verbleven of overeenkomstig afdeling
      4 van hoofdstuk 6 van de Regeling handel levende dieren en levende produkten uit een derde land in Nederland is
      gebracht;

      b. afkomstig is van een bedrijf ten aanzien waarvan geen veterinairrechtelijke maatregelen met betrekking tot
      een pluimveeziekte zijn getroffen, en dat niet is gelegen in een gebied waarvoor in verband met het optreden van
      een besmettingshaard van een ziekte waarvoor het pluimvee vatbaar is, om veterinairrechtelijke redenen ingevolge
      de regelgeving van de Europese Gemeenschap maatregelen zijn getroffen waarbij controles van vlees van pluimvee
      noodzakelijk zijn;

      c. tijdens het vervoer naar het slachthuis niet in contact is gekomen met pluimvee dat met aviaire influenza of met
      de ziekte van Newcastle is besmet;

      d. is geslacht in een slachthuis waar op het ogenblik van slachten geen enkel geval van aviaire influenza of de
      ziekte van Newcastle is geconstateerd.

      3 Vlees dat ervan wordt verdacht in de inrichting of tijdens het vervoer met één van de in het eerste lid genoemde
      ziekten besmet te zijn en dat is bestemd voor een lid-staat, wordt uit het handelsverkeer verwijderd.

      4 Onverminderd het eerste, tweede en derde lid heeft vers vlees van pluimvee, bestemd voor Finland en Zweden, in
      de krachtens [artikel 4.16][ref1] erkende inrichting van oorsprong een steekproefsgewijze microbiologische test op
      de aanwezigheid van salmonella ondergaan overeenkomstig de door de Raad van de Europese Unie krachtens artikel 5,
      derde lid, onderdeel a, van [richtlijn 71/118/EEG](31971L0118) vastgestelde bepalingen, waarbij de afwezigheid van
      salmonella in dat vlees is aangetoond.

      5 Het vierde lid is niet van toepassing op vers vlees dat afkomstig is uit een inrichting waarvoor een programma
      geldt dat door de Raad van de Europese Unie, dan wel door de Commissie van de Europese Gemeenschappen op grond
      van artikel 5, derde lid, onderdeel b, van [richtlijn 71/118/EEG](31971L0118), is erkend als gelijkwaardig aan het
      door de Commissie van de Europese Gemeenschappen op grond van artikel 5, vierde lid, van die richtlijn goedgekeurde
      operationele programma van Finland, onderscheidenlijk Zweden inzake salmonella.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel4.16
