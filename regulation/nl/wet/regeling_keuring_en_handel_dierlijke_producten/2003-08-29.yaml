  - number: '4.15'
    text: |-
      Onverminderd de [artikelen 4.13][ref1] en [4.14][ref2] is, zolang de voorschriften voor het op het grondgebied
      van de Europese Gemeenschap brengen van vers vlees van pluimvee vanuit derde landen niet of slechts gedeeltelijk
      ingevolge de regelgeving van de Europese Gemeenschap zijn vastgesteld, het brengen in Nederland van vers vlees van
      pluimvee dat via Nederland voor het eerst op het grondgebied van de Europese Gemeenschap wordt gebracht en dat is
      bestemd voor een lid-staat, toegestaan indien is voldaan aan de voorschriften van de lid-staat van bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel4.13
