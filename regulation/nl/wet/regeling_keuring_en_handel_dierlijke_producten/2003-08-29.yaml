  - number: '2.4'
    text: |-
      Indien de producten naar meer dan één bestemming worden vervoerd gaat elke partij vergezeld van het bewijsstuk,
      onderscheidenlijk de bewijsstukken, bedoeld in [artikel 2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '2.2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '2.5'
    text: |-
      Indien de partij bestemd is voor een derde land vindt het vervoer over Nederlands grondgebied plaats onder
      douanetoezicht.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel2.5
  - number: '2.6'
    text: |-
      Op grond van de regelgeving van de Europese Gemeenschap of de Toezichthoudende Autoriteit van de Europese
      Vrijhandelsassociatie geldt geen verbod om de producten anders dan in doorvoer buiten Nederland te brengen of uit
      te voeren.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel2.6
  - number: '2.7'
    text: |-
      Ten behoeve van het onderzoek of een merk als bedoeld in [artikel 2.2][ref1] kan worden aangebracht,
      onderscheidenlijk een bewijsstuk als bedoeld in [artikel 2.2][ref2] kan worden afgegeven, overlegt de aanvrager
      tijdig een daartoe bestemd, op de betrokken partij betrekking hebbend, aanvraagformulier aan de keuringsdierenarts
      die dit onderzoek verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel2.7
