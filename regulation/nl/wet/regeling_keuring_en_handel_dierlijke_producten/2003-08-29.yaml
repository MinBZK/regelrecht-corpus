      - id: ref2
        bwb_id: BWBR0005662
  - number: '10.18'
    text: |-
      1 Dit hoofdstuk is, met uitzondering van [artikel 10.6, onderdeel a][ref1], niet van toepassing op het in de handel
      brengen vleesbereidingen die zijn bestemd voor gebruik als bedoeld in artikel 3, onderdeel III, van [richtlijn
      71/118/EEG](31971L0118).

      2 Afdeling 3 is niet van toepassing op het in de handel brengen van vleesbereidingen die in detailhandelszaken of
      aan verkooppunten grenzende werkplaatsen worden vervaardigd, teneinde aldaar rechtstreeks aan de eindverbruiker te
      worden verkocht.

      3 In gevallen als bedoeld in het tweede lid zijn de voorschriften voor het uitoefenen van de detailhandel van
      toepassing.


