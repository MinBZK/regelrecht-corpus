  - number: '5.4'
    text: |-
      1 Het in de handel brengen van vlees van vrij wild en gehele stukken vrij wild is verboden.

      2 Het in het eerste lid bedoelde verbod geldt niet indien:

      a. voor wat betreft vlees van vrij wild is voldaan aan de [artikelen 5.5][ref1] en
      [5.7, eerste en tweede lid][ref2], alsmede, indien het vlees is bestemd voor Nederland, aan
      [artikel 5.8, eerste, tweede en derde lid][ref3];

      b. voor wat betreft gehele stukken vrij wild is voldaan aan de [artikelen 5.6][ref4] en [5.7, tweede lid][ref5],
      alsmede, indien de gehele stukken zijn bestemd voor Nederland, aan [artikel 5.8, vierde lid][ref6].


