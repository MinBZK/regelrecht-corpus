  - number: '4.9'
    text: |-
      1 Vers vlees dat afkomstig is van pluimvee dat niet voldoet aan
      [artikel 4.8, tweede lid, onderdelen a, b, c en d][ref1], mag worden voorzien van het keurmerk, bedoeld in
      [artikel 4.2, eerste lid][ref2], mits op dit keurmerk onmiddellijk een kruis wordt aangebracht, dat bestaat uit
      twee elkaar loodrecht snijdende lijnen waarvan het snijpunt samenvalt met het centrum van het keurmerk, en dat de
      gegevens van het keurmerk leesbaar laat, en mits het vlees uitsluitend wordt bestemd voor de Nederlandse markt of
      een derde land.

      2 Vers vlees van pluimvee voorzien van het keurmerk, bedoeld in het eerste lid, wordt slechts in de handel gebracht
      indien het op een andere plaats of op andere tijdstippen is verkregen, uitgesneden, vervoerd en opgeslagen dan
      vlees van pluimvee dat is bestemd voor een lid-Staat, en op zodanige wijze wordt gebruikt dat het niet terecht
      komt in vleesprodukten die zijn bestemd voor een lid-staat, tenzij het vlees is behandeld overeenkomstig artikel 4,
      eerste lid, van [richtlijn 80/215/EEG](31980L0215).

      3 In afwijking van het eerste en tweede lid mag vers vlees van pluimvee in geval van een epizoötie van de ziekte
      van Newcastle worden voorzien van het keurmerk, bedoeld in [artikel 4.2, eerste lid][ref3], indien het vlees
      afkomstig is van pluimvee dat voldoet aan artikel 5, derde lid, onderdelen a tot en met e, van [richtlijn 91/494/
      EEG](31991L0494).


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel4.8
