  - number: '5.14'
    text: |-
      1 De exploitant of de eigenaar, dan wel diens vertegenwoordiger van een op grond van [artikel 5.13][ref1] erkende
      vrij-wildverwerkingsinrichting draagt er zorg voor dat in de vrij-wildverwerkingsinrichting de voorschriften van
      de hoofdstukken II, III, IV, VIII en X van bijlage I van [richtlijn 92/45/EEG](31992L0045) worden nageleefd en dat
      aan de overige keurings- en hygiënevoorschriften van [richtlijn 92/45/EEG](31992L0045), voor zover van toepassing,
      wordt voldaan; hierbij verleent hij de keuringsdierenarts alle medewerking die deze redelijkerwijs voor de
      vervulling van zijn taken noodzakelijk acht.

      2 Het eerste lid is van overeenkomstige toepassing op de exploitant of de eigenaar, dan wel diens
      vertegenwoordiger van een vrij-wildverwerkingsinrichting waaraan ontheffing is verleend als bedoeld in
      [artikel 12.6, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel5.13
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel12.6
