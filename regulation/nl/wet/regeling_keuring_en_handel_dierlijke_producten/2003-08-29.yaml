  - number: '11.11'
    text: |-
      1 Zolang een in [artikel 11.8][ref1] bedoeld bewijsstuk voor een bepaalde produktsoort nog niet ingevolge
      de regelgeving van de Europese Gemeenschappen is vastgesteld en in werking getreden, gaat een partij van die
      produkten die is bestemd voor Nederland, onverminderd de overige ten aanzien van het desbetreffende produkt in
      [artikel 11.8][ref2] opgenomen voorschriften en tenzij in dat artikel anders is bepaald, vergezeld van een document
      waaruit de oorsprong en bestemming van het produkt blijkt.

      2 Zolang een in [artikel 11.8][ref3] bedoeld bewijsstuk voor een bepaalde produktsoort wel ingevolge de regelgeving
      van de Europese Gemeenschappen is vastgesteld maar deze regelgeving nog niet in werking is getreden, mag, in plaats
      van het in [artikel 11.8][ref4] bedoelde bewijsstuk, tot de datum van inwerkingtreding van voornoemde regelgeving,
      onverminderd de overige ten aanzien van het desbetreffende produkt in [artikel 11.8][ref5] opgenomen voorschriften
      en tenzij in [artikel 11.8][ref6] anders is bepaald, indien bestemd voor Nederland:

      a. een partij beenderen, hoornen of hoeven, dan wel een partij produkten uit beenderen, hoorn of hoeven, niet
      bestemd voor menselijke of dierlijke voeding, vergezeld gaan van, in voorkomend geval, een certificaat waarvan het
      model overeenstemt met het model, opgenomen in bijlage B, onderscheidenlijk C van deze regeling;

      b. een partij verwerkte dierlijke eiwitten als bedoeld in [artikel 11.8, vijfde lid][ref7], vergezeld gaan van een
      certificaat waarvan het model overeenstemt met het model opgenomen in bijlage D van deze regeling;

      c. een partij onbehandeld haar van varkens als bedoeld in [artikel 11.8, tiende lid][ref8], vergezeld gaan van
      een certificaat waaruit blijkt dat de partij afkomstig is uit een land of gedeelte van een land dat ten minste
      gedurende de laatste twaalf maanden vrij is van Afrikaanse varkenspest;

      d. een partij haar van varkens als bedoeld in [artikel 11.8, tiende lid][ref9], dat een behandeling als bedoeld in
      onderdeel 2 van hoofdstuk 15 van bijlage I van [richtlijn 92/118/EEG](31992L0118) heeft ondergaan, vergezeld gaan
      van een certificaat waaruit blijkt welke behandeling het haar heeft ondergaan, en

      e. een partij overige dierlijke produkten genoemd in [artikel 11.8][ref10], anders dan de produkten genoemd in
      de onderdelen a tot en met d, vergezeld gaan van een bij die partij behorend document, waaruit de oosprong en
      bestemming van de partij blijkt.

      3 Zolang het in [artikel 11.9, tweede lid][ref11], bedoelde gezondheidscertificaat voor de in dat artikel bedoelde
      grondstoffen, niet zijnde grondstoffen als bedoeld in [artikel 11.9, derde, vierde of vijfde lid][ref12], niet
      ingevolge de regelgeving van de Europese Gemeenschap is vastgesteld, gaat een partij van deze produkten die is
      bestemd voor Nederland, vergezeld van een gezondheidscertificaat waarvan het model overeenstemt met het model
      opgenomen in bijlage E van deze regeling.

      4 Zolang het in [artikel 11.9, tweede lid][ref13], bedoelde gezondheidscertificaat voor de in dat artikel
      bedoelde grondstoffen, niet zijnde grondstoffen als bedoeld in [artikel 11.9, derde, vierde of vijfde lid][ref14],
      wel ingevolge de regelgeving van de Europese Gemeenschap is vastgesteld, maar deze regelgeving nog niet in
      werking is getreden, mag een partij van deze produkten die is bestemd voor Nederland, in plaats van het in
      [artikel 11.9, tweede lid][ref15], bedoelde gezondheidscertificaat, tot de datum van inwerkingtreding van
      voornoemde regelgeving vergezeld gaan van een gezondheidscertificaat waarvan het model overeenstemt met het model
      opgenomen in bijlage E van deze regeling.


