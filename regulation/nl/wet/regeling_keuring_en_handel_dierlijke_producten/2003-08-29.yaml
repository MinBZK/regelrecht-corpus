  - number: '4.19'
    text: |-
      1 De exploitant of de eigenaar, dan wel diens vertegenwoordiger van een op grond van [artikel 4.16][ref1]
      erkende inrichting zet, in samenwerking met de keuringsdierenarts, een opleidingsprogramma op dat het personeel
      van de inrichting in staat stelt te voldoen aan, voorzover van toepassing, de voorschriften bedoeld in
      [artikel 4.17][ref2].

      2 De exploitant, de eigenaar, dan wel diens vertegenwoordiger van een op grond van [artikel 4.16][ref3], erkende
      inrichting verricht de controles, bedoeld in artikel 6, tweede lid, van [richtlijn 71/118/EEG](31971L0118), en
      is desverzocht in staat de keuringsdierenarts of de veterinaire deskundigen van de Europese Commissie in kennis
      te stellen van aard, frequentie en resultaat van de verrichte controles, alsmede, zo nodig, van de naam van het
      controlelaboratorium, met dien verstande dat de exploitant, de eigenaar, dan wel diens vertegenwoordiger van een
      op grond van [artikel 4.16, eerste lid][ref4], erkende inrichting de algemene hygiëne bij de productie, bedoeld in
      artikel 6, tweede lid, van [richtlijn 71/118/EEG](31971L0118), controleert door het uitwerken en toepassen van een
      permanente procedure overeenkomstig artikel 1 van beschikking 2001/471/EG.

      3 Voor de toepassing van artikel 1, tweede lid, van beschikking 2001/471/EG kan, voorzover van toepassing, de
      exploitant, eigenaar of vertegenwoordiger gebruik maken van de aanvulling op de hygiënecodes voor slachterijen en
      uitsnijderijen van de Productschappen voor Vee, Vlees en Eieren van 15 mei 2002 met de titel "Aanvulling werkboek
      GHP-code Pluimveeslachterijen en -uitsnijderijen beschikking 2001/471/EG".


