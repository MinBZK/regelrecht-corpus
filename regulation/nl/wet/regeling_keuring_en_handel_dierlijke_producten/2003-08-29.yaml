  - number: '10.3'
    text: |-
      1 Vleesbereidingen als bedoeld in [artikel 10.2, eerste lid][ref1]:

      a. zijn overeenkomstig hoofdstuk IV van bijlage I van [richtlijn 94/65/EG](31994L0065) bereid uit
      vers vlees, niet zijnde vlees van eenhoevigen en niet zijnde separatorvlees, dat overeenkomstig het
      [Besluit produktie en handel vers vlees][ref2], het [Besluit produktie en handel vlees van vrij wild][ref3],
      parafgraaf 9 van de [Regeling keuring en handelsverkeer konijne- en hazevlees 1993][ref4], dan wel
      [afdeling 3][ref5] van de [hoofdstukken 4][ref6] en [5][ref7] is voorzien van het keurmerk, bedoeld in bijlage
      I, hoofdstuk XI, van [richtlijn 64/433/EEG](31964L0433), bijlage I, hoofdstuk XII, van [richtlijn 71/118/EEG]
      (31971L0118), bijlage I, hoofdstuk III, van [richtlijn 91/495/EEG](31991L0495), onderscheidenlijk bijlage I,
      hoofdstuk VII, van [richtlijn 92/45/EEG](31992L0045), dan wel in Nederland is gebracht overeenkomstig het Besluit
      inzake vlees uit andere lid-staten, het Besluit invoer vlees uit derde landen, de Regeling in- en doorvoer vlees
      1979, paragraaf 3, onderscheidenlijk 4 van de [Regeling keuring en handelsverkeer konijne- en hazevlees 1993][ref8],
      de [Regeling invoer konijne- en hazevlees 1993][ref9], dan wel afdeling 4, onderscheidenlijk 5 van de
      [hoofdstukken 4][ref10] en [5][ref11];

      b. zijn niet behandeld met ioniserende stralen;

      c. zijn bereid in een op grond van [artikel 10.13, met uitzondering van het vierde lid][ref12], erkende werkplaats;

      d. zijn, voor zover zij zijn bereid uit vers vlees van varkens, overeenkomstig artikel 2 van [richtlijn 77/96/
      EEG](31977L0096) op trichinen onderzocht of hebben een koudebehandeling ondergaan als bedoeld in bijlage IV van
      die richtlijn;

      e. zijn overeenkomstig hoofdstuk VI van bijlage I van [richtlijn 94/65/EG](31994L0065) voorzien van etikettering;

      f. zijn overeenkomstig hoofdstuk VII van bijlage I van [richtlijn 94/65/EG](31994L0065) voorzien van een
      onmiddellijke en een eindverpakking;

      g. zijn of worden overeenkomstig hoofdstuk VIII, onderscheidenlijk IX van bijlage I van [richtlijn 94/65/EG]
      (31994L0065) opgeslagen en vervoerd;

      h. voldoen, voor zover van toepassing, aan artikel 5, eerste lid, onderdelen c en d, van [richtlijn 94/65/EG]
      (31994L0065).

      2 Voor zover aan vleesbereidingen als bedoeld in [artikel 10.2, eerste lid][ref13], additieven worden toegevoegd,
      wordt voldaan aan het Additievenbesluit ([Warenwet][ref14]).

      3 In afwijking van het eerste lid voldoen vleesbereidingen, voor zover zij zijn bereid van gehakt vlees van
      runderen, varkens, schapen of geiten aan [artikel 9.3, eerste lid][ref15].

      4 Vleesbereidingen als bedoeld in [artikel 10.2, eerste lid][ref16], zijn niet voor menselijke consumptie
      ongeschikt verklaard en vertonen geen tekenen van bederf of ondeugdelijkheid.

      5 Vleesbereidingen worden voor menselijke consumptie ongeschikt verklaard, indien zij gebreken vertonen of
      behandelingen hebben ondergaan als bedoeld in [artikel 4.7, tweede lid][ref17].


