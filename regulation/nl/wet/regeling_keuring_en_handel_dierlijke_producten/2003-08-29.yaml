  - number: '9.8'
    text: |-
      Gehakt vlees wordt na een van Rijkswege ingesteld onderzoek voorzien van het merk, bedoeld in:

      a. hoofdstuk XII van bijlage I van [richtlijn 71/118/EEG](31971L0118), indien het gehakt vlees van kippen,
      kalkoenen, parelhoenders, eenden, ganzen, gekweekt of vrij vederwild betreft,

      b. hoofdstuk VII van bijlage I van [richtlijn 92/45/EEG](31992L0045), indien het gehakt vlees van klein vrij wild
      betreft, dan wel

      c. hoofdstuk III van bijlage I van [richtlijn 91/495/EEG](31991L0495), indien het gehakt vlees van gekweekte
      konijnen en hazen betreft, waarop de letters "EEG" zijn vervangen door "GOEDGEKEURD", ten bewijze dat is voldaan
      aan de [artikelen 9.6][ref1] en [9.7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel9.6
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel9.7
