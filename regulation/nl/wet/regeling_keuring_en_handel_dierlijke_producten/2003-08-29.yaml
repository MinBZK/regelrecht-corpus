  - number: '11.9'
    text: |-
      1 Een partij grondstoffen bestemd voor de vervaardiging van voeder voor dieren of voor farmaceutische of technische
      produkten is afkomstig uit een derde land of gedeelte van een derde land dat voorkomt op de voor vlees van de
      desbetreffende diersoort vastgestelde lijst, opgenomen in beschikking 79/542/EEG, onderscheidenlijk beschikking
      94/85/EG, onderscheidenlijk beschikking 94/86/EG, met dien verstande dat een partij grondstoffen bestemd voor de
      farmaceutische industrie eveneens afkomstig mag zijn uit een derde land of gedeelte van een derde land dat voorkomt
      op de lijst, opgenomen in de bijlage bij beschikking 92/183/EEG.

      2 Een partij grondstoffen als bedoeld in het eerste lid gaat, zodra ter zake ingevolge de regelgeving van de
      Europese Gemeenschap een besluit is genomen, vergezeld van het gezondheidscertificaat, bedoeld in onderdeel 2
      van hoofdstuk 10 van bijlage I van [richtlijn 92/118/EEG](31992L0118), dan wel, in voorkomend geval, van het
      gezondheidscertificaat bedoeld in het derde, vierde of vijfde lid.

      3 Een partij voor de vervaardiging van voeder voor gezelschapsdieren bestemde schoongemaakte slachtafvallen als
      bedoeld in artikel 1, onderdeel c, van beschikking 93/402/EEG die afkomstig is uit een derde land of gedeelte van
      een derde land van Zuid-Amerika dat is opgenomen in bijlage I van beschikking 93/402/EEG, gaat vergezeld van:

      a. een gezondheidscertificaat overeenkomstig het model opgenomen in bijlage III van beschikking 93/402/EEG, dat
      bestaat uit een algemeen gezondheidscertificaat overeenkomstig het model opgenomen in deel 1 van die bijlage III
      en,

      b. één van de specifieke gezondheidscertificaten overeenkomstig het model opgenomen in deel 2 van bijlage III van
      beschikking 93/402/EEG, overeenkomstig hetgeen hieromtrent in bijlage II van die beschikking is bepaald.

      4 Een partij van de in bijlage II van beschikking 93/402/EEG genoemde categorieën vlees, niet bestemd
      voor menselijke consumptie en niet zijnde voor de vervaardiging van voeder voor gezelschapsdieren bestemde
      schoongemaakte slachtafvallen als bedoeld in het derde lid, die afkomstig is uit een derde land of gedeelte van een
      derde land van Zuid-Amerika dat is opgenomen in bijlage I van beschikking 93/402/EEG, gaat vergezeld van:

      a. een gezondheidscertificaat overeenkomstig het model opgenomen in bijlage III van beschikking 93/402/EEG, dat
      bestaat uit een algemeen gezondheidscertificaat overeenkomstig het model opgenomen in deel 1 van die bijlage III,
      en

      b. één van de specifieke gezondheidscertificaten overeenkomstig het model opgenomen in deel 2 van bijlage III van
      beschikking 93/402/EEG, overeenkomstig hetgeen hieromtrent in bijlage II van die beschikking is bepaald.

      5 Een partij grondstoffen afkomstig van dieren als bedoeld in [richtlijn 72/462/EEG](31972L0462) bestemd voor de
      vervaardiging van farmaceutische produkten gaat vergezeld van een gezondheidscertificaat overeenkomstig het model
      opgenomen in de bijlage bij beschikking 92/183/EEG.

      6 Indien de in het eerste lid bedoelde partij materiaal bevat afkomstig van runderen, schapen of geiten, bestemd
      is voor de vervaardiging van voeder voor dieren, is voldaan aan bijlage XI, hoofdstuk A, punt 10, van [verordening
      999/2001/EG](32001R0999).
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel11.9
  - number: '11.10'
    text: |-
      1 Een partij grondstoffen als bedoeld in [artikel 11.9, eerste lid][ref1], die is bestemd voor Nederland, wordt
      rechtstreeks en zonder overlading, in lekvrije, verzegelde containers of transportmiddelen, onder veterinair
      toezicht vervoerd naar een verwerkingsbedrijf voor laag-risicomateriaal dat een vergunning heeft of is
      geregistreerd overeenkomstig [artikel 5 van de Destructiewet][ref2], dan wel naar een erkend koel- en vrieshuis dat
      tevens is erkend voor de tijdelijke opslag van grondstoffen. Indien de partij is bestemd voor een lid-staat, al dan
      niet na tussentijdse opslag in Nederland, vindt het vervoer over Nederlands grondgebied op dezelfde wijze plaats.

      2 Een partij grondstoffen als bedoeld in [artikel 11.9, eerste lid][ref3], is verpakt in gesloten, lekvrije en
      verzegelde recipiënten waarop, evenals op de begeleidende documenten, de naam en het adres van de inrichting
      van bestemming is aangebracht, met dien verstande dat op de dozen, de recipiënten en de begeleidende documenten
      duidelijk zichtbaar de vermeldingen ‘Niet bestemd voor menselijke consumptie’ en ‘Uitsluitend voor de vervaardiging
      van voeder voor gezelschapsdieren’ of ‘Uitsluitend bestemd voor de vervaardiging van farmaceutische of technische
      produkten’ zijn aangebracht.

      3 De in het eerste lid bedoelde containers en transportmiddelen alsmede alle andere voorwerpen die vóór
      de sterilisatie met de grondstoffen in contact zijn geweest, worden overeenkomstig de aanwijzingen van de
      keuringsdierenarts gereinigd en ontsmet.

      4 Een partij grondstoffen als bedoeld in [artikel 11.9, eerste lid][ref4], voldoet voorts aan de overige
      voorschriften van hoofdstuk 10 van bijlage I van [richtlijn 92/118/EEG](31992L0118), met dien verstande dat een
      partij die is bestemd voor de vervaardiging van farmaceutische produkten tevens voldoet aan de voorschriften van
      beschikking 92/183/EEG.

      5 In het verwerkingsbedrijf voor laag-risicomateriaal worden de grondstoffen zodanig behandeld dat ziekteverwekkers
      worden vernietigd, met dien verstande dat:

      a. in het bedrijf een register wordt bijgehouden van de hoeveelheid grondstof die tijdens de verwerking wordt
      gebruikt om zeker te stellen dat de grondstoffen voor het beoogde doel zijn gebruikt;

      b. na de behandeling wordt voldaan aan de ter zake gestelde voorschriften van [richtlijn 90/667/EEG](31990L0667)
      en, voor zover van toepassing, van [hoofdstuk 4][ref5] of 6 van bijlage I van [richtlijn 92/118/EEG](31992L0118);

      c. indien het voor de vervaardiging van voeder voor gezelschapsdieren bestemde slachtafvallen betreft als bedoeld
      in [artikel 11.9, derde lid][ref6], afkomstig uit een derde land of gedeelte van een derde land, opgenomen in
      bijlage I van beschikking 93/402/EEG, deze tijdens het produktieproces in hermetisch gesloten recipïenten worden
      gesteriliseerd waarbij een Pc-waarde van tenminste 3 wordt bereikt.


