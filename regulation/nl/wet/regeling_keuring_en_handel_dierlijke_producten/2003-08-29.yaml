  - number: '11.13'
    text: |-
      Zolang de voorschriften voor de invoer uit derde landen voor een bepaalde produktsoort niet of slechts gedeeltelijk
      ingevolge de regelgeving van de Europese Gemeenschap zijn vastgesteld en in werking getreden, voldoet een partij
      van deze produkten die is bestemd voor een lid-staat, aan de voorschriften van de lid-staat van bestemming.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel11.13
  - number: '11.14'
    text: |-
      1 In afwijking van hetgeen in deze afdeling is bepaald omtrent het vanuit derde landen in Nederland brengen van
      grondstoffen als bedoeld in [artikel 11.1][ref1] en voor dierlijke voeding bestemde verwerkte dierlijke eiwitten,
      gaat een partij grondstoffen die is verzonden vanuit IJsland, voor zover afkomstig van vis, vergezeld van het
      document, bedoeld in [artikel 11.2, onderdeel f][ref2], en gaat een partij voor dierlijke voeding bestemd vismeel,
      dan wel produkten of mengsels daarvan, die is verzonden vanuit IJsland, vergezeld van het document, bedoeld in
      [artikel 11.2, onderdeel l][ref3].

      2 Een partij als bedoeld in het eerste lid voldoet aan hetgeen omtrent het handelsverkeer in de betreffende
      produktsoort is bepaald in [richtlijn 92/118/EEG](31992L0118).


