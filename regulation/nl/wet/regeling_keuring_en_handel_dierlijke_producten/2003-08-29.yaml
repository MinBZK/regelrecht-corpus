  - number: '5.17'
    text: |-
      Vlees van vrij wild of gehele stukken vrij wild dat, onderscheidenlijk die, overeenkomstig hoofdstuk V van bijlage
      I van [richtlijn 92/45/EEG](31992L0045) voor menselijke consumptie ongeschikt is, onderscheidenlijk zijn verklaard,
      of vlees van vrij wild of gehele stukken vrij wild dat, onderscheidenlijk die anderszins door de keuringsdierenarts
      of diens assistent niet geschikt wordt, onderscheidenlijk worden bevonden voor menselijke consumptie, wordt,
      onderscheidenlijk worden:

        - voor zover het vlees of de gehele stukken zich bevindt of bevinden in een vrij-wildverwerkingsinrichting, in de
      betreffende inrichting onmiddellijk verzameld overeenkomstig punt 5, onderdeel d, van hoofdstuk I van bijlage I
      van [richtlijn 92/45/EEG](31992L0045) en onder toezicht van de keuringsdierenarts of diens assistent onbruikbaar
      gemaakt voor menselijke consumptie, en
        - behandeld overeenkomstig de bij of krachtens de [Destructiewet][ref1] of de
      [Gezondheids- en welzijnswet voor dieren][ref2] aan de verwerking van dergelijk materiaal gestelde regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002244
      [ref2]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0002244
      - id: ref2
        bwb_id: BWBR0005662
  - number: '5.18'
    text: |-
      1 Dit hoofdstuk is niet van toepassing in de situaties, bedoeld in artikel 1, tweede lid, onderdelen a en b, van
      [richtlijn 92/45/EEG](31992L0045).

      2 Dit hoofdstuk is niet van toepassing op het uitsnijden en opslaan van gehele stukken gedood vrij wild of vlees
      van vrij wild in detailhandelszaken of in lokalen die aan verkooppunten grenzen, waar het uitsnijden en opslaan
      uitsluitend met het oog op rechtstreekse verkoop van vlees van vrij wild ter plaatse aan de eindverbruiker
      geschieden.

      3 In de situaties, bedoeld in het eerste en tweede lid, zijn ten aanzien van het opslaan en uitsnijden met het oog
      op levering aan de eindverbruiker de voorschriften voor het uitoefenen van de detailhandel van toepassing.

      4 Dit hoofdstuk is niet van toepassing in de situaties, bedoeld in artikel 1, derde lid, van [richtlijn 92/45/
      EEG](31992L0045).
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel5.18
  - number: '5.19'
    text: |-
      1 De in dit hoofdstuk bedoelde werkzaamheden van de VWA geschieden in de periode van maandag tot en met vrijdag,
      met uitzondering van algemeen erkende feestdagen, van 07.00 uur tot 18.00 uur.

      2 De keuringsdierenarts kan in bijzondere gevallen, na overleg met de kringdirecteur, van het eerste lid afwijken.

      3 De minister kan in bijzondere gevallen toestemmen in afwijking van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel5.19
  - number: '5.20'
    text: |-
      [Artikel 4.21][ref1] is van overeenkomstige toepassing op het laten vervaardigen en het in voorraad hebben
      van de in dit hoofdstuk genoemde merken en het voorhanden hebben van stempels en andere werktuigen waarmee
      deze merken kunnen worden vervaardigd of aangebracht, met dien verstande dat voor ‘erkende inrichting’ in
      [artikel 4.21, tweede lid][ref2], wordt gelezen: inrichting die is erkend als vrij wild-verwerkingsinrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel4.21
