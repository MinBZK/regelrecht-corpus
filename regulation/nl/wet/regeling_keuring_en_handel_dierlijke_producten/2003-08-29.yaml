  - number: '11.3'
    text: |-
      Tenzij in de in [artikel 11.5][ref1] bedoelde voorschriften van bijlage I van [richtlijn 92/118/EEG](31992L0118)
      anders is bepaald, zijn de in [artikel 11.2][ref2] genoemde overige dierlijke produkten:

      a. indien het de in [artikel 11.2, onderdelen a tot en met l][ref3] genoemde produkten betreft, afkomstig uit een
      inrichting als bedoeld in artikel 4, tweede lid, onderdelen a en b, van [richtlijn 92/118/EEG](31992L0118), die
      door de minister overeenkomstig [artikel 11.6][ref4] is geregistreerd, terwijl die inschrijving niet is getroffen
      door een beslissing als bedoeld in [artikel 11.6, derde lid][ref5];

      b. indien het de in [artikel 11.2, onderdelen m en n][ref6] genoemde produkten betreft, afkomstig uit een
      inrichting als bedoeld in artikel 4, tweede lid, onderdelen a en b, van [richtlijn 92/118/EEG](31992L0118), die is
      geregistreerd op grond van de Verordening Vvr handel in dierlijke eiwitten 1994, onderscheidenlijk de Verordening
      Vvr hygiënische produktie en handel huisdiervoeders 1990 en die voldoet aan hetgeen omtrent de werkwijze van deze
      inrichtingen in genoemde verordeningen is bepaald.


