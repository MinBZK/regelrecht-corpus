              beschikking 97/217/EG:

                beschikking van de Commissie van de Europese Gemeenschappen van 28 februari 1997 tot vaststelling van
      groepen van derde landen die kunnen voldoen aan de eisen inzake veterinaire certificering voor de invoer van vlees
