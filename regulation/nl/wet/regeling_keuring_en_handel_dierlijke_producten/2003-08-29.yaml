  - number: '9.3'
    text: |-
      1 Gehakt vlees als bedoeld in [artikel 9.2, eerste lid][ref1]:

      a. is, voor zover van toepassing, overeenkomstig hoofdstuk II van bijlage I van [richtlijn 94/65/
      EG](31994L0065) verkregen van of met vers vlees van runderen, varkens, schapen en geiten dat
      overeenkomstig het [Besluit produktie en handel vers vlees][ref2] is voorzien van het keurmerk,
      bedoeld in bijlage I, hoofdstuk XI, van [richtlijn 64/433/EEG](31964L0433), dan wel overeenkomstig het
      [Besluit inzake vlees uit andere lid-staten][ref3], onderscheidenlijk het Besluit invoer vlees uit derde landen,
      alsmede de [Regeling in- en doorvoer vlees 1979][ref4] in Nederland is gebracht;

      b. is verkregen in een op grond van [artikel 9.10, eerste lid][ref5], erkende werkplaats;

      c. is, voor zover zij is verkregen van vers vlees van varkens, overeenkomstig artikel 2 van [richtlijn 77/96/EEG]
      (31977L0096) op trichinen onderzocht of heeft een koudebehandeling ondergaan als bedoeld in bijlage IV van die
      richtlijn;

      d. is overeenkomstig hoofdstuk VI van bijlage I van [richtlijn 94/65/EG](31994L0065) voorzien van etikettering;

      e. is overeenkomstig hoofdstuk VII van bijlage I van [richtlijn 94/65/EG](31994L0065) voorzien van een
      onmiddellijke en een eindverpakking;

      f. is of wordt overeenkomstig hoofdstuk VIII, onderscheidenlijk IX van bijlage I van [richtlijn 94/65/EG]
      (31994L0065) opgeslagen en vervoerd;

      g. voldoet, voor zover van toepassing, aan artikel 3, tweede lid, van [richtlijn 94/65/EG](31994L0065).

      2 Voor zover aan gehakt vlees als bedoeld in [artikel 9.2, eerste lid][ref6], additieven worden toegevoegd, wordt
      voldaan aan het Additievenbesluit ([Warenwet][ref7]).

      3 Gehakt vlees als bedoeld in [artikel 9.2, eerste lid][ref8], is niet voor menselijke consumptie ongeschikt
      verklaard en vertoont geen tekenen van bederf of ondeugdelijkheid.

      4 Gehakt vlees wordt voor menselijke consumptie ongeschikt verklaard, indien het gebreken vertoont of behandelingen
      heeft ondergaan als bedoeld in [artikel 4.7, tweede lid][ref9].


