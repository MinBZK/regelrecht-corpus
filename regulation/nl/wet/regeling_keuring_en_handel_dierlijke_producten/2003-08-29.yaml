  - number: '11.8'
    text: |-
      1 Een partij niet voor menselijke consumptie bestemde vloeibare melk, melkpoeder of melkpoederprodukten:

      a. is afkomstig uit een derde land of gedeelte van een derde land van waaruit het brengen op het grondgebied van
      de Europese Gemeenschap van de onderscheiden producten is toegestaan ingevolge onderdeel B onderscheidenlijk C van
      de lijst, opgenomen in de bijlage bij beschikking nr. 95/340/EG van de Commissie van de Europese Gemeenschappen van
      27 juli 1995 tot vaststelling van een voorlopige lijst van derde landen waaruit de Lid-Staten de invoer van melk en
      producten op basis van melk toestaan en tot intrekking van Beschikking 94/70/EG (PbEG L 200).

      b. voldoet aan artikel 26 van [richtlijn 92/46/EEG](31992L0046) en aan hetgeen in hoofdstuk 1 van bijlage I van
      [richtlijn 92/118/EEG](31992L0118) omtrent de invoer uit derde landen van deze produkten is bepaald, en gaat,
      zodra ter zake ingevolge de regelgeving van de Europese Gemeenschap een besluit is vastgesteld, vergezeld van het
      gezondheidscertificaat, bedoeld in hoofdstuk 1, onderdeel 2, van bijlage I van [richtlijn 92/118/EEG](31992L0118).

      2 Een partij huiden:

      a. is voorzover het verse of gekoelde huiden betreft, afkomstig uit een derde land of gedeelte van een derde
      land van waaruit het op het grondgebied van de Europese Gemeenschap brengen ingevolge beschikking 79/542/EEG is
      toegestaan van alle categorieën vlees van de diersoorten waarvan de huiden afkomstig zijn, en gaat vergezeld van
      een op de partij betrekking hebbend gezondheidscertificaat waarvan het model overeenstemt met het model in bijlage
      C van beschikking 97/168/EG;

      b. is voorzover het behandelde huiden betreft, afkomstig uit een derde land of gedeelte van een derde land genoemd
      in deel I van de bijlage van beschikking 79/542/EEG, en gaat vergezeld van een op de partij betrekking hebbend
      gezondheidscertificaat waarvan het model overeenstemt met het model in [bijlage A][ref1] van beschikking 97/168/EG,
      met dien verstande dat wanneer het gaat om gezouten huiden die vervoerd worden per schip, deze huiden vóór invoer
      gedurende de op het certificaat aangegeven periode in zout zijn bewaard, dan wel

      c. is voorzover het behandelde huiden van andere hoefdieren dan paardachtigen en varkens betreft die gedurende 21
      dagen zonder onderbreking geïsoleerd of op transport zijn geweest, afkomstig uit eender welk derde land en gaat
      vergezeld van een op de partij betrekking hebbend officieel attest waarvan het model overeenstemt met het model in
      bijlage B van beschikking 97/168/EG, en

      d. voldoet overigens aan hetgeen omtrent de invoer van huiden uit derde landen is bepaald in hoofdstuk 3 van
      bijlage I van [richtlijn 92/118/EEG](31992L0118) en in beschikking 97/168/EG.

      3 Een partij voeder voor gezelschapsdieren als bedoeld in hoofdstuk 4 van bijlage I van [richtlijn 92/118/EEG]
      (31992L0118):

      a. is afkomstig uit een derde land of gedeelte van een derde land van waaruit het brengen op het grondgebied van de
      Europese Gemeenschap van deze produkten is toegestaan ingevolge deel X van bijlage I van beschikking 94/278/EG;

      b. voldoet, indien de partij materiaal bevat afkomstig van runderen, schapen of geiten, aan bijlage XI, hoofdstuk
      A, punt 10, van [verordening 999/2001/EG](32001R0999);

      c. gaat vergezeld van een op de partij betrekking hebbend gezondheids certificaat waarvan het model overeenstemt
      met:

      1º. het onderscheidenlijk voor voeder voor gezelschapsdieren in hermetisch gesloten recipiënten afkomstig uit een
      derde land dat niet is genoemd in [bijlage A][ref2] van beschikking 97/199/EG, voor halfvochtig of gedroogd voeder
      voor gezelschapsdieren of voor huiden van hoefdieren vervaardigde ongelooide eetbare producten voorgeschreven model
      in beschikking nr. 94/309/EG van de Commissie van de Europese Gemeenschappen van 27 april 1994 tot vaststelling
      van de veterinairrechtelijke voorschriften en de voorschriften inzake veterinairrechtelijke certificering voor
      de invoer uit derde landen van bepaalde, laag-risicomateriaal bevattende voeders voor gezelschapsdieren en van
      bepaalde, dat materiaal bevattende ongelooide eetbare produkten voor die dieren (PbEG L 137), dan wel

      2º. indien het een partij voeder voor gezelschapsdieren in hermetisch gesloten recipiënten betreft die verwerkte
      dierlijke eiwitten uit niet voor menselijke consumptie bestemd hoog-risicomateriaal kan bevatten en die afkomstig
      is uit een derde land genoemd in [bijlage A][ref3] van beschikking 97/199/EG, het model in bijlage B van
      beschikking 97/199/EG, en

      d. voldoet overigens aan hetgeen omtrent de invoer uit derde landen is bepaald in hoofdstuk 4 van bijlage I
      van [richtlijn 92/118/EEG](31992L0118) en, voorzover het voeder voor gezelschapsdieren in hermetisch gesloten
      recipiënten betreft als bedoeld in onderdeel b, onder 2, in beschikking 97/199/EG.

      4 Een partij beenderen, hoornen of hoeven, dan wel een partij produkten uit beenderen, hoorn of hoeven:

      a. is, voor zover die partij is bestemd voor dierlijke voeding, afkomstig uit een derde land of gedeelte van een
      derde land van waaruit het brengen op het grondgebied van de Europese Gemeenschap van vers vlees, onderscheidenlijk
      vleesprodukten van de betrokken diersoort is toegestaan ingevolge beschikking 79/542/EEG dan wel, in voorkomend
      geval, ingevolge de beschikking van de Commissie van de Europese Gemeenschappen of de Raad van de Europese Unie,
      bedoeld in de artikelen 21 bis, tweede lid, en 22 van [richtlijn 72/462/EEG](31972L0462);

      b. voldoet, indien de partij beenderen betreft, dan wel producten uit beenderen, en materiaal bevat afkomstig van
      runderen, schapen of geiten, aan bijlage XI, hoofdstuk A, punt 10, van [verordening 999/2001/EG](32001R0999);

      c. gaat vergezeld van:

      1º. voor zover de partij voor dierlijke voeding is bestemd, een gezondheidscertificaat dat overeenkomt met het
      model, zoals dat ten aanzien van het land van verzending op grond van artikel 16, eerste lid, onderscheidenlijk
      artikel 22 van [richtlijn 72/462/EEG](31972L0462) bij beschikking van de Commissie van de Europese Gemeenschappen
      of de Raad van de Europese Unie is vastgesteld, dan wel

      2º. voor zover de partij niet voor menselijke of dierlijke voeding is bestemd, het certificaat, bedoeld in
      Beschikking nr. 94/446/EG van de Commissie van de Europese Gemeenschappen van 14 juni 1994 tot vaststelling van de
      voorschriften voor de invoer uit derde landen voor verdere verwerking van niet voor menselijke of dierlijke voeding
      bestemde beenderen en produkten uit beenderen (met uitzondering van beendermeel), hoornen en produkten uit hoorn
      (met uitzondering van hoornmeel) en hoeven en produkten uit hoeven (met uitzondering van meel van hoeven) (PbEG L
      183), en

      d. voldoet, voorzover het een partij betreft als bedoeld in onderdeel b, onder 2, tevens aan hetgeen omtrent
      de invoer uit derde landen is bepaald in onderdeel B van hoofdstuk 5 van bijlage I van [richtlijn 92/118/EEG]
      (31992L0118) en in de in onderdeel b, onder 2, genoemde beschikking.

      5 Een partij voor diervoeding bestemde verwerkte dierlijke eiwitten of producten die dergelijke eiwitten bevatten:

      a. is afkomstig uit een derde land of gedeelte van een derde land waaruit de invoer is toegestaan ingevolge deel II
      van bijlage I van beschikking 94/278/EG, en

      b. voldoet, indien de partij materiaal bevat afkomstig van runderen, schapen of geiten, aan bijlage XI, hoofdstuk
      A, punt 10, van [verordening 999/2001/EG](32001R0999);

      c. gaat, indien het een partij anders dan bedoeld in onderdeel c of d betreft, niet-zijnde voeder voor
      gezelschapsdieren in hermetisch gesloten recipiënten, vergezeld van een op de partij betrekking hebbend
      gezondheidscertificaat waarvan het model overeenstemt met het model in:

      1. [bijlage A][ref4] van beschikking 94/344/EG indien de partij afkomstig is uit een derde land of gedeelte van een
      derde land dat niet is genoemd in deel II, onderdeel A, van de bijlage van beschikking 94/278/EG, dan wel

      2. bijlage B van beschikking 97/198/EG indien de partij afkomstig is uit een derde land of gedeelte van een derde
      land genoemd in deel II, onderdeel A, van de bijlage van beschikking 94/278/EG.

      en voldoet aan hetgeen overigens voor de betrokken producten is bepaald in beschikking 94/344/EG, onderscheidenlijk
      97/198/EG, dan wel

      d. gaat, voorzover het uit laag-risico-materiaal verkregen verwerkte eiwitten van niet-zoogdieren of producten die
      dergelijke eiwitten bevatten betreft, niet-zijnde voeder voor gezelschapsdieren, vergezeld van een op de partij
      betrekking hebbend gezondheidscertificaat waarvan het model overeenstemt met het model in bijlage B van beschikking
      94/344/EG en voldoet aan hetgeen overigens in laatstgenoemde beschikking is bepaald, dan wel

      e. gaat, voorzover het vismeel en meel van andere zeedieren niet zijnde zeezoogdieren betreft, niet-zijnde
      voeder voor gezelschapsdieren, vergezeld van een op de partij betrekking hebbend gezondheidscertificaat waarvan
      het model overeenstemt met het model in bijlage C van beschikking 94/344/EG en voldoet aan hetgeen overigens in
      laatstgenoemde beschikking is bepaald, en

      f. voldoet aan hetgeen overigens omtrent de invoer uit derde landen is bepaald in hoofdstuk 6 van bijlage I van
      [richtlijn 92/118/EEG](31992L0118), met dien verstande dat indien de in onderdeel B, onder 2, van dat hoofdstuk
      bedoelde controles aantonen dat de partij salmonella bevat, de partij wordt behandeld overeenkomstig onderdeel V
      van voornoemd hoofdstuk 6, en dat een voor ontsmetting erkend bedrijf als bedoeld in onderdeel c, van voornoemd
      onderdeel V een decontaminatiebedrijf is als bedoeld in de Verordening Vvr handel in dierlijke eiwitten 1994.

      6 Een partij vers bloed of bloedproducten van dierlijke oorsprong, niet bestemd voor menselijke consumptie (met
      uitzondering van bloed of bloedproducten van paardachtigen), voldoet aan hetgeen omtrent de invoer van deze
      producten uit derde landen is bepaald in hoofdstuk 7 van bijlage I van [richtlijn 92/118/EEG](31992L0118) hetgeen
      wordt verklaard in een op de partij betrekking hebbend gezondheidscertificaat waarvan het model, zodra dit is
      vastgesteld en in werking getreden, overeenstemt met het ingevolge de regelgeving van de Europese Gemeenschap voor
      de betrokken producten vastgestelde model.

      7 Een partij serum van paardachtigen:

      a. is afkomstig van paardachtigen die geboren en opgegroeid zijn in een derde land of gedeelte van een derde land
      van waaruit de invoer van levende, voor de slacht bestemde paardachtigen is toegestaan op grond van beschikking
      79/542/EEG, en

      b. gaat vergezeld van het gezondheidscertificaat, bedoeld in beschikking nr. 94/143/EG van de Commissie van
      de Europese Gemeenschappen van 1 maart 1994 tot vaststelling van de veterinairrechtelijke voorschriften inzake
      veterinaire certificering voor de invoer van serum van paardachtigen uit derde landen (PbEG L 62).

      8 Een partij produkten van de bijenteelt voldoet aan de voorschriften van hoofdstuk 12 van bijlage I van [richtlijn
      92/118/EEG](31992L0118) en gaat vergezeld van een handelsdocument als bedoeld in [bijlage A][ref5] van beschikking
      nr. 94/860/EG van de Commissie van de Europese Gemeenschappen van 20 december 1994 tot vaststelling van de
      voorwaarden voor de invoer uit derde landen van produkten van de bijenteelt voor gebruik in de bijenteelt (PbEG L
      352), en een partij voor menselijke consumptie bestemde honing voldoet, in voorkomend geval, aan de bij beschikking
      van de Commissie van de Europese Gemeenschappen of de Raad van de Europese Unie overeenkomstig hoofdstuk 2 van
      bijlage II van voornoemde richtlijn voor de invoer uit derde landen van dit produkt vastgestelde voorschriften,
      voor zover deze veterinairrechtelijk van aard zijn.

      9 Een partij jachttrofeeën voldoet aan hetgeen omtrent de invoer uit derde landen is bepaald in hoofdstuk 13 van
      bijlage I van [richtlijn 92/118/EEG](31992L0118).

      10 Een partij verwerkte produkten uit mest of niet-verwerkte mest als bedoeld in hoofdstuk 14 van bijlage I van
      [richtlijn 92/118/EEG](31992L0118):

      a. is afkomstig uit een derde land of gedeelte van een derde land van waaruit het brengen op het grondgebied van de
      Europese Gemeenschap is toegestaan ingevolge deel IX van bijlage I van beschikking 94/278/EEG;

      b. gaat vergezeld van het gezondheidscertificaat, bedoeld in artikel 10, tweede lid, onderdeel c, van [richtlijn
      92/118/EEG](31992L0118).

      c. voldoet aan hetgeen omtrent de invoer uit derde landen in voornoemd hoofdstuk 14 is bepaald, en

      d. voldoet aan hetgeen omtrent het vervoer bij beschikking van de Commissie van de Europese Gemeenschappen of
      de Raad van de Europese Unie op grond van artikel 10, tweede lid, dan wel derde lid, onderdeel a, van [richtlijn
      92/118/EEG](31992L0118) is bepaald.

      11 Een partij onbewerkte schapewol, onbewerkt haar, onbewerkte veren of delen van veren als bedoeld in hoofdstuk
      15 van bijlage I van [richtlijn 92/118/EEG](31992L0118), niet zijnde sierveren of veren bedoeld in onderdeel 3 van
      voornoemd hoofdstuk:

      a. is, voor zover die partij bestaat uit onbehandeld varkenshaar, afkomstig uit een derde land of gedeelte van een
      derde land van waaruit het brengen op het grondgebied van de Europese Gemeenschap van vers vlees van varkens is
      toegestaan ingevolge beschikking 79/542/EEG;

      b. gaat vergezeld van:

      1º. indien het onbehandeld varkenshaar betreft, het ingevolge beschikking nr. 94/435/EG van de Commissie van
      de Europese Gemeenschappen van 10 juni 1994 tot vaststelling van de veterinairrechtlijke voorschriften en de
      voorschriften inzake veterinaire certificering voor de invoer van varkenshaar uit derde landen (PbEG L 180)
      vastgestelde gezondheidscertificaat, dan wel

      2º. in de overige gevallen, in voorkomend geval en zodra ter zake ingevolge de regelgeving van de Europese
      Gemeenschap een besluit is vastgesteld, het gezondheidscertificaat, bedoeld in artikel 10, tweede lid, onderdeel c,
      van [richtlijn 92/118/EEG](31992L0118), en

      c. voldoet aan hetgeen omtrent de invoer uit derde landen in voornoemd hoofdstuk 15 is bepaald.

      12 Een partij voor menselijke consumptie bestemde eieren of eiprodukten:

      a. is afkomstig uit een derde land of gedeelte van een derde land van waaruit het brengen op het grondgebied van de
      Europese Gemeenschap van deze produkten is toegestaan op grond van deel VIII van de bijlage bij beschikking 94/278/
      EG, en

      b. gaat, in voorkomend geval en zodra ter zake ingevolge de regelgeving van de Europese Gemeenschap een besluit
      is vastgesteld, vergezeld van het gezondheidscertificaat, bedoeld in artikel 10, tweede lid, onderdeel c, van
      [richtlijn 92/118/EEG](31992L0118) en voldoet, in voorkomend geval, aan de bij beschikking van de Commissie
      van de Europese Gemeenschappen of de Raad van de Europese Unie overeenkomstig hoofdstuk 2 van bijlage II van
      voornoemde richtlijn voor de invoer uit derde landen van deze produkten vastgestelde voorschriften, voor zover deze
      veterinairrechtelijk van aard zijn.

      13 Een partij voor menselijke consumptie bestemde slakken of kikkerbillen:

      a. is afkomstig uit een derde land of gedeelte van een derde land van waaruit het brengen op het grondgebied van
      de Europese Gemeenschap is toegestaan op grond van deel XI, onderscheidenlijk XII, van de bijlage bij beschikking
      94/278/EG;

      b. gaat, in voorkomend geval en zodra ter zake ingevolge de regelgeving van de Europese Gemeenschap een besluit
      is vastgesteld, vergezeld van het gezondheidscertificaat, bedoeld in artikel 10, tweede lid, onderdeel c, van
      [richtlijn 92/118/EEG](31992L0118), en

      c. voldoet, in voorkomend geval, aan de bij beschikking van de Commissie van de Europese Gemeenschappen of de Raad
      van de Europese Unie overeenkomstig hoofdstuk 2 van bijlage II van voornoemde richtlijn voor de invoer uit derde
      landen van deze produkten vastgestelde voorschriften, voor zover deze veterinairrechtelijk van aard zijn.

      14 Een partij grondstoffen die zijn bestemd voor de vervaardiging van voor menselijke consumptie geschikte
      gelatine:

      a. is afkomstig uit een derde land of gedeelte van een derde land van waaruit het brengen op het grondgebied van de
      Europese Gemeenschap is toegestaan op grond van, in voorkomend geval, beschikking 79/542/EEG, beschikking 94/85/EG,
      beschikking 97/296/EG of beschikking 94/86/EG;

      b. gaat, in voorkomend geval en zodra ter zake ingevolge de regelgeving van de Europese Gemeenschap een besluit
      is vastgesteld, vergezeld van het gezondheidscertificaat, bedoeld in artikel 10, tweede lid, onderdeel c, van
      [richtlijn 92/118/EG](31992L0118).

      15 Een partij voor menselijke consumptie bestemde gelatine:

      a. is afkomstig uit een derde land of gedeelte van een derde land van waaruit het brengen op het grondgebied van de
      Europese Gemeenschap is toegestaan op grond van deel XIII van de bijlage bij beschikking 94/278;

      b. gaat, in voorkomend geval en zodra ter zake ingevolge de regelgeving van de Europese Gemeenschap een besluit
      is vastgesteld, vergezeld van het gezondheidscertificaat, bedoeld in artikel 10, tweede lid, onderdeel c, van
      [richtlijn 92/118/EG](31992L0118) en voldoet, in voorkomend geval, aan de bij beschikking van de Commissie van de
      Europese Gemeenschappen of de Raad van de Europese Unie overeenkomstig bijlage II, [hoofdstuk 4][ref6], paragraaf
      VII, onderdeel B, van voornoemde richtlijn voor de invoer uit derde landen van deze producten vastgestelde
      voorschriften, voor zover deze veterinairrechtelijk van aard zijn.

      c. voldoet aan hetgeen omtrent de invoer uit derde landen in bijlage II, hoofdstuk 4, paragraaf VII, onderdeel A,
      van [richtlijn 92/118/EG](31992L0118) is bepaald;

      d. voldoet, indien de partij materiaal bevat afkomstig van runderen, schapen of geiten, aan bijlage XI, hoofdstuk
      A, punt 10, van [verordening 999/2001/EG](32001R0999);

      16 Een partij niet voor menselijke consumptie bestemde reuzel of gesmolten vet:

      a. is afkomstig uit een derde land of gedeelte van een derde land dat voorkomt op de lijst van de bijlage bij
      beschikking 79/542/EEG;

      b. gaat, zodra ter zake ingevolge de regelgeving van de Europese Gemeenschap een besluit is vastgesteld, vergezeld
      van het gezondheidscertificaat, bedoeld in artikel 10, tweede lid, onderdeel c, van [richtlijn 92/118/EEG]
      (31992L0118), en

      c. voldoet aan hetgeen omtrent de invoer uit derde landen in hoofdstuk 9 van bijlage I van [richtlijn 92/118/EEG]
      (31992L0118) is bepaald;

      d. voldoet, indien de partij materiaal bevat afkomstig van runderen, schapen of geiten, aan bijlage XI, hoofdstuk
      A, punt 10, van [verordening 999/2001/EG](32001R0999).


