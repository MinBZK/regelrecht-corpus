  - number: 4.11a
    text: |-
      1 Het is de eigenaar of houder van een pluimveehouderij slechts toegestaan pluimvee in de handel te brengen ten
      behoeve van de levering aan slachthuizen, indien is voldaan aan [artikel 4.4a][ref1].

      2 De keuringsdierenarts, of onder diens verantwoordelijkheid diens assistent, ziet toe op de naleving
      van [artikel 4.4a][ref2]. De keuringsdierenarts brengt in verband met het toezicht op de naleving van
      [artikel 4.4a, eerste lid][ref3], ten minste een maal per jaar een bezoek aan de pluimveehouderij, met dien
      verstande dat de bezoekfrequentie wordt verhoogd indien blijkt dat de eigenaar of houder zich niet aan voornoemde
      voorschriften houdt en de bezoeken in dat laatste geval steeds worden afgelegd door de keuringsdierenarts.

      3 Indien ook na verhoging van de bezoekfrequentie blijkt dat de eigenaar of houder zich niet aan de in
      [artikel 4.4a, eerste lid][ref4], bedoelde voorschriften houdt, kan de minister besluiten dat er niet langer
      toezicht op de naleving van de in het eerste lid bedoelde voorschriften plaats zal vinden met dien verstande dat in
      dat geval niet langer gebruik kan worden gemaakt van het document, bedoeld in [artikel 4.4a, tweede lid][ref5].

      4 Het toezicht op de naleving van de in het eerste lid bedoelde voorschriften op de houderij wordt hervat nadat de
      eigenaar of houder ten genoegen van de minister heeft aangetoond dat aan voornoemde voorschriften wordt voldaan.

      5 De eigenaar of houder verleent de keuringsdierenarts of diens assistent alle medewerking die deze redelijkerwijs
      ten behoeve van de keuring voor het slachten noodzakelijk acht, en laat deze hiertoe te allen tijde toe op de
      houderij. De keuringsdierenarts en diens assistent zijn bevoegd water en voer van het pluimvee te bemonsteren.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel4.4a
