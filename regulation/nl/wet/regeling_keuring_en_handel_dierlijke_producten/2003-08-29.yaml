  - number: 4.4a
    text: |-
      1 Pluimvee dat ter slachting wordt aangeboden is afkomstig van een houderij waarvan de eigenaar of houder:

      a. is geregistreerd in een door de de minister, en

      b. voor ieder koppel afzonderlijk de administratieve gegevens bijhoudt als bedoeld in hoofdstuk VI, punt 27,
      onderdeel a, van bijlage I van [richtlijn 71/118/EEG](31971L0118), met dien verstande dat deze gegevens gedurende
      ten minste twee jaar worden bewaard om ze desgevraagd aan de keuringsdierenarts of diens assistent over te leggen.

      2 Ten aanzien van ieder koppel pluimvee is een verklaring dan wel een document toegezonden als bedoeld in punt 25,
      onderdeel a, van hoofdstuk VI van bijlage I van [richtlijn 71/118/EEG](31971L0118), met dien verstande dat indien
      een document als bedoeld onder ii van voornoemd onderdeel a wordt toegezonden, het model daarvan overeenstemt
      met het model opgenomen in bijlage A van deze regeling, dan wel een model dat ten minste de gegevens bevat als
      opgenomen in het model van voornoemde [bijlage A][ref1], alsmede dat per koppel een afzonderlijk document wordt
      gebruikt en dit document maximaal 72 en minimaal 24 uur vóór het slachten aan de keuringsdierenarts of diens
      assistent in het slachthuis wordt overgelegd. Een verklaring of document hoeft niet te worden toegezonden indien is
      voldaan aan punt 25, onderdeel c, van hoofdstuk VI van bijlage I van [richtlijn 71/118/EEG](31971L0118).

      3 Indien niet aan het eerste of tweede lid is voldaan, neemt de keuringsdierenarts de maatregelen bedoeld in punt
      25, onderdeel b, van hoofdstuk VI van bijlage I van [richtlijn 71/118/EEG](31971L0118).


      [ref1]: https://wetten.overheid.nl/BWBR0006727
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel4.4a
