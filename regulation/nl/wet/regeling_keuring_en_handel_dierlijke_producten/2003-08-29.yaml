  - number: '10.4'
    text: |-
      In deze afdeling wordt onder vleesbereidingen verstaan: vleesbereidingen van kippen, kalkoenen, parelhoenders,
      eenden, ganzen, gekweekt of vrij vederwild, klein vrij wild en gekweekte konijnen en hazen.
    url: https://wetten.overheid.nl/BWBR0006727/2003-08-29#Artikel10.4
  - number: '10.5'
    text: |-
      1 Het in de handel brengen van vleesbereidingen is verboden.

      2 Het verbod, bedoeld in het eerste lid, geldt niet indien, voor zover van toepassing, is voldaan aan de
      [artikelen 10.6][ref1] tot en met [10.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel10.6
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel10.8
