  - number: '11.12'
    text: |-
      1 De in [artikel 11.8][ref1], tweede, vierde, achtste, negende, voorzover het niet verwerkte mest betreft tiende,
      en elfde lid bedoelde producten alsmede honing zijn afkomstig uit een inrichting die is geregistreerd door de
      bevoegde autoriteit van het derde land van oorsprong.

      2 De in [artikel 11.8][ref2], eerste, derde, vijfde tot en met zevende en twaalfde tot en met vijftiende lid
      bedoelde producten zijn afkomstig uit een inrichting die, zodra deze is vastgesteld en in werking getreden,
      voorkomt op de bij beschikking van de Commissie van de Europese Gemeenschappen of Raad van de Europese Unie
      vastgestelde lijst, bedoeld in artikel 10, tweede lid, onderdeel b, tweede gedachtenstreepje van [richtlijn 92/118/
      EEG](31992L0118), met dien verstande dat zolang voor de desbetreffende productsoort een dergelijke lijst niet in
      werking is getreden door de officiële dierenarts op het desbetreffende gezondheidscertificaat wordt verklaard dat
      de inrichting voldoet aan de in de bijlagen I onderscheidenlijk II van [richtlijn 92/118/EEG](31992L0118) voor de
      desbetreffende productsoort vastgestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel11.8
