  - number: '5.3'
    text: |-
      1 Een partij gehele stukken grof vrij wild die anders dan in doorvoer buiten Nederland wordt gebracht, gaat
      vergezeld van een gezondheidscertificaat waarvan het model overeenstemt met het model dat is vastgesteld bij
      beschikking van de Commissie van de Europese Gemeenschappen of de Raad van de Europese Unie op grond van artikel 5,
      derde lid, onderdeel c, van [richtlijn 92/45/EEG](31992L0045), dan wel, zolang dit model niet is vastgesteld, van
      een door de minister ondertekend certificaat waarin ten minste wordt verklaard dat de ingewanden een post mortem
      keuring hebben ondergaan in een erkende vrij-wildverwerkingsinrichting en dat het vlees geschikt is verklaard voor
      menselijke consumptie.

      2 Een partij gehele stukken klein vrij wild die anders dan in doorvoer buiten Nederland wordt gebracht, gaat
      vergezeld van een door de minister ondertekend certificaat waarin ten minste wordt verklaard dat een representatief
      monster van dieren van dezelfde herkomst is gekeurd en aan de hand van deze keuring de partij geschikt is bevonden
      voor menselijke consumptie.

      3 Zolang de voorschriften voor het op het grondgebied van de Europese Gemeenschap brengen van gehele stukken vrij
      wild vanuit derde landen niet of slechts gedeeltelijk ingevolge de regelgeving van de Europese Gemeenschap zijn
      vastgesteld, is het anders dan in doorvoer buiten Nederland brengen van uit derde landen in Nederland ingevoerd
      gehele stukken vrij wild, bestemd voor een lidstaat, slechts toegestaan indien de lidstaat van bestemming heeft
      ingestemd met het op zijn grondgebied brengen van deze stukken en is voldaan aan de ter zake door die lid-staat
      gestelde voorschriften.

      4 Indien een partij als bedoeld in het eerste lid in Nederland niet is omgepakt, gaat de partij, in afwijking van
      het eerste en tweede lid, vergezeld van:

      1º. een gewaarmerkt afschrift van het certificaat, bedoeld in [artikel 5.11, eerste lid, onderdeel b][ref1], met
      dien verstande dat op dit afschrift of op een afzonderlijk certificaat tevens door de minister is verklaard dat de
      partij is ingevoerd overeenkomstig de Nederlandse voorschriften, dan wel

      2º. een door de lid-staat van bestemming voorgeschreven certificaat.

      5 Indien een partij als bedoeld in het eerste lid in Nederland is omgepakt, blijkt uit het document bedoeld
      in [artikel 5.3, eerste en tweede lid][ref2], tevens dat is voldaan aan de voorschriften van de lid-staat van
      bestemming.


