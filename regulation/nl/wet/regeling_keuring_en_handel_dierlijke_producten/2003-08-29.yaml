  - number: '10.12'
    text: |-
      Onverminderd [artikel 10.11][ref1] is, zolang de voorschriften voor het vanuit derde landen op het grondgebied
      van de Europese Gemeenschap brengen van vleesbereidingen niet of slechts gedeeltelijk ingevolge [richtlijn
      94/65/EG](31994L0065) zijn vastgesteld, het brengen in Nederland van een partij vleesbereidingen als bedoeld
      in [artikel 10.11][ref2], die via Nederland voor het eerst op het grondgebied van de Europese Gemeenschap
      wordt gebracht en is bestemd voor een lid-staat, slechts toegestaan indien is voldaan aan [richtlijn 94/65/EG]
      (31994L0065) en de voorschriften van de lid-staat van bestemming.


