  - number: '11.2'
    text: |-
      Het bewijsstuk, onderscheidenlijk de bewijsstukken, bedoeld in [artikel 2.2, tweede lid, onderdeel e][ref1], is,
      onderscheidenlijk zijn:

      a. indien het een partij niet voor menselijke consumptie bestemde vloeibare melk, melkpoeder of melkpoederprodukten
      betreft, een handelsdocument dat een verklaring bevat als bedoeld in hoofdstuk 1, onderdelen 2 en 3, onder a, b en
      c, van bijlage I van [richtlijn 92/118/EEG](31992L0118);

      b. indien het een partij huiden betreft:

      1º. in geval van verse of gekoelde huiden, een handelsdocument;

      2º. in geval van behandelde huiden een handelsdocument, waarop de verklaringen voorkomen bedoeld in hoofdstuk 3,
      onderdeel II, van bijlage I van [richtlijn 92/118/EEG](31992L0118);

      c. indien het een partij beenderen, hoornen of hoeven, dan wel een partij produkten uit beenderen, hoornen of
      hoeven betreft:

      1º. een handelsdocument, alsmede

      2º. voor zover het beenderen, hoornen of hoeven bestemd voor dierlijke voeding betreft, een verklaring van de
      minister dat is voldaan aan de artikelen 3 en 4 van [richtlijn 72/461/EEG](31972L0461), dan wel

      3º. voor zover het produkten uit beenderen, hoornen of hoeven bestemd voor dierlijke voeding betreft, een
      verklaring van de minister dat is voldaan aan de artikelen 3 en 4 van [richtlijn 80/215/EEG](31980L0215);

      d. indien het een partij bloed of bloedprodukten van dierlijke oorsprong, met uitzondering van bloed of
      bloedprodukten van paardachtigen, betreft, een handelsdocument;

      e. indien het een partij serum van paardachtigen betreft, een handelsdocument;

      f. indien het een partij grondstoffen als bedoeld in hoofdstuk 10, onderdeel I, van bijlage I van [richtlijn
      92/118/EEG](31992L0118), voor de vervaardiging van voeder voor dieren dan wel voor farmaceutische of technische
      produkten betreft, een handelsdocument, waarop tevens wordt vermeld:

      1º. voor zover de grondstoffen een behandeling hebben ondergaan, de aard van deze behandeling, en

      2º. of de grondstoffen eiwitten bevatten die afkomstig zijn van herkauwers.

      g. indien het een partij produkten van de bijenteelt of voor menselijke consumptie bestemde honing betreft, een
      handelsdocument;

      h. indien het een partij jachttrofeeën betreft, een handelsdocument dat een verklaring bevat als bedoeld in
      hoofdstuk 13 van bijlage I van [richtlijn 92/118/EEG](31992L0118);

      i. indien het betreft:

      1º. een partij niet-verwerkte mest als bedoeld in hoofdstuk 14, onder I, van bijlage I van [richtlijn 92/118/EEG]
      (31992L0118):

        - een handelsdocument, indien het mest van paardachtigen betreft, dan wel
        - een gezondheidscertificaat als bedoeld in voornoemd hoofdstuk 14, indien het mest van pluimvee dan wel, voorzover
      het handelsverkeer ingevolge voornoemd hoofdstuk is toegestaan, mest van andere dieren dan paardachtigen of
      pluimvee betreft, dan wel

      2º. een partij verwerkte mest en verwerkte producten uit mest, dan wel een partij guano als bedoeld in voornoemd
      hoofdstuk 14, onder II, onderscheidenlijk III, een handelsdocument;

      j. indien het een partij onbewerkte schapewol, onbewerkt haar van herkauwers of van varkens dan wel onbewerkte
      veren of delen van veren als bedoeld in hoofdstuk 15 van bijlage I van [richtlijn 92/118/EEG](31992L0118)
      betreft, niet zijnde sierveren of veren bedoeld in onderdeel 3 van voornoemd hoofdstuk, een handelsdocument en, in
      voorkomend geval, een certificaat als bedoeld in onderdeel 2, onder b, van voornoemd hoofdstuk;

      k. indien het een partij voor menselijke consumptie bestemde slakken, voor menselijke consumptie bestemde
      kikkerbillen of voor menselijke consumptie bestemde eieren betreft, een handelsdocument;

      l. indien het een partij voor menselijke consumptie bestemde gelatine of grondstoffen, die bestemd zijn voor de
      vervaardiging van voor menselijke consumptie geschikte gelatine, betreft, handelsdocumenten als bedoeld in bijlage
      II, Hoofdstuk 4, paragraaf III, onderdeel 1, en paragraaf VI, onderdeel 3, van [richtlijn 92/118/EG](31992L0118);

      m. indien het een partij voor dierlijke voeding bestemde, verwerkte dierlijke eiwitten betreft, een handelsdocument
      als bedoeld in artikel 13, derde lid, onderdeel b, van [richtlijn 90/667/EEG](31990L0667), naar het model in
      bijlage I van beschikking 97/735/EG, alsmede, voor zover van toepassing, een officiële verklaring naar het model in
      bijlage II van die beschikking;

      n. indien het een partij voeder voor gezelschapsdieren betreft:

      1º. een door de minister afgegeven en ondertekend certificaat, waarin wordtverklaard dat het produkt een
      warmtebehandeling heeft ondergaan ten einde een Fc-waarde van ten minste 3,0 te bereiken, indien het een partij in
      hermetisch gesloten recipiënten betreft;

      2º. een handelsdocument als bedoeld in artikel 13, derde lid, onderdeel b, van [richtlijn 90/667/EEG](31990L0667),
      indien het een partij halfvochtig, gedroogd of van verwerkte huiden vervaardigd voeder betreft, dat de verklaringen
      bevat als bedoeld in onderdeel 2, onderscheidenlijk 3, onder b, onderscheidenlijk 4, van hoofdstuk 4 van bijlage I
      van [richtlijn 92/118/EEG](31992L0118);

      o. ) indien het een partij verwerkte dierlijke afvallen als bedoeld in artikel 4, eerste lid, van beschikking
      97/735/EG betreft, voor zover van toepassing, een officieel certificaat als bedoeld in bijlage III en bijlage IV
      van die beschikking.


