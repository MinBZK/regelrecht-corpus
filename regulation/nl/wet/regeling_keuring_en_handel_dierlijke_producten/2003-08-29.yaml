  - number: '4.4'
    text: |-
      Vers vlees van pluimvee, voor zover het karkassen en slachtafval betreft:

      a. is afkomstig van pluimvee dat vóór het slachten is gekeurd overeenkomstig hoofdstuk VI van bijlage I van
      [richtlijn 71/118/EEG](31971L0118) en dat daarbij geschikt is bevonden om te worden geslacht met het oog op het in
      de handel brengen van vers vlees van pluimvee, met dien verstande dat is voldaan aan [artikel 4.4a][ref1];

      b. is verkregen in een slachthuis dat is erkend op grond van [artikel 4.16, eerste lid, onderdeel a][ref2], of, met
      inachtneming van [artikel 4.10][ref3], op grond van [artikel 4.16, tweede lid, onderdeel a][ref4];

      c. is op voldoende hygiënische wijze behandeld overeenkomstig hoofdstuk VII van bijlage I van [richtlijn 71/118/
      EEG](31971L0118);

      d. is na het slachten gekeurd overeenkomstig hoofdstuk VIII van bijlage I van [richtlijn 71/118/EEG](31971L0118)
      en niet ongeschikt verklaard voor menselijke consumptie overeenkomstig hoofdstuk IX van voornoemde bijlage, met
      dien verstande dat de onderdelen a en b van punt 47, tweede alinea, van hoofdstuk VIII van bijlage I van [richtlijn
      71/118/EEG](31971L0118) volgens aanwijzingen en onder rechtstreekse controle van de keuringsdierenarts kunnen
      worden uitgevoerd door hiertoe speciaal opgeleid personeel van de inrichting, dat voldoet aan door de minister
      vastgestelde voorwaarden;

      e. is na de keuring na het slachten gehanteerd overeenkomstig hoofdstuk VII, punt 46, van bijlage I van [richtlijn
      71/118/EEG](31971L0118) en is onder bevredigende hygiënische omstandigheden opgeslagen in een op grond van
      [artikel 4.16][ref5] erkende inrichting met inachtneming van hoofdstuk XIII van voornoemde bijlage, met dien
      verstande dat karkassen en slachtafval door onderdompeling kunnen worden gekoeld, voor zover dit geschiedt
      overeenkomstig hoofdstuk VII, punten 42 en 43 van bijlage I van [richtlijn 71/118/EEG](31971L0118), en dat deze na
      koeling onmiddellijk worden bevroren of diepgevroren;

      f. is voorzien van een eindverpakking overeenkomstig hoofdstuk XIV van bijlage I van [richtlijn 71/118/EEG]
      (31971L0118), met dien verstande dat wanneer een beschermend omhulsel wordt gebruikt, dit moet voldoen aan de
      voorschriften van voornoemd hoofdstuk, en

      g. wordt vervoerd overeenkomstig hoofdstuk XV van bijlage I van [richtlijn 71/118/EEG](31971L0118).


