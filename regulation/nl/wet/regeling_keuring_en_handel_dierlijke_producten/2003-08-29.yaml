  - number: 2.23m
    text: |-
      1 In afwijking van [artikel 2.23g][ref1] mag een handelaar die niet beschikt over een erkenning als bedoeld
      in dat artikel, de in dat artikel genoemde activiteit verrichten, mits de handelaar binnen vier maanden na
      inwerkingtreding van deze regeling overeenkomstig [artikel 2.23h, eerste lid][ref2], een aanvraag voor een
      erkenning heeft ingediend.

      2 De vrijstelling als bedoeld in het eerste lid is geldig tot aan het tijdstip dat de handelaar de door Onze
      Minister genomen beslissing op de aanvraag voor erkenning heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23g
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23h
