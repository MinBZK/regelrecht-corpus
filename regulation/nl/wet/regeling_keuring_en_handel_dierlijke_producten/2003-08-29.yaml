  - number: 2.8a
    text: |-
      1 Het verbod, bedoeld in artikel 2.1, tweede lid, geldt, behalve indien het gehakt vlees van andere dieren dan
      runderen, varkens, schapen of geiten, vleesbereidingen van vlees van eenhoevigen, dan wel separatorvlees als
      bedoeld in [artikel 4.1][ref1] betreft, niet terzake van het brengen in Nederland van producten die zijn verzonden
      vanuit een derde land en via het grondgebied van een lid-staat in Nederland zijn gebracht, mits wordt voldaan
      aan, voorzover van toepassing, de [artikelen 2.9][ref2] tot en met [2.14][ref3], [2.26, tweede lid][ref4], en
      [2.27][ref5] en mits:

      a. indien de producten, niet zijnde niet in [artikel 11.2][ref6] genoemde overige dierlijke producten, zijn bestemd
      voor Nederland of een lid-staat, de partij vergezeld gaat van een certificaat als bedoeld in artikel 5, eerste lid,
      van [richtlijn 97/78/EG](31997L0078) en van een gewaarmerkt afschrift als bedoeld in artikel 7, vierde lid, van
      [richtlijn 97/78/EG](31997L0078);

      b. indien de producten bestemd zijn voor een derde land, de partij vergezeld gaat van:

      1e. het bij de partij behorende originele document, en

      2e. een certificaat als bedoeld in onderdeel a waarin is aangegeven langs welke grensinspectiepost als bedoeld in
      artikel 2, tweede lid, onderdeel g, van [richtlijn 97/78/EG](31997L0078) de partij de Europese Gemeenschap verlaat.

      2 Onverminderd het eerste lid, wordt indien de producten zijn verzonden vanuit Noorwegen en zijn bestemd voor
      Nederland of een lid-staat, voldaan aan afdeling 4 van de hoofdstukken 4, 5, 9 of 10 of afdeling 3 van hoofdstuk
      11;

      3 Onverminderd het eerste lid, wordt indien de producten zijn verzonden vanuit IJsland en het voor diervoeding
      bestemd vismeel dan wel producten of mengsels daarvan betreft, bestemd voor Nederland of een lid-staat, voldaan aan
      afdeling 3 van hoofdstuk 11, voor zover deze afdeling op die producten van toepassing is.


