  - number: '5.8'
    text: |-
      1 Ten bewijze dat is voldaan aan [artikel 5.5][ref1], is vlees van vrij wild dat is bestemd voor Nederland na een
      van Rijkswege ingesteld onderzoek voorzien van:

      a. een keurmerk als bedoeld in [artikel 5.2, eerste lid][ref2], indien het vlees betreft dat is verkregen in een op
      grond van [artikel 5.13, eerste lid][ref3], erkende inrichting;

      b. een keurmerk als bedoeld in [artikel 5.7, eerste lid][ref4], indien het vlees betreft dat is verkregen in een
      vrij-wildverwerkingsinrichting waaraan ontheffing is verleend als bedoeld in [artikel 12.6, derde lid][ref5] dan
      wel in een op grond van [artikel 5.13, tweede lid][ref6], erkende vrij-wildverwerkingsinrichting.

      2 Ten bewijze dat is voldaan aan [artikel 5.5][ref7], gaat een partij vlees van vrij wild dat is bestemd voor
      Nederland en dat afkomstig is uit een op grond van [artikel 5.13][ref8] erkende inrichting, vergezeld van
      het volgende, op de partij betrekking hebbende bewijsstuk, dat wordt afgegeven na een van Rijkswege ingesteld
      onderzoek:

      a. een begeleidend en door de keuringsdierenarts geviseerd handelsdocument als bedoeld in
      [artikel 5.2, tweede lid, onderdeel a][ref9], dan wel

      b. een gezondheids- en veterinairrechtelijk certificaat als bedoeld in
      [artikel 5.2, tweede lid, onderdeel b][ref10], wanneer het gaat om vlees afkomstig uit een
      vrijwildverwerkingsinrichting die is gelegen in een gebied of zone waarvoor om veterinairrechtelijke redenen
      beperkingen gelden.

      3 Het in [artikel 5.2, tweede lid, onderdeel a][ref11], bedoelde document wordt gedurende ten minste één jaar door
      de geadresseerde bewaard, zodat het desgevraagd aan de keuringsdierenarts kan worden overgelegd.

      4 Ten bewijze dat is voldaan aan [artikel 5.6][ref12], gaat een partij gehele stukken vrij wild die is bestemd voor
      Nederland en die afkomstig is uit een op grond van [artikel 5.13][ref13] erkende vrij-wildverwerkingsinrichting,
      vergezeld van een op de partij betrekking hebbend en na een van Rijkswege ingesteld onderzoek afgegeven:

      a. gezondheidscertificaat als bedoeld in [artikel 5.3, eerste lid][ref14], indien het gehele stukken grof vrij
      wild betreft;

      b. gezondheidscertificaat als bedoeld in [artikel 5.3, tweede lid][ref15], indien het gehele stukken klein vrij
      wild betreft.


