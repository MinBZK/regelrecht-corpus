  - number: '4.8'
    text: |-
      1 Vers vlees van pluimvee, bestemd voor Finland en Zweden, heeft in de krachtens [artikel 4.16][ref1] erkende
      inrichting van oorsprong een steekproefsgewijze microbiologische test op de aanwezigheid van salmonella ondergaan
      overeenkomstig de op grond van artikel 5, derde lid, onderdeel a, van [richtlijn 71/118/EEG](31971L0118)
      vastgestelde bepalingen, waarbij de afwezigheid van salmonella in dat vlees is aangetoond.

      2 Het eerste lid is niet van toepassing op vers vlees dat afkomstig is uit een inrichting waarvoor een programma
      geldt dat op grond van artikel 5, derde lid, onderdeel b, van [richtlijn 71/118/EEG](31971L0118), is erkend als
      gelijkwaardig aan het op grond van artikel 5, vierde lid, van die richtlijn goedgekeurde operationele programma van
      Finland, onderscheidenlijk Zweden inzake salmonella.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel4.16
