        bwb_id: BWBR0006727
        artikel: 2.23a
        hoofdstuk: '2'
        paragraaf: 2a
        afdeling: '4'
  - number: 2.23f
    text: |-
      Degene die om inslag dan wel opslag in, of uitslag uit een van de in [artikel 2.23][ref1] genoemde opslagruimten
      verzoekt, voldoet de kosten voor keuringen en controles welke de VWA bij de inslag, opslag of uitslag verricht. De
      kosten bedragen de werkelijke kosten en staan in een rechtstreeks verband met deze keuringen en controles.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel2.23f
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '2.23'
        hoofdstuk: '2'
        paragraaf: 2a
        afdeling: '4'
  - number: 2.23g
    text: |-
      Levering van producten die niet voldoen aan de in deze regeling voor desbetreffende producten gestelde
      voorschriften voor het brengen op Nederlands grondgebied, aan zeevervoermiddelen als proviand voor bemanning en
      passagiers, geschiedt slechts door Onze Minister erkende handelaren.
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel2.23g
  - number: 2.23h
    text: |-
      1 De aanvraag voor een erkenning als bedoeld in [artikel 2.23g][ref1] wordt ingediend bij de VWA op een daartoe
      bestemd formulier.

      2 Een erkenning wordt slechts verleend indien:

      a. de handelaar zich, op een door de Minister aangegeven wijze, verbindt de in [artikel 2.23g][ref2] bedoelde
      producten uitsluitend te leveren aan zeevervoermiddelen als proviand voor bemanning en passagiers, onder de in
      artikel 13, eerste lid, onderdeel d, en artikel 13, derde lid, van [richtlijn 97/78/EG](31997L0078) gestelde
      voorwaarden;

      b. na een door de keuringsdierenarts ingesteld onderzoek is gebleken dat de handelaar ten behoeve van de opslag
      van de in [artikel 2.23g][ref3] bedoelde producten beschikt over opslagruimte in een entrepot als bedoeld in 2.23a,
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23g
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23g
      [ref3]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23g
