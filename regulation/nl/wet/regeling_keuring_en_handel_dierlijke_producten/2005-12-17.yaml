  - number: 11.7a
    text: |-
      In afwijking van artikel 11.7 mogen in artikel 11.2 genoemde overige dierlijke producten die afkomstig zijn uit
      Tsjechië, Estland, Cyprus, Letland, Litouwen, Hongarije, Malta, Polen, Slovenië of Slowakije en vóór 1 mei 2004
      zijn verkregen in een inrichting die erkend was voor uitvoer naar de Europese Gemeenschap, tot en met 30 april
      2005 voorzien zijn van het keurmerk, bedoeld in artikel 3, onderdeel a, van beschikking 2004/280/EG, mits het
      certificaat of document dat de producten vergezelt, door de bevoegde autoriteiten van het land van herkomst is
      voorzien van de verklaring: ‘Vóór 1 mei 2004 geproduceerd overeenkomstig Beschikking 2004/280/EG van de Commissie.’
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel11.7a
  - number: '11.8'
    text: |-
      1 Een partij voor menselijke consumptie bestemde honing of koninginnengelei:

      a. is afkomstig uit een derde land of gedeelte van een derde land dat voor ‘honing’ staat vermeld op de lijst van
      de bijlage bij Beschikking (EG) nr. 2004/432 van de commissie van de Europese Gemeenschappen van 29 april 2004
      (PbEU L 154) tot goedkeuring van door derde landen ingediende residubewakingsplannen overeenkomstig [Richtlijn
      96/23/EG](31996L0023) van de Raad;

      b. gaat, in voorkomend geval en zodra ter zake ingevolge de regelgeving van de Europese Gemeenschap een besluit
      is vastgesteld, vergezeld van een gezondheidscertificaat, bedoeld in artikel 10, tweede lid, onderdeel c, van
      [richtlijn 92/118/EEG](31992L0118) en voldoet, in voorkomend geval, aan de beschikking van de Commissie van de
      Europese Gemeenschappen of de Raad van de Europese Unie overeenkomstig hoofdstuk 2 van bijlage II van voornoemde
      richtlijn voor de invoer uit derde landen van deze producten vastgestelde voorschriften, voor zover deze
      veterinairrechtelijk van aard zijn.

      2 Een partij voor menselijke consumptie bestemde eieren of eiproducten:

      a. is afkomstig uit een derde land of gedeelte van een derde land van waaruit het brengen op het grondgebied van de
      Europese Gemeenschap is toegestaan op grond van deel IV, onderscheidenlijk deel V, van de bijlage bij beschikking
      2003/812/EG;

      b. gaat, in voorkomend geval en zodra ter zake ingevolge de regelgeving van de Europese Gemeenschap een besluit
      is vastgesteld, vergezeld van het gezondheidscertifcaat, bedoeld in artikel 10, tweede lid, onderdeel c, van
      [richtlijn 92/118/EEG](31992L0118) en voldoet, in voorkomend geval, aan de bij beschikking van de Commissie
      van de Europese Gemeenschappen of de Raad van de Europese Unie overeenkomstig hoofdstuk II van bijlage II van
      voornoemde richtlijn voor de invoer uit derde landen van deze producten vastgestelde voorschriften, voorzover deze
      veterinairrechtelijk van aard zijn.

      3 Een partij voor menselijke consumptie bestemde slakken of kikkerbillen:

      a. is afkomstig uit een derde land of gedeelte van een derde land van waaruit het brengen op het grondgebied van de
      Europese Gemeenschap is toegestaan op grond van deel VI, onderscheidenlijk deel VII, van de bijlage bij beschikking
      2003/812/EG;

      b. gaat, in voorkomend geval, vergezeld van het keuringscertificaat, bedoeld in hoofdstuk 3, onderdeel I,
      onderscheidenlijk onderdeel II, van bijlage II van [richtlijn 92/118](31992L0118) en voldoet, in voorkomend geval,
      aan de overige eisen van hoofdstuk 3 van bijlage II van [richtlijn 92/118](31992L0118) en aan de bij beschikking
      van de Commissie van de Europese Gemeenschappen of de Raad van de Europese Unie overeenkomstig hoofdstuk 2 van
      bijlage II van voornoemde richtlijn voor de invoer uit derde landen van deze producten vastgestelde voorschriften,
      voor zover deze veterinairrechtelijk van aard zijn.

      4 Een partij grondstoffen die zijn bestemd voor de vervaardiging van voor menselijke consumptie geschikte gelatine:

      a. is afkomstig uit een derde land of gedeelte van een derde land van waaruit het brengen op het grondgebied van de
      Europese Gemeenschap is toegestaan op grond van, in voorkomend geval, beschikking 79/542/EEG, beschikking 94/85/EG,
      beschikking 97/296/EG of beschikking 94/86/EG;

      b. gaat, in voorkomend geval en zodra ter zake ingevolge de regelgeving van de Europese Gemeenschap een besluit
      is vastgesteld, vergezeld van het gezondheidscertificaat, bedoeld in artikel 10, tweede lid, onderdeel c, van
      [richtlijn 92/118/EEG](31992L0118).

      5 Een partij voor menselijke consumptie bestemde gelatine:

      a. is afkomstig uit een derde land of gedeelte van een derde land van waaruit het brengen op het grondgebied van de
      Europese Gemeenschap is toegestaan op grond van deel VIII van de bijlage bij beschikking 2003/812/EG;

      b. gaat vergezeld van het gezondheidscertificaat, bedoeld in artikel 10, tweede lid, onderdeel c, van [richtlijn
      92/118/EEG](31992L0118), of voldoet, in voorkomend geval, aan de bij beschikking van de Commissie van de Europese
      Gemeenschappen of de Raad van de Europese Unie overeenkomstig bijlage II, hoofdstuk 4, Sectie A, paragraaf
      VII, onderdeel B, van voornoemde richtlijn voor de invoer uit derde landen van deze producten vastgestelde
      voorschriften, voorzover deze veterinairrechtelijk van aard zijn;

      c. voldoet aan hetgeen omtrent de invoer uit derde landen in bijlage II, hoofdstuk 4, Sectie A, paragraaf VII,
      onderdeel A, van [richtlijn 92/118/EG](31992L0118) is bepaald;

      d. voldoet, indien de partij materiaal bevat afkomstig van runderen, schapen of geiten, aan bijlage XI, hoofdstuk
      A, punt 15, van [verordening 999/2001/EG](32001R0999).

      6 Een partij grondstoffen voor de vervaardiging van voor menselijke consumptie bestemd collageen:

      a. is afkomstig uit een derde land of gedeelte van een derde land van waaruit het brengen op het grondgebied van de
      Europese Gemeenschap is toegestaan op grond van, in voorkomend geval, beschikking 79/542/EEG, beschikking 94/85/EG,
      beschikking 94/86/EG of beschikking 97/296/EG;

      b. gaat vergezeld van het gezondheidscertificaat, bedoeld in bijlage II, hoofdstuk 4, Sectie B, paragraaf VIII,
      onderdeel 2, onder b, van [richtlijn 92/118/EEG](31992L0118).

      7 Een partij voor menselijke consumptie bestemd collageen:

      a. is afkomstig uit een derde land of gedeelte van een derde land van waaruit het brengen op het grondgebied van
      de Europese Gemeenschap is toegestaan op grond van bijlage II, hoofdstuk 4, Sectie B, paragraaf VIII, onderdeel 1,
      onder a, van [richtlijn 92/118/EEG](31992L0118);

      b. gaat vergezeld van het gezondheidscertificaat, bedoeld bijlage II, hoofdstuk 4, Sectie B, paragraaf VIII,
      onderdeel 1, onder g, van [richtlijn 92/118/EEG](31992L0118) of voldoet, in voorkomend geval, aan de bij
      beschikking van de Commissie van de Europese Gemeenschappen of de Raad van de Europese Unie overeenkomstig bijlage
      II, hoofdstuk 4, Sectie B, paragraaf VIII, onderdeel 4, van voornoemde richtlijn voor de invoer uit derde landen
      van deze producten vastgestelde voorschriften, voor zover deze veterinairrechtelijk van aard zijn;

      c. voldoet aan hetgeen omtrent de invoer uit derde landen in bijlage II, hoofdstuk 4, Sectie B, Paragraaf VIII,
      onderdeel 1, van [richtlijn 92/118/EG](31992L0118) is bepaald.
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel11.8
  - number: '11.13'
    text: |-
      Zolang de voorschriften voor de invoer uit derde landen voor een bepaalde produktsoort niet of slechts gedeeltelijk
      ingevolge de regelgeving van de Europese Gemeenschap zijn vastgesteld en in werking getreden, voldoet een partij
      van deze produkten die is bestemd voor een lid-staat, aan de voorschriften van de lid-staat van bestemming.
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel11.13
  - number: '11.16'
    text: |-
      1 De [artikelen 11.2, onderdeel c][ref1], [11.5][ref2] en [11.8, vijfde lid][ref3], zijn niet van toepassing op
      voor menselijke consumptie bestemde gelatine die vóór 1 juni 2000 is vervaardigd.

      2 De [artikelen 11.2, onderdeel d][ref4], [11.5][ref5] en [11.8, zevende lid][ref6], zijn niet van toepassing op
      voor menselijke consumptie bestemd collageen dat vóór 31 december 2003 is vervaardigd of ingevoerd.


