  - number: '10.14'
    text: |-
      De exploitant of de eigenaar, dan wel diens vertegenwoordiger van een op grond van [artikel 10.13][ref1] erkende of
      erkend geachte werkplaats draagt er zorg voor dat in de werkplaats:

      a. de voorschriften van dit hoofdstuk en van [richtlijn 94/65/EG](31994L0065), voor zover van toepassing, worden
      nageleefd, en

      b. de aanwijzingen van de keuringsdierenarts of diens assistent worden opgevolgd en dat deze alle medewerking wordt
      verleend die hij redelijkerwijs voor de vervulling van zijn taken in het kader van dit hoofdstuk noodzakelijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel10.13
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel10.14
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '10.13'
        hoofdstuk: '10'
        afdeling: '6'
  - number: '10.15'
    text: |-
      1 De exploitant of de eigenaar, dan wel diens vertegenwoordiger van een op grond van artikel 10.13 erkende of
      erkend geachte werkplaats:

      a. draagt er zorg voor dat in de werkplaats wordt voldaan aan de artikelen 3 en 6 van [Richtlijn nr. 93/43/EEG]
      (31993L0043) van de Raad van de Europese Gemeenschappen van 14 juni 1993 inzake levensmiddelenhygiëne (PbEG L 175)
      en controleert constant op de naleving van die artikelen;

      b. controleert de grondstoffen die de werkplaats worden binnengebracht, teneinde ten aanzien van het eindprodukt de
      naleving van bijlage IV van [richtlijn 94/65/EG](31994L0065) te waarborgen;

      c. controleert de in de werkplaats gehanteerde reinigings- en ontsmettingsmethoden;

      d. neemt in de werkplaats monsters en draagt er zorg voor dat deze monsters volgens de van toepassing zijnde ISO-
      of ontwerp-ISO-normen worden geanalyseerd;

      e. registreert op enigerlei wijze de gegevens met betrekking tot de activiteiten, bedoeld in de onderdelen a tot en
      met d;

      f. bewaart de in onderdeel e bedoelde gegevens:

        - voor zover de gegevens betrekking hebben op gekoelde produkten, gedurende ten minste zes maanden na de uiterste
      verbruiksdatum van die produkten, of
        - voor zover de gegevens betrekking hebben op andere dan gekoelde produkten, gedurende ten minste twee jaar;

      g. verstrekt desverlangd aan de keuringsdierenarts of diens assistent de in onderdeel e bedoelde gegevens;

      h. biedt de keuringsdierenarts of diens assistent de nodige garanties ten aanzien van het beheer van de keurmerken
      en de etiketten waarop het keurmerk is aangebracht;

      i. informeert de keuringsdierenarts of diens assistent, indien op grond van de in onderdeel e bedoelde gegevens een
      ernstig gevaar voor de gezondheid wordt vastgesteld;

      j. neemt, in geval van een onmiddellijk gevaar voor de volksgezondheid, de hoeveelheid produkten die onder
      technologisch vergelijkbare omstandigheden zijn verkregen en hetzelfde gevaar kunnen opleveren, uit de handel,
      waarna die produkten onder toezicht en veranwoordelijkheid van de keuringsdierenarts blijven, totdat zij
      worden vernietigd, voor andere doeleinden dan menselijke consumptie worden gebruikt, dan wel na toestemming
      van vorenbedoelde keuringsdierenarts op passende wijze opnieuw worden behandeld teneinde de veiligheid van die
      produkten te waarborgen;

      k. vermeldt op de eindverpakking van het produkt zichtbaar en leesbaar bij welke temperatuur het produkt moet
      worden vervoerd en opgeslagen, alsmede de houdbaarheidsdatum indien het produkt is diepgevroren, dan wel de
      uiterste verbruiksdatum indien het produkt is gekoeld;

      l. zet, tenzij het personeel van de werkplaats reeds over voldoende kwalificaties beschikt, hetgeen blijkt
      uit diploma's of andere bewijsstukken van gevolgde opleidingen die desverlangd door het personeel aan de
      keuringsdierenarts worden overlegd, een opleidingsprogramma op dat het personeel van de werkplaats in staat stelt
      te voldoen aan de voor de betrokken produktiestructuur van de werkplaats van toepassing zijnde voorschriften inzake
      hygiënische produktie;

      m. betrekt de keuringsdierenarts die voor de werkplaats verantwoordelijk is bij het opzetten en uitvoeren van het
      in onderdeel I bedoelde programma en bij het opstellen van de eisen inzake zelfcontrole;

      n. laat op de eindprodukten microbiologisch onderzoek uitvoeren, welk onderzoek:

      1º. dagelijks, indien het eindprodukt voldoet aan artikel 5 van [richtlijn 94/65/EG](31994L0065), dan wel

      2º. ten minste wekelijks, indien het eindprodukt voldoet aan artikel 6 van [richtlijn 94/65/EG](31994L0065),
      plaatsvindt in de werkplaats, mits deze door de minister is erkend, of in een erkend laboratorium;

      o. treft overigens alle maatregelen die nodig zijn voor de naleving van de bepalingen van [richtlijn 94/65/EG]
      (31994L0065) in ieder stadium van de produktie.

      2 De in het eerste lid bedoelde controles en maatregelen worden uitgevoerd overeenkomstig bij beschikking van de
      Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen op grond van artikel 7, vijfde lid, van
      [richtlijn 94/65/EG](31994L0065) vastgestelde voorschriften, dan wel, zolang bedoelde beschikking nog niet is
      vastgesteld, overeenkomstig hetgeen de minister daaromtrent heeft bepaald.

      3 Voor zover ter uitvoering van de in het eerste lid bedoelde controles microbiologisch onderzoek wordt verricht,
      geschiedt dit overeenkomstig artikel 7, derde lid, van [richtlijn 94/65/EG](31994L0065).
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel10.15
  - number: '10.16'
    text: |-
      1 Indien de keuringsdierenarts constateert dat de in bijlage IV vastgestelde richtsnoeren voor de produktie van
      vleesbereidingen herhaaldelijk niet worden nageleefd, kan onderscheidenlijk moet hij de maatregelen nemen, bedoeld
      in artikel 8, derde lid, van [richtlijn 94/65/EG](31994L0065).

      2 Indien de keuringsdierenarts een duidelijke overtreding van de voorschriften van dit hoofdstuk of een belemmering
      van een adequate keuring constateert, kan onderscheidenlijk moet hij de maatregelen nemen, bedoeld in artikel 8,
      vierde lid, eerste alinea, van [richtlijn 94/65/EG](31994L0065).

      3 Indien de keuringsdierenarts heeft geconstateerd dat de maatregelen, bedoeld in het eerste onderscheidenlijk
      tweede lid, niet hebben geleid tot verbetering of opheffing van de geconstateerde gebreken, dan wel indien
      keuringsdierenarts heeft geconstateerd dat de artikelen 10.13, 10.14 en 10.15 anderszins niet of slechts
      gedeeltelijk worden nageleefd, schort de minister een op grond van [artikel 10.13][ref1] afgegeven of afgegeven
      geachte erkenning op. Opschorting geschiedt niet dan na voorafgaande waarschuwing en na het verstrijken van een
      daarbij te stellen termijn, waarbinnen alsnog aan de betrokken voorschriften dient te zijn voldaan.

      4 Indien de geconstateerde gebreken niet binnen een daartoe bij de opschorting, bedoeld in het derde lid, gestelde
      termijn zijn verholpen, trekt de minister de erkenning in.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel10.13
