  - number: '5.1'
    text: |-
      1 Onverminderd [artikel 1.1][ref1], wordt in dit hoofdstuk verstaan onder: vrij-wildverwerkingsinrichting:
      inrichting waar gedood klein vrij wild of gedood grof vrij wild wordt behandeld en vlees van vrij wild wordt
      verkregen; verzamelplaats: plaats waar gedood klein vrij wild, of gedood grof vrij wild overeenkomstig de
      hygiënevoorschriften van hoofdstuk III, punt 2, van bijlage I van [richtlijn 92/45/EEG](31992L0045) wordt
      ingeleverd met het oog op vervoer naar een vrij-wildverwerkingsinrichting; slachtafval: vers vlees van vrij
      wild dat geen deel uitmaakt van een geheel stuk al dan niet onthuid of ontvederd vrij wild, ook indien het op
      natuurlijke wijze met het gehele stuk verbonden blijft;

      ingewanden: slachtafval uit de borst-, buik- en bekkenholte, eventueel met inbegrip van de luchtpijp, de slokdarm
      en de krop;

      detailhandel: bedrijf van het kopen en aan particulieren verkopen van waren als bedoeld in artikel 2 van het
      Instellingsbesluit Hoofdbedrijfschap Detailhandel, met uitzondering van verkoop op markten door venthandel of via
      verzending.

      2 In dit hoofdstuk wordt onder ‘lid-staat’ mede verstaan: Noorwegen.

      3 In dit hoofdstuk wordt, in afwijking van [artikel 1.1, eerste lid, onder][ref2] ‘derde land’ verstaan: land, niet
      zijnde Nederland of andere lid-staat van de Europese Unie, en niet zijnde Noorwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel1.1
