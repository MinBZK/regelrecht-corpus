  - number: '2.9'
    text: |-
      1 De partij gaat:

      a. indien uit de certificaten of documenten, genoemd of bedoeld in afdeling 4 van de hoofdstukken 4, 5, 9 of 10 ,
      afdeling 3 van hoofdstuk 11, bijlage II, hoofdstuk III, en bijlagen VII en VIII van [verordening 1774/2002/EG]
      (32002R1774) of bijlage III van [verordening 780/2004/EG](32004R0780) blijkt dat zij is bestemd voor Nederland, tot
      en met de ontvangst door de handelaar;

      b. indien uit de in onderdeel a bedoelde documenten, dan wel de documenten bedoeld in
      [artikel 2.8a, eerste lid, onderdeel b][ref1], blijkt dat zij is bestemd voor een lid-staat of een derde land,
      tijdens het vervoer naar de plaats waar zij weer buiten Nederland wordt gebracht, vergezeld van desbetreffende
      documenten.

      2 De in het eerste lid bedoelde certificaten en documenten zijn originelen, waarvan de geldigheidsduur niet is
      verstreken en zijn, voorzover van toepassing, in overeenstemming met de voor het desbetreffende product geldende
      regelgeving van de Europese Gemeenschap opgesteld en afgegeven, en volledig ingevuld, gedagtekend en ondertekend in
      de Nederlandse, Engelse, Franse of Duitse taal.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.8a
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel2.9
