      EG tot vaststelling van een lijst van derde landen waaruit de lidstaten de invoer van vers vlees van pluimvee
      toestaan;



              beschikking 2001/471/EG:

                beschikking 2001/471/EG van de Europese Commissie van 8 juni 2001 tot vaststelling van voorschriften
      voor het regelmatig doen controleren van de algemene hygiëne door de exploitanten in inrichtingen overeenkomstig
