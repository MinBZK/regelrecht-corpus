  - number: '4.11'
    text: |-
      1 Ten bewijze dat is voldaan aan, voor zover van toepassing, de [artikelen 4.4 tot en met 4.8][ref1], is vers vlees
      van pluimvee dat is bestemd voor Nederland na een van Rijkswege ingesteld onderzoek voorzien van:

      a. een keurmerk als bedoeld in [artikel 4.2, eerste lid][ref2], indien het vlees is verkregen in een op grond van
      [artikel 4.16, eerste lid][ref3], erkende inrichting, dan wel

      b. een keurmerk als bedoeld in [artikel 4.10, eerste lid][ref4], indien het vlees is verkregen in een op grond van
      [artikel 4.16, tweede lid][ref5], erkende inrichting, dan wel

      2 Ten bewijze dat is voldaan aan, voor zover van toepassing, de [artikelen 4.4 tot en met 4.8][ref6] gaat een
      partij vers vlees van kippen, kalkoenen, parelhoenders, eenden of ganzen die is bestemd voor Nederland en afkomstig
      is uit een inrichting die is erkend op grond van [artikel 4.16, eerste lid][ref7], vergezeld van het volgende op de
      partij betrekking hebbend bewijsstuk, dat wordt afgegeven na een van Rijkswege ingesteld onderzoek:

      a. een begeleidend handelsdocument als bedoeld in [artikel 4.2, tweede lid, onderdeel a, onder 1°][ref8], dan wel,

      b. een keuringscertificaat als bedoeld in [artikel 4.2, tweede lid, onderdeel a, onder 2°][ref9], wanneer het
      gaat om een partij afkomstig van pluimvee dat is verkregen in een slachthuis dat is gelegen in een gebied of zone
      waarvoor om veterinairrechtelijke redenen beperkingen gelden.

      3 Het in het [artikel 4.2, tweede lid, onderdeel a, onder 1°][ref10], bedoelde handelsdocument wordt gedurende
      tenminste één jaar door de geadresseerde bewaard zodat het desgevraagd aan de keuringsdieren-arts kan worden
      overgelegd.

      4 De in het tweede lid bedoelde bewijsstukken worden afgegeven door de minister.


