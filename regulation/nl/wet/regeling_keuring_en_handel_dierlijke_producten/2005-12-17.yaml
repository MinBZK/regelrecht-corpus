  - number: 4.12a
    text: |-
      In afwijking van artikel 4.12, eerste lid, aanhef en onderdeel a, mag vers vlees van pluimvee dat afkomstig is
      uit Tsjechië, Estland, Cyprus, Letland, Litouwen, Hongarije, Malta, Polen, Slovenië of Slowakije en vóór 1 mei
      2004 is verkregen in een inrichting die erkend was voor uitvoer naar de Europese Gemeenschap, tot en met 30
      april 2005 voorzien zijn van het keurmerk, bedoeld in artikel 3, onderdeel a, van beschikking 2004/280/EG, mits
      het certificaat of document dat het vlees vergezelt, door de bevoegde autoriteiten van het land van herkomst is
      voorzien van de verklaring: ‘Vóór 1 mei 2004 geproduceerd overeenkomstig Beschikking 2004/280/EG van de Commissie.’
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel4.12a
  - number: '4.13'
    text: |-
      1 Een partij vers vlees van pluimvee die via Nederland voor het eerst op het grondgebied van de Europese
      Gemeenschap wordt gebracht en die is bestemd voor Nederland of een lidstaat, is afkomstig uit een derde land of een
      gedeelte van een derde land dat voor de betrokken diersoort waarvan het vlees afkomstig is, staat vermeld:

      a. in de lijst opgenomen in bijlage I bij beschikking 94/984/EG indien het vlees van pluimvee als bedoeld in
      [richtlijn 71/118/EG](31971L0118) betreft;

      b. in de lijst opgenomen in bijlage I bij beschikking 2000/585, indien het vlees van gekweekt vederwild, niet
      zijnde loopvogels, betreft, of

      c. in de lijst opgenomen in bijlage I bij beschikking 2000/609/EG indien het vlees van gekweekte loopvogels
      betreft,

      en voldoet aan de in de voornoemde beschikkingen opgenomen eisen ten aanzien van het derde land respectievelijk het
      gedeelte van het derde land van herkomst.

      2 Een partij vers vlees van pluimvee, bedoeld in het eerste lid, gaat vergezeld van:

      a. een gezondheidscertificaat waarvan het model overeenstemt met het model, vastgesteld in bijlage II bij
      beschikking 94/984/EG, indien het vlees van pluimvee als bedoeld in [richtlijn 71/118/EEG](31971L0118) betreft;

      b. een gezondheidscertificaat waarvan het model overeenstemt met het model dat voor de betrokken diersoort is
      vastgesteld in bijlage III bij beschikking 2000/585/EG, indien het vlees van gekweekt vederwild, niet zijnde
      loopvogels, betreft, of

      c. een gezondheidscertificaat waarvan het model overeenstemt met het model, vastgesteld in bijlage II bij
      beschikking 2000/609/EG, indien het vlees van gekweekte loopvogels betreft.

      3 Een partij vers vlees van pluimvee is voorzien van:

      a. het keurmerk, bedoeld in bijlage III bij beschikking 94/984/EG, indien het vlees van pluimvee als bedoeld in het
      tweede lid, onderdeel a, betreft, of

      b. een officieel keurmerk waaruit blijkt in welk slachthuis de dieren waarvan het vlees afkomstig is, zijn
      geslacht, dan wel in welke uitsnijderij het vlees is uitgesneden, indien het vlees van gekweekte loopvogels
      betreft.

      4 Een partij vers vlees van pluimvee voldoen aan de eisen die voor de betrokken diersoort waarvan het vlees
      afkomstig is, zijn vastgesteld in de onderscheiden gezondheidscertificaten, bedoeld in het tweede lid.

      5 Een partij vers vlees van pluimvee is afkomstig van een inrichting die is opgenomen op de lijst, bedoeld in
      artikel 2 van beschikking 95/408/EG.

      6 Een partij vers vlees van pluimvee is op hygiënische wijze verpakt en wordt op hygiënische wijze vervoerd,
      overeenkomstig [artikel 4.4, eerste lid, onderdeel f, onderscheidenlijk g][ref1], en vertoont geen tekenen van
      bederf of ondeugdelijkheid.

      7 Aan het pluimvee waarvan het vlees afkomstig is, zijn geen stoffen of producten toegediend die ingevolge artikel
      3, onderdeel a, van [richtlijn 96/22/EG](31996L0022) niet aan pluimvee mogen worden toegediend, tenzij aan de
      voorwaarden, bedoeld artikel 11 van [richtlijn 96/22/EG](31996L0022) is voldaan.


