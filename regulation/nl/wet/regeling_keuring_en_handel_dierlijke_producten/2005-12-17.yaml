  - number: '5.16'
    text: |-
      1 De exploitant of de eigenaar, dan wel diens vertegenwoordiger van een op grond van [artikel 5.13][ref1] erkende
      vrij-wildverwerkingsinrichting of van een vrij-wildverwerkingsinrichting waaraan onheffing is verleend als bedoeld
      in [artikel 12.6, derde lid][ref2]:

      a. controleert de algemene hygiëne van de werktuigen, installaties en machines in de vrij-wildverwerkingsinrichting
      in alle produktiestadia, alsmede, op aanwijzing van de keuringsdierenarts, de produkten regelmatig, ook door middel
      van microbiologische controles;

      b. stelt, op verzoek van de keuringsdierenarts, deze of de veterinaire deskundigen van de Commissie van de Europese
      Gemeenschappen in kennis van aard, frequentie en resultaat van de in onderdeel a bedoelde controles, alsmede, voor
      zover van toepassing, van de naam van het controlelaboratorium;

      c. zet, in samenwerking met de keuringsdierenarts, een opleidingsprogramma op dat het personeel van
      de inrichting in staat stelt te voldoen aan, voor zover van toepassing, de voorschriften, bedoeld in
      [artikel 5.14, eerste lid][ref3].

      2 De in het eerste lid bedoelde controles worden uitgevoerd overeenkomstig de beschikking van de Commissie van de
      Europese Gemeenschappen of de Raad van de Europese Unie op grond van artikel 7, tweede lid, laatste alinea, van
      [richtlijn 92/45/EEG](31992L0045), dan wel, zolang deze beschikking nog niet is vastgesteld, overeenkomstig hetgeen
      de minster daaromtrent heeft bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel5.13
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel12.6
      [ref3]: https://wetten.overheid.nl/BWBR0006727#Artikel5.14
