  - number: '1.2'
    text: |-
      1 De minister kan van het bepaalde in deze regeling vrijstelling of ontheffing verlenen.

      2 Aan een vrijstelling of ontheffing kunnen voorschriften of voorwaarden worden verbonden. Zij kunnen onder
      beperkingen worden verleend. Zij kunnen te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel1.2
  - number: '2.1'
    text: |-
      1 Het anders dan in doorvoer buiten Nederland brengen van producten, of ziekteverwekkers is
      verboden, voor zover dit niet reeds is verboden op grond van [artikel 68 van de Veewet][ref1] of
      [artikel 9 van het Destructiebesluit][ref2].

      2 Het brengen in Nederland van producten of ziekteverwekkers is verboden, voor zover dit niet reeds is verboden op
      grond van [artikel 9 van het Destructiebesluit][ref3].


