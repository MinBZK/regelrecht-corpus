  - number: '4.10'
    text: |-
      1 Vers vlees van pluimvee dat is verkregen in een op grond van [artikel 4.16, tweede lid][ref1], erkende
      inrichting, wordt voorzien van een keurmerk waarvan het model op grond van artikel 21 van [richtlijn 71/118/
      EEG](31971L0118) is vastgesteld bij beschikking van de Commissie van de Europese Gemeenschappen of de
      Raad van de Europese Unie, dan wel, zolang dit model nog niet is vastgesteld, een keurmerk als bedoeld in
      [artikel 4.2, eerste lid][ref2], waarop de letters ‘EEG’ worden vervangen door: GOEDGEKEURD.

      2 Vers vlees van pluimvee waarop een ‘GOEDGEKEURD’-keurmerk als bedoeld in het eerste lid is aangebracht, wordt
      uitsluitend bestemd voor de Nederlandse markt teneinde daar hetzij vers, hetzij na verwerking, rechtstreeks aan
      detailhandelaren of de consument te worden verkocht, of voor een derde land.

      3 Vers vlees van pluimvee dat is verkregen in een op grond van [artikel 4.16, eerste lid][ref3], erkende inrichting
      wordt voorzien van een keurmerk als bedoeld in [artikel 4.2, eerste lid][ref4].


