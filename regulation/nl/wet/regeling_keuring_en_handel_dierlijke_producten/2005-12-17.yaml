  - number: '2.10'
    text: |-
      1 Indien de partij in Nederland wordt gebracht via een inspectiepost, worden de in [artikel 2.9, eerste lid][ref1],
      bedoelde certificaten of documenten, alsmede de vergunning, bedoeld in [artikel 2.8, tweede lid][ref2], desverlangd
      door de handelaar overgelegd aan de keuringsdierenarts.

      2 Het eerste lid is niet van toepassing indien:

      a. de partij rechtstreeks via een geregelde lijndienst vanuit een inspectiepost wordt vervoerd naar een andere op
      het grondgebied van de Europese Gemeenschap gelegen plaats;

      b. de partij is verzonden vanuit een derde land en is bestemd voor een derde land.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2.8
