  - number: '2.21'
    text: |-
      1

      Noch op grond van artikel 22, eerste lid, eerste gedachtenstreepje, van [richtlijn 97/78/EG](31997L0078), noch
      op grond van andere regelgeving van de Europese Gemeenschap zijn maatregelen genomen houdende instelling van een
      verbod om de betrokken producten op het grondgebied van de Europese Gemeenschap, dan wel op het grondgebied van
      Nederland te brengen.

      2 Ten aanzien van de partij is, in voorkomend geval, voldaan aan de op grond van artikel 22, eerste lid, tweede
      en derde gedachtenstreepje, van [richtlijn 97/78/EG](31997L0078) dan wel op grond van andere regelgeving van de
      Europese Gemeenschap vastgestelde bijzondere voorschriften.
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel2.21
  - number: '2.22'
    text: |-
      1 De partij producten die voor Nederland is bestemd, gaat tijdens het vervoer over Nederlands grondgebied vanaf de
      inspectiepost naar de plaats van bestemming vergezeld van het document bedoeld in [artikel 2.19, eerste lid][ref1],
      en van het gewaarmerkt afschrift, bedoeld in [artikel 2.19, tweede lid][ref2].

      2 De partij producten die voor een lid-staat is bestemd, gaat tijdens het vervoer over Nederlands grondgebied vanaf
      de inspectiepost vergezeld van het document bedoeld in [artikel 2.19, eerste lid][ref3], en van het gewaarmerkte
      afschrift, bedoeld in [artikel 2.19, tweede lid][ref4].

      3 De partij producten die voor een derde land is bestemd, gaat, ongeacht of de partij in een douane-
      entrepot of een vrij entrepot in Nederland wordt opgeslagen dan wel daarin opgeslagen is geweest, tijdens het
      vervoer over Nederlands grondgebied vanaf de inspectiepost vergezeld van het originele document, bedoeld in
      [artikel 2.16, tweede lid, onderdeel c][ref5], en het document bedoeld in [artikel 2.19, eerste lid][ref6], waarin
      is aangegeven langs welke grensinspectiepost als bedoeld in artikel 2, tweede lid, onderdeel g, van [richtlijn
      97/78/EG](31997L0078), de partij de Europese Gemeenschap verlaat.

      4 De partij, bestemd voor een derde land, die:

      a. in een vrij entrepot of douane-entrepot in Nederland moet worden opgeslagen en die niet aan de in deze regeling
      voor het desbetreffende product gestelde voorschriften voor het brengen op Nederlands grondgebied voldoet, of

      b. in een vrij entrepot of douaneentrepot in Nederland wordt opgeslagen en die niet aan van toepassing zijnde
      voorschriften voor het brengen van de producten in de betreffende lidstaat voldoet, wordt onder douanetoezicht
      vervoerd, in een gesloten, geïdentificeerd, lekvrij en verzegeld vervoermiddel.

      5 Een partij als bedoeld in [artikel 2.16, derde lid][ref7], gaat vanaf de inspectiepost tijdens het vervoer
      over Nederlands grondgebied vergezeld van de in artikel 15, eerste lid, onderdeel a, van [richtlijn 97/78/EG]
      (31997L0078) genoemde documenten en van het document bedoeld in [artikel 2.19, eerste lid][ref8].

      6 Transportmiddelen voor vervoer over land die zijn gebruikt voor het vervoer van producten die niet aan in deze
      regeling voor het desbetreffende product gestelde voorschriften voor het brengen op Nederlands grondgebied voldoen,
      worden, indien nodig, na het gebruik gereinigd en ontsmet.


