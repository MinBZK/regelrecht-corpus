  - number: '11.5'
    text: |-
      Indien het een in [artikel 11.2][ref1] genoemde partij betreft, is, voor zover van toepassing, voldaan aan de
      in bijlage II, hoofdstuk 2, 3 en 4, van [richtlijn 92/118/EEG](31992L0118) vastgestelde voorschriften of aan de
      bij beschikking van de Commissie van de Europese Gemeenschappen of de Raad van de Europese Unie overeenkomstig
      hoofdstuk 2 van bijlage II van [richtlijn 92/118/EEG](31992L0118) voor het intra-communautaire handelsverkeer in
      deze producten vastgestelde voorschriften, voorzover deze veterinairrechtelijk van aard zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel11.2
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel11.5
