  - number: '2.19'
    text: |-
      1 Met betrekking tot de partij is door de minister, bedoeld in [artikel 2.17, tweede lid][ref1], een
      Gemeenschappelijk veterinair document van binnenkomst als bedoeld in [verordening 136/2004/EG](32004R0136)
      afgegeven.

      2 Onverminderd het eerste lid is met betrekking tot de voor Nederland of een lidstaat bestemde partij door de
      minister een gewaarmerkt afschrift als bedoeld in artikel 7, vierde lid, van [richtlijn 97/78/EG](31997L0078),
      afgegeven.

      3 Indien de partij in de inspectiepost in meerdere delen is gesplitst, geldt het eerste lid voor elk van de
      deelpartijen.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.17
