  - number: '11.7'
    text: |-
      De in [artikel 11.2][ref1] genoemde overige dierlijke producten die zijn verzonden vanuit een lid-staat en
      zijn bestemd voor Nederland of een lid-staat, gaan vergezeld van het voor de desbetreffende productsoort in
      [artikel 11.2][ref2] genoemde handelsdocument of certificaat en voldoen aan hetgeen omtrent het intracommunautaire
      handelsverkeer in de desbetreffende productsoort is bepaald in [richtlijn 92/118/EEG](31992L0118).


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel11.2
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel11.2
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel11.7
