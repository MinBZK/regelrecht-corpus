  - number: '12.6'
    text: |-
      1 De Tijdelijke regeling erkenning vrij-wildverwerkingsinrichtingen wordt ingetrokken.

      2 Erkenningen als bedoeld in en verleend op grond van de in het eerst lid genoemde regeling zijn erkenningen als
      bedoeld in en verleend op grond van [artikel 5.13][ref1], met dien verstande dat wordt voldaan aan dat artikel.

      3 Ontheffingen die zijn verleend op grond van artikel 6, eerste lid, van de in het eerste lid genoemde regeling,
      blijven van kracht, met inachtneming van hetgeen in deze regeling is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel5.13
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel12.6
