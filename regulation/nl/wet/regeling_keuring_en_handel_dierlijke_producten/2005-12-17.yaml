  - number: '9.2'
    text: |-
      1 Gehakt vlees van runderen, varkens, schapen of geiten dat anders dan in doorvoer buiten Nederland wordt gebracht
      en is bestemd voor een lid-staat, is voorzien van een keurmerk overeenkomstig hoofdstuk VI van bijlage I van
      [richtlijn 94/65/EG](31994L0065).

      2 Gehakt vlees dat anders dan in doorvoer buiten Nederland wordt gebracht en is bestemd voor een derde land, is
      voorzien van:

      a. het keurmerk, bedoeld in het eerste lid, indien het gehakt vlees van runderen, varkens, schapen of geiten
      betreft dat overeenkomstig [artikel 9.3][ref1] is verkregen;

      b. het merk, bedoeld in artikel 7 van de Warenwetregeling produktie en handel gehakt vlees en vleesbereidingen,
      indien het gehakt vlees betreft dat overeenkomstig die regeling is verkregen, onderscheidenlijk

      c. het merk, bedoeld in [artikel 9.8][ref2], indien het gehakt vlees van kippen, kalkoenen, parelhoenders, eenden,
      ganzen, gekweekt of vrij vederwild, klein vrij wild, dan wel gekweekte konijnen of hazen betreft.

      3 Een partij gehakt vlees als bedoeld in het eerste lid gaat vergezeld van een begeleidend handelsdocument als
      bedoeld in artikel 3, eerste lid, onderdeel g, van [richtlijn 94/65/EG](31994L0065).

      4 Ten aanzien van gehakt vlees dat anders dan in doorvoerbuiten Nederland wordt gebracht, is voldaan aan de
      eisen, gesteld in de artikelen 4, eerste, tweede en zesde lid, 8, eerste lid, 9, eerste en derde lid, en 13 van
      [verordening 1829/2003](32003R1829).

      5 Het is een exploitant als bedoeld in artikel 3, vijfde lid, van [verordening 1830/2003](32003R1830), voorzover
      zijn activiteiten betrekking hebben op gehakt vlees, verboden te handelen in strijd met de artikelen 4, eerste,
      tweede, vierde en zesde lid, en 5, eerste en tweede lid, van die verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel9.3
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel9.8
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel9.2
