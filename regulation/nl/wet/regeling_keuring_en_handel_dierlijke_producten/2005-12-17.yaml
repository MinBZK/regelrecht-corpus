  - number: '2.11'
    text: |-
      1 De handelaar geeft van elke aanvoer van een partij kennis aan de VWA. De kennisgeving geschiedt tussen 8.00 uur
      en 17.00 uur en ten laatste op de dag, niet zijnde een zaterdag, zondag of algemeen erkende feestdag, voorafgaande
      aan de dag van aankomst op de plaats van ontvangst. Bij de kennisgeving wordt de plaats en het vermoedelijke
      tijdstip van aankomst alsmede de hoeveelheid en de soort dieren of producten opgegeven.

      2 Op last van de in het eerste lid bedoelde keuringsdierenarts biedt de handelaar de aangevoerde partij aan die
      keuringsdierenarts ten onderzoek aan en overlegt hij hem de op die partij betrekking hebbende certificaten of
      documenten, bedoeld in [artikel 2.9, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.9
