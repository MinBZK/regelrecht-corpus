              2000/571/EG:

                beschikking van de Commissie van de Europese Gemeenschappen van 8 september 2000 tot vaststelling van
      de methoden voor de veterinaire controles van producten uit derde landen die bestemd zijn voor een vrije zone, een
      vrij entrepot, een douane-entrepot of een handelaar die levert aan grensoverschrijdende zeevervoermiddelen (PbEG
      L 240);



              beschikking 2000/572/EG:

                beschikking (EG) nr. 2000/572 van de Commissie van de Europese Gemeenschappen van 8 september 2000
      houdende vaststelling van veterinairrechtelijke voorschriften, gezondheidsvoorschriften en voorschriften inzake de
      veterinaire certificering voor de invoer in de Gemeenschap van vleesbereidingen uit derde landen (PbEG L 240);



              beschikking 2000/585/EG:

                beschikking (EG) nr. 2000/585 van de Commissie van de Europese Gemeenschappen van 7 september 2000
      houdende vaststelling van een lijst van derde landen waaruit de lidstaten de invoer toestaan van konijnenvlees
