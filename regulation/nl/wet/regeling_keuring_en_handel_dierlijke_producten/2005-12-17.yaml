preamble:
  text: |-
    Gelet op richtlijn nr. 88/657/EEG van de Raad van de Europese Gemeenschappen van 14 december 1988 tot vaststelling
    van de eisen voor de productie en het handelsverkeer in gehakt, vlees in stukken van minder dan 100 gram en
    vleesbereidingen en tot wijziging van de Richtlijnen 64/433/EEG, 71/118/EEG en 72/462/EEG (PbEG L 395), richtlijn
    nr. 89/662/EEG van de Raad van de Europese Gemeenschappen van 11 december 1989 inzake veterinaire controles in het
    intracommunautaire handelsverkeer in het vooruitzicht van de totstandbrenging van de interne markt (PbEG L 395),
    richtlijn nr. 90/675/EEG van de Raad van de Europese Gemeenschappen van 10 december 1990 tot vaststelling van de
    beginselen voor de organisatie van de veterinaire controles voor producten uit derde landen die in de Gemeenschap
    worden binnengebracht (PbEG L 373), richtlijn nr. 91/494/EEG van de Raad van de Europese Gemeenschappen van 26
    juni 1991 tot vaststelling van veterinairrechtelijke voorschriften voor het intra-communautaire handelsverkeer en
    de invoer uit derde landen van vers vlees van pluimvee (PbEG L 268), richtlijn nr. 91/495/EEG van de Raad van de
    Europese Gemeenschappen van 27 november 1991 inzake gezondheidsvoorschriften en veterinairrechtelijke voorschriften
    voor de productie en het in de handel brengen van konijnevlees en vlees van gekweekt wild (PbEG L 268), richtlijn
    nr. 92/45/EEG van de Raad van de Europese Gemeenschappen van 16 juni 1992 betreffende de gezondheidsvoorschriften
    en veterinairrechtelijke voorschriften voor het doden van vrij wild en het in de handel brengen van vlees van
    vrij wild (PbEG L 268), richtlijn nr. 92/116/EEG van de Raad van de Europese Gemeenschappen van 17 december
    1992 tot wijziging en bijwerking van Richtlijn 71/118/EEG inzake gezondheidsvoorschriften op het gebied van het
    handelsverkeer in vers vlees van pluimvee (PbEG 1993, L 62), richtlijn nr. 92/118/EEG van de Raad van de Europese
    Gemeenschappen van 17 december 1992 tot vaststelling van de veterinairrechtelijke en de gezondheidsvoorschriften
    voor het handelsverkeer en de invoer in de Gemeenschap van producten waarvoor ten aanzien van deze voorschriften
    geen specifieke communautaire regelgeving geldt als bedoeld in bijlage A, hoofdstuk I, van Richtlijn 89/662/EEG,
    en, wat ziekteverwekkers betreft, van Richtlijn 90/425/EEG (PbEG 1993, L 62) en richtlijn nr. 93/121/EG van de
    Raad van de Europese Unie van 22 december 1993 houdende wijziging van Richtlijn 91/494/EEG tot vaststelling van
    veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer en de invoer uit derde landen van
    vers vlees van pluimvee (PbEG L 340);

    Gelet op de artikelen 10, 11, eerste lid, onderdeel b, 13, tweede lid, 81, tweede tot en met vierde lid, 105 en
    107 van de Gezondheids- en welzijnswet voor dieren, de artikelen 19, 26, 27 en 28 van de Landbouwwet, artikel 2,
    onderdeel b, van het Besluit uitvoer dieren en producten van dierlijke oorsprong en de artikelen 2, 4, 5 en 6 van
    het Besluit inzake het in de handel brengen van dieren en producten en de toepassing van maatregelen met betrekking
    tot in Nederland gebrachte dieren en producten;

    Gezien het advies van de Raad voor dierenaangelegenheden, het productschap voor Pluimvee en Eieren, het
    Bedrijfschap voor de Pluimveehandel- en industrie en de Vereniging van de Nederlandse Pluimveeverwerkende
    Industrie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#ArtikelAanhef
