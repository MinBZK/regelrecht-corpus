  - number: '12.10'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel12.10
  - number: '12.11'
    text: |-
      Deze regeling wordt aangehaald als: Regeling keuring en handel dierlijke produkten.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel12.11
