  - number: 2.23j
    text: |-
      Een handelaar die de in [artikel 2.23g][ref1] bedoelde producten aflevert aan zeevervoermiddelen als proviand voor
      bemanning en passagiers:

      a. voldoet aan artikel 13, eerste lid, onderdeel e, van [richtlijn 97/78/EG](31997L0078), met dien verstande de
      bevoegde autoriteit, bedoeld in dat onderdeel, de keuringsdierenarts is;

      b. voldoet aan artikel 13, tweede lid, onderdelen a en b, van [richtlijn 97/78/EG](31997L0078) met, voor zover
      van toepassing, inachtneming van artikel 5 tweede en derde lid van beschikking 2000/571/EG, met dien verstande
      dat onder de bevoegde autoriteit van het havengebeid waaruit wordt geleverd bedoeld in artikel 13, tweede lid,
      onderdeel b, van [richtlijn 97/78/EG](31997L0078) wordt verstaan de keuringsdierenarts en met dien verstande dat
      onder een speciaal erkend entrepot in de haven van bestemming als bedoeld in artikel 13, tweede lid, onderdeel a,
      eerste zin, van [richtlijn 97/78/EG](31997L0078) wordt verstaan, voorzover het een in Nederland gelegen entrepot
      betreft, een entrepot als bedoeld in [artikel 2.23a, tweede lid][ref2];

      c. overlegt aan de keuringsdierenarts een officieel bewijsstuk dat de producten de eindbestemming hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23g
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23a
