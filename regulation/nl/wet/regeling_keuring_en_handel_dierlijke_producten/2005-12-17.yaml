  - number: '10.2'
    text: |-
      1 Vleesbereidingen, niet zijnde vleesbereidingen van vlees van eenhoevigen, die anders dan in doorvoer buiten
      Nederland worden gebracht en zijn bestemd voor een lid-staat, zijn voorzien van een keurmerk overeenkomstig
      hoofdstuk VI van bijlage I van [richtlijn 94/55/EG](31994L0055).

      2 Vleesbereidingen die anders dan in doorvoer buiten Nederland worden gebracht en zijn bestemd voor een derde land,
      zijn voorzien van:

      a. het keurmerk, bedoeld in het eerste lid, indien het vleesbereidingen, niet zijnde vleesbereidingen van vlees van
      eenhoevigen, betreft die voldoen aan [artikel 10.3][ref1];

      b. het merk, bedoeld in artikel 7 van de Warenwetregeling produktie en handel gehakt vlees en vleesbereidingen,
      indien het vleesbereidingen betreft die overeenkomstig die regeling zijn verkregen, onderscheidenlijk;

      c. het merk, bedoeld in [artikel 10.8][ref2], indien het vleesbereidingen van kippen, kalkoenen, parelhoenders,
      eenden, ganzen, gekweekt of vrij vederwild, klein vrij wild, dan wel gekweekte konijnen of hazen betreft, die
      voldoen aan [artikel 10.6 tot en met 10.8][ref3].

      3 Een partij vleesbereidingen als bedoeld in het eerste lid gaat vergezeld van een begeleidend
      gezondheidscertificaat als bedoeld in artikel 5, tweede lid, onderdeel f, van [richtlijn 94/65/EG](31994L0065).

      4 Ten aanzien van vleesbereidingen die anders dan in doorvoer buiten Nederland worden gebracht, is voldaan aan de
      eisen, gesteld in de artikelen 4, eerste, tweede en zesde lid, 8, eerste lid, 9, eerste en derde lid, en 13 van
      [verordening 1829/2003](32003R1829).

      5 Het is een exploitant als bedoeld in artikel 3, vijfde lid, van [verordening 1830/2003](32003R1830), voorzover
      zijn activiteiten betrekking hebben op vleesbereidingen, verboden te handelen in strijd met de artikelen 4, eerste,
      tweede, vierde en zesde lid, en 5, eerste en tweede lid, van die verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel10.3
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel10.8
      [ref3]: https://wetten.overheid.nl/BWBR0006727#Artikel10.6
