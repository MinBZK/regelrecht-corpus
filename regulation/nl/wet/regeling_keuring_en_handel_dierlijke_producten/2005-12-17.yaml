  - number: '9.15'
    text: |-
      1 Dit hoofdstuk is, met uitzondering van [artikel 9.6, onderdeel a][ref1], niet van toepassing op het in de handel
      brengen gehakt vlees dat is bestemd voor gebruik als bedoeld in artikel 3, onderdeel III, van [richtlijn 71/118/
      EEG](31971L0118).

      2 Dit hoofdstuk is voorts niet van toepassing op gehakt vlees dat is bestemd en wordt aangewend als grondstof voor
      de vervaardiging van vleesbereidingen of vleesprodukten.

      3 Afdeling 3 is niet van toepassing op het in de handel brengen van gehakt vlees dat in detailhandelszaken of
      aan verkooppunten grenzende werkplaatsen wordt vervaardigd, teneinde aldaar rechtstreeks aan de eindverbruiker te
      worden verkocht.

      4 Ten aanzien van gehakt vlees als bedoeld in het tweede lid geldt, in voorkomend geval en voor zover van
      toepassing:

      a. het bepaalde bij of krachtens het [Besluit produktie en handel vers vlees][ref2],
      het [Besluit inzake vlees uit andere lid-staten][ref3], dan wel het Besluit invoer
      vlees uit derde landen of de [Regeling in- en doorvoer vlees 1979][ref4], dan wel de
      [Regeling uitvoer vers vlees en vleesbereidingen 1985][ref5], indien het gehakt vlees van runderen, varkens,
      schapen, geiten of eenhoevigen betreft;

      b. [hoofdstuk 4][ref6], indien het gehakt vlees van pluimvee of van gekweekt vederwild betreft;

      c. [hoofdstuk 5][ref7], onderscheidenlijk het bepaalde bij of krachtens het
      [Besluit produktie en handel vlees van vrij wild][ref8], het [Besluit inzake vlees uit andere lid-staten][ref9],
      dan wel het Besluit invoer vlees uit derde landen, indien het gehakt vlees van vrij wild betreft;

      d. het bepaalde bij of krachtens het [Besluit produktie en handel vers vlees][ref10],
      het [Besluit inzake vlees uit andere lid-staten][ref11], dan wel het Besluit invoer
      vlees uit derde landen of de [Regeling in- en doorvoer vlees 1979][ref12], dan wel de
      [Regeling uitvoer vers vlees en vleesbereidingen 1985][ref13], indien het gehakt vlees van gekweekt wild betreft,

      e. de [Regeling invoer konijne- en hazevlees 1993][ref14], onderscheidenlijk de
      [Regeling keuring en handelsverkeer konijne- en hazevlees 1993][ref15], indien het gehakt vlees van konijnen of
      hazen als bedoeld in die regelingen betreft, met dien verstande dat, indien het gehakte vlees is bestemd voor een
      lid-staat het voldoet aan de voorschriften van die lid-staat.

      5 In gevallen als bedoeld in het derde lid zijn de voorschriften voor het uitoefenen van de detailhandel van
      toepassing.


