  - number: '11.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:



             handelsdocument:

              document waarop de aard van het product, de naam en, voorzover van toepassing, het erkenningsnummer van de
      geregistreerde inrichting, bedoeld in artikel 4, tweede lid, van [richtlijn 92/118/EEG](31992L0118), zijn vermeld;



            lid-staat:

              lid-staat, alsmede Noorwegen;



            derde land:

              land, niet zijnde Nederland of een andere lid-staat van de Europese Unie, en niet zijnde Noorwegen.
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel11.1
  - number: '11.2'
    text: |-
      Het bewijsstuk, onderscheidenlijk de bewijsstukken, bedoeld in [artikel 2.2, tweede lid, onderdeel e][ref1], is,
      onderscheidenlijk zijn:

      a. indien het een partij voor menselijke consumptie bestemde honing betreft, een handelsdocument;

      b. indien het een partij voor menselijke consumptie bestemde slakken, voor menselijke consumptie bestemde
      kikkerbillen of voor menselijke consumptie bestemde eieren betreft, een handelsdocument;

      c. indien het een partij voor menselijke consumptie bestemde gelatine of grondstoffen voor gelatine betreft,
      handelsdocumenten als bedoeld in bijlage II, hoofdstuk 4, Sectie A, paragraaf III, onderdeel 1, en paragraaf VI,
      onderdeel 3, van [Richtlijn 92/118/EEG](31992L0118);

      d. indien het een partij voor menselijke consumptie bestemd collageen of grondstoffen voor collageen betreft,
      handelsdocumenten als bedoeld in bijlage II, hoofdstuk IV, Sectie B, paragraaf IV, onderdeel 2, en paragraaf VII,
      onderdeel 3, van [Richtlijn 92/118/EEG](31992L0118).


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel11.2
