  - number: 4.4a
    text: |-
      1 Pluimvee dat ter slachting wordt aangeboden is afkomstig van een houderij waarvan de eigenaar of houder:

      a. is geregistreerd in een door de de minister, en

      b. voor ieder koppel afzonderlijk de administratieve gegevens bijhoudt als bedoeld in hoofdstuk VI, punt 27,
      onderdeel a, van bijlage I van [richtlijn 71/118/EEG](31971L0118), met dien verstande dat deze gegevens gedurende
      ten minste twee jaar worden bewaard om ze desgevraagd aan de keuringsdierenarts of diens assistent over te leggen.

      2 Ten aanzien van ieder koppel pluimvee is een verklaring dan wel een document toegezonden als bedoeld in punt 25,
      onderdeel a, van hoofdstuk VI van bijlage I van [richtlijn 71/118/EEG](31971L0118), met dien verstande dat indien
      een document als bedoeld onder ii van voornoemd onderdeel a wordt toegezonden, het model daarvan overeenstemt
      met het model opgenomen in bijlage A van deze regeling, dan wel een model dat ten minste de gegevens bevat als
      opgenomen in het model van voornoemde [bijlage A][ref1], alsmede dat per koppel een afzonderlijk document wordt
      gebruikt en dit document maximaal 72 en minimaal 24 uur vóór het slachten aan de keuringsdierenarts of diens
      assistent in het slachthuis wordt overgelegd. Een verklaring of document hoeft niet te worden toegezonden indien is
      voldaan aan punt 25, onderdeel c, van hoofdstuk VI van bijlage I van [richtlijn 71/118/EEG](31971L0118).

      3 Indien niet aan het eerste of tweede lid is voldaan, neemt de keuringsdierenarts de maatregelen bedoeld in punt
      25, onderdeel b, van hoofdstuk VI van bijlage I van [richtlijn 71/118/EEG](31971L0118).


      [ref1]: https://wetten.overheid.nl/BWBR0006727
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel4.4a
    references:
      - id: ref1
        bwb_id: BWBR0006727
  - number: '4.5'
    text: |-
      1 Vers vlees van pluimvee, voor zover het delen van karkassen of uitgebeend vlees betreft:

      a. is uitgesneden of uitgebeend in een op grond van [artikel 4.16, eerste lid, onderdeel b][ref1], of, met
      inachtneming van [artikel 4.10][ref2], op grond van [artikel 4.16, tweede lid, onderdeel b][ref3], erkende
      uitsnijderij, waar de controles worden verricht, bedoeld in [artikel 4.19][ref4];

      b. is uitgesneden en verkregen overeenkomstig hoofdstuk VII en X van bijlage I van [richtlijn 71/118/EEG]
      (31971L0118) en afkomstig van:

        - karkassen die aan [artikel 4.4][ref5] voldoen, dan wel
        - karkassen, delen daarvan of uitgebeend vlees die of dat overeenkomstig afdeling 4, onderscheidenlijk 5 van
      dit hoofdstuk in Nederland zijn of is gebracht, met dien verstande dat zolang de voorschriften voor het op het
      grondgebied van de Europese Gemeenschap brengen van vers vlees van pluimvee vanuit derde landen nog niet volledig
      ingevolge de regelgeving van de Europese Gemeenschap zijn vastgesteld, het ompakken of verwerken van uit een derde
      land afkomstig vlees dat wordt bestemd voor een lid-staat slechts is toegestaan, indien is voldaan aan de eisen van
      de lid-staat van bestemming;

      c. is op voldoende hygiënische wijze behandeld overeenkomstig hoofdstuk VII van bijlage I van [richtlijn 71/118/
      EEG](31971L0118);

      d. is in de erkende uitsnijderij van een onmiddellijke of een eindverpakking voorzien overeenkomstig hoofdstuk XIV
      van bijlage I van [richtlijn 71/118/EEG](31971L0118);

      e. is onder bevredigende hygiënische omstandigheden en met inachtneming van hoofdstuk XIII van bijlage I van
      [richtlijn 71/118/EEG](31971L0118) opgeslagen in een op grond van [artikel 4.16][ref6] erkende inrichting;

      f. wordt vervoerd overeenkomstig hoofdstuk XV van bijlage I van [richtlijn 71/118/EEG](31971L0118).

      2 Separatorvlees:

      a. is verkregen in een voor pluimveevlees erkende uitsnijderij en wordt geproduceerd onder stringente hygiënische
      voorwaarden;

      b. is niet verkregen van onderpoten of koppen van pluimvee;

      c. is verkregen in een verwerkingsruimte waarin de temperatuur ten hoogste 12° C bedraagt en de temperatuur
      van de bij de verwerking van de beenderen verkregen substantie tijdens deze verwerking niet meer stijgt dan
      technisch onvermijdbaar is, met dien verstande dat de beenderen zijn verwerkt in een machine die is vervaardigd
      van corrosiebestendig materiaal dat gemakkelijk is te reinigen en in goede staat van onderhoud en schoon wordt
      gehouden;

      d. is na verkrijging onverwijld op een temperatuur van ten hoogste 4° C, dan wel ten hoogste -12° C (bevroren
      toestand), dan wel ten hoogste -18° C (diepgevroren toestand) gebracht, met dien verstande dat:

        - in het eerste geval het separatorvlees binnen 48 uur wordt verwerkt; in bedrijven waar de productie plaatsvindt
      in een ononderbroken procesgang kan deze termijn worden verlengd tot 72 uur na verkrijging van het separatorvlees,
      wanneer na verkrijging van het separatorvlees twee dagen niet wordt gewerkt;
        - in het tweede en derde geval het separatorvlees binnen drie maanden wordt verwerkt;

      e. is voorzien van een label waarop het erkenningsnummer van de uitsnijderij, onderscheidenlijk het
      verwerkingsbedrijf waarin het is verkregen, alsmede de datum van verkrijging zijn vermeld;

      f. bevat ten hoogste 0,25% calcium en is vrij van metaaldeeltjes, met dien verstande dat de botdeeltjes in de pulp
      niet groter zijn dan 1 mm en het botgehalte ten hoogste 1% is;

      g. wordt aangewend en is bestemd als grondstof voor in Nederland vervaardigde vleesproducten als bedoeld in artikel
      2 van [richtlijn 77/99/EEG](31977L0099), dan wel is bestemd voor een derde land;

      h. wordt, indien gekoeld, in gekoelde toestand en, indien bevroren, in bevroren toestand vervoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel4.16
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel4.10
