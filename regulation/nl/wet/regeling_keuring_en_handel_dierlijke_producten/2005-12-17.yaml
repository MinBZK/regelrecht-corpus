              beschikking 2000/609/EG:

                beschikking (EG) nr. 2000/609 van de Commissie van de Europese Gemeenschappen van 12 oktober 2000 (PbEG
      L 258) tot vaststelling van veterinairrechtelijke voorschriften, gezondheidsvoorschriften en voorschriften inzake
