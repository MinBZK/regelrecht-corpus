  - number: '4.21'
    text: |-
      1 Het laten vervaardigen en het in voorraad hebben van de in dit hoofdstuk genoemde merken, alsmede het in
      inrichtingen waar pluimvee wordt geslacht of be- of verwerkt, voorhanden hebben van stempels en andere werktuigen
      waarmee deze merken kunnen worden vervaardigd of aangebracht, is slechts toegestaan met toestemming van de
      minister. Aan deze toestemming kunnen voorschriften en voorwaarden worden verbonden. Deze toestemming kan onder
      beperkingen worden verleend.

      2 Het gebruik van de in dit hoofdstuk genoemde merken is slechts toegestaan in een op grond van
      [artikel 4.16][ref1] erkende inrichting.


