  - number: '10.8'
    text: |-
      1 Vleesbereidingen worden na een van Rijkswege ingesteld onderzoek voorzien van het merk, bedoeld in
      [artikel 10.2, eerste lid][ref1], waarop de letters ‘EEG’ zijn vervangen door ‘GOEDGEKEURD’, ten bewijze dat is
      voldaan aan de [artikelen 10.6][ref2] en [10.7][ref3].

      2 In afwijking van het eerste lid mogen vleesbereidingen na een van Rijkswege ingesteld onderzoek worden voorzien
      van het merk, bedoeld in [artikel 10.2, eerste lid][ref4], indien, voor zover van toepassing, is voldaan aan
      [artikel 10.3][ref5].


