  - number: '3.1'
    text: |-
      1 Het produceren, verwerken en distribueren van producten van dierlijke oorsprong, die zijn bestemd voor menselijke
      consumptie, is verboden.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing indien is voldaan aan de
      [artikelen 3.2 tot en met 3.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '3.2'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.2'
    text: |-
      Producten van dierlijke oorsprong, die zijn bestemd voor menselijke consumptie, zijn verkregen van dieren die
      voldoen aan alle veterinaire voorschriften in de voor de desbetreffende diersoort vastgestelde communautaire
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel3.2
  - number: '3.3'
    text: |-
      Producten van dierlijke oorsprong, die zijn bestemd voor menselijke consumptie, zijn verkregen van dieren die
      niet afkomstig zijn van een bedrijf of inrichting, een grondgebied of een deel van een grondgebied, waar voor de
      betrokken dieren en producten van dierlijke oorsprong om veterinairrechtelijke redenen vastgestelde beperkende
      maatregelen gelden op grond van de in bijlage I bij [richtlijn 2002/99/EG](32002L0099) genoemde communautaire
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel3.3
  - number: '3.4'
    text: |-
      Vlees en vleesproducten zijn niet verkregen van dieren die zijn gedood in een inrichting waar bij de slacht of
      tijdens de productie dieren, dan wel karkassen, of delen daarvan, aanwezig waren die besmet waren met of werden
      verdacht van een van de ziekten, bedoeld in de communautaire maatregelen genoemd in bijlage I bij [richtlijn
      2002/99/EG](32002L0099).
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel3.4
  - number: '3.5'
    text: |-
      Aquacultuurproducten en aquacultuurdieren waarvan aquacultuurproducten afkomstig zijn voldoen aan [richtlijn 91/67/
      EEG](31991L0067) en, voor zover van toepassing, aan de op grond van artikel 4, tweede lid, van [richtlijn 2002/99/
      EG](32002L0099) vastgestelde communautaire maatregelen.
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel3.5
  - number: '3.6'
    text: |-
      1 De minister kan toestemming verlenen voor de productie, verwerking en distributie van producten van dierlijke
      oorsprong, die zijn bestemd voor menselijke consumptie, afkomstig van een grondgebied of een deel van een
      grondgebied ten aanzien waarvan om veterinairrechtelijke redenen vastgestelde beperkende maatregelen gelden,
      voorzover:

      a. de producten van dierlijke oorsprong niet afkomstig zijn van een bedrijf dat besmet is of waarvan vermoed wordt
      dat het besmet is met een van de ziekten waarvoor de in artikel 3.3 bedoelde maatregelen gelden;

      b. de om veterinairrechtelijke redenen vastgestelde beperkende maatregelen, bedoeld in bijlage I bij [richtlijn
      2002/99/EG](32002L0099) in acht zijn genomen;

      c. de producten, in afwachting van de in onderdeel e bedoelde behandeling, bij de vervaardiging, de
      hantering, het vervoer en de opslag in tijd of ruimte gescheiden zijn gehouden van producten die wel aan alle
      veterinairrechtelijke voorschriften voldoen, en de voorwaarden voor het vervoer buiten het grondgebied ten
      aanzien waarvan om veterinairrechtelijke redenen vastgestelde beperkende maatregelen gelden door de minister zijn
      goedgekeurd;

      d. de te behandelen producten van dierlijke oorsprong naar behoren zijn geïdentificeerd;

      e. de producten van dierlijke oorsprong een behandeling ondergaan die voldoende is om het betrokken
      veterinairrechtelijke probleem te verhelpen;

      f. de behandeling wordt toegepast in een inrichting die daartoe erkend is door de bevoegde autoriteit van de
      lidstaat waar het veterinairrechtelijke probleem zich heeft voorgedaan.

      2 De onderdelen c tot en met f van het eerste lid worden toegepast overeenkomstig:

      a. de bijlagen II en III, punt 1, van [richtlijn 2002/99/EG](32002L0099);

      b. de op grond van artikel 4, eerste lid, van [richtlijn 2002/99/EG](32002L0099) vastgestelde communautaire
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel3.6
  - number: '3.7'
    text: |-
      In afwijking van de [artikelen 3.2 tot en met 3.6][ref1] zijn de communautaire maatregelen die op grond van
      artikel 4, derde lid, van [richtlijn 2002/99/EG](32002L0099) worden vastgesteld van toepassing op de producten van
      dierlijke oorsprong, bestemd voor menselijke consumptie.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '3.2'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.8'
    text: |-
      1 Producten van dierlijke oorsprong, die zijn bestemd voor menselijke consumptie, afkomstig uit een derde land:

      a. zijn afkomstig uit een derde land, of een deel van een derde land, dat voorkomt op de lijst die op grond van
      artikel 8, eerste lid, van [richtlijn 2002/99/EG](32002L0099) is vastgesteld;

      b. voldoen aan de op grond van artikel 8, derde lid, van [richtlijn 2002/99/EG](32002L0099) vastgestelde
      oorsprongregels;

      c. voldoen aan de op grond van artikel 8, vierde lid, van [richtlijn 2002/99/EG](32002L0099) vastgestelde
      bijzondere invoervoorschriften;

      d. voldoen aan de op grond van artikel 8, vijfde lid, van [richtlijn 2002/99/EG](32002L0099) vastgestelde andere
      voorschriften.

      e. gaan vergezeld van het veterinair certificaat dat voldoet aan de eisen van bijlage IV bij [richtlijn 2002/99/
      EG](32002L0099) en de op grond van artikel 9, tweede en vierde lid, van [richtlijn 2002/99/EG](32002L0099)
      vastgestelde voorschriften voor invoer en doorvoer.

      2 De [artikelen 3.2 tot en met 3.7][ref1] zijn van overeenkomstige toepassing op de producten, bedoeld in het
      eerste lid.

      3 Het eerste en tweede lid zijn alleen van toepassing indien voor het desbetreffende product van dierlijke
      oorsprong, dat is bestemd voor menselijke consumptie, communautaire maatregelen zijn vastgesteld.

      4 In afwijking van het eerste tot en met derde lid is het tot 31 december 2005 toegestaan de producten, bedoeld
      in beschikking 79/542/EEG, 94/984/EG, 97/221/EG, 2000/572/EG, 2000/585/EG, 2000/609/EG, 2003/779/EG of 2004/438/
      EG, die voor 1 januari 2005 zijn opgeslagen in een douane-entrepot, vrije zone of vrij entrepot dat is erkend op
      grond van [artikel 2.23c][ref2], of bij een handelaar die levert aan grensoverschrijdende zeevervoermiddelen die
      is erkend op grond van [artikel 2.23g][ref3], in geheel of in gedeelten te vervoeren naar de plaats van bestemming,
      zonder dat deze producten vergezeld gaan van het voor het desbetreffende product vastgestelde veterinair
      certificaat, bedoeld in of gebaseerd op beschikking 79/542/EEG, 94/984/EG, 97/221/EG, 2000/572/EG, 2000/585/EG,
      2000/609/EG, 2003/779/EG of 2004/438/EG.

      5 Producten als bedoeld in het vierde lid, die zijn opgeslagen in een douane-entrepot, een vrije zone, een vrij
      entrepot of in inrichtingen van een handelaar die levert aan grensoverschrijdende zeevervoermiddelen in een
      lidstaat, worden alleen uitgeslagen voor vervoer naar een grensinspectiepost van vertrek voor verder vervoer
      naar een bestemming, indien de voor dergelijke producten verantwoordelijke persoon een document overlegt houdende
      toestemming van de doorvoer over of de invoer op het grondgebied van het derde land of het aan boord brengen van
      het vaartuig van deze producten wordt toegestaan. Deze toestemming is verstrekt door:

      a. de bevoegde autoriteit van het derde land van bestemming en van elk derde land van doorvoer; of

      b. de verantwoordelijke officier aan boord van het vaartuig waaraan wordt geleverd.

      6 De producten, bedoeld in het vierde lid, die na 31 december 2005 niet vergezeld gaan van het voor het
      desbetreffende product vastgestelde veterinair certificaat, bedoeld in of gebaseerd op de beschikking 79/542/EEG,
      94/984/EG, 97/221/EG, 2000/572/EG, 2000/585/EG, 2000/609/EG, 2003/779/EG of 2004/438/EG, worden door de minister,
      voor rekening van de voor de zending verantwoordelijke persoon, vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23c
      [ref3]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23g
