  - number: '2.3'
    text: |-
      De merken, bedoeld in [artikel 2.2][ref1], worden slechts aangebracht en de bewijsstukken, bedoeld in
      [artikel 2.2][ref2], worden slechts afgegeven, indien op grond van een van Rijkswege ingesteld onderzoek is
      gebleken dat wordt voldaan aan de [artikelen 2.4][ref3], [2.5][ref4], [2.6][ref5] en [2.7][ref6], alsmede aan:

      a. indien het vers vlees van pluimvee betreft:

      1º. de [artikelen 4.4][ref7] tot en met [4.8][ref8], indien het het merk en het bewijsstuk,
      onderscheidenlijk de bewijsstukken, bedoeld in [artikel 4.2][ref9] betreft, met inachtneming evenwel van
      [artikel 4.9, derde lid][ref10];

      2º. de [artikelen 4.4][ref11] tot en met [4.8][ref12], voor zover de onderdelen daarvan niet uitsluitend betrekking
      hebben op vers vlees van pluimvee bestemd voor een lid-staat of Noorwegen, indien het het in [artikel 4.9][ref13]
      of 4.10 bedoelde merk en het in [artikel 2.2, tweede lid][ref14], bedoelde bewijsstuk betreft;

      b. 1º. de [artikelen 5.5][ref15] en [5.6][ref16], indien het, voor vlees van vrij wild, het merk bedoeld in
      [artikel 5.2][ref17] betreft en, voor vlees van vrij wild en gehele stukken vrij wild, het bewijsstuk bedoeld in
      [artikel 5.2][ref18] betreft;

      2º. de [artikelen 5.5][ref19] en [5.6][ref20], voor zover de onderdelen daarvan niet uitsluitend betrekking hebben
      op vlees van vrij wild bestemd voor een lid-staat of Noorwegen, indien het het in [artikel 5.7][ref21] bedoelde
      merk betreft;

      c. indien het gehakt vlees betreft:

      1º. dat is bestemd voor een lid-staat of Noorwegen, [artikel 9.3][ref22];

      2º. dat is bestemd voor een derde land, niet zijnde Noorwegen:

        - [artikel 9.3][ref23], indien het gehakt vlees van runderen, varkens, schapen en geiten betreft dat is voorzien
      van het merk, bedoeld in [artikel 9.2, tweede lid, onderdeel a][ref24];
        - de Warenwetregeling productie en handel gehakt vlees en vleesbereidingen, indien het gehakt vlees als bedoeld
      in die regeling betreft dat is voorzien van het merk, bedoeld in [artikel 9.2, tweede lid, onderdeel b][ref25],
      dan wel
        - de [artikelen 9.6][ref26] en [9.7][ref27], indien het gehakt vlees als bedoeld in [artikel 9.4][ref28] betreft
      dat is voorzien van het merk, bedoeld in [artikel 9.2, tweede lid, onderdeel c][ref29];

      d. indien het vleesbereidingen betreft:

      1º. die zijn bestemd voor een lid-staat of Noorwegen, [artikel 10.3][ref30];

      2º. die zijn bestemd voor een derde land, niet zijnde Noorwegen:

        - [artikel 10.3][ref31], indien het vleesbereidingen, met uitzondering van vleesbereidingen van vlees van
      eenhoevigen, betreft die zijn voorzien van het merk, bedoeld in [artikel 10.2, tweede lid, onderdeel a][ref32];
        - de Warenwetregeling productie en handel gehakt vlees en vleesbereidingen, indien het vleesbereidingen als bedoeld
      in die regeling betreft die zijn voorzien van het merk, bedoeld in [artikel 10.2, tweede lid, onderdeel b][ref33],
      dan wel
        - de [artikelen 10.6][ref34] en [10.7][ref35], indien het vleesbereidingen als bedoeld in [artikel 10.4][ref36]
      betreft die zijn voorzien van het merk, bedoeld in [artikel 10.2, tweede lid, onderdeel c][ref37];

      e. indien het overige dierlijke producten als genoemd in [artikel 11.2][ref38] betreft, die zijn bestemd voor een
      lid-staat of Noorwegen, de [artikelen 11.3][ref39] tot en met [11.5][ref40].


