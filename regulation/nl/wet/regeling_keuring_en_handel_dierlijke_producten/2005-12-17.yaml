  - number: 2.16a
    text: |-
      1 Een partij afkomstig uit Nieuw-Zeeland mag in afwijking van hetgeen in [afdeling 2 van hoofdstuk 3][ref1], dan
      wel in de [hoofdstukken 4][ref2], [5][ref3], [9][ref4], [10][ref5], [11][ref6] en [11A][ref7] is bepaald ten
      aanzien van de voor de betrokken producten uit derde landen voorgeschreven gezondheidscertificaten, vergezeld
      gaan van een op de partij betrekking hebbend gezondheidscertificaat dat ingevolge de regelgeving van de Europese
      Gemeenschap ter uitvoering van de Overeenkomst van 17 december 1996 tussen de Europese Gemeenschap en Nieuw-
      Zeeland inzake sanitaire maatregelen voor de handel in levende dieren en dierlijke producten (PbEG 1997, L 57) is
      vastgesteld, indien is voldaan aan elk van de volgende voorwaarden:

      a. de desbetreffende producten zijn ingevolge de vorenbedoelde overeenkomst als gelijkwaardig erkend;

      b. de partij producten voldoet aan de ingevolge vorenbedoelde regelgeving gestelde bijkomende voorwaarden.

      2 Ingeval de desbetreffende producten op grond van de overeenkomst, bedoeld in het eerste lid, slechts op
      het gebied van de volksgezondheid, dan wel slechts op het gebied van de diergezondheid als gelijkwaardig zijn
      erkend, is in afwijking van het eerste lid, aanvullend het dier- onderscheidenlijk volksgezondheidscertificaat
      bijgevoegd dat voor de betrokken producten is voorgeschreven in de [afdeling 2 van hoofdstuk 3][ref8], dan wel de
      [hoofdstukken 4][ref9], [5][ref10], [9][ref11], [10][ref12], [11][ref13] of [11A][ref14].


