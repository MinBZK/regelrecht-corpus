  - number: '2.2'
    text: |-
      1 Het verbod, bedoeld in [artikel 2.1, eerste lid][ref1], geldt niet indien het overige dierlijke producten
      betreft, anders dan die genoemd in [artikel 11.2][ref2] die zijn bestemd voor een lid-staat of Noorwegen met
      inachtneming evenwel van [artikel 2.6][ref3], en evenmin indien het handelsmonsters betreft die zijn bestemd voor
      een derde land, niet zijnde Noorwegen.

      2 Het verbod, bedoeld in [artikel 2.1, eerste lid][ref4], alsmede het verbod, bedoeld in
      [artikel 68 van de Veewet][ref5], gelden niet, behalve indien het gehakt vlees van andere dieren dan runderen,
      varkens, schapen of geiten, vleesbereidingen van vlees van eenhoevigen, dan wel separatorvlees als bedoeld in
      [artikel 4.1][ref6] betreft, ten aanzien van producten indien zij, voor zover zij zijn bestemd voor een lid-staat
      of Noorwegen, vergezeld gaan van het bewijsstuk, onderscheidenlijk de bewijsstukken en zijn voorzien van het merk,
      genoemd of bedoeld in:

      a. [artikel 4.2][ref7], indien het vers vlees van pluimvee betreft;

      b. [artikel 5.2][ref8], indien het vlees van vrij wild betreft, en, voor wat betreft de bewijsstukken,
      [artikel 5.3][ref9], indien het gehele stukken vrij wild betreft;

      c. [artikel 9.2, eerste en derde lid][ref10], indien het gehakt vlees van runderen, varkens, schapen of geiten
      betreft;

      d. [artikel 10.2, eerste en derde lid][ref11], indien het vleesbereidingen betreft, met uitzondering van
      vleesbereidingen van vlees van eenhoevigen;

      e. voor wat betreft de bewijsstukken, [artikel 11.2][ref12], indien het in dat artikel genoemde overige dierlijke
      producten betreft.

      3 Het verbod, bedoeld in [artikel 2.1, eerste lid][ref13], geldt niet ten aanzien van producten indien zij, voor
      zover zij zijn bestemd voor een derde land, niet zijnde Noorwegen, zijn voorzien van het merk, genoemd of bedoeld
      in:

      1º. [artikel 4.2][ref14], [4.9][ref15] of [4.10][ref16], indien het vers vlees van pluimvee betreft;

      2º. [artikel 5.2][ref17] of [5.9][ref18], indien het vlees van vrij wild betreft;

      3º. de onderscheiden onderdelen van [artikel 9.2, tweede lid][ref19], al naar het gehakt vlees als bedoeld in die
      onderscheiden onderdelen betreft;

      4º. de onderscheiden onderdelen van [artikel 10.2, tweede lid][ref20], al naar gelang het vleesbereidingen als
      bedoeld in die onderdelen betreft;

      4 Van [artikel 2 van het Besluit uitvoer dieren en producten van dierlijke oorsprong][ref21] wordt vrijstelling
      verleend, voor wat betreft:

      a. het voorzien zijn van gehele stukken vrij wild en overige dierlijke producten die zijn bestemd voor een lid-
      staat of een derde land, van een of meer merken;

      b. het voorzien zijn van gehakt vlees of vleesbereidingen die zijn bestemd voor een derde land, van een of meer
      bewijsstukken en

      c. het voorzien zijn van vers vlees van pluimvee van een of meer merken die zijn aangebracht op grond van een van
      Rijkswege ingesteld onderzoek, indien het vlees betreft dat is verkregen overeenkomstig en voldoet aan punt 49 van
      hoofdstuk VIII van bijlage I van [richtlijn 71/118/EEG](31971L0118).

      5 De bewijsstukken zijn volledig ingevuld, gedagtekend en ondertekend, terwijl de geldigheidsduur ervan niet is
      verstreken, en zijn, voor zover van toepassing, in overeenstemming met de regelgeving van de Europese Gemeenschap
      opgesteld en afgegeven.

      6 De in het tweede tot en met vijfde lid bedoelde bewijsstukken worden afgegeven door de minister.

      7 Het verbod, bedoeld in [artikel 2.1, eerste lid][ref22], geldt niet ten aanzien van dierlijke bijproducten mits
      de producten:

      a. vergezeld gaan, voor zover van toepassing, van het in bijlage II, hoofdstuk III, van [verordening 1774/2002/EG]
      (32002R1774) bedoelde handelsdocument of gezondheidscertificaat;

      b. met betrekking tot die producten, voor zover van toepassing, is voldaan aan de artikelen 19, onderdelen a tot en
      met d, en 20, eerste lid, onderdelen a en b, en derde lid, onderdelen a tot en met c, van [verordening 1774/2002/
      EG](32002R1774).

      8 In zoverre in afwijking van het zevende lid is bijlage VIII, hoofdstuk III, onderdeel II, onder A,
      punt 5b, van [verordening 1774/2002/EG](32002R1774) tot 1 januari 2005 niet van toepassing indien het
      verwerkte mest of verwerkte producten uit mest betreft, afkomstig van een technisch bedrijf als bedoeld in
      [artikel 37, eerste lid, van het Destructiebesluit][ref23].

      9 Voor de toepassing van het zevende lid is de bevoegde autoriteit, bedoeld in bijlage VIII, hoofdstuk VIII, van
      [verordening 1774/2002/EG](32002R1774) de minister.

      10 Het verbod, bedoeld in [artikel 2.1, eerste lid][ref24], alsmede het verbod, bedoeld in
      [artikel 68 van de Veewet][ref25], zijn niet van toepassing op het anders dan in doorvoer buiten Nederland brengen
      van producten die, met inachtneming evenwel van [artikel 2.6][ref26];

      a. in kleine hoeveelheden in de persoonlijke bagage van reizigers voor eigen gebruik worden vervoerd;

      b. zonder enig handelskarakter in kleine zendingen aan particulieren worden toegestuurd;

      c. zich als proviand voor personeel en passagiers bevinden in grensoverschrijdende vervoermiddelen.


