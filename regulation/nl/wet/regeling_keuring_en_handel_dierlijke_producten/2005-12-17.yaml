  - number: '9.9'
    text: |-
      1 Een partij gehakt vlees van runderen, varkens, schapen of geiten die is verzonden vanuit een lid-staat en is
      bestemd voor Nederland of een lid-staat:

      a. gaat vergezeld van het op de partij betrekking hebbende bewijsstuk, bedoeld in
      [artikel 9.2, derde lid, onderdeel b][ref1];

      b. is op hygiënische wijze voorzien van een onmiddellijke en een eindverpakking overeenkomstig
      [artikel 9.3, eerste lid, onderdeel e][ref2];

      c. wordt op hygiënische wijze vervoerd overeenkomstig [artikel 9.3, eerste lid, onderdeel f][ref3];

      d. vertoont geen tekenen van bederf of ondeugdelijkheid.

      2 Onverminderd het eerste lid heeft eventuele opslag, verwerking of ompakking in Nederland van gehakt vlees dat is
      verzonden vanuit een lid-staat en dat is bestemd voor een lid-staat, onder bevredigende hygiënische omstandigheden
      plaatsgevonden in een op grond van [artikel 9 van de Regeling uitvoer vers vlees en vleesbereidingen 1985][ref4]
      erkende inrichting.

      3 Indien de partij gehakt vlees vergezeld gaat van een handelsdocument als bedoeld in
      [artikel 9.2, derde lid, onderdeel a][ref5], wordt dat document gedurende ten minste één jaar door de geadresseerde
      bewaard, zodat het desgevraagd aan de keuringsdierenarts kan worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel9.2
