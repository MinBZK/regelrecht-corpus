  - number: 2.23e
    text: |-
      Uitslag van een partij producten die niet voldoet aan de in deze regeling voor desbetreffende producten
      gestelde voorschriften voor het brengen op Nederlands grondgebied, uit een opslagruimte als bedoeld in
      [artikel 2.23a, tweede lid][ref1], is slechts toegestaan indien de producten bestemd zijn:

      a. voor een derde land en elders geen opslag van de producten plaatsvindt en de Minister de uitslag heeft
      gemachtigd;

      b. voor levering aan boord van zeevervoermiddelen;

      c. om te worden vernietigd, met inachtneming van artikel 12, zevende lid, derde gedachtenstreepje, van [richtlijn
      97/78/EG](31997L0078).


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23a
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel2.23e
    references:
