  - number: '4.25'
    text: |-
      1 [Artikel 4.4][ref1] is niet van toepassing op:

      a. het afstaan van vers vlees van pluimvee, met uitzondering van vlees van loopvogels, door pluimveehouders met een
      jaarproduktie van minder dan 10.000 stuks, in hoeveelheden van maximaal 200 geslachte dieren per week tot maximaal
      2000 geslachte dieren per jaar, rechtstreeks aan de eindverbruiker op het bedrijf of op de dichtstbijgelegen
      weekmarkt, met uitzondering van venthandel en verkoop door middel van verzending, en

      b. het afstaan van vlees van gekweekt vederwild, met uitzondering van vlees van loopvogels, door een kleine
      producent, niet zijnde de eigenaar of exploitant van een erkende inrichting, in hoeveelheden van maximaal 200
      geslachte dieren per week tot maximaal 2000 geslachte dieren per jaar, rechtstreeks aan de eindverbruiker voor
      eigen verbruik, met uitzondering van venthandel, verkoop door middel van verzending en verkoop op markten.

      2 In de gevallen, bedoeld in het eerste lid, houdt de pluimveehouder dan wel de producent een register bij van
      het aantal dieren dat op zijn bedrijf wordt aan- en afgevoerd, alsmede van het aantal geslachte dieren dat wordt
      afgeleverd. Bedoelde gegevens worden terstond na de aan- of afvoer in het register genoteerd. De dieren worden in
      een andere ruimte geslacht dan waar zij worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel4.4
