  - number: '5.15'
    text: |-
      1 De minister schort een op grond van [artikel 5.13][ref1] verleende erkenning, dan wel een erkenning of ontheffing
      als bedoeld in [artikel 12.6, tweede, onderscheidenlijk derde lid][ref2], tijdelijk op indien de keuringsdierenarts
      heeft geconstateerd dat de voorschriften, bedoeld in de [artikelen 5.13][ref3] en [5.14][ref4], niet of slechts
      gedeeltelijk worden nageleefd en indien de keuringsdierenarts is gebleken dat de in hoofdstuk V, punt 5, tweede
      alinea, van bijlage I van [richtlijn 92/45/EEG](31992L0045) bedoelde maatregelen onvoldoende zijn om dit te
      verhelpen. Opschorting geschiedt niet dan na voorafgaande waarschuwing en na het verstrijken van een daarbij te
      stellen termijn, waarbinnen alsnog aan voornoemde voorschriften dient te zijn voldaan.

      2 Indien blijkt dat de exploitant of de eigenaar, dan wel diens vertegenwoordiger van de vrij-
      wildverwerkingsinrichting de geconstateerde gebreken na opschorting niet alsnog binnen een daartoe gestelde termijn
      verhelpt, trekt de minister de erkenning, onderscheidenlijk ontheffing, in.


