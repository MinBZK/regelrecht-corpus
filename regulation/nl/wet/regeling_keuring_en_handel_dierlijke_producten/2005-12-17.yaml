  - number: '2.20'
    text: |-
      1 Ter zake van een partij producten die zich aan boord bevindt van een vliegtuig of schip dat bij vervoer tussen
      twee derde landen op Nederlands grondgebied landt of aanlegt, overlegt de importeur aan de keuringsdierenarts,
      desgevraagd het originele document, bedoeld in [artikel 2.16, tweede lid, onderdeel c][ref1].

      2 Indien de in het eerste lid bedoelde partij van het ene vliegtuig of schip in het andere wordt overgeladen,
      stelt de importeur de keuringsdierenarts hiervan in kennis en overlegt hij hem desgevraagd het originele document,
      bedoeld in [artikel 2.16, tweede lid, onderdeel c][ref2].

      3 In de in het eerste en tweede lid bedoelde gevallen gaat de desbetreffende partij bij verzending naar het derde
      land vergezeld van het originele document, bedoeld in [artikel 2.16, tweede lid, onderdeel c][ref3].


