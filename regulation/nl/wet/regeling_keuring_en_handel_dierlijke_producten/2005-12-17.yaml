  - number: '5.6'
    text: |-
      Gehele stukken vrij wild:

      a. voldoen aan [artikel 5.5, eerste lid][ref1], en, voor zover van toepassing, 5.5, tweede lid, onderdeel a;

      b. worden bij het hanteren en opslaan gescheiden gehouden van vers vlees als bedoeld in [richtlijn 64/433/EEG]
      (31964L0433), vers vlees van pluimvee en van vers konijne- of hazevlees als bedoeld in [richtlijn 91/495/EEG]
      (31991L0495) en onder hygiënische omstandigheden vervoerd, met dien verstande dat de gehele stukken niet worden in-
      of diepgevroren;

      c. voldoen, voor zover het gehele stukken niet-onthuid grof wild betreft, aan artikel 5, onderdeel d, van
      [richtlijn 92/45/EEG](31992L0045).


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel5.5
