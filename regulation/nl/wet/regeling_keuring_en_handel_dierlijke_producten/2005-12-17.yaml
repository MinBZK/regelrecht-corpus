  - number: 2.23d
    text: |-
      1 Een erkenning als bedoeld in [artikel 2.23a, tweede lid][ref1], wordt door de Minister verleend nadat uit een
      door de keuringsdierenarts ingesteld onderzoek is gebleken dat aan de voorschriften, bedoeld in 2.23c, eerste lid,
      is voldaan.

      2 De aanvraag voor erkenning wordt ingediend bij de Rijksdienst op een daartoe bestemd formulier.

      3 Aan een opslagfaciliteit die op grond van dit artikel wordt erkend, wordt een erkenningsnummer toegekend.

      4 De Minister schort een verleende erkenning op indien de keuringsdierenarts heeft geconstateerd dat de op de
      betrokken opslagfaciliteit van toepassing zijnde voorschriften genoemd in [artikel 2.23c][ref2] niet worden
      nageleefd.

      5 De aanvraag voor een registratie of erkenning wordt ingediend bij de VWA op een daartoe bestemd formulier.

      6 De opschorting en intrekking van een erkenning geschiedt niet dan na voorafgaande waarschuwing en na het
      verstrijken van een daarbij te stellen termijn, waarbinnen alsnog aan de betrokken voorschriften dient te zijn
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23a
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23c
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel2.23d
