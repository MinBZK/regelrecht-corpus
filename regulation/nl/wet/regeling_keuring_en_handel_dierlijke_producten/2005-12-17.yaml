  - number: 2.23c
    text: |-
      1 Erkenning van een douane-entrepot of vrij entrepot vindt slechts plaats indien het entrepot:

      a. beschikt over een geldige vergunning als bedoeld in artikel 100 van [Verordening (EEG) nr. 2913/92](31992R2913)
      van de Raad van de Europese Gemeenschappen van 12 oktober 1992 (PbEG L 302), onderscheidenlijk een vergunning als
      bedoeld in artikel 603, derde lid, van [Verordening (EEG) nr. 2454/93](31993R2454) van de Commissie van de Europese
      Gemeenschappen van 2 juli 1993 (PbEG L 253);

      b. voor zover van toepassing, op grond van de betrokken regelgeving is erkend voor de opslag van betrokken
      producten, dan wel, indien voor de opslag van de betrokken producten geen voorschriften voor de erkenning van
      inrichtingen gelden, aan hoofdstuk I van de bijlage van [richtlijn 93/43/EEG](31993L0043);

      c. beschikt over geschikte lokalen die gereserveerd zijn voor de keuringsdierenarts en de onder zijn
      verantwoordelijkheid werkzame personen en die ten behoeve van door hen te verrichten werkzaamheden adequaat zijn
      ingericht, en

      d. kan worden afgesloten met een ambtelijk slot.

      2 In een douane-entrepot of vrij entrepot waar producten, bedoeld in [artikel 2.23a, tweede lid][ref1], zijn
      opgeslagen:

      a. is iedere partij bij inslag en gedurende de opslag voorzien van een gesloten verpakking met daarop een
      vermelding van het land van oorsprong en de aard van het product en duidelijk geïdentificeerd door middel van het
      nummer van het bij de partij behorende document, bedoeld in [artikel 2.19, eerste lid][ref2];

      b. zijn deze partijen niet opgeslagen in lokalen waar partijen als bedoeld in [artikel 2.23a, eerste lid][ref3],
      zijn opgeslagen;

      c. ondergaat een partij als bedoeld in [artikel 2.23a, tweede lid][ref4], geen verandering of verwerking, noch
      wordt de onmiddellijke verpakking of de eindverpakking van de partij gewijzigd en blijft bij splitsing van de
      partij de originele verpakking van de individuele colli van de deelpartij intact.

      3 De exploitant of de eigenaar, dan wel diens vertegenwoordiger van een douane-entrepot of vrij entrepot draagt er
      zorg voor dat:

      a. er een boekhouding wordt gevoerd overeenkomstig artikel 12, vierde lid, onderdeel b, derde gedachtestreepje, van
      [richtlijn 97/78/EG](31997L0078) en, voor zover van toepassing, artikel 3, tweede lid, van beschikking 2000/571/EG;

      b. van iedere ingeslagen partij het document, bedoeld in [artikel 2.19, eerste lid][ref5], gedurende drie jaren na
      uitslag wordt bewaard;

      c. de keuringsdierenarts alle medewerking wordt verleend die deze redelijkerwijs voor de vervulling van zijn taken
      in het kader van de inslag, opslag of uitslag van partijen noodzakelijk acht en dat diens aanwijzingen ter zake
      door het personeel van de opslagfaciliteit worden opgevolgd;

      d. voor alle in het entrepot geleverde partijen een controle van de documenten wordt verricht;

      e. voor alle partijen tijdens de opslag en vóór de uitslag een controle van de documenten en een
      overeenstemmingcontrole wordt verricht, teneinde de herkomst en de bestemming te verifiëren;

      f. fax en telefoon om niet aan de keuringsdierenarts ter beschikking worden gesteld;

      g. de toegang van het entrepot duidelijk wordt voorzien van de vermelding ‘vrij entrepot, bestemd voor de opslag
      van niet-EU-waardige producten van dierlijke oorsprong’.

      4 Een douane-entrepot of vrij entrepot staat onder permanente controle van de keuringsdierenarts of van de
      ambtenaar van de Rijksbelastingdienst, bevoegd inzake douane.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23a
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2.19
      [ref3]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23a
