  - number: 5.9a
    text: |-
      In afwijking van artikel 5.9, eerste lid, aanhef en onderdeel a, mag vlees van vrij wild dat afkomstig is uit
      Tsjechië, Estland, Cyprus, Letland, Litouwen, Hongarije, Malta, Polen, Slovenië of Slowakije en vóór 1 mei 2004
      is verkregen in een inrichting die erkend was voor uitvoer naar de Europese Gemeenschap, tot en met 30 april
      2005 voorzien zijn van het keurmerk, bedoeld in artikel 3, onderdeel a, van beschikking 2004/280/EG, mits het
      certificaat of document dat het vlees vergezelt, door de bevoegde autoriteiten van het land van herkomst is
      voorzien van de verklaring: ‘Vóór 1 mei 2004 geproduceerd overeenkomstig Beschikking 2004/280/EG van de Commissie.’
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel5.9a
  - number: '5.10'
    text: |-
      1 Een partij vlees van vrij wild of gehele stukken vrij wild die via Nederland voor het eerst op het grondgebied
      van de Europese Gemeenschap wordt gebracht en die is bestemd voor Nederland of een lidstaat, is afkomstig uit een
      derde land of gedeelte van een derde land dat voor de betrokken diersoort waarvan het vlees afkomstig is, staat
      vermeld op:

      a. de lijst van deel 1 van bijlage II bij beschikking 79/542/EEG, voor zover het vlees van slurfdieren of
      evenhoevigen betreft, dan wel

      b. de lijst van bijlage I bij beschikking 2000/585/EG, voor zover het vlees van overige diersoorten, betreft,

      en voldoet aan de in de voornoemde beschikkingen opgenomen eisen ten aanzien van het derde land respectievelijk
      gedeelte van het derde land van herkomst.

      2 Een partij vlees van vrij wild of gehele stukken vrij wild gaat vergezeld van een op de partij betrekking hebbend
      gezondheidscertificaat waarvan het model overeenstemt met het model zoals dat voor de betrokken diersoort waarvan
      het vlees afkomstig is, is vastgesteld in:

      a. deel 2 van bijlage II bij beschikking 79/542/EEG, voor zover het vlees van slurfdieren of evenhoevigen betreft,
      dan wel

      b. bijlage III bij beschikking 2000/585/EG, voor zover het overige diersoorten betreft.

      3 Het gezondheidscertificaat, bedoeld in het tweede lid, voldoet, voor zover van toepassing, aan bijlage XI,
      hoofdstuk D, punt 4, van [verordening 999/2001/EEG](32001R0999).

      4 Een partij vlees van vrij wild of gehele stukken vrij wild, bedoeld in het eerste lid, voldoet aan de eisen die
      zijn vastgesteld in de onderscheiden gezondheidscertificaten, bedoeld in het tweede lid, en aan de aanvullende
      garanties die in voorkomend geval in die certificaten zijn opgenomen, alsmede aan de overige voorwaarden die aan
      het soort vlees zijn gesteld op grond van [richtlijn 92/45/EEG](31992L0045).

      5 Een partij vlees van vrij wild of gehele stukken vrij wild is afkomstig van een inrichting die is opgenomen op
      de lijst, bedoeld in artikel 2 van beschikking 95/408/EG, met dien verstande dat indien bij de vaststelling van
      voornoemde lijst is voorzien in overgangsbepalingen het vlees en de stukken met inachtneming van die bepalingen
      afkomstig mogen zijn uit een inrichting die voldoet aan [richtlijn 92/45/EEG](31992L0045).
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel5.10
  - number: '5.12'
    text: |-
      Onverminderd de [artikelen 5.10][ref1] en [5.11][ref2] is, zolang de voorschriften voor het op het grondgebied
      van de Europese Gemeenschap brengen van vlees van vrij wild of gehele stukken vrij wild vanuit derde landen niet
      of slechts gedeeltelijk ingevolge de regelgeving van de Europese Gemeenschap zijn vastgesteld, het brengen in
      Nederland van vlees van vrij wild of gehele stukken vrij wild, bestemd voor een lid-staat, toegestaan indien is
      voldaan aan de voorschriften van de lidstaat van bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel5.10
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel5.11
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel5.12
    references:
