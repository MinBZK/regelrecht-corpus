  - number: 9.9a
    text: |-
      1 Een partij gehakt vlees van runderen, varkens, schapen of geiten die via Nederland voor het eerst op het
      grondgebied van de Europese Gemeenschappen wordt gebracht en die is bestemd voor Nederland of een lid staat, is
      afkomstig uit:

      a. een derde land of gedeelte van een derde land dat voor de betrokken diersoort waarvan het gehakte vlees
      afkomstig is, is vermeld op de lijst van deel 1 van bijlage II bij beschikking 79/542/EEG, en

      b. een gebied of zone van waaruit de invoer niet om veterinairrechtelijke redenen is verboden ingevolge, voorzover
      van toepassing, [richtlijn 72/462/EEG](31972L0462).

      2 Een partij gehakt vlees als bedoeld in het eerste lid gaat vergezeld van een op de partij betrekking hebbend
      gezondheidscertificaat waarvan het model overeenstemt met het model zoals dat voor de betrokken diersoort waarvan
      het gehakte vlees afkomstig is, is vastgesteld in deel 2 van bijlage II bij beschikking 79/542/EEG en, voorzover
      de partij gehakt vlees betreft van runderen, schapen of geiten, met betrekking tot de partij is voldaan aan
      bijlage XI, hoofdstuk A, punt 15, van [verordening 999/2001/EG](32001R0999).

      3 Een partij gehakt vlees als bedoeld in het eerste lid is afkomstig uit een inrichting die, zodra deze is
      vastgesteld en in werking getreden, voorkomt op de voor gehakt vlees uit het betrokken land van herkomst geldende
      voorlopige lijst van inrichtingen als bedoeld in beschikking 95/408/EG die alsdan ter inzage ligt in de bibliotheek
      van het Ministerie van Landbouw, Natuurbeheer en Visserij in Den Haag, met dien verstande dat indien bij de
      vaststelling van voornoemde lijst is voorzien in overgangsbepalingen het vlees met inachtneming van die bepalingen
      afkomstig mag zijn uit een inrichting die voldoet aan [richtlijn 94/55/EG](31994L0055).

      4 Een partij gehakt vlees als bedoeld in het eerste lid voldoet aan de eisen die zijn vastgesteld in het
      gezondheidscertificaat, bedoeld in het tweede lid, en aan de aanvullende garanties die in voorkomend geval in
      dat certificaat zijn opgenomen en is voorzien van een officieel keurmerk waaruit blijkt uit welke inrichting zij
      afkomstig is.

      5 Een partij gehakt vlees als bedoeld in het eerste lid is op hygiënische wijze verpakt en wordt op hygiënische
      wijze vervoerd overeenkomstig [artikel 9.6, eerste lid, onderdeel d, onderscheidenlijk e][ref1], en vertoont geen
      tekenen van bederf of ondeugdelijkheid.

      6 De partij gehakt, bedoeld in het eerste lid, is niet verkregen van of met vlees van runderen, varkens, schapen of
      geiten waaraan stoffen of producten zijn toegediend die ingevolge artikel 3, onderdeel a, van [richtlijn 96/22/EG]
      (31996L0022) niet aan genoemde dieren mogen worden toegediend, tenzij aan de voorwaarden ingevolge artikel 11 van
      genoemde richtlijn is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel9.6
