  - number: '5.2'
    text: |-
      1 Vlees van vrij wild dat anders dan in doorvoer buiten Nederland wordt gebracht is voorzien van een keurmerk
      overeenkomstig hoofdstuk VII van bijlage I van [richtlijn 92/45/EEG](31992L0045), met dien verstande dat ten
      aanzien van het aanbrengen van het keurmerk, bedoeld in hoofdstuk XII, punt 68, van bijlage I van [richtlijn
      71/118/EEG](31971L0118), van toepassing is op vlees van klein vrij wild.

      2 Een partij vlees van vrij wild die anders dan in doorvoer buiten Nederland wordt gebracht gaat vergezeld van:

      a. een door de keuringsdierenarts geviseerd handelsdocument, dat de gegevens, bedoeld in hoofdstuk VII, punt 2, van
      bijlage I van [richtlijn 92/45/EEG](31992L0045), bevat, alsmede, in geval van ingevroren vlees, de niet-gecodeerde
      vermelding van de maand en het jaar van invriezing en een codenummer aan de hand waarvan de keuringsdierenarts kan
      worden geïdentificeerd, dan wel

      b. een gezondheids- en veterinairrechtelijk certificaat waarvan het model overeenstemt met het model in bijlage II
      van [richtlijn 92/45/EEG](31992L0045), wanneer het vlees:

      1º. afkomstig is uit een inrichting die is gelegen in een gebied of zone waarvoor om veterinairrechtelijke redenen
      beperkingen gelden, met dien verstande dat op het certificaat de woorden ‘betreffende vlees van vrij wild dat is
      bestemd voor een Lid-Staat na doorvoer door een derde land’ worden doorgehaald, of

      2º. voor een lid-staat is bestemd na doorvoer via een derde land in een met een loodje verzegelde vrachtwagen.

      3 Zolang de voorschriften voor het op het grondgebied van de Europese Gemeenschap brengen van vlees van vrij
      wild vanuit derde landen niet of slechts gedeeltelijk ingevolge de regelgeving van de Europese Gemeenschap zijn
      vastgesteld, is het anders dan in doorvoer buiten Nederland brengen van uit derde landen in Nederland ingevoerd
      vlees van vrij wild, bestemd voor een lid-staat, slechts toegestaan indien de lid-staat van bestemming heeft
      ingestemd met het op zijn grondgebied brengen van het vlees en is voldaan aan de ter zake door die lid-staat
      gestelde voorschriften.

      a. is het vlees, in afwijking van het eerste lid, voorzien van het oorspronkelijke keurmerk bedoeld in
      [artikel 5.11][ref1], eerst lid, onderdeel a, en

      b. gaat de partij, in afwijking van het tweede lid, vergezeld van:

      1º. een gewaarmerkt afschrift van het certificaat, bedoeld in [artikel 5.11, eerste lid, onderdeel b][ref2],
      met dien verstande dat op dit afschrift of op een afzonderlijk certificaat, tevens door de keuringsdierenarts is
      verklaard dat de partij is ingevoerd overeenkomstig de Nederlandse voorschriften, dan wel

      2º. een door de lid-staat van bestemming voorgeschreven certificaat.

      4 Indien een partij als bedoeld in het eerste lid in Nederland niet is verwerkt of omgepakt:

      5 Indien een partij als bedoeld in het eerste lid in Nederland is verwerkt of omgepakt, blijkt uit het document
      bedoeld in [artikel 5.2, tweede lid][ref3], tevens dat is voldaan aan de voorschriften van de lid-staat van
      bestemming.

      6 Ten aanzien van vlees van vrij wild dat anders dan in doorvoerbuiten Nederland wordt gebracht, is voldaan aan
      de eisen, gesteld in de artikelen 4, eerste, tweede en zesde lid, 8, eerste lid, 9, eerste en derde lid, en 13 van
      [verordening 1829/2003](32003R1829).

      7 Het is een exploitant als bedoeld in artikel 3, vijfde lid, van [verordening 1830/2003](32003R1830), voorzover
      zijn activiteiten betrekking hebben op vlees van vrij wild, verboden te handelen in strijd met de artikelen 4,
      eerste, tweede, vierde en zesde lid, en 5, eerste en tweede lid, van die verordening.


