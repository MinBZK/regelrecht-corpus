  - number: 11A.1
    text: |-
      1 Het is verboden dierlijke bijproducten in de handel te brengen.

      2 Het verbod, bedoeld in het eerste lid, geldt niet ten aanzien van dierlijke bijproducten mits de producten, voor
      zover van toepassing:

      a. vergezeld gaan van het in bijlage II, hoofdstuk III, van [verordening 1774/2002/EG](32002R1774) bedoelde
      handelsdocument of gezondheidscertificaat;

      b. met betrekking tot die producten, voorzover van toepassing, is voldaan aan de artikelen 19, onderdelen a tot en
      met d, en 20, eerste lid en tweede lid, van [verordening 1774/2002/EG](32002R1774).

      3 Voor de toepassing van het tweede lid is de bevoegde autoriteit, bedoeld in bijlage VIII, hoofdstuk VIII, van
      [verordening 1774/2002/EG](32002R1774) de minister.

      4 In zoverre in afwijking van het derde lid is bijlage VIII, hoofdstuk III, onderdeel II, onder A, punt 5b, tot 31
      december 2004 niet van toepassing indien het verwerkte mest of verwerkte producten uit mest betreft, afkomstig van
      een technisch bedrijf als bedoeld in [artikel 37, eerste lid, van het Destructiebesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018514#Artikel37
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel11A.1
    references:
      - id: ref1
        bwb_id: BWBR0018514
        artikel: '37'
  - number: 11.A.2
    text: |-
      1 Een partij melk of producten of basis van melk of biest voldoet, voor zover van toepassing, aan bijlage VII,
      hoofdstuk V, onderdeel B, van [verordening 1774/2002/EG](32002R1774), is afkomstig uit een derde land of gedeelte
      van een derde land van waaruit het brengen op het grondgebied van de Europese Commissie van de onderscheiden
      producten is toegestaan ingevolge de beschikking, genoemd in punt 11, van de bijlage van [verordening 812/2003/EG]
      (32003R0812) en gaat vergezeld van het in die beschikking voor de partij voorgeschreven gezondheidscertificaat.

      2 Een partij huiden van hoefdieren voldoet, voor zover van toepassing, aan bijlage VIII, hoofdstuk VI, onderdeel
      C, van [verordening 1774/2002/EG](32002R1774) en gaat vergezeld van het in de beschikking genoemd in punt 13 van de
      bijlage van [verordening 812/2003/EG](32003R0812) voor de partij voorgeschreven gezondheidscertificaat.

      3 Een partij voeder voor gezelschapsdieren en hondenkluiven voldoet, voor zover van toepassing, aan bijlage VIII,
      hoofdstuk II, onderdeel C, van [verordening 1774/2002/EG](32002R1774), is afkomstig uit een derde land of gedeelte
      van een derde land van waaruit het brengen op het grondgebied van de Europese Commissie van de onderscheiden
      producten is toegestaan ingevolge de beschikking, genoemd in punt 16, van de bijlage van [verordening 812/2003/EG]
      (32003R0812), gaat vergezeld van een gezondheidscertificaat en voldoet, indien de partij materiaal bevat afkomstig
      van runderen, schapen of geiten, aan bijlage XI, hoofdstuk A, punt 15, van [verordening 999/2001/EG](32001R0999).

      4 Een partij beenderen en producten uit beenderen, met uitzondering van beendermeel, hoorn, producten uit hoorn,
      met uitzondering van hoornmeel, hoeven, producten ut hoeven, met uitzondering van meel van hoeven, die niet bestemd
      is voor gebruik als voedermateriaal, organische meststof of bodemverbeteraar, voldoet aan bijlage VIII, hoofdstuk
      X, van [verordening 1774/2002/EG](32002R1774) en gaat vergezeld van een handelsdocument en een verklaring als
      bedoeld in de beschikking, genoemd in punt 9, van de bijlage van [verordening 812/2003/EG](32003R0812) en voldoet,
      indien de partij materiaal bevat afkomstig van runderen, schapen of geiten, aan bijlage XI, hoofdstuk A, punt 15,
      van [verordening 999/2001/EG](32001R0999).

      5 Een partij verwerkte dierlijke eiwitten voldoet, voor zover van toepassing, aan bijlage VII, hoofdstuk II,
      onderdeel C, van [verordening 1774/2002/EG](32002R1774), is afkomstig uit een derde land of gedeelte van een derde
      land van waaruit het brengen op het grondgebied van de Europese Commissie van de producten is toegestaan ingevolge
      de beschikking, genoemd in punt 16, van de bijlage van [verordening 812/2003/EG](32003R0812), en gaat vergezeld van
      het voor de partij in de beschikking, genoemd in punt 7, van de bijlage van [verordening 812/2003/EG](32003R0812)
      voorgeschreven gezondheidscertificaat en voldoet, indien de partij materiaal bevat afkomstig van runderen, schapen
      of geiten, aan bijlage XI, hoofdstuk A, punt 15, van [verordening 999/2001/EG](32001R0999).

      6 Een partij bloed en bloedproducten voor technisch of farmaceutisch gebruik, in-vitrodiagnostica en
      laboratoriumreagentia, met uitzondering van serum voor paardachtigen, voldoet, voor zover van toepassing, aan
      bijlage VIII, hoofdstuk IV, onderdeel B, van [verordening 1774/2002/EG](32002R1774), is afkomstig uit een derde
      land of gedeelte van een derde land van waaruit het brengen op het grondgebied van de Europese Commissie van de
      producten is toegestaan ingevolge de beschikking, genoemd in punt 16, van de bijlage van [verordening 812/2003/
      EG](32003R0812) en gaat vergezeld van een gezondheidscertificaat en voldoet, indien de partij materiaal bevat
      afkomstig van runderen, schapen of geiten, aan bijlage XI, hoofdstuk A, punt 15, van [verordening 999/2001/EG]
      (32001R0999).

      7 Een partij bloedproducten voldoet, voor zover van toepassing, aan bijlage VII, hoofdstuk III, onderdeel C,
      van [verordening 1774/2002/EG](32002R1774) en gaat vergezeld van een gezondheidscertificaat en voldoet, indien
      de partij materiaal bevat afkomstig van runderen, schapen of geiten, aan bijlage XI, hoofdstuk A, punt 15, van
      [verordening 999/2001/EG](32001R0999).

      8 Een partij serum voor paardachtigen voldoet aan bijlage VIII, hoofdstuk V, onderdeel B, van [verordening
      1774/2002/EG](32002R1774) en gaat vergezeld van in de beschikking, genoemd in punt 5, van de bijlage van
      [verordening 812/2003/EG](32003R0812) voorgeschreven gezondheidscertificaat.

      9 Een partij producten van de bijenteelt voldoet aan bijlage VIII, hoofdstuk IX, onderdeel B, van [verordening
      1774/2002/EG](32002R1774) en gaat vergezeld van een handelsdocument.

      10 Een partij jachttrofeeën voldoet aan bijlage VIII, hoofdstuk VII, onderdeel B, van [verordening 1774/2002/EG]
      (32002R1774) en gaat vergezeld van het voor de partij in de beschikking, genoemd in punt 12, van de bijlage van
      [verordening 812/2003/EG](32003R0812) voorgeschreven gezondheidscertificaat.

      11 Een partij niet-verwerkte mest voldoet aan bijlage VIII, hoofdstuk III, onder I, onderdeel B, van [verordening
      1774/2002/EG](32002R1774) en gaat vergezeld van een gezondheidscertificaat.

      12 Een partij verwerkte mest of verwerkte producten uit mest voldoet aan bijlage VIII, hoofdstuk III, onder II,
      onderdeel B, van [verordening 1774/2002/EG](32002R1774) en gaat vergezeld van een gezondheidscertificaat.

      13 Een partij varkenshaar voldoet aan bijlage VIII, hoofdstuk VIII, onderdeel B, punt 3, van [verordening
      1774/2002/EG](32002R1774) en gaat vergezeld van het voor de partij in de beschikking, genoemd in punt 8, van de
      bijlage van [verordening 812/2003/EG](32003R0812) voorgeschreven gezondheidscertificaat.

      14 Een partij onbewerkte wol, onbewerkt haar en onbewerkte veren en delen van veren voldoet aan bijlage VIII,
      hoofdstuk VIII, onderdeel B, punt 4, van [verordening 1774/2002/EG](32002R1774).

      15 Een partij gesmolten vet voldoet aan bijlage VII, hoofdstuk IV, onderdeel B, van [verordening 1774/2002/
      EG](32002R1774) en gaat vergezeld van een gezondheidscertificaat en voldoet, indien de partij materiaal bevat
      afkomstig van runderen, schapen of geiten, aan bijlage XI, hoofdstuk A, punt 15, van [verordening 999/2001/EG]
      (32001R0999).

      16 Een partij visolie voldoet aan bijlage VII, hoofdstuk IV, onderdeel C, van [verordening 1774/2002/EG]
      (32002R1774) en gaat vergezeld van een gezondheidscertificaat.

      17 Een partij dierlijke bijproducten voor de vervaardiging van voeder voor gezelschapsdieren, farmaceutische en
      andere technische producten voldoet aan bijlage VIII, hoofdstuk XI, van [verordening 1774/2002/EG](32002R1774) en:

      a. gaat vergezeld, voorzover het dierlijke bijproducten voor de vervaardiging van voeder voor gezelschapsdieren en
      technische producten betreft, niet zijnde farmaceutische producten, van een gezondheidscertificaat;

      b. gaat vergezeld, voorzover het dierlijk bijproducten voor de vervaardiging van farmaceutische producten betreft,
      van het voor de partij in de beschikking, genoemd in punt 3, van de bijlage van [verordening 812/2003/EEG]
      (32003R0812) voorgeschreven gezondheidscertificaat;

      c. voldoet, voorzover het dierlijke bijproducten voor de vervaardiging van voeder voor gezelschapsdieren betreft,
      aan bijlage XI, hoofdstuk A, punt 15, van [verordening 999/2001/EG](32001R0999) indien de partij materiaal bevat
      afkomstig van runderen, schapen of geiten.

      18 Een partij gelatine of gehydrolyseerd eiwit voldoet aan bijlage VII, hoofdstuk VI, van [verordening 1774/2002/
      EG](32002R1774), gaat vergezeld van een gezondheidscertificaat en voldoet, indien de partij gelatine materiaal
      bevat afkomstig van runderen, schapen of geiten, aan bijlage XI, hoofdstuk A, punt 15, van [verordening 999/2001/
      EG](32001R0999).

      19 Een partij dicalciumfosfaat voldoet aan bijlage VII, hoofdstuk VII, onderdeel B, van [verordening 1774/2002/EG]
      (32002R1774) en gaat vergezeld van een gezondheidscertificaat.

      20 Een partij gesmolten vet voor oleochemische doeleinden voldoet aan bijlage VIII, hoofdstuk XII, van [verordening
      1774/2002/EG](32002R1774), gaat vergezeld van een gezondheidscertificaat en voldoet, indien de partij materiaal
      bevat afkomstig van runderen, schapen of geiten, aan bijlage XI, hoofdstuk A, punt 15, van [verordening 999/2001/
      EG](32001R0999).

      21 Een partij tricalciumfosfaat voldoet aan bijlage VIII, hoofdstuk VIII, van [verordening 1774/2002](32002R1774)
      en gaat vergezeld van een gezondheidscertifcaat.
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel11.A.2
  - number: '12.5'
    text: |-
      1 De Regeling keuring en handelsverkeer pluimveevlees 1992 wordt ingetrokken.

      2 Erkenningen als bedoeld in en verleend op grond van paragraaf 7 van de in het eerste lid genoemde regeling zijn
      erkenningen als bedoeld in en verleend op grond van:

      a. [artikel 4.16][ref1], voor zover de erkenning een slachthuis, uitsnijderij, dan wel een koel- of vrieshuis als
      bedoeld in die paragraaf betreft;

      b. [artikel 9.10][ref2], voor zover de erkenning een werkplaats als bedoeld in die paragraaf voor de verwerking van
      gehakt betreft, of

      c. [artikel 10.9][ref3], voor zover de erkenning een werkplaats als bedoeld in die paragraaf voor de vervaardiging
      van vleesbereidingen betreft.

      met dien verstande dat wordt voldaan aan het artikel, genoemd in onderdeel a, b, onderscheidenlijk c.

      3 Ontheffingen die zijn verleend van één of meer bepalingen van de in het eerste lid bedoelde regeling, zijn
      ontheffingen, verleend op grond van deze regeling, tenzij enige bepaling van [richtlijn 71/118/EEG](31971L0118),
      91/494/EEG, 91/495/EEG of 94/65/EG, voor zover van toepassing, zich hiertegen verzet.


