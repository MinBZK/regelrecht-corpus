  - number: 2.22a
    text: |-
      1 Producten als bedoeld in artikel 2.16, vijfde lid:

      a. worden binnengebracht via een inspectiepost of een plaats als bedoeld in [artikel 11][ref1] of
      [17 van de Douaneregeling][ref2];

      b. voldoen aan de voorschriften voor de invoer, bedoeld in artikel 1, tweede lid, van [verordening 745/2004/EG]
      (32004R0745);

      c. worden onderworpen aan veterinaire controles overeenkomstig [verordening 136/2004/EG](32004R0136), met
      uitzondering van artikel 8, eerste lid, van die verordening.

      2 In afwijking van het eerste lid, onderdeel b, moeten producten als bedoeld in het eerste lid, zolang de Commissie
      van de Europese Gemeenschappen uit hoofde van artikel 12 van [verordening 745/2004](32004R0745) nog geen uitvoering
      heeft gegeven aan de voorschriften voor de invoer, bedoeld in het eerste lid, onderdeel b:

      a. afkomstig zijn uit een derde land waaruit het binnenbrengen in de Europese Gemeenschap van dezelfde soort
      producten is toegestaan ingevolge de voor die producten geldende communautaire regelgeving, vermeld in bijlage
      V bij [Richtlijn nr. 2002/99/EG](32002L0099) van de Raad van de Europese Unie van 16 december 2002 houdende
      vaststelling van veterinairrechtelijke voorschriften voor de productie, de verwerking, de distributie en het
      binnenbrengen van voor menselijke consumptie bestemde producten van dierlijke oorsprong (PbEU L 18), en

      b. vergezeld gaan van het certificaat of document dat voor dezelfde soort producten is voorgeschreven ingevolge de
      in onderdeel a bedoelde communautaire regelgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008032#Artikel17
