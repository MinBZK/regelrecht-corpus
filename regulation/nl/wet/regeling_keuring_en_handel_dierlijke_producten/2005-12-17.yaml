  - number: '2.17'
    text: |-
      1 Elke partij, rechtstreeks afkomstig uit een derde land, wordt aangevoerd via een inspectiepost.

      2 De melding van de aankomst van een partij vindt plaats aan de VWA overeenkomstig artikel 2, eerste tot en met
      derde lid, van [verordening 136/2004/EG](32004R0136). Wanneer een partij bij de inspectiepost wordt aangeboden
      om aldaar te worden overgeladen, stelt de belanghebbende bij de lading de keuringsdierenarts bij aankomst van de
      partij op een door de keuringsdierenarts vastgestelde wijze in kennis van het vermoedelijke tijdstip waarop de
      partij wordt uitgeladen, van de bestemming van de partij en, indien de keuringsdierenarts daartoe verzoekt, van de
      precieze plaats waar de partij wordt overgeladen. 2. Het zevende lid komt te luiden:

      3 Bij de aankomst op de inspectiepost wordt de keuringsdierenarts het originele certificaat overgelegd, bedoeld
      in [afdeling 5 van de hoofdstukken 4][ref1], [5][ref2] of [10][ref3], [afdeling 4a van hoofdstuk 9][ref4],
      [afdeling 4 van hoofdstuk 11][ref5] of [afdeling 2 van hoofdstuk 11A][ref6], onderscheidenlijk het originele
      document, bedoeld in [artikel 2.16, tweede lid, onderdeel c][ref7].

      4 Ten aanzien van het in het derde lid bedoelde originele certificaat of document geldt dat:

      a. de geldigheidsduur ervan niet is verstreken, en

      b. het document, voor zover van toepassing, in overeenstemming met de voor het desbetreffende product geldende
      regelgeving van de Europese Gemeenschap is opgesteld en afgegeven, volledig ingevuld, gedagtekend en ondertekend.

      5 De partij wordt bij aankomst op de inspectiepost ter onderzoek aangeboden aan de keuringsdierenarts.

      6 De keuringsdierenarts onderwerpt de voor Nederland of een lidstaat bestemde partij in de inspectiepost aan een
      documentencontrole, een overeenstemmingscontrole en een materiële controle overeenkomstig artikel 4, derde en
      vierde lid, van [richtlijn 97/78/EG](31997L0078). In de gevallen bedoeld in artikel 10, eerste en derde lid, van
      [richtlijn 97/78/EG](31997L0078), is de keuringsdierenarts bevoegd om niet elke partij aan een materiële controle
      te onderwerpen.

      7 De controles, bedoeld in het zesde lid, worden niet verricht indien de in dat lid bedoelde partij:

      a. over zee of door de lucht naar de haven of luchthaven van bestemming wordt vervoerd, zonder in de inspectiepost
      te worden gelost,

      b. wordt gelost op een loskade in de inspectiepost en binnen een tijdsbestek van 7 dagen na lossing in een ander
      schip is overgeladen, of

      c. wordt gelost op een terminal in de inspectiepost en binnen een tijdsbestek van 12 uur na lossing in een ander
      vliegtuig is overgeladen.

      Het in de vorige volzin bepaalde is slechts van toepassing indien de haven of luchthaven van bestemming over een
      inspectiepost of, indien het een haven of luchthaven in een lidstaat betreft, over een grensinspectiepost als
      bedoeld in artikel 2, tweede lid, onderdeel g, van [richtlijn 97/78/EG](31997L0078) beschikt. Bij overschrijding
      van de tijdstippen bedoeld in de onderdelen b en c, wordt de partij onder door de keuringsdierenarts te stellen
      voorwaarden opgeslagen en onderwerpt de keuringsdierenarts de partij aan een documentencontrole als bedoeld in
      het zesde lid en tevens, indien de opslag in de haven of luchthaven langer dan 20 dagen onderscheidenlijk 48 uur
      bedraagt, aan een overeenstemmingscontrole en een materiële controle als bedoeld in dat lid.

      8 De keuringsdierenarts onderwerpt een partij als bedoeld in [artikel 2.16, derde lid][ref8], in de inspectiepost
      aan een documentencontrole en een overeenstemmingscontrole overeenkomstig artikel 4, derde en vierde lid, van
      [richtlijn 97/78/EG](31997L0078).

      9 De keuringsdierenarts onderwerpt de voor een derde land bestemde partij in de inspectiepost aan een
      documentencontrole en een overeenstemmingscontrole overeenkomstig artikel 4, derde en vierde lid, van [richtlijn
      97/78/EG](31997L0078).

      10 De keuringsdierenarts is bevoegd de controles, bedoeld in het negende lid, achterwege te laten, indien de in dat
      lid bedoelde partij:

      a. zonder in de inspectiepost te worden gelost over zee of door de lucht naar een haven of luchthaven in een derde
      land wordt vervoerd,

      b. wordt gelost op een loskade in de inspectiepost e

      c. en binnen een tijdsbestek van 7 dagen na lossing in een ander schip is overgeladen om naar een derde land te
      worden verzonden, of d. wordt gelost op een terminal in de inspectiepost en binnen een tijdsbestek van 12 uur na
      lossing in een ander vliegtuig is overgeladen om naar een derde land te worden verzonden.

      11 Het zesde en negende lid zijn van overeenkomstige toepassing op een in die leden bedoelde partij die op
      het grondgebied van de Europese Gemeenschap wordt opgeslagen in een van de in [artikel 2.23][ref9] genoemde
      opslagruimten.

      12 Onverminderd het zesde tot en met elfde lid, verricht de keuringsdierenarts indien er naar zijn oordeel gevaar
      bestaat dat de gezondheid van mens of dier wordt bedreigd of in de in de artikelen 14, eerste lid, en 20, eerste
      lid, van [richtlijn 97/78/EG](31997L0078) bedoelde gevallen voorts alle door hem passend geachte veterinaire
      controles.


