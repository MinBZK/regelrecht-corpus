  - number: 2.1a
    text: |-
      1 Het brengen in Nederland van producten van dierlijke oorsprong, die zijn bestemd voor menselijke consumptie,
      is verboden.

      2 Het verbod, bedoeld in het eerste lid, geldt niet indien is voldaan aan [hoofdstuk 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Hoofdstuk3
