  - number: '2.18'
    text: |-
      1 Met betrekking tot een partij die bestemd is voor een derde land:

      a. heeft de minister vooraf toestemming verleend voor het brengen van de partij in Nederland;

      b. heeft de belanghebbende bij de lading voorafgaand aan het brengen van de partij in Nederland aan de minister
      schriftelijk toegezegd de partij weer in bezit te zullen nemen, alsmede schriftelijk toegezegd de producten
      overeenkomstige [artikel 2.24, tweede lid][ref1], te behandelen, indien de producten in het derde land worden
      geweigerd;

      c. vindt na het verlaten van de inspectiepost, of na uitslag uit een van de in [artikel 2.23a, tweede lid][ref2],
      bedoelde opslagruimten, het vervoer over Nederlands grondgebied onder douanetoezicht plaats, zonder splitsing of
      lossing van de partij, in verzegelde voertuigen of in verzegelde containers;

      d. verlaat de partij binnen 30 dagen na het vertrek uit de inspectiepost de Europese Gemeenschap.

      2 Indien de in het eerste lid bedoelde partij in het derde land wordt geweigerd, is de belanghebbende bij de lading
      verplicht om op eerste vordering van de keuringsdierenarts de partij overeenkomstig het eerste lid, onderdeel b, in
      bezit te nemen en te behandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.24
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23a
