  - number: '4.18'
    text: |-
      1 De minister schort een op grond van [artikel 4.16][ref1] afgegeven erkenning tijdelijk op, indien de
      keuringsdierenarts heeft geconstateerd dat de voorschriften, bedoeld in de [artikelen 4.16][ref2] en [4.17][ref3]
      niet worden nageleefd, en wanneer de keuringsdierenarts is gebleken dat de in hoofdstuk VIII, punt 51, derde alinea
      van bijlage I van [richtlijn 71/118/EEG](31971L0118) bedoelde maatregelen onvoldoende zijn om dit te verhelpen.
      Opschorting geschiedt niet dan na voorafgaande waarschuwing en na het verstrijken van een daarbij te stellen
      termijn, waarbinnen alsnog aan voornoemde voorschriften dient te zijn voldaan.

      2 Indien blijkt dat de exploitant of de eigenaar, dan wel diens vertegenwoordiger van de inrichting de
      geconstateerde gebreken na opschorting niet alsnog binnen een daartoe gestelde termijn verhelpt, trekt de minister
      de erkenning in.


