  - number: '5.5'
    text: |-
      1 Vlees van vrij wild is afkomstig van vrij wild:

      a. dat is gedood overeenkomstig de [Flora- en faunawet][ref1];

      b. dat niet afkomstig is uit een gebied waar vrij wild ingevolge artikel 10, vierde lid, of 11, eerste lid, van
      [richtlijn 92/45/EEG](31992L0045) is onderzocht op de aanwezigheid van residuen, waarbij sporen van residuen zijn
      aangetroffen;

      c. dat onmiddellijk na het doden is bereid overeenkomstig hoofdstuk III van bijlage I van [richtlijn 92/45/EEG]
      (31992L0045) en binnen ten hoogste twaalf uur na het doden is vervoerd naar:

      1º. een op grond van [artikel 5.13][ref2] erkende vrij-wildverwerkings-inrichting, dan wel

      2º. met inachtneming van [artikel 5.7][ref3], een vrij-wildverwerkings-inrichting waaraan ontheffing is verleend
      als bedoeld in [artikel 12.6, derde lid][ref4], dan wel,

      3º. een verzamelplaats, met dien verstande dat grof vrij wild op de verzamelplaats op een temperatuur van ten
      hoogste 7°C en klein vrij wild op een temperatuur van ten hoogste 4°C wordt gebracht en dat het wild van daaruit
      binnen 12 uur, dan wel uiterlijk op de eerstvolgende werkdag wordt vervoerd naar een inrichting als bedoeld onder
      1°, onderscheidenlijk onder 2°;

      d. dat na doding door de keuringsdierenarts visueel is onderzocht teneinde eventuele afwijkingen op te sporen en na
      te gaan of de dood niet aan andere oorzaken dan de jacht is te wijten;

      e. dat na doding is gehanteerd onder bevredigende hygiënische omstandigheden overeenkomstig de hoofdstukken III, IV
      en V van bijlage I van [richtlijn 92/45/EEG](31992L0045);

      f. dat post mortem is gekeurd door de keuringsdierenarts of diens assistent overeenkomstig hoofdstuk V van bijlage
      I van [richtlijn 92/45/EEG](31992L0045);

      g. dat geen afwijkingen heeft vertoond, met uitzondering van bij het doden opgelopen traumatische laesies of
      van plaatselijke misvormingen of afwijkingen, voor zover deze het vlees niet ongeschikt maken voor menselijke
      consumptie, noch enig gevaar opleveren voor de gezondheid van de mens;

      h. waarvan, in het geval van klein vrij wild dat niet onmiddellijk na het doden is ontweid, een representatief
      monster van dieren van dezelfde herkomst door de keuringsdierenarts is gekeurd overeenkomstig hoofdstuk V, punt 1,
      van bijlage I van [richtlijn 92/45/EEG](31992L0045), met dien verstande dat indien een voor de mens besmettelijke
      ziekte, dan wel één van de in hoofdstuk V, punt 4, van bijlage I van [richtlijn 92/45/EEG](31992L0045) genoemde
      gebreken is geconstateerd, de controle op de gehele partij wordt uitgevoerd, waarbij de keuringsdierenarts de
      gehele partij voor menselijke consumptie kan uitsluiten, dan wel ieder karkas afzonderlijk kan onderzoeken.

      2 Vlees van vrij wild is:

      a. verkregen in een:

      1. op grond van [artikel 5.13, eerste lid][ref5], erkende vrij-wildverwerkingsinrichting;

      2. op grond van [artikel 5.13, tweede lid][ref6], met inachtneming van [artikel 5.7][ref7], erkende vrij-
      wildverwerkingsinrichting, dan wel

      3. vrij-wildverwerkingsinrichting waaraan, met inachtneming van [artikel 5.7][ref8], een ontheffing is verleend als
      bedoeld in [artikel 12.6, derde lid][ref9];

      b. bij de keuring, bedoeld in het eerste lid, onderdeel f, geschikt verklaard voor menselijke consumptie, met dien
      verstande dat het vlees voor menselijke consumptie ongeschikt wordt verklaard indien:

      1º. is geconstateerd dat het één van de gebreken vertoont die zijn genoemd in hoofdstuk V, punt 3, onder e, van
      bijlage I van [richtlijn 92/45/EEG](31992L0045), dan wel in beslag is genomen overeenkomstig punt 4 van voornoemd
      hoofdstuk;

      2º. de aanwezigheid is vastgesteld van een voor de mens besmettelijke ziekte of van trichinen;

      3º. het afkomstig is van dieren die steffen hebben opgenomen waardoor het vlees gevaarlijk of schadelijk kan
      worden voor de gezondheid van de mens, en waarover door de Commissie van de Europese Gemeenschappen of de
      Raad van de Europese Unie een besluit is genomen als bedoeld in artikel 3, tweede lid, onderdeel iii, van
      [richtlijn 92/45/EEG](31992L0045), dan wel, zolang dit besluit niet is genomen, indien in het vlees sporen van
      residuen voorkomen in hoeveelheden die de krachtens de [Diergeneesmiddelenwet][ref10], [Warenwet][ref11] of
      [Bestrijdingsmiddelenwet 1962][ref12] toegestane toleranties overschrijden;

      4º. is behandeld met ioniserende of ultraviolette stralen, tenzij deze behandeling ingevolge de regelgeving van de
      Europese Gemeenschap is toegestaan, dan wel met andere stoffen waardoor de organoleptische eigenschappen van het
      vlees kunnen worden aangetast, of met andere kleurstoffen dan die welke voor het aanbrengen van het keurmerk worden
      gebruikt;

      5º. voor zover het vlees afkomstig is van everzwijn of van andere voor trichinose gevoelige soorten, het vlees niet
      is onderzocht op de aanwezigheid van trichinosen met behulp van een digestiemethode of trichinoscopisch onderzoek
      overeenkomstig artikel 3, derde lid, van [richtlijn 92/45/EEG](31992L0045);

      c. na de post mortem keuring onder bevredigende hygiënische omstandigheden opgeslagen overeenkomstig hoofdstuk
      X van bijlage I van [richtlijn 92/45/EEG](31992L0045) in een op grond van [artikel 5.13][ref13] erkende vrij-
      wildverwerkingsinrichting, in een erkend koel- en vrieshuis of, met inachtneming van [artikel 5.8][ref14], in een
      vrij-wildverwerkingsinrichting waaraan ontheffing is verleend als bedoeld in [artikel 12.6, derde lid][ref15];

      d. op hygiënische wijze verpakt overeenkomstig hoofdstuk VIII van [richtlijn 92/45/EEG](31992L0045);

      e. onder bevredigende hygiënische omstandigheden vervoerd overeenkomstig hoofdstuk XI van bijlage I van [richtlijn
      92/45/EEG](31992L0045);

      f. voor zover het delen van karkassen of uitgebeend vlees van vrij wild betreft, deze overeenkomstig afdeling 4,
      onderscheidenlijk 5 van dit hoofdstuk in Nederland zijn gebracht, met dien verstande dat zolang de voorschriften
      voor het op het grondgebied van de Europese Gemeenschap brengen van vlees van vrij wild vanuit derde landen nog
      niet volledig ingevolge de regelgeving van de Europese Gemeenschap zijn vastgesteld, het ompakken of verwerken van
      uit een derde land afkomstig vlees dat wordt bestemd voor een lid-staat, slechts is toegestaan indien is voldaan
      aan de eisen van de lid-staat van bestemming;

      g. voor zover het slachtafvallen betreft die zijn bestemd voor een lid-staat, deze zijn behandeld overeenkomstig
      [richtlijn 77/99/EEG](31977L0099);

      h. geëtiketteerd onder aanduiding van de benaming van de diersoort.


