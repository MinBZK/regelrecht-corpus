      1 De in [artikel 11.2][ref1] genoemde overige dierlijke produkten zijn niet afkomstig uit een bedrijf, inrichting
      of zone als bedoeld in artikel 5 van [richtlijn 92/118/EEG](31992L0118).

      2 Het eerste lid geldt niet indien de aldaar bedoelde produkten overeenkomstig de van toepassing zijnde
      communautaire regelgeving een warmtebehandeling hebben ondergaan.


