  - number: '9.10'
    text: |-
      1 Erkenning van een werkplaats voor de produktie van gehakt vlees van runderen,
      varkens, schapen of geiten, ongeacht of deze zich bevindt in een overeenkomstig
      [artikel 9, tweede lid, van de Regeling uitvoer vers vlees en vleesbereidingen 1985][ref1] erkende uitsnijderij,
      dan wel in een overeenkomstig artikel 13 van de Regeling keuring en handelsverkeer vleesprodukten 1993 erkende
      vleesproduktenfabriek, vindt slechts plaats, indien:

      a. de werkplaats voldoet aan hoofdstuk I, punten 1 en, voor zover van toepassing, 2, van bijlage I van [richtlijn
      94/65/EG](31994L0065);

      b. die werkplaats voldoet aan, voor zover van toepassing, de hoofdstukken I en III van bijlage I van [richtlijn
      64/433/EEG](31964L0433), dan wel hoofdstuk I van bijlagen A en B van [richtlijn 77/99/EEG](31977L0099);

      c. in die werkplaats overigens wordt voldaan aan, voor zover van toepassing, hoofdstuk V van bijlage I van
      [richtlijn 64/433/EEG](31964L0433), dan wel hoofdstuk II van bijlage A van [richtlijn 77/99/EEG](31977L0099).

      2 Erkenning van een werkplaats voor de produktie van gehakt vlees als bedoeld in [artikel 9.4][ref2],
      ongeacht of deze zich bevindt in een overeenkomstig [artikel 4.16][ref3] of een overeenkomstig
      [artikel 31 van de Regeling keuring en handelsverkeer konijne- en hazevlees 1993][ref4], in een overeenkomstig
      [artikel 5.13][ref5] erkende vrij-wildverwerkingsinrichting, dan wel in een overeenkomstig artikel 13 van de
      Regeling keuring en handelsverkeer vleesprodukten 1993 erkende vleesproduktenfabriek, vindt slechts plaats, indien:

      a. de werkplaats voldoet aan hoofdstuk I, punten 1 en, voor zover van toepassing, 2, van bijlage I van [richtlijn
      94/65/EG](31994L0065);

      b. die werkplaats voldoet aan:

        - de hoofdstukken I en III van bijlage I van [richtlijn 71/118/EEG](31971L0118), indien het gehakt vlees van vlees
      van kippen, kalkoenen, parelhoenders, eenden, ganzen, gekweekt of vrij vederwild, dan wel van gekweekte konijnen of
      hazen betreft;
        - hoofdstuk I van bijlage I van [richtlijn 92/45/EEG](31992L0045), indien het gehakt vlees van vlees van klein vrij
      wild betreft, dan wel
        - voor zover de werkplaats zich bevindt in een erkende vleesproduktenfabriek, hoofdstuk I van bijlage A en
      hoofdstuk I, punt 1, van bijlage B;

      c. in die werkplaats overigens wordt voldaan aan, voor zover van toepassing, hoofdstuk V van bijlage I van
      [richtlijn 71/118/EEG](31971L0118), hoofdstuk II van bijlage A van [richtlijn 77/99/EEG](31977L0099), dan wel
      hoofdstuk II van bijlage I van [richtlijn 92/45/EEG](31992L0045).

      3 Erkenning van een werkplaats voor de produktie van gehakt vlees vindt eveneens plaats, indien is voldaan aan
      hoofdstuk V van bijlage I en hoofdstuk I van bijlage II van [richtlijn 71/118/EEG](31971L0118), mits:

      a. voor zover die werkplaats tevens op grond van artikel 10 van het Besluit
      produktie en handel vers vlees, [artikel 4.16, tweede lid][ref6], dan wel
      [artikel 31, vierde lid, van de Regeling keuring en handelsverkeer konijne- en hazevlees 1993][ref7] is erkend als
      uitsnijderij, in die werkplaats en uitsnijderij per week in totaal niet meer dan 5 ton vers vlees, gehakt vlees en
      vleesbereidingen worden geproduceerd;

      b. voor zover die werkplaats tevens op grond van artikel 13, tweede lid, van de Regeling keuring en handelsverkeer
      vleesprodukten 1993 is erkend als vleesproduktenfabriek, in die werkplaats en fabriek per week in totaal niet meer
      dan 7,5 ton gehakt vlees, vleesbereidingen en vleesprodukten worden geproduceerd, dan wel

      c. in andere gevallen dan als bedoeld in onderdeel a of b, in die werkplaats per week in totaal niet meer dan 7,5
      ton gehakt vlees of vleesbereidingen worden geproduceerd.

      4 In afwijking in zoverre van het tweede lid vindt erkenning van een werkplaats voor de produktie van gehakt vlees
      als bedoeld in [artikel 9.4][ref8] tot en met 31 december 1996 eveneens plaats, indien die werkplaats slechts
      voldoet aan het tweede lid, onderdeel c, mits:

      a. die werkplaats op 31 december 1995 reeds gehakt vlees als bedoeld in [artikel 9.4][ref9] produceerde;

      b. ten aanzien van die werkplaats op 31 december 1995 op grond van deze regeling geen inrichtingseisen van
      toepassing waren, en

      c. voor zover die werkplaats zich bevindt in een andere inrichting, ten aanzien van die inrichting op 31 december
      1995 op grond van deze regeling, de Regeling uitvoer vers vlees en vleesbereidingen 1985, de Regeling keuring en
      handelsverkeer vleesprodukten 1993, de [Regeling keuring en handelsverkeer konijne- en hazevlees 1993][ref10], het
      [Besluit produktie en handel vers vlees][ref11], het [Besluit produktie en handel vlees van vrij wild][ref12], dan
      wel het [Besluit produktie en handel vleesprodukten][ref13] geen inrichtingseisen van toepassing waren.

      5 In een werkplaats die zich bevindt in een uitsnijderij of vleesproduktenfabriek als bedoeld in het eerste,
      tweede of derde lid, dan wel in een vrij-wildverwerkingsinrichting als bedoeld in het tweede lid, mogen de voor
      het personeel bestemde lokalen, apparatuur en installaties, alsmede ieder lokaal ten aanzien waarvan geen gevaar
      bestaat voor verontreiniging van grondstoffen of produkten zonder onmiddellijke verpakking, gemeenschappelijk zijn.

      6 Een erkenning van een werkplaats wordt door de minister verleend, nadat uit een door de keuringsdierenarts
      ingesteld onderzoek in gebleken dat, in voorkomend geval, aan het eerste, tweede of derde lid is voldaan.

      7 Een erkenning als bedoeld in het vierde lid wordt geacht door de minister te zijn verleend, indien aan dat lid
      wordt voldaan.

      8 [Artikel 4.16, vierde en vijfde lid][ref14], is van overeenkomstige toepassing.


