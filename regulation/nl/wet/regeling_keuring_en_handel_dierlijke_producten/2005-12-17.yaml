      1 In deze regeling wordt verstaan onder:




                [richtlijn 64/433/EEG](31964L0433):

                richtlijn van de Raad van de Europese Gemeenschappen van 26 juni 1964 betreffende de
      gezondheidsvoorschriften voor de productie en het in de handel brengen van vers vlees (PbEG 1991, L 268);




                [richtlijn 71/118/EEG](31971L0118):

                richtlijn van de Raad van de Europese Gemeenschappen van 15 februari 1971 inzake gezondheidsvraagstukken
      op het gebied van de productie en het in de handel brengen van vers vlees van pluimvee (PbEG 1993, L 62);




                [richtlijn 72/461/EEG](31972L0461):

                richtlijn van de Raad van de Europese Gemeenschappen van 12 december 1972 inzake veterinairrechtelijke
