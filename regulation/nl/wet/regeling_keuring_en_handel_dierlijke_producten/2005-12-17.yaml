  - number: 10.9a
    text: |-
      In afwijking van artikel 10.9, eerste lid, aanhef en onderdeel a, mag een partij vleesbereidingen als bedoeld in
      artikel 10.4 die afkomstig is uit Tsjechië, Estland, Cyprus, Letland, Litouwen, Hongarije, Malta, Polen, Slovenië
      of Slowakije en vóór 1 mei 2004 is verkregen in een inrichting die erkend was voor uitvoer naar de Europese
      Gemeenschap, tot en met 30 april 2005 voorzien zijn van het keurmerk, bedoeld in artikel 3, onderdeel a, van
      beschikking 2004/280/EG, mits het certificaat of document dat de partij vergezelt, door de bevoegde autoriteiten
      van het land van herkomst is voorzien van de verklaring: ‘Vóór 1 mei 2004 geproduceerd overeenkomstig Beschikking
      2004/280/EG van de Commissie.’
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel10.9a
  - number: '10.10'
    text: |-
      1 Een partij vleesbereidingen, niet zijnde vleesbereidingen van eenhoevigen, die via Nederland voor het eerst
      op het grondgebied van de Europese Gemeenschap wordt gebracht en is bestemd voor Nederland of een lid-staat, is
      afkomstig uit:

      a. een derde land of gedeelte van een derde land van waaruit het op het grondgebied van de Europese Gemeenschap
      brengen van het vlees waaruit die vleesbereidingen zijn vervaardigd is toegestaan op grond van:

      1º. voor zover het vleesbereidingen van vlees van runderen, varkens, schapen of geiten betreft, deel 1 van bijlage
      II bij beschikking 79/542/EEG;

      2º. voor zover het vleesbereidingen van vlees van pluimvee als bedoeld in [richtlijn 71/118/EEG](31971L0118)
      bereft, beschikking 94/984/EG;

      3º. voor zover het vleesbereidingen van vlees van gekweekt vederwild betreft, beschikking 2000/585/EG, met dien
      verstande dat vlees van gekweekte loopvogels ook afkomstig mag zijn uit Namibië, Zimbabwe of Zuid-Afrika;

      4º. voor zover het vleesbereidingen van vlees van vrij wild, dan wel van vrij vederwild betreft, deel I
      onderscheidenlijk II van de bijlage van beschikking 94/86/EG, dan wel

      5º. voor zover het vleesbereidingen van vlees van gekweekt wild betreft, deel 1 van bijlage II bij beschikking
      79/542/EEG, en

      b. een gebied of zone van waaruit de invoer om veterinairrechtelijke redenen is verboden ingevolge, voor zover van
      toepassing, de [richtlijnen 72/462/EEG](31972L0462) en [92/118/EEG](31992L0118),

      en voldoet aan de in vernoemde beschikkingen opgenomen eisen ten aanzien van het derde land of respectievelijk
      gedeelte van het derde land van herkomst.

      2 Een partij vleesbereidingen als bedoeld in [artikel 10.4][ref1] gaat vergezeld van een op de partij betrekking
      hebbend gezondheidscertificaat waarvan het model overeenstemt met het in bijlage II bij beschikking 2000/572/EG
      vastgestelde model.

      3 Het gezondheidscertificaat, bedoeld in het tweede lid, voldoet, voor zover van toepassing, aan bijlage XI,
      hoofdstuk D, punt 4, van [verordening 999/2001/EEG](32001R0999).

      4 Een partij vleesbereidingen als bedoeld in [artikel 10.4][ref2] is afkomstig uit een inrichting die de in
      bijlage I bij [richtlijn 94/65/EG](31994L0065) bedoelde garanties biedt en die, zodra deze is vastgesteld en in
      werking getreden, voorkomt op de voor vleesbereidingen uit het betrokken land van herkomst geldende voorlopige
      lijst van inrichtingen als bedoeld in beschikking 95/408/EG, die alsdan ter inzage ligt in de bibliotheek van het
      Ministerie van Landbouw, Natuurbeheer en Visserij in Den Haag, met dien verstande dat indien bij de vaststelling
      van voornoemde lijst is voorzien in overgangsbepalingen het vlees met inachtneming van die bepalingen afkomstig mag
      zijn uit een inrichting die voldoet aan [richtlijn 94/65/EG](31994L0065).

      5 Een partij vleesbereidingen als bedoeld in [artikel 10.4][ref3] is diepgevroren in de werkplaats of werkplaatsen
      van oorsprong, voldoet aan de in de artikelen 5 en 7 van [richtlijn 94/65/EG](31994L0065) vastgestelde eisen en de
      voorschriften vermeld op het gezondheidscertificaat als bedoeld in het tweede lid en is voorzien van een officieel
      keurmerk waaruit blijkt uit welke inrichting zij afkomstig is.

      6 Een partij vlees bereidingen als bedoeld in [artikel 10.4][ref4] is op hygiënische wijze verpakt en wordt op
      hygiënische wijze vervoerd overeenkomstig [artikel 10.6, eerste lid, onderdeel d, onderscheidenlijk f][ref5], en
      vertoont geen tekenen van bederf of ondeugdelijkheid.

      7 De partij vleesbereidingen is niet verkregen van of met vlees van landbouwhuisdieren als bedoeld in artikel 1 van
      [richtlijn 96/22/EG](31996L0022) waaraan stoffen of producten zijn toegediend die ingevolge artikel 3, onderdeel a,
      van die richtlijn niet aan landbouwhuisdieren mogen worden toegediend, tenzij aan de voorwaarden ingevolge artikel
      11 van genoemde richtlijn is voldaan.

      8 Indien de in het eerste lid bedoelde partij vlees bereidingen betreft van of met vlees van runderen, schapen of
      geiten is voldaan aan bijlage XI, hoofdstuk A, punt 15, van [verordening 999/2001/EG](32001R0999).


