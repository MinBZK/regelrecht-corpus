  - number: '9.14'
    text: |-
      Gehakt vlees dat voor menselijke consumptie ongeschikt is verklaard of anderszins niet geschikt wordt bevonden
      voor menselijke consumptie, wordt onder toezicht van de keuringsdierenarts of diens assistent onbruikbaar
      gemaakt voor menselijke consumptie en behandeld overeenkomstig de bij of krachtens de [Destructiewet][ref1] of de
      [Gezondheids- en welzijnswet voor dieren][ref2] ter implementatie van [richtlijn 90/667/EEG](31990L0667) aan de
      verwerking van dergelijk materiaal gestelde regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002244
      [ref2]: https://wetten.overheid.nl/BWBR0005662
