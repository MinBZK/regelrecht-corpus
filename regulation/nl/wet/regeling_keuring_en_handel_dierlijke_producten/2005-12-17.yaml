  - number: '2.15'
    text: |-
      1 Indien wordt vermoed of geconstateerd dat in de partij verwekkers van ziekten, zoönosen of andere aandoeningen,
      bedoeld in artikel 7, eerste lid, onderdeel a, van [richtlijn 89/662/EEG](31989L0662), aanwezig zijn of dat de
      producten afkomstig zijn uit een met een epidemische dierziekte besmet gebied kan de minister, indien hij de
      aanwezigheid van verwekkers van ziekten, zoönosen of andere aandoeningen vermoedt, gelasten dat de producten voor
      rekening van de verzender of diens gemachtigde, dan wel de afnemer, in tijdelijke afzondering worden geplaatst, dan
      wel worden, zonder vergoeding van Staatswege:

      a. en voor rekening van de verzender of diens gemachtigde, al naar gelang de minister daaromtrent heeft besloten en
      met inachtneming van diens aanwijzingen, de producten vernietigd, of

      b. voor rekening van de afnemer, al naar gelang de minister daaromtrent heeft besloten en met inachtneming van
      diens aanwijzingen, de producten voor andere doeleinden gebruikt dan waarvoor ze zijn bestemd.

      2

      3 Onverminderd het eerste lid en tenzij in deze regeling anders is bepaald worden, indien wordt vermoed of
      geconstateerd dat niet wordt voldaan aan de onderhavige regeling, zonder vergoeding van Staatswege en voor rekening
      van de verzender of diens gemachtigde, al naar gelang de minister daaromtrent heeft besloten en met inachtneming
      van diens aanwijzingen, de producten in tijdelijke afzondering geplaatst, indien de minister vermoedt dat niet
      wordt voldaan aan de onderhavige regeling, dan wel vernietigd of voor andere doeleinden gebruikt dan waarvoor ze
      zijn bestemd, bijvoorbeeld door terugzending met toestemming van de bevoegde veterinaire autoriteit van het land
      van oorsprong.

      4 Tenzij hygiënische of veterinairrechtelijke voorschriften zich hiertegen verzetten, laat de minister de keuze
      tussen de in het derde lid bedoelde maatregelen aan de verzender of diens gemachtigde.
    url: https://wetten.overheid.nl/BWBR0006727/2005-12-17#Artikel2.15
  - number: '2.16'
    text: |-
      1 Het verbod, bedoeld in [artikel 2.1, tweede lid][ref1], geldt niet terzake van het brengen in Nederland van niet
      in [artikel 11.8][ref2] genoemde overige dierlijke producten die via Nederland voor het eerst op het grondgebied
      van de Europese Gemeenschap worden gebracht en die zijn verzonden vanuit een derde land en zijn bestemd voor
      Nederland, een lid-staat of Noorwegen.

      2 Behalve voor separatorvlees als bedoeld in [artikel 4.1][ref3], gehakt vlees van andere dieren dan runderen,
      varkens, schapen of geiten en vleesbereidingen van vlees van eenhoevigen, geldt het verbod bedoeld in
      [artikel 2.1, tweede lid][ref4], niet terzake van het brengen in Nederland van producten, niet zijnde de in het
      eerste lid bedoelde producten, die via Nederland voor het eerst op het grondgebied van de Europese Gemeenschap
      worden gebracht en zijn verzonden vanuit een derde land mits wordt voldaan, voorzover van toepassing, aan
      [verordening 136/2004/EG](32004R0136) en de [artikelen 2.17 tot en met 2.23a][ref5], [2.23e][ref6], [2.23g][ref7],
      alsmede [2.23i tot en met 2.23k][ref8] en, met inachtneming van [artikel 2.16a][ref9]:

      a. indien de producten zijn bestemd voor Nederland, een lid-staat of Noorwegen:

      1º. [afdeling 5 van hoofdstuk 4][ref10] indien het vers vlees van pluimvee betreft;

      2º. [afdeling 5 van hoofdstuk 5][ref11] indien het vlees van vrij wild of gehele stukken vrij wild betreft, dan wel

      3º. [afdeling 4 van hoofdstuk 11][ref12] indien het in [artikel 11.8][ref13] genoemde overige dierlijke producten
      betreft, dan wel

      4º. tot en met 30 april 2004, artikel 29, eerste lid, van [verordening 1774/2002/EG](32002R1774) en afdeling 2 van
      hoofdstuk 11A, indien het dierlijke bijproducten betreft;

      5º. tot en met 31 oktober 2005, artikel 29, van [verordening 1774/2002/EG](32002R1774) en, voor zover van
      toepassing, artikel 1 van [verordening 780/2004/EG](32004R0780), indien het dierlijke bijproducten betreft;

      6º. met ingang van 1 november 2005, artikel 29 van [verordening 1774/2002/EG](32002R1774), indien het dierlijke
      bijproducten betreft, dan wel.

      b. indien de producten zijn bestemd voor Nederland of een lid-staat:

      1º. [afdeling 4a van hoofdstuk 9][ref14] indien het gehakt vlees van runderen, varkens, schapen of geiten betreft,
      dan wel

      2º. [afdeling 5 van hoofdstuk 10][ref15] indien het vleesbereidingen, niet bereid van vlees van eenhoevigen
      betreft, dan wel

      c. indien de producten genoemd in onderdeel a zijn bestemd voor een derde land, niet zijnde Noorwegen, of
      zijn bestemd om te worden geleverd aan zeevervoermiddelen als proviand voor bemanning en passagiers, of de
      producten, bedoeld in onderdeel b, zijn bestemd voor een derde land of zijn bestemd om te worden geleverd aan
      zeevervoermiddelen als proviand voor bemanning en passagiers, de betrokken partij vergezeld gaat van een bij die
      partij behorend origineel document.

      3 Het verbod, bedoeld in [artikel 2.1, tweede lid][ref16], geldt niet terzake van het via Nederland in de Europese
      Gemeenschap binnenbrengen van producten die door een derde land zijn geweigerd en vanuit het grondgebied van de
      Europese Gemeenschap naar het betrokken land zijn verzonden, mits:

      a. wordt voldaan aan [verordening 136/2004/EG](32004R0136) en de
      [artikelen 2.17, eerste, tweede, vijfde en achtste lid][ref17], [artikel 2.18a][ref18],
      [artikel 2.19, eerste lid][ref19], en [artikel 2.22, eerste, tweede lid en vijfde lid][ref20], alsmede aan artikel
      15, eerste lid, onderdeel a, van [richtlijn 97/78/EG](31997L0078), en

      b. indien de producten naar het betrokken derde land zijn verzonden vanuit een lid-staat, de minister vooraf
      toestemming heeft verleend voor het binnenbrengen van de producten en de bevoegde autoriteit van de lid-staat
      die het in artikel 15, eerste lid, onderdeel a, van [richtlijn 97/78/EG](31997L0078) bedoelde certificaat heeft
      afgegeven met de terugname van de partij in de lid-staat instemt.

      4 Het verbod, bedoeld in [artikel 2.1, eerste lid][ref21], geldt niet ter zake van het brengen in Nederland door
      reizigers of als zending aan particulieren van:

      a. producten als bedoeld in artikel 1, eerste juncto vierde lid, van [verordening 745/2004/EG](32004R0745), en

      b. producten als bedoeld in artikel 2 van [verordening 745/2004/EG](32004R0745), mits wordt voldaan aan de
      voorwaarden, genoemd in dat artikel.

      5 Het verbod, bedoeld in [artikel 2.1, eerste lid][ref22], geldt voorts niet terzake van het brengen
      in Nederland door reizigers of als zending aan particulieren van producten als bedoeld in artikel 1,
      eerste lid, van [verordening 745/2004/EG](32004R0745), niet zijnde producten als bedoeld in artikel 1,
      vierde lid, onderscheidenlijk artikel 2 van [verordening 745/2004/EG](32004R0745), mits wordt voldaan aan
      [artikel 2.22a][ref23].


