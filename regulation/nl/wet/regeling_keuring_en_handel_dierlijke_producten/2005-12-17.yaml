              Overeenkomst:

                Overeenkomst van 17 december 1996 tussen de Europese Gemeenschap en Nieuw-Zeeland inzake sanitaire
      maatregelen voor de handel in levende dieren en dierlijke producten (PbEG 1997, L 57).



              minister:

                Minister van Landbouw, Natuur en Voedselkwaliteit;



               VWA:

                de Voedsel en Waren Autoriteit, ingesteld bij besluit van de Minister van Volksgezondheid, Welzijn en
      Sport van 8 juli 2002 (Stcrt. 127);



              werkelijke kosten:

                de kosten die betrekking hebben op de administratiekosten, de loonkosten en de sociale premies van de met
      de onderzoeken en keuringen belaste personen van de RVV als mede de kosten van laboratoriumonderzoek;



              keuringsdierenarts:

                dierenarts verbonden aan de VWA;



              assistent:

                door de minister aangewezen keurmeester;



               ambtenaar:

                ambtenaar, bedoeld in artikel 114, eerste of tweede lid, van de Gezondheids- en welzijnswet voor dieren;



              officiële dierenarts:

                door de bevoegde centrale autoriteit van het land van verzending aangewezen dierenarts;



              inspectiepost:

                op Nederlands grondgebied gelegen inspectiepost aan de grens die voldoet aan de bij of krachtens artikel
      6 van [richtlijn 97/78/EEG](31997L0078) gestelde voorschriften en uit dien hoofde overeenkomstig dat artikel is
      aangewezen en erkend voor de controle van bepaalde soorten producten;



              douane-entrepot:

                opslagruimte als bedoeld in [Verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese
      Gemeenschappen van 12 oktober 1992 (PbEG L 302);



              vrij entrepot:

                opslagruimte als bedoeld in [Verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese
      Gemeenschappen van 12 oktober 1992 (PbEG L 302);



              ruimte voor tijdelijke opslag:

                opslagruimte als bedoeld in artikel 185 van de [Verordening (EEG) nr. 2454/93](31993R2454) van de
      Commissie van de Europese Gemeenschappen van 2 juli 1993 (PbEG L 253);



              lid-staat:

                lid-staat: lid-staat van de Europese Unie, niet zijnde Nederland;



              derde land:

                land, niet zijnde Nederland en niet zijnde een lid-staat;



              pluimvee:

                kippen, kalkoenen, parelhoenders, eenden en ganzen, alsmede gekweekt vederwild;



              vers vlees van pluimvee:

                alle voor menselijke consumptie geschikte delen van pluimvee, ook vacuüm of in gecontroleerde atmosfeer
      verpakt, niet zijnde gehakt vlees en niet zijnde vleesbereidingen, die, buiten de koudebehandeling, geen
      behandeling ter bevordering van de houdbaarheid hebben ondergaan;



              vrij wild:

                bejaagde niet-gedomesticeerde landzoogdieren, met inbegrip van niet-gedomesticeerde zoogdieren die in een
      gesloten gebied leven met eenzelfde vrijheid als vrij wild, en niet-gedomesticeerde vogels, niet zijnde vogels die
      in gevangenschap worden gekweekt of gehouden;



              grof vrij wild:

                niet-gedomesticeerde zoogdieren van de familie der hoefdieren;



              klein vrij wild:

                niet-gedomesticeerde zoogdieren van de familie der Leporidae en bejaagde niet-gedomesticeerde vogels,
      niet-zijnde vogels of Leporidae die in gevangenschap worden gekweekt of gehouden;



              vrij vederwild:

                niet-gedomesticeerde vogels, niet zijnde vogels die in gevangenschap worden gekweekt of gehouden;



              gehele stukken vrij wild:

                gehele stukken niet-onthuid gedood grof wild of gehele stukken niet-ontvederd of niet-ontheid en al dan
      niet ontweid gedood klein vrij wild;



              vlees van vrij wild:

                alle voor menselijke consumptie geschikte delen van vrij wild, niet zijnde gehakt vlees en
      vleesbereidingen en niet zijnde slachtafvallen van vrij vederwild, eenhoevig wild, wilde Leporidae en niet-
      gedomesticeerde landzoogdieren, niet zijnde hoefdieren;



              gekweekt vederwild:

                kwartels, duiven, fazanten, patrijzen en loopvogels (Ratites) en andere niet-gedomesticeerde vogels die
      in gevangenschap worden gekweekt of gehouden;



              vlees van gekweekt vederwild:

                alle voor menselijke consumptie geschikte delen van gekweekt vederwild, niet zijnde gehakt vlees en niet
      zijnde vleesbereidingen;



              gehakt vlees:

                vlees als bedoeld in artikel 2 van [richtlijn 64/433/EEG](31964L0433), 71/118/EEG of 92/45/EEG, dan wel
      vlees dat voldoet aan artikel 3, 6 of 8 van [richtlijn 91/495/EEG](31991L0495), dat in kleine stukken is gehakt of
      door een hakmolen is gehaald en waaraan ten hoogste 1% zout is toegevoegd;



              vleesproducten:

                producten als bedoeld in artikel 2, onderdeel a, aanhef, van [richtlijn 77/99/EEG](31977L0099), niet
      zijnde vlees, onderscheidenlijk producten als bedoeld in artikel 2, onderdeel a, onder i en ii, van die richtlijn;



              vleesbereidingen:

                vlees als bedoeld in artikel 2 van [richtlijn 64/433/EEG](31964L0433), 71/118/EEG of 92/45/EEG, dan wel
      vlees dat voldoet aan artikel 3, 6 of 8 van [richtlijn 91/495/EEG](31991L0495), waaraan levensmiddelen, kruiderijen
      of additieven zijn toegevoegd of dat een behandeling heeft ondergaan in een mate die niet volstaat om de inwendige
      celstructuur van het vlees te veranderen en aldus de kenmerken van vers vlees te doen verdwijnen;
                een andere behandeling heeft ondergaan dan de behandeling, bedoeld in artikel 2, onderdelen a en f, van
      [richtlijn 77/99/EEG](31977L0099);
      bereid is door toevoeging van levensmiddelen, kruiden of additieven, of
      onderworpen is aan een combinatie van de vorenbedoelde procédés, welke bereiding van dien aard is dat de
      celstructuur van het vlees niet is aangetast en dat er geen beensplinters in het eindproduct aanwezig zijn;



              producten:

                vers vlees van pluimvee;
      vlees van vrij wild of gehele stukken vrij wild;
      gehakt vlees;
      vleesbereidingen;
      overige dierlijke producten;
      dierlijke bijproducten;
      producten als bedoeld in artikel 1, eerste lid, van [verordening 745/2004/EG](32004R0745), voor zover door
      reizigers in de Europese Gemeenschap binnengebracht of aan particulieren in de Europese Gemeenschap toegezonden;



              partij:

                hoeveelheid producten van dezelfde aard waarvoor eenzelfde handelsdocument of certificaat zoals
      voorgeschreven in deze regeling geldt, die met hetzelfde vervoermiddel wordt vervoerd en die afkomstig is uit
      hetzelfde derde land of gedeelte van een derde land, dan wel, indien zij afkomstig is uit een lid-staat, uit
      dezelfde inrichting;



              in de handel brengen:

                bedrijfsmatig voorhanden of in voorraad hebben, slachten, be- of verwerken, ge- en verbruiken, vervoeren,
      aanvoeren, ontvangen, afleveren, te koop aanbieden, kopen of vervreemden, daaronder niet begrepen het brengen in
      Nederland en het anders dan in doorvoer buiten Nederland brengen;



              importeur:

                elke natuurlijke of rechtspersoon die een partij met het oog op het brengen in Nederland bij een
      inspectiepost ten onderzoek aanbiedt, dan wel zijn gemachtigde;



              belanghebbende bij de lading:

                belanghebbende bij de lading als bedoeld in artikel 2, tweede lid, onderdeel e, van [richtlijn 97/78/
      EG](31997L0078);



              handelaar:

                elke natuurlijke persoon of rechtspersoon, zijnde de eerste ontvanger op Nederlands grondgebied van een
      partij afkomstig uit een lid-staat, dan wel zijn gemachtigde;



              overige dierlijke producten:

                producten van dierlijke oorsprong en handelsmonsters, niet zijnde dierlijke bijproducten, waarvoor
      geen specifieke communautaire veterinairrechtelijke en gezondheidsvoorschriften gelden als bedoeld in bijlage A,
      hoofdstuk I, van [richtlijn 89/662/EEG](31989L0662), met uitzondering van:
                beenderen of producten uit beenderen, met uitzondering van beendermeel, hoornen of producten uit hoorn,
      met uizondering van hoornmeel, dan wel hoeven of producten uit hoeven, met uizondering van meel van hoeven, bestemd
      voor menselijke voeding;
      verwerkte dierlijke eiwitten, bestemd voor menselijke voeding;
      producten, bedoeld in de hoofdstukken 9 en 11 van bijlage I van [richtlijn 92/118/EEG](31992L0118) en in hoofdstuk
      I van bijlage II van genoemde richtlijn, voor zover deze producten zijn bestemd voor menselijke voeding;
      bereidingen van vlees van gekweekt wild of konijnevlees als bedoeld in artikel 2 van [richtlijn 91/495/EEG]
      (31991L0495), of van vlees van vrij wild;
      producten als bedoeld in artikel 1, eerste lid, van [verordening 745/2004/EG](32004R0745), voor zover door
      reizigers in de Europese Gemeenschap binnengebracht of aan particulieren in de Europese Gemeenschap toegezonden;




                *aquacultuurdieren:*


                aquicultuurdieren als bedoeld in artikel 2, onderdeel 1, van [richtlijn 91/67/EEG](31991L0067);




                *aquacultuurproducten:*


                aquicultuurproducten als bedoeld in artikel 2, onderdeel 2, van [richtlijn 91/67/EEG](31991L0067);




                *communautaire maatregel:*


                verordening, richtlijn of beschikking als bedoeld in artikel 249 van het Verdrag tot oprichting van de
      Europese Gemeenschap;



              dierlijke bijproducten:

                producten als bedoeld in bijlage VII en VIII van [verordening 1774/2002/EG](32002R1774) of andere, niet
      in bijlage VIII van die verordening genoemde, technische producten die van categorie 3-materiaal als bedoeld in die
      verordening zijn afgeleid;



              handelsmonster:

                monster zonder handelswaarde dat genomen is in opdracht van de eigenaar van of de verantwoordelijke
      voor een inrichting, dat representatief is voor een bepaalde productie van overige dierlijke producten van die
      inrichting of dat een model vormt van een product van dierlijke oorsprong waarvan de productie wordt overwogen, en
      dat, voor het verdere onderzoek, een opgave behelst van het type product, de samensteling daarvan en de diersoort
      waarvan het is verkregen;



              ziekteverwekkers:

                iedere verzameling of kweek van organismen, of ieder afgeleid product, alleen dan wel in gerecombineerde
      vorm, van zo'n verzameling die of kweek van organsimen dat een ziekte kan veroorzaken bij enig levend wezen,
      met uitzondering van de mens, en ieder gewijzigd afgeleid product van die organismen dat drager of overbrenger
      kan zijn van een verwekker van dierziekten, of het weefsel, de celkweek, de afscheidingsproducten dan wel de
      uitwerpselen waarlangs of door middel waarvan een verwekker van dierziekten kan worden gedragen of overgebracht,
      met uitzondering van immunologische geneesmiddelen voor diergeneeskundig gebruik, zoals toegelaten bij [richtlijn
      nr. 2001/82/EG](32001L0082) van het Europees Parlement en de Raad van de Europese Unie van 6 november 2001 tot
      vaststelling van een communautair wetboek betreffende geneesmiddelen voor diergeneeskundig gebruik (PbEG L 311);



              werkzaamheden:

                onderzoeken en keuringen;



              Dienst Regelingen:

                Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;




      2 Onder brengen in Nederland wordt mede verstaan:

      a. vervoer van producten van de plaats waar ze op Nederlands grondgebied worden gebracht naar enige plaats in
      Nederland;

      b. vervoer van producten van enige plaats in Nederland als bedoeld in onderdeel a, naar het grondgebied van en
      bestemd voor een lid-staat of een derde land, of

      c. vervoer van producten van de plaats waar ze op Nederlands grondgebied worden gebracht naar het grondgebied van
      en bestemd voor een lid-staat of een derde land,

      voor zover niet reeds vallend onder het brengen in Nederland als bedoeld in
      [artikel 10 van de Gezondheids- en welzijnswet voor dieren][ref1].

      3 Onder anders dan in doorvoer buiten Nederland brengen wordt mede verstaan het vervoer van producten, niet zijnde
      vers vlees of van of met vers vlees vervaardigde vleesproducten, van enige plaats in Nederland naar het grondgebied
      van en bestemd voor een lid-staat of een derde land, voor zover niet reeds vallend onder het anders dan in doorvoer
      buiten Nederland brengen als bedoeld in [artikel 78 van de Gezondheids- en welzijnswet voor dieren][ref2].

      4 In de artikelen en bijlagen van richtlijnen waarnaar in deze regeling wordt verwezen, wordt onder officiële
      dierenarts voor zover deze werkzaam is in Nederland verstaan de keuringsdierenarts bedoeld in het eerste lid.

      5 Voor de toepassing van [hoofdstuk 2][ref3] wordt onder ‘keuringsdierenarts’ mede verstaan degene die namens de
      keuringsdierenarts onder diens gezag en verantwoordelijkheid optreedt.


