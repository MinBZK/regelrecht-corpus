  - number: '5.7'
    text: |-
      1 Vlees van vrij wild dat is verkregen in een vrij-wildverwerkingsinrichting waaraan ontheffing is verleend als
      bedoeld in [artikel 12.6, derde lid][ref1], dan wel in een op grond van [artikel 5.13, tweede lid][ref2], erkende
      vrijwildverwerkingsinrichting, wordt voorzien van een keurmerk als bedoeld in [artikel 5.2, eerste lid][ref3],
      waarop de letters ‘EEG’ worden vervangen door: GOEDGEKEURD.

      2 Vlees van vrij wild waarop een ‘GOEDGEKEURD’-keurmerk als bedoeld in het eerste lid is aangebracht, en gehele
      stukken vrij wild die zijn verkregen in een vrij-wildverwerkingsinrichting waaraan ontheffing is verleend als
      bedoeld in [artikel 12.6, derde lid][ref4], dan wel in een op grond van [artikel 5.13, tweede lid][ref5], erkende
      vrijwildverwerkingsinrichting, worden uitsluitend bestemd voor de Nederlandse markt of voor een derde land.

      3 Vlees van vrij wild dat is verkregen in een op grond van [artikel 5.13, eerste lid][ref6], erkende inrichting
      wordt voorzien van een keurmerk als bedoeld in [artikel 5.2, eerste lid][ref7].


