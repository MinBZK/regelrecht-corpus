    text: |-
      Tenzij in de in [artikel 11.5][ref1] bedoelde voorschriften van bijlage I van [richtlijn 92/118/EEG](31992L0118)
      anders is bepaald, zijn de in [artikel 11.2][ref2] genoemde overige dierlijke producten afkomstig uit een
      inrichting als bedoeld in artikel 4, tweede lid, onderdelen a en b, van [richtlijn 92/118/EEG](31992L0118), die
      door de minister overeenkomstig [artikel 11.6][ref3] is geregistreerd, terwijl die inschrijving niet is getroffen
      door een beslissing als bedoeld in [artikel 11.6, derde lid][ref4].


