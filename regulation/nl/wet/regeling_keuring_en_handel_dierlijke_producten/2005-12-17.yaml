  - number: 2.23k
    text: |-
      1 Het vervoer van producten als bedoeld in [artikel 2.23g][ref1] over Nederlands grondgebied, geschiedt onder
      douanetoezicht.

      2 De producten gaan tijdens het vervoer naar het entrepot, bedoeld in [artikel 2.23a, tweede lid][ref2], vergezeld
      van het certificaat, bedoeld in artikel 5, eerste lid, van [richtlijn 97/78/EG](31997L0078).

      3 De producten gaan vanaf de verzending vanuit het entrepot, bedoeld in [artikel 2.23a, tweede lid][ref3], naar
      het zeevervoermiddel vergezeld van het in artikel 13, tweede lid, onder a, van [richtlijn 97/78/EG](31997L0078)
      bedoelde certificaat.

      4 Indien de producten rechtstreeks via de inspectiepost naar het zeevervoermiddel worden vervoerd, gaat de partij
      vergezeld van het in het tweede en derde lid bedoelde certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2.23g
