preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het invoerings- en overgangsrecht voor de Wet op het wetenschappelijk
    onderwijs (Stb. 1985, 562), en het tijdstip van inwerkingtreding van die wet bij wet dienen te worden vastgesteld;

    dat voorts wijziging van de Wet op het wetenschappelijk onderwijs, in het bijzonder ten aanzien van de planning en
    bekostiging met betrekking tot de universiteiten, wenselijk is gebleken;

    dat in verband met de inwerkingtreding van de Wet op het wetenschappelijk onderwijs wijzigingen in enige andere
    wetten dienen te worden aangebracht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003991/1993-08-31#ArtikelAanhef
articles:
  - number: C.2
    text: |-
      Voor zover bij deze wet niet anders is bepaald, worden op het tijdstip van inwerkingtreding van de W.W.O.
      ingetrokken:

      a. de Wet op het wetenschappelijk onderwijs (*Stb.* 1975, 729), uitgezonderd de artikelen XIII, XIV, zoals
      gewijzigd bij deze wet, en XXIII;

      b. de ingevolge het bepaalde in artikel I van de onder *a* genoemde wet gehandhaafde bepalingen van de hoger-
      onderwijswet 1876 (*Stb.* 102) en van wetten tot wijziging van de laatstgenoemde wet, voor zover die bepalingen
      niet reeds zijn vervallen, uitgezonderd de artikelen 2 en 4 van de Wet van 5 november 1948 (*Stb.* I 489), artikel
      II, leden XIII, XIV en XVI, van de Wet van 7 juni 1956 (*Stb.* 310), artikel V van de Wet van 28 juli 1958 (*Stb.*
      385) en artikel III, onder B, van de Wet van 30 oktober 1958 (*Stb.* 494);
    url: https://wetten.overheid.nl/BWBR0003991/1993-08-31#ArtikelC.2
