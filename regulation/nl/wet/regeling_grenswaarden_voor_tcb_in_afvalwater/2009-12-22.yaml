preamble:
  text: |-
    Overwegende, dat het noodzakelijk is grenswaarden vast te stellen voor het brengen van TCB in oppervlaktewateren
    ter uitvoering van de richtlijn van de Raad van de Europese Gemeenschappen van 27 juli 1990, 90/415/EEG (PbEG L
    219/49), tot wijziging van bijlage II bij Richtlijn 86/280/EEG betreffende grenswaarden en kwaliteitsdoelstellingen
    voor lozingen van bepaalde onder lijst I van de bijlage bij Richtlijn 76/464/EEG vallende gevaarlijke stoffen;
    Gelet op artikel 1a, derde lid, van de Wet verontreiniging oppervlaktewateren (Stb. 1981, 573);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005375/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. TCB: de som van de isomeren 1,2,3-trichloorbenzeen, 1,2,4-trichloorbenzeen en 1,3,5-trichloorbenzeen;

      b. verwerken van TCB: elk industrieel proces waarbij TCB of TCB bevattende stoffen worden geproduceerd, omgezet of
      gebruikt, of waarbij TCB of TCB bevattende stoffen vrijkomen;

      c. bestaand bedrijf: bedrijf dat TCB verwerkt, dat op 31 juli 1991 in werking is en waarvan de capaciteit voor het
      verwerken van TCB na 31 juli 1991 niet aanzienlijk is uitgebreid;

      d. nieuw bedrijf: bedrijf dat TCB verwerkt en geen bestaand bedrijf is;

      e. bijlage I: bij deze regeling behorende [bijlage I][ref1];

      f. bijlage II: bij deze regeling behorende [bijlage II][ref2];

      g. lozen: brengen van:

      1°. stoffen in een oppervlaktewaterlichaam;

      2°. afvalwater of andere afvalstoffen in een openbaar hemelwaterstelsel, een openbaar ontwateringstelsel, een
      openbaar vuilwaterriool of een andere voorziening voor de inzameling en het transport van afvalwater, of

      3°. stoffen op een zuiveringtechnisch werk met behulp van een werk niet zijnde een voorziening voor de inzameling
      en het transport van afvalwater.


      [ref1]: https://wetten.overheid.nl/BWBR0005375
      [ref2]: https://wetten.overheid.nl/BWBR0005375
    url: https://wetten.overheid.nl/BWBR0005375/2009-12-22#Artikel1
