        artikel: I_18
  - number: 2f
    text: |-
      In afwijking van [artikel I 18, eerste lid, van de Kieswet][ref1] maakt het centraal stembureau het proces-verbaal
      met weglating van de ondertekening onverwijld op een algemeen toegankelijke wijze elektronisch openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_18
