  - number: '19'
    text: |-
      Na afloop van de stemming verzegelt het stembureau de stembus. Op de stembus wordt de naam van de gemeente en het
      nummer van het stembureau vermeld.
    url: https://wetten.overheid.nl/BWBR0044317/2021-10-09#Artikel19
  - number: '20'
    text: |-
      1 Het stembureau begint met het opmaken van het proces-verbaal van de stemming. Alle tot dat moment ingebrachte
      bezwaren worden in het proces-verbaal vermeld. Voorts worden in het proces-verbaal vermeld de aantallen bedoeld
      in [artikel J 25, negende lid][ref1], alsook de [artikelen K 11, tweede lid][ref2], en [L 17, derde lid][ref3],
      in samenhang met artikel J 25, negende lid, van de Kieswet. [Artikel N 1, tweede lid, van de Kieswet][ref4] is van
      overeenkomstige toepassing.

      2 [Artikel N 2 van de Kieswet][ref5] is van overeenkomstige toepassing.

      3 Nadat de handelingen op grond van het tweede lid zijn uitgevoerd sluit de voorzitter tijdelijk de zitting.


