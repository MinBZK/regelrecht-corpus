        artikel: J_18
  - number: 10a
    text: |-
      1 De stembiljetten zijn voorzien van de naam van het vertegenwoordigend orgaan waarvoor de verkiezing plaatsvindt
      en een aanduiding van de kieskring.

      2 [Artikel J 20, eerste lid, tweede volzin, van de Kieswet][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_20
