  - number: 7c
    text: |-
      1 Voor de toepassing van [artikel J 7a, eerste lid, van de Kieswet][ref1] wordt in die bepaling voor «de dag voor
      de stemming» gelezen: op de vijfde dag voor de dag van de stemming na zeventien uur.

      2 Voor de toepassing van [artikel J 7a, tweede lid, onderdeel d, van de Kieswet][ref2] wordt in die bepaling voor
      «dan wel voor het uitbrengen van zijn stem is overleden» gelezen: dan wel is overleden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_7a
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_7a
