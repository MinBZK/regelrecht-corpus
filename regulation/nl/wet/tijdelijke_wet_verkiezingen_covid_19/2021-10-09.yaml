  - number: 22g
    text: |-
      1 Het proces-verbaal van het gemeentelijk stembureau voor vervroegd stemmen wordt met de processen-verbaal,
      bedoeld in [artikel 22a, derde lid][ref1], de verzegelde pakken, bedoeld in de [artikelen N 2][ref2] en
      [N 9 van de Kieswet][ref3], door ten minste twee leden van het gemeentelijk stembureau voor vervroegd stemmen naar
      de burgemeester overgebracht.

      2 De burgemeester voegt het proces-verbaal van het gemeentelijk stembureau voor vervroegd stemmen bij de processen-
      verbaal die hij ontvangt op grond van [artikel N 11, eerste lid, van de Kieswet][ref4] en vervolgt zijn handelingen
      overeenkomstig het bepaalde in artikel N 11, tweede lid, van de Kieswet.


