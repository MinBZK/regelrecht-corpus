  - number: '5'
    text: |-
      1 Indien de omstandigheden in verband met het coronavirus daartoe nopen, kunnen burgemeester en wethouders tot
      een dag voor de dag van de stemming een andere dan een eerder aangewezen locatie aanwijzen voor de zitting van een
      stembureau, alsook een stembureau aanwijzen in de zin van de [artikelen 3][ref1] en [4][ref2].

      2 De aanwijzingen worden onverwijld op een algemeen toegankelijke wijze elektronisch openbaar gemaakt. Van een
      aangewezen locatie die gelet op de in het eerste lid genoemde omstandigheden niet meer beschikbaar is, wordt bij de
      ingang van die locatie een kennisgeving aan de kiezers bevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044317#Artikel4
    url: https://wetten.overheid.nl/BWBR0044317/2021-10-09#Artikel5
