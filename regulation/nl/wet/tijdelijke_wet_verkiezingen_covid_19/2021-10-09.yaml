  - number: 23h
    text: |-
      1 In aanvulling op [artikel O 1, eerste lid, van de Kieswet][ref1] wordt onder openbaar tevens verstaan dat
      de zitting in een digitale omgeving door de leden en geïnteresseerden kan worden bijgewoond. Daarnaast dienen
      geïnteresseerden de zitting ook op afstand te kunnen volgen door middel van een live-verbinding.

      2 Een zitting, bedoeld in het eerste lid, vindt slechts doorgang voor zover:

      a. ieder lid afzonderlijk digitaal toegang heeft tot de zitting;

      b. de leden zichtbaar en hoorbaar herkenbaar zijn op een zodanige wijze dat hun identiteit kan worden vastgesteld;

      c. de andere deelnemers zichtbaar en hoorbaar kunnen zijn voor zover de voorzitter hen het woord verleent; en

      d. de voorzitter in staat is de orde te handhaven.

      3 Onverminderd [artikel O 2, vierde lid, van de Kieswet][ref2] kunnen personen die de zitting in een
      digitale omgeving bijwonen bezwaren inbrengen. De ingebrachte bezwaren zijn geen bezwaren in de zin van
      [artikel 7:1 van de Algemene wet bestuursrecht][ref3].

      4 De voorzitter van het hoofdstembureau doet tijdig op een algemeen toegankelijke wijze mededeling van de plaats,
      de dag en het uur van de zitting alsook van de wijze waarop uitvoering wordt gegeven aan het eerste en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel71
    url: https://wetten.overheid.nl/BWBR0044317/2021-10-09#Artikel23h
