  - number: 1f
    text: |-
      1 Burgemeester en wethouders stellen voor elke verkiezing een gemeentelijk stembureau voor vervroegd stemmen in.

      2 De gemeenteraad kan bepalen dat een gemeentelijk stembureau voor vervroegd stemmen dat ten behoeve van een
      verkiezing op basis van deze wet is ingesteld, tevens functioneert als gemeentelijk stembureau voor vervroegd
      stemmen voor een andere, door de gemeenteraad uitgeschreven, stemming.
    url: https://wetten.overheid.nl/BWBR0044317/2021-10-09#Artikel1f
  - number: 1g
    text: |-
      1 Het gemeentelijk stembureau voor vervroegd stemmen bestaat uit een door burgemeester en wethouders vast te
      stellen aantal leden, van wie er één voorzitter en ten minste één plaatsvervangend voorzitter is, met dien
      verstande dat het aantal leden ten minste zo veel is dat op elke locatie waar het gemeentelijk stembureau
      voor vervroegd stemmen zitting houdt ten minste vijf leden aanwezig zijn, onder wie de voorzitter of een
      plaatsvervangend voorzitter.

      2 [Artikel E 4, tweede tot en met vierde lid, van de Kieswet][ref1] is van overeenkomstige toepassing op de leden
      en plaatsvervangende leden van het gemeentelijk stembureau voor vervroegd stemmen.

      3 Als lid van een gemeentelijk stembureau voor vervroegd stemmen kan tevens niet
      worden benoemd degene die als lid van het gemeentelijk stembureau bedoeld in
      [artikel 20 van het Tijdelijke experimentenbesluit stembiljetten en centrale stemopneming][ref2] voor de
      desbetreffende verkiezing is benoemd.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over de samenstelling en werkwijze van het
      gemeentelijk stembureau voor vervroegd stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelE_4
      [ref2]: https://wetten.overheid.nl/BWBR0033989#Artikel20
