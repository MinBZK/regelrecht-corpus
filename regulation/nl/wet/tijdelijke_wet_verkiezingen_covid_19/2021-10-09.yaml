  - number: 22b
    text: |-
      1 Het gemeentelijk stembureau voor vervroegd stemmen houdt op de dag van de stemming een openbare zitting
      ten behoeve van de stemopneming van de stemmen die zijn uitgebracht bij de stembureaus als bedoeld in de
      [artikelen 2g][ref1], [3a][ref2] en [4a][ref3].

      2 Burgemeester en wethouders wijzen voor de zitting van het gemeentelijk stembureau voor vervroegd stemmen een of
      meer geschikte locaties aan waar de stemopneming plaatsvindt. Voorts stellen burgemeester en wethouders voor iedere
      locatie het tijdstip vast waarop de zitting aanvangt.

      3 Indien voor de stemopneming meer dan één locatie wordt aangewezen, stellen burgemeester en wethouders tevens vast
      op welke locatie de stemopneming van elk stembureau plaatsvindt.

      4 De burgemeester brengt de aanwijzing van een of meer locaties, het tijdstip waarop de stemopneming aanvangt en,
      indien van toepassing, de locatie waar de stemopneming van elk stembureau plaatsvindt ten minste veertien dagen
      voor de dag van de stemming ter openbare kennis.

      5 [Artikel 5][ref4] is van overeenkomstige toepassing op een gemeentelijk stembureau voor vervroegd stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel2g
      [ref2]: https://wetten.overheid.nl/BWBR0044317#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0044317#Artikel4a
      [ref4]: https://wetten.overheid.nl/BWBR0044317#Artikel5
