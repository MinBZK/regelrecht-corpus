  - number: '22'
    text: |-
      1 De burgemeester draagt er zorg voor dat de bescheiden, bedoeld in
      [artikel 21, tweede respectievelijk vierde lid][ref1], tijdig worden vervoerd naar de plaats waar de stemopneming
      zal plaatsvinden en dat de daarop aangebrachte zegels niet worden verbroken totdat het stembureau zijn zitting
      heeft hervat.

      2 Het stembureau hervat zijn zitting op de dag van de stemming onverwijld na eenentwintig uur.

      3 Op de locatie van de stemopneming opent het stembureau de verzegelde enveloppe met het proces-verbaal en de
      verzegelde stembus. Vervolgens zet het stembureau zijn werkzaamheden voort overeenkomstig het bepaalde in de
      [artikelen N 5 tot en met N 10 van de Kieswet][ref2].

      4 Indien het stembureau een verschil vaststelt tussen het aantal kiezers dat tot de stemming is toegelaten en het
      aantal stemmen dat is geteld, is het stembureau bevoegd de pakken, bedoeld in [artikel N 2 van de Kieswet][ref3],
      te openen en de in [artikel N 1 van de Kieswet][ref4] bedoelde aantallen opnieuw vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_10
