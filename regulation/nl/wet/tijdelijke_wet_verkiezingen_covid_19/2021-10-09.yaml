    text: |-
      1 Op voordracht van de Kiesraad wordt ten behoeve van zittingen waarin hij als centraal
      stembureau optreedt, bij koninklijk besluit een voldoend aantal plaatsvervangende leden benoemd.
      [Artikel A 5, derde lid, eerste zin, van de Kieswet][ref1] alsmede de [artikelen 9][ref2], [13][ref3], en
      [14 van de Kaderwet zelfstandige bestuursorganen][ref4] zijn van overeenkomstige toepassing.

      2 Bij ontstentenis van een lid om een zitting bij te wonen waarin de Kiesraad optreedt als centraal stembureau,
      treedt een door de voorzitter van de Kiesraad aan te wijzen plaatsvervangend lid op.

      3 Het plaatsvervangend lidmaatschap van de Kiesraad vervalt van rechtswege op het moment dat deze wet vervalt.


