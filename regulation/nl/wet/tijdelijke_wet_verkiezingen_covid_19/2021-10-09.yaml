  - number: 22f
    text: |-
      1 Nadat de werkzaamheden in [artikel 22e][ref1] zijn beëindigd, maakt het gemeentelijk stembureau voor vervroegd
      stemmen onmiddellijk proces-verbaal op van de stemopneming. Alle ingebrachte bezwaren worden in het proces-verbaal
      vermeld.

      2 Het proces-verbaal wordt door alle aanwezige leden van het gemeentelijk stembureau voor vervroegd stemmen
      getekend.

      3 Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld. In het proces-verbaal is de
      verkiezingsuitslag voor ieder stembureau herleidbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel22e
    url: https://wetten.overheid.nl/BWBR0044317/2021-10-09#Artikel22f
