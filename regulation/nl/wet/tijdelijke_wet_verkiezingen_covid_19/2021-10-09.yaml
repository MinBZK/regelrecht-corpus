  - number: 7e
    text: |-
      In afwijking van [artikel J 8, derde lid, eerste en tweede volzin, van de Kieswet][ref1] dient het verzoek
      uiterlijk op de vijfde dag voor de dag van de stemming om zeventien uur te zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_8
