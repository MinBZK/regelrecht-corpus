  - number: 22c
    text: |-
      1 Indien de stemopneming op meer dan één locatie plaatsvindt, besluiten en handelen de aanwezige leden van het
      gemeentelijk stembureau voor vervroegd stemmen namens het gemeentelijk stembureau voor vervroegd stemmen.

      2 Indien bij het nemen van een beslissing door de aanwezige leden de stemmen staken, beslist de stem van de
      voorzitter of, indien de voorzitter niet aanwezig is, de plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0044317/2021-10-09#Artikel22c
  - number: 22d
    text: |-
      1 De [artikelen J 35 tot en met J 39 van de Kieswet][ref1] zijn van overeenkomstige toepassing op de locatie waar
      het gemeentelijk stembureau voor vervroegd stemmen zitting houdt.

      2 Het bepaalde bij of krachtens [artikel 9][ref2] is van overeenkomstige toepassing op de locatie waar het
      gemeentelijk stembureau voor vervroegd stemmen de stemopneming verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_35
      [ref2]: https://wetten.overheid.nl/BWBR0044317#Artikel9
