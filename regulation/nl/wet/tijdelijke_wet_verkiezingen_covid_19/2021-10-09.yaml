        artikel: M_10
  - number: 23b
    text: |-
      In afwijking van [artikel N 15 van de Kieswet][ref1] stelt het briefstembureau het aantal geldige briefstembewijzen
      vast behorend bij de enveloppen met een stembiljet, dan wel stembiljetten, die het in de stembus heeft gedeponeerd.
      Dit is het aantal kiezers dat tot de stemming is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_15
