  - number: 17c
    text: |-
      Burgemeester en wethouders van 's-Gravenhage kunnen onverminderd het bepaalde
      in [artikel M 9, eerste lid, van de Kieswet][ref1] en in afwijking van
      [artikel J 4, eerste en tweede lid, van de Kieswet][ref2] een briefstembureau aanwijzen dat zitting houdt in een
      andere gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_9
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_4
    url: https://wetten.overheid.nl/BWBR0044317/2021-10-09#Artikel17c
