  - number: '16'
    text: |-
      1 In aanvulling op [artikel L 2, eerste lid, van de Kieswet][ref1] kan een aanvraag ook langs elektronische
      weg worden ingediend. De langs elektronische weg ingediende aanvraag wordt voor het bepaalde in
      [hoofdstuk L van de Kieswet][ref2] met de schriftelijke aanvraag gelijkgesteld.

      2 In afwijking van [artikel L 7, eerste lid, van de Kieswet][ref3] dient de aanvraag uiterlijk op de vijfde dag
      voor de dag van de stemming om zeventien uur te zijn ontvangen.

      3 In afwijking van [artikel L 8, eerste lid, tweede volzin, van de Kieswet][ref4] gebruikt de kiezer voor het
      verzoekschrift dat langs elektronische weg wordt ingediend het model dat bij ministeriële regeling is vastgesteld.

      4 In afwijking van [artikel L 8, derde lid, van de Kieswet][ref5] gebruikt de gemachtigde voor de verklaring die
      langs elektronische weg wordt verzonden het model dat bij ministeriële regeling is vastgesteld. De gemachtigde
      zendt de verklaring aan de kiezer, die deze verklaring gelijktijdig met zijn verzoekschrift indient.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het langs elektronische weg
      indienen van een aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#HoofdstukL
