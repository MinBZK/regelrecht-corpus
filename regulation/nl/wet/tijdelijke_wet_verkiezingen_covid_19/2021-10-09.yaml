  - number: 22e
    text: |-
      1 Het gemeentelijk stembureau voor vervroegd stemmen verricht voor elk stembureau separaat de handelingen met
      betrekking tot de stemopneming.

      2 De burgemeester draagt er zorg voor dat de bescheiden, bedoeld in [artikel 22a, zesde lid][ref1], in samenhang
      met [artikel 21, tweede respectievelijk vierde lid][ref2], tijdig worden vervoerd naar de plaats waar de
      stemopneming zal plaatsvinden en dat de daarop aangebrachte zegels niet worden verbroken totdat het gemeentelijk
      stembureau voor vervroegd stemmen zijn zitting aanvangt.

      3 In afwijking van het tweede lid kan de burgemeester de niet gebruikte stembiljetten als bedoeld in
      [artikel N 2, eerste lid, onderdeel d, van de Kieswet][ref3] gebruiken om uitvoering te geven aan het bepaalde in
      [artikel J 21 van de Kieswet][ref4].

      4 Op de locatie van de stemopneming opent het gemeentelijk stembureau voor vervroegd stemmen
      de verzegelde enveloppe met het proces-verbaal en de verzegelde stembus. Vervolgens voert het
      gemeentelijk stembureau voor vervoegd stemmen de werkzaamheden uit overeenkomstig het bepaalde in de
      [artikelen N 5 tot en met N 9 van de Kieswet][ref5], met dien verstande dat in plaats van «de voorzitter» wordt
      gelezen: «het gemeentelijk stembureau voor vervroegd stemmen».

      5 Indien het gemeentelijk stembureau voor vervroegd stemmen een verschil vaststelt tussen het aantal kiezers dat
      tot de stemming is toegelaten en het aantal stemmen dat is geteld, opent het gemeentelijk stembureau voor vervroegd
      stemmen de pakken, bedoeld in [artikel N 2 van de Kieswet][ref6], en stelt de in [artikel N 1 van de Kieswet][ref7]
      bedoelde aantallen opnieuw vast. In afwijking van artikel N 1, eerste lid, tweede zin, van de Kieswet, is de som
      van deze aantallen het aantal kiezers dat tot de stemming is toegelaten.

      6 Het gemeentelijk stembureau geeft niet eerder toepassing aan het bepaalde in
      [artikel N 9, eerste lid, eerste volzin, van de Kieswet][ref8] dan na eenentwintig uur. Tot die tijd is eenieder
      die ambtshalve kennis kan nemen van de vastgestelde aantallen stemmen, verplicht tot geheimhouding daarvan. Bij
      de mededeling van het bepaalde in artikel N 9, eerste lid, eerste volzin, van de Kieswet zijn de voorzitter en ten
      minste drie andere leden van het gemeentelijk stembureau aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0044317#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_21
