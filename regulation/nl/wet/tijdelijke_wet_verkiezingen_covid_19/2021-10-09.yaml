  - number: 23i
    text: |-
      1 In aanvulling op [artikel O 3, tweede lid, van de Kieswet][ref1] wordt het proces-verbaal achtereenvolgens door
      de voorzitter en alle andere fysiek aanwezige leden van het hoofdstembureau ondertekend.

      2 Een lid van het hoofdstembureau dat de openbare zitting op afstand in een digitale omgeving bijwoont, maakt
      daarin door middel van een openbare wilsuitdrukking kenbaar of de voorzitter het proces-verbaal namens hem mag
      ondertekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_3
    url: https://wetten.overheid.nl/BWBR0044317/2021-10-09#Artikel23i
    references:
