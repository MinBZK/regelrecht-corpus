  - number: 23g
    text: |-
      1 Het bepaalde bij of krachtens
      [artikel 9, eerste lid, derde en vierde volzin, tweede tot en met vierde, zevende, negende en elfde lid][ref1],
      voor stemlokalen is van overeenkomstige toepassing op de locatie waar het hoofdstembureau de in
      [artikel O 1 van de Kieswet][ref2] bedoelde zitting houdt en op daarbij aanwezige personen.

      2 Toepassing van [artikel 9, derde lid][ref3], geschiedt met dien verstande dat burgemeester en wethouders van de
      gemeente waarin het hoofdstembureau is gevestigd de gezondheidscheck afnemen bij de leden van het hoofdstembureau.

      3 Het centraal stembureau draagt er zorg voor dat in de ruimte waar de openbare zitting plaatsvindt
      alsook bij de ingang daarvan de aanwijzingen worden gegeven die nodig zijn om de naleving van
      [artikel 58f, eerste lid, van de Wet publieke gezondheid][ref4] of het bepaalde bij of krachtens [artikel 9][ref5]
      door de bij de openbare zitting aanwezige personen te verzekeren.


