  - number: '13'
    text: |-
      1 Indien burgemeester en wethouders een of meer stembureaus hebben aangewezen als bedoeld in [artikel 3][ref1] of
      [4][ref2], benoemen zij tijdig voor elke verkiezing een of meer personen die als waarnemer getuige zijn van het
      verloop van de zitting bij deze stembureaus. Een waarnemer krijgt geen instructies betreffende de wijze waarop
      hij inhoud dient te geven aan zijn functie. [Artikel E 4, tweede en derde lid, van de Kieswet][ref3] is van
      overeenkomstige toepassing.

      2 Onverminderd [artikel E 4, tweede lid, van de Kieswet][ref4] kan niet als waarnemer worden benoemd, degene:

      a. die kandidaat is voor de verkiezing in de betreffende kieskring;

      b. die tot lid of plaatsvervangend lid van een stembureau is benoemd voor de desbetreffende verkiezing;

      c. die lid is van het vertegenwoordigend orgaan waarvoor de verkiezing wordt gehouden.

      3 Een waarnemer is bevoegd in het stemlokaal te vertoeven gedurende de tijd dat het stembureau in een stemlokaal
      zitting houdt.

      4 Onverminderd [artikel J 35, tweede lid, van de Kieswet][ref5] kan een waarnemer mondeling bezwaar indienen bij
      het stembureau. [Artikel J 35, derde lid, van de Kieswet][ref6] is van overeenkomstige toepassing.

      5 Een waarnemer brengt uiterlijk op de dag na de dag van de stemming om twaalf uur verslag uit aan de burgemeester
      van zijn bevindingen betreffende het verloop van de stemming. Bij ministeriële regeling wordt voor het verslag een
      model vastgesteld.

      6 [Artikel N 12, tweede lid, van de Kieswet][ref7] is van overeenkomstige toepassing. De burgemeester
      zendt het verslag tezamen met de in artikel N 12, eerste lid, van de Kieswet bedoelde documenten
      onverwijld naar het hoofdstembureau. Het hoofdstembureau zendt het verslag tezamen met de in
      [artikel O 5, eerste lid, van de Kieswet][ref8] bedoelde documenten onverwijld naar het vertegenwoordigend orgaan.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent waarneming bij een stembureau als bedoeld
      in de [artikelen 3][ref9] en [4][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044317#Artikel4
