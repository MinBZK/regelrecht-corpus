  - number: '10'
    text: |-
      1 In afwijking van [artikel J 18, eerste lid, van de Kieswet][ref1] staat de stembus in het stemlokaal en is
      zichtbaar voor het stembureaulid dat erop toeziet dat de kiezer het stembiljet in de stembus steekt.

      2 In aanvulling op [artikel J 18, eerste lid, van de Kieswet][ref2] kunnen bij ministeriële regeling nadere
      voorschriften worden gesteld over de vervaardiging van de stembus.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_18
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_18
