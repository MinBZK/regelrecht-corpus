  - number: 2e
    text: |-
      1 In aanvulling op [artikel I 18, eerste lid, van de Kieswet][ref1] wordt het proces-verbaal achtereenvolgens door
      de voorzitter en alle fysiek aanwezige leden van het centraal stembureau ondertekend.

      2 Een lid van het centraal stembureau dat de openbare zitting in een digitale omgeving op afstand bijwoont, maakt
      daarin door middel van een openbare wilsuitdrukking kenbaar of de voorzitter het proces-verbaal namens hem mag
      ondertekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_18
    url: https://wetten.overheid.nl/BWBR0044317/2021-10-09#Artikel2e
