  - number: 23a
    text: |-
      [Hoofdstuk N, paragraaf 2, van de Kieswet][ref1] is uitsluitend van toepassing op een briefstembureau voor zover
      het de stemopneming betreft van stembiljetten die op grond van [artikel M 10, derde lid, van de Kieswet][ref2] in
      de stembus zijn gedeponeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_10
