    text: |-
      1 [Paragraaf 3.2 van het Tijdelijk experimentenbesluit stembiljetten en centrale stemopneming][ref1] is niet van
      toepassing op een stembureau als bedoeld in [artikel 2g][ref2], [3a][ref3] of [4a][ref4].

      2 In afwijking van [artikel 22e, vierde lid, tweede volzin, en vijfde lid][ref5] voert het gemeentelijk
      stembureau voor vervroegd stemmen de werkzaamheden uit bedoeld in de [artikelen 22][ref6] en
      [23 van het Tijdelijk experimentenbesluit stembiljetten en centrale stemopneming][ref7].

      3 In afwijking van [artikel 22g, eerste lid][ref8], worden het proces-verbaal van het gemeentelijk stembureau
      voor vervroegd stemmen, de processen-verbaal van de stembureaus alsook de verzegelde pakken, bedoeld in de
      [artikelen N 2][ref9] en [N 9 van de Kieswet][ref10] overgebracht naar het gemeentelijk stembureau bedoeld in
      [artikel 20 van het Tijdelijk experimentenbesluit stembiljetten en centrale stemopneming][ref11].


