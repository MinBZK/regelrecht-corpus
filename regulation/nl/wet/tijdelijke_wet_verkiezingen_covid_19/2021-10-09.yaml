  - number: 23k
    text: |-
      Voor de toepassing van [artikel P 1 van de Kieswet][ref1] wordt voor «alle hoofdstembureaus zijn ontvangen»
      gelezen: de hoofdstembureaus zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelP_1
    url: https://wetten.overheid.nl/BWBR0044317/2021-10-09#Artikel23k
