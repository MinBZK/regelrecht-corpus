  - number: '18'
    text: |-
      1 De [artikelen 19 tot en met 22][ref1] zijn van toepassing op:

      a. een stembureau dat zitting houdt in een stemlokaal als bedoeld in [artikel 6][ref2];

      b. een bijzonder stembureau als bedoeld in [artikel J 1, derde lid, van de Kieswet][ref3], niet zijnde een
      stembureau als bedoeld in [artikel 3a][ref4]; en

      c. een mobiel stembureau als bedoeld in [artikel J 4a van de Kieswet][ref5], niet zijnde een stembureau als
      bedoeld in [artikel 4a][ref6].

      2 De [artikelen 20, derde lid][ref7], [21][ref8] en [22, eerste tot en met derde lid, eerste volzin][ref9], voor
      zover het betreft het openen van de verzegelde enveloppe, zijn niet van toepassing op een stembureau als bedoeld
      in het eerste lid, onderdelen b en c, indien de stemming niet eindigt voor eenentwintig uur en het stembureau de
      stemopneming uitvoert op de locatie waar de stemming is afgerond.


