    text: |-
      In afwijking van [artikel K 3, tweede lid, eerste en tweede volzin, van de Kieswet][ref1] dient het verzoek
      uiterlijk op de vijfde dag voor de dag van de stemming om zeventien uur te zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelK_3
