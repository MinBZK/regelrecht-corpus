  - number: '30'
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.

      2 Deze wet vervalt met ingang van 1 juli 2021. Het tijdstip waarop deze wet vervalt kan bij koninklijk besluit
      worden bepaald op een ander tijdstip, met dien verstande dat dit tijdstip steeds ten hoogste zes maanden na het
      tijdstip ligt waarop de wet zou vervallen.

      3 Bij koninklijk besluit kan worden bepaald dat deze wet, bepalingen daarvan of onderdelen daarvan vervalt dan wel
      vervallen op een eerder tijdstip dan 1 juli 2021 dan wel een tijdstip dat ligt voor het tijdstip waarop de wet na
      1 juli 2021 zou vervallen.

      4 De voordracht voor een krachtens het tweede lid vast te stellen koninklijk besluit wordt niet eerder gedaan dan
      vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0044317/2021-10-09#Artikel30
  - number: '31'
    text: 'Deze wet wordt aangehaald als: Tijdelijke wet verkiezingen covid-19.'
