  - number: 13b
    text: |-
      1 In aanvulling op de bescheiden genoemd in [artikel K 2, aanhef en onder b, van het Kiesbesluit][ref1] mag ook
      een kopie van de navolgende identiteitsdocumenten bij een aanvraag als bedoeld in [artikel K7 van de Kieswet][ref2]
      worden gevoegd:

      a. noodpaspoort; of

      b. laissez-passer voor zover daaruit het bezit van de Nederlandse nationaliteit blijkt.

      2 Voorts kunnen ook de bescheiden genoemd in [artikel M 5 van het Kiesbesluit][ref3] die op de dag van
      de stemming, bedoeld in [artikel J 1, eerste lid][ref4], of [Y 8, eerste lid, van de Kieswet][ref5],
      maximaal een jaar hun geldigheid hebben verloren worden gebruikt, mits daarbij tevens een kopie van de in
      [artikel 61 van het Besluit verkrijging en verlies Nederlanderschap][ref6] bedoelde verklaring is gevoegd en deze
      niet meer dan een jaar voor de dag van de stemming is verstrekt.


