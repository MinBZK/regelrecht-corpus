  - number: 23f
    text: |-
      1 In afwijking van [artikel O 1, eerste lid, van de Kieswet][ref1] houdt het hoofdstembureau op de vijfde dag na de
      dag van de stemming om tien uur een openbare zitting.

      2 In afwijking van het eerste lid houdt het hoofdstembureau gevestigd in kieskring 12 op de zesde dag na de dag van
      de stemming om vijftien uur een openbare zitting.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelO_1
    url: https://wetten.overheid.nl/BWBR0044317/2021-10-09#Artikel23f
