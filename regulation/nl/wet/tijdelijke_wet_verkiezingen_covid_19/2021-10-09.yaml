      a. noodpaspoort; of

      b. laissez-passer voor zover daaruit het bezit van de Nederlandse nationaliteit blijkt.

      2 Voorts kunnen ook de bescheiden genoemd in [artikel M 5 van het Kiesbesluit][ref2] die op de dag van
