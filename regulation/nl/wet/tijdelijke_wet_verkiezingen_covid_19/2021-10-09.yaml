  - number: '7'
    text: |-
      In afwijking van de [artikelen J 5, eerste lid][ref1], en [K 1, eerste lid, van de Kieswet][ref2] kan de kiezer
      niet deelnemen aan de stemming in een stembureau als bedoeld in de [artikelen 3][ref3] en [4][ref4], tenzij hij
      toegang heeft tot de locatie waar het stembureau zitting houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_5
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelK_1
