preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje- Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op het voorkomen van besmettingen en verspreiding van
    het nieuwe coronavirus (SARS-CoV-2) wenselijk is in aanvulling op en in afwijking van de Kieswet tijdelijke regels
    vast te stellen op het terrein van verkiezingen om de volksgezondheid bij de organisatie en de uitvoering van
    verkiezingen te beschermen en een goed verloop van het verkiezingsproces te waarborgen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0044317/2021-10-09#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *coronavirus:* het coronavirus SARS-CoV-2 dat de ziekte covid-19 kan veroorzaken;

      b. *gezondheidscheck:* beantwoording van de in de ministeriële regeling opgenomen vragen door een kiezer, een
      stembureaulid, een waarnemer als bedoeld in [artikel 13][ref1] of een ander persoon die het stembureau ten dienste
      wordt gesteld of bijstaat op de locatie waar en gedurende de periode dat het stembureau zitting houdt, om na te
      gaan:

      i. of de genoemde personen of hun huisgenoot of huisgenoten gezondheidsklachten hebben die verband houden met het
      coronavirus;

      ii. of bij de genoemde personen of bij hun huisgenoot of huisgenoten voorafgaand aan de dag van de stemming covid-
      19 is vastgesteld; en

      iii. of de genoemde personen in quarantaine zijn.

      c. *hygiënemaatregelen:* maatregelen betreffende de inrichting van een stemlokaal of aldaar te gebruiken voorwerpen
      of materialen, of het treffen van voorzieningen ten behoeve van de reinheid teneinde besmetting met of overdracht
      van het coronavirus zoveel mogelijk te voorkomen;

      d. *persoonlijke beschermingsmiddelen:* uitrusting die bestemd is om te worden gedragen of vastgehouden teneinde de
      eigen of een andere persoon zoveel mogelijk te beschermen tegen overdracht van het coronavirus.

      e. *gebouw:* een gebouw als bedoeld in [artikel 1 van de Woningwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel1
