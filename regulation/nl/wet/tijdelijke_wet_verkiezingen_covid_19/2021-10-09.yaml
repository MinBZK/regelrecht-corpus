        artikel: J_8
  - number: '8'
    text: |-
      1 Gedurende de zitting zijn steeds ten minste de voorzitter en drie andere leden van het stembureau aanwezig.

      2 [Artikel J 12, tweede en derde lid, van de Kieswet][ref1] is niet van toepassing. Bij ontstentenis van de
      voorzitter bepaalt het stembureau wie als voorzitter optreedt.

      3 Burgemeester en wethouders wijzen aan welke leden van het stembureau, en desgewenst gedurende welk
      tijdvak, de taken uitoefenen als bedoeld in de [artikelen J 24, eerste lid, onder a][ref2], [J 25][ref3],
      [J 26, derde lid][ref4], [J 27][ref5], [J 29][ref6], [K 11, eerste lid][ref7], [L 15, tweede lid][ref8],
      [L 17, eerste lid, van de Kieswet][ref9], alsmede de taken op grond van [artikel 9][ref10], met dien verstande
      dat:

      a. de taken, bedoeld in [artikel J 25 van de Kieswet][ref11] door twee stembureauleden worden uitgeoefend;

      b. de taken, bedoeld in [artikel J 26, derde lid, van de Kieswet][ref12] en [artikel 9, vijfde lid][ref13], door
      één stembureaulid worden uitgeoefend;

      4 In afwijking van [artikel J 17, eerste lid, van de Kieswet][ref14] draagt de burgemeester er zorg voor dat het
      stembureau het uittreksel van ongeldige stempassen in tweevoud ontvangt. Beide uittreksels liggen op de tafel van
      het stembureau.


