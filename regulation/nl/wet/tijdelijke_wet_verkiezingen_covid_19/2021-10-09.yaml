  - number: 2g
    text: |-
      1 Burgemeester en wethouders wijzen stembureaus aan die, in afwijking van
      [artikel J 1, eerste lid, van de Kieswet][ref1], al op de eerste of de tweede dag voorafgaand aan de dag van de
      stemming zitting houden. Op deze dagen vangt de stemming aan om zeven uur dertig en duurt tot eenentwintig uur.

      2 Het aantal aan te wijzen stembureaus, bedoeld in het eerste lid, bedraagt op beide dagen ten minste:

      a. in een gemeente met minder dan 10.000 kiesgerechtigden: 1;

      b. in een gemeente met 10.000 tot 30.000 kiesgerechtigden: 2;

      c. in een gemeente met 30.000 tot 60.000 kiesgerechtigden: 4;

      d. in een gemeente met 60.000 tot 100.000 kiesgerechtigden: 8;

      e. in een gemeente met 100.000 tot 350.000 kiesgerechtigden: 10;

      f. in een gemeente met 350.000 of meer kiesgerechtigden: 20.

      3 Bij het aanwijzen van stemlokalen voor de stembureaus, bedoeld in het eerste lid, dragen burgemeester en
      wethouders er zorg voor dat deze op ten minste zoveel verschillende adressen gelegen zijn als het aantal, genoemd
      in het tweede lid.

      4 De bij een stembureau als bedoeld in het eerste lid uitgebrachte stemmen worden opgenomen door het gemeentelijk
      stembureau voor vervroegd stemmen.

      5 De burgemeester brengt de aanwijzingen, de dagen en de zittingstijden waarop de stemming plaatsvindt ten minste
      veertien dagen voor de dag van de stemming ter openbare kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_1
    url: https://wetten.overheid.nl/BWBR0044317/2021-10-09#Artikel2g
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_1
  - number: '3'
    text: |-
      1 Burgemeester en wethouders kunnen, indien de omstandigheden rond het coronavirus daartoe nopen, in hun gemeente
      bijzondere stembureaus aanwijzen als bedoeld in [artikel J 1, derde lid, van de Kieswet][ref1] en daarvan gedurende
      de stemming de toegang beperken tot kiezers die wonen of verblijven op de locaties waar deze stembureaus zitting
      houden. De stemopneming geschiedt in het openbaar.

      2 [Artikel J 1, derde en vierde lid, van de Kieswet][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_1
    url: https://wetten.overheid.nl/BWBR0044317/2021-10-09#Artikel3
