    text: |-
      1 Burgemeester en wethouders kunnen, indien de omstandigheden rond het coronavirus daartoe nopen, in hun gemeente
      mobiele stembureaus aanwijzen als bedoeld in [artikel J 4a van de Kieswet][ref1] dan wel [artikel 4][ref2] die, in
      afwijking van [artikel J 1, eerste lid, van de Kieswet][ref3], al op de eerste of de tweede dag voorafgaand aan de
      dag van de stemming zitting houden.

      2 Voor de toepassing van [artikel J 1, derde lid, van de Kieswet][ref4] wordt in die bepaling voor «voor de
      stemming» gelezen: voor de dag van de stemming.

      3 De bij een stembureau als bedoeld in het eerste lid uitgebrachte stemmen worden opgenomen door het gemeentelijk
      stembureau voor vervroegd stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_4a
      [ref2]: https://wetten.overheid.nl/BWBR0044317#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_1
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_1
    url: https://wetten.overheid.nl/BWBR0044317/2021-10-09#Artikel4a
