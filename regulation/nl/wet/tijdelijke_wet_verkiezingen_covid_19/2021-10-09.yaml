    text: |-
      Voor de [artikelen 19 tot en met 22g][ref1] kunnen bij ministeriële regeling nadere regels worden gesteld over het
      in ontvangst nemen, het transport, de opslag en de overdracht van de stembus, de niet gebruikte stembiljetten, de
      enveloppe en de pakken, bedoeld in [artikel N 2 van de Kieswet][ref2].


