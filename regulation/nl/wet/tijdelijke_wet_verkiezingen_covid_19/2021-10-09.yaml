      1 In aanvulling op de identiteitsdocumenten die op grond van [artikel M 7, vierde lid, van de Kieswet][ref1] bij
      algemene maatregel van bestuur zijn aangewezen, mag ook een kopie van de navolgende identiteitsdocumenten worden
