  - number: 22a
    text: |-
      1 Deze bepaling is van toepassing op een stembureau als bedoeld in [artikel 2g][ref1], [3a][ref2] of [4a][ref3].

      2 [Artikel 19][ref4] is van overeenkomstige toepassing.

      3 Nadat de werkzaamheden op grond van het tweede lid zijn beëindigd, maakt het stembureau proces-
      verbaal op van de stemming. In het proces-verbaal worden alle ingebrachte bezwaren vermeld. Voorts
      worden in het proces-verbaal vermeld de aantallen bedoeld in de [artikelen J 25, negende lid][ref5],
      [K 11, tweede lid][ref6], en [L 17, derde lid][ref7], in samenhang met artikel J 25, negende lid, van de Kieswet.
      [Artikel N 1, tweede lid, van die wet][ref8] is van overeenkomstige toepassing.

      4 Het proces-verbaal wordt door alle aanwezige leden van het stembureau getekend. Bij ministeriële regeling wordt
      hiervoor een model vastgesteld.

      5 [Artikel N 2 van de Kieswet][ref9] is van overeenkomstige toepassing, met uitzondering van de niet gebruikte
      stembiljetten. Vervolgens sluit de voorzitter de zitting.

      6 [Artikel 21, eerste, tweede en vierde lid][ref10], is van overeenkomstige toepassing. Het stembureau draagt de
      ongebruikte stembiljetten over aan de burgemeester.


