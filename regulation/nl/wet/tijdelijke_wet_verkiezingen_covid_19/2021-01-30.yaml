  - number: 11e
    text: |-
      Indien een persoon de retourenveloppe, bedoeld in [artikel 11c, vijfde lid][ref1], gedurende de stemming afgeeft
      aan een lid van het stembureau dat belast is met de in [artikel J 25 van de Kieswet][ref2] bedoelde taken, houdt
      dit lid daarvan aantekening bij door op de enveloppe de datum en een handtekening te plaatsen. Daarna wordt de
      enveloppe door het stembureau bewaard tot het einde van de stemming.


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel11c
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_25
