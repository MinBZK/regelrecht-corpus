        artikel: N_2
  - number: '21'
    text: |-
      1 Het stembureau bewaart de sleutel van de verzegelde stembus alsook het proces-verbaal in een enveloppe, die het
      eveneens verzegelt. Op deze enveloppe wordt de naam van de gemeente en het nummer van het stembureau vermeld.

      2 Het stembureau draagt de stembus zo spoedig mogelijk over aan de burgemeester ten behoeve van het vervoer naar
      een locatie voor het vervolg van de stemopneming. Tot aan die overdracht draagt het stembureau er zorg voor dat de
      zegels op de stembus niet worden verbroken.

      3 Na de overdracht van de stembus aan de burgemeester begeven de leden van het stembureau zich onder medebrenging
      van de verzegelde enveloppe en de pakken, bedoeld in [artikel N 2 van de Kieswet][ref1], onverwijld naar de locatie
      waar het vervolg van de stemopneming wordt verricht.

      4 In afwijking van het derde lid geeft een stembureau als bedoeld in [artikel 18, aanhef, onderdeel b of c][ref2],
      waarbij de stemming voor het in [artikel J 1, tweede lid, van de Kieswet][ref3] genoemde tijdstip is geëindigd,
      dan wel een stembureau als bedoeld in artikel 18, aanhef, onderdeel d, de verzegelde enveloppe en de pakken,
      bedoeld in [artikel N 2 van de Kieswet][ref4], zo spoedig mogelijk bij de burgemeester in bewaring. Tot aan
      die inbewaringgeving draagt het stembureau er zorg voor dat de zegels op de stembus en de enveloppe niet worden
      verbroken.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
      [ref2]: https://wetten.overheid.nl/BWBR0044317#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_1
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
    url: https://wetten.overheid.nl/BWBR0044317/2021-01-30#Artikel21
