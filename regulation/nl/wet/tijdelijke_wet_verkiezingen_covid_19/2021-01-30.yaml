  - number: 2d
    text: |-
      1 In aanvulling op [artikel I 4 van de Kieswet][ref1] wordt onder openbaar tevens verstaan dat de zitting in een
      digitale omgeving door de leden en geïnteresseerden kan worden bijgewoond. Daarnaast dienen geïnteresseerden de
      zitting op afstand te kunnen volgen door middel van een live-verbinding.

      2 Een zitting bedoeld in het eerste lid vindt slechts doorgang voor zover:

      a. ieder lid afzonderlijk digitaal toegang heeft tot de zitting;

      b. de leden zichtbaar en hoorbaar herkenbaar zijn op een zodanige wijze dat hun identiteit kan worden vastgesteld;

      c. de andere deelnemers zichtbaar en hoorbaar kunnen zijn voor zover de voorzitter hen het woord verleent; en

      d. de voorzitter in staat is de orde te handhaven.

      3 Onverminderd [artikel I 18, tweede lid, van de Kieswet][ref2] kunnen personen die de zitting in een
      digitale omgeving bijwonen bezwaren inbrengen. De ingebrachte bezwaren zijn geen bezwaren in de zin van
      [artikel 7:1 van de Algemene wet bestuursrecht][ref3].

      4 Bij de bekendmaking, bedoeld in [artikel I 18, derde lid, onder b, van de Kieswet][ref4] wordt tevens mededeling
      gedaan van de wijze waarop uitvoering wordt gegeven aan het eerste en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_4
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_18
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel71
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_18
