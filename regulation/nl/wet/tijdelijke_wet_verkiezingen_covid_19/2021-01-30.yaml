        artikel: J_7
  - number: 7b
    text: |-
      1 In afwijking van [artikel J 7, eerste volzin, van de Kieswet][ref1] ontvangt elke kiezer die bevoegd is om aan
      de stemming deel te nemen en die op de dag van de stemming de leeftijd van zeventig jaar heeft bereikt van de
      burgemeester van de gemeente waar hij op de dag van de kandidaatstelling als kiezer is geregistreerd:

      a. een briefstembiljet;

      b. een geadresseerde retourenveloppe;

      c. een stempluspas;

      d. een enveloppe voor het stembiljet; en

      e. een handleiding voor de kiezer.

      2 De kiesgerechtigde ontvangt de stukken, bedoeld in het eerste lid, onderdeel a, b, d en e, zo spoedig mogelijk.

      3 Tenzij deze wet anders bepaalt wordt voor de toepassing van de bepalingen bij of krachtens de [Kieswet][ref2]
      onder stempas mede verstaan: stempluspas.

      4 Bij ministeriële regeling worden modellen vastgesteld voor de stukken, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_7
      [ref2]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0044317/2021-01-30#Artikel7b
    references:
