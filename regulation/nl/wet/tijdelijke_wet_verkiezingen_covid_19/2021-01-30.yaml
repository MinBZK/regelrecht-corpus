  - number: '14'
    text: |-
      In afwijking van [artikel K 11, eerste lid, van de Kieswet][ref1] toont de kiezer aan het daartoe aangewezen lid
      van het stembureau het in [artikel J 24, eerste lid, onder a, van de Kieswet][ref2] genoemde identiteitsdocument
      en overhandigt aan het stembureaulid de kiezerspas.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelK_11
