      1 [Paragraaf 3.2 van het Tijdelijk experimentenbesluit stembiljetten en centrale stemopneming][ref1] is niet van
      toepassing op een stembureau als bedoeld in [artikel 11a][ref2].

      2 In afwijking van [artikel N 11, eerste lid, van de Kieswet][ref3] wordt het proces-verbaal overgedragen aan het
      gemeentelijk stembureau.

      3 De vaststelling van het aantal stemmen, bedoeld in
      [artikel 38, eerste lid, van het Tijdelijk experimentenbesluit stembiljetten en centrale stemopneming][ref4],
      vindt eerst plaats nadat tevens alle processen-verbaal van de stembureaus, bedoeld in [artikel 11a][ref5], aan het
      gemeentelijk stembureau ter kennis zijn gebracht.

      4 Het gemeentelijk stembureau maakt bij de vaststelling van de aantallen stemmen, bedoeld in
      [artikel 38, eerste lid, van het Tijdelijk experimentenbesluit stembiljetten en centrale stemopneming][ref6] apart
      melding van de stemmen die in de briefstembureaus zijn uitgebracht.


