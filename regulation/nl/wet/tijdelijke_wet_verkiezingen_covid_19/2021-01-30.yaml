  - number: 23d
    text: |-
      1 In aanvulling op [artikel N 2 van de Kieswet][ref1] worden ook de retourenveloppen, bedoeld in
      [artikel 11h][ref2], in een pak gedaan.

      2 Alvorens over te gaan tot de handelingen, bedoeld in [artikel N 5][ref3], opent een lid van het briefstembureau
      de enveloppen die zich in de stembus bevinden. Indien in een enveloppe zich geen of meer dan één stembiljet
      bevindt, wordt hiervan een aantekening gemaakt. Indien zich meer dan één stembiljet in één enveloppe bevindt, doet
      hij deze biljetten wederom in de enveloppe en legt deze, na haar te hebben verzegeld, terzijde.

      3 [Artikel N 7 van de Kieswet][ref4] is van toepassing, met dien verstande dat voor de toepassing van het eerste
      lid, in plaats van «rood heeft gemaakt» wordt gelezen: heeft ingekleurd, en dat voor de toepassing van het derde
      lid, in plaats van «rood maken» wordt gelezen: inkleuren.

      4 [Artikel N 8, eerste lid, van de Kieswet][ref5] is van toepassing, met dien verstande dat in plaats van
      «[artikel N 7][ref6]» wordt gelezen: [artikel 23d][ref7] van de Tijdelijke wet verkiezingen covid-19.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
