  - number: 11f
    text: |-
      1 De stukken, bedoeld in [artikel 11c, vierde lid][ref1], dienen uiterlijk op de dag van de stemming
      om eenentwintig uur in het bezit te zijn van de burgemeester dan wel een afgiftepunt als bedoeld in
      [artikel 11d][ref2].

      2 De burgemeester draagt er zorg voor dat de tijdig binnengekomen retourenveloppen op de dag van de stemming
      onverwijld na eenentwintig uur ongeopend overhandigd worden aan de voorzitters van de briefstembureaus, bedoeld
      in [artikel 11a][ref3].

      3 De retourenveloppen die te laat zijn binnengekomen worden door de burgemeester ongeopend in een of meer te
      verzegelen pakken gedaan.

      4 De burgemeester bewaart de pakken, bedoeld in het derde lid, drie maanden nadat over de toelating van de
      gekozenen is beslist. Daarna vernietigt hij deze pakken onmiddellijk. Van de vernietiging wordt proces-verbaal
      opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel11c
      [ref2]: https://wetten.overheid.nl/BWBR0044317#Artikel11d
      [ref3]: https://wetten.overheid.nl/BWBR0044317#Artikel11a
