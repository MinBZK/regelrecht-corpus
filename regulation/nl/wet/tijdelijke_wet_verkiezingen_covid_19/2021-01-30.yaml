  - number: 11a
    text: |-
      1 Onverminderd de [artikelen M 9, eerste lid][ref1], en [M 13, vijfde lid, van de Kieswet][ref2] wijzen
      burgemeester en wethouders in hun gemeente een of meer briefstembureaus aan. Deze stembureaus zijn uitsluitend
      bestemd voor per brief uit te brengen stemmen.

      2 Ten aanzien van deze stembureaus zijn de [artikelen J 11][ref3] en [J 16 van de Kieswet][ref4], voor zover
      laatstgenoemd artikel betrekking heeft op stemhokjes, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_9
