  - number: 7a
    text: |-
      1 Voor de toepassing van [artikel J 7, eerste volzin, van de Kieswet][ref1] wordt voor «voor de stemming» gelezen:
      voor de dag van de stemming.

      2 Daags na de dag van de kandidaatstelling zijn de gegevens beschikbaar voor het personaliseren van de stempassen
      ten behoeve van het bepaalde in [artikel J 7 van de Kieswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_7
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_7
