  - number: 11g
    text: |-
      1 Een lid van het briefstembureau opent de retourenveloppe en neemt de stempluspas en de enveloppe met het
      stembiljet eruit.

      2 Vervolgens wordt de echtheid van de stempluspas gecontroleerd.

      3 Indien de stempluspas echt is, wordt nagegaan of het nummer van de stempluspas voorkomt in het uittreksel van
      ongeldige stempassen, bedoeld in [artikel J 7a, tweede volzin, van de Kieswet][ref1].

      4 Indien het nummer van de stempluspas niet voorkomt in het uittreksel van ongeldige stempassen, wordt de enveloppe
      met het stembiljet ongeopend in de stembus gestoken. Indien het stembiljet zich niet in de daartoe bestemde
      enveloppe bevindt, wordt het, zonder het in te zien, dichtgevouwen in de stembus gestoken.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_7a
    url: https://wetten.overheid.nl/BWBR0044317/2021-01-30#Artikel11g
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_7a
  - number: 11h
    text: |-
      1 Indien de retourenveloppe niet alle stembescheiden bevat, de stempluspas niet echt is of het nummer van
      de stempluspas voorkomt in het uittreksel van ongeldige stempassen, doet het lid van het briefstembureau de
      aangetroffen bescheiden, zonder het stembiljet in te zien of zonder de enveloppe met het stembiljet te openen,
      wederom in de retourenveloppe en legt hij deze, na haar te hebben verzegeld, terzijde.

      2 Indien in een retourenveloppe stembescheiden van meer personen zijn gevoegd, waarvan er een of meer niet aan de
      bij of krachtens de [Kieswet][ref1] dan wel deze wet gestelde eisen voldoen, of waarvan het aantal stembescheiden
      niet overeenkomt met het aantal stembiljetten, onderscheidenlijk enveloppen met stembiljet, legt het lid van
      het briefstembureau de aangetroffen bescheiden, zonder het stembiljet in te zien of zonder de enveloppe met
      het stembiljet te openen, wederom in de retourenveloppe en legt hij deze, na haar te hebben verzegeld, eveneens
      terzijde.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0044317/2021-01-30#Artikel11h
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 11i
    text: |-
      Het briefstembureau stelt het aantal geldige stempluspassen vast behorend bij de enveloppen met een stembiljet,
      dan wel stembiljetten, die het in de stembus heeft gedeponeerd. Dit is het aantal kiezers dat tot de stemming is
      toegelaten.
    url: https://wetten.overheid.nl/BWBR0044317/2021-01-30#Artikel11i
  - number: '12'
    text: |-
      Gedurende de tijd dat een stembureau als bedoeld in de [artikelen 3][ref1] en [4][ref2] zitting houdt, zijn in
      afwijking van [artikel J 35, eerste lid, van de Kieswet][ref3] de kiezers die toegang hebben tot de locatie waar
      het stembureau zitting houdt bevoegd in het stemlokaal te vertoeven voor zover de huisregels van de locatie waar
      het stembureau zitting houdt zich daar niet tegen verzetten, voor zover de orde daardoor niet wordt verstoord en
      voor zover de voortgang van de zitting niet wordt belemmerd.


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044317#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_35
