  - number: '27'
    text: |-
      Als burgemeester en wethouders voor een stembureau een locatie als bedoeld in
      [artikel 6][ref1] hebben aangewezen, dan zet het stembureau, in afwijking van
      [artikel 22, vierde lid, tweede volzin][ref2], zijn werkzaamheden voort overeenkomstig het bepaalde in de
      [artikelen 22 tot en met 24 van het Tijdelijk experimentenbesluit stembiljetten en centrale stemopneming][ref3].


