  - number: '28'
    text: |-
      1 Het bepaalde bij of krachtens [artikel 9][ref1] is van overeenkomstige toepassing op de locatie waar het
      gemeentelijk stembureau de stemopneming verricht en de zitting tot vaststelling van de uitslag houdt.

      2 Het bij of krachtens [artikel 9][ref2] bepaalde voor kiezers is van overeenkomstige toepassing
      op andere aanwezige personen bij een zitting van het gemeentelijk stembureau, als bedoeld in
      [artikel 20 van het Tijdelijk experimentenbesluit stembiljetten en centrale stemopneming][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel9
