  - number: 7d
    text: |-
      In aanvulling op [artikel J 8, eerste lid, van de Kieswet][ref1] worden aan degene die tot deelneming aan de
      stemming bevoegd is en die op de dag van de stemming de leeftijd van zeventig jaar heeft bereikt tevens op zijn
      verzoek door de burgemeester de in [artikel 7b, eerste lid, onderdelen a, b, d en e][ref2], genoemde stukken
      opnieuw uitgereikt of toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_8
