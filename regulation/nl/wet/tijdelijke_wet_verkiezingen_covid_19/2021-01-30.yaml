    text: |-
      1 Indien het hoofdstemstembureau programmatuur heeft gebruikt ten behoeve van de vaststelling
      van de in [artikel O 2 van de Kieswet][ref1] bedoelde uitkomsten, maakt het, onverminderd
      [artikel O 4, eerste lid, van de Kieswet][ref2], het daarmee gegenereerde digitale bestand onverwijld op een
      algemeen toegankelijke wijze elektronisch openbaar.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld over de elektronische openbaarmaking van het
      proces-verbaal en de digitale bestanden.


