  - number: 17a
    text: |-
      1 In aanvulling op de identiteitsdocumenten die op grond van [artikel M 7, vierde lid, van de Kieswet][ref1] bij
      algemene maatregel van bestuur zijn aangewezen, mag ook een kopie van de navolgende identiteitsdocumenten worden
      bijgevoegd:

      a. noodpaspoort; of

      b. laissez-passer voor zover daaruit het bezit van de Nederlandse nationaliteit blijkt.

      2 Voorts kunnen ook de bescheiden genoemd in [artikel M 5 van het Kiesbesluit][ref2] die op de dag van
      de stemming, bedoeld in [artikel J 1, eerste lid][ref3], of [Y 8, eerste lid, van de Kieswet][ref4],
      maximaal een jaar hun geldigheid hebben verloren worden gebruikt, mits daarbij tevens een kopie van de in
      [artikel 61 van het Besluit verkrijging en verlies Nederlanderschap bedoelde verklaring][ref5] is gevoegd en deze
      niet meer dan een jaar voor de dag van de stemming is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_7
      [ref2]: https://wetten.overheid.nl/BWBR0004632#ArtikelM_5
