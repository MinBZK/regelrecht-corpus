  - number: '15'
    text: |-
      In afwijking van [artikel L 4 van de Kieswet][ref1] mag een kiezer per verkiezing als gemachtigde niet meer dan
      drie aanwijzingen aannemen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_4
    url: https://wetten.overheid.nl/BWBR0044317/2021-01-30#Artikel15
