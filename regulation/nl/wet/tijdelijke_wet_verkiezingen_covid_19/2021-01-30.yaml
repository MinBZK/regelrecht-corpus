  - number: '18'
    text: |-
      De [artikelen 19 tot en met 23][ref1] zijn van toepassing op:

      a. een stembureau dat zitting houdt in een stemlokaal als bedoeld in [artikel 6][ref2];

      b. een bijzonder stembureau als bedoeld in [artikel J 1, derde lid, van de Kieswet][ref3];

      c. een mobiel stembureau als bedoeld in [artikel J 4a van de Kieswet][ref4]; en

      d. een stembureau als bedoeld in [artikel 2g][ref5], [3a][ref6] of [4a][ref7] waar vroegtijdig gestemd kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel19
