  - number: 17b
    text: |-
      1 In afwijking van [artikel M 8, eerste lid, van de Kieswet][ref1] moet de retourenveloppe, indien deze per post
      worden geretourneerd, uiterlijk op de vijfde dag na de dag van de stemming om twaalf uur in het bezit zijn van de
      burgemeester van ’s-Gravenhage.

      2 In aanvulling op [artikel M 8, tweede lid, van de Kieswet][ref2] draagt de burgemeester van ’s-Gravenhage
      er tevens zorg voor dat de binnen de termijn, bedoeld in het eerste lid, ontvangen retourenveloppen, die zijn
      gefrankeerd, zo spoedig mogelijk maar uiterlijk op de vijfde dag na de dag van de stemming om zestien uur ongeopend
      overhandigd worden aan de voorzitter van een briefstembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_8
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelM_8
