  - number: '23'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over het in ontvangst nemen, het transport, de opslag
      en de overdracht van de stembus, de enveloppe en de pakken, bedoeld in [artikel N 2 van de Kieswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
