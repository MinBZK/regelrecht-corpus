    text: |-
      1 Indien de burgemeester programmatuur heeft gebruikt ten behoeve van de vaststelling
      van de in [artikel N 11 van de Kieswet][ref1] bedoelde opgave, maakt hij, onverminderd
      [artikel N 12, tweede lid, van de Kieswet][ref2], het daarmee gegenereerde digitale bestand onverwijld op een
      algemeen toegankelijke wijze elektronisch openbaar.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld over de elektronische openbaarmaking van het
      proces-verbaal en de digitale bestanden.


