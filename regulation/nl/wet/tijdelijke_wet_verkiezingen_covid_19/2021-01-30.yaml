  - number: '19'
    text: |-
      Na afloop van de stemming verzegelt het stembureau de stembus. Op de stembus wordt de naam van de gemeente en het
      nummer van het stembureau vermeld.
    url: https://wetten.overheid.nl/BWBR0044317/2021-01-30#Artikel19
  - number: '20'
    text: |-
      1 Het stembureau begint met het opmaken van het proces-verbaal van de stemming. Alle tot dat moment ingebrachte
      bezwaren worden in het proces-verbaal vermeld. Voorts worden in het proces-verbaal vermeld de aantallen bedoeld in
      [artikel J 25, negende lid][ref1], alsook de [artikelen K 11, tweede lid][ref2], en [L 17, derde lid][ref3], in
      samenhang met artikel J 25, negende lid, van de Kieswet.

      2 [Artikel N 2 van de Kieswet][ref4] is van overeenkomstige toepassing.

      3 De aanwezige leden van het stembureau ondertekenen een van het proces-verbaal deel uitmakende verklaring van
      authenticiteit. Daarna sluit de voorzitter tijdelijk de zitting.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_25
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelK_11
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_17
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
    url: https://wetten.overheid.nl/BWBR0044317/2021-01-30#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_25
      - id: ref2
