  - number: '6'
    text: |-
      Burgemeester en wethouders kunnen voor een stembureau, niet zijnde een stembureau als bedoeld
      in de [artikelen 3][ref1] of [4][ref2] dan wel de [artikelen J 1, derde lid][ref3], of
      [J 4a, eerste lid, van de Kieswet][ref4], ook een stemlokaal aanwijzen dat uitsluitend geschikt is voor
      het houden van een zitting voor zover het de stemming betreft. In dat geval wijzen zij daarnaast de
      locatie aan waar de stemopneming plaatsvindt. Beide locaties maken deel uit van de kennisgeving, bedoeld in
      [artikel J 4, eerste lid, derde volzin, van de Kieswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044317#Artikel4
