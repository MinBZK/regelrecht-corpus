        artikel: J_4
  - number: 17d
    text: |-
      1 Onmiddellijk nadat de stemming is geëindigd, doet het stembureau de retourenveloppen die op grond van
      [artikel 11e][ref1] zijn bewaard in een pak.

      2 Dit pak wordt verzegeld en voorzien van de naam van de gemeente, het nummer van het stembureau en het opschrift
      «Retourenveloppen t.b.v. het briefstembureau».

      3 De burgemeester draagt er zorg voor dat het pak veilig wordt getransporteerd, opgeslagen alsook tijdig wordt
      overgedragen aan een briefstembureau.

      4 Totdat het stembureau het pak overdraagt ten behoeve van het vervoer naar een briefstembureau, draagt het
      stembureau er zorg voor dat de zegels op het pak niet worden verbroken.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld over het in ontvangst nemen, het transport, de
      opslag en de overdracht van het pak.


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel11e
    url: https://wetten.overheid.nl/BWBR0044317/2021-01-30#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0044317
        artikel: 11e
        paragraaf: 6a
  - number: 17e
    text: |-
      1 Indien aan de voorzitter van het stembureau blijkt dat een behoorlijke afronding van de stemopneming niet langer
      van de leden van het stembureau gevergd kan worden, kan hij, na overleg en in overeenstemming met de burgemeester,
      besluiten de stemopneming te schorsen.

      2 De voorzitter maakt het besluit tot schorsing bekend bij de ingang van het stemlokaal, de plaats, bedoeld in
      [artikel 6][ref1], dan wel de plaats, bedoeld in [artikel J 1, vierde lid, van de Kieswet][ref2]. Van de schorsing
      van de zitting van het stembureau doet de burgemeester op algemeen toegankelijke wijze mededeling.

      3 De burgemeester bepaalt wanneer en waar de zitting wordt hervat en maakt dit op algemeen toegankelijke wijze
      bekend.

      4 De voorzitter van het stembureau schorst de stemopneming niet eerder, dan nadat voor iedere lijst het
      gezamenlijke aantal op de kandidaten uitgebrachte stemmen is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_1
    url: https://wetten.overheid.nl/BWBR0044317/2021-01-30#Artikel17e
