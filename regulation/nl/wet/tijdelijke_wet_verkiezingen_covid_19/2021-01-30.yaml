        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004627
        artikel: M_10
  - number: 23b
    text: |-
      In afwijking van [artikel N 15 van de Kieswet][ref1] stelt het briefstembureau het aantal geldige briefstembewijzen
      vast behorend bij de enveloppen met een stembiljet, dan wel stembiljetten, die het in de stembus heeft gedeponeerd.
      Dit is het aantal kiezers dat tot de stemming is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_15
    url: https://wetten.overheid.nl/BWBR0044317/2021-01-30#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: N_15
  - number: 23c
    text: |-
      De [artikelen 23d][ref1] en [23e][ref2] zijn uitsluitend van toepassing op een briefstembureau voor zover het
      de stemopneming betreft van stembiljetten die op grond van [artikel 11g, vierde lid][ref3], in de stembus zijn
      gedeponeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel23d
      [ref2]: https://wetten.overheid.nl/BWBR0044317#Artikel23e
      [ref3]: https://wetten.overheid.nl/BWBR0044317#Artikel11g
