  - number: 23e
    text: |-
      1 Indien gebruik is gemaakt van de bevoegdheid, bedoeld in [11b, eerste lid][ref1], vangt het briefstembureau
      in afwijking van [artikel N 1 van de Kieswet][ref2] op de dag van stemming om zeven uur dertig of op een later,
      door burgemeester en wethouders vast te stellen, tijdstip op die dag, de stemopneming aan ten aanzien van de
      stembiljetten die zich op dat moment in de stembus bevinden.

      2 Ten behoeve van de handelingen, bedoeld in de [artikelen 11g tot en met 11i][ref3], ten aanzien van de nog niet
      geopende retourenveloppen wordt de stemopneming volgens bij ministeriële regeling te stellen regels geschorst.
      Zodra deze handelingen ten aanzien van alle tijdig binnengekomen retourenveloppen zijn beëindigd, wordt de
      stemopneming bij ministeriële regeling te stellen regels hervat.

      3 Aan het bepaalde in [artikel N 9, eerste lid, eerste volzin, van de Kieswet][ref4] wordt niet eerder toepassing
      gegeven dan na eenentwintig uur. Voorts is eenieder die ambtshalve kennis kan nemen van de vastgestelde aantallen
      stemmen, zolang verplicht tot geheimhouding daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel11b
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_1
