  - number: '17'
    text: |-
      In afwijking van [artikel L 17, tweede lid, van de Kieswet][ref1] toont de gemachtigde tevens een kopie van een
      identiteitsdocument als bedoeld in [artikel J 24, eerste lid, onder a, van de Kieswet][ref2] van de volmachtgever,
      indien het een volmachtbewijs betreft als bedoeld in [hoofdstuk L, paragraaf 3, van de Kieswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelL_17
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_24
      [ref3]: https://wetten.overheid.nl/BWBR0004627#Paragraaf3
