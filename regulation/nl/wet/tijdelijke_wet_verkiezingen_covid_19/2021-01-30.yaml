  - number: 1d
    text: |-
      1. Voor de toepassing van [artikel E 5, derde lid, van de Kieswet][ref1] wordt in plaats van «drie
      plaatsvervangende leden» gelezen: een voldoend aantal plaatsvervangende leden.

      2. Indien meer dan drie plaatsvervangende leden zijn benoemd, vervalt de benoeming van de boven dit aantal benoemde
      leden, in afwijking van [artikel E 8, eerste volzin, van de Kieswet][ref2] van rechtswege op het moment dat deze
      wet vervalt.


