  - number: '9'
    text: |-
      1 De kiezer ontvangt uiterlijk op de vierde dag voor de dag van de stemming van de burgemeester informatie over
      de gezondheidscheck. Bij ministeriële regeling wordt hiervoor een model vastgesteld. Voorts krijgt de kiezer op
      de dag van de stemming bij de ingang van het stemlokaal informatie over de in het vierde lid bedoelde regels.
      Bij ministeriële regeling kan voor de te verstrekken informatie bij de ingang van het stemlokaal een model worden
      vastgesteld.

      2 De kiezer beantwoordt voor zichzelf de vragen uit de gezondheidscheck. De kiezer die weet dat hij niet
      aan de gezondheidscheck voldoet, betreedt, in afwijking van de [artikelen J 24, eerste lid][ref1], en
      [J 35, eerste lid, van de Kieswet][ref2], het stemlokaal niet.

      3 Burgemeester en wethouders nemen voorafgaand aan de zitting van een stembureau een gezondheidscheck af bij de
      leden van het stembureau, de waarnemers, bedoeld in [artikel 13][ref3], en andere personen die het stembureau ten
      dienste worden gesteld of bijstaan op de locatie waar en gedurende de periode dat het stembureau zitting houdt.
      Bij ministeriële regeling wordt hiervoor een model vastgesteld. Indien één van de voornoemde personen niet aan de
      gezondheidscheck voldoet, kan de betrokkene zijn functie niet vervullen. De gezondheidscheck kan gedurende de tijd
      dat een stembureau zitting houdt worden herhaald.

      4 In het stemlokaal nemen de aanwezige personen de bij ministeriële regeling vast te stellen maatregelen met
      betrekking tot de hygiëne en het gebruik van persoonlijke beschermingsmiddelen in het stemlokaal in acht.

      5 De in [artikel J 28 van de Kieswet][ref4] bedoelde kiezer die van het stembureau bijstand verlangt, kan door een
      stembureaulid gevraagd worden een gezondheidscheck over te leggen. Bij ministeriële regeling wordt hiervoor een
      model vastgesteld.

      6 Indien een lid van het stembureau van oordeel is dat de omstandigheden bij de ingang van of in het stemlokaal
      zodanig zijn dat de daar aanwezige personen [artikel 58f, eerste lid, van de Wet publieke gezondheid][ref5] of het
      bepaalde bij of krachtens dit artikel niet in acht nemen of kunnen nemen, kan het stembureaulid de aanwijzingen
      geven die nodig zijn om de naleving daarvan te verzekeren. De aanwijzing dat een kiezer het stemlokaal niet mag
      betreden, of dat een kiezer het stemlokaal moet verlaten voordat hij zijn stem heeft uitgebracht, kan enkel worden
      gegeven door het stembureaulid bij de ingang van het stemlokaal respectievelijk de voorzitter van het stembureau.

      7 [Artikel 1, eerste lid, van de Wet gedeeltelijk verbod gezichtsbedekkende kleding ][ref6]is niet van toepassing
      voor zover de bij die bepaling verboden gezichtsbedekking geheel of gedeeltelijk het gevolg is van het dragen van
      persoonlijke beschermingsmiddelen als bedoeld in het vierde lid.

      8 Onder stemlokaal wordt voor de toepassing van dit artikel tevens verstaan een plaats waar het stembureau de
      stemopneming verricht.

      9 In een gebouw waar een stemlokaal is aangewezen, gelden voor kiezers, stembureauleden en waarnemers als bedoeld
      in [artikel 13][ref7] geen andere voorschriften teneinde besmetting met of overdracht van het coronavirus te
      voorkomen dan bij of krachtens de wet gestelde regels.

      10 Het tiende lid is niet van toepassing op een gebouw waarin een stembureau als bedoeld in de [artikelen 3][ref8]
      en [4][ref9] zitting houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_24
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_35
      [ref3]: https://wetten.overheid.nl/BWBR0044317#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_28
