  - number: 11d
    text: |-
      1 Burgemeester en wethouders wijzen binnen de gemeente een of meer plaatsen aan waar retourenveloppen als bedoeld
      in [artikel 11c, vijfde lid][ref1], in persoon kunnen worden afgegeven ten behoeve van het in die gemeente
      gevestigde briefstembureau.

      2 Een retourenveloppe kan vanaf de zevende dag voor de dag van de stemming in persoon worden afgegeven op een
      afgiftepunt als bedoeld in het eerste lid:

      a. op een werkdag, niet zijnde de dag van de stemming, ten minste tussen negen en zeventien uur;

      b. op een weekenddag, voor zover burgemeester en wethouders daartoe beslissen, gedurende een door hen aangewezen
      periode;

      c. op de dag van de stemming gedurende de in [artikel J 1, tweede lid, van de Kieswet][ref2] genoemde periode.

      3 Gedurende de tijd dat een afgiftepunt open is, krijgt een ieder op zijn verzoek de in
      [artikel 7b, eerste lid, onderdelen a, b, d en e][ref3], genoemde stukken uitgereikt.

      4 De burgemeester brengt de aanwijzing en vaststelling van de plaatsen, dagen en tijdstippen ten minste veertien
      dagen voor de dag van de stemming ter openbare kennis.

      5 Degene die ten behoeve van het briefstembureau de enveloppe in ontvangst neemt, houdt daarvan aantekening door
      daarop de ontvangstdatum en een handtekening te plaatsen.

      6 De [artikelen 5][ref4] en [11c, zesde en zevende lid][ref5], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel11c
