  - number: 11c
    text: |-
      1 In aanvulling op [hoofdstuk J van de Kieswet][ref1] kan een kiesgerechtigde die de in
      [artikel 7b, eerste lid][ref2], genoemde stukken heeft ontvangen ook aan de stemming deelnemen door op het
      briefstembiljet een stipje geplaatst vóór de kandidaat van zijn keuze in te kleuren.

      2 Daarna vouwt hij het briefstembiljet dicht op zodanige wijze dat de namen van de kandidaten niet zichtbaar zijn
      en doet hij het briefstembiljet in de enveloppe voor het stembiljet.

      3 De kiezer ondertekent de op de stempluspas gestelde verklaring dat hij het stembiljet persoonlijk heeft ingevuld.

      4 Vervolgens doet hij de stempluspas en de enveloppe met het stembiljet in de retourenveloppe, bedoeld in
      [artikel 7b, eerste lid, onderdeel b][ref3], dan wel een andere geadresseerde enveloppe en retourneert hij deze
      gesloten.

      5 De kiezer kan de retourenveloppe per post doen toekomen aan de burgemeester van de gemeente waar hij op de dag
      van de kandidaatstelling als kiezer is geregistreerd, onverminderd het bepaalde in de [artikelen 11d][ref4] en
      [11e][ref5].

      6 De burgemeester draagt er zorg voor dat de retourenveloppen veilig worden opgeslagen alsook tijdig wordt
      overgedragen aan een briefstembureau.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld over het in ontvangst nemen, het transport, de
      opslag en de overdracht van de retourenveloppen.


