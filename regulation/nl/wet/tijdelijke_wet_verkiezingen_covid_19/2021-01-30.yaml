  - number: '22'
    text: |-
      1 De burgemeester draagt er zorg voor dat de bescheiden, bedoeld in
      [artikel 21, tweede respectievelijk vierde lid][ref1], tijdig worden vervoerd naar de plaats waar de stemopneming
      zal plaatsvinden en dat de daarop aangebrachte zegels niet worden verbroken totdat het stembureau zijn zitting
      heeft hervat.

      2 Het stembureau hervat zijn zitting op de dag van de stemming onverwijld na eenentwintig uur.

      3 In afwijking van het tweede lid vangt een stembureau als bedoeld in [artikel 18, aanhef, onderdeel d][ref2],
      de stemopneming op de dag van de stemming aan om zeven uur dertig of op een later, door
      burgemeester en wethouders vast te stellen, tijdstip op die dag. Aan het bepaalde in
      [artikel N 9, eerste lid, eerste volzin, van de Kieswet][ref3] wordt niet eerder toepassing gegeven dan na
      eenentwintig uur. Voorts is tot die tijd eenieder die ambtshalve kennis kan nemen van de vastgestelde aantallen
      stemmen, zolang verplicht tot geheimhouding daarvan.

      4 Op de locatie van de stemopneming opent het stembureau de verzegelde enveloppe met het proces-verbaal en de
      verzegelde stembus. Vervolgens zet het stembureau zijn werkzaamheden voort overeenkomstig het bepaalde in de
      [artikelen N 5 tot en met N 10 van de Kieswet][ref4].

      5 Indien het stembureau een verschil vaststelt tussen het aantal kiezers dat tot de stemming is toegelaten en het
      aantal stemmen dat is geteld, is het stembureau bevoegd de pakken, bedoeld in [artikel N 2 van de Kieswet][ref5],
      te openen en de in [artikel N 1 van de Kieswet][ref6] bedoelde aantallen opnieuw vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0044317#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0044317#Artikel18
