  - number: 17f
    text: |-
      1 Indien de stemopneming is geschorst als bedoeld in [artikel 17e, eerste lid][ref1], zijn de
      [artikelen J 26][ref2], [J 30, tweede volzin][ref3], [J 31][ref4] en [J 32 van het Kiesbesluit][ref5] niet
      van toepassing.

      2 In aanvulling op [artikel J 29 van het Kiesbesluit][ref6] worden de stembiljetten die zich in de stembus
      bevonden, lijstgewijs bijeengevoegd en in de stembus gedaan.

      3 De [artikelen 19, tweede volzin][ref7], [20][ref8], [21, eerste en vierde lid][ref9], en [22, eerste lid][ref10],
      zijn van overeenkomstige toepassing.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over het in ontvangst nemen, het transport, de
      opslag en de overdracht van de stembus, de enveloppe en de pakken.


