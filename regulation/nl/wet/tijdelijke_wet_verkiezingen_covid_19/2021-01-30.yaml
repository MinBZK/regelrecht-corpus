  - number: 11b
    text: |-
      1 Burgemeester en wethouders kunnen bepalen dat briefstembureaus, in afwijking van
      [artikel J 1 van de Kieswet][ref1], ten behoeve van het verrichten van de handelingen, bedoeld
      in de [artikelen 11g tot en met 11i][ref2], tevens zitting houden vanaf het moment dat het in
      [artikel J 7a, eerste lid, tweede volzin, van de Kieswet][ref3] bedoelde uittreksel is vastgesteld op door
      burgemeester en wethouders te bepalen dagen en tijden. In dat geval draagt de burgemeester er in afwijking van
      [artikel 11f, tweede lid][ref4], zorg voor dat de binnengekomen retourenveloppen op deze dagen worden overhandigd
      aan de voorzitter van het briefstembureau.

      2 Indien burgemeester en wethouders gebruik hebben gemaakt van de bevoegdheid, bedoeld in het
      eerste lid, vangen deze stembureaus op de dag van stemming eerst met de handelingen, bedoeld in de
      [artikelen 11g tot en met 11i][ref5] aan, nadat het stembureau overeenkomstig [artikel 23e][ref6] de stemopneming
      heeft verricht ten aanzien van de stembiljetten die zich bij aanvang van de dag van de stemming in de stembus
      bevinden.

      3 In afwijking van [artikel J 1, tweede lid, van de Kieswet][ref7] eindigt de stemming op de dag van de stemming
      zodra de briefstembureaus de handelingen, bedoeld in de [artikelen 11g tot en met 11i][ref8], ten aanzien van alle
      tijdig binnengekomen retourenveloppen hebben beëindigd.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de zittingen, bedoeld in het
      eerste lid, en het bewaren van de stembescheiden.


