preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het noodzakelijk is een tijdelijke solidariteitsbijdrage over de
    overwinsten van ondernemingen die actief zijn in de sectoren ruwe olie, aardgas en de raffinage van aardolie in
    te voeren overeenkomstig Verordening (EU) 2022/1854 van de Raad van 6 oktober 2022 betreffende een noodinterventie
    in verband met de hoge energieprijzen (PbEU 2022, L 261), teneinde bij te dragen tot de betaalbaarheid van energie
    voor huishoudens en bedrijven;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0047704/2023-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onder de naam solidariteitsbijdrage wordt een belasting geheven van een bijdrageplichtige als bedoeld in
      [artikel 2.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047704#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0047704/2023-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0047704
        artikel: '2.1'
        hoofdstuk: '2'
  - number: '1.2'
    text: |-
      1 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *bijdragejaar:* elk boekjaar dat aanvangt in het kalenderjaar 2022;
        - *boekjaar:* het jaar, bedoeld in
      [artikel 7, vierde lid, eerste zin, van de Wet op de vennootschapsbelasting 1969][ref1];
        - *belastbare winst:* de belastbare winst, bedoeld in
      [artikel 7, derde lid, van de Wet op de vennootschapsbelasting 1969][ref2];
        - *Nederlands inkomen:* het Nederlandse inkomen, bedoeld in
      [artikel 17, derde lid, onderdeel a, van de Wet op de vennootschapsbelasting 1969][ref3];
        - *referentiewinst:* het gemiddelde van de belastbare winst of het Nederlandse inkomen over de vier boekjaren
      die voorafgaan aan het bijdragejaar of, indien meer dan een boekjaar aanvangt in het kalenderjaar 2022, aan de
      bijdragejaren;
        - *overwinst:* de in het bijdragejaar genoten belastbare winst of het in het bijdragejaar genoten Nederlandse
      inkomen voor zover die belastbare winst, onderscheidenlijk dat Nederlandse inkomen, meer bedraagt dan 120% van
      de referentiewinst;
        - *omzet:* de netto-omzet, bedoeld in [artikel 377 van Boek 2 van het Burgerlijk Wetboek][ref4].

      2 Indien minder dan vier boekjaren voorafgaan aan het bijdragejaar of, indien meer dan een boekjaar aanvangt in
      het kalenderjaar 2022, de bijdragejaren, bedraagt de referentiewinst het gemiddelde van de belastbare winst of het
      Nederlandse inkomen over de boekjaren die voorafgaan aan het bijdragejaar, onderscheidenlijk de bijdragejaren.

      3 De referentiewinst bedraagt ten minste nihil.

      4 Indien een bijdrageplichtige deel uitmaakt van een fiscale eenheid als bedoeld in de [artikelen 15][ref5] of
      [15a van de Wet op de vennootschapsbelasting 1969][ref6], wordt de belastbare winst berekend alsof hij geen deel
      uitmaakt van de fiscale eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel7
