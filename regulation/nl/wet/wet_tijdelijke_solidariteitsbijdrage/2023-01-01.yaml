  - number: '8.1'
    text: |-
      1 Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst, werkt terug tot en met 1 januari 2022 en vervalt op een bij koninklijk besluit te bepalen tijdstip.

      2 In afwijking van het eerste lid treedt [artikel 7.2][ref1] in werking op een bij koninklijk besluit te bepalen
      tijdstip.

      3 In afwijking van het eerste lid treedt [artikel 7.3][ref2] in werking met ingang van 1 januari 2023,
      dan wel indien het Staatsblad waarin deze wet wordt geplaatst, wordt uitgegeven na 1 januari 2023, treedt
      artikel 7.3 in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin de wet
      wordt geplaatst, en werkt terug tot en met 1 januari 2023. Artikel 7.3 vindt eerst toepassing nadat
      [artikel 90 van de Wet belastingen op milieugrondslag][ref3] bij het begin van het kalenderjaar 2023 is toegepast.


