  - number: '6.4'
    text: |-
      1 Voor de toepassing van [artikel 28a van de Invorderingswet 1990][ref1] wordt voor belastingplichtige gelezen:
      bijdrageplichtige.

      2 Hoofdelijk aansprakelijk is voor de solidariteitsbijdrage die over een tijdvak is geheven

      van een bijdrageplichtige die behoort tot een fiscale eenheid
      als bedoeld in de [artikelen 15, eerste of tweede lid][ref2], of
      [15a, eerste lid, van de Wet op de vennootschapsbelasting 1969][ref3]: elk van de andere maatschappijen die in dat
      tijdvak deel uitmaakt of uitmaakte van die fiscale eenheid.

      3 Hoofdelijk aansprakelijk is voor de solidariteitsbijdrage die is verschuldigd door een bijdrageplichtige die aan
      de heffing van de solidariteitsbijdrage is onderworpen en waarvan de plaats van vestiging niet langer in Nederland
      is gelegen: ieder van de met de verplaatsing belaste personen.

      4 Degene die op grond van het derde lid aansprakelijk is, is niet aansprakelijk voor zover hij bewijst dat het niet
      aan hem te wijten is dat de solidariteitsbijdrage niet is voldaan.

      5 [Artikel 32 van de Invorderingswet 1990][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel28a
