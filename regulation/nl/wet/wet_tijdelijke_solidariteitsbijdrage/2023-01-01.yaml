  - number: '3.1'
    text: |-
      1 De solidariteitsbijdrage wordt geheven over de door een bijdrageplichtige genoten overwinst.

      2 Indien een bijdrageplichtige op grond van
      [artikel 7, vijfde lid, van de Wet op de vennootschapsbelasting 1969][ref1] het belastbare bedrag of het
      belastbare Nederlandse bedrag voor de vennootschapsbelasting berekent in een andere geldeenheid dan de euro,
      wordt de overwinst berekend in die andere geldeenheid. Voor de omrekening in euro’s van de in de andere
      geldeenheid berekende overwinst in het bijdragejaar geldt de koers die op grond van genoemd artikel 7, vijfde
      lid, in dat jaar geldt voor de omrekening van het belastbare bedrag of het belastbare Nederlandse bedrag voor de
      vennootschapsbelasting in euro’s.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel7
    url: https://wetten.overheid.nl/BWBR0047704/2023-01-01#Artikel3.1
