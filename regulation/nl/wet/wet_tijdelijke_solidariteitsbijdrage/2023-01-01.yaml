  - number: '2.1'
    text: |-
      Bijdrageplichtig voor de solidariteitsbijdrage is een lichaam dat:

      a. binnenlands belastingplichtig is als bedoeld in
      [artikel 2, eerste lid, van de Wet op de vennootschapsbelasting 1969][ref1], of buitenlands belastingplichtig is
      als bedoeld in [artikel 3, eerste lid, van die wet][ref2]; en

      b. in het bijdragejaar ten minste 75% van zijn omzet, onderscheidenlijk
      van de omzet van zijn in Nederland gedreven onderneming als bedoeld in
      [artikel 17, derde lid, onderdeel a, van de Wet op de vennootschapsbelasting 1969][ref3], behaalt met
      economische activiteiten op het gebied van winning van koolwaterstoffen, mijnbouw, de raffinage van aardolie
      of de vervaardiging van cokesovenproducten als bedoeld in [Verordening (EG) nr. 1893/2006](32006R1893) van
      het Europees Parlement en de Raad van 20 december 2006 tot vaststelling van de statistische classificatie van
      economische activiteiten NACE Rev. 2 en tot wijziging van [Verordening (EEG) nr. 3037/90](31990R3037) en enkele EG-
      verordeningen op specifieke statistische gebieden (PbEU 2006, L 393).


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel17
