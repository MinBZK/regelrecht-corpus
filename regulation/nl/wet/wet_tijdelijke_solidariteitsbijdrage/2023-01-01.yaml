  - number: '6.3'
    text: |-
      1 Voor de toepassing van [artikel 67b, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1] vormt
      het verzuim het niet doen van aangifte dan wel het niet doen van aangifte binnen de termijn, bedoeld in
      [artikel 5.1, derde lid][ref2].

      2 In afwijking van de [artikelen 67c, derde lid][ref3], en
      [67f, vierde lid, van de Algemene wet inzake rijksbelastingen][ref4] vervalt de bevoegdheid tot het opleggen van
      een bestuurlijke boete op grond van die artikelen door verloop van zeven jaren na afloop van het kalenderjaar
      waarin de belastingschuld is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67b
