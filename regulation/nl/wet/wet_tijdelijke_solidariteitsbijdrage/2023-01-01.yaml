  - number: '4.1'
    text: De solidariteitsbijdrage bedraagt 33% van de overwinst.
    url: https://wetten.overheid.nl/BWBR0047704/2023-01-01#Artikel4.1
  - number: '5.1'
    text: |-
      1 De solidariteitsbijdrage wordt op aangifte voldaan.

      2 Voor de toepassing van de [Algemene wet inzake rijksbelastingen][ref1] bij de heffing van de
      solidariteitsbijdrage wordt voor belastingplichtige gelezen: bijdrageplichtige.

      3 In afwijking van [artikel 10, tweede lid, eerste zin, van de Algemene wet inzake rijksbelastingen][ref2] stelt de
      inspecteur de termijn voor het doen van aangifte vast op 17 maanden na het einde van het tijdvak.

      4 In afwijking van [artikel 19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref3] is de
      bijdrageplichtige gehouden de solidariteitsbijdrage overeenkomstig de aangifte aan de ontvanger te betalen
      uiterlijk 17 maanden na het einde van het tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel19
