  - number: '6.1'
    text: |-
      In afwijking van [artikel 20, derde lid, van de Algemene wet inzake rijksbelastingen][ref1] vervalt de bevoegdheid
      tot naheffing door verloop van zeven jaren na het einde van het kalenderjaar waarin de belastingschuld is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0047704/2023-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
  - number: '6.2'
    text: |-
      1 Met betrekking tot een naheffingsaanslag wordt belastingrente als bedoeld in
      [Hoofdstuk VA van de Algemene wet inzake rijksbelastingen][ref1] in rekening gebracht.

      2 De belastingrente wordt enkelvoudig berekend over het tijdvak dat aanvangt op de dag volgend op de laatste dag
      van de betaaltermijn, bedoeld in [artikel 5.1, vierde lid][ref2], en eindigt op de dag voorafgaand aan de dag
      waarop de naheffingsaanslag invorderbaar is ingevolge [artikel 9 van de Invorderingswet 1990][ref3] en heeft als
      grondslag de nageheven solidariteitsbijdrage.

      3 Indien een naheffingsaanslag ter zake waarvan belastingrente in rekening is gebracht naar aanleiding van een
      bezwaarschrift, een daaropvolgende gerechtelijke procedure of een ambtshalve vermindering wordt verminderd of
      wordt vernietigd, wordt de eerder in rekening gebrachte rente naar evenredigheid verminderd, onderscheidenlijk
      vernietigd.

      4 De [artikelen 30ha][ref4] en [30hb van de Algemene wet inzake rijksbelastingen][ref5] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVA
      [ref2]: https://wetten.overheid.nl/BWBR0047704#Artikel5.1
