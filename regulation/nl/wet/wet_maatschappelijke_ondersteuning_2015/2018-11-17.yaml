    text: Het college is de verwerkingsverantwoordelijke voor de verwerking, bedoeld in het eerste tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.1.1
  - number: 5.1.2.1
    text: |-
      Een aanbieder die een maatwerkvoorziening levert en een derde aan wie ten laste van een persoonsgebonden budget
      betalingen worden gedaan, is bevoegd tot het verwerken van persoonsgegevens van de cliënt, waaronder gegevens over
      gezondheid, alsmede persoonsgegevens van de mantelzorger van de cliënt met betrekking tot de hulp die deze aan de
      cliënt biedt of kan bieden, voor zover deze zijn verkregen van het college, van de cliënt of van de mantelzorger en
      noodzakelijk zijn voor:
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.1.2
  - number: 5.1.2.1.a
    text: |-
      het aan de cliënt leveren van de diensten, hulpmiddelen, woningaanpassingen en andere maatregelen waartoe hij zich
      jegens het college dan wel de cliënt heeft verbonden;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.1.2
  - number: 5.1.2.1.b
    text: |-
      de uitvoering van [artikel 2.1.4][ref1] of [2.1.5][ref2];


