  - number: 8.7.5
    text: |-
      Het college wijst voor de eerste dag van het kalenderjaar na dat waarin enig artikel van deze wet in werking is
      getreden, personen aan die belast zijn met het houden van toezicht op de naleving van het bepaalde bij of krachtens
      deze wet.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.7
  - number: 8.8.1
    text: |-
      In afwijking van [artikel 3.5, eerste lid][ref1], is de aanbieder voor beroepskrachten als in dat lid bedoeld
      die op het tijdstip van inwerkingtreden van dat lid voor hem werkzaam zijn en ten aanzien van wie een verklaring
      omtrent het gedrag is vereist, uiterlijk binnen een bij algemene maatregel van bestuur vast te stellen termijn
      na dat tijdstip in het bezit van een verklaring omtrent het gedrag die niet eerder dan drie maanden voor het
      verstrijken van de vastgestelde termijn is afgegeven. De termijn kan voor verschillende groepen beroepskrachten
      verschillend worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel3
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '3'
        hoofdstuk: '3'
  - number: 8.8.2
    text: |-
      [Artikel 3.5, tweede en derde lid][ref1], is van overeenkomstige toepassing op een aanbieder als bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel3
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '3'
        hoofdstuk: '3'
  - number: 8.9.1
    text: |-
      De [Wet maatschappelijke ondersteuning][ref1] wordt ingetrokken, onverminderd de rechten en verplichtingen die
      onmiddellijk voor het tijdstip waarop [artikel 2.1.1][ref2] in werking is getreden, voor betrokkene zijn verbonden
      aan een met toepassing van de [Wet maatschappelijke ondersteuning][ref3] door het college genomen besluit waarbij
      aanspraak is verstrekt op een individuele voorziening in natura of het ontvangen van een persoonsgebonden budget
      dan wel een financiële tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0020031
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020031
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0020031
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0020031
  - number: 8.9.2
    text: |-
      Het recht zoals dat gold vóór het tijdstip van inwerkingtreding van enig artikel van deze wet, blijft van
      toepassing ten aanzien van besluiten genomen op grond van de [Wet maatschappelijke ondersteuning][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020031
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0020031
  - number: 8.9.3
    text: |-
      [Artikel 25 van de Wet maatschappelijke ondersteuning][ref1] blijft van toepassing op de roerende zaken, voor
      de aanschaf waarvan krachtens die wet een financiële tegemoetkoming is verstrekt, die zijn aangeschaft met een
      persoonsgebonden budget of die krachtens die wet in eigendom of bruikleen zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel25
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '25'
  - number: 8.9.4
    text: |-
      Het college en Onze Minister geven met betrekking tot het kalenderjaar waarin enig artikel van deze wet in werking
      is getreden, uitvoering aan [artikel 9 van de Wet maatschappelijke ondersteuning][ref1] voor 1 juli van het
      daaropvolgende kalenderjaar onderscheidenlijk 1 januari van het daaropvolgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel9
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '9'
  - number: 8.9.5
    text: |-
      De [artikelen 11][ref1] en [12 van de Wet maatschappelijke ondersteuning][ref2] zijn van overeenkomstige toepassing
      op de voorbereiding van de vaststelling van het beleidsplan, bedoeld in [artikel 2.1.2][ref3], en de verordening,
      bedoeld in [artikel 2.1.3][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020031#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0020031
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '8.10'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.10
  - number: 8.11.1
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.11
  - number: '8.12'
    text: 'Deze wet wordt aangehaald als: Wet maatschappelijke ondersteuning 2015.'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.12
