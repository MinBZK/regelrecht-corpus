        artikel: '40'
  - number: 8.3.6
    text: |-
      Voor de toepassing van het eerste tot en met vierde lid, is betrokkene de bijdrage in de kosten, bedoeld in
      [artikel 6, vierde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] onderscheidenlijk het bepaalde
      bij of krachtens [artikel 44, eerste lid, onderdeel b, van die wet][ref2], aan het college verschuldigd. De
      [artikelen 2.1.4, zesde lid][ref3], en [2.3.8][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.3
    references:
      - id: ref1
