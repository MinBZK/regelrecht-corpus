    text: |-
      De aanbieder respectievelijk de bedoelde derde is de verwerkingsverantwoordelijke voor de verwerking, bedoeld in
      het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.1.2
  - number: 5.1.3.1
    text: |-
      Het CAK en een andere instantie als bedoeld in [artikel 2.1.4, zevende lid][ref1], zijn bevoegd tot het verwerken
      van persoonsgegevens van de cliënt, zijn echtgenoot, inwonende minderjarige kinderen en zijn ouders, waaronder
      gegevens over gezondheid die noodzakelijk zijn voor de vaststelling en inning van een bijdrage als bedoeld in
      [artikel 2.1.4][ref2] of [2.1.5][ref3], voor zover deze op grond van [artikel 5.2.1][ref4], [5.2.2][ref5] of
      [5.2.3][ref6] zijn verkregen en noodzakelijk zijn voor de uitvoering van [artikel 2.1.4][ref7] of [2.1.5][ref8].


