  - number: 8.6.1
    text: |-
      Nadat het indicatieorgaan, bedoeld in [artikel 9b, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref1],
      en de zorgverzekeraar, bedoeld in [artikel 1][ref2], onderscheidenlijk de rechtspersoon, bedoeld
      in [artikel 40 van die wet][ref3], de in [artikel 8.2][ref4] genoemde gegevens hebben verstrekt aan
      het college van de gemeente waarvan betrokkene ingezetene is, voert het college, met overeenkomstige
      toepassing van [artikel 2.3.2, tweede tot en met achtste lid][ref5], zonder melding als bedoeld in
      [artikel 2.3.2, eerste lid][ref6], het in dat artikel bedoelde onderzoek uit op een zodanig tijdstip dat
      betrokkene tijdig voor het tijdstip waarop hij niet langer op grond van [artikel 8.3, eerste of derde lid][ref7],
      of [artikel 8.4, eerste lid][ref8], aanspraak zal hebben op de in die gegevens omschreven zorg onderscheidenlijk
      de in die gegevens omschreven subsidie, een aanvraag kan doen voor een maatwerkvoorziening als bedoeld in
      [artikel 2.3.5. eerste lid][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
