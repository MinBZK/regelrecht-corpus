    text: De Sociale verzekeringsbank is de verwerkingsverantwoordelijke voor de verwerking, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.1.4
  - number: 5.1.5.1
    text: |-
      De toezichthoudende ambtenaren zijn bevoegd tot het verwerken van persoonsgegevens, waaronder gegevens over
      gezondheid van de cliënt, alsmede persoonsgegevens, waaronder bijzondere categorieën van persoonsgegevens en
      persoonsgegevens van strafrechtelijke aard betreffende personen die betrokken bij calamiteiten, geweld bij de
      verstrekking van een voorziening, huiselijk geweld of kindermishandeling, voor zover deze zijn verkregen bij
      de uitoefening van het toezicht, bedoeld in [artikel 4.3.1][ref1], [6.1][ref2] of [6.2][ref3], en noodzakelijk
      zijn voor een goede uitoefening van het toezicht of het nemen van maatregelen ter handhaving van wettelijke
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel6
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.1.5
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0035362
        artikel: '6'
        hoofdstuk: '6'
  - number: 5.1.5.2
    text: |-
      De toezichthoudende ambtenaren zijn de verantwoordelijken voor de verwerking, bedoeld in het eerste lid. De
      aanbieder en de beroepskrachten die voor hem werkzaam zijn, verstrekken bij en naar aanleiding van een melding
      als bedoeld in het eerste lid aan de toezichthoudende ambtenaar de gegevens, daaronder begrepen persoonsgegevens,
      gegevens over gezondheid en andere bijzondere categorieën van persoonsgegevens en persoonsgegevens van
      strafrechtelijke aard, voor zover deze voor het onderzoeken van de melding noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.1.5
  - number: 5.1.6.1
    text: |-
      Het AMHK is bevoegd tot het verwerken van persoonsgegevens ten behoeve van de goede vervulling van de taken,
      bedoeld in [4.1.1, tweede en derde lid][ref1]. Het AMHK is de verwerkingsverantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.1.6
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 5.1.6.2
    text: |-
      Het AMHK is bevoegd persoonsgegevens, waaronder gegevens over gezondheid, huiselijk geweld of kindermishandeling,
      te verwerken van personen die betrokken zijn bij huiselijk geweld of kindermishandeling, indien uit een melding
