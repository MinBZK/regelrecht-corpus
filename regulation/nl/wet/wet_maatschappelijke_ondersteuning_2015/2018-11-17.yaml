  - number: 8.6a
    text: |-
      [Artikel 2.3.5, zesde lid][ref1], geldt tot een bij koninklijk besluit vast te stellen tijdstip niet voor daar
      bedoelde cliënten:


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.6a
