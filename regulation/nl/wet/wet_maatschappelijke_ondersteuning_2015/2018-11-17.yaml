      Derden die beroepshalve beschikken over inlichtingen die noodzakelijk kunnen worden geacht om een situatie van
      huiselijk geweld of kindermishandeling te beëindigen of een redelijk vermoeden daarvan te onderzoeken, kunnen aan
      een AMHK deze inlichtingen desgevraagd of uit eigen beweging verstrekken zonder toestemming van degene die het
      betreft en indien nodig met doorbreking van de plicht tot geheimhouding op grond van een wettelijk voorschrift of
      op grond van hun ambt of beroep.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.6
  - number: 5.2.7.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald op welke wijze persoonsgegevens worden verwerkt,
      de technische standaarden voor verwerking daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.7
  - number: 5.2.7.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, op voordracht van Onze Minister, mede namens Onze Minister
      van Veiligheid en Justitie, worden bepaald aan welke beveiligingseisen de in dit hoofdstuk bedoelde verwerking van
      persoonsgegevens voldoet.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.7
  - number: 5.2.8
    text: |-
      De cliënt verstrekt de aanbieder die een maatwerkvoorziening levert, een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] ter inzage waarmee zijn identiteit kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.8
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 5.2.9.1
    text: |-
      Het college, een aanbieder en een derde aan wie ten laste van een persoonsgebonden budget betalingen
      worden gedaan, het CAK, een andere instantie als bedoeld in [artikel 2.1.4, zevende lid][ref1], de Sociale
      verzekeringsbank, de toezichthoudende ambtenaren, het AMHK, en een zorgverzekeraar of een zorgaanbieder als
      bedoeld in de [Zorgverzekeringswet][ref2] gebruiken het burgerservicenummer van een persoon bij het verstrekken van
      persoonsgegevens als bedoeld in de [artikelen 5.2.1 tot en met 5.2.5][ref3] met het doel te waarborgen dat de in
      het kader van de uitvoering van deze wet te verwerken persoonsgegevens op die persoon betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018450
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel5
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.9
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018450
      - id: ref3
        bwb_id: BWBR0035362
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.2.9.2
    text: |-
      De in het eerste lid bedoelde instanties en personen stellen het burgerservicenummer van betrokkene vast wanneer
      zij voor de eerste maal contact met betrokkene hebben in het kader van de uitvoering van deze wet en de daarop
      berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.9
  - number: 5.2.9.3
    text: |-
      Teneinde het burgerservicenummer van een persoon vast te stellen worden het nummerregister en de voorzieningen,
      bedoeld in [artikel 3, eerste lid, onderdelen b en d, van de Wet algemene bepalingen burgerservicenummer][ref1]
      geraadpleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.9
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 5.2.9.4
    text: 'De raadpleging, bedoeld in het derde lid, kan achterwege gelaten worden, indien:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.9
  - number: 5.2.9.4.a
    text: |-
      het burgerservicenummer is verstrekt door een andere gebruiker als bedoeld in
      [artikel 1 van de Wet algemene bepalingen burgerservicenummer][ref1] die bij of krachtens wet gehouden is het
      burgerservicenummer van betrokkene vast te stellen aan de hand van het nummerregister en de voorzieningen, bedoeld
      in [artikel 3, eerste lid, onderdelen b en d, van de Wet algemene bepalingen burgerservicenummer][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022428
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.9
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022428
  - number: 5.2.9.4.b
    text: |-
      het burgerservicenummer is verkregen uit de basisregistratie personen, bedoeld in
      [artikel 1.2 van de Wet basisregistratie personen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.9
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
  - number: 5.2.9.5
    text: 'Indien aan een persoon geen burgerservicenummer is toegekend:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.9
  - number: 5.2.9.5.a
    text: |-
      nemen de in het eerste lid bedoelde instanties en personen in ieder geval de volgende gegevens van betrokkene in
      hun administratie op:
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.9
  - number: 5.2.9.5.a.1°
    text: achternaam;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.9
  - number: 5.2.9.5.a.2°
    text: voornamen;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.9
  - number: 5.2.9.5.a.3°
    text: geboortedatum, en
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.9
  - number: 5.2.9.5.a.4°
    text: postcode en huisnummer van het woonadres, en
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.9
  - number: 5.2.9.5.b
    text: |-
      vermelden de in het eerste lid bedoelde instanties en personen de gegevens, bedoeld in onderdeel a, bij het
      verstrekken van persoonsgegevens met betrekking tot de uitvoering van hun taken.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.9
  - number: 5.2.9.6
    text: |-
      Bij ministeriële regeling wordt bepaald aan welke beveiligingseisen de gegevensverwerking, bedoeld in het eerste
      tot en met vijfde lid voldoet.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.9
  - number: 5.2.9.7
    text: |-
      De in het eerste lid bedoelde instanties en personen kunnen van het tweede tot en met vijfde lid afwijken voor
      zolang dit noodzakelijk is met betrekking tot spoedeisende gevallen. In zodanig geval is het bepaalde krachtens het
      zesde lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.2.9
  - number: 5.3.1.1
    text: |-
      Indien aan het AMHK bij de uitoefening van de taken, bedoeld in [artikel 4.1.1, tweede lid][ref1], persoonsgegevens
      worden verstrekt door een ander dan betrokkene, brengt het AMHK betrokkene hiervan zo spoedig mogelijk, doch in
      ieder geval binnen vier weken na het moment van vastlegging van de hem betreffende gegevens, op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 5.3.1.2
    text: |-
      De in het eerste lid genoemde termijn kan door het AMHK telkens met ten hoogste twee weken worden verlengd, voor
      zover dit noodzakelijk is voor de uitoefening van de taken, bedoeld in [artikel 4.1.1, tweede lid][ref1], en dit
      noodzakelijk kan worden geacht om een situatie van huiselijk geweld of kindermishandeling te beëindigen of een
      redelijk vermoeden daarvan te onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 5.3.1.3
    text: |-
      Gelet op
      __REF000___________________________________________________________________________________________________________
      __ kan een AMHK inzage of verstrekking als bedoeld in artikel 15 van de Algemene verordening gegevensbescherming,
      bedoeld in dat artikel, aan de betrokkene achterwege laten voor zover dit noodzakelijk kan worden geacht om een
      situatie van huiselijk geweld of kindermishandeling te beëindigen of een redelijk vermoeden daarvan te onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel41
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.1
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '41'
  - number: 5.3.1.4
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin het bekendmaken van de
      identiteit van de persoon die het huiselijk geweld of kindermishandeling of het vermoeden daarvan heeft gemeld of
      van de persoon van wie informatie in het kader van het onderzoek is verkregen, achterwege kan blijven.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.1
  - number: 5.3.2.1
    text: |-
      Het college, een aanbieder, een derde aan wie ten laste van een persoonsgebonden budget betalingen worden gedaan,
      het CAK en een andere instantie als bedoeld in [artikel 2.1.4, zevende lid][ref1], de Sociale verzekeringsbank,
      toezichthoudende ambtenaren en het AMHK verstrekken aan een betrokkene desgevraagd zo spoedig mogelijk inzage in en
      afschrift van de bescheiden waarover zij met betrekking tot die betrokkene beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5.3.2.2
    text: 'Inzage in of afschrift van de bescheiden wordt aan betrokkene geweigerd, indien deze:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.2
  - number: 5.3.2.2.a
    text: jonger dan twaalf jaren is, of
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.2
  - number: 5.3.2.2.b
    text: |-
      de leeftijd van twaalf jaren heeft bereikt en niet in staat kan worden geacht tot een redelijke waardering van zijn
      belangen ter zake.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.2
  - number: 5.3.2.3
    text: |-
      Indien betrokkene jonger is dan zestien jaren, of de leeftijd van zestien jaar heeft bereikt en niet in staat
      kan worden geacht tot een redelijke waardering van zijn belangen ter zake, worden desgevraagd aan de wettelijke
      vertegenwoordiger inlichtingen dan wel inzage in of afschrift van de bescheiden verstrekt, tenzij het belang van
      betrokkene zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.2
  - number: 5.3.2.4
    text: |-
      Inlichtingen over, inzage in of afschrift van de bescheiden kan worden geweigerd, voor zover de persoonlijke
      levenssfeer van een ander dan betrokkene daardoor zou worden geschaad dan wel dit noodzakelijk is voor de
      uitoefening van de taken, bedoeld in [artikel 4.1.1, tweede lid][ref1], of om een situatie van huiselijk geweld of
      kindermishandeling te beëindigen dan wel een redelijk vermoeden daarvan te onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 5.3.2.5
    text: De persoon van wie de gegevens zijn opgeslagen, heeft het recht te verzoeken de gegevens te laten corrigeren.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.2
  - number: 5.3.3.1
    text: |-
      Onverminderd het bij of krachtens de wet bepaalde, verstrekken het college, een aanbieder, een derde aan wie
      ten laste van een persoonsgebonden budget betalingen worden gedaan, het CAK en een andere instantie als bedoeld
      in [artikel 2.1.4, zevende lid][ref1], de Sociale verzekeringsbank, toezichthoudende ambtenaren en het AMHK aan
      anderen dan de betrokkene geen inlichtingen over betrokkene, dan wel inzage in of afschrift van de bescheiden dan
      met toestemming van betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5.3.3.2
    text: |-
      Indien betrokkene minderjarig is, is in plaats van diens toestemming de toestemming van zijn wettelijke
      vertegenwoordiger vereist, indien hij:
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.3
  - number: 5.3.3.2.a
    text: jonger is dan twaalf jaren, of
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.3
  - number: 5.3.3.2.b
    text: |-
      de leeftijd van twaalf jaren heeft bereikt en niet in staat kan worden geacht tot een redelijke waardering van zijn
      belangen ter zake.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.3
  - number: 5.3.3.3
    text: |-
      Onder anderen dan betrokkene zijn niet begrepen degenen van wie beroepshalve de medewerking vereist is bij de
      uitvoering van de taken van het college, een aanbieder, een derde aan wie ten laste van een persoonsgebonden budget
      betalingen worden gedaan, het CAK en een andere instantie als bedoeld in [artikel 2.1.4, zevende lid][ref1], de
      Sociale verzekeringsbank, toezichthoudende ambtenaren en het AMHK.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5.3.3.4
    text: |-
      Bij regeling van Onze Minister, voor zover nodig in overeenstemming met Onze Minister van Veiligheid en Justitie,
      kunnen regels worden gesteld omtrent de wijze waarop een AMHK gegevens verwerkt en over de uitwisseling van
      gegevens tussen een AMHK en andere AMHK’s en met de raad voor de kinderbescherming, jeugdhulpaanbieders en
      gecertificeerde instellingen als bedoeld in [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 5.3.4.1
    text: |-
      Onverminderd [artikel 5.3.5][ref1] bewaren het college, een aanbieder, een derde aan wie ten laste van
      een persoonsgebonden budget betalingen worden gedaan, het CAK en een andere instantie als bedoeld in
      [artikel 2.1.4, zevende lid][ref2], de Sociale verzekeringsbank, toezichthoudende ambtenaren en het AMHK de
      persoonsgegevens die zij op grond van deze wet met betrekking tot een betrokkene onder zich hebben, gedurende
      vijftien jaren, te rekenen van het tijdstip van ontvangst of vervaardiging, of zoveel langer als redelijkerwijs in
      verband met een zorgvuldige uitvoering van hun taken op grond van deze wet noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.4
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5.3.4.2
    text: |-
      Het AMHK bewaart de persoonsgegevens van een gezin waarmee het AMHK bemoeienis heeft gehad, tot het jongste kind
      van het gezin meerderjarig is geworden, een en ander voor zover aannemelijk gemaakt kan worden dat het bewaren
      een bijdrage kan leveren aan het beëindigen van een mogelijke situatie van kindermishandeling, of van belang kan
      zijn voor een situatie waarin een maatregel met betrekking tot het gezag over een minderjarige overwogen dient
      te worden.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.4
  - number: 5.3.5.1
    text: |-
      Het college, een aanbieder, een derde aan wie ten laste van een persoonsgebonden budget betalingen worden gedaan,
      het CAK en een andere instantie als bedoeld in [artikel 2.1.4, zevende lid][ref1], de Sociale verzekeringsbank,
      toezichthoudende ambtenaren en het AMHK vernietigen de persoonsgegevens die zij op grond van deze wet met
      betrekking tot een betrokkene onder zich hebben, binnen drie maanden na een daartoe strekkend schriftelijk verzoek
      van degene op wie de persoonsgegevens betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.5
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5.3.5.2
    text: |-
      Het eerste lid geldt niet voor zover het verzoek persoonsgegeven betreft waarvan redelijkerwijs aannemelijk is
      dat de bewaring van aanmerkelijk belang is voor een ander dan de verzoeker alsmede voor zover het bepaalde bij of
      krachtens de wet zich tegen vernietiging verzet.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.5
  - number: 5.3.5.3
    text: 'Het verzoek wordt niet ingewilligd indien het gedaan is door iemand die:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.5
  - number: 5.3.5.3.a
    text: jonger is dan twaalf jaar, of
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.5
  - number: 5.3.5.3.b
    text: |-
      minderjarig is en de leeftijd van twaalf jaar heeft bereikt en niet in staat kan worden geacht tot een redelijke
      waardering van zijn belangen ter zake.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.5
  - number: 5.3.5.4
    text: In de gevallen, bedoeld in het derde lid, kan het verzoek door een wettelijke vertegenwoordiger worden gedaan.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.5
  - number: 5.3.6.1
    text: |-
      In afwijking van [artikel 5.3.3, eerste lid][ref1], kunnen zonder toestemming van de betrokkene ten behoeve van
      statistiek of wetenschappelijk onderzoek op het gebied van de volksgezondheid, opgroei- en opvoedingsproblemen,
      psychische problemen en stoornissen, kinderbescherming of jeugdreclassering aan een ander desgevraagd inlichtingen
      over de betrokkene of inzage in het dossier worden verstrekt indien:


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel5
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.6
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 5.3.6.1.a
    text: |-
      het vragen van toestemming in redelijkheid niet mogelijk is en met betrekking tot de uitvoering van het onderzoek
      is voorzien in zodanige waarborgen, dat de persoonlijke levenssfeer van de betrokkene niet onevenredig wordt
      geschaad, of
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.6
  - number: 5.3.6.1.b
    text: |-
      het vragen van toestemming, gelet op de aard en het doel van het onderzoek, in redelijkheid niet kan worden
      verlangd en de gegevens in zodanige vorm worden verstrekt dat herleiding tot individuele natuurlijke personen
      redelijkerwijs wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.6
  - number: 5.3.6.2
    text: 'Verstrekking overeenkomstig het eerste lid is slechts mogelijk indien:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.6
  - number: 5.3.6.2.a
    text: het onderzoek een algemeen belang dient,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.6
  - number: 5.3.6.2.b
    text: het onderzoek niet zonder de desbetreffende gegevens kan worden uitgevoerd, en
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.6
  - number: 5.3.6.2.c
    text: voor zover de betrokkene tegen een verstrekking niet uitdrukkelijk bezwaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.6
  - number: 5.3.6.3
    text: Bij een verstrekking overeenkomstig het eerste lid wordt daarvan aantekening gehouden in het dossier.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.3.6
  - number: 5.4.1.1
    text: |-
      Het college stemt de wijze waarop het de taken op grond van deze wet uitvoert af met zorgverzekeraars als bedoeld
      in de [Zorgverzekeringswet][ref1], met het oog op de wettelijke taken van die laatsten.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.4.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 5.4.1.2
    text: |-
      Het college en zorgverzekeraars maken afspraken over beleid ten aanzien van maatschappelijke ondersteuning,
      publieke gezondheid, zorg, jeugdzorg, welzijn en preventie, teneinde te komen tot een integrale dienstverlening aan
      cliënten en verzekerden.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.4.1
  - number: 5.4.1.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de wijze van totstandkoming van de
      afspraken, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.4.1
  - number: 5.4.1.4
    text: |-
      Het college en aanbieders verstrekken aan zorgverzekeraars als bedoeld in de [Zorgverzekeringswet][ref1] uit eigen
      beweging en desgevraagd kosteloos de gegevens die noodzakelijk zijn voor de uitvoering van de afspraken, bedoeld in
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.4.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 5.4.1.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat overleg omtrent afspraken, bedoeld in het
      tweede lid, ook plaatsvindt met andere organisaties en instanties dan genoemd in het eerste lid, en kan worden
      bepaald dat het vierde lid ook van toepassing is ten aanzien van die organisaties en instanties.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.4.1
  - number: 5.4.1.6
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de inhoud van de in het vierde lid bedoelde
      gegevens en standaardisering van de wijze waarop de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.4.1
  - number: 6.1.1
    text: |-
      Het college wijst personen aan die belast zijn met het houden van toezicht op de naleving van het bepaalde bij of
      krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel6.1
  - number: 6.1.2
    text: |-
      De toezichthoudende ambtenaren zijn, voor zover dat voor de vervulling van hun taak noodzakelijk is en in afwijking
      van [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref1], bevoegd tot inzage van dossiers.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 6.1.3
    text: |-
      Voor zover de toezichthoudende ambtenaar door inzage in bescheiden bij de vervulling van zijn taak dan wel door
      verstrekking van gegevens in het kader een melding als bedoeld in [artikel 3.4][ref1], gegevens, daaronder begrepen
      bijzondere persoonsgegevens, heeft verkregen, ter zake waarvan de beroepskracht uit hoofde van zijn beroep tot
      geheimhouding verplicht is, geldt gelijke verplichting voor de toezichthoudende ambtenaar, onverminderd het
      bepaalde in [artikel 5.2.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel5
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 6.2.1
    text: |-
      De ambtenaren van de Inspectie gezondheidszorg en jeugd dienen de toezichthoudende ambtenaren, bedoeld in
      [artikel 6.1][ref1], desgevraagd van advies inzake het houden van toezicht en inzake de handhaving van de bij of
      krachtens deze wet gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel6
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.2
    text: |-
      De in het eerste lid bedoelde ambtenaren rapporteren jaarlijks aan Onze Minister omtrent de uitvoering van het
      toezicht op de naleving van het bepaalde bij of krachtens deze wet door de toezichthoudende ambtenaren, bedoeld in
      [artikel 6.1][ref1], en de effecten daarvan op het niveau van de maatschappelijke ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel6
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel6.2
    references:
