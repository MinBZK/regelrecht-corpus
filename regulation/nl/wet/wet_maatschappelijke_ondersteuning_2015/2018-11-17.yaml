  - number: 8.7.2
    text: |-
      Het college treft de algemene voorzieningen als bedoeld in de [artikelen 2.2.3 tot en met 2.2.4][ref1] voor
      1 november van het kalenderjaar waarin enig artikel van deze wet in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.7
    references:
