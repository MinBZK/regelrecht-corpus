        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 8.7.3
    text: |-
      Het college draagt er zorg voor dat onderzoeken als bedoeld in [artikel 2.3.2][ref1] kunnen worden uitgevoerd
      met ingang van 1 november van het kalenderjaar waarin enig artikel van deze wet in werking is getreden en dat op
      aanvragen voor een maatwerkvoorziening of een persoonsgebonden budget die worden gedaan voor de eerste dag van het
      kalenderjaar na dat waarin enig artikel van deze wet in werking is getreden, tijdig een besluit wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 8.7.4
    text: |-
      Het college publiceert voor het eerst voor 1 juli van het tweede kalenderjaar na dat waarin enig artikel van
      deze wet in werking is getreden, de uitkomsten van het in [artikel 2.5.1, eerste lid][ref1], bedoelde onderzoek
      en verstrekt gelijktijdig de in artikel 2.5.1, tweede lid, bedoelde gegevens aan Onze Minister of een door Onze
      Minister aangewezen instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.7
