        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.3.4.3
    text: |-
      Een gedraging in strijd met [artikel 4.2.5][ref1] is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.3.4
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.3.4.4
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft degene die een
      strafbaar feit pleegt als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.3.4
  - number: 4.3.4.5
    text: Een strafbaar feit als bedoeld in het derde lid is een overtreding.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.3.4
  - number: 5.1.1.1
    text: |-
      Het college is bevoegd tot het verwerken van persoonsgegevens van de cliënt, waaronder gegevens over gezondheid die
      noodzakelijk zijn voor de beoordeling van diens behoefte aan ondersteuning van zijn participatie of zelfredzaamheid
      dan wel opvang of beschermd wonen, alsmede persoonsgegevens van diens echtgenoot, ouders, inwonende kinderen
      en andere huisgenoten die noodzakelijk zijn om vast te stellen welke hulp deze aan de cliënt bieden of kunnen
      bieden, voor zover deze zijn verkregen in het kader van het onderzoek, bedoeld in [artikel 2.3.2][ref1], dan wel
      op grond van [artikel 2.3.8][ref2], [5.2.2][ref3], [5.2.3][ref4], [5.2.4][ref5] of [5.2.5][ref6], en noodzakelijk
      zijn voor de uitvoering van [artikel 2.1.4][ref7], [2.1.5][ref8], [2.3.2][ref9], [2.3.3][ref10], [2.3.5][ref11],
      [2.3.6][ref12], [2.3.9][ref13], [2.3.10][ref14], [2.4.1][ref15] of [2.4.3][ref16].


