  - number: 1.1.1.2
    text: |-
      Personen of rechtspersonen die als vertegenwoordiger als bedoeld in het eerste lid kunnen optreden zijn de curator,
      de mentor of de gevolmachtigde van de cliënt, dan wel, indien zodanige persoon of rechtspersoon ontbreekt, diens
      echtgenoot, de geregistreerde partner of andere levensgezel van de cliënt, tenzij deze persoon dat niet wenst, dan
      wel, indien ook zodanige persoon ontbreekt, diens ouder, kind, broer of zus, tenzij deze persoon dat niet wenst.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.1.1
  - number: 1.1.2.1
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.1.2
  - number: 1.1.2.1.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.1.2
  - number: 1.1.2.1.b
    text: 'gehuwd: als partner geregistreerd.'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.1.2
  - number: 1.1.2.2
    text: 'Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.1.2
  - number: 1.1.2.2.a
    text: |-
      als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde meerderjarige
      een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.1.2
  - number: 1.1.2.2.b
    text: als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.1.2
  - number: 1.1.2.3
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.1.2
  - number: 1.1.2.4
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben in
      dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.1.2
  - number: 1.1.2.4.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.1.2
  - number: 1.1.2.4.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.1.2
  - number: 1.1.2.4.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract, of
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.1.2
  - number: 1.1.2.4.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.1.2
  - number: 1.1.2.5
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vierde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.1.2
  - number: 1.1.2.6
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.1.2
  - number: 1.2.1
    text: |-
      Een ingezetene van Nederland komt overeenkomstig de bepalingen van deze wet in aanmerking voor een
      maatwerkvoorziening, bestaande uit:
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.2.1
  - number: 1.2.1.a
    text: |-
      door het college van de gemeente waarvan hij ingezetene is, te verstrekken ondersteuning van zijn zelfredzaamheid
      en participatie, voor zover hij in verband met een beperking, chronische psychische of psychosociale problemen niet
      op eigen kracht, met gebruikelijke hulp, met mantelzorg of met hulp van andere personen uit zijn sociale netwerk
      voldoende zelfredzaam is of in staat is tot participatie,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.2.1
  - number: 1.2.1.b
    text: |-
      beschermd wonen, te verstrekken door het college van de gemeente tot welke hij zich wendt, voor zover hij in
      verband met psychische of psychosociale problemen niet in staat is zich op eigen kracht, met gebruikelijke hulp,
      met mantelzorg of met hulp van andere personen uit zijn sociale netwerk te handhaven in de samenleving, dan wel
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.2.1
  - number: 1.2.1.c
    text: |-
      opvang, te verstrekken door het college van de gemeente tot welke hij zich wendt, indien hij de thuissituatie
      heeft verlaten, al dan niet in verband met risico’s voor zijn veiligheid als gevolg van huiselijk geweld, en niet
      in staat is zich op eigen kracht, met gebruikelijke hulp, met mantelzorg of met hulp van andere personen uit zijn
      sociale netwerk te handhaven in de samenleving.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.2.1
  - number: 1.2.2.1
    text: |-
      Een vreemdeling komt voor het verstrekken van een maatwerkvoorziening slechts in aanmerking indien hij rechtmatig
      verblijf houdt in de zin van [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 1.2.2.2
    text: |-
      Een vreemdeling komt in afwijking van het eerste lid niet in aanmerking voor een maatwerkvoorziening bestaande uit
      opvang in de gevallen, bedoeld in artikel 24, tweede lid, van [Richtlijn 2004/38/EG](32004L0038). De eerste volzin
      is niet van toepassing op opvang in verband met risico’s voor de veiligheid van betrokkene als gevolg van huiselijk
      geweld.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.2.2
  - number: 1.2.2.3
    text: |-
      In afwijking van het eerste of het tweede lid kan worden bepaald dat in bij of krachtens algemene maatregel van
      bestuur te noemen gevallen, zo nodig in afwijking van [artikel 10 van de Vreemdelingenwet 2000][ref1], bij of
      krachtens die maatregel aan te geven categorieën niet rechtmatig in Nederland verblijvende vreemdelingen, geheel of
      gedeeltelijk in aanmerking komen voor bij die maatregel aan te geven maatwerkvoorzieningen. Het in aanmerking komen
      voor een maatwerkvoorziening geeft een vreemdeling geen recht op rechtmatig verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel10
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '10'
  - number: 1.2.2.4
    text: |-
      In de in het derde lid genoemde maatregel kan worden bepaald dat het college zorg draagt voor het verstrekken van
      bij die maatregel aangewezen voorzieningen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel1.2.2
  - number: 2.1.1.1
    text: Het gemeentebestuur draagt zorg voor de maatschappelijke ondersteuning.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.1
  - number: 2.1.1.2
    text: Het gemeentebestuur draagt zorg voor de kwaliteit en de continuïteit van de voorzieningen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.1
  - number: 2.1.2.1
    text: |-
      De gemeenteraad stelt periodiek een plan vast met betrekking tot het door het gemeentebestuur te voeren beleid met
      betrekking tot maatschappelijke ondersteuning.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.2
    text: |-
      Het plan beschrijft de beleidsvoornemens inzake door het college te nemen besluiten of te verrichten handelingen
      die erop gericht zijn:
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.2.a
    text: |-
      de sociale samenhang, de toegankelijkheid van voorzieningen, diensten en ruimten voor mensen met een beperking te
      bevorderen, de veiligheid en leefbaarheid in de gemeente te bevorderen, alsmede huiselijk geweld te voorkomen en
      te bestrijden;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.2.b
    text: |-
      de verschillende categorieën van mantelzorgers, en vrijwilligers, zoveel mogelijk in staat te stellen hun taken als
      mantelzorger of vrijwilliger uit te voeren;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.2.c
    text: vroegtijdig vast te stellen of ingezetenen maatschappelijke ondersteuning behoeven;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.2.d
    text: te voorkomen dat ingezetenen op maatschappelijke ondersteuning aangewezen zullen zijn;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.2.e
    text: algemene voorzieningen te bieden aan ingezetenen die maatschappelijke ondersteuning behoeven;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.2.f
    text: |-
      maatwerkvoorzieningen te bieden ter ondersteuning van de zelfredzaamheid en participatie aan ingezetenen van de
      gemeente die daartoe op eigen kracht, met gebruikelijke hulp, met mantelzorg of met hulp van andere personen uit
      hun sociale netwerk niet of onvoldoende in staat zijn;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.2.g
    text: |-
      maatwerkvoorzieningen te bieden aan personen die niet in staat zijn zich op eigen kracht te handhaven in de
      samenleving en beschermd wonen of opvang behoeven in verband met psychische of psychosociale problemen of omdat zij
      de thuissituatie hebben verlaten, al dan niet in verband met risico’s voor hun veiligheid als gevolg van huiselijk
      geweld;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.2.h
    text: |-
      uitvoering te geven aan het op 13 december 2006 te New York tot stand gekomen Verdrag inzake de rechten van
      personen met een handicap (Trb. 2007, 169).
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.3
    text: 'Het plan is erop gericht dat:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.3.a
    text: cliënten zo lang mogelijk in de eigen leefomgeving kunnen blijven;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.3.b
    text: |-
      cliënten die beschermd wonen of opvang ontvangen, een veilige woonomgeving hebben en, indien mogelijk, weer in
      staat zijn zich op eigen kracht te handhaven in de samenleving.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.4
    text: 'In het plan wordt bijzondere aandacht gegeven aan:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.4.a
    text: |-
      een zo integraal mogelijke dienstverlening op het gebied van maatschappelijke ondersteuning, publieke gezondheid,
      preventie, zorg, jeugdhulp, onderwijs, welzijn, wonen, werk en inkomen;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.4.b
    text: |-
      de samenwerking met zorgverzekeraars en zorgaanbieders als bedoeld in de [Zorgverzekeringswet][ref1] met het oog op
      een zo integraal mogelijke dienstverlening;


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 2.1.2.4.c
    text: |-
      keuzemogelijkheden tussen aanbieders voor degenen aan wie een maatwerkvoorziening wordt verstrekt, waarbij rekening
      wordt gehouden met de godsdienstige gezindheid, de levensovertuiging en de culturele achtergrond van cliënten, in
      het bijzonder voor kleine doelgroepen;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.4.d
    text: de toegankelijkheid van voorzieningen, diensten en ruimten voor mensen met een beperking;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.4.e
    text: |-
      de wijze waarop de continuïteit van hulp wordt gewaarborgd, in het bijzonder ten aanzien van de persoon die door
      het bereiken van een bepaalde leeftijd geen jeugdhulp als bedoeld in de [Jeugdwet][ref1] meer kan ontvangen;


      [ref1]: https://wetten.overheid.nl/BWBR0034925
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
  - number: 2.1.2.4.f
    text: |-
      mogelijkheden om met inzet van begeleiding, waaronder dagbesteding, mensen zo lang mogelijk in de eigen
      leefomgeving te laten blijven;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.4.g
    text: |-
      de wijze waarop ingezetenen worden geïnformeerd over de personen die kunnen optreden als vertegenwoordiger van een
      cliënt die niet in staat kan worden geacht tot een redelijke waardering van zijn belangen ter zake.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.2.5
    text: |-
      In het plan wordt aangegeven op welke wijze de gemeente [artikel 2.1.7][ref1] toepast dan wel de reden om dat
      artikel niet toe te passen.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.1.2.6
    text: |-
      In het plan wordt aangegeven welke resultaten het gemeentebestuur in de door het plan bestreken periode wenst
      te behalen, welke criteria worden gehanteerd om te meten hoe deze resultaten zijn behaald en welke prestatie-
      indicatoren worden gehanteerd ten aanzien van aanbieders.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.2
  - number: 2.1.3.1
    text: |-
      De gemeenteraad stelt bij verordening de regels vast die noodzakelijk zijn voor de uitvoering van het in
      [artikel 2.1.2][ref1] bedoelde plan en de door het college ter uitvoering daarvan te nemen besluiten of te
      verrichten handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.1.3.2
    text: 'In de verordening wordt in ieder geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.3
  - number: 2.1.3.2.a
    text: |-
      op welke wijze en op basis van welke criteria wordt vastgesteld of een cliënt voor een maatwerkvoorziening voor
      zelfredzaamheid, participatie, beschermd wonen of opvang in aanmerking komt;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.3
  - number: 2.1.3.2.b
    text: |-
      op welke wijze de hoogte van een persoonsgebonden budget wordt vastgesteld waarbij geldt dat de hoogte toereikend
      moet zijn;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.3
  - number: 2.1.3.2.c
    text: |-
      welke eisen worden gesteld aan de kwaliteit van voorzieningen, eisen met betrekking tot de deskundigheid van
      beroepskrachten daaronder begrepen;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.3
  - number: 2.1.3.2.d
    text: ten aanzien van welke voorzieningen een regeling voor de afhandeling van klachten van cliënten vereist is;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.3
  - number: 2.1.3.2.e
    text: |-
      ten aanzien van welke voorzieningen een regeling voor medezeggenschap van cliënten over voorgenomen besluiten van
      de aanbieder die voor de gebruikers van belang zijn, vereist is.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.3
  - number: 2.1.3.3
    text: |-
      In de verordening wordt bepaald op welke wijze ingezetenen, waaronder in ieder geval cliënten of hun
      vertegenwoordigers, worden betrokken bij de uitvoering van deze wet, waarbij in ieder geval wordt geregeld de wijze
      waarop zij:
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.3
  - number: 2.1.3.3.a
    text: in de gelegenheid worden gesteld voorstellen voor het beleid te doen;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.3
  - number: 2.1.3.3.b
    text: |-
      vroegtijdig in staat worden gesteld gevraagd en ongevraagd advies uit te brengen bij de besluitvorming over
      verordeningen en beleidsvoorstellen;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.3
  - number: 2.1.3.3.c
    text: worden voorzien van ondersteuning om hun rol effectief te kunnen vervullen;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.3
  - number: 2.1.3.3.d
    text: deel kunnen nemen aan periodiek overleg;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.3
  - number: 2.1.3.3.e
    text: onderwerpen voor de agenda van dit overleg kunnen aanmelden;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.3
  - number: 2.1.3.3.f
    text: worden voorzien van de voor een adequate deelname aan het overleg benodigde informatie.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.3
  - number: 2.1.3.4
    text: |-
      In de verordening worden regels gesteld voor de bestrijding van het ten onrechte ontvangen van een
      maatwerkvoorziening of een persoonsgebonden budget, alsmede van misbruik of oneigenlijk gebruik van de wet.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.3
  - number: 2.1.4.1
    text: 'Bij verordening kan worden bepaald dat een cliënt een bijdrage in de kosten is verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.1.a
    text: voor het gebruik van een algemene voorziening, niet zijnde cliëntondersteuning;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.1.b
    text: voor een maatwerkvoorziening dan wel een persoonsgebonden budget.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.2
    text: |-
      In de verordening kan de hoogte van de bijdrage voor de verschillende soorten van voorzieningen verschillend worden
      vastgesteld en kan worden bepaald dat:
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.2.a
    text: |-
      voor personen, behorende tot daarbij omschreven groepen, een daarbij aangegeven korting op de bijdrage voor een
      algemene voorziening van toepassing is;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.2.b
    text: 'de bijdrage voor een maatwerkvoorziening dan wel een persoonsgebonden budget:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.2.b.1°
    text: |-
      verschuldigd is zolang de cliënt van de maatwerkvoorziening gebruik maakt onderscheidenlijk gedurende de periode
      waarvoor het persoonsgebonden budget wordt verstrekt, en
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.2.b.2°
    text: afhankelijk is van het inkomen en vermogen van de cliënt en zijn echtgenoot.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.3
    text: |-
      Het totaal van de bijdragen voor een maatwerkvoorziening dan wel een persoonsgebonden budget gaat de kostprijs niet
      te boven. In de verordening wordt bepaald op welke wijze de kostprijs wordt berekend.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de bijdragen voor een
      maatwerkvoorziening dan wel een persoonsgebonden budget, waaronder regels over:
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.4.a
    text: de hoogte,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.4.b
    text: de wijze waarop het inkomen en vermogen bij de vaststelling worden betrokken,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.4.c
    text: de termijn waarbinnen de verschuldigde bijdrage moet zijn voldaan,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.4.d
    text: de wijze van invordering, en
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.4.e
    text: de uitzonderingsgronden voor het verschuldigd zijn van een bijdrage.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.5
    text: |-
      De voordracht voor een algemene maatregel van bestuur als bedoeld in het vierde lid, die betrekking heeft op het
      in het tweede lid bedoelde vermogen, wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers
      der Staten-Generaal is overgelegd. Indien een der kamers der Staten-Generaal besluit niet in te stemmen met het
      ontwerp, wordt er geen voordracht gedaan en kan niet eerder dan zes weken na het besluit van die kamer der Staten-
      Generaal een nieuw ontwerp aan beide kamers der Staten-Generaal worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.6
    text: |-
      De bijdrage voor een maatwerkvoorziening dan wel een persoonsgebonden budget wordt, met uitzondering van die voor
      opvang, vastgesteld en voor de gemeente geïnd door het CAK.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.4.7
    text: |-
      In de verordening wordt bepaald door welke instantie de bijdrage voor een maatwerkvoorziening dan wel een
      persoonsgebonden budget voor opvang wordt vastgesteld en geïnd. Het college draagt er zorg voor dat aan het
      CAK mededeling wordt gedaan van de bijdragen die door de bedoelde instantie zijn vastgesteld, voor zover niet
      betrekking hebbende op personen die de thuissituatie hebben verlaten in verband met risico’s voor hun veiligheid
      als gevolg van huiselijk geweld.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.4
  - number: 2.1.5.1
    text: |-
      Indien een maatwerkvoorziening of een persoonsgebonden budget wordt verstrekt ten behoeve van een woningaanpassing
      voor een minderjarige cliënt, kan bij verordening worden bepaald dat de in [artikel 2.1.4][ref1] bedoelde bijdrage
      is verschuldigd door:


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.5
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.1.5.1.a
    text: |-
      de onderhoudsplichtige ouders, daaronder begrepen degene tegen wie een op
      [artikel 394 van Boek 1 van het Burgerlijk Wetboek][ref1] gegrond verzoek is toegewezen, en


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel394
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.5
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '394'
  - number: 2.1.5.1.b
    text: degene die anders dan als ouder samen met de ouder het gezag uitoefent over een cliënt.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.5
  - number: 2.1.5.2
    text: |-
      Indien bijdrageplichtige ouders of stiefouders gescheiden wonen en geen bedrag is bepaald op de
      voet van de [artikelen 406][ref1] of [407 van het Boek 1 van het Burgerlijk Wetboek][ref2] of van
      [artikel 822, eerste lid, onderdeel c, van het Wetboek van Burgerlijke Rechtsvordering][ref3], is de ouder of
      stiefouder die ingevolge de [Algemene Kinderbijslagwet][ref4] onmiddellijk voorafgaande aan de verstrekking van de
      maatwerkvoorziening of het persoonsgebonden budget recht op kinderbijslag heeft, de bijdrage verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel406
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel407
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel822
      [ref4]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.5
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '406'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '407'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '822'
      - id: ref4
        bwb_id: BWBR0002368
  - number: 2.1.5.3
    text: |-
      In afwijking van het eerste lid is in ieder geval geen bijdrage verschuldigd indien de ouders van het gezag over de
      cliënt zijn ontheven of ontzet.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.5
  - number: 2.1.5.4
    text: |-
      Indien meer dan één persoon een bijdrage is verschuldigd, is ieder der bijdrageplichtigen de bijdrage verschuldigd,
      met dien verstande dat indien de een heeft betaald, de ander is bevrijd.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.5
  - number: 2.1.6
    text: |-
      Bij verordening wordt bepaald op welke wijze het college zorg draagt voor een jaarlijkse blijk van waardering voor
      de mantelzorgers van cliënten in de gemeente.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.6
  - number: 2.1.7
    text: |-
      Bij verordening kan worden bepaald dat door het college aan personen met een beperking of chronische psychische
      of psychosociale problemen die daarmee verband houdende aannemelijke meerkosten hebben, een tegemoetkoming wordt
      verstrekt ter ondersteuning van de zelfredzaamheid en de participatie.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.1.7
  - number: 2.2.1
    text: |-
      Het college bevordert en treft de algemene maatregelen om de sociale samenhang, de toegankelijkheid van
      voorzieningen, diensten en ruimten voor mensen met een beperking, de veiligheid en leefbaarheid in de gemeente te
      bevorderen, alsmede huiselijk geweld te voorkomen en te bestrijden, die noodzakelijk zijn ter uitvoering van het
      plan, bedoeld in [artikel 2.1.2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.2.1
    text: |-
      Het college bevordert en treft de algemene maatregelen ter bevordering van mantelzorg en vrijwilligerswerk en ter
      ondersteuning van mantelzorgers en vrijwilligers, die noodzakelijk zijn ter uitvoering van het plan, bedoeld in
      [artikel 2.1.2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.2.2
    text: |-
      Het college bevordert en treft voorts de algemene voorzieningen die ter uitvoering van het plan, bedoeld in
      [artikel 2.1.2, tweede lid][ref1], noodzakelijk zijn om de onderscheiden categorieën van mantelzorgers en
      vrijwilligers zoveel mogelijk in staat te stellen hun taken als mantelzorger en vrijwilliger uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.3
    text: |-
      Het college bevordert en treft de algemene voorzieningen ter bevordering van de zelfredzaamheid,
      participatie, beschermd wonen en opvang, die noodzakelijk zijn ter uitvoering van het plan, bedoeld in
      [artikel 2.1.2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.4.1
    text: 'Het college draagt er in ieder geval zorg voor dat voor ingezetenen:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.2.4
  - number: 2.2.4.1.a
    text: cliëntondersteuning beschikbaar is en
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.2.4
  - number: 2.2.4.1.b
    text: op ieder moment van de dag telefonisch of elektronisch anoniem een luisterend oor en advies beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.2.4
  - number: 2.2.4.2
    text: |-
      Het college draagt er zorg voor dat bij de in het eerste lid bedoelde maatschappelijke ondersteuning het belang van
      betrokkene uitgangspunt is.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.2.4
  - number: 2.3.1
    text: |-
      Het college draagt er zorg voor dat aan personen die daarvoor in aanmerking komen, een maatwerkvoorziening wordt
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.1
  - number: 2.3.2.1
    text: |-
      Indien bij het college melding wordt gedaan van een behoefte aan maatschappelijke ondersteuning, voert het
      college in samenspraak met degene door of namens wie de melding is gedaan en waar mogelijk met de mantelzorger of
      mantelzorgers dan wel diens vertegenwoordiger, zo spoedig mogelijk, doch uiterlijk binnen zes weken, een onderzoek
      uit overeenkomstig het tweede tot en met achtste lid. Het college bevestigt de ontvangst van de melding.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.2
  - number: 2.3.2.2
    text: |-
      Voordat het onderzoek van start gaat, kan de cliënt het college een persoonlijk plan overhandigen waarin hij de
      omstandigheden, bedoeld in het vierde lid, onderdelen a tot en met g, beschrijft en aangeeft welke maatschappelijke
      ondersteuning naar zijn mening het meest is aangewezen. Het college brengt de cliënt van deze mogelijkheid op de
      hoogte en stelt hem gedurende zeven dagen na de melding, bedoeld in het eerste lid, in de gelegenheid het plan
      te overhandigen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.2
  - number: 2.3.2.3
    text: |-
      Het college wijst de cliënt en zijn mantelzorger voor het onderzoek op de mogelijkheid gebruik te maken van gratis
      cliëntondersteuning.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.2
  - number: 2.3.2.4
    text: 'Het college onderzoekt:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.2
  - number: 2.3.2.4.a
    text: de behoeften, persoonskenmerken en de voorkeuren van de cliënt;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.2
  - number: 2.3.2.4.b
    text: |-
      de mogelijkheden om op eigen kracht of met gebruikelijke hulp zijn zelfredzaamheid of zijn participatie te
      verbeteren of te voorzien in zijn behoefte aan beschermd wonen of opvang;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.2
  - number: 2.3.2.4.c
    text: |-
      de mogelijkheden om met mantelzorg of hulp van andere personen uit zijn sociale netwerk te komen tot verbetering
      van zijn zelfredzaamheid of zijn participatie of te voorzien in zijn behoefte aan beschermd wonen of opvang;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.2
  - number: 2.3.2.4.d
    text: de behoefte aan maatregelen ter ondersteuning van de mantelzorger van de cliënt;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.2
  - number: 2.3.2.4.e
    text: |-
      de mogelijkheden om met gebruikmaking van een algemene voorziening of door het verrichten van maatschappelijk
      nuttige activiteiten te komen tot verbetering van zijn zelfredzaamheid of zijn participatie, onderscheidenlijk de
      mogelijkheden om met gebruikmaking van een algemene voorziening te voorzien in zijn behoefte aan beschermd wonen
      of opvang;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.2
  - number: 2.3.2.4.f
    text: |-
      de mogelijkheden om door middel van samenwerking met zorgverzekeraars en zorgaanbieders als bedoeld in de
      [Zorgverzekeringswet][ref1] en partijen op het gebied van publieke gezondheid, jeugdhulp, onderwijs, welzijn,
      wonen, werk en inkomen, te komen tot een zo goed mogelijk afgestemde dienstverlening met het oog op de behoefte aan
      verbetering van zijn zelfredzaamheid, zijn participatie of aan beschermd wonen of opvang;


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 2.3.2.4.g
    text: |-
      welke bijdragen in de kosten de cliënt met toepassing van het bepaalde bij of krachtens [artikel 2.1.4][ref1],
      verschuldigd zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.3.2.5
    text: |-
      Indien de cliënt een persoonlijk plan als bedoeld in het tweede lid aan het college heeft overhandigd, betrekt het
      college dat plan bij het onderzoek als bedoeld in het vierde lid, onderdelen a tot en met g.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.2
  - number: 2.3.2.6
    text: |-
      Bij het onderzoek wordt aan de cliënt dan wel diens vertegenwoordiger medegedeeld welke mogelijkheden bestaan om
      te kiezen voor de verstrekking van een persoonsgebonden budget. De cliënt dan wel diens vertegenwoordiger wordt in
      begrijpelijke bewoordingen ingelicht over de gevolgen van die keuze.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.2
  - number: 2.3.2.7
    text: |-
      De cliënt dan wel diens vertegenwoordiger verschaft het college de gegevens en bescheiden die voor het onderzoek
      nodig zijn en waarover hij redelijkerwijs de beschikking kan krijgen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.2
  - number: 2.3.2.8
    text: |-
      Het college verstrekt de cliënt dan wel diens vertegenwoordiger een schriftelijke weergave van de uitkomsten van
      het onderzoek.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.2
  - number: 2.3.2.9
    text: |-
      Een aanvraag als bedoeld in [artikel 2.3.5][ref1] kan niet worden gedaan dan nadat het onderzoek is uitgevoerd,
      tenzij het onderzoek niet is uitgevoerd binnen de in het eerste lid genoemde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.3.3
    text: |-
      In spoedeisende gevallen, daaronder begrepen de gevallen waarin terstond opvang noodzakelijk is, al dan niet in
      verband met risico’s voor de veiligheid als gevolg van huiselijk geweld, beslist het college na een melding als
      bedoeld in [artikel 2.3.2, eerste lid][ref1], onverwijld tot verstrekking van een tijdelijke maatwerkvoorziening in
      afwachting van de uitkomst van het onderzoek, bedoeld in artikel 2.3.2 en de aanvraag van de cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.3.4.1
    text: |-
      Bij het onderzoek, bedoeld in [artikel 2.3.2, vierde lid][ref1], stelt het college de identiteit van de cliënt vast
      aan de hand van een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 2.3.4.2
    text: |-
      De cliënt die een aanvraag doet voor een maatwerkvoorziening, verstrekt het college desgevraagd terstond een
      document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] ter inzage.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 2.3.5.1
    text: 'Het college beslist op een aanvraag:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
  - number: 2.3.5.1.a
    text: van een ingezetene van de gemeente om een maatwerkvoorziening ten behoeve van zelfredzaamheid en participatie;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
  - number: 2.3.5.1.b
    text: van een ingezetene van Nederland om een maatwerkvoorziening ten behoeve van opvang en beschermd wonen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
  - number: 2.3.5.2
    text: Het college geeft de beschikking binnen twee weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
  - number: 2.3.5.3
    text: |-
      Het college beslist tot verstrekking van een maatwerkvoorziening ter compensatie van de beperkingen in de
      zelfredzaamheid of participatie die de cliënt ondervindt, voor zover de cliënt deze beperkingen naar het oordeel
      van het college niet op eigen kracht, met gebruikelijke hulp, met mantelzorg of met hulp van andere personen
      uit zijn sociale netwerk dan wel met gebruikmaking van algemene voorzieningen kan verminderen of wegnemen.
      De maatwerkvoorziening levert, rekening houdend met de uitkomsten van het in [artikel 2.3.2][ref1] bedoelde
      onderzoek, een passende bijdrage aan het realiseren van een situatie waarin de cliënt in staat wordt gesteld tot
      zelfredzaamheid of participatie en zo lang mogelijk in de eigen leefomgeving kan blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.3.5.4
    text: |-
      Het college beslist tot verstrekking van een maatwerkvoorziening ter compensatie van de problemen bij het
      zich handhaven in de samenleving van de cliënt met psychische of psychosociale problemen en de cliënt die
      de thuissituatie heeft verlaten, al dan niet in verband met risico’s voor zijn veiligheid als gevolg van
      huiselijk geweld, voor zover de cliënt deze problemen naar het oordeel van het college niet op eigen kracht,
      met gebruikelijke hulp, met mantelzorg of met hulp van andere personen uit zijn sociale netwerk dan wel met
      gebruikmaking van algemene voorzieningen kan verminderen of wegnemen. De maatwerkvoorziening levert, rekening
      houdend met de uitkomsten van het in [artikel 2.3.2][ref1] bedoelde onderzoek, een passende bijdrage aan het
      voorzien in de behoefte van de cliënt aan beschermd wonen of opvang en aan het realiseren van een situatie waarin
      de cliënt in staat wordt gesteld zich zo snel mogelijk weer op eigen kracht te handhaven in de samenleving.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.3.5.5
    text: 'De maatwerkvoorziening is, voor zover daartoe aanleiding bestaat, afgestemd op:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
  - number: 2.3.5.5.a
    text: de omstandigheden en mogelijkheden van de cliënt,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
  - number: 2.3.5.5.b
    text: |-
      zorg en overige diensten als bedoeld bij of krachtens de [Zorgverzekeringswet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 2.3.5.5.c
    text: |-
      jeugdhulp als bedoeld in de [Jeugdwet][ref1] die de cliënt ontvangt of kan ontvangen,


      [ref1]: https://wetten.overheid.nl/BWBR0034925
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
  - number: 2.3.5.5.d
    text: onderwijs dat de cliënt volgt dan wel zou kunnen volgen,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
  - number: 2.3.5.5.e
    text: betaalde werkzaamheden,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
  - number: 2.3.5.5.f
    text: scholing die de cliënt volgt of kan volgen,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
  - number: 2.3.5.5.g
    text: |-
      ondersteuning ingevolge de [Participatiewet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 2.3.5.5.h
    text: de godsdienstige gezindheid, de levensovertuiging en de culturele achtergrond van de cliënt.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
  - number: 2.3.5.6
    text: |-
      Het college kan een maatwerkvoorziening weigeren indien de cliënt aanspraak heeft op verblijf en daarmee
      samenhangende zorg in een instelling op grond van de [Wet langdurige zorg][ref1], dan wel er redenen zijn om aan
      te nemen dat de cliënt daarop aanspraak kan doen gelden en weigert mee te werken aan het verkrijgen van een besluit
      dienaangaande.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: 2.3.5.7
    text: |-
      Het zesde lid geldt niet voor verzekerden als bedoeld in
      [artikel 11.1.1, derde lid, van de Wet langdurige zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel11
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '11'
  - number: 2.3.6.1
    text: |-
      Indien de cliënt dit wenst, verstrekt het college hem een persoonsgebonden budget dat de cliënt in staat stelt de
      diensten, hulpmiddelen, woningaanpassingen en andere maatregelen die tot de maatwerkvoorziening behoren, van derden
      te betrekken.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.6
  - number: 2.3.6.2
    text: 'Een persoonsgebonden budget wordt verstrekt, indien:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.6
  - number: 2.3.6.2.a
    text: |-
      de cliënt naar het oordeel van het college op eigen kracht voldoende in staat is te achten tot een redelijke
      waardering van zijn belangen ter zake dan wel met hulp uit zijn sociale netwerk of van zijn vertegenwoordiger, in
      staat is te achten de aan een persoonsgebonden budget verbonden taken op verantwoorde wijze uit te voeren;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.6
  - number: 2.3.6.2.b
    text: |-
      de cliënt zich gemotiveerd op het standpunt stelt dat hij de maatwerkvoorziening als persoonsgebonden budget wenst
      geleverd te krijgen;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.6
  - number: 2.3.6.2.c
    text: |-
      naar het oordeel van het college is gewaarborgd dat de diensten, hulpmiddelen, woningaanpassingen en andere
      maatregelen die tot de maatwerkvoorziening behoren, veilig, doeltreffend en cliëntgericht worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.6
  - number: 2.3.6.3
    text: |-
      Bij het beoordelen van de kwaliteit als bedoeld in het tweede lid, onder c, weegt het college mee of de diensten,
      hulpmiddelen, woningaanpassingen en andere maatregelen in redelijkheid geschikt zijn voor het doel waarvoor het
      persoonsgebonden budget wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.6
  - number: 2.3.6.4
    text: |-
      Bij verordening kan worden bepaald onder welke voorwaarden betreffende het tarief, de persoon aan wie een
      persoonsgebonden budget wordt verstrekt, de mogelijkheid heeft om diensten, hulpmiddelen, woningaanpassingen en
      andere maatregelen te betrekken van een persoon die behoort tot het sociale netwerk.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.6
  - number: 2.3.6.5
    text: 'Het college kan een persoonsgebonden budget weigeren:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.6
  - number: 2.3.6.5.a
    text: |-
      voor zover de kosten van het betrekken van de diensten, hulpmiddelen, woningaanpassingen en andere maatregelen van
      derden hoger zijn dan de kosten van de maatwerkvoorziening of;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.6
  - number: 2.3.6.5.b
    text: |-
      indien het college eerder toepassing heeft gegeven aan [artikel 2.3.10, eerste lid, onderdeel a, d en e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.6
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.3.6.6
    text: |-
      Op een persoonsgebonden budget is [titel 4.2 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 2.3.7.1
    text: |-
      Indien het college heeft beslist tot verstrekking van een maatwerkvoorziening in de vorm van een woningaanpassing
      aan een woning waarvan de cliënt niet de eigenaar is, dan wel een persoonsgebonden budget daarvoor, is het college
      dan wel de cliënt, bevoegd zonder toestemming van de eigenaar deze woningaanpassing aan te brengen of te doen
      aanbrengen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.7
  - number: 2.3.7.2
    text: |-
      Alvorens de woningaanpassing aan te brengen of te doen aanbrengen, stelt het college de eigenaar van de woning in
      de gelegenheid zich te doen horen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.7
  - number: 2.3.7.3
    text: |-
      Het college dan wel de cliënt is niet gehouden de woningaanpassing ongedaan te maken, indien de cliënt niet langer
      gebruik maakt van de woning.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.7
  - number: 2.3.8.1
    text: |-
      De cliënt doet aan het college op verzoek of onverwijld uit eigen beweging mededeling van alle feiten en
      omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij aanleiding kunnen zijn tot heroverweging van
      een beslissing als bedoeld in [artikel 2.3.5][ref1] of [2.3.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.8
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.3.8.2
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt niet indien die feiten en omstandigheden door het college kunnen
      worden vastgesteld op grond van bij wettelijk voorschrift als authentiek aangemerkte gegevens of kunnen worden
      verkregen uit bij regeling van Onze Minister aan te wijzen administraties.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.8
  - number: 2.3.8.3
    text: |-
      De cliënt is verplicht aan het college desgevraagd de medewerking te verlenen die redelijkerwijs nodig is voor de
      uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.8
  - number: 2.3.9.1
    text: |-
      Het college onderzoekt periodiek of er aanleiding is een beslissing als bedoeld in [artikel 2.3.5][ref1] of
      [2.3.6][ref2] te heroverwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.9
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.3.9.2
    text: |-
      [Artikel 2.3.2, tweede tot en met zesde lid][ref1], en [artikel 2.3.5, zesde lid][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.9
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.3.10.1
    text: |-
      Het college kan een beslissing als bedoeld in [artikel 2.3.5][ref1] of [2.3.6][ref2] herzien dan wel intrekken,
      indien het college vaststelt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.10
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.3.10.1.a
    text: |-
      de cliënt onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste of volledige gegevens tot
      een andere beslissing zou hebben geleid,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.10
  - number: 2.3.10.1.b
    text: de cliënt niet langer op de maatwerkvoorziening of het persoonsgebonden budget is aangewezen,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.10
  - number: 2.3.10.1.c
    text: de maatwerkvoorziening of het persoonsgebonden budget niet meer toereikend is te achten,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.10
  - number: 2.3.10.1.d
    text: de cliënt niet voldoet aan de aan de maatwerkvoorziening of het persoonsgebonden budget verbonden voorwaarden,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.10
  - number: 2.3.10.1.e
    text: de cliënt de maatwerkvoorziening of het persoonsgebonden budget niet of voor een ander doel gebruikt.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.10
  - number: 2.3.10.2
    text: |-
      Het college bepaalt in de beslissing, bedoeld in het eerste lid, het tijdstip waarop de beslissing in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.3.10
  - number: 2.4.1.1
    text: |-
      Indien het college een beslissing als bedoeld in [artikel 2.3.5][ref1] of [2.3.6][ref2] met toepassing van
      [artikel 2.3.10, onderdeel a][ref3], heeft ingetrokken en de verstrekking van de onjuiste of onvolledige
      gegevens door de cliënt opzettelijk heeft plaatsgevonden, kan het college van de cliënt en van degene die daaraan
      opzettelijk zijn medewerking heeft verleend, geheel of gedeeltelijk de geldswaarde vorderen van de ten onrechte
      genoten maatwerkvoorziening of het ten onrechte genoten persoonsgebonden budget.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.4.1.2
    text: Het college kan het terug te vorderen bedrag bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.4.1
  - number: 2.4.2
    text: |-
      Roerende zaken die aan de cliënt in gebruik zijn verstrekt als onderdeel van een maatwerkvoorziening dan wel zijn
      aangeschaft met een persoonsgebonden budget, zijn niet vatbaar voor vervreemding, verpanding, belening of beslag,
      gedurende de periode waarvoor de beslissing, bedoeld in [artikel 2.3.5][ref1] of [2.3.6][ref2], geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.4.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.4.3.1
    text: |-
      Behoudens toepassing van [artikel 2.4.4][ref1], heeft een gemeente voor de krachtens deze wet gemaakte kosten
      verhaal op degene, die jegens de cliënt naar burgerlijk recht tot schadevergoeding is verplicht in verband met het
      feit dat aanleiding heeft gegeven tot het verstrekken van een maatwerkvoorziening of een persoonsgebonden budget.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.4.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.4.3.2
    text: |-
      Het verhaal beloopt ten hoogste het bedrag, waarvoor aansprakelijke persoon bij het ontbreken van de
      maatwerkvoorziening of het persoonsgebonden budget naar burgerlijk recht aansprakelijk zou zijn, verminderd met een
      bedrag, gelijk aan dat van de schadevergoeding tot betaling waarvan de aansprakelijke persoon jegens de cliënt naar
      burgerlijk recht is gehouden.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.4.3
  - number: 2.4.3.3
    text: |-
      Voor zover de geldswaarde van de maatwerkvoorziening niet kan worden vastgesteld, wordt deze bepaald op een geschat
      bedrag. Bij regeling van Onze Minister kunnen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.4.3
  - number: 2.4.3.4
    text: |-
      Indien de cliënt in dienstbetrekking werkzaam is, gelden het eerste tot en met derde lid, ten aanzien van de naar
      burgerlijk recht tot schadevergoeding verplichte werkgever van de cliënt, onderscheidenlijk ten aanzien van de
      naar burgerlijk recht tot schadevergoeding verplichte persoon, die in dienstbetrekking staat tot dezelfde werkgever
      als de cliënt jegens wie naar burgerlijk recht de verplichting tot schadevergoeding bestaat, slechts indien het in
      het eerste lid bedoelde feit is te wijten aan opzet of bewuste roekeloosheid van die werkgever onderscheidenlijk
      persoon.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.4.3
  - number: 2.4.3.5
    text: |-
      Voor de toepassing van het vierde lid wordt mede als werkgever beschouwd de inlener, bedoeld in
      [artikel 34 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel34
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.4.3
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '34'
  - number: 2.4.4.1
    text: |-
      De Vereniging van Nederlandse Gemeenten kan met verzekeraars een overeenkomst sluiten inhoudende een door die
      verzekeraars te betalen afkoopsom voor de voor de komende periode ingevolge [artikel 2.4.3, eerste lid][ref1], te
      verwachten schadelast tengevolge van de schadeplichtigheid van hun verzekerden.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.4.4
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.4.4.2
    text: |-
      De overeenkomst heeft geen betrekking op de schadelast van een gemeente die voor de aanvang van de onderhandelingen
      over de bedoelde overeenkomst aan de Vereniging van Nederlandse Gemeenten te kennen heeft gegeven van haar
      bevoegdheid in het eerste lid gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.4.4
  - number: 2.4.4.3
    text: |-
      De Vereniging van Nederlandse Gemeenten stelt voor aanvang van de periode waarvoor een afkoopsom is overeengekomen,
      gemeenten op de hoogte van de totstandkoming van bedoelde overeenkomst.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.4.4
  - number: 2.5.1.1
    text: |-
      Het college onderzoekt hoe de cliënten de kwaliteit van de maatschappelijke ondersteuning ervaren en publiceert
      jaarlijks voor 1 juli de uitkomsten hiervan.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.5.1
  - number: 2.5.1.2
    text: |-
      Het college verstrekt jaarlijks voor 1 juli aan Onze Minister of een door Onze Minister aangewezen instelling de in
      het eerste lid omschreven gegevens.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.5.1
  - number: 2.5.1.3
    text: |-
      Onze Minister draagt er zorg voor dat op basis van de door de gemeente verstrekte gegevens voor 1 januari van het
      jaar volgend op het in het tweede lid bedoelde tijdstip een rapportage wordt opgesteld en gepubliceerd waarin de
      gegevens van de gemeenten worden vergeleken.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.5.1
  - number: 2.5.1.4
    text: |-
      Bij regeling van Onze Minister worden regels gesteld over de inrichting van het onderzoek, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.5.1
  - number: 2.5.2.1
    text: |-
      Het college verstrekt desgevraagd kosteloos aan Onze Minister de gegevens die hij nodig heeft om de werking van
      deze wet te kunnen beoordelen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.5.2
  - number: 2.5.2.2
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de te verstrekken gegevens, de wijze van
      verstrekking, de tijdvakken waarop de te verstrekken gegevens betrekking hebben en de tijdstippen waarop de
      verstrekking plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.5.2
  - number: 2.5.3
    text: |-
      Het college rapporteert jaarlijks aan de gemeenteraad welke resultaten in het voorafgaande jaar zijn behaald op
      basis van de in het plan, bedoeld in [artikel 2.1.2, zesde lid][ref1], gestelde resultaten en hierbij uitgaande van
      de in het plan aangegeven criteria om resultaten te meten en de ten aanzien van aanbieders gehanteerde prestatie-
      indicatoren.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.5.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.6.1
    text: |-
      De colleges werken met elkaar samen, indien dat voor een doeltreffende en doelmatige uitvoering van deze wet
      aangewezen is.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.1
  - number: 2.6.2.1
    text: |-
      De Sociale verzekeringsbank, genoemd in
      [artikel 3 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], voert namens de colleges de
      betalingen ten laste van verstrekte persoonsgebonden budgetten, alsmede het hiermee verbonden budgetbeheer, uit.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel3
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.2
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '3'
  - number: 2.6.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop de Sociale
      verzekeringsbank de taak, bedoeld in het eerste lid, uitvoert.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.2
  - number: 2.6.2.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de overeenkomst die de cliënt sluit met de derde van
      wie hij diensten, hulpmiddelen, woningaanpassingen of andere maatregelen die tot een maatwerkvoorziening behoren
      betrekt en die daarvoor betaling ontvangt uit het persoonsgebonden budget.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.2
  - number: 2.6.3
    text: Het college kan de vaststelling van rechten en plichten van de cliënt mandateren aan een aanbieder.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.3
  - number: 2.6.4.1
    text: |-
      Het college kan de uitvoering van deze wet, behoudens de vaststelling van de rechten en plichten van de cliënt,
      door derden laten verrichten.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.4
  - number: 2.6.4.2
    text: |-
      Indien de levering van een voorziening wordt aanbesteed, gunt het college de overheidsopdracht op grond van de
      naar zijn oordeel economisch meest voordelige inschrijving en maakt in de aankondiging van de overheidsopdracht
      bekend welke nadere criteria hij stelt met het oog op de toepassing van het criterium economisch meest voordelige
      inschrijving, waarbij in ieder geval het nadere criterium kwaliteit wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.4
  - number: 2.6.4.3
    text: |-
      In afwijking van [artikel 2.114, tweede lid, van de Aanbestedingswet 2012][ref1] kan het college een
      overheidsopdracht niet enkel op grond van het criterium de laagste prijs gunnen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.4
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
  - number: 2.6.5.1
    text: |-
      De aanbieder aan welke een overheidsopdracht voor het leveren van een voorziening wordt gegund, overlegt met de
      aanbieder of aanbieders die in opdracht van het college laatstelijk voor hem die voorziening leverden dan wel na
      hem gaan leveren, over de overname van het betrokken personeel.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.5
  - number: 2.6.5.2
    text: |-
      Het college houdt bij het verlenen van een overheidsopdracht voor het leveren van een maatwerkvoorziening rekening
      met de mate waarin de aanbieder zorg draagt voor continuïteit in de hulpverlening tussen degenen aan wie een
      maatwerkvoorziening wordt verstrekt en de betrokken hulpverleners. Bij of krachtens algemene maatregel van bestuur
      kunnen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.5
  - number: 2.6.5.3
    text: 'Het college ziet erop toe dat:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.5
  - number: 2.6.5.3.a
    text: |-
      het overleg, bedoeld in het eerste lid, plaatsvindt, onverminderd het bepaalde in de [artikelen 662][ref1] en
      [663 van Boek 7 van het Burgerlijk Wetboek][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel663
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '663'
  - number: 2.6.5.3.b
    text: |-
      de aanbieder of aanbieders, bedoeld in het eerste lid, zoveel mogelijk inspanning leveren om bij het overleg,
      bedoeld in het eerste lid, de overname van betrokken personeel en het voortzetten van bestaande relaties tussen
      hulpverleners en cliënten te bewerkstelligen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.5
  - number: 2.6.6.1
    text: |-
      Met het oog op gevallen waarin ten aanzien van een voorziening [artikel 2.6.4][ref1] wordt toegepast, worden
      bij verordening regels gesteld ter waarborging van een goede verhouding tussen de prijs voor de levering van een
      voorziening en de eisen die worden gesteld aan de kwaliteit van de voorziening. Daarbij wordt rekening gehouden met
      de deskundigheid van de beroepskrachten en de arbeidsvoorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.6
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.6.6.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het in het eerste lid
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.6
  - number: 2.6.6.3
    text: |-
      Het ontwerp van een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt aan de beide
      kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.6
  - number: 2.6.6.4
    text: |-
      De voordracht voor de vast te stellen algemene maatregel van bestuur kan worden gedaan nadat vier weken na de
      overlegging zijn verstreken, tenzij binnen die termijn door of namens een der kamers of door ten minste een vijfde
      van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het onderwerp van de
      algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo
      spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.6
  - number: 2.6.7.1
    text: |-
      Bij algemene maatregel van bestuur kunnen voorwaarden worden bepaald waaronder ingezetenen en maatschappelijke
      initiatieven bij de uitvoering van het beleid kunnen worden betrokken, het uitvoeren van taken van het college op
      grond van deze wet daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.7
  - number: 2.6.7.2
    text: 'In de in het eerste lid bedoelde algemene maatregel van bestuur wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.7
  - number: 2.6.7.2.a
    text: |-
      welke eisen gelden voor het door ingezetenen en maatschappelijke initiatieven laten uitvoeren van taken van het
      college;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.7
  - number: 2.6.7.2.b
    text: op welke wijze en aan de hand van welke criteria de effecten worden geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.7
  - number: 2.6.7.3
    text: |-
      Het ontwerp van een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt aan beide kamers
      der Staten-Generaal overgelegd. De voordracht voor de vast te stellen algemene maatregel van bestuur kan worden
      gedaan nadat vier weken na de overlegging zijn verstreken, tenzij binnen die termijn door of namens een der kamers
      de wens te kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In
      dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.7
  - number: 2.6.8.1
    text: |-
      Onze Minister kan, indien hij met betrekking tot de rechtmatige uitvoering van deze wet ernstige tekortkomingen
      vaststelt, aan het college, nadat het college gedurende acht weken in de gelegenheid is gesteld zijn zienswijze
      naar voren te brengen, een aanwijzing geven. Hij treedt daarbij niet in de besluitvorming inzake individuele
      gevallen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.8
  - number: 2.6.8.2
    text: |-
      In de aanwijzing wordt een termijn opgenomen waarbinnen het college de uitvoering in overeenstemming heeft gebracht
      met de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel2.6.8
  - number: 3.1.1
    text: De aanbieder draagt er zorg voor dat de voorziening van goede kwaliteit is.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.1
  - number: 3.1.2
    text: 'Een voorziening wordt in elk geval:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.1
  - number: 3.1.2.a
    text: veilig, doeltreffend, doelmatig en cliëntgericht verstrekt,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.1
  - number: 3.1.2.b
    text: afgestemd op de reële behoefte van de cliënt en op andere vormen van zorg of hulp die de cliënt ontvangt,
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.1
  - number: 3.1.2.c
    text: |-
      verstrekt in overeenstemming met de op de beroepskracht rustende verantwoordelijkheid, voortvloeiende uit de
      professionele standaard;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.1
  - number: 3.1.2.d
    text: verstrekt met respect voor en inachtneming van de rechten van de cliënt.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.1
  - number: 3.1.3
    text: |-
      Bij algemene maatregel van bestuur kunnen, indien het niveau van een vorm van maatschappelijke ondersteuning dit
      vereist, nadere eisen worden gesteld aan aanbieders van voorzieningen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.1
  - number: 3.1.4
    text: |-
      Het ontwerp van een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt aan beide kamers
      der Staten-Generaal overgelegd. De voordracht voor de vast te stellen algemene maatregel van bestuur kan worden
      gedaan nadat vier weken na de overlegging zijn verstreken, tenzij binnen die termijn door of namens een der kamers
      of door tenminste een vijfde van het grondwettelijke aantal leden van een der kamers de wens te kennen wordt
      gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een
      daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.1
  - number: 3.2.1
    text: |-
      Indien de aanbieder een voorziening levert als bedoeld in [artikel 2.1.3, tweede lid, onderdelen d en e][ref1],
      treft de aanbieder:


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.2.1.a
    text: |-
      een regeling voor de afhandeling van klachten van cliënten ten aanzien van gedragingen van de aanbieder jegens
      een cliënt;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.2
  - number: 3.2.1.b
    text: |-
      een regeling voor medezeggenschap van cliënten over voorgenomen besluiten van de aanbieder die voor de gebruikers
      van belang zijn.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.2
  - number: 3.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, indien het niveau van een vorm van maatschappelijke
      ondersteuning dit vereist, nadere eisen worden gesteld aan aanbieders van voorzieningen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.2
  - number: 3.3.1
    text: |-
      De aanbieder, niet zijnde een aanbieder die hulpmiddelen of woningaanpassingen levert, stelt een meldcode vast
      waarin stapsgewijs wordt aangegeven hoe met signalen van huiselijk geweld of kindermishandeling wordt omgegaan en
      die er redelijkerwijs aan bijdraagt dat zo snel en adequaat mogelijk hulp kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.3
  - number: 3.3.2
    text: De aanbieder bevordert de kennis en het gebruik van de meldcode.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.3
  - number: 3.3.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.3
  - number: 3.4.1
    text: |-
      De aanbieder doet bij de toezichthoudende ambtenaar, bedoeld in [artikel 6.1][ref1], onverwijld melding van:


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel6
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '6'
        hoofdstuk: '6'
  - number: 3.4.1.a
    text: iedere calamiteit die bij de verstrekking van een voorziening heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.4
  - number: 3.4.1.b
    text: geweld bij de verstrekking van een voorziening.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.4
  - number: 3.4.2
    text: |-
      De aanbieder en de beroepskrachten die voor hem werkzaam zijn, verstrekken bij en naar aanleiding van een melding
      als bedoeld in het eerste lid aan de toezichthoudende ambtenaar de gegevens, daaronder begrepen persoonsgegevens,
      gegevens over gezondheid en andere bijzondere categorieën van persoonsgegevens en persoonsgegevens van
      strafrechtelijke aard, voor zover deze voor het onderzoeken van de melding noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.4
  - number: 3.4.3
    text: |-
      Persoonsgegevens als bedoeld in het tweede lid, ten aanzien waarvan de aanbieder of de beroepskracht op grond van
      een wettelijk voorschrift of op grond van zijn ambt of beroep tot geheimhouding is verplicht, worden uitsluitend
      zonder toestemming van betrokkene verstrekt, indien deze niet meer in staat is de toestemming te geven dan wel dit
      noodzakelijk kan worden geacht ter bescherming van cliënten.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.4
  - number: 3.5.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de situaties waarin een aanbieder,
      niet zijnde een aanbieder die hulpmiddelen of woningaanpassingen levert, in het bezit dient te zijn van een
      verklaring omtrent het gedrag als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1]
      voor beroepskrachten en andere personen die beroepsmatig met zijn cliënten in contact kunnen komen, welke niet
      eerder is afgegeven dan drie maanden voor het tijdstip waarop betrokkene voor de aanbieder ging werken.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 3.5.2
    text: |-
      Indien de aanbieder of een toezichthoudende ambtenaar redelijkerwijs mag vermoeden dat een beroepskracht niet
      voldoet aan de eisen voor het afgeven van een verklaring als bedoeld in het eerste lid, verlangt de aanbieder dat
      die beroepskracht binnen tien weken een verklaring overlegt die niet ouder is dan drie maanden.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.5
  - number: 3.5.3
    text: |-
      Indien de aanbieder voor een beroepskracht als bedoeld in het tweede lid bij het verstrijken van de in dat lid
      genoemde termijn niet in het bezit is van een verklaring omtrent het gedrag, neemt de aanbieder zo spoedig mogelijk
      de maatregelen die noodzakelijk zijn ter bescherming van zijn cliënten.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.5
  - number: 3.5.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de situaties waarin een aanbieder
      die een solistisch werkende natuurlijk persoon is, in het bezit moet zijn van een verklaring omtrent het gedrag als
      bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1], afgegeven op een tijdstip dat
      niet langer dan drie jaar is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 4.1.1.1
    text: |-
      Het college draagt zorg voor de organisatie van een advies- en meldpunt huiselijk geweld en kindermishandeling.
      [Artikel 2.6.1][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 4.1.1.2
    text: 'Het AMHK oefent de volgende taken uit:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.1.1
  - number: 4.1.1.2.a
    text: het fungeren als meldpunt voor gevallen of vermoedens van huiselijk geweld of kindermishandeling;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.1.1
  - number: 4.1.1.2.b
    text: |-
      het naar aanleiding van een melding van huiselijk geweld of kindermishandeling of een vermoeden daarvan,
      onderzoeken of daarvan daadwerkelijk sprake is;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.1.1
  - number: 4.1.1.2.c
    text: |-
      het beoordelen van de vraag of en zo ja tot welke stappen de melding van huiselijk geweld of kindermishandeling of
      een vermoeden daarvan aanleiding geeft;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.1.1
  - number: 4.1.1.2.d
    text: |-
      het in kennis stellen van een instantie die passende professionele hulp kan verlenen bij huiselijk geweld of
      kindermishandeling, van een melding van huiselijk geweld of kindermishandeling of een vermoeden daarvan, indien
      het belang van de betrokkene dan wel de ernst van de situatie waarop de melding betrekking heeft daartoe aanleiding
      geeft;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.1.1
  - number: 4.1.1.2.e
    text: |-
      het in kennis stellen van de politie of de raad voor de kinderbescherming van een melding van huiselijk geweld of
      kindermishandeling of een vermoeden daarvan, indien het belang van de betrokkene dan wel de ernst van de situatie
      waarop de melding betrekking heeft daartoe aanleiding geeft;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.1.1
  - number: 4.1.1.2.f
    text: |-
      indien het AMHK een verzoek tot onderzoek bij de raad voor de kinderbescherming doet, het in kennis stellen daarvan
      van het college, en
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.1.1
  - number: 4.1.1.2.g
    text: |-
      het op de hoogte stellen van degene die een melding heeft gedaan, van de stappen die naar aanleiding van de melding
      zijn ondernomen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.1.1
  - number: 4.1.1.3
    text: |-
      Het AMHK verstrekt aan degene die een vermoeden van huiselijk geweld of kindermishandeling heeft, desgevraagd
      advies over de stappen die in verband daarmee kunnen worden ondernomen en verleent daarbij zo nodig ondersteuning.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.1.1
  - number: 4.1.1.4
    text: |-
      Het college bevordert een goede samenwerking tussen het AMHK, de hulpverlenende instanties, de politie en de
      gecertificeerde instellingen en de raad voor de kinderbescherming in de zin van de Jeugdwet.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.1.1
  - number: 4.1.1.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de werkwijze van het AMHK
      bij de uitoefening van de taken, bedoeld in het tweede en derde lid, over de deskundigheid waarover een AMHK moet
      beschikken om een verantwoorde uitvoering van zijn taken te kunnen realiseren en over de samenwerking, bedoeld in
      het vierde lid.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.1.1
  - number: 4.1.1.6
    text: |-
      De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet gedaan
      dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen
      vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Ministers te
      brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.1.1
  - number: 4.2.1.1
    text: |-
      Het AMHK draagt er zorg voor dat de uitvoering van de taken, bedoeld in [artikel 4.1.1][ref1], van goede kwaliteit
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.2.1.2
    text: |-
      Het AMHK organiseert zich op zodanige wijze, voorziet zich kwalitatief en kwantitatief zodanig van personeel en
      materieel en draagt zorg voor een zodanige verantwoordelijkheidstoedeling, dat een en ander leidt of redelijkerwijs
      moet leiden tot een goede uitvoering van de taken.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.1
  - number: 4.2.1.3
    text: |-
      Het AMHK neemt bij zijn werkzaamheden de zorg van een goede hulpverlener in acht en handelt daarbij in
      overeenstemming met de op hem rustende verantwoordelijkheid, voortvloeiende uit de voor die hulpverlener geldende
      professionele standaard.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.1
  - number: 4.2.2.1
    text: |-
      Het uitvoeren van [artikel 4.2.1, tweede lid][ref1], omvat mede de systematische bewaking, beheersing en
      verbetering van de kwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.2.2
    text: 'Ter uitvoering van het eerste lid draagt het AMHK zorg voor:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.2
  - number: 4.2.2.2.a
    text: het op systematische wijze verzamelen en registreren van gegevens betreffende de kwaliteit;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.2
  - number: 4.2.2.2.b
    text: |-
      het aan de hand van de gegevens, bedoeld onder a, op systematische wijze toetsen of de wijze van uitvoering van
      [artikel 4.2.1, tweede lid][ref1], leidt tot goede kwaliteit, en


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.2.2.c
    text: |-
      het op basis van de uitkomst van de toetsing, bedoeld onder b, zo nodig veranderen van de wijze waarop
      [artikel 4.2.1, tweede lid][ref1], wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.3.1
    text: |-
      Bij algemene maatregel van bestuur kunnen, indien het niveau van de uitvoering van de taken dit vereist,
      nadere regels worden gesteld met betrekking tot de uitvoering van de [artikelen 4.2.1, tweede lid][ref1], en
      [4.2.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.3.2
    text: |-
      Indien uitvoering van de [artikelen 4.2.1, tweede lid][ref1], en [4.2.2][ref2] overeenkomstig de op grond van het
      eerste lid gestelde regels niet blijkt te leiden tot een goede kwaliteit van de uitvoering van de taken, kunnen bij
      algemene maatregel van bestuur tevens nadere regels worden gesteld met betrekking tot artikel 4.2.1, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.3.3
    text: |-
      De voordracht voor een krachtens het eerste of tweede lid vast te stellen algemene maatregel van bestuur wordt niet
      gedaan dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden binnen
      vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister en Onze
      Minister van Veiligheid en Justitie te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide
      kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.3
  - number: 4.2.4.1
    text: |-
      Het AMHK is in het bezit van een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] van personen die in zijn opdracht
      beroepsmatig en niet-incidenteel als vrijwilliger in contact kunnen komen met personen die bij een melding aan het
      AMHK betrokken zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0015677
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0015677
  - number: 4.2.4.2
    text: |-
      Een verklaring als bedoeld in het eerste lid is niet eerder afgegeven dan drie maanden voor het tijdstip waarop
      betrokkene voor het AMHK ging werken.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.4
  - number: 4.2.4.3
    text: |-
      Indien het AMHK of een ingevolge [artikel 4.3.1][ref1] met het toezicht belaste ambtenaar redelijkerwijs mag
      vermoeden dat een persoon niet langer voldoet aan de eisen voor het afgeven van een verklaring als bedoeld in het
      eerste lid, verlangt deze dat die persoon zo spoedig mogelijk opnieuw een verklaring als bedoeld in het eerste lid
      overlegt, die niet ouder is dan drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.2.4.4
    text: |-
      Bij algemene maatregel van bestuur kan, ten behoeve van de waarborging van de kwaliteit van de uitvoering van de
      taken, alsmede ten behoeve van het toezicht op en de handhaving van de bij of krachtens deze wet met betrekking tot
      het AMHK gestelde regels, een register worden ingesteld van AMHK’s en van personen als bedoeld in het eerste lid.
      Bij of krachtens die maatregel kunnen nadere regels worden gesteld over dat register. Deze regels hebben in ieder
      geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.4
  - number: 4.2.4.4.a
    text: de vorm van het register;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.4
  - number: 4.2.4.4.b
    text: de in het register op te nemen gegevens;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.4
  - number: 4.2.4.4.c
    text: de vastlegging van gegevens in het register en de verwijdering van gegevens daaruit;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.4
  - number: 4.2.4.4.d
    text: de wijze waarop verbetering van onjuistheden in het register plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.4
  - number: 4.2.4.4.e
    text: de verstrekking van gegevens;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.4
  - number: 4.2.4.4.f
    text: de openbaarheid van gegevens, en
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.4
  - number: 4.2.4.4.g
    text: de verantwoordelijkheden van degenen die gegevens aanleveren ten behoeve van het register.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.4
  - number: 4.2.5.1
    text: |-
      Het AMHK doet aan de ingevolge [artikel 4.3.1][ref1] met het toezicht belaste ambtenaren onverwijld melding van:


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.5
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.2.5.1.a
    text: |-
      iedere calamiteit die bij de uitvoering van de taken, bedoeld in [artikel 4.1.1, tweede en derde lid][ref1], heeft
      plaatsgevonden, en


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.5
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.2.5.1.b
    text: |-
      geweld bij de uitvoering van de taken, bedoeld in [artikel 4.1.1, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.5
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.2.5.2
    text: |-
      Het AMHK verstrekt bij en naar aanleiding van een melding als bedoeld in het eerste lid aan de ingevolge
      [artikel 4.3.1][ref1] met toezicht belaste ambtenaren de gegevens, daaronder begrepen persoonsgegevens, gegevens
      over gezondheid en andere bijzondere categorieën van persoonsgegevens, die voor het onderzoeken van de melding
      noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.5
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.2.6.1
    text: Het AMHK stelt een vertrouwenspersoon in de gelegenheid zijn taak uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.6
  - number: 4.2.6.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de taken en bevoegdheden van
      vertrouwenspersonen en de verplichtingen van het AMHK.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.6
  - number: 4.2.6.3
    text: |-
      De rechtspersoon bij wie een vertrouwenspersoon werkzaam is, is in het bezit van een verklaring omtrent het gedrag
      als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] van die vertrouwenspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.6
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 4.2.6.4
    text: |-
      Een verklaring als bedoeld in het derde lid is niet eerder afgegeven dan drie maanden voor het tijdstip waarop die
      vertrouwenspersoon voor de betreffende rechtspersoon ging werken.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.6
  - number: 4.2.6.5
    text: |-
      Indien de rechtspersoon of een ingevolge [artikel 4.3.1][ref1] met het toezicht belaste ambtenaar redelijkerwijs
      mag vermoeden dat een vertrouwenspersoon niet langer voldoet aan de eisen voor het afgeven van een verklaring als
      bedoeld in het derde lid, verlangt deze dat die vertrouwenspersoon zo spoedig mogelijk opnieuw een verklaring als
      bedoeld in het derde lid overlegt, die niet ouder is dan drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.6
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.2.7.1
    text: |-
      Het AMHK treft een regeling voor de behandeling van klachten over gedragingen van het AMHK of van voor hem werkzame
      personen jegens andere personen in het kader van de uitvoering van de taken van het AMHK. Het AMHK brengt de
      regeling op passende wijze onder de aandacht van de jeugdigen, ouders en pleegouders.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.7
  - number: 4.2.7.2
    text: 'De in het eerste lid bedoelde regeling:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.7
  - number: 4.2.7.2.a
    text: |-
      voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit ten minste drie leden,
      waaronder een voorzitter die niet werkzaam is voor of bij het AMHK;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.7
  - number: 4.2.7.2.b
    text: |-
      waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.7
  - number: 4.2.7.2.c
    text: |-
      waarborgt dat de klachtencommissie binnen een in de regeling vastgelegde termijn na indiening van de klacht de
      klager, degene over wie is geklaagd en het AMHK schriftelijk en met redenen omkleed in kennis stelt van haar
      oordeel over de gegrondheid van de klacht, al dan niet vergezeld van aanbevelingen;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.7
  - number: 4.2.7.2.d
    text: |-
      waarborgt dat bij afwijking van de onder c bedoelde termijn de klachtencommissie daarvan met redenen omkleed
      mededeling doet aan de klager, degene over wie is geklaagd en het AMHK, onder vermelding van de termijn waarbinnen
      de klachtencommissie haar oordeel over de klacht zal uitbrengen;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.7
  - number: 4.2.7.2.e
    text: |-
      waarborgt dat de klager en degene over wie is geklaagd door de klachtencommissie in de gelegenheid worden gesteld
      mondeling of schriftelijk een toelichting te geven op de gedraging waarover is geklaagd, en
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.7
  - number: 4.2.7.2.f
    text: waarborgt dat de klager en degene over wie is geklaagd zich bij de behandeling van de klacht kunnen laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.7
  - number: 4.2.7.3
    text: |-
      Het AMHK ziet erop toe dat de klachtencommissie, bedoeld in het tweede lid, onderdeel a, haar werkzaamheden
      verricht volgens een door deze commissie op te stellen reglement.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.7
  - number: 4.2.7.4
    text: |-
      Bij de klachtencommissie, bedoeld in het tweede lid, onderdeel a, kan een klacht tegen een AMHK worden ingediend
      over een gedraging van het AMHK of van voor hem werkzame personen jegens een andere persoon bij de uitvoering van
      de taken van het AMHK
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.7
  - number: 4.2.7.4.a
    text: door of namens de persoon op wie de gedraging betrekking had;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.7
  - number: 4.2.7.4.b
    text: door een nabestaande, indien de onder a bedoelde persoon is overleden.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.7
  - number: 4.2.7.5
    text: |-
      Het AMHK deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onderdeel a, binnen een maand na
      ontvangst van het in het tweede lid, onderdeel c, bedoelde oordeel van de klachtencommissie schriftelijk mee of
      hij naar aanleiding van dat oordeel maatregelen zal nemen en zo ja welke. Bij afwijking van de in de eerste volzin
      genoemde termijn, doet het AMHK daarvan met redenen omkleed mededeling aan de klager en de klachtencommissie, onder
      vermelding van de termijn waarbinnen het AMHK zijn standpunt aan hen kenbaar zal maken.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.7
  - number: 4.2.8
    text: |-
      Indien een klacht zich richt op een ernstige situatie met een structureel karakter, stelt de klachtencommissie
      het AMHK daarvan in kennis. Indien de klachtencommissie niet is gebleken dat het AMHK ter zake maatregelen heeft
      getroffen, meldt de klachtencommissie deze klacht aan de ingevolge [artikel 4.3.1][ref1] met het toezicht belaste
      ambtenaren. Onder een klacht over een ernstige situatie wordt verstaan een klacht over een situatie waarbij sprake
      is van onverantwoorde hulp.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.8
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.2.9
    text: |-
      De [artikelen 4.2.7][ref1] en [4.2.8 ][ref2]zijn niet van toepassing op klachten ten aanzien van jeugdigen die
      op grond van een andere wet onvrijwillig in een accommodatie zijn opgenomen, voor zover deze overeenkomstig een
      bijzondere wettelijke regeling door een klachtencommissie kunnen worden behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.9
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.10.1
    text: |-
      Het AMHK stelt jaarlijks een verslag op over de naleving van deze wet in het voorafgaande jaar met betrekking tot
      regels omtrent de kwaliteit van de uitvoering van de taken en het klachtrecht.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.10
  - number: 4.2.10.2
    text: 'In het in het eerste lid bedoelde verslag geeft het AMHK in ieder geval aan:'
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.10
  - number: 4.2.10.2.a
    text: |-
      of en op welke wijze zij personen ten behoeve van wie hij zijn taken uitvoert, bij zijn kwaliteitsbeleid heeft
      betrokken;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.10
  - number: 4.2.10.2.b
    text: de frequentie waarmee en de wijze waarop binnen het AMHK kwaliteitsbeoordeling plaatsvond en het resultaat daarvan;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.10
  - number: 4.2.10.2.c
    text: welk gevolg hij heeft gegeven aan klachten en meldingen over de kwaliteit van de uitvoering van de taken;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.10
  - number: 4.2.10.2.d
    text: |-
      een beknopte beschrijving van de klachtenregeling, bedoeld in [artikel 4.2.7, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.10
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.10.2.e
    text: de wijze waarop zij de klachtenregeling onder de aandacht hebben gebracht van de betrokken personen;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.10
  - number: 4.2.10.2.f
    text: |-
      de samenstelling van de klachtencommissie, bedoeld in [artikel 4.2.7, tweede lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.10
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.10.2.g
    text: |-
      in welke mate de klachtencommissie haar werkzaamheden heeft kunnen verrichten met inachtneming van de waarborgen,
      bedoeld in [artikel 4.2.7, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.10
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.10.2.h
    text: het aantal en de aard van de door de klachtencommissie behandelde klachten;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.10
  - number: 4.2.10.2.i
    text: de strekking van de oordelen en aanbevelingen van de klachtencommissie;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.10
  - number: 4.2.10.2.j
    text: |-
      de aard van de maatregelen, bedoeld in [artikel 4.2.7, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.10
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.10.3
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Veiligheid en Justitie kunnen nadere regels worden gesteld met
      betrekking tot het verslag.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.10
  - number: 4.2.11.1
    text: |-
      Het AMHK maakt binnen tien dagen na vaststelling van het verslag, bedoeld in [artikel 4.2.10, eerste lid][ref1],
      doch uiterlijk voor 1 juni, of 15 juli, indien het verslag betrekking heeft op een AMHK dat valt onder een
      gemeenschappelijke regeling in de zin van de [Wet gemeenschappelijke regelingen][ref2], van het jaar volgend op het
      jaar waarop het verslag ziet, de volgende zaken openbaar:


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.11
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003740
  - number: 4.2.11.1.a
    text: het verslag;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.11
  - number: 4.2.11.1.b
    text: |-
      de op schrift gestelde uitgangspunten voor het beleid, waaronder begrepen de algemene criteria, welke bij de
      uitvoering van de taken worden gehanteerd;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.11
  - number: 4.2.11.1.c
    text: |-
      de notulen dan wel de besluitenlijst van de vergaderingen van het bestuur, voor zover deze algemene beleidszaken
      betreffen, en
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.11
  - number: 4.2.11.1.d
    text: |-
      de klachtenregeling, bedoeld in [artikel 4.2.7, eerste lid][ref1], en van andere voor jeugdigen en ouders geldende
      regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.11
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.2.11.2
    text: |-
      De openbaarmaking geschiedt op een door het AMHK te bepalen wijze. Het AMHK verstrekt personen ten behoeve van wie
      hij zijn taken uitvoert, op hun verzoek een afschrift.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.11
  - number: 4.2.11.3
    text: |-
      Van de openbaarmaking wordt mededeling gedaan op de bij het AMHK voor het doen van mededelingen aan personen ten
      behoeve van wie hij zijn taken uitvoert, gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.11
  - number: 4.2.11.4
    text: |-
      Voor het op verzoek verstrekken van afschriften kan een tarief in rekening worden gebracht, ten hoogste gelijk aan
      de kostprijs, tenzij ten aanzien van het AMHK de [Wet openbaarheid van bestuur van toepassing][ref1] is.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.11
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 4.2.11.5
    text: |-
      Het AMHK zendt het verslag voor 1 juni of 15 juli, indien het verslag betrekking heeft op een AMHK dat valt
      onder een gemeenschappelijke regeling in de zin van de [Wet gemeenschappelijke regelingen][ref1], van het
      jaar van vaststelling aan Onze Minister en Onze Minister van Veiligheid en Justitie en aan de ingevolge
      [artikel 4.3.1][ref2] met het toezicht belaste ambtenaar, alsmede aan organisaties die in de regio die in algemene
      zin de belangen behartigen van personen ten behoeve van wie hij zijn taken uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.11
    references:
      - id: ref1
        bwb_id: BWBR0003740
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.2.12.1
    text: |-
      Het AMHK verstrekt kosteloos gegevens aan het college, aan Onze Minister en aan Onze Minister van Veiligheid
      en Justitie, ten behoeve van de verwerking, bedoeld in de [artikelen 7.4.0, eerste lid][ref1], en
      [7.4.1, eerste en tweede lid, van de Jeugdwet][ref2]. Deze verstrekking kan zowel een structureel als incidenteel
      karakter hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.12
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
  - number: 4.2.12.2
    text: |-
      Op de in het eerste lid bedoelde gegevens is [artikel 7.4.4 van de Jeugdwet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.12
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
  - number: 4.2.12.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de inhoud van de in het eerste lid
      bedoelde gegevens, de wijze waarop de verstrekking plaatsvindt en de tijdvakken waarop de gegevens betrekking
      hebben. In die maatregel worden tevens geregeld de termijnen waarbinnen of de tijdstippen waarop de gegevens
      verstrekt dienen te worden.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.12
  - number: 4.2.12.4
    text: |-
      Bij of krachtens de in het derde lid bedoelde maatregel kan worden bepaald dat het AMHK de in het eerste lid
      bedoelde gegevens op een bij of krachtens die maatregel aangewezen wijze bij Onze Minister en Onze Minister van
      Veiligheid en Justitie of een door hen aan te wijzen instantie indient.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.12
  - number: 4.2.13
    text: |-
      Het AMHK stelt overeenkomstig door Onze Minister en Onze Minister van Veiligheid en Justitie te stellen regels de
      begroting, de balans en de resultatenrekening, alsmede de daarbij behorende toelichting vast en maakt deze op door
      Onze Minister en Onze Minister van Veiligheid en Justitie te bepalen wijze openbaar.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.13
  - number: 4.2.14
    text: |-
      Het AMHK verstrekt aan Onze Minister en Onze Minister van Veiligheid en Justitie de bij regeling van Onze Minister
      en Onze Minister van Veiligheid en Justitie omschreven gegevens betreffende de exploitatie van het AMHK. In de
      regeling kan worden bepaald dat de gegevens worden verstrekt aan een daarin aangewezen bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.2.14
  - number: 4.3.1.1
    text: |-
      Met het toezicht op de naleving van de bij of krachtens deze wet met betrekking tot het AMHK gestelde regels zijn
      belast de door Onze Minister en Onze Minister van Veiligheid en Justitie aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.3.1
  - number: 4.3.1.2
    text: |-
      De met het toezicht belaste ambtenaren zijn, voor zover dat voor de vervulling van hun taak noodzakelijk is en
      in afwijking van [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref1], bevoegd tot inzage van de
      dossiers. Voor zover de betrokken beroepsbeoefenaar uit hoofde van zijn beroep tot geheimhouding van het dossier
      verplicht is, geldt gelijke verplichting voor de betrokken ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 4.3.2.1
    text: |-
      Indien Onze Minister of Onze Minister van Veiligheid en Justitie van oordeel is dat een AMHK deze wet of de daarop
      berustende bepalingen niet of in onvoldoende mate of op onjuiste wijze naleeft, kan hij het AMHK een schriftelijke
      aanwijzing geven.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.3.2
  - number: 4.3.2.2
    text: |-
      In de aanwijzing geeft Onze Minister die het aangaat, met redenen omkleed aan welke maatregelen het AMHK moet nemen
      met het oog op de naleving van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.3.2
  - number: 4.3.2.3
    text: De aanwijzing bevat de termijn waarbinnen het AMHK eraan moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.3.2
  - number: 4.3.2.4
    text: |-
      Indien het nemen van maatregelen in verband met gevaar voor de veiligheid of de gezondheid redelijkerwijs geen
      uitstel kan lijden, kan de ingevolge [artikel 4.3.1][ref1] met het toezicht belaste ambtenaar een schriftelijk
      bevel geven. Het bevel heeft een geldigheidsduur van zeven dagen, welke door Onze Minister of Onze Minister van
      Veiligheid en Justitie kan worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.3.2.5
    text: |-
      Het AMHK is verplicht binnen de daarbij gestelde termijn aan de aanwijzing onderscheidenlijk onmiddellijk aan het
      bevel te voldoen.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.3.2
  - number: 4.3.2.6
    text: |-
      Mandaat tot het verlengen van de geldigheidsduur van een bevel wordt niet verleend aan een ingevolge
      [artikel 4.3.1][ref1] met het toezicht belaste ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.3.3.1
    text: |-
      Onze Minister en Onze Minister van Veiligheid en Justitie zijn beiden bevoegd tot oplegging van een last
      onder bestuursdwang ter handhaving van de [artikelen 4.2.13][ref1] en [4.2.14][ref2] en van een krachtens
      [artikel 4.3.2][ref3] gegeven aanwijzing of bevel.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.3.3.2
    text: |-
      Onze Minister en Onze Minister van Veiligheid en Justitie zijn beiden bevoegd tot
      oplegging van een last onder dwangsom ter handhaving van het bepaalde bij of krachtens
      [artikel 4.2.7, eerste, tweede, derde en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.3.3.3
    text: |-
      Onze Minister en Onze Minister van Veiligheid en Justitie zijn beiden bevoegd een last onder dwangsom op te
      leggen aan de betrokken beroepsbeoefenaar die geen medewerking verleent aan de inzage van dossiers, bedoeld in
      [artikel 9.2, derde lid, van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
  - number: 4.3.4.1
    text: |-
      Onze Minister en Onze Minister van Veiligheid en Justitie zijn beiden bevoegd een bestuurlijke boete van ten
      hoogste € 6.700,– op te leggen ter zake van een gedraging van een AMHK die in strijd is met een krachtens
      [artikelen 4.3.2 ][ref1]gegeven aanwijzing, voor zover deze betreft het niet of onvoldoende naleven van
      [artikel 4.2.10, tweede lid, onderdelen d tot en met j][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.3.4
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.3.4.2
    text: |-
      Onze Minister en Onze Minister van Veiligheid en Justitie zijn beiden bevoegd een bestuurlijke boete van ten
      hoogste € 33.500,– op te leggen ter zake van een gedraging van een AMHK die in strijd is met het bepaalde bij of
      krachtens de [artikelen 4.2.4][ref1], [4.2.5][ref2] of [4.2.11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel4.3.4
    references:
