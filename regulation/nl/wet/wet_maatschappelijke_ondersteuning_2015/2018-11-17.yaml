  - number: 8.1.2
    text: |-
      Onverminderd het eerste lid besluit het indicatieorgaan, bedoeld in
      [artikel 9b, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] zo spoedig mogelijk op aanvragen met
      betrekking tot zorg als bedoeld in het eerste lid, onderdelen a tot en met e, die zijn ingediend voor het in het
      eerste lid bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9b
  - number: 8.2.1
    text: |-
      Met betrekking tot een verzekerde in de zin van de [Algemene Wet Bijzondere Ziektekosten][ref1] aan wie
      een indicatiebesluit is afgegeven waarin is vastgesteld dat hij is aangewezen op zorg als bedoeld in
      [artikel 8.1, eerste lid, onderdelen a, b, c, d en e][ref2], verstrekken het indicatieorgaan, bedoeld in
      [artikel 9b, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref3], en de zorgverzekeraar, bedoeld in
      [artikel 1][ref4], onderscheidenlijk de rechtspersoon, bedoeld in [artikel 40 van die wet][ref5], zo spoedig
      mogelijk aan het college van de gemeente waarvan betrokkene ingezetene is, gegevens omtrent de inhoud van:


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0002614#Artikel40
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0002614
        artikel: 9b
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0002614
        artikel: '40'
  - number: 8.2.1.a
    text: |-
      het indicatiebesluit, met inbegrip van het daarin opgenomen burgerservicenummer, waarin ten aanzien van betrokkene
      is vastgesteld dat deze is aangewezen op zorg als bedoeld in [artikel 8.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel8
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.1.b
    text: de grondslag waarop het indicatiebesluit berust;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.2
  - number: 8.2.1.c
    text: |-
      de aard, inhoud en omvang van de zorg die betrokkene ontvangt en de zorgaanbieder van wie
      hij de zorg ontvangt dan wel, indien aan betrokkene subsidie wordt verstrekt als bedoeld in
      [artikel 44, eerste lid, onderdeel b, van de Algemene Wet Bijzondere Ziektekosten][ref1], en gegevens omtrent het
      bedrag van de subsidie en degene die hem de zorg verleent.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel44
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '44'
  - number: 8.2.2
    text: |-
      Met betrekking tot een verzekerde in de zin van de [Algemene Wet Bijzondere Ziektekosten][ref1] ten aanzien van
      wie door of namens de zorgverzekeraar, bedoeld in [artikel 1][ref2], onderscheidenlijk de rechtspersoon, bedoeld
      in [artikel 40 van die wet][ref3] een besluit is genomen met betrekking tot omvang van de doventolkzorg als
      bedoeld in [artikel 8.1, eerste lid, onderdeel f][ref4], waarop hij is aangewezen, verstrekt de zorgverzekeraar
      onderscheidenlijk de rechtspersoon zo spoedig mogelijk aan het college van de gemeente waarvan betrokkene
      ingezetene is, gegevens omtrent de inhoud van:


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0035362#Artikel8
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '40'
      - id: ref4
        bwb_id: BWBR0035362
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.2.a
    text: het in de aanhef bedoelde besluit, alsmede het burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.2
  - number: 8.2.2.b
    text: de grondslag waarop het besluit berust.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.2
  - number: 8.3.1
    text: |-
      Indien voor een verzekerde in de zin van de [Algemene Wet Bijzondere Ziektekosten][ref1] een
      indicatiebesluit is afgegeven waarin is vastgesteld dat hij is aangewezen op zorg als bedoeld in
      [artikel 8.1, eerste lid, onderdelen a, b, d en e][ref2], heeft belanghebbende met ingang van de eerste dag
      van het kalenderjaar na dat waarin enig artikel van deze wet in werking is getreden, jegens het college van de
      gemeente waarvan hij ingezetene is, de rechten en verplichtingen met betrekking tot het tot gelding brengen van
      de aanspraak op zorg die aan het indicatiebesluit waren verbonden, gedurende de looptijd van het indicatiebesluit,
      doch ten hoogste tot de eerste dag van het tweede kalenderjaar na dat waarin enig artikel van deze wet in werking
      is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel8
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.2
    text: |-
      Indien de uit een indicatiebesluit als bedoeld in het eerste lid voortvloeiende aanspraak op zorg op de eerste
      dag van het kalenderjaar na dat waarin enig artikel van deze wet in werking is getreden, nog niet tot gelding is
      gebracht, kan betrokkene de aanspraak in afwijking van het eerste lid slechts tot gelding brengen nadat hij het
      college van de gemeente waarvan hij ingezetene is, in de gelegenheid heeft gesteld zijn zienswijze ter zake kenbaar
      te maken.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.3
  - number: 8.3.3
    text: |-
      Indien aan een verzekerde als bedoeld in het eerste lid tot de eerste dag van het kalenderjaar na dat
      waarin enig artikel van deze wet in werking is getreden, op grond van het bepaalde bij of krachtens
      [artikel 44, eerste lid, onderdeel b, van de Algemene Wet Bijzondere Ziektekosten][ref1], een persoonsgebonden
      budget werd verstrekt, heeft belanghebbende met ingang van die dag jegens het college van de gemeente waarvan
      hij ingezetene is, recht op een persoonsgebonden budget overeenkomstig het bepaalde bij of krachtens genoemd
      artikelonderdeel, gedurende de looptijd van het indicatiebesluit, doch ten hoogste tot de eerste dag van het tweede
      kalenderjaar na dat waarin enig artikel van deze wet in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel44
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '44'
  - number: 8.3.4
    text: |-
      Indien ten aanzien van een verzekerde in de zin van de [Algemene Wet Bijzondere Ziektekosten][ref1] door
      of namens de zorgverzekeraar, bedoeld in [artikel 1][ref2], onderscheidenlijk de rechtspersoon, bedoeld in
      [artikel 40 van die wet][ref3], een besluit is genomen als bedoeld in [artikel 8.2, tweede lid][ref4], heeft
      belanghebbende met ingang van de eerste dag van het kalenderjaar na dat waarin enig artikel van deze wet in
      werking is getreden, jegens het college van de gemeente waarvan hij ingezetene is, de rechten en verplichtingen met
      betrekking tot het tot gelding brengen van de aanspraak op zorg die aan dat besluit waren verbonden, gedurende de
      looptijd van dat besluit, doch ten hoogste tot de eerste dag van het tweede kalenderjaar na dat waarin enig artikel
      van deze wet in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel1
