  - number: 8.6.2
    text: |-
      Nadat de zorgverzekeraar, bedoeld in [artikel 1][ref1], onderscheidenlijk de rechtspersoon, bedoeld in
      [artikel 40 van de Algemene Wet Bijzondere Ziektekosten][ref2], de in [artikel 8.2, tweede lid][ref3], bedoelde
      gegevens heeft verstrekt aan het college van de gemeente waarvan betrokkene ingezetene is, voert het college, met
      overeenkomstige toepassing van [artikel 2.3.2, tweede tot en met achtste lid][ref4], zonder melding als bedoeld
      in artikel 2.3.2, eerste lid, het in dat artikel bedoelde onderzoek uit op een zodanig tijdstip dat betrokkene
      tijdig voor het tijdstip waarop hij niet langer op grond van [artikel 8.3, vierde lid][ref5], aanspraak zal
      hebben op de in die gegevens omschreven zorg, een aanvraag kan doen voor een maatwerkvoorziening als bedoeld in
      [artikel 2.3.5. eerste lid][ref6].


