        paragraaf: '3'
  - number: 8.3.7
    text: |-
      Indien een in het buitenland wonende persoon op het tijdstip van inwerkingtreding van enig artikel van deze wet
      op grond van [artikel 3.1.2 van de Invoerings- en aanpassingswet Zorgverzekeringswet][ref1] aanspraak heeft op een
      vergoeding dan wel op grond van [artikel 1.22 van het Aanpassingsbesluit Zorgverzekeringswet][ref2] aanspraak heeft
      op een uitkering ter zake van de kosten van zorg als bedoeld in [artikel 8.1][ref3], behoudt die persoon jegens
      het Zorginstituut Nederland, bedoeld in [artikel 58 van de Zorgverzekeringswet][ref4] die aanspraak gedurende de
      looptijd van het indicatiebesluit, doch ten hoogste tot de eerste dag van het tweede kalenderjaar na dat waarin
      enig artikel van deze wet in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0018830#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019289#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.3
    references:
