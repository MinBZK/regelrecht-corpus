  - number: '8.5'
    text: |-
      De [Wet marktordening gezondheidszorg][ref1] is niet van toepassing
      op handelingen op het gebied van de gezondheidszorg als bedoeld in
      [artikel 1, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref2], voor zover uitgevoerd,
      al dan niet onder eigen verantwoordelijkheid, door personen, ingeschreven in een register als bedoeld in
      [artikel 3 van die wet][ref3] of door personen als bedoeld in [artikel 34 van die wet][ref4], die deel uitmaken van
      zorg die:


