  - number: 5.1.1.3
    text: |-
      Het college is bevoegd tot het verwerken van persoonsgegevens van andere personen in het sociale netwerk van de
      cliënt dan die bedoeld in het eerste en tweede lid die noodzakelijk zijn om vast te stellen welke hulp die deze aan
      de cliënt bieden of kunnen bieden, voor zover deze zijn verkregen van betrokkene of van de cliënt en noodzakelijk
