    text: |-
      Het college is bevoegd tot het verwerken van persoonsgegevens van de mantelzorger van de cliënt die noodzakelijk
      zijn om vast te stellen welke hulp deze aan de cliënt biedt of kan bieden, voor zover deze zijn verkregen van de
      mantelzorger of van de cliënt en noodzakelijk zijn voor de uitvoering van [artikel 2.3.2][ref1], [2.3.3][ref2],
      [2.3.5][ref3], [2.3.6][ref4], [2.3.9][ref5], [2.3.10][ref6], [2.4.1][ref7] of [2.4.3][ref8] dan wel de uitvoering
