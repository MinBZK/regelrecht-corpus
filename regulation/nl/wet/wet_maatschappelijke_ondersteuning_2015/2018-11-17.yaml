    text: |-
      Het CAK respectievelijk de andere instantie is de verwerkingsverantwoordelijke voor de verwerking, bedoeld in het
      eerste lid en het CAK is de verwerkingsverantwoordelijke voor de verwerking, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel5.1.3
  - number: 5.1.4.1
    text: |-
      De Sociale verzekeringsbank is bevoegd tot het verwerken van persoonsgegevens van de cliënt, waaronder
      gegevens over gezondheid die noodzakelijk zijn voor het verrichten van betalingen en het budgetbeheer,
      bedoeld in [artikel 2.6.2][ref1], voor zover deze zijn verkregen van de cliënt dan wel op grond van
      [artikel 5.2.1][ref2], [5.2.2][ref3] of [5.2.4][ref4] en noodzakelijk zijn voor de uitvoering van de taak, bedoeld
      in [artikel 2.6.2][ref5].


