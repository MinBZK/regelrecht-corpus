        hoofdstuk: '2'
        paragraaf: '3'
  - number: 8.6a.a
    text: die thuis wonen en een maatwerkvoorziening inhoudende een hulpmiddel of een woningaanpassing hebben aangevraagd;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.6a
  - number: 8.6a.b
    text: |-
      die zonder behandeling in een instelling verblijven en een maatwerkvoorziening inhoudende een hulpmiddel ter
      verbetering van hun mobiliteit hebben aangevraagd;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.6a
  - number: 8.6a.c
    text: |-
      die hun recht op zorg tot gelding brengen met een modulair pakket thuis en een maatwerkvoorziening inhoudende het
      schoonhouden van hun woonruimte hebben aangevraagd.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.6a
  - number: 8.7.1
    text: |-
      De gemeenteraad stelt het beleidsplan, bedoeld in [artikel 2.1.2][ref1], en de verordening, bedoeld in
      [de artikelen 2.1.3][ref2], [2.1.4][ref3], [2.1.5][ref4], [2.1.6 ][ref5]en [2.6.6][ref6], vast voor 1 november van
      het kalenderjaar waarin enig artikel van deze wet in werking is getreden.


