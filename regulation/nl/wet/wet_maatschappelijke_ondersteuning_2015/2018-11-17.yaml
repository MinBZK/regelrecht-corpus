  - number: 8.3.5
    text: |-
      Voor de toepassing van het eerste tot en met vierde lid, treedt het college in de plaats van de zorgverzekeraar,
      bedoeld in [artikel 1 van de Algemene Wet Bijzondere Ziektekosten][ref1], onderscheidenlijk de rechtspersoon,
      bedoeld in [artikel 40 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel40
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.3
