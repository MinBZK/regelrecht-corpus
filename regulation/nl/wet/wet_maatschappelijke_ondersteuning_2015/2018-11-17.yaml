  - number: 5.1.1.4
    text: |-
      Het college is voorts, voor zover betrokkene daarvoor zijn uitdrukkelijke toestemming heeft verleend, bevoegd
      persoonsgegevens van de cliënt, waaronder gegevens over gezondheid die noodzakelijk zijn voor de beoordeling van
      de behoefte van de cliënt aan ondersteuning van zijn participatie of zelfredzaamheid dan wel opvang of beschermd
      wonen, alsmede persoonsgegevens van diens echtgenoot, ouders, inwonende kinderen en andere huisgenoten die
      noodzakelijk zijn met het oog op een goede afstemming van te verlenen ondersteuning op hulp aan die personen, die
      het college heeft verkregen ten behoeve van de uitvoering van de taken die bij of krachtens de [Jeugdwet][ref1],
      de [Participatiewet][ref2] en de [Wet gemeentelijke schuldhulpverlening][ref3] aan het college zijn opgedragen,
      tevens te verwerken voor zover dat noodzakelijk is voor de uitvoering van [artikel 2.3.2][ref4], [2.3.3][ref5],
      [2.3.5][ref6], [2.3.6][ref7], [2.3.9][ref8], [2.3.10][ref9], [2.4.1][ref10] of [2.4.3][ref11].


