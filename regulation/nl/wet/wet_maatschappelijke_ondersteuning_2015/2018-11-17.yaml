  - number: 8.3.8
    text: |-
      Het eerste tot en met zesde lid zijn van overeenkomstige toepassing ten aanzien van een persoon
      die in het buitenland woont of verblijft en die in geval van behoefte aan zorg hetzij krachtens de
      [Algemene Wet Bijzondere Ziektekosten][ref1], hetzij met toepassing van een verordening van de Raad van de
      Europese Gemeenschappen dan wel met toepassing van zodanige verordening krachtens de overeenkomst betreffende
      de Europese Economische Ruimte of een verdrag inzake sociale zekerheid aanspraak heeft op zorg als bedoeld in
      [artikel 8.1, eerste lid, onderdelen a, b, d of e][ref2], of vergoeding van de kosten daarvan, met dien verstande
      dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel8
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.8.a
    text: |-
      voor de overeenkomstige toepassing van het eerste, derde en vierde lid in plaats van «verzekerde» telkens wordt
      gelezen: persoon;
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.3
  - number: 8.3.8.b
    text: |-
      voor de overeenkomstige toepassing van het eerste tot en met vierde lid in plaats van «het college van de gemeente
      waarvan hij ingezetene is» telkens wordt gelezen: het Zorginstituut Nederland; en
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.3
  - number: 8.3.8.c
    text: |-
      voor de overeenkomstige toepassing van het vijfde en zesde lid in plaats van «het college» telkens wordt gelezen:
      het Zorginstituut Nederland.
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.3
  - number: 8.3.9
    text: |-
      De vergoedingen en uitkeringen, bedoeld in het zevende en achtste lid, komen ten laste van het Fonds langdurige
      zorg, bedoeld in [artikel 89 van de Wet financiering sociale verzekeringen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel89
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '89'
  - number: 8.4.1
    text: |-
      Indien voor een verzekerde in de zin van de [Algemene Wet Bijzondere Ziektekosten][ref1] een indicatiebesluit is
      afgegeven waarin is vastgesteld dat hij is aangewezen op zorg als bedoeld in [artikel 8.1, onderdeel c][ref2],
      heeft belanghebbende met ingang van de eerste dag van het kalenderjaar na dat waarin enig artikel van deze wet in
      werking is getreden, jegens het college van de gemeente waarvan hij ingezetene is, de rechten en verplichtingen
      met betrekking tot het tot gelding brengen van de aanspraak op zorg die aan het indicatiebesluit waren verbonden,
      gedurende de looptijd van het indicatiebesluit, doch ten hoogste tot een bij koninklijk besluit vast te stellen
      tijdstip dat niet eerder is gelegen dan de eerste dag van het zesde kalenderjaar na dat waarin enig artikel van
      deze wet in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel8
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.4
