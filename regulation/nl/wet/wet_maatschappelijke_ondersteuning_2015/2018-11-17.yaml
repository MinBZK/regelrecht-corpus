      door derden wordt geleverd aan een belanghebbende, aan wie op grond van [artikel 8.3, derde lid][ref1], een
      persoongebonden budget wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel8
    url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#Artikel8.5
