preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat burgers een eigen verantwoordelijkheid dragen voor de wijze waarop
    zij hun leven inrichten en deelnemen aan het maatschappelijk leven, en dat van burgers mag worden verwacht dat
    zij elkaar naar vermogen daarin bijstaan; dat het tevens wenselijk is nieuwe regels te stellen om de rechten
    en plichten van de burger meer met elkaar in evenwicht te brengen; dat burgers die zelf dan wel samen met
    personen in hun naaste omgeving onvoldoende zelfredzaam zijn of onvoldoende in staat zijn tot participatie,
    een beroep moeten kunnen doen op door de overheid georganiseerde ondersteuning; dat de ondersteuning van de
    zelfredzaamheid en de participatie van personen met een beperking, chronische psychische of psychosociale
    problemen, erop gericht moet zijn dat burgers zo lang mogelijk in de eigen leefomgeving kunnen blijven; dat het
    in de rede ligt de overheidsverantwoordelijkheid voor het ondersteunen van de zelfredzaamheid en de participatie
    zo dicht mogelijk bij de burger te beleggen; dat het daarom wenselijk is nieuwe regels te stellen inzake
    de gemeentelijke verantwoordelijkheid voor de ondersteuning van personen met een beperking en personen met
    psychische of psychosociale problemen; dat het voorts wenselijk is dat daarbij zorg wordt gedragen voor een goede
    toegankelijkheid van voorzieningen, diensten en ruimten voor mensen met een beperking;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035362/2018-11-17#ArtikelAanhef
articles:
  - number: 1.1.1.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aanbieder:* natuurlijke persoon of
      rechtspersoon die jegens het college gehouden is een algemene voorziening of een maatwerkvoorziening te leveren;
        - *algemene voorziening:* aanbod van diensten of activiteiten dat, zonder voorafgaand onderzoek naar de behoeften,
      persoonskenmerken en mogelijkheden van de gebruikers, toegankelijk is en dat is gericht op maatschappelijke
      ondersteuning;
        - *AMHK:* advies- en meldpunt huiselijk geweld en kindermishandeling als bedoeld in [artikel 4.1.1][ref1];
        - *begeleiding:* activiteiten gericht op het bevorderen van zelfredzaamheid en participatie van de cliënt opdat hij
      zo lang mogelijk in zijn eigen leefomgeving kan blijven.
        - *beschermd wonen:* wonen in een accommodatie van een instelling met daarbij behorende toezicht en begeleiding,
      gericht op het bevorderen van zelfredzaamheid en participatie, het psychisch en psychosociaal functioneren,
      stabilisatie van een psychiatrisch ziektebeeld, het voorkomen van verwaarlozing of maatschappelijke overlast of het
      afwenden van gevaar voor de cliënt of anderen, bestemd voor personen met psychische of psychosociale problemen, die
      niet in staat zijn zich op eigen kracht te handhaven in de samenleving;
        - *beroepskracht:* natuurlijke persoon die in persoon beroepsmatig werkzaam is voor een aanbieder;
        - *bijzondere categorieën van persoonsgegevens:* bijzondere categorieën van persoonsgegevens als bedoeld in
      [paragraaf 3.1 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2];
        - *burgerservicenummer:* burgerservicenummer als bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref3];
        - *CAK:* het CAK, genoemd in [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref4];
        - *calamiteit:* niet-beoogde of onverwachte gebeurtenis, die betrekking heeft op de kwaliteit van een voorziening
      en die tot een ernstig schadelijk gevolg voor of de dood van een cliënt heeft geleid;
        - *CIZ:* het CIZ, genoemd in [artikel 7.1.1, eerste lid, van de Wet langdurige zorg][ref5];
        - *cliënt:* persoon die gebruik maakt van een algemene voorziening of aan wie een maatwerkvoorziening
      of persoonsgebonden budget is verstrekt of door of namens wie een melding is gedaan als bedoeld in
      [artikel 2.3.2, eerste lid][ref6];
        - *cliëntondersteuning:* onafhankelijke ondersteuning met informatie, advies en algemene ondersteuning die
      bijdraagt aan het versterken van de zelfredzaamheid en participatie en het verkrijgen van een zo integraal
      mogelijke dienstverlening op het gebied van maatschappelijke ondersteuning, preventieve zorg, zorg, jeugdhulp,
      onderwijs, welzijn, wonen, werk en inkomen;
        - *college:* college van burgemeester en wethouders;
        - *dossier:* geheel van schriftelijk of elektronisch vastgelegde gegevens met betrekking tot een melding van
      huiselijk geweld of kindermishandeling of een vermoeden daarvan;
        - *gebruikelijke hulp:* hulp die naar algemeen aanvaarde opvattingen in redelijkheid mag worden verwacht van de
      echtgenoot, ouders, inwonende kinderen of andere huisgenoten;
        - *gegevens over gezondheid:* gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15 van de Algemene
      verordening gegevensbescherming;
        - *geweld bij de verstrekking van een voorziening:* seksueel binnendringen van het lichaam van of ontucht met een
      cliënt, alsmede lichamelijk en geestelijk geweld jegens een cliënt, door een beroepskracht dan wel door een andere
      cliënt met wie de cliënt gedurende het etmaal of een dagdeel in een accommodatie van een aanbieder verblijft;
        - *huiselijk geweld:* lichamelijk, geestelijk of seksueel geweld of bedreiging daarmee door iemand uit de
      huiselijke kring;
        - *huiselijke kring:* een familielid, een huisgenoot, de echtgenoot of voormalig echtgenoot of een mantelzorger;
        - *hulpmiddel:* roerende zaak die bedoeld is om beperkingen in de zelfredzaamheid of de participatie te verminderen
      of weg te nemen;
        - *kindermishandeling:* elke vorm van voor een minderjarige bedreigende of gewelddadige interactie van fysieke,
      psychische of seksuele aard, die de ouders of andere personen ten opzichte van wie de minderjarige in een relatie
      van afhankelijkheid of van onvrijheid staat, actief of passief opdringen, waardoor ernstige schade wordt berokkend
      of dreigt te worden berokkend aan de minderjarige in de vorm van fysiek of psychisch letsel;
        - *maatschappelijke ondersteuning:* 1°. bevorderen van de sociale samenhang, de mantelzorg en vrijwilligerswerk,
      de toegankelijkheid van voorzieningen, diensten en ruimten voor mensen met een beperking, de veiligheid en
      leefbaarheid in de gemeente, alsmede voorkomen en bestrijden van huiselijk geweld, 2°. ondersteunen van de
      zelfredzaamheid en de participatie van personen met een beperking of met chronische psychische of psychosociale
      problemen zoveel mogelijk in de eigen leefomgeving, 3°. bieden van beschermd wonen en opvang;
        - *maatwerkvoorziening:* op de behoeften, persoonskenmerken en mogelijkheden van een persoon afgestemd geheel van
      diensten, hulpmiddelen, woningaanpassingen en andere maatregelen: 1°. ten behoeve van zelfredzaamheid, daaronder
      begrepen kortdurend verblijf in een instelling ter ontlasting van de mantelzorger, het daarvoor noodzakelijke
      vervoer, alsmede hulpmiddelen, woningaanpassingen en andere maatregelen, 2°. ten behoeve van participatie,
      daaronder begrepen het daarvoor noodzakelijke vervoer, alsmede hulpmiddelen en andere maatregelen, 3°. ten behoeve
      van beschermd wonen en opvang;
        - *mantelzorg:* hulp ten behoeve van zelfredzaamheid, participatie, beschermd wonen, opvang, jeugdhulp, het
      opvoeden en opgroeien van jeugdigen en zorg en overige diensten als bedoeld in de [Zorgverzekeringswet][ref7], die
      rechtstreeks voortvloeit uit een tussen personen bestaande sociale relatie en die niet wordt verleend in het kader
      van een hulpverlenend beroep;
        - *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;
        - *opvang:* onderdak en begeleiding voor personen die de thuissituatie hebben verlaten, al dan niet in verband
      met risico’s voor hun veiligheid als gevolg van huiselijk geweld, en niet in staat zijn zich op eigen kracht te
      handhaven in de samenleving;
        - *participatie:* deelnemen aan het maatschappelijke verkeer;
        - *persoonsgebonden budget:* bedrag waaruit namens het college betalingen worden gedaan voor diensten,
      hulpmiddelen, woningaanpassingen en andere maatregelen die tot een maatwerkvoorziening behoren, en die een cliënt
      van derden heeft betrokken;
        - *persoonsgegevens, gegevens over gezondheid, verwerking van persoonsgegevens, bestand,
      verwerkingsverantwoordelijke en verwerker*: hetgeen daaronder wordt verstaan in artikel 4 van de Algemene
      verordening gegevensbescherming;
        - *persoonsgegevens van strafrechtelijke aard:* persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref8];
        - *Richtlijn 2004/38/EG:* [Richtlijn nr. 2004/38/EG](32004L0038) van het Europees Parlement en de Raad van 29 april
      2004 betreffende het recht van vrij verkeer en verblijf op het grondgebied van de lidstaten voor de burgers van
      de Unie en hun familieleden, tot wijziging van [Verordening (EEG) 1612/68](31968R1612) en tot intrekking van
      [Richtlijnen 64/221/EEG](31964L0221), [68/360/EEG](31968L0360), [72/194/EEG](31972L0194), [73/148/EEG](31973L0148),
      [75/34/EEG](31975L0034), [75/35/EEG](31975L0035), [90/364/EEG](31990L0364), [90/365/EEG](31990L0365) en [93/96/EEG]
      (31993L0096) (PbEU L 158);
        - *sociaal netwerk:* personen uit de huiselijke kring of andere personen met wie de cliënt een sociale relatie
      onderhoudt;
        - *toezichthoudende ambtenaar:* persoon als bedoeld in de [artikelen 4.3.1][ref9], [6.1][ref10] en [6.2][ref11];
        - *vertegenwoordiger:* persoon of rechtspersoon die een cliënt vertegenwoordigt die niet in staat kan worden geacht
      tot een redelijke waardering van zijn belangen ter zake;
        - *vertrouwenspersoon:* vertrouwenspersoon als bedoeld in [artikel 2.6, tweede lid, van de Jeugdwet][ref12];
        - *voorziening:* algemene voorziening of maatwerkvoorziening;
        - *woningaanpassing:* bouwkundige of woontechnische ingreep in of aan een woonruimte;
        - *zelfredzaamheid:* in staat zijn tot het uitvoeren van de noodzakelijke algemene dagelijkse levensverrichtingen
      en het voeren van een gestructureerd huishouden.


