  - number: '4'
    text: |-
      De wijze van meting van de gewichtshoeveelheid en concentratie DDT, bedoeld in de artikelen 2 en 3, dient ten
      minste te voldoen aan de in bijlage II daaraan gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005478/2009-12-22#Artikel4
  - number: '5'
    text: |-
      De Regeling van de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 14 december 1987,
      houdende regelen met betrekking tot grenswaarden voor DDT (Stb. 588) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005478/2009-12-22#Artikel5
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de datum van uitgifte van het Staatsblad waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005478/2009-12-22#Artikel6
  - number: '7'
    text: 'Deze regeling kan worden angehaald als: Regeling grenswaarden voor DDT in afvalwater.'
    url: https://wetten.overheid.nl/BWBR0005478/2009-12-22#Artikel7
