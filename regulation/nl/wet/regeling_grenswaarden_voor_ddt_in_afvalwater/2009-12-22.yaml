      * Voor nieuwe bedrijven geldt de volgende grenswaarde voor lozing van DDT: 1 g/ton verwerkt produkt.
      ** De grenswaarden gelden op het punt waar het DDT bevattende afvalwater het bedrijfsterrein verlaat. Alle afvalstromen die verontreinigd kunnen zijn met DDT dienen bij de beoordeling of aan de grenswaarden wordt voldaan betrokken te zijn.
      *** De grenswaarden geven de hoogst toelaatbare gewichtshoeveelheid en concentratie DDT aan, die gemiddeld per maand mag worden geloosd. Daarbij geldt dat de hoogst toelaatbare gewichtshoeveelheid en concentratie op één dag ten hoogste twee maal de in de tabel aangegeven waarden mag bedragen.
