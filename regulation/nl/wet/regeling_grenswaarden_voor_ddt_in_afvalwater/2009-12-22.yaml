  - id: bijlage_II
    title: Bijlage II
    machine_readable:
      type: measurement_requirements
      sampling:
        location: bedrijfsterrein_exit
        alt_location_allowed: true
        alt_location_condition: All contaminated water must be accounted for, and regular control measurements must confirm representativeness.
