preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om in een aantal wetten op het terrein van het
    Ministerie van Volksgezondheid, Welzijn en Sport wijzigingen en correcties van wetstechnische of anderszins
    beperkte aard aan te brengen;

    Zo is het, dat Wij, de Afdeling advisering van Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050314/2025-01-01#ArtikelAanhef
articles:
  - number: XXI
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.

      2 Indien artikel IIIA na 1 januari 2024 in werking treedt, werkt dat artikel terug tot en met 1 januari 2024.
    url: https://wetten.overheid.nl/BWBR0050314/2025-01-01#ArtikelXXI
  - number: XXII
    text: 'Deze wet wordt aangehaald als: Verzamelwet VWS 2023.'
    url: https://wetten.overheid.nl/BWBR0050314/2025-01-01#ArtikelXXII
