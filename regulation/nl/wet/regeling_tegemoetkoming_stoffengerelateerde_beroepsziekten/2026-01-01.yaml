  - number: '1.2'
    text: |-
      In deze regeling wordt met echtgenoot gelijkgesteld de geregistreerde partner en de persoon die op grond van
      [artikel 1, derde lid, onder a, en vierde tot en met zevende lid, van de Algemene Ouderdomswet][ref1] en de daarop
      berustende bepalingen, mede als zodanig wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel1
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '1'
  - number: '1.3'
    text: |-
      In deze regeling wordt niet als echtgenoot aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie
      de echtgenoot gehuwd is.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel1
  - number: '2'
    text: |-
      Arbeid die wordt verricht aan, op of in schepen of luchtvaartuigen die op het moment van de arbeid hun thuishaven
      hadden in Nederland, wordt ook aangemerkt als in Nederland verrichte arbeid.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel2
  - number: '3'
    text: |-
      Een tegemoetkoming uit hoofde van deze regeling houdt geen erkenning van aansprakelijkheid door de Staat der
      Nederlanden in.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel3
  - number: '4.1'
    text: 'De werkende heeft eenmalig recht op een tegemoetkoming, indien:'
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel4
  - number: 4.1.a
    text: |-
      het Deskundigenpanel, met inachtneming van het afwegingskader causaliteit en de bijbehorende protocollen
      beroepsziekten heeft beoordeeld of:
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel4
  - number: 4.1.a.1°
    text: |-
      sprake is van een ernstige aandoening die ten tijde van de aanvraag voor de tegemoetkoming vermeld is op de Lijst
      beroepsziekten, opgenomen in de bijlage; en
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel4
  - number: 4.1.a.2°
    text: |-
      voorshands aannemelijk is dat deze ernstige aandoening in het geval van de aanvrager het gevolg is van
      blootstelling aan één of meer gevaarlijke stoffen bij het verrichten van de arbeid; en
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel4
  - number: 4.1.b
    text: |-
      de werkende geen betaling in verband met deze ernstige aandoening van één of meer werkgevers of opdrachtgevers
      heeft ontvangen gelijk aan of hoger dan het bedrag van de tegemoetkoming, ongeacht de vorm waarin de betaling is
      gedaan en de aard van de kosten waarin de betaling voorziet.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het afwegingskader causaliteit en de bijbehorende protocollen beroepsziekten
      worden op voordracht van de Adviescommissie Lijst beroepsziekten, bedoeld in het
      [Instellingsbesluit Adviescommissie Lijst beroepsziekten][ref1], door de minister vastgesteld en gepubliceerd in de
      Staatscourant. De vindplaats in de Staatscourant van het geldende afwegingskader en de geldende protocollen worden
      opgenomen in de bijlage bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0047526
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0047526
  - number: '4.3'
    text: |-
      Indien de werkende na ontvangst van een tegemoetkoming tevens een betaling, van de werkgever dan wel opdrachtgever
      ontvangt in verband met dezelfde ernstige aandoening als waarvoor de tegemoetkoming is toegekend, ongeacht de vorm
      waarin de betaling is gedaan en de aard van de kosten waarin de betaling voorziet:
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel4
  - number: 4.3.a
    text: doet de werkende aan de SVB onverwijld mededeling van ontvangst van deze betaling; en
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel4
  - number: 4.3.b
    text: |-
      betaalt de werkende de tegemoetkoming voor het geheel of, wanneer de betaling lager is dan de verleende
      tegemoetkoming, de tegemoetkoming voor dat deel binnen twaalf weken na ontvangst van de betaling terug aan de SVB.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel4
  - number: '4.4'
    text: |-
      De werkende heeft geen recht op een tegemoetkoming op grond van deze regeling indien de werkende een tegemoetkoming
      of voorschot heeft ontvangen of een aanvraag om een tegemoetkoming voor dezelfde ernstige aandoening onherroepelijk
      is afgewezen op grond van:
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel4
  - number: 4.4.a
    text: |-
      de [Regeling tegemoetkoming asbestslachtoffers 2014][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035006
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0035006
  - number: 4.4.b
    text: |-
      de [Regeling tegemoetkoming niet-loondienstgerelateerde slachtoffers van mesothelioom en asbestose][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022913
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0022913
  - number: 4.4.c
    text: |-
      de [Regeling tegemoetkoming werknemers met CSE][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0043193
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0043193
  - number: 4.4.d
    text: |-
      het Reglement eenmalige uitkering silicosevergoeding oud-mijnwerkers. De werkende heeft evenmin recht op een
      tegemoetkoming indien een aanvraag voor een tegemoetkoming op grond van een van de genoemde regelingen is ingediend
      en op die aanvraag niet onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel4
  - number: '5'
    text: |-
      De nabestaanden hebben, onder dezelfde voorwaarden, in plaats van de werkende recht op een tegemoetkoming indien de
      werkende is overleden nadat de aanvraag is ingediend door de werkende, doch voordat op de aanvraag is beslist, en
      de werkende recht op een tegemoetkoming zou hebben gehad.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel5
  - number: '6.1'
    text: De eenmalige tegemoetkoming bedraagt € 27.030.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien een of meer werkgevers of een of meer opdrachtgevers een bedrag hebben betaald aan de werkende in
      verband met dezelfde ernstige aandoening, of indien de werkende betalingen heeft ontvangen als bedoeld
      in [artikel 7][ref1], dat in totaal lager is dan het bedrag van de tegemoetkoming, wordt de hoogte van de
      tegemoetkoming vastgesteld op het positieve verschil tussen de ontvangen bedragen en het bedrag, genoemd in het
      eerste lid, ongeacht de vorm waarin de betaling is gedaan en de aard van de kosten waarin de betaling voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0047535#Artikel7
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0047535
        artikel: '7'
        hoofdstuk: '2'
  - number: '6.3'
    text: |-
      Voor de toepassing van het tweede lid wordt als maatstaf genomen de hoogte van de betalingen nadat daarop de
      verschuldigde belasting op grond van de [Wet inkomstenbelasting 2001][ref1] en premies voor de volksverzekeringen
      op grond van de [Wet financiering sociale verzekeringen][ref2] in mindering zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0017745
  - number: '7'
    text: |-
      Indien de werkende ook vanwege voor een werkgever of opdrachtgever verrichte arbeid buiten Nederland een betaling
      heeft ontvangen van deze werkgever of opdrachtgever in verband met dezelfde ernstige aandoening, wordt bij de
      vaststelling van het recht op een tegemoetkoming op overeenkomstige wijze gehandeld als bij de toepassing van
      [artikel 6, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047535#Artikel6
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0047535
        artikel: '6'
        hoofdstuk: '2'
  - number: '8.1'
    text: |-
      De aanvraag voor de tegemoetkoming wordt door de werkende bij de SVB ingediend door middel van een door de SVB
      beschikbaar gesteld aanvraagformulier, dat door de werkende wordt ondertekend.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel8
  - number: '8.2'
    text: |-
      Na advisering door het ISBG bedoeld in [artikel 15][ref1], stelt de SVB vast of voor de werkende recht op een
      tegemoetkoming bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0047535#Artikel15
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0047535
        artikel: '15'
        hoofdstuk: '5'
  - number: '8.3'
    text: |-
      In bijzondere gevallen kan de SVB toestaan dat een aanvraag wordt ingediend anders dan door middel van het
      aanvraagformulier, bedoeld in het eerste lid, zo nodig onder het stellen van voorwaarden.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel8
  - number: '8.4'
    text: |-
      Indien de werkende voor meer ernstige aandoeningen een aanvraag voor de tegemoetkoming indient, wordt in overleg
      met de werkende de volgorde van behandeling bepaald door de SVB. Daarbij wordt de werkende in de gelegenheid
      gesteld zijn voorkeur voor de volgorde van behandeling aan te geven. De behandeling van de tweede en eventuele
      volgende aanvragen wordt opgeschort totdat de SVB op de eerste aanvraag een besluit heeft genomen.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel8
  - number: '8.5'
    text: |-
      Indien de aanvraag of de ondersteunende documenten in een andere taal dan de Nederlandse taal zijn gesteld, wordt
      op verzoek van de SVB of het ISBG zo nodig een vertaling in het Nederlands overgelegd die is opgesteld door een
      beëdigd vertaler. Indien de SVB of het ISBG daarmee instemt, kan een vertaling van de aanvraag of de ondersteunende
      documenten in een andere taal dan het Nederlands worden overgelegd. Afschriften van de ondersteunende documenten in
      een andere taal dan het Nederlands zijn gewaarmerkt.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel8
  - number: '8.6'
    text: |-
      De termijn, bedoeld in [artikel 4:13, eerste lid, van de Algemene wet bestuursrecht][ref1], waarbinnen de SVB een
      besluit dient te nemen over de aanvraag is 16 weken. Deze termijn kan eenmalig met ten hoogste 16 weken worden
      verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '8.7'
    text: |-
      Indien de SVB vaststelt dat de werkende één of meer van de gegevens, noodzakelijk voor het vaststellen van
      het recht op de tegemoetkoming, bedoeld in [artikel 4, eerste lid][ref1], niet heeft verstrekt, stelt de SVB
      de werkende in de gelegenheid het ontbrekende gegeven of de ontbrekende gegevens alsnog binnen acht weken te
      verstrekken. Wordt het gegeven of worden de gegevens niet binnen die acht weken verstrekt, dan wordt de aanvraag
      buiten behandeling gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0047535#Artikel4
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0047535
        artikel: '4'
        hoofdstuk: '2'
  - number: '9.1'
    text: |-
      De behandeling van de aanvraag wordt in de situatie dat de werkende is overleden nadat de aanvraag is ingediend
      door de werkende, doch voordat op de aanvraag is beslist, ten behoeve van de nabestaanden voortgezet, tenzij deze
      schriftelijk aan de SVB te kennen geven daarop geen prijs te stellen.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien er meer dan één nabestaande is, dragen de nabestaanden er zorg voor dat aan één van hen een volmacht wordt
      verleend tot vertegenwoordiging ten behoeve van de uitvoering van deze regeling, het in ontvangst nemen van de
      tegemoetkoming daarbij inbegrepen.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel9
  - number: '10.1'
    text: |-
      De werkende verstrekt de SVB, het ISBG en de door het ISBG aangewezen personen of instellingen bij de indiening van
      de aanvraag voor een tegemoetkoming in ieder geval de bewijsstukken die noodzakelijk zijn om te beoordelen of de
      werkende een ernstige aandoening heeft die als beroepsziekte te kwalificeren kan zijn, waaronder in ieder geval een
      door een bevoegde arts vastgestelde diagnose van de ernstige aandoening.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel10
  - number: '10.2'
    text: |-
      In verband met de voorwaarde dat de werkende aannemelijk maakt dat de ernstige aandoening is veroorzaakt door
      blootstelling aan één of meer gevaarlijke stoffen bij het verrichten van arbeid als werkende, verstrekt de werkende
      aan de SVB, het ISBG en de door het ISBG aangewezen personen of instellingen, bij de indiening van de aanvraag om
      een tegemoetkoming, de inlichtingen en zo mogelijk bewijsstukken omtrent:
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel10
  - number: 10.2.a
    text: de blootstelling aan de gevaarlijke stof of stoffen bij het verrichten van arbeid als werkende;
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel10
  - number: 10.2.b
    text: de periode gedurende welke die blootstelling aan de gevaarlijke stof of stoffen heeft plaatsgevonden; en
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel10
  - number: 10.2.c
    text: |-
      degenen die in verband met de arbeid waarbij de blootstelling aan de gevaarlijke stof of stoffen heeft
      plaatsgevonden als werkgever dan wel als opdrachtgever worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel10
  - number: '10.3'
    text: |-
      De werkende verstrekt de SVB, het ISBG en de door het ISBG aangewezen personen of instellingen op verzoek of uit
      eigen beweging de overige inlichtingen en bewijsstukken die nodig zijn voor de uitvoering van deze regeling en
      verleent ook de medewerking die redelijkerwijs vereist is.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel10
  - number: '10.4'
    text: |-
      Indien de aanvraag om een tegemoetkoming van de werkende na diens overlijden wordt voortgezet ten behoeve van de
      nabestaanden, is dit artikel op hen van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel10
  - number: '11.1'
    text: De SVB betaalt een tegemoetkoming zo spoedig mogelijk uit aan de werkende.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel11
  - number: '11.2'
    text: |-
      Indien [artikel 9, tweede lid][ref1], van toepassing is, betaalt de SVB de tegemoetkoming zo spoedig mogelijk na
      ontvangst van een volmacht uit aan de nabestaande.


      [ref1]: https://wetten.overheid.nl/BWBR0047535#Artikel9
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0047535
        artikel: '9'
        hoofdstuk: '3'
  - number: '12.1'
    text: |-
      De SVB herziet een besluit tot toekenning van een tegemoetkoming of trekt dat in, indien degene aan wie de
      tegemoetkoming is toegekend of de nabestaande hiervan:
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel12
  - number: 12.1.a
    text: |-
      nadien alsnog een betaling heeft ontvangen waarmee rekening zou zijn gehouden bij de vaststelling van het recht op
      de tegemoetkoming; of
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel12
  - number: 12.1.b
    text: |-
      een voorwaarde of verplichting als bedoeld in de [artikelen 4, eerste lid, onder b, of tweede lid][ref1], of
      [10][ref2] niet of niet behoorlijk is nagekomen en dit heeft geleid tot het ten onrechte of tot een te hoog bedrag
      verlenen van de tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0047535#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0047535#Artikel10
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0047535
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0047535
        artikel: '10'
        hoofdstuk: '3'
  - number: '12.2'
    text: |-
      De tegemoetkoming die als gevolg van een besluit als bedoeld in het eerste lid, ten onrechte of tot een te
      hoog bedrag is verleend, alsmede hetgeen anderszins onverschuldigd is betaald, wordt van degene aan wie een
      tegemoetkoming is toegekend, of de nabestaande hiervan, teruggevorderd. Indien [artikel 9][ref1] toepassing heeft
      gevonden, wordt teruggevorderd van de nabestaande, bedoeld in artikel 9, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0047535#Artikel9
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0047535
        artikel: '9'
        hoofdstuk: '3'
  - number: '12.3'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn, kan de SVB besluiten geheel of gedeeltelijk van herziening,
      intrekking of terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel12
  - number: '13'
    text: |-
      Het bedrag, genoemd in [artikel 6, eerste lid][ref1], wordt jaarlijks herzien
      op 1 januari. Het bedrag wordt herzien in de mate waarin het bedrag genoemd in
      [artikel 8, eerste lid, onder b, van de Wet minimumloon en minimumvakantiebijslag][ref2] in het voorgaande
      kalenderjaar is herzien op grond van [artikel 14, eerste en tweede lid, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0047535#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0047535
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '14'
    text: Deze regeling wordt uitgevoerd door de SVB.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel14
  - number: '15.1'
    text: |-
      Het ISBG adviseert de SVB over het voldoen van de aanvraag aan de voorwaarden voor het recht op een tegemoetkoming,
      waaronder inbegrepen het niet nakomen van de verplichtingen op grond van deze regeling en de toepasselijkheid van
      eventuele beperkingen met betrekking tot het recht op een tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel15
  - number: '15.2'
    text: |-
      Het ISBG vraagt in het kader van de advisering, bedoeld in het eerste lid, aan het Bureau Lexces om ervoor
      zorg te dragen dat het Deskundigenpanel een oordeel vormt of voldaan is aan de vereisten die gesteld zijn in
      [artikel 4, eerste lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047535#Artikel4
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0047535
        artikel: '4'
        hoofdstuk: '2'
  - number: '15.3'
    text: |-
      Het Deskundigenpanel bestaat uit een of meer kamers. Voor een zitting van een kamer worden een voorzitter en
      maximaal vier leden aangewezen. Deze personen vervullen geen functies of nevenfuncties die kunnen conflicteren met
      onafhankelijke en onpartijdige advisering, noch hebben zij deze functies vervuld gedurende een jaar voordat zij een
      rol vervulden als lid van het Deskundigenpanel. Het Bureau Lexces, gehoord hebbende het Deskundigenpanel, stelt ten
      behoeve van de werkzaamheden een reglement vast.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel15
  - number: '15.4'
    text: |-
      Indien het ISBG zich bij de advisering laat ondersteunen door derden, waarborgt het ISBG in een met de derde te
      sluiten overeenkomst de voortgang, de kwaliteit en het vertrouwelijke karakter van de ondersteunende werkzaamheden.
      Het ISBG behoudt de volledige verantwoordelijkheid voor de ondersteunende werkzaamheden die worden verricht door
      de derde.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel15
  - number: '16.1'
    text: |-
      De SVB en het ISBG stellen een samenwerkingsovereenkomst op betreffende de samenwerking en werkwijze in het kader
      van de uitvoering van deze regeling, waarin ten minste wordt vastgelegd:
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel16
  - number: 16.1.a
    text: |-
      op welke wijze en binnen welke termijn de behandeling van aanvragen om een tegemoetkoming en de advisering ter
      zake plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel16
  - number: 16.1.b
    text: op welke wijze de juistheid en de volledigheid van de verkregen inlichtingen wordt onderzocht;
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel16
  - number: 16.1.c
    text: op welke wijze gegevens worden verwerkt, beheerd en uitgewisseld;
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel16
  - number: 16.1.d
    text: op welke wijze voorlichting en informatievoorziening aan belanghebbenden wordt ingericht;
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel16
  - number: 16.1.e
    text: |-
      welke vergoeding door de SVB aan het ISBG, op basis van een jaarlijks door het ISBG ingediende begroting, zal
      worden verstrekt voor de advisering door het ISBG en de werkzaamheden van de door het ISBG ingeschakelde derden;
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel16
  - number: 16.1.f
    text: op welke wijze de verstrekking van de vergoeding, bedoeld onder e zal worden ingericht;
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel16
  - number: 16.1.g
    text: |-
      dat periodiek overleg zal worden gevoerd betreffende de uitvoering van deze regeling, alsmede de frequentie
      daarvan;
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel16
  - number: 16.1.h
    text: |-
      welke informatie door het ISBG aan de SVB wordt verstrekt ten behoeve van de informatieverplichting aan de
      minister; en
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel16
  - number: 16.1.i
    text: hoe uit de overeenkomst voortvloeiende geschillen worden beslecht.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel16
  - number: '16.2'
    text: |-
      Het ISBG en het Bureau Lexces stellen in samenspraak met de SVB een overeenkomst op betreffende de samenwerking en
      werkwijze in het kader van de advisering van deze regeling, waarin ten minste wordt vastgelegd:
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel16
  - number: 16.2.a
    text: |-
      op welke wijze en binnen welke termijn de beoordeling of een aandoening van de werkende een beroepsziekte is,
      plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel16
  - number: 16.2.b
    text: op welke wijze gegevens worden verwerkt, beheerd en uitgewisseld;
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel16
  - number: 16.2.c
    text: |-
      dat periodiek overleg zal worden gevoerd betreffende de uitvoering van deze regeling, alsmede de frequentie
      daarvan; en
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel16
  - number: 16.2.d
    text: hoe uit de overeenkomst voortvloeiende geschillen worden beslecht.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel16
  - number: '17.1'
    text: |-
      Voor de datum, bedoeld in de eerste volzin van [artikel 5.3, eerste lid, van de Regeling SUWI][ref1] verstrekt
      de SVB aan de minister in het jaarplan met begroting een opgave van het totaalbedrag aan de voor het komende
      jaar geraamde baten en lasten met betrekking tot deze regeling, uitgesplitst naar uitkeringslasten per maand en
      uitvoeringskosten per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013280#Artikel5
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013280
        artikel: '5'
  - number: '17.2'
    text: |-
      In de opgave van de uitkeringslasten, bedoeld in het eerste lid, wordt rekening gehouden met de posten genoemd in
      [artikel 19, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047535#Artikel19
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0047535
        artikel: '19'
        hoofdstuk: '5'
  - number: '18.1'
    text: |-
      De uitkeringslasten en uitvoeringskosten van deze regeling worden gefinancierd uit een rijksbijdrage ten laste van
      de begroting van de minister.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel18
  - number: '18.2'
    text: |-
      De minister stort op de rekening-courant, bedoeld in [artikel 5.16, onderdeel a, van de Regeling Wfsv][ref1], een
      periodiek voorschot op het bedrag, bedoeld in [artikel 17, eerste lid][ref2], van:


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0047535#Artikel17
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0047535
        artikel: '17'
        hoofdstuk: '5'
  - number: 18.2.a
    text: de geraamde uitkeringslasten met als valutadatum de tweeëntwintigste dag van elke maand; en
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel18
  - number: 18.2.b
    text: 1/12de deel van de geraamde uitvoeringskosten met als valutadatum de vijftiende dag van elke maand.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel18
  - number: '18.3'
    text: De minister kan, na overleg met de SVB, van de in het tweede lid bedoelde voorschotten afwijken.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel18
  - number: '19.1'
    text: |-
      In de jaarrekening, bedoeld in [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      worden de baten en lasten, alsmede de ontvangen periodieke voorschotten, bedoeld in [artikel 18, tweede lid][ref2],
      uitgesplitst naar uitkeringslasten en uitvoeringskosten, met betrekking tot deze regeling opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0047535#Artikel18
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0047535
        artikel: '18'
        hoofdstuk: '5'
  - number: '19.2'
    text: 'Op de in het eerste lid bedoelde uitkeringslasten komen in mindering:'
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel19
  - number: 19.2.a
    text: |-
      de bedragen die op grond van [artikel 4, eerste lid, onder b, en derde lid][ref1], zijn terugbetaald; en


      [ref1]: https://wetten.overheid.nl/BWBR0047535#Artikel4
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0047535
        artikel: '4'
        hoofdstuk: '2'
  - number: 19.2.b
    text: |-
      de bedragen die op grond van [artikel 12][ref1] zijn teruggevorderd en zijn terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0047535#Artikel12
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0047535
        artikel: '12'
        hoofdstuk: '4'
  - number: '19.3'
    text: |-
      Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1], rekent de minister de baten en
      lasten, alsmede de ontvangen periodieke voorschotten, met betrekking tot het desbetreffende kalenderjaar af, met
      als valutadatum 1 juni van het hierop volgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '34'
  - number: '23'
    text: |-
      [Artikel 4, vierde lid][ref1], is niet van toepassing op een werkende wiens verzoek om toekenning van een
      tegemoetkoming op grond van de [Regeling tegemoetkoming werknemers met CSE][ref2] is afgewezen uitsluitend wegens
      het niet voldoen aan de verplichting, genoemd in [artikel 3, eerste lid, onderdeel e, van die regeling][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0047535#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0043193
      [ref3]: https://wetten.overheid.nl/BWBR0043193#Artikel3
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0047535
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0043193
      - id: ref3
        bwb_id: BWBR0043193
        artikel: '3'
  - number: '24'
    text: |-
      De minister zendt binnen vijf jaar na de inwerkingtreding van deze regeling aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze regeling in de praktijk.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel24
  - number: '25'
    text: Deze regeling treedt in werking met ingang van 1 januari 2023.
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel25
  - number: '26'
    text: 'Deze regeling wordt aangehaald als: Regeling tegemoetkoming stoffengerelateerde beroepsziekten.'
    url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#Artikel26
