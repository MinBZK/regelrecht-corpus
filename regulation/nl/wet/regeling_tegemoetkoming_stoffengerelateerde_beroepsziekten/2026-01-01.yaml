      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel610
