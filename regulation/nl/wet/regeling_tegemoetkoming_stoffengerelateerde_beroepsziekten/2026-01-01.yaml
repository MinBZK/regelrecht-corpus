preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, en 9 van de Kaderwet SZW-subsidies, en 34a van de Wet structuur
    uitvoeringsorganisatie werk en inkomen;

    BESLUIT:
  url: https://wetten.overheid.nl/BWBR0047535/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *beroepsziekte:* een ernstige aandoening die vermeld is op de bij deze
      regeling behorende Lijst beroepsziekten, opgenomen in de bijlage;
        - *Deskundigenpanel:* Deskundigenpanel beroepsziekten als bedoeld in de [artikelen 4][ref1] en [15][ref2];
        - *gevaarlijke stof:* een stof die vermeld is op de bij deze regeling behorende Lijst beroepsziekten, opgenomen in
      de bijlage;
        - *ISBG:* stichting Instituut Slachtoffers Beroepsziekten door Gevaarlijke stoffen, gevestigd te ’s-Gravenhage;
        - *Bureau Lexces:* Bureau Landelijk Expertisecentrum Stoffengerelateerde Beroepsziekten, ondergebracht bij het
      Rijksinstituut voor Volksgezondheid en Milieu, gevestigd te Bilthoven;
        - *minister:* Minister van Sociale Zaken en Werkgelegenheid;
        - *nabestaanden:* a. de langstlevende van de echtgenoten; b. bij ontstentenis van de onder a bedoelde persoon, de
      minderjarige kinderen, tot wie de overledene in familierechtelijke betrekking stond; c. bij ontstentenis van de
      onder a en b bedoelde personen, de personen met wie de overledene in gezinsverband leefde; d. bij ontstentenis van
      de onder a, b en c bedoelde personen, de erfgenamen, bedoeld in [Boek 4 van het Burgerlijk Wetboek][ref3], mits een
      verklaring van erfrecht wordt overgelegd;
        - *opdrachtgever:* natuurlijke persoon of rechtspersoon voor wie de zelfstandige zonder
      personeel arbeid in Nederland verricht of heeft verricht krachtens een overeenkomst, waarop
      Nederlands recht van toepassing is of was, niet zijnde een arbeidsovereenkomst als bedoeld in
      [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref4];
        - *SVB:* Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5];
        - *uitkeringslasten:* de kosten van het aantal tegemoetkomingen dat is uitgekeerd;
        - *uitvoeringskosten:* a. kosten die door de SVB zijn gemaakt bij het uitvoeren van deze regeling; en b.
      vergoedingen die door de SVB aan het ISBG worden verstrekt voor de advisering ten behoeve van deze regeling;
        - *werkende:* werknemer of zelfstandige zonder personeel;
        - *werkgever:* natuurlijke persoon of rechtspersoon voor wie de werknemer arbeid in Nederland verricht of heeft
      verricht krachtens een Nederlandse publiekrechtelijke aanstelling of een arbeidsovereenkomst als bedoeld in
      [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref6], waarop Nederlands recht van toepassing is
      of was;
        - *werknemer:* degene die voor een natuurlijke persoon of rechtspersoon arbeid in Nederland verricht of heeft
      verricht krachtens een Nederlandse publiekrechtelijke aanstelling of een arbeidsovereenkomst als bedoeld in
      [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref7], waarop Nederlands recht van toepassing is
      of was;
        - *zelfstandige zonder personeel:* degene die zonder werknemer, werkgever of opdrachtgever te zijn, voor een
      natuurlijke persoon of rechtspersoon arbeid in Nederland verricht of heeft verricht krachtens een overeenkomst,
      waarop Nederlands recht van toepassing is of was.


      [ref1]: https://wetten.overheid.nl/BWBR0047535#Artikel4
