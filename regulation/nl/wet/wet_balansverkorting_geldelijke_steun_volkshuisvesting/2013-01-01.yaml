---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_balansverkorting_geldelijke_steun_volkshuisvesting
regulatory_layer: WET
publication_date: '2015-04-16'
valid_from: '2013-01-01'
bwb_id: BWBR0007419
url: https://wetten.overheid.nl/BWBR0007419/2013-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voorschriften te geven, strekkend tot structurele
    wijziging en vereenvoudiging van verleende geldelijke steun ten behoeve van de volkshuisvesting;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel1
  - number: 1.1.a
    text: |-
      toegelaten instelling: voor 1 januari 1995 ingevolge [artikel 70 van de Woningwet][ref1] als zodanig aangewezen
      instelling,


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
  - number: 1.1.b
    text: |-
      woningen: te verhuren of verhuurde woningen, bejaardenwoningen, wooneenheden in verzorgingstehuizen voor bejaarden
      en te verhuren of verhuurde woningen en wooneenheden in woongebouwen met een bijzonder karakter,
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel1
  - number: 1.1.c
    text: 'bijdrage: ingevolge de desbetreffende regeling of deze wet te ontvangen jaarlijkse bijdrage of bijdrage ineens,'
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel1
  - number: 1.1.d
    text: |-
      woongelegenheid: woning of bejaardenoord als bedoeld in de Wet op de bejaardenoorden, zoals die wet luidde voor de
      intrekking van die wet,
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel1
  - number: 1.1.e
    text: 'Onze Minister: Onze Minister voor Wonen, Wijken en Integratie.'
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van deze wet wordt, voor zover niet anders is bepaald, onder toegelaten instelling mede verstaan
      een instelling welke na 1 januari 1995 doch voor 1 januari 1997 ingevolge [artikel 70 van de Woningwet][ref1] als
      zodanig is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
  - number: '2.1'
    text: |-
      Onze Minister stelt voor elke in een gemeente werkzame toegelaten instelling afzonderlijk de som vast van de
      contante waarden op 1 januari 1995 van de, uit hoofde van geldelijke steun aan de gemeente verleend krachtens
      [artikel 67 van de Woningwet 1962][ref1] of [artikel 56 van de Woningwet][ref2] 1901 met het oog op de toepassing
      van artikel 60 onderscheidenlijk artikel 51 van die wetten, op of na die datum te ontvangen bijdragen voor woningen
      welke op die datum in eigendom zijn van die toegelaten instelling of die zijn onderworpen aan een recht van
      erfpacht dat toebehoort aan die toegelaten instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002379#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel56
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002379
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '56'
  - number: '2.2'
    text: |-
      Het in het eerste lid bepaalde geldt mede voor de geldelijke steun voor woningen die deel uitmaken van het op of
      na 1 januari 1995 doch voor 1 januari 1997 door een toegelaten instelling als bedoeld in artikel 1, eerste lid,
      van een andere rechtspersoon zonder winstoogmerk verworven totale bezit aan woningen die deel uitmaakten van een
      bejaardenoord als bedoeld in artikel 1, onderdeel *c*, van de Wet op de bejaardenoorden, zoals die wet luidde voor
      de intrekking van die wet.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het eerste lid is voor de gemeente van overeenkomstige toepassing ten aanzien van door die gemeente te ontvangen
      bijdragen voor woningen, in eigendom van de gemeente zelf.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister stelt de in [artikel 2][ref1] bedoelde som vast op grond van de hem ter beschikking staande gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
  - number: '3.2'
    text: |-
      Na de vaststelling, bedoeld in het eerste lid, verzoekt Onze Minister de gemeente en de toegelaten instelling
      binnen een door hem gestelde termijn de gegevens en bescheiden te verstrekken die nodig zijn voor nadere
      vaststelling van de in [artikel 2][ref1] bedoelde som.


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
  - number: '3.3'
    text: |-
      Onze Minister stelt de in [artikel 2][ref1] bedoelde som nader vast binnen een jaar na het verstrijken van de door
      hem krachtens het tweede lid gestelde termijn doch in elk geval binnen vijf jaar na de in het eerste lid bedoelde
      vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
  - number: '4.1'
    text: |-
      Voor de toepassing van de [artikelen 2][ref1] en [3][ref2] wordt voor het tijdvak van de geldigheidsduur van de
      beschikkingen tot verlening van bijdragen met een ingangsdatum voor 1 januari 1995 overeenkomstig de desbetreffende
      regelingen uitgegaan van de jaarlijkse stijging van de variabele exploitatiekosten, het rendement over het
      geïnvesteerd vermogen en de jaarlijkse stijging van de huur als in die beschikkingen is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007419#Artikel3
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007419
        artikel: '3'
  - number: '4.2'
    text: |-
      Voor het tijdvak na het verstrijken van de geldigheidsduur van de in het eerste lid bedoelde beschikkingen
      overeenkomstig de desbetreffende regelingen wordt uitgegaan van:
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel4
  - number: 4.2.a
    text: een jaarlijkse stijging van de variabele exploitatiekosten met 3 procent,
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel4
  - number: 4.2.b
    text: een rendement over het geïnvesteerd vermogen van 7 procent, en
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel4
  - number: 4.2.c
    text: een jaarlijkse stijging van de huur met 5 procent met ingang van 1 juli 1995.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel4
  - number: '4.3'
    text: |-
      Indien geldelijke steun is verleend met toepassing van de Beschikking geldelijke steun huurwoningen 1975 of de
      Regeling geldelijke steun huurwoningen in proefgemeenten normkostensysteem 1986, wordt voorts voor elk tijdvak van
      tien jaar, ingaande op of na 1 januari 1995, rekening gehouden met een dynamische kostprijshuur als bedoeld in die
      regelingen, met dien verstande dat bij de berekening daarvan wordt uitgegaan van:
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel4
  - number: 4.3.a
    text: een jaarlijkse stijging van de variabele exploitatiekosten met 0 procent,
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel4
  - number: 4.3.b
    text: een rendement over het geïnvesteerd vermogen van 7 procent, en
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel4
  - number: 4.3.c
    text: |-
      een jaarlijkse stijging van de huur met 0 procent voor woningen voor welke op het tijdstip van toekenning van de
      geldelijke steun tevens een lening werd verstrekt als bedoeld in [artikel 60, derde lid, onderdeel ][ref1], en van
      5 procent voor andere woningen.


      [ref1]: https://wetten.overheid.nl/BWBR0002379#Artikel60
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002379
        artikel: '60'
  - number: '4.4'
    text: |-
      Indien geldelijke steun is verleend met toepassing van de Regeling geldelijke steun huurwoningen normkostensysteem
      1988, wordt voorts voor elk tijdvak van tien jaar, ingaande op of na 1 januari 1995, rekening gehouden met een
      dynamische kostprijshuur als bedoeld in die regeling, met dien verstande dat bij de berekening daarvan wordt
      uitgegaan van:
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel4
  - number: 4.4.a
    text: een jaarlijkse stijging van de variabele exploitatiekosten met 0 procent,
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel4
  - number: 4.4.b
    text: een rendement over het geïnvesteerd vermogen van 7 procent, en
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel4
  - number: 4.4.c
    text: een jaarlijkse stijging van de huur met 0 procent.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel4
  - number: '4.5'
    text: |-
      Onze Minister kan voor de toepassing van daarbij aan te geven krachtens de [Woningwet 1962][ref1] of de
      [Woningwet][ref2] 1901 gegeven ministeriële regelingen een ander percentage van de jaarlijkse stijging van de huur
      vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002379
      [ref2]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002379
      - id: ref2
        bwb_id: BWBR0005181
  - number: '5.1'
    text: |-
      Een ingevolge de [artikelen 2][ref1] en [3, eerste lid][ref2], gegeven beschikking heeft tot gevolg dat:


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007419#Artikel3
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007419
        artikel: '3'
  - number: 5.1.a
    text: |-
      een verbintenis van het Rijk jegens de gemeente uit hoofde van geldelijke steun, verleend op grond van
      [artikel 67 van de Woningwet 1962][ref1] of [artikel 56 van de Woningwet][ref2] 1901, teniet gaat, voor zover deze
      strekt tot betaling van bijdragen uit hoofde van verleende geldelijke steun over het tijdvak na de inwerkingtreding
      van de beschikking,


      [ref1]: https://wetten.overheid.nl/BWBR0002379#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel56
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002379
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '56'
  - number: 5.1.b
    text: |-
      ten laste van het Rijk een verbintenis ontstaat tot betaling aan de gemeente van de ingevolge de
      [artikelen 2][ref1] en [3, eerste lid][ref2], vastgestelde som,


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007419#Artikel3
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007419
        artikel: '3'
  - number: 5.1.c
    text: |-
      vorderingen van het Rijk uit hoofde van leningen, aan de gemeente verstrekt krachtens
      [artikel 67 van de Woningwet 1962][ref1] of [artikel 56 van de Woningwet][ref2] 1901 berekend naar de stand op 1
      januari 1995, met inbegrip van de verschuldigde rente tot die datum in hun geheel opeisbaar worden,


      [ref1]: https://wetten.overheid.nl/BWBR0002379#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel56
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002379
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '56'
  - number: 5.1.d
    text: |-
      de verbintenis van de gemeente jegens de toegelaten instelling uit hoofde van geldelijke steun, verleend op grond
      van [artikel 60 van de Woningwet 1962][ref1] of [artikel 51 van de Woningwet][ref2] 1901, teniet gaat, voor zover
      deze strekt tot betaling van een of meer bijdragen over het tijdvak na de inwerkingtreding van de beschikking,


      [ref1]: https://wetten.overheid.nl/BWBR0002379#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel51
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002379
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '51'
  - number: 5.1.e
    text: |-
      ten laste van de gemeente een verbintenis ontstaat tot betaling aan de toegelaten instelling van de ingevolge de
      [artikelen 2][ref1] en [3, eerste lid][ref2], vastgestelde som,


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007419#Artikel3
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007419
        artikel: '3'
  - number: 5.1.f
    text: |-
      vorderingen van de gemeente uit hoofde van leningen, aan de toegelaten instelling verstrekt krachtens
      [artikel 60 van de Woningwet 1962][ref1] of [artikel 51 van de Woningwet][ref2] 1901, berekend naar de stand op 1
      januari 1995, met inbegrip van de verschuldigde rente tot die datum, voor zover deze betrekking hebben op door het
      Rijk aan de gemeente verstrekte leningen als bedoeld in onderdeel *c*, in hun geheel opeisbaar worden, en


      [ref1]: https://wetten.overheid.nl/BWBR0002379#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel51
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002379
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '51'
  - number: 5.1.g
    text: |-
      het verschuldigde uit hoofde van leningen als bedoeld in de onderdelen *c* en *f*, voor zover de uit het
      verstrekken van die leningen ontstane verbintenissen niet ingevolge [artikel 8][ref1] te niet gaan, bevrijdend kan
      worden betaald, zonder dat overeengekomen boeten of kosten verschuldigd worden.


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel8
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '8'
  - number: '5.2'
    text: |-
      De schulden als bedoeld in het eerste lid, onderdelen *b* en *e*, worden vermeerderd met een rente van 6,75 procent
      per jaar, te rekenen vanaf 1 januari 1995 tot de inwerkingtreding van de beschikking en vervolgens verminderd met
      de in onderdeel *a*, onderscheidenlijk onderdeel *d*, bedoelde bijdragen die op of na 1 januari 1995 zijn of worden
      betaald, vermeerderd met een rente van 6,75 procent per jaar over die bijdragen, berekend over het tijdvak van de
      betaling tot de inwerkingtreding van de beschikking.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel5
  - number: '5.3'
    text: |-
      De vorderingen als bedoeld in het eerste lid, onderdelen *c* en *f*, worden vermeerderd met een rente van 6,75
      procent per jaar, te rekenen vanaf 1 januari 1995 tot de inwerkingtreding van de beschikking en vervolgens
      verminderd met de daarop op of na 1 januari 1995 betaalde bedragen, vermeerderd met een rente van 6,75 procent per
      jaar over die bedragen, berekend over het tijdvak van de betaling tot de inwerkingtreding van de beschikking.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister verleent aan de toegelaten instelling of gemeente aan welke een of meer leningen zijn
      verstrekt op grond van artikel 60, derde lid, onderdeel *a*, of artikel 67 voor de toepassing van
      [artikel 61 van de Woningwet 1962][ref1] of op grond van [artikel 56 van de Woningwet][ref2] 1901 een rentebijdrage
      op een aanvraag ingediend binnen zes maanden na de inwerkingtreding van de beschikking tot vaststelling, bedoeld in
      de [artikelen 2][ref3] en [3, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002379#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0007419#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007419#Artikel3
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002379
        artikel: '61'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '56'
      - id: ref3
        bwb_id: BWBR0007419
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0007419
        artikel: '3'
  - number: '6.2'
    text: 'De rentebijdrage is gelijk aan:'
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel6
  - number: 6.2.a
    text: |-
      de som van de per jaar berekende contante waarden op 1 november 1993 van de rente die over het tijdvak vanaf de
      vervroegde aflossing of de inwerkingtreding van een ingevolge de [artikelen 2][ref1] en [3, eerste lid][ref2],
      gegeven beschikking tot de datum van de eerste renteherziening van de in het eerste lid bedoelde leningen
      verschuldigd is of zou zijn, indien op de kapitaalmarkt of bij een gemeente ter vervanging van die leningen een
      of meer leningen zijn of zouden zijn gesloten met een gelijke hoofdsom en met gelijke aflossingsvoorwaarden,
      verminderd met


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007419#Artikel3
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007419
        artikel: '3'
  - number: 6.2.b
    text: |-
      de som van de per jaar berekende contante waarden op 1 november 1993 van de rente die over de in het eerste lid
      bedoelde leningen verschuldigd zou zijn, over het in onderdeel *a* bedoelde tijdvak indien die leningen niet
      vervroegd zouden zijn afgelost of die leningen niet opeisbaar zouden zijn geworden, en vermeerderd met de contante
      waarde op 1 november 1993 van de kosten die de toegelaten instelling aan het Waarborgfonds sociale woningbouw of
      aan een gemeente verschuldigd is voor borgstelling terzake van de in onderdeel *a* bedoelde vervangende leningen
      tot ten hoogste 0,75 procent van de hoofdsom van die leningen, mits deze leningen zijn gesloten binnen zes maanden
      na de inwerkingtreding van de beschikking tot vaststelling bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel3
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '3'
  - number: '6.3'
    text: |-
      Indien een gemeente of toegelaten instelling geen vervangende lening heeft gesloten als bedoeld in het tweede lid,
      onderdeel *a*, is het rentepercentage het op de datum van de vervroegde aflossing geldende gemiddelde effectief
      rendement van staatsobligaties met een resterende looptijd van vijf tot acht jaar, zoals dit door het Centraal
      Bureau voor de Statistiek op die datum wordt bekend gemaakt, dan wel het dagrendement zoals laatstelijk voor die
      datum bekendgemaakt, verhoogd met het door Onze Minister vastgestelde gemiddelde verschil tussen genoemd rendement
      en het rendement van leningen zoals aangeboden aan gemeenten en andere openbare lichamen, met een looptijd van 10
      jaren, een vast rentepercentage en aflossing ineens, een en ander naar boven op 0,125 procent afgerond.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel6
  - number: '6.4'
    text: |-
      Het eerste lid is niet van toepassing op leningen die voor 1 november 1993 zijn afgelost of voor die datum door de
      gemeente bij Onze Minister voor vervroegde aflossing zijn aangemeld.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel6
  - number: '6.5'
    text: Een beschikking krachtens het eerste lid wordt gegeven binnen een jaar na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel6
  - number: '6.6'
    text: |-
      Over schulden, voortvloeiend uit beschikkingen gegeven krachtens het eerste lid, is een rente verschuldigd van 6,75
      procent, te rekenen vanaf 1 november 1993.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel6
  - number: '6.7'
    text: |-
      Geen rente is verschuldigd met ingang van de dag waarop Onze Minister de gemeente of toegelaten instelling
      uitnodigt de aanvraag aan te vullen, tot de dag waarop de aanvraag is aangevuld of de daarvoor gestelde termijn
      ongebruikt is verstreken.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister verleent aan elke gemeente en aan elke in een gemeente werkzame toegelaten instelling, die aan de
      in het tweede lid gestelde eis omtrent eerder verleende geldelijke steun voldoet, een aanvullende bijdrage voor
      woningen die:
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
  - number: 7.1.a
    text: |-
      op 1 januari 1995 in eigendom aan een gemeente of toegelaten instelling toebehoorden, dan wel op 1 januari 1997 aan
      een toegelaten instelling in eigendom toebehoorden en die overgenomen zijn van een rechtspersoon, als bedoeld in
      [artikel 2, tweede lid][ref1], waarvoor het in dat lid bepaalde van toepassing is,


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
  - number: 7.1.b
    text: |-
      zijn tot stand gekomen met geldelijke steun, verleend met toepassing van de Beschikking geldelijke steun
      huurwoningen 1975, de Regeling geldelijke steun huurwoningen in proefgemeenten normkostensysteem 1986 of de
      Regeling geldelijke steun huurwoningen normkostensysteem 1988 en
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
  - number: 7.1.c
    text: |-
      op 1 januari 1993 in eigendom toebehoorden aan een gemeente of een toegelaten instelling, dan wel aan een
      rechtspersoon, als bedoeld in [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
  - number: '7.2'
    text: |-
      De aanvullende bijdrage wordt verleend, indien van het totaal van de woningen die op 1 januari 1993 aan de
      gemeente of de toegelaten instelling dan wel de rechtspersoon, bedoeld in [artikel 2, tweede lid][ref1], in
      eigendom toebehoorden, 40 procent of meer tot stand is gekomen met geldelijke steun, als bedoeld in het eerste lid,
      onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
  - number: '7.3'
    text: |-
      Voor de toepassing van het eerste en tweede lid worden in afwijking in zoverre van die leden op een vóór een
      door Onze Minister te bepalen tijdstip in te dienen aanvraag mede in aanmerking genomen alle woningen die op 1
      januari 1993: a. in eigendom aan een toegelaten instelling of gemeente toebehoorden, en b. door de gemeente of
      toegelaten instelling die de aanvraag indient voor haar risico en rekening werden beheerd als ware zij eigenaar
      van die woningen. Daarbij worden in afwijking van de eerste volzin niet in aanmerking genomen woningen: 1°. die
      op 1 januari 1993 in eigendom toebehoorden aan de aanvrager, maar op die datum voor risico en rekening van een
      derde werden beheerd als ware die derde eigenaar van de woningen, of 2°. waarvoor de gemeente niet vóór 1 januari
      1993, vooruitlopend op de overdracht in eigendom door de gemeente of een toegelaten instelling aan de toegelaten
      instelling die de aanvraag indient, aan laatstbedoelde instelling de geldelijke steun, bedoeld in het eerste lid,
      onderdeel b, heeft verleend, of 3°. waarvoor op grond van het eerste lid aan een ander een aanvullende bijdrage
      is of kan worden verleend, voor zover die ander niet schriftelijk aan Onze Minister te kennen heeft gegeven geen
      bezwaar te hebben tegen herziening van het bij hem in aanmerking te nemen percentage woningen met geldelijke steun,
      bedoeld in het eerste lid, onderdeel b, voor de aan de aanvrager ingevolge dit lid toe te rekenen woningen.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
  - number: '7.4'
    text: 'In afwijking van het eerste lid, onderdeel *c*verleent Onze Minister een aanvullende bijdrage:'
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
  - number: 7.4.a
    text: |-
      voor woningen van een toegelaten instelling indien deze die woningen na 1 januari 1993 doch voor 1 januari 1995 op
      verzoek van Onze Minister van een te saneren instelling in eigendom heeft verkregen,
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
  - number: 7.4.b
    text: |-
      voor woningen van een toegelaten instelling indien deze die woningen na 1 januari 1993 doch voor 1 januari 1997 van
      een rechtspersoon als bedoeld in [artikel 2, tweede lid][ref1], in eigendom heeft verkregen,


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
  - number: 7.4.c
    text: |-
      voor woningen van een toegelaten instelling indien deze na 1 januari 1993 doch voor 1 januari 1995 als zodanig
      ingevolge [artikel 70 van de Woningwet][ref1] is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
  - number: '7.5'
    text: Voor de toepassing van het eerste en tweede lid, worden mede in aanmerking genomen
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
  - number: 7.5.a
    text: |-
      woningen die zijn onderworpen aan een recht van erfpacht dat toebehoort aan een gemeente of een toegelaten
      instelling, en
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
  - number: 7.5.b
    text: |-
      woningen die op 1 januari 1993 nog niet in eigendom van een gemeente of toegelaten instelling waren, maar
      waarvoor aan die gemeente of toegelaten instelling voor 1 januari 1993 geldelijke steun overeenkomstig de Regeling
      geldelijke steun huurwoningen normkostensysteem 1988 was verleend en nadien is vastgesteld voor zover die woningen
      voor 1 januari 1995 zijn tot stand gekomen.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
  - number: '7.6'
    text: 'De aanvullende bijdrage is gelijk aan het verschil tussen:'
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
  - number: 7.6.a
    text: |-
      de som, vastgesteld overeenkomstig de [artikelen 2][ref1] en [3, eerste of derde lid][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007419#Artikel3
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007419
        artikel: '3'
  - number: 7.6.b
    text: |-
      de som, zoals die overeenkomstig de [artikelen 2][ref1] en [3, eerste of derde lid][ref2], zou zijn vastgesteld
      indien daarbij zou zijn uitgegaan van een jaarlijkse stijging van de huur met het percentage, vermeld in de bijlage
      bij deze wet, in plaats van met 5 procent,


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007419#Artikel3
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007419
        artikel: '3'
  - number: '7.7'
    text: |-
      [Artikel 3][ref1] is van overeenkomstige toepassing, met dien verstande dat voor een vaststelling met toepassing
      van het derde lid een aanvraag vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel3
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '3'
  - number: '7.8'
    text: |-
      [Artikel 5, eerste lid, aanhef en onderdelen b en e][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel5
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '5'
  - number: '7.9'
    text: |-
      Over schulden als bedoeld in het eerste lid is een rente verschuldigd van 6,75 procent, te rekenen vanaf 1 januari
      1995 tot de inwerkingtreding van de beschikking.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel7
  - number: '8.1'
    text: |-
      De verbintenissen van het Rijk jegens de gemeente als bedoeld in de [artikelen 5, eerste lid, onderdeel b][ref1],
      [6][ref2] en [7][ref3], en de verbintenis van de gemeente jegens het Rijk als bedoeld in
      [artikel 5, eerste lid, onderdeel c][ref4], gaan tot hun gemeenschappelijk beloop teniet.


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007419#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007419#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0007419#Artikel5
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007419
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0007419
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0007419
        artikel: '5'
  - number: '8.2'
    text: |-
      De verbintenissen van de gemeente jegens de toegelaten instelling als bedoeld in de
      [artikelen 5, eerste lid, onderdeel e][ref1], en [7, achtste lid][ref2], en de verbintenis van de toegelaten
      instelling jegens de gemeente als bedoeld in [artikel 5, eerste lid, onderdeel f][ref3], gaan tot hun
      gemeenschappelijk beloop teniet.


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007419#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007419#Artikel5
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007419
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007419
        artikel: '5'
  - number: '9.1'
    text: |-
      Indien de overeenkomstig de [artikelen 2][ref1] en [3, derde lid][ref2], vastgestelde som hoger is dan de
      overeenkomstig de [artikelen 2][ref3] en [3, eerste lid][ref4], vastgestelde som, heeft de nadere vaststelling
      bedoeld in de [artikelen 2][ref5] en [3, derde lid][ref6], tot gevolg dat ten laste van het Rijk onderscheidenlijk
      de gemeente een verbintenis ontstaat tot betaling aan de gemeente onderscheidenlijk de toegelaten instelling van
      het verschil tussen beide sommen.


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007419#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007419#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007419#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0007419#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0007419#Artikel3
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007419
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0007419
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0007419
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0007419
        artikel: '2'
      - id: ref6
        bwb_id: BWBR0007419
        artikel: '3'
  - number: '9.2'
    text: |-
      Indien de overeenkomstig de [artikelen 2][ref1] en [3, derde lid][ref2], vastgestelde som lager is dan de
      overeenkomstig de [artikelen 2][ref3] en [3, eerste lid][ref4], vastgestelde som, heeft de nadere vaststelling,
      bedoeld in de [artikelen 2][ref5] en [3, derde lid][ref6], tot gevolg dat ten laste van de gemeente
      onderscheidenlijk de toegelaten instelling een verbintenis ontstaat tot betaling aan het Rijk onderscheidenlijk de
      gemeente van het verschil tussen beide sommen.


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007419#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007419#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007419#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0007419#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0007419#Artikel3
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007419
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0007419
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0007419
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0007419
        artikel: '2'
      - id: ref6
        bwb_id: BWBR0007419
        artikel: '3'
  - number: '9.3'
    text: |-
      Indien de met overeenkomstige toepassing van [artikel 3, derde lid][ref1], verleende bijdrage, bedoeld in
      [artikel 7][ref2], hoger is dan de met overeenkomstige toepassing van [artikel 3, eerste lid][ref3], verleende
      bijdrage, ontstaat ten laste van het Rijk onderscheidenlijk de gemeente een verbintenis tot betaling aan de
      gemeente onderscheidenlijk de toegelaten instelling van het verschil tussen beide bijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007419#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007419#Artikel3
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007419
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007419
        artikel: '3'
  - number: '9.4'
    text: |-
      Indien de met overeenkomstige toepassing van [artikel 3, derde lid][ref1], verleende bijdrage, bedoeld in
      [artikel 7][ref2], lager is dan de met overeenkomstige toepassing van [artikel 3, eerste lid][ref3], verleende
      bijdrage, ontstaat ten laste van de gemeente onderscheidenlijk de toegelaten instelling een verbintenis tot
      betaling aan het Rijk onderscheidenlijk de gemeente van het verschil tussen beide bijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007419#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007419#Artikel3
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007419
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007419
        artikel: '3'
  - number: '9.5'
    text: |-
      Over schulden als bedoeld in het eerste, tweede, derde of vierde lid is een rente verschuldigd van 6,75 procent, te
      rekenen vanaf 1 januari 1995 tot de inwerkingtreding van de beschikking.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel9
  - number: '10'
    text: |-
      Voor de toepassing van deze wet wordt de contante waarde berekend met een rentepercentage van 6,75 procent en met
      dien verstande dat wordt uitgegaan van maanden van dertig dagen en jaren van driehonderdzestig dagen.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel10
  - number: '11'
    text: Een krachtens deze wet gegeven beschikking treedt in werking dertien weken na de bekendmaking daarvan.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel11
  - number: '12.1'
    text: |-
      Een ingevolge de [artikelen 2][ref1] en [3, derde lid][ref2], [6][ref3] of [7][ref4] gegeven beschikking kan
      worden ingetrokken of ten nadele van de belanghebbende worden gewijzigd:


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007419#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007419#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0007419#Artikel7
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007419
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0007419
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0007419
        artikel: '7'
  - number: 12.1.a
    text: |-
      op grond van feiten of omstandigheden waarvan Onze Minister bij de vaststelling redelijkerwijs niet op de hoogte
      kon zijn en op grond waarvan het in de beschikking genoemde bedrag lager zou zijn vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel12
  - number: 12.1.b
    text: indien de vaststelling onjuist was en belanghebbende dit wist of behoorde te weten.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel12
  - number: '12.2'
    text: |-
      Een in het eerste lid bedoelde beschikking kan niet meer worden ingetrokken of ten nadele van de belanghebbende
      worden gewijzigd indien sedert de dag waarop zij is bekendgemaakt vijf jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel12
  - number: '15'
    text: |-
      Een ieder is verplicht aan Onze Minister gegevens en bescheiden te verstrekken voor zover dat voor de uitvoering
      van deze wet redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel15
  - number: '16'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de uitvoering van deze wet welke regels in
      elk geval betrekking kunnen hebben op:
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel16
  - number: 16.a
    text: |-
      de wijze van indiening van aanvragen, de daarbij over te leggen gegevens en bescheiden alsmede het vaststellen van
      daarvoor te gebruiken formulieren,
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel16
  - number: 16.b
    text: |-
      de vaststelling van de in [artikel 2][ref1] bedoelde te ontvangen bijdragen op grond van gegevens, verstrekt door
      een gemeente of toegelaten instelling ingevolge de op voet van de [Woningwet 1962][ref2] gegeven van toepassing
      zijnde regelingen tot het verlenen van geldelijke steun,


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel2
