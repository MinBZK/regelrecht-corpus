  - number: '18'
    text: |-
      Onze Minister zendt één jaar na de inwerkingtreding van deze wet, en vervolgens ieder jaar tot het jaar volgend
      op de definitieve afwikkeling van de op grond van deze wet aan toegelaten instellingen uit te keren bijdragen,
      aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk. In het
      verslag wordt in ieder geval aandacht besteed aan de aanwending door de toegelaten instellingen van de op grond
      van [artikel 7][ref1] verleende aanvullende bijdragen ten behoeve van huurmatiging alsmede aan de voortgang van de
      financiële afwikkeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007419#Artikel7
    url: https://wetten.overheid.nl/BWBR0007419/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007419
        artikel: '7'
  - number: '19'
    text: |-
