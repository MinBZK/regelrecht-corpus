        artikel: '3'
  - number: '15'
    text: |-
      1 De aanvraag tot subsidieverlening dient door de aanvrager met gebruikmaking van een door hem volledig en naar
      waarheid ingevuld, ondertekend en gedagtekend aanvraagformulier uiterlijk op 31 augustus 1992 bij LASER te worden
      ingediend.

      2 Door het indienen van het aanvraagformulier verplicht de aanvrager zich tot nakoming van de daar gestelde
      voorwaarden en verplichtingen.

      3 De aanvraag dient vergezeld te gaan van:

      a. bewijsstukken waaruit blijkt dat de aanvrager, voor zover van toepassing, voldoet aan het in
      [artikel 13, onderdeel a][ref1] bepaalde;

      b. een verklaring van de verpachter dan wel de eigenaar van het bedrijf dat deze instemt met het uit produktie
      nemen van het gepachte bouwland dan wel met het uit produktie nemen van bouwland waarop een zakelijk recht of
      persoonlijk recht anders dan pacht is gevestigd, in het [artikel 13, onderdeel b][ref2], bedoelde geval;

      c. bewijsstukken, waaruit blijkt welke percelen de aanvrager in eigendom heeft, heeft gepacht dan wel waarop hij
      een zakelijk recht of een persoonlijk recht anders dan pacht;

      d. bewijsstukken, waaruit de oppervlakte en de gegevens ter identificatie van de percelen cultuurgrond van het
      landbouwbedrijf van de aanvrager blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0004375#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004375#Artikel13
    url: https://wetten.overheid.nl/BWBR0004375/2002-01-01#Artikel15
