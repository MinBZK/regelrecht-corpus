  - number: '9'
    text: |-
      1 Indien de subsidieontvanger de oppervlakte bouwland waarop de aanvraag tot subsidieverlening betrekking heeft
      uit produktie neemt door deze grond voor niet-agrarische doeleinden te gebruiken, dient deze grond niet te worden
      gebruikt voor de produktie van plantaardige of dierlijke produkten;

      2 Het bepaalde in [artikel 7][ref1] is van overeenkomstige toepassing, tenzij de minister op grond van het
      feitelijk gebruik van een of meer van de in [artikel 7][ref2] bedoelde verplichtingen op verzoek ontheffing
      verleent.


      [ref1]: https://wetten.overheid.nl/BWBR0004375#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004375#Artikel7
