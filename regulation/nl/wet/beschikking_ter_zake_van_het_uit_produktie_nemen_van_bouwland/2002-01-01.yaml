        artikel: '7'
  - number: '10'
    text: |-
      Indien een subsidie wordt verleend overeenkomstig het bepaalde in [artikel 5, derde lid][ref1], mag de
      produktiecapaciteit voor de meerjarige cultures niet toenemen.


      [ref1]: https://wetten.overheid.nl/BWBR0004375#Artikel5
