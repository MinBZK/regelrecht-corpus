preamble:
  text: |-
    Overwegende, dat uitvoering moet worden gegeven aan de Verordening (EEG) nr. 1094/88 van de Raad van 25 april 1988
    tot wijziging van de Verordeningen (EEG) nr. 797/85 en (EEG) nr. 1760/87 voor wat betreft het uit produktie nemen
    van bouwland en de extensivering en de omschakeling van de produktie (PbEG L106) en de hierop betrekking hebbende
    Verordening (EEG) nr. 1272/88 van de Commissie van 29 april 1988 tot vaststelling van de bepalingen voor de
    toepassing van de steunregeling ter bevordering van het uit produktie nemen van bouwland (PbEG L121);

    Gelet op de artikelen 15 en 19 van de Landbouwwet (Stb. 1957, 342);

    Gehoord het Landbouwschap en het Bosschap;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004375/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze beschikking wordt verstaan onder:



            a

              *minister:*


              Minister van Landbouw, Natuurbeheer en Visserij;



            b

              *LASER:*


              Dienst Landelijke service bij regelingen van het Ministerie van Landbouw, Natuurbeheer en Visserij;



            c

              *raadsverordening:*


              [Verordening (EEG) nr. 797/85](31985R0797) van de Raad van 12 maart 1985 betreffende de verbetering van de
      doeltreffendheid van de landbouwstructuur, (PbEG L93), laatstelijk gewijzigd bij [Verordening (EEG) nr. 1094/88]
      (31988R1094) van de Raad van 25 april 1988 (PbEG, L 106);



            d

              *commissieverordening:*


              [Verordening (EEG) nr. 1272/88](31988R1272) van de Commissie van 29 april 1988 tot vaststelling van de
      bepalingen voor de toepassing van de steunregeling ter bevordering van het uit produktie nemen van bouwland (PbEG
      L121);



            e

              *bouwland:*


              bouwland, bedoeld in [artikel 2, eerste lid][ref1], van de commissieverordening;



            f

              *meerjarige cultures:*


              meerjarige cultures, bedoeld onder G in de bijlage I bij [Verordening (EEG) nr. 571/88](31988R0571)
      van de Raad van 29 februari 1988 houdende organisatie van communautaire enquêtes inzake de structuur van de
      landbouwbedrijven in het tijdvak van 1988 tot en met 1997 (PbEG L56) en in de bijlage bij Beschikking 83/461/EEG
      van de Commissie van 4 juli 1983 houdende vaststelling van de bij de lijst van kenmerken behorende definities en
      van de lijst van landbouwprodukten voor de structuurenquête 1983 in het kader van een enquêteprogramma inzake de
      structuur van landbouwbedrijven (PbEG L251);



            g

              *landbouwbedrijf:*


              het geheel van produktie-eenheden in Nederland bestaande uit één of meer gebouwen of gedeelten daarvan en
      daarbij behorende landbouwgrond, uitsluitend of onder meer dienende tot de uitoefening van de landbouw;



            h

              *landbouwtelling:*


              landbouwtelling, bedoeld in [artikel 24 van de Landbouwwet][ref2] (Stb. 1957, 342);



            i
            verkoopseizoen:

              periode die begint op 1 juli van een kalenderjaar en eindigt op 30 juni van het daarop volgende
      kalenderjaar;



            j

              *groenbemester:*


              gewas vermeld op de als [bijlage I][ref3] bij deze beschikking gevoegde lijst;



            k

              *bebossen met snelgroeiend bos:*


              aanleggen en instandhouden van een beplanting met opgaande houtige gewassen bestaande uit hoog
      produktieve boomsoorten, met als hoofddoel de houtproduktie, anders dan ter voldoening aan een op grond van een
      publiekrechtelijke regeling bestaande verplichting tot herbeplanting;



            l

              *pacht:*


              recht, dat wordt ontleend aan een door de Grondkamer goedgekeurde overeenkomst als bedoeld in
      [artikel 1, onderdeel d, van de Pachtwet][ref4] (Stb. 1958, 37) welke is aangegaan voor de wettelijke termijn;



            m

              *rechtspersoon:*


              rechtspersoon, anders dan een publiekrechtelijke rechtspersoon.


