  - number: '5'
    text: |-
      1 De subsidieontvanger dient jaarlijks ten minste 20% van de in [artikel 3, eerste lid, onderdeel a][ref1],
      bedoelde oppervlakte bouwland uit produktie te houden, met dien verstande dat de uit produktie te nemen oppervlakte
      ten minste uit één aaneengesloten hectare dient te bestaan.

      2 Indien de in het eerste lid bedoelde oppervlakte uit meerdere grondstukken bestaat, dienen deze afzonderlijk
      telkens uit ten minste één aaneengesloten hectare te bestaan.

      3 Onverminderd het bepaalde in het eerste lid kan, indien op de uit produktie te nemen oppervlakte tevens
      meerjarige cultures worden verbouwd, een subsidie slechts worden verleend indien ten minste 50% van deze
      oppervlakte gedurende het verkoopseizoen 1987/1988 blijkens de gegevens van de landbouwtelling 1987 als bouwland
      is geëxploiteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004375#Artikel3
