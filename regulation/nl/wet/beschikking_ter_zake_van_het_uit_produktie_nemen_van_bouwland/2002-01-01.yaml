        artikel: '13'
  - number: '16'
    text: |-
      Een aanvraag tot subsidieverlening kan slechts worden ingediend, indien de aanvrager op het tijdstip van de
      indiening van de aanvraag niet reeds een subsidie is verleend op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0004375/2002-01-01#Artikel16
  - number: '17'
    text: De minister geeft een beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0004375/2002-01-01#Artikel17
  - number: '18'
    text: |-
      1 Indien bij controle ter plaatse blijkt dat de oppervlakte waarvoor de aanvraag tot subsidieverlening is ingediend
      ten minste twee procent en minimaal 20 are doch ten hoogste tien procent en maximaal twee hectare groter is dan
      de bij controle geconstateerde oppervlakte, wordt de subsidie berekend op basis van de geconstateerde oppervlakte,
      verminderd met het geconstateerde verschil. Dezelfde verlaging wordt toegepast voor de reeds in voorgaande jaren
      betaalde subsidies, tenzij de subsidieontvanger aantoont dat het verschil niet te wijten is aan zijn opzet noch
      verzuim.

      2 Indien het verschil tussen de oppervlakte waarvoor de aanvraag tot subsidieverlening is ingediend en de bij
      controle geconstateerde oppervlakte groter is dan de in het eerste lid genoemde maximum, wordt de aanvraag tot
      subsidieverlening afgewezen, dan wel de subsidieverlening ingetrokken. Wanneer toepassing wordt gegeven aan
      [artikel 4:57 van de Algemene wet bestuursrecht][ref1] behoeven de reeds in voorgaande jaren betaalde subsidies
      niet te worden terugbetaald indien de subsidieontvanger kan bewijzen dat het verschil niet te wijten is aan zijn
      opzet noch verzuim.

      3 Indien de oppervlakte bouwland waarop de aanvraag tot subsidieverlening betrekking heeft door braaklegging of
      gebruik voor niet-agrarische doeleinden uit produktie wordt genomen en de subsidieontvanger de in [artikel 7][ref2]
      bedoelde verplichtingen niet nakomt, wordt de subsidieverlening ingetrokken voor het jaar waarin deze
      verplichtingen niet zijn nagekomen. In afwijking van het voorgaande wordt in het geval van niet-nakoming van de
      verplichtingen als bedoeld in [artikel 7, eerste lid, onderdelen e en f][ref3], de subsidie voor het betrokken jaar
      met tien procent lager vastgesteld.

      4 Indien de subsidieontvanger het in [artikel 14, zesde lid][ref4], bedoelde formulier niet bij LASER indient,
      wordt de subsidie ingetrokken voor het jaar waarin deze verplichting niet is nagekomen.

      5 Indien in het in [artikel 8][ref5] bedoelde geval verplichtingen voor een langere
      periode zijn aangegaan en indien na het vijfde jaar de situaties als bedoeld in
      [artikel 4:48, eerste lid, de onderdelen b en c, van de Algemene wet bestuursrecht][ref6] zich voordoen, wordt de
      subsidieverlening ingetrokken voor de periode volgend op het vijfde jaar. Wanneer in dat geval toepassing wordt
      gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref7], dienen de bedragen, uitbetaald voor de periode
      volgend op het vijfde jaar, terugbetaald te worden.

      6 In afwijking van het bepaalde in [eerste][ref8], [tweede][ref9] en [vijfde lid][ref10], en
      [artikel 4:57 van de Algemene wet bestuursrecht][ref11], behoeven de reeds uitbetaalde bedragen niet te worden
      terugbetaald, in geval van:

      a. onteigening of gedwongen verkoop in de zin van de [Onteigeningswet][ref12] (Stb. 1851, 125) van de oppervlakte
      grond waar overeenkomstig de aanvraag tot subsidieverlening subsidie voor is gevraagd;

      b. overmacht;

      c. overlijden van de subsidieontvanger indien diens rechtverkrijgenden niet over het gebruik van de oppervlakte
      grond waarop de aanvraag tot subsidieverlening betrekking heeft, kunnen beschikken.


