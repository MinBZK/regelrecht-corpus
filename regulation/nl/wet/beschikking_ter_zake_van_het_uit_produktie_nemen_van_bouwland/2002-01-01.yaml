  - number: '6'
    text: |-
      Het uit produktie nemen van bouwland dient te geschieden door:

        - braaklegging, met mogelijkheid van vruchtwisseling;
        - bebossing, of
        - gebruik voor niet-agrarische doeleinden,
    url: https://wetten.overheid.nl/BWBR0004375/2002-01-01#Artikel6
  - number: '7'
    text: |-
      1 Indien de subsidieontvanger de oppervlakte bouwland waarop de aanvraag tot subsidieverlening betrekking heeft
      door braaklegging uit produktie neemt:

      a. dienen op deze grond geen organische afvalstoffen te worden gebruikt;

      b. dienen op deze grond geen dierlijke meststoffen te worden gebruikt tenzij de minister hiervoor ontheffing
      verleent. De minister kan op een gemotiveerd verzoek van de subsidieontvanger ontheffing verlenen indien het
      gebruik nodig is om de bodemvruchtbaarheid in stand te houden of bodemerosie tegen te gaan;

      c. dienen op deze grond geen fytofarmaceutische produkten, inclusief herbiciden, te worden gebruikt uitgezonderd de
      door de minister toegelaten middelen;

      d. dient deze grond, in de periode van 1 juli tot en met 30 september van elk kalenderjaar, met een groenbemester
      als bedoeld in [bijlage I][ref1] te zijn bebouwd, dien noch van de door braaklegging uit produktie genomen grond
      mag worden afgevoerd, noch voor veevoeder- of commerciële doeleinden mag worden gebruikt, en die in ieder geval
      aan het einde van elk jaar van de in [artikel 4][ref2] bedoelde periode van vijf jaren moet worden ondergewerkt,
      voor zover de grond het daarop volgende jaar in het kader van de vruchtwisseling opnieuw in landbouwkundig gebruik
      wordt genomen;

      e. dient te worden voorzien in het minimaal vereiste onderhoud met name de reeds bestaande bomenrijen en heggen
      langs de braakliggende grond en van de bestaande waterlopen en plassen, in ieder geval overeenkomstig de bepalingen
      in [bijlage II][ref3];

      f. dienen op deze grond de nodige mechanische bewerkingen te worden toegepast met name met het oog op de
      instandhouding van de waterreserve en de onkruidbestrijding.

      2 Onverminderd het bepaalde in [artikel 5, eerste en tweede lid][ref4], kan de totale door braaklegging met
      vruchtwisseling uit produktie genomen oppervlakte, gedurende de periode waarvoor de verplichtingen zijn aangegaan,
      jaarlijks variëren alsmede jaarlijks en binnen de periode van een jaar rouleren over verschillende percelen.

      3 Indien de totale door braaklegging met vruchtwisseling uit produktie genomen oppervlakte jaarlijks
      zal variëren, dient de subsidieontvanger in het aanvraagformulier aan te geven welk deel van de in
      [artikel 3, eerste lid, onderdeel a][ref5], bedoelde oppervlakte bouwland hij gemiddeld gedurende de periode
      waarin de uit de aanvraag voortvloeiende verplichtingen van kracht zijn, uit produktie zal houden, met dien
      verstande dat de oppervlakte die jaarlijks uit produktie wordt genomen tenminste 20% en bij toepassing van
      het bepaalde in artikel 1bis, zesde lid, van de raadsverordening, tenminste 30% dient te bedragen van de in
      [artikel 3, eerste lid, onderdeel a][ref6], bedoelde oppervlakte.

      4 De variatie in de oppervlakte als bedoeld in het tweede lid mag ten hoogste 10% bedragen ten opzichte van het in
      het derde lid bedoelde gemiddelde.

      5 De subsidieontvanger mag gedurende enig jaar van de periode waarin de uit de subsidieverlening voortvloeiende
      verplichtingen van kracht zijn slechts een kleinere dan de in het derde lid bedoelde gemiddelde oppervlakte
      bouwland uit produktie houden, indien hij deze kan compenseren met een grotere dan de gemiddelde oppervlakte die
      hij in een eerder jaar uit produktie heeft genomen.


