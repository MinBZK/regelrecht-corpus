  - number: '19'
    text: |-
      De subsidieontvanger is verplicht ter zake van zijn aanvraag tot subsidievaststelling desgevraagd aan LASER alle
      gewenste gegevens terstond, volledig en naar waarheid te verstrekken.
    url: https://wetten.overheid.nl/BWBR0004375/2002-01-01#Artikel19
  - number: 19a
    text: |-
      Indien toepassing wordt gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref1], worden terug te
      vorderen bedragen vermeerderd met de wettelijke rente over de periode vanaf de eerst uitbetaling tot aan het moment
      van algehele voldoening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel457
    url: https://wetten.overheid.nl/BWBR0004375/2002-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:57
  - number: '22'
    text: De subsidie wordt pas verleend indien de Commissie van de Europese Gemeenschappen hiertegen geen bezwaar maakt.
    url: https://wetten.overheid.nl/BWBR0004375/2002-01-01#Artikel22
  - number: '23'
    text: Deze beschikking wordt bekend gemaakt in de Staatscourant en treedt in werking met ingang van 29 augustus 1988.
    url: https://wetten.overheid.nl/BWBR0004375/2002-01-01#Artikel23
  - number: '24'
    text: 'Deze beschikking kan worden aangehaald als: Beschikking ter zake van het uit produktie nemen van bouwland.'
    url: https://wetten.overheid.nl/BWBR0004375/2002-01-01#Artikel24
