  - number: '4'
    text: |-
      1 Een subsidie kan slechts worden verleend indien de aanvrager zich ertoe verplicht om gedurende een periode van
      vijf jaren, overeenkomstig de bepalingen in de [artikelen 5][ref1] en [6][ref2] en voor zover van toepassing in de
      [artikelen 7][ref3], [8][ref4], [9][ref5] of [10][ref6], bouwland uit produktie te nemen en te houden.

      2 De aanvrager mag in de eerste drie jaren van de genoemde perioden deze verplichtingen opzeggen met ingang van het
      vierde jaar.

      3 Onverminderd het bepaalde in het tweede lid, mag de aanvrager voor wie de braakleggingsverplichting ingevolge
      artikel 7 van [Verordening (EEG) nr. 1765/92](31992R1765) geldt, in de periode 1992 1996 telkens in de periode van
      1 september tot en met 15 december deze verplichtingen opzeggen.

      4 De in het eerste lid bedoelde periode van vijf jaren begint uiterlijk één jaar na het tijdstip van de beschikking
      tot subsidieverlening, of zoveel eerder als de aanvrager te kennen heeft gegeven aan de in het eerste lid genoemde
      verplichtingen te voldoen.


