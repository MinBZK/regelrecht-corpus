  - number: '2'
    text: |-
      Ter bevordering van het uit produktie nemen van bouwland kan de minister op grond van de volgende bepalingen op
      aanvraag een subsidie verlenen.
    url: https://wetten.overheid.nl/BWBR0004375/2002-01-01#Artikel2
  - number: '3'
    text: |-
      1 De subsidie kan slechts worden verleend aan natuurlijke personen en rechtspersonen, indien:

      a. zij als bedrijfshoofd op het tijdstip van de indiening van de aanvraag tot subsidieverlening voor eigen rekening
      en risico als eigenaar, zakelijk gerechtigde, of in het in [artikel 7][ref1] bedoelde geval als pachter, dan wel
      in de in [artikelen 8][ref2] of [9][ref3] bedoelde gevallen als persoonlijk gerechtigde anders dan de pachter, een
      landbouwbedrijf exploiteren met als zodanig in gebruik zijnde bouwland;

      b. zij gedurende het verkoopseizoen 1987/1988 blijkens de gegevens van de landbouwtelling 1987 het in onderdeel a
      bedoelde landbouwbedrijf met het uit produktie te nemen bouwland als zodanig voor eigen rekening en risico hebben
      geëxploiteerd;

      c. de natuurlijke persoon dan wel de bedrijfsleider van de rechtspersoon op het tijdstip van de indiening van de
      aanvraag geen recht hebben op een ouderdomspensioen ingevolge het bepaalde in de [Algemene Ouderdomswet][ref4]
      (Stb. 1956, 281).

      2 In afwijking van het bepaalde in het eerste lid, onderdeel b, kan een subsidie eveneens worden verleend indien
      natuurlijke personen of rechtspersonen, na het begin van het verkoopseizoen 1987/1988 en vóór het tijdstip van de
      indiening van de aanvraag een landbouwbedrijf als geheel in eigendom hebben verworven, daarop een zakelijk recht
      hebben verkregen, in het in [artikel 7][ref5] bedoelde geval hebben gepacht, in de in de [artikelen 8][ref6] of
      [9][ref7] bedoelde gevallen daarop een persoonlijk recht anders dan pacht hebben verkregen, of als eigenaar of
      verpachter van een landbouwbedrijf dit bedrijf weer als geheel in gebruik hebben verkregen, indien:

      a. dit bedrijf gedurende het verkoopseizoen 1987/1988 blijkens de gegevens van de landbouwtelling 1987 met het uit
      produktie te nemen bouwland als zodanig is geëxploiteerd;

      b. zij dit bedrijf met het uit produktie te nemen bouwland als zodanig, gedurende een verkoopseizoen voorafgaand
      aan het tijdstip van de indiening van de aanvraag blijkens de gegevens van de aan dit verkoopseizoen voorafgaande
      landbouwtelling, voor eigen rekening en risico hebben geëxploiteerd.

      3 Indien meer dan één natuurlijke persoon of rechtspersoon voor gezamenlijke rekening en risico een landbouwbedrijf
      exploiteren met als zodanig in gebruik zijnd bouwland, kan een subsidie worden verleend indien ten minste één
      van de natuurlijke personen dan wel rechtspersonen op het tijdstip van de indiening van de aanvraag eigenaar,
      zakelijk gerechtigde, of in het in [artikel 7][ref8] bedoelde geval pachter dan wel in de in [artikelen 8][ref9] of
      [9][ref10] bedoelde gevallen persoonlijk gerechtigde anders dan de pachter, (ten aanzien) van dit landbouwbedrijf
      is en voldoet aan het bepaalde in het eerste lid, onderdeel b, en indien ten minste één van de natuurlijke personen
      dan wel de bedrijfsleiders van de rechtspersonen voldoet aan het bepaalde in het eerste lid, onderdeel c.


