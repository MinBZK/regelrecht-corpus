  - number: '11'
    text: |-
      Indien de aanvrager gebruik wil maken van [artikel 12, eerste, tweede of derde lid][ref1], van de
      commissieverordening dient hij daartoe een verzoek in bij LASER op een daartoe bestemd formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0004375#Artikel12
    url: https://wetten.overheid.nl/BWBR0004375/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004375
        artikel: '12'
  - number: '12'
    text: |-
      1 Indien de subsidieontvanger in de periode waarin hij verplicht is bouwland uit produktie te houden het gehele
      landbouwbedrijf dan wel een gedeelte daarvan verkoopt, verpacht, of daarop een persoonlijk recht anders dan pacht
      dan wel een zakelijk recht vestigt, kan de bedrijfsopvolger zich er tegenover de minister toe verbinden de uit de
      subsidieverlening voortvloeiende verplichtingen verder na te komen.

      2 Indien de bedrijfsopvolger de in het eerste lid bedoelde verbintenis aangaat, wordt:

      a. de resterende subsidie aan hem betaald, indien hij het bedrijf als geheel koopt, pacht, of daarop een zakelijk
      recht dan wel een persoonlijk recht anders dan pacht verkrijgt.

      b. de subsidie voor een gedeelte evenredig aan de uit produktie genomen oppervlakte grond die is gekocht of
      gepacht, of waarop een zakelijk recht dan wel een persoonlijk recht anders dan pacht is gevestigd, aan hem betaald,
      indien hij het bedrijf gedeeltelijk koopt, pacht, of daarop een zakelijk recht dan wel een persoonlijk recht anders
      dan pacht verkrijgt.

      3 Voor de toepassing van deze regeling wordt de bedrijfsopvolger die de in het eerste lid genoemde verbintenis
      aangaat, vanaf het moment dat deze verbintenis is aangegaan, aangemerkt als de subsidieontvanger.
    url: https://wetten.overheid.nl/BWBR0004375/2002-01-01#Artikel12
  - number: '13'
    text: |-
      Voor het uit produktie nemen van gepacht bouwland dan wel van bouwland waarop een zakelijk recht of persoonlijk
      recht anders dan pacht is gevestigd, kan een subsidie slechts worden verleend indien:

      a. de pachter, zakelijk gerechtigde of persoonlijk gerechtigde anders dan de pachter gedurende de periode waarvoor
      de verplichtingen zijn aangegaan een gebruiksrecht heeft ten aanzien van het uit produktie te nemen bouwland;

      b. in het geval dat het gebruiksrecht als bedoeld in onderdeel a een kortere dan de daar genoemde periode beslaat,
      de verpachter of eigenaar toestemming hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0004375/2002-01-01#Artikel13
  - number: '14'
    text: |-
      1 De subsidie bedraagt:

      a. € 680,67 per jaar per hectare voor de eerste 50% van de in [artikel 3, eerste lid, onderdeel a][ref1], bedoelde
      oppervlakte bouwland die door braaklegging of bebossing uit produktie wordt genomen;

      b. € 589,91 per jaar per hectare bouwland die boven het in onderdeel a bedoelde percentage door braaklegging of
      bebossing uit produktie wordt genomen;

      c. € 360,30 per jaar per hectare bouwland die door gebruik voor niet-agrarische doeleinden uit produktie wordt
      genomen.

      2 De hoogte van de subsidies als bedoeld in het eerste lid, onderdelen a en b, kan jaarlijks vóór 1 augustus door
      de minister worden aangepast voor de daaropvolgende periode van 1 september tot en met 31 augustus.

      3 De aanpassing van de hoogte van de subsidie als bedoeld in het tweede lid vindt plaats op basis van de
      ontwikkeling van de saldi van wintertarwe, zomertarwe, wintergerst, zomergerst, haver, rogge en koolzaad, die wordt
      gewogen aan de hand van het met de betrokken gewassen beteelde areaal in het meest recente jaar waarvan de gegevens
      ter zake beschikbaar zijn.

      4 Onder de saldi als bedoeld in het derde lid worden verstaan de saldi die door het Landbouw Economisch Instituut
      voor het meest recente jaar zijn geraamd op basis van bedrijfseconomische boekhoudingen van akkerbouwbedrijven.
      De ontwikkeling van de saldi wordt bepaald door herberekening van de saldi, waartoe de prijzen per kilogram worden
      aangepast op grond van de laatste wijziging van de jaarlijks door de Raad van de Europese Gemeenschappen vast te
      stellen interventie aankoopprijzen voor granen en koolzaad.

      5 Indien de totale door braaklegging met vruchtwisseling uit produktie genomen oppervlakte gedurende de periode
      waarvoor de verplichtingen zijn aangegaan jaarlijks varieert, zal de subsidie elk jaar worden uitbetaald voor de in
      het aanvraagformulier aangegeven gemiddelde oppervlakte bouwland, welke de aanvrager gedurende de periode waarin de
      uit de aanvraag voortvloeiende verplichtingen van kracht zijn, uit produktie zal houden.

      6 De subsidie wordt aan het einde van elk jaar gedurende de periode waarin de uit de subsidieverlening
      voortvloeiende verplichtingen van kracht zijn, vastgesteld, nadat de subsidieontvanger het jaarlijks aan hem
      toegestuurde formulier bij LASER heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004375#Artikel3
    url: https://wetten.overheid.nl/BWBR0004375/2002-01-01#Artikel14
