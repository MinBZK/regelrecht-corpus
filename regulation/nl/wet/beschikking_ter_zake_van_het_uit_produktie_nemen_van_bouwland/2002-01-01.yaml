  - number: '8'
    text: |-
      1 Indien de subsidieontvanger de oppervlakte bouwland waarop de aanvraag tot subsidieverlening betrekking heeft
      door bebossing uit produktie neemt, dient deze grond te worden bebost met snelgroeiend bos.

      2 De bebossing als bedoeld in het eerste lid dient naar het oordeel van de minister bosbouwkundig verantwoord te
      zijn.

      3 In afwijking van het bepaalde in [artikel 5, tweede lid][ref1], dienen, indien de in het eerste lid bedoelde
      oppervlakte uit meerdere grondstukken bestaat, deze afzonderlijk telkens uit ten minste een halve aaneengesloten
      hectare te bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004375#Artikel5
    url: https://wetten.overheid.nl/BWBR0004375/2002-01-01#Artikel8
