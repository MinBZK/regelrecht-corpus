        bwb_id: BWBR0009900
        artikel: '5'
  - number: '11'
    text: |-
      1 Een RPL wordt ingediend in de vorm van een lijst die de vereiste vliegplangegevens bevat, gebruik makend van
      het model in [bijlage C1][ref1], overeenkomstig de aanwijzigingen gegeven in [bijlage C2][ref2] of in een andere
      overeengekomen vorm.

      2 De lijst wordt ingediend bij het FSC, welke instantie zorg draagt voor het doorgeven van de toepasselijke
      vliegplangegevens aan andere betrokken verleners van luchtverkeersdiensten in de desbetreffende
      vluchtinformatiegebieden.

      3 Een RPL wordt tijdig ingediend doch uiterlijk op een zodanig tijdstip dat de geadresseerde ten minste 21 dagen
      voorafgaand aan de datum van de eerste vlucht van de betrokken reeks vluchten wordt bereikt.

      4 De in [bijlage C1][ref3] genoemde vliegplangegevens worden verstrekt. Voor zover de betrokken verlener van
      luchtverkeersdiensten dit nodig acht, worden vliegplangegevens verstrekt inzake de berekende duur van de vlucht
      vanaf het opstijgen tot het passeren van de grens tussen bepaalde vluchtinformatiegebieden en de voornaamste
      uitwijkhaven.

      5 Vliegplangegevens die niet van repeterende aard zijn worden door of namens de gezagvoerder ten tijde van het
      vertrek van het luchtvaartuig verzonden naar het IFPS.

      6 De [bijlagen C1][ref4] en [C2][ref5] liggen ter inzage bij de Luchtverkeersleiding Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0009900
      [ref2]: https://wetten.overheid.nl/BWBR0009900
      [ref3]: https://wetten.overheid.nl/BWBR0009900
      [ref4]: https://wetten.overheid.nl/BWBR0009900
      [ref5]: https://wetten.overheid.nl/BWBR0009900
    url: https://wetten.overheid.nl/BWBR0009900/2014-12-12#Artikel11
    references:
