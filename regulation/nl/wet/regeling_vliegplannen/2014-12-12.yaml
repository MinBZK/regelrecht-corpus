  - number: 1a
    text: |-
      Deze regeling berust op [artikel 16, eerste en tweede lid, van het Besluit luchtverkeer 2014][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035899#Artikel16
    url: https://wetten.overheid.nl/BWBR0009900/2014-12-12#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0035899
        artikel: '16'
  - number: '2'
    text: |-
      1 Onverminderd het bepaalde in paragraaf SERA.4001 van verordening (EU) nr. 923/2012 wordt voor aanvang van de
      vlucht een vliegplan ingediend voor:

      a. iedere IFR-vlucht in de FIR-Amsterdam;

      b. iedere vlucht in de NSA Amsterdam, met uitzondering van vluchten met staatsluchtvaartuigen als bedoeld in
      [artikel 14, derde lid, van de Regeling luchtverkeersdienstverlening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel14
    url: https://wetten.overheid.nl/BWBR0009900/2014-12-12#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '14'
  - number: '3'
    text: |-
      1 Voor het opgeven van de gegevens van een vliegplan wordt gebruik gemaakt van het vliegplan-formulier, en de
      daarbij behorende aanwijzingen, als aangegeven in de [bijlage A1][ref1] en [A2][ref2] onder verwijzing naar de
      bladzijden in de luchtvaartgids, hoofdstuk ENR 1-10. Van wijzigingen in deze bladzijden van de luchtvaartgids
      wordt mededeling gedaan in de Staatscourant. [Bijlage A1][ref3] en [A2][ref4] liggen ter inzage bij de
      Luchtverkeersleiding Nederland, FSC.

      2 Voor het opgeven van de gegevens van een vliegplan voor een VFR-vlucht waarvoor geen vliegplan is vereist, met
      het doel eventuele opsporing en redding te vergemakkelijken, volstaat een melding van de volgende gegevens:

      a. registratie kenmerk en type luchtvaartuig;

      b. luchthaven van vertrek en verwachte tijd van vertrek;

      c. luchthaven van bestemming en verwachte tijd van aankomst;

      d. endurance;

      e. het aantal personen aan boord;

      f. de naam van de gezagvoerder.

      3 Een vliegplan kan tijdens de vlucht per radio worden gezonden, indien het vliegplan slechts betrekking heeft op
      een deel van de vlucht. Dit is niet van toepassing op vluchten, waarvan delen worden uitgevoerd:

      a. binnen het plaatselijk luchtverkeersleidingsgebied van Schiphol;

      b. in luchtverkeersdienstverleningsgebieden met klasse A.

      c. in luchtverkeersdienstverleningsgebieden met klasse B, behoudens voor vluchten met zweefvliegtuigen; of

      d. in luchtverkeersdienstverleningsgebieden met klasse C boven vliegniveau 195.

      4 Een vliegplan voor een vlucht uitgevoerd met een luchtvaartuig ten behoeve van zoek- en reddingsactiviteiten kan
      voorafgaande aan of tijdens de vlucht bij de relevante luchtverkeersmeldingspost worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0009900
      [ref2]: https://wetten.overheid.nl/BWBR0009900
      [ref3]: https://wetten.overheid.nl/BWBR0009900
      [ref4]: https://wetten.overheid.nl/BWBR0009900
    url: https://wetten.overheid.nl/BWBR0009900/2014-12-12#Artikel3
    references:
