  - number: '12'
    text: |-
      1 RPL-wijzigingen van duurzame aard, betreffende het invoegen van nieuwe vluchten en het annuleren of wijzigen van
      bestaande vluchten, worden ingediend in de vorm van gewijzigde lijsten, die het IFPS ten minste twee weken voordat
      ze van kracht worden bereiken.

      2 RPL-wijzigingslijsten worden opgesteld overeenkomstig [artikel 11, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009900#Artikel11
    url: https://wetten.overheid.nl/BWBR0009900/2014-12-12#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009900
        artikel: '11'
  - number: '13'
    text: |-
      1 RPL-wijzigingen van incidentele aard met betrekking tot het type luchtvaartuig en de zogturbulentie-categorie,
      snelheid of kruishoogte, worden voor elke individuele vlucht zo snel mogelijk en niet later dan 60 minuten voor
      vertrek ingediend bij het FSC. Slechts een wijziging van de kruishoogte kan bij het eerste radiocontact met de
      verlener van plaatselijke luchtverkeersleidingsdiensten worden doorgegeven.

      2 Voor een incidentele wijziging van de identificatie van het luchtvaartuig, de luchthaven van vertrek, de route of
      de luchthaven van bestemming, wordt het repeterend vliegplan voor die dag geannuleerd, waarna een gewoon vliegplan
      wordt ingediend.

      3 Wanneer een vertraging wordt verwacht voor een bepaalde vlucht waarvoor een repeterend vliegplan is ingediend,
      die waarschijnlijk dertig minuten of meer zal bedragen ten opzichte van de in dat vliegplan opgegeven vertrektijd,
      wordt het IFPS hiervan onmiddellijk in kennis gesteld; bij niet nakoming hiervan kan het repeterend vliegplan voor
      die dag door één of meer van de betrokken verleners van luchtverkeersdiensten automatisch worden geannuleerd.

      4 Zodra bekend is dat een vlucht waarvoor een repeterend vliegplan is ingediend is geannuleerd, wordt dit
      onmiddellijk gemeld aan het IFPS.
    url: https://wetten.overheid.nl/BWBR0009900/2014-12-12#Artikel13
  - number: '14'
    text: De Regeling vliegplannen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009900/2014-12-12#Artikel14
  - number: '15'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
