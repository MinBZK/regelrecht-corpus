preamble:
  text: |-
    Gelet op artikel 31, eerste en vierde lid, van het Luchtverkeersreglement;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0009900/2014-12-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - Air Operations Control Station Nieuw Milligen (AOCS Nieuw Milligen): dienstonderdeel van het Ministerie van
      Defensie belast met het verlenen van luchtverkeersdiensten;
        - Air Traffic Flow Management (ATFM): luchtverkeersstroomregeling; een dienstverlening aan het luchtverkeer met
      het doel een optimale luchtverkeersstroom te verzekeren naar of via gebieden waarin het luchtverkeersaanbod de
      beschikbare capaciteit van het luchtverkeersleidingssysteem overtreft;
        - Amsterdam Flight Service Centre (FSC): afdeling van LVNL aangeduid als verantwoordelijke
      luchtverkeersmeldingspost voor alle burgerluchthavens;
        - Area Control Centre Amsterdam (ACC Amsterdam): een verlener van luchtverkeersdiensten, belast met het verlenen
      van luchtverkeersleidingsdiensten, vluchtinlichtingendiensten, alarmeringsdiensten en adviesdiensten voor het
      luchtverkeer;
        - ECAC-Staten: lid-staten van de European Civil Aviation Conference;
        - endurance: de berekende maximale vliegduur van het luchtvaartuig in relatie tot de beschikbare hoeveelheid
      brandstof;
        - General Air Traffic (GAT) IFR-vlucht: een IFR-vlucht, die wordt uitgevoerd overeenkomstig de ICAO-regelgeving
      en procedures;
        - havenmeester: een persoon, in dienst van de exploitant van een luchthaven, belast met de dagelijkse uitvoering
      van het toezicht op de luchthaven en in het bijzonder met het toezicht op de veiligheid en de goede orde daarop;
        - luchtvaartgids, hoofdstuk En Route (ENR): het hoofdstuk uit de luchtvaartgids dat handelt over 'En Route';
        - luchtverkeersmeldingspost: een verlener van luchtverkeersdiensten, belast met het ontvangen van vliegplannen vóór
      de vlucht en rapporten betreffende het verlenen van luchtverkeersdiensten;
        - North Sea Area Amsterdam (NSA Amsterdam): gebied, als aangegeven in
      [bijlage A van de Regeling luchtverkeersdienstverlening][ref1], onder verwijzing naar de luchtvaartgids, hoofdstuk
      ENR 6;
        - repeterend vliegplan (RPL): een vliegplan voor zich regelmatig herhalende vluchten met dezelfde hoofdkenmerken;
        - total estimated elapsed time (total EET): de berekende duur van de vlucht vanaf het opstijgen tot: 1. voor
      een IFR-vlucht, de aankomst boven het - in relatie tot navigatiehulpmiddelen gedefinieerde punt, waar vandaan de
      voorgenomen instrumentnaderingsprocedure zal worden aangevangen dan wel, indien de luchthaven van bestemming niet
      beschikt over een navigatiehulpmiddel, de aankomst boven de luchthaven van bestemming; 2. voor een VFR-vlucht, de
      aankomst boven de luchthaven van bestemming;
        - verkeersvlucht: een vlucht, die vervoer door een luchtvaartmaatschappij ten doel heeft;
        - Verwachte tijd van aankomst: 1. voor een IFR-vlucht de tijd waarop een luchtvaartuig verwacht wordt
      boven een met behulp van navigatiehulpmiddelen gedefinieerd punt te zijn, vanwaar de verwachting is dat een
      instrumentnaderingsprocedure wordt aangevangen of, indien geen navigatiehulpmiddel verbonden is met de luchthaven,
      de tijd waarop het luchtvaarttuig boven de luchthaven zal arriveren; 2. voor VFR-vluchten de tijd waarop verwacht
      wordt dat het luchtvaartuig boven de luchthaven zal arriveren.
        - vliegcoördinator: de functionaris die door de verantwoordelijke Commandant is bevoegd verklaard namens hem
      leiding en toezicht uit te oefenen op de recreatieve luchtvaartbeoefening op een militaire luchthaven, buiten de
      militaire openstellingstijden;
        - vliegplan: specifieke inlichtingen, gerelateerd aan een voorgenomen vlucht, of een deel van een voorgenomen
      vlucht.


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009900/2014-12-12#Artikel1
