        bwb_id: BWBR0009900
  - number: '4'
    text: |-
      1 Een vliegplan voor een GAT IFR-vlucht of een gedeelte daarvan wordt door middel van een vliegplanverzendsysteem
      vanaf de luchthaven van vertrek ingediend bij FSC. Indien op de luchthaven van vertrek geen vliegplanverzendsysteem
      beschikbaar is, wordt het vliegplan ingediend bij een luchtverkeersmeldingspost, als bedoeld in [bijlage B][ref1].

      2 Een vliegplan voor andere vluchten als bedoeld in het eerste lid, wordt ingediend bij een
      luchtverkeersmeldingspost op de luchthaven van vertrek. Indien op de luchthaven van vertrek geen
      luchtverkeersmeldingspost aanwezig is wordt het vliegplan ingediend bij een luchtverkeersmeldingspost, als bedoeld
      in [bijlage B][ref2].

      3 Een vliegplan wordt ten minste zestig minuten vóór de aanvang van de vlucht ingediend. Wanneer op de voorgenomen
      route maatregelen van kracht zijn met betrekking tot ATFM, wordt een vliegplan ten minste drie uur vóór de aanvang
      van de vlucht ingediend.

      4 Indien een vliegplan slechts betrekking heeft op een deel van de vlucht en tijdens de vlucht per radio wordt
      gezonden naar de betrokken verlener van luchtverkeersdiensten, geschiedt dit, in afwijking van het derde lid,
      op een zodanig tijdstip, dat de ontvangst door die verlener van luchtverkeersdiensten is verzekerd op ten
      minste tien minuten vóór het tijdstip waarop wordt verwacht dat het luchtvaartuig de grens van het betrokken
      luchtverkeersleidingsgebied zal passeren.

      5 In afwijking van het tweede en het derde lid, wordt een vliegplan als bedoeld in [artikel 3, tweede lid][ref3],
      voor de aanvang van de vlucht ingediend, bij de havendienst van de luchthaven van vertrek en bij de havendienst van
      de luchthaven van bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0009900
      [ref2]: https://wetten.overheid.nl/BWBR0009900
      [ref3]: https://wetten.overheid.nl/BWBR0009900#Artikel3
    url: https://wetten.overheid.nl/BWBR0009900/2014-12-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009900
      - id: ref2
        bwb_id: BWBR0009900
      - id: ref3
        bwb_id: BWBR0009900
        artikel: '3'
  - number: '5'
    text: |-
      Onverminderd het bepaalde in paragraaf SERA.4015 van de verordening (EU) 923/2012 worden wijzigingen en
      annuleringen van het ingediende vliegplan overeenkomstig de volgende condities meegedeeld:

      a. indien het vertrek van een GAT IFR-vlucht of een gedeelte daarvan, waarvoor een vliegplan is ingediend, vijftien
      minuten of langer wordt vertraagd, wordt het vliegplan gewijzigd, dan wel wordt een nieuw vliegplan ingediend door
      middel van het vliegplanverzendsysteem bij FSC, nadat het oorspronkelijke vliegplan is geannuleerd;

      b. indien het vertrek van een vlucht anders dan bedoeld in onderdeel a, waarvoor een vliegplan is ingediend, dertig
      minuten of langer wordt vertraagd, wordt het vliegplan gewijzigd, dan wel wordt een nieuw vliegplan ingediend bij
      de betrokken verlener van luchtverkeersdiensten, nadat het oorspronkelijke vliegplan is geannuleerd;

      c. indien een GAT IFR-vlucht of een gedeelte daarvan, waarvoor een vliegplan is ingediend, geen doorgang vindt,
      wordt door middel van het vliegplanverzendsysteem het FSC daarover terstond ingelicht door annulering van het
      vliegplan;

      d. indien een vlucht anders dan bedoeld in onderdeel a, waarvoor een vliegplan is ingediend, geen doorgang
      vindt wordt de betrokken verlener van luchtverkeersdiensten daarover terstond ingelicht door annulering van het
      vliegplan.
    url: https://wetten.overheid.nl/BWBR0009900/2014-12-12#Artikel5
  - number: '6'
    text: |-
      Indien op de luchthaven van bestemming geen verlener van luchtverkeersdiensten is gevestigd, wordt de
      aankomstmelding zo spoedig mogelijk na aankomst en op de snelst mogelijke wijze gedaan aan de verlener van
      luchtverkeersdiensten als vermeld in [bijlage B][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009900
    url: https://wetten.overheid.nl/BWBR0009900/2014-12-12#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009900
  - number: '7'
    text: |-
      De [artikelen 3, eerste lid][ref1], en [4, eerste lid][ref2], zijn in het vluchtinformatiegebied Amsterdam niet
      van toepassing op een vlucht vertrekkend van een gecontroleerde luchthaven, indien de betrokken verlener van
      luchtverkeersdiensten anders heeft bepaald, met dien verstande dat geen afbreuk wordt gedaan aan de volledigheid en
      tijdige verzending van vliegplangegevens ten behoeve van andere verleners van luchtverkeersdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0009900#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009900#Artikel4
    url: https://wetten.overheid.nl/BWBR0009900/2014-12-12#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009900
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009900
        artikel: '4'
  - number: '8'
    text: |-
      1 Indien op de luchthaven van vertrek geen luchtverkeersmeldingspost aanwezig is dan wel gesloten is, wordt vóór de
      aanvang van de in [artikel 16, eerste lid, van het Besluit luchtverkeer 2014][ref1] genoemde vlucht het vliegplan
      bij de havenmeester of de vliegcoördinator van de luchthaven van vertrek ingediend.

      2 De in [artikel 3, tweede lid][ref2], opgenomen vliegplangegevens worden vóór de aanvang van de in het eerste lid
      genoemde vlucht gemeld aan de havenmeester of de vliegcoördinator van de luchthaven van bestemming.

      3 De aankomstmelding wordt gedaan aan de havenmeester of de vliegcoördinator van de luchthaven van aankomst tenzij
      de landing plaatsvindt op een gecontroleerde militaire luchthaven tijdens de openstellingsuren van de plaatselijke
      verlener van luchtverkeersleidingsdiensten.

      4 Indien de aankomst plaats vindt op een luchthaven anders dan de luchthaven van bestemming volgens het geldende
      vliegplan, wordt de aankomstmelding zo spoedig mogelijk na afloop van de vlucht telefonisch gedaan aan de
      havenmeester, de vliegcoördinator of de luchtverkeersmeldingspost van de luchthaven van bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0035899#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009900#Artikel3
    url: https://wetten.overheid.nl/BWBR0009900/2014-12-12#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035899
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0009900
        artikel: '3'
  - number: '9'
    text: |-
      1 Voor een vlucht met als bestemming een ongecontroleerde luchthaven in Nederland, of een gecontroleerde
      militaire luchthaven in het vluchtinformatiegebied Amsterdam waarvoor recreatief burgermedegebruik is toegestaan,
      is de havenmeester of de vliegcoördinator buiten de openstellingsuren van de plaatselijke verlener van
      luchtverkeersleidingsdiensten van de luchthaven van bestemming, als de vlucht bij hem bekend is, belast met het
      initiëren van de alarmering.

      2 De havenmeester of de vliegcoördinator van de luchthaven van bestemming, vraagt, als de vlucht bij hem bekend
      is en de aankomstmelding van het luchtvaartuig niet is verkregen binnen dertig minuten na de verwachte tijd van
      aankomst volgens het ingediende vliegplan, de actuele tijd van vertrek alsmede de van belang zijnde gegevens van
      het geldende vliegplan telefonisch op bij de havenmeester, de vliegcoördinator of de luchtverkeersmeldingspost van
      de luchthaven van vertrek.

      3 Indien de aankomstmelding niet is verkregen binnen dertig minuten na de verwachte tijd van aankomst volgens
      het geldend vliegplan, waarschuwt de havenmeester, de vliegcoordinator of de luchtverkeersmeldingspost van
      de luchthaven van bestemming zo spoedig mogelijk de supervisor van AOCS Nieuw Milligen, of voor vluchten met
      bestemming de luchthaven Lelystad, de supervisor van Amsterdam ACC.

      De supervisor stelt zo spoedig mogelijk de havenmeester of de vliegcoördinator, van de luchthaven van vertrek van
      de alarmering in kennis.

      4 Voor een vlucht met als bestemming een ongecontroleerde luchthaven buiten het vluchtinformatiegebied Amsterdam
      stelt de havenmeester, de vliegcoördinator of de luchtver-keersmeldingspost van de luchthaven van vertrek, wanneer
      een bericht als bedoeld in het derde lid, wordt ontvangen van een luchthaven buiten het vluchtinformatiegebied
      Amsterdam, zo spoedig mogelijk de supervisor van AOCS Nieuw Milligen van de alarmering in kennis.

      Voor vluchten die zijn vertrokken van de luchthaven Lelystad wordt de supervisor van Amsterdam ACC in kennis
      gesteld.
    url: https://wetten.overheid.nl/BWBR0009900/2014-12-12#Artikel9
  - number: '10'
    text: |-
      1 De [artikelen 3][ref1], [4][ref2] en [5][ref3] zijn niet van toepassing op een IFR-vlucht waarvoor een RPL is
      ingediend. Een RPL kan worden gebruikt voor een IFR-vlucht die regelmatig wordt uitgevoerd op dezelfde dagen van
      opeenvolgende weken voor ten minste 10 keer, dan wel op elke dag over een periode van ten minste 10 opeenvolgende
      dagen.

      2 Een RPL wordt slechts gebruikt voor vluchten, die vanaf de luchthaven van vertrek tot de luchthaven van
      bestemming worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009900#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009900#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009900#Artikel5
    url: https://wetten.overheid.nl/BWBR0009900/2014-12-12#Artikel10
