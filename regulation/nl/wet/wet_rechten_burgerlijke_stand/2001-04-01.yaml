---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_rechten_burgerlijke_stand
regulatory_layer: WET
publication_date: '2018-06-12'
valid_from: '2001-04-01'
bwb_id: BWBR0001851
url: https://wetten.overheid.nl/BWBR0001851/2001-04-01
preamble:
  text: |-
    Wij WILLEM III, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg,
    enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat de heffing van regten wegens de verrigtingen van den ambtenaar van den
    burgerlijken stand regeling vordert;

    Zoo is het, dat Wij, den Raad van State gehoord en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Geene gelden mogen worden geheven ter zake van het opmaken van akten of andere verrigtingen van den ambtenaar van
      den burgerlijken stand, behalve in de gevallen en op de wijze bij of krachtens deze wet voorzien.
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel1
  - number: '2.1'
    text: Er is een bij algemene maatregel van bestuur te bepalen recht verschuldigd
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel2
  - number: 2.1.a
    text: |-
      voor elk afschrift van een akte van de burgerlijke stand als bedoeld in
      [artikel 23b, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel23b
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 23b
  - number: 2.1.b
    text: |-
      voor elk uittreksel als bedoeld in [artikel 23b, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel23b
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 23b
  - number: 2.1.c
    text: |-
      voor elke verklaring van huwelijksbevoegdheid als bedoeld in
      [artikel 49a van Boek 1 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel49a
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 49a
  - number: 2.1.d
    text: voor elk meertalig uittreksel uit een akte van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel2
  - number: '2.2'
    text: 'Van de betaling van deze regten zijn vrijgesteld:'
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel2
  - number: 2.2.1°
    text: |-
      zij, die het aangevraagde afschrift of uittreksel noodig hebbende in hun persoonlijk belang, van hun onvermogen
      doen blijken door een getuigschrift, door den burgemeester hunner woon- of verblijfplaats afgegeven;
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel2
  - number: 2.2.2°
    text: |-
      de openbare ambtenaren, besturen en instellingen wegens de afschriften of uittreksels, door hen aangevraagd in het
      openbaar belang.
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel2
  - number: '3.1'
    text: |-
      De regten, krachtens [art. 2][ref1] geheven, komen ten bate van de gemeentekas.


      [ref1]: https://wetten.overheid.nl/BWBR0001851#Artikel2
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001851
        artikel: '2'
  - number: '3.2'
    text: |-
      Zij worden door den ambtenaar van den burgerlijken stand bij de uitreiking van het afschrift of uittreksel, op welk
      stuk het verschuldigd bedrag wordt vermeld, ingevorderd en op de wijze, door Ons te bepalen, verantwoord.
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel3
  - number: '4.1'
    text: |-
      Er wordt minstens tweemaal 's weeks in de gemeenten boven de tien duizend zielen en minstens eenmaal 's weeks in
      alle andere gelegenheid gegeven tot kostelooze huwelijksvoltrekking, registratie van een partnerschap of omzetting
      van een geregistreerd partnerschap of van een huwelijk.
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel4
  - number: '4.2'
    text: De ambtenaar van den burgerlijken stand bepaalt de dagen en de uren daarvoor bestemd.
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel4
  - number: '5.1'
    text: |-
      Het lokaal, in het huis der gemeente voor de huwelijksvoltrekking, registratie van een partnerschap of omzetting
      van een geregistreerd partnerschap of van een huwelijk bestemd, wordt door de gemeente beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel5
  - number: '5.2'
    text: |-
      Voor huwelijksvoltrekking, registratie van een partnerschap of omzetting van een geregistreerd partnerschap
      of van een huwelijk, op andere tijd of andere wijze dan waarop zij ingevolge het voorschrift van het
      voorafgaande artikel kosteloos plaats heeft, kan door de gemeente een recht worden geheven als bedoeld in
      [artikel 229 van de Gemeentewet][ref1] (*Stb* 1992, 96).


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
  - number: '6.1'
    text: Deze wet treedt in werking op een nader door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel6
  - number: '6.2'
    text: |-
      Met het in werking treden dezer wet zijn het Keizerlijk decreet van 12 Julij 1807 en alle andere verordeningen tot
      de heffing van regt ter zake van het opmaken van akten of andere verrigtingen van den burgerlijken stand vervallen.
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel6
  - number: '7'
    text: 'Deze wet kan worden aangehaald als: Wet rechten burgerlijke stand.'
    url: https://wetten.overheid.nl/BWBR0001851/2001-04-01#Artikel7
