preamble:
  text: |-
    Wij WILLEM III, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg,
    enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat de heffing van regten wegens de verrigtingen van den ambtenaar van den
    burgerlijken stand regeling vordert;

    Zoo is het, dat Wij, den Raad van State gehoord en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001851/2019-02-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Geene gelden mogen worden geheven ter zake van het opmaken van akten of andere verrigtingen van den ambtenaar van
      den burgerlijken stand, behalve in de gevallen en op de wijze bij of krachtens deze wet voorzien.
    url: https://wetten.overheid.nl/BWBR0001851/2019-02-16#Artikel1
  - number: '2'
    text: |-
      1 Er is een bij algemene maatregel van bestuur te bepalen recht verschuldigd

      a. voor elk afschrift van een akte van de burgerlijke stand als bedoeld in
      [artikel 23b, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref1];

      b. voor elk uittreksel als bedoeld in [artikel 23b, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref2];

      c. voor elke verklaring van huwelijksbevoegdheid als bedoeld in
      [artikel 49a van Boek 1 van het Burgerlijk Wetboek][ref3];

      d. voor elke attestatie de vita, als bedoeld in [artikel 19k van Boek 1 van het Burgerlijk Wetboek][ref4] en

      e. voor elk meertalig uittreksel uit een akte van de burgerlijke stand;

      f. voor elk meertalig modelformulier als bedoeld in artikel 7, eerste lid, van verordening (EU) nr. 2016/1191 van
      het Europees Parlement en de Raad van 6 juli 2016 betreffende de bevordering van het vrije verkeer van burgers door
      vereenvoudigde overlegging van bepaalde openbare documenten in de Europese Unie en tot wijziging van Verordening
      nr. 1024/2012 (PbEU 2016, L 200).

      Afschriften van of uittreksels uit huwelijksakten of akten van omzetting van een geregistreerd partnerschap in een
      huwelijk worden ten behoeve van het kerkelijk huwelijk kosteloos uitgegeven, mits van de bestemming uit het stuk
      zelve blijke en zij alzoo tot geen ander einde kunnen worden gebruikt.

      2 Van de betaling van deze regten zijn vrijgesteld:

      1°. zij, die het aangevraagde afschrift of uittreksel noodig hebbende in hun persoonlijk belang, van hun onvermogen
      doen blijken door een getuigschrift, door den burgemeester hunner woon- of verblijfplaats afgegeven;

      2°. de openbare ambtenaren, besturen en instellingen wegens de afschriften of uittreksels, door hen aangevraagd in
      het openbaar belang.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel23b
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel23b
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel49a
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel19k
