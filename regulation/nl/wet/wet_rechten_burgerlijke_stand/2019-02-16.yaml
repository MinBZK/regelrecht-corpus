  - number: '3'
    text: |-
      1 De regten, krachtens [art. 2][ref1] geheven, komen ten bate van de gemeentekas.

      2 Zij worden door den ambtenaar van den burgerlijken stand bij de uitreiking van het afschrift of uittreksel, op
      welk stuk het verschuldigd bedrag wordt vermeld, ingevorderd en op de wijze, door Ons te bepalen, verantwoord.


      [ref1]: https://wetten.overheid.nl/BWBR0001851#Artikel2
    url: https://wetten.overheid.nl/BWBR0001851/2019-02-16#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001851
        artikel: '2'
  - number: '4'
    text: |-
      1 Er wordt minstens tweemaal 's weeks in de gemeenten boven de tien duizend zielen en minstens eenmaal 's weeks in
      alle andere gelegenheid gegeven tot kostelooze huwelijksvoltrekking, registratie van een partnerschap of omzetting
      van een geregistreerd partnerschap.

      2 De ambtenaar van den burgerlijken stand bepaalt de dagen en de uren daarvoor bestemd.
    url: https://wetten.overheid.nl/BWBR0001851/2019-02-16#Artikel4
  - number: '5'
    text: |-
      1 Het lokaal, in het huis der gemeente voor de huwelijksvoltrekking, registratie van een partnerschap of omzetting
      van een geregistreerd partnerschap bestemd, wordt door het college van burgemeester en wethouders beschikbaar
      gesteld.

      2 Voor huwelijksvoltrekking, registratie van een partnerschap of omzetting van een geregistreerd partnerschap, op
      andere tijd of andere wijze dan waarop zij ingevolge het voorschrift van het voorafgaande artikel kosteloos plaats
      heeft, kan door de gemeente een recht worden geheven als bedoeld in [artikel 229 van de Gemeentewet][ref1] (*Stb*
      1992, 96).


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
    url: https://wetten.overheid.nl/BWBR0001851/2019-02-16#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
  - number: '6'
    text: |-
      1 Deze wet treedt in werking op een nader door Ons te bepalen tijdstip.

      2 Met het in werking treden dezer wet zijn het Keizerlijk decreet van 12 Julij 1807 en alle andere verordeningen
      tot de heffing van regt ter zake van het opmaken van akten of andere verrigtingen van den burgerlijken stand
      vervallen.
    url: https://wetten.overheid.nl/BWBR0001851/2019-02-16#Artikel6
  - number: '7'
    text: 'Deze wet kan worden aangehaald als: Wet rechten burgerlijke stand.'
    url: https://wetten.overheid.nl/BWBR0001851/2019-02-16#Artikel7
