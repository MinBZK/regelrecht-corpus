url: https://wetten.overheid.nl/BWBR0028743/2011-01-01
articles:
  - number: '1.1'
    text: |-
      Allen die zich in de openbare lichamen Bonaire, Sint Eustatius en Saba bevinden, zijn vrij en bevoegd tot het genot
      van de burgerlijke rechten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel1
  - number: '1.2'
    text: Persoonlijke dienstbaarheden, van welke aard of onder welke benaming ook, worden niet geduld.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel1
  - number: '2'
    text: |-
      Het kind waarvan een vrouw zwanger is, wordt als reeds geboren aangemerkt, zo dikwijls zijn belang dit vordert.
      Komt het dood ter wereld, dan wordt het geacht nooit te hebben bestaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel2
  - number: '3.1'
    text: |-
      De graad van bloedverwantschap wordt bepaald door het getal der geboorten, die de bloedverwantschap hebben
      veroorzaakt. Hierbij telt een erkenning, de verlening van brieven van vaderschap of een adoptie als een geboorte.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel3
  - number: '3.2'
    text: |-
      Door huwelijk ontstaat tussen de ene echtgenoot en een bloedverwant van de andere echtgenoot aanverwantschap in
      dezelfde graad als er bloedverwantschap bestaat tussen de andere echtgenoot en diens bloedverwant.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel3
  - number: '3.3'
    text: Door ontbinding van het huwelijk wordt de aanverwantschap niet opgeheven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel3
  - number: '4.1'
    text: Een ieder heeft de voornamen die hem in zijn geboorteakte zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel4
  - number: '4.2'
    text: |-
      De ambtenaar van de burgerlijke stand weigert in de geboorteakte voornamen op te nemen die ongepast zijn, of
      overeenstemmen met bestaande geslachtsnamen, tenzij deze tevens gebruikelijke voornamen zijn.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel4
  - number: '4.3'
    text: |-
      Geeft de aangever geen voornamen op, of worden deze alle geweigerd zonder dat de aangever ze door een of meer
      andere vervangt, dan geeft de ambtenaar ambtshalve het kind een of meer voornamen, en vermeldt hij uitdrukkelijk in
      de akte dat die voornamen ambtshalve zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel4
  - number: '4.4'
    text: |-
      Wijziging van de voornamen kan op verzoek van de betrokken persoon of zijn wettelijke vertegenwoordiger worden
      gelast door de rechter in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel4
  - number: '5.1'
    text: De geslachtsnaam van een kind is die van zijn vader, en anders die van de moeder.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel5
  - number: '5.2'
    text: |-
      Is de moeder onbekend, dan neemt de ambtenaar van de burgerlijke stand in de geboorteakte een voorlopige voornaam
      en geslachtsnaam op, in afwachting van het koninklijk besluit waarbij de voornamen en de geslachtsnaam van het kind
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel5
  - number: '6'
    text: De geslachtsnaam wordt ten aanzien van een ieder dwingend bewezen door de akte van geboorte.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel6
  - number: '7.1'
    text: |-
      De geslachtsnaam van een persoon kan op zijn verzoek, of op verzoek van zijn wettelijke vertegenwoordiger, bij
      koninklijk besluit worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel7
  - number: '7.2'
    text: |-
      Hij wiens geslachtsnaam of voornamen niet bekend zijn, kan verzoeken dat bij koninklijk besluit voor hem een
      geslachtsnaam of voornamen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel7
  - number: '7.3'
    text: |-
      Een wijziging of vaststelling van de geslachtsnaam bij koninklijk besluit heeft geen invloed op de geslachtsnaam
      van de kinderen van de betrokken persoon die vóór de datum van het besluit meerderjarig zijn geworden of die niet
      onder zijn gezag staan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel7
  - number: '7.4'
    text: |-
      Een wijziging of vaststelling van de geslachtsnaam bij koninklijk besluit blijft in stand, niettegenstaande een
      latere erkenning of verlening van brieven van vaderschap.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel7
  - number: '7.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld betreffende de wijze van indiening en behandeling
      van verzoeken als in het eerste en het tweede lid bedoeld, en betreffende het voor wijziging van de geslachtsnaam
      verschuldigde recht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel7
  - number: '8'
    text: |-
      Hij die de naam van een ander zonder diens toestemming voert, handelt jegens die persoon onrechtmatig, wanneer hij
      daardoor de schijn wekt die ander te zijn of tot diens geslacht of gezin te behoren.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel8
  - number: '9.1'
    text: |-
      Een vrouw die gehuwd is of die gehuwd is geweest en niet is hertrouwd, is steeds bevoegd de geslachtsnaam van haar
      man te voeren of op de in het verkeer gebruikelijke wijze aan de hare te doen voorafgaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien het huwelijk door echtscheiding is ontbonden en daaruit geen afstammelingen in leven zijn, kan de rechter in
      eerste aanleg, wanneer daartoe gegronde redenen bestaan, op verzoek van de man aan de vrouw de haar in het eerste
      lid toegekende bevoegdheid ontnemen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel9
  - number: '10.1'
    text: |-
      De woonplaats van een natuurlijk persoon bevindt zich te zijner woonstede, en bij gebreke van woonstede ter plaatse
      van zijn werkelijk verblijf.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel10
  - number: '10.2'
    text: |-
      Een rechtspersoon heeft zijn woonplaats ter plaatse waar hij volgens wettelijk voorschrift of volgens zijn statuten
      of reglementen zijn zetel heeft.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel10
  - number: '11.1'
    text: Een natuurlijk persoon verliest zijn woonstede door daden waaruit zijn wil blijkt om haar prijs te geven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel11
  - number: '11.2'
    text: |-
      Een natuurlijk persoon wordt vermoed zijn woonstede te hebben verplaatst, wanneer hij daarvan op de wettelijk
      voorgeschreven wijze aan de beheerders van de basisadministratie persoonsgegevens heeft kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel11
  - number: 11a
    text: |-
      Die tot openbare bedieningen worden geroepen, behouden hun woonplaats, indien zij het tegenovergestelde voornemen
      niet aan de dag hebben gelegd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel11a
  - number: '12.1'
    text: |-
      Een minderjarige volgt de woonplaats van hem die het gezag over hem uitoefent, de onder curatele gestelde die van
      zijn curator. Oefenen beide ouders te zamen het gezag over hun minderjarige kind uit, doch hebben zij niet dezelfde
      woonplaats, dan volgt het kind de woonplaats van de ouder bij wie het feitelijk verblijft dan wel laatstelijk heeft
      verbleven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel12
  - number: '12.2'
    text: |-
      Wanneer iemands goederen onder bewind staan, volgt hij voor alles wat de uitoefening van dit bewind betreft, de
      woonplaats van de bewindvoerder.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel12
  - number: '12.3'
    text: |-
      Wanneer ten behoeve van een persoon een mentorschap is ingesteld, volgt hij voor alles wat de uitoefening van dit
      mentorschap betreft, de woonplaats van de mentor.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel12
  - number: '12.4'
    text: |-
      Wanneer de persoon van wie de woonplaats wordt afgeleid, overlijdt of zijn gezag of zijn hoedanigheid verliest,
      duurt de afgeleide woonplaats voort, totdat een nieuwe woonplaats is verkregen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel12
  - number: '13'
    text: Het sterfhuis van een overledene is daar, waar hij zijn laatste woonplaats heeft gehad.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel13
  - number: '14'
    text: |-
      Een persoon die een kantoor of een filiaal houdt, heeft ten aanzien van aangelegenheden die dit kantoor of dit
      filiaal betreffen, mede aldaar woonplaats.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel14
  - number: '15'
    text: |-
      Een persoon kan een andere woonplaats dan zijn werkelijke slechts kiezen, wanneer de wet hem daartoe verplicht,
      of wanneer de keuze bij schriftelijk aangegane overeenkomst voor een of meer bepaalde rechtshandelingen of
      rechtsbetrekkingen geschiedt en voor de gekozen woonplaats een redelijk belang aanwezig is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel15
  - number: '16.1'
    text: |-
      In elk van de openbare lichamen Bonaire, Sint Eustatius en Saba zijn twee of, naar goedvinden van het
      bestuurscollege, meer ambtenaren van de burgerlijke stand. Daarenboven kunnen een of meer ambtenaren van de
      burgerlijke stand worden belast met het verrichten van bepaalde taken. Deze dragen de titel van buitengewoon
      ambtenaar van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel16
  - number: '16.2'
    text: |-
      De in het eerste lid bedoelde ambtenaren worden door het bestuurscollege benoemd, geschorst of ontslagen. Een
      benoeming kan voor een bepaalde tijdsduur geschieden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel16
  - number: '16.3'
    text: |-
      Ambtenaar van de burgerlijke stand van een openbaar lichaam kan slechts zijn een ambtenaar in dienst van dat
      openbaar lichaam. Buitengewoon ambtenaar van de burgerlijke stand kan mede zijn een persoon die geen ambtenaar in
      dienst van het openbaar lichaam is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel16
  - number: '16.4'
    text: |-
      De ambtenaar of buitengewoon ambtenaar van de burgerlijke stand wordt tot zijn betrekking niet toegelaten dan na
      voor de rechter in eerste aanleg de navolgende eed dan wel belofte te hebben afgelegd: «Ik zweer (beloof) dat ik
      de betrekking van ambtenaar van de burgerlijke stand met eerlijkheid en nauwkeurigheid zal vervullen en dat ik
      de wettelijke voorschriften, de burgerlijke stand betreffende, met de meeste nauwgezetheid zal opvolgen; dat ik
      voorts, tot het verkrijgen van mijn aanstelling, middellijk noch onmiddellijk, onder enige naam of voorwendsel,
      aan iemand iets heb gegeven of beloofd, en dat ik, om iets in deze betrekking te doen of te laten, van niemand
      enige beloften of geschenken zal aannemen, middellijk of onmiddellijk. Zo waarlijk helpe mij God almachtig». («Dat
      verklaar en beloof ik»).
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel16
  - number: 16a
    text: |-
      De ambtenaar van de burgerlijke stand is belast met het opnemen in de onder hem berustende registers van
      de burgerlijke stand van akten en de daaraan toe te voegen latere vermeldingen, alsmede al datgene wat de
      instandhouding van de registers en de zorg voor de toegankelijkheid van de daarin neergelegde gegevens betreft.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel16a
  - number: 16c
    text: |-
      Het bestuurscollege bepaalt de uren, waarop het bureau van de burgerlijke stand dagelijks voor het publiek geopend
      zal zijn. Daarbij wordt, ten einde de werkzaamheden van de ambtenaren van de burgerlijke stand op die dagen
      zoveel mogelijk te beperken, een afzonderlijke regeling getroffen voor de zaterdag, de zondag, de algemeen erkende
      feestdagen en de overige daarvoor door het bestuurscollege aan te wijzen dagen waarop de diensten van het openbaar
      lichaam niet of slechts gedeeltelijk zijn geopend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel16c
  - number: 16d.1
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld ten aanzien van de door het bestuurscollege te treffen
      voorzieningen ten behoeve van de taakuitoefening door de ambtenaar van de burgerlijke stand, en voorts ten aanzien
      van al wat verder de taak van de ambtenaar van de burgerlijke stand betreft.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel16d
  - number: '17.1'
    text: |-
      Er bestaan voor elk van de openbare lichamen Bonaire, Sint Eustatius en Saba registers van geboorten, van
      huwelijken en van overlijden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel17
  - number: '17.2'
    text: |-
      Er bestaat in de gemeente ‘s-Gravenhage, naast de in het eerste lid genoemde registers, een register voor de
      inschrijving van de in [afdeling 6][ref1] bedoelde rechterlijke uitspraken. Ten aanzien van het in de eerste zin
      bedoelde register zijn in plaats van de [artikelen 17a][ref2], [17b][ref3] en [17c][ref4] de [artikelen 17a][ref5],
      [17b][ref6] en [17c van het Nederlandse Burgerlijk Wetboek][ref7] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Afdeling6
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel17b
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel17c
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel17a
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel17b
      [ref7]: https://wetten.overheid.nl/BWBR0002656#Artikel17c
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel17
