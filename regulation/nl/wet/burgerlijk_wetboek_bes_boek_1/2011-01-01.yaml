        artikel: '332'
        paragraaf: '8'
        afdeling: '6'
  - number: 377u.5
    text: |-
      Als de rechter het verzoek toewijst, beveelt hij de afgifte van het kind aan degene aan wie het gezag
      erover toekomt, of, indien zulks niet aanstonds mogelijk is, voorlopig aan de voogdijraad. Hij kan tevens op
      verzoek of ambtshalve elke persoon die voor de internationale ontvoering van het kind verantwoordelijk is, of
      medeverantwoordelijk is, veroordelen tot betaling aan de centrale autoriteit, of aan de persoon aan wie het gezag
      over het kind toekomt, van de door deze in verband met de ontvoering en de teruggeleiding van het kind gemaakte
      kosten. Indien meer personen bij de ontvoering zijn betrokken, zijn zij hoofdelijk voor het geheel aansprakelijk.
      De beschikking is uitvoerbaar bij voorraad, tenzij de rechter in het belang van het kind op verzoek of ambtshalve
      anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377u
  - number: 377u.6
    text: |-
      [Artikel 813, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] is van toepassing op de
      tenuitvoerlegging van een bevel als bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel813
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377u
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '813'
  - number: 377u.7
    text: Hoger beroep van een eindbeslissing moet worden ingesteld binnen twee weken na de dagtekening van die beslissing.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377u
  - number: 377u.8
    text: |-
      Tegen de beschikking van het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire,
      Sint Eustatius en Saba staat geen gewoon rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377u
  - number: 377v.1
    text: |-
      .Ieder die in een openbaar lichaam het gezag uitoefent over een kind kan de rechter verzoeken, de in het tweede
      lid bedoelde beslissingen te geven terzake van het omgangsrecht met betrekking tot dat kind, indien het zich in
      verband met de uitoefening daarvan naar het buitenland moet begeven. De beslissingen kunnen worden gegeven voor
      een of meer bepaalde bezoeken of voor bepaalde tijdvakken waarin het omgangsrecht met betrekking tot het kind kan
      worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377v
  - number: 377v.2
    text: 'De in het eerste lid bedoelde beslissingen zijn:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377v
  - number: 377v.2.a
    text: |-
      vaststelling dat het wettig gezag aan de verzoeker toekomt in gevallen dat zulks niet reeds vaststaat door een
      rechterlijke beslissing;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377v
  - number: 377v.2.b
    text: |-
      regeling van de plaats en de duur van het verblijf van het kind in het buitenland en, zonodig, andere
      omstandigheden met betrekking tot het verblijf, zulks met inachtneming van reeds van kracht zijnde beslissingen
      inzake het omgangsrecht;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377v
  - number: 377v.2.c
    text: |-
      het richten van een verzoek aan de bevoegde autoriteiten van de staat waar het kind tijdens de uitoefening van het
      omgangsrecht verblijft toezicht te houden of te doen houden op de juiste naleving van dat recht, in het bijzonder
      wat de plaats en de duur ervan betreft en voorts, indien nodig, maatregelen te treffen tot teruggeleiding van het
      kind na ommekomst van de termijn van uitoefening van dat recht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377v
  - number: 377w
    text: |-
      De rechter die moet beslissen met betrekking tot het gezag over een kind ten aanzien waarvan een verzoek tot
      teruggeleiding is gedaan bij de centrale autoriteit, houdt zijn beslissing aan totdat op dat verzoek onherroepelijk
      is beslist. Is nog geen verzoek tot teruggeleiding gedaan, dan houdt de rechter zijn beslissing gedurende een
      redelijke termijn aan, als hij goede gronden heeft om aan te nemen dat het kind internationaal is ontvoerd in
      de zin van [artikel 377i, onderdeel c][ref1], van dit Boek en dat een verzoek tot zijn teruggeleiding zal worden
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377i
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377w
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377i
        afdeling: '1'
  - number: 377x.1
    text: |-
      Ieder die in verband met de toepassing van een verdrag als bedoeld in [artikel 377i][ref1] van dit Boek of in
      verband met de toepassing van deze regeling in rechte wil optreden en daartoe rechtsbijstand behoeft, kan zonodig
      daarop recht doen gelden op de voet van de [Wet kosteloze rechtskundige bijstand BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377i
      [ref2]: https://wetten.overheid.nl/BWBR0028200
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377x
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377i
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028200
  - number: 377x.2
    text: |-
      De in het eerste lid bedoelde personen zijn vrijgesteld van het stellen van zekerheid voor de betaling van kosten,
      schaden en interessen waarin zij zouden kunnen worden verwezen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377x
  - number: 377y
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven over de uitvoering of
      toepassing van deze Titel.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377y
  - number: 377aa
    text: 'In deze Titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377aa
  - number: 377aa.a
    text: |-
      *het verdrag:* het op 19 oktober 1996 te ’s-Gravenhage tot stand gekomen verdrag inzake de bevoegdheid,
      het toepasselijke recht, de erkenning, de tenuitvoerlegging en de samenwerking op het gebied van ouderlijke
      verantwoordelijkheid en maatregelen ter bescherming van kinderen (Trb. 1997, 299);
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377aa
  - number: 377aa.b
    text: '*Onze Minister:* Onze Minister van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377aa
  - number: 377aa.c
    text: '*Gerecht in eerste aanleg:* het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba.'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377aa
  - number: 377bb
    text: |-
      De afdelingen 1, [2][ref1], [4][ref2], [6][ref3] en [7][ref4] zijn mede van toepassing op internationale
      kwesties van ouderlijke verantwoordelijkheid en maatregelen ter bescherming van kinderen die niet door het verdrag
      worden beheerst.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Afdeling4
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Afdeling6
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Afdeling7
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377bb
    references:
      - id: ref1
        bwb_id: BWBR0028743
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028743
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0028743
        afdeling: '6'
      - id: ref4
        bwb_id: BWBR0028743
        afdeling: '7'
  - number: 377cc.1
    text: |-
      Onverminderd het bepaalde in artikel 4 van het op 25 oktober 1980 te ’s-Gravenhage tot stand gekomen verdrag inzake
      de burgerrechtelijke aspecten van internationale ontvoering van kinderen (Trb. 1987, 139) en [artikel 377j][ref1]
      van dit Boek, is deze wet van toepassing op kinderen die de leeftijd van achttien jaren nog niet hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377j
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377cc
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377j
        afdeling: '1'
  - number: 377cc.2
    text: |-
      Bereikt een kind ten aanzien waarvan een verzoek op grond van het verdrag of van deze wet in behandeling is, de
      leeftijd van achttien jaren, dan wordt de behandeling van dat verzoek ambtshalve gestaakt. Hetzelfde geldt voor
      maatregelen ter uitvoering van een beslissing op een verzoek.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377cc
  - number: 377dd.1
    text: |-
      Onze Minister wordt voor de openbare lichamen aangewezen als centrale autoriteit, bedoeld in artikel 29 van het
      verdrag. Bij in de Staatscourant openbaar te maken besluit wijst hij de onder zijn ministerie ressorterende dienst,
      diensten of vertegenwoordigers op de openbare lichamen Bonaire, Sint Eustatius en Saba aan, die aldaar wordt of
      worden belast met de taak van centrale autoriteit.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377dd
  - number: 377dd.2
    text: |-
      De centrale autoriteit is belast met de in hoofdstuk V van het verdrag omschreven taken van de centrale autoriteit.
      Deze centrale autoriteit is als zodanig tevens belast met de behandeling van verzoeken om tussenkomst in
      internationale kwesties betreffende ouderlijke verantwoordelijkheid en maatregelen ter bescherming van kinderen,
      wanneer deze niet door het verdrag worden beheerst. Bij de behandeling van deze verzoeken worden de bepalingen van
      hoofdstuk V van het verdrag zoveel mogelijk in acht genomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377dd
  - number: 377dd.3
    text: |-
      In het bijzonder neemt de centrale autoriteit alle passende maatregelen om te bevorderen dat in de omstandigheden
      waarin het verdrag of deze wet van toepassing is, minnelijke schikkingen tot stand komen met betrekking tot de
      bescherming van de persoon of het vermogen van het kind.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377dd
  - number: 377dd.4
    text: |-
      De aanwijzing van de centrale autoriteit staat er niet aan in de weg dat een persoon zich rechtstreeks tot de
      rechter of andere autoriteiten wendt om de erkenning van de ouderlijke verantwoordelijkheid over een kind, het
      herstel van die verantwoordelijkheid over een kind te bereiken, of de vaststelling of wijziging van een beslissing
      inzake ouderlijke verantwoordelijkheid dan wel een maatregel ter bescherming van een kind te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377dd
  - number: 377ee.1
    text: |-
      De centrale autoriteit is bevoegd, zonodig ook zonder uitdrukkelijke volmacht van degene die zich met een verzoek
      tot haar heeft gewend, namens hem, anders dan in rechte, op te treden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377ee
  - number: 377ee.2
    text: |-
      Onverminderd het bepaalde in artikel 5, derde lid, van het op 20 mei 1980 te Luxemburg tot stand gekomen Europese
      verdrag betreffende de erkenning en de tenuitvoerlegging van beslissingen inzake het gezag over kinderen en
      betreffende het herstel van het gezag over kinderen (Trb. 1981, 10) en artikel 26 van het op 25 oktober 1980 te
      ’s-Gravenhage tot stand gekomen verdrag inzake de burgerrechtelijke aspecten van internationale ontvoering van
      kinderen (Trb. 1987, 139), draagt de centrale autoriteit zelf alle kosten die aan de uitvoering van haar taak zijn
      verbonden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377ee
  - number: 377ff
    text: |-
      De centrale autoriteit kan de uitvoering van bepaalde handelingen overeenkomstig door haar te geven aanwijzingen
      opdragen aan de voogdijraad. De bepalingen van dit hoofdstuk zijn mede van toepassing ten aanzien van de
      voogdijraad.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377ff
  - number: 377gg
    text: |-
      De gezaghebber en de ambtenaren van de burgerlijke stand verschaffen de centrale autoriteit kosteloos alle
      inlichtingen en verstrekken haar kosteloos en vrij van zegel alle afschriften en uittreksels uit hun registers die
      deze autoriteit van hen vraagt in verband met de uitvoering van haar taak.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377gg
  - number: 377hh.1
    text: |-
      Indien de centrale autoriteit voor het vinden van de verblijfplaats van een kind in een openbaar lichaam
      medewerking behoeft van dienaren van de openbare macht, kan zij zich voor het verkrijgen daarvan wenden tot de
      officier van justitie.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377hh
  - number: 377hh.2
    text: De officier van justitie behandelt een verzoek om medewerking van de centrale autoriteit met voorrang.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377hh
  - number: 377hh.3
    text: |-
      De ambtenaar, aangesteld voor de uitvoering van de politietaak, die is aangewezen om zijn medewerking te
      verlenen aan de opsporing van de verblijfplaats van een kind, mag daartoe elke plaats betreden, voor zover dat
      redelijkerwijs voor de vervulling van die taak nodig is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377hh
  - number: 377ii.1
    text: |-
      De beslissing tot plaatsing van, of tot verstrekking van zorg aan een uit een openbaar lichaam afkomstig kind in
      een pleeggezin of in een instelling in een andere staat ingevolge artikel 33 van het verdrag wordt genomen door de
      centrale autoriteit, bedoeld in [artikel 377dd, eerste lid][ref1], van dit Boek.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377dd
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377ii
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377dd
        afdeling: '2'
  - number: 377ii.2
    text: |-
      De centrale autoriteit zendt een gemotiveerd verzoek, vergezeld van een rapport betreffende het kind, toe aan de
      centrale autoriteit dan wel de andere bevoegde autoriteit van de staat waar de plaatsing of de verstrekking van
      zorg dient plaats te vinden. Zij treedt met deze autoriteit in overleg.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377ii
  - number: 377ii.3
    text: |-
      De in het eerste lid bedoelde beslissing wordt eerst genomen nadat de centrale autoriteit, bedoeld in
      [artikel 377dd, eerste lid][ref1], van dit Boek de volgende bescheiden heeft ontvangen:


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377d
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377ii
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377d
  - number: 377ii.3.a
    text: |-
      een schriftelijke verklaring van de personen of de instelling bij welke de plaatsing of de verstrekking van zorg
      dient plaats te vinden, waaruit hun instemming blijkt;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377ii
  - number: 377ii.3.b
    text: |-
      indien gewenst, een door de centrale autoriteit of de andere bevoegde autoriteit in het land van plaatsing
      opgesteld rapport waaruit de geschiktheid van de pleegouder tot het verstrekken van pleegzorg aan het kind blijkt;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377ii
  - number: 377ii.3.c
    text: de instemming, bedoeld in artikel 33, tweede lid, van het verdrag;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377ii
  - number: 377ii.3.d
    text: |-
      indien toepasselijk, bescheiden waaruit blijkt dat het kind toestemming heeft of zal verkrijgen om de staat waar
      de plaatsing of de verstrekking van zorg zal plaatsvinden, binnen te komen en met het oog op de plaatsing of de
      verstrekking van zorg een verblijfsrecht in die staat heeft of zal verkrijgen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377ii
  - number: 377jj.1
    text: |-
      In geval van plaatsing van een kind vanuit een andere staat in een openbaar lichaam of verstrekking van zorg
      aan een zodanig kind in een pleeggezin of in een instelling in een openbaar lichaam ingevolge artikel 33 van het
      verdrag dient de instemming, bedoeld in de genoemde artikelen, te worden gegeven door de centrale autoriteit,
      bedoeld in [artikel 377dd, eerste lid][ref1], van dit Boek.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377d
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377jj
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377d
  - number: 377jj.2
    text: |-
      De instemming, bedoeld in het eerste lid, wordt pas gegeven nadat de centrale autoriteit van de bevoegde autoriteit
      van de staat van herkomst van het kind een gemotiveerd verzoek heeft ontvangen, vergezeld van een rapport
      betreffende het kind, en nadat zij de volgende bescheiden heeft ontvangen, welke bescheiden zij toezendt aan de
      bevoegde autoriteit van het land van herkomst van het kind:
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377jj
  - number: 377jj.2.a
    text: |-
      een schriftelijke verklaring van de personen of de instelling bij welke de plaatsing of de verstrekking van zorg
      dient plaats te vinden, waaruit hun instemming blijkt;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377jj
  - number: 377jj.2.b
    text: |-
      indien gewenst, een rapport waaruit de geschiktheid van de pleegouder tot het verstrekken van pleegzorg aan het
      kind blijkt;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377jj
  - number: 377jj.2.c
    text: |-
      indien van toepassing, bescheiden waaruit blijkt dat het kind toestemming heeft of zal verkrijgen om Bonaire, Sint
      Eustatius of Saba binnen te komen en met het oog op de plaatsing of de verstrekking van zorg een verblijfsrecht
      heeft of zal verkrijgen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377jj
  - number: 377kk.1
    text: |-
      Indien de voorschriften van [artikel 377jj][ref1] van dit Boek niet in acht zijn genomen, kan de officier van
      justitie of de centrale autoriteit de rechter verzoeken de voogdijraad te belasten met de voorlopige toevertrouwing
      over het kind. Dit verzoek kan ook worden gedaan door de voogdijraad. Tenzij de rechter een langere termijn van
      verval van de voorlopige toevertrouwing heeft bepaald, wendt de raad zich binnen zes weken na de beslissing over de
      voorlopige voogdij tot de rechter om een voorziening in het gezag over de minderjarige te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377jj
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377kk
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377jj
        afdeling: '3'
  - number: 377kk.2
    text: |-
      De [zesde afdeling van titel veertien][ref1] van Boek 1 van het Burgerlijk Wetboek BES inzake
      voogdij is niet van toepassing op de uitoefening van de voorlopige toevertrouwing als bedoeld
      in de [artikelen 241][ref2], [271][ref3], [272][ref4], [331][ref5] en [332][ref6] van dit Boek.
      [Artikel 813, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref7] is bij een voorlopige
      toevertrouwing van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Afdeling6
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel241
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel271
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel272
      [ref5]: https://wetten.overheid.nl/BWBR0028743#Artikel331
      [ref6]: https://wetten.overheid.nl/BWBR0028743#Artikel332
      [ref7]: https://wetten.overheid.nl/BWBR0028496#Artikel813
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377kk
    references:
      - id: ref1
        bwb_id: BWBR0028743
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '241'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0028743
        artikel: '271'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0028743
        artikel: '272'
        afdeling: '5'
      - id: ref5
        bwb_id: BWBR0028743
        artikel: '331'
        paragraaf: '8'
        afdeling: '6'
      - id: ref6
        bwb_id: BWBR0028743
        artikel: '332'
        paragraaf: '8'
        afdeling: '6'
      - id: ref7
        bwb_id: BWBR0028496
        artikel: '813'
  - number: 377kk.3
    text: |-
      De voorlopige toevertrouwing eindigt, behoudens eerdere opheffing, op het tijdstip waarop hetzij de voogdij
      over het kind, dan wel diens plaatsing bij andere personen of een andere instelling, een aanvang neemt, of zijn
      terugkeer naar het land van herkomst is geregeld.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377kk
  - number: 377kk.4
    text: |-
      De kosten die de voogdijraad of, in voorkomend geval, de gezinsvoogdij-instelling ten behoeve van het kind moet
      maken, komen ten laste van degene bij wie het kind in strijd met [artikel 377jj][ref1] van dit Boek is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377jj
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377kk
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377jj
        afdeling: '3'
  - number: 377ll
    text: |-
      Tegen een besluit van Onze Minister is bezwaar mogelijk overeenkomstig de
      [Wet administratieve rechtspraak BES][ref1]. Onverminderd de bevoegdheid van de rechter in kort geding, is het
      Gerecht in eerste aanleg bevoegd tot kennisneming van alle zaken met betrekking tot de regeling en de uitoefening
      van ouderlijke verantwoordelijkheid en maatregelen ter bescherming van kinderen in internationale gevallen,
      behoudens voor zover het betreft de erkenning, de niet-erkenning en de tenuitvoerlegging van buitenlandse
      beslissingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028455
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377ll
    references:
      - id: ref1
        bwb_id: BWBR0028455
  - number: 377mm
    text: |-
      De zaken tot kennisneming waarvan het Gerecht in eerste aanleg op grond van [artikel 377ll][ref1] van dit Boek
      bevoegd is, worden ingeleid met een verzoekschrift. Het verzoekschrift wordt ingediend door een advocaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377ll
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377mm
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377ll
        afdeling: '4'
  - number: 377nn
    text: |-
      [Artikel 377v][ref1] van dit Boek is van overeenkomstige toepassing in gevallen die door het verdrag of deze Titel
      worden bestreken.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377v
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377nn
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377v
        afdeling: '3'
  - number: 377oo.1
    text: |-
      De voorzieningenrechter van het Gerecht in eerste aanleg is bevoegd tot kennisneming van alle
      verzoeken die betrekking hebben op de erkenning, de niet-erkenning en de tenuitvoerlegging van
      beslissingen inzake ouderlijke verantwoordelijkheid en maatregelen ter bescherming van kinderen
      die op grond van het verdrag zijn gegeven. Ten aanzien van het verlof tot tenuitvoerlegging zijn de
      [artikelen 985 tot en met 990 van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel985
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377oo
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '985'
  - number: 377oo.2
    text: |-
      Een beslissing op een verzoek als bedoeld in het eerste lid, wordt gevraagd bij verzoekschrift. Het wordt ingediend
      door een advocaat.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377oo
  - number: 377pp.1
    text: |-
      De voorzieningenrechter bij wie een verzoek als bedoeld in [artikel 377oo][ref1] van dit Boek, eerste lid, is
      ingediend, doet daarover onverwijld uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377oo
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377pp
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377oo
        afdeling: '5'
  - number: 377pp.2
    text: Het verlof tot tenuitvoerlegging is uitvoerbaar bij voorraad.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377pp
  - number: 377qq.1
    text: |-
      Het Gerecht in eerste aanleg neemt kennis van het hoger beroep van een beschikking als bedoeld in
      [artikel 377pp, eerste lid][ref1], van dit Boek. Alleen de partijen kunnen hoger beroep tegen de beschikking
      instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377pp
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377qq
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377pp
        afdeling: '5'
  - number: 377qq.2
    text: |-
      Het hoger beroep tegen een beschikking waarbij een verzoek als bedoeld in [artikel 377oo, eerste lid][ref1], van
      dit Boek is ingewilligd, moet worden ingesteld binnen een maand na de betekening van de beschikking. Indien de
      partij tegen wie tenuitvoerlegging wordt gevraagd, haar gewone verblijfplaats heeft in het buitenland, bedraagt
      de termijn voor het instellen van hoger beroep twee maanden, te rekenen vanaf de datum van de betekening aan deze
      partij in persoon of aan zijn adres. De termijn kan niet op grond van de afstand worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377oo
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377qq
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377oo
        afdeling: '5'
  - number: 377qq.3
    text: |-
      Indien hoger beroep wordt ingesteld door de verzoeker en is gericht tegen de weigering om een verzoek als bedoeld
      in [artikel 377oo, eerste lid][ref1], van dit Boek in te willigen, wordt het ingesteld binnen een maand na de
      dagtekening van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377oo
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377qq
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377oo
        afdeling: '5'
  - number: 377qq.4
    text: Het Gerecht in eerste aanleg doet onverwijld uitspraak in hoger beroep.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377qq
  - number: 377qq.5
    text: Tegen de in hoger beroep gegeven beschikking kan slechts beroep in cassatie worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377qq
  - number: 377qq.6
    text: |-
      Het Gerecht in eerste aanleg in hoger beroep, onderscheidenlijk de Hoge Raad als beroep in cassatie is ingesteld,
      kan op verzoek van de partij tegen wie tenuitvoerlegging wordt gevraagd, zijn uitspraak aanhouden indien in
      de staat van herkomst van de beslissing een gewoon rechtsmiddel is ingesteld of de termijn daartoe nog niet is
      verstreken. In dit laatste geval kan het Gerecht, onderscheidenlijk de Hoge Raad, een termijn vaststellen binnen
      welke het rechtsmiddel moet worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377qq
  - number: 377qq.7
    text: |-
      Indien in de beslissing uitspraak is gedaan over meer dan een onderdeel van het verzoek en de tenuitvoerlegging
      niet voor het geheel kan worden toegestaan, wordt de tenuitvoerlegging voor één of meer van die onderdelen
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377qq
  - number: 377rr.1
    text: |-
      Het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en
      Saba kiest uit zijn leden een of meer rechters, die voor de openbare lichamen in het bijzonder belast zijn met
      het faciliteren van contacten, over en weer, met rechters in het buitenland over aanhangige procedures inzake
      internationale kwesties van ouderlijke verantwoordelijkheid en maatregelen ter bescherming van kinderen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377rr
  - number: 377rr.2
    text: |-
      Indien een rechter in verband met een procedure in het eerste lid een rechter in het buitenland wenst te
      consulteren, kan hij gebruik maken van de tussenkomst van de in het eerste lid bedoelde rechter.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377rr
  - number: 377rr.3
    text: |-
      De in het tweede lid bedoelde tussenkomst wordt ook verleend aan een rechter in het buitenland die in verband met
      een bij hem aanhangige procedure als bedoeld in het eerste lid een rechter van het Gerecht in eerste aanleg of van
      het Gemeenschappelijk Hof wenst te consulteren.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377rr
  - number: 377rr.4
    text: |-
      Indien in verband met een consultatie als bedoeld in het tweede of het derde lid stukken dienen te worden vertaald
      of indien daarvoor de bijstand van een tolk nodig is, draagt de in het eerste lid bedoelde rechter hiervoor zorg.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377rr
  - number: 377rr.5
    text: |-
      Voordat een consultatie als bedoeld in het tweede lid plaatsvindt, stelt de rechter bij wie de procedure aanhangig
      is, de partijen hiervan in kennis. Nadat de consultatie heeft plaatsgevonden, doet hij partijen verslag van de
      consultatie.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377rr
  - number: 377rr.6
    text: |-
      De overdracht van verzoeken als bedoeld in de [artikelen 8][ref1] en [9][ref2] van het verdrag geschiedt door
      tussenkomst van de in het eerste lid bedoelde rechter. De rechter die een verzoek heeft overgedragen, stelt
      partijen hiervan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel9
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377rr
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '9'
  - number: 377ss.1
    text: Tot de afgifte van een verklaring als bedoeld in artikel 40 van het verdrag is bevoegd de notaris.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377ss
  - number: 377ss.2
    text: De verklaring wordt afgegeven op een door Onze Minister vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377ss
  - number: '378.1'
    text: 'Een meerderjarige kan door de rechter in eerste aanleg onder curatele worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel378
  - number: 378.1.a
    text: |-
      wegens een geestelijke stoornis, waardoor de gestoorde, al dan niet met tussenpozen, niet in staat is of
      bemoeilijkt wordt zijn belangen behoorlijk waar te nemen;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel378
  - number: 378.1.b
    text: wegens verkwisting;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel378
  - number: 378.1.c
    text: |-
      wegens gewoonte van drankmisbruik dan wel gewoonte van misbruik van verdovende of stimulerende middelen, waardoor
      hij:
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel378
  - number: 378.1.c.1
    text: zijn belangen niet behoorlijk waarneemt,
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel378
  - number: 378.1.c.2
    text: in het openbaar herhaaldelijk aanstoot geeft, of
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel378
  - number: 378.1.c.3
    text: de eigen veiligheid of die van anderen in gevaar brengt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel378
  - number: '378.2'
    text: |-
      Indien te verwachten is dat ten aanzien van een minderjarige op het tijdstip waarop hij meerderjarig zal worden,
      van een der in het eerste lid genoemde gronden voor curatele sprake zal zijn, kan de curatele reeds voor de
      meerderjarigheid worden uitgesproken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel378
  - number: '379'
    text: |-
      De curatele kan worden verzocht door de betrokken persoon, zijn echtgenoot of andere levensgezel, zijn
      bloedverwanten in de rechte lijn en die in de zijlijn tot de vierde graad ingesloten alsmede door zijn voogd; zij
      kan ook worden gevorderd door het Openbaar Ministerie.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel379
  - number: '380.1'
    text: |-
      De rechter voor wie het verzoek tot ondercuratelestelling aanhangig is of laatstelijk aanhangig was, kan,
      desverzocht of ambtshalve, een provisionele bewindvoerder benoemen; de beschikking vermeldt het tijdstip waarop zij
      in werking treedt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel380
  - number: '380.2'
    text: |-
      Hij regelt in deze beschikking de bevoegdheden van de bewindvoerder. Hij kan de bewindvoerder het bewind over
      bepaalde of alle goederen opdragen. Aan de bewindvoerder kan de rechter ook andere bevoegdheden toekennen, doch
      niet die welke een curator niet heeft. Voor zover de rechter niet anders bepaalt, kan degene wiens curatele is
      verzocht, met betrekking tot die goederen niet zonder medewerking van de bewindvoerder daden van beheer en van
      beschikking verrichten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel380
  - number: '380.3'
    text: |-
      In de beschikking kan tevens worden bepaald dat schulden die degene wiens curatele is verzocht, na de bekendmaking
      van de benoeming maakt, op de onder bewind gestelde goederen gedurende dit bewind en de curatele, indien deze
      volgt, niet kunnen worden verhaald.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel380
  - number: '380.4'
    text: |-
      De beschikking kan te allen tijde worden gewijzigd of ingetrokken door de rechter voor wie het verzoek tot
      ondercuratelestelling aanhangig is of laatstelijk aanhangig was.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel380
  - number: '380.5'
    text: |-
      De bewindvoerder komt als beloning toe 5% van de netto-opbrengst der door hem beheerde goederen, tenzij de rechter
      in eerste aanleg daarvoor om bijzondere redenen een ander bedrag vaststelt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel380
  - number: '381.1'
    text: |-
      De curatele werkt met ingang van de dag waarop zij is uitgesproken. In het geval, bedoeld in
      [artikel 378, tweede lid][ref1], werkt de curatele met ingang van het tijdstip waarop de onder curatele gestelde
      meerderjarig wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel378
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel381
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '378'
  - number: '381.2'
    text: |-
      Vanaf deze tijdstippen is de onder curatele gestelde onbekwaam rechtshandelingen te verrichten, voor zover de wet
      niet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel381
  - number: '381.3'
    text: |-
      Een onder curatele gestelde is bekwaam rechtshandelingen te verrichten met toestemming van zijn curator, voor zover
      deze bevoegd is die rechtshandelingen voor de onder curatele gestelde te verrichten. De toestemming kan slechts
      worden verleend voor een bepaalde rechtshandeling of voor een bepaald doel. De toestemming voor een bepaald doel
      moet schriftelijk worden verleend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel381
  - number: '381.4'
    text: |-
      Met betrekking tot aangelegenheden betreffende verzorging, verpleging, behandeling en begeleiding van een onder
      curatele gestelde zijn de [artikelen 453][ref1] en [454][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel453
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel454
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel381
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '453'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '454'
  - number: '381.5'
    text: |-
      Hij is bekwaam over gelden die zijn curator voor levensonderhoud te zijner beschikking heeft gesteld,
      overeenkomstig deze bestemming te beschikken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel381
  - number: '381.6'
    text: |-
      In zaken van curatele is degene wiens curatele het betreft, bekwaam in rechte op te treden en tegen een uitspraak
      beroep in te stellen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel381
  - number: '382'
    text: |-
      Hij die onder curatele staat mag geen familierechtelijke handelingen verrichten zonder toestemming van de rechter
      in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel382
  - number: '383.1'
    text: |-
      De rechter benoemt bij het uitspreken van de curatele of, indien hij zich nog niet voldoende voorgelicht acht, zo
      spoedig mogelijk daarna een curator.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel383
  - number: '383.2'
    text: |-
      De rechter volgt bij de benoeming van de curator de uitdrukkelijke voorkeur van de betrokkene, tenzij gegronde
      redenen zich tegen zodanige benoeming verzetten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel383
  - number: '383.3'
    text: |-
      Tenzij het tweede lid is toegepast, wordt, indien de onder curatele gestelde is gehuwd of een andere levensgezel
      heeft, bij voorkeur de echtgenoot of de andere levensgezel tot curator benoemd. Is de vorige zin niet van
      toepassing, dan wordt bij voorkeur een van zijn ouders, kinderen, broers of zusters tot curator benoemd. Huwt de
      onder curatele gestelde of verkrijgt hij een andere levensgezel, dan kan ieder van hen verzoeken dat de niet onder
      curatele staande echtgenoot of de andere levensgezel in de plaats van de tegenwoordige curator wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel383
  - number: '383.4'
    text: |-
      De taak van de curator vangt aan daags nadat de benoeming is verstrekt of verzonden. Op die dag eindigt het
      provisioneel bewind. De provisionele bewindvoerder is verplicht ten overstaan van de rechter in eerste aanleg aan
      de curator rekening en verantwoording van zijn bemoeienissen af te leggen; wordt hij zelf tot curator benoemd,
      dan wordt de rekening en verantwoording aan de rechter afgelegd. Indien de curator vóór de meerderjarigheid van de
      onder curatele gestelde is benoemd, vangt zijn taak aan op het tijdstip waarop de curatele in werking treedt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel383
  - number: '383.5'
    text: |-
      Indien het verzoek tot ondercuratelestelling wordt afgewezen, eindigt het bewind van de provisionele bewindvoerder
      daags na die uitspraak, tenzij de rechter anders bepaalt, en in ieder geval uiterlijk daags nadat de afwijzing in
      kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel383
  - number: '384'
    text: |-
      Indien een beschikking waarbij curatele is uitgesproken, in hoger beroep of cassatie wordt vernietigd en het
      verzoek tot ondercuratelestelling alsnog wordt afgewezen, neemt de taak van de curator daags na deze uitspraak een
      einde. De inmiddels door de curator of met zijn toestemming verrichte handelingen blijven voor de onder curatele
      gestelde verbindend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel384
  - number: '385.1'
    text: |-
      Behoudens het in de [artikelen 383][ref1] en [384][ref2] bepaalde vinden de [artikelen 250][ref3],
      [280, onderdeel b][ref4], [281, eerste lid, onderdeel a, en tweede lid][ref5], [297 tot en met 299][ref6],
      [322, onderdelen a en c][ref7], [324][ref8], [336][ref9] en [372 tot en met 377][ref10] bij curatele
      overeenkomstige toepassing, met dien verstande dat:


