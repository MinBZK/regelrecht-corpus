        afdeling: '6'
      - id: ref9
        bwb_id: BWBR0028743
        artikel: '336'
        paragraaf: '9'
        afdeling: '6'
      - id: ref10
        bwb_id: BWBR0028743
        artikel: '372'
        paragraaf: '11'
        afdeling: '6'
  - number: 385.1.a
    text: |-
      in geval van benoeming van een ouder tot curator een bereidverklaring als bedoeld in
      [artikel 280, onderdeel b][ref1], niet is vereist;


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel280
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel385
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '280'
        paragraaf: '1'
        afdeling: '6'
  - number: 385.1.b
    text: aan de voogdijraad ter zake geen bevoegdheden toekomen;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel385
  - number: 385.1.c
    text: |-
      de curator te allen tijde wegens gewichtige redenen op eigen verzoek, op verzoek van de onder curatele gestelde, op
      vordering van het Openbaar Ministerie of ambtshalve door de rechter in eerste aanleg kan worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel385
  - number: '385.2'
    text: |-
      Een curator die niet is de echtgenoot of andere levensgezel of bloedverwant in de rechte lijn van de onder curatele
      gestelde, kan bovendien ontslag verzoeken wanneer hij de curatele ten minste acht jaren heeft uitgeoefend; het
      ontslag wordt verleend zodra de rechter in eerste aanleg zich in staat acht een geschikte opvolger te benoemen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel385
  - number: '386.1'
    text: |-
      Op het bewind van de curator zijn de omtrent het bewind van de voogd gegeven voorschriften van overeenkomstige
      toepassing.Tenzij de beloning bij het uitspreken van de curatele anders is geregeld, komt de curator – de ouder-
      curator daaronder begrepen – als beloning toe 5% van de netto-opbrengst der door hem beheerde goederen. Op
      grond van bijzondere omstandigheden kan de rechter in eerste aanleg, hetzij ambtshalve, hetzij op verzoek van de
      curator of van de onder curatele gestelde, voor bepaalde of onbepaalde tijd de beloning anders regelen dan bij het
      uitspreken van de curatele of door de wet is aangegeven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel386
  - number: '386.2'
    text: |-
      De inkomsten van hem die onder curatele is gesteld, moeten in de eerste plaats worden besteed voor een voldoende
      verzorging van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel386
  - number: '386.3'
    text: |-
      Voor de toepassing van de [artikelen 365 tot en met 367][ref1] treedt de officier van justitie in de plaats van
      de voogdijraad, en het ontslag, bedoeld in [artikel 385, eerste lid, onderdeel c][ref2], in de plaats van de
      ontzetting van de voogd op grond van [artikel 327, eerste lid, onderdeel b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel365
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel385
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel327
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel386
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '365'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '385'
      - id: ref3
        bwb_id: BWBR0028743
        artikel: '327'
        paragraaf: '8'
        afdeling: '6'
  - number: '386.4'
    text: |-
      Indien een gehuwde onder curatele wordt gesteld, en tussen de echtgenoten het bestuur over hun goederen en de
      goederen der gemeenschap anders is verdeeld dan volgens de regels van de wet en van huwelijkse voorwaarden, bepaalt
      de rechter bij het uitspreken van de curatele of en in hoeverre die verdeling ook voor de curator zal gelden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel386
  - number: '387.1'
    text: |-
      De rechter in eerste aanleg heeft mede het vermogen om de persoon die uit hoofde van gewoonte van drankmisbruik
      dan wel gewoonte van misbruik van verdovende of stimulerende middelen onder curatele is gesteld, hetzij tegelijk
      met deze voorziening, hetzij daarna, uiterlijk voor één jaar, doch, zo nodig, telkens uiterlijk voor één jaar te
      verlengen, ter verpleging in een inrichting te doen plaatsen, wanneer blijkt dat hij in het openbaar herhaaldelijk
      aanstoot geeft of eigen veiligheid of die van anderen in gevaar brengt. Indien er onverwijlde noodzakelijkheid
      bestaat, en de vertraging tot de afloop van het rechterlijk onderzoek gevaarlijk zou kunnen zijn, is de rechter in
      eerste aanleg bevoegd om, hangende dat onderzoek, zodanige voorlopige behoedmiddelen, en desnoods de vastzetting,
      te bevelen als de omstandigheden vorderen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel387
  - number: '387.2'
    text: |-
      De inrichtingen waar de verpleging bedoeld in het eerste lid kan plaats vinden, worden aangewezen door de Minister
      van Justitie in overeenstemming met de minister, belast met de zorg voor de volksgezondheid. Een aanwijzing kan te
      allen tijde worden ingetrokken. Bij algemene maatregel van bestuur kunnen voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel387
  - number: '388'
    text: |-
      Het verzoek tot vastzetting kan aan de rechter in eerste aanleg worden gedaan door de betrokken persoon, zijn
      echtgenoot of andere levensgezel, zijn bloedverwanten in de rechte lijn en die in de zijlijn tot de derde graad
      ingesloten, zijn voogd, zijn curator en door het Openbaar Ministerie.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel388
  - number: '389.1'
    text: |-
      De curatele eindigt wanneer bij in kracht van gewijsde gegane rechterlijke uitspraak is vastgesteld dat de oorzaken
      die tot de curatele hebben aanleiding gegeven, niet meer aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel389
  - number: '389.2'
    text: |-
      Het verzoek of de vordering daartoe kan worden gedaan door dezelfde personen die de curatele kunnen verzoeken of
      vorderen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel389
  - number: '389.3'
    text: |-
      De curatele eindigt voorts wanneer bij in kracht van gewijsde gegane rechterlijke uitspraak ten behoeve
      van de betrokken persoon een bewind als bedoeld in [titel 19][ref1], dan wel een mentorschap als bedoeld in
      [titel 20][ref2], is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
      [ref2]: https://wetten.overheid.nl/BWBR0028743
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel389
    references:
      - id: ref1
        bwb_id: BWBR0028743
      - id: ref2
        bwb_id: BWBR0028743
  - number: '390.1'
    text: |-
      Alle uitspraken waarbij een curatele wordt verleend of opgeheven, een provisioneel bewind wordt ingesteld of
      een uitspraak tot ondercuratelestelling wordt vernietigd, worden binnen tien dagen nadat zij kunnen worden ten
      uitvoer gelegd, vanwege de verzoekers in de Staatscourant benevens in twee door de rechter aan te wijzen dagbladen
      bekendgemaakt. In geval de verzoekers daarmede nalatig zijn, zijn zij hoofdelijk gehouden aan derden de daardoor
      veroorzaakte schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel390
  - number: '390.2'
    text: |-
      De bekendmaking van een ondercuratelestelling op eigen verzoek of op vordering van het Openbaar Ministerie
      geschiedt vanwege de curator, indien deze bij de ondercuratelestelling is benoemd, of anders vanwege de griffier.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel390
  - number: '391'
    text: |-
      Ter griffie van de rechtbank te ‘s-Gravenhage berusten openbare registers, waarin aantekening wordt gehouden van
      rechtsfeiten die betrekking hebben op curatele. Bij algemene maatregel van bestuur wordt bepaald welke rechtsfeiten
      aangetekend worden en op welke wijze deze aantekening geschiedt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel391
  - number: '392.1'
    text: 'Tot het verstrekken van levensonderhoud zijn op grond van bloed- of aanverwantschap gehouden:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel392
  - number: 392.1.a
    text: de ouders;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel392
  - number: 392.1.b
    text: de kinderen;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel392
  - number: 392.1.c
    text: behuwdkinderen, schoonouders en stiefouders.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel392
  - number: '392.2'
    text: |-
      Deze verplichting bestaat, behalve wat betreft ouders en stiefouders jegens hun minderjarige kinderen en
      stiefkinderen en jegens hun kinderen, bedoeld in [artikel 395a][ref1], slechts in geval van behoeftigheid van de
      tot levensonderhoud gerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel395a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel392
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 395a
        afdeling: '1'
  - number: '392.3'
    text: |-
      De in het eerste lid genoemde personen zijn niet verplicht levensonderhoud te verstrekken, voor zover dit van
      de echtgenoot of een vroegere echtgenoot overeenkomstig [titel 6][ref1], [9][ref2] of [10][ref3] kan worden
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
      [ref2]: https://wetten.overheid.nl/BWBR0028743
      [ref3]: https://wetten.overheid.nl/BWBR0028743
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel392
    references:
      - id: ref1
        bwb_id: BWBR0028743
      - id: ref2
        bwb_id: BWBR0028743
      - id: ref3
        bwb_id: BWBR0028743
  - number: '394'
    text: |-
      De verwekker van een kind dat alleen een moeder heeft, alsmede de man die als levensgezel van de moeder ingestemd
      heeft met een daad die de verwekking van het kind tot gevolg kan hebben gehad, is als ware hij ouder verplicht tot
      het voorzien in de kosten van verzorging en opvoeding van het kind dan wel, na het bereiken van de meerderjarigheid
      van het kind, tot het voorzien in de kosten van levensonderhoud en studie overeenkomstig de [artikelen 395a][ref1]
      en [395b][ref2]. Nadien bestaat deze verplichting slechts in geval van behoeftigheid van het kind.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel395a
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel395b
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel394
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 395a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: 395b
        afdeling: '1'
  - number: '395'
    text: |-
      Een stiefouder is, onverminderd [artikel 395a][ref1], alleen verplicht gedurende zijn huwelijk levensonderhoud te
      verstrekken aan de tot zijn gezin behorende kinderen van zijn echtgenoot.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel395a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel395
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 395a
        afdeling: '1'
  - number: 395a.1
    text: |-
      Ouders zijn verplicht te voorzien in de kosten van levensonderhoud en studie van hun meerderjarige kinderen die de
      leeftijd van 21 jaren niet hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel395a
  - number: 395a.2
    text: |-
      Een stiefouder is gedurende zijn huwelijk jegens de tot zijn gezin behorende meerderjarige kinderen van zijn
      echtgenoot die de leeftijd van 21 jaren niet hebben bereikt, verplicht te voorzien in de in het eerste lid bedoelde
      kosten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel395a
  - number: 395b.1
    text: |-
      Heeft de rechter het bedrag bepaald dat een ouder of stiefouder dan wel, overeenkomstig [artikel 394][ref1], de
      verwekker of de man die in artikel 394 daarmee is gelijkgesteld ter zake van de verzorging en opvoeding van zijn
      minderjarig kind of stiefkind moet betalen en is deze verplichting tot aan het meerderjarig worden van het kind
      van kracht geweest, dan geldt met ingang van dit tijdstip de rechterlijke beslissing als een tot bepaling van het
      bedrag ter zake van levensonderhoud en studie als in [artikel 395a][ref2] bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel394
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel395a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel395b
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '394'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: 395a
        afdeling: '1'
  - number: 395b.2
    text: |-
      Hetzelfde geldt indien de rechter met toepassing van [artikel 406a][ref1] het bedrag heeft vastgesteld dat een
      ouder of stiefouder ter bestrijding van de kosten van een maatregel van kinderbescherming aan de voogdijraad moet
      uitkeren.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel406a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel395b
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 406a
        afdeling: '2'
  - number: 395b.3
    text: |-
      De voogdijraad draagt zorg dat de gelden die hem krachtens dit artikel worden uitgekeerd, aan het kind worden
      uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel395b
  - number: 395b.4
    text: |-
      Voor de toepassing van dit artikel is bevoegd de voogdijraad die laatstelijk voor het meerderjarig worden van het
      kind overeenkomstig [artikel 239][ref1] bevoegd was op te treden. Deze raad kan ook wijziging van het bedrag dat is
      verschuldigd ter zake van levensonderhoud en studie, verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel239
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel395b
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '239'
        afdeling: '3'
  - number: 395b.5
    text: |-
      In afwijking van het eerste en tweede lid is het bedrag aan het kind verschuldigd en dient dit ook aan hem te
      worden betaald, indien het kind aan de voogdijraad schriftelijk heeft medegedeeld van optreden van deze laatste
      volledig af te zien.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel395b
  - number: '396.1'
    text: |-
      De verplichting van behuwdkinderen en van schoonouders tot het verstrekken van onderhoud vervalt wanneer het
      huwelijk van het behuwdkind is ontbonden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel396
  - number: '396.2'
    text: |-
      De verplichting bestaat niet jegens een behuwdkind dat is gescheiden van tafel en bed en jegens een schoonouder
      nadat deze is hertrouwd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel396
  - number: '397.1'
    text: |-
      Bij de bepaling van het volgens de wet door bloed- en aanverwanten verschuldigde bedrag voor levensonderhoud wordt
      enerzijds rekening gehouden met de behoeften van de tot onderhoud gerechtigde en anderzijds met de draagkracht van
      de tot uitkering verplichte persoon.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel397
  - number: '397.2'
    text: |-
      Zijn meerdere bloed- of aanverwanten tot het verstrekken van levensonderhoud aan dezelfde persoon verplicht, dan is
      ieder van hen gehouden een deel van het bedrag te voldoen dat de tot onderhoud gerechtigde behoeft. Bij de bepaling
      van dit deel wordt rekening gehouden met ieders draagkracht en de verhouding waarin een ieder tot de gerechtigde
      staat.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel397
  - number: '398.1'
    text: |-
      Wanneer hij die tot levensonderhoud verplicht is, buiten staat is het daartoe vereiste geld op te brengen, kan de
      rechter in eerste aanleg bevelen dat hij de bloed- of aanverwant aan wie hij levensonderhoud verschuldigd is, bij
      zich in huis zal nemen en aldaar van het nodige voorzien.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel398
  - number: '398.2'
    text: |-
      Ouders zijn steeds bevoegd de rechter te verzoeken hun toe te staan zich van hun onderhoudsplicht jegens hun
      behoeftig meerderjarig kind op de in het eerste lid omschreven wijze te kwijten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel398
  - number: '399'
    text: |-
      De rechter kan de verplichting van bloed- en aanverwanten tot levensonderhoud matigen op grond van zodanige
      gedragingen van de tot onderhoud gerechtigde dat verstrekking van levensonderhoud naar redelijkheid niet of niet
      ten volle kan worden gevergd; onverminderd hetgeen in [afdeling 2][ref1] is bepaald omtrent de voorziening in de
      kosten van de verzorging en opvoeding van minderjarige kinderen en stiefkinderen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Afdeling2
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel399
    references:
      - id: ref1
        bwb_id: BWBR0028743
        afdeling: '2'
  - number: '400.1'
    text: |-
      Indien een persoon verplicht is levensonderhoud te verstrekken aan twee of meer personen, en zijn draagkracht
      onvoldoende is om dit volledig aan allen te verschaffen, hebben zijn echtgenoot, zijn vroegere echtgenoot, zijn
      ouders, zijn kinderen en stiefkinderen voorrang boven zijn behuwdkinderen en zijn schoonouders.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel400
  - number: '400.2'
    text: Overeenkomsten waarbij van het volgens de wet verschuldigde levensonderhoud wordt afgezien, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel400
  - number: '401.1'
    text: |-
      Een rechterlijke uitspraak of een overeenkomst betreffende levensonderhoud kan bij latere rechterlijke uitspraak
      worden gewijzigd of ingetrokken, wanneer zij nadien door wijziging van omstandigheden ophoudt aan de wettelijke
      maatstaven te voldoen. De voorafgaande zin is niet van toepassing op een verzoek tot wijziging van een termijn die
      de rechter heeft vastgesteld op grond van [artikel 157][ref1] of die is opgenomen in een overeenkomst als bedoeld
      in [artikel 158][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel158
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel401
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '157'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '158'
        afdeling: '2'
  - number: '401.2'
    text: |-
      De termijn die de rechter heeft vastgesteld op grond van [artikel 157, derde of vijfde lid dan wel zesde lid][ref1],
      tweede zin, of die is opgenomen in een overeenkomst als bedoeld in [artikel 158][ref2], kan op verzoek van een van
      de gewezen echtgenoten worden gewijzigd in geval van zo ingrijpende wijziging van omstandigheden dat ongewijzigde
      handhaving van de termijn naar maatstaven van redelijkheid en billijkheid niet van de verzoeker kan worden gevergd.
      Verlenging is niet mogelijk indien de rechter zulks ingevolge artikel 157, vijfde lid, heeft bepaald. Op een
      verzoek tot verlenging is artikel 157, vijfde lid, tweede en derde zin, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel158
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel401
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '157'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '158'
        afdeling: '2'
  - number: '401.3'
    text: |-
      Partijen kunnen schriftelijk overeenkomen dat het eerste lid, eerste zin, van toepassing is op een verzoek tot
      wijziging van een termijn die is opgenomen in een overeenkomst als bedoeld in [artikel 158][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel158
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel401
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '158'
        afdeling: '2'
  - number: '401.4'
    text: |-
      Een rechterlijke uitspraak betreffende levensonderhoud kan ook worden gewijzigd of ingetrokken, indien zij van de
      aanvang af niet aan de wettelijke maatstaven heeft beantwoord doordat bij die uitspraak van onjuiste of onvolledige
      gegevens is uitgegaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel401
  - number: '401.5'
    text: |-
      Een overeenkomst betreffende levensonderhoud kan ook worden gewijzigd of ingetrokken, indien zij is aangegaan met
      grove miskenning van de wettelijke maatstaven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel401
  - number: '402.1'
    text: |-
      De rechter die het bedrag van een uitkering tot levensonderhoud bepaalt, wijzigt of intrekt, stelt tevens de dag
      vast van welke dit bedrag verschuldigd is of ophoudt verschuldigd te zijn.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel402
  - number: '402.2'
    text: |-
      Bij de vaststelling van een bedrag bepaalt de rechter tevens of dit wekelijks, maandelijks of driemaandelijks moet
      worden voldaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel402
  - number: '402.3'
    text: |-
      Zouden op de dag dat de uitspraak ten uitvoer kan worden gelegd, reeds meer dan één termijn verschenen zijn of meer
      dan één termijn terugbetaald moeten worden, dan kan de rechter ook daarvoor een betaling in termijnen toestaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel402
  - number: 402a.1
    text: |-
      De bij rechterlijke uitspraak of bij overeenkomst vastgestelde bedragen voor levensonderhoud worden jaarlijks van
      rechtswege gewijzigd met een door de Minister van Justitie vast te stellen percentage, dat, behoudens het bepaalde
      in het derde lid, overeenkomt met de ontwikkeling der lonen overeenkomstig de laatste gegevens over een geheel
      jaar, per 30 september van enig jaar, van het Centraal Bureau voor de Statistiek.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel402a
  - number: 402a.2
    text: |-
      De wijziging gaat in op 1 januari volgende op de in het eerste lid genoemde datum. De beschikking waarin het
      percentage is vastgesteld, wordt bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel402a
  - number: 402a.3
    text: |-
      Het percentage van de wijziging van de bedragen voor levensonderhoud kan worden afgerond op tienden van een
      procent. Daarbij vindt, indien van het procentuele verschil der lonen het tweede of een volgend cijfer achter de
      komma 5 bedraagt, voor wat betreft die cijfers afronding naar beneden plaats.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel402a
  - number: 402a.4
    text: |-
      De wijziging van rechtswege kan bij rechterlijke uitspraak of bij overeenkomst geheel of voor een bepaalde
      tijdsduur worden uitgesloten. Daarbij kan tevens worden bepaald dat en op welke wijze het bedrag voor
      levensonderhoud anders dan van rechtswege periodiek zal worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel402a
  - number: 402a.5
    text: |-
      Bij de uitspraak, waarbij de tweede zin van het vierde lid toepassing heeft gevonden, en ook nadien, kan de
      rechter een regeling geven omtrent de wijze en de tijdstippen waarop de tot uitkering verplichte persoon aan de tot
      uitkering gerechtigde gegevens dient te verschaffen ten behoeve van de vaststelling van de wijziging van het bedrag
      voor levensonderhoud. Deze beslissingen kunnen worden gegeven en nadien worden gewijzigd op verzoek van de tot
      uitkering verplichte of gerechtigde persoon.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel402a
  - number: 402a.6
    text: |-
      De uitsluiting van de wijziging van rechtswege kan bij rechterlijke uitspraak worden ingetrokken. Voor zover
      het een uitsluiting betreft waarbij de tweede zin van het vierde lid niet is toegepast, kan de intrekking alleen
      geschieden in de gevallen, bedoeld in [artikel 401][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel401
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel402a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '401'
        afdeling: '1'
  - number: 402a.7
    text: |-
      De tenuitvoerlegging van een executoriale titel betreffende de betaling van levensonderhoud geschiedt met
      inachtneming van de op het tijdstip van de tenuitvoerlegging ingegane wijzigingen van rechtswege dan wel met
      inachtneming van de wijzigingen overeenkomstig de tweede zin van het vierde lid.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel402a
  - number: '403'
    text: |-
      Geen uitkering is verschuldigd over de tijd die op het tijdstip van het indienen van het verzoek reeds meer dan
      vijf jaren is verstreken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel403
  - number: '404.1'
    text: |-
      Ouders zijn verplicht naar draagkracht te voorzien in de kosten van verzorging en opvoeding van hun minderjarige
      kinderen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel404
  - number: '404.2'
    text: |-
      Gelijke verplichting bestaat voor een stiefouder in het geval van [artikel 395][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel395
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel404
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '395'
        afdeling: '1'
  - number: '406.1'
    text: |-
      Komt een ouder of stiefouder zijn verplichting tot voorziening in de kosten van verzorging en opvoeding niet of
      niet behoorlijk na, dan kan zowel de voogdijraad als de andere ouder of voogd de rechter in eerste aanleg verzoeken
      het bedrag te bepalen dat deze ouder of stiefouder ten behoeve van het kind zal moeten uitkeren.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel406
  - number: '406.2'
    text: |-
      De rechter kan het in het eerste lid bedoelde bedrag reeds bepalen gelijktijdig met een door hem te geven
      beslissing omtrent het gezag.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel406
  - number: 406a
    text: |-
      Een op [artikel 394][ref1] gegrond verzoek kan ten behoeve van een minderjarig kind door hem die het gezag over het
      kind heeft, worden gedaan. De ouder of voogd van het kind behoeft de in [artikel 349, eerste en tweede lid][ref2],
      bedoelde machtiging niet.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel394
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel349
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel406a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '394'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '349'
        paragraaf: '10'
        afdeling: '6'
  - number: 406b.1
    text: |-
      De erfgenamen van de in [artikel 394][ref1] bedoelde verwekker of van de man die in artikel 394 daarmee
      is gelijkgesteld, kunnen na zijn overlijden verplicht worden tot betaling van een som ineens ter zake van
      levensonderhoud en studie van het kind dat de leeftijd van 21 jaren nog niet heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel394
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel406b
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '394'
        afdeling: '1'
  - number: 406b.2
    text: |-
      De in het vorige lid bedoelde som is ten hoogste gelijk aan het wettelijk erfdeel waartoe het kind gerechtigd zou
      zijn geweest, indien de erflater zijn vader was.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel406b
  - number: 406b.3
    text: |-
      De aanspraken moeten door de wettelijke vertegenwoordiger van het kind of het kind zelf binnen een jaar na het
      overlijden van de erflater bij het gerecht in eerste aanleg geldend worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel406b
  - number: 406c.1
    text: 'Bij iedere beschikking, waarbij:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel406c
  - number: 406c.1.a
    text: |-
      ingevolge een der [artikelen 262][ref1], [263][ref2] of [326][ref3] de plaatsing van een minderjarige in een van de
      daarbedoelde inrichtingen of elders dan in een inrichting wordt bevolen,


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel262
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel263
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel326
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel406c
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '262'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '263'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0028743
        artikel: '326'
        paragraaf: '7'
        afdeling: '6'
  - number: 406c.1.b
    text: |-
      ingevolge [artikel 823, derde lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] of een der
      [artikelen 271][ref2], [272][ref3], [331][ref4] of [332][ref5] een minderjarige voorlopig aan de voogdijraad wordt
      toevertrouwd, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel823
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel271
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel272
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel331
      [ref5]: https://wetten.overheid.nl/BWBR0028743#Artikel332
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel406c
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '823'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '271'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0028743
        artikel: '272'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0028743
        artikel: '331'
        paragraaf: '8'
        afdeling: '6'
      - id: ref5
        bwb_id: BWBR0028743
        artikel: '332'
        paragraaf: '8'
        afdeling: '6'
  - number: 406c.1.c
    text: |-
      de gezinsvoogd machtiging wordt verleend om aanwijzing te geven tot een maatregel, als bedoeld in
      [artikel 260, derde lid][ref1], stelt de rechter tevens vast welk bedrag de ouders of – indien deze onvermogend
      dan wel overleden zijn -de minderjarige ter bestrijding van de kosten van bedoelde maatregelen aan de voogdijraad
      moeten betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel260
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel406c
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '260'
        afdeling: '4'
  - number: 406c.2
    text: De in het eerste lid bedoelde beslissing omtrent de kosten is uitvoerbaar bij voorraad.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel406c
  - number: '407.1'
    text: |-
      Wijziging van het bedrag van een periodieke uitkering tot voorziening in de kosten van verzorging en opvoeding kan
      zowel door de voogdijraad als door hem die het gezag over het kind uitoefent, worden verzocht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel407
  - number: '407.2'
    text: |-
      Gelijktijdig met een door de rechter in eerste aanleg te geven uitspraak betreffende het over de kinderen uit te
      oefenen gezag na ontbinding van het huwelijk na scheiding van tafel en bed kan de rechter op verzoek van een ouder
      het bedrag wijzigen van een, in verband met de voorafgegane gezagsvoorziening, bepaalde periodieke uitkering tot
      voorziening in de kosten van verzorging en opvoeding.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel407
  - number: '408'
    text: |-
      Een periodieke uitkering of som ineens tot voorziening in de kosten van verzorging en opvoeding waarvan het bedrag
      door de rechter is bepaald, moet ten behoeve van het kind aan de voogdijraad worden betaald.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel408
  - number: 408a.1
    text: |-
      De verwekker van een kind – zelfs al was het dood geboren – is verplicht om aan de moeder van het kind de
      kosten van haar bevalling en van haar onderhoud gedurende de eerste zes weken na de bevalling te vergoeden.
      [Artikel 394, derde en vierde lid][ref1], is daarbij van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel394
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel408a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '394'
        afdeling: '1'
  - number: 408a.2
    text: De vergoeding van de kosten wordt naar billijkheid en met inachtneming van het plaatselijk gebruik vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel408a
  - number: 408a.3
    text: Het vorderingsrecht vervalt na verloop van een jaar, te rekenen van de dag der bevalling.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel408a
  - number: 408b
    text: |-
      Hebben twee personen langdurig samengeleefd als waren zij gehuwd en is aan deze samenleving anders dan door de dood
      een einde gekomen, dan kan de rechter, indien dat redelijk is, aan een van hen op diens verzoek ten laste van de
      ander een uitkering tot levensonderhoud toekennen. Het bepaalde omtrent een uitkering tot levensonderhoud aan een
      gewezen echtgenoot is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel408b
  - number: '409.1'
    text: |-
      Indien iemand die zijn woonplaats heeft verlaten niet voldoende orde op het bestuur van zijn goederen heeft
      gesteld, en er noodzakelijkheid bestaat om daarin geheel of gedeeltelijk te voorzien of de afwezige te doen
      vertegenwoordigen, benoemt de rechter in eerste aanleg, op verzoek van belanghebbenden of op vordering van het
      Openbaar Ministerie, een bewindvoerder, ten einde het bewind over het geheel of een gedeelte van de goederen van de
      afwezige te voeren en diens overige belangen waar te nemen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel409
  - number: '409.2'
    text: |-
      Voor de toepassing van deze afdeling wordt met iemand die zijn woonplaats heeft verlaten, gelijk gesteld hij wiens
      bestaan onzeker is geworden of die onbereikbaar is, ook al staat niet vast dat hij zijn woonplaats heeft verlaten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel409
  - number: '410.1'
    text: |-
      Voor zover de rechter in eerste aanleg niet anders bepaalt, vinden op het bewind van de bewindvoerder de
      [artikelen 338][ref1], [339][ref2], [340][ref3], [342 tot en met 357][ref4], [358, eerste lid][ref5], en
      [359 tot en met 363][ref6] overeenkomstige toepassing, met dien verstande dat de bewindvoerder verplicht is
      jaarlijks ter griffie een rekening in te dienen van zijn bewind.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel338
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel339
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel340
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel342
      [ref5]: https://wetten.overheid.nl/BWBR0028743#Artikel358
      [ref6]: https://wetten.overheid.nl/BWBR0028743#Artikel359
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel410
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '338'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0028743
        artikel: '340'
        paragraaf: '10'
        afdeling: '6'
      - id: ref4
        bwb_id: BWBR0028743
        artikel: '342'
        paragraaf: '10'
        afdeling: '6'
      - id: ref5
        bwb_id: BWBR0028743
        artikel: '358'
        paragraaf: '10'
        afdeling: '6'
      - id: ref6
        bwb_id: BWBR0028743
        artikel: '359'
        paragraaf: '10'
        afdeling: '6'
  - number: '410.2'
    text: |-
      De bewindvoerder komt als beloning toe 5% van de netto-opbrengst der door hem beheerde goederen, tenzij de rechter
      daarvoor om bijzondere redenen een ander bedrag vaststelt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel410
  - number: '410.3'
    text: |-
      Goedkeuring van een ingediende rekening door de rechter brengt geen nadeel toe aan de bevoegdheid van de
      rechthebbenden om na het einde van het bewind over dezelfde tijdruimte rekening en verantwoording te vragen, voor
      zover dit niet onredelijk is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel410
  - number: '410.4'
    text: |-
      De bewindvoerder kan ook voor andere dan vermogensbelangen van de afwezige opkomen, behoudens voor zover de rechter
      zulks heeft uitgesloten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel410
  - number: '410.5'
    text: De rechter kan te allen tijde de bewindvoerder ontslaan en door een ander vervangen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel410
  - number: '411'
    text: 'Het bewind eindigt:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel411
  - number: 411.a
    text: door een gezamenlijk besluit van de rechthebbende en de bewindvoerder;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel411
  - number: 411.b
    text: door opzegging door de rechthebbende aan de bewindvoerder met inachtneming van een termijn van een maand;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel411
  - number: 411.c
    text: wanneer de dood van de rechthebbende komt vast te staan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel411
  - number: '412.1'
    text: |-
      Wanneer aan een persoon wiens bestaan onzeker is een erfdeel of een legaat opkomt, waartoe, indien hij niet in
      leven mocht zijn, anderen zouden gerechtigd zijn, verleent de rechter in eerste aanleg aan die anderen op hun
      verzoek machtiging tot de uitoefening van het recht van erfgenaam of legataris.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel412
  - number: '412.2'
    text: |-
      De rechter kan zo nodig openbare oproepingen bevelen en behoedmiddelen ten behoeve van de belanghebbenden
      voorschrijven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel412
  - number: '412.3'
    text: |-
      Indien na het verlenen van de machtiging mocht blijken dat de vermiste op de dag van het openvallen der
      nalatenschap heeft bestaan, kan de teruggave van de in bezit gekomen goederen en van de vruchten worden gevorderd,
      op de voet en onder de beperkingen als hierna bij de verklaring van vermoedelijk overlijden is aangegeven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel412
  - number: '412.4'
    text: |-
      Het eerste tot en met derde lid is van overeenkomstige toepassing op een uitkering uit levensverzekering, waartoe
      de persoon wiens bestaan onzeker is de eerstgeroepen begunstigde is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel412
  - number: '413.1'
    text: |-
      Is het bestaan van een persoon onzeker en is de in het tweede lid aangegeven tijdruimte verlopen, dan kunnen
      belanghebbenden de rechter in eerste aanleg verzoeken dat hij hun zal gelasten de vermiste op te roepen ten einde
      van zijn in leven zijn te doen blijken, en dat hij, zo hiervan niet blijkt, zal verklaren dat er rechtsvermoeden
      van overlijden van de vermiste bestaat.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel413
  - number: '413.2'
    text: |-
      De in het eerste lid bedoelde tijdruimte beloopt vijf jaren, te rekenen van het vertrek van de vermiste of de
      laatste tijding van zijn leven. De termijn wordt verkort tot een jaar, indien de betrokkene gedurende die periode
      wordt vermist en de omstandigheden zijn dood waarschijnlijk maken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel413
  - number: '413.3'
    text: |-
      Het gelasten van de oproeping van de vermiste en de verklaring van rechtsvermoeden van overlijden, bedoeld in het
      eerste lid, kunnen ook worden gevorderd door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel413
  - number: '414.1'
    text: |-
      De rechter in eerste aanleg stelt dag en uur vast waartegen de vermiste moet worden opgeroepen. De oproep loopt
      op een termijn van een maand of zoveel langer als de rechter mocht bevelen. De oproeping geschiedt overeenkomstig
      [Boek 1, titel 10, afdeling 3, van het Wetboek van Burgerlijke Rechtsvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Afdeling3
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0028496
        afdeling: '3'
  - number: '414.2'
    text: |-
      Indien de vermiste niet verschijnt, noch iemand voor hem opkomt die behoorlijk van het in leven zijn van de
      vermiste doet blijken, verklaart de rechter dat er rechtsvermoeden van overlijden bestaat, onverminderd zijn
      bevoegdheid de beschikking, bedoeld in het eerste lid, eerst nog eenmaal te herhalen alsmede het horen van
      getuigen en de overlegging van bewijsstukken te gelasten, ten bewijze dat is voldaan aan de vereisten die
      [artikel 413][ref1] stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel413
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '413'
        afdeling: '2'
  - number: '414.3'
    text: |-
      De beschikking, houdende verklaring dat er rechtsvermoeden van overlijden bestaat, noemt de dag waarop de vermiste
      wordt vermoed te zijn overleden; als zodanig geldt de dag, volgende op die van de laatste tijding van zijn leven,
      tenzij voldoende vermoedens bestaan dat hij daarna nog enige tijd in leven was.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel414
  - number: '414.4'
    text: |-
      De rechter kan tevens bepalen, dat de kosten die een verzoeker als bedoeld in [artikel 413, eerste lid][ref1],
      heeft gemaakt, ten laste van het vermogen van de vermiste worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel413
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '413'
        afdeling: '2'
  - number: '416'
    text: Geen hogere voorziening is toegelaten tegen beschikkingen, houdende bevel tot oproeping van de vermiste.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel416
  - number: '417.1'
    text: |-
      Zodra de beschikking, houdende verklaring dat er rechtsvermoeden van overlijden bestaat, in kracht van gewijsde
      is gegaan, zendt de griffier van het college waarvoor de zaak laatstelijk aanhangig was, een afschrift van de
      beschikking aan de ambtenaar van de burgerlijke stand van de verlaten woonplaats of, bij gebreke van verlaten
      woonplaats in de openbare lichamen Bonaire, Sint Eustatius en Saba, van de gemeente ’s-Gravenhage. Deze ambtenaar
      maakt van de beschikking een akte van inschrijving op, welke in overeenstemming is met de beschikking en dit
      uitdrukkelijk vermeldt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel417
  - number: '417.2'
    text: Deze akte bewijst ten aanzien van een ieder dwingend dat de vermiste op de in de akte vermelde dag is overleden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel417
  - number: '418.1'
    text: |-
      Erfgenamen en legatarissen van hem die vermoedelijk overleden is verklaard, zijn verplicht alvorens zij de goederen
      der nalatenschap in bezit nemen, ten genoegen van de rechter in eerste aanleg zekerheid te stellen voor hetgeen zij
      aan de vermoedelijk overleden verklaarde, mocht deze terugkeren, of aan erfgenamen of legatarissen die een beter
      recht mochten hebben, moeten afdragen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel418
  - number: '418.2'
    text: De erfgenamen zijn verplicht na de inbezitneming een behoorlijke boedelbeschrijving op te maken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel418
  - number: '418.3'
    text: |-
      Registergoederen mogen niet vervreemd of bezwaard worden, tenzij om gewichtige redenen en met verlof van de
      rechter in eerste aanleg. Kunnen zij bij een boedelscheiding niet zonder verkoop worden verdeeld, dan worden zij
      onder bewind van een derde gesteld, die de inkomsten van die goederen overeenkomstig hetgeen dienaangaande bij de
      verdeling is vastgesteld, zal uitkeren.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel418
  - number: '418.4'
    text: |-
      De verdeling geschiedt bij authentieke akte, waaruit tevens moet blijken wat aan legatarissen of andere
      gerechtigden is uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel418
  - number: '418.5'
    text: De goederen der nalatenschap mogen niet worden verkwist en daaruit mogen niet bovenmatige giften worden gedaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel418
  - number: '418.6'
    text: Erfgenamen en legatarissen zijn verplicht desgevraagd aan de rechter de nodige inlichtingen te geven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel418
  - number: '418.7'
    text: |-
      De in dit artikel genoemde verplichtingen vervallen op het door de rechter bepaalde tijdstip, en uiterlijk na
      verloop van vijf jaren na de dag waarop de akte overeenkomstig [artikel 417][ref1] is opgemaakt. De rechter
      die de beschikking, houdende verklaring dat er rechtsvermoeden van overlijden bestaat, geeft kan, gelet op de
      omstandigheden van het geval, daarbij tevens bepalen dat een of meer der in dit lid artikel genoemde verplichtingen
      niet zullen bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel417
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel418
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '417'
        afdeling: '2'
  - number: '419'
    text: |-
      De akte waarbij zekerheid is gesteld, de boedelbeschrijving en de akte van verdeling moeten in origineel of in
      authentiek afschrift worden neergelegd ter griffie van het gerecht in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel419
  - number: '420.1'
    text: |-
      Wanneer het aan de rechter in eerste aanleg blijkt dat een erfgenaam of legataris de hem in de
      [artikelen 418][ref1] en [419][ref2] opgelegde verplichtingen niet is nagekomen, kan hij voor de goederen die aan
      die erfgenaam of legataris uit de nalatenschap toekomen, een bewindvoerder benoemen, wiens bewind eindigt wanneer
      de rechter beslist dat de betrokkene alsnog zijn wettelijke verplichtingen heeft nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel418
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel419
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel420
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '418'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '419'
        afdeling: '2'
  - number: '420.2'
    text: |-
      Voor zover de rechter niet anders bepaalt, vinden op het bewind van de bewindvoerder de [artikelen 338][ref1],
      [339][ref2], [340][ref3], [342 tot en met 357][ref4], [358, eerste lid][ref5], en [359 tot en met 363][ref6]
      overeenkomstige toepassing, met dien verstande dat de bewindvoerder verplicht is jaarlijks ter griffie een rekening
      in te dienen van zijn bewind.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel338
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel339
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel340
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel342
      [ref5]: https://wetten.overheid.nl/BWBR0028743#Artikel358
      [ref6]: https://wetten.overheid.nl/BWBR0028743#Artikel359
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel420
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '338'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0028743
        artikel: '340'
        paragraaf: '10'
        afdeling: '6'
      - id: ref4
        bwb_id: BWBR0028743
        artikel: '342'
        paragraaf: '10'
        afdeling: '6'
      - id: ref5
        bwb_id: BWBR0028743
        artikel: '358'
        paragraaf: '10'
        afdeling: '6'
      - id: ref6
        bwb_id: BWBR0028743
        artikel: '359'
        paragraaf: '10'
        afdeling: '6'
  - number: '420.3'
    text: |-
      De bewindvoerder komt als beloning toe 5% van de netto-opbrengst der door hem beheerde goederen, tenzij de rechter
      daarvoor om bijzondere redenen een ander bedrag vaststelt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel420
  - number: '420.4'
    text: De rechter kan te allen tijde de bewindvoerder ontslaan en door een ander vervangen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel420
  - number: '421'
    text: |-
      Hetgeen in de [artikelen 418 tot en met 420][ref1] is bepaald omtrent erfgenamen die goederen uit de nalatenschap
      ontvangen, is van overeenkomstige toepassing op de echtgenoot die goederen ontvangt ten gevolge van de ontbinding
      van een huwelijksgemeenschap of de beëindiging van een deelgenootschap.Voor het uit dezen hoofde ontvangene behoeft
      echter geen zekerheid te worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel418
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel421
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '418'
        afdeling: '2'
  - number: '422.1'
    text: |-
      Wanneer de vermiste terugkeert, of wanneer blijkt dat de dag van overlijden in de akte van overlijden onjuist is
      vermeld, is ieder die enige goederen van de vermiste ingevolge de [artikelen 418 tot en met 421][ref1] in zijn
      bezit of onder zijn bewind heeft, aan de teruggekeerde of aan hen die alsdan blijken tot de goederen gerechtigd te
      zijn, rekening, verantwoording en afgifte schuldig.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel418
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel422
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '418'
        afdeling: '2'
  - number: '422.2'
    text: |-
      Rechten door derden te goeder trouw verkregen, worden geëerbiedigd. In geval echter goederen om niet zijn
      vervreemd, kan de rechter aan de rechthebbenden, en ten laste van hem die daardoor voordeel heeft genoten, een naar
      billijkheid te bepalen vergoeding toekennen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel422
  - number: '422.3'
    text: |-
      Is het leven van de vermiste ten behoeve van derden verzekerd geweest, dan behouden dezen hun recht op hetgeen aan
      hen op het tijdstip van de terugkeer van de verzekerde is uitbetaald of als reeds opeisbaar was verschuldigd; in
      dat geval kunnen aan de verzekering geen andere rechten op de uitkering worden ontleend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel422
  - number: '423.1'
    text: |-
      Indien binnen vijf jaar na de dag waarop de akte van overlijden overeenkomstig [artikel 417][ref1] is opgemaakt,
      wordt bewezen dat deze akte onjuist is, zijn zij die te goeder trouw de vruchten van de nalatenschap hebben
      genoten, slechts verplicht daarvan de helft terug te geven; wordt de onjuistheid later bewezen, dan behoeven zij
      geen vruchten terug te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel417
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel423
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '417'
        afdeling: '2'
  - number: '423.2'
    text: |-
      Indien eerst meer dan tien jaar na de dag waarop de akte is opgemaakt, wordt bewezen dat de akte onjuist is, zijn
      zij die de goederen te goeder trouw in bezit hebben genomen, slechts verplicht de alsdan nog aanwezige goederen
      in de staat waarin zij zich bevinden, af te geven, benevens de prijs van de vervreemde goederen of de goederen die
      daarvoor in de plaats zijn getreden; alles zonder enige vruchten of vergoeding voor niet meer aanwezige goederen en
      zonder verplichting van rekening en verantwoording.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel423
  - number: '423.3'
    text: Iedere verbintenis tot teruggave vervalt wanneer twintig jaar na de dag waarop de akte is opgemaakt, zijn verlopen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel423
  - number: '426.1'
    text: |-
      Indien het lichaam van een vermist persoon niet is kunnen worden teruggevonden doch, alle omstandigheden in
      aanmerking genomen, zijn overlijden als zeker kan worden beschouwd, kan op vordering van het Openbaar Ministerie of
      op verzoek van iedere belanghebbende de rechter in eerste aanleg verklaren dat de vermiste is overleden:
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel426
  - number: 426.1.a
    text: indien de vermissing heeft plaatsgevonden in het openbaar lichaam Bonaire, Sint Eustatius of Saba;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel426
  - number: 426.1.b
    text: |-
      indien de vermissing heeft plaatsgevonden tijdens een reis met een in het openbaar lichaam Bonaire, Sint Eustatius
      of Saba thuisbehorend schip of luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel426
  - number: 426.1.c
    text: |-
      indien de vermiste een in het openbaar lichaam Bonaire, Sint Eustatius of Saba woonplaats hebbende of gehad
      hebbende Nederlander was;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel426
  - number: 426.1.d
    text: indien de vermiste zijn woon- of verblijfplaats had in het openbaar lichaam Bonaire, Sint Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel426
  - number: '426.2'
    text: |-
      Indien een persoon buiten de openbare lichamen Bonaire, Sint Eustatius en Saba is overleden en geen overlijdensakte
      is opgemaakt of kan worden overgelegd, kan op vordering van het Openbaar Ministerie of op verzoek van iedere
      belanghebbende de rechter in eerste aanleg verklaren dat die persoon is overleden:
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel426
  - number: 426.2.a
    text: |-
      indien het overlijden heeft plaatsgevonden tijdens een reis met een in het openbaar lichaam Bonaire, Sint Eustatius
      of Saba thuisbehorend schip of luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel426
  - number: 426.2.b
    text: |-
      indien de overledene een in het openbaar lichaam Bonaire, Sint Eustatius of Saba woonplaats hebbende of gehad
      hebbende Nederlander was;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel426
  - number: 426.2.c
    text: indien de overledene zijn woon- of verblijfplaats had in het openbaar lichaam Bonaire, Sint Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel426
  - number: '426.3'
    text: |-
      Voor zover mogelijk bevatten de vordering of het verzoek, bedoeld in het eerste en tweede lid, of daarmee vergezeld
      gaande bescheiden de in [artikel 427][ref1] genoemde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel427
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel426
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '427'
        afdeling: '3'
  - number: '427.1'
    text: |-
      De beschikking, houdende verklaring dat de in [artikel 426][ref1] bedoelde persoon is overleden, noemt de dag en
      zo mogelijk het uur van het overlijden. Indien de dag van overlijden niet bekend is, wordt deze door de rechter
      in eerste aanleg vastgesteld en in de beschikking vermeld. De rechter houdt hierbij rekening met alle bewijzen en
      aanwijzingen omtrent de omstandigheden waaronder of het tijdstip waarop het overlijden moet hebben plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel426
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel427
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '426'
        afdeling: '3'
  - number: '427.2'
    text: |-
      Voorts vermeldt de beschikking de geslachtsnaam, de voornamen, de kunne en, zo mogelijk, de plaats van het
      overlijden, de woonplaats van de overledene, de plaats en de dag van geboorte van de overledene en de geslachtsnaam
      en de voornamen van de persoon of van de personen met wie de overledene gehuwd is geweest.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel427
  - number: '429'
    text: |-
      De griffier van het college waarvoor de zaak laatstelijk aanhangig was, zendt een afschrift van de beschikking,
      zodra deze in kracht van gewijsde is gegaan, aan de ambtenaar van de burgerlijke stand van de gemeente ‘s-
      Gravenhage. Deze maakt van de beschikking een akte van inschrijving op, die hij in het register van overlijden
      opneemt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel429
  - number: '430'
    text: |-
      De akten, opgemaakt volgens [artikel 429][ref1], gelden als akten van overlijden in de zin van
      [artikel 19f, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel429
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel19f
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel430
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '429'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: 19f
        afdeling: '4'
  - number: '431.1'
    text: |-
      Indien een meerderjarige als gevolg van zijn lichamelijke of geestelijke toestand tijdelijk of duurzaam niet in
      staat is ten volle zijn vermogensrechtelijke belangen zelf behoorlijk waar te nemen, kan de rechter in eerste
      aanleg een bewind instellen over één of meer van de goederen die hem als rechthebbende toebehoren of zullen
      toebehoren. Onder aan de meerderjarige toebehorende goederen zijn in deze titel begrepen goederen die behoren tot
      een huwelijksgemeenschap waarin hij gehuwd is, en die niet uitsluitend onder het bestuur van zijn echtgenoot staan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel431
  - number: '431.2'
    text: |-
      Indien te verwachten is dat een minderjarige op het tijdstip waarop hij meerderjarig zal worden, in de in het
      eerste lid bedoelde toestand zal verkeren, kan het bewind reeds voor de meerderjarigheid worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel431
  - number: '432.1'
    text: |-
      Instelling van het bewind kan worden verzocht door de rechthebbende, zijn echtgenoot of andere levensgezel, zijn
      bloedverwanten in de rechte lijn en die in de zijlijn tot de vierde graad ingesloten, zijn voogd, zijn curator of
      zijn mentor, bedoeld in [titel 20][ref1]; zij kan ook worden gevorderd door het Openbaar Ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel432
    references:
      - id: ref1
        bwb_id: BWBR0028743
  - number: '432.2'
    text: |-
      De rechter voor wie een verzoek of vordering tot ondercuratelestelling aanhangig is, kan bij afwijzing daarvan
      ambtshalve overgaan tot instelling van het bewind.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel432
  - number: '432.3'
    text: |-
      Een verzoek of vordering tot instelling van een bewind ten behoeve van een rechthebbende die onder curatele is
      gesteld, wordt aanhangig gemaakt bij de rechter die bevoegd is over opheffing van de curatele te beslissen. Deze
      rechter kan, bij opheffing van een curatele, ook ambtshalve overgaan tot instelling van het bewind.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel432
  - number: '432.4'
    text: |-
      In geval van een bestuursopdracht, of een verzoek daartoe, als bedoeld in [artikel 91][ref1], zijn het tweede en
      het derde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel91
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel432
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '91'
  - number: '433.1'
    text: |-
      Tenzij bij de onderbewindstelling anders is bepaald, omvat het bewind ook de goederen die geacht moeten worden in
      de plaats van een aan het bewind onderworpen goed te treden, benevens de vruchten en andere voordelen die een onder
      bewind staand goed oplevert.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel433
  - number: '433.2'
    text: |-
      De rechter in eerste aanleg kan, hetzij op verzoek van een persoon als bedoeld in [artikel 432, eerste lid][ref1],
      of van een bewindvoerder, hetzij op vordering van het Openbaar Ministerie, hetzij ambtshalve, het ingestelde bewind
      tot een of meer andere goederen van de rechthebbende uitbreiden of een of meer goederen uit het bewind ontslaan;
      hij kan tevens handelingen als bedoeld in [artikel 441, tweede lid, onderdeel f][ref2], aanwijzen en de aanwijzing
      van zulke handelingen intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel432
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel441
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel433
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '432'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '441'
  - number: '434.1'
    text: |-
      In beschikkingen als bedoeld in de [artikelen 432][ref1] en [433, tweede lid][ref2], bepaalt de rechter ambtshalve
      welke goederen onder bewind worden gesteld, onderscheidenlijk uit het bewind worden ontslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel432
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel433
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel434
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '432'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '433'
  - number: '434.2'
    text: |-
      Onderbewindstelling van een goed en het ontslag van een goed uit het bewind treden in werking daags nadat de
      beschikking is verstrekt of verzonden, tenzij de beschikking een later tijdstip van ingang vermeldt. In het geval,
      bedoeld in [artikel 431, tweede lid][ref1], treedt de onderbewindstelling in werking op het tijdstip waarop de
      rechthebbende meerderjarig wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel431
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel434
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '431'
  - number: '435.1'
    text: |-
      De rechter die het bewind instelt, benoemt daarbij of zo spoedig mogelijk daarna een bewindvoerder. In alle andere
      gevallen geschiedt de benoeming door de rechter in eerste aanleg. De rechter vergewist zich van de bereidheid van
      de door hem te benoemen persoon.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel435
  - number: '435.2'
    text: Zo nodig kan een tijdelijke bewindvoerder worden benoemd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel435
  - number: '435.3'
    text: |-
      De rechter volgt bij de benoeming van de bewindvoerder de uitdrukkelijke voorkeur van de rechthebbende, tenzij
      gegronde redenen zich tegen zodanige benoeming verzetten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel435
  - number: '435.4'
    text: |-
      Tenzij het derde lid is toegepast, wordt, indien de rechthebbende is gehuwd of een andere levensgezel heeft, bij
      voorkeur de echtgenoot of de andere levensgezel tot bewindvoerder benoemd. Is de vorige zin niet van toepassing,
      dan wordt bij voorkeur een van zijn ouders, kinderen, broers of zusters tot bewindvoerder benoemd. Huwt de
      rechthebbende of verkrijgt hij een andere levensgezel, dan kan ieder van hen verzoeken dat de echtgenoot of andere
      levensgezel van de rechthebbende in de plaats van de tegenwoordige bewindvoerder wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel435
  - number: '435.5'
    text: |-
      Handelingsonbekwamen, zij van wie één of meer goederen onder een bewind als bedoeld in deze titel zijn gesteld, en
      zij die in staat van faillissement verkeren, kunnen niet bewindvoerder worden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel435
  - number: '435.6'
    text: Rechtspersonen met volledige rechtsbevoegdheid kunnen tot bewindvoerder worden benoemd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel435
  - number: '435.7'
    text: |-
      De benoemde wordt bewindvoerder daags nadat de beschikking is verstrekt of verzonden, tenzij de beschikking een
      later tijdstip vermeldt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel435
  - number: '436.1'
    text: |-
      De bewindvoerder is verplicht zo spoedig mogelijk een beschrijving van de aan het bewind onderworpen
      goederen op te maken en een afschrift daarvan in te leveren ter griffie van het ingevolge
      [artikel 429c, vijfde lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] bevoegde gerecht in eerste
      aanleg.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel429c
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel436
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: 429c
  - number: '436.2'
    text: |-
      De [artikelen 339][ref1], [363][ref2] en [364][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel339
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel363
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel364
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel436
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '363'
        paragraaf: '10'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0028743
        artikel: '364'
        paragraaf: '10'
        afdeling: '6'
  - number: '436.3'
    text: |-
      Indien tot het bewind registergoederen behoren, is de bewindvoerder verplicht zo spoedig mogelijk
      de desbetreffende rechterlijke beschikkingen en zijn benoeming in de openbare registers, bedoeld in
      [titel 1, afdeling 2, van Boek 3][ref1], te doen inschrijven. Is een onderneming of een aandeel in een vennootschap
      onder firma onder bewind gesteld, dan is de bewindvoerder verplicht de desbetreffende rechterlijke beschikkingen en
      zijn benoeming in het handelsregister te doen inschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Afdeling2
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel436
    references:
      - id: ref1
        bwb_id: BWBR0028745
        afdeling: '2'
  - number: '436.4'
    text: |-
      Tenzij de rechter anders bepaalt, is de bewindvoerder verplicht zo spoedig mogelijk een rekening te openen bij een
      ingevolge de [Wet toezicht bank- en kredietwezen 1994 BES][ref1] geregistreerde kredietinstelling; de bewindvoerder
      is voorts verplicht om uitsluitend voor de betalingen die hij bij de vervulling van zijn taak verricht of ontvangt,
      zoveel mogelijk van deze rekening gebruik te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0028547
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel436
    references:
      - id: ref1
        bwb_id: BWBR0028547
  - number: '436.5'
    text: |-
      De rechter kan te allen tijde de bewindvoerder ten verhore doen oproepen. Deze is verplicht alle door de rechter
      gewenste inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel436
  - number: '437.1'
    text: De rechter kan twee of meer bewindvoerders benoemen, indien hij dit in het belang van een goed bewind nodig acht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel437
  - number: '437.2'
    text: |-
      Zijn er twee of meer bewindvoerders, dan kan, tenzij de rechter anders bepaalt, ieder van hen alle werkzaamheden
      die tot het bewind behoren, alleen verrichten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel437
  - number: '437.3'
    text: |-
      Bij verschil van mening tussen de bewindvoerders beslist op verzoek van een van hen de rechter. Deze kan ook een
      verdeling van het loon vaststellen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel437
  - number: '438.1'
    text: |-
      Tijdens het bewind komt het beheer over de onder bewind staande goederen niet toe aan de rechthebbende, maar aan
      de bewindvoerder.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel438
  - number: '438.2'
    text: |-
      Tijdens het bewind kan de rechthebbende slechts met medewerking van de bewindvoerder of, indien deze weigerachtig
      is, met machtiging van de rechter in eerste aanleg over de onder het bewind staande goederen beschikken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel438
  - number: '439.1'
    text: |-
      Indien een rechtshandeling ongeldig is omdat zij ondanks het bewind werd verricht door of gericht tot de
      rechthebbende, kan deze ongeldigheid aan de wederpartij slechts worden tegengeworpen zo deze het bewind kende of
      had behoren te kennen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel439
  - number: '439.2'
    text: |-
      Indien een goed is vervreemd of bezwaard door iemand die daartoe ingevolge het bewind niet bevoegd was, kan deze
      onbevoegdheid aan een verkrijger van het goed of een beperkt recht daarop slechts worden tegengeworpen, zo deze het
      bewind kende of had behoren te kennen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel439
  - number: '440.1'
    text: |-
      Gedurende het bewind kunnen schulden die voortspruiten uit een handeling, tijdens het bewind met of jegens de
      rechthebbende, anders dan in overeenstemming met [artikel 438, tweede lid][ref1], verricht door een schuldeiser die
      het bewind kende of had behoren te kennen, niet op de onder het bewind staande goederen worden verhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel438
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel440
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '438'
  - number: '440.2'
    text: |-
      Indien de onderbewindstelling alle goederen betreft die daarvoor krachtens [artikel 431, eerste lid][ref1], in
      aanmerking komen, is het eerste lid van overeenkomstige toepassing ten aanzien van niet onder het bewind staande
      goederen waarop verhaal mogelijk zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel431
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel440
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '431'
  - number: '441.1'
    text: |-
      Tijdens het bewind vertegenwoordigt de bewindvoerder bij de vervulling van zijn taak de rechthebbende in en
      buiten rechte. De bewindvoerder draagt zorg voor een doelmatige belegging van het vermogen van de rechthebbende,
      voor zover dit onder het bewind staat en niet besteed behoort te worden voor een voldoende verzorging van de
      rechthebbende.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel441
  - number: '441.2'
    text: |-
      Hij behoeft echter toestemming van de rechthebbende of, indien deze daartoe niet in staat of weigerachtig is,
      machtiging van de rechter in eerste aanleg voor de volgende handelingen:
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel441
  - number: 441.2.a
    text: |-
      beschikken en aangaan van overeenkomsten tot beschikking over een onder het bewind staand goed, tenzij de handeling
      als een gewone beheersdaad kan worden beschouwd of krachtens rechterlijk bevel geschiedt;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel441
  - number: 441.2.b
    text: een making of gift waaraan lasten of voorwaarden zijn verbonden, aannemen;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel441
  - number: 441.2.c
    text: geld lenen of de rechthebbende als borg of hoofdelijke medeschuldenaar verbinden;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel441
  - number: 441.2.d
    text: |-
      overeenkomen dat een boedel waartoe de rechthebbende gerechtigd is, voor een bepaalde tijd onverdeeld wordt
      gelaten;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel441
  - number: 441.2.e
    text: |-
      het aangaan, buiten het geval van [artikel 20 van het Wetboek van Burgerlijke Rechtsvordering BES][ref1], van een
      overeenkomst tot het beëindigen van een geschil, tenzij het voorwerp van het geschil een waarde van USD 840,– niet
      te boven gaat;


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel20
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel441
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '20'
  - number: 441.2.f
    text: andere bij de instelling van het bewind of nadien aangewezen handelingen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel441
  - number: '441.3'
    text: |-
      De rechter in eerste aanleg kan ook aan de bewindvoerder een doorlopende machtiging met zodanige voorwaarden als
      hij geraden acht, verlenen om handelingen als in het tweede lid bedoeld, te verrichten, en een verleende machtiging
      te allen tijde wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel441
  - number: '441.4'
    text: |-
      De bewindvoerder is, met uitsluiting van de rechthebbende, bevoegd de verdeling te vorderen van goederen waarvan
      een onverdeeld aandeel tot zijn bewind behoort. Tot een verdeling, ook al geschiedt zij krachtens rechterlijk
      bevel, behoeft de bewindvoerder toestemming of machtiging overeenkomstig het tweede lid. De rechter in eerste
      aanleg kan, in stede van machtiging te verlenen, met overeenkomstige toepassing van [artikel 181 van Boek 3][ref1]
      een onzijdig persoon benoemen, die in plaats van de bewindvoerder de rechthebbende bij de verdeling
      vertegenwoordigt.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel181
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel441
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '181'
  - number: '441.5'
    text: |-
      De bewindvoerder is, met uitsluiting van de rechthebbende, bevoegd een aan de rechthebbende opgekomen erfenis te
      aanvaarden. Tenzij de aanvaarding geschiedt met toestemming van de rechthebbende, kan de bewindvoerder niet anders
      aanvaarden dan onder het voorrecht van boedelbeschrijving.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel441
  - number: '441.6'
    text: |-
      Bij algemene maatregel van bestuur kan het bedrag genoemd in het tweede lid, onderdeel e, worden aangepast aan
      de geldontwaarding.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel441
  - number: '442.1'
    text: |-
      Heeft iemand als bewindvoerder een rechtshandeling verricht, dan richten de rechten en verplichtingen van de
      wederpartij zich naar hetgeen dienaangaande is bepaald [Boek 3, titel 3][ref1]. Regels die de bevoegdheid van een
      bewindvoerder betreffen en feiten die voor een oordeel omtrent zijn bevoegdheid van belang zijn, kunnen niet aan de
      wederpartij worden tegengeworpen, indien deze daarmee niet bekend was of had behoren te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028745
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel442
    references:
      - id: ref1
        bwb_id: BWBR0028745
  - number: '442.2'
    text: |-
      De rechthebbende is, onverminderd [artikel 172 van Boek 6][ref1], aansprakelijk voor alle schulden die
      voortspruiten uit rechtshandelingen die de bewindvoerder in zijn hoedanigheid in naam van de rechthebbende
      verricht. Wanneer hij onder bewind staande goederen aanwijst die voor de schuld voldoende verhaal bieden, is hij
      niet verplicht de schuld ten laste van zijn overige vermogen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel172
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel442
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '172'
  - number: '443'
    text: |-
      De bewindvoerder kan alvorens in rechte op te treden, zich te zijner verantwoording doen machtigen door de
      rechthebbende of, indien deze daartoe niet in staat of weigerachtig is, door de rechter in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel443
  - number: '444'
    text: |-
      Een bewindvoerder is jegens de rechthebbende aansprakelijk, indien hij in de zorg van een goed bewindvoerder te
      kort schiet, tenzij de tekortkoming hem niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel444
  - number: '445.1'
    text: |-
      De bewindvoerder legt, tenzij andere tijdstippen zijn bepaald, jaarlijks en aan het einde van het bewind rekening
      en verantwoording af aan de rechthebbende, alsmede aan het einde van zijn taak aan zijn opvolger. De rekening en
      verantwoording wordt afgelegd ten overstaan van de rechter in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel445
  - number: '445.2'
    text: |-
      Indien de rechthebbende niet in staat is de rekening op te nemen, of het onzeker is wie de rechthebbende is, wordt
      de rekening en verantwoording afgelegd aan de rechter. Goedkeuring van deze rekening en verantwoording door de
      rechter belet niet dat de rechthebbende na het einde van het bewind nogmaals over dezelfde tijdsruimte rekening en
      verantwoording vraagt, voor zover dit niet onredelijk is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel445
  - number: '445.3'
    text: |-
      De rechter kan de bewindvoerder, hetzij op diens verzoek, hetzij ambtshalve, vrijstellen van de verplichting om
      de periodieke rekening en verantwoording te zijnen overstaan af te leggen; hij kan ook bepalen dat deze wijze van
      aflegging der rekening en verantwoording slechts over een door hem te bepalen aantal jaren zal geschieden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel445
  - number: '445.4'
    text: |-
      Voor het overige vindt het aangaande de voogdijrekening in [titel 14, afdeling 6, paragrafen 10][ref1] en
      [11][ref2], bepaalde overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Afdeling6
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Afdeling6
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel445
    references:
      - id: ref1
        bwb_id: BWBR0028743
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028743
        paragraaf: '11'
        afdeling: '6'
  - number: '446.1'
    text: |-
      Voor zover de rechter in eerste aanleg niet anders bepaalt, wordt bij het afleggen van de periodieke rekening
      en verantwoording hetgeen de goederen netto aan vruchten hebben opgebracht, onder aftrek van de verschuldigde
      beloning, aan de rechthebbende uitgekeerd. Op verzoek van de rechthebbende kan de rechter andere tijdstippen voor
      de uitkering vaststellen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel446
  - number: '446.2'
    text: |-
      Bij zijn eindrekening en verantwoording draagt de bewindvoerder alle goederen af aan hem die na hem tot het beheer
      der goederen bevoegd is. De bewindvoerder is bevoegd de afdracht op te schorten tot de voldoening van een hem
      toekomend saldo.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel446
  - number: '446.3'
    text: |-
      Wordt de rekening en verantwoording aan de rechter afgelegd, dan blijven, tenzij de rechter anders bepaalt, de
      netto-opbrengst of de af te dragen goederen onder het bewind van de bewindvoerder, totdat de rechthebbende tot de
      ontvangst in staat is of de onzekerheid wie rechthebbende is, is opgeheven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel446
  - number: '447.1'
    text: |-
      Tenzij de beloning bij de instelling van het bewind anders is geregeld, komt de bewindvoerder of, wanneer er
      meer bewindvoerders zijn, hun te zamen 5% der netto-opbrengst van de onder bewind staande goederen toe. Op
      grond van bijzondere omstandigheden kan de rechter in eerste aanleg, hetzij ambtshalve, hetzij op verzoek van
      de bewindvoerder of van de rechthebbende, voor bepaalde of onbepaalde tijd de beloning anders regelen dan bij de
      instelling of door de wet is aangegeven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel447
  - number: '447.2'
    text: |-
      Zijn er twee of meer bewindvoerders, dan wordt het loon dat hun gezamenlijk toekomt, tussen hen verdeeld in
      evenredigheid met de betekenis van de door ieder van hen verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel447
  - number: '448.1'
    text: 'De taak van de bewindvoerder eindigt:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel448
  - number: 448.1.a
    text: bij het einde van het bewind;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel448
  - number: 448.1.b
    text: door tijdsverloop, indien hij voor een bepaalde tijd was benoemd;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel448
  - number: 448.1.c
    text: door zijn dood, faillietverklaring of ondercuratelestelling;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel448
  - number: 448.1.d
    text: door de instelling van een bewind als bedoeld in deze titel over één of meer van zijn goederen;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel448
  - number: 448.1.e
    text: door ontslag, dat hem door de rechter in eerste aanleg met ingang van een door deze bepaalde dag wordt verleend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel448
  - number: '448.2'
    text: |-
      Het ontslag wordt hem verleend hetzij op eigen verzoek, hetzij wegens gewichtige redenen of omdat hij niet
      meer voldoet aan de eisen om bewindvoerder te kunnen worden, zulks op verzoek van een medebewindvoerder of de
      rechthebbende, op vordering van het Openbaar Ministerie of ambtshalve. Hangende het onderzoek kan de rechter in
      eerste aanleg voorlopige voorzieningen in het bewind treffen en de bewindvoerder schorsen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel448
  - number: '448.3'
    text: |-
      Een gewezen bewindvoerder blijft verplicht al datgene te doen wat niet zonder nadeel voor de rechthebbende kan
      worden uitgesteld, totdat degene die na hem tot het beheer van de goederen bevoegd is, dit heeft aanvaard. In de
      gevallen, genoemd in het eerste lid, onderdeel c, rust deze verplichting op zijn erfgenamen, onderscheidenlijk de
      curator, indien zij van het bewind kennis dragen; in het geval, genoemd in het eerste lid, onderdeel d, geldt dit
      voor de bewindvoerder, belast met het daar bedoelde bewind.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel448
  - number: '448.4'
    text: |-
      [Artikel 384][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel384
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel448
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '384'
  - number: '449.1'
    text: |-
      Het bewind eindigt door het verstrijken van de tijdsduur waarvoor het is ingesteld, en door de dood of
      ondercuratelestelling van de rechthebbende.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel449
  - number: '449.2'
    text: |-
      De rechter in eerste aanleg kan, indien de oorzaken die tot de onderbewindstelling aanleiding hebben gegeven, niet
      meer bestaan, het bewind opheffen op verzoek van de rechthebbende of op vordering van het Openbaar Ministerie; de
      beschikking treedt in werking zodra zij in kracht van gewijsde is gegaan, tenzij zij een eerder tijdstip van ingang
      aanwijst.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel449
  - number: '450.1'
    text: |-
      Indien een meerderjarige als gevolg van zijn geestelijke of lichamelijke toestand tijdelijk of duurzaam niet in
      staat is of bemoeilijkt wordt zijn belangen van niet-vermogensrechtelijke aard zelf behoorlijk waar te nemen, kan
      de rechter in eerste aanleg te zijnen behoeve een mentorschap instellen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel450
  - number: '450.2'
    text: |-
      Indien te verwachten is dat een minderjarige op het tijdstip waarop hij meerderjarig zal worden, in de in het
      eerste lid bedoelde toestand zal verkeren, kan het mentorschap reeds voor de meerderjarigheid worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel450
  - number: '450.3'
    text: |-
      Het mentorschap kan eveneens worden ingesteld, indien te verwachten is dat een meerderjarige binnen afzienbare tijd
      in de in het eerste lid bedoelde toestand zal verkeren.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel450
  - number: '451.1'
    text: |-
      Het mentorschap kan worden verzocht door de betrokken persoon, zijn echtgenoot of andere levensgezel, zijn
      bloedverwanten in de rechte lijn en die in de zijlijn tot en met de vierde graad, zijn voogd, zijn curator of
      zijn bewindvoerder, bedoeld in [titel 19][ref1]. In het in [artikel 450, derde lid][ref2], bedoelde geval kan het
      mentorschap uitsluitend worden verzocht door de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel450
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel451
    references:
      - id: ref1
        bwb_id: BWBR0028743
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '450'
  - number: '451.2'
    text: |-
      Het mentorschap kan, behoudens in het in [artikel 450, derde lid][ref1], bedoelde geval, voorts worden gevorderd
      door het Openbaar Ministerie of worden verzocht door degene die de instelling waar de betrokkene duurzaam wordt
      verzorgd, exploiteert of die daarvan de leiding heeft. In het laatste geval wordt in het verzoekschrift tevens
      vermeld waarom de in het eerste lid genoemde personen – bloedverwanten in de zijlijn in de derde en vierde graad
      daaronder niet begrepen – niet tot indiening van een verzoek zijn overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel450
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel451
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '450'
  - number: '451.3'
    text: |-
      De rechter bij wie een verzoek of vordering tot ondercuratelestelling aanhangig is, kan bij afwijzing daarvan
      ambtshalve overgaan tot instelling van het mentorschap.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel451
  - number: '451.4'
    text: |-
      Een verzoek of vordering tot omzetting van curatele in mentorschap ten behoeve van een persoon die onder curatele
      is gesteld, wordt aanhangig gemaakt bij de rechter die bevoegd is over opheffing van de curatele te beslissen. Deze
      rechter kan, bij opheffing van de curatele, ook ambtshalve overgaan tot instelling van het mentorschap.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel451
  - number: '451.5'
    text: |-
      Het mentorschap treedt in werking daags nadat de griffier de beschikking heeft verstrekt of verzonden, tenzij
      de beschikking een later tijdstip van ingang vermeldt. In het geval, bedoeld in [artikel 450, tweede lid][ref1],
      treedt het mentorschap in werking op het tijdstip waarop de betrokken persoon meerderjarig wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel450
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel451
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '450'
  - number: '452'
    text: |-
      1 De rechter die het mentorschap instelt, benoemt daarbij of zo spoedig mogelijk daarna een mentor. In geval van
      vervanging van de mentor geschiedt de benoeming door de rechter in eerste aanleg. De rechter vergewist zich van de
      bereidheid en vormt zich een oordeel over de geschiktheid van de te benoemen persoon.

      2 Zo nodig kan een tijdelijke mentor worden benoemd.

      3 De rechter volgt bij de benoeming van de mentor de uitdrukkelijke voorkeur van de betrokkene, tenzij gegronde
      redenen zich tegen zodanige benoeming verzetten.

      4 Tenzij het derde lid is toegepast, wordt, indien de betrokkene is gehuwd of een andere levensgezel heeft, bij
      voorkeur de echtgenoot of de andere levensgezel tot mentor benoemd. Is de vorige zin niet van toepassing, dan
      wordt bij voorkeur een van zijn ouders, kinderen, broers of zusters tot mentor benoemd. Huwt de betrokkene of
      verkrijgt hij een andere levensgezel, dan kan ieder van hen verzoeken dat de echtgenoot of andere levensgezel van
      de betrokkene in de plaats van de tegenwoordige mentor wordt benoemd.

      5 Indien ten behoeve van de betrokkene in een bewind als bedoeld in [titel 19][ref1], is voorzien, wordt, indien de
      bewindvoerder een natuurlijke persoon is, bij voorkeur de bewindvoerder tot mentor benoemd.

      6 Geen mentor kunnen worden: a. handelingsonbekwamen; b. zij ten behoeve van wie een mentorschap is ingesteld; c.
      rechtspersonen; d. de direct betrokken of behandelend hulpverlener; e. personen behorende tot de leiding of tot het
      personeel van de instelling waar de betrokkene verblijft.

      7 De taak van de mentor vangt aan daags nadat de benoeming is verstrekt of verzonden, tenzij de beschikking een
      later tijdstip vermeldt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel452
    references:
      - id: ref1
        bwb_id: BWBR0028743
  - number: '453.1'
    text: |-
      Tenzij uit wet of verdrag anders voortvloeit, is de betrokkene tijdens het mentorschap onbevoegd rechtshandelingen
      te verrichten in aangelegenheden betreffende zijn verzorging, verpleging, behandeling en begeleiding.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel453
  - number: '453.2'
    text: |-
      Met betrekking tot de in het eerste lid bedoelde rechtshandelingen vertegenwoordigt de mentor de betrokkene in en
      buiten rechte, tenzij op grond van wet of verdrag vertegenwoordiging uitgesloten is. De mentor kan de betrokkene
      toestemming verlenen deze rechtshandelingen zelf te verrichten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel453
  - number: '453.3'
    text: |-
      Ten aanzien van andere handelingen dan rechtshandelingen betreffende de in het eerste lid genoemde aangelegenheden
      treedt de mentor, voor zover de aard van de desbetreffende handeling dit toelaat, in plaats van de betrokkene op.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel453
  - number: '453.4'
    text: |-
      De mentor geeft aan de betrokkene raad in hem betreffende aangelegenheden van niet-vermogensrechtelijke aard en
      waakt over diens belangen ter zake.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel453
  - number: '453.5'
    text: |-
      Verzet de betrokkene zich tegen een handeling van ingrijpende aard in aangelegenheden als in het tweede en derde
      lid bedoeld, dan kan die handeling slechts plaatsvinden indien zij kennelijk nodig is ten einde ernstig nadeel voor
      de betrokkene te voorkomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel453
  - number: 453a.1
    text: |-
      Indien de rechter dit noodzakelijk acht, beslist hij tevens dat [artikel 246][ref1] van overeenkomstige toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel246
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel453a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '246'
        afdeling: '1'
  - number: 453a.2
    text: |-
      Tijdens het mentorschap kan de rechter een beslissing nemen als in het eerste lid bedoeld, hetzij op verzoek van
      een persoon als bedoeld in [artikel 451, eerste en tweede lid][ref1], of van de mentor, hetzij op vordering van het
      Openbaar Ministerie, hetzij ambtshalve.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel451
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel453a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '451'
  - number: '454.1'
    text: |-
      De mentor is gehouden degene ten behoeve van wie het mentorschap is ingesteld zo veel mogelijk bij de vervulling
      van zijn taak te betrekken. De mentor bevordert dat de betrokkene rechtshandelingen en andere handelingen zelf
      verricht, indien deze tot een redelijke waardering van zijn belangen ter zake in staat kan worden geacht. Hij
      betracht de zorg van een goed mentor.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel454
  - number: '454.2'
    text: |-
      De mentor is jegens de betrokkene aansprakelijk, indien hij in de zorg van een goed mentor te kort schiet, tenzij
      de tekortkoming hem niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel454
  - number: '455'
    text: |-
      Degene ten behoeve van wie het mentorschap is ingesteld, is, onverminderd [artikel 172 van Boek 6][ref1],
      aansprakelijk voor alle schulden die voortspruiten uit rechtshandelingen die de mentor in zijn hoedanigheid in naam
      van de betrokkene verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel172
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel455
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '172'
  - number: '456'
    text: |-
      De mentor kan alvorens in rechte op te treden, zich te zijner verantwoording doen machtigen door de betrokkene of,
      indien deze daartoe niet in staat of weigerachtig is, door de rechter in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel456
  - number: '457.1'
    text: |-
      Een rechtshandeling verricht in strijd met [artikel 453][ref1], is overeenkomstig het tweede en derde lid
      vernietigbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel453
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel457
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '453'
  - number: '457.2'
    text: |-
      Indien de rechtshandeling is verricht door of gericht tot de betrokkene, kan een beroep op de vernietigbaarheid
      slechts worden gedaan jegens een persoon die het mentorschap kende of had behoren te kennen; jegens een zodanige
      persoon wordt de betrokkene vermoed onbevoegd te zijn geweest.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel457
  - number: '457.3'
    text: |-
      Indien de rechtshandeling is verricht door of gericht tot de mentor, kan een beroep op de vernietigbaarheid slechts
      worden gedaan jegens een persoon die de onbevoegdheid van de mentor kende of had behoren te kennen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel457
  - number: '458'
    text: |-
      Voor zover een of meer van de goederen van de betrokkene onder een bewind als bedoeld in [titel 19][ref1], staan,
      is de bewindvoerder, indien hij niet tevens mentor is, niet tot optreden bevoegd ten aanzien van aangelegenheden
      als in [artikel 453, eerste lid][ref2], bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel453
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel458
    references:
      - id: ref1
        bwb_id: BWBR0028743
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '453'
  - number: '459.1'
    text: |-
      De mentor doet desgevraagd van zijn werkzaamheden verslag aan de rechter in eerste aanleg. De rechter kan te allen
      tijde verschijning van de mentor in persoon gelasten. Deze is verplicht alle door de rechter gewenste inlichtingen
      te verstrekken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel459
  - number: '459.2'
    text: |-
      Aan het einde van zijn mentorschap doet de mentor van zijn werkzaamheden schriftelijk verslag aan zijn opvolger,
      aan de rechter in eerste aanleg, alsmede aan de betrokkene indien het mentorschap door het verstrijken van de
      tijdsduur waarvoor het is ingesteld of door opheffing eindigt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel459
  - number: '460.1'
    text: |-
      De mentor mag de bij de vervulling van zijn taak noodzakelijk gemaakte kosten aan de betrokkene in rekening
      brengen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel460
  - number: '460.2'
    text: |-
      De rechter kan aan de mentor ten laste van de betrokkene een beloning toekennen indien hij zulks redelijk acht, de
      financiële draagkracht van betrokkene in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel460
  - number: '461.1'
    text: 'De taak van de mentor eindigt:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel461
  - number: 461.1.a
    text: bij het einde van het mentorschap;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel461
  - number: 461.1.b
    text: door tijdsverloop, indien hij voor een bepaalde tijd was benoemd;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel461
  - number: 461.1.c
    text: door zijn dood;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel461
  - number: 461.1.d
    text: door zijn ondercuratelestelling of door instelling van een mentorschap te zijnen behoeve;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel461
  - number: 461.1.e
    text: door ontslag, dat hem door de rechter in eerste aanleg met ingang van een door deze bepaalde dag wordt verleend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel461
  - number: '461.2'
    text: |-
      Het ontslag wordt hem verleend hetzij op eigen verzoek, hetzij wegens gewichtige redenen of omdat hij niet meer
      voldoet aan de eisen om mentor te kunnen worden, zulks op verzoek van de betrokkene, op vordering van het Openbaar
      Ministerie of ambtshalve. Hangende het onderzoek kan de rechter in eerste aanleg voorlopige voorzieningen in het
      mentorschap treffen en de mentor schorsen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel461
  - number: '461.3'
    text: |-
      Een gewezen mentor blijft verplicht al datgene te doen wat niet zonder nadeel voor de betrokkene kan
      worden uitgesteld, totdat wederom een persoon bevoegd is ten aanzien van de aangelegenheden, bedoeld in
      [artikel 453, eerste lid][ref1]. In de gevallen, genoemd in het eerste lid, onderdeel d, rust deze verplichting op
      diens curator of mentor, indien deze van het mentorschap kennis draagt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel453
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel461
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '453'
  - number: '461.4'
    text: |-
      [Artikel 384][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel384
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel461
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '384'
  - number: '462.1'
    text: |-
      Het mentorschap eindigt door het verstrijken van de tijdsduur waarvoor het is ingesteld, en door de dood of
      ondercuratelestelling van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel462
  - number: '462.2'
    text: |-
      De rechter in eerste aanleg kan, indien de noodzaak daartoe niet meer bestaat, het mentorschap opheffen op verzoek
      van de betrokkene of zijn mentor, dan wel op vordering van het Openbaar Ministerie. De beschikking treedt in
      werking zodra zij in kracht van gewijsde is gegaan, tenzij zij een eerder tijdstip van ingang aanwijst.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel462
