  - number: 17a.1
    text: |-
      De registers van de burgerlijke stand worden in het daartoe door het bestuurscollege bestemde gebouw bewaard totdat
      zij naar een archiefbewaarplaats voor de bewaring van archiefbescheiden van openbare lichamen in de zin van de
      [Archiefwet BES][ref1] worden overgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028369
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0028369
  - number: 17a.2
    text: |-
      De overbrenging naar de archiefbewaarplaats van de in het daartoe bestemde gebouw berustende registers van
      geboorten, van huwelijken en van overlijden kan eerst plaats vinden onderscheidenlijk ten minste honderd jaar, ten
      minste vijfenzeventig jaar en ten minste vijftig jaar na de afsluiting van deze registers.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel17a
  - number: 17b
    text: |-
      De beheerder van een archiefbewaarplaats als bedoeld in [artikel 17a][ref1], is belast met het bewaren van de onder
      hem berustende registers, met het toevoegen van latere vermeldingen aan de daarin opgenomen akten en met de afgifte
      van afschriften en uittreksels van deze akten.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel17a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 17a
        afdeling: '2'
  - number: 17c
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld alles wat verder betreft de inrichting van de registers, alsmede
      de in [artikel 17b][ref1] genoemde handelingen ten aanzien van die registers.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel17b
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 17b
        afdeling: '2'
  - number: '18.1'
    text: |-
      De ambtenaar van de burgerlijke stand mag in de akten alleen opnemen hetgeen ingevolge het bij of krachtens de wet
      bepaalde moet worden verklaard of opgenomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel18
  - number: '18.2'
    text: |-
      De ambtenaar van de burgerlijke stand is bevoegd alvorens tot het opmaken van een akte over te gaan zich de
      wettelijk vereiste bescheiden te doen vertonen. Hij doet zich ook andere bescheiden vertonen, welke hij voor het
      opmaken van de akte of voor de vaststelling van de in de akte op te nemen gegevens noodzakelijk acht. Hij kan zich
      te dien einde, zonder hiervoor enige vergoeding verschuldigd te zijn, inlichtingen verschaffen uit de registers van
      de burgerlijke stand en uit andere openbare registers.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel18
  - number: 18.3.1
    text: Bij algemene maatregel van bestuur wordt geregeld al hetgeen het opmaken van de akten betreft.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel18
  - number: 18a.1
    text: |-
      Partijen bij een akte van de burgerlijke stand zijn degenen die aan de ambtenaar van de burgerlijke stand een
      aangifte doen of te zijnen overstaan een verklaring afleggen betreffende een feit, waarvan de akte bestemd is te
      doen blijken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel18a
  - number: 18a.2
    text: |-
      Belanghebbende partijen zijn partijen die met hun verklaring enig rechtsgevolg teweeg brengen voor henzelf of voor
      medepartijen, dan wel voor henzelf en medepartijen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel18a
  - number: 18a.3
    text: De belanghebbende partijen kunnen zich door een daartoe bij authentieke akte gevolmachtigde doen vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel18a
  - number: 18a.4
    text: |-
      Wanneer een gevolmachtigde een verklaring aflegt, geldt hij zowel als de door hem vertegenwoordigde persoon als
      partij bij de akte.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel18a
  - number: 18a.5
    text: |-
      De ambtenaar van de burgerlijke stand mag geen akte verlijden waarin hijzelf als partij of belanghebbende partij
      voorkomt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel18a
  - number: 18b.1
    text: |-
      Blijft een partij bij een akte van de burgerlijke stand of een belanghebbende partij in gebreke de in
      [artikel 18, tweede lid][ref1], bedoelde bescheiden over te leggen, of acht de ambtenaar van de burgerlijke stand
      de overgelegde bescheiden ongenoegzaam, dan weigert deze tot het opmaken van de akte over te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel18
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '18'
        afdeling: '3'
  - number: 18b.2
    text: |-
      De ambtenaar van de burgerlijke stand weigert eveneens tot het opmaken van de akte over te gaan, indien hij van
      oordeel is dat de Nederlandse openbare orde zich hiertegen verzet.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel18b
  - number: 18b.3
    text: |-
      Van een weigering als bedoeld in het eerste of het tweede lid, doet de ambtenaar van de burgerlijke stand een
      schriftelijke, met redenen omklede mededeling aan de partijen bij de akte en de belanghebbende partijen toekomen,
      onder vermelding van de tegen die weigering openstaande voorziening van [afdeling 11][ref1]. Een afschrift van deze
      mededeling doet hij aan de gezaghebber en aan de officier van justitie toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Afdeling11
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0028743
        afdeling: '11'
  - number: 18c.1
    text: |-
      Van alle in registers opgenomen akten van de burgerlijke stand wordt een dubbel of een afschrift gehouden, volgens
      regels, bij algemene maatregel van bestuur te stellen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel18c
  - number: 18c.2
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld alles wat betreft de bewaring van de dubbelen of de afschriften,
      alsmede van de daarop betrekking hebbende latere vermeldingen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel18c
  - number: '19.1'
    text: |-
      Een akte van geboorte wordt opgemaakt door de ambtenaar van de burgerlijke stand van het openbaar lichaam waar het
      kind is geboren.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19
  - number: '19.2'
    text: |-
      Indien de plaats van de geboorte van het kind niet bekend is, wordt de akte opgemaakt door de ambtenaar van de
      burgerlijke stand van het openbaar lichaam waar het kind is aangetroffen. Dat openbaar lichaam geldt als openbaar
      lichaam waar het kind is geboren.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19
  - number: 19a
    text: |-
      In geval van geboorte op een varend schip tijdens een zeereis tussen twee van de openbare lichamen Bonaire, Sint
      Eustatius en Saba of tijdens een luchtreis tussen twee van de openbare lichamen Bonaire, Sint Eustatius en Saba met
      een luchtvaartuig, wordt de akte van geboorte opgemaakt door de ambtenaar van de burgerlijke stand van het openbaar
      lichaam waar dat kind het schip of het luchtvaartuig verlaat, dan wel waar het schip ligplaats kiest. Dat openbaar
      lichaam geldt als openbaar lichaam waar het kind is geboren.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19a
  - number: 19b
    text: |-
      Indien de plaats of de dag van de geboorte van het kind niet bekend is, dan wel indien de naam, met inbegrip van de
      voornamen, van de moeder niet bekend is, wordt de geboorteakte ten aanzien van deze punten opgemaakt krachtens een
      bevel en overeenkomstig de aanwijzingen van het Openbaar Ministerie.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19b
  - number: 19c
    text: |-
      Zijn krachtens [artikel 5, tweede lid][ref1], in de akte een voorlopige voornaam en geslachtsnaam opgenomen, dan
      zendt de ambtenaar van de burgerlijke stand onverwijld een volledig afschrift van de akte aan de Minister van
      Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel5
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19c
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '5'
  - number: 19d.1
    text: |-
      Indien het geslacht van het kind twijfelachtig is, wordt een geboorte-akte opgemaakt, waarin wordt vermeld dat het
      geslacht van het kind niet is kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19d
  - number: 19d.2
    text: |-
      Binnen drie maanden na de geboorte, of, bij overlijden binnen die termijn, ter gelegenheid van de aangifte van het
      overlijden, wordt onder doorhaling van de in het eerste lid bedoelde akte een nieuwe geboorteakte opgemaakt, waarin
      het geslacht, indien dit inmiddels is vastgesteld, wordt vermeld aan de hand van een ter zake overgelegde medische
      verklaring.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19d
  - number: 19d.3
    text: |-
      Is binnen de in het tweede lid genoemde termijn geen medische verklaring overgelegd, of blijkt uit de overgelegde
      medische verklaring dat het geslacht niet is kunnen worden vastgesteld, dan vermeldt de nieuwe geboorteakte dat het
      geslacht van het kind niet is kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19d
  - number: 19e.1
    text: Tot de aangifte van een geboorte is bevoegd de moeder van het kind.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19e
  - number: 19e.2
    text: Tot de aangifte is verplicht de vader.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19e
  - number: 19e.3
    text: 'Wanneer de vader ontbreekt of verhinderd is de aangifte te doen, is tot aangifte verplicht:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19e
  - number: 19e.3.a
    text: ieder die bij het ter wereld komen van het kind tegenwoordig is geweest;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19e
  - number: 19e.3.b
    text: |-
      de bewoner van het huis waar de geboorte heeft plaats gehad, of indien zulks is geschied in een inrichting tot
      verpleging of verzorging bestemd, in een gevangenis of in een soortgelijke inrichting, het hoofd van die inrichting
      of een door hem bij onderhandse akte bijzonderlijk tot het doen van de aangifte aangewezen ondergeschikte.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19e
  - number: 19e.4
    text: |-
      Voor een in het derde lid, onderdeel b, genoemde persoon bestaat de verplichting alleen indien een in dat lid,
      onderdeel a, genoemde persoon ontbreekt of verhinderd is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19e
  - number: 19e.5
    text: |-
      Wanneer tot de aangifte bevoegde of verplichte personen ontbreken of nalaten de aangifte te doen, geschiedt deze
      door of vanwege de gezaghebber van het openbaar lichaam alwaar de geboorteakte moet worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19e
  - number: 19e.6
    text: |-
      De verplichting tot aangifte moet worden vervuld binnen vijf dagen na de dag der bevalling. Van een aangifte later
      dan de vijfde dag, wordt door de ambtenaar van de burgerlijke stand mededeling gedaan aan het Openbaar Ministerie.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19e
  - number: 19e.7
    text: De ambtenaar van de burgerlijke stand stelt de identiteit van de aangever vast.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19e
  - number: 19e.8
    text: |-
      Bij de aangifte kan de ambtenaar van de burgerlijke stand zich doen overleggen een door de arts of de verloskundige
      die bij het ter wereld komen van het kind tegenwoordig was, opgemaakte verklaring dat het kind uit de als moeder
      opgegeven persoon is geboren. Is het kind buiten de tegenwoordigheid van een arts of verloskundige ter wereld
      gekomen, dan kan hij zich een door een zodanige hulpverlener nadien opgemaakte verklaring doen overleggen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19e
  - number: 19e.9
    text: |-
      Wordt geen gevolg gegeven aan het verzoek van de ambtenaar van de burgerlijke stand om overlegging van een
      verklaring als bedoeld in het achtste lid, of is in de verklaring vermeld dat de identiteit van de moeder onbekend
      is, dan is [artikel 19b][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel19b
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19e
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 19b
        afdeling: '4'
  - number: 19f.1
    text: |-
      Een akte van overlijden wordt opgemaakt door de ambtenaar van de burgerlijke stand van het openbaar lichaam waar
      het overlijden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19f
  - number: 19f.2
    text: |-
      Indien een lijk is gevonden en de plaats of de dag van overlijden niet met voldoende nauwkeurigheid kan worden
      vastgesteld, wordt de akte van overlijden opgemaakt door de ambtenaar van de burgerlijke stand van het openbaar
      lichaam waar het lijk is gevonden of aan land gebracht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19f
  - number: 19f.3
    text: |-
      Ongeacht het in het eerste lid bepaalde is het tweede lid van overeenkomstige toepassing indien het overlijden
      heeft plaatsgevonden op een op zee gestationeerde installatie en het lijk op Bonaire, Sint Eustatius of Saba aan
      land wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19f
  - number: 19g
    text: |-
      In geval van overlijden tijdens een zeereis tussen twee van de openbare lichamen Bonaire, Sint Eustatius en Saba
      of in een luchtvaartuig tijdens een luchtreis tussen twee van de openbare lichamen Bonaire, Sint Eustatius en Saba,
      wordt de akte van overlijden opgemaakt door de ambtenaar van de burgerlijke stand van het openbaar lichaam waar het
      lijk het schip of het luchtvaartuig verlaat, dan wel waar het schip ligplaats kiest. Dat openbaar lichaam geldt als
      openbaar lichaam waar het overlijden heeft plaats gevonden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19g
  - number: 19h.1
    text: Tot de aangifte van een overlijden is bevoegd wie daarvan uit eigen wetenschap kennis draagt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19h
  - number: 19h.2
    text: |-
      Binnen de in de [Begrafeniswet BES][ref1] en de [Crematiewet BES][ref2] gestelde termijn voor de begraving of
      verbranding, kan de persoon die in de lijkbezorging voorziet, door een in het eerste lid bedoelde persoon worden
      gemachtigd tot het doen van de aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0028363
      [ref2]: https://wetten.overheid.nl/BWBR0028203
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19h
    references:
      - id: ref1
        bwb_id: BWBR0028363
      - id: ref2
        bwb_id: BWBR0028203
  - number: 19h.3
    text: |-
      Wanneer tot de aangifte bevoegde personen ontbreken of nalaten binnen de in de [Begrafeniswet BES][ref1] en de
      [Crematiewet BES][ref2] gestelde termijn voor de begraving of verbranding de aangifte te doen, geschiedt deze door
      of vanwege de officier van justitie binnen wiens rechtsgebied de akte van overlijden moet worden opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028363
      [ref2]: https://wetten.overheid.nl/BWBR0028203
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19h
    references:
      - id: ref1
        bwb_id: BWBR0028363
      - id: ref2
        bwb_id: BWBR0028203
  - number: 19h.4
    text: |-
      In de gevallen, bedoeld in [artikel 19f, tweede en derde lid][ref1], geschiedt de aangifte schriftelijk door de
      officier van justitie of hulpofficier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel19f
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19h
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 19f
        afdeling: '4'
  - number: 19i.1
    text: |-
      Wanneer een kind levenloos ter wereld is gekomen, wordt een akte opgemaakt, die in het register van overlijden
      wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19i
  - number: 19i.2
    text: |-
      Wanneer een kind binnen de in [artikel 19e, zesde lid][ref1], bepaalde termijn is overleden voordat aangifte van de
      geboorte is geschied, wordt zowel een akte van geboorte als een akte van overlijden opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel19e
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19i
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 19e
        afdeling: '4'
  - number: 19i.3
    text: |-
      In de gevallen, bedoeld in het eerste en het tweede lid, is ten aanzien van de aangifte [artikel 19h][ref1] van
      overeenkomstige toepassing. In het in het tweede lid bedoelde geval blijft [artikel 19e][ref2] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel19h
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel19e
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19i
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 19h
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: 19e
        afdeling: '4'
  - number: 19ia
    text: |-
      Geen begraving of verbranding mag geschieden zonder het verlof, vrij van zegel en kosteloos door de ambtenaar van
      de burgerlijke stand af te geven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19ia
  - number: 19ib
    text: |-
      De ambtenaar, die het verbaal van schouwing zal hebben opgemaakt, is verplicht aan die van de burgerlijke stand
      dadelijk opgave te doen van al hetgeen vereist zal worden om de akte van overlijden op te maken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19ib
  - number: 19j.1
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld al wat betreft de aan de ambtenaar over te leggen stukken, het
      opmaken van de akten, onderscheidenlijk de voorlopige akten van geboorte en van overlijden, en de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19j
  - number: 19j.2
    text: |-
      Bij algemene maatregel van bestuur wordt tevens geregeld op welke wijze en waar de akten van geboorte en van
      overlijden zullen worden opgemaakt en ingeschreven wanneer dit ten gevolge van een verbod van verkeer of ten
      gevolge van andere buitengewone omstandigheden niet op de gewone wijze kan geschieden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel19j
  - number: '20.1'
    text: |-
      De ambtenaar van de burgerlijke stand voegt aan de onder hem berustende akten van de burgerlijke stand latere
      vermeldingen toe van akten van de burgerlijke stand en andere authentieke akten houdende erkenning of ontkenning
      van het vaderschap door de moeder, van brieven van vaderschap, van besluiten houdende wijziging of vaststelling van
      namen, van bevestigingen van opties mede houdende vaststelling van namen en naturalisatiebesluiten mede houdende
      wijziging of vaststelling van namen alsmede van besluiten tot intrekking van zulke bevestigingen of besluiten,
      van de opgave van afwijkende namen die een persoon die meer dan één nationaliteit bezit, voert in overeenstemming
      met het recht van het land waarvan hij mede de nationaliteit bezit, alsmede van rechterlijke uitspraken waarvan de
      dagtekening ten minste zes weken oud is en die inhouden:
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20
  - number: 20.1.a
    text: |-
      een last tot wijziging van de voornamen, een adoptie, een herroeping van een adoptie, een vernietiging van een
      erkenning, een gegrondverklaring van een ontkenning van het vaderschap, of een vernietiging van zulk een uitspraak;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20
  - number: 20.1.b
    text: |-
      de nietigverklaring van een huwelijk of de vernietiging van zulk een uitspraak tussen echtelieden wier
      huwelijksakte in de registers van de burgerlijke stand in de openbare lichamen Bonaire, Sint Eustatius en Saba
      is opgenomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20
  - number: '20.2'
    text: |-
      De ambtenaar van de burgerlijke stand voegt eveneens aan de onder hem berustende akten van de burgerlijke stand
      latere vermeldingen toe van in kracht van gewijsde gegane rechterlijke uitspraken die een echtscheiding, een
      ontbinding van een huwelijk na scheiding van tafel en bed of de vernietiging van zulk een uitspraak tussen
      echtelieden wier huwelijksakte in de registers van de burgerlijke stand in de openbare lichamen Bonaire, Sint
      Eustatius en Saba is opgenomen, inhouden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20
  - number: 20a.1
    text: |-
      De in [artikel 20, eerste lid][ref1], bedoelde latere vermeldingen, met uitzondering van de vermeldingen, bedoeld
      in dat lid, onderdeel b, worden toegevoegd aan de geboorteakte van de betrokken persoon.Van een wijziging of
      vaststelling van de geslachtsnaam wordt tevens een latere vermelding toegevoegd aan de geboorteakten van de
      kinderen van de betrokken persoon, voor zover de wijziging of vaststelling zich tot hen uitstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel20
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '20'
        afdeling: '5'
  - number: 20a.2
    text: |-
      De in [artikel 20, eerste lid, onderdeel b, en tweede lid][ref1], bedoelde latere vermeldingen worden toegevoegd
      aan de huwelijksakte van de betrokken persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel20
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '20'
        afdeling: '5'
  - number: 20a.3
    text: |-
      Wanneer als gevolg van het huwelijk of van de echtscheiding een verandering intreedt in de geslachtsnaam van een
      persoon, wordt hiervan, voor zover zij niet in de huwelijksakte is vermeld, aan deze akte een latere vermelding
      toegevoegd.Tevens wordt daarvan een latere vermelding toegevoegd aan de geboorteakte van de betrokkene en de
      geboorteakten van diens kinderen, voor zover hun naam eveneens verandert.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20a
  - number: 20a.4
    text: |-
      Van een aan de ambtenaar van de burgerlijke stand betekende akte van stuiting van een huwelijk wordt, evenals
      van beschikkingen of akten waarbij de stuiting wordt opgeheven, aan de akte van aangifte een latere vermelding
      toegevoegd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20a
  - number: 20b.1
    text: |-
      Van akten en uitspraken die in het buitenland overeenkomstig de plaatselijke voorschriften door een bevoegde
      instantie zijn opgemaakt of gedaan en een overeenkomstige uitwerking hebben als de akten en rechterlijke
      uitspraken, bedoeld in [artikel 20][ref1], wordt, tenzij de Nederlandse openbare orde zich hiertegen verzet, op
      verzoek van een belanghebbende dan wel ambtshalve, door de ambtenaar van de burgerlijke stand een latere vermelding
      toegevoegd aan de desbetreffende in de registers van de burgerlijke stand in de openbare lichamen Bonaire, Sint
      Eustatius of Saba voorkomende huwelijks- of geboorteakte. Van een verandering van de geslachtsnaam wordt op verzoek
      van een belanghebbende tevens een latere vermelding gevoegd bij de geboorteakte van de kinderen van de betrokken
      persoon, voor zover hun naam eveneens verandert.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel20
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '20'
        afdeling: '5'
  - number: 20b.2
    text: |-
      Indien een latere vermelding ambtshalve aan een akte is toegevoegd, zendt de ambtenaar van de burgerlijke stand een
      afschrift van de akte en de latere vermelding aan de persoon of personen op wie de akte betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20b
  - number: 20c
    text: |-
      De [artikelen 18][ref1] en [18b][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel18b
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20c
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '18'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: 18b
        afdeling: '3'
  - number: 20d
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld al wat betreft de aan de ambtenaar over te leggen stukken, het
      opmaken van de latere vermeldingen en de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20d
  - number: 20e.1
    text: |-
      Van de in [artikel 20, eerste lid][ref1], genoemde uitspraken zendt de griffier van het college waarvoor de zaak
      laatstelijk aanhangig was, niet eerder dan zes weken na de dag van de beschikking een afschrift aan de ambtenaar
      van de burgerlijke stand.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel20
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20e
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '20'
        afdeling: '5'
  - number: 20e.2
    text: |-
      Van brieven van vaderschap, van besluiten houdende wijziging of vaststelling van namen en van
      naturalisatiebesluiten mede houdende wijziging of vaststelling van namen zendt de Minister van Justitie onverwijld
      een afschrift aan de ambtenaar van de burgerlijke stand onder wie de akte van geboorte van de betrokken persoon
      berust.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20e
  - number: 20e.3
    text: |-
      De notaris die een akte van erkenning heeft opgemaakt, zendt onverwijld een afschrift of een uittreksel daarvan aan
      de ambtenaar van de burgerlijke stand onder wie de akte van geboorte van het kind berust.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20e
  - number: 20f
    text: |-
      De ambtenaar van de burgerlijke stand die een latere vermelding van de erkenning toevoegt aan de akte van geboorte
      van het kind, zendt een afschrift van die akte en de latere vermelding aan de personen op wie de akte betrekking
      heeft. Hij zendt een afschrift aan de ambtenaar van de burgerlijke stand die de akte van erkenning heeft opgemaakt.
      Deze akte wordt bewaard totdat achttien maanden zijn verstreken na de ontvangst van laatstgenoemd afschrift.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20f
  - number: 20g
    text: |-
      De ambtenaar van de burgerlijke stand die aan de geboorteakte van een minderjarige een latere vermelding toevoegt,
      waaruit blijkt dat de minderjarige is erkend, dat brieven van vaderschap zijn verleend of dat een naam van hem is
      gewijzigd, geeft van dit feit kennis aan de bewaarder van het in [artikel 244][ref1] bedoelde openbare register
      waarin rechtsfeiten omtrent die minderjarige zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel244
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel20g
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '244'
        afdeling: '4'
  - number: '21.1'
    text: |-
      De ambtenaar van de burgerlijke stand te ‘s Gravenhage maakt akten van inschrijving op van in kracht van gewijsde
      gegane rechterlijke uitspraken die inhouden de nietigverklaring van een huwelijk, een echtscheiding, de ontbinding
      van een huwelijk na scheiding van tafel en bed of de vernietiging van zulk een ingeschreven uitspraak tussen
      echtelieden wier huwelijksakte niet in de registers van de burgerlijke stand in de openbare lichamen Bonaire, Sint
      Eustatius en Saba is opgenomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel21
  - number: '21.2'
    text: |-
      De in het eerste lid bedoelde akten worden ingeschreven in het daartoe bestemde register van de burgerlijke stand
      te ‘s-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel21
  - number: '21.3'
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld al wat betreft de aan de ambtenaar over te leggen stukken, het
      opmaken van de akten van inschrijving en de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel21
  - number: '22.1'
    text: |-
      De akte van geboorte bewijst ten aanzien van een ieder dat op de in de akte vermelde plaats, dag en uur uit de
      daarin genoemde moeder een kind van het daarin vermelde geslacht is geboren.Vermeldt de akte dat de plaats van de
      geboorte van het kind niet bekend is, dan komt dezelfde bewijskracht toe aan de vermelding van de plaats waar het
      is aangetroffen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel22
  - number: '22.2'
    text: |-
      De akte van overlijden bewijst ten aanzien van een ieder dat op de plaats, de dag en het uur, in de akte vermeld,
      de daarin genoemde persoon is overleden of, indien de akte krachtens [artikel 19f, tweede lid][ref1], is opgemaakt,
      dat het lijk van de daarin genoemde persoon op de plaats, de dag en het uur, in de akte vermeld, is gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel19f
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 19f
        afdeling: '4'
  - number: '22.3'
    text: Voor het overige hebben akten van de burgerlijke stand dezelfde bewijskracht als andere authentieke akten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel22
  - number: 22a
    text: |-
      Authentieke afschriften of uittreksels, in de wettige vorm opgemaakt en afgegeven door de daartoe bevoegde
      bewaarder van het register, hebben dezelfde bewijskracht als het origineel, tenzij bewezen wordt dat zij daarmede
      niet overeenstemmen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel22a
  - number: '23'
    text: |-
      De openbaarheid van de akten van de burgerlijke stand, daaronder begrepen de in [artikel 18c][ref1] bedoelde
      dubbelen of afschriften van deze akten, is beperkt overeenkomstig de in deze afdeling gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel18c
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 18c
        afdeling: '3'
  - number: 23a
    text: |-
      Van de akten van de burgerlijke stand mogen slechts de bewaarders en het Openbaar Ministerie inzage nemen. Voorts
      kunnen de rechter en het Openbaar Ministerie overlegging van akten bevelen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel23a
  - number: 23b.1
    text: |-
      Een ieder is bevoegd zich door de ambtenaar die met de afgifte van afschriften en uittreksels van akten van
      de burgerlijke stand is belast, een uittreksel van een onder deze ambtenaar berustende akte van geboorte, van
      huwelijk of van overlijden te doen afgeven. Het uittreksel bevat de bij algemene maatregel van bestuur te vermelden
      gegevens, waaruit de afstamming van de persoon of personen waarop de akte betrekking heeft, niet blijkt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel23b
  - number: 23b.2
    text: |-
      Van de in het eerste lid bedoelde akten alsmede van de akten van erkenning wordt een afschrift slechts afgegeven
      indien de verzoeker aantoont dat hij bij de verkrijging een gerechtvaardigd belang heeft. Van andere akten die
      de in het eerste lid bedoelde ambtenaar onder zijn berusting heeft, wordt steeds een afschrift afgegeven. Dit
      afschrift bevat de bij algemene maatregel van bestuur te vermelden gegevens.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel23b
  - number: 23b.3
    text: |-
      Een verzoek om afgifte van een uittreksel of een afschrift dient op een bepaalde persoon of bepaalde personen
      betrekking te hebben.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel23b
  - number: 23b.4
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld al hetgeen overigens het opmaken en het verstrekken van
      afschriften en uittreksels betreft. Daarbij worden tevens regels gegeven voor het opmaken van uittreksels van akten
      die vóór de inwerkingtreding van deze wet zijn opgemaakt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel23b
  - number: 23b.5
    text: |-
      Weigert de in het eerste lid bedoelde ambtenaar een afschrift of een uittreksel af te geven, dan verstrekt hij aan
      de aanvrager een schriftelijke opgave van de gronden voor zijn weigering.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel23b
  - number: 23c
    text: |-
      De in [artikel 18c][ref1] bedoelde dubbelen of afschriften van de akten van de burgerlijke stand zijn slechts
      openbaar zolang zij onder de ambtenaar van de burgerlijke stand berusten.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel18c
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 18c
        afdeling: '3'
  - number: '24.1'
    text: |-
      Aanvulling van een register van de burgerlijke stand met een daarin ontbrekende akte of latere vermelding,
      doorhaling van een daarin ten onrechte voorkomende akte of latere vermelding, of verbetering van een daarin
      voorkomende akte of latere vermelding die onvolledig is of een misslag bevat, kan op verzoek van belanghebbenden
      of op vordering van het Openbaar Ministerie worden gelast door de rechter in eerste aanleg. De rechter kan bij
      zijn beschikking tot verbetering van een akte of latere vermelding die onvolledig is of een misslag bevat, eveneens
      dezelfde verbetering gelasten ten aanzien van een akte of latere vermelding betreffende dezelfde persoon of zijn
      afstammelingen, die buiten zijn rechtsgebied in de registers van de burgerlijke stand is opgenomen. De tweede
      zin is van overeenkomstige toepassing in gevallen dat de rechter een beschikking tot aanvulling, doorhaling of
      verbetering geeft met betrekking tot de registers van de burgerlijke stand van de gemeente 's-Gravenhage, met
      dien verstande dat de in de tweede zin bedoelde bevoegdheid van de rechter dan ook kan worden uitgeoefend ten
      aanzien van een akte of latere vermelding betreffende dezelfde persoon of zijn afstammelingen, die in zijn eigen
      rechtsgebied in de registers van de burgerlijke stand is opgenomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel24
  - number: '24.2'
    text: |-
      De griffier van het college waarvoor de zaak laatstelijk aanhangig was, zendt niet eerder dan zes weken na de
      dag van de beschikking een afschrift daarvan aan de ambtenaar van de burgerlijke stand van het openbaar lichaam
      in welks registers de akte of latere vermelding is of had moeten zijn opgenomen. In gevallen dat de akte of
      latere vermelding is of had moeten worden opgenomen in de registers van de burgerlijke stand van de gemeente ’s-
      Gravenhage, zendt de in de eerste zin bedoelde griffier het afschrift aan de ambtenaar van de burgerlijke stand van
      die gemeente.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel24
  - number: 24a
    text: |-
      Kennelijke misslagen en kennelijke schrijf- of spelfouten kunnen worden verbeterd met toestemming van de
      officier van justitie binnen wiens rechtsgebied de akte in de registers van de burgerlijke stand is opgenomen. De
      toestemming van de officier van justitie kan eveneens betrekking hebben op dezelfde verbetering ten aanzien van
      een akte betreffende dezelfde persoon of zijn afstammelingen, die in een ander rechtsgebied in de registers van de
      burgerlijke stand is opgenomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel24a
  - number: 24b.1
    text: |-
      Aanvulling van een register van de burgerlijke stand op grond van [artikel 24][ref1] geschiedt door het opmaken van
      een nieuwe akte in dat register.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel24
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '24'
        afdeling: '9'
  - number: 24b.2
    text: |-
      Van een verbetering of een doorhaling op grond van deze afdeling wordt een latere vermelding toegevoegd aan de
      desbetreffende akte, volgens regels, bij algemene maatregel van bestuur te stellen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel24b
  - number: '26.1'
    text: |-
      Een ieder die daarbij een gerechtvaardigd belang heeft, kan de rechter in eerste aanleg verzoeken een verklaring
      voor recht af te geven dat een op hem betrekking hebbende, in het buitenland opgemaakte akte of gedane uitspraak
      overeenkomstig de plaatselijke voorschriften door een bevoegde instantie is opgemaakt of gedaan en naar zijn aard
      vatbaar is voor opneming in een register van de burgerlijke stand in de openbare lichamen Bonaire, Sint Eustatius
      of Saba.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel26
  - number: '26.2'
    text: |-
      De in het eerste lid bedoelde verklaring voor recht kan eveneens op verzoek van de ambtenaar van de burgerlijke
      stand of op vordering van het Openbaar Ministerie worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel26
  - number: 26a
    text: |-
      De rechter in eerste aanleg kan, op verzoek of ambtshalve, bij de in [artikel 26, eerste lid][ref1], bedoelde
      verklaring voor recht tevens de toevoeging van een latere vermelding, op grond van [artikel 24, eerste lid][ref2],
      aan een in de registers van de burgerlijke stand in de openbare lichamen Bonaire, Sint Eustatius of Saba
      voorkomende akte gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel24
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '26'
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '24'
        afdeling: '9'
  - number: 26d
    text: |-
      De overlegging van een authentiek afschrift van de buitenlandse akte
      of uitspraak waarop het verzoek betrekking heeft, kan worden verlangd.
      [Artikel 986, derde en vierde lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel986
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel26d
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '986'
  - number: 26e
    text: |-
      De griffier van het college waarbij de zaak laatstelijk aanhangig was, zendt een afschrift van de beschikking
      aan de ambtenaar van de burgerlijke stand in wiens registers een op de belanghebbende betrekking hebbende akte is
      opgenomen, waaraan een latere vermelding van de beschikking moet worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel26e
  - number: '27'
    text: |-
      Naar aanleiding van een besluit van een ambtenaar van de burgerlijke stand om op grond van [artikel 18b][ref1] of
      [20c][ref2] te weigeren een akte van de burgerlijke stand op te maken, een latere vermelding aan een akte toe te
      voegen of, buiten het geval van stuiting van het huwelijk en dat van afgifte van een afschrift of een uittreksel,
      aan een verrichting mee te werken, hebben belanghebbende partijen de bevoegdheid zich binnen acht weken na de
      verzending van dat besluit bij verzoekschrift te wenden tot de rechter in eerste aanleg binnen wiens rechtsgebied
      de standplaats van de ambtenaar van de burgerlijke stand is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel18b
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel20c
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 18b
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: 20c
        afdeling: '5'
  - number: 27a
    text: |-
      De rechter kan, op verzoek van een belanghebbende partij of ambtshalve, bij zijn beschikking tevens een verklaring
      als bedoeld in [artikel 26][ref1], afgeven, alsmede een last als bedoeld in [artikel 26a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel26a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '26'
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: 26a
        afdeling: '10'
  - number: 27b
    text: |-
      De griffier zendt een afschrift van de beschikking aan de belanghebbende partijen en aan de ambtenaar van de
      burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel27b
  - number: '30.1'
    text: Het huwelijk kan slechts bestaan tussen een man en een vrouw.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel30
  - number: '30.2'
    text: De wet beschouwt het huwelijk alleen in zijn burgerlijke betrekkingen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel30
  - number: '31.1'
    text: Om een huwelijk te mogen aangaan moeten een man en een vrouw de leeftijd van achttien jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel31
  - number: '31.2'
    text: |-
      Het in het eerste lid vermelde huwelijksbeletsel bestaat niet wanneer zij die met elkander een huwelijk willen
      aangaan de leeftijd van zestien jaren hebben bereikt, en de vrouw een verklaring van een arts overlegt dat zij
      zwanger is, dan wel haar kind reeds ter wereld heeft gebracht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel31
  - number: '31.3'
    text: De Minister van Justitie kan om gewichtige redenen ontheffing verlenen van het in het eerste lid genoemde vereiste.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel31
  - number: '32'
    text: |-
      Een huwelijk mag niet worden aangegaan, wanneer de geestvermogens van een partij zodanig zijn gestoord dat deze
      niet in staat is haar wil te bepalen of de betekenis van haar verklaring te begrijpen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel32
  - number: '33'
    text: De man kan tegelijkertijd slechts met een vrouw, de vrouw slechts met een man door het huwelijk verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel33
  - number: '35.1'
    text: Een minderjarige mag geen huwelijk aangaan zonder toestemming van zijn ouders.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel35
  - number: '35.2'
    text: |-
      Zijn de geestvermogens van een ouder zodanig gestoord dat hij niet in staat is zijn wil te bepalen of de betekenis
      van zijn verklaring te begrijpen, dan is zijn toestemming niet vereist.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel35
  - number: '35.3'
    text: Een minderjarige die onder voogdij staat, heeft bovendien de toestemming van zijn voogd nodig.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel35
  - number: '36'
    text: |-
      Voor zover een volgens [artikel 35][ref1] vereiste toestemming niet wordt verkregen, kan zij op verzoek van de
      minderjarige door die van de rechter in eerste aanleg worden vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel35
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '35'
        afdeling: '1'
  - number: '39.1'
    text: |-
      Heeft de rechter in eerste aanleg de toestemming verleend, dan is de termijn van beroep veertien dagen en kan
      gedurende die termijn de beschikking niet worden ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel39
  - number: '39.2'
    text: |-
      Hij die tegen een verleende toestemming opkomt, is verplicht dit binnen de termijn van beroep bij
      deurwaardersexploit te doen aanzeggen aan de ambtenaar of ambtenaren van de burgerlijke stand ten overstaan van
      wie het huwelijk kan worden voltrokken. Door dit te verzuimen verliest hij het recht om de nietigverklaring van het
      huwelijk op grond van het ontbreken van zijn toestemming te vragen, indien het Gemeenschappelijk Hof van Justitie
      van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba de beschikking van de rechter in eerste
      aanleg vernietigt en het huwelijk reeds is voltrokken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel39
  - number: '41.1'
    text: |-
      Een huwelijk mag niet worden gesloten tussen hen die elkander, hetzij van nature, hetzij familierechtelijk bestaan
      in de opgaande en in de nederdalende lijn of als broeder en zuster.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel41
  - number: '41.2'
    text: |-
      De Minister van Justitie kan om gewichtige redenen ontheffing van het verbod verlenen aan hen die broeder en zuster
      door adoptie zijn.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel41
  - number: '42'
    text: |-
      Zij die met elkander een huwelijk willen aangaan, mogen niet tegelijkertijd op de voet van het Nederlandse
      Burgerlijk Wetboek een geregistreerd partnerschap of een huwelijk met een persoon van gelijk geslacht zijn
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel42
  - number: '43.1'
    text: |-
      Zij die met elkaar een huwelijk willen aangaan, moeten daarvan onder overlegging van de in
      [artikel 44, eerste lid][ref1], genoemde bescheiden, aangifte doen bij de ambtenaar van de burgerlijke stand van
      het openbaar lichaam waar het huwelijk zal worden voltrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel44
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '44'
        afdeling: '2'
  - number: '43.2'
    text: |-
      De aangifte geschiedt in persoon of bij zodanige geschriften waaruit van het voornemen der aanstaande echtgenoten
      met genoegzame zekerheid kan blijken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel43
  - number: '43.3'
    text: De ambtenaar van de burgerlijke stand maakt van de aangifte een akte op.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel43
  - number: '44.1'
    text: |-
      Voor de aangifte van het huwelijk worden de volgende bescheiden aan de ambtenaar van de burgerlijke stand
      overgelegd:
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel44
  - number: 44.1.a
    text: |-
      de geboorteakte van ieder der aanstaande echtgenoten, en van elk van hen een gewaarmerkt afschrift van gegevens uit
      de basisadministratie persoonsgegevens, tenzij zij niet als ingezetene in een basisadministratie persoonsgegevens
      behoeven te zijn ingeschreven;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel44
  - number: 44.1.b
    text: |-
      een akte van huwelijkstoestemming, gegeven door hen, wier toestemming tot het huwelijk noodzakelijk is; de akte
      van huwelijkstoestemming wordt door een ambtenaar van de burgerlijke stand of door een notaris opgemaakt; de
      toestemming kan ook bij de huwelijksakte worden gegeven; is de toestemming door de rechter verleend, dan wordt
      diens beschikking overgelegd;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel44
  - number: 44.1.c
    text: een akte van overlijden van allen wier toestemming voor het huwelijk was vereist, als zij in leven waren geweest;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel44
  - number: 44.1.d
    text: |-
      in geval van tweede of verder huwelijk, bewijsstukken aantonende dat het vorige huwelijk geen beletsel voor een
      nieuw huwelijk oplevert;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel44
  - number: 44.1.e
    text: het bewijs van de ontheffing of de vergunning van de Minister van Justitie, in geval deze is vereist;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel44
  - number: 44.1.f
    text: |-
      indien een beschikking als bedoeld in [titel 4, afdeling 12][ref1], of een vrijstelling krachtens
      [artikel 62][ref2] is verkregen, ook deze;


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Afdeling12
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel62
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028743
        afdeling: '12'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '62'
        afdeling: '4'
  - number: 44.1.g
    text: |-
      de verklaring, bedoeld in [artikel 31, tweede lid][ref1], in geval deze vereist is;


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel31
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '31'
        afdeling: '1'
  - number: 44.1.h
    text: |-
      een door de gezaghebber aan de ambtenaar van de burgerlijke stand afgegeven verklaring waaruit blijkt dat de
      aanstaande echtgenoot die niet de Nederlandse nationaliteit bezit, over een titel tot verblijf in de openbare
      lichamen Bonaire, Sint Eustatius en Saba beschikt of om toelating in de openbare lichamen Bonaire, Sint Eustatius
      en Saba heeft verzocht, dan wel voornemens is niet in de openbare lichamen Bonaire, Sint Eustatius en Saba te
      verblijven; de verklaring wordt opgesteld op verzoek van de aanstaande echtgenoot op wie zij betrekking heeft;
      heeft deze geen woonplaats in de openbare lichamen Bonaire, Sint Eustatius en Saba, dan wordt zij opgesteld
      op verzoek van de andere aanstaande echtgenoot; de verklaring is niet vereist indien de aanstaande echtgenoten
      aannemelijk kunnen maken dat zij beiden in het buitenland woonplaats hebben.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel44
  - number: '44.2'
    text: |-
      Voor de voltrekking van het huwelijk worden, naast de in het eerste lid genoemde bescheiden, de volgende bescheiden
      aan de ambtenaar van de burgerlijke stand overgelegd:
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel44
  - number: 44.2.a
    text: de akte van huwelijksaangifte;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel44
  - number: 44.2.b
    text: indien stuiting heeft plaatsgevonden, het bewijs dat de stuiting is opgeheven;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel44
  - number: 44.2.c
    text: |-
      een schriftelijke opgave van de namen en de adressen van de personen die zijn uitgenodigd om als getuigen bij de
      voltrekking van het huwelijk aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel44
  - number: '44.3'
    text: De in het eerste en tweede lid genoemde bescheiden vormen de bijlagen van de huwelijksakte.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel44
  - number: '44.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inhoud van het in het eerste
      lid, onderdeel a, bedoelde gewaarmerkt afschrift van gegevens uit de basisadministratie persoonsgegevens, alsmede
      de in het eerste lid, onderdeel h, bedoelde verklaring.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel44
  - number: '45.1'
    text: |-
      Een aanstaande echtgenoot die in de onmogelijkheid is zijn door [artikel 44][ref1] vereiste geboorteakte te
      vertonen, kan dit verhelpen door een akte van bekendheid, afgegeven door de rechter in eerste aanleg van zijn
      geboorteplaats of woonplaats, op verklaring van vier meerderjarige getuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel44
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '44'
        afdeling: '2'
  - number: '45.2'
    text: |-
      Deze verklaring houdt de vermelding in van de plaats en, zo na mogelijk, van het tijdstip der geboorte, benevens de
      oorzaken die beletten een akte daarvan over te leggen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel45
  - number: '45.3'
    text: |-
      Het ontbreken van een geboorteakte kan ook worden verholpen, hetzij door een dergelijke, maar beëdigde verklaring,
      afgelegd door de getuigen die bij de voltrekking van het huwelijk tegenwoordig zijn, of wel door een bij de
      ambtenaar van de burgerlijke stand afgelegde beëdigde verklaring van de aanstaande echtgenoot, inhoudende dat
      hij zich geen geboorteakte of akte van bekendheid kan verschaffen. In de huwelijksakte wordt van de afgelegde
      verklaring melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel45
  - number: 45a
    text: |-
      Indien partijen niet in staat zijn de akten van overlijden, bedoeld in [artikel 44, eerste lid, onderdeel c][ref1],
      over te leggen, kan dat gebrek op dezelfde wijze als in het geval van [artikel 45][ref2] worden verholpen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel45
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '44'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '45'
        afdeling: '2'
  - number: '46'
    text: |-
      Wanneer het huwelijk binnen een jaar, te rekenen van de datum van de akte van huwelijksaangifte, niet is
      voltrokken, mag het niet worden voltrokken dan nadat een nieuwe aangifte is gedaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel46
  - number: '47.1'
    text: |-
      Indien een minderjarige een huwelijk wenst aan te gaan, onderzoekt de ambtenaar van de burgerlijke stand van welke
      personen daartoe de toestemming wordt vereist.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel47
  - number: '47.2'
    text: |-
      Voorts onderzoekt die ambtenaar of de minderjarige onder toezicht gesteld of voorlopig aan de voogdijraad
      toevertrouwd is. Blijkt dit het geval, dan verwittigt hij bij ondertoezichtstelling de rechter in eerste aanleg en
      in het andere geval de voogdijraad onverwijld van het voorgenomen huwelijk.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel47
  - number: '48'
    text: |-
      Indien hij die wil hertrouwen het gezag heeft over kinderen uit een vorig huwelijk, geeft de ambtenaar van de
      burgerlijke stand van de gedane aangifte onverwijld kennis aan de rechter in eerste aanleg van de woonplaats van de
      bedoelde ouder.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel48
  - number: '49.1'
    text: |-
      Trouwbeloften geven geen rechtsvordering tot het aangaan van een huwelijk, noch tot schadevergoeding wegens de
      niet-vervulling van de beloften; alle afwijkende bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel49
  - number: '49.2'
    text: |-
      Indien echter een akte van huwelijksaangifte is opgemaakt, kan dit grond opleveren tot een vordering tot vergoeding
      der werkelijke vermogensverliezen, zonder dat daarbij enige winstderving in aanmerking komt. De vordering vervalt
      door verloop van achttien maanden, te rekenen van de datum van de akte van huwelijksaangifte.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel49
  - number: 49a.1
    text: |-
      Indien een buiten de openbare lichamen Bonaire, Sint Eustatius en Saba woonplaats hebbende of gehad hebbende
      Nederlander, vluchteling of staatloze van wie het personele statuut door de wetgeving van Bonaire, Sint Eustatius
      en Saba bepaald wordt, buiten de openbare lichamen Bonaire, Sint Eustatius en Saba een huwelijk wenst aan te gaan,
      wordt op zijn verzoek aan hem een verklaring van huwelijksbevoegdheid overeenkomstig het model, toegevoegd aan
      de op 5 september 1980 te München tot stand gekomen Overeenkomst betreffende de afgifte van een verklaring van
      huwelijksbevoegdheid (Trb. 1981, 71), afgegeven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel49a
  - number: 49a.2
    text: 'Deze verklaring wordt afgegeven:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel49a
  - number: 49a.2.a
    text: |-
      aan degene die in de openbare lichamen Bonaire, Sint Eustatius en Saba woonplaats heeft door de ambtenaar van de
      burgerlijke stand van zijn woonplaats;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel49a
  - number: 49a.2.b
    text: |-
      aan degene die in de openbare lichamen Bonaire, Sint Eustatius en Saba geen woonplaats heeft, maar wel heeft gehad,
      door de ambtenaar van de burgerlijke stand van zijn laatste woonplaats aldaar.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel49a
  - number: 49a.3
    text: |-
      De verklaring wordt door de bevoegde autoriteit niet afgegeven alvorens deze, door kennisneming van de bescheiden,
      vermeld in [artikel 44, eerste lid, onderdelen a tot en met e][ref1], en zo nodig van die, vermeld in de
      [artikelen 45][ref2] en [45a][ref3], alsmede in [artikel 27b][ref4], zich ervan heeft overtuigd dat naar het recht
      van de openbare lichamen Bonaire, Sint Eustatius en Saba geen beletselen tegen het huwelijk bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel45a
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel27b
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '44'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '45'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0028743
        artikel: 45a
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0028743
        artikel: 27b
        afdeling: '11'
  - number: 49a.4
    text: De verklaring van huwelijksbevoegdheid is, te rekenen van het tijdstip van afgifte, gedurende zes maanden geldig.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel49a
  - number: 49a.5
    text: |-
      Onverminderd [artikel 6][ref1] van de in het eerste lid genoemde Overeenkomst worden de in het eerste lid van dat
      artikel bedoelde onveranderlijke vermeldingen op de verklaring bovendien gedrukt in de Engelse en de Spaanse taal.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel6
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '6'
  - number: '50'
    text: |-
      Een huwelijk kan worden gestuit, wanneer partijen niet de vereisten in zich verenigen om een huwelijk aan te gaan,
      dan wel wanneer het oogmerk van de aanstaande echtgenoten, of één hunner, niet is gericht op de vervulling van
      de door de wet aan de huwelijkse staat verbonden plichten, doch op het verkrijgen van toelating in de openbare
      lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel50
  - number: '51.1'
    text: |-
      Bevoegd tot stuiting, wanneer partijen niet de vereisten in zich verenigen om een huwelijk aan te gaan, zijn
      bloedverwanten in de rechte lijn, broeders, zusters, voogden en curatoren van een der aanstaande echtgenoten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel51
  - number: '51.2'
    text: |-
      De in het eerste lid genoemde personen zijn ook bevoegd een huwelijk te stuiten, wanneer de andere aanstaande
      echtgenoot onder curatele staat, en het huwelijk klaarblijkelijk het ongeluk zou veroorzaken van de partij waarvan
      zij bloedverwant, voogd of curator zijn.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel51
  - number: '52'
    text: |-
      Hij die met een der partijen door huwelijk verbonden is dan wel met een der partijen op de voet van het
      [Nederlandse Burgerlijk Wetboek][ref1] een geregistreerd partnerschap is aangegaan, kan op grond van het bestaan
      van dat huwelijk of dat geregistreerd partnerschap een nieuw aan te gaan huwelijk stuiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: '53.1'
    text: |-
      Het Openbaar Ministerie is verplicht een voorgenomen huwelijk te stuiten, indien het met een der in de
      [artikelen 31 tot en met 33][ref1] en [42][ref2] omschreven huwelijksbeletselen bekend is.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel42
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '31'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '42'
        afdeling: '1'
  - number: '53.2'
    text: |-
      Het Openbaar Ministerie is bevoegd het huwelijk te stuiten van een minderjarige die onder toezicht is gesteld of
      voorlopig aan de voogdijraad is toevertrouwd, indien het belang van die minderjarige zich tegen het aangaan van
      het huwelijk verzet; daarbij kan het belang dat de wederpartij bij het huwelijk heeft, mede in aanmerking worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel53
  - number: '53.3'
    text: |-
      Het Openbaar Ministerie is voorts bevoegd het huwelijk als schijnhandeling wegens strijd met de Nederlandse
      openbare orde te stuiten indien het oogmerk van de aanstaande echtgenoten, of één hunner, niet is gericht op de
      vervulling van de door de wet aan de huwelijkse staat verbonden plichten, doch op het verkrijgen van toelating in
      de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel53
  - number: '54.1'
    text: |-
      De stuiting geschiedt door betekening van een akte aan de ambtenaar van de burgerlijke stand van het openbaar
      lichaam waar het huwelijk zal worden voltrokken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel54
  - number: '54.2'
    text: |-
      De akte houdt de keus van een woonplaats in dat openbaar lichaam en de gronden van de stuiting in en vermeldt de
      hoedanigheid die aan de opposant de bevoegdheid geeft om het huwelijk te stuiten; alles op straffe van nietigheid.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel54
  - number: '54.3'
    text: |-
      De opposant zal afschrift der akte van stuiting onverwijld doen betekenen aan de partij tegen welke de stuiting
      is gericht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel54
  - number: '55'
    text: 'Een stuiting kan worden opgeheven:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel55
  - number: 55.a
    text: op dezelfde wijze als waarop zij is geschied;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel55
  - number: 55.b
    text: |-
      door een verklaring, in persoon afgelegd ten overstaan van de ambtenaar van de burgerlijke stand, genoemd in
      [artikel 54][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel54
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '54'
        afdeling: '3'
  - number: 55.c
    text: door een verklaring, afgelegd ten overstaan van een notaris;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel55
  - number: 55.d
    text: door een in kracht van gewijsde gegane beschikking, gegeven op verzoek van een belanghebbende.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel55
  - number: '56'
    text: |-
      Het huwelijk mag niet worden voltrokken, voordat de stuiting is opgeheven. Mocht het desniettemin voltrokken
      zijn hangende een geding tot opheffing van de stuiting, dan kan dit geding op verlangen van de opposant worden
      voortgezet en wordt het huwelijk nietig verklaard, indien de rechter de gegrondheid der stuiting aanvaardt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel56
  - number: '57'
    text: |-
      Een ambtenaar van de burgerlijke stand aan wie het bestaan van een der in de [artikelen 31 tot en met 33][ref1] en
      [42][ref2] omschreven huwelijksbeletselen bekend is, mag niet tot een huwelijksaangifte of een huwelijksvoltrekking
      meewerken, ook al zou geen stuiting hebben plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel42
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '31'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '42'
        afdeling: '1'
  - number: '58.1'
    text: |-
      Komt vast te staan dat op het tijdstip waarop de voltrekking van het huwelijk zal plaatsvinden,
      meer dan zes maanden zullen zijn verstreken sinds de afgifte van een verklaring als bedoeld in
      [artikel 44, eerste lid, onderdeel h][ref1], dan doet de ambtenaar van de burgerlijke stand zich, alvorens tot de
      voltrekking van het huwelijk over te gaan, wederom een zodanige verklaring overleggen, tenzij zulks op grond van
      het derde lid niet vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel44
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '44'
        afdeling: '2'
  - number: '58.2'
    text: |-
      Indien de overlegging van een verklaring als bedoeld in [artikel 44, eerste lid, onderdeel h][ref1], op het
      tijdstip van de aangifte van het huwelijk niet werd vereist, doet de ambtenaar van de burgerlijke stand zich,
      alvorens tot voltrekking van het huwelijk over te gaan, alsnog een zodanige verklaring overleggen, tenzij zulks op
      grond van het derde lid niet vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel44
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '44'
        afdeling: '2'
  - number: '58.3'
    text: |-
      De verklaring wordt opgesteld op verzoek van de aanstaande echtgenoot op wie zij betrekking heeft. Een verklaring
      is niet vereist indien de aanstaande echtgenoten aannemelijk kunnen maken dat zij beiden buiten de openbare
      lichamen Bonaire, Sint Eustatius en Saba woonplaats hebben.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel58
  - number: '62.1'
    text: Het huwelijk mag niet worden voltrokken vóór de veertiende dag na de datum van de akte van huwelijksaangifte.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel62
  - number: '62.2'
    text: |-
      De gezaghebber is bevoegd uit hoofde van gewichtige redenen vrijstelling te verlenen van de voorgeschreven
      wachttijd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel62
  - number: '63'
    text: |-
      Een huwelijk wordt in tegenwoordigheid van ten minste twee en ten hoogste vier meerderjarige getuigen in het
      openbaar in het daartoe door het bestuurscollege bestemde gebouw voltrokken ten overstaan van de ambtenaar van de
      burgerlijke stand van het bij de huwelijksaangifte aangewezen openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel63
  - number: '64'
    text: |-
      Indien een der partijen uit hoofde van een behoorlijk bewezen wettig beletsel verhinderd wordt zich naar het voor
      de huwelijksvoltrekking bestemde gebouw te begeven of indien de gezaghebber daartoe toestemming verleent, kan het
      huwelijk worden voltrokken elders in hetzelfde openbaar lichaam, mits dit in tegenwoordigheid van zes meerderjarige
      getuigen geschiedt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel64
  - number: '65'
    text: |-
      De aanstaande echtgenoten zijn verplicht bij de voltrekking van hun huwelijk in persoon voor de ambtenaar van de
      burgerlijke stand te verschijnen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel65
  - number: '66'
    text: |-
      Het staat de Minister van Justitie vrij uit hoofde van gewichtige redenen aan partijen te vergunnen het huwelijk
      door een bijzondere bij authentieke akte gevolmachtigde te voltrekken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel66
  - number: '67.1'
    text: |-
      De aanstaande echtgenoten moeten ten overstaan van de ambtenaar van de burgerlijke stand en in tegenwoordigheid van
      de getuigen verklaren, dat zij elkander aannemen tot echtgenoten en dat zij getrouw alle plichten zullen vervullen
      die door de wet aan de huwelijkse staat worden verbonden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel67
  - number: '67.2'
    text: |-
      Terstond nadat deze verklaring is afgelegd, verklaart de ambtenaar van de burgerlijke stand dat partijen door de
      echt aan elkander zijn verbonden, en maakt hij daarvan in het daartoe bestemde register een akte op.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel67
  - number: '69.1'
    text: |-
      Voor zover hieronder niet anders is bepaald, kan op grond dat de echtgenoten niet de vereisten in zich verenigden
      om te zamen een huwelijk aan te gaan, de nietigverklaring van het huwelijk worden verzocht door:
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel69
  - number: 69.1.a
    text: de bloedverwanten in de opgaande lijn van een der echtgenoten;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel69
  - number: 69.1.b
    text: ieder der echtgenoten;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel69
  - number: 69.1.c
    text: |-
      alle overige personen die daarbij een onmiddellijk rechtsbelang hebben, echter deze alleen na de ontbinding van
      het huwelijk;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel69
  - number: 69.1.d
    text: het Openbaar Ministerie, echter alleen zolang het huwelijk niet is ontbonden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel69
  - number: '69.2'
    text: |-
      Hij die met een der echtgenoten nog door een vroeger huwelijk dan wel door een eerder op de voet van het
      [Nederlandse Burgerlijk Wetboek][ref1] gesloten geregistreerd partnerschap is verbonden, is eveneens bevoegd op
      grond van het bestaan van dat huwelijk of die registratie de nietigverklaring van het daarna gesloten huwelijk
      te verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: '70.1'
    text: |-
      Op verzoek van de ouders, de echtgenoten en het Openbaar Ministerie kan een huwelijk worden nietig verklaard,
      wanneer het ten overstaan van een niet bevoegde ambtenaar van de burgerlijke stand of niet in tegenwoordigheid van
      het vereiste aantal getuigen is voltrokken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel70
  - number: '70.2'
    text: |-
      De bevoegdheid van een echtgenoot om uit dien hoofde de nietigverklaring van het huwelijk te verzoeken, vervalt
      indien er uiterlijk bezit van de huwelijkse staat en een akte van huwelijksvoltrekking ten overstaan van een
      ambtenaar van de burgerlijke stand verleden, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel70
  - number: '71.1'
    text: |-
      Een echtgenoot kan de nietigverklaring van zijn huwelijk verzoeken, wanneer dit onder invloed van een onrechtmatige
      ernstige bedreiging is gesloten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel71
  - number: '71.2'
    text: |-
      Een gelijk verzoek komt de echtgenoot toe, die bij de huwelijksvoltrekking gedwaald heeft hetzij in de persoon van
      de andere echtgenoot, hetzij omtrent de betekenis van de door hem afgelegde verklaring.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel71
  - number: '71.3'
    text: |-
      De bevoegdheid van de echtgenoot de nietigverklaring wegens bedreiging of dwaling te verzoeken, vervalt wanneer de
      echtgenoten zes maanden hebben samengewoond sedert het ophouden van de bedreiging of de ontdekking van de dwaling,
      zonder dat het verzoek is ingediend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel71
  - number: 71a
    text: |-
      Op vordering van het Openbaar Ministerie kan een huwelijk als schijnhandeling wegens strijd met de Nederlandse
      openbare orde worden nietig verklaard indien het oogmerk van de echtgenoten, of één hunner, niet was gericht op de
      vervulling van de door de wet aan de huwelijkse staat verbonden plichten, doch op het verkrijgen van toelating in
      de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel71a
  - number: '72'
    text: |-
      Een huwelijk kan niet nietig worden verklaard uit hoofde dat op het tijdstip van de huwelijksvoltrekking een
      der echtgenoten onder curatele stond, en het huwelijk klaarblijkelijk het ongeluk van de andere echtgenoot zou
      veroorzaken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel72
  - number: '73'
    text: |-
      De nietigverklaring van een huwelijk uit hoofde van een geestelijke stoornis kan na het ophouden van de stoornis
      alleen worden verzocht door de echtgenoot die geestelijk gestoord was. Het verzoek vervalt door een samenwoning van
      ten minste zes maanden na het ophouden van de stoornis.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel73
  - number: '74'
    text: |-
      De nietigverklaring van een huwelijk dat aangegaan is door iemand die de vereiste leeftijd miste, kan niet worden
      verzocht, wanneer deze op de dag van het verzoek de vereiste ouderdom heeft, noch wanneer de vrouw vóór de dag van
      het verzoek zwanger is geworden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel74
  - number: '75.1'
    text: |-
      Wegens het ontbreken van een vereiste toestemming van een derde kan de nietigverklaring van het huwelijk alleen
      door die derde worden verzocht. Dit verzoek vervalt, wanneer hij die bevoegd is de nietigverklaring te verzoeken,
      het huwelijk uitdrukkelijk of stilzwijgend heeft goedgekeurd, of wanneer drie maanden verlopen zijn nadat hij met
      de huwelijksvoltrekking bekend is geworden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel75
  - number: '75.2'
    text: |-
      Hij die bevoegd is de nietigverklaring te verzoeken, wordt vermoed met het huwelijk bekend te zijn geworden,
      wanneer het in het openbaar lichaam Bonaire, Sint Eustatius of Saba is voltrokken, of wanneer het, buiten de
      openbare lichamen Bonaire, Sint Eustatius en Saba aangegaan, in het openbaar lichaam Bonaire, Sint Eustatius of
      Saba in de registers van de burgerlijke stand is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel75
  - number: '76'
    text: |-
      Behoudens het in [artikel 56][ref1] bepaalde, verklaart de rechter een huwelijk alleen nietig op grond van een
      verzoek overeenkomstig de bepalingen van deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel56
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '56'
        afdeling: '3'
  - number: '77.1'
    text: |-
      De nietigverklaring van het huwelijk werkt zodra de beschikking in kracht van gewijsde is gegaan; zij werkt terug
      tot het tijdstip van de huwelijksvoltrekking.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel77
  - number: '77.2'
    text: 'Nochtans mist de beschikking terugwerkende kracht en heeft zij hetzelfde gevolg als een echtscheiding:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel77
  - number: 77.2.a
    text: |-
      ten aanzien van de kinderen der echtgenoten, tenzij de nietigverklaring is geschied ingevolge [artikel 71a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel71a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 71a
        afdeling: '5'
  - number: 77.2.b
    text: |-
      ten aanzien van de te goeder trouw zijnde echtgenoot; deze kan echter niet op een gemeenschap van goederen
      aanspraak maken wanneer het huwelijk dan wel op de voet van het [Nederlandse Burgerlijk Wetboek][ref1] gesloten
      geregistreerd partnerschap wegens het bestaan van een vroeger huwelijk is nietig verklaard;


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 77.2.c
    text: |-
      ten aanzien van andere personen dan de echtgenoten en hun kinderen, voor zover zij te goeder trouw vóór de
      inschrijving der nietigverklaring rechten hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel77
  - number: '78'
    text: |-
      Het bestaan van een in de openbare lichamen Bonaire, Sint Eustatius en Saba gesloten huwelijk kan niet anders
      worden bewezen dan door de huwelijksakte, behoudens in de gevallen bij de volgende artikelen voorzien.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel78
  - number: '79'
    text: |-
      Heeft het huwelijksregister niet bestaan of is het verloren gegaan of ontbreekt daaraan de huwelijksakte, dan
      kan het huwelijk door getuigen of bescheiden worden bewezen, mits er een uiterlijk bezit van de huwelijkse staat
      aanwezig is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel79
  - number: '80'
    text: |-
      Wordt in een geding betwist dat een kind, dat uiterlijk bezit van staat heeft, uit een huwelijk is geboren, dan
      levert het feit dat de ouders openlijk als man en vrouw hebben geleefd, voldoende bewijs op.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel80
  - number: 80a
    text: |-
      Een huwelijk, voltrokken op grond van het in het Europese deel van Nederland geldende Burgerlijk Wetboek, heeft
      in de openbare lichamen Bonaire, Sint Eustatius en Saba de rechtsgevolgen die het Europees Nederlandse burgerlijk
      recht aan het betreffende huwelijk verbindt, ongeacht de wettelijke regelingen en voorschriften die van toepassing
      zijn in deze lichamen. De [artikelen 5 tot en met 7 van de Wet conflictenrecht huwelijk][ref1] zijn van toepassing
      in de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0004619#Artikel5
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0004619
        artikel: '5'
  - number: 80b
    text: |-
      Een geregistreerd partnerschap, voltrokken op grond van het in het Europese deel van Nederland geldende Burgerlijk
      Wetboek, heeft in de openbare lichamen Bonaire, Sint Eustatius en Saba de rechtsgevolgen die het Europees
      Nederlandse burgerlijk recht aan het geregistreerd partnerschap verbindt, ongeacht de wettelijke regelingen en
      voorschriften die van toepassing zijn in deze lichamen. In de openbare lichamen Bonaire, Sint Eustatius en Saba
      is de [Wet conflictenrecht][ref1] geregistreerd partnerschap van toepassing op een buiten het Koninkrijk aangegaan
      geregistreerd partnerschap.


      [ref1]: https://wetten.overheid.nl/BWBR0004619
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0004619
  - number: '81'
    text: |-
      Echtgenoten zijn elkander getrouwheid, hulp en bijstand verschuldigd. Zij zijn verplicht elkander het nodige te
      verschaffen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel81
  - number: '82'
    text: Echtgenoten zijn jegens elkander verplicht hun kinderen te verzorgen en op te voeden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel82
  - number: '83.1'
    text: |-
      Echtgenoten zijn jegens elkander tot samenwoning verplicht, tenzij gewichtige redenen zich daartegen verzetten. De
      verplichting vervalt eveneens, indien een verzoek tot echtscheiding of scheiding van tafel en bed is gedaan dan wel
      een beschikking betreffende een of meer voorlopige voorzieningen van kracht is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel83
  - number: '83.2'
    text: |-
      De plaats van de samenwoning wordt in onderling overleg vastgesteld. Indien een der echtgenoten onder curatele
      staat, of zich omtrent de plaats van samenwoning niet kan of wil verklaren, bepaalt de andere echtgenoot deze.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel83
  - number: '83.3'
    text: |-
      Geschillen omtrent het in het tweede lid bepaalde worden door de rechter in eerste aanleg op verzoek van beiden of
      een van hen beslist.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel83
  - number: '84.1'
    text: |-
      De kosten der huishouding, daaronder begrepen de kosten der verzorging en opvoeding van de kinderen, komen ten
      laste van het gemene inkomen der echtgenoten en, voor zover dit ontoereikend is, ten laste van hun eigen inkomens
      in evenredigheid daarvan; voor zover de inkomens ontoereikend zijn, komen deze kosten ten laste van het gemene
      vermogen en, voor zover ook dit ontoereikend is, ten laste van de eigen vermogens naar evenredigheid daarvan. Een
      en ander geldt niet, voor zover bijzondere omstandigheden zich er tegen verzetten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel84
  - number: '84.2'
    text: |-
      De echtgenoten zijn jegens elkander verplicht dienovereenkomstig tot de bestrijding van de in het eerste
      lid bedoelde uitgaven bij te dragen uit de onder hun bestuur staande goederen, voor zover niet bijzondere
      omstandigheden zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel84
  - number: '84.3'
    text: Bij huwelijkse voorwaarden kan een van het eerste en het tweede lid afwijkende regeling worden getroffen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel84
  - number: '84.4'
    text: |-
      Geschillen tussen de echtgenoten omtrent de toepassing van het eerste tot en met derde lid, worden door de rechter
      in eerste aanleg op verzoek van beiden of een van hen beslist.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel84
  - number: '84.5'
    text: |-
      Op verzoek van beide of van een der echtgenoten kan de rechter een gegeven beschikking of een bij huwelijkse
      voorwaarden getroffen regeling wijzigen op grond van veranderde omstandigheden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel84
  - number: '84.6'
    text: |-
      Wanneer de echtgenoten niet samenwonen en dit te wijten is aan onredelijk gedrag van een der echtgenoten, treedt
      voor de in het tweede lid omschreven verplichtingen in de plaats de verplichting van die echtgenoot om aan de
      andere echtgenoot een bedrag voor diens levensonderhoud uit te keren, onverminderd beider verplichting om bij te
      dragen in de kosten van verzorging en opvoeding van de kinderen. Bij het vaststellen van de uitkering wordt het
      bestaan van een regeling als bedoeld in het derde lid, mede in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel84
  - number: '85.1'
    text: |-
      De ene echtgenoot is naast de andere voor het geheel aansprakelijk voorde door deze ten behoeve van de gewone gang
      van de huishouding aangegane verbintenissen, met inbegrip van die welke voortvloeien uit de door hem als werkgever
      ten behoeve van de huishouding aangegane arbeidsovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel85
  - number: '85.2'
    text: |-
      De ene echtgenoot is verplicht aan de andere die met hem samenwoont, ten behoeve van de gewone gang van de
      huishouding voldoende gelden ter beschikking te stellen; wonen echtgenoten in onderling overleg niet samen, dan
      is de ene echtgenoot verplicht aan de andere voldoende gelden ter beschikking te stellen ten behoeve van de gewone
      gang van diens huishouding.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel85
  - number: '85.3'
    text: |-
      Hij mag daarbij rekening houden met het bedrag dat de andere echtgenoot uit de onder diens bestuur staande goederen
      voor dit doel dient te bestemmen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel85
  - number: '85.4'
    text: |-
      Geschillen tussen de echtgenoten omtrent een en ander worden door de rechter in eerste aanleg op verzoek van
      beiden of een van hen beslist. Op gelijke wijze als zij is tot stand gekomen, kan bij veranderde omstandigheden een
      gegeven beschikking worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel85
  - number: '86.1'
    text: |-
      De rechter in eerste aanleg kan, wanneer daartoe gegronde redenen bestaan, op verzoek van een echtgenoot bepalen
      dat deze niet aansprakelijk zal zijn voor de door de andere echtgenoot in het vervolg aangegane verbintenissen als
      bedoeld in [artikel 85, eerste lid][ref1]. Wordt een zodanig verzoek toegewezen, dan kan de rechter tevens bepalen
      dat die echtgenoot niet meer verplicht is aan de andere echtgenoot overeenkomstig artikel 85, tweede lid, gelden
      ter beschikking te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel85
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '85'
  - number: '86.2'
    text: |-
      Een overeenkomstig dit artikel gegeven rechterlijke beschikking kan bij veranderde omstandigheden op gelijke wijze
      als zij is tot stand gekomen, worden gewijzigd of opgeheven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel86
  - number: '86.3'
    text: |-
      De beschikking kan aan derden die van haar bestaan onkundig waren, slechts worden tegengeworpen, indien zij
      ingeschreven was in het huwelijksgoederenregister, aangewezen in [artikel 116][ref1], en na de inschrijving
      veertien dagen waren verlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel116
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '116'
        afdeling: '1'
  - number: '86.4'
    text: |-
      In de beschikking kan worden bepaald dat zij bovendien moet worden bekend gemaakt in een of meer door de rechter
      aangewezen dagbladen. In dat geval werkt de beschikking ten nadele van derden die daarvan onkundig waren, ook niet
      vóór deze bekendmaking.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel86
  - number: '88.1'
    text: 'Een echtgenoot behoeft de toestemming van de andere echtgenoot voor de volgende rechtshandelingen:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel88
  - number: 88.1.a
    text: |-
      overeenkomsten strekkende tot vervreemding, bezwaring of ingebruikgeving en rechtshandelingen strekkende tot
      beëindiging van het gebruik van een door de echtgenoten te zamen of door de andere echtgenoot alleen bewoonde
      woning of van zaken die bij een zodanige woning of tot de inboedel daarvan behoren;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel88
  - number: 88.1.b
    text: |-
      giften, met uitzondering van de gebruikelijke, van de niet bovenmatige en van die waarvoor tijdens zijn leven niets
      aan zijn vermogen wordt onttrokken;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel88
  - number: 88.1.c
    text: |-
      overeenkomsten die ertoe strekken dat hij, anders dan in de normale uitoefening van zijn beroep of bedrijf, zich
      als borg of hoofdelijk medeschuldenaar verbindt, zich voor een derde sterk maakt, of zich tot zekerheidstelling
      voor een schuld van de derde verbindt;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel88
  - number: 88.1.d
    text: |-
      overeenkomsten van koop op afbetaling, behalve van zaken welke kennelijk uitsluitend of hoofdzakelijk ten behoeve
      van de normale uitoefening van zijn beroep of bedrijf strekken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel88
  - number: '88.2'
    text: |-
      De echtgenoot behoeft de toestemming niet, indien hij tot het verrichten der rechtshandeling is verplicht op
      grond van de wet of op grond van een voorafgaande rechtshandeling waarvoor die toestemming is verleend of niet
      was vereist.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel88
  - number: '88.3'
    text: |-
      De toestemming moet schriftelijk worden verleend, indien een wettelijk voorschrift voor het verrichten van de
      rechtshandeling een vorm voorschrijft.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel88
  - number: '88.4'
    text: |-
      Toestemming voor een rechtshandeling als bedoeld in het eerste lid, onderdeel c, is niet vereist, indien zij wordt
      verricht door een bestuurder van een naamloze vennootschap of besloten vennootschap, die daarvan alleen of met zijn
      medebestuurders de meerderheid der aandelen houdt en mits zij geschiedt ten behoeve van de normale uitoefening van
      het bedrijf van die vennootschap.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel88
  - number: '88.5'
    text: |-
      Indien de andere echtgenoot door afwezigheid of een andere oorzaak in de onmogelijkheid verkeert zijn wil te
      verklaren of zijn toestemming niet verleent, kan de beslissing van de rechter in eerste aanleg worden ingeroepen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel88
  - number: '89.1'
    text: |-
      Een rechtshandeling die een echtgenoot in strijd met [artikel 88][ref1], heeft verricht, is vernietigbaar; slechts
      de andere echtgenoot kan een beroep op de vernietigingsgrond doen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel88
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '88'
  - number: '89.2'
    text: Het eerste lid geldt niet voor een andere handeling dan een gift, indien de wederpartij te goeder trouw was.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel89
  - number: '89.3'
    text: |-
      Het einde van het huwelijk en scheiding van tafel en bed hebben geen invloed op de bevoegdheid om ter
      vernietiging van een rechtshandeling van een echtgenoot een beroep op de vernietigingsgrond te doen, die
      voordien was ontstaan. Indien de andere echtgenoot dientengevolge schuldenaar uit die rechtshandeling
      wordt, geldt [artikel 51, derde lid, van Boek 3][ref1] voor hem slechts zolang de termijn van
      [artikel 52, eerste lid, van Boek 3][ref2] niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel52
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '52'
  - number: '89.4'
    text: |-
      De verklaring of rechtsvordering tot vernietiging behoeft, in afwijking van de [artikelen 50, eerste lid][ref1], en
      [51, tweede lid, van Boek 3][ref2], niet mede te worden gericht tot de echtgenoot die de handeling heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel51
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0028745
        artikel: '51'
  - number: '89.5'
    text: |-
      De echtgenoot die een beroep op de vernietingsgrond heeft gedaan, kan tevens alle uit de nietigheid voortvloeiende
      rechtsvorderingen instellen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel89
  - number: '90.1'
    text: |-
      Een echtgenoot is bevoegd tot het bestuur van zijn eigen goederen en, volgens de regels van [artikel 97][ref1], tot
      het bestuur van goederen van een gemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel97
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '97'
        afdeling: '2'
  - number: '90.2'
    text: |-
      Het bestuur van een echtgenoot over een goed omvat de uitoefening, met uitsluiting van de andere echtgenoot, van
      de daaraan verbonden bevoegdheden, daaronder begrepen de bevoegdheid tot beschikking en de bevoegdheid om ten
      aanzien van dat goed feitelijke handelingen te verrichten en toe te laten, onverminderd de bevoegdheden tot genot
      en gebruik die de andere echtgenoot overeenkomstig de huwelijksverhouding toekomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel90
  - number: '90.3'
    text: |-
      Tussen de echtgenoot die het hem toekomend bestuur overlaat aan de andere echtgenoot, en deze laatste zijn de
      bepalingen omtrent opdracht van overeenkomstige toepassing, met inachtneming van de aard van de huwelijksverhouding
      en de aard der goederen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel90
  - number: '90.4'
    text: |-
      De echtgenoot die een goed bestuurt, kan als partij naast de andere echtgenoot toetreden tot een rechtshandeling
      die deze laatste met betrekking tot dat goed heeft verricht. De verklaring van toetreding wordt gericht tot hen
      die partij bij de rechtshandeling zijn; [artikel 56 van Boek 3][ref1] is van overeenkomstige toepassing. Is voor
      het verrichten van de rechtshandeling een bepaalde vorm voorgeschreven, dan geldt voor de toetreding hetzelfde
      vereiste. De echtgenoot kan toetreding tot bijkomstige en tot reeds opeisbare rechten en verplichtingen uitsluiten;
      hij wordt geacht zich slechts te hebben verbonden onder eerbiediging van tevoren aan derden verleende rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel56
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '56'
  - number: '91.1'
    text: |-
      Indien een echtgenoot door afwezigheid of een andere oorzaak in de onmogelijkheid verkeert zijn goederen of
      de goederen der gemeenschap te besturen, of in ernstige mate tekortschiet in het bestuur van de goederen der
      gemeenschap, kan de rechter in eerste aanleg op verzoek van de andere echtgenoot aan deze het bestuur over die
      goederen of een deel daarvan met uitsluiting van de eerstgenoemde echtgenoot opdragen. De rechter kan bij de
      opdracht nadere regels stellen omtrent het bestuur en de vertegenwoordiging in de zin van het vierde lid.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel91
  - number: '91.2'
    text: |-
      De [artikelen 86, tweede tot en met vierde lid][ref1], en [90, derde lid][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel90
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '86'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '90'
  - number: '91.3'
    text: |-
      De rechter gelast de oproeping van beide echtgenoten en, zo de in het eerste lid eerstgenoemde echtgenoot een
      vertegenwoordiger heeft aangesteld, ook deze.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel91
  - number: '91.4'
    text: |-
      De echtgenoot aan wie het bestuur over goederen wordt opgedragen, is bevoegd tot vertegenwoordiging van de
      echtgenoot aan wie het wordt onttrokken, bij andere dan bestuurshandelingen met betrekking tot die goederen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel91
  - number: '92.1'
    text: |-
      Is aan een derde niet kenbaar wie van de echtgenoten bevoegd is tot het bestuur over een roerende zaak die geen
      registergoed is, of een recht aan toonder, dan mag hij de echtgenoot die de zaak of het papier aan toonder onder
      zich heeft, bevoegd achten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel92
  - number: '92.2'
    text: |-
      De echtgenoot die ten gevolge van een rechtshandeling van de andere echtgenoot door een derde te goeder trouw in
      het bestuur van een goed is gestoord, verliest het recht tot beëindiging van de stoornis, indien hij zich tegen
      de stoornis niet heeft verzet binnen een redelijke termijn nadat zij te zijner kennis is gekomen. De bevoegdheid
      van de echtgenoot tot beëindiging van de stoornis vervalt eveneens indien de derde hem een redelijke termijn heeft
      gesteld ter uitoefening van die bevoegdheid en hij daarvan geen gebruik heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel92
  - number: '92.3'
    text: |-
      Aan een derde kan niet worden tegengeworpen dat een vordering tot vergoeding welke tijdens het huwelijk is ontstaan
      wegens vermogensverschuiving tussen de echtgenoten onderling of tussen een der echtgenoten en een tussen hen
      bestaande gemeenschap, niet opeisbaar is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel92
  - number: 92a
    text: Deze titel is niet van toepassing op van tafel en bed gescheiden echtgenoten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel92a
  - number: '93'
    text: |-
      Van het ogenblik der voltrekking van het huwelijk bestaat tussen de echtgenoten van rechtswege algehele gemeenschap
      van goederen, voor zover daarvan bij huwelijkse voorwaarden niet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel93
  - number: '94.1'
    text: |-
      De gemeenschap omvat, wat haar baten betreft, alle tegenwoordige en toekomstige goederen der echtgenoten,
      met uitzondering van goederen die de echtgenoten tijdens het bestaan van de gemeenschap hebben verkregen door
      erfopvolging, making of gift. De gemeenschap omvat in geen geval goederen ten aanzien waarvan bij uiterste
      wilsbeschikking van de erflater of bij gift is bepaald dat zij buiten de gemeenschap vallen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel94
  - number: '94.2'
    text: Zij omvat, wat haar lasten betreft, alle schulden van ieder der echtgenoten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel94
  - number: '94.3'
    text: |-
      Goederen en schulden die aan een der echtgenoten op enigerlei bijzondere wijze verknocht zijn, vallen slechts in de
      gemeenschap voor zover die verknochtheid zich hiertegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel94
  - number: '95.1'
    text: |-
      Voor een schuld van een echtgenoot, die in de gemeenschap is gevallen, kunnen zowel de goederen der gemeenschap als
      zijn eigen goederen worden uitgewonnen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel95
  - number: '95.2'
    text: |-
      De echtgenoot uit wiens eigen goederen een schuld der gemeenschap is voldaan, heeft deswege recht op vergoeding uit
      de goederen der gemeenschap.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel95
  - number: '96.1'
    text: |-
      Ook voor een schuld van een echtgenoot, die niet in de gemeenschap is gevallen, kunnen de goederen der gemeenschap
      worden uitgewonnen, tenzij de andere echtgenoot eigen goederen van eerstgenoemde aanwijst, die voldoende verhaal
      bieden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel96
  - number: '96.2'
    text: |-
      De echtgenoot wiens niet in de gemeenschap gevallen schuld uit goederen der gemeenschap is voldaan, is deswege
      gehouden tot vergoeding aan de gemeenschap.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel96
  - number: '97.1'
    text: |-
      Een goed der gemeenschap staat onder het bestuur van de echtgenoot van wiens zijde het in de gemeenschap is
      gevallen, voor zover niet de echtgenoten bij huwelijkse voorwaarden anders zijn overeengekomen of de rechter met
      toepassing van [artikel 91][ref1] anders heeft bepaald. Een goed dat moet worden geacht in de plaats te treden van
      een bepaald ander goed, komt onder het bestuur van de echtgenoot die het vervangen goed bestuurde. Een goed dat
      op naam van een der echtgenoten is gesteld, staat evenwel onder diens bestuur. Elk der echtgenoten is bevoegd tot
      stuiting van verjaring ten behoeve van de gemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel91
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '91'
  - number: '97.2'
    text: |-
      Is een goed der gemeenschap met toestemming, verleend door de echtgenoot onder wiens bestuur het stond, dienstbaar
      aan een beroep of bedrijf van de andere echtgenoot, dan berust het bestuur van dat goed, voor zover het handelingen
      betreft die als normale uitoefening van dat beroep of bedrijf zijn te beschouwen, bij laatstgenoemde echtgenoot en
      voor het overige bij de echtgenoten gezamenlijk. Een verleende toestemming geldt voor de gehele duur van het beroep
      of bedrijf, tenzij de echtgenoten anders overeenkomen, doch de rechter in eerste aanleg kan de dienstbaarheid op
      verzoek van een echtgenoot te allen tijde wegens gegronde redenen beëindigen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel97
  - number: '98'
    text: |-
      De echtgenoten verstrekken elkander desgevraagd inlichtingen over het gevoerde bestuur, alsmede over de stand der
      goederen en schulden van de gemeenschap.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel98
  - number: '99.1'
    text: 'De gemeenschap wordt van rechtswege ontbonden:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel99
  - number: 99.1.a
    text: door het eindigen van het huwelijk;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel99
  - number: 99.1.b
    text: door scheiding van tafel en bed;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel99
  - number: 99.1.c
    text: door een beschikking die de gemeenschap opheft;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel99
  - number: 99.1.d
    text: door opheffing bij latere huwelijkse voorwaarden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel99
  - number: '99.2'
    text: |-
      Te zamen met een verzoek waarvan toewijzing ontbinding tot gevolg zal hebben kan reeds overeenkomstig
      [titel 7 van Boek 3][ref1] een vordering worden ingesteld tot verdeling van de gemeenschap, tot gelasten van de
      wijze van verdeling en tot vaststelling van de verdeling, telkens voor het geval de gemeenschap wordt ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028745
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0028745
  - number: '100.1'
    text: |-
      De echtgenoten hebben een gelijk aandeel in de ontbonden gemeenschap, tenzij anders is bepaald bij huwelijkse
      voorwaarden of bij een overeenkomst die tussen de echtgenoten bij geschrift is gesloten met het oog op de
      aanstaande ontbinding der gemeenschap anders dan door de dood of ten gevolge van opheffing bij huwelijkse
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel100
  - number: '100.2'
    text: |-
      Zij die bij de ontbinding van de gemeenschap schuldeiser zijn, behouden het hun toekomende recht van verhaal op de
      goederen der gemeenschap, zolang deze niet verdeeld zijn.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel100
  - number: '101'
    text: |-
      Na de ontbinding der gemeenschap heeft ieder der echtgenoten de bevoegdheid de te zijnen gebruike strekkende
      kleren en kleinodiën, alsmede zijn beroeps- en bedrijfsmiddelen en de papieren en gedenkstukken tot zijn familie
      behorende, tegen de geschatte prijs over te nemen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel101
  - number: '102'
    text: |-
      Na ontbinding van de gemeenschap blijft ieder der echtgenoten voor het geheel aansprakelijk voor de
      gemeenschapsschulden waarvoor hij voordien aansprakelijk was.Voor andere schulden van de gemeenschap is hij voor de
      helft aansprakelijk; voor dat gedeelte der schuld is hij hoofdelijk met de andere echtgenoot verbonden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel102
  - number: '103.1'
    text: |-
      Ieder der echtgenoten heeft het recht van de gemeenschap afstand te doen; alle daarmede strijdige overeenkomsten
      zijn nietig.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel103
  - number: '103.2'
    text: Het deel der gemeenschap waarvan afstand wordt gedaan, wast aan bij het deel van de andere echtgenoot.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel103
  - number: '103.3'
    text: |-
      De echtgenoot die afstand heeft gedaan, kan uit de gemeenschap niets terugvorderen dan alleen zijn bed met
      bijbehorend beddegoed en de kleren die hij voor zijn persoonlijk gebruik nodig heeft. Hij kan de papieren en
      gedenkstukken, tot zijn familie behorende, tegen de geschatte prijs overnemen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel103
  - number: '103.4'
    text: |-
      Door deze afstand wordt hij ontheven van de aansprakelijkheid en de draagplicht voor schulden der gemeenschap,
      waarvoor hij vóór de ontbinding der gemeenschap niet aansprakelijk was.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel103
  - number: '103.5'
    text: |-
      Hij blijft aansprakelijk voor de schulden der gemeenschap, waarvoor hij vóór de ontbinding der gemeenschap
      aansprakelijk was. Indien hij een schuld waarvoor beide echtgenoten vóór de ontbinding der gemeenschap voor het
      geheel aansprakelijk waren, voor meer dan de helft heeft voldaan, heeft hij voor het meerdere verhaal tegen de
      andere echtgenoot.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel103
  - number: '103.6'
    text: |-
      Indien de andere echtgenoot een schuld der gemeenschap, waarvoor hij vóór de ontbinding der gemeenschap niet
      aansprakelijk was, geheel of ten dele heeft voldaan, heeft hij deswege verhaal tegen de echtgenoot die de afstand
      heeft gedaan. Heeft hij een schuld waarvoor beide echtgenoten vóór de ontbinding der gemeenschap voor het geheel
      aansprakelijk waren, voor meer dan de helft voldaan, dan heeft hij voor het meerdere verhaal tegen de echtgenoot
      die de afstand heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel103
  - number: '104.1'
    text: |-
      De echtgenoot die van het in [artikel 103][ref1] omschreven voorrecht wil gebruik maken, is verplicht binnen drie
      maanden na de ontbinding der gemeenschap een akte van afstand te doen inschrijven in het huwelijksgoederenregister,
      aangewezen in [artikel 116][ref2], op verbeurte van dit voorrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel116
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '103'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '116'
        afdeling: '1'
  - number: '104.2'
    text: |-
      Indien de gemeenschap door de dood van de andere echtgenoot wordt ontbonden, begint de termijn van drie maanden
      te lopen op de dag waarop de echtgenoot die van het voorrecht wil gebruik maken, van dat overlijden kennis heeft
      genomen. Indien de gemeenschap door opheffing of door scheiding van tafel en bed is ontbonden, eindigt de termijn
      drie maanden nadat de beschikking in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel104
  - number: '105.1'
    text: |-
      De erfgenamen van een echtgenoot door wiens overlijden de gemeenschap is ontbonden, of die binnen de in
      [artikel 104][ref1] gestelde termijn is overleden zonder afstand te hebben gedaan, zijn ieder voor hun aandeel
      bevoegd op de in dat artikel omschreven wijze afstand te doen binnen drie maanden nadat zij met het overlijden
      bekend zijn geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel104
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '104'
        afdeling: '3'
  - number: '105.2'
    text: |-
      De aanspraak van de echtgenoot tot terugvordering van zijn bed, beddegoed, en kleren uit de gemeenschap kan niet
      worden overgedragen en gaat ook niet over op zijn erfgenamen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel105
  - number: '106'
    text: |-
      De rechter in eerste aanleg van de zittingsplaats waar de akte van afstand moet worden ingeschreven, kan de voor
      de inschrijving gestelde termijn voor de afloop daarvan een of meer malen op grond van bijzondere omstandigheden
      verlengen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel106
  - number: '107.1'
    text: |-
      De echtgenoot of zijn erfgenaam, die zich de goederen der gemeenschap heeft aangetrokken of goederen daarvan heeft
      weggemaakt of verduisterd, kan geen afstand meer doen. Daden van dagelijks bestuur of tot behoud van de goederen
      brengen dit gevolg niet teweeg.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel107
  - number: '107.2'
    text: |-
      Hij die na gedane afstand goederen der gemeenschap wegmaakt of verduistert, verliest de bevoegdheid
      [artikel 103, vierde lid][ref1], in te roepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel103
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '103'
        afdeling: '3'
  - number: '108.1'
    text: |-
      Afstand van de gemeenschap, door een echtgenoot of een erfgenaam van een echtgenoot gedaan nadat door de
      andere echtgenoot of een of meer van diens erfgenamen afstand werd gedaan, heeft niet de gevolgen, omschreven
      in [artikel 103, tweede en derde lid][ref1], en verplicht hen die tot de gemeenschap gerechtigd zijn, haar te
      vereffenen. De wetsbepalingen betreffende de vereffening van een onder voorrecht van boedelbeschrijving aanvaarde
      nalatenschap zijn zoveel mogelijk van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel103
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '103'
        afdeling: '3'
  - number: '108.2'
    text: |-
      Indien hij die tot vereffening van de gemeenschap gehouden is, na tot het afleggen van de rekening en
      verantwoording te zijn aangemaand, in gebreke blijft aan deze verplichting te voldoen, verliest hij de bevoegdheid
      [artikel 103, vierde lid][ref1], in te roepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel103
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '103'
        afdeling: '3'
  - number: '108.3'
    text: |-
      De termijn van drie maanden, genoemd in [artikel 1062 van Boek 4][ref1], begint met de aanvang van de dag waarop
      hij aan [artikel 104, eerste lid][ref2], heeft voldaan. De rechter in eerste aanleg kan de termijn op zijn verzoek
      op grond van bijzondere omstandigheden verlengen; deze verlenging kan ook na verloop van de termijn nog worden
      verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0028746#Artikel1062
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel104
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0028746
        artikel: '1062'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '104'
        afdeling: '3'
  - number: '109'
    text: |-
      Een echtgenoot kan opheffing van de gemeenschap verzoeken, wanneer de andere echtgenoot op lichtvaardige wijze
      schulden maakt, de goederen der gemeenschap verspilt, handelingen verricht die kennelijk indruisen tegen het
      bestuur van de andere echtgenoot over goederen der gemeenschap, of weigert de nodige inlichtingen te geven omtrent
      de stand van de goederen der gemeenschap en van de daarop verhaalbare schulden en het over die goederen gevoerde
      bestuur.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel109
  - number: '110.1'
    text: |-
      Het verzoek moet in het huwelijksgoederenregister, aangewezen in [artikel 116][ref1], worden ingeschreven, en moet
      openlijk worden bekend gemaakt in een veelgelezen dagblad of in een dagblad, verschijnend in het openbaar lichaam
      waar de tot kennisneming van het verzoek bevoegde rechter zitting houdt. De bekendmaking vermeldt de datum van het
      verzoek en de naam, de voornamen, het beroep en de woonplaats van ieder der echtgenoten. De beschikking mag niet
      worden gegeven binnen een maand nadat de bekendmaking heeft plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel116
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '116'
        afdeling: '1'
  - number: '110.2'
    text: |-
      De echtgenoot die de opheffing van de gemeenschap vraagt, kan tot behoud van zijn recht de maatregelen nemen die in
      het [Wetboek van Burgerlijke Rechtsvordering BES][ref1] nader zijn aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: '111.1'
    text: |-
      De beschikking waarbij het verzoek tot opheffing van de gemeenschap is toegewezen, werkt terug tot de dag waarop
      aan [artikel 110, eerste lid][ref1], is voldaan, vanaf welke dag de echtgenoten worden geacht te zijn gehuwd met
      uitsluiting van gemeenschap van goederen, onder al zodanige bedingen als de beschikking zal hebben vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel110
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '110'
        afdeling: '4'
  - number: '111.2'
    text: |-
      Indien de echtgenoot tegen wie het verzoek is toegewezen, de gemeenschap heeft benadeeld doordat hij na de aanvang
      van het geding of binnen zes maanden daarvóór lichtvaardig schulden heeft gemaakt, goederen der gemeenschap heeft
      verspild, of een rechtshandeling als bedoeld in [artikel 88][ref1] zonder de vereiste toestemming of machtiging
      heeft verricht, is hij gehouden de aangerichte schade aan de gemeenschap te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel88
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '88'
  - number: '111.3'
    text: |-
      Een op het tweede lid gegronde vordering kan niet later worden ingesteld dan drie jaren nadat de beschikking in
      kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel111
  - number: '112.1'
    text: |-
      De opheffing van de gemeenschap moet, om tegen derden die daarvan onkundig waren, te werken, openlijk
      worden bekend gemaakt en, nadat de beschikking in kracht van gewijsde is gegaan, worden ingeschreven in het
      huwelijksgoederenregister, aangewezen in [artikel 116][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel116
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '116'
        afdeling: '1'
  - number: '112.2'
    text: |-
      De bekendmaking geschiedt door plaatsing van een uittreksel van de beschikking in de Staatscourant en
      in een of meer in de beschikking aangewezen dagbladen. Het uittreksel bevat de gegevens, bedoeld in
      [artikel 110, eerste lid][ref1], alsmede de dagtekening van de beschikking en de aanduiding van de rechter in
      eerste aanleg die haar heeft gegeven. De gronden waarop de beschikking berust, mogen in het uittreksel niet worden
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel110
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '110'
        afdeling: '4'
  - number: '113'
    text: |-
      Is de gemeenschap door opheffing ontbonden, dan kunnen de echtgenoten daarna, echter alleen bij huwelijkse
      voorwaarden, wederom een gemeenschap overeenkomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel113
  - number: '114'
    text: |-
      Huwelijkse voorwaarden kunnen zowel door aanstaande echtgenoten vóór het sluiten van het huwelijk als door
      echtgenoten tijdens het huwelijk worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel114
  - number: '115.1'
    text: Huwelijkse voorwaarden moeten op straffe van nietigheid bij notariële akte worden aangegaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel115
  - number: '115.2'
    text: |-
      Een volmacht tot het aangaan van huwelijkse voorwaarden moet schriftelijk worden verleend en moet de in de
      huwelijkse voorwaarden op te nemen bepalingen bevatten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel115
  - number: '116.1'
    text: |-
      Bepalingen in huwelijkse voorwaarden kunnen aan derden die daarvan onkundig waren, slechts worden tegengeworpen,
      indien die bepalingen ingeschreven waren in het openbaar huwelijksgoederenregister, gehouden ter griffie van het
      gerecht in eerste aanleg binnen welks rechtsgebied het huwelijk is voltrokken, of, indien het huwelijk buiten de
      openbare lichamen Bonaire, Sint Eustatius en Saba is aangegaan, ter griffie van de rechtbank te ‘s-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel116
  - number: '116.2'
    text: De wijze van inrichting en raadpleging van het register wordt nader bij algemene maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel116
  - number: '117.1'
    text: |-
      Huwelijkse voorwaarden, vóór het huwelijk gemaakt of gewijzigd, zijn slechts geldig, indien zij wier toestemming
      tot het huwelijk noodzakelijk is, bij de akte hun toestemming tot de huwelijkse voorwaarden of de wijziging hebben
      gegeven; is de toestemming van de rechter in eerste aanleg nodig, dan kan worden volstaan met vasthechting van
      zijn beschikking aan de minuut van de akte. Op het verzoek tot toestemming van de rechter in eerste aanleg is
      [artikel 39, eerste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel39
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '39'
        afdeling: '1'
  - number: '117.2'
    text: |-
      Vóór het huwelijk gemaakte huwelijkse voorwaarden beginnen te werken van het tijdstip der voltrekking van het
      huwelijk; geen ander tijdstip kan daarvoor worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel117
  - number: '118.1'
    text: |-
      Na de huwelijksvoltrekking kunnen huwelijkse voorwaarden slechts gemaakt of gewijzigd worden, wanneer het huwelijk
      ten minste een jaar heeft bestaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel118
  - number: '118.2'
    text: Een echtgenoot die onder curatele staat, kan hiertoe slechts met toestemming van zijn curator overgaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel118
  - number: '119.1'
    text: |-
      Het maken of wijzigen van huwelijkse voorwaarden tijdens het huwelijk behoeft de goedkeuring van de rechter in
      eerste aanleg. Bij het verzoekschrift der echtgenoten wordt een ontwerp van de notariële akte overgelegd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel119
  - number: '119.2'
    text: |-
      De rechter kan, alvorens op het verzoek te beslissen, bevelen dat het in twee door hem aangewezen dagbladen
      wordt bekend gemaakt. In de bekendmaking moeten de door de rechter aangewezen dag en uur worden opgenomen, waarop
      schuldeisers zullen worden gehoord, en moet worden vermeld dat het ontwerp van de akte op de griffie ter inzage
      ligt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel119
  - number: '119.3'
    text: |-
      De goedkeuring wordt geweigerd, indien een redelijke grond voor het maken of wijzigen van de huwelijkse voorwaarden
      ontbreekt, of indien er gevaar voor benadeling van schuldeisers bestaat.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel119
  - number: '119.4'
    text: |-
      Indien de akte niet is verleden binnen drie maanden na het in kracht van gewijsde gaan van de beschikking waarbij
      de goedkeuring is verleend, vervalt deze.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel119
  - number: '120.1'
    text: |-
      Tijdens het huwelijk gemaakte of gewijzigde huwelijkse voorwaarden beginnen te werken op de dag, volgende op die
      waarop de akte is verleden, tenzij in de akte een later tijdstip is aangewezen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel120
  - number: '120.2'
    text: |-
      Bepalingen in deze huwelijkse voorwaarden kunnen aan derden die daarvan onkundig waren, slechts worden
      tegengeworpen, indien zij ten minste veertien dagen in het huwelijksgoederenregister ingeschreven waren.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel120
  - number: '120.3'
    text: |-
      De rechter kan bij de goedkeuring, bedoeld in [artikel 119][ref1], bepalen dat de inschrijving moet worden bekend
      gemaakt in een of meer door hem aangewezen dagbladen en in de Staatscourant. In dat geval werken de ingeschreven
      bepalingen ten nadele van derden diedaarvan onkundig waren, ook niet vóór deze bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel119
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '119'
        afdeling: '1'
  - number: '121.1'
    text: |-
      Partijen kunnen bij huwelijkse voorwaarden afwijken van de regels der wettelijke gemeenschap, mits die voorwaarden
      niet met dwingende wetsbepalingen, de goede zeden, of de openbare orde strijden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel121
  - number: '121.2'
    text: |-
      Zij kunnen niet bepalen dat een hunner tot een groter aandeel in de schulden zal zijn gehouden, dan zijn aandeel in
      de goederen der gemeenschap beloopt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel121
  - number: '121.3'
    text: |-
      Zij kunnen niet afwijken van de rechten die uit het ouderlijk gezag voortspruiten, noch van de rechten die de wet
      aan een langstlevende echtgenoot toekent.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel121
  - number: '122'
    text: |-
      [Titel 7][ref1] is van toepassing, voor zover daarvan niet uitdrukkelijk of door de aard der bedingen, bij de
      huwelijkse voorwaarden gemaakt, is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0028743
  - number: '130'
    text: |-
      Een echtgenoot kan tegen derden zijn aanbreng van bij huwelijkse voorwaarden buiten de gemeenschap gehouden
      goederen, voor wat betreft rechten aan toonder en zaken die geen registergoederen zijn, slechts bewijzen door hun
      vermelding in de akte van huwelijkse voorwaarden of in een door de partijen en de notaris ondertekende, aan de
      minuut van die akte vastgehechte beschrijving. Indien de vermelding van een goed geen afdoende omschrijving daarvan
      biedt, kan aanvullend bewijs door alle middelen worden geleverd; ten aanzien van goederen die een echtgenoot buiten
      diens weten opgekomen waren, kan het bewijs door alle middelen worden geleverd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel130
  - number: '131.1'
    text: |-
      Bestaat tussen de echtgenoten een geschil aan wie van hen beiden een recht aan toonder of een zaak die geen
      registergoed is, toebehoort en kan geen van beiden zijn recht op dit goed bewijzen, dan wordt dat goed als
      gemeenschapsgoed aangemerkt, wanneer tussen hen een gemeenschap bestaat die dit goed kan omvatten; bestaat er geen
      zodanige gemeenschap, dan wordt het goed geacht aan ieder der echtgenoten voor de helft toe te behoren.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel131
  - number: '131.2'
    text: Het vermoeden werkt niet ten nadele van de schuldeisers der echtgenoten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel131
  - number: '146.1'
    text: |-
      Echtgenoten of aanstaande echtgenoten mogen bij huwelijkse voorwaarden aan elkander, of een van beiden aan de
      andere, giften doen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel146
  - number: '146.2'
    text: |-
      Deze giften kunnen tot onderwerp hebben tegenwoordige en bij de akte nauwkeurig omschreven goederen, of de gehele
      of gedeeltelijke nalatenschap; onder een gift van de gedeeltelijke nalatenschap is begrepen de gift van een of meer
      bepaalde goederen uit de nalatenschap.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel146
  - number: '146.3'
    text: |-
      Deze giften kunnen slechts worden herroepen, wanneer de begiftigde in gebreke is de hem bij de gift opgelegde
      verplichtingen na te komen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel146
  - number: '146.4'
    text: Deze giften zijn van waarde zonder uitdrukkelijke aanneming door degene aan wie zij gedaan zijn.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel146
  - number: '146.5'
    text: Zij kunnen plaatshebben onder voorwaarden welker uitvoering van de wil van de schenker afhangt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel146
  - number: '146.6'
    text: |-
      De giften van tegenwoordige en bepaaldelijk omschreven goederen zijn niet onderworpen aan de voorwaarde van
      overleving van de begiftigde, tenzij die voorwaarde uitdrukkelijk mocht zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel146
  - number: '147.1'
    text: |-
      Giften van de gehele of gedeeltelijke nalatenschap zijn slechts in dezelfde gevallen als andere giften in
      huwelijkse voorwaarden herroepelijk.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel147
  - number: '147.2'
    text: |-
      De echtgenoot die zijn gehele of gedeeltelijke nalatenschap heeft weggeschonken, kan over de goederen, in die gift
      begrepen, niet om niet beschikken, behalve over geringe sommen tot beloning of om andere redenen door de rechter
      te beoordelen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel147
  - number: '147.3'
    text: |-
      Een gift van de gehele of gedeeltelijke nalatenschap strekt niet ten voordele van de kinderen of andere
      rechtverkrijgenden van de begiftigde echtgenoot, wanneer deze vóór of gelijktijdig met de schenker mocht
      overlijden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel147
  - number: '148'
    text: |-
      Bij de huwelijkse voorwaarden kunnen ook andere personen dan de echtgenoten aan dezen of aan een dezer
      giften doen, echter alleen van tegenwoordige en bij de akte nauwkeurig omschreven goederen. Op deze giften is
      [artikel 146][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel146
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '146'
        afdeling: '2'
  - number: '149'
    text: 'Het huwelijk eindigt:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel149
  - number: 149.a
    text: door de dood;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel149
  - number: 149.b
    text: |-
      op de dag die in de beschikking, houdende verklaring dat er rechtsvermoeden van overlijden bestaat, genoemd is als
      de dag waarop de vermiste wordt vermoed te zijn overleden, ook indien bewezen wordt dat de vermiste op die dag nog
      in leven was;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel149
  - number: 149.c
    text: |-
      door echtscheiding, overeenkomstig de bepalingen van [afdeling 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Afdeling2
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0028743
        afdeling: '2'
  - number: 149.d
    text: |-
      door ontbinding van het huwelijk na scheiding van tafel en bed, overeenkomstig [titel 10, afdeling 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Afdeling2
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0028743
        afdeling: '2'
  - number: '150.1'
    text: |-
      Echtscheiding tussen echtgenoten die niet van tafel en bed gescheiden zijn, wordt uitgesproken op verzoek van één
      der echtgenoten of op hun gemeenschappelijk verzoek.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel150
  - number: '150.2'
    text: |-
      Indien uit het huwelijk een of meer kinderen zijn geboren, die nog minderjarig zijn, kan echtscheiding op verzoek
      van één der echtgenoten niet worden uitgesproken tegen de wil van de andere echtgenoot, tenzij de echtgenoten ten
      minste drie jaren onafgebroken duurzaam gescheiden hebben geleefd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel150
  - number: '150.3'
    text: |-
      De termijn van drie jaren kan door de rechter worden bekort, indien de andere achtgenoot zich heeft schuldig
      gemaakt aan wangedrag in zodanige mate dat van de echtgenoot, die het verzoek heeft gedaan, niet kan worden gevergd
      het huwelijk te doen voortbestaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel150
  - number: '151'
    text: Echtscheiding wordt op verzoek van één der echtgenoten uitgesproken, indien het huwelijk duurzaam ontwricht is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel151
  - number: '153.1'
    text: |-
      Indien als gevolg van de verzochte echtscheiding een bestaand vooruitzicht op uitkeringen aan de andere echtgenoot
      na vooroverlijden van de echtgenoot die het verzoek heeft gedaan, zou teloorgaan of in ernstige mate zou
      verminderen, en de andere echtgenoot deswege tegen dat verzoek verweer voert, kan deze niet worden toegewezen
      voordat daaromtrent een voorziening is getroffen die, gelet op de omstandigheden van het geval, ten opzichte van
      beide echtgenoten billijk is te achten. De rechter kan daartoe een termijn stellen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel153
  - number: '153.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel153
  - number: 153.2.a
    text: |-
      indien redelijkerwijs te verwachten is dat de andere echtgenoot zelf voor dat geval voldoende voorzieningen kan
      treffen;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel153
  - number: 153.2.b
    text: indien de duurzame ontwrichting van het huwelijk in overwegende mate te wijten is aan de andere echtgenoot.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel153
  - number: '154.1'
    text: |-
      Echtscheiding wordt op gemeenschappelijk verzoek van de echtgenoten uitgesproken indien het verzoek is gegrond op
      hun beider oordeel dat het huwelijk duurzaam ontwricht is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel154
  - number: '154.2'
    text: Ieder der echtgenoten is tot op het tijdstip der uitspraak bevoegd het verzoek in te trekken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel154
  - number: '157.1'
    text: |-
      De rechter kan bij de echtscheidingsbeschikking of bij latere uitspraak aan de echtgenoot die niet voldoende
      inkomsten tot zijn levensonderhoud heeft, noch zich in redelijkheid kan verwerven, op diens verzoek ten laste van
      de andere echtgenoot een uitkering tot levensonderhoud toekennen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel157
  - number: '157.2'
    text: |-
      Bij de vaststelling van de uitkering kan de rechter rekening houden met de behoefte aan een voorziening in het
      levensonderhoud voor het geval van overlijden van degene die tot de uitkering is gehouden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel157
  - number: '157.3'
    text: |-
      De rechter kan op verzoek van één van de echtgenoten de uitkering toekennen onder vaststelling van voorwaarden en
      van een termijn. Deze vaststelling kan niet ten gevolge hebben dat de uitkering later eindigt dan 12 jaar na de
      datum van inschrijving van de beschikking in de registers van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel157
  - number: '157.4'
    text: |-
      Indien de rechter geen termijn heeft vastgesteld, eindigt de verplichting tot levensonderhoud van rechtswege na
      het verstrijken van een termijn van 12 jaar, die aanvangt op de datum van inschrijving van de beschikking in de
      registers van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel157
  - number: '157.5'
    text: |-
      Indien de beëindiging van de uitkering ten gevolge van het verstrijken van de in het vierde lid bedoelde termijn
      van zo ingrijpende aard is dat ongewijzigde handhaving van die termijn naar maatstaven van redelijkheid en
      billijkheid van degene die tot de uitkering gerechtigd is, niet kan worden gevergd, kan de rechter op diens
      verzoek alsnog een termijn vaststellen. Het verzoek daartoe dient te worden ingediend voordat drie maanden sinds de
      beëindiging zijn verstreken. De rechter bepaalt bij de uitspraak of verlenging van de termijn na ommekomst daarvan
      al dan niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel157
  - number: '157.6'
    text: |-
      Indien de duur van het huwelijk niet meer bedraagt dan vijf jaar en uit dit huwelijk geen kinderen zijn geboren,
      eindigt de verplichting tot levensonderhoud van rechtswege na het verstrijken van een termijn die gelijk is aan
      de duur van het huwelijk en die aanvangt op de datum van inschrijving van de beschikking in de registers van de
      burgerlijke stand. Indien de rechter een termijn vaststelt, kan deze vaststelling niet ten gevolge hebben dat
      de uitkering op een later tijdstip eindigt dan ingevolge de vorige zin het geval zou zijn. Het vijfde lid is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel157
  - number: '158'
    text: |-
      Vóór of na de beschikking tot echtscheiding kunnen de echtgenoten bij overeenkomst bepalen of, en zo ja tot
      welk bedrag, na de echtscheiding de één tegenover de ander tot een uitkering tot diens levensonderhoud zal zijn
      gehouden. Indien in de overeenkomst geen termijn is opgenomen, is [artikel 157, vierde tot en met zesde lid][ref1],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel157
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '157'
        afdeling: '2'
  - number: '159.1'
    text: |-
      Bij de overeenkomst kan worden bedongen dat zij niet bij rechterlijke uitspraak zal kunnen worden gewijzigd op
      grond van een wijziging van omstandigheden. Een zodanig beding kan slechts schriftelijk worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel159
  - number: '159.2'
    text: |-
      Het beding vervalt, indien de overeenkomst is aangegaan vóór de indiening van het verzoek tot echtscheiding, tenzij
      dit binnen drie maanden na de overeenkomst is ingediend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel159
  - number: '159.3'
    text: |-
      Ondanks een zodanig beding kan op verzoek van een der partijen de overeenkomst door de rechter bij de
      echtscheidingsbeschikking of bij latere beschikking worden gewijzigd op grond van een zo ingrijpende wijziging
      van omstandigheden dat de verzoeker naar maatstaven van redelijkheid en billijkheid niet langer aan het beding mag
      worden gehouden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel159
  - number: '160'
    text: |-
      Een verplichting van een gewezen echtgenoot om uit hoofde van echtscheiding levensonderhoud te verschaffen aan de
      wederpartij, eindigt wanneer deze opnieuw in het huwelijk treedt dan wel is gaan samenleven met een ander als waren
      zij gehuwd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel160
  - number: '163.1'
    text: De echtscheiding komt tot stand door de inschrijving van de beschikking in de registers van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel163
  - number: '163.2'
    text: De inschrijving geschiedt op verzoek van partijen of van één van hen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel163
  - number: '163.3'
    text: |-
      Indien het verzoek tot inschrijving niet is gedaan uiterlijk zes maanden na de dag waarop de beschikking in kracht
      van gewijsde is gegaan, verliest de beschikking haar kracht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel163
  - number: '164.1'
    text: |-
      Indien een tussen de echtgenoten bestaande gemeenschap van goederen door één van hen is benadeeld doordat hij na de
      aanvang van het geding of binnen zes maanden daarvóór lichtvaardig schulden heeft gemaakt, goederen der gemeenschap
      heeft verspild, of rechtshandelingen als bedoeld in [artikel 88][ref1] zonder de vereiste toestemming of machtiging
      heeft verricht, is hij gehouden na de inschrijving van de beschikking waarbij de echtscheiding is uitgesproken, de
      aangerichte schade aan de gemeenschap te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel88
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '88'
  - number: '164.2'
    text: |-
      Een op het eerste lid gegronde rechtsvordering kan niet later worden ingesteld dan drie jaren na de inschrijving
      van de beschikking.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel164
  - number: '165.1'
    text: |-
      Op verzoek van een echtgenoot kan de rechter bij de echtscheidingsbeschikking of bij latere uitspraak bepalen
      dat, als die echtgenoot ten tijde van de inschrijving van de beschikking een woning bewoont die aan de andere
      echtgenoot uitsluitend of mede toebehoort of ten gebruike toekomt, hij jegens de andere echtgenoot bevoegd is de
      bewoning en het gebruik van de bij de woning en tot de inboedel daarvan behorende zaken gedurende zes maanden na de
      inschrijving van de beschikking tegen een redelijke vergoeding voort te zetten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel165
  - number: '165.2'
    text: |-
      Tegen hem kan een in dat tijdvak zonder zijn toestemming door de andere echtgenoot verrichte rechtshandeling niet
      worden tegengeworpen ten nadele van zijn in het eerste lid omschreven bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel165
  - number: '165.3'
    text: |-
      Weigert hij zijn toestemming of is hij niet in staat zijn wil te verklaren, dan kan de rechter die in eerste aanleg
      over het verzoek tot echtscheiding heeft beslist, op verzoek van de andere gewezen echtgenoot bepalen dat het
      tweede lid buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel165
  - number: '166'
    text: |-
      Indien de gescheiden echtgenoten met elkander hertrouwen, herleven alle gevolgen van het huwelijk van rechtswege,
      alsof er geen echtscheiding had plaats gehad. Nochtans wordt de geldigheid van rechtshandelingen die tussen de
      ontbinding van het huwelijk en het nieuwe huwelijk zijn verricht, beoordeeld naar het tijdstip der handeling. Op
      het maken of wijzigen van huwelijkse voorwaarden vóór het aangaan van het nieuwe huwelijk vindt [artikel 119][ref1]
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel119
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '119'
        afdeling: '1'
  - number: '168'
    text: Door scheiding van tafel en bed wordt de verplichting der echtgenoten tot samenwoning opgeheven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel168
  - number: '169.1'
    text: Scheiding van tafel en bed kan worden verzocht op dezelfde grond en op dezelfde wijze als echtscheiding.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel169
  - number: '169.2'
    text: |-
      De [artikelen 151][ref1] en [154 tot en met 159][ref2] zijn van overeenkomstige toepassing, met dien verstande dat
      de in [artikel 157, derde tot en met zesde lid][ref3], bedoelde termijnen aanvangen op de dag waarop de beschikking
      tot scheiding van tafel en bed is ingeschreven in het huwelijksgoederenregister, en dat de duur van het huwelijk
      wordt berekend tot die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel151
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel154
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel157
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '151'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '154'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0028743
        artikel: '157'
        afdeling: '2'
  - number: '169.3'
    text: |-
      Een verplichting van een echtgenoot om uit hoofde van scheiding van tafel en bed levensonderhoud te verschaffen aan
      de andere echtgenoot, eindigt bij ontbinding van het huwelijk.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel169
  - number: '173.1'
    text: |-
      De scheiding van tafel en bed komt tot stand door inschrijving van de beschikking in het huwelijksgoederenregister,
      aangewezen in [artikel 116][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel116
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '116'
        afdeling: '1'
  - number: '173.2'
    text: De inschrijving geschiedt op verzoek van partijen of van één van hen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel173
  - number: '173.3'
    text: |-
      Indien het verzoek tot inschrijving niet is gedaan uiterlijk zes maanden na de dag waarop de beschikking in kracht
      van gewijsde is gegaan, verliest de beschikking haar kracht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel173
  - number: '174.1'
    text: |-
      Indien een tussen de echtgenoten bestaande gemeenschap van goederen door één van hen is benadeeld doordat hij
      na de aanvang van het geding of binnen zes maanden daarvóór lichtvaardig schulden heeft gemaakt, goederen der
      gemeenschap heeft verspild, of rechtshandelingen als bedoeld in [artikel 88][ref1] zonder de vereiste toestemming
      of machtiging heeft verricht, is hij gehouden, nadat de beschikking van scheiding van tafel en bed is ingeschreven,
      de aangerichte schade aan de gemeenschap te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel88
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '88'
  - number: '174.2'
    text: |-
      Een op het eerste lid gegronde rechtsvordering kan niet later worden ingesteld dan drie jaren nadat de beschikking
      van scheiding van tafel en bed is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel174
  - number: '175.1'
    text: |-
      Op verzoek van een echtgenoot kan de rechter bij de beschikking houdende scheiding van tafel en bed of bij latere
      uitspraak bepalen dat, als die echtgenoot op het ogenblik dat de beschikking is ingeschreven een woning bewoont die
      aan de andere echtgenoot uitsluitend of mede toebehoort of ten gebruike toekomt, hij jegens de andere echtgenoot
      bevoegd is de bewoning en het gebruik van de bij de woning en tot de inboedel daarvan behorende zaken gedurende zes
      maanden nadat de beschikking is ingeschreven, tegen een redelijke vergoeding voort te zetten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel175
  - number: '175.2'
    text: |-
      Tegen hem kan een in dat tijdvak zonder zijn toestemming door de andere echtgenoot verrichte rechtshandeling niet
      worden tegengeworpen ten nadele van zijn in het eerste lid omschreven bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel175
  - number: '175.3'
    text: |-
      Weigert hij zijn toestemming of is hij niet in staat zijn wil te verklaren, dan kan de rechter die in eerste aanleg
      over het verzoek tot scheiding van tafel en bed heeft beslist, op verzoek van de andere echtgenoot bepalen dat het
      tweede lid buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel175
  - number: '176'
    text: |-
      Een scheiding van tafel en bed eindigt van rechtswege door de verzoening van de echtgenoten; deze doet alle
      gevolgen van het huwelijk herleven alsof er geen scheiding van tafel en bed had plaats gehad. Nochtans wordt
      de geldigheid van rechtshandelingen die tussen de scheiding en de verzoening zijn verricht, beoordeeld naar het
      tijdstip der handeling.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel176
  - number: '177.1'
    text: |-
      De verzoening komt tot stand door de inschrijving daarvan in het huwelijksgoederenregister, aangewezen in
      [artikel 116][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel116
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel177
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '116'
        afdeling: '1'
  - number: '177.2'
    text: De inschrijving geschiedt op gemeenschappelijk verzoek van partijen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel177
  - number: '179.1'
    text: |-
      Ontbinding van het huwelijk van echtgenoten die van tafel en bed gescheiden zijn, wordt op verzoek van een der
      echtgenoten uitgesproken, indien de scheiding ten minste drie jaren heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel179
  - number: '179.2'
    text: |-
      De termijn van drie jaren kan op verzoek van een echtgenoot worden b mate dat van de echtgenoot, die het verzoek
      heeft gedaan, niet kan worden gevergd het huwelijk te doen voortbestaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel179
  - number: '180.1'
    text: |-
      Indien als gevolg van de gevraagde ontbinding van het huwelijk een bestaand vooruitzicht op uitkeringen aan
      de andere echtgenoot na vooroverlijden van de echtgenoot die het verzoek heeft ingediend, zou teloorgaan of in
      ernstige mate zou verminderen, en de andere echtgenoot deswege tegen het verzoek verweer voert, kan het verzoek
      niet worden toegewezen voordat daaromtrent een voorziening is getroffen die, gelet op de omstandigheden van het
      geval, ten opzichte van beide echtgenoten billijk is te achten. De rechter kan daartoe een termijn stellen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel180
  - number: '180.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel180
  - number: 180.2.a
    text: |-
      indien redelijkerwijs te verwachten is dat de andere echtgenoot zelf voor dat geval voldoende voorzieningen kan
      treffen;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel180
  - number: 180.2.b
    text: |-
      indien de andere echtgenoot zich gedurig schuldig maakt aan wangedrag in zodanige mate dat van de echtgenoot die
      het verzoek heeft gedaan, naar redelijkheid generlei verstrekking van levensonderhoud zou kunnen worden gevergd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel180
  - number: '181'
    text: |-
      Ontbinding van het huwelijk van echtgenoten die van tafel en bed gescheiden zijn, wordt op hun gemeenschappelijk
      verzoek uitgesproken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel181
  - number: '182'
    text: |-
      De [artikelen 154, tweede lid][ref1], en [157 tot en met 160][ref2] zijn van overeenkomstige toepassing, met dien
      verstande dat de in [artikel 157, derde tot en met zesde lid][ref3], bedoelde termijnen worden verminderd met de
      tijd gedurende welke tijdens de scheiding van tafel en bed een verplichting tot levensonderhoud jegens de andere
      echtgenoot bestond en dat de duur van het huwelijk wordt berekend tot de dag waarop de beschikking tot scheiding
      van tafel en bed is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel154
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel157
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel157
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '154'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '157'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0028743
        artikel: '157'
        afdeling: '2'
  - number: '183.1'
    text: |-
      De ontbinding van het huwelijk komt tot stand door de inschrijving van de beschikking in de registers van de
      burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel183
  - number: '183.2'
    text: |-
      De [artikelen 163, tweede en derde lid][ref1], en [166][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel166
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '163'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '166'
        afdeling: '2'
  - number: '197'
    text: Een kind, zijn ouders en hun bloedverwanten staan in familierechtelijke betrekking tot elkaar.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel197
  - number: '198'
    text: Moeder van een kind is de vrouw uit wie het kind is geboren of die het kind heeft geadopteerd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel198
  - number: '199'
    text: 'Vader van een kind is de man:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel199
  - number: 199.a
    text: |-
      die op het tijdstip van de geboorte van het kind met de vrouw uit wie het kind is geboren, is gehuwd, tenzij
      onderdeel b geldt;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel199
  - number: 199.b
    text: |-
      wiens huwelijk met de vrouw uit wie het kind is geboren, binnen 306 dagen voor de geboorte van het kind door
      zijn dood is ontbonden, zelfs indien de moeder was hertrouwd; indien echter de vrouw sedert de 306de dag voor de
      geboorte van het kind was gescheiden van tafel en bed of zij en haar echtgenoot sedert dat tijdstip gescheiden
      hebben geleefd, kan de vrouw binnen een jaar na de geboorte van het kind ten overstaan van de ambtenaar van de
      burgerlijke stand verklaren dat haar overleden echtgenoot niet de vader is van het kind, van welke verklaring
      een akte wordt opgemaakt; was de moeder op het tijdstip van de geboorte hertrouwd dan is in dat geval de huidige
      echtgenoot de vader van het kind;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel199
  - number: 199.c
    text: die het kind heeft erkend;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel199
  - number: 199.d
    text: ten aanzien van wie ten behoeve van het kind brieven van vaderschap zijn verleend; of
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel199
  - number: 199.e
    text: die het kind heeft geadopteerd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel199
  - number: 199a
    text: |-
      De in deze titel gestelde termijnen kunnen door de rechter buiten toepassing worden gelaten voor zover toepassing
      in de gegeven omstandigheden naar maatstaven van redelijkheid en billijkheid onaanvaardbaar zou zijn.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel199a
  - number: 199b
    text: Een ieder heeft het recht om voor zover mogelijk te weten van welke biologische ouders men afstamt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel199b
  - number: '200.1'
    text: |-
      Het in [artikel 199, onderdeel a en b][ref1], bedoelde vaderschap kan, op de grond dat de man niet de biologische
      vader van het kind is, worden ontkend:


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel199
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '199'
        afdeling: '1'
  - number: 200.1.a
    text: door de vader of de moeder van het kind;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel200
  - number: 200.1.b
    text: door het kind zelf.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel200
  - number: '200.2'
    text: |-
      De vader of moeder kunnen het in [artikel 199, onder a en b][ref1], bedoelde vaderschap niet ontkennen, indien de
      man voor het huwelijk heeft kennis gedragen van de zwangerschap.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel199
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '199'
        afdeling: '1'
  - number: '200.3'
    text: |-
      De vader of moeder kunnen het in [artikel 199, onder a en b][ref1], bedoelde vaderschap evenmin ontkennen, indien
      de man heeft ingestemd met een daad die de verwekking van het kind tot gevolg kan hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel199
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '199'
        afdeling: '1'
  - number: '200.4'
    text: |-
      Het tweede en derde lid zijn niet van toepassing ten aanzien van de vader, indien de moeder hem heeft bedrogen
      omtrent de verwekker.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel200
  - number: '200.5'
    text: |-
      Het verzoek tot gegrondverklaring van de ontkenning wordt door de moeder bij het gerecht in eerste aanleg ingediend
      binnen een jaar na de geboorte van het kind. Een zodanig verzoek wordt door de vader ingediend binnen een jaar
      nadat hij bekend is geworden met het feit dat hij vermoedelijk niet de biologische vader is van het kind.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel200
  - number: '200.6'
    text: |-
      Het verzoek tot gegrondverklaring van de ontkenning wordt door het kind bij het gerecht in eerste aanleg ingediend
      binnen vijf jaren nadat het kind bekend is geworden met het vermoeden dat de man niet zijn biologische vader is.
      Indien het kind evenwel gedurende zijn minderjarigheid bekend is geworden met dit vermoeden, kan het verzoek tot
      uiterlijk vijf jaren nadat het kind meerderjarig is geworden, worden ingediend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel200
  - number: '201.1'
    text: |-
      Overlijdt de vader of de moeder voor de afloop van de in [artikel 200, vijfde lid][ref1], gestelde termijn, dan kan
      een afstammeling van deze echtgenoot in de eerste graad of, bij gebreke van zodanige afstammeling, een ouder van
      deze echtgenoot, het gerecht in eerste aanleg verzoeken de ontkenning van het vaderschap gegrond te verklaren. Het
      verzoek wordt gedaan binnen een jaar na de dag van overlijden of nadat het overlijden ter kennis van de verzoeker
      is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel200
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '200'
        afdeling: '2'
  - number: '201.2'
    text: |-
      Overlijdt het kind voor de afloop van de in [artikel 200, zesde lid][ref1], gestelde termijn, dan kan een
      afstammeling in de eerste graad van het kind het gerecht in eerste aanleg verzoeken de ontkenning van het
      vaderschap gegrond te verklaren. Indien het kind meerderjarig was ten tijde van het overlijden, wordt het verzoek
      gedaan binnen een jaar na de dag van overlijden of binnen een jaar nadat het overlijden ter kennis van de verzoeker
      is gekomen. Overleed het kind gedurende de minderjarigheid, dan dient het verzoek te worden gedaan binnen een jaar
      nadat het kind, in leven zijnde, zelfstandig het verzoek had kunnen doen, dan wel, indien het overlijden op een
      later tijdstip ter kennis is gekomen van de verzoeker, binnen een jaar na die kennisneming.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel200
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '200'
        afdeling: '2'
  - number: '202.1'
    text: |-
      Nadat de beschikking houdende gegrondverklaring van een ontkenning van een door huwelijk ontstaan vaderschap in
      kracht van gewijsde is gegaan, wordt het door huwelijk ontstane vaderschap geacht nimmer gevolg te hebben gehad.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel202
  - number: '202.2'
    text: Te goeder trouw door derden verkregen rechten worden hierdoor nochtans niet geschaad.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel202
  - number: '202.3'
    text: |-
      Door de gegrondverklaring van de ontkenning ontstaat geen vordering tot teruggave van kosten van verzorging en
      opvoeding of van kosten van levensonderhoud en studie noch tot teruggave van het krachtens vruchtgenot genotene.
      Voorts ontstaat geen verplichting tot teruggave van genoten vermogensrechtelijke voordelen, voor zover degene die
      hen heeft genoten ten tijde van het doen van het verzoek daardoor niet was gebaat.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel202
  - number: '203.1'
    text: 'Erkenning van een kind dat geen vader heeft kan geschieden:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel203
  - number: 203.1.a
    text: bij een akte van erkenning, opgemaakt door een ambtenaar van de burgerlijke stand;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel203
  - number: 203.1.b
    text: bij elke notariële akte.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel203
  - number: '203.2'
    text: De erkenning heeft gevolg vanaf het tijdstip waarop zij is gedaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel203
  - number: '204.1'
    text: 'De erkenning is nietig, indien zij is gedaan:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel204
  - number: 204.1.a
    text: |-
      door een man die krachtens [artikel 41][ref1] geen huwelijk met de moeder mag sluiten;


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel41
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel204
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '41'
        afdeling: '1'
  - number: 204.1.b
    text: door een minderjarige die de leeftijd van zestien jaren nog niet heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel204
  - number: 204.1.c
    text: |-
      indien het kind de leeftijd van zestien jaar nog niet heeft bereikt, zonder voorafgaande schriftelijke toestemming
      van de moeder;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel204
  - number: 204.1.d
    text: zonder voorafgaande schriftelijke toestemming van het kind van twaalf jaren of ouder;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel204
  - number: 204.1.e
    text: |-
      Na het verstrijken van de wettelijke termijn van aangifte van de geboorte van het kind, tenzij aannemelijk is dat
      de man de biologische vader van het kind is of dat tussen de man en het kind een nauwe persoonlijke betrekking
      is ontstaan;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel204
  - number: 204.1.f
    text: |-
      door een man tussen wie en het kind een leeftijdsverschil van minder dan zestien jaren bestaat, tenzij aannemelijk
      is dat de man de biologische vader van het kind is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel204
  - number: '204.2'
    text: |-
      De in het vorige lid onder c en d vereiste toestemming kan ook geschieden ter gelegenheid van het opmaken van de
      akte van erkenning.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel204
  - number: '204.3'
    text: |-
      De toestemming van de moeder wier kind de leeftijd van zestien jaren nog niet heeft bereikt, dan wel de toestemming
      van het kind van twaalf jaren of ouder, kan op verzoek van de man die het kind wil erkennen, door de toestemming
      van het gerecht in eerste aanleg worden vervangen, indien de erkenning de belangen van de moeder bij een
      ongestoorde verhouding met het kind of de belangen van het kind niet zou schaden, en de man de verwekker is van
      het kind.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel204
  - number: '205.1'
    text: |-
      Een verzoek tot vernietiging van de erkenning kan, op de grond dat de erkenner niet de biologische vader van het
      kind is, bij het gerecht in eerste aanleg worden ingediend:
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel205
  - number: 205.1.a
    text: door het kind zelf, tenzij de erkenning tijdens zijn meerderjarigheid heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel205
  - number: 205.1.b
    text: |-
      door de erkenner, indien hij door bedreiging, dwaling, bedrog of, tijdens zijn minderjarigheid, door misbruik van
      omstandigheden daartoe is bewogen;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel205
  - number: 205.1.c
    text: |-
      door de moeder, indien zij door bedreiging, dwaling, bedrog, of tijdens haar minderjarigheid, door misbruik van
      omstandigheden bewogen is toestemming tot de erkenning te geven.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel205
  - number: '205.2'
    text: |-
      Het openbaar ministerie kan wegens strijd met de Nederlandse openbare orde, indien de erkenner niet de biologische
      vader van het kind is, vernietiging van de erkenning vorderen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel205
  - number: '205.3'
    text: |-
      In geval van bedreiging of misbruik van omstandigheden, wordt het verzoek door de erkenner of door de moeder niet
      later ingediend dan een jaar nadat deze invloed heeft opgehouden te werken en, in geval van bedrog of dwaling,
      binnen een jaar nadat de verzoeker het bedrog of de dwaling heeft ontdekt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel205
  - number: '205.4'
    text: |-
      Het verzoek wordt door het kind ingediend binnen vijf jaren nadat het kind bekend is geworden met het vermoeden dat
      de man niet zijn biologische vader is. Indien het kind evenwel gedurende zijn minderjarigheid bekend is geworden
      met dit vermoeden, kan het verzoek tot uiterlijk vijf jaren nadat het kind meerderjarig is geworden, worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel205
  - number: '205.5'
    text: |-
      Voor het geval de erkenner of de moeder overlijdt voor de afloop van de in het derde lid gestelde termijn, is
      [artikel 201, eerste lid][ref1], van overeenkomstige toepassing. Voor het geval het kind overlijdt voor de afloop
      van de in het vierde lid gestelde termijn, is [artikel 201, tweede lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel201
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel201
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel205
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '201'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '201'
        afdeling: '2'
  - number: '206.1'
    text: |-
      Nadat de beschikking houdende vernietiging van de erkenning in kracht van gewijsde is gegaan, wordt de erkenning
      geacht nimmer gevolg te hebben gehad.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel206
  - number: '206.2'
    text: Te goeder trouw door derden verkregen rechten worden hierdoor nochtans niet geschaad.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel206
  - number: '206.3'
    text: |-
      Door de vernietiging ontstaat geen vordering tot teruggave van de kosten van verzorging en opvoeding of van
      levensonderhoud en studie noch tot teruggave van het krachtens vruchtgenot genotene.Voorts ontstaat geen
      verplichting tot teruggave van genoten vermogensrechtelijke voordelen die uit de erkenning zijn voortgevloeid, voor
      zover degene die hen heeft genoten ten tijde van het instellen van het verzoek daardoor niet was gebaat.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel206
  - number: '207.1'
    text: |-
      Indien de man die, kennis dragende van de zwangerschap van de moeder, voornemens was het kind te erkennen of vóór
      de geboorte met de moeder te huwen, vóór of kort na de geboorte van het kind is overleden zonder het te hebben
      erkend, kunnen aan de Minister van Justitie brieven van vaderschap worden ver- zocht. Het verzoek kan zowel door de
      moeder als door het kind worden gedaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel207
  - number: '207.2'
    text: |-
      De vaststelling van het vaderschap, vervat in de brieven van vaderschap, werkt terug tot het moment van de geboorte
      van het kind. Te goeder trouw door derden verkregen rechten worden hierdoor nochtans niet geschaad. Voorts ontstaat
      geen verplichting tot teruggave van vermogensrechtelijke voordelen, voor zover degene die hen heeft genoten ten
      tijde van het doen van het verzoek daardoor niet was gebaat.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel207
  - number: '208'
    text: |-
      Over het verzoek om brieven van vaderschap wint de Minister van Justitie het advies in van het Gemeenschappelijk
      Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba. Dit hoort, zo mogelijk,
      bloedverwanten van de man en van de moeder of doet hen horen; het kan ook bevelen dat het verzoek in door hem aan
      te wijzen dagbladen wordt bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel208
  - number: '209'
    text: |-
      Iemands afstamming volgens zijn geboorteakte kan door een ander niet worden betwist, indien hij een staat
      overeenkomstig die akte heeft.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel209
  - number: '210'
    text: Een verzoek tot gegrondverklaring van de inroeping of betwisting van staat is niet aan verjaring onderworpen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel210
  - number: '211.1'
    text: 'Een verzoek tot gegrondverklaring van de inroeping van staat kan worden ingediend:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel211
  - number: 211.1.a
    text: door het kind zelf;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel211
  - number: 211.1.b
    text: |-
      door de erfgenamen van het kind, indien het kind gedurende zijn minderjarigheid of binnen drie jaren nadien is
      overleden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel211
  - number: '211.2'
    text: |-
      Indien het kind een verzoek als bedoeld in het eerste lid had ingediend, kunnen zijn erfgenamen de procedure
      voortzetten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel211
  - number: '212'
    text: |-
      In zaken van afstamming wordt het minderjarige kind, optredende als verzoeker of belanghebbende, vertegenwoordigd
      door een bijzondere curator daartoe benoemd door het gerecht in eerste aanleg dat over de zaak beslist. Ook de
      voogdijraad kan tot bijzondere curator worden benoemd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel212
  - number: '227.1'
    text: |-
      Adoptie geschiedt door een uitspraak van het gerecht in eerste aanleg op verzoek van twee personen van verschillend
      geslacht tezamen of op verzoek van één persoon alleen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel227
  - number: '227.2'
    text: |-
      Het verzoek door twee personen tezamen kan slechts worden gedaan, indien zij ten minste drie aaneengesloten jaren
      onmiddellijk voorafgaande aan de indiening van het verzoek met elkaar hebben samengeleefd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel227
  - number: '227.3'
    text: |-
      Het verzoek kan alleen worden toegewezen, indien de adoptie in het kennelijk belang is van het kind, vaststaat dat
      het kind niets meer van zijn ouder of ouders te verwachten heeft, en aan de voorwaarden door [artikel 228][ref1]
      gesteld, wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel228
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '228'
        afdeling: '1'
  - number: '227.4'
    text: |-
      Zijn de voornamen van het kind niet bekend, dan stelt de rechter, nadat hij de adoptant of adoptanten en het kind,
      indien dat twaalf jaren of ouder is, heeft gehoord, bij de adoptiebeschikking tevens een of meer voornamen vast.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel227
  - number: '227.5'
    text: In zaken van adoptie is de minderjarige ouder bekwaam in rechte op te treden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel227
  - number: '228.1'
    text: 'Voorwaarden voor adoptie zijn:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel228
  - number: 228.1.a
    text: |-
      dat het kind op de dag van het verzoek minderjarig is, en dat het kind, indien het op de dag van het verzoek twaalf
      jaren of ouder is, ter gelegenheid van zijn verhoor niet van bezwaren tegen toewijzing van het verzoek heeft doen
      blijken; hetzelfde geldt, indien de rechter is gebleken van bezwaren tegen toewijzing van het verzoek van een
      minderjarige die op de dag van het verzoek de leeftijd van twaalf jaren nog niet heeft bereikt, maar in staat kan
      worden geacht tot een redelijke waardering van zijn belangen ter zake;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel228
  - number: 228.1.b
    text: dat het kind niet is een kleinkind van een adoptant;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel228
  - number: 228.1.c
    text: dat de adoptant of ieder der adoptanten ten minste zestien jaren ouder dan het kind is;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel228
  - number: 228.1.d
    text: dat geen der ouders het verzoek tegenspreekt;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel228
  - number: 228.1.e
    text: dat de minderjarige moeder van het kind op de dag van het verzoek de leeftijd van zestien jaren heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel228
  - number: 228.1.f
    text: |-
      dat de ouder of ouders niet of niet langer het gezag over het kind hebben. Indien evenwel de echtgenoot van de
      ouder het kind adopteert, geldt dat deze ouder alleen het gezag heeft.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel228
  - number: '228.2'
    text: 'Aan de tegenspraak van een ouder als bedoeld in het eerste lid, onder d, kan worden voorbijgegaan:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel228
  - number: 228.2.a
    text: indien het kind en de ouder niet of nauwelijks in gezinsverband hebben samengeleefd; of
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel228
  - number: 228.2.b
    text: |-
      indien de ouder het gezag over het kind heeft misbruikt of de verzorging en opvoeding van het kind op grove wijze
      heeft verwaarloosd; of
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel228
  - number: 228.2.c
    text: |-
      indien de ouder onherroepelijk is veroordeeld wegens het plegen tegen de minderjarige
      van een van de misdrijven, omschreven in de [titels XIII tot en met XV][ref1] en
      [XVIII tot en met XX van Boek 2 van het Wetboek van Strafrecht BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028570
      [ref2]: https://wetten.overheid.nl/BWBR0028570
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel228
    references:
      - id: ref1
        bwb_id: BWBR0028570
      - id: ref2
        bwb_id: BWBR0028570
  - number: '229.1'
    text: |-
      Door adoptie komen de geadopteerde, de adoptiefouder en zijn bloedverwanten of de adoptiefouders en hun
      bloedverwanten in familierechtelijke betrekking tot elkaar te staan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel229
  - number: '229.2'
    text: |-
      Tegelijkertijd houdt de familierechtelijke betrekking tussen de geadopteerde, zijn oorspronkelijke ouders en hun
      bloedverwanten op te bestaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel229
  - number: '229.3'
    text: |-
      In afwijking van het tweede lid blijft de familierechtelijke betrekking tussen de geadopteerde en zijn ouder en
      diens bloedverwanten bestaan, indien de echtgenoot van die ouder of de levensgezel van die ouder van verschillend
      geslacht het kind adopteert.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel229
  - number: '229.4'
    text: |-
      Indien het kind op het tijdstip van de adoptie omgang heeft met een ouder ten aanzien van wie de familierechtelijke
      betrekking ophoudt te bestaan, kan het gerecht in eerste aanleg bepalen dat zij gerechtigd blijven tot omgang
      met elkaar. De [artikelen 377a, tweede en derde lid][ref1], [377e][ref2] en [377g][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377a
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel377e
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel377g
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377a
      - id: ref2
        bwb_id: BWBR0028743
        artikel: 377e
      - id: ref3
        bwb_id: BWBR0028743
        artikel: 377g
  - number: '230.1'
    text: De adoptie heeft haar gevolgen vanaf de dag waarop de uitspraak in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel230
  - number: '230.2'
    text: |-
      De adoptie blijft haar gevolgen behouden, ook al zou blijken dat de rechter de door [artikel 228][ref1] gestelde
      voorwaarden ten onrechte als vervuld zou hebben aangenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel228
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '228'
        afdeling: '1'
  - number: '231.1'
    text: De adoptie kan door een uitspraak van het gerecht in eerste aanleg op verzoek van de geadopteerde worden herroepen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel231
  - number: '231.2'
    text: |-
      Het verzoek tot herroeping wordt door de geadopteerde bij het gerecht in eerste aanleg ingediend binnen vijf jaren
      nadat het kind bekend is geworden met de adoptie. Indien het kind evenwel gedurende zijn minderjarigheid bekend
      is geworden met dit feit, kan het verzoek tot uiterlijk vijf jaren nadat het kind meerderjarig is geworden, worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel231
  - number: '231.3'
    text: |-
      De in het tweede lid gestelde termijn kan door de rechter buiten toepassing worden gelaten voor zover toepassing in
      de gegeven omstandigheden naar maatstaven van redelijkheid en billijkheid onaanvaardbaar zou zijn.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel231
  - number: '232.1'
    text: |-
      Door herroeping van de adoptie houdt de familierechtelijke betrekking tussen de geadopteerde en zijn kinderen
      enerzijds en de adoptiefouder of adoptiefouders en zijn bloedverwanten anderzijds op te bestaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232
  - number: '232.2'
    text: De familierechtelijke betrekking die door de adoptie opgehouden had te bestaan, herleeft door de herroeping.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232
  - number: '232.3'
    text: |-
      [Artikel 230][ref1] vindt ten aanzien van de herroeping overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel230
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '230'
        afdeling: '1'
  - number: 232a_bis
    text: |-
      Een in het Europese deel van Nederland uitgesproken adoptie heeft in de openbare lichamen Bonaire, Sint Eustatius
      en Saba de rechtsgevolgen die het Europees Nederlandse burgerlijk recht aan de adoptie verbindt, ongeacht de
      wettelijke regelingen en voorschriften die van toepassing zijn in deze lichamen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232a
  - number: 232a
    text: 'In deze Titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232a
  - number: 232a.a
    text: |-
      *het verdrag:* het op 29 mei 1993 te 's-Gravenhage tot stand gekomen verdrag inzake de bescherming van kinderen en
      de samenwerking op het gebied van de interlandelijke adoptie (Trb. 1993, 197);
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232a
  - number: 232a.b
    text: |-
      *de centrale autoriteit van de staat van herkomst:* de in de staat van herkomst van het kind aangewezen centrale
      autoriteit dan wel de overheidsinstantie, de vergunninghoudende instelling of andere persoon of instelling aan wie
      in die staat bepaalde taken van de centrale autoriteit zijn opgedragen;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232a
  - number: 232a.c
    text: |-
      *adoptie:* een interlandelijke adoptie op verzoek van de in [artikel 1:227, eerste lid][ref1], van het Burgerlijk
      Wetboek BES genoemde personen;


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel227
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '227'
        afdeling: '1'
  - number: 232a.d
    text: '*Onze Minister:* de Minister van Justitie.'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232a
  - number: 232b.1
    text: |-
      Onze Minister wordt voor de openbare lichamen aangewezen als centrale autoriteit, bedoeld in artikel 6 van het
      verdrag. Bij in de Staatscourant openbaar te maken besluit wijst hij de onder zijn ministerie ressorterende dienst,
      diensten of vertegenwoordigers op de openbare lichamen Bonaire, Sint Eustatius en Saba aan, die aldaar wordt of
      worden belast met de taak van centrale autoriteit.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232b
  - number: 232b.2
    text: |-
      De centrale autoriteit is belast met de in het verdrag omschreven taken van de centrale autoriteit, voor zover deze
      niet bij wet aan andere autoriteiten of instellingen zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232b
  - number: 232c.1
    text: |-
      De centrale autoriteit is bevoegd, zonodig ook zonder uitdrukkelijke volmacht van degene die zich met een verzoek
      tot haar heeft gewend, zowel in als buiten rechte ter uitvoering van haar taak namens hem op te treden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232c
  - number: 232c.2
    text: |-
      De centrale autoriteit behoeft, indien zij in rechte optreedt, niet de bijstand van een advocaat, tenzij de
      rechtsingang aanvangt met een dagvaarding.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232c
  - number: 232c.3
    text: |-
      De centrale autoriteit draagt zelf alle kosten die aan de uitvoering van haar taak zijn verbonden, voor zover deze
      niet door haar teruggevorderd kunnen worden van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232c
  - number: 232d.1
    text: |-
      De centrale autoriteit verleent de voogdijraad op diens verzoek machtiging als bedoeld in de
      [Wet opneming buitenlandse kinderen ter adoptie][ref1] om in een andere staat die partij is bij het verdrag, of in
      een bepaald gebiedsdeel van die staat, op te treden. De machtiging wordt slechts verleend indien een eensluidende
      machtiging van de bevoegde autoriteit van die andere staat is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0004447
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232d
    references:
      - id: ref1
        bwb_id: BWBR0004447
  - number: 232d.2
    text: |-
      De voogdijraadtreedt, onder door Onze Minister nader te bepalen voorwaarden, op
      alsvergunninghoudende instelling in de zin van het verdrag en als vergunninghouder in de zin van de
      [Wet opneming buitenlandse kinderen ter adoptie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004447
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232d
    references:
      - id: ref1
        bwb_id: BWBR0004447
  - number: 232e
    text: |-
      Personen die hun gewone verblijfplaats in een van de openbare lichamen Bonaire, Sint Eustatius of Saba hebben en
      die een kind wensen te adopteren dat zijn gewone verblijfplaats heeft in een andere staat die partij is bij het
      verdrag, behoeven daartoe een beginseltoestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232e
  - number: 232f.1
    text: |-
      Het rapport, bedoeld in artikel 15 van het verdrag, wordt door de vergunninghouder wiens bemiddeling door
      de aspirant-adoptiefouders is ingeroepen – in deze Titel verder aan te duiden als ‘de vergunninghouder’
      – samengesteld en toegezonden aan de centrale autoriteit van de staat van herkomst, onder mededeling
      dat bij de binnenkomst van het kind in een openbaar lichaam moet zijn voldaan aan de voorwaarde van
      [artikel 8, onder a, van de Wet opneming buitenlandse kinderen ter adoptie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel8
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232f
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '8'
  - number: 232f.2
    text: |-
      Ingeval de adoptie in de staat van herkomst wordt uitgesproken en deze adoptie niet tot gevolg zal hebben dat de
      voordien bestaande familierechtelijke betrekkingen worden verbroken, roept de vergunninghouder de tussenkomst van
      de centrale autoriteit van de staat van herkomst in met het oog op de verkrijging van de in artikel 4, onder c en
      d, van het verdrag bedoelde toestemmingen voor de omzetting van de adoptie in een adoptie naar deze wet.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232f
  - number: 232g.1
    text: Het rapport, bedoeld in artikel 16 van het verdrag, wordt door de vergunninghouder in ontvangst genomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232g
  - number: 232g.2
    text: |-
      Naar aanleiding van het in het eerste lid bedoelde rapport brengt de vergunninghouder schriftelijk, met redenen
      omkleed, advies uit aan de centrale autoriteit over de vraag of tegen de toevertrouwing van het kind aan de
      aspirant-adoptiefouders bedenkingen bestaan en of de adoptie voortgang mag vinden. Een afschrift van het advies
      doet hij aan de aspirant-adoptiefouders toekomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232g
  - number: 232g.3
    text: |-
      Na ontvangst van het advies besluit de centrale autoriteit of tegen de toevertrouwing van het kind aan de aspirant-
      adoptiefouders bedenkingen bestaan en of de adoptie voortgang mag vinden. Aan haar besluit kan zij voorwaarden
      verbinden. Tegelijkertijd met de bekendmaking van het besluit aan de aspirant-adoptiefouders wordt van het besluit
      mededeling gedaan aan de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232g
  - number: 232h
    text: |-
      Met het oog op de in de staat van herkomst te nemen beslissing om het kind aan de zorg van de aspirant-
      adoptiefouders toe te vertrouwen, deelt de vergunninghouder de centrale autoriteit van die staat schriftelijk mede
      dat tegen deze toevertrouwing geen bedenkingen bestaan en dat de adoptie voortgang mag vinden. De mededeling gaat
      vergezeld van een schriftelijke verklaring van de aspirant-adoptiefouders, dat zij ermee instemmen dat het kind
      aan hun zorg wordt toevertrouwd, en een schriftelijke verklaring van Onze Minister dat het kind voor een permanent
      verblijfsrecht in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232h
  - number: 232i
    text: |-
      De overbrenging van het kind naar een openbaar lichaam mag slechts plaatsvinden indien de vergunninghouder van de
      centrale autoriteit van de staat van herkomst de mededeling heeft ontvangen dat deze de in [artikel 232h][ref1] van
      dit Boek bedoelde verklaringen heeft ontvangen en dat zij ermee instemt dat de adoptie voortgang vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel232h
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232i
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 232h
        hoofdstuk: '3'
  - number: 232j
    text: |-
      De verklaring, bedoeld in artikel 23 van het verdrag, wordt op verzoek afgegeven door de griffier van het
      rechterlijk college dat de adoptie heeft uitgesproken, nadat twee maanden sinds de uitspraak in eerste aanleg of
      in hoger beroep zijn verstreken zonder dat hoger beroep of beroep in cassatie is ingesteld. Is beroep in cassatie
      ingesteld, dan kan de verklaring worden afgegeven na de uitspraak in cassatie. Zij wordt slechts afgegeven indien
      de verzoeker aantoont dat hij bij de verkrijging een gerechtvaardigd belang heeft. Voor de verklaring wordt een bij
      regeling van Onze Minister vast te stellen formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232j
  - number: 232k.1
    text: |-
      Ingeval een in de staat van herkomst in overeenstemming met het verdrag tot stand gekomen adoptie door personen
      die hun gewone verblijfplaats in een openbaar lichaam hebben, niet tot gevolg heeft dat de voordien bestaande
      familierechtelijke betrekkingen worden verbroken, ziet de vergunninghouder erop toe dat in een van de openbare
      lichamen Bonaire, Sint Eustatius of Saba een verzoek tot omzetting in een adoptie naar deze wet wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232k
  - number: 232k.2
    text: |-
      Het verzoek wordt toegewezen indien de adoptie in het kennelijk belang is van het kind en op de dag van de
      indiening ervan is voldaan aan [artikel 228, eerste lid, onder a en d][ref1], van Boek 1 van het Burgerlijk
      Wetboek BES. De omzetting heeft de gevolgen, bedoeld in de [artikelen 229 tot en met 232][ref2] van Boek 1 van het
      Burgerlijk Wetboek BES.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel228
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel229
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232k
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '228'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '229'
        afdeling: '1'
  - number: 232k.3
    text: |-
      Van de omzetting wordt een verklaring afgegeven overeenkomstig [artikel 232j][ref1] van dit Boek.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel232j
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232k
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 232j
        hoofdstuk: '3'
  - number: 232l.1
    text: |-
      In geval van interlandelijke adoptie van een kind dat zijn gewone verblijfplaats in een openbaar lichaam heeft
      door echtgenoten of een persoon die hun gewone verblijfplaats hebben in een andere staat die partij is bij het
      verdrag, stelt de centrale autoriteit het in artikel 16 van het verdrag bedoelde rapport omtrent het kind op. Zij
      wint daartoe het advies in van de voogdijraad. Zij doet zich de op grond van artikel 4 van het verdrag vereiste
      toestemmingen door tussenkomst van de voogdijraad toekomen op bij regeling van Onze Minister vast te stellen
      formulieren. Zij bepaalt of met de voorgenomen plaatsing het hoogste belang van het kind is gediend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232l
  - number: 232l.2
    text: |-
      De centrale autoriteit doet het in het eerste lid bedoelde rapport, alsmede de in artikel 16, tweede lid, van het
      verdrag bedoelde bescheiden toekomen aan de centrale autoriteit van de staat van opvang.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232l
  - number: 232m.1
    text: |-
      De overbrenging van het kind naar de staat van opvang mag slechts plaatsvinden nadat een der aspirant-
      adoptiefouders bij een in een openbaar lichaam gegeven rechterlijke beschikking tot voogd van het kind is benoemd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232m
  - number: 232m.2
    text: 'De in het eerste lid bedoelde beschikking wordt eerst gegeven nadat:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232m
  - number: 232m.2.a
    text: |-
      de centrale autoriteit door tussenkomst van de centrale autoriteit van de staat van opvang een schriftelijke
      verklaring van de aspirant-adoptiefouders heeft ontvangen, dat zij ermee instemmen dat het kind aan hun zorg wordt
      toevertrouwd;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232m
  - number: 232m.2.b
    text: |-
      de centrale autoriteit van de staat van opvang met deze beslissing heeft ingestemd, ingeval een zodanige instemming
      vereist is;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232m
  - number: 232m.2.c
    text: |-
      de centrale autoriteit van de staat van opvang schriftelijk heeft verklaard dat zij ermee instemt dat de adoptie
      voortgang vindt, en
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232m
  - number: 232m.2.d
    text: |-
      door de centrale autoriteit bescheiden zijn ontvangen waaruit blijkt dat overeenkomstig artikel 5 van het verdrag
      door de bevoegde autoriteiten van de staat van opvang is vastgesteld dat de aspirant-adoptiefouders aan de
      vereisten van adoptie voldoen en daartoe geschikt zijn en dat het kind vergunning heeft of zal verkrijgen de staat
      van opvang binnen te komen en een permanent verblijfsrecht in de staat van opvang heeft of zal verkrijgen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232m
  - number: 232n.1
    text: |-
      De [artikelen 1 tot en met 14][ref1], met uitzondering van de [artikelen 7][ref2] en
      [10, derde lid, laatste volzin][ref3], van de voor het Europese deel van Nederland geldende
      [Wet opneming buitenlandse kinderen ter adoptie][ref4] zijn, voor zover in deze Titel niet anders is bepaald, van
      overeenkomstige toepassing op de openbare lichamen Bonaire, Sint Eustatius en Saba, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004447#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0004447#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0004447
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232n
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004447
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0004447
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0004447
  - number: 232n.1.a
    text: de aan de raad voor de kinderbescherming toekomende taken worden opgedragen aan de voogdijraad;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232n
  - number: 232n.1.b
    text: 'voor ‘Nederland’ zonodig wordt gelezen: een openbaar lichaam;'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232n
  - number: 232n.1.c
    text: |-
      voorlopige voogdij als bedoeld in [artikel 10][ref1] van deze wet wordt beschouwd als voorlopige toevertrouwing aan
      de voogdijraad, bedoeld in [afdeling zes van titel veertien][ref2] van Boek 1 van het Burgerlijk wetboek BES;


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Afdeling6
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232n
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0028743
        afdeling: '6'
  - number: 232n.1.d
    text: |-
      voor ‘[Vreemdelingenwet 2000][ref1]’ wordt gelezen: [Wet toelating en uitzetting BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0028571
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232n
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0028571
  - number: 232n.1.e
    text: |-
      de verwijzing naar [Titel 17 van Boek 1 van het Burgerlijk Wetboek][ref1] wordt beschouwd als een verwijzing naar:
      [Titel 17][ref2] van Boek 1 van het Burgerlijk Wetboek BES.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0028743
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232n
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0028743
  - number: 232n.2
    text: |-
      De [zesde afdeling van titel veertien][ref1] van Boek 1 van het Burgerlijk Wetboek BES inzake
      voogdij is niet van toepassing op de uitoefening van de voorlopige toevertrouwing als bedoeld
      in de [artikelen 241][ref2], [271][ref3], [272][ref4], [331][ref5] en [332][ref6] van dit Boek.
      [Artikel 813, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref7] is bij een voorlopige
      toevertrouwing van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Afdeling6
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel241
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel271
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel272
      [ref5]: https://wetten.overheid.nl/BWBR0028743#Artikel331
      [ref6]: https://wetten.overheid.nl/BWBR0028743#Artikel332
      [ref7]: https://wetten.overheid.nl/BWBR0028496#Artikel813
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232n
    references:
      - id: ref1
        bwb_id: BWBR0028743
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '241'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0028743
        artikel: '271'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0028743
        artikel: '272'
        afdeling: '5'
      - id: ref5
        bwb_id: BWBR0028743
        artikel: '331'
        paragraaf: '8'
        afdeling: '6'
      - id: ref6
        bwb_id: BWBR0028743
        artikel: '332'
        paragraaf: '8'
        afdeling: '6'
