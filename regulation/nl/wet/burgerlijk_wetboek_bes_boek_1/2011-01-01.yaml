        artikel: '813'
  - number: 232n.3
    text: |-
      Tegen een besluit van Onze Minister is bezwaar mogelijk overeenkomstig de
      [Wet administratieve rechtspraak BES][ref1]. Onverminderd de bevoegdheid van de rechter in kort geding, is beroep
      mogelijk bij het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba. Tegen een beslissing van dit Gerecht
      in eerste aanleg kan hoger beroep worden ingesteld bij het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao,
      Sint Maarten en van Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028455
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232n
    references:
      - id: ref1
        bwb_id: BWBR0028455
  - number: 232o
    text: |-
      Deze Titel is eveneens van toepassing op interlandelijke adopties die niet door het verdrag worden beheerst. Bij of
      krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven over de uitvoering of toepassing van
      deze Titel.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel232o
  - number: '233'
    text: |-
      Minderjarigen zijn zij, die de ouderdom van achttien jaren niet hebben bereikt en niet gehuwd zijn of gehuwd zijn
      geweest of met toepassing van [artikel 253ha][ref1] meerderjarig zijn verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel253ha
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel233
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 253ha
        paragraaf: 2a
        afdeling: '2'
  - number: '234.1'
    text: |-
      Een minderjarige is, mits hij met toestemming van zijn wettelijke vertegenwoordiger handelt, bekwaam
      rechtshandelingen te verrichten, voor zover de wet niet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel234
  - number: '234.2'
    text: De toestemming kan slechts worden verleend voor een bepaalde rechtshandeling of voor een bepaald doel.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel234
  - number: '234.3'
    text: |-
      De toestemming wordt aan de minderjarige verondersteld te zijn verleend, indien het een rechtshandeling betreft ten
      aanzien waarvan in het maatschappelijk verkeer gebruikelijk is dat minderjarigen van zijn leeftijd deze zelfstandig
      verrichten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel234
  - number: '235.1'
    text: |-
      Handlichting waarbij aan een minderjarige bepaalde bevoegdheden van een meerderjarige worden toegekend, kan wanneer
      de minderjarige de leeftijd van zestien jaren heeft bereikt, op zijn verzoek door de rechter in eerste aanleg
      worden verleend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel235
  - number: '235.2'
    text: |-
      Zij wordt niet verleend tegen de wil van de ouders voor zover deze het gezag over de minderjarige uitoefenen, met
      inachtneming nochtans van [artikel 253a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel253a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 253a
        paragraaf: '1'
        afdeling: '2'
  - number: '235.3'
    text: |-
      Bij het verlenen van handlichting bepaalt de rechter uitdrukkelijk welke bevoegdheden van een meerderjarige aan
      de minderjarige worden toegekend. Deze bevoegdheden mogen zich niet verder uitstrekken dan tot de gedeeltelijke
      of de gehele ontvangst van zijn inkomsten en de beschikking daarover, het sluiten van verhuringen, het in een
      vennootschap deelnemen en het uitoefenen van een beroep of bedrijf. De minderjarige wordt echter door handlichting
      niet bekwaam tot het beschikken over registergoederen, effecten, of door hypotheek gedekte vorderingen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel235
  - number: '235.4'
    text: |-
      Hij kan ter zake van de handlichting zelf en van handelingen, waartoe hij krachtens de verkregen handlichting
      bekwaam is, eisende of verwerende in rechte optreden. [Artikel 12, eerste lid][ref1], geldt voor die handelingen
      niet.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel12
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '12'
  - number: '236.1'
    text: |-
      Een verleende handlichting kan door de rechter in eerste aanleg worden ingetrokken, indien de minderjarige daarvan
      misbruik maakt of er gegronde vrees bestaat dat hij dit zal doen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel236
  - number: '236.2'
    text: |-
      De intrekking geschiedt op verzoek van een van de ouders van de minderjarige, voor zover deze het gezag over hem
      uitoefenen en met inachtneming van [artikel 253a][ref1], of op verzoek van de voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel253a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 253a
        paragraaf: '1'
        afdeling: '2'
  - number: '237.1'
    text: |-
      Een beschikking waarbij handlichting is verleend of ingetrokken, moet worden bekend gemaakt in de Staatscourant en
      in twee in de beschikking aan te wijzen dagbladen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel237
  - number: '237.2'
    text: |-
      In de bekendmaking moet nauwkeurig worden vermeld hoedanig, en tot welk einde zij is verleend. Vóór de bekendmaking
      werkt zomin de handlichting als haar intrekking tegen derden die hiervan onkundig waren.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel237
  - number: '238.1'
    text: Er is een voogdijraad.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel238
  - number: '238.2'
    text: De taak en bevoegdheden van de voogdijraad worden bij wet bepaald.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel238
  - number: '238.3'
    text: |-
      De samenstelling, werkwijze, taken en de bevoegdheden van de voogdijraad worden bij algemene maatregel van bestuur
      bepaald.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel238
  - number: '240.1'
    text: |-
      De voogdijraad zorgt voor, en treedt zonodig op ten behoeve van, de minderjarigen die hun krachtens enig wettelijk
      voorschrift door de rechter of het Openbaar Ministerie voorlopig zijn toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel240
  - number: '240.2'
    text: |-
      De voogdijraad zorgt, dat de gelden die hem ten behoeve van het onderhoud van minderjarigen worden uitgekeerd, aan
      de daarop rechthebbende worden uitbetaald, en ziet toe dat zij overeenkomstig hun bestemming worden besteed.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel240
  - number: '241.1'
    text: |-
      Indien de voogdijraad blijkt, dat een minderjarige niet onder het wettelijk vereiste gezag staat, of dat dit gezag
      niet over hem wordt uitgeoefend, verzoekt hij de rechter in de gezagsuitoefening over de minderjarige te voorzien.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel241
  - number: '241.2'
    text: |-
      Indien het ter voorkoming van de zedelijke of lichamelijke ondergang van zulk een minderjarige dringend en
      onverwijld noodzakelijk is, kan het Openbaar Ministerie hem voorlopig aan de voogdijraad toevertrouwen; deze
      laatste wendt zich in dit geval binnen zes weken tot de rechter ten einde een voorziening in het gezag over deze
      minderjarige te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel241
  - number: '242'
    text: |-
      De voogdijraad stelt zich op de hoogte van alle gevallen, waarin maatregelen met betrekking tot het gezag over
      minderjarigen overwogen dienen te worden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel242
  - number: '243.1'
    text: |-
      De bestuurscolleges en ambtenaren van de burgerlijke stand verschaffen de voogdijraad alle inlichtingen, en
      verstrekken hun kosteloos alle afschriften en uittreksels uit hun registers, die deze ter uitvoering van hun taak
      van hen vraagt; de te verstrekken afschriften en uittreksels zijn vrij van zegel.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel243
  - number: '243.2'
    text: |-
      Alle verzoeken die de voogdijraad ter uitvoering van zijn taak tot de rechter richten, worden kosteloos behandeld;
      de grossen, afschriften en uittreksels, die hij daartoe aanvraagt, zijn vrij van zegel en worden door de griffiers
      vrij van alle kosten uitgereikt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel243
  - number: '243.3'
    text: |-
      Alle stukken en exploiten, die van de voogdijraad uitgaan, zijn vrij van zegel en worden, voor zover hun
      registratie vereist is, gratis geregistreerd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel243
  - number: '244'
    text: |-
      Bij elke zittingsplaats van het gerecht in eerste aanleg berusten openbare registers, waarin aantekening gehouden
      wordt van rechtsfeiten die op het over minderjarigen uitgeoefende gezag betrekking hebben. Bij algemene maatregel
      van bestuur wordt bepaald welke rechtsfeiten aangetekend worden en op welke wijze deze aantekening geschiedt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel244
  - number: '245.1'
    text: Minderjarigen staan onder gezag.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel245
  - number: '245.2'
    text: Onder gezag wordt verstaan ouderlijk gezag dan wel voogdij.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel245
  - number: '245.3'
    text: |-
      Ouderlijk gezag wordt door de ouders gezamenlijk of door één ouder uitgeoefend. Voogdij wordt door een ander dan
      een ouder uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel245
  - number: '245.4'
    text: |-
      Het gezag heeft betrekking op de persoon van de minderjarige, het bewind over zijn vermogen en zijn
      vertegenwoordiging in burgerlijke handelingen, zowel in als buiten rechte.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel245
  - number: '246'
    text: |-
      Onbevoegd tot het gezag zijn minderjarigen, zij die onder curatele zijn gesteld en zij wier geestvermogens zodanig
      zijn gestoord, dat zij in de onmogelijkheid verkeren het gezag uit te oefenen, tenzij deze stoornis van tijdelijke
      aard is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel246
  - number: '247.1'
    text: Het ouderlijk gezag omvat de plicht en het recht van de ouder zijn minderjarig kind te verzorgen en op te voeden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel247
  - number: '247.2'
    text: |-
      Onder verzorging en opvoeding worden mede verstaan de zorg en de verantwoordelijkheid voor het geestelijk en
      lichamelijk welzijn van het kind en het bevorderen van de ontwikkeling van zijn persoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel247
  - number: '248'
    text: |-
      [Artikel 247, tweede lid][ref1], is van overeenkomstige toepassing op de voogd en op degene die een minderjarige
      verzorgt en opvoedt zonder dat hem het gezag over die minderjarige toekomt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel247
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel248
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '247'
        afdeling: '1'
  - number: '249'
    text: |-
      De minderjarige dient rekening te houden met de aan de ouder of voogd in het kader van de uitoefening van het gezag
      toekomende bevoegdheden, alsmede met de belangen van de overige leden van het gezin waarvan hij deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel249
  - number: '250'
    text: |-
      Wanneer in aangelegenheden betreffende diens verzorging en opvoeding, dan wel het vermogen van de minderjarige,
      de belangen van de met het gezag belaste ouders of een van hen dan wel van de voogd in strijd zijn met die van de
      minderjarige, benoemt de rechter in eerste aanleg indien hij dit in het belang van de minderjarige noodzakelijk
      acht, daarbij in het bijzonder de aard van deze belangenstrijd in aanmerking genomen, op verzoek van een
      belanghebbende of ambtshalve een bijzondere curator om de minderjarige ter zake, zowel in als buiten rechte, te
      vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel250
  - number: '251.1'
    text: Gedurende hun huwelijk oefenen de ouders het gezag gezamenlijk uit.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel251
  - number: '251.2'
    text: |-
      Na ontbinding van het huwelijk anders dan door de dood of na scheiding van tafel en bed kunnen de ouders op hun
      eensluidend verzoek gezamenlijk belast blijven met de uitoefening van het gezag. De rechter in eerste aanleg
      wijst dit verzoek af, indien gegronde vrees bestaat dat bij inwilliging de belangen van het kind zouden worden
      verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel251
  - number: '251.3'
    text: |-
      Indien een zodanig verzoek niet is gedaan of indien het verzoek is afgewezen, bepaalt de rechter in eerste aanleg
      aan wie van de ouders voortaan alleen het gezag over ieder der kinderen zal toekomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel251
  - number: '251.4'
    text: |-
      De beslissingen op grond van het tweede en derde lid worden gegeven bij de beschikking houdende scheiding van tafel
      en bed, echtscheiding dan wel ontbinding van het huwelijk na scheiding van tafel en bed of bij latere beschikking.
      Totdat het gezag van beide ouders of van één van hen ingevolge een beslissing als bedoeld in het tweede of
      derde lid aanvangt, komt dit toe aan degene die ook tijdens het geding het gezag uitoefende, zulks met dezelfde
      bevoegdheden en onder dezelfde verplichtingen als deze toen had.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel251
  - number: '251.5'
    text: |-
      Indien de beslissing op grond van het tweede lid niet alle kinderen der echtgenoten betrof, vult de rechter haar
      aan op eensluidend verzoek van de ouders. Een zodanige beslissing op grond van het derde lid wordt aangevuld op
      verzoek van een der ouders, van de voogdijraad of ambtshalve.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel251
  - number: '252.1'
    text: |-
      De ouders die niet met elkaar zijn gehuwd noch met elkaar gehuwd zijn geweest en die nimmer het gezag over hun
      minderjarige kinderen gezamenlijk hebben uitgeoefend, oefenen dit gezamenlijk uit, indien zulks op hun beider
      verzoek in het in [artikel 244][ref1] bedoelde register is aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel244
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel252
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '244'
        afdeling: '4'
  - number: '252.2'
    text: 'De aantekening wordt door de griffier geweigerd, indien op het tijdstip van het verzoek:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel252
  - number: 252.2.a
    text: één of beide ouders onbevoegd is tot het gezag,
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel252
  - number: 252.2.b
    text: één van beide ouders is ontheven of ontzet van het gezag en de andere ouder het gezag uitoefent,
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel252
  - number: 252.2.c
    text: een voogd met het gezag over het kind is belast, of
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel252
  - number: 252.2.d
    text: de voorziening in het gezag over het kind is komen te ontbreken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel252
  - number: '252.3'
    text: |-
      Tegen de weigering van de aantekening is alleen beroep mogelijk, indien zij heeft plaatsgevonden op grond van
      onbevoegdheid van één of beide ouders tot het gezag anders dan vanwege minderjarigheid of ondercuratelestelling.
      Alsdan kan de rechter in eerste aanleg worden verzocht de aantekening te gelasten. Hij wijst het verzoek af, indien
      gegronde vrees bestaat dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel252
  - number: '253.1'
    text: |-
      Indien gewezen echtgenoten met elkaar hertrouwen en onmiddellijk daaraan voorafgaande één der echtgenoten het gezag
      over de minderjarige kinderen uitoefende, herleeft van rechtswege het gezamenlijk gezag, tenzij een der echtgenoten
      onbevoegd is tot dit gezag dan wel daarvan is ontheven of ontzet.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253
  - number: '253.2'
    text: |-
      De echtgenoot voor wie het gezag niet is herleefd, kan de rechter in eerste aanleg verzoeken hem daarmede te
      belasten. Dit verzoek wordt slechts afgewezen, indien gegronde vrees bestaat dat bij inwilliging de belangen van de
      kinderen zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253
  - number: '253.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing indien door verzoening van de echtgenoten een
      scheiding van tafel en bed eindigt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253
  - number: 253a
    text: |-
      In geval van gezamenlijke gezagsuitoefening kunnen geschillen tussen de ouders hieromtrent op verzoek van beiden
      of van een van hen aan de rechter in eerste aanleg worden voorgelegd. Deze beproeft, alvorens te beslissen, een
      vergelijk tussen de ouders. De rechter neemt een zodanige beslissing als hem in het belang van het kind wenselijk
      voorkomt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253a
  - number: 253b.1
    text: |-
      Indien ten aanzien van een kind alleen het moederschap vaststaat of indien de vader en moeder van een kind niet met
      elkaar gehuwd zijn dan wel gehuwd zijn geweest en zij het gezag niet gezamenlijk uitoefenen, oefent de moeder van
      rechtswege het gezag over het kind alleen uit, tenzij zij bij haar bevalling onbevoegd tot het gezag was.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253b
  - number: 253b.2
    text: |-
      De in het eerste lid bedoelde moeder die ten tijde van haar bevalling onbevoegd was tot het gezag, verkrijgt dit
      van rechtswege op het tijdstip waarop zij daartoe bevoegd wordt, tenzij op dat tijdstip een ander met het gezag
      is belast.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253b
  - number: 253b.3
    text: |-
      Indien op bedoeld tijdstip een ander het gezag heeft, kan de tot het gezag bevoegde moeder de rechter in eerste
      aanleg verzoeken haar met het gezag over het kind te belasten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253b
  - number: 253b.4
    text: |-
      Wanneer de vader het gezag over het kind uitoefent, wordt dit verzoek slechts ingewilligd, indien de rechter dit in
      het belang van het kind wenselijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253b
  - number: 253b.5
    text: |-
      Wanneer een voogd het gezag over het kind uitoefent, wordt het verzoek slechts afgewezen, indien gegronde vrees
      bestaat dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253b
  - number: 253c.1
    text: |-
      De tot het gezag bevoegde vader van het kind, die nimmer het gezaggezamenlijk met de moeder heeft uitgeoefend, kan
      de rechter in eerste aanleg verzoeken hem met het gezag over het kind te belasten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253c
  - number: 253c.2
    text: |-
      Wanneer de moeder het gezag over het kind uitoefent, wordt dit verzoek slechts ingewilligd, indien de rechter dit
      in het belang van het kind wenselijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253c
  - number: 253c.3
    text: |-
      Wanneer niet in het gezag is voorzien of wanneer een voogd het gezag uitoefent, wordt het verzoek slechts
      afgewezen, indien gegronde vrees bestaat dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253c
  - number: 253d.1
    text: |-
      Indien de voorziening in het gezag over een kind als bedoeld in [artikel 253b, eerste lid][ref1], komt te
      ontbreken, kunnen zowel zijn moeder als zijn vader dan wel beiden voor zover zij tot het gezag bevoegd zijn de
      rechter in eerste aanleg verzoeken met het gezag onderscheidenlijk gezamenlijk gezag te worden belast.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel253b
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253d
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 253b
        paragraaf: '2'
        afdeling: '2'
  - number: 253d.2
    text: |-
      Het in het eerste lid bedoelde verzoek wordt slechts afgewezen, indien gegronde vrees bestaat dat bij inwilliging
      de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253d
  - number: 253d.3
    text: |-
      Hebben beiden een verzoek ingediend anders dan tot gezamenlijke gezagsuitoefening, dan willigt de rechter het
      verzoek in van degene wiens gezag over het kind hij het meeste in het belang van het kind oordeelt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253d
  - number: 253d.4
    text: |-
      Indien voordat over het verzoek van één ouder is beslist, de andere ouder van rechtswege het gezag over het kind
      verkrijgt, willigt de rechter het verzoek slechts in, indien hij dit in het belang van het kind wenselijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253d
  - number: 253e
    text: |-
      Inwilliging van het verzoek van een der ouders, bedoeld in de [artikelen 253b][ref1], [253c][ref2] en [253d][ref3],
      heeft, indien de ander het gezag tot dusverre uitoefende, tot gevolg dat de laatste het gezag verliest.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel253b
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel253c
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel253d
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253e
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 253b
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: 253c
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0028743
        artikel: 253d
        paragraaf: '2'
        afdeling: '2'
  - number: 253f
    text: |-
      Na de dood van een der ouders oefent de overlevende ouder van rechtswege het gezag over de kinderen uit, indien en
      voor zover hij op het tijdstip van overlijden het gezag uitoefent.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253f
  - number: 253g.1
    text: |-
      Indien van de ouders diegene overlijdt die het gezag over hun minderjarige kinderen alleen uitoefent, bepaalt de
      rechter in eerste aanleg dat de overlevende ouder of een derde met het gezag over deze kinderen wordt belast.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253g
  - number: 253g.2
    text: De rechter doet dit op verzoek van de voogdijraad, de overlevende ouder of ambtshalve.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253g
  - number: 253g.3
    text: |-
      Het verzoek om de overlevende ouder met het gezag te belasten wordt slechts afgewezen, indien gegronde vrees
      bestaat dat bij inwilliging de belangen van de kinderen zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253g
  - number: 253g.4
    text: |-
      Het derde lid is mede van toepassing indien de overleden ouder een voogd had aangewezen overeenkomstig
      [artikel 292][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel292
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253g
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '292'
        paragraaf: '2'
        afdeling: '6'
  - number: 253h.1
    text: |-
      Indien na het overlijden van één der ouders een voogd is benoemd, kan de rechter in eerste aanleg deze beslissing
      te allen tijde in dier voege wijzigen, dat de overlevende ouder mits deze daartoe bevoegd is, alsnog met het gezag
      wordt belast.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253h
  - number: 253h.2
    text: |-
      Hij gaat hiertoe slechts over op verzoek van de overlevende ouder, en niet dan op grond dat nadien de
      omstandigheden zijn gewijzigd, of dat bij het nemen van de beslissing van onjuiste of onvolledige gegevens is
      uitgegaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253h
  - number: 253h.3
    text: |-
      Wanneer de andere ouder een voogd had aangewezen overeenkomstig [artikel 292][ref1] en deze inmiddels is
      opgetreden, is dit artikel van overeenkomstige toepassing met dien verstande dat, mits het verzoek van de
      overlevende ouder binnen één jaar na het begin van de voogdij wordt gedaan, dit verzoek slechts wordt afgewezen
      indien gegronde vrees bestaat dat bij inwilliging de belangen van de kinderen zouden worden verwaarloosd.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel292
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253h
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '292'
        paragraaf: '2'
        afdeling: '6'
  - number: 253ha.1
    text: |-
      De minderjarige vrouw die als degene die het gezag heeft, haar kind wenst te verzorgen en op te voeden kan,
      indien zij de leeftijd van zestien jarenheeft bereikt, de rechter in eerste aanleg verzoeken haar meerderjarig
      te verklaren.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253ha
  - number: 253ha.2
    text: |-
      Het verzoek kan ten behoeve van de vrouw ook worden gedaan door de voogdijraad. Deze behoeft hiertoe haar
      schriftelijke toestemming. Het verzoek vervalt, indien de vrouw haar toestemming intrekt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253ha
  - number: 253ha.3
    text: |-
      Het verzoek kan ook vóór de bevalling door of ten behoeve van de vrouw worden gedaan, alsmede indien de vrouw eerst
      omstreeks het tijdstip van haar bevalling de leeftijd van zestien jaren zal hebben bereikt. In dat geval wordt op
      het verzoek niet eerder dan na de bevalling of, indien de vrouw op dat tijdstip nog geen zestien jaar is, nadat zij
      die leeftijd heeft bereikt, beslist.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253ha
  - number: 253ha.4
    text: |-
      De rechter willigt het verzoek slechts in, indien hij dit in het belang van de moeder en haar kind wenselijk
      oordeelt. Indien een ander met het gezag is belast, wordt de moeder daarmee belast.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253ha
  - number: 253ha.5
    text: De minderjarige vrouw is bekwaam in rechte op te treden en tegen een uitspraak beroep in te stellen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253ha
  - number: 253i.1
    text: |-
      In geval van gezamenlijke gezagsuitoefening voeren de ouders gezamenlijk het bewind over het vermogen van het kind
      en vertegenwoordigen zij gezamenlijk het kind in burgerlijke handelingen, met dien verstande dat een ouder alleen,
      mits niet van bezwaren van de andere ouder is gebleken, hiertoe ook bevoegd is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253i
  - number: 253i.2
    text: |-
      [Artikel 253a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel253a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253i
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 253a
        paragraaf: '1'
        afdeling: '2'
  - number: 253i.3
    text: |-
      Oefent een ouder het gezag alleen uit, dan wordt door die ouder het bewind over het vermogen van het kind gevoerd
      en het kind in burgerlijke handelingen vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253i
  - number: 253i.4
    text: 'Van het eerste en derde lid kan worden afgeweken:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253i
  - number: 253i.4.a
    text: |-
      indien de rechter bij de beschikking waarbij de uitoefening van het gezag over het kind aan een van de ouders wordt
      opgedragen op eensluidend verzoek van de ouders of op verzoek van één van hen, mits de ander zich daartegen niet
      verzet, heeft bepaald dat de ouder die niet het gezag over het kind zal uitoefenen, het bewind over het vermogen
      van het kind zal voeren;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253i
  - number: 253i.4.b
    text: |-
      ingevolge [artikel 276, tweede lid][ref1], bij ontheffing of ontzetting van het gezag;


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel276
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253i
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '276'
        afdeling: '5'
  - number: 253i.4.c
    text: |-
      indien hij die een minderjarige goederen schenkt of vermaakt, bij de gift onderscheidenlijk bij de uiterste
      wilsbeschikking, heeft bepaald dat een ander het bewind over die goederen zal voeren.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253i
  - number: 253i.5
    text: |-
      In het laatstbedoelde geval zijn de ouders, of indien een ouder het gezag alleen uitoefent, die ouder, bevoegd van
      de bewindvoerder rekening en verantwoording te vragen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253i
  - number: 253i.6
    text: |-
      Bij het vervallen van het door de schenker of erflater ingesteld bewind zijn het eerste en tweede lid,
      onderscheidenlijk het derde lid, van toepassing.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253i
  - number: 253j
    text: |-
      De ouders of een ouder moeten het bewind over het vermogen van hun kind als goede bewindvoerders voeren. Bij slecht
      bewind zijn zij voor de daaraan te wijten schade aansprakelijk, behoudens voor de vruchten van dat vermogen voor
      zover de wet hun het genot daarvan toekent.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253j
  - number: 253k
    text: |-
      Op het bewind van de ouders of een ouder zijn de [artikelen 342, tweede lid][ref1], [344 tot en met 357][ref2] en
      [370][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel342
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel344
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel370
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253k
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '342'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '344'
        paragraaf: '10'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0028743
        artikel: '370'
        paragraaf: '10'
        afdeling: '6'
  - number: 253l.1
    text: |-
      Elke ouder die het gezag over zijn kind uitoefent, heeft het vruchtgenot van diens vermogen. Indien het kind bij de
      ouder inwoont en anders dan incidenteel inkomen uit arbeid geniet, is het verplicht naar draagkracht bij te dragen
      in de kosten van de huishouding van het gezin.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253l
  - number: 253l.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing in geval de ouder van het gezag is ontheven, tenzij de andere
      ouder het gezag uitoefent.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253l
  - number: 253l.3
    text: Aan bedoeld vruchtgenot zijn de lasten verbonden, die op vruchtgebruikers rusten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253l
  - number: 253m
    text: |-
      De ouder heeft geen vruchtgenot van het vermogen, ten aanzien waarvan bij uiterste wilsbeschikking van de erflater
      of bij de gift is bepaald dat de ouders daarvan het vruchtgenot niet zullen hebben.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253m
  - number: 253n.1
    text: |-
      Op verzoek van de niet met elkaar gehuwde ouders of een van hen kan de rechter in eerste aanleg het gezamenlijk
      gezag, bedoeld in de [artikelen 251, tweede lid][ref1], [252, eerste lid][ref2], [253q, vijfde lid][ref3], of
      [277, eerste lid][ref4], beëindigen, indien nadien de omstandigheden zijn gewijzigd of bij het nemen van de
      beslissing van onjuiste of onvolledige gegevens is uitgegaan. Als dan bepaalt de rechter aan wie van de ouders
      voortaan het gezag over ieder der minderjarige kinderen toekomt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel251
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel252
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel253q
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel277
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253n
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '251'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '252'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0028743
        artikel: 253q
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0028743
        artikel: '277'
        afdeling: '5'
  - number: 253n.2
    text: |-
      [Artikel 251, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel251
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253n
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '251'
        paragraaf: '1'
        afdeling: '2'
  - number: 253o.1
    text: |-
      Beslissingen waarbij een ouder alleen met het gezag is belast, gegeven ingevolge de [paragrafen 1][ref1],
      [2][ref2] en [2a][ref3] en [artikel 253n][ref4] kunnen op verzoek van de ouders of van een van hen door de rechter
      in eerste aanleg worden gewijzigd op grond dat nadien de omstandigheden zijn gewijzigd, of dat bij het nemen van de
      beslissing van onjuiste of onvolledige gegevens is uitgegaan. Een verzoek om alsnog gezamenlijk met het gezag over
      hun minderjarige kinderen te worden belast, kan slechts van beide ouders afkomstig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Afdeling2
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel253n
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253o
    references:
      - id: ref1
        bwb_id: BWBR0028743
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028743
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0028743
        paragraaf: 2a
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0028743
        artikel: 253n
        afdeling: '3'
  - number: 253o.2
    text: |-
      De rechter in eerste aanleg is eveneens bevoegd kennis te nemen van verzoeken tot wijziging van beslissingen inzake
      het gezag of samenhangend met gezag die door een buitenlandse autoriteit zijn gegeven na een in het buitenland
      tot stand gekomen echtscheiding of scheiding van tafel en bed, indien de minderjarige gewoon verblijf heeft in
      de openbare lichamen Bonaire, Sint Eustatius en Saba. Deze rechter is voorts bevoegd om in het gezag te voorzien
      of een met het gezag samenhangende beslissing te geven, indien de buitenlandse beslissing niet voor erkenning
      in aanmerking komt, dan wel indien na de echtscheiding of scheiding van tafel en bed zodanige beslissing niet is
      gegeven en de minderjarige gewoon verblijf heeft in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253o
  - number: 253p.1
    text: |-
      In de gevallen waarin door de rechter het gezag wordt opgedragen aan beide ouders of aan een ouder alleen, neemt
      dit een aanvang zodra de desbetreffende beschikking in kracht van gewijsde is gegaan, of, indien zij uitvoerbaar
      bij voorraad is verklaard, daags nadat de beschikking is verstrekt of verzonden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253p
  - number: 253p.2
    text: |-
      Na de gerechtelijke ontbinding van het huwelijk of na scheiding van tafel en bed begint het gezag nochtans
      niet voordat de beschikking houdende ontbinding van het huwelijk is ingeschreven in de registers van de
      burgerlijke stand of voordat de beschikking houdende scheiding van tafel en bed is ingeschreven in het
      huwelijksgoederenregister.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253p
  - number: 253p.3
    text: |-
      Indien een aantekening was gedaan als bedoeld in [artikel 252, eerste lid][ref1], begint het aan één der ouders
      opgedragen gezag nochtans niet, dan nadat deze aantekening door de griffier is doorgehaald. Van de doorhaling doet
      de griffier schriftelijk mededeling aan beide ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel252
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253p
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '252'
        paragraaf: '1'
        afdeling: '2'
  - number: 253p.4
    text: |-
      Het eerste tot en met derde lid is niet van toepassing, indien een verzoek van beide ouders als bedoeld in
      [artikel 251, tweede lid][ref1], is toegewezen en inzake het gezag gedurende de scheidingsprocedure geen voorlopige
      voorzieningen zijn getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel251
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253p
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '251'
        paragraaf: '1'
        afdeling: '2'
  - number: 253q.1
    text: |-
      Wanneer een van de ouders die gezamenlijk het gezag over hun minderjarige kinderen uitoefenen, op een der in
      [artikel 246][ref1] genoemde gronden daartoe onbevoegd is, oefent de andere ouder alleen het gezag over de kinderen
      uit. Wanneer de grond van de onbevoegdheid is weggevallen, herleeft van rechtswege het gezamenlijke gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel246
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253q
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '246'
        afdeling: '1'
  - number: 253q.2
    text: |-
      Wanneer beide ouders die gezamenlijk het gezag over hun minderjarige kinderen uitoefenen, daartoe op een der in
      [artikel 246][ref1] genoemde gronden onbevoegd zijn, benoemt de rechter in eerste aanleg een voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel246
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253q
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '246'
        afdeling: '1'
  - number: 253q.3
    text: |-
      Wanneer een ouder die alleen het gezag uitoefent, op een der in [artikel 246][ref1] genoemde gronden daartoe
      onbevoegd is, belast de rechter in eerste aanleg de andere ouder met het gezag, tenzij gegronde vrees bestaat dat
      de belangen van de kinderen zouden worden verwaarloosd. Alsdan benoemt hij een voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel246
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253q
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '246'
        afdeling: '1'
  - number: 253q.4
    text: |-
      De in het tweede en derde lid bedoelde beslissingen worden gegeven op verzoek van een ouder, bloed- of aanverwanten
      van de minderjarige, de voogdijraad of ambtshalve.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253q
  - number: 253q.5
    text: |-
      Wanneer de grond van de onbevoegdheid van de in het derde lid eerstgenoemde ouder is vervallen, wordt hij, op zijn
      verzoek, wederom met het gezag belast, indien de rechter in eerste aanleg overtuigd is dat het kind wederom aan
      de ouder mag worden toevertrouwd. Indien de ouders gezamenlijk met het gezag wensen te worden belast, dient het
      verzoek daartoe van beiden afkomstig te zijn.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253q
  - number: 253r.1
    text: |-
      [Artikel 253q][ref1] is van overeenkomstige toepassing, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel253q
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253r
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 253q
        afdeling: '3'
  - number: 253r.1.a
    text: één of beide ouders al dan niet tijdelijk in de onmogelijkheid verkeert het gezag uit te oefenen; of
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253r
  - number: 253r.1.b
    text: het bestaan of de verblijfplaats van één of beide ouders onbekend is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253r
  - number: 253r.2
    text: |-
      Het gezag dat aan één of beide ouders toekomt, is geschorst gedurende de tijd waarin een van de in het eerste lid
      bedoelde omstandigheden zich voordoet.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253r
  - number: 253s.1
    text: |-
      Indien het kind met instemming van zijn ouders die het gezag over hem uitoefenen, gedurende ten minste een
      jaar door een of meer anderen als behorende tot het gezin is verzorgd en opgevoed, kunnen de ouders slechts met
      toestemming van degenen die de verzorging en opvoeding op zich hebben genomen, wijziging in het verblijf van het
      kind brengen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253s
  - number: 253s.2
    text: |-
      Voor zover de volgens het eerste lid vereiste toestemmingen niet worden verkregen, kunnen zij op verzoek van de
      ouders door die van de rechter in eerste aanleg worden vervangen. Dit verzoek wordt slechts afgewezen, indien
      gegronde vrees bestaat dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253s
  - number: 253s.3
    text: |-
      In geval van afwijzing van het verzoek is de beschikking van kracht gedurende een door de rechter te bepalen
      termijn, welke de duur van zes maanden niet te boven mag gaan. Is echter voor het einde van deze termijn een
      verzoek of vordering tot ondertoezichtstelling van het kind, dan wel tot ontheffing of ontzetting van een of beide
      ouders aanhangig gemaakt, dan blijft de beschikking gelden totdat op het verzoek of de vordering bij gewijsde is
      beslist.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel253s
  - number: '254.1'
    text: |-
      Indien een kind zodanig opgroeit, dat zijn zedelijke of geestelijke belangen of zijn gezondheid ernstig worden
      bedreigd, en andere middelen ter afwending van deze bedreiging hebben gefaald of, naar is te voorzien, zullen
      falen, kan de rechter in eerste aanleg het onder toezicht stellen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel254
  - number: '254.2'
    text: |-
      Hij kan dit doen op verzoek van een van de ouders, een ander die de minderjarige als behorende tot zijn gezin
      verzorgt en opvoedt, een van de bloed- of aanverwanten tot en met de vierde graad, de voogdijraad of op vordering
      van het Openbaar Ministerie.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel254
  - number: '255.1'
    text: |-
      Bij de toewijzing van het verzoek of van de vordering benoemt de rechter in eerste aanleg tevens een gezinsvoogd,
      die onder zijn leiding op het kind toezicht houdt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel255
  - number: '255.2'
    text: |-
      Bij deze benoeming let de rechter op de godsdienstige gezindheid en de levensovertuiging van het kind en van het
      gezin waartoe het kind behoort.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel255
  - number: '255.3'
    text: |-
      De rechter in eerste aanleg die een kind onder toezicht heeft gesteld, kan de vervulling van de taak overdragen aan
      de rechter in eerste aanleg van de woon- of verblijfplaats van de minderjarige. Bij algemene maatregel van bestuur
      worden hieromtrent nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel255
  - number: '256'
    text: De rechter in eerste aanleg is bevoegd te allen tijde de gezinsvoogd door een ander te vervangen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel256
  - number: '257'
    text: |-
      De rechter in eerste aanleg kan hangende het onderzoek het kind voorlopig onder toezicht stellen. Dit voorlopige
      toezicht blijft gelden totdat omtrent de ondertoezichtstelling bij gewijsde is beslist.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel257
  - number: '258.1'
    text: |-
      De rechter in eerste aanleg bepaalt de duur van de ondertoezichtstelling op een termijn van ten hoogste één jaar,
      die hij telkens met ten hoogste één jaar kan verlengen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel258
  - number: '258.2'
    text: |-
      De rechter in eerste aanleg kan de ondertoezichtstelling te allen tijde opheffen. Zij eindigt door de
      meerderjarigheid van het kind.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel258
  - number: '259'
    text: |-
      De gezinsvoogd zoekt zoveel mogelijk persoonlijk aanraking met het kind en met het gezin waartoe het behoort. Hij
      bevordert het geestelijk, lichamelijk en toekomstig stoffelijk welzijn van het kind. Hij dient de ouders van raad
      bij de verzorging en opvoeding en tracht hen te overreden hiertoe het nodige te doen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel259
  - number: '260.1'
    text: |-
      Bij de verzorging en opvoeding van het onder toezicht gestelde kind moeten de ouders zich gedragen naar de
      aanwijzingen van de gezinsvoogd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel260
  - number: '260.2'
    text: |-
      Een ouder, die met de gezinsvoogd van mening verschilt ten aanzien van de in het belang van het kind te nemen
      maatregelen, kan op mondeling of schriftelijk verzoek de beslissing van de rechter in eerste aanleg inroepen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel260
  - number: '260.3'
    text: |-
      Aanwijzingen tot het nemen van maatregelen die kosten zullen veroorzaken, kan de gezinsvoogd slechts geven met
      machtiging van de rechter in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel260
  - number: '260.4'
    text: |-
      Plaatsing van het kind buiten het gezin geschiedt, behoudens in de gevallen dat de ouders daartoe zonder bezwaar
      van de gezinsvoogd overgaan, alleen krachtens de [artikelen 262][ref1] en [263][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel262
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel263
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel260
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '262'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '263'
        afdeling: '4'
  - number: '261'
    text: De rechter in eerste aanleg kan te allen tijde bevelen dat het kind door de gezinsvoogd voor hem wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel261
  - number: '262'
    text: |-
      De rechter in eerste aanleg kan te allen tijde bevelen het kind tot onderzoek van zijn geestelijke of lichamelijke
      gesteldheid voor ten hoogste drie maanden doen opnemen in een door hem aan te wijzen observatiehuis. Hij kan
      de termijn van de opneming eenmaal met ten hoogste drie maanden verlengen, indien het belang van het kind dit
      gebiedend noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel262
  - number: '263.1'
    text: |-
      Indien dit in het belang van de verzorging en opvoeding noodzakelijk is, kan de rechter in eerste aanleg het kind
      doen opnemen in een door hem aan te wijzen inrichting of elders dan in een inrichting.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel263
  - number: '263.2'
    text: |-
      Bij zijn keuze let de rechter in eerste aanleg op de wensen van hen die het gezag uitoefenen, en op de
      godsdienstige gezindheid en levensovertuiging van het kind en van het gezin waartoe het kind behoort.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel263
  - number: '263.3'
    text: |-
      De rechter in eerste aanleg bepaalt de duur van de opneming op een termijn van ten hoogste een jaar. Hij kan deze
      termijn telkens met een jaar verlengen en te allen tijde verkorten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel263
  - number: '263.4'
    text: |-
      De termijn van opneming in een tuchtschool kan een jaar of, indien het kind nog niet veertien jaren oud is, zes
      maanden niet overschrijden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel263
  - number: '263.5'
    text: |-
      Opneming in een inrichting eindigt mede door een besluit van de Minister voor Jeugd en Gezin, de rechter in
      eerste aanleg gehoord, wanneer de Minister voor Jeugd en Gezin dit in verband met een juiste verdeling der in de
      aangewezen inrichtingen beschikbare plaatsruimte noodzakelijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel263
  - number: 263a.1
    text: |-
      Voor zover noodzakelijk met het oog op het doel van de uithuisplaatsing van een minderjarige als bedoeld in
      de [artikelen 262][ref1] en [263][ref2], kan de rechter in eerste aanleg of de gezinsvoogd voor de duur van de
      uithuisplaatsing de contacten tussen de met het gezag belaste ouder en het kind beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel262
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel263
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel263a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '262'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '263'
        afdeling: '4'
  - number: 263a.2
    text: |-
      Een beslissing van de gezinsvoogd geldt als een aanwijzing. [Artikel 260, tweede lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel260
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel263a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '260'
        afdeling: '4'
  - number: 263b.1
    text: |-
      Voor de duur van de maatregel kan de rechter in eerste aanleg op verzoek van de gezinsvoogd of ambtshalve een
      rechterlijke beslissing tot vaststelling van een regeling inzake de uitoefening van het omgangsrecht wijzigen voor
      zover dat noodzakelijk is met het oog op het doel van de ondertoezichtstelling.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel263b
  - number: 263b.2
    text: |-
      Op het verzoek van de met het gezag belaste ouder, de omgangsgerechtigde, de minderjarige van twaalf jaren of
      ouder en de gezinsvoogd kan de rechter de in het eerste lid genoemde beslissing wijzigen op grond dat nadien de
      omstandigheden zijn gewijzigd, of dat bij het nemen van de beslissing van onjuiste of onvolledige gegevens is
      uitgegaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel263b
  - number: 263b.3
    text: |-
      Zodra de ondertoezichtstelling is geëindigd, geldt een ingevolge deze bepaling vastgestelde regeling als een
      regeling als bedoeld in [artikel 377a][ref1] dan wel [377f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377a
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel377f
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel263b
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377a
      - id: ref2
        bwb_id: BWBR0028743
        artikel: 377f
  - number: '264.1'
    text: |-
      De kosten van de maatregelen bedoeld bij de [artikelen 260, derde lid][ref1], [262][ref2] en [263][ref3] komen
      ten laste van de ouders, of – voor zover deze onvermogend zijn – ten laste van het kind; voor zover ook het
      kind onvermogend is, komen die kosten ten laste van de Staat. Op de kosten die ten laste van de ouders komen, is
      [artikel 402a][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel260
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel262
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel263
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel402a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel264
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '260'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '262'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0028743
        artikel: '263'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0028743
        artikel: 402a
        afdeling: '1'
  - number: '264.2'
    text: |-
      Voor de toepassing van het eerste lid wordt een stiefouder die krachtens [titel 17][ref1] verplicht is tot het
      verstrekken van levensonderhoud, met een ouder gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel264
    references:
      - id: ref1
        bwb_id: BWBR0028743
  - number: '265'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven ten aanzien van alles wat in verband met de
      uitvoering van de voorschriften van deze afdeling nog nadere voorziening behoeft.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel265
  - number: '266'
    text: |-
      Mits het belang van het kind zich daar niet tegen verzet, kan de rechter in eerste aanleg een ouder van het gezag
      over een of meer van zijn kinderen ontheffen op grond dat hij ongeschikt of onmachtig is zijn plicht tot verzorging
      en opvoeding te vervullen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel266
  - number: '267.1'
    text: Ontheffing wordt slechts uitgesproken op verzoek van de voogdijraad of op vordering van het Openbaar Ministerie.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel267
  - number: '267.2'
    text: |-
      In het geval, bedoeld in [artikel 268, tweede lid, onderdeel d][ref1], kan, indien de rechter in eerste
      aanleg een verzoek van de ouders om toestemming tot wijziging in het verblijf van hun kind heeft afgewezen, de
      ontheffing bovendien verzocht worden door degene die het kind op het tijdstip van het verzoek ten minste een
      jaar verzorgd en opgevoed heeft. Indien het kind door meer dan een persoon wordt verzorgd en opgevoed, kan het
      verzoek slechts door dezen gemeenschappelijk worden gedaan. Is de ontheffing verzocht of gevorderd, dan blijft
      [artikel 253s, tweede lid][ref2], buiten toepassing totdat op het verzoek of de vordering bij gewijsde is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel268
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel253s
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel267
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '268'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: 253s
        afdeling: '3'
  - number: '268.1'
    text: Ontheffing kan niet worden uitgesproken indien de ouder zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel268
  - number: '268.2'
    text: 'Deze regel lijdt uitzondering:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel268
  - number: 268.2.a
    text: |-
      indien na een ondertoezichtstelling van ten minste zes maanden blijkt, of na een opneming krachtens de
      [artikelen 262][ref1] en [263][ref2] van meer dan een jaar en zes maanden gegronde vrees bestaat, dat deze
      maatregel – door de ongeschiktheid of onmacht van een ouder om zijn plicht tot verzorging en opvoeding te vervullen
      – onvoldoende is om het kind voor zedelijke of lichamelijke ondergang te behoeden;


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel262
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel263
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '262'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '263'
        afdeling: '4'
  - number: 268.2.b
    text: |-
      indien zonder de ontheffing van de ene ouder de ontzetting van de andere ouder het kind niet aan diens invloed
      zou onttrekken;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel268
  - number: 268.2.c
    text: |-
      indien de geestvermogen van de ouder zodanig zijn gestoord dat hij niet in staat is zijn wil te bepalen of de
      betekenis van zijn verklaring te begrijpen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel268
  - number: 268.2.d
    text: |-
      indien na een verzorging en opvoeding met instemming van de ouder – anders dan uit hoofde van een
      ondertoezichtstelling of een voorlopige toevertrouwing aan de voogdijraad – van tenminste een jaar in een ander
      gezin dan het ouderlijke, een voortzetting daarvan noodzakelijk is en van terugkeer naar de ouder ernstig nadeel
      voor het kind moet worden gevreesd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel268
  - number: '269.1'
    text: |-
      Indien de rechter in eerste aanleg het in het belang van het kind noodzakelijk oordeelt, kan hij een ouder van het
      ouderlijk gezag over een of meer van zijn kinderen ontzetten, op grond van:
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel269
  - number: 269.1.a
    text: misbruik van het gezag, of grove verwaarlozing van de verzorging of opvoeding van een of meer kinderen;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel269
  - number: 269.1.b
    text: slecht levensgedrag;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel269
  - number: 269.1.c
    text: 'onherroepelijke veroordeling:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel269
  - number: 269.1.c.1
    text: wegens opzettelijke deelneming aan enig misdrijf met een onder zijn gezag staande minderjarige;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel269
  - number: 269.1.c.2
    text: |-
      wegens het plegen tegen de minderjarige van een van de misdrijven, omschreven in de
      [titels XIII tot en met XV][ref1] en [XVIII tot en met XX van Boek 2 van het Wetboek van Strafrecht BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028570
      [ref2]: https://wetten.overheid.nl/BWBR0028570
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel269
    references:
      - id: ref1
        bwb_id: BWBR0028570
      - id: ref2
        bwb_id: BWBR0028570
  - number: 269.1.c.3
    text: tot een vrijheidsstraf van twee jaar of langer;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel269
  - number: 269.1.d
    text: |-
      het in ernstige mate veronachtzamen van de aanwijzingen van de gezinsvoogd of belemmeren van een krachtens de
      [artikelen 262][ref1] en [263][ref2] bevolen opneming;


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel262
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel263
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel269
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '262'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '263'
        afdeling: '4'
  - number: 269.1.e
    text: |-
      het bestaan van gegronde vrees voor verwaarlozing van de belangen van het kind, doordat de ouder het kind terugeist
      of terugneemt van anderen, die diens verzorging en opvoeding op zich hebben genomen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel269
  - number: '269.2'
    text: Onder misdrijf wordt in dit artikel begrepen medeplichtigheid aan en poging tot misdrijf.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel269
  - number: '270.1'
    text: |-
      Ontzetting van het gezag wordt slechts uitgesproken op verzoek van de andere ouder, een van de bloed- of
      aanverwanten van het kind tot en met de vierde graad, de voogdijraad, of op vordering van het Openbaar Ministerie.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel270
  - number: '270.2'
    text: |-
      In het geval, bedoeld in [artikel 269, eerste lid, onderdeel e][ref1], kan de ontzetting bovendien verzocht worden
      door hem, die de verzorging en opvoeding van het kind op zich genomen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel269
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel270
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '269'
        afdeling: '5'
  - number: '271.1'
    text: |-
      Indien de rechter in eerste aanleg het in het belang van het kind noodzakelijk acht, kan hij een ouder wiens
      ontzetting verzocht of gevorderd is, hangende het onderzoek geheel of gedeeltelijk in de uitoefening van het gezag
      over een of meer van zijn kinderen schorsen. Gelijke bevoegdheid komt hem toe ten opzichte van een ouder wiens
      ontheffing verzocht of gevorderd is, in de gevallen, bedoeld in [artikel 268, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel268
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel271
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '268'
        afdeling: '5'
  - number: '271.2'
    text: |-
      Indien de andere ouder mede het gezag uitoefent, wordt gedurende de schorsing het gezag door hem alleen
      uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel271
  - number: '271.3'
    text: |-
      Acht de rechter in dit laatste geval de schorsing van de te ontzetten ouder onvoldoende om het kind aan diens
      invloed te onttrekken, dan kan hij ook de andere ouder schorsen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel271
  - number: '271.4'
    text: |-
      Betreft de schorsing beide ouders of een ouder die het gezag alleen uitoefent, dan vertrouwt de rechter het kind
      voorlopig toe aan de voogdijraad, waarbij hij deze laatste ten aanzien van persoon en vermogen van dit kind de
      bevoegdheden verleent die hij geschikt acht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel271
  - number: '271.5'
    text: |-
      De in dit artikel bedoelde beschikkingen blijven van kracht, totdat de uitspraak omtrent de ontzetting of de
      ontheffing in kracht van gewijsde is gegaan. De rechter kan zodanige beschikking evenwel met ingang van een vroeger
      tijdstip herroepen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel271
  - number: '272.1'
    text: |-
      Op grond van feiten die tot ontzetting van een ouder kunnen leiden, kan het Openbaar Ministerie – indien het dit
      in het belang van het kind noodzakelijk acht – het kind aan het gezag van de ouders onttrekken en voorlopig aan de
      voogdijraad toevertrouwen. Gelijke bevoegdheid komt het toe op grond van feiten die tot ontheffing van een ouder
      kunnen leiden in de gevallen, bedoeld in [artikel 268, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel268
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel272
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '268'
        afdeling: '5'
  - number: '272.2'
    text: |-
      De toevertrouwing vervalt, indien het Openbaar Ministerie niet binnen veertien dagen van de rechter in eerste
      aanleg haar bekrachtiging heeft gevorderd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel272
  - number: '272.3'
    text: |-
      Wordt de bekrachtiging tijdig gevorderd, dan kan de rechter in eerste aanleg hetzij de teruggave van het kind aan
      zijn ouders bevelen, hetzij een van de beschikkingen geven, bedoeld in [artikel 271][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel271
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel272
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '271'
        afdeling: '5'
  - number: '272.4'
    text: |-
      In dit laatste geval bepaalt de rechter tevens hoe lang de gegeven beschikking van kracht zal blijven. Is echter
      voor het einde van deze termijn – die op verzoek van de voogdijraad kan worden verlengd – een verzoek of vordering
      tot ontzetting of ontheffing aanhangig gemaakt, dan blijft de beschikking gelden totdat over de ontzetting of de
      ontheffing bij gewijsde is beslist. De rechter kan die beschikking evenwel met ingang van een vroeger tijdstip
      herroepen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel272
  - number: '273'
    text: |-
      De kosten die de voogdijraad maakt ten behoeve van het hem toevertrouwde kind, komen ten laste van de ouders, of
      – voor zover deze onvermogend zijn – ten laste van het kind; voor zover ook het kind onvermogend is, blijven die
      kosten ten laste van de Staat, met inachtneming van de regels dienaangaande bij algemene maatregel van bestuur
      te stellen. Wanneer de toevertrouwing niet door de ontzetting of de ontheffing van één of beide ouders gevolgd
      wordt, kan de rechter in eerste aanleg bevelen, dat hetgeen zij of het kind ter bestrijding van bedoelde kosten
      hebben betaald hun geheel of ten dele wordt teruggegeven. Op de kosten die ten laste van de ouders komen, is
      [artikel 402a][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel402a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel273
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 402a
        afdeling: '1'
  - number: '274.1'
    text: |-
      Indien de ouders gezamenlijk het gezag uitoefenen, wordt na de ontheffing of ontzetting van een van hen voortaan
      het gezag door de andere ouder alleen uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel274
  - number: '274.2'
    text: |-
      In geval van ontheffing of ontzetting van een ouder die het gezag alleen uitoefent, kan de andere ouder de rechter
      in eerste aanleg te allen tijde verzoeken met de uitoefening van het gezag te worden belast. Dit verzoek wordt
      slechts afgewezen, indien gegronde vrees bestaat dat bij inwilliging de belangen van het kind zouden worden
      verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel274
  - number: '274.3'
    text: |-
      De rechter die het verzoek, bedoeld in het tweede lid, heeft afgewezen, kan deze beschikking steeds wijzigen. Hij
      doet dit echter slechts op verzoek van de betrokken ouder, en niet dan op grond van omstandigheden, waarmede de
      rechter bij het geven van de beschikking geen rekening heeft kunnen houden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel274
  - number: '275.1'
    text: |-
      Indien de andere ouder het gezag niet voortaan alleen uitoefent, benoemt de rechter een voogd over de
      minderjarigen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel275
  - number: '275.2'
    text: |-
      Ieder die tot uitoefening van de voogdij bevoegd is, kan tijdens het onderzoek schriftelijk aan de rechter
      verzoeken met de voogdij te worden belast.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel275
  - number: '276.1'
    text: |-
      Indien de ontheven of ontzette ouder het bewind over het vermogen van zijn kind voerde, wordt hij tevens
      veroordeeld tot het afleggen van rekening en verantwoording aan zijn opvolger in dit bewind.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel276
  - number: '276.2'
    text: |-
      Zijn er kinderen die goederen gemeen hebben en komen zij onder het gezag van verschillende personen, dan kan
      de rechter een van dezen of een derde aanwijzen om over deze goederen tot de verdeling het bewind te voeren. De
      aangewezen bewindvoerder stelt de waarborgen die de rechter van hem verlangt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel276
  - number: '276.3'
    text: |-
      Op het bewind krachtens het tweede lid is [artikel 253k][ref1] van toepassing, indien een der ouders als
      bewindvoerder is aangewezen, en anders [afdeling 6, paragraaf 10][ref2]. De bewindvoerder is bij uitsluiting
      bevoegd tot vernietiging van rechtshandelingen van minderjarige deelgenoten, strekkend tot beheer of beschikking
      met betrekking tot de onder bewind staande goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel253k
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Afdeling6
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel276
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 253k
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0028743
        paragraaf: '10'
        afdeling: '6'
  - number: '277.1'
    text: |-
      Indien de rechter overtuigd is dat een minderjarige wederom aan zijn ontheven of ontzette ouder mag worden
      toevertrouwd, kan hij deze ouder op zijn verzoek in het gezag herstellen. Indien de niet met elkaar gehuwde ouders
      gezamenlijk het gezag willen uitoefenen, wordt het verzoek daartoe door hen beiden gedaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel277
  - number: '277.2'
    text: |-
      Indien bij gelegenheid van de ontzetting of ontheffing het gezag aan de andere ouder was opgedragen, belast
      de rechter de ontheven of ontzette ouder die alleen het in het eerste lid bedoelde verzoek doet, niet met het
      gezag, tenzij de omstandigheden na het nemen van de beschikking waarbij het gezag aan de andere ouder werd
      opgedragen, zijn gewijzigd of bij het nemen van de beschikking van onjuiste of onvolledige gegevens is uitgegaan.
      [Artikel 253e][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel253e
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel277
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 253e
        paragraaf: '2'
        afdeling: '2'
  - number: '278.1'
    text: |-
      Het verzoek, bedoeld in [artikel 277][ref1], kan ook worden gedaan door de voogdijraad.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel277
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel278
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '277'
        afdeling: '5'
  - number: '278.2'
    text: |-
      Hangende het onderzoek kan zowel de voogdijraad als de te herstellen ouder de rechter verzoeken de beslissing aan
      te houden tot het einde van een door hem te bepalen proeftijd van ten hoogste zes maanden; gedurende die tijd zal
      het kind bij de in het gezag te herstellen ouder verblijven. De rechter is te allen tijde bevoegd de proeftijd
      te beëindigen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel278
  - number: '280'
    text: 'De voogdij begint:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel280
  - number: 280.a
    text: |-
      voor de voogd die door een ouder is benoemd: op het tijdstip waarop hij zich na het overlijden van deze
      ouder bereid verklaart de voogdij te aanvaarden; de verklaring moet door de betrokkene in persoon of bij
      bijzondere gevolmachtigde worden afgelegd ter griffie van het gerecht in eerste aanleg dat overeenkomstig
      [artikel 429c van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] in zaken betreffende minderjarigen
      bevoegd is; de verklaring moet worden afgelegd binnen veertien dagen, of – indien de persoon die de verklaring moet
      afleggen, zich buiten de openbare lichamen Bonaire, Sint Eustatius en Saba bevindt – binnen vier weken nadat de
      benoeming is betekend; tot betekening kan iedere belanghebbende, alsmede de voogdijraad opdracht geven;


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel429c
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel280
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: 429c
  - number: 280.b
    text: |-
      voor de voogd die – nadat hij zich bereid heeft verklaard de voogdij te aanvaarden – door de rechter is benoemd:
      op de dag waarop de beslissing die de benoeming inhoudt, in kracht van gewijsde is gegaan, of – zo deze uitvoerbaar
      bij voorraad is verklaard – daags nadat de benoeming van de voogd is verstrekt of verzonden;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel280
  - number: '281.1'
    text: 'De voogdij eindigt op de dag waarop in kracht van gewijsde is gegaan de beschikking waarbij:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel281
  - number: 281.1.a
    text: de voogd is ontslagen of ontzet;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel281
  - number: 281.1.b
    text: het gezag over de onder zijn voogdij staande minderjarige aan een of beide ouders is opgedragen; of
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel281
  - number: 281.1.c
    text: |-
      de voogdij overeenkomstig [artikel 299a][ref1] of [302, vierde lid][ref2], aan een andere voogd is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel299a
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel302
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel281
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 299a
        paragraaf: '3'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '302'
        paragraaf: '4'
        afdeling: '6'
  - number: '281.2'
    text: |-
      Is een beschikking als in het eerste lid bedoeld, uitvoerbaar verklaard bij voorraad, dan eindigt de voogdij daags
      nadat de beschikking is verstrekt of verzonden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel281
  - number: '292.1'
    text: |-
      Voor zover een ouder het gezag over zijn kinderen uitoefent, kan hij bij uiterste wilsbeschikking of bij
      uitsluitend hiertoe verleden notariële akte bepalen wie na zijn dood voortaan als voogd het gezag over deze
      kinderen zal uitoefenen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel292
  - number: '292.2'
    text: Hij kan geen rechtspersoon als voogd aanwijzen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel292
  - number: '292.3'
    text: |-
      Hebben beide ouders van deze bevoegdheid gebruik gemaakt, en sterven zij, zonder dat men kan weten wie het eerst
      overleden is, dan bepaalt de rechter in eerste aanleg ambtshalve wiens beschikking gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel292
  - number: '293'
    text: 'De door de ouder getroffen regeling heeft geen gevolg of vervalt:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel293
  - number: 293.a
    text: |-
      indien na zijn overlijden de andere ouder van rechtswege of krachtens rechterlijke beschikking het gezag over zijn
      kinderen uitoefent;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel293
  - number: 293.b
    text: indien en voor zover hij op het tijdstip van zijn overlijden het gezag over zijn kinderen niet meer uitoefende.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel293
  - number: '295'
    text: |-
      De rechter in eerste aanleg benoemt een voogd over alle minderjarigen, die niet onder ouderlijk gezag staan en in
      wier voogdij niet op wettige wijze is voorzien.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel295
  - number: '296.1'
    text: |-
      Is voorziening nodig in afwachting van het begin der voogdij overeenkomstig [artikel 280][ref1], dan benoemt de
      rechter in eerste aanleg een voogd voor de duur van deze omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel280
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel296
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '280'
        paragraaf: '1'
        afdeling: '6'
  - number: '296.2'
    text: |-
      Zodra bedoelde omstandigheden zijn vervallen, wordt deze voogd op verzoek van hem die hij vervangt, door de rechter
      in eerste aanleg ontslagen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel296
  - number: '297.1'
    text: 'De rechter in eerste aanleg benoemt insgelijks een voogd, wanneer voorziening nodig is wegens:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel297
  - number: 297.1.a
    text: tijdelijke onmogelijkheid, waarin een voogd zich bevindt, het gezag uit te oefenen,
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel297
  - number: 297.1.b
    text: onbekendheid van bestaan of verblijfplaats van de voogd, of
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel297
  - number: 297.1.c
    text: in gebreke blijven van de voogd, het gezag uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel297
  - number: '297.2'
    text: |-
      Is de benoeming op het eerste lid, onderdeel c, gegrond, dan kan de rechter de benoemde voogd een beloning
      toekennen en is de in gebreke gebleven voogd jegens de minderjarige aansprakelijk voor de kosten die de vervanging
      veroorzaakt, alsmede, behoudens zijn verhaal op de benoemde voogd, voor diens verrichtingen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel297
  - number: '297.3'
    text: |-
      Zodra de in het eerste lid genoemde omstandigheden zijn vervallen, wordt de benoemde voogd op eigen verzoek of op
      verzoek van degene die hij vervangt, door de rechter in eerste aanleg ontslagen, tenzij gegronde vrees bestaat dat
      bij inwilliging de belangen van de kinderen zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel297
  - number: '298'
    text: |-
      Gedurende de in de [artikelen 296][ref1] en [297][ref2] bedoelde voogdij is de uitoefening van de voogdij
      geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel296
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel297
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel298
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '296'
        paragraaf: '3'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '297'
        paragraaf: '3'
        afdeling: '6'
  - number: '299'
    text: |-
      De rechter in eerste aanleg benoemt de voogd op verzoek van bloed- of aanverwanten van de minderjarige, de
      voogdijraad, schuldeisers of andere belanghebbenden, of ambtshalve.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel299
  - number: 299a.1
    text: |-
      Degene die met instemming van de voogd een minderjarige in zijn gezin – anders dan uit hoofde van een
      ondertoezichtstelling of een voorlopige toevertrouwing aan de voogdijraad – ten minste een jaar heeft
      verzorgd en opgevoed, kan de rechter in eerste aanleg verzoeken hem, dan wel een rechtspersoon als bedoeld in
      [artikel 302][ref1], tot voogd te benoemen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel302
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel299a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '302'
        paragraaf: '4'
        afdeling: '6'
  - number: 299a.2
    text: |-
      Indien de minderjarige door meer dan een persoon als behorende tot het gezin wordt verzorgd en opgevoed, kan het
      verzoek slechts door dezen gemeenschappelijk worden gedaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel299a
  - number: 299a.3
    text: Het verzoek kan ook worden gedaan door de voogdijraad.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel299a
  - number: 299a.4
    text: |-
      De rechter willigt het verzoek slechts in, indien hij dit in het belang van de minderjarige acht en hem genoegzaam
      is gebleken, dat de voogd niet bereid is zich van zijn bediening te doen ontslaan. Alsdan benoemt hij bij voorkeur
      degene wiens benoeming wordt verzocht tot voogd, mits deze bevoegd is tot uitoefening van de voogdij.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel299a
  - number: 299a.5
    text: |-
      Is het bij het eerste lid bedoelde verzoek gedaan, dan blijft [artikel 336a, tweede lid][ref1], buiten toepassing,
      totdat op het verzoek bij gewijsde is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel336a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel299a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 336a
        paragraaf: '9'
        afdeling: '6'
  - number: '301.1'
    text: 'De ambtenaar van de burgerlijke stand geeft de rechter in eerste aanleg onverwijld kennis:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel301
  - number: 301.1.a
    text: van het overlijden van ieder die minderjarige kinderen achterlaat;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel301
  - number: 301.1.b
    text: van de aangifte van de geboorte van ieder kind, waarover de moeder niet van rechtswege het gezag uitoefent.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel301
  - number: '301.2'
    text: 'De ambtenaar van de burgerlijke stand geeft de voogdijraad onverwijld kennis:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel301
  - number: 301.2.a
    text: |-
      van het overlijden van ieder, die minderjarige kinderen nalaat, tenzij van rechtswege in het gezag over deze
      kinderen is voorzien;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel301
  - number: 301.2.b
    text: |-
      van de aangifte van de geboorte van ieder kind, geboren binnen 306 dagen nadat het huwelijk van zijn moeder door de
      dood van haar echtgenoot is ontbonden, en van ieder kind, ten aanzien van wie alleen het moederschap vaststaat;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel301
  - number: 301.2.c
    text: van iedere latere vermelding houdende een erkenning, die is toegevoegd aan een geboorteakte van een minderjarige;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel301
  - number: 301.2.d
    text: van iedere door hem toegevoegde latere vermelding van brieven van vaderschap;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel301
  - number: 301.2.e
    text: |-
      van iedere door hem toegevoegde latere vermelding van een rechterlijke uitspraak die een minderjarige betreft,
      houdende een ontkenning van het vaderschap, vernietiging van een erkenning, gegrondverklaring van een betwisting of
      inroeping van staat of vernietiging van zulk een uitspraak.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel301
  - number: '301.3'
    text: |-
      Indien het huwelijk van de overledene die minderjarige kinderen nalaat, gerechtelijk was ontbonden, of de
      overledene van tafel en bed gescheiden was, bericht de ambtenaar van de burgerlijke stand – zo de andere ouder nog
      leeft – deze omstandigheden tevens aan de voogdijraad; deze zendt alsdan de door hem ontvangen kennisgeving door
      aan de rechter in eerste aanleg die over het verzoek tot ontbinding van het huwelijk of tot scheiding van tafel en
      bed heeft beslist.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel301
  - number: '302.1'
    text: |-
      De rechter kan – mits op haar verzoek of na haar bereidverklaring – de voogdij opdragen aan een hier te lande
      gevestigde rechtspersonen met volledige rechtsbevoegdheid, wier statuten of reglementen duurzame verzorging van
      minderjarigen voorschrijven, en die blijkens schriftelijke door Onze Minister van Justitie aanvaarde verklaring van
      het bestuur zich onderwerpt aan bij algemene maatregel van bestuur gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel302
  - number: '302.2'
    text: |-
      De rechter die de voogdij aan een rechtspersoon opdraagt, let hierbij op de godsdienstige gezindheid en
      levensovertuiging van de minderjarige en van het gezin waartoe deze behoort.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel302
  - number: '302.3'
    text: |-
      Elke voogdij van een rechtspersoon die door fusie ophoudt te bestaan, gaat over op de verkrijgende rechtspersoon,
      mits deze een rechtspersoon is waaraan de rechter krachtens het eerste lid een voogdij kan opdragen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel302
  - number: '302.4'
    text: |-
      Niettemin kan de rechter vervolgens op verzoek van bloed- en aanverwanten van de minderjarige, van de voogdijraad,
      van belanghebbenden of ambtshalve, de voogdij aan een ander opdragen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel302
  - number: '303.1'
    text: |-
      Voor zover de wet niet anders bepaalt, heeft de met voogdij belaste rechtspersoon dezelfde bevoegdheden en
      verplichtingen als andere voogden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel303
  - number: '303.2'
    text: |-
      De uitoefening van de voogdij geschiedt door het bestuur. Dit kan een of meer van zijn leden schriftelijk machtigen
      tot de uitoefening van de voogdij over de minderjarigen die in de machtiging zijn genoemd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel303
  - number: '304.1'
    text: |-
      Met de rechtspersoon zijn de bestuurders hoofdelijk en persoonlijk aansprakelijk voor iedere schade, die te wijten
      is aan een niet-behoorlijke uitoefening van de voogdij.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel304
  - number: '304.2'
    text: |-
      Iedere bestuurder zal zich echter van zijn aansprakelijkheid kunnen bevrijden door te bewijzen, dat hij geen schuld
      heeft aan de schade.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel304
  - number: '304.3'
    text: |-
      Indien het bestuur overeenkomstig [artikel 303, tweede lid][ref1], een of meer van zijn leden in het bijzonder
      tot de uitoefening van de voogdij gemachtigd heeft, wordt vermoed dat de schade uitsluitend aan de schuld van deze
      leden te wijten is.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel303
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel304
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '303'
        paragraaf: '4'
        afdeling: '6'
  - number: '305.1'
    text: |-
      De rechtspersoon, die hem toevertrouwde minderjarigen uit huis plaatst, houdt de voogdijraad binnen wiens gebied
      deze minderjarigen verblijven, alsook de voogdijraad binnen wiens gebied zij vóór hun laatste overplaatsing hebben
      verbleven, schriftelijk op de hoogte van de plaatsen waar zij zich bevinden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel305
  - number: '305.2'
    text: |-
      De plaatsen, waar met voogdij belaste rechtspersonen minderjarigen geplaatst hebben, worden door iedere voogdijraad
      in zijn gebied bezocht, zo vaak hij dit ter beoordeling van de toestand der minderjarigen dienstig acht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel305
  - number: '306.1'
    text: |-
      Zonder toestemming van de rechter in eerste aanleg mag een rechtspersoon een hem toevertrouwde minderjarige niet in
      het buitenland plaatsen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel306
  - number: '306.2'
    text: De rechter verleent deze toestemming slechts, indien hij de plaatsing voor de minderjarige wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel306
  - number: '322'
    text: 'Iedere voogd kan zich van zijn bediening doen ontslaan, indien:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel322
  - number: 322.a
    text: |-
      hij aantoont dat hij ten gevolge van een sedert de aanvang van zijn bediening opgekomen geestelijk of lichamelijk
      gebrek niet meer in staat is deze waar te nemen;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel322
  - number: 322.b
    text: hij de vijfenzestigjarige leeftijd bereikt heeft;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel322
  - number: 322.c
    text: |-
      een daartoe bevoegd persoon zich schriftelijk heeft bereid verklaard de voogdij over te nemen, en de rechter in
      eerste aanleg deze overneming in het belang van de minderjarigen acht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel322
  - number: '324.1'
    text: |-
      Wanneer een voogd op een der in [artikel 246][ref1] genoemde gronden onbevoegd is tot de voogdij, ontslaat de
      rechter in eerste aanleg hem en vervangt hem door een andere voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel246
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel324
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '246'
        afdeling: '1'
  - number: '324.2'
    text: |-
      Hij doet dit op verzoek van de voogd, bloed- of aanverwanten van de minderjarige, de voogdijraad, schuldeisers of
      andere belanghebbenden, of ambtshalve.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel324
  - number: '325'
    text: «r»
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel325
  - number: '326.1'
    text: Kinderen die onder voogdij staan van natuurlijke personen, kunnen onder toezicht worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel326
  - number: '326.2'
    text: |-
      Op deze ondertoezichtstelling zijn de [artikelen 254 tot en met 263][ref1] en [265][ref2] van overeenkomstige
      toepassing, met dien verstande nochtans dat deze ondertoezichtstelling ook door de voogd kan worden verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel254
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel265
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel326
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '254'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '265'
        afdeling: '4'
  - number: '326.3'
    text: |-
      De kosten, bedoeld in [artikel 264][ref1], komen ten laste van de ouders, of – indien deze onvermogend dan wel
      overleden zijn – van de minderjarige zelf.Voor zover ook deze laatste onvermogend is, blijven zij ten laste van de
      Staat. Op de kosten die ten laste van de ouders komen, is [artikel 402a][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel264
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel402a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel326
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '264'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: 402a
        afdeling: '1'
  - number: '326.4'
    text: |-
      Voor de toepassing van het derde lid wordt een stiefouder die krachtens [titel 17][ref1] verplicht is tot het
      verstrekken van levensonderhoud, met een ouder gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel326
    references:
      - id: ref1
        bwb_id: BWBR0028743
  - number: '327'
    text: |-
      1 Indien de rechter in eerste aanleg dit in het belang van die minderjarigen noodzakelijk oordeelt, kan hij
      een voogd ten aanzien van een of meer tot een zelfde voogdij behorende minderjarigen ontzetten op grond van: a.
      slecht levensgedrag; b. misbruik van zijn bevoegdheid, verwaarlozing van zijn verplichtingen, of de omstandigheid
      dat hij niet in staat is tot een behoorlijke uitoefening van zijn voogdij; c. de omstandigheid, dat hij op
      een der beide voorgaande gronden van een andere voogdij – of op overeenkomstige gronden van het ouderlijk
      gezag – is ontzet; d. de omstandigheid dat hij in staat van faillissement verkeert; e. de omstandigheid dat
      hij in persoon, of dat zijn vader, moeder, echtgenoot of kind met de minderjarige een proces voert, waarbij
      diens staat of een aanmerkelijk gedeelte van diens vermogen betrokken is; f. onherroepelijke veroordeling: 1°
      wegens opzettelijke deelneming aan enig misdrijf met een onder zijn gezag staande minderjarige; 2° wegens het
      plegen tegen de minderjarige van een der misdrijven, omschreven in de [titels XIII tot en met XV][ref1] en
      [XVIII tot en met XX van het tweede boek van het Wetboek van Strafrecht BES][ref2]; 3° tot een vrijheidsstraf van
      twee jaar of langer; g. het in ernstige mate veronachtzamen van de aanwijzingen van de gezinsvoogd of belemmering
      van een krachtens de [artikelen 262][ref3] en [263][ref4] bevolen opneming; h. het bestaan van gegronde vrees voor
      verwaarlozing van de belangen van een onder zijn gezag staande minderjarige, doordat hij de minderjarige terugeist
      of terugneemt van anderen, die diens verzorging en opvoeding op zich hebben genomen; i. de omstandigheid dat hij
      niet beschikt over de ingevolge [artikel 2 van de Wet opneming buitenlandse kinderen ter adoptie][ref5] vereiste
      beginseltoestemming.

      2 Onder misdrijf wordt in het eerste lid begrepen medeplichtigheid aan en poging tot misdrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0028570
      [ref2]: https://wetten.overheid.nl/BWBR0028570
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel262
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel263
      [ref5]: https://wetten.overheid.nl/BWBR0004447#Artikel2
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0028570
      - id: ref2
        bwb_id: BWBR0028570
      - id: ref3
        bwb_id: BWBR0028743
        artikel: '262'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0028743
        artikel: '263'
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0004447
        artikel: '2'
  - number: '328'
    text: |-
      Ontzetting van een met voogdij belaste rechtspersoon kan slechts op de in
      [artikel 327, eerste lid, onderdelen b tot en met e][ref1], genoemde gronden geschieden. Zijn ontzetting kan echter
      bovendien plaats hebben, indien hij nalaat de voogdijraad overeenkomstig [artikel 305][ref2] op de hoogte te houden
      van de plaatsen waar de hem toevertrouwde minderjarigen zich bevinden, dan wel indien hij het door de voogdijraad
      uit te oefenen toezicht belemmert of verhindert.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel327
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel305
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel328
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '327'
        paragraaf: '8'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '305'
        paragraaf: '4'
        afdeling: '6'
  - number: '329.1'
    text: |-
      Ontzetting van de voogdij kan slechts worden uitgesproken op verzoek van een der bloed- of aanverwanten van de
      minderjarige tot en met de vierde graad, de voogdijraad, of op vordering van het Openbaar Ministerie.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel329
  - number: '329.2'
    text: |-
      In het geval, bedoeld in [artikel 327, eerste lid, onderdeel h][ref1], kan de ontzetting bovendien verzocht worden
      door hem die de verzorging en opvoeding van de minderjarige op zich heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel327
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '327'
        paragraaf: '8'
        afdeling: '6'
  - number: '329.3'
    text: |-
      In het geval, bedoeld in [artikel 367][ref1], kan de rechter in eerste aanleg de ontzetting uitspreken, ook al had
      de voogdijraad deze niet verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel367
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '367'
        paragraaf: '10'
        afdeling: '6'
  - number: '331.1'
    text: |-
      Indien de rechter in eerste aanleg dit in het belang van de kinderen noodzakelijk acht, kan hij een voogd wiens
      ontzetting verzocht of gevorderd is, hangende haar onderzoek geheel of gedeeltelijk in de uitoefening van zijn
      voogdij over een of meer der minderjarigen schorsen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel331
  - number: '331.2'
    text: |-
      Bij schorsing van de voogd vertrouwt de rechter de minderjarigen voorlopig toe aan de voogdijraad, waarbij hij
      deze laatste ten aanzien van persoon en vermogen der minderjarigen zodanige bevoegdheden verleent als hij geschikt
      zal achten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel331
  - number: '331.3'
    text: |-
      De in het eerste en tweede lid bedoelde beschikkingen blijven van kracht totdat de uitspraak omtrent de ontzetting
      in kracht van gewijsde is gegaan. De rechter in eerste aanleg kan zodanige beschikking evenwel met ingang van een
      vroeger tijdstip herroepen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel331
  - number: '332'
    text: |-
      Op grond van feiten die tot ontzetting van de voogdij kunnen leiden, kan de officier van justitie, indien hij dit
      in het belang van de minderjarigen noodzakelijk acht, hen aan het gezag van de voogd onttrekken en voorlopig aan de
      voogdijraad toevertrouwen. [Artikel 272, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel272
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel332
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '272'
        afdeling: '5'
  - number: '333.1'
    text: |-
      De kosten die de voogdijraad ten behoeve van de hem toevertrouwde minderjarige maakt, komen ten laste van de
      ouders, of – indien deze onvermogend dan wel overleden zijn – van de minderjarige zelf. Voor zover ook deze laatste
      onvermogend is, blijven zij ten laste van de Staat met inachtneming van de regels dienaangaande bij algemene
      maatregel van bestuur te stellen. Op de kosten die ten laste van de ouders komen, is [artikel 402a][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel402a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel333
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 402a
        afdeling: '1'
  - number: '333.2'
    text: |-
      Voor de toepassing van het eerste lid wordt een stiefouder die krachtens [titel 17][ref1] verplicht is tot het
      verstrekken van levensonderhoud, met een ouder gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel333
    references:
      - id: ref1
        bwb_id: BWBR0028743
  - number: '334.1'
    text: Indien de rechter in eerste aanleg de ontzetting uitspreekt, voorziet hij tevens in het gezag.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel334
  - number: '334.2'
    text: |-
      Ieder die tot uitoefening van het gezag bevoegd is, kan tijdens het onderzoek schriftelijk aan de rechter verzoeken
      daarmede te worden belast.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel334
  - number: '335'
    text: |-
      Hij die van de voogdij over een bepaalde minderjarige is ontzet, kan niet wederom tot voogd over die minderjarige
      worden benoemd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel335
  - number: '336'
    text: De voogd draagt zorg dat de minderjarige overeenkomstig diens vermogen wordt verzorgd en opgevoed.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel336
  - number: 336a.1
    text: |-
      Indien de minderjarige door een ander of anderen dan zijn voogd, als behorende tot het gezin met instemming van de
      voogd ten minste een jaar is verzorgd en opgevoed geworden, kan de voogd niet dan met toestemming van degenen die
      de verzorging en opvoeding op zich hebben genomen, wijziging in het verblijf van de minderjarige brengen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel336a
  - number: 336a.2
    text: |-
      Voor zover de volgens het eerste lid vereiste toestemmingen niet worden verkregen, kunnen zij op verzoek van de
      voogd door die van de rechter in eerste aanleg worden vervangen. Dit verzoek wordt slechts ingewilligd, indien de
      rechter dit in het belang van de minderjarige acht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel336a
  - number: 336a.3
    text: |-
      In geval van afwijzing van het verzoek is de beschikking van kracht gedurende een door de rechter in eerste aanleg
      te bepalen termijn, welke de duur van zes maanden niet te boven mag gaan. Is echter voor het einde van deze termijn
      een verzoek of vordering tot ondertoezichtstelling van het kind, tot ontzetting van de voogd, dan wel een verzoek
      als bedoeld in [artikel 299a][ref1], aanhangig gemaakt, dan blijft de beschikking gelden totdat op het verzoek of
      de vordering bij gewijsde is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel299a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel336a
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 299a
        paragraaf: '3'
        afdeling: '6'
  - number: '337.1'
    text: De voogd vertegenwoordigt de minderjarige in burgerlijke handelingen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel337
  - number: '337.2'
    text: |-
      De voogd moet het bewind over het vermogen van de minderjarige als een goed voogd voeren. Bij slecht bewind is hij
      voor de daardoor veroorzaakte schade aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel337
  - number: '337.3'
    text: |-
      Indien goederen die de minderjarige geschonken of vermaakt zijn, onder bewind zijn gesteld, is de voogd bevoegd van
      de bewindvoerder rekening en verantwoording te vorderen.Vervalt dit bewind, dan komen de goederen onder het bewind
      van de voogd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel337
  - number: '338.1'
    text: |-
      De voogd zorgt dat het vermogen van de minderjarige, zoals dit bij het begin van zijn voogdij is samengesteld, zo
      spoedig mogelijk wordt geïnventariseerd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel338
  - number: '338.2'
    text: |-
      Binnen acht weken na het begin van zijn voogdij doet de voogd ter griffie van het gerecht in eerste aanleg van
      de woonplaats van de minderjarige schriftelijk opgave van de bij dat begin aanwezige gerede gelden, effecten aan
      toonder en spaarbankboekjes.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel338
  - number: '338.3'
    text: |-
      Binnen acht maanden na het begin van zijn voogdij levert de voogd een ter bevestiging van haar deugdelijkheid
      door hem ondertekende boedelbeschrijving in ter griffie van het gerecht in eerste aanleg van de woonplaats van
      de minderjarige.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel338
  - number: '338.4'
    text: |-
      In de boedelbeschrijving is begrepen een opgave van de wijzigingen in de samenstelling van het vermogen tot het
      ogenblik dat zij wordt opgemaakt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel338
  - number: '339.1'
    text: |-
      Wanneer de goederen van de minderjarigen een waarde van USD 14000,– niet te boven gaan, kan de voogd een door hem
      ondertekende, volgens een door de Minister van Justitie vastgesteld model opgemaakte, verklaring daaromtrent in
      plaats van de boedelbeschrijving inleveren. De voogd van twee of meer kinderen van dezelfde ouders kan met een
      zodanige verklaring slechts volstaan, wanneer bovendien de goederen der minderjarigen te zamen een waarde van
      USD 28000,– niet te boven gaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel339
  - number: '339.2'
    text: |-
      De rechter in eerste aanleg kan te allen tijde bepalen dat alsnog een beschrijving van het vermogen van de
      minderjarige, zoals dit op de datum van zijn beschikking is samengesteld, met overeenkomstige toepassing van
      [artikel 338][ref1] moet worden opgemaakt en ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel388
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel339
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '388'
  - number: '339.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen de bedragen, genoemd in het eerste lid, worden aangepast aan de
      geldontwaarding.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel339
  - number: '340.1'
    text: |-
      De rechter in eerste aanleg kan bij gebleken noodzakelijkheid een langere termijn voor de inlevering van een
      boedelbeschrijving of een verklaring als bedoeld in [artikel 339][ref1], stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel339
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel340
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
  - number: '340.2'
    text: |-
      Indien binnen de daarvoor gestelde termijn geen boedelbeschrijving, noch een verklaring als bedoeld in
      [artikel 339][ref1] is ingeleverd, doet de rechter binnen tien dagen na het einde van die termijn de voogd ten
      verhore oproepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel339
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel340
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
  - number: '341.1'
    text: |-
      In de boedelbeschrijving of in de verklaring, bedoeld in [artikel 339][ref1], moet de voogd opgeven wat hij van de
      minderjarige heeft te vorderen. Bij gebreke hiervan zal hij zijn vorderingsrecht niet voor diens meerderjarigheid
      kunnen uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel339
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel341
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
  - number: '341.2'
    text: Zolang de voogd zijn vorderingsrecht niet kan uitoefenen, draagt de hoofdsom van zijn vordering geen rente.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel341
  - number: '342.1'
    text: |-
      De [artikelen 338 tot en met 341][ref1] zijn van overeenkomstige toepassing wanneer de minderjarige gedurende de
      voogdij door schenking, erfopvolging of making vermogen krijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel338
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel342
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '338'
        paragraaf: '10'
        afdeling: '6'
  - number: '342.2'
    text: |-
      De ontvanger, bedoeld in [artikel 1.3, onderdeel k, van de Belastingwet BES][ref1] aan wie ambtshalve bekend is
      dat de minderjarige vermogen heeft verkregen, is verplicht de rechter in eerste aanleg van diens woonplaats hiervan
      te verwittigen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel1
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel342
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '1'
  - number: '343'
    text: |-
      De voogd kan, onverminderd zijn aansprakelijkheid voor de door zijn slecht bewind veroorzaakte schade, voor de
      minderjarige alle handelingen verrichten die hij in diens belang noodzakelijk, nuttig of wenselijk acht, behoudens
      het bepaalde bij de volgende artikelen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel343
  - number: '344.1'
    text: |-
      Voor zover de rechter in eerste aanleg niet anders bepaalt, geeft de voogd de effecten aan
      toonder van de minderjarige in bewaring bij de Nederlandsche Bank N.V. of een ingevolge de
      [Wet toezicht bank- en kredietwezen 1994 BES][ref1] geregistreerde kredietinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0028547
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel344
    references:
      - id: ref1
        bwb_id: BWBR0028547
  - number: '344.2'
    text: |-
      De rechter kan aanwijzingen geven omtrent de wijze waarop spaarbankboekjes en gelden van de minderjarige
      moeten worden bewaard. De rechter onder wiens goedkeuring een verdeling tot stand komt, kan ter
      gelegenheid daarvan aanwijzingen als hier bedoeld geven. Overigens is de rechter, aangewezen in
      [artikel 429c van het Wetboek van Burgerlijke Rechtsvordering BES][ref1], bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel429c
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel344
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: 429c
  - number: '344.3'
    text: |-
      Voor effecten aan toonder, spaarbankboekjes en gelden, die de minderjarige te zamen met een of meer
      andere personen toekomen, geldt het eerste en tweede lid, wanneer de voogd die onder zijn berusting
      heeft. De rechter in eerste aanleg onder wiens goedkeuring een verdeling tot stand komt, kan ter
      gelegenheid daarvan aanwijzingen geven. Overigens is de rechter in eerste aanleg, aangewezen in
      [artikel 429c van het Wetboek van Burgerlijke Rechtsvordering BES][ref1], bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel429c
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel344
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: 429c
  - number: '345.1'
    text: |-
      De voogd behoeft machtiging van de rechter in eerste aanleg om de navolgende handelingen voor rekening van de
      minderjarige te verrichten:
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel345
  - number: 345.1.a
    text: |-
      aangaan van overeenkomsten strekkende tot beschikking over goederen van de minderjarige, tenzij de handeling geld
      betreft, als een gewone beheersdaad kan worden beschouwd, of krachtens rechterlijk bevel geschiedt;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel345
  - number: 345.1.b
    text: giften doen, andere dan gebruikelijke, niet bovenmatige;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel345
  - number: 345.1.c
    text: een making of gift, waaraan lasten of voorwaarden zijn verbonden, aannemen;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel345
  - number: 345.1.d
    text: geld lenen of de minderjarige als borg of hoofdelijke medeschuldenaar verbinden;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel345
  - number: 345.1.e
    text: overeenkomen dat een boedel waartoe de minderjarige gerechtigd is, voor een bepaalde tijd onverdeeld wordt gelaten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel345
  - number: '345.2'
    text: |-
      De rechter in eerste aanleg kan bepalen dat de voogd zijn machtiging behoeft voor het innen van vorderingen van de
      minderjarige, het disponeren over saldi bij giro- of kredietinstellingen daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel345
  - number: '345.3'
    text: |-
      Voor het aangaan van een overeenkomst tot beëindiging van een geschil waarbij de minderjarige is betrokken, behoeft
      de voogd geen machtiging in het geval van [artikel 20 van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] of
      indien het voorwerp van de onzekerheid of het geschil een waarde van USD 840,– niet te boven gaat, noch indien de
      overeenkomst als een beheersdaad is te beschouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel20
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel345
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '20'
  - number: '345.4'
    text: |-
      Bij algemene maatregel van bestuur kan het bedrag, genoemd in het derde lid, worden aangepast aan de
      geldontwaarding.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel345
  - number: '346.1'
    text: |-
      De voogd kan geen goederen van de minderjarige kopen of huren zonder dat de rechter in eerste aanleg de te sluiten
      overeenkomst goedkeurt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel346
  - number: '346.2'
    text: In geval van openbare verkoop of verhuur moet de goedkeuring binnen een maand daarna zijn aangevraagd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel346
  - number: '347.1'
    text: |-
      Een in strijd met [artikel 345][ref1] of [346][ref2] verrichte rechtshandeling ten name van de minderjarige is
      vernietigbaar; op de vernietigingsgrond kan slechts een beroep worden gedaan van de zijde van de minderjarige.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel345
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel346
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel347
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '345'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '346'
        paragraaf: '10'
        afdeling: '6'
  - number: '347.2'
    text: |-
      Het eerste lid geldt niet voor een rechtshandeling anders dan om niet, indien de wederpartij te goeder trouw was en
      voor een rechtshandeling die de minderjarige geen nadeel heeft berokkend.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel347
  - number: '348.1'
    text: |-
      De voogd kan, zonder dat de rechter in eerste aanleg de te sluiten overeenkomst goedkeurt, geen inschuld ten laste
      van de minderjarige, noch enig beperkt recht op diens goederen van een derde verkrijgen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel348
  - number: '348.2'
    text: Ontbreekt deze goedkeuring, dan is de overeenkomst nietig.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel348
  - number: '349.1'
    text: |-
      Een voogd die zonder machtiging van de rechter in eerste aanleg voor de minderjarige als eiser in rechte optreedt
      of tegen een uitspraak beroep instelt, wordt niet-ontvankelijk verklaard.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel349
  - number: '349.2'
    text: |-
      De voogd mag niet zonder machtiging van de rechter in een tegen de minderjarige ingestelde eis of in een gedane
      uitspraak berusten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel349
  - number: '349.3'
    text: |-
      Hij kan, alvorens voor de minderjarige in rechte verweer te voeren of tegen een bij verstek gedane uitspraak verzet
      te doen, zich te zijner verantwoording doen machtigen door de rechter.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel349
  - number: '350.1'
    text: De voogd draagt zorg voor een doelmatige belegging van het vermogen van de minderjarige.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel350
  - number: '350.2'
    text: |-
      Hij behoeft voor elke belegging van gelden van de minderjarige machtiging van de rechter in eerste aanleg. Nochtans
      mag hij, voor zover de rechter niet anders bepaalt, zonder diens machtiging gelden ten name van de minderjarige
      beleggen bij een ingevolge de [Wet toezicht bank- en kredietwezen 1994 BES][ref1] geregistreerde kredietinstelling
      op rekeningen, bestemd voor de belegging van gelden van minderjarigen, met het beding dat de gelden alleen worden
      terugbetaald met machtiging van de rechter.


      [ref1]: https://wetten.overheid.nl/BWBR0028547
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel350
    references:
      - id: ref1
        bwb_id: BWBR0028547
  - number: '351.1'
    text: |-
      Wanneer het vermogen van de minderjarige of een gedeelte daarvan in een onderneming van handel, landbouw of
      nijverheid is geplaatst, mag de voogd de zaken voor rekening, hetzij van de minderjarige alleen, hetzij van deze
      met anderen, niet voortzetten dan met machtiging van de rechter in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel351
  - number: '351.2'
    text: |-
      Zonder machtiging van de rechter mag de voogd een boedel waartoe de minderjarige gerechtigd is, niet onverdeeld
      laten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel351
  - number: '352'
    text: |-
      Ondanks het ontbreken der vereiste machtiging zijn handelingen, door de voogd verricht in strijd met
      [artikel 350][ref1] of [artikel 351][ref2], geldig.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel350
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel351
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel352
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '350'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '351'
        paragraaf: '10'
        afdeling: '6'
  - number: '353.1'
    text: |-
      De voogd kan een de minderjarige opgekomen erfenis niet anders aanvaarden dan onder het voorrecht van
      boedelbeschrijving.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel353
  - number: '353.2'
    text: |-
      Hij kan niet zonder machtiging van de rechter in eerste aanleg een de minderjarige opgekomen erfenis verwerpen,
      noch van een deze toekomend aandeel in een ontbonden huwelijksgemeenschap afstand doen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel353
  - number: '354'
    text: |-
      De rechter in eerste aanleg kan te allen tijde de voogd ten verhore doen oproepen. Deze is verplicht alle door de
      rechter gewenste inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel354
  - number: '355.1'
    text: |-
      Aan een met het gezag belaste ouder of aan een ouder die alleen het bewind over het vermogen heeft en die aangifte
      heeft gedaan van zijn voornemen een huwelijk aan te gaan, kan de rechter in eerste aanleg opdragen binnen een
      bepaalde termijn een beschrijving van het vermogen van de kinderen op te maken en deze beschrijving of een
      afschrift daarvan ter griffie van het gerecht in te leveren.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel355
  - number: '355.2'
    text: |-
      De [artikelen 339][ref1], [340][ref2] en [341][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel339
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel340
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel341
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel355
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0028743
        artikel: '340'
        paragraaf: '10'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0028743
        artikel: '341'
        paragraaf: '10'
        afdeling: '6'
  - number: '356.1'
    text: |-
      Aanwijzingen en machtigingen, als in deze paragraaf bedoeld, geeft de rechter in eerste aanleg slechts, indien dit
      hem in het belang van de minderjarige noodzakelijk, nuttig of wenselijk blijkt te zijn. Hij kan een bijzondere of
      een algemene machtiging geven en daaraan zodanige voorwaarden verbinden als hij dienstig oordeelt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel356
  - number: '356.2'
    text: Hij kan een gegeven aanwijzing of machtiging te allen tijde intrekken of de daaraan verbonden voorwaarden wijzigen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel356
  - number: '357'
    text: |-
      Indien de kosten van een ten behoeve van een minderjarige bevolen maatregel bij rechterlijke beschikking te diens
      laste zijn gebracht, treedt – in geval dientengevolge het vermogen van de minderjarige moet worden aangesproken –
      in de plaats van de bij [artikel 345][ref1] bedoelde machtiging van de rechter in eerste aanleg, diens aanwijzing
      van de goederen die verkocht of bezwaard zullen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel345
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel357
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '345'
        paragraaf: '10'
        afdeling: '6'
  - number: '358.1'
    text: |-
      De voogd mag alle noodzakelijke, betamelijke en behoorlijk gerechtvaardigde uitgaven aan de minderjarige in
      rekening brengen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel358
  - number: '358.2'
    text: |-
      Indien de rechter in eerste aanleg een bedrag bepaalt hetwelk jaarlijks mag worden besteed voor de verzorging en
      opvoeding van de minderjarige of voor de kosten van het beheer van diens vermogen, behoeft de voogd de besteding
      van dat bedrag niet gespecificeerd te verantwoorden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel358
  - number: '358.3'
    text: |-
      De rechter kan de voogd een beloning ten laste van de minderjarige toekennen, indien hij dit gezien de zwaarte van
      de last van het bewind redelijk acht. Buiten dit geval mag de voogd voor zichzelf geen loon berekenen, tenzij hem
      dat is toegekend bij de akte, waarbij hij door een ouder benoemd is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel358
  - number: '359.1'
    text: |-
      De rechter in eerste aanleg kan te allen tijde ambtshalve aan de voogd de verplichting opleggen jaarlijks of eens
      in de twee of drie jaren ter griffie van het gerecht een rekening in te dienen van zijn bewind over de goederen van
      de minderjarige.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel359
  - number: '359.2'
    text: De datum voor de indiening van de rekening wordt door de rechter bepaald.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel359
  - number: '360.1'
    text: Bij verschil van mening omtrent de rekening kan de rechter in eerste aanleg verbetering daarvan gelasten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel360
  - number: '360.2'
    text: Hij kan een of meer deskundigen benoemen, ten einde de ingediende rekening te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel360
  - number: '360.3'
    text: |-
      De rechter kan de kosten van dit onderzoek, indien slecht bewind aan het licht is gekomen, geheel of ten dele ten
      laste van de voogd brengen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel360
  - number: '360.4'
    text: De voogd ontvangt een afschrift van het door de deskundigen in te dienen schriftelijk bericht.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel360
  - number: '361'
    text: |-
      De periodiek door de voogd gedane rekening of een eensluidend afschrift daarvan blijft berusten ter griffie van het
      gerecht in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel361
  - number: '362'
    text: |-
      De rechter in eerste aanleg kan ambtshalve de schade vaststellen die blijkens de rekening de minderjarige door
      slecht bewind van de voogd geleden heeft, en deze laatste tot vergoeding daarvan veroordelen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel362
  - number: '363.1'
    text: |-
      De rechter in eerste aanleg kan te allen tijde bevelen dat de voogd voor zijn bewind zekerheid stelt. Hij stelt
      het bedrag en de aard van de zekerheid vast. Inpandgeving van effecten aan toonder van de voogd geschiedt door hun
      inbewaargeving bij de Nederlandsche Bank N.V.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel363
  - number: '363.2'
    text: |-
      De rechter bepaalt een redelijke termijn binnen welke de voogd hem te zijnen genoegen moet aantonen dat hij de van
      hem verlangde zekerheid gesteld heeft.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel363
  - number: '363.3'
    text: |-
      De rechter kan de voogd toestaan een gestelde zekerheid door een andere te vervangen. Indien het belang van de
      voogd het vervallen van een gestelde zekerheid volstrekt eist of handhaving daarvan niet nodig is, kan de rechter
      hem machtigen daarvan namens de minderjarige afstand te doen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel363
  - number: '364.1'
    text: |-
      De door de voogd gestelde zekerheid houdt op, zodra zijn rekening en verantwoording is goedgekeurd, of zodra de
      rechtsvorderingen die zijn bewind betreffen overeenkomstig [artikel 377][ref1] verjaard zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel364
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '377'
        paragraaf: '11'
        afdeling: '6'
  - number: '364.2'
    text: |-
      Alsdan worden op kosten van de minderjarige hypothecaire inschrijvingen doorgehaald en pandrechten op
      inschrijvingen in de grootboeken der nationale schuld.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel364
  - number: '365'
    text: 'Indien de voogd in gebreke blijft:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel365
  - number: 365.a
    text: gehoor te geven aan een oproeping van de rechter in eerste aanleg om voor hem te verschijnen;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel365
  - number: 365.b
    text: |-
      een boedelbeschrijving of een verklaring als bedoeld in [artikel 339][ref1] in te leveren;


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel339
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel365
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
  - number: 365.c
    text: op de door de rechter bepaalde datum zijn periodieke rekening in te dienen;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel365
  - number: 365.d
    text: |-
      aan de minderjarige toebehorende spaarbankboekjes, gelden, of toondereffecten die hij niet te diens name heeft doen
      stellen, op de voorgeschreven wijze te bewaren;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel365
  - number: 365.e
    text: de rechter het bewijs te leveren dat hij een van hem verlangde zekerheid gesteld heeft; of
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel365
  - number: 365.f
    text: |-
      de schadevergoeding te betalen waartoe de rechter hem ingevolge [artikel 362][ref1] veroordeeld heeft, kan de
      rechter de voogdijraad hiervan in kennis stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel362
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel365
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '362'
        paragraaf: '10'
        afdeling: '6'
  - number: '366'
    text: 'Insgelijks kan de rechter in eerste aanleg de voogdijraad ervan in kennis stellen, dat:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel366
  - number: 366.a
    text: de voogd in gevallen waarin hij machtiging van de rechter behoeft, zijn bewind eigenmachtig voert;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel366
  - number: 366.b
    text: |-
      de voogd zich in zijn bewind aan ontrouw, plichtsverzuim of misbruik van bevoegdheid blijkt te hebben schuldig
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel366
  - number: '367'
    text: |-
      De voogdijraad die van de rechter in eerste aanleg zodanige mededeling ontvangt, onderwerpt, na onderzoek
      van de overige gedragingen van de voogd jegens de minderjarige, binnen zes weken na de dagtekening
      van die mededeling aan het oordeel van de rechter de vraag of ontzetting van de voogd op grond van
      [artikel 327, eerste lid, onderdeel b][ref1], moet volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel327
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel367
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '327'
        paragraaf: '8'
        afdeling: '6'
  - number: '369.1'
    text: |-
      Indien minderjarigen die onder voogdij van verschillende voogden staan, goederen gemeen hebben, kan de rechter
      in eerste aanleg van de woonplaats van een der minderjarigen een van de voogden of een derde aanwijzen om over
      deze goederen tot de verdeling het bewind te voeren. De aangewezen bewindvoerder stelt de door de rechter van hem
      verlangde waarborgen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel369
  - number: '369.2'
    text: |-
      Komt de in het eerste lid omschreven bevoegdheid aan verschillende rechters toe, dan vervalt deze nadat een van hen
      daarvan heeft gebruik gemaakt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel369
  - number: '369.3'
    text: |-
      Op het bewind zijn de bepalingen omtrent het bewind van een voogd van overeenkomstige toepassing. De bewindvoerder
      is bij uitsluiting bevoegd tot vernietiging van rechtshandelingen van de minderjarige, strekkend tot beheer of
      beschikking met betrekking tot de onder bewind staande goederen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel369
  - number: '370.1'
    text: |-
      De rechter in eerste aanleg kan op verzoek van de voogd of ambtshalve, het vermogen van de minderjarige of een deel
      daarvan, met inbegrip van de vruchten, voor de duur van diens minderjarigheid onder bewind stellen, indien hij dit
      in het belang van de minderjarige nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel370
  - number: '370.2'
    text: |-
      De rechter benoemt de bewindvoerder en bepaalt het aan deze toekomende loon. Hij kan bij de instelling van
      het bewind bepalen dat de voogd de door de onderbewindstelling veroorzaakte kosten, met inbegrip van het loon,
      geheel of gedeeltelijk aan de minderjarige moet vergoeden, alsmede dat de voogd, behoudens zijn verhaal op de
      bewindvoerder, voor diens verrichtingen aansprakelijk is jegens de minderjarige.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel370
  - number: '370.3'
    text: |-
      Op het bewind zijn de bepalingen omtrent het bewind van een voogd van overeenkomstige toepassing. De bewindvoerder
      is bij uitsluiting bevoegd tot vernietiging van rechtshandelingen van de minderjarige, strekkend tot beheer of
      beschikking met betrekking tot de onder bewind staande goederen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel370
  - number: '370.4'
    text: |-
      De rechter bepaalt welke uitkeringen de bewindvoerder uit de onder het bewind gestelde goederen en de vruchten
      daarvan aan de voogd moet doen ten behoeve van de verzorging en opvoeding van de minderjarige of ten behoeve van
      het beheer van diens niet onder het bewind gestelde goederen. Hij kan deze beschikkingen te allen tijde op verzoek
      van de voogd of de bewindvoerder of ambtshalve wijzigen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel370
  - number: '370.5'
    text: De bewindvoerder is verplicht aan de rechter te allen tijde alle door deze gewenste inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel370
  - number: '370.6'
    text: |-
      Hij is voorts verplicht jaarlijks en aan het einde van zijn bewind aan de voogd, de meerderjarig gewordene of de
      erfgenamen van de minderjarige, wanneer deze overleden is, ten overstaan van de rechter rekening en verantwoording
      af te leggen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel370
  - number: '370.7'
    text: Geschillen die bij de rekening en verantwoording rijzen, beslist de rechter.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel370
  - number: '370.8'
    text: |-
      Blijft een der partijen in gebreke tot deze aflegging van rekening en verantwoording mede te werken, dan zijn de
      [artikelen 771 en volgende van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel771
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel370
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '771'
  - number: '370.9'
    text: |-
      De rechter kan te allen tijde op verzoek van de bewindvoerder, de voogd of ambtshalve het bewind opheffen of de
      bewindvoerder ontslaan en door een ander vervangen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel370
  - number: '371'
    text: |-
      De voogd is verplicht ter griffie van het gerecht in eerste aanleg kennis te geven van elke verandering in zijn
      woonplaats.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel371
  - number: 371a.1
    text: |-
      De griffier van het gerecht dat een voogd benoemt, doet daarvan onverwijld mededeling aan het gerecht in eerste
      aanleg van de woonplaats van de voogd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel371a
  - number: 371a.2
    text: |-
      Woont de voogd niet meer binnen het rechtsgebied of is hij opgevolgd door een voogd binnen een ander rechtsgebied,
      dan zendt de griffier onverwijld de voogdijbescheiden naar de griffier van het gerecht waar de voogd of opvolgende
      voogd woonplaats heeft, onder opgave van diens adres.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel371a
  - number: '372'
    text: |-
      Na het einde van zijn bewind doet de voogd daarvan onverwijld rekening en verantwoording. De kosten worden door
      de voogd betaald. Zij komen echter ten laste van de minderjarige, tenzij het bewind wegens ontzetting van de voogd
      eindigt. Voor zover de kosten niet op de minderjarige kunnen worden verhaald, komen zij ten laste van de ouders,
      en, zo zij ook op hen niet kunnen worden verhaald, ten laste van de Staat.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel372
  - number: '373'
    text: |-
      Deze rekening en verantwoording doet de voogd hetzij aan de meerderjarig gewordene, hetzij aan de erfgenamen van de
      minderjarige, wanneer deze overleden is, hetzij aan zijn opvolger in het bewind.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel373
  - number: '374.1'
    text: |-
      Bedoelde rekening en verantwoording wordt afgelegd ten overstaan van de rechter in eerste aanleg binnen wiens
      rechtsgebied de voogd wiens bewind eindigt, woonplaats heeft.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel374
  - number: '374.2'
    text: Over geschillen die bij de aflegging van de rekening en verantwoording mochten rijzen, beslist de rechter.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel374
  - number: '374.3'
    text: |-
      Blijft een der partijen in gebreke tot deze aflegging van rekening en verantwoording mede te werken, dan zijn de
      [artikelen 771 en volgende van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel771
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel374
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '771'
  - number: '375'
    text: |-
      Een rechtshandeling die de meerderjarig gewordene betreffende de voogdij of de voogdijrekening richt tot of
      verricht met de voogd, is vernietigbaar, indien zij geschiedt vóór het afleggen van de rekening en verantwoording;
      alleen van de zijde van de meerderjarig gewordene kan een beroep op de vernietigingsgrond worden gedaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel375
  - number: '376'
    text: |-
      Wat de minderjarige aan de voogd schuldig blijft, draagt geen rente, zolang hij niet – na het sluiten der rekening
      – met de voldoening van het verschuldigde in verzuim is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel376
  - number: '377'
    text: |-
      Elke rechtsvordering op grond van het gevoerde voogdijbewind – zowel van de zijde van de minderjarige als van die
      van de voogd – verjaart door verloop van vijf jaren na de dag waarop de voogdij van laatstgenoemde is geëindigd.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377
  - number: 377a.1
    text: Het kind en de niet met het gezag belaste ouder hebben recht op omgang met elkaar.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377a
  - number: 377a.2
    text: |-
      De rechter in eerste aanleg stelt op verzoek van de ouders of van één van hen, al dan niet voor bepaalde tijd, een
      regeling inzake de uitoefening van het omgangsrecht vast dan wel ontzegt, al dan niet voor bepaalde tijd, het recht
      op omgang.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377a
  - number: 377a.3
    text: 'De rechter ontzegt het recht op omgang slechts, indien:'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377a
  - number: 377a.3.a
    text: omgang ernstig nadeel zou opleveren voor de geestelijke of lichamelijke ontwikkeling van het kind,
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377a
  - number: 377a.3.b
    text: de ouder kennelijk ongeschikt of kennelijk niet in staat moet worden geacht tot omgang,
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377a
  - number: 377a.3.c
    text: |-
      het kind dat twaalf jaren of ouder is, bij zijn verhoor van ernstige bezwaren tegen omgang met zijn ouder heeft
      doen blijken, of
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377a
  - number: 377a.3.d
    text: omgang anderszins in strijd is met zwaarwegende belangen van het kind.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377a
  - number: 377b.1
    text: |-
      De ouder die alleen met het gezag is belast, is gehouden de andere ouder op de hoogte te stellen omtrent gewichtige
      aangelegenheden met betrekking tot de persoon en het vermogen van het kind en deze te raadplegen – zo nodig door
      tussenkomst van derden – over daaromtrent te nemen beslissingen. Op verzoek van een ouder kan de rechter ter zake
      een regeling vaststellen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377b
  - number: 377b.2
    text: |-
      Indien het belang van het kind zulks vereist, kan de rechter zowel op verzoek van de met het gezag belaste ouder
      als ambtshalve bepalen dat het eerste lid buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377b
  - number: 377b.3
    text: |-
      [Artikel 377e][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377e
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377b
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377e
  - number: 377c.1
    text: |-
      Onverminderd [artikel 377b][ref1] wordt de niet met het gezag belaste ouder desgevraagd door derden die
      beroepshalve beschikken over informatie inzake belangrijke feiten en omstandigheden die de persoon van het kind
      of diens verzorging en opvoeding betreffen, daarvan op de hoogte gesteld, tenzij die derde de informatie niet op
      gelijke wijze zou verschaffen aan degene die met het gezag over het kind is belast dan wel bij wie het kind zijn
      gewone verblijfplaats heeft, of het belang van het kind zich tegen het verschaffen van informatie verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377b
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377c
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377b
  - number: 377c.2
    text: |-
      Indien de informatie is geweigerd, kan de rechter op verzoek van de in het eerste lid bedoelde ouder bepalen dat de
      informatie op de door hem aan te geven wijze moet worden verstrekt. De rechter wijst het verzoek in ieder geval af,
      indien het belang van het kind zich tegen het verschaffen van de informatie verzet.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377c
  - number: 377d.1
    text: |-
      Onverminderd het tweede lid begint de uitoefening van het recht op omgang zodra de desbetreffende beschikking in
      kracht van gewijsde is gegaan of, indien zij uitvoerbaar bij voorraad is verklaard, daags nadat de beschikking is
      verstrekt of verzonden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377d
  - number: 377d.2
    text: |-
      De uitoefening van het recht op omgang begint, indien tevens een beschikking inzake het gezag is of wordt gegeven,
      niet eerder dan op het tijdstip waarop voor de andere ouder of voor de voogd het gezag is begonnen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377d
  - number: 377e
    text: |-
      De rechter in eerste aanleg kan op verzoek van de ouders of van een van hen een beslissing inzake de omgang
      alsmede een door de ouders onderling getroffen omgangsregeling wijzigen op grond dat nadien de omstandigheden zijn
      gewijzigd, of dat bij het nemen van de beslissing van onjuiste of onvolledige gegevens is uitgegaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377e
  - number: 377f.1
    text: |-
      Onverminderd [artikel 377a][ref1] kan de rechter op verzoek een omgangsregeling vaststellen tussen het kind en
      degene die in een nauwe persoonlijke betrekking staat tot het kind. De rechter kan het verzoek afwijzen, indien het
      belang van het kind zich tegen toewijzing verzet of indien het kind dat twaalf jaar of ouder is, bezwaar maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377a
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377f
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377a
  - number: 377f.2
    text: |-
      De [artikelen 377d][ref1] en [377e][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377d
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel377e
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377f
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377d
      - id: ref2
        bwb_id: BWBR0028743
        artikel: 377e
  - number: 377g
    text: |-
      De rechter kan, indien hem blijkt dat de minderjarige van twaalf jaar of ouder hierop prijs stelt, ambtshalve
      een beslissing geven op de voet van de [artikelen 377a][ref1], [377b][ref2] of [377f][ref3], dan wel zodanige
      beslissing op de voet van [artikel 377e][ref4] wijzigen. Hetzelfde geldt indien de minderjarige de leeftijd van
      twaalf jaren nog niet heeft bereikt, maar in staat kan worden geacht tot een redelijke waardering van zijn belangen
      ter zake.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377a
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel377b
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel377f
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel377e
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377g
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377a
      - id: ref2
        bwb_id: BWBR0028743
        artikel: 377b
      - id: ref3
        bwb_id: BWBR0028743
        artikel: 377f
      - id: ref4
        bwb_id: BWBR0028743
        artikel: 377e
  - number: 377h.1
    text: |-
      In geval van gezamenlijke gezagsuitoefening kan de rechter op verzoek van de ouders of een van hen een
      regeling vaststellen inzake de omgang tussen het kind en de ouder bij wie het kind zijn gewone verblijfplaats
      niet heeft, of inzake het verschaffen van informatie aan dan wel het raadplegen van die ouder als
      bedoeld in [artikel 377b, eerste lid][ref1], dan wel inzake het verschaffen van informatie als bedoeld in
      [artikel 377c, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377b
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel377c
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377h
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377b
      - id: ref2
        bwb_id: BWBR0028743
        artikel: 377c
  - number: 377h.2
    text: |-
      De [artikelen 377e][ref1] en [377g][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377e
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel377g
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377h
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377e
      - id: ref2
        bwb_id: BWBR0028743
        artikel: 377g
  - number: 377i
    text: In deze Titel wordt verstaan onder
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377i
  - number: 377i.a
    text: |-
      het Europese verdrag: het op 20 mei 1980 te Luxemburg tot stand gekomen Europese Verdrag betreffende de erkenning
      en de tenuitvoerlegging van beslissingen inzake het gezag over kinderen en betreffende het herstel van het gezag
      over kinderen (Trb. 1981, 10);
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377i
  - number: 377i.b
    text: |-
      het Haagse verdrag: het op 25 oktober 1980 te ’s-Gravenhage tot stand gekomen Verdrag inzake de burgerrechtelijke
      aspecten van internationale ontvoering van kinderen (Trb. 1987, 139);
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377i
  - number: 377i.c
    text: |-
      internationale ontvoering van kinderen: de ongeoorloofde overbrenging of het ongeoorloofd niet doen terugkeren van
      een kind in strijd met een gezagsrecht, als omschreven in artikel 3 in verband met artikel 5 onder a van het Haagse
      verdrag;
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377i
  - number: 377i.d
    text: 'Gerecht in eerste aanleg: het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba.'
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377i
  - number: 377j
    text: |-
      Deze wet regelt de incorporatie van de in [artikel 377i][ref1] vermelde verdragen en is tevens van toepassing in
      de gevallen van internationale ontvoering van kinderen die niet door een verdrag worden beheerst.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377i
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377j
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377i
        afdeling: '1'
  - number: 377k.1
    text: |-
      Deze wet is van toepassing op internationale ontvoering van kinderen die de leeftijd van zestien jaren nog niet
      hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377k
  - number: 377k.2
    text: |-
      Bereikt een kind ten aanzien waarvan een verzoek om teruggeleiding in behandeling is de leeftijd van zestien jaren,
      dan wordt de behandeling van dat verzoek ambtshalve gestaakt. Hetzelfde geldt voor maatregelen ter uitvoering van
      een beslissing op een verzoek.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377k
  - number: 377l.1
    text: |-
      Onze Minister van Justitie wijst bij in de Staatscourant openbaar te maken besluit de onder zijn ministerie
      ressorterende dienst, diensten of vertegenwoordigers op de openbare lichamen Bonaire, Sint Eustatius en Saba
      aan, die aldaar wordt of worden belast met de taak van centrale autoriteit, bedoeld in artikel 2 van het Europese
      verdrag en in artikel 6 van het Haagse verdrag. Deze autoriteit is als zodanig tevens belast met de behandeling van
      verzoeken in gevallen van internationale ontvoering van kinderen die niet door een verdrag worden beheerst.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377l
  - number: 377l.2
    text: |-
      De aanwijzing van de centrale autoriteit als bedoeld in het eerste lid staat er niet aan in de weg dat een
      persoon zich rechtstreeks tot de rechter of andere autoriteiten wendt om de erkenning van het wettig gezag over
      een ontvoerd kind, het herstel van dat gezag en de teruggeleiding van dat kind te bereiken, of de vaststelling of
      wijziging van een omgangsregeling te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377l
  - number: 377m.1
    text: |-
      De centrale autoriteit is bevoegd, zo nodig ook zonder uitdrukkelijke volmacht van degene die zich met een verzoek
      tot haar heeft gewend, namens hem, anders dan in rechte, op te treden.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377m
  - number: 377m.2
    text: |-
      De centrale autoriteit draagt zelf alle kosten die aan de uitvoering van haar taak zijn verbonden, voor zover deze
      niet door haar teruggevorderd kunnen worden van de verzoeker of verhaald op de persoon die voor de internationale
      ontvoering van het kind verantwoordelijk is of medeverantwoordelijk is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377m
  - number: 377n.1
    text: |-
      Indien de centrale autoriteit besluit om een verzoek tot teruggeleiding van een kind niet in behandeling te nemen
      of de behandeling van een zodanig verzoek te staken, deelt zij zulks terstond aan de verzoeker mee. De verzoeker
      kan van de centrale autoriteit verlangen, haar beslissing aan hem mee te delen in de vorm van een beschikking met
      vermelding van de gronden die tot de beslissing hebben geleid. De centrale autoriteit deelt haar beschikking bij
      aangetekend schrijven aan de verzoeker mee.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377n
  - number: 377n.2
    text: |-
      De verzoeker kan binnen een maand na de ontvangst van de beschikking daartegen bij het Gerecht in eerste aanleg
      opkomen, bij een bezwaarschrift dat moet worden ingediend door een advocaat. Het Gerecht hoort de verzoeker en
      de centrale autoriteit op het bezwaarschrift. Indien het Gerecht het bezwaar gegrond acht, vernietigt zij de
      beschikking van de centrale autoriteit en geeft zij een met reden omklede beschikking die in haar plaats treedt.
      Tegen de beschikking van het Gerecht staat geen hogere voorziening open behoudens cassatie in het belang der wet.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377n
  - number: 377o
    text: |-
      De centrale autoriteit kan de uitvoering van bepaalde handelingen overeenkomstig door haar te geven aanwijzingen
      opdragen aan de voogdijraad. De bepalingen van deze Afdeling zijn mede van toepassing ten aanzien van de
      voogdijraad.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377o
  - number: 377p
    text: |-
      De gezaghebber en de ambtenaren van de burgerlijke stand verschaffen de centrale autoriteit kosteloos alle
      inlichtingen en verstrekken haar kosteloos en vrij van zegel alle afschriften en uittreksels uit hun registers die
      deze autoriteit van hen vraagt in verband met de uitvoering van haar taak.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377p
  - number: 377q.1
    text: |-
      Indien de centrale autoriteit voor het vinden van de verblijfplaats van een kind in een openbaar lichaam
      medewerking behoeft van ambtenaren, aangesteld voor de uitvoering van de politietaak, kan zij zich voor het
      verkrijgen daarvan wenden tot de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377q
  - number: 377q.2
    text: De officier van justitie behandelt een verzoek om medewerking van de centrale autoriteit met voorrang.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377q
  - number: 377q.3
    text: |-
      De ambtenaar, aangesteld voor de uitvoering van de politietaak die is aangewezen om zijn medewerking te verlenen
      aan de opsporing van de verblijfplaats van een kind mag daartoe elke plaats betreden, voor zover dat redelijkerwijs
      voor de vervulling van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377q
  - number: 377r.1
    text: |-
      De centrale autoriteit stelt de persoon bij wie het ontvoerde kind verblijft bij aangetekende brief in kennis van
      het verzoek tot teruggeleiding en de gronden waarop het berust. Zij geeft in deze mededeling tevens kennis van de
      mogelijkheid dat een verzoek tot afgifte van een rechterlijk bevel tot teruggeleiding kan worden ingediend, indien
      niet binnen een door haar te stellen redelijke termijn vrijwillig aan dat verzoek is voldaan.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377r
  - number: 377r.2
    text: |-
      De centrale autoriteit kan de in het vorige lid bedoelde mededeling achterwege laten, indien naar haar oordeel in
      verband met de omstandigheden van het geval de uiterste spoed geboden is of de vrijwillige medewerking van degene
      bij wie het kind verblijft niet is te verwachten.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377r
  - number: 377s.1
    text: |-
      Het Gerecht in eerste aanleg is, onverminderd de bevoegdheid van de rechter in kort geding, bevoegd tot
      kennisneming van alle zaken met betrekking tot de gedwongen afgifte van een internationaal ontvoerd kind aan
      degene wie het gezag daarover toekomt en de teruggeleiding van een zodanig kind over de Nederlandse grens van het
      betreffende openbare lichaam.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377s
  - number: 377s.2
    text: |-
      Het Gerecht in eerste aanleg is, onverminderd de bevoegdheid van de rechter in kort geding, bevoegd tot de
      kennisneming van alle zaken met betrekking tot de regeling en uitvoering van het omgangsrecht in internationale
      gevallen, daaronder begrepen verzoeken als bedoeld in [artikel 377v][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377v
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377s
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377v
        afdeling: '3'
  - number: 377t
    text: |-
      De in [artikel 377s][ref1] bedoelde zaken worden ingeleid met een verzoekschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel377s
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377t
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: 377s
        afdeling: '3'
  - number: 377u.1
    text: |-
      De gedwongen afgifte van een internationaal ontvoerd kind aan degene aan wie het gezag daarover toekomt en de
      teruggeleiding van een zodanig kind over de Nederlandse grens van een openbaar lichaam is slechts mogelijk op grond
      van een daartoe strekkend bevel van de rechter.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377u
  - number: 377u.2
    text: |-
      De rechter behandelt het verzoek bij voorrang. Het verzoek wordt met gesloten deuren behandeld. De rechter beslist
      niet dan na het kind in de gelegenheid te hebben gesteld hem zijn mening kenbaar te maken, althans na het daartoe
      behoorlijk te hebben opgeroepen, tenzij dit in verband met de lichamelijke of geestelijke toestand van het kind
      onmogelijk is of toepassing moet worden gegeven aan artikel 8 of 9 van het Europese verdrag. Het bepaalde in
      [artikel 802 van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel802
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377u
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '802'
  - number: 377u.3
    text: |-
      In de gevallen waarin geen verdrag toepasselijk is kan de rechter het verzoek afwijzen op de gronden vermeld in de
      artikelen 12, tweede lid, 13 en 20 van het Haagse verdrag.
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377u
  - number: 377u.4
    text: |-
      De rechter kan op verzoek of ambtshalve de voogdijraad belasten met de voorlopige toevertrouwing over het
      kind, indien gevaar bestaat dat het wordt onttrokken aan de tenuitvoerlegging van een bevel als bedoeld
      in het vijfde lid. De beschikking verliest haar kracht van rechtswege als het verzoek wordt afgewezen. De
      [zesde afdeling van titel veertien][ref1] van Boek 1 van het Burgerlijk Wetboek BES inzake voogdij is niet van
      toepassing op de uitoefening van de voorlopige toevertrouwing als bedoeld in de [artikelen 241][ref2], [271][ref3],
      [272][ref4], [331][ref5] en [332][ref6] van dit Boek.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Afdeling6
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel241
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel271
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel272
      [ref5]: https://wetten.overheid.nl/BWBR0028743#Artikel331
      [ref6]: https://wetten.overheid.nl/BWBR0028743#Artikel332
    url: https://wetten.overheid.nl/BWBR0028743/2011-01-01#Artikel377u
    references:
      - id: ref1
        bwb_id: BWBR0028743
        afdeling: '6'
