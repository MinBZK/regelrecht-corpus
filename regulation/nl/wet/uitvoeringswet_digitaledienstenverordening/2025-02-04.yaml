preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om regels te stellen ter uitvoering van verordening
    (EU) 2022/2065 van het Europees Parlement en de Raad van 19 oktober 2022 betreffende een eengemaakte markt voor
    digitale diensten en tot wijziging van Richtlijn 2000/31/EG (digitaledienstenverordening) (PbEU 2022, L 277);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet wordt verstaan onder: - *aanbieder van een tussenhandeldienst:* aanbieder van een tussenhandeldienst
      als bedoeld in artikel 2, eerste lid, van de digitaledienstenverordening;
        - *afnemer van de dienst:* afnemer van de dienst als bedoeld in artikel 3, onderdeel b, van de
      digitaledienstenverordening;
        - *Autoriteit Consument en Markt:* Autoriteit Consument en Markt als bedoeld in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *Autoriteit persoonsgegevens:* Autoriteit persoonsgegevens als bedoeld in
      [artikel 6, eerste lid, van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2];
        - *digitaledienstenraad:* digitaledienstenraad als bedoeld in artikel 61, eerste lid, van de
      digitaledienstenverordening;
        - *digitaledienstenverordening:* [verordening (EU) 2022/2065](32022R2065) van het Europees Parlement en de Raad van
      19 oktober 2022 betreffende een eengemaakte markt voor digitale diensten en tot wijziging van [Richtlijn 2000/31/
      EG](32000L0031) (digitaledienstenverordening) (PbEU 2022, L 277);
        - *zelfstandige last:* de enkele last tot het verrichten van bepaalde handelingen, bedoeld in
      [artikel 5:2, tweede lid, van de Algemene wet bestuursrecht][ref3], ter bevordering van de naleving van wettelijke
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0040940
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 2.1.1
    text: |-
      De Autoriteit Consument en Markt is een bevoegde autoriteit, bedoeld in artikel 49, eerste lid, van de
      digitaledienstenverordening en de digitaledienstencoördinator, bedoeld in artikel 49, tweede lid, van die
      verordening.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.1
  - number: 2.1.2
    text: |-
      De Autoriteit Consument en Markt is bevoegd om de taken uit te voeren en de bevoegdheden uit te oefenen die bij of
      krachtens de digitaledienstenverordening zijn toegekend aan de digitaledienstencoördinator.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.1
  - number: 2.1.3
    text: |-
      De [artikelen 21][ref1] en [22 van de Kaderwet zelfstandige bestuursorganen][ref2] zijn niet van toepassing op de
      Autoriteit Consument en Markt voor de toepassing van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '22'
  - number: 2.1.4
    text: |-
      [Artikel 23 van de Kaderwet zelfstandige bestuursorganen][ref1] vindt slechts toepassing ten aanzien van het door
      de Autoriteit Consument en Markt gevoerde financiële beheer en de administratieve organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel23
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '23'
  - number: 2.2.1
    text: |-
      Met het toezicht op de naleving van de artikelen 9, eerste lid, en vijfde lid, 10, eerste lid, en vijfde lid, 11,
      12, 13, eerste lid, tweede lid, en vierde lid, 14, 15, eerste lid, 16, eerste lid, tweede lid, vierde lid, vijfde
      lid, en zesde lid, 17, eerste lid, derde lid, en vierde lid, 18, 20, eerste lid, derde lid, vierde lid, vijfde
      lid, en zesde lid, 21, eerste lid, tweede alinea, tweede lid, eerste alinea, vierde lid, en vijfde lid, 22, eerste
      lid, derde lid, en zesde lid, eerste volzin, 23, 24, eerste lid, tweede lid, derde lid, en vijfde lid, 25, eerste
      lid, 26, eerste lid, en tweede lid, 28, eerste lid, 30, 31 en 32 van de digitaledienstenverordening is belast de
      Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.2
  - number: 2.2.2
    text: |-
      De toezichthouder beschikt niet over de bevoegdheid, genoemd in
      [artikel 5:19 van de Algemene wet bestuursrecht][ref1], bij de uitoefening van het toezicht, bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 2.3.1
    text: |-
      De Autoriteit Consument en Markt is bevoegd tot oplegging van een bestuurlijke boete van ten hoogste het bedrag,
      genoemd in artikel 52, derde lid, van de digitaledienstenverordening, ter handhaving van de bepalingen, genoemd in
      [artikel 2.2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050739#Artikel2
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0050739
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.3.2
    text: |-
      De bestuurlijke boete, bedoeld in [artikel 12m, eerste lid, van de Instellingswet Autoriteit Consument][ref1],
      bedraagt ten hoogste het bedrag, genoemd in artikel 52, derde lid, van de digitaledienstenverordening, indien die
      boete wordt opgelegd in het kader van de uitvoering van een taak die bij of krachtens deze wet aan de Autoriteit
      Consument en Markt is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel12m
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: 12m
  - number: 2.4.1
    text: |-
      De Autoriteit Consument en Markt is bevoegd tot oplegging van een last onder dwangsom van ten hoogste het bedrag,
      genoemd in artikel 52, vierde lid, van de digitaledienstenverordening, ter handhaving van de bepalingen genoemd in
      [artikel 2.2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050739#Artikel2
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0050739
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.4.2
    text: |-
      De last onder dwangsom, bedoeld in [artikel 12m, derde lid, van de Instellingswet Autoriteit Consument][ref1],
      bedraagt ten hoogste het bedrag, genoemd in artikel 52, vierde lid, van de digitaledienstenverordening, indien de
      last onder dwangsom wordt opgelegd in het kader van de uitvoering van een taak die bij of krachtens deze wet aan de
      Autoriteit Consument en Markt is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel12m
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: 12m
  - number: 2.5.1
    text: |-
      De Autoriteit Consument en Markt kan een zelfstandige last opleggen aan een aanbieder van een tussenhandeldienst in
      de vorm van:
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.5
  - number: 2.5.1.a
    text: een voorlopige maatregel als bedoeld in artikel 51, tweede lid, onderdeel e, van de digitaledienstenverordening;
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.5
  - number: 2.5.1.b
    text: een maatregel als bedoeld in artikel 51, derde lid, onderdeel a, van de digitaledienstenverordening;
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.5
  - number: 2.5.1.c
    text: een maatregel als bedoeld in artikel 51, derde lid, onderdeel b, van de digitaledienstenverordening.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.5
  - number: 2.5.2
    text: Degene tot wie een zelfstandige last als bedoeld in het eerste lid is gericht, handelt overeenkomstig die last.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.5
  - number: 2.6.1
    text: |-
      Voor een zelfstandige last als bedoeld in [artikel 2.5, eerste lid, aanhef en onderdeel c][ref1], is voorafgaande
      machtiging vereist van de rechter-commissaris, belast met de behandeling van strafzaken bij de rechtbank Rotterdam.
      In het verzoek om afgifte van de machtiging wordt gemotiveerd dat de maatregel in verhouding staat tot de aard, de
      ernst, de herhaling en de duur van de inbreuk, zonder onnodige beperking van toegang tot wettelijke informatie door
      afnemers van de betrokken dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0050739#Artikel2
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0050739
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.6.2
    text: |-
      De rechter-commissaris kan het openbaar ministerie, de aanbieder van de tussenhandeldiensten, de
      geadresseerden van de maatregel en eventuele derden met een legitiem belang, bedoeld in artikel 51,
      derde lid, tweede alinea, tweede volzin, van de digitaledienstenverordening, horen alvorens te beslissen.
      [Artikel 171 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel171
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '171'
  - number: 2.6.3
    text: |-
      De Europese Commissie kan schriftelijke opmerkingen maken krachtens artikel 82, tweede lid, eerste alinea, van de
      digitaledienstenverordening indien zij de wens daartoe te kennen heeft gegeven. De rechter-commissaris kan daarvoor
      een termijn vaststellen. Met toestemming van de rechter-commissaris kan de Europese Commissie ook mondelinge
      opmerkingen maken.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.6
  - number: 2.6.4
    text: |-
      In het geval van een verzoek ingevolge artikel 82, tweede lid, tweede alinea, van de digitaledienstenverordening,
      verstrekt de rechter-commissaris aan de Europese Commissie de in die bepaling bedoelde documenten.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.6
  - number: 2.6.5
    text: |-
      Tegen de beslissing van de rechter-commissaris, bedoeld in het eerste lid, staat voor de Autoriteit Consument
      en Markt, voor zover het verzoek om een machtiging niet is toegewezen, binnen veertien dagen beroep open bij de
      rechtbank Rotterdam, sector strafrecht.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.6
  - number: 2.6.6
    text: |-
      De Autoriteit Consument en Markt maakt de machtiging van de rechter-commissaris gelijktijdig met de zelfstandige
      last, bedoeld in [artikel 2.5, eerste lid, aanhef en onderdeel c][ref1], bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0050739#Artikel2
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0050739
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.6a
    text: |-
      De Autoriteit Consument en Markt maakt jaarlijks een overzicht openbaar van het aantal meldingen als bedoeld in
      artikel 53 van de digitaledienstenverordening dat zij heeft ontvangen per onderwerp van die verordening.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.6a
  - number: 2.7.1
    text: |-
      Met het uitoefenen van onderzoeksbevoegdheden overeenkomstig de artikelen 57, tweede
      lid, en 66, derde lid, van de digitaledienstenverordening zijn belast de krachtens
      [artikel 12a, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1] aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel12a
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: 12a
  - number: 2.7.2
    text: |-
      De ambtenaren, bedoeld in het eerste lid, beschikken voor het uitoefenen van
      onderzoeksbevoegdheden over de bevoegdheden die hun ingevolge de Algemene wet bestuursrecht en
      [hoofdstuk 3, paragraaf 1, van de Instellingswet Autoriteit Consument en Markt][ref1] zijn toegekend ter
      uitoefening van het toezicht op de naleving.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0033043
        paragraaf: '1'
  - number: 2.8.1
    text: |-
      Met het verlenen van bijstand bij een inspectie op grond van artikel 69, zevende lid,
      van de digitaledienstenverordening door de Europese Commissie, zijn belast de krachtens
      [artikel 12a, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1] aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel12a
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: 12a
  - number: 2.8.2
    text: |-
      [Artikel 5:12 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 2.8.3
    text: |-
      Bij verzet tegen een inspectie door de Europese Commissie, verlenen de ambtenaren, bedoeld in het eerste lid, de
      nodige bijstand om de Europese Commissie in staat te stellen de inspectie te verrichten, zo nodig met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.8
  - number: 2.9.1
    text: |-
      De Autoriteit persoonsgegevens brengt advies uit aan de Autoriteit Consument en Markt over de vraag of een aanvraag
      als bedoeld in artikel 40, achtste lid, van de digitaledienstenverordening, voldoet aan de voorwaarde, bedoeld
      in artikel 40, achtste lid, onderdeel d, van de digitaledienstenverordening, dat de aanvrager in staat is om
      persoonsgegevens te beschermen.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.9
  - number: 2.9.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de besluitvorming over een aanvraag als
      bedoeld in artikel 40, achtste lid, van de digitaledienstenverordening.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel2.9
  - number: 3.1.1
    text: |-
      De Autoriteit persoonsgegevens is een bevoegde autoriteit als bedoeld in artikel 49, eerste lid, van de
      digitaledienstenverordening.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.1
  - number: 3.1.2
    text: |-
      De [artikelen 21][ref1] en [22 van de Kaderwet zelfstandige bestuursorganen][ref2] zijn niet van toepassing op de
      Autoriteit persoonsgegevens voor de toepassing van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '22'
  - number: 3.1.3
    text: |-
      [Artikel 23 van de Kaderwet zelfstandige bestuursorganen][ref1] vindt slechts toepassing ten aanzien van het door
      de Autoriteit persoonsgegevens gevoerde financiële beheer en de administratieve organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel23
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '23'
  - number: 3.1.4
    text: |-
      De Autoriteit persoonsgegevens kan als andere bevoegde autoriteit als bedoeld in artikel 62, eerste lid, van de
      digitaledienstenverordening deelnemen aan de digitaledienstenraad.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.1
  - number: 3.2.1
    text: |-
      Met het toezicht op de naleving van de artikelen 26, derde lid, 27 en 28, tweede lid, van de
      digitaledienstenverordening zijn belast de leden en buitengewone leden van de Autoriteit persoonsgegevens, de
      ambtenaren van het secretariaat van de Autoriteit persoonsgegevens, alsmede de bij besluit van de Autoriteit
      persoonsgegevens aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.2
  - number: 3.2.2
    text: |-
      De toezichthouder beschikt niet over de bevoegdheid, genoemd in
      [artikel 5:19 van de Algemene wet bestuursrecht][ref1], bij de uitoefening van het toezicht, bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 3.2.3
    text: |-
      De in het eerste lid bedoelde personen zijn bevoegd een woning te betreden zonder toestemming van de bewoner,
      voor zover dat voor de uitoefening van de in [artikel 5:17 van de Algemene wet bestuursrecht][ref1] bedoelde
      bevoegdheden redelijkerwijs noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 3.2.4
    text: |-
      De in het eerste lid bedoelde personen behoeven voor de uitoefening van de in het derde lid omschreven bevoegdheid
      de uitdrukkelijke en bijzondere volmacht van de Autoriteit persoonsgegevens, onverminderd het bepaalde in
      [artikel 2 van de Algemene wet op het binnentreden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
  - number: 3.3.1
    text: |-
      De Autoriteit persoonsgegevens is bevoegd tot oplegging van een bestuurlijke boete van ten hoogste het bedrag,
      genoemd in artikel 52, derde lid, van de digitaledienstenverordening ter handhaving van:
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.3
  - number: 3.3.1.a
    text: |-
      de bepalingen, genoemd in [artikel 3.2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050739#Artikel3
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0050739
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.3.1.b
    text: |-
      de artikelen [3.5, vijfde lid][ref1], en [3.6, derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0050739#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050739#Artikel3
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0050739
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0050739
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.3.1.c
    text: |-
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1], voor zover het betreft de verplichting tot het
      verlenen van medewerking aan een vordering van een bij of krachtens artikel 3.2, eerste lid, aangewezen persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 3.3.2
    text: |-
      [Artikel 184 van het Wetboek van Strafrecht][ref1] is niet van toepassing op de in het eerste lid, onderdeel c,
      bedoelde overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '184'
  - number: 3.3.3
    text: De bestuurlijke boete komt toe aan de Staat.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.3
  - number: 3.4.1
    text: |-
      De Autoriteit persoonsgegevens is bevoegd tot oplegging van een last onder dwangsom van ten hoogste het bedrag,
      genoemd in artikel 52, vierde lid, van de digitaledienstenverordening ter handhaving van de bepalingen, genoemd in
      [artikel 3.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050739#Artikel3
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0050739
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.4.2
    text: De te betalen geldsom van een verbeurde dwangsom komt toe aan de Staat.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.4
  - number: 3.5.1
    text: |-
      Onverminderd [artikel 5:45 van de Algemene wet bestuursrecht][ref1] vervalt de bevoegdheid van de Autoriteit
      persoonsgegevens tot het opleggen van een bestuurlijke boete of een last onder dwangsom aan een aanbieder van een
      tussenhandeldienst, indien de Autoriteit persoonsgegevens op aanvraag van die aanbieder van een tussenhandeldienst
      besluit tot het bindend verklaren van een door die aanbieder gedane toezegging.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 3.5.2
    text: |-
      De Autoriteit persoonsgegevens kan een besluit nemen als bedoeld in het eerste lid, indien zij het bindend
      verklaren van een toezegging doelmatiger acht dan het opleggen van een bestuurlijke boete of een last onder
      dwangsom.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.5
  - number: 3.5.3
    text: |-
      De aanbieder van een tussenhandeldienst dient de aanvraag voor het nemen van een besluit als bedoeld in het eerste
      lid in, voordat de Autoriteit persoonsgegevens een besluit omtrent het opleggen van een bestuurlijke boete of een
      last onder dwangsom heeft genomen.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.5
  - number: 3.5.4
    text: |-
      De termijn, bedoeld in [artikel 5:45, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt opgeschort met
      ingang van de dag waarop de Autoriteit persoonsgegevens de aanvraag ontvangt, tot de dag waarop de Autoriteit
      persoonsgegevens een besluit op de aanvraag heeft genomen. Artikel 5:45, derde lid, van de Algemene wet
      bestuursrecht is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 3.5.5
    text: De aanbieder van een tussenhandeldienst gedraagt zich overeenkomstig het besluit, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.5
  - number: 3.5.6
    text: |-
      De Autoriteit persoonsgegevens bepaalt gedurende welke periode het besluit, bedoeld in het eerste lid, geldt en kan
      deze periode telkens verlengen.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.5
  - number: 3.5.7
    text: |-
      De Autoriteit persoonsgegevens kan een besluit als bedoeld in het eerste lid of een besluit tot verlenging als
      bedoeld in het zesde lid, wijzigen of intrekken indien:
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.5
  - number: 3.5.7.a
    text: er een wezenlijke verandering is opgetreden in de feiten waarop het besluit berust;
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.5
  - number: 3.5.7.b
    text: |-
      het besluit berust op door de aanbieder van een tussenhandeldienst verstrekte onvolledige, onjuiste of misleidende
      gegevens;
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.5
  - number: 3.5.7.c
    text: de aanbieder van een tussenhandeldienst in strijd met het vijfde lid handelt.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.5
  - number: 3.6.1
    text: |-
      De Autoriteit persoonsgegevens kan in geval van overtreding van de bepalingen, genoemd in
      [artikel 3.2, eerste lid][ref1], aan de overtreder een zelfstandige last opleggen in de vorm van een bindende
      aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0050739#Artikel3
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0050739
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.6.2
    text: |-
      De Autoriteit persoonsgegevens kan een zelfstandige last opleggen aan een aanbieder van een tussenhandeldienst in
      de vorm van:
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.6
  - number: 3.6.2.a
    text: een voorlopige maatregel als bedoeld in artikel 51, tweede lid, onderdeel e, van de digitaledienstenverordening;
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.6
  - number: 3.6.2.b
    text: een maatregel als bedoeld in artikel 51, derde lid, onderdeel a, van de digitaledienstenverordening.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.6
  - number: 3.6.3
    text: |-
      Degene tot wie een zelfstandige last als bedoeld in het eerste of tweede lid is gericht, handelt overeenkomstig
      die last.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.6
  - number: 3.7.1
    text: |-
      Indien de Autoriteit Consument en Markt een verzoek tot het uitoefenen van onderzoeksbevoegdheden overeenkomstig
      de artikelen 57, tweede lid, en 66, derde lid, van de digitaledienstenverordening ontvangt ten aanzien van een
      gedraging waarvoor de Autoriteit persoonsgegevens bevoegd is, verwijst de Autoriteit Consument en Markt het verzoek
      door naar de Autoriteit persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.7
  - number: 3.7.2
    text: |-
      Met het uitoefenen van onderzoeksbevoegdheden ter uitvoering van een verzoek als bedoeld in het eerste lid zijn
      belast de personen, bedoeld in [artikel 3.2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050739#Artikel3
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0050739
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.7.3
    text: |-
      De personen, bedoeld in het tweede lid, beschikken voor het uitoefenen van onderzoeksbevoegdheden over de
      bevoegdheden die hun ingevolge de [Algemene wet bestuursrecht][ref1] en deze wet zijn toegekend ter uitoefening van
      het toezicht op de naleving.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 4.1.1
    text: |-
      De Autoriteit persoonsgegevens kan gegevens of inlichtingen die zij in verband met enige werkzaamheid ten behoeve
      van de uitvoering van een taak als bedoeld in de [artikelen 2.9, derde lid][ref1], en [artikel 3.2][ref2] heeft
      verkregen, verstrekken aan de Autoriteit Consument en Markt ten behoeve van een goede vervulling van haar taken
      genoemd in [hoofdstuk 2][ref3] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0050739#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0050739#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0050739#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0050739
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0050739
        artikel: '3'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0050739
        hoofdstuk: '2'
  - number: 4.1.2
    text: 'De Autoriteit persoonsgegevens verstrekt aan de Autoriteit Consument en Markt:'
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel4.1
  - number: 4.1.2.a
    text: de ondersteuning en informatie, bedoeld in artikel 55, derde lid, van de digitaledienstenverordening;
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel4.1
  - number: 4.1.2.b
    text: |-
      alle gegevens omtrent de krachtens [artikel 3.7, derde lid][ref1], genomen toezichtsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0050739#Artikel3
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0050739
        artikel: '3'
        hoofdstuk: '3'
  - number: 4.2.1
    text: |-
      De Autoriteit Consument en Markt en de Autoriteit persoonsgegevens maken afspraken in het belang van een nauwe en
      doeltreffende samenwerking bij de uitvoering van hun taken op grond van deze wet. De afspraken worden vastgelegd in
      een samenwerkingsprotocol dat ten minste iedere drie jaar wordt geëvalueerd op doeltreffendheid en zo nodig wordt
      geactualiseerd.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel4.2
  - number: 4.2.2
    text: |-
      De Autoriteit Consument en Markt doet mededeling van het samenwerkingsprotocol of een actualisering daarvan in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel4.2
  - number: '4.3'
    text: |-
      Voor zover door de Autoriteit persoonsgegevens bij de uitoefening van haar bevoegdheden begrippen worden uitgelegd,
      die worden gehanteerd in een van de bepalingen, genoemd in [artikel 2.2, eerste lid][ref1], dan vindt deze
      uitleg plaats in overeenstemming met de Autoriteit Consument en Markt. In het samenwerkingsprotocol, bedoeld in
      [artikel 4.2, eerste lid][ref2], worden hierover nadere afspraken gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0050739#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0050739#Artikel4
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0050739
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0050739
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.1
    text: |-
      De Autoriteit Consument en Markt en het openbaar ministerie maken afspraken in het belang van de uitvoering van de
      digitaledienstenverordening en deze wet.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel4.4
  - number: 4.4.2
    text: |-
      De afspraken, bedoeld in het eerste lid, worden vastgelegd in een samenwerkingsprotocol en hebben in elk geval
      betrekking op de samenwerking bij de totstandkoming van een besluit tot het opleggen van een zelfstandige last als
      bedoeld in [artikel 2.5, eerste lid, onderdelen b en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050739#Artikel2
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0050739
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 4.4.3
    text: De Autoriteit Consument en Markt doet mededeling van het samenwerkingsprotocol in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel4.4
  - number: '4.5'
    text: |-
      Indien een bevel als bedoeld in artikel 9 of 10 van de digitaledienstenverordening wordt gegeven op grond van
      het [Wetboek van Strafvordering][ref1] kunnen het derde, vierde en vijfde lid van die artikelen buiten toepassing
      worden gelaten voor zolang het belang van het onderzoek dat vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '6.0'
    text: |-
      Onze Minister van Economische Zaken zendt, in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, in 2027 aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze
      wet in de praktijk, waarbij in het bijzonder aandacht wordt besteed aan het toezicht en de handhaving door de
      Autoriteit Consument en Markt en de Autoriteit persoonsgegevens en aan hun onderlinge samenwerking, alsmede aan
      de samenwerking met de Europese Commissie, het openbaar ministerie en andere bevoegde autoriteiten als bedoeld in
      artikel 49, eerste lid, van de digitaledienstenverordening van andere lidstaten, en aan de samenwerkingsprotocollen
      die deze samenwerkingen vormgeven.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel6.0
  - number: '6.2'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel6.2
  - number: '6.3'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet digitaledienstenverordening.'
    url: https://wetten.overheid.nl/BWBR0050739/2025-02-04#Artikel6.3
