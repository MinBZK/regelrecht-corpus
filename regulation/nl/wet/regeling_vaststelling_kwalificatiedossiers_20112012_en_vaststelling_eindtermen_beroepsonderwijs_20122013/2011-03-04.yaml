preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Economische zaken, Landbouw en Innovatie;

    Gelet op artikel 7.2.4, tweede lid en lid 3a, van de Wet educatie en beroepsonderwijs en artikel 2.2.3, vierde lid,
    van het Uitvoeringsbesluit WEB;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0029679/2011-03-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *wet:* [Wet educatie en beroepsonderwijs][ref1];

      b. *competenties:* in het kader van het herontwerp van de kwalificatiestructuur mbo opgestelde eindtermen, die
      verwijzen naar onderliggende vaardigheden, kennis, en houdingsaspecten en expliciet zijn gerelateerd aan de
      toepassing in de praktijk;

      c. *kwalificatiedossier:* een document waarin een of meer kwalificaties zijn beschreven;

      d. *eindtermen:* eindtermen bedoeld in [artikel 7.1.3 van de wet][ref2]

      e. *prijsfactor:* de prijsfactor, bedoeld in [artikel 2.2.3, vierde lid van het Uitvoeringsbesluit WEB][ref3]

      f. *studielast:* de studielast, bedoeld in [artikel 7.2.4, tweede lid, onderdeel d, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
