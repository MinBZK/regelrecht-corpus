  - number: '2'
    text: |-
      1 Voor de beroepsopleidingen opgenomen in [bijlage 1][ref1] behorende bij deze regeling worden de
      kwalificatiedossiers voor het studiejaar 2011–2012 vastgesteld overeenkomstig [bijlage 2][ref2] behorende bij
      deze regeling.

      In [bijlage 1][ref3] worden per beroepsopleiding vastgesteld:

      a. de leerweg waarin de beroepsopleiding kan worden verzorgd;

      b. de prijsfactor;

      c. de hoogte van de studielast en

      d. de soort opleiding als bedoeld in [artikel 7.2.2, eerste lid, van de wet][ref4].


