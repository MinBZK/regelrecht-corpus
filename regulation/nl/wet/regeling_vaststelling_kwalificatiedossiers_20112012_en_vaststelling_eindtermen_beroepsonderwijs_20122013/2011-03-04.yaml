    text: |-
      Deze regeling wordt aangehaald als: Regeling vaststelling kwalificatiedossiers 2011–2012 en vaststelling eindtermen
      beroepsonderwijs 2012–2013.

      Deze regeling zal met de [bijlagen 1][ref1], [3][ref2], [5][ref3] en [7][ref4] en de toelichting in de
      Staatscourant worden geplaatst. De [bijlagen 2][ref5], [4][ref6], [6][ref7] en [8][ref8] worden gepubliceerd
      op www.kwalificatiesmbo.nl.


