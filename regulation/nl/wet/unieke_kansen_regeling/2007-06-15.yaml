  - number: '5'
    text: |-
      1 De hoogte van de subsidiabele extra investeringskosten komt overeen met de som van de per kostensoort berekende
      investeringskosten van het project verminderd met de referentie-kosten, extra opbrengsten en enig ander extra
      voordeel gedurende de eerste vijf jaar van de gebruiksduur van de investering alsmede extra besparingen die met het
      project gemoeid zijn.

      2 De kosten, bedoeld in het eerste lid, worden berekend aan de hand van [artikel 6][ref1] en de bij deze regeling
      behorende [bijlage 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017364#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0017364
    url: https://wetten.overheid.nl/BWBR0017364/2007-06-15#Artikel5
