articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. de minister: de Minister van Economische Zaken;

      b. het besluit: [Besluit EOS: demo en transitie-experimenten][ref1];

      c. project: een project als bedoeld in [artikel 1, eerste lid, onderdeel e, onder 2˚ van het besluit][ref2];

      d. referentie-kosten: kosten voor een investering ten behoeve van een in Nederland gangbaar systeem, apparaat of
      techniek die in technisch opzicht vergelijkbaar is met een in Nederland uit te voeren project maar waarmee niet
      hetzelfde niveau van milieubescherming kan worden bereikt als met het uit te voeren project, terwijl, in geval van
      een uit te voeren project voor hernieuwbare energie, de capaciteit voor de opwekking van energie van dat project
      ten minste overeenkomt met die van de eerstbedoelde investering.


      [ref1]: https://wetten.overheid.nl/BWBR0017332
      [ref2]: https://wetten.overheid.nl/BWBR0017332#Artikel1
    url: https://wetten.overheid.nl/BWBR0017364/2007-06-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017332
      - id: ref2
        bwb_id: BWBR0017332
        artikel: '1'
  - number: '2'
    text: |-
      Als erkende transitiepaden als bedoeld in [artikel 1, vierde lid, van het besluit][ref1] worden aangewezen de
      transitiepaden, genoemd in de bij deze regeling behorende [bijlage 1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017332#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017364
    url: https://wetten.overheid.nl/BWBR0017364/2007-06-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017332
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0017364
  - number: '3'
    text: |-
      Als thema’s binnen het streven naar een duurzame energiehuishouding als bedoeld in
      [artikel 2, derde lid, van het besluit][ref1] en combinaties daarvan worden aangewezen:

      a. biomassa;

      b. nieuw gas/schoon fossiel en efficiënt gebruik van gas;

      c. efficiëntieverbetering in de industriële en de landbouwsector.


      [ref1]: https://wetten.overheid.nl/BWBR0017332#Artikel2
    url: https://wetten.overheid.nl/BWBR0017364/2007-06-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017332
        artikel: '2'
  - number: '4'
    text: |-
      1 Het in [artikel 3, eerste lid, van het besluit][ref1] bedoelde maximale subsidiebedrag bedraagt per project
      € 4.000.000.

      2 Het in [artikel 3, vijfde lid, van het besluit][ref2] bedoelde subsidiepercentage bedraagt 40% van de
      projectkosten. Indien de ondernemer in de landbouwsector een kleine of middelgrote onderneming in stand houdt kan
      het subsidiepercentage met 10 procentpunten van de projectkosten worden verhoogd.

      3 Het in [artikel 3, vijfde lid, van het besluit][ref3] bedoelde maximale subsidiebedrag bedraagt per project
      € 4.000.000,–

      4 In afwijking van het derde lid geldt tot 15 oktober 2006 voor de sector glastuinbouw een maximum subsidiebedrag
      van € 1.125.000,– per ondernemer die een glastuinbouwbedrijf exploiteert.

      5 Algemene kosten die niet direct tot de investering zijn te herleiden, komen niet voor subsidie in aanmerking.

      6 Het tweede tot met het vijfde lid zijn van overeenkomstige toepassing indien:

      a. een of meerdere van de deelnemers in een samenwerkingsverband ondernemer in de landbouwsector zijn, en

      b. de voordelen van de subsidie geheel of gedeeltelijk ten goede komen aan een of meerdere ondernemers in de
      landbouwsector en de ondernemer in de landbouwsector niet zelf de aanvrager van de subsidie is.


      [ref1]: https://wetten.overheid.nl/BWBR0017332#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017332#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0017332#Artikel3
    url: https://wetten.overheid.nl/BWBR0017364/2007-06-15#Artikel4
