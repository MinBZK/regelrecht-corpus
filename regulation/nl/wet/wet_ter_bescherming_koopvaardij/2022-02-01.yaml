        artikel: '3'
        hoofdstuk: '1'
  - number: '2'
    text: |-
      Deze wet is van toepassing op gewapende maritieme beveiligingswerkzaamheden die buiten de territoriale zee van
      een staat worden verricht aan boord van schepen die op grond van Nederlandse rechtsregels gerechtigd zijn de vlag
      van het Koninkrijk te voeren, voor zover zij varen in of door de zeegebieden, aangewezen door Onze Minister bij
      algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel2
  - number: '3.1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister gewapende maritieme beveiligingswerkzaamheden aan te bieden of
      te verrichten.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel3
  - number: '3.2'
    text: |-
      Het is verboden zonder toestemming van Onze Minister gewapende maritieme beveiligingswerkzaamheden aan boord van
      een schip te verrichten, toe te staan of mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel3
  - number: '3.3'
    text: |-
      Met een vergunning, bedoeld in het eerste lid, wordt gelijkgesteld een vergunning of vergelijkbare beschikking
      afgegeven door een daartoe bevoegde instantie in een andere staat die een niveau van waarborgen biedt dat ten
      minste gelijkwaardig is aan het niveau dat met het bepaalde bij of krachtens deze wet wordt nagestreefd. Onze
      Minister kan beleidsregels vaststellen omtrent de gelijkwaardigheid van buitenlandse vergunningen.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister beslist op een verzoek van de scheepsbeheerder om toestemming als bedoeld in
      [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel3
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '3'
        hoofdstuk: '1'
  - number: '4.2'
    text: |-
      De toestemming kan slechts worden verleend indien een transport voor militaire bescherming in aanmerking komt maar
      deze niet of niet binnen redelijke termijn kan worden geboden door Onze Minister van Defensie, of indien naar het
      oordeel van Onze Minister:
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel4
  - number: 4.2.a
    text: |-
      aanvaarding van militaire bescherming zou nopen tot aanpassing van de beoogde vaarroute van meer dan een bij
      algemene maatregel van bestuur te bepalen aantal zeemijlen; of
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel4
  - number: 4.2.b
    text: |-
      aanvaarding van militaire bescherming zou leiden tot een bij algemene maatregel van bestuur te bepalen percentage
      extra kosten ten opzichte van de kosten voor particulier maritiem beveiligingspersoneel.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel4
  - number: '4.3'
    text: De toestemming wordt per transport verleend aan de scheepsbeheerder.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel4
  - number: '4.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld betreffende het verzoek om
      toestemming, bedoeld in het eerste lid, en de weigeringsgronden.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel4
  - number: '4.5'
    text: |-
      De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel4
  - number: '5'
    text: |-
      Onze Minister van Defensie verstrekt Onze Minister alle gegevens die door de scheepsbeheerder bij een verzoek
      om beveiliging van een transport zijn verstrekt voor zover deze nodig zijn voor het verlenen van de toestemming,
      bedoeld in [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel3
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '3'
        hoofdstuk: '1'
  - number: '6.1'
    text: |-
      De kapitein en de scheepsbeheerder passen voorafgaand aan en tijdens een transport waarop particulier maritiem
      beveiligingspersoneel wordt ingezet alle redelijkerwijs mogelijke, bij ministeriële regeling aan te wijzen
      beschermingsmaatregelen toe.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel6
  - number: '6.2'
    text: |-
      De kapitein en de teamleider vergewissen zich voorafgaand aan de inzet van particulier maritiem
      beveiligingspersoneel op een transport ervan dat de toestemming, bedoeld in [artikel 3, tweede lid][ref1], is
      verleend en dat aan de bij of krachtens deze wet gestelde regels met betrekking tot de beschermingsmaatregelen, de
      identiteit en de nationaliteit van het particulier maritiem beveiligingspersoneel, de geweldsmiddelen, camera’s en
      microfoons, is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel3
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '3'
        hoofdstuk: '1'
  - number: '6.3'
    text: |-
      De scheepsbeheerder en de vergunninghouder voorzien de kapitein onderscheidenlijk de teamleider van juiste en
      volledige informatie ten behoeve van hun vergewisplicht. Bij of krachtens algemene maatregel van bestuur worden
      regels gesteld met betrekking tot de informatie en de verstrekking ervan.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel6
  - number: '6.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de verantwoordelijkheid van de kapitein
      voor de veiligheid van het schip en de opvarenden in verband met de maritieme beveiligingswerkzaamheden en de
      naleving van de in het tweede lid bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel6
  - number: '7'
    text: |-
      Het particulier maritiem beveiligingspersoneel dat op een transport wordt ingezet wordt niet als zeevarend
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel7
  - number: '8'
    text: |-
      Het particulier maritiem beveiligingspersoneel maakt bij de uitvoering van maritieme beveiligingswerkzaamheden geen
      gebruik van andere dan de door Onze Minister bij algemene maatregel van bestuur aangewezen geweldsmiddelen. Bij of
      krachtens algemene maatregel van bestuur worden tevens regels gesteld over de wijze van opslag van de aangewezen
      geweldsmiddelen op het schip.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel8
  - number: '9.1'
    text: |-
      Het particulier maritiem beveiligingspersoneel is bevoegd bij dreigend gevaar van piraterij de aangewezen
      geweldsmiddelen ter hand te nemen, op te stellen en dreigend te tonen.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel9
  - number: '9.2'
    text: |-
      Het particulier maritiem beveiligingspersoneel is bevoegd geweld aan te wenden en daarbij gebruik te maken van de
      aangewezen geweldsmiddelen, voor zover dat noodzakelijk is ter afwending van dreigend gevaar van piraterij en dat
      doel niet op een andere wijze kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel9
  - number: '9.3'
    text: |-
      Het particulier maritiem beveiligingspersoneel onthoudt zich van geweld gericht op het toebrengen van dodelijk
      letsel.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel9
  - number: '9.4'
    text: Het gebruik van geweld dient in verhouding tot het beoogde doel redelijk en gematigd te zijn.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel9
  - number: '9.5'
    text: Aan het gebruik van geweld gaat een waarschuwing vooraf, tenzij de omstandigheden een waarschuwing niet toelaten.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel9
  - number: '9.6'
    text: |-
      Het particulier maritiem beveiligingspersoneel gebruikt geen geweld dan na opdracht van de teamleider, tenzij deze
      opdracht redelijkerwijs niet kan worden afgewacht.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel9
  - number: '9.7'
    text: |-
      De teamleider geeft geen opdracht tot het gebruik van geweld dan nadat hij in overleg met de kapitein heeft
      vastgesteld dat de beschermingsmaatregelen, bedoeld in [artikel 6, eerste lid][ref1], niet tot afwending van
      het gevaar van piraterij hebben geleid, tenzij dit overleg of de uitkomst daarvan redelijkerwijs niet kan worden
      afgewacht.


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel6
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '6'
        hoofdstuk: '2'
  - number: '9.8'
    text: |-
      Bij algemene maatregel van bestuur wordt een geweldsinstructie voor particulier maritiem beveiligingspersoneel
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel9
  - number: '9.9'
    text: |-
      De voordracht voor een krachtens het achtste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel9
  - number: '10.1'
    text: Het particulier maritiem beveiligingspersoneel is bevoegd tot het dragen van handboeien.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel10
  - number: '10.2'
    text: |-
      Het particulier maritiem beveiligingspersoneel is bevoegd tot het aanleggen van handboeien bij personen die niet
      tot de opvarenden van het schip behoren en die zijn aangehouden in geval van ontdekking op heterdaad, indien de
      aangehouden personen zich trachten te onttrekken aan hun aanhouding of indien zij een gevaar vormen voor hun eigen
      leven of veiligheid of het leven of de veiligheid van anderen en die onttrekking onderscheidenlijk dat gevaar niet
      op een andere wijze kan worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel10
  - number: '10.3'
    text: |-
      Aangehouden personen worden door het particulier maritiem beveiligingspersoneel onverwijld overgeleverd aan
      de kapitein. Het bepaalde in [titel VIB van het vierde boek van het Wetboek van Strafvordering][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '11.1'
    text: |-
      Het particulier maritiem beveiligingspersoneel maakt bij de uitvoering van maritieme beveiligingswerkzaamheden
      gebruik van camera’s en microfoons.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel11
  - number: '11.2'
    text: |-
      Er worden beeld- of geluidsopnamen gemaakt vanaf het moment van dreigend gevaar van piraterij tot het moment dat de
      dreiging is geweken of afgewend. Deze opnamen worden vastgelegd in bestanden.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel11
  - number: '11.3'
    text: |-
      De teamleider instrueert zijn teamleden wanneer zij de camera’s of microfoons aanzetten voor het maken van beeld-
      of geluidsopnamen.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel11
  - number: '11.4'
    text: |-
      De teamleider verstrekt de bestanden met de beeld- of geluidsopnamen aan de kapitein ten behoeve van diens
      rapportage of melding, bedoeld in [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel12
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '12'
        hoofdstuk: '3'
  - number: '11.5'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel11
  - number: 11.5.a
    text: de aard van de camera’s of microfoons en de verantwoordelijkheid voor het functioneren ervan;
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel11
  - number: 11.5.b
    text: het maken van beeld- en geluidopnamen tijdens het transport door het aangewezen zeegebied;
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel11
  - number: 11.5.c
    text: de aan de verwerking van beeld- en geluidsopnamen te stellen functionele of technische vereisten; en
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel11
  - number: 11.5.d
    text: de termijnen voor het bewaren en vernietigen van de bestanden met beeld- en geluidsopnamen.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel11
  - number: '11.6'
    text: |-
      De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel11
  - number: '12.1'
    text: |-
      Van ieder transport waarop particulier maritiem beveiligingspersoneel is ingezet wordt na afloop van het transport
      volgens door Onze Minister te geven regels een rapportage in de Nederlandse of Engelse taal opgesteld door de
      kapitein en door de teamleider van het particulier maritiem beveiligingspersoneel afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel12
  - number: '12.2'
    text: |-
      De rapportages vermelden in elk geval of en zo ja welk gebruik is gemaakt van de bevoegdheden genoemd in de
      [artikelen 9][ref1] en [10][ref2]. Indien gebruik is gemaakt van deze bevoegdheden, worden de bestanden met beeld-
      of geluidsopnamen, bedoeld in [artikel 11, tweede of vijfde lid][ref3], bij de rapportages gevoegd. De rapportages
      worden aan Onze Minister gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0042278#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0042278#Artikel11
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0042278
        artikel: '10'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0042278
        artikel: '11'
        hoofdstuk: '3'
  - number: '12.3'
    text: |-
      Van iedere aanwending van geweld en van ieder gebruik van handboeien door het particulier maritiem
      beveiligingspersoneel wordt na ommekomst van het gevaar van piraterij onverwijld door de kapitein melding gemaakt
      aan het openbaar ministerie, volgens door Onze Minister te geven regels. De bestanden met beeld- of geluidsopnamen,
      bedoeld in [artikel 11, tweede of vijfde lid][ref1], worden bij de melding gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel11
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '11'
        hoofdstuk: '3'
  - number: '13.1'
    text: |-
      De vergunning, bedoeld in [artikel 3, eerste lid][ref1], kan op aanvraag van een maritiem beveiligingsbedrijf
      worden verleend indien de bij algemene maatregel van bestuur te bepalen certificaten worden overgelegd en aan de
      bij of krachtens deze wet gestelde regels wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel3
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '3'
        hoofdstuk: '1'
  - number: '13.2'
    text: De vergunning is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel13
  - number: '13.3'
    text: Aan de vergunning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel13
  - number: '13.4'
    text: |-
      De aanvrager is volgens door Onze Minister te geven regels leges verschuldigd terzake van de afdoening van een
      aanvraag als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel13
  - number: '13.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden in ieder geval regels gesteld over de aanvraag, de duur, de
      overgang, de schorsing en de verlenging van een vergunning en over de voorschriften, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel13
  - number: '14'
    text: 'Onze Minister kan de vergunning intrekken of schorsen indien:'
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel14
  - number: 14.a
    text: |-
      een van de ISO-certificaten, bedoeld in [artikel 13, eerste lid][ref1], geschorst, ingetrokken of niet meer geldig
      is;


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel13
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '13'
        hoofdstuk: '4'
  - number: 14.b
    text: de vergunninghouder de aan de vergunning verbonden voorschriften niet in acht neemt;
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel14
  - number: 14.c
    text: |-
      de vergunninghouder de verplichtingen die voortvloeien uit de bij of krachtens deze wet gestelde regels niet
      naleeft;
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel14
  - number: 14.d
    text: |-
      de voor de verkrijging van de vergunning verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de
      aanvraag een andere beslissing zou zijn genomen indien bij de beoordeling daarvan de juiste gegevens bekend waren
      geweest;
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel14
  - number: 14.e
    text: |-
      zich omstandigheden voordoen of feiten bekend worden op grond waarvan de vergunning zou zijn geweigerd, indien zij
      zich hadden voorgedaan of bekend waren geweest op het tijdstip waarop de vergunning werd verleend;
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel14
  - number: 14.f
    text: |-
      de vergunninghouder handelt in strijd met hetgeen van een goed maritiem beveiligingsbedrijf in het maatschappelijk
      verkeer mag worden verwacht.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel14
  - number: 14a.1
    text: |-
      Gelet op artikel 10 van de Algemene verordening gegevensbescherming, kan
      Onze Minister persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] verwerken, voor zover die
      verwerking noodzakelijk is, in het kader van de betrouwbaarheidstoetsing van de onderneming bij het verlenen van
      een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 14a.2
    text: |-
      Gelet op de artikelen 9, tweede lid, onder g, en 10 van de Algemene verordening gegevensbescherming,
      kan Onze Minister gezondheidsgegevens als bedoeld in artikel 4, onderdeel 15 van de Algemene
      verordening gegevensbescherming en persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] verwerken, voor zover die
      verwerking noodzakelijk is, in het kader van:


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 14a.2.a
    text: |-
      het toezicht op de naleving en handhaving van de bij en krachtens deze wet gestelde regels en de aan de vergunning
      verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel14a
  - number: 14a.2.b
    text: |-
      de samenwerking en uitwisseling van gegevens met buitenlandse instanties overeenkomstig [artikel 17b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel17b
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: 17b
        hoofdstuk: '5'
  - number: 14a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het bewaren en vernietigen van de
      in het eerste en tweede lid bedoelde persoonsgegevens en over andere waarborgen.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel14a
  - number: '15'
    text: 'De vergunninghouder:'
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel15
  - number: 15.a
    text: |-
      maakt tenminste drie maanden voorafgaand aan de beëindiging van de geldigheid van een aan hem verleend ISO-
      certificaat als bedoeld in [artikel 13, eerste lid][ref1], melding daarvan aan Onze Minister;


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel13
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '13'
        hoofdstuk: '4'
  - number: 15.b
    text: |-
      meldt de schorsing, de opheffing daarvan of de intrekking van een aan hem verleend ISO-certificaat als bedoeld in
      [artikel 13, eerste lid][ref1], onverwijld aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel13
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '13'
        hoofdstuk: '4'
  - number: '16.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren. Onze Minister kan aan deze ambtenaren algemene en bijzondere aanwijzingen geven
      omtrent de uitvoering van het toezicht.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel16
  - number: '16.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister kan aan de vergunninghouder een bestuurlijke boete opleggen van een bij ministeriële regeling
      te bepalen bedrag ter zake van overtreding van de bij of krachtens deze wet gestelde regels en van de aan de
      vergunning verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel17
  - number: '17.2'
    text: 'Onze Minister kan aan:'
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel17
  - number: 17.2.a
    text: |-
      de scheepsbeheerder en de kapitein een bestuurlijke boete opleggen van een bij ministeriële regeling te bepalen
      bedrag ter zake van overtreding van de regels, gesteld bij of krachtens [artikel 6, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel6
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '6'
        hoofdstuk: '2'
  - number: 17.2.b
    text: |-
      de teamleider en de kapitein een bestuurlijke boete opleggen van een bij ministeriële regeling te bepalen bedrag
      ter zake van overtreding van [artikel 6, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel6
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '6'
        hoofdstuk: '2'
  - number: 17.2.c
    text: |-
      de scheepsbeheerder een bestuurlijke boete opleggen van een bij ministeriële regeling te bepalen bedrag ter zake
      van overtreding van de regels, gesteld bij of krachtens [artikel 6, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel6
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '6'
        hoofdstuk: '2'
  - number: 17.2.d
    text: |-
      de kapitein een bestuurlijke boete opleggen van een bij ministeriële regeling te bepalen bedrag ter zake van
      overtreding van de krachtens [artikel 6, vierde lid][ref1], gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel6
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '6'
        hoofdstuk: '2'
  - number: 17.2.e
    text: |-
      de teamleider en de kapitein een bestuurlijke boete opleggen van een bij ministeriële regeling te bepalen bedrag
      ter zake van overtreding van de regels gesteld bij of krachtens [artikel 12, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel12
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '12'
        hoofdstuk: '3'
  - number: '17.3'
    text: |-
      De op grond van het eerste of tweede lid vast te stellen bestuurlijke boete bedraagt ten hoogste het bedrag dat is
      vastgesteld voor de vierde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 17a.1
    text: |-
      Onze Minister stelt ten behoeve van het toezicht op en de handhaving van de bij en krachtens deze wet gestelde
      regels driejaarlijks een werkplan op.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel17a
  - number: 17a.2
    text: |-
      Na afloop van ieder kalenderjaar stelt Onze Minister een verslag op over het gevoerde toezicht en de sanctionering
      bij overtreding van de bij en krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel17a
  - number: 17a.3
    text: |-
      Het in het tweede lid bedoelde verslag bevat tevens informatie over de ontvangen rapportages, bedoeld in
      [artikel 12, eerste lid][ref1], en de meldingen, bedoeld in artikel 12, derde lid, die door een kapitein bij het
      openbaar ministerie zijn gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel12
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0042278
        artikel: '12'
        hoofdstuk: '3'
  - number: 17b.1
    text: |-
      Onze Minister werkt in het kader van vergunningverlening, toezicht op en handhaving van de bij en krachtens
      deze wet gestelde regels samen met instanties die krachtens het recht van de staat die het betreft met
      vergunningverlening, toezicht op en handhaving van maritieme beveiligingswetgeving zijn belast.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel17b
  - number: 17b.2
    text: |-
      In het kader van vergunningverlening, toezicht op en handhaving van de bij en krachtens deze wet gestelde regels
      kunnen de met toezicht belaste ambtenaren gegevens uitwisselen met buitenlandse instanties.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel17b
  - number: '20'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel20
  - number: '21'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen ervan verschillend kan worden vastgesteld, en vervalt op het tijdstip dat een rijkswet houdende
      regels voor de inzet van gewapende particuliere maritieme beveiligers aan boord van schepen die de vlag van het
      Koninkrijk voeren, in werking treedt.
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel21
  - number: '22'
    text: 'Deze wet wordt aangehaald als: Wet ter Bescherming Koopvaardij.'
    url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#Artikel22
