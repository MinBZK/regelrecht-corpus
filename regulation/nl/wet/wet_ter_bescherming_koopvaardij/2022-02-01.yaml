preamble:
  text: |-
    Wij Willem Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een wettelijke regeling te treffen op grond waarvan
    Nederlandse koopvaardijschepen bij de doorgang van gevaarlijke zeegebieden gebruik kunnen maken van gewapende
    particuliere maritieme beveiligers indien niet in militaire bescherming kan worden voorzien;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0042278/2022-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aanwenden van geweld:* het gebruiken van
      geweld en het dreigen met geweld, waaronder wordt begrepen het ter hand nemen van een vuurwapen;
        - *beschermingsmaatregelen:* plannings- en operationele maatregelen van scheepsbeheerders en kapiteins voor de
      bescherming tegen piraterij;
        - *geaccrediteerde certificerende instelling:* een instelling die is geaccrediteerd door een accrediterende
      instantie voor het uitgeven van een ISO-certificaat aan de hand van een normdocument van de International
      Organization for Standardization;
        - *geweld:* elke dwangmatige kracht van meer dan geringe betekenis uitgeoefend op personen of zaken;
        - *geweldsmiddel:* de krachtens [artikel 8][ref1] van deze wet aangewezen uitrusting en bewapening waarmee geweld
      kan worden uitgeoefend;
        - *ISO-certificaat:* verklaring waarmee een certificerende instelling kenbaar maakt dat gedurende een bepaalde
      periode een gerechtvaardigd vertrouwen bestaat dat het hierin genoemde maritieme beveiligingsbedrijf voldoet aan
      het in de verklaring genoemde normdocument van de International Organization for Standardization;
        - *kapitein:* de gezagvoerder van een schip;
        - *koopvaardij:* handelsscheepvaart;
        - *maritiem beveiligingsbedrijf:* een onderneming of een onderdeel daarvan die in de uitoefening van beroep of
      bedrijf beveiligingswerkzaamheden aan boord van een schip aanbiedt en verricht en daarbij in hoofdzaak gebruik
      maakt van personen;
        - *maritieme beveiligingswerkzaamheden:* het bewaken van de veiligheid van de personen en goederen aan boord van
      een schip door particulier maritiem beveiligingspersoneel;
        - *Onze Minister:* Onze Minister van Justitie en Veiligheid;
        - *particulier maritiem beveiligingspersoneel:* personeel in dienst van een maritiem beveiligingsbedrijf of
      personeel dat ter beschikking is gesteld aan het maritiem beveiligingsbedrijf op basis van een uitzendovereenkomst;
        - *piraterij:* iedere onwettige daad van geweld of aanhouding, alsmede iedere daad van plundering die door de
      bemanning of de passagiers van een particulier schip voor persoonlijke doeleinden buiten de territoriale zee van
      een staat wordt gepleegd jegens een ander schip, of een poging daartoe;
        - *scheepsbeheerder:* de scheepsbeheerder als bedoeld in
      [artikel 1, eerste lid, onder 1, van de Wet Zeevarenden][ref2];
        - *schip:* een zeeschip als bedoeld in [artikel 8:2 van het Burgerlijk Wetboek][ref3], in gebruik voor de
      koopvaardij;
        - *teamleider:* de particuliere maritieme beveiliger die door het maritiem beveiligingsbedrijf is aangewezen als
      leidinggevende over het overige particulier maritiem beveiligingspersoneel en die de operationele leiding over het
      particulier maritiem beveiligingspersoneel heeft tijdens het transport;
        - *territoriale zee:* de territoriale zee als bedoeld in het Verdrag van de Verenigde Naties inzake het recht van
      de zee (PbEG 1998, L 179/4);
        - *transport:* verplaatsing van een schip tussen twee of meer zeehavens;
        - *vergunninghouder:* maritiem beveiligingsbedrijf dat houder van een vergunning als bedoeld in
      [artikel 3, eerste lid][ref4], is;
        - *zeevarende:* de natuurlijke persoon die in enige hoedanigheid werkzaamheden verricht aan boord van een schip.


      [ref1]: https://wetten.overheid.nl/BWBR0042278#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0042278#Artikel3
