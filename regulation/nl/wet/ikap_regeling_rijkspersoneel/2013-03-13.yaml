  - number: '4'
    text: |-
      1 De ambtenaar kan een aanvraag indienen om in een bepaalde periode minder uren te werken dan de voor hem geldende
      arbeidsduur.Indien sprake is van een arbeidsduur van meer dan 36 uur per week dient, alvorens de aanvraag in
      behandeling kan worden genomen, die arbeidsduur teruggebracht te worden tot ten hoogste gemiddeld 36 uur per week.
      Het aantal minder te werken uren is maximaal 80 uur per kalenderjaar. Bij een onvolledige arbeidsduur geldt een
      naar evenredigheid vastgesteld lager aantal hele uren als maximum. De uitkomst wordt zonodig afgerond op hele uren
      naar boven. Voor dezelfde periode kan niet een tweede aanvraag om nog minder uren te mogen werken worden ingediend.

      2 Per minder gewerkt uur heeft een inhouding op het salaris van de ambtenaar plaats die maandelijks wordt
      vastgesteld op basis van het gemiddelde aantal minder te werken uren per maand gedurende de periode dat de
      ambtenaar minder werkt.
    url: https://wetten.overheid.nl/BWBR0015799/2013-03-13#Artikel4
  - number: '5'
    text: |-
      1 De ambtenaar kan een aanvraag indienen om zijn aanspraak op vakantie te verminderen. Het totale aantal uren
      vakantie waarmee de aanspraak in een jaar kan worden verminderd, bedraagt ten hoogste het aantal uren vakantie
      waarop de ambtenaar over het desbetreffende kalenderjaar aanspraak heeft, verminderd met: 144 uur vermenigvuldigd
      met de voor de ambtenaar geldende arbeidsduurfactor. Zo nodig vindt afronding op hele uren naar boven plaats.

      2 Voor elk uur waarmee de aanspraak op vakantie wordt verminderd ontvangt de ambtenaar een vergoeding. Deze
      vergoeding wordt in een keer uitbetaald.
    url: https://wetten.overheid.nl/BWBR0015799/2013-03-13#Artikel5
  - number: '6'
    text: |-
      1 De ambtenaar kan bij het bevoegd gezag een aanvraag indienen om in ruil voor een belastingvrije vergoeding voor
      of verstrekking van een of meer in het tweede lid genoemde bestemmingsmogelijkheden geheel of gedeeltelijk af te
      zien van een of meer van de volgende aanspraken:

      a. maximaal 10% van het jaarsalaris;

      b. de vergoeding voor meer uren werken, bedoeld in [artikel 3][ref1];

      c. de vergoeding voor de vermindering van de jaarlijkse aanspraak op vakantie, bedoeld in [artikel 5][ref2];

      d. de vakantie-uitkering;

      e. de eindejaarsuitkering, mits deze wordt ingezet voor de bestemmingsmogelijkheid, genoemd in het tweede lid,
      onder h.

      2 Voor zover de geldende fiscale bepalingen dit mogelijk maken zijn de belastingvrije bestemmingsmogelijkheden:

      a. bedrijfsfitness;

      b. een fiets voor het woon-werkverkeer en een fietsverzekering;

      c. de inrichting van een telewerkruimte;

      d. vakliteratuur;

      e. een studie/opleiding voor een beroep;

      f. openbaar vervoerbewijzen die mede voor het werk worden gebruikt;

      g. vakbondscontributies;

      h. een aanvulling op de tegemoetkoming voor woon-werkverkeer bij of krachtens het
      [Verplaatsingskostenbesluit 1989][ref3] tot maximaal het verschil tussen het bedrag van de tegemoetkoming en het
      bedrag dat voor de in het zevende lid bedoelde kilometers belastingvrij mag worden vergoed.

      3 Van een aanspraak als genoemd in het eerste lid kan slechts worden afgezien als deze aanspraak nog niet tot
      uitbetaling is gekomen.

      4 Voor zover de fiscale bepalingen dit mogelijk maken kan de gevraagde belastingvrije vergoeding in een keer worden
      uitbetaald voorafgaande aan het moment waarop de ingezette aanspraken tot uitbetaling zouden zijn gekomen.

      5 De ambtenaar dient bij de in het eerste lid bedoelde aanvraag, maar uiterlijk binnen een maand na ontvangst van
      de belastingvrije vergoeding, bewijsstukken te overleggen waaruit blijkt dat de kosten waarvoor die vergoeding is
      verstrekt daadwerkelijk zijn gemaakt.

      6 In afwijking van het eerste lid, vergoedt het bevoegd gezag automatisch de belastingvrije
      bestemmingsmogelijkheid, genoemd in artikel 6, tweede lid, onderdeel h, en zet daartoe de eindejaarsuitkering,
      genoemd in artikel 6, eerste lid, onderdeel e, en indien nodig maximaal 10% van het jaarsalaris, genoemd in artikel
      6, eerste lid, onderdeel a, in.

      7 Indien de ambtenaar geheel of gedeeltelijk afziet van de automatische vergoeding als bedoeld in artikel 6,
      zesde lid, dan meldt hij dit, voor 1 november van het kalenderjaar waarin wordt overgegaan tot uitkering van deze
      belastingvrije bestemmingsmogelijkheid bij het bevoegd gezag. De melding wordt gedaan op een door het bevoegd gezag
      aan te geven wijze.

      8 De in het tweede lid, onder h, genoemde vergoeding wordt gebaseerd op de kilometers berekend overeenkomstig
      [artikel 12, zesde lid, van de Verplaatsingskostenregeling 1989][ref4]. De reisafstand, bedoeld in
      [artikel 11, vierde lid, van de Verplaatsingskostenregeling 1989][ref5] komt uitsluitend in aanmerking als deze
      meer dan een kilometer is.


