preamble:
  text: |-
    Gelet op artikel 21c van het Algemeen Rijksambtenarenreglement en artikel 34c van het Ambtenarenreglement Staten-
    Generaal;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015799/2013-03-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. ARAR: [Algemeen Rijksambtenarenreglement][ref1];

      b. ARSG: [Ambtenarenreglement Staten-Generaal][ref2];

      c. BBRA 1984: [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref3];

      d. IKAP: Individuele Keuzen in het Arbeidsvoorwaardenpakket;

      e. Onze Minister: het hoofd van het betrokken ministerie;

      f. ambtenaar: degene, die is aangesteld op grond van het [ARAR][ref4] of [ARSG][ref5];

      g. bevoegd gezag: het met betrekking tot de toepassing van dit besluit tot beslissen bevoegd gezag;

      h. arbeidsduur, arbeidsduurfactor, vakantie: hetgeen daaronder wordt verstaan in het [ARAR][ref6] of [ARSG][ref7];

      i. peildatum: de eerste dag van de maand waarin de ambtenaar op grond van dit besluit een aanvraag heeft ingediend;

      j. salaris, salaris per uur, vakantie-uitkering: hetgeen daaronder wordt verstaan in het [BBRA 1984][ref8];

      k. jaarsalaris: het salaris gedurende het kalenderjaar waarin van dit besluit gebruik wordt gemaakt;

      l. bedrijfsfitness: bedrijfsfitness als bedoeld in [artikel 29 van de Uitvoeringsregeling loonbelasting 2001][ref9],
      zoals dit op 31 december 2010 luidde.


