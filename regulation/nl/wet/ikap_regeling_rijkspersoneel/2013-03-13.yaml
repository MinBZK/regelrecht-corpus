        artikel: '29'
  - number: '2'
    text: |-
      1 De ambtenaar maakt zijn keuze(n) in het kader van IKAP kenbaar door middel van een aanvraag. De aanvraag wordt
      ingediend op een door het bevoegd gezag aangegeven wijze.

      2 De ambtenaar kan zijn keuze(n) maandelijks kenbaar maken.

      3 De aanvraag dient te worden ingediend uiterlijk vóór de eerste dag van de tweede maand die voorafgaat aan de
      maand waarin aan de keuze uitvoering moet worden gegeven. Het bevoegd gezag kan toestaan dat de aanvraag na genoemd
      tijdstip wordt ingediend.

      4 Als de aanvraag betrekking heeft op een bepaalde periode dient in de aanvraag de desbetreffende periode in hele
      kalendermaanden te worden aangegeven.

      5 Met uitzondering van de keuze voor een maandelijkse toekenning van een belastingvrije vergoeding voor een studie/
      opleiding voor een beroep, dient een gemaakte keuze binnen het kalenderjaar te zijn gerealiseerd.

      6 De ambtenaar kan binnen een kalenderjaar niet kiezen:

      a. voor zowel meer uren werken, bedoeld in [artikel 3][ref1], als voor minder uren werken, bedoeld in
      [artikel 4][ref2];

      b. voor zowel minder uren werken, bedoeld in [artikel 4][ref3], als voor vermindering van de aanspraak op vakantie,
      bedoeld in [artikel 5][ref4].

      7 Het bevoegd gezag kent de aanvraag toe, tenzij een zwaarwegend dienstbelang zich tegen honorering van de aanvraag
      verzet.

      8 Op een gehonoreerde aanvraag kan gedurende de periode waarop deze betrekking heeft niet meer worden teruggekomen.

      9 De vergoeding voor meer uren werken, bedoeld in [artikel 3][ref5], de inhouding voor minder uren werken, bedoeld
      in [artikel 4][ref6], alsmede de vergoeding voor de uren waarmee de aanspraak op vakantie wordt verlaagd, bedoeld
      in [artikel 5][ref7], worden berekend op basis van het salaris per uur dat de ambtenaar geniet op de peildatum.
      Eventuele aanpassingen van het salaris met terugwerkende kracht naar een datum op of voor de peildatum hebben geen
      invloed op het per de peildatum vastgestelde salaris per uur.


