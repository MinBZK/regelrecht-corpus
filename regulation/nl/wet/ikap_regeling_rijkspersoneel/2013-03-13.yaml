  - number: '3'
    text: |-
      1 De ambtenaar kan een aanvraag indienen om in een bepaalde periode meer uren te werken dan de voor hem geldende
      arbeidsduur. Het aantal meer te werken uren is maximaal 100 uur per kalenderjaar. Bij een onvolledige arbeidsduur
      geldt een naar evenredigheid vastgesteld lager aantal hele uren als maximum. De uitkomst wordt zo nodig afgerond op
      hele uren naar boven. Het totaal van de arbeidsduur en het ingevolge dit lid toegewezen aantal meer te werken uren
      bedraagt niet meer dan gemiddeld 40 uur per week. Voor dezelfde periode kan niet een tweede aanvraag om nog meer
      uren te mogen werken worden ingediend.

      2 Per meer gewerkt uur ontvangt de ambtenaar een vergoeding die maandelijks wordt uitbetaald op basis van het
      gemiddelde aantal meer te werken uren per maand gedurende de periode dat de ambtenaar meer uren werkt.

      3 Het eerste lid is niet van toepassing op de ambtenaar:

      a. wiens gemiddelde wekelijkse werktijd op grond van [artikel 21a van het ARAR][ref1] of
      [artikel 34a van het ARSG][ref2] is teruggebracht;

      b. die op grond van [artikel 33g van het ARAR][ref3] of [artikel 62a van het ARSG][ref4] ouderschapsverlof geniet;

      c. die buitengewoon verlof van lange duur geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel34a
