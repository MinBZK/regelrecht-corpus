  - number: '2.1'
    text: |-
      De ambtenaar maakt zijn keuze(n) in het kader van IKAP kenbaar door middel van een aanvraag. De aanvraag wordt
      ingediend op een door het bevoegd gezag aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel2
  - number: '2.2'
    text: De ambtenaar kan zijn keuze(n) maandelijks kenbaar maken.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel2
  - number: '2.3'
    text: |-
      De aanvraag dient te worden ingediend uiterlijk vóór de eerste dag van de tweede maand die voorafgaat aan de maand
      waarin aan de keuze uitvoering moet worden gegeven. Het bevoegd gezag kan toestaan dat de aanvraag na genoemd
      tijdstip wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel2
  - number: '2.4'
    text: |-
      Als de aanvraag betrekking heeft op een bepaalde periode dient in de aanvraag de desbetreffende periode in hele
      kalendermaanden te worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel2
  - number: '2.5'
    text: |-
      Met uitzondering van de keuze voor een maandelijkse toekenning van een belastingvrije vergoeding voor een studie/
      opleiding voor een beroep, dient een gemaakte keuze binnen het kalenderjaar te zijn gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel2
  - number: '2.6'
    text: 'De ambtenaar kan binnen een kalenderjaar niet kiezen:'
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel2
  - number: 2.6.a
    text: |-
      voor zowel meer uren werken, bedoeld in [artikel 3][ref1], als voor minder uren werken, bedoeld in
      [artikel 4][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015799#Artikel4
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0015799
        artikel: '4'
  - number: 2.6.b
    text: |-
      voor zowel minder uren werken, bedoeld in [artikel 4][ref1], als voor vermindering van de aanspraak op vakantie,
      bedoeld in [artikel 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015799#Artikel5
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0015799
        artikel: '5'
  - number: '2.7'
    text: |-
      Het bevoegd gezag kent de aanvraag toe, tenzij een zwaarwegend dienstbelang zich tegen honorering van de aanvraag
      verzet.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel2
  - number: '2.8'
    text: Op een gehonoreerde aanvraag kan gedurende de periode waarop deze betrekking heeft niet meer worden teruggekomen.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel2
  - number: '2.9'
    text: |-
      De vergoeding voor meer uren werken, bedoeld in [artikel 3][ref1], de inhouding voor minder uren werken, bedoeld
      in [artikel 4][ref2], alsmede de vergoeding voor de uren waarmee de aanspraak op vakantie wordt verlaagd, bedoeld
      in [artikel 5][ref3], worden berekend op basis van het salaris per uur dat de ambtenaar geniet op de peildatum.
      Eventuele aanpassingen van het salaris met terugwerkende kracht naar een datum op of voor de peildatum hebben geen
      invloed op het per de peildatum vastgestelde salaris per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015799#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0015799#Artikel5
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0015799
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0015799
        artikel: '5'
  - number: '3.1'
    text: |-
      De ambtenaar kan een aanvraag indienen om in een bepaalde periode meer uren te werken dan de voor hem geldende
      arbeidsduur. Het aantal meer te werken uren is maximaal 100 uur per kalenderjaar. Bij een onvolledige arbeidsduur
      geldt een naar evenredigheid vastgesteld lager aantal hele uren als maximum. De uitkomst wordt zo nodig afgerond op
      hele uren naar boven. Het totaal van de arbeidsduur en het ingevolge dit lid toegewezen aantal meer te werken uren
      bedraagt niet meer dan gemiddeld 40 uur per week. Voor dezelfde periode kan niet een tweede aanvraag om nog meer
      uren te mogen werken worden ingediend.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel3
  - number: '3.2'
    text: |-
      Per meer gewerkt uur ontvangt de ambtenaar een vergoeding die maandelijks wordt uitbetaald op basis van het
      gemiddelde aantal meer te werken uren per maand gedurende de periode dat de ambtenaar meer uren werkt.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel3
  - number: '3.3'
    text: 'Het eerste lid is niet van toepassing op de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel3
  - number: 3.3.a
    text: |-
      wiens gemiddelde wekelijkse werktijd op grond van [artikel 21a van het ARAR][ref1] of
      [artikel 34a van het ARSG][ref2] is teruggebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel34a
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 21a
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 34a
  - number: 3.3.b
    text: |-
      die op grond van [artikel 33g van het ARAR][ref1] of [artikel 62a van het ARSG][ref2] ouderschapsverlof geniet;


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33g
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel62a
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 33g
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 62a
  - number: 3.3.c
    text: die buitengewoon verlof van lange duur geniet.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel3
  - number: '4.1'
    text: |-
      De ambtenaar kan een aanvraag indienen om in een bepaalde periode minder uren te werken dan de voor hem geldende
      arbeidsduur.Indien sprake is van een arbeidsduur van meer dan 36 uur per week dient, alvorens de aanvraag in
      behandeling kan worden genomen, die arbeidsduur teruggebracht te worden tot ten hoogste gemiddeld 36 uur per week.
      Het aantal minder te werken uren is maximaal 80 uur per kalenderjaar. Bij een onvolledige arbeidsduur geldt een
      naar evenredigheid vastgesteld lager aantal hele uren als maximum. De uitkomst wordt zonodig afgerond op hele uren
      naar boven. Voor dezelfde periode kan niet een tweede aanvraag om nog minder uren te mogen werken worden ingediend.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel4
  - number: '4.2'
    text: |-
      Per minder gewerkt uur heeft een inhouding op het salaris van de ambtenaar plaats die maandelijks wordt vastgesteld
      op basis van het gemiddelde aantal minder te werken uren per maand gedurende de periode dat de ambtenaar minder
      werkt.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel4
  - number: '5.1'
    text: |-
      De ambtenaar kan een aanvraag indienen om zijn aanspraak op vakantie te verminderen. Het totale aantal uren
      vakantie waarmee de aanspraak in een jaar kan worden verminderd, bedraagt ten hoogste het aantal uren vakantie
      waarop de ambtenaar over het desbetreffende kalenderjaar aanspraak heeft, verminderd met: 144 uur vermenigvuldigd
      met de voor de ambtenaar geldende arbeidsduurfactor. Zo nodig vindt afronding op hele uren naar boven plaats.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel5
  - number: '5.2'
    text: |-
      Voor elk uur waarmee de aanspraak op vakantie wordt verminderd ontvangt de ambtenaar een vergoeding. Deze
      vergoeding wordt in een keer uitbetaald.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel5
  - number: '6.1'
    text: |-
      De ambtenaar kan bij het bevoegd gezag een aanvraag indienen om in ruil voor een belastingvrije vergoeding voor of
      verstrekking van een of meer in het tweede lid genoemde bestemmingsmogelijkheden geheel of gedeeltelijk af te zien
      van een of meer van de volgende aanspraken:
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel6
  - number: 6.1.a
    text: maximaal 10% van het jaarsalaris;
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel6
  - number: 6.1.b
    text: |-
      de vergoeding voor meer uren werken, bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel3
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '3'
  - number: 6.1.c
    text: |-
      de vergoeding voor de vermindering van de jaarlijkse aanspraak op vakantie, bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel5
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '5'
  - number: 6.1.d
    text: de vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel6
  - number: '6.2'
    text: 'Voor zover de geldende fiscale bepalingen dit mogelijk maken zijn de belastingvrije bestemmingsmogelijkheden:'
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel6
  - number: 6.2.a
    text: bedrijfsfitness;
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel6
  - number: 6.2.b
    text: een fiets voor het woon-werkverkeer en een fietsverzekering;
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel6
  - number: 6.2.c
    text: de inrichting van een telewerkruimte;
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel6
  - number: 6.2.d
    text: vakliteratuur;
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel6
  - number: 6.2.e
    text: een studie/opleiding voor een beroep;
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel6
  - number: 6.2.f
    text: openbaar vervoerbewijzen die mede voor het werk worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel6
  - number: 6.2.g
    text: vakbondscontributies.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel6
  - number: '6.3'
    text: |-
      Van een aanspraak als genoemd in het eerste lid kan slechts worden afgezien als deze aanspraak nog niet tot
      uitbetaling is gekomen.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel6
  - number: '6.4'
    text: |-
      Voor zover de fiscale bepalingen dit mogelijk maken kan de gevraagde belastingvrije vergoeding in een keer worden
      uitbetaald voorafgaande aan het moment waarop de ingezette aanspraken tot uitbetaling zouden zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel6
  - number: '6.5'
    text: |-
      De ambtenaar dient bij de in het eerste lid bedoelde aanvraag, maar uiterlijk binnen een maand na ontvangst van
      de belastingvrije vergoeding, bewijsstukken te overleggen waaruit blijkt dat de kosten waarvoor die vergoeding is
      verstrekt daadwerkelijk zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel6
  - number: '7.1'
    text: |-
      Zodra de ambtenaar in verband met ziekte gedurende een aaneengesloten periode van vier weken geheel of gedeeltelijk
      ongeschikt is zijn dienst te verrichten, wordt voor de verdere duur van de arbeidsongeschiktheid de uitbetaling van
      de maandelijkse vergoeding voor meer uren werken of de inhouding voor minder uren werken, stopgezet.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel7
  - number: '7.2'
    text: |-
      Zodra de ambtenaar weer volledig arbeidsgeschikt is, besluit het bevoegd gezag, na overleg met de ambtenaar, of en
      op welke wijze de toegewezen IKAP-aanvraag wordt voortgezet.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel7
  - number: '7.3'
    text: |-
      De voorgaande leden worden op overeenkomstige wijze toegepast zodra de ambtenaar om bijzondere redenen, anders dan
      vanwege arbeidsongeschiktheid wegens ziekte, vakantie of verlof, gedurende een aaneengesloten periode van tenminste
      vier weken geen arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel7
  - number: '8.1'
    text: |-
      Indien de ambtenaar aan wie een belastingvrije vergoeding is uitbetaald de bewijsstukken als bedoeld in
      [artikel 6, vijfde lid][ref1], niet tijdig overlegt worden over die vergoeding alsnog de verschuldigde
      loonheffingen ingehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel6
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '6'
  - number: '8.2'
    text: 'In geval van:'
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel8
  - number: 8.2.a
    text: beëindiging van het dienstverband;
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel8
  - number: 8.2.b
    text: verplaatsing naar een ander tot aanstellen bevoegd gezag binnen de sector Rijk;
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel8
  - number: 8.2.c
    text: structurele wijziging van de arbeidsduur;
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel8
  - number: 8.2.d
    text: |-
      toepassing van [artikel 21a van het ARAR][ref1] of [artikel 34a van het ARSG][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel34a
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 21a
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 34a
  - number: 8.2.e
    text: |-
      gedeeltelijk ontslag als bedoel in [artikel 94a, derde lid, van het ARAR][ref1] of artikel
      [124a, derde lid, van het ARSG][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel94a
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel124a
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 94a
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 124a
  - number: 8.2.f
    text: |-
      ouderschapsverlof als bedoeld in [artikel 33g van het ARAR][ref1] of [artikel 62a van het ARSG][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33g
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel62a
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 33g
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 62a
  - number: 8.2.g
    text: buitengewoon verlof van lange duur,
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel8
  - number: '8.3'
    text: |-
      Indien een aanvraag voor meer of minder uren werken niet meer volledig binnen het kalenderjaar kan worden
      uitgevoerd, heeft een herberekening van de vergoeding of de inhouding plaats op basis van de daadwerkelijk meer of
      minder gewerkte uren.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel8
  - number: '8.4'
    text: |-
      Indien de aanspraak op vakantie niet of niet volledig is opgebouwd, heeft een herberekening van de vakantie plaats.
      Een eventuele verrekening vindt plaats in onderling overleg tussen het bevoegd gezag en de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel8
  - number: '8.5'
    text: |-
      Bij overlijden van de ambtenaar wordt gehandeld zoals in het tweede lid is aangegeven, waarbij een eventueel saldo
      ten gunste van de werkgever niet wordt ingevorderd.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel8
  - number: '9.1'
    text: |-
      De ambtenaar is verplicht alle omstandigheden die van betekenis zijn voor de uitvoering van de toegewezen IKAP-
      aanvraag in het kader van dit besluit terstond bij het bevoegd gezag te melden.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien achteraf blijkt dat door onjuiste informatie van de ambtenaar een vergoeding ten onrechte belastingvrij is
      verstrekt, zullen de loonheffingen die over die vergoeding verschuldigd zijn, alsmede de eventuele boetes, op de
      ambtenaar worden verhaald.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel9
  - number: '10'
    text: |-
      In geval van bijzondere omstandigheden waardoor een strikte toepassing van dit besluit naar het oordeel van het
      bevoegd gezag in strijd zou zijn met de redelijkheid of de billijkheid, kan door het bevoegd gezag van dit besluit
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel10
  - number: '11'
    text: |-
      Het [besluit van de Minister van Binnenlandse Zaken en Koninkrijksrelaties van 7 juni 2001][ref1], nr. AD2001/
      U73347 (Stcrt. 120), zoals gewijzigd bij Besluit van 17 augustus 2001, nr. AD2001/U83002 (Stcrt. 161), vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0012540
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012540
  - number: '12.1'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2004 en kan terugwerken tot en met een door onze Minister
      in overleg met de centrales van verenigingen van ambtenaren overeengekomen datum in 2003 voor de onder hem
      ressorterende ambtenaren.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel12
  - number: '12.2'
    text: Dit besluit kan worden aangehaald als IKAP-regeling rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0015799/2009-01-01#Artikel12
