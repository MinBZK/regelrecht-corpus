  text: |-
    Gelet op artikel 21c van het Algemeen Rijksambtenarenreglement en artikel 34c van het Ambtenarenreglement Staten-
    Generaal;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *ARAR:* [Algemeen Rijksambtenarenreglement][ref1];

      b. *BBRA 1984:* [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2];

      c. *IKAP:* Individuele Keuzen in het Arbeidsvoorwaardenpakket;

      d. *ambtenaar:* degene, die is aangesteld op grond van het [ARAR][ref3] of het
      [Ambtenarenreglement Staten-Generaal][ref4]

      e. *bevoegd gezag:* het met betrekking tot de toepassing van dit besluit tot beslissen bevoegd gezag;

      f. *arbeidsduur, arbeidsduurfactor, vakantie:* hetgeen daaronder wordt verstaan in het [ARAR][ref5];

      g. *peildatum:* de eerste dag van de maand waarin de ambtenaar op grond van dit besluit een aanvraag heeft
      ingediend;

      h. *salaris, salaris per uur, vakantie-uitkering:* hetgeen daaronder wordt verstaan in het [BBRA 1984][ref6];

      i. *jaarsalaris:* het salaris gedurende het kalenderjaar waarin van dit besluit gebruik wordt gemaakt;

      j. *plaats van tewerkstelling:* hetgeen daaronder wordt verstaan in
      [artikel 2, eerste lid, onderdeel d, van het Verplaatsingskostenbesluit 1989][ref7].


