  - number: 6a
    text: |-
      1 Voor de in [artikel 6, tweede lid, onder a][ref1], genoemde belastingvrije vergoeding voor de bedrijfsfitness
      gelden de volgende voorwaarden:

      a. deelneming aan de bedrijfsfitness staat open voor alle of nagenoeg alle ambtenaren of voor alle of nagenoeg alle
      ambtenaren met dezelfde plaats van tewerkstelling die niet is gelegen in de woning van een van deze ambtenaren;

      b. de bedrijfsfitness vindt plaats:

      1°. in een vestiging van het bevoegd gezag of in een fitnesscentrum dat door het bevoegd gezag is aangewezen voor
      alle ambtenaren, met dien verstande dat, ingeval het bevoegd gezag voor bedrijfsfitness een overeenkomst sluit met
      één fitnessbedrijf dat meer dan één vestiging heeft, de bedrijfsfitness kan plaatsvinden in elke vestiging van dat
      fitnessbedrijf, of

      2°. in een fitnesscentrum dat door het bevoegd gezag is aangewezen voor alle ambtenaren met dezelfde niet in de
      woning van een van deze ambtenaren gelegen plaats van tewerkstelling, met dien verstande dat, ingeval het bevoegd
      gezag met betrekking tot de ambtenaren op deze arbeidsplaats voor bedrijfsfitness een overeenkomst sluit met één
      fitnessbedrijf dat meer dan één vestiging heeft, de bedrijfsfitness kan plaatsvinden in elke vestiging van dat
      fitnessbedrijf;

      c. onder bedrijfsfitness als bedoeld in de onderdelen a en b wordt verstaan: conditie- of krachttraining van
      ambtenaren welke plaatsvindt onder deskundig toezicht en welke georganiseerd of geïnitieerd wordt door het bevoegd
      gezag.

      2 De in [artikel 6, tweede lid, onder b][ref2], bedoelde belastingvrije vergoeding voor de fiets, inclusief
      fietsaccessoires, bedraagt maximaal € 750,–. Voor de toepassing van dit lid gelden de volgende voorwaarden:

      a. de ambtenaar maakt op meer dan de helft van het aantal dagen dat hij pleegt te reizen in het kader van woon-
      werkverkeer gebruik van de fiets;

      b. in het kalenderjaar en de twee voorafgaande kalenderjaren is ter zake van de aanschaf van een fiets, inclusief
      fietsaccessoires, geen belastingvrije vergoeding betaald.

      3 De in [artikel 6, tweede lid, onder c][ref3], bedoelde belastingvrije vergoeding voor de inrichting van de
      telewerkruimte bedraagt maximaal € 1.815,– in het kalenderjaar en de vier voorafgaande kalenderjaren. Voor de
      toepassing van dit lid gelden de volgende voorwaarden:

      a. de ambtenaar pleegt blijkens een overeenkomst ten minste eenmaal per week, gedurende de gebruikelijke werktijd
      en zonder dat tevens wordt gereisd naar een buiten de woning gelegen plaats van tewerkstelling, in die werkruimte
      ter vervulling van de dienstbetrekking te werken met behulp van telematica;

      b. de in het vorige onderdeel genoemde overeenkomst bevat ten minste naam en adres van de ambtenaar en het bevoegd
      gezag;

      c. De inrichting van de werkruimte in de woning voldoet aan de voorwaarden die in de [artikelen 5.4][ref4],
      [5.12][ref5] en [6.3 van het Arbeidsomstandighedenbesluit][ref6] zijn gesteld.

      4 Voor de in [artikel 6, tweede lid, onderdeel h][ref7], genoemde aanvulling op de tegemoetkoming voor woon-
      werkverkeer gelden de volgende voorwaarden.

      a. In afwijking van [artikel 6, eerste lid][ref8], betaalt het bevoegd gezag deze vergoeding automatisch uit en zet
      daartoe de eindejaarsuitkering, genoemd in artikel 6, eerste lid, onderdeel f, en indien nodig het genoten salaris
      in de maand november in tot het maximum, bedoeld in artikel 6, eerste lid, onder a.

      b. Indien de ambtenaar geheel of gedeeltelijk afziet van de automatische vergoeding, bedoeld in het eerste lid, dan
      meldt hij dit, voor 1 november van het kalenderjaar waarin wordt overgegaan tot uitkering van deze belastingvrije
      bestemmingsmogelijkheid bij het bevoegd gezag. De melding wordt gedaan op een door het bevoegd gezag aan te geven
      wijze.

      c. De in [artikel 6, tweede lid, onder h][ref9], genoemde vergoeding wordt gebaseerd op de kilometers berekend
      overeenkomstig [artikel 12, zesde lid, van de Verplaatsingskostenregeling 1989][ref10]. De reisafstand bedoeld,
      in [artikel 11, vierde lid, van de Verplaatsingskostenregeling 1989][ref11] komt uitsluitend voor vergoeding in
      aanmerking als deze meer dan een kilometer is.


