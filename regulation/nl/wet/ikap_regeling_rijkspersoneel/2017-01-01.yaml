  - number: '7'
    text: |-
      1 Zodra de ambtenaar in verband met ziekte gedurende een aaneengesloten periode van vier weken geheel of
      gedeeltelijk ongeschikt is zijn dienst te verrichten, wordt voor de verdere duur van de arbeidsongeschiktheid
      de uitbetaling van de maandelijkse vergoeding voor meer uren werken of de inhouding voor minder uren werken,
      stopgezet.

      2 Zodra de ambtenaar weer volledig arbeidsgeschikt is, besluit het bevoegd gezag, na overleg met de ambtenaar, of
      en op welke wijze de toegewezen IKAP-aanvraag wordt voortgezet.

      3 De voorgaande leden worden op overeenkomstige wijze toegepast zodra de ambtenaar om bijzondere redenen, anders
      dan vanwege arbeidsongeschiktheid wegens ziekte, vakantie of verlof, gedurende een aaneengesloten periode van
      tenminste vier weken geen arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel7
  - number: '8'
    text: |-
      1 In geval van:

      a. beëindiging van het dienstverband;

      b. verplaatsing naar een ander tot aanstellen bevoegd gezag binnen de sector Rijk;

      c. structurele wijziging van de arbeidsduur;

      d. toepassing van [artikel 21a van het ARAR][ref1];

      e.

      f. ouderschapsverlof als bedoeld in [artikel 33g van het ARAR][ref2];

      g. buitengewoon verlof van lange duur,

      wordt vastgesteld welke in het kader van dit besluit opgebouwde en in geldswaarde uit te drukken aanspraken en
      aangegane verplichtingen tussen het bevoegd gezag en de ambtenaar op dat moment bestaan. Indien van toepassing,
      vindt verrekening dan wel uitbetaling plaats.

      2 Indien een aanvraag voor meer of minder uren werken niet meer volledig binnen het kalenderjaar kan worden
      uitgevoerd, heeft een herberekening van de vergoeding of de inhouding plaats op basis van de daadwerkelijk meer of
      minder gewerkte uren.

      3 Bij overlijden van de ambtenaar wordt gehandeld zoals in het tweede lid is aangegeven, waarbij een eventueel
      saldo ten gunste van de werkgever niet wordt ingevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel33g
