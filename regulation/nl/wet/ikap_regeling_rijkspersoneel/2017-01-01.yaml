---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: ikap_regeling_rijkspersoneel
regulatory_layer: WET
publication_date: '2017-03-28'
valid_from: '2017-01-01'
bwb_id: BWBR0015799
url: https://wetten.overheid.nl/BWBR0015799/2017-01-01
preamble:
  text: |-
    Gelet op artikel 21c van het Algemeen Rijksambtenarenreglement en artikel 34c van het Ambtenarenreglement Staten-
    Generaal;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel1
  - number: 1.a
    text: |-
      *ARAR:* [Algemeen Rijksambtenarenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: 1.b
    text: |-
      *BBRA 1984:* [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 1.c
    text: '*IKAP:* Individuele Keuzen in het Arbeidsvoorwaardenpakket;'
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel1
  - number: 1.d
    text: |-
      *ambtenaar:* degene, die is aangesteld op grond van het [ARAR][ref1] of het
      [Ambtenarenreglement Staten-Generaal][ref2]


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0003229
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
      - id: ref2
        bwb_id: BWBR0003229
  - number: 1.e
    text: '*bevoegd gezag:* het met betrekking tot de toepassing van dit besluit tot beslissen bevoegd gezag;'
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel1
  - number: 1.f
    text: |-
      *arbeidsduur, arbeidsduurfactor, vakantie:* hetgeen daaronder wordt verstaan in het [ARAR][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: 1.g
    text: '*peildatum:* de eerste dag van de maand waarin de ambtenaar op grond van dit besluit een aanvraag heeft ingediend;'
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel1
  - number: 1.h
    text: |-
      *salaris, salaris per uur, vakantie-uitkering:* hetgeen daaronder wordt verstaan in het [BBRA 1984][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 1.i
    text: '*jaarsalaris:* het salaris gedurende het kalenderjaar waarin van dit besluit gebruik wordt gemaakt;'
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel1
  - number: 1.j
    text: |-
      *plaats van tewerkstelling:* hetgeen daaronder wordt verstaan in
      [artikel 2, eerste lid, onderdeel d, van het Verplaatsingskostenbesluit 1989][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel2
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004630
        artikel: '2'
  - number: '2.1'
    text: |-
      De ambtenaar maakt zijn keuze(n) in het kader van IKAP kenbaar door middel van een aanvraag. De aanvraag wordt
      ingediend op een door het bevoegd gezag aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel2
  - number: '2.2'
    text: De ambtenaar kan zijn keuze(n) maandelijks kenbaar maken.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel2
  - number: '2.3'
    text: |-
      De aanvraag dient te worden ingediend uiterlijk vóór de eerste dag van de tweede maand die voorafgaat aan de maand
      waarin aan de keuze uitvoering moet worden gegeven. Het bevoegd gezag kan toestaan dat de aanvraag na genoemd
      tijdstip wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel2
  - number: '2.4'
    text: |-
      Als de aanvraag betrekking heeft op een bepaalde periode dient in de aanvraag de desbetreffende periode in hele
      kalendermaanden te worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel2
  - number: '2.5'
    text: Een gemaakte keuze dient binnen het kalenderjaar te zijn gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel2
  - number: '2.6'
    text: 'De ambtenaar kan binnen een kalenderjaar niet kiezen:'
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel2
  - number: 2.6.a
    text: |-
      voor zowel meer uren werken, bedoeld in [artikel 3][ref1], als voor minder uren werken, bedoeld in
      [artikel 4][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015799#Artikel4
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0015799
        artikel: '4'
  - number: 2.6.b
    text: |-
      voor zowel minder uren werken, bedoeld in [artikel 4][ref1], als voor verlaging van de aanspraak op bovenwettelijke
      vakantie-uren, bedoeld in [artikel 23b ARAR][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel23b
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 23b
  - number: '2.7'
    text: |-
      Het bevoegd gezag kent de aanvraag toe, tenzij een zwaarwegend dienstbelang zich tegen honorering van de aanvraag
      verzet.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel2
  - number: '2.8'
    text: Op een gehonoreerde aanvraag kan gedurende de periode waarop deze betrekking heeft niet meer worden teruggekomen.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel2
  - number: '2.9'
    text: |-
      De vergoeding voor meer uren werken, bedoeld in [artikel 3][ref1], alsmede de inhouding voor minder uren werken,
      bedoeld in [artikel 4][ref2], worden berekend op basis van het salaris per uur dat de ambtenaar geniet op de
      peildatum. Eventuele aanpassingen van het salaris met terugwerkende kracht naar een datum op of voor de peildatum
      hebben geen invloed op het per de peildatum vastgestelde salaris per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015799#Artikel4
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0015799
        artikel: '4'
  - number: '3.1'
    text: |-
      De ambtenaar kan een aanvraag indienen om in een bepaalde periode meer uren te werken dan de voor hem geldende
      arbeidsduur. Het aantal meer te werken uren is maximaal 100 uur per kalenderjaar. Bij een onvolledige arbeidsduur
      geldt een naar evenredigheid vastgesteld lager aantal hele uren als maximum. De uitkomst wordt zo nodig afgerond op
      hele uren naar boven. Het totaal van de arbeidsduur en het ingevolge dit lid toegewezen aantal meer te werken uren
      bedraagt niet meer dan gemiddeld 40 uur per week. Voor dezelfde periode kan niet een tweede aanvraag om nog meer
      uren te mogen werken worden ingediend.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel3
  - number: '3.2'
    text: |-
      Per meer gewerkt uur ontvangt de ambtenaar een vergoeding. De vergoeding wordt uitbetaald vóór of bij aanvang van
      de periode waarin de ambtenaar meer uren werkt.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel3
  - number: '3.3'
    text: 'Het eerste lid is niet van toepassing op de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel3
  - number: 3.3.a
    text: |-
      wiens gemiddelde wekelijkse werktijd op grond van [artikel 21a van het ARAR][ref1] is teruggebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 21a
  - number: 3.3.b
    text: |-
      die op grond van [artikel 33g van het ARAR][ref1] ouderschapsverlof geniet;


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33g
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 33g
  - number: 3.3.c
    text: die buitengewoon verlof van lange duur geniet.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel3
  - number: '4.1'
    text: |-
      De ambtenaar kan een aanvraag indienen om in een bepaalde periode minder uren te werken dan de voor hem geldende
      arbeidsduur.Indien sprake is van een arbeidsduur van meer dan 36 uur per week dient, alvorens de aanvraag in
      behandeling kan worden genomen, die arbeidsduur teruggebracht te worden tot ten hoogste gemiddeld 36 uur per week.
      Het aantal minder te werken uren is maximaal 80 uur per kalenderjaar. Bij een onvolledige arbeidsduur geldt een
      naar evenredigheid vastgesteld lager aantal hele uren als maximum. De uitkomst wordt zonodig afgerond op hele uren
      naar boven. Voor dezelfde periode kan niet een tweede aanvraag om nog minder uren te mogen werken worden ingediend.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel4
  - number: '4.2'
    text: |-
      Per minder gewerkt uur vindt een inhouding op het salaris plaats. Het bedrag van de inhouding wordt verrekend in de
      resterende maanden van het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel4
  - number: '6.1'
    text: |-
      De ambtenaar kan bij het bevoegd gezag een aanvraag indienen om in ruil voor een belastingvrije vergoeding voor een
      of meer in het tweede en derde lid genoemde bestemmingsmogelijkheden geheel of gedeeltelijk af te zien van een of
      meer van de volgende aanspraken tot de hoogte van het bedrag van die vergoeding:
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
  - number: 6.1.a
    text: maximaal 10% van het jaarsalaris;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
  - number: 6.1.b
    text: |-
      de vergoeding voor meer uren werken, bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel3
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '3'
  - number: 6.1.c
    text: |-
      de vergoeding voor het verlagen van de jaarlijkse aanspraak op bovenwettelijke vakantie-uren, bedoeld in
      [artikel 23b van het ARAR][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel23b
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 23b
  - number: 6.1.d
    text: |-
      de vergoeding voor het verlagen van de aanspraak op vakantie-uren die vóór 1 januari 2016 is ontstaan als bedoeld
      in [artikel 129a van het ARAR][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel129a
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 129a
  - number: 6.1.e
    text: de vakantie-uitkering;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
  - number: 6.1.f
    text: |-
      de eindejaarsuitkering, mits deze wordt ingezet voor de bestemmingsmogelijkheid, genoemd in het tweede lid, onder
      h.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
  - number: '6.2'
    text: 'Voor zover de geldende fiscale bepalingen dit mogelijk maken zijn de belastingvrije bestemmingsmogelijkheden:'
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
  - number: 6.2.a
    text: bedrijfsfitness;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
  - number: 6.2.b
    text: een fiets voor het woon-werkverkeer, inclusief fietsaccessoires, en een fietsverzekering;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
  - number: 6.2.c
    text: de inrichting van een telewerkruimte;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
  - number: 6.2.d
    text: vakliteratuur;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
  - number: 6.2.e
    text: een studie/opleiding voor een beroep;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
  - number: 6.2.f
    text: openbaar vervoerbewijzen die mede voor het werk worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
  - number: 6.2.g
    text: vakbondscontributies;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
  - number: 6.2.h
    text: |-
      een aanvulling op de tegemoetkoming voor woon-werkverkeer bij of krachtens het
      [Verplaatsingskostenbesluit 1989][ref1] tot maximaal het verschil tussen het bedrag van de tegemoetkoming en het
      bedrag dat voor de in [artikel 6a, vierde lid, onderdeel c][ref2], genoemde aanvulling op de tegemoetkoming voor
      woon-werkverkeer belastingvrij mag worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0004630
      [ref2]: https://wetten.overheid.nl/BWBR0015799#Artikel6a
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004630
      - id: ref2
        bwb_id: BWBR0015799
        artikel: 6a
  - number: '6.3'
    text: |-
      Van een aanspraak als genoemd in het eerste lid kan slechts worden afgezien als deze aanspraak nog niet tot
      uitbetaling is gekomen.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
  - number: '6.4'
    text: |-
      Voor zover de fiscale bepalingen dit mogelijk maken kan de gevraagde belastingvrije vergoeding in een keer worden
      uitbetaald voorafgaande aan het moment waarop de ingezette aanspraken tot uitbetaling zouden zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
  - number: '6.5'
    text: |-
      De ambtenaar dient bij de in het eerste lid bedoelde aanvraag bewijsstukken te overleggen waaruit blijkt dat de
      kosten waarvoor die vergoeding is verstrekt daadwerkelijk zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6
  - number: 6a.1
    text: |-
      Voor de in [artikel 6, tweede lid, onder a][ref1], genoemde belastingvrije vergoeding voor de bedrijfsfitness
      gelden de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel6
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '6'
  - number: 6a.1.a
    text: |-
      deelneming aan de bedrijfsfitness staat open voor alle of nagenoeg alle ambtenaren of voor alle of nagenoeg alle
      ambtenaren met dezelfde plaats van tewerkstelling die niet is gelegen in de woning van een van deze ambtenaren;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
  - number: 6a.1.b
    text: 'de bedrijfsfitness vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
  - number: 6a.1.b.1°
    text: |-
      in een vestiging van het bevoegd gezag of in een fitnesscentrum dat door het bevoegd gezag is aangewezen voor alle
      ambtenaren, met dien verstande dat, ingeval het bevoegd gezag voor bedrijfsfitness een overeenkomst sluit met één
      fitnessbedrijf dat meer dan één vestiging heeft, de bedrijfsfitness kan plaatsvinden in elke vestiging van dat
      fitnessbedrijf, of
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
  - number: 6a.1.b.2°
    text: |-
      in een fitnesscentrum dat door het bevoegd gezag is aangewezen voor alle ambtenaren met dezelfde niet in de
      woning van een van deze ambtenaren gelegen plaats van tewerkstelling, met dien verstande dat, ingeval het bevoegd
      gezag met betrekking tot de ambtenaren op deze arbeidsplaats voor bedrijfsfitness een overeenkomst sluit met één
      fitnessbedrijf dat meer dan één vestiging heeft, de bedrijfsfitness kan plaatsvinden in elke vestiging van dat
      fitnessbedrijf;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
  - number: 6a.1.c
    text: |-
      onder bedrijfsfitness als bedoeld in de onderdelen a en b wordt verstaan: conditie- of krachttraining van
      ambtenaren welke plaatsvindt onder deskundig toezicht en welke georganiseerd of geïnitieerd wordt door het bevoegd
      gezag.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
  - number: 6a.2
    text: |-
      De in [artikel 6, tweede lid, onder b][ref1], bedoelde belastingvrije vergoeding voor de fiets, inclusief
      fietsaccessoires, bedraagt maximaal € 750,–. Voor de toepassing van dit lid gelden de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel6
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '6'
  - number: 6a.2.a
    text: |-
      de ambtenaar maakt op meer dan de helft van het aantal dagen dat hij pleegt te reizen in het kader van woon-
      werkverkeer gebruik van de fiets;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
  - number: 6a.2.b
    text: |-
      in het kalenderjaar en de twee voorafgaande kalenderjaren is ter zake van de aanschaf van een fiets, inclusief
      fietsaccessoires, geen belastingvrije vergoeding betaald.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
  - number: 6a.3
    text: |-
      De in [artikel 6, tweede lid, onder c][ref1], bedoelde belastingvrije vergoeding voor de inrichting van de
      telewerkruimte bedraagt maximaal € 1.815,– in het kalenderjaar en de vier voorafgaande kalenderjaren. Voor de
      toepassing van dit lid gelden de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel6
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '6'
  - number: 6a.3.a
    text: |-
      de ambtenaar pleegt blijkens een overeenkomst ten minste eenmaal per week, gedurende de gebruikelijke werktijd en
      zonder dat tevens wordt gereisd naar een buiten de woning gelegen plaats van tewerkstelling, in die werkruimte ter
      vervulling van de dienstbetrekking te werken met behulp van telematica;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
  - number: 6a.3.b
    text: |-
      de in het vorige onderdeel genoemde overeenkomst bevat ten minste naam en adres van de ambtenaar en het bevoegd
      gezag;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
  - number: 6a.3.c
    text: |-
      De inrichting van de werkruimte in de woning voldoet aan de voorwaarden die in de [artikelen 5.4][ref1],
      [5.12][ref2] en [6.3 van het Arbeidsomstandighedenbesluit][ref3] zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '6'
  - number: 6a.4
    text: |-
      Voor de in [artikel 6, tweede lid, onderdeel h][ref1], genoemde aanvulling op de tegemoetkoming voor woon-
      werkverkeer gelden de volgende voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel6
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '6'
  - number: 6a.4.a
    text: |-
      In afwijking van [artikel 6, eerste lid][ref1], betaalt het bevoegd gezag deze vergoeding automatisch uit en zet
      daartoe de eindejaarsuitkering, genoemd in artikel 6, eerste lid, onderdeel f, en indien nodig het genoten salaris
      in de maand november in tot het maximum, bedoeld in artikel 6, eerste lid, onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel6
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '6'
  - number: 6a.4.b
    text: |-
      Indien de ambtenaar geheel of gedeeltelijk afziet van de automatische vergoeding, bedoeld in het eerste lid, dan
      meldt hij dit, voor 1 november van het kalenderjaar waarin wordt overgegaan tot uitkering van deze belastingvrije
      bestemmingsmogelijkheid bij het bevoegd gezag. De melding wordt gedaan op een door het bevoegd gezag aan te geven
      wijze.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
  - number: 6a.4.c
    text: |-
      De in [artikel 6, tweede lid, onder h][ref1], genoemde vergoeding wordt gebaseerd op de kilometers berekend
      overeenkomstig [artikel 12, zesde lid, van de Verplaatsingskostenregeling 1989][ref2]. De reisafstand bedoeld,
      in [artikel 11, vierde lid, van de Verplaatsingskostenregeling 1989][ref3] komt uitsluitend voor vergoeding in
      aanmerking als deze meer dan een kilometer is.


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004633#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004633#Artikel11
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0004633
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0004633
        artikel: '11'
  - number: '7.1'
    text: |-
      Zodra de ambtenaar in verband met ziekte gedurende een aaneengesloten periode van vier weken geheel of gedeeltelijk
      ongeschikt is zijn dienst te verrichten, wordt voor de verdere duur van de arbeidsongeschiktheid de uitbetaling van
      de maandelijkse vergoeding voor meer uren werken of de inhouding voor minder uren werken, stopgezet.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel7
  - number: '7.2'
    text: |-
      Zodra de ambtenaar weer volledig arbeidsgeschikt is, besluit het bevoegd gezag, na overleg met de ambtenaar, of en
      op welke wijze de toegewezen IKAP-aanvraag wordt voortgezet.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel7
  - number: '7.3'
    text: |-
      De voorgaande leden worden op overeenkomstige wijze toegepast zodra de ambtenaar om bijzondere redenen, anders dan
      vanwege arbeidsongeschiktheid wegens ziekte, vakantie of verlof, gedurende een aaneengesloten periode van tenminste
      vier weken geen arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel7
  - number: '8.1'
    text: 'In geval van:'
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel8
  - number: 8.1.a
    text: beëindiging van het dienstverband;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel8
  - number: 8.1.b
    text: verplaatsing naar een ander tot aanstellen bevoegd gezag binnen de sector Rijk;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel8
  - number: 8.1.c
    text: structurele wijziging van de arbeidsduur;
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel8
  - number: 8.1.d
    text: |-
      toepassing van [artikel 21a van het ARAR][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 21a
  - number: 8.1.f
    text: |-
      ouderschapsverlof als bedoeld in [artikel 33g van het ARAR][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33g
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 33g
  - number: 8.1.g
    text: buitengewoon verlof van lange duur,
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel8
  - number: '8.2'
    text: |-
      Indien een aanvraag voor meer of minder uren werken niet meer volledig binnen het kalenderjaar kan worden
      uitgevoerd, heeft een herberekening van de vergoeding of de inhouding plaats op basis van de daadwerkelijk meer of
      minder gewerkte uren.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel8
  - number: '8.3'
    text: |-
      Bij overlijden van de ambtenaar wordt gehandeld zoals in het tweede lid is aangegeven, waarbij een eventueel saldo
      ten gunste van de werkgever niet wordt ingevorderd.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel8
  - number: '9.1'
    text: |-
      De ambtenaar is verplicht alle omstandigheden die van betekenis zijn voor de uitvoering van de toegewezen IKAP-
      aanvraag in het kader van dit besluit terstond bij het bevoegd gezag te melden.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien achteraf blijkt dat door onjuiste informatie van de ambtenaar een vergoeding ten onrechte belastingvrij is
      verstrekt, zullen de loonheffingen die over die vergoeding verschuldigd zijn, alsmede de eventuele boetes, op de
      ambtenaar worden verhaald.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel9
  - number: '10'
    text: |-
      In geval van bijzondere omstandigheden waardoor een strikte toepassing van dit besluit naar het oordeel van het
      bevoegd gezag in strijd zou zijn met de redelijkheid of de billijkheid, kan door het bevoegd gezag van dit besluit
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel10
  - number: '11'
    text: |-
      Het [besluit van de Minister van Binnenlandse Zaken en Koninkrijksrelaties van 7 juni 2001][ref1], nr. AD2001/
      U73347 (Stcrt. 120), zoals gewijzigd bij Besluit van 17 augustus 2001, nr. AD2001/U83002 (Stcrt. 161), vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0012540
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012540
  - number: '12.1'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2004 en kan terugwerken tot en met een door onze Minister
      in overleg met de centrales van verenigingen van ambtenaren overeengekomen datum in 2003 voor de onder hem
      ressorterende ambtenaren.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel12
  - number: '12.2'
    text: Dit besluit kan worden aangehaald als IKAP-regeling rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0015799/2017-01-01#Artikel12
