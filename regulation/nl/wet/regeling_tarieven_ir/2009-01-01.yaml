  - number: '9'
    text: |-
      1 Voor het verwerken van een verzoek tot herstel als bedoeld in [artikel 23, tweede lid, van de regeling][ref1] is
      de houder die het verzoek tot herstel doet een vergoeding verschuldigd van € 1,04 per gegeven.

      2 Voor het verwerken van een kennisgeving als bedoeld in [artikel 23, derde lid, van de regeling][ref2] is de
      houder door wie of namens wie de kennisgeving is verricht een vergoeding van € 4,97 per kennisgeving per rund
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel23
