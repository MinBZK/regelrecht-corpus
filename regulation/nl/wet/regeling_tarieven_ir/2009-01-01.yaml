  - number: '8'
    text: |-
      1 Voor het verwerken van een kennisgeving als bedoeld in [artikel 21, tweede lid, van de regeling][ref1] is de
      houder door wie of namens wie de kennisgeving is verricht een vergoeding van € 1,04 per kennisgeving per rund
      verschuldigd.

      2 Voor het in [artikel 22, derde lid, van de regeling][ref2] bedoelde invoeren van ontbrekende of juiste
      gegevens is de houder namens wie de kennisgeving is verricht de volgende vergoedingen per kennisgeving per rund
      verschuldigd:

      a. ingeval aanvullend onderzoek nodig is: € 26,88;

      b. ingeval geen aanvullend onderzoek nodig is: € 16,21.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel21
