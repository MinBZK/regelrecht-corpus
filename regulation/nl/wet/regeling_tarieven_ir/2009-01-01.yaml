        artikel: '32'
  - number: '12'
    text: |-
      Ter zake van het voorhanden of het in voorraad hebben van een of meer schapen of geiten is de houder van schapen of
      geiten jaarlijks een bedrag van € 18,31 per aan de houder toegekend UBN verschuldigd.
    url: https://wetten.overheid.nl/BWBR0014539/2009-01-01#Artikel12
  - number: 12a
    text: |-
      1 Voor het op aanvraag verlenen van een goedkeuring van een model van een oormerk voor schapen en geiten als
      bedoeld in [artikel 12g, eerste lid, van de regeling][ref1] is de leverancier van het oormerk een vergoeding aan de
      Minister verschuldigd van:

      a. € 1604,29, voor zover het de goedkeuring betreft van een nieuw model;

      b. € 397,00, voor zover het de goedkeuring betreft van de wijziging van een bestaand model.

      2 Voor de registratie van een leverancier als bedoeld in [artikel 12h, eerste lid][ref2], is de leverancier van het
      oormerk een vergoeding verschuldigd aan de Minister van € 211,87.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12g
