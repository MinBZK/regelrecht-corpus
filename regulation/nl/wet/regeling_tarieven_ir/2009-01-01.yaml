  - number: '13'
    text: |-
      Indien een houder dieren van meerdere diersoorten houdt en aan die houder is één UBN toegekend, is de
      houder voor elke diersoort die hij houdt in voorkomend geval het vaste bedrag verschuldigd, bedoeld in
      [artikel 2, eerste lid][ref1], en [11, eerste lid][ref2], en het bedrag, bedoeld in [artikel 12][ref3].


