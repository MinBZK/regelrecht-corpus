preamble:
  text: |-
    Gelet op artikel 9 van verordening (EG) nr. 1760/2000 van het Europees Parlement en de Raad van de Europese Unie
    van 17 juli 2000 (PbEG L 204) tot vaststelling van een identificatie- en registratieregeling voor runderen en
    inzake de etikettering van rundvlees en rundvleesproducten en tot intrekking van Verordening (EG) nr. 820/97 van
    de Raad;

    Gelet op artikel 13 van de Landbouwwet, op artikel 94 van de Gezondheids- en welzijnswet voor dieren, artikel 3 van
    het Besluit identificatie en registratie van dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014539/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: Minister van Landbouw, Natuurbeheer en Visserij;

      b. regeling: [Regeling identificatie en registratie van dieren][ref1];

      c. rund: dier dat behoort tot de familie der Bovidae en het geslacht Bos, met inbegrip van de soorten Bison bison
      en Bubalus bubalus;

      d. varken: dier dat behoort tot de familie der Suidae;

      e. schaap: dier dat behoort tot de familie der Bovidae en het geslacht Ovis;

      f. geit: dier dat behoort tot de familie der Bovidae en het geslacht Capra;

      g. dieren: runderen, varkens, schapen en geiten;

      h. UBN: uniek bedrijfsnummer als bedoeld in [artikel 3, eerste lid, van de regeling][ref2];

      i. I&R-systeem rund: I&R-systeem rund als bedoeld in [artikel 14, onderdeel a, van de regeling][ref3];

      j. slachthuis: inrichting of installatie die wordt gebruikt voor het commercieel slachten of doden van runderen
      of varkens;

      k. verzamelcentrum: plaats die wordt gebruikt ten behoeve van het bijeenbrengen van varkens;


      [ref1]: https://wetten.overheid.nl/BWBR0014538
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel14
