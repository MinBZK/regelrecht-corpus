        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      1 Voor het op aanvraag verlenen van een goedkeuring van een model van een oormerk voor runderen als bedoeld in
      [artikel 12a, onderdeel a, van de regeling](onbekend) is de leverancier van het oormerk een vergoeding verschuldigd
      aan de minister van:

      a. voor zover het betreft de goedkeuring van een nieuw model: € 1604,29;

      b. voor zover het betreft de goedkeuring van de wijziging van een bestaand model: € 397,00.

      2 Voor de registratie van een leverancier als bedoeld in [artikel 12a, onderdeel b, van de regeling](onbekend), is
      de leverancier van het oormerk een vergoeding verschuldigd aan de minister van € 211,87.
    url: https://wetten.overheid.nl/BWBR0014539/2009-01-01#Artikel4
  - number: '5'
    text: |-
      Voor het op aanvraag in papieren versie verstrekken van de overzichten, bedoeld in
      [artikel 14, onderdelen c, d, e, f en h, van de regeling][ref1], is de aanvrager de volgende vergoedingen
      verschuldigd:

      a. mutatieoverzicht:

      1°. een vast bedrag van € 3,81, en

      2°. een bedrag van € 0,005 per regel die betrekking heeft op een dier;

      b. stallijst:

      1°. een vast bedrag van € 2,53, en

      2°. een bedrag van € 0,005 per regel die betrekkin heeft op een dier;

      c. afschrift bedrijfsregister:

      1°. een vast bedrag van € 3,81, en

      2°. een bedrag van € 0,005 per regel die betrekking heeft op een dier;

      d. overzicht dierhistoriestatus: € 1,61;

      e. overzicht dierstatus: € 1,61.


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0014539/2009-01-01#Artikel5
