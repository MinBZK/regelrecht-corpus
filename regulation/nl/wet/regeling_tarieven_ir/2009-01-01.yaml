  - number: '14'
    text: |-
      1 De hoogte van het totaal verschuldigde bedrag wordt vastgesteld door de minister.

      2 De ingevolge deze regeling verschuldigde bedragen zijn verschuldigd aan de minister.
    url: https://wetten.overheid.nl/BWBR0014539/2009-01-01#Artikel14
  - number: '15'
    text: |-
      1 De Regeling tarieven oormerken I&R runderen 2002 wordt ingetrokken.

      2 De Regeling tarieven I&R 2002 wordt ingetrokken.

      3 De in het eerste en tweede lid genoemde regelingen blijven van toepassing ten aanzien van de bevoegdheid van de
      minister om de hoogte van de totaal verschuldigde bedragen over het jaar 2002 overeenkomstig die regelingen vast
      te stellen.
    url: https://wetten.overheid.nl/BWBR0014539/2009-01-01#Artikel15
  - number: '16'
    text: |-
      In afwijking van [artikel 11, vierde lid, tweede volzin][ref1], bepaalt de houder het gemiddeld aantal in 2003 door
      de houder gehouden varkens door het aantal door de houder op 15 januari 2003 en vervolgens op de eerste dag van elk
      volgend kwartaal gehouden varkens op te tellen en vervolgens te delen door vier.


      [ref1]: https://wetten.overheid.nl/BWBR0014539#Artikel11
