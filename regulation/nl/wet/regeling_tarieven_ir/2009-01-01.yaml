  - number: '2'
    text: |-
      1 Ter zake van het voorhanden of het in voorraad hebben van runderen is de houder van een of meer runderen
      jaarlijks een bedrag verschuldigd dat bestaat uit:

      a. een vast bedrag per aan de houder toegekend UBN van € 34,10, en

      b. een bedrag afhankelijk van de aantallen runderen die op het bedrijf van de houder zijn geboren, zijn aangevoerd
      vanuit Nederland, of zijn aangevoerd uit het buitenland.

      2 Het verschuldigde bedrag, bedoeld in het eerste lid, onderdeel b, bedraagt:

      a. € 2,21 per rund dat is geboren,

      b. € 0,096 per rund dat is aangevoerd vanuit Nederland, en

      c. € 1,07 per rund dat is aangevoerd uit het buitenland,

      op het bedrijf van de houder, bedoeld in het eerste lid.

      3 In afwijking van het tweede lid, onderdeel c, is het verschuldigde bedrag per rund dat vanuit het buitenland
      rechtstreeks wordt aangevoerd op een slachthuis € 0,096.
    url: https://wetten.overheid.nl/BWBR0014539/2009-01-01#Artikel2
  - number: '3'
    text: |-
      De aantallen runderen die op het bedrijf van een houder zijn geboren, dan wel aangevoerd vanuit Nederland of uit
      het buitenland, zoals bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], zijn de aantallen in een kalenderjaar
      op het bedrijf van de houder geboren of aangevoerde runderen zoals geregistreerd onder het aan de houder toegekende
      UBN in het I&R-systeem Rund.


      [ref1]: https://wetten.overheid.nl/BWBR0014539#Artikel2
    url: https://wetten.overheid.nl/BWBR0014539/2009-01-01#Artikel3
    references:
