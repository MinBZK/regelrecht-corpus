  - number: '7.4'
    text: |-
      Indien de door de producent in een kalendermaand uit een energiebron waarvoor ingevolge [artikel 9][ref1]
      een afzonderlijk vrijgesteld bedrag geldt, opgewekte en ingevoede elektriciteit, bedoeld in
      [artikel 3, eerste lid][ref2], is opgewekt met behulp van een hybride productie-installatie die gebruikmaakt van
      energiebronnen waarvoor het vrijgestelde bedrag, bedoeld in artikel 9, verschilt, wordt bij de berekening, bedoeld
      in het derde lid, de hoeveelheid per uur met deze productie-installatie opgewekte en ingevoede elektriciteit als
      bedoeld in artikel 3, eerste lid, berekend op basis van de verhouding van de aandelen van de in de kalendermaand
      uit deze energiebronnen opgewekte elektriciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: '7.5'
    text: |-
      Indien de elektriciteit, bedoeld in [artikel 3, eerste lid][ref1], is opgewekt met behulp van een hybride
      productie-installatie als bedoeld in het vierde lid, wordt het aandeel van de in de kalendermaand opgewekte
      elektriciteit:


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: 7.5.a
    text: |-
      voor biomassabrandstoffen of een andere inframarginale energiebron, die tevens is een hernieuwbare energiebron als
      bedoeld in [artikel 1, eerste lid, onderdeel t, van de Elektriciteitswet 1998][ref1], gesteld op de hoeveelheid
      elektriciteit waarvoor garanties van oorsprong voor duurzame elektriciteit voor de betreffende kalendermaand zijn
      uitgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: 7.5.b
    text: |-
      voor steenkool of een inframarginale energiebron, die niet is een hernieuwbare energiebron als bedoeld in
      [artikel 1, eerste lid, onderdeel t, van de Elektriciteitswet 1998][ref1], gesteld op de hoeveelheid elektriciteit
      waarvoor certificaten van oorsprong voor de betreffende kalendermaand zijn uitgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: '7.6'
    text: |-
      Indien voor de met behulp van een hybride productie-installatie als bedoeld in het vijfde lid, in een kalendermaand
      opgewekte elektriciteit geen garanties van oorsprong voor duurzame elektriciteit of certificaten van oorsprong zijn
      uitgegeven, wordt het aandeel van de in de kalendermaand opgewekte elektriciteit:
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel7
  - number: 7.6.a
    text: |-
      voor biomassabrandstoffen of een andere inframarginale energiebron, die tevens is een hernieuwbare energiebron
      als bedoeld in [artikel 1, eerste lid, onderdeel t, van de Elektriciteitswet 1998][ref1], gesteld op de op basis
      van de krachtens [artikel 77 van de Elektriciteitswet 1998][ref2] gestelde regels met betrekking tot het meten
      vastgestelde hoeveelheid;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel77
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '77'
  - number: 7.6.b
    text: |-
      voor steenkool of een inframarginale energiebron, die niet tevens is een hernieuwbare energiebron als bedoeld
      in [artikel 1, eerste lid, onderdeel t, van de Elektriciteitswet 1998][ref1], gesteld op de hoeveelheid in de
      betreffende kalendermaand met de hybride productie-installatie opgewekte elektriciteit minus de hoeveelheid,
      bedoeld in onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: '7.7'
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel7
  - number: 7.7.a
    text: |-
      worden nadere regels gesteld over de wijze waarop de hoeveelheid opgewekte en ingevoede elektriciteit, bedoeld in
      het derde en vierde lid, wordt bepaald; en
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel7
  - number: 7.7.b
    text: kunnen nadere regels worden gesteld ten behoeve van de toepassing van het vierde, vijfde en zesde lid.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel7
  - number: '8.1'
    text: |-
      De gemiddelde marktinkomsten per megawattuur uit door de producent in een kalendermaand per uur uit een
      energiebron waarvoor ingevolge [artikel 9][ref1] een afzonderlijk vrijgesteld bedrag geldt, opgewekte en ingevoede
      elektriciteit als bedoeld in [artikel 3, eerste lid][ref2], worden berekend volgens de formule: GME = sME/sHE
      waarin GME staat voor: gemiddelde marktinkomsten per megawattuur uit door de producent in de kalendermaand per
      uur uit een energiebron waarvoor ingevolge [artikel 9][ref3] een afzonderlijk vrijgesteld bedrag geldt, opgewekte
      en ingevoede elektriciteit als bedoeld in [artikel 3, eerste lid][ref4], uitgedrukt in euro’s per megawattuur
      sME staat voor: de som van de marktinkomsten uit door de producent in de kalendermaand per uur uit de energiebron
      opgewekte en ingevoede elektriciteit als bedoeld in [artikel 3, eerste lid][ref5], uitgedrukt in euro’s sHE staat
      voor: de som van de hoeveelheid door de producent in de kalendermaand per uur uit de energiebron opgewekte en
      ingevoede elektriciteit als bedoeld in [artikel 3, eerste lid][ref6], minus de hoeveelheid van deze elektriciteit
      die is ingezet voor redispatch of compensatiehandel, uitgedrukt in megawatturen.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0050059#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0050059#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0050059#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0050059
        artikel: '9'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
      - id: ref5
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
      - id: ref6
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: '8.2'
    text: |-
      Indien de elektriciteit, bedoeld in het eerste lid, is opgewekt uit wind- of zonne-energie worden de gemiddelde
      marktinkomsten per megawattuur, bedoeld in het eerste lid, gecorrigeerd voor onbalans met de onbalanskosten per
      megawattuur voor elektriciteit opgewekt uit windenergie op land, windenergie op zee of zonne-energie, zoals voor
      het betreffende kalenderjaar berekend door het Planbureau voor de Leefomgeving ten behoeve van de vaststelling
      door Onze Minister voor Klimaat en Energie van de correcties voor de subsidieverlening voor de opwekking van
      elektriciteit uit hernieuwbare energiebronnen krachtens de [Kaderwet EZK- en LNV subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007919
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007919
  - number: '8.3'
    text: |-
      De marktinkomsten uit door de producent in de kalendermaand per uur uit een energiebron als bedoeld in
      [artikel 9][ref1] opgewekte en ingevoede elektriciteit als bedoeld in [artikel 3, eerste lid][ref2], wordt berekend
      volgens de formule: ME = HE x P waarin ME staat voor: marktinkomsten uit door de producent in de kalendermaand
      per uur uit de energiebron opgewekte en ingevoede elektriciteit als bedoeld in [artikel 3, eerste lid][ref3],
      uitgedrukt in euro’s HE staat voor: hoeveelheid door de producent in een uur in de kalendermaand uit
      een energiebron als bedoeld in [artikel 9][ref4] opgewekte en ingevoede elektriciteit als bedoeld in
      [artikel 3, eerste lid][ref5], minus de hoeveelheid van deze elektriciteit die is ingezet voor redispatch of
      compensatiehandel, uitgedrukt in megawatturen P staat voor: prijs voor elektriciteit voor het betreffende uur in
      de kalendermaand op de day-ahead-markt voor de biedzone Nederland op de voorafgaande dag, uitgedrukt in euro’s
      per megawattuur.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0050059#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0050059#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
