preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is een tijdelijke belasting over de marktinkomsten
    uit opgewekte elektriciteit met behulp van inframarginale energiebronnen, waaronder steenkool, in te voeren
    overeenkomstig verordening (EU) 2022/1854 van de Raad van 6 oktober 2022 betreffende een noodinterventie in verband
    met de hoge energieprijzen (PbEU 2022, L 261 I), teneinde bij te dragen tot de betaalbaarheid van energie voor
    huishoudens en bedrijven;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *accountant:* registeraccountant
      of accountant-administratieconsulent die is ingeschreven in het accountantsregister, bedoeld in
      [artikel 36, eerste lid, van de Wet op het accountantsberoep][ref1];
        - *afvalstof:* afvalstof als bedoeld in artikel 2, onderdeel 10, van [verordening 2022/1854](33754R2022);
        - *balanceringsdienstverlener:* balanceringsdienstverlener als bedoeld in artikel 2, onderdeel 12, van [verordening
      (EU) 2019/943](32019R0943) van het Europees Parlement en de Raad van 5 juni 2019 betreffende de interne markt voor
      elektriciteit (PbEU 2019, L 158);
        - *balanceringsenergiemarkt:* markt voor balanceringsenergie als bedoeld in artikel 2, onderdeel 11, van
      [verordening (EU) 2019/943](32019R0943) van het Europees Parlement en de Raad van 5 juni 2019 betreffende de
      interne markt voor elektriciteit (PbEU 2019, L 158);
        - *belastbare marktinkomen:* marktinkomsten als bedoeld in [artikel 3][ref2], die belastbaar zijn overeenkomstig
      [artikel 7][ref3];
        - *biomassabrandstoffen:* biomassabrandstoffen als bedoeld in artikel 7, eerste lid, onderdeel e, van [verordening
      2022/1854](33754R2022);
        - *certificaat van oorsprong:* certificaat van oorsprong als bedoeld in
      [artikel 1, eerste lid, onderdeel bb, van de Elektriciteitswet 1998][ref4];
        - *compensatiehandel:* compensatiehandel als bedoeld in artikel 2, onderdeel 27, van [verordening (EU) 2019/943]
      (32019R0943) van het Europees Parlement en de Raad van 5 juni 2019 betreffende de interne markt voor elektriciteit
      (PbEU 2019, L 158);
        - *directe lijn:* directe lijn als bedoeld in
      [artikel 1, eerste lid, onderdeel ar, van de Elektriciteitswet 1998][ref5];
        - *eindafnemer:* eindafnemer van elektriciteit als bedoeld in artikel 2, onderdeel 14, van [verordening 2022/1854]
      (33754R2022);
        - *elektriciteitsmarkten:* elektriciteitsmarkten als bedoeld in artikel 2, onder 9, van [richtlijn (EU) 2019/944]
      (32019L0944) van het Europees Parlement en de Raad van 5 juni 2019 betreffende gemeenschappelijke regels voor de
      interne markt voor elektriciteit en tot wijziging van [richtlijn 2012/27/EU](32012L0027) (PbEU 2019, L 158);
        - *elektriciteitsnet:* net als bedoeld in [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref6];
        - *garantie van oorsprong voor duurzame elektriciteit:* garantie van oorsprong voor duurzame elektriciteit als
      bedoeld in [artikel 1, eerste lid, onderdeel x, van de Elektriciteitswet 1998][ref7];
        - *heffingstijdvak:* periode als bedoeld in [artikel 4, eerste lid][ref8];
        - *Inframarginale energiebron:* energiebron als bedoeld in artikel 7, eerste lid, van [verordening 2022/1854]
      (33754R2022);
        - *marktinkomsten:* marktinkomsten als bedoeld in artikel 2, onderdeel 5, van [verordening 2022/1854](33754R2022);
        - *marktinkomstenverslag:* marktinkomstenverslag als bedoeld in [artikel 11][ref9];
        - *producent:* producent als bedoeld in artikel 2, onderdeel 38, van [richtlijn (EU) 2019/944](32019L0944) van
      het Europees Parlement en de Raad van 5 juni 2019 betreffende gemeenschappelijke regels voor de interne markt voor
      elektriciteit en tot wijziging van [richtlijn 2012/27/EU](32012L0027) (PbEU 2019, L 158);
        - *productie-installatie:* elektriciteitsproductie-installatie als bedoeld in artikel 2, onderdeel 28, van
      [verordening (EU) 2019/943](32019R0943) van het Europees Parlement en de Raad van 5 juni 2019 betreffende de
      interne markt voor elektriciteit (PbEU 2019, L 158);
        - *redispatching:* redispatching als bedoeld in artikel 2, onderdeel 26, van [verordening (EU) 2019/943]
      (32019R0943) van het Europees Parlement en de Raad van 5 juni 2019 betreffende de interne markt voor elektriciteit
      (PbEU 2019, L 158);
        - *rijksbelastingdienst:* rijksbelastingdienst, bedoeld in
      [artikel 1, tweede lid, van de Algemene wet inzake rijksbelastingen][ref10];
        - *verordening 2016/631:* [verordening (EU) 2016/631](32016R0631) van de Commissie van 14 april 2016 tot
      vaststelling van een netcode betreffende eisen voor de aansluiting van elektriciteitsproducenten op het net (PbEU
      2016, L 112);
        - *verordening 2022/1854:* [verordening (EU) 2022/1854](32022R1854) van de Raad van 6 oktober 2022 betreffende een
      noodinterventie in verband met de hoge energieprijzen (PbEU 2022, L 261 I).


