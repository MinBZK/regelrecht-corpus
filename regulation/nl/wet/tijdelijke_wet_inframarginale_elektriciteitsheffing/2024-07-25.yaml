        bwb_id: BWBR0050059
        artikel: '9'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: '8.4'
    text: 'Bij ministeriële regeling worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel8
  - number: 8.4.a
    text: de wijze waarop de hoeveelheid opgewekte en ingevoede elektriciteit, bedoeld in het derde lid, wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel8
  - number: 8.4.b
    text: de onbalanskosten, bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel8
  - number: 8.4.c
    text: |-
      de prijs voor elektriciteit op de day-ahead-markt voor de biedzone Nederland voor de uren in de kalendermaanden van
      het heffingstijdvak, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel8
  - number: '9'
    text: 'Het bedrag van de marktinkomsten per megawattuur dat is vrijgesteld van de inframarginale elektriciteitsheffing is:'
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel9
  - number: 9.a
    text: |-
      € 285 voor elektriciteit als bedoeld in [artikel 3, eerste lid][ref1], die is opgewekt uit gasvormige
      biomassabrandstoffen;


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: 9.b
    text: |-
      € 240 voor elektriciteit als bedoeld in [artikel 3, eerste lid][ref1], die is opgewekt uit vaste
      biomassabrandstoffen;


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: 9.c
    text: |-
      € 130 voor elektriciteit als bedoeld in [artikel 3, eerste lid][ref1], die is opgewekt uit een andere
      inframarginale energiebron, tenzij die elektriciteit is opgewekt met behulp van een productie-installatie als
      bedoeld in onderdeel d;


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: 9.d
    text: |-
      het geldende fasebedrag of basisbedrag dan wel tenderbedrag voor elektriciteit als bedoeld in
      [artikel 3, eerste lid][ref1], die is opgewekt uit een andere inframarginale energiebron met behulp van een
      productie-installatie waarvoor krachtens de [Kaderwet EZK- en LNV subsidies][ref2] subsidie is verleend voor de
      opwekking van elektriciteit uit hernieuwbare energiebronnen en voor die subsidie een fasebedrag of basisbedrag
      dan wel tenderbedrag geldt dat, zonder toepassing van een correctiefactor voor windenergie, hoger is dan € 130
      per megawattuur;


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007919
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007919
  - number: 9.e
    text: |-
      € 130 voor elektriciteit als bedoeld in [artikel 3, eerste lid][ref1], die is opgewekt uit steenkool, ofwel het
      bedrag dat volgt uit onderstaande formule, indien dit hoger is dan € 130:


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: '10.1'
    text: |-
      In afwijking van [artikel 7, derde lid][ref1], en [artikel 8][ref2], kan een producent de belastbare
      marktinkomsten uit door hem in een kalendermaand opgewekte en ingevoede elektriciteit als bedoeld in
      [artikel 3, eerste lid][ref3], voor elk van de kalendermaanden in het heffingstijdvak en elk van de energiebronnen
      waarvoor ingevolge [artikel 9][ref4] een afzonderlijk bedrag geldt, berekenen met overeenkomstige toepassing van de
      formule, bedoeld [artikel 7, derde lid][ref5], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0050059#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0050059#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0050059#Artikel7
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '7'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '8'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0050059
        artikel: '9'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0050059
        artikel: '7'
        hoofdstuk: '3'
  - number: 10.1.a
    text: |-
      GME staat voor: gemiddelde marktinkomsten per megawattuur uit in de kalendermaand uit de energiebron, opgewekte en
      ingevoede elektriciteit als bedoeld in [artikel 3, eerste lid][ref1], uitgedrukt in euro’s per megawattuur;


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: 10.1.b
    text: 'de gemiddelde marktinkomsten per megawattuur, bedoeld in onderdeel a, worden berekend volgens de formule:'
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
  - number: '10.2'
    text: |-
      Indien de producent deel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] en door hem opgewekte en ingevoede elektriciteit als
      bedoeld in [artikel 3, eerste lid][ref2], verkoopt aan een verbonden groepsmaatschappij die deze elektriciteit
      vervolgens verkoopt op een elektriciteitsmarkt, worden in het kader van de toepassing van deze wet de inkomsten
      uit eerstgenoemde verkoop aangemerkt als marktinkomsten van de producent uit deze elektriciteit en worden de
      belastbare marktinkomsten uit deze elektriciteit gesteld op de overeenkomstig [artikel 7][ref3] en het eerste lid
      berekende, door de verbonden groepsmaatschappij gerealiseerde belastbare marktinkomsten uit deze elektriciteit bij
      laatstgenoemde verkoop.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0050059#Artikel7
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0050059
        artikel: '7'
        hoofdstuk: '3'
  - number: '10.3'
    text: |-
      In afwijking van het tweede lid, worden, indien de elektriciteit door de producent wordt verkocht aan een
      verbonden groepsmaatschappij die de eindafnemer is of die de elektriciteit verkoopt op een Nederlandse retailmarkt
      voor elektriciteit, de belastbare marktinkomsten uit deze elektriciteit gesteld op de uitgaven van de verbonden
      groepsmaatschappij voor aankoop van deze elektriciteit, met dien verstande dat, indien deze uitgaven lager zijn dan
      de uitgaven bij vergelijkbare aankoopovereenkomsten die op de groothandelsmarkt voor elektriciteit worden gesloten
      tussen onafhankelijke partijen, de uitgaven voor aankoop van de elektriciteit worden gesteld op de uitgaven bij
      deze vergelijkbare aankoopovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
  - number: '10.4'
    text: |-
      Het tweede respectievelijk derde lid is van overeenkomstige toepassing indien de elektriciteit door de producent
      wordt verkocht aan een verbonden groepsmaatschappij en de elektriciteit binnen de groep wordt doorverkocht aan
      een verbonden groepsmaatschappij die deze elektriciteit verkoopt op een elektriciteitsmarkt respectievelijk die de
      eindafnemer is of die de elektriciteit verkoopt op een Nederlandse retailmarkt voor elektriciteit.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
  - number: '10.5'
    text: 'Een vergelijkbare aankoopovereenkomst als bedoeld in het derde lid, is een aankoopovereenkomst die:'
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
  - number: 10.5.a
    text: op dezelfde datum is gesloten;
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
  - number: 10.5.b
    text: geldt voor hetzelfde tijdstip van aanvang van levering van de elektriciteit; en
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
  - number: 10.5.c
    text: dezelfde looptijd heeft.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
  - number: '10.6'
    text: |-
      Indien de producent of een met hem in een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] verbonden groepsmaatschappij met toepassing van het
      tweede of vierde lid, in het heffingstijdvak marktinkomsten realiseert uit elektriciteit die voor een deel
      bestaat uit door de producent in een kalendermaand van het heffingstijdvak uit een energiebron, waarvoor ingevolge
      [artikel 9][ref2] een afzonderlijk vrijgesteld bedrag geldt, opgewekte en ingevoede elektriciteit als bedoeld in
      [artikel 3, eerste lid][ref3], worden deze marktinkomsten aangemerkt als marktinkomsten uit deze elektriciteit voor
      het aandeel van deze elektriciteit in deze marktinkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '9'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: '10.7'
    text: 'Het aandeel van de elektriciteit in de marktinkomsten, bedoeld in het zesde lid, wordt bepaald op basis van:'
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
  - number: 10.7.a
    text: |-
      het door de producent of de met de producent in een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] verbonden groepsmaatschappij in de periode voorafgaand
      aan 1 juni 2022 gehanteerde administratiesysteem waaruit dit aandeel blijkt en op basis waarvan de producent
      of de met de producent in een groep als bedoeld in artikel 24b van Boek 2 van het Burgerlijk Wetboek verbonden
      groepsmaatschappij marktinkomsten toerekent of kan toerekenen aan door de producent opgewekte elektriciteit uit een
      energiebron waarvoor ingevolge [artikel 9][ref2] een afzonderlijk vrijgesteld bedrag geldt; of


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel9
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '9'
        hoofdstuk: '3'
  - number: 10.7.b
    text: |-
      indien onderdeel a niet kan worden toegepast, het aandeel van de hoeveelheid door de producent in de kalendermaand
      uit de betreffende energiebron opgewekte en ingevoede elektriciteit als bedoeld in [artikel 3, eerste lid][ref1],
      in de totale hoeveelheid elektriciteit waaruit de marktinkomsten, bedoeld in het zesde lid, zijn gerealiseerd en
      waarvoor een afzonderlijke administratie wordt bijgehouden in het door de producent of de met de producent in een
      groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref2] verbonden groepsmaatschappij in de
      periode voorafgaand aan 1 juni 2022 gehanteerde administratiesysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 24b
  - number: '10.8'
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
  - number: 10.8.a
    text: |-
      worden nadere regels gesteld over de wijze waarop de hoeveelheid opgewekte en ingevoede elektriciteit, bedoeld in
      het eerste lid, onderdeel b, en het zevende lid, onderdeel b, wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
  - number: 10.8.b
    text: kunnen nadere regels worden gesteld over de toepassing van het derde en vijfde lid;
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
  - number: 10.8.c
    text: kunnen nadere regels worden gesteld over de toepassing van het zevende lid.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel10
  - number: '11.1'
    text: |-
      Een producent of, indien de producent deel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1], de groepsmaatschappij die in Nederland aan het hoofd
      staat van de groep, stelt een marktinkomstenverslag op waaruit de som van de belastbare marktinkomsten uit door
      de producent in de kalendermaanden van het heffingstijdvak opgewekte en ingevoede elektriciteit als bedoeld in
      [artikel 3, eerste lid][ref2], blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: '11.2'
    text: 'Het marktinkomstenverslag vermeldt:'
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
  - number: 11.2.a
    text: |-
      de volledige naam, het adres, het uniek nummer als bedoeld in
      [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref1], het unieke informatienummer voor rechtspersonen
      en samenwerkingsverbanden of het op grond van de Wet algemene bepalingen burgerservicenummer toegekende
      burgerservicenummer, en de contactgegevens van de producent;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel9
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '9'
  - number: 11.2.b
    text: |-
      de identificatie van de productie-installatie waarmee de producent in het heffingstijdvak elektriciteit als bedoeld
      in [artikel 3, eerste lid][ref1], heeft opgewekt;


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: 11.2.c
    text: |-
      de identificatie van de aansluiting als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Elektriciteitswet 1998][ref1], waarmee een productie-installatie,
      bedoeld in onderdeel b, is aangesloten op het elektriciteitsnet of van de directe lijn;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: 11.2.d
    text: |-
      indien de producent elektriciteit als bedoeld in [artikel 3, eerste lid][ref1], opwekt in een
      vennootschap zonder rechtspersoonlijkheid, de volledige naam, het adres, het uniek nummer als bedoeld in
      [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref2], het unieke informatienummer voor rechtspersonen
      en samenwerkingsverbanden of het op grond van de [Wet algemene bepalingen burgerservicenummer][ref3] toegekende
      burgerservicenummer, en de contactgegevens van die vennootschap en van elk van de bij die vennootschap betrokken
      vennoten, de oprichtingsakte en de samenwerkingsovereenkomst;


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0022428
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0022428
  - number: 11.2.e
    text: |-
      indien [artikel 10, tweede lid][ref1], van toepassing of overeenkomstige toepassing is, de volledige naam,
      adres, unieke informatienummer voor rechtspersonen en samenwerkingsverbanden en contactgegevens van de verbonden
      groepsmaatschappijen, bedoeld in artikel 10, tweede of vierde lid, en de groepsmaatschappij die in Nederland aan
      het hoofd staat van de groep;


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel10
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '10'
        hoofdstuk: '3'
  - number: 11.2.f
    text: |-
      de som van de belastbare marktinkomsten uit door de producent in de kalendermaanden van het heffingstijdvak
      opgewekte en ingevoede elektriciteit als bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: '11.3'
    text: 'Het marktinkomstenverslag vermeldt tevens per kalendermaand van het heffingstijdvak voor de producent:'
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
  - number: 11.3.a
    text: |-
      de hoeveelheid elektriciteit, bedoeld in [artikel 3, eerste lid][ref1], die door de producent in de betreffende
      kalendermaand per productie-installatie per uur is opgewekt met behulp van elk van de energiebronnen, genoemd in
      [artikel 9][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel9
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '9'
        hoofdstuk: '3'
  - number: 11.3.b
    text: |-
      de hoeveelheid van de elektriciteit, bedoeld in onderdeel a, die door een balanceringsdienstverlener is aangeboden
      op de balanceringsenergiemarkt en daar is geactiveerd;
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
  - number: 11.3.c
    text: de hoeveelheid van de elektriciteit, bedoeld in onderdeel a, die is ingezet voor redispatch of compensatiehandel;
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
  - number: 11.3.d
    text: |-
      indien de elektriciteit, bedoeld in onderdeel a, is opgewekt met een productie-installatie als bedoeld in
      [artikel 9, onderdeel d][ref1], het vrijgestelde bedrag aan belastbare marktinkomsten, bedoeld in artikel 9,
      onderdeel d;


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel9
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '9'
        hoofdstuk: '3'
  - number: 11.3.e
    text: |-
      indien de elektriciteit, bedoeld in onderdeel a, is opgewekt met een hybride productie-installatie als bedoeld in
      [artikel 7, vierde lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel7
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '7'
        hoofdstuk: '3'
  - number: 11.3.e.1°
    text: de voor die maand uitgegeven garanties van oorsprong voor duurzame elektriciteit of certificaten van oorsprong;
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
  - number: 11.3.e.2°
    text: |-
      de overeenkomstig [artikel 7, vierde en vijfde of zesde lid][ref1], vastgestelde hoeveelheid van die elektriciteit
      die in de betreffende kalendermaand met die productie-installatie uit elk van de energiebronnen is opgewekt;


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel7
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '7'
        hoofdstuk: '3'
  - number: 11.3.f
    text: |-
      indien de elektriciteit, bedoeld in onderdeel a, is opgewekt uit steenkool en het vrijgestelde bedrag volgens
      de formule, bedoeld in [artikel 9, onderdeel e][ref1], hoger is dan € 130 per megawattuur, de berekening van het
      vrijgestelde bedrag aan belastbare marktinkomsten, bedoeld in artikel 9, onderdeel e;


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel9
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '9'
        hoofdstuk: '3'
  - number: 11.3.g
    text: |-
      de berekening van de gemiddelde marktinkomsten per megawattuur, bedoeld in [artikel 8][ref1], tenzij
      [artikel 10][ref2] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel10
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '8'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '10'
        hoofdstuk: '3'
  - number: 11.3.h
    text: |-
      indien [artikel 10][ref1] van toepassing is:


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel10
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '10'
        hoofdstuk: '3'
  - number: 11.3.h.1°
    text: |-
      de berekening van de gemiddelde marktinkomsten per megawattuur, bedoeld in [artikel 10, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel10
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '10'
        hoofdstuk: '3'
  - number: 11.3.h.2°
    text: |-
      indien [artikel 10, derde lid][ref1], van toepassing of overeenkomstige toepassing is, de inkoopkosten, bedoeld in
      dat artikellid, en van de inkoopovereenkomsten de gegevens, bedoeld in artikel 10, vijfde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel10
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '10'
        hoofdstuk: '3'
  - number: 11.3.h.3°
    text: |-
      indien [artikel 10, zesde lid][ref1], van toepassing is, de toerekening van marktinkomsten, bedoeld in dat
      artikellid, overeenkomstig artikel 10, zevende of achtste lid, en de daarbij gebruikte gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel10
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '10'
        hoofdstuk: '3'
  - number: 11.3.i
    text: |-
      de op basis van de onderdelen a tot en met g dan wel a tot en met h, berekende belastbare marktinkomsten uit door
      de producent in de kalendermaand uit elk van de energiebronnen opgewekte en ingevoede elektriciteit, bedoeld in
      [artikel 7, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel7
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '7'
        hoofdstuk: '3'
  - number: 11.3.j
    text: |-
      de op basis van onderdeel i berekende som van de belastbare marktinkomsten uit door de producent
      in de kalendermaand uit elk van de energiebronnen opgewekte en ingevoede elektriciteit, bedoeld in
      [artikel 7, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel7
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '7'
        hoofdstuk: '3'
  - number: '11.4'
    text: |-
      Indien een producent zijn belastbare marktinkomsten berekent met toepassing van [artikel 10][ref1] laat hij de
      getrouwheid van het marktinkomstenverslag verifiëren door een accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel10
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '10'
        hoofdstuk: '3'
  - number: '11.5'
    text: |-
      Degene die overeenkomstig het eerste lid het marktinkomstenverslag opstelt dient dit verslag, en indien het vierde
      lid van toepassing is vergezeld van de verificatie van dit verslag door een accountant, voor 1 april 2025 in bij
      Onze Minister voor Klimaat en Energie.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
  - number: '11.6'
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
  - number: 11.6.a
    text: |-
      worden regels gesteld over de wijze waarop en de plaats waar het marktinkomstenverslag moet worden ingediend en kan
      worden bepaald dat het marktinkomstenverslag moet worden ingediend met gebruikmaking van een middel dat door Onze
      Minister voor Klimaat en Energie beschikbaar wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
  - number: 11.6.b
    text: kunnen nadere regels worden gesteld over de inhoud van het marktinkomstenverslag; en
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
  - number: 11.6.c
    text: |-
      worden regels gesteld over de verificatie van de getrouwheid van het marktinkomstenverslag, bedoeld in het vierde
      lid.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel11
  - number: '12.1'
    text: |-
      De producent houdt ten aanzien van elektriciteit als bedoeld in [artikel 3, eerste lid][ref1], per kalendermaand
      van het heffingstijdvak een administratie bij van:


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: 12.1.a
    text: de hoeveelheid per uur opgewekte en ingevoede elektriciteit;
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel12
  - number: 12.1.b
    text: |-
      de hoeveelheid van de in onderdeel a bedoelde elektriciteit die door een balanceringsdienstverlener is aangeboden
      op de balanceringsenergiemarkt en daar is geactiveerd, of is ingezet voor redispatch of compensatiehandel;
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel12
  - number: 12.1.c
    text: de marktinkomsten.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel12
  - number: '12.2'
    text: |-
      Indien de producent elektriciteit als bedoeld in [artikel 3, eerste lid][ref1], opwekt uit energiebronnen of
      productie-installaties waarvoor een verschillend vrijgesteld bedrag als bedoeld in [artikel 9][ref2] geldt,
      houdt hij een gescheiden administratie bij per energiebron of productie-installatie waarvoor een verschillende
      vrijgesteld bedrag als bedoeld in artikel 9 geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel9
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '9'
        hoofdstuk: '3'
  - number: '12.3'
    text: De producent bewaart de administratie tot ten minste zeven jaren na afloop van het heffingstijdvak.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel12
  - number: '12.4'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op met de producent in een groep als
      bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] verbonden groepsmaatschappijen, bedoeld in
      [artikel 10, tweede of vierde lid][ref2], voor hun marktinkomsten uit door de producent opgewekte en ingevoede
      elektriciteit als bedoeld in [artikel 3, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '10'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: '12.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze van inrichting van de administratie.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel12
  - number: '13'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens [paragraaf 4.1][ref1] bepaalde zijn belast de bij besluit
      van Onze Minister voor Klimaat en Energie daartoe aangewezen ambtenaren van de Nederlandse emissieautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0050059
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '14'
    text: |-
      Indien een marktinkomstenverslag niet voldoet aan de eisen die daaraan bij of krachtens deze wet zijn gesteld kan
      Onze Minister voor Klimaat en Energie een producent of een groepsmaatschappij die in Nederland aan het hoofd staat
      van de groep als bedoeld in [artikel 11, eerste lid][ref1], verplichten binnen een redelijke termijn een nieuw
      marktinkomstenverslag in te dienen, met inachtneming van de aanwijzingen van Onze Minister voor Klimaat en Energie.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel11
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '15.1'
    text: |-
      Onze Minister voor Klimaat en Energie kan ambtshalve de som van de belastbare marktinkomsten van een producent
      uit door hem in de kalendermaanden van het heffingstijdvak opgewekte en ingevoede elektriciteit als bedoeld in
      [artikel 3, eerste lid][ref1], vaststellen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: 15.1.a
    text: |-
      niet of niet tijdig overeenkomstig [artikel 11, vijfde lid][ref1], een marktinkomstenverslag is ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel11
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 15.1.b
    text: |-
      Onze Minister voor Klimaat en Energie vaststelt dat het marktinkomstenverslag niet voldoet aan de eisen die
      daarvoor bij of krachtens [artikel 11][ref1] zijn gesteld, dan wel niet wordt voldaan aan de aanwijzingen, bedoeld
      in [artikel 14][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel14
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '14'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 15.1.c
    text: |-
      de aangewezen toezichthoudende ambtenaren, bedoeld in [artikel 13][ref1], bij het toezicht, bedoeld in artikel
      13, onvoldoende gegevens ter beschikking krijgen om de juistheid en volledigheid van het marktinkomstenverslag te
      beoordelen; of


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel13
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '13'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 15.1.d
    text: |-
      de administratie, bedoeld in [artikel 12][ref1], onvoldoende gegevens bevat om de juistheid en volledigheid van het
      marktinkomstenverslag te beoordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel12
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '15.2'
    text: |-
      Indien Onze Minister voor Klimaat en Energie de som van de belastbare marktinkomsten van een producent uit door hem
      in de kalendermaanden van het heffingstijdvak opgewekte elektriciteit als bedoeld in [artikel 3, eerste lid][ref1],
      ambtshalve vaststelt kan hij daarbij uitgaan van een schatting van belastbare marktinkomsten of de daarbij
      gebruikte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: '16.1'
    text: |-
      In geval van overtreding van het bepaalde bij of krachtens de [artikelen 11][ref1], [12][ref2] of [14][ref3], kan
      Onze Minister voor Klimaat en Energie opleggen:


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0050059#Artikel14
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0050059
        artikel: '14'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 16.1.a
    text: een last onder dwangsom;
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel16
  - number: 16.1.b
    text: een bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel16
  - number: '16.2'
    text: |-
      De op grond van het eerste lid, onderdeel b, op te leggen bestuurlijke boete bedraagt ten hoogste het bedrag dat is
      vastgesteld voor de zesde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] of,
      indien dat meer is, ten hoogste 10% van de omzet van de onderneming, in het boekjaar voorafgaand aan de beschikking
      waarin de bestuurlijke boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '17'
    text: |-
      De Autoriteit Consument en Markt adviseert Onze Minister voor Klimaat en Energie op diens verzoek over het
      toezicht, bedoeld in [artikel 13][ref1], of door hem op grond van de [artikelen 14 tot en met 16][ref2] te nemen
      besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel14
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '13'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '14'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '18'
    text: |-
      Voor de toepassing van het bij of krachtens [hoofdstuk 4][ref1] bepaalde wordt geen rekening gehouden met
      handelingen waarvan, op grond van de omstandigheid dat zij geen wezenlijke verandering van feitelijke verhoudingen
      ten doel hebben gehad of op grond van andere bepaalde feiten en omstandigheden, moet worden aangenomen dat zij
      achterwege zouden zijn gebleven, indien daarmee niet de toepassing van deze wet voor het vervolg geheel of ten dele
      onmogelijk zou worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0050059
        hoofdstuk: '4'
  - number: '19.1'
    text: |-
      De [Algemene wet inzake rijksbelastingen][ref1] is niet van toepassing op de [hoofdstukken 3][ref2] en [4][ref3]
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0050059#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0050059
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0050059
        hoofdstuk: '4'
  - number: '19.2'
    text: |-
      [Hoofdstuk IX van de Algemene wet inzake rijksbelastingen][ref1] blijft buiten toepassing bij de heffing en
      voldoening van de inframarginale elektriciteitsheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukIX
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: IX
  - number: '19.3'
    text: |-
      [Artikel 36 van de Invorderingswet 1990][ref1] is van overeenkomstige toepassing op de inframarginale
      elektriciteitsheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel36
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '36'
  - number: '20.1'
    text: De verschuldigde belasting wordt op aangifte voldaan.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel20
  - number: '20.2'
    text: |-
      In afwijking van [artikel 10, tweede lid][ref1], en
      [artikel 19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref2] wordt aangifte gedaan en wordt op die
      aangifte voldaan voor 1 april 2025.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '19'
  - number: '21.1'
    text: |-
      Indien de belasting die op aangifte behoort te worden voldaan geheel of gedeeltelijk niet
      is betaald, of indien te veel is betaald, heft de inspecteur, in afwijking in zoverre van
      [artikel 20, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1], de te weinig geheven belasting na,
      respectievelijk verleent de inspecteur teruggaaf van hetgeen te veel is geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '20'
  - number: '21.2'
    text: |-
      Indien een nieuw marktinkomstenverslag is ingediend overeenkomstig [artikel 14][ref1] of de som van de
      belastbare marktinkomsten ambtshalve door Onze Minister voor Klimaat en Energie is vastgesteld overeenkomstig
      [artikel 15][ref2] en onherroepelijk is geworden, met als gevolg dat:


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel15
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '14'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 21.2.a
    text: te weinig is geheven, dan heft de inspecteur de te weinig geheven belasting na;
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel21
  - number: 21.2.b
    text: te veel is geheven, dan verleent de inspecteur teruggaaf van de te veel geheven belasting.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel21
  - number: '21.3'
    text: |-
      De vaststelling van de naheffingsaanslag of de teruggaafbeschikking, bedoeld in het tweede lid, geschiedt binnen
      twaalf weken na het tijdstip waarop het nieuwe marktinkomstenverslag is ingediend of de ambtshalve vaststelling van
      de som van de belastbare marktinkomsten onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel21
  - number: '21.4'
    text: |-
      Indien het tijdstip waarop een nieuw marktinkomstenverslag, bedoeld in [artikel 5, tweede lid, onderdeel a][ref1],
      wordt ingediend, is gelegen na het verloop van vijf jaren na het einde van het kalenderjaar waarin
      de belastingschuld inzake de inframarginale elektriciteitsheffing is ontstaan of de teruggaaf
      is verleend, vervalt de bevoegdheid tot het opleggen van een naheffingsaanslag, bedoeld in
      [artikel 20 van de Algemene wet inzake rijksbelastingen][ref2], of het verlenen van teruggaaf twaalf weken na het
      indienen van dit marktinkomstenverslag.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '20'
  - number: '21.5'
    text: |-
      Indien het tijdstip waarop de ambtshalve vaststelling van de som van de belastbare marktinkomsten, bedoeld in
      [artikel 5, tweede lid, onderdeel b][ref1], onherroepelijk is geworden, is gelegen na het verloop van vijf jaren
      na het einde van het kalenderjaar waarin de belastingschuld inzake de inframarginale elektriciteitsheffing is
      ontstaan of de teruggaaf is verleend, vervalt de bevoegdheid tot het opleggen van een naheffingsaanslag, bedoeld
      in [artikel 20 van de Algemene wet inzake rijksbelastingen][ref2] of het verlenen van teruggaaf twaalf weken na het
      hiervoor bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel20
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '20'
  - number: '21.6'
    text: |-
      De teruggaaf, bedoeld in het eerste lid, tweede lid, onderdeel b, vierde of vijfde lid wordt vastgesteld bij voor
      bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel21
  - number: '22.1'
    text: |-
      Met betrekking tot een naheffingsaanslag als bedoeld in [artikel 21, tweede lid, onderdeel a][ref1],
      wordt belastingrente als bedoeld in [Hoofdstuk VA van de Algemene wet inzake rijksbelastingen][ref2]
      in rekening gebracht. De belastingrente wordt enkelvoudig berekend over het tijdvak dat aanvangt op
      1 april 2025 en eindigt op de dag voorafgaand aan de dag waarop de naheffingsaanslag invorderbaar is
      ingevolge [artikel 9 van de Invorderingswet 1990][ref3] en heeft als grondslag de nageheven inframarginale
      elektriciteitsheffing. Het tijdvak waarover de belastingrente wordt berekend eindigt uiterlijk veertien weken na
      het tijdstip waarop het nieuwe marktinkomstenverslag is ingediend of de ambtshalve vaststelling van de som van de
      belastbare marktinkomsten onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVA
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '21'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0002320
        hoofdstuk: VA
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '9'
  - number: '22.2'
    text: |-
      Ingeval een teruggaafbeschikking als bedoeld in [artikel 21, tweede lid, onderdeel b][ref1], wordt vastgesteld
      na twaalf weken na het tijdstip waarop het nieuwe marktinkomstenverslag is ingediend of de ambtshalve
      vaststelling van de som van de belastbare marktinkomsten onherroepelijk is geworden, wordt belastingrente als
      bedoeld in [Hoofdstuk VA van de Algemene wet inzake rijksbelastingen][ref2] vergoed. De belastingrente wordt
      enkelvoudig berekend over het tijdvak dat aanvangt op de dag na die twaalf weken en eindigt veertien dagen na
      de dagtekening van de teruggaafbeschikking en heeft als grondslag het terug te geven bedrag aan inframarginale
      elektriciteitsheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVA
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '21'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0002320
        hoofdstuk: VA
  - number: '22.3'
    text: |-
      Het percentage van de belastingrente is gelijk aan het percentage dat krachtens
      [artikel 30hb van de Algemene wet inzake rijksbelastingen][ref1] van toepassing is op de in
      [artikel 1 van de Wet belastingen op milieugrondslag][ref2] genoemde belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30hb
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel1
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30hb
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '1'
  - number: '22.4'
    text: |-
      De [artikelen 30h, zesde lid][ref1], [30ia][ref2] en [30j van de Algemene wet inzake rijksbelastingen][ref3] zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30h
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30ia
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel30j
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30h
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 30ia
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 30j
  - number: '23'
    text: |-
      Onze Minister voor Klimaat en Energie, de Autoriteit Consument en Markt en de rijksbelastingdienst verstrekken
      elkaar op verzoek de gegevens die nodig zijn voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel23
  - number: '25.1'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst en werkt ten aanzien van de [artikelen 1 tot en met 10][ref1] en de [artikelen 19 tot en met 23][ref2]
      terug tot en met 1 december 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel19
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '19'
        hoofdstuk: '5'
  - number: '25.2'
    text: Deze wet vervalt op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel25
  - number: '26'
    text: 'Deze wet wordt aangehaald als: Tijdelijke wet inframarginale elektriciteitsheffing.'
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel26
