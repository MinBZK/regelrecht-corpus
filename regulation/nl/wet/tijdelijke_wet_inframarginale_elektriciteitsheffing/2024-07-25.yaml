  - number: '2'
    text: |-
      Onder de naam inframarginale elektriciteitsheffing wordt een belasting geheven van producenten van elektriciteit
      als bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: '3.1'
    text: |-
      De inframarginale elektriciteitsheffing wordt geheven over de marktinkomsten uit elektriciteit die in Nederland
      is opgewekt met behulp van een inframarginale energiebron of steenkool, met een productie-installatie met een
      geïnstalleerd vermogen als bedoeld in artikel 2, onderdeel 16, van [verordening 2016/631](32531R2016) vanaf 1
      megawatt en die is ingevoed op het elektriciteitsnet of een directe lijn.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel3
  - number: '3.2'
    text: |-
      Onder Nederland wordt mede verstaan de exclusieve economische zone van het Koninkrijk, bedoeld in
      [artikel 1 van de Rijkswet instelling exclusieve economische zone][ref1], voor zover deze grenst aan de
      territoriale zee van Nederland bedoeld in [artikel 1 van de Wet grenzen Nederlandse territoriale zee][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010480#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003748#Artikel1
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010480
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003748
        artikel: '1'
  - number: '3.3'
    text: 'Voor de toepassing van de inframarginale elektriciteitsheffing worden onder marktinkomsten niet verstaan:'
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel3
  - number: 3.3.a
    text: |-
      marktinkomsten uit elektriciteit als bedoeld in het eerste lid die is opgewekt binnen een demonstratieproject als
      bedoeld in artikel 7, tweede lid, van [verordening 2022/1854](33754R2022);
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel3
  - number: 3.3.b
    text: |-
      marktinkomsten uit elektriciteit als bedoeld in het eerste lid, die door een balanceringsdienstverlener is
      aangeboden op de balanceringsenergiemarkt en daar is geactiveerd;
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel3
  - number: 3.3.c
    text: |-
      inkomsten met betrekking tot elektriciteit als bedoeld in het eerste lid, uit de compensatie voor redispatching
      en compensatiehandel.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel3
  - number: '4.1'
    text: |-
      De inframarginale elektriciteitsheffing wordt geheven over marktinkomsten uit elektriciteit als bedoeld in
      [artikel 3, eerste lid][ref1], die door de producent is opgewekt en ingevoed met ingang van 1 december 2022 tot
      1 juli 2023.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.2'
    text: De inframarginale elektriciteitsheffing wordt verschuldigd op het tijdstip waarop het heffingstijdvak eindigt.
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel4
  - number: '5.1'
    text: |-
      De inframarginale elektriciteitsheffing wordt geheven over de som van de belastbare marktinkomsten uit door
      de producent in de kalendermaanden van het heffingstijdvak opgewekte en ingevoede elektriciteit als bedoeld in
      [artikel 3, eerste lid][ref1], welke som blijkt uit het marktinkomstenverslag.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: '5.2'
    text: 'In afwijking van het eerste lid blijkt de som van de belastbare marktinkomsten:'
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel5
  - number: 5.2.a
    text: indien een nieuw marktinkomstenverslag is ingediend overeenkomstig artikel 14 uit dat nieuwe marktinkomstenverslag;
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel5
  - number: 5.2.b
    text: |-
      indien Onze Minister voor Klimaat en Energie ambtshalve de som van de belastbare marktinkomsten heeft vastgesteld
      overeenkomstig [artikel 15][ref1] uit die ambtshalve vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel15
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '6'
    text: |-
      De inframarginale elektriciteitsheffing bedraagt 90% van de som van de belastbare marktinkomsten uit elektriciteit
      als bedoeld in [artikel 3, eerste lid][ref1], die door de producent is opgewekt en ingevoed in de kalendermaanden
      van het heffingstijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: '7.1'
    text: |-
      De belastbare marktinkomsten uit door de producent in een kalendermaand opgewekte en ingevoede elektriciteit als
      bedoeld in [artikel 3, eerste lid][ref1], zijn gelijk aan de som van de belastbare marktinkomsten uit door de
      producent in een kalendermaand uit elk van de energiebronnen waarvoor ingevolge [artikel 9][ref2] een afzonderlijk
      vrijgesteld bedrag geldt, opgewekte en ingevoede elektriciteit als bedoeld in artikel 3, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel9
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '9'
        hoofdstuk: '3'
  - number: '7.2'
    text: |-
      Indien de belastbare marktinkomsten uit door de producent in een kalendermaand uit een energiebron waarvoor
      ingevolge [artikel 9][ref1] een afzonderlijk vrijgesteld bedrag geldt, opgewekte en ingevoede elektriciteit
      als bedoeld in [artikel 3, eerste lid][ref2], kleiner zijn dan nul, worden deze voor die kalendermaand op nihil
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel3
    url: https://wetten.overheid.nl/BWBR0050059/2024-07-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0050059
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0050059
        artikel: '3'
        hoofdstuk: '2'
  - number: '7.3'
    text: |-
      De belastbare marktinkomsten uit door de producent in een kalendermaand uit een energiebron waarvoor ingevolge
      [artikel 9][ref1] een afzonderlijk vrijgesteld bedrag geldt, opgewekte en ingevoede elektriciteit als bedoeld
      in [artikel 3, eerste lid][ref2], worden berekend volgens de formule: BM = sHE x (GME – VB) waarin BM staat
      voor: belastbare marktinkomsten uit door de producent in een kalendermaand uit een energiebron waarvoor
      ingevolge [artikel 9][ref3] een afzonderlijk vrijgesteld bedrag geldt, opgewekte en ingevoede elektriciteit
      als bedoeld in [artikel 3, eerste lid][ref4], uitgedrukt in euro’s sHE staat voor: de som van de hoeveelheden
      door de producent in de kalendermaand per uur uit de energiebron, bedoeld in [artikel 9][ref5], opgewekte en
      ingevoede elektriciteit als bedoeld in [artikel 3, eerste lid][ref6], minus de hoeveelheid van deze elektriciteit
      die is ingezet voor redispatch of compensatiehandel, uitgedrukt in megawatturen GME staat voor: gemiddelde
      marktinkomsten per megawattuur uit door de producent in de kalendermaand per uur uit de energiebron opgewekte en
      ingevoede elektriciteit als bedoeld in [artikel 3, eerste lid][ref7], bedoeld in [artikel 8][ref8], uitgedrukt
      in euro’s per megawattuur VB staat voor: vrijgesteld bedrag van de marktinkomsten voor de energiebron, bedoeld in
      [artikel 9][ref9], uitgedrukt in euro’s per megawattuur.


      [ref1]: https://wetten.overheid.nl/BWBR0050059#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0050059#Artikel3
