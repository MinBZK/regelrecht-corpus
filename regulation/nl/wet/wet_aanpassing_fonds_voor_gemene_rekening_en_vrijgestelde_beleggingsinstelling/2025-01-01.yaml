preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om in enkele belastingwetten wijzigingen aan te brengen
    in de regelingen voor het fonds voor gemene rekening en de vrijgestelde beleggingsinstelling;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0049131/2025-01-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      1 Voor de toepassing van de [Wet op de vennootschapsbelasting 1969][ref1] wordt een fonds voor gemene rekening of
      een daarmee qua rechtsvorm vergelijkbaar naar het recht van een andere staat opgericht of aangegaan lichaam dat
      als gevolg van deze wet met ingang van 1 januari 2025 niet langer onderworpen is aan de vennootschapsbelasting op
      grond van de [artikelen 2][ref2] of [3 van die wet][ref3], geacht op het tijdstip onmiddellijk voorafgaand aan
      1 januari 2025 al zijn vermogensbestanddelen tegen de waarde in het economische verkeer te hebben overgedragen
      aan de natuurlijk personen of lichamen die participeren in dat fonds voor gemene rekening naar rato van ieders
      gerechtigdheid en wordt dat fonds voor gemene rekening geacht te zijn opgehouden in Nederland belastbare winst
      te genieten.

      2 Voor de toepassing van de [Wet inkomstenbelasting 2001][ref4] en de [Wet op de vennootschapsbelasting 1969][ref5]
      wordt een deelgerechtigde die participeert in een fonds voor gemene rekening als bedoeld in het eerste lid
      geacht op het tijdstip onmiddellijk voorafgaand aan 1 januari 2025 zijn bewijs van deelgerechtigdheid in en
      schuldvordering op het fonds voor gemene rekening te hebben vervreemd tegen de waarde in het economische verkeer.

      3 Voor de toepassing van de [Wet inkomstenbelasting 2001][ref6] wordt een belastingplichtige die
      resultaat uit een werkzaamheid in de zin van [artikel 3.92 van die wet][ref7] geniet vanwege het ter
      beschikking stellen van vermogensbestanddelen aan een fonds voor gemene rekening als bedoeld in het
      eerste lid, geacht op het tijdstip onmiddellijk voorafgaand aan 1 januari 2025 de tot die werkzaamheid
      behorende vermogensbestanddelen te hebben vervreemd tegen de waarde in het economische verkeer en wordt
      die belastingplichtige geacht te zijn opgehouden in Nederland belastbaar resultaat uit die werkzaamheid
      te genieten, tenzij de tot die werkzaamheid behorende vermogensbestanddelen op 1 januari 2025 door die
      belastingplichtige nog steeds worden aangewend ten behoeve van een werkzaamheid als bedoeld in artikel 3.92 van
      die wet. De vervreemding, bedoeld in de eerste zin, wordt niet aangemerkt als een vervreemding als bedoeld in
      [artikel 25, veertiende lid, onderdeel a, van de Invorderingswet 1990][ref8].

      4 Indien een schuldvordering als bedoeld in het tweede lid kwalificeert als een schuldvordering als bedoeld
      in [artikel 17a, onderdeel c, van de Wet op de vennootschapsbelasting 1969][ref9] en die schuldvordering is
      afgewaardeerd ten laste van de belastbare winst uit een Nederlandse onderneming van een lichaam dat participeert
      in het fonds voor gemene rekening, wordt voor de toepassing van het tweede lid ter zake van die schuldvordering
      tot de winst van dat lichaam gerekend een bedrag gelijk aan die afwaardering voor zover met betrekking tot die
      schuldvordering niet reeds eerder in verband met die afwaardering een bedrag tot de winst van dat lichaam is
      gerekend.

      5 Een fonds voor gemene rekening als bedoeld in het eerste lid dat op het tijdstip onmiddellijk
      voorafgaand aan 1 januari 2025 is aangemerkt als beleggingsinstelling als bedoeld in
      [artikel 28 van de Wet op de vennootschapsbelasting 1969][ref10] wordt geacht op het tijdstip onmiddellijk
      voorafgaand aan 1 januari 2025 te hebben voldaan aan de uitdelingsverplichting, bedoeld in artikel 28, tweede
      lid, onderdeel b, van de Wet op de vennootschapsbelasting 1969, met betrekking tot het laatste boekjaar of de
      laatste boekjaren dat is, onderscheidenlijk die zijn, aangevangen voor 1 januari 2025 en ter zake waarvan de
      achtmaandentermijn, bedoeld in artikel 28, tweede lid, onderdeel b, van die wet, eindigt op of na 1 januari 2025.


