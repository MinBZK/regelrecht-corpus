  - number: V
    text: |-
      1 De door een fonds voor gemene rekening als gevolg van de toepassing van [artikel IV, eerste lid][ref1], behaalde
      winst behoeft niet in aanmerking te worden genomen, mits alle deelgerechtigden in het fonds voor gemene rekening
      op het tijdstip onmiddellijk voorafgaand aan 1 januari 2025 zijn onderworpen aan de vennootschapsbelasting zonder
      ervan te zijn vrijgesteld, dan wel op 1 januari 2025 als gevolg van het niet langer aan de vennootschapsbelasting
      onderworpen zijn van dat fonds zijn onderworpen aan de vennootschapsbelasting zonder ervan te zijn vrijgesteld,
      en voor het bepalen van de winst bij het fonds voor gemene rekening op het tijdstip onmiddellijk voorafgaand
      aan 1 januari 2025 en bij al die deelgerechtigden dezelfde bepalingen van toepassing zijn, noch bij dat
      fonds, noch bij die deelgerechtigden aanspraak bestaat op voorwaartse verrekening van verliezen op de voet
      van [artikel 20 van de Wet op de vennootschapsbelasting 1969][ref2], op vermindering ter voorkoming van
      dubbele belasting ter zake van buitenlandse resultaten, op toepassing van de innovatiebox op de voet van
      [artikel 12b van de Wet op de vennootschapsbelasting 1969][ref3], op voortwenteling van een saldo aan renten
      op de voet van [artikel 15b van die wet][ref4], op toepassing van de objectvrijstelling voor buitenlandse
      ondernemingswinsten op de voet van [artikel 15e van die wet][ref5], op toepassing van de deelnemingsverrekening op
      de voet van [artikel 23c van die wet][ref6], op toepassing van de verrekening bij buitenlandse ondernemingswinsten
      op de voet van [artikel 23d van die wet][ref7], of op voortwenteling van voorheffingen op de voet van
      [artikel 25a, vierde lid, van die wet][ref8] en mits latere heffing van vennootschapsbelasting is verzekerd.
      Indien de winst ingevolge de eerste zin niet in aanmerking wordt genomen, treden de deelgerechtigden met betrekking
      tot al hetgeen als gevolg van de toepassing van artikel IV, eerste lid, aan hen wordt geacht te zijn overgedragen
      in de plaats van het fonds voor gemene rekening.

      2 Ingeval niet is voldaan aan de vereisten, bedoeld in het eerste lid, eerste zin, kan Onze Minister, op een
      gezamenlijk verzoek van het fonds voor gemene rekening en alle deelgerechtigden, mits die deelgerechtigden op
      1 januari 2025 zijn onderworpen aan de vennootschapsbelasting zonder ervan te zijn vrijgesteld, onder door hem
      te stellen voorwaarden de inspecteur die is belast met de aanslagregeling van het fonds voor gemene rekening
      toestaan de winst die is behaald als gevolg van de toepassing van artikel IV, eerste lid, geheel of ten dele buiten
      aanmerking te laten. Daarbij treden die deelgerechtigden met betrekking tot al hetgeen als gevolg van de toepassing
      van [artikel IV, eerste lid][ref9], aan hen wordt geacht te zijn overgedragen, voor zover daaraan geen voorwaarden
      zijn gesteld, in de plaats van het fonds voor gemene rekening. De inspecteur beslist op het verzoek bij voor
      bezwaar vatbare beschikking waarin de voorwaarden, bedoeld in de eerste zin, zijn opgenomen.

      3 De voorwaarden, bedoeld in het tweede lid, mogen slechts strekken ter verzekering van de heffing en de
      invordering van belasting welke verschuldigd zou zijn of zou worden indien het tweede lid, eerste zin, buiten
      toepassing zou blijven. Voorts kunnen voorwaarden worden gesteld die betrekking hebben op het bepalen van
      de in een jaar genoten winst van de deelgerechtigden, de toelaatbare reserves, de verrekening van verliezen
      op de voet van [artikel 20 van de Wet op de vennootschapsbelasting 1969][ref10], de vermindering ter
      voorkoming van dubbele belasting ter zake van buitenlandse resultaten, de toepassing van de innovatiebox op
      de voet van [artikel 12b van de Wet op de vennootschapsbelasting 1969][ref11], de voortwenteling van een
      saldo aan renten op de voet van [artikel 15b van die wet][ref12], de toepassing van de objectvrijstelling
      voor buitenlandse ondernemingswinsten op de voet van [artikel 23d van die wet][ref13], de toepassing van de
      deelnemingsverrekening op de voet van [artikel 23c van die wet][ref14], de toepassing van de verrekening bij
      buitenlandse ondernemingswinsten op de voet van [artikel 23d van die wet][ref15] of op de voortwenteling van
      voorheffingen op de voet van [artikel 25a, vierde lid, van die wet][ref16] en kunnen voorwaarden worden gesteld
      indien op het tijdstip onmiddellijk voorafgaand aan 1 januari 2025 de waarde in het economische verkeer van de
      vermogensbestanddelen die aan de deelgerechtigden worden geacht te zijn overgedragen lager is dan de boekwaarde van
      deze vermogensbestanddelen.

      4 Het verzoek, bedoeld in het tweede lid, wordt uiterlijk op het tijdstip van het doen van de aangifte
      vennootschapsbelasting van het fonds voor gemene rekening over het boekjaar dat eindigt op 31 december 2024
      schriftelijk gedaan.


