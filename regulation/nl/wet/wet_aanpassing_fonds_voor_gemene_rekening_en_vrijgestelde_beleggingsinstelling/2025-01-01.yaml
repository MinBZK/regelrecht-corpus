  - number: IXa
    text: |-
      De bewijzen van deelgerechtigdheid in een fonds worden geacht met ingang van 1 januari 2025 niet verhandelbaar te
      zijn indien:

      a. het fonds voor gemene rekening of het lichaam opgericht of aangegaan naar het recht van een
      andere staat dat een met een fonds voor gemene rekening vergelijkbare rechtsvorm heeft zonder
      toepassing van dit artikel met ingang van 1 januari 2025 belastingplichtig zou zijn op grond van
      [artikel 2, eerste lid, onderdeel f, van de Wet op de vennootschapsbelasting 1969][ref1], onderscheidenlijk
      [artikel 3, eerste lid, onderdeel a, van die wet][ref2];

      b. het fonds onmiddellijk voorafgaand aan 1 januari 2025 niet belastingplichtig was op grond van [artikel 2][ref3]
      of [3 van de Wet op de vennootschapsbelasting 1969][ref4];

      c. uiterlijk op 31 december 2025 de vervreemding van de bewijzen van deelgerechtigdheid in het fonds uitsluitend
      kan plaatsvinden aan het fonds voor gemene rekening; en

      d. reeds vóór 1 januari 2025 het voornemen bestond om aan de voorwaarde in onderdeel c te voldoen.


