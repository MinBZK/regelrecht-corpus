  - number: VI
    text: |-
      1 Voor de toepassing van de [afdelingen 3.2][ref1] en [3.4][ref2], [hoofdstuk 4][ref3] en de
      [afdelingen 7.2][ref4], [7.3][ref5] en [7.5 van de Wet inkomstenbelasting 2001][ref6] en de
      [Wet op de vennootschapsbelasting 1969][ref7] behoeft het voordeel dat is behaald door een deelgerechtigde ter
      zake van de vervreemding van zijn bewijs van deelgerechtigdheid in een fonds voor gemene rekening als bedoeld
      in [artikel IV, eerste lid][ref8], in het kader van een aandelenfusie als bedoeld in het tweede lid niet in
      aanmerking te worden genomen indien die aandelenfusie uiterlijk op 31 december 2024 plaatsvindt en latere heffing
      is verzekerd. De eerste zin is niet van toepassing op een in het kader van een aandelenfusie genoten bijbetaling.

      2 Voor de toepassing van dit artikel en de [artikelen VIII][ref9] en [IX][ref10] is sprake van een
      aandelenfusie indien een vennootschap (verkrijgende vennootschap) tegen uitreiking van eigen aandelen of
      winstbewijzen, eventueel met bijbetaling, dan wel bij wijze van storting op de aandelen in die vennootschap,
      het bewijs van deelgerechtigdheid van de deelgerechtigde in het fonds voor gemene rekening, bedoeld in
      [artikel IV, eerste lid][ref11], verwerft, tenzij:

      a. de bijbetaling 10 percent van de nominale waarde van de uitgereikte aandelen te boven gaat;

      b. de deelgerechtigde die een aanmerkelijk belang heeft in het fonds voor gemene rekening na het vervreemden van
      zijn bewijzen van deelgerechtigdheid in dat fonds aan de verkrijgende vennootschap in het kader van de fusie geen
      aanmerkelijk belang heeft in die verkrijgende vennootschap; of

      c. de fusie per saldo resulteert in een vermogensverschuiving van de deelgerechtigde in het fonds voor gemene
      rekening naar een of meer andere aandeelhouders in of andere gerechtigden tot het vermogen van de verkrijgende
      vennootschap.

      3 Indien de deelgerechtigde in het fonds voor gemene rekening onderworpen is aan de vennootschapsbelasting
      of het bewijs van deelgerechtigdheid van de deelgerechtigde in het fonds voor gemene rekening behoort tot het
      vermogen van een onderneming of van een werkzaamheid als bedoeld in de [afdelingen 3.2][ref12] en [7.2][ref13],
      onderscheidenlijk [3.4][ref14] en 7.2, van de Wet inkomstenbelasting 2001, en het voordeel volgens het eerste lid
      buiten aanmerking blijft, wordt voor de toepassing van de [Wet op de vennootschapsbelasting 1969][ref15] of de
      betreffende afdelingen van de [Wet inkomstenbelasting 2001][ref16] door die deelgerechtigde de boekwaarde van de in
      het kader van de aandelenfusie verworven aandelen of winstbewijzen in de verkrijgende vennootschap gesteld op, dan
      wel wordt de boekwaarde van de aandelen in de verkrijgende vennootschap waarop in het kader van de aandelenfusie is
      gestort verhoogd met, de waarde waarvoor zijn bewijs van deelgerechtigdheid in het open fonds voor gemene rekening
      onmiddellijk voorafgaand aan het fusietijdstip te boek was gesteld.

      4 Indien de deelgerechtigde een aanmerkelijk belang als bedoeld
      in [hoofdstuk 4 van de Wet inkomstenbelasting 2001][ref17] of
      [artikel 17, derde lid, onderdeel b, van de Wet op de vennootschapsbelasting 1969][ref18] in het fonds voor
      gemene rekening heeft en het voordeel volgens het eerste lid buiten aanmerking blijft, wordt voor de toepassing
      van genoemd hoofdstuk 4, onderscheidenlijk genoemd artikel 17, derde lid, onderdeel b, de verkrijgingsprijs van
      de in het kader van de aandelenfusie verworven aandelen of winstbewijzen in de verkrijgende vennootschap gesteld
      op, dan wel wordt de verkrijgingsprijs van de aandelen in de verkrijgende vennootschap waarop in het kader van de
      aandelenfusie is gestort verhoogd met, de verkrijgingsprijs van het in het kader van de aandelenfusie vervreemde
      bewijs van deelgerechtigdheid in het fonds voor gemene rekening.

      5 De [artikelen 13h][ref19] en [13i van de Wet op de vennootschapsbelasting 1969][ref20] zijn van overeenkomstige
      toepassing.


