  - number: VII
    text: |-
      Indien een lichaam als gevolg van de inwerkingtreding van [artikel II, onderdeel B][ref1],
      niet langer kwalificeert als vrijgestelde beleggingsinstelling als bedoeld in
      [artikel 6a van de Wet op de vennootschapsbelasting 1969][ref2] en het boekjaar van dat lichaam niet gelijk is aan
      het kalenderjaar, wordt dat lichaam, in afwijking in zoverre van artikel 6a, zesde lid, van die wet, met ingang van
      het tijdstip van inwerkingtreding van artikel II, onderdeel B, niet langer als vrijgestelde beleggingsinstelling
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0049131#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel6a
