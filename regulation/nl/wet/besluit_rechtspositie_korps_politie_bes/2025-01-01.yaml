      1 De ambtenaar van politie die na afloop van een hem verleend buitengewoon verlof van lange duur en zonder dat dit
      is verlengd, zijn werkzaamheden niet hervat, wordt gelijk behandeld als een ambtenaar van politie die een aanvraag
      tot ontslag heeft ingediend.

      2 Het eerste lid is niet van toepassing, indien de ambtenaar van politie binnen een termijn van drie maanden ten
      genoege van Onze Minister aannemelijk maakt, dat hij een geldige reden had om zijn werkzaamheden niet te hervatten.
      Alsdan wordt het verlof verlengd tot het tijdstip waarop de bedoelde reden heeft opgehouden te bestaan.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel61
