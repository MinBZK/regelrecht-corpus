  - number: '70'
    text: |-
      1 Van een medisch oordeel krachtens [artikel 68][ref1] of [69][ref2], staat binnen zes weken nadat de ambtenaar
      van politie daarvan schriftelijk in kennis is gesteld, beroep open bij een door de Onze Minister ingestelde
      herkeuringscommissie bestaande uit drie geneeskundigen. Een van de geneeskundigen wordt aangewezen door de
      ambtenaar van politie.

      2 Het beroep moet schriftelijk en met redenen omkleed worden ingediend. Het beroepschrift vermeld tevens de naam
      en het adres van de geneeskundige die door de ambtenaar van politie voor benoeming in de herkeuringscommissie wordt
      aangewezen.

      3 De leden van de herkeuringscommissie mogen niet betrokken zijn geweest bij het medisch oordeel, waartegen beroep
      is ingesteld.

      4 De herkeuringscommissie deelt haar oordeel zo spoedig mogelijk schriftelijk mee aan de ambtenaar van politie,
      Onze Minister en het hoofd van dienst.

      5 De kosten verbonden aan de uitvoering van dit artikel komen voor rekening van de staat.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel69
