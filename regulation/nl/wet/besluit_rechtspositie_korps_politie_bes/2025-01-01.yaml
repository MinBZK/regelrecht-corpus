      - id: ref2
        bwb_id: BWBR0028767
        artikel: '1'
        hoofdstuk: I
  - number: '81'
    text: |-
      1 Indien het belang van de dienst dat naar het oordeel van Onze Minister vordert, is de ambtenaar van politie,
      anders dan de aspirant en de vrijwillige ambtenaar van politie, behoudens in het in het tweede lid genoemde
      geval, verplicht om binnen het korps zijn functie te vervullen op een andere plaats van tewerkstelling of binnen
      een ander werkgebied, dan wel een andere functie dan waarin hij geplaatst is, te vervullen hetzij op zijn plaats
      van tewerkstelling of binnen zijn werkgebied hetzij op een andere plaats van tewerkstelling of binnen een ander
      werkgebied. Behoudens in spoedeisende gevallen geschiedt zulks niet dan na overleg met betrokkene.

      2 Aan de ambtenaar van politie die in deelbetrekking werkzaam is, kan niet zonder zijn instemming een plaats van
      tewerkstelling buiten het openbaar lichaam van inwoning worden opgedragen.

      3 Indien de ambtenaar van politie in een andere functie, bedoeld in het eerste lid, wordt geplaatst, wordt een
      functie opgedragen die hem in verband met zijn persoonlijkheid, omstandigheden en vooruitzichten redelijkerwijs kan
      worden opgedragen.

      4 De ambtenaar van politie, bedoeld in het eerste lid, die verplicht is om binnen het korps zijn functie of een
      andere functie dan waarin hij is geplaatst, te vervullen binnen een ander werkgebied, heeft aanspraak op een
      vanwege Onze Minister ingerichte woning in dat andere werkgebied. Bij ministeriële regeling kunnen nadere regels
      worden gesteld.

      5 Bij ministeriële regeling kunnen regels worden gesteld over een toelage aan de ambtenaar van politie, bedoeld in
      het eerste lid, die binnen een ander werkgebied zijn functie, dan wel een andere functie dan waarin hij geplaats
      is, dient te vervullen.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel81
  - number: '82'
    text: |-
      1 Onze Minister kan een ambtenaar van politie, anders dan de aspirant en de vrijwillige ambtenaar van politie,
      zo mogelijk met zijn instemming, in het belang van de dienst voor de duur van ten hoogste een jaar detacheren
      bij een ander korps, mits de detachering plaats vindt op aanvraag van of in overeenstemming met de desbetreffende
      korpsbeheerder.

      2 De periode bedoeld in het eerste lid, kan worden verlengd met maximaal één jaar.

      3 Indien het een hoofd van dienst of zijn plaatsvervanger betreft is voor de detachering en de verlenging daarvan
      de instemming van Onze Minister vereist.

      4 Indien de ambtenaar, bedoeld in het eerste lid, bij koninklijk besluit is benoemd, is voor de detachering de
      instemming van Onze Minister vereist.

      5 Bij ministeriële regeling kunnen regels worden gesteld over een detacheringstoelage aan de ambtenaar van politie,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel82
  - number: '83'
    text: |-
      1 De ambtenaar van politie, anders dan de aspirant, kan – op zijn verzoek – een andere functie dan die waarin
      hij is geplaatst, worden opgedragen, dan wel een andere plaats van tewerkstelling of een ander werkgebied worden
      aangewezen hetzij binnen het korps hetzij daarbuiten doch binnen de politie.

      2 Plaatsing geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel83
  - number: '84'
    text: |-
      De ambtenaar van politie kan niet worden verplicht om, indien bij een particulier een staking is uitgebroken of
      een uitsluiting heeft plaatsgevonden, ter vervanging van de stakers of de uitgeslotenen werkzaamheden te verrichten
      of de werknemers behulpzaam te zijn bij het verrichten van hun werkzaamheden, tenzij en voor zover zulks, naar het
      oordeel van Onze Minister, met het oog op de openbare orde, veiligheid of gezondheid dan wel voor de regelmatige
      functionering van de overheid bepaaldelijk noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel84
  - number: '85'
    text: |-
      1 Het is de ambtenaar van politie, onverminderd het tweede en derde lid, indien daardoor de behoorlijke vervulling
      van zijn plichten als ambtenaar van politie in gevaar kan worden gebracht of het aanzien van zijn ambt kan worden
      geschaad, verboden om:

      a. naast zijn ambt een beroep of bedrijf uit te oefenen;

      b. een nevenbetrekking te aanvaarden dan wel ten behoeve van derden, tegen betaling, werkzaamheden te verrichten in
      welke vorm dan ook;

      c. commissaris, bestuurder of vennoot te zijn van een rechtspersoon dan wel middellijk of onmiddellijk deel te
      nemen aan werken, dienstverrichtingen of leveringen die direct of indirect geheel of gedeeltelijk ten laste komen
      van de overheid;

      d. ten behoeve van derden werkzaamheden te verrichten die, naar het oordeel van Onze Minister, de grenzen van een
      redelijke hulpvaardigheid overschrijden.

      2 Het is de ambtenaar van politie verboden om tegelijk met zijn ambt een uit de eilandskas bezoldigd ambt te
      bekleden, tenzij daarvoor toestemming is verleend door Onze Minister.

      3 Bij de aanvaarding van een in het tweede lid bedoeld ambt of bij voortgezette bekleding daarvan, nadat Onze
      Minister de in dat lid bedoelde toestemming heeft ingetrokken, wordt de ambtenaar van politie geacht ontslag
      te hebben gevraagd, indien aan de schriftelijke aanzegging om het ambt te laten varen niet onverwijld gevolg is
      gegeven.

      4 Onze Minister kan nadere regels stellen omtrent het verbod, bedoeld in het eerste lid.

      5 Aan een ambtenaar van politie kan door het bevoegd gezag met overeenkomstige toepassing van
      [artikel 51, tweede en derde lid, van het Rechtspositiebesluit ambtenaren BES][ref1] ontheffing worden verleend
      voor het verbod, bedoeld in het eerste lid, onder c. Deze bevoegdheid kan slechts worden gemandateerd aan de
      directeur-generaal van het Ministerie van Justitie en Veiligheid aan wie de bevoegdheden van de Minister van
      Justitie en Veiligheid als korpsbeheerder van het korps politie Bonaire, Sint Eustatius en Saba zijn gemandateerd.
      Ondermandaat is niet toegestaan. Ontheffing wordt niet verleend dan nadat hierover schriftelijk overleg is gevoerd
      met Onze Minister of namens deze de directeur-generaal Koninkrijksrelaties van het Ministerie van Binnenlandse
      Zaken en Koninkrijksrelaties.


