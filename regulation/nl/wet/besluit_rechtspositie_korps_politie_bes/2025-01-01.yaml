      1 De ambtenaar van politie, met uitzondering van de vrijwillige ambtenaar van politie, kan door Onze Minister
      wegens buitengewone toewijding of bijzonder loffelijke dienstverrichtingen worden beloond met:

      a. een tevredenheidsbetuiging;

      b. een eenvoudige geldelijke beloning tot maximaal 10% van de aanvangsbezoldiging behorende bij bezoldigingsschaal
      1;

      c. een gratificatie van ten hoogste acht en een derde procent (8 1/3%) van de bezoldiging van de betrokken
      ambtenaar, berekend over een kalenderjaar.

      2 De gratificatie zal in een kalenderjaar niet meer mogen bedragen dan 100% van de inkomsten per maand van de
      ambtenaar van politie.

      3 Ten aanzien van de ambtenaar van politie die in deelbetrekking werkzaam is, wordt voor de uitvoering van dit
      artikel in aanmerking genomen de inkomsten die hij genoten zou hebben, indien hij in volledige betrekking werkzaam
      was geweest.

      4 Het eerste tot en met derde lid is van overeenkomstige toepassing op de vrijwillige ambtenaar van politie, met
      dien verstande dat de beloningen zijn:

      a. een tevredenheidsbetuiging of

      b. een gratificatie van maximaal 150 procent van de per kalenderjaar krachtens [artikel 23a][ref1] vastgestelde
      vaste vergoeding.


