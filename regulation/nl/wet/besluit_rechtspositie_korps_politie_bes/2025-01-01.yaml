  - number: '71'
    text: |-
      1 De ambtenaar van politie kan eervol ontslag worden verleend op grond van blijvende ongeschiktheid voor de verdere
      vervulling van zijn ambt wegens ziekte of gebreken, indien:

      a. de maximum-duur van de vrijstelling van dienst wegens ziekte, genoemd in [artikel 64][ref1] juncto
      [69, tweede lid][ref2], is verstreken; en

      b. ter zake van de ongeschiktheid wegens ziekte of ongeval een geneeskundig onderzoek is ingesteld als bedoeld
      in [artikel 69][ref3], waaronder begrepen een eventuele heroverweging door de herkeuringscommissie, bedoeld in
      [artikel 70][ref4]; en

      c. het na een zorgvuldig onderzoek niet mogelijk is gebleken om de ambtenaar van politie, mede rekening houdend
      met zijn persoonlijkheid en omstandigheden, zijn huidige functie in aangepaste vorm of een andere passende functie
      binnen de politiedienst op te dragen, dan wel indien hij geweigerd heeft een dergelijke functie te aanvaarden.

      2 Onder andere passende functie, bedoeld in het eerste lid, onder c, wordt verstaan:

      a. gedurende het eerste jaar dat de ambtenaar van politie ongeschikt is tot het uitoefenen van zijn functie wegens
      ziekte of ongeval: iedere functie die aansluit bij zijn opleiding en ervaring dan wel bij zijn opleidings- en
      ervaringsniveau;

      b. na het eerste jaar: iedere functie waartoe de ambtenaar van politie, gezien zijn capaciteiten, in staat is.

      3 Indien sprake is van een plaatsing als bedoeld in het eerste lid, onder c, in een functie voor minder uren dan
      het aantal waarvoor de ambtenaar van politie is aangesteld, dan heeft het ontslag alleen betrekking op het meerdere
      aantal uren.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel69
