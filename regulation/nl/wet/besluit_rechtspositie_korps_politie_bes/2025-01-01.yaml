    text: |-
      1 Aan de ambtenaar die reeds op 30 juni 2013 in dienst was, wordt een eenmalige harmonisatie-uitkering verleend ter
      hoogte van USD 300,00.

      2 De harmonisatie-uitkering wordt voor de ambtenaar, bedoeld in het eerste lid, met een deelbetrekking vastgesteld
      op een evenredig deel van de harmonisatie-uitkering, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel23k
  - number: 23l
    text: |-
      De ambtenaar die naar het oordeel van Onze Minister, dat is neergelegd in een formele beoordeling als bedoeld
      in [artikel 25][ref1], in 2013 zijn functie naar behoren heeft vervuld, ontvangt een eenmalige uitkering van
      USD 100,00.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel25
