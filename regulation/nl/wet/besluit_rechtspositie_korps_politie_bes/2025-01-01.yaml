  - number: '35'
    text: |-
      1 Over de periode gedurende welke de ambtenaar van politie in het geheel geen werkzaamheden verricht, met
      uitzondering van de eerste dertig dagen, heeft hij geen aanspraak op vakantie-uren.

      2 Over de tijd gedurende welke de ambtenaar van politie gedeeltelijk werkzaamheden verricht, heeft hij aanspraak op
      vakantie-uren naar evenredigheid van het gedeelte van de tijd dat hij werkzaamheden verricht.

      3 Vermindering, bedoeld in het eerste en tweede lid, vindt niet plaats bij:

      a. verleende vakantie-uren;

      b. levensfaseverlof;

      c. niet aan schuld of nalatigheid van de ambtenaar van politie te wijten ziekte of ongeval, voor zover de
      verhindering tot dienstverrichting korter duurt dan 26 weken dan wel 52 weken in geval van verhindering tot
      dienstverrichting wegens een dienstongeval;

      d. zwangerschaps- en bevallingsverlof, bedoeld in [artikel 72][ref1];

      e. verblijf in militaire dienst wegens herhalingsoefening;

      f. vrijstelling op grond van [artikel 45][ref2];

      g. buitengewoon verlof van korte duur op grond van de [artikelen 48][ref3], [50][ref4], [51][ref5], [52][ref6]
      of [53][ref7];

      h. andere redenen op grond waarvan Onze Minister daartoe redenen aanwezig acht.

      4 Het aantal vakantie-uren waarop de ambtenaar van politie na toepassing van dit artikel over een kalenderjaar
      aanspraak heeft, wordt zo nodig naar boven afgerond op hele uren.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel45
