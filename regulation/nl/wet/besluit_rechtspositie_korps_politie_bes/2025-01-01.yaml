  - number: '45'
    text: |-
      1 De ambtenaar van politie, geniet, voor zover het dienstbelang dat toelaat, vrijstelling van dienst, te verlenen
      door Onze Minister, indien het politiedienstonderdeel op een daartoe aangewezen kerkelijke, landelijke of
      eilandelijke feest- of gedenkdag gesloten is.

      2 Aan de ambtenaar van politie wordt door Onze Minister vrijstelling van dienst verleend op een andere werkdag,
      voor zover hij op één van de in het eerste lid bedoelde dagen:

      a. werkzaamheden heeft verricht;

      b. een roostervrije dag als bedoeld in [artikel 26, tweede lid, onderdeel b][ref1], heeft genoten;

      c. verlof heeft genoten als vergoeding voor verricht overwerk.

      3 [Artikel 44, derde en vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel44
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel45
