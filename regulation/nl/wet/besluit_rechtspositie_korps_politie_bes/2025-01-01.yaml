  - number: '117'
    text: |-
      Aan een ambtenaar van politie die in een door Onze Minister openbare betrekking hier te lande wordt benoemd, wordt
      met ingang van de dag van aanvaarding van die betrekking eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel117
  - number: '118'
    text: |-
      1 Aan de ambtenaar van politie wordt eervol ontslag verleend met ingang van de dag waarop hij op grond van
      [artikel 6 van de Wet algemene ouderdomsverzekering BES][ref1] recht heeft op ouderdomspensioen.

      2 De ingang van het op grond van het eerste lid te verlenen ontslag kan bij in zeer bijzondere gevallen voor de
      duur van ten hoogste een jaar worden opgeschort indien:

      a. het opschorten van de ingang van het ontslag door Onze Minister nodig wordt geacht in het belang van de dienst;
      en

      b. de ambtenaar van politie daartoe een aanvraag heeft ingediend of daarmee heeft ingestemd; en

      c. hij blijkens het schriftelijke oordeel van een geneeskundige bedoeld in [artikel 66][ref2], geacht kan worden in
      staat te zijn om zijn ambt te blijven uitoefenen.

      3 Indien voldaan is aan de voorwaarden genoemd in het tweede lid, kan de duur bedoeld in dat lid, maximaal vier
      keer worden verlengd telkens met ten hoogste een jaar. Niettemin kan de ambtenaar van politie die, blijkens het
      schriftelijke oordeel van een geneeskundige, bedoeld in [artikel 66][ref3], tussentijds ongeschikt is geworden
      voor de verdere uitoefening van zijn ambt, eervol ontslag worden verleend met ingang van de eerste dag van de maand
      volgend op die waarin hij schriftelijk in kennis is gesteld van dat oordeel.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0028767#Artikel66
