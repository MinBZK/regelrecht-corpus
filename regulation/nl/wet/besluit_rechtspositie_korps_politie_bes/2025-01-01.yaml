    text: |-
      1 Tijdens de schorsing worden de inkomsten voor een derde gedeelte ingehouden. Na verloop van zes weken kan verdere
      inhouding, ook van het volle bedrag der inkomsten, plaatsvinden. Indien het een schorsing betreft als bedoeld in
      [artikel 109, lid 1, onder b][ref1], kan Onze Minister bepalen dat met onmiddellijke ingang meer dan een derde
      gedeelte of het volle bedrag der inkomsten wordt ingehouden

      2 Geen inhouding vindt plaats ingeval van een schorsing in het belang van de dienst,
      bedoeld in [artikel 109, eerste lid, onder c][ref2], van een maatregel op grond van de
      [Wet tot regeling van het toezicht op krankzinnigen BES][ref3], of van een ophouding voor verhoor of een
      inverzekeringstelling, bedoeld in de [titels V][ref4] en [VII van het Wetboek van Strafvordering BES][ref5], mits
      niet gevolgd door voorlopige hechtenis.

      3 De ingehouden inkomsten worden alsnog aan de ambtenaar van politie uitbetaald als de schorsing niet wordt gevolgd
      door een onvoorwaardelijk ontslag bij wijze van straf. Op de uit te betalen inkomsten worden in mindering gebracht
      de inkomsten die de ambtenaar van politie sedert de schorsing heeft genoten uit arbeid die hij als gevolg van de
      schorsing heeft kunnen verrichten, tenzij dit naar het oordeel van Onze Minister onredelijk is.

      4 Het niet ingehouden gedeelte van de inkomsten van de geschorste ambtenaar van politie kan door Onze
      Minister in bijzondere gevallen worden uitbetaald aan de betrekkingen van de ambtenaar van politie, genoemd in
      [artikel 54][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel109
