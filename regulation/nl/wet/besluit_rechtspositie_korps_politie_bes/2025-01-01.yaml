  - number: 37b
    text: |-
      1 Tenzij gewichtige redenen van dienstbelang zich daartegen verzetten, kan Onze Minister op aanvraag van de
      ambtenaar van politie zijn aanspraak op vakantie-uren eenmaal per kalenderjaar met ten hoogste 36 vakantie-uren
      verlagen.

      2 Tenzij gewichtige redenen van dienstbelang zich daartegen verzetten, kan Onze Minister op aanvraag van de
      ambtenaar van politie eenmaal per kalenderjaar zijn aanspraak op vakantie-uren met ten hoogste 72 vakantie-uren
      verhogen.

      3 Ten aanzien van het in het eerste tot en met vierde lid genoemde aantal vakantie-uren is
      [artikel 33, derde en vierde lid][ref1], van overeenkomstige toepassing.

      4 Een aanvraag als bedoeld in het eerste of tweede lid wordt voor 1 november van het lopende kalenderjaar
      ingediend. Onze Minister beslist op of na 1 november en voor het einde van dat kalenderjaar gelijktijdig over alle
      voor die datum ingediende aanvragen.

      5 De ambtenaar van politie wordt een vergoeding toegekend voor elk uur waarmee zijn aanspraak op vakantie-uren
      ingevolge het eerste of tweede lid wordt verlaagd, ten bedrage van de bezoldiging per uur die hij geniet op de dag
      waarop de aanvraag, bedoeld in het eerste lid, is goedgekeurd.

      6 De ambtenaar van politie is een vergoeding verschuldigd voor elk uur waarmee zijn aanspraak op vakantie-uren
      ingevolge het derde of vierde lid wordt verhoogd ten bedrage van de bezoldiging per uur die hij geniet op de dag
      waarop de aanvraag, bedoeld in het tweede lid, is goedgekeurd.

      7 Onze Minister kan nadere regels stellen ter uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel33
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel37b
