  - number: 23i
    text: |-
      1 Indien de ambtenaar die reeds op 30 september 2014 in dienst was na 1 juli 2013 een of twee maal is bevorderd, en
      hij de maximum-bezoldiging van de alsdan voor hem geldende bezoldigingsschaal heeft bereikt, is [artikel 23h][ref1]
      van overeenkomstige toepassing met inachtneming van het tweede en derde lid.

      2 Na de eerste bevordering sinds 1 juli 2013, niet zijnde een reguliere plaatsing in de vooraf afgesproken
      formatieve bezoldigingsschaal, kunnen verhogingen van de bezoldiging van de ambtenaar, bedoeld in het eerste
      lid, worden toegekend tot en met het aantal garantietreden in de bezoldigingsschaal volgens welke hij vóór zijn
      bevordering werd bezoldigd minus twee.

      3 Na de tweede bevordering sinds 1 juli 2013, niet zijnde een reguliere plaatsing in de vooraf afgesproken
      formatieve bezoldigingsschaal, kunnen verhogingen van de bezoldiging van de ambtenaar, bedoeld in het eerste lid,
      worden toegekend tot en met het aantal garantietreden in de bezoldigingsschaal volgens welke hij vóór zijn eerste
      bevordering werd bezoldigd minus vijf.

      4 Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op de ambtenaar die tussen 1 juli 2013
      en 1 oktober 2014 in dienst is getreden, met dien verstande dat voor «1 juli 2013» gelezen wordt: de datum van
      indiensttreding.

      5 Indien de ambtenaar die reeds op 30 september 2014 in dienst was na 1 juli 2013 is geplaatst in de vooraf
      afgesproken formatieve bezoldigingsschaal, en hij de maximum-bezoldiging van de alsdan voor hem geldende
      bezoldigingsschaal heeft bereikt, is [artikel 23h][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel23h
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel23h
