  - number: '4'
    text: |-
      1 Aanstelling van de ambtenaar van politie geschiedt in tijdelijke of vaste dienst.

      2 Aanstelling van de ambtenaar van politie, met uitzondering van de vrijwillige ambtenaar van politie, in
      tijdelijke dienst geschiedt voor bepaalde of onbepaalde tijd.

      3 Aanstelling van de vrijwillige ambtenaar van politie in tijdelijke dienst geschiedt voor bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel4
  - number: '5'
    text: |-
      1 De aanstelling van de aspirant geschiedt in tijdelijke dienst voor de duur dat de basisopleiding wordt gevolgd.
      De aanstelling van de vrijwillige ambtenaar in opleiding geschiedt in tijdelijke dienst voor de tijd dat de
      opleiding tot vrijwillige ambtenaar aangesteld voor de uitvoering van de politietaak wordt gevolgd

      2 Na het voltooien van de basisopleiding respectievelijk de opleiding van de vrijwillig ambtenaar aangesteld voor
      de uitvoering van de politietaak vindt aanstelling in tijdelijke dienst plaats als ambtenaar aangesteld voor de
      uitvoering van de politietaak onderscheidenlijk als vrijwillig ambtenaar aangesteld voor de uitvoering van de
      politietaak voor een proeftijd van zes maanden, zonodig in bijzondere gevallen op verzoek van betrokkene met zes
      maanden te verlengen en zonodig ambtshalve te verlengen met het deel van de proeftijd dat hij niet in actieve
      dienst was.

      3 [Vervallen].

      4 [vervallen].

      5 De ambtenaar van politie, bedoeld in het tweede lid, die de proeftijd volgens Onze Minister zonder bedenkingen
      heeft voltooid, wordt in vaste dienst aangesteld.

      6 In afwijking van het vijfde lid kan de aanstelling van de ambtenaar aangesteld voor de uitvoering van de
      politietaak, die de proeftijd zonder bedenkingen heeft voltooid, in tijdelijke dienst plaatsvinden:

      a. ter vervanging van een wegens ziekte of uit anderen hoofde afwezige ambtenaar van politie;

      b. ter uitvoering van werkzaamheden met een kennelijk tijdelijk karakter.

      7 Zodra de omstandigheid die leidde tot de aanstelling in tijdelijke dienst, bedoeld in het zesde lid, zich niet
      meer voordoet vindt zo mogelijk aanstelling in vaste dienst plaats.

      8 De aanstelling in tijdelijke dienst, bedoeld in het zesde lid, onder a, kan niet langer duren dan vijf jaren.

      9 In het geval, bedoeld in het zesde lid, onder b, wordt in ieder geval aangenomen dat de omstandigheid die leidde
      tot de aanstelling in tijdelijke dienst, zich niet meer voordoet wanneer betrokkene twee jaar, zonder onderbreking
      van langer dan een maand, in politiedienst werkzaam is, waarvan laatstelijk ten minste één jaar in zijn huidige
      functie.

      10 Het negende lid geldt niet in die gevallen waarin vaststaat dat de werkzaamheden in de door betrokkene
      uitgeoefende functie binnen een jaar worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel5
  - number: '6'
    text: |-
      1 De aanstelling van de ambtenaar aangesteld voor de uitvoering van technische, administratieve en andere taken ten
      dienste van de politie, kan in tijdelijke dienst voor bepaalde duur plaatsvinden:

      a. voor een proeftijd van één jaar, zonodig in bijzondere gevallen op verzoek van betrokkene met één jaar te
      verlengen en zonodig ambtshalve te verlengen met het deel van de proeftijd dat hij niet in actieve dienst was;

      b. ter vervanging van een wegens ziekte of uit anderen hoofde afwezige ambtenaar van politie;

      c. ter uitvoering van werkzaamheden met een kennelijk tijdelijk karakter;

      d. indien betrokkene in dienst wordt genomen als leerling ter opleiding tot een functie binnen de politiedienst dan
      wel in verband met zijn verdere praktische opleiding of vorming;

      e. indien een wijziging in de taak van betrokkene of het politiedienst-onderdeel is voorgenomen.

      2 Zodra de omstandigheid die leidde tot de aanstelling in tijdelijke dienst, bedoeld in het eerste lid, zich niet
      meer voordoet vindt zo mogelijk aanstelling in vaste dienst plaats.

      3 De aanstelling in tijdelijke dienst, bedoeld in het eerste lid, onder b, kan niet langer duren dan vijf jaren.

      4 In de gevallen, bedoeld in het eerste lid, onder c en e, wordt in ieder geval aangenomen dat de omstandigheid
      die leidde tot de aanstelling in tijdelijke dienst, zich niet meer voordoet wanneer betrokkene twee jaar zonder
      onderbreking van langer dan een maand in politiedienst werkzaam is, waarvan laatstelijk ten minste één jaar in zijn
      huidige functie.

      5 Het vierde lid geldt niet in die gevallen waarin vaststaat dat de werkzaamheden in de door betrokkene
      uitgeoefende functie binnen een jaar worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel6
  - number: '7'
    text: |-
      Aanstelling of plaatsing in een functie vindt niet plaats van personen die op het tijdstip waarop de door Onze
      Minister voor die functie vastgestelde leeftijdsgrens, anders dan die genoemd in [artikel 118][ref1], wordt
      bereikt, niet ten minste een ononderbroken diensttijd van drie jaren doorgebracht kunnen hebben in een dergelijke
      functie.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel118
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel7
