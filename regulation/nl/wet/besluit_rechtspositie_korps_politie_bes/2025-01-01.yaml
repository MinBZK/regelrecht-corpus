    text: |-
      1 Onverminderd [artikel 102, eerste lid, onderdeel h][ref1], kan de ambtenaar van politie in zijn ambt worden
      geschorst:

      a. indien een strafrechtelijke vervolging ter zake van een misdrijf tegen hem is ingesteld;

      b. wanneer hem door Onze Minister, dan wel door Ons, indien het betreft een ambtenaar die bij koninklijk besluit
      is benoemd, het voornemen tot bestraffing met onvoorwaardelijk ontslag is meegedeeld dan wel wanneer hem die straf
      is opgelegd;

      c. wanneer naar het oordeel van Onze Minister, dan wel naar Ons oordeel, indien het betreft een ambtenaar die bij
      koninklijk besluit is benoemd, het dienstbelang dit bepaaldelijk vereist.

      2 Tenzij bij wet is bepaald dat schorsing bij koninklijk besluit geschiedt, geschiedt schorsing door Onze Minister.
      In afwachting van de schorsing kan de ambtenaar van politie buiten functie worden gesteld door Onze Minister.

      3 De duur van de schorsing bedraagt maximaal zes maanden. In zeer bijzondere gevallen kan deze termijn eenmaal met
      drie maanden worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel102
