  - number: '66'
    text: |-
      1 De ambtenaar van politie kan aan een geneeskundig onderzoek worden onderworpen vanwege de dienst ter beoordeling
      van de vraag:

      a. of sprake is van verhindering tot dienstverrichting wegens ziekte of ongeval;

      b. of zich een omstandigheid voordoet, bedoeld in [artikel 65, eerste en tweede lid][ref1];

      c. of maatregelen in het belang van herstel nodig zijn;

      d. wanneer en in welke mate de werkzaamheden hervat kunnen worden.

      2 De vanwege de dienst optredende geneeskundige deelt zijn oordeel terstond mee aan de ambtenaar van politie en
      stelt het hoofd van dienst zo spoedig mogelijk ter zake schriftelijk in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel65
