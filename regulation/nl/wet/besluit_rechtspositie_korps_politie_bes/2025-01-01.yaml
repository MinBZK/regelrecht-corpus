      1 De ambtenaar van politie is van rechtswege in zijn ambt geschorst wanneer hem rechtmatig zijn vrijheid
      is ontnomen, tenzij de vrijheidsbeneming het gevolg is van een maatregel, anders dan op grond van de
      [Wet tot regeling van het toezicht op krankzinnigen BES][ref1], genomen in het belang van de volksgezondheid.

      2 Indien de vrijheidsbeneming het gevolg is van een maatregel op grond van de
      [Wet tot regeling van het toezicht op krankzinnigen BES][ref2] wordt de ambtenaar van politie, onverminderd het
      eerste lid, behandeld als ware hem vrijstelling van dienst wegens ziekte als bedoeld in [hoofdstuk VII][ref3],
      verleend.


