  - number: '41'
    text: |-
      1 Indien de ambtenaar van politie bij zijn overlijden nog niet-genoten vakantie-uren had, daaronder begrepen
      vakantie-uren die de overledene gespaard had ten behoeve van levensfaseverlof, wordt aan zijn weduwe of weduwnaar
      zo spoedig mogelijk door Onze Minister een bedrag uitbetaald gelijk aan het bedrag aan bezoldiging dat hem zou zijn
      uitgekeerd gedurende de vakantie-uren, indien deze zouden zijn genoten. Bij de vaststelling van het aantal uren
      vindt [artikel 35][ref1] geen toepassing.

      2 Indien de overleden ambtenaar van politie geen weduwe of weduwnaar nalaat, geschiedt de uitbetaling ten behoeve
      van de minderjarige kinderen. Onder kinderen worden in dit lid verstaan natuurlijke kinderen en kinderen waarover
      de overledene de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt in dit lid verstaan de zorg voor het
      onderhoud en de opvoeding van een kind als was het een eigen kind, onafhankelijk van enige verplichting daartoe of
      van het genieten van een vergoeding daarvoor. Ontbreken ook kinderen, dan geschiedt de betaling van de vakantie-
      uitkering aan degenen die geheel of grotendeels afhankelijk waren van de bezoldiging van de overledene. Laat de
      overledene ook geen betrekkingen na als bedoeld in de vorige volzin, dan wordt de vakantie-uitkering geheel of
      ten dele aangewend voor de betaling van de kosten van de laatste ziekte en van de lijkbezorging, voor zover de
      nalatenschap van de overledene voor de betaling van die kosten ontoereikend is.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel35
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028767
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '42'
    text: |-
      1 Aanspraken op nietgenoten vakantie-uren vervallen op de datum van ingang van ontslag van de ambtenaar van
      politie. Indien de ambtenaar van politie uiterlijk veertien dagen daarna weer in dienst treedt, kan hij alsnog
      aanspraak maken op de niet-genoten vakantie-uren van het lopende kalenderjaar.

      2 Indien op de dag van ontslag blijkt, dat de ambtenaar van politie teveel vakantie-uren heeft genoten, is hij
      voor ieder te veel genoten vakantie-uur schuldig een bedrag gelijk aan de bezoldiging die hij genoot per werkuur
      onmiddellijk voorafgaand aan het ontslag.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel42
  - number: '43'
    text: |-
      1 Tenzij anders is bepaald bij dit besluit of bij of krachtens de [Ambtenarenwet BES][ref1], wordt de vrijstelling
      van dienst verleend met behoud van volle bezoldiging.

      2 In afwijking van [artikel 1, onder c][ref2], wordt in dit hoofdstuk onder ambtenaar van politie verstaan:
      ambtenaar van politie, met uitzondering van de vrijwillige ambtenaar van politie.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel1
