  - number: '37'
    text: |-
      1 De ambtenaar van politie is vrij te bepalen wanneer hij vakantie opneemt, voor zover het dienstbelang zich
      daartegen niet verzet.

      2 Onze Minister stelt de ambtenaar van politie ieder jaar in de gelegenheid en die ambtenaar is verplicht ieder
      jaar ten minste 108 uren vakantie op te nemen, waarvan ten minste 72 uur over een aaneengesloten periode.

      3 Voor de ambtenaar van politie met een deelbetrekking worden de in dit lid genoemde aantallen uren vermenigvuldigd
      met een breuk waarvan de teller bestaat uit het aantal uren van de voor betrokkene geldende werktijd en de noemer
      uit het aantal uren van 36.

      4 De ambtenaar van politie meldt het voornemen vakantie op te nemen ruimschoots van tevoren op een door Onze
      Minister te bepalen wijze.

      5 Tenzij gewichtige redenen van dienstbelang zich hiertegen verzetten, is het de ambtenaar toegestaan op het
      voornemen vakantie op te nemen terug te komen, dan wel het opnemen niet voort te zetten.

      6 Door Onze Minister kan een, zo nodig per politiedienstonderdeel verschillend, minimum aantal aaneengesloten
      vakantie-uren worden vastgesteld dat op een zelfde dag als vakantie-uren toegekend kan worden. Dit aantal kan
      niet hoger worden gesteld dan het voor de ambtenaar van politie volgens de voor hem geldende werktijd op een dag
      vastgestelde aantal werkuren.

      7 De in deze paragraaf bedoelde vakantie kan wegens dringende redenen van dienstbelang door Onze Minister geheel of
      gedeeltelijk worden geweigerd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel37
  - number: 37a
    text: |-
      1 Behoudens [artikel 39][ref1] vervalt de aanspraak op vakantie-uren na verloop van een jaar na de laatste dag van
      het kalenderjaar waarin de aanspraak is ontstaan.

      2 Indien de ambtenaar van politie naar het oordeel van Onze Minister redelijkerwijs niet in staat is geweest zijn
      vakantie-uren binnen de in het eerste lid genoemde termijn op te nemen, kan Onze Minister toestaan dat van het
      eerste lid wordt afgeweken. In dat geval vervalt de aanspraak alsnog na verloop van vijf jaren na de laatste dag
      van het kalenderjaar waarin de aanspraak is ontstaan.

      3 Dit artikel is niet van toepassing op vakantie-uren die de ambtenaar op grond van [37c][ref2] heeft gespaard ten
      behoeve van levensfaseverlof.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel37c
