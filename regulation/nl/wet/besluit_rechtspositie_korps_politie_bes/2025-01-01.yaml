  - number: '40'
    text: |-
      1 Onze Minister kan toestaan, dat een ambtenaar van politie in enig kalenderjaar meer uren vakantie opneemt dan
      zijn aanspraak tot en met het lopende kalenderjaar bedraagt, met dien verstande, dat de opgenomen vakantie-uren
      de aanspraak tot en met het lopende jaar nooit met meer dan een derde van het aantal vakantie-uren waarop die
      ambtenaar op grond van [artikel 33][ref1] over dat jaar aanspraak heeft, mag overschrijden.

      2 De in een kalenderjaar te veel genoten vakantie-uren wordt in mindering gebracht op de aanspraak op de vakantie-
      uren waarop betrokkene op grond van [artikel 33][ref2] aanspraak heeft over het eerstvolgende jaar.

      3 Indien op de dag van zijn ontslag blijkt, dat de ambtenaar te veel vakantie-uren heeft genoten, is hij voor ieder
      uur teveel genoten vakantie een bedrag verschuldigd ten bedrage van de bezoldiging per uur.

      4 Het aantal vakantie-uren waarop de ambtenaar van politie na toepassing van dit artikel over een kalenderjaar
      aanspraak heeft, wordt zo nodig naar boven afgerond op hele uren.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel33
