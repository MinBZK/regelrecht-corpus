  - number: '67'
    text: |-
      1 De ambtenaar van politie die zich niet kan verenigen met het medisch oordeel, bedoeld in [artikel 66][ref1], kan
      daartegen binnen driemaal 24 uur nadat dit oordeel schriftelijk te zijner kennis is gebracht, bij Onze Minister een
      met redenen omkleed bezwaarschrift indienen.

      2 Desgevraagd wordt hij in de gelegenheid gesteld een mondelinge toelichting te geven. Hij kan zich laten bijstaan
      door een raadsman.

      3 Behalve indien Onze Minister, na overleg met de geneeskundige, bedoeld in [artikel 66][ref2], het bezwaar van
      de ambtenaar van politie reeds aanstonds gegrond acht, wordt binnen twee weken na ontvangst daarvan een nieuw
      geneeskundig onderzoek verricht door een door Onze Minister ingestelde bezwaarcommissie bestaande uit drie
      geneeskundigen. De geneeskundige, bedoeld in artikel 66, kan geen deel uit maken van de bezwaarcommissie.

      4 De bezwaarcommissie deelt haar oordeel zo spoedig mogelijk schriftelijk mee aan de ambtenaar van politie, Onze
      Minister en het hoofd van dienst.

      5 De kosten verbonden aan de uitvoering van dit artikel komen voor rekening van de staat.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel66
