  - number: '31'
    text: |-
      1 De aspirant die onmiddellijk voorafgaand aan zijn aanstelling als aspirant in dienst van de staat of
      het openbaar lichaam Bonaire, Sint Eustatius en Saba werkzaam was, anders dan als ambtenaar behorende
      tot het onderwijzend personeel of als personeelslid van het gesubsidieerde onderwijs, behoudt bij
      zijn aanstelling op zijn verzoek aanspraak op de vakantie-uren die tijdens zijn vorige dienstverband
      in het lopende en het voorgaande kalenderjaar waarin zijn aanstelling plaatsvindt, op grond van
      [artikel 5 van het Besluit vakantie en vrijstelling van dienst ambtenaren BES][ref1] zijn ontstaan en nog niet
      genoten, met dien verstande dat hij de niet-genoten vakantie-uren niet kan opnemen zolang hij geplaatst is op het
      opleidingsinstituut.

      2 Aan de aspirant kan, ter vervanging van de door hem in zijn vorige overheidsbetrekking niet-genoten vakantie-
      uren, door Onze Minister een geldelijke vergoeding worden toegekend gelijk aan het bedrag dat hem aan
      bezoldiging zou zijn uitgekeerd tijdens de vakantie-uren indien deze genoten zouden zijn. De eerste volzin is van
      overeenkomstige toepassing op de nagelaten betrekkingen van een overleden aspirant.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel5
