  - number: '114'
    text: |-
      1 Aan de ambtenaar van politie, anders dan de aspirant, die blijkens zijn akte van aanstelling
      is benoemd in tijdelijke dienst voor bepaalde tijd, bedoeld in [artikel 5, zesde lid][ref1], en
      [6, eerste lid, onder b, c, d en e][ref2], wordt geacht eervol ontslag te zijn verleend zodra die tijd is
      verstreken.

      2 De ambtenaar van politie, anders dan de aspirant, die blijkens zijn akte van aanstelling is benoemd in tijdelijke
      dienst voor onbepaalde tijd, kan eervol ontslag worden verleend, mits een opzegtermijn in acht wordt genomen van:

      a. drie maanden, indien hij ten tijde van de opzegging direct daaraan voorafgaand ten minste twaalf maanden
      ononderbroken in dienst was;

      b. twee maanden, indien hij ten tijde van de opzegging direct daaraan voorafgaand ten minste zes maanden doch
      korter dan twaalf maanden ononderbroken in dienst was;

      c. één maand, indien hij ten tijde van de opzegging direct daaraan voorafgaand korter dan zes maanden ononderbroken
      in dienst was.

      3 De opzegging bedoeld in het tweede lid, kan niet geschieden gedurende de zwangerschap van de vrouwelijke
      ambtenaar van politie, noch gedurende het verlof, bedoeld in [artikel 72][ref3], noch, indien zij de dienst heeft
      hervat, gedurende de daarop volgende periode van 4 weken. Ter staving van de zwangerschap kan het bevoegde gezag
      een verklaring van een genees- of verloskundige verlangen.

      4 Het ontslag, bedoeld in het tweede lid, kan, al dan niet op aanvraag van de ambtenaar van politie, ingaan vóór
      de afloop van de opzeggingstermijn. Indien dit niet op aanvraag van de ambtenaar van politie geschiedt, wordt hem
      over de tijd die aan de opzeggingstermijn ontbreekt, een bedrag uitbetaald gelijk aan de inkomsten, vermeerderd met
      de vakantie-uitkering, waarop hij aanspraak zou hebben gehad indien hij tot het einde van de opzeggingstermijn in
      dienst was gebleven.

      5 Aan de ambtenaar van politie in tijdelijke dienst, bedoeld in het eerste lid, kan ontslag worden verleend
      met ingang van een dag gelegen binnen de bepaalde tijd. Alsdan zijn het tweede tot en met het vierde lid van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0028767#Artikel72
