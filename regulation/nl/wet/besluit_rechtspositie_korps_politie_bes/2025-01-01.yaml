  - number: '115'
    text: |-
      1 Aan de ambtenaar van politie kan eervol ontslag worden verleend:

      a. wegens opheffing van zijn betrekking;

      b. wegens overtolligheid van personeel als gevolg van verandering in de inrichting van de politiedienst of het
      politiedienstonderdeel dan wel wegens inkrimping van de personeelssterkte als gevolg van een vermindering van de
      werkzaamheden.

      2 Ontslag op een in het eerste lid genoemde grond kan alleen plaatsvinden indien:

      a. het na een zorgvuldig onderzoek niet mogelijk is gebleken om de ambtenaar van politie een andere, mede rekening
      houdend met zijn persoonlijkheid en omstandigheden, passende functie op te dragen binnen de politiedienst;

      b. de ambtenaar van politie geweigerd heeft een functie als bedoeld onder a, te aanvaarden.

      3 Ontslag van ambtenaren van politie wegens overtolligheid van personeel geschiedt in de volgende rangorde:

      a. zij die dat wensen;

      b. zij die pensioengerechtigd zijn, waarbij degenen die niet reeds gedurende zes maanden of langer kostwinner zijn
      van een gezin of van betrekkingen, bedoeld in [artikel 41][ref1], vóór degenen die dat wel zijn, en binnen deze
      beide groepen ouderen in leeftijd vóór jongeren, gaan;

      c. zij die op voet van het West-Indisch Detacheringsbesluit 1930 zijn uitgezonden;

      d. zij die de leeftijd van dertig jaren nog niet hebben overschreden en niet reeds gedurende zes maanden of langer
      kostwinner zijn van een gezin of van betrekkingen, bedoeld in [artikel 41][ref2], te beginnen met degenen die de
      minste dienstjaren hebben;

      e. zij die de minste dienstjaren hebben. Onder dienstjaren wordt verstaan de tijd in dienst van de voormalige
      Nederlandse Antillen en een voormalig eilandgebied, de staat en een openbaar lichaam doorgebracht.

      4 Voor de berekening van het aantal dienstjaren wordt mede in aanmerking genomen de tijd die is gewijd aan de
      verzorging van tot het huishouden van de ambtenaar van politie behorende 0–4-jarige eigen, stief- of pleegkinderen
      tot een maximum van zes jaren.

      5 Indien het dienstbelang dit vereist kan bij de verlening van ontslag worden afgeweken van de rangorde, bedoeld
      in het derde lid. Omvat de afvloeiing in dat geval meer dan 1% van het aantal ambtenaren van politie werkzaam bij
      het korps, dan geschiedt zij naar een vooraf vastgesteld en aan de betrokken ambtenaar van politie kenbaar gemaakt
      plan.

      6 Bij de ontslagverlening wordt een opzeggingstermijn van drie maanden in acht genomen, tenzij het betreft
      een ambtenaar van politie in tijdelijke dienst die daaraan geen aanspraak op wachtgeld ontleent. Alsdan is
      [artikel 114, tweede lid][ref3], van overeenkomstige toepassing.

      7 Het ontslag kan, al dan niet op aanvraag van de ambtenaar van politie, ingaan vóór de afloop van de
      opzeggingstermijn, genoemd in het zesde lid. Indien dit niet op aanvraag van de ambtenaar van politie geschiedt
      wordt hem over de tijd die aan de opzeggingstermijn ontbreekt, een bedrag uitbetaald gelijk aan de inkomsten,
      vermeerderd met de vakantie-uitkering, waarop hij aanspraak zou hebben gehad indien hij tot het einde van de
      opzeggingstermijn in dienst was gebleven.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0028767#Artikel114
