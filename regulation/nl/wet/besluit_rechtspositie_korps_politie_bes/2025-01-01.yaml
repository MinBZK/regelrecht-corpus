  - number: '38'
    text: |-
      1 Indien de ambtenaar van politie tijdens een verleende vakantie blijkens een geneeskundige verklaring gedurende
      een of meer werkuren arbeidsongeschikt is geweest, wordt het aantal vakantie-uren dat overeenkomt met het aantal
      werkuren gedurende welke hij arbeidsongeschikt is geweest, beschouwd niet als vakantie te zijn genoten, en wordt
      hem vrijstelling, bedoeld in [artikel 44, eerste lid, onder b][ref1], verleend.

      2 De niet-genoten vakantie-uren, bedoeld in het eerste lid, worden opnieuw verleend met in achtneming van deze
      paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel44
