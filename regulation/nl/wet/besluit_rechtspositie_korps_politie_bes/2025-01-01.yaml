  - number: 31a
    text: |-
      In afwijking van [artikel 1, onder c][ref1], wordt in deze paragraaf onder ambtenaar van politie verstaan:
      ambtenaar van politie, met uitzondering van de aspirant en de vrijwillige ambtenaar van politie.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel1
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel31a
