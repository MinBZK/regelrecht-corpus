  - number: '59'
    text: |-
      Indien het verlof, bedoeld in [artikel 57][ref1], ten doel heeft de ambtenaar van politie in de
      gelegenheid te stellen op te treden als bezoldigd bestuurder van een vereniging van ambtenaren, bedoeld in
      [artikel 50, vijfde lid][ref2], dan wel van een centrale organisatie of internationale ambtenarenorganisatie
      waarbij die vereniging is aangesloten, wordt dit verleend zonder behoud van bezoldiging en voor ten hoogste twee
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel50
