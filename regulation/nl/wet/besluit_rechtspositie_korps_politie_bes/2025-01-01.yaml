      Ingeval de ambtenaar die reeds op 30 september 2013 in dienst was, wordt bevorderd wordt hem, onverminderd
      [artikel 21][ref1], de bezoldigings- of garantietrede in de nieuwe bezoldigingsschaal toegekend, waarvan het bedrag
      ten minste gelijk is aan de hem laatstelijk toekomende bezoldigings- of garantietrede in de oude schaal.


