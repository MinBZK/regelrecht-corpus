    text: |-
      1 In dit besluit wordt verstaan onder:

      a. *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. *[Vervallen]*

      c. *ambtenaar van politie:* de ambtenaar aangesteld voor de uitvoering van de politietaak, de aspirant, de
      vrijwillige ambtenaar van politie aangesteld voor de uitvoering van de politietaak, de vrijwillige ambtenaar in
      opleiding en de ambtenaar aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste
      van de politie;

      d. *aspirant:* degene die toegelaten is tot de basisopleiding;

      e. *ambtenaar aangesteld voor de uitvoering van de politietaak:* de ambtenaar, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______, met uitzondering van de aspirant;

      f. *ambtenaar aangesteld voor de uitvoering van technische, administratieve
      en andere taken ten dienste van de politie:* de ambtenaar, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______;

      f1. *vrijwillige ambtenaar aangesteld voor de uitvoering van de politietaak:* de ambtenaar, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______;

      f2. *vrijwillige ambtenaar in opleiding:* degene die door Onze Minister is benoemd tot vrijwillige ambtenaar in
      opleiding en die is toegelaten tot de opleiding tot vrijwillige ambtenaar van politie;

      f3. *vrijwillige ambtenaar van politie:* de vrijwillige ambtenaar aangesteld voor de uitvoering van de politietaak
      en de vrijwillige ambtenaar in opleiding;

      g. *volledige betrekking:* een betrekking met een arbeidstijd van gemiddeld 36 uur per week;

      h. *deelbetrekking:* een betrekking met een arbeidstijd van gemiddeld minder dan 36 uur per week;

      i. *bezoldiging:* het loon van de ambtenaar aangesteld voor de uitvoering van de politietaak, de aspirant en de
      ambtenaar aangesteld voor de uitvoering van technische, administratieve en andere taken met inachtneming van de
      bepalingen bij of krachtens het [Bezoldigingsbesluit 1998 BES][ref4] vastgesteld;

      j. *bezoldigingsschaal:* een als zodanig bij ministeriële regeling vastgestelde, van een volgnummer voorziene reeks
      van bedragen;

      k. *bezoldigingstrede:* elk afzonderlijk binnen een bezoldigingsschaal opgenomen bezoldigingsbedrag;

      l. *detachering:* een tijdelijke tewerkstelling elders dan bij het korps waar de ambtenaar van politie is
      geplaatst;

      m. *plaats van tewerkstelling:* het gebouw, het gebouwencomplex, het terrein of het vaartuig dat de ambtenaar van
      politie voor de normale uitoefening van zijn functie is aangewezen, en bij gebrek aan een dergelijke aanwijzing,
      het gebouw, het gebouwencomplex, het terrein of het vaartuig waar hij gewoonlijk zijn functie uitoefent;

      n. *werkgebied:* het openbaar lichaam Bonaire, Sint Eustatius of Saba;

      o. *functie:* het samenstel van werkzaamheden door de ambtenaar in zijn ambt te verrichten krachtens en
      overeenkomstig hetgeen hem door Onze Minister uitdrukkelijk of impliciet is opgedragen;

      p. *maximum-bezoldiging:* het bedrag behorende bij de hoogste bezoldigingstrede van een bezoldigingsschaal, waarvan
      de volgnummeraanduiding uitsluitend uit een getal bestaat;

      q. *levensfaseverlof:* levensfaseverlof, bedoeld in [artikel 37d][ref5];

      r. *Sectorale Overlegcommissie BES:* de Sectorale Overlegcommissie Bonaire, Sint Eustatius en Saba, genoemd in
      [artikel 2.1, eerste lid, van het Besluit overlegstelsel BES][ref6].

      2 In dit besluit wordt onder weduwe of weduwnaar mede verstaan de achtergebleven levenspartner met wie de overleden
      niet gehuwde ambtenaar een gemeenschappelijke huishouding voerde. Slechts één persoon kan als levenspartner worden
      aangemerkt.


