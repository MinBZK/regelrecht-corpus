  - number: '76'
    text: |-
      1 De ambtenaar van politie is gehouden zijn ambtsverplichtingen nauwgezet en ijverig te vervullen en zich overigens
      te gedragen zoals een goed ambtenaar van politie betaamt.

      2 Het is de ambtenaar van politie in ieder geval verboden:

      a. zich tijdens de voor hem geldende werktijd zonder geldige reden te verwijderen van de plaats waar hij zijn
      werkzaamheden moet verrichten;

      b. tijdens de voor hem geldende werktijd alcoholhoudende dranken te gebruiken of bij zich te hebben;

      c. in dienstlokalen,-voertuigen of -vaartuigen alcoholhoudende dranken te bewaren.

      3 De aspirant, de vrijwillige ambtenaar van politie, de ambtenaar aangesteld voor de uitvoering van de politietaak,
      en de ambtenaar aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste van de
      politie die opsporingsbevoegdheid bezit, kunnen zich niet beroepen op de omstandigheid dat zij niet in dienst zijn
      in die gevallen waarin hun optreden redelijkerwijze is vereist.

      4 De ambtenaar van politie dient de door Onze Minister vastgestelde voorschriften stipt en nauwgezet na te leven.

      5 Ter zake van de niet-naleving van wettelijke en andere voorschriften die redelijkerwijs niet geacht kunnen worden
      aan de ambtenaar van politie bekend te zijn, worden hem geen voordelen onthouden of nadelen toegebracht.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel76
  - number: '77'
    text: |-
      1 De ambtenaar van politie is verplicht tot geheimhouding van hetgeen hem in zijn ambt ter kennis is gekomen voor
      zover die verplichting uit de aard der zaak volgt of hem uitdrukkelijk door Onze Minister is opgelegd.

      2 De in het eerste lid bedoelde verplichting geldt niet tegenover hen aan wie de ambtenaar van politie onmiddellijk
      of middellijk ondergeschikt is, noch in zoverre hij door Onze Minister van die verplichting is ontheven.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel77
  - number: '78'
    text: |-
      1 De verstrekking van uniform- en dienstkleding en onderscheidingstekens aan de aspirant, de vrijwillige ambtenaar
      van politie, de ambtenaar aangesteld voor de uitvoering van de politietaak, en de ambtenaar aangesteld voor de
      uitvoering van technische, administratieve en andere taken ten dienste van de politie, die door Onze Minister is
      aangewezen, alsmede het onderhoud daarvan geschieden door de zorg van Onze Minister en voor rekening van de staat.
      Onze Minister kan nadere regels stellen met betrekking tot de verstrekking en het onderhoud.

      2 De ambtenaar van politie, bedoeld in het eerste lid, is verplicht de uniform- en dienstkleding en de
      onderscheidingstekens te dragen voor zover dat van dienstwege is voorgeschreven.

      3 Het buiten dienst gekleed gaan in uniform is geoorloofd behalve:

      a. tijdens het vervullen van een nevenbetrekking of bij het verrichten van werkzaamheden ten behoeve van derden,
      in welke vorm dan ook. Van dit verbod kan alleen ten aanzien van uit de openbare kas bezoldigde ambten ontheffing
      worden verleend door Onze Minister;

      b. bij betogingen, optochten en openbare politieke vergaderingen, tenzij daarvoor toestemming is verleend door
      Onze Minister;

      c. in andere door Onze Minister te bepalen zeer bijzondere gevallen.

      4 Het is de ambtenaar van politie verboden in dienst uniformkledingstukken te dragen tenzij die van dienstwege zijn
      verstrekt of voorgeschreven.

      5 Het is de ambtenaar van politie verboden bij het gekleed gaan in uniform insignes of andere onderscheidingstekens
      te dragen, tenzij die van dienstwege zijn verstrekt of voorgeschreven dan wel tot het dragen daarvan door Onze
      Minister toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel78
  - number: '79'
    text: |-
      De ambtenaar van politie die verhinderd is dienst te verrichten, geeft daarvan onverwijld kennis aan zijn hoofd
      van dienst.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel79
  - number: '80'
    text: |-
      1 De ambtenaar van politie, anders dan de aspirant en de vrijwillige ambtenaar van politie, is verplicht te gaan
      of blijven wonen in het openbaar lichaam waar hij geplaatst wordt, behoudens een hem door Onze Minister verleende
      ontheffing.

      2 De ambtenaar van politie is gehouden om zo spoedig mogelijk, maar uiterlijk 6 maanden na zijn plaatsing in het
      openbaar lichaam, gevolg te geven aan de in het eerste lid bedoeld verplichting.

      3 De ambtenaar van politie, anders dan de aspirant en de vrijwillige ambtenaar van politie, is verplicht indien hem
      door Onze Minister een dienstwoning is aangewezen, deze te betrekken en zich ter zake van de bewoning te gedragen
      conform de voorschriften die daaromtrent zijn gesteld. Hij draagt de onderhoudskosten die volgens wettelijk
      voorschrift of plaatselijk gebruik normaliter voor rekening van de huurder zijn, tenzij Onze Minister daarvan
      geheel of gedeeltelijk ontheffing heeft verleend.

      4 De ambtenaar van politie die een dienstwoning bewoont, onthoudt zich van het uitsteken of hijsen van andere
      vlaggen dan die van het Koninkrijk, of het openbaar lichaam. Uit het uiterlijk aanzien van de dienstwoning en het
      bijbehorende erf mag niet blijken van een politieke gezindheid.

      5 De aspirant geniet huisvesting en voeding van rijkswege, tenzij Onze Minister daarvan ontheffing heeft verleend.

      6 Door Onze Minister kunnen regels worden gesteld omtrent een door de aspirant te betalen vergoeding voor de
      huisvesting en voeding van rijkswege, bedoeld in het vijfde lid.

      7 Onze Minister kan een dienstwoning die de staat in eigendom heeft of van derden huurt ten behoeve van de dienst,
      ter beschikking stellen aan een ambtenaar van politie tegen betaling van de huurprijs.

      8 De huurprijs, bedoeld in het zevende lid, wordt bepaald op 16 procent van het inkomen van de ambtenaar
      van politie met als maximumgrondslag voor de berekening hiervan de aanvangsbezoldiging van schaal 10
      van het [Bezoldigingsbesluit 1998 BES][ref1] respectievelijk van schaal 7 van de regeling, bedoeld in
      [artikel 1, onder j][ref2], van dit besluit. Onder inkomen als bedoeld in de eerste volzin wordt verstaan de
      jaarlijkse of maandelijkse bezoldiging, verhoogd met een eventuele persoonlijke toelage, kostwinnerstoelage,
      kindertoelage en standplaatstoelage. In het geval van twee of meer bezoldigde betrekkingen, wordt de som van de
      inkomens verbonden aan deze betrekkingen als inkomen aangemerkt.

      9 De huurprijs, bedoeld in het zevende lid, wordt maandelijks voldaan door middel van inhouding daarvan op de
      bezoldiging van de ambtenaar van politie.


      [ref1]: https://wetten.overheid.nl/BWBR0028491
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel1
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel80
    references:
