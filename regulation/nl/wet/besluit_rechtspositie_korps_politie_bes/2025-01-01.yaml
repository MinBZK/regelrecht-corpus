  - number: '25'
    text: |-
      1 Met inachtneming van de door Onze Minister vastgestelde regels wordt de ambtenaar van politie die een verzoek
      daartoe indient dan wel ten aanzien van wie dit door Onze Minister nodig wordt geoordeeld, beoordeeld over de wijze
      waarop hij zijn functie uitoefent en over zijn gedragingen tijdens de uitoefening van die functie.

      2 Aan het verzoek van de ambtenaar van politie om overeenkomstig het eerste lid te worden beoordeeld, wordt
      niet eerder voldaan dan na het verstrijken van zes maanden sedert de vaststelling van de voorafgaande over hem
      uitgebrachte beoordeling.

      3 Er worden toekomstverwachtingen gemaakt over de ambtenaar van politie die in beschouwing wordt genomen voor een
      naar verwachting binnen afzienbare tijd vrijkomende hogere functie bij het korps.

      4 Ook kunnen toekomstverwachtingen worden opgemaakt over een ambtenaar van politie die in de nabije toekomst
      om plaatsing op een andere niet hogere functie binnen het korps vraagt, mits de mogelijkheid tot een dergelijke
      plaatsing reëel aanwezig is en het hoofd van dienst instemt met de wens van betrokkene, of ten aanzien van wie een
      dergelijke plaatsing door Onze Minister wenselijk wordt geacht.

      5 Onder toekomstverwachtingen wordt in dit artikel verstaan: een systematische bezinning op de behoefte en
      potentiële capaciteiten van de ambtenaar van politie, bekeken in het kader van de mogelijkheden binnen het korps,
      waar hij is geplaatst, welke bezinning uitmondt in concrete afspraken alsmede in het daarop tijdig ondernemen van
      actie.

      6 De ambtenaar van politie wordt van de inhoud van de over hem opgemaakte beoordeling, bedoeld in het eerste
      lid, en van de over hem opgemaakte toekomstverwachtingen, bedoeld in de derde tot en met vijfde lid, zo spoedig
      mogelijk in kennis gesteld nadat deze door Onze Minister bekrachtigd zijn. Hij ontvangt een afschrift daarvan. Hij
      ondertekent het document voor kennisgeving van de inhoud en ontvangst ervan.

      7 De ambtenaar van politie kan binnen zes weken na ontvangst van het document bij Onze Minister een met redenen
      omkleed bezwaarschrift indienen tegen een voor hem opgemaakte beoordeling of toekomstverwachtingen en vragen om een
      heroverweging. De heroverweging geschiedt zo spoedig mogelijk.

      8 Dit artikel is niet van toepassing op de aspirant.

      9 Onze Minister kan ter uitvoering van dit artikel nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel25
  - number: '26'
    text: |-
      1 Het bevoegd gezag stelt de werktijden vast voor de vrijwillige ambtenaar aangesteld voor de uitvoering van de
      politietaak.

      2 Onze Minister kan ter uitvoering van dit artikel nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel26
  - number: '27'
    text: |-
      De ambtenaar van politie, anders dan de aspirant, die daartoe de wens te kennen geeft, kan in deeltijd gaan werken
      tenzij daar naar het oordeel van Onze Minister ernstige bezwaren voor de bedrijfsvoering uit voortvloeien.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel27
  - number: '28'
    text: |-
      Het [Besluit vakantie en vrijstelling van dienst ambtenaren BES][ref1] is niet van toepassing op de ambtenaar van
      politie.


      [ref1]: https://wetten.overheid.nl/BWBR0028606
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028606
  - number: 28a
    text: |-
      Voor zover de ambtenaar van politie ten aanzien van wie een dienstrooster als bedoeld in
      [artikel 37 van het Rechtspositiebesluit ambtenaren BES][ref1] is vastgesteld, vakantie is verleend op een tijd
      waarop hij volgens het dienstrooster niet gehouden is werkzaamheden te verrichten, maar wel op de werkplaats
      beschikbaar moet zijn, wordt slechts de helft van die tijd als genoten vakantie-uren aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel37
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '37'
  - number: '29'
    text: |-
      1 Aan de aspirant wordt door Onze Minister vakantie met behoud van bezoldiging verleend met inachtneming van deze
      paragraaf.

      2 De vakantie wordt als volgt verleend:

      a. vier aaneengesloten werkdagen onmiddellijk aansluitend aan de tweede Paasdag;

      b. een aaneengesloten periode vallend in het tijdvak waarin voor inrichtingen waar van overheidswege openbaar
      onderwijs wordt gegeven, de zomervakantie is of zal worden vastgesteld;

      c. vijf werkdagen rond Kerstmis en Nieuwjaarsdag.

      3 Door Onze Minister worden elk jaar in de maand januari de vakantieperiodes vastgesteld met inachtneming van het
      tweede lid.

      4 Wegens dringende reden van dienstbelang kan door Onze Minister worden bepaald dat de vakantie over een of meer
      periodes bedoeld in het tweede lid, geheel of gedeeltelijk niet wordt genoten dan wel wordt ingetrokken.

      5 Een vakantie die of een gedeelte van een vakantie dat ingevolge het vierde lid niet is genoten dan wel is
      ingetrokken, wordt zo spoedig mogelijk alsnog verleend nadat de reden die daartoe heeft geleid, heeft opgehouden
      te bestaan.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel29
  - number: '30'
    text: |-
      1 Indien de aspirant tijdens een verleende vakantie blijkens een geneeskundige verklaring gedurende een of meer
      werkuren arbeidsongeschikt is geweest, wordt het aantal vakantieuren dat overeenkomt met het aantal werkuren
      gedurende welke hij arbeidsongeschikt is geweest, beschouwd niet als vakantie te zijn genoten en wordt hem
      vrijstelling van dienst, bedoeld in [artikel 44, eerste lid, onder b][ref1], verleend.

      2 De aspirant kan de niet genoten vakantieuren bedoeld in het eerste lid, niet opnemen zolang hij geplaatst is op
      het opleidingsinstituut. De [artikelen 41][ref2] en [42][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0028767#Artikel42
