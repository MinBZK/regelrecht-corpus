    text: |-
      De [hoofdstukken II][ref1] en [III van het Rechtspositiebesluit ambtenaren BES][ref2] zijn niet
      van toepassing op de ambtenaar van politie, met dien verstande, dat het bepaalde bij of krachtens
      [artikel 10 van het Rechtspositiebesluit ambtenaren BES][ref3] inzake bevordering wel van toepassing is op de
      ambtenaar aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste van de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#HoofdstukII
