    text: |-
      1 De straf, behalve die van schriftelijke berisping, wordt niet ten uitvoer gelegd zolang zij niet onherroepelijk
      is geworden, tenzij bij de strafoplegging is bepaald dat deze onmiddellijk ten uitvoer wordt gelegd.

      2 Indien tot onmiddellijke tenuitvoerlegging van de straf van buitengewone dienst is overgegaan en deze straf na
      ingesteld beroep niet wordt gehandhaafd, wordt de tijd gedurende welke buitengewone dienst is verricht, aangemerkt
      als diensttijd gedurende welke werkzaamheden na de voor de betrokken ambtenaar van politie geldende werktijd zijn
      verricht, en wordt conform de geldende voorschriften een vergoeding voor overwerk toegekend.
