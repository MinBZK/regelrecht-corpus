        artikel: 8f
        hoofdstuk: II
        paragraaf: '3'
  - number: 8h
    text: |-
      Niet tot aanstelling bij een politiekorps kan worden overgegaan indien:

      a. de betrokkene die aan het taalvaardigheidsonderzoek is onderworpen de bij regeling van Onze Minister te bepalen
      minimumnorm niet heeft behaald;

      b. de betrokkene niet het bij regeling van Onze minister te bepalen minimale vereiste niveau op een of meer van de
      stabiele persoonlijkheidseigenschappen heeft behaald;

      c. de betrokkene voor het fysiek motorisch onderzoek niet voldoet aan de bij regeling van Onze Minister te bepalen
      minimale vereisten; of

      d. de betrokkene niet voldoet aan de bij regeling van Onze Minister gestelde eisen met betrekking tot de onderdelen
      van de onderzoeken waar sprake is van een open normering.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel8h
  - number: 8i
    text: |-
      1 Nadat alle overige beoordelingen van de geschiktheid van de betrokkene hebben plaatsgevonden en Onze Minister
      op grond daarvan voornemens is de betrokkene aan te stellen, wordt de betrokkene onderworpen aan een geneeskundig
      onderzoek.

      2 Het geneeskundig onderzoek kan steeds worden verricht voorafgaand aan een onderzoek als bedoeld in
      [artikel 8l][ref1] of [artikel 8o][ref2].

      3 Het geneeskundig onderzoek geschiedt door een door Onze Minister aangewezen geneeskundige, niet zijnde de
      behandelend arts van de betrokkene, met inachtneming van de nader bij regeling van Onze minister te bepalen
      richtlijnen.

      4 De uitslag van het geneeskundig onderzoek wordt de betrokkene zo spoedig mogelijk medegedeeld.

      5 De kosten van het geneeskundig onderzoek komen ten laste van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel8l
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel8o
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel8i
