      De betrokkene die op grond van [artikel 8, eerste lid, onder g, of tweede lid][ref1], [artikel 8a, onder d][ref2],
      of [artikel 8b, onder d][ref3], is onderworpen aan een geneeskundige keuring, wordt bij aanstelling in een andere
