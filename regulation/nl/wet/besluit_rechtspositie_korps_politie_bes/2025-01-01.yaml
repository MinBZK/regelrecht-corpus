        bwb_id: BWBR0028767
        artikel: '55'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '53'
    text: |-
      Tenzij dringende redenen van dienstbelang zich daar tegen verzetten, wordt de ambtenaar van politie buitengewoon
      verlof met behoud van volle bezoldiging verleend:

      a. voor het afleggen van een examen voor het behalen van een diploma dat voor de uitoefening van zijn functie van
      belang kan worden geacht;

      b. voor het zitting nemen in examencommissies op politiegebied: voor ten hoogste tien werkdagen per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel53
  - number: '54'
    text: |-
      1 De ambtenaar van politie die zorg draagt voor een persoon genoemd in het vierde lid, heeft aanspraak op
      buitengewoon verlof wegens calamiteiten met behoud van volle bezoldiging.

      2 Onder calamiteit wordt verstaan ziekte of een andere onverwachte gebeurtenis waardoor een noodsituatie ontstaat
      in de verzorging van een in het vierde lid genoemde persoon.

      3 Het verlof is bedoeld voor de eerste opvang en het treffen van verdere voorzieningen en bedraagt maximaal 8
      werkuren per calamiteit voor maximaal 3 calamiteiten per kalenderjaar.

      4 De personen voor wier verzorging het buitengewoon verlof kan worden verleend zijn: de echtgenote, ouders,
      stiefouders, pleegouders, schoonouders, kinderen, stiefkinderen, pleegkinderen en aangehuwde kinderen van de
      ambtenaar van politie.

      5 De ambtenaar van politie informeert Onze Minister vooraf over het opnemen van het verlof onder opgave van de
      reden.

      6 Onze Minister kan verlangen dat de ambtenaar van politie achteraf aannemelijk maakt dat sprake was van een
      noodsituatie. Indien betrokkene daar naar het oordeel van Onze Minister niet in slaagt, worden de opgenomen uren in
      mindering gebracht op zijn vakantie-uren.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel54
  - number: '55'
    text: |-
      1 Buitengewoon verlof van korte duur kan verder voor ten hoogste 522 werkuren per kalenderjaar worden verleend,
      indien Onze Minister van oordeel is dat daartoe aanleiding bestaat.

      2 Tijdens dit buitengewoon verlof heeft de ambtenaar van politie aanspraak op volle bezoldiging gedurende de eerste
      174 werkuren en op vijftig procent van zijn volle bezoldiging gedurende de overige werkuren.

      3 Het buitengewoon verlof kan voor zover dat is verleend voor meer dan 174 werkuren, indien dringende redenen van
      dienstbelang dat vorderen, door Onze Minister worden ingekort tot minimaal 174 werkuren.

      4 Indien de ambtenaar van politie schade lijdt door de inkorting wordt de geldelijke schade hem ten laste van de
      staat vergoed.

      5 Onze Minister kan nadere regels stellen omtrent de gevallen waarin het eerste lid toegepast kan worden.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel55
  - number: '56'
    text: |-
      De ambtenaar van politie die als militair in werkelijke dienst is, anders dan voor herhalingsoefening, is van
      rechtswege met buitengewoon verlof van lange duur zonder behoud van bezoldiging, tenzij Onze Minister anders
      bepaalt.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel56
  - number: '57'
    text: |-
      1 Aan de ambtenaar van politie, anders dan de aspirant, kan op zijn verzoek, met inachtneming van deze paragraaf,
      al dan niet onder bepaalde voorwaarden buitengewoon verlof van lange duur worden verleend.

      2 Het buitengewoon verlof gaat niet in dan nadat betrokkene het verlof met de daaraan verbonden voorwaarden heeft
      aanvaard.

      3 Het buitengewoon verlof kan voor zover dat is verleend voor meer dan 522 werkuren, indien dringende redenen van
      dienstbelang dat vorderen, door Onze Minister worden ingekort tot minimaal 552 werkuren.

      4 Indien de ambtenaar van politie, bedoeld in het eerste lid, schade lijdt door de inkorting wordt de geldelijke
      schade hem ten laste van de staat vergoed.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel57
  - number: '58'
    text: |-
      1 Indien het verlof, bedoeld in [artikel 57][ref1], uitsluitend strekt tot het persoonlijk belang van de ambtenaar
      van politie, kan dit slechts worden verleend zonder behoud van bezoldiging en voor ten hoogste zes maanden.

      2 Indien het verlof, bedoeld in [artikel 57][ref2], ten doel heeft de ambtenaar van politie in de gelegenheid te
      stellen een andere functie buiten de politiedienst te gaan vervullen en met de verlofverlening niet alleen het
      persoonlijk belang van betrokkene maar ook het algemeen belang wordt gediend, kan dit worden verleend zonder behoud
      van bezoldiging en voor ten hoogste een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel57
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel58
