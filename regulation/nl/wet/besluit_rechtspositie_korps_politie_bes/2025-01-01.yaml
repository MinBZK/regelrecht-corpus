  - number: '17'
    text: |-
      Indien de ambtenaar aangesteld voor de uitvoering van de politietaak, anders dan bij wijze van disciplinaire straf,
      bedoeld in hoofdstuk IX, wordt belast met een andere functie, als gevolg waarvan zijn bezoldiging op grond van
      de overige bepalingen van dit besluit een verlaging zou moeten ondergaan, zonder dat de bekleding met die andere
      functie bij wijze van waarneming, bedoeld in [artikel 22][ref1], geschiedt of zonder dat ontslag voorafgegaan is,
      blijft deze verlaging achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel22
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel17
