  - number: 74d
    text: |-
      1 Indien een vrijwillige ambtenaar aangesteld voor de uitvoering van de politietaak ten gevolge van een ongeval
      in verband met de vervulling van zijn functie komt te overlijden, hebben zijn weduwe of weduwnaar aanspraak op een
      uitkering overeenkomstig de bepalingen van de ongevallenverzekering, bedoeld in [artikel 74a, eerste lid][ref1].

      2 [Artikel 14, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel74a
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel14
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel74d
