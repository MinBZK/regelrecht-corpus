  - number: '39'
    text: |-
      1 Indien de toestemming tot het opnemen van vakantie-uren geheel of gedeeltelijk is geweigerd of ingetrokken,
      behoudt de ambtenaar van politie zijn aanspraak op de niet-genoten vakantie-uren. Weigering of intrekking van de
      toestemming tot het opnemen van vakantie-uren kan tot maximaal 12 maanden uitstel daarvan leiden.

      2 Behalve in het geval dat de aanstelling wegens ontslag eindigt, kan de ambtenaar van politie in een kalenderjaar
      nooit meer vakantie worden verleend dan tweemaal het hem ingevolge [artikel 33][ref1] toekomende aantal vakantie-
      uren.

      3 In geval van intrekking van de toestemming tot het opnemen van vakantie-uren worden de vakantie-uren op een dag
      waarop de ambtenaar van politie deze uren als gevolg van de intrekking slechts gedeeltelijk heeft genoten, niet als
      vakantie-uren aangemerkt.

      4 Indien de ambtenaar van politie als gevolg van een intrekking geldelijke schade lijdt, wordt die schade hem
      vergoed ten laste van de staat.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel33
