  - number: 123b
    text: |-
      1 De personen die op het tijdstip van inwerkingtreding van de [Veiligheidswet BES][ref1] worden aangesteld
      als ambtenaar van politie en in de week voorafgaand aan dat tijdstip ten overstaan van de gezaghebber van het
      eilandgebied Bonaire, Sint Eustatius of Saba de eed dan wel verklaring en belofte van zuivering alsmede de daarop
      volgende eed of belofte, zoals geformuleerd in [artikel 10, eerste en tweede lid][ref2], hebben afgelegd, worden
      geacht bij de aanvaarding van hun ambt de vereiste eed dan wel verklaring en belofte van zuivering alsmede de
      daarop volgende eed of belofte, bedoeld in artikel 10, eerste of tweede lid, te hebben afgelegd.

      2 De personen die op het tijdstip van inwerkingtreding van de [Veiligheidswet BES][ref3] worden aangesteld als
      ambtenaar van politie en in de week voorafgaand aan deze inwerkingtreding niet de in het eerste lid bedoelde de
      eed dan wel verklaring en belofte van zuivering alsmede de daarop volgende eed of belofte, zoals geformuleerd in
      [artikel 10, eerste en tweede lid][ref4], hebben afgelegd, worden gedurende twee maanden na inwerkingtreding van
      dit besluit geacht bij de aanvaarding van hun ambt de vereiste eed dan wel verklaring en belofte van zuivering
      alsmede de daarop volgende eed of belofte, bedoeld in artikel 10, eerste of tweede lid, te hebben afgelegd.

      3 De ambtenaren van politie, bedoeld in het tweede lid, leggen de eed dan wel verklaring en belofte van zuivering
      alsmede de daarop volgende eed of belofte, bedoeld in [artikel 10, eerste of tweede lid][ref5], zo spoedig
      mogelijk, doch uiterlijk binnen twee maanden na inwerkingtreding van dit besluit alsnog af.


