        hoofdstuk: III
  - number: '121'
    text: |-
      1 Onze Minister deelt de ambtenaar aangesteld voor de uitvoering van de politietaak, de vrijwillige ambtenaar
      van politie en aspirant, zijn beslissing op het bezwaar zo spoedig mogelijk, doch uiterlijk binnen een maand na
      de ontvangst van het bezwaarschrift, dan wel, indien een hoorzitting heeft plaatsgevonden, na de datum van die
      hoorzitting, mede. Het tijdvak van een maand kan door Onze Minister bij gemotiveerde beschikking éénmaal met ten
      hoogste een maand worden verlengd

      2 De mededeling omtrent de beslissing op het bezwaar bevat de overwegingen waarop deze steunt en, indien het
      bezwaar geheel of gedeeltelijk gegrond is gebleken, de wijziging van de oorspronkelijke beslissing of weigering
      waartoe de heroverweging Onze Minister aanleiding heeft gegeven.

      3 De beslissing op het bezwaar is een beschikking als bedoeld in
      [artikel 3, eerste lid, van de Wet ambtenarenrechtspraak 1951 BES][ref1]. Indien met deze beslissing niet of
      niet geheel aan het bezwaar tegemoet wordt gekomen, wordt in de mededeling, bedoeld in het tweede lid, tevens
      aangegeven, dat bij het gerecht in ambtenarenzaken in beroep kan worden gekomen en de termijn waarbinnen dat dient
      te geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0028616#Artikel3
