  - number: '14'
    text: |-
      1 De bezoldiging en een met die bezoldiging verbonden vergoeding of toelage worden maandelijks of tegen het einde
      van de kalendermaand waarop de betaling betrekking heeft, betaald door de staat.

      2 Wanneer de bezoldiging en een met die bezoldiging verbonden vergoeding of toelage moet worden uitbetaald over een
      gedeelte van een kalendermaand, wordt het te betalen bedrag berekend door het voor een maand vastgestelde bedrag te
      vermenigvuldigen met het aantal dagen gedurende welke de ambtenaar aangesteld voor de uitvoering van de politietaak
      en de aspirant, in dienst zijn geweest en het product te delen door dertig.

      3 Van het eerste en tweede lid kan worden afgeweken, indien daartoe naar het oordeel van Onze Minister op grond van
      bijzondere omstandigheden aanleiding bestaat.

      4 Zo spoedig mogelijk na het overlijden van de ambtenaar aangesteld voor de uitvoering van de politietaak of
      de aspirant betaalt Onze Minister aan de weduwe of weduwnaar een som uit gelijk aan driemaal het bedrag van de
      inkomsten per maand, op het tijdstip van het overlijden van betrokkene.

      5 Indien de overleden ambtenaar aangesteld voor de uitvoering van de politietaak of de aspirant niet in actieve
      dienst is, wordt een som uitbetaald gelijk aan driemaal hetgeen hij als inkomsten per maand zou hebben ontvangen,
      indien hij op de eerste van maand van het overlijden in actieve dienst was geweest.

      6 Indien de overleden ambtenaar aangesteld voor de uitvoering van de politietaak of de aspirant geen weduwe of
      weduwnaar nalaat, geschiedt de uitbetaling ten behoeve van de minderjarige kinderen. Onder kinderen worden in
      dit lid verstaan natuurlijke kinderen en kinderen waarover de overledene de pleegouderlijke zorg droeg. Onder
      pleegouderlijke zorg wordt in dit lid verstaan de zorg voor het onderhoud en de opvoeding van een kind als was
      het een eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van een vergoeding daarvoor.
      Ontbreken ook kinderen, dan geschiedt de betaling van de vakantie-uitkering aan degenen die geheel of grotendeels
      afhankelijk waren van de bezoldiging van de overledene. Laat de overledene ook geen betrekkingen na als bedoeld in
      de vorige volzin, dan wordt de vakantie-uitkering geheel of ten dele aangewend voor de betaling van de kosten van
      de laatste ziekte en van de lijkbezorging, voor zover de nalatenschap van de overledene voor de betaling van die
      kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel14
  - number: '15'
    text: |-
      1 Bij de indiensttreding of de overgang naar een andere functie wordt de bezoldigingsschaal bepaald met
      inachtneming van de aard en het niveau van de functie waarmede de betrokken ambtenaar aangesteld voor de uitvoering
      van de politietaak of de aspirant wordt belast.

      2 Van het eerste lid kan worden afgeweken, indien het niet voldoen aan de opleidingseisen of gebrek aan ervaring
      met betrekking tot de arbeid die betrokkene in de functie moet verrichten, de verwachting aannemelijk maakt dat
      zijn wijze van functioneren zich tegen de toepassing van dat artikellid vooralsnog verzet. In dat geval kan de
      bezoldigingsschaal bepaald worden en gedurende een tijdvak van ten hoogste drie jaren bepaald blijven op ten
      hoogste twee volgnummers beneden de schaal die met toepassing van het eerste lid in aanmerking zou komen. Indien
      het functioneren van de ambtenaar aangesteld voor de uitvoering van de politietaak, aan het einde van het genoemde
      tijdvak de toepassing van het eerste lid nog niet toelaat, wordt hij geplaatst in een functie waarvan de aard en
      het niveau in overeenstemming is met de schaal volgens welke hij bezoldigd wordt, of wordt hem ontslag aangezegd.

      3 Aard en niveau van de functie worden bepaald aan de hand van functiebeschrijvingen en functieniveau-
      karakteristieken, welke deel uitmaken van een bij ministeriële regeling vast te stellen functiewaarderingssysteem.

      4 Anders dan bij wijze van disciplinaire straf, bedoeld in [hoofdstuk IX][ref1], kan zonder voorafgaand ontslag
      voor een ambtenaar aangesteld voor de uitvoering van de politietaak, geen bezoldigingsschaal worden vastgesteld die
      een lagere maximum-bezoldiging bevat dan die welke in de voordien voor hem geldende bezoldigingsschaal aangegeven
      is.

      5 De ambtenaar aangesteld voor de uitvoering van de politietaak die tot 10 oktober 2010 in dienst was bij het Korps
      Sint Maarten, Sint Eustatius en Saba met als plaats van tewerkstelling Sint Eustatius of Saba of bij het Korps
      Bonaire, bekleed is met de rang van agent en een functie vervult die is gewaardeerd op bezoldigingsschaal 6, wordt
      bevorderd tot de rang van brigadier.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#HoofdstukIX
