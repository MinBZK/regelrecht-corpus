  - number: '20'
    text: |-
      De bezoldiging van de ambtenaar aangesteld voor de uitvoering van de politietaak, met een deelbetrekking wordt
      vastgesteld op een evenredig deel van de bezoldiging bij een volledige betrekking.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel20
  - number: '21'
    text: |-
      Ingeval de ambtenaar aangesteld voor de uitvoering van de politietaak, bevorderd wordt naar een functie waaraan
      een bezoldigingsschaal is verbonden die een hogere maximum-bezoldiging bevat dan die welke voorkomt in de schaal
      volgens welke hij tot dusver is bezoldigd, wordt hem de bezoldigingstrede in de nieuwe schaal toegekend waarvan het
      bedrag minstens even hoog is als het procentuele verschil tussen twee bezoldigingstreden in de oude schaal.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel21
  - number: '22'
    text: |-
      1 Indien de taakuitvoering continuïteit in de uitoefening van een functie veronderstelt en geen andere ambtenaar
      van politie voor de uitvoering van die taak is aangesteld, die deze geheel of gedeeltelijk kan waarnemen, dan
      wel indien het dienstbelang zulks vordert, wordt de daarvoor in aanmerking komende ambtenaar aangesteld voor de
      uitvoering van de politietaak, door Onze Minister met de tijdelijke waarneming van die functie belast, al dan niet
      met ontheffing uit zijn eigenlijke functie.

      2 De ambtenaar aangesteld voor de uitvoering van de politietaak, die overeenkomstig het eerste lid is belast met
      de tijdelijke waarneming van een functie, die in belangrijkheid en verantwoordelijkheid aanmerkelijk uitgaat boven
      de eigenlijke functie van deze ambtenaar, heeft over de tijd van de waarneming aanspraak op toekenning door Onze
      Minister van een toelage boven zijn eigen bezoldiging ten bedrage van het verschil tussen de bezoldiging, welke
      hij zou genieten, ware hij definitief benoemd in de functie die hij waarneemt, en zijn eigen bezoldiging, indien
      de waarneming:

      a. 30 dagen of langer onafgebroken heeft geduurd;

      b. in een tijdvak van zes maanden in totaal gedurende 30 dagen of langer heeft geduurd;

      c. in een tijdvak van twaalf maanden in totaal 60 dagen of langer heeft geduurd.

      3 Tijdens de waarneming worden de ambtenaar aangesteld voor de uitvoering van de politietaak, de hem in zijn
      eigenlijke functie toekomende bezoldigingstreden toegekend, onder verrekening van de in het tweede lid bedoelde
      toelage, terwijl deze toelage opnieuw wordt bepaald, telkens wanneer hij in de functie die hij waarneemt, aanspraak
      zou hebben verkregen op een verhoging van bezoldiging, ware hij definitief in dat ambt aangesteld.

      4 Indien uit de waarneming, bedoeld in het eerste lid, voor de ambtenaar aangesteld voor de uitvoering van de
      politietaak, als zodanig direct aanwijsbare en op geld waardeerbare schade voortvloeit, wordt hem de geleden schade
      door Onze Minister vergoed.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel22
  - number: '23'
    text: |-
      1 Aan de ambtenaar aangesteld voor de uitvoering van de politietaak die uit hoofde van zijn functie onvermijdelijk
      arbeid wordt opgedragen, wordt buiten het voor hem ingevolge [artikel 26][ref1] vastgesteld dienstrooster op
      een week- of zaterdag, wordt een vergoeding als bedoeld in de bijlage, onder I, toegekend voor elk door hem op
      werkdagen gewerkt vol uur.

      2 Aan de ambtenaar aangesteld voor de uitvoering van de politietaak die uit hoofd van zijn functie onvermijdelijk
      arbeid wordt opgedragen buiten het voor hem ingevolge [artikel 26][ref2] vastgestelde dienstrooster op een zon-,
      feest of roostervrije dag, wordt een vergoeding als bedoeld in de bijlage, onder II, toegekend voor elk door hem
      gewerk vol uur.

      3 Aan de ambtenaar aangesteld voor de uitvoering van de politietaak die uit hoofde van zijn functie onvermijdelijk
      arbeid wordt opgedragen buiten het voor hem ingevolge [artikel 26][ref3] vastgestelde dienstrooster in verband met
      buitengewone omstandigheden of calamiteiten, wordt een vergoeding als bedoeld in de bijlage, onder III, toegekend
      voor elk door hem gewerkt vol uur.

      4 Voor de toepassing van het eerste tot en met derde lid wordt een gewerkte tijd van dertig minuten of meer, doch
      korter dan een uur, als een vol uur aangemerkt.

      5 Aan de ambtenaar, bedoeld in het eerste, tweede en derde lid, kan op zijn verzoek in plaats van een vergoeding
      in geld, wanneer het dienstbelang zulks toelaat, een vergoeding in vrije tijd worden toegekend, berekend naar de
      gemaakte overuren en bepaald op:

      a. 150 procent, indien het een dienstuitoefening betreft op weekdagen en zaterdagen, en

      b. 200 procent, indien het een dienstuitoefening betreft op zon- roostervrije en feestdagen dan wel in verband met
      buitengewone omstandigheden of calamiteiten.

      6 Het eerste, tweede en derde lid zijn niet van toepassing op de ambtenaar aangesteld voor de uitvoering van de
      politietaak, die een functie bekleedt in de rang van inspecteur of hoger.

      7 Aan de ambtenaar aangesteld voor de uitvoering van de politietaak die een functie bekleedt in de rang van
      inspecteur of hoger en die uit hoofde van zijn functie onvermijdelijke arbeid wordt opgedragen buiten het voor hem
      ingevolge [artikel 26][ref4] vastgestelde dienstrooster, wordt een vergoeding in vrije tijd toegekend berekend naar
      de gemaakte uren en overuren en bepaald op:

      a. 100 procent, indien het een dienstuitoefening betreft wegens verschuiving van dienst binnen twee maal 24 uur van
      de oorspronkelijk voorgeschreven dienst;

      b. 150 procent, indien het een dienstuitoefening betreft op week- en zaterdagen, en

      c. 200 procent, indien het een dienstuitoefening betreft op roostervrije- zon- en feestdagen of arbeid opgedragen
      buiten het voor hem ingevolge [artikel 26][ref5] vastgestelde dienstrooster in verband met buitengewone
      omstandigheden of calamiteiten.

      8 De vergoeding in vrije tijd als bedoeld in het zevende lid wordt genoten in dezelfde kalendermaand waarin de
      arbeid werd opgedragen dan wel in de daarop volgende kalendermaand.

      9 Indien geen vrije tijd als bedoeld in het zevende lid kan worden toegekend, ontvangt de ambtenaar een vergoeding
      overeenkomende met zijn uurloon voor arbeid opgedragen ingevolge het dienstrooster.

      10 Het eerste tot en met derde lid is van overeenkomstige toepassing op de aspirant.


