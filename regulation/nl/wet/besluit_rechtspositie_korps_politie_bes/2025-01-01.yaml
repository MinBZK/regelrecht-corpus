  - number: '72'
    text: |-
      1 De vrouwelijke ambtenaar van politie heeft in verband met haar bevalling recht op zwangerschaps- en
      bevallingsverlof met doorbetaling van het volle inkomen.

      2 Het recht op het zwangerschapsverlof bestaat vanaf zes weken voor de dag na de vermoedelijke datum van bevalling,
      zoals aangegeven in een schriftelijke verklaring van een arts of verloskundige, tot en met de dag van de bevalling.
      Het zwangerschapsverlof gaat in uiterlijk vier weken voor de dag na de vermoedelijke datum van bevalling.

      3 Het recht op bevallingsverlof gaat in op de dag na de dag van de bevalling en bedraagt tien aaneengesloten weken
      vermeerderd met het aantal dagen dat het zwangerschapsverlof tot en met de vermoedelijke datum van bevalling, dan
      wel, indien eerder gelegen, tot en met de werkelijke datum van bevalling, minder dan zes weken heeft bedragen.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel72
  - number: '73'
    text: |-
      Aan de vrouwelijke ambtenaar van politie die een borstkind heeft, wordt op haar verzoek de gelegenheid gegeven om
      het kind te voeden.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel73
  - number: '74'
    text: |-
      1 In bijzondere gevallen kan de ambtenaar van politie door Onze Minister een tegemoetkoming worden verleend in de
      noodzakelijk voor zichzelf of zijn medebelanghebbenden gemaakte kosten die verband houden met ziekte of ongeval,
      indien hierin niet ingevolge een andere regeling wordt voorzien en deze kosten redelijkerwijze niet te zijnen laste
      horen te blijven.

      2 In geval van ziekte of ongeval die in overwegende mate zijn oorzaak vindt in de aard van de aan de ambtenaar van
      politie opgedragen werkzaamheden of in de bijzondere omstandigheden waaronder die moesten worden verricht, en die
      niet aan zijn schuld of onvoorzichtigheid te wijten is, worden hem vergoed de te zijnen laste blijvende, naar het
      oordeel van Onze Minister, noodzakelijk gemaakte kosten van geneeskundige behandeling of verzorging.

      3 Onze Minister kan ter uitvoering van dit artikel nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel74
  - number: 74a
    text: |-
      1 Onze Minister sluit ten behoeve van de vrijwillige ambtenaar aangesteld voor de uitvoering van de politietaak een
      ongevallenverzekering af.

      2 De verzekering, bedoeld in het eerste lid, bevat in elk geval de bepaling dat bij blijvende arbeidsongeschiktheid
      aanspraak op een uitkering ineens bestaat.

      3 Voor de toepassing van dit hoofdstuk wordt verstaan onder «ongeval» en «arbeidsongeschiktheid» hetgeen daaronder
      wordt verstaan in de door Onze Minister ter zake gesloten ongevallenverzekering.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel74a
  - number: 74b
    text: |-
      1 De vrijwillige ambtenaar aangesteld voor de uitvoering van de politietaak wordt bij aanstelling in kennis gesteld
      van de bepalingen van de door Onze Minister te zijnen behoeve gesloten ongevallenverzekering.

      2 Van wijzigingen in de in het eerste lid bedoelde bepalingen wordt de vrijwillige ambtenaar aangesteld voor de
      uitvoering van de politietaak voor de inwerkingtreding ervan in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel74b
  - number: 74c
    text: |-
      1 De vrijwillige ambtenaar aangesteld voor de uitvoering van de politietaak die arbeidsongeschikt is, heeft,
      indien deze ongeschiktheid blijkens een geneeskundig onderzoek het gevolg is van een ongeval in verband met de
      vervulling van zijn functie, aanspraak op een uitkering overeenkomstig de bepalingen van de verzekering, bedoeld in
      [artikel 74a, eerste lid][ref1].

      2 Hij heeft behoudens [artikel 74e][ref2] geen aanspraak op enige vergoeding ten laste van Onze Minister ter zake
      van een ongeval.

      3 Het eerste en tweede lid zijn ook van toepassing op de gewezen vrijwillige ambtenaar aangesteld voor de
      uitvoering van de politietaak tot het tijdstip, bedoeld in [artikel 118, eerste lid][ref3], indien hij blijvend
      arbeidsongeschikt is.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel74a
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel74e
      [ref3]: https://wetten.overheid.nl/BWBR0028767#Artikel118
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel74c
