  - number: 8o
    text: |-
      1 Aanstelling, plaatsing, of detachering in een vertrouwensfunctie, is slechts mogelijk, indien ten aanzien van de
      betrokkene op basis van een veiligheidsonderzoek door Onze Minister een verklaring is afgegeven dat uit het oogpunt
      van de nationale veiligheid geen bezwaar bestaat tegen vervulling van de vertrouwensfunctie.

      2 Onze Minister belast de betrokkene eerst met de vervulling van een vertrouwensfunctie, nadat ten aanzien van die
      betrokkene een verklaring als bedoeld in het eerste lid is afgegeven.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel8o
  - number: 8p
    text: |-
      1 Onze Minister meldt een ambtenaar die belast is met de vervulling van een functie die nadien als
      vertrouwensfunctie is aangewezen, zo spoedig mogelijk, doch uiterlijk binnen vier weken na dagtekening van het
      aanwijzingsbesluit aan bij het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst.

      2 De in het eerste lid bedoelde aanmelding geschiedt slechts met schriftelijke instemming van de betrokken
      ambtenaar. Onze Minister licht de betrokkene in over de betekenis en de rechtsgevolgen van deze aanmelding.

      3 Indien de in het tweede lid bedoelde instemming is geweigerd of indien ten aanzien van de ambtenaar een
      verklaring als bedoeld in [artikel 8o, eerste lid][ref1], is geweigerd, ontheft Onze Minister de ambtenaar zo
      spoedig mogelijk, doch uiterlijk binnen acht weken, uit de functie.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel8o
