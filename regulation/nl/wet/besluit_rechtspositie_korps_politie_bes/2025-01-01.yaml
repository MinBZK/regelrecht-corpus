  - number: '46'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel46
  - number: '47'
    text: |-
      1 Aan de ambtenaar van politie, met uitzondering van de vrijwillige ambtenaar van politie, wordt in de gevallen en
      onder de voorwaarden genoemd in dit hoofdstuk, buitengewoon verlof verleend door Onze Minister.

      2 Door Onze Minister kunnen nadere regels worden gesteld omtrent het aanvragen en verlenen van buitengewoon verlof.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel47
  - number: '48'
    text: |-
      Tenzij dringende redenen van dienstbelang zich daar tegen verzetten, wordt de ambtenaar van politie, voor zover dat
      niet in zijn vrije tijd kan geschieden en omzetting van de dienst niet mogelijk is, buitengewoon verlof verleend
      voor de uitoefening van het kiesrecht en voor het voldoen aan een wettelijke verplichting.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel48
  - number: '49'
    text: |-
      1 Aan de ambtenaar van politie die tot lid van een van de eilandsraden van de openbare lichamen is verkozen, wordt
      op zijn verzoek buitengewoon verlof, met behoud van vol inkomen, verleend voor het bijwonen van vergaderingen van
      de eilandsraad, alsmede het maken van reizen in of buiten de openbare lichamen in zijn hoedanigheid van lid van
      de eilandsraad.

      2 Het eerste lid is niet van toepassing op de ambtenaar die op non-actief is gesteld of tijdelijk is ontheven van
      de waarneming van zijn ambt of functie in verband met het lidmaatschap van de eilandsraad van een openbaar lichaam.

      3 Aan de ambtenaar van politie wordt op zijn verzoek buitengewoon verlof met behoud van volle bezoldiging verleend
      voor het bijwonen van vergaderingen van of het verrichten van werkzaamheden voor publiekrechtelijke college’s
      of commissies waarin hij is benoemd of waarvoor hij is aangewezen, voor zover dat niet in zijn vrije tijd kan
      geschieden.

      4 [Vervallen]
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel49
  - number: '50'
    text: |-
      1 Aan de ambtenaar van politie wordt vakbondsverlof met behoud van volle bezoldiging verleend, tenzij de
      desbetreffende vakbond niet is vertegenwoordigd in de Sectorale Overlegcommissie BES of de bedrijfsvoering door het
      verlof ernstig wordt verstoord.

      2 In totaal heeft de ambtenaar van politie ten hoogste 240 uur vakbondsverlof per jaar, of ten hoogste 320 uur per
      jaar als de ambtenaar van politie lid is van het bestuur, sectie of hoogste ledenorgaan van de vakbond.

      3 Het verlof, bedoeld in het eerste en tweede lid, wordt verleend voor de volgende activiteiten:

      a. als lid, bestuurslid of afgevaardigde van een vakbond: maximaal 8 uur per jaar voor deelname aan de algemene
      ledenvergadering of daarmee vergelijkbare bijeenkomsten van de vakbond;

      b. als lid, bestuurslid of afgevaardigde van een vakbond: maximaal 48 uur per twee jaar voor deelname aan cursussen
      waarvoor de ambtenaar van politie door een vakbond is uitgenodigd;

      c. als lid, bestuurslid of afgevaardigde van een vakbond: het uitvoeren van bestuurlijke of vertegenwoordigende
      activiteiten waarvoor de ambtenaar van politie door de vakbond is gevraagd en voor zover de activiteiten bijdragen
      aan de doelstelling van de vakbond;

      d. als bestuurslid of als afgevaardigde van een vakbond: het bijwonen van vergaderingen van de Sectorale
      Overlegcommissie BES, inclusief één vooroverleg per vergadering en inclusief reistijd;

      e. als bestuurslid of als afgevaardigde van een vakbond: het bijwonen van vergaderingen van in de statuten van
      de vakbond genoemde onderdelen, vergaderingen van centrale organisaties en internationale werknemersorganisaties
      waarbij de vakbond is aangesloten, inclusief één vooroverleg per vergadering; en

      f. overige vakbondswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel50
  - number: '51'
    text: |-
      Tenzij dringende redenen van dienstbelang zich daar tegen verzetten, wordt de ambtenaar van politie buitengewoon
      verlof met behoud van volle bezoldiging verleend:

      a. voor het zoeken van een woning indien het dienstbelang de verhuizing vordert: ten hoogste twee werkdagen;

      b. voor verhuizing uit hoofde van het dienstbelang: twee werkdagen, zonodig, indien betrokkene een eigen
      huishouding voert en het een verhuizing naar een ander eilandgebied betreft, te verlengen met twee werkdagen;

      c. voor verhuizing, anders dan uit hoofde van dienstbelang, indien betrokkene een eigen huishouding voert: éénmaal
      per kalenderjaar ten hoogste twee werkdagen.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel51
  - number: '52'
    text: |-
      Tenzij dringende redenen van dienstbelang zich daar tegen verzetten, wordt de ambtenaar van politie buitengewoon
      verlof met behoud van volle bezoldiging verleend:

      a. bij zijn ondertrouw: op de dag zelf;

      b. bij zijn huwelijk: vier werkdagen;

      c. tot het bijwonen van een huwelijk van bloed- of aanverwanten in de eerste en tweede graad: op de dag zelf;

      d. bij ernstige ziekte van zijn echtgenote, ouders, stiefouders, pleegouders, schoonouders, kinderen,
      stiefkinderen, pleegkinderen of aangehuwde kinderen: ten hoogste vijftien werkdagen. Indien dit aantal in bepaalde
      omstandigheden niet toereikend is, kan [artikel 55][ref1] toepassing vinden;

      e. bij het overlijden van:

      1. de onder d genoemde personen: twee werkdagen;

      2. bloed of aanverwanten tot en met de derde graad: een werkdag;

      f. indien betrokkene, in het geval bedoeld onder e, is belast met de regeling van de lijkbezorging of de
      nalatenschap dan wel met beide: ten hoogste vier werkdagen;

      g. bij de bevalling van zijn echtgenote: ten hoogste twee werkdagen;

      h. op de dag van zijn 10-, 20-, 30- en 40-jarig ambtsjubileum;

      i. bij zijn 25 of 40jarig huwelijksjubileum en bij het 25, 40, 50 of 60jarig huwelijksjubileum van zijn ouders,
      stiefouders, pleegouders, schoonouders of grootouders: op de dag zelf;

      j. bij de doop, besnijdenis, kerkelijke bevestiging en Eerste Heilige Communie van betrokkene of zijn
      echtgeno(o)t(e), kinderen, stiefkinderen, pleegkinderen of aangehuwde kinderen: op de dag zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel55
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel52
    references:
