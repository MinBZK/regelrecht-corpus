  - number: '123'
    text: |-
      1 Tot het tijdstip van inwerkingtreding van de ministeriële regeling, bedoeld in [artikel 8i, derde lid][ref1],
      is voor de aanstelling als ambtenaar van politie en voor aanstelling in een andere functie niet van toepassing
      dat wordt voldaan aan de eisen betreffende het geneeskundig en psychologisch onderzoek, bedoeld in de
      [artikelen 8, eerste lid, onder b][ref2], [8a, onder d][ref3], en [8b, onder d en e][ref4], onderscheidenlijk
      [8k][ref5].

      2 Tot het tijdstip van inwerkingtreding van de ministeriële regeling, bedoeld in de
      [artikelen 8f, derde lid][ref6], en [8h, onder a, b, c en d][ref7], is voor de aanstelling als aspirant en als
      vrijwillige ambtenaar in opleiding niet van de toepassing dat wordt voldaan aan de bij het geschiktheidsonderzoek
      gestelde eisen, bedoeld in artikel 8f, eerste lid.

      3 Tot het tijdstip van inwerkingtreding van de ministeriële regeling, bedoeld in [artikel 8n, tweede lid][ref8],
      is voor de aanstelling als ambtenaar van politie niet van toepassing dat uit onderzoek naar de betrouwbaarheid en
      geschiktheid geen bezwaar lijkt te bestaan tegen de aanstelling en is [artikel 8m][ref9] niet van toepassing.

      4 Tot het tijdstip van inwerkingtreding van de ministeriële regeling, bedoeld in
      [artikel 74k, eerste lid, onder a en b][ref10], is voor de geoefendheid in het gebruik van een geweldmiddel niet
      vereist dat de toets geweldbeheersing en de toets aanhoudings- en zelfverdedigingsvaardigheden met voldoende
      resultaat is afgelegd.

      5 Tot het tijdstip van inwerkingtreding van de ministeriële regeling, bedoeld in
      [artikel 74k, eerste lid, onder a en b, en tweede lid][ref11], is voor de geoefendheid in het gebruik van een
      vuurwapen niet vereist dat de toets schietvaardigheid met voldoende resultaat is afgelegd.


