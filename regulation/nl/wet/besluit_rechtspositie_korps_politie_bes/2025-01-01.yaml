  - number: 8l
    text: |-
      1 Aanstelling als ambtenaar van politie is slechts mogelijk, indien op grond van een ten aanzien van de betrokkene
      door Onze Minister ingesteld onderzoek naar de betrouwbaarheid en geschiktheid geen bezwaar lijkt te bestaan tegen
      diens aanstelling.

      2 Het onderzoek, bedoeld in het eerste lid, omvat het inwinnen van justitiële documentatie en politiegegevens van
      betrokkene.

      3 Het tweede lid is niet van toepassing indien het betreft:

      a. een aanstelling in een functie waarin technische, administratieve en andere taken ten dienste van de politie
      worden uitgevoerd, en Onze Minister heeft bepaald dat voor de functie slechts een verklaring omtrent het gedrag
      is vereist;

      b. een vertrouwensfunctie.

      4 De kosten voor de verklaring omtrent het gedrag, bedoeld in het derde lid, onder a, komen ten laste van de staat.

      5 Een onderzoek naar de betrouwbaarheid en geschiktheid wordt ingesteld nadat Onze Minister de betrokkene overigens
      bekwaam en geschikt acht.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel8l
  - number: 8m
    text: |-
      1 Indien naar het oordeel van Onze Minister de aard van de functie of van de werkzaamheden hiertoe aanleiding
      geeft, kan ten aanzien van de ambtenaar in de volgende gevallen opnieuw een onderzoek als bedoeld in
      [artikel 8l, eerste lid][ref1], worden uitgevoerd:

      a. bij wijziging van werkzaamheden;

      b. bij aanstelling in een andere functie;

      c. bij de vervulling van een functie gedurende ten minste vijf dienstjaren; of

      d. bij een redelijk vermoeden van ernstig plichtsverzuim dat de integriteit of de verantwoordelijkheid van de
      betrokkene raakt.

      2 Het eerste lid is niet van toepassing indien het betreft een vertrouwensfunctie of een functie waarvan Onze
      Minister heeft bepaald dat slechts een verklaring omtrent het gedrag is vereist.

      3 Onze Minister kan ten aanzien van functies als bedoeld in artikel 8l, derde lid, onder a, bepalen dat elke vijf
      jaar door de ambtenaar een verklaring omtrent het gedrag wordt overgelegd. Een functie wordt alleen aangewezen
      indien die kwetsbaar is voor integriteitsinbreuken.

      4 De kosten voor de verklaring omtrent het gedrag, bedoeld in het derde lid, komen ten laste van de staat.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel8l
