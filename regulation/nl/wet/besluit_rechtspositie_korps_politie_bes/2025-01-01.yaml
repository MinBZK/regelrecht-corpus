  - number: '69'
    text: |-
      1 De ambtenaar van politie aan wie vrijstelling van dienst wegens ziekte is verleend voor een duur van drie of meer
      maanden, mag zijn werkzaamheden niet geheel of gedeeltelijk hervatten dan nadat uit een schriftelijke verklaring
      van de geneeskundige commissie, de geneeskundige in dienst van de overheid dan wel de andere geneeskundige(n),
      genoemd in [artikel 68][ref1], blijkt dat betrokkene medisch is onderzocht en in staat is bevonden tot gehele of
      gedeeltelijke hervatting van zijn werkzaamheden.

      2 De ambtenaar van politie die aan het einde van de in [artikel 64][ref2] genoemde maximum-duur voor vrijstelling
      van dienst wegens ziekte volgens een schriftelijke verklaring van de geneeskundige commissie, de geneeskundige
      in dienst van de overheid of de andere geneeskundige(n), genoemd in [artikel 68][ref3], niet in staat is bevonden
      tot volledige hervatting van de dienstverrichting, kan, behoudens in het in het vierde lid genoemde geval, ontslag
      worden verleend conform [artikel 71][ref4].

      3 Alvorens de schriftelijke verklaring op te stellen, onderwerpt de geneeskundige-commissie, de geneeskundige in
      dienst van de overheid of de andere geneeskundige(n), genoemd in [artikel 68][ref5], de ambtenaar van politie aan
      een medisch onderzoek. In de verklaring wordt tevens ingegaan op de mogelijkheid tot aanpassing van de huidige
      functie en plaatsing in een andere functie, bedoeld in [artikel 71][ref6].

      4 Indien de geneeskundige commissie, de geneeskundige in dienst van de overheid dan wel de andere geneeskundige(n),
      genoemd in [artikel 68][ref7], van oordeel is dat hervatting van de werkzaamheden door de ambtenaar van politie
      niet mogelijk is wegens een opgekomen ziekte of ongeval van voorbijgaande aard, wordt voor de duur van die ziekte
      of dat ongeval alsnog vrijstelling van dienst wegens ziekte verleend met behoud van 70 procent van de volle
      bezoldiging.

      5 De kosten verbonden aan de uitvoering van dit artikel komen voor rekening van de staat.


