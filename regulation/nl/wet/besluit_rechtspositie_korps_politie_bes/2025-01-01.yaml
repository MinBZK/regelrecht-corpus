  - number: 37d
    text: |-
      1 De ambtenaar van politie kan op aanvraag de op grond van [artikel 37c][ref1] gespaarde vakantie-uren opnemen als
      levensfaseverlof. Levensfaseverlof kan worden gecombineerd met vakantie op grond van [artikel 33][ref2].

      2 Een aanvraag als bedoeld in het eerste lid wordt uiterlijk drie maanden voor het ingaan van het voorgenomen
      verlof ingediend, indien de verlofperiode, met inbegrip van eventuele vakantie op grond van [artikel 33][ref3],
      niet meer dan vier weken bedraagt. Indien de verlofperiode langer dan vier weken bedraagt, wordt de aanvraag
      uiterlijk zes maanden voor het ingaan van het voorgenomen verlof ingediend.

      3 Een aanvraag als bedoeld in het eerste lid wordt toegewezen, tenzij een zwaarwegend dienstbelang van
      bedrijfsorganisatorische aard zich daartegen verzet.

      4 Levensfaseverlof wordt genoten met behoud van vol inkomen.

      5 Levensfaseverlof kan wegens dringende redenen van dienstbelang geheel of gedeeltelijk door Onze Minister worden
      ingetrokken. Indien de ambtenaar van politie of zijn gezin ten gevolge van de intrekking schade lijdt, wordt deze
      schade vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel37c
