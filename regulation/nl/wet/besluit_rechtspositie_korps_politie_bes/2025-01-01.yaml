  - number: '10'
    text: |-
      1 Voor de aanvaarding van zijn ambt legt de aspirant, de vrijwillige ambtenaar van politie en de ambtenaar
      aangesteld voor de uitvoering van de politietaak de volgende eed dan wel verklaring en belofte van zuivering af:

      «Ik zweer (verklaar), dat ik middellijk of onmiddellijk, in welke vorm dan ook, tot het verkrijgen van mijn
      aanstelling aan niemand iets heb gegeven of beloofd.

      Ik zweer (beloof), dat ik, om iets in mijn betrekking te doen of te laten, van niemand, middellijk of onmiddellijk,
      enige beloften of geschenken zal aannemen.

      Zo waarlijk helpe mij God almachtig (Dat verklaar en beloof ik)!».

      Daarna wordt door de aspirant, de vrijwillige ambtenaar van politie en de ambtenaar aangesteld voor de uitvoering
      van de politietaak de volgende eed of belofte afgelegd:

      «Ik zweer (beloof) trouw aan de Koning, aan de Grondwet en aan de wetten van ons land.

      Ik zweer (beloof) dat ik de krachtens de wet uitgevaardigde voorschriften en verordeningen zal nakomen en
      handhaven, dat ik de aan mij verstrekte opdrachten plichtsgetrouw en nauwgezet zal volbrengen en de zaken, waarvan
      ik door mijn ambt kennis draag en die mij als geheim zijn toevertrouwd, of waarvan ik het vertrouwelijke karakter
      moet begrijpen, niet zal openbaren aan anderen dan aan hen, aan wie ik volgens de wet of ambtshalve tot mededeling
      verplicht ben.

      Ik zweer (beloof) dat ik mij zal gedragen zoals een goed ambtenaar betaamt, dat ik zorgvuldig, onkreukbaar en
      betrouwbaar zal zijn en dat ik niets zal doen dat het aanzien van het ambt zal schaden.

      Zo waarlijk helpe mij God almachtig (Dat beloof ik)!»

      2 Voor de aanvaarding van zijn ambt, legt de ambtenaar van politie aangesteld voor de uitvoering van technische,
      administratieve en andere taken ten dienste van de politie de volgende eed dan wel verklaring en belofte van
      zuivering af:

      «Ik zweer (verklaar) dat ik middellijk of onmiddellijk, in welke vorm dan ook, tot het verkrijgen van mijn
      aanstelling aan niemand iets heb gegeven of beloofd.

      Ik zweer (beloof), dat ik, om iets in mijn betrekking te doen of te laten, van niemand, middellijk of onmiddellijk,
      enige beloften of geschenken zal aannemen.

      Zo waarlijk helpe mij God almachtig (Dat verklaar en beloof ik)!»

      Daarna wordt door de ambtenaar de volgende eed of belofte afgelegd:

      «Ik zweer (beloof) trouw aan de Koning, aan de Grondwet en aan de wetten van ons land.

      Ik zweer (beloof) dat ik de aan mij verstrekte opdrachten plichtsgetrouw en nauwgezet zal volbrengen en de zaken,
      waarvan ik door mijn ambt kennis draag en die mij als geheim zijn toevertrouwd of waarvan ik het vertrouwelijke
      karakter moet begrijpen, niet zal openbaren aan anderen dan aan hen, aan wie ik volgens de wet of ambtshalve tot
      mededeling verplicht ben.

      Ik zweer (beloof) dat ik mij zal gedragen zoals een goed ambtenaar betaamt, dat ik zorgvuldig, onkreukbaar en
      betrouwbaar zal zijn en dat ik niets zal doen dat het aanzien van het ambt zal schaden.

      Zo waarlijk helpe mij God almachtig (Dat beloof ik)!»

      3 De ambtenaar van politie legt de eden dan wel verklaringen en beloften af ten overstaan van Onze Minister of de
      door deze daartoe aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel10
  - number: '11'
    text: |-
      1 Aan de ambtenaar van politie, met uitzondering van de vrijwillige ambtenaar van politie voor wat betreft
      onderdeel f, wordt, zo mogelijk voor de aanvaarding van zijn ambt, maar in ieder geval binnen een maand na aanvang
      van zijn werkzaamheden, door Onze Minister een akte van aanstelling uitgereikt waarin in elk geval worden vermeld:

      a. de naam, voornamen en geboortedatum;

      b. of de aanstelling geschiedt in tijdelijke of vaste dienst al dan niet met een proeftijd en de duur van
      de eventuele proeftijd, waarbij, indien de aanstelling geschiedt in tijdelijke dienst, wordt vermeld of de
      aanstelling geschiedt voor bepaalde tijd en zo ja voor hoe lang, dan wel voor onbepaalde tijd en de toepasselijke
      aanstellingsgrond;

      c. de functie waarin hij wordt geplaatst;

      d. de plaats van tewerkstelling;

      e. de datum van ingang van de aanstelling;

      f. de bezoldigingsschaal en de bezoldigingstrede die zijn toegekend.

      2 Wijziging van de gegevens, genoemd in het eerste lid, wordt de ambtenaar van politie binnen twee maanden
      schriftelijk door Onze Minister meegedeeld, behoudens wijziging van een regeling waarnaar is verwezen.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel11
  - number: '12'
    text: |-
      1 De ambtenaar van politie wordt bij zijn aanstelling schriftelijk door Onze Minister op de hoogte gesteld van de
      hoofdlijnen van zijn rechtspositie.

      2 Regelingen waarin zijn rechtspositie is neergelegd, en andere voor hem geldende regelingen en schriftelijke
      instructies die hij bij de uitoefening van zijn functie moet naleven, worden op een voor de ambtenaar van politie
      gemakkelijk toegankelijke plaats ter inzage gelegd.

      3 Over wijzigingen in regelingen betreffende zijn rechtspositie wordt de ambtenaar van politie zo spoedig mogelijk
      schriftelijk door Onze Minister op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel12
  - number: 12a
    text: |-
      1 Bij regeling van Onze Minister, en voor zover het opleidingen betreft op het terrein van de strafrechtelijke
      handhaving van de rechtsorde dan wel de taken ten dienste van de justitie Onze Minister van Justitie, worden
      regels gesteld over de competentiegerichte eindtermen voor het onderwijs voor de ambtenaren van politie op de
      kwalificatieniveaus:

      a. VSBO/MBO;

      b. HBO, en

      c. WO.

      2 Met inachtneming van de regels, bedoeld in het eerste lid, wijst Onze Minister, en voor zover het opleidingen
      betreft op het terrein van de strafrechtelijke handhaving van de rechtsorde dan wel de taken ten dienste van de
      justitie Onze Minister van Justitie, de initiële en postinitiële opleidingen voor de ambtenaren van politie aan.

      3 Bij regeling van Onze Minister worden regels gesteld over de instantie die is belast met:

      a. het ontwikkelen en de verzorging van de opleidingen, bedoeld in het tweede lid, en

      b. het examineren van de studenten die opleidingen, bedoeld in het tweede lid, hebben gevolgd.

      4 In de regeling, bedoeld in het derde lid, kunnen regels worden gesteld over:

      a. het ondersteunen van de werving en het uitvoeren van de selectie van de studenten voor de initiële opleidingen;

      b. het overdragen van kennis aan de politie en het bijdragen aan de ontwikkeling van de uitoefening van de
      politietaak waarop het onderwijs is gericht, onder meer door het verrichten van onderzoek;

      c. het ontwikkelen of het verzorgen van andere dan in het derde lid, onder a, bedoelde opleidingen van een door
      Onze Minister of Onze Minister van Justitie na overleg met Onze Minister wie het mede aangaat aan te wijzen
      categorie van personen, en

      d. andere werkzaamheden die door de instantie kunnen worden uitgevoerd, mits die werkzaamheden:

      1° samenhangen met de in het derde of vierde lid bedoelde taken;

      2° niet leiden tot concurrentievervalsing ten opzichte van private aanbieders van vergelijkbare diensten, en

      3° tegen ten minste kostendekkende prijzen worden verricht.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel12a
  - number: '13'
    text: |-
      1 Op de ambtenaar aangesteld voor de uitvoering van de politietaak en de aspirant zijn van
      [hoofdstuk IV van het Rechtspositiebesluit ambtenaren BES][ref1] uitsluitend de [artikelen 23a][ref2], [25a][ref3],
      [25aa][ref4], [25b][ref5], [25c][ref6], [25d][ref7], [27][ref8], [28][ref9], [29][ref10], [30][ref11] en
      [36a][ref12] en de daarop gebaseerde bepalingen van toepassing.

      2 Op de vrijwillige ambtenaar van politie zijn van [hoofdstuk IV van het Rechtspositiebesluit ambtenaren BES][ref13]
      uitsluitend de [artikelen 27][ref14], [29][ref15] en [30][ref16] van toepassing.

      3 De [artikelen 14 tot en met 23][ref17] van dit besluit zijn niet van toepassing op de vrijwillige ambtenaar van
      politie.


