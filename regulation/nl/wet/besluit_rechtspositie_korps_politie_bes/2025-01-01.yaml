  - number: 8j
    text: |-
      1 Indien aan het geneeskundig onderzoek voor de betrokkene een negatieve gevolgtrekking dan wel een positieve
      gevolgtrekking onder bepaalde bedenkingen wordt verbonden, heeft betrokkene recht op een herkeuring aan de hand van
      de richtlijnen, bedoeld in [artikel 8i, derde lid][ref1]. De betrokkene maakt zijn wens daartoe met redenen omkleed
      aan Onze Minister kenbaar binnen twee weken nadat de genoemde gevolgtrekking aan hem is meegedeeld.

      2 In geval van herkeuring wordt de door Onze Minister te nemen beslissing uitgesteld totdat de uitslag van de
      herkeuring aan Onze Minister is meegedeeld.

      3 De herkeuring geschiedt door een commissie van drie geneeskundigen.

      4 Onze Minister en de betrokkene wijzen elk een geneeskundige aan voor de commissie. Deze geneeskundigen wijzen een
      derde geneeskundige aan voor de commissie.

      5 De geneeskundige die het geneeskundig onderzoek, bedoeld in [artikel 8i, eerste lid][ref2], heeft verricht en de
      behandelend arts van de betrokkene maken geen deel uit van de commissie.

      6 De kosten van de herkeuring komen ten laste van Onze Minister. Onze Minister kan van de betrokkene een redelijke
      bijdrage verlangen.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel8i
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel8i
