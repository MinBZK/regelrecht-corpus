  - number: '113'
    text: |-
      1 Aan de aspirant of de vrijwillige ambtenaar in opleiding die tegen het einde van de basisopleiding
      respectievelijk de opleiding tot vrijwillige ambtenaar aangesteld voor de uitvoering van de politietaak niet
      voldoet aan de eisen van bekwaamheid en geschiktheid, wordt geacht eervol ontslag te zijn verleend met ingang van
      de dag volgend op die waarop de basisopleiding respectievelijk de opleiding tot vrijwillige ambtenaar aangesteld
      voor de uitvoering van de politietaak is voltooid.

      2 Aan de ambtenaar aangesteld voor de uitvoering van de politietaak, die tegen het einde van de proeftijd, bedoeld
      in [artikel 5, tweede lid][ref1], niet voldoet aan de eisen van bekwaamheid en geschiktheid, wordt geacht eervol
      ontslag te zijn verleend met ingang van de dag volgend op die, waarop de proeftijd is verstreken.

      3 Aan de ambtenaar aangesteld voor de uitvoering van technische, administratieve of andere taken ten dienste van
      politie, die tegen het einde van de proeftijd, bedoeld in [artikel 6, eerste lid][ref2], niet voldoet aan de eisen
      van bekwaamheid en geschiktheid, wordt geacht eervol ontslag te zijn verleend met ingang van de dag volgend op die,
      waarop de proeftijd is verstreken.

      4 Aan de aspirant of de vrijwillige ambtenaar in opleiding die gedurende de basisopleiding respectievelijk
      de opleiding tot vrijwillige ambtenaar aangesteld voor de uitvoering van de politietaak, en aan de ambtenaar
      aangesteld voor de uitvoering van de politietaak, of de ambtenaar aangesteld voor de uitvoering van technische,
      administratieve of andere taken ten dienste van de politie, die gedurende de proeftijd niet de geschiktheid blijken
      te bezitten die voor de uitoefening van het ambt vereist wordt, kan eervol ontslag worden verleend, mits een
      opzeggingstermijn in acht wordt genomen van:

      a. drie maanden, indien hij ten tijde van de opzegging direct daaraan voorafgaand ten minste twaalf maanden
      ononderbroken in dienst was;

      b. twee maanden, indien hij ten tijde van de opzegging direct daaraan voorafgaand ten minste zes maanden maar
      korter dan twaalf maanden ononderbroken in dienst was;

      c. één maand, indien hij ten tijde van de opzegging direct daaraan voorafgaand korter dan zes maanden ononderbroken
      in dienst was.

      5 Het ontslag, bedoeld in het vierde lid, kan, al dan niet op aanvraag van de ambtenaar van politie, ingaan vóór de
      afloop van de opzeggingstermijn. Indien dit niet op aanvraag van de ambtenaar van politie geschiedt, wordt hem over
      de tijd die aan de opzeggingstermijn ontbreekt, een bedrag uitbetaald gelijk aan de inkomsten, vermeerderd met de
      vakantie-uitkering, waarop hij aanspraak zou hebben gehad, als hij tot het einde van de opzeggingstermijn in dienst
      was gebleven.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel6
