      1 [Hoofdstuk VIII van het Rechtspositiebesluit ambtenaren BES][ref1] en de daarop berustende regelingen zijn niet
      van toepassing op de ambtenaar van politie.

      2 De ambtenaar van politie die zijn ambtelijke verplichtingen niet nakomt of zich overigens aan plichtsverzuim
      schuldig maakt, kan disciplinair worden gestraft.

      3 Plichtsverzuim omvat zowel het overtreden van een voorschrift als het doen of nalaten van iets dat een goed
      ambtenaar van politie in gelijke omstandigheden behoort na te laten of te doen.

      4 Een strafrechterlijke vervolging wegens een feit dat mede plichtsverzuim inhoudt, sluit een disciplinaire
      strafoplegging wegens dat feit niet uit.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel101
