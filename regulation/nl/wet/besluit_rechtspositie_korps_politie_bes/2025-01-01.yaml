        artikel: '118'
        hoofdstuk: X
        paragraaf: '3'
  - number: '8'
    text: |-
      1 Voor een aanstelling als aspirant komt uitsluitend in aanmerking degene die:

      a. de Nederlandse nationaliteit bezit;

      b. voldoet aan de eisen betreffende het geneeskundig en psychologisch onderzoek;

      c. ten minste de leeftijd van 17 jaar heeft;

      d. voldoet aan de eisen met betrekking tot het opleidingsniveau;

      e. op het moment van zijn aanstelling in het bezit is van het rijbewijs B of dit binnen twee jaar na zijn
      aanstelling behaalt.

      f. voldoet aan de bij het geschiktheidsonderzoek gestelde eisen.

      2 Voor een aanstelling als vrijwillige ambtenaar in opleiding aangesteld voor de uitvoering van de politietaak komt
      uitsluitend in aanmerking degene die voldoet aan het gestelde in het eerste lid, a tot en met d en f.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel8
  - number: 8a
    text: |-
      Voor een aanstelling als ambtenaar van politie aangesteld voor de uitvoering van de politietaak en de vrijwillige
      ambtenaar aangesteld voor de uitvoering van de politietaak komt uitsluitend in aanmerking degene die:

      a. de Nederlandse nationaliteit bezit;

      b. ten minste de leeftijd van 18 jaar heeft;

      c. voldoet aan de eisen met betrekking tot het opleidingsniveau;

      d. voldoet aan de eisen betreffende het geneeskundig en psychologisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel8a
  - number: 8b
    text: |-
      Voor de aanstelling als ambtenaar aangesteld voor de uitvoering van technische, administratieve en andere taken ten
      dienste van de politie komt in aanmerking degene die:

      a. de Nederlandse nationaliteit bezit;

      b. ten minste de leeftijd van 18 jaar heeft bereikt;

      c. voldoet aan de gestelde eisen met betrekking tot het opleidingsniveau;

      d. voldoet aan de eisen betreffende het geneeskundig onderzoek;

      e. voldoet aan de eisen betreffende het psychologisch onderzoek, indien daaraan naar het oordeel van Onze Minister
      behoefte bestaat;

      f. voldoet aan de overige door Onze Minister te stellen eisen die specifiek gerelateerd zijn aan de te vervullen
      functie binnen het politiekorps.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel8b
  - number: 8c
    text: |-
      Teneinde vast te stellen of de persoon, bedoeld in de [artikelen 8, eerste lid, aanhef, en tweede lid][ref1],
      [8a][ref2] en [8b][ref3] in voldoende mate geschikt en bekwaam is voor de vervulling van de functie, kan Onze
      Minister de gegevens die door de betrokkene desgevraagd zijn verstrekt, verifiëren en zo nodig aanvullen.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel8a
      [ref3]: https://wetten.overheid.nl/BWBR0028767#Artikel8b
