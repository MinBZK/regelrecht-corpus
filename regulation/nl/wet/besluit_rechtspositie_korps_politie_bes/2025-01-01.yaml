  - number: 118a
    text: |-
      1 Aan een ambtenaar van politie kan eervol ontslag worden verleend, indien hij op grond van het bepaalde in
      [artikel 5, derde lid][ref1], of [artikel 10, tweede lid, van de Wet veiligheidsonderzoeken][ref2] uit een
      vertrouwensfunctie moet worden ontheven.

      2 Indien een ontslag als bedoeld in het eerste lid door Onze Minister wordt verleend, is de medewerking vereist van
      Onze Minister van Justitie.


