        hoofdstuk: II
        paragraaf: '4'
  - number: 74e
    text: |-
      In geval van een ongeval, ontstaan ten gevolge van de vervulling van zijn functie, ontvangt de vrijwillige
      ambtenaar aangesteld voor de uitvoering van de politietaak een vergoeding van de kosten van geneeskundige
      behandeling of verzorging die te zijnen laste blijven en die naar het oordeel van Onze Minister noodzakelijk zijn
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel74e
  - number: 74f
    text: |-
      Indien geen sprake is van een ongeval, maar wel van een ziekte die is ontstaan of verergerd ten gevolge van de
      vervulling van de functie, stelt Onze Minister ter zake een uitkering vast voor zover de verzekering, bedoeld in
      [artikel 74a, eerste lid][ref1], daar niet in voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel74a
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel74f
    references:
