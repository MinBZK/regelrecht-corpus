  - number: 8d
    text: |-
      1 Voor toelating tot de onderwijstrajecten op kwalificatieniveau VSBO/MBO komt in aanmerking degene die in het
      bezit is van:

      a. een LBO-diploma;

      b. een MAVO-diploma;

      c. een VSBO-diploma praktisch basisgerichte leerweg;

      d. een VSBO-diploma theoretisch kadergerichte leerweg;

      e. een VSBO-diploma, praktisch kadergerichte leerweg, of

      f. een getuigschrift van een onderwijsinstelling waaruit blijkt dat de eerste drie jaren van een HAVO of VWO-
      opleiding met goed gevolg zijn afgelegd.

      2 Voor toelating tot een onderwijstraject op kwalificatieniveau HBO komt in aanmerking degene die in het bezit
      is van:

      a. een HAVO-diploma, of

      b. een diploma politiemedewerker op het kwalificatieniveau VSBO/MBO.

      3 Voor toelating tot een onderwijstraject op kwalificatieniveau WO komt in aanmerking degene die in het bezit is
      van:

      a. een VWO-diploma;

      b. een bewijsstuk dat op grond van een voor Nederland, Curaçao of Sint Maarten in werking getreden internationale
      overeenkomst toelating geeft tot het universitaire onderwijs, of

      c. in het bezit is van een diploma politiekundige bachelor op het kwalificatieniveau HBO.

      4 Met een diploma, genoemd in het eerste, tweede en derde lid, wordt voor de toepassing van deze leden
      gelijkgesteld een diploma vergezeld met een verklaring van de daartoe bevoegde autoriteit waarin staat dat het
      wordt gelijkgesteld met een diploma, genoemd in deze leden. De eerste volzin is van overeenkomstige toepassing op
      een getuigschrift, bedoeld in het eerste lid, onder f.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel8d
  - number: 8e
    text: |-
      1 Kandidaten die niet voldoen aan de in [artikel 8d][ref1] gestelde eisen, kunnen een door Onze Minister
      goedgekeurde toelatingstoets afleggen.

      2 Indien de toets met goed gevolg wordt afgelegd, komt de kandidaat alsnog in aanmerking voor toelating tot één van
      de initiële opleidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel8d
