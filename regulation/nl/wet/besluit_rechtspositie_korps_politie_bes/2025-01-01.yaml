      [artikel 8l, eerste lid][ref1].

      2 Bij regeling van Onze Minister worden nadere regels gesteld ter uitvoering van de [artikelen 8l][ref2]
      en [8m][ref3]. Deze nadere regels bevatten in ieder geval waarborgen omtrent een voldoende bescherming van de
      persoonlijke levenssfeer van betrokkene.


