  - number: 37c
    text: |-
      1 De ambtenaar van politie kan per kalenderjaar ten hoogste 24 van de vakantie-uren waarop hij aanspraak heeft op
      grond van [artikel 33, eerste lid][ref1], sparen ten behoeve van levensfaseverlof.

      2 In afwijking van het eerste lid kan de ambtenaar van politie aan het einde van elk kalenderjaar ten hoogste 59,7
      van de vakantie-uren waarop hij aanspraak heeft op grond van [artikel 33, eerste lid][ref2], sparen ten behoeve van
      levensfaseverlof, op voorwaarde dat hij in dat kalenderjaar ten minste 108 vakantie-uren heeft genoten.

      3 De ambtenaar van politie aan wie op grond van [artikel 33, tweede lid][ref3], extra vakantie-uren zijn verleend,
      kan een derde deel van die extra-vakantie-uren sparen ten behoeve van levensfaseverlof.

      4 Onverminderd [artikel 37b, derde en vierde lid][ref4], kan Onze Minister op aanvraag van de ambtenaar van politie
      zijn aanspraak op vakantie-uren met ten hoogste 28,8 uren verhogen, welke uren die ambtenaar spaart ten behoeve van
      levensfaseverlof. Artikel 37b, achtste lid, is van overeenkomstige toepassing.

      5 Het aantal op grond van dit artikel in totaal door een ambtenaar van politie gespaarde en nog niet op grond van
      [artikel 37d][ref5] opgenomen vakantie-uren bedraagt ten hoogste 1.800.

      6 Ten aanzien van de in het eerste, tweede, vierde en vijfde lid genoemde aantallen vakantie-uren is
      [artikel 34][ref6] van overeenkomstige toepassing.

      7 Onze Minister kan nadere regels stellen ter uitvoering van dit artikel.


