  - number: 8f
    text: |-
      1 De kandidaat-aspirant en de kandidaat-vrijwillige ambtenaar in opleiding wordt onderworpen aan een
      geschiktheidsonderzoek, bestaande uit achtereenvolgens:

      a. een taalvaardigheidsonderzoek;

      b. een cognitief capaciteitenonderzoek;

      c. een psychologisch onderzoek;

      d. een fysiek motorisch onderzoek.

      2 De onderzoeken, bedoeld in het eerste lid, worden afgenomen door een door Onze Minister aangewezen instantie
      belast met de werving en selectie van politie met inachtneming van de bij regeling van Onze Minister te bepalen
      regels.

      3 Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van het onderzoek, genoemd in het eerste lid.

      4 De in het tweede lid bedoelde instantie rapporteert aan Onze Minister naar aanleiding van de uitkomsten.

      5 De kosten van het geschiktheidsonderzoek worden gedragen door Onze Minister.

      6 Het taalvaardigheidsonderzoek wordt niet afgenomen bij de betrokkene die, indien tot aanstelling zou worden
      overgegaan, de initiële opleiding gaat volgen op het kwalificatieniveau 5 of 6, bedoeld in [artikel 8d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel8d
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel8f
    references:
