  - number: '95'
    text: |-
      1 Aan de ambtenaar van politie wordt door Onze Minister vergoed de schade aan zijn goederen die hij buiten zijn
      schuld lijdt ten gevolge van de uitoefening van het ambt, voor zover die schade niet bestaat uit normale slijtage
      van die goederen.

      2 De ambtenaar van politie heeft geen aanspraak op de in het eerste lid bedoelde vergoeding, indien hij ter zake
      van die schade tegenover derden rechten kan doen gelden.

      3 Indien de ambtenaar van politie zijn rechten tegenover derden aan de staat cedeert, wordt hij in het genot
      gesteld van het in geld uitgedrukte bedrag van de schade.

      4 Indien de staat ter zake van de rechten, verkregen middels een cessie, bedoeld in het derde lid, een civiele
      vordering instelt, worden de kosten die daaruit voor de staat voortvloeien, niet op de ambtenaar van politie
      verhaald.

      5 Onze Minister kan ter uitvoering van het eerste tot en met derde lid nadere regels stellen.

      6 Door de Onze Minister kan worden bepaald, in welke elders niet voorziene gevallen schadeloosstelling of
      vergoeding van kosten zal worden verleend aan de ambtenaar van politie.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel95
  - number: '96'
    text: |-
      1 De ambtenaar van politie kan door Onze Minister de toegang tot dienstlokalen, -gebouwen en -terreinen of het
      werk, dan wel het verblijf aldaar worden ontzegd.

      2 De ambtenaar van politie is verplicht zich te gedragen conform de maatregelen van orde die door Onze Minister ten
      aanzien van het verblijf op de in het eerste lid bedoelde plaatsen zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel96
  - number: '97'
    text: |-
      1 De ambtenaar van politie die in contact staat of kort geleden heeft gestaan met een persoon die een ziekte heeft
      waarop de Wet voor de volksgezondheid BES van toepassing is, mag geen dienst verrichten en heeft geen toegang
      tot dienstgebouwen, -lokalen en -terreinen en het werk dan met toestemming van Onze Minister dat deze toestemming
      slechts kan verlenen na positief advies van de geneeskundige, bedoeld in [artikel 66][ref1].

      2 De ambtenaar van politie die verkeert in de situatie, bedoeld in het eerste lid, is verplicht daarvan onverwijld
      kennis te geven aan Onze Minister en het hoofd van dienst. Hij is gehouden zich te gedragen naar de door Onze
      Minister of hoofd van dienst gegeven aanwijzingen, waaronder die betreffende het ondergaan van een geneeskundig
      onderzoek, bedoeld in [artikel 66][ref2].

      3 Gedurende de tijd dat de ambtenaar van politie ingevolge dit artikel geen werkzaamheden verricht, geniet hij zijn
      volle bezoldiging.


