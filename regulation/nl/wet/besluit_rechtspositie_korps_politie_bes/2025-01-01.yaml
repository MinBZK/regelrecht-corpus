  - number: 23a
    text: |-
      Aan de ambtenaar die op 1 februari 2024 in dienst was, wordt een eenmalige uitkering verleend ter hoogte van USD
      750 netto.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel23a
  - number: 23b
    text: |-
      De vrijwillige ambtenaar in opleiding en de vrijwillige ambtenaar aangesteld voor de uitoefening van de politietaak
      die in opdracht van Onze Minister een voor zijn functie relevante cursus volgt dan wel deelneemt aan een oefening
      of in opdracht van Onze Minister werkelijke dienst verricht, ontvangen een bij ministeriële regeling vastgestelde
      vergoeding.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel23b
  - number: 23d
    text: |-
      [Artikel 9a van het Bezoldigingsbesluit 1998 BES][ref1] is van overeenkomstige toepassing op de ambtenaar van
      politie, met uitzondering van de vrijwillige ambtenaar van politie.


      [ref1]: https://wetten.overheid.nl/BWBR0028491#Artikel9a
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0028491
        artikel: 9a
  - number: 23e
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *ambtenaar:* de ambtenaar van politie aangesteld voor de uitvoering van de politietaak en de aspirant;
        - *oorspronkelijke bezoldigingsschaal:* de bezoldigingsschaal die van toepassing was tot en met 30 juni 2013;
        - *nieuwe bezoldigingsschaal:* de bezoldigingsschaal die met terugwerkende kracht van toepassing is met ingang van
      1 juli 2013;
        - *oorspronkelijke maximum-bezoldiging:* het bedrag, behorende bij de hoogste bezoldigingstrede van de
      oorspronkelijke bezoldigingsschaal;
        - *garantietrede:* elk afzonderlijk binnen een bezoldigingsschaal opgenomen bezoldigingsbedrag, voorzien van een
      nummer dat wordt voorafgegaan door de aanduiding «GPT»;
        - *bevorderen:* overgaan naar een functie, aan welke bezoldiging in een hogere bezoldigingsschaal is verbonden.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel23e
  - number: 23f
    text: |-
      Voor zover in de nieuwe bezoldigingsschaal de maximum-bezoldiging een lager bedrag is dan de maximum-bezoldiging in
      de oorspronkelijke bezoldigingsschaal worden bij ministeriële regeling garantietreden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel23f
  - number: 23g
    text: |-
      1 Bij ministeriële regeling worden inpastabellen vastgesteld voor ambtenaren die reeds op 30 september 2014 in
      dienst waren, waarbij onderscheid wordt gemaakt tussen:

      a. ambtenaren die hun functie in 2013 naar het oordeel van Onze Minister, dat is neergelegd in een formele
      beoordeling als bedoeld in [artikel 25][ref1], naar behoren hebben vervuld, en

      b. ambtenaren ten aanzien van wie niet in een formele beoordeling als bedoeld in [artikel 25][ref2] is neergelegd
      dat zij hun functie in 2013 naar behoren hebben vervuld.

      Een inpastabel vermeldt per bezoldigingsschaal ten aanzien van iedere bezoldigingstrede in de oorspronkelijke
      bezoldigingsschaal op welke bezoldigings- of garantietrede de bezoldiging van een ambtenaar met in achtneming van
      het tweede tot en met vierde lid opnieuw wordt vastgesteld in de nieuwe bezoldigingsschaal.

      2 De bezoldiging van de ambtenaar die reeds op 30 juni 2013 in dienst was en de bezoldiging van de aspirant die
      reeds op 30 juni 2013 in dienst was, wordt op basis van de voor hem geldende inpastabel met terugwerkende kracht
      tot en met 1 juli 2013, of, indien hij daarna is bevorderd, voor de periode van 1 juli 2013 tot de datum van
      bevordering, met terugwerkende kracht vastgesteld in de bezoldigingsschaal volgens welke hij wordt of tot dan toe
      werd bezoldigd.

      3 De bezoldiging van de ambtenaar die tussen 1 juli 2013 en 1 oktober 2014 in dienst is getreden en de bezoldiging
      van de aspirant die tussen 1 juli 2013 en 1 oktober 2014 in dienst is getreden, wordt op basis van de voor hem
      geldende inpastabel met terugwerkende kracht tot en met de datum van indiensttreding of, indien de ambtenaar
      na 1 juli 2013 is bevorderd voor de periode van de datum van indiensttreding tot de datum van bevordering met
      terugwerkende kracht vastgesteld in de bezoldigingsschaal volgens welke hij wordt of tot zijn bevordering werd
      bezoldigd.

      4 Indien de ambtenaar, bedoeld in het tweede of derde lid, na 1 juli 2013 is bevorderd, wordt zijn bezoldiging
      op basis van de voor hem geldende inpastabel met terugwerkende kracht tot en met de datum van bevordering opnieuw
      vastgesteld in de bezoldigingsschaal volgens welke hij vanaf zijn bevordering werd bezoldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel25
