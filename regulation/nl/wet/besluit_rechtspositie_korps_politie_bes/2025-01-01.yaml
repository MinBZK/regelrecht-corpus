  - number: 23h
    text: |-
      1 Indien de ambtenaar die reeds op 30 september 2014 in dienst was de maximum-bezoldiging van de voor
      hem geldende bezoldigingsschaal heeft bereikt, wordt zijn bezoldiging met overeenkomstige toepassing van
      [artikel 18, eerste lid][ref1], verhoogd tot het bedrag dat behoort bij de eerste garantietrede die behoort bij de
      schaal, indien hij naar het oordeel van Onze Minister, dat is neergelegd in een formele beoordeling als bedoeld in
      [artikel 25][ref2], zijn functie naar behoren vervult.

      2 Indien de ambtenaar wordt bezoldigd op een garantietrede binnen de voor hem geldende bezoldigingschaal, wordt
      zijn bezoldiging met overeenkomstige toepassing van [artikel 18, eerste lid][ref3], verhoogd tot het bedrag dat
      behoort bij de naast-hogere garantietrede die behoort bij de schaal, indien hij naar het oordeel van Onze Minister,
      dat is neergelegd in een formele beoordeling als bedoeld in [artikel 25][ref4], zijn functie naar behoren vervult.

      3 Voor zover de ambtenaar die reeds op 30 september 2014 in dienst was de maximum-bezoldiging van
      de voor hem geldende bezoldigingsschaal heeft bereikt, wordt zijn bezoldiging bij toepassing van
      [artikel 18, tweede lid][ref5], verhoogd tot een bedrag dat behoort tot de eerste garantietrede volgend op de
      naast-hogere bezoldigings- of garantietrede die behoort bij de schaal, indien hij naar het oordeel van Onze
      Minister, dat is neergelegd in een formele beoordeling als bedoeld in [artikel 25][ref6], zijn functie zeer goed of
      uitstekend vervult.

      4 De in het tweede en derde lid bedoelde verhogingen van de bezoldiging worden met ingang van 1 januari van een
      jaar toegekend, zolang de ambtenaar aangesteld de laatste garantietrede die behoort bij de voor hem geldende
      bezoldigingsschaal nog niet heeft bereikt.

      5 Aan een verhoging, bedoeld in het eerste of tweede lid, behoeft geen formele beoordeling als bedoeld in
      [artikel 25][ref7] ten grondslag te liggen, indien het een aspirant betreft.


