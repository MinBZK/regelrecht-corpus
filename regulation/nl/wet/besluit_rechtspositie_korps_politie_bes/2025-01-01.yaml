  - number: 74o
    text: |-
      1 Onze Minister draagt zorg voor de registratie van de deelname aan en de resultaten van de in [artikel 74k][ref1]
      bedoelde toetsen.

      2 In het jaarverslag voor het politiekorps wordt een overzicht gegeven van de stand van zaken betrekkende de in
      [artikel 74k][ref2] bedoelde toetsen.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel74k
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel74k
