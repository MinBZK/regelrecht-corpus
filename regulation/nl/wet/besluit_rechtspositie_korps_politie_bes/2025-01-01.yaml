    text: |-
      1 Tenzij bij wet is bepaald dat ontslag wordt gegeven bij koninklijk besluit, wordt ontslag gegeven door Onze
      Minister.

      2 Ontslag wordt gegeven bij beschikking, die de datum van ingang van het ontslag dan wel een aanduiding van die
      dag bevat.

      3 Bij ongevraagd ontslag wordt, behalve in de in [artikelen 113][ref1], en [114, eerste lid][ref2], genoemde
      gevallen, de reden van ontslag meegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel114
