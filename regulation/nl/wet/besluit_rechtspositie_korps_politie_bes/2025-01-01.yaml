  - number: 74h
    text: |-
      1 De vrijwillige ambtenaar aangesteld voor de uitvoering van de politietaak, wordt belast met een of meer van de
      volgende werkzaamheden:

      a. het surveilleren, het treffen van maatregelen ter handhaving van de openbare orde en het verlenen van hulp op
      openbare plaatsen;

      b. het opsporen van overtredingen en misdrijven waarop als hoofdstraf maximaal een gevangenisstraf van ten hoogste
      vier jaren of een geldboete van de vierde categorie is gesteld;

      c. het houden van toezicht op en het verzorgen van ingeslotenen; en

      d. het verrichten van werkzaamheden op de meldkamer en de receptie van het politiebureau en van administratieve
      werkzaamheden.

      2 De vrijwillige ambtenaar kan tevens, met instemming van Onze Minister, worden ingezet bij specialistische
      werkzaamheden die niet behoren tot de werkzaamheden, bedoeld in het eerste lid, voor zover hij beschikt over
      de daarvoor vereiste opleiding en ervaring. Tot specialistische werkzaamheden wordt in ieder geval gerekend
      assistentie bij opsporingsonderzoeken naar andere misdrijven dan die bedoeld in het eerste lid, onder b.

      3 Onder ingeslotene, bedoeld in het eerste lid, onder c, wordt verstaan degene die rechtens van zijn vrijheid
      is beroofd. Onder ingeslotene wordt mede verstaan degene die ten behoeve van hulpverlening aan hem op het
      politiebureau is ondergebracht.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel74h
  - number: 74i
    text: |-
      De vrijwillige ambtenaar aangesteld voor de uitvoering van de politietaak kan, na instemming van Onze Minister en
      voor zover hij beschikt over de daarvoor vereiste opleiding en ervaring, zelfstandig of onder begeleiding van een
      ambtenaar aangesteld voor de uitvoering van de politietaak met eenzelfde of hogere rang, werkzaamheden uitoefenen
      die verband houden met de volledige politietaak.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel74i
  - number: 74j
    text: |-
      In dit hoofdstuk wordt verstaan onder ambtenaar: de ambtenaar aangesteld voor de uitvoering van de politietaak en
      de vrijwillige ambtenaar aangesteld voor de uitvoering van de politietaak.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel74j
  - number: 74k
    text: |-
      1 Een ambtenaar beschikt in een bepaald kalenderjaar slechts over een geweldmiddel, indien hij in het daaraan
      voorafgaande kalenderjaar met voldoende resultaat heeft afgelegd:

      a. de bij regeling van Onze Minister samengestelde toets geweldsbeheersing;

      b. de bij regeling van Onze Minister samengestelde toets aanhoudings- en zelfverdedigingsvaardigheden.

      2 Een ambtenaar beschikt in een bepaald kalenderhalfjaar slechts over een vuurwapen, indien hij in het daaraan
      voorafgaande kalenderhalfjaar de bij regeling van Onze Minister samengestelde toets schietvaardigheid met voldoende
      resultaat heeft afgelegd.

      3 Een ambtenaar die is belast met de uitoefening van specialistische of leidinggevende politietaken en daartoe
      een postinitiële opleiding heeft gevolgd, dient de in het eerste en tweede lid bedoelde toetsen tevens volgens de
      competentiegerichte eindtermen van de postinitiële opleiding met voldoende resultaat af te leggen. Indien voor de
      postinitiële opleiding niet een dergelijke toets is vastgesteld, dient de in de eerste volzin bedoelde ambtenaar de
      toetsen volgens de competentiegerichte eindtermen van de initiële opleiding met voldoende resultaat af te leggen.

      4 Indien een ambtenaar op de laatste dag van een kalenderjaar of kalenderhalfjaar de in het eerste, tweede en derde
      lid bedoelde toetsen nog niet met voldoende resultaat heeft afgelegd, wordt het geweldmiddel in het gebruik waarvan
      hij dientengevolge niet langer is geoefend, door Onze Minister ingenomen.

      5 De ambtenaar van wie een geweldmiddel op grond van het vierde lid is ingenomen, kan voor de resterende duur van
      het lopende kalenderjaar of kalenderhalfjaar wederom over het geweldmiddel beschikken vanaf het moment dat hij de
      toetsen die hij niet of niet met voldoende resultaat had afgelegd, alsnog met voldoende resultaat aflegt.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel74k
  - number: 74l
    text: |-
      Onze Minister biedt de ambtenaar de gelegenheid tot het volgen van ten minste 32 uren training ter voorbereiding op
      de af te leggen toetsen, en toetsing.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel74l
  - number: 74m
    text: |-
      De toets geweldsbeheersing, de toets aanhoudings- en zelfverdedigingsvaardigheden en de toets schietvaardigheid
      worden afgenomen door een door Onze Minister daartoe aangewezen toetser.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel74m
  - number: 74n
    text: |-
      Indien een ambtenaar, op de laatste dag van de in [artikel 74k][ref1] bedoelde perioden, één van de in dat artikel
      bedoelde toetsen niet of niet met voldoende resultaat heeft afgelegd, doet de toetser hiervan onverwijld mededeling
      aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel74k
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel74n
    references:
