        hoofdstuk: VIII
  - number: '102'
    text: |-
      1 De disciplinaire straffen die de ambtenaar van politie, met uitzondering van de vrijwillige ambtenaar van
      politie, kunnen worden opgelegd, zijn:

      a. schriftelijke berisping;

      b. buitengewone dienst op andere dagen dan op zondag of op de voor de ambtenaar van politie geldende algemene en
      kerkelijke feestdagen en zonder de ingevolge [artikel 23][ref1] voor overwerk toe te kennen toelage of tegen een
      lagere toelage dan deze: voor ten hoogste zes uren met een maximum van drie uren per dag al dan niet in aansluiting
      op de voor hem geldende diensttijd;

      c. geldboete: van ten hoogste vijftig procent (50%) van de aanvangsbezoldiging behorende bij bezoldigingsschaal 1;

      d. geheel of gedeeltelijke inhouding van inkomsten: tot een bedrag van ten hoogste een maand inkomsten;

      e. terugzetting naar een lagere bezoldigingstrede: voor ten hoogste twee bezoldigingstreden;

      f. uitsluiting van bevordering: voor ten hoogste vier jaren;

      g. terugzetting in de naastlagere hoofdrang, al dan niet voor bepaalde tijd en al dan niet met vermindering van de
      bezoldiging tot de aan die naastlagere hoofdrang verbonden bezoldiging;

      h. schorsing voor een bepaalde tijd met gehele of gedeeltelijke inhouding van inkomsten: voor ten hoogste negen
      maanden;

      i. ontslag.

      2 Aan de aspirant kan tevens worden opgelegd de disciplinaire straf van verwijdering van het opleidingsinstituut,
      dat de basisopleiding verzorgt, voor ten hoogste veertien dagen, met dien verstande deze straf niet wordt opgelegd
      op de dagen waarop de opleidingsresultaten volgens de ter zake gestelde regels worden getoetst of beoordeeld.

      3 Onverminderd het zesde lid, worden de straffen, bedoeld in het eerste en tweede lid, opgelegd door Onze Minister.

      4 Bij het opleggen van een straf, genoemd in het eerste lid, kan worden bepaald dat deze niet ten uitvoer wordt
      gelegd, indien de ambtenaar van politie zich gedurende een bij het opleggen van de straf te bepalen termijn van
      maximaal twee jaren, niet schuldig maakt aan soortgelijk plichtsverzuim als waarvoor de bestraffing plaatsvindt,
      noch aan enig ander ernstig plichtsverzuim en zich houdt aan bij de strafoplegging eventueel te stellen bijzondere
      voorwaarden. De bijzondere voorwaarden mogen de godsdienstige of staatkundige vrijheid niet beperken.

      5 Dezelfde instantie die over de voorwaardelijke strafopschorting, bedoeld in het vierde lid, beslist, kan
      gelasten dat de opgeschorte straf alsnog ten uitvoer wordt gelegd indien de ambtenaar van politie zich binnen
      de vastgestelde proeftijd wederom schuldig maakt aan plichtsverzuim dan wel zich niet houdt aan een gestelde
      bijzondere voorwaarde, bedoeld in het vijfde lid.

      6 Indien het een ambtenaar betreft die bij koninklijk besluit is benoemd, worden de straffen, bedoeld in het eerste
      lid, onder a tot en met f, opgelegd door Onze Minister en worden de straffen, bedoeld in het eerste lid, onder g
      tot en met i, opgelegd bij koninklijk besluit.

      7 Het eerste lid, onder a, h en i, zijn van overeenkomstige toepassing op de vrijwillige ambtenaar van politie.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel23
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel102
