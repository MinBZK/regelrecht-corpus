  - number: 3a
    text: |-
      Voor de vrijwillige ambtenaar van politie gelden de volgende hoofdrangen:

      a. aspirant voor degene die is aangesteld als vrijwillige ambtenaar in opleiding;

      b. agent voor de vrijwillige ambtenaar aangesteld voor de uitvoering van de politietaak die is belast met de
      werkzaamheden, bedoeld in [artikel 74h, eerste en tweede lid][ref1];

      c. agent, brigadier, hoofdagent, inspecteur, hoofdsinspecteur of commissaris, voor de vrijwillige
      ambtenaar aangesteld voor de uitvoering van de politietaak die is belast met de werkzaamheden, bedoeld in
      [artikel 74i][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel74h
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel74i
