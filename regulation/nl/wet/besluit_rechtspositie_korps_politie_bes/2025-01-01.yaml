  - number: 74g
    text: |-
      De [artikelen 74d][ref1], [74e][ref2] en [74f][ref3] zijn van overeenkomstige toepassing op de gewezen
      vrijwillige ambtenaar aangesteld voor de uitvoering van de politietaak, voor zover deze de leeftijd, bedoeld in
      [artikel 118, eerste lid][ref4], nog niet heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel74d
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel74e
