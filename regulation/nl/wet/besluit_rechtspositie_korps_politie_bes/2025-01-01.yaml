  - number: '60'
    text: |-
      1 Indien het verlof, bedoeld in [artikel 57][ref1], ten doel heeft de ambtenaar van politie in de gelegenheid te
      stellen, anders dan in vaste dienst, hetzij een functie bij een volkenrechtelijke organisatie te vervullen hetzij
      als deskundige tijdelijk ten behoeve van Nederland, Aruba, Curaçao, Sint Maarten of een vreemde mogendheid werkzaam
      te zijn en met de verlofverlening het algemeen belang in overwegende mate wordt gediend, kan dit voor ten hoogste
      drie jaar, al dan niet met behoud van volle bezoldiging, worden verleend.

      2 In afwijking van het eerste lid kan de ambtenaar van politie die wenst te worden uitgezonden om in burgerlijke
      landsdienst van Nederland, Aruba, Curaçao of Sint Maarten tijdelijk een functie te vervullen, buitengewoon verlof
      worden verleend op basis van het West-Indisch Detacheringsbesluit 1930.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel57
