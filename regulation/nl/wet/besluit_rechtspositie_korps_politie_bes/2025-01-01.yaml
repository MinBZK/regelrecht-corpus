    text: |-
      1 Het is de ambtenaar van politie verboden geld, geschenken, diensten of kortingen van welke aard, in welke vorm,
      middellijk of onmiddellijk, of van wie dan ook, met uitzondering van door de staat of het openbaar lichaam Bonaire,
      Sint Eustatius of Saba uitgeloofde premies, aan te nemen of ten behoeve van wie ook te bedingen in verband met de
      uitoefening van zijn ambt.

      2 De ambtenaar van politie is verplicht onverwijld aan Onze Minister mededeling te doen, indien een derde gepoogd
      heeft hem door een gift, kwijtschelding, belofte of verbintenis te bewegen in de uitoefening van zijn ambt iets te
      doen of na te laten.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel86
  - number: '87'
    text: |-
      1 De ambtenaar van politie, die een besturende of toezichthoudende functie vervult in een rechtspersoonlijkheid
      bezittend lichaam, en die voor de in die functie verrichte of te verrichten werkzaamheden, anders dan ten laste van
      de staat, een vergoeding ontvangt, is verplicht die vergoeding aan de staat af te dragen, indien de benoeming in
      die functie:

      a. plaats heeft gehad door Onze Minister; of

      b. is voortgevloeid uit een wettelijk voorschrift of een overeenkomst die met instemming van Onze Minister tot
      stand is gekomen.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van de ambtenaar van politie die een nevenfunctie
      vervult, die verband houdt met de uitoefening van zijn ambt en aan hem is opgedragen door Onze Minister, en die
      voor de in die nevenfunctie verrichte of te verrichten werkzaamheden, anders dan ten laste van de staat, een
      vergoeding ontvangt.

      3 Aan de ambtenaar van politie die een functie, bedoeld in het eerste of tweede lid, uitoefent, kan ten laste van
      de staat een vergoeding worden toegekend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel87
  - number: '88'
    text: |-
      1 Het is de ambtenaar van politie verboden overheidsgoederen te gebruiken ten bate van particuliere belangen.

      2 De ambtenaar van politie mag een vervoermiddel dat hem vanwege de overheid ten behoeve van de dienstverrichting
      ter beschikking is gesteld, alleen gebruiken voor het door de dienst- verrichting vereiste vervoer. Onder zodanig
      vervoer wordt niet begrepen het vervoer van de ambtenaar van politie van en naar de plaats van zijn inwoning en van
      en naar de plaats van zijn tewerkstelling.

      3 Onze Minister kan in bijzondere gevallen ontheffing verlenen van het verbod, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel88
  - number: '90'
    text: |-
      1 De ambtenaar van politie die in deelbetrekking werkzaam is en die op aanwijzing of met goedkeuring van Onze
      Minister een opleiding volgt, is verplicht aan die opleiding deel te nemen als ware hij in volle betrekking
      aangesteld.

      2 De in het eerste lid bedoelde verplichting geldt niet ten aanzien van opleidingen waarvoor een programma
      is vastgesteld dat uitdrukkelijk voorziet in de mogelijkheid van deelname door ambtenaren van politie die in
      deelbetrekking werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel90
  - number: '93'
    text: |-
      1 Onze Minister kan de ambtenaar van politie verplichten de door de staat geleden schade, voor zover deze te wijten
      is aan zijn opzet of roekeloosheid, geheel of gedeeltelijk te vergoeden.

      2 [Vervallen]

      3 Het bedrag van de schadevergoeding wordt niet vastgesteld dan nadat de ambtenaar van politie in de gelegenheid is
      gesteld zich schriftelijk of mondeling te verantwoorden.

      4 Het verhaal van de schade op de ambtenaar van politie, zijn erfgenamen of rechtverkrijgenden, geschiedt conform
      het Burgerlijk Wetboek BES.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel93
  - number: '94'
    text: |-
      1 De rekenplichtige ambtenaar van politie wordt van de verplichting tot aanzuivering van een tekort geheel of
      gedeeltelijk ontheven naarmate hij het beheer nauwgezet heeft uitgevoerd en de nodige voorzorgen heeft genomen voor
      de bewaring van gelden en geldswaardige papieren.

      2 Vloeit de verplichting tot aanzuivering van een tekort voort uit aansprakelijkheid voor ondergeschikten, dan
      wordt bovendien in aanmerking genomen in hoeverre de rekenplichtige ambtenaar van politie op het doen en laten van
      die ondergeschikten toezicht heeft gehouden.

      3 De rekenplichtige ambtenaar van politie is van zijn verantwoordelijkheid ter zake ontheven gedurende de tijd
      dat hij door ziekte, ongeval of andere wettige afwezigheid het beheer niet persoonlijk heeft gevoerd, indien zijn
      betrekking gedurende die tijd wordt waargenomen.

      4 Dit artikel is alleen van toepassing voor zover de [Comptabiliteitswet 2001][ref1] niet anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0013891
