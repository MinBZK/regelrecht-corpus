  - number: '75'
    text: |-
      1 [Hoofdstuk VII][ref1], met uitzondering van de [artikelen 66][ref2], [67][ref3], [68][ref4], [71][ref5],
      [71a][ref6], [72 tot en met 72h][ref7] en [76 van het Rechtspositiebesluit ambtenaren BES][ref8] en de daarop
