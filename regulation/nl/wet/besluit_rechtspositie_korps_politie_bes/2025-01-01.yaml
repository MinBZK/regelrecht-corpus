  - number: 38a
    text: |-
      1 Behoudens [artikel 39][ref1] verliest de ambtenaar van politie zijn aanspraak op de door hem niet-genoten
      vakantie-uren die betrekking hebben op het kalenderjaar voorafgaand aan het afgelopen kalenderjaar.

      2 Indien de ambtenaar van politie naar het oordeel van het bevoegd gezag redelijkerwijs niet in staat is geweest
      zijn vakantie-uren binnen de in het eerste lid genoemde termijn op te nemen, kan het bevoegd gezag toestaan dat van
      het eerste lid wordt afgeweken. In dat geval vervalt de aanspraak alsnog na verloop van vijf jaren na de laatste
      dag van het kalenderjaar waarin de aanspraak is ontstaan.

      3 Het eerste en tweede lid is niet van toepassing op vakantie-uren die de ambtenaar van politie op grond van
      [artikel 37c][ref2] heeft gespaard ten behoeve van levensfaseverlof.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel37c
