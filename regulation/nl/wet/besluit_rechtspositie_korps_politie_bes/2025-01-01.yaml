  - number: '18'
    text: |-
      1 De bezoldiging van de ambtenaar aangesteld voor de uitvoering van de politietaak wordt jaarlijks verhoogd tot
      het in de schaal naast-hogere bedrag, indien hij zijn functie naar het oordeel van zijn leidinggevende naar behoren
      vervult.

      2 Het loon van de ambtenaar aangesteld voor de uitvoering van de politietaak, kan worden verhoogd tot het bedrag
      dat behoort bij de eerste bezoldigingstrede volgend op de naasthogere bezoldigingstrede in de schaal, indien hij
      naar het oordeel van Onze Minister, dat is neergelegd in een formele beoordeling, bedoeld in [artikel 25][ref1],
      zijn functie zeer goed of uitstekend verricht.

      3 Vervult de ambtenaar aangesteld voor de uitvoering van de politietaak, zijn functie naar het oordeel van Onze
      Minister, dat is neergelegd in een formele beoordeling als bedoeld in [artikel 25][ref2] niet naar behoren, dan
      blijft verhoging van het loon achterwege.

      4 De in het eerste en tweede lid bedoelde verhogingen van de bezoldiging worden toegekend zolang de ambtenaar
      de maximum bezoldiging van de voor hem geldende bezoldigingsschaal nog niet heeft bereikt, voor de eerste maal
      met ingang van de eerste dag van de maand, waarin sinds zijn aanstelling of sinds zijn overgang naar een functie
      waaraan een hogere bezoldiging is verbonden een jaar is verstreken, en nadien telkens na één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel25
