  - number: '119'
    text: |-
      1 Buiten de gevallen bij dit besluit of bij of krachtens enige wettelijke regeling, anders dan het
      [Rechtspositiebesluit ambtenaren BES][ref1], bepaald kan de ambtenaar van politie alleen worden ontslagen op grond
      van:

      a. het verlies van een vereiste voor de aanstelling, gesteld bij een regeling aan de aanstelling voorafgegaan
      zijnde, tenzij het vereiste alleen voor de aanvang van het ambt geldt;

      b. een onherroepelijk geworden rechterlijke uitspraak waarbij de ambtenaar van politie onder curatele is gesteld;

      c. het ondergaan van lijfsdwang wegens schulden krachtens een onherroepelijk geworden rechterlijke uitspraak;

      d. een onherroepelijk geworden veroordeling tot een vrijheidsstraf wegens misdrijf;

      e. onbekwaamheid of ongeschiktheid voor het door hem beklede ambt, anders dan op grond van ziels of
      lichaamsgebreken;

      f. het bij of in verband met de aanstelling dan wel de keuring verstrekken van onjuiste of onvolledige
      inlichtingen, zonder welke handelwijze niet tot aanstelling of goedkeuring zou zijn overgegaan, tenzij de ambtenaar
      van politie aannemelijk maakt dat hij te goeder trouw heeft gehandeld.

      2 Een ontslag op grond van het eerste lid, onder a en e, wordt steeds eervol verleend.

      3 Een ontslag, bedoeld in het eerste lid, kan niet eerder ingaan dan de dag volgende op die waarop de reden van het
      ontslag voor het eerst aanwezig was.


      [ref1]: https://wetten.overheid.nl/BWBR0028693
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0028693
  - number: '120'
    text: |-
      1 De ambtenaar aangesteld voor de uitvoering van de politietaak, de vrijwillige ambtenaar van politie
      en de aspirant kunnen binnen zes weken nadat zij van de beslissing inzake de vaststelling van een
      bezoldiging of de toekenning van een verhoging, vergoeding, toelage of andere beloning als bedoeld in
      [hoofdstuk III, paragraaf 4][ref1], dan wel inzake de weigering hem een dergelijke verhoging, vergoeding, toelage
      of andere beloning toe te kennen in kennis zijn gesteld of nadat zij geacht kunnen worden op een andere wijze
      daarmee bekend te zijn geworden, hun bezwaren daartegen aan Onze Minister kenbaar maken door de indiening van een
      met redenen omkleed bezwaarschrift.

      2 Het bezwaarschrift wordt door de ambtenaar aangesteld voor de uitvoering van de politietaak, de vrijwillige
      ambtenaar van politie en de aspirant, of namens hen door een gemachtigde ondertekend. Indien het bezwaarschrift
      door een gemachtigde is getekend, worden stukken welke naar aanleiding ervan door Onze Minister tot betrokkenen
      worden gericht aan deze gemachtigde of in elk geval mede aan deze toegezonden.

      3 De indiening van een bezwaarschrift schorst niet de uitvoering van de beslissing waartegen bezwaar wordt gemaakt.

      4 Tenzij het bezwaar kennelijk nietontvankelijk of ongegrond is, worden de ambtenaar aangesteld voor de uitvoering
      van de politietaak, de vrijwillige ambtenaar van politie en aspirant, in de gelegenheid gesteld over hun bezwaren
      te worden gehoord door één of meer door Onze Minister daartoe aangewezen personen; degene die aangewezen is,
      onderscheidenlijk de meerderheid van degenen die aangewezen zijn, mag niet bij de totstandkoming van de beslissing
      of de weigering waartegen het bezwaar is gericht, betrokken zijn geweest.

      5 Deze ambtenaar aangesteld voor de uitvoering van de politietaak, de vrijwillige ambtenaar van politie en
      aspirant, kunnen tijdens de zitting waarop zij worden gehoord, gebruik maken van een raadsman.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel120
    references:
