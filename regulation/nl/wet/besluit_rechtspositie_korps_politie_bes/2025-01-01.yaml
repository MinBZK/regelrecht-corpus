  - number: '68'
    text: |-
      1 Vrijstelling van dienst wegens ziekte van meer dan dertig dagen of verlenging daarvan waardoor die vrijstelling
      van langere duur wordt dan dertig dagen, wordt slechts verleend indien uit een schriftelijke verklaring van een
      door Onze Minister ingestelde geneeskundige commissie, bestaande uit drie geneeskundigen, blijkt dat de betrokken
      ambtenaar van politie wegens ziekte of ongeval verhinderd is dienst te verrichten.

      2 In de schriftelijke verklaring wordt aangegeven:

      a. wanneer en in welke mate de werkzaamheden hervat kunnen worden;

      b. of zich een omstandigheid voordoet als bedoeld in [artikel 65, eerste en tweede lid][ref1];

      c. of maatregelen in het belang van herstel nodig zijn, waaronder begrepen aanpassing van de huidige functie
      en plaatsing in een andere functie, bedoeld in [artikel 71][ref2]. Indien verblijf buiten de openbare lichamen
      Bonaire, Sint Eustatius en Saba noodzakelijk is, wordt daarvan mededeling gedaan, onder opgave van de plaats van
      verblijf en de wijze waarop de reis daarheen moet plaats vinden.

      3 In afwijking van het eerste lid kan Onze Minister een ambtenaar van politie vrijstelling van dienst wegens ziekte
      of verlenging daarvan verlenen op grond van een schriftelijke verklaring van een geneeskundige in dienst van de
      overheid.

      4 Indien een ambtenaar van politie als zodanig of in verband met het bekleden van een functie bedoeld in
      [artikel 60][ref3], buiten de openbare lichamen Bonaire, Sint Eustatius en Saba verblijft, kan Onze Minister, in
      afwijking van het eerste lid, vrijstelling van dienst wegens ziekte of verlenging daarvan verlenen:

      a. indien de ambtenaar van politie zich in Europa bevindt, op grond van een schriftelijke verklaring van een door
      Onze Minister in Nederland aangewezen geneeskundige;

      b. indien de ambtenaar van politie zich elders bevindt, op grond van een schriftelijke verklaring van een door Onze
      Minister aangewezen geneeskundige.

      5 De kosten verbonden aan de uitvoering van dit artikel komen voor rekening van de staat.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0028767#Artikel60
