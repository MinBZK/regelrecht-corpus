  - number: '44'
    text: |-
      1 Vrijstelling van dienst, te verlenen door Onze Minister, geniet de ambtenaar van politie die:

      a. als militair in werkelijke dienst is voor herhalingsoefening;

      b. uit hoofde van ziekte of ongeval verhinderd is zijn functie uit te oefenen.

      2 Aan de ambtenaar van politie wordt door Onze Minister vrijstelling van dienst verleend, voor zover hij op één van
      de in [artikel 26, vijfde lid][ref1], genoemde dagen, tenzij het een zaterdag of een zondag betreft:

      a. werkzaamheden heeft verricht;

      b. een roostervrije dag heeft genoten als bedoeld in [artikel 26, tweede lid][ref2], onder b;

      c. verlof heeft genoten als vergoeding voor verricht overwerk.

      3 De dag waarop vrijstelling van dienst, bedoeld in het tweede lid, wordt verleend, wordt vastgesteld door Onze
      Minister. Bij de vaststelling wordt zoveel mogelijk rekening gehouden met de wensen van de ambtenaar van politie.

      4 Voor de toepassing van het tweede lid wordt het verrichten van werkzaamheden gedurende ten hoogste de helft
      van de voor de ambtenaar van politie geldende gemiddelde dagelijkse diensttijd gelijkgesteld met dienst gedurende
      een halve dag en wordt het verrichten van werkzaamheden gedurende meer dan de helft van de voor de ambtenaar van
      politie geldende gemiddelde dagelijkse diensttijd gelijkgesteld met dienst gedurende een hele dag.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel26
