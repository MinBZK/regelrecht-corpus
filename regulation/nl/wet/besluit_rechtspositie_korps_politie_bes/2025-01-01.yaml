        artikel: 8d
        hoofdstuk: II
        paragraaf: '3'
  - number: 8g
    text: |-
      1 De uitkomst van het geschiktheidsonderzoek, bedoeld in [artikel 8f, eerste lid][ref1], wordt de betrokkene zo
      spoedig mogelijk na het voltooien van het geschiktheidsonderzoek schriftelijk meegedeeld.

      2 De betrokkene kan een gesprek aanvragen met de psycholoog onder wiens verantwoordelijkheid het desbetreffende
      onderzoek is afgenomen. Binnen twee weken na deze aanvraag vindt dit gesprek plaats.

      3 De betrokkene van wie de uitslag van het fysiek motorisch onderzoek onvoldoende is, kan binnen twee weken nadat
      hem deze uitslag is meegedeeld een tweede fysieke motorisch onderzoek aanvragen. Binnen drie maanden na deze
      aanvraag vindt het tweede fysieke motorisch onderzoek plaats.

      4 De kosten van het gesprek, bedoeld in het tweede lid, en van het tweede onderzoek, bedoeld in het derde lid,
      komen ten laste van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel8f
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel8g
