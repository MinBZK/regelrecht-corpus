    text: |-
      1 De ambtenaar van politie die wegens ziekte of ongeval verhinderd is zijn werkzaamheden te verrichten, geeft
      daarvan onverwijld kennis aan het hoofd van dienst.

      2 Het hoofd van dienst kan van de ambtenaar van politie overlegging vragen van een geneeskundige verklaring. Ter
      verkrijging van een vrijstelling van dienst wegens ziekte van meer dan drie achtereenvolgende dagen is overlegging
      van een geneeskundige verklaring verplicht.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel63
  - number: '64'
    text: |-
      1 De ambtenaar van politie die wegens ziekte of ongeval verhinderd is zijn werkzaamheden te verrichten, wordt
      vrijstelling van dienst wegens ziekte, bedoeld in [artikel 44][ref1], verleend.

      2 De aanvankelijke duur van de vrijstelling van dienst wegens ziekte is ten hoogste zes maanden. Deze termijn kan
      telkens met ten hoogste zes maanden worden verlengd.

      3 De duur van de vrijstelling van dienst wegens ziekte, inbegrepen de verlenging daarvan, is ten hoogste vier jaren
      voor de ambtenaar van politie in vaste dienst en ten hoogste een jaar voor de ambtenaar van politie in tijdelijke
      dienst.

      4 Gedurende de vrijstelling van dienst wegens ziekte heeft de ambtenaar van politie aanspraak op een bezoldiging
      naar reden van:

      a. voor de ambtenaar van politie in vaste dienst:

        - zijn volle bezoldiging gedurende de eerste vierentwintig maanden;
        - negentig procent van zijn volle bezoldiging gedurende de daaropvolgende twaalf maanden;
        - tachtig procent van zijn volle bezoldiging gedurende de resterende maanden.

      b. voor de ambtenaar van politie in tijdelijke dienst: zijn volle bezoldiging

      5 Tijdens de vrijstelling van dienst wegens ziekte ondergaat de bezoldiging van de ambtenaar van politie dezelfde
      wijzigingen, welke deze zou ondergaan indien hij niet verhinderd zou zijn om zijn werkzaamheden te verrichten.

      6 Een opnieuw ingetreden verhindering tot dienstverrichting wegens ziekte of ongeval wordt voor het bepalen van
      de in het tweede en vierde lid genoemde termijn als een voortzetting van de vorige verhindering aangemerkt, tenzij
      die verhindering zich voordoet nadat dertig kalenderdagen zijn verstreken sedert de ambtenaar van politie zijn
      werkzaamheden volledig heeft hervat.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel44
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0028767
        artikel: '44'
        hoofdstuk: V
  - number: '65'
    text: |-
      1 De ambtenaar van politie heeft geen aanspraak op doorbetaling van inkomsten:

      a. indien de ziekte of het ongeval is voorgewend, althans zodanig overdreven is voorgesteld dat verhindering tot
      dienstverrichting wegens ziekte of ongeval redelijkerwijs niet kan worden aangenomen;

      b. indien de ambtenaar van politie de verhindering tot dienstverrichting wegens ziekte of ongeval opzettelijk heeft
      veroorzaakt of verergerd, tenzij hem daarvan op grond van zijn psychische toestand redelijkerwijs geen verwijt
      gemaakt kan worden;

      c. indien de ziekte of het ongeval is veroorzaakt door of het gevolg is van een kwaal of lichaamsgebrek waarover de
      ambtenaar van politie voor of bij zijn aanstelling opzettelijk heeft gezwegen of waaromtrent hij toen opzettelijk
      valse inlichtingen heeft verstrekt;

      d. indien hij tijdens de verhindering tot dienstverrichting wegens ziekte of ongeval voor zichzelf of voor derden
      arbeid verricht, tenzij dit door de geneeskundige, genoemd in [artikel 66][ref1], de bezwaarcommissie, genoemd
      in [artikel 67][ref2], de geneeskundige commissie, de geneeskundige in dienst van de overheid dan wel de andere
      geneeskundige(n), genoemd in [artikel 68][ref3], of de herkeuringscommissie, genoemd in [artikel 70][ref4],
      wenselijk wordt geacht in het belang van het genezingsproces.

      2 De betaling van de inkomsten wordt gestopt vanaf de dag waarop en zolang de ambtenaar van politie:

      a. weigert zich te onderwerpen aan een geneeskundig onderzoek vanwege de dienst of, na voor een dergelijk onderzoek
      te zijn opgeroepen, zonder geldige reden niet verschijnt;

      b. zonder voldoende grond nalaat zich onder geneeskundige behandeling te stellen of te blijven, dan wel zich niet
      houdt aan de voorschriften hem door zijn behandelend geneeskundige gegeven, uitgezonderd voorschriften inhoudende
      het verlenen van medewerking aan een ingreep van heelkundige aard;

      c. zich zodanig gedraagt dat zijn genezing wordt belemmerd of vertraagd;

      d. in gebreke blijft op het door de geneeskundige genoemd in [artikel 66][ref5], de bezwaarcommissie, genoemd
      in [artikel 67][ref6], de geneeskundige commissie, de geneeskundige in dienst van de overheid dan wel de andere
      geneeskundige(n), genoemd in [artikel 68][ref7], of de herkeuringscommissie, genoemd in [artikel 70][ref8],
      bepaalde tijdstip en in de door hen bepaalde mate zijn dienstverrichting te hervatten, tenzij hij daarvoor een
      inmiddels opgekomen door evengenoemde geneeskundige(n) of commissie(s) als geldig erkende reden heeft opgegeven.

      3 De betaling van de inkomsten kan bovendien geheel of gedeeltelijk worden gestopt, indien de ambtenaar van politie
      zich niet houdt aan eventuele door Onze Minister vastgestelde controlevoorschriften.

      4 In de in het eerste lid genoemde gevallen kan Onze Minister op grond van bijzondere omstandigheden bepalen, dat
      de ingehouden inkomsten geheel of gedeeltelijk wordt uitbetaald aan de betrekkingen van de ambtenaar van politie,
      genoemd in [artikel 54][ref9].


