  - number: '112'
    text: |-
      1 De ambtenaar van politie wordt op zijn aanvraag ontslag verleend.

      2 Behoudens in het geval, genoemd in [artikel 61][ref1], wordt het ontslag niet verleend met ingang van een dag
      die vroeger dan een maand of later dan drie maanden ligt na de dag waarop de aanvraag om ontslag is ontvangen door
      Onze Minister.

      3 Van het eerste lid kan worden afgeweken indien een strafrechtelijke vervolging ter zake van een misdrijf tegen de
      ambtenaar van politie is ingesteld of indien wordt overwogen hem de straf van ontslag op te leggen.

      4 Van het tweede lid kan worden afgeweken:

      a. indien wordt overwogen de ambtenaar van politie een straf, bedoeld in [artikel 102][ref2], op te leggen;

      b. indien het dienstbelang dit bepaaldelijk vereist, met dien verstande dat de termijn van drie maanden tot ten
      hoogste zes maanden kan worden verlengd en dat bij de verlenging in redelijkheid met de belangen van de ambtenaar
      van politie rekening wordt gehouden;

      c. op aanvraag van de ambtenaar van politie.

      5 Indien een ontslag op aanvraag wordt verleend aan een aspirant of de vrijwillige ambtenaar in opleiding, gaat het
      ontslag, in afwijking van het tweede lid, onmiddellijk in.

      6 Het ontslag op aanvraag wordt eervol verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel102
