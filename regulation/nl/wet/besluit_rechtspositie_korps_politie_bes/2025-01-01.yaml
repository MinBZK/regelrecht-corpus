  - number: '3'
    text: |-
      1 Voor de ambtenaar aangesteld voor de uitvoering van de politietaak, en de ambtenaar, bedoeld in
      [artikel 5, eerste lid, eerste volzin][ref1], gelden de volgende hoofdrangen:

      a. hoofdcommissaris;

      b. commissaris;

      c. hoofdinspecteur;

      d. inspecteur;

      e. hoofdagent;

      f. brigadier;

      g. agent;

      h. aspirant.

      2 Een in het eerste lid eerder genoemde hoofdrang is hoger dan een later genoemde hoofdrang.

      3 De volgende hoofdrangen zijn verbonden aan de volgende functies:

      a. [Vervallen]

      b. aspirant voor degene die is aangesteld om de opleiding tot agent of inspecteur te volgen, bezoldigingsschaal 4;

      c. agent voor functies die zijn gewaardeerd op bezoldigingsschaal 5 en 6;

      d. brigadier voor functies die zijn gewaardeerd op bezoldigingsschaal 7;

      e. hoofdagent voor functies die zijn gewaardeerd op bezoldigingsschaal 8;

      f. inspecteur voor functies die zijn gewaardeerd op bezoldigingsschaal 9, 10 en 11;

      g. hoofdinspecteur voor functies die zijn gewaardeerd op bezoldigingsschaal 12, 13 en 14;

      h. hoofdcommissaris en commissaris voor functies die zijn gewaardeerd op bezoldigingsschaal 15, 16 en 17.

      4 Hij die is aangesteld als aspirant, heeft voor de duur dat hij praktijkstage volgt de hoofdrang die verbonden is
      aan de functie die hij tijdens die stage uitoefent.

      5 Onze Minister kan om redenen van dienstbelang functies die zijn gewaardeerd op bezoldigingsschaal 12, 13 of 14,
      aanwijzen waaraan, in afwijking van het bepaalde in het derde lid, onder g en h, de hoofdrang van commissaris is
      verbonden.

      6 In afwijking van het derde lid, onderdeel d, is de hoofdrang van brigadier voor de ambtenaar aangesteld voor de
      uitvoering van de politietaak die krachtens [artikel 15, vijfde lid][ref2], is bekleed met deze rang, verbonden aan
      functies die zijn gewaardeerd op bezoldigingsschaal 6 en 7.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel15
