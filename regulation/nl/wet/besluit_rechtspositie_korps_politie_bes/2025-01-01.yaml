        paragraaf: '4'
  - number: '103'
    text: |-
      1 Indien het voornemen bestaat om de ambtenaar van politie een disciplinaire straf op te leggen, geschiedt de
      strafoplegging niet dan nadat hij schriftelijk in de gelegenheid is gesteld om zich binnen zeven dagen tegenover de
      tot strafoplegging bevoegde instantie of een door deze aan te wijzen instantie te verantwoorden.

      2 Degene tegenover wie de verantwoording plaats vindt, bepaalt of de verantwoording mondeling dan wel schriftelijk
      zal plaatsvinden. Bij schriftelijke verantwoording wordt de ambtenaar van politie op zijn verzoek in de gelegenheid
      gesteld tot het geven van een mondelinge toelichting. Bij de mondelinge verantwoording kan de ambtenaar van politie
      zich laten bijstaan door een raadsman.

      3 Van de mondelinge verantwoording wordt direct een verslag opgemaakt, dat na voorlezing wordt getekend door degene
      tegenover wie de verantwoording heeft plaatsgevonden en door de ambtenaar van politie. Indien de ambtenaar van
      politie het verslag weigert te ondertekenen, wordt dit in het verslag, zo mogelijk onder opgave van de redenen,
      vermeld. De ambtenaar van politie ontvangt een afschrift van het verslag.

      4 Indien de ambtenaar van politie dit verlangt, worden hem of zijn raadsman onverwijld kopieën verstrekt van
      de ambtelijke rapporten dan wel andere documenten die op de hem ten laste gelegde feiten betrekking hebben, met
      uitzondering van documenten of onderdelen daarvan tegen welker kennisneming het openbaar belang zich volgens de tot
      strafoplegging bevoegde instantie bepaaldelijk verzet.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel103
  - number: '104'
    text: |-
      1 De kennisgeving bedoeld in [artikel 95, eerste lid, van de Wet ambtenarenrechtspraak 1951 BES][ref1], wordt zo
      mogelijk op de plaats van tewerkstelling aan de ambtenaar van politie tegen gedagtekend en door hem ondertekend
      ontvangstbewijs uitgereikt.

      2 Indien de ambtenaar van politie niet op de plaats van tewerkstelling aanwezig is, wordt de kennisgeving aan zijn
      woon- of verblijfplaats tegen gedagtekend en door de ontvanger ondertekend ontvangstbewijs afgegeven aan hemzelf
      of aan een van zijn huisgenoten. Indien degene die met de afgifte van de kennisgeving belast is noch de ambtenaar
      van politie noch iemand van zijn huisgenoten aantreft, of indien degene die hij aantreft weigert de kennisgeving in
      ontvangst te nemen of het ontvangstbewijs te ondertekenen, wordt het aangetekend aan de woon- of verblijfplaats van
      de ambtenaar van politie gezonden.

      3 In de gevallen, bedoeld in het tweede lid, wordt de betrokken ambtenaar van politie geacht met de kennisgeving
      bekend te zijn geworden op de dag van afgifte aan zijn woon- of verblijfplaats, onderscheidenlijk op de dag waarop
      het door de postdienst aan die woon- of verblijfplaats is bezorgd of aangeboden.


