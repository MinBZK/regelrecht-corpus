  - number: '32'
    text: |-
      1 Aan de ambtenaar van politie wordt, al dan niet op zijn verzoek, in elk kalenderjaar door Onze Minister vakantie
      met behoud van bezoldiging verleend met inachtneming van deze paragraaf.

      2 Indien naar het oordeel van Onze Minister voor de ambtenaar van politie geldige redenen van verhindering bestaan,
      wordt de vakantie niet ongevraagd verleend.

      3 Vakantie kan wegens dringende redenen van dienstbelang geheel of gedeeltelijk door Onze Minister worden geweigerd
      of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel32
  - number: '33'
    text: |-
      1 De ambtenaar van politie heeft per kalenderjaar aanspraak op 168 vakantie-uren.

      2 Aan de ambtenaar van politie die ingevolge het voor hem geldende dienstrooster avond- en/of nachtdienst en dienst
      op zon- en feestdagen moet verrichten, heeft per kalenderjaar aanspraak op 22 extra vakantie-uren.

      3 Bij de ambtenaar van politie die in onregelmatige ploegendienst werkzaam is, en de ambtenaar van politie, bedoeld
      in het tweede lid, worden voor elk tijdvak van een week waarin zij vakantie genieten, evenveel vakantie-uren op
      het hen jaarlijks toekomend aantal vakantie-uren in mindering gebracht als bij de ambtenaar van politie voor wie de
      werkweek uit vijf werkdagen bestaat.

      4 De ambtenaar van politie die onmiddellijk voorafgaand aan zijn aanstelling als ambtenaar van politie werkzaam
      was als ambtenaar, waarop [hoofdstuk II van het Besluit vakantie en vrijstelling van dienst ambtenaren BES][ref1]
      van toepassing is, of als ambtenaar van het openbaar lichaam Bonaire, Sint Eustatius of Saba, anders dan als
      ambtenaar behorende tot het onderwijzend personeel of als personeelslid van het gesubsidieerde onderwijs,
      behoudt bij zijn aanstelling op zijn verzoek aanspraak op de door hem niet-genoten vakantie-uren die op grond van
      [artikel 5 van het Besluit vakantie en vrijstelling van dienst ambtenaren BES][ref2] zijn ontstaan in het lopende
      en het voorgaande kalenderjaar waarin zijn aanstelling plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0028606#Artikel5
    url: https://wetten.overheid.nl/BWBR0028767/2025-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028606
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028606
        artikel: '5'
  - number: '34'
    text: |-
      1 Bij beëindiging of aanvang van de aanstelling in de loop van een kalenderjaar, wordt de aanspraak op vakantie-
      uren op grond van [artikel 33][ref1] vastgesteld naar evenredigheid van de tijd dat de ambtenaar van politie in dat
      kalenderjaar werkzaamheden heeft verricht of zal verrichten.

      2 Voor de ambtenaar van politie met een deelbetrekking wordt het aantal vakantie-uren, genoemd in
      [artikel 33, eerste lid][ref2], vermenigvuldigd met een breuk waarvan de teller bestaat uit het aantal uren van
      de voor hem geldende werktijd, en de noemer uit het aantal uren van de voor zijn functie gebruikelijke volledige
      werktijd.

      3 Indien in de loop van een kalenderjaar wijziging optreedt in de omvang van de voor de ambtenaar van politie
      geldende werktijd, wordt de aanspraak op het aantal vakantie-uren die gedurende het resterende deel van dat
      kalenderjaar ontstaat, opnieuw bepaald, rekening houdend met de nieuwe werktijd. De tot aan de datum van ingang van
      de wijziging van de werktijd verworven aanspraak op vakantie blijft ongewijzigd gehandhaafd.

      4 Het aantal vakantie-uren waarop de ambtenaar van politie na toepassing van dit artikel over een kalenderjaar
      aanspraak heeft, wordt zo nodig naar boven afgerond op hele uren.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel33
