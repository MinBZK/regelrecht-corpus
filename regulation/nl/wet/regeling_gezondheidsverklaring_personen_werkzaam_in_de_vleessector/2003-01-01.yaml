---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.4/schema/v0.5.4/schema.json
$id: regeling_gezondheidsverklaring_personen_werkzaam_in_de_vleessector
regulatory_layer: WET
publication_date: '2005-12-23'
valid_from: '2003-01-01'
valid_to: '2005-12-31'
bwb_id: BWBR0007674
url: https://wetten.overheid.nl/BWBR0007674/2003-01-01
preamble:
  text: |-
    Gelet op richtlijnen nr. 64/433/EEG van de Raad van 26 juni 1964 betreffende de gezondheidsvoorschriften voor de
    produktie en het in de handel brengen van vers vlees (PbEG L 121), 71/118/EEG van de Raad van 15 februari 1971
    inzake gezondheidsvraagstukken op het gebied van de produktie en het in de handel brengen van vers vlees van
    pluimvee (PbEG L 55), 77/99/EEG van 21 december 1976 betreffende de gezondheidsvoorschriften voor de produktie
    en het in de handel brengen van vleesprodukten en bepaalde andere produkten van dierlijke oorsprong (PbEG 1977,
    L 26), 91/495/EEG van 27 november 1990 inzake gezondheidsvoorschriften en veterinairrechtelijke voorschriften
    voor de produktie en het in de handel brengen van konijnevlees en vlees van gekweekt wild (PbEG L 268), 92/45/
    EEG van de Raad van 16 juni 1992 betreffende de gezondheidsvoorschriften en veterinairrechtelijke voorschriften
    voor het doden van vrij wild en het in de handel brengen van vlees van vrij wild (PbEG L 268) en 94/65/EEG van 14
    december 1994 tot vaststelling van voorschriften voor de produktie en het in de handel brengen van gehakt vlees en
    vleesbereidingen (PbEG L 368);

    Voorts gelet op de artikelen 68, eerste lid, en 69, eerste lid, van de Veewet, artikel 19, eerste lid, van de
    Landbouwwet en artikel 30a van de Vleeskeuringswet;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0007674/2003-01-01#ArtikelAanhef
articles:
  - number: I
    text: |-
      In deze regeling wordt onder onderneming verstaan:

      a. een erkende inrichting als bedoeld in de [richtlijnen nrs. 64/433/EEG](31964L0433), [71/118/EEG](31971L0118),
      [77/99/EEG](31977L0099), [91/495/EEG](31991L0495) en [92/45/EEG](31992L0045);

      b. een werkplaats als bedoeld in richtlijn, nr. 94/65/EEG;

      c. een herverpakkingscentrum als bedoeld in [richtlijnen nrs. 64/433/EEG](31964L0433) en [77/99/EEG](31977L0099)
      waar produkten van hun onmiddellijke verpakking worden ontdaan en van een nieuwe onmmiddellijke verpakking worden
      voorzien.
    url: https://wetten.overheid.nl/BWBR0007674/2003-01-01#ArtikelI
  - number: '2'
    text: |-
      Een onderneming stelt personen die vlees en vleesprodukten beroepshalve be- en verwerken en behandelen slechts te
      werk, voor zover:

        - voorafgaand aan de indiensttreding een medisch onderzoek heeft plaatsgevonden en daarvan een verklaring als
      bedoeld in bijlage I wordt overgelegd;
        - een verklaring als bedoeld in bijlage II wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0007674/2003-01-01#Artikel2
    machine_readable:
      execution:
        output:
          - name: mag_te_werken
            type: boolean
        parameters:
          - name: medisch_onderzoek_uitgevoerd
            type: boolean
          - name: verklaring_bijlage_I_overgelegd
            type: boolean
          - name: verklaring_bijlage_II_overgelegd
            type: boolean
        actions:
          - output: mag_te_werken
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $medisch_onderzoek_uitgevoerd
                  value: true
                - operation: EQUALS
                  subject: $verklaring_bijlage_I_overgelegd
                  value: true
                - operation: EQUALS
                  subject: $verklaring_bijlage_II_overgelegd
                  value: true
  - number: '3'
    text: |-
      Wanneer de aan de onderneming verbonden geneeskundige instantie het nodig oordeelt dat degene die betrokken is bij
      de werkzaamheden, bedoeld in [artikel 2][ref1], zich aan een medisch onderzoek onderwerpt, laat de onderneming deze
      persoon weer tot deze werkzaamheden toe voor zover een verklaring als bedoeld in bijlage III wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007674#Artikel2
    url: https://wetten.overheid.nl/BWBR0007674/2003-01-01#Artikel3
    machine_readable:
      execution:
        output:
          - name: mag_weer_te_werken
            type: boolean
        parameters:
          - name: aanvullend_onderzoek_nodig
            type: boolean
          - name: verklaring_bijlage_III_overgelegd
            type: boolean
        actions:
          - output: mag_weer_te_werken
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $aanvullend_onderzoek_nodig
                    value: true
                  then:
                    operation: EQUALS
                    subject: $verklaring_bijlage_III_overgelegd
                    value: true
              default: true
    references:
      - id: ref1
        bwb_id: BWBR0007674
        artikel: '2'
  - number: '4'
    text: |-
      Ten behoeve van de afgifte van de verklaring, bedoeld in de bijlagen I en III, vult degene die in een onderneming
      beroepshalve bij de be- en verwerking en behandeling van het vlees en vleesprodukten betrokken wordt ten overstaan
      van de behandelend arts deel I van de verklaring in.
    url: https://wetten.overheid.nl/BWBR0007674/2003-01-01#Artikel4
  - number: '5'
    text: |-
      De onderneming verleent op verzoek van de ambtenaar, bedoeld in
      [artikel 114, eerste lid, van de Gezondheids- en welzijnswet voor dieren][ref1] inzage in deel II van de
      verklaring, bedoeld in de bijlagen I en III.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0007674/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: '6'
    text: De Regeling gezondheidsverklaring voor personen werkzaam in de vleesindustrie wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007674/2003-01-01#Artikel6
  - number: '7'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst.

      2 Verklaringen die zijn verleend op grond van de Regeling gezondheidsverklaring voor personen werkzaam in de
      vleesindustrie behouden hun geldigheid.
    url: https://wetten.overheid.nl/BWBR0007674/2003-01-01#Artikel7
  - number: '8'
    text: 'Deze regeling kan worden aangehaald als: ''Regeling gezondheidsverklaring personen werkzaam in de vleessector''.'
    url: https://wetten.overheid.nl/BWBR0007674/2003-01-01#Artikel8
