        artikel: '2'
  - number: '5'
    text: |-
      1 In verband met de overgang van de in [artikel 2][ref1] bedoelde geldleningen op de Staat der Nederlanden,
      verkrijgt de Staat der Nederlanden op het tijdstip van inwerkingtreding van dit besluit:

      a. met betrekking tot de geldleningen, aangegaan door het land de Nederlandse Antillen:

      1°. een vordering op het land Curaçao, gelijk aan 74,3 procent van het bedrag van de na sanering resterende
      schuldenlast;

      2°. een vordering op het land Sint Maarten, gelijk aan 17,7 procent van het bedrag van de na sanering resterende
      schuldenlast;

      b. met betrekking tot de geldleningen, aangegaan door het eilandgebied Curaçao of het eilandgebied Sint Maarten:
      een vordering op het land Curaçao, onderscheidenlijk het land Sint Maarten, gelijk aan het bedrag van de na
      sanering resterende schuldenlast.

      2 Het bedrag van de in het eerste lid bedoelde vorderingen wordt vermenigvuldigd met de op grond van
      [artikel 8][ref2] vastgestelde correctiefactor.


      [ref1]: https://wetten.overheid.nl/BWBR0028560#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028560#Artikel8
    url: https://wetten.overheid.nl/BWBR0028560/2010-10-10#Artikel5
    references:
      - id: ref1
