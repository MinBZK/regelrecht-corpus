  - number: '9'
    text: |-
      1 Over het ingevolge [artikel 5][ref1] door het land Curaçao, onderscheidenlijk het land Sint Maarten,
      verschuldigde bedrag is met ingang van de tweede werkdag na de dag waarop dit besluit in werking treedt, rente
      verschuldigd, gelijk aan de wettelijk rente, bedoeld in [artikel 119 van Boek 6 van het Burgerlijk Wetboek][ref2]
      van Nederland.

      2 Betaling van de ingevolge [artikel 5][ref3] verschuldigde bedragen, vermeerderd met de in voorkomend geval op
      grond van het eerste lid verschuldigde rente, geschiedt uiterlijk op de vijftiende werkdag na de dag waarop dit
      besluit in werking treedt, tenzij de landen Nederland en Curaçao, onderscheidenlijk Nederland en Sint Maarten, in
      onderling overleg anders overeenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028560#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel119
      [ref3]: https://wetten.overheid.nl/BWBR0028560#Artikel5
