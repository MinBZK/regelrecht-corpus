  - number: '10'
    text: |-
      1 Indien op of na het tijdstip van inwerkingtreding van dit besluit de Nederlands-Antilliaanse gulden als
      munteenheid van Curaçao wordt vervangen door een andere munteenheid, komen de in [artikel 2][ref1] bedoelde
      geldleningen, voor zover het geldleningen betreft die zijn aangegaan door het land de Nederlandse Antillen of
      het eilandgebied Curaçao, en de in [artikel 5][ref2] bedoelde vorderingen op het land Curaçao, voor zover die
      vorderingen nog niet zijn betaald, te luiden in de nieuwe munteenheid van Curaçao.

      2 Indien op of na het tijdstip van inwerkingtreding van dit besluit de Nederlands-Antilliaanse gulden als
      munteenheid van Sint Maarten wordt vervangen door een andere munteenheid, komen de in [artikel 2][ref3] bedoelde
      geldleningen, voor zover het geldleningen betreft die zijn aangegaan door het eilandgebied Sint Maarten, en de in
      [artikel 5][ref4] bedoelde vorderingen op het land Sint Maarten, voor zover die vorderingen nog niet zijn betaald,
      te luiden in de nieuwe munteenheid van Sint Maarten.

      3 Indien voor de toepassing van het eerste of tweede lid een omrekening van bedragen in Nederlands-Antilliaanse
      guldens naar bedragen in de nieuwe munteenheid nodig is, geschiedt die omrekening overeenkomstig de voor een ieder
      geldende omrekenregels die met het oog op de invoering van de nieuwe munteenheid door de wetgever van Curaçao,
      onderscheidenlijk Sint Maarten, zijn vastgesteld.


