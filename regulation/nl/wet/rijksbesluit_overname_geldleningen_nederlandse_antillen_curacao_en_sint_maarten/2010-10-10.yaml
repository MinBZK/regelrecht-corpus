      - id: ref2
        bwb_id: BWBR0028560
        artikel: '8'
  - number: '6'
    text: |-
      1 De in [artikel 5][ref1] bedoelde vorderingen luiden in Nederlands-Antilliaanse guldens.

      2 Voor zover de geldleningen die ingevolge [artikel 2][ref2] op de Staat der Nederlanden overgaan, in euro luiden,
      wordt van die leningen de tegenwaarde in Nederlands-Antilliaanse guldens bepaald, overeenkomstig de op 31 december
      2005 geldende wisselkoers van EUR 1 = NAf. 2,1011.


      [ref1]: https://wetten.overheid.nl/BWBR0028560#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028560#Artikel2
    url: https://wetten.overheid.nl/BWBR0028560/2010-10-10#Artikel6
    references:
