        artikel: '5'
      - id: ref2
        bwb_id: BWBR0028560
        artikel: '2'
  - number: '7'
    text: |-
      1 De na sanering resterende schuldenlast, bedoeld in [artikel 5, eerste lid][ref1], is het bedrag waarmee de totale
      nominale waarde van de door de desbetreffende entiteit aangegane geldleningen die ingevolge [artikel 2][ref2]
      overgaan op de Staat der Nederlanden, het bedrag waarvoor de Staat der Nederlanden de sanering van de door de
      collectieve sector van die entiteit aangegane geldleningen op zich neemt, te boven gaat.

      2 Het in het eerste lid bedoelde bedrag waarvoor de Staat der Nederlanden de sanering van de door de collectieve
      sector van de desbetreffende entiteit aangegane geldleningen op zich neemt, bedraagt:

      a. voor het land de Nederlandse Antillen: NAf. 1.539.348.403;

      b. voor het eilandgebied Curaçao: NAf. 1.894.555.638;

      c. voor het eilandgebied Sint Maarten: nihil.

      3 Alvorens de in het eerste lid bedoelde na sanering resterende schuldenlast te berekenen worden op de bedragen,
      bedoeld in het tweede lid, onderdelen a en b, de reeds voorafgaande aan de inwerkingtreding van dit besluit
      door de Staat der Nederlanden betaalde aflossingen van geldleningen, aangegaan door de collectieve sector van de
      desbetreffende entiteit, in mindering gebracht.

      4 Het derde lid geldt niet voor aflossingen van in geldleningen omgezette betalingsachterstanden.


      [ref1]: https://wetten.overheid.nl/BWBR0028560#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028560#Artikel2
    url: https://wetten.overheid.nl/BWBR0028560/2010-10-10#Artikel7
