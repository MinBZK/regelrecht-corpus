preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 2 juni 2010, nr. 2010-
    0000343112, Directie Constitutionele Zaken en Wetgeving, gedaan mede namens Onze Minister van Financiën en in
    overeenstemming met de regering van de Nederlandse Antillen en de bestuurscolleges van de eilandgebieden Curaçao en
    Sint Maarten;

    Overwegende dat de regeringen van Nederland en de Nederlandse Antillen, met instemming van de eilandgebieden
    Curaçao, Sint Maarten, Bonaire, Sint Eustatius en Saba, zijn overeengekomen om te bewerkstelligen dat bij de start
    van de nieuwe staatkundige verhoudingen binnen het Koninkrijk sprake is van een gezonde financiële positie van
    de eilanden;

    Dat is overeengekomen dat Nederland in dat kader de verplichting op zich neemt om de per 31 december 2005 bestaande
    schulden van de Nederlandse Antillen, Curaçao en Sint Maarten, met inbegrip van de herfinanciering van die schulden
    en de financiering van de rente op die schulden, tot het niveau van de voor het jaar 2005 geldende rentelastnorm
    te saneren;

    Dat die verplichting is vastgelegd in artikel 31, derde lid, van de Rijkswet financieel toezicht Curaçao en Sint
    Maarten;

    Dat door de Politieke Stuurgroep Staatkundige Veranderingen op 26 november 2008 nadere afspraken zijn gemaakt met
    betrekking tot de sanering van genoemde schulden;

    Dat daarbij met het oog op de positie van de betrokken crediteuren is besloten dat Nederland bij het ingaan van de
    nieuwe staatkundige verhoudingen de resterende hoofdsom van de te saneren schulden overneemt;

    Dat, voor zover de waarde van de over te nemen schulden het door Nederland te saneren bedrag te boven gaat,
    Nederland een direct opeisbare vordering krijgt op de nieuwe landen Curaçao en Sint Maarten, elk voor hun aandeel
    in de boven het saneringsbedrag overgenomen schulden;

    Dat het om redenen van praktische uitvoerbaarheid wenselijk is om een wettelijke regeling tot stand te brengen
    op grond waarvan bedoelde schulden bij het ingaan van de nieuwe staatkundige verhoudingen van rechtswege onder
    algemene titel overgaan op de Staat der Nederlanden;

    Dat het voorts wenselijk is om regels te stellen met betrekking tot de direct opeisbare vorderingen die Nederland
    in verband met de overgang van die schulden krijgt op de nieuwe landen Curaçao en Sint Maarten;

    Gelet op artikel 38, tweede lid, van het Statuut voor het Koninkrijk der Nederlanden;

    De Raad van State van het Koninkrijk gehoord (advies van 30 juni 2010, nr. W04.10.0219/I/K);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 14 september
    2010, nr. 2010-0000596718, Directie Constitutionele Zaken en Wetgeving, uitgebracht mede namens Onze Minister
    van Financiën en in overeenstemming met de regering van de Nederlandse Antillen en de bestuurscolleges van de
    eilandgebieden Curaçao en Sint Maarten;

    De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0028560/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *geldlening:* obligatielening, schatkistpromesse of onderhandse lening;

      b. *collectieve sector:* het land de Nederlandse Antillen, onderscheidenlijk
      het eilandgebied Curaçao of Sint Maarten, tezamen met de ingevolge
      [artikel 23 van het Besluit tijdelijk financieel toezicht Nederlandse Antillen, Curaçao en Sint Maarten][ref1] als
      behorend tot de collectieve sector van het land, onderscheidenlijk eilandgebied, aangewezen rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0024823#Artikel23
    url: https://wetten.overheid.nl/BWBR0028560/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024823
        artikel: '23'
  - number: '2'
    text: |-
      De door het land de Nederlandse Antillen, het eilandgebied Curaçao of het eilandgebied Sint Maarten aangegane
      geldleningen en de daaruit voortvloeiende rechten en verplichtingen gaan, voor zover die leningen op het tijdstip
      van inwerkingtreding van dit besluit nog niet of niet volledig zijn afgelost, met ingang van dat tijdstip over op
      de Staat der Nederlanden, zonder dat daarvoor een nadere akte wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028560/2010-10-10#Artikel2
  - number: '3'
    text: |-
      Na de overgang van de in [artikel 2][ref1] bedoelde geldleningen blijft op die leningen het recht van de
      Nederlandse Antillen, zoals dat onmiddellijk voorafgaande aan het tijdstip van inwerkingtreding van dit besluit
      luidde, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028560#Artikel2
    url: https://wetten.overheid.nl/BWBR0028560/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028560
        artikel: '2'
  - number: '4'
    text: |-
      1 Behoudens de gevallen, bedoeld in [artikel 63 van de Rijkswet Gemeenschappelijk Hof van Justitie][ref1], is het
      Gerecht in eerste aanleg van Curaçao bevoegd tot kennisneming van geschillen ter zake van de in [artikel 2][ref2]
      bedoelde geldleningen, voor zover het betreft geldleningen die zijn aangegaan door het land de Nederlandse Antillen
      of het eilandgebied Curaçao, en is het Gerecht in eerste aanleg van Sint Maarten bevoegd tot kennisneming van
      geschillen, voor zover het betreft geldleningen die zijn aangegaan door het eilandgebied Sint Maarten.

      2 Indien ten tijde van de inwerkingtreding van dit besluit het land de Nederlandse Antillen, het eilandgebied
      Curaçao of het eilandgebied Sint Maarten als partij betrokken is bij een geschil of rechtsgeding ter zake van een
      in [artikel 2][ref3] bedoelde geldlening, treedt na de inwerkingtreding van dit besluit de Staat der Nederlanden
      als partij in de plaats van het land de Nederlandse Antillen, onderscheidenlijk het eilandgebied Curaçao of het
      eilandgebied Sint Maarten.

      3 Ten aanzien van rechtsgedingen als bedoeld in het tweede lid, is de elfde afdeling van de tweede titel van
      het eerste boek van het Wetboek van Burgerlijke Rechtsvordering van de Nederlandse Antillen, zoals die afdeling
      onmiddellijk voorafgaande aan het tijdstip van inwerkingtreding van dit besluit luidde, van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0028560#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0028560#Artikel2
    url: https://wetten.overheid.nl/BWBR0028560/2010-10-10#Artikel4
    references:
      - id: ref1
