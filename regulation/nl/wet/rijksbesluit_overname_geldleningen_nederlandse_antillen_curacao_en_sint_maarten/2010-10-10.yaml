        artikel: '2'
  - number: '8'
    text: |-
      1 De correctiefactor, bedoeld in [artikel 5, tweede lid][ref1], is gelijk aan het volgende quotiënt: de contante
      waarde van alle door de betrokken entiteit in Nederlands-Antilliaanse guldens aangegane geldleningen die ingevolge
      [artikel 2][ref2] overgaan op de Staat der Nederlanden, gedeeld door de nominale waarde van die leningen.

      2 De contante waarde van de in het eerste lid bedoelde geldleningen is de som van alle uit die leningen
      voortvloeiende, per kalenderjaar contant gemaakte rente- en aflossingsverplichtingen. Als discontovoet worden de
      op het tijdstip van inwerkingtreding van dit besluit geldende renten, behorende bij in euro uitgegeven Nederlandse
      staatsleningen met vergelijkbare resterende looptijden, genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028560#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028560#Artikel2
    url: https://wetten.overheid.nl/BWBR0028560/2010-10-10#Artikel8
