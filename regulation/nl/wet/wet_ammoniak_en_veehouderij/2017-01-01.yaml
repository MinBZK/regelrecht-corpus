    text: |-
      1 Provinciale staten wijzen de gebieden aan die als zeer kwetsbaar gebied worden aangemerkt.

      2 Alleen voor verzuring gevoelige gebieden, of delen daarvan, die zijn gelegen in de ecologische hoofdstructuur
      kunnen als zeer kwetsbaar gebied worden aangewezen.

      3 Provinciale staten wijzen, onverminderd het tweede lid, alle voor verzuring gevoelige gebieden binnen een Natura
      2000-gebied of een bijzonder nationaal natuurgebied als bedoeld in de [Wet natuurbescherming][ref1] aan als zeer
      kwetsbaar gebied.

      4 Bij de aanwijzing van gebieden, anders dan bedoeld in het derde lid, als zeer kwetsbaar gebied houden provinciale
      staten uitsluitend rekening met de volgende aspecten:

      a. de gevoeligheid van het voor verzuring gevoelige gebied voor de effecten van ammoniak;

      b. de in het voor verzuring gevoelige gebied aanwezige natuurwaarden;

      c. de ecologische samenhang binnen het voor verzuring gevoelige gebied of van dat gebied met een of meer andere
      gebieden die als zeer kwetsbaar gebied worden aangewezen;

      d. de grootte van het voor verzuring gevoelige gebied;

      e. de gevolgen van de aanwijzing voor bestaande veehouderijen, voorzover de ecologische samenhang tussen de zeer
      kwetsbare gebieden daardoor niet wordt aangetast en geen verlies van bijzondere natuurwaarden optreedt.

      5 Aanwijzing van een gebied als bedoeld in het vierde lid, kleiner dan 50 ha vindt slechts plaats indien het een
      gebied met zeer grote natuurwaarden betreft.

      6 Een gebied kan slechts worden aangemerkt als gebied met zeer grote natuurwaarden als bedoeld in het vijfde lid
      indien:

      a. in het gebied meer dan een soort aanwezig is die is opgenomen in bijlage II van richtlijn (EEG) nr. 92/43 of op
      een krachtens [artikel 1.5, vierde lid, van de Wet natuurbescherming][ref2] vastgestelde lijst en deze soorten of
      hun leefomgeving zeer gevoelig zijn voor de effecten van ammoniak;

      b. het gebied door gedeputeerde staten, in overeenstemming met de lokale en regionale organisaties op het terrein
      van natuur en landbouw die naar het oordeel van gedeputeerde staten representatief zijn alsmede met de colleges van
      burgemeester en wethouders van de gemeenten waartoe het betreffende gebied behoort, is voorgesteld om als zodanig
      te worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0037552
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel1.5
