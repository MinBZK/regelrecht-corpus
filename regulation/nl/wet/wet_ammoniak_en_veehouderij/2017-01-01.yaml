  - number: '6'
    text: |-
      Een omgevingsvergunning voor het veranderen van een veehouderij wordt geweigerd, indien de aanvraag betrekking
      heeft op een uitbreiding van het aantal dieren van een of meer diercategorieën en een tot de veehouderij behorend
      dierenverblijf geheel of gedeeltelijk is gelegen in een zeer kwetsbaar gebied, dan wel in een zone van 250 meter
      rond een zodanig gebied.
    url: https://wetten.overheid.nl/BWBR0013402/2017-01-01#Artikel6
  - number: '7'
    text: |-
      1 In afwijking van [artikel 6][ref1] wordt de omgevingsvergunning niet geweigerd, voorzover:

      a. de ammoniakemissie uit de dierenverblijven na de uitbreiding niet meer bedraagt dan de ammoniakemissie die de
      veehouderij voorafgaand aan de uitbreiding:

      1°. zou mogen veroorzaken indien de emissie per dierplaats gelijk zou zijn aan de maximale emissiewaarde, of

      2°. op grond van eerder verleende nog geldende vergunningen mocht veroorzaken, indien deze lager is dan de
      ammoniakemissie, als bedoeld onder 1°, of

      b. in de veehouderij onmiddellijk voorafgaand aan het vervallen van de Interimwet ammoniak en veehouderij
      melkrundvee werd gehouden, de uitbreiding uitsluitend melkrundvee betreft en de ammoniakemissie na uitbreiding
      niet meer bedraagt dan de ammoniakemissie die een melkrundveehouderij met 200 stuks melkvee en 140 stuks vrouwelijk
      jongvee zou veroorzaken, indien de ammoniakemissie per dierplaats gelijk zou zijn aan de maximale emissiewaarde,

      c. de uitbreiding schapen of paarden betreft,

      d. de uitbreiding dieren betreft die worden gehouden overeenkomstig de regels die krachtens
      [artikel 2 van de Landbouwkwaliteitswet][ref2] zijn gesteld ten aanzien van de biologische productiemethoden, of

      e. de uitbreiding dieren betreft die worden gehouden uitsluitend of in hoofdzaak ten behoeve van natuurbeheer.

      2 Voor het bepalen van de ammoniakemissie uit de dierenverblijven die de veehouderij voorafgaand aan de uitbreiding
      zou mogen veroorzaken, wordt de ammoniakemissie van de dieren waarvoor eerder omgevingsvergunning is verleend met
      toepassing van het eerste lid, onder b tot en met e, dan wel [artikel 5, eerste lid, onder c tot en met f][ref3],
      niet meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002755#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013402#Artikel5
    url: https://wetten.overheid.nl/BWBR0013402/2017-01-01#Artikel7
