  - number: '4'
    text: |-
      Een omgevingsvergunning voor het oprichten van een veehouderij wordt geweigerd, indien een tot de veehouderij
      behorend dierenverblijf geheel of gedeeltelijk is gelegen in een zeer kwetsbaar gebied, dan wel in een zone van 250
      meter rond een zodanig gebied.
    url: https://wetten.overheid.nl/BWBR0013402/2017-01-01#Artikel4
  - number: '5'
    text: |-
      1 In afwijking van [artikel 4][ref1] wordt een omgevingsvergunning niet geweigerd met het oog op de ammoniakemissie
      uit de tot de veehouderij behorende dierenverblijven, indien de veehouderij al was opgericht en onmiddellijk
      voorafgaand aan het ontstaan van de vergunningplicht onder de werking van een algemene maatregel van bestuur
      krachtens [artikel 8.40 van de Wet milieubeheer][ref2] viel, en:

      a. het aantal dieren per diercategorie niet hoger is dan overeenkomstig de betrokken algemene maatregel van bestuur
      onmiddellijk voorafgaand aan het ontstaan van de vergunningplicht aanwezig mocht zijn,

      b. het aantal dieren van een of meer diercategorieën hoger is dan het aantal, bedoeld onder a, maar de
      ammoniakemissie niet meer bedraagt dan de ammoniakemissie uit de tot de veehouderij behorende dierenverblijven die
      de veehouderij onmiddellijk voorafgaand aan het ontstaan van de vergunningplicht zou mogen veroorzaken, indien de
      emissie per dierplaats gelijk zou zijn aan de maximale emissiewaarde,

      c. de veehouderij onmiddellijk voorafgaand aan het vervallen van de Interimwet ammoniak en veehouderij een
      melkrundveehouderij was, van uitsluitend melkrundvee het aantal dieren hoger is dan het aantal bedoeld onder a, en
      de ammoniakemissie na de uitbreiding niet meer bedraagt dan de ammoniakemissie die een melkrundveehouderij met 200
      stuks melkvee en 140 stuks vrouwelijk jongvee in geval van oprichting zou veroorzaken, indien de ammoniakemissie
      per dierplaats gelijk zou zijn aan de maximale emissiewaarde,

      d. het aantal schapen of paarden hoger is dan bedoeld onder a,

      e. het aantal dieren dat wordt gehouden overeenkomstig de regels die krachtens
      [artikel 2 van de Landbouwkwaliteitswet][ref3] zijn gesteld ten aanzien van de biologische productiemethoden, hoger
      is dan bedoeld onder a, of

      f. het aantal dieren dat wordt gehouden uitsluitend of in hoofdzaak ten behoeve van natuurbeheer, hoger is dan
      bedoeld onder a.

      2 In afwijking van [artikel 4, eerste lid][ref4], wordt een omgevingsvergunning eveneens niet geweigerd, indien in
      de veehouderij dieren worden gehouden uitsluitend of in hoofdzaak ten behoeve van natuurbeheer.


