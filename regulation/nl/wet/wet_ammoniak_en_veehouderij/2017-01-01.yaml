preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen met betrekking tot beslissingen
    inzake vergunningen krachtens de Wet milieubeheer, voorzover het betreft de ammoniakemissie uit dierenverblijven
    van veehouderijen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013402/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      *ammoniakemissie:* emissie van ammoniak, uitgedrukt in kg NH per jaar;

      *beste beschikbare technieken*: beste beschikbare technieken als bedoeld in
      [artikel 1.1 van de Wet algemene bepalingen omgevingsrecht][ref1];

      *dierenverblijf:* al dan niet overdekte ruimte waarbinnen dieren worden gehouden;

      *dierplaats:* deel van een huisvestingssysteem, bestemd voor het houden van één dier;

      *ecologische hoofdstructuur:* ecologische hoofdstructuur, als bedoeld in het Natuurbeleidsplan (Kamerstukken
      II 1989/90, 21 149, nrs. 2–3), zoals deze is begrensd door het provinciaal bestuur, of, voorzover deze
      begrenzing nog niet heeft plaatsgevonden, zoals deze is aangegeven in een structuurvisie als bedoeld in
      [artikel 2.3 van de Wet ruimtelijke ordening][ref2], dan wel bij of krachtens een algemene maatregel van bestuur
      als bedoeld in [artikel 4.3 van die wet][ref3];

      *emissiefactor:* bij ministeriële regeling vastgestelde ammoniakemissie per dierplaats, behorende bij een daarbij
      aangewezen diercategorie en huisvestingssysteem;

      *IPPC-installatie*: installatie als bedoeld in [artikel 1.1 van de Wet algemene bepalingen omgevingsrecht][ref4];

      *huisvestingssysteem:* gedeelte van een dierenverblijf, waarin dieren van één diercategorie op dezelfde wijze
      worden gehouden;

      *maximale emissiewaarde:*ammoniakemissie per dierplaats, die ingevolge een voorschrift gesteld krachtens
      [artikel 8.40 van de Wet milieubeheer][ref5] bij een diercategorie ten hoogste mag plaatsvinden;

      *melkrundvee:*

      1°. melkvee met bijbehorend vrouwelijk jongvee, dat overwegend wordt gehouden voor de melkproductie, met inbegrip
      van dieren die in de mestperiode worden gemolken, tijdens de lactatie worden gemest dan wel zijn drooggezet en
      worden afgemest, en

      2°. vrouwelijk vleesvee ouder dan 2 jaar met bijbehorend vrouwelijk jongvee, dat op een met melkvee vergelijkbare
      manier wordt gehouden voor de vleesproductie en het voortbrengen en zogen van kalveren;

      *melkrundveehouderij:* veehouderij die uitsluitend of in hoofdzaak is bestemd voor het bedrijfsmatig houden van
      melkrundvee;

      *omgevingsvergunning:* vergunning voor een activiteit met betrekking tot een inrichting als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref6];

      *Onze Minister:* Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      *richtlijn (EEG) nr. 92/43*: richtlijn nr. 92/43/EEG van de Raad van de Europese Gemeenschappen van 21 mei 1992
      inzake de instandhouding van de natuurlijke habitats en de wilde flora en fauna (PbEG L 206);

      *veehouderij:* inrichting, die tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref7] aangewezen
      categorie behoort en is bestemd voor het kweken, fokken, mesten, houden, verhandelen, verladen of wegen van dieren;

      *voor verzuring gevoelig gebied*: gebied dat onmiddellijk voorafgaand aan het tijdstip van het vervallen van de
      Interimwet ammoniak en veehouderij als voor verzuring gevoelig was aangemerkt krachtens artikel 1, tweede lid, van
      die wet, met dien verstande dat:

      a. een gebied dat op grond van artikel 2, eerste lid, onder b, van de Uitvoeringsregeling ammoniak en veehouderij
      als voor verzuring gevoelig gebied was aangewezen bij een verordening die tegelijk met voornoemde wet is vervallen,
      niet als voor verzuring gevoelig wordt aangemerkt, en

      b. een gebied waarop voor 1 januari 2002 een convenant als bedoeld in artikel 3, eerste lid, onder b, van de
      Uitvoeringsregeling ammoniak en veehouderij van toepassing was, niet als voor verzuring gevoelig wordt aangemerkt.

      2 Voor de berekening van de ammoniakemissie van een veehouderij wordt het aantal dieren dat in de veehouderij
      aanwezig mag zijn, vermenigvuldigd met de emissiefactoren.

      3 Totdat een algemene maatregel van bestuur krachtens [artikel 8.40 van de Wet milieubeheer][ref8], waarbij
      maximale emissiewaarden zijn vastgesteld, van kracht is, geldt voor de toepassing van deze wet als maximale
      emissiewaarde de waarde die als zodanig is vastgesteld bij ministeriële regeling. Voor een diercategorie waarvoor
      geen maximale emissiewaarde is vastgesteld, geldt als maximale emissiewaarde de emissiefactor behorende bij het
      betrokken huisvestingssysteem.


