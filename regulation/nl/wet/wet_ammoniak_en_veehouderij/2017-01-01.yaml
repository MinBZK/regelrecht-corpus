  - number: '3'
    text: |-
      1 Bij beslissingen inzake de omgevingsvergunning voor de oprichting of verandering van een veehouderij betrekt het
      bevoegd gezag de gevolgen van ammoniakemissie uit de tot de veehouderij behorende dierenverblijven uitsluitend op
      de wijze die is aangegeven bij of krachtens de [artikelen 4 tot en met 7][ref1].

      2 Het eerste lid geldt niet voor de gevolgen voor het milieu die veroorzaakt worden door directe opname uit de
      lucht van ammoniak door planten en bomen.

      3 Het eerste lid geldt evenmin voor het weigeren van de omgevingsvergunning op de grond dat door verlening daarvan
      niet aan artikel [2.14, eerste lid, onder c, onder 1°, van de Wet algemene bepalingen omgevingrecht][ref2]
      kan worden voldaan en voor voorschriften die met toepassing van het bepaalde krachtens
      [artikel 2.22, derde lid, van die wet][ref3] of [artikel 1.3c][ref4] of [8.40 van de Wet milieubeheer][ref5]
      worden gesteld om te bereiken dat in de veehouderij ten minste de voor de veehouderij in aanmerking komende
      beste beschikbare technieken worden toegepast. Daarbij geldt dat de vergunningverlening wordt beoordeeld naar de
      overeenstemming van de som van de ammoniakemissies uit de tot de inrichting behorende dierenverblijven met de som
      van de ammoniakemissies die zijn toegestaan bij een beoordeling per afzonderlijk huisvestingssysteem, met dien
      verstande dat een huisvestingssysteem dat op 1 januari 2007 nog niet in de veehouderij aanwezig was, afzonderlijk
      aan de voorschriften voldoet. Voorzover de voorschriften betrekking hebben op IPPC-installatie wordt de vergunning
      eveneens geweigerd indien niet kan worden voldaan aan voorschriften die vanwege de technische kenmerken en de
      geografische ligging van de installatie of vanwege de plaatselijke milieuomstandigheden moeten worden gesteld, maar
      die niet met toepassing van de in aanmerking komende beste beschikbare technieken kunnen worden gerealiseerd.

      4 Het eerste lid geldt – onverminderd [artikel 7][ref6] – evenmin bij het nemen van een besluit als bedoeld in
      [artikel 7.35 van de Wet milieubeheer][ref7] met betrekking tot een veehouderij, bij de voorbereiding waarvan
      krachtens [hoofdstuk 7 van de Wet milieubeheer][ref8] een milieueffectrapport dient te worden gemaakt.


