  - number: 2a
    text: |-
      1 Een besluit als bedoeld in [artikel 2, eerste lid][ref1], wordt voorbereid door gedeputeerde staten met
      toepassing van de in [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] geregelde procedure.

      2 Bij de voorbereiding van een besluit als bedoeld in [artikel 2, eerste lid][ref3], plegen gedeputeerde staten
      in ieder geval overleg met de lokale en regionale organisaties op het terrein van natuur en landbouw die naar het
      oordeel van gedeputeerde staten representatief zijn alsmede met de colleges van burgemeester en wethouders van de
      gemeenten waartoe het gebied waarop het besluit betrekking heeft, behoort.

      3 Een besluit als bedoeld in [artikel 2, eerste lid][ref4], gaat vergezeld van een of meer kaarten waarop de
      begrenzing van de zeer kwetsbare gebieden nauwkeurig wordt aangegeven.

      4 Indien de begrenzing van de ecologische hoofdstructuur of van binnen een Natura 2000-gebied of een bijzonder
      nationaal natuurgebied als bedoeld in de [Wet natuurbescherming][ref5] wordt gewijzigd, wijzigen provinciale staten
      het in [artikel 2, eerste lid][ref6], bedoelde besluit, voor zover dat noodzakelijk is om te voldoen aan artikel 2.
      Op de wijziging van het besluit zijn het eerste tot en met derde lid van overeenkomstige toepassing.


