        artikel: '1'
  - number: '1.2'
    text: |-
      Voor de berekening van de ammoniakemissie van een veehouderij wordt het aantal dieren dat in de veehouderij
      aanwezig mag zijn, vermenigvuldigd met de emissiefactoren.
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel1
  - number: '1.3'
    text: |-
      Totdat een algemene maatregel van bestuur krachtens [artikel 8.40 van de Wet milieubeheer][ref1], waarbij maximale
      emissiewaarden zijn vastgesteld, van kracht is, geldt voor de toepassing van deze wet als maximale emissiewaarde
      de waarde die als zodanig is vastgesteld bij ministeriële regeling. Voor een diercategorie waarvoor geen maximale
      emissiewaarde is vastgesteld, geldt als maximale emissiewaarde de emissiefactor behorende bij het betrokken
      huisvestingssysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '2.1'
    text: Provinciale staten wijzen de gebieden aan die als zeer kwetsbaar gebied worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2
  - number: '2.2'
    text: |-
      Alleen voor verzuring gevoelige gebieden, of delen daarvan, die zijn gelegen in de ecologische hoofdstructuur
      kunnen als zeer kwetsbaar gebied worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2
  - number: '2.3'
    text: |-
      Provinciale staten wijzen, onverminderd het tweede lid, alle voor verzuring gevoelige
      gebieden binnen een beschermd gebied als bedoeld in [artikel 10, eerste lid][ref1], of
      [artikel 10a, eerste lid, van de Natuurbeschermingswet 1998][ref2] dan wel binnen een gebied dat op grond van
      artikel 4 van richtlijn (EEG) nr. 92/43 van communautair belang is verklaard, aan als zeer kwetsbaar gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 10a
  - number: '2.4'
    text: |-
      Bij de aanwijzing van gebieden, anders dan bedoeld in het derde lid, als zeer kwetsbaar gebied houden provinciale
      staten uitsluitend rekening met de volgende aspecten:
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2
  - number: 2.4.a
    text: de gevoeligheid van het voor verzuring gevoelige gebied voor de effecten van ammoniak;
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2
  - number: 2.4.b
    text: de in het voor verzuring gevoelige gebied aanwezige natuurwaarden;
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2
  - number: 2.4.c
    text: |-
      de ecologische samenhang binnen het voor verzuring gevoelige gebied of van dat gebied met een of meer andere
      gebieden die als zeer kwetsbaar gebied worden aangewezen;
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2
  - number: 2.4.d
    text: de grootte van het voor verzuring gevoelige gebied;
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2
  - number: 2.4.e
    text: |-
      de gevolgen van de aanwijzing voor bestaande veehouderijen, voorzover de ecologische samenhang tussen de zeer
      kwetsbare gebieden daardoor niet wordt aangetast en geen verlies van bijzondere natuurwaarden optreedt.
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2
  - number: '2.5'
    text: |-
      Aanwijzing van een gebied als bedoeld in het vierde lid, kleiner dan 50 ha vindt slechts plaats indien het een
      gebied met zeer grote natuurwaarden betreft.
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2
  - number: '2.6'
    text: |-
      Een gebied kan slechts worden aangemerkt als gebied met zeer grote natuurwaarden als bedoeld in het vijfde lid
      indien:
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2
  - number: 2.6.a
    text: |-
      in het gebied meer dan een soort aanwezig is die is opgenomen in bijlage II van richtlijn (EEG) nr. 92/43 of in de
      [bijlage bij het Besluit Rode Lijsten flora en fauna](onbekend) en deze soorten of hun leefomgeving zeer gevoelig
      zijn voor de effecten van ammoniak;
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2
  - number: 2.6.b
    text: |-
      het gebied is aangewezen als beschermde leefomgeving krachtens [artikel 19 van de Flora- en faunawet][ref1] en deze
      leefomgeving zeer gevoelig is voor de effecten van ammoniak, of


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel19
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '19'
  - number: 2.6.c
    text: |-
      het gebied door gedeputeerde staten, in overeenstemming met de lokale en regionale organisaties op het terrein van
      natuur en landbouw die naar het oordeel van gedeputeerde staten representatief zijn alsmede met de colleges van
      burgemeester en wethouders van de gemeenten waartoe het betreffende gebied behoort, is voorgesteld om als zodanig
      te worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2
  - number: 2a.1
    text: |-
      Een besluit als bedoeld in [artikel 2, eerste lid][ref1], wordt voorbereid door gedeputeerde staten met toepassing
      van de in [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] geregelde procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 2a.2
    text: |-
      Bij de voorbereiding van een besluit als bedoeld in [artikel 2, eerste lid][ref1], plegen gedeputeerde staten in
      ieder geval overleg met de lokale en regionale organisaties op het terrein van natuur en landbouw die naar het
      oordeel van gedeputeerde staten representatief zijn alsmede met de colleges van burgemeester en wethouders van de
      gemeenten waartoe het gebied waarop het besluit betrekking heeft, behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel2
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '2'
  - number: 2a.3
    text: |-
      Een besluit als bedoeld in [artikel 2, eerste lid][ref1], gaat vergezeld van een of meer kaarten waarop de
      begrenzing van de zeer kwetsbare gebieden nauwkeurig wordt aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel2
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '2'
  - number: 2a.4
    text: |-
      Een besluit als bedoeld in [artikel 2, eerste lid][ref1], behoeft de goedkeuring van Onze Minister van Landbouw,
      Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel2
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '2'
  - number: 2a.5
    text: |-
      Tegen een besluit als bedoeld in [artikel 2, eerste lid][ref1], staat beroep open bij de Afdeling
      bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel2
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '2'
  - number: 2a.6
    text: |-
      Het besluit tot goedkeuring, bedoeld in het vierde lid, maakt voor de toepassing van het vijfde lid deel uit van
      het daaraan ten grondslag liggende besluit als bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel2
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '2'
  - number: 2a.7
    text: |-
      Indien de begrenzing van de ecologische hoofdstructuur of van een beschermd gebied als bedoeld in
      [artikel 10, eerste lid][ref1], of [artikel 10a, eerste lid, van de Natuurbeschermingswet 1998][ref2] wordt
      gewijzigd, wijzigen provinciale staten het in [artikel 2, eerste lid][ref3], bedoelde besluit, voorzover dat
      noodzakelijk is om te voldoen aan [artikel 2][ref4]. Op de wijziging van het besluit zijn het eerste tot en met
      derde en het vijfde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0013402#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0013402#Artikel2
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 10a
      - id: ref3
        bwb_id: BWBR0013402
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0013402
        artikel: '2'
  - number: '3.1'
    text: |-
      Bij beslissingen inzake de omgevingsvergunning voor de oprichting of verandering van een veehouderij betrekt het
      bevoegd gezag de gevolgen van ammoniakemissie uit de tot de veehouderij behorende dierenverblijven uitsluitend op
      de wijze die is aangegeven bij of krachtens de [artikelen 4 tot en met 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel4
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '4'
  - number: '3.2'
    text: |-
      Het eerste lid geldt niet voor de gevolgen voor het milieu die veroorzaakt worden door directe opname uit de lucht
      van ammoniak door planten en bomen.
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel3
  - number: '3.3'
    text: |-
      Het eerste lid geldt evenmin voor het stellen van voorschriften met toepassing van het bepaalde bij of krachtens
      [artikel 2.22, tweede of derde lid, van de Wet algemene bepalingen omgevingsrecht][ref1] of [artikel 1.3c][ref2]
      of [8.40 van de Wet milieubeheer][ref3] en het weigeren van de omgevingsvergunning met toepassing van
      [artikel 2.14 van de Wet algemene bepalingen omgevingsrecht][ref4]. Daarbij geldt dat de vergunningverlening
      wordt beoordeeld naar de overeenstemming van de som van de ammoniakemissies uit de tot de inrichting behorende
      dierenverblijven met de som van de ammoniakemissies die zijn toegestaan bij een beoordeling per afzonderlijk
      huisvestingssysteem, met dien verstande dat een huisvestingssysteem dat op 1 januari 2007 nog niet in de
      veehouderij aanwezig was, afzonderlijk aan de voorschriften voldoet. Voorzover de voorschriften betrekking hebben
      op gpbv-installaties wordt de vergunning eveneens geweigerd indien niet kan worden voldaan aan voorschriften
      die vanwege de technische kenmerken en de geografische ligging van de installatie of vanwege de plaatselijke
      milieuomstandigheden moeten worden gesteld, maar die niet met toepassing van de in aanmerking komende beste
      beschikbare technieken kunnen worden gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '3.4'
    text: |-
      Het eerste lid geldt – onverminderd [artikel 7][ref1] – evenmin bij het nemen van een besluit als bedoeld in
      [artikel 7.35 van de Wet milieubeheer][ref2] met betrekking tot een veehouderij, bij de voorbereiding waarvan
      krachtens [hoofdstuk 7 van de Wet milieubeheer][ref3] een milieueffectrapport dient te worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003245
        hoofdstuk: '7'
  - number: '4'
    text: |-
      Een omgevingsvergunning voor het oprichten van een veehouderij wordt geweigerd, indien een tot de veehouderij
      behorend dierenverblijf geheel of gedeeltelijk is gelegen in een zeer kwetsbaar gebied, dan wel in een zone van 250
      meter rond een zodanig gebied.
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel4
  - number: '5.1'
    text: |-
      In afwijking van [artikel 4][ref1] wordt een omgevingsvergunning niet geweigerd met het oog op de ammoniakemissie
      uit de tot de veehouderij behorende dierenverblijven, indien de veehouderij al was opgericht en onmiddellijk
      voorafgaand aan het ontstaan van de vergunningplicht onder de werking van een algemene maatregel van bestuur
      krachtens [artikel 8.40 van de Wet milieubeheer][ref2] viel, en:


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 5.1.a
    text: |-
      het aantal dieren per diercategorie niet hoger is dan overeenkomstig de betrokken algemene maatregel van bestuur
      onmiddellijk voorafgaand aan het ontstaan van de vergunningplicht aanwezig mocht zijn,
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel5
  - number: 5.1.b
    text: |-
      het aantal dieren van een of meer diercategorieën hoger is dan het aantal, bedoeld onder a, maar de ammoniakemissie
      niet meer bedraagt dan de ammoniakemissie uit de tot de veehouderij behorende dierenverblijven die de veehouderij
      onmiddellijk voorafgaand aan het ontstaan van de vergunningplicht zou mogen veroorzaken, indien de emissie per
      dierplaats gelijk zou zijn aan de maximale emissiewaarde,
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel5
  - number: 5.1.c
    text: |-
      de veehouderij onmiddellijk voorafgaand aan het vervallen van de Interimwet ammoniak en veehouderij een
      melkrundveehouderij was, van uitsluitend melkrundvee het aantal dieren hoger is dan het aantal bedoeld onder a, en
      de ammoniakemissie na de uitbreiding niet meer bedraagt dan de ammoniakemissie die een melkrundveehouderij met 200
      stuks melkvee en 140 stuks vrouwelijk jongvee in geval van oprichting zou veroorzaken, indien de ammoniakemissie
      per dierplaats gelijk zou zijn aan de maximale emissiewaarde,
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel5
  - number: 5.1.d
    text: het aantal schapen of paarden hoger is dan bedoeld onder a,
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel5
  - number: 5.1.e
    text: |-
      het aantal dieren dat wordt gehouden overeenkomstig de regels die krachtens
      [artikel 2 van de Landbouwkwaliteitswet][ref1] zijn gesteld ten aanzien van de biologische productiemethoden, hoger
      is dan bedoeld onder a, of


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel2
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '2'
  - number: 5.1.f
    text: |-
      het aantal dieren dat wordt gehouden uitsluitend of in hoofdzaak ten behoeve van natuurbeheer, hoger is dan bedoeld
      onder a.
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van [artikel 4, eerste lid][ref1], wordt een omgevingsvergunning eveneens niet geweigerd, indien in de
      veehouderij dieren worden gehouden uitsluitend of in hoofdzaak ten behoeve van natuurbeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel4
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '4'
  - number: '6'
    text: |-
      Een omgevingsvergunning voor het veranderen van een veehouderij wordt geweigerd, indien de aanvraag betrekking
      heeft op een uitbreiding van het aantal dieren van een of meer diercategorieën en een tot de veehouderij behorend
      dierenverblijf geheel of gedeeltelijk is gelegen in een zeer kwetsbaar gebied, dan wel in een zone van 250 meter
      rond een zodanig gebied.
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel6
  - number: '7.1'
    text: |-
      In afwijking van [artikel 6][ref1] wordt de omgevingsvergunning niet geweigerd, voorzover:


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel6
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '6'
  - number: 7.1.a
    text: |-
      de ammoniakemissie uit de dierenverblijven na de uitbreiding niet meer bedraagt dan de ammoniakemissie die de
      veehouderij voorafgaand aan de uitbreiding:
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel7
  - number: 7.1.a.1°
    text: zou mogen veroorzaken indien de emissie per dierplaats gelijk zou zijn aan de maximale emissiewaarde, of
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel7
  - number: 7.1.a.2°
    text: |-
      op grond van eerder verleende nog geldende vergunningen mocht veroorzaken, indien deze lager is dan de
      ammoniakemissie, als bedoeld onder 1°, of
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel7
  - number: 7.1.b
    text: |-
      in de veehouderij onmiddellijk voorafgaand aan het vervallen van de Interimwet ammoniak en veehouderij melkrundvee
      werd gehouden, de uitbreiding uitsluitend melkrundvee betreft en de ammoniakemissie na uitbreiding niet meer
      bedraagt dan de ammoniakemissie die een melkrundveehouderij met 200 stuks melkvee en 140 stuks vrouwelijk jongvee
      zou veroorzaken, indien de ammoniakemissie per dierplaats gelijk zou zijn aan de maximale emissiewaarde,
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel7
  - number: 7.1.c
    text: de uitbreiding schapen of paarden betreft,
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel7
  - number: 7.1.d
    text: |-
      de uitbreiding dieren betreft die worden gehouden overeenkomstig de regels die krachtens
      [artikel 2 van de Landbouwkwaliteitswet][ref1] zijn gesteld ten aanzien van de biologische productiemethoden, of


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel2
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '2'
  - number: 7.1.e
    text: de uitbreiding dieren betreft die worden gehouden uitsluitend of in hoofdzaak ten behoeve van natuurbeheer.
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel7
  - number: '7.2'
    text: |-
      Voor het bepalen van de ammoniakemissie uit de dierenverblijven die de veehouderij voorafgaand aan de uitbreiding
      zou mogen veroorzaken, wordt de ammoniakemissie van de dieren waarvoor eerder omgevingsvergunning is verleend met
      toepassing van het eerste lid, onder b tot en met e, dan wel [artikel 5, eerste lid, onder c tot en met f][ref1],
      niet meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0013402#Artikel5
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013402
        artikel: '5'
  - number: '8'
    text: |-
      [Artikel 3.10, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref1] is niet van toepassing op het
      veranderen van een veehouderij, indien het veranderen betrekking heeft op een uitbreiding van het aantal dieren
      van een of meer diercategorieën en een tot de veehouderij behorend dierenverblijf na de uitbreiding geheel of
      gedeeltelijk is gelegen in een zeer kwetsbaar gebied, dan wel in een zone van 250 meter rond een zodanig gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
  - number: '9'
    text: |-
      Een ministeriële regeling krachtens deze wet wordt vastgesteld door Onze Minister in overeenstemming met Onze
      Minister van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel9
  - number: '10'
    text: |-
      Indien de aanvraag van een vergunning voor een veehouderij is ingediend voor 8 december 2000 blijft het voor dat
      tijdstip geldende recht van toepassing tot het tijdstip waarop de beschikking op de aanvraag onherroepelijk is
      geworden.
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel10
  - number: '11'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel11
  - number: '12'
    text: 'Deze wet wordt aangehaald als: Wet ammoniak en veehouderij.'
    url: https://wetten.overheid.nl/BWBR0013402/2010-10-01#Artikel12
