  - number: '2'
    text: |-
      1 Indien ten aanzien van hetzelfde kind over eenzelfde tijdvak in Nederland recht bestaat op kinderbijslag
      of kindgebonden budget en tevens recht bestaat op een of meer daarmee naar aard en strekking overeenkomende
      tegemoetkomingen bestaande in een andere Staat, niet zijnde een lidstaat van de Europese Unie, een Staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, of Zwitserland, worden de kinderbijslag
      onderscheidenlijk het kindgebonden budget slechts uitbetaald voor zover deze de tegemoetkoming of tegemoetkomingen
      op grond van de rechtens geldende regeling in het andere land overtreffen.

      2 Indien met toepassing van het eerste lid een bedrag wordt uitbetaald, wordt deze uitbetaling achtereenvolgens
      toegerekend aan de kinderbijslag en het kindgebonden budget.
    url: https://wetten.overheid.nl/BWBR0025183/2015-01-01#Artikel2
  - number: '3'
    text: |-
      1 Indien ten aanzien van hetzelfde kind over eenzelfde tijdvak in Nederland recht bestaat
      op kinderbijslag of kindgebonden budget en tevens recht bestaat op een of meer daarmee
      naar aard en strekking overeenkomende tegemoetkomingen op grond van een regeling van een
      volkenrechtelijke organisatie als bedoeld in de [artikelen 3, eerste lid, onderdeel d][ref1], of
      [14, tweede lid, van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999][ref2] worden
      de kinderbijslag onderscheidenlijk het kindgebonden budget slechts uitbetaald voor zover deze de tegemoetkoming of
      tegemoetkomingen op grond van een regeling van een volkenrechtelijke organisatie overtreffen.

      2 Indien met toepassing van het eerste lid een bedrag wordt uitbetaald, wordt deze uitbetaling achtereenvolgens
      toegerekend aan de kinderbijslag en het kindgebonden budget.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010182#Artikel14
    url: https://wetten.overheid.nl/BWBR0025183/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010182
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010182
        artikel: '14'
  - number: '4'
    text: |-
      Indien met toepassing van de Verordening (EEG) nr. 883/2004 en de Verordening (EG) nr. 987/2009 gezinsbijslagen in
      Nederland worden uitbetaald voor zover deze een gezinsbijslag of , bij meerdere gezinsbijslagen, het totale bedrag
      aan gezinsbijslagen op grond van een rechtens geldende regeling bestaande in een andere lidstaat overtreffen,
      vindt achtereenvolgens uitbetaling plaats van de kinderbijslag, het kindgebonden budget en de kinderopvangtoeslag,
      tot ten hoogste het bedrag dat zou zijn uitbetaald indien het recht op grond van die verordeningen niet zou zijn
      geschorst.
    url: https://wetten.overheid.nl/BWBR0025183/2015-01-01#Artikel4
  - number: 4a
    text: |-
      Indien de ouder aanspraak heeft op kindgebonden budget voor meer dan een kind en voor een of meer van
      die kinderen voor de toepassing van de [Algemene Kinderbijslagwet][ref1] een ander land dan een van de
      in [artikel 1, onder a tot en met d][ref2], bedoelde landen als woonland in aanmerking wordt genomen, is
      [artikel 2 van de Regeling woonlandbeginsel in de sociale zekerheid 2012][ref3] van overeenkomstige toepassing voor
      de bepaling van het bedrag aan kindgebonden budget per kind.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0025183#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0031508#Artikel2
