  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Sociale Zaken en Werkgelegenheid en de Staatssecretaris
    van Onderwijs, Cultuur en Wetenschap,

    Gelet op artikel 20 van de Algemene Kinderbijslagwet en artikel 2a van het Uitvoeringsbesluit Algemene wet
    inkomensafhankelijke regelingen;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0025183/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *kinderbijslag:* de kinderbijslag op grond van de [Algemene Kinderbijslagwet][ref1];
        - *kindgebonden budget:* het kindgebonden budget op grond van de [Wet op het kindgebonden budget][ref2];
        - *kinderopvangtoeslag:* de kinderopvangtoeslag op grond van de
      [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref3];
        - *tegemoetkoming onderhoudskosten thuiswonende gehandicapte kinderen:* de tegemoetkoming op grond van de
      [Regeling tegemoetkoming ouders van thuiswonende gehandicapte kinderen][ref4];
        - *Verordening (EG) nr. 883/2004:* Verordening (EG) nr. 883/2004 van het Europees Parlement en de Raad van 29 april
      2004 betreffende de coördinatie van de socialezekerheidsstelsels (PbEU 2004, L 166);
        - *Verordening (EG) nr. 987/2009:* Verordening (EG) nr. 987/2009 van het Europees Parlement en de Raad van 16
      september 2009 tot vaststelling van de wijze van toepassing van Verordening (EG) nr. 883/2004 betreffende de
      coördinatie van de socialezekerheidsstelsels (PbEU 2009, L 284);
        - *gezinsbijslag:* gezinsbijslag als bedoeld in artikel 1, onderdeel z, van de Verordening (EG) nr. 883/2004.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0022751
      [ref3]: https://wetten.overheid.nl/BWBR0017017
      [ref4]: https://wetten.overheid.nl/BWBR0010997
    url: https://wetten.overheid.nl/BWBR0025183/2015-01-01#Artikel1
