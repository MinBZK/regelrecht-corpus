  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Sociale Zaken en Werkgelegenheid en de Staatssecretaris
    van Onderwijs, Cultuur en Wetenschap,

    Gelet op artikel 20 van de Algemene Kinderbijslagwet en artikel 2a van het Uitvoeringsbesluit Algemene wet
    inkomensafhankelijke regelingen;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0025183/2010-10-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *kinderbijslag:* de kinderbijslag op grond van de [Algemene Kinderbijslagwet][ref1];
        - *kindgebonden budget:* het kindgebonden budget op grond van de [Wet op het kindgebonden budget][ref2];
        - *kinderopvangtoeslag:* de kinderopvangtoeslag op grond van de
      [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref3];
        - *tegemoetkoming onderhoudskosten thuiswonende gehandicapte kinderen:* de tegemoetkoming op grond van de
      [Regeling tegemoetkoming ouders van thuiswonende gehandicapte kinderen][ref4];
        - *Verordening (EEG) nr. 1408/71:* Verordening (EEG) nr. 1408/71 van de Raad van 14 juni 1971 betreffende de
      toepassing van de socialezekerheidsregelingen op werknemers en zelfstandigen, alsmede op hun gezinsleden, die zich
      binnen de Gemeenschap verplaatsen (PbEG L 149);
        - *Verordening (EEG) nr. 574/72:* Verordening (EEG) nr. 574/72 tot vaststelling van de wijze van toepassing
      van [Verordening (EEG) nr. 1408/71](31971R1408) betreffende de toepassing van de socialezekerheidsregelingen op
      werknemers en zelfstandigen, alsmede op hun gezinsleden, die zich binnen de Gemeenschap verplaatsen (PbEGL 74);
        - *gezinsbijslag:* gezinsbijslag als bedoeld in artikel 1, onderdeel u, onder i, van Verordening (EEG) nr. 1408/71.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
