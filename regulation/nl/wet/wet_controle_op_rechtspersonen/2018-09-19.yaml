  - number: '2'
    text: |-
      1 Onze Minister controleert rechtspersonen met het oog op de voorkoming en bestrijding van misbruik van
      rechtspersonen, waaronder het plegen van misdrijven en overtredingen van financieel-economische aard door of door
      middel van deze rechtspersonen.

      2 Onze Minister verwerkt gegevens in de registratie met het oog op het in het eerste lid genoemde doel.

      3 De gegevens, bedoeld in het tweede lid, kunnen worden gebruikt voor het doen van een risicomelding over een
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0015049/2018-09-19#Artikel2
  - number: 2a
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen en de rijksbelastingdienst verstrekken op zijn verzoek aan Onze
      Minister de gegevens die deze behoeft ter uitvoering van de taak, bedoeld in [artikel 2, eerste lid][ref1].

      2 De gegevensverstrekking ingevolge het eerste lid geschiedt kosteloos.


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel2
    url: https://wetten.overheid.nl/BWBR0015049/2018-09-19#Artikel2a
    references:
