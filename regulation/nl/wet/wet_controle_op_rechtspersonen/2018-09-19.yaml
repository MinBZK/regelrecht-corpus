  - number: '8'
    text: |-
      1 Uit de registratie kunnen gegevens worden verstrekt aan instanties in een ander land, die aldaar een
      publiekrechtelijke functie vervullen die verband houdt met het doel van de registratie.

      2 Indien in dat land geen passende waarborgen als bedoeld in artikel 46 van de Algemene verordening
      gegevensbescherming worden geboden en waar betrokkenen niet beschikken over afdwingbare rechten en doeltreffende
      rechtsmiddelen, kunnen persoonsgegevens slechts worden verstrekt in het geval dat aan nader bij algemene maatregel
      van bestuur te stellen eisen is voldaan.
    url: https://wetten.overheid.nl/BWBR0015049/2018-09-19#Artikel8
  - number: '9'
    text: |-
      1 Persoonsgegevens worden uit de registratie verwijderd uiterlijk acht jaren na ontbinding van de rechtspersoon met
      betrekking tot welke zij in de registratie zijn opgenomen.

      2 Er vindt ten minste eenmaal per jaar een onderzoek plaats naar de noodzaak om de opname van de in artikel 4
      bedoelde gegevens in de registratie en de in [artikel 4, vierde lid][ref1], bedoelde verwijzingen, te handhaven.
      Indien de noodzaak is komen te vervallen, worden de gegevens en de verwijzingen, uit de registratie verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel4
    url: https://wetten.overheid.nl/BWBR0015049/2018-09-19#Artikel9
    references:
