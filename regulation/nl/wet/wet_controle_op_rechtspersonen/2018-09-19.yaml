preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de documentatie van gegevens over vennootschappen
    te regelen ten behoeve van de afgifte van verklaringen van geen bezwaar door de Minister van Justitie op grond
    van Boek 2 van het Burgerlijk Wetboek, alsmede het gebruik van bedoelde gegevens ten behoeve van de voorkoming
    en bestrijding van het misbruik van vennootschappen, waaronder het plegen van misdrijven en overtredingen van
    financieel-economische aard door of door middel van vennootschappen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015049/2018-09-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Justitie;

      b. registratie: de verzameling van gegevens die verwerkt worden ten behoeve van het doeleinde beschreven in
      [artikel 2, eerste lid][ref1];

      c. gegeven: persoonsgegevens als bedoeld in artikel 4, aanhef en onder 1, van de Algemene verordening
      gegevensbescherming en elk ander gegeven dat verband houdt met het bestuur van een vennootschap;

      d. risicomelding: verstrekking uit de registratie die een constatering van een verhoogd risico op misbruik van
      een rechtspersoon bevat en waarvan de risicoanalyse, die bestaat uit gegevens uit de registratie die in samenhang
      worden gepresenteerd, onderdeel is;

      e. rechtspersoon:

      1°. naamloze vennootschap, besloten vennootschap met beperkte aansprakelijkheid, coöperatie, onderlinge
      waarborgmaatschappij, vereniging met volledige rechtsbevoegdheid, stichting, Europese naamloze vennootschap,
      Europese coöperatieve vennootschap, Europees economisch samenwerkingsverband, die de statutaire zetel in Nederland
      heeft; en

      2°. onderneming die toebehoort aan een buitenlandse rechtspersoon die een hoofd- of nevenvestiging in Nederland
      heeft als bedoeld in [artikel 5, onderdeel d, van de Handelsregisterwet 2007][ref2];

      f. vaste gebruiker: de instantie of persoon met een publiekrechtelijke taak die is aangewezen conform
      [artikel 6, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0015049#Artikel6
