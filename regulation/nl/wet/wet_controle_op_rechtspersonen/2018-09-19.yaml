        artikel: 126gg
  - number: '7'
    text: |-
      1 Onze Minister kan ter uitvoering van de in [artikel 2, eerste lid][ref1], bedoelde taak in individuele gevallen
      ten behoeve van het doen van een risicomelding, bedoeld in [artikel 5, eerste lid][ref2], desgevraagd of uit eigen
      beweging gegevens verstrekken die afkomstig zijn van:

      a. de Justitiële Informatiedienst;

      b. het Uitvoeringsinstituut werknemersverzekeringen;

      c. de politie en de Koninklijke marechaussee.

      2 In afwijking van [artikel 67, eerste lid, van de Algemene wet inzake rijksbelastingen][ref3],
      [artikel 67, eerste lid, van de Invorderingswet 1990][ref4] en
      [artikel 10, eerste lid, van de Registratiewet 1970][ref5] kan Onze Minister ter uitvoering van de in
      [artikel 2, eerste lid][ref6], bedoelde taak in individuele gevallen ten behoeve van een risicomelding desgevraagd
      of uit eigen beweging gegevens verstrekken die afkomstig zijn van de rijksbelastingdienst.

      3 Voor andere doelen dan genoemd in het eerste en tweede lid worden geen gegevens verstrekt die afkomstig zijn van:

      a. de Justitiële Informatiedienst;

      b. het Uitvoeringsinstituut werknemersverzekeringen;

      c. de politie en de Koninklijke marechaussee;

      d. Onze Minister van Financiën, voorzover het gegevens betreft die verstrekt worden door de rijksbelastingdienst;

      e. bestuursorganen en diensten die met de opsporing van strafbare feiten of met het toezicht op financiële
      instellingen zijn belast, als bedoeld in [artikel 3, tweede lid, onder e][ref7].


