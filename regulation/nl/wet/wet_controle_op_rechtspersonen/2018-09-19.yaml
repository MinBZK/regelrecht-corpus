  - number: '6'
    text: |-
      1 Onze Minister kan uit eigen beweging of desgevraagd ter uitvoering van de in [artikel 2, eerste lid][ref1],
      bedoelde taak in individuele gevallen gegevens die in de registratie zijn opgenomen verstrekken aan:

      a. de vaste gebruikers, die deze in verband met de uitoefening van hun taak behoeven, over de personen ten aanzien
      van wie zij zulks kenbaar hebben gemaakt;

      b. aan een persoon die met de opsporing van strafbare feiten is belast, wanneer uit de gegevens zelf een redelijk
      vermoeden voortvloeit dat een bepaalde persoon een strafbaar feit heeft begaan.

      c. andere instanties of personen met een publiekrechtelijke taak die deze in verband met de uitoefening van hun
      taak behoeven.

      2 Bij algemene maatregel van bestuur wordt vastgesteld welke instanties of personen met een publiekrechtelijke taak
      als vaste gebruikers worden aangemerkt alsmede voor welk doeleinde.

      3 Indien verstrekking van persoonsgegevens uit de registratie plaatsvindt aan de in het eerste lid, onder c,
      genoemde andere instanties of personen, wordt van die verstrekking en het doeleinde daarvan aantekening gehouden.
      De aantekening wordt gedurende vijf jaren bewaard.

      4 Ten behoeve van een verkennend onderzoek als bedoeld in [artikel 126gg van het Wetboek van Strafvordering][ref2]
      kunnen de gegevens uit de registratie worden verstrekt of anderszins verwerkt in samenhang met een andere
      verzameling van persoonsgegevens, zonder beperking tot het individuele geval voor zover dit noodzakelijk is voor
      dat onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel126gg
    url: https://wetten.overheid.nl/BWBR0015049/2018-09-19#Artikel6
