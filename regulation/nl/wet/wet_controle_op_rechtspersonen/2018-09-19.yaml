        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: |-
      1 Onze Minister kan uit eigen beweging of desgevraagd, ter uitvoering van de taak, bedoeld in
      [artikel 2, eerste lid][ref1], in individuele gevallen risicomeldingen doen aan bij algemene maatregel van bestuur
      aan te wijzen bestuursorganen, diensten, toezichthouders en andere personen, belast met de opsporing van strafbare
      feiten, onderscheidenlijk het toezicht op de naleving van wetgeving.

      2 Gegevens over de echtgenoot, geregistreerd partner of levensgezel, de ouders, kinderen en kleinkinderen van de in
      [artikel 4, eerste en tweede lid][ref2] bedoelde personen worden alleen in een risicomelding opgenomen, indien dat
      nodig is voor de onderbouwing van die risicomelding.

      3 Een ieder die krachtens deze wet de beschikking krijgt over gegevens met betrekking tot een derde die zijn
      neergelegd in een risicomelding is verplicht tot geheimhouding daarvan, tenzij bij algemene maatregel van bestuur
      mededeling wordt toegestaan.

      4 Van het doen van een risicomelding wordt aantekening gehouden. Deze aantekening wordt gedurende twee jaren
      bewaard.

      5 Het bestuursorgaan dat een risicomelding ontvangt, kan gedurende twee jaren gebruik maken van die melding.

      6 Indien binnen de in het vierde lid bedoelde gebruikstermijn geen gebruik is gemaakt van de risicomelding,
      verwijdert het ontvangende bestuursorgaan na ommekomst van deze termijn de risicomelding uit zijn administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015049#Artikel4
    url: https://wetten.overheid.nl/BWBR0015049/2018-09-19#Artikel5
