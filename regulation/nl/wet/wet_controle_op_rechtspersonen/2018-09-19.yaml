  - number: '4'
    text: |-
      1 In de registratie worden gegevens opgenomen over de oprichters, de aandeelhouders, de commissarissen, de leden –
      voor zover deze bestuurlijke functies vervullen –, de bestuurders en de vertegenwoordigers van een rechtspersoon.

      2 In de registratie kunnen gegevens worden opgenomen over andere personen die het beleid van de rechtspersoon
      bepalen of mede kunnen bepalen.

      3 In de registratie kunnen gegevens worden opgenomen over de echtgenoot, geregistreerd partner of levensgezel,
      de ouders, kinderen en kleinkinderen van de in het eerste en tweede lid bedoelde personen, indien dat nodig is in
      verband met de analyse van het bestuurdersnetwerk van de rechtspersoon.

      4 Bij algemene maatregel van bestuur wordt bepaald welke categorieën gegevens over de personen als bedoeld in het
      eerste tot en met derde lid kunnen worden opgenomen.

      5 In de registratie kunnen verwijzingen worden opgenomen over:

      a. de bronnen, bedoeld in [artikel 3, eerste lid, onder b, c en d, en het tweede lid][ref1], teneinde verdere
      gegevens voor het doel van de registratie te kunnen opvragen en

      b. de vaste gebruikers, opdat Onze Minister gegevens kan verstrekken ter gelegenheid van een wijziging in de
      registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel3
    url: https://wetten.overheid.nl/BWBR0015049/2018-09-19#Artikel4
    references:
