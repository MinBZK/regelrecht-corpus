        artikel: '4'
        paragraaf: '3'
  - number: '12'
    text: |-
      Onze Minister brengt jaarlijks een openbaar verslag uit over het functioneren van de registratie, onder
      vermelding van het aantal malen dat gegevens verstrekt zijn aan instanties of personen als bedoeld in
      [artikel 5, derde lid][ref1], alsmede onder aanduiding van de instanties en personen en de doeleinden van de
      verstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel5
    url: https://wetten.overheid.nl/BWBR0015049/2018-09-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015049
        artikel: '5'
        paragraaf: '4'
  - number: '13'
    text: |-
      Onze Minister van Justitie zendt binnen twee jaren na de inwerkingtreding van deze wet aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0015049/2018-09-19#Artikel13
  - number: '14'
    text: 'Deze wet wordt aangehaald als: Wet controle op rechtspersonen.'
    url: https://wetten.overheid.nl/BWBR0015049/2018-09-19#Artikel14
  - number: '15'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0015049/2018-09-19#Artikel15
