  - number: '3'
    text: |-
      1 In de registratie kunnen, met het oog op het in [artikel 2, eerste lid][ref1], bedoelde doeleinde, gegevens
      worden opgenomen die afkomstig zijn van:

      a. het handelsregister;

      b. de dossiers ten behoeve van de uitvoering van de [artikelen 138, tiende lid][ref2], [50a][ref3], [53a][ref4],
      [248, tiende lid][ref5] en [300a van Boek 2 van het Burgerlijk Wetboek][ref6];

      c. openbare registers bij de wet ingesteld; en

      d. openbare informatie.

      2 Tevens kunnen in de registratie daartoe gegevens worden opgenomen, indien de daarop van toepassing zijnde
      wetgeving dat toestaat die afkomstig zijn van:

      a. de Justitiële Informatiedienst;

      b. het Uitvoeringsinstituut werknemersverzekeringen;

      c. Onze Minister van Financiën, voorzover het gegevens betreft die verwerkt worden door de rijksbelastingdienst;

      d. de in [artikel 1, onderdeel f, van de Wet politiegegevens][ref7] bedoelde bestuursorganen, voorzover het
      politiegegevens betreft;

      e. de politie en de Koninklijke marechaussee, die worden verwerkt met het oog op de politietaak, bedoeld in de
      [artikelen 3][ref8] en [4, eerste lid, van de Politiewet 2012][ref9];

      f. bij algemene maatregel van bestuur aan te wijzen bestuursorganen, toezichthouders en diensten of personen,
      belast met de opsporing van strafbare feiten;

      g. de basisregistratie personen.

      3 Op verstrekkingen uit het handelsregister als bedoeld in het eerste lid, onder a, aan de registratie is
      [artikel 28, derde lid, van de Handelsregisterwet 2007][ref10] van toepassing.

      4 De gegevensverstrekking ingevolge het eerste lid, onder b, c en d en ingevolge het tweede lid, geschiedt
      kosteloos voorzover het overheidsorganen betreft, voorzover bij of krachtens de wet niet anders is bepaald.


