preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de documentatie van gegevens over vennootschappen
    te regelen ten behoeve van de afgifte van verklaringen van geen bezwaar door de Minister van Justitie op grond
    van Boek 2 van het Burgerlijk Wetboek, alsmede het gebruik van bedoelde gegevens ten behoeve van de voorkoming
    en bestrijding van het misbruik van vennootschappen, waaronder het plegen van misdrijven en overtredingen van
    financieel-economische aard door of door middel van vennootschappen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015049/2008-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Justitie;

      b. registratie: de verzameling van gegevens die verwerkt worden ten behoeve van het doeleinde beschreven in
      [artikel 2, eerste lid][ref1];

      c. gegeven: een persoonsgegeven als bedoeld in [artikel 1, onder a, van de Wet bescherming persoonsgegevens][ref2]
      en elk ander gegeven dat verband houdt met het bestuur van een vennootschap;

      d. vennootschap: een naamloze vennootschap of een besloten vennootschap met beperkte aansprakelijkheid als bedoeld
      in de [artikelen 64][ref3] onderscheidenlijk [175 van Boek 2 van het Burgerlijk Wetboek][ref4];

      e. verklaring van geen bezwaar: de verklaring van Onze Minister dat hem van geen bezwaren is gebleken voor de
      oprichting of statutenwijziging van een vennootschap, voor de omzetting van een naamloze vennootschap in een
      besloten vennootschap of omgekeerd, alsmede voor de omzetting van een andere rechtspersoon in een vennootschap,
      een en ander als bedoeld in de [artikelen 18][ref5], [64, tweede lid][ref6], [72, eerste lid, onder a][ref7],
      [125, eerste lid][ref8], [175, tweede lid][ref9], [183, eerste lid, onder a][ref10], en
      [235, eerste lid van Boek 2 van het Burgerlijk Wetboek][ref11];

      f. vaste gebruiker: de instantie of persoon die is aangewezen overeenkomstig [artikel 5, eerste lid][ref12].


