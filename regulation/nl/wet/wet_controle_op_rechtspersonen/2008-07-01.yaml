  - number: '8'
    text: |-
      1 Uit de registratie kunnen gegevens worden verstrekt aan instanties in een ander land, die aldaar een
      publiekrechtelijke functie vervullen die verband houdt met het doel van de registratie.

      2 Indien in dat land geen passend niveau van bescherming van persoonsgegevens als bedoeld in
      [artikel 76 van de Wet bescherming persoonsgegevens][ref1] aanwezig is, kunnen persoonsgegevens slechts worden
      verstrekt in het geval dat aan nader bij algemene maatregel van bestuur te stellen eisen is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel76
    url: https://wetten.overheid.nl/BWBR0015049/2008-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '76'
  - number: '9'
    text: |-
      1 Persoonsgegevens worden uit de registratie verwijderd uiterlijk acht jaren na ontbinding van de vennootschap met
      betrekking tot welke zij in de registratie zijn opgenomen.

      2 Indien een verzoek tot afgifte van een verklaring van geen bezwaar wordt afgewezen dan wel ingetrokken, worden
      de in het aanvraagformulier opgenomen persoonsgegevens alsmede de gronden voor afwijzing dan wel intrekking van het
      verzoek verwijderd uiterlijk acht jaren nadat de beslissing houdende afwijzing onherroepelijk is geworden dan wel
      het verzoek is ingetrokken.

      3 Persoonsgegevens als bedoeld in [artikel 3, eerste lid, onder b tot en met d en tweede lid][ref1], worden, tenzij
      [artikel 2, tweede lid][ref2], zich hiertegen verzet, verwijderd zodra:

      a. op een verzoek tot afgifte van een verklaring van geen bezwaar afwijzend is beslist of

      b. het verzoek tot afgifte van een verklaring van geen bezwaar is ingetrokken.

      4 Er vindt ten minste eenmaal per jaar een onderzoek plaats naar de noodzaak om de opname van verwijzingen als
      bedoeld in [artikel 4, derde lid, van deze wet][ref3] in de registratie te handhaven. Indien de noodzaak is komen
      te vervallen, worden verwijzingen uit de registratie verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015049#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0015049#Artikel4
    url: https://wetten.overheid.nl/BWBR0015049/2008-07-01#Artikel9
