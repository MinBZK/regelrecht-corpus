  - number: '4'
    text: |-
      1 In de registratie worden gegevens opgenomen over:

      a. de oprichters, de aandeelhouders, de bestuurders, de commissarissen en de vertegenwoordigers van een
      vennootschap en

      b. andere personen die het beleid van de vennootschap bepalen of mede kunnen bepalen.

      2 Bij algemene maatregel van bestuur wordt bepaald welke categorieën gegevens over de personen als bedoeld in het
      eerste lid kunnen worden opgenomen.

      3 In de registratie kunnen verwijzingen worden opgenomen over:

      a. de bronnen, bedoeld in [artikel 3, eerste lid, onder c, d en e, en het tweede lid][ref1], teneinde verdere
      gegevens voor het doel van de registratie te kunnen opvragen en

      b. de vaste gebruikers, opdat Onze Minister gegevens kan verstrekken ter gelegenheid van een wijziging in de
      registratie.

      4 Gegevens over de echtgenoot, geregistreerd partner of levensgezel van de in het eerste lid bedoelde personen
      kunnen in de registratie worden opgenomen, indien zulks nodig is in verband met andere in de registratie opgenomen
      natuurlijke personen.


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel3
    url: https://wetten.overheid.nl/BWBR0015049/2008-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015049
        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: |-
      1 Uit de registratie worden slechts persoonsgegevens verstrekt aan instanties en personen die belast zijn met een
      publiekrechtelijke taak.

      2 Bij algemene maatregel van bestuur wordt vastgesteld aan welke instanties of personen als vaste gebruikers
      desgevraagd in individuele gevallen persoonsgegevens uit de registratie worden verstrekt, alsmede voor welk
      doeleinde.

      3 Indien verstrekking van persoonsgegevens uit de registratie plaatsvindt aan andere instanties of personen, wordt
      van die verstrekking en het doeleinde daarvan aantekening gehouden. De aantekening wordt gedurende drie jaren
      bewaard.

      4 De verstrekking van gegevens over natuurlijke personen die niet rechtstreeks verbonden zijn met het bestuur van
      een rechtspersoon geschiedt slechts met toestemming van de betrokkene, tenzij de verstrekking noodzakelijk is voor
      de opsporing van een strafbaar feit als bedoeld in [artikel 2, tweede lid][ref1].

      5 Ten behoeve van een verkennend onderzoek als bedoeld in [artikel 126gg van het Wetboek van Strafvordering][ref2]
      kunnen de gegevens uit de registratie worden verstrekt of anderszins verwerkt in samenhang met een andere
      verzameling van persoonsgegevens, zonder beperking tot het individuele geval voor zover dit noodzakelijk is voor
      dat onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel126gg
    url: https://wetten.overheid.nl/BWBR0015049/2008-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015049
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 126gg
  - number: '6'
    text: |-
      Onze Minister kan uit eigen beweging ter uitvoering van [artikel 2, tweede lid][ref1], in individuele gevallen
      gegevens die in de registratie zijn opgenomen, verstrekken:

      a. aan de vaste gebruikers, die deze in verband met de uitoefening van hun taak behoeven, over de personen ten
      aanzien van wie zij zulks kenbaar hebben gemaakt;

      b. aan een persoon die met de opsporing van strafbare feiten is belast, wanneer uit de gegevens zelf een redelijk
      vermoeden voortvloeit dat een bepaalde persoon een strafbaar feit heeft begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel2
    url: https://wetten.overheid.nl/BWBR0015049/2008-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015049
        artikel: '2'
        paragraaf: '1'
  - number: '7'
    text: |-
      Er worden geen gegevens verstrekt die afkomstig zijn van:

      a. de Centrale Justitiële Documentatie;

      b. het Uitvoeringsinstituut werknemersverzekeringen;

      c. de in [artikel 1, onderdeel g, van de Wet politiegegevens][ref1] bedoelde bestuursorganen, voorzover het
      politiegegevens betreft;

      d. Onze Minister van Financiën, voorzover het gegevens betreft die verstrekt worden door de rijksbelastingdienst;

      e. Onze Minister van Economische Zaken, voorzover het gegevens betreft die verstrekt worden door de Nederlandse
      Mededingingsautoriteit, bedoeld in [artikel 2, eerste lid van de Mededingingswet][ref2] en

      f. bestuursorganen en diensten die met de opsporing van strafbare feiten of met het toezicht op financiële
      instellingen zijn belast bedoeld in [artikel 3, tweede lid, onder f, van deze wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0015049#Artikel3
