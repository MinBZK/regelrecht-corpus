  - number: '2'
    text: |-
      1 Onze Minister verwerkt gegevens in de registratie met het oog op de behandeling van aanvragen voor de afgifte van
      een verklaring van geen bezwaar.

      2 De gegevens, bedoeld in het eerste lid, kunnen worden gebruikt voor het voorkomen en bestrijden van misbruik
      van een vennootschap, waaronder het voorkomen en bestrijden van het plegen van misdrijven en overtredingen van
      financieel-economische aard door of door middel van een vennootschap.
    url: https://wetten.overheid.nl/BWBR0015049/2008-07-01#Artikel2
  - number: '3'
    text: |-
      1 In de registratie kunnen, met het oog op het in [artikel 2, eerste lid][ref1], bedoelde doeleinde, gegevens
      worden opgenomen die afkomstig zijn van:

      a. het ten behoeve van de verkrijging van een verklaring van geen bezwaar ingevulde aanvraagformulier;

      b. het handelsregister;

      c. de dossiers ten behoeve van de uitvoering van de [artikelen 138, tiende lid][ref2], [50a][ref3], [53a][ref4],
      [248, tiende lid][ref5] en [300a van Boek 2 van het Burgerlijk Wetboek][ref6];

      d. de in [artikel 1, onderdeel g, van de Wet politiegegevens][ref7] bedoelde bestuursorganen, voorzover het
      politiegegevens betreft;

      e. openbare informatie.

      2 Tevens kunnen in de registratie daartoe gegevens worden opgenomen, indien de daarop van toepassing zijnde
      wetgeving dat toestaat die afkomstig zijn van:

      a. de Centrale Justitiële Documentatie;

      b. het Uitvoeringsinstituut werknemersverzekeringen;

      c. Onze Minister van Financiën, voorzover het gegevens betreft die verwerkt worden door de rijksbelastingdienst;

      d. de in [artikel 1, onderdeel f, van de Wet politieregisters][ref8] bedoelde bestuursorganen, voorzover het een
      politieregister betreft;

      e. Onze Minister van Economische Zaken, voorzover het gegevens betreft die verwerkt worden door de Nederlandse
      mededingingsautoriteit, bedoeld in [artikel 2, eerste lid, van de Mededingingswet][ref9];

      f. bij algemene maatregel van bestuur aan te wijzen bestuursorganen of diensten die met de opsporing van strafbare
      feiten of met het toezicht op financiële instellingen zijn belast;

      g. het college van burgemeesters en wethouders van een gemeente, voorzover het bestanden betreft
      waarvan de gegevens worden verwerkt door de gemeentelijke dienst die is belast met de uitvoering van de
      [Wet gemeentelijke basisadministratie persoonsgegevens][ref10].

      3 Gegevens als bedoeld in het eerste lid, onder a, kunnen ook in de registratie worden opgenomen, indien op het
      verzoek tot afgifte van een verklaring van geen bezwaar afwijzend wordt beslist dan wel een verzoek tot afgifte van
      een verklaring van geen bezwaar wordt ingetrokken.

      4 Op verstrekkingen uit het handelsregister als bedoeld in het eerste lid, onder b, aan de registratie is
      [artikel 28, vierde lid, van de Handelsregisterwet 2007][ref11] van toepassing.

      5 De gegevensverstrekking ingevolge het eerste lid, onder c, d en e en ingevolge het tweede lid, geschiedt
      kosteloos voorzover het overheidsorganen betreft, voorzover bij of krachtens de wet niet anders is bepaald.


