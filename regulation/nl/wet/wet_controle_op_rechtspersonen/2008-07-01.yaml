  - number: '13'
    text: |-
      Onze Minister van Justitie zendt binnen twee jaren na de inwerkingtreding van deze wet aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0015049/2008-07-01#Artikel13
  - number: '14'
    text: 'Deze wet wordt aangehaald als: Wet documentatie vennootschappen.'
    url: https://wetten.overheid.nl/BWBR0015049/2008-07-01#Artikel14
  - number: '15'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0015049/2008-07-01#Artikel15
