  - number: 3:1
    text: |-
      1 Dit hoofdstuk is van toepassing op rechterlijke uitspraken:

      a. waarbij de tenuitvoerlegging van de aan de veroordeelde opgelegde vrijheidsbenemende sanctie voorwaardelijk
      is opgeschort;

      b. op grond waarvan een vrijheidsbenemende sanctie ten uitvoer is gelegd en aan de veroordeelde voorwaardelijke
      invrijheidstelling is verleend;

      c. waarbij of op grond waarvan een verplichting als bedoeld in [artikel 3:2][ref1] is opgelegd, die door de
      veroordeelde moet worden nageleefd, bij gebreke waarvan een vrijheidsbenemende sanctie ten uitvoer kan worden
      gelegd.

      d. waarbij de oplegging van een sanctie aan de veroordeelde voorwaardelijk is opgeschort.

      2 Voor de toepassing van dit hoofdstuk wordt onder rechterlijke uitspraak mede begrepen een op grond van die
      uitspraak genomen beslissing waarbij verplichtingen als bedoeld in [artikel 3:2][ref2] aan een veroordeelde zijn
      opgelegd, voor zover niet uit enige bepaling het tegendeel volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0031814#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0031814#Artikel32
