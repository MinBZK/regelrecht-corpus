  - number: 2:28
    text: |-
      1 Onze Minister zendt de rechterlijke uitspraak, vergezeld van een ingevuld certificaat, rechtstreeks aan de
      bevoegde autoriteit van de uitvoerende lidstaat. Het certificaat is opgesteld overeenkomstig het bij algemene
      maatregel van bestuur vastgestelde model.

      2 Het certificaat is gesteld in de officiële taal of een van de officiële talen van de uitvoerende lidstaat dan
      wel, indien die staat zulks heeft medegedeeld in een bij het secretariaat-generaal van de Raad van de Europese Unie
      neergelegde verklaring, in een van de in die verklaring genoemde talen.

      3 Indien niet bekend is welke autoriteit in de uitvoerende lidstaat bevoegd is tot erkenning, verzoekt Onze
      Minister hieromtrent om inlichtingen.

      4 De rechterlijke uitspraak en het certificaat worden niet aan twee of meer lidstaten tegelijkertijd toegezonden.

      5 De toezending kan plaatsvinden per gewone post, telefax of elektronische post, mits de echtheid van de
      toegezonden documenten door de bevoegde autoriteit van de uitvoerende lidstaat kan worden vastgesteld.

      6 Op verzoek van de bevoegde autoriteit van de uitvoerende lidstaat stuurt Onze Minister deze een gewaarmerkt
      afschrift van de rechterlijke uitspraak dan wel het origineel van het certificaat toe.

      7 Op verzoek van de bevoegde autoriteit van de uitvoerende lidstaat draagt Onze Minister zorg voor een vertaling
      van de rechterlijke uitspraak of de belangrijkste onderdelen ervan in een van de officiële talen van de Europese
      Unie. Met het oog op dit verzoek overlegt Onze Minister met de bevoegde autoriteit van de uitvaardigende lidstaat.

      8 Indien de veroordeelde zich in Nederland bevindt, stelt Onze Minister hem door middel van het formulier, dat is
      opgesteld overeenkomstig het bij algemene maatregel van bestuur vastgestelde model, in een taal die de veroordeelde
      begrijpt op de hoogte van de beslissing om het certificaat en de rechterlijke uitspraak toe te zenden aan de
      uitvoerende lidstaat. Indien de veroordeelde zich in de uitvoerende lidstaat bevindt, zendt Onze Minister het
      formulier aan de bevoegde autoriteit van die staat.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel228
  - number: 2:29
    text: |-
      1 Onze Minister kan de bevoegde autoriteit van de uitvoerende lidstaat verzoeken om de veroordeelde aan te houden
      of andere maatregelen te treffen ter voorkoming van zijn vlucht.

      2 Indien het verzoek wordt gedaan voorafgaand aan de toezending van de rechterlijke uitspraak en het certificaat,
      bedoeld in [artikel 2:28][ref1], bevat het verzoek een vermelding van het strafbare feit waarop de rechterlijke
      uitspraak betrekking heeft, de vrijheidsbenemende sanctie die is opgelegd en een beknopte beschrijving van
      de feiten en omstandigheden waaronder het feit is begaan. Het verzoek bevat tevens een zo nauwkeurig mogelijk
      signalement van de veroordeelde. Onze Minister zendt de rechterlijke uitspraak en het certificaat zo spoedig
      mogelijk nadat hij het verzoek heeft gedaan, maar in ieder geval binnen een termijn van zeven dagen na de
      aanhouding van de veroordeelde of zoveel eerder als op aangeven van de bevoegde autoriteit van de uitvoerende
      lidstaat nodig is, aan de bevoegde autoriteit van de uitvoerende lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0031814#Artikel228
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0031814
        artikel: 2:28
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 2:30
    text: |-
      Onze Minister kan het certificaat intrekken, zolang de tenuitvoerlegging van de rechterlijke uitspraak in de
      uitvoerende lidstaat niet is aangevangen. Onze Minister stelt de bevoegde autoriteit van de uitvoerende lidstaat en
      de veroordeelde onverwijld schriftelijk en met redenen omkleed in kennis van zijn beslissing om het certificaat in
      te trekken.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel230
  - number: 2:31
    text: |-
      1 Indien de veroordeelde zich in Nederland bevindt, komt Onze Minister met de bevoegde autoriteit van de
      uitvoerende lidstaat het tijdstip overeen waarop de veroordeelde naar die staat wordt overgebracht. Dit tijdstip
      ligt niet later dan dertig dagen na de beslissing van de bevoegde autoriteit van de uitvoerende lidstaat tot
      erkenning van de rechterlijke uitspraak.

      2 Indien onvoorziene omstandigheden de overbrenging binnen de termijn, bedoeld in het eerste lid, verhinderen,
      vindt de overbrenging plaats binnen tien dagen nadat deze omstandigheden zijn geëindigd.

      3 Bij de overbrenging is de bewaking van de veroordeelde opgedragen aan Nederlandse ambtenaren, die bevoegd zijn
      alle dienstige maatregelen te nemen ter beveiliging van de veroordeelde en ter voorkoming van zijn ontvluchting.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel231
  - number: 2:32
    text: |-
      1 Het recht van tenuitvoerlegging in Nederland van de aan de uitvoerende lidstaat toegezonden rechterlijke
      uitspraak, wordt opgeschort gedurende de periode dat de uitspraak ten uitvoer wordt gelegd in die staat.

      2 Tot tenuitvoerlegging in Nederland kan worden overgegaan, zodra van de bevoegde autoriteit van de uitvoerende
      lidstaat bericht is ontvangen dat de rechterlijke uitspraak geheel of gedeeltelijk niet ten uitvoer is gelegd.

      3 Het recht van tenuitvoerlegging in Nederland eindigt, zodra van de bevoegde autoriteit van de uitvoerende
      lidstaat bericht is ontvangen dat de tenuitvoerlegging van de rechterlijke uitspraak is voltooid.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel232
  - number: 2:33
    text: |-
      Onze Minister stelt de bevoegde autoriteit van de uitvoerende lidstaat onverwijld in kennis van iedere beslissing
      of maatregel die tot gevolg heeft dat de rechterlijke uitspraak niet langer ten uitvoer kan worden gelegd.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel233
  - number: 2:34
    text: |-
      1 Onze Minister kan op verzoek van de bevoegde autoriteit van de uitvoerende lidstaat toestemming verlenen voor
      de vervolging, bestraffing of het op enige andere wijze in de persoonlijke vrijheid beperken van de veroordeelde
      in die staat, ter zake van feiten die vóór het tijdstip van de overbrenging van de veroordeelde zijn begaan en
      waarvoor hij niet is overgebracht.

      2 Onze Minister geeft de in het eerste lid bedoelde toestemming ten aanzien van feiten waarvoor krachtens de
      Overleveringswet overlevering had kunnen worden toegestaan.

      3 Het verzoek kan slechts in overweging worden genomen, indien het de gegevens, bedoeld in
      [artikel 2, tweede lid, van de Overleveringswet][ref1], bevat en is gesteld in de Nederlandse taal of in een van
      de talen, genoemd in de verklaring, bedoeld in artikel 2, derde lid, van die wet. Onze Minister beslist binnen een
      termijn van dertig dagen na ontvangst van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel2
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: '2'
  - number: 2:35
    text: |-
      1 Veroordeelden die, ten behoeve van de tenuitvoerlegging van een rechterlijke uitspraak, van de ene lidstaat van
      de Europese Unie worden overgebracht naar de andere lidstaat van de Europese Unie, kunnen met toestemming van Onze
      Minister over Nederlands grondgebied worden vervoerd.

      2 De toestemming van Onze Minister kan worden gegeven op verzoek van de bevoegde autoriteit van de uitvaardigende
      lidstaat. Het verzoek gaat vergezeld van een afschrift van het ingevulde certificaat. Onze Minister kan de bevoegde
      autoriteit van de uitvaardigende lidstaat verzoeken om een vertaling van het certificaat in het Nederlands of in
      een andere officiële taal van de Europese Unie.

      3 Onze Minister beslist binnen een termijn van zeven dagen na ontvangst van het verzoek of na ontvangst van de
      vertaling, bedoeld in het tweede lid.

      4 Onze Minister kan de toestemming weigeren in gevallen, waarin de veroordeelde in Nederland gesignaleerd staat
      voor strafrechtelijke doeleinden of ter fine van overlevering aan een andere lidstaat dan die van bestemming, aan
      het Internationaal Strafhof of aan een ander internationaal tribunaal of ter fine van uitlevering aan een derde
      staat.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel235
  - number: 2:36
    text: |-
      1 Bij vervoer over Nederlands grondgebied wordt de bewaking van de veroordeelde opgedragen aan Nederlandse
      ambtenaren, die bevoegd zijn alle dienstige maatregelen te nemen ter beveiliging van de veroordeelde en ter
      voorkoming van zijn ontvluchting.

      2 Indien het ten gevolge van bijzondere omstandigheden niet mogelijk is het vervoer door Nederland zonder
      onderbreking voort te zetten, kan de veroordeelde, in afwachting van een passende gelegenheid tot vertrek naar
      elders, zo nodig worden opgenomen in een huis van bewaring, op vertoon van een document waaruit de door Onze
      Minister verleende toestemming tot het vervoer blijkt.

      3 De kosten verbonden aan het vervoer en de detentie worden in rekening gebracht bij de uitvaardigende lidstaat.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel236
  - number: 2:37
    text: |-
      1 De toestemming van Onze Minister, bedoeld in [artikel 2:35, eerste lid][ref1], is niet vereist voor vervoer door
      de lucht waarbij geen landing op Nederlands grondgebied wordt gemaakt.

      2 In geval van een onvoorziene landing op Nederlands grondgebied kan de veroordeelde, op verzoek van de hem
      begeleidende buitenlandse ambtenaren, voorlopig worden aangehouden krachtens een bevel van een ter plaatse bevoegde
      officier van justitie of hulpofficier van justitie. [Artikel 2:19, vijfde lid][ref2], is van overeenkomstige
      toepassing.

      3 Het vervoer van de voorlopig aangehouden veroordeelde kan worden voortgezet, zodra Onze Minister daartoe alsnog
      toestemming verleent. Is de toestemming na afloop van de termijn van inverzekeringstelling nog niet verleend, of
      binnen die termijn geweigerd, dan wordt de veroordeelde terstond in vrijheid gesteld, behoudens de mogelijkheid van
      verdere vrijheidsbeneming uit anderen hoofde.


      [ref1]: https://wetten.overheid.nl/BWBR0031814#Artikel235
      [ref2]: https://wetten.overheid.nl/BWBR0031814#Artikel219
