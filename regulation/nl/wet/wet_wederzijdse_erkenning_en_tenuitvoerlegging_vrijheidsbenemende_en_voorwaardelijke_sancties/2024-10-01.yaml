  - number: 2:23
    text: |-
      1 De krachtens de [artikelen 2:19 tot en met 2:22][ref1] gegeven bevelen tot inverzekeringstelling, bewaring dan
      wel de opschorting, schorsing of beëindiging van de bewaring worden gedagtekend en ondertekend. De grond voor
      uitvaardiging wordt in het bevel vermeld. Aan de veroordeelde op wie het bevel betrekking heeft, wordt onverwijld
      een afschrift daarvan uitgereikt.

      2 De bevelen, bedoeld in het eerste lid, zijn dadelijk uitvoerbaar. Bevoegd tot het ten uitvoer leggen
      van deze bevelen zijn de in [artikel 141 van het Wetboek van Strafvordering][ref2] genoemde ambtenaren.
      Op de tenuitvoerlegging en de last daartoe zijn de [artikelen 6:1:6][ref3], [6:1:7][ref4], [6:1:9][ref5],
      [6:1:15][ref6], [6:2:1][ref7] en [6:2:5 van het Wetboek van Strafvordering][ref8] van overeenkomstige toepassing.

      3 Veroordeelden die overeenkomstig deze wet in verzekering of in bewaring zijn gesteld worden behandeld als
      verdachten die krachtens het [Wetboek van Strafvordering][ref9] aan een overeenkomstige maatregel zijn onderworpen.

      4 Van elke beslissing, genomen krachtens een van de [artikelen 2:19 tot en met 2:22][ref10], geeft de officier van
      justitie onverwijld kennis aan Onze Minister.


