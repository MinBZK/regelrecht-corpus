  - number: 3:15
    text: |-
      1 De tenuitvoerlegging van de rechterlijke uitspraak strekt niet verder dan het houden van toezicht op de naleving
      van de aan de veroordeelde opgelegde verplichtingen, indien:

      a. de erkenning een rechterlijke uitspraak als bedoeld in [artikel 3:1, eerste lid, onder c][ref1], betreft en in
      de uitspraak geen vrijheidsbenemende sanctie is bepaald die ten uitvoer kan worden gelegd indien een verplichting
      niet is nageleefd;

      b. de erkenning een rechterlijke uitspraak als bedoeld in [artikel 3:1, eerste lid, onder d][ref2], betreft.

      2 Indien het openbaar ministerie van oordeel is dat een aan de veroordeelde opgelegde verplichting niet is
      nageleefd of de veroordeelde verdenkt van het plegen van een nieuw strafbaar feit, stelt het openbaar ministerie de
      bevoegde autoriteit van de uitvaardigende lidstaat daarvan onverwijld in kennis door middel van het formulier dat
      is opgesteld overeenkomstig het bij algemene maatregel van bestuur vastgestelde model.

      3 Het openbaar ministerie kan de aan de veroordeelde opgelegde verplichtingen wijzigen of de proeftijd met
      ten hoogste een jaar verlengen, indien de bevoegde autoriteit van de uitvaardigende lidstaat aangeeft dat de
      kennisgeving, bedoeld in het tweede lid, daar aanleiding tot geeft.

      4 Het openbaar ministerie beëindigt het toezicht op de naleving van de aan de veroordeelde opgelegde verplichtingen
      zodra het door de bevoegde autoriteit van de uitvaardigende lidstaat in kennis is gesteld van enige beslissing
      over de tenuitvoerlegging van een vrijheidsbenemende sanctie, omdat de veroordeelde een verplichting niet heeft
      nageleefd.

      5 Het openbaar ministerie stelt de veroordeelde en de reclasseringsinstelling, belast met het toezicht, zo spoedig
      mogelijk op de hoogte van enige beslissing op grond van het derde en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0031814#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0031814#Artikel31
