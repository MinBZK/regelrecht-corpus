  - number: 3:2
    text: |-
      1 Vatbaar voor erkenning en tenuitvoerlegging in Nederland dan wel toezending aan een andere lidstaat van de
      Europese Unie zijn rechterlijke uitspraken, waarbij of op grond waarvan een of meer van de volgende verplichtingen
      zijn opgelegd, die door de veroordeelde gedurende een proeftijd moeten worden nageleefd of binnen een bepaalde
      termijn moeten zijn uitgevoerd:

      a. het gebod een bepaalde autoriteit in kennis te stellen van een verandering van woonplaats of van de plaats waar
      hij werkt;

      b. het gebod zich op bepaalde tijdstippen bij een bepaalde instantie te melden;

      c. het verbod bepaalde locaties, plaatsen of afgebakende gebieden te betreden;

      d. de beperking van het recht om de uitvoerende lidstaat te verlaten;

      e. het verbod contact te leggen of te laten leggen met bepaalde personen of instellingen;

      f. het gebod contact te vermijden met bepaalde zaken die door de veroordeelde zijn gebruikt of kunnen worden
      gebruikt om een strafbaar feit te plegen;

      g. het gebod de door het strafbare feit veroorzaakte schade te vergoeden of het bewijs te leveren dat aan die
      verplichting is voldaan;

      h. het gebod samen te werken met de reclassering of met een maatschappelijke dienst die met verantwoordelijkheden
      jegens veroordeelden is belast;

      i. het gebod een therapie of ontwenningskuur te ondergaan;

      j. de verplichting een taakstraf te verrichten;

      k. verplichtingen betreffende het gedrag, de woonplaats, opleiding, de vrijetijdsbesteding, dan wel verplichtingen
      die beperkingen op of voorwaarden inzake de beroepsuitoefening inhouden.

      2 Bij algemene maatregel van bestuur kan worden aangewezen welke andere verplichtingen dan genoemd in het eerste
      lid, in Nederland ten uitvoer kunnen worden gelegd.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel32
  - number: 3:3
    text: |-
      1 Het openbaar ministerie is bevoegd tot erkenning van een van de uitvaardigende lidstaat ontvangen rechterlijke
      uitspraak, met het oog op tenuitvoerlegging in Nederland.

      2 Het openbaar ministerie is bevoegd tot toezending van een Nederlandse rechterlijke uitspraak aan de uitvoerende
      lidstaat, met het oog op de erkenning en tenuitvoerlegging aldaar.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel33
  - number: 3:4
    text: |-
      Een in de uitvaardigende lidstaat gedane rechterlijke uitspraak kan worden erkend en ten uitvoer gelegd in
      Nederland indien:

      a. de veroordeelde zich in de uitvaardigende lidstaat of in Nederland bevindt; en

      b. het openbaar ministerie heeft ingestemd met de toezending van de rechterlijke uitspraak, tenzij deze instemming
      niet vereist is; en

      c. de rechterlijke uitspraak geen andere verplichtingen bestrijkt dan die op grond van [artikel 3:2][ref1] in
      Nederland ten uitvoer kunnen worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0031814#Artikel32
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel34
    references:
