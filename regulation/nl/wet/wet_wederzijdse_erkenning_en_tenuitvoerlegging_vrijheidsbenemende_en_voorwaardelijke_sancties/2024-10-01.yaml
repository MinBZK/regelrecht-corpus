  - number: 3:16
    text: |-
      1 Het openbaar ministerie kan de verantwoordelijkheid voor de tenuitvoerlegging van de rechterlijke uitspraak
      overdragen aan de uitvaardigende lidstaat indien:

      a. de veroordeelde zich aan het toezicht op de naleving van de aan hem opgelegde verplichtingen onttrekt of niet
      langer zijn vaste woon- of verblijfplaats in Nederland heeft;

      b. in de uitvaardigende lidstaat een nieuwe strafvervolging tegen de veroordeelde is ingesteld en de bevoegde
      autoriteit van die staat om de overdracht heeft verzocht.

      2 Het recht van tenuitvoerlegging in Nederland eindigt indien:

      a. de rechterlijke uitspraak is erkend, maar het certificaat door de bevoegde autoriteit van de uitvaardigende
      lidstaat is ingetrokken;

      b. de verantwoordelijkheid voor de tenuitvoerlegging door het openbaar ministerie is overgedragen aan de
      uitvaardigende lidstaat in geval van de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel316
  - number: 3:17
    text: |-
      Het openbaar ministerie stelt de bevoegde autoriteit van de uitvaardigende lidstaat onverwijld in een vorm die
      toelaat dat het schriftelijk wordt vastgelegd in kennis van de volgende informatie over de tenuitvoerlegging van de
      rechterlijke uitspraak:

      a. het feit dat de veroordeelde heeft voldaan aan de aan hem opgelegde verplichtingen;

      b. een beslissing tot wijziging van de aan de veroordeelde opgelegde verplichtingen;

      c. een beslissing over de tenuitvoerlegging van een vrijheidsbenemende sanctie, omdat de veroordeelde een
      verplichting niet heeft nageleefd;

      d. een beslissing betreffende gratie of amnestie als gevolg waarvan de rechterlijke uitspraak niet of niet geheel
      ten uitvoer wordt gelegd;

      e. het feit dat het onmogelijk is om toezicht te houden op de aan de veroordeelde opgelegde verplichtingen, omdat
      de veroordeelde niet in Nederland kan worden gevonden.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel317
  - number: 3:18
    text: |-
      Een Nederlandse rechterlijke uitspraak kan aan de uitvoerende lidstaat worden toegezonden, met het oog op de
      tenuitvoerlegging aldaar, indien de bevoegde autoriteit van die staat met de toezending heeft ingestemd, tenzij
      deze instemming niet vereist is.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel318
  - number: 3:19
    text: |-
      Toezending van de rechterlijke uitspraak kan zonder de instemming van de bevoegde autoriteit van de uitvoerende
      lidstaat plaatsvinden, indien de veroordeelde in de uitvoerende lidstaat zijn vaste woon- of verblijfplaats heeft
      en in die staat is teruggekeerd of wenst terug te keren.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel319
  - number: 3:20
    text: |-
      1 Het openbaar ministerie zendt de rechterlijke uitspraak, vergezeld van een ingevuld certificaat rechtstreeks aan
      de bevoegde autoriteit van de uitvoerende lidstaat. Het certificaat is opgesteld overeenkomstig het bij algemene
      maatregel van bestuur vastgestelde model.

      2 Het certificaat is gesteld in de officiële taal of een van de officiële talen van de uitvoerende lidstaat dan
      wel, indien die staat zulks heeft medegedeeld in een bij het secretariaat-generaal van de Raad van de Europese Unie
      neergelegde verklaring, in een van de in die verklaring genoemde talen.

      3 Indien niet bekend is welke autoriteit in de uitvoerende lidstaat bevoegd is tot erkenning van de rechterlijke
      uitspraak, verzoekt het openbaar ministerie hieromtrent om inlichtingen.

      4 De rechterlijke uitspraak wordt niet aan twee of meer lidstaten tegelijkertijd toegezonden.

      5 De toezending kan plaatsvinden per gewone post, telefax of elektronische post, mits de echtheid van de
      toegezonden documenten door de bevoegde autoriteit van de uitvoerende lidstaat kan worden vastgesteld.

      6 Op verzoek van de bevoegde autoriteit van de uitvoerende lidstaat, stuurt het openbaar ministerie deze een
      gewaarmerkt afschrift van de rechterlijke uitspraak dan wel het origineel van het certificaat toe.

      7 Ter gelegenheid van de toezending van het certificaat kan het openbaar ministerie de bevoegde autoriteit van de
      uitvoerende lidstaat verzoeken geïnformeerd te worden over de duur van de vrijheidsbenemende sanctie die op grond
      van het recht van de uitvoerend lidstaat ten uitvoer kan worden gelegd, indien de veroordeelde de aan hem opgelegde
      verplichtingen niet naleeft.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel320
  - number: 3:21
    text: |-
      1 Zolang de tenuitvoerlegging van de rechterlijke uitspraak in de uitvoerende lidstaat niet is aangevangen, kan het
      openbaar ministerie het certificaat intrekken naar aanleiding van:

      a. de informatie, bedoeld in [artikel 3:20, zevende lid][ref1];

      b. de kennisgeving betreffende de beslissing van de bevoegde autoriteit van de uitvoerende lidstaat tot aanpassing
      van de aan de veroordeelde opgelegde verplichtingen, de proeftijd, de termijn waarbinnen de verplichting moet zijn
      uitgevoerd dan wel de vrijheidsbenemende sanctie die ten uitvoer kan worden gelegd indien de verplichting niet
      is nageleefd.

      2 Het openbaar ministerie beslist over de intrekking van het certificaat binnen een termijn van tien dagen na
      ontvangst van de informatie, bedoeld in het eerste lid. Het openbaar ministerie stelt de bevoegde autoriteit van de
      uitvoerende lidstaat en de veroordeelde onverwijld schriftelijk en met redenen omkleed in kennis van de beslissing
      om het certificaat in te trekken.


      [ref1]: https://wetten.overheid.nl/BWBR0031814#Artikel320
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel321
