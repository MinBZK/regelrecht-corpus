  - number: 3:22
    text: |-
      1 Het recht van tenuitvoerlegging in Nederland van de aan de uitvoerende lidstaat toegezonden rechterlijke
      uitspraak, wordt opgeschort gedurende de periode dat de uitspraak ten uitvoer wordt gelegd in die staat.

      2 Tot tenuitvoerlegging in Nederland kan worden overgegaan indien het openbaar ministerie met de bevoegde
      autoriteit van de uitvoerende lidstaat is overeengekomen dat de tenuitvoerlegging verder in Nederland dient plaats
      te vinden, omdat:

      a. de veroordeelde zich in de uitvoerende lidstaat aan het toezicht op de naleving van de aan hem opgelegde
      verplichtingen heeft onttrokken of niet langer zijn vaste woon- of verblijfplaats in die staat heeft;

      b. in Nederland een nieuwe strafvervolging tegen de veroordeelde is ingesteld.

      3 Het recht van tenuitvoerlegging in Nederland eindigt zodra van de bevoegde autoriteit van de uitvoerende lidstaat
      bericht is ontvangen dat de tenuitvoerlegging van de rechterlijke uitspraak is voltooid.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel322
  - number: 3:23
    text: |-
      Het openbaar ministerie stelt de bevoegde autoriteit van de uitvoerende lidstaat onverwijld in een vorm die
      toelaat dat het schriftelijk wordt vastgelegd in kennis van alle feiten en omstandigheden die tot gevolg zouden
      kunnen hebben dat in de uitvoerende lidstaat een beslissing wordt genomen tot wijziging van de aan de veroordeelde
      opgelegde verplichtingen, dan wel een beslissing over de tenuitvoerlegging van een vrijheidsbenemende sanctie,
      omdat de veroordeelde een verplichting niet heeft nageleefd.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel323
