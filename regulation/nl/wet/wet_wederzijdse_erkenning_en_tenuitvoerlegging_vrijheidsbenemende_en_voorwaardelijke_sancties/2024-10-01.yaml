  - number: 3:12
    text: |-
      1 Het openbaar ministerie weigert de erkenning van de rechterlijke uitspraak indien:

      a. het certificaat niet is overgelegd, onvolledig is of kennelijk niet in overeenstemming is met de rechterlijke
      uitspraak en niet binnen redelijke termijn aan het verzoek, bedoeld in [artikel 3:8., vierde lid][ref1], is
      voldaan;

      b. niet is voldaan aan de voorwaarden voor erkenning, bedoeld in [artikel 3:4][ref2];

      c. de veroordeelde ten tijde van het begaan van het feit de leeftijd van twaalf jaren nog niet had bereikt;

      d. de tenuitvoerlegging van de rechterlijke uitspraak onverenigbaar is met een naar Nederlands recht geldende
      immuniteit;

      e. de tenuitvoerlegging van de rechterlijke uitspraak onverenigbaar
      is met het aan [artikel 68 van het Wetboek van Strafrecht][ref3] en
      [artikel 255, eerste lid, van het Wetboek van Strafvordering][ref4] ten grondslag liggende beginsel;

      f. het feit waarop de rechterlijke uitspraak betrekking heeft, indien het in Nederland was begaan, naar Nederlands
      recht niet strafbaar zou zijn;

      g. over het feit waarop de rechterlijke uitspraak betrekking heeft naar Nederlands recht rechtsmacht kon worden
      uitgeoefend en het recht tot uitvoering van de opgelegde sanctie naar Nederlands recht zou zijn verjaard;

      h. uit het certificaat blijkt dat:

      1°. de veroordeelde niet in overeenstemming met het recht van de uitvaardigende lidstaat in persoon of via een naar
      het nationale recht bevoegde vertegenwoordiger in kennis is gesteld van zijn recht om de zaak te betwisten, alsmede
      van de termijnen waarbinnen dat rechtsmiddel moet worden aangewend; of

      2°. de veroordeelde niet in persoon is verschenen bij de behandeling ter terechtzitting die tot de rechterlijke
      uitspraak heeft geleid, tenzij in het certificaat is vermeld dat de veroordeelde, overeenkomstig de
      procedurevoorschriften van de uitvaardigende lidstaat:

        - tijdig en in persoon is gedagvaard en daarbij op de hoogte is gebracht van de datum en de plaats van de
      behandeling ter terechtzitting die tot de rechterlijke uitspraak heeft geleid of anderszins daadwerkelijk officieel
      in kennis is gesteld van de datum en de plaats van de behandeling ter terechtzitting, zodat op ondubbelzinnige
      wijze vaststaat dat hij op de hoogte was van de voorgenomen terechtzitting en ervan in kennis is gesteld dat een
      beslissing kan worden genomen wanneer hij niet ter terechtzitting verschijnt; of
        - op de hoogte was van de voorgenomen behandeling ter terechtzitting en een door hem gekozen of een hem
      van overheidswege toegewezen advocaat heeft gemachtigd zijn verdediging te voeren en dat die advocaat ter
      terechtzitting zijn verdediging heeft gevoerd; of
        - nadat de rechterlijke uitspraak aan hem was betekend en hij uitdrukkelijk was geïnformeerd over zijn recht op een
      verzetprocedure of een procedure in hoger beroep, waarbij hij het recht heeft aanwezig te zijn en tijdens welke de
      zaak opnieuw ten gronde wordt behandeld en nieuw bewijsmateriaal wordt toegelaten, en die kan leiden tot herziening
      van de oorspronkelijke uitspraak, uitdrukkelijk te kennen heeft gegeven dat hij de uitspraak niet betwist of niet
      binnen de voorgeschreven termijn verzet of hoger beroep heeft aangetekend; of

      3°. de veroordeelde niet in persoon is verschenen, tenzij in het certificaat is vermeld dat de veroordeelde, na
      uitdrukkelijk te zijn geïnformeerd over de behandeling ter terechtzitting en over de mogelijkheid om in persoon
      ter terechtzitting aanwezig te zijn, uitdrukkelijk heeft verklaard afstand te doen van zijn recht op een mondelinge
      behandeling en uitdrukkelijk te kennen heeft gegeven dat hij de zaak niet betwist.

      i. de aan de veroordeelde opgelegde verplichting een medische of therapeutische behandeling betreft die niet ten
      uitvoer kan worden gelegd overeenkomstig het Nederlandse recht of binnen de kaders van het Nederlandse stelsel
      van gezondheidszorg.

      2 Het openbaar ministerie weigert de erkenning van de rechterlijke uitspraak niet op grond van het eerste lid,
      onderdelen a, b, e en i, dan nadat de bevoegde autoriteit van de uitvaardigende lidstaat in de gelegenheid is
      gesteld hieromtrent inlichtingen te verschaffen.


