  - number: 2:15
    text: |-
      1 Nadat de rechterlijke uitspraak is erkend, draagt Onze Minister er zorg voor dat deze zo spoedig mogelijk,
      overeenkomstig de regels van het Nederlandse recht en met inachtneming van de erkenningsbeslissing, ten uitvoer
      wordt gelegd.

      2 Bij de tenuitvoerlegging van de vrijheidsbenemende sanctie wordt de door de bevoegde autoriteit van de
      uitvaardigende lidstaat in het certificaat aangegeven tijd die al in detentie is doorgebracht in mindering
      gebracht. Eveneens wordt de tijd die in Nederland in detentie is doorgebracht als gevolg van de toepassing van de
      voorlopige maatregelen, bedoeld in de [artikelen 2:19][ref1] en [2:20][ref2], in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0031814#Artikel219
      [ref2]: https://wetten.overheid.nl/BWBR0031814#Artikel220
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel215
