  - number: 3:13
    text: |-
      1 Het openbaar ministerie kan de erkenning van de rechterlijke uitspraak weigeren indien:

      a. het feit waarvoor de sanctie is opgelegd:

      1°. geacht wordt geheel of gedeeltelijk op Nederlands grondgebied of buiten Nederland aan boord van een Nederlands
      vaartuig of luchtvaartuig te zijn gepleegd; of

      2°. buiten het grondgebied van de uitvaardigende lidstaat is gepleegd,

      terwijl naar Nederlands recht geen vervolging zou kunnen worden ingesteld indien het feit buiten Nederland zou
      zijn gepleegd;

      b. de opgelegde taakstraf een kortere duur heeft dan tachtig uren, dan wel de opgelegde verplichting of de
      proeftijd een kortere duur heeft dan zes maanden.

      2 Het openbaar ministerie weigert de erkenning van de rechterlijke uitspraak niet op grond van het eerste
      lid, onderdeel a, dan nadat de bevoegde autoriteit van de uitvaardigende lidstaat in de gelegenheid is gesteld
      hieromtrent inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel313
  - number: 3:14
    text: |-
      1 Nadat de rechterlijke uitspraak is erkend, draagt het openbaar ministerie er zorg voor dat deze zo spoedig
      mogelijk, overeenkomstig de regels van het Nederlandse recht en met inachtneming van de erkenningsbeslissing, ten
      uitvoer wordt gelegd.

      2 Met de tenuitvoerlegging van de rechterlijke uitspraak wordt niet begonnen dan nadat tien dagen zijn
      verstreken na de kennisgeving aan de bevoegde autoriteit in de uitvaardigende lidstaat, bedoeld in
      [artikel 3:10, tweede lid][ref1], tenzij deze autoriteit vóór het verstrijken van deze termijn heeft aangegeven het
      certificaat niet in te trekken.

      3 Voor zover de opdracht hiertoe niet reeds uit de rechterlijke uitspraak voortvloeit, kan het openbaar ministerie
      aan een krachtens algemene maatregel van bestuur aangewezen reclasseringsinstelling opdracht geven toezicht te
      houden op de naleving van de aan de veroordeelde opgelegde verplichtingen en hem ten behoeve daarvan te begeleiden.

      4 De proeftijd vangt aan op de dag van de kennisgeving, bedoeld in [artikel 3:10, derde lid][ref2]. De proeftijd
      wordt verkort met de tijd dat deze in de uitvaardigende lidstaat heeft gelopen.

      5 In afwijking van [artikel 6:6:19 van het Wetboek van Strafvordering][ref3] is de rechtbank in
      het arrondissement waar toezicht wordt gehouden op de naleving van de aan de veroordeelde opgelegde
      verplichtingen bevoegd tot het nemen van de in dat artikel genoemde beslissingen. In afwijking van
      [artikel 6:6:1 van het Wetboek van Strafvordering][ref4] is tot behandeling van de vordering bevoegd de
      rechtbank in het arrondissement waar toezicht wordt gehouden op de naleving van de aan de veroordeelde opgelegde
      verplichtingen.

      6 In afwijking van [artikel 6:6:1 van het Wetboek van Strafvordering][ref5] is tot kennisneming van de vordering
      bevoegd de rechtbank in het arrondissement waar toezicht wordt gehouden op de naleving van de aan de veroordeelde
      opgelegde verplichtingen.

      7 Indien de erkenning ertoe strekt dat een taakstraf ten uitvoer wordt gelegd, vangt de termijn, bedoeld in
      [artikel 6:3:1, eerste lid, van het Wetboek van Strafvordering][ref6], aan op de dag van de kennisgeving, bedoeld
      in [artikel 3:10, derde lid][ref7].

      8 In afwijking van [artikel 6:6:23 van het Wetboek van Strafvordering][ref8] wordt het bezwaarschrift ingediend
      bij de rechtbank in het arrondissement waar de tenuitvoerlegging van de taakstraf plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0031814#Artikel310
