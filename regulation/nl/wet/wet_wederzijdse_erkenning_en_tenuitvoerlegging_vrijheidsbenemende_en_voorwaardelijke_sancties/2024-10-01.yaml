  - number: 5:2
    text: |-
      1 Deze wet treedt in de relatie met de lidstaten van de Europese Unie in de plaats van de
      [Wet overdracht tenuitvoerlegging strafvonnissen][ref1].

      2 Het eerste lid is niet van toepassing in relatie tot een andere lidstaat van de Europese Unie voor zover en voor
      zolang die lidstaat niet de maatregelen heeft getroffen die noodzakelijk zijn om te voldoen aan het kaderbesluit
      2008/909/JBZ van de Raad van de Europese Unie van 27 november 2008 inzake de toepassing van het beginsel van
      wederzijdse erkenning op strafvonnissen waarbij vrijheidsstraffen of tot vrijheidsbeneming strekkende maatregelen
      zijn opgelegd, met het oog op tenuitvoerlegging ervan in de Europese Unie (PbEU L 327) of het kaderbesluit
      2008/947/JBZ van de Raad van de Europese Unie van 27 november 2008 inzake de toepassing van het beginsel van de
      wederzijdse erkenning op vonnissen en proeftijdbeslissingen met het oog op het toezicht op proeftijdvoorwaarden en
      alternatieve straffen (PbEU L 337).

      3 Deze wet is van toepassing indien de garantie van teruglevering, bedoeld in
      [artikel 6, eerste lid, van de Overleveringswet][ref2], voor de inwerkingtreding van deze wet is gegeven, maar de
      teruglevering plaatsvindt na de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004028
      [ref2]: https://wetten.overheid.nl/BWBR0002565#Artikel6
