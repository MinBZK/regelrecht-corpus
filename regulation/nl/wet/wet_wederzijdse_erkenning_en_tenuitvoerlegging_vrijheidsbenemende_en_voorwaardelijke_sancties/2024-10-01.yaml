  - number: 3:10
    text: |-
      1 Het openbaar ministerie erkent de rechterlijke uitspraak en geeft zo nodig toepassing aan [artikel 3:11][ref1],
      tenzij er gronden zijn om de erkenning te weigeren.

      2 Het openbaar ministerie stelt de bevoegde autoriteit van de uitvaardigende lidstaat onverwijld schriftelijk en
      met redenen omkleed in kennis van zijn beslissing op grond van het eerste lid.

      3 Het openbaar ministerie stelt eveneens de veroordeelde schriftelijk en met redenen omkleed in kennis van zijn
      beslissing op grond van het eerste lid. Indien het openbaar ministerie de rechterlijke uitspraak erkent, stelt het
      de veroordeelde in kennis van zijn beslissing, nadat de termijn, bedoeld in [artikel 3:14, tweede lid][ref2], is
      verstreken of zoveel eerder als duidelijk is geworden dat de bevoegde autoriteit van de uitvaardigende lidstaat het
      certificaat niet intrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0031814#Artikel311
