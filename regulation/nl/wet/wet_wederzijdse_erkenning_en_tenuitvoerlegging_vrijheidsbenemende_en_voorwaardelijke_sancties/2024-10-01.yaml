        afdeling: '1'
  - number: 3:5
    text: |-
      De instemming van het openbaar ministerie met de toezending van de rechterlijke uitspraak is niet vereist indien de
      veroordeelde zijn vaste woon- of verblijfplaats in Nederland heeft en in Nederland is teruggekeerd of wenst terug
      te keren.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel35
  - number: 3:6
    text: |-
      Het openbaar ministerie kan, al dan niet op verzoek van de veroordeelde, verzoeken om of instemmen met de
      toezending van een in een andere lidstaat van de Europese Unie gedane rechterlijke uitspraak met het oog op de
      erkenning en tenuitvoerlegging daarvan in Nederland, indien er sprake is van een aantoonbare en voldoende binding
      van de veroordeelde met Nederland.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel36
  - number: 3:7
    text: |-
      1 De rechterlijke uitspraak wordt door de bevoegde autoriteit van de uitvaardigende lidstaat vergezeld van een
      ingevuld certificaat aan het openbaar ministerie gezonden. Het certificaat is opgesteld overeenkomstig het bij
      algemene maatregel van bestuur vastgestelde model.

      2 De toezending kan plaatsvinden per gewone post, telefax of elektronische post, mits de echtheid van de
      toegezonden documenten door het openbaar ministerie kan worden vastgesteld.

      3 Indien de rechterlijke uitspraak en het certificaat niet aan het openbaar ministerie zijn gezonden, worden ze
      door de geadresseerde onverwijld aan het openbaar ministerie doorgezonden. De geadresseerde stelt de bevoegde
      autoriteit van de uitvaardigende lidstaat hiervan onverwijld schriftelijk in kennis. Het openbaar ministerie
      bevestigt de ontvangst van de aan hem doorgezonden documenten aan de bevoegde autoriteit van de uitvaardigende
      lidstaat.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel37
  - number: 3:8
    text: |-
      1 Het openbaar ministerie neemt de rechterlijke uitspraak en het certificaat in behandeling.

      2 Het openbaar ministerie kan de bevoegde autoriteit in de uitvaardigende lidstaat verzoeken een gewaarmerkt
      afschrift van de rechterlijke uitspraak of het origineel van het certificaat over te leggen.

      3 Indien het certificaat niet is gesteld in de Nederlandse taal of, indien Nederland zulks heeft medegedeeld in
      een bij het secretariaat-generaal van de Raad van de Europese Unie neergelegde verklaring, in een van de in die
      verklaring genoemde talen, verzoekt het openbaar ministerie de bevoegde autoriteit in de uitvaardigende lidstaat
      het certificaat alsnog te vertalen.

      4 Indien het certificaat ontbreekt, onvolledig is of kennelijk niet in overeenstemming is met de rechterlijke
      uitspraak, verzoekt het openbaar ministerie de bevoegde autoriteit in de uitvaardigende lidstaat het certificaat
      alsnog te overleggen, aan te vullen of te verbeteren.

      5 Het openbaar ministerie stelt de bevoegde autoriteit van de uitvaardigende lidstaat op diens verzoek op de hoogte
      van de maximumduur van de vrijheidsbenemende sanctie die op grond van het Nederlandse recht ten uitvoer kan worden
      gelegd, indien de veroordeelde de aan hem opgelegde verplichtingen niet naleeft.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel38
  - number: 3:9
    text: |-
      1 Het openbaar ministerie beslist binnen een termijn van zestig dagen na ontvangst van het certificaat over de
      erkenning van de rechterlijke uitspraak.

      2 De beslissing van het openbaar ministerie kan slechts worden uitgesteld:

      a. totdat een vertaling beschikbaar is als bedoeld in [artikel 3:8, derde lid][ref1];

      b. totdat binnen redelijke termijn is voldaan aan het verzoek, bedoeld in [artikel 3:8, vierde lid][ref2];

      c. indien het vanwege uitzonderlijke omstandigheden niet mogelijk is de termijn, bedoeld in het eerste lid, te
      halen.

      3 Het openbaar ministerie stelt de bevoegde autoriteit van de uitvaardigende lidstaat onverwijld in kennis van de
      uitzonderlijke omstandigheden, bedoeld in het tweede lid, onder c, en van de tijd die benodigd is om een beslissing
      te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0031814#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0031814#Artikel38
