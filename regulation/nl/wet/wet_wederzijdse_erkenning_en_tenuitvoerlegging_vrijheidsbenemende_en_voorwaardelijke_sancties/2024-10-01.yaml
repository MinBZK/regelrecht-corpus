  - number: 2:16
    text: |-
      1 Indien de veroordeelde zich in de uitvaardigende lidstaat bevindt, komt Onze Minister met de bevoegde autoriteit
      van die staat het tijdstip overeen waarop de veroordeelde naar Nederland wordt overgebracht. Dit tijdstip ligt niet
      later dan dertig dagen na de beslissing van Onze Minister tot erkenning van de rechterlijke uitspraak.

      2 Indien onvoorziene omstandigheden de overbrenging binnen de termijn, bedoeld in het eerste lid, verhinderen,
      vindt de overbrenging plaats binnen tien dagen nadat deze omstandigheden zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel216
  - number: 2:17
    text: |-
      De veroordeelde wordt in Nederland niet vervolgd, gestraft of op enige andere wijze in zijn persoonlijke vrijheid
      beperkt, ter zake van feiten die vóór het tijdstip van zijn overbrenging zijn begaan en waarvoor hij niet is
      overgebracht, tenzij:

      a. de veroordeelde niet binnen vijfenveertig dagen na zijn invrijheidstelling Nederland heeft verlaten, hoewel hij
      daartoe de mogelijkheid had, of de veroordeelde Nederland heeft verlaten, maar er is teruggekeerd;

      b. de feiten niet zijn bedreigd met een vrijheidsbenemende sanctie;

      c. de strafvervolging niet leidt tot de toepassing van enige maatregel die de vrijheid beperkt;

      d. het gaat om de tenuitvoerlegging van een andere dan een vrijheidsbenemende sanctie;

      e. de veroordeelde met de overbrenging heeft ingestemd;

      f. de veroordeelde na zijn overbrenging uitdrukkelijk afstand heeft gedaan van de bescherming op grond van dit
      artikel; of

      g. daartoe voorafgaand toestemming van de bevoegde autoriteit van de uitvaardigende lidstaat is verkregen.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel217
  - number: 2:18
    text: |-
      Onze Minister stelt de bevoegde autoriteit van de uitvaardigende lidstaat onverwijld in een vorm die toelaat
      dat het schriftelijk wordt vastgelegd in kennis van de volgende informatie over de tenuitvoerlegging van de
      rechterlijke uitspraak:

      a. het tijdstip waarop de voorwaardelijke invrijheidstelling van de veroordeelde ingaat en het tijdstip waarop de
      proeftijd van de voorwaardelijke invrijheidstelling afloopt, indien daar in het certificaat om is gevraagd;

      b. het feit dat de tenuitvoerlegging van de vrijheidsbenemende sanctie is voltooid;

      c. een beslissing betreffende gratie of amnestie als gevolg waarvan de vrijheidsbenemende sanctie niet of niet
      geheel ten uitvoer wordt gelegd;

      d. het feit dat het onmogelijk is om de vrijheidsbenemende sanctie ten uitvoer te leggen, omdat de veroordeelde
      niet in Nederland kan worden gevonden;

      e. het feit dat de veroordeelde zich aan de tenuitvoerlegging van de vrijheidsbenemende sanctie heeft onttrokken.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel218
  - number: 2:19
    text: |-
      1 De veroordeelde die zich in Nederland bevindt, kan worden aangehouden, indien er gegronde redenen bestaan voor
      de verwachting dat een vrijheidsbenemende sanctie op grond van dit hoofdstuk in Nederland ten uitvoer zal worden
      gelegd.

      2 Een verzoek van de bevoegde autoriteit van de uitvaardigende lidstaat dat strekt tot toepassing van het eerste
      lid en dat is gedaan voorafgaand aan de toezending van de rechterlijke uitspraak en het certificaat, kan slechts in
      overweging worden genomen, indien het een vermelding bevat van:

      a. een zo nauwkeurig mogelijk signalement van de veroordeelde;

      b. het strafbare feit waarop de rechterlijke uitspraak betrekking heeft;

      c. de vrijheidsbenemende sanctie die is opgelegd;

      d. de feiten en omstandigheden waaronder het feit is begaan.

      3 Indien de bevoegde autoriteit van de uitvaardigende lidstaat een verzoek heeft gedaan dat strekt tot toepassing
      van het eerste lid, stelt Onze Minister het openbaar ministerie met het oog op de uitvoering ervan op de hoogte.

      4 Iedere officier van justitie of hulpofficier van justitie is bevoegd de aanhouding te bevelen.

      5 Na de veroordeelde te hebben gehoord, kan de officier van justitie of de hulpofficier van justitie bevelen dat
      de opgeëiste persoon gedurende drie dagen, te rekenen vanaf het tijdstip van de aanhouding, in verzekering gesteld
      zal blijven.

      6 [Artikel 39 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel39
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '39'
  - number: 2:20
    text: |-
      1 De rechter-commissaris in het arrondissement waar de veroordeelde in verzekering is gesteld, kan op vordering van
      de officier van justitie de bewaring van de veroordeelde bevelen. Alvorens een dergelijk bevel te geven, hoort de
      rechter-commissaris zo mogelijk de veroordeelde.

      2 Voor de veroordeelde die geen raadsman heeft, wordt door het bestuur van de raad voor rechtsbijstand een raadsman
      aangewezen na mededeling door het openbaar ministerie dat ten aanzien van hem de bewaring is bevolen.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel220
  - number: 2:21
    text: |-
      1 De veroordeelde wiens bewaring is bevolen, wordt in vrijheid gesteld:

      a. indien niet binnen veertien dagen na de dag van de aanhouding de rechterlijke uitspraak en het certificaat door
      Onze Minister zijn ontvangen.

      b. zodra zulks door de rechter-commissaris of de officier van justitie wordt gelast.

      2 De bewaring eindigt van rechtswege op het moment dat de tenuitvoerlegging van de rechterlijke uitspraak een
      aanvang neemt.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel221
  - number: 2:22
    text: |-
      1 De rechter-commissaris kan ambtshalve, op vordering van de officier van justitie of op verzoek van de
      veroordeelde bevelen dat de bewaring voorwaardelijk wordt opgeschort of geschorst.

      2 De opschorting of schorsing eindigt van rechtswege zodra de officier van justitie in kennis is gesteld van de
      beslissing van Onze Minister, bedoeld in [artikel 2:12][ref1].

      3 Op bevelen tot voorwaardelijke opschorting en schorsing, krachtens het eerste lid gegeven,
      zijn de [artikelen 80, eerste en derde tot en met vijfde lid][ref2], [81 tot en met 85][ref3] en
      [88 van het Wetboek van Strafvordering][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031814#Artikel212
