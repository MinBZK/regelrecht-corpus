  - number: 2:11
    text: |-
      1 Tenzij Onze Minister reeds aanstonds van oordeel is dat er gronden zijn om de erkenning van de rechterlijke
      uitspraak te weigeren, doet hij de rechterlijke uitspraak en het certificaat toekomen aan de advocaat-generaal bij
      het ressortsparket.

      2 De advocaat-generaal legt de rechterlijke uitspraak en het certificaat onverwijld voor aan de bijzondere kamer
      van het gerechtshof Arnhem-Leeuwarden, bedoeld in [artikel 67 van de Wet op de rechterlijke organisatie][ref1]. De
      advocaat-generaal dient eventuele opmerkingen bij voornoemde stukken binnen een termijn van veertien dagen nadat
      hij de stukken heeft voorgelegd, in bij de bijzondere kamer van het gerechtshof.

      3 De bijzondere kamer van het gerechtshof beoordeelt:

      a. of er gronden zijn om de erkenning van de rechterlijke uitspraak met toepassing van
      [artikel 2:13, eerste lid][ref2], te weigeren;

      b. of de ten uitvoer te leggen vrijheidsbenemende sanctie is opgelegd voor een feit dat ook naar Nederlands recht
      strafbaar is en zo ja, welk strafbaar feit dit oplevert;

      c. tot welke aanpassing van de opgelegde vrijheidsbenemende sanctie het vierde of vijfde lid aanleiding geeft.

      4 Indien de opgelegde vrijheidsbenemende sanctie een langere duur heeft dan het voor het desbetreffende feit naar
      Nederlands recht toepasselijke strafmaximum, wordt de duur van de vrijheidsbenemende sanctie tot dat strafmaximum
      verlaagd.

      5 Indien de aard van de opgelegde vrijheidsbenemende sanctie onverenigbaar is met het Nederlandse recht, wordt de
      vrijheidsbenemende sanctie gewijzigd in een straf of maatregel waarin het Nederlandse recht voorziet en die zoveel
      mogelijk overeenstemt met de in de uitvaardigende lidstaat opgelegde vrijheidsbenemende sanctie.

      6 De aanpassing op grond van het vierde of vijfde lid houdt in geen geval een verzwaring van de opgelegde
      vrijheidsbenemende sanctie in.

      7 De bijzondere kamer van het gerechtshof doet zijn oordeel op grond van het derde lid, schriftelijk en met
      redenen omkleed aan Onze Minister toekomen, binnen een termijn van zes weken nadat de rechterlijke uitspraak en het
      certificaat zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0031814#Artikel213
