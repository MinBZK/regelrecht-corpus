preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de implementatie van kaderbesluit 2008/909/JBZ van de Raad van
    de Europese Unie van 27 november 2008 inzake de toepassing van het beginsel van wederzijdse erkenning op
    strafvonnissen waarbij vrijheidsstraffen of tot vrijheidsbeneming strekkende maatregelen zijn opgelegd, met
    het oog op tenuitvoerlegging ervan in de Europese Unie (PbEU L 327), van kaderbesluit 2008/947/JBZ van de Raad
    van de Europese Unie van 27 november 2008 inzake de toepassing van het beginsel van de wederzijdse erkenning op
    vonnissen en proeftijdbeslissingen met het oog op het toezicht op proeftijdvoorwaarden en alternatieve straffen
    (PbEU L 337) en van kaderbesluit 2009/299/JBZ van de Raad van de Europese Unie van 26 februari 2009 tot wijziging
    van kaderbesluit 2002/584/JBZ, kaderbesluit 2005/214/JBZ, kaderbesluit 2006/783/JBZ, kaderbesluit 2008/909/JBZ
    en kaderbesluit 2008/947/JBZ en tot versterking van de procedurele rechten van personen, tot bevordering van de
    toepassing van het beginsel van wederzijdse erkenning op beslissingen gegeven ten aanzien van personen die niet
    verschenen zijn tijdens het proces (PbEU L 81) noodzaakt tot het stellen van regels voor de wederzijdse erkenning
    en tenuitvoerlegging van strafvonnissen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      In deze wet en de daarop rustende bepalingen wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Veiligheid en Justitie;
        - *rechterlijke uitspraak:* een onherroepelijke beslissing van een rechter wegens één of meer strafbare feiten;
        - *sanctie:* een bij rechterlijke uitspraak opgelegde straf of maatregel;
        - *uitvaardigende lidstaat:* lidstaat van de Europese Unie waarin een rechterlijke uitspraak is gedaan, die met het
      oog op tenuitvoerlegging daarvan aan een andere lidstaat is of wordt toegezonden;
        - *uitvoerende lidstaat:* lidstaat van de Europese Unie waaraan een in een andere lidstaat gedane rechterlijke
      uitspraak met het oog op tenuitvoerlegging daarvan is of wordt toegezonden;
        - *veroordeelde:* de natuurlijke persoon aan wie een sanctie is opgelegd;
        - *vrijheidsbenemende sanctie:* een sanctie bestaande uit een vrijheidsstraf of vrijheidsbenemende maatregel van
      bepaalde of onbepaalde duur.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel11
  - number: 1:2
    text: |-
      Rechterlijke uitspraken gedaan in een andere lidstaat van de Europese Unie en aan Nederland gezonden met het oog op
      de tenuitvoerlegging alhier, worden overeenkomstig de bepalingen van deze wet erkend en ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel12
  - number: 1:3
    text: |-
      In Nederland gedane rechterlijke uitspraken kunnen overeenkomstig de bepalingen van deze wet worden gezonden aan
      een andere lidstaat van de Europese Unie met het oog op de tenuitvoerlegging aldaar.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel13
  - number: 2:1
    text: |-
      Dit hoofdstuk is van toepassing op rechterlijke uitspraken waarbij aan de veroordeelde een vrijheidsbenemende
      sanctie is opgelegd die voor tenuitvoerlegging vatbaar is.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel21
  - number: 2:2
    text: |-
      1 Onze Minister is bevoegd tot erkenning van een van de uitvaardigende lidstaat ontvangen rechterlijke uitspraak,
      met het oog op tenuitvoerlegging in Nederland.

      2 Onze Minister is bevoegd tot toezending van een Nederlandse rechterlijke uitspraak aan de uitvoerende lidstaat,
      met het oog op de erkenning en tenuitvoerlegging aldaar.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel22
  - number: 2:3
    text: |-
      Een in de uitvaardigende lidstaat gedane rechterlijke uitspraak kan worden erkend en ten uitvoer gelegd in
      Nederland indien:

      a. de veroordeelde zich in de uitvaardigende lidstaat of in Nederland bevindt; en

      b. Onze Minister heeft ingestemd met de toezending van de rechterlijke uitspraak, tenzij deze instemming niet
      vereist is; en

      c. de veroordeelde heeft ingestemd met de toezending van de rechterlijke uitspraak, tenzij deze instemming niet
      vereist is.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel23
  - number: 2:4
    text: |-
      De instemming van Onze Minister met de toezending van de rechterlijke uitspraak is niet vereist indien:

      a. de veroordeelde Nederlander is en in Nederland zijn vaste woon- of verblijfplaats heeft;

      b. de veroordeelde Nederlander is, geen vaste woon- of verblijfplaats in Nederland had, maar na invrijheidstelling
      naar Nederland kan worden uitgezet als gevolg van een daartoe strekkende beslissing in de uitvaardigende lidstaat.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel24
  - number: 2:5
    text: |-
      De instemming van de veroordeelde met de toezending van de rechterlijke uitspraak is niet vereist indien:

      a. de veroordeelde Nederlander is en in Nederland zijn vaste woon- of verblijfplaats heeft;

      b. de veroordeelde na invrijheidstelling naar Nederland kan worden uitgezet als gevolg van een daartoe strekkende
      beslissing in de uitvaardigende lidstaat;

      c. de veroordeelde naar Nederland is gevlucht of teruggekeerd naar aanleiding van de tegen hem in de uitvaardigende
      lidstaat ingestelde strafvervolging of na de veroordeling in die staat.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel25
  - number: 2:6
    text: |-
      Onze Minister kan, al dan niet op verzoek van de veroordeelde, verzoeken om of instemmen met de toezending van
      een in een andere lidstaat van de Europese Unie gedane rechterlijke uitspraak met het oog op de erkenning en
      tenuitvoerlegging daarvan in Nederland, indien er sprake is van een aantoonbare en voldoende binding van de
      veroordeelde met Nederland.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel26
  - number: 2:7
    text: |-
      1 De rechterlijke uitspraak wordt door de bevoegde autoriteit van de uitvaardigende lidstaat vergezeld van een
      ingevuld certificaat aan Onze Minister gezonden. Het certificaat is opgesteld overeenkomstig het bij algemene
      maatregel van bestuur vastgestelde model.

      2 De toezending kan plaatsvinden per gewone post, telefax of elektronische post, mits de echtheid van de
      toegezonden documenten door Onze Minister kan worden vastgesteld.

      3 Indien de rechterlijke uitspraak en het certificaat niet aan Onze Minister zijn gezonden, worden ze door de
      geadresseerde onverwijld aan hem doorgezonden. De geadresseerde stelt de bevoegde autoriteit van de uitvaardigende
      lidstaat hiervan onverwijld schriftelijk in kennis. Onze Minister bevestigt de ontvangst van de aan hem
      doorgezonden documenten aan de bevoegde autoriteit van de uitvaardigende lidstaat.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel27
  - number: 2:8
    text: |-
      1 Onze Minister neemt de rechterlijke uitspraak en het certificaat in behandeling.

      2 Onze Minister kan de bevoegde autoriteit in de uitvaardigende lidstaat verzoeken een gewaarmerkt afschrift van de
      rechterlijke uitspraak of het origineel van het certificaat over te leggen.

      3 Indien het certificaat niet is gesteld in de Nederlandse taal of, indien Nederland zulks heeft medegedeeld
      in een bij het secretariaat-generaal van de Raad van de Europese Unie neergelegde verklaring, in een van de in
      die verklaring genoemde talen, verzoekt Onze Minister de bevoegde autoriteit in de uitvaardigende lidstaat het
      certificaat alsnog te vertalen.

      4 Indien het certificaat ontbreekt, onvolledig is of kennelijk niet in overeenstemming is met de rechterlijke
      uitspraak, verzoekt Onze Minister de bevoegde autoriteit in de uitvaardigende lidstaat het certificaat alsnog te
      overleggen, aan te vullen of te verbeteren.

      5 Indien Onze Minister de inhoud van het certificaat ontoereikend acht om een beslissing te kunnen nemen over de
      erkenning van de rechterlijke uitspraak, verzoekt hij, onverwijld na ontvangst van het certificaat, de bevoegde
      autoriteit van de uitvaardigende lidstaat om een vertaling van de rechterlijke uitspraak of de belangrijkste
      onderdelen ervan in het Nederlands of in een andere officiële taal van de Europese Unie. Met het oog op dit verzoek
      overlegt Onze Minister met de bevoegde autoriteit van de uitvaardigende lidstaat.

      6 Onze Minister stelt de bevoegde autoriteit van de uitvaardigende lidstaat op verzoek, onverwijld na ontvangst
      van het certificaat, op de hoogte van de in Nederland toepasselijke regels betreffende de voorwaardelijke
      invrijheidstelling.

      7 Indien Onze Minister van oordeel is dat de tenuitvoerlegging van de rechterlijke uitspraak in Nederland niet
      zal bijdragen aan de maatschappelijke reïntegratie van de veroordeelde, stelt hij de bevoegde autoriteit van de
      uitvaardigende lidstaat hiervan onverwijld en met redenen omkleed in kennis.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel28
  - number: 2:9
    text: |-
      Indien de veroordeelde zich in Nederland bevindt, stelt Onze Minister hem door middel van het door de
      uitvaardigende lidstaat toegezonden formulier, dat is opgesteld overeenkomstig het bij algemene maatregel van
      bestuur vastgestelde model, in kennis van de toezending van het certificaat en de rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel29
  - number: 2:10
    text: |-
      1 Onze Minister beslist binnen een termijn van negentig dagen na ontvangst van het certificaat over de erkenning
      van de rechterlijke uitspraak.

      2 De beslissing van Onze Minister kan slechts worden uitgesteld:

      a. totdat een vertaling beschikbaar is als bedoeld in [artikel 2:8, derde en vijfde lid][ref1];

      b. totdat binnen redelijke termijn is voldaan aan het verzoek, bedoeld in [artikel 2:8, vierde lid][ref2];

      c. indien het vanwege uitzonderlijke omstandigheden niet mogelijk is de termijn, bedoeld in het eerste lid, te
      halen.

      3 Onze Minister stelt de bevoegde autoriteit van de uitvaardigende lidstaat onverwijld in kennis van de
      uitzonderlijke omstandigheden, bedoeld in het tweede lid, onder c, en van de tijd die benodigd is om een beslissing
      te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0031814#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0031814#Artikel28
