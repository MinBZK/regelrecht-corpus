  - number: 2:14
    text: |-
      1 De erkenning van de rechterlijke uitspraak kan worden geweigerd indien:

      a. het feit waarvoor de vrijheidsbenemende sanctie is opgelegd:

      1°. geacht wordt geheel of gedeeltelijk op Nederlands grondgebied of buiten Nederland aan boord van een Nederlands
      vaartuig of luchtvaartuig te zijn gepleegd; of

      2°. buiten het grondgebied van de uitvaardigende lidstaat is gepleegd, terwijl naar Nederlands recht geen
      vervolging zou kunnen worden ingesteld indien het feit buiten Nederland zou zijn gepleegd;

      b. op het moment van ontvangst van de rechterlijke uitspraak, minder dan zes maanden van de daarbij opgelegde
      vrijheidsbenemende sanctie nog ten uitvoer moeten worden gelegd;

      c. het feit waarvoor de vrijheidsbenemende sanctie is opgelegd, indien het in Nederland was begaan, naar Nederlands
      recht niet strafbaar zou zijn en de veroordeelde is overgeleverd onder de voorwaarde dat deze zijn straf in
      Nederland mag ondergaan als bedoeld in [artikel 6, eerste lid, van de Overleveringswet][ref1].

      2 De erkenning van de rechterlijke uitspraak wordt niet op grond van het eerste lid, onderdeel a, geweigerd dan
      nadat de bevoegde autoriteit van de uitvaardigende lidstaat in de gelegenheid is gesteld hieromtrent inlichtingen
      te verschaffen.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel6
