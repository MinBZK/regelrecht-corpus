  - number: 2:24
    text: |-
      Een Nederlandse rechterlijke uitspraak kan aan de uitvoerende lidstaat worden gezonden, met het oog op de
      tenuitvoerlegging aldaar, indien:

      a. de veroordeelde zich in Nederland of in de uitvoerende lidstaat bevindt; en

      b. de bevoegde autoriteit van de uitvoerende lidstaat met de toezending heeft ingestemd, tenzij deze instemming
      niet vereist is; en

      c. de veroordeelde om de toezending heeft verzocht of daarmee heeft ingestemd, tenzij deze instemming niet vereist
      is; en

      d. Onze Minister zich ervan heeft vergewist, al dan niet na overleg met de bevoegde autoriteit van de uitvoerende
      lidstaat, dat de tenuitvoerlegging in de uitvoerende lidstaat kan bijdragen aan de maatschappelijke reïntegratie
      van de veroordeelde in die staat.
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel224
  - number: 2:25
    text: |-
      Toezending van de rechterlijke uitspraak kan zonder de instemming van de bevoegde autoriteit van de uitvoerende
      lidstaat plaatsvinden indien:

      a. de veroordeelde onderdaan is van de uitvoerende lidstaat en in de uitvoerende lidstaat zijn vaste woon- of
      verblijfplaats heeft;

      b. de veroordeelde onderdaan is van de uitvoerende lidstaat, geen vaste woon- of verblijfplaats heeft in
      die staat, maar na invrijheidstelling naar die staat kan worden uitgezet als gevolg van een op grond van de
      [Vreemdelingenwet 2000][ref1] aan hem opgelegde verplichting Nederland te verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 2:26
    text: |-
      Toezending van de rechterlijke uitspraak kan zonder de instemming van de veroordeelde plaatsvinden indien:

      a. de veroordeelde onderdaan is van de uitvoerende lidstaat en in de uitvoerende lidstaat zijn vaste woon- of
      verblijfplaats heeft;

      b. de veroordeelde na invrijheidstelling naar de uitvoerende lidstaat kan worden uitgezet als gevolg van een op
      grond van de [Vreemdelingenwet 2000][ref1] aan hem opgelegde verplichting Nederland te verlaten;

      c. de veroordeelde naar de uitvoerende lidstaat is gevlucht of teruggekeerd naar aanleiding van de tegen hem in
      Nederland ingestelde strafvervolging of na de veroordeling in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0031814/2024-10-01#Artikel226
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 2:27
    text: |-
      1 Onze Minister stelt de veroordeelde in de gelegenheid zijn mening te geven over het voornemen om een rechterlijk
      uitspraak aan de uitvoerende lidstaat te zenden. Tenzij de mening van de veroordeelde aanleiding geeft om van het
      voornemen af te zien, geeft Onze Minister van zijn voornemen schriftelijk kennis aan de veroordeelde.

      2 Het eerste lid blijft buiten toepassing, indien de veroordeelde zich niet in Nederland bevindt of zelf om de
      toezending van de rechterlijke uitspraak heeft verzocht.

      3 De veroordeelde kan binnen veertien dagen na ontvangst van de kennisgeving tegen het voornemen van Onze
      Minister een bezwaarschrift indienen bij de bijzondere kamer van het gerechtshof Arnhem-Leeuwarden, bedoeld in
      [artikel 67 van de Wet op de rechterlijke organisatie][ref1].

      4 Zo spoedig mogelijk na ontvangst van een tijdig ingediend bezwaarschrift onderzoekt de bijzondere kamer van het
      gerechtshof of Onze Minister bij afweging van de betrokken belangen in redelijkheid tot de voorgenomen beslissing
      kan komen.

      5 De veroordeelde wordt bij het onderzoek gehoord, althans opgeroepen. In geval de veroordeelde geen raadsman
      heeft, geeft de voorzitter aan het bestuur van de raad voor rechtsbijstand last tot aanwijzing van een raadsman.

      6 De [artikelen 21 tot en met 25 van het Wetboek van Strafvordering][ref2] zijn van overeenkomstige toepassing.

      7 Van zijn beslissing stelt de bijzondere kamer van het gerechtshof Onze Minister en de veroordeelde schriftelijk
      in kennis. Acht de bijzondere kamer van het gerechtshof het bezwaarschrift gegrond, dan ziet Onze Minister af van
      de toezending van de rechterlijke uitspraak aan de uitvoerende lidstaat.

      8 Tegen de beslissing van de bijzondere kamer van het gerechtshof staat geen rechtsmiddel open, anders dan beroep
      in cassatie in het belang der wet als bedoeld in [artikel 456 van het Wetboek van Strafvordering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel456
