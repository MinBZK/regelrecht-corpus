  - number: 3:11
    text: |-
      1 Indien de aan de veroordeelde opgelegde verplichting, de proeftijd, de termijn waarbinnen de verplichting moet
      zijn uitgevoerd dan wel de vrijheidsbenemende sanctie die ten uitvoer kan worden gelegd indien de verplichting
      niet is nageleefd, een langere duur heeft dan de maximumduur die op grond van het Nederlandse recht is toegestaan,
      verlaagt het openbaar ministerie de duur tot dat maximum, met dien verstande dat in het geval, bedoeld in
      [artikel 3:1, eerste lid, onder b][ref1], de periode waarover in de uitvaardigende lidstaat voorwaardelijke
      invrijheidstelling is verleend, niet wordt aangepast.

      2 Indien de aard van de aan de veroordeelde opgelegde verplichting, dan wel de vrijheidsbenemende sanctie die ten
      uitvoer kan worden gelegd, indien de verplichting niet is nageleefd, onverenigbaar is met het Nederlandse recht,
      past het openbaar ministerie deze zodanig aan dat tenuitvoerlegging in Nederland mogelijk is op een wijze die
      zoveel mogelijk overeenstemt met de in de uitvaardigende lidstaat opgelegde verplichting dan wel vrijheidsbenemende
      sanctie.

      3 De aanpassing op grond van dit artikel houdt in geen geval een verzwaring van de in de uitvaardigende lidstaat
      opgelegde verplichting, de proeftijd, de termijn waarbinnen de verplichting moet zijn uitgevoerd dan wel de
      vrijheidsbenemende sanctie in.


      [ref1]: https://wetten.overheid.nl/BWBR0031814#Artikel31
