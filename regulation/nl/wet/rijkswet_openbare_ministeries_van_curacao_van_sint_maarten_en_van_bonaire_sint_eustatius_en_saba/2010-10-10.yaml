        bwb_id: BWBR0028072
        artikel: '22'
        hoofdstuk: '4'
  - number: '24'
    text: |-
      Indien Onze Minister oordeelt dat een reden tot ontslag van de procureur-generaal is gelegen in gebleken
      ongeschiktheid voor zijn functie anders dan uit hoofde van ziekte of gebreken, dan kan hij een voorstel tot
      schorsing of ontslag met inachtneming van de toepasselijke procedureregels aanmelden voor agendering in de raad van
      ministers van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel24
  - number: '25'
    text: |-
      1 Tegen een rechtspositionele beschikking of handeling waarbij een lid van het openbaar ministerie als zodanig,
      zijn nagelaten betrekkingen of zijn rechtverkrijgenden belanghebbende zijn, kan een belanghebbende beroep instellen
      bij het Gerecht in eerste aanleg van het land waar belanghebbende woont. Indien belanghebbende niet woont in één
      van de landen, is het Gerecht in eerste aanleg van Curaçao bevoegd.

      2 Tegen de uitspraak van het Gerecht in eerste aanleg kan een belanghebbende hoger beroep instellen bij het Hof.

      3 Geen beroep kan worden ingesteld tegen een beschikking tot benoeming of aanstelling, tenzij het beroep
      wordt ingesteld door een lid van het openbaar ministerie als zodanig, zijn nagelaten betrekkingen of zijn
      rechtverkrijgenden.

      4 Op de behandeling van het beroep en het hoger beroep zijn de regels van het procesrecht voor de behandeling van
      ambtenaarrechtelijke geschillen van het land waarin het beroep wordt behandeld van overeenkomstige toepassing.

      5 Met een beschikking of handeling bedoeld in dit artikel wordt een weigering te beschikken of te handelen
      gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel25
  - number: '26'
    text: |-
      De rechtspositie van de leden van het openbaar ministerie wordt overigens geregeld bij of krachtens algemene
      maatregel van rijksbestuur. Daarbij kunnen nadere regels worden gesteld over schorsing en ontslag.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel26
  - number: '27'
    text: |-
      Andere ambtenaren bij het parket van de procureur-generaal als bedoeld in [artikel 4, derde lid][ref1], worden
      benoemd door Onze Minister van het land waar de ambtenaar voornamelijk werkzaam zal zijn op voorstel van de
      procureur-generaal. Op hun rechtspositie zijn de in dat land geldende ambtenarenregelingen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028072#Artikel4
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028072
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '28'
    text: |-
      De procureur-generaal is belast met het beheer van de openbare ministeries van de landen. In het bijzonder draagt
      de procureur-generaal zorg voor:

      a. de kwaliteit en de bestuurlijke en organisatorische werkwijze van de openbare ministeries;

      b. de voorbereiding van de begrotingen van het parket in eerste aanleg en het parket van de procureur-generaal;

      c. het toezicht houden op de uitvoering van de begrotingen;

      d. het afleggen van verantwoording aan Onze Minister over de uitvoering van de begroting van het openbaar
      ministerie;

      e. de automatisering, de bestuurlijke informatievoorziening, de huisvesting, de beveiliging, de personele en
      materiële voorzieningen bij de openbare ministeries.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel28
  - number: '29'
    text: |-
      1 Onze Ministers voeren jaarlijks voor 15 april overleg over het totaal van de in het daaropvolgende jaar door de
      landen beschikbaar te stellen middelen voor het parket van de procureur-generaal.

      2 De procureur-generaal zendt ter voorbereiding van het in het eerste lid bedoelde overleg voor 15 maart aan Onze
      Ministers een jaarplan met een ontwerpbegroting voor het parket van de procureur-generaal. De ontwerpbegroting gaat
      vergezeld van een meerjarenraming voor tenminste vier op het begrotingsjaar volgende jaren. Het jaarplan bevat een
      omschrijving van de voorgenomen activiteiten, de doelstellingen en de prestatieafspraken van het parket voor het
      komende jaar.

      3 Op basis van het in het eerste lid bedoelde overleg stellen Onze Ministers zo spoedig mogelijk de begroting voor
      het parket van de procureur-generaal vast. Onze Ministers stellen het jaarplan vast uiterlijk voor aanvang van het
      jaar waarop het jaarplan betrekking heeft.

      4 De kosten van het parket van de procureur-generaal worden op grond van een bij of krachtens algemene maatregel
      van rijksbestuur vast te stellen verdeelsleutel aan de landen toebedeeld.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel29
  - number: '30'
    text: |-
      1 De procureur-generaal stelt jaarlijks voor 1 april in overeenstemming met de betrokken hoofdofficier van justitie
      een jaarplan op met een daarbij behorende ontwerp-begroting voor het parket in eerste aanleg. De ontwerpbegroting
      gaat vergezeld van een meerjarenraming voor tenminste vier op het begrotingsjaar volgende jaren. Het jaarplan bevat
      een omschrijving van de voorgenomen activiteiten, de doelstellingen en de prestatieafspraken van het parket voor
      het komende jaar.

      2 Onze Minister stelt zo spoedig mogelijk de begroting van het parket in eerste aanleg vast. Onze Minister stelt
      het jaarplan vast voor 1 december van het jaar voorafgaand aan het jaar waarop het jaarplan betrekking heeft.

      3 De procureur-generaal ziet toe op de uitvoering van het jaarplan en voert daarover regelmatig maar ten minste
      vier keer per jaar in persoon overleg met de hoofdofficier van justitie in het land van standplaats van de
      betrokken hoofdofficier.

      4 Elk van de landen draagt de kosten van zijn parket in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel30
  - number: '31'
    text: |-
      1 De procureur-generaal dient jaarlijks voor 1 april bij Onze Minister een jaarverslag in over het parket van
      de procureur-generaal. Het jaarverslag bevat een verantwoording over de activiteiten, de doelstellingen en de
      prestatieafspraken. Het jaarverslag bevat tevens de jaarrekening met bijbehorende begroting en overige financiële
      gegevens.

      2 De procureur-generaal dient jaarlijks voor 1 april bij Onze Minister een jaarverslag in over de uitvoering van de
      begroting van het parket in eerste aanleg. De tweede en derde zin van het eerste lid is van toepassing.

      3 Het jaarverslag van het parket van de procureur-generaal gaat vergezeld van een verklaring omtrent de getrouwheid
      afgegeven door een door de procureur-generaal in overeenstemming met Onze Ministers aangewezen accountant.

      4 Bij de aanwijzing van de accountant bedingt de procureur-generaal dat aan Onze Minister desgevraagd inzicht wordt
      geboden in de controlewerkzaamheden van de accountant.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel31
  - number: '32'
    text: |-
      Privaatrechtelijke rechtshandelingen die voortvloeien uit het beheer van de begroting van het parket van de
      procureur-generaal en van de begrotingen van de parketten in eerste aanleg, worden verricht door of namens de
      procureur-generaal.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel32
  - number: '33'
    text: |-
      1 Onze Ministers voeren overleg over de opsporing en vervolging van grensoverschrijdende criminaliteit en
      maken afspraken over in ieder geval de personele en materiële inzet voor het beleid ter bestrijding van de
      grensoverschrijdende criminaliteit.

      2 Onder grensoverschrijdende criminaliteit wordt in ieder geval verstaan: terrorisme, internationale drugshandel,
      computercriminaliteit, het internationale witwassen van geld, internationale wapenhandel, internationale
      mensenhandel en internationale corruptie.

      3 De afspraken, bedoeld in het eerste lid, worden na overeenstemming tussen Onze Ministers vastgesteld door de raad
      van ministers van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel33
  - number: '34'
    text: |-
      1 De procureur-generaal doet in opdracht van Onze Ministers vierjaarlijks een voorstel voor een beleidsprogramma
      voor de bestrijding van grensoverschrijdende criminaliteit.

      2 Het beleidsprogramma wordt, na overeenstemming tussen Onze Ministers vastgesteld door de raad van ministers van
      het Koninkrijk.

      3 De procureur-generaal kan de korpschefs opdragen ten behoeve van de opsporing en vervolging van
      grensoverschrijdende criminaliteit ambtenaren van politie, middelen en voorzieningen beschikbaar te stellen conform
      de afspraken die hierover in de raad van ministers van het Koninkrijk zijn gemaakt.

      4 Onze Ministers kunnen regels geven over de wijze waarop gegevens met betrekking tot grensoverschrijdende
      criminaliteit worden geregistreerd, verwijderd dan wel worden verstrekt. Verstrekking van gegevens vindt plaats met
      inachtneming van de daarvoor geldende wettelijke voorschriften van de landen.

      5 De procureur-generaal is bevoegd officieren van justitie aan te wijzen die zijn belast met de opsporing en
      vervolging van grensoverschrijdende criminaliteit.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel34
  - number: '35'
    text: |-
      1 Op verzoek van de procureur-generaal kunnen ambtenaren van de rijksrecherche ondersteuning verlenen ten behoeve
      van onderzoek naar integriteitschendingen en de opsporing van ambtsdelicten.

      2 De procureur-generaal doet een verzoek als bedoeld in het eerste lid eerst na overleg met Onze Minister.

      3 De ambtenaren van de rijksrecherche beschikken bij de uitoefening van hun taken ten behoeve van de procureur-
      generaal over de bevoegdheden van de ambtenaren van politie van het desbetreffende land. De ambtenaren van de
      rijksrecherche die de gevraagde bijstand verlenen functioneren onder het gezag van de procureur-generaal.

      4 De procureur-generaal is bevoegd in het belang van een goede rechtsbedeling te vorderen dat door hem aangewezen
      ambtenaren van politie worden belast met onderzoek naar integriteitschendingen en ambtsdelicten. De korpsen zijn
      verplicht aan dergelijk onderzoek medewerking te verlenen en de aangewezen ambtenaren de nodige inlichtingen te
      verschaffen.

      5 Onder onderzoek naar integriteitschendingen wordt verstaan opsporingsonderzoek naar strafbare feiten die de
      integriteit van de overheid kunnen aantasten en zijn begaan door natuurlijke personen of rechtspersonen belast met
      een publieke taak, of betrokken bij de uitvoering daarvan.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel35
  - number: '36'
    text: |-
      1 Onze Ministers en de procureur-generaal voeren ten minste één keer per jaar overleg waarin ze afspraken maken
      over het opsporings- en vervolgingsbeleid van de landen.

      2 Onze Ministers stemmen in overleg met de procureur-generaal jaarlijks het beleid af voor de opsporing en
      vervolging in de landen van misdrijven die gezien de aard en de frequentie of het georganiseerd verband waarin ze
      worden gepleegd een ernstige inbreuk op de rechtsorde vormen. De resultaten van de afstemming worden schriftelijk
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel36
  - number: 36a
    text: |-
      1 De procureur-generaal voert ten minste tweemaal per jaar met een daartoe door het College van procureurs-
      generaal in Nederland aangewezen lid van dat College overleg over opsporing en vervolging van grensoverschrijdende
      criminaliteit en andere aangelegenheden die van gemeenschappelijk belang zijn voor de strafrechtelijke
      rechtshandhaving in de landen en in het Europese deel van Nederland.

      2 Het overleg strekt tevens tot het maken van afspraken over onderlinge hulp en bijstand.

      3 Voor het overleg wordt de procureur-generaal van Aruba uitgenodigd.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel36a
  - number: '37'
    text: |-
      De procureur-generaal kan een aanwijzing als bedoeld in [artikel 13, eerste lid][ref1], binnen twee weken nadat
      zij is gegeven voorleggen aan Onze Ministers indien de aanwijzing naar zijn oordeel het gezamenlijk beleid van de
      landen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0028072#Artikel13
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028072
        artikel: '13'
        hoofdstuk: '3'
  - number: '38'
    text: |-
      1 De benoeming van degene die op de dag voorafgaand aan inwerkingtreding van deze rijkswet procureur-generaal van
      de Nederlandse Antillen is, wordt van rechtswege gewijzigd in een benoeming tot procureur-generaal van de landen.

      2 De benoeming van degene die op de dag voorafgaand aan de inwerkingtreding van deze rijkswet advocaat-generaal
      bij het openbaar ministerie van de Nederlandse Antillen is, wordt van rechtswege gewijzigd in een benoeming tot
      advocaat-generaal bij het parket van de procureur-generaal.

      3 Officieren van justitie, plaatsvervangend officieren van justitie en substituut-officieren van justitie die op de
      dag voorafgaand aan inwerkingtreding van deze wet in dienst zijn van de Nederlandse Antillen zijn met ingang van de
      datum van inwerkingtreding van deze wet in dezelfde rang benoemd bij het openbaar ministerie van het land waarin de
      plaats is gelegen die op de dag voorafgaand aan inwerkingtreding van deze wet standplaats van betrokkene was.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel38
  - number: '39'
    text: |-
      Zaken die voorafgaand aan inwerkingtreding van deze rijkswet in behandeling zijn bij het openbaar ministerie van de
      Nederlandse Antillen alsmede wettelijke procedures en rechtsgedingen waarbij het openbaar ministerie is betrokken
      worden voortgezet door het openbaar ministerie van Curaçao, het openbaar ministerie van Sint Maarten of het
      openbaar ministerie van Bonaire, Sint Eustatius of Saba. Zo nodig beslist de procureur-generaal welk van deze drie
      openbare ministeries de behandeling of procedure voortzet.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel39
  - number: '40'
    text: |-
      Onze Ministers zenden binnen vijf jaar na de inwerkingtreding van deze rijkswet aan de vertegenwoordigende lichamen
      van Sint Maarten en Curaçao en de Staten-Generaal een evaluatieverslag over de doeltreffendheid en de effecten van
      deze rijkswet in de praktijk. Voorafgaande aan de evaluatie zullen de landen gezamenlijk de criteria, de thema’s
      alsmede de samenstelling van de evaluatiecommissie vaststellen.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel40
  - number: '41'
    text: |-
      1 Deze rijkswet kan in onderling overleg worden gewijzigd bij rijkswet op grond van
      [artikel 38, tweede lid, van het Statuut][ref1].

      2 Naar aanleiding van de evaluatie, bedoeld in [artikel 40][ref2], kan deze rijkswet in onderlinge overeenstemming
      worden beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0028072#Artikel40
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0028072
        artikel: '40'
        hoofdstuk: '7'
  - number: '42'
    text: Deze rijkswet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel42
  - number: '43'
    text: |-
      Deze rijkswet wordt aangehaald als: Rijkswet openbare ministeries van Curaçao, van Sint Maarten en van Bonaire,
      Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel43
