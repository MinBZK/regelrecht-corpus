  - number: '21'
    text: |-
      1 Een lid van het openbaar ministerie wordt ontslagen:

      a. op eigen verzoek;

      b. met ingang van de eerste dag van de maand volgende op die waarin hij de leeftijd van vijfenzestig jaar heeft
      bereikt;

      c. indien hij een ambt of betrekking aanvaardt bedoeld in [artikel 18, vijfde lid][ref1];

      d. bij het verlies van het Nederlanderschap;

      e. bij gebleken ongeschiktheid voor de functie, anders dan wegens ziekte of gebreken.

      2 In de gevallen, bedoeld in het eerste lid onder a en b, wordt het ontslag eervol verleend.

      3 In het geval bedoeld in het eerste lid, onder c, kan het ontslag eervol worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028072#Artikel18
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028072
        artikel: '18'
        hoofdstuk: '4'
  - number: '22'
    text: |-
      1 Een lid van het openbaar ministerie kan voorts worden ontslagen:

      a. indien hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel bij zulk
      een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      b. indien hij bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, surséance van betaling heeft verkregen of wegens schulden is gegijzeld;

      c. indien hij uit hoofde van ziekte of gebreken blijvend ongeschikt is om zijn functie te vervullen;

      d. wegens handelen of nalaten, dat ernstig nadeel toebrengt aan de goede gang van zaken bij het openbaar ministerie
      of aan het in hem te stellen vertrouwen.

      2 In het geval bedoeld in het eerste lid, onder c, wordt het ontslag eervol verleend.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel22
  - number: '23'
    text: |-
      Alvorens een besluit op grond van de [artikelen 20, tweede lid][ref1], [21, eerste lid, onder e][ref2], en
      [22][ref3] wordt genomen wordt betrokkene in de gelegenheid gesteld zijn zienswijze mondeling of schriftelijk naar
      voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0028072#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0028072#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0028072#Artikel22
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel23
