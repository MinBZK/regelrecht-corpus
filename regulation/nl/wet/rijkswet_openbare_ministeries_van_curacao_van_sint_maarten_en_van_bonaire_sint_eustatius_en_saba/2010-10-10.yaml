preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de regeringen van Nederland en de Nederlandse Antillen en de
    bestuurscolleges van Curaçao en Sint Maarten binnen het Koninkrijk willen samenwerken door de inrichting,
    organisatie en het beheer van de openbare ministeries van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius
    en Saba en de onderlinge samenwerking tussen deze openbare ministeries te regelen in een rijkswet op grond van
    artikel 38, tweede lid, van het Statuut voor het Koninkrijk en dat de regeringen van Nederland en de Nederlandse
    Antillen en de bestuurscolleges van Curaçao en Sint Maarten instemmen met de inhoud van deze regeling;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze rijkswet en de daarop berustende bepalingen wordt verstaan onder:

        - *algemene maatregel van rijksbestuur:* algemene maatregel van rijksbestuur in de zin van
      [artikel 38, tweede lid, van het Statuut voor het Koninkrijk der Nederlanden][ref1];
        - *landen:* Curaçao, Sint Maarten en Nederland voor zover het betreft Bonaire, Sint Eustatius en Saba;
        - *Gerecht in eerste aanleg:* Gerecht in eerste aanleg van Curaçao, Gerecht in eerste aanleg van Sint Maarten of
      Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba;
        - *Hof:* Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en
      Saba;
        - *Hoge Raad:* Hoge Raad der Nederlanden;
        - *Onze Minister:* Onze Minister van Justitie van Curaçao, Onze Minister van Justitie van Sint Maarten of Onze
      Minister van Justitie van Nederland afhankelijk van het land dat het aangaat;
        - *Onze Ministers:* Onze Minister van Justitie van Curaçao, Onze Minister van Justitie van Sint Maarten en Onze
      Minister van Justitie van Nederland gezamenlijk;
        - *Statuut:* Statuut voor het Koninkrijk der Nederlanden.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel38
