        artikel: '38'
  - number: '2'
    text: |-
      1 Het openbaar ministerie van elk van de landen bestaat uit:

      a. het parket van de procureur-generaal en

      b. het parket in eerste aanleg.

      2 Aan het hoofd van de openbare ministeries van de landen staat een gezamenlijke procureur-generaal.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel2
  - number: '3'
    text: |-
      1 Het parket van de procureur-generaal is gevestigd in Curaçao. De procureur-generaal houdt in elk land kantoor.

      2 Bij het kantoor van de procureur-generaal in Sint Maarten is een daartoe door de procureur-generaal aangewezen
      medewerker van het parket van de procureur-generaal als hoofd van dat kantoor werkzaam.

      3 Het hoofd van het kantoor ondersteunt de procureur-generaal bij in ieder geval de volgende taken in Sint Maarten:

      a. de zorg voor de kwaliteit en bestuurlijke en organisatorische werkwijze van het openbaar ministerie;

      b. de voorbereiding van het jaarplan en de begroting van het parket in eerste aanleg en het toezicht op de
      uitvoering daarvan;

      c. de voorbereiding en uitvoering van het beleidsprogramma voor de bestrijding van grensoverschrijdende
      criminaliteit;

      d. het toezicht op een behoorlijke opsporing en vervolging van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel3
  - number: '4'
    text: |-
      1 De procureur-generaal staat aan het hoofd van het parket van de procureur-generaal.

      2 Bij het parket van de procureur-generaal zijn naast de procureur-generaal een of meer andere leden van het
      openbaar ministerie werkzaam, waaronder in elk geval een advocaat-generaal.

      3 Bij het parket van de procureur-generaal kunnen andere ambtenaren werkzaam zijn, die geen lid zijn van het
      openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel4
  - number: '5'
    text: |-
      1 Het openbaar ministerie bij het Hof wordt ten behoeve van de landen uitgeoefend door of namens de procureur-
      generaal.

      2 Bij verhindering of afwezigheid wordt de procureur-generaal vervangen door de advocaat-generaal. Bij verhindering
      of afwezigheid van de advocaat-generaal kan de procureur-generaal zich doen vervangen door een door de procureur-
      generaal aan te wijzen hoofdofficier van justitie of diens plaatsvervanger, die dan als waarnemend procureur-
      generaal optreedt.

      3 In geval van ontstentenis van de procureur-generaal voor langere duur wordt bij koninklijk besluit in de
      vervanging voorzien. De voordracht voor benoeming van de vervanger geschiedt op voorstel van Onze Ministers.

      4 De procureur-generaal kan algemene en bijzondere aanwijzingen geven betreffende de uitoefening van de taken en
      bevoegdheden van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel5
  - number: '6'
    text: |-
      1 De procureur-generaal is bevoegd tot het instellen van hoger beroep in strafzaken die door een Gerecht in eerste
      aanleg zijn berecht, onverminderd de bevoegdheid van de officier van justitie op grond van landsverordening of wet
      hoger beroep in te stellen.

      2 De procureur-generaal is belast met de opsporing en vervolging van strafbare feiten waarvan de berechting in
      eerste aanleg aan het Gemeenschappelijk Hof van Justitie is opgedragen.

      3 De procureur-generaal ziet toe op een behoorlijke opsporing en vervolging van strafbare feiten.

      4 De procureur-generaal kan voorts andere, hem bij landsverordening of wet opgedragen taken vervullen.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel6
  - number: '7'
    text: |-
      1 Aan het hoofd van het openbaar ministerie bij het Gerecht in eerste aanleg staat een hoofdofficier van
      justitie, die als hoofd van het parket in eerste aanleg wordt benoemd. De hoofdofficieren van justitie zijn in hun
      ambtsbetrekking ondergeschikt aan de procureur-generaal.

      2 Bij het parket in eerste aanleg kunnen naast de hoofdofficier van justitie officieren van justitie, substituut-
      officieren van justitie, plaatsvervangende officieren van justitie en andere ambtenaren werkzaam zijn. De
      hoofdofficier van justitie, de officieren van justitie, substituut-officieren van justitie en plaatsvervangende
      officieren van justitie zijn in de uitoefening van hun functie allen op gelijke wijze lid van het openbaar
      ministerie.

      3 De officieren van justitie, de substituut-officieren van justitie en de plaatsvervangende officieren van
      justitie zijn in hun ambtsbetrekking ondergeschikt aan het hoofd van het parket, waarbij zij zijn geplaatst. De
      hoofdofficier kan de bij zijn parket werkzame leden van het openbaar ministerie algemene en bijzondere aanwijzingen
      geven betreffende de uitoefening van hun taken en bevoegdheden.

      4 Bij verhindering of afwezigheid van de hoofdofficier van justitie wordt zijn functie waargenomen door een ander
      lid van het desbetreffende parket.

      5 De inrichting en organisatie van het parket in eerste aanleg kan overigens bij landsverordening of wet worden
      geregeld.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel7
  - number: '8'
    text: |-
      1 Officieren van justitie zijn bevoegd en inzetbaar in elk van de landen. Onze Ministers maken hierover nadere
      afspraken.

      2 De afspraken hebben in ieder geval betrekking op

      a. de betrokkenheid van de procureur-generaal bij het inzetten van een officier van justitie in een ander land dan
      het land van aanstelling;

      b. onderlinge vergoeding van de kosten;

      c. onderlinge informatieverstrekking;

      d. evaluatie van de afspraken.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel8
  - number: '9'
    text: |-
      1 Het openbaar ministerie is belast met de strafrechtelijke handhaving van de rechtsorde en met andere bij
      landsverordening of wet vastgestelde taken.

      2 Het openbaar ministerie is in het bijzonder belast met:

      a. de handhaving van de wettelijke regelingen;

      b. de opsporing en vervolging van strafbare feiten;

      c. het doen uitvoeren van vonnissen en beschikkingen in strafzaken;

      d. het toezicht op de naleving van de rechterlijke beslissingen in tuchtzaken.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel9
  - number: '10'
    text: |-
      De taken en bevoegdheden van het openbaar ministerie worden, op de wijze bij of krachtens landsverordening of wet
      bepaald, uitgeoefend door de leden van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel10
  - number: '11'
    text: |-
      1 De procureur-generaal is belast met de zorg voor de justitiële politie. Hij is bevoegd aan de ambtenaren die met
      de politie belast zijn zodanige instructies te geven tot voorkoming, opsporing, en nasporing van strafbare feiten
      als hij in het belang van een goede justitie nodig oordeelt.

      2 De procureur-generaal waakt voor de richtige uitoefening van de taak van de politie. Hij is bevoegd daarover aan
      Onze Minister de voorstellen te doen die hem dienstig voorkomen.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel11
  - number: '12'
    text: |-
      1 Wanneer het aan het Hof voorkomt dat de vervolging van een strafbaar feit in een van de landen behoort te worden
      ingesteld of voortgezet, is de procureur-generaal verplicht te voldoen aan een bevel van het Hof om de gevraagde
      informatie te verstrekken.

      2 De procureur-generaal is, behoudens de bepalingen van strafvordering van het desbetreffende land, verplicht om op
      bevel van het Hof te vervolgen of te doen vervolgen.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel12
  - number: '13'
    text: |-
      1 Onze Minister kan de procureur-generaal algemene aanwijzingen geven betreffende de opsporing en vervolging van
      strafbare feiten in zijn land. Een aanwijzing wordt schriftelijk en gemotiveerd gegeven.

      2 Indien Onze Minister voornemens is de procureur-generaal een bijzondere aanwijzing te geven betreffende de
      opsporing en vervolging van strafbare feiten in zijn land, dan legt hij de voorgenomen aanwijzing voor aan het Hof
      ter toetsing aan het recht. Het Hof beslist binnen een week op het verzoek van Onze Minister. Indien het Hof van
      oordeel is dat de voorgenomen aanwijzing in overeenstemming is met het recht, dan kan Onze Minister de aanwijzing
      geven.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel13
  - number: '14'
    text: |-
      De openbare ministeries van de landen en van Nederland zijn onderling verplicht gevolg te geven aan verzoeken om
      rechtshulp. Onze Ministers kunnen hierover nadere afspraken maken.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel14
  - number: '15'
    text: |-
      1 Het openbaar ministerie is verplicht bericht en advies te geven, wanneer dit door of vanwege de regering van het
      betrokken land wordt gevraagd. Een verzoek om bericht of advies wordt gedaan aan de procureur-generaal.

      2 De leden van het openbaar ministerie verstrekken de procureur-generaal de inlichtingen die hij nodig heeft.

      3 Wanneer de zaak waaromtrent bericht en advies is gevraagd, aan een rechterlijke beslissing is onderworpen of te
      voorzien is dat dit zal geschieden, is het geven van eenvoudig bericht voldoende.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel15
  - number: '16'
    text: |-
      1 De procureur-generaal en de advocaat-generaal worden benoemd, geschorst en ontslagen bij koninklijk besluit.

      2 Indien de plaats van procureur-generaal of advocaat-generaal openvalt, nodigen Onze Ministers het Hof en de
      procureur-generaal uit gezamenlijk een aanbeveling voor benoeming te doen. De aanbeveling bevat de namen van ten
      hoogste drie kandidaten.

      3 De voordracht voor benoeming wordt gedaan op voorstel van Onze Ministers. Daarbij nemen zij de aanbeveling,
      bedoeld in het tweede lid, zoveel mogelijk in acht.

      4 Indien Onze Ministers voornemens zijn af te wijken van de aanbeveling winnen zij daaromtrent het gevoelen van het
      Hof en de procureur-generaal in. Het gevoelen van het Hof en de procureur-generaal en de aanbeveling worden bij het
      voorstel van Onze Ministers gevoegd. Zij motiveren waarom zij zijn afgeweken van de aanbeveling.

      5 De procureur-generaal kan leden van en andere ambtenaren werkzaam bij het openbaar ministerie van elk van de
      landen aanwijzen om bij het parket van de procureur-generaal werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel16
  - number: '17'
    text: |-
      1 De hoofdofficier van justitie wordt benoemd, geschorst en ontslagen bij koninklijk besluit. De voordracht
      geschiedt op voorstel van Onze Minister.

      2 Indien een plaats van hoofdofficier van justitie openvalt zendt de procureur-generaal, gehoord het Hof, een
      schriftelijke aanbeveling bevattende de namen van ten hoogste drie kandidaten aan Onze Minister.

      3 De overige leden van het openbaar ministerie werkzaam bij het parket in eerste aanleg van Curaçao of Sint Maarten
      worden benoemd, geschorst en ontslagen bij landsbesluit van het desbetreffende land, op een daartoe strekkende
      aanbeveling van de procureur-generaal.

      4 De overige leden van het openbaar ministerie werkzaam bij het parket in eerste aanleg van Bonaire, Sint Eustatius
      en Saba worden benoemd, geschorst en ontslagen bij koninklijk besluit op een daartoe strekkende aanbeveling van de
      procureur-generaal.

      5 Bij of krachtens landsverordening of wet kunnen nadere regels worden gesteld met betrekking tot de
      benoemingsprocedure van de overige leden van het openbaar ministerie werkzaam bij het parket in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel17
  - number: '18'
    text: |-
      1 Tot lid van het openbaar ministerie kan worden benoemd degene:

      a. aan wie op grond van het met goed gevolg afleggen van een afsluitend examen van een opleiding in het
      wetenschappelijk onderwijs op het gebied van het recht door een bij algemene maatregel van rijksbestuur aan te
      wijzen universiteit, de graad van Bachelor op het gebied van het recht en tevens de graad van Master op het gebied
      van het recht is verleend;

      b. aan wie op grond van het met goed gevolg afleggen van een afsluitend examen van een opleiding op het gebied van
      het recht aan een bij algemene maatregel van rijksbestuur aan te wijzen universiteit, het recht om de titel meester
      te voeren heeft verkregen.

      2 Bij algemene maatregel van rijksbestuur kunnen graden verleend door een universiteit of een hogeschool of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van het eerste lid, onder a, gelijk
      worden gesteld aan de in dat lid bedoelde graad Bachelor op het gebied van het recht.

      3 Op voorstel van de procureur-generaal kunnen plaatsvervangend officieren van justitie worden benoemd die niet
      voldoen aan de vereisten, bedoeld in het eerste en tweede lid.

      4 De leden van het openbaar ministerie moeten Nederlander zijn.

      5 De leden van het openbaar ministerie kunnen niet zijn:

      a. Gouverneur;

      b. minister of staatssecretaris;

      c. commissaris der Koningin of gedeputeerde;

      d. lid van de vertegenwoordigende lichamen van Curaçao of van Sint Maarten, lid van de Staten-Generaal of lid van
      een eilandsraad;

      e. Rijksvertegenwoordiger, gezaghebber of eilandsgedeputeerde;

      f. burgemeester of wethouder;

      g. lid van het Hof of van de Beheerraad;

      h. lid van de Raad voor de rechtshandhaving;

      i. lid van de Raad van Advies van Curaçao of Sint Maarten;

      j. lid van de Raad van State van het Koninkrijk;

      k. lid van de Algemene Rekenkamer van één van de landen;

      l. nationale of eilandelijke ombudsman of substituut-ombudsman;

      m. advocaat of notaris dan wel anderszins beroepsmatige rechtshulpverlener;

      n. ambtenaar bij een ministerie of een eiland van het land waar betrokkene als lid van het openbaar ministerie
      is aangesteld, alsmede de daaronder ressorterende instellingen, diensten en bedrijven, met dien verstande dat
      onderdeel n niet van toepassing is op substituut-officieren van justitie en plaatsvervangende officieren van
      justitie.

      6 Een lid van het openbaar ministerie geeft de procureur-generaal kennis van de betrekkingen die hij buiten zijn
      ambt vervult. Zo mogelijk geschiedt de kennisgeving zodra het voornemen bestaat tot het aangaan van de betrekking.

      7 De procureur-generaal houdt een register bij waarin de in het zesde lid bedoelde betrekkingen zijn opgenomen. Het
      register ligt ter inzage bij het parket van de procureur-generaal en het parket in eerste aanleg waar betrokkene
      werkzaam is.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel18
  - number: '19'
    text: |-
      1 De leden van het openbaar ministerie leggen voorafgaand aan de datum van indiensttreding de eed of belofte af
      volgens het formulier zoals vastgesteld in de bijlage bij deze rijkswet.

      2 De leden van het openbaar ministerie leggen de eed af ten overstaan van de Gouverneur van Curaçao, de Gouverneur
      van Sint Maarten of de Rijksvertegenwoordiger van Bonaire, Sint Eustatius en Saba of ten overstaan van een door de
      Gouverneur of de Rijksvertegenwoordiger aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel19
  - number: 19a
    text: |-
      Een lid van het openbaar ministerie is verplicht tot geheimhouding van de gegevens waarover hij bij de uitoefening
      van zijn taak de beschikking krijgt en waarvan hij het vertrouwelijk karakter kent of redelijkerwijs moet
      vermoeden, behoudens zover enig wettelijk voorschrift tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel19a
  - number: 19b
    text: |-
      1 Echtgenoten, bloedverwanten of aanverwanten tot in de derde graad mogen niet tegelijkertijd lid van het openbaar
      ministerie zijn.

      2 Indien leden van het openbaar ministerie met elkaar huwen, zal de jongstbenoemde geen lid van het openbaar
      ministerie kunnen blijven.

      3 Indien de aanverwantschap ontstaat na de benoeming, zal degene die haar veroorzaakte, zijn ambt niet kunnen
      behouden, tenzij ontheffing is verleend door het tot benoeming bevoegde gezag.

      4 Het aanverwantschap houdt op te bestaan door ontbinding van het huwelijk.

      5 Degene die ingevolge het tweede en het derde lid zijn ambt niet kan behouden, dient zijn ontslag in.

      6 De procureur-generaal draagt er zorg voor dat aanverwanten aan wie ontheffing is verleend als bedoeld in het
      derde lid, niet worden belast met de behandeling van dezelfde zaak.
    url: https://wetten.overheid.nl/BWBR0028072/2010-10-10#Artikel19b
  - number: '20'
    text: |-
      1 Een lid van het openbaar ministerie wordt geschorst indien:

      a. hij zich in voorlopige hechtenis bevindt;

      b. hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens een misdrijf is veroordeeld dan wel
      hem bij een dergelijke uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      c. hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, hij surséance van betaling heeft gekregen, dan wel wegens schulden is gegijzeld.

      2 Een lid van het openbaar ministerie kan worden geschorst indien:

      a. tegen hem een gerechtelijk vooronderzoek ter zake van een misdrijf is ingesteld;

      b. er een ander ernstig vermoeden is voor het bestaan van feiten of omstandigheden die tot ontslag, anders dan op
      grond van [artikel 21, eerste lid, onder a en b][ref1], of [artikel 22, onder c][ref2], zou kunnen leiden.

      3 De schorsing als bedoeld in de voorgaande leden, eindigt na drie maanden. De maatregel kan telkens voor ten
      hoogste drie maanden worden verlengd.

      4 De schorsing wordt beëindigd zodra de grond voor deze maatregel is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0028072#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0028072#Artikel22
