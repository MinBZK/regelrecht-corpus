        - [Verordening PDV erkenningsregeling GMP diervoedersector 2000](onbekend);
        - [Verordening Vvr regeling diervoeders voor de productie van varkensvlees volgens Japanstandaard 1994](onbekend);
        - [Besluit WR erkenningsregeling laboratoria bedrijfsinterne controle diervoedersector 1996](onbekend);
        - [Besluit PDV normen GMP diervoedersector 1999](onbekend);
        - [Besluit Vvr regeling leveranciers voeders voor scharreldieren 1995](onbekend);
        - [Besluit Vvr regeling leveranciers voeders voor grasmerk 1995](onbekend);
        - [Besluit PDV transport diervoeders GMP 2000](onbekend);
        - [Besluit PDV gebruik en toezicht collectieve beeldmerken GMP diervoedersector 2001](onbekend);
        - [Besluit Vvr nadere voorschriften GMP-erkenning](onbekend);
        - [Besluit PDV beoordelings- en toezichtsprocedure GMP diervoedersector 1998](onbekend);
        - [Besluit PDV gebruik Quality Control beeldmerk 2002][ref1].


