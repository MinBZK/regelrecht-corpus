  - number: '14'
    text: |-
      In aanvulling op de eigen geschillenregeling van de certificatie-instelling is op geschillen tussen deelnemers
      en certificatie-instellingen inzake het gebruik door de certificatieinstelling van zijn bevoegdheden ingevolge
      [artikel 5, eerste lid][ref1] en [artikel 13, eerste lid][ref2], van toepassing het als [bijlage GMP16][ref3] bij
      deze verordening opgenomen geschillenreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0014959#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0014959#Artikel13
