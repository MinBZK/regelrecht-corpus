  - number: '17'
    text: |-
      De op de dag van inwerkingtreding van deze verordening bestaande erkenningen op grond van de [Verordening PDV
      erkenningsregeling GMP diervoedersector 2000](onbekend) blijven van kracht en erkenningen die vanaf 1 december 2002
      tot de dag van inwerkingtreding zijn verlopen worden geacht te zijn verlengd met één jaar, onder voorwaarde dat de
      deelnemer vóór 1 augustus 2003 een overeenkomst met een geaccepteerde certificatie-instelling sluit voor uitvoering
      van een beoordeling als bedoeld in [artikel 11, eerste lid][ref1].


