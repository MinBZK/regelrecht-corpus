      - id: ref2
        bwb_id: BWBR0014959
      - id: ref3
        bwb_id: BWBR0014959
      - id: ref4
        bwb_id: BWBR0014959
  - number: '8'
    text: |-
      Iedere deelnemer is gerechtigd de collectieve beeldmerken in een vertaalde versie in het Duits, Engels, Frans,
      Grieks, Italiaans of Spaans te gebruiken. De vertaalde beeldmerken moeten overeenkomen met de beeldmerken,
      afgebeeld in [bijlage GMP15][ref1] bij deze verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0014959
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014959
  - number: '9'
    text: |-
      1 Iedere gebruiker van één van de collectieve beeldmerken is verplicht iedere inbreuk die hem ter kennis komt mede
      te delen aan zijn certificatie-instelling, of het productschap.

      2 Onverminderd de bevoegdheid van het productschap is iedere certificatie-instelling zelfstandig bevoegd tot
      het instellen van een vordering tegen een ieder die, zonder daartoe gerechtigd te zijn, gebruik maakt van een
      collectief beeldmerk of van een daarmee overeenstemmend teken.

      3 Iedere gebruiker van één van de collectieve beeldmerken is bevoegd om zich te voegen of tussen te komen in een
      geding als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel9
  - number: '10'
    text: |-
      1 Het verzoek tot acceptatie als certificatie-instelling wordt ingediend bij het productschap.

      2 Het bestuur stelt, gehoord het College, bij besluit de procedure en voorwaarden voor acceptatie van een
      certificatie-instelling vast.

      3 Na indiening van de aanvraag tot acceptatie beoordeelt het productschap binnen een termijn van drie maanden of de
      certificatie-instelling voldoet aan de voorwaarden bedoeld in het tweede lid.

      4 De acceptatie van een certificatie-instelling wordt namens het bestuur verleend door de secretaris bij
      wederzijdse overeenkomst met een duur van vier jaren.

      5 Bij acceptatie verkrijgt de certificatie-instelling het niet exclusieve recht, onder de bij de in het vierde lid
      genoemde overeenkomst nader te stellen voorwaarden, met inachtneming van het bepaalde in [paragraaf 2][ref1] aan
      ondernemers in de diervoedersector erkenningscertificaten te verlenen.

      6 De namen, adressen en vestigingsplaatsen van de geaccepteerde certificatie instellingen worden door de secretaris
      vastgelegd in een openbaar register.

      7 Bij wijziging van de naam, het adres of de vestigingsplaats dan wel bij opheffing is de certificatie-instelling
      verplicht het productschap binnen één maand vooraf daarvan in kennis te stellen.

      8 De certificatie-instelling die een verzoek tot acceptatie indient als bedoeld in het eerste lid, is aan
      het productschap een door het bestuur vast te stellen vergoeding verschuldigd. De geaccepteerde certificatie-
      instellingen zijn jaarlijks een door het bestuur vast te stellen licentievergoeding aan het productschap
      verschuldigd, dat bestaat uit een vast bedrag per certificatie-instelling en een bedrag per door deze erkende
      deelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0014959#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014959
        paragraaf: '2'
  - number: '11'
    text: |-
      1 Een certificatie-instelling neemt bij de beoordeling van ondernemers, alsmede bij de verlening, verlenging,
      opschorting en intrekking van een erkenningscertificaat strikt in acht het bepaalde in deze verordening, alsmede de
      door het bestuur, gehoord het College, bij besluit vastgestelde richtlijnen voor beoordeling en certificatie.

      2 Het Bureau Coördinatie Diervoedercertificatie en -controle houdt toezicht op de naleving door de certificatie-
      instellingen van de verplichtingen bedoeld in het voorgaande lid.

      3 Het productschap neemt bij de beoordeling van certificatie-instellingen strikt in acht het bepaalde in
      deze verordening, alsmede de door het bestuur, gehoord het College, bij besluit vastgestelde richtlijnen voor
      beoordeling en sanctionering van certificatie-instellingen.

      4 Indien de certificatie-instelling de verplichtingen in of krachtens deze verordening niet naleeft, kan de
      secretaris namens het bestuur:

        - geen verlenging van de erkenning, als bedoeld in [artikel 10, vierde lid][ref1], verlenen, of
        - de erkenning schorsen of
        - de erkenning intrekken

      en dit besluit bekend maken.


      [ref1]: https://wetten.overheid.nl/BWBR0014959#Artikel10
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014959
        artikel: '10'
        paragraaf: '5'
  - number: '12'
    text: |-
      1 De deelnemer is verplicht alle medewerking te verlenen aan de controle bedoeld in [artikel 11][ref1] en aan het
      toezicht door of vanwege het productschap op de naleving van de voorwaarden en voorschriften bij of krachtens deze
      verordening gesteld.

      2 De deelnemer is verplicht het bepaalde bij of krachtens deze verordening na te leven.

      3 De deelnemer dient bij wijziging van de GMP-regeling binnen één jaar na bekendmaking daarvan aan de wijziging te
      voldoen, tenzij het bestuur, gehoord het College, een kortere termijn bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0014959#Artikel11
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014959
        artikel: '11'
        paragraaf: '5'
  - number: '13'
    text: |-
      1 Indien de deelnemer de verplichtingen uit [artikel 12][ref1] niet naleeft, dan wel bij de herbeoordeling als
      bedoeld in [artikel 4, derde lid][ref2], niet aan de voorwaarden en criteria van de GMP-regeling blijkt te voldoen,
      kan de certificatieinstelling:

        - geen verlenging van het certificaat, betrekking hebbend op alle voor de onderneming van toepassing zijnde GMP-
      standaarden en QC-standaard als bedoeld in [artikel 4, tweede lid][ref3], verlenen, of
        - het certificaat, betrekking hebbend op alle voor de onderneming van toepassing zijnde GMP-standaarden en QC-
      standaard, schorsen voor de duur van maximaal drie maanden, en
        - het certificaat, betrekking hebbend op alle voor de onderneming van toepassing zijnde GMP-standaarden en
      QC-standaard, intrekken indien na afloop van de in het voorgaande gedachtestreepje genoemde schorsing de
      tekortkomingen niet ten genoegen van de certificatie-instelling aantoonbaar zijn opgeheven.

      2 Na het intrekken dan wel het niet verlengen van een erkenning is de ondernemer gedurende een periode van een jaar
      uitgesloten van de mogelijkheid tot het aanvragen van een erkenning.

      3 Indien daartoe naar het oordeel van het productschap gehoord het College aanleiding bestaat, kan de in het
      voorgaande lid bedoelde uitsluiting tevens iedere andere ondernemer betreffen waarin al dan niet middellijk en op
      welke wijze ook beslissende zeggenschap wordt uitgeoefend of verkregen door:

        - de uitgesloten ondernemer, of
        - een rechtspersoon die in de uitgesloten ondernemer al dan niet middellijk en op welke wijze ook beslissende
      zeggenschap uitoefent of in de erkenningsperiode heeft uitgeoefend, of
        - een natuurlijke persoon die in de uitgesloten ondernemer al dan niet middellijk en op welke wijze ook beslissende
      zeggenschap uitoefent of in de erkenningsperiode heeft uitgeoefend.

      Het bepaalde in [artikel 6, derde en vierde lid][ref4], is van overeenkomstige toepassing.

      4 Op grond van redelijkheid en billijkheid kan de certificatie-instelling besluiten de niet-verlenging, schorsing
      of intrekking van het certificaat, als bedoeld in het eerste lid, op één of meer GMP-standaarden betrekking te
      laten hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0014959#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0014959#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0014959#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0014959#Artikel6
