preamble:
  text: |-
    Het bestuur van het Productschap Diervoeder:

    Gelet op de artikelen 93 en 95 van de Wet op de bedrijfsorganisatie en de artikelen 2, 4 en 9 van de
    Instellingsverordening Akkerbouwproductschappen 1997;

    Gelet op de noodzaak dat de diervoederketen de veiligheid van producten als voeding voor het dier en daarmee het
    dier en producten van het dier als voeding voor de mens zeker stelt

    Gelet op de noodzaak om in dit kader een geloofwaardig en effectief kwaliteitscertificeringsysteem op te zetten
    voor de bedrijven in de diervoederketen, waarvan de normen en beheersmaatregelen mede adequate beoordeling en
    sanctionering kunnen worden gehandhaafd,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze verordening neemt over de terminologie van de Richtlijnen 701524lEEG. 79/373EEG, 82/471/EEG, 90/167/
      EG, 92/117/EEG, 93/113/EG, 95/69/EG, 96/251/EEG, 2002/32/EG, enig nadere wettelijke regeling van de Europese
      Gemeenschap van toepassing voor de diervoedersector, en de [Verordening PDV bevoegdheden en werkwijze organen en
      inrichting secretariaat 1999](onbekend) en verstaat voorts onder:










                  a.


                  GMP-standaard


                  :


                  Good Manufacturing/Managing Practice standaard, zijnde de voorwaarden en criteria met betrekking tot
      bedrijfsinrichting, bedrijfsvoering, procescondities, processen, procedures, verantwoordelijkheden en voorzieningen
      zoals aangegeven in de [bijlagen GMP01 tot en met GMP12][ref1] bij deze verordening, waaraan moet worden voldaan om
      te waarborgen dat de kwaliteit wordt gerealiseerd;




                  b.


                  QC-standaard


                  :


                  Standard Quality Control of Feed Materials for Animal Feed, zijnde de voorwaarden en criteria met
      betrekking tot bedrijfsinrichting, bedrijfsvoering, procescondities, processen, procedures, verantwoordelijkheden
      en voorzieningen zoals aangegeven in de [bijlage GMP13][ref2] bij deze verordening, waaraan de goedgekeurde
      leverancier dient te voldoen;




                  c.


                  onderneming


                  :


                  de aan het economisch verkeer deelnemende technisch-organisatorische eenheid die activiteiten verricht
      met betrekking tot op- en overslag, be- en verwerking, productie, handel dan wel vervoer van voedermiddelen,
      voormengsels, toevoegingsmiddelen of diervoeders (incl. mengvoeders);




                  d.


                  bedrijfseenheid


                  :


                  iedere naar locatie of functie te onderscheiden eenheid binnen een onderneming als bedoeld onder b.
      waarbinnen activiteiten worden verricht waarvoor een GMP-standaard bestaat, met dien verstande dat alle locaties
      van een onderneming welke uitsluitend handel drijft als een bedrijfseenheid worden aangemerkt;




                  e.


                  ondernemer


                  :


                  de natuurlijke- of rechtspersoon ongeacht nationaliteit, woon- of vestigingsplaats die een onderneming
      drijft als bedoeld onder c.;




                  f.


                  deelnemer


                  :


                  de ondernemer aan wie overeenkomstig het bepaalde bij deze verordening een erkenningscertificaat is
      verleend;




                  g.


                  kritische punten


                  :


                  die punten in het totale proces van voortbrenging en behandeling, die een rechtstreekse nadelige
      invloed hebben op de basiskwaliteit van voedermiddelen, voormengsels, toevoegingsmiddelen of diervoeders;




                  h.


                  certificatie-instelling


                  :


                  de gespecialiseerde instelling die ingevolge [paragraaf 5][ref3] van deze verordening door het
      productschap als zodanig is geaccepteerd;




                  i.


                  basiskwaliteit


                  :


                  de kenmerken van toevoegingen diergeneesmiddelen, voormengsels, voedermiddelen en diervoeders, die:
                  ten behoeve van de veiligheid van het dier, de consument van voedermiddelen van dierlijke oorsprong en/
      of het milieu in wetgeving (in Europese Unie en aanvullend nationaal) zijn vastgelegd,
      in aanvulling op a) zijn geformuleerd op basis van consensus in de diervoedersector na overleg met de organisaties
      van de betreffende veehouderijsectoren en daar achterliggende (verwerkende) sectoren;




                  j.


                  norm


                  :


                  iedere norm met betrekking tot basiskwaliteit als bedoeld onder i, zoals genoemd, dan wel vastgesteld
      in [bijlage GMP14][ref4] bij deze verordening;




                  k.


                  actiegrens


                  :


                  waarde bij overschrijding waarvan onderzoek dient te worden gedaan naar de oorzaak en corrigerende
      maatregelen dienen te worden genomen om de oorzaak weg te nemen of te beperken;




                  1.


                  afkeurgrens


                  :


                  waarde bij overschrijding waarvan het product ongeschikt wordt geacht om te worden gebruikt als
      voedermiddel of diervoeder;




                  m.


                  GMP-regeling


                  :


                  het geheel van voorwaarden en criteria omtrent het kwaliteitssysteem zoals vastgelegd in de GMP-
      standaarden, alsmede van de normen met betrekking tot basiskwaliteit en de daarbij behorende nader vastgestelde
      beheersingsmaatregelen, bij of krachtens deze verordening van toepassing zijnde;




                  n.


                  College


                  :


                  het college als bedoeld in het [Besluit PW College van Deskundigen Diervoedersector 2000](onbekend);




                  o.


                  goedgekeurde leverancier


                  :


                  de buitenlandse leverancier van voedermiddelen waarvan een certificatie-instelling heeft vastgesteld
      dat het toegepaste kwaliteitssysteem voldoet aan de Standard Quality Control of Feed Materials als opgenomen in
      de [bijlage GMP13][ref5].




                  p.


                  collectieve beeldmerken


                  :


                  het collectieve beeldmerk "GMP-gecertificeerd bedrijf", het collectieve beeldmerk "GMP+HACCP-
      gecertificeerd bedrijf", het collectieve beeldmerk "HACCP", het collectieve beeldmerk "GMP-gecertificeerd
      transportbedrijf', en het collectieve beeldmerk "QC-bedrijf", als opgenomen in de [bijlage GMP15][ref6];


