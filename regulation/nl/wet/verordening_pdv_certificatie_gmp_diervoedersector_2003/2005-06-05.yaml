  - number: '15'
    text: |-
      1 De voorzitter is bevoegd, namens het bestuur, bij besluit
      [bijlage 1 bij de "GMP- standaard wegtransport diervoedersector, GMP 07][ref1]" te wijzigen.

      2 De voorzitter is bevoegd, namens het bestuur, bij besluit de bijlage
      "[Productnormen GMP-regeling diervoedersector, GMP 14][ref2]" te wijzigen, indien het gaat om normen of verboden
      producten die reeds nationaal of communautair bij een wettelijke regeling geregeld zijn.

      3 Besluiten van het bestuur en de voorzitter als bedoeld in [artikel 10, tweede lid][ref3],
      [artikel 11, eerste lid][ref4] en [artikel 15, eerste en tweede lid][ref5], alsmede de besluiten bedoeld in de
      bijlagen bij deze verordening, worden bekendgemaakt in het Verordeningenblad Bedrijfsorganisatie en treden in
      werking op de tweede dag na publicatie, tenzij het betreffende besluit anders bepaalt.


