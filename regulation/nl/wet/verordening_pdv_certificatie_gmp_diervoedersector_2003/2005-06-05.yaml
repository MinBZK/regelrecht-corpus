        artikel: '1'
        paragraaf: '1'
  - number: '3'
    text: |-
      De ondernemer die de basiskwaliteit jegens zijn afnemers wil borgen overeenkomstig de GMP-regeling kan een
      erkenningscertificaat aanvragen.
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel3
  - number: '4'
    text: |-
      1 Een erkenningscertificaat wordt aangevraagd bij een door het productschap ingevolge [artikel 10][ref1]
      geaccepteerde certificatie-instelling.

      2 Een erkenningscertificaat wordt afgegeven indien:

        - ten genoegen van de certificatie-instelling wordt aangetoond dat in elke bedrijfseenheid alle activiteiten
      waarvoor een GMP-standaard of de QC-standaard van toepassing is daaraan voldoen en
        - over alle wettelijk voorgeschreven registraties, erkenningen en vergunningen wordt beschikt en

        - opgave wordt gedaan van de zeggenschapsverhoudingen binnen de onderneming, alsmede het samenstel van
      ondernemingen waarvan de onderneming deel uitmaakt.

      3 Indien op één locatie meerdere ondernemers activiteiten uitoefenen waarvoor een GMP-standaard bestaat, dient
      ieder van hen voor deze activiteiten over een erkenningscertificaat te beschikken.

      4 Indien de acceptatie van de certificatie-instelling van wie de deelnemer een erkenningscertificaat heeft,
      wordt ingetrokken, is de deelnemer verplicht binnen drie maanden een overeenkomst met een andere geaccepteerde
      certificatie-instelling te sluiten. Deze CI dient vervolgens binnen 3 maanden na het sluiten van de overeenkomst
      een nieuw erkenningscertificaat af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0014959#Artikel10
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014959
        artikel: '10'
        paragraaf: '5'
  - number: '5'
    text: |-
      1 Indien ten genoegen van de certificatie-instelling is aangetoond dat aan de voorwaarden van de toepasselijke
      GMP-standaard dan wel de QC-standaard wordt voldaan, verleent de certificatie-instelling aan de ondernemer per
      bedrijfseenheid een erkenningscertificaat waarin de GMP-standaarden worden genoemd, die ZW beoordeeld en waaraan
      wordt voldaan.

      2 Het erkenningscertificaat heeft een geldigheidsduur van drie jaar. De geldigheidsduur wordt telkenmale met drie
      jaar verlengd tenzij:

      a. de deelnemer uiterlijk drie maanden voor het verstrijken van de geldigheidsduur schriftelijk te kennen heeft
      gegeven van verlenging af te zien, of

      b. de beoordeling als bedoeld in het derde lid tot een negatieve uitkomst leidt, of

      c. toepassing wordt gegeven aan het bepaalde in [artikel 13, eerste lid][ref1].

      3 Alvorens de certificatie-instelling tot verlenging van het erkenningscertificaat overgaat, voert hij een
      herbeoordeling uit ten aanzien van het voldoen aan de GMP-regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0014959#Artikel13
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014959
        artikel: '13'
        paragraaf: '6'
  - number: 5a
    text: |-
      1 Een deelnemer die diervoeders produceert kan voor een niet-gecertificeerde tussenhandelaar garant staan,
      indien hij via deze tussenhandelaar aflevert aan een veehouder en wil waarborgen dat alle diervoeder van deze
      tussenhandelaar overeenkomstig de [GMP-standaard GMP02][ref1] of overeenkomstig [GMP04][ref2] voor zover van
      toepassing is geproduceerd.

      2 De in het eerste lid bedoelde tussenhandelaar mag geen etiket of begeleidend document wijzigen, geen tussenopslag
      in bulk en geen bulktransport verrichten en slechts overwegend van één producent diervoeders afnemen.

      3 De deelnemer houdt een lijst bij van tussenhandelaren en producten waarvoor hij garant staat en deelt iedere
      wijziging binnen één maand mee aan de certificatie-instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0014959
      [ref2]: https://wetten.overheid.nl/BWBR0014959
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0014959
      - id: ref2
        bwb_id: BWBR0014959
  - number: '6'
    text: |-
      1 De certificatie-instelling doet aan de secretaris onverwijld opgave van de naam, het adres en de
      vestigingsplaats, voor zover nodig met vermelding van bedrijfseenheden, van elke ondernemer waaraan hij een
      erkenningscertificaat verleent, alsmede voor welke GMP-standaard(en) en aanvullende aanduidingen als bedoeld in
      [artikel 7, vierde lid][ref1], dan wel de QC-standaard het erkenningscertificaat is verleend.

      2 De certificatie-instelling stelt de secretaris binnen één maand schriftelijk in kennis van iedere wijziging van
      de gegevens als bedoeld in het eerste lid.

      3 De certificatie-instelling stelt de secretaris binnen 24 uur schriftelijk in kennis van de namen, adressen
      en vestigingsplaatsen van de ondernemers waarvan het erkenningscertificaat is geschorst, ingetrokken of niet is
      verlengd. De secretaris is gerechtigd om belanghebbenden hierover actief te informeren.

      4 De certificatie-instelling doet aan de secretaris onverwijld opgave van de tussenhandelaren en de producten
      waarvoor overeenkomstig [artikel 5a][ref2] deelnemers garant staan.

      5 De secretaris legt de in de voorgaande leden bedoelde gegevens vast in een openbaar register.


      [ref1]: https://wetten.overheid.nl/BWBR0014959#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014959#Artikel5a
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014959
        artikel: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0014959
        artikel: 5a
        paragraaf: '2'
  - number: '7'
    text: |-
      1 De deelnemer is gerechtigd tot het gebruik van het collectieve beeldmerk "GMP-gecertificeerd bedrijf':

      a. op of bij de bedrijfseenheid waarvoor de erkenning is verleend;

      b. op of bij de producten afkomstig van de onder a. bedoelde bedrijfseenheid, mits de handel in, op- en overslag,
      be- en verwerking dan wel productie van de producten heeft plaatsgevonden overeenkomstig de daarop van toepassing
      zijnde GMP-standaarden;

      c. op bescheiden afgegeven door de onder a. bedoelde bedrijfseenheid.

      2 Onverminderd het bepaalde in het eerste lid is de deelnemer die blijkens zijn erkenningscertificaat voldoet
      aan het bepaalde in [bijlage GMP01, paragraaf 1][ref1], gerechtigd tot het gebruik van het collectieve beeldmerk
      "GMP+HACCP-gecertificeerd bedrijf' en het collectieve beeldmerk "HACCP op de wijze als genoemd in het eerste lid.

      3 Onverminderd het bepaalde in het eerste en het tweede lid is de deelnemer die blijkens zijn erkenningscertificaat
      ten aanzien van transport voldoet aan het bepaalde in [bijlage GMP07][ref2] gerechtigd tot het gebruik van het
      collectieve beeldmerk "GMP-gecertificeerd transportbedrijf' op de wijze als genoemd in het eerste lid.

      4 De deelnemer is gerechtigd een of meer aanvullende aanduidingen te vermelden, indien hij voldoet aan de
      desbetreffende aanvullende criteria voor productkenmerken vermeld in [bijlage GMP14][ref3].

      5 De goedgekeurde leverancier is gerechtigd tot het gebruik van het collectieve beeldmerk "QC-bedrijf' opgenomen in
      [bijlage GMP15][ref4] op de wijze als genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014959
      [ref2]: https://wetten.overheid.nl/BWBR0014959
      [ref3]: https://wetten.overheid.nl/BWBR0014959
      [ref4]: https://wetten.overheid.nl/BWBR0014959
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel7
    references:
      - id: ref1
