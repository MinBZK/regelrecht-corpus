  - number: '2'
    text: |-
      Onverminderd de normen als bedoeld in [artikel 1, onderdeel j.][ref1], worden toevoegings- en diergeneesmiddelen,
      voormengsels, voedermiddelen en diervoeders waarin stoffen aanwezig zijn die kennelijk dienen om de aanwezigheid
      van andere stoffen te maskeren in het kader van de GMP-regeling als ondeugdelijk aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0014959#Artikel1
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel2
    references:
      - id: ref1
