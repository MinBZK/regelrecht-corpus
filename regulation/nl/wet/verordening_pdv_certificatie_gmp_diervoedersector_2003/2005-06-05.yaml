  - number: '19'
    text: 'Deze verordening wordt aangehaald als: Verordening PDV certificatie GMP diervoedersector 2003.'
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel19
  - number: B16:1
    text: |-
      Dit reglement neem over de terminologie van de Verordening PDV erkenningsregeling GMP diervoedersector 2003, en
      verstaat voorts onder:

      a. Geschillencommissie: de in artikel 2 bedoelde geschillencommissie;

      b. secretaris: de fungerend secretaris van de geschillencommissie
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel1
  - number: B16:2
    text: |-
      1 Er is een Geschillencommissie GMP, welke zetelt ten kantore van het Productschap Diervoeder.

      2 De Geschillencommissie is met uitzondering van de civiele rechter belast met de beslissing in alle geschillen,
      ontstaan tussen ondernemers en certificatie-instellingen.

      3 Het productschap benoemt ten minste zeven personen die als lid van de Geschillencommissie kunnen fungeren. Deze
      personen hebben geen binding met de certificatie-instellingen anders dan voortvloeiend uit dit reglement. Tevens
      benoemt het productschap een voorzitter die de hoedanigheid van meester in de rechten bezit.

      4 De Geschillencommissie bestaat uit de voorzitter en twee leden die door de voorzitter worden aangewezen uit de
      overeenkomstig het derde lid benoemde personen.

      5 Indien de voorzitter van oordeel is dat een geschil van een zodanige aard is dat zijn aanwezigheid bij de
      behandeling ervan niet noodzakelijk is, zal hij, in afwijking van het gestelde in het vierde lid, drie leden
      aanwijzen uit de overeenkomstig het derde benoemde personen. Deze drie leden zullen alsdan in het geschil
      optreden als Geschillencommissie. Deze Geschillencommissie zal uit haar midden één van de leden aanwijzen die als
      plaatsvervangend voorzitter zal fungeren.

      6 Als secretaris van de Geschillencommissie treedt op een functionaris die in dienst is van het productschap en die
      de hoedanigheid van meester in de rechten bezit.

      7 Als vice-voorzitter van de Geschillencommissie treedt op een lid van de Geschillencommissie, daartoe aangewezen
      door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel2
  - number: B16:3
    text: |-
      1 Een aanvraag om geschilbeslechting dient schriftelijk en bij aangetekende post bij de Geschillencommissie te
      worden ingediend. Een zodanige aanvraag is slechts ontvankelijk indien deze ter post wordt bezorgd binnen zes weken
      na de dag waarop de bestreden beslissing van de certificatie-instelling is medegedeeld, uitgereikt of verzonden
      respectievelijk na de dag waarop de bestreden handeling van de certificatie-instelling is verricht.

      2 Een aanvraag om geschilbeslechting wegens het niet nemen van een besluit of het niet verrichten van een handeling
      dient ter post te worden bezorgd binnen

      drie maanden nadat de belanghebbende schriftelijk om het nemen van het besluit respectievelijk om het verrichten
      van de handeling heeft verzocht.

      3 Termijnoverschrijding leidt niet tot niet- ontvankelijkheid, indien de belanghebbende ten genoegen van de
      geschillencommissie aantoont dat hem terzake van de overschrijding redelijkerwijze geen verwijt treft.
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel3
  - number: B16:4
    text: |-
      1 De aanvraag bevat de navolgende gegevens:

      a. de namen en adressen van de betrokken partijen;

      b. een zo nauwkeurig mogelijke omschrijving van het geschil;

      c. een zo nauwkeurig mogelijke omschrijving van de vordering.

      2 Elke aanvraag dient vergezeld te gaan van schriftelijke bewijsstukken, voorzover de aanvrager daarover de
      beschikking heeft, alsmede van storting van een bedrag ad EUR 135,- op een nader aan te geven bankrekening.

      3 De secretaris zal, indien naar zijn oordeel niet voldoende gegevens door de aanvrager zijn verstrekt, de
      aanvrager in de gelegenheid stellen zijn aanvraag te completeren binnen een door de secretaris te stellen en op
      straffe van niet-ontvankelijkheid in acht te nemen termijn.

      4 De aanvraag wordt niet in behandeling genomen zolang deze naar het oordeel van de secretaris niet compleet is.

      5 De secretaris verklaart de aanvraag om geschil beslechting niet-ontvankelijk in het geval dat de aanvraag niet
      vergezeld gaat van een storting als bedoeld in het tweede lid. Voor het overige oordeelt de voorzitter over de
      ontvankelijkheid.
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel4
  - number: B16:5
    text: |-
      1 Zodra bekend is welke personen tot lid van de Geschillencommissie zijn aangewezen stelt de secretaris de
      betrokken partijen hiervan op de hoogte.

      2 De betrokken partijen kunnen één of meer leden van de Geschillencommissie wraken in gerechtvaardigde twijfel
      bestaat aan zijn onpartijdigheid of onafhankelijkheid.

      3 Een lid van de Geschillencommissie kan ook worden gewraakt om redenen die voorafgaand aan zijn benoeming zijn
      opgekomen.

      4 De wrakende partij brengt de wraking, onder opgave van redenen, schriftelijk ter kennis van het betreffende lid,
      de andere leden van de Geschillencommissie en de wederpartij. Deze kennisgeving wordt gedaan binnen 14 dagen nadat
      de wrakende partij kennis heeft gekregen van de redenen voor wraking.

      5 De zaak kan door de Geschillencommissie worden geschorst vanaf de dag van ontvangst van de kennisgeving.

      6 Trekt het gewraakte lid zich niet binnen twee weken na ontvangst van de kennisgeving terug, dan wordt over de
      wraking op verzoek van de meest gerede partij door de President van de Rechtbank beslist.
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel5
  - number: B16:6
    text: |-
      1 De secretaris zendt een exemplaar van de aanvraag zo spoedig mogelijk aan de gedaagde partij en wijst hem op de
      mogelijkheid om binnen veertien dagen bij de secretaris een schriftelijk verweer in te dienen.

      2 De secretaris zal zo spoedig mogelijk een exemplaar van het verweerschrift aan de eisende partij toezenden en
      deze, zo de secretaris daartoe termen aanwezig acht, in de gelegenheid stellen om binnen een door hem te bepalen
      termijn bij hem een conclusie van repliek in te dienen.

      3 Indien de eisende partij van deze gelegenheid gebruik maakt, zal de secretaris onder toezending van een exemplaar
      van de conclusie van repliek aan de gedaagde partij deze op overeenkomstige wijze in staat stellen tot het indienen
      van een conclusie van dupliek.
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel6
  - number: B16:7
    text: |-
      1 De Geschillencommissie bepaalt de dag en het tijdstip van de zitting, waarop partijen hun standpunten mondeling
      kunnen toelichten. De secretaris roept de leden onder toezending van de stukken en de partijen tot deze zitting op
      evenals tot eventuele volgende zittingen.

      2 Indien één der partijen daarom verzoekt en de Geschillencommissie termen aanwezig acht aan dit verzoek te
      voldoen, kan de behandeling van een geschil geheel of voor een gedeelte achter gesloten deuren plaatsvinden.

      3 De (fungerend) voorzitter van de Geschillencommissie is bevoegd de bij of krachtens dit reglement gestelde
      termijnen te verlengen.

      4 De Geschillencommissie is bevoegd getuigen en deskundigen te horen.

      5 Partijen zijn bevoegd zich door een raadsman te doen bijstaan.

      6 In die gevallen waarin dit reglement niet voorziet, beslist de (fungerend) voorzitter van de Geschillencommissie.
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel7
  - number: B16:12
    text: |-
      De Geschillencommissie beslist bij wege van bindend advies en bij meerderheid van stemmen. De schriftelijke
      uitspraak bevat onder meer de gronden voor de gegeven beslissing. Van de mening van een eventuele minderheid wordt
      in de uitspraak geen melding gemaakt leder der betrokken partijen ontvangt van de secretaris zo spoedig mogelijk
      een afschrift van de uitspraak.
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel12
  - number: B16:13
    text: |-
      De Geschillencommissie zal in haar beslissing mede bepalen hoe hoog de kosten van de behandeling van het geding
      zijn en wie deze kosten zal hebben te dragen, met dien verstande dat degene die geheel of grotendeels in het
      gelijk wordt gesteld, niet in de kosten van het geding kan worden veroordeeld. Onder kosten zijn mede begrepen de
      honorering en de verschotten van de leden van de

      Geschillencommissie. Het ingevolge artikel 4, tweede lid, gestorte bedrag wordt afhankelijk van de beslissing
      verrekend dan wel teruggestort.
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel13
  - number: B16:14
    text: |-
      De certificatie-instelling is verplicht aan de Geschillencommissie alle gewenste inlichtingen te verstrekken en
      bescheiden te overleggen.
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel14
  - number: B16:15
    text: |-
      1 De leden van de Geschillencommissie zijn verplicht tot geheimhouding van alle zaken- en bedrijfsgeheimen welke
      zij in hun hoedanigheid vernemen en voorts van alle aangelegenheden ten aanzien waarvan de Geschillencommissie
      geheimhouding heeft opgelegd, of waarvan zij het vertrouwelijk karakter moeten begrijpen.

      2 Indien een lid van de Geschillencommissie in strijd met het in het eerste lid bepaalde handelt, ka dit lid door
      het bestuur geschorst of ontslagen worden. Een zodanige beslissing wordt niet genomen, dan nadat de betrokkene in
      de gelegenheid is gesteld zich ter zake te verantwoorden.
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel15
  - number: B16:16
    text: |-
      De hoogte van de vacatiegelden voor de leden van de Geschillencommissie wordt bij besluit van het bestuur van het
      productschap vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel16
  - number: B16:17
    text: Dit reglement wordt aangehaald als "Geschillenreglement GMP".
    url: https://wetten.overheid.nl/BWBR0014959/2005-06-05#Artikel17
