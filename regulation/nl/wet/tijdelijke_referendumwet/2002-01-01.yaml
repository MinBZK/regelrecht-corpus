        artikel: '112'
        hoofdstuk: '8'
  - number: '32'
    text: |-
      [Artikel B 6 van de Kieswet][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelB_6
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel32
