  - number: '119'
    text: |-
      1 Met toepassing van [hoofdstuk L van de Kieswet][ref1] kan bij volmacht worden gestemd.

      2 Bij de toepassing van [hoofdstuk L van de Kieswet][ref2] wordt het volgende in acht genomen:

      a. in [artikel L 7][ref3] wordt in plaats van «op de dag van kandidaatstelling» gelezen: zes weken voor de dag van
      de stemming;

      b. in de [artikelen L 8, eerste en tweede lid][ref4], [L 11, eerste lid][ref5], en [L 14, eerste lid][ref6],
      wordt in plaats van «dag van kandidaatstelling» gelezen: datum van het koninklijk besluit, bedoeld in
      [artikel 110][ref7], onderscheidenlijk het besluit, bedoeld in [artikel 112][ref8],;

      c. in [artikel L 9][ref9] wordt in plaats van «het registratieverzoek, bedoeld in [artikel D 3][ref10]» gelezen:
      het registratieverzoek, bedoeld in [artikel 34][ref11].


