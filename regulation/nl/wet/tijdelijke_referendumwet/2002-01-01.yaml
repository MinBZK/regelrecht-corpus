  - number: '105'
    text: |-
      1 Vervolgens besluit het centraal stembureau of het definitieve verzoek tot het houden van een referendum wordt
      toegelaten.

      2 Het centraal stembureau besluit slechts dat het definitieve verzoek niet wordt toegelaten, indien het aantal
      geldige ondersteuningsverklaringen minder bedraagt dan het vereiste aantal, bedoeld in de [artikelen 2][ref1],
      [3][ref2], onderscheidenlijk [4, derde lid][ref3].

      3 Voor de berekening van het vereiste aantal, bedoeld in de [artikelen 3][ref4] en [4, derde lid][ref5], wordt
      uitgegaan van het volgens bij algemene maatregel van bestuur te stellen regels vastgestelde aantal kiesgerechtigden
      voor de laatstgehouden verkiezing van de leden van provinciale staten, onderscheidenlijk de gemeenteraad.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0012701#Artikel4
