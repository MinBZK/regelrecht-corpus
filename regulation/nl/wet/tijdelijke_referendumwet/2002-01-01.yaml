  - number: '8'
    text: |-
      1 Een provinciaal referendum, onderscheidenlijk een gemeentelijk referendum, kan worden gehouden over:

      a. een besluit van provinciale staten, onderscheidenlijk de gemeenteraad, inhoudende een algemeen verbindend
      voorschrift dan wel de intrekking daarvan;

      b. een besluit van provinciale staten, onderscheidenlijk de gemeenteraad, als
      bedoeld in [artikel 151, eerste lid, van de Provinciewet][ref1], onderscheidenlijk
      [artikel 155, eerste lid, van de Gemeentewet][ref2];

      c. een besluit van provinciale staten, onderscheidenlijk de gemeenteraad, als
      bedoeld in [artikel 156, eerste lid, van de Provinciewet][ref3], onderscheidenlijk
      [artikel 158, eerste lid, van de Gemeentewet][ref4];

      d. een besluit van provinciale staten, onderscheidenlijk de gemeenteraad, als bedoeld in
      [artikel 1, eerste en derde lid][ref5], [40, eerste en derde lid][ref6], [51, eerste en derde lid][ref7],
      [61, eerste en derde lid][ref8], [73, eerste en derde lid][ref9], [83, eerste en derde lid][ref10], en
      [96, eerste lid, van de Wet gemeenschappelijke regelingen][ref11].

      2 Een gemeentelijk referendum kan voorts worden gehouden over een besluit van de gemeenteraad als bedoeld in
      [artikel 283, derde lid, onder a, van de Gemeentewet][ref12].

      3 Geen referendum kan worden gehouden over een besluit als bedoeld in het eerste en tweede lid, indien:

      a. het besluit uitsluitend strekt tot uitvoering van verdragen of besluiten van volkenrechtelijke organisaties;

      b. het besluit uitsluitend strekt tot uitvoering van een wet of besluit voorzover die wet of dat besluit strekt tot
      uitvoering van verdragen of besluiten van volkenrechtelijke organisaties;

      c. provinciale staten, onderscheidenlijk de gemeenteraad, bij het nemen van het besluit geen ruimte hebben voor het
      maken van keuzen van beleidsinhoudelijke aard;

      d. het een algemeen verbindend voorschrift betreft dat onderdeel uitmaakt van een bestemmingsplan;

      e. het besluit uitsluitend strekt tot intrekking van een besluit naar aanleiding van een daarover gehouden
      referendum.

      4 Provinciale staten, onderscheidenlijk de gemeenteraad, kunnen bij verordening bepalen dat geen referendum kan
      worden gehouden over de hierna genoemde besluiten:

      a. besluiten als bedoeld in het eerste lid, onder a, die uitsluitend betrekking hebben op:

      1°. de rechtspositie van ambtsdragers of gewezen ambtsdragers als zodanig dan wel hun nagelaten betrekkingen of
      hun rechthebbenden;

      2°. de provinciale belastingen, bedoeld in [hoofdstuk XV van de Provinciewet][ref13], onderscheidenlijk de
      gemeentelijke belastingen, bedoeld in [hoofdstuk XV van de Gemeentewet][ref14];

      b. besluiten als bedoeld in het eerste lid, onder b;

      c. besluiten als bedoeld in het eerste lid, onder d.


