        artikel: '112'
        hoofdstuk: '8'
  - number: '31'
    text: |-
      1 Kiesgerechtigd voor een gemeentelijk referendum zijn diegenen die kiesgerechtigd zijn voor de verkiezing van de
      leden van de gemeenteraad.

      2 Voor de beoordeling of aan de vereisten voor het kiesrecht is voldaan, is de toestand op de datum van het besluit
      van burgemeester en wethouders, bedoeld in [artikel 112][ref1], bepalend. Het vereiste van het hebben bereikt van
      de achttienjarige leeftijd wordt beoordeeld naar de toestand op de dag van de stemming.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel112
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel31
    references:
