  - number: '29'
    text: |-
      1 Kiesgerechtigd voor een nationaal referendum zijn diegenen die kiesgerechtigd zijn voor de verkiezing van de
      leden van de Tweede Kamer der Staten-Generaal.

      2 Voor de beoordeling of aan de vereisten voor het kiesrecht is voldaan, is de toestand op de datum van het
      koninklijk besluit, bedoeld in [artikel 110][ref1], bepalend. Het vereiste van het hebben bereikt van de
      achttienjarige leeftijd wordt beoordeeld naar de toestand op de dag van de stemming.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel110
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '110'
        hoofdstuk: '8'
  - number: '30'
    text: |-
      1 Kiesgerechtigd voor een provinciaal referendum zijn diegenen die kiesgerechtigd zijn voor de verkiezing van de
      leden van provinciale staten.

      2 Voor de beoordeling of aan de vereisten voor het kiesrecht is voldaan, is de toestand op de datum van het besluit
      van gedeputeerde staten, bedoeld in [artikel 112][ref1], bepalend. Het vereiste van het hebben bereikt van de
      achttienjarige leeftijd wordt beoordeeld naar de toestand op de dag van de stemming.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel112
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel30
    references:
      - id: ref1
