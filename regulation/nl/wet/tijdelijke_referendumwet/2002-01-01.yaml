        artikel: '7'
        hoofdstuk: '2'
  - number: '11'
    text: |-
      1 Onze Minister doet binnen een week na de bekrachtiging van een wet die niet strekt tot goedkeuring van een
      verdrag, mededeling in de Staatscourant van:

      a. de bekrachtiging;

      b. een algemeen toegankelijke vindplaats van de tekst van de wet;

      c. zijn besluit of over de wet een referendum kan worden gehouden.

      2 Onze Minister van Buitenlandse Zaken doet binnen een week na de bekrachtiging van een wet tot goedkeuring van een
      verdrag mededeling in de Staatscourant van:

      a. de bekrachtiging;

      b. een algemeen toegankelijke vindplaats van de tekst van de wet en het verdrag;

      c. zijn besluit of over de wet een referendum kan worden gehouden.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel11
  - number: '12'
    text: |-
      1 Een tijdstip van inwerkingtreding van een wet of onderdeel van een wet waarover een referendum kan
      worden gehouden, wordt niet eerder gesteld dan zes weken na de mededeling in de Staatscourant, bedoeld in
      [artikel 11][ref1].

      2 Indien bij of krachtens de wet een tijdstip van inwerkingtreding zodanig is vastgesteld dat dat tijdstip valt
      binnen de in het eerste lid genoemde termijn, wordt de inwerkingtreding van rechtswege opgeschort tot de dag na het
      verstrijken van die termijn.

      3 [Artikel 7 van de Bekendmakingswet][ref2] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel7
