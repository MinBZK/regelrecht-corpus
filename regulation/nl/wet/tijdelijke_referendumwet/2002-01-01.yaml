  - number: '118'
    text: |-
      1 Met toepassing van [hoofdstuk K van de Kieswet][ref1] kan gestemd worden in een stembureau naar keuze van de
      kiezer.

      2 Bij de toepassing van [hoofdstuk K van de Kieswet][ref2] wordt het volgende in acht genomen:

      a. in [artikel K 1][ref3] wordt in plaats van «binnen het gebied van het orgaan waarvoor de verkiezing wordt
      gehouden» gelezen: binnen het gebied waar het referendum wordt gehouden;

      b. in de [artikelen K 3, eerste lid][ref4], [K 8, tweede lid][ref5], [K 10, eerste en vierde lid][ref6], wordt in
      plaats van «dag van kandidaatstelling» gelezen: datum van het koninklijk besluit, bedoeld in [artikel 110][ref7],
      onderscheidenlijk het besluit, bedoeld in [artikel 112][ref8],;

      c. in [artikel K 3, tweede lid][ref9], wordt in plaats van «op de dag van kandidaatstelling» gelezen: zes weken
      voor de dag van de stemming.


