  - number: '24'
    text: |-
      1 Indien een besluit als bedoeld in [artikel 8, eerste lid, onder a][ref1], waarover een referendum kan worden
      gehouden, de goedkeuring van een ander bestuursorgaan behoeft, neemt dat bestuursorgaan het besluit niet in
      behandeling dan nadat onherroepelijk is komen vast te staan dat over het besluit geen referendum wordt gehouden,
      dan wel dat het referendum niet heeft geleid tot een raadgevende uitspraak tot afwijzing van het besluit dat aan
      het referendum is onderworpen.

      2 Het besluit wordt bekendgemaakt overeenkomstig [artikel 136, tweede lid, van de Provinciewet][ref2],
      onderscheidenlijk [artikel 139, tweede lid, van de Gemeentewet][ref3].

      3 Gedeputeerde staten, onderscheidenlijk burgemeester en wethouders, besluiten of over een besluit als bedoeld
      in [artikel 8, eerste lid, onder a][ref4], dat de goedkeuring van een ander bestuursorgaan behoeft, gelet
      op [artikel 8][ref5], een referendum kan worden gehouden. De bekendmaking geschiedt tegelijkertijd met de
      bekendmaking, bedoeld in het tweede lid.

      4 Indien onherroepelijk vaststaat dat over het besluit geen referendum wordt gehouden dan wel dat het
      referendum niet heeft geleid tot een raadgevende uitspraak tot afwijzing van het besluit, vangt de in
      [artikel 10:31 van de Algemene wet bestuursrecht][ref6] bedoelde termijn aan met ingang van de eerste dag nadat dit
      is bekendgemaakt.

      5 Indien onherroepelijk is vastgesteld dat het referendum heeft geleid tot een raadgevende uitspraak tot
      afwijzing van het besluit, wordt het besluit geacht niet ter goedkeuring te zijn verzonden. Provinciale
      staten, onderscheidenlijk de gemeenteraad, nemen zo spoedig mogelijk een besluit dat uitsluitend strekt
      tot intrekking of tot verzending ter goedkeuring van het besluit dat aan het referendum is onderworpen.
      [Artikel 152 van de Provinciewet][ref7], onderscheidenlijk [artikel 156 van de Gemeentewet][ref8], is niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel8
