  - number: '121'
    text: |-
      1 Onmiddellijk nadat de stemming is geëindigd, vindt de stemopneming plaats.

      2 De [artikelen N 1 tot en met N 5 van de Kieswet][ref1] zijn van toepassing, met dien verstande dat in
      [artikel N 5][ref2] de woorden «en voegen deze lijstgewijze bijeen» buiten toepassing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_5
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel121
    references:
