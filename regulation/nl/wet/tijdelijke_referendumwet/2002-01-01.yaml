  - number: '23'
    text: |-
      1 Indien onherroepelijk is vastgesteld dat over het besluit geen referendum zal worden gehouden
      dan wel dat het referendum niet heeft geleid tot een raadgevende uitspraak tot afwijzing van het
      besluit dat aan het referendum is onderworpen, voorzien provinciale staten, onderscheidenlijk de
      gemeenteraad, opnieuw in de inwerkingtreding. [Artikel 152 van de Provinciewet][ref1], onderscheidenlijk
      [artikel 156 van de Gemeentewet][ref2], is niet van toepassing. Het tijdstip van inwerkingtreding wordt
      bekendgemaakt overeenkomstig [artikel 136, tweede lid, van de Provinciewet][ref3], onderscheidenlijk
      [artikel 139, tweede lid, van de Gemeentewet][ref4].

      2 Indien onherroepelijk is vastgesteld dat het referendum heeft geleid tot een raadgevende uitspraak tot afwijzing
      van het besluit, nemen provinciale staten, onderscheidenlijk de gemeenteraad, zo spoedig mogelijk een besluit dat
      uitsluitend strekt tot intrekking of tot inwerkingtreding van het besluit dat aan het referendum is onderworpen.
      Op het besluit omtrent inwerkingtreding of intrekking en de bekendmaking daarvan zijn de tweede en derde volzin van
      het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel156
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel136
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel139
