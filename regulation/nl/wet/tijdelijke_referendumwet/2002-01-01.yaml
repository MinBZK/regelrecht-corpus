  - number: '128'
    text: |-
      1 Het hoofdstembureau houdt op de tweede dag na de stemming om tien uur een openbare zitting.

      2 De voorzitter is belast met de handhaving van de orde tijdens de zitting.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel128
  - number: '129'
    text: |-
      1 Het hoofdstembureau stelt voor de provincie de totalen van de in [artikel 122][ref1] bedoelde aantallen stemmen
      en van de in de [artikelen 122][ref2] en [125, derde lid][ref3], bedoelde aantallen kiesgerechtigden voor het
      referendum vast.

      2 De voorzitter maakt de aldus verkregen uitkomsten bekend.

      3 Door de aanwezige kiezers kunnen mondeling bezwaren worden ingebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel122
      [ref3]: https://wetten.overheid.nl/BWBR0012701#Artikel125
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel129
