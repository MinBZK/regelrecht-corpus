  - number: '103'
    text: |-
      1 Het centraal stembureau stelt vast:

      a. het totale aantal geldige ondersteuningsverklaringen;

      b. het totale aantal ongeldige ondersteuningsverklaringen.

      2 De voorzitter maakt deze aantallen bekend aan de aanwezige kiesgerechtigden.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel103
  - number: '104'
    text: |-
      Bij een gemeentelijk referendum blijven de [artikelen 102][ref1] en [103][ref2] buiten toepassing en beslist
      het centraal stembureau de geschillen die ten aanzien van de vaststelling van de aantallen geldige en ongeldige
      ondersteuningsverklaringen op grond van [artikel 86][ref3] rijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel103
      [ref3]: https://wetten.overheid.nl/BWBR0012701#Artikel86
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel104
