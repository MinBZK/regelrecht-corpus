  - number: '124'
    text: |-
      De [artikelen N 10][ref1] en [N 11, eerste lid, van de Kieswet][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_10
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_11
