  - number: '19'
    text: |-
      1 De binding aan een stilzwijgend goedgekeurd verdrag dat binnen het Koninkrijk alleen voor Nederland geldt, wordt
      niet aangegaan dan nadat onherroepelijk vaststaat dat over de stilzwijgende goedkeuring geen referendum zal worden
      gehouden dan wel de uitslag van een referendum onherroepelijk is vastgesteld.

      2 Indien een referendum is gehouden en onherroepelijk is vastgesteld dat dit heeft geleid tot een raadgevende
      uitspraak tot afwijzing, wordt zo spoedig mogelijk beslist of een voorstel van wet zal worden ingediend dat
      uitsluitend strekt tot intrekking van de aan het verdrag verleende goedkeuring. Onze Minister van Buitenlandse
      Zaken licht de Staten-Generaal zo spoedig mogelijk in over de beslissing van de regering ter zake. De binding aan
      het verdrag wordt niet aangegaan voordat vier weken zijn verstreken nadat Onze Minister van Buitenlandse Zaken de
      Staten-Generaal heeft ingelicht dat geen voorstel van wet als bedoeld in dit lid zal worden ingediend.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel19
  - number: '20'
    text: |-
      1 Indien het aangaan van binding aan een stilzwijgend goedgekeurd verdrag geen uitstel kan lijden, kan, onder
      verwijzing bij de overlegging ter stilzwijgende goedkeuring van het verdrag aan de Staten-Generaal naar dit
      artikel, de binding in afwijking van [artikel 19, eerste lid][ref1], worden aangegaan, onverminderd de mogelijkheid
      over de stilzwijgende goedkeuring een referendum te houden.

      2 Indien over een stilzwijgende goedkeuring als bedoeld in het eerste lid een referendum wordt gehouden en
      onherroepelijk is vastgesteld dat dit heeft geleid tot een raadgevende uitspraak tot afwijzing, wordt zo spoedig
      mogelijk beslist of een voorstel van wet zal worden ingediend dat uitsluitend strekt tot goedkeuring van het
      voornemen tot opzegging van het verdrag. Onze Minister van Buitenlandse Zaken licht de Staten-Generaal zo spoedig
      mogelijk in over de beslissing van de regering ter zake.

      3 Voorzover blijkt dat een belanghebbende ten gevolge van de opzegging van een verdrag overeenkomstig het tweede
      lid schade lijdt of zal lijden welke redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven en
      waarvan de vergoeding niet of niet voldoende op andere wijze is verzekerd, kent Onze Minister wie het aangaat hem
      op zijn verzoek een naar billijkheid te bepalen schadevergoeding toe.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel19
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '21'
    text: |-
      Bepalingen in de volgende hoofdstukken van deze wet die betrekking hebben op een referendum over een wet, zijn
      tevens van toepassing op een referendum over de stilzwijgende goedkeuring van een verdrag.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel21
  - number: '22'
    text: |-
      1 Gedeputeerde staten, onderscheidenlijk burgemeester en wethouders, besluiten of over een besluit als bedoeld in
      [artikel 8, eerste lid, onder a][ref1], gelet op [artikel 8][ref2], een referendum kan worden gehouden. Dit besluit
      wordt tezamen met het besluit dat het betreft, bekendgemaakt.

      2 Een besluit als bedoeld in [artikel 8, eerste lid, onder a][ref3], waarover een referendum kan
      worden gehouden, treedt in afwijking van [artikel 139 van de Provinciewet][ref4], onderscheidenlijk
      [artikel 142 van de Gemeentewet][ref5], niet eerder in werking dan zes weken na de bekendmaking van het besluit.

      3 Indien voor een besluit als bedoeld in het tweede lid, een tijdstip van inwerkingtreding is vastgesteld, vervalt
      deze vaststelling van rechtswege, wanneer een inleidend verzoek tot het houden van een referendum over dat besluit
      onherroepelijk is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel8
