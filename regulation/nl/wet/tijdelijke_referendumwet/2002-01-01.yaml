  - number: '27'
    text: |-
      1 Op een besluit als bedoeld in [artikel 8, eerste lid, onder c][ref1], is [artikel 24, tweede en derde lid][ref2],
      van overeenkomstige toepassing.

      2 Indien onherroepelijk is vastgesteld dat over het besluit geen referendum zal worden gehouden dan wel het
      referendum niet heeft geleid tot een raadgevende uitspraak tot afwijzing van het besluit, doen gedeputeerde staten,
      onderscheidenlijk burgemeester en wethouders, hiervan mededeling aan Onze Minister, onderscheidenlijk aan Onze
      Minister en het provinciaal bestuur.

      3 Indien onherroepelijk is vastgesteld dat de uitslag van het referendum heeft geleid tot een raadgevende uitspraak
      tot afwijzing van het besluit, nemen provinciale staten, onderscheidenlijk de gemeenteraad, zo spoedig mogelijk
      een beslissing omtrent intrekking van het besluit. [Artikel 152 van de Provinciewet][ref3], onderscheidenlijk
      [artikel 156 van de Gemeentewet][ref4], is niet van toepassing. Van een eventuele intrekking wordt mededeling
      gedaan aan Onze Minister, onderscheidenlijk aan Onze Minister en het provinciaal bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel8
