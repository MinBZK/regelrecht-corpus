  - number: '125'
    text: |-
      1 Nadat de burgemeester van alle in zijn gemeente gevestigde stembureaus het proces-verbaal van de stemming en
      de stemopneming heeft ontvangen, stelt hij voor zijn gemeente de totalen van de in [artikel 122][ref1] bedoelde
      aantallen stemmen en kiesgerechtigden vast.

      2 Voor de in het eerste lid bedoelde vaststelling wordt gebruik gemaakt van een formulier waarvoor bij ministeriële
      regeling een model wordt vastgesteld.

      3 Bij een nationaal referendum voegt de burgemeester van 's-Gravenhage aan het aantal kiesgerechtigden
      dat hij overeenkomstig het eerste lid heeft vastgesteld, het aantal kiesgerechtigden toe dat op grond van
      [artikel 34, eerste lid][ref2], door burgemeester en wethouders van 's-Gravenhage als kiesgerechtigde is
      geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel34
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '122'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0012701
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '126'
    text: |-
      De burgemeester draagt er zorg voor dat de processen-verbaal, met daarbij gevoegd de opgaven van de door hem
      vastgestelde aantallen stemmen en kiesgerechtigden, onverwijld worden overgebracht naar de voorzitter van het
      hoofdstembureau of, indien het een provinciaal of gemeentelijk referendum betreft, naar de voorzitter van het
      centraal stembureau.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel126
  - number: '127'
    text: |-
      De artikelen [N 12, tweede, derde en vierde lid][ref1], en [N 13 tot en met N 21 van de Kieswet][ref2] zijn van
      toepassing, met dien verstande dat:

      a. in [artikel N 12, tweede lid][ref3], in plaats van «nadat het centraal stembureau de uitslag van de verkiezing
      heeft vastgesteld en over de toelating van de gekozenen onherroepelijk is beslist» gelezen wordt: nadat de uitslag
      van het referendum onherroepelijk is vastgesteld;

      b. in [artikel N 12, derde lid][ref4], in plaats van «op grond van de [Kieswet][ref5] of op grond van de
      [artikelen 125 tot en met 129 van het Wetboek van Strafrecht][ref6] strafbaar gestelde gedragingen» gelezen wordt:
      op grond van deze wet strafbaar gestelde gedragingen;

      c. in [artikel N 13][ref7] in plaats van «nadat onherroepelijk is beslist over de toelating van de gekozen
      leden tot het vertegenwoordigend orgaan» gelezen wordt: nadat de uitslag van het referendum onherroepelijk is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_12
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_13
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_12
