        paragraaf: '1'
  - number: '87'
    text: |-
      1 Bij twijfel over de geldigheid van de verklaring en bij ongeldigheid van de verklaring maakt de voorzitter de
      redenen hiervoor, alsmede de beslissing daaromtrent, onmiddellijk bekend.

      2 Indien een van de aanwezige kiezers dit verlangt, wordt het betreffende formulier getoond.

      3 Indien wordt besloten een verklaring ongeldig te verklaren, wordt dit met opgave van redenen op het formulier
      aangetekend. Een kopie van het formulier wordt gezonden aan degene die de verklaring heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel87
  - number: '88'
    text: |-
      1 Nadat de werkzaamheden, bedoeld in [artikel 86][ref1], zijn beëindigd, worden de formulieren met de geldige
      ondersteuningsverklaringen en de formulieren met de ongeldige ondersteuningsverklaringen in aparte pakken gedaan
      en verzegeld.

      2 Op ieder pak wordt vermeld:

      a. de naam van de gemeente;

      b. het aantal formulieren;

      c. of het geldige of ongeldige ondersteuningsverklaringen betreft;

      d. een aanduiding van het referendum waarop de ondersteuningsverklaringen betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel86
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '86'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '89'
    text: |-
      1 Nadat alle werkzaamheden zijn beëindigd, wordt daarvan proces-verbaal opgemaakt. Alle ingebrachte bezwaren worden
      in het proces-verbaal vermeld.

      2 Het proces-verbaal wordt door alle aanwezige leden van het plaatselijk stembureau ondertekend.

      3 Het proces-verbaal wordt voor een ieder ter inzage gelegd ter secretarie van de gemeente. De terinzagelegging
      wordt beëindigd, zodra onherroepelijk over de toelating van het definitieve verzoek is beslist.

      4 Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.

      5 Indien het een gemeentelijk referendum betreft, maakt het proces-verbaal onderdeel uit van het proces-verbaal,
      bedoeld in [artikel 107][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel107
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '107'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: '90'
    text: |-
      1 De verzegelde pakken, bedoeld in [artikel 88][ref1], worden ter bewaring overgebracht naar de burgemeester.

      2 De burgemeester draagt er zorg voor dat de verzegelde pakken op verzoek van de voorzitter van het centraal
      stembureau onmiddellijk naar het centraal stembureau worden overgebracht en dat de niet naar het centraal
      stembureau overgebrachte pakken worden vernietigd, nadat de uitslag van het referendum onherroepelijk is
      vastgesteld, dan wel nadat onherroepelijk afwijzend is beslist inzake het definitieve verzoek tot het houden van
      een referendum.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel88
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '88'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '91'
    text: |-
      Het proces-verbaal wordt, indien het een nationaal referendum betreft, onverwijld naar de voorzitter van het
      hoofdstembureau, of, indien het een provinciaal referendum betreft, de voorzitter van het centraal stembureau
      overgebracht.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel91
  - number: '92'
    text: |-
      Bij een gemeentelijk referendum worden de in deze paragraaf aan het plaatselijk stembureau opgedragen werkzaamheden
      verricht door het centraal stembureau.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel92
  - number: '93'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de taak van het plaatselijk
      stembureau inzake de telling en de controle van de ondersteuningsverklaringen.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel93
  - number: '94'
    text: Deze paragraaf is alleen van toepassing bij een nationaal referendum.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel94
  - number: '95'
    text: |-
      1 Het hoofdstembureau houdt op de dag na de ontvangst van de processen-verbaal van de plaatselijke stembureaus om
      tien uur een openbare zitting.

      2 Dag en uur van de zitting van het hoofdstembureau worden door de voorzitter tijdig bekendgemaakt. De wijze van
      bekendmaking wordt geregeld bij algemene maatregel van bestuur.

      3 De voorzitter is belast met de handhaving van de orde tijdens de zitting.

      4 Door de aanwezige kiesgerechtigden kunnen mondeling bezwaren worden ingebracht.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel95
  - number: '96'
    text: |-
      1 Op de zitting stelt het hoofdstembureau voor de provincie de totalen van de in [artikel 86][ref1] bedoelde
      aantallen geldige en ongeldige ondersteuningsverklaringen vast.

      2 De voorzitter maakt deze aantallen bekend aan de aanwezige kiesgerechtigden.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel86
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '86'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '97'
    text: |-
      1 Nadat alle werkzaamheden zijn beëindigd, wordt daarvan proces-verbaal opgemaakt. Alle ingebrachte bezwaren worden
      in het proces-verbaal vermeld.

      2 Het proces-verbaal wordt door alle aanwezige leden van het hoofdstembureau ondertekend.

      3 Het proces-verbaal wordt voor een ieder ter inzage gelegd ter secretarie van de gemeente waar het hoofdstembureau
      is gevestigd. De terinzagelegging wordt beëindigd, zodra onherroepelijk over de toelating van het definitieve
      verzoek is beslist.

      4 Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel97
  - number: '98'
    text: |-
      Het proces-verbaal van het hoofdstembureau wordt, vergezeld van de processen-verbaal van de plaatselijke
      stembureaus, onverwijld naar de voorzitter van het centraal stembureau overgebracht.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel98
  - number: '99'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de taak van het hoofdstembureau
      inzake de telling en de controle van de ondersteuningsverklaringen.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel99
  - number: '100'
    text: |-
      1 Bij een nationaal referendum houdt het centraal stembureau op de tweede dag na de ontvangst van de processen-
      verbaal van de hoofdstembureaus om tien uur een openbare zitting.

      2 Bij een provinciaal referendum houdt het centraal stembureau op de tweede dag na de ontvangst van de processen-
      verbaal van de plaatselijke stembureaus om tien uur een openbare zitting.

      3 Bij een gemeentelijk referendum houdt het centraal stembureau op de tweede dag na afloop van de
      termijn van zes weken, bedoeld in [artikel 75][ref1], na beëindiging van de werkzaamheden, bedoeld in
      [paragraaf 2 van dit hoofdstuk][ref2], een openbare zitting.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '75'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012701
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '101'
    text: |-
      1 Dag en uur van de zitting van het centraal stembureau worden door de voorzitter tijdig bekendgemaakt. De wijze
      van bekendmaking wordt geregeld bij algemene maatregel van bestuur.

      2 De voorzitter is belast met de handhaving van de orde tijdens de zitting.

      3 Door de aanwezige kiesgerechtigden kunnen mondeling bezwaren worden ingebracht.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel101
  - number: '102'
    text: |-
      1 Het centraal stembureau onderzoekt de juistheid van de vaststelling van de aantallen geldige en ongeldige
      ondersteuningsverklaringen door de plaatselijke stembureaus en de hoofdstembureaus, en beslist de geschillen die
      te dien aanzien rijzen. Het neemt daartoe kennis van de processen-verbaal van de plaatselijke stembureaus en de
      hoofdstembureaus.

      2 Ten behoeve van het onderzoek kan het centraal stembureau tot een hernieuwde beoordeling van
      ondersteuningsverklaringen besluiten. De burgemeester die de desbetreffende formulieren onder zich heeft, doet
      deze op verzoek van het centraal stembureau onverwijld naar dat orgaan overbrengen. Na ontvangst van de formulieren
      gaat het centraal stembureau onmiddellijk tot de beoordeling van de verklaringen over. Het is bevoegd daartoe de
      verzegelde pakken te openen en de inhoud te vergelijken met de processen-verbaal van de plaatselijke stembureaus.
      Bij deze beoordeling zijn de [artikelen 86][ref1] en [87][ref2] van overeenkomstige toepassing.

      3 Na de beëindiging van het onderzoek worden de bescheiden uit de geopende pakken opnieuw ingepakt en verzegeld op
      de in [artikel 88][ref3] voorgeschreven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel87
      [ref3]: https://wetten.overheid.nl/BWBR0012701#Artikel88
