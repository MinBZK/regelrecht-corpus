  - number: '106'
    text: |-
      Het besluit tot toelating van een definitief verzoek houdt tevens de vaststelling in dat een referendum zal worden
      gehouden.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel106
  - number: '107'
    text: |-
      1 Nadat alle werkzaamheden zijn beëindigd, wordt daarvan aanstonds proces-verbaal opgemaakt. In dit proces-verbaal
      worden alle ingebrachte bezwaren alsmede de gerezen geschillen en de beslissingen die te dien aanzien zijn genomen,
      vermeld.

      2 Het proces-verbaal wordt door alle aanwezige leden van het centraal stembureau ondertekend.

      3 Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel107
  - number: '108'
    text: |-
      1 De voorzitter van het centraal stembureau maakt het besluit inzake de toelating van het definitieve verzoek zo
      spoedig mogelijk openbaar, voor een nationaal referendum door plaatsing van een afschrift van het proces-verbaal
      in de Staatscourant, en voor een provinciaal of gemeentelijk referendum op de in de provincie, onderscheidenlijk de
      gemeente, gebruikelijke wijze.

      2 Bij een nationaal referendum doet de voorzitter van het centraal stembureau van het besluit inzake de toelating
      van het definitieve verzoek mededeling aan de voorzitter van de Tweede Kamer der Staten-Generaal, aan de voorzitter
      van de Eerste Kamer der Staten-Generaal en aan Onze Minister.

      3 Bij een provinciaal, onderscheidenlijk gemeentelijk, referendum doet de voorzitter van het centraal
      stembureau van het besluit inzake de toelating van het definitieve verzoek mededeling aan provinciale staten,
      onderscheidenlijk de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel108
  - number: '109'
    text: |-
      1 De voorzitter van het centraal stembureau draagt zorg voor de bewaring van de verzegelde pakken met formulieren
      die op grond van [artikel 102][ref1] naar het centraal stembureau zijn overgebracht.

      2 Hij vernietigt deze pakken en de processen-verbaal van de plaatselijke stembureaus, alsmede bij een nationaal
      referendum de processen-verbaal van de hoofdstembureaus, nadat onherroepelijk is vastgesteld dat geen referendum
      zal worden gehouden, of nadat de uitslag van het referendum onherroepelijk is vastgesteld. Van deze vernietiging
      wordt proces-verbaal opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel102
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '102'
        hoofdstuk: '7'
        paragraaf: '4'
  - number: '110'
    text: |-
      1 Binnen een week nadat het besluit van het centraal stembureau dat een nationaal referendum zal worden gehouden,
      onherroepelijk is geworden, wordt bij koninklijk besluit de dag van de stemming bepaald. Het koninklijk besluit
      wordt in het Staatsblad geplaatst.

      2 Als dag van de stemming wordt een woensdag aangewezen binnen een termijn die aanvangt op de vijftigste dag en
      eindigt vier maanden na de dagtekening van het koninklijk besluit.

      3 Voor de berekening van de termijn van vier maanden wordt de periode van 1 juli tot en met 15 augustus niet
      meegeteld.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel110
  - number: '111'
    text: |-
      1 Indien binnen de in [artikel 110, tweede lid][ref1], bedoelde termijn een of meer stemmingen voor een verkiezing
      van de leden van de Tweede Kamer der Staten-Generaal, provinciale staten, de gemeenteraden of het Europese
      Parlement plaatsvinden, wordt als dag van de stemming voor het referendum aangewezen de dag van de stemming voor
      die verkiezing, onderscheidenlijk voor een van die verkiezingen.

      2 Bij toepassing van het eerste lid zijn de krachtens [artikel J 6 van de Kieswet ][ref2]bij of krachtens algemene
      maatregel van bestuur gegeven voorschriften voor combinatie van stemmingen van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_6
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '110'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0004627
        artikel: J_6
  - number: '112'
    text: |-
      De [artikelen 110][ref1] en [111][ref2] zijn ten aanzien van een provinciaal en een gemeentelijk referendum van
      toepassing, met dien verstande dat de aanwijzing van de dag van de stemming geschiedt bij besluit van gedeputeerde
      staten, onderscheidenlijk burgemeester en wethouders, en dit besluit ter openbare kennis wordt gebracht op de in de
      provincie, onderscheidenlijk de gemeente, gebruikelijke wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel111
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '110'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0012701
        artikel: '111'
        hoofdstuk: '8'
  - number: '113'
    text: |-
      Bij het gelijktijdig plaatsvinden van de stemmingen voor twee of meer referenda zijn de krachtens
      [artikel J 6 van de Kieswet][ref1] bij of krachtens algemene maatregel van bestuur gegeven voorschriften voor
      combinatie van stemmingen van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_6
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_6
  - number: '114'
    text: |-
      1 De tekst van een aan een referendum onderworpen wet of besluit is gedurende vier weken voorafgaande aan de
      stemming kosteloos ter secretarie van elke gemeente verkrijgbaar. De burgemeester brengt dit ter openbare kennis.

      2 Onze Minister wie het aangaat stelt in overeenstemming met Onze Minister-President, Minister van Algemene Zaken,
      een feitelijke samenvatting vast van een aan een nationaal referendum onderworpen wet. De burgemeester draagt
      er zorg voor dat de samenvatting ten minste veertien dagen voor de stemming aan het adres van de kiezers wordt
      bezorgd.

      3 Het tweede lid is ten aanzien van een provinciaal en een gemeentelijk referendum van toepassing, met dien
      verstande dat de samenvatting het aan het referendum onderworpen besluit betreft en vastgesteld wordt door de
      commissaris van de Koning, onderscheidenlijk de burgemeester.

      4 Bij de samenvatting wordt van de verkrijgbaarheid van de tekst van de wet of het besluit ter gemeentesecretarie
      mededeling gedaan.

      5 Bij een referendum over de goedkeuring van een verdrag geldt het in dit artikel bepaalde mede ten aanzien van de
      tekst van het verdrag.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel114
  - number: '115'
    text: |-
      1 Op het bij de stemming te bezigen stembiljet wordt de benaming van de aan het referendum onderworpen wet of het
      aan het referendum onderworpen besluit vermeld en wordt aan de kiezer de keuze geboden zich voor of tegen de wet of
      het besluit uit te spreken. Op de achterzijde wordt de handtekening van de voorzitter van het centraal stembureau
      gedrukt.

      2 Bij ministeriële regeling wordt voor het stembiljet een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel115
  - number: '116'
    text: |-
      Het stemmen anders dan door middel van stembiljetten vindt alleen plaats, indien daarbij een op grond van
      [artikel J 33 van de Kieswet][ref1] goedgekeurde techniek wordt gebezigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_33
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_33
  - number: '117'
    text: |-
      Ten aanzien van de stemming zijn de [artikelen J 1, tweede lid][ref1], [J 3 tot en met J 8][ref2],
      [J 10 tot en met J 19][ref3], [J 22 tot en met J 32][ref4] en [J 34 tot en met J 38 van de Kieswet][ref5] van
      toepassing, met dien verstande dat:

      a. in de [artikelen J 3][ref6] en [ J 7][ref7] in plaats van «dag van de kandidaatstelling» wordt gelezen:
      datum van het koninklijk besluit, bedoeld in [artikel 110][ref8], onderscheidenlijk het besluit, bedoeld in
      [artikel 112][ref9];

      b. in [artikel J 11, eerste lid][ref10], in plaats van «het orgaan waarvoor de verkiezing wordt gehouden» wordt
      gelezen: het referendum;

      c. in [artikel J 24, eerste lid][ref11], in plaats van «de verkiezing» wordt gelezen: het referendum;

      d. in [artikel J 26, eerste lid][ref12], in plaats van «de naam van de kandidaat van zijn keuze» wordt gelezen:
      zijn keuze inzake de wet of het besluit.


