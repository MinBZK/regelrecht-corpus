        bwb_id: BWBR0004627
        artikel: N_1
      - id: ref2
        bwb_id: BWBR0004627
        artikel: N_5
  - number: '122'
    text: |-
      1 Het stembureau stelt vast:

      a. het aantal stemmen dat voor de aan het referendum onderworpen wet of het aan het referendum onderworpen besluit
      is uitgebracht;

      b. het aantal stemmen dat tegen de aan het referendum onderworpen wet of het aan het referendum onderworpen besluit
      is uitgebracht;

      c. de som van de onder a en b bedoelde aantallen stemmen, zijnde het aantal geldig uitgebrachte stemmen;

      d. het aantal ongeldige stemmen;

      e. het aantal kiesgerechtigden dat volgens bij algemene maatregel van bestuur te stellen regels bevoegd is in het
      stemdistrict aan de stemming deel te nemen.

      2 De [artikelen N 7][ref1] en [N 8 van de Kieswet][ref2] zijn van toepassing, met dien verstande dat in
      [artikel N 7, tweede lid][ref3], in plaats van «op welke kandidaat hij zijn stem uitbrengt» gelezen wordt: welke
      keuze hij doet.

      3 Bij de stemopneming door een briefstembureau blijft het eerste lid, onderdeel e, buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_7
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_8
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_7
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel122
