  - number: '10'
    text: |-
      1 Onze Minister besluit in overeenstemming met Onze Minister wie het aangaat onverwijld nadat een wetsvoorstel is
      bekrachtigd, of, gelet op [artikel 7][ref1], over de wet een referendum kan worden gehouden.

      2 Indien Onze Minister tevens de enige minister is wie het aangaat, neemt Onze Minister het besluit in
      overeenstemming met Onze Minister van Justitie.

      3 Indien het een wet tot goedkeuring van een verdrag betreft, wordt het besluit genomen door Onze Minister van
      Buitenlandse Zaken in overeenstemming met Onze Minister en Onze Minister wie het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel7
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel10
