  - number: '25'
    text: |-
      1 Indien de inwerkingtreding van een besluit als bedoeld in [artikel 8, eerste lid, onder a][ref1], waarover
      een referendum kan worden gehouden, geen uitstel kan lijden, kunnen provinciale staten, onderscheidenlijk de
      gemeenteraad, in afwijking van [artikel 22][ref2], bij de vaststelling van het besluit en onder verwijzing in het
      besluit naar dit artikel bepalen dat het in werking treedt alvorens de in [artikel 22, tweede lid][ref3], genoemde
      termijn is verstreken. Het besluit kan volgens de bepalingen van deze wet na de inwerkingtreding aan een referendum
      worden onderworpen.

      2 Indien over een besluit als bedoeld in het eerste lid een referendum wordt gehouden en onherroepelijk is
      vastgesteld dat het referendum heeft geleid tot een raadgevende uitspraak tot afwijzing van het besluit, nemen
      provinciale staten, onderscheidenlijk de gemeenteraad, zo spoedig mogelijk een beslissing omtrent intrekking van
      het besluit dat aan het referendum is onderworpen. [Artikel 152 van de Provinciewet][ref4], onderscheidenlijk
      [artikel 156 van de Gemeentewet][ref5], is niet van toepassing.

      3 Voorzover blijkt dat een belanghebbende ten gevolge van de intrekking van een besluit overeenkomstig het
      tweede lid schade lijdt of zal lijden welke redelijkerwijs niet of niet geheel te zijnen laste behoort te
      blijven en waarvan de vergoeding niet of niet voldoende op andere wijze is verzekerd, kennen provinciale staten,
      onderscheidenlijk de gemeenteraad, hem op zijn verzoek een naar billijkheid te bepalen schadevergoeding toe.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0012701#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel152
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel156
