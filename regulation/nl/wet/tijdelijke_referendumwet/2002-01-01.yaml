  - number: '13'
    text: |-
      Indien een inleidend verzoek tot het houden van een referendum over een wet onherroepelijk is toegelaten, vervalt
      hetgeen in die wet omtrent de inwerkingtreding is geregeld van rechtswege.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel13
  - number: '14'
    text: |-
      Indien onherroepelijk is vastgesteld dat geen referendum zal worden gehouden of dat een referendum niet heeft
      geleid tot een raadgevende uitspraak tot afwijzing, wordt de inwerkingtreding bij koninklijk besluit opnieuw
      geregeld.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel14
  - number: '15'
    text: |-
      Indien onherroepelijk is vastgesteld dat een referendum heeft geleid tot een raadgevende uitspraak tot afwijzing,
      wordt zo spoedig mogelijk een voorstel van wet ingediend dat uitsluitend strekt tot intrekking van de wet of tot
      regeling van de inwerkingtreding van de wet.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel15
  - number: '16'
    text: |-
      1 Indien de inwerkingtreding van een wet waarover een referendum kan worden gehouden, geen uitstel kan lijden,
      kan onder verwijzing in die wet naar dit artikel de inwerkingtreding in afwijking van de [artikelen 12][ref1] en
      [13][ref2] worden geregeld, onverminderd de mogelijkheid over de wet een referendum te houden.

      2 Indien over een wet als bedoeld in het eerste lid een referendum wordt gehouden en onherroepelijk is vastgesteld
      dat dit heeft geleid tot een raadgevende uitspraak tot afwijzing, wordt zo spoedig mogelijk beslist of een voorstel
      van wet zal worden ingediend dat uitsluitend strekt tot intrekking van de wet. Onze Minister wie het aangaat licht
      de Staten-Generaal zo spoedig mogelijk in over de beslissing van de regering ter zake.

      3 Betreft het een wet tot goedkeuring van een verdrag, dan wordt zo spoedig mogelijk beslist of een voorstel van
      wet zal worden ingediend dat uitsluitend strekt tot intrekking van de wet of tot goedkeuring van het voornemen tot
      opzegging van het verdrag, indien de binding aan het verdrag reeds is aangegaan. Onze Minister van Buitenlandse
      Zaken licht de Staten-Generaal zo spoedig mogelijk in over de beslissing van de regering terzake.

      4 Voorzover blijkt dat een belanghebbende ten gevolge van de intrekking van een wet overeenkomstig het tweede
      of derde lid dan wel de opzegging van een verdrag overeenkomstig het derde lid schade lijdt of zal lijden welke
      redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven en waarvan de vergoeding niet of niet
      voldoende op andere wijze is verzekerd, kent Onze Minister wie het aangaat hem op zijn verzoek een naar billijkheid
      te bepalen schadevergoeding toe.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel13
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel16
