preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in functie en perspectief van wijziging van de Grondwet
    tot invoering van het correctief referendum tijdelijke bepalingen vast te stellen inzake het raadgevend correctief
    referendum,

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. referendum: raadgevend correctief referendum.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel1
  - number: '2'
    text: |-
      In de in deze wet omschreven gevallen wordt een nationaal referendum gehouden, indien na een inleidend verzoek van
      ten minste veertigduizend kiesgerechtigden ten minste zeshonderdduizend kiesgerechtigden daartoe bij een definitief
      verzoek de wens kenbaar hebben gemaakt.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel2
  - number: '3'
    text: |-
      In de in deze wet omschreven gevallen wordt een provinciaal referendum gehouden, indien na een inleidend verzoek
      van ten minste 1/3 procent van de kiesgerechtigden in de betrokken provincie ten minste vijf procent van de
      kiesgerechtigden in die provincie daartoe bij een definitief verzoek de wens kenbaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel3
  - number: '4'
    text: |-
      1 In de in deze wet omschreven gevallen wordt een gemeentelijk referendum gehouden, indien na een inleidend verzoek
      van ten minste het in het tweede lid bepaalde aantal kiesgerechtigden ten minste het in het derde lid bepaalde
      aantal kiesgerechtigden daartoe bij een definitief verzoek de wens kenbaar heeft gemaakt.

      2 Voor een inleidend verzoek is vereist dat een verzoek wordt gedaan:

      a. in gemeenten met minder dan 20 001 kiesgerechtigden, door 1 procent van de kiesgerechtigden met dien verstande
      dat dit getal niet lager ligt dan 50 en niet hoger dan 125 kiesgerechtigden;

      b. in gemeenten met 20 001–40 000 kiesgerechtigden, door 0,7 procent van de kiesgerechtigden met dien verstande dat
      dit getal niet hoger ligt dan 200 kiesgerechtigden;

      c. in gemeenten met 40 001–100 000 kiesgerechtigden, door 0,5 procent van de kiesgerechtigden met dien verstande
      dat dit getal niet hoger ligt dan 300 kiesgerechtigden;

      d. in gemeenten met 100 001 of meer kiesgerechtigden, door 1/3 procent van de kiesgerechtigden.

      3 Voor een definitief verzoek is vereist dat het inleidend verzoek ondersteund wordt:

      a. in gemeenten met minder dan 20 001 kiesgerechtigden, door 10 procent van de kiesgerechtigden met dien verstande
      dat dit getal niet lager ligt dan 200 en niet hoger dan 1250 kiesgerechtigden;

      b. in gemeenten met 20 001–40 000 kiesgerechtigden, door 7 procent van de kiesgerechtigden met dien verstande dat
      dit getal niet hoger ligt dan 2250 kiesgerechtigden;

      c. in gemeenten met 40 001–100 000 kiesgerechtigden, door 6 procent van de kiesgerechtigden met dien verstande dat
      dit getal niet hoger ligt dan 5000 kiesgerechtigden;

      d. in gemeenten met 100 001 of meer kiesgerechtigden, door 5 procent van de kiesgerechtigden.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel4
  - number: '5'
    text: |-
      De uitslag van een referendum geldt als een raadgevende uitspraak tot afwijzing, indien een meerderheid zich in
      afwijzende zin uitspreekt en deze meerderheid ten minste dertig procent omvat van hen die gerechtigd waren aan het
      referendum deel te nemen.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel5
  - number: '6'
    text: |-
      Een nationaal referendum kan worden gehouden over:

      a. wetten;

      b. stilzwijgende goedkeuring van verdragen die binnen het Koninkrijk alleen voor Nederland gelden.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel6
  - number: '7'
    text: |-
      Geen referendum kan worden gehouden over:

      a. wetten inzake het koningschap;

      b. wetten inzake het koninklijk huis;

      c. wetten inzake de begroting, bedoeld in [artikel 105, eerste lid, van de Grondwet][ref1];

      d. wetten tot verandering in de [Grondwet][ref2] en wetten houdende verklaring dat er grond bestaat een voorstel
      hiertoe in overweging te nemen;

      e. wetten die uitsluitend strekken tot uitvoering van verdragen of besluiten van volkenrechtelijke organisaties;

      f. rijkswetten, behoudens rijkswetten tot goedkeuring van verdragen die binnen het Koninkrijk alleen voor Nederland
      gelden;

      g. wetten als bedoeld in de [artikelen 15][ref3] en [16, tweede en derde lid][ref4], die uitsluitend strekken
      tot intrekking of tot regeling van de inwerkingtreding van een wet naar aanleiding van een daarover gehouden
      referendum;

      h. wetten als bedoeld in de [artikelen 16, derde lid][ref5], en [20, tweede lid][ref6], die uitsluitend strekken
      tot goedkeuring van het voornemen tot opzegging van een verdrag naar aanleiding van een over de goedkeuring van dat
      verdrag gehouden referendum;

      i. wetten als bedoeld in [artikel 19, tweede lid][ref7], die uitsluitend strekken tot intrekking van de aan een
      verdrag verleende goedkeuring naar aanleiding van een daarover gehouden referendum.


