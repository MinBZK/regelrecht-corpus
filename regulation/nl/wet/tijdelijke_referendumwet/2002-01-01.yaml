      - id: ref3
        bwb_id: BWBR0012701
        artikel: '125'
        hoofdstuk: '9'
  - number: '130'
    text: |-
      1 Nadat alle werkzaamheden zijn beëindigd, wordt daarvan onmiddellijk proces-verbaal opgemaakt. Alle ingebrachte
      bezwaren worden in het proces-verbaal vermeld.

      2 Het proces-verbaal wordt door alle aanwezige leden van het hoofdstembureau getekend.

      3 Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel130
  - number: '131'
    text: |-
      1 De voorzitter van het hoofdstembureau doet terstond een afschrift van het proces-verbaal, bedoeld in
      [artikel 130][ref1], naar het centraal stembureau overbrengen en doet tegelijkertijd het proces-verbaal
      ter secretarie van de gemeente waar het hoofdstembureau is gevestigd, voor een ieder ter inzage leggen. De
      terinzagelegging wordt beëindigd, zodra de uitslag van het referendum onherroepelijk is vastgesteld.

      2 De voorzitter van het hoofdstembureau doet tevens de processen-verbaal van de stembureaus en de opgaven, bedoeld
      in [artikel 126][ref2], aan het centraal stembureau toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel126
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '130'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0012701
        artikel: '126'
        hoofdstuk: '9'
  - number: '132'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de taak van het hoofdstembureau
      inzake de vaststelling van de uitslag van het referendum.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel132
  - number: '133'
    text: |-
      1 Onmiddellijk nadat de afschriften van de processen-verbaal van alle hoofdstembureaus zijn ontvangen, gaat het
      centraal stembureau over tot de werkzaamheden ter vaststelling van de uitslag van het referendum.

      2 Bij een provinciaal of gemeentelijk referendum blijven de [artikelen 128 tot en met 133, eerste lid][ref1],
      buiten toepassing en gaat het centraal stembureau onmiddellijk nadat het de in [artikel 126][ref2] bedoelde
      bescheiden heeft ontvangen, over tot de werkzaamheden ter vaststelling van de uitslag van het referendum.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel126
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '128'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0012701
        artikel: '126'
        hoofdstuk: '9'
  - number: '134'
    text: |-
      1 Het centraal stembureau onderzoekt de geldigheid van de stemming en de juistheid van de vaststelling van de
      uitkomsten van de stemming door de stembureaus en de hoofdstembureaus, en beslist de geschillen die te dien aanzien
      rijzen. Het neemt daartoe kennis van de processen-verbaal van de stembureaus en de hoofdstembureaus.

      2 Ten behoeve van het onderzoek, bedoeld in het eerste lid, kan het centraal stembureau tot een nieuwe opneming van
      stembiljetten, zowel uit alle als uit een of meer stemdistricten besluiten. De burgemeester die de desbetreffende
      stembiljetten onder zich heeft, doet deze op verzoek van het centraal stembureau onverwijld naar dat orgaan
      overbrengen. Na ontvangst van de stembiljetten gaat het centraal stembureau onmiddellijk tot de opneming over.
      Het is bevoegd daartoe de verzegelde pakken te openen en de inhoud te vergelijken met de processen-verbaal van de
      stembureaus. Bij deze opneming is [hoofdstuk N, paragraaf 1, van de Kieswet][ref1] van overeenkomstige toepassing.

      3 Ten behoeve van het onderzoek, bedoeld in het eerste lid, is het centraal stembureau tevens bevoegd de verzegelde
      pakken, bedoeld in [artikel N 2 van de Kieswet][ref2], te openen. De burgemeester die de desbetreffende pakken
      onder zich heeft, doet deze op verzoek van het centraal stembureau onverwijld naar dat orgaan overbrengen. Na
      beëindiging van het onderzoek worden de bescheiden uit de geopende pakken opnieuw ingepakt en verzegeld op de in
      [artikel N 2 van de Kieswet][ref3] voorgeschreven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#Paragraaf1
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_2
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0004627
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004627
        artikel: N_2
      - id: ref3
        bwb_id: BWBR0004627
        artikel: N_2
  - number: '135'
    text: |-
      1 Indien het centraal stembureau besluit dat een nationaal referendum ongeldig is wegens de ongeldigheid van de
      stemming in één of meer stemdistricten, geeft de voorzitter daarvan onverwijld kennis aan Onze Minister.

      2 Uiterlijk op de dertigste dag nadat deze kennisgeving is ontvangen, vindt in de in het eerste lid bedoelde
      stemdistricten een nieuwe stemming plaats en wordt de uitslag van het referendum opnieuw vastgesteld. De dag van de
      stemming wordt vastgesteld door Onze Minister.

      3 [Artikel V 7 van de Kieswet][ref1] is van toepassing.

      4 Dit artikel is ten aanzien van een provinciaal en een gemeentelijk referendum van overeenkomstige toepassing,
      met dien verstande dat de in het eerste lid bedoelde kennisgeving geschiedt aan en de in het tweede lid bedoelde
      vaststelling van de dag van de stemming door gedeputeerde staten, onderscheidenlijk burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_7
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: V_7
  - number: '136'
    text: |-
      Het centraal stembureau stelt vast:

      a. het totale aantal stemmen dat voor de aan het referendum onderworpen wet of het aan het referendum onderworpen
      besluit is uitgebracht;

      b. het totale aantal stemmen dat tegen de aan het referendum onderworpen wet of het aan het referendum onderworpen
      besluit is uitgebracht;

      c. de som van de onder a en b bedoelde aantallen stemmen, zijnde het totale aantal geldig uitgebrachte stemmen;

      d. het totale aantal ongeldige stemmen;

      e. het totale aantal kiesgerechtigden voor het referendum.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel136
  - number: '137'
    text: |-
      Het centraal stembureau stelt vervolgens vast of een meerderheid zich tegen de aan het referendum onderworpen wet
      of het aan het referendum onderworpen besluit heeft uitgesproken en, indien dit het geval is, of die meerderheid
      ten minste dertig procent omvat van hen die gerechtigd waren aan het referendum deel te nemen.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel137
  - number: '138'
    text: |-
      1 De voorzitter van het centraal stembureau maakt de uitslag van het referendum zo spoedig mogelijk bekend. De
      bekendmaking geschiedt in een openbare zitting van het centraal stembureau.

      2 Dag en uur van de zitting worden door de voorzitter tijdig bekend gemaakt. De wijze van bekendmaking wordt
      geregeld bij algemene maatregel van bestuur.

      3 De aanwezige kiezers kunnen mondeling bezwaren inbrengen.

      4 De voorzitter is belast met de handhaving van de orde tijdens de zitting.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel138
  - number: '139'
    text: |-
      1 Nadat alle werkzaamheden zijn beëindigd, wordt daarvan aanstonds proces-verbaal opgemaakt. In dit proces-verbaal
      worden de uitslag van het referendum, alle ingebrachte bezwaren, alsmede de gerezen geschillen en de beslissingen
      die te dien aanzien zijn genomen, vermeld.

      2 Het proces-verbaal wordt door alle aanwezige leden van het centraal stembureau getekend.

      3 Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel139
  - number: '140'
    text: |-
      De voorzitter van het centraal stembureau maakt de uitslag van het referendum zo spoedig mogelijk openbaar, voor
      een nationaal referendum door plaatsing van een afschrift van het proces-verbaal in de Staatscourant en voor een
      provinciaal of gemeentelijk referendum op de in de provincie, onderscheidenlijk gemeente, gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel140
  - number: '141'
    text: |-
      De voorzitter van het centraal stembureau doet een afschrift van het proces-verbaal toekomen, bij een nationaal
      referendum aan de voorzitter van de Tweede Kamer der Staten-Generaal, de voorzitter van de Eerste Kamer der Staten-
      Generaal en Onze Minister, bij een provinciaal referendum aan provinciale staten en bij een gemeentelijk referendum
      aan de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel141
  - number: '142'
    text: |-
      1 De voorzitter van het centraal stembureau draagt zorg voor de bewaring van de verzegelde pakken met stembiljetten
      die op grond van [artikel 134, tweede lid][ref1], naar het centraal stembureau zijn overgebracht.

      2 Hij vernietigt deze pakken, alsmede de processen-verbaal van de stembureaus en de opgaven, bedoeld in
      [artikel 126][ref2], nadat de uitslag van het referendum onherroepelijk is vastgesteld. Van deze vernietiging wordt
      proces-verbaal opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel126
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '134'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0012701
        artikel: '126'
        hoofdstuk: '9'
  - number: '143'
    text: |-
      Geen beroep kan worden ingesteld tegen een besluit:

      a. van het stembureau, het plaatselijk stembureau, het hoofdstembureau, de voorzitter van het plaatselijk
      stembureau of het hoofdstembureau, of de burgemeester inzake het inleidend verzoek tot het houden van een
      referendum, het definitieve verzoek tot het houden van een referendum, het verloop van de stemming, de
      stemopneming, de vaststelling van het aantal kiesgerechtigden en de vaststelling van de uitslag van een referendum;

      b. tot vaststelling van de datum waarop een referendum wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel143
  - number: '144'
    text: |-
      Tegen de hierna genoemde besluiten kan een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van
      de Raad van State:

      a. besluiten of een wet of besluit aan een referendum kan worden onderworpen;

      b. besluiten van de voorzitter van het centraal stembureau inzake het inleidend verzoek tot het houden van een
      referendum;

      c. besluiten van het centraal stembureau inzake het definitieve verzoek tot het houden van een referendum, het
      verloop van de stemming, de stemopneming en de vaststelling van de uitslag van een referendum.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel144
  - number: '145'
    text: |-
      Bij de behandeling van de in [artikel 144][ref1] bedoelde beroepen gelden de volgende afwijkingen van de
      [Algemene wet bestuursrecht][ref2]:

      a. In afwijking van [artikel 6:7][ref3] bedraagt de termijn voor het indienen van een beroepschrift zes dagen.

      b. [Artikel 7:1][ref4] en [titel 8.3][ref5] blijven buiten toepassing.

      c. In afwijking van [artikel 8:41, tweede lid][ref6], bedraagt de termijn binnen welke de bijschrijving of storting
      van het verschuldigde bedrag dient plaats te vinden, twee weken. De voorzitter van de Afdeling bestuursrechtspraak
      van de Raad van State kan een kortere termijn stellen.

      d. De Afdeling behandelt de zaak met toepassing van [afdeling 8.2.3][ref7]. [Afdeling 8.2.4][ref8] blijft buiten
      toepassing. Aan het bestuursorgaan wordt terstond een afschrift van het beroepschrift gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel144
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel71
      [ref5]: https://wetten.overheid.nl/BWBR0005537
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel841
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.3
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.4
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel145
