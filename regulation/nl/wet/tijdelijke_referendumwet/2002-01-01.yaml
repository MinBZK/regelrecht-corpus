        artikel: B_6
  - number: '33'
    text: |-
      De registratie van de kiesgerechtigdheid van de ingezetenen van de gemeente in de gemeentelijke administratie voor
      de verkiezingen van de Tweede Kamer, provinciale staten en de gemeenteraad geldt tevens als registratie van de
      kiesgerechtigdheid voor onderscheidenlijk nationale, provinciale en gemeentelijke referenda.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel33
  - number: '34'
    text: |-
      1 Burgemeester en wethouders van 's-Gravenhage registreren voor elk nationaal referendum de kiesgerechtigdheid
      van personen die hun werkelijke woonplaats buiten Nederland hebben, indien dezen daartoe een schriftelijk verzoek
      hebben ingediend.

      2 Burgemeester en wethouders van 's-Gravenhage zenden voor elk nationaal referendum aan de personen die zijn
      opgenomen in het bestand, bedoeld in [artikel D 3a van de Kieswet][ref1], een formulier tot registratie van de
      kiesgerechtigdheid toe.

      3 Het verzoek kan worden ingediend vanaf het tijdstip waarop het besluit van de voorzitter van het centraal
      stembureau tot toelating van het inleidend verzoek tot het houden van een referendum onherroepelijk is geworden
      en dient uiterlijk zes weken voor de dag van de stemming te zijn ontvangen door het orgaan waarbij het moet worden
      ingediend.

      4 Burgemeester en wethouders van 's-Gravenhage beslissen op het verzoek uiterlijk op de zevende dag nadat zij dit
      hebben ontvangen, maar niet voor de dagtekening van het koninklijk besluit, bedoeld in [artikel 110][ref2].

      5 De [artikelen D 3, derde tot met zesde en negende lid][ref3], en [D 8 van de Kieswet][ref4] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3a
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel110
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_3
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_8
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel34
    references:
