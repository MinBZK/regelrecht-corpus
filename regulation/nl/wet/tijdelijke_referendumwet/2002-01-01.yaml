        paragraaf: '2'
  - number: '71'
    text: |-
      1 Nadat alle werkzaamheden zijn beëindigd, wordt daarvan aanstonds proces-verbaal opgemaakt. In dit proces-verbaal
      worden de gerezen geschillen en de beslissingen die te dien aanzien zijn genomen, vermeld.

      2 Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel71
  - number: '72'
    text: |-
      1 De voorzitter van het centraal stembureau maakt het besluit inzake de toelating van het inleidend verzoek zo
      spoedig mogelijk openbaar, voor een nationaal referendum door mededeling van het besluit in de Staatscourant, en
      voor een provinciaal of gemeentelijk referendum op de in de provincie, onderscheidenlijk gemeente, gebruikelijke
      wijze. Een afschrift van het proces-verbaal wordt voor een ieder ter inzage gelegd.

      2 Bij een nationaal referendum doet de voorzitter van het centraal stembureau van het besluit inzake de toelating
      van het inleidend verzoek mededeling aan de voorzitter van de Tweede Kamer der Staten-Generaal, aan de voorzitter
      van de Eerste Kamer der Staten-Generaal en aan Onze Minister.

      3 Bij een provinciaal, onderscheidenlijk gemeentelijk, referendum doet de voorzitter van het centraal stembureau
      van het besluit inzake de toelating van het inleidend verzoek mededeling aan provinciale staten, onderscheidenlijk
      de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel72
  - number: '73'
    text: |-
      1 De voorzitter van het centraal stembureau draagt zorg voor de bewaring van de verzegelde pakken met formulieren
      die op grond van [artikel 67][ref1] naar hem zijn overgebracht.

      2 Hij vernietigt deze pakken en de processen-verbaal van de plaatselijke stembureaus, alsmede bij een nationaal
      referendum de processen-verbaal van de hoofdstembureaus, nadat onherroepelijk is vastgesteld dat geen referendum
      zal worden gehouden, of nadat de uitslag van het referendum onherroepelijk is vastgesteld. Van deze vernietiging
      wordt proces-verbaal opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel67
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '67'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '74'
    text: |-
      Het definitieve verzoek tot het houden van een referendum wordt gevormd door het totale aantal geldige verklaringen
      ter ondersteuning van het inleidend verzoek.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel74
  - number: '75'
    text: |-
      1 Binnen zes weken nadat het besluit van de voorzitter van het centraal stembureau tot toelating van het inleidend
      verzoek onherroepelijk is geworden, kan iedere kiesgerechtigde een verklaring tot ondersteuning van het inleidend
      verzoek afleggen.

      2 De burgemeester van elke gemeente brengt zo spoedig mogelijk ter openbare kennis de termijn waarbinnen en de
      plaatsen binnen de gemeente waar een ondersteuningsverklaring kan worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel75
  - number: '76'
    text: |-
      1 Een ondersteuningsverklaring wordt afgelegd door de kiesgerechtigde in persoon, naar zijn keuze ter secretarie
      van de gemeente waar hij als kiesgerechtigde is geregistreerd of op een andere plaats als bedoeld in het derde lid.

      2 De kiesgerechtigde ondertekent de verklaring ten overstaan van een daartoe door de burgemeester aangewezen
      ambtenaar of andere persoon en geeft deze daarbij blijk van zijn identiteit.

      3 Burgemeester en wethouders wijzen naast de gemeentesecretarie zoveel andere plaatsen binnen de gemeente aan
      waar ondersteuningsverklaringen ten overstaan van een daartoe door de burgemeester aangewezen ambtenaar of andere
      persoon kunnen worden afgelegd, als met het oog op een redelijke bereikbaarheid daarvan voor de kiezers wenselijk
      is.

      4 Voor het afleggen van de ondersteuningsverklaring wordt gebruik gemaakt van een formulier dat door het
      gemeentebestuur ter beschikking wordt gesteld. Bij ministeriële regeling wordt voor het formulier een model
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel76
  - number: '77'
    text: |-
      1 Een kiesgerechtigde mag niet meer dan één verklaring ter ondersteuning van hetzelfde inleidend verzoek afleggen.

      2 Een afgelegde ondersteuningsverklaring kan niet worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel77
  - number: '78'
    text: |-
      De door de burgemeester aangewezen ambtenaar of andere persoon tekent in tegenwoordigheid van de kiesgerechtigde op
      het formulier de datum aan waarop de ondersteuningsverklaring is afgelegd.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel78
  - number: '79'
    text: |-
      1 Zo spoedig mogelijk wordt nagegaan of degene die een ondersteuningsverklaring heeft afgelegd, als kiesgerechtigde
      in de gemeente is geregistreerd en of hij reeds een verklaring ter ondersteuning van hetzelfde inleidend verzoek
      heeft ingediend. Op het formulier wordt hiervan aantekening gehouden.

      2 Voor de beoordeling of aan de vereisten voor het kiesrecht is voldaan, is bepalend of dit op enig tijdstip binnen
      de in het [eerste lid van artikel 75][ref1] bedoelde termijn het geval was.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel75
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '75'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '80'
    text: |-
      1 Een ondersteuningsverklaring kan ook per brief worden afgelegd.

      2 Een per brief af te leggen ondersteuningsverklaring dient binnen de in [artikel 75, eerste lid][ref1], bedoelde
      termijn ter secretarie van de gemeente waar de kiesgerechtigde als zodanig is geregistreerd, te zijn ontvangen. Op
      verklaringen die buiten deze termijn binnenkomen, wordt de dag van ontvangst aangetekend.

      3 Voor het afleggen van de ondersteuningsverklaring wordt gebruik gemaakt van een formulier dat door het
      gemeentebestuur ter beschikking wordt gesteld en reeds voorzien is van de benaming van de wet of het besluit waarop
      de verklaring betrekking heeft. Bij ministeriële regeling wordt voor het formulier een model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel75
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '75'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '81'
    text: |-
      1 De kiesgerechtigde die zijn werkelijke woonplaats buiten Nederland heeft, legt de verklaring ter ondersteuning
      van een inleidend verzoek voor een nationaal referendum af per brief.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld voor het afleggen van deze
      verklaringen en de controle daarvan, zoveel mogelijk overeenkomstig en zo nodig in afwijking van het bij of
      krachtens dit hoofdstuk bepaalde.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel81
  - number: '82'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake het afleggen van
      ondersteuningsverklaringen, de eisen waaraan een ondersteuningsverklaring moet voldoen en de controle daarvan.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel82
  - number: '83'
    text: |-
      1 Bij algemene maatregel van bestuur ka n worden bepaald dat ondersteuningsverklaringen in afwijking van
      [artikel 76][ref1] op elektronische wijze kunnen worden afgelegd.

      2 Tot het bij algemene maatregel van bestuur openen van deze mogelijkheid kan slechts worden overgegaan indien
      verzekerd is dat die wijze van aflegging van ondersteuningsverklaringen geen afbreuk doet aan de vereisten van
      toezicht en betrouwbaarheid.

      3 Bij de in het eerste lid bedoelde algemene maatregel van bestuur wordt, zoveel mogelijk overeenkomstig
      en zo nodig in afwijking van het bij of krachtens dit hoofdstuk bepaalde, bepaald op welke wijze deze
      ondersteuningsverklaringen worden afgelegd en gecontroleerd.

      4 Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan
      acht weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel76
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '84'
    text: |-
      Onmiddellijk nadat de termijn van zes weken, bedoeld in [artikel 75][ref1], is verstreken, worden de formulieren
      met de afgelegde ondersteuningsverklaringen overgebracht naar het plaatselijk stembureau, of, indien het een
      gemeentelijk referendum betreft, naar het centraal stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel75
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '75'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '85'
    text: |-
      1 Het plaatselijk stembureau houdt op de tweede dag na afloop van de termijn van zes weken, bedoeld in
      [artikel 75][ref1], om tien uur een openbare zitting.

      2 Dag en uur van de zitting van het plaatselijk stembureau worden door de voorzitter tijdig bekendgemaakt. De wijze
      van bekendmaking wordt geregeld bij algemene maatregel van bestuur.

      3 De voorzitter is belast met de handhaving van de orde tijdens de zitting.

      4 Door de aanwezige kiesgerechtigden kunnen mondeling bezwaren worden ingebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel75
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '75'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '86'
    text: |-
      1 Op de zitting stelt het plaatselijk stembureau vast:

      a. het aantal geldige ondersteuningsverklaringen;

      b. het aantal ongeldige ondersteuningsverklaringen.

      2 Ongeldig zijn de ondersteuningsverklaringen die:

      a. zijn afgelegd door personen die daartoe ingevolge [artikel 75][ref1] niet gerechtigd zijn;

      b. niet zijn afgelegd ter secretarie van, of op een andere plaats als bedoeld in [artikel 76, derde lid][ref2],
      binnen de gemeente waar de betrokkene als kiesgerechtigde is geregistreerd;

      c. zijn afgelegd voordat de termijn, bedoeld in [artikel 75][ref3], is aangevangen;

      d. zijn afgelegd nadat de termijn, bedoeld in [artikel 75][ref4], is verstreken;

      e. niet alle gegevens bevatten die krachtens [artikel 76, vierde lid][ref5], op het formulier moeten worden
      ingevuld;

      f. niet door degene die de verklaring heeft afgelegd, zijn ondertekend;

      g. afkomstig zijn van kiesgerechtigden die meer dan één verklaring ter ondersteuning van hetzelfde inleidend
      verzoek hebben afgelegd.

      3 De voorzitter maakt de in het eerste lid bedoelde aantallen bekend aan de aanwezige kiesgerechtigden.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0012701#Artikel75
      [ref4]: https://wetten.overheid.nl/BWBR0012701#Artikel75
      [ref5]: https://wetten.overheid.nl/BWBR0012701#Artikel76
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel86
