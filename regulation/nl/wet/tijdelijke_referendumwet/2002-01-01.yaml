  - number: '36'
    text: Voor het houden van nationale referenda wordt Nederland verdeeld in kieskringen, die samenvallen met de provincies.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel36
  - number: '37'
    text: |-
      De gemeente kan door burgemeester en wethouders in stemdistricten worden verdeeld. Heeft deze verdeling niet
      plaats, dan vormt de gemeente één stemdistrict.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel37
  - number: '38'
    text: |-
      1 Er is voor elk stemdistrict een stembureau.

      2 Elk stembureau bestaat uit drie leden, van wie er één voorzitter is.

      3 Burgemeester en wethouders benoemen tijdig voordat de stemming voor een referendum wordt gehouden de leden van
      elk stembureau en een voldoend aantal plaatsvervangende leden.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel38
  - number: '39'
    text: |-
      Voor het houden van nationale en provinciale referenda is er in elke gemeente een plaatselijk stembureau. Het
      centraal stembureau voor de verkiezing van de leden van de gemeenteraad treedt als zodanig op.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel39
  - number: '40'
    text: |-
      De hoofdstembureaus voor de verkiezing van de leden van de Tweede Kamer in de gemeenten waar het provinciaal
      bestuur is gevestigd, treden op als hoofdstembureaus voor het houden van nationale referenda.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel40
  - number: '41'
    text: |-
      1 De Kiesraad treedt op als centraal stembureau voor het houden van nationale referenda.

      2 De centrale stembureaus voor de verkiezing van de leden van provinciale staten en de gemeenteraad treden op als
      centrale stembureaus voor het houden van provinciale, onderscheidenlijk gemeentelijke, referenda.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel41
  - number: '42'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels gesteld worden omtrent inrichting, samenstelling en
      werkwijze van het centraal stembureau, het hoofdstembureau en het plaatselijk stembureau.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel42
  - number: '43'
    text: |-
      Het inleidend verzoek tot het houden van een referendum wordt gevormd door het totale aantal geldige verzoeken tot
      het houden van een referendum.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel43
  - number: '44'
    text: |-
      1 Binnen drie weken na een mededeling als bedoeld in [hoofdstuk 3][ref1] dat over een wet een referendum kan worden
      gehouden, kan iedere kiesgerechtigde een verzoek tot het houden van een nationaal referendum indienen.

      2 Binnen drie weken na een bekendmaking als bedoeld in [hoofdstuk 3][ref2] dat over een besluit een referendum
      kan worden gehouden, kan iedere kiesgerechtigde een verzoek tot het houden van een provinciaal, onderscheidenlijk
      gemeentelijk, referendum indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0012701
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0012701
        hoofdstuk: '3'
  - number: '45'
    text: |-
      1 Het verzoek wordt ingediend door de verzoeker in persoon ter secretarie van de gemeente waar de verzoeker als
      kiesgerechtigde is geregistreerd.

      2 De verzoeker ondertekent het verzoek ten overstaan van een daartoe door de burgemeester aangewezen ambtenaar of
      andere persoon en geeft deze daarbij blijk van zijn identiteit.

      3 Burgemeester en wethouders kunnen naast de secretarie andere plaatsen binnen de gemeente aanwijzen waar, ten
      overstaan van een daartoe door de burgemeester aangewezen ambtenaar of andere persoon, verzoeken tot het houden van
      een referendum kunnen worden ingediend.

      4 Voor het indienen van het verzoek wordt gebruik gemaakt van een formulier dat door het gemeentebestuur ter
      beschikking wordt gesteld. Bij ministeriële regeling wordt voor het formulier een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel45
  - number: '46'
    text: |-
      1 Een verzoeker mag niet meer dan één verzoek tot het houden van een referendum over dezelfde wet of hetzelfde
      besluit indienen.

      2 Een ingediend verzoek kan niet worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel46
  - number: '47'
    text: |-
      De door de burgemeester aangewezen ambtenaar of andere persoon tekent in tegenwoordigheid van de verzoeker op het
      formulier de datum aan waarop het verzoek is ingediend.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel47
  - number: '48'
    text: |-
      1 Zo spoedig mogelijk wordt nagegaan of de verzoeker als kiesgerechtigde in de gemeente is geregistreerd en of
      hij reeds een verzoek over dezelfde wet of hetzelfde besluit heeft ingediend. Op het formulier wordt hiervan
      aantekening gehouden.

      2 Voor de beoordeling of aan de vereisten voor het kiesrecht is voldaan, is bepalend of dit op enig tijdstip binnen
      de in het [eerste of tweede lid van artikel 44][ref1] bedoelde termijn het geval was.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel44
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '44'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '49'
    text: |-
      1 De kiesgerechtigde die zijn werkelijke woonplaats buiten Nederland heeft, dient het verzoek tot het houden van
      een nationaal referendum in per brief.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld voor het indienen van deze verzoeken
      en de controle daarvan, zoveel mogelijk overeenkomstig en zo nodig in afwijking van het bij of krachtens dit
      hoofdstuk bepaalde.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel49
  - number: '50'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake de indiening van verzoeken, de eisen
      waaraan een verzoek moet voldoen en de controle daarvan.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel50
  - number: '51'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat verzoeken tot het houden van een referendum in
      afwijking van [artikel 45][ref1] op elektronische wijze kunnen worden ingediend.

      2 Tot het bij algemene maatregel van bestuur openen van deze mogelijkheid kan slechts worden overgegaan indien
      verzekerd is dat die wijze van indiening van verzoeken geen afbreuk doet aan de vereisten van toezicht en
      betrouwbaarheid.

      3 Bij de in het eerste lid bedoelde algemene maatregel van bestuur wordt, zoveel mogelijk overeenkomstig en zo
      nodig in afwijking van het bij of krachtens dit hoofdstuk bepaalde, bepaald op welke wijze deze verzoeken worden
      ingediend en gecontroleerd.

      4 Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan
      acht weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel45
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '45'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '52'
    text: |-
      Onmiddellijk nadat de termijn van drie weken, bedoeld in [artikel 44][ref1], is verstreken, worden de formulieren
      met de ingediende verzoeken overgebracht naar de voorzitter van het plaatselijk stembureau, of, indien het een
      gemeentelijk referendum betreft, van het centraal stembureau.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel44
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '44'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '53'
    text: |-
      1 De voorzitter van het plaatselijk stembureau stelt, indien er verzoeken zijn ingediend, uiterlijk op de tweede
      dag na afloop van de termijn van drie weken, bedoeld in [artikel 44][ref1], vast:

      a. het aantal geldige verzoeken,

      b. het aantal ongeldige verzoeken.

      2 Ongeldig zijn de verzoeken die:

      a. zijn ingediend door personen die daartoe ingevolge [artikel 44][ref2] niet gerechtigd zijn;

      b. niet zijn ingediend ter secretarie van, of op een andere plaats als bedoeld in [artikel 45, derde lid][ref3],
      binnen de gemeente waar de verzoeker als kiesgerechtigde is geregistreerd;

      c. zijn ingediend voordat de termijn, bedoeld in [artikel 44][ref4], is aangevangen;

      d. zijn ingediend nadat de termijn, bedoeld in [artikel 44][ref5], is verstreken;

      e. niet alle gegevens bevatten die krachtens artikel 45, vierde lid, op het formulier moeten worden ingevuld;

      f. niet door de verzoeker zijn ondertekend;

      g. afkomstig zijn van verzoekers die meer dan één verzoek tot het houden van een referendum over dezelfde wet of
      hetzelfde besluit hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0012701#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0012701#Artikel44
      [ref5]: https://wetten.overheid.nl/BWBR0012701#Artikel44
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '44'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012701
        artikel: '44'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0012701
        artikel: '45'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0012701
        artikel: '44'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0012701
        artikel: '44'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '54'
    text: |-
      Indien de voorzitter besluit een verzoek ongeldig te verklaren, wordt dit met opgave van redenen op het formulier
      aangetekend. Een kopie van het formulier wordt aan de verzoeker gezonden.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel54
  - number: '55'
    text: |-
      1 Nadat de werkzaamheden, bedoeld in [artikel 53][ref1], zijn beëindigd, worden de formulieren met de geldige
      verzoeken en de formulieren met de ongeldige verzoeken in aparte pakken gedaan en verzegeld.

      2 Op ieder pak wordt vermeld:

      a. de naam van de gemeente;

      b. het aantal formulieren;

      c. of het geldige of ongeldige verzoeken betreft;

      d. een aanduiding van het referendum waarop de verzoeken betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel53
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '56'
    text: |-
      1 Nadat alle werkzaamheden zijn beëindigd, wordt daarvan proces-verbaal opgemaakt.

      2 Het proces-verbaal wordt voor een ieder ter inzage gelegd ter secretarie van de gemeente. De terinzagelegging
      wordt beëindigd, zodra onherroepelijk over de toelating van het inleidend verzoek is beslist.

      3 Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.

      4 Indien het een gemeentelijk referendum betreft, maakt het proces-verbaal onderdeel uit van het proces-verbaal,
      bedoeld in [artikel 71][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel71
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '71'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '57'
    text: |-
      1 De verzegelde pakken, bedoeld in [artikel 55][ref1], worden ter bewaring overgebracht naar de burgemeester.

      2 De burgemeester draagt er zorg voor dat de verzegelde pakken op verzoek van de voorzitter van het centraal
      stembureau onmiddellijk naar deze worden overgebracht en dat de niet overgebrachte pakken worden vernietigd, nadat
      de uitslag van het referendum onherroepelijk is vastgesteld, dan wel nadat onherroepelijk afwijzend is beslist
      inzake het inleidend of het definitieve verzoek tot het houden van een referendum.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel55
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '58'
    text: |-
      Het proces-verbaal wordt, indien het een nationaal referendum betreft, onverwijld naar de voorzitter van het
      hoofdstembureau, of, indien het een provinciaal referendum betreft, de voorzitter van het centraal stembureau
      overgebracht.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel58
  - number: '59'
    text: |-
      Bij een gemeentelijk referendum worden de in deze paragraaf aan de voorzitter van het plaatselijk stembureau
      opgedragen werkzaamheden verricht door de voorzitter van het centraal stembureau.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel59
  - number: '60'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de taak van de voorzitter van
      het plaatselijk stembureau inzake de telling en de controle van de verzoeken tot het houden van een referendum.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel60
  - number: '61'
    text: Deze paragraaf is alleen van toepassing bij een nationaal referendum.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel61
  - number: '62'
    text: |-
      De voorzitter van het hoofdstembureau stelt uiterlijk op de dag na de ontvangst van de processen-verbaal van de
      plaatselijke stembureaus voor de provincie de totalen van de in [artikel 53][ref1] bedoelde aantallen geldige en
      ongeldige verzoeken vast.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel53
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '63'
    text: |-
      1 Nadat alle werkzaamheden zijn beëindigd, wordt daarvan proces-verbaal opgemaakt.

      2 Het proces-verbaal wordt voor een ieder ter inzage gelegd ter secretarie van de gemeente waar het hoofdstembureau
      is gevestigd. De terinzagelegging wordt beëindigd, zodra onherroepelijk over de toelating van het inleidend verzoek
      is beslist.

      3 Bij ministeriële regeling wordt voor het proces-verbaal een model vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel63
  - number: '64'
    text: |-
      Het proces-verbaal van het hoofdstembureau wordt, vergezeld van de processen-verbaal van de plaatselijke
      stembureaus, onverwijld naar de voorzitter van het centraal stembureau overgebracht.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel64
  - number: '65'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de taak van de voorzitter van
      het hoofdstembureau inzake de telling en de controle van de verzoeken tot het houden van een referendum.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel65
  - number: '66'
    text: |-
      De voorzitter van het centraal stembureau beoordeelt het inleidend verzoek bij een nationaal referendum uiterlijk
      op de tweede dag na de ontvangst van de processen-verbaal van de hoofdstembureaus, bij een provinciaal referendum
      uiterlijk op de tweede dag na de ontvangst van de processen-verbaal van de plaatselijke stembureaus en bij
      een gemeentelijk referendum uiterlijk op de tweede dag na afloop van de termijn van drie weken, bedoeld in
      [artikel 44][ref1], na beëindiging van de werkzaamheden, bedoeld in [paragraaf 2 van dit hoofdstuk][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '44'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012701
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '67'
    text: |-
      1 De voorzitter van het centraal stembureau onderzoekt de juistheid van de vaststelling van de aantallen geldige
      en ongeldige verzoeken door de voorzitters van de plaatselijke stembureaus en de hoofdstembureaus, en beslist
      de geschillen die te dien aanzien rijzen. Hij neemt daartoe kennis van de processen-verbaal van de plaatselijke
      stembureaus en de hoofdstembureaus.

      2 Ten behoeve van het onderzoek kan de voorzitter van het centraal stembureau tot een hernieuwde beoordeling van
      verzoeken besluiten. De burgemeester die de desbetreffende formulieren onder zich heeft, doet deze op verzoek van
      de voorzitter van het centraal stembureau onverwijld naar deze overbrengen. Na ontvangst van de formulieren gaat
      de voorzitter van het centraal stembureau onmiddellijk tot de beoordeling van de verzoeken over. Hij is bevoegd
      daartoe de verzegelde pakken te openen en de inhoud te vergelijken met de processen-verbaal van de plaatselijke
      stembureaus. Bij deze beoordeling zijn de [artikelen 53][ref1] en [54][ref2] van overeenkomstige toepassing.

      3 Na de beëindiging van het onderzoek worden de bescheiden uit de geopende pakken opnieuw ingepakt en verzegeld op
      de in [artikel 55][ref3] voorgeschreven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0012701#Artikel55
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012701
        artikel: '54'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012701
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '68'
    text: |-
      De voorzitter van het centraal stembureau stelt vast:

      a. het totale aantal geldige verzoeken,

      b. het totale aantal ongeldige verzoeken.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel68
  - number: '69'
    text: |-
      Bij een gemeentelijk referendum blijven de [artikelen 67][ref1] en [68][ref2] buiten toepassing en beslist de
      voorzitter van het centraal stembureau de geschillen die ten aanzien van de vaststelling van de aantallen geldige
      en ongeldige verzoeken op grond van [artikel 53][ref3] rijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0012701#Artikel53
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '67'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012701
        artikel: '68'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0012701
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '70'
    text: |-
      1 Vervolgens besluit de voorzitter van het centraal stembureau of het inleidend verzoek tot het houden van een
      referendum wordt toegelaten.

      2 De voorzitter van het centraal stembureau besluit slechts dat het inleidend verzoek niet wordt toegelaten,
      indien het aantal geldige verzoeken minder bedraagt dan het vereiste aantal, bedoeld in de [artikelen 2][ref1],
      [3][ref2], onderscheidenlijk [4, tweede lid][ref3].

      3 Voor de berekening van het vereiste aantal, bedoeld in de [artikelen 3][ref4] en [4, tweede lid][ref5], wordt
      uitgegaan van het volgens bij algemene maatregel van bestuur te stellen regels vastgestelde aantal kiesgerechtigden
      voor de laatstgehouden verkiezing van de leden van provinciale staten, onderscheidenlijk de gemeenteraad.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0012701#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0012701#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0012701#Artikel4
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel70
