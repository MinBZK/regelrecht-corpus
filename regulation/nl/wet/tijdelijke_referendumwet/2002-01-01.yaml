  - number: '146'
    text: |-
      1 In de volgende gevallen doet de Afdeling bestuursrechtspraak van de Raad van State uitspraak uiterlijk op de
      zesde dag nadat het beroepschrift is ontvangen:

      a. beroep tegen een besluit van de voorzitter van het centraal stembureau inzake het inleidend verzoek tot het
      houden van een referendum;

      b. beroep tegen een besluit van het centraal stembureau inzake het definitieve verzoek tot het houden van een
      referendum;

      c. beroep tegen een besluit of een wet of besluit aan een referendum kan worden onderworpen.

      2 Indien de uitspraak van de Afdeling strekt tot gegrondverklaring van het beroep, treedt de uitspraak in de plaats
      van het vernietigde besluit.

      3 De voorzitter van de Afdeling stelt partijen onverwijld in kennis van de uitspraak.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel146
  - number: '147'
    text: |-
      Degene die bij een referendum door geweld of bedreiging met geweld opzettelijk iemand verhindert zijn of eens
      anders kiesrecht vrij en onbelemmerd uit te oefenen, wordt gestraft met gevangenisstraf van ten hoogste een jaar of
      geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel147
  - number: '148'
    text: |-
      1 Degene die door gift of belofte iemand omkoopt om zijn recht een verzoek tot het houden van een referendum in te
      dienen hetzij niet, hetzij wel uit te oefenen, wordt gestraft met een gevangenisstraf van ten hoogste zes maanden
      of geldboete van de derde categorie.

      2 Dezelfde straf wordt toegepast op de kiezer die zich door gift of belofte tot een of ander laat omkopen.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel148
  - number: '149'
    text: |-
      1 Degene die door gift of belofte iemand omkoopt om zijn recht een verzoek tot het houden van een referendum te
      ondersteunen hetzij niet hetzij wel uit te oefenen, wordt gestraft met een gevangenisstraf van ten hoogste zes
      maanden of geldboete van de derde categorie.

      2 Dezelfde straf wordt toegepast op de kiezer die zich door gift of belofte tot een of ander laat omkopen.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel149
  - number: '150'
    text: |-
      1 Degene die bij een referendum door gift of belofte iemand omkoopt om zijn of eens anders kiesrecht hetzij
      niet, hetzij op bepaalde wijze uit te oefenen, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of
      geldboete van de derde categorie.

      2 Dezelfde straf wordt toegepast op de kiezer of de gemachtigde van een kiezer die zich door gift of belofte tot
      een of ander laat omkopen.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel150
  - number: '151'
    text: |-
      Degene die bij gelegenheid van een referendum enige bedrieglijke handeling pleegt waardoor een stem van onwaarde
      wordt of een andere dan bij het uitbrengen van de stem bedoelde keuze aangeeft, wordt gestraft met gevangenisstraf
      van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel151
  - number: '152'
    text: |-
      Degene die opzettelijk zich voor een ander uitgevende, aan een referendum deelneemt, wordt gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel152
  - number: '153'
    text: |-
      Degene die bij een referendum opzettelijk een plaats gehad hebbende stemming verijdelt of enige bedrieglijke
      handeling pleegt waardoor aan de stemming een andere uitslag wordt gegeven dan door de wettig uitgebrachte stemmen
      zou zijn verkregen, wordt gestraft met gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel153
  - number: '154'
    text: |-
      Degene die stembiljetten, kiezerspassen, volmachtbewijzen of briefstembewijzen namaakt of vervalst met het oogmerk
      deze bij een referendum als echt en onvervalst te gebruiken of door anderen te doen gebruiken, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel154
  - number: '155'
    text: |-
      Degene die bij een referendum opzettelijk als echt en onvervalst gebruikt of door anderen doet gebruiken
      stembiljetten, kiezerspassen, volmachtbewijzen of briefstembewijzen, die hij zelf heeft nagemaakt of vervalst of
      waarvan de valsheid of vervalsing hem, toen hij ze ontving, bekend was, of deze, met het oogmerk om ze als echt en
      onvervalst te gebruiken of door anderen te doen gebruiken, in voorraad heeft, wordt gestraft met gevangenisstraf
      van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel155
  - number: '156'
    text: |-
      Degene die stembiljetten, kiezerspassen, volmachtbewijzen of briefstembewijzen voorhanden heeft met het oogmerk
      deze wederrechtelijk bij een referendum te gebruiken of door anderen te doen gebruiken, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel156
  - number: '157'
    text: |-
      1 Degene die bij een referendum door gift of belofte een kiezer omkoopt om volmacht te geven tot het uitbrengen van
      zijn stem, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.

      2 Met dezelfde straf wordt gestraft de kiezer die zich door gift of belofte tot het bij volmacht stemmen laat
      omkopen.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel157
  - number: '158'
    text: |-
      1 Bij veroordeling wegens een van de in de [artikelen 154 tot en met 157][ref1] omschreven misdrijven kan
      ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°, van het Wetboek van Strafrecht][ref2] vermelde
      rechten worden uitgesproken.

      2 Bij veroordeling tot een vrijheidsstraf van ten minste een jaar wegens een van de in de
      [artikelen 147][ref3] en [152 tot en met 156][ref4] omschreven misdrijven, kan ontzetting van het in
      [artikel 28, eerste lid, onder 3°, van het Wetboek van Strafrecht][ref5] vermelde recht worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel154
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0012701#Artikel147
      [ref4]: https://wetten.overheid.nl/BWBR0012701#Artikel152
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '154'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0012701
        artikel: '147'
        hoofdstuk: '12'
      - id: ref4
        bwb_id: BWBR0012701
        artikel: '152'
        hoofdstuk: '12'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '159'
    text: |-
      Degene die bij een referendum als gemachtigde stemt voor een persoon, wetende dat deze overleden is, wordt gestraft
      met hechtenis van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel159
  - number: '160'
    text: |-
      Degene die bij een referendum een ander heeft gemachtigd voor hem te stemmen en niettemin in persoon aan de
      stemming deelneemt, wordt gestraft met hechtenis van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel160
  - number: '161'
    text: |-
      Degene die stelselmatig personen aanspreekt of anderszins persoonlijk benadert ten einde hen te bewegen het
      formulier op hun oproepingskaart, bestemd voor het stemmen bij volmacht bij een referendum, te ondertekenen en deze
      kaart af te geven, wordt gestraft met hechtenis van ten hoogste een maand of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel161
  - number: '162'
    text: |-
      De werkgever die de hem bij [artikel J 10 van de Kieswet][ref1] juncto [artikel 117][ref2] van deze wet opgelegde
      verplichting niet nakomt, wordt gestraft met hechtenis van ten hoogste veertien dagen of geldboete van de tweede
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelJ_10
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel117
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: J_10
      - id: ref2
        bwb_id: BWBR0012701
        artikel: '117'
        hoofdstuk: '8'
  - number: '163'
    text: |-
      De voorzitter, de leden en de opgeroepen plaatsvervangende leden van het stembureau die gedurende de zitting buiten
      noodzaak afwezig zijn zonder dat in vervanging is voorzien, worden gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel163
  - number: '164'
    text: |-
      De in de [artikelen 147 tot en met 157][ref1] bedoelde strafbare feiten worden als misdrijven beschouwd en de in de
      [artikelen 159 tot en met 163][ref2] bedoelde strafbare feiten als overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel147
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel159
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '147'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0012701
        artikel: '159'
        hoofdstuk: '12'
  - number: '165'
    text: |-
      1 Provinciale en gemeentelijke verordeningen die betrekking hebben op raadgevende correctieve referenda over
      onderwerpen die ingevolge [artikel 8 van deze wet][ref1] aan een referendum onderworpen kunnen worden en die op
      15 februari 2001 van kracht waren, kunnen in stand blijven tot het tijdstip waarop een voorstel tot verandering
      in de [Grondwet][ref2], overeenkomstig het bij koninklijke boodschap van 2 maart 2000 ingediende voorstel
      van wet houdende verklaring dat er grond bestaat een voorstel in overweging te nemen tot verandering in de
      [Grondwet][ref3], strekkende tot opneming van bepalingen inzake het correctief referendum (27 033), tot wet is
      verheven.

      2 Ten aanzien van een referendum op grond van een in het eerste lid bedoelde verordening waarvan vóór de
      totstandkoming van [artikel 128a van de Grondwet][ref4] onherroepelijk is komen vast te staan dat het zal worden
      gehouden, blijft die verordening van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001840
      [ref3]: https://wetten.overheid.nl/BWBR0001840
      [ref4]: https://wetten.overheid.nl/BWBR0001840#Artikel128a
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0001840
      - id: ref3
        bwb_id: BWBR0001840
      - id: ref4
        bwb_id: BWBR0001840
        artikel: 128a
  - number: '166'
    text: |-
      Deze wet laat onverlet de bevoegdheid van besturen van provincies en gemeenten om te voorzien in de mogelijkheid
      van raadgevende referenda, behoudens ten aanzien van onderwerpen waarover uit hoofde van deze wet een referendum
      kan worden gehouden of waarover een referendum op grond van [artikel 8, derde lid][ref1] is uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel8
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '8'
        hoofdstuk: '2'
  - number: '167'
    text: |-
      1 Wanneer bij of krachtens deze wet voorgeschreven verrichtingen op een zaterdag, zondag of algemeen erkende
      feestdag zouden vallen, treedt de eerstvolgende dag, geen zaterdag, zondag of algemeen erkende feestdag zijnde,
      daarvoor in de plaats.

      2 Voorzover de bepaling van de tijd voor die verrichtingen aan het openbaar gezag is opgedragen, worden daarvoor
      geen zaterdagen, zondagen of algemeen erkende feestdagen aangewezen.

      3 Onder algemeen erkende feestdagen worden verstaan de in [artikel 3 van de Algemene termijnenwet][ref1] als
      zodanig genoemde en de bij of krachtens dat artikel daarmee gelijkgestelde dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '3'
  - number: '168'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel168
  - number: '169'
    text: |-
      Deze wet is niet van toepassing op wetten die zijn bekrachtigd, verdragen die stilzwijgend zijn goedgekeurd en
      besluiten als bedoeld in [artikel 8][ref1] die zijn genomen voor de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel8
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '8'
        hoofdstuk: '2'
  - number: '170'
    text: |-
      Ten aanzien van een provinciaal of gemeentelijk raadgevend referendum waarvan vóór de inwerkingtreding van deze
      wet onherroepelijk is komen vast te staan dat het zal worden gehouden, blijft de daarop betrekking hebbende
      provinciale, onderscheidenlijk gemeentelijke, autonome regeling van kracht.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel170
  - number: '171'
    text: |-
      1 Deze wet treedt in werking met ingang van de eerste dag van de vierde kalendermaand na de datum van uitgifte van
      het Staatsblad waarin zij wordt geplaatst, en vervalt met ingang van 1 januari 2005.

      2 Ten aanzien van wetten en besluiten waarvoor op het tijdstip van het vervallen van deze wet de termijn voor het
      indienen van een inleidend verzoek tot het houden van een referendum is ingegaan, blijft het bepaalde in deze wet
      ook na dat tijdstip van kracht.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel171
  - number: '172'
    text: 'Deze wet wordt aangehaald als: Tijdelijke referendumwet.'
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel172
