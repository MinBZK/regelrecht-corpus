  - number: '17'
    text: |-
      1 De bekendmaking van een rijkswet tot goedkeuring van een verdrag dat binnen het Koninkrijk alleen voor Nederland
      geldt, vindt niet plaats dan nadat onherroepelijk is komen vast te staan dat over die rijkswet geen referendum zal
      worden gehouden dan wel de uitslag van een referendum over die rijkswet onherroepelijk is vastgesteld.

      2 Indien een referendum is gehouden en onherroepelijk is vastgesteld dat dit heeft geleid tot een raadgevende
      uitspraak tot afwijzing, wordt zo spoedig mogelijk een voorstel van rijkswet ingediend dat uitsluitend strekt tot
      intrekking of bekendmaking van de rijkswet.
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel17
  - number: '18'
    text: |-
      1 Onze Minister van Buitenlandse Zaken besluit in overeenstemming met Onze Minister en Onze Minister wie
      het aangaat, onverwijld na de verlening van stilzwijgende goedkeuring van een verdrag, of, gelet op de
      [artikelen 6][ref1] en [7][ref2], over de stilzwijgende goedkeuring een referendum kan worden gehouden.

      2 Onze Minister van Buitenlandse Zaken doet binnen een week na de verlening van stilzwijgende goedkeuring van een
      verdrag, mededeling in de Staatscourant van:

      a. de verlening van stilzwijgende goedkeuring;

      b. een algemeen toegankelijke vindplaats van de tekst van het verdrag;

      c. zijn besluit of over de stilzwijgende goedkeuring een referendum kan worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012701#Artikel7
    url: https://wetten.overheid.nl/BWBR0012701/2002-01-01#Artikel18
