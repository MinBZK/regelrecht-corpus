  - number: '120'
    text: |-
      1 Met toepassing van [hoofdstuk M van de Kieswet][ref1] kan bij een nationaal referendum door een kiezer die op de
      datum van het in [artikel 110][ref2] bedoelde koninklijk besluit zijn werkelijke woonplaats buiten Nederland heeft
      of op de dag van de stemming wegens zijn beroep of werkzaamheden of wegens het beroep of de werkzaamheden van zijn
      echtgenoot, geregistreerde partner, levensgezel of ouder buiten Nederland verblijft, per brief worden gestemd.

      2 Bij de toepassing van [hoofdstuk M van de Kieswet][ref3] wordt het volgende in acht genomen:

      a. In [artikel M 7, eerste lid][ref4], wordt in plaats van «de naam van de kandidaat van zijn keuze» gelezen: zijn
      keuze inzake de aan het referendum onderworpen wet.

      b. [Artikel M 7, tweede lid][ref5], wordt gelezen: Daarna vouwt hij het stembiljet dicht.

      c. In [artikel M 8, vierde lid][ref6], wordt in plaats van «nadat het centraal stembureau de uitslag van de
      verkiezing heeft vastgesteld en over de toelating van de gekozenen onherroepelijk is beslist» gelezen: nadat de
      uitslag van het referendum onherroepelijk is vastgesteld.

      d. In [artikel M 9, tweede lid][ref7], wordt in plaats van «de periode vanaf de zesendertigste dag tot en met de
      tweeënveertigste dag na de kandidaatstelling» gelezen: de week voor de stemming.

      e. In [artikel M 10, vierde lid][ref8], wordt in plaats van «de voorzitter van het hoofdstembureau» gelezen: de
      voorzitter van het centraal stembureau.


