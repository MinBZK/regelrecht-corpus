        artikel: N_7
  - number: '123'
    text: |-
      1 Terstond nadat de stemmen zijn opgenomen, maakt de voorzitter de in [artikel 122][ref1] bedoelde aantallen
      stemmen en kiesgerechtigden bekend. Door de aanwezige kiezers kunnen mondeling bezwaren worden ingebracht.

      2 [Artikel N 9, tweede, derde en vierde lid, van de Kieswet][ref2] is van toepassing, met dien verstande dat:

      a. in [artikel N 9, derde lid][ref3], in plaats van «lijstgewijs gerangschikt» gelezen wordt: verdeeld in stemmen
      voor en stemmen tegen de wet of het besluit;

      b. [artikel N 9, vierde lid, onder b][ref4], gelezen wordt: het aantal stembiljetten dat het pak bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
      [ref4]: https://wetten.overheid.nl/BWBR0004627#ArtikelN_9
