  text: |-
    Gelet op de artikelen 2, derde lid en 3 van het Besluit inventarisatie broeikasgassen Wlv in verbinding met artikel
    59, vierde lid, van de Wet inzake de luchtverontreiniging;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0021265/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Als organisatie die het beheer van het nationaal inventarisatiesysteem voert en zorg draagt voor het jaarlijks
      opstellen, archiveren en openbaar maken van de nationale emissieinventaris is aangewezen Rijksdienst voor
      Ondernemend Nederland.

      2 De jaarlijkse openbaarmaking van de emissie-inventaris geschiedt eerst na goedkeuring van die inventaris door
      onze Minister.
    url: https://wetten.overheid.nl/BWBR0021265/2015-01-01#Artikel1
