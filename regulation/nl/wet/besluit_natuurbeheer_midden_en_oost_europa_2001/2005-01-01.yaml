---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_natuurbeheer_midden_en_oost_europa_2001
regulatory_layer: WET
publication_date: '2005-06-13'
valid_from: '2005-01-01'
bwb_id: BWBR0012533
url: https://wetten.overheid.nl/BWBR0012533/2005-01-01
preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Buitenlandse Zaken;

    Gelet op artikel 3 van de Kaderregeling subsidiëring natuurprojecten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van dit besluit wordt verstaan onder:

            a
            Dienst Regelingen:

              Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



            b
            pre-accessielanden:

              Europese staten die op grond van artikel 49 van het Verdrag betreffende de Europese Unie een verzoek hebben
      ingediend om lid te worden van de Europese Unie, welk verzoek door de Raad van de Europese Unie in behandeling
      is genomen.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel1
  - number: '2'
    text: |-
      Aanvragen tot subsidieverlening voor projecten, bedoeld in artikel 2 van de Kaderregeling subsidiëring
      natuurprojecten, kunnen worden ingediend voor het thema 'Natuurbeheer Midden- en Oost-Europa'.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel2
  - number: '3'
    text: |-
      Voor het in [artikel 2][ref1] genoemde thema is voor 2001 een bedrag van f 4.822.022,- beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0012533#Artikel2
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012533
        artikel: '2'
        paragraaf: '1'
  - number: '4.1'
    text: |-
      Subsidie op basis van dit besluit kan slechts worden verstrekt voor projecten die een bijdrage leveren aan de
      uitvoering van het Actieplan Natuurbeheer Midden- en Oost-Europa 2001-2004.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel4
  - number: '4.2'
    text: |-
      Aanvragen tot subsidieverlening kunnen worden ingediend voor de volgende thema's van het in het eerste lid genoemde
      Actieplan:
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel4
  - number: 4.2.a
    text: beleidsontwikkeling natuurbeheer en ecologische netwerken;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel4
  - number: 4.2.b
    text: versterking van het draagvlak voor natuurbeheer;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel4
  - number: 4.2.c
    text: gebiedsbescherming en beheer van ecosystemen en uitwisseling van expertise ten aanzien van ecosystemen;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel4
  - number: 4.2.d
    text: bevordering van een duurzame relatie tussen landbouw en natuurbeheer.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel4
  - number: '5'
    text: 'Voor subsidieverlening komen uitsluitend in aanmerking projecten:'
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel5
  - number: 5.a
    text: |-
      die gericht zijn op de in het Actieplan Natuurbeheer Midden- en Oost-Europa 2001-2004 genoemde prioritaire regio's
      en landen;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel5
  - number: 5.b
    text: die gesteund worden door de bevoegde nationale autoriteiten in het land waar zij worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel5
  - number: 5.c
    text: |-
      die in overeenstemming zijn met het algemene buitenlands beleid, met het algemene internationale natuur- en
      milieubeleid en met het beleid dat Nederland voert ten opzichte van de betreffende regio of het betreffende land;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel5
  - number: 5.d
    text: die in de pre-accessielanden in overeenstemming zijn met het toetredingsbeleid van de Europese Unie, en;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel5
  - number: 5.e
    text: |-
      die bestaan uit activiteiten die zoveel mogelijk aan de volgende kenmerken voldoen: - lokale organisaties
      versterken die zich met natuurbeheer bezig houden;
        - doorwerking hebben in die zin, dat zij niet slechts dienen voor het betreffende project, maar breed kunnen worden
      toegepast en een blijvend effect hebben in de ontvangende regio;
        - brede bestuurlijke steun hebben in de ontvangende regio;
        - bijdragen aan de formulering of aan de uitvoering van overheidsbeleid in de betreffende regio met betrekking
      tot natuur;
        - concreet in de praktijk een bijdrage leveren aan duurzame bescherming en beheer van natuur;
        - een bijdrage leveren aan de ondersteuning van de overgang naar een pluriforme, democratische rechtsstaat in het
      betrokken land of regio;
        - maximaal ten goede komen aan het ontvangende land en daarbij tevens rekening houden met de inbreng en de belangen
      van Nederland.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel5
  - number: '6'
    text: 'Voor subsidieverlening komen in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel6
  - number: 6.a
    text: |-
      privaatrechtelijke rechtspersonen waarvan de doelstelling past binnen het doel van de subsidieverlening en die ten
      genoege van de minister kunnen aantonen dat zij daartoe in meerdere landen of regio's, genoemd in het Actieplan
      Natuurbeheer Midden- en Oost-Europa 2001-2004, activiteiten ontplooien;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel6
  - number: 6.b
    text: rechtspersonen naar Nederlands publiekrecht.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel6
  - number: '7.1'
    text: 'Subsidie op basis van dit besluit kan worden verleend voor de volgende met het project verband houdende kosten:'
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel7
  - number: 7.1.a
    text: kosten van materialen of hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel7
  - number: 7.1.b
    text: kosten voor de verwerving en inrichting van terreinen;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel7
  - number: 7.1.c
    text: loonkosten van het betrokken personeel in dienst van de subsidieontvanger;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel7
  - number: 7.1.d
    text: kosten voor de uitvoering door derden;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel7
  - number: 7.1.e
    text: plankosten en andere voorbereidingskosten tot een maximum van 25% van de subsidiabele kosten;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel7
  - number: 7.1.f
    text: reis- en verblijfkosten;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel7
  - number: 7.1.g
    text: kosten voor tolken en vertalers;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel7
  - number: 7.1.h
    text: kosten voor de voor de vaststelling van de subsidie benodigde accountantsverklaring tot een maximum van € 1800,-.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel7
  - number: '7.2'
    text: |-
      De subsidie kan worden verhoogd met een opslag voor algemene kosten, van ten hoogste 7,5% van de in het eerste lid
      genoemde kosten.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel7
  - number: '8.1'
    text: |-
      In afwijking van [artikel 7, eerste lid][ref1], kan subsidie worden verleend op basis van een door de minister goed
      te keuren dagtarief.


      [ref1]: https://wetten.overheid.nl/BWBR0012533#Artikel7
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012533
        artikel: '7'
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Ingeval subsidie wordt verleend op basis van een dagtarief, is [artikel 7, tweede lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012533#Artikel7
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012533
        artikel: '7'
        paragraaf: '1'
  - number: '9.1'
    text: |-
      De subsidie bedraagt 100% van de in de [artikelen 7][ref1] dan wel 8 bedoelde kosten, met een maximum van €
      680.670,32.


      [ref1]: https://wetten.overheid.nl/BWBR0012533#Artikel7
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012533
        artikel: '7'
        paragraaf: '1'
  - number: '9.2'
    text: De subsidie voor projecten met een looptijd van langer dan één jaar bedraagt maximaal € 226.890,10 per jaar.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel9
  - number: '10'
    text: 'Geen subsidie wordt verleend voor:'
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel10
  - number: 10.a
    text: projecten die een looptijd hebben van meer dan drie jaar;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel10
  - number: 10.b
    text: projecten waarvan de subsidiabele kosten minder dan € 22.689,01 bedragen;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel10
  - number: 10.c
    text: |-
      projecten met de uitvoering waarvan een aanvang is gemaakt alvorens de ontvangst van de aanvraag tot
      subsidieverlening schriftelijk aan de aanvrager is bevestigd;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel10
  - number: 10.d
    text: de leverantie van uitsluitend materialen of goederen;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel10
  - number: 10.e
    text: infrastructurele of bouwactiviteiten;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel10
  - number: 10.f
    text: studiebeurzen of louter wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel10
  - number: '11.1'
    text: |-
      Indien voor het project waarvoor op grond van dit besluit subsidie is verleend, andere subsidies door de
      rijksoverheid worden verstrekt, wordt slechts een zodanig bedrag op grond van dit besluit verstrekt, dat de som van
      de subsidies het in [artikel 9, eerste lid][ref1], genoemde percentage niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0012533#Artikel9
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012533
        artikel: '9'
        paragraaf: '1'
  - number: '11.2'
    text: |-
      Indien voor het project waarvoor op grond van dit besluit subsidie is verleend, subsidies door anderen dan de
      rijksoverheid of financiële middelen door niet-bestuursorganen worden verstrekt, wordt slechts een zodanig bedrag
      op grond van dit besluit verstrekt, dat de som van de subsidies of de financiële middelen niet meer bedraagt dan
      100% van de totale kosten van het project.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel11
  - number: '12.1'
    text: |-
      De minister kan per kalenderjaar één of meer aanvraagperioden vaststellen en geeft van de besluiten daartoe kennis
      in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel12
  - number: '12.2'
    text: |-
      Aanvragen tot subsidieverlening voor het jaar 2001 kunnen worden ingediend in de periode van 8 juni tot 7 juli
      2001.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel12
  - number: '13'
    text: |-
      Een aanvraag tot subsidieverlening wordt in de Nederlandse of de Engelse taal gericht aan de minister en ingediend
      bij Dienst Regelingen op een daartoe vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel13
  - number: 13a.1
    text: |-
      In aanvulling op [artikel 6, tweede lid, van de Kaderregeling subsidiëring natuurprojecten][ref1] bevat het
      projectplan:


      [ref1]: https://wetten.overheid.nl/BWBR0009851#Artikel6
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0009851
        artikel: '6'
  - number: 13a.1.a
    text: een overzicht van door derden toegezegde bijdragen aan het project;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel13a
  - number: 13a.1.b
    text: |-
      een communicatieplan waarin wordt aangegeven: - op welke wijze met de belanghebbenden bij het project wordt
      gecommuniceerd over de inhoud, de voortgang en de resultaten van het project, en
        - op welke wijze een breder publiek wordt geïnformeerd over de resultaten en mogelijke gevolgen van het project.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel13a
  - number: 13a.2
    text: |-
      Het projectplan en de overige in het eerste lid genoemde bescheiden worden in de Nederlandse of de Engelse taal
      opgesteld.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel13a
  - number: '14.1'
    text: |-
      De minister rangschikt de aanvragen die voor subsidie in aanmerking komen zodanig dat een project hoger
      gerangschikt wordt naarmate dat project:
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel14
  - number: 14.1.a
    text: meer bijdraagt aan de verwezenlijking van de doelstelling bedoeld in artikel 4, eerste lid;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel14
  - number: 14.1.b
    text: meer aansluit bij de in artikel 4, tweede lid, genoemde thema's;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel14
  - number: 14.1.c
    text: meer voldoet aan de in artikel 5 genoemde beoordelingsmaatstaven.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel14
  - number: '14.2'
    text: |-
      De minister kan bij de rangschikking van de aanvragen tevens rekening houden met een gewenste evenwichtige
      spreiding van de middelen over de thema's, regio's en landen, gebaseerd op de prioriteitstelling in het Actieplan
      Natuurbeheer Midden- en Oost-Europa 2001-2004.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel14
  - number: '14.3'
    text: |-
      De minister kan nader bepalen dat bij de in het eerste lid bedoelde rangschikking één of meer van de in artikel
      4, tweede lid, genoemde thema's en van de in artikel 5, eerste lid, onderdeel a, bedoelde regio's en landen hoger
      gerangschikt worden.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel14
  - number: '14.4'
    text: De minister geeft van het in het derde lid genoemde besluit kennis in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel14
  - number: 14a
    text: |-
      In afwijking van [artikel 7, eerste lid, van de Kaderregeling subsidiëring natuurprojecten][ref1] geeft
      de minister een beschikking omtrent subsidieverlening binnen vier maanden na afloop van de desbetreffende
      aanvraagperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0009851#Artikel7
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0009851
        artikel: '7'
  - number: '15'
    text: |-
      Subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '16'
    text: |-
      De subsidieontvanger voert een administratie die zodanig is ingericht dat daaruit te allen tijde op een eenvoudige
      wijze alle kosten van het project kunnen worden afgelezen, gespecificeerd overeenkomstig de in [artikel 7][ref1]
      onderscheiden kostenposten.


      [ref1]: https://wetten.overheid.nl/BWBR0012533#Artikel7
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012533
        artikel: '7'
        paragraaf: '1'
  - number: '17'
    text: |-
      Indien de projectduur langer is dan één jaar, rapporteert de subsidieontvanger jaarlijks in de vorm van een
      tussenverslag in de Nederlandse of Engelse taal omtrent de voortgang van het project, welk verslag wordt ingediend
      bij Dienst Regelingen en ten minste bestaat uit een beschrijving van:
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel17
  - number: 17.a
    text: de activiteiten die tot dan toe in het kader van het project zijn verricht;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel17
  - number: 17.b
    text: de mate waarin deze activiteiten hebben bijgedragen aan de in het projectplan omschreven doelstellingen;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel17
  - number: 17.c
    text: een specificatie van de gemaakte subsidiabele en niet-subsidiabele projectkosten voorzien van betaaldata;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel17
  - number: 17.d
    text: eventuele problemen die gerezen zijn;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel17
  - number: 17.e
    text: de perspectieven voor het verdere verloop van het project.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel17
  - number: '18.1'
    text: |-
      De subsidieontvanger voert het project uit overeenkomstig het projectplan, behoudens door de minister goedgekeurde
      wijzigingen van het projectplan.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel18
  - number: '18.2'
    text: |-
      De minister kan aan Dienst Regelingen gemelde wijzigingen van het projectplan goedkeuren. Deze goedkeuring
      wordt niet verleend voor zover het wijzigingen ten aanzien van de doelstelling betreft. De minister deelt de
      subsidieontvanger mede of en in welke mate de wijziging van het projectplan gevolgen heeft voor de verleende
      subsidie of voor de bij de verlening van de subsidie vastgestelde verplichtingen. De wijziging heeft geen verhoging
      tot gevolg voor het bedrag van de subsidie of het bedrag waarop de subsidie overeenkomstig de beschikking tot
      subsidieverlening ten hoogste kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel18
  - number: 18a
    text: |-
      De subsidieontvanger is verplicht om binnen twaalf maanden na dagtekening van de beschikking tot subsidieverlening
      te beginnen met de uitvoering van het project en het project binnen drie jaar na aanvang van de uitvoering te
      voltooien, met dien verstande dat het project uiterlijk op 31 mei 2006 gereed is.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel18a
  - number: 18b.1
    text: |-
      In de gevallen, genoemd in [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], is de
      subsidieontvanger een vergoeding voor vermogensvorming verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 18b.2
    text: |-
      Bij de bepaling van de hoogte van de vergoeding, bedoeld in het eerste lid, wordt uitgegaan van de waarde van
      de met de subsidie verkregen eigendommen en andere vermogensbestanddelen op het tijdstip waarop de financiële
      vergoeding verschuldigd wordt met dien verstande dat, in geval van ontvangst van schadevergoeding voor verlies
      of beschadiging van eigendommen, wordt uitgegaan van het bedrag dat de instelling als schadevergoeding ontvangt.
      Indien het een onroerend goed betreft, geschiedt de waardebepaling door een onafhankelijke deskundige.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel18b
  - number: 18b.3
    text: |-
      Toepassing van het eerste lid blijft achterwege, indien het project, na toestemming door de minister, door
      een andere rechtspersoon wordt voortgezet en de activa om niet aan die andere rechtspersoon in eigendom zijn
      overgedragen.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel18b
  - number: 18b.4
    text: |-
      Toepassing van het eerste lid blijft eveneens achterwege, indien bij de subsidievaststelling ten genoegen van de
      minister wordt aangetoond dat de met het project ontwikkelde activiteiten na de subsidievaststelling tenminste drie
      jaar worden voortgezet door de subsidieontvanger of, na toestemming door de minister, door een andere rechtspersoon
      en de activa om niet aan die andere rechtspersoon in eigendom zijn overgedragen.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel18b
  - number: '19.1'
    text: |-
      Een aanvraag tot subsidievaststelling wordt in de Nederlandse of de Engelse taal gericht aan de minister en binnen
      twee maanden na afloop van het project ingediend bij Dienst Regelingen op een daartoe vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel19
  - number: '19.2'
    text: |-
      Onverminderd het bepaalde in [artikel 11 van de Kaderregeling subsidiëring natuurprojecten][ref1] gaat de in het
      eerste lid bedoelde aanvraag vergezeld van een eindrapportage. Deze rapportage, opgesteld in de Nederlandse of
      Engelse taal, bestaat ten minste uit een beschrijving van:


      [ref1]: https://wetten.overheid.nl/BWBR0009851#Artikel11
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009851
        artikel: '11'
  - number: 19.2.a
    text: de activiteiten die in het kader van het project zijn verricht;
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel19
  - number: 19.2.b
    text: de mate waarin deze activiteiten hebben bijgedragen aan de in het projectplan omschreven doelstellingen en
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel19
  - number: 19.2.c
    text: het financiële verloop van het project.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel19
  - number: '19.3'
    text: |-
      De accountant, bedoeld in [artikel 11, eerste lid, van de Kaderregeling subsidiëring natuurprojecten][ref1],
      controleert de aanvraag tot subsidievaststelling met inachtneming van het in de bijlage bij dit besluit opgenomen
      controleprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0009851#Artikel11
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009851
        artikel: '11'
  - number: '19.4'
    text: |-
      De minister kan de Accountantsdienst van het Ministerie van Landbouw, Natuurbeheer en Visserij een review laten
      uitvoeren op de door de accountant van de aanvrager verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel19
  - number: '20'
    text: Dit besluit treedt in werking op 8 juni 2001.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel20
  - number: '21'
    text: |-
      Binnen vijf jaar na inwerkingtreding van dit besluit publiceert de minister een verslag over de doeltreffendheid en
      de effecten van de subsidie in de praktijk.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel21
  - number: '22.1'
    text: Het Besluit natuurbeheer Midden- en Oost-Europa wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel22
  - number: '22.2'
    text: Het in het eerste lid bedoelde besluit blijft van toepassing op op grond daarvan verleende subsidies.
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel22
  - number: '23'
    text: 'Dit besluit wordt aangehaald als: Besluit natuurbeheer Midden- en Oost-Europa 2001.'
    url: https://wetten.overheid.nl/BWBR0012533/2005-01-01#Artikel23
