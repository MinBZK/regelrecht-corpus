    text: |-
      voor zover tot de functie werkzaamheden behoren waarvoor op grond van [artikel 36, tweede lid][ref1],
      bekwaamheidseisen zijn vastgesteld, in het bezit is van een getuigschrift, afgegeven krachtens de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], dat is voldaan aan die eisen, of


