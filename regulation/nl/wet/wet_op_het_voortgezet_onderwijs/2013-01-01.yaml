preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter verkrijging van een samenhangend geheel van
    onderwijsvoorzieningen het voortgezet onderwijs in een wet te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder: «Onze Minister»: Onze Minister van Onderwijs, Cultuur en Wetenschap en, voor wat betreft
      het landbouwonderwijs, Onze Minister van Landbouw, Natuur en Voedselkwaliteit. «de inspectie»: de inspectie,
      bedoeld in de [Wet op het onderwijstoezicht][ref1]; «voortgezet onderwijs»: het voortgezet onderwijs, bedoeld
      in [artikel 2][ref2] «school»: een school voor voortgezet onderwijs, tenzij het tegendeel blijkt; «openbare
      school»: a. een school in stand gehouden door een gemeente, dan wel door een openbaar lichaam, ingesteld bij
      een gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref3], waarin deelnemen
      een of meer gemeenten, al dan niet te zamen met een of meer privaatrechtelijke rechtspersonen met volledige
      rechtsbevoegdheid; b. een door een openbare rechtspersoon als bedoeld in [artikel 42a][ref4] in stand gehouden
      school; c. een door een stichting als bedoeld in [artikel 42b][ref5] of [artikel 53c][ref6] in stand gehouden
      school; «bijzondere school»: een door een natuurlijke persoon of door een privaatrechtelijke rechtspersoon, niet
      zijnde een stichting als bedoeld in [artikel 42b][ref7], in stand gehouden school; «openbare rechtspersoon»:
      een rechtspersoon die krachtens publiekrecht is ingesteld als bedoeld in [artikel 42a][ref8]; «het bevoegd
      gezag» : voor wat betreft: a. een openbare school: 1°. het college van burgemeester en wethouders, voor
      zover de raad niet anders bepaalt, en, indien de raad dit besluit, met inachtneming van door hem te stellen
      regelen; 2°. het krachtens de desbetreffende gemeenschappelijke regeling bevoegde orgaan; 3°. de openbare
      rechtspersoon, bedoeld in [artikel 42a][ref9]; dan wel 4°. de stichting, bedoeld in [artikel 42b][ref10] of
      [artikel 53c][ref11]; b. een bijzondere school: de rechtspersoon, bedoeld in [artikel 49, eerste lid][ref12];
      c. een samenwerkingsschool als bedoeld in [artikel 53d][ref13]: het bestuur van de samenwerkingsschool,
      bedoeld in dat artikel; «regionaal opleidingencentrum»: een regionaal opleidingencentrum als bedoeld
      in [artikel 1.3.1 van de Wet educatie en beroepsonderwijs][ref14]; «agrarisch opleidingscentrum»: een
      agrarisch opleidingscentrum als bedoeld in [artikel 1.3.3 van de Wet educatie en beroepsonderwijs][ref15];
      «persoonsgebonden nummer»: het burgerservicenummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref16], dan wel het door Onze Minister
      uitgegeven onderwijsnummer, bedoeld in [artikel 27b, vierde lid][ref17]; sociaal-fiscaalnummer: het sociaal-
      fiscaalnummer, bedoeld in [artikel 2, derde lid, onder k, van de Algemene wet inzake rijksbelastingen][ref18];
      «contractactiviteiten»: activiteiten als bedoeld in [artikel 20, tweede lid][ref19]; «personeel»: a. de benoemde
      rector, directeur, conrector, adjunct-directeur of leraar, en overig personeel benoemd in een andere functie
      dan het geven van onderwijs, waaronder begrepen de leden van het bestuur van die scholen die zijn benoemd door
      een raad van toezicht als bedoeld in [artikel 24e1, derde lid][ref20], voor zover die leden mede zijn benoemd
      op basis van een arbeidsovereenkomst of een akte van aanstelling; b. het onder a bedoelde personeel dat zonder
      benoeming is tewerkgesteld, tenzij het betreft de toepassing van de artikelen [38a tot en met 39a][ref21],
      [40a][ref22], [43a, eerste en tweede lid][ref23], [51, eerste tot en met derde lid][ref24], [52][ref25],
      [52a][ref26], [53][ref27], [53b][ref28] en [96o][ref29], voor zover niet anders is bepaald, en de toepassing
      van daarmee verband houdende wettelijke bepalingen; «nascholing»: een vorm van scholing, gegeven aan leden
      van het personeel om hun kennis, inzicht, vaardigheden en beroepshoudingen direct verband houdend met de
      uitoefening van hun beroep, voortbouwend op de in de initiële opleiding verworven aanvangsbekwaamheid te
      verdiepen en uit te breiden; «leerlinggebonden budget»: een leerlinggebonden budget voor een leerling als
      bedoeld in [artikel 77a][ref30]; «kerndoelen»: de op grond van [artikel 11b][ref31] vastgestelde na te
      streven inhoudelijke doelstellingen voor het onderwijsprogramma voor de eerste twee leerjaren, bedoeld
      in [artikel 11c][ref32], gericht op het verwerven door leerlingen van kennis, inzicht en vaardigheden;
      maatschappelijke stage: stage gericht op het verwerven van vaardigheden ten behoeve van het functioneren
      in de maatschappij, bestaande uit onbezoldigde vrijwilligersactiviteiten, niet zijnde de stage bedoeld in
      [artikel 22, derde lid, onderdeel d][ref33]; meldingsregister relatief verzuim: meldingsregister relatief verzuim
      als bedoeld in [artikel 24h van de Wet op het onderwijstoezicht][ref34]; «College voor examens»: College voor
      examens als bedoeld in [artikel 2, eerste lid, van de Wet College voor examens][ref35].


