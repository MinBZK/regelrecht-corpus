  - number: 23a
    text: |-
      Het bevoegd gezag draagt zorg voor de kwaliteit van het onderwijs op de school. Onder zorg dragen voor de kwaliteit
      van het onderwijs wordt in elk geval verstaan: de zorg voor het personeelsbeleid, voor zover het betreft de
      duurzame borging van de kwaliteit van het onderwijspersoneel, en het uitvoeren van het in het schoolplan, bedoeld
      in [artikel 24][ref1], beschreven beleid op een zodanige wijze dat de wettelijke opdrachten voor het onderwijs en
      de door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs, worden gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 23a1.1
    text: |-
      Het bevoegd gezag voldoet in elk geval niet aan de wettelijke opdrachten voor het onderwijs, bedoeld in
      [artikel 23a][ref1], indien de leerresultaten van het voorbereidend wetenschappelijk onderwijs, het hoger
      algemeen voortgezet onderwijs, het middelbaar algemeen voortgezet onderwijs, het voorbereidend beroepsonderwijs,
      het voorbereidend middelbaar beroepsonderwijs in de theoretische leerweg en de gemengde leerweg, het
      voorbereidend middelbaar beroepsonderwijs in de basisberoepsgerichte leerweg dan wel het voorbereidend middelbaar
      beroepsonderwijs in de kaderberoepsgerichte leerweg ernstig of langdurig tekortschieten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel23a1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 23a1.2
    text: 'Er is sprake van onvoldoende leerresultaten als bedoeld in het eerste lid indien:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel23a1
  - number: 23a1.2.a
    text: |-
      in de schoolsoort dan wel de leerweg, bedoeld in het eerste lid, de gemiddelde eindexamenresultaten en het
      doorstroomrendement, gemeten over een periode van 3 schooljaren, liggen onder de normering die daarvoor geldt in
      vergelijking tot die leerresultaten over diezelfde schooljaren van dezelfde schoolsoorten of dezelfde leerwegen met
      een vergelijkbaar leerlingenbestand; dan wel
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel23a1
  - number: 23a1.2.b
    text: geen leerresultaten van de schoolsoort of de leerweg, bedoeld in het eerste lid, kunnen worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel23a1
  - number: 23a1.3
    text: |-
      Er is sprake van ernstig of langdurig tekortschieten van de leerresultaten als bedoeld in het
      eerste lid indien de inspectie op grond van [artikel 14 van de Wet op het onderwijstoezicht][ref1]
      Onze Minister meedeelt dat uit het onderzoek naar de kwaliteitsverbeteringen, bedoeld in
      [artikel 11, derde lid, van de Wet op het onderwijstoezicht][ref2] blijkt dat sprake is van onvoldoende
      verbeteringen dan wel het bevoegd gezag niet bereid is afspraken te maken over kwaliteitsverbeteringen naar
      aanleiding van het onderzoek, bedoeld in artikel 11, tweede lid, van de Wet op het onderwijstoezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel11
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel23a1
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '11'
  - number: 23a1.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop
      leerresultaten worden gemeten en, indien zij niet gemeten kunnen worden of indien er onvoldoende gegevens zijn voor
      een betrouwbaar oordeel over de meting van de leerresultaten, op welke andere wijze zij worden aangetoond. Voorts
      wordt de normering, bedoeld in het tweede lid, bepaald en de aard en het aantal van de gegevens die ten minste
      beschikbaar moeten zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel23a1
  - number: 23a1.5
    text: |-
      De voordracht voor een krachtens het vierde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel23a1
  - number: 23b
    text: |-
      Het bevoegd gezag rapporteert over de vorderingen van de leerlingen aan hun ouders, voogden of verzorgers, dan wel
      aan de leerlingen zelf indien zij meerderjarig en handelingsbekwaam zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel23b
  - number: 23c.1
    text: |-
      Indien de inspectie op basis van een onderzoek als bedoeld in [artikel 11][ref1] of
      [artikel 15 van de Wet op het onderwijstoezicht][ref2], in het inspectierapport, bedoeld in
      [artikel 20 van genoemde wet][ref3], tot het oordeel is gekomen dat sprake is van een zeer zwakke school,
      informeert het bevoegd gezag de ouders van de leerlingen van de school hierover door middel van in ieder geval
      de toezending van de door de inspectie opgestelde samenvatting van het inspectierapport welke samenvatting
      gelijktijdig met het inspectierapport ter beschikking is gesteld van het bevoegd gezag. De toezending, bedoeld in
      de eerste volzin, geschiedt binnen vier weken na de vaststelling van het inspectierapport.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '20'
  - number: 23c.2
    text: |-
      Indien het bevoegd gezag niet of niet tijdig voldoet aan de verplichting, bedoeld in het eerste lid, zendt Onze
      Minister de samenvatting van het inspectierapport, bedoeld in het eerste lid, in de vijfde week na vaststelling van
      het inspectie rapport aan de ouders van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel23c
  - number: '24.1'
    text: |-
      Het schoolplan bevat een beschrijving van het beleid met betrekking tot de kwaliteit van het onderwijs dat binnen
      de school wordt gevoerd, en omvat in elk geval het onderwijskundig beleid, het personeelsbeleid en het beleid met
      betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs. Het schoolplan omvat mede het beleid
      ten aanzien van de aanvaarding van materiële bijdragen of geldelijke bijdragen, niet zijnde ouderbijdragen of op
      de onderwijswetgeving gebaseerde bijdragen, indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee
      de leerlingen binnen de schooltijden en tijdens de activiteiten die worden georganiseerd onder verantwoordelijkheid
      van het bevoegd gezag, alsmede tijdens het overblijven, zullen worden geconfronteerd. In het schoolplan wordt
      aangegeven op welke wijze invulling wordt gegeven aan het openbare karakter onderscheidenlijk de identiteit voor
      zover het betreft een samenwerkingsschool. Het schoolplan kan op een of meer scholen voor voortgezet onderwijs en
      een of meer scholen voor ander onderwijs van hetzelfde bevoegd gezag betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24
  - number: '24.2'
    text: |-
      Het onderwijskundig beleid omvat in elk geval de uitwerking van de wettelijke opdrachten voor het onderwijs
      en van de door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs in een
      onderwijsprogramma. Daarbij worden tevens betrokken de voorzieningen die zijn getroffen voor leerlingen met
      specifieke onderwijsbehoeften en voor leerlingen voor wie een leerlinggebonden budget beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24
  - number: '24.3'
    text: |-
      Het personeelsbeleid, voor zover dat in het schoolplan tot uitdrukking wordt gebracht, omvat in elk geval
      maatregelen met betrekking tot het personeel die bijdragen aan de ontwikkeling en de uitvoering van het
      onderwijskundig beleid alsmede het document inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding,
      bedoeld in [artikel 32d][ref1] van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32d
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 32d
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '24.4'
    text: 'Het beleid met betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24
  - number: 24.4.a
    text: de wijze waarop het bevoegd gezag bewaakt dat die kwaliteit wordt gerealiseerd,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24
  - number: 24.4.b
    text: de wijze waarop het bevoegd gezag vaststelt welke maatregelen ter verbetering van de kwaliteit nodig zijn, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24
  - number: 24.4.c
    text: maatregelen en instrumenten om te waarborgen dat het personeel zijn bekwaamheid onderhoudt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24
  - number: '24.5'
    text: |-
      Onze Minister kan scholen voor voorbereidend beroepsonderwijs of afdelingen daarvan aanwijzen, waarvan de
      schoolplannen met zijn toestemming mogen afwijken van de in dit artikel gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24
  - number: 24a.1
    text: |-
      De schoolgids bevat voor ouders, voogden, verzorgers en leerlingen informatie over de werkwijze van de school en
      bevat in elk geval informatie over:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
  - number: 24a.1.a
    text: |-
      de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, waaronder, in ieder
      geval met betrekking tot het schooljaar voorafgaande aan het schooljaar waarin de schoolgids wordt vastgesteld en
      onderscheiden naar soort onderwijs, voor elk leerjaar
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
  - number: 24a.1.a.1°
    text: het percentage leerlingen dat doorstroomt naar een hoger leerjaar of een ander soort onderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
  - number: 24a.1.a.2°
    text: |-
      het percentage leerlingen dat de school zonder diploma verlaat en het percentage leerlingen dat voor het eindexamen
      slaagt,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
  - number: 24a.1.b
    text: |-
      de wijze waarop aan de zorg voor leerlingen met specifieke onderwijsbehoeften en voor leerlingen voor wie een
      leerlinggebonden budget beschikbaar is, wordt vormgegeven
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
  - number: 24a.1.c
    text: |-
      de wijze waarop de verplichte onderwijstijd wordt benut, de inrichting van het onderwijsprogramma voor de eerste
      twee leerjaren waarbij wordt aangegeven of sprake is van vakoverstijgende programmaonderdelen en de inzet van het
      personeel daarbij alsmede de invulling van de maatschappelijke stage, bedoeld in [artikel 6f][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6f
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 24a.1.d
    text: |-
      de geldelijke bijdrage, bedoeld in [artikel 27, tweede lid][ref1], waarbij wordt vermeld dat deze vrijwillig is,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 24a.1.e
    text: |-
      de rechten en plichten van de ouders, de voogden, de verzorgers, de leerlingen en het bevoegd gezag, waaronder
      de informatie over de klachtenregeling, bedoeld in [artikel 24b][ref1], waarbij wat betreft de leerlingen
      kan worden volstaan met vermelding van de rechten en plichten opgenomen in het leerlingenstatuut, bedoeld in
      [artikel 24g][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel24g
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 24b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 24g
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 24a.1.f
    text: |-
      de wijze waarop het bevoegd gezag omgaat met de in [artikel 24, eerste lid][ref1], omschreven bijdragen,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 24a.1.g
    text: het beleid met betrekking tot de veiligheid, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
  - number: 24a.1.h
    text: het verzuimbeleid,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
  - number: 24a.1.h
    text: |-
      de wijze waarop invulling wordt gegeven aan het openbare karakter onderscheidenlijk de identiteit voor zover het
      betreft een samenwerkingsschool.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
  - number: 24a.2
    text: Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven met betrekking tot de wijze waarop
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
  - number: 24a.2.a
    text: de resultaten worden beschreven die met het onderwijs worden bereikt, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
  - number: 24a.2.b
    text: de context wordt vermeld waarin de onder a bedoelde resultaten dienen te worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
  - number: 24a.3
    text: |-
      Het bevoegd gezag reikt de schoolgids uit aan de ouders, voogden, verzorgers dan wel de meerderjarige en
      handelingsbekwame leerling bij de inschrijving en jaarlijks na de vaststelling van de schoolgids.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
  - number: 24a.4
    text: |-
      De algemene maatregel van bestuur, bedoeld in het tweede lid, wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een der kamers de wens te kennen wordt gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24a
  - number: 24b.1
    text: |-
      Ouders, voogden, verzorgers dan wel leerlingen, en personeelsleden kunnen bij de klachtencommissie, bedoeld in
      het tweede lid, onderdeel a, een klacht indienen over gedragingen en beslissingen van het bevoegd gezag of het
      personeel, waaronder discriminatie, dan wel het nalaten van gedragingen en het niet nemen van beslissingen door het
      bevoegd gezag of het personeel.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24b.2
    text: 'Het bevoegd gezag treft een regeling voor de behandeling van klachten. Deze regeling vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24b.2.a
    text: de instelling van een klachtencommissie, die klachten behandelt,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24b.2.b
    text: de wijze waarop de klachtencommissie haar werkzaamheden verricht,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24b.2.c
    text: de termijn waarbinnen de klager een klacht kan indienen en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24b.2.d
    text: |-
      de termijn waarbinnen mededeling plaatsvindt van het oordeel, bedoeld in het zesde lid, en hoe bij noodzakelijke
      afwijking van deze termijn wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24b.3
    text: |-
      Deze regeling strekt ter vervanging van klachtenregelingen op grond van andere voorschriften dan dit artikel en
      strekt niet ter vervanging van een andere voorziening die op grond van een wettelijke regeling, niet zijnde een
      klachtenregeling, voor de klager openstaat of heeft opengestaan.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24b.4
    text: Deze regeling
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24b.4.a
    text: |-
      voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit ten minste drie leden,
      waaronder een voorzitter die geen deel uitmaakt van het bevoegd gezag en niet werkzaam is voor of bij het bevoegd
      gezag, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24b.4.b
    text: |-
      waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24b.5
    text: 'De klager en degene over wie is geklaagd krijgen de gelegenheid:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24b.5.a
    text: hun zienswijze mondeling of schriftelijk toe te lichten en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24b.5.b
    text: zich bij de behandeling van de klacht te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24b.6
    text: |-
      De klachtencommissie vormt zich een oordeel over de gegrondheid van de klacht en deelt dit oordeel, al dan niet
      vergezeld van aanbevelingen, schriftelijk mede aan de klager, degene over wie is geklaagd en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24b.7
    text: |-
      Het bevoegd gezag deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onderdeel a, binnen 4 weken
      na ontvangst van het in het zesde lid bedoelde oordeel van de klachtencommissie schriftelijk mede of hij het
      oordeel over de gegrondheid van de klacht deelt en of hij naar aanleiding van dat oordeel maatregelen zal nemen en
      zo ja welke. Bij afwijking van de in de eerste volzin bedoelde termijn, doet het bevoegd gezag daarvan met redenen
      omkleed mededeling aan de klager en de klachtencommissie onder vermelding van de termijn waarbinnen het bevoegd
      gezag zijn standpunt bekend zal maken.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24b.8
    text: |-
      Degene die betrokken is bij de uitvoering van dit artikel en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, is verplicht tot geheimhouding daarvan,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24b.9
    text: |-
      Gegevens die betrekking hebben op een klacht worden bewaard op een plaats die uitsluitend toegankelijk is voor de
      leden van de klachtencommissie en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24b
  - number: 24c.1
    text: Het bevoegd gezag stelt ten minste eenmaal in de 4 jaar het schoolplan vast.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24c
  - number: 24c.2
    text: Het bevoegd gezag stelt jaarlijks de schoolgids vast ten behoeve van het eerstvolgende schooljaar.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24c
  - number: 24c.3
    text: |-
      Het bevoegd gezag zendt het schoolplan dan wel de wijzigingen daarvan en de schoolgids onmiddellijk na de
      vaststelling aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24c
  - number: 24d.1
    text: |-
      Het bevoegd gezag draagt mede in verband met de verplichting, bedoeld in [artikel 23a][ref1], zorg voor een goed
      bestuurde school met een scheiding tussen de functies van bestuur en het toezicht daarop, en met een rechtmatig
      bestuur en beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 24d.2
    text: |-
      De benoeming in de functies van het toezicht op het bestuur, bedoeld in het eerste lid, geschiedt op basis
      van vooraf openbaar gemaakte profielen. Bij de benoeming van de leden van de raad van toezicht wordt de
      medezeggenschapsraad van de school, bedoeld in [artikel 3 van de Wet medezeggenschap op scholen][ref1], in de
      gelegenheid gesteld een bindende voordracht te doen voor een lid. Bij de benoeming van de leden van de raad van
      toezicht wordt de ondersteuningsplanraad, bedoeld in [artikel 4a van de Wet medezeggenschap op scholen][ref2], in
      de gelegenheid gesteld een bindende voordracht te doen voor een lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24d
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: 4a
  - number: 24d.3
    text: Het eerste lid en het tweede lid, eerste volzin, zijn van overeenkomstige toepassing op een samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24d
  - number: 24e.1
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de functies van bestuur en intern toezicht op het bestuur in functionele
      of organieke zin zijn gescheiden.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24e
  - number: 24e.2
    text: |-
      Een intern toezichthouder of een lid van het interne toezichthoudend orgaan functioneert onafhankelijk van het
      bestuur.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24e
  - number: 24e.3
    text: Dit artikel is van overeenkomstige toepassing op een samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24e
  - number: 24e1.1
    text: |-
      De interne toezichthouder of het interne toezichthoudend orgaan houdt toezicht op de uitvoering van de taken en de
      uitoefening van de bevoegdheden door het bestuur en staat het bestuur met raad terzijde. De toezichthouder of het
      toezichthoudend orgaan is ten minste belast met:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24e1
  - number: 24e1.1.a
    text: |-
      het goedkeuren van de begroting en het jaarverslag en, indien van toepassing, het strategisch meerjarenplan van
      de school;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24e1
  - number: 24e1.1.b
    text: |-
      het toezien op de naleving door het bestuur van wettelijke verplichtingen, de code voor goed bestuur, bedoeld in
      [artikel 103, eerste lid, onderdeel a][ref1], en de afwijkingen van die code;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24e1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '103'
        hoofdstuk: IV
        afdeling: II
  - number: 24e1.1.c
    text: |-
      het toezien op de rechtmatige verwerving en de doelmatige en rechtmatige bestemming en aanwending van de middelen
      van de school verkregen op grond van deze wet;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24e1
  - number: 24e1.1.d
    text: |-
      het aanwijzen van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] die verslag uitbrengt aan de toezichthouder
      of het toezichthoudend orgaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24e1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 24e1.1.e
    text: |-
      het jaarlijks afleggen van verantwoording over de uitvoering van de taken en de uitoefening van de bevoegdheden,
      bedoeld onder a tot en met d, in het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24e1
  - number: 24e1.2
    text: |-
      De taken en bevoegdheden van de interne toezichthouder of het interne toezichthoudend orgaan zijn zodanig dat hij
      een deugdelijk en onafhankelijk intern toezicht kan uitoefenen. Indien sprake is van meer dan een toezichthouder of
      van een toezichthoudend orgaan is de eerste volzin van overeenkomstige toepassing met betrekking tot de combinatie
      van de toezichthouders of de samenstelling van het toezichthoudend orgaan.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24e1
  - number: 24e1.3
    text: |-
      Indien het intern toezicht wordt uitgeoefend door een raad van toezicht, zijn het eerste lid en het tweede lid van
      overeenkomstige toepassing ten aanzien van de raad van toezicht. Een raad van toezicht is tevens belast met het
      benoemen, schorsen en ontslaan van de leden van het bestuur, alsmede de toepassing van de [artikelen 38a][ref1],
      [39][ref2], [39a][ref3], [40a][ref4], [43a][ref5], [51][ref6], [52][ref7] en de daarmee verband houdende wettelijke
      bepalingen op leden van het bestuur die mede tot het personeel behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel38a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel39a
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel40a
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel43a
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel51
      [ref7]: https://wetten.overheid.nl/BWBR0002399#Artikel52
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24e1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 38a
