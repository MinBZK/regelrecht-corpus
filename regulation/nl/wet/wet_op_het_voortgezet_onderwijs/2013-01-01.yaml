  - number: 118t.8
    text: |-
      De voordracht voor de algemene maatregel van bestuur, bedoeld in het tweede lid, wordt niet eerder gedaan dan vier
      weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118t
  - number: '119.1'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel119
  - number: 119.1.a
    text: het militair onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel119
  - number: 119.1.b
    text: |-
      opleidingen ter vergroting der vakbekwaamheid, die uitsluitend worden gegeven binnen overheids- of semi-
      overheidsdiensten en -bedrijven ten behoeve van het eigen personeel.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel119
  - number: '119.2'
    text: |-
      Voor zover bij algemene maatregel van bestuur niet anders wordt bepaald, is deze wet evenmin van toepassing
      op de inrichtingen, bedoeld in de [Penitentiaire beginselenwet][ref1], op de inrichtingen, bedoeld in
      [artikel 1, onder d, van de Beginselenwet verpleging ter beschikking gestelden][ref2], en op de inrichtingen,
      bedoeld in artikel 1, onder b, van de [Beginselenwet justitiële jeugdinrichtingen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009709
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011756
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0009709
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0011756
  - number: '120'
    text: |-
      Bij twijfel of deze wet op een of meer inrichtingen van onderwijs van toepassing is, wordt beslist bij koninklijk
      besluit.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel120
  - number: '122.1'
    text: |-
      Voortgezet onderwijs wordt niet gegeven in lokalen, die door de krachtens de [Gezondheidswet][ref1] bevoegde
      inspecteur van het staatstoezicht op de volksgezondheid zijn afgekeurd als schadelijk voor de gezondheid, gevaar
      opleverende voor de veiligheid of wegens onvoldoende ruimte voor het aantal in die lokalen toegelaten leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002202
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0002202
  - number: '122.2'
    text: |-
      De inspecteur, bedoeld in het eerste lid, zendt zijn besluit tot afkeuring aan burgemeester en wethouders van de
      gemeente waarin het lokaal ligt. Op dezelfde dag doet hij van zijn besluit mededeling aan Onze minister; voorts,
      indien het een uit de openbare kas bekostigde school betreft, aan de inspectie en, indien het een bijzondere school
      betreft, aan het schoolbestuur.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel122
  - number: '122.3'
    text: |-
      Indien de inspecteur, bedoeld in het eerste lid, besluit dat het lokaal voldoende is verbeterd of dat het aantal
      leerlingen voldoende is beperkt, mag het onderwijs worden hervat. Aan hen, die ingevolge het bepaalde in het tweede
      lid van de afkeuring mededeling hebben ontvangen, wordt van dit besluit op gelijke wijze mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel122
  - number: '123.1'
    text: |-
      Hij, die in strijd met het voorschrift van [artikel 122, eerste lid][ref1], onderwijs geeft of doet geven in een
      afgekeurd lokaal, wordt gestraft met geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel122
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '122'
  - number: '123.2'
    text: Het feit, strafbaar gesteld in dit artikel, is een overtreding.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel123
  - number: 123a
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de [artikelen 23a1][ref1] en [109a][ref2], en
      vervolgens telkens na vijf jaar aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van de
      artikelen 23a1 en 109a in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel109a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel123a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23a1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 109a
        afdeling: III
  - number: '124'
    text: 'Deze wet wordt aangehaald als: Wet op het voortgezet onderwijs.'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel124
