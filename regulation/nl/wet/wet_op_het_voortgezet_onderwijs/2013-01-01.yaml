        artikel: 96i
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '84'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref4
        bwb_id: BWBR0002399
