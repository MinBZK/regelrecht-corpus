  - number: '17'
    text: 'Het onderwijs:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel17
  - number: 17.a
    text: gaat er mede van uit dat leerlingen opgroeien in een pluriforme samenleving,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel17
  - number: 17.b
    text: is mede gericht op het bevorderen van actief burgerschap en sociale integratie, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel17
  - number: 17.c
    text: |-
      is er mede op gericht dat leerlingen kennis hebben van en kennismaken met verschillende achtergronden en culturen
      van leeftijdgenoten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel17
  - number: 17a.1
    text: |-
      Het bevoegd gezag van één of meer scholen is voor elke vestiging van die school of scholen aangesloten bij een
      samenwerkingsverband als bedoeld in het tweede lid of bij een landelijk samenwerkingsverband als bedoeld in het
      zestiende lid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel17a
  - number: 17a.2
    text: |-
      Een samenwerkingsverband omvat alle binnen een gebied als bedoeld in het derde lid gelegen vestigingen van
      scholen, scholen voor voortgezet speciaal onderwijs en scholen voor speciaal en voortgezet speciaal onderwijs,
      voor zover daaraan voortgezet speciaal onderwijs wordt verzorgd, behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref1], met uitzondering van de vestigingen waarvoor het bevoegd gezag is aangesloten
      bij een landelijk samenwerkingsverband. Het samenwerkingsverband stelt zich ten doel een samenhangend geheel
      van ondersteuningsvoorzieningen binnen en tussen de scholen, bedoeld in de vorige volzin, te realiseren en wel
      zodanig dat leerlingen een ononderbroken ontwikkelingsproces kunnen doormaken en leerlingen die extra ondersteuning
      behoeven een zo passend mogelijke plaats in het onderwijs krijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 17a.3
    text: Bij ministeriële regeling worden voor de samenwerkingsverbanden aaneengesloten gebieden aangewezen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel17a
  - number: 17a.4
    text: |-
      De bevoegde gezagsorganen van de scholen, bedoeld in het tweede lid, geven het samenwerkingsverband vorm door
      het oprichten van een rechtspersoon met volledige rechtsbevoegdheid zonder winstoogmerk, waarin uitsluitend deze
      bevoegde gezagsorganen deelnemen, behoudens deelname van een bevoegd gezag op grond van het vijfde lid. De statuten
      van de rechtspersoon bevatten een voorziening voor de beslechting van geschillen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel17a
  - number: 17a.5
    text: |-
      Indien het bevoegd gezag van een school voor voortgezet speciaal onderwijs of een school voor speciaal en
      voortgezet speciaal onderwijs, behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref1],
      waarvan de vestiging of vestigingen zijn gelegen buiten het gebied van een samenwerkingsverband, wenst
      deel te nemen aan dit samenwerkingsverband, wordt dit bevoegd gezag niet uitgesloten van deelname aan het
      samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 17a.16
    text: |-
      Bevoegde gezagsorganen van tot dezelfde richting behorende scholen en scholen als bedoeld in de
      [Wet op de expertisecentra][ref1] waaraan voortgezet speciaal onderwijs behorend tot cluster 3 en 4 wordt
      verzorgd, kunnen een landelijk samenwerkingsverband oprichten. Een landelijk samenwerkingsverband omvat alle in
      Nederland gelegen en tot dezelfde richting behorende scholen als bedoeld in de eerste volzin. Op een landelijk
      samenwerkingsverband zijn het tweede tot en met vijftiende lid, met uitzondering van het derde en vijfde lid,
      en het zeventiende lid van overeenkomstige toepassing. Indien een bevoegd gezag scholen heeft met meer dan een
      richting bepaalt het bevoegd gezag eenmalig op basis van welke richting de aansluiting bij het samenwerkingsverband
      plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '18.1'
    text: |-
      Bij het geven van onderwijs aan een leerling die is opgenomen in een ziekenhuis of die in verband met ziekte thuis
      verblijft, kan het bevoegd gezag van een school worden ondersteund.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel18
  - number: '18.2'
    text: 'De ondersteuning bedoeld in het eerste lid wordt verzorgd door:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel18
  - number: 18.2.a
    text: |-
      een educatieve voorziening als bedoeld in
      [artikel 1.4, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek ][ref1]indien de leerling
      is opgenomen in een academisch ziekenhuis of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 18.2.b
    text: |-
      een schoolbegeleidingsdienst als bedoeld in [artikel 180 van de Wet op het primair onderwijs][ref1] en
      [artikel 166 van de Wet op de expertisecentra][ref2] indien de leerling is opgenomen in een ziekenhuis niet zijnde
      een academisch ziekenhuis dan wel indien de leerling in verband met ziekte thuis verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel180
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel166
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '180'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '166'
  - number: '18.3'
    text: |-
      De ondersteuning bedoeld in het eerste lid kan in overeenstemming tussen de educatieve voorziening dan wel de
      schoolbegeleidingsdienst en de school waarbij de leerling is ingeschreven, mede het geven van onderwijs aan de
      leerling betreffen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel18
  - number: '18.4'
    text: |-
      Het Rijk verstrekt aan schoolbegeleidingsdiensten als bedoeld in het tweede lid, onderdeel b, bekostiging voor
      activiteiten die worden verricht met betrekking tot de ondersteuning bij het onderwijs aan zieke leerlingen. Bij
      ministeriële regeling kunnen nadere regels worden gesteld voor de bekostiging, bedoeld in de vorige volzin.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel18
  - number: '18.5'
    text: |-
      Schoolbegeleidingsdiensten als bedoeld in het tweede lid, onderdeel b, zijn de
      schoolbegeleidingsdiensten die voor de ondersteuning bij het onderwijs aan zieke leerlingen, in
      de periode 1 augustus 1999 tot 1 augustus 2004 subsidie ontvingen van een gemeente op grond van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ________________________________________________________________________________________________________________.


      [ref1]: https://wetten.overheid.nl/BWBR0010086#ArtikelIX
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0010086
        artikel: IX
  - number: '19'
    text: |-
      De bij of krachtens deze wet vastgestelde voorschriften ten aanzien van het voorbereidend beroepsonderwijs zijn van
      overeenkomstige toepassing op het voorbereidend beroepsonderwijs dat wordt verzorgd in agrarische opleidingscentra,
      tenzij bij of krachtens algemene maatregel van bestuur is bepaald dat dit niet of gedeeltelijk niet het geval is.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel19
  - number: '20.1'
    text: De scholen voor voortgezet onderwijs zijn dagscholen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel20
  - number: '20.2'
    text: |-
      Aan een school kunnen contractactiviteiten worden verricht, bestaande uit cursussen waarvan de kosten niet ten
      laste van 's Rijks kas komen, en uit werkzaamheden voor eigen rekening ten behoeve van derden, voor zover deze
      cursussen en werkzaamheden verband houden met het onderwijs aan de desbetreffende school en voor zover het belang
      van het onderwijs aan de school door deze cursussen en werkzaamheden niet wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel20
  - number: '21.1'
    text: |-
      De naam van de school duidt aan, tot welke van de soorten van scholen, bedoeld in de [artikelen 7][ref1],
      [8][ref2], [9][ref3], [10a][ref4] en [10f][ref5], de school behoort. Het bevoegd gezag van een school voor
      middelbaar algemeen voortgezet onderwijs, een school voor voorbereidend beroepsonderwijs, of een scholengemeenschap
      waarvan in ieder geval een school voor middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend
      beroepsonderwijs deel uitmaakt, kan voor die school de aanduiding «voorbereidend middelbaar beroepsonderwijs»
      hanteren. Bij verschil van mening tussen het bevoegd gezag en Onze minister, tot welke van de soorten zij behoort,
      beslist Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10a
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel21
