  - number: '21.2'
    text: 'In het maatschappelijk verkeer brengt het bevoegd gezag ondubbelzinnig tot uitdrukking:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel21
  - number: 21.2.a
    text: |-
      welk bij of krachtens deze wet geregeld, uit ’s Rijks kas bekostigd onderwijs de leerlingen volgen en aankomende
      leerlingen kunnen gaan volgen,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel21
  - number: 21.2.b
    text: van welke richting dit onderwijs uitgaat, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel21
  - number: 21.2.c
    text: |-
      in voorkomend geval welk onderwijs de school verzorgt met toepassing van [artikel 20, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel20
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '20'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '22.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor de scholen voor voorbereidend wetenschappelijk
      onderwijs, algemeen voortgezet onderwijs en voorbereidend beroepsonderwijs voorschriften vastgesteld omtrent de
      inrichting van het onderwijs. Deze voorschriften kunnen per schoolsoort verschillen. Voor de scholen, bedoeld in
      de [artikelen 7][ref1], [8][ref2], [9][ref3] en [10a][ref4], kunnen afzonderlijke voorschriften worden gegeven.
      De bij deze algemene maatregel van bestuur gegeven voorschriften zijn niet van toepassing op scholen en afdelingen
      voor voorbereidend beroepsonderwijs waarvoor [artikel 24, vijfde lid][ref5], wordt toegepast. De algemene maatregel
      van bestuur, bedoeld in de eerste volzin, wordt aan de beide Kamers der Staten-Generaal overgelegd. De maatregel
      treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en niet door of namens een van beide
      Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde onderwerp bij de wet wordt geregeld.
      Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10a
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel24
