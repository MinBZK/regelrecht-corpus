  - number: 118h.2
    text: |-
      Voor de vervulling van hun in het eerste lid bedoelde taken werken de colleges van burgemeester en wethouders
      samen binnen bij of krachtens algemene maatregel van bestuur vastgestelde regio's. Zij maken tevens afspraken
      met scholen, instellingen als bedoeld in de [Wet educatie en beroepsonderwijs][ref1], scholen en instellingen als
      bedoeld in de [Wet op de expertisecentra][ref2] en organisaties die zijn betrokken bij het voorkomen en bestrijden
      van voortijdig schoolverlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118h
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0003549
  - number: 118h.3
    text: |-
      De colleges van burgemeester en wethouders in een regio wijzen uit hun midden een contactgemeente aan. Deze
      aanwijzing wordt onverwijld gemeld aan Onze Minister. Burgemeester en wethouders van de contactgemeente vervullen
      coördinerende taken met het oog op het voorkomen en bestrijden van voortijdig schoolverlaten. In dat verband:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118h
  - number: 118h.3.a
    text: |-
      maken zij afspraken met de in het tweede lid bedoelde scholen, instellingen en organisaties over de inzet en
      verantwoordelijkheid bij het voorkomen en bestrijden van voortijdig schoolverlaten;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118h
  - number: 118h.3.b
    text: dragen zij zorg voor de totstandkoming van een regionaal netwerk van die scholen, instellingen en organisaties;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118h
  - number: 118h.3.c
    text: organiseren en coördineren zij de in het eerste lid bedoelde melding, registratie en doorverwijzing.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118h
  - number: 118h.4
    text: |-
      Indien colleges van burgemeester en wethouders in een regio een andere contactgemeente aanwijzen, dragen
      burgemeester en wethouders van de vorige contactgemeente alle bescheiden die betrekking hebben op de uitvoering van
      dit artikel over aan burgemeester en wethouders van de opvolgende contactgemeente. De wijziging van de aanwijzing
      wordt onverwijld gemeld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118h
  - number: 118h.5
    text: |-
      Ter tegemoetkoming in de kosten van uitvoering van het eerste tot en met derde lid kent Onze Minister binnen
      het raam van de door de begrotingswetgever beschikbaar gestelde middelen jaarlijks uiterlijk in september ten
      behoeve van de activiteiten van de colleges van burgemeester en wethouders in de regio aan de contactgemeente een
      specifieke uitkering toe. Deze uitkering heeft betrekking op het daarop volgende kalenderjaar. De contactgemeente
      draagt er zorg voor dat de colleges van burgemeester en wethouders in de regio gebruik kunnen maken van de
      instrumenten die met behulp van deze uitkering zijn verwezenlijkt. Bij of krachtens algemene maatregel van bestuur
      worden regels gegeven voor de berekening en betaling van de uitkering. De berekening geschiedt in elk geval aan
      de hand van het aantal volwassen inwoners van de gemeenten in de regio op 1 januari van het jaar voorafgaande aan
      het jaar van de uitkering, waarbij rekening wordt gehouden met het opleidingsniveau en met de etnische achtergrond
      van die inwoners. Bij de berekening van een deel van de uitkering kunnen de volwassen inwoners van gemeenten die
      op grond van een andere regeling reeds een vergoeding voor de bestrijding van voortijdig schoolverlaten ontvangen,
      buiten beschouwing worden gelaten. Onze Minister hanteert het aantal volwassen inwoners van de gemeenten in de
      regio dat blijkt uit de gegevens die het Centraal Bureau voor de Statistiek op verzoek van Onze Minister daarover
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118h
  - number: 118h.6
    text: |-
      Het bevoegd gezag geeft aan de door burgemeester en wethouders aangewezen personen alle gevraagde bescheiden ter
      inzage en verstrekt de gevraagde inlichtingen die van belang zijn voor het voorkomen en bestrijden van voortijdig
      schoolverlaten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118h
  - number: 118h.7
    text: |-
      De gemeenteraden in een regio stellen streefcijfers vast voor de in die regio te behalen resultaten.
      Burgemeester en wethouders van de contactgemeente stellen mede namens de andere gemeenten in de regio jaarlijks
      een effectrapportage vast waarin zowel de streefcijfers als de bereikte resultaten zijn aangegeven en waarin
      afwijkingen worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118h
  - number: 118h.8
    text: |-
      Indien burgemeester en wethouders van de contactgemeente het bepaalde bij of krachtens het eerste tot en met
      zevende lid niet nakomen, kan Onze Minister de uitkering geheel of gedeeltelijk inhouden of opschorten. Onze
      Minister gaat niet over tot gehele of gedeeltelijke inhouding dan na overleg met burgemeester en wethouders van
      de contactgemeente. Onze Minister kan de uitkering wederom toekennen indien de reden voor inhouding of opschorting
      is vervallen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118h
  - number: 118h.9
    text: |-
      Onze Minister kan de in het vijfde lid bedoelde uitkering geheel of gedeeltelijk terugvorderen indien niet uit de
      informatie, bedoeld in [artikel 17a van de Financiële-verhoudingswet][ref1], blijkt dat de uitkering is besteed in
      overeenstemming met dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118h
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: 118i.1
    text: |-
      Burgemeester en wethouders van de contactgemeente zenden de in [artikel 118h, zevende lid][ref1], bedoelde
      effectrapportage aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118h
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118h
  - number: 118i.2
    text: |-
      Burgemeester en wethouders zijn gehouden aan de door Onze Minister aangewezen personen alle gevraagde bescheiden
      ter inzage te geven en de gevraagde inlichtingen te verstrekken die van belang zijn voor het door Onze Minister te
      voeren beleid met betrekking tot het voortijdig schoolverlaten door niet-leerplichtigen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118i
  - number: 118i.3
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent het tijdstip van indiening en de
      inrichting van de effectrapportage en inzake de wijze van beschikbaarstelling van de gegevens, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118i
  - number: 118j
    text: 'In deze titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118j
  - number: 118j.a
    text: |-
      instelling voor hoger onderwijs: een instelling voor hoger onderwijs als bedoeld in artikel 1.1, onder g, van de
      Wet op het hoger onderwijs en wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118j
  - number: 118j.b
    text: |-
      instellingsbestuur: het instellingsbestuur, bedoeld in artikel 1.1, onderdeel j, van de Wet op het hoger onderwijs
      en wetenschappelijk onderzoek, met dien verstande dat voor zover het openbare instellingen betreft, de artikelen
      9.2, tweede lid, 10.9, tweede lid, en 11.1, tweede lid, van die wet van overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118j
  - number: 118k.1
    text: |-
      Aan degene die blijkens een geschiktheidsonderzoek als bedoeld in artikel 118l voldoende geschikt wordt geacht
      voor het beroep van leraar en in staat moet worden geacht binnen twee jaar na benoeming of tewerkstelling zonder
      benoeming tot leraar met goed gevolg deel te nemen aan het in artikel 118o bedoelde bekwaamheidsonderzoek, geeft
      het bestuur van een instelling die op grond van artikel 118n is erkend, een geschiktheidsverklaring af.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118k
  - number: 118k.2
    text: Bij ministeriële regeling wordt een model voor de geschiktheidsverklaring vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118k
  - number: 118l.1
    text: |-
      Het geschiktheidsonderzoek wordt op aanvraag van het bevoegd gezag dat voornemens is betrokkene te benoemen of
      tewerktestellen zonder benoeming, of op aanvraag van betrokkene zelf, uitgevoerd onder verantwoordelijkheid van
      het bestuur van een instelling die op grond van [artikel 118n][ref1] is erkend. Dat instellingsbestuur betrekt bij
      het geschiktheidsonderzoek het bevoegd gezag dat voornemens is betrokkene te benoemen of tewerktestellen zonder
      benoeming, of indien betrokkene de aanvraag zelf indient, een bevoegd gezag dat daartoe in overeenstemming met
      betrokkene is uitgenodigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118n
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118l
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118n
  - number: 118l.2
    text: 'Het geschiktheidsonderzoek omvat:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118l
  - number: 118l.2.a
    text: |-
      de beoordeling of de gevolgde opleiding en de maatschappelijke of beroepservaring van betrokkene, in onderlinge
      samenhang bezien, van voldoende belang zijn in verhouding tot de door deze beoogde werkzaamheden aan een school, en
      indien dat het geval is
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118l
  - number: 118l.2.b
    text: |-
      het onderzoek naar de geschiktheid van betrokkene voor die werkzaamheden, waartoe in ieder geval wordt gerekend de
      beoordeling of betrokkene in de feitelijke klassituatie tot verantwoord lesgeven in staat is, alsmede
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118l
  - number: 118l.2.c
    text: |-
      de beoordeling, welke scholing en begeleiding voor betrokkene noodzakelijk moeten worden geacht om met goed gevolg
      deel te kunnen nemen aan het bekwaamheidsonderzoek.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118l
  - number: 118l.3
    text: 'Uit de aanvraag voor het geschiktheidsonderzoek blijkt dat betrokkene in het bezit is van:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118l
  - number: 118l.3.a
    text: |-
      een getuigschrift van met goed gevolg afgelegd afsluitend examen van een opleiding
      in het wetenschappelijk onderwijs of in het hoger beroepsonderwijs als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], dan wel van een erkenning van
      beroepskwalificaties als bedoeld in [artikel 5 van de Algemene wet erkenning EG-beroepskwalificaties][ref2] voor
      overeenkomstig onderwijs,


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118l
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 118l.3.b
    text: |-
      een diploma van een middenkaderopleiding of van een specialistenopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder d respectievelijk e, van de Wet educatie en beroepsonderwijs][ref1], of van
      een vakopleiding als bedoeld in [artikel 7.2.2, eerste lid, onder c, van die wet][ref2], aangewezen op grond
      van [artikel 7.24, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3], voorzover
      betrokkene voornemens is onderwijs te geven in bij algemene maatregel van bestuur aangewezen beroepsgerichte vakken
      als bedoeld in de Wet op het voortgezet onderwijs, dan wel van een erkenning van beroepskwalificaties als bedoeld
      in [artikel 5 van de Algemene wet erkenning EG-beroepskwalificaties][ref4] voor overeenkomstig onderwijs, of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118l
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 118l.3.c
    text: |-
      een buitenlands getuigschrift dat naar het oordeel van het bestuur van de instelling die het geschiktheidsonderzoek
      uitvoert, gelijkwaardig is aan een getuigschrift of diploma als bedoeld onder a respectievelijk b.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118l
  - number: 118l.4
    text: |-
      Het in het tweede lid, onder b, bedoelde onderzoek is erop gericht, vast te stellen of betrokkene in voldoende
      mate beschikt over kennis, inzicht en vaardigheden om te kunnen worden belast met het geven van onderwijs dat
      voldoet aan de daaraan gestelde kwaliteitseisen, in aanmerking nemend dat betrokkene in de periode van benoeming
      of tewerkstelling zonder benoeming begeleid en verder geschoold zal worden om met goed gevolg deel te kunnen nemen
      aan het bekwaamheidsonderzoek. De in de eerste volzin bedoelde kennis en vaardigheden en het in die volzin bedoelde
      inzicht zijn afgeleid van de in [artikel 36, eerste lid][ref1], bedoelde bekwaamheidseisen en omvatten in het
      bijzonder beroepsmatige vaardigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118l
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 118l.5
    text: Het geschiktheidsonderzoek is zodanig ingericht dat daarbij in gelijke mate zijn betrokken,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118l
  - number: 118l.5.a
    text: personen die zijn belast of belast zijn geweest met het geven van onderwijs aan een lerarenopleiding, alsmede
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118l
  - number: 118l.5.b
    text: |-
      leraren in het desbetreffende vak of vakgebied, niet zijnde personeelsleden van het bevoegd gezag dat is betrokken
      bij het geschiktheidsonderzoek.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118l
  - number: 118l.6
    text: |-
      Ten behoeve van het uitvoeren van het geschiktheidsonderzoek is de aanvrager aan de instelling die het onderzoek
      zal verrichten, een bij ministeriële regeling vast te stellen bijdrage verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118l
  - number: 118l.7
    text: |-
      De algemene maatregel van bestuur, bedoeld in het derde lid, onderdeel b, wordt aan de beide Kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken
      en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118l
  - number: 118m.1
    text: |-
      Het instellingsbestuur van een instelling voor hoger onderwijs die werkzaamheden uitvoert als bedoeld in artikel
      118p, eerste lid, onder a, is partij bij de in artikel 38, eerste lid, bedoelde overeenkomst.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118m
  - number: 118m.2
    text: |-
      Indien na het sluiten van die overeenkomst blijkt dat de scholing of begeleiding niet volgens de overeenkomst kan
      worden uitgevoerd, treft dat instellingsbestuur tijdig een toereikende vervangende voorziening.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118m
  - number: 118n.1
    text: |-
      Onze Minister kan op aanvraag van het bestuur een instelling erkennen als bevoegd tot het uitvoeren of onder zijn
      verantwoordelijkheid doen uitvoeren van het geschiktheidsonderzoek. Erkenning vindt plaats indien het bestuur in
      zijn aanvraag ten genoegen van Onze Minister aantoont dat de instelling het geschiktheidsonderzoek onafhankelijk,
      deskundig en betrouwbaar zal uitvoeren. Bij algemene maatregel van bestuur kunnen regels worden vastgesteld met
      betrekking tot de toepassing van de tweede volzin, waaronder regels over de behandeling en beoordeling van de
      aanvraag. Een erkende instelling heeft tevens de bevoegdheid tot het verstrekken van geschiktheidsverklaringen op
      grond van het geschiktheidsonderzoek en tot het doen van voorstellen over de noodzakelijke scholing en begeleiding,
      met inachtneming van [artikel 118l, tweede lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118l
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118n
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118l
  - number: 118n.2
    text: |-
      Ten behoeve van de behandeling van aanvragen om erkenning kan Onze Minister een bij ministeriële regeling te
      bepalen bijdrage verlangen van het bestuur van de instelling.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118n
  - number: 118n.3
    text: |-
      Onze Minister kan de erkenning intrekken indien de instelling, bedoeld in het eerste lid, naar het oordeel van Onze
      Minister het geschiktheidsonderzoek niet langer onafhankelijk, deskundig of betrouwbaar uitvoert.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118n
  - number: 118o
    text: |-
      Het bekwaamheidsonderzoek strekt ertoe, vast te stellen of de leraar voldoet aan de in artikel 36, eerste lid,
      bedoelde bekwaamheidseisen voor het onderwijs waarvoor die eisen zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118o
  - number: 118p.1
    text: |-
      Het instellingsbestuur van een instelling voor hoger onderwijs die opleidt voor het voldoen aan bekwaamheidseisen
      als bedoeld in artikel 36, eerste lid, en die zich daartoe bij Onze Minister heeft gemeld, is na die melding en
      onder overlegging van een plan van aanpak, bevoegd tot:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118p
  - number: 118p.1.a
    text: |-
      het verzorgen of doen verzorgen van de in artikel 118l, tweede lid, onder c, bedoelde scholing en begeleiding, voor
      zover deze verband houden met opleidingen die de instelling verzorgt, of
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118p
  - number: 118p.1.b
    text: |-
      het uitvoeren of onder zijn verantwoordelijkheid doen uitvoeren van bekwaamheidsonderzoek, voor zover de instelling
      opleidt voor het desbetreffende getuigschrift, dan wel
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118p
  - number: 118p.1.c
    text: zowel de onder a als de onder b bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118p
  - number: 118p.2
    text: |-
      Het instellingsbestuur van een instelling voor hoger onderwijs die op grond van het eerste lid, onder b, bevoegd
      is tot het uitvoeren van het bekwaamheidsonderzoek, stelt de leraar die zich daartoe heeft gemeld en voor wie de
      scholing en begeleiding is afgerond overeenkomstig de in artikel 38, eerste lid bedoelde overeenkomst, tijdig in de
      gelegenheid deel te nemen aan dat onderzoek.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118p
  - number: 118p.3
    text: |-
      Het instellingsbestuur kan bepalen dat de aanvrager van het bekwaamheidsonderzoek aan dat bestuur een bijdrage is
      verschuldigd voor uitvoering van dat onderzoek. Bij ministeriële regeling kan voor deze bijdrage een maximum worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118p
  - number: 118q.1
    text: |-
      Het in artikel 118n en het in artikel 118p bedoelde bestuur dragen zorg voor de kwaliteit van de werkzaamheden van
      de instelling.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118q
  - number: 118q.2
    text: |-
      Onze Minister kan besluiten dat ten aanzien van een instelling een of meer van de in artikel 118n, of artikel 118p,
      eerste lid, bedoelde bevoegdheden worden ontnomen indien gebleken is dat de kwaliteit van de uitoefening daarvan
      tekortschiet, dan wel indien niet of niet meer wordt voldaan aan het terzake bij en krachtens deze wet bepaalde.
      Artikel 6.10, vierde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek is van overeenkomstige
      toepassing ten aanzien van de ontneming.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118q
  - number: 118r.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften vastgesteld voor de uitvoering van
      artikel 118l, tweede lid, onder b, en vierde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118r
  - number: 118r.2
    text: |-
      Tevens kunnen bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur voorschriften worden
      vastgesteld voor de uitvoering van deze titel, waaronder in elk geval voorschriften met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118r
  - number: 118r.2.a
    text: waarborging van de kwaliteit van het geschiktheidsonderzoek en van de instellingen die dat onderzoek uitvoeren,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118r
  - number: 118r.2.b
    text: |-
      de scholing en begeleiding, en het bekwaamheidsonderzoek, waaronder voorschriften ter waarborging van de kwaliteit,
      alsmede
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118r
  - number: 118r.2.c
    text: de procedure voor het aanvragen van het geschiktheidsonderzoek en voor afgifte van de geschiktheidsverklaring.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118r
  - number: 118r.3
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, wordt aan de beide Kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en niet door
      of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde onderwerp bij de
      wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118r
  - number: 118s
    text: |-
      Het in artikel 118n en het in artikel 118p bedoelde bestuur verstrekken aan Onze Minister alle inlichtingen
      die deze nodig acht ten behoeve van een goede naleving van deze titel. Het bestuur zendt de inspectie van
      het onderwijs telkens na zes maanden een overzicht van in die periode afgegeven geschiktheidsverklaringen en
      bekwaamheidsonderzoeken waaraan met goed gevolg is deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118s
  - number: 118t.1
    text: |-
      Met het oog op verbetering van de kwaliteit, toegankelijkheid of doelmatigheid van het voortgezet
      onderwijs kan bij wijze van experiment bij algemene maatregel van bestuur worden afgeweken van
      [titel II, afdeling I, hoofdstuk I][ref1] en van [titel III, afdeling II, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0002399#AfdelingII
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118t
    references:
      - id: ref1
        bwb_id: BWBR0002399
        hoofdstuk: I
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        afdeling: II
  - number: 118t.2
    text: 'In geval van toepassing van het eerste lid wordt bij algemene maatregel van bestuur in elk geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118t
  - number: 118t.2.a
    text: het doel van het experiment,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118t
  - number: 118t.2.b
    text: |-
      op welke wijze van welke artikelen van het in het eerste lid genoemde hoofdstuk en de daar genoemde afdeling wordt
      afgeweken,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118t
  - number: 118t.2.c
    text: de duur van het experiment, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118t
  - number: 118t.2.d
    text: op welke wijze en aan de hand van welke criteria de met het experiment beoogde effecten worden geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118t
  - number: 118t.3
    text: Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van een experiment.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118t
  - number: 118t.4
    text: |-
      Een experiment duurt ten hoogste zes jaar, tenzij een langere duur gezien de bijzondere aard van het experiment
      noodzakelijk is. Alsdan wordt de duur van het experiment op ten hoogste acht jaar bepaald. Indien een voorstel
      van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele wettelijke regeling
      voordat een experiment is afgelopen, kan Onze Minister het experiment verlengen tot het tijdstip waarop het
      wetsvoorstel tot wet is verheven en in werking treedt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118t
  - number: 118t.5
    text: |-
      Onze Minister zendt drie maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur als
      bedoeld in het eerste lid aan de Staten-Generaal, een verslag over de doeltreffendheid en de effecten van het
      experiment in de praktijk, evenals een standpunt over de voortzetting van die algemene maatregel van bestuur,
      anders dan een voortzetting als experiment.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118t
  - number: 118t.6
    text: |-
      In verband met een experiment als bedoeld in het eerste lid, kan bij algemene maatregel van bestuur eveneens bij
      wijze van experiment worden afgeweken van:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118t
  - number: 118t.6.a
    text: |-
      [artikel 1 van de Leerplichtwet 1969][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118t
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
  - number: 118t.6.b
    text: |-
      [artikel 1 van de Les- en cursusgeldwet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118t
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '1'
  - number: 118t.6.c
    text: |-
      [artikel 1.1 van de Wet studiefinanciering 2000][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118t
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '1'
  - number: 118t.6.d
    text: |-
      [artikel 1.1 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118t
    references:
      - id: ref1
        bwb_id: BWBR0012438
        artikel: '1'
  - number: 118t.7
    text: |-
      Dit artikel is van overeenkomstige toepassing op een samenwerkingsverband van een school met een school
      als bedoeld in [artikel 1][ref1], een school als bedoeld in de [Wet op het primair onderwijs][ref2],
      een school of instelling als bedoeld in de [Wet op de expertisecentra][ref3], een instelling
      als bedoeld in de [Wet educatie en beroepsonderwijs][ref4] of een instelling als bedoeld in
      de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5]. Bij samenwerking met een
      school of instelling kan voor die school of instelling respectievelijk worden afgeweken van
      [hoofdstuk I, titel I, artikelen 1][ref6] en [2][ref7], [titel II, afdeling 1][ref8], [afdeling 2][ref9],
      [artikelen 47][ref10] en [48][ref11], en [titel IV, afdeling 1][ref12], [2][ref13], [4 tot en met 7][ref14] en
      [afdeling 8, paragrafen 2][ref15], [3][ref16], [6][ref17] en [7][ref18] en [afdeling 9, paragrafen 1][ref19]
      en [2, van de Wet op het primair onderwijs][ref20], dan wel [titel I, artikelen 1][ref21] en
      [2][ref22], [titel II, afdeling 1][ref23], [afdeling 2, artikelen 50][ref24] en [51][ref25], en
      [titel IV, afdelingen 1][ref26], [2][ref27], [4 tot en met 6][ref28] en [afdeling 7, paragrafen 2][ref29],
      [3][ref30], [6][ref31] en [7][ref32], en [afdeling 8, artikelen 146 tot en met 149][ref33] en
      [151, van de Wet op de expertisecentra][ref34], [hoofdstuk 2, titel 2][ref35], en [hoofdstukken 6][ref36]
      en [7 van de Wet educatie en beroepsonderwijs][ref37] en [hoofdstuk 2, titel 2, hoofdstuk 5a][ref38],
      [hoofdstuk 6][ref39] en [7][ref40], [hoofdstuk 9, titel 2][ref41], [hoofdstuk 10, titel 3][ref42] en
      [hoofdstuk 11, paragraaf 4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref43]. Bij de algemene
      maatregel van bestuur, bedoeld in het tweede lid, wordt geregeld welke bij of krachtens de wet, de Wet op het
      primair onderwijs, de Wet op de expertisecentra, de Wet educatie en beroepsonderwijs of de Wet hoger onderwijs
      en wetenschappelijk onderzoek vastgestelde voorschriften van toepassing of van overeenkomstige toepassing zijn op
      de samenwerking.


