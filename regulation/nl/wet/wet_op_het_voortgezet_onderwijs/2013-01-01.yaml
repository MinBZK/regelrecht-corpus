  - number: '22.2'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, houdt voor alle schoolsoorten voorschriften in
      omtrent de tijd die per cursusjaar ten hoogste voor vakantie mag worden besteed, met dien verstande dat begin en
      einde van de zomervakantie kunnen worden voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel22
  - number: '22.3'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid kan, naast het bepaalde in het tweede lid, slechts
      voorschriften inhouden omtrent:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel22
  - number: 22.3.a
    text: |-
      de maatschappelijke stage, bedoeld in [artikel 6f][ref1], waaronder het in uren uitgedrukte tijdsbestek dat door de
      leerling daaraan moet worden besteed,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6f
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 22.3.b
    text: |-
      de mogelijkheid van vrijstelling met betrekking tot categorieën van leerlingen van het volgen van een
      maatschappelijke stage als bedoeld in [artikel 6f][ref1] en de bevoegdheid van het bevoegd gezag om in individuele
      gevallen ontheffing te verlenen van het volgen van die stage,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6f
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 22.3.c
    text: |-
      de buitenschoolse praktijkcomponent van een leer-werktraject als bedoeld in [artikel 10b1][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 22.3.d
    text: |-
      de stage in de leerwegen genoemd in de [artikelen 10b][ref1] en [10d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel22
