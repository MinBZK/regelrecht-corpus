        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 33b
    text: |-
      In afwijking van [artikel 33, eerste lid, onderdeel b][ref1], kan met het verzorgen van onderwijs in de
      assistentopleiding, bedoeld in [artikel 10b8][ref2], ook worden belast degene die in het bezit is van een
      geschiktheidsverklaring als bedoeld in [artikel 4.2.4, eerste lid, van de Wet educatie en beroepsonderwijs][ref3]
      voor tot die assistentopleiding behorend onderwijs, met dien verstande dat betrokkene tevens in het bezit is van een
      getuigschrift als bedoeld in [artikel 7a.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33b
