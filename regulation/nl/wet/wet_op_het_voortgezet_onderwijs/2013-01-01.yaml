        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '72.4'
    text: |-
      In afwijking van het derde lid kan Onze Minister voor bekostiging in aanmerking brengen een onderwijsvoorziening
      als bedoeld in het derde lid, onderdelen c tot en met f, die niet is opgenomen in een regionaal plan
      onderwijsvoorzieningen als bedoeld in het tweede lid, indien de overige bevoegde gezagsorganen die deelnemen aan de
      samenwerking instemmen met de aanvraag en indien nodig tevens wordt voldaan aan de in genoemde onderdelen opgenomen
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: '72.5'
    text: |-
      Op de voorbereiding van de besluiten, bedoeld in het derde en vierde lid, is [afdeling 3.4][ref1], met uitzondering
      van [artikel 3:18, van de Algemene wet bestuursrecht][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '72.6'
    text: |-
      Een aanvraag als bedoeld in het derde of vierde lid wordt afgewezen indien de onderwijsvoorziening leidt tot meer
      dan tien procent leerlingverlies bij een vestiging van een school of scholengemeenschap van een bevoegd gezag dat
      niet deelneemt aan de samenwerking, tenzij dat bevoegd gezag heeft verklaard, daarmee in te stemmen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: '72.7'
    text: |-
      [Artikelen 65, vijfde lid][ref1], en [66, eerste en derde lid][ref2], zijn van overeenkomstige toepassing op
      besluiten als bedoeld in het derde en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel66
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '65'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '66'
        afdeling: I
  - number: '72.8'
    text: |-
      Bij besluiten over een onderwijsvoorziening als bedoeld in het derde lid, onderdelen a en b, is
      [artikel 66, vierde lid][ref1], van overeenkomstige toepassing. Bij besluiten over overige in het derde lid
      bedoelde onderwijsvoorzieningen vangt de bekostiging aan op 1 augustus van enig kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel66
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '66'
        afdeling: I
  - number: '73.1'
    text: |-
      Onze Minister kan in bijzondere gevallen cursussen voortgezet onderwijs, niet zijnde voorbereidend
      beroepsonderwijs, geheel of gedeeltelijk en voor een door hem te bepalen periode voor bekostiging in aanmerking
      brengen, indien naar zijn oordeel daaraan behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel73
  - number: '73.2'
    text: Onze Minister kan aan de bekostiging verplichtingen verbinden.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel73
  - number: '73.3'
    text: |-
      Onze Minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels over de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel73
  - number: '73.4'
    text: |-
      Indien een cursus voortgezet onderwijs als bedoeld in het eerste lid voor bekostiging in aanmerking wordt gebracht,
      is [artikel 6e][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6e
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '74'
    text: |-
      Onze Minister kan onder door hem nader te stellen voorwaarden aanvullende middelen ter beschikking stellen die
      niet strekken tot bekostiging van het onderwijs, bedoeld in deze wet, en de schoolbegeleiding als bedoeld in de
      [artikelen 179 van de Wet op het primair onderwijs][ref1] en [165 van de Wet op de expertisecentra][ref2] ten
      behoeve daarvan, maar die direct of indirect dienstig zijn voor de uitvoering van het onderwijs of voor verhoging
      van de mogelijkheid tot deelname aan het onderwijs. Voor zover toepassing van de eerste volzin het verstrekken van
      subsidie betreft, zijn de [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel165
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '165'
      - id: ref3
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '76'
    text: Bij ministeriële regeling worden nadere voorschriften vastgesteld voor de uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76
  - number: 76a
    text: |-
      De [artikelen 76b tot en met 76w][ref1] zijn slechts van toepassing op scholen voor voorbereidend wetenschappelijk
      onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs, voor voorbereidend beroepsonderwijs en voor
      praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76b
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76b
        hoofdstuk: I
        afdeling: IA
  - number: 76b.1
    text: |-
      De gemeenteraad draagt onderscheidenlijk burgemeester en wethouders dragen ten behoeve van de gemeentelijke en
      van de andere dan gemeentelijke scholen zorg voor de voorzieningen in de huisvesting op het grondgebied van de
      gemeente overeenkomstig het bepaalde in dit hoofdstuk. Hij behandelt onderscheidenlijk zij behandelen daarbij de
      gemeentelijke en de andere dan gemeentelijke scholen op gelijke voet.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76b
  - number: 76b.2
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder een andere dan een gemeentelijke school mede begrepen een op het
      grondgebied van de gemeente gelegen nevenvestiging van een school waarvan de hoofdvestiging op het grondgebied van
      een andere gemeente is gelegen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76b
  - number: 76c.1
    text: 'Voor de toepassing van dit hoofdstuk worden onder voorzieningen in de huisvesting begrepen:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76c
  - number: 76c.1.a
    text: 'voor blijvend onderscheidenlijk voor tijdelijk gebruik bestemde voorzieningen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76c
  - number: 76c.1.a.1°
    text: |-
      nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een gedeelte
      daarvan, terreinen, alsmede eerste aanschaf van leer- en hulpmiddelen en meubilair,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76c
  - number: 76c.1.a.2°
    text: uitbreiding van de onder 1° bedoelde voorzieningen, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76c
  - number: 76c.1.a.3°
    text: medegebruik van een ruimte die geschikt is voor het onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76c
  - number: 76c.1.b
    text: herstel van constructiefouten aan het gebouw of het terrein;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76c
  - number: 76c.1.c
    text: |-
      herstel en vervanging in verband met schade aan gebouw, leer- en hulpmiddelen en meubilair in geval van bijzondere
      omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76c
  - number: 76c.2
    text: |-
      Bij algemene maatregel van bestuur worden bruto vloeroppervlakten per gelijktijdig aanwezige leerling
      voorgeschreven die voorzieningen in de huisvesting ten minste dienen te bevatten. Deze oppervlakten kunnen per
      schoolsoort verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76c
  - number: 76d.1
    text: |-
      Burgemeester en wethouders stellen jaarlijks ten behoeve van het eerstvolgende jaar voor een door hem te bepalen
      tijdstip een bekostigingsplafond vast voor de bekostiging van de voorzieningen in de huisvesting voor:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76d
  - number: 76d.1.a
    text: |-
      basisscholen als bedoeld in de [Wet op het primair onderwijs][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: 76d.1.b
    text: |-
      speciale scholen voor basisonderwijs als bedoeld in de [Wet op het primair onderwijs][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: 76d.1.c
    text: |-
      scholen voor speciaal onderwijs, scholen voor voortgezet speciaal onderwijs, scholen voor speciaal en voortgezet
      speciaal onderwijs dan wel instellingen voor speciaal en voortgezet speciaal onderwijs als bedoeld in de
      [Wet op de expertisecentra][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 76d.1.d
    text: scholen voor voortgezet speciaal onderwijs als bedoeld in deze wet, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76d
  - number: 76d.1.e
    text: |-
      scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs, voor
      voorbereidend beroepsonderwijs en voor praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76d
  - number: 76d.2
    text: |-
      Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      in het eerste lid bedoelde scholen op het grondgebied van de gemeente.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76d
  - number: 76e.1
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school dat een voorziening in de huisvesting wenst,
      dient een aanvraag voor opneming van die voorziening op het programma, bedoeld in [artikel 76f][ref1], in bij
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
  - number: 76e.2
    text: |-
      Burgemeester en wethouders kunnen ten aanzien van voorzieningen als bedoeld in [artikel 76c][ref1] bekostiging
      verstrekken ter zake van de kosten van bouwvoorbereiding.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76c
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76c
        hoofdstuk: I
        afdeling: IA
  - number: 76e.3
    text: |-
      Burgemeester en wethouders stellen vast, voor welk tijdstip de aanvraag wordt ingediend en aan welke voorwaarden
      deze dient te voldoen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76e
  - number: 76e.4
    text: Het derde lid is van overeenkomstige toepassing op de gemeentelijke scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76e
  - number: 76f.1
    text: |-
      Burgemeester en wethouders stellen, na overleg met de bevoegde gezagsorganen van de andere dan gemeentelijke
      scholen op het grondgebied van de gemeente, jaarlijks ten behoeve van het onderwijs op het grondgebied van de
      gemeente voor een door hen te bepalen tijdstip een programma als bedoeld in het tweede lid vast. Het programma
      heeft betrekking op scholen als bedoeld in [artikel 76d, eerste lid, onderdelen a tot en met e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
  - number: 76f.2
    text: |-
      Het programma omvat de voorzieningen in de huisvesting, bedoeld in [artikel 76c][ref1], die in het jaar na de
      vaststelling van het programma voor bekostiging in aanmerking zullen worden gebracht voor andere dan gemeentelijke
      scholen en voorzieningen die nodig zijn voor gemeentelijke scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76c
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76c
        hoofdstuk: I
        afdeling: IA
  - number: 76f.3
    text: 'Burgemeester en wethouders nemen uitsluitend voorzieningen in de huisvesting in het programma op, voor zover:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76f
  - number: 76f.3.a
    text: |-
      met de voorzieningen in het kalenderjaar volgend op het jaar van vaststelling van het programma redelijkerwijs een
      aanvang kan worden gemaakt dan wel de voorziening wordt gerealiseerd, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76f
  - number: 76f.3.b
    text: |-
      niet een van de weigeringsgronden, genoemd in [artikel 76k][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76k
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76k
        hoofdstuk: I
        afdeling: IA
  - number: 76f.4
    text: |-
      Indien het bekostigingsplafond, bedoeld in [artikel 76d][ref1], niet toereikend is, worden die voorzieningen in het
      programma opgenomen die uit dat bekostigingsplafond kunnen worden bekostigd, waarbij de volgorde wordt bepaald met
      inachtneming van de criteria, bedoeld in [artikel 76m, eerste lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76m
        hoofdstuk: I
        afdeling: IA
  - number: 76f.5
    text: |-
      De beschikking van burgemeester en wethouders kan een gedeelte van de gewenste voorziening dan wel een andere
      voorziening dan gewenst omvatten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76f
  - number: 76f.6
    text: |-
      Burgemeester en wethouders kunnen aan de opneming in het programma voorwaarden verbinden betreffende
      ingebruikneming of buitengebruikstelling van gebouwen of lokalen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76f
  - number: 76f.7
    text: |-
      Burgemeester en wethouders nemen bij de vaststelling van het programma de criteria, bedoeld in
      [artikel 76m, eerste lid, onderdeel c][ref1], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76m
        hoofdstuk: I
        afdeling: IA
  - number: 76f.8
    text: |-
      Binnen vier weken na de vaststelling van het programma treden burgemeester en wethouders met het bevoegd gezag
      in overleg over de wijze van uitvoering. Indien dit overleg niet tot overeenstemming leidt, delen burgemeester en
      wethouders het bevoegd gezag mede dat zij niet kunnen instemmen met de door het bevoegd gezag gewenste wijze van
      uitvoering.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76f
  - number: 76f.9
    text: |-
      Tijdens het in het eerste lid bedoelde overleg kunnen burgemeester en wethouders de Onderwijsraad verzoeken een
      advies uit te brengen over de vaststelling van het programma huisvestingsvoorzieningen in relatie tot de vrijheid
      van richting en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd
      dan wel uit eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht.
      Het advies wordt binnen vier weken uitgebracht aan burgemeester en wethouders. Het advies wordt bekend gemaakt
      tezamen met het programma.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76f
  - number: 76g
    text: |-
      Burgemeester en wethouders stellen gelijktijdig met het programma, bedoeld in [artikel 76f][ref1], ten behoeve
      van het onderwijs op het grondgebied van de gemeente voor een door hen te bepalen tijdstip een overzicht vast van
      die voorzieningen die zijn aangevraagd dan wel nodig zijn, die niet op het programma zijn opgenomen. Daarbij wordt
      aangegeven waarom de desbetreffende voorzieningen niet zijn opgenomen. Het overzicht wordt ter inzage gelegd. Het
      overzicht heeft betrekking op scholen als bedoeld in [artikel 76d, eerste lid, onderdelen a tot en met e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
  - number: 76h
    text: |-
      Burgemeester en wethouders stellen geen programma als bedoeld in [artikel 76f][ref1] en geen overzicht als bedoeld
      in [artikel 76g][ref2] vast, indien geen voorziening in de huisvesting nodig is noch een aanvraag is ingediend voor
      scholen als bedoeld in [artikel 76d, eerste lid, onderdelen a tot en met e][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76g
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76g
        hoofdstuk: I
        afdeling: IA
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
  - number: 76i.1
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school dat een voorziening in de huisvesting wenst die niet
      in het programma, bedoeld in [artikel 76f][ref1], is opgenomen, maar die gelet op de voortgang van het onderwijs
      geen uitstel kan lijden, dient een aanvraag om bekostiging van die voorziening in bij burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
  - number: 76i.2
    text: |-
      De beschikking kan een gedeelte van de gewenste voorziening dan wel een andere voorziening dan gewenst omvatten.
      Burgemeester en wethouders wijzen de aanvraag af, indien:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76i
  - number: 76i.2.a
    text: de beslissing over de voorziening kan worden genomen bij de vaststelling van het eerstvolgende programma, of
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76i
  - number: 76i.2.b
    text: |-
      een van de weigeringsgronden, genoemd in
      [artikel 76k, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76k
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76k
        hoofdstuk: I
        afdeling: IA
  - number: 76j.1
    text: |-
      Burgemeester en wethouders beslissen bij beschikking met ingang van welk tijdstip in het jaar volgend op het jaar
      van vaststelling van het programma, bedoeld in [artikel 76f][ref1], de bekostiging van een voorziening die in het
      programma is opgenomen, daadwerkelijk een aanvang kan nemen, onverminderd het bepaalde in [artikel 76l][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76l
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76j
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76l
        hoofdstuk: I
        afdeling: IA
  - number: 76j.2
    text: |-
      De aanspraak op bekostiging van een voorziening vervalt, indien niet binnen een in de verordening op basis
      van [artikel 76m][ref1] te bepalen termijn na de beschikking, bedoeld in het eerste lid, met betrekking tot de
      voorziening een bouwopdracht is gegeven dan wel een koop-, huur- of erfpachtovereenkomst is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76j
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76m
        hoofdstuk: I
        afdeling: IA
  - number: 76k.1
    text: 'Een voorziening in de huisvesting wordt slechts geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76k
  - number: 76k.1.a
    text: |-
      de gewenste voorziening geen voorziening is in de zin van [artikel 76c][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76c
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76c
        hoofdstuk: I
        afdeling: IA
  - number: 76k.1.b
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de aard en de omvang van de voorzieningen waarover
      de school reeds beschikt, voor zover deze uit de openbare kas zijn bekostigd, gelet op de normen, bedoeld in
      [artikel 76m, eerste lid, onderdeel b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76m
        hoofdstuk: I
        afdeling: IA
  - number: 76k.1.c
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van het
      aantal leerlingen of onderwijskundige ontwikkelingen, zulks met inachtneming van het bepaalde in
      [artikel 76m, eerste lid, onderdelen c en d][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76m
        hoofdstuk: I
        afdeling: IA
  - number: 76k.1.d
    text: |-
      op andere wijze dan is gewenst redelijkerwijs in de behoefte aan huisvesting kan worden voorzien, onder meer
      doordat binnen redelijke afstand van de gewenste plaats van de voorziening gebruik dan wel medegebruik mogelijk is,
      of een reeds voor bekostiging in aanmerking gebracht gebouw of deel daarvan beschikbaar komt,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76k
  - number: 76k.1.e
    text: |-
      het bekostigingsplafond, bedoeld in [artikel 76d][ref1], niet toereikend is voor de te verstrekken voorzieningen
      voor scholen als bedoeld in het [eerste lid, onderdelen a tot en met e, van dat artikel][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
  - number: 76k.1.f
    text: de gewenste voorziening anders dan op grond van de onderdelen b tot en met d niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76k
  - number: 76k.2
    text: |-
      Een voorziening in de huisvesting kan tevens worden geweigerd, indien de voorziening als gevolg van het verwijtbaar
      nalaten van noodzakelijk onderhoud in een slechte bouwkundige staat verkeert of indien de voorziening nodig is voor
      herstel van schade die is veroorzaakt door schuld of toedoen van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76k
  - number: 76l
    text: |-
      Voorzieningen die in het programma, bedoeld in [artikel 76f,][ref1] zijn opgenomen, komen voor bekostiging in
      aanmerking, mits op het tijdstip dat daarvoor op grond van [artikel 76j][ref2] is vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76j
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76l
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76j
        hoofdstuk: I
        afdeling: IA
  - number: 76l.a
    text: is voldaan aan de bij of krachtens de wet gestelde voorschriften, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76l
  - number: 76l.b
    text: |-
      de feiten en omstandigheden waarin de school verkeert, ten opzichte van de feiten en omstandigheden ten tijde van
      de vaststelling van het programma niet ingrijpend zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76l
  - number: 76m.1
    text: 'De gemeenteraad stelt bij verordening een regeling vast met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76m
  - number: 76m.1.a
    text: |-
      de voorzieningen die ingevolge [artikel 76c][ref1] voor bekostiging in aanmerking kunnen worden gebracht,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76c
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76m
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76c
        hoofdstuk: I
        afdeling: IA
  - number: 76m.1.b
    text: de oppervlakte en de indeling van schoolgebouwen,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76m
  - number: 76m.1.c
    text: de urgentiecriteria,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76m
  - number: 76m.1.d
    text: de prognosecriteria,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76m
  - number: 76m.1.e
    text: |-
      de termijn bedoeld in [artikel 76j][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76j
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76m
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76j
        hoofdstuk: I
        afdeling: IA
  - number: 76m.1.f
    text: de procedure met betrekking tot verhuur en het medegebruik van ruimten voor het onderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76m
  - number: 76m.1.g
    text: |-
      de termijn gedurende welke een gebouw of terrein voor een school of nevenvestiging nog ten hoogste kan worden
      gebruikt bij toepassing van [artikel 76u][ref1], alsmede de procedure in verband met een eventueel op te maken
      staat van onderhoud, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76u
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76m
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76u
        hoofdstuk: I
        afdeling: IA
  - number: 76m.1.h
    text: |-
      de gegevens bedoeld in [artikel 76w][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76w
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76m
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76w
        hoofdstuk: I
        afdeling: IA
  - number: 76m.2
    text: |-
      De regeling wordt zodanig vastgesteld dat kan worden voldaan aan de redelijke eisen die het onderwijs aan de
      huisvesting van scholen in de gemeente stelt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76m
  - number: 76m.3
    text: |-
      De gemeenteraad stelt normen vast aan de hand waarvan de bedragen worden vastgesteld voor de toegekende
      voorzieningen in de huisvesting.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76m
  - number: 76m.4
    text: |-
      Burgemeester en wethouders betalen volgens door hen te stellen regels de bedragen aan de hand van de door de
      gemeenteraad gestelde normen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76m
  - number: 76m.5
    text: |-
      De gemeenteraad stelt de regeling, bedoeld in het eerste lid, dan wel een wijziging daarvan, niet vast dan nadat
      daarover op overeenstemming gericht overleg is gevoerd met door de bevoegde gezagsorganen van de andere dan
      gemeentelijke scholen in de gemeente aan te wijzen vertegenwoordigers. De gemeenteraad stelt daartoe een procedure
      vast.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76m
  - number: 76m.6
    text: |-
      Tijdens het in het vijfde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling of wijziging van de gemeentelijke verordening in relatie tot de vrijheid van richting
      en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd dan wel uit
      eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies
      wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met de verordening
      of de wijziging daarvan.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76m
  - number: 76n.1
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school geeft opdracht de voorziening in de huisvesting
      waartoe op grond van de [artikelen 76f][ref1] en [76i][ref2] kan worden overgegaan, tot stand te brengen met
      daartoe door de gemeente beschikbaar te stellen gelden, tenzij het met burgemeester en wethouders overeenkomt dat
      de gemeente deze voorziening tot stand brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76i
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76n
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76i
        hoofdstuk: I
        afdeling: IA
  - number: 76n.2
    text: |-
      Indien de gemeente de voorziening in de huisvesting van een andere dan een gemeentelijke school tot stand
      heeft gebracht, worden gebouw en terrein aan het bevoegd gezag in eigendom overgedragen, tenzij burgemeester en
      wethouders en het bevoegd gezag anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76n
  - number: 76n.3
    text: |-
      Indien de voorziening in de huisvesting, bedoeld in het tweede lid, niet voldoet aan de eisen voor
      eigendomsoverdracht, geven burgemeester en wethouders deze aan het bevoegd gezag in gebruik.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76n
  - number: 76o
    text: |-
      Tenzij het bevoegd gezag van een andere dan een gemeentelijke school dat aanspraak heeft op bekostiging van
      een voorziening in de huisvesting, met burgemeester en wethouders overeenkomt dat de gemeente deze voorziening
      tot stand brengt, behoeven de bouwplannen en de desbetreffende begrotingen de instemming van burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76o
  - number: 76p
    text: |-
      De gemeente brengt een voorziening in de huisvesting van een andere dan een gemeentelijke school slechts tot stand,
      indien tussen burgemeester en wethouders en het bevoegd gezag overeenstemming bestaat over de bouwplannen en de
      wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76p
  - number: 76q.1
    text: |-
      Het bevoegd gezag is verplicht het gebouw en terrein, alsmede de roerende zaken waarvoor bekostiging wordt genoten,
      behoorlijk te gebruiken en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76q
  - number: 76q.2
    text: |-
      Vervreemding door het bevoegd gezag van een andere dan een gemeentelijke school anders dan op grond van de
      [artikelen 42c][ref1] en [50][ref2], van gebouwen, terreinen en roerende zaken waarvoor bekostiging wordt genoten,
      of bezwaren met een zakelijk recht door het bevoegd gezag van een andere dan een gemeentelijke school van zodanige
      gebouwen en terreinen is zonder toestemming van burgemeester en wethouders nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel42c
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel50
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76q
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 42c
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '50'
        hoofdstuk: III
        afdeling: I
  - number: 76q.3
    text: |-
      Het tweede lid is niet van toepassing ten aanzien van het recht van opstal ten behoeve van een door de gemeente te
      plaatsen tijdelijke voorziening in de huisvesting op grond die eigendom is van het bevoegd gezag van de betrokken
      school.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76q
  - number: 76r.1
    text: |-
      Burgemeester en wethouders zijn bevoegd een gedeelte van een gebouw of terrein dat tijdelijk of gedurende een
      gedeelte van de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd als huisvesting voor
      een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde voortgezet onderwijs, of voor
      educatie als bedoeld in de [Wet educatie en beroepsonderwijs][ref1] dan wel voor andere culturele, maatschappelijke
      of recreatieve doeleinden te bestemmen. Het voorgenomen gebruik dient zich te verdragen met het onderwijs aan de
      in het gebouw gevestigde school. Tevens zijn burgemeester en wethouders bevoegd ten behoeve van het onderwijs in
      lichamelijke opvoeding of expressie-activiteiten een gebouw of terrein dan wel een gedeelte daarvan dat tijdelijk
      gedurende gedeelten van de dag of in het geheel niet nodig zal zijn voor de daar gevestigde school, gedurende
      die tijd als huisvesting voor een andere school, voor ander uit de openbare kas bekostigd onderwijs, niet zijnde
      voortgezet onderwijs, of voor educatie als bedoeld in de [Wet educatie en beroepsonderwijs][ref2] dan wel voor
      andere culturele, maatschappelijke of recreatieve doeleinden te bestemmen. Burgemeester en wethouders zijn bevoegd
      een sportterrein, buiten de tijden dat het terrein voor het voortgezet onderwijs wordt gebruikt, gedurende die tijd
      te bestemmen voor culturele, maatschappelijke of recreatieve doeleinden, op zodanige wijze dat het zich verdraagt
      met het onderwijs dat op het terrein wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76r
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0007625
  - number: 76r.2
    text: |-
      Indien het gebouw of terrein in gebruik is voor een andere dan een gemeentelijke school, plegen burgemeester en
      wethouders vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met het bevoegd gezag van de
      andere school of nevenvestiging waarvoor de huisvesting is bestemd.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76r
  - number: 76s.1
    text: |-
      Voor zover [artikel 76r][ref1] geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw
      of terrein in gebruik geven ten behoeve van uit de openbare kas bekostigd onderwijs dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden. Voor zover niet nodig voor uit de openbare kas
      bekostigd onderwijs, kan het bevoegd gezag een gedeelte van het gebouw of terrein verhuren aan een derde,
      voor zover het gehuurde niet bestemd zal zijn als woon- of bedrijfsruimte in de zin van de [vijfde][ref2]
      en [zesde afdeling van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref3]. Indien het een andere dan een
      gemeentelijke school betreft, is voor verhuur toestemming van burgemeester en wethouders vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76r
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Afdeling5
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Afdeling6
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76s
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76r
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0005290
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005290
        afdeling: '6'
  - number: 76s.2
    text: 'De ingebruikgeving of verhuur ingevolge het eerste lid eindigt:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76s
  - number: 76s.2.a
    text: |-
      indien burgemeester en wethouders gebruik maken van hun bevoegdheid op grond van artikel 76r zonder dat enige
      schadeplicht ontstaat, of
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76s
  - number: 76s.2.b
    text: indien het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76s
  - number: 76s.3
    text: |-
      Ingebruikgeving of verhuur ingevolge het eerste lid geschiedt niet indien het voorgenomen gebruik zich niet
      verdraagt met het onderwijs aan de in het gebouw gevestigde school.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76s
  - number: 76s.4
    text: |-
      Op de ingebruikgeving en verhuur ingevolge het eerste lid is
      [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76s
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: 76s.5
    text: |-
      Het zonder toestemming van burgemeester en wethouders verhuren van een gebouw of terrein door het bevoegd
      gezag van een andere dan een gemeentelijke school alsmede elk met dit artikel strijdig beding opgenomen in een
      huurovereenkomst met betrekking tot schoolgebouwen, is nietig.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76s
  - number: 76t
    text: |-
      Voorzieningen aan gebouwen of terreinen in verband met verhuur krachtens de [artikelen 76s][ref1] of [76u][ref2]
      door het bevoegd gezag van een andere dan een gemeentelijke school, komen niet ten laste van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76s
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76u
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76t
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76s
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76u
        hoofdstuk: I
        afdeling: IA
  - number: 76u.1
    text: |-
      Burgemeester en wethouders en het bevoegd gezag van een andere dan een gemeentelijke school dat eigenaar is van
      het gebouw en terrein kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag blijvend heeft opgehouden dan
      wel blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht vatbaar gedeelte daarvan, voor de
      school te gebruiken.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76u
  - number: 76u.1a
    text: |-
      Bij toepassing van het eerste lid stellen burgemeester en wethouders en het bevoegd gezag van de desbetreffende
      school gezamenlijk vast of voorzieningen in een slechte bouwkundige staat verkeren als gevolg van het verwijtbaar
      nalaten van noodzakelijk onderhoud. Indien dat het geval is, vindt verrekening plaats van de daarmee gemoeide
      kosten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76u
  - number: 76u.1b
    text: |-
      De gemeenteraad en het bevoegd gezag van de andere dan gemeentelijke scholen treffen gezamenlijk een voorziening
      voor het beslechten van geschillen die zich bij de toepassing van lid 1a voordoen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76u
  - number: 76u.2
    text: |-
      Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het eerste lid desgevraagd besluiten
      dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor
      eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. De aanvraag om het besluit wordt gedaan
      door burgemeester en wethouders of door het bevoegd gezag van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76u
  - number: 76u.3
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school dat voornemens is gebouwen of terreinen, of
      een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, doet hiervan onverwijld mededeling aan
      burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76u
  - number: 76u.4
    text: |-
      Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, of het in het tweede lid bedoelde
      besluit van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van
      de rechter, inhoudende een besluit als bedoeld in het tweede lid eerste volzin, in de plaats treedt van het
      vernietigde besluit, wordt de akte, het onherroepelijk geworden besluit onderscheidenlijk de uitspraak, tenzij
      deze een gebouw betreft als bedoeld in [artikel 28 van de Overgangswet W.V.O.][ref1] en waarvoor door het bevoegd
      gezag van rijkswege slechts een rentevergoeding is ontvangen, ingeschreven in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref2]. Door de inschrijving verkrijgt de gemeente
      de eigendom.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76u
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: 76u.5
    text: |-
      Burgemeester en wethouders en het bevoegd gezag van een andere dan een gemeentelijke school dat eigenaar is van het
      schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het gebouw dat niet vatbaar is voor
      eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76u
  - number: 76u.6
    text: |-
      Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het vijfde lid desgevraagd besluiten
      dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs
      nodig zal zijn. De aanvraag om het besluit wordt gedaan door burgemeester en wethouders of door het bevoegd gezag
      van de school. Alvorens op de aanvraag te besluiten, horen gedeputeerde staten de wederpartij.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76u
  - number: 76u.7
    text: |-
      Zodra de in het vijfde lid bedoelde akte door beide partijen is getekend, of het in het zesde lid bedoelde besluit
      van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de rechter,
      inhoudende een beslissing als bedoeld in het zesde lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, kan het bevoegd gezag van een andere dan een gemeentelijke school het desbetreffende gedeelte van het
      gebouw met toestemming van burgemeester en wethouders verhuren.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76u
  - number: 76u.8
    text: |-
      De toestemming, bedoeld in het zevende lid, wordt verleend voor een tijdvak van ten hoogste 3 jaren. Op verzoek van
      het bevoegd gezag kan dit tijdvak telkens worden verlengd met een termijn van ten hoogste 3 jaren.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76u
  - number: 76u.9
    text: |-
      Op de verhuur, bedoeld in het zevende lid, is [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76u
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: 76v
    text: |-
      In afwijking van dit hoofdstuk kan de gemeenteraad besluiten dat jaarlijks een bedrag voor huisvestingskosten wordt
      betaald aan het bevoegd gezag van een andere dan een gemeentelijke school voor zover die op het grondgebied van die
      gemeente in stand wordt gehouden. De gemeenteraad neemt het besluit in overeenstemming met het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76v
  - number: 76v.1.1
    text: |-
      In afwijking van het bepaalde in dit hoofdstuk en onverminderd het tweede lid zijn de bepalingen inzake de
      huisvesting bij of krachtens de [Wet educatie en beroepsonderwijs][ref1] van toepassing op scholen voor voortgezet
      onderwijs die deel uitmaken van een scholengemeenschap die omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76v.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 76v.1.1.a
    text: een regionaal opleidingencentrum en een school voor voortgezet onderwijs, dan wel
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76v.1
  - number: 76v.1.1.b
    text: |-
      een agrarisch opleidingscentrum en een school voor middelbaar algemeen voortgezet onderwijs of een school voor
      praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76v.1
  - number: 76v.1.2
    text: |-
      [Artikel 76u][ref1] is van overeenkomstige toepassing op de gebouwen en terreinen waarvan het bevoegd gezag van een
      andere dan een gemeentelijke school eigenaar is op het moment dat op of na 1 januari 1997 een scholengemeenschap
      als bedoeld in het eerste lid tot stand komt dan wel wordt uitgebreid met een school voor voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76u
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76v.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76u
        hoofdstuk: I
        afdeling: IA
  - number: 76v.1.3
    text: 'De gemeenteraad kan in overeenstemming met het bevoegd gezag besluiten:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76v.1
  - number: 76v.1.3.a
    text: dat het tweede lid niet van toepassing is,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76v.1
  - number: 76v.1.3.b
    text: dat daarvoor het bevoegd gezag of de gemeenteraad aan de andere partij een vergoeding is verschuldigd, alsmede
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76v.1
  - number: 76v.1.3.c
    text: in voorkomende gevallen, hoe hoog die vergoeding is.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76v.1
  - number: 76v.1.4
    text: |-
      Indien toepassing is gegeven aan het derde lid, vindt inschrijving van dat feit plaats in de openbare registers,
      bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76v.1
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: 76w
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school is gehouden aan de gemeenteraad onderscheidenlijk
      burgemeester en wethouders alle inlichtingen te verschaffen die de gemeenteraad onderscheidenlijk burgemeester en
      wethouders voor een adequate uitvoering van de bepalingen in dit hoofdstuk noodzakelijk achten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel76w
  - number: '77.1'
    text: |-
      De scholen, bedoeld in [afdeling I van titel II][ref1] worden door het Rijk bekostigd met inachtneming van de
      [artikelen 78 tot en met 106][ref2]. De uitgaven, bedoeld in de [artikelen 96g][ref3] en [96h][ref4], alsmede de
      bedragen die de gemeente krachtens deze wet in aanvulling op de rijksbekostiging verstrekt, blijven ten laste van
      de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#AfdelingI
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel96g
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel96h
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0002399
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '78'
        hoofdstuk: I
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 96g
        hoofdstuk: III
        paragraaf: '6'
        afdeling: II
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 96h
        hoofdstuk: III
        paragraaf: '6'
        afdeling: II
  - number: '77.2'
    text: |-
      Aan niet door de gemeente in stand gehouden scholen als bedoeld in [afdeling I van titel II][ref1] wordt uit de
      openbare kas geen bekostiging verstrekt dan krachtens de bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#AfdelingI
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0002399
        afdeling: I
  - number: '77.3'
    text: |-
      Met betrekking tot een scholengemeenschap of een school en de daaraan verbonden cursussen in de zin van artikel
      75b, eerste lid, kunnen zo nodig in afwijking van het bepaalde in deze afdeling bij of krachtens algemene maatregel
      van bestuur voorschriften worden gegeven voor de toepassing van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel77
  - number: '77.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de vaststelling
      en uitkering van een budget ten behoeve van aanvullende zorg voor leerlingen van de scholen in het
      samenwerkingsverband, in aanvulling op de bekostiging, berekend op grond van het bij of krachtens deze afdeling
      bepaalde. Het budget wordt binnen het raam van de door de begrotingswetgever daartoe beschikbaar gestelde middelen
      vastgesteld en uitgekeerd. De algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend. Het bepaalde in de vorige drie volzinnen is niet van toepassing, indien het ontwerp van de algemene
      maatregel van bestuur voordien aan de beide kamers is overgelegd en door of namens de kamers te kennen is gegeven
      dat van de procedure, bedoeld in de vorige drie volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel77
  - number: '77.5'
    text: |-
      Voor de toepassing van deze afdeling zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      [artikel 42b][ref1] of een openbare rechtspersoon als bedoeld in [artikel 42a][ref2], tenzij het tegendeel blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel42b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel42a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 42b
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 42a
        hoofdstuk: II
        afdeling: I
  - number: 77a.1
    text: |-
      Indien op verzoek van de ouders van een leerling voor wie op basis van een beoordeling door een commissie voor
      de indicatiestelling als bedoeld in [artikel 28c van de Wet op de expertisecentra][ref1], een leerlinggebonden
      budget beschikbaar is, die leerling wordt ingeschreven bij een school, dan wel indien een dergelijk budget
      beschikbaar komt voor een leerling die al staat ingeschreven bij een school, meldt het bevoegd gezag van die school
      die inschrijving, respectievelijk het beschikbaar komen van een leerlinggebonden budget voor de desbetreffende
      leerling, aan Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28c
  - number: 77a.2
    text: |-
      Indien sprake is van een eerste inschrijving bij een school als leerling voor wie een leerlinggebonden budget
      beschikbaar is, dan wel indien een leerlinggebonden budget beschikbaar komt voor een leerling die al staat
      ingeschreven bij een school, wordt met ingang van de eerste dag van de maand volgend op de inschrijving,
      respectievelijk het beschikbaar komen van het leerlinggebonden budget, aan het bevoegd gezag van die school
      ten behoeve van die leerling een leerlinggebonden budget toegekend, dat wordt berekend op een bij of krachtens
      algemene maatregel van bestuur vastgestelde wijze. De omvang van het leerlinggebonden budget is afhankelijk van de
      onderwijssoort waarvoor de leerling toelaatbaar is verklaard, waarbinnen onderscheid kan worden gemaakt op grond
      van leerlingkenmerken, en van de onderwijssoort van de school waarbij de leerling wordt ingeschreven. In de vorige
      volzin wordt met de onderwijssoort van de school waarbij de leerling is ingeschreven tevens bedoeld het toegelaten
      zijn tot het leerwegondersteunend onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel77a
  - number: 77a.3
    text: |-
      Indien ten behoeve van een leerling voor wie een leerlinggebonden budget beschikbaar is in het lopende schooljaar
      dat budget aan het bevoegd gezag van een school is toegekend, wordt bij inschrijving van die leerling bij een
      andere school, het in het tweede lid bedoelde leerlinggebonden budget aan het bevoegd gezag van laatstbedoelde
      school toegekend met ingang van het nieuwe schooljaar.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel77a
  - number: 77a.4
    text: |-
      Het bevoegd gezag van de school is verplicht een bij algemene maatregel van bestuur te bepalen deel van
      het leerlinggebonden budget te besteden bij een school als bedoeld in de [Wet op de expertisecentra][ref1]
      waarbinnen onderwijs wordt gegeven van de soort waarvoor de leerling toelaatbaar is verklaard of van
      de soort die behoort tot hetzelfde cluster als de onderwijssoort waarvoor de leerling toelaatbaar
      is verklaard. Het in de eerste volzin bedoelde deel kan voor de onderwijssoorten, bedoeld in
      [artikel 2, tweede lid, van de Wet op de expertisecentra][ref2], verschillend worden vastgesteld. De eerste volzin
      is van overeenkomstige toepassing ten aanzien van een leerling die toelaatbaar is verklaard tot het cluster,
      bedoeld in [artikel 2, vierde lid onder d, van de Wet op de expertisecentra][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 77a.5
    text: |-
      Bij de melding, bedoeld in het eerste lid, geeft het bevoegd gezag tevens aan bij welke school bedoeld in
      de [Wet op de expertisecentra][ref1] het in het vierde lid bedoelde deel van het leerlinggebonden budget
      wordt besteed. Op grond van deze melding kent Onze minister dat deel van het leerlinggebonden budget toe aan
      laatstbedoelde school.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 77a.6
    text: |-
      Een krachtens het tweede en vierde lid vastgestelde algemene maatregel van bestuur wordt aan de Tweede Kamer
      der Staten-Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat 4 weken na de overlegging zijn
      verstreken bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens de kamer de wens te
      kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval
      wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. De vorige 3 volzinnen zijn niet van
      toepassing, voor zover het ontwerp van een algemene maatregel van bestuur voordien aan de Tweede Kamer der Staten-
      Generaal is voorgelegd en door of namens de kamer te kennen is gegeven dat van de procedure, bedoeld in de vorige 3
      volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel77a
  - number: 77b.1
    text: |-
      De commissie voor de indicatiestelling, bedoeld in [artikel 28c van de Wet op de expertisecentra][ref1],
      beoordeelt, indien de ouders van een leerling niet overgaan tot een verzoek als bedoeld in
      [artikel 28c, eerste lid, van de Wet op de expertisecentra][ref2], op verzoek van het bevoegd gezag van de school
      van een leerling, die zijn woonplaats heeft in het gebied van het regionaal expertisecentrum dat de desbetreffende
      commissie voor de indicatiestelling in stand houdt, of een leerling op basis van de in het achtste lid van
      [artikel 28c van de Wet op de expertisecentra][ref3] bedoelde criteria:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel77b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28c
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 28c
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 28c
  - number: 77b.1.a
    text: |-
      in aanmerking komt voor een leerlinggebonden budget indien de leerling wordt dan wel is ingeschreven bij een school
      alsmede
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel77b
  - number: 77b.1.b
    text: |-
      toelaatbaar is tot het cluster, bedoeld in [artikel 2, vierde lid, onder d, van de Wet op de expertisecentra][ref1]
      waarvoor de commissie voor de indicatiestelling werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel77b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 77b.2
    text: |-
      Het tweede, vierde, vijfde, zesde, zevende, achtste, tiende en elfde lid van
      [artikel 28c van de Wet op de expertisecentra][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel77b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28c
  - number: 77b.3
    text: |-
      Het bevoegd gezag informeert de ouders van de desbetreffende leerling schriftelijk over zijn voornemen om tot een
      verzoek als bedoeld in het eerste lid over te gaan en stelt hen daarbij in de gelegenheid binnen ten minste vier
      weken na dagtekening van de informatieve mededeling aan te geven of zij zelf tot een verzoek overgaan. Bij het
      aanmeldingsformulier, bedoeld in [artikel 28c, vierde lid][ref1], geeft het bevoegd gezag de reactie van de ouders
      weer.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel77b
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28c
  - number: '78'
    text: 'De kosten van de scholen zijn:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel78
  - number: 78.a
    text: huisvestingskosten,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel78
  - number: 78.b
    text: inventariskosten,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel78
  - number: 78.c
    text: personeelskosten, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel78
  - number: 78.d
    text: exploitatiekosten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel78
  - number: '84.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor de scholen de grondslagen vastgesteld voor de omvang
      van de formatie van:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel84
  - number: 84.1.a
    text: de rectoren, directeuren, conrectoren en adjunct-directeuren,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel84
  - number: 84.1.b
    text: de leraren, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel84
  - number: 84.1.c
    text: het onderwijsondersteunend personeel.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel84
  - number: '84.2'
    text: |-
      De grondslagen van de berekening van de omvang van de formatie worden wat betreft het in het eerste lid onder a, b
      en c genoemde personeel in elk geval gevormd door een normatieve relatie tussen het aantal leerlingen en het aantal
      personeelsleden van de school, onderscheiden naar personeelscategorieën.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel84
  - number: '84.3'
    text: |-
      De grondslagen worden wat het in het eerste lid onder b genoemde personeel betreft bovendien gevormd door een vast
      aantal formatieplaatsen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel84
  - number: '84.4'
    text: |-
      Voor het in het eerste lid, onderdeel b, bedoelde personeel wordt voor scholen met leerwegondersteunend onderwijs
      dat op grond van artikel 75c in aanmerking komt voor bekostiging een afzonderlijke grondslag vastgesteld op basis
      van het aantal leerlingen in dat onderwijs voor wie de regionale verwijzingscommissie heeft bepaald dat zij op dat
      onderwijs zijn aangewezen of toelaatbaar zijn tot het praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel84
  - number: '84.5'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, wordt aan de beide Kamers der Staten-Generaal
      overgelegd. Een maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel84
  - number: 84b.1
    text: |-
      Aan de scholen, bedoeld in [artikel 84, eerste lid][ref1], wordt in verband met de kosten van vervanging van
      personeel en de kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen
      wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref2]
      bekostiging verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel84b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '84'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001888
  - number: 84b.2
    text: |-
      De omvang van de in het eerste lid bedoelde bekostiging bedraagt een jaarlijks bij ministeriële
      regeling vast te stellen percentage van de bekostiging van de salarissen die onderdeel zijn van de in
      [artikel 85, eerste lid][ref1], bedoelde gemiddelde personeelslast. Bij ministeriële regeling kan het percentage,
      bedoeld in de eerste volzin, tussentijds worden gewijzigd. De ministeriële regeling kan vaststellen welk deel van
      de bekostiging van de salarissen wordt gehanteerd bij de berekening, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel84b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '85'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: '85.1'
    text: |-
      De bekostiging van de kosten van het in [artikel 84][ref1] bedoelde personeel wordt vastgesteld door de krachtens
      [artikel 84][ref2] vastgestelde formatie te vermenigvuldigen met een gemiddelde personeelslast, met inachtneming
      van ter zake bij of krachtens de in [artikel 84, eerste lid][ref3], bedoelde algemene maatregel van bestuur vast
      te stellen voorschriften. De gemiddelde personeelslast is het genormeerde bedrag van de personele middelen per
      formatieplaats voor elke personeelscategorie, in welk bedrag tevens zijn verwerkt incidentele loonontwikkelingen en
      algemene salarismaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel84
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '84'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '84'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '84'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: '85.2'
    text: |-
      Onder de personele middelen worden verstaan de middelen ten behoeve van de salarissen, toelagen, uitkeringen en
      vergoedingen ten behoeve van personeel van de scholen, alsmede de bijdragen tot hun pensioen en tot dat van hun
      nagelaten betrekkingen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel85
  - number: '85.3'
    text: De gemiddelde personeelslast, die per schoolsoort kan verschillen, wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel85
  - number: '85.4'
    text: |-
      Naast de bekostiging, bedoeld in het eerste lid, ontvangt het bevoegd gezag een bij algemene maatregel van bestuur
      vast te stellen bedrag per leerling in verband met de maatschappelijke stage, bedoeld in [artikel 6f][ref1]. Het in
      de eerste volzin bedoelde bedrag kan bij ministeriële regeling worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6f
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 85a.1
    text: |-
      Indien bijzondere ontwikkelingen in het voortgezet onderwijs daartoe aanleiding geven, kunnen bij ministeriële
      regeling voorschriften worden vastgesteld omtrent het verstrekken van aanvullende bekostiging voor
      personeelskosten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel85a
  - number: 85a.2
    text: |-
      In verband met bijzondere omstandigheden kan Onze minister op verzoek van het bevoegd gezag van een in het
      eerste lid bedoelde school en onder door hem te stellen voorwaarden aanvullende bekostiging voor personeelskosten
      verstrekken
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel85a
  - number: 85a.3
    text: |-
      Een aanvraag als bedoeld in het tweede lid wordt ingediend in het kalenderjaar waarin de bijzondere omstandigheden
      zich hebben aangediend. Onze minister besluit binnen zes maanden na ontvangst van een in het tweede lid bedoelde
      aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze minister de aanvrager
      daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel85a
  - number: 85a.4
    text: |-
      Onze minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel85a
  - number: 85a.5
    text: |-
      Onze minister kan in verband met de in het tweede lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel85a
  - number: '86.1'
    text: 'De bekostiging voor de exploitatiekosten van de scholen heeft betrekking op de volgende componenten:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: 86.1.a
    text: onderhoud van het gebouw en het terrein,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: 86.1.b
    text: energie- en waterverbruik,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: 86.1.c
    text: |-
      middelen, waaronder mede wordt verstaan lesmateriaal als bedoeld in [artikel 6e][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6e
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 86.1.d
    text: administratie, beheer en bestuur,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: 86.1.e
    text: loopbaanoriëntatie en -begeleiding,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: 86.1.f
    text: schoonmaken, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: 86.1.g
    text: publiekrechtelijke heffingen, met uitzondering van belastingen ter zake van onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: '86.2'
    text: |-
      De bekostiging wordt zodanig vastgesteld dat zij voldoet aan de redelijke behoeften van een in normale
      omstandigheden verkerende school.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: '86.3'
    text: 'De bekostiging omvat:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: 86.3.a
    text: een vast bedrag per school,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: 86.3.b
    text: een bedrag dat afhankelijk is van de normatieve ruimtebehoefte per leerling,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: 86.3.c
    text: een bedrag dat afhankelijk is van het aantal leerlingen van de school, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: 86.3.d
    text: |-
      voor scholen met leerwegondersteunend onderwijs dat op grond van artikel 75c in aanmerking is gebracht voor
      bekostiging een bedrag dat afhankelijk is van het aantal leerlingen in dat onderwijs voor wie de regionale
      verwijzingscommissie heeft bepaald dat zij op dat onderwijs zijn aangewezen of toelaatbaar zijn tot het
      praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: '86.4'
    text: |-
      De in het derde lid onder a tot en met c bedoelde bedragen kunnen per schoolsoort en per groep van leerlingen
      verschillen. De in het derde lid onder b en c bedoelde bedragen kunnen bovendien verschillen voor:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: 86.4.a
    text: de eerste twee leerjaren van de school, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: 86.4.b
    text: de overige leerjaren.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: '86.5'
    text: |-
      Bij ministeriële regeling worden jaarlijks voor 1 oktober de in het derde lid onder a tot en met d bedoelde
      bedragen vastgesteld. Bij deze regeling worden tevens nadere voorschriften gegeven omtrent de wijze waarop de
      bekostiging wordt berekend, alsmede voorschriften omtrent de wijze waarop de bekostiging wordt vastgesteld. De
      vastgestelde bedragen gelden voor het kalenderjaar dat aanvangt na het tijdstip van vaststelling.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: '86.6'
    text: |-
      Bij de vaststelling van de in het derde lid onder a tot en met c bedoelde bedragen, dan wel als tussentijdse
      aanpassing van die bedragen, worden volgens bij ministeriële regeling te geven regels loon- en prijsontwikkelingen
      verwerkt, tenzij de toestand van 's Rijks schatkist zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: '86.7'
    text: |-
      De ministeriële regeling, bedoeld in het vijfde lid, wordt bekendgemaakt in de Staatscourant, onder gelijktijdige
      overlegging aan de Tweede Kamer der Staten-Generaal. De ministeriële regeling treedt niet eerder in werking dan
      nadat 4 weken zijn verstreken na het overleggen aan de Tweede Kamer en gedurende die termijn niet door of namens de
      Kamer de wens tot overleg over de regeling te kennen wordt gegeven, dan wel met de Tweede Kamer overleg is gevoerd.
      De eerste tot en met derde volzin zijn van overeenkomstige toepassing ten aanzien van tussentijdse aanpassingen als
      bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel86
  - number: '89.1'
    text: |-
      Indien bijzondere ontwikkelingen in het voortgezet onderwijs daartoe aanleiding geven, kunnen bij ministeriële
      regeling voorschriften worden vastgesteld omtrent het verstrekken van aanvullende bekostiging voor
      exploitatiekosten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel89
  - number: '89.2'
    text: |-
      Indien bijzondere ontwikkelingen in het voortgezet onderwijs aan een school daartoe aanleiding geven, kan Onze
      minister op verzoek van het bevoegd gezag onder door hem te stellen voorwaarden en voor een door hem te bepalen
      periode aanvullende bekostiging voor exploitatiekosten verstrekken. Het verzoek wordt ingediend in het kalenderjaar
      waarin deze ontwikkelingen zijn aangevangen. Onze minister besluit binnen vier maanden na ontvangst van het
      verzoek. Indien de beschikking niet binnen vier maanden kan worden gegeven, stelt Onze minister de verzoeker
      daarvan in kennis en noemt hij daarbij een termijn waarop de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel89
  - number: '89.3'
    text: |-
      Onze minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel89
  - number: '89.4'
    text: |-
      Onze minister kan in verband met de in het tweede lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel89
  - number: 96c.1
    text: |-
      De gemeente bekostigt aan het bevoegd gezag van een andere dan een gemeentelijke school dat is onderworpen aan een
      of meer van de in [artikel 220 van de Gemeentewet][ref1] bedoelde belastingen ter zake van onroerende zaken, het
      bedrag dat is uitgegeven voor de belastingen met betrekking tot de in de gemeente gelegen gebouwen en terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96c.1
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
  - number: 96d.1
    text: |-
      Met inachtneming van de [artikelen 84 tot en met 85][ref1] en [86, eerste lid][ref2], verstrekt het Rijk jaarlijks
      aan het bevoegd gezag van openbare en bijzondere scholen een bekostigingsbedrag ten behoeve van de personeels- en
      exploitatiekosten gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel86
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '84'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '86'
        hoofdstuk: II
        paragraaf: '3'
        afdeling: II
  - number: 96d.2
    text: |-
      In geval van het verstrekken van aanvullende bekostiging als bedoeld in [artikel 85a][ref1] of [artikel 89][ref2]
      verstrekt het Rijk aan het desbetreffende bevoegd gezag het bedrag van deze bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel89
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 85a
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '89'
        hoofdstuk: II
        paragraaf: '3'
        afdeling: II
  - number: 96g.1
    text: |-
      Indien in een gemeente uitsluitend een of meer andere rechtspersonen dan de gemeente openbare scholen in stand
      houden dan wel openbare scholen ontbreken en de gemeente uitgaven wil doen voor het desbetreffende onderwijs welke
      niet door het Rijk worden bekostigd, stelt de gemeenteraad bij verordening een regeling daarvoor vast en zijn de
      [artikelen 96i tot en met 96k][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
  - number: 96g.2
    text: |-
      De regeling, bedoeld in het eerste lid, maakt geen onderscheid tussen openbaar en bijzonder onderwijs en voorziet
      in een behandeling van scholen naar dezelfde maatstaf.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96g
  - number: 96g.3
    text: |-
      De regeling, bedoeld in het eerste lid, bevat in elk geval de voorzieningen die door het bevoegd gezag van een in
      de gemeente gelegen, niet door de gemeente in stand gehouden school kunnen worden aangevraagd en de procedure voor
      het doen van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96g
  - number: 96g.4
    text: |-
      De gemeenteraad kan besluiten dat burgemeester en wethouders de regeling, bedoeld in het eerste lid, tijdelijk
      kunnen aanvullen met nieuwe voorzieningen. De aanvulling wordt binnen 1 week aan de bevoegde gezagsorganen van de
      niet door de gemeente in stand gehouden scholen gezonden. Binnen 12 weken na de totstandkoming van de aanvulling
      wordt deze voorgelegd aan de gemeenteraad en besluit de gemeenteraad over de bekrachtiging ervan. Indien de
      gemeenteraad niet binnen 12 weken een besluit heeft genomen, wordt de aanvulling gelijkgesteld met een aanvulling
      die is bekrachtigd. Een afwijzing van de aanvulling door de gemeenteraad heeft geen gevolgen voor aanvragen waarop
      reeds is besloten of die reeds zijn ingediend en die voorzieningen betreffen waarop de aanvulling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96g
  - number: 96g.5
    text: |-
      [Artikel 8:2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de regeling, bedoeld in het eerste
      lid, dan wel een wijziging daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 96g.6
    text: |-
      Voor de toepassing van dit artikel wordt een nevenvestiging aangemerkt als een nevenvestiging die is gelegen in de
      gemeente van de hoofdvestiging. De gemeenteraad kan in de verordening, bedoeld in het eerste lid, aan burgemeester
      en wethouders de bevoegdheid verlenen om, met inachtneming van de in die verordening gestelde regels, te besluiten
      dat in de gemeente gelegen nevenvestigingen van scholen waarvan de hoofdvestiging is gelegen in een andere
      gemeente in afwijking van de eerste volzin in aanmerking komen voor een of meer van de in de regeling genoemde
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96g
  - number: 96g.7
    text: |-
      Burgemeester en wethouders maken jaarlijks in een van overheidswege uitgegeven blad of een dag-, nieuws- of huis-
      aan-huisblad, dan wel op een andere geschikte wijze, een overzicht bekend van de op grond van de regeling, bedoeld
      in het eerste lid, toegekende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96g
  - number: 96g1.1
    text: |-
      Indien de gemeenteraad ten aanzien van een of meer door de gemeente in stand gehouden openbare scholen besluit dat
      deze met ingang van een datum die is gelegen in de periode die aanvangt met een bij koninklijk besluit te bepalen
      datum en eindigt met ingang van het negende kalenderjaar daaropvolgend, in stand zullen worden gehouden door een
      of meer andere rechtspersonen dan de gemeente, kan de regeling, bedoeld in [artikel 96g, eerste lid][ref1], dan
      wel de regeling, bedoeld in [artikel 96h, eerste lid][ref2], bij effectuering van dat besluit ten aanzien van die
      scholen en in afwijking van [artikel 96g, tweede lid][ref3], dan wel een regeling op grond van dit artikel bij
      effectuering van dat besluit ten aanzien van die scholen, erin voorzien dat door de gemeente aan een of meer andere
      rechtspersonen dan de gemeente die die scholen in stand houden, bekostiging voor administratie, beheer en bestuur
      wordt toegekend als aangegeven in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96g
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96h
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel96g
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96g1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96g
        hoofdstuk: III
        paragraaf: '6'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96h
        hoofdstuk: III
        paragraaf: '6'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 96g
        hoofdstuk: III
        paragraaf: '6'
        afdeling: II
  - number: 96g1.2
    text: |-
      De bekostiging, die op grond van het eerste lid kan worden toegekend, bedraagt gedurende het eerste en het
      tweede kalenderjaar volgend op het tijdstip waarop de scholen, bedoeld in het eerste lid, niet langer door de
      gemeente in stand worden gehouden, maximaal 4 maal 18% van de bekostiging voor de exploitatiekosten, op grond
      van [artikel 86][ref1], en gedurende het derde, vierde en het vijfde kalenderjaar maximaal 3 maal 18% van die
      bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel86
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96g1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '86'
        hoofdstuk: II
        paragraaf: '3'
        afdeling: II
  - number: 96g1.3
    text: |-
      Indien de gemeenteraad besluit scholen niet langer in stand te houden vanaf een andere datum dan 1 augustus
      dan geldt als het eerste kalenderjaar, bedoeld in het tweede lid, het deel van het kalenderjaar dat volgt op de
      datum waarop de gemeente die scholen niet langer in stand houdt en bedraagt de bekostiging die voor dat eerste
      kalenderjaar maximaal kan worden toegekend voor administratie, beheer en bestuur een evenredig deel van de
      bekostiging die op grond van het tweede lid maximaal kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96g1
  - number: 96g1.4
    text: |-
      Voor de toepassing van het tweede lid wordt per school uitgegaan van de bekostiging voor exploitatiekosten voor het
      kalenderjaar direct voorafgaand aan het tijdstip waarop door de gemeente de desbetreffende school niet langer in
      stand wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96g1
  - number: 96g1.5
    text: |-
      De op grond van het eerste lid toe te kennen bekostiging kan in een kalenderjaar niet hoger zijn dan de in het
      daaraan voorafgaande kalenderjaar op grond van dit artikel toegekende bekostiging. De eerste volzin is niet van
      toepassing ten aanzien van de bekostiging voor het tweede kalenderjaar indien de bekostiging voor het eerste
      kalenderjaar is bepaald op grond van het derde lid. Bij de toepassing van de eerste volzin blijft het teruggestorte
      bedrag, bedoeld in het zevende lid, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96g1
  - number: 96g1.6
    text: |-
      Het bevoegd gezag dat een school als bedoeld in het eerste lid in stand houdt die voor die tijd door de gemeente
      in stand werd gehouden, legt aan die gemeente en aan de andere rechtspersonen die een of meer niet door de gemeente
      in stand gehouden scholen in die gemeente in stand houden, jaarlijks een verklaring van een accountant als bedoeld
      in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] over met betrekking tot de uitgaven en
      ontvangsten voor administratie, beheer en bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96g1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 96g1.7
    text: |-
      Voor zover voor een school als bedoeld in het eerste lid, de bekostiging, bedoeld in het eerste lid, vermeerderd
      met 18% van de bekostiging voor de exploitatiekosten, op grond van [artikel 86][ref1], in een kalenderjaar niet
      volledig is aangewend voor uitgaven voor administratie, beheer en bestuur, wordt het verschil door het bevoegd
      gezag, bedoeld in het zesde lid, teruggestort in de gemeentekas.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel86
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96g1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '86'
        hoofdstuk: II
        paragraaf: '3'
        afdeling: II
  - number: 96h.1
    text: |-
      Indien een gemeente zelf een of meer openbare scholen in stand houdt en zij uitgaven wil doen ten behoeve van het
      voorbereidend wetenschappelijk onderwijs, het algemeen voortgezet onderwijs, het voorbereidend beroepsonderwijs of
      het praktijkonderwijs welke niet door het Rijk worden bekostigd, kan de gemeenteraad daarvoor bij verordening een
      regeling vaststellen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96h
  - number: 96h.2
    text: |-
      [Artikel 96g, tweede tot en met zevende lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96g
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96g
        hoofdstuk: III
        paragraaf: '6'
        afdeling: II
  - number: 96i.1
    text: |-
      Indien een gemeente een of meer scholen in stand houdt, stellen burgemeester en wethouders jaarlijks met betrekking
      tot die scholen voorlopig vast:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96i
  - number: 96i.1.a
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      personeelskosten,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96i
  - number: 96i.1.c
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      exploitatiekosten,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96i
  - number: 96i.1.d
    text: |-
      het totaal van de ontvangsten, bedoeld in [artikel 85][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '85'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: 96i.1.f
    text: |-
      het totaal van de ontvangsten dat is gebaseerd op de bedragen die krachtens [artikel 86][ref1]
      voor de exploitatiekosten voor dat kalenderjaar zijn vastgesteld, alsmede de bedragen die krachtens
      [artikel 99, tweede lid tweede volzin][ref2], voor voorzieningen in de exploitatie worden aangewend,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel99
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '86'
        hoofdstuk: II
        paragraaf: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '99'
        hoofdstuk: IV
        afdeling: II
  - number: 96i.1.g
    text: |-
      het totaal van de aanvullende ontvangsten waaronder worden verstaan de bedragen die krachtens artikel 89 voor de
      exploitatiekosten voor dat kalenderjaar zijn vastgesteld,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96i
  - number: 96i.1.h
    text: |-
      het bedrag dat de gemeente in het voorafgaande kalenderjaar heeft uitgegeven ten behoeve van de instandhouding van
      een rechtspersoon als bedoeld in [artikel 53b][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53b
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53b
        hoofdstuk: IV
        afdeling: I
  - number: 96i.1.i
    text: een staat van voorzieningen die zijn ingesteld ten behoeve van het openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96i
  - number: 96i.2
    text: |-
      Indien de gemeente een deel van de ontvangsten, bedoeld in het eerste lid onderdeel d, dan wel een deel van de
      ontvangsten, bedoeld in de onderdelen f of g van dat lid, toevoegt aan een voorziening, wordt dat deel aangemerkt
      als een uitgave als bedoeld in dat lid onderdeel a, onderscheidenlijk als een uitgave als bedoeld in de onderdelen
      c of h van dat lid. Indien de gemeente bedragen aan een voorziening onttrekt, worden deze aangemerkt als
      ontvangsten, bedoeld in het eerste lid onderdeel d, onderscheidenlijk als ontvangsten als bedoeld in de onderdelen
      f of g van dat lid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96i
  - number: 96i.3
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen c, f, g en h, worden buiten
      beschouwing gelaten de uitgaven en ontvangsten voor administratie, beheer en bestuur, bedoeld in
      [artikel 86, eerste lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel86
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '86'
        hoofdstuk: II
        paragraaf: '3'
        afdeling: II
  - number: 96i.4
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid onderdeel a en d, worden buiten beschouwing
      gelaten de bedragen die door de gemeente met toepassing van [artikel 118b, eerste lid][ref1], in het
      voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de personeelskosten, onderscheidenlijk de daarop
      betrekking hebbende ontvangsten. Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen
      a, c en h worden voorts buiten beschouwing gelaten de uitgaven die worden gedekt door ontvangsten van bedragen
      die door derden zijn betaald, de uitgaven die worden gedekt door ontvangsten op grond van een besluit als
      bedoeld in [artikel 96g, zesde lid][ref2], tweede volzin, en de uitgaven voor de voorzieningen waarvoor het
      bevoegd gezag van een niet door de gemeente in stand gehouden school op grond van de regeling, bedoeld in
      [artikel 96h, eerste lid][ref3], een aanvraag bij de gemeente kon indienen en wel gedurende de periode waarvoor een
      dergelijke aanvraag kon worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96g
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel96h
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118b
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96g
        hoofdstuk: III
        paragraaf: '6'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 96h
        hoofdstuk: III
        paragraaf: '6'
        afdeling: II
  - number: 96i.5
    text: |-
      Indien de gemeente een deel van de bekostiging voor personeels- en exploitatiekosten overdraagt aan een ander
      bevoegd gezag, wordt dat deel aangemerkt als een uitgave als bedoeld in het eerste lid, onderdeel a of onderdeel
      c. Indien door een ander bevoegd gezag een deel van de bekostiging voor personeels- en exploitatiekosten aan de
      gemeente wordt overgedragen, wordt dat deel aangemerkt als een ontvangst als bedoeld in het eerste lid, onderdeel
      d, of onderdeel f.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96i
  - number: 96i.6
    text: |-
      Om de vijf jaar stellen burgemeester en wethouders voorlopig vast het totaal van de vastgestelde uitgaven en
      ontvangsten in de voorafgaande vijf kalenderjaren, zoals in het eerste tot en met vijfde lid is aangegeven.
      Indien de uitgaven hoger zijn dan de ontvangsten, bepalen burgemeester en wethouders tevens het bedrag van de
      overschrijding. Indien een gemeente vanaf een tijdstip binnen een periode van vijf jaar als bedoeld in de eerste
      volzin geen school in stand houdt, stellen burgemeester en wethouders in afwijking van die volzin zo spoedig
      mogelijk na dat tijdstip voorlopig vast het totaal van de vastgestelde uitgaven en ontvangsten in het aan dat
      tijdstip voorafgaande deel van de periode van vijf jaar, zoals in het eerste tot en met vijfde lid is aangegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96i
  - number: 96i.7
    text: |-
      Na sluiting van de rekening van de gemeente stellen burgemeester en wethouders de in het eerste en zesde lid
      bedoelde bedragen, zo nodig gewijzigd, vast. In het geval de uitgaven hoger zijn dan de ontvangsten, bedoeld in het
      zesde lid, drukken burgemeester en wethouders vervolgens het bedrag van de overschrijding, bedoeld in genoemd lid,
      uit in een percentage van het totaal van de ontvangsten, bedoeld in het eerste lid onderdelen d tot en met g. Het
      percentage wordt afgerond tot twee decimalen. Afronding naar beneden vindt plaats indien de derde decimaal kleiner
      is dan 5, en naar boven indien deze decimaal ten minste 5 bedraagt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96i
  - number: 96i.8
    text: |-
      Voor de toepassing van de [artikelen 96i tot en met 96k][ref1] worden uitgaven ten behoeve van een nevenvestiging
      aangemerkt als uitgaven ten behoeve van de hoofdvestiging van de school waaraan de nevenvestiging is verbonden.
      Indien ten behoeve van een school of nevenvestiging uitgaven worden gedaan door meer dan één gemeente, worden deze
      uitgaven aangemerkt als uitgaven van de gemeente op wier grondgebied de hoofdvestiging is gelegen. In het geval,
      bedoeld in de vorige volzin worden de besluiten ingevolge de [artikelen 96i tot en met 96k][ref2] genomen door
      laatstbedoelde gemeente en hebben deze mede betrekking op de uitgaven van de andere gemeente of gemeenten. Voor de
      toepassing van de [artikelen 96i tot en met 96k][ref3] wordt een nevenvestiging aangemerkt als een nevenvestiging
      die is gelegen in de gemeente van de hoofdvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
  - number: 96i.9
    text: |-
      Burgemeester en wethouders kunnen in overeenstemming met het bevoegd gezag van een niet door de gemeente in stand
      gehouden school besluiten dat met betrekking tot een of meer scholen van dat bevoegd gezag uitgaven die de gemeente
      doet ten behoeve van een door haar in stand gehouden school buiten beschouwing worden gelaten bij het vaststellen
      van de bedragen, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96i
  - number: 96j.1
    text: |-
      In het jaar volgend op de definitieve vaststelling, bedoeld in [artikel 96i, zevende lid][ref1], wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door de gemeente in stand gehouden school
      die gedurende een of meer jaren van het desbetreffende tijdvak in de gemeente was gevestigd, aanspraak heeft.
      Dit overschrijdingsbedrag wordt vastgesteld door het percentage, bedoeld in [artikel 96i, zevende lid][ref2],
      te vermenigvuldigen met het totaal van de ontvangsten van een niet door de gemeente in stand gehouden school
      dat is gebaseerd op de bedragen die krachtens de [artikelen 84, eerste tot en met derde lid][ref3], [85][ref4]
      en [86][ref5] voor het desbetreffende tijdvak zijn vastgesteld, met dien verstande dat bij het vaststellen
      van het totaal van de ontvangsten, bedoeld in de vorige volzin, buiten beschouwing blijven de ontvangsten voor
      administratie, beheer en bestuur, bedoeld in [artikel 86, eerste lid, onderdeel d][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel84
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel85
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel86
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel86
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96j
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
      - id: ref2
