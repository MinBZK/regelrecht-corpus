  - number: '59'
    text: |-
      Onze minister kan de aanwijzing intrekken, indien niet langer wordt voldaan aan de [artikelen 56][ref1] en
      [58][ref2], met uitzondering van artikel 58, zevende lid, onderdeel f, of indien van misbruik van de verleende
      aanwijzing is gebleken. De aanwijzing kan door Onze minister tevens worden ingetrokken indien het schoolbestuur of
      het personeel van de school in strijd handelt met [artikel 5:20 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '56'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '58'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '60.1'
    text: |-
      Jaarlijks geeft het College voor examens gelegenheid om door het met gunstig gevolg afleggen van een staatsexamen,
      een diploma te verkrijgen, overeenkomende met een diploma van een school voor voorbereidend wetenschappelijk
      onderwijs, voor hoger algemeen voortgezet onderwijs , voor middelbaar algemeen voortgezet onderwijs en voor
      voorbereidend beroepsonderwijs, als bedoeld in [artikel 29, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '60.2'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald, welke andere diploma's kunnen worden verkregen door het met
      gunstig gevolg afleggen van een staatsexamen voor het College voor examens.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel60
  - number: '60.3'
    text: |-
      Zij, die zijn afgewezen bij het eindexamen van een school, worden niet toegelaten tot het in hetzelfde jaar te
      houden overeenkomstige staatsexamen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel60
  - number: '60.4'
    text: De staatsexamens zijn openbaar, behoudens het schriftelijke gedeelte.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel60
  - number: '60.5'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in dit artikel bedoelde examens, die
      niet voor alle kandidaten dezelfde vakken en andere programma-onderdelen behoeven te omvatten. Daarbij kan worden
      bepaald het bedrag, dat voor de toelating tot deze examens verschuldigd is. Tevens kan daarbij worden bepaald dat
      dit bedrag is verschuldigd door het bevoegd gezag van een school ten aanzien waarvan toepassing is gegeven aan
      [artikel 29, lid 1a][ref1], of door het bevoegd gezag van een instelling ten aanzien waarvan toepassing is gegeven
      aan [artikel 6a.2.1 van de Wet educatie en beroepsonderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 6a
  - number: '60.6'
    text: |-
      [Artikel 30a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel30a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 30a
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '61.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen inrichtingen voor voortgezet onderwijs als bedoeld in
      [artikel 5, onderdeel e][ref1], worden aangewezen die voor bekostiging uit 's Rijks kas in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '5'
  - number: '61.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor de aangewezen inrichtingen voor voortgezet onderwijs
      voorschriften worden gegeven voor de toepassing van de bij of krachtens deze wet vastgestelde voorschriften over:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel61
  - number: 61.2.a
    text: de inrichting van het onderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel61
  - number: 61.2.b
    text: de examens,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel61
  - number: 61.2.c
    text: de rechtspositie van het personeel,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel61
  - number: 61.2.d
    text: de benoembaarheidsvereisten van het personeel, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel61
  - number: 61.2.e
    text: de aanvang, wijze en beëindiging van de bekostiging.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel61
  - number: '64.1'
    text: Bekostiging uit de openbare kas van een school neemt geen aanvang dan krachtens de bepalingen van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel64
  - number: '64.2'
    text: |-
      [Artikel 4:32 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de bekostiging van scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '65.1'
    text: |-
      Onze Minister brengt voor bekostiging in aanmerking een school waarvan redelijkerwijs kan worden aangenomen
      dat deze, gelet op de belangstelling voor de desbetreffende schoolsoort, de verlangde richting en het
      leerlingenverloop, blijkens statistische gegevens, onder meer verstrekt door het Centraal Bureau voor de
      Statistiek, zal worden bezocht door ten minste:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel65
  - number: 65.1.a
    text: 390 leerlingen, wat een school voor voorbereidend wetenschappelijk onderwijs betreft;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel65
  - number: 65.1.b
    text: 325 leerlingen, wat een school en 130 leerlingen wat een afdeling voor hoger algemeen voortgezet onderwijs betreft;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel65
  - number: 65.1.c
    text: 260 leerlingen, wat een school voor middelbaar algemeen voortgezet onderwijs betreft;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel65
  - number: 65.1.d
    text: |-
      260 leerlingen, wat een school voor voorbereidend beroepsonderwijs met één afdeling als bedoeld in artikel
      10c betreft, met dien verstande dat meer dan één afdeling binnen de desbetreffende nieuw te vormen school voor
      bekostiging in aanmerking wordt gebracht, indien voor elke afdeling aannemelijk wordt gemaakt dat deze door ten
      minste 160 leerlingen zal worden bezocht, of
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel65
  - number: 65.1.e
    text: 120 leerlingen, wat een school voor praktijkonderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel65
  - number: '65.2'
    text: |-
      Een scholengemeenschap die twee of meer van de in het eerste lid genoemde scholen omvat, wordt in ieder geval voor
      bekostiging in aanmerking gebracht indien op dezelfde manier als volgens het eerste lid kan worden aangetoond, dat
      het aantal leerlingen van elk van de samenstellende scholen ten minste drie kwart zal bedragen van het daarvoor in
      het eerste lid genoemde aantal.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel65
  - number: '65.3'
    text: |-
      Een op grond van het eerste of tweede lid voor bekostiging in aanmerking gebrachte school of scholengemeenschap
      wordt aangeduid als hoofdvestiging.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel65
  - number: '65.4'
    text: |-
      Onze Minister kan voor bekostiging in aanmerking brengen een school waarvoor een aanvraag als bedoeld in
      [artikel 67, eerste lid][ref1], is ingediend. Onze Minister brengt voor bekostiging in aanmerking een school
      waarvoor een aanvraag als bedoeld in [artikel 67, tweede lid][ref2], is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel67
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '67'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '67'
        afdeling: I
  - number: '65.5'
    text: |-
      Onverminderd [artikel 3:41 van de Algemene wet bestuursrecht][ref1] worden de besluiten, bedoeld in het eerste,
      tweede en vierde lid, gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '66.1'
    text: |-
      Het bevoegd gezag kan bij Onze Minister een aanvraag indienen om een school of scholengemeenschap voor bekostiging
      in aanmerking te brengen. De aanvraag wordt ingediend voor 1 november.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel66
  - number: '66.2'
    text: |-
      Elke aanvraag vermeldt de schoolsoorten, de verlangde richting en de plaats van vestiging van de school of
      scholengemeenschap en gaat vergezeld van een prognose over de te verwachten omvang. Een aanvraag voor een school
      voor praktijkonderwijs wordt ingediend in overeenstemming met de bevoegde gezagsorganen in het samenwerkingsverband
      waarvan de school deel gaat uitmaken en na overleg met de gemeente.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel66
  - number: '66.3'
    text: |-
      Onze Minister besluit met inachtneming van [artikel 65][ref1] voor 1 mei volgend op de aanvraag of de school of
      scholengemeenschap voor bekostiging in aanmerking wordt gebracht. Indien het besluit niet voor 1 mei kan worden
      genomen, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen het besluit
      wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel65
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '65'
        afdeling: I
  - number: '66.4'
    text: |-
      De bekostiging vangt aan op 1 augustus van enig kalenderjaar, ten vroegste in het eerste en ten laatste in het
      zesde kalenderjaar na het besluit van Onze Minister. Behoudens in het laatste geval vangt de bekostiging aan
      in het kalenderjaar volgend op het kalenderjaar waarin het bevoegd gezag, voor 1 augustus, heeft aangetoond dat
      burgemeester en wethouders van de desbetreffende gemeente uiterlijk met ingang van 1 augustus van het eerstgenoemde
      kalenderjaar de benodigde huisvesting ter beschikking zullen stellen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel66
  - number: '67.1'
    text: |-
      Gedeputeerde staten dragen er zorg voor dat is voorzien in de behoefte aan openbaar onderwijs door een voldoende
      aantal scholen in de provincie. Daartoe kunnen gedeputeerde staten burgemeester en wethouders van de gemeente
      opdragen, een aanvraag bij Onze Minister in te dienen om een openbare school voor bekostiging in aanmerking te
      brengen indien de ouders, voogden en verzorgers van een naar hun oordeel voldoende groot aantal leerlingen hebben
      aangegeven dat zij dat wensen en burgemeester en wethouders van de gemeente daaraan niet hebben voldaan.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel67
  - number: '67.2'
    text: |-
      Onze Minister kan burgemeester en wethouders van de gemeente opdragen een aanvraag bij hem in te dienen om een
      openbare school voor bekostiging in aanmerking te brengen, indien gedeputeerde staten het eerste lid niet toepassen
      en ouders, voogden of verzorgers van een naar zijn oordeel voldoende groot aantal leerlingen hebben aangegeven dat
      zij indiening van een dergelijke aanvraag wensen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel67
  - number: '67.3'
    text: |-
      Indien een besluit van Onze Minister op een aanvraag als bedoeld in dit artikel onherroepelijk is geworden,
      gaan burgemeester en wethouders van de gemeente over tot stichting van de daarbij voor bekostiging in aanmerking
      gebrachte school.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel67
  - number: '67.4'
    text: |-
      De bekostiging vangt aan op 1 augustus van enig kalenderjaar, ten vroegste in het eerste en ten laatste in het
      zesde kalenderjaar na het besluit van Onze Minister, afhankelijk van het moment dat burgemeester en wethouders van
      de gemeente huisvesting ter beschikking hebben.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel67
  - number: '68.1'
    text: |-
      Onze Minister brengt voor bekostiging in aanmerking een nieuw te vormen afdeling als bedoeld in [artikel 10c][ref1]
      aan een reeds bekostigde school voor voorbereidend beroepsonderwijs indien redelijkerwijs kan worden aangenomen
      dat deze afdeling, gelet op de belangstelling voor de desbetreffende afdeling, de verlangde richting en het
      leerlingenverloop, blijkens statistische gegevens, onder meer verstrekt door het Centraal Bureau voor de
      Statistiek, zal worden bezocht door ten minste 260 leerlingen, met dien verstande dat meer dan één afdeling voor
      bekostiging in aanmerking wordt gebracht indien voor elke nieuw te vormen afdeling aannemelijk wordt gemaakt dat de
      desbetreffende afdeling door ten minste 160 leerlingen zal worden bezocht.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '68.2'
    text: |-
      [Artikel 65, vijfde lid][ref1], en [artikel 66][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel66
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '65'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '66'
        afdeling: I
  - number: '69.1'
    text: |-
      Leerwegondersteunend onderwijs komt voor bekostiging in aanmerking voor zover de school of een daaraan
      uiterlijk op 1 augustus 2002 verbonden school of afdeling voor bekostiging van dat onderwijs in
      aanmerking kwam op grond van [artikel II, eerste of tweede lid][ref1], [artikel IV, eerste lid][ref2], of
      __REF002___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _________________________________________________________________________________ (Stb. 1998, 337).


      [ref1]: https://wetten.overheid.nl/BWBR0009638#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0009638#ArtikelIV
      [ref3]: https://wetten.overheid.nl/BWBR0009638#ArtikelIVA
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0009638
        artikel: II
      - id: ref2
        bwb_id: BWBR0009638
        artikel: IV
      - id: ref3
        bwb_id: BWBR0009638
        artikel: IVA
  - number: '69.2'
    text: |-
      Onze Minister kan op aanvraag van het bevoegd gezag van een school of scholengemeenschap dat is aangesloten
      bij een samenwerkingsverband als bedoeld in [artikel 10h][ref1] leerwegondersteunend onderwijs voor
      bekostiging in aanmerking brengen indien dat doelmatig is gelet op het geheel en de spreiding van het aanbod
      van leerwegondersteunend onderwijs en de meerderheid van de bevoegde gezagsorganen van de overige scholen en
      scholengemeenschappen in het desbetreffende samenwerkingsverband instemt met de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10h
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10h
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '70.1'
    text: |-
      Onze Minister kan, onder door hem te stellen voorwaarden, voor bekostiging in aanmerking brengen een school die
      wordt opgericht door omzetting van een bekostigde openbare school in een gelijksoortige bijzondere school.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel70
  - number: '70.2'
    text: |-
      Onze Minister brengt voor bekostiging in aanmerking een school die wordt opgericht door omzetting van een
      bekostigde bijzondere school in een gelijksoortige openbare school of door omzetting van een bekostigde bijzondere
      school in een gelijksoortige bijzondere school van een andere richting.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel70
  - number: '70.3'
    text: Een omzetting kan slechts plaatsvinden met ingang van 1 augustus van enig kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel70
  - number: '71.1'
    text: |-
      De aanspraak op bekostiging blijft bestaan indien het bevoegd gezag een vestiging van een school of
      scholengemeenschap verplaatst over een hemelsbreed gemeten afstand van minder dan drie kilometer van de vorige
      vestigingsplaats.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel71
  - number: '71.2'
    text: 'Onze Minister kan voor bekostiging in aanmerking brengen:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel71
  - number: 71.2.a
    text: |-
      een school of scholengemeenschap die is ontstaan door samenvoeging van scholen of scholengemeenschappen, indien
      voor elke bij de samenvoeging betrokken school of scholengemeenschap geldt dat ten minste een bij ministeriële
      regeling vast te stellen percentage van de leerlingen van een vestiging van die school of scholengemeenschap en van
      de leerlingen van een vestiging van een andere bij de samenvoeging betrokken school of scholengemeenschap afkomstig
      is uit dezelfde postcodegebieden, of
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel71
  - number: 71.2.b
    text: |-
      een scholengemeenschap die is ontstaan door samenvoeging van een scholengemeenschap als bedoeld in
      [artikel 2.6 van de Wet educatie en beroepsonderwijs][ref1] waarvan een regionaal opleidingencentrum deel uitmaakt,
      met een school voor middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend beroepsonderwijs,
      indien ten minste een bij ministeriële regeling vast te stellen percentage van de leerlingen van een vestiging
      van laatstgenoemde scholengemeenschap en van de leerlingen van een vestiging van een bij de samenvoeging betrokken
      school voor middelbaar algemeen voortgezet onderwijs of voorbereidend beroepsonderwijs, afkomstig is uit dezelfde
      postcodegebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: '71.3'
    text: |-
      Het tweede lid, aanhef en onderdeel b, is van overeenkomstige toepassing op een scholengemeenschap als bedoeld in
      [artikel 2.6 van de Wet educatie en beroepsonderwijs][ref1] waarvan een agrarisch opleidingscentrum deel uitmaakt,
      die wordt samengevoegd met een school voor middelbaar algemeen voorgezet onderwijs, een school voor voorbereidend
      beroepsonderwijs waarin slechts onderwijs wordt verzorgd als bedoeld in [artikel 10c, onderdeel d][ref2], of een
      school voor praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '71.4'
    text: |-
      Na een samenvoeging wordt op een vestiging onderwijs verzorgd in dezelfde schoolsoorten als bedoeld in
      [artikel 5][ref1], in dezelfde afdelingen als bedoeld in [artikel 10c][ref2], en in dezelfde leerjaren als op
      de desbetreffende vestiging voor de samenvoeging, behoudens wijzigingen in het onderwijsaanbod op grond van
      [artikel 68][ref3] of [artikel 72][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel68
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '68'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '72'
        afdeling: I
  - number: '71.5'
    text: |-
      Onze Minister kan voor bekostiging in aanmerking brengen een tijdelijke nevenvestiging als bedoeld
      in [artikel 16][ref1], indien het bevoegd gezag heeft aangetoond dat burgemeester en wethouders van
      de desbetreffende gemeente de benodigde huisvesting ter beschikking zullen stellen. De voorwaarde
      in de eerste volzin is niet van toepassing ten aanzien van scholengemeenschappen als bedoeld in
      [artikel 2.6, eerste lid, van de Wet educatie en beroepsonderwijs][ref2] en scholen waarvoor jaarlijks een bedrag
      voor huisvestingskosten wordt betaald op grond van [artikel 76v][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel76v
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 76v
        hoofdstuk: I
        afdeling: IA
  - number: '71.6'
    text: |-
      [Artikel 65, vijfde lid][ref1], is van overeenkomstige toepassing bij toepassing van het tweede, derde en vijfde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel65
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '65'
        afdeling: I
  - number: '72.1'
    text: |-
      Een bevoegd gezag van een school of scholengemeenschap kan samenwerken met ten minste één ander bevoegd gezag met
      als doel het onderwijsaanbod af te stemmen op de vraag van de leerlingen, ouders en andere belanghebbenden in hun
      regio. Een regio omvat een aaneengesloten gebied bestaande uit het grondgebied van een of meer gemeenten, met dien
      verstande dat:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: 72.1.a
    text: |-
      op de deelnemende vestigingen van scholen of scholengemeenschappen van de samenwerkende bevoegde gezagsorganen per
      gemeente ten minste zestig procent staat ingeschreven van alle leerlingen die op het grondgebied van die gemeente
      voortgezet onderwijs volgen, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: 72.1.b
    text: |-
      ten minste vijfenzestig procent van de bevoegde gezagsorganen die binnen een gemeente een of meer vestigingen van
      scholen of scholengemeenschappen hebben, bij de samenwerking betrokken is.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: '72.2'
    text: |-
      Samenwerkende bevoegde gezagsorganen stellen voor hun regio een regionaal plan onderwijsvoorzieningen vast. Een
      dergelijk plan:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: 72.2.a
    text: |-
      wordt niet vastgesteld voordat over een concept van het plan overleg plaats heeft gevonden met de bevoegde
      gezagsorganen van de overige scholen of scholengemeenschappen in de regio en vertegenwoordigers van de
      desbetreffende provincie of provincies alsmede voor zover het betreft het voorbereidend beroepsonderwijs
      met vertegenwoordigers van het bedrijfsleven in de regio en met de bevoegde gezagsorganen van de regionale
      opleidingencentra en de agrarische opleidingscentra in de regio, aa. wordt niet vastgesteld voordat over
      een concept van het plan op overeenstemming gericht overleg is gevoerd met burgemeester en wethouders van de
      desbetreffende gemeente of gemeenten, overeenkomstig een procedure die daartoe is vastgesteld door de samenwerkende
      bevoegde gezagsorganen en burgemeester en wethouders van die gemeente of gemeenten, welke procedure een voorziening
      voor het beslechten van geschillen bevat,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: 72.2.b
    text: geldt voor een periode van vijf jaar, die aanvangt op 1 augustus van enig kalenderjaar, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: 72.2.c
    text: |-
      bevat een gezamenlijk gedragen visie op het onderwijs in de regio, waarin in elk geval tot uitdrukking worden
      gebracht:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: 72.2.c.1°
    text: de omvang en begrenzing van de regio,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: 72.2.c.2°
    text: gegevens over het aanbod en gebruik van onderwijsvoorzieningen,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: 72.2.c.3°
    text: |-
      een overzicht van de onderwijsvoorzieningen, bedoeld in het derde lid, die de bevoegde gezagsorganen binnen de
      periode, bedoeld in onderdeel b, voor bekostiging in aanmerking willen laten brengen en een prognose van het aantal
      leerlingen per vestiging,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: 72.2.c.4°
    text: de relatie van het bestaande en toekomstige onderwijsaanbod met het vervolgonderwijs en de arbeidsmarkt, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: 72.2.c.5°
    text: |-
      de visie van de deelnemers aan het overleg, bedoeld in onderdelen a en aa, op het bestaande en toekomstige
      onderwijsaanbod in relatie tot het vervolgonderwijs, de arbeidsmarkt en de onderwijshuisvesting.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: '72.3'
    text: |-
      Onze Minister brengt voor bekostiging in aanmerking een onderwijsvoorziening als bedoeld in de onderdelen a tot en
      met f, indien de voorziening is opgenomen in een regionaal plan onderwijsvoorzieningen als bedoeld in het tweede
      lid en indien nodig tevens wordt voldaan aan de in genoemde onderdelen opgenomen voorwaarden. Een bevoegd gezag kan
      bij Onze Minister een aanvraag indienen voor bekostiging van:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: 72.3.a
    text: |-
      een vestiging van een school of scholengemeenschap die door het bevoegd gezag wordt verplaatst over een hemelsbreed
      gemeten afstand van drie kilometer of meer van de huidige vestigingsplaats,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: 72.3.b
    text: |-
      een nieuwe nevenvestiging als bedoeld in [artikel 16][ref1] van een school of scholengemeenschap, indien ten minste
      een bij ministeriële regeling vast te stellen percentage van de leerlingen voor de nieuwe nevenvestiging en van de
      leerlingen van één van de al bestaande vestigingen van de school of scholengemeenschap afkomstig is uit dezelfde
      postcodegebieden,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel16
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 72.3.c
    text: een of meer scholen die door het bevoegd gezag worden afgesplitst van een scholengemeenschap,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: 72.3.d
    text: |-
      onderwijs vanaf het vierde leerjaar op een nevenvestiging als bedoeld in [artikel 16][ref1] aan een school voor
      voorbereidend wetenschappelijk onderwijs als bedoeld in [artikel 7][ref2], of aan een school voor hoger algemeen
      voortgezet onderwijs als bedoeld in [artikel 8][ref3], en onderwijs vanaf het derde leerjaar op een nevenvestiging
      als bedoeld in [artikel 16][ref4] aan een school voor middelbaar algemeen voortgezet onderwijs als bedoeld in
      [artikel 10][ref5], of aan een school voor voorbereidend beroepsonderwijs als bedoeld in [artikel 10a][ref6],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref6
        bwb_id: BWBR0002399
        artikel: 10a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 72.3.e
    text: |-
      onderwijs in de gemengde leerweg aan een school voor middelbaar algemeen voortgezet onderwijs of voorbereidend
      beroepsonderwijs of aan een agrarisch opleidingscentrum voor zover het betreft het voorbereidend beroepsonderwijs,
      indien wordt voldaan aan bij of krachtens algemene maatregel van bestuur te stellen voorwaarden, of
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
  - number: 72.3.f
    text: |-
      een afdeling als bedoeld in [artikel 10c][ref1] met uitzondering van een afdeling als bedoeld in
      [artikel 10c, onderdeel a, onder 6][ref2], en de afdelingen Kust-, Rijn- en Binnenvaart en Haven en Vervoer
      School, aangewezen op grond van [artikel 24, vijfde lid][ref3], indien wordt voldaan aan bij of krachtens algemene
      maatregel van bestuur te stellen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10c
