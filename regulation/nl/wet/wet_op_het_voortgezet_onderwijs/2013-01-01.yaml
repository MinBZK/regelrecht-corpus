  - number: '58.8'
    text: |-
      Voor een school die is aangewezen op grond van [artikel 56][ref1] kan bij ministeriële regeling een nadere
      specificatie worden gegeven van de gegevens, bedoeld in [artikel 103b, tweede lid][ref2], voor zover dat lid van
      overeenkomstige toepassing is verklaard in het zevende lid, onderdeel a, en worden bepaald welke van die gegevens
      niet langer behoeven te worden verstrekt. Bij ministeriële regeling kunnen voorts regels worden gesteld omtrent
      de tijdstippen en de wijze van verstrekking van die gegevens. Bij ministeriële regeling worden regels gesteld ter
      uitvoering van [artikel 103d, eerste en derde lid][ref3], voor zover die leden van overeenkomstige toepassing zijn
      verklaard in het zevende lid, onderdeel c, in ieder geval omtrent de inhoud en de samenstelling van de gegevens,
      de wijze waarop de gegevens worden verstrekt, de tijdstippen waarop de gegevens worden verstrekt, en de perioden
      waarop de gegevens betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel103d
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel58
