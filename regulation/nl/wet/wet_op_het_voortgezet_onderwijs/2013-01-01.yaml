  - number: 24f
    text: |-
      De programma's dan wel beschrijvingen van de contractactiviteiten worden ter kennisneming toegezonden aan de
      inspectie.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24f
  - number: 24g.1
    text: |-
      Het bevoegd gezag van een school legt elke twee jaar in een reglement, leerlingenstatuut genaamd, de rechten en
      plichten van de leerlingen vast.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24g
  - number: 24g.2
    text: |-
      In het leerlingenstatuut worden in elk geval voorschriften opgenomen, strekkende tot handhaving van de goede gang
      van zaken binnen de instelling en, de wijze waarop uitvoering wordt gegeven aan de bescherming van gegevens uit de
      persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24g
  - number: 24g.3
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een exemplaar van het leerlingenstatuut in het gebouw van de instelling
      ter inzage wordt gelegd op een voor de leerlingen toegankelijke plaats.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel24g
  - number: '25'
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs aan een school kan Onze minister toestaan dat
      van de [artikelen 7 tot en met 11f][ref1], [12 tot en met 15][ref2], en van de voorschriften, bedoeld in
      [artikel 22][ref3], wordt afgeweken. Onze minister besluit binnen zes maanden na ontvangst van een aanvraag. Indien
      de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze minister de aanvrager daarvan in kennis en
      noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel22
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '22'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 25a.1
    text: |-
      Het bevoegd gezag kan leerlingen in de gelegenheid stellen in het kader van het onderwijs waarvoor zij aan de
      school zijn ingeschreven:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
  - number: 25a.1.a
    text: |-
      ook onderwijs te ontvangen dat een school van een ander bevoegd gezag of een instelling voor educatie en
      beroepsonderwijs verzorgt, of
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
  - number: 25a.1.b
    text: |-
      deel te nemen aan een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid onder a, van de Wet educatie en beroepsonderwijs][ref1] en die opleiding met een examen
      af te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 25a.2
    text: 'Het eerste lid vindt uitsluitend toepassing met het doel:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
  - number: 25a.2.a
    text: leerlingen met bijzondere kenmerken beter in staat te stellen een diploma als bedoeld in deze wet te behalen,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
  - number: 25a.2.b
    text: leerlingen meer kansen te geven om vervolgonderwijs met gunstig resultaat te volgen, of
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
  - number: 25a.2.c
    text: onderwijsvoorzieningen doelmatiger te gebruiken.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
  - number: 25a.3
    text: |-
      Toepassing van het eerste lid berust op een samenwerkingsovereenkomst, gesloten tussen het bevoegd gezag
      van de school en het bevoegd gezag van de in het eerste lid bedoelde andere school of instelling. De
      samenwerkingsovereenkomst omvat in elk geval:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
  - number: 25a.3.a
    text: het doel van de samenwerking,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
  - number: 25a.3.b
    text: de doelgroep,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
  - number: 25a.3.c
    text: de wijze waarop wordt nagegaan of het doel wordt bereikt,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
  - number: 25a.3.d
    text: het onderwijsprogramma dat volgens de samenwerking wordt vormgegeven,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
  - number: 25a.3.e
    text: |-
      in geval van overdracht van een deel van de bekostiging met toepassing van [artikel 99, achtste lid][ref1], de
      omvang en de bestemming van de over te dragen middelen, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel99
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '99'
        hoofdstuk: IV
        afdeling: II
  - number: 25a.3.f
    text: een regeling voor de beslechting van geschillen tussen partijen over de uitvoering van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
  - number: 25a.4
    text: 'Bij algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
  - number: 25a.4.a
    text: wordt nader geregeld voor welke leerlingen en onder welke voorwaarden het eerste lid toepassing kan vinden,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
  - number: 25a.4.b
    text: |-
      kan bij toepassing van het eerste lid voor doelen als bedoeld in het tweede lid, onder a en b, worden geregeld van
      welke bij of krachtens de [artikelen 10][ref1], [10b][ref2], [10d][ref3], [13 tot en met 15][ref4], [22][ref5],
      [29][ref6], [33 tot en met 36][ref7] en [60][ref8] vastgestelde voorschriften kan worden afgeweken, alsmede welke
      voorschriften in plaats daarvan zullen gelden, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel22
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref7]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref8]: https://wetten.overheid.nl/BWBR0002399#Artikel60
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0002399
        artikel: '22'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref6
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
      - id: ref7
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref8
        bwb_id: BWBR0002399
        artikel: '60'
        afdeling: III
  - number: 25a.4.c
    text: |-
      kan worden bepaald dat een in het eerste lid bedoelde leerling voor de toepassing van daarbij aan te
      wijzen wettelijke voorschriften wordt aangemerkt of mede wordt aangemerkt als deelnemer in de zin van de
      [Wet educatie en beroepsonderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 25a.5
    text: |-
      Indien het bevoegd gezag, bedoeld in het eerste lid, leerlingen in het kader van het onderwijs waarvoor zij aan de
      school zijn ingeschreven, ook onderwijs wil kunnen laten volgen dat een andere school voor voortgezet onderwijs van
      datzelfde bevoegd gezag verzorgt, zijn het eerste, tweede en vierde lid van overeenkomstige toepassing en regelt
      het bevoegd gezag op overeenkomstige wijze de onderwerpen van het derde lid, onder a tot en met e.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel25a
  - number: '26.1'
    text: |-
      Het bevoegd gezag van een school waar een visueel gehandicapte leerling is ingeschreven of een leerling voor
      wie een leerlinggebonden budget beschikbaar is, stelt in overeenstemming met de ouders voor elk schooljaar een
      handelingsplan op. Indien de inschrijving van de in de eerste volzin bedoelde leerling plaatsvindt op of na 1
      augustus wordt het handelingsplan zo spoedig mogelijk doch uiterlijk een maand na die inschrijving opgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel26
  - number: '26.2'
    text: |-
      In het handelingsplan dat betrekking heeft op het laatste schooljaar van de periode gedurende welke voor de
      leerling een leerlinggebonden budget beschikbaar is, wordt aangegeven dat de voortzetting van de voorzieningen die
      voor de leerling zijn getroffen op basis van het leerlinggebonden budget, afhankelijk is van een nieuwe beoordeling
      door een zodanige commissie voor de indicatiestelling.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel26
  - number: '26.3'
    text: Het handelingsplan wordt jaarlijks met de ouders geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel26
  - number: '27.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor elke soort van scholen of voor afdelingen van die
      scholen voorwaarden voor de toelating en voorschriften omtrent verwijdering en voorwaardelijke bevordering worden
      vastgesteld. De algemene maatregel van bestuur bedoeld in de eerste volzin houdt in elk geval voorschriften in
      met betrekking tot de voorwaarden voor de toelating tot de scholen, bedoeld in de [artikelen 7][ref1], [8][ref2],
      [9][ref3] en [10a][ref4]. Definitieve verwijdering van een leerling waarop de [Leerplichtwet 1969][ref5] van
      toepassing is, vindt niet plaats dan nadat het bevoegd gezag ervoor heeft zorggedragen dat een andere school, dan
      wel een instelling als bedoeld in [artikel 1, onder c, van de Leerplichtwet 1969][ref6] bereid is de leerling toe
      te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10a
      [ref5]: https://wetten.overheid.nl/BWBR0002628
      [ref6]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '9'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
