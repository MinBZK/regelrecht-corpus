  - number: 27.1a
    text: |-
      Voor het volgen van een vorm van onderwijs als onderscheiden in [artikel 5][ref1] aan een school wordt uitsluitend
      als leerling toegelaten degene waarvan de ouders, voogden of verzorgers aantonen, dan wel, indien hij meerderjarig
      en handelingsbekwaam is, degene die aantoont dat hij:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '5'
  - number: 27.1a.a
    text: de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27
  - number: 27.1a.b
    text: |-
      vreemdeling is en jonger is dan 18 jaar op de eerste schooldag waarop de vorm van voortgezet onderwijs als
      onderscheiden in [artikel 5][ref1] begint waarvoor voor de eerste maal toelating wordt gewenst,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '5'
  - number: 27.1a.c
    text: |-
      vreemdeling is, 18 jaar of ouder is op de eerste schooldag waarop de vorm van voortgezet onderwijs als
      onderscheiden in [artikel 5][ref1] begint waarvoor voor de eerste maal toelating wordt gewenst en op die dag
      rechtmatig verblijf houdt in de zin van [artikel 8 van de Vreemdelingenwet 2000][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 27.1a.d
    text: |-
      vreemdeling is, niet meer voldoet aan een van de voorwaarden, genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen voor een vorm van voortgezet onderwijs als onderscheiden in [artikel 5][ref1] is
      toegelaten tot een school, welke vorm van voortgezet onderwijs nog steeds wordt gevolgd en nog niet is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '5'
  - number: 27.1b
    text: |-
      Indien na de toelating tot de school blijkt dat deze op welke grond dan ook niet in overeenstemming met lid 1a
      heeft plaatsgevonden, wordt de leerling onmiddellijk verwijderd.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27
  - number: '27.2'
    text: De toelating wordt niet afhankelijk gesteld van een andere dan een bij of krachtens de wet geregelde bijdrage.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27
  - number: '27.3'
    text: |-
      Een leerling mag geen praktijkonderwijs meer volgen aan een school voor praktijkonderwijs na afloop van het
      schooljaar waarin hij de leeftijd van achttien jaren heeft bereikt. Op een daartoe strekkend verzoek van
      het bevoegd gezag, gedaan in het in de eerste volzin bedoelde schooljaar, kan de inspectie toestaan dat de
      leerling het daaropvolgende schooljaar praktijkonderwijs kan blijven volgen, indien zij van mening is dat
      zonder het volgen van dit schooljaar de leerling niet voldoende is voorbereid op de functies, bedoeld in
      [artikel 10f, derde lid, eerste volzin][ref1]. De inspectie kan de tweede volzin op overeenkomstige wijze toepassen
      in het schooljaar waarin de leerling de leeftijd van 19 jaren heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '27.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen, in afwijking van de [artikelen 7:10][ref1] en
      [7:24 van de Algemene wet bestuursrecht][ref2], kortere termijnen dan in de artikelen vermeld, worden bepaald voor
      het op een bezwaar- of beroepschrift te nemen besluit van het bevoegd gezag van een openbare school ter zake van de
      toelating en verwijdering van leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 27a.1
    text: |-
      Het bevoegd gezag stelt van iedere aan de school ingeschreven leerling die valt onder de werking van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1], vast, of deze leerling gedurende
      een aaneengesloten periode van ten minste 5 weken zonder geldige reden niet aan het onderwijs heeft deelgenomen. In
      afwijking van de vorige volzin kan Onze Minister bepalen dat voor soorten van voortgezet onderwijs de in die volzin
      bedoelde vaststelling wordt gedaan indien een ingeschreven studerende in een of meer vakken of andere programma-
      onderdelen niet aan het onderwijs heeft deelgenomen. Onder afwezigheid met geldige reden wordt verstaan afwezigheid
      wegens ziekte van de leerling, welke ziekte uitsluitend kan worden aangetoond door middel van een gedagtekende
      verklaring van een arts, en afwezigheid wegens bijzondere familie-omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 27a.2
    text: |-
      Het bevoegd gezag meldt uiterlijk op de derde werkdag na afloop van een periode van afwezigheid van vier weken aan
      de leerling dat daarvan in de administratie van de school aantekening is gemaakt en verzoekt de leerling om opgaaf
      van de reden van de afwezigheid. Het bevoegd gezag doet daarbij mededeling van de opgave van de gegevens van de
      deelnemer, bedoeld in [artikel 28a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel28a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 28a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27a.3
    text: 'Uiterlijk op de vijfde werkdag na de periode van 8 weken stelt het bevoegd gezag vast:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27a
  - number: 27a.3.a
    text: |-
      of de reden die de leerling binnen 8 weken na de aanvang van de periode van 5 weken gaf voor zijn afwezigheid, een
      geldige is, of
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27a
  - number: 27a.3.b
    text: |-
      dat de leerling binnen 8 weken na de aanvang van de periode van 5 weken geen reden heeft opgegeven voor zijn
      afwezigheid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27a
  - number: 27a.4
    text: |-
      Het bevoegd gezag stelt tevens uiterlijk op de vijfde werkdag na afloop van de periode van 8 weken vast of de
      leerling voor het einde van die periode weer aan het onderwijs is gaan deelnemen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27a
  - number: 27a.5
    text: |-
      Het bevoegd gezag meldt uiterlijk de vijfde werkdag na afloop van een periode van 8 weken aan Onze Minister de
      leerling die gedurende een aaneengesloten periode van ten minste 5 weken zonder opgave van geldige reden niet aan
      het onderwijs heeft deelgenomen. Tevens meldt het indien die leerling voor het einde van de periode van 8 weken
      weer aan het onderwijs is gaan deelnemen de datum ervan.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27a
  - number: 27a.6
    text: |-
      De periode van 5 weken en de periode van 8 weken worden verlengd met de weken waarin vanwege vakantie geen
      onderwijs werd verzorgd. Zij wordt geacht niet te zijn onderbroken door deze vakantieweken.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27a
  - number: 27a.7
    text: |-
      Het bevoegd gezag stuurt gelijktijdig met de mededelingen, bedoeld in het vijfde lid, een afschrift
      van de gegevens die over de betrokken leerling aan Onze Minister zijn verstrekt aan deze betrokkene.
      Het bevoegd gezag geeft daarbij tevens aan dat afwezigheid als bedoeld in het eerste lid, gevolgen
      heeft voor de tegemoetkoming in de onderwijsbijdrage en de schoolkosten van betrokkene op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1], alsmede welke beroepsgang voor
      betrokkene tegen de mededeling, bedoeld in het vijfde lid, open staat.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 27b.1
    text: |-
      Onverminderd bij algemene maatregel van bestuur gegeven voorschriften met betrekking tot de in- en uitschrijving
      van leerlingen, vindt toelating van een leerling als bedoeld in [artikel 27][ref1] slechts plaats nadat door de
      ouders, voogden of verzorgers of, indien de leerling meerderjarig is, door de leerling de gegevens betreffende
      de geslachtsnaam, de voorletters, de geboortedatum, het geslacht en het persoonsgebonden nummer van de leerling
      zijn overgelegd. Indien door de ouders, voogden of verzorgers of, indien de leerling meerderjarig is, door de
      leerling aannemelijk wordt gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, vindt de
      toelating plaats met inachtneming van het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27b.2
    text: |-
      De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt
      document dan wel een door een andere school of een school of instelling voor ander onderwijs verstrekt bewijs van
      uitschrijving, waarin de desbetreffende gegevens zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27b
  - number: 27b.3
    text: |-
      Indien door de ouders, voogden of verzorgers of, indien de leerling meerderjarig is, door de leerling aannemelijk
      wordt gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, meldt het bevoegd gezag
      binnen twee weken na het besluit tot toelating aan Onze Minister de beschikbare gegevens van de leerling, bedoeld
      in het eerste lid, alsmede zijn adres en woonplaats en, indien aanwezig, het leerlingadministratienummer.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27b
  - number: 27b.4
    text: |-
      Onze Minister verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het derde lid, aan het bevoegd
      gezag het burgerservicenummer van de leerling, dan wel, indien is gebleken dat hem niet van overheidswege een
      burgerservicenummer is verstrekt, het onderwijsnummer van de leerling. Het onderwijsnummer is een door Onze
      Minister uitgegeven en aan de leerling toegekend persoonsgebonden nummer.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27b
  - number: 27b.5
    text: |-
      Het bevoegd gezag neemt de in het eerste en vierde lid bedoelde gegevens op in de leerlingenadministratie van de
      school.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27b
  - number: 27b.6
    text: |-
      Indien aan een leerling een onderwijsnummer is toegekend en het bevoegd gezag daarna de beschikking krijgt over
      zijn burgerservicenummer, neemt het bevoegd gezag dit burgerservicenummer terstond als persoonsgebonden nummer
      op in de leerlingenadministratie van de school in de plaats van het onderwijsnummer. Het bevoegd gezag meldt deze
      wijziging binnen twee weken aan Onze Minister onder opgave van het burgerservicenummer en het onderwijsnummer van
      de leerling.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel27b
  - number: '28.1'
    text: |-
      Het bevoegd gezag doet onverwijld opgave aan burgemeester en wethouders van de gemeente waar de betrokkene woon- of
      verblijfplaats heeft van de gegevens van degene
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28
  - number: 28.1.a
    text: |-
      op wie de [Leerplichtwet 1969][ref1] niet meer van toepassing is en die de leeftijd van 23 jaren nog niet heeft
      bereikt,


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 28.1.b
    text: |-
      die niet in het bezit is van een diploma voorbereidend wetenschappelijk
      onderwijs of hoger algemeen voortgezet onderwijs als bedoeld in [artikel 7][ref1]
      onderscheidenlijk [artikel 8][ref2] dan wel een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de Wet educatie en beroepsonderwijs][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 28.1.c
    text: die van de school wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28
  - number: '28.2'
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28
  - number: 28a.1
    text: |-
      Het bevoegd gezag doet onverwijld opgave aan Onze Minister van de gegevens van degene die voldoet aan
      [artikel 28, eerste lid, onderdelen a en b][ref1], en die het onderwijs aan de school gedurende een aaneengesloten
      periode van ten minste vier weken of een door het bevoegd gezag te bepalen kortere periode zonder geldige reden
      niet meer volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel28
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '28'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 28a.2
    text: |-
      Onze Minister neemt de op grond van dit artikel door het bevoegd gezag verstrekte gegevens op in het
      meldingsregister relatief verzuim.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28a
  - number: 28a.3
    text: |-
      Onze Minister bericht burgemeester en wethouders van de gemeente waar de betrokkene woon- of verblijfplaats heeft
      onverwijld na ontvangst van de opgave, bedoeld in het eerste lid, dat een zodanige opgave heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28a
  - number: 28a.4
    text: |-
      Onze Minister verstrekt uit het meldingsregister relatief verzuim aan het betrokken bevoegd gezag en aan
      burgemeester en wethouders van de gemeente waar de betrokkene woon- of verblijfplaats heeft de ter zake van die
      betrokkene geregistreerde gegevens.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28a
  - number: 28a.5
    text: |-
      Burgemeester en wethouders van de gemeente waar de betrokkene woon- of verblijfplaats heeft melden aan Onze
      Minister telkens de status van de behandeling van de ter zake van de betrokkene gedane opgave, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28a
  - number: 28a.6
    text: |-
      Onze Minister neemt de op grond van dit artikel door burgemeester en wethouders verstrekte gegevens op in het
      meldingsregister relatief verzuim.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28a
  - number: 28a.7
    text: |-
      Het betrokken bevoegd gezag en burgemeester en wethouders van de gemeente waar de betrokken leerling woon- of
      verblijfplaats heeft, zijn bevoegd het meldingsregister relatief verzuim te raadplegen voor zover het betreft de
      ter zake van die leerling geregistreerde gegevens.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28a
  - number: 28a.8
    text: |-
      Het bevoegd gezag kan de gegevens, bedoeld in het eerste lid, verstrekken aan burgemeester en wethouders van de
      gemeente waar de betrokkene woon- of verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28a
  - number: 28a.9
    text: |-
      Bij de verwerking van gegevens, bedoeld in dit artikel, wordt het persoonsgebonden nummer van de betrokkene
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28a
  - number: 28a.10
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van de verstrekking van
      gegevens op grond van het eerste en vijfde lid en wordt een nadere specificatie gegeven van de gegevens die op
      grond van het eerste en vijfde lid worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28a
  - number: 28a.11
    text: |-
      De gegevens die worden verstrekt op grond van het eerste lid kunnen persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens][ref1] omvatten, met uitzondering van gegevens over ras,
      politieke gezindheid, seksueel leven of het lidmaatschap van een vakvereniging, voor zover deze persoonsgegevens
      noodzakelijk zijn met het oog op de informatieverstrekking over de achtergronden van het verzuim.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
  - number: 28a.12
    text: |-
      Op verzoek van burgemeester en wethouders van de gemeente waar de betrokkene woon- of verblijfplaats heeft, komen
      hun rechten en verplichtingen als bedoeld in dit artikel toe aan burgemeester en wethouders van de contactgemeente,
      bedoeld in [artikel 118h, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118h
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118h
  - number: 28b
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat aan de leerlingen van scholen voor voorbereidend
      wetenschappelijk onderwijs, hoger algemeen voortgezet onderwijs, middelbaar algemeen voortgezet onderwijs en
      voorbereidend beroepsonderwijs gelegenheid wordt gegeven diagnostische toetsen Nederlandse taal en rekenen af
      te leggen. Indien toepassing wordt gegeven aan de vorige volzin, worden bij of krachtens algemene maatregel van
      bestuur voorschriften omtrent deze toetsen vastgesteld. Deze voorschriften hebben in elk geval betrekking op het
      moment of de momenten waarop de toetsen kunnen worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel28b
  - number: '29.1'
    text: |-
      Aan de leerlingen van de scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger algemeen voortgezet
      onderwijs, voor middelbaar algemeen voortgezet onderwijs en voor voorbereidend beroepsonderwijs wordt gelegenheid
      gegeven aan deze scholen een eindexamen af te leggen, tenzij in de plaats daarvan de gelegenheid bestaat tot het
      afleggen van een eindexamen, dat niet vanwege de school wordt afgenomen en het bevoegd gezag in verband hiermede
      een eindexamen aan de school niet nodig oordeelt. Het eindexamen kan voor elk vak, intrasectoraal of intersectoraal
      programma of ander programma- onderdeel bestaan uit een schoolexamen, uit een centraal examen dan wel beide.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel29
  - number: 29.1a
    text: |-
      Indien ten aanzien van een schoolsoort of leerweg het gemiddelde verschil tussen de cijfers van het centraal
      examen en het schoolexamen over een periode van drie jaren meer dan een half punt bedraagt, kan Onze Minister in
      afwijking van het eerste lid besluiten dat het bevoegd gezag voor een periode van twee jaren leerlingen niet in de
      gelegenheid stelt een eindexamen af te leggen in de desbetreffende schoolsoort of leerweg.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel29
  - number: 29.1b
    text: |-
      Onze Minister besluit of toepassing wordt gegeven aan lid 1a nadat het bevoegd gezag van de school gedurende een
      periode van tenminste drie jaar de gelegenheid heeft gehad, het gemiddelde verschil, bedoeld in lid 1a, ongedaan te
      maken voor zover dat verschil meer dan een half punt bedraagt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel29
  - number: '29.2'
    text: |-
      Het eindexamen wordt afgenomen door de rector, de directeur, de conrector, de adjunct-directeur of een of
      meer leden van de centrale directie en leraren van de school. Het eindexamen staat onder toezicht van een of
      meer gecommitteerden behoudens voor bij of krachtens algemene maatregel van bestuur aan te wijzen examens en
      examenonderdelen. Bij of krachtens algemene maatregel van bestuur wordt bepaald door wie en op welke wijze de
      gecommitteerden worden aangewezen. Het eindexamen kan mede worden afgenomen door deskundigen. Het bevoegd gezag
      wijst de deskundigen aan.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel29
  - number: '29.3'
    text: |-
      Zij die het eindexamen met goed gevolg hebben afgelegd, ontvangen een diploma. Leerlingen van een school voor
      voorbereidend beroepsonderwijs voor zover het betreft de basisberoepsgerichte leerweg, die met goed gevolg
      een gedeelte van het examenprogramma hebben afgelegd, ontvangen een getuigschrift voorbereidend middelbaar
      beroepsonderwijs en leerlingen die een leer-werktraject met goed gevolg afsluiten, ontvangen een diploma
      basisberoepsgerichte leerweg/leer-werktraject. Onze minister stelt de modellen van diploma's en getuigschriften
      vast.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel29
  - number: '29.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in dit artikel bedoelde
      eindexamens, alsmede omtrent programma-onderdelen, die niet voor alle leerlingen van een school dezelfde vakken
      en andere programma-onderdelen behoeven te omvatten. Bij deze algemene maatregel van bestuur worden tevens de
      eindexamenprogramma's vastgesteld. De algemene maatregel van bestuur, bedoeld in de vorige volzinnen, wordt aan
      de beide Kamers der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de
      overlegging zijn verstreken en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het
      in die maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo
      spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel29
  - number: '29.5'
    text: |-
      Voor examens, die niet vanwege de school worden afgenomen, kunnen bij algemene maatregel van bestuur voorschriften
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel29
  - number: '29.6'
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs aan een school kan Onze minister toestaan dat wordt
      afgeweken van het bepaalde bij of krachtens dit artikel. Onze minister besluit binnen zes maanden na ontvangst van
      een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze minister de aanvrager
      daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel29
  - number: 29a
    text: |-
      Leerlingen die een school voor praktijkonderwijs verlaten, ontvangen een getuigschrift praktijkonderwijs, met dien
      verstande dat het bevoegd gezag aan leerlingen die de opleiding hebben afgerond en daarvoor naar het oordeel van
      het bevoegd gezag in aanmerking komen, een schooldiploma praktijkonderwijs kan uitreiken. Onze minister stelt het
      model van het getuigschrift vast.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel29a
  - number: '30.1'
    text: |-
      Een diploma als bedoeld in [artikel 29, derde lid][ref1], kan ook worden uitgereikt aan degenen die niet als
      leerlingen van een school zijn ingeschreven, maar tot het eindexamen van die school zijn toegelaten en dit met
      gunstig gevolg hebben afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '30.2'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in het eerste lid bedoelde toelating
      tot het eindexamen. Daarbij wordt vastgesteld in welke gevallen een bedrag aan het bevoegd gezag verschuldigd is,
      alsmede de hoogte daarvan.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel30
  - number: 30a
    text: |-
      Bij algemene maatregel van bestuur kunnen, in afwijking van de [artikelen 6:7][ref1], [7:10][ref2] en
      [7:24 van de Algemene wet bestuursrecht][ref3], kortere termijnen dan in die artikelen vermeld, worden bepaald voor
      de indiening van een bezwaar- of beroepschrift en voor de daarop te nemen beslissing ter zake van de deelneming
      aan eindexamens.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '31.1'
    text: |-
      De leerling die de school verlaat en aan wie geen diploma kan worden uitgereikt, ontvangt een verklaring waarin
      in ieder geval worden vermeld het tijdstip waarop hij de school verlaat en het leerjaar waartoe hij laatstelijk
      onvoorwaardelijk was bevorderd alsmede voor welke vormen van vervolgonderwijs en voor welke leerjaren daarvan hij
      geschikt wordt geacht. De verklaring wordt door het bevoegd gezag of namens het bevoegd gezag door de rector, de
      directeur, dan wel een of meer leden van de centrale directie, ondertekend.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel31
  - number: '31.4'
    text: Onze minister stelt het model van de verklaring vast.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel31
  - number: '32.1'
    text: |-
      Aan een school voor voorbereidend wetenschappelijk onderwijs, algemeen voortgezet onderwijs, voorbereidend
      beroepsonderwijs en praktijkonderwijs zijn een of meer leraren verbonden.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32
  - number: '32.2'
    text: |-
      Aan het hoofd van een school voor voorbereidend wetenschappelijk onderwijs staat een rector, aan het hoofd van een
      school voor algemeen voortgezet onderwijs, voorbereidend beroepsonderwijs en praktijkonderwijs een directeur.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32
  - number: '32.3'
    text: |-
      De conrectoren en de adjunct-directeuren hebben tot taak de rector onderscheidenlijk de directeur bij te staan en
      bij afwezigheid te vervangen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32
  - number: '32.4'
    text: Het overige personeel heeft tot taak het onderwijs te ondersteunen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32
  - number: '32.5'
    text: Een of meer leden van het personeel worden belast met de taak van schooldecaan.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32
  - number: '32.6'
    text: |-
      Het tweede en derde lid zijn niet van toepassing op de leden van de centrale directie, bedoeld in
      [artikel 32a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '32.7'
    text: |-
      Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van de verschillende categorieën
      personeel van de school. Het bevoegd gezag bepaalt, zoveel mogelijk tegelijk met de vaststelling van het in de
      eerste volzin bedoelde beleid met betrekking tot de formatie, functies en taken van het personeel van de school,
      met inachtneming van de daaromtrent bij algemene maatregel van bestuur te geven nadere voorschriften.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32
  - number: '32.8'
    text: |-
      Voor de toepassing van deze paragraaf wordt onder «vakken» tevens verstaan, programma-onderdelen als bedoeld in de
      [artikelen 13][ref1] en [14][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel14
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 32a.1
    text: |-
      Aan het hoofd van een school die aan bij algemene maatregel van bestuur te vermelden voorwaarden voldoet, kan het
      bevoegd gezag een centrale directie plaatsen bestaande uit ten hoogste vijf leden, waarvan er een door hem wordt
      benoemd tot voorzitter dan wel zonder benoeming tewerkgesteld als voorzitter. De formatie van de centrale directie
      omvat ten hoogste drie volledige formatieplaatsen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32a
  - number: 32a.2
    text: |-
      De centrale directie heeft in naam van het bevoegd gezag de leiding van de voorbereiding en de uitvoering van het
      beleid van de school, alsmede de coördinatie van de dagelijkse gang van zaken en van het beheer van de school.
      Indien toepassing is gegeven aan [artikel 32b][ref1], is de centrale directie tevens met de daar bedoelde taken en
      bevoegdheden belast.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32b
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 32b
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 32b
    text: |-
      Het bevoegd gezag van een school als bedoeld in [artikel 32a, eerste lid][ref1], kan bepalen dat hem bij wettelijk
      voorschrift toekomende taken en bevoegdheden in naam van het bevoegd gezag worden uitgeoefend door de centrale
      directie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 32b1.1
    text: |-
      Het bestuur kan hem bij wettelijk voorschrift opgedragen taken en bevoegdheden overdragen aan de centrale directie,
      de rector of de directeur van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32b1
  - number: 32b1.2
    text: |-
      De centrale directie, de rector of de directeur van de school kunnen hen bij wettelijk voorschrift opgedragen of
      door het bevoegd gezag overgedragen taken en bevoegdheden overdragen aan elkaar of aan de adjunct-directeur.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32b1
  - number: 32c.1
    text: |-
      Het bevoegd gezag stelt na overleg met de rector, de directeur, de conrector en de adjunct-directeur en indien
      toepassing is gegeven aan [artikel 32a][ref1] met de centrale directie, een managementstatuut vast. In het
      managementstatuut is ten minste een regeling opgenomen betreffende de bevoegdheden van de rector, de directeur, de
      conrector en de adjunct-directeur en indien toepassing is gegeven aan [artikel 32a][ref2] van de bevoegdheden van
      de centrale directie, met betrekking tot de toedeling, bestemming en aanwending van de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 32c.2
    text: |-
      Het managementstatuut bevat tevens de aanduiding van de andere aan het bevoegd gezag bij wettelijk voorschrift
      toegekende taken en bevoegdheden waarvan het bevoegd gezag heeft bepaald dat de rector, de directeur, de conrector,
      de adjunct-directeur of de centrale directie van de school deze in naam van het bevoegd gezag kan uitoefenen. Het
      managementstatuut bevat voorts instructies ten aanzien van deze taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32c
  - number: 32c.3
    text: 'In het managementstatuut worden tevens vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32c
  - number: 32c.3.a
    text: |-
      de taken en bevoegdheden die het bestuur overdraagt aan de centrale directie, de rector en de directeur van de
      school, indien toepassing is gegeven aan [artikel 32b1, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32b1
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 32b1
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 32c.3.b
    text: |-
      de taken en bevoegdheden die de centrale directie, de rector en de directeur van de school hebben overgedragen aan
      elkaar of aan de adjunct-directeur, indien toepassing is gegeven aan [artikel 32b1, tweede lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32b1
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 32b1
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 32c.3.c
    text: de richtlijnen voor de uitoefening van de overgedragen taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32c
  - number: 32c.4
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een exemplaar van het managementstatuut in het gebouw van de school ter
      inzage beschikbaar is op een voor een ieder toegankelijke plaats. Het bevoegd gezag zendt een exemplaar van het
      managementstatuut, alsmede elke wijziging daarvan, zo spoedig mogelijk na de vaststelling ter kennisneming aan
      de inspectie.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32c
  - number: 32d.1
    text: |-
      Het bevoegd gezag stelt ten behoeve van de directie van elk van zijn scholen, indien daaraan van een
      ondervertegenwoordiging van vrouwen in de directie sprake is, eenmaal in de 4 jaar een document inzake evenredige
      vertegenwoordiging van vrouwen in de schoolleiding vast.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32d
  - number: 32d.2
    text: |-
      Het document bevat streefcijfers, met inbegrip van een bepaald tijdvak waarbinnen deze streefcijfers worden
      gerealiseerd, aan de hand waarvan door het bevoegd gezag een beleid inzake evenredige vertegenwoordiging van
      vrouwen in de schoolleiding wordt gevoerd, opdat in de directie van elke school van het bevoegd gezag vrouwen
      en mannen naar evenredigheid werkzaam zullen zijn. Voor de evenredige vertegenwoordiging wordt uitgegaan van de
      verhouding mannen en vrouwen voor wat betreft het onderwijzend personeel dat werkzaam is in het door de school
      verzorgde onderwijs, zoals die blijkt uit de daarover jaarlijks door Onze minister gepubliceerde cijfers. Het
      document vermeldt tevens de maatregelen die het bevoegd gezag heeft genomen en zal nemen teneinde de in de eerste
      volzin bedoelde streefcijfers te realiseren en geeft een overzicht van de beoogde en bereikte resultaten van het
      beleid inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding gedurende de periode waarvoor het
      document geldt, onderscheidenlijk de periode waarvoor het vorige document gold.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32d
  - number: 32d.3
    text: |-
      Indien door het bevoegd gezag aan het hoofd van de school een centrale directie wordt geplaatst en vrouwen daarin
      zijn ondervertegenwoordigd, stelt het bevoegd gezag overeenkomstig het bepaalde in het eerste en tweede lid tevens
      een document inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding ten behoeve van de centrale
      directie vast.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32d
  - number: 32d.4
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een exemplaar van het document, bedoeld in het eerste en derde lid,
      in het gebouw van de school ter inzage wordt gelegd op een voor het personeel, de ouders en de leerlingen
      toegankelijke plaats, alsmede dat een exemplaar wordt bewaard bij de administratie van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel32d
  - number: '33.1'
    text: |-
      Leraren worden door het bevoegd gezag benoemd dan wel tewerkgesteld zonder benoeming. Om tot leraar te kunnen
      worden benoemd of tewerkgesteld zonder benoeming dient de betrokkene:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
  - number: 33.1.a
    text: |-
      in het bezit te zijn van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1], die op het tijdstip van overlegging aan het bevoegd gezag
      niet ouder is dan 6 maanden,


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 33.1.b
    text: 'in het bezit te zijn van:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
  - number: 33.1.b.1°
    text: |-
      een getuigschrift, afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], waaruit
      blijkt dat is voldaan aan de bekwaamheidseisen die zijn vastgesteld krachtens [artikel 36, eerste lid][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 33.1.b.2°
    text: |-
      een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EG-beroepskwalificaties][ref1], verleend ten aanzien van het onderwijs dat
      betrokkene zal geven, of


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 33.1.b.3°
    text: |-
      een geschiktheidsverklaring als bedoeld in [artikel 118k][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118k
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118k
  - number: 33.1.c
    text: niet krachtens rechterlijke uitspraak van het geven van onderwijs te zijn uitgesloten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
  - number: 33.1a
    text: |-
      Indien het bevoegd gezag een leraar benoemt of tewerkstelt zonder benoeming voor uitsluitend het geven
      van middelbaar algemeen voortgezet onderwijs of het geven van onderwijs in de eerste drie leerjaren
      van het hoger algemeen voortgezet onderwijs of van het voorbereidend wetenschappelijk onderwijs, is
      het eerste lid, onderdeel b, onder 3°, niet van toepassing en volstaat in afwijking van het eerste
      lid, onderdeel b, onder 1°, het bezit van het getuigschrift van een bacheloropleiding als bedoeld in
      [artikel 7.3a, eerste lid, onderdeel a, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1],
      waaruit blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 33.1a.1°
    text: |-
      de betrokkene in het kader van die opleiding met goed gevolg ten minste 30 studiepunten als bedoeld in
      [artikel 7.4, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], heeft besteed aan
      voorbereiding op het geven van onderwijs in een met zijn opleiding inhoudelijk overeenkomend vak in die leerjaren,
      en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 33.1a.2°
    text: |-
      is voldaan aan de bekwaamheidseisen, bedoeld in [artikel 36, eerste lid][ref1], voor zover die van toepassing zijn
      op dat onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 33.1b
    text: |-
      Indien het bevoegd gezag een leraar benoemt of tewerkstelt zonder benoeming voor het geven van praktijkonderwijs
      als bedoeld in [artikel 10f][ref1] in één of meer bij algemene maatregel van bestuur aan te wijzen vakken,
      volstaat in afwijking van het eerste lid, onderdeel b, onder 1°, het bezit van een getuigschrift krachtens
      de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], waaruit blijkt dat ten aanzien van
      schoolonderwijs als bedoeld in [artikel 3, eerste lid, van de Wet op het primair onderwijs][ref3] is voldaan aan de
      bekwaamheidseisen die zijn vastgesteld krachtens [artikel 32a van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
      [ref2]: https://wetten.overheid.nl/BWBR0005682
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0005682
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0003420
        artikel: 32a
  - number: 33.1c
    text: 'Bij ministeriële regeling wordt:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
  - number: 33.1c.a
    text: |-
      bepaald op grond van het getuigschrift van welke bacheloropleidingen als bedoeld in lid 1a onderwijs verzorgd kan
      worden in daarbij aan te wijzen vakken;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
  - number: 33.1c.b
    text: |-
      ten aanzien van algemeen gebruikelijke vakken of programmaonderdelen, waarvoor op grond van een getuigschrift als
      bedoeld in het eerste lid, onderdeel b, onder 1°, niet rechtstreeks kan of kon worden vastgesteld dat wordt voldaan
      aan de voor die vakken of programmaonderdelen geldende bekwaamheidseisen, een overzicht gegeven van getuigschriften
      waarmee wordt voldaan aan de bekwaamheidseisen die gelden voor het geven van voortgezet onderwijs in die vakken of
      programmaonderdelen. In het overzicht kunnen eisen worden opgenomen omtrent bij- of nascholing.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
  - number: '33.2'
    text: |-
      In bijzondere gevallen kan Onze minister aan personen, die in een bepaald vak of onderdeel van een vak door
      buitengewone bekwaamheid uitmunten, ten aanzien van dit vak of dit onderdeel ontheffing verlenen van de in het
      eerste lid onder b gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
  - number: '33.3'
    text: |-
      Bij tijdelijke afwezigheid van een leraar kan ten aanzien van degene die hem vervangt voor ten hoogste twaalf
      maanden worden afgeweken van de eisen, gesteld in het eerste lid, onderdeel b, met dien verstande dat de periode
      van twaalf maanden is verstreken vanaf de dag dat perioden van vervanging als bedoeld in dit lid elkaar met
      tussenpozen van niet meer dan drie maanden hebben opgevolgd en een periode van twaalf maanden, deze tussenpozen
      inbegrepen, is overschreden. Indien in een vacature niet terstond kan worden voorzien door de benoeming of
      tewerkstelling zonder benoeming van een leraar die aan de genoemde eisen voldoet, is het bepaalde in de vorige
      volzin van overeenkomstige toepassing. Deze termijn van een jaar kan met ten hoogste twee jaren worden verlengd
      indien het bevoegd gezag en de betrokkene schriftelijk verklaren dat betrokkene verplicht is zich in te spannen
      binnen twee jaren alsnog te voldoen aan de eisen gesteld in het eerste lid, onderdeel b. Het bevoegd gezag kan
      onder de voorwaarden, genoemd in de vorige volzin, een verlenging van nog eens twee jaren geven indien het dat
      noodzakelijk oordeelt vanwege de kwaliteit en de voortgang van het onderwijs op de school.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
  - number: '33.4'
    text: |-
      Degene die benoembaar of tewerkstelbaar zonder benoeming is voor enig vak, mag, onverminderd het vijfde lid,
      door het bevoegd gezag gedurende ten hoogste twee jaren worden belast met werkzaamheden als leraar waarvoor hij
      niet voldoet aan de in [artikel 36, eerste lid][ref1], bedoelde bekwaamheidseisen. Aan de eerste volzin wordt
      uitsluitend toepassing gegeven indien het bevoegd gezag en betrokkene in ieder geval schriftelijk hebben verklaard
      dat betrokkene verplicht is zich in te spannen om binnen twee jaren alsnog te voldoen aan de bekwaamheidseisen voor
      die werkzaamheden. Het bevoegd gezag kan de in de eerste volzin bedoelde termijn verlengen met ten hoogste twee
      jaren indien het bevoegd gezag dat noodzakelijk oordeelt vanwege de kwaliteit en de voortgang van het onderwijs aan
      de school. De tweede volzin is in dat geval van overeenkomstige toepassing. De inspectie kan op aanvraag van het
      bevoegd gezag toestaan dat in de eerste twee leerjaren wordt afgeweken van de eis, bedoeld in de tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '33.5'
    text: |-
      Indien in het onderwijsprogramma, bedoeld in [artikel 11c][ref1], sprake is van vakoverstijgende
      programmaonderdelen, kan in de eerste twee leerjaren worden gewerkt met teams die verantwoordelijk zijn voor de
      kwaliteit van het onderwijsprogramma voor die vakoverstijgende programmaonderdelen voorzover wordt voldaan aan de
      volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11c
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 33.5.a
    text: |-
      leraren die deel uitmaken van een team voldoen ieder aan bekwaamheidseisen als bedoeld in
      [artikel 36, eerste lid][ref1], waarbij de leraren in het team als geheel beschikken over de bekwaamheidseisen voor
      de vakken die zijn betrokken bij het vakoverstijgende programmaonderdeel,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 33.5.b
    text: |-
      leraren die deel uitmaken van een team zijn ieder verantwoordelijk voor de kwaliteit van het deel van het onderwijs
      van het desbetreffende vakoverstijgende programmaonderdeel waarvoor zij voldoen aan de bekwaamheidseisen, bedoeld
      in [artikel 36, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 33.5.c
    text: 'het onderwijs in het desbetreffende vakoverstijgende programmaonderdeel kan worden verzorgd door:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
  - number: 33.5.c.1°
    text: leden van het team, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
  - number: 33.5.c.2°
    text: |-
      andere leraren die daartoe naar het oordeel van het bevoegd gezag geschikt zijn. Daarbij stelt het bevoegd gezag,
      de opvattingen van de leden van het team in aanmerking nemend, vast of de inhoudelijke of didactische kennis en
      vaardigheden van deze leraren voldoende zijn. Indien dat niet het geval is, wordt eveneens vastgesteld hoe hierin
      alsnog wordt voorzien. Het bevoegd gezag legt dit vast in de geordende gegevens, bedoeld in [artikel 37a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 37a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 33.5a
    text: Bij toepassing van het vijfde lid is het derde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
  - number: '33.6'
    text: |-
      Het bevoegd gezag beschikt over geordende gegevens over de toepassing van het derde lid, de eerste volzin van het
      vierde lid, het vijfde lid en lid 5a.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
  - number: '33.7'
    text: |-
      Het eerste lid is niet van toepassing op een leraar, in zoverre deze belast is met het verrichten van werkzaamheden
      in verband met contractactiviteiten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
  - number: '33.8'
    text: |-
      Bij algemene maatregel van bestuur worden ten aanzien van leraren die in vaste dienst zijn verbonden aan een
      school, bedoeld in de [artikelen 7][ref1], [8][ref2], [9][ref3], [10a][ref4] en [10f][ref5], regelen gesteld
      omtrent de gronden waarop en de procedure volgens welke kan worden afgeweken van het eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10a
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel33
    references:
      - id: ref1
