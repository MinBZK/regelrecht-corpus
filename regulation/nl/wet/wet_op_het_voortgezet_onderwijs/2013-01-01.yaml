      - id: ref6
        bwb_id: BWBR0002399
        artikel: '86'
        hoofdstuk: II
        paragraaf: '3'
        afdeling: II
  - number: 96j.2
    text: |-
      Indien een gemeente gedurende een gedeelte van het desbetreffende tijdvak een of meer scholen in stand houdt,
      wordt voor het vaststellen van het overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het totaal van
      de ontvangsten van een niet door de gemeente in stand gehouden school over een overeenkomstig gedeelte van het
      desbetreffende tijdvak.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96j
  - number: 96k.1
    text: |-
      Na de voorlopige vaststelling van het bedrag van de overschrijding, bedoeld in [artikel 96i, zesde lid][ref1],
      keren burgemeester en wethouders aan het bevoegd gezag van een niet door de gemeente in stand gehouden school
      dat op grond van [artikel 96j, eerste lid][ref2], aanspraak heeft op een uitkering, een voorschot uit. Het
      voorschot omvat het voorlopig vastgestelde bedrag van de overschrijding, berekend op de wijze als is aangegeven in
      [artikel 96j, eerste en tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96j
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel96j
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96j
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 96j
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
  - number: 96k.2
    text: |-
      De bekendmaking van de beschikkingen tot voorlopige en definitieve vaststelling van het overschrijdingsbedrag,
      bedoeld in het zesde onderscheidenlijk zevende lid van [artikel 96i][ref1], behelst tevens een staat van de
      voorzieningen als bedoeld in [artikel 96i, eerste lid, onderdeel i][ref2], waarin per kalenderjaar wordt aangegeven
      het verloop van de toevoegingen en de onttrekkingen aan de voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
  - number: 96k.3
    text: |-
      Het bevoegd gezag van een in het eerste lid bedoelde school kan tegen de in het derde lid bedoelde beschikkingen
      administratief beroep instellen bij gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96k
  - number: 96m.1
    text: |-
      Het bedrag van de bekostiging waarop het bevoegd gezag over een kalenderjaar aanspraak heeft, stelt Onze minister
      vast op de som van de overeenkomstig het bepaalde in dit hoofdstuk verstrekte bekostiging en betaalde bedragen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96m
  - number: 96m.2
    text: 'Op het in het eerste lid bedoelde bedrag worden in mindering gebracht:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96m
  - number: 96m.2.a
    text: |-
      de inkomsten die het bevoegd gezag geniet uit cursusgelden als bedoeld in de [Les- en cursusgeldwet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0004188
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96m
    references:
      - id: ref1
        bwb_id: BWBR0004188
  - number: 96m.2.b
    text: de inkomsten die het bevoegd gezag geniet uit verhaal van wettelijk verschuldigde bedragen en premies,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96m
  - number: 96m.2.c
    text: |-
      de door Onze minister vast te stellen waarde van roerende zaken die door vervreemding of op andere wijze worden
      onttrokken aan de bestemming, waartoe zij met de vergoeding zijn aangeschaft, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96m
  - number: 96m.2.d
    text: de opbrengst van werkstukken en van verrichte diensten anders dan in het kader van contractactiviteiten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96m
  - number: 96n.1
    text: |-
      Op de bekostiging, bedoeld in [artikel 96m, eerste lid][ref1], wordt volgens bij of krachtens algemene
      maatregel van bestuur te stellen regels een bedrag in mindering gebracht in verband met de kosten van
      werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en
      arbeidsongeschiktheid aan gewezen personeel anders dan op grond van de [Ziektewet][ref2]. Deze regels kunnen
      voorzien in:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96m
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96n
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96m
        hoofdstuk: III
        paragraaf: '9'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001888
  - number: 96n.1.a
    text: onderscheid in verband met de datum waarop gewezen personeel is ontslagen,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96n
  - number: 96n.1.b
    text: |-
      onderscheid in verband met de beslissing van de rechtspersoon, bedoeld in [artikel 98b, eerste lid][ref1], zoals
      luidend op de dag voor de inwerkingtreding van [artikel IV van de wet van 12 mei 2005][ref2], Stb. 288, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
      [ref2]: https://wetten.overheid.nl/BWBR0018327#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96n
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98b
        hoofdstuk: IV
        afdeling: II
      - id: ref2
        bwb_id: BWBR0018327
        artikel: IV
  - number: 96n.1.c
    text: |-
      verdeling van de in de eerste volzin bedoelde kosten over enerzijds de bevoegde gezagsorganen gezamenlijk en
      anderzijds individuele bevoegde gezagsorganen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96n
  - number: 96n.2
    text: |-
      Onze Minister kan het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer van een persoon,
      behorend tot gewezen personeel als bedoeld in het eerste lid, uitsluitend in het kader van het bepaalde bij of
      krachtens het eerste lid, gebruiken in het verkeer met:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96n
  - number: 96n.2.a
    text: het bevoegd gezag van de school waar de in de aanhef bedoelde persoon werkzaam was, of
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96n
  - number: 96n.2.b
    text: de instantie die de uitkeringen verstrekt of heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96n
  - number: 96n.3
    text: |-
      Het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer wordt op een daartoe strekkend
      verzoek van Onze Minister aan Onze Minister verstrekt door het bevoegd gezag van de school waar het gewezen
      personeelslid werkzaam was.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96n
  - number: 96n.4
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, wordt aan de beide Kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide Kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96n
  - number: 96n.5
    text: |-
      Indien de verdeling van de in het eerste lid, onderdeel c, bedoelde kosten bij ministeriële regeling wordt
      geregeld, is het vierde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96n
  - number: 96o.2
    text: |-
      Op het bedrag, bedoeld in [artikel 96m, eerste lid][ref1], worden in mindering gebracht de salarissen, toelagen,
      uitkeringen of andere bijdragen waarop aanspraak wordt gemaakt door personeel dat


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96m
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96o
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96m
        hoofdstuk: III
        paragraaf: '9'
        afdeling: II
  - number: 96o.2.a
    text: |-
      langer dan twee jaar anders dan wegens vervanging of in geval van leraren indien de benoeming is geschied met
      toepassing van [artikel 33, derde lid juncto vijfde lid][ref1], onafgebroken, met een onderbreking van een week
      of minder dan wel met een of meer onderbrekingen gedurende een schoolvakantie, in een gelijksoortige functie in
      tijdelijke dienst verbonden is geweest aan een school van het bevoegd gezag, of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96o
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 96o.2.b
    text: |-
      langer dan drie jaar direct of indirect in verband met het verrichten van contractactiviteiten in tijdelijke dienst
      is benoemd.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96o
  - number: 96o.6
    text: |-
      Bij ministeriële regeling wordt bepaald in welke gevallen geen vermindering als bedoeld in het tweede lid
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96o
  - number: 96o.8
    text: Onze minister kan projecten aanwijzen waarvoor het tweede lid onderdeel a niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96o
  - number: 96r
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven voor de verlening van voorschotten op
      de bekostiging en voor de verrekening van de betaalde voorschotten met het bedrag van de vastgestelde bekostiging
      of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96r
  - number: 96r1
    text: |-
      Onze Minister is bevoegd tot verrekening van vorderingen krachtens deze wet van of op het bevoegd gezag van een
      school met vorderingen van of op Onze Minister krachtens een andere wet.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96r1
  - number: 96s
    text: |-
      Indien een leerling in de loop van het schooljaar de school verlaat zonder de opleiding te hebben voltooid, en
      aansluitend wordt ingeschreven als leerling aan een andere school voor voortgezet onderwijs of als deelnemer aan
      een instelling voor educatie en beroepsonderwijs, kan het bevoegd gezag van de school met het bevoegd gezag van
      die andere school of die instelling overeenkomen een deel van de bekostiging over te dragen aan dat andere bevoegd
      gezag vanwege deze tussentijdse overstap.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel96s
  - number: '97.1'
    text: Het bevoegd gezag van een bijzondere school houdt nauwkeurig boek van de inkomsten en uitgaven.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel97
  - number: '97.2'
    text: |-
      Het bevoegd gezag van een bijzondere school geeft desverlangd aan de door Onze minister aangewezen ambtenaren de
      boeken en bescheiden ter inzage. Het bevoegd gezag is gehouden deze boeken en bescheiden zeven jaren te bewaren.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel97
  - number: '99.1'
    text: |-
      Het bevoegd gezag besteedt de verstrekte bekostiging en de betaalde bedragen ten behoeve van die school op de wijze
      zoals aangegeven in het tweede tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel99
  - number: '99.2'
    text: |-
      De voor voorzieningen in de huisvesting betaalde bedragen worden zodanig aangewend dat een behoorlijke en
      deugdelijke totstandkoming van deze voorzieningen is verzekerd. Indien na realisatie van de in de eerste volzin
      bedoelde voorzieningen de bedragen niet volledig zijn aangewend, kan het resterende deel daarvan worden aangewend
      voor de kosten van personeel of voorzieningen in de exploitatie.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel99
  - number: '99.3'
    text: |-
      Het voor personeels- en exploitatiekosten betaalde bedrag wordt aangewend voor de kosten van personeel, zoals
      onderscheiden in de [artikelen 32][ref1] en [32a][ref2], voor voorzieningen in de exploitatie. In geval van een
      overschot op die bedragen, kan dat overschot worden aangewend voor voorzieningen in de huisvesting.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '32'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '99.5'
    text: |-
      De verstrekte overschrijdingsbedragen worden ten behoeve van het onderwijs aan de scholen van het bevoegd gezag
      aangewend.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel99
  - number: '99.6'
    text: |-
      Het bevoegd gezag kan de bedragen, bedoeld in het derde lid, mede aanwenden voor de kosten van personeel of
      voorzieningen in de exploitatie van:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel99
  - number: 99.6.a
    text: een andere school voor voortgezet onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel99
  - number: 99.6.b
    text: een scholengemeenschap waarvan een of meer scholen voor voortgezet onderwijs deel uitmaken;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel99
  - number: 99.6.c
    text: |-
      een basisschool of een speciale school voor basisonderwijs als bedoeld in de [Wet op het primair onderwijs][ref1],
      een school voor speciaal onderwijs, voor voortgezet speciaal onderwijs of voor speciaal en voortgezet
      speciaal onderwijs dan wel een instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in de
      [Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: '99.7'
    text: |-
      De op grond van [artikel 77a][ref1], [artikel 96g][ref2] of [artikel 96h][ref3] verstrekte bekostiging wordt
      besteed aan het doel waarvoor zij zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel77a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96g
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel96h
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 77a
        hoofdstuk: I
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96g
        hoofdstuk: III
        paragraaf: '6'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 96h
        hoofdstuk: III
        paragraaf: '6'
        afdeling: II
  - number: '99.8'
    text: |-
      Het bevoegd gezag kan met het bevoegd gezag waarmee het een samenwerkingsovereenkomst heeft gesloten als bedoeld in
      [artikel 25a, derde lid][ref1], overeenkomen om vanwege de samenwerking een deel van de bekostiging over te dragen
      aan het andere bevoegd gezag, bedoeld in het [eerste lid van dat artikel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel25
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 25a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '25'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '100.1'
    text: |-
      De bedragen en bekostiging, bedoeld in [artikel 99][ref1], worden niet aangewend voor contractactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel99
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '99'
        hoofdstuk: IV
        afdeling: II
  - number: '100.2'
    text: |-
      Het bevoegd gezag van de scholen, bedoeld in [artikel 99][ref1], berekent voor de contractactiviteiten aan de
      betrokken derden de kosten zodanig dat aan het bepaalde in het eerste lid wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel99
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '99'
        hoofdstuk: IV
        afdeling: II
  - number: 102a.1
    text: |-
      De kosten van herstel van schade aan gebouwen, terreinen en roerende zaken ten behoeve waarvan met betrekking tot
      scholen bekostiging wordt genoten, worden niet door de gemeente vergoed, indien:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel102a
  - number: 102a.1.a
    text: die schade door schuld of nalatigheid van de rechtspersoon die de school in stand houdt, wordt toegebracht, of
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel102a
  - number: 102a.1.b
    text: |-
      het bevoegd gezag een beroep kan doen op een verzekering waarvoor de premie voor vergoeding in aanmerking komt,
      of voor de vergoeding van die schade door de gemeente een collectieve verzekering is afgesloten, voor zover die
      collectieve verzekering de schade dekt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel102a
  - number: 102a.2
    text: |-
      Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een door de gemeente bekostigde school voor
      vergoeding door de gemeente in aanmerking komt, treedt de gemeente op het moment van een uitdrukkelijk besluit tot
      vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel102a
  - number: '103.1'
    text: |-
      Het bevoegd gezag stelt jaarlijks een jaarverslag over het voorafgaande kalenderjaar vast. Op deze
      jaarverslaggeving is [Boek 2, titel 9, van het Burgerlijk Wetboek][ref1], met uitzondering van de
      [afdelingen 1][ref2], [11][ref3] en [12][ref4], van overeenkomstige toepassing voor zover bij of krachtens algemene
      maatregel van bestuur niet anders is bepaald. Het jaarverslag bestaat ten minste uit de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Afdeling1
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Afdeling11
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Afdeling12
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003045
        afdeling: '11'
      - id: ref4
        bwb_id: BWBR0003045
        afdeling: '12'
  - number: 103.1.a
    text: |-
      een bestuursverslag als bedoeld in [artikel 391 van Boek 2 van het Burgerlijk Wetboek][ref1] waarin de door het
      bevoegd gezag gehanteerde code voor goed bestuur wordt vermeld alsmede ten minste verantwoording wordt afgelegd
      over de afwijkingen van die code voor goed bestuur,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel391
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '391'
  - number: 103.1.b
    text: |-
      een jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1], met daarbij ingevolge
      het derde lid vast te stellen bijlagen,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
  - number: 103.1.c
    text: |-
      overige gegevens als bedoeld in [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
  - number: '103.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welke onderdelen het jaarverslag tevens dient te bevatten,
      dan wel welke onderdelen komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103
  - number: '103.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een nadere invulling worden gegeven aan de onderdelen, bedoeld
      in het eerste lid, en kunnen nadere voorschriften worden gegeven over:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103
  - number: 103.3.a
    text: de indeling en wijze van ordening van de gegevens per onderdeel van het jaarverslag,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103
  - number: 103.3.b
    text: de wijze en het tijdstip waarop de desbetreffende onderdelen beschikbaar worden gesteld,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103
  - number: 103.3.c
    text: de elektronische verzending van het cijfermatige deel uit de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103
  - number: 103.3.d
    text: de grondslagen voor de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103
  - number: '103.4'
    text: |-
      De beschikbaarstelling van de gegevens, bedoeld in het derde lid, onderdeel b, gaat vergezeld van een verklaring
      omtrent de getrouwheid en rechtmatigheid, afgegeven door een door de toezichthouder of het toezichthoudend orgaan
      aangewezen accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Bij de
      aanwijzing van de accountant bedingt de toezichthouder of het toezichthoudend orgaan dat de controle overeenkomstig
      een door Onze Minister vast te stellen controleprotocol plaatsvindt en dat aan Onze Minister op diens verzoek
      inzicht wordt geboden in de controlerapporten van de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '103.5'
    text: |-
      De code voor goed bestuur, bedoeld in het eerste lid, onderdeel a, bevat ten minste bepalingen over de wijze waarop
      invulling wordt gegeven aan:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103
  - number: 103.5.a
    text: |-
      een beleid dat de eigen deskundigheid en verantwoordelijkheid van het personeel voor de kwaliteit van het onderwijs
      tot haar recht komt,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103
  - number: 103.5.b
    text: een integere bedrijfsvoering, waaronder voorzieningen om verstrengeling van belangen tegen te gaan, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103
  - number: 103.5.c
    text: afstemming met en verantwoording aan de ouders en andere belanghebbenden binnen en buiten de school.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103
  - number: '103.6'
    text: Bij algemene maatregel van bestuur kan een branchecode voor goed bestuur worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103
  - number: 103a.1
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het ten behoeve van Onze Minister beschikt over geordende gegevens die
      van belang zijn voor de berekening van de hoogte van de bekostiging, alsmede over een verklaring over de juistheid
      van de bekostigingsgegevens, afgegeven door een door de toezichthouder of het toezichthoudend orgaan aangewezen
      accountant als bedoeld in [artikel 393, eerste lid, van Boek 2, van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 103a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103a
  - number: 103a.3
    text: |-
      Het bevoegd gezag bewaart de gegevens, bedoeld in het eerste lid, en de desbetreffende boeken en bescheiden
      gedurende een periode van zeven jaren.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103a
  - number: 103a1.1
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het beschikt over geordende gegevens ten behoeve van het door Onze
      Minister te voeren beleid met betrekking tot het onderwijs, bedoeld in deze wet, en verleent desgevraagd
      medewerking aan door of namens Onze Minister uit te voeren onderzoek dat geheel of mede op deze gegevens is
      gebaseerd.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103a1
  - number: 103a1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103a1
  - number: 103a2
    text: |-
      De voorschriften, bedoeld in [artikel 103, tweede lid][ref1], [artikel 103a, tweede lid][ref2], en
      [artikel 103a1, tweede lid][ref3], hebben geen betrekking op het persoonsgebonden nummer van een leerling of op de
      andere gegevens, bedoeld in [artikel 103b, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel103a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel103a1
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103a2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '103'
        hoofdstuk: IV
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 103a
        hoofdstuk: IV
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 103a1
        hoofdstuk: IV
        afdeling: II
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 103b
        hoofdstuk: IV
        afdeling: II
  - number: 103b.1
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een leerling gebruiken in het verkeer met de leerling op wie
      het nummer betrekking heeft, of, indien de leerling minderjarig is, met de ouders van deze leerling.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
  - number: 103b.2
    text: |-
      Het bevoegd gezag verstrekt het persoonsgebonden nummer van iedere leerling aan Onze Minister, tezamen met de
      volgende gegevens van de leerling:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
  - number: 103b.2.a
    text: geslacht, geboortedatum en postcode van de woonplaats;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
  - number: 103b.2.b
    text: de datum van in- of uitschrijving;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
  - number: 103b.2.c
    text: de soort onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
  - number: 103b.2.d
    text: indien van toepassing de leerweg, de sector, de afdeling of het profiel;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
  - number: 103b.2.e
    text: het leerjaar;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
  - number: 103b.2.f
    text: het behaalde diploma;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
  - number: 103b.2.g
    text: |-
      de vakken waarin examen is afgelegd, de cijfers van het schoolexamen en het centraal examen, de eindcijfers, de
      uitslag van het eindexamen of deeleindexamen en de datum waarop deze uitslag is bepaald;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
  - number: 103b.2.h
    text: |-
      indien van toepassing de aanduiding van de minderheidsgroep en de verblijfsduur in Nederland, voorzover de
      desbetreffende minderheidsgroep of verblijfsduur als categorie is opgenomen in een ministeriële regeling waarin
      voorschriften zijn vastgesteld omtrent toekenning van een aanvullende vergoeding voor personeelskosten als bedoeld
      in [artikel 85a, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 85a
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: 103b.2.i
    text: |-
      het registratienummer van de school dan wel scholengemeenschap of, indien sprake is van een nevenvestiging dan wel
      tijdelijke nevenvestiging, het registratienummer daarvan.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
  - number: 103b.3
    text: |-
      Bij ministeriële regeling kan een nadere specificatie worden gegeven van de gegevens, bedoeld in het tweede
      en achtste lid, en kan worden bepaald welke van de gegevens, bedoeld in het tweede en achtste lid, niet langer
      behoeven te worden verstrekt. Bij ministeriële regeling kunnen voorts regels worden gesteld omtrent de tijdstippen
      en de wijze van verstrekking van de gegevens, bedoeld in het tweede en achtste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
  - number: 103b.4
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een leerling, al dan niet tezamen met een of meer van de
      gegevens, bedoeld in het tweede en achtste lid, gebruiken in het verkeer met Onze minister ten behoeve van de
      vaststelling van de bekostiging van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
  - number: 103b.5
    text: |-
      Het bevoegd gezag en het hoofd, bedoeld in [artikel 1, onder d, van de Leerplichtwet 1969][ref1],
      gebruiken het persoonsgebonden nummer van een leerling in contacten met een gemeente in het kader van de
      [Leerplichtwet 1969][ref2], tezamen met de gegevens die noodzakelijk zijn voor het toezicht op de naleving van
      [die wet][ref3] door de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002628
      [ref3]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002628
      - id: ref3
        bwb_id: BWBR0002628
  - number: 103b.6
    text: |-
      Het bevoegd gezag gebruikt bij de opgave aan burgemeester en wethouders, bedoeld in [artikel 28, eerste lid][ref1],
      het persoonsgebonden nummer van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel28
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '28'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 103b.7
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het contact met een andere school
      of een school of instelling voor ander onderwijs ten behoeve van de in- en uitschrijving van die leerling.
      Onder dit contact wordt mede begrepen de uitwisseling van leergegevens en direct met het leren samenhangende
      begeleidingsgegevens. Bij algemene maatregel van bestuur worden de gegevens, bedoeld in de vorige volzin,
      gespecificeerd. Het bevoegd gezag bewaart in de administratie van de school een verklaring van instemming van de
      ouders dan wel de leerling, indien deze de leeftijd van 16 jaar heeft bereikt, met de uitwisseling van de gegevens.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
  - number: 103b.8
    text: |-
      Indien de gegevens over de nationaliteit van de leerling niet zijn opgenomen in de gemeentelijke basisadministratie
      persoonsgegevens worden deze gegevens door het bevoegd gezag verstrekt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
  - number: 103b.9
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling van het voortgezet onderwijs in het kader
      van de uitvoering van subsidieregelingen van het Europees Sociaal Fonds.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
  - number: 103b.10
    text: |-
      Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een leerling ter uitvoering van
      [artikel 107, tweede en vijfde lid, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 103b.11
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in contacten met een school als bedoeld
      in de [Wet op de expertisecentra][ref1] in het kader van de ondersteuning die deze school biedt op grond van
      [artikel 8a, eerste lid, van de Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 8a
  - number: 103b.12
    text: |-
      De in het zevende lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103b
  - number: 103c.1
    text: |-
      Onze Minister neemt de door het bevoegd gezag verstrekte persoonsgebonden nummers en andere gegevens, bedoeld
      in [artikel 103b, tweede en achtste lid][ref1], op in het basisregister onderwijs, nadat zij deze gegevens
      heeft getoetst op juistheid en volledigheid. Onze Minister verstrekt de gegevens, inclusief de gegevens,
      bedoeld in [artikel 24c, eerste lid, onderdeel g, van de Wet op het onderwijstoezicht][ref2], zoals zij
      voornemens is die gegevens in het basisregister onderwijs op te nemen, aan het bevoegd gezag. Onverminderd
      [artikel 103d, tweede lid][ref3], kan Onze Minister de door het bevoegd gezag verstrekte gegevens uitsluitend met
      instemming van het bevoegd gezag wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel24c
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel103d
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103b
        hoofdstuk: IV
        afdeling: II
      - id: ref2
        bwb_id: BWBR0013800
        artikel: 24c
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 103d
        hoofdstuk: IV
        afdeling: II
  - number: 103c.2
    text: |-
      Het bevoegd gezag verstrekt Onze Minister alle inlichtingen die zij nodig acht voor de uitvoering van de taak,
      bedoeld in het eerste lid. Het bevoegd gezag werkt eraan mee dat de in het basisregister onderwijs opgenomen
      gegevens juist en volledig zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103c
  - number: 103c.3
    text: |-
      Indien Onze Minister naar aanleiding van de toetsing, bedoeld in het eerste lid, redenen heeft om aan te nemen dat
      een bevoegd gezag in strijd handelt of heeft gehandeld met het bepaalde bij of krachtens deze wet en een onderzoek
      daarnaar door de inspectie nodig acht, verstrekt Onze Minister ten behoeve van dit onderzoek de persoonsgebonden
      nummers en andere gegevens van leerlingen aan de inspectie. De inspectie meldt de uitkomst van het onderzoek aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103c
  - number: 103c.4
    text: |-
      Onze minister en de inspectie verstrekken ter uitvoering van
      [artikel 107, tweede lid, van de Vreemdelingenwet 2000][ref1] geen gegevens die zij op grond van het derde lid
      hebben ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 103d.1
    text: 'Gegevens uit het basisregister onderwijs kunnen worden gebruikt door:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103d
  - number: 103d.1.a
    text: |-
      Onze Minister voor zover deze gegevens noodzakelijk zijn voor de bekostiging van scholen, de begrotings- en
      beleidsvoorbereiding, en de uitvoering van de taak, bedoeld in [artikel 23c, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23c
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 103d.1.b
    text: |-
      de inspectie voor zover deze gegevens noodzakelijk zijn voor het uitoefenen van het toezicht op het voortgezet
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103d
  - number: 103d.2
    text: |-
      Voor zover de door het bevoegd gezag op grond van [artikel 103b][ref1] verstrekte gegevens naar het oordeel van
      Onze Minister onjuist of onvolledig zijn, kan Onze Minister ten behoeve van de vaststelling van de bekostiging van
      deze gegevens afwijken, in welk geval de door Onze Minister vastgestelde gewijzigde gegevens worden opgenomen in
      het basisregister onderwijs, nadat het desbetreffende besluit tot vaststelling van de bekostiging onherroepelijk
      is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103b
        hoofdstuk: IV
        afdeling: II
  - number: 103d.3
    text: |-
      Het gebruik, bedoeld in het eerste lid, ziet uitsluitend op gegevens die niet herleid of herleidbaar zijn tot
      individuele leerlingen, onverminderd [artikel 103c, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103c
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103c
        hoofdstuk: IV
        afdeling: II
  - number: 103d.4
    text: |-
      Bij ministeriële regeling worden regels gesteld ter uitvoering van het eerste en derde lid, in ieder geval omtrent
      de inhoud en de samenstelling van de gegevens, de wijze waarop de gegevens worden verstrekt, de tijdstippen waarop
      de gegevens worden verstrekt, en de perioden waarop de gegevens betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103d
  - number: 103d.5
    text: |-
      In afwijking van het derde lid wordt bij algemene maatregel van bestuur bepaald in welke gevallen en onder welke
      voorwaarden Onze Minister gegevens als bedoeld in [artikel 103b, tweede en derde lid][ref1], kan gebruiken tezamen
      met het persoonsgebonden nummer van een leerling ten behoeve van de vaststelling van de bekostiging van een school,
      alsmede welke gegevens dit gebruik kan betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103b
        hoofdstuk: IV
        afdeling: II
  - number: 103d.6
    text: |-
      In afwijking van het derde lid, kan Onze Minister uit het basisregister onderwijs ten behoeve van het zenden van
      de samenvatting van het inspectierapport aan de ouders van de leerlingen ingevolge [artikel 23c, tweede lid][ref1],
      het persoonsgebonden nummer van die leerlingen gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23c
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 103f
    text: |-
      Onverminderd het overigens bij of krachtens de wet bepaalde omtrent het gebruik van het burgerservicenummer door de
      gemeente, gebruikt de gemeente het persoonsgebonden nummer van een leerling of een voortijdige schoolverlater als
      bedoeld in [artikel 118g][ref1] uitsluitend ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118g
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118g
  - number: 103f.a
    text: |-
      een registratie van leerplichtige jongeren in het belang van het toezicht op de naleving van de
      [Leerplichtwet 1969][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103f
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 103f.b
    text: |-
      de registratie van gegevens van voortijdige schoolverlaters, bedoeld in
      [artikel 118h, eerste lid, eerste volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118h
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118h
  - number: 103f.c
    text: |-
      het systeem van doorverwijzing van voortijdige schoolverlaters naar onderwijs of arbeidsmarkt, bedoeld in
      [artikel 118h, eerste lid, tweede en derde volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118h
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118h
  - number: 103f.d
    text: |-
      verwerking van de gegevens, bedoeld in [artikel 24f, derde en vierde lid, van de Wet op het onderwijstoezicht][ref1]
      en in [artikel 28a, vierde lid][ref2], bij de registraties, bedoeld in de onderdelen a en b, en het systeem van
      doorverwijzing, bedoeld in onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel28a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103f
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24f
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 28a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 103g.1
    text: |-
      Indien sprake is van wanbeheer van een of meer bestuurders of toezichthouders kan Onze Minister de rechtspersoon
      die de school in stand houdt een aanwijzing geven. Een aanwijzing omvat een of meer maatregelen en is evenredig aan
      het doel waarvoor zij wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103g
  - number: 103g.2
    text: 'Onder wanbeheer wordt uitsluitend verstaan:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103g
  - number: 103g.2.a
    text: financieel wanbeleid,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103g
  - number: 103g.2.b
    text: |-
      ongerechtvaardigde verrijking, al dan niet beoogd, van de rechtspersoon die de school in stand houdt, zichzelf dan
      wel een derde;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103g
  - number: 103g.2.c
    text: |-
      onrechtmatig handelen, waaronder wordt verstaan het in de hoedanigheid van bestuurder of toezichthouder handelen in
      strijd met wettelijke bepalingen of de kennelijke geest van wettelijke bepalingen waarmee financieel voordeel wordt
      behaald ten gunste van de rechtspersoon die de school in stand houdt, zichzelf of een derde, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103g
  - number: 103g.2.d
    text: |-
      het in ernstige mate verwaarlozen van de zorg voor wat door redelijkheid en billijkheid wordt gevorderd in de
      omgang met betrokkenen in de schoolorganisatie, waaronder wordt verstaan intimidatie of bedreiging van personeel,
      leerlingen of ouders door een bestuurder of toezichthouder.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103g
  - number: 103g.3
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten sprake is van wanbeheer alsmede de in
      verband daarmee te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103g
  - number: 103g.4
    text: Een aanwijzing bevat de termijn waarbinnen het bevoegd gezag aan de aanwijzing moet voldoen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103g
  - number: 103g.5
    text: 'Alvorens Onze Minister een aanwijzing als bedoeld in het eerste lid geeft:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103g
  - number: 103g.5.a
    text: |-
      heeft de inspectie een onderzoek als bedoeld in [artikel 11][ref1] of
      [artikel 15 van de Wet op het onderwijstoezicht verricht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel15
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103g
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '15'
  - number: 103g.5.b
    text: |-
      heeft de inspectie daarover een inspectierapport als bedoeld in
      [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref1] uitgebracht; en


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103g
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
  - number: 103g.5.c
    text: |-
      stelt Onze Minister de rechtspersoon vervolgens vier weken in de gelegenheid zijn zienswijze met betrekking tot de
      aanwijzing naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel103g
  - number: '104.1'
    text: |-
      Indien het bevoegd gezag van een school in strijd handelt met het bepaalde bij of krachtens deze wet, waaronder
      tevens wordt verstaan het niet opvolgen van een aanwijzing als bedoeld in [artikel 103g][ref1], kan Onze minister
      bepalen dat de bekostiging, voorschotten daaronder begrepen, geheel of gedeeltelijk wordt ingehouden dan wel
      opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103g
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103g
        hoofdstuk: IV
        afdeling: II
  - number: '104.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een school in
      strijd handelt met [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '104.3'
    text: |-
      Onze minister kent de bekostiging wederom toe, indien blijkt dat de reden voor de toepassing van het eerste of
      tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel104
  - number: 104a.1
    text: |-
      Indien de kwaliteit van het onderwijs of de kwaliteit van het bestuur ernstig of langdurig tekortschiet, kan Onze
      minister op verzoek van het bevoegd gezag van een school of uit eigen beweging in overeenstemming met het bevoegd
      gezag maatregelen treffen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel104a
  - number: 104a.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel104a
  - number: 104a.3
    text: |-
      Onze minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voorzover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel104a
  - number: '106.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel106
  - number: 106.1.a
    text: de inrichting van de boekhouding van bijzondere scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel106
  - number: 106.1.b
    text: de wijze waarop door het bevoegd gezag verslag wordt gedaan van het financieel beheer van de school,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel106
  - number: 106.1.c
    text: de vaststelling door het bevoegd gezag van een begroting en een jaarrekening, alsmede de inrichting daarvan, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel106
  - number: 106.1.d
    text: de controle van de boekhouding en de administratie van de scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel106
  - number: '106.2'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de erkenning van godsdienstige of
      levensbeschouwelijke bezwaren tegen het sluiten van een verzekering.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel106
  - number: '106.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven ter uitvoering van deze
      afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel106
  - number: '106.4'
    text: |-
      Indien een beschikking niet binnen de bij of krachtens de algemene maatregel van bestuur, bedoeld in dit artikel,
      gestelde termijn kan worden gegeven, stelt Onze minister de aanvrager daarvan in kennis en noemt hij daarbij een
      termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel106
  - number: '107.1'
    text: |-
      Een openbare school wordt opgeheven en de bekostiging van een bijzondere school wordt beëindigd indien de school
      gedurende drie achtereenvolgende schooljaren telkens is bezocht door een aantal leerlingen dat minder bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel107
  - number: 107.1.a
    text: 'voor een school voor praktijkonderwijs: 70 leerlingen,'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel107
  - number: 107.1.b
    text: |-
      voor een school voor voorbereidend beroepsonderwijs met één sector als bedoeld in [artikel 10b, derde lid][ref1]:
      195 leerlingen,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 107.1.c
    text: |-
      voor een school voor voorbereidend beroepsonderwijs met twee of drie sectoren als bedoeld in
      [artikel 10b, derde lid][ref1]: 240 leerlingen,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 107.1.d
    text: |-
      voor een school voor voorbereidend beroepsonderwijs met vier sectoren als bedoeld in
      [artikel 10b, derde lid][ref1]: 360 leerlingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 107.1.e
    text: |-
      voor de overige scholen: drie kwart van het aantal leerlingen dat voor de desbetreffende schoolsoort is genoemd in
      [artikel 65, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel65
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '65'
        afdeling: I
  - number: '107.2'
    text: |-
      Een openbare scholengemeenschap wordt opgeheven en de bekostiging van een bijzondere scholengemeenschap
      wordt beëindigd indien de scholengemeenschap gedurende drie achtereenvolgende schooljaren telkens is
      bezocht door een aantal leerlingen dat minder bedraagt dan de helft van het aantal leerlingen dat op grond
      van [artikel 65, eerste lid][ref1], vereist is voor stichting van de scholen die deel uitmaken van de
      scholengemeenschap, met dien verstande dat het voor scholen voor voorbereidend beroepsonderwijs binnen een
      scholengemeenschap gaat om:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel65
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '65'
        afdeling: I
  - number: 107.2.a
    text: |-
      voor een school met één sector als bedoeld in [10b, derde lid][ref1]: 130 leerlingen,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 107.2.b
    text: |-
      voor een school met twee of drie sectoren als bedoeld in [10b, derde lid][ref1]: 160 leerlingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 107.2.c
    text: |-
      voor een school met vier sectoren als bedoeld in [artikel 10b, derde lid][ref1], wordt gerekend: 240 leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '107.3'
    text: |-
      De opheffing van een openbare school of scholengemeenschap of de beëindiging van de bekostiging van een bijzondere
      school of scholengemeenschap geschiedt met ingang van 1 augustus volgend op de drie achtereenvolgende schooljaren,
      bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel107
  - number: '108.1'
    text: |-
      Grondslag der berekening is het aantal leerlingen dat op 1 oktober van elk van de jaren bij de school was
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel108
  - number: '108.2'
    text: |-
      Indien voor de leerlingen binnen redelijke afstand geen plaatsruimte beschikbaar is op een gelijksoortige school,
      waar het verlangde onderwijs wordt gegeven, past Onze minister [artikel 107][ref1] zodanig toe, dat de leerlingen
      van elk leerjaar de cursus kunnen voltooien.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
  - number: '108.3'
    text: |-
      [Artikel 107][ref1] blijft buiten toepassing, zolang de school niet alle leerjaren omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
  - number: '108.4'
    text: |-
      In bijzondere gevallen kan Onze minister op verzoek van het bevoegd gezag voor een door hem te bepalen tijd
      toestaan, dat een openbare school in stand wordt gehouden of een bijzondere school wordt bekostigd, ook al is
      het aantal leerlingen minder, dan in [artikel 107][ref1] is vermeld. Onze minister besluit binnen zes maanden na
      ontvangst van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze minister
      de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
  - number: '108.5'
    text: |-
      Binnen acht weken na de bekendmaking door het Centraal Bureau voor de Statistiek dan wel door Onze minister van
      de aantallen leerlingen per school voor voortgezet onderwijs, stellen gedeputeerde staten vast welke gemeentelijke
      scholen uit hun provincie gedurende reeds een jaar niet meer voldoen aan de voor hen geldende norm, genoemd in
      [artikel 107][ref1]. Wanneer er als gevolg van de opheffing van een school als bedoeld in de vorige volzin, naar
      hun oordeel niet meer voldoende zal zijn voorzien in de behoefte aan openbaar onderwijs in een genoegzaam aantal
      scholen, dragen gedeputeerde staten burgemeester en wethouders op een verzoek te doen op grond van het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
  - number: '109.1'
    text: |-
      Bij het verstrijken van de looptijd van een regionaal plan onderwijsvoorzieningen als bedoeld in
      [artikel 72][ref1] gaat de aanspraak op bekostiging verloren voor zover het betreft een afdeling als bedoeld in
      [artikel 72, derde lid, onderdeel f][ref2], met dien verstande dat de bekostiging nog een jaar wordt gehandhaafd
      voor zover het betreft het onderwijs aan leerlingen in het derde leerjaar en nog twee jaar voor zover het betreft
      het onderwijs aan leerlingen in het vierde leerjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '72'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '72'
        afdeling: I
  - number: '109.2'
    text: |-
      Het eerste lid is niet van toepassing indien de desbetreffende afdeling op grond van een aansluitend regionaal plan
      onderwijsvoorzieningen als bedoeld in [artikel 72][ref1] of op grond van [artikel 68][ref2] voor bekostiging in
      aanmerking is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel68
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '72'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '68'
        afdeling: I
  - number: 109a.1
    text: |-
      Indien sprake is van een situatie als bedoeld in [artikel 23a1, eerste lid][ref1], kan Onze Minister besluiten dat
      met ingang van een in dat besluit bepaalde datum een in artikel 23a1, eerste lid, bedoelde schoolsoort of leerweg
      van een openbare school wordt opgeheven en de bekostiging van een in artikel 23a1, eerste lid, bedoelde schoolsoort
      of leerweg van een bijzondere school wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23a1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 109a.2
    text: |-
      Indien de toepassing van het eerste lid er toe zou leiden dat een school nog slechts onderwijs zou verzorgen in de
      eerste twee leerjaren dan is het eerste lid van toepassing op de gehele school.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel109a
  - number: 109a.3
    text: 'Alvorens Onze Minister toepassing geeft aan het eerste en tweede lid:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel109a
  - number: 109a.3.a
    text: |-
      heeft de inspectie een onderzoek als bedoeld in [artikel 11][ref1] of
      [artikel 15 van de Wet op het onderwijstoezicht][ref2] verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel15
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '15'
  - number: 109a.3.b
    text: |-
      heeft de inspectie daarover een inspectierapport als bedoeld in
      [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref1] uitgebracht; en


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
  - number: 109a.3.c
    text: |-
      stelt Onze Minister het bevoegd gezag vervolgens vier weken in de gelegenheid zijn zienswijze met betrekking tot de
      voorgenomen opheffing of de voorgenomen beëindiging van de bekostiging naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel109a
  - number: 110a.1
    text: Het bevoegd gezag stort het exploitatie-overschot terug in de desbetreffende overheidskas
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel110a
  - number: 110a.1.a
    text: |-
      indien een openbare school ingevolge [artikel 107][ref1] wordt opgeheven,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
  - number: 110a.1.b
    text: |-
      indien de bekostiging van een bijzondere school ingevolge een van de in onderdeel a genoemde artikelen wordt
      beëindigd, of
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel110a
  - number: 110a.1.c
    text: indien een school ingevolge een beslissing van het bevoegd gezag wordt opgeheven en deze opheffing is gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel110a
  - number: 110a.2
    text: Het exploitatietekort blijft in de gevallen, bedoeld in het eerste lid, voor rekening van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel110a
  - number: 110a.3
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de wijze waarop het exploitatie-overschot,
      bedoeld in het eerste lid, wordt berekend.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel110a
  - number: '112'
    text: Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel112
  - number: '113'
    text: |-
      Het toezicht op de beoordeling door de regionale verwijzingscommissies, bedoeld in [artikel 10e, vierde lid][ref1],
      en [artikel 10g, tweede lid][ref2], is opgedragen aan de inspectie. De [artikelen 3][ref3] en
      [9 van de Wet op het onderwijstoezicht][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10e
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10g
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel9
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10g
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013800
        artikel: '9'
  - number: 118a.1
    text: |-
      Burgemeester en wethouders, de bevoegde gezagsorganen van de scholen in de gemeente, en de bevoegde gezagsorganen
      van de in de gemeente gelegen agrarische opleidingscentra, voor zover het betreft het daarin verzorgde
      voorbereidend beroepsonderwijs, voeren tenminste jaarlijks overleg over het voorkomen van segregatie, het
      bevorderen van integratie en het bestrijden van onderwijsachterstanden, de afstemming over inschrijvings- en
      toelatingsprocedures en het uit het overleg voortvloeiende voorstel van het bevoegd gezag van in de gemeente
      gevestigde scholen om tot een evenwichtige verdeling van leerlingen met een onderwijsachterstand over de scholen
      te komen. Het overleg is gericht op het maken van afspraken over de in de eerste volzin bedoelde onderwerpen.
      Deze afspraken hebben zoveel mogelijk het karakter van meetbare doelen. De inspectie rapporteert jaarlijks over
      de mate waarin die doelen worden bereikt. Burgemeester en wethouders kunnen de uitkomsten van het verplichte op
      overeenstemming gerichte overleg omzetten in bindende afspraken over onder andere de te realiseren prestaties en
      inspanningen, die – alvorens de afspraken tot stand komen – aan alle partijen worden voorgelegd. Indien het overleg
      over de voorgenomen bindende afspraken niet tot overeenstemming leidt, schrijven burgemeester en wethouders een
      nieuw overleg uit, waarbij zij initiatieven nemen tot het bereiken van een zo groot mogelijke consensus. Indien ook
      dit overleg niet tot overeenstemming leidt, vragen burgemeester en wethouders of een van de bevoegde gezagsorganen
      aan de geschillencommissie, bedoeld in het tweede lid, om een bindend advies. De geschillencommissie brengt binnen
      4 weken aan burgemeester en wethouders dan wel aan het bevoegd gezag dat om het advies heeft verzocht, een bindend
      advies uit. Burgemeester en wethouders maken dit advies bekend aan de bevoegde gezagsorganen van de scholen in
      de gemeente.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118a
  - number: 118a.2
    text: Onze minister stelt een geschillencommissie in.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118a
  - number: 118a.3
    text: |-
      De commissie bestaat uit een voorzitter en 4 leden, die allen door Onze minister worden benoemd. De 4 leden worden
      benoemd op voordracht van de gezamenlijke besturenorganisaties en de Vereniging van Nederlandse Gemeenten. De
      voorzitter is een jurist.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118a
  - number: 118a.4
    text: |-
      De voorzitter en de leden worden benoemd voor een termijn van 4 jaar. Zij zijn opnieuw benoembaar. Op eigen verzoek
      wordt aan hen ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118a
  - number: 118g.1
    text: |-
      Onder een voortijdige schoolverlater in de zin van deze titel wordt verstaan degene op wie
      [artikel 28, eerste lid onder a en b][ref1], van toepassing is en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel28
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '28'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 118g.1.a
    text: |-
      die het onderwijs aan de school waaraan hij is ingeschreven gedurende een aaneengesloten periode van ten minste
      vier weken of een door het bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer volgt, of
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118g
  - number: 118g.1.b
    text: |-
      die niet meer aan een school is ingeschreven en evenmin is ingeschreven aan een instelling als bedoeld
      in de [Wet educatie en beroepsonderwijs][ref1] dan wel aan een school of instelling als bedoeld in de
      [Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118g
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0003549
  - number: 118g.2
    text: |-
      Voor zover nodig in afwijking van het eerste lid wordt onder een voortijdige schoolverlater
      niet verstaan degene die in het bezit is van een getuigschrift van het praktijkonderwijs
      als bedoeld in [artikel 10f][ref1] dan wel een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid onderdeel a, van de Wet educatie en beroepsonderwijs][ref2] en werkzaam is op grond van
      een aanstelling of arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 118h.1
    text: |-
      Burgemeester en wethouders dragen zorg voor registratie van de gegevens die het bevoegd gezag ingevolge
      [artikel 28][ref1] heeft gemeld of waarover zij op grond van [artikel 28a][ref2] of op grond van
      [artikel 24f, derde en vierde lid, van de Wet op het onderwijstoezicht][ref3] beschikken. Burgemeester en
      wethouders dragen bovendien zorg voor een systeem van doorverwijzing naar onderwijs of arbeidsmarkt van de in
      [artikel 118g][ref4] bedoelde voortijdige schoolverlaters en voor het onderhoud van dit systeem. Het systeem
      heeft mede betrekking op de gegevens waarover de gemeente beschikt in het kader van de uitvoering van de
      [Leerplichtwet 1969][ref5]. Voor de uitvoering van de eerste en tweede volzin kunnen bij ministeriële regeling
      nadere voorschriften worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel28a
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel24f
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel118g
      [ref5]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel118h
    references:
      - id: ref1
