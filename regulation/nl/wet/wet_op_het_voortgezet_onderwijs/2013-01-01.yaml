        bwb_id: BWBR0002399
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '34.3'
    text: |-
      Het bevoegd gezag van een school aan het hoofd waarvan geen centrale directie is geplaatst, kan voor ten hoogste de
      helft van het aantal, bestaande uit de rector of de directeur en de aan de school verbonden conrectoren of adjunct-
      directeuren, afwijken van het bepaalde in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel34
  - number: '35.1'
    text: |-
      De onderwijsondersteunend functionaris kan worden belast met in [artikel 36, derde lid][ref1], bedoelde
      werkzaamheden in het voortgezet onderwijs indien deze:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 35.1.a
    text: |-
      in het bezit is van een verklaring omtrent het gedrag, afgegeven ingevolge de
      [Wet justitiële en strafvorderlijke gegevens][ref1], die op het tijdstip van overlegging aan het bevoegd gezag
      niet ouder is dan 6 maanden, en


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 35.1.b
    text: |-
      in het bezit is van een getuigschrift afgegeven krachtens de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] of de [Wet educatie en beroepsonderwijs][ref2],
      dat is voldaan aan de in [artikel 36, derde lid][ref3], bedoelde bekwaamheidseisen of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0007625
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0007625
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 35.1.c
    text: |-
      in het bezit is van een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EG-beroepskwalificaties][ref1], verleend ten aanzien van de door hem te
      verrichten werkzaamheden, of


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 35.1.d
    text: volgens bij algemene maatregel van bestuur te geven regels zijn bekwaamheid heeft aangetoond, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel35
  - number: 35.1.e
    text: niet krachtens rechterlijke uitspraak is uitgesloten van het verrichten van die werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel35
  - number: '35.2'
    text: |-
      Het eerste lid is niet van toepassing op een onderwijsondersteunende functionaris voor zover deze is belast met
      werkzaamheden in verband met contractactiviteiten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel35
  - number: '35.3'
    text: |-
      De onderwijsondersteunende functionaris die niet voldoet aan de eisen van het eerste lid, onder b, c of d, mag
      voor zover het werkzaamheden betreft waarvoor op grond van [artikel 36, derde lid][ref1], bekwaamheidseisen
      zijn vastgesteld, niettemin met die werkzaamheden worden belast, voor een periode van ten hoogste twee jaren.
      Aan de eerste volzin wordt uitsluitend toepassing gegeven indien het bevoegd gezag en betrokkene in ieder geval
      schriftelijk hebben verklaard dat betrokkene verplicht is zich in te spannen om binnen twee jaren alsnog te voldoen
      aan de bekwaamheidseisen voor die werkzaamheden. Het bevoegd gezag beschikt over geordende gegevens met betrekking
      tot de toepassing van de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '35.4'
    text: |-
      Ten aanzien van studenten aan een opleiding als bedoeld in
      [artikel 7.7, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1]
      en deelnemers aan de beroepsbegeleidende leerweg van een opleiding als bedoeld in
      [artikel 7.2.2 van de Wet educatie en beroepsonderwijs][ref2] die in het kader van die opleiding
      onderwijsondersteunende werkzaamheden verrichten waarvoor op grond van [artikel 36, derde lid][ref3],
      bekwaamheidseisen zijn vastgesteld, kan voor de duur van die werkzaamheden worden afgeweken van het eerste lid
      onder b tot en met d.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 35a
    text: |-
      Volgens regelen, te stellen bij algemene maatregel van bestuur, kunnen in bijzondere gevallen, in afwijking van
      de eisen van benoembaarheid, gesteld in [artikel 33, eerste lid onder b][ref1], leraren die voldoen aan de in
      [artikel 36, eerste juncto vijfde lid][ref2], bedoelde bekwaamheidseisen, niet zijnde bekwaamheidseisen voor de
      periode van voorbereidend hoger onderwijs, tot een bepaald aantal lessen tijdelijk tevens onderwijs geven in het
      desbetreffende vak of de desbetreffende combinatie van vakken aan de scholen of leerjaren van scholen waarvoor moet
      worden voldaan aan laatstgenoemde bekwaamheidseisen. In de gevallen, bedoeld in de eerste volzin, is melding aan de
      inspectie vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '36.1'
    text: Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor leraren.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel36
  - number: '36.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor werkzaamheden van leidinggevende aard die nauw verband houden met
      het pedagogisch-didactische klimaat op de school of onderwijskundige leiding omvatten, bekwaamheidseisen worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel36
  - number: '36.3'
    text: |-
      Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor bij die maatregel aan te wijzen
      onderwijsondersteunende werkzaamheden die rechtstreeks verband houden met het onderwijsleerproces.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel36
  - number: '36.4'
    text: |-
      De in het eerste lid bedoelde bekwaamheidseisen zijn gericht op het handelen in het onderwijsleerproces, het
      algemeen professioneel handelen en het werken binnen een onderwijsorganisatie. Zij omvatten in elk geval eisen ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel36
  - number: 36.4.a
    text: pedagogisch-didactische kennis, inzicht en vaardigheden, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel36
  - number: 36.4.b
    text: vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel36
  - number: '36.5'
    text: |-
      De in het eerste lid bedoelde bekwaamheidseisen kunnen worden onderscheiden naar schoolsoort en naar samenhangende
      leerjaren, met dien verstande dat zij in elk geval specifiek worden vastgesteld voor de periode van voorbereidend
      hoger onderwijs, bedoeld in artikel 12, eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel36
  - number: '36.6'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste, tweede en derde lid, wordt aan de beide Kamers der
      Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn
      verstreken en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel36
  - number: '36.7'
    text: |-
      Onze Minister stelt een beroepsorganisatie die hij vanuit het oogpunt van beroepskwaliteit representatief acht voor
      onderwijspersoneel als bedoeld in deze wet, in de gelegenheid hem een voorstel te doen voor de in het eerste en
      derde lid voorgeschreven bekwaamheidseisen en kan een representatief geachte beroepsorganisatie in de gelegenheid
      stellen hem een voorstel te doen voor bekwaamheidseisen die op grond van het tweede lid kunnen worden vastgesteld.
      Onze Minister stelt deze organisatie vervolgens in elk geval eenmaal in de zes jaar in de gelegenheid, hem een
      voorstel te doen over ongewijzigde handhaving of wijziging van de bekwaamheidseisen voor zover vastgesteld. Uit een
      voorstel als bedoeld in de eerste of tweede volzin blijkt tevens, in hoeverre dat voorstel mede steun geniet van
      een vertegenwoordiging van bevoegde gezagsorganen, van ouders en van leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel36
  - number: '37'
    text: |-
      Degene die voor een bepaald vak voldoet aan de in [artikel 36, eerste juncto vijfde lid][ref1], bedoelde
      bekwaamheidseisen voor de periode van voorbereidend hoger onderwijs, is daarmee tevens bekwaam voor dat vak voor
      zover dat wordt verzorgd in het voortgezet onderwijs niet zijnde de periode van voorbereidend hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 37a
    text: |-
      Het bevoegd gezag beschikt ten aanzien van elk personeelslid dat een functie of werkzaamheden verricht waarvoor
      bekwaamheidseisen zijn vastgesteld, over geordende gegevens met betrekking tot de bekwaamheid en het onderhouden
      van de bekwaamheid. Ten behoeve van de onderlinge vergelijkbaarheid en herkenbaarheid van de gegevens kunnen bij
      ministeriële regeling voorschriften worden vastgesteld over de inrichting en wijze van ordening van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel37a
  - number: 37f
    text: |-
      Ten behoeve van een scholengemeenschap als bedoeld in [artikel 19][ref1], worden bij algemene maatregel van bestuur
      voorschriften vastgesteld met betrekking tot de toepassing van de [artikelen 32 tot en met 37][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel32
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel37f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '19'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '32'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '38.1'
    text: |-
      Degene die beschikt over een in artikel 118k bedoelde geschiktheidsverklaring, het bevoegd gezag dat benoemt of
      tewerkstelt zonder benoeming, en het bestuur van een instelling die werkzaamheden uitvoert als bedoeld in artikel
      118p, eerste lid, onder a, sluiten een overeenkomst die hun wederzijdse rechten en plichten omvat met betrekking
      tot het uitvoeren van de noodzakelijk geachte scholing en begeleiding, met inachtneming van de beoordeling,
      bedoeld in artikel 118l, tweede lid, onder c. Indien na het sluiten van de overeenkomst blijkt dat de scholing
      of begeleiding niet volgens de overeenkomst kan worden uitgevoerd, treft het bevoegd gezag tijdig een toereikende
      vervangende voorziening.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel38
  - number: '38.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van
      het eerste lid, waaronder in elk geval voorschriften ter waarborging van de kwaliteit van het daarin bepaalde.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel38
  - number: '38.3'
    text: |-
      Tevens worden bij algemene maatregel van bestuur bijzondere zonodig van deze wet afwijkende voorschriften gegeven
      voor gevallen waarin men voor dezelfde werkzaamheden wenst te worden benoemd of tewerkgesteld zonder benoeming aan
      scholen die niet uitgaan van hetzelfde bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel38
  - number: '38.4'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het tweede en derde lid, wordt aan de beide Kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken
      en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel38
  - number: 38a.1
    text: |-
      Met inachtneming van bij of krachtens algemene maatregel van bestuur vastgestelde voorschriften als bedoeld in het
      tweede en derde lid regelt het bevoegd gezag van een openbare school de rechtspositie van het personeel en draagt
      het bevoegd gezag van een bijzondere school zorg voor de regeling van de rechtspositie van het personeel.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel38a
  - number: 38a.2
    text: |-
      Bij algemene maatregel van bestuur onderscheidenlijk bij of krachtens algemene maatregel van bestuur kunnen
      voorschriften worden vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel38a
  - number: 38a.2.a
    text: |-
      salarisschalen en uitgangspunten waaraan een door het bevoegd gezag in te richten functiewaarderingssysteem moet
      voldoen, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel38a
  - number: 38a.2.b
    text: |-
      rechten en plichten van het personeel en het bevoegd gezag bij ziekte, bevalling, zwangerschap,
      arbeidsongeschiktheid en ontslag, dan wel met betrekking tot bedrijfsgezondheidskundige begeleiding, voor zover
      deze bij wet voorgeschreven rechten en verplichtingen te boven gaan, dan wel de voorwaarden waaronder het bevoegd
      gezag deze rechten en plichten zelf regelt of voor de regeling daarvan zorg draagt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel38a
  - number: 38a.3
    text: Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld betreffende algemene arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel38a
  - number: 38a.4
    text: |-
      Onder regeling van de rechtspositie als bedoeld in het eerste lid wordt tevens begrepen het vaststellen van
      bepalingen inzake aanstelling, benoeming, schorsing, disciplinaire maatregelen en ontslag van personeel. De
      bepalingen omtrent ontslag mogen het personeel van de openbare scholen niet minder rechten verschaffen dan
      die welke voor werknemers met een arbeidsovereenkomst voortvloeien uit de bepalingen van dwingend recht van
      [titel 10 van boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: '39'
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat de rector, de directeur, de conrectoren, de adjunct-directeuren, de
      leden van de centrale directie, de leraren en het overige personeel.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39
  - number: 39a.1
    text: |-
      Het bevoegd gezag benoemt de rector, de directeur, de conrector en de adjunct-directeur, de centrale directie, de
      leraren en het overige personeel, bedoeld in [artikel 39][ref1], in algemene dienst van het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel39
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '39'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 39a.2
    text: |-
      Onder benoeming in algemene dienst van het bevoegd gezag wordt in dit artikel en in de [artikelen 43a][ref1] en
      [51][ref2] verstaan een benoeming ten behoeve van het verrichten van werkzaamheden aan door het bevoegd gezag in
      stand gehouden scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel51
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 43a
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '51'
        hoofdstuk: III
        afdeling: I
  - number: 39c.1
    text: |-
      Het bevoegd gezag is verplicht aan studenten die in opleiding zijn voor een functie in het voortgezet onderwijs,
      in de educatie of het beroepsonderwijs, bedoeld in de [Wet educatie en beroepsonderwijs][ref1], in het hoger
      beroepsonderwijs of in het basisonderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste
      ervaring in de school te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39c
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 39c.2
    text: |-
      De verplichting, bedoeld in het eerste lid, betreft studenten die zijn ingeschreven voor een opleiding voor het
      beroep van leraar waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft of
      anderszins studeren om aan de bekwaamheidseisen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39c
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 39c.3
    text: |-
      Het in uren uitgedrukte aantal lessen en onderdelen van het in schooltijd verzorgd onderwijsprogramma waarvoor het
      bevoegd gezag in enig schooljaar verplicht is, studenten als bedoeld in het eerste lid tot de school toe te laten,
      bedraagt gezamenlijk 5 procent van het in uren uitgedrukte totale aantal in dat schooljaar te geven lessen en te
      verzorgen onderdelen van het in schooltijd verzorgd onderwijsprogramma. Onze minister kan het percentage lager
      stellen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39c
  - number: 39c.4
    text: |-
      Een bevoegd gezag kan een student de verdere toegang tot de school ontzeggen, indien deze in de school in strijd
      handelt met de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot
      de school wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van de
      betrokken opleidingsinstelling dan wel aan de betrokken staatsexamencommissie, en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39c
  - number: 39c.5
    text: |-
      De rector of de directeur dan wel de centrale directie regelt, onder verantwoordelijkheid van het bevoegd gezag, de
      werkzaamheden in verband met de begeleiding door de leraren van de studenten in de school in overeenstemming met de
      leraren, alsmede in overeenstemming met de betrokken opleidingsinstellingen, dan wel, indien het betreft studenten
      die zich voorbereiden op het afleggen van een staatsexamen ter verkrijging van een bewijs van bekwaamheid, in
      overeenstemming met de betrokken staatsexamencommissie.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39c
  - number: 39c.6
    text: |-
      Onze minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor een schooljaar.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39c
  - number: 39c.7
    text: |-
      De scholen waarop studenten als bedoeld in het eerste lid, zijn toegelaten, zijn toegankelijk voor de inspectie
      belast met het toezicht op de opleidingsinstellingen, voor de directieleden en de door deze aan te wijzen docenten
      van die opleidingsinstellingen, alsmede voor de leden van de betrokken staatsexamencommissies, een en ander voor
      zover zulks voor de uitoefening van het toezicht op de praktische vorming onderscheidenlijk de begeleiding van de
      praktische vorming van de in de school aanwezige studenten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39c
  - number: 39c.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden in verband met het bepaalde in dit artikel nadere
      voorschriften gegeven, betreffende de navolgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39c
  - number: 39c.8.a
    text: |-
      het maximum aantal lessen in een vak van een schoolsoort, gedurende dewelke het bevoegd gezag in enig schooljaar
      verplicht is studenten als bedoeld in het eerste lid, toe te laten, welk maximum de 20 procent niet te boven mag
      gaan;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39c
  - number: 39c.8.b
    text: |-
      het maximum aantal studenten als bedoeld in het eerste lid, dat bij dezelfde les kan worden toegelaten, welk
      maximum, behoudens bijzondere omstandigheden, de 3 niet te boven mag gaan, alsmede de gevolgen die het toelaten van
      meer dan een student bij dezelfde les heeft voor het maximum, bedoeld in het derde lid, en het maximum, bedoeld in
      dit lid onder a.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39c
  - number: 39c.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in verband met het bepaalde in dit artikel nadere
      voorschriften worden gegeven, betreffende de navolgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39c
  - number: 39c.9.a
    text: |-
      de wijze van aanmelden van studenten als bedoeld in het eerste lid, alsmede de termijn die voor de aanmelding door
      het bevoegd gezag mag worden gesteld;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39c
  - number: 39c.9.b
    text: |-
      de wijze waarop door de school bekendheid moet worden gegeven aan opleidingsinstellingen en staatsexamencommissies
      over de beschikbaarheid en de aard van schoolpracticumplaatsen;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39c
  - number: 39c.9.c
    text: de categorieën studenten ten aanzien van wie de verplichting, bedoeld in het eerste lid, niet geldt;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39c
  - number: 39c.9.d
    text: |-
      regulering in de situatie dat, bij een beperkte beschikbaarheid van schoolpracticumplaatsen aan de school,
      gelijktijdig studenten die in opleiding zijn voor een functie in het voortgezet onderwijs, en studenten die in
      opleiding zijn voor een functie in het basisonderwijs, worden aangemeld;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39c
  - number: 39c.9.e
    text: |-
      de vakken en andere programma-onderdelen van een schoolsoort, waarvoor in verband met de geringe omvang van het
      onderwijs daarin, de in het eerste lid bedoelde verplichting niet geldt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel39c
  - number: 40a
    text: |-
      Over de regelingen, bedoeld in [artikel 38a, eerste en vierde lid][ref1], alsmede over andere aangelegenheden van
      algemeen belang voor de rechtstoestand van het personeel, wordt door of namens het bevoegd gezag overleg gevoerd
      met de daarvoor in aanmerking komende vakorganisaties van overheids- en onderwijspersoneel, op een met deze
      schriftelijk overeengekomen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 38a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '41'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het verrichten van contractactiviteiten er niet toe leidt dat minder dan
      51% van de personeelskosten van de school uit 's Rijks kas wordt bekostigd.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel41
  - number: '42.1'
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de leerlingen met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving, en met onderkenning
      van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42
  - number: '42.2'
    text: Openbare scholen zijn toegankelijk voor leerlingen zonder onderscheid naar godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42
  - number: '42.3'
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42
  - number: 42a.1
    text: |-
      Een gemeenteraad kan bij verordening een openbare rechtspersoon instellen die tot doel heeft een of meer
      openbare scholen in de gemeente in stand te houden, al dan niet te zamen met openbare scholen als bedoeld in de
      [Wet op het primair onderwijs][ref1] of openbare scholen als bedoeld in de [Wet op de expertisecentra][ref2]. Een
      openbare rechtspersoon kan ook worden ingesteld door meer dan een gemeente ten behoeve van het in stand houden
      van openbare scholen in die gemeenten door het vaststellen van een voor wat betreft de onderwerpen, bedoeld in
      het vierde lid, gelijkluidende verordening, in welk geval de openbare rechtspersoon niet eerder tot stand komt dan
      nadat alle daartoe strekkende verordeningen in werking zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: 42a.2
    text: De gemeenteraad of gemeenteraden maken het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.3
    text: |-
      De openbare rechtspersoon oefent met uitzondering van de besluitvorming over de opheffing van een openbare school
      alle taken en bevoegdheden uit van het bevoegd gezag. Hij bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.4
    text: 'De verordening, bedoeld in het eerste lid, voorziet in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.4.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.4.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte, doch
      geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.4.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.4.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.4.e
    text: de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.4.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.4.g
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt, met dien verstande dat in de regeling een overheersende invloed van de overheid in het
      bestuur is verzekerd.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.5
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.6
    text: |-
      De vergaderingen van het bestuur van de openbare rechtspersoon zijn openbaar, tenzij het bestuur anders beslist, op
      gronden, vermeld in de verordening.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.7
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.8
    text: |-
      De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren
      in strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de openbare rechtspersoon
      te ontbinden.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.9
    text: |-
      Indien de school een raad van toezicht heeft, is het vierde lid niet van toepassing en voorziet de verordening,
      bedoeld in het eerste lid, onverminderd [artikel 24e1][ref1] in ieder geval in een regeling omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24e1
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 24e1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 42a.9.a
    text: de samenstelling, werkwijze en inrichting van de raad van toezicht van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.9.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien
      verstande dat de leden van de raad van toezicht worden benoemd door de gemeenteraad of gemeenteraden en dat ten
      minste een derde gedeelte, doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders
      van de leerlingen die zijn ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.9.c
    text: de termijn waarvoor de leden van de raad van toezicht worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.9.d
    text: de vaststelling van de begroting en de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42a.9.e
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt, met dien verstande dat in de regeling een overheersende invloed van de overheid in de raad
      van toezicht is verzekerd. Het vijfde, zesde en achtste lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42a
  - number: 42b.1
    text: |-
      Een gemeenteraad kan besluiten dat een of meer openbare scholen in de gemeente in stand worden gehouden door een
      stichting die zich ten doel stelt het in stand houden van een of meer openbare scholen, al dan niet te zamen met
      openbare scholen als bedoeld in de [Wet op het primair onderwijs][ref1] of de [Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: 42b.2
    text: De gemeenteraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.3
    text: |-
      Een stichting die een openbare school in stand houdt, wordt opgericht door een of meer gemeenten, al dan niet te
      zamen met een of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.4
    text: Het statutaire doel van de stichting is uitsluitend het geven van openbaar onderwijs overeenkomstig artikel 42.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.5
    text: |-
      De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken en
      bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.6
    text: 'Onverminderd het vierde lid, voorzien de statuten in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.6.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.6.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte, doch
      geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.6.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.6.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.6.e
    text: de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.6.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.6.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.6.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.7
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de desbetreffende gemeenteraad of
      gemeenteraden.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.8
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.9
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.10
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.11
    text: |-
      De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren in
      strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de stichting te ontbinden.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.12
    text: |-
      Indien de school een raad van toezicht heeft, is het zesde lid niet van toepassing en voorzien de statuten,
      onverminderd [artikel 24e1][ref1], in ieder geval in een regeling omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24e1
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 24e1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 42b.12.a
    text: de samenstelling, werkwijze en inrichting van de raad van toezicht van de stichting,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.12.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien
      verstande dat de leden van de raad van toezicht worden benoemd door de gemeenteraad of gemeenteraden en dat ten
      minste een derde gedeelte, doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders
      van de leerlingen die zijn ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.12.c
    text: de termijn waarvoor de leden van de raad van toezicht worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.12.d
    text: de vaststelling van de begroting en de jaarrekening,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.12.e
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42b.12.f
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van
      de overheid in de raad van toezicht is verzekerd. Het achtste, negende en elfde lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42b
  - number: 42c.1
    text: |-
      Een rechtspersoon die een openbare school in stand houdt, kan de instandhouding van die school overdragen aan een
      andere rechtspersoon die tot de instandhouding van een openbare school bevoegd is.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42c
  - number: 42c.2
    text: |-
      De overdracht geschiedt bij notariële akte. Bij deze akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van gebouwen, terreinen en roerende zaken over te dragen. Deze akte geldt tevens als akte van
      levering, bedoeld in [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1]. In de akte wordt tevens bepaald dat
      de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen aanstelt met ingang van de datum
      van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42c
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: 42c.3
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger, onverminderd hetgeen verder voor de
      overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42c
  - number: 42c.4
    text: |-
      Voor zover het betreft scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen
      voortgezet onderwijs, voor voorbereidend beroepsonderwijs en voor praktijkonderwijs kunnen burgemeester en
      wethouders in bijzondere omstandigheden ontheffing verlenen van de verplichting tot overdracht van de rechten ten
      aanzien van gebouwen, terreinen en roerende zaken.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel42c
  - number: '43'
    text: |-
      In afwijking van [artikel 39][ref1] leggen Gedeputeerde Staten van de desbetreffende provincie de disciplinaire
      straf of de schorsing op of verlenen zij het ontslag, indien het betreft een rector, een directeur, een conrector,
      een adjunct-directeur, een lid van de centrale directie of een leraar van een openbare school, die tevens lid van
      de raad der gemeente is, welke die school in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel39
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '39'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 43a.1
    text: |-
      De rector, de directeur, de conrectoren, de adjunct-directeuren, de leden van de centrale directie, de leraren en
      het overige personeel, bedoeld in [artikel 38a][ref1], van de openbare school, zijn in het bezit van een door het
      bevoegd gezag getekende akte van aanstelling. De akte van aanstelling bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 38a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 43a.1.a
    text: de naam en het adres van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel43a
  - number: 43a.1.b
    text: de naam, de voornamen en de geboortedatum van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel43a
  - number: 43a.1.c
    text: de datum van ingang van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel43a
  - number: 43a.1.d
    text: de functie waarin de betrokkene wordt aangesteld;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel43a
  - number: 43a.1.e
    text: |-
      de bepaling of de aanstelling in vaste of in tijdelijke dienst geschiedt en in het laatste geval de gronden voor de
      tijdelijkheid en de duur van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel43a
  - number: 43a.1.f
    text: de omvang van de betrekking;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel43a
  - number: 43a.1.g
    text: de op de dag van zijn aanstelling van toepassing zijnde schaal en het salarisnummer;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel43a
  - number: 43a.1.h
    text: de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel43a
  - number: 43a.2
    text: |-
      Het bevoegd gezag draagt zorg dat afschriften van de bewijsstukken waarmee de bekwaamheid wordt aangetoond, van de
      geschiktheidsverklaringen, van de verklaringen omtrent het gedrag, alsmede van de akte van aanstelling van het aan
      de school verbonden personeel worden bewaard.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel43a
  - number: 43a.3
    text: Het tweede lid is van overeenkomstige toepassing op personeel dat is tewerkgesteld zonder aanstelling.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel43a
  - number: '44.1'
    text: Het onderwijs aan openbare scholen wordt gegeven met eerbiediging van ieders geloofs- of levensovertuiging.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel44
  - number: '44.2'
    text: |-
      Wij kunnen hem, die zich in dit opzicht aan plichtsverzuim schuldig maakt, voor ten hoogste een jaar en bij
      herhaling voor onbepaalde tijd in zijn bevoegdheid tot het geven van onderwijs aan een openbare school schorsen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel44
  - number: '46.1'
    text: |-
      Aan de openbare scholen worden op verzoek van kerkelijke gemeenten of van plaatselijke kerken de leerlingen in
      de gelegenheid gesteld in de schoollokalen godsdienstonderwijs te volgen van godsdienstleraren, daartoe door die
      gemeenten of kerken aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel46
  - number: '46.2'
    text: De schoollokalen worden, zo nodig verwarmd en verlicht, kosteloos voor het godsdienstonderwijs beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel46
  - number: '46.3'
    text: |-
      Bij een geschil omtrent het vaststellen van lessen of het beschikbaar stellen van lokalen van openbare scholen
      beslist Onze minister.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel46
  - number: '46.4'
    text: |-
      Aan de kerkelijke gemeenten of de plaatselijke kerken kan een subsidie worden verstrekt. De
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref1] zijn van toepassing, met dien verstande dat de
      subsidie slechts kan worden verstrekt bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '46.5'
    text: |-
      Voor de toepassing van dit artikel worden met kerkelijke gemeenten gelijkgesteld verenigingen met volledige
      rechtsbevoegdheid, die zich blijkens de statuten het geven of doen geven van godsdienstonderwijs ten doel stellen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel46
  - number: '46.6'
    text: |-
      Het bevoegd gezag ziet erop toe dat dit onderwijs uitsluitend wordt gegeven door een leraar die blijkens een
      daartoe strekkende verklaring van de aanwijzende kerkelijke gemeente of plaatselijke kerk:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel46
  - number: 46.6.a
    text: |-
      voldoet aan de bekwaamheidseisen die krachtens artikel 36, eerste lid, voor het geven van dat onderwijs zijn
      vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel46
  - number: 46.6.b
    text: zijn bekwaamheid onderhoudt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel46
  - number: '47.1'
    text: |-
      Aan de openbare scholen worden op verzoek van door Ons tot dit doel toegelaten genootschappen op geestelijke
      grondslag de leerlingen, wier ouders, voogden of verzorgers daartoe de wens te kennen geven, in de gelegenheid
      gesteld in de schoollokalen levensbeschouwelijk vormingsonderwijs te volgen van leraren, daartoe door deze
      genootschappen aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel47
  - number: '47.2'
    text: De schoollokalen worden, zo nodig verwarmd en verlicht, kosteloos voor het vormingsonderwijs beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel47
  - number: '47.3'
    text: |-
      Bij een geschil omtrent het vaststellen van lessen of het beschikbaar stellen van lokalen van openbare scholen
      beslist Onze minister.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel47
  - number: '47.4'
    text: |-
      Aan de genootschappen, bedoeld in het eerste lid, kan een subsidie worden verstrekt. De
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref1] zijn van toepassing, met dien verstande dat de
      subsidie slechts kan worden verstrekt bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '47.5'
    text: |-
      Het bevoegd gezag ziet erop toe dat dit onderwijs uitsluitend wordt gegeven door een leraar die blijkens een
      daartoe strekkende verklaring van het aanwijzend genootschap op geestelijke grondslag:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel47
  - number: 47.5.a
    text: |-
      voldoet aan de bekwaamheidseisen die krachtens [artikel 36, eerste lid][ref1], voor het geven van dat onderwijs
      zijn vastgesteld, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 47.5.b
    text: zijn bekwaamheid onderhoudt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel47
  - number: '48.1'
    text: |-
      Indien binnen redelijke afstand van de woning van de leerling niet de gelegenheid bestaat tot het volgen van het
      onderwijs aan een openbare school, mag aan deze leerling de toegang tot een gelijksoortige, uit de openbare kas
      bekostigde bijzondere school niet worden geweigerd op grond van levensbeschouwing, tenzij de school uitsluitend
      bestemd is voor interne leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel48
  - number: '48.2'
    text: |-
      Indien tot een bijzondere school ingevolge het eerste lid andere leerlingen worden toegelaten dan voor wie de
      school in verband met de levensbeschouwing wordt in stand gehouden, kunnen deze leerlingen niet worden verplicht
      tot het volgen van de lessen in de vakken of andere programma-onderdelen, die in verband met die levensbeschouwing
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel48
  - number: 48a
    text: |-
      Indien het bevoegd gezag van een bijzondere school aan Onze Minister de mededeling heeft gedaan, bedoeld
      in [artikel 27a, vijfde lid][ref1], kan de leerling binnen 6 weken na ontvangst van de gegevens, bedoeld in
      [artikel 27a, zevende lid][ref2], bij het bevoegd gezag schriftelijk bedenkingen uiten tegen die mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel27a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 27a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 27a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '49.1'
    text: |-
      De bijzondere school staat onder het bestuur van een rechtspersoon met volledige rechtsbevoegdheid die zich het
      geven van onderwijs in de zin van deze wet ten doel stelt zonder daarbij het maken van winst te beogen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel49
  - number: '49.2'
    text: Het schoolbestuur draagt zorg voor een deskundig beheer.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel49
  - number: '50.1'
    text: |-
      De rechtspersoon die een bijzondere school in stand houdt, kan de instandhouding van die school overdragen aan een
      andere rechtspersoon die voldoet aan het bepaalde in [artikel 49, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel49
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '49'
        hoofdstuk: III
        afdeling: I
  - number: '50.2'
    text: |-
      De overdracht geschiedt bij notariële akte. Bij deze akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van gebouwen, terreinen en roerende zaken over te dragen. Deze akte geldt tevens als akte van
      levering, bedoeld in [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1]. In de akte wordt tevens bepaald dat
      de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen benoemt met ingang van de datum
      van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: '50.3'
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid treedt de verkrijgende rechtspersoon in alle uit de
      wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de school, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel50
  - number: '50.4'
    text: |-
      Voor zover het betreft scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen
      voortgezet onderwijs en voor voorbereidend beroepsonderwijs kunnen burgemeester en wethouders in bijzondere
      omstandigheden ontheffing verlenen van de verplichting tot overdracht van de rechten ten aanzien van gebouwen,
      terreinen en roerende zaken.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel50
  - number: '50.5'
    text: |-
      Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1] van een rechtspersoon
      die een school in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende rechtspersoon de
      school in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de school overgaat. In het
      laatste geval zijn het tweede tot en met vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
  - number: '51.1'
    text: |-
      De rector, de directeur, de conrectoren, de adjunct-directeuren, de leden van de centrale directie, de leraren en
      het overige personeel, bedoeld in [artikel 38a][ref1], van de bijzondere school zijn in het bezit van een door het
      bevoegd gezag en door henzelf getekende akte van benoeming. Deze akte van benoeming bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 38a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 51.1.a
    text: de naam en het adres van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel51
  - number: 51.1.b
    text: de naam, de voornamen en de geboortedatum van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel51
  - number: 51.1.c
    text: de datum van ingang van de benoeming;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel51
  - number: 51.1.d
    text: de functie waarin de betrokkene wordt benoemd;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel51
  - number: 51.1.e
    text: |-
      de bepaling of de benoeming in vaste of in tijdelijke dienst geschiedt en in het laatste geval de gronden voor de
      tijdelijkheid en de duur van de benoeming;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel51
  - number: 51.1.f
    text: de omvang van de betrekking;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel51
  - number: 51.1.g
    text: de op de dag van zijn benoeming van toepassing zijnde schaal en het salarisnummer;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel51
  - number: 51.1.h
    text: de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel51
  - number: '51.2'
    text: De akte van benoeming bevat bepalingen inzake gronden voor schorsing, ontslag en disciplinaire maatregelen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel51
  - number: '51.3'
    text: |-
      Het bevoegd gezag draagt zorg dat afschriften van de bewijsstukken waarmee de bekwaamheid wordt aangetoond, van de
      geschiktheidsverklaringen, van de verklaringen omtrent het gedrag, alsmede van de akten van benoeming van het aan
      de school verbonden personeel worden bewaard.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel51
  - number: '51.4'
    text: Het derde lid is van overeenkomstige toepassing op personeel dat is tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel51
  - number: '52.1'
    text: |-
      Het bevoegd gezag van een bijzondere school is aangesloten bij een commissie van beroep. De rector of de directeur,
      de conrectoren, de adjunct-directeuren, de leden van de centrale directie, de leraren en het overige personeel,
      bedoeld in [artikel 38a][ref1], kunnen bij die commissie beroep instellen tegen een beslissing van het bevoegd
      gezag inhoudende:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 38a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 52.1.a
    text: een disciplinaire maatregel,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel52
  - number: 52.1.b
    text: schorsing,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel52
  - number: 52.1.c
    text: het direct of indirect onthouden van promotie,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel52
  - number: 52.1.d
    text: het verminderen van de omvang van de betrekking,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel52
  - number: 52.1.e
    text: |-
      ontslag anders dan op eigen verzoek, voordat de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], is bereikt,


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 52.1.f
    text: |-
      de beslissing van het bevoegd gezag ten aanzien van een personeelslid op basis waarvan op termijn vermindering van
      diens betrekkingsomvang kan plaatsvinden,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel52
  - number: 52.1.g
    text: de beëindiging van een verlengd tijdelijk dienstverband,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel52
  - number: 52.1.h
    text: |-
      de aanwijzing als personeelslid boven de reguliere formatie voortvloeiend uit een algemeen verbindend voorschrift
      welke aanwijzing op termijn kan leiden tot ontslag, vermindering van de betrekkingsomvang of beëindiging van een
      verlengd tijdelijk dienstverband, of
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel52
  - number: 52.1.i
    text: de aanwijzing van een andere school of andere scholen waaraan een personeelslid werkzaamheden zal verrichten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel52
  - number: '52.2'
    text: |-
      Een beslissing als bedoeld in het eerste lid, aanhef wordt schriftelijk aan de betrokkene medegedeeld. Daarbij
      wordt tevens vermeld de beroepstermijn en het adres van de commissie waar het beroep kan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel52
  - number: '52.3'
    text: Het bevoegd gezag onderwerpt zich aan de uitspraak van de commissie.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel52
  - number: 52a.1
    text: |-
      Het beroep, bedoeld in [artikel 52][ref1], wordt schriftelijk ingesteld binnen zes weken, nadat de beslissing aan
      betrokkene is medegedeeld. Bij overschrijding van deze termijn ten gevolge van omstandigheden die de betrokkene
      niet kunnen worden verweten, laat de commissie niet-ontvankelijkverklaring op die grond achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel52
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '52'
        hoofdstuk: III
        afdeling: I
  - number: 52a.2
    text: |-
      Tijdens de behandeling door de commissie van beroep loopt geen verjaring met betrekking tot rechtsvorderingen ter
      zake van beslissingen die aan het oordeel van de commissie zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel52a
  - number: '53.1'
    text: |-
      Een commissie van beroep strekt haar werkkring uit over ten minste twintig bijzondere scholen. Onze minister kan
      het in de vorige volzin bedoelde aantal scholen lager stellen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53
  - number: '53.2'
    text: |-
      Zij bestaat uit vijf leden en vijf plaatsvervangende leden, waarvan twee leden en twee plaatsvervangende
      leden worden gekozen door de schoolbesturen en twee leden en twee plaatsvervangende leden door het personeel
      van de in het vorige lid bedoelde scholen. Deze vier leden kiezen het vijfde lid, tevens voorzitter, en diens
      plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53
  - number: '53.3'
    text: |-
      De leden en plaatsvervangende leden mogen niet zitting hebben in het schoolbestuur, noch deel uitmaken van het
      personeel van een school, waarover de commissie haar werkkring uitstrekt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53
  - number: '53.4'
    text: |-
      Omtrent de verdere samenstelling en de werkwijze van de commissies van beroep worden nadere voorschriften gegeven
      bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53
  - number: 53a
    text: |-
      In een geval als bedoeld in [artikel 39c, vierde lid, eerste volzin][ref1], maakt het bevoegd gezag van een
      bijzondere school de beslissing tot ontzegging van de toegang tot de school schriftelijk en met redenen omkleed
      bekend aan de betrokken student.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel39c
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 39c
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 53b.1
    text: Op het personeel van een rechtspersoon met volledige rechtsbevoegdheid die
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53b
  - number: 53b.1.a
    text: |-
      uitsluitend wordt bestuurd door een bevoegd gezag al dan niet met een of meer andere bevoegde gezagsorganen als
      bedoeld in deze wet, de [Wet op het primair onderwijs][ref1] of de [Wet op de expertisecentra][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: 53b.1.b
    text: |-
      zich blijkens de statuten dan wel de gemeenschappelijke regeling,
      bedoeld in de [Wet gemeenschappelijke regelingen][ref1], behoudens
      [artikel 20, derde, vierde en vijfde lid, van de Wet op het primair onderwijs][ref2], uitsluitend ten doel stelt
      om ten behoeve van scholen en andere onderwijsinstellingen die uit 's Rijks kas worden bekostigd, werkzaamheden
      te verrichten ter verzekering van de goede gang van het onderwijs met uitzondering van het leiden van de school,
      het geven van onderwijs en het verrichten van werkzaamheden op het terrein van de schoolbegeleiding, bedoeld in
      [artikel 1 van de Wet op het primair onderwijs][ref3] en van de [Wet op de expertisecentra][ref4],


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0003740
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: '1'
  - number: 53b.1.c
    text: niet het maken van winst beoogt,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53b
  - number: 53b.1.d
    text: |-
      wordt gefinancierd met behulp van bijdragen van de bevoegde gezagsorganen waarvoor diensten worden verricht,
      waaronder begrepen formatierekeneenheden die zijn toegekend op basis van bekostiging voor zorgvoorzieningen,
      bedoeld in [artikel 120, vierde lid][ref1], of [artikel 132 van de Wet op het primair onderwijs][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '132'
  - number: 53b.1.e
    text: Onze minister heeft medegedeeld als rechtspersoon in de zin van dit artikel werkzaam te willen zijn,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53b
  - number: 53b.2
    text: Onder bevoegd gezag en bevoegde gezagsorganen in het eerste lid onderdeel a wordt mede verstaan de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53b
  - number: 53b.3
    text: |-
      Het bestuur van de rechtspersoon is aangesloten bij een commissie van beroep als bedoeld in [artikel 52][ref1]. De
      leden en plaatsvervangende leden van een commissie van beroep mogen niet behoren tot het bestuur of het personeel
      van de rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel52
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '52'
        hoofdstuk: III
        afdeling: I
  - number: 53b.4
    text: |-
      De in het eerste lid onder a bedoelde bevoegde gezagsorganen delen Onze minister mede dat zij het bestuur vormen
      van een rechtspersoon in de zin van dit artikel. Voorts verschaffen zij Onze minister en de door hem aangewezen
      personen desgevraagd alle inlichtingen omtrent de rechtspersoon en zijn activiteiten. De in het eerste lid
      onder a bedoelde bevoegde gezagsorganen kunnen Onze minister mededelen dat zij erin toestemmen dat de gevraagde
      inlichtingen rechtstreeks door het bestuur van de rechtspersoon zelf aan Onze minister en de door hem aangewezen
      personen worden verschaft.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53b
  - number: 53b.5
    text: |-
      De gemeente en het bevoegd gezag dat deel uitmaakt van het bestuur van de rechtspersoon, zijn verplicht op de
      naleving van de in de voorgaande leden genoemde voorschriften toe te zien.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53b
  - number: 53b.6
    text: |-
      De [artikelen 40b][ref1], [52][ref2] en [52a][ref3] zijn van overeenkomstige toepassing ten aanzien van het
      personeel van de rechtspersoon met dien verstande dat een geschillencommissie haar werkzaamheden uitstrekt over ten
      minste vijf rechtspersonen als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel40b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel52a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 40b
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '52'
        hoofdstuk: III
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 52a
        hoofdstuk: III
        afdeling: I
  - number: 53c.1
    text: |-
      De instandhouding van een of meer openbare en een of meer bijzondere scholen kan worden opgedragen of overgedragen
      aan een stichting die met dit doel wordt onderscheidenlijk is opgericht. De besluitvorming van de zijde van de
      gemeente vindt plaats door de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53c.2
    text: |-
      Het statutaire doel van de stichting is in elk geval het geven van openbaar onderwijs en onderwijs van een of meer
      richtingen in afzonderlijke scholen voor openbaar onderscheidenlijk bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53c.3
    text: |-
      De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken en
      bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53c.4
    text: |-
      Het personeel dat werkzaam is aan de openbare school en niet is tewerkgesteld zonder benoeming, wordt benoemd
      krachtens een arbeidsovereenkomst naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53c.5
    text: 'De statuten voorzien in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53c.5.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53c.5.b
    text: de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53c.5.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53c.5.d
    text: |-
      de vaststelling van de begroting en jaarrekening na overleg met de gemeenteraad van de gemeente waarin de school
      waar openbaar onderwijs wordt gegeven, gevestigd is,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53c.5.e
    text: |-
      de wijze waarop de gemeenteraad van de gemeente waarin de school waar openbaar onderwijs wordt gegeven, gevestigd
      is, toezicht op het bestuur van die school uitoefent,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53c.5.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53c.5.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53c.5.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd voor zover het openbaar onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53c.6
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de gemeenteraad van de gemeente
      waarin de school waar openbaar onderwijs wordt gegeven, gevestigd is. Instemming kan slechts worden onthouden
      indien overheersende invloed van de overheid in het bestuur niet is verzekerd voor zover het openbaar onderwijs
      betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53c.7
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad van de gemeente waarin de school waar openbaar onderwijs wordt
      gegeven, gevestigd is, verslag uit over de werkzaamheden, waarbij in ieder geval aandacht wordt geschonken aan de
      wezenskenmerken van het openbaar onderwijs. Het verslag wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53c.8
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53c.9
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover het
      openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waarin de openbare school is gelegen, de
      maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het openbaar
      onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53c
  - number: 53d.1
    text: |-
      Een rechtspersoon die een openbare school in stand houdt, en een rechtspersoon die een bijzondere school in
      stand houdt, kunnen de instandhouding van hun school overdragen aan een stichting waarvan het statutaire doel in
      ieder geval is het in stand houden van een samenwerkingsschool, onverminderd de [artikelen 42a, derde lid][ref1],
      [42b, vijfde lid][ref2], en [53c, derde lid][ref3]. Een samenwerkingsschool is een school waarin zowel openbaar
      onderwijs als bijzonder onderwijs wordt aangeboden. De [artikelen 42c][ref4] en [50][ref5] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel42a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel42b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel53c
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel42c
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel50
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 42a
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 42b
        hoofdstuk: II
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 53c
        hoofdstuk: IV
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 42c
        hoofdstuk: II
        afdeling: I
      - id: ref5
        bwb_id: BWBR0002399
        artikel: '50'
        hoofdstuk: III
        afdeling: I
  - number: 53d.2
    text: |-
      Een samenwerkingsschool kan uitsluitend tot stand komen indien daardoor de continuïteit van het openbaar of het
      bijzonder onderwijs gehandhaafd kan blijven en met totstandkoming van een samenwerkingsschool wordt voorkomen dat
      een of meer daarbij betrokken scholen door toepassing van [artikel 107][ref1] wordt opgeheven of niet meer voor
      bekostiging in aanmerking komt. Het bevoegd gezag van de betreffende school toont dat aan op basis van een prognose
      van de ontwikkeling van het aantal leerlingen waaruit blijkt dat die school binnen een termijn van zes jaar dreigt
      te worden opgeheven of niet meer te worden bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
  - number: 53d.3
    text: |-
      Een samenwerkingsschool is toegankelijk voor alle leerlingen zonder onderscheid naar godsdienst of
      levensovertuiging.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53d.4
    text: |-
      Het personeel dat werkzaam is aan de samenwerkingsschool, en niet is tewerkgesteld zonder benoeming, wordt benoemd
      krachtens arbeidsovereenkomst naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53d.5
    text: |-
      De rechtspersoon die de instandhouding van de bijzondere school heeft overgedragen, of zijn rechtsopvolger, dan
      wel een daartoe aangewezen rechtspersoon houdt toezicht op de identiteit, voor zover het betreft het bijzonder
      onderwijs in de samenwerkingsschool, overeenkomstig hetgeen is bepaald in de statuten van de stichting die de
      samenwerkingsschool in stand houdt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53d.6
    text: 'De statuten voorzien in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53d.6.a
    text: |-
      het doel van de stichting, waarin in elk geval is opgenomen het geven van openbaar onderwijs en bijzonder onderwijs
      binnen een samenwerkingsschool,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53d.6.b
    text: |-
      de samenstelling, werkwijze en inrichting van het bestuur van de stichting, met dien verstande dat in de statuten
      wordt voorzien in een evenwichtige zeggenschapsverdeling wat betreft openbaar onderwijs onderscheidenlijk bijzonder
      onderwijs dat wordt gegeven binnen de samenwerkingsschool,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53d.6.c
    text: 'de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53d.6.c.1
    text: |-
      het bestuur van de stichting die de samenwerkingsschool in stand houdt, wordt benoemd door de gemeenteraad van de
      gemeente waar de samenwerkingsschool gevestigd is, en de rechtspersoon, bedoeld in het vijfde lid, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53d.6.c.2
    text: |-
      dat het bestuur van de stichting die de samenwerkingsschool in stand houdt, niet bestaat uit personen die deel
      uitmaken van het gemeentebestuur van de gemeente en de rechtspersoon, bedoeld in het vijfde lid,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53d.6.d
    text: |-
      de wijze waarop door de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is, en de rechtspersoon,
      bedoeld in het vijfde lid, toezicht op het bestuur van de samenwerkingsschool wordt uitgeoefend, waaronder voor wat
      betreft het openbaar onderwijs in ieder geval wordt begrepen een jaarlijks door het bestuur van de stichting aan
      de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is, uit te brengen verslag waarbij in ieder
      geval aandacht wordt geschonken aan het beleid ten aanzien van het openbaar onderwijs in de samenwerkingsschool,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53d.6.e
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53d.6.f
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53d.6.g
    text: de bevoegdheid de stichting te ontbinden.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53d.7
    text: |-
      Overdracht, opheffing of samenvoeging van de samenwerkingsschool en wijziging van de statuten van de stichting die
      de samenwerkingsschool in stand houdt, is slechts mogelijk na instemming van de gemeenteraad van de gemeente waar
      de samenwerkingsschool gevestigd is, en de rechtspersoon, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53d.8
    text: |-
      De voorschriften van deze wet en van andere wetten die het voortgezet onderwijs betreffen, alsmede de daarop
      gebaseerde regelingen, voor zover die voorschriften en regelingen betrekking hebben op een bijzondere school,
      zijn van overeenkomstige toepassing op een samenwerkingsschool als bedoeld in het eerste lid, tenzij het
      tegendeel blijkt. De Algemene wet bestuursrecht is niet van toepassing voor zover het beslissingen betreft van de
      rechtspersoon die de samenwerkingsschool in stand houdt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53d.9
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover het
      openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is, de
      maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het openbaar
      onderwijs betreft. De bedoelde maatregelen kunnen tevens worden getroffen door de rechtspersoon, bedoeld in het
      vijfde lid, voor zover het bijzonder onderwijs betreft. De feitelijke samenwerking wordt beëindigd op 1 augustus
      van het jaar na een daartoe door de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is, en de
      rechtspersoon, bedoeld in het vijfde lid, gezamenlijk genomen besluit.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53d.10
    text: |-
      Een geschil tussen een bestuursorgaan van de gemeente en de rechtspersoon, bedoeld in het vijfde lid, omtrent
      het toezicht op de samenwerkingsschool en omtrent de uitlegging van de statuten van de stichting die de
      samenwerkingsschool in stand houdt, wordt voorgelegd aan een geschillencommissie, bestaande uit een of meer door
      de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is, en de rechtspersoon in onderling overleg
      aangewezen deskundigen.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53d
  - number: 53e.1
    text: |-
      In deze afdeling wordt verstaan onder: - *fusie:* een bestuurlijke of institutionele fusie,
        - *institutionele fusie:* een fusie als bedoeld in [artikel 71, tweede en derde lid][ref1], waarbij
      een school ontstaat door samenvoeging van twee of meer scholen dan wel instellingen als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref2],
        - *bestuurlijke fusie:* een fusie waarbij een of meer rechtspersonen de instandhouding van een school, een
      school als bedoeld in de [Wet op het primair onderwijs][ref3] dan wel de [Wet op de expertisecentra][ref4],
      een instelling als bedoeld in de Wet educatie en beroepsonderwijs of een instelling als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5] overdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0007625
      [ref3]: https://wetten.overheid.nl/BWBR0003420
      [ref4]: https://wetten.overheid.nl/BWBR0003549
      [ref5]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '71'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0007625
      - id: ref3
        bwb_id: BWBR0003420
      - id: ref4
        bwb_id: BWBR0003549
      - id: ref5
        bwb_id: BWBR0005682
  - number: 53e.2
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op het instellen van een openbare rechtspersoon als bedoeld
      in [artikel 42a, eerste lid, eerste volzin][ref1] of de instandhouding van een of meer openbare scholen door een
      stichting als bedoeld in [artikel 42b, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel42a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel42b
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 42a
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 42b
        hoofdstuk: II
        afdeling: I
  - number: 53f
    text: Fusies worden niet tot stand gebracht dan nadat daarvoor goedkeuring is verleend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53f
  - number: 53g.1
    text: |-
      De rechtspersoon dient dan wel de rechtspersonen gezamenlijk dienen een aanvraag in bij Onze Minister voor het
      verkrijgen van de goedkeuring, bedoeld in [artikel 53f][ref1]. De aanvraag gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53f
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53f
        hoofdstuk: V
        afdeling: I
  - number: 53g.1.a
    text: een door de rechtspersoon dan wel rechtspersonen opgestelde fusie-effectrapportage, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53g
  - number: 53g.1.b
    text: |-
      een schriftelijke verklaring van instemming met de fusie door de medezeggenschapsraden dan wel de
      gemeenschappelijke medezeggenschapsraden, dan wel
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53g
  - number: 53g.1.c
    text: |-
      de bindende uitspraak van de geschillencommissie, bedoeld in
      [artikel 32, derde lid, van de Wet medezeggenschap op scholen][ref1], dan wel de bindende uitspraak van de
      ondernemingskamer, bedoeld in [artikel 36, derde lid, van de Wet medezeggenschap op scholen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53g
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '36'
  - number: 53g.2
    text: |-
      Een aanvraag als bedoeld in het eerste lid geldt eveneens als een aanvraag om voor bekostiging in aanmerking te
      komen als bedoeld in [artikel 71][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel71
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '71'
        afdeling: I
  - number: 53g.3
    text: 'De fusie-effectrapportage bevat ten minste een weergave van:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53g
  - number: 53g.3.a
    text: de motieven voor de fusie,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53g
  - number: 53g.3.b
    text: de alternatieven voor de fusie,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53g
  - number: 53g.3.c
    text: het tijdsbestek waarbinnen de fusie zal worden gerealiseerd,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53g
  - number: 53g.3.d
    text: de te bereiken doelen,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53g
  - number: 53g.3.e
    text: |-
      de effecten van de fusie op de keuzevrijheid, in het bijzonder de effecten van de fusie op de spreiding en omvang
      van de rechtspersonen en vestigingen van scholen in de gemeenten waarin de huidige leerlingen van die scholen
      woonachtig zijn, de onderwijskundige en bestuurlijke diversiteit van het onderwijsaanbod in de betreffende
      gemeenten,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53g
  - number: 53g.3.f
    text: |-
      de financiële en personele gevolgen en de gevolgen voor leerlingen van de fusie, waaronder begrepen de gevolgen
      voor de voorzieningen,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53g
  - number: 53g.3.g
    text: de wijze waarop over de fusie wordt gecommuniceerd,
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53g
  - number: 53g.3.h
    text: de wijze waarop de fusie wordt geëvalueerd, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53g
  - number: 53g.3.i
    text: |-
      een advies van burgemeester en wethouders van de betrokken gemeenten over de wenselijkheid van de voorgestelde
      fusie.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53g
  - number: 53g.4
    text: Bij ministeriële regeling wordt een modelformulier voor de fusie-effectrapportage vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53g
  - number: 53h.1
    text: 'Onze Minister kan goedkeuring onthouden indien als gevolg van de institutionele of bestuurlijke fusie:'
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53h
  - number: 53h.1.a
    text: |-
      de daadwerkelijke variatie van het onderwijsaanbod, zowel in het opzicht van richting als van pedagogisch-
      didactische aanpak en schoolsoort binnen de gemeenten waarin de huidige leerlingen van die scholen of
      rechtspersonen woonachtig zijn, op significante wijze wordt belemmerd, of
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53h
  - number: 53h.1.b
    text: |-
      het aandeel per schoolsoort van de bij de fusie betrokken scholen in het aantal leerlingen in de gemeenten
      waarin de huidige leerlingen van die scholen woonachtig zijn een nader bij ministeriële regeling vast te stellen
      percentage overschrijdt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53h
  - number: 53h.2
    text: |-
      Onze Minister kan bovendien goedkeuring onthouden aan een institutionele fusie indien de percentages leerlingen
      betrokken bij de fusie minder zijn dan de percentages bedoeld in [artikel 71, tweede lid, onder a of b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel71
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '71'
        afdeling: I
  - number: 53h.3
    text: |-
      Onze minister verleent slechts goedkeuring aan een bestuurlijke fusie als bedoeld in [artikel 17][ref1], indien
      daardoor de continuïteit van het openbaar of het bijzonder onderwijs gehandhaafd kan blijven en met de bestuurlijke
      fusie wordt voorkomen dat een of meer daarbij betrokken scholen door toepassing van [artikel 107][ref2] wordt
      opgeheven of niet meer voor bekostiging in aanmerking komt. Het bevoegd gezag van de betreffende school toont dat
      aan op basis van een prognose van de ontwikkeling van het aantal leerlingen waaruit blijkt dat die school binnen
      een termijn van zes jaar dreigt te worden opgeheven of niet meer te worden bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '17'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
  - number: 53h.4
    text: |-
      Onze Minister laat zich ten aanzien van de goedkeuring, bedoeld in het eerste, tweede en derde lid, adviseren door
      een onafhankelijke adviescommissie, tenzij de noodzaak daartoe ontbreekt. Bij ministeriële regeling wordt bepaald
      wanneer er geen sprake is van de noodzaak bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53h
  - number: 53h.5
    text: Onze Minister stelt beleidsregels vast omtrent de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53h
  - number: 53i.1
    text: |-
      Onze Minister besluit binnen 13 weken op een aanvraag als bedoeld in [artikel 53f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53f
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53f
        hoofdstuk: V
        afdeling: I
  - number: 53i.2
    text: |-
      De termijn bedoeld in het eerste lid kan ten hoogste met 13 weken worden verlengd. Van deze verlenging wordt,
      binnen de 13 weken bedoeld in het eerste lid, mededeling gedaan aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53i
  - number: 53i.3
    text: |-
      Op het besluit bedoeld in het eerste lid is [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel53i
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '54'
    text: |-
      Het bestuur van een bijzondere school voor voortgezet onderwijs geeft binnen vier weken na de oprichting van de
      school onder overlegging van de statuten der instelling, die de school in stand houdt, en van de reglementen, van
      die oprichting kennis aan Onze minister. Indien de statuten of reglementen worden gewijzigd of ingetrokken, wordt
      eveneens binnen vier weken van de wijziging of van de intrekking van de statuten of reglementen aan Onze minister
      kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel54
  - number: '55.1'
    text: |-
      Algemeen voortgezet onderwijs wordt slechts gegeven door wie voldoet aan [artikel 33, eerste lid][ref1]. De
      artikelen 33, leden 1a tot en met vijf en veertien tot en met zestien, en [33a][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 33a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '55.2'
    text: |-
      Onderwijsondersteunende werkzaamheden als bedoeld in [artikel 36, derde lid][ref1], worden met betrekking tot het
      algemeen voortgezet onderwijs slechts verricht door wie voldoet aan [artikel 35, eerste lid][ref2]. Artikel 35,
      tweede en derde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel35
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '35'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '56.1'
    text: |-
      Onze minister kan de school, die ten aanzien van de duur van de cursus, het schoolplan en de bevoegdheden van de
      leraren overeenkomt met een school voor voorbereidend wetenschappelijk onderwijs, voor hoger algemeen voortgezet
      onderwijs, voor middelbaar algemeen voortgezet onderwijs of voor voorbereidend beroepsonderwijs, als bedoeld in
      [artikel 29, eerste lid][ref1], aanwijzen als bevoegd om aan de leerlingen op grond van het met gunstig gevolg
      afleggen van een eindexamen aan de school het diploma uit te reiken, bedoeld in het derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 56.1a
    text: |-
      [Artikel 29, leden 1a en 1b][ref1], zijn van overeenkomstige toepassing op de bevoegdheid het eindexamen af te
      nemen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '56.2'
    text: |-
      [Artikel 29, tweede en vierde lid][ref1], is op dit eindexamen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '56.3'
    text: |-
      Onze minister besluit binnen zes maanden na ontvangst van een aanvraag. Indien de beschikking niet binnen zes
      maanden kan worden gegeven, stelt Onze minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn
      waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel56
  - number: '57'
    text: |-
      De aanwijzing geschiedt op een daartoe tot Onze minister gericht verzoek van het schoolbestuur. Bij het verzoek
      worden overgelegd:
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel57
  - number: 57.a
    text: het schoolplan van de school;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel57
  - number: 57.b
    text: bewijsstukken dat wordt voldaan aan de bekwaamheidseisen;
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel57
  - number: 57.c
    text: de statuten en het reglement van de rechtspersoon met volledige rechtsbevoegdheid, die de school in stand houdt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel57
  - number: '58.1'
    text: |-
      Het schoolplan van een ingevolge [artikel 56][ref1] aangewezen school voldoet ten minste aan de voorschriften,
      gegeven bij of krachtens de [artikelen 10][ref2], [10b][ref3], [10d][ref4], [11a tot en met 11f][ref5],
      [12 tot en met 15][ref6], [22][ref7] en [24][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel12
      [ref7]: https://wetten.overheid.nl/BWBR0002399#Artikel22
      [ref8]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '56'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 11a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref6
        bwb_id: BWBR0002399
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref7
        bwb_id: BWBR0002399
        artikel: '22'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref8
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '58.2'
    text: Bij wijziging van het schoolplan doet het schoolbestuur daarvan onmiddellijk mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel58
  - number: '58.3'
    text: |-
      Onze minister kan ten behoeve van de bijzondere inrichting van het onderwijs aan de school toestaan, dat wordt
      afgeweken van het eerste lid. Onze minister besluit binnen zes maanden na ontvangst van een aanvraag. Indien de
      beschikking niet binnen zes maanden kan worden gegeven, stelt Onze minister de aanvrager daarvan in kennis en noemt
      hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel58
  - number: '58.4'
    text: De naam van de school duidt aan, met welke van de uit de openbare kas bekostigde scholen zij overeenkomt.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel58
  - number: '58.5'
    text: |-
      De voorwaarden voor de toelating tot de school zijn ten minste gelijk aan die, vastgesteld krachtens
      [artikel 27, eerste lid, alsmede de leden 1a en 1b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '58.6'
    text: |-
      [Artikel 23a1][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23a1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '58.7'
    text: |-
      Voor een school die is aangewezen op grond van [artikel 56][ref1] zijn van overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel58
    references:
      - id: ref1
