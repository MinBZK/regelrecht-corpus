    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel13
  - number: 13.1.f
    text: |-
      culturele en kunstzinnige vorming of, ter keuze van de leerling, voor zover het bevoegd gezag dat vak aanbiedt,
      klassieke culturele vorming, met dien verstande, dat het vak klassieke culturele vorming in elk geval deel uitmaakt
      van het profiel indien ook Latijnse taal en literatuur of Griekse taal en literatuur, dan wel beide, deel uitmaken
      van het profiel, en
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel13
  - number: 13.1.g
    text: lichamelijke opvoeding.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel13
  - number: '13.2'
    text: 'Het gemeenschappelijk deel van elk profiel in het gymnasium omvat:'
