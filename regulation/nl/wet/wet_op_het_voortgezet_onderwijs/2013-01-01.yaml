  - number: '15.2'
    text: |-
      De in het eerste lid bedoelde algemene maatregel van bestuur wordt aan de beide Kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel15
  - number: '16.1'
    text: |-
      Een scholengemeenschap omvat een school of inrichting in de zin van deze wet, en een of meer andere al dan niet in
      deze wet bedoelde scholen, inrichtingen of instellingen, die niet zijn instellingen voor hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel16
  - number: '16.2'
    text: |-
      Aan een school of scholengemeenschap kan, naast een hoofdvestiging als bedoeld in [artikel 65, derde lid][ref1],
      een nevenvestiging of een tijdelijke nevenvestiging zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel65
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '65'
        afdeling: I
  - number: '16.3'
    text: |-
      Een tijdelijke nevenvestiging voorziet in de tijdelijke huisvestingsbehoefte van een hoofdvestiging of
      nevenvestiging en is gelegen op een hemelsbreed gemeten afstand van minder dan drie kilometer van de desbetreffende
      hoofdvestiging of nevenvestiging.
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel16
  - number: '16.4'
    text: |-
      Een nevenvestiging komt tot stand door een samenvoeging als bedoeld in [artikel 71, tweede lid][ref1], of door
      vorming van een nieuwe nevenvestiging van een school als bedoeld in [artikel 72, derde lid, onderdeel b][ref2]. Een
      tijdelijke nevenvestiging komt tot stand op grond van [artikel 71, vijfde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel71
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '71'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '72'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '71'
        afdeling: I
  - number: '16.5'
    text: Op een nevenvestiging kan in elk geval onderwijs worden verzorgd
    url: https://wetten.overheid.nl/BWBR0002399/2013-01-01#Artikel16
  - number: 16.5.a
    text: |-
      in de eerste drie leerjaren aan een school voor voorbereidend wetenschappelijk onderwijs als bedoeld in
      [artikel 7][ref1], of aan een school voor hoger algemeen voortgezet onderwijs als bedoeld in [artikel 8][ref2], en


