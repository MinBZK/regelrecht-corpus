  - number: '2'
    text: |-
      Het voortgezet onderwijs, bedoeld in deze wet, omvat het onderwijs dat wordt gegeven na het
      basisonderwijs en na het speciaal onderwijs. Het omvat niet het voortgezet speciaal onderwijs als
      bedoeld in de [Wet op de expertisecentra][ref1], educatie en beroepsonderwijs als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref2] en het hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0007625
  - number: 2a
    text: Voortgezet onderwijs mag slechts worden gegeven door degene die daartoe ingevolge deze wet bevoegd is.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel2a
  - number: '3.1'
    text: |-
      Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn school
      met taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden
      als bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een minderjarige leerling van
      de school, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '6'
  - number: '3.2'
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van
      een redelijk vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf
      als bedoeld in het eerste lid jegens een minderjarige leerling van de school, doet het bevoegd
      gezag onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 127][ref1] juncto
      [artikel 141 van het Wetboek van Strafvordering][ref2], en stelt het bevoegd gezag de vertrouwensinspecteur daarvan
      onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van aangifte, stelt het de ouders van de
      betrokken leerling, onderscheidenlijk de betreffende ten behoeve van de school met taken belaste persoon, hiervan
      op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '3.3'
    text: |-
      Indien een personeelslid op enigerlei wijze bekend is geworden dat een ten behoeve van de school met taken belast
      persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een
      minderjarige leerling van de school, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel3
  - number: '4.1'
    text: |-
      Ten behoeve van het schoolbezoek verstrekken burgemeester en wethouders aan ouders, voogden of verzorgers van in
      de gemeente verblijvende leerlingen die wegens hun lichamelijke, verstandelijke of zintuiglijke handicap op ander
      vervoer dan openbaar vervoer zijn aangewezen, dan wel vanwege een zodanige handicap niet zelfstandig van openbaar
      vervoer gebruik kunnen maken, op aanvraag bekostiging van de door burgemeester en wethouders noodzakelijk te achten
      vervoerskosten. Indien de leerling meerderjarig en handelingsbekwaam is, wordt de bekostiging op aanvraag verstrekt
      aan de leerling. De gemeenteraad stelt daartoe een nadere regeling vast, met inachtneming van het bepaalde in de
      volgende leden.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel4
  - number: '4.2'
    text: De regeling maakt geen onderscheid tussen openbaar en bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel4
  - number: '4.3'
    text: |-
      De regeling eerbiedigt de op godsdienst of levensbeschouwing van de ouders, voogden of verzorgers, dan wel, indien
      de leerling meerderjarig en handelingsbekwaam is, van de leerling berustende keuze van een school.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel4
  - number: '4.4'
    text: |-
      De regeling voorziet erin dat het vervoer kan plaatsvinden op een wijze die voor de leerling passend is. De
      regeling bepaalt op welke wijze burgemeester en wethouders terzake advies van deskundigen inwinnen.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel4
  - number: '4.5'
    text: |-
      De regeling bepaalt dat de kosten worden vergoed van vervoer over de afstand tussen de woning van de leerling en
      de dichtstbijzijnde voor de leerling toegankelijke school, met inachtneming van de keuze van de ouders, voogden
      of verzorgers, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, van de leerling, tenzij vervoer
      met betrekking tot een verder weg gelegen school voor de gemeente minder kosten met zich zou brengen en de ouders,
      voogden of verzorgers onderscheidenlijk de leerling met het vervoer naar die school instemmen.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel4
  - number: '4.6'
    text: |-
      De regeling kan bepalen dat de gemeente, in plaats van bekostiging in geld te geven, het vervoer verzorgt of doet
      verzorgen.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel4
  - number: '4.7'
    text: |-
      De regeling kan bepalen dat burgemeester en wethouders in bijzondere gevallen de bevoegdheid hebben ten gunste van
      de ouders, voogden of verzorgers, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, ten gunste van
      de leerling van de inhoud van de regeling af te wijken.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel4
  - number: '5'
    text: 'Het voortgezet onderwijs wordt onderscheiden in:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel5
  - number: 5.a
    text: voorbereidend wetenschappelijk onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel5
  - number: 5.b
    text: hoger en middelbaar algemeen voortgezet onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel5
  - number: 5.c
    text: voorbereidend beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel5
  - number: 5.d
    text: praktijkonderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel5
  - number: 5.e
    text: andere vormen van voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel5
  - number: '6'
    text: |-
      De bepalingen van de hoofdstukken I en II van deze afdeling regelen het openbaar schoolonderwijs; de bepalingen van
      de hoofdstukken I en III zijn voorwaarden voor bekostiging van het bijzonder schoolonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel6
  - number: 6a
    text: |-
      Het onderwijs wordt gegeven en de examens worden afgenomen in het Nederlands. In afwijking van de eerste volzin kan
      een andere taal worden gebezigd:
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel6a
  - number: 6a.a
    text: wanneer het onderwijs met betrekking tot die taal betreft, of
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel6a
  - number: 6a.b
    text: |-
      indien de specifieke aard, de inrichting of de kwaliteit van het onderwijs dan wel de herkomst van de deelnemers
      daartoe noodzaakt, overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel6a
  - number: 6b
    text: |-
      Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel6b
  - number: 6c
    text: |-
      Het onderwijs wordt zodanig ingericht dat daarbij op structurele en herkenbare wijze aandacht wordt besteed aan het
      bestrijden van achterstanden in het bijzonder in de beheersing van de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel6c
  - number: '7.1'
    text: |-
      Voorbereidend wetenschappelijk onderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend
      wetenschappelijk onderwijs en dat mede algemene vorming omvat. Voorbereidend wetenschappelijk onderwijs wordt
      gegeven aan gymnasia, athenea en lycea, elk met een cursusduur van zes jaren.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel7
  - number: '7.2'
    text: |-
      Aan de gymnasia wordt in elk geval onderwijs verzorgd in Latijnse taal en letterkunde en Griekse taal en
      letterkunde.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel7
  - number: '7.3'
    text: 'Het onderwijs aan de gymnasia en athenea omvat:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel7
  - number: 7.3.a
    text: de in artikel 11a bedoelde periode van basisvorming, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel7
  - number: 7.3.b
    text: de in artikel 12 bedoelde periode van voorbereidend hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel7
  - number: '7.4'
    text: |-
      Elke school die een gymnasium en een atheneum omvat, is een lyceum. Van een lyceum is ten minste het eerste
      leerjaar gemeenschappelijk.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel7
  - number: '8.1'
    text: |-
      Hoger algemeen voortgezet onderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend hoger
      beroepsonderwijs en dat mede algemene vorming omvat. Het hoger algemeen voortgezet onderwijs wordt gegeven:
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel8
  - number: 8.1.a
    text: aan scholen met een cursusduur van vijf jaren;
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel8
  - number: 8.1.b
    text: |-
      aan afdelingen van athenea, lycea en scholen voor middelbaar algemeen voortgezet onderwijs. Deze hebben een
      cursusduur van twee jaren en vangen aan na drie jaren voorbereidend wetenschappelijk onderwijs of na vier jaren
      middelbaar algemeen voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel8
  - number: '8.2'
    text: 'Het onderwijs aan deze scholen en afdelingen omvat:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel8
  - number: 8.2.a
    text: de in artikel 11a bedoelde periode van basisvorming, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel8
  - number: 8.2.b
    text: de in artikel 12 bedoelde periode van voorbereidend hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel8
  - number: '9'
    text: |-
      Middelbaar algemeen voortgezet onderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend
      beroepsonderwijs dan wel op hoger algemeen voortgezet onderwijs, en dat mede algemene vorming omvat. Het middelbaar
      algemeen voortgezet onderwijs wordt gegeven aan scholen met een cursusduur van vier jaren.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel9
  - number: '10.1'
    text: Aan scholen voor middelbaar algemeen voortgezet onderwijs wordt onderwijs in de theoretische leerweg gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: '10.2'
    text: 'De theoretische leerweg omvat een samenhangend onderwijsprogramma, gericht op:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.2.a
    text: een algemene maatschappelijke voorbereiding en persoonlijke vorming,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.2.b
    text: een voorbereiding op naar inhoud verwante opleidingen in het aansluitend beroepsonderwijs, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.2.c
    text: een voorbereiding op het hoger algemeen voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: '10.3'
    text: |-
      Het onderwijs in de theoretische leerweg kan met ingang van het derde leerjaar worden gegeven, en wordt uiterlijk
      met ingang van het vierde leerjaar gegeven in de volgende sectoren:
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.3.a
    text: techniek,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.3.b
    text: zorg en welzijn,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.3.c
    text: economie, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.3.d
    text: landbouw.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: '10.4'
    text: 'Het onderwijs in de theoretische leerweg bestaat voor elke sector uit:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.4.a
    text: een gemeenschappelijk deel, dat voor alle sectoren gelijk is,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.4.b
    text: een sectordeel, dat kenmerkend is voor die sector, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.4.c
    text: een vrij deel, dat bestaat uit door de leerling te kiezen vakken en andere programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: '10.5'
    text: |-
      Het gemeenschappelijk deel van de theoretische leerweg omvat Nederlandse taal, Engelse taal, maatschappijleer,
      lichamelijke opvoeding en ten minste één van de vakken behorende tot de beeldende vorming, muziek, dans of drama.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: '10.6'
    text: 'Het sectordeel van de theoretische leerweg omvat wat betreft:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.6.a
    text: 'de sector techniek: wiskunde en natuur- en scheikunde I,'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.6.b
    text: |-
      de sector zorg en welzijn: biologie en, ter keuze van de leerling, wiskunde, maatschappijleer II, geschiedenis en
      staatsinrichting, of aardrijkskunde, met dien verstande dat het bevoegd gezag beslist welke van de laatste drie
      vakken wordt of worden aangeboden,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.6.c
    text: 'de sector economie: economie en, ter keuze van de leerling, wiskunde, Franse taal of Duitse taal,'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.6.d
    text: 'de sector landbouw: wiskunde en, ter keuze van de leerling, biologie of natuur- en scheikunde I.'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: '10.7'
    text: 'Het vrije deel van de theoretische leerweg:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.7.a
    text: omvat door de leerling te kiezen vakken, genoemd in het zesde lid,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.7.b
    text: |-
      kan omvatten natuur- en scheikunde II, Spaanse taal, Turkse taal, Arabische taal, vakken behorende tot de beeldende
      vorming, muziek, dans, drama, door de leerling te kiezen, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10.7.c
    text: kan omvatten door het bevoegd gezag vast te stellen vakken en programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: '10.8'
    text: |-
      Het bevoegd gezag beslist welke keuzetaal, genoemd in het zesde lid, onderdeel c, en welke vakken, genoemd in het
      zevende lid, onderdeel b, worden aangeboden. Het bevoegd gezag kan tevens beslissen dat door het bevoegd gezag aan
      te wijzen vakken en andere programma-onderdelen, bedoeld in het zevende lid, onderdeel c, door alle leerlingen in
      het vrije deel moeten worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: '10.9'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de mogelijkheid vrijstelling te
      verlenen van onderdelen van dit artikel ten behoeve van leerlingen met bijzondere kenmerken. Onverminderd het zesde
      en zevende lid, kan bij algemene maatregel van bestuur worden vastgesteld het door alle leerlingen in het derde
      leerjaar te volgen minimum aantal vakken waarin eindexamen kan worden afgelegd, alsmede welke vakken het betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: '10.10'
    text: |-
      De in het negende lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10
  - number: 10a
    text: |-
      Voorbereidend beroepsonderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend beroepsonderwijs,
      bedoeld in [artikel 7.2.2, eerste lid, onderdelen b, c en d, van de Wet educatie en beroepsonderwijs][ref1] en dat
      mede algemene vorming omvat. Het voorbereidend beroepsonderwijs wordt gegeven aan scholen met een cursusduur van
      vier jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 10b.1
    text: |-
      Aan scholen voor voorbereidend beroepsonderwijs wordt, in elke afdeling als bedoeld in [artikel 10c][ref1],
      onderwijs in de basisberoepsgerichte leerweg en de kaderberoepsgerichte leerweg gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b.2
    text: 'De beroepsgerichte leerwegen omvatten een samenhangend onderwijsprogramma, gericht op:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.2.a
    text: een algemene maatschappelijke voorbereiding en persoonlijke vorming, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.2.b
    text: een voorbereiding op naar inhoud verwante opleidingen in het aansluitend beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.3
    text: |-
      Het onderwijs in de beroepsgerichte leerwegen kan met ingang van het derde leerjaar worden gegeven, en wordt
      uiterlijk met ingang van het vierde leerjaar gegeven in een of meer van de volgende sectoren:
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.3.a
    text: techniek,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.3.b
    text: zorg en welzijn,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.3.c
    text: economie, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.3.d
    text: landbouw.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.4
    text: 'Het onderwijs in de beroepsgerichte leerwegen bestaat voor elke sector uit:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.4.a
    text: een gemeenschappelijk deel, dat voor alle sectoren gelijk is,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.4.b
    text: een sectordeel, dat kenmerkend is voor die sector, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.4.c
    text: |-
      een vrij deel, dat bestaat uit door de leerling te kiezen afdelingsvakken, dan wel intrasectoraal te kiezen
      programma-onderdelen van een of meer afdelingen binnen de desbetreffende sector, mogelijkerwijs aangevuld met
      andere te kiezen programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.5
    text: |-
      Het gemeenschappelijk deel van de beroepsgerichte leerwegen omvat Nederlandse taal, Engelse taal, maatschappijleer,
      lichamelijke opvoeding en ten minste één van de vakken behorende tot de beeldende vorming, muziek, dans of drama.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.6
    text: 'Het sectordeel van de basisberoepsgerichte leerweg omvat wat betreft:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.6.a
    text: 'de sector techniek: wiskunde en natuur- en scheikunde I,'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.6.b
    text: |-
      de sector zorg en welzijn: biologie en, ter keuze van de leerling, wiskunde, maatschappijleer II, geschiedenis en
      staatsinrichting, of aardrijkskunde, met dien verstande dat het bevoegd gezag beslist welke van de laatste drie
      vakken wordt of worden aangeboden,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.6.c
    text: 'de sector economie: economie en, ter keuze van de leerling, wiskunde, Franse taal of Duitse taal,'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.6.d
    text: 'de sector landbouw: wiskunde en, ter keuze van de leerling, biologie of natuur- en scheikunde I.'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.7
    text: 'Het vrije deel van de beroepsgerichte leerwegen:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.7.a
    text: |-
      omvat door de leerling te kiezen bij de sector behorende afdelingsvakken of intrasectoraal te kiezen programma-
      onderdelen,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.7.b
    text: kan omvatten door het bevoegd gezag vast te stellen vakken en programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.8
    text: |-
      Het bevoegd gezag beslist welke keuzetaal, genoemd in het zesde lid, onderdeel c, en welke vakken, genoemd in het
      zevende lid, onderdeel a, worden aangeboden. Het bevoegd gezag kan tevens beslissen dat door het bevoegd gezag aan
      te wijzen vakken en andere programma-onderdelen, bedoeld in het zevende lid, onderdeel b, door alle leerlingen in
      het vrije deel moeten worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.9
    text: 'Bij algemene maatregel van bestuur worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.9.a
    text: de afdelingsvakken en intrasectoraal te kiezen programma-onderdelen, bedoeld in het zevende lid, onderdeel a,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.9.b
    text: |-
      voorschriften met betrekking tot intrasectoraal te kiezen programma-onderdelen, met inbegrip van voorschriften
      waarin de voorwaarden zijn opgenomen waaronder kan worden afgeweken van het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.9.c
    text: |-
      voorschriften omtrent de mogelijkheid vrijstelling te verlenen van onderdelen van dit artikel ten behoeve van
      leerlingen met bijzondere kenmerken.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b.10
    text: |-
      De in het negende lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b
  - number: 10b1.1
    text: |-
      Het bevoegd gezag kan de basisberoepsgerichte leerweg mede inrichten als leer-werktraject. Een leer-
      werktraject is een leerroute binnen de basisberoepsgerichte leerweg met een buitenschools praktijkgedeelte
      dat ten minste 640 klokuren, verzorgd in 80 dagen, en ten hoogste 1280 klokuren, verzorgd in 160 dagen,
      omvat van de gezamenlijke onderwijstijd van het derde en vierde leerjaar en welk traject specifiek is
      gericht op het behalen van een startkwalificatie op het niveau van de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onder b, van de Wet educatie en beroepsonderwijs][ref1]. Elke schoolweek in het derde
      en vierde leerjaar omvat ten minste binnenschools onderricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 10b1.2
    text: 'Een leer-werktraject omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b1
  - number: 10b1.2.a
    text: Nederlandse taal, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b1
  - number: 10b1.2.b
    text: een beroepsgericht programma.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b1
  - number: 10b1.3
    text: |-
      Het bevoegd gezag kan, na overleg met de leerling of diens wettelijk vertegenwoordiger, beslissen dat het leer-
      werktraject voor die leerling eveneens een of meer andere vakken van de basisberoepsgerichte leerweg omvat.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b1
  - number: 10b2
    text: 'Het bevoegd gezag stelt bij de inrichting van het leer-werktraject in elk geval vast:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b2
  - number: 10b2.a
    text: |-
      de organisatie van de leerlingbegeleiding vanwege het bevoegd gezag zowel binnen de school als bij het bedrijf dat
      of de organisatie die het buitenschoolse praktijkgedeelte verzorgt, alsmede
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b2
  - number: 10b2.b
    text: |-
      de invulling van het buitenschoolse praktijkgedeelte en waarborgt daarbij dat niet uitsluitend eenzijdige
      productiearbeid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b2
  - number: 10b3.1
    text: |-
      Het buitenschoolse praktijkgedeelte wordt verzorgd door een bedrijf of organisatie, op grondslag van een leer-
      werkovereenkomst, gesloten door het bevoegd gezag, de betrokken leerling of diens wettelijk vertegenwoordiger, dat
      bedrijf of die organisatie, en het bestuur van het desbetreffende kenniscentrum beroepsonderwijs bedrijfsleven,
      geregeld in de [Wet educatie en beroepsonderwijs][ref1], dat daarmee verklaart:


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b3
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 10b3.1.a
    text: |-
      dat het een bedrijf of organisatie betreft dat respectievelijk die voldoet aan de kwaliteitscriteria, genoemd in
      [artikel 10b6][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b6
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b3
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b6
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b3.1.b
    text: voor zover van toepassing, dat de gronden voor dat kwaliteitsoordeel nog steeds aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b3
  - number: 10b3.2
    text: 'De leer-werkovereenkomst regelt de rechten en plichten van partijen en omvat ten minste bepalingen over:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b3
  - number: 10b3.2.a
    text: inhoud, leerdoelen, duur, periode van en beoordelingsmaatstaven voor het buitenschoolse praktijkgedeelte,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b3
  - number: 10b3.2.b
    text: de begeleiding van de leerling, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b3
  - number: 10b3.2.c
    text: de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden ontbonden.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b3
  - number: 10b3.3
    text: |-
      In afwijking van [artikel 7:610, tweede lid tweede volzin, van het Burgerlijk Wetboek][ref1], is in geval van
      strijd als bedoeld in die volzin, [artikel 10b3][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b3
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b3
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b4.1
    text: |-
      Het bedrijf dat of de organisatie die het buitenschoolse gedeelte verzorgt, draagt zorg voor de begeleiding van de
      leerlingen binnen het bedrijf respectievelijk de organisatie.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b4
  - number: 10b4.2
    text: |-
      De kenniscentra beroepsonderwijs bedrijfsleven dragen zorg voor een regelmatige beoordeling van bedrijven en
      organisaties die het buitenschoolse praktijkgedeelte verzorgen, aan de hand van de eisen in [artikel 10b6][ref1].
      De kenniscentra beroepsonderwijs bedrijfsleven dragen gezamenlijk zorg voor openbaarmaking van een overzicht van
      bedrijven en organisaties met een gunstige beoordeling op grond van de eerste volzin. Tot het verzorgen van het
      buitenschoolse praktijkgedeelte zijn uitsluitend bevoegd de bedrijven en organisaties met een gunstige beoordeling
      op grond van die volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b6
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b4
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b6
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b4.3
    text: |-
      Indien het bevoegd gezag na het sluiten van de leer-werkovereenkomst vaststelt dat de praktijkplaats niet of niet
      volledig beschikbaar is, de begeleiding tekortschiet of ontbreekt, of sprake is van andere omstandigheden die maken
      dat het buitenschoolse praktijkgedeelte niet naar behoren zal kunnen worden verzorgd, bevordert het bevoegd gezag,
      na overleg met het bestuur van het desbetreffende kenniscentrum beroepsonderwijs bedrijfsleven, dat een toereikende
      vervangende voorziening beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b4
  - number: 10b5.1
    text: |-
      De kenniscentra beroepsonderwijs bedrijfsleven hebben ten behoeve van hun in [artikel 10b4][ref1] geregelde taken
      aanspraak op bekostiging uit 's Rijks kas.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b4
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b5
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b4
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b5.2
    text: |-
      De rijksbijdrage waarop de in het eerste lid bedoelde aanspraak betrekking heeft, wordt, binnen het raam van de
      door de begrotingswetgever beschikbaar gestelde middelen, per kenniscentrum beroepsonderwijs bedrijfsleven berekend
      aan de hand van maatstaven, neergelegd in een berekeningswijze die is vastgesteld bij of krachtens algemene
      maatregel van bestuur. De maatstaven hebben in elk geval betrekking op het aantal leer-werkovereenkomsten waarbij
      het kenniscentrum beroepsonderwijs bedrijfsleven partij is.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b5
  - number: 10b5.3
    text: |-
      De [artikelen 2.4.1][ref1], [2.4.2][ref2], [2.5.2 tot en met 2.5.9][ref3] en
      [11.1 van de Wet educatie en beroepsonderwijs][ref4] zijn van overeenkomstige toepassing op kenniscentra
      beroepsonderwijs bedrijfsleven die taken uitvoeren als bedoeld in [artikel 10b4][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel10b4
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '11'
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 10b4
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b6.1
    text: |-
      Tot het verzorgen van het buitenschoolse praktijkgedeelte zijn uitsluitend bevoegd bedrijven en organisaties ten
      aanzien waarvan wordt voldaan aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b6
  - number: 10b6.1.a
    text: |-
      op de leer-werkplek of combinatie van leer-werkplekken kunnen de door het bevoegd gezag vastgestelde
      praktijkopdrachten daadwerkelijk worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b6
  - number: 10b6.1.b
    text: elke praktijkopdracht als zodanig kan in één bedrijf of organisatie worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b6
  - number: 10b6.1.c
    text: |-
      in het bedrijf of de organisatie is een gekwalificeerde praktijkbegeleider of leermeester aanwezig, die in staat is
      om kennis, inzicht en vaardigheden van de leerling te beoordelen, alsmede vorderingen daarin, en de leerling zowel
      werkinhoudelijk als pedagogisch-didactisch te begeleiden;
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b6
  - number: 10b6.1.d
    text: |-
      het bedrijf of de organisatie is bereid met de in het tweede lid bedoelde mentor of docentbegeleider contact te
      onderhouden;
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b6
  - number: 10b6.1.e
    text: |-
      de mogelijkheid om binnen hetzelfde bedrijf of dezelfde organisatie, dezelfde moederorganisatie of dezelfde
      branche de leerdoelen van het voorbereidend middelbaar beroepsonderwijs en de eindtermen van de assistenopleiding
      of basisberoepsopleiding, bedoeld in de [Wet educatie en beroepsonderwijs][ref1] te behalen, zonder grote
      overgangsdrempels voor de leerling;


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b6
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 10b6.1.f
    text: |-
      het bedrijf of de organisatie waarborgt dat een gekwalificeerde praktijkbegeleider of leermeester is gekoppeld
      aan een leerling, en dat deze leermeester ervoor zorgt dat de leerling voldoende hulp en tijd krijgt om de
      praktijkopdrachten uit te voeren;
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b6
  - number: 10b6.1.g
    text: |-
      het productie- of dienstverleningsproces is technisch en organisatorisch voldoende gevarieerd en kan leerlingen
      goed praktijkmateriaal bieden en hen gedegen opleiden;
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b6
  - number: 10b6.1.h
    text: de leer-werkplek past binnen de dagelijkse bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b6
  - number: 10b6.1.i
    text: |-
      het bedrijf of de organisatie is bereid de leerling de vereiste praktijkopdrachten uit te laten voeren en het werk
      en het stageverslag te bespreken en te beoordelen;
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b6
  - number: 10b6.1.j
    text: |-
      het bedrijf of de organisatie is geschikt voor de betrokken leeftijdsgroep waar het gaat om onder meer ruimte om te
      leren of fouten te maken, erkenning van jong zijn;
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b6
  - number: 10b6.1.k
    text: |-
      het bedrijf of de organisatie respecteert, voor zover van toepassing, het multiculturele karakter van de
      leerlingenpopulatie.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b6
  - number: 10b6.2
    text: |-
      Het bevoegd gezag draagt zorg voor beschikbaarheid van een gekwalificeerde mentor of docentbegeleider die de
      voortgang op de leer-werkplek alsmede de integratie tussen het binnenschools en buitenschools programma bewaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b6
  - number: 10b7.1
    text: |-
      Leer-werktrajecten worden verzorgd op grondslag van een samenwerkingsovereenkomst tussen het
      bevoegd gezag van de school en het bevoegd gezag van een regionaal opleidingencentrum, een regionaal
      opleidingencentrum in een samenwerkingsverband of een agrarisch opleidingscentrum als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref1] voor zover aan die instelling een basisberoepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder b, van de Wet educatie en beroepsonderwijs][ref2] wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b7
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 10b7.2
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in het eerste lid voorziet in elk geval in de
      inrichting van een doorlopende leerweg tot en met de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onder b, van de Wet educatie en beroepsonderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10b7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 10c
    text: 'De sectoren, genoemd in artikel 10b, derde lid, omvatten elk een of meer afdelingen, onderscheiden als volgt:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.a
    text: 'de sector techniek:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.a.1
    text: bouwtechniek,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.a.2
    text: metaaltechniek,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.a.3
    text: elektrotechniek,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.a.4
    text: voertuigentechniek,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.a.5
    text: installatietechniek,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.a.6
    text: grafische techniek,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.a.7
    text: transport en logistiek,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.a.8
    text: afdelingen, aangewezen ingevolge artikel 24, vijfde lid,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.b
    text: 'de sector zorg en welzijn:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.b.1
    text: verzorging,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.b.2
    text: uiterlijke verzorging,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.c
    text: 'de sector economie:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.c.1
    text: administratie,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.c.2
    text: handel en verkoop,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.c.3
    text: mode en commercie,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.c.4
    text: consumptief,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10c.d
    text: 'de sector landbouw: landbouw en natuurlijke omgeving.'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10c
  - number: 10d.1
    text: |-
      Aan een scholengemeenschap waarvan ten minste een school voor middelbaar algemeen voortgezet onderwijs en een
      school voor voorbereidend beroepsonderwijs deel uitmaken, kan, naast het onderwijs in de leerwegen, genoemd in
      de [artikelen 10][ref1] en [10b][ref2], onderwijs in de gemengde leerweg worden gegeven. In afwijking van de
      eerste volzin kan Onze Minister van Onderwijs, Cultuur en Wetenschap onder door hem te stellen voorwaarden, op
      aanvraag van het bevoegd gezag van een school voor middelbaar algemeen voortgezet onderwijs of van een school
      voor voorbereidend beroepsonderwijs, toestaan dat aan die school onderwijs in de gemengde leerweg wordt gegeven.
      In afwijking van de eerste volzin, kan Onze Minister van Landbouw, Natuur en Voedselkwaliteit onder door hem
      te stellen voorwaarden, op aanvraag van het bevoegd gezag van een agrarisch opleidingscentrum als bedoeld in
      [artikel 1.3.3 van de Wet educatie en beroepsonderwijs][ref3], ten behoeve van het daarin verzorgde voorbereidend
      beroepsonderwijs en in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschap, toestaan dat
      onderwijs in de gemengde leerweg wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 10d.2
    text: 'De gemengde leerweg omvat een samenhangend onderwijsprogramma, gericht op:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.2.a
    text: een algemene maatschappelijke voorbereiding en persoonlijke vorming, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.2.b
    text: een voorbereiding op naar inhoud verwante opleidingen in het aansluitend beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.3
    text: |-
      Het onderwijs in de gemengde leerweg kan met ingang van het derde leerjaar worden gegeven, en wordt uiterlijk met
      ingang van het vierde leerjaar gegeven in een of meer van de volgende sectoren:
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.3.a
    text: techniek,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.3.b
    text: zorg en welzijn,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.3.c
    text: economie, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.3.d
    text: landbouw.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.4
    text: 'Het onderwijs in de gemengde leerweg bestaat voor elke sector uit:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.4.a
    text: een gemeenschappelijk deel, dat voor alle sectoren gelijk is,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.4.b
    text: een sectordeel, dat kenmerkend is voor die sector, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.4.c
    text: |-
      een vrij deel, dat bestaat uit een door de leerling te kiezen afdelingsvak, dan wel intrasectoraal te kiezen andere
      programma-onderdelen van een of meer afdelingen binnen de desbetreffende sector, mogelijkerwijs aangevuld met
      andere te kiezen programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.5
    text: |-
      Het gemeenschappelijk deel van de gemengde leerweg omvat Nederlandse taal, Engelse taal, maatschappijleer,
      lichamelijke opvoeding en ten minste één van de vakken behorende tot de beeldende vorming, muziek, dans of drama.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.6
    text: 'Het sectordeel van de gemengde leerweg omvat wat betreft:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.6.a
    text: 'de sector techniek: wiskunde en natuur- en scheikunde I,'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.6.b
    text: |-
      de sector zorg en welzijn: biologie en, ter keuze van de leerling, wiskunde, maatschappijleer II, geschiedenis en
      staatsinrichting, of aardrijkskunde, met dien verstande dat het bevoegd gezag beslist welke van de laatste drie
      vakken wordt of worden aangeboden,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.6.c
    text: 'de sector economie: economie en, ter keuze van de leerling, wiskunde, Franse taal of Duitse taal,'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.6.d
    text: 'de sector landbouw: wiskunde en, ter keuze van de leerling, biologie of natuur- en scheikunde I.'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.7
    text: 'Het vrije deel van de gemengde leerweg:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.7.a
    text: omvat door de leerling te kiezen vakken, genoemd in het zesde lid,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.7.b
    text: |-
      omvat door de leerling te kiezen bij de sector behorende afdelingsvakken of intrasectoraal te kiezen programma-
      onderdelen,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.7.c
    text: |-
      kan omvatten natuur- en scheikunde II, Spaanse taal, Turkse taal, Arabische taal, vakken behorende tot de beeldende
      vorming, muziek, dans, drama, door de leerling te kiezen, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.7.d
    text: kan omvatten door het bevoegd gezag vast te stellen vakken en programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.8
    text: |-
      Het bevoegd gezag beslist welke keuzetaal, genoemd in het zesde lid, onderdeel c, en welke vakken, genoemd in het
      zevende lid, onderdelen b en c, worden aangeboden. Het bevoegd gezag kan tevens beslissen dat door het bevoegd
      gezag aan te wijzen vakken en andere programma-onderdelen, bedoeld in het zevende lid, onderdeel d, door alle
      leerlingen in het vrije deel moeten worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.9
    text: 'Bij algemene maatregel van bestuur worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.9.a
    text: de afdelingsvakken en intrasectoraal te kiezen programma-onderdelen, bedoeld in het zevende lid, onderdeel b,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.9.b
    text: voorschriften met betrekking tot intrasectoraal te kiezen programma-onderdelen, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.9.c
    text: |-
      voorschriften omtrent de mogelijkheid vrijstelling te verlenen van onderdelen van dit artikel ten behoeve van
      leerlingen met bijzondere kenmerken.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10d.10
    text: |-
      De in het negende lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10d
  - number: 10e.1
    text: |-
      Leerwegondersteunend onderwijs wordt verzorgd ter voorbereiding op of gedurende het volgen van onderwijs in een van
      de leerwegen, genoemd in de [artikelen 10][ref1], [10b][ref2] en [10d][ref3], ten behoeve van de leerling voor wie
      vaststaat dat een orthopedagogische en orthodidactische benadering is geboden met het oog op het afsluiten van het
      onderwijs in een van deze leerwegen. Leerwegondersteunend onderwijs wordt zodanig in het onderwijs geïntegreerd en
      ingericht dat de leerling een ononderbroken ontwikkelingsproces, gericht op het afsluiten als bedoeld in de eerste
      volzin, kan volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10e.2
    text: |-
      Leerwegondersteunend onderwijs wordt verzorgd, indien de leerling met behulp van de voorzieningen, bedoeld in
      [artikel 24, tweede lid, tweede volzin][ref1], niet een ononderbroken ontwikkelingsproces als bedoeld in het eerste
      lid, kan volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10e.3
    text: |-
      Het bevoegd gezag beslist na overleg met de ouders van de leerling of aan de leerling leerwegondersteunend
      onderwijs wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10e
  - number: 10e.4
    text: |-
      De in [artikel 10g][ref1] bedoelde regionale verwijzingscommissie beslist op aanvraag van het bevoegd gezag
      of de leerling op leerwegondersteunend onderwijs is aangewezen. Het bevoegd gezag voegt bij de aanvraag
      na overleg met de ouders een op de desbetreffende leerling betrekking hebbend onderwijskundig rapport.
      [Artikel 10g, derde en vierde lid, zevende lid, eerste volzin, en achtste tot en met elfde lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10g
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10g
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10g
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10g
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10e.5
    text: |-
      In afwijking van [artikel 10g, zevende lid, eerste volzin][ref1], kan de regionale verwijzingscommissie tegelijk
      met de beslissing dat een leerling niet is aangewezen op leerwegondersteunend onderwijs, beslissen dat die leerling
      toelaatbaar is tot het praktijkonderwijs. Alvorens daartoe te beslissen, hoort de regionale verwijzingscommissie de
      ouders van de leerling en het bevoegd gezag van de betrokken school of afdeling voor praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10g
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10g
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10e.6
    text: |-
      [Artikel 10g, zesde lid][ref1], is van overeenkomstige toepassing op de leerling die op basis van een beschikking
      van de regionale verwijzingscommissie is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10g
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10g
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10f.1
    text: |-
      Praktijkonderwijs wordt gegeven aan scholen voor praktijkonderwijs, alsmede aan afdelingen voor praktijkonderwijs,
      verbonden aan scholen voor voorbereidend beroepsonderwijs en aan scholengemeenschappen waarvan ten minste een
      school voor voorbereidend beroepsonderwijs deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10f
  - number: 10f.2
    text: Praktijkonderwijs is onderwijs voor leerlingen voor wie vaststaat dat
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10f
  - number: 10f.2.a
    text: overwegend een orthopedagogische en orthodidactische benadering is geboden, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10f
  - number: 10f.2.b
    text: |-
      het volgen van het onderwijs in een van de leerwegen, genoemd in de [artikelen 10][ref1], [10b][ref2]
      en [10d][ref3], al dan niet in combinatie met het volgen van leerwegondersteunend onderwijs, bedoeld in
      [artikel 10e][ref4], niet leidt tot het behalen van een diploma of een getuigschrift voorbereidend middelbaar
      beroepsonderwijs als bedoeld in [artikel 29][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10e
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 10e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 10f.3
    text: |-
      Praktijkonderwijs bestaat uit een gedeelte waarin aangepast theoretisch onderwijs, persoonlijkheidsvorming en
      het aanleren van sociale vaardigheden worden verzorgd, en een gedeelte waarin de leerling wordt voorbereid op
      het uitoefenen van functies op de arbeidsmarkt. Praktijkonderwijs wordt zodanig ingericht dat de kerndoelen van
      de basisvorming zo veel mogelijk kunnen worden bereikt. Praktijkonderwijs bereidt de leerling voor op functies
      binnen de regionale arbeidsmarkt op een niveau dat ligt onder het niveau van de assistentopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10f
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 10f.3a
    text: |-
      In afwijking van [artikel 11c, eerste lid][ref1], wordt het praktijkonderwijs zodanig ingericht dat de leerlingen
      per schooljaar ten minste 1000 klokuren praktijkonderwijs ontvangen. De leerlingen ontvangen per dag ten hoogste
      5,5 klokuren praktijkonderwijs, voor zover het betreft aangepast theoretisch onderwijs, persoonlijkheidsvorming en
      het aanleren van sociale vaardigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11c
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10f.4
    text: |-
      Het bevoegd gezag van een school voor praktijkonderwijs of van een school met een afdeling voor praktijkonderwijs
      kan, met inachtneming van de tweede volzin van het derde lid en van lid 3a, indien dat ten behoeve van de leerling
      noodzakelijk is, bij het aanbieden van dat onderwijs afwijken van de voorschriften, gegeven bij of krachtens de
      [artikelen 11a tot en met 11c][ref1], [22][ref2] en [29][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '22'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 10f.5
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld met betrekking tot de vakken die het
      praktijkonderwijs omvat, alsmede met betrekking tot het aantal uren dat het onderricht in de praktijk van de
      uitoefening van een vak of beroep gedurende een schoolweek ten hoogste omvat.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10f
  - number: 10f.6
    text: |-
      De in het vijfde lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10f
  - number: 10g.1
    text: |-
      Aan de ouders van een leerling van wie het bevoegd gezag van de school waar de leerling zich aanmeldt dan wel van
      de school waaraan de leerling is ingeschreven, redelijkerwijs kan aannemen dat deze niet in staat is het onderwijs
      in een van de leerwegen, genoemd in de [artikelen 10][ref1], [10b][ref2] en [10d][ref3], al dan niet in combinatie
      met leerwegondersteunend onderwijs, bedoeld in [artikel 10e][ref4], met een diploma of getuigschrift voorbereidend
      middelbaar beroepsonderwijs als bedoeld in [artikel 29, derde lid][ref5], af te sluiten, kan het bevoegd gezag
      voorstellen deze leerling in plaats daarvan praktijkonderwijs te doen volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10e
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 10e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 10g.2
    text: |-
      Het bevoegd gezag van de school of afdeling voor praktijkonderwijs beslist, in overeenstemming met de andere
      bevoegde gezagsorganen in het in [artikel 10h][ref1] bedoelde samenwerkingsverband en na overleg met de ouders van
      de in het eerste lid bedoelde leerling, over de toelating van de leerling tot het praktijkonderwijs. Het bevoegd
      gezag kan een leerling toelaten tot het praktijkonderwijs mits voor 1 oktober van het desbetreffende schooljaar een
      aanvraag bij een door Onze minister erkende regionale verwijzingscommissie is ingediend om vast te stellen of de
      leerling toelaatbaar is tot het praktijkonderwijs. De aanvraag gaat vergezeld van een op de desbetreffende leerling
      betrekking hebbend onderwijskundig rapport en de op schrift gestelde zienswijze van de ouders. Indien de regionale
      verwijzingscommissie heeft bepaald dat de leerling toelaatbaar is tot het praktijkonderwijs, kan de desbetreffende
      leerling de toelating tot een school of afdeling voor praktijkonderwijs binnen het samenwerkingsverband niet worden
      geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10h
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10h
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10g.3
    text: |-
      Een aanvraag bij een regionale verwijzingscommissie als bedoeld in het tweede lid kan worden ingediend voor een
      leerling die:
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10g
  - number: 10g.3.a
    text: |-
      rechtstreeks afkomstig is van een school of instelling als bedoeld in de [Wet op het primair onderwijs][ref1] of de
      [Wet op de expertisecentra][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: 10g.3.b
    text: rechtstreeks afkomstig is van het eerste leerjaar van een school voor voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10g
  - number: 10g.4
    text: |-
      In afwijking van het derde lid kan een aanvraag slechts worden ingediend na dat schooljaar, indien het een
      vreemdeling betreft als bedoeld in [artikel 27, lid 1a, onderdeel b of c][ref1], die op 1 oktober van het
      schooljaar waarin hij voor het eerst wordt meegeteld als leerling in het voortgezet onderwijs korter dan een jaar
      in Nederland is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10g.5
    text: |-
      In afwijking van het derde lid kan tevens een aanvraag tot indicatiestelling voor praktijkonderwijs bij een
      regionale verwijzingscommissie als bedoeld in het tweede lid worden ingediend door het bevoegd gezag van een school
      voor praktijkonderwijs of van een school met een afdeling voor praktijkonderwijs voor een leerling die voldoet
      aan bij of krachtens algemene maatregel van bestuur te stellen criteria, indien naar het oordeel van het bevoegd
      gezag het zorg- en onderwijsaanbod van het praktijkonderwijs het beste aansluit bij de behoeften van deze leerling.
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven voor de procedure voor indiening van
      aanvragen.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10g
  - number: 10g.6
    text: |-
      Het bevoegd gezag van de school of afdeling voor praktijkonderwijs waaraan de leerling wordt toegelaten,
      stelt, na overleg met de ouders, voor de leerling een handelingsplan op. Het handelingsplan bevat een
      omschrijving van de wijze waarop voor de desbetreffende leerling het praktijkonderwijs met inachtneming van
      [artikel 10f, derde lid][ref1], wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10g.7
    text: |-
      Indien de regionale verwijzingscommissie bepaalt dat de leerling niet tot het praktijkonderwijs toelaatbaar is,
      brengt zij advies uit aan het in het eerste lid bedoelde bevoegd gezag, over de wijze waarop de leerling op de
      school waar hij is ingeschreven, naar het oordeel van de verwijzingscommissie zou moeten worden begeleid. In
      afwijking van de eerste volzin kan de regionale verwijzingscommissie tegelijk met de beslissing dat een leerling
      niet toelaatbaar is tot het praktijkonderwijs, beslissen dat die leerling is aangewezen op leerwegondersteunend
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10g
  - number: 10g.8
    text: |-
      Een beschikking van een regionale verwijzingscommissie omtrent de toelaatbaarheid van een leerling is geen besluit
      als bedoeld in [artikel 8:4, onderdeel e, van de Algemene wet bestuursrecht][ref1]. De ouders van de desbetreffende
      leerling kunnen een beschikking van de regionale verwijzingscommissie voorleggen aan een andere regionale
      verwijzingscommissie met het verzoek daarover een deskundigheidsadvies uit te brengen. Indien toepassing wordt
      gegeven aan de tweede volzin, worden de termijnen van bezwaar en beroep opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 10g.9
    text: |-
      De regionale verwijzingscommissie verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak
      benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor
      de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10g
  - number: 10g.10
    text: |-
      Een regionale verwijzingscommissie die door Onze Minister is erkend, wordt verbonden aan een regionaal werkzame
      schoolbegeleidingsdienst in de desbetreffende regio. Bij of krachtens algemene maatregel van bestuur worden
      voorschriften gegeven met betrekking tot de taak, samenstelling, werkwijze, beoordelingscriteria en subsidie van
      de regionale verwijzingscommissies, de aan de regionale verwijzingscommissies te leveren gegevens en de wijze
      waarop de ouders worden geïnformeerd over de aanvragen bij en de beschikkingen en adviezen van de regionale
      verwijzingscommissies.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10g
  - number: 10g.11
    text: |-
      De in het tiende lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10g
  - number: 10h.1
    text: |-
      Het bevoegd gezag van een school voor middelbaar algemeen voortgezet onderwijs, van een school voor voorbereidend
      beroepsonderwijs, van een scholengemeenschap waarvan ten minste deel uitmaakt een school voor middelbaar algemeen
      voortgezet onderwijs of een school voor voorbereidend beroepsonderwijs, of van een school voor praktijkonderwijs,
      is aangesloten bij een samenwerkingsverband met twee of meer andere van deze scholen of scholengemeenschappen.
      Een samenwerkingsverband omvat ten minste één school of afdeling voor praktijkonderwijs en drie scholen voor
      middelbaar algemeen voortgezet onderwijs of voor voorbereidend beroepsonderwijs, waaronder in ieder geval een
      school voor middelbaar algemeen voortgezet onderwijs en een school voor voorbereidend beroepsonderwijs. Indien
      van een samenwerkingsverband niet drie scholen voor middelbaar algemeen voortgezet onderwijs of voor voorbereidend
      beroepsonderwijs deel uitmaken, maar twee scholengemeenschappen die elk in ieder geval een school voor middelbaar
      algemeen voortgezet onderwijs en een school voor voorbereidend beroepsonderwijs omvatten, kan Onze Minister onder
      door hem te stellen voorwaarden dat samenwerkingsverband aanmerken als een samenwerkingsverband als bedoeld in
      de tweede volzin. Het samenwerkingsverband heeft tot doel zo veel mogelijk leerlingen voor wie vaststaat dat een
      orthopedagogische en orthodidactische benadering is geboden, deel te laten nemen aan het onderwijs in een van de
      leerwegen, genoemd in de [artikelen 10][ref1], [10b][ref2] en [10d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10h.2
    text: |-
      Indien een bevoegd gezag wenst deel te nemen aan een samenwerkingsverband, wordt deze deelname door
      het samenwerkingsverband niet geweigerd. Een samenwerkingsverband waarvan geen school of afdeling voor
      praktijkonderwijs deel uitmaakt, wordt gelijkgesteld met een samenwerkingsverband als bedoeld in het eerste
      lid, tweede volzin, indien de bevoegde gezagsorganen in het samenwerkingsverband met de bevoegde gezagsorganen
      in een of meer andere samenwerkingsverbanden die voldoen aan het eerste lid, tweede volzin, zijn overeengekomen
      dat ten behoeve van de leerlingen van het eerstbedoelde samenwerkingsverband praktijkonderwijs wordt
      verzorgd door een of meer van de scholen of afdelingen voor praktijkonderwijs die deel uitmaken van bedoelde
      andere samenwerkingsverbanden. Het bevoegd gezag kan ten aanzien van een school slechts deelnemen aan één
      samenwerkingsverband. Onze Minister kan onder door hem te stellen voorwaarden toestaan dat van de derde volzin
      wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10h
  - number: 10h.3
    text: |-
      De bevoegde gezagsorganen in een samenwerkingsverband dragen gezamenlijk zorg voor een toereikende organisatie
      en deskundige ondersteuning van het onderwijs voor leerlingen voor wie een orthopedagogische en orthodidactische
      benadering is geboden, alsmede voor overdracht van de deskundigheid op dit gebied tussen de scholen in het
      samenwerkingsverband. De bevoegde gezagsorganen in een samenwerkingsverband kunnen gezamenlijk een of meer
      voorzieningen in het samenwerkingsverband, met het oog op de uitoefening van de in de eerste volzin genoemde taken,
      aanduiden als «orthopedagogisch-didactisch centrum». De bevoegde gezagsorganen in een samenwerkingsverband zijn
      aangesloten bij dezelfde rechtspersoon, bedoeld in [artikel 53b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53b
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53b
        hoofdstuk: IV
        afdeling: I
  - number: 10h.4
    text: |-
      De bevoegde gezagsorganen in een samenwerkingsverband stellen gezamenlijk een permanente commissie leerlingenzorg
      in. Zij vragen advies aan deze commissie over het aanbod en de invulling van leerwegondersteunend onderwijs en over
      het aanbieden van dat onderwijs aan leerlingen voor wie de regionale verwijzingscommissie heeft bepaald dat zij
      toelaatbaar zijn tot het praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10h
  - number: 10h.5
    text: |-
      De bevoegde gezagsorganen in een samenwerkingsverband stellen jaarlijks gezamenlijk een zorgplan vast en zenden dit
      vóór 1 juni voorafgaand aan het desbetreffende schooljaar aan de inspectie en de minister. Het zorgplan bevat in
      ieder geval:
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10h
  - number: 10h.5.a
    text: |-
      de maatregelen die zijn getroffen om zo veel mogelijk leerlingen als bedoeld in het eerste lid deel te laten
      nemen aan het onderwijs in een van de leerwegen, verzorgd door een of meer van de aan het samenwerkingsverband
      deelnemende scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10h
  - number: 10h.5.b
    text: |-
      een omschrijving van de in het derde lid bedoelde organisatie, ondersteuning en overdracht, alsmede, indien van
      toepassing, van de wijze waarop uitvoering is gegeven aan het tweede lid, tweede volzin,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10h
  - number: 10h.5.c
    text: |-
      de wijze waarop de middelen, bedoeld in [artikel 77, vierde lid][ref1], worden ingezet.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel77
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '77'
        hoofdstuk: I
        afdeling: II
  - number: 10h.5.d
    text: een reglement voor de permanente commissie leerlingenzorg,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10h
  - number: 10h.5.e
    text: |-
      een omschrijving van de wijze waarop de ouders van leerlingen als bedoeld in het derde lid, informatie wordt
      verstrekt over de uitvoering van het derde en vierde lid, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10h
  - number: 10h.5.f
    text: de te verwachten resultaten.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10h
  - number: 10h.6
    text: |-
      De bevoegde gezagsorganen in een samenwerkingsverband stellen jaarlijks gezamenlijk een evaluatieve
      voortgangsrapportage vast en zenden deze voor 15 november volgend op het desbetreffende schooljaar aan de inspectie
      en de minister.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10h
  - number: 10h.7
    text: |-
      De bevoegde gezagsorganen in een samenwerkingsverband kunnen hun in het derde tot en met zesde lid opgedragen taken
      en bevoegdheden overdragen aan een door hen gezamenlijk in te stellen orgaan.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel10h
  - number: '11.1'
    text: |-
      Op aanvraag van het bevoegd gezag van een in [artikel 10h, eerste lid][ref1], bedoelde school kan Onze Minister
      toestaan dat het bevoegd gezag zijn deelname aan een samenwerkingsverband ten aanzien van die school beëindigt,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10h
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10h
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11.1.a
    text: |-
      het bevoegd gezag kan aantonen dat alle bevoegde gezagsorganen in het betrokken samenwerkingsverband hiermee
      instemmen,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11
  - number: 11.1.b
    text: het bevoegd gezag kan aantonen dat hij ten aanzien van die school aan een ander samenwerkingsverband deelneemt,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11
  - number: 11.1.c
    text: |-
      met alle bevoegde gezagsorganen in het betrokken samenwerkingsverband een regeling is getroffen met betrekking tot
      de financiële en personele consequenties,
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11
  - number: 11.1.d
    text: |-
      door de beëindiging van de deelname geen aanspraken ontstaan op werkloosheidsuitkeringen voor personeel dat
      werkzaam is aan de scholen in het samenwerkingsverband, waaronder de school ten aanzien waarvan de deelname wordt
      beëindigd, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11
  - number: 11.1.e
    text: de inspectie een positief advies heeft uitgebracht.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11
  - number: '11.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden vastgesteld met betrekking tot de
      samenwerkingsverbanden.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11
  - number: 11a.1
    text: |-
      Het onderwijs aan de scholen, bedoeld in de [artikelen 7][ref1], [8][ref2], [9][ref3], [10a][ref4] en
      [10f][ref5], vangt aan met een periode van basisvorming.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10a
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '9'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 10a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 10f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11a.2
    text: |-
      De basisvorming in het voortgezet onderwijs omvat, behoudens het bepaalde in
      [artikel 11e, eerste en tweede lid][ref1], tenminste de vakken:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11a.2.a
    text: |-
      Nederlandse taal, Engelse taal, een tweede moderne taal door de leerling te kiezen uit Franse taal en Duitse
      taal, geschiedenis en staatsinrichting, aardrijkskunde, economie, wiskunde, natuur- en scheikunde, biologie,
      verzorging, informatiekunde, techniek, lichamelijke opvoeding, met dien verstande dat het bevoegd gezag beslist
      of informatiekunde als apart vak wordt aangeboden dan wel wordt geïntegreerd in andere in dit onderdeel genoemde
      vakken, en
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11a
  - number: 11a.2.b
    text: |-
      twee vakken te kiezen uit tenminste één van de vakken behorende tot de beeldende vorming, muziek, drama of dans;
      van de in dit onderdeel genoemde vakken kunnen niet uitsluitend de vakken dans te zamen met drama, noch uitsluitend
      vakken behorende tot de beeldende vorming gegeven worden.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11a
  - number: 11a.3
    text: |-
      In afwijking van het bepaalde in het tweede lid, kan de basisvorming in het voorgezet onderwijs in het eerste
      leerjaar, in plaats van de vakken genoemd in onderdeel b van dat lid, omvatten: een oriëntatie op de vakken muziek,
      dans, drama en op de vakken behorende tot de beeldende vorming.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11a
  - number: 11a.4
    text: |-
      Ten aanzien van de vakken, genoemd in het tweede lid, eerste volzin, worden, telkens voor een periode van ten
      hoogste 5 jaar, bij algemene maatregel van bestuur kerndoelen vastgesteld. De algemene maatregel van bestuur,
      bedoeld in de eerste volzin, bevat een adviesurentabel voor de vakken, genoemd in het tweede lid, eerste volzin,
      die als grondslag dient voor de vaststelling van de kerndoelen. Vaststelling van kerndoelen voor een volgende
      periode vindt plaats met inachtneming van een evaluatie van de geldende kerndoelen. De algemene maatregel van
      bestuur bedoeld in de eerste volzin, wordt aan de beide Kamers der Staten-Generaal overgelegd. De maatregel treedt
      niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende die termijn niet door of namens
      een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde onderwerp bij de wet wordt
      geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11a
  - number: 11a.5
    text: |-
      Voor de school geldt de eis dat zij ten minste de kerndoelen, bedoeld in het vierde lid, als aan het eind van de
      basisvorming te bereiken doelstellingen hanteert. Kerndoelen geven een beschrijving van kwaliteiten van leerlingen
      op het gebied van kennis, inzicht en vaardigheden.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11a
  - number: 11a.6
    text: |-
      Indien een bevoegd gezag van een bijzondere school dringend bedenkingen heeft tegen de krachtens het vierde lid
      vastgestelde kerndoelen, kan het bevoegd gezag voor een of meer vakken eigen kerndoelen voor de school vaststellen.
      Deze kerndoelen zijn van gelijk niveau als de kerndoelen, bedoeld in het vierde lid. Het bevoegd gezag zendt de
      vastgestelde kerndoelen aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11a
  - number: 11a.7
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de vakken die gedurende de periode
      van basisvorming in combinatie met elkaar gegeven kunnen worden, alsmede omtrent de vakken waarin, naast het
      onderwijs gericht op het bereiken van de kerndoelen, bedoeld in het vierde lid, nog onderwijs moet worden verzorgd
      in de eerste drie leerjaren. De vierde tot en met zesde volzin van het vierde lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11a
  - number: 11b.1
    text: De basisvorming in het voortgezet onderwijs beslaat een periode van drie leerjaren.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11b
  - number: 11b.2
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de basisvorming in het voortgezet onderwijs zodanig wordt ingericht dat
      de kerndoelen, bedoeld in [artikel 11a][ref1], in drie leerjaren kunnen worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11b.3
    text: |-
      Het bevoegd gezag kan in de loop van de periode, bedoeld in het eerste lid, met het oog op het belang van
      leerlingen, de basisvorming in het voortgezet onderwijs zodanig inrichten dat leerlingen de kerndoelen, bedoeld in
      [artikel 11a][ref1], in ten minste twee en ten hoogste vier leerjaren kunnen bereiken.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11c.1
    text: |-
      Gedurende de eerste drie leerjaren van het voortgezet onderwijs worden per leerjaar ten minste 1280 lesuren van 50
      minuten onderwijs verzorgd.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11c
  - number: 11c.2
    text: |-
      Gedurende de periode die aan basisvorming wordt besteed, worden, behoudens in geval van toepassing van
      [artikel 11d][ref1] of het derde lid, per leerjaar tenminste 1000 lesuren van 50 minuten onderwijs verzorgd in
      de vakken genoemd in [artikel 11a, tweede lid][ref2]. Na het tweede leerjaar kan het bevoegd gezag een lager
      aantal lesuren hanteren, afhankelijk van de mate waarin een leerling de vakken die de basisvorming omvat,
      heeft afgesloten. Indien het bevoegd gezag gedurende de eerste twee jaren van de periode van basisvorming naast
      onderwijs in de vakken, genoemd in [artikel 11a, tweede lid][ref3], tevens onderwijs in andere vakken, niet
      zijnde godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs, aanbiedt, draagt het er zorg voor dat voor
      het onderwijs in deze andere vakken uitgangspunten worden gehanteerd in overeenstemming met de kerndoelen bedoeld
      in [artikel 11a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11d
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 11a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 11a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 11a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11c.3
    text: |-
      Het bevoegd gezag van een school voor middelbaar algemeen voortgezet onderwijs of voor voorbereidend
      beroepsonderwijs kan in het eerste of tweede leerjaar, ter voorbereiding op het onderwijs in een van de leerwegen,
      bedoeld in de [artikelen 10][ref1], [10b][ref2] en [10d][ref3], een programma verzorgen ter oriëntatie op het
      onderwijs in de sectoren van die leerwegen. Het in de eerste volzin bedoelde programma omvat niet meer dan 10
      procent van het aantal lesuren over de eerste twee leerjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11c.4
    text: |-
      Het bevoegd gezag van een school voor voorbereidend beroepsonderwijs kan, in plaats van het derde lid en met
      inachtneming van [artikel 11e, tweede lid][ref1], in het eerste of tweede leerjaar, ter voorbereiding op het
      onderwijs in de basisberoepsgerichte leerweg, bedoeld in [artikel 10b][ref2], een programma verzorgen ter
      oriëntatie op het onderwijs in de sectoren van die leerweg. Het in de eerste volzin bedoelde programma is
      uitsluitend bestemd voor de leerling die is toegelaten tot het leerwegondersteunend onderwijs, bedoeld in
      [artikel 10e][ref3], en voor wie naar de verwachting van het bevoegd gezag het onderwijs in de basisberoepsgerichte
      leerweg het meest geschikt is. Het programma omvat niet meer dan 20 procent van het aantal lesuren over de eerste
      twee leerjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10e
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11c.5
    text: |-
      Het onderwijs kan worden verzorgd in een ander aantal minuten per lesuur dan 50. In dat geval dient de totale tijd
      waarin onderwijs wordt verzorgd niet te dalen beneden die welke is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0002399/2006-02-10#Artikel11c
  - number: 11d
    text: |-
      De scholen, bedoeld in [artikel 10a][ref1], kunnen na het tweede leerjaar voor daarvoor in aanmerking komende
      leerlingen minder dan 1000 lesuren onderwijs verzorgen in de vakken, genoemd in [artikel 11a, tweede lid][ref2], en
      in plaats van deze uren onderwijs verzorgen in op het beroep gerichte vakken. Voorwaarde hiervoor is dat in totaal
      ten minste 3000 lesuren onderwijs wordt verzorgd in de vakken, genoemd in [artikel 11a, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10a
