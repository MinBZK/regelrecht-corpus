  - number: 11e.3
    text: |-
      De scholen, bedoeld in de [artikelen 7][ref1], [8][ref2], 9 en 10a, kunnen ten behoeve van leerlingen
      die daarvoor in aanmerking komen, bij de inrichting van het onderwijs voor een of meer vakken
      afwijken van de kerndoelen en van de voorschriften, bedoeld in [artikel 11a, tweede lid][ref3], en
      [artikel 22, derde lid, de onderdelen a tot en met d][ref4], voor zover deze voorschriften verband houden met
      het bepaalde in [artikel 11a][ref5]. Het bevoegd gezag bepaalt bij vrijstelling van een of meer vakken, genoemd
      in [artikel 11a, tweede lid][ref6], welk onderwijs in de vakken, genoemd in [artikel 11a, tweede lid][ref7],
      daarvoor in de plaats komt. Bij algemene maatregel van bestuur wordt bepaald op welke wijze wordt vastgesteld welke
      leerlingen in aanmerking komen voor de afwijkingen, bedoeld in dit lid. De algemene maatregel van bestuur, bedoeld
      in de vorige volzin, wordt aan de beide Kamers der Staten-Generaal overgelegd. De maatregel treedt niet in werking
      dan nadat vier weken na de overlegging zijn verstreken en gedurende die termijn niet door of namens een van beide
      Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde onderwerp bij de wet wordt geregeld.
      Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.


