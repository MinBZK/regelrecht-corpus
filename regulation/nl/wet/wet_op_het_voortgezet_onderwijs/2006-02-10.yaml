        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0002399
        artikel: '22'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref6
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
