  - number: 11c.3
    text: |-
      Het bevoegd gezag van een school voor middelbaar algemeen voortgezet onderwijs of voor voorbereidend
      beroepsonderwijs kan in het eerste of tweede leerjaar, ter voorbereiding op het onderwijs in een van de leerwegen,
      bedoeld in de [artikelen 10][ref1], [10b][ref2] en [10d][ref3], een programma verzorgen ter oriëntatie op het
      onderwijs in de sectoren van die leerwegen. Het in de eerste volzin bedoelde programma omvat niet meer dan 10
      procent van het aantal lesuren over de eerste twee leerjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
