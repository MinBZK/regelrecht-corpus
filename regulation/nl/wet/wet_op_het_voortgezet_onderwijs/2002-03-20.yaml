  - number: 11e.2
    text: |-
      Indien het bevoegd gezag een oriënterend programma als bedoeld in [artikel 11c, vierde lid][ref1],
      vaststelt, verleent het de leerling vrijstelling van het vak Franse taal of het vak Duitse taal, genoemd
      in [artikel 11a, tweede lid, onder a][ref2]. Het bevoegd gezag geeft de inspectie kennis van de verleende
      vrijstelling. Vaststelling van een oriënterend programma en verlening van vrijstelling als bedoeld in de eerste
      volzin blijven achterwege indien de leerling reeds met toepassing van [artikel 11e, eerste lid][ref3], is
      vrijgesteld voor een van de vakken, genoemd in [artikel 11a, tweede lid][ref4].


