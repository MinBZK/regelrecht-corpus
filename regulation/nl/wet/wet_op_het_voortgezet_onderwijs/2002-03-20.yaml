  - number: 11f.1
    text: |-
      Het bevoegd gezag van een school, bedoeld in de artikelen 7 tot en met 9 en 10a, kan na de periode van basisvorming
      onderwijs verzorgen met het oog op een goede aansluiting op vervolgonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel11f
  - number: 11f.2
    text: |-
      Het onderwijs, bedoeld in het eerste lid, beslaat ten hoogste twee leerjaren voor leerlingen waarvoor het bevoegd
      gezag de basisvorming in het voortgezet onderwijs zodanig heeft ingericht dat de kerndoelen, bedoeld in artikel
      11a, in drie leerjaren kunnen worden bereikt. Het onderwijs, bedoeld in het eerste lid, beslaat ten hoogste een
      leerjaar voor leerlingen waarvoor het bevoegd gezag de basisvorming zodanig heeft ingericht dat de kerndoelen,
      bedoeld in artikel 11a, in vier leerjaren kunnen worden bereikt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel11f
  - number: 11g.1
    text: |-
      In afwijking van de [artikelen 10f, derde lid, tweede volzin][ref1], [11a, vijfde lid][ref2],
      [11b, tweede en derde lid][ref3], en [11f, tweede lid][ref4], beslist het bevoegd gezag welke kerndoelen of
      onderdelen van kerndoelen, vastgesteld op grond van [artikel 11a, vierde lid][ref5], het als aan het eind van de
      basisvorming te bereiken doelstellingen hanteert.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel11b
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel11f
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel11g
