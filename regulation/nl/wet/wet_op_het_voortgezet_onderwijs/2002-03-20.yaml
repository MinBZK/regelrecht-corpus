preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter verkrijging van een samenhangend geheel van
    onderwijsvoorzieningen het voortgezet onderwijs in een wet te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit deel verstaat onder: «Onze Minister»: Onze Minister van Onderwijs, Cultuur en Wetenschappen en, voor
      wat betreft het landbouwonderwijs, Onze Minister van Landbouw, Natuurbeheer en Visserij; «de inspectie»:
      de inspectie, bedoeld in artikel 113 of artikel 114; «voortgezet onderwijs»: het voortgezet onderwijs,
      bedoeld in artikel 2 «school»: een school voor voortgezet onderwijs, tenzij het tegendeel blijkt; «openbare
      school»: a. een school in stand gehouden door een gemeente, dan wel door een openbaar lichaam, ingesteld
      bij een gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref1] (Stb.
      1984, 669), waarin deelnemen een of meer gemeenten, al dan niet te zamen met een of meer privaatrechtelijke
      rechtspersonen met volledige rechtsbevoegdheid; b. een door een openbare rechtspersoon als bedoeld in
      artikel 42a in stand gehouden school; c. een door een stichting als bedoeld in artikel 42b of artikel 53c in
      stand gehouden school; «bijzondere school»: een door een natuurlijke persoon of door een privaatrechtelijke
      rechtspersoon, niet zijnde een stichting als bedoeld in artikel 42b, in stand gehouden school; «openbare
      rechtspersoon»: een rechtspersoon die krachtens publiekrecht is ingesteld als bedoeld in artikel 42a; «het
      bevoegd gezag» : voor wat betreft: a. een openbare school: 1°. het college van burgemeester en wethouders, voor
      zover de raad niet anders bepaalt, en, indien de raad dit besluit, met inachtneming van door hem te stellen
      regelen; 2°. het krachtens de desbetreffende gemeenschappelijke regeling bevoegde orgaan; 3°. de openbare
      rechtspersoon, bedoeld in artikel 42a; dan wel 4°. de stichting, bedoeld in artikel 42b of artikel 53c; b.
      een bijzondere school: het schoolbestuur; «Informatie Beheer Groep»: de Informatie Beheer Groep, genoemd in de
      [Wet verzelfstandiging Informatiseringsbank][ref2]; «persoonsgebonden nummer»: het sociaal-fiscaalnummer, bedoeld
      in [artikel 2, derde lid, onder j, van de Algemene wet inzake rijksbelastingen][ref3], dan wel het door de
      Informatie Beheer Groep uitgegeven onderwijsnummer, bedoeld in artikel 27b, vierde lid; «contractactiviteiten»:
      activiteiten als bedoeld in artikel 20, tweede lid; «de basisvorming in het voortgezet onderwijs»: het onderwijs,
      bedoeld in de artikelen 11a tot en met 11e; «nascholing»: een vorm van scholing, gegeven aan leden van het
      personeel om hun kennis, inzicht, vaardigheden en beroepshoudingen direct verband houdend met de uitoefening
      van hun beroep, voortbouwend op de in de initiële opleiding verworven aanvangsbekwaamheid te verdiepen en uit te
      breiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0006320
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel1
    references:
