  - number: '12.1'
    text: |-
      Het onderwijs aan scholen voor voorbereidend wetenschappelijk onderwijs en aan scholen voor hoger algemeen
      voortgezet onderwijs omvat aansluitend op de periode van basisvorming een periode van voorbereidend hoger
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel12
  - number: '12.2'
    text: |-
      De periode van voorbereidend hoger onderwijs is ingericht volgens profielen. Een profiel is een samenhangend
      onderwijsprogramma, zodanig ingericht dat het biedt:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel12
  - number: 12.2.a
    text: een algemene maatschappelijke voorbereiding en persoonlijke vorming,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel12
  - number: 12.2.b
    text: een algemene voorbereiding op het hoger onderwijs, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel12
  - number: 12.2.c
    text: een bijzondere voorbereiding op groepen van naar inhoud verwante opleidingen in het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel12
  - number: '12.3'
    text: 'De school verzorgt alle profielen. De profielen zijn:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel12
  - number: 12.3.a
    text: het profiel natuur en techniek;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel12
  - number: 12.3.b
    text: het profiel natuur en gezondheid;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel12
  - number: 12.3.c
    text: het profiel economie en maatschappij;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel12
  - number: 12.3.d
    text: het profiel cultuur en maatschappij.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel12
  - number: '12.4'
    text: 'Elk profiel bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel12
  - number: 12.4.a
    text: een gemeenschappelijk deel, dat voor alle profielen van de desbetreffende schoolsoort gelijk is,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel12
  - number: 12.4.b
    text: een profieldeel, dat kenmerkend is voor dat profiel, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel12
  - number: 12.4.c
    text: een vrij deel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel12
  - number: '12.5'
    text: |-
      Het bevoegd gezag richt het onderwijs in de periode van voorbereidend hoger onderwijs in op de grondslag van een
      normatieve studielast voor de leerling van 1600 uren per leerjaar, uitgaande van 40 weken met elk een normatieve
      studielast van 40 uren. Het bevoegd gezag richt een in schooltijd verzorgd onderwijsprogramma in dat voor elke
      leerling ten minste 1000 uren onderwijs omvat per leerjaar, onverminderd [artikel 15, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel15
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '15'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '13.1'
    text: |-
      Het gemeenschappelijk deel van elk profiel in het voorbereidend wetenschappelijk onderwijs omvat: Nederlandse
      taal en letterkunde, Engelse taal en letterkunde, Duitse taal en letterkunde, Franse taal en letterkunde,
      algemene natuurwetenschappen, de combinatie geschiedenis en maatschappijleer, culturele en kunstzinnige vorming,
      lichamelijke opvoeding.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: '13.2'
    text: 'Het profieldeel van de profielen in het voorbereidend wetenschappelijk onderwijs omvat:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: 13.2.a
    text: 'voor het profiel natuur en techniek: wiskunde, natuurkunde, scheikunde,'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: 13.2.b
    text: 'voor het profiel natuur en gezondheid: wiskunde, natuurkunde, scheikunde, biologie,'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: 13.2.c
    text: 'voor het profiel economie en maatschappij: economie, wiskunde, geschiedenis, aardrijkskunde, en'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: 13.2.d
    text: 'voor het profiel cultuur en maatschappij:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: 13.2.d.1°
    text: |-
      een moderne taal met de daarbij behorende letterkunde ter keuze van de leerling, of ter keuze van de leerling
      Latijnse taal en letterkunde of Griekse taal en letterkunde,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: 13.2.d.2°
    text: |-
      ter keuze van het bevoegd gezag of, indien het bevoegd gezag daarvoor kiest, ter keuze van de leerling: een andere
      moderne of klassieke taal met de daarbij behorende letterkunde ter keuze van de leerling, of filosofie,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: 13.2.d.3°
    text: culturele en kunstzinnige vorming,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: 13.2.d.4°
    text: geschiedenis, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: 13.2.d.5°
    text: wiskunde.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: '13.3'
    text: 'Het vrije deel kan omvatten:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: 13.3.a
    text: door de leerling te kiezen vakken, genoemd in het tweede lid,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: 13.3.b
    text: |-
      maatschappijleer, management en organisatie, informatica, lichamelijke opvoeding, en voor het atheneum tevens
      klassieke culturele vorming, door de leerling te kiezen, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: 13.3.c
    text: door het bevoegd gezag vast te stellen vakken en andere programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: '13.4'
    text: |-
      Vakken kunnen met het oog op hun plaats in het gemeenschappelijk deel, het profieldeel of het vrije deel, worden
      verdeeld in deelvakken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: '13.5'
    text: |-
      Het bevoegd gezag beslist welke in het tweede lid, onder d, bedoelde keuzetalen met de daarbij behorende
      letterkunde en welke in het derde lid, onder a en b, bedoelde vakken, worden aangeboden. Het bevoegd gezag
      kan tevens besluiten dat door het bevoegd gezag aan te wijzen vakken en andere programma-onderdelen door alle
      leerlingen in het vrije deel moeten worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: '13.6'
    text: |-
      In afwijking van het eerste lid omvat het onderwijs in het gymnasium voor elke leerling klassieke culturele vorming
      in plaats van culturele en kunstzinnige vorming. Het onderwijs in het gymnasium omvat bovendien voor elke leerling
      Latijnse taal en letterkunde of Griekse taal en letterkunde, dan wel beide, ter keuze van de leerling. Het in het
      eerste lid genoemde vak culturele en kunstzinnige vorming kan in het gymnasium behoren tot de vakken van het vrije
      deel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel13
  - number: '14.1'
    text: |-
      Het gemeenschappelijk deel van elk profiel in het hoger algemeen voortgezet onderwijs omvat: Nederlandse taal
      en letterkunde, Engelse taal en letterkunde, een andere moderne taal met de daarbij behorende letterkunde ter
      keuze van de leerling, algemene natuurwetenschappen, de combinatie geschiedenis en maatschappijleer, culturele en
      kunstzinnige vorming, lichamelijke opvoeding.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel14
  - number: '14.2'
    text: 'Het profieldeel van de profielen in het hoger algemeen voortgezet onderwijs omvat:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel14
  - number: 14.2.a
    text: 'voor het profiel natuur en techniek: wiskunde, natuurkunde, scheikunde,'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel14
  - number: 14.2.b
    text: 'voor het profiel natuur en gezondheid: wiskunde, natuurkunde, scheikunde, biologie,'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel14
  - number: 14.2.c
    text: 'voor het profiel economie en maatschappij: economie, wiskunde, geschiedenis, aardrijkskunde, en'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel14
  - number: 14.2.d
    text: |-
      voor het profiel cultuur en maatschappij: een moderne taal met de daarbij behorende letterkunde ter keuze van de
      leerling, culturele en kunstzinnige vorming, geschiedenis, economie, wiskunde.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel14
  - number: '14.3'
    text: 'Het vrije deel kan omvatten:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel14
  - number: 14.3.a
    text: door de leerling te kiezen vakken, genoemd in het tweede lid,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel14
  - number: 14.3.b
    text: |-
      maatschappijleer, filosofie, management en organisatie, informatica, lichamelijke opvoeding, door de leerling te
      kiezen, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel14
  - number: 14.3.c
    text: door het bevoegd gezag vast te stellen vakken en andere programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel14
  - number: '14.4'
    text: |-
      Vakken kunnen met het oog op hun plaats in het gemeenschappelijk deel, het profieldeel of het vrije deel, worden
      verdeeld in deelvakken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel14
  - number: '14.5'
    text: |-
      Het bevoegd gezag beslist welke in het eerste lid en het tweede lid, onder d, bedoelde keuzetalen met de daarbij
      behorende letterkunde en welke in het derde lid, onder a en b, bedoelde vakken worden aangeboden. Het bevoegd
      gezag kan tevens besluiten dat door het bevoegd gezag aan te wijzen vakken en andere programma-onderdelen door alle
      leerlingen in het vrije deel moeten worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel14
  - number: '14.6'
    text: |-
      Tevens kan het bevoegd gezag de leerling in de gelegenheid stellen, in het vrije deel te kiezen uit in artikel 13
      genoemde vakken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel14
  - number: '15.1'
    text: |-
      Bij algemene maatregel van bestuur worden met betrekking tot de in artikel 12, tweede lid, bedoelde profielen
      vastgesteld:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel15
  - number: 15.1.a
    text: de normatieve studielast van het gemeenschappelijk deel, het profieldeel en het vrije deel,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel15
  - number: 15.1.b
    text: |-
      de verdeling van vakken in deelvakken, alsmede de nadere ordening van de in de artikelen 13 en 14 genoemde vakken
      met het oog op hun plaats in het gemeenschappelijk deel, het profieldeel of het vrije deel,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel15
  - number: 15.1.c
    text: de normatieve studielast van de vakken en deelvakken,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel15
  - number: 15.1.d
    text: |-
      voorschriften omtrent de vakken en andere programma-onderdelen, bedoeld in de artikelen 13, derde lid, onder c,
      en 14, derde lid, onder c, behoudens godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs aan bijzondere
      scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel15
  - number: 15.1.e
    text: |-
      voorschriften omtrent de mogelijkheid, vrijstelling te verlenen van onderdelen van de artikelen 13 en 14 ten
      behoeve van leerlingen met bijzondere kenmerken, waartoe in elk geval kunnen behoren leerlingen die niet in staat
      zijn, onderwijs in lichamelijke opvoeding te volgen, alsmede leerlingen als bedoeld in artikel 16, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel15
  - number: 15.1.f
    text: |-
      de inpassing van het in artikel 13, zesde lid, bepaalde, in het bij het eerste tot en met vierde lid van artikel 13
      en in het krachtens artikel 15 bepaalde.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel15
  - number: '15.2'
    text: |-
      Tevens kan bij de in het eerste lid bedoelde algemene maatregel van bestuur in afwijking van artikel 12, vijfde
      lid, tweede volzin, worden bepaald dat het in schooltijd verzorgde onderwijsprogramma in het laatste leerjaar
      een geringer aantal dan 1000 uren onderwijs omvat, maar ten minste een bij die algemene maatregel van bestuur te
      bepalen aantal uren.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel15
  - number: '15.3'
    text: |-
      De in het eerste lid bedoelde algemene maatregel van bestuur wordt aan de beide Kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel15
  - number: '16.1'
    text: |-
      Aan een school voor voorbereidend wetenschappelijk onderwijs, voor algemeen voortgezet onderwijs, voor
      voorbereidend beroepsonderwijs of voor praktijkonderwijs kan ten behoeve van leerlingen met een niet-Nederlandse
      culturele achtergrond onderwijs worden gegeven in de taal van het land van oorsprong van die leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel16
  - number: '16.2'
    text: Bij algemene maatregel van bestuur wordt bepaald op welke groepen van leerlingen het eerste lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel16
  - number: '17'
    text: Het onderwijs gaat er mede van uit dat de leerlingen opgroeien in een multiculturele samenleving.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel17
  - number: '18.1'
    text: |-
      Bij het geven van onderwijs aan een leerling die is opgenomen in een ziekenhuis of die in verband met ziekte thuis
      verblijft, kan het bevoegd gezag van een school worden ondersteund.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel18
  - number: '18.2'
    text: 'De ondersteuning bedoeld in het eerste lid wordt verzorgd door:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel18
  - number: 18.2.a
    text: |-
      een educatieve voorziening als bedoeld in
      [artikel 1.4, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek ][ref1]indien de leerling
      is opgenomen in een academisch ziekenhuis of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 18.2.b
    text: |-
      een schoolbegeleidingsdienst als bedoeld in [artikel 280](onbekend),
      [artikel 179 van de Wet op het primair onderwijs][ref1] en [artikel 165 van de Wet op de expertisecentra][ref2]
      indien de leerling is opgenomen in een ziekenhuis niet zijnde een academisch ziekenhuis dan wel indien de leerling
      in verband met ziekte thuis verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel165
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '165'
  - number: '18.3'
    text: |-
      De ondersteuning bedoeld in het eerste lid kan in overeenstemming tussen de educatieve voorziening dan wel de
      schoolbegeleidingsdienst en de school waarbij de leerling is ingeschreven, mede het geven van onderwijs aan de
      leerling betreffen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel18
  - number: '19.1'
    text: |-
      In een scholengemeenschap zijn tot één school verenigd een school of inrichting in de zin van dit deel en een of
      meer andere al dan niet in dit deel bedoelde scholen, niet zijnde instellingen van hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel19
  - number: '19.2'
    text: |-
      Aan een scholengemeenschap kan een nevenvestiging verbonden zijn indien de nevenvestiging is tot stand gebracht
      op de wijze en voldoet aan de voorwaarden, bedoeld in artikel 75a, onderscheidenlijk bepaald krachtens artikel 75,
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel19
  - number: '19.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten behoeve van scholengemeenschappen waarin tot één school
      zijn verenigd een school of inrichting in de zin van dit deel en een of meer andere bedoelde scholen in de zin van
      deel II van deze wet dan wel in de zin van een andere dan deze wet, nadere voorschriften worden gegeven, zo nodig
      in afwijking van de artikelen 32 tot en met 41.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel19
  - number: '19.4'
    text: |-
      Aan een school voor middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend
      beroepsonderwijs of aan een scholengemeenschap waarvan ten minste een school voor middelbaar algemeen
      voortgezet onderwijs of een school voor voorbereidend beroepsonderwijs deel uitmaakt, kan een
      nevenvestiging zijn verbonden, indien de nevenvestiging is tot stand gebracht op de wijze en voldoet aan
      de voorwaarden, bedoeld in [artikel IV, derde lid][ref1], onderscheidenlijk[artikel V, derde lid][ref2], of
      [VIII, vierde lid, van de Wet van 25 mei 1998][ref3] (Stb. 337). Aan een school voor praktijkonderwijs kan
      een nevenvestiging zijn verbonden indien die is tot stand gebracht op de wijze en voldoet aan de voorwaarden,
      bedoeld in de regels die voor nevenvestigingen aan scholen voor praktijkonderwijs zijn gesteld krachtens
      [artikel XXII van de in de eerste volzin genoemde wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009638#ArtikelIV
      [ref2]: https://wetten.overheid.nl/BWBR0009638#ArtikelV
      [ref3]: https://wetten.overheid.nl/BWBR0009638#ArtikelVIII
      [ref4]: https://wetten.overheid.nl/BWBR0009638#ArtikelXXII
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009638
        artikel: IV
      - id: ref2
        bwb_id: BWBR0009638
        artikel: V
      - id: ref3
        bwb_id: BWBR0009638
        artikel: VIII
      - id: ref4
        bwb_id: BWBR0009638
        artikel: XXII
  - number: '19.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan ten behoeve van het voorbereidend beroepsonderwijs, verzorgd
      in agrarische opleidingscentra als bedoeld in [artikel 1.3.3 van de Wet educatie en beroepsonderwijs][ref1], worden
      vastgesteld dat het bepaalde bij of krachtens de Wet op het voortgezet onderwijs geheel of gedeeltelijk niet van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: '20.1'
    text: De scholen voor voortgezet onderwijs zijn dagscholen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel20
  - number: '20.2'
    text: |-
      Aan een school kunnen contractactiviteiten worden verricht, bestaande uit cursussen waarvan de kosten niet ten
      laste van 's Rijks kas komen, en uit werkzaamheden voor eigen rekening ten behoeve van derden, voor zover deze
      cursussen en werkzaamheden verband houden met het onderwijs aan de desbetreffende school en voor zover het belang
      van het onderwijs aan de school door deze cursussen en werkzaamheden niet wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel20
  - number: '21.1'
    text: |-
      De naam van de school duidt aan, tot welke van de soorten van scholen, bedoeld in de [artikelen 7][ref1],
      [8][ref2], [9][ref3], [10a][ref4] en [10f][ref5], de school behoort. Het bevoegd gezag van een school voor
      middelbaar algemeen voortgezet onderwijs, een school voor voorbereidend beroepsonderwijs, of een scholengemeenschap
      waarvan in ieder geval een school voor middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend
      beroepsonderwijs deel uitmaakt, kan voor die school de aanduiding «voorbereidend middelbaar beroepsonderwijs»
      hanteren. Bij verschil van mening tussen het bevoegd gezag en Onze minister, tot welke van de soorten zij behoort,
      beslist Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10a
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '9'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 10a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 10f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '21.2'
    text: |-
      In het maatschappelijk verkeer brengt het bevoegd gezag ondubbelzinnig tot uitdrukking, welk bij en krachtens deze
      wet geregeld, uit 's Rijks kas bekostigd onderwijs de leerlingen volgen, en in voorkomend geval welk onderwijs de
      school verzorgt met toepassing van [artikel 20, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel20
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '20'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '22.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor de scholen voor voorbereidend wetenschappelijk
      onderwijs, algemeen voortgezet onderwijs en voorbereidend beroepsonderwijs voorschriften vastgesteld omtrent de
      inrichting van het onderwijs. Deze voorschriften kunnen per schoolsoort verschillen. Voor de scholen, bedoeld in
      de artikelen 7, 8, 9 en 10a, alsmede voor het onderwijs, bedoeld in artikel 11f, kunnen afzonderlijke voorschriften
      worden gegeven. De bij deze algemene maatregel van bestuur gegeven voorschriften zijn niet van toepassing op
      scholen en afdelingen voor voorbereidend beroepsonderwijs waarvoor artikel 24, vijfde lid, wordt toegepast.
      De algemene maatregel van bestuur, bedoeld in de eerste volzin, wordt aan de beide Kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en niet door
      of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde onderwerp bij de
      wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel22
  - number: '22.2'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, houdt voor alle schoolsoorten voorschriften in
      omtrent de tijd die per cursusjaar ten hoogste voor vakantie mag worden besteed, met dien verstande dat begin en
      einde van de zomervakantie kunnen worden voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel22
  - number: '22.3'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, kan, naast het bepaalde in het tweede lid, slechts
      voorschriften inhouden omtrent:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel22
  - number: 22.3.a
    text: |-
      voor het middelbaar algemeen voortgezet onderwijs en het voorbereidend beroepsonderwijs, het aantal lessen dat
      gedurende de cursus in vakken of in groepen van vakken ten minste moet worden verzorgd en het aantal studielessen
      dat gedurende de cursus ten minste moet worden verzorgd, alsmede voor het voorbereidend wetenschappelijk onderwijs
      en het hoger algemeen voortgezet onderwijs, het in uren uitgedrukte aantal lessen dat gedurende de cursus in
      lichamelijke opvoeding ten minste moet worden verzorgd,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel22
  - number: 22.3.b
    text: 'voor het middelbaar algemeen voortgezet onderwijs en het voorbereidend beroepsonderwijs:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel22
  - number: 22.3.b.1°
    text: |-
      het aantal lessen dat – behoudens godsdienst- of levensbeschouwelijk vormingsonderwijs aan bijzondere scholen –
      gedurende de cursus mag worden besteed aan het onderwijs in andere, door het bevoegd gezag te kiezen vakken,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel22
  - number: 22.3.b.2°
    text: |-
      het aantal lessen dat gedurende de cursus in alle vakken te zamen moet worden verzorgd, met inbegrip van de
      studielessen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel22
  - number: 22.3.b.3°
    text: de duur van de lessen en van de studielessen, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel22
  - number: 22.3.c
    text: de stage.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel22
  - number: '23'
    text: |-
      Ten behoeve van de scholen voor middelbaar algemeen voortgezet onderwijs en de scholen voor voorbereidend
      beroepsonderwijs wordt bij algemene maatregel van bestuur een adviesurentabel vastgesteld voor het aantal lessen
      dat gedurende de cursus in elk van de vakken genoemd in de [artikelen 10][ref1], [10b][ref2] en [10d][ref3] of
      in groepen van die vakken ten minste kan worden verzorgd, en het aantal studielessen dat gedurende de cursus ten
      minste kan worden verzorgd. De algemene maatregel van bestuur, bedoeld in de eerste volzin, wordt aan de beide
      Kamers der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging
      zijn verstreken en gedurende die termijn niet door of namens een van beide Kamers de wens wordt te kennen gegeven
      dat het in die maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend
      wetsvoorstel zo spoedig mogelijk ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 23a
    text: |-
      Het bevoegd gezag draagt zorg voor de kwaliteit van het onderwijs op de school. Onder zorg dragen voor de
      kwaliteit van het onderwijs wordt in elk geval verstaan: het uitvoeren van het in het schoolplan, bedoeld in
      [artikel 24][ref1], beschreven beleid op een zodanige wijze dat de wettelijke opdrachten voor het onderwijs en de
      door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs, worden gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 23b
    text: |-
      Het bevoegd gezag rapporteert over de vorderingen van de leerlingen aan hun ouders, voogden of verzorgers, dan wel
      aan de leerlingen zelf indien zij meerderjarig en handelingsbekwaam zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel23b
  - number: '24.1'
    text: |-
      Het schoolplan bevat een beschrijving van het beleid met betrekking tot de kwaliteit van het onderwijs dat binnen
      de school wordt gevoerd, en omvat in elk geval het onderwijskundig beleid, het personeelsbeleid en het beleid met
      betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs. Het schoolplan omvat mede het beleid
      ten aanzien van de aanvaarding van materiële bijdragen of geldelijke bijdragen, niet zijnde ouderbijdragen of op
      de onderwijswetgeving gebaseerde bijdragen, indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee
      de leerlingen binnen de schooltijden en tijdens de activiteiten die worden georganiseerd onder verantwoordelijkheid
      van het bevoegd gezag, alsmede tijdens het overblijven, zullen worden geconfronteerd. Het schoolplan kan op een
      of meer scholen voor voortgezet onderwijs en een of meer scholen voor ander onderwijs van hetzelfde bevoegd gezag
      betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24
  - number: '24.2'
    text: |-
      Het onderwijskundig beleid omvat in elk geval de uitwerking van de wettelijke opdrachten voor het onderwijs
      en van de door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs in een
      onderwijsprogramma. Daarbij worden tevens betrokken de voorzieningen die zijn getroffen voor leerlingen met
      specifieke onderwijsbehoeften.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24
  - number: '24.3'
    text: |-
      Het personeelsbeleid, voor zover dat in het schoolplan tot uitdrukking wordt gebracht, omvat in elk geval
      maatregelen met betrekking tot het personeel die bijdragen aan de ontwikkeling en de uitvoering van het
      onderwijskundig beleid alsmede het document inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding,
      bedoeld in artikel 32d van de wet.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24
  - number: '24.4'
    text: |-
      Het beleid met betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs omvat in elk geval
      op welke wijze het bevoegd gezag bewaakt dat die kwaliteit wordt gerealiseerd en vaststelt welke maatregelen ter
      verbetering van de kwaliteit nodig zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24
  - number: '24.5'
    text: |-
      Onze Minister kan scholen voor voorbereidend beroepsonderwijs of afdelingen daarvan aanwijzen, waarvan de
      schoolplannen met zijn toestemming mogen afwijken van de in dit artikel gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24
  - number: 24a.1
    text: |-
      De schoolgids bevat voor ouders, voogden, verzorgers en leerlingen informatie over de werkwijze van de school en
      bevat in elk geval informatie over:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24a
  - number: 24a.1.a
    text: |-
      de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, waaronder, in ieder
      geval met betrekking tot het schooljaar voorafgaande aan het schooljaar waarin de schoolgids wordt vastgesteld en
      onderscheiden naar soort onderwijs, voor elk leerjaar
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24a
  - number: 24a.1.a.1°
    text: het percentage leerlingen dat doorstroomt naar een hoger leerjaar of een ander soort onderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24a
  - number: 24a.1.a.2°
    text: |-
      het percentage leerlingen dat de school zonder diploma verlaat en het percentage leerlingen dat voor het eindexamen
      slaagt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24a
  - number: 24a.1.b
    text: de wijze waarop aan de zorg voor leerlingen met specifieke onderwijsbehoeften wordt vorm gegeven,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24a
  - number: 24a.1.c
    text: de wijze waarop de verplichte onderwijstijd wordt benut,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24a
  - number: 24a.1.d
    text: |-
      de geldelijke bijdrage, bedoeld in artikel 27, tweede lid, waarbij een ontwerp van een overeenkomst voor een
      dergelijke bijdrage, die voldoet aan de eisen die in artikel 27, tweede lid, zijn geformuleerd, in de schoolgids
      wordt opgenomen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24a
  - number: 24a.1.e
    text: |-
      de rechten en plichten van de ouders, de voogden, de verzorgers, de leerlingen en het bevoegd gezag, waaronder de
      informatie over de klachtenregeling, bedoeld in artikel 24b, waarbij wat betreft de leerlingen kan worden volstaan
      met vermelding van de rechten en plichten opgenomen in het leerlingenstatuut, bedoeld in artikel 24g, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24a
  - number: 24a.1.f
    text: de wijze waarop het bevoegd gezag omgaat met de in artikel 24, eerste lid, omschreven bijdragen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24a
  - number: 24a.2
    text: Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven met betrekking tot de wijze waarop
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24a
  - number: 24a.2.a
    text: de resultaten worden beschreven die met het onderwijs worden bereikt, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24a
  - number: 24a.2.b
    text: de context wordt vermeld waarin de onder a bedoelde resultaten dienen te worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24a
  - number: 24a.3
    text: |-
      Het bevoegd gezag reikt de schoolgids uit aan de ouders, voogden, verzorgers dan wel de meerderjarige en
      handelingsbekwame leerling bij de inschrijving en jaarlijks na de vaststelling van de schoolgids.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24a
  - number: 24a.4
    text: |-
      De algemene maatregel van bestuur, bedoeld in het tweede lid, wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een der kamers de wens te kennen wordt gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24a
  - number: 24b.1
    text: |-
      Ouders, voogden, verzorgers dan wel leerlingen, en personeelsleden kunnen bij de klachtencommissie, bedoeld in
      het tweede lid, onderdeel a, een klacht indienen over gedragingen en beslissingen van het bevoegd gezag of het
      personeel, waaronder discriminatie, dan wel het nalaten van gedragingen en het niet nemen van beslissingen door het
      bevoegd gezag of het personeel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24b.2
    text: 'Het bevoegd gezag treft een regeling voor de behandeling van klachten. Deze regeling vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24b.2.a
    text: de instelling van een klachtencommissie, die klachten behandelt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24b.2.b
    text: de wijze waarop de klachtencommissie haar werkzaamheden verricht,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24b.2.c
    text: de termijn waarbinnen de klager een klacht kan indienen en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24b.2.d
    text: |-
      de termijn waarbinnen mededeling plaatsvindt van het oordeel, bedoeld in het zesde lid, en hoe bij noodzakelijke
      afwijking van deze termijn wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24b.3
    text: |-
      Deze regeling strekt ter vervanging van klachtenregelingen op grond van andere voorschriften dan dit artikel en
      strekt niet ter vervanging van een andere voorziening die op grond van een wettelijke regeling, niet zijnde een
      klachtenregeling, voor de klager openstaat of heeft opengestaan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24b.4
    text: Deze regeling
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24b.4.a
    text: |-
      voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit ten minste drie leden,
      waaronder een voorzitter die geen deel uitmaakt van het bevoegd gezag en niet werkzaam is voor of bij het bevoegd
      gezag, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24b.4.b
    text: |-
      waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24b.5
    text: 'De klager en degene over wie is geklaagd krijgen de gelegenheid:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24b.5.a
    text: hun zienswijze mondeling of schriftelijk toe te lichten en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24b.5.b
    text: zich bij de behandeling van de klacht te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24b.6
    text: |-
      De klachtencommissie vormt zich een oordeel over de gegrondheid van de klacht en deelt dit oordeel, al dan niet
      vergezeld van aanbevelingen, schriftelijk mede aan de klager, degene over wie is geklaagd en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24b.7
    text: |-
      Het bevoegd gezag deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onderdeel a, binnen 4 weken
      na ontvangst van het in het zesde lid bedoelde oordeel van de klachtencommissie schriftelijk mede of hij het
      oordeel over de gegrondheid van de klacht deelt en of hij naar aanleiding van dat oordeel maatregelen zal nemen en
      zo ja welke. Bij afwijking van de in de eerste volzin bedoelde termijn, doet het bevoegd gezag daarvan met redenen
      omkleed mededeling aan de klager en de klachtencommissie onder vermelding van de termijn waarbinnen het bevoegd
      gezag zijn standpunt bekend zal maken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24b.8
    text: |-
      Degene die betrokken is bij de uitvoering van dit artikel en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, is verplicht tot geheimhouding daarvan,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24b.9
    text: |-
      Gegevens die betrekking hebben op een klacht worden bewaard op een plaats die uitsluitend toegankelijk is voor de
      leden van de klachtencommissie en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24b
  - number: 24c.1
    text: Het bevoegd gezag stelt ten minste eenmaal in de 4 jaar het schoolplan vast.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24c
  - number: 24c.2
    text: Het bevoegd gezag stelt jaarlijks de schoolgids vast ten behoeve van het eerstvolgende schooljaar.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24c
  - number: 24c.3
    text: |-
      Het bevoegd gezag zendt het schoolplan dan wel de wijzigingen daarvan en de schoolgids onmiddellijk na de
      vaststelling aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24c
  - number: 24f
    text: |-
      De programma's dan wel beschrijvingen van de contractactiviteiten worden ter kennisneming toegezonden aan de
      inspectie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24f
  - number: 24g.1
    text: |-
      Het bevoegd gezag van een school legt elke twee jaar in een reglement, leerlingenstatuut genaamd, de rechten en
      plichten van de leerlingen vast.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24g
  - number: 24g.2
    text: |-
      In het leerlingenstatuut worden in elk geval voorschriften opgenomen, strekkende tot handhaving van de goede gang
      van zaken binnen de instelling en, de wijze waarop uitvoering wordt gegeven aan de bescherming van gegevens uit de
      persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24g
  - number: 24g.3
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een exemplaar van het leerlingenstatuut in het gebouw van de instelling
      ter inzage wordt gelegd op een voor de leerlingen toegankelijke plaats.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel24g
  - number: '25'
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs aan een school kan Onze minister toestaan dat
      van de [artikelen 7 tot en met 11f][ref1], [12 tot en met 15][ref2], en van de voorschriften, bedoeld in
      [artikel 22][ref3], wordt afgeweken. Onze minister besluit binnen zes maanden na ontvangst van een aanvraag. Indien
      de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze minister de aanvrager daarvan in kennis en
      noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel22
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '22'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '27.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor elke soort van scholen of voor afdelingen van die
      scholen voorwaarden voor de toelating en voorschriften omtrent verwijdering en voorwaardelijke bevordering worden
      vastgesteld. De algemene maatregel van bestuur bedoeld in de eerste volzin houdt in elk geval voorschriften
      in met betrekking tot de voorwaarden voor de toelating tot de scholen, bedoeld in de artikelen 7, 8, 9 en 10a.
      Definitieve verwijdering van een leerling waarop de [Leerplichtwet 1969][ref1] van toepassing is, vindt niet plaats
      dan nadat het bevoegd gezag ervoor heeft zorggedragen dat een andere school, dan wel een instelling als bedoeld in
      [artikel 1, onder c, van de Leerplichtwet 1969][ref2] bereid is de leerling toe te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002628
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '1'
  - number: 27.1a
    text: |-
      Voor het volgen van een vorm van onderwijs als onderscheiden in artikel 5 aan een school wordt uitsluitend als
      leerling toegelaten degene waarvan de ouders, voogden of verzorgers aantonen, dan wel, indien hij meerderjarig en
      handelingsbekwaam is, degene die aantoont dat hij:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: 27.1a.a
    text: de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: 27.1a.b
    text: |-
      vreemdeling is en jonger is dan 18 jaar op de eerste schooldag waarop de vorm van voortgezet onderwijs als
      onderscheiden in artikel 5 begint waarvoor voor de eerste maal toelating wordt gewenst,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: 27.1a.c
    text: |-
      vreemdeling is, 18 jaar of ouder is op de eerste schooldag waarop de vorm van voortgezet onderwijs als
      onderscheiden in artikel 5 begint waarvoor voor de eerste maal toelating wordt gewenst en op die dag rechtmatig
      verblijf houdt in de zin van [artikel 8 van de Vreemdelingenwet 2000][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 27.1a.d
    text: |-
      vreemdeling is, niet meer voldoet aan een van de voorwaarden, genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen voor een vorm van voortgezet onderwijs als onderscheiden in artikel 5 is toegelaten tot
      een school, welke vorm van voortgezet onderwijs nog steeds wordt gevolgd en nog niet is voltooid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: 27.1b
    text: |-
      Indien na de toelating tot de school blijkt dat deze op welke grond dan ook niet in overeenstemming met lid 1a
      heeft plaatsgevonden, wordt de leerling onmiddellijk verwijderd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: '27.2'
    text: |-
      De toelating wordt niet afhankelijk gesteld van een andere dan een bij of krachtens de wet geregelde bijdrage.
      Overeenkomsten waarbij ouders worden verplicht tot het betalen van een geldelijke bijdrage zijn nietig, behoudens
      voorzover zij na de toelating van de leerling tot de school schriftelijk zijn aangegaan en in het desbetreffende
      schriftelijke stuk aan de ouders kenbaar is gemaakt dat het een vrijwillige bijdrage betreft waarvoor de
      overeenkomst niet behoeft te worden aangegaan, doch waarvoor geldt dat na de ondertekening wel een verplichting
      tot betaling van de overeengekomen bijdrage bestaat. Zodanige overeenkomsten zijn evenzeer nietig, indien deze niet
      hebben voorzien in de vermelding dat de ouders de mogelijkheid hebben er voor te kiezen om de overeenkomst slechts
      voor bepaalde voorzieningen aan te gaan en ten behoeve daarvan niet een specificatie voor de te onderscheiden
      voorzieningen in de overeenkomst is opgenomen. Zodanige overeenkomsten zijn voorts nietig indien ten aanzien
      daarvan geen reductie- en kwijtscheldingsregeling geldt en de inhoud van die regeling niet in de overeenkomst is
      opgenomen. Een overeenkomst wordt telkens voor de periode van een schooljaar aangegaan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: '27.3'
    text: |-
      Een leerling mag na vijf jaren te rekenen vanaf het ogenblik dat hij is aangevangen met voortgezet onderwijs,
      geen onderwijs meer volgen aan een school voor middelbaar algemeen voortgezet onderwijs, aan een school voor
      voorbereidend beroepsonderwijs en in de eerste drie leerjaren van een school voor hoger algemeen voortgezet
      onderwijs of voorbereidend wetenschappelijk onderwijs. Indien een leerling na 31 januari van het schooljaar
      aanvangt met voortgezet onderwijs, eindigt het vijfde jaar op 31 juli van het schooljaar waarin de periode
      van vijf jaren verstrijkt. Een leerling mag geen praktijkonderwijs meer volgen aan een school of afdeling voor
      praktijkonderwijs na afloop van het schooljaar waarin hij de leeftijd van achttien jaren heeft bereikt. Op een
      daartoe strekkend verzoek van het bevoegd gezag, gedaan in het in de derde volzin bedoelde schooljaar, kan de
      inspectie toestaan dat de leerling het daaropvolgende schooljaar praktijkonderwijs kan blijven volgen, indien zij
      van mening is dat zonder het volgen van dit schooljaar de leerling niet voldoende is voorbereid op de functies,
      bedoeld in artikel 10f, derde lid, derde volzin. De inspectie kan de vierde volzin op overeenkomstige wijze
      toepassen in het schooljaar waarin de leerling de leeftijd van 19 jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: '27.4'
    text: |-
      Het derde lid is niet van toepassing op scholen voor voorbereidend beroepsonderwijs die zijn aangewezen op grond
      van artikel 24, vijfde lid, voor zover het onderwijs bestemd is voor gehandicapte leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: '27.5'
    text: |-
      Op een daartoe strekkend verzoek van het bevoegd gezag, gedaan in het vijfde jaar van de periode,
      genoemd in het derde lid, kan de inspectie die periode met ten hoogste een jaar verlengen ten behoeve
      van een leerling die voorafgaand aan het voortgezet onderwijs geen basisonderwijs als bedoeld in de
      [Wet op het primair onderwijs][ref1], voortgezet speciaal onderwijs als bedoeld in deel II van deze wet, of
      speciaal onderwijs dan wel voortgezet speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref2] heeft
      gevolgd en die voldoet aan de volgende vereisten:


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: 27.5.a
    text: hij heeft bij het begin van het vijfde jaar van die periode de leeftijd van 18 jaren nog niet bereikt, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: 27.5.b
    text: |-
      hij volgt onderwijs aan een school voor voorbereidend beroepsonderwijs of aan een school voor middelbaar algemeen
      voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: '27.6'
    text: |-
      Op een daartoe strekkend verzoek van het bevoegd gezag, gedaan in het vijfde jaar van de periode, genoemd in het
      derde lid, kan de inspectie die periode met ten hoogste een jaar verlengen ten behoeve van een leerling die voldoet
      aan de volgende vereisten:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: 27.6.a
    text: |-
      hij heeft in de eerste vier jaren van de periode van vijf jaren vanwege langdurige ziekte of vanwege bijzondere,
      van de wil van die leerling onafhankelijke omstandigheden meer dan 12 maanden het onderwijs niet kunnen volgen,
      dan wel
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: 27.6.b
    text: |-
      hij heeft in het vijfde jaar vanwege langdurige ziekte of ten gevolge van bijzondere, van de wil van die leerling
      onafhankelijke omstandigheden lange tijd het onderwijs niet kunnen volgen, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: 27.6.c
    text: |-
      hij volgt onderwijs aan een school voor voorbereidend beroepsonderwijs of aan een school voor middelbaar algemeen
      voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: '27.7'
    text: |-
      De inspectie willigt een verzoek, bedoeld in het vijfde en zesde lid, slechts in indien zij verwacht dat de
      leerling:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: 27.7.a
    text: niet in staat zal zijn in dat vijfde jaar de opleiding met goed gevolg te voltooien, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: 27.7.b
    text: in de periode van de verlenging wel in staat zal zijn de opleiding met goed gevolg te voltooien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: '27.8'
    text: Het vijfde en zesde lid kunnen niet tegelijkertijd worden toegepast ten aanzien van dezelfde leerling.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: '27.9'
    text: |-
      Indien het verzoek, bedoeld in het vijfde of zesde lid, een leerling betreft die leerwegondersteunend onderwijs
      volgt, willigt de inspectie dat verzoek niet in dan nadat zij kennis heeft genomen van een op de desbetreffende
      leerling betrekking hebbend advies van de permanente commissie leerlingenzorg, bedoeld in artikel 10h, vierde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: '27.10'
    text: |-
      Onverminderd het vijfde tot en met achtste lid, kan de inspectie, volgens bij of krachtens algemene maatregel van
      bestuur vast te stellen voorschriften, op een daartoe strekkend verzoek van het bevoegd gezag, ten aanzien van een
      leerling op individuele basis de verblijfsduur met een jaar verlengen, voor zover toepassing van het derde lid,
      eerste en tweede volzin, gelet op het belang van de leerling zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
  - number: '27.11'
    text: |-
      Bij algemene maatregel van bestuur kunnen, in afwijking van de [artikelen 7:10][ref1] en
      [7:24 van de Algemene wet bestuursrecht][ref2] (Stb. 1992, 315), kortere termijnen dan in de artikelen vermeld,
      worden bepaald voor het op een bezwaar- of beroepschrift te nemen besluit van het bevoegd gezag van een openbare
      school ter zake van de toelating en verwijdering van leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 27a.1
    text: |-
      Het bevoegd gezag stelt van iedere aan de school ingeschreven leerling die valt onder de werking van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1], vast, of deze leerling gedurende
      een aaneengesloten periode van ten minste 5 weken zonder geldige reden niet aan het onderwijs heeft deelgenomen. In
      afwijking van de vorige volzin kan Onze Minister bepalen dat voor soorten van voortgezet onderwijs de in die volzin
      bedoelde vaststelling wordt gedaan indien een ingeschreven studerende in een of meer vakken, deelvakken of andere
      programma-onderdelen niet aan het onderwijs heeft deelgenomen. Onder afwezigheid met geldige reden wordt verstaan
      afwezigheid wegens ziekte van de leerling, welke ziekte uitsluitend kan worden aangetoond door middel van een
      gedagtekende verklaring van een arts, en afwezigheid wegens bijzondere familie-omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 27a.2
    text: |-
      Het bevoegd gezag meldt uiterlijk op de derde werkdag na afloop van een periode van afwezigheid van 5 weken aan de
      leerling dat daarvan in de administratie van de school aantekening is gemaakt en verzoekt de leerling om opgaaf van
      de reden van de afwezigheid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27a
  - number: 27a.3
    text: 'Uiterlijk op de vijfde werkdag na de periode van 8 weken stelt het bevoegd gezag vast:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27a
  - number: 27a.3.a
    text: |-
      of de reden die de leerling binnen 8 weken na de aanvang van de periode van 5 weken gaf voor zijn afwezigheid, een
      geldige is, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27a
  - number: 27a.3.b
    text: |-
      dat de leerling binnen 8 weken na de aanvang van de periode van 5 weken geen reden heeft opgegeven voor zijn
      afwezigheid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27a
  - number: 27a.4
    text: |-
      Het bevoegd gezag stelt tevens uiterlijk op de vijfde werkdag na afloop van de periode van 8 weken vast of de
      leerling voor het einde van die periode weer aan het onderwijs is gaan deelnemen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27a
  - number: 27a.5
    text: |-
      Het bevoegd gezag meldt uiterlijk de vijfde werkdag na afloop van een periode van 8 weken aan de Informatie Beheer
      Groep de leerling die gedurende een aaneengesloten periode van ten minste 5 weken zonder opgave van geldige reden
      niet aan het onderwijs heeft deelgenomen. Tevens meldt het indien die leerling voor het einde van de periode van 8
      weken weer aan het onderwijs is gaan deelnemen de datum ervan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27a
  - number: 27a.6
    text: |-
      De periode van 5 weken en de periode van 8 weken worden verlengd met de weken waarin vanwege vakantie geen
      onderwijs werd verzorgd. Zij wordt geacht niet te zijn onderbroken door deze vakantieweken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27a
  - number: 27a.7
    text: |-
      Het bevoegd gezag stuurt gelijktijdig met de mededelingen, bedoeld in het vijfde lid, een afschrift
      van de gegevens die over de betrokken leerling aan de Informatie Beheer Groep zijn verstrekt aan deze
      betrokkene. Het bevoegd gezag geeft daarbij tevens aan dat afwezigheid als bedoeld in het eerste lid,
      gevolgen heeft voor de tegemoetkoming in de onderwijsbijdrage en de schoolkosten van betrokkene op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1], alsmede welke beroepsgang voor
      betrokkene tegen de mededeling, bedoeld in het vijfde lid, open staat.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 27b.1
    text: |-
      Onverminderd bij algemene maatregel van bestuur gegeven voorschriften met betrekking tot de in- en uitschrijving
      van leerlingen, vindt toelating van een leerling als bedoeld in [artikel 27][ref1] slechts plaats nadat door de
      ouders, voogden of verzorgers of, indien de leerling meerderjarig is, door de leerling de gegevens betreffende
      de geslachtsnaam, de voorletters, de geboortedatum, het geslacht en het persoonsgebonden nummer van de leerling
      zijn overgelegd. Indien door de ouders, voogden of verzorgers of, indien de leerling meerderjarig is, door de
      leerling aannemelijk wordt gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, vindt de
      toelating plaats met inachtneming van het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27b.2
    text: |-
      De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt
      document dan wel een door een andere school of een school of instelling voor ander onderwijs verstrekt bewijs van
      uitschrijving, waarin de desbetreffende gegevens zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27b
  - number: 27b.3
    text: |-
      Indien door de ouders, voogden of verzorgers of, indien de leerling meerderjarig is, door de leerling aannemelijk
      wordt gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, meldt het bevoegd gezag
      binnen twee weken na het besluit tot toelating aan de Informatie Beheer Groep de beschikbare gegevens van de
      leerling, bedoeld in het eerste lid, alsmede zijn adres en woonplaats.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27b
  - number: 27b.4
    text: |-
      De Informatie Beheer Groep verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het derde lid,
      aan het bevoegd gezag het sociaal-fiscaalnummer van de leerling, dan wel, indien is gebleken dat hem niet van
      overheidswege een sociaal-fiscaalnummer is verstrekt, het onderwijsnummer van de leerling. Het onderwijsnummer is
      een door de Informatie Beheer Groep uitgegeven en aan de leerling toegekend persoonsgebonden nummer.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27b
  - number: 27b.5
    text: Het bevoegd gezag neemt de in het eerste lid bedoelde gegevens op in de leerlingenadministratie van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27b
  - number: 27b.6
    text: |-
      Indien aan een leerling een onderwijsnummer is toegekend en het bevoegd gezag daarna de beschikking krijgt over
      zijn sociaal-fiscaalnummer, neemt het bevoegd gezag dit sociaal-fiscaalnummer terstond als persoonsgebonden nummer
      op in de leerlingenadministratie van de school in de plaats van het onderwijsnummer. Het bevoegd gezag meldt
      deze wijziging binnen twee weken aan de Informatie Beheer Groep onder opgave van het sociaal-fiscaalnummer en het
      onderwijsnummer van de leerling.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel27b
  - number: '28.1'
    text: |-
      Het bevoegd gezag doet onverwijld opgave aan burgemeester en wethouders van de gemeente waar de betrokkene woon- of
      verblijfplaats heeft van de gegevens van degene
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel28
  - number: 28.1.a
    text: |-
      op wie de [Leerplichtwet 1969][ref1] niet meer van toepassing is en die de leeftijd van 23 jaren nog niet heeft
      bereikt,


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 28.1.b
    text: |-
      die niet in het bezit is van een diploma voorbereidend wetenschappelijk
      onderwijs of hoger algemeen voortgezet onderwijs als bedoeld in [artikel 7][ref1]
      onderscheidenlijk [artikel 8][ref2] dan wel een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de Wet educatie en beroepsonderwijs][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 28.1.c
    text: die
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel28
  - number: 28.1.c.1°
    text: |-
      het onderwijs aan de school gedurende een aaneengesloten periode van ten minste een maand of een door het bevoegd
      gezag te bepalen kortere periode zonder geldige reden niet meer volgt, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel28
  - number: 28.1.c.2°
    text: bij de school wordt in- of uitgeschreven of van de school wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel28
  - number: '28.2'
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel28
  - number: '29.1'
    text: |-
      Aan de leerlingen van de scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger algemeen voortgezet
      onderwijs, voor middelbaar algemeen voortgezet onderwijs en voor voorbereidend beroepsonderwijs wordt gelegenheid
      gegeven aan deze scholen een eindexamen af te leggen, tenzij in de plaats daarvan de gelegenheid bestaat tot het
      afleggen van een eindexamen, dat niet vanwege de school wordt afgenomen en het bevoegd gezag in verband hiermede
      een eindexamen aan de school niet nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel29
  - number: '29.2'
    text: |-
      Het eindexamen wordt afgenomen door de rector, de directeur, de conrector, de adjunct-directeur of een of
      meer leden van de centrale directie en leraren van de school onder toezicht, behoudens in nader bij algemene
      maatregel van bestuur te noemen gevallen, van een of meer door de Informatie Beheer Groep, dan wel, voor zover het
      landbouwonderwijs betreft, Onze Minister van Landbouw, Natuurbeheer en Visserij aan te wijzen gecommitteerden. Het
      eindexamen kan mede worden afgenomen door deskundigen. Het bevoegd gezag wijst de deskundigen aan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel29
  - number: '29.3'
    text: |-
      Zij die het eindexamen met goed gevolg hebben afgelegd, ontvangen een diploma. Leerlingen van een school voor
      voorbereidend beroepsonderwijs voor zover het betreft de basisberoepsgerichte leerweg, die met goed gevolg
      een gedeelte van het examenprogramma hebben afgelegd, ontvangen een getuigschrift voorbereidend middelbaar
      beroepsonderwijs. Leerlingen die een school voor praktijkonderwijs verlaten, ontvangen een getuigschrift
      praktijkonderwijs. Onze minister stelt de modellen van diploma's en getuigschriften vast.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel29
  - number: '29.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in dit artikel bedoelde
      eindexamens, alsmede omtrent programma-onderdelen, die niet voor alle leerlingen van een school dezelfde vakken,
      deelvakken en andere programma-onderdelen behoeven te omvatten. Bij deze algemene maatregel van bestuur worden
      tevens de eindexamenprogramma's vastgesteld. De algemene maatregel van bestuur, bedoeld in de vorige volzinnen,
      wordt aan de beide Kamers der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken
      na de overlegging zijn verstreken en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat
      het in die maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel
      zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel29
  - number: '29.5'
    text: |-
      Voor examens, die niet vanwege de school worden afgenomen, kunnen bij algemene maatregel van bestuur voorschriften
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel29
  - number: '29.6'
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs aan een school kan Onze minister toestaan dat wordt
      afgeweken van het bepaalde bij of krachtens dit artikel. Onze minister besluit binnen zes maanden na ontvangst van
      een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze minister de aanvrager
      daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel29
  - number: '30.1'
    text: |-
      Een diploma als bedoeld in [artikel 29, derde lid][ref1], kan ook worden uitgereikt aan degenen die niet als
      leerlingen van een school zijn ingeschreven, maar tot het eindexamen van die school zijn toegelaten en dit met
      gunstig gevolg hebben afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '30.2'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in het eerste lid bedoelde toelating
      tot het eindexamen. Daarbij wordt vastgesteld in welke gevallen een bedrag aan het bevoegd gezag verschuldigd is,
      alsmede de hoogte daarvan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel30
  - number: 30a
    text: |-
      Bij algemene maatregel van bestuur kunnen, in afwijking van de [artikelen 6:7][ref1], [7:10][ref2] en
      [7:24 van de Algemene wet bestuursrecht][ref3], kortere termijnen dan in die artikelen vermeld, worden bepaald voor
      de indiening van een bezwaar- of beroepschrift en voor de daarop te nemen beslissing ter zake van de deelneming
      aan eindexamens.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '31.1'
    text: |-
      De leerling die de school verlaat en aan wie geen diploma kan worden uitgereikt, ontvangt een verklaring waarin
      in ieder geval worden vermeld het tijdstip waarop hij de school verlaat en het leerjaar waartoe hij laatstelijk
      onvoorwaardelijk was bevorderd alsmede voor welke vormen van vervolgonderwijs en voor welke leerjaren daarvan hij
      geschikt wordt geacht. De verklaring wordt door het bevoegd gezag of namens het bevoegd gezag door de rector, de
      directeur, dan wel een of meer leden van de centrale directie, ondertekend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel31
  - number: '31.2'
    text: |-
      Aan een leerling die met goed gevolg het onderwijs als bedoeld in artikel 11f, eerste lid, heeft doorlopen wordt
      een diploma voor het desbetreffende onderwijs uitgereikt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel31
  - number: '31.4'
    text: Onze minister stelt het model van de verklaring vast.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel31
  - number: '32.1'
    text: |-
      Aan een school voor voorbereidend wetenschappelijk onderwijs, algemeen voortgezet onderwijs, voorbereidend
      beroepsonderwijs en praktijkonderwijs zijn een of meer leraren verbonden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32
  - number: '32.2'
    text: |-
      Aan het hoofd van een school voor voorbereidend wetenschappelijk onderwijs staat een rector, aan het hoofd van een
      school voor algemeen voortgezet onderwijs, voorbereidend beroepsonderwijs en praktijkonderwijs een directeur.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32
  - number: '32.3'
    text: |-
      De conrectoren en de adjunct-directeuren hebben tot taak de rector onderscheidenlijk de directeur bij te staan en
      bij afwezigheid te vervangen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32
  - number: '32.4'
    text: |-
      Tot rector, directeur, conrector of adjunct-directeur is slechts benoembaar hij, die met inachtneming van artikel
      33, eerste lid, kan worden benoemd tot leraar in een van de vakken, die aan de school worden onderwezen. Bij
      algemene maatregel van bestuur worden voorschriften vastgesteld omtrent het aantal door de rector, directeur,
      conrector of adjunct-directeur ten minste te geven lessen en, in verband daarmee, omtrent de toepassing van de
      derde volzin. Voor ten hoogste de helft van het aantal personeelsleden, bestaande uit de rector of de directeur
      en de aan de school verbonden conrectoren of adjunct-directeuren, kan het bevoegd gezag afwijken van de eerste
      volzin, met uitzondering van het vereiste van de in artikel 33, eerste lid, onder a, bedoelde verklaring omtrent
      het gedrag, mits daarbij de voorschriften, bedoeld in de tweede volzin, in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32
  - number: '32.5'
    text: |-
      Het overige personeel heeft tot taak het onderwijs te ondersteunen. Bij benoeming van een lid van het overige
      personeel is artikel 33, eerste lid, aanhef en onder a, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32
  - number: '32.6'
    text: Een of meer leden van het personeel worden belast met de taak van schooldecaan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32
  - number: '32.7'
    text: |-
      Het tweede en derde lid, en het vierde lid met uitzondering van het vereiste van de in artikel 33, eerste lid,
      onder a, bedoelde verklaring omtrent het gedrag, zijn niet van toepassing op de leden van de centrale directie,
      bedoeld in artikel 32a, eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32
  - number: '32.8'
    text: |-
      Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van de verschillende categorieën
      personeel van de school. Het bevoegd gezag bepaalt, zoveel mogelijk tegelijk met de vaststelling van het in de
      eerste volzin bedoelde beleid met betrekking tot de formatie, functies en taken van het personeel van de school,
      met inachtneming van de daaromtrent bij algemene maatregel van bestuur te geven nadere voorschriften.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32
  - number: '32.9'
    text: |-
      Voor de toepassing van deze paragraaf wordt onder «vakken» tevens verstaan, programma-onderdelen als bedoeld in de
      artikelen 13 en 14.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32
  - number: 32a.1
    text: |-
      Aan het hoofd van een school die aan bij algemene maatregel van bestuur te vermelden voorwaarden voldoet, kan het
      bevoegd gezag een centrale directie plaatsen bestaande uit ten hoogste vijf leden, waarvan er een door hem wordt
      benoemd tot voorzitter. De formatie van de centrale directie omvat ten hoogste drie volledige formatieplaatsen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32a
  - number: 32a.2
    text: |-
      De centrale directie heeft in naam van het bevoegd gezag de leiding van de voorbereiding en de uitvoering van het
      beleid van de school, alsmede de coördinatie van de dagelijkse gang van zaken en van het beheer van de school.
      Indien toepassing is gegeven aan artikel 32b, is de centrale directie tevens met de daar bedoelde taken en
      bevoegdheden belast.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32a
  - number: 32b
    text: |-
      Het bevoegd gezag van een school als bedoeld in [artikel 32a, eerste lid][ref1], kan bepalen dat hem bij wettelijk
      voorschrift toekomende taken en bevoegdheden in naam van het bevoegd gezag worden uitgeoefend door de centrale
      directie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 32c.1
    text: Het bevoegd gezag van een school stelt een directiestatuut vast.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32c
  - number: 32c.2
    text: |-
      Het directiestatuut bevat in ieder geval de aanduiding van de aan het bevoegd gezag bij wettelijk voorschrift
      toegekende taken en bevoegdheden waarvan het bevoegd gezag heeft bepaald dat de rector, de directeur, de conrector,
      de adjunct-directeur of de centrale directie van de school deze in naam van het bevoegd gezag kan uitoefenen. Het
      directiestatuut bevat voorts instructies ten aanzien van deze taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32c
  - number: 32c.3
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een exemplaar van het directiestatuut in het gebouw van de school ter
      inzage wordt gelegd op een voor een ieder toegankelijke plaats. Het bevoegd gezag zendt een exemplaar van het
      directiestatuut, alsmede elke wijziging daarvan, zo spoedig mogelijk na de vaststelling ter kennisneming aan de
      inspectie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32c
  - number: 32d.1
    text: |-
      Het bevoegd gezag stelt ten behoeve van de directie van elk van zijn scholen, indien daaraan van een
      ondervertegenwoordiging van vrouwen in de directie sprake is, eenmaal in de 4 jaar een document inzake evenredige
      vertegenwoordiging van vrouwen in de schoolleiding vast.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32d
  - number: 32d.2
    text: |-
      Het document bevat streefcijfers, met inbegrip van een bepaald tijdvak waarbinnen deze streefcijfers worden
      gerealiseerd, aan de hand waarvan door het bevoegd gezag een beleid inzake evenredige vertegenwoordiging van
      vrouwen in de schoolleiding wordt gevoerd, opdat in de directie van elke school van het bevoegd gezag vrouwen
      en mannen naar evenredigheid werkzaam zullen zijn. Voor de evenredige vertegenwoordiging wordt uitgegaan van de
      verhouding mannen en vrouwen voor wat betreft het onderwijzend personeel dat werkzaam is in het door de school
      verzorgde onderwijs, zoals die blijkt uit de daarover jaarlijks door Onze minister gepubliceerde cijfers. Het
      document vermeldt tevens de maatregelen die het bevoegd gezag heeft genomen en zal nemen teneinde de in de eerste
      volzin bedoelde streefcijfers te realiseren en geeft een overzicht van de beoogde en bereikte resultaten van het
      beleid inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding gedurende de periode waarvoor het
      document geldt, onderscheidenlijk de periode waarvoor het vorige document gold.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32d
  - number: 32d.3
    text: |-
      Indien door het bevoegd gezag aan het hoofd van de school een centrale directie wordt geplaatst en vrouwen daarin
      zijn ondervertegenwoordigd, stelt het bevoegd gezag overeenkomstig het bepaalde in het eerste en tweede lid tevens
      een document inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding ten behoeve van de centrale
      directie vast.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32d
  - number: 32d.4
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een exemplaar van het document, bedoeld in het eerste en derde lid,
      in het gebouw van de school ter inzage wordt gelegd op een voor het personeel, de ouders en de leerlingen
      toegankelijke plaats, alsmede dat een exemplaar wordt bewaard bij de administratie van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel32d
  - number: '33.1'
    text: |-
      Tot leraar aan een school voor voorbereidend wetenschappelijk onderwijs, algemeen voortgezet onderwijs,
      voorbereidend beroepsonderwijs en praktijkonderwijs kan slechts worden benoemd hij, die in het bezit is van:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
  - number: 33.1.a
    text: |-
      een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref1] (Stb. 1955, 395), die op het
      tijdstip van overlegging aan het bevoegd gezag niet ouder is dan 6 maanden;


      [ref1]: https://wetten.overheid.nl/BWBR0002195
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002195
  - number: 33.1.b
    text: een bewijs van bekwaamheid voor het door hem aan die school te geven onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
  - number: 33.1.c
    text: |-
      een bewijs van voldoende pedagogische en didactische voorbereiding, voor zover aangewezen bij algemene maatregel
      van bestuur;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
  - number: 33.1.d
    text: |-
      in plaats van een bewijs als bedoeld onder b en een bewijs als bedoeld onder c gezamenlijk,
      een ten aanzien van het door hem te geven onderwijs afgegeven EG-verklaring als
      bedoeld in de [Algemene wet erkenning EG-hoger-onderwijsdiploma's][ref1] dan wel in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref2]; en die niet krachtens rechterlijke uitspraak van het geven
      van onderwijs is uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0006317
      [ref2]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006317
      - id: ref2
        bwb_id: BWBR0006781
  - number: '33.2'
    text: |-
      In bijzondere gevallen kan Onze minister aan personen, die in een bepaald vak of onderdeel van een vak door
      buitengewone bekwaamheid uitmunten, ten aanzien van dit vak of dit onderdeel ontheffing verlenen van de in het
      eerste lid onder b en c gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
  - number: '33.3'
    text: |-
      Bij tijdelijke afwezigheid van een leraar kan ten aanzien van degene, die hem vervangt, telkens voor ten hoogste
      een jaar worden afgeweken van de eisen van benoembaarheid, gesteld in het eerste lid onder b en c. Indien in een
      vacature niet terstond kan worden voorzien door de benoeming van een leraar, die aan de genoemde eisen voldoet, is
      het bepaalde in de vorige volzin van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
  - number: '33.4'
    text: |-
      In het eerste leerjaar van een school voor voorbereidend wetenschappelijk onderwijs, voor algemeen voortgezet
      onderwijs, voor voorbereidend beroepsonderwijs, of voor praktijkonderwijs kan een leraar, die daartoe naar het
      oordeel van het bevoegd gezag bekwaam is, ook onderwijs geven in andere vakken dan die, waarvoor het in zijn bezit
      zijnde bewijs van bekwaamheid, bedoeld in het eerste lid onder b, geldt. In bijzondere gevallen kan het bepaalde in
      de vorige volzin eveneens toepassing vinden ten aanzien van een leraar in het tweede leerjaar van een daarbedoelde
      school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
  - number: '33.5'
    text: |-
      In de gevallen, bedoeld in het derde en vierde lid, is, voorzover niet bij de algemene maatregel van bestuur,
      bedoeld in artikel 35a, anders is bepaald, de toestemming van de inspectie vereist. Tegen de weigering van de
      toestemming kan het bevoegd gezag een voorziening vragen bij Onze minister. Het vragen van voorziening wordt
      gelijkgesteld met het instellen van administratief beroep.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
  - number: '33.6'
    text: |-
      Het eerste lid onder b en c is niet van toepassing op een leraar, in zoverre deze belast is met het geven van
      godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
  - number: '33.7'
    text: |-
      Het eerste lid is niet van toepassing op een leraar, in zoverre deze belast is met het verrichten van werkzaamheden
      in verband met contractactiviteiten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
  - number: '33.8'
    text: |-
      Bij algemene maatregel van bestuur worden ten aanzien van leraren die in vaste dienst zijn verbonden aan een
      school, bedoeld in de artikelen 7, 8, 9, 10a en 10f, regelen gesteld omtrent de gronden waarop en de procedure
      volgens welke kan worden afgeweken van het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
  - number: '33.9'
    text: 'Onverminderd het derde, vierde en achtste lid en artikel 35a kan ten aanzien van studenten die:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
  - number: 33.9.a
    text: |-
      een duale opleiding volgen als bedoeld in
      [artikel 7.7 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], en aan die opleiding ten
      minste 126 studiepunten hebben behaald, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 33.9.b
    text: |-
      een duale opleiding volgen als bedoeld in [artikel 7.7a van die wet][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '33.12'
    text: |-
      Het negende lid is, behoudens de eis van verblijf in het laatste jaar van de opleiding, van overeenkomstige
      toepassing ten aanzien van studenten van een universitaire lerarenopleiding, met dien verstande dat afwijking bij
      de voltijdse vorm van die opleiding mogelijk is voor ten hoogste de periode van een schooljaar waarin onderwijs
      wordt gegeven, en bij de deeltijdse vorm van die opleiding voor ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
  - number: '33.13'
    text: |-
      Bij algemene maatregel van bestuur kunnen, zo nodig afwijkende, regels worden gesteld met betrekking tot de
      toepassing van het eerste lid ten aanzien van het verzorgen van door het bevoegd gezag vastgestelde vakken en
      andere programma-onderdelen, behoudens godsdienstonderwijs en levensbeschouwelijk vormingsonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel33
  - number: '34.1'
    text: |-
      De bewijzen van bekwaamheid, bedoeld in [artikel 33, eerste lid onder b][ref1], worden onderscheiden in bewijzen
      van bekwaamheid van de eerste en van de tweede graad.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '34.2'
    text: |-
      De bewijzen van bekwaamheid worden aangewezen bij algemene maatregel van bestuur. Bij de aanwijzing worden de graad
      van het bewijs van bekwaamheid en het vak of de combinatie van vakken waarvoor het bewijs van bekwaamheid geldt,
      vermeld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel34
  - number: '34.3'
    text: |-
      Aan de aanwijzing, bedoeld in het tweede lid, kunnen voorwaarden met betrekking tot de inhoud van de gevolgde
      studie en de opgedane praktijkervaring worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel34
  - number: '34.4'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het tweede lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken, en
      gedurende die termijn niet door of namens de Kamer de wens wordt te kennen gegeven tot overleg over het onderwerp.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel34
  - number: '35.1'
    text: |-
      Het bezit van een bewijs van bekwaamheid van de eerste graad voor het desbetreffende vak of de combinatie van
      vakken is vereist voor het geven van onderwijs in de hoogste drie leerjaren van scholen voor voorbereidend
      wetenschappelijk onderwijs, in de hoogste twee leerjaren van scholen voor hoger algemeen voortgezet onderwijs, in
      afdelingen, als bedoeld in [artikel 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '35.2'
    text: |-
      Het bezit van een bewijs van bekwaamheid van de tweede graad voor het desbetreffende vak of de combinatie van
      vakken is vereist voor het geven van onderwijs in de laagste drie leerjaren van scholen voor voorbereidend
      wetenschappelijk onderwijs en van scholen voor hoger algemeen voortgezet onderwijs, aan scholen voor
      middelbaar algemeen voortgezet onderwijs, aan scholen voor voorbereidend beroepsonderwijs en aan scholen voor
      praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel35
  - number: '35.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de vereisten voor het geven van
      onderwijs aan daarbij aan te geven schoolsoorten en in daarbij aan te geven vakken of combinaties van vakken,
      waarbij van het bepaalde in het eerste en tweede lid wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel35
  - number: '35.4'
    text: |-
      Een bewijs van bekwaamheid van de eerste graad geldt tevens als bewijs van bekwaamheid van de tweede graad voor
      het vak of de combinaties van vakken, waarop dat bewijs van bekwaamheid betrekking heeft, en voor bij algemene
      maatregel van bestuur aan te wijzen andere vakken of combinaties van vakken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel35
  - number: '35.5'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het derde en vierde lid, wordt aan de Tweede Kamer der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na overlegging zijn verstreken, en
      gedurende die termijn niet door of namens de Kamer de wens wordt te kennen gegeven tot overleg over het onderwerp.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel35
  - number: 35a
    text: |-
      Volgens regelen, te stellen bij algemene maatregel van bestuur kunnen in bijzondere gevallen, in afwijking van
      de eisen van benoembaarheid, gesteld in artikel 33, eerste lid onder b en c, leraren die in het bezit zijn of
      worden geacht in het bezit te zijn van een bewijs van bekwaamheid van de tweede graad en van een bewijs als
      bedoeld in artikel 33, eerste lid onder c, tot een bepaald aantal lessen tijdelijk tevens onderwijs geven in het
      desbetreffende vak of de combinatie van vakken aan de scholen of leerjaren van scholen, waarvoor het bezit van een
      bewijs van bekwaamheid van de eerste graad is vereist. In de gevallen bedoeld in de eerste volzin, is melding aan
      de inspectie vereist.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel35a
  - number: '36.1'
    text: |-
      Volgens regelen, te stellen bij algemene maatregel van bestuur kan Onze minister verklaren, dat een leraar wordt
      geacht in het bezit te zijn van een bewijs van bekwaamheid van de eerste of de tweede graad tot het geven van
      voortgezet onderwijs in vakken, waarvoor geen bewijzen van bekwaamheid zijn aangewezen, en van een bewijs als
      bedoeld in artikel 33, eerste lid onder c.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel36
  - number: '36.2'
    text: |-
      De algemene maatregel van bestuur bedoeld in het eerste lid wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken, en
      gedurende die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend. Het bepaalde in de vorige drie volzinnen is niet van toepassing, indien het ontwerp van de algemene
      maatregel van bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van
      de procedure, bedoeld in de eerste drie volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel36
  - number: '37'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld voor de verkrijging van de bewijzen van
      voldoende pedagogische en didactische voorbereiding, bedoeld in [artikel 33, eerste lid onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 37f
    text: |-
      Ten behoeve van een scholengemeenschap als bedoeld in [artikel 19][ref1], worden bij algemene maatregel van bestuur
      voorschriften vastgesteld met betrekking tot de toepassing van de [artikelen 32 tot en met 37][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel32
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel37f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '19'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '32'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 38a.1
    text: |-
      Met inachtneming van bij of krachtens algemene maatregel van bestuur vastgestelde voorschriften als bedoeld in het
      tweede en derde lid regelt het bevoegd gezag van een openbare school de rechtspositie van het personeel en draagt
      het bevoegd gezag van een bijzondere school zorg voor de regeling van de rechtspositie van het personeel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel38a
  - number: 38a.2
    text: |-
      Bij algemene maatregel van bestuur onderscheidenlijk bij of krachtens algemene maatregel van bestuur worden
      voorschriften vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel38a
  - number: 38a.2.a
    text: |-
      salarisschalen en uitgangspunten waaraan een door het bevoegd gezag in te richten functiewaarderingssysteem moet
      voldoen, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel38a
  - number: 38a.2.b
    text: |-
      rechten en plichten van het personeel en het bevoegd gezag bij ziekte, bevalling, zwangerschap,
      arbeidsongeschiktheid en ontslag, dan wel met betrekking tot bedrijfsgezondheidskundige begeleiding, voor zover
      deze bij wet voorgeschreven rechten en verplichtingen te boven gaan, dan wel de voorwaarden waaronder het bevoegd
      gezag deze rechten en plichten zelf regelt of voor de regeling daarvan zorg draagt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel38a
  - number: 38a.3
    text: Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld betreffende algemene arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel38a
  - number: 38a.4
    text: |-
      Onder regeling van de rechtspositie als bedoeld in het eerste lid wordt tevens begrepen het vaststellen van
      bepalingen inzake aanstelling, benoeming, schorsing, disciplinaire maatregelen en ontslag van personeel. De
      bepalingen omtrent ontslag mogen het personeel van de openbare scholen niet minder rechten verschaffen dan die
      welke voor werknemers met een arbeidsovereenkomst voortvloeien uit de bepalingen van dwingend recht van de [zevende
      titel A van boek 7A van het Burgerlijk Wetboek](onbekend).
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel38a
  - number: '39'
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat de rector, de directeur, de conrectoren, de adjunct-directeuren, de
      leden van de centrale directie, de leraren en het overige personeel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39
  - number: 39a.1
    text: |-
      Het bevoegd gezag benoemt de rector, de directeur, de conrector en de adjunct-directeur, de centrale directie, de
      leraren en het overige personeel, bedoeld in [artikel 39][ref1], in algemene dienst van het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel39
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '39'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 39a.2
    text: |-
      Onder benoeming in algemene dienst van het bevoegd gezag wordt in dit artikel en in de [artikelen 43a][ref1] en
      [51][ref2] verstaan een benoeming ten behoeve van het verrichten van werkzaamheden aan door het bevoegd gezag in
      stand gehouden scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel51
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 43a
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '51'
        hoofdstuk: III
        afdeling: I
  - number: 39c.1
    text: |-
      Het bevoegd gezag is verplicht aan studenten die in opleiding zijn voor een functie in het voortgezet onderwijs,
      in de educatie of het beroepsonderwijs, bedoeld in de [Wet educatie en beroepsonderwijs][ref1], in het hoger
      beroepsonderwijs of in het basisonderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste
      ervaring in de school te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39c
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 39c.2
    text: |-
      De verplichting, bedoeld in het eerste lid, betreft studenten die zijn ingeschreven voor een opleiding voor het
      beroep van leraar waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, of
      anderszins studeren voor een bewijs van voldoende pedagogische en didactische voorbereiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39c
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 39c.3
    text: |-
      Het in uren uitgedrukte aantal lessen en onderdelen van het in schooltijd verzorgd onderwijsprogramma waarvoor het
      bevoegd gezag in enig schooljaar verplicht is, studenten als bedoeld in het eerste lid tot de school toe te laten,
      bedraagt gezamenlijk 5 procent van het in uren uitgedrukte totale aantal in dat schooljaar te geven lessen en te
      verzorgen onderdelen van het in schooltijd verzorgd onderwijsprogramma. Onze minister kan het percentage lager
      stellen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39c
  - number: 39c.4
    text: |-
      Een bevoegd gezag kan een student de verdere toegang tot de school ontzeggen, indien deze in de school in strijd
      handelt met de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot
      de school wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van de
      betrokken opleidingsinstelling dan wel aan de betrokken staatsexamencommissie, en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39c
  - number: 39c.5
    text: |-
      De rector of de directeur dan wel de centrale directie regelt, onder verantwoordelijkheid van het bevoegd gezag,
      de werkzaamheden in verband met de begeleiding door de leraren van de studenten in de school in overeenstemming
      met de leraren, alsmede in overeenstemming met de betrokken opleidingsinstellingen, dan wel, indien het betreft
      studenten die zich voorbereiden op het afleggen van een staatsexamen ter verkrijging van een bewijs van bekwaamheid
      of een bewijs van voldoende pedagogische en didactische voorbereiding, in overeenstemming met de betrokken
      staatsexamencommissie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39c
  - number: 39c.6
    text: |-
      Onze minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor een schooljaar.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39c
  - number: 39c.7
    text: |-
      De scholen waarop studenten als bedoeld in het eerste lid, zijn toegelaten, zijn toegankelijk voor de inspectie
      belast met het toezicht op de opleidingsinstellingen, voor de directieleden en de door deze aan te wijzen docenten
      van die opleidingsinstellingen, alsmede voor de leden van de betrokken staatsexamencommissies, een en ander voor
      zover zulks voor de uitoefening van het toezicht op de praktische vorming onderscheidenlijk de begeleiding van de
      praktische vorming van de in de school aanwezige studenten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39c
  - number: 39c.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden in verband met het bepaalde in dit artikel nadere
      voorschriften gegeven, betreffende de navolgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39c
  - number: 39c.8.a
    text: |-
      het maximum aantal lessen in een vak van een schoolsoort, gedurende dewelke het bevoegd gezag in enig schooljaar
      verplicht is studenten als bedoeld in het eerste lid, toe te laten, welk maximum de 20 procent niet te boven mag
      gaan;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39c
  - number: 39c.8.b
    text: |-
      het maximum aantal studenten als bedoeld in het eerste lid, dat bij dezelfde les kan worden toegelaten, welk
      maximum, behoudens bijzondere omstandigheden, de 3 niet te boven mag gaan, alsmede de gevolgen die het toelaten van
      meer dan een student bij dezelfde les heeft voor het maximum, bedoeld in het derde lid, en het maximum, bedoeld in
      dit lid onder a.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39c
  - number: 39c.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in verband met het bepaalde in dit artikel nadere
      voorschriften worden gegeven, betreffende de navolgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39c
  - number: 39c.9.a
    text: |-
      de wijze van aanmelden van studenten als bedoeld in het eerste lid, alsmede de termijn die voor de aanmelding door
      het bevoegd gezag mag worden gesteld;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39c
  - number: 39c.9.b
    text: |-
      de wijze waarop door de school bekendheid moet worden gegeven aan opleidingsinstellingen en staatsexamencommissies
      over de beschikbaarheid en de aard van schoolpracticumplaatsen;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39c
  - number: 39c.9.c
    text: de categorieën studenten ten aanzien van wie de verplichting, bedoeld in het eerste lid, niet geldt;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39c
  - number: 39c.9.d
    text: |-
      regulering in de situatie dat, bij een beperkte beschikbaarheid van schoolpracticumplaatsen aan de school,
      gelijktijdig studenten die in opleiding zijn voor een functie in het voortgezet onderwijs, en studenten die in
      opleiding zijn voor een functie in het basisonderwijs, worden aangemeld;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39c
  - number: 39c.9.e
    text: |-
      de vakken en andere programma-onderdelen van een schoolsoort, waarvoor in verband met de geringe omvang van het
      onderwijs daarin, de in het eerste lid bedoelde verplichting niet geldt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel39c
  - number: '40'
    text: |-
      Over aangelegenheden van algemeen belang voor de rechtstoestand van het personeel wordt volgens bij
      algemene maatregel van bestuur te stellen regels overleg gevoerd met de daarvoor in aanmerking komende
      personeelsorganisaties en, voor zover zij daarbij belang hebben, organisaties van gemeente- en schoolbesturen.
      De algemene maatregel van bestuur bepaalt tevens de gevallen waarin in dat overleg overeenstemming met de
      personeelsorganisaties dient te worden bereikt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel40
  - number: 40a
    text: |-
      Over de regelingen, bedoeld in artikel 38a, eerste en vierde lid, alsmede over andere aangelegenheden van
      algemeen belang voor de bijzondere rechtstoestand van het personeel van de desbetreffende school, wordt door of
      namens het bevoegd gezag overleg gevoerd met de daarvoor in aanmerking komende vakorganisaties van overheids- en
      onderwijspersoneel, op een met deze schriftelijk overeengekomen wijze. In geval van een geschil over de deelneming
      aan het overleg, bedoeld in de eerste volzin, alsmede in geval van een geschil over de aard, de inhoud en de
      organisatie van het overleg leggen de betrokken partijen het geschil voor aan een geschillencommissie. Deze
      geschillencommissie bestaat uit drie personen, die door de partijen gezamenlijk worden aangewezen. De uitspraak van
      de geschillencommissie heeft bindende kracht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel40a
  - number: '41'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het verrichten van contractactiviteiten er niet toe leidt dat minder dan
      51% van de personeelskosten van de school uit 's Rijks kas wordt bekostigd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel41
  - number: '42.1'
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de leerlingen met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving, en met onderkenning
      van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42
  - number: '42.2'
    text: Openbare scholen zijn toegankelijk voor leerlingen zonder onderscheid naar godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42
  - number: '42.3'
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42
  - number: 42a.1
    text: |-
      Een gemeenteraad kan bij verordening een openbare rechtspersoon instellen die tot doel heeft een of meer
      openbare scholen in de gemeente in stand te houden, al dan niet te zamen met openbare scholen als bedoeld in de
      [Wet op het primair onderwijs][ref1], openbare scholen als bedoeld in de [Wet op de expertisecentra][ref2] of
      openbare scholen als bedoeld in deel II van de Wet op het voortgezet onderwijs. Een openbare rechtspersoon kan
      ook worden ingesteld door meer dan een gemeente ten behoeve van het in stand houden van openbare scholen in die
      gemeenten door het vaststellen van een voor wat betreft de onderwerpen, bedoeld in het vierde lid, gelijkluidende
      verordening, in welk geval de openbare rechtspersoon niet eerder tot stand komt dan nadat alle daartoe strekkende
      verordeningen in werking zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: 42a.2
    text: De gemeenteraad of gemeenteraden maken het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42a
  - number: 42a.3
    text: |-
      De openbare rechtspersoon oefent met uitzondering van de besluitvorming over de opheffing van een openbare school
      alle taken en bevoegdheden uit van het bevoegd gezag. Hij bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42a
  - number: 42a.4
    text: 'De verordening, bedoeld in het eerste lid, voorziet in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42a
  - number: 42a.4.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42a
  - number: 42a.4.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte, doch
      geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42a
  - number: 42a.4.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42a
  - number: 42a.4.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42a
  - number: 42a.4.e
    text: de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42a
  - number: 42a.4.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42a
  - number: 42a.4.g
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt, met dien verstande dat in de regeling een overheersende invloed van de overheid in het
      bestuur is verzekerd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42a
  - number: 42a.5
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42a
  - number: 42a.6
    text: |-
      De vergaderingen van het bestuur van de openbare rechtspersoon zijn openbaar, tenzij het bestuur anders beslist, op
      gronden, vermeld in de verordening.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42a
  - number: 42a.7
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42a
  - number: 42a.8
    text: |-
      De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren
      in strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de openbare rechtspersoon
      te ontbinden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42a
  - number: 42b.1
    text: |-
      Een gemeenteraad kan besluiten dat een of meer openbare scholen in de gemeente in stand worden gehouden
      door een stichting die zich ten doel stelt het in stand houden van een of meer openbare scholen, al dan
      niet te zamen met openbare scholen als bedoeld in deel II van deze wet of openbare scholen als bedoeld in de
      [Wet op het primair onderwijs][ref1] of de [Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: 42b.2
    text: De gemeenteraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.3
    text: |-
      Een stichting die een openbare school in stand houdt, wordt opgericht door een of meer gemeenten, al dan niet te
      zamen met een of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.4
    text: Het statutaire doel van de stichting is uitsluitend het geven van openbaar onderwijs overeenkomstig artikel 42.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.5
    text: |-
      De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken en
      bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.6
    text: 'Onverminderd het vierde lid, voorzien de statuten in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.6.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.6.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte, doch
      geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.6.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.6.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.6.e
    text: de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.6.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.6.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.6.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.7
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de desbetreffende gemeenteraad of
      gemeenteraden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.8
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.9
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.10
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.11
    text: |-
      De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren in
      strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de stichting te ontbinden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
  - number: 42b.12
    text: |-
      [Artikel 155 van de Gemeentewet][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel155
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '155'
  - number: 42c.1
    text: |-
      Een rechtspersoon die een openbare school in stand houdt, kan de instandhouding van die school overdragen aan een
      andere rechtspersoon die tot de instandhouding van een openbare school bevoegd is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42c
  - number: 42c.2
    text: |-
      De overdracht geschiedt bij notariële akte. Bij deze akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van gebouwen, terreinen en roerende zaken over te dragen. Deze akte geldt tevens als akte van
      levering, bedoeld in [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1]. In de akte wordt tevens bepaald dat
      de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen aanstelt met ingang van de datum
      van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42c
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: 42c.3
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger, onverminderd hetgeen verder voor de
      overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42c
  - number: 42c.4
    text: |-
      Voor zover het betreft scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen
      voortgezet onderwijs, voor voorbereidend beroepsonderwijs en voor praktijkonderwijs kan de gemeenteraad in
      bijzondere omstandigheden ontheffing verlenen van de verplichting tot overdracht van de rechten ten aanzien van
      gebouwen, terreinen en roerende zaken. Voor zover het betreft andere vormen van voortgezet onderwijs als bedoeld in
      afdeling IV van dit deel kan Onze minister in bijzondere omstandigheden ontheffing verlenen van de verplichting tot
      overdracht van de rechten ten aanzien van gebouwen, terreinen en roerende zaken. Onze Minister besluit binnen zes
      maanden na ontvangst van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze
      Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan
      worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel42c
  - number: '43'
    text: |-
      In afwijking van [artikel 39][ref1] leggen Gedeputeerde Staten van de desbetreffende provincie de disciplinaire
      straf of de schorsing op of verlenen zij het ontslag, indien het betreft een rector, een directeur, een conrector,
      een adjunct-directeur, een lid van de centrale directie of een leraar van een openbare school, die tevens lid van
      de raad der gemeente is, welke die school in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel39
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '39'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 43a.1
    text: |-
      De rector, de directeur, de conrectoren, de adjunct-directeuren, de leden van de centrale directie, de leraren en
      het overige personeel, bedoeld in artikel 38a, van de openbare school, zijn in het bezit van een door het bevoegd
      gezag getekende akte van aanstelling. De akte van aanstelling bevat ten minste:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel43a
  - number: 43a.1.a
    text: de naam en het adres van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel43a
  - number: 43a.1.b
    text: de naam, de voornamen en de geboortedatum van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel43a
  - number: 43a.1.c
    text: de datum van ingang van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel43a
  - number: 43a.1.d
    text: de functie waarin de betrokkene wordt aangesteld;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel43a
  - number: 43a.1.e
    text: |-
      de bepaling of de aanstelling in vaste of in tijdelijke dienst geschiedt en in het laatste geval de gronden voor de
      tijdelijkheid en de duur van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel43a
  - number: 43a.1.f
    text: de omvang van de betrekking;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel43a
  - number: 43a.1.g
    text: de op de dag van zijn aanstelling van toepassing zijnde schaal en het salarisnummer;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel43a
  - number: 43a.1.h
    text: de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel43a
  - number: 43a.2
    text: |-
      Het bevoegd gezag draagt zorg dat afschriften van de bewijzen van bekwaamheid, van de verklaringen omtrent het
      gedrag, alsmede van de akte van aanstelling van het aan de school verbonden personeel worden bewaard.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel43a
  - number: '44.1'
    text: Het onderwijs aan openbare scholen wordt gegeven met eerbiediging van ieders geloofs- of levensovertuiging.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel44
  - number: '44.2'
    text: |-
      Wij kunnen hem, die zich in dit opzicht aan plichtsverzuim schuldig maakt, voor ten hoogste een jaar en bij
      herhaling voor onbepaalde tijd in zijn bevoegdheid tot het geven van onderwijs aan een openbare school schorsen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel44
  - number: '46.1'
    text: |-
      Aan de openbare scholen worden op verzoek van kerkelijke gemeenten of van plaatselijke kerken de leerlingen in
      de gelegenheid gesteld in de schoollokalen godsdienstonderwijs te volgen van godsdienstleraren, daartoe door die
      gemeenten of kerken aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel46
  - number: '46.2'
    text: De schoollokalen worden, zo nodig verwarmd en verlicht, kosteloos voor het godsdienstonderwijs beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel46
  - number: '46.3'
    text: |-
      Bij een geschil omtrent het vaststellen van lessen of het beschikbaar stellen van lokalen van openbare scholen
      beslist Onze minister.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel46
  - number: '46.4'
    text: |-
      Aan de kerkelijke gemeenten of de plaatselijke kerken kan een subsidie worden verstrekt. De
      [artikelen 4 tot en met 19 van de Wet overige OCenW-subsidies][ref1] zijn van toepassing, met dien verstande dat de
      subsidie slechts kan worden verstrekt bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '46.5'
    text: |-
      Voor de toepassing van dit artikel worden met kerkelijke gemeenten gelijkgesteld verenigingen met volledige
      rechtsbevoegdheid, die zich blijkens de statuten het geven of doen geven van godsdienstonderwijs ten doel stellen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel46
  - number: '47.1'
    text: |-
      Aan de openbare scholen worden op verzoek van door Ons tot dit doel toegelaten genootschappen op geestelijke
      grondslag de leerlingen, wier ouders, voogden of verzorgers daartoe de wens te kennen geven, in de gelegenheid
      gesteld in de schoollokalen levensbeschouwelijk vormingsonderwijs te volgen van leraren, daartoe door deze
      genootschappen aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel47
  - number: '47.2'
    text: De schoollokalen worden, zo nodig verwarmd en verlicht, kosteloos voor het vormingsonderwijs beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel47
  - number: '47.3'
    text: |-
      Bij een geschil omtrent het vaststellen van lessen of het beschikbaar stellen van lokalen van openbare scholen
      beslist Onze minister.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel47
  - number: '47.4'
    text: |-
      Aan de genootschappen, bedoeld in het eerste lid, kan een subsidie worden verstrekt. De
      [artikelen 4 tot en met 19 van de Wet overige OCenW-subsidies][ref1] zijn van toepassing, met dien verstande dat de
      subsidie slechts kan worden verstrekt bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '48.1'
    text: |-
      Indien binnen redelijke afstand van de woning van de leerling niet de gelegenheid bestaat tot het volgen van het
      onderwijs aan een openbare school, mag aan deze leerling de toegang tot een gelijksoortige, uit de openbare kas
      bekostigde bijzondere school niet worden geweigerd op grond van levensbeschouwing, tenzij de school uitsluitend
      bestemd is voor interne leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel48
  - number: '48.2'
    text: |-
      Indien tot een bijzondere school ingevolge het eerste lid andere leerlingen worden toegelaten dan voor wie de
      school in verband met de levensbeschouwing wordt in stand gehouden, kunnen deze leerlingen niet worden verplicht
      tot het volgen van de lessen in de vakken of andere programma-onderdelen, die in verband met die levensbeschouwing
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel48
  - number: 48a
    text: |-
      Indien het bevoegd gezag van een bijzondere school aan de Informatie Beheer Groep de mededeling heeft gedaan,
      bedoeld in [artikel 27a, vijfde lid][ref1], kan de leerling binnen 6 weken na ontvangst van de gegevens, bedoeld in
      [artikel 27a, zevende lid][ref2], bij het bevoegd gezag schriftelijk bedenkingen uiten tegen die mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel27a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 27a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 27a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '49.1'
    text: |-
      De bijzondere school staat onder het bestuur van een rechtspersoon met volledige rechtsbevoegdheid die zich het
      geven van onderwijs in de zin van dit deel ten doel stelt zonder daarbij het maken van winst te beogen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel49
  - number: '49.2'
    text: Het schoolbestuur draagt zorg voor een deskundig beheer.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel49
  - number: '50.1'
    text: |-
      De rechtspersoon die een bijzondere school in stand houdt, kan de instandhouding van die school overdragen aan een
      andere rechtspersoon die voldoet aan het bepaalde in artikel 49, eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel50
  - number: '50.2'
    text: |-
      De overdracht geschiedt bij notariële akte. Bij deze akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van gebouwen, terreinen en roerende zaken over te dragen. Deze akte geldt tevens als akte van
      levering, bedoeld in [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1]. In de akte wordt tevens bepaald dat
      de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen benoemt met ingang van de datum
      van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: '50.3'
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid treedt de verkrijgende rechtspersoon in alle uit de
      wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de school, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel50
  - number: '50.4'
    text: |-
      Voor zover het betreft scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen
      voortgezet onderwijs en voor voorbereidend beroepsonderwijs kan de gemeenteraad in bijzondere omstandigheden
      ontheffing verlenen van de verplichting tot overdracht van de rechten ten aanzien van gebouwen, terreinen en
      roerende zaken. Voor zover het betreft andere vormen van voortgezet onderwijs als bedoeld in afdeling IV van dit
      deel kan Onze minister in bijzondere omstandigheden ontheffing verlenen van de verplichting tot overdracht van
      de rechten ten aanzien van gebouwen, terreinen en roerende zaken. Onze Minister besluit binnen zes maanden na
      ontvangst van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister
      de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel50
  - number: '50.5'
    text: |-
      Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1] van een rechtspersoon
      die een school in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende rechtspersoon de
      school in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de school overgaat. In het
      laatste geval zijn het tweede tot en met vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
  - number: '51.1'
    text: |-
      De rector, de directeur, de conrectoren, de adjunct-directeuren, de leden van de centrale directie, de leraren en
      het overige personeel, bedoeld in artikel 38a, van de bijzondere school zijn in het bezit van een door het bevoegd
      gezag en door henzelf getekende akte van benoeming. Deze akte van benoeming bevat ten minste:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel51
  - number: 51.1.a
    text: de naam en het adres van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel51
  - number: 51.1.b
    text: de naam, de voornamen en de geboortedatum van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel51
  - number: 51.1.c
    text: de datum van ingang van de benoeming;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel51
  - number: 51.1.d
    text: de functie waarin de betrokkene wordt benoemd;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel51
  - number: 51.1.e
    text: |-
      de bepaling of de benoeming in vaste of in tijdelijke dienst geschiedt en in het laatste geval de gronden voor de
      tijdelijkheid en de duur van de benoeming;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel51
  - number: 51.1.f
    text: de omvang van de betrekking;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel51
  - number: 51.1.g
    text: de op de dag van zijn benoeming van toepassing zijnde schaal en het salarisnummer;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel51
  - number: 51.1.h
    text: de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel51
  - number: '51.2'
    text: De akte van benoeming bevat bepalingen inzake gronden voor schorsing, ontslag en disciplinaire maatregelen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel51
  - number: '51.3'
    text: |-
      Het bevoegd gezag draagt zorg dat afschriften van de bewijzen van bekwaamheid, van de verklaringen omtrent het
      gedrag, alsmede van de akten van benoeming van het aan de school verbonden personeel worden bewaard.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel51
  - number: '52.1'
    text: |-
      Het bevoegd gezag van een bijzondere school is aangesloten bij een commissie van beroep. De rector of de directeur,
      de conrectoren, de adjunct-directeuren, de leden van de centrale directie, de leraren en het overige personeel,
      bedoeld in [artikel 38a][ref1], kunnen bij die commissie beroep instellen tegen een beslissing van het bevoegd
      gezag inhoudende:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 38a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 52.1.a
    text: een disciplinaire maatregel,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel52
  - number: 52.1.b
    text: schorsing,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel52
  - number: 52.1.c
    text: het direct of indirect onthouden van promotie,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel52
  - number: 52.1.d
    text: het verminderen van de omvang van de betrekking,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel52
  - number: 52.1.e
    text: ontslag anders dan op eigen verzoek, voordat de pensioengerechtigde leeftijd is bereikt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel52
  - number: 52.1.f
    text: |-
      de beslissing van het bevoegd gezag ten aanzien van een personeelslid op basis waarvan op termijn vermindering van
      diens betrekkingsomvang kan plaatsvinden,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel52
  - number: 52.1.g
    text: de beëindiging van een verlengd tijdelijk dienstverband,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel52
  - number: 52.1.h
    text: |-
      de aanwijzing als personeelslid boven de reguliere formatie voortvloeiend uit een algemeen verbindend voorschrift
      welke aanwijzing op termijn kan leiden tot ontslag, vermindering van de betrekkingsomvang of beëindiging van een
      verlengd tijdelijk dienstverband, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel52
  - number: 52.1.i
    text: de aanwijzing van een andere school of andere scholen waaraan een personeelslid werkzaamheden zal verrichten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel52
  - number: '52.2'
    text: |-
      Een beslissing als bedoeld in het eerste lid, aanhef wordt schriftelijk aan de betrokkene medegedeeld. Daarbij
      wordt tevens vermeld de beroepstermijn en het adres van de commissie waar het beroep kan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel52
  - number: '52.3'
    text: Het bevoegd gezag onderwerpt zich aan de uitspraak van de commissie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel52
  - number: 52a.1
    text: |-
      Het beroep, bedoeld in [artikel 52][ref1], wordt schriftelijk ingesteld binnen zes weken, nadat de beslissing aan
      betrokkene is medegedeeld. Bij overschrijding van deze termijn ten gevolge van omstandigheden die de betrokkene
      niet kunnen worden verweten, laat de commissie niet-ontvankelijkverklaring op die grond achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel52
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '52'
        hoofdstuk: III
        afdeling: I
  - number: 52a.2
    text: |-
      Tijdens de behandeling door de commissie van beroep loopt geen verjaring met betrekking tot rechtsvorderingen ter
      zake van beslissingen die aan het oordeel van de commissie zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel52a
  - number: '53.1'
    text: |-
      Een commissie van beroep strekt haar werkkring uit over ten minste twintig bijzondere scholen. Onze minister kan
      het in de vorige volzin bedoelde aantal scholen lager stellen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53
  - number: '53.2'
    text: |-
      Zij bestaat uit vijf leden en vijf plaatsvervangende leden, waarvan twee leden en twee plaatsvervangende
      leden worden gekozen door de schoolbesturen en twee leden en twee plaatsvervangende leden door het personeel
      van de in het vorige lid bedoelde scholen. Deze vier leden kiezen het vijfde lid, tevens voorzitter, en diens
      plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53
  - number: '53.3'
    text: |-
      De leden en plaatsvervangende leden mogen niet zitting hebben in het schoolbestuur, noch deel uitmaken van het
      personeel van een school, waarover de commissie haar werkkring uitstrekt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53
  - number: '53.4'
    text: |-
      Omtrent de verdere samenstelling en de werkwijze van de commissies van beroep worden nadere voorschriften gegeven
      bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53
  - number: 53a
    text: |-
      In een geval als bedoeld in [artikel 39c, vierde lid, eerste volzin][ref1], maakt het bevoegd gezag van een
      bijzondere school de beslissing tot ontzegging van de toegang tot de school schriftelijk en met redenen omkleed
      bekend aan de betrokken student.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel39c
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 39c
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 53b.1
    text: Op het personeel van een rechtspersoon met volledige rechtsbevoegdheid die
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53b
  - number: 53b.1.a
    text: |-
      uitsluitend wordt bestuurd door een bevoegd gezag al dan niet met een of meer andere bevoegde gezagsorganen als
      bedoeld in deze wet, de [Wet op het primair onderwijs][ref1] of de [Wet op de expertisecentra][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: 53b.1.b
    text: |-
      zich blijkens de statuten dan wel de gemeenschappelijke regeling,
      bedoeld in de [Wet gemeenschappelijke regelingen][ref1], behoudens
      [artikel 20, derde, vierde en vijfde lid, van de Wet op het primair onderwijs][ref2], uitsluitend ten doel stelt
      om ten behoeve van scholen en andere onderwijsinstellingen die uit 's Rijks kas worden bekostigd, werkzaamheden te
      verrichten ter verzekering van de goede gang van het onderwijs met uitzondering van het leiden van de school, het
      geven van onderwijs en het verrichten van werkzaamheden op het terrein van de schoolbegeleiding als bedoeld in de
      [artikelen 179 van de Wet op het primair onderwijs][ref3],[165 van de Wet op de expertisecentra][ref4] en artikel
      280 van deel II van de Wet op het voortgezet onderwijs,


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel165
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0003740
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '179'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: '165'
  - number: 53b.1.c
    text: niet het maken van winst beoogt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53b
  - number: 53b.1.d
    text: |-
      wordt gefinancierd met behulp van bijdragen van de bevoegde gezagsorganen waarvoor diensten worden verricht,
      waaronder begrepen formatierekeneenheden die zijn toegekend op basis van [artikel 122, eerste lid onder c][ref1],
      of [artikel 132 van de Wet op het primair onderwijs][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '122'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '132'
  - number: 53b.1.e
    text: Onze minister heeft medegedeeld als rechtspersoon in de zin van dit artikel werkzaam te willen zijn,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53b
  - number: 53b.2
    text: Onder bevoegd gezag en bevoegde gezagsorganen in het eerste lid onderdeel a wordt mede verstaan de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53b
  - number: 53b.3
    text: |-
      Het bestuur van de rechtspersoon is aangesloten bij een commissie van beroep als bedoeld in artikel 52. De leden
      en plaatsvervangende leden van een commissie van beroep mogen niet behoren tot het bestuur of het personeel van
      de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53b
  - number: 53b.4
    text: |-
      De in het eerste lid onder a bedoelde bevoegde gezagsorganen delen Onze minister mede dat zij het bestuur vormen
      van een rechtspersoon in de zin van dit artikel. Voorts verschaffen zij Onze minister en de door hem aangewezen
      personen desgevraagd alle inlichtingen omtrent de rechtspersoon en zijn activiteiten. De in het eerste lid
      onder a bedoelde bevoegde gezagsorganen kunnen Onze minister mededelen dat zij erin toestemmen dat de gevraagde
      inlichtingen rechtstreeks door het bestuur van de rechtspersoon zelf aan Onze minister en de door hem aangewezen
      personen worden verschaft.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53b
  - number: 53b.5
    text: |-
      De gemeente en het bevoegd gezag dat deel uitmaakt van het bestuur van de rechtspersoon, zijn verplicht op de
      naleving van de in de voorgaande leden genoemde voorschriften toe te zien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53b
  - number: 53b.6
    text: |-
      De artikelen 40b, 52 en 52a zijn van overeenkomstige toepassing ten aanzien van het personeel van de rechtspersoon
      met dien verstande dat een geschillencommissie haar werkzaamheden uitstrekt over ten minste vijf rechtspersonen als
      bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53b
  - number: 53c.1
    text: |-
      De instandhouding van een of meer openbare en een of meer bijzondere scholen kan worden opgedragen of overgedragen
      aan een stichting die met dit doel wordt onderscheidenlijk is opgericht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.2
    text: |-
      Het statutaire doel van de stichting is in elk geval het geven van openbaar onderwijs en onderwijs van een of meer
      richtingen in afzonderlijke scholen voor openbaar onderscheidenlijk bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.3
    text: |-
      De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken en
      bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.4
    text: |-
      Het personeel dat werkzaam is aan de openbare school, wordt benoemd krachtens een arbeidsovereenkomst naar
      burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.5
    text: 'De statuten voorzien in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.5.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.5.b
    text: de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.5.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.5.d
    text: |-
      de vaststelling van de begroting en jaarrekening na overleg met de gemeenteraad van de gemeente waarin de openbare
      school is gelegen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.5.e
    text: |-
      de wijze waarop de gemeenteraad van de gemeente waarin de openbare school is gelegen, toezicht op het bestuur van
      de openbare school uitoefent,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.5.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.5.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.5.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd voor zover het openbaar onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.6
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na goedkeuring van de gemeenteraad van de gemeente
      waarin de openbare school is gelegen. Goedkeuring kan slechts worden onthouden indien overheersende invloed van de
      overheid in het bestuur niet is verzekerd voor zover het openbaar onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.7
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad van de gemeente waarin de openbare school is gelegen, verslag uit
      over de werkzaamheden, waarbij in ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar
      onderwijs. Het verslag wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.8
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.9
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover het
      openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waarin de openbare school is gelegen, de
      maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het openbaar
      onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
  - number: 53c.10
    text: |-
      [Artikel 155 van de Gemeentewet][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel155
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel53c
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '155'
  - number: '54'
    text: |-
      Het bestuur van een bijzondere school voor voortgezet onderwijs geeft binnen vier weken na de oprichting van de
      school onder overlegging van de statuten der instelling, die de school in stand houdt, en van de reglementen, van
      die oprichting kennis aan Onze minister. Indien de statuten of reglementen worden gewijzigd of ingetrokken, wordt
      eveneens binnen vier weken van de wijziging of van de intrekking van de statuten of reglementen aan Onze minister
      kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel54
  - number: '55.1'
    text: 'Algemeen voortgezet onderwijs mag slechts worden gegeven door hem, die in het bezit is van:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel55
  - number: 55.1.a
    text: |-
      een verklaring omtrent het gedrag, als bedoeld in [artikel 33, eerste lid onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 55.1.b
    text: |-
      een bewijs van bekwaamheid, als bedoeld in [artikel 33, eerste lid onder b][ref1]; en die niet krachtens
      rechterlijke uitspraak van het geven van onderwijs is uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '55.2'
    text: |-
      Het eerste lid onder b is niet van toepassing op een leraar, in zoverre deze belast is met het geven van
      godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel55
  - number: '55.3'
    text: |-
      [Artikel 33, tweede tot en met vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '56.1'
    text: |-
      Onze minister kan de school, die ten aanzien van de duur van de cursus, het schoolplan en de bevoegdheden
      van de leraren overeenkomt met een school voor voorbereidend wetenschappelijk onderwijs, voor hoger algemeen
      voortgezet onderwijs, voor middelbaar algemeen voortgezet onderwijs of voor voorbereidend beroepsonderwijs,
      als bedoeld in [artikel 29, eerste lid][ref1], aanwijzen als bevoegd om aan de leerlingen op grond van
      het met gunstig gevolg afleggen van een eindexamen aan de school het diploma uit te reiken, bedoeld in het
      [derde lid van dat artikel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '56.2'
    text: |-
      [Artikel 29, tweede en vierde lid][ref1], is op dit eindexamen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '56.3'
    text: |-
      Onze minister besluit binnen zes maanden na ontvangst van een aanvraag. Indien de beschikking niet binnen zes
      maanden kan worden gegeven, stelt Onze minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn
      waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel56
  - number: '57'
    text: |-
      De aanwijzing geschiedt op een daartoe tot Onze minister gericht verzoek van het schoolbestuur. Bij het verzoek
      worden overgelegd:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel57
  - number: 57.a
    text: het schoolplan van de school;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel57
  - number: 57.b
    text: |-
      een opgave van de bewijzen van bekwaamheid en van voldoende pedagogische en didactische voorbereiding van de
      leraren;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel57
  - number: 57.c
    text: de statuten en het reglement van de rechtspersoon met volledige rechtsbevoegdheid, die de school in stand houdt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel57
  - number: '58.1'
    text: |-
      Het schoolplan van een ingevolge [artikel 56][ref1] aangewezen school voldoet ten minste aan de voorschriften,
      gegeven bij of krachtens de [artikelen 10][ref2], [10b][ref3], [10d][ref4], [11a tot en met 11f][ref5],
      [12 tot en met 15][ref6], [22][ref7] en [24][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel12
      [ref7]: https://wetten.overheid.nl/BWBR0002399#Artikel22
      [ref8]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '56'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 11a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref6
        bwb_id: BWBR0002399
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref7
        bwb_id: BWBR0002399
        artikel: '22'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref8
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '58.2'
    text: Bij wijziging van het schoolplan doet het schoolbestuur daarvan onmiddellijk mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel58
  - number: '58.3'
    text: |-
      Onze minister kan ten behoeve van de bijzondere inrichting van het onderwijs aan de school toestaan, dat wordt
      afgeweken van het eerste lid. Onze minister besluit binnen zes maanden na ontvangst van een aanvraag. Indien de
      beschikking niet binnen zes maanden kan worden gegeven, stelt Onze minister de aanvrager daarvan in kennis en noemt
      hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel58
  - number: '58.4'
    text: De naam van de school duidt aan, met welke van de uit de openbare kas bekostigde scholen zij overeenkomt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel58
  - number: '58.5'
    text: |-
      De voorwaarden voor de toelating tot de school zijn ten minste gelijk aan die, vastgesteld krachtens
      [artikel 27, eerste lid, alsmede de leden 1a en 1b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '58.6'
    text: |-
      [Artikel 33][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '59'
    text: |-
      Onze minister kan de aanwijzing intrekken, indien niet langer wordt voldaan aan de artikelen 56 en 58 of indien van
      misbruik van de verleende aanwijzing is gebleken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel59
  - number: '60.1'
    text: |-
      Jaarlijks wordt gelegenheid gegeven om door het met gunstig gevolg afleggen van een staatsexamen voor een door de
      Informatie Beheer Groep in te stellen commissie een diploma te verkrijgen, overeenkomende met een diploma van een
      school voor voorbereidend wetenschappelijk onderwijs, voor hoger algemeen voortgezet onderwijs en voor middelbaar
      algemeen voortgezet onderwijs, als bedoeld in [artikel 29, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '60.2'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald, welke andere diploma's kunnen worden verkregen door het met
      gunstig gevolg afleggen van een staatsexamen voor een door de Informatie Beheer Groep in te stellen commissie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel60
  - number: '60.3'
    text: |-
      Zij, die zijn afgewezen bij het eindexamen van een school, worden niet toegelaten tot het in hetzelfde jaar te
      houden overeenkomstige staatsexamen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel60
  - number: '60.4'
    text: De staatsexamens zijn openbaar, behoudens het schriftelijke gedeelte.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel60
  - number: '60.5'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in dit artikel bedoelde examens, die
      niet voor alle kandidaten dezelfde vakken en andere programma-onderdelen behoeven te omvatten. Daarbij kan worden
      bepaald het bedrag, dat voor de toelating tot deze examens verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel60
  - number: '60.6'
    text: |-
      [Artikel 30a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel30a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 30a
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '61'
    text: |-
      De door Ons aan te wijzen inrichtingen voor voortgezet onderwijs, bedoeld in [artikel 5, onderdeel e][ref1], kunnen
      volgens bij algemene maatregel van bestuur te stellen regels door het Rijk worden bekostigd. Een belanghebbende kan
      beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State tegen besluiten ten aanzien waarvan in
      de algemene maatregel van bestuur ingevolge de vorige volzin de [artikelen 76z][ref2], [105][ref3] en [111][ref4]
      van overeenkomstige toepassing zijn verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76c
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel105
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel111
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76c
        hoofdstuk: I
        afdeling: IA
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '105'
        hoofdstuk: IV
        afdeling: II
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '111'
        afdeling: III
  - number: '62'
    text: |-
      Bij algemene maatregel van bestuur kunnen richtlijnen worden gegeven betreffende het programma en de eisen van
      bekwaamheid van de leraren, alsmede voorschriften ten aanzien van de lokalen van de inrichtingen, bedoeld in
      [artikel 61][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel61
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '61'
        afdeling: IV
  - number: '63'
    text: |-
      Wij kunnen bepalen, welke artikelen van de afdelingen I en II van deze titel van dit deel en van afdeling II van
      titel III van dit deel van toepassing zijn op de inrichtingen, bedoeld in artikel 61.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel63
  - number: '64.1'
    text: 'In deze afdeling wordt onder school verstaan:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel64
  - number: 64.1.a
    text: een school als bedoeld in afdeling I van titel II,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel64
  - number: 64.1.b
    text: een afdeling, als bedoeld in de artikelen 8, eerste lid, onderdeel b, en 10f, eerste lid, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel64
  - number: 64.1.c
    text: een afdeling voor voorbereidend beroepsonderwijs als bedoeld in artikel 10c.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel64
  - number: '64.2'
    text: 'De artikelen 65 tot en met 74 zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel64
  - number: 64.2.a
    text: op cursussen;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel64
  - number: 64.2.b
    text: |-
      indien twee of meer uit de openbare kas bekostigde scholen, als bedoeld in afdeling I van titel II van dit deel,
      worden verenigd tot een lyceum of tot een scholengemeenschap, tenzij het derde lid van toepassing is;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel64
  - number: 64.2.c
    text: |-
      bij omzetting van een bekostigde bijzondere school in een gelijksoortige openbare school of omgekeerd, bij
      omzetting van een bekostigde bijzondere school in een gelijksoortige bijzondere school van een andere richting en
      bij uitbreiding van het onderwijs aan een school met onderwijs van een of meer andere richtingen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel64
  - number: '64.3'
    text: |-
      De artikelen 65 tot en met 74 zijn van overeenkomstige toepassing met betrekking tot een bekostigde school waarvoor
      Onze minister de toestemming, bedoeld in artikel 75, derde lid, niet heeft verleend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel64
  - number: 64.3a
    text: |-
      In afwijking van het bepaalde in het derde lid zijn gedurende de schooljaren 1993/1994, 1994/1995 en 1995/1996 de
      artikelen 65 tot en met 74 van overeenkomstige toepassing met betrekking tot een bekostigde school die ten aanzien
      van een splitsing of verplaatsing niet in het overzicht, bedoeld in artikel 75a, vierde lid, is opgenomen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel64
  - number: '64.4'
    text: De bekostiging uit de openbare kas van een school neemt geen aanvang dan krachtens de bepalingen van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel64
  - number: '64.5'
    text: |-
      Voor het bij of krachtens deze afdeling bepaalde, treden voor de toepassing van de afdeling 4.1.2 van de Algemene
      wet bestuursrecht (Stb. 1992, 315) de in artikel 65 bedoelde organisaties in de plaats van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel64
  - number: '64.6'
    text: |-
      [Artikel 4:32 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de bekostiging van scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '65.1'
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschappen stelt na overleg met de daarvoor in aanmerking komende
      organisaties en, voor zover het betreft het landbouwonderwijs, in overleg met Onze Minister van Landbouw,
      Natuurbeheer en Visserij, jaarlijks een plan van scholen vast, die in de drie kalenderjaren, volgende op het jaar
      van de vaststelling voor bekostiging uit 's Rijks kas in aanmerking zullen worden gebracht. Dit plan heeft ten
      doel te komen tot een evenwichtig geheel van onderwijsvoorzieningen naar soort van onderwijs, mede gelet op het
      verlangde onderwijs in het betrokken gebied. Op het plan worden uitsluitend scholen geplaatst waarover overleg
      heeft plaats gevonden met de in de eerste volzin bedoelde organisaties.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel65
  - number: '65.2'
    text: |-
      Het ontwerp van het Plan van Scholen wordt jaarlijks voor 1 september bekendgemaakt in de Staatscourant en
      aan de Tweede Kamer der Staten-Generaal overgelegd. Het plan wordt niet vastgesteld dan nadat vier weken na de
      bekendmaking en overlegging zijn verstreken en gedurende die termijn niet door of namens de Kamer de wens te kennen
      wordt gegeven dat over dat ontwerp overleg gewenst wordt. De vaststelling van het Plan van Scholen geschiedt voor 1
      oktober, volgend op de datum van de bekendmaking van het ontwerp.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel65
  - number: '65.3'
    text: Bij de samenstelling van het plan wordt uitgegaan van de verzoeken en de deelplannen, bedoeld in artikel 66.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel65
  - number: '65.4'
    text: |-
      Indien een bijzondere school wordt opgericht, die niet in het plan is opgenomen, komt deze school niet voor
      bekostiging uit 's Rijks kas in aanmerking gedurende ten minste drie kalenderjaren, volgende op het jaar van de
      oprichting, tenzij artikel 69 of artikel 72 van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel65
  - number: 65a.1
    text: 'Het plan omvat tevens:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel65a
  - number: 65a.1.a
    text: een toelichting, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel65a
  - number: 65a.1.b
    text: een toetsingskader.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel65a
  - number: 65a.2
    text: |-
      De toelichting bevat in elk geval de beschikkingen, houdende afwijzing van de verzoeken om opneming in het plan.
      Bovendien wordt in de toelichting in elk geval melding gemaakt van het oordeel van provinciale staten en gemeenten,
      bedoeld in [artikel 66, vijfde en zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel66
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '66'
        afdeling: I
  - number: 65a.3
    text: |-
      Het toetsingskader omvat de uiteenzetting van het toe- en afwijzingsbeleid, aangaande verzoeken om opneming in het
      plan, en heeft in elk geval betrekking op de plannen die in de drie opvolgende jaren zullen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel65a
  - number: 65a.4
    text: |-
      In het toetsingskader kan, onverminderd het bepaalde in [artikel 69][ref1], worden bepaald welk soort of welke
      soorten van scholen, onderscheidenlijk welk soort of welke soorten van afdelingen, gedurende een of meer jaren niet
      in het plan zullen worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel69
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '69'
        afdeling: I
  - number: '66.1'
    text: |-
      Een verzoek om opneming in het plan wordt voor 1 januari van het jaar van de vaststelling van het plan, bij Onze
      minister ingediend
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel66
  - number: 66.1.a
    text: door de gemeenteraad, indien het een openbare school betreft die door een gemeente in stand wordt gehouden,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel66
  - number: 66.1.b
    text: |-
      door het krachtens de desbetreffende gemeenschappelijke regeling bevoegde orgaan, indien het een openbare school
      betreft die door een openbaar lichaam als bedoeld in [artikel 1][ref1] in stand wordt gehouden,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '1'
  - number: 66.1.c
    text: |-
      door het bestuur van een openbare rechtspersoon als bedoeld in [artikel 42a][ref1] dan wel van een stichting als
      bedoeld in [artikel 42b][ref2] indien het een openbare school betreft die door een openbare rechtspersoon of een
      stichting in stand wordt gehouden, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel42a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel42b
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 42a
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 42b
        hoofdstuk: II
        afdeling: I
  - number: 66.1.d
    text: door het schoolbestuur, indien het een bijzondere school betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel66
  - number: '66.2'
    text: |-
      Ten minste eenmaal in de drie jaren stellen gedeputeerde staten vast, of voldoende is voorzien in de behoefte aan
      openbaar onderwijs in een genoegzaam aantal scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel66
  - number: '66.3'
    text: |-
      Gedeputeerde staten kunnen de gemeente opdragen een verzoek te richten tot Onze minister om opneming in het
      plan van een openbare school, indien de ouders, voogden en verzorgers van een naar hun oordeel voldoend aantal
      leerlingen hiertoe de wens hebben te kennen gegeven en de gemeente daaraan niet heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel66
  - number: 66.3a
    text: |-
      Onze minister kan de gemeente opdragen een verzoek tot hem te richten om opneming op het plan van een openbare
      school, indien gedeputeerde staten geen toepassing geven aan het derde lid en ouders, voogden en verzorgers van een
      naar zijn oordeel voldoend aantal leerlingen hiertoe de wens hebben te kennen gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel66
  - number: '66.4'
    text: |-
      Elk verzoek is met redenen omkleed, vermeldt de aard en de plaats van vestiging van de school en gaat vergezeld
      van een prognose omtrent de te verwachten omvang. Een verzoek tot opneming in het plan van een school voor
      praktijkonderwijs dan wel van een afdeling voor praktijkonderwijs, bedoeld in [artikel 10f, eerste lid][ref1],
      wordt gedaan in overeenstemming met de bevoegde gezagsorganen in het samenwerkingsverband waarvan die school
      dan wel die afdeling deel gaat uitmaken, en gaat vergezeld van een advies van de gemeente waarin die school
      dan wel die afdeling wordt gevestigd. Indien het verzoek namens de raad, het krachtens de desbetreffende
      gemeenschappelijke regeling bevoegde orgaan of het schoolbestuur wordt ingediend door een rechtspersoon met
      volledige rechtsbevoegdheid, die zich de bevordering van het voortgezet onderwijs ten doel stelt, is het vervat in
      een deelplan, waarin zijn opgenomen de scholen, waarvan de oprichting in de drie kalenderjaren, waarover het plan
      zich uitstrekt, door die rechtspersoon wordt voorgestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '66.5'
    text: |-
      Elk verzoek, bedoeld in het voorgaande lid, wordt door Onze minister toegezonden aan de provincie die het aangaat.
      Binnen vier maanden na ontvangst stellen Provinciale Staten Onze minister in kennis van hun oordeel over deze
      verzoeken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel66
  - number: '66.6'
    text: |-
      Het bepaalde in het voorgaande lid is van overeenkomstige toepassing met betrekking tot verzoeken die de gemeenten
      Amsterdam, Rotterdam, 's-Gravenhage en Utrecht aangaan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel66
  - number: '67.1'
    text: |-
      Het plan vermeldt van elke school de aard, de plaats van vestiging en de te verwachten omvang en geeft aan, welke
      scholen in het eerste jaar voor bekostiging uit 's Rijks kas in aanmerking zullen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel67
  - number: '67.2'
    text: |-
      Indien scholen op het plan worden vermeld zonder aanduiding van het eerste jaar van bekostiging uit 's Rijks kas,
      worden de redenen daarvan aan het plan toegevoegd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel67
  - number: '67.3'
    text: |-
      Behoudens het bepaalde in het vierde lid zijn in ieder plan mede opgenomen de scholen uit het vorige plan, die nog
      niet voor bekostiging in aanmerking zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel67
  - number: '67.4'
    text: |-
      Op verzoek van de aanvrager, dan wel indien zich naar het oordeel van Onze minister omstandigheden hebben
      voorgedaan, die bij de vaststelling van een plan niet bekend waren, kan uit het plan een in een vorig plan
      opgenomen school vervallen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel67
  - number: '68.1'
    text: |-
      Indien Onze Minister van oordeel is dat een andere school dan wordt gevraagd, dan wel een andere plaats van
      vestiging meer in overeenstemming is met een evenwichtig geheel van onderwijsvoorzieningen, treedt hij, alvorens
      het plan wordt vastgesteld, in overleg met de aanvrager.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel68
  - number: '68.2'
    text: |-
      Indien het verzoek om opneming in het plan in strijd is met het laatst vastgestelde toetsingskader, bedoeld in
      [artikel 65a][ref1], wijst Onze minister het verzoek af voor 1 februari, volgend op de ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel65a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 65a
        afdeling: I
  - number: '68.3'
    text: |-
      Indien het verzoek om opneming in het plan gelijk of nagenoeg gelijk is aan het verzoek dat het voorgaande jaar is
      gedaan, en indien in het verzoek geen nieuw gebleken feiten of veranderde omstandigheden worden vermeld, wijst Onze
      Minister het verzoek af voor 1 februari, volgend op de ontvangst.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel68
  - number: '69.1'
    text: |-
      Onze minister neemt in het plan in elk geval op de scholen, waarvan redelijkerwijs kan worden aangenomen dat zij,
      gelet op de belangstelling voor het desbetreffende schooltype en op het leerlingenverloop, blijkens statistische
      gegevens, waaronder die verstrekt door het Centraal Bureau voor de Statistiek, zullen worden bezocht door ten
      minste
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel69
  - number: 69.1.a
    text: driehonderd vijfenvijftig leerlingen, voor wat betreft een gymnasium;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel69
  - number: 69.1.b
    text: driehonderd veertig leerlingen, voor wat betreft een atheneum;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel69
  - number: 69.1.c
    text: vierhonderd zestig leerlingen, voor wat betreft een lyceum;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel69
  - number: 69.1.d
    text: |-
      driehonderd zestig leerlingen, voor wat betreft een school en honderd vijfentwintig voor wat betreft een afdeling
      voor hoger algemeen voortgezet onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel69
  - number: 69.1.e
    text: tweehonderd zestig leerlingen, voor wat betreft een school voor middelbaar algemeen voortgezet onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel69
  - number: 69.1.f
    text: |-
      driehonderd twintig leerlingen voor wat betreft een school voor voorbereidend beroepsonderwijs bestaande
      uit een afdeling als bedoeld in [artikel 10c, onderdeel a][ref1], en een afdeling als bedoeld in
      [artikel 10c, onderdeel b][ref2], of uit twee afdelingen als bedoeld in [artikel 10c, onderdeel c][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 69.1.g
    text: |-
      tweehonderd zestig leerlingen voor wat betreft een school voor voorbereidend beroepsonderwijs bestaande uit de
      afdeling, bedoeld in [artikel 10c, onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 69.1.h
    text: |-
      honderd zestig leerlingen voor elke nieuw te vormen afdeling als bedoeld in
      [artikel 10c, onderdeel a, b of c][ref1], aan een reeds bekostigde of nieuw te vormen school voor voorbereidend
      beroepsonderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 69.1.i
    text: |-
      tweehonderd zestig leerlingen voor elke nieuw te vormen afdeling als bedoeld in [artikel 10c, onderdeel d][ref1],
      aan een reeds bekostigde of nieuw te vormen school voor voorbereidend beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '69.2'
    text: |-
      Een scholengemeenschap, in zich verenigende twee of meer van de in het eerste lid genoemde scholen, wordt in ieder
      geval in het plan opgenomen, indien op gelijke wijze als volgens het eerste lid kan worden aangetoond, dat het
      aantal leerlingen van elk der samenstellende scholen, behalve van een daartoe behorend lyceum en een school als
      bedoeld in het eerste lid, de onderdelen f tot en met i, ten minste drie vierden zal bedragen van het daarvoor in
      het eerste lid genoemde aantal.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel69
  - number: '69.3'
    text: |-
      Bij de toepassing van de voorgaande leden worden niet in aanmerking genomen de leerlingen, voor wie binnen
      redelijke afstand plaatsruimte beschikbaar zal zijn op een gelijksoortige school, waar het verlangde onderwijs
      wordt gegeven, tenzij deze school uitsluitend voor interne leerlingen bestemd is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel69
  - number: '70'
    text: |-
      Het plan wordt binnen vier weken na de vaststelling bekend gemaakt door plaatsing in de Staatscourant en
      gelijktijdige toezending aan alle aanvragers, bedoeld in [artikel 66, eerste lid][ref1], zomede aan de
      rechtspersoon, bedoeld in [artikel 66, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel66
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '66'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '66'
        afdeling: I
  - number: '71'
    text: |-
      Tegen een besluit omtrent het vervallen van een school uit het plan, anders dan op verzoek van de aanvrager, op
      grond van artikel 67, vierde lid, alsmede tegen een besluit waarbij aan een verzoek tot opneming van een school in
      het plan geen gevolg is gegeven kan een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de
      Raad van State.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel71
  - number: '72'
    text: |-
      Indien beroep is ingesteld als bedoeld in artikel 71 en de uitspraak strekt tot opneming van een school in het plan
      van scholen, neemt Onze minister de school op in het eerste na de uitspraak vast te stellen plan van scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel72
  - number: '73'
    text: |-
      Zodra de bekostiging van een in het plan opgenomen school een aanvang kan nemen, beslist Onze minister bij
      beschikking, met ingang van welk tijdstip dit kan geschieden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel73
  - number: '74.1'
    text: De bekostiging vangt in elk geval aan, nadat de school vijf achtereenvolgende jaren in het plan is opgenomen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel74
  - number: '74.2'
    text: |-
      Ten aanzien van een school, die ingevolge [artikel 72][ref1] voor het eerst in het plan wordt opgenomen, vangt deze
      termijn aan in het jaar, waarin het beroep werd ingesteld, en ten aanzien van een school, die ingevolge dat artikel
      weer in het plan wordt opgenomen, in het jaar, waarin de school voor het eerst in het plan werd opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '72'
        afdeling: I
  - number: '74.3'
    text: |-
      De aanspraak op bekostiging vervalt, indien de voorgenomen oprichting van de desbetreffende school niet is
      verwezenlijkt binnen twee jaren na het jaar, waarin de bekostiging een aanvang had kunnen nemen, tenzij Onze
      minister in bijzondere gevallen anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel74
  - number: '75.1'
    text: |-
      Onze minister kan, de daarvoor in aanmerking komende organisaties gehoord, onder door hem te stellen voorwaarden
      voor bekostiging in aanmerking brengen een school die wordt opgericht door middel van een omzetting, als bedoeld in
      artikel 64, tweede lid, onder c.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75
  - number: '75.2'
    text: |-
      Onze minister kan, de daarvoor in aanmerking komende organisaties gehoord, toestaan dat een bekostigde school wordt
      gesplitst of een andere plaats van vestiging krijgt. Onze minister kan aan zijn toestemming voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75
  - number: '75.3'
    text: |-
      Naar aanleiding van een verzoek op grond van het eerste lid, betreffende de omzetting van een openbare school in
      een gelijksoortige bijzondere school, of een verzoek op grond van het tweede lid, betreffende de verplaatsing van
      een openbare school, stellen gedeputeerde staten vast of voldoende zal zijn voorzien in de behoefte aan openbaar
      onderwijs in een genoegzaam aantal scholen, indien Onze Minister in het verzoek zou toestemmen. Gedeputeerde staten
      kunnen de gemeente binnen zes maanden nadat het verzoek te hunner kennis is gebracht opdragen het zodanige verzoek
      in te trekken, indien de ouders, voogden en verzorgers van een naar hun oordeel voldoend aantal leerlingen hiertoe
      de wens hebben te kennen gegeven en de gemeente daaraan niet heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75
  - number: '75.4'
    text: |-
      Voor zover het gaat om scholen waaraan op het basisonderwijs aansluitend voortgezet onderwijs wordt gegeven en
      de verzoeken op grond van het eerste en tweede lid, betrekking hebben op de schooljaren 1993/1994, 1994/1995 en
      1995/1996 is artikel 75a van toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75
  - number: '75.5'
    text: |-
      Onze minister kan op grond van bijzondere omstandigheden met ingang van 1 augustus 1996, de daarvoor in aanmerking
      komende organisaties gehoord, onder door hem te stellen voorwaarden een nevenvestiging voor bekostiging in
      aanmerking brengen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75
  - number: '75.6'
    text: |-
      Onze minister besluit binnen tien maanden na ontvangst van een aanvraag tot omzetting, splitsing of verplaatsing.
      Indien de beschikking niet binnen tien maanden kan worden gegeven, stelt Onze minister de aanvrager daarvan in
      kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75
  - number: '75.7'
    text: |-
      Tegen een besluit als bedoeld in het eerste, tweede en vijfde lid kan een belanghebbende beroep instellen bij de
      Afdeling bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75
  - number: 75a.1
    text: |-
      Het bevoegd gezag dat voornemens is met ingang van 1 augustus van een van de schooljaren 1993/1994, 1994/1995
      of 1995/1996 een omzetting, splitsing, verplaatsing of nevenvestiging van een school tot stand te brengen, doet
      voor een door Onze minister te bepalen tijdstip voorafgaand aan het desbetreffende schooljaar een verzoek aan
      Onze minister tot opneming in het door provinciale staten op te stellen advies voor omzettingen, splitsingen,
      verplaatsingen en nevenvestigingen. Onze minister zendt het verzoek ter advisering aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75a
  - number: 75a.2
    text: |-
      Provinciale staten stellen jaarlijks, voor de in het eerste lid bedoelde schooljaren, de daarvoor in aanmerking
      komende bevoegde gezagsorganen van belanghebbende scholen gehoord, het advies, bedoeld in het eerste lid op. Aan
      het advies worden toegevoegd de verzoeken die niet zijn ingewilligd en de motivering daarvan. Tevens wordt aan het
      advies toegevoegd een opgave van de bedenkingen die door de in de eerste volzin bedoelde bevoegde gezagsorganen
      tegen het advies zijn ingebracht en de door provinciale staten daarop genomen beslissing. Provinciale staten
      zenden het advies voor een door Onze minister te bepalen tijdstip aan Onze minister en maken het voor een door Onze
      minister te bepalen tijdstip bekend in de Staatscourant. Zij zenden tevens een verslag omtrent de totstandkoming
      van de in het derde lid, onderdeel a bedoelde scholengemeenschappen aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75a
  - number: 75a.3
    text: 'Een verzoek als bedoeld in het eerste lid wordt slechts in het advies, bedoeld in dat lid opgenomen, indien:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75a
  - number: 75a.3.a
    text: |-
      het verzoek wordt gedaan door het bevoegd gezag van een scholengemeenschap die met ingang van een van de in het
      eerste lid genoemde tijdstippen tot stand komt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75a
  - number: 75a.3.b
    text: aan een nevenvestiging in elk geval basisvorming wordt gegeven,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75a
  - number: 75a.3.c
    text: |-
      een nevenvestiging wordt verbonden aan de in onderdeel a bedoelde scholengemeenschap waarin in ieder geval tot
      een school zijn verenigd een school voor voorbereidend beroepsonderwijs, waaraan ten minste twee afdelingen uit
      verschillende groepen, bedoeld in artikel 10a, tweede lid, de onderdelen a tot en met g, dan wel h tot en met l,
      dan wel m, dan wel n tot en met o, dan wel p, zijn verbonden, alsmede ten minste twee van de volgende scholen: een
      school voor middelbaar algemeen voortgezet onderwijs, een school voor hoger algemeen voortgezet onderwijs en een
      school voor voorbereidend wetenschappelijk onderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75a
  - number: 75a.3.d
    text: |-
      het tot stand brengen van een omzetting, splitsing, verplaatsing of nevenvestiging niet leidt tot een verstoring
      van het evenwichtig geheel van onderwijsvoorzieningen naar soort van onderwijs, mede gelet op het verlangde
      onderwijs in het betrokken gebied, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75a
  - number: 75a.3.e
    text: de nevenvestiging zal worden bezocht door tenminste 120 leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75a
  - number: 75a.4
    text: |-
      Onze minister stelt, de daarvoor in aanmerking komende organisaties gehoord, vóór een door Onze minister te bepalen
      tijdstip een overzicht van omzettingen, splitsingen, en verplaatsingen vast en stelt in dat overzicht tevens vast
      welke nevenvestigingen voor bekostiging uit 's Rijks kas in aanmerking zullen worden gebracht. Bij de vaststelling
      van dit overzicht toetst Onze minister of het tot stand brengen van een omzetting, splitsing, verplaatsing of
      nevenvestiging niet leidt tot een verstoring van het evenwichtig geheel van voorzieningen, mede gelet op het
      verlangd onderwijs in alle betrokken gebieden. Het overzicht wordt binnen twee weken na de vaststelling in de
      Staatscourant bekendgemaakt en toegezonden aan de bevoegde gezagsorganen die een verzoek tot opneming in het
      overzicht hebben gedaan. Indien aan een verzoek tot opneming in het overzicht geen gevolg is gegeven, wordt de
      motivering hiervan vermeld bij de bekendmaking aan de aanvrager. Tegen een besluit van Onze minister ingevolge dit
      artikel kan een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State. Indien
      beroep is ingesteld en de uitspraak strekt tot opneming van de gevraagde voorziening in het overzicht, neemt Onze
      minister de gevraagde voorziening op in het eerste na de uitspraak vast te stellen overzicht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75a
  - number: 75a.5
    text: |-
      Het bevoegd gezag van een scholengemeenschap waarin in ieder geval tot één school zijn verenigd een school voor
      middelbaar algemeen voortgezet onderwijs en een school voor voorbereidend beroepsonderwijs waaraan ten minste
      twee afdelingen uit verschillende groepen, bedoeld in artikel 10a, tweede lid, de onderdelen a tot en met g dan
      wel h tot en met l dan wel m, dan wel n tot en met o, dan wel p zijn verbonden, kan eveneens een verzoek tot
      instandhouding van een nevenvestiging doen. Een verzoek als bedoeld in de eerste volzin wordt slechts in het
      advies, bedoeld in het eerste lid opgenomen, indien:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75a
  - number: 75a.5.a
    text: |-
      het bevoegd gezag als bedoeld in de aanhef, eerste volzin tevens bevoegd gezag is van een scholengemeenschap waarin
      in ieder geval tot één school zijn verenigd een school voor hoger algemeen voortgezet onderwijs en een school voor
      voorbereidend wetenschappelijk onderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75a
  - number: 75a.5.b
    text: |-
      het bevoegd gezag aantoont dat er afspraken tot stand zijn gebracht tussen de scholengemeenschap, bedoeld in
      de aanhef, eerste volzin en de scholengemeenschap bedoeld onder a, met het oog op het verkrijgen van een goede
      aansluiting op vervolgonderwijs voor de leerlingen van de eerstbedoelde scholengemeenschap,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75a
  - number: 75a.5.c
    text: aan de nevenvestiging in elk geval basisvorming wordt verzorgd,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75a
  - number: 75a.5.d
    text: de nevenvestiging zal worden bezocht door tenminste 120 leerlingen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75a
  - number: 75a.5.e
    text: |-
      het tot stand brengen van de nevenvestiging niet leidt tot een verstoring van het evenwichtig geheel van
      onderwijsvoorzieningen naar soort van onderwijs, mede gelet op het verlangde onderwijs in het betrokken gebied, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75a
  - number: 75a.5.f
    text: |-
      de nevenvestiging tot stand wordt gebracht met ingang van 1 augustus van een van de schooljaren 1993/1994,
      1994/1995 of 1995/1996.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75a
  - number: 75b.1
    text: |-
      Onze minister kan in bijzondere gevallen cursussen voortgezet onderwijs, niet zijnde voorbereidend
      beroepsonderwijs, geheel of gedeeltelijk en voor een door hem te bepalen periode voor bekostiging in aanmerking
      brengen, indien naar zijn oordeel daaraan behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75b
  - number: 75b.2
    text: Onze minister kan aan de bekostiging verplichtingen verbinden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75b
  - number: 75b.3
    text: |-
      Onze minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75b
  - number: 75b.4
    text: |-
      Tegen een besluit als bedoeld in het eerste en tweede lid kan een belanghebbende beroep instellen bij de Afdeling
      bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75b
  - number: 75d
    text: |-
      Onze minister kan onder nader te stellen voorwaarden aanvullende middelen ter beschikking stellen, die niet
      strekken tot bekostiging van het onderwijs, bedoeld in dit deel, en de schoolbegeleiding als bedoeld in
      de [artikelen 179 van de Wet op het primair onderwijs][ref1], [165 van de Wet op de expertisecentra][ref2]
      en 280 van de Wet op het voortgezet onderwijs ten behoeve daarvan, maar die direct of indirect dienstig
      zijn voor de uitvoering van het onderwijs of voor verhoging van de mogelijkheid tot deelname aan het
      onderwijs. Voor zover toepassing van de eerste volzin het verstrekken van subsidie betreft, zijn de
      [artikelen 4 tot en met 19 van de Wet overige OCenW-subsidies][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel165
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel75d
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '165'
      - id: ref3
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '76'
    text: Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76
  - number: 76a
    text: |-
      De [artikelen 76b tot en met 76w][ref1] zijn slechts van toepassing op scholen voor voorbereidend wetenschappelijk
      onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs, voor voorbereidend beroepsonderwijs en voor
      praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76b
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76b
        hoofdstuk: I
        afdeling: IA
  - number: 76b.1
    text: |-
      De gemeenteraad draagt ten behoeve van de gemeentelijke en van de andere dan gemeentelijke scholen zorg voor de
      voorzieningen in de huisvesting op het grondgebied van de gemeente overeenkomstig het bepaalde in dit hoofdstuk.
      Hij behandelt daarbij de gemeentelijke en de andere dan gemeentelijke scholen op gelijke voet.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76b
  - number: 76b.2
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder een andere dan een gemeentelijke school mede begrepen een op het
      grondgebied van de gemeente gelegen nevenvestiging van een school waarvan de hoofdvestiging op het grondgebied van
      een andere gemeente is gelegen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76b
  - number: 76c.1
    text: 'Voor de toepassing van dit hoofdstuk worden onder voorzieningen in de huisvesting begrepen:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76c
  - number: 76c.1.a
    text: 'voor blijvend onderscheidenlijk voor tijdelijk gebruik bestemde voorzieningen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76c
  - number: 76c.1.a.1°
    text: |-
      nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een gedeelte
      daarvan, terreinen, alsmede eerste aanschaf van leer- en hulpmiddelen en meubilair,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76c
  - number: 76c.1.a.2°
    text: uitbreiding van de onder 1° bedoelde voorzieningen, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76c
  - number: 76c.1.a.3°
    text: medegebruik van een ruimte die geschikt is voor het onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76c
  - number: 76c.1.b
    text: 'voorzieningen bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76c
  - number: 76c.1.b.1°
    text: |-
      herstel van constructiefouten en aanpassingen voor zover het de buitenzijde van het gebouw dan wel het terrein
      betreft, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76c
  - number: 76c.1.b.2°
    text: |-
      herstel van constructiefouten en aanpassingen aan de binnenzijde van het gebouw, voor zover deze een bij algemene
      maatregel van bestuur vast te stellen drempelbedrag te boven gaan; deze voorzieningen komen voor rekening van het
      bevoegd gezag voor zover ze het drempelbedrag niet overschrijden;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76c
  - number: 76c.1.c
    text: |-
      herstel en vervanging in verband met schade aan gebouw, leer- en hulpmiddelen en meubilair in geval van bijzondere
      omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76c
  - number: 76c.2
    text: |-
      Bij algemene maatregel van bestuur worden bruto vloeroppervlakten per gelijktijdig aanwezige leerling
      voorgeschreven die voorzieningen in de huisvesting ten minste dienen te bevatten. Deze oppervlakten kunnen per
      schoolsoort verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76c
  - number: 76d.1
    text: |-
      De gemeenteraad stelt jaarlijks ten behoeve van het eerstvolgende jaar voor een door hem te bepalen tijdstip een
      bekostigingsplafond vast voor de bekostiging van de voorzieningen in de huisvesting voor:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76d
  - number: 76d.1.a
    text: |-
      basisscholen als bedoeld in de [Wet op het primair onderwijs][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: 76d.1.b
    text: |-
      speciale scholen voor basisonderwijs als bedoeld in de [Wet op het primair onderwijs][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: 76d.1.c
    text: |-
      scholen voor speciaal onderwijs, scholen voor voortgezet speciaal onderwijs, scholen voor speciaal en voortgezet
      speciaal onderwijs dan wel instellingen voor speciaal en voortgezet speciaal onderwijs als bedoeld in de
      [Wet op de expertisecentra][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 76d.1.d
    text: scholen voor voortgezet speciaal onderwijs als bedoeld in deel II van deze wet, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76d
  - number: 76d.1.e
    text: |-
      scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs, voor
      voorbereidend beroepsonderwijs en voor praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76d
  - number: 76d.2
    text: |-
      Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      in het eerste lid bedoelde scholen op het grondgebied van de gemeente.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76d
  - number: 76e.1
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school dat een voorziening in de huisvesting wenst, dient
      een aanvraag voor opneming van die voorziening op het programma, bedoeld in artikel 76f, in bij burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76e
  - number: 76e.2
    text: |-
      De gemeenteraad kan ten aanzien van voorzieningen als bedoeld in artikel 76c bekostiging verstrekken ter zake van
      de kosten van bouwvoorbereiding.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76e
  - number: 76e.3
    text: |-
      De gemeenteraad stelt vast, voor welk tijdstip de aanvraag wordt ingediend en aan welke voorwaarden deze dient
      te voldoen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76e
  - number: 76e.4
    text: Het derde lid is van overeenkomstige toepassing op de gemeentelijke scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76e
  - number: 76f.1
    text: |-
      De gemeenteraad stelt, na overleg met de bevoegde gezagsorganen van de andere dan gemeentelijke scholen op het
      grondgebied van de gemeente, jaarlijks ten behoeve van het onderwijs op het grondgebied van de gemeente voor een
      door hem te bepalen tijdstip een programma als bedoeld in het tweede lid vast. Het programma heeft betrekking op
      scholen als bedoeld in [artikel 76d, eerste lid, onderdelen a tot en met e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
  - number: 76f.2
    text: |-
      Het programma omvat de voorzieningen in de huisvesting, bedoeld in [artikel 76c][ref1], die in het jaar na de
      vaststelling van het programma voor bekostiging in aanmerking zullen worden gebracht voor andere dan gemeentelijke
      scholen en voorzieningen die nodig zijn voor gemeentelijke scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76c
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76c
        hoofdstuk: I
        afdeling: IA
  - number: 76f.3
    text: 'De gemeenteraad neemt uitsluitend voorzieningen in de huisvesting in het programma op, voor zover:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76f
  - number: 76f.3.a
    text: |-
      met de voorzieningen in het kalenderjaar volgend op het jaar van vaststelling van het programma redelijkerwijs een
      aanvang kan worden gemaakt dan wel de voorziening wordt gerealiseerd, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76f
  - number: 76f.3.b
    text: |-
      niet een van de weigeringsgronden, genoemd in [artikel 76k][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76k
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76k
        hoofdstuk: I
        afdeling: IA
  - number: 76f.4
    text: |-
      Indien het bekostigingsplafond, bedoeld in [artikel 76d][ref1], niet toereikend is, worden die voorzieningen in het
      programma opgenomen die uit dat bekostigingsplafond kunnen worden bekostigd, waarbij de volgorde wordt bepaald met
      inachtneming van de criteria, bedoeld in [artikel 76m, eerste lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76m
        hoofdstuk: I
        afdeling: IA
  - number: 76f.5
    text: |-
      De beschikking van de gemeenteraad kan een gedeelte van de gewenste voorziening dan wel een andere voorziening dan
      gewenst omvatten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76f
  - number: 76f.6
    text: |-
      De gemeenteraad kan aan de opneming in het programma voorwaarden verbinden betreffende ingebruikneming of
      buitengebruikstelling van gebouwen of lokalen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76f
  - number: 76f.7
    text: |-
      De gemeenteraad neemt bij de vaststelling van het programma de criteria, bedoeld in
      [artikel 76m, eerste lid, onderdeel c][ref1], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76m
        hoofdstuk: I
        afdeling: IA
  - number: 76f.8
    text: |-
      Binnen vier weken na de vaststelling van het programma treden burgemeester en wethouders met het bevoegd gezag
      in overleg over de wijze van uitvoering. Indien dit overleg niet tot overeenstemming leidt, delen burgemeester en
      wethouders het bevoegd gezag mede dat zij niet kunnen instemmen met de door het bevoegd gezag gewenste wijze van
      uitvoering.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76f
  - number: 76f.9
    text: |-
      Tijdens het in het eerste lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling van het programma huisvestingsvoorzieningen in relatie tot de vrijheid van richting
      en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd dan wel uit
      eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies
      wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met het programma.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76f
  - number: 76g
    text: |-
      De gemeenteraad stelt gelijktijdig met het programma, bedoeld in [artikel 76f][ref1], ten behoeve van het onderwijs
      op het grondgebied van de gemeente voor een door hem te bepalen tijdstip een overzicht vast van die voorzieningen
      die zijn aangevraagd dan wel nodig zijn, die niet op het programma zijn opgenomen. Daarbij wordt aangegeven waarom
      de desbetreffende voorzieningen niet zijn opgenomen. Het overzicht wordt ter inzage gelegd. Het overzicht heeft
      betrekking op scholen als bedoeld in [artikel 76d, eerste lid, onderdelen a tot en met e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
  - number: 76h
    text: |-
      De gemeenteraad stelt geen programma als bedoeld in [artikel 76f][ref1] en geen overzicht als bedoeld in
      [artikel 76g][ref2] vast, indien geen voorziening in de huisvesting nodig is noch een aanvraag is ingediend voor
      scholen als bedoeld in [artikel 76d, eerste lid, onderdelen a tot en met e][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76g
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76g
        hoofdstuk: I
        afdeling: IA
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
  - number: 76i.1
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school dat een voorziening in de huisvesting wenst die niet
      in het programma, bedoeld in [artikel 76f][ref1], is opgenomen, maar die gelet op de voortgang van het onderwijs
      geen uitstel kan lijden, dient een aanvraag om bekostiging van die voorziening in bij burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
  - number: 76i.2
    text: |-
      De beschikking kan een gedeelte van de gewenste voorziening dan wel een andere voorziening dan gewenst omvatten. De
      gemeenteraad wijst de aanvraag af, indien:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76i
  - number: 76i.2.a
    text: de beslissing over de voorziening kan worden genomen bij de vaststelling van het eerstvolgende programma, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76i
  - number: 76i.2.b
    text: |-
      een van de weigeringsgronden, genoemd in
      [artikel 76k, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76k
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76k
        hoofdstuk: I
        afdeling: IA
  - number: 76j.1
    text: |-
      De gemeenteraad beslist bij beschikking met ingang van welk tijdstip in het jaar volgend op het jaar van
      vaststelling van het programma, bedoeld in [artikel 76f][ref1], de bekostiging van een voorziening die in het
      programma is opgenomen, daadwerkelijk een aanvang kan nemen, onverminderd het bepaalde in [artikel 76l][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76l
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76j
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76l
        hoofdstuk: I
        afdeling: IA
  - number: 76j.2
    text: |-
      De aanspraak op bekostiging van een voorziening vervalt, indien niet binnen een door de gemeente in de verordening
      op basis van [artikel 76m][ref1] te bepalen termijn na de beschikking, bedoeld in het eerste lid, met betrekking
      tot de voorziening een bouwopdracht is gegeven dan wel een koop-, huur- of erfpachtovereenkomst is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76j
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76m
        hoofdstuk: I
        afdeling: IA
  - number: 76k.1
    text: 'Een voorziening in de huisvesting wordt slechts geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76k
  - number: 76k.1.a
    text: |-
      de gewenste voorziening geen voorziening is in de zin van [artikel 76c][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76c
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76c
        hoofdstuk: I
        afdeling: IA
  - number: 76k.1.b
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de aard en de omvang van de voorzieningen waarover
      de school reeds beschikt, voor zover deze uit de openbare kas zijn bekostigd, gelet op de normen, bedoeld in
      [artikel 76m, eerste lid, onderdeel b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76m
        hoofdstuk: I
        afdeling: IA
  - number: 76k.1.c
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van het
      aantal leerlingen of onderwijskundige ontwikkelingen, zulks met inachtneming van het bepaalde in
      [artikel 76m, eerste lid, onderdelen c en d][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76m
        hoofdstuk: I
        afdeling: IA
  - number: 76k.1.d
    text: |-
      op andere wijze dan is gewenst redelijkerwijs in de behoefte aan huisvesting kan worden voorzien, onder meer
      doordat binnen redelijke afstand van de gewenste plaats van de voorziening gebruik dan wel medegebruik mogelijk is,
      of een reeds voor bekostiging in aanmerking gebracht gebouw of deel daarvan beschikbaar komt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76k
  - number: 76k.1.e
    text: |-
      het bekostigingsplafond, bedoeld in [artikel 76d][ref1], niet toereikend is voor de te verstrekken voorzieningen
      voor scholen als bedoeld in het [eerste lid, onderdelen a, b en c, van dat artikel][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
  - number: 76k.1.f
    text: de gewenste voorziening anders dan op grond van de onderdelen b tot en met d niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76k
  - number: 76k.2
    text: |-
      Een voorziening in de huisvesting kan tevens worden geweigerd, indien de voorziening als gevolg van het verwijtbaar
      nalaten van noodzakelijk onderhoud in een slechte bouwkundige staat verkeert of indien de voorziening nodig is voor
      herstel van schade die is veroorzaakt door schuld of toedoen van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76k
  - number: 76l
    text: |-
      Voorzieningen die in het programma, bedoeld in [artikel 76f,][ref1] zijn opgenomen, komen voor bekostiging in
      aanmerking, mits op het tijdstip dat daarvoor op grond van [artikel 76j][ref2] is vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76j
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76l
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76j
        hoofdstuk: I
        afdeling: IA
  - number: 76l.a
    text: is voldaan aan de bij of krachtens de wet gestelde voorschriften, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76l
  - number: 76l.b
    text: |-
      de feiten en omstandigheden waarin de school verkeert, ten opzichte van de feiten en omstandigheden ten tijde van
      de vaststelling van het programma niet ingrijpend zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76l
  - number: 76m.1
    text: 'De gemeenteraad stelt bij verordening een regeling vast met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76m
  - number: 76m.1.a
    text: |-
      de voorzieningen die ingevolge [artikel 76c][ref1] voor bekostiging in aanmerking kunnen worden gebracht,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76c
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76m
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76c
        hoofdstuk: I
        afdeling: IA
  - number: 76m.1.b
    text: de oppervlakte en de indeling van schoolgebouwen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76m
  - number: 76m.1.c
    text: de urgentiecriteria,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76m
  - number: 76m.1.d
    text: de prognosecriteria,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76m
  - number: 76m.1.e
    text: |-
      de termijn bedoeld in [artikel 76j][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76j
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76m
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76j
        hoofdstuk: I
        afdeling: IA
  - number: 76m.1.f
    text: de procedure met betrekking tot verhuur en het medegebruik van ruimten voor het onderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76m
  - number: 76m.1.g
    text: |-
      de termijn gedurende welke een gebouw of terrein voor een school of nevenvestiging nog ten hoogste kan worden
      gebruikt bij toepassing van [artikel 76u][ref1], alsmede de procedure in verband met een eventueel op te maken
      staat van onderhoud, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76u
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76m
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76u
        hoofdstuk: I
        afdeling: IA
  - number: 76m.1.h
    text: |-
      de gegevens bedoeld in [artikel 76w][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76w
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76m
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76w
        hoofdstuk: I
        afdeling: IA
  - number: 76m.2
    text: |-
      De regeling wordt zodanig vastgesteld dat kan worden voldaan aan de redelijke eisen die het onderwijs aan de
      huisvesting van scholen in de gemeente stelt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76m
  - number: 76m.3
    text: |-
      De gemeenteraad stelt normen vast aan de hand waarvan de bedragen worden vastgesteld voor de toegekende
      voorzieningen in de huisvesting.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76m
  - number: 76m.4
    text: |-
      Burgemeester en wethouders betalen volgens door hen te stellen regels de bedragen aan de hand van de door de
      gemeenteraad gestelde normen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76m
  - number: 76m.5
    text: |-
      De gemeenteraad stelt de regeling, bedoeld in het eerste lid, dan wel een wijziging daarvan, niet vast dan nadat
      daarover op overeenstemming gericht overleg is gevoerd met door de bevoegde gezagsorganen van de andere dan
      gemeentelijke scholen in de gemeente aan te wijzen vertegenwoordigers. De gemeenteraad stelt daartoe een procedure
      vast.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76m
  - number: 76m.6
    text: |-
      Tijdens het in het vijfde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling of wijziging van de gemeentelijke verordening in relatie tot de vrijheid van richting
      en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd dan wel uit
      eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies
      wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met de verordening
      of de wijziging daarvan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76m
  - number: 76n.1
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school geeft opdracht de voorziening in de huisvesting
      waartoe op grond van de [artikelen 76f][ref1] en [76i][ref2] kan worden overgegaan, tot stand te brengen met
      daartoe door de gemeente beschikbaar te stellen gelden, tenzij het met burgemeester en wethouders overeenkomt dat
      de gemeente deze voorziening tot stand brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76i
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76n
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76i
        hoofdstuk: I
        afdeling: IA
  - number: 76n.2
    text: |-
      Indien de gemeente de voorziening in de huisvesting van een andere dan een gemeentelijke school tot stand
      heeft gebracht, worden gebouw en terrein aan het bevoegd gezag in eigendom overgedragen, tenzij burgemeester en
      wethouders en het bevoegd gezag anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76n
  - number: 76n.3
    text: |-
      Indien de voorziening in de huisvesting, bedoeld in het tweede lid, niet voldoet aan de eisen voor
      eigendomsoverdracht, geven burgemeester en wethouders deze aan het bevoegd gezag in gebruik.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76n
  - number: 76o
    text: |-
      Tenzij het bevoegd gezag van een andere dan een gemeentelijke school dat aanspraak heeft op bekostiging van
      een voorziening in de huisvesting, met burgemeester en wethouders overeenkomt dat de gemeente deze voorziening
      tot stand brengt, behoeven de bouwplannen en de desbetreffende begrotingen de instemming van burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76o
  - number: 76p
    text: |-
      De gemeente brengt een voorziening in de huisvesting van een andere dan een gemeentelijke school slechts tot stand,
      indien tussen burgemeester en wethouders en het bevoegd gezag overeenstemming bestaat over de bouwplannen en de
      wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76p
  - number: 76q.1
    text: |-
      Het bevoegd gezag is verplicht het gebouw en terrein, alsmede de roerende zaken waarvoor bekostiging wordt genoten,
      behoorlijk te gebruiken en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76q
  - number: 76q.2
    text: |-
      Vervreemding door het bevoegd gezag van een andere dan een gemeentelijke school anders dan op grond van de
      [artikelen 42c][ref1] en [50][ref2], van gebouwen, terreinen en roerende zaken waarvoor bekostiging wordt genoten,
      of bezwaren met een zakelijk recht door het bevoegd gezag van een andere dan een gemeentelijke school van zodanige
      gebouwen en terreinen is zonder toestemming van burgemeester en wethouders nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel42c
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel50
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76q
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 42c
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '50'
        hoofdstuk: III
        afdeling: I
  - number: 76q.3
    text: |-
      Het tweede lid is niet van toepassing ten aanzien van het recht van opstal ten behoeve van een door de gemeente te
      plaatsen tijdelijke voorziening in de huisvesting op grond die eigendom is van het bevoegd gezag van de betrokken
      school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76q
  - number: 76r.1
    text: |-
      Burgemeester en wethouders zijn bevoegd een gedeelte van een gebouw of terrein dat tijdelijk of gedurende een
      gedeelte van de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd als huisvesting voor
      een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde voortgezet onderwijs, of voor
      educatie als bedoeld in de [Wet educatie en beroepsonderwijs][ref1] dan wel voor andere culturele, maatschappelijke
      of recreatieve doeleinden te bestemmen. Het voorgenomen gebruik dient zich te verdragen met het onderwijs aan de
      in het gebouw gevestigde school. Tevens zijn burgemeester en wethouders bevoegd ten behoeve van het onderwijs in
      lichamelijke opvoeding of expressie-activiteiten een gebouw of terrein dan wel een gedeelte daarvan dat tijdelijk
      gedurende gedeelten van de dag of in het geheel niet nodig zal zijn voor de daar gevestigde school, gedurende
      die tijd als huisvesting voor een andere school, voor ander uit de openbare kas bekostigd onderwijs, niet zijnde
      voortgezet onderwijs, of voor educatie als bedoeld in de [Wet educatie en beroepsonderwijs][ref2] dan wel voor
      andere culturele, maatschappelijke of recreatieve doeleinden te bestemmen. Burgemeester en wethouders zijn bevoegd
      een sportterrein, buiten de tijden dat het terrein voor het voortgezet onderwijs wordt gebruikt, gedurende die tijd
      te bestemmen voor culturele, maatschappelijke of recreatieve doeleinden, op zodanige wijze dat het zich verdraagt
      met het onderwijs dat op het terrein wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76r
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0007625
  - number: 76r.2
    text: |-
      Indien het gebouw of terrein in gebruik is voor een andere dan een gemeentelijke school, plegen burgemeester en
      wethouders vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met het bevoegd gezag van de
      andere school of nevenvestiging waarvoor de huisvesting is bestemd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76r
  - number: 76s.1
    text: |-
      Voor zover artikel 76r geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw of terrein
      in gebruik geven ten behoeve van uit de openbare kas bekostigd onderwijs dan wel voor andere culturele,
      maatschappelijke of recreatieve doeleinden. Voor zover niet nodig voor uit de openbare kas bekostigd onderwijs,
      kan het bevoegd gezag een gedeelte van het gebouw of terrein verhuren aan een derde, voor zover het gehuurde niet
      bestemd zal zijn als woon- of bedrijfsruimte als bedoeld in de artikelen 1623a, tweede lid, en 1624, tweede lid,
      van het Burgerlijk Wetboek. Indien het een andere dan een gemeentelijke school betreft, is voor verhuur toestemming
      van burgemeester en wethouders vereist.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76s
  - number: 76s.2
    text: 'De ingebruikgeving of verhuur ingevolge het eerste lid eindigt:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76s
  - number: 76s.2.a
    text: |-
      indien burgemeester en wethouders gebruik maken van hun bevoegdheid op grond van artikel 76r zonder dat enige
      schadeplicht ontstaat, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76s
  - number: 76s.2.b
    text: indien het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76s
  - number: 76s.3
    text: |-
      Ingebruikgeving of verhuur ingevolge het eerste lid geschiedt niet indien het voorgenomen gebruik zich niet
      verdraagt met het onderwijs aan de in het gebouw gevestigde school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76s
  - number: 76s.4
    text: |-
      Op de ingebruikgeving en verhuur ingevolge het eerste lid zijn de bepalingen van de [Huurwet][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002066
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76s
    references:
      - id: ref1
        bwb_id: BWBR0002066
  - number: 76s.5
    text: |-
      Het zonder toestemming van burgemeester en wethouders verhuren van een gebouw of terrein door het bevoegd
      gezag van een andere dan een gemeentelijke school alsmede elk met dit artikel strijdig beding opgenomen in een
      huurovereenkomst met betrekking tot schoolgebouwen, is nietig.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76s
  - number: 76t
    text: |-
      Voorzieningen aan gebouwen of terreinen in verband met verhuur krachtens de [artikelen 76s][ref1] of [76u][ref2]
      door het bevoegd gezag van een andere dan een gemeentelijke school, komen niet ten laste van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76s
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76u
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76t
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76s
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76u
        hoofdstuk: I
        afdeling: IA
  - number: 76u.1
    text: |-
      Burgemeester en wethouders en het bevoegd gezag van een andere dan een gemeentelijke school dat eigenaar is van
      het gebouw en terrein kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag blijvend heeft opgehouden dan
      wel blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht vatbaar gedeelte daarvan, voor de
      school te gebruiken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76u
  - number: 76u.2
    text: |-
      Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het eerste lid desgevraagd besluiten
      dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor
      eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. De aanvraag om het besluit wordt gedaan
      door burgemeester en wethouders of door het bevoegd gezag van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76u
  - number: 76u.3
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school dat voornemens is gebouwen of terreinen, of
      een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, doet hiervan onverwijld mededeling aan
      burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76u
  - number: 76u.4
    text: |-
      Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, of het in het tweede lid bedoelde besluit
      van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de rechter,
      inhoudende een besluit als bedoeld in het tweede lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, wordt de akte, het onherroepelijk geworden besluit onderscheidenlijk de uitspraak, tenzij deze een gebouw
      betreft als bedoeld in artikel 28 van de Overgangswet W.V.O. en waarvoor door het bevoegd gezag van rijkswege
      slechts een rentevergoeding is ontvangen, ingeschreven in de openbare registers, bedoeld in afdeling 2 van titel 1
      van Boek 3 van het Burgerlijk Wetboek. Door de inschrijving verkrijgt de gemeente de eigendom.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76u
  - number: 76u.5
    text: |-
      Burgemeester en wethouders en het bevoegd gezag van een andere dan een gemeentelijke school dat eigenaar is van het
      schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het gebouw dat niet vatbaar is voor
      eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76u
  - number: 76u.6
    text: |-
      Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het vijfde lid desgevraagd besluiten
      dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs
      nodig zal zijn. De aanvraag om het besluit wordt gedaan door burgemeester en wethouders of door het bevoegd gezag
      van de school. Alvorens op de aanvraag te besluiten, horen gedeputeerde staten de wederpartij.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76u
  - number: 76u.7
    text: |-
      Zodra de in het vijfde lid bedoelde akte door beide partijen is getekend, of het in het zesde lid bedoelde besluit
      van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de rechter,
      inhoudende een beslissing als bedoeld in het zesde lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, kan het bevoegd gezag van een andere dan een gemeentelijke school het desbetreffende gedeelte van het
      gebouw met toestemming van burgemeester en wethouders verhuren.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76u
  - number: 76u.8
    text: |-
      De toestemming, bedoeld in het zevende lid, wordt verleend voor een tijdvak van ten hoogste 3 jaren. Op verzoek van
      het bevoegd gezag kan dit tijdvak telkens worden verlengd met een termijn van ten hoogste 3 jaren.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76u
  - number: 76u.9
    text: |-
      De [Huurwet][ref1] is niet van toepassing op de verhuur, bedoeld in het zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002066
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76u
    references:
      - id: ref1
        bwb_id: BWBR0002066
  - number: 76v
    text: |-
      In afwijking van het bepaalde in dit hoofdstuk kan de gemeenteraad met het bevoegd gezag van een andere dan een
      gemeentelijke school, onder door de gemeenteraad te stellen voorwaarden, overeenkomen dat de gemeenteraad aan
      het bevoegd gezag ten behoeve van de door het bevoegd gezag op het grondgebied van die gemeente in stand gehouden
      school een jaarlijks bedrag voor huisvestingskosten betaalt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76v
  - number: 76w
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school is gehouden aan de gemeente alle inlichtingen te
      verschaffen die de gemeente voor een adequate uitvoering van de bepalingen in dit hoofdstuk noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76w
  - number: 76x
    text: |-
      De artikelen 76y en 76z zijn slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld in
      afdeling IV van titel II van dit deel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76x
  - number: 76y.1
    text: |-
      De voorzieningen in de huisvesting en de inventaris komen slechts voor bekostiging in aanmerking, voor zover Onze
      minister met de voorzieningen heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76y
  - number: 76y.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de
      uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76y
  - number: 76y.3
    text: |-
      Onze minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij of krachtens de algemene maatregel van bestuur bedoeld in het tweede lid regels omtrent de
      verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76y
  - number: 76z
    text: |-
      Tegen een besluit van Onze minister ingevolge deze afdeling kan een belanghebbende beroep instellen bij de Afdeling
      bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel76z
  - number: '77.1'
    text: |-
      De scholen, bedoeld in afdeling I van titel II van dit deel worden door het Rijk bekostigd met inachtneming van de
      artikelen 76y, 76z en 78 tot en met 106. De uitgaven, bedoeld in de artikelen 96g en 96h, alsmede de bedragen die
      de gemeente krachtens deze wet in aanvulling op de rijksbekostiging verstrekt, blijven ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel77
  - number: '77.2'
    text: |-
      Aan niet door de gemeente in stand gehouden scholen als bedoeld in afdeling I van titel II van dit deel wordt uit
      de openbare kas geen bekostiging verstrekt dan krachtens de bepalingen van dit deel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel77
  - number: '77.3'
    text: |-
      Met betrekking tot een scholengemeenschap of een school en de daaraan verbonden cursussen in de zin van artikel
      75b, eerste lid, alsmede met betrekking tot de scholen voor praktijkonderwijs kunnen zo nodig in afwijking van
      het bepaalde in deze afdeling bij of krachtens algemene maatregel van bestuur voorschriften worden gegeven voor de
      toepassing van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel77
  - number: '77.5'
    text: |-
      Voor de toepassing van deze afdeling zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      artikel 42b of een openbare rechtspersoon als bedoeld in artikel 42a, tenzij het tegendeel blijkt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel77
  - number: '78'
    text: 'De kosten van de scholen zijn:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel78
  - number: 78.a
    text: huisvestingskosten,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel78
  - number: 78.b
    text: inventariskosten,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel78
  - number: 78.c
    text: personeelskosten,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel78
  - number: 78.d
    text: nascholingskosten, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel78
  - number: 78.e
    text: exploitatiekosten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel78
  - number: '79'
    text: |-
      De artikelen 80 tot en met 83 zijn slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld in
      afdeling IV van titel II van dit deel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel79
  - number: '80.1'
    text: 'Bij ministeriële regeling worden programma''s van eisen vastgesteld die de grondslag vormen voor de bekostiging van:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel80
  - number: 80.1.a
    text: de blijvende voorzieningen in de huisvesting voor een school,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel80
  - number: 80.1.b
    text: de tijdelijke voorzieningen in de huisvesting voor een school, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel80
  - number: 80.1.c
    text: de voorzieningen in de inventaris.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel80
  - number: '80.2'
    text: 'Elk programma van eisen omvat:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel80
  - number: 80.2.a
    text: een omschrijving van de in aanmerking genomen componenten waaruit de voorzieningen zijn opgebouwd,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel80
  - number: 80.2.b
    text: de daarvoor noodzakelijk geachte bedragen, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel80
  - number: 80.2.c
    text: de wijze waarop de voor elke voorziening vast te stellen bekostiging wordt berekend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel80
  - number: '80.3'
    text: |-
      Een programma van eisen kan er in voorzien dat voor in dat programma genoemde groepen van scholen de bedragen,
      bedoeld in het tweede lid onderdeel b, hoger worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel80
  - number: '80.4'
    text: De programma's van eisen voldoen aan de redelijke behoeften van een in normale omstandigheden verkerende school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel80
  - number: '80.5'
    text: |-
      Alle ontwerpen van ministeriële regelingen tot vaststelling van de programma's van eisen worden gezamenlijk
      bekendgemaakt in het officiële publikatieblad van het Ministerie van Onderwijs, Cultuur en Wetenschappen. De
      ministeriële regelingen treden niet in werking dan nadat zes weken na die bekendmaking zijn verstreken. De
      ministeriële regelingen worden binnen vier weken na de vaststelling bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel80
  - number: '81.1'
    text: |-
      Het programma van eisen, bedoeld in [artikel 80, eerste lid onderdeel a][ref1], heeft betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel80
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '80'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
  - number: 81.1.a
    text: nieuwbouw,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel81
  - number: 81.1.b
    text: uitbreiding,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel81
  - number: 81.1.c
    text: aanpassing van een gebouw dat als blijvende voorziening in de huisvesting geldt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel81
  - number: 81.1.d
    text: terreinen daaronder begrepen vestiging van erfpacht en andere beperkte rechten, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel81
  - number: 81.1.e
    text: te verwerven gebouwen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel81
  - number: '81.2'
    text: |-
      Het programma van eisen, bedoeld in [artikel 80, eerste lid onderdeel b][ref1], heeft betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel80
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '80'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
  - number: 81.2.a
    text: nieuwbouw van tijdelijke lokalen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel81
  - number: 81.2.b
    text: verplaatsing van tijdelijke lokalen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel81
  - number: 81.2.c
    text: huur van gebouwen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel81
  - number: 81.2.d
    text: huur van terreinen, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel81
  - number: 81.2.e
    text: te verwerven gebouwen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel81
  - number: '81.3'
    text: |-
      Het programma van eisen, bedoeld in [artikel 80, eerste lid onderdeel c][ref1], heeft betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel80
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '80'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
  - number: 81.3.a
    text: schoolmeubelen, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel81
  - number: 81.3.b
    text: leer- en hulpmiddelen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel81
  - number: '81.4'
    text: |-
      De programma's van eisen, bedoeld in het eerste tot en met derde lid, hebben tevens betrekking op herstel van
      schade.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel81
  - number: '82.1'
    text: |-
      Een wijziging van een ministeriële regeling als bedoeld in artikel 80 wordt bekendgemaakt in het officiële
      publikatieblad van het Ministerie van Onderwijs, Cultuur en Wetenschappen voor 1 augustus van het jaar voorafgaand
      aan het jaar waarop die wijziging betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel82
  - number: '82.2'
    text: |-
      Het ontwerp van de in het eerste lid bedoelde regeling wordt bekendgemaakt in het in dat lid genoemde
      publikatieblad. De ministeriële regeling treedt niet in werking dan nadat vier weken na die bekendmaking zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel82
  - number: '83.1'
    text: |-
      Indien bijzondere ontwikkelingen in het onderwijs daartoe aanleiding geven, kan Onze minister op verzoek van het
      bevoegd gezag van een school voor een door hem te bepalen periode en een door hem te bepalen doel aanvullende
      bekostiging voor huisvestings- en inventariskosten verstrekken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel83
  - number: '83.2'
    text: |-
      Indien voor de kosten, bedoeld in artikel 81, eerste lid onderdeel e en tweede lid onderdeel e, de vastgestelde
      normbedragen niet toereikend zijn, kan Onze minister op verzoek van het bevoegd gezag van een school voor een door
      hem te bepalen periode aanvullende bekostiging verstrekken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel83
  - number: '83.3'
    text: |-
      Onze minister besluit binnen negen maanden na ontvangst van een verzoek. Indien de beschikking niet binnen negen
      maanden kan worden gegeven, stelt Onze minister de verzoeker daarvan in kennis en noemt hij daarbij een termijn
      waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel83
  - number: '83.4'
    text: |-
      Onze minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel83
  - number: '84.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor de scholen voor voorbereidend wetenschappelijk
      onderwijs, voor hoger algemeen voortgezet onderwijs, voor middelbaar algemeen voortgezet onderwijs en voor
      voorbereidend beroepsonderwijs de grondslagen vastgesteld voor de omvang van de formatie van:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel84
  - number: 84.1.a
    text: de rectoren, directeuren, conrectoren en adjunct-directeuren,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel84
  - number: 84.1.b
    text: de leraren, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel84
  - number: 84.1.c
    text: het onderwijsondersteunend personeel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel84
  - number: '84.2'
    text: |-
      De grondslagen van de berekening van de omvang van de formatie worden wat het in het eerste lid onder a, b en c
      genoemde personeel betreft in elk geval gevormd door:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel84
  - number: 84.2.a
    text: |-
      een normatieve relatie tussen het aantal leerlingen en het aantal personeelsleden van de school, onderscheiden naar
      personeelscategorieën, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel84
  - number: 84.2.b
    text: een opslag in verband met formatieve fricties en vanwege herbezetting in verband met arbeidsduurverkorting.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel84
  - number: '84.3'
    text: |-
      De grondslagen worden wat het in het eerste lid onder b genoemde personeel betreft bovendien gevormd door een vast
      aantal formatieplaatsen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel84
  - number: '84.4'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, wordt aan de beide Kamers der Staten-Generaal
      overgelegd. Een maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel84
  - number: 84b.1
    text: |-
      Aan de scholen, bedoeld in [artikel 84, eerste lid][ref1], wordt in verband met de kosten van vervanging van
      personeel en de kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen
      wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref2]
      bekostiging verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel84b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '84'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001888
  - number: 84b.2
    text: |-
      De omvang van de in het eerste lid bedoelde bekostiging bedraagt een jaarlijks bij ministeriële
      regeling vast te stellen percentage van de bekostiging van de salarissen die onderdeel zijn van de in
      [artikel 85, eerste lid][ref1], bedoelde gemiddelde personeelslast. Bij ministeriële regeling kan het percentage,
      bedoeld in de eerste volzin, tussentijds worden gewijzigd. De ministeriële regeling kan vaststellen welk deel van
      de bekostiging van de salarissen wordt gehanteerd bij de berekening, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel84b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '85'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: '85.1'
    text: |-
      De vergoeding van de kosten van het in [artikel 84][ref1] bedoelde personeel wordt vastgesteld door de krachtens
      [artikel 84][ref2] vastgestelde formatie te vermenigvuldigen met een gemiddelde personeelslast, met inachtneming
      van ter zake bij of krachtens de in [artikel 84, eerste lid][ref3], bedoelde algemene maatregel van bestuur vast
      te stellen voorschriften. De gemiddelde personeelslast is het genormeerde bedrag van de personele middelen per
      formatieplaats voor elke personeelscategorie, in welk bedrag tevens zijn verwerkt incidentele loonontwikkelingen en
      algemene salarismaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel84
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '84'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '84'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '84'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: '85.2'
    text: |-
      Onder de personele middelen worden verstaan de middelen ten behoeve van de salarissen, toelagen, uitkeringen,
      overhevelingstoeslagen en vergoedingen ten behoeve van personeel van de scholen, alsmede de bijdragen tot hun
      pensioen en tot dat van hun nagelaten betrekkingen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel85
  - number: '85.3'
    text: De gemiddelde personeelslast kan per schoolsoort verschillen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel85
  - number: '85.4'
    text: |-
      De gemiddelde personeelslast van de personeelscategorie van de leraren wordt per schoolsoort jaarlijks vastgesteld
      met inachtneming van de landelijke gewogen gemiddelde leeftijd van deze personeelscategorie van die schoolsoort. De
      in de eerste volzin bedoelde gemiddelde personeelslast wordt voorts per school gecorrigeerd voor de mate waarin de
      gewogen gemiddelde leeftijd van de personeelscategorie van de leraren van die school afwijkt van de desbetreffende
      in de eerste volzin bedoelde gewogen gemiddelde leeftijd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel85
  - number: '85.5'
    text: |-
      Bij ministeriële regeling wordt de gemiddelde personeelslast vastgesteld en worden nadere regels vastgesteld met
      betrekking tot de in het vierde lid bedoelde correctie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel85
  - number: 85a.1
    text: |-
      Indien bijzondere ontwikkelingen in het voorbereidend wetenschappelijk onderwijs, het algemeen voortgezet onderwijs
      of het voorbereidend beroepsonderwijs daartoe aanleiding geven, kunnen bij ministeriële regeling voorschriften
      worden vastgesteld omtrent het verstrekken van aanvullende bekostiging voor personeelskosten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel85a
  - number: 85a.2
    text: |-
      In verband met bijzondere omstandigheden kan Onze minister op verzoek van het bevoegd gezag van een in het
      eerste lid bedoelde school en onder door hem te stellen voorwaarden aanvullende bekostiging voor personeelskosten
      verstrekken
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel85a
  - number: 85a.3
    text: |-
      Een aanvraag als bedoeld in het tweede lid wordt ingediend in het schooljaar waarin de bijzondere omstandigheden
      zich hebben aangediend. Onze minister besluit binnen zes maanden na ontvangst van een in het tweede lid bedoelde
      aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze minister de aanvrager
      daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel85a
  - number: 85a.4
    text: |-
      Onze minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel85a
  - number: 85a.5
    text: |-
      Onze minister kan in verband met de in het tweede lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel85a
  - number: 85b
    text: |-
      De grondslag van de omvang van de bekostiging voor nascholing aan scholen voor voorbereidend
      wetenschappelijk onderwijs, scholen voor hoger algemeen voortgezet onderwijs, scholen voor middelbaar
      algemeen voortgezet onderwijs en scholen voor voorbereidend beroepsonderwijs is de op grond van
      [artikel 84, eerste lid, aanhef en onder b][ref1], vastgestelde formatie van leraren en, voor zover bij
      ministeriële regeling aangewezen, de ingevolge [artikel 85a][ref2] verstrekte aanvullende bekostiging. Bij
      ministeriële regeling wordt een bekostigingsbedrag per formatieplaats vastgesteld dat per schoolsoort kan
      verschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel85a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel85b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '84'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 85a
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: '86.1'
    text: 'De bekostiging voor de exploitatiekosten van de scholen heeft betrekking op de volgende componenten:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: 86.1.a
    text: onderhoud,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: 86.1.b
    text: energie- en waterverbruik,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: 86.1.c
    text: middelen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: 86.1.d
    text: administratie, beheer en bestuur,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: 86.1.e
    text: loopbaanoriëntatie en -begeleiding,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: 86.1.f
    text: schoonmaken,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: 86.1.g
    text: |-
      bouwkundige aanpassingen, voor zover niet op grond van titel III, afdeling IA, hoofdstuk I, behorend tot de zorg
      van de gemeenteraad, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: 86.1.h
    text: publiekrechtelijke heffingen, met uitzondering van belastingen ter zake van onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: '86.2'
    text: |-
      De bekostiging wordt zodanig vastgesteld dat zij voldoet aan de redelijke behoeften van een in normale
      omstandigheden verkerende school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: '86.3'
    text: 'De bekostiging omvat:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: 86.3.a
    text: een vast bedrag per school,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: 86.3.b
    text: een bedrag dat afhankelijk is van de normatieve ruimtebehoefte per leerling, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: 86.3.c
    text: een bedrag dat afhankelijk is van het aantal leerlingen van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: '86.4'
    text: |-
      De in het derde lid onder a tot en met c bedoelde bedragen kunnen per schoolsoort en per groep van leerlingen
      verschillen. De in het derde lid onder b en c bedoelde bedragen kunnen bovendien verschillen voor:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: 86.4.a
    text: de eerste twee leerjaren van de school, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: 86.4.b
    text: de overige leerjaren.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: '86.5'
    text: |-
      Bij ministeriële regeling worden jaarlijks voor 1 februari de in het derde lid onder a tot en met c bedoelde
      bedragen vastgesteld. Bij deze regeling worden tevens nadere voorschriften gegeven omtrent de wijze waarop de
      bekostiging wordt berekend, alsmede voorschriften omtrent de wijze waarop de bekostiging wordt vastgesteld. De
      vastgestelde bedragen gelden voor het schooljaar dat aanvangt na het tijdstip van vaststelling.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: '86.6'
    text: |-
      Bij de vaststelling van de in het derde lid onder a tot en met c bedoelde bedragen, dan wel als tussentijdse
      aanpassing van die bedragen, worden volgens bij ministeriële regeling te geven regels loon- en prijsontwikkelingen
      verwerkt, tenzij de toestand van 's Rijks schatkist zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: '86.7'
    text: |-
      De ministeriële regeling, bedoeld in het vijfde lid, wordt bekendgemaakt in het officiële publicatieblad van het
      Ministerie van Onderwijs, Cultuur en Wetenschappen, onder gelijktijdige overlegging aan de Tweede Kamer der Staten-
      Generaal. Van de bekendmaking wordt mededeling gedaan in de Staatscourant. De ministeriële regeling treedt niet
      eerder in werking dan nadat 4 weken zijn verstreken na het overleggen aan de Tweede Kamer en gedurende die termijn
      niet door of namens de Kamer de wens tot overleg over de regeling te kennen wordt gegeven, dan wel met de Tweede
      Kamer overleg is gevoerd. De eerste tot en met derde volzin zijn van overeenkomstige toepassing ten aanzien van
      tussentijdse aanpassingen als bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel86
  - number: '89.1'
    text: |-
      Indien bijzondere ontwikkelingen in het voorbereidend wetenschappelijk onderwijs, het algemeen voortgezet onderwijs
      of het voorbereidend beroepsonderwijs daartoe aanleiding geven, kunnen bij ministeriële regeling voorschriften
      worden vastgesteld omtrent het verstrekken van aanvullende bekostiging voor exploitatiekosten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel89
  - number: '89.2'
    text: |-
      Indien bijzondere ontwikkelingen in het voorbereidend wetenschappelijk onderwijs, het algemeen voortgezet onderwijs
      of het voorbereidend beroepsonderwijs aan een school daartoe aanleiding geven, kan Onze minister op verzoek van het
      bevoegd gezag onder door hem te stellen voorwaarden en voor een door hem te bepalen periode aanvullende bekostiging
      voor exploitatiekosten verstrekken. Het verzoek wordt ingediend in het kalenderjaar waarin deze ontwikkelingen zijn
      aangevangen. Onze minister besluit binnen vier maanden na ontvangst van het verzoek. Indien de beschikking niet
      binnen vier maanden kan worden gegeven, stelt Onze minister de verzoeker daarvan in kennis en noemt hij daarbij een
      termijn waarop de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel89
  - number: '89.3'
    text: |-
      Onze minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel89
  - number: '89.4'
    text: |-
      Onze minister kan in verband met de in het tweede lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel89
  - number: 96b.1
    text: |-
      Onverminderd het bepaalde in de artikelen 76y en 96c en met inachtneming van het programma van eisen, bedoeld in
      artikel 80, eerste lid, verstrekt het Rijk aan het bevoegd gezag van openbare en bijzondere scholen het bedrag van
      de bekostiging ten behoeve van de voorzieningen, bedoeld in artikel 81.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96b
  - number: 96b.2
    text: |-
      In bij algemene maatregel van bestuur aan te wijzen gevallen worden de kosten van de voorzieningen in de
      huisvesting gedurende een bepaalde periode jaarlijks vergoed. De algemene maatregel van bestuur bevat tevens
      voorschriften over de lengte van de periode en de aard van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96b
  - number: 96b.3
    text: |-
      In geval van verstrekking van aanvullende bekostiging als bedoeld in artikel 83 verstrekt het Rijk aan het bevoegd
      gezag van openbare en bijzondere scholen het bedrag van deze bekostiging.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96b
  - number: 96b.4
    text: |-
      Het eerste tot en met derde lid zijn slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld
      in afdeling IV van titel II van dit deel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96b
  - number: 96c.1
    text: |-
      Onverminderd het bepaalde in artikel 76y en met inachtneming van het programma van eisen, bedoeld in artikel 80,
      eerste lid, verstrekt het Rijk een bekostigingsbedrag aan de gemeente voor het bevoegd gezag van een andere dan een
      gemeentelijke school volgens bij algemene maatregel van bestuur te stellen regels ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96c
  - number: 96c.1.a
    text: |-
      de kosten van gebouwen en terreinen die gesticht zijn ten behoeve van educatie en beroepsonderwijs als bedoeld in
      de [Wet educatie en beroepsonderwijs][ref1], basisonderwijs, speciaal onderwijs of voortgezet speciaal onderwijs en
      herbestemd worden ten behoeve van een andere dan een gemeentelijke school, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96c
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 96c.1.b
    text: |-
      de kosten van het gebruik van gemeentelijke voorzieningen in de huisvesting ten behoeve van het onderwijs in
      lichamelijke oefening, die niet zijn gesticht voor onderwijsdoelen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96c
  - number: 96c.2
    text: |-
      Onverminderd het bepaalde in artikel 76y en met inachtneming van het programma van eisen, bedoeld in artikel 80,
      eerste lid, verstrekt het Rijk voor een openbare of bijzondere school die geheel of gedeeltelijk een gebouw in
      gebruik heeft van het bevoegd gezag van een andere openbare of bijzondere school volgens bij algemene maatregel
      van bestuur te stellen regels, aan dat bevoegd gezag een bekostigingsbedrag ten behoeve van de kosten van de
      voorzieningen die in verband met het gebruik worden getroffen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96c
  - number: 96c.3
    text: |-
      Het eerste en tweede lid zijn slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld in
      afdeling IV van titel II van dit deel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96c
  - number: 96c.1
    text: |-
      De gemeente bekostigt aan het bevoegd gezag van een andere dan een gemeentelijke school dat is onderworpen aan een
      of meer van de in [artikel 220 van de Gemeentewet][ref1] bedoelde belastingen ter zake van onroerende zaken, het
      bedrag dat is uitgegeven voor de belastingen met betrekking tot de in de gemeente gelegen gebouwen en terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96c.1
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
  - number: 96d.1
    text: |-
      Met inachtneming van de artikelen 84 tot en met 85 en 86, eerste lid, verstrekt het Rijk jaarlijks aan het bevoegd
      gezag van openbare en bijzondere scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger algemeen
      voortgezet onderwijs, voor middelbaar algemeen voortgezet onderwijs en voor voorbereidend beroepsonderwijs een
      bekostigingsbedrag ten behoeve van de personeels- en exploitatiekosten gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96d
  - number: 96d.2
    text: |-
      In geval van het verstrekken van aanvullende bekostiging als bedoeld in artikel 85a of artikel 89 verstrekt het
      Rijk aan het desbetreffende bevoegd gezag het bedrag van deze bekostiging.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96d
  - number: 96d.2
    text: |-
      Met inachtneming van het bepaalde in artikel 85b verstrekt het Rijk jaarlijks aan het bevoegd gezag van openbare
      en bijzondere scholen voor voorbereidend wetenschappelijk onderwijs, voor algemeen voortgezet onderwijs en voor
      voorbereidend beroepsonderwijs een bedrag ten behoeve van nascholing van het personeel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96d.2
  - number: 96g.1
    text: |-
      Indien in een gemeente uitsluitend een of meer andere rechtspersonen dan de gemeente openbare scholen in stand
      houden dan wel openbare scholen ontbreken en de gemeente uitgaven wil doen voor het desbetreffende onderwijs welke
      niet door het Rijk worden bekostigd, stelt de gemeenteraad onverminderd [artikel 118b, eerste lid][ref1], bij
      verordening een regeling daarvoor vast en zijn de [artikelen 96i tot en met 96k][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118b
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
  - number: 96g.2
    text: |-
      De regeling, bedoeld in het eerste lid, maakt geen onderscheid tussen openbaar en bijzonder onderwijs en voorziet
      in een behandeling van scholen naar dezelfde maatstaf.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96g
  - number: 96g.3
    text: |-
      De regeling, bedoeld in het eerste lid, bevat in elk geval de voorzieningen die door het bevoegd gezag van een in
      de gemeente gelegen, niet door de gemeente in stand gehouden school kunnen worden aangevraagd en de procedure voor
      het doen van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96g
  - number: 96g.4
    text: |-
      De gemeenteraad kan besluiten dat burgemeester en wethouders de regeling, bedoeld in het eerste lid, tijdelijk
      kunnen aanvullen met nieuwe voorzieningen. De aanvulling wordt binnen 1 week aan de bevoegde gezagsorganen van de
      niet door de gemeente in stand gehouden scholen gezonden. Binnen 12 weken na de totstandkoming van de aanvulling
      wordt deze voorgelegd aan de gemeenteraad en besluit de gemeenteraad over de bekrachtiging ervan. Indien de
      gemeenteraad niet binnen 12 weken een besluit heeft genomen, wordt de aanvulling gelijkgesteld met een aanvulling
      die is bekrachtigd. Een afwijzing van de aanvulling door de gemeenteraad heeft geen gevolgen voor aanvragen waarop
      reeds is besloten of die reeds zijn ingediend en die voorzieningen betreffen waarop de aanvulling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96g
  - number: 96g.5
    text: |-
      [Artikel 8:2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de regeling, bedoeld in het eerste
      lid, dan wel een wijziging daarvan. In afwijking van [artikel 8:1 van de Algemene wet bestuursrecht][ref2] kan
      tegen een aanvulling als bedoeld in het vierde lid geen beroep worden ingesteld zolang de gemeenteraad deze nog
      niet heeft bekrachtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 96g.6
    text: |-
      Voor de toepassing van dit artikel wordt een nevenvestiging aangemerkt als een nevenvestiging die is gelegen in
      de gemeente van de hoofdvestiging. De gemeenteraad kan besluiten dat in de gemeente gelegen nevenvestigingen van
      scholen waarvan de hoofdvestiging is gelegen in een andere gemeente in afwijking van de eerste volzin in aanmerking
      komen voor een of meer van de in de regeling genoemde voorzieningen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96g
  - number: 96g.7
    text: |-
      Burgemeester en wethouders maken jaarlijks in een van overheidswege uitgegeven blad of een dag-, nieuws- of huis-
      aan-huisblad, dan wel op een andere geschikte wijze, een overzicht bekend van de op grond van de regeling, bedoeld
      in het eerste lid, toegekende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96g
  - number: 96h.1
    text: |-
      Indien een gemeente zelf een of meer openbare scholen in stand houdt en zij uitgaven wil doen ten behoeve van het
      voorbereidend wetenschappelijk onderwijs, het algemeen voortgezet onderwijs, het voorbereidend beroepsonderwijs
      of het praktijkonderwijs welke niet door het Rijk worden bekostigd, kan de gemeenteraad onverminderd
      [artikel 118b, eerste lid][ref1], daarvoor bij verordening een regeling vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118b
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118b
  - number: 96h.2
    text: |-
      [Artikel 96g, tweede tot en met zevende lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96g
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96g
        hoofdstuk: III
        paragraaf: '6'
        afdeling: II
  - number: 96i.1
    text: |-
      Indien een gemeente een of meer scholen in stand houdt, stelt de gemeenteraad jaarlijks met betrekking tot die
      scholen voorlopig vast:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.1.a
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      personeelskosten,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.1.b
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      nascholingskosten,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.1.c
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      exploitatiekosten,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.1.d
    text: het totaal van de ontvangsten, bedoeld in artikel 85,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.1.e
    text: |-
      het totaal van de ontvangsten dat is gebaseerd op de vergoeding van de kosten van de in artikel 85b bedoelde
      nascholing,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.1.f
    text: |-
      het totaal van de ontvangsten dat is gebaseerd op de bedragen die krachtens artikel 86 voor de exploitatiekosten
      voor dat kalenderjaar zijn vastgesteld, alsmede de bedragen die krachtens artikel 99, tweede lid tweede volzin,
      voor voorzieningen in de exploitatie worden aangewend,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.1.g
    text: |-
      het totaal van de aanvullende ontvangsten waaronder worden verstaan de bedragen die krachtens artikel 89 voor de
      exploitatiekosten voor dat kalenderjaar zijn vastgesteld,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.1.h
    text: |-
      het bedrag dat de gemeente in het voorafgaande kalenderjaar heeft uitgegeven ten behoeve van de instandhouding van
      een rechtspersoon als bedoeld in artikel 53b, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.1.i
    text: een staat van voorzieningen die zijn ingesteld ten behoeve van het openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.2
    text: |-
      Indien de gemeente een deel van de ontvangsten, bedoeld in het eerste lid onderdeel d, of een deel van de
      ontvangsten, bedoeld in onderdeel e van dat lid, dan wel een deel van de ontvangsten, bedoeld in de onderdelen
      f of g van dat lid, toevoegt aan een voorziening, wordt dat deel aangemerkt als een uitgave als bedoeld in dat
      lid onderdeel a, onderscheidenlijk als een uitgave als bedoeld in de onderdelen b, c of h van dat lid. Indien de
      gemeente bedragen aan een voorziening onttrekt, worden deze aangemerkt als ontvangsten, bedoeld in het eerste lid
      onderdeel d, onderscheidenlijk als ontvangsten als bedoeld in de onderdelen e, f of g van dat lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.3
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen c, f, g en h, worden buiten beschouwing
      gelaten de uitgaven en ontvangsten voor administratie, beheer en bestuur, bedoeld in artikel 86, eerste lid,
      onderdeel d, alsmede het bedrag dat door de gemeente met toepassing van artikel 118b, eerste lid, ter zake van
      exploitatiekosten is uitgegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.4
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid onderdeel a en d, worden buiten beschouwing gelaten
      de bedragen die door de gemeente met toepassing van artikel 118b, eerste lid, in het voorafgaande kalenderjaar
      zijn uitgegeven ten behoeve van de personeelskosten, onderscheidenlijk de daarop betrekking hebbende ontvangsten.
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen a, b, c en h worden voorts buiten
      beschouwing gelaten de uitgaven die worden gedekt door ontvangsten van bedragen die door derden zijn betaald, de
      uitgaven die worden gedekt door ontvangsten op grond van een besluit als bedoeld in artikel 96g, zesde lid, tweede
      volzin, en de uitgaven voor de voorzieningen waarvoor het bevoegd gezag van een niet door de gemeente in stand
      gehouden school op grond van de regeling, bedoeld in artikel 96h, eerste lid, een aanvraag bij de gemeente kon
      indienen en wel gedurende de periode waarvoor een dergelijke aanvraag kon worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.5
    text: |-
      Indien de gemeente een deel van de bekostiging voor personeels- en exploitatiekosten overdraagt aan een ander
      bevoegd gezag, wordt dat deel aangemerkt als een uitgave als bedoeld in het eerste lid, onderdeel a of onderdeel
      c. Indien door een ander bevoegd gezag een deel van de bekostiging voor personeels- en exploitatiekosten aan de
      gemeente wordt overgedragen, wordt dat deel aangemerkt als een ontvangst als bedoeld in het eerste lid, onderdeel
      d, of onderdeel f.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.6
    text: |-
      Om de vijf jaar stelt de gemeenteraad voorlopig vast het totaal van de vastgestelde uitgaven en ontvangsten in de
      voorafgaande vijf kalenderjaren, zoals in het eerste tot en met vijfde lid is aangegeven. Indien de uitgaven hoger
      zijn dan de ontvangsten, bepaalt de gemeenteraad tevens het bedrag van de overschrijding. Indien een gemeente vanaf
      een tijdstip binnen een periode van vijf jaar als bedoeld in de eerste volzin geen school in stand houdt, stelt
      de gemeenteraad in afwijking van die volzin zo spoedig mogelijk na dat tijdstip voorlopig vast het totaal van de
      vastgestelde uitgaven en ontvangsten in het aan dat tijdstip voorafgaande deel van de periode van vijf jaar, zoals
      in het eerste tot en met vijfde lid is aangegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.7
    text: |-
      Na sluiting van de rekening van de gemeente stelt de gemeenteraad de in het eerste en zesde lid bedoelde bedragen,
      zo nodig gewijzigd, vast. In het geval de uitgaven hoger zijn dan de ontvangsten, bedoeld in het zesde lid, drukt
      de gemeenteraad vervolgens het bedrag van de overschrijding, bedoeld in genoemd lid, uit in een percentage van het
      totaal van de ontvangsten, bedoeld in het eerste lid onderdelen d tot en met g. Het percentage wordt afgerond tot
      twee decimalen. Afronding naar beneden vindt plaats indien de derde decimaal kleiner is dan 5, en naar boven indien
      deze decimaal ten minste 5 bedraagt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.8
    text: |-
      Voor de toepassing van de artikelen 96i tot en met 96k worden uitgaven ten behoeve van een nevenvestiging
      aangemerkt als uitgaven ten behoeve van de hoofdvestiging van de school waaraan de nevenvestiging is verbonden.
      Indien ten behoeve van een school of nevenvestiging uitgaven worden gedaan door meer dan één gemeente, worden
      deze uitgaven aangemerkt als uitgaven van de gemeente op wier grondgebied de hoofdvestiging is gelegen. In het
      geval, bedoeld in de vorige volzin worden de besluiten ingevolge de artikelen 96i tot en met 96k genomen door
      laatstbedoelde gemeente en hebben deze mede betrekking op de uitgaven van de andere gemeente of gemeenten. Voor de
      toepassing van de artikelen 96i tot en met 96k wordt een nevenvestiging aangemerkt als een nevenvestiging die is
      gelegen in de gemeente van de hoofdvestiging.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96i.9
    text: |-
      De gemeenteraad kan in overeenstemming met het bevoegd gezag van een niet door de gemeente in stand gehouden
      school besluiten dat met betrekking tot een of meer scholen van dat bevoegd gezag uitgaven die de gemeente doet
      ten behoeve van een door haar in stand gehouden school buiten beschouwing worden gelaten bij het vaststellen van de
      bedragen, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96i
  - number: 96j.1
    text: |-
      In het jaar volgend op de definitieve vaststelling, bedoeld in artikel 96i, zevende lid, wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door de gemeente in stand gehouden
      school die gedurende een of meer jaren van het desbetreffende tijdvak in de gemeente was gevestigd, aanspraak
      heeft. Dit overschrijdingsbedrag wordt vastgesteld door het percentage, bedoeld in artikel 96i, zevende lid,
      te vermenigvuldigen met het totaal van de ontvangsten van een niet door de gemeente in stand gehouden school
      dat is gebaseerd op de bedragen die krachtens de artikelen 84, eerste tot en met derde lid, 85, 85a en 86 voor
      het desbetreffende tijdvak zijn vastgesteld, met dien verstande dat bij het vaststellen van het totaal van de
      ontvangsten, bedoeld in de vorige volzin, buiten beschouwing blijven de ontvangsten voor administratie, beheer en
      bestuur, bedoeld in artikel 86, eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96j
  - number: 96j.2
    text: |-
      Indien een gemeente gedurende een gedeelte van het desbetreffende tijdvak een of meer scholen in stand houdt,
      wordt voor het vaststellen van het overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het totaal van
      de ontvangsten van een niet door de gemeente in stand gehouden school over een overeenkomstig gedeelte van het
      desbetreffende tijdvak.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96j
  - number: 96k.1
    text: |-
      Na de voorlopige vaststelling van het bedrag van de overschrijding, bedoeld in [artikel 96i, zesde lid][ref1],
      keren burgemeester en wethouders aan het bevoegd gezag van een niet door de gemeente in stand gehouden school
      dat op grond van [artikel 96j, eerste lid][ref2], aanspraak heeft op een uitkering, een voorschot uit. Het
      voorschot omvat het voorlopig vastgestelde bedrag van de overschrijding, berekend op de wijze als is aangegeven in
      [artikel 96j, eerste en tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96j
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel96j
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96j
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 96j
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
  - number: 96k.2
    text: |-
      Burgemeester en wethouders zijn bevoegd tijdens het vijfjarig tijdvak op verzoek van het bevoegd gezag van een niet
      door de gemeente in stand gehouden school jaarlijks een deel van het naar verwachting uit te betalen voorschot in
      mindering daarop uit te keren.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96k
  - number: 96k.3
    text: |-
      De bekendmaking van de beschikkingen tot voorlopige en definitieve vaststelling van het overschrijdingsbedrag,
      bedoeld in het zesde onderscheidenlijk zevende lid van [artikel 96i][ref1], behelst tevens een staat van de
      voorzieningen als bedoeld in [artikel 96i, eerste lid, onderdeel i][ref2], waarin per kalenderjaar wordt aangegeven
      het verloop van de toevoegingen en de onttrekkingen aan de voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '7'
        afdeling: II
  - number: 96k.4
    text: |-
      Het bevoegd gezag van een in het eerste lid bedoelde school kan tegen de in het derde lid bedoelde beschikkingen
      administratief beroep instellen bij gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96k
  - number: 96m.1
    text: |-
      Het bedrag van de bekostiging waarop het bevoegd gezag over een kalenderjaar aanspraak heeft, stelt Onze minister
      vast op de som van de overeenkomstig het bepaalde in dit hoofdstuk verstrekte bekostiging en betaalde bedragen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96m
  - number: 96m.2
    text: 'Op het in het eerste lid bedoelde bedrag worden in mindering gebracht:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96m
  - number: 96m.2.a
    text: |-
      de inkomsten die het bevoegd gezag geniet uit cursusgelden als bedoeld in de Les- en cursusgeldwet (Stb. 1987,
      343),
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96m
  - number: 96m.2.b
    text: de inkomsten die het bevoegd gezag geniet uit verhaal van wettelijk verschuldigde bedragen en premies,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96m
  - number: 96m.2.c
    text: |-
      de door Onze minister vast te stellen waarde van roerende zaken die door vervreemding of op andere wijze worden
      onttrokken aan de bestemming, waartoe zij met de vergoeding zijn aangeschaft,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96m
  - number: 96m.2.d
    text: de opbrengst van werkstukken en van verrichte diensten anders dan in het kader van contractactiviteiten, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96m
  - number: 96m.2.e
    text: |-
      de opbrengst die het bevoegd gezag geniet uit verhuur van gebouwen, terreinen en roerende zaken waarvoor
      bekostiging wordt genoten, dan wel als vergoeding voor veroorzaakte kosten bij het doen gebruiken daarvan anders
      dan wegens verhuur, een en ander volgens bij ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96m
  - number: 96m.3
    text: |-
      Het bepaalde in het tweede lid, onder e, is slechts van toepassing op andere vormen van voortgezet onderwijs als
      bedoeld in afdeling IV van titel II van dit deel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96m
  - number: 96o.1
    text: |-
      Op het bedrag, bedoeld in artikel 96m, eerste lid, worden voor zover het betreft scholen voor voorbereidend
      wetenschappelijk onderwijs, voor algemeen voortgezet onderwijs en voor voorbereidend beroepsonderwijs in mindering
      gebracht de salarissen, toelagen, uitkeringen of andere bijdragen waarop aanspraak wordt gemaakt door personeel
      dat is benoemd met voorbijgaan van personeel dat een gelijksoortige functie uitoefent of heeft uitgeoefend aan
      een school van het bevoegd gezag, voor zover laatstbedoeld personeel in het genot is van wachtgeld of een andere
      ontslaguitkering en direct aan die ontslaguitkering voorafgaand langer dan een jaar onafgebroken in dienst
      is geweest van het bevoegd gezag. Voor de toepassing van de eerste volzin wordt, indien het betreft openbaar
      onderwijs, onder «school van het bevoegd gezag» verstaan elke binnen de desbetreffende gemeente gelegen school, met
      uitzondering van de binnen die gemeente gelegen nevenvestigingen waarvan de hoofdvestiging in een andere gemeente
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96o
  - number: 96o.2
    text: |-
      Op het in het eerste lid bedoelde bedrag worden eveneens in mindering gebracht de salarissen, toelagen, uitkeringen
      of andere bijdragen waarop aanspraak wordt gemaakt door personeel dat
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96o
  - number: 96o.2.a
    text: |-
      langer dan twee jaar anders dan wegens vervanging of in geval van leraren indien de benoeming is geschied met
      toepassing van artikel 33, derde lid juncto vijfde lid, onafgebroken, met een onderbreking van een week of minder
      dan wel met een of meer onderbrekingen gedurende een schoolvakantie, in een gelijksoortige functie in tijdelijke
      dienst verbonden is geweest aan een school van het bevoegd gezag, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96o
  - number: 96o.2.b
    text: |-
      langer dan drie jaar direct of indirect in verband met het verrichten van contractactiviteiten in tijdelijke dienst
      is benoemd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96o
  - number: 96o.3
    text: |-
      Op het in het eerste lid bedoelde bedrag worden eveneens in mindering gebracht de kosten van
      werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en
      arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1]. De eerste volzin is niet
      van toepassing, indien de rechtspersoon, bedoeld in artikel 98b, op een daartoe strekkend verzoek van het bevoegd
      gezag, voorafgaand aan het ontslag heeft ingestemd met het ten laste van die rechtspersoon brengen van de kosten
      van uitkeringen of suppleties als bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96o
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 96o.4
    text: |-
      Het eerste lid is eveneens van toepassing, indien de benoeming heeft plaatsgevonden in aansluiting op een benoeming
      in tijdelijke dienst in dezelfde functie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96o
  - number: 96o.5
    text: |-
      Met gewezen personeel dat in het genot is van wachtgeld of van een andere ontslaguitkering als bedoeld in
      het eerste lid onderdeel b, wordt gelijkgesteld personeel aan wie op grond van het leerlingenverloop op of
      na 1 februari ontslag is of zal worden aangezegd, op grond van welk ontslag recht op wachtgeld of een andere
      ontslaguitkering zou kunnen ontstaan. In afwijking van de eerste volzin kan voor een periode tot uiterlijk de datum
      van ingang van het recht op wachtgeld of op een andere ontslaguitkering in een vacature worden voorzien zonder dat
      de vermindering, bedoeld in het eerste lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96o
  - number: 96o.6
    text: |-
      Bij ministeriële regeling wordt bepaald in welke gevallen geen vermindering als bedoeld in het eerste en tweede
      lid plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96o
  - number: 96o.7
    text: |-
      Onze minister kan in andere gevallen dan voorzien in de ministeriële regeling, bedoeld in het zesde lid, wegens
      gewichtige redenen op verzoek van het bevoegd gezag besluiten dat de vermindering van de bekostiging, bedoeld in
      het eerste lid, niet zal plaatsvinden. Onze Minister besluit binnen vier maanden na ontvangst van een aanvraag.
      Indien de beschikking niet binnen vier maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in
      kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien. Uitsluitend op
      grond van door het bevoegd gezag aangevoerde bijzondere omstandigheden kan Onze minister bepalen dat de beslissing,
      bedoeld in de eerste volzin, betrekking heeft of mede betrekking heeft op een periode voorafgaand aan de datum
      waarop het bevoegd gezag het in de eerste volzin bedoelde verzoek heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96o
  - number: 96o.8
    text: Onze minister kan projecten aanwijzen waarvoor het tweede lid onderdeel a niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96o
  - number: 96q.1.1
    text: |-
      Het bij of krachtens [artikel 96o][ref1] bepaalde is van overeenkomstige toepassing indien de rechtspersoon,
      bedoeld in [artikel 53b][ref2], personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in
      [artikel 96o][ref3] van de rechtspersoon of van een bevoegd gezag waarvoor diensten worden verricht, dan wel
      niet handelt overeenkomstig het bepaalde in laatstgenoemde artikelleden. Van het gewezen personeel, bedoeld in de
      eerste volzin, is uitgezonderd het personeel van het bevoegd gezag waarvoor diensten worden verricht, waarvan de
      dienstbetrekking is beëindigd op een tijdstip dat meer dan twee jaar ligt voor de aanvang van de dienstverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96o
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel53b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel96o
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96q.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96o
        hoofdstuk: III
        paragraaf: '9'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 53b
        hoofdstuk: IV
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 96o
        hoofdstuk: III
        paragraaf: '9'
        afdeling: II
  - number: 96q.1.2
    text: |-
      In geval van toepassing van het eerste lid wordt het in mindering te brengen bedrag in gelijke mate verdeeld over
      de scholen waarvoor diensten worden verricht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96q.1
  - number: 96q.1.3
    text: |-
      Het bij of krachtens [artikel 96o][ref1] bepaalde is eveneens van overeenkomstige toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96o
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96q.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96o
        hoofdstuk: III
        paragraaf: '9'
        afdeling: II
  - number: 96q.1.3.a
    text: |-
      indien een bevoegd gezag waarvoor diensten worden verricht, personeel benoemt met voorbijgaan van gewezen personeel
      van de rechtspersoon, bedoeld in [artikel 53b][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53b
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96q.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53b
        hoofdstuk: IV
        afdeling: I
  - number: 96q.1.3.b
    text: |-
      indien een bevoegd gezag waarvoor geen diensten meer worden verricht, in het tijdvak van vijf jaar na beëindiging
      van de dienstverlening personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96q.1
  - number: 96r.1
    text: |-
      Op de bekostiging of onderdelen daarvan kunnen voorschotten worden verleend volgens regels, te stellen bij of
      krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96r
  - number: 96r.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden tevens voorschriften gegeven voor de verrekening van de
      betaalde voorschotten met het bedrag van de vastgestelde bekostiging of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel96r
  - number: '97.1'
    text: Het bevoegd gezag van een bijzondere school houdt nauwkeurig boek van de inkomsten en uitgaven.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel97
  - number: '97.2'
    text: |-
      Het bevoegd gezag van een bijzondere school geeft desverlangd aan de door Onze minister aangewezen ambtenaren de
      boeken en bescheiden ter inzage. Het bevoegd gezag is gehouden deze boeken en bescheiden zeven jaren te bewaren.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel97
  - number: '98.1'
    text: |-
      Het bevoegd gezag is verplicht gebouwen, terreinen en roerende zaken ten behoeve waarvan bekostiging wordt
      genoten, behoorlijk te gebruiken en te onderhouden. Ten behoeve van het onderhoud van gebouwen, terreinen en
      roerende zaken stelt het bevoegd gezag jaarlijks volgens bij algemene maatregel van bestuur te stellen regels een
      onderhoudsprogramma vast.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98
  - number: '98.2'
    text: |-
      Het vervreemden door het bevoegd gezag van een school anders dan op grond van artikel 42c of artikel 50, of het
      onderwerpen aan enig beperkt recht van gebouwen, terreinen en roerende zaken waarvoor bekostiging wordt genoten,
      is zonder toestemming van Onze minister nietig. Onze minister besluit binnen zes maanden na ontvangst van een
      aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze minister de aanvrager
      daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98
  - number: '98.3'
    text: |-
      Het eerste en tweede lid zijn slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld in
      afdeling IV van titel II van dit deel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98
  - number: 98a.1
    text: |-
      Het bevoegd gezag van bij algemene maatregel van bestuur aan te wijzen scholen is aangesloten bij een rechtspersoon
      met volledige rechtsbevoegdheid die zich ten doel stelt waarborgen te bieden voor de kosten van vervanging bij
      afwezigheid van personeel. De eerste volzin is van overeenkomstige toepassing op het bestuur van een centrale
      dienst voor zover het betreft personeel dat is belast met het geven van leerwegondersteunend onderwijs dan wel het
      uitoefenen van taken en bevoegdheden als bedoeld in artikel 53b, eerste lid, tweede volzin. De in de eerste volzin
      bedoelde rechtspersoon wordt door Onze minister aangewezen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98a
  - number: 98a.2
    text: |-
      Het bevoegd gezag onderscheidenlijk het bestuur van de in het eerste lid bedoelde scholen onderscheidenlijk
      centrale diensten is voorts verplicht aan de in dat lid bedoelde rechtspersoon jaarlijks een door die rechtspersoon
      vast te stellen bijdrage te voldoen in verband met de kosten van vervanging.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98a
  - number: 98a.3
    text: |-
      Van de in het eerste juncto tweede lid bedoelde verplichting kan Onze minister op verzoek van het bevoegd gezag
      onderscheidenlijk het bestuur ontheffing verlenen op grond van bezwaren van godsdienstige of levensbeschouwelijke
      aard. Onze minister verleent de ontheffing slechts, indien het bevoegd gezag onderscheidenlijk het bestuur aantoont
      dat een afdoende andere voorziening is getroffen met betrekking tot de gevolgen van vervanging bij afwezigheid
      van personeel. Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag. Indien de beschikking niet
      binnen zes maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een
      termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98a
  - number: 98a.4
    text: De rechtspersoon kan regels vaststellen ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98a
  - number: 98a1.1
    text: |-
      De rechtspersoon, bedoeld in [artikel 98a][ref1], kan het sociaal-fiscaal nummer van het personeelslid dat bij
      afwezigheid wordt vervangen, en van degene die het personeelslid tijdelijk vervangt, uitsluitend in het kader van
      het doel, bedoeld in [artikel 98a, eerste lid][ref2], gebruiken in het verkeer met:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel98a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98a1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98a
        hoofdstuk: IV
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 98a
        hoofdstuk: IV
        afdeling: II
  - number: 98a1.1.a
    text: het personeelslid onderscheidenlijk degene die het personeelslid tijdelijk vervangt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98a1
  - number: 98a1.1.b
    text: |-
      het bevoegd gezag van de school dan wel het bestuur van de centrale dienst waar de in onderdeel a bedoelde personen
      werkzaam zijn,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98a1
  - number: 98a1.1.c
    text: Onze Minister,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98a1
  - number: 98a1.1.d
    text: |-
      de instantie, bedoeld in [artikel 98b, vijfde lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98a1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98b
        hoofdstuk: IV
        afdeling: II
  - number: 98a1.1.e
    text: |-
      het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98a1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 98a1.2
    text: |-
      Het sociaal-fiscaal nummer wordt op een daartoe strekkend verzoek van de in het eerste lid bedoelde rechtspersoon
      aan die rechtspersoon verstrekt door het bevoegd gezag van de school dan wel het bestuur van de centrale dienst
      waar het personeelslid dat bij afwezigheid wordt vervangen, werkzaam is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98a1
  - number: 98a1.3
    text: |-
      Indien dat ten behoeve van het verslag, bedoeld in [artikel 123a, tweede lid][ref1], noodzakelijk is, worden
      gegevens daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon
      kunnen worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de controle
      op de rechtmatigheid en de doelmatigheid van door de rechtspersoon gedane uitgaven. Daarbij kunnen de sociaal-
      fiscale nummers worden vergeleken met de sociaal-fiscale nummers die door andere daartoe bij of krachtens de wet
      bevoegde instanties zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel123a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98a1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 123a
  - number: 98b.1
    text: |-
      Het bevoegd gezag van een school is aangesloten bij een rechtspersoon met volledige rechtsbevoegdheid die
      zich ten doel stelt waarborgen te bieden voor de kosten van werkloosheidsuitkeringen, suppleties inzake
      arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders
      dan op grond van de [Ziektewet][ref1] ten behoeve van gewezen personeel. De eerste volzin is van overeenkomstige
      toepassing op het bestuur van een centrale dienst voor zover het betreft personeel dat is belast met het geven van
      leerwegondersteunend onderwijs dan wel het uitoefenen van taken en bevoegdheden als bedoeld in artikel 53b, eerste
      lid, tweede volzin. De in de eerste volzin bedoelde rechtspersoon wordt door Onze Minister aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 98b.2
    text: |-
      Het bevoegd gezag onderscheidenlijk het bestuur voldoet aan de rechtspersoon jaarlijks een door die
      rechtspersoon vast te stellen bijdrage in verband met de kosten van werkloosheidsuitkeringen, suppleties inzake
      arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan
      op grond van de [Ziektewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 98b.3
    text: |-
      Van de in het eerste en tweede lid bedoelde verplichting kan Onze Minister op verzoek van het bevoegd gezag
      onderscheidenlijk het bestuur ontheffing verlenen op grond van bezwaren van godsdienstige of levensbeschouwelijke
      aard. Onze Minister verleent de ontheffing slechts, indien het bevoegd gezag onderscheidenlijk het bestuur aantoont
      dat een afdoende andere voorziening is getroffen met betrekking tot de kosten van werkloosheidsuitkeringen,
      suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen
      personeel anders dan op grond van de [Ziektewet][ref1]. Onze Minister besluit binnen zes maanden na ontvangst van
      een verzoek. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de verzoeker
      daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 98b.4
    text: |-
      De rechtspersoon stelt regels vast voor de behandeling, beoordeling en beantwoording van een verzoek van het
      bevoegd gezag onderscheidenlijk het bestuur als bedoeld in artikel 96o, derde lid onderscheidenlijk artikel
      96q.1. Indien het bevoegd gezag onderscheidenlijk het bestuur zich beroept op overwegingen van godsdienstige of
      levensbeschouwelijke aard, betrekt de rechtspersoon die overwegingen bij de beoordeling van een in de eerste volzin
      bedoeld verzoek.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98b
  - number: 98b.5
    text: |-
      Indien de rechtspersoon het in het vierde lid bedoelde verzoek heeft ingewilligd, vergoedt hij aan de instantie
      die de werkloosheidsuitkeringen, de suppleties inzake arbeidsongeschiktheid alsmede de uitkeringen wegens ziekte
      en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1] verstrekt of heeft
      verstrekt, de kosten van die uitkeringen of suppleties.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 98b.6
    text: |-
      Tegen een besluit van de rechtspersoon kan het bevoegd gezag onderscheidenlijk het bestuur beroep instellen bij de
      Afdeling bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98b
  - number: 98c.1
    text: |-
      De rechtspersoon, bedoeld in [artikel 98b][ref1], kan het sociaal-fiscaal nummer van het gewezen personeelslid,
      uitsluitend in het kader van het doel, bedoeld in [artikel 98b, eerste lid][ref2], gebruiken in het verkeer met:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98b
        hoofdstuk: IV
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 98b
        hoofdstuk: IV
        afdeling: II
  - number: 98c.1.a
    text: het gewezen personeelslid,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98c
  - number: 98c.1.b
    text: |-
      het bevoegd gezag van de school dan wel het bestuur van de centrale dienst waar de in onderdeel a bedoelde persoon
      werkzaam was,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98c
  - number: 98c.1.c
    text: Onze Minister, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98c
  - number: 98c.1.d
    text: |-
      de instantie, bedoeld in [artikel 98b, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98b
        hoofdstuk: IV
        afdeling: II
  - number: 98c.2
    text: |-
      Het sociaal-fiscaal nummer wordt op een daartoe strekkend verzoek van de in het eerste lid bedoelde rechtspersoon
      aan die rechtspersoon verstrekt door het bevoegd gezag van de school dan wel het bestuur van de centrale dienst
      waar het gewezen personeelslid werkzaam was.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98c
  - number: 98c.3
    text: |-
      Indien dat ten behoeve van het verslag, bedoeld in [artikel 123b, eerste lid][ref1], noodzakelijk is, worden
      gegevens daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon
      kunnen worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de controle
      op de rechtmatigheid en de doelmatigheid van door de rechtspersoon gedane uitgaven. Daarbij kunnen de sociaal-
      fiscale nummers worden vergeleken met de sociaal-fiscale nummers die door andere daartoe bij of krachtens de wet
      bevoegde instanties zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel123b
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel98c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 123b
  - number: '99.1'
    text: |-
      Het bevoegd gezag van een school voor voorbereidend wetenschappelijk onderwijs, voor hoger algemeen voortgezet
      onderwijs, voor middelbaar algemeen voortgezet onderwijs en voor voorbereidend beroepsonderwijs besteedt de
      verstrekte bekostiging en de betaalde bedragen ten behoeve van die school op de wijze zoals aangegeven in het
      tweede tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel99
  - number: '99.2'
    text: |-
      De voor voorzieningen in de huisvesting betaalde bedragen worden zodanig aangewend dat een behoorlijke en
      deugdelijke totstandkoming van deze voorzieningen is verzekerd. Indien na realisatie van de in de eerste volzin
      bedoelde voorzieningen de bedragen niet volledig zijn aangewend, kan het resterende deel daarvan worden aangewend
      voor de kosten van personeel of voorzieningen in de exploitatie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel99
  - number: '99.3'
    text: |-
      Het voor personeels- en exploitatiekosten betaalde bedrag wordt voor de kosten van personeel, zoals onderscheiden
      in de artikelen 32 en 32a, of voor voorzieningen in de exploitatie aangewend en kan in geval van een overschot op
      dat bedrag worden aangewend voor voorzieningen in de huisvesting.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel99
  - number: '99.4'
    text: |-
      De bekostiging, bedoeld in artikel 96d.2, wordt besteed aan de kosten van nascholing ten behoeve van het personeel.
      Indien de bekostiging niet volledig is besteed, wordt het resterende bedrag in een fonds ondergebracht. Dit fonds
      mag ten hoogste een bedrag omvatten dat gelijk is aan de vergoeding van de laatste 3 jaren. Niet bestede gelden
      worden voor zover deze gelden het in de vorige volzin bedoelde bedrag overstijgen, onverwijld in 's Rijks kas
      teruggestort.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel99
  - number: '99.5'
    text: |-
      De verstrekte overschrijdingsbedragen worden ten behoeve van het onderwijs aan de scholen van het bevoegd gezag
      aangewend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel99
  - number: '99.6'
    text: |-
      Het bevoegd gezag kan het in het derde lid bedoelde voor personeels- en exploitatiekosten betaalde bedrag mede
      aanwenden ten behoeve van de kosten van personeel of voorzieningen in de exploitatie van:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel99
  - number: 99.6.a
    text: een andere in het eerste lid bedoelde school;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel99
  - number: 99.6.b
    text: een scholengemeenschap waarvan een of meer in het eerste lid bedoelde scholen deel uitmaken;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel99
  - number: 99.6.c
    text: |-
      een basisschool of een speciale school voor basisonderwijs als bedoeld in de [Wet op het primair onderwijs][ref1],
      een school voor speciaal onderwijs, voor voortgezet speciaal onderwijs of voor speciaal en voortgezet
      speciaal onderwijs dan wel een instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in de
      [Wet op de expertisecentra][ref2], of een school voor voortgezet speciaal onderwijs als bedoeld in deel II van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: '99.7'
    text: |-
      De op grond van artikel 96g of artikel 96h verstrekte bekostiging wordt besteed aan het doel waarvoor zij zijn
      verleend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel99
  - number: '100.1'
    text: |-
      De bedragen en bekostiging, bedoeld in [artikel 99][ref1], worden niet aangewend voor contractactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel99
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '99'
        hoofdstuk: IV
        afdeling: II
  - number: '100.2'
    text: |-
      Het bevoegd gezag van de scholen, bedoeld in [artikel 99][ref1], berekent voor de contractactiviteiten aan de
      betrokken derden de kosten zodanig dat aan het bepaalde in het eerste lid wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel99
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '99'
        hoofdstuk: IV
        afdeling: II
  - number: 100a.1
    text: |-
      Voor zover gebouwen, terreinen of roerende zaken ten behoeve waarvan bekostiging wordt genoten geheel of
      gedeeltelijk tijdelijk niet nodig zijn voor het onderwijs aan de school, kan het bevoegd gezag deze voor ten
      hoogste een jaar, doch uiterlijk tot het einde van het schooljaar, in gebruik geven aan het bevoegd gezag van een
      andere school voor voortgezet onderwijs of van een uit 's Rijks kas bekostigde school voor ander onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100a
  - number: 100a.2
    text: |-
      Het eerste lid is eveneens van toepassing ten aanzien van nader door Onze minister aan te wijzen lokalen, voor
      zover deze gedurende gedeelten van de dag niet nodig zijn voor het onderwijs aan de school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100a
  - number: 100a.3
    text: |-
      Ingebruikgeving voor een langere periode dan op grond van het eerste lid toegestaan, behoeft de toestemming van
      Onze minister. Onze minister kan om gewichtige redenen zodanige toestemming weigeren. Onze Minister besluit binnen
      drie maanden na ontvangst van een aanvraag. Indien de beschikking niet binnen drie maanden kan worden gegeven,
      stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel
      tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100a
  - number: 100a.4
    text: |-
      Voor zover gebouwen, terreinen of roerende zaken, als bedoeld in het eerste lid, dan wel lokalen, als bedoeld in
      het tweede lid, naar zijn oordeel geheel of gedeeltelijk niet nodig zullen zijn voor het onderwijs aan de school,
      is Onze minister bevoegd deze in gebruik te geven aan het bevoegd gezag van een andere school voor voortgezet
      onderwijs of van een uit 's Rijks kas bekostigde school voor ander onderwijs, behoudens voor de periode dat reeds
      ingebruikgeving ingevolge het eerste, tweede of derde lid, dan wel ingevolge artikel 100b, onderscheidenlijk
      verhuur ingevolge artikel 100c, heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100a
  - number: 100a.5
    text: |-
      Alvorens een beslissing te nemen als bedoeld in het derde lid, tweede volzin, of in het vierde lid, treedt Onze
      minister in overleg met het bevoegd gezag van de betrokken scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100a
  - number: 100a.6
    text: |-
      Indien gebouwen, terreinen of roerende zaken zonder toestemming van Onze minister in gebruik zijn gegeven voor een
      langere termijn dan in het eerste lid bedoeld, eindigt de ingebruikgeving indien Onze minister het vierde lid wenst
      toe te passen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100a
  - number: 100a.7
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot ingebruikgeving als
      bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100a
  - number: 100a.8
    text: |-
      Het eerste tot en met zevende lid zijn slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld
      in afdeling IV van titel II van dit deel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100a
  - number: 100b.1
    text: |-
      Voor zover gebouwen, terreinen of roerende zaken ten behoeve waarvan bekostiging wordt genoten, die geheel of
      gedeeltelijk tijdelijk niet nodig zijn voor het onderwijs aan de school, niet nodig zijn voor het onderwijs aan een
      andere school voor voortgezet onderwijs of aan een uit 's Rijks kas bekostigde school voor ander onderwijs, kan het
      bevoegd gezag deze voor ten hoogste een jaar, doch uiterlijk tot het einde van het schooljaar, in gebruik geven aan
      derden ten behoeve van andere culturele, maatschappelijke of recreatieve doeleinden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100b
  - number: 100b.2
    text: Artikel 100a, derde tot en met zevende lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100b
  - number: 100b.3
    text: |-
      Het eerste en tweede lid zijn slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld in
      afdeling IV van titel II van dit deel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100b
  - number: 100c.1
    text: |-
      Voor zover gebouwen, terreinen of roerende zaken ten behoeve waarvan bekostiging wordt genoten, die geheel of
      gedeeltelijk tijdelijk niet nodig zijn voor het onderwijs aan de school, niet nodig zijn voor het onderwijs aan een
      andere school voor voortgezet onderwijs of aan een uit 's Rijks kas bekostigde school voor ander onderwijs, dan wel
      voor andere culturele, maatschappelijke of recreatieve doeleinden, kan het bevoegd gezag deze voor ten hoogste een
      jaar, doch uiterlijk tot het einde van het schooljaar, verhuren aan derden ten behoeve van andere doeleinden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100c
  - number: 100c.2
    text: 'Het bevoegd gezag gaat niet over tot de verhuur bedoeld in het eerste lid indien:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100c
  - number: 100c.2.a
    text: het voorgenomen gebruik zich niet verdraagt met het onderwijs aan de school;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100c
  - number: 100c.2.b
    text: |-
      het te verhuren gebouw of gedeelte daarvan bestemd zal zijn voor woonruimte als bedoeld in artikel 1623a, tweede
      lid, van het Burgerlijk Wetboek of voor bedrijfsruimte als bedoeld in artikel 1624, tweede lid, van dat wetboek.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100c
  - number: 100c.3
    text: |-
      Verhuur voor een langere periode dan op grond van het eerste lid toegestaan, behoeft de toestemming van Onze
      Minister, de inspectie gehoord. Onze Minister kan om gewichtige redenen zodanige toestemming weigeren. De
      huurovereenkomst wordt voor een bepaalde tijd aangegaan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100c
  - number: 100c.4
    text: |-
      De huurovereenkomst eindigt van rechtswege aan het einde van de overeengekomen termijn. Op de overeenkomst en,
      indien deze wordt ingesteld, op de vordering tot ontruiming na het einde van de overeenkomst, zijn de bepalingen
      van de [Huurwet][ref1] (Stb. 1981, 465) niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002066
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100c
    references:
      - id: ref1
        bwb_id: BWBR0002066
  - number: 100c.5
    text: Het verhuren van gebouwen of terreinen door het bevoegd gezag in strijd met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100c
  - number: 100c.6
    text: |-
      Het eerste tot en met vijfde lid zijn slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld
      in afdeling IV van titel II van dit deel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel100c
  - number: '101.1'
    text: |-
      Indien gebouwen, terreinen of roerende zaken van andere vormen van voortgezet onderwijs als bedoeld in afdeling IV
      van titel II van dit deel, ten behoeve waarvan bekostiging in de huisvestingskosten of inventariskosten is genoten,
      geheel of gedeeltelijk aan hun bestemming worden onttrokken of met toestemming van Onze minister worden vervreemd,
      anders dan bedoeld in de artikelen 42c en 50, dan wel indien de bekostiging wordt beëindigd, is de gemeente dan wel
      de rechtspersoon aan het Rijk een bedrag verschuldigd. Het bevoegd gezag kan, buiten het geval van vervreemding, in
      de plaats van betaling van dit bedrag de eigendom van die gebouwen, terreinen of roerende zaken binnen vier maanden
      aan het Rijk overdragen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel101
  - number: '101.2'
    text: |-
      Onze minister stelt het bedrag, bedoeld in het eerste lid, vast op de grondslag van de waarde van de gebouwen,
      terreinen of roerende zaken en de door het bevoegd gezag daarvoor ontvangen bekostiging en uit eigen middelen
      bestede gelden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel101
  - number: '101.3'
    text: |-
      Bij overdracht van de eigendom van gebouwen, terreinen of roerende zaken ingevolge het eerste lid vergoedt het
      Rijk, indien gedeelten van de gebouwen, terreinen of roerende zaken uit eigen middelen zijn betaald en hiervoor
      geen bekostiging werd genoten, een door Onze minister te bepalen waarde.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel101
  - number: '101.5'
    text: |-
      Volgens regelen te stellen bij algemene maatregel van bestuur kan van de voorgaande leden worden afgeweken, wanneer
      het betreft tijdelijke voorzieningen in gebouwen of terreinen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel101
  - number: '102.1'
    text: |-
      Artikel 101 is niet van toepassing, indien en voor zover Onze minister heeft toegestaan, dat gebouwen, terreinen
      of roerende zaken worden bestemd voor ander onderwijs, dan wel worden gebruikt voor andere culturele of
      maatschappelijke doeleinden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel102
  - number: '102.2'
    text: |-
      Het eerste lid is slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld in afdeling IV van
      titel II van dit deel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel102
  - number: 102a.1
    text: |-
      De kosten van herstel van schade aan gebouwen, terreinen en roerende zaken ten behoeve waarvan met betrekking tot
      scholen bekostiging wordt genoten, worden niet door de gemeente vergoed, indien:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel102a
  - number: 102a.1.a
    text: die schade door schuld of nalatigheid van de rechtspersoon die de school in stand houdt, wordt toegebracht, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel102a
  - number: 102a.1.b
    text: |-
      het bevoegd gezag een beroep kan doen op een verzekering waarvoor de premie voor vergoeding in aanmerking komt,
      of voor de vergoeding van die schade door de gemeente een collectieve verzekering is afgesloten, voor zover die
      collectieve verzekering de schade dekt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel102a
  - number: 102a.2
    text: |-
      Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een door de gemeente bekostigde school voor
      vergoeding door de gemeente in aanmerking komt, treedt de gemeente op het moment van een uitdrukkelijk besluit tot
      vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel102a
  - number: 102a.1.1
    text: |-
      De kosten van herstel van schade aan gebouwen, terreinen en roerende zaken, ten behoeve waarvan met betrekking
      tot andere vormen van voortgezet onderwijs als bedoeld in afdeling IV van titel II van dit deel bekostiging wordt
      genoten, worden niet door het Rijk vergoed, indien:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel102a.1
  - number: 102a.1.1.a
    text: |-
      die schade door schuld of nalatigheid van de gemeente of de rechtspersoon die de school in stand houdt, wordt
      toegebracht, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel102a.1
  - number: 102a.1.1.b
    text: |-
      het bevoegd gezag voor die schade een beroep kan doen op een verzekering waarvoor de premie voor vergoeding in
      aanmerking komt, of voor de vergoeding van die schade door Onze minister een collectieve verzekering is afgesloten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel102a.1
  - number: 102a.1.2
    text: |-
      Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een uit 's Rijks kas bekostigde school voor
      vergoeding door het Rijk in aanmerking komt, treedt het Rijk op het moment van een uitdrukkelijke beschikking tot
      vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel102a.1
  - number: '103.1'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het ten behoeve van Onze Minister beschikt over een overzichtelijke
      informatieverzameling van de financiële gegevens die op enigerlei wijze van belang zijn voor de bekostiging,
      bedoeld in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel103
  - number: '103.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de wijze van
      beschikbaarstelling van de gegevens, bedoeld in het eerste lid, en de wijze van ordening daarvan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel103
  - number: 103a.1
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het beschikt over geordende gegevens ten behoeve van het door Onze
      minister te voeren beleid met betrekking tot het onderwijs en verleent desgevraagd medewerking aan door of namens
      Onze minister uit te voeren onderzoek dat geheel of mede op deze gegevens is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel103a
  - number: 103a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de wijze van beschikbaarstelling van
      de in het eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel103a
  - number: 103a.3
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld over de wijze van ordening van de informatie en
      over de kengetallen waarover informatie beschikbaar is of wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel103a
  - number: 103a.4
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het tweede en derde lid treedt niet eerder in werking dan 12
      maanden na de datum van uitgifte van het Staatsblad waarin zij is geplaatst.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel103a
  - number: 103b.7
    text: |-
      Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een leerling ter uitvoering van
      [artikel 107, tweede en vijfde lid, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: '104.1'
    text: |-
      Indien het bevoegd gezag van een school in strijd handelt met het bepaalde bij of krachtens dit deel, kan Onze
      minister bepalen dat de bekostiging, voorschotten daaronder begrepen, geheel of gedeeltelijk wordt ingehouden dan
      wel opgeschort.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel104
  - number: '104.2'
    text: |-
      Onze minister verstrekt de bekostiging wederom, indien blijkt dat de reden voor de toepassing van het eerste lid
      is vervallen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel104
  - number: '105'
    text: |-
      Tegen een besluit als bedoeld in de [artikelen 83][ref1], [85a][ref2], [89][ref3], [95][ref4] en [104][ref5] kan
      een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel85a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel89
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel95
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel104
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '83'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 85a
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '89'
        hoofdstuk: II
        paragraaf: '3'
        afdeling: II
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '95'
        hoofdstuk: II
        paragraaf: '4'
        afdeling: II
      - id: ref5
        bwb_id: BWBR0002399
        artikel: '104'
        hoofdstuk: IV
        afdeling: II
  - number: '106.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel106
  - number: 106.1.a
    text: de inrichting van de boekhouding van bijzondere scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel106
  - number: 106.1.b
    text: de wijze waarop door het bevoegd gezag verslag wordt gedaan van het financieel beheer van de school,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel106
  - number: 106.1.c
    text: de vaststelling door het bevoegd gezag van een begroting en een jaarrekening, alsmede de inrichting daarvan, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel106
  - number: 106.1.d
    text: de controle van de boekhouding en de administratie van de scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel106
  - number: '106.2'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de erkenning van godsdienstige of
      levensbeschouwelijke bezwaren tegen het sluiten van een verzekering.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel106
  - number: '106.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven ter uitvoering van deze
      afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel106
  - number: '106.4'
    text: |-
      Indien een beschikking niet binnen de bij of krachtens de algemene maatregel van bestuur, bedoeld in dit artikel,
      gestelde termijn kan worden gegeven, stelt Onze minister de aanvrager daarvan in kennis en noemt hij daarbij een
      termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel106
  - number: '107.1'
    text: |-
      Een openbare school voor m.a.v.o., een openbare school voor h.a.v.o., een openbaar atheneum, of een openbaar
      gymnasium wordt opgeheven en de aanspraak op bekostiging ten behoeve van een zodanige bijzondere school gaat
      verloren, indien de school gedurende drie achtereenvolgende schooljaren telkens is bezocht door minder dan 240
      leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel107
  - number: '107.2'
    text: |-
      Een openbare school voor voorbereidend beroepsonderwijs wordt opgeheven en de aanspraak op bekostiging ten behoeve
      van een zodanige bijzondere school gaat verloren:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel107
  - number: 107.2.a
    text: |-
      voor zover het betreft een school voor voorbereidend beroepsonderwijs met één of meer afdelingen uit één, twee of
      drie van de sectoren, bedoeld in [artikel 10c][ref1], indien de school gedurende drie achtereenvolgende schooljaren
      telkens is bezocht door minder dan 240 leerlingen,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 107.2.b
    text: |-
      voor zover het betreft een school voor voorbereidend beroepsonderwijs met één of meer afdelingen uit alle vier
      sectoren, bedoeld in [artikel 10c][ref1], indien de school gedurende drie achtereenvolgende schooljaren telkens is
      bezocht door minder dan 360 leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '107.3'
    text: |-
      Een openbaar lyceum wordt opgeheven en de aanspraak op bekostiging ten behoeve van een bijzonder lyceum gaat
      verloren, indien de school gedurende drie achtereenvolgende schooljaren telkens is bezocht door minder dan 300
      leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel107
  - number: '107.4'
    text: |-
      Indien één op het basisonderwijs aansluitende school deel uitmaakt van een scholengemeenschap is het bepaalde
      in het eerste, tweede, dan wel derde lid op die school van toepassing. Indien twee of meer op het basisonderwijs
      aansluitende openbare scholen deel uitmaken van een scholengemeenschap, worden al deze op het basisonderwijs
      aansluitende scholen opgeheven en gaat de aanspraak op bekostiging ten behoeve van al deze op het basisonderwijs
      aansluitende bijzondere scholen verloren, indien de scholen gedurende drie achtereenvolgende schooljaren telkens
      zijn bezocht door minder dan gemiddeld 30 leerlingen per leerjaar per school. Voor de toepassing van de tweede
      volzin wordt:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel107
  - number: 107.4.a
    text: een lyceum beschouwd als een school met 10 leerjaren,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel107
  - number: 107.4.b
    text: |-
      een school voor voorbereidend beroepsonderwijs met afdelingen uit twee of drie van de sectoren, bedoeld in
      [artikel 10c][ref1], beschouwd als een school met 8 leerjaren en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 107.4.c
    text: |-
      een school voor voorbereidend beroepsonderwijs met afdelingen uit alle vier sectoren, bedoeld in
      [artikel 10c][ref1], beschouwd als een school met 12 leerjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '107.5'
    text: |-
      Voor wat betreft de afdelingen van scholen voor voorbereidend beroepsonderwijs, wordt een afdeling opgeheven
      en gaat de aanspraak op bekostiging ten behoeve van een afdeling van een bijzondere school verloren, indien de
      afdeling in een leerjaar voorafgaande aan het laatste leerjaar gedurende twee achtereenvolgende jaren door geen
      leerlingen is bezocht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel107
  - number: '107.6'
    text: |-
      Een afdeling van een openbare school voor voorbereidend beroepsonderwijs wordt niet opgeheven en de aanspraak op
      bekostiging ten behoeve van een afdeling van een bijzondere school voor voorbereidend beroepsonderwijs gaat niet
      verloren vanwege het overeenkomstig [artikel 10b, negende lid][ref1], of [10d, negende lid][ref2], verzorgen van
      een of meer intrasectorale programma's.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '107.10'
    text: |-
      Indien scholen die onderdeel van een scholengemeenschap vormen, of afdelingen door het bevoegd gezag worden
      opgeheven, worden deze voor de toepassing van het tweede lid geacht niet te bestaan, met ingang van de datum
      waarop de uitvoering van het besluit van het bevoegd gezag een aanvang neemt. Leerlingen die een nog niet opgeheven
      tweede leerjaar bezoeken, dat tevens het tweede leerjaar is van een of meer scholen van een scholengemeenschap of
      afdelingen van een school of scholengemeenschap, die niet wordt opgeheven, worden geheel toegerekend aan dat deel
      van de school of scholengemeenschap, dat niet wordt opgeheven. Het bepaalde in de voorgaande volzinnen is tevens
      van toepassing, indien de opheffing het gevolg is van het bepaalde in de laatste volzin van het tweede of vierde
      lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel107
  - number: '108.1'
    text: |-
      Grondslag der berekening is het aantal leerlingen dat op 1 oktober van elk van de jaren bij de school was
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel108
  - number: '108.2'
    text: |-
      Indien voor de leerlingen binnen redelijke afstand geen plaatsruimte beschikbaar is op een gelijksoortige school,
      waar het verlangde onderwijs wordt gegeven, past Onze minister [artikel 107][ref1] zodanig toe, dat de leerlingen
      van elk leerjaar de cursus kunnen voltooien.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
  - number: '108.3'
    text: |-
      [Artikel 107][ref1] blijft buiten toepassing, zolang de school niet alle leerjaren omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
  - number: '108.4'
    text: |-
      In bijzondere gevallen kan Onze minister op verzoek van het bevoegd gezag of van de rechtspersoon, bedoeld
      in [artikel 66, vierde lid][ref1], voor een door hem te bepalen tijd toestaan, dat een openbare school in
      stand wordt gehouden of een bijzondere school wordt bekostigd, ook al is het aantal leerlingen minder, dan in
      [artikel 107][ref2] is vermeld. Onze minister besluit binnen zes maanden na ontvangst van een aanvraag. Indien de
      beschikking niet binnen zes maanden kan worden gegeven, stelt Onze minister de aanvrager daarvan in kennis en noemt
      hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '66'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
  - number: '108.5'
    text: |-
      Binnen acht weken na de bekendmaking door het Centraal Bureau voor de Statistiek dan wel door Onze minister van
      de aantallen leerlingen per school voor voortgezet onderwijs, stellen gedeputeerde staten vast welke gemeentelijke
      scholen uit hun provincie gedurende reeds een jaar niet meer voldoen aan de voor hen geldende norm, genoemd in
      [artikel 107][ref1]. Wanneer er als gevolg van de opheffing van een school als bedoeld in de vorige volzin, naar
      hun oordeel niet meer voldoende zal zijn voorzien in de behoefte aan openbaar onderwijs in een genoegzaam aantal
      scholen, dragen gedeputeerde staten de gemeente op een verzoek te doen op grond van het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
  - number: '109.1'
    text: |-
      De [artikelen 107][ref1] en [108][ref2], met uitzondering van het vijfde lid, tweede volzin, zijn niet van
      toepassing op scholen voor praktijkonderwijs en op afdelingen voor praktijkonderwijs. Een openbare school
      of afdeling voor praktijkonderwijs wordt opgeheven dan wel de aanspraak op bekostiging ten behoeve van een
      zodanige bijzondere school of afdeling wordt beëindigd, indien de school of afdeling niet langer voldoet
      aan bij algemene maatregel van bestuur vast te stellen voorwaarden, waartoe in ieder geval behoren het
      aantal leerlingen dat de school of afdeling bezoekt, en het evenwichtig geheel van onderwijsvoorzieningen.
      [Artikel 108, vijfde lid, tweede volzin][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel108
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel108
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '108'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '108'
        afdeling: III
  - number: '109.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op nevenvestigingen, bedoeld in [artikel 19, vierde lid][ref1],
      voor zover het betreft nevenvestigingen die tot stand zijn gebracht op de wijze en voldoen aan de voorwaarden,
      bedoeld in [artikel V, derde lid][ref2], dan wel [artikel VIII, vierde lid, van de Wet van 25 mei 1998][ref3] (Stb.
      337).


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0009638#ArtikelV
      [ref3]: https://wetten.overheid.nl/BWBR0009638#ArtikelVIII
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '19'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0009638
        artikel: V
      - id: ref3
        bwb_id: BWBR0009638
        artikel: VIII
  - number: '110'
    text: |-
      De [artikelen 107][ref1] en [108][ref2] zijn, voor zover zij betrekking hebben op scholen voor
      hoger algemeen voortgezet onderwijs, van overeenkomstige toepassing op afdelingen, als bedoeld in
      [artikel 8, eerste lid, onder b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel108
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '108'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 110a.1
    text: Het bevoegd gezag stort het exploitatie-overschot terug in de desbetreffende overheidskas
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel110a
  - number: 110a.1.a
    text: |-
      indien een openbare school ingevolge [artikel 107][ref1], [109][ref2] of [110][ref3] wordt opgeheven,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel109
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel110
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '109'
        afdeling: III
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '110'
        afdeling: III
  - number: 110a.1.b
    text: |-
      indien de bekostiging van een bijzondere school ingevolge een van de in onderdeel a genoemde artikelen wordt
      beëindigd, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel110a
  - number: 110a.1.c
    text: indien een school ingevolge een beslissing van het bevoegd gezag wordt opgeheven en deze opheffing is gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel110a
  - number: 110a.2
    text: Het exploitatietekort blijft in de gevallen, bedoeld in het eerste lid, voor rekening van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel110a
  - number: 110a.3
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de wijze waarop het exploitatie-overschot,
      bedoeld in het eerste lid, wordt berekend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel110a
  - number: '111'
    text: |-
      Tegen een besluit op grond van deze afdeling kan een belanghebbende beroep instellen bij de Afdeling
      bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel111
  - number: '112'
    text: Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel112
  - number: '113'
    text: |-
      Het toezicht op het voortgezet onderwijs – met uitzondering van het landbouwonderwijs –en op de beoordeling door de
      regionale verwijzingscommissie, bedoeld in artikel 10e, vierde lid, en artikel 10g, tweede lid, is opgedragen aan
      Onze Minister van Onderwijs, Cultuur en Wetenschappen. Het wordt onder zijn bevelen uitgeoefend door de inspecteur-
      generaal van het onderwijs en door de inspectie van het voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel113
  - number: '114'
    text: |-
      Het toezicht op het landbouwonderwijs is opgedragen aan Onze Minister van Landbouw, Natuurbeheer en Visserij. Het
      wordt onder zijn bevelen uitgeoefend door de inspectie van het landbouwonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel114
  - number: '115.1'
    text: De inspectie ziet toe, dat de bepalingen van dit deel en van haar uitvoeringsvoorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel115
  - number: '115.2'
    text: |-
      Bij de uitoefening van de taken van de inspectie zijn de [artikelen 5:12 tot en met 5:17][ref1] en
      [artikel 5:20 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 115a.1
    text: 'Bij de inspectie zijn vertrouwensinspecteurs werkzaam ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel115a
  - number: 115a.1.a
    text: |-
      leerlingen die het slachtoffer zijn van seksueel misbruik of seksuele intimidatie, gepleegd door een ten behoeve
      van de school met taken belast persoon of een leerling van de school;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel115a
  - number: 115a.1.b
    text: |-
      ten behoeve van een school met taken belaste personen die het slachtoffer zijn van seksueel misbruik of seksuele
      intimidatie, gepleegd door een ten behoeve van de school met taken belast persoon of een leerling van de school;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel115a
  - number: 115a.1.c
    text: |-
      leerlingen, ten behoeve van een school met taken belaste personen, bevoegde gezagsorganen, ouders, op scholen
      ingestelde klachtencommissies en op scholen aangestelde vertrouwenspersonen, die geconfronteerd worden met een
      geval van seksueel misbruik of seksuele intimidatie als bedoeld onder a of b.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel115a
  - number: 115a.2
    text: |-
      Naast zijn taken, voortvloeiend uit artikel 115, heeft de vertrouwensinspecteur ten behoeve van de in het eerste
      lid genoemde personen en organen de volgende taken:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel115a
  - number: 115a.2.a
    text: het fungeren als aanspreekpunt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel115a
  - number: 115a.2.b
    text: het adviseren over eventueel te nemen stappen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel115a
  - number: 115a.2.c
    text: het bijstaan bij het nemen van stappen gericht op het zoeken naar een oplossing, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel115a
  - number: 115a.2.d
    text: het desgevraagd begeleiden bij het indienen van een klacht of het doen van aangifte.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel115a
  - number: 115a.3
    text: |-
      De vertrouwensinspecteur is, voor zover het betreft misdrijven als bedoeld in
      [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een leerling of een ten behoeve van een school
      met taken belast persoon, vrijgesteld van de verplichting tot het doen van aangifte als bedoeld in de
      [artikelen 160, eerste lid][ref2], en [162, eerste lid, van het Wetboek van Strafvordering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel160
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel162
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel115a
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '160'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '162'
  - number: 115a.4
    text: |-
      De vertrouwensinspecteur is verplicht tot geheimhouding van hetgeen hem in de uitoefening van zijn functie is
      toevertrouwd door een leerling, de ouders van een leerling of een ten behoeve van een school met taken belast
      persoon.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel115a
  - number: '116.1'
    text: |-
      De inspectie zorgt door bezoek aan de scholen voortdurend bekend te blijven met de toestand van het voortgezet
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel116
  - number: '116.2'
    text: |-
      De inspectie tracht de bloei van het voortgezet onderwijs te bevorderen door overleg met de besturen der scholen,
      met het personeel der scholen en, voor zover zij dit nodig acht, met de gemeentelijke inspectie en met degenen, die
      door de besturen der bijzondere scholen met toezicht op deze scholen zijn belast.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel116
  - number: '116.3'
    text: |-
      De inspectie doet Onze minister alle zodanige voorstellen, als zij in het belang van het voortgezet onderwijs nodig
      acht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel116
  - number: 118a.1
    text: |-
      Bij algemene maatregel van bestuur wordt voor een periode van telkens 4 schooljaren een landelijk beleidskader
      vastgesteld. De algemene maatregel van bestuur, bedoeld in de eerste volzin, wordt aan de beide kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en
      gedurende die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die
      maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig
      mogelijk ingediend. Het bepaalde in de vorige drie volzinnen is niet van toepassing, voor zover het ontwerp van de
      algemene maatregel van bestuur voordien aan beide kamers der Staten-Generaal is overgelegd en door of namens een
      der kamers te kennen is gegeven dat van de procedure, bedoeld in de tweede tot en met vierde volzin, kan worden
      afgeweken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118a
  - number: 118a.2
    text: |-
      Het landelijk beleidskader vermeldt de landelijke doelstellingen van het beleid inzake
      onderwijsachterstandenbestrijding en verstrekt informatie over de voornemens van de rijksoverheid met betrekking
      tot de landelijke evaluatie van het beleid inzake onderwijsachterstandenbestrijding.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118a
  - number: 118b.1
    text: |-
      De gemeenteraad stelt voor een periode van telkens 4 schooljaren een plan vast, onderwijsachterstandenplan genaamd,
      ter bestrijding van onderwijsachterstanden. Indien het totaal van de voor de bestrijding van onderwijsachterstanden
      bestemde middelen, bedoeld in het vierde lid, onderdelen a en c, minder is dan € 113 500, kan de gemeenteraad
      afzien van de vaststelling van het plan. In dat geval besluit de gemeenteraad op andere wijze omtrent de verdeling
      van de middelen, bedoeld in het vierde lid, onderdelen a en b, waarbij de gemeenteraad het landelijk beleidskader
      in acht neemt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.2
    text: |-
      Onder onderwijsachterstanden worden verstaan die negatieve effecten op de leer- en ontwikkelingsmogelijkheden van
      leerlingen, die het gevolg zijn van sociale, economische en culturele omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.3
    text: 'Het onderwijsachterstandenplan vermeldt in elk geval:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.3.a
    text: |-
      de wijze waarop de doelstellingen, genoemd in het landelijk beleidskader, bedoeld in [artikel 118a][ref1], in
      kwalitatieve en kwantitatieve zin worden uitgewerkt,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118a
  - number: 118b.3.b
    text: |-
      de wijze waarop de voor de bestrijding van onderwijsachterstanden bestemde middelen, anders dan de in onderdeel c
      genoemde middelen, worden ingezet, alsmede de scholen en instellingen die de daaruit voortvloeiende activiteiten
      zullen verrichten,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.3.c
    text: |-
      de wijze waarop de scholen de door hen ontvangen middelen in het kader van onderwijsachterstandenbestrijding
      inzetten, voor zover het betreft de aanvullende bekostiging voor personeelskosten in verband met bijzondere groepen
      leerlingen, verstrekt op grond van [artikel 85a][ref1], anders dan de middelen bestemd voor:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 85a
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: 118b.3.1°
    text: tussentijdse instroom van leerlingen in het voorafgaand schooljaar,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.3.2°
    text: herberekening van middelen, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.3.3°
    text: |-
      tussentijdse instroom van leerlingen in het lopend schooljaar, met dien verstande dat de scholen de zeggenschap
      hebben over de wijze waarop dit wordt geoperationaliseerd,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.3.d
    text: |-
      de wijze waarop de scholen verantwoording afleggen over de inzet van de in onderdeel c bedoelde middelen in
      overeenstemming met het plan en de wijze waarop de scholen en instellingen rekening en verantwoording afleggen
      inzake de besteding van de middelen, bedoeld in het vierde lid, onderdelen a en b,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.3.e
    text: de procedure met betrekking tot de wijziging van het plan, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.3.f
    text: de wijze waarop de gemeenteraad het gemeentelijk onderwijsachterstandenbeleid evalueert.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.4
    text: |-
      Het onderwijsachterstandenplan vermeldt tevens de omvang van de voor de bestrijding van onderwijsachterstanden
      bestemde middelen, waarbij onderscheid wordt gemaakt tussen:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.4.a
    text: |-
      de middelen die de gemeente als specifieke uitkering, bedoeld in [artikel 118d][ref1], uit 's Rijks kas ontvangt
      voor de bestrijding van onderwijsachterstanden,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118d
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118d
  - number: 118b.4.b
    text: |-
      de middelen, anders dan bedoeld in onderdeel a, die de gemeenteraad bestemt voor de bestrijding van
      onderwijsachterstanden, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.4.c
    text: de middelen, bedoeld in het derde lid, onderdeel c, die de scholen ontvangen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.5
    text: 'Het onderwijsachterstandenplan heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.5.a
    text: basisscholen en speciale scholen voor basisonderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.5.b
    text: |-
      scholen als bedoeld in de [Wet op de expertisecentra][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 118b.5.c
    text: scholen als bedoeld in deze wet, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.5.d
    text: andere instellingen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.6
    text: |-
      Vaststelling en wijziging van het onderwijsachterstandenplan of het nemen van een besluit omtrent de verdeling
      van middelen indien wordt afgezien van vaststelling van het plan, geschiedt niet dan na op overeenstemming
      gericht overleg met de bevoegde gezagsorganen van alle scholen in de gemeente. De gemeenteraad stelt daartoe bij
      verordening een procedure vast, met dien verstande dat in de verordening in ieder geval wordt bepaald:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.6.a
    text: |-
      vanaf wanneer en tot welk moment het gemeentebestuur de Onderwijsraad kan verzoeken een advies als bedoeld in het
      tiende lid, uit te brengen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.6.b
    text: |-
      dat de termijn voor het uitbrengen van het advies wordt opgeschort met ingang van de dag waarop de Onderwijsraad
      het gemeentebestuur uitnodigt het verzoek voor het uitbrengen van het advies aan te vullen met de gegevens die de
      Onderwijsraad nodig heeft voor een goede vervulling van diens taak, tot de dag waarop het verzoek is aangevuld, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.6.c
    text: dat het gemeentebestuur gedurende de termijn voor het uitbrengen van het advies geen besluit neemt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.7
    text: |-
      Binnen een jaar na de vaststelling van het landelijk beleidskader, bedoeld in [artikel 118a][ref1], stelt de
      gemeenteraad het onderwijsachterstandenplan vast.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118a
  - number: 118b.8
    text: Het onderwijsachterstandenplan kan tussentijds worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.9
    text: |-
      Indien de vaststelling en wijziging van het onderwijsachterstandenplan of een besluit omtrent de verdeling van
      middelen indien wordt afgezien van vaststelling van het plan, leiden tot kosten van werkloosheidsuitkeringen, komen
      deze kosten ten laste van het Rijk indien het ontstaan van deze kosten in redelijkheid is toe te rekenen aan het
      Rijk.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.10
    text: |-
      Tijdens het in het zesde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit
      te brengen over de vaststelling of wijziging van het onderwijsachterstandenplan in relatie tot de vrijheid van
      richting en de vrijheid van inrichting. Het verzoek wordt gedaan indien het bevoegd gezag hierom heeft gevraagd
      dan wel uit eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht.
      Het advies wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met
      het plan. Dit lid is van overeenkomstige toepassing op een besluit omtrent de verdeling van middelen indien wordt
      afgezien van vaststelling van het plan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118b.11
    text: |-
      Het gemeentebestuur kan een subsidieplafond vaststellen en bepalen hoe het beschikbare bedrag met inachtneming
      daarvan wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118b
  - number: 118c
    text: |-
      Ten behoeve van leerlingen van 14 jaar en ouder die behoren tot een van de groepen leerlingen, bedoeld in
      [artikel 37 van het Inrichtingsbesluit W.V.O.][ref1], en die voor de eerste maal als leerling aan een Nederlandse
      school zijn ingeschreven, kunnen activiteiten worden verricht die zijn gericht op een verbeterde doorstroming
      naar het vervolgonderwijs indien dit van belang is in verband met activiteiten in het kader van het voorkomen en
      bestrijden van onderwijsachterstanden. De activiteiten kunnen zonodig afwijken van het bepaalde bij of krachtens de
      [artikelen 11a tot en met 11f][ref2] en [22][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel22
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118c
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 11a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '22'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 118d.1
    text: |-
      Bij algemene maatregel van bestuur worden de criteria vastgesteld op grond waarvan een gemeente voor telkens
      een periode van 4 jaar in aanmerking komt voor een specifieke uitkering ter tegemoetkoming in de kosten voor het
      bestrijden van onderwijsachterstanden, alsmede de criteria voor de hoogte daarvan. De uitkering wordt per jaar
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118d
  - number: 118d.2
    text: |-
      De gemeente verstrekt de middelen, bedoeld in [artikel 118b, vierde lid, onderdelen a en b][ref1], aan de
      rechtspersonen die daarvoor in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118b
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118b
  - number: 118d.3
    text: |-
      Onze minister kan voor bij ministeriële regeling aan te wijzen gevallen of groepen van gevallen tegemoet komen
      aan onbillijkheden van overwegende aard, welke zich bij de toepassing van het eerste lid van dit artikel mochten
      voordoen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118d
  - number: 118e
    text: |-
      Onze minister kan de uitkering geheel of gedeeltelijk terugvorderen indien uit de rekening van
      de gemeente, bedoeld in [artikel 197 van de Gemeentewet][ref1], het gemeentelijk verslag omtrent
      het financieel beheer, bedoeld in [artikel 197 van de Gemeentewet][ref2], het verslag van de
      accountant, bedoeld in [artikel 213, tweede lid, van de Gemeentewet][ref3], dan wel uit een
      afzonderlijke verantwoording, voorzien van een verklaring van een accountant, als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4], niet blijkt dat de uitkering is besteed in
      overeenstemming met de bepalingen van dit deel.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118e
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '213'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 118f.1
    text: |-
      Het toezicht op het gemeentelijk onderwijsachterstandenbeleid in de gemeente is opgedragen aan het gemeentebestuur.
      Het toezicht op het gemeentebestuur in verband met de evaluatie van de landelijke doelstellingen van het
      beleid inzake onderwijsachterstandenbestrijding wordt uitgeoefend door bij besluit van Onze minister aangewezen
      personen. Het toezicht op de bevoegde gezagsorganen van de scholen en andere instellingen die betrokken zijn of
      betrokken worden bij de uitvoering van het plan of een besluit omtrent de verdeling van middelen indien wordt
      afgezien van de vaststelling van het plan, wordt in verband met de opstelling van het plan of het in deze volzin
      bedoelde besluit en voor de evaluatie uitgeoefend door bij besluit van de gemeenteraad aangewezen personen. De
      [artikelen 5:12 tot en met 5:17][ref1] en [5:20 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 118f.2
    text: |-
      Indien het bevoegd gezag van een school naar het oordeel van de gemeenteraad de middelen, bedoeld in artikel
      118b, vierde lid, onderdelen a en b, niet besteedt overeenkomstig het onderwijsachterstandenplan, of een besluit
      omtrent de verdeling van middelen indien de gemeenteraad op grond van artikel 118b, eerste lid tweede volzin, heeft
      afgezien van de vaststelling van het plan, kan de gemeenteraad de middelen geheel of gedeeltelijk inhouden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118f
  - number: 118f.3
    text: |-
      Indien het bevoegd gezag van een school naar het oordeel van de gemeenteraad de middelen, bedoeld in artikel 118b,
      vierde lid, onderdeel c, niet besteedt overeenkomstig het onderwijsachterstandenplan, maakt de gemeenteraad hiervan
      melding aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118f
  - number: 118f.4
    text: |-
      Indien het gemeentebestuur naar het oordeel van Onze minister de voorschriften in deze titel niet nakomt, kan Onze
      minister de uitkering, bedoeld in artikel 118d, geheel of gedeeltelijk inhouden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118f
  - number: 118f.5
    text: |-
      Indien Onze Minister toepassing geeft aan het vierde lid in verband met een besluit van het gemeentebestuur dat
      leidt tot kosten van werkloosheidsuitkeringen en de rechtspersoon, bedoeld in artikel 98b, eerste lid, een verzoek
      als bedoeld in artikel 96o, derde lid, met betrekking tot een niet door de gemeente in stand gehouden school als
      gevolg van dat besluit van het gemeentebestuur heeft ingewilligd, vergoedt Onze Minister aan deze rechtspersoon de
      als gevolg van die inwilliging gemaakte kosten van werkloosheidsuitkeringen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118f
  - number: 118g.1
    text: |-
      Onder een voortijdige schoolverlater in de zin van deze titel wordt verstaan degene op wie
      [artikel 28, eerste lid onder a en b][ref1], van toepassing is en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel28
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '28'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 118g.1.a
    text: |-
      die het onderwijs aan de school waaraan hij is ingeschreven gedurende een aaneengesloten periode van ten minste een
      maand of een door het bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer volgt, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118g
  - number: 118g.1.b
    text: |-
      die niet meer aan een school is ingeschreven en evenmin is ingeschreven aan een instelling als bedoeld
      in de [Wet educatie en beroepsonderwijs][ref1] dan wel aan een school of instelling als bedoeld in de
      [Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118g
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0003549
  - number: 118g.2
    text: |-
      Voor zover nodig in afwijking van het eerste lid wordt onder een voortijdige schoolverlater niet verstaan degene die
      in het bezit is van een getuigschrift van het praktijkonderwijs als bedoeld in artikel 10f dan wel een diploma van
      een opleiding als bedoeld in artikel [7.2.2, eerste lid onderdeel a, van de Wet educatie en beroepsonderwijs][ref1]
      en werkzaam is op grond van een aanstelling of arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118g
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 118h.1
    text: |-
      Burgemeester en wethouders dragen zorg voor registratie van de gegevens die het bevoegd gezag ingevolge artikel 28
      heeft gemeld. Burgemeester en wethouders dragen bovendien zorg voor een systeem van doorverwijzing naar onderwijs
      of arbeidsmarkt van de in artikel 118g bedoelde voortijdige schoolverlaters en voor het onderhoud van dit systeem.
      Het systeem heeft mede betrekking op de gegevens waarover de gemeente beschikt in het kader van de uitvoering van
      de [Leerplichtwet 1969][ref1]. Voor de uitvoering van de eerste en tweede volzin kunnen bij ministeriële regeling
      nadere voorschriften worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118h
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 118h.2
    text: |-
      Voor de vervulling van hun in het eerste lid bedoelde taken werken de colleges van burgemeester en wethouders
      samen binnen bij of krachtens algemene maatregel van bestuur vastgestelde regio's. Zij maken tevens afspraken
      met scholen, instellingen als bedoeld in de [Wet educatie en beroepsonderwijs][ref1], scholen en instellingen als
      bedoeld in de [Wet op de expertisecentra][ref2] en organisaties die zijn betrokken bij het voorkomen en bestrijden
      van voortijdig schoolverlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118h
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0003549
  - number: 118h.3
    text: |-
      De gemeentebesturen in een regio wijzen uit hun midden een contactgemeente aan. Deze aanwijzing wordt onverwijld
      gemeld aan Onze Minister. Burgemeester en wethouders van de contactgemeente vervullen coördinerende taken met het
      oog op het voorkomen en bestrijden van voortijdig schoolverlaten. In dat verband:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118h
  - number: 118h.3.a
    text: |-
      maken zij afspraken met de in het tweede lid bedoelde scholen, instellingen en organisaties over de inzet en
      verantwoordelijkheid bij het voorkomen en bestrijden van voortijdig schoolverlaten;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118h
  - number: 118h.3.b
    text: dragen zij zorg voor de totstandkoming van een regionaal netwerk van die scholen, instellingen en organisaties;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118h
  - number: 118h.3.c
    text: organiseren en coördineren zij de in het eerste lid bedoelde melding, registratie en doorverwijzing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118h
  - number: 118h.4
    text: |-
      Indien gemeentebesturen in een regio een andere contactgemeente aanwijzen, dragen burgemeester en wethouders van de
      vorige contactgemeente alle bescheiden die betrekking hebben op de uitvoering van dit artikel over aan burgemeester
      en wethouders van de opvolgende contactgemeente. De wijziging van de aanwijzing wordt onverwijld gemeld aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118h
  - number: 118h.5
    text: |-
      Ter tegemoetkoming in de kosten van uitvoering van het eerste tot en met derde lid kent Onze Minister binnen
      het raam van de door de begrotingswetgever beschikbaar gestelde middelen jaarlijks uiterlijk in september ten
      behoeve van de activiteiten van de gemeentebesturen in de regio aan de contactgemeente een specifieke uitkering
      toe. Deze uitkering heeft betrekking op het daarop volgende kalenderjaar. De contactgemeente draagt er zorg voor
      dat de gemeentebesturen in de regio gebruik kunnen maken van de instrumenten die met behulp van deze uitkering
      zijn verwezenlijkt. Bij of krachtens algemene maatregel van bestuur worden regels gegeven voor de berekening en
      betaling van de uitkering. De berekening geschiedt in elk geval aan de hand van het aantal volwassen inwoners van
      de gemeenten in de regio op 1 januari van het jaar voorafgaande aan het jaar van de uitkering, waarbij rekening
      wordt gehouden met het opleidingsniveau en met de etnische achtergrond van die inwoners. Bij de berekening van een
      deel van de uitkering kunnen de volwassen inwoners van gemeenten die op grond van een andere regeling reeds een
      vergoeding voor de bestrijding van voortijdig schoolverlaten ontvangen, buiten beschouwing worden gelaten. Onze
      Minister hanteert het aantal volwassen inwoners van de gemeenten in de regio dat blijkt uit de gegevens die het
      Centraal Bureau voor de Statistiek op verzoek van Onze Minister daarover verstrekt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118h
  - number: 118h.6
    text: |-
      Het bevoegd gezag geeft aan de door de gemeenteraad aangewezen personen alle gevraagde bescheiden ter inzage
      en verstrekt de gevraagde inlichtingen die van belang zijn voor het voorkomen en bestrijden van voortijdig
      schoolverlaten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118h
  - number: 118h.7
    text: |-
      De gemeentebesturen in een regio stellen streefcijfers vast voor de in die regio te behalen resultaten.
      Burgemeester en wethouders van de contactgemeente stellen mede namens de andere gemeenten in de regio jaarlijks
      een effectrapportage vast waarin zowel de streefcijfers als de bereikte resultaten zijn aangegeven en waarin
      afwijkingen worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118h
  - number: 118h.8
    text: |-
      Indien burgemeester en wethouders van de contactgemeente het bepaalde bij of krachtens het eerste tot en met
      zevende lid niet nakomen, kan Onze Minister de uitkering geheel of gedeeltelijk inhouden of opschorten. Onze
      Minister gaat niet over tot gehele of gedeeltelijke inhouding dan na overleg met burgemeester en wethouders van
      de contactgemeente. Onze Minister kan de uitkering wederom toekennen indien de reden voor inhouding of opschorting
      is vervallen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118h
  - number: 118h.9
    text: |-
      Onze Minister kan de in het vijfde lid bedoelde uitkering geheel of gedeeltelijk terugvorderen indien
      uit de rekening van de gemeente, bedoeld in artikel [197 van de Gemeentewet][ref1], het gemeentelijk
      verslag omtrent het financieel beheer, bedoeld in [artikel 197 van de Gemeentewet][ref2], het
      verslag van de accountant, bedoeld in [artikel 213, tweede lid, van de Gemeentewet][ref3], dan wel
      uit een afzonderlijke verantwoording, voorzien van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4], niet blijkt dat de uitkering is besteed in
      overeenstemming met de bepalingen van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118h
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '213'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 118i.1
    text: |-
      Burgemeester en wethouders van de contactgemeente zenden de in [artikel 118h, zevende lid][ref1], bedoelde
      effectrapportage aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118h
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118h
  - number: 118i.2
    text: |-
      Burgemeester en wethouders zijn gehouden aan de door Onze Minister aangewezen personen alle gevraagde bescheiden
      ter inzage te geven en de gevraagde inlichtingen te verstrekken die van belang zijn voor het door Onze Minister te
      voeren beleid met betrekking tot het voortijdig schoolverlaten door niet-leerplichtigen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118i
  - number: 118i.3
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent het tijdstip van indiening en de
      inrichting van de effectrapportage en inzake de wijze van beschikbaarstelling van de gegevens, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel118i
  - number: '119.1'
    text: 'Dit deel is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel119
  - number: 119.1.a
    text: het militair onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel119
  - number: 119.1.b
    text: |-
      opleidingen ter vergroting der vakbekwaamheid, die uitsluitend worden gegeven binnen overheids- of semi-
      overheidsdiensten en -bedrijven ten behoeve van het eigen personeel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel119
  - number: '119.2'
    text: |-
      Voor zover bij algemene maatregel van bestuur niet anders wordt bepaald, is dit deel evenmin van toepassing
      op de inrichtingen, bedoeld in de [Penitentiaire beginselenwet][ref1], op de inrichtingen, bedoeld in
      [artikel 1, onder d, van de Beginselenwet verpleging ter beschikking gestelden][ref2], en op de inrichtingen,
      bedoeld in artikel 1, onder b, van de [Beginselenwet justitiële jeugdinrichtingen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009709
      [ref2]: https://wetten.overheid.nl/BWBR0008765#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011756
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0009709
      - id: ref2
        bwb_id: BWBR0008765
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0011756
  - number: '120'
    text: |-
      Bij twijfel of dit deel op een of meer inrichtingen van onderwijs van toepassing is, wordt beslist bij koninklijk
      besluit.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel120
  - number: '122.1'
    text: |-
      Voortgezet onderwijs wordt niet gegeven in lokalen, die door de krachtens de [Gezondheidswet][ref1] (Stb. 1956, 51)
      bevoegde inspecteur van het staatstoezicht op de volksgezondheid zijn afgekeurd als schadelijk voor de gezondheid,
      gevaar opleverende voor de veiligheid of wegens onvoldoende ruimte voor het aantal in die lokalen toegelaten
      leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002202
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0002202
  - number: '122.2'
    text: |-
      De inspecteur, bedoeld in het eerste lid, zendt zijn besluit tot afkeuring aan burgemeester en wethouders van de
      gemeente waarin het lokaal ligt. Op dezelfde dag doet hij van zijn besluit mededeling aan Onze minister; voorts,
      indien het een uit de openbare kas bekostigde school betreft, aan de inspectie en, indien het een bijzondere school
      betreft, aan het schoolbestuur.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel122
  - number: '122.3'
    text: |-
      Indien de inspecteur, bedoeld in het eerste lid, besluit dat het lokaal voldoende is verbeterd of dat het aantal
      leerlingen voldoende is beperkt, mag het onderwijs worden hervat. Aan hen, die ingevolge het bepaalde in het tweede
      lid van de afkeuring mededeling hebben ontvangen, wordt van dit besluit op gelijke wijze mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel122
  - number: '123.1'
    text: |-
      Hij, die in strijd met het voorschrift van [artikel 122, eerste lid][ref1], onderwijs geeft of doet geven in een
      afgekeurd lokaal, wordt gestraft met geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel122
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '122'
  - number: '123.2'
    text: Het feit, strafbaar gesteld in dit artikel, is een overtreding.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123
  - number: 123a.1
    text: |-
      Onze minister is ten aanzien van de rechtspersoon, bedoeld in [artikel 98a][ref1], bevoegd tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98a
        hoofdstuk: IV
        afdeling: II
  - number: 123a.1.a
    text: instemming met de statuten van de rechtspersoon, alsmede van wijziging van de statuten,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
  - number: 123a.1.b
    text: |-
      instemming met de bijdrage, bedoeld in [artikel 98a, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98a
        hoofdstuk: IV
        afdeling: II
  - number: 123a.1.c
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon in verband met de minimaal door de rechtspersoon te geven
      waarborgen, bedoeld in [artikel 98a, eerste lid][ref1], zulks in verband met de goede voortgang van het onderwijs,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98a
        hoofdstuk: IV
        afdeling: II
  - number: 123a.1.d
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon met het oog op de afstemming van activiteiten van de
      rechtspersoon op het algemene beleid inzake preventie van ziekteverzuim en arbeidsongeschiktheid,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
  - number: 123a.1.e
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon om de nakoming te verzekeren van verplichtingen die bij
      dit deel aan de rechtspersoon zijn opgedragen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
  - number: 123a.1.f
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon om de door Onze minister gewenste inlichtingen te
      verkrijgen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
  - number: 123a.1.g
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon in gevallen dat het algemeen belang dit in belangrijke
      mate vereist,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
  - number: 123a.1.h
    text: intrekking van de aanwijzing van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
  - number: 123a.2
    text: |-
      De rechtspersoon brengt jaarlijks voor 1 april aan Onze minister over het afgelopen jaar verslag uit over zijn
      werkzaamheden, voortvloeiend uit [artikel 98a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98a
        hoofdstuk: IV
        afdeling: II
  - number: 123a.3
    text: |-
      Onze minister zendt het verslag, bedoeld in het tweede lid, vergezeld van zijn advies daarover, voor 1 mei volgend
      op de datum, bedoeld in het tweede lid, aan de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
  - number: 123a.4
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de uitoefening van de in het eerste
      lid bedoelde bevoegdheden en omtrent de gevolgen van intrekking van de aanwijzing van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
  - number: 123a.5
    text: |-
      Krachtens bij algemene maatregel van bestuur vast te stellen voorschriften kan Onze Minister subsidie verlenen aan
      de rechtspersoon ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
  - number: 123a.5.a
    text: |-
      bedragen die, gedurende een vooraf vastgestelde periode en tot een vooraf vastgestelde maximale
      hoogte, strekken ter vervanging van de vergoeding in verband met de kosten van vervanging, bedoeld in
      [artikel 84b, eerste lid][ref1], en de bijdrage, bedoeld in het tweede lid,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel84b
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 84b
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: 123a.5.b
    text: een bijdrage aan de kosten van de bedrijfsvoering van de rechtspersoon, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
  - number: 123a.5.c
    text: een bijdrage ten behoeve van de uitoefening van landelijke taken in het kader van de bedrijfsgezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
  - number: 123a.6
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het vijfde lid, kan ten behoeve van een in dat lid bedoelde
      subsidie een subsidieplafond worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
  - number: 123a.7
    text: |-
      De rechtspersoon kan ten behoeve van de uitoefening van landelijke taken in het kader van de
      bedrijfsgezondheidszorg subsidie aan derden verstrekken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
  - number: 123a.8
    text: |-
      Het toezicht op de rechtspersoon is opgedragen aan Onze minister. Met het toezicht zijn belast de bij besluit
      van Onze minister aangewezen ambtenaren. Een besluit als bedoeld in de tweede volzin wordt bekendgemaakt in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
  - number: 123a.9
    text: |-
      De algemene maatregel van bestuur, bedoeld in het vierde en vijfde lid, wordt aan de Tweede Kamer der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken
      en gedurende die termijn niet door of namens de Kamer de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123a
  - number: 123b.1
    text: |-
      [Artikel 123a][ref1] is van overeenkomstige toepassing ten aanzien van de rechtspersoon, bedoeld in
      [artikel 98b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel123a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 123a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 98b
        hoofdstuk: IV
        afdeling: II
  - number: 123b.2
    text: |-
      Onze Minister zendt binnen vijf jaar na de aanwijzing van de rechtspersoon, bedoeld in [artikel 98b][ref1], en
      vervolgens telkens na vijf jaar, aan de Tweede Kamer der Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van de werkzaamheden van die rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel123b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98b
        hoofdstuk: IV
        afdeling: II
  - number: '124'
    text: |-
      In dit deel wordt verstaan onder: Onze minister: Onze minister van Onderwijs, Cultuur en Wetenschappen; inspectie
      of inspecteur: de inspectie bedoeld in artikel 128, voor zover belast met taken op het gebied van voortgezet
      speciaal onderwijs; voortgezet speciaal onderwijs: het onderwijs, bedoeld in artikel 125; school: een school voor
      voortgezet speciaal onderwijs als bedoeld in artikel 125, tenzij het tegendeel blijkt; basisschool: basisschool
      als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref1]; speciale school voor basisonderwijs: speciale
      school voor basisonderwijs als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref2]; voortgezet
      speciaal onderwijs: voortgezet speciaal onderwijs als bedoeld in artikel 125 van deel II van deze wet, tenzij
      het tegendeel blijkt; openbare school: a. een door een of meer gemeenten, al dan niet te zamen met een of meer
      privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid in stand gehouden school; b. een door een
      openbare rechtspersoon als bedoeld in artikel 168 in stand gehouden school; dan wel c. een door een stichting als
      bedoeld in artikel 148 of artikel 169 in stand gehouden school; bijzondere school: door een natuurlijk persoon
      of een privaatrechtelijke rechtspersoon, niet zijnde een stichting als bedoeld in artikel 169, in stand gehouden
      school; openbare rechtspersoon: een rechtspersoon die krachtens publiekrecht is ingesteld als bedoeld in artikel
      168; bevoegd gezag van volgens dit deel bekostigde scholen voor wat betreft: a. een openbare school: 1°. het
      college van burgemeester en wethouders, voor zover de raad niet anders bepaalt, en, indien de raad dit besluit,
      met inachtneming van door hem te stellen regelen; 2°. het krachtens de desbetreffende gemeenschappelijke regeling
      bevoegde orgaan; 3°. de openbare rechtspersoon, bedoeld in artikel 168; dan wel 4°. de stichting, bedoeld in
      artikel 148 of artikel 169; b. een bijzondere school: de rechtspersoon bedoeld in artikel 175; ouders: ouders,
      voogden of verzorgers; schooljaar: het tijdvak van 1 augustus tot en met 31 juli daaraanvolgend; «nascholing»: een
      vorm van scholing, gegeven aan leden van het personeel om hun kennis, inzicht, vaardigheden en beroepshoudingen
      direct verband houdend met de uitoefening van hun beroep, voortbouwend op de in de initiële opleiding verworven
      aanvangsbekwaamheid te verdiepen en uit te breiden; schoolplan: een schoolplan als bedoeld in artikel 141.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '1'
  - number: '125.1'
    text: |-
      Het voortgezet speciaal onderwijs, bedoeld in dit deel, is voortgezet onderwijs, bestemd voor kinderen voor wie
      vaststaat dat overwegend een orthopedagogische en orthodidactische benadering aangewezen is. Het omvat niet het
      voortgezet speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '125.2'
    text: 'Het voortgezet speciaal onderwijs wordt verdeeld in onderwijs aan:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel125
  - number: 125.2.a
    text: moeilijk lerende kinderen; en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel125
  - number: 125.2.b
    text: kinderen met leer- en opvoedingsmoeilijkheden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel125
  - number: '126.1'
    text: 'Voortgezet speciaal onderwijs mag slechts worden gegeven door degene die:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel126
  - number: 126.1.a
    text: |-
      in het bezit is van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref1] (Stb. 1955, 395),


      [ref1]: https://wetten.overheid.nl/BWBR0002195
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0002195
  - number: 126.1.b
    text: |-
      in het bezit is van een bewijs van bekwaamheid bedoeld in artikel 286, of van een daarmee krachtens het derde
      lid gelijk gesteld bewijs van bekwaamheid, dan wel van Onze minister krachtens het vierde of het vijfde lid
      de bevoegdheid heeft verkregen, of van een ten aanzien van het door hem te geven onderwijs afgegeven EG-
      verklaring als bedoeld in de [Algemene wet erkenning EG-hoger-onderwijsdiploma's][ref1] dan wel in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref2], dan wel in het bezit is van een verklaring als bedoeld in het
      zesde lid, en


      [ref1]: https://wetten.overheid.nl/BWBR0006317
      [ref2]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0006317
      - id: ref2
        bwb_id: BWBR0006781
  - number: 126.1.c
    text: niet krachtens rechterlijke uitspraak van het geven van onderwijs is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel126
  - number: '126.2'
    text: |-
      Het eerste lid onder a en b is niet van toepassing voor het geven van godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel126
  - number: '126.3'
    text: |-
      Bij ministeriële regeling kan een buiten Nederland verworven bewijs worden gelijkgesteld met een bewijs van
      bekwaamheid genoemd in artikel 286. Daarbij kunnen voorwaarden en beperkingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel126
  - number: '126.4'
    text: |-
      Onze minister kan aan personen die in het bezit zijn van een buiten Nederland behaald bewijs van bekwaamheid,
      de bevoegdheid tot het geven van speciaal onderwijs en voortgezet speciaal onderwijs verlenen. Hij kan daarbij
      voorwaarden en beperkingen stellen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel126
  - number: '126.5'
    text: |-
      Onze minister kan in bijzondere gevallen aan personen die niet in het bezit zijn van een bewijs van bekwaamheid, de
      bevoegdheid tot het geven van het onderwijs bedoeld in artikel 273, eerste lid, geven. Hij kan daarbij voorwaarden
      en beperkingen stellen. Indien betrokkene niet in het bezit is van één van de op grond van artikel 286, vijfde lid,
      aangewezen verklaringen en diploma’s met betrekking tot de beheersing van de Nederlandse taal, kan Onze minister de
      bevoegdheid éénmalig en voor ten hoogste 2 jaar verlenen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel126
  - number: '126.6'
    text: |-
      Onze minister kan met betrekking tot een vak waarvoor geen bewijs van bekwaamheid is aangewezen, verklaren dat
      een leraar wordt geacht in het bezit te zijn van een bewijs van bekwaamheid tot het geven van voortgezet speciaal
      onderwijs in dat vak en van een bewijs van voldoende pedagogische en didactische voorbereiding.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel126
  - number: '126.7'
    text: |-
      Bij tijdelijke afwezigheid van een leraar kan ten aanzien van degene die hem vervangt, telkens voor ten hoogste 1
      jaar worden afgeweken van de eisen van benoembaarheid, gesteld in het eerste lid onder b. Indien in een vacature
      niet terstond kan worden voorzien door de benoeming van een leraar die aan de genoemde eisen voldoet, is het
      bepaalde in de vorige volzin van overeenkomstige toepassing. Indien toepassing is gegeven aan de eerste of de
      tweede volzin, doet het bevoegd gezag daarvan binnen 4 weken schriftelijk mededeling aan de inspecteur onder
      vermelding van de redenen die tot de toepassing hebben genoodzaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel126
  - number: '126.8'
    text: 'Onverminderd het zevende lid, kan ten aanzien van studenten die:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel126
  - number: 126.8.a
    text: |-
      een duale opleiding volgen als bedoeld in
      [artikel 7.7 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] leidend tot een getuigschrift
      dat bij of krachtens artikel 286 is aangewezen als bewijs van bekwaamheid, en aan die opleiding ten minste 126
      studiepunten hebben behaald, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 126.8.b
    text: |-
      een duale opleiding volgen als bedoeld in
      [artikel 7.7a van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], leidend tot een getuigschrift
      als bedoeld onder a,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '127.1'
    text: |-
      Ten behoeve van het schoolbezoek verstrekken burgemeester en wethouders aan ouders van in de gemeente verblijvende
      leerlingen die wegens hun lichamelijke, verstandelijke of zintuiglijke handicap op ander vervoer dan openbaar
      vervoer zijn aangewezen, dan wel vanwege een zodanige handicap niet zelfstandig van openbaar vervoer gebruik kunnen
      maken, op aanvraag bekostiging van de door burgemeester en wethouders noodzakelijk te achten vervoerskosten. Indien
      de leerling meerderjarig en handelingsbekwaam is, wordt de bekostiging op aanvraag verstrekt aan de leerling. De
      gemeenteraad stelt daartoe een nadere regeling vast, met inachtneming van het bepaalde in de volgende leden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel127
  - number: '127.2'
    text: De regeling maakt geen onderscheid tussen openbaar en bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel127
  - number: '127.3'
    text: |-
      De regeling eerbiedigt de op godsdienst of levensbeschouwing van de ouders, dan wel, indien de leerling
      meerderjarig en handelingsbekwaam is, van de leerling berustende keuze van een school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel127
  - number: '127.4'
    text: |-
      De regeling voorziet erin dat het vervoer kan plaatsvinden op een wijze die voor de leerling passend is. De
      regeling bepaalt op welke wijze burgemeester en wethouders terzake advies van deskundigen inwinnen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel127
  - number: '127.5'
    text: |-
      De regeling bepaalt dat de kosten worden vergoed van vervoer over de afstand tussen de woning van de leerling en
      de dichtstbijzijnde voor de leerling toegankelijke school, met inachtneming van de keuze van de ouders, dan wel,
      indien de leerling meerderjarig en handelingsbekwaam is, van de leerling, tenzij vervoer met betrekking tot een
      verder weg gelegen school voor de gemeente minder kosten met zich zou brengen en de ouders onderscheidenlijk de
      leerling met het vervoer naar die school instemmen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel127
  - number: '127.6'
    text: |-
      De regeling kan bepalen dat de gemeente, in plaats van bekostiging in geld te geven, het vervoer verzorgt of doet
      verzorgen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel127
  - number: '127.7'
    text: |-
      De regeling kan bepalen dat burgemeester en wethouders in bijzondere gevallen de bevoegdheid hebben ten gunste
      van de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, ten gunste van de leerling van de
      inhoud van de regeling af te wijken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel127
  - number: 127a.1
    text: |-
      Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn school met taken
      belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden als bedoeld in
      [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een minderjarige leerling van de school, treedt het bevoegd
      gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in artikel 128a.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel127a
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: 127a.2
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van
      een redelijk vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf
      als bedoeld in het eerste lid jegens een minderjarige leerling van de school, doet het bevoegd
      gezag onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 127][ref1] juncto
      [artikel 141 van het Wetboek van Strafvordering][ref2], en stelt het bevoegd gezag de vertrouwensinspecteur daarvan
      onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van aangifte, stelt het de ouders van de
      betrokken leerling, onderscheidenlijk de betreffende ten behoeve van de school met taken belaste persoon, hiervan
      op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel127a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 127a.3
    text: |-
      Indien een personeelslid op enigerlei wijze bekend is geworden dat een ten behoeve van de school met taken belast
      persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een
      minderjarige leerling van de school, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel127a
  - number: '128.1'
    text: |-
      Het toezicht op het voortgezet speciaal onderwijs en de deugdelijkheid ervan is opgedragen aan Onze minister. Het
      wordt onder zijn gezag uitgeoefend door de inspectie van het onderwijs onder leiding van de inspecteur-generaal van
      het onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128
  - number: '128.2'
    text: 'Tot de taak van de inspectie behoort:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128
  - number: 128.2.a
    text: het toezien op de naleving van de wettelijke voorschriften;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128
  - number: 128.2.b
    text: het bekend blijven met de toestand van het voortgezet speciaal onderwijs onder meer door bezoek aan de scholen;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128
  - number: 128.2.c
    text: |-
      de bevordering van de ontwikkeling van het voortgezet speciaal onderwijs door overleg met het bevoegd gezag, het
      personeel van de scholen en de besturen van gemeente en provincie;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128
  - number: 128.2.d
    text: het verrichten van andere bij deze wet aan de inspectie opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128
  - number: 128.2.e
    text: het doen van voorstellen aan Onze minister die zij in het belang van het voortgezet speciaal onderwijs nodig acht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128
  - number: '128.3'
    text: |-
      Bij de uitoefening van de taken van de inspectie zijn de [artikelen 5:12 tot en met 5:17][ref1] en
      [artikel 5:20 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '128.4'
    text: |-
      Tegen een krachtens deze wet of haar uitvoeringsvoorschriften door de inspecteur genomen besluit kan iedere
      belanghebbende administratief beroep instellen bij Onze minister.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128
  - number: 128a.1
    text: 'Bij de inspectie zijn vertrouwensinspecteurs werkzaam ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128a
  - number: 128a.1.a
    text: |-
      leerlingen die het slachtoffer zijn van seksueel misbruik of seksuele intimidatie, gepleegd door een ten behoeve
      van de school met taken belast persoon of een leerling van de school;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128a
  - number: 128a.1.b
    text: |-
      ten behoeve van een school met taken belaste personen die het slachtoffer zijn van seksueel misbruik of seksuele
      intimidatie, gepleegd door een ten behoeve van de school met taken belast persoon of een leerling van de school;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128a
  - number: 128a.1.c
    text: |-
      leerlingen, ten behoeve van een school met taken belaste personen, bevoegde gezagsorganen, ouders, op scholen
      ingestelde klachtencommissies en op scholen aangestelde vertrouwenspersonen, die geconfronteerd worden met een
      geval van seksueel misbruik of seksuele intimidatie als bedoeld onder a of b.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128a
  - number: 128a.2
    text: |-
      Naast zijn taken, voortvloeiend uit artikel 128, heeft de vertrouwensinspecteur ten behoeve van de in het eerste
      lid genoemde personen en organen de volgende taken:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128a
  - number: 128a.2.a
    text: het fungeren als aanspreekpunt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128a
  - number: 128a.2.b
    text: het adviseren over eventueel te nemen stappen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128a
  - number: 128a.2.c
    text: het bijstaan bij het nemen van stappen gericht op het zoeken naar een oplossing, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128a
  - number: 128a.2.d
    text: het desgevraagd begeleiden bij het indienen van een klacht of het doen van aangifte.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128a
  - number: 128a.3
    text: |-
      De vertrouwensinspecteur is, voor zover het betreft misdrijven als bedoeld in
      [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een leerling of een ten behoeve van een school
      met taken belast persoon, vrijgesteld van de verplichting tot het doen van aangifte als bedoeld in de
      [artikelen 160, eerste lid][ref2], en [162, eerste lid, van het Wetboek van Strafvordering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel160
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel162
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128a
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '160'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '162'
  - number: 128a.4
    text: |-
      De vertrouwensinspecteur is verplicht tot geheimhouding van hetgeen hem in de uitoefening van zijn functie is
      toevertrouwd door een leerling, de ouders van een leerling of een ten behoeve van een school met taken belast
      persoon.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel128a
  - number: '129'
    text: |-
      Ten laste van een andere openbare kas dan van Rijk en gemeente worden geen scholen in stand gehouden, noch uitgaven
      voor een school gedaan. Gemeenten doen geen uitgaven voor een niet door de gemeente in stand gehouden school dan
      krachtens de wet.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel129
  - number: '130.1'
    text: |-
      Dit deel is niet van toepassing op scholen die uitsluitend bestemd zijn voor kinderen die niet de Nederlandse
      nationaliteit hebben.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel130
  - number: '130.2'
    text: Bij twijfel of op een school het eerste lid van toepassing is, besluit de Kroon, de Raad van State gehoord.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel130
  - number: '131'
    text: |-
      Het onderwijs wordt gegeven in scholen voor voortgezet speciaal onderwijs, verdeeld als aangegeven in artikel 125,
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel131
  - number: '132.1'
    text: |-
      Onze minister kan op verzoek van het bevoegd gezag toestaan dat tot de desbetreffende school kinderen
      worden toegelaten die toelaatbaar zijn tot een of meer van de andere soorten onderwijs als bedoeld
      in artikel 125, tweede lid, van deel II van deze wet of het voortgezet speciaal onderwijs, bedoeld in
      [artikel 2, tweede lid onder a tot en met h, m en n, van de Wet op de expertisecentra][ref1]. Daarbij kan Onze
      minister voorwaarden stellen en hoort hij gedeputeerde staten. Gedeputeerde staten geven slechts advies met
      betrekking tot de gevolgen van de toelating voor een evenwichtig geheel van onderwijsvoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '132.2'
    text: |-
      Het bevoegd gezag kan, met toestemming van de inspecteur, een kind dat toelaatbaar is tot een van de soorten
      onderwijs als bedoeld in artikel 125, tweede lid, van deel II van deze wet of tot het voortgezet speciaal
      onderwijs, bedoeld in [artikel 2, tweede lid, van de Wet op de expertisecentra][ref1], maar voor wie niet een
      passende school in zijn woonplaats of de omgeving daarvan bestaat, toelaten tot een andere school, mits het kind
      daar voldoende onderwijs kan genieten.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '133.1'
    text: |-
      Het onderwijs wordt afgestemd op de ontwikkelingsmogelijkheden van de leerling. Het wordt zodanig ingericht dat de
      leerling een ononderbroken ontwikkelingsproces kan doorlopen. Zo mogelijk brengt het kinderen tot het volgen van
      gewoon onderwijs in scholen voor voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel133
  - number: '133.2'
    text: |-
      Het onderwijs richt zich in elk geval op de emotionele en de verstandelijke ontwikkeling, op het ontwikkelen van
      creativiteit, het verwerven van kennis en van sociale, culturele en lichamelijke vaardigheden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel133
  - number: '133.3'
    text: Het onderwijs gaat er mede van uit dat de leerlingen opgroeien in een multiculturele samenleving.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel133
  - number: '133.4'
    text: Het onderwijs wordt zodanig ingericht dat de leerlingen per schooljaar ten minste 1000 uren onderwijs ontvangen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel133
  - number: '133.5'
    text: |-
      De leerlingen ontvangen per dag ten hoogste 5,5 uren onderwijs, waarbij een evenwichtige verdeling van de
      activiteiten in acht wordt genomen, tenzij afwijking van dit maximale aantal van belang is in verband met
      activiteiten in het kader van het voorkomen en bestrijden van onderwijsachterstanden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel133
  - number: '133.6'
    text: |-
      Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel133
  - number: '134'
    text: |-
      De inspecteur kan op verzoek van het bevoegd gezag ermee instemmen dat wordt afgeweken van artikel 133, vierde en,
      voor zover het betreft het aantal uren onderwijs, vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel134
  - number: '135.1'
    text: 'Voortgezet speciaal onderwijs omvat, waar mogelijk in samenhang, in elk geval:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel135
  - number: 135.1.a
    text: Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel135
  - number: 135.1.b
    text: geschiedenis, waaronder staatsinrichting;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel135
  - number: 135.1.c
    text: aardrijkskunde;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel135
  - number: 135.1.d
    text: maatschappijleer;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel135
  - number: 135.1.e
    text: wiskunde en rekenen;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel135
  - number: 135.1.f
    text: muziek;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel135
  - number: 135.1.g
    text: tekenen;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel135
  - number: 135.1.h
    text: handvaardigheid;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel135
  - number: 135.1.i
    text: lichamelijke oefening.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel135
  - number: '135.2'
    text: |-
      Voortgezet speciaal onderwijs omvat voorts ten minste 2 van de vakken die gegeven worden in het voorbereidend
      beroepsonderwijs, het algemeen voortgezet onderwijs en het voorbereidend wetenschappelijk onderwijs, anders dan de
      vakken bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel135
  - number: '135.3'
    text: |-
      Op de scholen in de provincie Friesland kan het voortgezet speciaal onderwijs mede onderwijs in de Friese taal
      omvatten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel135
  - number: '135.4'
    text: 'Bij algemene maatregel van bestuur kunnen per schoolsoort voorschriften worden gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel135
  - number: 135.4.a
    text: het maximum aantal vakken bedoeld in het tweede lid, waarin onderwijs wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel135
  - number: 135.4.b
    text: de combinatie van vakken waarin onderwijs wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel135
  - number: '136'
    text: |-
      Onze minister kan op verzoek van het bevoegd gezag toestaan dat wordt afgeweken van het bepaalde in of krachtens
      artikel 135. De toestemming wordt verleend voor een bepaald tijdvak en slechts indien:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel136
  - number: 136.a
    text: een voor de kinderen ten behoeve waarvan de toestemming is gevraagd, toegankelijke school ontbreekt, dan wel
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel136
  - number: 136.b
    text: |-
      dit gewenst is voor het door Onze minister te voeren beleid ten aanzien van de ontwikkeling van het voortgezet
      speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel136
  - number: '137.1'
    text: |-
      Het onderwijs kan een stage omvatten. Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven
      omtrent de stage.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel137
  - number: '137.2'
    text: |-
      De algemene maatregel van bestuur bedoeld in het eerste lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure
      bedoeld in de eerste 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel137
  - number: '138.1'
    text: |-
      Het onderwijs wordt gegeven in het Nederlands. Daar waar naast de Nederlandse taal, de Friese taal of een
      streektaal in levend gebruik is, kan de Friese taal of de streektaal mede als voertaal bij het onderwijs worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel138
  - number: '138.2'
    text: |-
      Voor de opvang in en de aansluiting bij het Nederlandse onderwijs van leerlingen met een niet-Nederlandse
      culturele achtergrond kan de taal van het land van oorsprong mede als voertaal bij het onderwijs worden gebruikt,
      overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel138
  - number: 138a.1
    text: |-
      Bij het geven van onderwijs aan een leerling die is opgenomen in een ziekenhuis of die in verband met ziekte thuis
      verblijft, kan het bevoegd gezag van een school worden ondersteund.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel138a
  - number: 138a.2
    text: 'De ondersteuning bedoeld in het eerste lid wordt verzorgd door:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel138a
  - number: 138a.2.a
    text: |-
      een educatieve voorziening als bedoeld in
      [artikel 1.4, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] indien de leerling
      is opgenomen in een academisch ziekenhuis of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel138a
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 138a.2.b
    text: |-
      een schoolbegeleidingsdienst als bedoeld in artikel 280, indien de leerling is opgenomen in een ziekenhuis niet
      zijnde een academisch ziekenhuis dan wel indien de leerling in verband met ziekte thuis verblijft.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel138a
  - number: 138a.3
    text: |-
      De ondersteuning bedoeld in het eerste lid kan in overeenstemming tussen de educatieve voorziening dan wel de
      schoolbegeleidingsdienst en de school waarbij de leerling is ingeschreven, mede het geven van onderwijs aan de
      leerling betreffen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel138a
  - number: '139'
    text: |-
      Het bevoegd gezag draagt zorg voor de kwaliteit van het onderwijs op de school. Onder zorg dragen voor de kwaliteit
      van het onderwijs wordt in elk geval verstaan: het uitvoeren van het in het schoolplan, bedoeld in artikel 141,
      beschreven beleid op een zodanige wijze dat de wettelijke opdrachten voor het onderwijs en de door het bevoegd
      gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs, worden gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel139
  - number: '140'
    text: |-
      Het bevoegd gezag rapporteert over de vorderingen van de leerlingen aan hun ouders dan wel aan de leerlingen zelf
      indien zij meerderjarig en handelingsbekwaam zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel140
  - number: '141.1'
    text: |-
      Het schoolplan bevat een beschrijving van het beleid met betrekking tot de kwaliteit van het onderwijs dat binnen
      de school wordt gevoerd, en omvat in elk geval het onderwijskundig beleid, het personeelsbeleid en het beleid met
      betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs. Het schoolplan omvat mede het beleid
      ten aanzien van de aanvaarding van materiële bijdragen of geldelijke bijdragen, niet zijnde ouderbijdragen of op
      de onderwijswetgeving gebaseerde bijdragen, indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee
      de leerlingen binnen de schooltijden en tijdens de activiteiten die worden georganiseerd onder verantwoordelijkheid
      van het bevoegd gezag, alsmede tijdens het overblijven, zullen worden geconfronteerd. Het schoolplan kan op een
      of meer scholen voor speciaal onderwijs, voor voortgezet speciaal onderwijs, voor speciaal en voortgezet speciaal
      onderwijs, en instellingen voor speciaal en voortgezet speciaal onderwijs en een of meer scholen voor ander
      onderwijs van hetzelfde bevoegd gezag betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel141
  - number: '141.2'
    text: |-
      Het onderwijskundig beleid omvat in elk geval de uitwerking van de wettelijke opdrachten voor het onderwijs
      en van de door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs in een
      onderwijsprogramma. Daarbij worden tevens betrokken de bijzondere voorzieningen die zijn getroffen voor leerlingen
      of groepen leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel141
  - number: '141.3'
    text: |-
      Het personeelsbeleid, voor zover dat in het schoolplan tot uitdrukking wordt gebracht, omvat in elk geval
      maatregelen met betrekking tot het personeel die bijdragen aan de ontwikkeling en de uitvoering van het
      onderwijskundig beleid alsmede het document inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding,
      bedoeld in artikel 150 van de wet.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel141
  - number: '141.4'
    text: |-
      Het beleid met betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs omvat in elk geval
      op welke wijze het bevoegd gezag bewaakt dat die kwaliteit wordt gerealiseerd en vaststelt welke maatregelen ter
      verbetering van de kwaliteit nodig zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel141
  - number: '142.1'
    text: |-
      De schoolgids bevat voor ouders en leerlingen informatie over de werkwijze van de school en bevat in elk geval
      informatie over:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel142
  - number: 142.1.a
    text: de doelen van het onderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel142
  - number: 142.1.b
    text: de bijzondere voorzieningen voor leerlingen of groepen leerlingen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel142
  - number: 142.1.c
    text: de wijze waarop de verplichte onderwijstijd wordt benut,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel142
  - number: 142.1.d
    text: |-
      de geldelijke bijdrage, bedoeld in artikel 160, eerste lid, waarbij een ontwerp van een overeenkomst voor een
      dergelijke bijdrage, die voldoet aan de eisen die in artikel 160, eerste lid, zijn geformuleerd, in de schoolgids
      wordt opgenomen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel142
  - number: 142.1.e
    text: |-
      de rechten en plichten van de ouders, de leerlingen en het bevoegd gezag, waaronder de informatie over de
      klachtenregeling, bedoeld in artikel 143, en de gronden voor vrijstelling van het onderwijs, bedoeld in artikel
      164, tweede lid, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel142
  - number: 142.1.f
    text: de wijze waarop het bevoegd gezag omgaat met de in artikel 141, eerste lid, omschreven bijdragen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel142
  - number: '142.2'
    text: |-
      Het bevoegd gezag reikt de schoolgids uit aan de ouders dan wel de meerderjarige en handelingsbekwame leerling bij
      de inschrijving en jaarlijks na de vaststelling van de schoolgids.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel142
  - number: '143.1'
    text: |-
      Ouders en personeelsleden kunnen bij de klachtencommissie, bedoeld in het tweede lid, onderdeel a, een klacht
      indienen over gedragingen en beslissingen van het bevoegd gezag of het personeel, waaronder discriminatie, dan
      wel het nalaten van gedragingen en het niet nemen van beslissingen door het bevoegd gezag of het personeel. Een
      zodanige klacht kan eveneens worden ingediend door:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: 143.1.a
    text: |-
      leerlingen van scholen voor speciaal onderwijs of voor speciaal en voortgezet speciaal onderwijs, die de leeftijd
      van 13 jaren hebben bereikt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: 143.1.b
    text: leerlingen van scholen voor voortgezet speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: '143.2'
    text: 'Het bevoegd gezag treft een regeling voor de behandeling van klachten. Deze regeling vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: 143.2.a
    text: de instelling van een klachtencommissie, die klachten behandelt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: 143.2.b
    text: de wijze waarop de klachtencommissie haar werkzaamheden verricht,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: 143.2.c
    text: de termijn waarbinnen de klager een klacht kan indienen en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: 143.2.d
    text: |-
      de termijn waarbinnen mededeling plaatsvindt van het oordeel, bedoeld in het zesde lid, en hoe bij noodzakelijke
      afwijking van deze termijn wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: '143.3'
    text: |-
      Deze regeling strekt ter vervanging van klachtenregelingen op grond van andere voorschriften dan dit artikel en
      strekt niet ter vervanging van een andere voorziening die op grond van een wettelijke regeling, niet zijnde een
      klachtenregeling, voor de klager openstaat of heeft opengestaan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: '143.4'
    text: Deze regeling
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: 143.4.a
    text: |-
      voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit ten minste drie leden,
      waaronder een voorzitter die geen deel uitmaakt van het bevoegd gezag en niet werkzaam is voor of bij het bevoegd
      gezag en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: 143.4.b
    text: |-
      waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: '143.5'
    text: 'De klager en degene over wie is geklaagd krijgen de gelegenheid:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: 143.5.a
    text: hun zienswijze mondeling of schriftelijk toe te lichten en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: 143.5.b
    text: zich bij de behandeling van de klacht te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: '143.6'
    text: |-
      De klachtencommissie vormt zich een oordeel over de gegrondheid van de klacht en deelt dit oordeel, al dan niet
      vergezeld van aanbevelingen, schriftelijk mede aan de klager, degene over wie is geklaagd en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: '143.7'
    text: |-
      Het bevoegd gezag deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onderdeel a, binnen 4 weken
      na ontvangst van het in het zesde lid bedoelde oordeel van de klachtencommissie schriftelijk mede of hij het
      oordeel over de gegrondheid van de klacht deelt en of hij naar aanleiding van dat oordeel maatregelen zal nemen en
      zo ja welke. Bij afwijking van de in de eerste volzin bedoelde termijn, doet het bevoegd gezag daarvan met redenen
      omkleed mededeling aan de klager en de klachtencommissie onder vermelding van de termijn waarbinnen het bevoegd
      gezag zijn standpunt bekend zal maken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: '143.8'
    text: |-
      Degene die betrokken is bij de uitvoering van dit artikel en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, is verplicht tot geheimhouding daarvan,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: '143.9'
    text: |-
      Gegevens die betrekking hebben op een klacht worden bewaard op een plaats die uitsluitend toegankelijk is voor de
      leden van de klachtencommissie en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel143
  - number: '144'
    text: |-
      Een deel van een schoolplan kan worden uitgevoerd door een school voor voorbereidend beroepsonderwijs, door andere
      vormen van regulier voortgezet onderwijs of door een instelling voor educatie en beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel144
  - number: '145.1'
    text: 'Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel145
  - number: 145.1.a
    text: de uitvoering van artikel 144;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel145
  - number: 145.1.b
    text: 'de aard van en de eisen aan:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel145
  - number: 145.1.b.1°
    text: de voorzieningen bedoeld in artikel 144 en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel145
  - number: 145.1.b.2°
    text: |-
      de voorzieningen die door het bevoegd gezag worden getroffen ten behoeve van leerlingen die zijn geplaatst
      op of zijn overgeplaatst naar een school voor voortgezet onderwijs of een opleiding als bedoeld in
      [artikel 7.2.2., eerste lid, onder a en b, van de Wet educatie en beroepsonderwijs][ref1] en die zonder deze
      voorzieningen zouden zijn aangewezen op het speciaal onderwijs of het voortgezet speciaal onderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 145.1.c
    text: |-
      de faciliteiten die voor de voorzieningen bedoeld in onderdeel b, onder 2°, ter beschikking worden gesteld en de
      soorten van scholen die daarvoor in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel145
  - number: 145.1.d
    text: |-
      het partieel en tijdelijk meetellen van leerlingen die zijn ingeschreven op een school voor voortgezet speciaal
      onderwijs dan wel een school of een instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in de
      [Wet op de expertisecentra][ref1], een school voor voortgezet onderwijs of een andere school.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '145.2'
    text: |-
      De algemene maatregel van bestuur bedoeld in het eerste lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken, en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure
      bedoeld in de eerste 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel145
  - number: '146.1'
    text: |-
      Indien een leerling gedurende een deel van de week onderwijs ontvangt op een school voor voortgezet onderwijs, telt
      voor een tijdvak van ten hoogste 3 maanden de tijd gedurende welke de leerling dit onderwijs ontvangt, mee voor het
      aantal uren onderwijs dat de leerling ten minste moet ontvangen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel146
  - number: '146.2'
    text: |-
      Bij ministeriële regeling kunnen begin en eind van de zomervakantie worden vastgesteld die niet voor alle scholen
      gelijk behoeven te zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel146
  - number: '147.1'
    text: Het bevoegd gezag stelt ten minste eenmaal in de 4 jaar het schoolplan vast.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel147
  - number: '147.2'
    text: Het bevoegd gezag stelt jaarlijks de schoolgids vast ten behoeve van het eerstvolgende schooljaar.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel147
  - number: '147.3'
    text: |-
      Het bevoegd gezag zendt het schoolplan dan wel de wijzigingen daarvan en de schoolgids onmiddellijk na de
      vaststelling aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel147
  - number: '148.1'
    text: |-
      De instandhouding van een of meer openbare en een of meer bijzondere scholen kan worden opgedragen of overgedragen
      aan een stichting die met dit doel wordt onderscheidenlijk is opgericht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: '148.2'
    text: |-
      Het statutaire doel van de stichting is in elk geval het geven van openbaar onderwijs en onderwijs van een of meer
      richtingen in afzonderlijke scholen voor openbaar onderscheidenlijk bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: '148.3'
    text: |-
      De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken en
      bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: '148.4'
    text: |-
      Het personeel dat werkzaam is aan de openbare school, wordt benoemd krachtens een arbeidsovereenkomst naar
      burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: '148.5'
    text: 'De statuten voorzien in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: 148.5.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: 148.5.b
    text: de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: 148.5.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: 148.5.d
    text: |-
      de vaststelling van de begroting en jaarrekening na overleg met de gemeenteraad van de gemeente waarin de openbare
      school is gelegen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: 148.5.e
    text: |-
      de wijze waarop de gemeenteraad van de gemeente waarin de openbare school is gelegen, toezicht op het bestuur van
      de openbare school uitoefent,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: 148.5.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: 148.5.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: 148.5.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd voor zover het openbaar onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: '148.6'
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na goedkeuring van de gemeenteraad van de gemeente
      waarin de openbare school is gelegen. Goedkeuring kan slechts worden onthouden indien overheersende invloed van de
      overheid in het bestuur niet is verzekerd voor zover het openbaar onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: '148.7'
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad van de gemeente waarin de openbare school is gelegen, verslag uit
      over de werkzaamheden, waarbij in ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar
      onderwijs. Het verslag wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: '148.8'
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: '148.9'
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover het
      openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waarin de openbare school is gelegen, de
      maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het openbaar
      onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
  - number: '148.10'
    text: |-
      [Artikel 155 van de Gemeentewet][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel155
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '155'
  - number: '149.1'
    text: |-
      Aan elke school is een directeur verbonden, bij wie onder verantwoordelijkheid van het bevoegd gezag de
      onderwijskundige, organisatorische en huishoudelijke leiding berust. De functie van directeur kan minder dan een
      volledige formatieplaats omvatten. De directeur van een school kan tevens met de leiding worden belast van een
      andere school waar de functie van directeur vacant is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel149
  - number: '149.2'
    text: Aan een school zijn een of meer leraren verbonden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel149
  - number: '149.3'
    text: |-
      Een of meer leraren kunnen tevens tot adjunct-directeur worden benoemd. Indien geen adjunct-directeur wordt
      benoemd, wijst het bevoegd gezag een leraar aan als plaatsvervanger van de directeur.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel149
  - number: '149.4'
    text: |-
      Voor zover het betreft de functie van directeur en adjunct-directeur, wordt in geval van samenvoeging van scholen
      de overblijvende school gelijkgesteld met een nieuwe school. De directeur, onderscheidenlijk de adjunct-directeur
      of adjunct-directeuren, kan slechts een van de directeuren onderscheidenlijk kunnen slechts een of meer van de
      adjunct-directeuren van de samen te voegen scholen zijn, tenzij geen van de betrokkenen de desbetreffende functie
      wenst te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel149
  - number: '149.5'
    text: Aan een school kan onderwijsondersteunend personeel zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel149
  - number: '149.6'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke rechtspositionele gevolgen zijn verbonden aan functies die
      zowel onderwijsgevende als onderwijsondersteunende taken omvatten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel149
  - number: '150.1'
    text: |-
      Het bevoegd gezag stelt ten behoeve van de directie van elk van zijn scholen, indien daaraan van een
      ondervertegenwoordiging van vrouwen in de directie sprake is, eenmaal in de 4 jaar een document inzake evenredige
      vertegenwoordiging van vrouwen in de schoolleiding vast.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel150
  - number: '150.2'
    text: |-
      Het document bevat streefcijfers, met inbegrip van een bepaald tijdvak waarbinnen deze streefcijfers worden
      gerealiseerd, aan de hand waarvan door het bevoegd gezag een beleid inzake evenredige vertegenwoordiging van
      vrouwen in de schoolleiding wordt gevoerd, opdat in de directie van elke school van het bevoegd gezag vrouwen
      en mannen naar evenredigheid werkzaam zullen zijn. Voor de evenredige vertegenwoordiging wordt uitgegaan van de
      verhouding mannen en vrouwen voor wat betreft het onderwijzend personeel dat werkzaam is in het door de school
      verzorgde onderwijs, zoals die blijkt uit de daarover jaarlijks door Onze minister gepubliceerde cijfers. Het
      document vermeldt tevens de maatregelen die het bevoegd gezag heeft genomen en zal nemen teneinde de in de eerste
      volzin bedoelde streefcijfers te realiseren en geeft een overzicht van de beoogde en bereikte resultaten van het
      beleid inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding gedurende de periode waarvoor het
      document geldt, onderscheidenlijk de periode waarvoor het vorige document gold.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel150
  - number: '150.3'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een exemplaar van het document in het gebouw van de school ter inzage
      wordt gelegd op een voor het personeel, de ouders en de leerlingen toegankelijke plaats, alsmede dat een exemplaar
      wordt bewaard bij de administratie van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel150
  - number: '151.1'
    text: Het bevoegd gezag stelt een directiestatuut vast.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel151
  - number: '151.2'
    text: |-
      Het directiestatuut bevat in ieder geval de aanduiding van de aan het bevoegd gezag bij wettelijk voorschrift
      toegekende taken en bevoegdheden waarvan het bevoegd gezag heeft bepaald dat de directeur van de school deze in
      naam van het bevoegd gezag kan uitoefenen. Het directiestatuut bevat voorts instructies ten aanzien van deze taken
      en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel151
  - number: '151.3'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een exemplaar van het directiestatuut in het gebouw van de school ter
      inzage wordt gelegd op een voor een ieder toegankelijke plaats. Het bevoegd gezag zendt een exemplaar van het
      directiestatuut, alsmede elke wijziging daarvan, zo spoedig mogelijk na de vaststelling ter kennisneming aan de
      inspectie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel151
  - number: '152.1'
    text: |-
      Om tot directeur, adjunct-directeur, leraar of in een andere functie voor het geven van onderwijs, behalve
      godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs, te kunnen worden benoemd, dient de betrokkene te
      voldoen aan artikel 126, eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel152
  - number: '152.2'
    text: |-
      Om te kunnen worden benoemd uitsluitend voor het geven van godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs dient de betrokkene te voldoen aan artikel 126, eerste lid, onder a en c.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel152
  - number: '152.3'
    text: 'Om te kunnen worden benoemd in een andere functie dan het geven van onderwijs, dient de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel152
  - number: 152.3.a
    text: in het bezit te zijn van de verklaring, bedoeld in artikel 126, eerste lid, onder a; en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel152
  - number: 152.3.b
    text: te voldoen aan de overige vereisten voor de te vervullen functie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel152
  - number: '152.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de vereisten , bedoeld in het derde
      lid, onder b.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel152
  - number: '152.5'
    text: |-
      De verklaring, bedoeld in artikel 126, eerste lid, onder a, die in verband met de benoeming aan het bevoegd gezag
      wordt overgelegd, mag op het tijdstip van overlegging niet ouder zijn dan een bij algemene maatregel van bestuur te
      bepalen periode.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel152
  - number: '153.1'
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat het personeel. Van een benoeming in vaste dienst en in tijdelijke
      dienst voor langer dan een half jaar, alsmede van een ontslag uit een zodanige betrekking, doet het bevoegd gezag
      terstond mededeling aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel153
  - number: '153.2'
    text: 'Bij of krachtens algemene maatregel van bestuur worden voor het personeel bedoeld in artikel 152, vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel153
  - number: 153.2.a
    text: |-
      voorschriften omtrent vakantie, verlof, aanspraken op salaris in geval van militaire dienst, ziekte of ongeval,
      ontslaguitkeringen, alsmede omtrent andere rechten en verplichtingen;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel153
  - number: 153.2.b
    text: |-
      salarissen en toelagen, door het bevoegd gezag toe te kennen bij uitoefening van een volledige weektaak of een
      deel daarvan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel153
  - number: '154.1'
    text: |-
      Het bevoegd gezag benoemt de directeur en de adjunct-directeur, de leraren en het onderwijsondersteunend personeel
      in algemene dienst van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel154
  - number: '154.2'
    text: |-
      Onder benoeming in algemene dienst van het bevoegd gezag wordt in dit artikel en in de artikelen 174 en 180
      verstaan een benoeming ten behoeve van het verrichten van werkzaamheden aan door het bevoegd gezag in stand
      gehouden scholen. Indien het betreft een bevoegd gezag dat twee of meer scholen in stand houdt en aan deze scholen
      niet aan eenzelfde categorie van kinderen, genoemd in artikel 125, tweede lid, onderwijs wordt gegeven, geschiedt
      voor zover het een leraar betreft, de in het eerste lid bedoelde benoeming, in afwijking van het bepaalde in de
      eerste volzin, uitsluitend ten behoeve van het uitoefenen van een gelijksoortige functie aan een gelijksoortige
      school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel154
  - number: '155'
    text: |-
      Door het bevoegd gezag worden direct of indirect geen andere uitkeringen aan het personeel gedaan dan bij of
      krachtens de wet zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel155
  - number: '156.1'
    text: |-
      Het bevoegd gezag is verplicht aan studenten die in opleiding zijn voor een functie in het voortgezet speciaal
      onderwijs gelegenheid te bieden de als onderdeel van hun opleiding vereiste ervaring in de school te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel156
  - number: '156.2'
    text: 'De verplichting bedoeld in het eerste lid, betreft:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel156
  - number: 156.2.a
    text: studenten die op een opleidingsinstituut voor onderwijzend personeel zijn ingeschreven;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel156
  - number: 156.2.b
    text: |-
      in een schooljaar gelijktijdig niet meer studenten als bedoeld onder a, dan een derde van het aantal leraren in
      dat jaar.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel156
  - number: '156.3'
    text: |-
      Een bevoegd gezag kan een student de verdere toegang tot de school ontzeggen, indien deze in strijd handelt met
      de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot de school
      wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van het betrokken
      opleidingsinstituut en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel156
  - number: '156.4'
    text: |-
      De directeur regelt in overeenstemming met het opleidingsinstituut en het onderwijzend personeel de werkzaamheden
      in verband met de begeleiding door dit personeel van de studenten in de school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel156
  - number: '156.5'
    text: |-
      Onze minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor 1 schooljaar.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel156
  - number: '156.6'
    text: |-
      De scholen waarop studenten als bedoeld in het eerste lid, zijn toegelaten, zijn toegankelijk voor de inspectie
      belast met het toezicht op de opleidingsinstituten voor onderwijzend personeel en voor de directeuren en de door
      deze aan te wijzen leraren van die opleidingsinstituten, een en ander voor zover zulks voor de uitoefening van het
      toezicht op de praktische vorming noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel156
  - number: '157.1'
    text: |-
      Over aangelegenheden van algemeen belang voor de bijzondere rechtstoestand van het personeel wordt door of namens
      het bevoegd gezag volgens bij algemene maatregel van bestuur te stellen regels overleg gevoerd met de daarvoor in
      aanmerking komende organisaties. Het overleg is gericht op het bereiken van overeenstemming.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel157
  - number: '157.2'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel157
  - number: '157.3'
    text: |-
      Het bevoegd gezag en de personeelsorganisaties, bedoeld in het eerste lid, kunnen gezamenlijk beslissen dat het
      overleg over de in dat lid bedoelde aangelegenheden, voor zover dit betrekking heeft op een of meer door het
      bevoegd gezag in stand gehouden scholen, wordt gevoerd met de personeelsgeleding van de medezeggenschapsraad van de
      desbetreffende school of scholen volgens de regels, bedoeld in de [Wet medezeggenschap onderwijs 1992][ref1] (Stb.
      1992, 663). Het bevoegd gezag en de personeelsorganisaties bepalen daarbij onder welke voorwaarden in dat overleg
      beslissingen over de in de eerste volzin bedoelde aangelegenheden kunnen worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005746
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0005746
  - number: '157.4'
    text: |-
      Indien het overleg, bedoeld in het derde lid, niet leidt tot afronding overeenkomstig de op grond van dat lid
      vastgestelde voorwaarden, wordt alsnog over de desbetreffende aangelegenheden het overleg, bedoeld in het eerste
      lid, gevoerd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel157
  - number: '158.1'
    text: |-
      Elke school is aangesloten bij een geschillencommissie georganiseerd overleg, bestaande uit drie leden en drie
      plaatsvervangende leden. Een lid en een plaatsvervangend lid worden benoemd door de besturen van de aangesloten
      scholen en een lid en een plaatsvervangend lid door de personeelsorganisaties, bedoeld in artikel 157, eerste lid.
      De beide in de tweede volzin bedoelde leden kiezen het derde lid, tevens voorzitter, en diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel158
  - number: '158.2'
    text: |-
      Een geschillencommissie kan tevens werkzaam zijn voor scholen voor speciaal onderwijs, scholen voor voortgezet
      speciaal onderwijs, scholen voor speciaal en voortgezet speciaal onderwijs en instellingen voor speciaal en
      voortgezet speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref1]. Een geschillencommissie strekt
      haar werkzaamheden uit over ten minste 50 scholen. Onze minister kan het in de tweede volzin genoemde aantal lager
      stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '158.3'
    text: |-
      De leden en de plaatsvervangende leden mogen geen deel uitmaken van het betrokken bevoegd gezag dan wel bestuurslid
      zijn van de personeelsorganisaties, bedoeld in artikel 157, eerste lid, of deelnemer zijn aan het overleg, bedoeld
      in dat artikellid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel158
  - number: '158.4'
    text: |-
      Indien het overleg, bedoeld in artikel 157, eerste lid, niet heeft geleid tot overeenstemming, neemt het bevoegd
      gezag geen beslissing behorend tot de in dat artikellid bedoelde aangelegenheden dan nadat gebleken is dat
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel158
  - number: 158.4.a
    text: |-
      er geen geschil inzake de desbetreffende voorgenomen beslissing aanhangig is gemaakt bij de geschillencommissie,
      bedoeld in het eerste lid, dan wel
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel158
  - number: 158.4.b
    text: |-
      indien een geschil inzake de desbetreffende voorgenomen beslissing bij die commissie aanhangig is gemaakt, een
      advies ingevolge het zesde lid tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel158
  - number: '158.5'
    text: |-
      Geschillen inzake voorgenomen beslissingen van het bevoegd gezag, behorend tot de in artikel 157, eerste lid,
      bedoelde aangelegenheden, kunnen worden voorgelegd aan de geschillencommissie georganiseerd overleg door een of
      meer van de personeelsvertegenwoordigers in het overleg. In de algemene maatregel van bestuur, bedoeld in artikel
      157, eerste lid, worden tevens voorschriften gegeven omtrent de procedure inzake de vaststelling dat er sprake
      is van een geschil, voorschriften omtrent de bevoegdheid om een geschil aan de commissie voor te leggen, alsmede
      voorschriften omtrent de werkwijze van de commissie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel158
  - number: '158.6'
    text: |-
      De geschillencommissie georganiseerd overleg beoordeelt of het bevoegd gezag bij afweging van de betrokken belangen
      in redelijkheid de voorgenomen beslissing tot uitvoering kan brengen. De commissie verstrekt het bevoegd gezag
      een bindend advies. De geschillencommissie neemt bij haar advies, voor zover het bijzonder onderwijs betreft, de
      grondslag en het doel van de school in acht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel158
  - number: '158.7'
    text: |-
      Indien het overleg, bedoeld in artikel 157, eerste lid, door de bevoegde gezagsorganen van twee of meer scholen
      gezamenlijk wordt gevoerd, zijn deze scholen aangesloten bij dezelfde geschillencommissie georganiseerd overleg.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel158
  - number: '159.1'
    text: De leeftijd waarop de leerling de school moet hebben verlaten, is 20 jaar.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel159
  - number: '159.2'
    text: |-
      De inspecteur kan voor een leerling ontheffing verlenen van het eerste lid, indien het voortgezet verblijf op de
      school wenselijk is ter voltooiing van zijn opleiding of van een op verhoging van zijn arbeidsgeschiktheid gerichte
      behandeling. Hij kan zich ten behoeve van zijn beslissing een rapport over de leerling, opgesteld door de in
      artikel 161, tweede lid, bedoelde commissie, doen voorleggen. De commissie kan daartoe de betrokken leerling aan
      een onderzoek onderwerpen. De ontheffing wordt telkens voor de tijd van ten hoogste 1 jaar verleend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel159
  - number: '160.1'
    text: |-
      De beslissing over toelating en verwijdering van leerlingen berust bij het bevoegd gezag, met inachtneming van het
      tweede en derde lid en de artikelen 161 en 162. De toelating mag niet afhankelijk worden gesteld van een geldelijke
      bijdrage van de ouders. Overeenkomsten waarbij ouders worden verplicht tot het betalen van een geldelijke bijdrage
      zijn nietig, behoudens voorzover zij na de toelating van de leerling tot de school schriftelijk zijn aangegaan
      en in het desbetreffende schriftelijke stuk aan de ouders kenbaar is gemaakt dat het een vrijwillige bijdrage
      betreft waarvoor de overeenkomst niet behoeft te worden aangegaan, doch waarvoor geldt dat na de ondertekening
      wel een verplichting tot betaling van de overeengekomen bijdrage bestaat. Zodanige overeenkomsten zijn evenzeer
      nietig, indien deze niet hebben voorzien in de vermelding dat de ouders de mogelijkheid hebben er voor te kiezen
      om de overeenkomst slechts voor bepaalde voorzieningen aan te gaan en ten behoeve daarvan niet een specificatie
      voor de te onderscheiden voorzieningen in de overeenkomst is opgenomen. Zodanige overeenkomsten zijn voorts nietig
      indien ten aanzien daarvan geen reductie- en kwijtscheldingsregeling geldt en de inhoud van die regeling niet
      in de overeenkomst is opgenomen. Een overeenkomst wordt telkens voor de periode van een schooljaar aangegaan.
      Voordat wordt besloten tot verwijdering hoort het bevoegd gezag de betrokken leraar of leraren. Definitieve
      verwijdering van een leerling waarop de [Leerplichtwet 1969][ref1] van toepassing is, vindt niet plaats dan
      nadat het bevoegd gezag ervoor heeft zorggedragen dat een andere school, een school voor voortgezet speciaal
      onderwijs dan wel een school of een instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in
      de [Wet op de expertisecentra][ref2], een school voor voortgezet onderwijs dan wel een instelling als bedoeld
      in [artikel 1, onder c, van de Leerplichtwet 1969][ref3] bereid is de leerling toe te laten. Indien aantoonbaar
      gedurende 8 weken zonder succes is gezocht naar een zodanige school of instelling waarnaar kan worden verwezen, kan
      in afwijking van de vorige volzin tot definitieve verwijdering worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0002628
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '1'
  - number: '160.2'
    text: |-
      Tot de school wordt uitsluitend als leerling toegelaten degene waarvan de ouders aantonen, dan wel, indien hij
      meerderjarig en handelingsbekwaam is, degene die aantoont dat hij:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel160
  - number: 160.2.a
    text: de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel160
  - number: 160.2.b
    text: |-
      vreemdeling is en jonger is dan 18 jaar op de eerste schooldag waarop voortgezet speciaal onderwijs begint,
      waarvoor voor de eerste maal toelating wordt gewenst,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel160
  - number: 160.2.c
    text: |-
      vreemdeling is, 18 jaar of ouder is op de eerste schooldag waarop het voortgezet speciaal onderwijs begint,
      waarvoor voor de eerste maal toelating wordt gewenst en op die dag rechtmatig verblijf houdt in de zin van
      [artikel 8 van de Vreemdelingenwet 2000][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 160.2.d
    text: |-
      vreemdeling is, niet meer voldoet aan een van de voorwaarden, genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen voor voortgezet speciaal onderwijs is toegelaten tot een school, welk onderwijs nog
      steeds wordt gevolgd en nog niet is voltooid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel160
  - number: '160.3'
    text: |-
      Indien na de toelating tot de school blijkt dat deze op welke grond dan ook niet in overeenstemming met het tweede
      lid heeft plaatsgevonden, wordt de leerling onmiddellijk verwijderd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel160
  - number: '160.4'
    text: |-
      Indien tegen een besluit van het bevoegd gezag van een openbare school ingevolge het
      eerste, tweede of derde lid, bezwaar is gemaakt, besluit het bevoegd gezag in afwijking van
      [artikel 7:10 van de Algemene wet bestuursrecht][ref1] binnen 4 weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '160.5'
    text: |-
      Het bevoegd gezag van een openbare school besluit niet op het bezwaarschrift, tenzij het bezwaarschrift is gericht
      tegen een besluit ingevolge het tweede of derde lid, dan na overleg met de inspecteur en desgewenst met andere
      deskundigen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel160
  - number: '161.1'
    text: |-
      Tot een school mogen slechts die kinderen worden toegelaten voor wie vaststaat dat overwegend een orthopedagogische
      en orthodidactische benadering aangewezen is en die, behoudens het bepaalde in artikel 132, tweede lid, voor het op
      die school gegeven onderwijs in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel161
  - number: '161.2'
    text: |-
      Het bevoegd gezag van een school of de bevoegde gezagsorganen van twee of meer scholen, al dan niet van
      dezelfde onderwijssoort, stelt onderscheidenlijk stellen een commissie in die tot taak heeft: a. te beoordelen
      of het kind voor het onderwijs op de school waarvoor toelating werd verzocht, in aanmerking komt, b. het
      doen van aanbevelingen omtrent het begeleiden van de individuele leerling tijdens zijn verblijf op de
      school, teneinde een optimale ontwikkeling van de in de leerling aanwezige mogelijkheden te bewerkstelligen,
      en c. als onderdeel van de onder b genoemde taak, aan het eind van elk schooljaar te adviseren omtrent
      terugplaatsing of overplaatsing van de leerling naar het voortgezet speciaal onderwijs als bedoeld in
      [artikel 2, tweede lid, van de Wet op de expertisecentra][ref1], een andere vorm van voortgezet speciaal onderwijs,
      of het voortgezet onderwijs. De commissie kan bij het uitoefenen van haar taak gebruik maken van bestaande
      onderzoeksgegevens, indien dergelijke gegevens aan haar worden verstrekt. De commissie wordt geleid door de
      directeur van de school waarvoor toelating werd verzocht. De commissie bestaat naast de directeur van de school
      ten minste uit: 1°. een academisch gevormd psycholoog of pedagoog die zich heeft gespecialiseerd in de jeugd-
      en kinderpsychologische richting, onderscheidenlijk in de orthopedagogische richting, 2°. een maatschappelijk
      deskundige die in het bezit is van het diploma maatschappelijk werker van een sociale academie of van een door
      Onze minister aangewezen diploma en 3°. een arts die vertrouwd is met het onderzoek van kinderen voor wie het op de
      school gegeven onderwijs is bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: '161.3'
    text: |-
      In verband met de beoordeling van kinderen met een niet-Nederlandse culturele achtergrond kan de commissie een
      deskundige op het gebied van de taal en cultuur van het land van oorsprong inschakelen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel161
  - number: '161.4'
    text: |-
      Geen kind wordt tot het voortgezet speciaal onderwijs toegelaten dan na onderzoek door een commissie als bedoeld in
      het tweede lid. De inspecteur is bevoegd het onderzoek bij te wonen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel161
  - number: '161.5'
    text: |-
      De onderscheiden functionarissen van de commissie brengen hun bevindingen naar aanleiding van hun onderzoek van het
      kind door middel van een onderzoeksrapport ter kennis van de commissie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel161
  - number: '161.6'
    text: |-
      Van het in het vierde lid bedoelde onderzoek maakt de commissie een gemeenschappelijk rapport waarin naast het
      eindoordeel, de onderzoeksrapporten bedoeld in het vijfde lid, en de eventuele overige aan de commissie verstrekte
      documenten worden opgenomen, alsmede de bevindingen van de onderscheiden functionarissen naar aanleiding van het
      overleg in de commissie tot uitdrukking worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel161
  - number: '161.7'
    text: |-
      De directeur bespreekt de conclusies van het rapport met de ouders, dan wel, indien de leerling meerderjarig en
      handelingsbekwaam is, de leerling. De ouders van een minderjarige of handelingsonbekwame leerling, de leerling die
      de leeftijd van 16 jaar heeft bereikt en de inspecteur krijgen desgewenst inzage in het rapport.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel161
  - number: '161.8'
    text: |-
      Het bevoegd gezag ziet erop toe dat het gemeenschappelijk rapport slechts wordt gebruikt ten behoeve van het
      verblijf van de betrokken leerling op de school. Van het bepaalde in de vorige volzin kan voor wat betreft het
      rapport worden afgeweken voor zover door de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam
      is, de leerling schriftelijk toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel161
  - number: '161.9'
    text: |-
      Het gemeenschappelijk rapport wordt in de school bewaard tot ten minste 3 jaar na het tijdstip waarop de leerling
      de school heeft verlaten. Het bevoegd gezag draagt er zorg voor dat het gemeenschappelijk rapport wordt bewaard op
      een plaats die uitsluitend toegankelijk is voor het bevoegd gezag en de met het onderzoek belaste functionarissen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel161
  - number: '162.1'
    text: |-
      Indien de inspecteur van oordeel is dat op een school een leerling is geplaatst die daar ingevolge artikel 161,
      eerste lid, niet had mogen worden toegelaten, verzoekt hij het bevoegd gezag deze leerling te verwijderen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel162
  - number: '162.2'
    text: |-
      Bij weigering van het bevoegd gezag te voldoen aan een verzoek als bedoeld in het eerste lid, roept de inspecteur
      de beslissing van Onze minister in.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel162
  - number: '162.3'
    text: |-
      Indien de inspecteur van oordeel is dat het in artikel 161, vijfde lid, bedoelde onderzoek niet voldoet aan
      redelijke eisen, treedt hij in overleg met het bevoegd gezag onder mededeling van de zijns inziens aan te brengen
      wijzigingen. Indien dit overleg niet tot overeenstemming leidt, roept de inspecteur de beslissing van Onze minister
      in.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel162
  - number: '163'
    text: |-
      Over iedere leerling die de school verlaat, stelt de directeur, na overleg met het onderwijzend personeel en de
      commissie bedoeld in artikel 161, tweede lid, ten behoeve van de ontvangende school een onderwijskundig rapport
      op. De commissie kan daartoe de leerling aan een onderzoek onderwerpen. Afschrift van dit rapport wordt verstrekt
      aan de ouders van een minderjarige of handelingsonbekwame leerling en aan de leerling die meerderjarig en
      handelingsbekwaam is. Desgewenst wordt tevens een afschrift verstrekt aan de leerling die de leeftijd van 16 jaar
      en nog niet die van 18 jaar heeft bereikt. Bij algemene maatregel van bestuur kunnen nadere voorschriften omtrent
      dit rapport worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel163
  - number: '164.1'
    text: De leerlingen nemen deel aan alle voor hen bestemde onderwijsactiviteiten, onverminderd artikel 273, eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel164
  - number: '164.2'
    text: |-
      Het bevoegd gezag kan op verzoek van de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam
      is, de leerling, een leerling ontheffing verlenen van bepaalde onderwijsactiviteiten. Een ontheffing kan slechts
      worden verleend, op door het bevoegd gezag vastgestelde gronden. Het bevoegd gezag bepaalt bij de ontheffing welke
      onderwijsactiviteiten voor de leerling in de plaats komen van die waarvan ontheffing is verleend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel164
  - number: '165'
    text: |-
      Op verzoek van de ouders, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, op verzoek van de
      leerling, kan aan leerlingen die voortgezet speciaal onderwijs volgen gelegenheid worden gegeven eindexamen af te
      leggen aan een school voor regulier onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel165
  - number: '166'
    text: |-
      Het bevoegd gezag stelt de ouders van de leerlingen in de gelegenheid ondersteunende werkzaamheden ten behoeve
      van de school en het onderwijs te verrichten. De ouders zijn daarbij gehouden de aanwijzingen op te volgen van de
      directeur en het overige onderwijzend personeel, die verantwoordelijk blijven voor de gang van zaken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel166
  - number: '167.1'
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de leerlingen met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving en met onderkenning
      van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel167
  - number: '167.2'
    text: Openbare scholen zijn toegankelijk voor alle kinderen zonder onderscheid van godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel167
  - number: '167.3'
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel167
  - number: '168.1'
    text: |-
      Een gemeenteraad kan bij verordening een openbare rechtspersoon instellen die tot doel heeft een of meer
      openbare scholen in de gemeente in stand te houden, al dan niet te zamen met openbare scholen als bedoeld
      in deel I van deze wet of openbare scholen als bedoeld in de [Wet op het primair onderwijs][ref1] of de
      [Wet op de expertisecentra][ref2]. Een openbare rechtspersoon kan ook worden ingesteld door meer dan een gemeente
      ten behoeve van het in stand houden van openbare scholen in die gemeenten door het vaststellen van een voor
      wat betreft de onderwerpen, bedoeld in het vierde lid, gelijkluidende verordening, in welk geval de openbare
      rechtspersoon niet eerder tot stand komt dan nadat alle daartoe strekkende verordeningen in werking zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel168
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: '168.2'
    text: De gemeenteraad of gemeenteraden maken het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel168
  - number: '168.3'
    text: |-
      De openbare rechtspersoon oefent met uitzondering van de besluitvorming over de opheffing van een openbare school
      alle taken en bevoegdheden uit van het bevoegd gezag. Hij bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel168
  - number: '168.4'
    text: 'De verordening, bedoeld in het eerste lid, voorziet in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel168
  - number: 168.4.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel168
  - number: 168.4.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte, doch
      geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel168
  - number: 168.4.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel168
  - number: 168.4.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel168
  - number: 168.4.e
    text: de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel168
  - number: 168.4.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel168
  - number: 168.4.g
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt, met dien verstande dat in de regeling een overheersende invloed van de overheid in het
      bestuur is verzekerd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel168
  - number: '168.5'
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel168
  - number: '168.6'
    text: |-
      De vergaderingen van het bestuur van de openbare rechtspersoon zijn openbaar, tenzij het bestuur anders beslist, op
      gronden, vermeld in de verordening.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel168
  - number: '168.7'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel168
  - number: '168.8'
    text: |-
      De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren
      in strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de openbare rechtspersoon
      te ontbinden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel168
  - number: '169.1'
    text: |-
      Een gemeenteraad kan besluiten dat een of meer openbare scholen in de gemeente in stand worden gehouden
      door een stichting die zich ten doel stelt het in stand houden van een of meer openbare scholen, al dan
      niet te zamen met openbare scholen als bedoeld in deel I van deze wet of openbare scholen als bedoeld in de
      [Wet op het primair onderwijs][ref1] of de [Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: '169.2'
    text: De gemeenteraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: '169.3'
    text: |-
      Een stichting die een openbare school in stand houdt, wordt opgericht door een of meer gemeenten, al dan niet te
      zamen met een of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: '169.4'
    text: Het statutaire doel van de stichting is uitsluitend het geven van openbaar onderwijs overeenkomstig artikel 167.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: '169.5'
    text: |-
      De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken en
      bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: '169.6'
    text: 'Onverminderd het vierde lid voorzien de statuten in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: 169.6.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: 169.6.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte, doch
      geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: 169.6.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: 169.6.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: 169.6.e
    text: de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: 169.6.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: 169.6.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: 169.6.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: '169.7'
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de desbetreffende gemeenteraad of
      gemeenteraden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: '169.8'
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: '169.9'
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: '169.10'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: '169.11'
    text: |-
      De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren in
      strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de stichting te ontbinden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
  - number: '169.12'
    text: |-
      [Artikel 155 van de Gemeentewet][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel155
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '155'
  - number: '170.1'
    text: |-
      De rechtspersoon die een openbare school in stand houdt, kan de instandhouding van die school overdragen aan
      een andere rechtspersoon die tot instandhouding van een openbare school bevoegd is. De overdracht geschiedt bij
      notariële akte.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel170
  - number: '170.2'
    text: |-
      Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering als bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: '170.3'
    text: |-
      In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en
      onder dezelfde voorwaarden als vermeld in de akte van aanstelling, aan de school aanstelt met ingang van de datum
      van overdracht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel170
  - number: '170.4'
    text: |-
      Door overdracht met inachtneming van de voorgaande leden, treedt de verkrijgende rechtspersoon in alle uit de wet
      voortvloeiende rechten en verplichtingen die zijn rechtsvoorganger bezit in zijn hoedanigheid van bevoegd gezag,
      onverminderd hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel170
  - number: '171'
    text: |-
      Het bevoegd gezag stelt de leerlingen in de gelegenheid op de school, binnen de schooltijden, godsdienstonderwijs
      of levensbeschouwelijk vormingsonderwijs te ontvangen. Van de tijd daaraan te besteden, worden ten hoogste 120 uren
      per schooljaar meegeteld voor het aantal uren onderwijs dat de leerlingen krachtens artikel 133, vierde lid, ten
      minste moeten ontvangen. Voor de leerlingen die dit onderwijs niet volgen, voorziet het bevoegd gezag in andere
      onderwijsactiviteiten op de school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel171
  - number: '172'
    text: |-
      Godsdienstonderwijs wordt gegeven door leraren daartoe aangewezen door kerkelijke gemeenten, plaatselijke kerken,
      of rechtspersonen met volledige rechtsbevoegdheid die zich blijkens hun statuten het geven van godsdienstonderwijs
      ten doel stellen. Levensbeschouwelijk vormingsonderwijs wordt gegeven door leraren daartoe aangewezen door
      volledige rechtsbevoegdheid bezittende organisaties op geestelijke grondslag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel172
  - number: '173.1'
    text: |-
      Bij algemene maatregel van bestuur worden voor het personeel bedoeld in artikel 152, voorschriften vastgesteld
      omtrent aanstelling, schorsing, ontslag en disciplinaire maatregelen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel173
  - number: '173.2'
    text: |-
      In afwijking van het bepaalde bij of krachtens het eerste lid zijn gedeputeerde staten van de desbetreffende
      provincie bevoegd de disciplinaire maatregelen of de schorsing op te leggen dan wel het ontslag te verlenen, indien
      het betreft een directeur, een adjunct-directeur of een leraar van een openbare school en deze tevens lid is van de
      raad van de gemeente die de school in stand houdt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel173
  - number: '174.1'
    text: |-
      Ieder personeelslid is in het bezit van een door het bevoegd gezag getekende akte van aanstelling. De akte van
      aanstelling bevat in elk geval:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel174
  - number: 174.1.a
    text: de naam en het adres van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel174
  - number: 174.1.b
    text: de naam, de voornamen en de geboortedatum van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel174
  - number: 174.1.c
    text: de datum van ingang van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel174
  - number: 174.1.d
    text: de functie waarin de betrokkene wordt aangesteld;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel174
  - number: 174.1.e
    text: de omvang van de betrekking;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel174
  - number: 174.1.f
    text: |-
      de bepaling of de aanstelling in vaste of in tijdelijke dienst geschiedt en in het laatste geval de gronden voor de
      tijdelijkheid en de duur van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel174
  - number: 174.1.g
    text: de op de dag van zijn aanstelling van toepassing zijnde schaal en het salarisnummer;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel174
  - number: 174.1.h
    text: de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel174
  - number: 174.1.i
    text: |-
      voor de personeelsleden die bij de uitoefening van hun functie kennis nemen van persoonlijke gegevens van
      leerlingen, voorschriften omtrent geheimhouding daarvan, voor zover een geheimhoudingsplicht niet reeds uit anderen
      hoofde is verzekerd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel174
  - number: '174.2'
    text: |-
      Het bevoegd gezag draagt zorg dat afschriften van de akten van bekwaamheid, van de verklaringen omtrent het gedrag,
      alsmede van de akten van aanstelling van het aan de school verbonden personeel worden bewaard.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel174
  - number: '174.3'
    text: De aanstelling van de adjunct-directeur en de leraren geschiedt, de directeur gehoord.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel174
  - number: '175'
    text: |-
      Een bijzondere school wordt in stand gehouden door een rechtspersoon met volledige rechtsbevoegdheid die zich
      blijkens de statuten of reglementen het geven van onderwijs ten doel stelt zonder daarbij het maken van winst te
      beogen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel175
  - number: '176.1'
    text: |-
      De rechtspersoon die de school in stand houdt, kan de instandhouding van de school overdragen aan een andere
      rechtspersoon die voldoet aan artikel 175. De overdracht geschiedt bij notariële akte.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel176
  - number: '176.2'
    text: |-
      Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen, alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: '176.3'
    text: |-
      In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en
      onder dezelfde voorwaarden als vermeld in de akte van benoeming, benoemt met ingang van de datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel176
  - number: '176.4'
    text: |-
      Door de overdracht met inachtneming van de voorgaande leden, treedt de verkrijgende rechtspersoon in alle uit de
      wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de school, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel176
  - number: '176.5'
    text: |-
      Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1] van een rechtspersoon
      die een school in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende rechtspersoon de
      school in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de school overgaat. In het
      laatste geval zijn het tweede tot en met vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
  - number: '177'
    text: |-
      Onverminderd de artikelen 135 tot en met 136 kunnen de onderwijsactiviteiten godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs omvatten. Van de tijd daaraan te besteden, worden ten hoogste 120 uren per
      schooljaar meegeteld voor het aantal uren onderwijs dat de leerlingen krachtens artikel 133, vierde lid, ten minste
      moeten ontvangen. Het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs kan worden opgedragen
      aan een niet aan de school verbonden leraar.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel177
  - number: '178.1'
    text: |-
      Indien binnen redelijke afstand van de woning van de leerling geen gelegenheid bestaat tot het volgen van
      openbaar onderwijs, mag de toelating tot de school niet worden geweigerd op grond van godsdienstige gezindheid
      of levensbeschouwing. Het voorgaande is niet van toepassing, indien de school uitsluitend bestemd is voor interne
      leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel178
  - number: '178.2'
    text: |-
      Leerlingen die ingevolge het eerste lid zijn toegelaten, kunnen niet worden verplicht godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs te volgen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel178
  - number: '179.1'
    text: |-
      Indien het bevoegd gezag van een bijzondere school op grond van artikel 156, derde lid, een student de toegang
      weigert, deelt het bevoegd gezag deze beslissing, schriftelijk en met redenen omkleed, mede door toezending of
      uitreiking aan de student, onverminderd het bepaalde in dat artikellid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel179
  - number: '179.2'
    text: |-
      Indien het bevoegd gezag van een bijzondere school hetzij weigert een leerling toe te laten, hetzij een leerling
      verwijdert, op grond van artikel 160, eerste lid, deelt het deze beslissing, schriftelijk en met redenen omkleed,
      mede door toezending of uitreiking aan de ouders. Daarbij wordt tevens de inhoud van het bepaalde in het derde
      lid, eerste volzin, vermeld. Voordat het bevoegd gezag van een bijzondere school op grond van artikel 160, eerste
      lid, beslist tot verwijdering van een leerling, hoort het de ouders van de leerling, onverminderd het bepaalde in
      dat artikellid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel179
  - number: '179.3'
    text: |-
      Binnen 6 weken na de mededeling, bedoeld in het tweede lid, kunnen de ouders bij het bevoegd gezag schriftelijk hun
      bezwaren kenbaar maken tegen de beslissing. Het bevoegd gezag beslist binnen 4 weken na ontvangst van de bezwaren.
      Alvorens te beslissen hoort het bevoegd gezag de ouders.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel179
  - number: '179.4'
    text: 'Het bevoegd gezag beslist niet eerder op de bezwaren dan:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel179
  - number: 179.4.a
    text: na overleg met de inspecteur en desgewenst met andere deskundigen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel179
  - number: 179.4.b
    text: nadat de ouders kennis hebben kunnen nemen van de op de beslissing betrekking hebbende adviezen of rapporten, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel179
  - number: 179.4.c
    text: de ouders opnieuw zijn gehoord.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel179
  - number: '180.1'
    text: |-
      De akte van benoeming bevat ten minste bepalingen van gelijke inhoud als zijn vastgesteld bij de algemene maatregel
      van bestuur bedoeld in artikel 153, tweede lid onder a en b, voor zover deze geen rechtstreekse aanspraak op het
      Rijk geven.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel180
  - number: '180.2'
    text: |-
      Ieder personeelslid is in het bezit van een door het bevoegd gezag en hemzelf getekende akte van benoeming. De akte
      van benoeming bevat in elk geval:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel180
  - number: 180.2.a
    text: de naam en het adres van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel180
  - number: 180.2.b
    text: de naam, de voornamen en de geboortedatum van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel180
  - number: 180.2.c
    text: de datum van ingang van de benoeming;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel180
  - number: 180.2.d
    text: de functie waarin de betrokkene wordt benoemd;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel180
  - number: 180.2.e
    text: de omvang van de betrekking;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel180
  - number: 180.2.f
    text: |-
      de bepaling of de benoeming in vaste of in tijdelijke dienst geschiedt en in het laatste geval de gronden voor de
      tijdelijkheid en de duur van de benoeming;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel180
  - number: 180.2.g
    text: de op de dag van zijn benoeming van toepassing zijnde schaal en het salarisnummer;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel180
  - number: 180.2.h
    text: de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel180
  - number: 180.2.i
    text: |-
      voor personeelsleden die bij de uitoefening van hun functie kennis nemen van persoonlijke gegevens van leerlingen,
      voorschriften omtrent geheimhouding daarvan, voor zover een geheimhoudingsplicht niet uit anderen hoofde is
      verzekerd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel180
  - number: '180.3'
    text: De akte van benoeming bevat bepalingen inzake gronden voor schorsing, ontslag en disciplinaire maatregelen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel180
  - number: '180.4'
    text: |-
      Het bevoegd gezag draagt zorg dat afschriften van de akten van bekwaamheid, van de verklaringen omtrent het gedrag,
      alsmede van de akten van benoeming van het aan de school verbonden personeel worden bewaard.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel180
  - number: '181.1'
    text: |-
      Het bevoegd gezag is aangesloten bij een commissie van beroep. Het personeel kan bij die commissie beroep instellen
      tegen een beslissing van het bevoegd gezag inhoudende:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel181
  - number: 181.1.a
    text: een disciplinaire maatregel;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel181
  - number: 181.1.b
    text: schorsing;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel181
  - number: 181.1.c
    text: het direct of indirect onthouden van promotie;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel181
  - number: 181.1.d
    text: het verminderen van de omvang van de betrekking;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel181
  - number: 181.1.e
    text: ontslag anders dan op eigen verzoek, voordat de pensioengerechtigde leeftijd is bereikt;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel181
  - number: 181.1.f
    text: |-
      de beslissing van het bevoegd gezag ten aanzien van een personeelslid op basis waarvan op termijn vermindering van
      diens betrekkingsomvang kan plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel181
  - number: 181.1.g
    text: de beëindiging van een verlengd tijdelijk dienstverband;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel181
  - number: 181.1.h
    text: |-
      de aanwijzing als personeelslid boven de reguliere formatie voortvloeiend uit een algemeen verbindend voorschrift
      welke aanwijzing op termijn kan leiden tot ontslag, vermindering van de betrekkingsomvang of beëindiging van een
      verlengd tijdelijk dienstverband;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel181
  - number: 181.1.i
    text: de aanwijzing van een andere school of andere scholen waaraan een personeelslid werkzaamheden zal verrichten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel181
  - number: '181.2'
    text: |-
      Een beslissing als bedoeld in het vorige lid, aanhef, wordt schriftelijk aan de betrokkene medegedeeld. Daarbij
      wordt tevens vermeld de beroepstermijn en het adres van de commissie waar het beroep kan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel181
  - number: '181.3'
    text: Het bevoegd gezag onderwerpt zich aan de uitspraak van de commissie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel181
  - number: '182.1'
    text: |-
      Het beroep bedoeld in artikel 181, wordt schriftelijk ingesteld binnen 6 weken, nadat de beslissing aan betrokkene
      is medegedeeld. Bij overschrijding van deze termijn ten gevolge van omstandigheden die de betrokkene niet kunnen
      worden verweten, laat de commissie niet-ontvankelijkverklaring op die grond achterwege.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel182
  - number: '182.2'
    text: |-
      Tijdens de behandeling door de commissie van beroep loopt geen verjaring met betrekking tot rechtsvorderingen ter
      zake van beslissingen die aan het oordeel van de commissie zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel182
  - number: '183.1'
    text: |-
      Een commissie van beroep strekt haar werkzaamheden uit over ten minste 50 bijzondere scholen. Onze minister kan dit
      aantal lager stellen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel183
  - number: '183.2'
    text: |-
      Tot scholen bedoeld in het eerste lid, kunnen ook scholen voor basisonderwijs en scholen voor voortgezet onderwijs
      behoren.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel183
  - number: '183.3'
    text: |-
      De commissie bestaat uit 5 leden en 5 plaatsvervangende leden, waarvan 2 leden en 2 plaatvervangende leden worden
      gekozen door het bevoegd gezag en 2 leden en 2 plaatsvervangende leden door het personeel van de aangesloten
      scholen. Deze 4 leden kiezen het vijfde lid, tevens voorzitter, en diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel183
  - number: '183.4'
    text: |-
      De leden en plaatsvervangende leden mogen niet behoren tot het bevoegd gezag of het personeel van een aangesloten
      school of tot de inspectie van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel183
  - number: '183.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de samenstelling en de werkwijze van
      de commissie van beroep.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel183
  - number: '184'
    text: |-
      Over aangelegenheden van algemeen belang voor de rechtstoestand van het personeel bedoeld in artikel 152, wordt
      volgens bij algemene maatregel van bestuur te stellen regels overleg gevoerd met de daarvoor in aanmerking
      komende personeelsorganisaties en, indien en voor zover zij daarbij belang hebben, organisaties van gemeente- en
      schoolbesturen. De algemene maatregel van bestuur bepaalt tevens de gevallen waarin in dat overleg overeenstemming
      met de personeelsorganisaties dient te worden bereikt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel184
  - number: '185.1'
    text: |-
      De gemeenteraad is bevoegd uitsluitend in het belang van een doelmatige spreiding van de leerlingen over de
      openbare scholen, het grondgebied van de gemeente in schoolwijken te verdelen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel185
  - number: '185.2'
    text: |-
      Een besluit als bedoeld in het eerste lid, geldt voor ten minste 3 schooljaren, met dien verstande dat tussentijdse
      wijziging mogelijk is in geval van veranderingen in het scholenbestand. Burgemeester en wethouders zenden binnen 4
      weken nadat het besluit is genomen afschrift daarvan aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel185
  - number: '185.3'
    text: |-
      De toelating tot een openbare school geschiedt in overeenstemming met de vastgestelde schoolwijken, tenzij door
      de ouders van de leerling, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, door de leerling,
      schriftelijk aan het bevoegd gezag te kennen wordt gegeven dat toelating in een andere schoolwijk wordt gewenst.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel185
  - number: '186.1'
    text: |-
      Vertegenwoordigers van het voortgezet speciaal onderwijs en het voortgezet onderwijs kunnen ten behoeve van de
      scholen die zij vertegenwoordigen een overlegorgaan oprichten met het doel de samenwerking tussen die scholen te
      bevorderen ten aanzien van de toelating van leerlingen en de inrichting van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel186
  - number: '186.2'
    text: |-
      Aan de vertegenwoordiging van de aan het overleg deelnemende scholen zal in ieder geval een vertegenwoordiging van
      de ouders en van de leraren deelnemen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel186
  - number: '187.1'
    text: Op het personeel van een rechtspersoon met volledige rechtsbevoegdheid die
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel187
  - number: 187.1.a
    text: |-
      uitsluitend wordt bestuurd door een bevoegd gezag al dan niet met een of meer andere bevoegde gezagsorganen als
      bedoeld in deze wet, de [Wet op het primair onderwijs][ref1] of de [Wet op de expertisecentra][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: 187.1.b
    text: |-
      zich blijkens de statuten dan wel de gemeenschappelijke regeling, bedoeld in de
      [Wet gemeenschappelijke regelingen][ref1], uitsluitend ten doel stelt om ten behoeve van scholen en andere
      onderwijsinstellingen die uit 's Rijks kas worden bekostigd, werkzaamheden te verrichten ter verzekering van
      de goede gang van het onderwijs met uitzondering van het leiden van de school, het geven van onderwijs en het
      verrichten van werkzaamheden op het terrein van de schoolbegeleiding als bedoeld in artikel 280,


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 187.1.c
    text: niet het maken van winst beoogt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel187
  - number: 187.1.d
    text: |-
      wordt gefinancierd met behulp van bijdragen van de bevoegde gezagsorganen waarvoor diensten worden verricht,
      waaronder begrepen formatierekeneenheden die zijn toegekend op basis van [artikel 122, eerste lid onder c][ref1],
      of [artikel 132 van de Wet op het primair onderwijs][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel132
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '122'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '132'
  - number: 187.1.e
    text: Onze minister heeft medegedeeld als rechtspersoon in de zin van dit artikel werkzaam te willen zijn,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel187
  - number: '187.2'
    text: Onder bevoegd gezag en bevoegde gezagsorganen in het eerste lid onderdeel a wordt mede verstaan de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel187
  - number: '187.3'
    text: |-
      Het bestuur van de rechtspersoon is aangesloten bij een commissie van beroep als bedoeld in artikel 181. De leden
      en plaatsvervangende leden van een commissie van beroep mogen niet behoren tot het bestuur of het personeel van
      de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel187
  - number: '187.4'
    text: |-
      De in het eerste lid onder a bedoelde bevoegde gezagsorganen delen Onze minister mede dat zij het bestuur vormen
      van een rechtspersoon in de zin van dit artikel. Voorts verschaffen zij Onze minister en de door hem aangewezen
      personen desgevraagd alle inlichtingen omtrent de rechtspersoon en zijn activiteiten. De in het eerste lid
      onder a bedoelde bevoegde gezagsorganen kunnen Onze minister mededelen dat zij erin toestemmen dat de gevraagde
      inlichtingen rechtstreeks door het bestuur van de rechtspersoon zelf aan Onze minister en de door hem aangewezen
      personen worden verschaft.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel187
  - number: '187.5'
    text: |-
      De gemeente en het bevoegd gezag dat deel uitmaakt van het bestuur van de rechtspersoon, zijn verplicht op de
      naleving van de in de voorgaande leden genoemde voorschriften toe te zien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel187
  - number: '187.6'
    text: |-
      De artikelen 157, 158, 181 en 182 zijn van overeenkomstige toepassing ten aanzien van het personeel van de
      rechtspersoon met dien verstande dat een geschillencommissie haar werkzaamheden uitstrekt over ten minste vijf
      rechtspersonen als bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel187
  - number: '188.1'
    text: |-
      De openbare en de bijzondere scholen worden door het Rijk bekostigd volgens de bepalingen van deze titel met
      uitzondering van afdeling 3. De bedragen die de gemeente krachtens deze wet in aanvulling op de rijksbekostiging
      verstrekt, blijven ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel188
  - number: '188.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven ter uitvoering van het eerste lid. Deze
      algemene maatregel van bestuur bevat in elk geval een regeling omtrent:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel188
  - number: 188.2.a
    text: de termijnen binnen welke besluiten moeten worden genomen;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel188
  - number: 188.2.b
    text: de verstrekking van voorschotten op de bekostiging;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel188
  - number: 188.2.c
    text: de verrekening van het bedrag van de bekostiging met de voorschotten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel188
  - number: '188.3'
    text: 'De algemene maatregel van bestuur bedoeld in het tweede lid, bevat tevens:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel188
  - number: 188.3.a
    text: |-
      een regeling omtrent de betaling van de bedragen van de bekostiging voor de materiële voorzieningen ten behoeve van
      de instandhouding voortvloeiende uit het gebruik door een school van voorzieningen die voor meer dan een school of
      voor andere doeleinden zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel188
  - number: 188.3.b
    text: |-
      een financiële regeling tussen het Rijk en de bevoegde gezagsorganen die personeel in dienst hebben dat niet door
      het Rijk wordt bekostigd ter zake van een korting op de bekostiging ter compensatie van de kosten van de voor dat
      personeel geldende rechtspositionele voorzieningen, voor zover deze ten laste van 's Rijks kas komen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel188
  - number: '188.4'
    text: |-
      De algemene maatregel van bestuur bedoeld in het tweede lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure
      bedoeld in de eerste 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel188
  - number: '188.5'
    text: |-
      [Artikel 4:32 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de bekostiging van scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '189'
    text: |-
      Onze minister kan onder nader te stellen voorwaarden aanvullende middelen ter beschikking stellen die niet strekken
      tot bekostiging van het onderwijs, bedoeld in dit deel, en de schoolbegeleiding ten behoeve daarvan, maar die
      direct of indirect dienstig zijn voor de uitvoering van het onderwijs of voor verhoging van de mogelijkheid tot
      deelname aan het onderwijs. Voor zover toepassing van de eerste volzin het verstrekken van subsidie betreft, zijn
      de [artikelen 4 tot en met 19 van de Wet overige OCenW-subsidies][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '190'
    text: 'Een belanghebbende kan beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State tegen:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel190
  - number: 190.a
    text: een besluit of een van rechtswege verleende goedkeuring als bedoeld in de afdelingen 2 en 8 van deze titel,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel190
  - number: 190.b
    text: een besluit als bedoeld in artikel 233, vierde lid, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel190
  - number: 190.c
    text: een besluit als bedoeld in artikel 244.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel190
  - number: '191.1'
    text: |-
      Voor de toepassing van deze titel zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      artikel 169 of een openbare rechtspersoon als bedoeld in artikel 168, tenzij het tegendeel blijkt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel191
  - number: '191.2'
    text: |-
      Indien een openbare school in stand wordt gehouden door een stichting of een openbare rechtspersoon, wordt deze
      aangemerkt als een door de gemeente in stand gehouden openbare school voor de toepassing van afdeling 2 en afdeling
      8.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel191
  - number: '192'
    text: |-
      In deze titel wordt onder «school» verstaan een school of afdeling als bedoeld in artikel 131, tenzij het tegendeel
      blijkt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel192
  - number: '193.1'
    text: De artikelen 195 tot en met 205 zijn tot een bij de wet te bepalen datum niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel193
  - number: '193.2'
    text: |-
      Tot een bij de wet te bepalen datum kan Onze minister op verzoek van het bevoegd gezag, onder door hem te stellen
      voorwaarden, een school voor bekostiging in aanmerking brengen indien de school is gelegen in een gebied waarin
      sprake is van een uitzonderlijke bevolkingstoename, indien sprake is van een verandering van de plaats van
      vestiging van een reeds bekostigde school, indien sprake is van omzetting van een bekostigde bijzondere school
      in een gelijksoortige openbare school of omgekeerd, indien sprake is van omzetting van een bekostigde bijzondere
      school in een gelijksoortige bijzondere school van een andere richting, dan wel indien sprake is van uitbreiding
      van het onderwijs aan een school met onderwijs van een of meer andere richtingen. Het verzoek is met redenen
      omkleed en gaat vergezeld van de gegevens, genoemd in artikel 199, tweede lid. Onze minister willigt het verzoek
      slechts in indien de school bij toepassing van artikel 201, eerste en derde lid, op grond van het eerste lid van
      dat artikel in een door provinciale staten of Onze minister vast te stellen plan van nieuwe scholen zou worden
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel193
  - number: '193.3'
    text: |-
      Een school die is opgenomen in een door Onze minister goedgekeurd of vastgesteld plan van nieuwe scholen voor de
      jaren 1991, 1992, 1993 en 1994 komt voor bekostiging in aanmerking indien de school in dat plan is opgenomen met
      als jaar van aanvang van de bekostiging 1991 en het onderwijs voor 1 januari 1992 een aanvang heeft genomen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel193
  - number: '194'
    text: |-
      Indien beroep is ingesteld in verband met de plannen van nieuwe scholen voor de jaren 1986 tot en met 1994 en
      op grond van de artikelen 197, derde lid, 198, derde lid, 201, vijfde lid, en 202, achtste lid, de uitspraak
      zou hebben geleid tot opneming van een school in het eerstvolgende plan, brengt Onze Minister deze school voor
      bekostiging in aanmerking in het eerste jaar van de planperiode waarop dat plan betrekking zou hebben gehad. Zodra
      de bekostiging van een school een aanvang kan nemen, beslist Onze Minister bij beschikking met ingang van welk
      tijdstip dit kan geschieden. De bekostiging kan na een beschikking van Onze minister als bedoeld in de vorige
      volzin, slechts aanvangen per 1 augustus van een schooljaar.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel194
  - number: '195'
    text: |-
      De bekostiging van een school kan slechts een aanvang nemen, indien zij voorkomt op een plan van nieuwe scholen,
      vastgesteld volgens de bepalingen van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel195
  - number: '196.1'
    text: |-
      Provinciale staten stellen op voordracht van gedeputeerde staten, al dan niet in samenwerking met provinciale
      staten van een of meer andere provincies, jaarlijks voor 1 augustus een plan van nieuwe scholen in de
      provincie van vestiging vast voor scholen voor moeilijk lerende kinderen en scholen voor kinderen met leer- en
      opvoedingsmoeilijkheden, die in de 4 kalenderjaren volgende op het jaar van vaststelling voor bekostiging uit
      de openbare kassen in aanmerking dienen te worden gebracht. Het plan heeft ten doel te komen tot een evenwichtig
      geheel van onderwijsvoorzieningen in de betrokken provincie. Het plan behoeft de goedkeuring van Onze minister.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel196
  - number: '196.2'
    text: |-
      Bij de vaststelling van het plan wordt uitgegaan van de verzoeken bedoeld in artikel 199. Tevens bezien provinciale
      staten bij de vaststelling van het plan of voldoende is voorzien in de behoefte aan openbaar onderwijs. Provinciale
      staten betrekken bij de vaststelling van het plan de opnamecapaciteit van de bestaande onderwijsvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel196
  - number: '196.3'
    text: |-
      Het plan vermeldt de schoolsoort, de plaats van vestiging en de te verwachten omvang, alsmede welke scholen in het
      eerste jaar van de planperiode voor bekostiging in aanmerking komen en de reden waarom de overige scholen daarvoor
      niet in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel196
  - number: '196.4'
    text: |-
      Bij de goedkeuring van Onze minister van het plan treden voor de toepassing van
      [artikel 4:8 van de Algemene wet bestuursrecht][ref1] gedeputeerde staten in de plaats van het bevoegd gezag van de
      bijzondere scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '197.1'
    text: 'Behoudens het bepaalde in het tweede lid worden in elk plan de scholen uit het voorafgaande plan opgenomen die:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel197
  - number: 197.1.a
    text: nog niet voor bekostiging in aanmerking zijn gebracht;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel197
  - number: 197.1.b
    text: voor bekostiging in aanmerking zijn gebracht, maar waaraan het onderwijs nog niet is aangevangen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel197
  - number: '197.2'
    text: 'Uit het voorafgaande plan wordt een school niet opgenomen:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel197
  - number: 197.2.a
    text: indien de indiener van een verzoek heeft gevraagd de school te laten vervallen;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel197
  - number: 197.2.b
    text: |-
      indien aan een bijzondere school het onderwijs niet is aangevangen in het tweede jaar volgend op het jaar waarvoor
      de school het eerst voor bekostiging in aanmerking is gebracht, tenzij opneming in het plan op grond van de bij een
      nieuw verzoek overgelegde gegevens gerechtvaardigd is;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel197
  - number: 197.2.c
    text: |-
      indien zich naar het oordeel van provinciale staten omstandigheden hebben voorgedaan die bij de vaststelling van
      het plan niet bekend waren en die, waren zij wel bekend geweest, tot een ander besluit zouden hebben geleid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel197
  - number: '197.3'
    text: |-
      Indien beroep is ingesteld tegen een besluit krachtens het tweede lid, onderdeel c, en de uitspraak strekt tot
      opneming van een school in het plan, nemen provinciale staten de school op in het eerste na de uitspraak vast te
      stellen plan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel197
  - number: '198.1'
    text: 'De vaststelling van een plan blijft achterwege, indien:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel198
  - number: 198.1.a
    text: |-
      geen verzoeken om opneming in het plan zijn ingekomen of geen der ingekomen verzoeken voor inwilliging in
      aanmerking komt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel198
  - number: 198.1.b
    text: |-
      provinciale staten besluiten dat vermeerdering van het aantal openbare scholen in de planperiode niet noodzakelijk
      is en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel198
  - number: 198.1.c
    text: geen scholen uit het voorafgaande plan voor opneming in het plan in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel198
  - number: '198.2'
    text: |-
      Het besluit bedoeld in het eerste lid onder b, behoeft de goedkeuring van Onze minister. Het wordt voor 1
      augustus voorafgaande aan de betrokken planperiode aan Onze minister gezonden. Artikel 202, derde lid, is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel198
  - number: '198.3'
    text: |-
      Indien een besluit van de minister, houdende weigering van de goedkeuring onherroepelijk is geworden, nemen
      provinciale staten de openbare school op in het eerste na een zodanig besluit vast te stellen plan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel198
  - number: '198.4'
    text: |-
      Aan de indieners van de niet ingewilligde verzoeken bedoeld in het eerste lid onder a, wordt voor 15 augustus
      voorafgaande aan de betrokken planperiode afschrift gezonden van het desbetreffende besluit.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel198
  - number: '199.1'
    text: |-
      Een verzoek om opneming in het plan wordt voor 1 februari van het jaar van de vaststelling van het plan, bij
      gedeputeerde staten ingediend door de gemeenteraad of door ouders, indien het een openbare school betreft, en door
      het bevoegd gezag, indien het een bijzondere school betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel199
  - number: '199.2'
    text: 'Elk verzoek is met redenen omkleed en gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel199
  - number: 199.2.a
    text: een prognose van het te verwachten aantal leerlingen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel199
  - number: 199.2.b
    text: de beschrijving van het voedingsgebied,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel199
  - number: 199.2.c
    text: de aanduiding van de plaats waar het onderwijs moet worden gegeven, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel199
  - number: 199.2.d
    text: de voorgestelde datum van ingang van de bekostiging.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel199
  - number: '200'
    text: |-
      Indien gedeputeerde staten van oordeel zijn dat een andere school dan gevraagd wordt, dan wel een andere plaats van
      vestiging meer in overeenstemming is met een evenwichtig geheel van onderwijsvoorzieningen in de provincie, treden
      zij, alvorens het plan ter vaststelling voor te dragen, in overleg met de aanvrager.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel200
  - number: '201.1'
    text: |-
      In het plan worden in elk geval opgenomen de scholen waarvan redelijkerwijs kan worden aangenomen dat zij, gelet
      op de belangstelling voor de desbetreffende schoolsoort en op het leerlingenverloop, blijkens statistische gegevens
      zullen worden bezocht door ten minste 42 leerlingen. Tot het totaal aantal leerlingen bedoeld onder c, behoren ten
      minste 21 leerlingen die in aanmerking komen voor het volgen van voortgezet speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel201
  - number: '201.2'
    text: |-
      In het plan kunnen scholen worden opgenomen waarvan redelijkerwijs kan worden aangenomen dat zij, gelet op de
      belangstelling voor de desbetreffende schoolsoort en op het leerlingenverloop, blijkens statistische gegevens
      zullen worden bezocht door ten minste 32 leerlingen. Tot het aantal leerlingen bedoeld onder c behoren ten minste
      14 leerlingen die in aanmerking komen voor het volgen van voortgezet speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel201
  - number: '201.3'
    text: 'Bij de toepassing van het eerste en het tweede lid worden niet in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel201
  - number: 201.3.a
    text: |-
      de leerlingen voor wie binnen redelijke afstand plaatsruimte beschikbaar zal zijn op een gelijksoortige school waar
      het verlangde onderwijs wordt gegeven, tenzij deze school uitsluitend voor interne leerlingen is bestemd;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel201
  - number: 201.3.b
    text: |-
      leerlingen die in een andere provincie woonachtig zijn en bij de vaststelling van een plan in die provincie in
      aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel201
  - number: '201.4'
    text: |-
      Tegen een besluit van provinciale staten om een verzoek tot opneming in het plan van een bijzondere of een openbare
      school niet in te willigen, kan iedere belanghebbende administratief beroep instellen bij Onze minister.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel201
  - number: '201.5'
    text: |-
      Indien een onherroepelijk geworden beslissing in beroep of een uitspraak naar aanleiding van de beslissing in
      beroep, dan wel het naar aanleiding daarvan genomen besluit van Onze minister strekt tot het voor bekostiging
      in aanmerking brengen van de school, nemen provinciale staten de school op in het na de beslissing in beroep, de
      uitspraak of het besluit vast te stellen plan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel201
  - number: '202.1'
    text: |-
      Aan het plan wordt toegevoegd een overzicht van de verzoeken die niet zijn ingewilligd en de motivering daarvan.
      Deze stukken worden door gedeputeerde staten binnen 2 weken na de vaststelling van het plan aan alle verzoekers
      gezonden met vermelding van de datum waarop het plan ter goedkeuring aan Onze minister is gezonden. Het plan wordt
      binnen 2 weken na de vaststelling voor een periode van 6 weken ter inzage gelegd op de provinciale griffie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel202
  - number: '202.2'
    text: |-
      Binnen 2 weken na de vaststelling wordt het plan ter goedkeuring aan Onze minister gezonden.
      Het gaat vergezeld van de ingewilligde verzoeken en het overzicht bedoeld in het eerste lid.
      [Artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel202
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '202.3'
    text: |-
      Onze minister besluit met inachtneming van het beroepschrift bedoeld in artikel 201, vierde lid, voor 1 december
      van het jaar voorafgaande aan de planperiode. Afschrift van het besluit wordt binnen 2 weken aan provinciale staten
      gezonden. Indien Onze minister niet voor 1 december heeft besloten, wordt het plan geacht te zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel202
  - number: '202.4'
    text: 'Onze minister onthoudt zijn goedkeuring indien en voor zover:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel202
  - number: 202.4.a
    text: |-
      provinciale staten ten onrechte vermeerdering van het aantal openbare scholen in de planperiode niet noodzakelijk
      hebben geacht;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel202
  - number: 202.4.b
    text: |-
      opneming van een school in het plan niet noodzakelijk is omdat de opnamecapaciteit van de bestaande
      onderwijsvoorzieningen toereikend is dan wel niet in overeenstemming is met het tot stand brengen van een
      evenwichtig geheel van onderwijsvoorzieningen, tenzij redelijkerwijs kan worden aangenomen dat de school zal worden
      bezocht door het in artikel 201, eerste lid, bedoelde aantal leerlingen;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel202
  - number: 202.4.c
    text: is uitgegaan van kennelijk ondeugdelijke prognoses;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel202
  - number: 202.4.d
    text: |-
      ten aanzien van een op het plan geplaatste school ten onrechte niet is bepaald dat zij voor bekostiging in
      aanmerking komt in het eerste jaar van de planperiode.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel202
  - number: '202.5'
    text: |-
      Bij onthouding van de goedkeuring op grond van het vierde lid onder a draagt Onze minister provinciale staten op
      alsnog een openbare school in het plan op te nemen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel202
  - number: '202.6'
    text: |-
      Bij onthouding van goedkeuring op grond van het vierde lid onder d draagt Onze minister provinciale staten op de
      bekostiging van de school in het eerste jaar van de planperiode in het plan op te nemen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel202
  - number: '202.7'
    text: |-
      Indien ten gevolge van een besluit op grond van het vierde lid een school uit het plan moet vervallen, deelt Onze
      minister dit besluit binnen 2 weken mee aan de indiener van het verzoek om opneming van de betrokken school in
      het plan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel202
  - number: '202.8'
    text: |-
      Indien in beroep tegen het besluit van Onze Minister, bedoeld in het zevende lid, is bepaald dat de uitspraak van
      de rechter, dan wel het besluit naar aanleiding van die uitspraak, strekt tot opneming van een school in het plan,
      nemen provinciale staten de school op in het eerste na de uitspraak vast te stellen plan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel202
  - number: '202.9'
    text: |-
      Zodra het plan onherroepelijk is vastgesteld, dragen gedeputeerde staten zorg voor bekendmaking in de Staatscourant
      en het provinciaal blad.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel202
  - number: '202.10'
    text: |-
      Zodra de bekostiging van een in het plan opgenomen school een aanvang kan nemen, besluit Onze minister bij
      beschikking, met ingang van welk tijdstip dit kan geschieden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel202
  - number: '203'
    text: |-
      Indien een plan onherroepelijk is vastgesteld, is de gemeente verplicht tot stichting van de daarop geplaatste
      scholen voor openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel203
  - number: '204.1'
    text: |-
      Scholen die gedurende 3 achtereenvolgende jaren in het plan zijn opgenomen en niet voor bekostiging in aanmerking
      zijn gebracht, worden in het daaropvolgende jaar voor bekostiging in aanmerking gebracht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel204
  - number: '204.2'
    text: |-
      Ten aanzien van een school die ingevolge artikel 197, derde lid, of artikel 202, achtste lid, in het daar bedoelde
      plan wordt opgenomen, vangt de termijn genoemd in het eerste lid, aan met ingang van het eerste jaar van het plan
      waarin de school was opgenomen. Ten aanzien van een school die ingevolge artikel 201, vierde lid, in het daar
      bedoelde plan wordt opgenomen, vangt de termijn genoemd in het eerste lid, aan met ingang van het eerste jaar van
      het plan waarvoor het verzoek werd ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel204
  - number: '205.1'
    text: Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel205
  - number: '205.2'
    text: |-
      De algemene maatregel van bestuur bedoeld in het eerste lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
      Het bepaalde in de vorige 3 volzinnen is niet van toepassing indien het ontwerp van de algemene maatregel van
      bestuur voordien aan de Kamer is overgelegd en door of namens de Kamer te kennen is gegeven dat van de procedure
      bedoeld in de eerste 3 volzinnen, kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel205
  - number: '206'
    text: |-
      De gemeenteraad draagt ten behoeve van de door de gemeente in stand gehouden scholen en ten behoeve van de niet
      door de gemeente in stand gehouden scholen zorg voor de voorzieningen in de huisvesting op het grondgebied van de
      gemeente overeenkomstig het bepaalde in deze afdeling. Hij behandelt daarbij de door de gemeente in stand gehouden
      scholen en de niet door de gemeente in stand gehouden scholen op gelijke voet.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel206
  - number: '207.1'
    text: 'Voor de toepassing van deze afdeling worden onder voorzieningen in de huisvesting begrepen:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel207
  - number: 207.1.a
    text: 'voor blijvend onderscheidenlijk voor tijdelijk gebruik bestemde voorzieningen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel207
  - number: 207.1.a.1°
    text: |-
      nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een gedeelte
      daarvan, terreinen, alsmede eerste aanschaf van onderwijsleerpakketten en meubilair,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel207
  - number: 207.1.a.2°
    text: uitbreiding van de onder 1° bedoelde voorzieningen, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel207
  - number: 207.1.a.3°
    text: |-
      medegebruik van een ruimte die geschikt is voor het onderwijs, dan wel een bad voor watergewenning of
      bewegingstherapie;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel207
  - number: 207.1.b
    text: 'voorzieningen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel207
  - number: 207.1.b.1°
    text: |-
      aanpassingen met uitzondering van het aanbrengen van een invalidentoilet en het toegankelijk maken van het gebouw
      voor gehandicapten, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel207
  - number: 207.1.b.2°
    text: |-
      vervanging binnenkozijnen en binnendeuren inclusief hang- en sluitwerk, algehele vervanging radiatoren, convectoren
      en leidingen voor de centrale verwarming alsmede onderhoud aan de buitenzijde van het gebouw met uitzondering van
      het buitenschilderwerk;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel207
  - number: 207.1.c
    text: |-
      herstel van constructiefouten aan het gebouw, alsmede herstel en vervanging in verband met schade aan gebouw,
      onderwijsleerpakketten en meubilair in geval van bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel207
  - number: '207.2'
    text: |-
      Bij algemene maatregel van bestuur worden bruto vloeroppervlakten per gelijktijdig aanwezige leerling
      voorgeschreven die voorzieningen in de huisvesting ten minste dienen te bevatten. Deze oppervlakten kunnen per
      schoolsoort verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel207
  - number: '208.1'
    text: |-
      De gemeenteraad stelt jaarlijks ten behoeve van het eerstvolgende jaar voor een door hem te bepalen tijdstip een
      bekostigingsplafond vast voor de bekostiging van de voorzieningen in de huisvesting voor:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel208
  - number: 208.1.a
    text: scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel208
  - number: 208.1.b
    text: basisscholen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel208
  - number: 208.1.c
    text: speciale scholen voor basisonderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel208
  - number: 208.1.d
    text: |-
      scholen voor speciaal onderwijs, scholen voor voortgezet speciaal onderwijs, scholen voor speciaal en voortgezet
      speciaal onderwijs dan wel instellingen voor speciaal en voortgezet speciaal onderwijs als bedoeld in de
      [Wet op de expertisecentra][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel208
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 208.1.e
    text: |-
      scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs en
      voor voorbereidend beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel208
  - number: '208.2'
    text: |-
      Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      in het eerste lid bedoelde scholen op het grondgebied van de gemeente.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel208
  - number: '209.1'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat een voorziening in de huisvesting
      wenst, dient een aanvraag voor opneming van die voorziening op het programma, bedoeld in artikel 210, in bij
      burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel209
  - number: '209.2'
    text: |-
      De gemeenteraad kan ten aanzien van voorzieningen als bedoeld in artikel 207 bekostiging verstrekken ter zake van
      de kosten van bouwvoorbereiding.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel209
  - number: '209.3'
    text: |-
      De gemeenteraad stelt vast, voor welk tijdstip de aanvraag wordt ingediend en aan welke voorwaarden deze dient
      te voldoen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel209
  - number: '209.4'
    text: Het derde lid is van overeenkomstige toepassing op de door de gemeente in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel209
  - number: '210.1'
    text: |-
      De gemeenteraad stelt, na overleg met de bevoegde gezagsorganen van de niet door de gemeente in stand gehouden
      scholen in de gemeente, jaarlijks ten behoeve van het onderwijs op het grondgebied van de gemeente voor een door
      hem te bepalen tijdstip een programma als bedoeld in het tweede lid vast. Het programma heeft betrekking op scholen
      als bedoeld in artikel 208, eerste lid, onderdelen a tot en met e.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel210
  - number: '210.2'
    text: |-
      Het programma omvat de voorzieningen in de huisvesting, bedoeld in artikel 207, die in het jaar na de vaststelling
      van het programma voor bekostiging in aanmerking zullen worden gebracht voor niet door de gemeente in stand
      gehouden scholen en voorzieningen die nodig zijn voor door de gemeente in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel210
  - number: '210.3'
    text: 'De gemeenteraad neemt uitsluitend voorzieningen in de huisvesting in het programma op, voor zover:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel210
  - number: 210.3.a
    text: |-
      met de voorzieningen in het kalenderjaar volgend op het jaar van vaststelling van het programma redelijkerwijs een
      aanvang kan worden gemaakt dan wel de voorzieningen in het desbetreffende kalenderjaar kunnen worden gerealiseerd,
      en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel210
  - number: 210.3.b
    text: niet een van de weigeringsgronden, genoemd in artikel 215, van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel210
  - number: '210.4'
    text: |-
      Indien het bekostigingsplafond, bedoeld in artikel 208, niet toereikend is, worden die voorzieningen in het
      programma opgenomen die uit dat bekostigingsplafond kunnen worden bekostigd, waarbij de volgorde wordt bepaald met
      inachtneming van de criteria, bedoeld in artikel 217, eerste lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel210
  - number: '210.5'
    text: |-
      De beschikking van de gemeenteraad kan een gedeelte van de gewenste voorziening dan wel een andere voorziening dan
      gewenst omvatten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel210
  - number: '210.6'
    text: |-
      De gemeenteraad kan aan de opneming in het programma voorwaarden verbinden betreffende ingebruikneming of
      buitengebruikstelling van gebouwen of lokalen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel210
  - number: '210.7'
    text: |-
      De gemeenteraad neemt bij de vaststelling van het programma de criteria, bedoeld in artikel 217, eerste lid,
      onderdeel c, in acht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel210
  - number: '210.8'
    text: |-
      Binnen vier weken na de vaststelling van het programma treden burgemeester en wethouders met het bevoegd gezag
      in overleg over de wijze van uitvoering. Indien dit overleg niet tot overeenstemming leidt, delen burgemeester en
      wethouders het bevoegd gezag mede dat zij niet kunnen instemmen met de door het bevoegd gezag gewenste wijze van
      uitvoering.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel210
  - number: '210.9'
    text: |-
      Tijdens het in het eerste lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling van het programma huisvestingsvoorzieningen in relatie tot de vrijheid van richting
      en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd dan wel uit
      eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies
      wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met het programma.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel210
  - number: '211'
    text: |-
      De gemeenteraad stelt gelijktijdig met het programma, bedoeld in artikel 210, ten behoeve van het onderwijs op
      het grondgebied van de gemeente voor een door hem te bepalen tijdstip een overzicht vast van die voorzieningen die
      zijn aangevraagd dan wel die nodig zijn, die niet op het programma zijn opgenomen. Daarbij wordt aangegeven waarom
      de desbetreffende voorzieningen niet zijn opgenomen. Het overzicht wordt ter inzage gelegd. Het overzicht heeft
      betrekking op scholen als bedoeld in artikel 208, eerste lid, onderdelen a tot en met e.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel211
  - number: '212'
    text: |-
      De gemeenteraad stelt geen programma als bedoeld in artikel 210 en geen overzicht als bedoeld in artikel 211 vast,
      indien geen voorziening in de huisvesting nodig is noch een aanvraag is ingediend voor scholen als bedoeld in
      artikel 208, eerste lid, onderdelen a tot en met e.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel212
  - number: '213.1'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat een voorziening in de huisvesting
      wenst die niet in het programma, bedoeld in artikel 210, is opgenomen, maar die gelet op de voortgang van het
      onderwijs geen uitstel kan lijden, dient een aanvraag om bekostiging van die voorziening in bij burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel213
  - number: '213.2'
    text: |-
      De beschikking kan een gedeelte van de gewenste voorziening dan wel een andere voorziening dan gewenst omvatten. De
      gemeenteraad wijst de aanvraag af, indien:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel213
  - number: 213.2.a
    text: de beslissing over de voorziening kan worden genomen bij de vaststelling van het eerstvolgende programma, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel213
  - number: 213.2.b
    text: |-
      een van de weigeringsgronden, genoemd in artikel 215, eerste lid, onderdelen a tot en met d en f, en tweede lid,
      van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel213
  - number: '214.1'
    text: |-
      De gemeenteraad beslist bij beschikking met ingang van welk tijdstip in het jaar volgend op het jaar van
      vaststelling van het programma, bedoeld in artikel 210, de bekostiging van een voorziening die in het programma is
      opgenomen, daadwerkelijk een aanvang kan nemen, onverminderd het bepaalde in artikel 216.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel214
  - number: '214.2'
    text: |-
      De aanspraak op bekostiging van een voorziening vervalt, indien niet binnen een door de gemeente in de verordening
      op basis van artikel 217 te bepalen termijn na de beschikking, bedoeld in het eerste lid, met betrekking tot de
      voorziening een bouwopdracht is gegeven dan wel een koop-, huur- of erfpachtovereenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel214
  - number: '215.1'
    text: 'Een voorziening in de huisvesting wordt slechts geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel215
  - number: 215.1.a
    text: de gewenste voorziening geen voorziening is in de zin van artikel 207,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel215
  - number: 215.1.b
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de aard en de omvang van de voorzieningen waarover de
      school reeds beschikt, voor zover deze uit de openbare kas zijn bekostigd, gelet op de normen, bedoeld in artikel
      217, eerste lid, onderdeel b,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel215
  - number: 215.1.c
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van het aantal
      leerlingen of onderwijskundige ontwikkelingen, zulks met inachtneming van het bepaalde in artikel 217, eerste lid,
      onderdelen c en d,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel215
  - number: 215.1.d
    text: |-
      op andere wijze dan wordt gewenst redelijkerwijs in de behoefte aan huisvesting kan worden voorzien, onder meer
      doordat binnen redelijke afstand van de gewenste plaats van de voorziening gebruik dan wel medegebruik mogelijk is,
      of een reeds voor bekostiging in aanmerking gebracht gebouw of deel daarvan beschikbaar komt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel215
  - number: 215.1.e
    text: |-
      het bekostigingsplafond, bedoeld in artikel 208, niet toereikend is voor de te verstrekken voorzieningen voor
      scholen als bedoeld in het eerste lid, onderdelen a tot en met e, van dat artikel, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel215
  - number: 215.1.f
    text: de gewenste voorziening anders dan op grond van de onderdelen b tot en met d niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel215
  - number: '215.2'
    text: |-
      Een voorziening in de huisvesting kan tevens worden geweigerd, indien de voorziening als gevolg van het verwijtbaar
      nalaten van noodzakelijk onderhoud in een slechte bouwkundige staat verkeert of indien de voorziening nodig is voor
      herstel van schade die is veroorzaakt door schuld of toedoen van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel215
  - number: '216'
    text: |-
      Voorzieningen die in het programma, bedoeld in artikel 210, zijn opgenomen, komen voor bekostiging in aanmerking,
      mits op het tijdstip dat daarvoor op grond van artikel 214, eerste lid, is vastgesteld,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel216
  - number: 216.a
    text: is voldaan aan de bij of krachtens de wet gestelde voorschriften, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel216
  - number: 216.b
    text: |-
      de feiten en omstandigheden waarin de school verkeert, ten opzichte van de feiten en omstandigheden ten tijde van
      de vaststelling van het programma niet ingrijpend zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel216
  - number: '217.1'
    text: 'De gemeenteraad stelt bij verordening een regeling vast met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel217
  - number: 217.1.a
    text: de voorzieningen die ingevolge artikel 207 voor bekostiging in aanmerking kunnen worden gebracht,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel217
  - number: 217.1.b
    text: de oppervlakte en de indeling van schoolgebouwen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel217
  - number: 217.1.c
    text: de urgentiecriteria,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel217
  - number: 217.1.d
    text: de prognosecriteria,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel217
  - number: 217.1.e
    text: de termijn bedoeld in artikel 214,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel217
  - number: 217.1.f
    text: de procedure met betrekking tot verhuur en het medegebruik van ruimten voor het onderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel217
  - number: 217.1.g
    text: |-
      de termijn gedurende welke een gebouw of terrein voor een school of nevenvestiging nog ten hoogste kan worden
      gebruikt bij toepassing van artikel 225, alsmede de procedure in verband met een eventueel op te maken staat van
      onderhoud, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel217
  - number: 217.1.h
    text: de gegevens bedoeld in artikel 227.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel217
  - number: '217.2'
    text: |-
      De regeling wordt zodanig vastgesteld dat kan worden voldaan aan de redelijke eisen die het onderwijs aan de
      huisvesting van scholen in de gemeente stelt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel217
  - number: '217.3'
    text: |-
      De gemeenteraad stelt normen vast aan de hand waarvan de bedragen worden vastgesteld voor de toegekende
      voorzieningen in de huisvesting.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel217
  - number: '217.4'
    text: |-
      Burgemeester en wethouders betalen volgens door hen te stellen regels de bedragen aan de hand van de door de
      gemeenteraad gestelde normen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel217
  - number: '217.5'
    text: |-
      De gemeenteraad stelt de regeling, bedoeld in het eerste lid, dan wel een wijziging daarvan, niet vast dan nadat
      daarover op overeenstemming gericht overleg is gevoerd met door de bevoegde gezagsorganen van de niet door de
      gemeente in stand gehouden scholen in de gemeente aan te wijzen vertegenwoordigers. De gemeenteraad stelt daartoe
      een procedure vast.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel217
  - number: '217.6'
    text: |-
      Tijdens het in het vijfde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling of wijziging van de gemeentelijke verordening in relatie tot de vrijheid van richting
      en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd dan wel uit
      eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies
      wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met de verordening
      of de wijziging daarvan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel217
  - number: '218.1'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school geeft opdracht de voorziening in de
      huisvesting waartoe op grond van de artikelen 210 en 213 kan worden overgegaan, tot stand te brengen met daartoe
      door de gemeente beschikbaar te stellen gelden, tenzij het met burgemeester en wethouders overeenkomt dat de
      gemeente deze voorziening tot stand brengt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel218
  - number: '218.2'
    text: |-
      Indien de gemeente de voorziening in de huisvesting van een niet door de gemeente in stand gehouden school tot
      stand heeft gebracht, worden gebouw en terrein aan het bevoegd gezag in eigendom overgedragen, tenzij burgemeester
      en wethouders en het bevoegd gezag anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel218
  - number: '218.3'
    text: |-
      Indien de voorziening in de huisvesting, bedoeld in het tweede lid, niet voldoet aan de eisen voor
      eigendomsoverdracht, geven burgemeester en wethouders deze aan het bevoegd gezag in gebruik.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel218
  - number: '219'
    text: |-
      Tenzij het bevoegd gezag van een niet door de gemeente in stand gehouden school dat aanspraak heeft op bekostiging
      van een voorziening in de huisvesting, met burgemeester en wethouders overeenkomt dat de gemeente deze voorziening
      tot stand brengt, behoeven de bouwplannen en de desbetreffende begrotingen de instemming van burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel219
  - number: '220'
    text: |-
      De gemeente brengt een voorziening in de huisvesting van een niet door de gemeente in stand gehouden school
      slechts tot stand, indien tussen burgemeester en wethouders en het bevoegd gezag overeenstemming bestaat over de
      bouwplannen en de wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel220
  - number: '221.1'
    text: |-
      Het bevoegd gezag is verplicht het gebouw en terrein, alsmede de roerende zaken waarvoor bekostiging wordt genoten,
      behoorlijk te gebruiken en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel221
  - number: '221.2'
    text: |-
      Vervreemding door het bevoegd gezag van een niet door de gemeente in stand gehouden school anders dan op grond
      van artikel 170 of artikel 176, van gebouwen, terreinen en roerende zaken waarvoor bekostiging wordt genoten, of
      bezwaren met een zakelijk recht door het bevoegd gezag van een niet door de gemeente in stand gehouden school van
      zodanige gebouwen en terreinen, is zonder toestemming van burgemeester en wethouders nietig.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel221
  - number: '221.3'
    text: |-
      Het tweede lid is niet van toepassing ten aanzien van het recht van opstal ten behoeve van een door de gemeente te
      plaatsen tijdelijke voorziening in de huisvesting op grond die eigendom is van het bevoegd gezag van de betrokken
      school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel221
  - number: '222.1'
    text: |-
      Burgemeester en wethouders zijn bevoegd een gedeelte van een gebouw of terrein dat tijdelijk of gedurende een
      gedeelte van de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd als huisvesting
      voor een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde speciaal onderwijs en
      voortgezet speciaal onderwijs, of voor educatie als bedoeld in de [Wet educatie en beroepsonderwijs][ref1] dan
      wel voor andere culturele, maatschappelijke of recreatieve doeleinden te bestemmen. Het voorgenomen gebruik
      dient zich te verdragen met het onderwijs aan de in het gebouw gevestigde school. Tevens zijn burgemeester
      en wethouders bevoegd ten behoeve van het onderwijs in lichamelijke oefening of expressie-activiteiten, dan
      wel ten behoeve van watergewenning of bewegingstherapie een gebouw of terrein dan wel een gedeelte daarvan
      dat tijdelijk gedurende gedeelten van de dag of in het geheel niet nodig zal zijn voor de daar gevestigde
      school, gedurende die tijd als huisvesting voor een andere school, voor ander uit de openbare kas bekostigd
      onderwijs niet zijnde speciaal onderwijs en voortgezet speciaal onderwijs, of voor educatie als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref2] dan wel voor andere culturele, maatschappelijke of recreatieve doeleinden
      te bestemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0007625
  - number: '222.2'
    text: |-
      Indien het gebouw of terrein in gebruik is voor een niet door de gemeente in stand gehouden school, plegen
      burgemeester en wethouders vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met het bevoegd
      gezag van die school of nevenvestiging waarvoor de huisvesting is bestemd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel222
  - number: '223.1'
    text: |-
      Voor zover artikel 222 geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw of terrein
      in gebruik geven ten behoeve van uit de openbare kas bekostigd onderwijs dan wel voor andere culturele,
      maatschappelijke of recreatieve doeleinden. Voor zover niet nodig voor uit de openbare kas bekostigd onderwijs,
      kan het bevoegd gezag een gedeelte van het gebouw of terrein verhuren aan een derde, voor zover het gehuurde
      niet bestemd zal zijn als woon- of bedrijfsruimte als bedoeld in de [artikelen 1623a, tweede lid][ref1], en
      [1624, tweede lid, van het Burgerlijk Wetboek][ref2]. Indien het een niet door de gemeente in stand gehouden school
      betreft, is voor verhuur toestemming van burgemeester en wethouders vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0006000#Artikel1623a
      [ref2]: https://wetten.overheid.nl/BWBR0006000#Artikel1624
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel223
    references:
      - id: ref1
        bwb_id: BWBR0006000
        artikel: 1623a
      - id: ref2
        bwb_id: BWBR0006000
        artikel: '1624'
  - number: '223.2'
    text: 'De ingebruikgeving of verhuur ingevolge het eerste lid eindigt:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel223
  - number: 223.2.a
    text: |-
      indien burgemeester en wethouders gebruik maken van hun bevoegdheid op grond van artikel 222 zonder dat enige
      schadeplicht ontstaat, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel223
  - number: 223.2.b
    text: indien het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel223
  - number: '223.3'
    text: |-
      Ingebruikgeving of verhuur ingevolge het eerste lid geschiedt niet indien het voorgenomen gebruik zich niet
      verdraagt met het onderwijs aan de in het gebouw gevestigde school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel223
  - number: '223.4'
    text: |-
      Op de ingebruikgeving en verhuur ingevolge het eerste lid zijn de bepalingen van de [Huurwet][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002066
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel223
    references:
      - id: ref1
        bwb_id: BWBR0002066
  - number: '223.5'
    text: |-
      Het zonder toestemming van burgemeester en wethouders verhuren van een gebouw of terrein door het bevoegd gezag
      van een niet door de gemeente in stand gehouden school alsmede elk met dit artikel strijdig beding opgenomen in een
      huurovereenkomst met betrekking tot schoolgebouwen, is nietig.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel223
  - number: '224'
    text: |-
      Voorzieningen aan gebouwen of terreinen in verband met verhuur krachtens de artikelen 223 of 225 door het bevoegd
      gezag van een niet door de gemeente in stand gehouden school, komen niet ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel224
  - number: '225.1'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag van een niet door de gemeente in stand gehouden school dat eigenaar
      is van het gebouw en terrein, kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag blijvend heeft
      opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht vatbaar gedeelte
      daarvan, voor de school te gebruiken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel225
  - number: '225.2'
    text: |-
      Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het eerste lid desgevraagd besluiten
      dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor
      eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. De aanvraag om het besluit wordt gedaan
      door burgemeester en wethouders of door het bevoegd gezag van de school. Alvorens op de aanvraag te besluiten,
      horen gedeputeerde staten de wederpartij.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel225
  - number: '225.3'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat voornemens is gebouwen of terreinen,
      of een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, doet hiervan onverwijld mededeling aan
      burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel225
  - number: '225.4'
    text: |-
      Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, of het in het tweede lid bedoelde besluit
      van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de rechter,
      inhoudende een besluit als bedoeld in het tweede lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, wordt de akte, het onherroepelijk geworden besluit onderscheidenlijk de uitspraak, tenzij deze een gebouw
      betreft als bedoeld in artikel E 24 van de Overgangswet ISOVSO, zoals dit luidde op 31 juli 1998, ingeschreven in
      de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1]. Door de
      inschrijving verkrijgt de gemeente de eigendom.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '225.5'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag van een niet door de gemeente in stand gehouden school dat eigenaar
      is van het schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het gebouw dat niet vatbaar
      is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel225
  - number: '225.6'
    text: |-
      Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het vijfde lid desgevraagd besluiten
      dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs
      nodig zal zijn. De aanvraag om het besluit wordt gedaan door burgemeester en wethouders of door het bevoegd gezag
      van de school. Alvorens op de aanvraag te besluiten, horen gedeputeerde staten de wederpartij.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel225
  - number: '225.7'
    text: |-
      Zodra de in het vijfde lid bedoelde akte door beide partijen is getekend, of het in het zesde lid bedoelde besluit
      van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de rechter,
      inhoudende een beslissing als bedoeld in het zesde lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, kan het bevoegd gezag van een niet door de gemeente in stand gehouden school het desbetreffende gedeelte
      van het gebouw met toestemming van burgemeester en wethouders verhuren.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel225
  - number: '225.8'
    text: |-
      De toestemming, bedoeld in het zevende lid, wordt verleend voor een tijdvak van ten hoogste 3 jaren. Op verzoek van
      het bevoegd gezag kan dit tijdvak telkens worden verlengd met een termijn van ten hoogste 3 jaren.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel225
  - number: '225.9'
    text: |-
      De [Huurwet][ref1] is niet van toepassing op de verhuur, bedoeld in het zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002066
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0002066
  - number: '226'
    text: |-
      In afwijking van het bepaalde in deze afdeling kan de gemeenteraad met het bevoegd gezag van een niet door
      de gemeente in stand gehouden school, onder door de gemeenteraad te stellen voorwaarden, overeenkomen dat de
      gemeenteraad aan het bevoegd gezag ten behoeve van de door het bevoegd gezag op het grondgebied van die gemeente in
      stand gehouden school een jaarlijks bedrag voor huisvestingskosten betaalt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel226
  - number: '227'
    text: |-
      Het bevoegd gezag van een niet door de desbetreffende gemeente in stand gehouden school is gehouden aan de gemeente
      alle inlichtingen te verschaffen die de gemeente voor een adequate uitvoering van de bepalingen in deze afdeling
      noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel227
  - number: '228.1'
    text: |-
      Bij ministeriële regeling worden voor de scholen, niet zijnde instellingen, eenmaal in de vijf jaar voor 1 oktober
      programma's van eisen vastgesteld die de grondslag vormen voor de bekostiging van de voorzieningen, bedoeld in
      het derde lid. De programma's van eisen gelden voor de vijf jaar volgend op het jaar waarin de vaststelling dient
      plaats te vinden. De programma's van eisen kunnen per schoolsoort, verdeeld als aangegeven in artikel 125, tweede
      lid, worden vastgesteld, al naar gelang het scholen voor speciaal onderwijs, scholen voor voortgezet speciaal
      onderwijs, scholen voor speciaal en voortgezet speciaal onderwijs, dan wel afdelingen betreft. Elk programma van
      eisen omvat:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel228
  - number: 228.1.a
    text: een omschrijving van de in aanmerking genomen componenten waaruit de voorzieningen zijn opgebouwd,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel228
  - number: 228.1.b
    text: de daarvoor noodzakelijk geachte bedragen en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel228
  - number: 228.1.c
    text: de wijze waarop de voor elke voorziening vast te stellen bekostiging wordt berekend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel228
  - number: '228.2'
    text: |-
      De programma's van eisen voldoen aan de redelijke behoeften van een in normale omstandigheden verkerende school,
      onverminderd het vierde tot en met negende lid, en houden rekening met de bruto vloeroppervlakten die op grond van
      de algemene maatregel van bestuur, bedoeld in artikel 207, tweede lid, worden voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel228
  - number: '228.3'
    text: |-
      Programma's van eisen worden vastgesteld voor de materiële voorzieningen ten behoeve van de instandhouding van de
      scholen, daaronder niet begrepen de ruimten voor het onderwijs in lichamelijke oefening.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel228
  - number: '228.4'
    text: |-
      Bij ministeriële regeling worden jaarlijks voor 1 oktober de overeenkomstig het zesde lid, aangepaste bedragen
      vastgesteld. De aldus vastgestelde bedragen zijn de definitieve bedragen, geldend voor het jaar volgend op het jaar
      waarin de vaststelling dient plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel228
  - number: '228.5'
    text: |-
      Onze minister kan bij de vaststelling van de ministeriële regeling, bedoeld in het vierde lid, wijzigingen in de
      programma's van eisen aanbrengen indien de toestand van 's Rijks schatkist of onderwijskundige ontwikkelingen dat
      noodzakelijk maken. Aan de eerste volzin kan slechts toepassing worden gegeven indien de ministeriële regeling,
      bedoeld in het vierde lid, voor de in dat lid bedoelde datum wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel228
  - number: '228.6'
    text: |-
      De aanpassing, bedoeld in het vierde lid, vindt plaats door de bedragen op basis van de werkelijke
      prijsontwikkeling voor het tweede jaar voorafgaand aan het jaar waarvoor de bedragen worden vastgesteld, aan te
      passen overeenkomstig de prijsmutatie van de netto materiële consumptie, zoals opgenomen in de Macro Economische
      Verkenning, die naar verwachting zal optreden tussen het prijsniveau in het eerstbedoelde jaar en het prijsniveau
      in het daaropvolgende jaar, alsmede aan te passen overeenkomstig de prijsmutatie van de netto materiële consumptie,
      zoals opgenomen in de Macro Economische Verkenning, die naar verwachting zal optreden tussen het prijsniveau in
      het jaar voorafgaand aan het jaar waarvoor de bedragen worden vastgesteld en het jaar waarvoor de bedragen worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel228
  - number: '228.7'
    text: |-
      De ministeriële regelingen, bedoeld in het eerste en vierde lid, worden binnen 4 weken na de vaststelling, bedoeld
      in het eerste en vierde lid, gezamenlijk bekendgemaakt in het officiële publikatieblad van het Ministerie van
      Onderwijs, Cultuur en Wetenschappen, onder gelijktijdige overlegging aan de Tweede Kamer der Staten-Generaal. Van
      de bekendmaking wordt mededeling gedaan in de Staatscourant. De ministeriële regelingen treden niet in werking dan
      nadat 4 weken zijn verstreken na het overleggen aan de Tweede Kamer en gedurende die termijn niet door of namens
      de Kamer de wens tot overleg over de ministeriële regelingen te kennen wordt gegeven dan wel met de Tweede Kamer
      overleg is gevoerd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel228
  - number: '228.8'
    text: |-
      Naar aanleiding van het overleg met de Tweede Kamer kunnen wijzigingen in de programma's van eisen en de
      wijzigingen daarvan, bedoeld in het vijfde lid, worden aangebracht. De wijzigingen worden bekendgemaakt in het
      officiële publikatieblad van het Ministerie van Onderwijs, Cultuur en Wetenschappen. Van de bekendmaking wordt
      mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel228
  - number: '229.1'
    text: |-
      De programma's van eisen, bedoeld in artikel 228, derde lid onder a, worden onderverdeeld in programma's van eisen
      omtrent:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel229
  - number: 229.1.a
    text: onderhoud,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel229
  - number: 229.1.b
    text: energie- en waterverbruik,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel229
  - number: 229.1.c
    text: publiekrechtelijke heffingen, met uitzondering van de belastingen ter zake van onroerende zaken,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel229
  - number: 229.1.d
    text: middelen, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel229
  - number: 229.1.e
    text: administratie, beheer en bestuur.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel229
  - number: '229.2'
    text: |-
      De programma's van eisen, bedoeld in artikel 228, derde lid onder b, worden onderverdeeld in programma's van eisen
      omtrent de voorzieningen zoals onderscheiden in het eerste lid onder a, b en c, alsmede d voor zover het betreft
      onderhoud, vervanging en vernieuwing van onderwijsleerpakket en onderhoud meubilair.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel229
  - number: '229.3'
    text: Bij de programma's van eisen, bedoeld in het tweede lid, wordt onderscheid gemaakt in vaste en variabele kosten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel229
  - number: '230'
    text: |-
      Bij ministeriële regeling kan voor daarin aangewezen groepen van scholen het bedrag van de bekostiging betreffende
      de in artikel 228, derde lid, bedoelde voorzieningen hoger worden vastgesteld. De desbetreffende ministeriële
      regeling vermeldt tevens de grondslag van de bekostiging.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel230
  - number: '231.1'
    text: |-
      De gemeenteraad stelt na overleg met de bevoegde gezagsorganen van de niet door de gemeente in stand gehouden
      scholen het aantal klokuren per week vast dat per groep leerlingen ten hoogste
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel231
  - number: 231.1.a
    text: ter beschikking wordt gesteld in een ruimte voor het onderwijs in lichamelijke oefening, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel231
  - number: 231.1.b
    text: |-
      voor bekostiging voor de materiële instandhouding van een ruimte voor het onderwijs in lichamelijke oefening in
      aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel231
  - number: '231.2'
    text: Het aantal klokuren, bedoeld in het eerste lid, wordt ten minste vastgesteld op 2,25.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel231
  - number: '231.3'
    text: De gemeenteraad stelt de hoogte vast van
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel231
  - number: 231.3.a
    text: de bekostiging, bedoeld in het eerste lid, onder b, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel231
  - number: 231.3.b
    text: |-
      de bekostiging voor de vaste kosten van de materiële instandhouding van een ruimte voor lichamelijke oefening
      waarvan de eigendom berust bij het bevoegd gezag van een niet door de gemeente in stand gehouden school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel231
  - number: '231.4'
    text: |-
      Bij de vaststelling, bedoeld in het derde lid, kan onderscheid worden gemaakt naar gelang de oppervlakte van de
      ruimte, alsmede tussen ruimten voor de exploitatie waarvan op grond van de onderwijswetgeving bekostiging wordt
      verleend en ruimten waarvoor dat niet het geval is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel231
  - number: '232.1'
    text: |-
      Het bevoegd gezag dat, dan wel de gemeente die eigenaar is van een schoolgebouw, zorgt voor het deel van de
      materiële instandhouding waarop de programma's van eisen, bedoeld in artikel 229, eerste lid onder a, b en c,
      betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel232
  - number: '232.2'
    text: |-
      Het bevoegd gezag van een bijzondere school dat eigenaar is van een schoolgebouw, kan met burgemeester en
      wethouders overeenkomen dat de gemeente het in het eerste lid bedoelde deel van de materiële instandhouding geheel
      of gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel232
  - number: '232.3'
    text: |-
      Het bevoegd gezag, bedoeld in het eerste lid, kan met een bevoegd gezag dat gebruik maakt van de voorziening in
      de huisvesting van het eerstgenoemde bevoegd gezag, overeenkomen dat het laatstgenoemde bevoegd gezag het in het
      eerste lid bedoelde deel van de materiële instandhouding geheel of gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel232
  - number: '232.4'
    text: |-
      Ingeval de gemeente eigenaar is van het schoolgebouw, kan het bevoegd gezag van een bijzondere school met de
      gemeente overeenkomen dat het bevoegd gezag het in het eerste lid bedoelde deel van de materiële instandhouding
      geheel of gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel232
  - number: '232.5'
    text: |-
      Het bevoegd gezag zorgt voor het deel van de materiële instandhouding waarop de programma's van eisen, bedoeld in
      artikel 229, eerste lid onder d en e, betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel232
  - number: '233.1'
    text: Bij algemene maatregel van bestuur wordt per schoolsoort de grondslag vastgesteld voor de omvang van
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel233
  - number: 233.1.a
    text: |-
      de formatie voor de vervulling van reguliere taken van de school met inbegrip van een opslag in verband met
      formatieve fricties en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel233
  - number: 233.1.b
    text: |-
      de formatie voor speciale doeleinden, waaronder in ieder geval wordt begrepen de formatie voor de bestrijding van
      onderwijsachterstanden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel233
  - number: '233.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat indien het aantal leerlingen van een school gedurende het
      schooljaar meer toeneemt boven het aantal leerlingen waarnaar de omvang van de formatie wordt bepaald dan een bij
      die algemene maatregel van bestuur aan te geven aantal, de omvang van de formatie voor het onderwijzend personeel
      voor die school overeenkomstig het in die algemene maatregel van bestuur bepaalde wordt verhoogd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel233
  - number: '233.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald in welke gevallen en onder welke voorwaarden meer formatie aan een
      school wordt toegekend dan op grond van het eerste lid is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel233
  - number: '233.4'
    text: |-
      Onze minister kan op verzoek van het bevoegd gezag van een school in andere gevallen dan als bedoeld in het derde
      lid op grond van bijzondere omstandigheden onder door hem te stellen voorwaarden meer formatie aan een school
      toekennen dan op grond van het eerste en derde lid is vastgesteld. Bij ministeriële regeling kunnen termijnen
      worden vastgesteld binnen welke besluiten naar aanleiding van verzoeken als bedoeld in de vorige volzin worden
      genomen. Onze minister kan in verband met de in de eerste volzin bedoelde toekenning een bekostigingsplafond
      instellen. In dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel233
  - number: '233.5'
    text: |-
      Het toekennen van meer formatie als bedoeld in het derde en vierde lid kan geen betrekking hebben op onderwijs in
      allochtone levende talen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel233
  - number: '234.1'
    text: |-
      Grondslag voor de berekening van het aantal leerlingen, bedoeld in artikel 233, is het aantal leerlingen op 1
      oktober van het voorafgaande schooljaar.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel234
  - number: '234.2'
    text: |-
      Voor het schooljaar waarin een nieuwe school wordt geopend en voor het daaropvolgende schooljaar wordt als
      grondslag genomen het aantal leerlingen op 1 oktober, volgende op de opening.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel234
  - number: '235.1'
    text: |-
      De totale omvang van de formatie, bedoeld in artikel 233, die voor een school wordt vastgesteld, is het
      formatiebudget. Indien krachtens artikel 233, eerste lid onder b, kan worden voorzien in formatie voor
      speciale doeleinden, maakt deze formatie uitsluitend deel uit van het formatiebudget indien de desbetreffende
      formatierekeneenheden worden besteed voor die speciale doeleinden. Het formatiebudget wordt in de vorm van
      formatierekeneenheden aan het bevoegd gezag van de school toegekend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel235
  - number: '235.2'
    text: 'Bij algemene maatregel van bestuur wordt een regeling gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel235
  - number: 235.2.a
    text: |-
      het verbruik van formatierekeneenheden door het bevoegd gezag bij het aanstellen van personeel in de onderscheiden
      functies,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel235
  - number: 235.2.b
    text: |-
      de wijziging in het verbruik van de formatierekeneenheden, bedoeld in onderdeel a, op grond van rechtspositionele
      aanspraken van de personeelsleden,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel235
  - number: 235.2.c
    text: |-
      de voorwaarden waaronder het bevoegd gezag formatierekeneenheden kan overdragen aan een andere school, een
      basisschool, een speciale school voor basisonderwijs, dan wel een school voor speciaal onderwijs of voor voortgezet
      speciaal onderwijs of een school of een instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in de
      [Wet op de expertisecentra][ref1] van hetzelfde bevoegd gezag of van een ander bevoegd gezag,


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 235.2.d
    text: |-
      de voorwaarden waaronder het bevoegd gezag recht heeft op de geldswaarde van niet verbruikte formatierekeneenheden,
      waarbij in elk geval wordt bepaald tot welk percentage het bevoegd gezag telkens voor de periode van een schooljaar
      kan besluiten minder formatierekeneenheden te besteden dan voor de school mogelijk zou zijn op grond van het
      beschikbare formatiebudget, en met dien verstande dat in het overleg, bedoeld in artikel 157, onder door Onze
      minister te stellen voorwaarden een hoger percentage kan worden overeengekomen, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel235
  - number: 235.2.e
    text: de verplichte besteding van onderdelen van de formatie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel235
  - number: '235.3'
    text: |-
      Bij ministeriële regeling wordt jaarlijks de geldswaarde, bedoeld in het tweede lid onder d, vastgesteld. Bij
      de vaststelling van het bedrag van de geldswaarde wordt rekening gehouden met de ontwikkeling van de gemiddelde
      personeelslasten van:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel235
  - number: 235.3.a
    text: het personeel, bedoeld in artikel 246, eerste lid onder a, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel235
  - number: 235.3.b
    text: het personeel anders dan bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel235
  - number: '236.1'
    text: |-
      Aan de school wordt in verband met de kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid
      alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de
      [Ziektewet][ref1] bekostiging verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '236.2'
    text: |-
      De omvang van de in het eerste lid bedoelde bekostiging bedraagt een jaarlijks bij ministeriële regeling vast
      te stellen percentage van de bekostiging van de salarissen, bedoeld in artikel 246, derde lid, onderdeel a.
      Bij ministeriële regeling kan het percentage, bedoeld in de eerste volzin, tussentijds worden gewijzigd. De
      ministeriële regeling kan vaststellen welk deel van de bekostiging van de salarissen wordt gehanteerd bij de
      berekening, bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel236
  - number: '237'
    text: |-
      Bij ministeriële regeling kan worden bepaald in welke gevallen en onder welke voorwaarden aan een
      school bekostiging wordt verstrekt in verband met het bestrijden van schoolspecifieke knelpunten in de
      personeelsvoorziening. De omvang van de bekostiging bedraagt een jaarlijks bij ministeriële regeling vast te
      stellen bedrag per formatieplaats.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel237
  - number: '238'
    text: |-
      Wijziging in de besteding van de bekostiging voor schoolspecifieke knelpunten in de personeelsvoorziening mag niet
      leiden tot kosten van werkloosheidsuitkeringen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel238
  - number: '239.1'
    text: |-
      De grondslag van de omvang van de bekostiging voor nascholing ten behoeve van scholen is de formatie berekend op
      grond van artikel 233, eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel239
  - number: '239.2'
    text: Bij ministeriële regeling wordt een bekostigingsbedrag per formatieplaats vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel239
  - number: '240'
    text: |-
      Met inachtneming van artikel 239 verstrekt het Rijk jaarlijks aan het bevoegd gezag van de openbare en bijzondere
      scholen bekostiging ten behoeve van nascholing van het personeel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel240
  - number: '241'
    text: |-
      De bekostiging, bedoeld in artikel 240, wordt besteed aan de kosten van nascholing ten behoeve van het personeel.
      Indien de bekostiging niet volledig is besteed, wordt het resterende bedrag in een fonds ondergebracht. Dit fonds
      mag ten hoogste een bedrag omvatten dat gelijk is aan de bekostiging van de laatste 3 jaren. Niet bestede gelden
      worden voor zover deze gelden het in de vorige volzin bedoelde bedrag overstijgen, onverwijld in 's Rijks kas
      teruggestort.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel241
  - number: '242'
    text: |-
      De gemeente bekostigt aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat is
      onderworpen aan een of meer der in [artikel 220 van de Gemeentewet][ref1] (Stb. 1992, 96) bedoelde belastingen ter
      zake van onroerende zaken het bedrag dat is uitgegeven voor de belastingen met betrekking tot de in de gemeente
      gelegen gebouwen en terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
  - number: '243.1'
    text: |-
      Behoudens het tweede lid, verstrekt het Rijk jaarlijks ten behoeve van de scholen aan het bevoegd gezag bekostiging
      ten behoeve van de materiële instandhouding waarop de programma's van eisen, bedoeld in artikel 228, derde lid,
      betrekking hebben, waarbij voor het bevoegd gezag geldt dat indien toepassing is gegeven aan artikel 232, tweede
      lid, dan wel indien geen overeenkomst als bedoeld in artikel 232, derde of vierde lid tot stand is gekomen, dit
      bevoegd gezag de bekostiging aan de gemeente dan wel aan het desbetreffende bevoegd gezag overdraagt voor zover
      deze de materiële instandhouding verzorgt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel243
  - number: '243.2'
    text: |-
      Grondslag voor de bekostiging van de in het eerste lid bedoelde kosten zijn de voor het desbetreffende jaar
      vastgestelde bedragen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel243
  - number: '243.3'
    text: 'Grondslag voor de bekostiging ten behoeve van de uitgaven voor de voorzieningen, bedoeld in artikel 228, zijn:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel243
  - number: 243.3.a
    text: |-
      de schoolgrootte die normatief wordt bepaald op basis van het op grond van de algemene maatregel van bestuur,
      bedoeld in artikel 188, normatief bepaalde aantal te huisvesten groepen leerlingen naar de maatstaf van het aantal
      leerlingen op 1 oktober van het jaar voorafgaande aan het jaar waarover de bekostiging plaatsvindt, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel243
  - number: 243.3.b
    text: het aantal leerlingen op 1 oktober van het jaar voorafgaande aan het jaar waarover de bekostiging plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel243
  - number: '243.4'
    text: |-
      Voor nieuwe scholen zijn gedurende de periode van 1 augustus tot 1 januari volgend op de opening, grondslag voor de
      bekostiging ten behoeve van de uitgaven voor de voorzieningen, bedoeld in artikel 228:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel243
  - number: 243.4.a
    text: |-
      de schoolgrootte die normatief wordt bepaald op basis van het op grond van de algemene maatregel van bestuur,
      bedoeld in artikel 188, normatief bepaalde aantal te huisvesten groepen leerlingen naar de maatstaf van het aantal
      leerlingen op 1 oktober in die periode, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel243
  - number: 243.4.b
    text: het aantal leerlingen op 1 oktober in die periode.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel243
  - number: '243.5'
    text: |-
      Indien op 16 januari van het jaar waarover de bekostiging plaatsvindt, aanspraak bestond op verhoging van de
      formatie ingevolge [artikel 19 van het Formatiebesluit W.V.O.][ref1], zijn grondslag voor de bekostiging ten
      behoeve van de uitgaven voor de voorzieningen, bedoeld in artikel 228:


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel19
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel243
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '19'
  - number: 243.5.a
    text: |-
      de schoolgrootte die normatief wordt bepaald op basis van het op grond van de algemene maatregel van bestuur,
      bedoeld in artikel 188, normatief bepaalde aantal te huisvesten groepen leerlingen naar de maatstaf van het aantal
      leerlingen op 16 januari van het jaar waarover de bekostiging plaatsvindt, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel243
  - number: 243.5.b
    text: het aantal leerlingen op 16 januari van het jaar waarover de bekostiging plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel243
  - number: '243.6'
    text: |-
      Ingeval een samenvoeging plaatsvindt tussen 1 januari en 1 oktober daaropvolgend, wordt de bekostiging ten behoeve
      van de uitgaven voor de voorzieningen, bedoeld in artikel 228, van alle bij de samenvoeging betrokken scholen
      gehandhaafd tot het einde van het jaar waarin de samenvoeging plaatsvond.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel243
  - number: '243.7'
    text: |-
      Ingeval een samenvoeging plaatsvindt tussen 1 oktober en 1 januari daaropvolgend, wordt de bekostiging ten behoeve
      van de uitgaven voor de voorzieningen, bedoeld in artikel 228, van alle bij de samenvoeging betrokken scholen
      gehandhaafd tot het einde van het jaar waarin de samenvoeging plaatsvond, en wordt de bekostiging van de uitgaven
      voor die voorzieningen voor het jaar volgend op de samenvoeging, gebaseerd op de bekostiging van de uitgaven voor
      die voorzieningen van alle bij de samenvoeging betrokken scholen, zoals die golden op 1 oktober van het jaar van
      samenvoeging.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel243
  - number: '244.1'
    text: |-
      Jaarlijks voor 1 maart kan Onze minister verhoging van de bekostiging worden gevraagd, indien op grond van
      bijzondere omstandigheden van de school in dat jaar het totale bedrag niet voldoende is voor de noodzakelijke
      uitgaven van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel244
  - number: '244.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid, kan slechts worden gedaan door het bevoegd gezag voor zover het betreft
      de materiële instandhouding waarop de programma's van eisen, bedoeld in artikel 229, eerste lid, betrekking
      hebben. In afwijking van de vorige volzin kan ingeval artikel 232, tweede, derde of vierde lid, is toegepast, het
      bevoegd gezag dat dan wel de gemeente die de materiële instandhouding geheel of gedeeltelijk verzorgt, het verzoek
      indienen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel244
  - number: '244.3'
    text: 'Onze minister wijst het verzoek in elk geval af indien:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel244
  - number: 244.3.a
    text: |-
      in het jaar waarvoor de programma's van eisen zijn vastgesteld, het totaal van de noodzakelijke uitgaven voor de
      materiële instandhouding van de school niet ten minste 5% meer zal bedragen dan het totaal van de uit 's Rijks kas
      daarvoor te verstrekken inkomsten,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel244
  - number: 244.3.b
    text: |-
      de bijzondere omstandigheden het gevolg zijn van een bij algemene maatregel van bestuur aan te geven omstandigheid
      of afwijking van de omvang van de componenten van de voorziening ten aanzien waarvan de bijzondere omstandigheden
      zouden bestaan,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel244
  - number: 244.3.c
    text: |-
      de bijzondere omstandigheid het gevolg is van een verschil tussen het prijsniveau in enig jaar en de op grond van
      artikel 228 aangepaste bedragen, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel244
  - number: 244.3.d
    text: |-
      het bevoegd gezag dat of de gemeente die het verzoek heeft ingediend, niet aantoont dat het de bijzondere
      omstandigheden niet op enigerlei wijze had kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel244
  - number: '244.4'
    text: |-
      Een verzoek als bedoeld in het eerste lid gaat vergezeld van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], van de juistheid van de gegevens die bij
      het verzoek zijn gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '244.6'
    text: |-
      Onze Minister besluit binnen drie maanden. Indien technisch onderzoek zulks noodzakelijk maakt, kan Onze Minister
      deze termijn eenmaal met ten hoogste zes maanden verdagen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel244
  - number: '244.7'
    text: |-
      Onze minister kan in verband met de in het eerste lid bedoelde verhoging een bekostigingsplafond instellen. In dat
      geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel244
  - number: '245.1'
    text: |-
      De gemeente verstrekt jaarlijks aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat
      eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening op het grondgebied van de gemeente
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel245
  - number: 245.1.a
    text: een bekostigingsbedrag dat wordt bepaald ingevolge artikel 231 en het derde lid, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel245
  - number: 245.1.b
    text: |-
      voor zover het gebruik van die ruimte ontoereikend is een overeenkomstig het tweede lid vast te stellen
      bekostigingsbedrag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel245
  - number: '245.2'
    text: |-
      Voor zover geen ruimte ter beschikking is gesteld als bedoeld in artikel 231, eerste lid onder a, verstrekt de
      gemeente jaarlijks aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat geen eigenaar
      is van een ruimte voor het onderwijs in lichamelijke oefening een bekostigingsbedrag dat wordt bepaald ingevolge
      artikel 231, eerste lid onder b, en derde lid onder a, en het derde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel245
  - number: '245.3'
    text: |-
      Het aantal groepen leerlingen wordt voor scholen, niet zijnde instellingen, berekend overeenkomstig artikel 243,
      vierde lid onder a, vijfde lid onder a, en zesde lid onder a, en de ter uitvoering daarvan vastgestelde algemene
      maatregel van bestuur, met dien verstande dat groepen waarvoor van rijkswege bekostiging wordt verstrekt voor de
      kosten van de materiële instandhouding van een speellokaal niet in aanmerking worden genomen. Het aantal groepen
      leerlingen wordt voor instellingen berekend op een bij algemene maatregel van bestuur te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel245
  - number: '246.1'
    text: |-
      Met inachtneming van de artikelen 233 tot en met 235, bekostigt het Rijk aan het bevoegd gezag van de openbare en
      bijzondere scholen:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel246
  - number: 246.1.a
    text: de uitgaven voor het personeel dat is aangesteld ten laste van het formatiebudget,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel246
  - number: 246.1.b
    text: |-
      de geldswaarde van de, met inachtneming van het bepaalde krachtens artikel 235, tweede lid onder d, niet verbruikte
      formatierekeneenheden, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel246
  - number: 246.1.c
    text: de bekostiging, bedoeld in artikel 236, eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel246
  - number: '246.2'
    text: |-
      Indien op grond van artikel 235, tweede lid onder c, formatierekeneenheden zijn overgedragen, wordt de bekostiging,
      bedoeld in het eerste lid, verstrekt aan het bevoegd gezag van de school waaraan de formatierekeneenheden zijn
      overgedragen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel246
  - number: '246.3'
    text: |-
      De bekostiging van de uitgaven, bedoeld in het eerste lid onder a, omvat de uitgaven waartoe het bevoegd gezag
      krachtens wettelijk voorschrift is verplicht, ter zake van:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel246
  - number: 246.3.a
    text: salarissen, toelagen, uitkeringen;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel246
  - number: 246.3.b
    text: wettelijk verschuldigde en niet verhaalbare premies.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel246
  - number: '247.1'
    text: |-
      Op de bekostiging van de uitgaven voor het personeel worden in mindering gebracht de salarissen, toelagen,
      uitkeringen of andere bijdragen waarop aanspraak wordt gemaakt door personeel dat is benoemd met voorbijgaan van
      personeel dat een gelijksoortige functie uitoefent of heeft uitgeoefend aan een gelijksoortige school van het
      bevoegd gezag, voor zover laatstbedoeld personeel
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel247
  - number: 247.1.a
    text: |-
      gebruik maakt van de krachtens artikel 153, tweede lid, vastgestelde regeling voor onvrijwillige taakvermindering,
      of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel247
  - number: 247.1.b
    text: |-
      voor zover zich geen geval voordoet als bedoeld onder a, in het genot is van wachtgeld of van een andere
      ontslaguitkering en direct aan die ontslaguitkering voorafgaand langer dan een jaar onafgebroken in dienst is
      geweest van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel247
  - number: '247.2'
    text: |-
      Op de bekostiging van de uitgaven voor het personeel worden eveneens in mindering gebracht de salarissen, toelagen,
      uitkeringen of andere bijdragen waarop aanspraak wordt gemaakt door personeel dat langer dan 1 jaar anders dan
      wegens vervanging, dan wel een benoeming met toepassing van artikel 126, zevende lid, tweede volzin, onafgebroken,
      met een onderbreking van een week of minder, dan wel met een of meer onderbrekingen gedurende een schoolvakantie,
      in een gelijksoortige functie in tijdelijke dienst verbonden is geweest aan een school van het bevoegd gezag. De
      termijn van 1 jaar kan ingeval van een of meer ziekteperioden van langer dan 4 weken met deze ziekteperioden worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel247
  - number: '247.3'
    text: |-
      Op de bekostiging worden eveneens in mindering gebracht de kosten van werkloosheidsuitkeringen, suppleties inzake
      arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan
      op grond van de [Ziektewet][ref1]. De eerste volzin is niet van toepassing, indien de rechtspersoon, bedoeld in
      artikel 285, op een daartoe strekkend verzoek van het bevoegd gezag, voorafgaand aan het ontslag heeft ingestemd
      met het ten laste van die rechtspersoon brengen van de kosten van uitkeringen of suppleties als bedoeld in de
      eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel247
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '247.4'
    text: |-
      Het eerste lid is eveneens van toepassing, indien de benoeming heeft plaatsgevonden in aansluiting op een benoeming
      in tijdelijke dienst in dezelfde functie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel247
  - number: '247.5'
    text: |-
      Met gewezen personeel dat in het genot is van wachtgeld of van een andere ontslaguitkering als bedoeld in het
      eerste lid onder b, wordt gelijk gesteld personeel aan wie op grond van het leerlingenverloop op of na 1 februari
      ontslag is of zal worden aangezegd, op grond van welk ontslag recht op wachtgeld of een andere ontslaguitkering zou
      kunnen ontstaan. In afwijking van de eerste volzin kan voor een periode tot uiterlijk de datum van ingang van het
      recht op wachtgeld of op een andere ontslaguitkering in een vacature worden voorzien zonder dat de vermindering,
      bedoeld in het eerste lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel247
  - number: '247.6'
    text: |-
      Bij ministeriële regeling wordt bepaald in welke gevallen geen vermindering als bedoeld in het eerste en tweede
      lid plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel247
  - number: '247.7'
    text: |-
      Onze minister kan in andere gevallen dan voorzien in de ministeriële regeling bedoeld in het zesde lid, wegens
      gewichtige redenen op verzoek van het bevoegd gezag besluiten dat de vermindering van de bekostiging, bedoeld in
      het eerste lid, niet zal plaatsvinden. Onze minister besluit binnen 4 maanden na ontvangst van het verzoek. Indien
      het besluit niet binnen 4 maanden kan worden genomen, stelt Onze minister de verzoeker daarvan in kennis en noemt
      hij daarbij een redelijke termijn waarop het besluit wel tegemoet kan worden gezien. Uitsluitend op grond van door
      het bevoegd gezag aangevoerde bijzondere omstandigheden kan Onze minister bepalen dat het besluit, bedoeld in de
      eerste volzin, betrekking heeft of mede betrekking heeft op een periode voorafgaand aan de datum waarop het bevoegd
      gezag het in de eerste volzin bedoelde verzoek heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel247
  - number: '247.8'
    text: Onze minister kan projecten aanwijzen waarvoor het tweede lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel247
  - number: '248.1'
    text: |-
      Artikel 247 is van overeenkomstige toepassing indien de rechtspersoon, bedoeld in artikel 187, personeel benoemt
      met voorbijgaan van gewezen personeel als bedoeld in artikel 247, eerste en vijfde lid, van de rechtspersoon
      of van een bevoegd gezag waarvoor diensten worden verricht, dan wel niet handelt overeenkomstig het bepaalde in
      laatstgenoemde artikelleden. Van het gewezen personeel, bedoeld in de eerste volzin, is uitgezonderd het personeel
      van het bevoegd gezag waarvoor diensten worden verricht, waarvan de dienstbetrekking is beëindigd op een tijdstip
      dat meer dan twee jaar ligt voor de aanvang van de dienstverlening.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel248
  - number: '248.2'
    text: |-
      In geval van toepassing van het eerste lid wordt het in mindering te brengen bedrag in gelijke mate verdeeld over
      de scholen waarvoor diensten worden verricht.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel248
  - number: '248.3'
    text: Artikel 247 is eveneens van overeenkomstige toepassing
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel248
  - number: 248.3.a
    text: |-
      indien een bevoegd gezag waarvoor diensten worden verricht, personeel benoemt met voorbijgaan van gewezen personeel
      van de rechtspersoon, bedoeld in artikel 187, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel248
  - number: 248.3.b
    text: |-
      indien een bevoegd gezag waarvoor geen diensten meer worden verricht, in het tijdvak van vijf jaar na beëindiging
      van de dienstverlening personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel248
  - number: '249.1'
    text: |-
      Indien in een gemeente uitsluitend een of meer andere rechtspersonen dan de gemeente openbare scholen in stand
      houden waar een bepaalde soort speciaal onderwijs of een bepaalde soort voortgezet speciaal onderwijs wordt
      gegeven dan wel dergelijke scholen ontbreken en de gemeente uitgaven wil doen voor dat onderwijs welke niet door
      het Rijk worden bekostigd, stelt de gemeenteraad onverminderd de artikelen 268, eerste lid, en 272, eerste lid,
      bij verordening een regeling daarvoor vast en zijn de artikelen 251 tot en met 257 voor dat onderwijs niet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel249
  - number: '249.2'
    text: |-
      De regeling, bedoeld in het eerste lid, maakt geen onderscheid tussen openbaar en bijzonder onderwijs en voorziet
      in een behandeling van scholen naar dezelfde maatstaf.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel249
  - number: '249.3'
    text: |-
      De regeling, bedoeld in het eerste lid, bevat in elk geval de voorzieningen die door het bevoegd gezag van een in
      de gemeente gelegen, niet door de gemeente in stand gehouden school kunnen worden aangevraagd en de procedure voor
      het doen van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel249
  - number: '249.4'
    text: |-
      De gemeenteraad kan besluiten dat burgemeester en wethouders de regeling, bedoeld in het eerste lid, tijdelijk
      kunnen aanvullen met nieuwe voorzieningen. De aanvulling wordt binnen 1 week aan de bevoegde gezagsorganen van de
      niet door de gemeente in stand gehouden scholen gezonden. Binnen 12 weken na de totstandkoming van de aanvulling
      wordt deze voorgelegd aan de gemeenteraad en besluit de gemeenteraad over de bekrachtiging ervan. Indien de
      gemeenteraad niet binnen 12 weken heeft besloten, wordt de aanvulling gelijkgesteld met een aanvulling die is
      bekrachtigd. Een afwijzing van de aanvulling door de gemeenteraad heeft geen gevolgen voor aanvragen waarop reeds
      is besloten of die reeds zijn ingediend en die voorzieningen betreffen waarop de aanvulling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel249
  - number: '249.5'
    text: |-
      [Artikel 8:2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de regeling, bedoeld in het eerste
      lid, dan wel een wijziging daarvan. In afwijking van [artikel 8:1 van de Algemene wet bestuursrecht][ref2] kan
      tegen een aanvulling als bedoeld in het vierde lid geen beroep worden ingesteld zolang de gemeenteraad deze nog
      niet heeft bekrachtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel249
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '249.6'
    text: |-
      Voor de toepassing van dit artikel wordt een nevenvestiging aangemerkt als een nevenvestiging die is gelegen in
      de gemeente van de hoofdvestiging. De gemeenteraad kan besluiten dat in de gemeente gelegen nevenvestigingen van
      scholen waarvan de hoofdvestiging is gelegen in een andere gemeente in afwijking van de eerste volzin in aanmerking
      komen voor een of meer van de in de regeling genoemde voorzieningen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel249
  - number: '249.7'
    text: |-
      Burgemeester en wethouders maken jaarlijks in een van overheidswege uitgegeven blad of een dag-, nieuws- of huis-
      aan-huisblad, dan wel op een andere geschikte wijze, een overzicht bekend van de op grond van de regeling, bedoeld
      in het eerste lid, toegekende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel249
  - number: '250.1'
    text: |-
      Indien een gemeente zelf een of meer openbare scholen in stand houdt en zij uitgaven wil doen voor het onderwijs
      welke niet door het Rijk worden bekostigd, kan de gemeenteraad onverminderd de artikelen 268, eerste lid, en 272,
      eerste lid, daarvoor bij verordening een regeling vaststellen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel250
  - number: '250.2'
    text: Artikel 249, tweede tot en met zevende lid, is van toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel250
  - number: '251.1'
    text: |-
      Indien een gemeente ten behoeve van een of meer door haar in stand gehouden scholen meer uitgaven doet voor
      het personeel en de materiële instandhouding dan door het Rijk worden bekostigd, wordt met inachtneming van de
      artikelen 251 tot en met 257 aan het bevoegd gezag van de in die gemeente gevestigde niet door de gemeente in stand
      gehouden scholen om de vijf jaar een overschrijdingsbedrag verstrekt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel251
  - number: '251.2'
    text: |-
      Voor de toepassing van de artikelen 251 tot en met 257 worden uitgaven ten behoeve van een nevenvestiging
      aangemerkt als uitgaven ten behoeve van de hoofdvestiging van de school waaraan de nevenvestiging is verbonden.
      Indien ten behoeve van een school of nevenvestiging uitgaven worden gedaan door meer dan één gemeente, worden
      deze uitgaven aangemerkt als uitgaven van de gemeente op wier grondgebied de hoofdvestiging is gelegen. In het
      geval, bedoeld in de vorige volzin, worden de besluiten ingevolge het vierde lid en de artikelen 252 tot en met
      257 genomen door laatstbedoelde gemeente en hebben deze mede betrekking op de uitgaven van de andere gemeente of
      gemeenten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel251
  - number: '251.3'
    text: |-
      Voor de toepassing van de artikelen 251 tot en met 257 wordt een nevenvestiging in een andere gemeente dan
      waarin de hoofdvestiging is gelegen, aangemerkt als een nevenvestiging die is gelegen in de gemeente van de
      hoofdvestiging.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel251
  - number: '251.4'
    text: |-
      De gemeenteraad kan in overeenstemming met het bevoegd gezag van een niet door de gemeente in stand gehouden
      school besluiten dat met betrekking tot een of meer scholen van dat bevoegd gezag uitgaven die de gemeente doet
      ten behoeve van een door haar in stand gehouden school buiten beschouwing worden gelaten bij het vaststellen van de
      bedragen, bedoeld in de artikelen 252 en 253.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel251
  - number: '252.1'
    text: |-
      De gemeenteraad stelt jaarlijks vast in welke mate zij ten behoeve van de door de gemeente in stand gehouden
      scholen meer dan wel minder uitgaven zal doen voor het personeel en de materiële instandhouding dan door het
      Rijk worden bekostigd. Deze vaststelling geschiedt voor het komende begrotingsjaar en het resterende deel van het
      vijfjarig tijdvak, bedoeld in artikel 251, eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel252
  - number: '252.2'
    text: |-
      Indien voor het komende begrotingsjaar meer uitgaven zullen worden gedaan voor het personeel en de materiële
      instandhouding dan door het Rijk worden bekostigd, verlenen burgemeester en wethouders in dat begrotingsjaar aan
      het bevoegd gezag van de niet door de gemeente in stand gehouden scholen in de gemeente een voorschot op het te
      verwachten overschrijdingsbedrag, bedoeld in artikel 251, eerste lid. Indien uit het besluit van de gemeenteraad,
      bedoeld in het eerste lid, blijkt dat de hiervoor bedoelde meer-uitgaven in de resterende jaren van het vijfjarig
      tijdvak geheel of ten dele worden gecompenseerd door minder uitgaven, wordt hiermee rekening gehouden bij de
      bepaling van de hoogte van het voorschot.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel252
  - number: '252.3'
    text: |-
      Indien uit de jaarlijkse voorlopige vaststelling van de bedragen, bedoeld in artikel 253, eerste lid, blijkt
      dat, in afwijking van hetgeen is vastgesteld bij het besluit van de gemeenteraad, bedoeld in het eerste lid,
      meer uitgaven zijn gedaan voor personeel en materiële instandhouding dan door het Rijk worden bekostigd, verlenen
      burgemeester en wethouders alsnog een voorschot aan het bevoegd gezag van de niet door de gemeente in stand
      gehouden scholen in de gemeente. Bij de bepaling van de hoogte van het voorschot is de tweede volzin van het tweede
      lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel252
  - number: '253.1'
    text: |-
      Indien een gemeente een of meer scholen in stand houdt, stelt de gemeenteraad onderscheiden per schoolsoort
      jaarlijks voorlopig vast:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: 253.1.a
    text: het totaal van de bedragen
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: 253.1.a.1°
    text: die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de personeelskosten, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: 253.1.a.2°
    text: voor niet verbruikte formatierekeneenheden voor zover die in het voorafgaande kalenderjaar zijn uitgegeven,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: 253.1.b
    text: het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de nascholing,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: 253.1.c
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de materiële
      instandhouding,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: 253.1.d
    text: het totaal van de ontvangsten
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: 253.1.d.1°
    text: bedoeld in artikel 246, derde lid, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: 253.1.d.2°
    text: voor niet verbruikte formatierekeneenheden, bedoeld in artikel 246, eerste lid onder b,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: 253.1.e
    text: |-
      het totaal van de ontvangsten dat is gebaseerd op de bedragen die krachtens artikel 240 voor nascholing voor het
      kalenderjaar zijn vastgesteld,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: 253.1.f
    text: |-
      het totaal van de ontvangsten dat is gebaseerd op de bedragen die krachtens artikel 228 voor de voorzieningen voor
      de materiële instandhouding voor dat kalenderjaar zijn vastgesteld,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: 253.1.g
    text: |-
      het totaal van de aanvullende ontvangsten waaronder worden verstaan de bedragen die krachtens artikel 244 voor de
      voorzieningen ten behoeve van de materiële instandhouding voor dat kalenderjaar zijn vastgesteld,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: 253.1.h
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de instandhouding
      van een rechtspersoon als bedoeld in artikel 187, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: 253.1.i
    text: een staat van voorzieningen die zijn ingesteld ten behoeve van de door de gemeente in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: '253.2'
    text: |-
      Indien de gemeente een deel van de ontvangsten bedoeld in het eerste lid onder d 1° of d 2°, of een deel van de
      ontvangsten, bedoeld in dat lid onder e, f en g, toevoegt aan een voorziening, wordt dat deel aangemerkt als een
      uitgave als bedoeld in dat lid onder a 1° dan wel a 2°, onderscheidenlijk als een uitgave als bedoeld in dat lid
      onder b, c en h. Indien de gemeente ten behoeve van de personeelskosten, de nascholingskosten, de kosten voor
      materiële instandhouding of de kosten voor de instandhouding van een rechtspersoon als bedoeld in artikel 187,
      bedragen aan een voorziening onttrekt, worden deze aangemerkt als ontvangsten als bedoeld in het eerste lid onder d
      2°, e of f.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: '253.3'
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder c, f, g en h, worden buiten beschouwing
      gelaten de uitgaven en ontvangsten voor:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: 253.3.a
    text: administratie, beheer en bestuur, bedoeld in artikel 229, eerste lid onder e,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: 253.3.b
    text: de materiële instandhouding van het onderwijs in lichamelijke oefening en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: 253.3.c
    text: de materiële instandhouding in verband met de toepassing van de artikelen 268, eerste lid, en 272, eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: '253.4'
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid onder a, worden buiten beschouwing gelaten de
      uitgaven ten behoeve van personeel dat door de gemeente met toepassing van artikel 268, eerste lid, dan wel
      artikel 272, eerste lid, aan een openbare school wordt verbonden. Bij het vaststellen van de bedragen, bedoeld
      in het eerste lid onder a, b, c en h, worden voorts buiten beschouwing gelaten de uitgaven die worden gedekt
      door ontvangsten van bedragen die door derden zijn betaald, de uitgaven die worden gedekt door ontvangsten op
      grond van een besluit als bedoeld in artikel 249, zesde lid, tweede volzin, en de uitgaven voor de voorzieningen
      waarvoor het bevoegd gezag van een niet door de gemeente in stand gehouden school op grond van de regeling, bedoeld
      in artikel 250, eerste lid, een aanvraag bij de gemeente kon indienen en wel gedurende de periode waarvoor een
      dergelijke aanvraag kon worden gedaan. 4a. Bij het vaststellen van de bedragen bedoeld in het eerste lid, onder
      c, mogen voorzieningen die volgens de desbetreffende rijksbekostiging een afschrijvingstermijn van ten minste 20
      jaar hebben, over ten hoogste 20 jaar worden aangemerkt als jaarlijkse uitgave op grond van rente op basis van een
      fictieve lening met een looptijd van ten hoogste 20 jaar en een lineaire aflossing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: '253.5'
    text: |-
      Indien de gemeente een deel van de bekostiging voor niet verbruikte formatierekeneenheden overdraagt aan een ander
      bevoegd gezag, wordt dat deel aangemerkt als een uitgave als bedoeld in het eerste lid onder a 2. Indien door een
      ander bevoegd gezag een deel van de bekostiging voor niet verbruikte formatierekeneenheden aan de gemeente wordt
      overgedragen, wordt dat deel aangemerkt als een ontvangst als bedoeld in het eerste lid onder d 2° en e.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: '253.6'
    text: |-
      Om de vijf jaar stelt de gemeenteraad voorlopig vast het totaal van de vastgestelde uitgaven en ontvangsten in de
      voorafgaande vijf kalenderjaren, zoals in het eerste tot en met vijfde lid is aangegeven. Indien de uitgaven hoger
      zijn dan de ontvangsten, bepaalt de gemeenteraad tevens het bedrag van de overschrijding. Indien een gemeente vanaf
      een tijdstip binnen een periode van vijf jaar als bedoeld in de eerste volzin geen school in stand houdt, stelt
      de gemeenteraad in afwijking van die volzin zo spoedig mogelijk na dat tijdstip voorlopig vast het totaal van de
      vastgestelde uitgaven en ontvangsten in het aan dat tijdstip voorafgaande deel van de periode van vijf jaar, zoals
      in het eerste tot en met vijfde lid is aangegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: '253.7'
    text: |-
      Na sluiting van de rekening van de gemeente stelt de gemeenteraad onderscheiden per schoolsoort de in het eerste
      en zesde lid bedoelde bedragen, zo nodig gewijzigd, vast. In het geval, bedoeld in het zesde lid, tweede volzin,
      drukt de gemeenteraad vervolgens het bedrag van de overschrijding uit in een percentage van het totaal van de
      ontvangsten, bedoeld in het eerste lid onder d tot en met g. Het percentage wordt afgerond tot twee decimalen.
      Afronding naar beneden vindt plaats indien de derde decimaal kleiner is dan 5, en naar boven indien deze decimaal
      ten minste 5 bedraagt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel253
  - number: '254.1'
    text: |-
      In het jaar volgend op de definitieve vaststelling, bedoeld in artikel 253, zevende lid, wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door de gemeente in stand gehouden
      school, die gedurende een of meer jaren van het desbetreffende tijdvak in de gemeente was gevestigd, aanspraak
      heeft. Dit overschrijdingsbedrag wordt vastgesteld door het percentage, bedoeld in artikel 253, zevende lid, te
      vermenigvuldigen met het totaal van de ontvangsten van een niet door de gemeente in stand gehouden school dat is
      gebaseerd op de bedragen die krachtens de artikelen 228 en 246 voor het desbetreffende tijdvak zijn vastgesteld.
      Bij het vaststellen van het totaal van de ontvangsten, bedoeld in de tweede volzin, blijven buiten beschouwing de
      ontvangsten op grond van de programma's van eisen voor administratie, beheer en bestuur, bedoeld in artikel 229,
      eerste lid onder e, de ontvangsten voor de materiële instandhouding van het onderwijs in lichamelijke oefening, en
      de ontvangsten en in verband met de toepassing van de artikelen 268, eerste lid, en 272, eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel254
  - number: '254.2'
    text: |-
      Indien aan het bevoegd gezag van een niet door de gemeente in stand gehouden school een deel van de bekostiging
      voor niet verbruikte formatierekeneenheden is overgedragen door een ander bevoegd gezag, wordt bij het vaststellen
      van het totaal van de ontvangsten, bedoeld in het eerste lid, tweede volzin, dat deel aangemerkt als ontvangsten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel254
  - number: '254.3'
    text: |-
      Indien de gemeente voor een niet door de gemeente in stand gehouden school het deel van de materiële instandhouding
      waarop de programma's van eisen, bedoeld in artikel 229, eerste lid onder a, b en c, betrekking hebben, geheel of
      gedeeltelijk verzorgt, wordt een overeenkomstig deel van de ontvangsten in mindering gebracht op het totaal van de
      ontvangsten voor de betrokken school waarover ingevolge het eerste lid het overschrijdingsbedrag wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel254
  - number: '254.4'
    text: |-
      Voor de vaststelling bedoeld in artikel 253, eerste en zevende lid, en artikel 254, eerste lid, worden met
      betrekking tot een school waaraan een of meer afdelingen zijn verbonden, de bedragen die voor een zodanige
      school, de afdeling of afdelingen daaronder begrepen, zijn uitgegeven dan wel ontvangen, toegerekend aan de
      school, onderscheidenlijk de afdeling of afdelingen, naar rato van het aantal leerlingen dat in het desbetreffende
      kalenderjaar in aanmerking kwam voor het volgen van onderwijs aan de school, onderscheidenlijk de desbetreffende
      afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel254
  - number: '254.5'
    text: |-
      Indien een gemeente gedurende een gedeelte van het desbetreffende tijdvak een of meer scholen in stand houdt,
      wordt voor het vaststellen van het overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het totaal van
      de ontvangsten van een niet door de gemeente in stand gehouden school over een overeenkomstig gedeelte van het
      desbetreffende tijdvak.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel254
  - number: '256'
    text: |-
      Aan het bevoegd gezag van de niet door de gemeente in stand gehouden scholen wordt een afschrift gezonden van
      de besluiten van de gemeenteraad tot vaststelling van de mate waarin meer dan wel minder uitgaven zullen worden
      gedaan, bedoeld in artikel 252, eerste lid, tot verlening van het voorschot, bedoeld in artikel 252, tweede of
      derde lid, en tot voorlopige en definitieve vaststelling van het overschrijdingsbedrag, bedoeld in artikel 253,
      zesde en zevende lid. Daarbij is opgenomen een staat van voorzieningen als bedoeld in artikel 253, eerste lid
      onder i, waarin per kalenderjaar wordt aangegeven het verloop van de toevoegingen en de onttrekkingen aan de
      voorzieningen. De toezending geschiedt binnen 2 weken na de dag waarop de gemeenteraad een besluit als bedoeld in
      de eerste volzin heeft genomen. Het bevoegd gezag van een niet door de gemeente in stand gehouden school kan tegen
      een besluit als bedoeld in de eerste volzin administratief beroep instellen bij gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel256
  - number: '257'
    text: |-
      Grondslag voor de berekening van het aantal leerlingen, bedoeld in artikel 254, vierde en vijfde lid, is het aantal
      leerlingen op 1 oktober voorafgaande aan het desbetreffende kalenderjaar. Voor het kalenderjaar waarin een nieuw
      opgerichte school wordt geopend, wordt als grondslag genomen het aantal leerlingen op de laatste dag van de tweede
      maand volgende op die der opening.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel257
  - number: '258.1'
    text: |-
      Het bevoegd gezag van een school besteedt de door het Rijk verstrekte bekostiging, voor zover het niet betreft de
      bekostiging bedoeld in het tweede lid, ten behoeve van die school met inachtneming van het bepaalde in artikel 259.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel258
  - number: '258.2'
    text: |-
      Het bevoegd gezag van een school besteedt de door het Rijk verstrekte bekostiging, bedoeld in artikel 243, ten
      behoeve van de scholen van dat bevoegd gezag. Onder scholen als bedoeld in de vorige volzin, worden verstaan
      scholen in de zin van deze wet, de [Wet op het primair onderwijs][ref1] en de [Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel258
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: '259.1'
    text: |-
      De bekostiging, bedoeld in artikel 246, eerste lid onder a, wordt besteed aan de kosten van het personeel dat is
      aangesteld ten laste van het formatiebudget.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel259
  - number: '259.2'
    text: De bekostiging, bedoeld in artikel 246, eerste lid onder b, wordt besteed aan personele uitgaven.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel259
  - number: '260.1'
    text: |-
      De op grond van artikel 249 of artikel 250 verstrekte bekostiging wordt besteed aan het doel waarvoor zij zijn
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel260
  - number: '260.2'
    text: De verstrekte overschrijdingsbedragen worden besteed ten behoeve van de scholen van een bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel260
  - number: '261.1'
    text: |-
      Indien het bevoegd gezag van een school in strijd handelt met het bepaalde bij of krachtens dit deel, kan Onze
      minister bepalen dat de bekostiging, voorschotten daaronder begrepen, geheel of gedeeltelijk wordt ingehouden dan
      wel opgeschort.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel261
  - number: '261.2'
    text: |-
      Onze minister kent de bekostiging wederom toe, indien blijkt dat de reden voor de toepassing van het eerste lid
      is vervallen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel261
  - number: '261.3'
    text: |-
      Afschrift van zijn besluit zendt Onze minister aan gedeputeerde staten en, indien het een bijzondere school
      betreft, aan burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel261
  - number: '262.1'
    text: |-
      De bekostiging van een bijzondere school wordt beëindigd, indien het aantal leerlingen vastgesteld volgens artikel
      266, gedurende 2 achtereenvolgende schooljaren in elk van die jaren minder heeft bedragen dan 29 leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel262
  - number: '262.2'
    text: Het eerste lid is niet van toepassing op de eerste 5 volledige schooljaren van de bekostiging van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel262
  - number: '262.3'
    text: |-
      Onze minister kan op verzoek van het bevoegd gezag, burgemeester en wethouders van de betrokken gemeente gehoord,
      besluiten dat, in afwijking van het eerste lid, de bekostiging wordt voortgezet indien aan de school behoefte
      bestaat. Tevens hoort Onze minister gedeputeerde staten van de betrokken provincie. Het verzoek wordt ingediend
      voor 16 oktober van het schooljaar volgend op de 2 achtereenvolgende schooljaren, bedoeld in de aanhef van het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel262
  - number: '262.4'
    text: |-
      Het besluit van Onze minister op het verzoek, bedoeld in het derde lid, wordt genomen voor 16 februari volgend
      op de datum 16 oktober genoemd in het derde lid. Indien Onze minister niet voor 16 februari heeft besloten, wordt
      het verzoek geacht te zijn ingewilligd. Een besluit van Onze minister dat de bekostiging wordt voortgezet, geldt
      telkens voor ten hoogste 3 schooljaren.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel262
  - number: '262.5'
    text: |-
      De beëindiging van de bekostiging geschiedt met ingang van 1 augustus van het tweede schooljaar volgend op de
      2 achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid, tenzij door Onze minister bij zijn
      afwijzing van het verzoek, bedoeld in het derde lid, of bij een in beroep gegeven uitspraak anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel262
  - number: '262.6'
    text: |-
      Van zijn besluit en van de uitspraak in beroep wordt door Onze Minister mededeling gedaan door toezending van een
      afschrift aan gedeputeerde staten en aan burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel262
  - number: '262.7'
    text: |-
      Indien het aantal leerlingen van de betrokken school vastgesteld volgens artikel 266 in het schooljaar volgend op
      de twee achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid, gelijk is aan of meer bedraagt dan
      het op grond van het eerste lid voor die school geldende aantal, wordt de bekostiging niet beëindigd op grond van
      dit artikel. De procedures die in werking zijn gesteld op grond van het derde tot en met het zesde lid, eindigen
      van rechtswege en besluiten, genomen op grond van het derde tot en met het zesde lid, vervallen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel262
  - number: '263.1'
    text: |-
      De gemeenteraad besluit, behoudens het bepaalde in het derde lid, tot opheffing van een openbare school indien het
      aantal leerlingen vastgesteld volgens artikel 266, gedurende 2 achtereenvolgende schooljaren in elk van die jaren
      minder heeft bedragen dan 29 leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel263
  - number: '263.2'
    text: Het eerste lid is niet van toepassing op de eerste 5 volledige schooljaren van de bekostiging van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel263
  - number: '263.3'
    text: |-
      In de gevallen, genoemd in het eerste lid, besluit de gemeenteraad tot instandhouding van de school indien deze
      noodzakelijk is om voldoende te voorzien in de behoefte aan openbaar onderwijs. Dit besluit wordt genomen voor 16
      oktober van het schooljaar volgend op de 2 achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel263
  - number: '263.4'
    text: |-
      De besluiten van de gemeenteraad, bedoeld in het eerste en derde lid, worden onderworpen aan de goedkeuring
      van gedeputeerde staten. Gedeputeerde staten onthouden hun goedkeuring ten aanzien van besluiten op grond van
      het eerste lid, indien ten gevolge van de opheffing van de school, afhankelijk van de schoolsoort, regionaal,
      provinciaal dan wel landelijk niet meer voldoende zou zijn voorzien in de behoefte aan openbaar onderwijs.
      Gedeputeerde staten onthouden hun goedkeuring ten aanzien van besluiten op grond van het derde lid, indien
      instandhouding van de school, afhankelijk van de schoolsoort, regionaal, provinciaal dan wel landelijk niet
      noodzakelijk is om voldoende te voorzien in de behoefte aan openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel263
  - number: '263.5'
    text: |-
      Gedeputeerde staten besluiten voor 16 februari volgend op de datum 16 oktober, genoemd in het eerste lid, laatste
      volzin, en derde lid, laatste volzin. Indien gedeputeerde staten niet voor 16 februari hebben besloten, wordt
      het desbetreffende besluit van de gemeenteraad geacht te zijn goedgekeurd. Het onthouden van de goedkeuring
      van gedeputeerde staten ten aanzien van het besluit van de gemeenteraad, bedoeld in het eerste lid, dan wel de
      goedkeuring van gedeputeerde staten ten aanzien van het besluit van de gemeenteraad, bedoeld in het derde lid,
      geldt telkens voor ten hoogste 3 schooljaren.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel263
  - number: '263.6'
    text: |-
      De besluiten van de gemeenteraad, van gedeputeerde staten, bedoeld in het eerste en het derde tot en met vijfde
      lid, worden bekendgemaakt door een openbare kennisgeving binnen 2 weken na de datum waarop het besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel263
  - number: '263.7'
    text: |-
      De opheffing geschiedt met ingang van 1 augustus van het tweede schooljaar volgend op de 2 achtereenvolgende
      schooljaren, bedoeld in de aanhef van het eerste lid, tenzij door gedeputeerde staten bij hun besluit, of bij een
      in beroep gegeven uitspraak anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel263
  - number: '263.8'
    text: |-
      Indien het aantal leerlingen van de betrokken school vastgesteld volgens artikel 266 in het schooljaar volgend op
      de 2 achtereenvolgende schooljaren, bedoeld in de aanhef van het eerste lid, gelijk is aan of meer bedraagt dan
      het op grond van het eerste lid voor die school geldende aantal, wordt de school niet opgeheven op grond van dit
      artikel. De procedures die in werking zijn gesteld op grond van het vierde tot en met het zevende lid, eindigen van
      rechtswege en beslissingen, genomen op grond van het vierde tot en met het zevende lid, vervallen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel263
  - number: '264.1'
    text: |-
      De gemeenteraad kan besluiten tot vermindering van het aantal openbare scholen in de gemeente. Het besluit wijst
      tevens de op te heffen scholen aan en het tijdstip met ingang waarvan de opheffing geschiedt. Opheffing van een
      school vindt niet plaats indien instandhouding van die school noodzakelijk is om voldoende te voorzien in de
      behoefte aan openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel264
  - number: '264.2'
    text: |-
      Een besluit als bedoeld in het eerste lid wordt genomen voor 16 februari voorafgaand aan het schooljaar waarin de
      opheffing geschiedt, dan wel, indien het besluit meer dan een school betreft, voorafgaand aan het schooljaar waarin
      de eerste van deze scholen wordt opgeheven. Het besluit wordt onderworpen aan de goedkeuring van gedeputeerde
      staten. Gedeputeerde staten onthouden hun goedkeuring ten aanzien van het besluit voor zover ten gevolge van
      de opheffing van een school, afhankelijk van de schoolsoort, regionaal, provinciaal dan wel landelijk niet meer
      voldoende zou zijn voorzien in de behoefte aan openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel264
  - number: '264.3'
    text: |-
      Gedeputeerde staten beslissen voor 16 februari volgend op de in het tweede lid genoemde datum. Indien gedeputeerde
      staten niet voor 16 februari hebben besloten, wordt het desbetreffende besluit van de gemeenteraad geacht te zijn
      goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel264
  - number: '264.4'
    text: |-
      De besluiten van de gemeenteraad en van gedeputeerde staten, genomen op grond van dit artikel, worden bekendgemaakt
      door een openbare kennisgeving binnen 2 weken na de datum waarop het besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel264
  - number: '265.1'
    text: |-
      Indien de bekostiging van een bijzondere school ingevolge artikel 262 wordt beëindigd of het bevoegd gezag beslist
      tot opheffing van de school, eindigt het recht op het gebouw en terrein en worden alle roerende zaken, behalve die
      welke het bevoegd gezag uit eigen middelen heeft aangeschaft, aan de gemeente overgedragen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel265
  - number: '265.2'
    text: |-
      Artikel 225, eerste tot en met vierde lid, is van overeenkomstige toepassing met dien verstande dat in de
      verklaring ingevolge het eerste lid en het besluit ingevolge het tweede lid als datum waarop het bevoegd gezag
      blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein voor de school te gebruiken, zal
      worden genoemd de datum waarop de bekostiging is geëindigd dan wel zal eindigen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel265
  - number: '265.3'
    text: |-
      Indien de bekostiging van een bijzondere school ingevolge artikel 262 wordt beëindigd of het bevoegd gezag
      beslist tot opheffing van de school, dan wel indien een openbare school ingevolge artikel 263 of artikel 264 wordt
      opgeheven, stort het bevoegd gezag niet bestede bekostigingsbedragen terug in de desbetreffende overheidskas.
      In afwijking van de vorige volzin mogen niet bestede bekostigingsbedragen voor zover het betreft de bekostiging,
      bedoeld in artikel 243, worden aangewend voor een van de andere scholen van het bevoegd gezag en ontstaat de
      verplichting van het bevoegd gezag om deze niet bestede bekostigingsbedragen terug te storten, eerst indien het
      betreft de beëindiging van de bekostiging of de opheffing van de laatste school die een bevoegd gezag in stand
      houdt overeenkomstig de Wet op het voortgezet onderwijs, de [Wet op het primair onderwijs][ref1], dan wel de
      [Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel265
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: '265.4'
    text: |-
      In afwijking van het derde lid, eerste volzin, boekt het bevoegd gezag van een in het derde lid, eerste
      volzin, bedoelde school in geval van samenvoeging van die school met een of meer andere scholen de uit 's Rijks
      kas ontvangen niet bestede bekostigingsbedragen over naar de school of scholen waarvoor met het oog op deze
      samenvoeging een aanvraag voor faciliteiten in verband met de samenvoeging is ingediend, aan de hand waarvan door
      Onze minister is vastgesteld dat er daadwerkelijk sprake is van een samenvoeging. Indien sprake is van samenvoeging
      van scholen van verschillende bevoegde gezagsorganen, kan, in afwijking van de vorige volzin, het bevoegd gezag
      van de op te heffen school met het bevoegd gezag van de school of scholen die in stand blijft onderscheidenlijk
      blijven, overeenkomen dat de uit 's Rijks kas ontvangen niet bestede bekostigingsbedragen als bedoeld in artikel
      243
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel265
  - number: 265.4.a
    text: worden overgeboekt naar de school of scholen die in stand blijft onderscheidenlijk blijven, dan wel
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel265
  - number: 265.4.b
    text: blijven bij het bevoegd gezag van de op te heffen school, ten behoeve van de andere scholen van dat bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel265
  - number: '265.5'
    text: |-
      Het vierde lid, de eerste volzin, is van overeenkomstige toepassing in geval van omzetting van een bekostigde
      bijzondere school in een bekostigde openbare school of omgekeerd, met dien verstande dat indien na de overboeking
      van de uit 's Rijks kas ontvangen niet bestede bekostigingsbedragen blijkt, dat voor de in het derde lid bedoelde
      school terugbetaling aan het Rijk dient te geschieden, deze terugbetaling ten laste van de school komt waarnaar de
      uit 's Rijks kas ontvangen niet bestede bekostigingsbedragen zijn overgeboekt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel265
  - number: '266'
    text: |-
      Grondslag voor de berekening van het aantal leerlingen, bedoeld in de artikelen 262 en 263, is het aantal
      leerlingen op 1 oktober.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel266
  - number: '267.1'
    text: |-
      Bij algemene maatregel van bestuur wordt voor een periode van telkens 4 schooljaren een landelijk beleidskader
      vastgesteld. De algemene maatregel van bestuur, bedoeld in de eerste volzin, wordt aan de beide kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en
      gedurende die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die
      maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig
      mogelijk ingediend. Het bepaalde in de vorige drie volzinnen is niet van toepassing, voor zover het ontwerp van de
      algemene maatregel van bestuur voordien aan beide kamers der Staten-Generaal is overgelegd en door of namens een
      der kamers te kennen is gegeven dat van de procedure, bedoeld in de tweede tot en met vierde volzin, kan worden
      afgeweken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel267
  - number: '267.2'
    text: |-
      Het landelijk beleidskader vermeldt de landelijke doelstellingen van het beleid inzake
      onderwijsachterstandenbestrijding en verstrekt informatie over de voornemens van de rijksoverheid met betrekking
      tot de landelijke evaluatie van het beleid inzake onderwijsachterstandenbestrijding.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel267
  - number: '268.1'
    text: |-
      De gemeenteraad stelt voor een periode van telkens 4 schooljaren een plan vast, onderwijsachterstandenplan genaamd,
      ter bestrijding van onderwijsachterstanden. Het plan kan desgewenst tezamen met het plan inzake onderwijs in
      allochtone levende talen, bedoeld in artikel 272, als één plan worden vastgesteld. Indien het totaal van de voor
      de bestrijding van onderwijsachterstanden bestemde middelen, bedoeld in het vierde lid, onderdelen a en c, tezamen
      met de voor onderwijs in allochtone levende talen bestemde middelen, bedoeld in artikel 272, derde lid, onderdelen
      a en c, jaarlijks minder is dan € 113 500 kan de gemeenteraad afzien van de vaststelling van het plan. In dat geval
      besluit de gemeenteraad op andere wijze omtrent de verdeling van de middelen, bedoeld in het vierde lid, onderdelen
      a en b, waarbij de gemeenteraad het landelijk beleidskader in acht neemt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: '268.2'
    text: |-
      Onder onderwijsachterstanden worden verstaan die negatieve effecten op de leer- en ontwikkelingsmogelijkheden van
      leerlingen, die het gevolg zijn van sociale, economische en culturele omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: '268.3'
    text: 'Het onderwijsachterstandenplan vermeldt in elk geval:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: 268.3.a
    text: |-
      de wijze waarop de doelstellingen, genoemd in het landelijk beleidskader, bedoeld in artikel 267, in kwalitatieve
      en kwantitatieve zin worden uitgewerkt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: 268.3.b
    text: |-
      de wijze waarop de voor de bestrijding van onderwijsachterstanden bestemde middelen, anders dan de in onderdeel c
      genoemde middelen, worden ingezet, alsmede de scholen en instellingen die de daaruit voortvloeiende activiteiten
      zullen verrichten,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: 268.3.c
    text: |-
      de wijze waarop de scholen de formatie voor speciale doeleinden inzetten, voor zover die is bestemd voor het
      bestrijden van onderwijsachterstanden met dien verstande dat de scholen de zeggenschap hebben over de wijze waarop
      dit wordt geoperationaliseerd,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: 268.3.d
    text: |-
      de wijze waarop de scholen verantwoording afleggen over de inzet van de in onderdeel c bedoelde middelen in
      overeenstemming met het plan, en de wijze waarop de scholen en instellingen rekening en verantwoording afleggen
      inzake de besteding van de middelen, bedoeld in het vierde lid, onderdelen a en b,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: 268.3.e
    text: de procedure met betrekking tot de wijziging van het plan, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: 268.3.f
    text: de wijze waarop de gemeenteraad het gemeentelijk onderwijsachterstandenbeleid evalueert.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: '268.4'
    text: |-
      Het onderwijsachterstandenplan vermeldt tevens de omvang van de voor de bestrijding van onderwijsachterstanden
      bestemde middelen, waarbij onderscheid wordt gemaakt tussen:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: 268.4.a
    text: |-
      de middelen die de gemeente als specifieke uitkering, bedoeld in artikel 269, uit 's Rijks kas ontvangt voor de
      bestrijding van onderwijsachterstanden,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: 268.4.b
    text: |-
      de middelen, anders dan bedoeld in onderdeel a, die de gemeenteraad bestemt voor de bestrijding van
      onderwijsachterstanden, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: 268.4.c
    text: de middelen, bedoeld in het derde lid, onderdeel c, die de scholen ontvangen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: '268.5'
    text: 'Het onderwijsachterstandenplan heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: 268.5.a
    text: basisscholen of speciale scholen voor basisonderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: 268.5.b
    text: scholen als bedoeld in deze wet,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: 268.5.c
    text: |-
      scholen als bedoeld in de [Wet op de expertisecentra][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 268.5.d
    text: andere instellingen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: '268.6'
    text: |-
      Vaststelling en wijziging van het onderwijsachterstandenplan of het nemen van een besluit omtrent de verdeling
      van middelen indien wordt afgezien van vaststelling van het plan, geschiedt niet dan na op overeenstemming
      gericht overleg met de bevoegde gezagsorganen van alle scholen in de gemeente. De gemeenteraad stelt daartoe bij
      verordening een procedure vast, met dien verstande dat in de verordening in ieder geval wordt bepaald:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: 268.6.a
    text: |-
      vanaf wanneer en tot welk moment het gemeentebestuur de Onderwijsraad kan verzoeken een advies als bedoeld in het
      tiende lid, uit te brengen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: 268.6.b
    text: |-
      dat de termijn voor het uitbrengen van het advies wordt opgeschort met ingang van de dag waarop de Onderwijsraad
      het gemeentebestuur uitnodigt het verzoek voor het uitbrengen van het advies aan te vullen met de gegevens die de
      Onderwijsraad nodig heeft voor een goede vervulling van diens taak, tot de dag waarop het verzoek is aangevuld, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: 268.6.c
    text: dat het gemeentebestuur gedurende de termijn voor het uitbrengen van het advies geen besluit neemt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: '268.7'
    text: |-
      Binnen een jaar na de vaststelling van het landelijk beleidskader, bedoeld in artikel 267, stelt de gemeenteraad
      het onderwijsachterstandenplan vast.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: '268.8'
    text: Het onderwijsachterstandenplan kan tussentijds worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: '268.9'
    text: |-
      Indien de vaststelling en wijziging van het onderwijsachterstandenplan of een besluit omtrent de verdeling van
      middelen indien wordt afgezien van vaststelling van het plan, leiden tot kosten van werkloosheidsuitkeringen, komen
      deze kosten ten laste van het Rijk indien het ontstaan van deze kosten in redelijkheid is toe te rekenen aan het
      Rijk.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: '268.10'
    text: |-
      Tijdens het in het zesde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit
      te brengen over de vaststelling of wijziging van het onderwijsachterstandenplan in relatie tot de vrijheid van
      richting en de vrijheid van inrichting. Het verzoek wordt gedaan indien het bevoegd gezag hierom heeft gevraagd
      dan wel uit eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht.
      Het advies wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekendgemaakt tezamen met
      het plan. Dit lid is van overeenkomstige toepassing op een besluit omtrent de verdeling van middelen indien wordt
      afgezien van vaststelling van het plan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: '268.11'
    text: |-
      Het gemeentebestuur kan een subsidieplafond vaststellen en bepalen hoe het beschikbare bedrag met inachtneming
      daarvan wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel268
  - number: '269.1'
    text: |-
      Bij algemene maatregel van bestuur worden de criteria vastgesteld op grond waarvan een gemeente voor telkens
      een periode van 4 jaar in aanmerking komt voor een specifieke uitkering ter tegemoetkoming in de kosten voor het
      bestrijden van onderwijsachterstanden, alsmede de criteria voor de hoogte daarvan. De uitkering wordt per jaar
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel269
  - number: '269.2'
    text: |-
      De gemeente verstrekt de middelen, bedoeld in artikel 268, vierde lid, onderdelen a en b, aan de rechtspersonen die
      daarvoor in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel269
  - number: '269.3'
    text: |-
      Onze minister kan voor bij ministeriële regeling aan te wijzen gevallen of groepen van gevallen tegemoetkomen
      aan onbillijkheden van overwegende aard, welke zich bij de toepassing van het eerste lid van dit artikel mochten
      voordoen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel269
  - number: '270'
    text: |-
      Onze minister kan de uitkering geheel of gedeeltelijk terugvorderen indien uit de rekening van
      de gemeente, bedoeld in [artikel 197 van de Gemeentewet][ref1], het gemeentelijk verslag omtrent
      het financieel beheer, bedoeld in [artikel 197 van de Gemeentewet][ref2], het verslag van de
      accountant, bedoeld in [artikel 213, tweede lid, van de Gemeentewet][ref3], dan wel uit een
      afzonderlijke verantwoording, voorzien van een verklaring van een accountant, als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4], niet blijkt dat de uitkering is besteed in
      overeenstemming met de bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel270
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '213'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '271.1'
    text: |-
      Het toezicht op het gemeentelijk onderwijsachterstandenbeleid in de gemeente is opgedragen aan het gemeentebestuur.
      Het toezicht op het gemeentebestuur in verband met de evaluatie van de landelijke doelstellingen van het beleid
      inzake onderwijsachterstandenbestrijding wordt uitgeoefend door bij besluit van Onze minister aangewezen personen.
      Het toezicht op de bevoegde gezagsorganen van de scholen en andere instellingen die betrokken zijn of betrokken
      worden bij de uitvoering van het plan of een besluit omtrent de verdeling van middelen indien wordt afgezien van de
      vaststelling van het plan, wordt in verband met de opstelling van het plan of het in deze volzin bedoelde besluit
      en voor de evaluatie uitgeoefend door bij besluit van de gemeenteraad aangewezen personen. De [artikelen 5:12 tot
      en met 5:17](onbekend) en [5:20 van de Algemene wet bestuursrecht](onbekend) zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel271
  - number: '271.2'
    text: |-
      Indien het bevoegd gezag van een school naar het oordeel van de gemeenteraad de middelen, bedoeld in artikel
      268, vierde lid, onderdelen a en b, niet besteedt overeenkomstig het onderwijsachterstandenplan, of een besluit
      omtrent de verdeling van middelen indien de gemeenteraad op grond van artikel 268, eerste lid, tweede volzin, heeft
      afgezien van de vaststelling van het plan, kan de gemeenteraad de middelen geheel of gedeeltelijk inhouden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel271
  - number: '271.3'
    text: |-
      Indien het bevoegd gezag van een school naar het oordeel van de gemeenteraad de middelen, bedoeld in artikel 268,
      vierde lid, onderdeel c, niet besteedt overeenkomstig het onderwijsachterstandenplan, maakt de gemeenteraad hiervan
      melding aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel271
  - number: '271.4'
    text: |-
      Indien het gemeentebestuur naar het oordeel van Onze minister de voorschriften in deze afdeling niet nakomt, kan
      Onze minister de uitkering, bedoeld in artikel 269, geheel of gedeeltelijk inhouden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel271
  - number: '271.5'
    text: |-
      Indien Onze Minister toepassing geeft aan het vierde lid in verband met een besluit van het gemeentebestuur dat
      leidt tot kosten van werkloosheidsuitkeringen en de rechtspersoon, bedoeld in artikel 285, eerste lid, een verzoek
      als bedoeld in artikel 247, derde lid, met betrekking tot een niet door de gemeente in stand gehouden school als
      gevolg van dat besluit van het gemeentebestuur heeft ingewilligd, vergoedt Onze Minister aan deze rechtspersoon de
      als gevolg van die inwilliging gemaakte kosten van werkloosheidsuitkeringen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel271
  - number: '272.1'
    text: |-
      Indien de gemeente daartoe middelen als bedoeld in artikel 274 uit 's Rijk kas ontvangt dan wel daartoe middelen
      ontvangt van een andere gemeente, stelt de gemeenteraad voor een periode van telkens 4 schooljaren een plan vast
      inzake onderwijs in allochtone levende talen. Het plan kan desgewenst tezamen met het onderwijsachterstandenplan,
      bedoeld in artikel 268, als één plan worden vastgesteld. Indien het totaal van de voor onderwijsachterstanden
      bestemde middelen, bedoeld in artikel 268, vierde lid, onderdelen a en c, tezamen met de voor onderwijs in
      allochtone levende talen bestemde middelen, bedoeld in het derde lid, onderdelen a en c, jaarlijks minder is dan €
      113 500 kan de gemeenteraad afzien van de vaststelling van het plan. In dat geval besluit de gemeenteraad op andere
      wijze omtrent de verdeling van de middelen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: '272.2'
    text: 'Het plan inzake onderwijs in allochtone levende talen vermeldt in elk geval:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: 272.2.a
    text: in welke talen onderwijs in allochtone levende talen wordt aangeboden,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: 272.2.b
    text: |-
      indien de gemeente met toepassing van artikel 274, tweede lid, middelen overdraagt aan een andere gemeente, ten
      behoeve van welke taal of talen middelen aan een andere gemeente ter beschikking worden gesteld, de naam van de
      ontvangende gemeente, alsmede de omvang van die middelen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: 272.2.c
    text: |-
      de procedure met betrekking tot de keuze welke scholen of rechtspersonen als bedoeld in het vierde lid, onder c, de
      activiteiten zullen verrichten, alsmede de criteria op grond waarvan de keuze wordt gemaakt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: 272.2.d
    text: |-
      de wijze waarop de scholen en de rechtspersonen, bedoeld in het vierde lid, onder c, rekening en verantwoording
      afleggen inzake de besteding van de middelen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: 272.2.e
    text: de procedure met betrekking tot de wijziging van het plan, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: 272.2.f
    text: de wijze waarop de gemeenteraad het gemeentelijke beleid inzake onderwijs in allochtone levende talen evalueert.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: '272.3'
    text: |-
      Het plan vermeldt tevens de omvang van de voor onderwijs in allochtone levende talen bestemde middelen, waarbij
      onderscheid wordt gemaakt tussen:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: 272.3.a
    text: |-
      de middelen die de gemeente als specifieke uitkering, bedoeld in artikel 274, uit 's Rijks kas ontvangt voor
      onderwijs in allochtone levende talen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: 272.3.b
    text: de middelen die de gemeenteraad bestemt voor onderwijs in allochtone levende talen, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: 272.3.c
    text: |-
      de middelen die de gemeente ontvangt van een andere gemeente ten behoeve van het onderwijs in een of meer
      allochtone levende talen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: '272.4'
    text: 'Het plan heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: 272.4.a
    text: basisscholen en speciale scholen voor basisonderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: 272.4.b
    text: |-
      scholen als bedoeld in de [Wet op de expertisecentra][ref1] en deel II van deze wet, en


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 272.4.c
    text: |-
      rechtspersonen die niet een school als bedoeld onder a of b in stand houden en naar het oordeel van de gemeenteraad
      in aanmerking komen voor het verzorgen van onderwijs in allochtone levende talen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: '272.5'
    text: |-
      De gemeenteraad stelt voorafgaand aan de vaststelling van het plan de bevoegde gezagsorganen van alle scholen in
      de gemeente en de allochtone ouders op een door de gemeenteraad vast te stellen wijze in staat hun mening kenbaar
      te maken over de wijze waarop voorlichting en behoeftepeiling onder de allochtone ouders zullen plaatsvinden.
      De gemeenteraad kan daarnaast rechtspersonen als bedoeld in het vierde lid, onder c, in staat stellen hun mening
      kenbaar te maken. De gemeenteraad kan de voorlichting en de behoeftepeiling beperken tot die talen, die naar het
      oordeel van de gemeenteraad in aanmerking zouden kunnen worden gebracht voor opname in het plan. Vaststelling en
      wijziging van het plan of het nemen van een besluit omtrent de verdeling van middelen indien wordt afgezien van
      vaststelling van het plan, geschiedt niet dan na op overeenstemming gericht overleg met de bevoegde gezagsorganen
      van alle scholen in de gemeente. De gemeenteraad stelt de allochtone ouders op een door de gemeenteraad te
      bepalen wijze in staat hun mening kenbaar te maken over de vaststelling en wijziging van het plan of het nemen
      van een besluit omtrent de verdeling van middelen indien wordt afgezien van vaststelling van het plan. Voor het op
      overeenstemming gerichte overleg met de bevoegde gezagsorganen stelt de gemeenteraad bij verordening een procedure
      vast, met dien verstande dat in de verordening in ieder geval wordt bepaald:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: 272.5.a
    text: |-
      vanaf wanneer en tot welk moment het gemeentebestuur de Onderwijsraad kan verzoeken een advies als bedoeld in het
      achtste lid uit te brengen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: 272.5.b
    text: |-
      dat de termijn voor het uitbrengen van het advies wordt opgeschort met ingang van de dag waarop de Onderwijsraad
      het gemeentebestuur uitnodigt het verzoek voor het uitbrengen van het advies aan te vullen met de gegevens die de
      Onderwijsraad nodig heeft voor een goede vervulling van diens taak, tot de dag waarop het verzoek is aangevuld, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: 272.5.c
    text: dat het gemeentebestuur gedurende de termijn voor het uitbrengen van het advies geen besluit neemt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: '272.6'
    text: Het plan kan tussentijds worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: '272.7'
    text: |-
      Indien de vaststelling en wijziging van het plan of een besluit omtrent de verdeling van middelen indien wordt
      afgezien van vaststelling van het plan, leiden tot kosten van werkloosheidsuitkeringen, komen deze kosten ten laste
      van het Rijk indien het ontstaan van deze kosten in redelijkheid is toe te rekenen aan het Rijk. De eerste volzin
      is van overeenkomstige toepassing op een besluit, waarbij aan een school op grond van het plan middelen zullen
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: '272.8'
    text: |-
      Tijdens het in het vijfde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling of wijziging van het plan in relatie tot de vrijheid van richting en de vrijheid van
      inrichting. Het verzoek wordt gedaan indien het bevoegd gezag hierom heeft gevraagd dan wel uit eigen beweging.
      Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies wordt binnen
      4 weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met het plan. Dit lid is van
      overeenkomstige toepassing op een besluit omtrent de verdeling van middelen indien wordt afgezien van vaststelling
      van het plan.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: '272.9'
    text: |-
      Het gemeentebestuur kan een subsidieplafond vaststellen en bepalen hoe het beschikbare bedrag met inachtneming
      daarvan wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel272
  - number: '273.1'
    text: |-
      Tot het onderwijs in een allochtone levende taal op een school die daarvoor in aanmerking is gekomen, worden
      leerlingen van de school en leerlingen die niet op de school zijn ingeschreven uitsluitend toegelaten indien hun
      ouders dit wensen. Tot het onderwijs in een allochtone levende taal, verzorgd door een rechtspersoon als bedoeld in
      artikel 272, vierde lid, onder c, worden leerlingen uitsluitend toegelaten indien hun ouders dat wensen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel273
  - number: '273.2'
    text: |-
      De tijd die wordt besteed aan onderwijs in allochtone levende talen wordt niet meegeteld voor het aantal uren
      onderwijs dat de leerlingen krachtens artikel 133, vierde lid, ten minste moeten ontvangen en evenmin voor het
      aantal uren onderwijs dat de leerlingen krachtens artikel 133, vijfde lid, ten hoogste per dag mogen ontvangen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel273
  - number: '274.1'
    text: |-
      Bij algemene maatregel van bestuur worden de criteria vastgesteld op grond waarvan een gemeente voor telkens een
      periode van 4 jaar in aanmerking komt voor een specifieke uitkering ter tegemoetkoming in de kosten voor onderwijs
      in allochtone levende talen, alsmede de criteria voor de hoogte daarvan. De uitkering wordt per jaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel274
  - number: '274.2'
    text: |-
      De gemeenteraad kan nadat de allochtone ouders op een door de gemeenteraad te bepalen wijze in staat zijn
      gesteld hun mening daarover kenbaar te maken, de middelen die het als specifieke uitkering, bedoeld in het
      eerste lid, uit 's Rijks kas ontvangt voor onderwijs in allochtone levende talen geheel of gedeeltelijk bestemmen
      voor taalondersteuning van allochtone leerlingen in de eerste vier schooljaren dan wel deze middelen geheel of
      gedeeltelijk overdragen aan een andere gemeente ten behoeve van onderwijs in een of meer allochtone levende talen
      in die gemeente. Indien de gemeenteraad besluit de uitkering, bedoeld in het eerste lid, geheel te bestemmen voor
      taalondersteuning van allochtone leerlingen in de eerste vier schooljaren, is artikel 272 niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel274
  - number: '274.3'
    text: |-
      De gemeente verstrekt de middelen, bedoeld in artikel 272, derde lid, aan de rechtspersonen die daarvoor in
      aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel274
  - number: '275'
    text: |-
      Onze minister kan de uitkering geheel of gedeeltelijk terugvorderen indien uit de rekening van
      de gemeente, bedoeld in [artikel 197 van de Gemeentewet][ref1], het gemeentelijk verslag omtrent
      het financieel beheer, bedoeld in [artikel 197 van de Gemeentewet][ref2], het verslag van de
      accountant, bedoeld in [artikel 213, tweede lid, van de Gemeentewet][ref3], dan wel uit een
      afzonderlijke verantwoording, voorzien van een verklaring van een accountant, als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4], niet blijkt dat de uitkering is besteed
      in overeenstemming met de bepalingen van deze wet. Indien aan een andere gemeente middelen zijn overdragen is bij
      de documenten, bedoeld in de eerste volzin, een document gevoegd als bedoeld in die volzin van de gemeente die de
      middelen heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel275
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '213'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '276.1'
    text: |-
      Het toezicht op het onderwijs in allochtone levende talen in de gemeente is opgedragen aan het gemeentebestuur.
      Het toezicht op de bevoegde gezagsorganen van de scholen en de rechtspersonen, bedoeld in artikel 171, vierde
      lid, onder c, die betrokken worden bij de uitvoering van het plan of een besluit omtrent de verdeling van middelen
      indien wordt afgezien van de vaststelling van het plan, wordt in verband met de opstelling van het plan of het
      in deze volzin bedoelde besluit en voor de evaluatie uitgeoefend door bij besluit van de gemeenteraad aangewezen
      personen. De [artikelen 5:12 tot en met 5:17](onbekend) en 5:20 van de Algemene wet bestuursrecht zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel276
  - number: '276.2'
    text: |-
      Indien het bevoegd gezag van een school of een rechtspersoon als bedoeld in artikel 272, vierde lid, onder c,
      dan wel een gemeentebestuur waaraan middelen zijn overgedragen, naar het oordeel van de gemeenteraad de middelen,
      bedoeld in artikel 272, derde lid, niet besteedt overeenkomstig het plan of een besluit omtrent de verdeling
      van middelen indien wordt afgezien van de vaststelling van het plan, kan de gemeenteraad die middelen geheel of
      gedeeltelijk inhouden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel276
  - number: '276.3'
    text: |-
      Indien het gemeentebestuur naar het oordeel van Onze minister de voorschriften in deze afdeling niet nakomt, kan
      Onze minister de uitkering, bedoeld in artikel 274, geheel of gedeeltelijk inhouden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel276
  - number: '276.4'
    text: |-
      Indien Onze Minister toepassing geeft aan het derde lid in verband met een besluit van het gemeentebestuur dat
      leidt tot kosten van werkloosheidsuitkeringen en de rechtspersoon, bedoeld in artikel 285, eerste lid, een verzoek
      als bedoeld in artikel 247, derde lid, met betrekking tot een niet door de gemeente in stand gehouden school als
      gevolg van dat besluit van het gemeentebestuur heeft ingewilligd, vergoedt Onze Minister aan deze rechtspersoon de
      als gevolg van die inwilliging gemaakte kosten van werkloosheidsuitkeringen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel276
  - number: '277.1'
    text: |-
      Indien een rechtspersoon als bedoeld in artikel 272, vierde lid, onder c, op grond van artikel 272 door de gemeente
      wordt gesubsidieerd voor het geven van onderwijs in allochtone levende talen:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel277
  - number: 277.1.a
    text: is het bepaalde bij of krachtens de artikelen 126 en 286 van overeenkomstige toepassing;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel277
  - number: 277.1.b
    text: |-
      voert die rechtspersoon met betrekking tot de kwaliteit van het onderwijs een beleid dat erop is gericht ten minste
      dezelfde kwaliteit te realiseren als redelijkerwijs kan worden verwacht van het onderwijs in allochtone levende
      talen, verzorgd door scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel277
  - number: '277.2'
    text: |-
      Het toezicht op het door een rechtspersoon als bedoeld in het eerste lid verzorgde onderwijs in allochtone levende
      talen en de deugdelijkheid ervan is opgedragen aan Onze Minister. Artikel 128 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel277
  - number: '278.1'
    text: |-
      Onze minister kan bepalen dat geen of slechts een gedeeltelijke bekostiging wordt verstrekt voor uitgaven die het
      gevolg zijn van schuld of nalatigheid van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel278
  - number: '278.2'
    text: |-
      Indien de uitgaven bedoeld in het eerste lid, voor bekostiging door het Rijk in aanmerking komen, treedt het Rijk
      op het moment van een uitdrukkelijk besluit tot bekostiging in alle rechten die het bevoegd gezag ter zake tegen
      derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel278
  - number: '278.3'
    text: |-
      Indien de gemeente een collectieve verzekering heeft afgesloten voor de vergoeding van schade, ontstaan aan
      gebouwen, terreinen of roerende zaken van een door de gemeente bekostigde niet door de gemeente in stand gehouden
      school, heeft het bevoegd gezag van de desbetreffende school jegens de gemeente geen aanspraak op vergoeding van
      dergelijke schade, voor zover die collectieve verzekering de schade dekt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel278
  - number: '278.4'
    text: |-
      Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een niet door de gemeente in stand gehouden
      school voor vergoeding door de gemeente in aanmerking komt, treedt de gemeente op het moment van een uitdrukkelijk
      besluit tot vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel278
  - number: '279'
    text: |-
      Het bevoegd gezag en de gemeente zijn verplicht Onze minister en de door hem aangewezen ambtenaren desgevraagd
      alle inlichtingen te geven die deze in verband met de bekostiging verlangen. Het bevoegd gezag en de gemeente geven
      desgewenst aan de door Onze minister aangewezen ambtenaren de boeken en bescheiden ter inzage.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel279
  - number: '280.1'
    text: |-
      Het gemeentebestuur draagt al of niet in samenwerking met een of meer andere gemeentebesturen zorg voor de
      instandhouding van een schoolbegeleidingsdienst.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel280
  - number: '280.2'
    text: |-
      De schoolbegeleidingsdienst gaat uit van een gemeente of een andere rechtspersoon die krachtens de doelstelling en
      gezien de activiteiten niet het maken van winst beoogt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel280
  - number: '280.3'
    text: |-
      De schoolbegeleidingsdienst heeft tot taak het ten behoeve van elke school en uitgaande van de in elk
      van de scholen aanwezige behoeften op verzoek van het bevoegd gezag van die scholen verrichten van
      begeleidingsactiviteiten, ontwikkelingsactiviteiten, advisering, informatieverstrekking en evaluatie,
      alsmede van activiteiten die dienen tot bevordering van een optimale schoolloopbaan van leerlingen. Onder
      activiteiten die dienen tot bevordering van een optimale schoolloopbaan van leerlingen wordt mede verstaan
      het ondersteunen bij het onderwijs aan leerlingen van scholen voor voortgezet onderwijs, scholen voor
      voortgezet speciaal onderwijs als bedoeld in artikel 125, basisscholen, speciale scholen voor basisonderwijs,
      scholen voor speciaal onderwijs, voortgezet speciaal onderwijs, speciaal en voortgezet speciaal onderwijs als
      bedoeld in [artikel 2, tweede lid onder a, b, c, f, h, j, k, m of n, van de Wet op de expertisecentra][ref1],
      instellingen voor speciaal en voortgezet speciaal onderwijs als bedoeld in
      [artikel 8, eerste lid tweede volzin, van de Wet op de expertisecentra ][ref2]en instellingen voor beroepsonderwijs
      die zijn opgenomen in een ziekenhuis niet zijnde een academisch ziekenhuis of die in verband met ziekte thuis
      verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel280
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '8'
  - number: '280.4'
    text: |-
      Het ondersteunen, bedoeld in het derde lid, kan in overeenstemming tussen de schoolbegeleidingsdienst en de school
      waarbij de leerling is ingeschreven, mede het geven van onderwijs aan de leerling betreffen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel280
  - number: '280.5'
    text: |-
      De schoolbegeleidingsdienst beschikt in ieder geval over deskundigen op de volgende terreinen: onderwijskunde,
      pedagogiek, orthopedagogiek, psychologie, organisatiekunde en informatie- en communicatietechnologie.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel280
  - number: '280.6'
    text: 'De gemeenteraad stelt jaarlijks vast:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel280
  - number: 280.6.a
    text: de omvang van de voor schoolbegeleiding bestemde middelen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel280
  - number: 280.6.b
    text: |-
      welk deel van de voor schoolbegeleiding bestemde middelen wordt besteed aan door de schoolbegeleidingsdienst te
      verrichten activiteiten die aansluiten bij doelstellingen van lokaal onderwijsbeleid, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel280
  - number: 280.6.c
    text: |-
      de criteria waaraan de scholen moeten voldoen om voor door de schoolbegeleidingsdienst te verrichten activiteiten
      als bedoeld in onderdeel b in aanmerking te komen, met dien verstande dat de vaststelling van de onderdelen b en c
      niet geschiedt dan na op overeenstemming gericht overleg met de bevoegde gezagsorganen van alle scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel280
  - number: '280.7'
    text: |-
      De gemeenteraad stelt voor het op overeenstemming gericht overleg bij verordening een procedure vast, met dien
      verstande dat in de verordening in ieder geval wordt bepaald:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel280
  - number: 280.7.a
    text: |-
      vanaf wanneer en tot welk moment het gemeentebestuur de Onderwijsraad kan verzoeken een advies als bedoeld in het
      achtste lid, uit te brengen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel280
  - number: 280.7.b
    text: |-
      dat de termijn voor het uitbrengen van het advies wordt opgeschort met ingang van de dag waarop de Onderwijsraad
      het gemeentebestuur uitnodigt het verzoek voor het uitbrengen van het advies aan te vullen met de gegevens die de
      Onderwijsraad nodig heeft voor een goede vervulling van diens taak, tot de dag waarop het verzoek is aangevuld, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel280
  - number: 280.7.c
    text: dat het gemeentebestuur gedurende de termijn voor het uitbrengen van het advies geen besluit neemt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel280
  - number: '280.8'
    text: |-
      Tijdens het in het zesde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling van het bepaalde in het zesde lid, onderdelen b en c, in relatie tot de vrijheid van
      richting en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd
      dan wel uit eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht.
      Het advies wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met het
      besluit, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel280
  - number: '280.9'
    text: |-
      De rechtspersoon, bedoeld in het tweede lid, en het personeel van de schoolbegeleidingsdienst zijn gehouden aan de
      inspectie alle gevraagde inlichtingen te geven omtrent de verrichting van de in het derde, het vierde en het zesde
      lid, onder b, bedoelde activiteiten ten behoeve van de scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel280
  - number: '281.1'
    text: |-
      Scholen kunnen schoolbegeleiding door een landelijke dienst naar richting ontvangen, indien zij op 31 december 1997
      met een dergelijke dienst een schoolbegeleidingsovereenkomst hadden als bedoeld in de bij of krachtens hoofdstuk
      II, titel II, van de Wet op de onderwijsverzorging gegeven voorschriften zoals die op die datum van kracht waren.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel281
  - number: '281.2'
    text: |-
      Onder scholen als bedoeld in het eerste lid, worden mede verstaan scholen die voor het eerst na 31 december 1997
      voor bekostiging in aanmerking komen en die in stand worden gehouden door:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel281
  - number: 281.2.a
    text: |-
      een bestuur dat een of meer andere scholen in stand houdt ten aanzien waarvan op die dag reeds een
      schoolbegeleidingsovereenkomst bestond met een landelijke dienst naar richting, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel281
  - number: 281.2.b
    text: |-
      een in verband met die aan te vangen bekostiging nieuw in het leven geroepen bestuur, indien ten aanzien van die
      scholen het bestuur dat deze scholen in stand houdt, een samenwerkingsovereenkomst heeft gesloten met het bevoegd
      gezag van een andere school die reeds schoolbegeleiding als bedoeld in het eerste lid, dit lid, onderdeel a, en
      [artikel B3 van de Wet van 15 mei 1997](onbekend) (Stb. 252) ontvangt en in de samenwerkingsovereenkomst in elk
      geval is opgenomen dat:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel281
  - number: 281.2.b.1°
    text: de overeenkomst wordt aangegaan voor een termijn van tenminste 10 jaren, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel281
  - number: 281.2.b.2°
    text: |-
      voor elk bevoegd gezag de verplichting is opgenomen om geen personeel te benoemen met voorbijgaan van personeel
      van een der scholen waarvan het bevoegd gezag aan de overeenkomst deelneemt, en dat in het genot is van wachtgeld
      of een andere ontslaguitkering en direct aan die ontslaguitkering voorafgaand langer dan een jaar onafgebroken in
      dienst is geweest van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel281
  - number: '281.3'
    text: |-
      Het gemeentebestuur verstrekt ten behoeve van de schoolbegeleiding door de landelijke diensten naar richting,
      bedoeld in het eerste en tweede lid, aan deze diensten subsidie, met dien verstande dat deze wordt vastgesteld op
      ten minste een evenredig deel van de middelen, bedoeld in artikel 280, voor zover het betreft middelen, bedoeld in
      het zesde lid, onderdeel a, verminderd met de middelen, bedoeld in het zesde lid, onderdeel b, van dat artikel.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel281
  - number: '282.1'
    text: |-
      Indien een bij of krachtens de wet gestelde termijn door het bevoegd gezag wordt overschreden en de gemeente
      daardoor geen vergoeding van het Rijk dan wel een lagere vergoeding of met ingang van een latere datum een
      vergoeding van het Rijk voor de materiële instandhouding ontvangt dan het geval zou zijn geweest indien deze
      termijn wel in acht was genomen, vergoedt het bevoegd gezag de door de gemeente geleden schade.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel282
  - number: '282.2'
    text: |-
      Indien een bij of krachtens de wet gestelde termijn door burgemeester en wethouders wordt overschreden en het
      bevoegd gezag daardoor geen vergoeding van het Rijk dan wel een lagere vergoeding of met ingang van een latere
      datum een vergoeding van het Rijk voor de materiële instandhouding ontvangt dan het geval zou zijn geweest indien
      deze termijn in acht was genomen, vergoedt de gemeente de door het bevoegd gezag geleden schade.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel282
  - number: '282.3'
    text: |-
      Burgemeester en wethouders en het bevoegd gezag kunnen in onderling overleg de in het eerste en tweede lid
      bedoelde verplichting tot schadevergoeding matigen. Indien dit overleg niet tot overeenstemming leidt, is
      [artikel 109 van boek 6 van het Burgerlijk Wetboek][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel109
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel282
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '109'
  - number: '283'
    text: |-
      Het bevoegd gezag van een bijzondere school is verplicht de uit de overheidskassen ontvangen gelden overeenkomstig
      de bestemming te gebruiken. Van de inkomsten en uitgaven wordt volgens bij algemene maatregel van bestuur te geven
      voorschriften nauwkeurig boekgehouden.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel283
  - number: '284.1'
    text: |-
      Het bevoegd gezag van een school is aangesloten bij een door Onze minister aan te wijzen rechtspersoon met
      volledige rechtsbevoegdheid die zich ten doel stelt waarborgen te bieden voor
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel284
  - number: 284.1.a
    text: de kosten voor vervanging bij afwezigheid van personeel, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel284
  - number: 284.1.b
    text: |-
      de kosten voortvloeiend uit rechtspositionele verplichtingen ten aanzien van personeel dat gebruik maakt van de
      krachtens artikel 153, tweede lid, vastgestelde regeling voor onvrijwillige taakvermindering.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel284
  - number: '284.2'
    text: |-
      Het bevoegd gezag van een school is voorts verplicht jaarlijks een door de in het eerste lid bedoelde rechtspersoon
      te bepalen bijdrage te voldoen aan die rechtspersoon in verband met de kosten voor vervanging.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel284
  - number: '284.3'
    text: |-
      Van de in het eerste juncto tweede lid bedoelde verplichting kan Onze minister op verzoek van het bevoegd gezag
      ontheffing verlenen op grond van bezwaren van godsdienstige of levensbeschouwelijke aard. Onze minister verleent
      de ontheffing slechts indien het bevoegd gezag aantoont dat een afdoende andere voorziening is getroffen met
      betrekking tot de gevolgen van vervanging bij afwezigheid van personeel en de gevolgen die voortvloeien uit
      rechtspositionele verplichtingen ten aanzien van personeel dat gebruik maakt van de krachtens artikel 153, tweede
      lid, vastgestelde regeling voor onvrijwillige taakvermindering. Onze Minister besluit binnen zes maanden na
      ontvangst van een verzoek als bedoeld in de eerste volzin. Indien de beschikking niet binnen zes maanden kan worden
      gegeven, stelt Onze minister het bevoegd gezag daarvan in kennis en noemt hij daarbij een termijn waarbinnen de
      beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel284
  - number: '284.4'
    text: De rechtspersoon kan regels vaststellen ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel284
  - number: '284.5'
    text: |-
      Uit 's Rijks kas wordt jaarlijks een door Onze minister te bepalen bedrag betaald aan de rechtspersoon, bedoeld in
      het eerste lid, in verband met de kosten, bedoeld in dat lid onder b.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel284
  - number: 284a.1
    text: |-
      De rechtspersoon, bedoeld in artikel 284, kan het sociaal-fiscaal nummer van het personeelslid dat bij afwezigheid
      wordt vervangen, en van degene die het personeelslid tijdelijk vervangt, uitsluitend in het kader van het doel,
      bedoeld in artikel 284, eerste lid, onderdeel a, gebruiken in het verkeer met:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel284a
  - number: 284a.1.a
    text: het personeelslid onderscheidenlijk degene die het personeelslid tijdelijk vervangt,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel284a
  - number: 284a.1.b
    text: |-
      het bevoegd gezag van de school dan wel het bestuur van de centrale dienst waar de in onderdeel a bedoelde personen
      werkzaam zijn,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel284a
  - number: 284a.1.c
    text: Onze minister,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel284a
  - number: 284a.1.d
    text: de instantie, bedoeld in artikel 285, vijfde lid, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel284a
  - number: 284a.1.e
    text: |-
      het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel284a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 284a.2
    text: |-
      Het sociaal-fiscaal nummer wordt op een daartoe strekkend verzoek van de in het eerste lid bedoelde rechtspersoon
      aan die rechtspersoon verstrekt door het bevoegd gezag van de school of het bestuur van de centrale dienst waar het
      personeelslid dat bij afwezigheid wordt vervangen, werkzaam is.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel284a
  - number: 284a.3
    text: |-
      Indien dat ten behoeve van het verslag, bedoeld in artikel 284, tweede lid, noodzakelijk is, worden gegevens
      daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon kunnen
      worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de controle op
      de rechtmatigheid en de doelmatigheid van aan of door de rechtspersoon gedane uitgaven. Daarbij kunnen de sociaal-
      fiscale nummers worden vergeleken met de sociaal-fiscale nummers die door andere daartoe bij of krachtens de wet
      bevoegde instanties zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel284a
  - number: '285.1'
    text: |-
      Het bevoegd gezag van een school is aangesloten bij een door Onze Minister aan te wijzen rechtspersoon
      met volledige rechtsbevoegdheid die zich ten doel stelt waarborgen te bieden voor de kosten van
      werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en
      arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1] ten behoeve van gewezen
      personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel285
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '285.2'
    text: |-
      Het bevoegd gezag voldoet aan de rechtspersoon jaarlijks een door die rechtspersoon vast te stellen bijdrage in
      verband met de kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen
      wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel285
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '285.3'
    text: |-
      Van de in het eerste en tweede lid bedoelde verplichting kan Onze Minister op verzoek van het bevoegd gezag
      ontheffing verlenen op grond van bezwaren van godsdienstige of levensbeschouwelijke aard. Onze Minister verleent
      de ontheffing slechts, indien het bevoegd gezag aantoont dat een afdoende andere voorziening is getroffen met
      betrekking tot de kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen
      wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1]. Onze
      Minister besluit binnen zes maanden na ontvangst van een verzoek. Indien de beschikking niet binnen zes maanden kan
      worden gegeven, stelt Onze Minister de verzoeker daarvan in kennis en noemt hij daarbij een termijn waarbinnen de
      beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel285
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '285.4'
    text: |-
      De rechtspersoon stelt regels vast voor de behandeling, beoordeling en beantwoording van een verzoek van het
      bevoegd gezag als bedoeld in artikel 247, derde lid. Indien het bevoegd gezag zich beroept op overwegingen van
      godsdienstige of levensbeschouwelijke aard, betrekt de rechtspersoon die overwegingen bij de beoordeling van een in
      de eerste volzin bedoeld verzoek.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel285
  - number: '285.5'
    text: |-
      Indien de rechtspersoon het in het vierde lid bedoelde verzoek heeft ingewilligd, vergoedt hij aan de instantie
      die de werkloosheidsuitkeringen, de suppleties inzake arbeidsongeschiktheid alsmede de uitkeringen wegens ziekte
      en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1] verstrekt of heeft
      verstrekt, de kosten van die uitkeringen of suppleties.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel285
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '285.6'
    text: |-
      Tegen een besluit van de rechtspersoon kan het bevoegd gezag beroep instellen bij de Afdeling bestuursrechtspraak
      van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel285
  - number: 285a.1
    text: |-
      De rechtspersoon, bedoeld in artikel 285, kan het sociaal-fiscaal nummer van het gewezen personeelslid, uitsluitend
      in het kader van het doel, bedoeld in artikel 285, eerste lid, gebruiken in het verkeer met:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel285a
  - number: 285a.1.a
    text: het gewezen personeelslid,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel285a
  - number: 285a.1.b
    text: |-
      het bevoegd gezag van de school dan wel het bestuur van de centrale dienst waar de in onderdeel a bedoelde persoon
      werkzaam was,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel285a
  - number: 285a.1.c
    text: Onze minister, of
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel285a
  - number: 285a.1.d
    text: de instantie, bedoeld in artikel 285, vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel285a
  - number: 285a.2
    text: |-
      Het sociaal-fiscaal nummer wordt op een daartoe strekkend verzoek van de in het eerste lid bedoelde rechtspersoon
      aan die rechtspersoon verstrekt door het bevoegd gezag van de school of het bestuur van de centrale dienst waar het
      gewezen personeelslid werkzaam was.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel285a
  - number: 285a.3
    text: |-
      Indien dat ten behoeve van het verslag, bedoeld in artikel 285, eerste lid, noodzakelijk is, worden gegevens
      daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon kunnen
      worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de controle op
      de rechtmatigheid en de doelmatigheid van door de rechtspersoon gedane uitgaven. Daarbij kunnen de sociaal-fiscale
      nummers worden vergeleken met de sociaal-fiscale nummers die door andere daartoe bij of krachtens de wet bevoegde
      instanties zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel285a
  - number: '286.1'
    text: |-
      Zij die op 31 juli 1985 op grond van artikel 131, vijfde lid, van de Kleuteronderwijswet bevoegd zijn om als
      leidster, onderscheidenlijk hoofdleidster bij het kleuteronderwijs werkzaam te zijn, zijn met ingang van 1
      augustus 1985 bevoegd tot het geven van voortgezet speciaal onderwijs. Zij die voor 1 augustus 1985 belast zijn
      geweest met het onderwijs in het vak zingen, bedoeld in artikel 2, eerste lid onder h, van de Lager-onderwijswet
      1920 (Stb. 1974, 565), zijn bevoegd tot het geven van voortgezet speciaal onderwijs in de expressie-activiteit,
      onderscheidenlijk het vak muziek. Zij die op 31 juli 1998 bevoegd waren tot het geven van het onderwijs in taal
      en cultuur van het land van oorsprong, zijn bevoegd tot het geven van het onderwijs, bedoeld in artikel 273,
      eerste lid. Voor zover aan deze bevoegdheid voorwaarden en beperkingen waren gesteld, blijven deze van kracht. Zij
      die op 31 juli van een bij koninklijk besluit te bepalen jaar in het bezit zijn van het bewijs van bekwaamheid,
      bedoeld in het tweede lid, onder a, blijven bevoegd tot het geven van onderwijs in lichamelijke oefening aan
      alle groepen leerlingen in het voortgezet speciaal onderwijs. Zij die op een bij koninklijk besluit te bepalen
      tijdstip een studie volgen die leidt tot een getuigschrift hoger beroepsonderwijs van met goed gevolg afgelegd
      afsluitend examen in de studierichting die voorbereidt op het beroep van leraar basisonderwijs, waarvan het
      onderwijsprogramma voor lichamelijke opvoeding zoals dat werd uitgevoerd voor 1 september 2000 deel uitmaakt,
      ontlenen aan dit getuigschrift een bevoegdheid ten aanzien van het geven van onderwijs in lichamelijke oefening
      aan alle groepen leerlingen in het voortgezet speciaal onderwijs indien zij bedoeld getuigschrift behalen voor een
      tijdstip dat bij hetzelfde koninklijk besluit wordt bepaald. Zij die tijdelijk zijn benoemd tot leraar op grond
      van [artikel 2 van de Interimwet zij-instroom leraren primair en voortgezet onderwijs][ref1] en die daarna het
      getuigschrift, bedoeld in [artikel 6, derde lid, van die wet][ref2] behalen, ontlenen aan dit getuigschrift een
      bevoegdheid tot het geven van onderwijs in lichamelijke oefening aan alle groepen leerlingen in het voortgezet
      speciaal onderwijs indien noodzakelijk geachte scholing, bedoeld in [artikel 5 van die wet][ref3], voor dat vak
      werd gevolgd volgens het onderwijsprogramma voor lichamelijke opvoeding zoals dat werd uitgevoerd voor 1 september
      2000.


      [ref1]: https://wetten.overheid.nl/BWBR0011469#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011469#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011469#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
    references:
      - id: ref1
        bwb_id: BWBR0011469
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011469
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0011469
        artikel: '5'
  - number: '286.2'
    text: |-
      De bewijzen van bekwaamheid tot het geven van voortgezet speciaal onderwijs bedoeld in artikel 135, eerste lid,
      zijn:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
  - number: 286.2.a
    text: |-
      het getuigschrift hoger beroepsonderwijs van met goed gevolg afgelegd afsluitend examen in de studierichting die
      voorbereidt op het beroep van leraar basisonderwijs, met dien verstande dat dit getuigschrift geen bevoegdheid
      geeft voor onderwijs in lichamelijke oefening, bedoeld in artikel 135, eerste lid, onder i;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
  - number: 286.2.b
    text: |-
      de akte van bekwaamheid als hoofdleidster bij het kleuteronderwijs en een bij algemene maatregel van bestuur aan te
      wijzen aanvullend bewijs;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
  - number: 286.2.c
    text: de akte van bekwaamheid als hoofdonderwijzer;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
  - number: 286.2.d
    text: de akte van bekwaamheid als volledig bevoegd onderwijzer;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
  - number: 286.2.e
    text: |-
      de middelbare akte pedagogiek B, uitgereikt door de Vereniging tot bevordering van de Studie der Pedagogiek of de
      stichting Raad van Toezicht, Bijstand en Advies voor de Studie der Pedagogiek;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
  - number: 286.2.f
    text: |-
      het getuigschrift hoger beroepsonderwijs van met goed gevolg afgelegd examen in de ten minste tweejarige deeltijdse
      studierichting leraar voortgezet onderwijs van de eerste graad in pedagogiek;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
  - number: 286.2.g
    text: |-
      de akte van bekwaamheid, uitgereikt door de instituten voor de opleiding van leraren, die uit de openbare kas
      bekostigd zijn krachtens de [Experimentenwet onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002718
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
    references:
      - id: ref1
        bwb_id: BWBR0002718
  - number: 286.2.h
    text: |-
      het getuigschrift hoger beroepsonderwijs van met goed gevolg afgelegd examen in de ten minste vierjarige
      studierichting opleiding tot leraar voortgezet onderwijs van de tweede graad.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
  - number: '286.3'
    text: |-
      De akten genoemd in het tweede lid onder c en d moeten zijn verkregen aan een van rijkswege bekostigd of aangewezen
      opleidingsinstituut, dan wel na het afleggen van een staatsexamen.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
  - number: '286.4'
    text: |-
      De bewijzen van bekwaamheid die zijn opgenomen in de krachtens de
      [artikelen 108 tot en met 114 van de Overgangswet WVO][ref1] en de artikelen 34, tweede en derde lid, en 35, derde
      en vierde lid, van de Wet op het voortgezet onderwijs vastgestelde voorschriften, verlenen bevoegdheid tot het
      geven van voortgezet speciaal onderwijs in de in die voorschriften genoemde vakken, met dien verstande dat


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel108
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '108'
  - number: 286.4.a
    text: |-
      de bewijzen van bekwaamheid die bevoegdheid verlenen voor het geven van onderwijs in het vak Nederlands bevoegdheid
      verlenen voor het geven van voortgezet speciaal onderwijs in het vak Nederlandse taal,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
  - number: 286.4.b
    text: |-
      de bewijzen van bekwaamheid die bevoegdheid verlenen voor het geven van onderwijs in het vak wiskunde bevoegdheid
      verlenen voor het geven van voortgezet speciaal onderwijs in het vak wiskunde en rekenen,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
  - number: 286.4.c
    text: |-
      de bewijzen van bekwaamheid die bevoegdheid verlenen voor het geven van onderwijs in de met de verschillende
      onderdelen van het vak kennisgebieden overeenkomende vakken bevoegdheid verlenen voor het geven van voortgezet
      speciaal onderwijs in de desbetreffende onderdelen en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
  - number: 286.4.d
    text: |-
      de bewijzen van bekwaamheid die bevoegdheid verlenen voor het geven van onderwijs in het vak wiskunde bevoegdheid
      verlenen voor het geven van voortgezet speciaal onderwijs in het vak rekenen en wiskunde.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
  - number: '286.5'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke bewijzen van bekwaamheid bevoegdheid verlenen tot het geven
      van onderwijs bedoeld in artikel 273, eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
  - number: '286.6'
    text: |-
      Voor elk van de bewijzen van bekwaamheid bedoeld in het eerste en tweede lid, kan bij algemene maatregel van
      bestuur worden bepaald in hoeverre een aanvullend bewijs van bekwaamheid gericht op het geven van voortgezet
      speciaal onderwijs, is vereist.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel286
  - number: '287.1'
    text: 'Onze minister is ten aanzien van de rechtspersoon, bedoeld in artikel 284, bevoegd tot:'
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: 287.1.a
    text: instemming met de statuten van de rechtspersoon, alsmede van wijziging van de statuten;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: 287.1.b
    text: instemming met de bijdrage, bedoeld in artikel 284, tweede lid;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: 287.1.c
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon in verband met de minimaal door de rechtspersoon te geven
      waarborgen, bedoeld in artikel 284, eerste lid, zulks in verband met de goede voortgang van het onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: 287.1.d
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon met het oog op de afstemming van activiteiten van de
      rechtspersoon op het algemene beleid inzake preventie van ziekteverzuim en arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: 287.1.e
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon om de nakoming te verzekeren van verplichtingen die bij
      deze wet aan de rechtspersoon zijn opgedragen;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: 287.1.f
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon om de door Onze minister gewenste inlichtingen te
      verkrijgen;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: 287.1.g
    text: |-
      het geven van algemene aanwijzingen aan de rechtspersoon in gevallen dat het algemeen belang dit in belangrijke
      mate vereist;
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: 287.1.h
    text: intrekking van de aanwijzing van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: '287.2'
    text: |-
      De rechtspersoon brengt jaarlijks voor 1 april aan Onze minister over het afgelopen jaar verslag uit over zijn
      werkzaamheden, voortvloeiend uit artikel 284.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: '287.3'
    text: |-
      Onze minister zendt het verslag, bedoeld in het tweede lid, vergezeld van zijn advies daarover, voor 1 mei volgend
      op de datum, bedoeld in het tweede lid, aan de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: '287.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de uitoefening van de in het eerste
      lid bedoelde bevoegdheden en omtrent de gevolgen van intrekking van de aanwijzing van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: '287.5'
    text: |-
      Krachtens bij algemene maatregel van bestuur vast te stellen voorschriften kan Onze minister subsidie verlenen aan
      de rechtspersoon ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: 287.5.a
    text: |-
      bedragen die, gedurende een vooraf vastgestelde periode en tot een vooraf vastgestelde maximale hoogte, strekken
      ter vervanging van de bekostiging in verband met de kosten van vervanging, bedoeld in artikel 236, eerste lid, en
      de bijdrage, bedoeld in artikel 284, tweede lid,
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: 287.5.b
    text: een bijdrage aan de kosten van de bedrijfsvoering van de rechtspersoon, en
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: 287.5.c
    text: een bijdrage ten behoeve van de uitoefening van landelijke taken in het kader van de bedrijfsgezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: '287.6'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het vijfde lid, kan ten behoeve van een in dat lid bedoelde
      subsidie een subsidieplafond worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: '287.7'
    text: |-
      De rechtspersoon kan ten behoeve van de uitoefening van landelijke taken in het kader van de
      bedrijfsgezondheidszorg subsidie aan derden verstrekken.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: '287.8'
    text: |-
      Het toezicht op de rechtspersoon is opgedragen aan Onze minister. Met het toezicht zijn belast de bij besluit
      van Onze minister aangewezen ambtenaren. Een besluit als bedoeld in de tweede volzin wordt bekendgemaakt in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: '287.9'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het vierde en vijfde lid, wordt aan de Tweede Kamer der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken
      en gedurende die termijn niet door of namens de Kamer de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel287
  - number: '288.1'
    text: Artikel 287 is van overeenkomstige toepassing ten aanzien van de rechtspersoon, bedoeld in artikel 285.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel288
  - number: '288.2'
    text: |-
      Onze Minister zendt binnen vijf jaar na de aanwijzing van de rechtspersoon, bedoeld in artikel 285, en vervolgens
      telkens na vijf jaar, aan de Tweede Kamer der Staten-Generaal een verslag over de doeltreffendheid en de effecten
      van de werkzaamheden van die rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel288
  - number: '289.1'
    text: Deze wet kan worden aangehaald als «Wet op het voortgezet onderwijs».
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel289
  - number: '289.2'
    text: Zij treedt in werking op een bij de wet, regelende het overgangsrecht, te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002399/2002-03-20#Artikel289
