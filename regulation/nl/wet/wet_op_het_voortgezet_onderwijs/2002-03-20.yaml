  - number: 11e.1
    text: |-
      Het bevoegd gezag van een school als bedoeld in de [artikelen 7][ref1], [8][ref2], [9][ref3] en [10a][ref4], kan
      na overleg met de ouders een leerling op individuele basis vrijstelling verlenen voor een van de vakken genoemd
      in [artikel 11a, tweede lid][ref5]. Het bevoegd gezag bepaalt bij de vrijstelling welk onderwijs voor de leerling
      in de plaats komt voor het vak waarvan vrijstelling is verleend. Het bevoegd gezag geeft de inspectie kennis van
      de verleende vrijstelling en vermeldt de gronden waarop deze vrijstelling berust. De eerste volzin vindt geen
      toepassing indien ten aanzien van de leerling met toepassing van [artikel 11c, vierde lid][ref6], een oriënterend
      programma is vastgesteld.


