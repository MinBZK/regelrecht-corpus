  - number: 10b6
    text: |-
      1 Tot het verzorgen van het buitenschoolse praktijkgedeelte zijn uitsluitend bevoegd bedrijven en organisaties ten
      aanzien waarvan wordt voldaan aan de volgende eisen:

      a. op de leer-werkplek of combinatie van leer-werkplekken kunnen de door het bevoegd gezag vastgestelde
      praktijkopdrachten daadwerkelijk worden uitgevoerd;

      b. elke praktijkopdracht als zodanig kan in één bedrijf of organisatie worden uitgevoerd;

      c. in het bedrijf of de organisatie is een gekwalificeerde praktijkbegeleider of leermeester aanwezig, die in staat
      is om kennis, inzicht en vaardigheden van de leerling te beoordelen, alsmede vorderingen daarin, en de leerling
      zowel werkinhoudelijk als pedagogisch-didactisch te begeleiden;

      d. het bedrijf of de organisatie is bereid met de in het tweede lid bedoelde mentor of docentbegeleider contact
      te onderhouden;

      e. de mogelijkheid om binnen hetzelfde bedrijf of dezelfde organisatie, dezelfde moederorganisatie of dezelfde
      branche de leerdoelen van het voorbereidend middelbaar beroepsonderwijs en de eindtermen van de entreeopleiding
      of basisberoepsopleiding, bedoeld in de [Wet educatie en beroepsonderwijs][ref1] te behalen, zonder grote
      overgangsdrempels voor de leerling;

      f. het bedrijf of de organisatie waarborgt dat een gekwalificeerde praktijkbegeleider of leermeester is gekoppeld
      aan een leerling, en dat deze leermeester ervoor zorgt dat de leerling voldoende hulp en tijd krijgt om de
      praktijkopdrachten uit te voeren;

      g. het productie- of dienstverleningsproces is technisch en organisatorisch voldoende gevarieerd en kan leerlingen
      goed praktijkmateriaal bieden en hen gedegen opleiden;

      h. de leer-werkplek past binnen de dagelijkse bedrijfsvoering;

      i. het bedrijf of de organisatie is bereid de leerling de vereiste praktijkopdrachten uit te laten voeren en het
      werk en het stageverslag te bespreken en te beoordelen;

      j. het bedrijf of de organisatie is geschikt voor de betrokken leeftijdsgroep waar het gaat om onder meer ruimte om
      te leren of fouten te maken, erkenning van jong zijn;

      k. het bedrijf of de organisatie respecteert, voor zover van toepassing, het multiculturele karakter van de
      leerlingenpopulatie.

      2 Het bevoegd gezag draagt zorg voor beschikbaarheid van een gekwalificeerde mentor of docentbegeleider die de
      voortgang op de leer-werkplek alsmede de integratie tussen het binnenschools en buitenschools programma bewaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
