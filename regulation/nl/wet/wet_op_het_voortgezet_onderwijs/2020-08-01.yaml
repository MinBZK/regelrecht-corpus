  - number: 10b10
    text: |-
      1 Het bevoegd gezag van een school voor middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend
      beroepsonderwijs kan leerlingen een doorlopende leerroute vmbo-mbo aanbieden, met inachtneming van de
      [artikelen 10b11 tot en met 10b20][ref1].

      2 Een doorlopende leerroute vmbo-mbo is een onderwijsprogramma vanaf het derde leerjaar aan een school voor
      middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend beroepsonderwijs, dat opleidt tot zowel
      een diploma voorbereidend middelbaar beroepsonderwijs als bedoeld in [artikel 29, derde lid][ref2], als het diploma
      van een basisberoepsopleiding, vakopleiding of middenkaderopleiding.

      3 In een doorlopende leerroute vmbo-mbo worden tot één onderwijsprogramma geïntegreerd:

      a. de basisberoepsgerichte leerweg en een basisberoepsopleiding in een aanverwant opleidingsdomein of een
      aanverwante kwalificatie;

      b. de kaderberoepsgerichte leerweg en een vakopleiding in een aanverwant opleidingsdomein of een aanverwante
      kwalificatie;

      c. de kaderberoepsgerichte, gemengde of theoretische leerweg en een middenkaderopleiding in een aanverwant
      opleidingsdomein of een aanverwante kwalificatie.

      4 Een doorlopende leerroute vmbo-mbo stemt wat betreft het daarvan onderdeel uitmakende voortgezet onderwijs
      overeen met een of meer van de profielen, bedoeld in [artikel 10][ref3], [10b][ref4] of [10d][ref5], die aan de
      school worden verzorgd.

      5 Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op een agrarisch opleidingscentrum wat
      betreft het voorbereidend beroepsonderwijs dat daaraan wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel29
