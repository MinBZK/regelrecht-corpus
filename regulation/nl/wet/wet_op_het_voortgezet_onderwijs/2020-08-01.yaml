  - number: '70'
    text: |-
      Onze Minister kan op aanvraag van het bevoegd gezag van een school of scholengemeenschap leerwegondersteunend
      onderwijs als bedoeld in [artikel 10e][ref1] voor bekostiging in aanmerking brengen indien:

      1. dat doelmatig is gelet op het geheel en de spreiding van het aanbod van leerwegondersteunend onderwijs, en

      2. de meerderheid van de bevoegde gezagsorganen van de overige scholen en scholengemeenschappen in het betrokken
      samenwerkingsverband instemt met de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10e
