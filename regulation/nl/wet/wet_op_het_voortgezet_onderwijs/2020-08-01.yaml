  - number: 41g
    text: |-
      1 Het bevoegd gezag verstrekt aan Onze Minister de basisgegevens van
      leraren die zijn benoemd of tewerkgesteld zonder benoeming op grond van
      [artikelen 33, eerste lid, onderdeel b, onderdelen 1 en 2, lid 1a, lid 1b, tweede of zestiende lid][ref1],
      [33a][ref2] of [33b][ref3] en draagt zorg voor het correct bijhouden van die gegevens ten behoeve van het
      lerarenregister.

      2 De leraar verstrekt aan Onze Minister de gegevens, genoemd in
      [artikel 41f, eerste lid, onderdelen e tot en met g][ref4].

      3 Indien een leraar niet is benoemd of tewerkgesteld zonder benoeming, kan hij ten behoeve van opname in
      het lerarenregister de gegevens als genoemd in [artikel 41f, eerste lid, onderdelen e tot en met g][ref5],
      verstrekken aan Onze Minister mits hij tevens gegevens, bedoeld in artikel 41f,
      eerste lid, onderdelen a en b, verstrekt en middels een bewijsstuk als bedoeld in de
      [artikelen 33, eerste lid, onderdeel b, onderdelen 1 en 2, lid 1a, lid 1b, tweede of zestiende lid][ref6],
      [33a][ref7] of [33b][ref8], aantoont dat hij aan de bekwaamheidseisen voldoet.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de tijdstippen en over de wijze
      van levering, de correctie van de gegevens en over het aantonen van de bekwaamheidseisen, bedoeld in het derde lid.


