  - number: 6g
    text: |-
      1 Voorbereidend wetenschappelijk onderwijs aan scholen als bedoeld in [artikel 7][ref1], omvat ten minste 5.700
      klokuren.

      2 Hoger algemeen voortgezet onderwijs:

      a. aan scholen als bedoeld in [artikel 8, onderdeel a][ref2], omvat ten minste 4.700 klokuren;

      b. aan afdelingen als bedoeld in [artikel 8, onderdeel b][ref3], omvat ten minste 1.700 klokuren.

      3 Middelbaar algemeen voortgezet onderwijs aan scholen als bedoeld in [artikel 9][ref4], omvat ten minste 3.700
      klokuren.

      4 Voorbereidend beroepsonderwijs aan scholen als bedoeld in [artikel 10a][ref5], omvat ten minste 3.700 klokuren.

      5 Het bevoegd gezag vult de uren in met activiteiten die worden verzorgd in een onderwijsprogramma
      als bedoeld in de [artikelen 10, tweede lid][ref6], [10b, tweede lid][ref7], [10d, tweede lid][ref8],
      [11c, eerste lid][ref9], [11f][ref10] en [12, vijfde lid, tweede volzin][ref11].

      6 Het bevoegd gezag beschikt over geordende gegevens over die invulling en over de spreiding van de uren over de
      verschillende leerjaren.

      7 De inspectie kan op verzoek van het bevoegd gezag ermee instemmen dat om lichamelijke of psychische redenen voor
      individuele leerlingen wordt afgeweken van het eerste, tweede, derde of vierde lid.


