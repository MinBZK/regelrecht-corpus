        paragraaf: '6'
        afdeling: II
  - number: 96i
    text: |-
      1 Indien een gemeente een of meer scholen in stand houdt, stellen burgemeester en wethouders jaarlijks met
      betrekking tot die scholen voorlopig vast:

      a. het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      personeelskosten,

      b.

      c. het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      exploitatiekosten,

      d. het totaal van de ontvangsten, bedoeld in [artikel 85][ref1],

      e.

      f. het totaal van de ontvangsten dat is gebaseerd op de bedragen die krachtens [artikel 86][ref2]
      voor de exploitatiekosten voor dat kalenderjaar zijn vastgesteld, alsmede de bedragen die krachtens
      [artikel 99, tweede lid tweede volzin][ref3], voor voorzieningen in de exploitatie worden aangewend,

      g. het totaal van de aanvullende ontvangsten waaronder worden verstaan de bedragen die krachtens artikel 89 voor de
      exploitatiekosten voor dat kalenderjaar zijn vastgesteld,

      h. het bedrag dat de gemeente in het voorafgaande kalenderjaar heeft uitgegeven ten behoeve van de instandhouding
      van een rechtspersoon als bedoeld in [artikel 53b][ref4], en

      i. een staat van voorzieningen die zijn ingesteld ten behoeve van het openbaar onderwijs.

      2 Indien de gemeente een deel van de ontvangsten, bedoeld in het eerste lid onderdeel d, dan wel een deel van de
      ontvangsten, bedoeld in de onderdelen f of g van dat lid, toevoegt aan een voorziening, wordt dat deel aangemerkt
      als een uitgave als bedoeld in dat lid onderdeel a, onderscheidenlijk als een uitgave als bedoeld in de onderdelen
      c of h van dat lid. Indien de gemeente bedragen aan een voorziening onttrekt, worden deze aangemerkt als
      ontvangsten, bedoeld in het eerste lid onderdeel d, onderscheidenlijk als ontvangsten als bedoeld in de onderdelen
      f of g van dat lid.

      3 Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen c, f, g en h, worden
      buiten beschouwing gelaten de uitgaven en ontvangsten voor administratie, beheer en bestuur, bedoeld in
      [artikel 86, eerste lid, onderdeel d][ref5].

      4 Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen a, c en h worden buiten beschouwing
      gelaten de uitgaven die worden gedekt door ontvangsten van bedragen die door derden zijn betaald, de uitgaven
      die worden gedekt door ontvangsten op grond van een besluit als bedoeld in [artikel 96g, zesde lid][ref6], tweede
      volzin, en de uitgaven voor de voorzieningen waarvoor het bevoegd gezag van een niet door de gemeente in stand
      gehouden school op grond van de regeling, bedoeld in [artikel 96h, eerste lid][ref7], een aanvraag bij de gemeente
      kon indienen en wel gedurende de periode waarvoor een dergelijke aanvraag kon worden gedaan.

      5 Indien de gemeente een deel van de bekostiging voor personeels- en exploitatiekosten overdraagt aan een ander
      bevoegd gezag, wordt dat deel aangemerkt als een uitgave als bedoeld in het eerste lid, onderdeel a of onderdeel
      c. Indien door een ander bevoegd gezag een deel van de bekostiging voor personeels- en exploitatiekosten aan de
      gemeente wordt overgedragen, wordt dat deel aangemerkt als een ontvangst als bedoeld in het eerste lid, onderdeel
      d, of onderdeel f.

      6 Om de vijf jaar stellen burgemeester en wethouders voorlopig vast het totaal van de vastgestelde uitgaven
      en ontvangsten in de voorafgaande vijf kalenderjaren, zoals in het eerste tot en met vijfde lid is aangegeven.
      Indien de uitgaven hoger zijn dan de ontvangsten, bepalen burgemeester en wethouders tevens het bedrag van de
      overschrijding. Indien een gemeente vanaf een tijdstip binnen een periode van vijf jaar als bedoeld in de eerste
      volzin geen school in stand houdt, stellen burgemeester en wethouders in afwijking van die volzin zo spoedig
      mogelijk na dat tijdstip voorlopig vast het totaal van de vastgestelde uitgaven en ontvangsten in het aan dat
      tijdstip voorafgaande deel van de periode van vijf jaar, zoals in het eerste tot en met vijfde lid is aangegeven.

      7 Na sluiting van de rekening van de gemeente stellen burgemeester en wethouders de in het eerste en zesde lid
      bedoelde bedragen, zo nodig gewijzigd, vast. In het geval de uitgaven hoger zijn dan de ontvangsten, bedoeld in het
      zesde lid, drukken burgemeester en wethouders vervolgens het bedrag van de overschrijding, bedoeld in genoemd lid,
      uit in een percentage van het totaal van de ontvangsten, bedoeld in het eerste lid onderdelen d tot en met g. Het
      percentage wordt afgerond tot twee decimalen. Afronding naar beneden vindt plaats indien de derde decimaal kleiner
      is dan 5, en naar boven indien deze decimaal ten minste 5 bedraagt.

      8 Voor de toepassing van de [artikelen 96i tot en met 96k][ref8] worden uitgaven ten behoeve van een nevenvestiging
      aangemerkt als uitgaven ten behoeve van de hoofdvestiging van de school waaraan de nevenvestiging is verbonden.
      Indien ten behoeve van een school of nevenvestiging uitgaven worden gedaan door meer dan één gemeente, worden deze
      uitgaven aangemerkt als uitgaven van de gemeente op wier grondgebied de hoofdvestiging is gelegen. In het geval,
      bedoeld in de vorige volzin worden de besluiten ingevolge de [artikelen 96i tot en met 96k][ref9] genomen door
      laatstbedoelde gemeente en hebben deze mede betrekking op de uitgaven van de andere gemeente of gemeenten. Voor de
      toepassing van de [artikelen 96i tot en met 96k][ref10] wordt een nevenvestiging aangemerkt als een nevenvestiging
      die is gelegen in de gemeente van de hoofdvestiging.

      9 Burgemeester en wethouders kunnen in overeenstemming met het bevoegd gezag van een niet door de gemeente in stand
      gehouden school besluiten dat met betrekking tot een of meer scholen van dat bevoegd gezag uitgaven die de gemeente
      doet ten behoeve van een door haar in stand gehouden school buiten beschouwing worden gelaten bij het vaststellen
      van de bedragen, bedoeld in dit artikel.


