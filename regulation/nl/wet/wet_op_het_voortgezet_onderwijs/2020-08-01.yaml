  - number: '73'
    text: |-
      Aan een school of scholengemeenschap kan naast een hoofdvestiging zijn verbonden een:

      a. nevenvestiging, of

      b. tijdelijke nevenvestiging.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel73
  - number: 73a
    text: |-
      1 De eerste vestiging van een school of scholengemeenschap die op grond van [artikel 64][ref1] voor bekostiging in
      aanmerking is gebracht, wordt aangeduid als hoofdvestiging.

      2 Naast het onderwijsaanbod dat mag worden verzorgd door het voor bekostiging in aanmerking brengen van een
      scholengemeenschap, kan op een hoofdvestiging van een scholengemeenschap in elk geval onderwijs worden verzorgd in
      de in [artikel 73b, tweede en derde lid][ref2], genoemde leerjaren van de schoolsoorten die de scholengemeenschap
      omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel73b
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel73a
