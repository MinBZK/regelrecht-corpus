  - number: 25a
    text: |-
      1 Het bevoegd gezag kan leerlingen in de gelegenheid stellen in het kader van het onderwijs waarvoor zij aan de
      school zijn ingeschreven:

      a. ook onderwijs te ontvangen dat een school van een ander bevoegd gezag of een instelling voor educatie en
      beroepsonderwijs verzorgt, of

      b. deel te nemen aan een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid onder a, van de Wet educatie en beroepsonderwijs][ref1] en die opleiding met een examen
      af te sluiten.

      2 Het eerste lid vindt uitsluitend toepassing met het doel:

      a. leerlingen met bijzondere kenmerken beter in staat te stellen een diploma als bedoeld in deze wet te behalen,

      b. leerlingen meer kansen te geven om vervolgonderwijs met gunstig resultaat te volgen, of

      c. onderwijsvoorzieningen doelmatiger te gebruiken.

      3 Toepassing van het eerste lid berust op een samenwerkingsovereenkomst, gesloten tussen het bevoegd
      gezag van de school en het bevoegd gezag van de in het eerste lid bedoelde andere school of instelling. De
      samenwerkingsovereenkomst omvat in elk geval:

      a. het doel van de samenwerking,

      b. de doelgroep,

      c. de wijze waarop wordt nagegaan of het doel wordt bereikt,

      d. het onderwijsprogramma dat volgens de samenwerking wordt vormgegeven,

      e. in geval van overdracht van een deel van de bekostiging met toepassing van [artikel 99, achtste lid][ref2], de
      omvang en de bestemming van de over te dragen middelen, en

      f. een regeling voor de beslechting van geschillen tussen partijen over de uitvoering van de overeenkomst.

      4 Bij algemene maatregel van bestuur:

      a. wordt nader geregeld voor welke leerlingen en onder welke voorwaarden het eerste lid toepassing kan vinden,

      b. kan bij toepassing van het eerste lid voor doelen als bedoeld in het tweede lid, onder a en b, worden geregeld
      van welke bij of krachtens de [artikelen 10][ref3], [10b][ref4], [10d][ref5], [13 tot en met 15][ref6], [22][ref7],
      [29][ref8], [33 tot en met 36][ref9] en [60][ref10] vastgestelde voorschriften kan worden afgeweken, alsmede welke
      voorschriften in plaats daarvan zullen gelden, en

      c. kan worden bepaald dat een in het eerste lid bedoelde leerling voor de toepassing van daarbij aan te wijzen
      wettelijke voorschriften wordt aangemerkt of mede wordt aangemerkt als vavo-student of student in de zin van de
      [Wet educatie en beroepsonderwijs][ref11].

      5 Indien het bevoegd gezag, bedoeld in het eerste lid, leerlingen in het kader van het onderwijs waarvoor zij aan
      de school zijn ingeschreven, ook onderwijs wil kunnen laten volgen dat een andere school voor voortgezet onderwijs
      van datzelfde bevoegd gezag verzorgt, zijn het eerste, tweede en vierde lid van overeenkomstige toepassing en
      regelt het bevoegd gezag op overeenkomstige wijze de onderwerpen van het derde lid, onder a tot en met e.


