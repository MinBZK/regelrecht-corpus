  - number: '75'
    text: |-
      1 Onze Minister kan in bijzondere gevallen cursussen voortgezet onderwijs, niet zijnde voorbereidend
      beroepsonderwijs, geheel of gedeeltelijk en voor een door hem te bepalen periode voor bekostiging in aanmerking
      brengen, indien naar zijn oordeel daaraan behoefte bestaat.

      2 Onze Minister kan aan de bekostiging verplichtingen verbinden.

      3 Onze Minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels over de verdeling vastgesteld.

      4 Indien een cursus voortgezet onderwijs als bedoeld in het eerste lid voor bekostiging in aanmerking wordt
      gebracht, is [artikel 6e][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6e
