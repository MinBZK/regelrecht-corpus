  - number: '36'
    text: |-
      1 Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor leraren.

      2 Bij algemene maatregel van bestuur kunnen voor werkzaamheden van leidinggevende aard die nauw verband houden met
      het pedagogisch-didactische klimaat op de school of onderwijskundige leiding omvatten, bekwaamheidseisen worden
      vastgesteld.

      3 Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor bij die maatregel aan te wijzen
      onderwijsondersteunende werkzaamheden die rechtstreeks verband houden met het onderwijsleerproces.

      4 De in het eerste lid bedoelde bekwaamheidseisen zijn gericht op het handelen in het onderwijsleerproces, het
      algemeen professioneel handelen en het werken binnen een onderwijsorganisatie. Zij omvatten in elk geval eisen ten
      aanzien van:

      a. pedagogisch-didactische kennis, inzicht en vaardigheden, en

      b. vakbekwaamheid.

      5 De in het eerste lid bedoelde bekwaamheidseisen kunnen worden onderscheiden naar schoolsoort en naar
      samenhangende leerjaren, met dien verstande dat zij in elk geval specifiek worden vastgesteld voor de periode van
      voorbereidend hoger onderwijs, bedoeld in artikel 12, eerste lid.

      6 Onze Minister stelt een beroepsorganisatie die hij vanuit het oogpunt van beroepskwaliteit representatief
      acht voor onderwijspersoneel als bedoeld in deze wet, in de gelegenheid hem een voorstel te doen voor de in het
      eerste en derde lid voorgeschreven bekwaamheidseisen en kan een representatief geachte beroepsorganisatie in de
      gelegenheid stellen hem een voorstel te doen voor bekwaamheidseisen die op grond van het tweede lid kunnen worden
      vastgesteld. Onze Minister stelt deze organisatie vervolgens in elk geval eenmaal in de zes jaar in de gelegenheid,
      hem een voorstel te doen over ongewijzigde handhaving of wijziging van de bekwaamheidseisen voor zover vastgesteld.
      Uit een voorstel als bedoeld in de eerste of tweede volzin blijkt tevens, in hoeverre dat voorstel mede steun
      geniet van een vertegenwoordiging van bevoegde gezagsorganen, van ouders en van leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel36
  - number: '37'
    text: |-
      Degene die voor een bepaald vak voldoet aan de in [artikel 36, eerste juncto vijfde lid][ref1], bedoelde
      bekwaamheidseisen voor de periode van voorbereidend hoger onderwijs, is daarmee tevens bekwaam voor dat vak voor
      zover dat wordt verzorgd in het voortgezet onderwijs niet zijnde de periode van voorbereidend hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 37a
    text: |-
      Het bevoegd gezag beschikt ten aanzien van elk personeelslid dat een functie of werkzaamheden verricht waarvoor
      bekwaamheidseisen zijn vastgesteld, over geordende gegevens met betrekking tot de bekwaamheid en het onderhouden
      van de bekwaamheid. Ten behoeve van de onderlinge vergelijkbaarheid en herkenbaarheid van de gegevens kunnen bij
      ministeriële regeling voorschriften worden vastgesteld over de inrichting en wijze van ordening van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel37a
  - number: 37b
    text: |-
      1 Degene die op 31 juli 2017 voor het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs
      aan een school is benoemd of tewerkgesteld zonder benoeming, alsmede degene die eerder al voor het geven van dat
      onderwijs benoemd is geweest of tewerkgesteld zonder benoeming, voldoet aan de bekwaamheidseisen voor het geven van
      dat onderwijs.

      2 Degene die binnen een periode van vijf jaren gerekend vanaf 1 augustus 2017 voor de eerste keer wordt benoemd
      of tewerkgesteld zonder benoeming voor het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs
      aan een school, dient binnen een periode van vijf jaren gerekend vanaf het tijdstip van die eerste benoeming of
      die eerste tewerkstelling zonder benoeming, te voldoen aan de bekwaamheidseisen voor het geven van dat onderwijs
      om belast te kunnen blijven worden met de desbetreffende werkzaamheden. Bij algemene maatregel van bestuur kan
      deze periode worden verlengd met een daarbij te bepalen periode indien verlenging noodzakelijk is voor een goede
      invoering van die bekwaamheidseisen.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op degene die:

      a. onderwijsondersteunende werkzaamheden ten behoeve van godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs aan een school verricht, vanaf het moment dat voor die werkzaamheden bekwaamheidseisen zijn
      vastgesteld; of

      b. is aangewezen, eerder was aangewezen onderscheidenlijk voor de eerste keer wordt aangewezen voor het geven van
      godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs op openbare scholen.

      4 Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel37b
  - number: 37c
    text: |-
      [Artikel 24, derde lid][ref1], vindt, wat het onderhouden van de bekwaamheid betreft, voor een bepaalde
      personeelscategorie voor het eerst toepassing met ingang van het tijdstip waarop de bekwaamheidseisen voor die
      categorie in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 37f
    text: |-
      Ten behoeve van een scholengemeenschap of een verticale scholengemeenschap worden bij algemene maatregel van
      bestuur voorschriften vastgesteld met betrekking tot de toepassing van de [artikelen 32 tot en met 37][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel37f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '32'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '38'
    text: |-
      1 Degene die beschikt over een in artikel 118k bedoelde geschiktheidsverklaring, het bevoegd gezag dat benoemt of
      tewerkstelt zonder benoeming, en het bestuur van een instelling die werkzaamheden uitvoert als bedoeld in artikel
      118p, eerste lid, onder a, sluiten een overeenkomst die hun wederzijdse rechten en plichten omvat met betrekking
      tot het uitvoeren van de noodzakelijk geachte scholing en begeleiding, met inachtneming van de beoordeling,
      bedoeld in artikel 118l, tweede lid, onder c. Indien na het sluiten van de overeenkomst blijkt dat de scholing
      of begeleiding niet volgens de overeenkomst kan worden uitgevoerd, treft het bevoegd gezag tijdig een toereikende
      vervangende voorziening.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van
      het eerste lid, waaronder in elk geval voorschriften ter waarborging van de kwaliteit van het daarin bepaalde.

      3 Voor zover betrokkene de werkzaamheden ten aanzien waarvan hem een geschiktheidsverklaring is verstrekt, verricht
      bij twee of meer bevoegde gezagsorganen, dragen deze bevoegde gezagsorganen er zorg voor dat de overeenkomsten,
      bedoeld in het eerste lid, waarbij zij ten aanzien van betrokkene partij zijn, op elkaar worden afgestemd. Zonodig
      wordt een al gesloten overeenkomst daartoe gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel38
  - number: 38a
    text: Het bevoegd gezag draagt er zorg voor dat de rechtspositie van het personeel wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel38a
  - number: '39'
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat de rector, de directeur, de conrectoren, de adjunct-directeuren, de
      leden van de centrale directie, de leraren en het overige personeel.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel39
  - number: 39a
    text: |-
      1 Het bevoegd gezag benoemt de rector, de directeur, de conrector en de adjunct-directeur, de centrale directie, de
      leraren en het overige personeel, bedoeld in [artikel 39][ref1], in algemene dienst van het bevoegd gezag.

      2 Onder benoeming in algemene dienst van het bevoegd gezag wordt in dit artikel verstaan een benoeming ten behoeve
      van het verrichten van werkzaamheden aan door het bevoegd gezag in stand gehouden scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel39
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '39'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 39a1
    text: |-
      1 Het bevoegd gezag draagt er zorg voor dat afschriften van de bewijsstukken waarmee de bekwaamheid
      wordt aangetoond, van de geschiktheidsverklaringen, van de verklaringen omtrent het gedrag en van de
      arbeidsovereenkomsten van het aan de school verbonden personeel worden bewaard.

      2 Het eerste lid is van overeenkomstige toepassing op personeel dat is tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel39a1
  - number: 39c
    text: |-
      1 Het bevoegd gezag is verplicht aan ho-studenten die in opleiding zijn voor een functie in het voortgezet
      onderwijs, in de educatie of het beroepsonderwijs, bedoeld in de [Wet educatie en beroepsonderwijs][ref1], in het
      hoger beroepsonderwijs of in het basisonderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste
      ervaring in de school te verkrijgen.

      2 De verplichting, bedoeld in het eerste lid, betreft ho-studenten die zijn ingeschreven voor een opleiding voor
      het beroep van leraar waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] betrekking heeft
      of anderszins studeren om aan de bekwaamheidseisen te voldoen.

      3 Het in uren uitgedrukte aantal lessen en onderdelen van het in schooltijd verzorgd onderwijsprogramma waarvoor
      het bevoegd gezag in enig schooljaar verplicht is, ho-studenten als bedoeld in het eerste lid tot de school toe te
      laten, bedraagt gezamenlijk 5 procent van het in uren uitgedrukte totale aantal in dat schooljaar te geven lessen
      en te verzorgen onderdelen van het in schooltijd verzorgd onderwijsprogramma. Onze Minister kan het percentage
      lager stellen.

      4 Een bevoegd gezag kan een ho-student de verdere toegang tot de school ontzeggen, indien deze in de school in
      strijd handelt met de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang
      tot de school wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van de
      betrokken opleidingsinstelling dan wel aan de betrokken staatsexamencommissie, en aan de inspectie.

      5 De rector of de directeur dan wel de centrale directie regelt, onder verantwoordelijkheid van het bevoegd gezag,
      de werkzaamheden in verband met de begeleiding door de leraren van de ho-studenten in de school in overeenstemming
      met de leraren, alsmede in overeenstemming met de betrokken opleidingsinstellingen, dan wel, indien het betreft
      ho-studenten die zich voorbereiden op het afleggen van een staatsexamen ter verkrijging van een bewijs van
      bekwaamheid, in overeenstemming met de betrokken staatsexamencommissie.

      6 Onze Minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor een schooljaar.

      7 De scholen waarop ho-studenten als bedoeld in het eerste lid, zijn toegelaten, zijn toegankelijk voor de
      inspectie belast met het toezicht op de opleidingsinstellingen, voor de directieleden en de door deze aan te
      wijzen docenten van die opleidingsinstellingen, alsmede voor de leden van de betrokken staatsexamencommissies,
      een en ander voor zover zulks voor de uitoefening van het toezicht op de praktische vorming onderscheidenlijk de
      begeleiding van de praktische vorming van de in de school aanwezige ho-studenten noodzakelijk is.

      8 Bij of krachtens algemene maatregel van bestuur worden in verband met het bepaalde in dit artikel nadere
      voorschriften gegeven, betreffende de navolgende onderwerpen:

      a. het maximum aantal lessen in een vak van een schoolsoort, gedurende dewelke het bevoegd gezag in enig schooljaar
      verplicht is ho-studenten als bedoeld in het eerste lid, toe te laten, welk maximum de 20 procent niet te boven
      mag gaan;

      b. het maximum aantal ho-studenten als bedoeld in het eerste lid, dat bij dezelfde les kan worden toegelaten, welk
      maximum, behoudens bijzondere omstandigheden, de 3 niet te boven mag gaan, alsmede de gevolgen die het toelaten van
      meer dan een ho-student bij dezelfde les heeft voor het maximum, bedoeld in het derde lid, en het maximum, bedoeld
      in dit lid onder a.

      9 Bij of krachtens algemene maatregel van bestuur kunnen in verband met het bepaalde in dit artikel nadere
      voorschriften worden gegeven, betreffende de navolgende onderwerpen:

      a. de wijze van aanmelden van ho-studenten als bedoeld in het eerste lid, alsmede de termijn die voor de aanmelding
      door het bevoegd gezag mag worden gesteld;

      b. de wijze waarop door de school bekendheid moet worden gegeven aan opleidingsinstellingen en
      staatsexamencommissies over de beschikbaarheid en de aard van schoolpracticumplaatsen;

      c. de categorieën ho-studenten ten aanzien van wie de verplichting, bedoeld in het eerste lid, niet geldt;

      d. regulering in de situatie dat, bij een beperkte beschikbaarheid van schoolpracticumplaatsen aan de school,
      gelijktijdig ho-studenten die in opleiding zijn voor een functie in het voortgezet onderwijs, en ho-studenten die
      in opleiding zijn voor een functie in het basisonderwijs, worden aangemeld;

      e. de vakken en andere programma-onderdelen van een schoolsoort, waarvoor in verband met de geringe omvang van het
      onderwijs daarin, de in het eerste lid bedoelde verplichting niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0005682
