  - number: 118z
    text: |-
      1 De [artikelen 10][ref1], [10b][ref2] en [10d][ref3], zoals luidend ingevolge de Wet van 10 februari 2016 tot
      wijziging van de Wet op het voortgezet onderwijs, de Wet voortgezet onderwijs BES en enkele aanverwante wetten in
      verband met het invoeren van profielen in het voorbereidend beroepsonderwijs en het middelbaar algemeen voortgezet
      onderwijs, alsmede de actualisatie en flexibilisering van het beroepsgerichte deel van de examenprogramma’s in
      het voorbereidend beroepsonderwijs (Stb. 2016, 88) zijn voor alle scholen, bedoeld in de [artikelen 9][ref4] en
      [10a][ref5] van toepassing:

      a. met ingang van 1 augustus 2016 op het derde leerjaar, en

      b. met ingang van 1 augustus 2017 op het vierde leerjaar.

      2 Met betrekking tot het vierde leerjaar waarop de [artikelen 10][ref6], [10b][ref7] en [10d][ref8], zoals luidend
      ingevolge de Wet van 10 februari 2016 tot wijziging van de Wet op het voortgezet onderwijs, de Wet voortgezet
      onderwijs BES en enkele aanverwante wetten in verband met het invoeren van profielen in het voorbereidend
      beroepsonderwijs en het middelbaar algemeen voortgezet onderwijs, alsmede de actualisatie en flexibilisering van
      het beroepsgerichte deel van de examenprogramma’s in het voorbereidend beroepsonderwijs (Stb. 2016, 88) nog niet
      van toepassing zijn, blijven van toepassing de bij en krachtens deze wet gegeven voorschriften zoals luidend op
      31 juli 2016.

      3 In het schooljaar 2016–2017 wordt voor de laatste maal gelegenheid gegeven tot het afleggen van het eindexamen
      voorbereidend middelbaar beroepsonderwijs volgens de op 31 juli 2016 bij of krachtens deze wet vastgestelde
      voorschriften, voor de leerlingen die voor 1 augustus 2016 zijn toegelaten tot het vierde leerjaar.

      4 In afwijking van het derde lid, stelt het bevoegd gezag in het schooljaar 2017–2018 een eerder afgewezen leerling
      nogmaals in de gelegenheid het in dat lid bedoelde examen af te leggen.

      5 In het studiejaar 2018–2019 wordt voor de laatste maal gelegenheid gegeven tot het afleggen
      van het examen van een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref9], voor zover gericht op
      het behalen van het diploma middelbaar algemeen voortgezet onderwijs, volgens de op 31 juli 2016 geldende bij en
      krachtens de [Wet educatie en beroepsonderwijs][ref10] vastgestelde voorschriften.

      6 In het jaar 2020 wordt voor de laatste maal gelegenheid gegeven tot het afleggen van het staatsexamen
      voorbereidend middelbaar beroepsonderwijs volgens de op 31 juli 2016 geldende bij en krachtens deze wet
      vastgestelde voorschriften.

      7 Dit artikel vervalt met ingang van 1 augustus 2021.


