  - number: 23a
    text: |-
      Het bevoegd gezag draagt zorg voor de kwaliteit van het onderwijs op de school. Onder zorg dragen voor de kwaliteit
      van het onderwijs wordt in elk geval verstaan het naleven van de bij of krachtens deze wet gegeven voorschriften en
      het uitvoeren van het stelsel van kwaliteitszorg, bedoeld in [artikel 24, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 23a1
    text: |-
      1 De kwaliteit van het onderwijs is zeer zwak indien de leerresultaten van het voorbereidend wetenschappelijk
      onderwijs, het hoger algemeen voortgezet onderwijs, het middelbaar algemeen voortgezet onderwijs, het voorbereidend
      beroepsonderwijs, het voorbereidend middelbaar beroepsonderwijs in de theoretische leerweg en de gemengde leerweg,
      het voorbereidend middelbaar beroepsonderwijs in de basisberoepsgerichte leerweg dan wel het voorbereidend
      middelbaar beroepsonderwijs in de kaderberoepsgerichte leerweg ernstig en langdurig tekortschieten en het bevoegd
      gezag in verband met dit tekortschieten eveneens tekortschiet in de naleving van een of meer bij of krachtens deze
      wet gegeven voorschriften. Het bevoegd gezag voldoet in elk geval niet aan de wettelijke opdracht om zorg te dragen
      voor de kwaliteit van het onderwijs, bedoeld in [artikel 23a][ref1], indien de kwaliteit van het onderwijs zeer
      zwak is.

      2 Er is sprake van onvoldoende leerresultaten als bedoeld in het eerste lid indien in de schoolsoort dan wel de
      leerweg, bedoeld in het eerste lid, de gemiddelde eindexamenresultaten en het doorstroomrendement, gemeten over een
      periode van 3 schooljaren, liggen onder de normering, bedoeld in het vierde lid, die daarvoor geldt in vergelijking
      tot die leerresultaten over diezelfde schooljaren van dezelfde schoolsoorten of dezelfde leerwegen met een
      vergelijkbaar leerlingenbestand

      3 Indien de leerresultaten van het onderwijs niet kunnen worden beoordeeld op grond van de regels gesteld bij of
      krachtens het vierde lid, is de kwaliteit van het onderwijs zeer zwak indien het bevoegd gezag ten aanzien van
      het onderwijs, bedoeld in het eerste lid, tekortschiet in de naleving van twee of meer bij of krachtens deze wet
      gegeven voorschriften en het bevoegd gezag dientengevolge tekortschiet in het zorg dragen voor de veiligheid op
      school, bedoeld in [artikel 3b][ref2], of het zodanig inrichten van het onderwijs dat leerlingen een ononderbroken
      ontwikkelingsproces kunnen doorlopen dan wel het afstemmen van het onderwijs op de voortgang in de ontwikkeling van
      de leerlingen, bedoeld in [artikel 2, tweede lid][ref3].

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop
      leerresultaten worden gemeten. Voorts wordt de normering, bedoeld in het tweede lid, bepaald en de aard en het
      aantal van de gegevens die ten minste beschikbaar moeten zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel3b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel2
