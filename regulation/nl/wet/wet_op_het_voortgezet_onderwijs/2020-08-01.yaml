  - number: '78'
    text: |-
      De kosten van de scholen zijn:

      a. huisvestingskosten,

      b. inventariskosten,

      c. personeelskosten, en

      d. exploitatiekosten.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel78
  - number: '84'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden voor de scholen de grondslagen vastgesteld voor de omvang
      van de formatie van:

      a. de rectoren, directeuren, conrectoren en adjunct-directeuren,

      b. de leraren, en

      c. het onderwijsondersteunend personeel.

      De formatie is redelijkerwijs voldoende voor het leiden en beheren van de school, wat de onder a genoemde
      personeelscategorie betreft, voor het geven van onderwijs, wat de onder b genoemde personeelscategorie betreft,
      en voor de overige werkzaamheden voortvloeiende uit het geven van onderwijs, alsmede voor de ondersteuning van het
      onderwijs, wat de onder c genoemde personeelscategorie betreft.

      2 De grondslagen van de berekening van de omvang van de formatie worden wat betreft het in het eerste lid onder
      a, b en c genoemde personeel in elk geval gevormd door een normatieve relatie tussen het aantal leerlingen en het
      aantal personeelsleden van de school, onderscheiden naar personeelscategorieën.

      3 De grondslagen worden wat het in het eerste lid onder b genoemde personeel betreft bovendien gevormd door een
      vast aantal formatieplaatsen.

      4 Voor het in het eerste lid, onderdeel b, bedoelde personeel wordt voor scholen met leerwegondersteunend
      onderwijs dat op grond van [artikel 70][ref1] dan wel [artikel 17a1, tweede lid][ref2], in aanmerking komt voor
      bekostiging, een afzonderlijke grondslag vastgesteld op basis van het aantal leerlingen in dat onderwijs voor
      wie het samenwerkingsverband heeft bepaald dat zij op dat onderwijs zijn aangewezen of toelaatbaar zijn tot het
      praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a1
