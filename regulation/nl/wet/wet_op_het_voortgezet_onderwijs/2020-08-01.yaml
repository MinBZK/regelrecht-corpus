  - number: 10b9
    text: |-
      1 De entreeopleiding, bedoeld in [artikel 10b8][ref1], wordt onder verantwoordelijkheid van het bevoegd gezag
      verzorgd op grond van een samenwerkingsovereenkomst tussen het bevoegd gezag van de school en het bevoegd gezag van
      een instelling voor beroepsonderwijs waarvan het onderwijsaanbod mede deze entreeopleiding omvat.

      2 Een samenwerkingsovereenkomst als bedoeld in het eerste lid voorziet in elk geval in afspraken over:

      a. de entreeopleiding die geheel of gedeeltelijk in plaats van de basisberoepsgerichte leerweg zal worden verzorgd,

      b. de inschrijving van leerlingen als extraneus bij de instelling,

      c. de examinering en diplomering door de instelling,

      d. de invulling van de betrokkenheid van het bevoegd gezag bij de beroepspraktijkvorming, bedoeld in de
      [artikelen 7.2.8][ref2] en [7.2.9 van de Wet educatie en beroepsonderwijs][ref3], met dien verstande dat het
      bevoegd gezag de in dat [artikel 7.2.9][ref4] bedoelde overeenkomst mede ondertekent,

      e. de toepassing van [artikel 10b8, tweede lid][ref5],

      f. de rechtsbescherming van de leerling, en

      g. de doorstroom van de leerlingen na het met goed gevolg afsluiten van de entreeopleiding.

      3 In geval van toepassing van [artikel 7.4.4a, derde lid, van de Wet educatie en beroepsonderwijs][ref6], is het
      bevoegd gezag belast met de uitvoering van de daar bedoelde examinering.

      4 Indien het bevoegd gezag tevens het bevoegd gezag is van een instelling voor beroepsonderwijs, regelt het bevoegd
      gezag op overeenkomstige wijze de onderwerpen, genoemd in het tweede lid.


