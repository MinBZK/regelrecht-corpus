  - number: '107'
    text: |-
      1 Een openbare school wordt opgeheven en de bekostiging van een bijzondere school wordt beëindigd indien de school
      gedurende drie achtereenvolgende schooljaren telkens is bezocht door een aantal leerlingen dat minder bedraagt dan:

      a. voor een school voor praktijkonderwijs: 70 leerlingen,

      b. voor een school voor voorbereidend beroepsonderwijs met één of twee profielen als bedoeld in
      [artikel 10b, derde lid][ref1]: 195 leerlingen,

      c. voor een school voor voorbereidend beroepsonderwijs met drie of vier profielen als bedoeld in
      [artikel 10b, derde lid][ref2]: 240 leerlingen,

      d. voor een school voor voorbereidend beroepsonderwijs met vijf of meer profielen als bedoeld in
      [artikel 10b, derde lid][ref3]: 360 leerlingen, en

      e. voor de overige scholen: drie kwart van het aantal leerlingen dat voor de desbetreffende schoolsoort is genoemd
      in [artikel 64, eerste lid][ref4].

      2 Een openbare scholengemeenschap wordt opgeheven en de bekostiging van een bijzondere scholengemeenschap
      wordt beëindigd indien de scholengemeenschap gedurende drie achtereenvolgende schooljaren telkens is
      bezocht door een aantal leerlingen dat minder bedraagt dan de helft van het aantal leerlingen dat op grond
      van [artikel 64, eerste lid][ref5], vereist is voor stichting van de scholen die deel uitmaken van de
      scholengemeenschap, met dien verstande dat het voor scholen voor voorbereidend beroepsonderwijs binnen een
      scholengemeenschap gaat om:

      a. voor een school met één of twee profielen als bedoeld in [artikel 10b, derde lid][ref6]: 130 leerlingen,

      b. voor een school met drie of vier profielen als bedoeld in [artikel 10b, derde lid][ref7]: 160 leerlingen,

      c. voor een school met vijf of zes profielen als bedoeld in [artikel 10b, derde lid][ref8]: 240 leerlingen, en

      d. voor een school met zeven of meer profielen als bedoeld in [artikel 10b, derde lid][ref9]: 360 leerlingen.

      3 Een openbare school binnen een scholengemeenschap wordt opgeheven en de bekostiging van een bijzondere school
      binnen een scholengemeenschap wordt beëindigd indien de school gedurende drie achtereenvolgende jaren:

      a. door nul leerlingen is bezocht indien het gaat om een school voor praktijkonderwijs, of

      b. door nul leerlingen is bezocht voor zover het de hoogste twee leerjaren betreft indien het gaat om een school
      voor vwo, havo, mavo of vbo.

      4 Indien een profiel als bedoeld in [artikel 10b][ref10] of [10d][ref11] aan een school voor voorbereidend
      beroepsonderwijs gedurende drie achtereenvolgende schooljaren telkens door nul leerlingen gevolgd is, wordt dat
      profiel aan een openbare school opgeheven, of gaat de aanspraak op bekostiging voor dat profiel aan een bijzondere
      school verloren met ingang van 1 augustus volgend op die drie achtereenvolgende schooljaren.

      5 De opheffing van een openbare school of scholengemeenschap of de beëindiging van de bekostiging van een
      bijzondere school of scholengemeenschap geschiedt met ingang van 1 augustus volgend op de drie achtereenvolgende
      schooljaren, bedoeld in het eerste of tweede lid.


