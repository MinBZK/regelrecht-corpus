  - number: 24g
    text: |-
      1 Het bevoegd gezag van een school legt elke twee jaar in een reglement, leerlingenstatuut genaamd, de rechten en
      plichten van de leerlingen vast.

      2 In het leerlingenstatuut worden in elk geval voorschriften opgenomen, strekkende tot handhaving van de goede gang
      van zaken binnen de instelling en, de wijze waarop uitvoering wordt gegeven aan de bescherming van gegevens uit de
      persoonlijke levenssfeer.

      3 Het bevoegd gezag draagt er zorg voor dat een exemplaar van het leerlingenstatuut in het gebouw van de instelling
      ter inzage wordt gelegd op een voor de leerlingen toegankelijke plaats.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel24g
  - number: '25'
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs aan een school kan Onze Minister besluiten toe te staan
      dat van de [artikelen 6d][ref1], [6g][ref2], [6g1][ref3], [7 tot en met 11f][ref4], [12 tot en met 15][ref5], en
      van de voorschriften, bedoeld in [artikel 22][ref6], wordt afgeweken. Onze Minister besluit binnen zes maanden na
      ontvangst van een aanvraag.


