  - number: 118jj
    text: |-
      1 De eindexamens omvatten voor leerlingen die geen eindexamen in het vak wiskunde afleggen een schoolexamen
      rekenen. Bij de vaststelling van de opgaven van dit schoolexamen worden de referentieniveaus rekenen in acht
      genomen die voor de desbetreffende schoolsoorten of voor dan wel binnen leerwegen zijn vastgesteld op grond van
      [artikel 2, tweede lid, aanhef en onderdeel c, van de Wet referentieniveaus Nederlandse taal en rekenen][ref1].

      2 Bij of krachtens algemene maatregel van bestuur worden omtrent dit schoolexamen nadere voorschriften vastgesteld.

      3 Dit artikel is ook van toepassing op leerlingen die het eindexamen afleggen aan een school die is aangewezen op
      grond van [artikel 56][ref2].

      4 Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel56
