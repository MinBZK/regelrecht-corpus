      [artikel III, onderdeel E, van de in het tweede lid genoemde wet][ref4].

      4 Dit artikel vervalt met ingang van 1 augustus van het vijfde schooljaar na inwerkingtreding van de in het tweede
      lid genoemde [wet][ref5].


