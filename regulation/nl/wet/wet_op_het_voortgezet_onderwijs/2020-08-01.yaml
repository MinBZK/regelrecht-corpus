  - number: 85b1
    text: |-
      1 In aanvulling op de bekostiging van [artikel 85b][ref1], ontvangt het samenwerkingsverband aanvullende
      personeelsbekostiging voor leerwegondersteunend onderwijs, praktijkonderwijs en bekostiging voor regionale
      ondersteuning als bedoeld in het tweede, derde en vierde lid.

      2 De in het eerste lid bedoelde bekostiging voor leerwegondersteunend onderwijs bestaat uit een bij ministeriële
      regeling vast te stellen bedrag per leerling. Het aantal leerlingen wordt bepaald door:

      a. het aantal leerlingen op 1 oktober 2012 op vestigingen in het gebied van het samenwerkingsverband dat is
      ingeschreven als leerling die leerwegondersteunend onderwijs ontvangt uit te drukken in een percentage van het
      totaal aantal leerlingen ingeschreven op vestigingen in het gebied van het samenwerkingsverband op 1 oktober 2012;
      en

      b. het percentage, bedoeld onder a, toe te passen op het aantal leerlingen ingeschreven op vestigingen in het
      gebied van het samenwerkingsverband op 1 oktober van het jaar voorafgaand aan het jaar waarop de bekostiging
      betrekking heeft.

      3 De in het eerste lid bedoelde bekostiging voor praktijkonderwijs bestaat uit een bij ministeriële regeling vast
      te stellen bedrag per leerling. Het aantal leerlingen wordt bepaald door:

      a. het aantal leerlingen op 1 oktober 2012 op vestigingen in het gebied van het samenwerkingsverband dat is
      ingeschreven als leerling op een school voor praktijkonderwijs uit te drukken in een percentage van het totaal
      aantal leerlingen ingeschreven op vestigingen in het gebied van het samenwerkingsverband op 1 oktober 2012; en

      b. het percentage, bedoeld onder a, toe te passen op het aantal leerlingen ingeschreven op vestigingen in het
      gebied van het samenwerkingsverband op 1 oktober van het jaar voorafgaand aan het jaar waarop de bekostiging
      betrekking heeft.

      4 De in het eerste lid bedoelde bekostiging voor regionale ondersteuning bestaat uit een bij ministeriële
      regeling vast te stellen bedrag per leerling die is ingeschreven op een school of vestiging in het gebied van
      het samenwerkingsverband. Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld
      omtrent de vaststelling en uitkering van de in de eerste volzin bedoelde bekostiging voor regionale ondersteuning.

      5 De bedragen per leerling bedoeld in het tweede en het derde lid, zijn de uitkomst van een bij of krachtens
      algemene maatregel van bestuur vast te stellen hoeveelheid formatie per leerling, vermenigvuldigd met een bij
      ministeriële regeling vast te stellen bedrag.

      6 Voor elke leerling die op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt,
      was aangewezen op leerwegondersteunend onderwijs op een vestiging in het gebied van het samenwerkingsverband die
      bekostigd is op grond van [artikel 70][ref2] dan wel [artikel 17a1, tweede lid][ref3], wordt een bij ministeriële
      regeling vast te stellen bedrag in mindering gebracht op de in het eerste lid bedoelde bekostiging van het
      samenwerkingsverband.

      7 Voor elke leerling die op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt,
      was ingeschreven op een vestiging voor praktijkonderwijs in het gebied van het samenwerkingsverband, wordt een bij
      ministeriële regeling vast te stellen bedrag in mindering gebracht op de in het eerste lid bedoelde bekostiging van
      het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel70
