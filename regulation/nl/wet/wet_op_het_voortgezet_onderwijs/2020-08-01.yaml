  - number: 58b
    text: |-
      1 Het bevoegd gezag van een ingevolge [artikel 56][ref1] aangewezen school kan leerlingen in het kader van het
      onderwijs waarvoor zij aan die school zijn ingeschreven in de gelegenheid stellen een doorlopende leerroute
      vmbo-mbo als bedoeld in [artikel 10b10][ref2] of de geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in
      [artikel 10b21][ref3] te volgen.

      2 Toepassing van het eerste lid berust op een samenwerkingsovereenkomst, gesloten tussen het
      bevoegd gezag, bedoeld in het eerste lid, en het bevoegd gezag van een instelling als bedoeld in
      [artikel 1.4.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref4].

      3 De [artikelen 10b10][ref5], [10b11, met uitzondering van het tweede lid, onderdeel e][ref6],
      [10b12 tot en met 10b14][ref7], [10b15, eerste en tweede lid][ref8], [10b16][ref9] en
      [10b19 tot en met 10b21][ref10] zijn van overeenkomstige toepassing, met dien verstande dat
      voor «instelling voor beroepsonderwijs» telkens wordt gelezen «instelling als bedoeld in
      [artikel 1.4.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref11]».


