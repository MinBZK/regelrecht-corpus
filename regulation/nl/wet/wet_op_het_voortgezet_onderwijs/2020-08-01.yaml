  - number: 10g
    text: |-
      1 Aan de ouders van een leerling van wie het bevoegd gezag van de school waar de leerling zich aanmeldt dan wel van
      de school waaraan de leerling is ingeschreven, redelijkerwijs kan aannemen dat deze niet in staat is het onderwijs
      in een van de leerwegen, genoemd in de [artikelen 10][ref1], [10b][ref2] en [10d][ref3], al dan niet in combinatie
      met leerwegondersteunend onderwijs, bedoeld in [artikel 10e][ref4], met een diploma of getuigschrift voorbereidend
      middelbaar beroepsonderwijs als bedoeld in [artikel 29, derde lid][ref5], af te sluiten, kan het bevoegd gezag
      voorstellen deze leerling in plaats daarvan praktijkonderwijs te doen volgen.

      2 Het samenwerkingsverband beslist op aanvraag van het bevoegd gezag of de leerling toelaatbaar is
      tot het praktijkonderwijs. De aanvraag gaat vergezeld van een op de desbetreffende leerling betrekking
      hebbend onderwijskundig rapport als bedoeld in [artikel 42 van de Wet op het primair onderwijs][ref6] en
      [artikel 43 van de Wet op de expertisecentra][ref7] en de op schrift gestelde zienswijze van de ouders. Indien
      het samenwerkingsverband heeft bepaald dat de leerling toelaatbaar is tot het praktijkonderwijs, beslist het
      bevoegd gezag van de school voor praktijkonderwijs na overleg met de ouders van de leerling over de toelating van
      de leerling.

      3 Een aanvraag bij een samenwerkingsverband kan worden ingediend voor een leerling die:

      a. rechtstreeks afkomstig is van een school of instelling als bedoeld in de [Wet op het primair onderwijs][ref8] of
      de [Wet op de expertisecentra][ref9], of

      b. rechtstreeks afkomstig is van het eerste leerjaar van een school voor voortgezet onderwijs.

      4 In afwijking van het derde lid kan een aanvraag slechts worden ingediend na dat schooljaar, indien het een
      vreemdeling betreft als bedoeld in [artikel 27, lid 1a, onderdeel b of c][ref10], die op 1 oktober van het
      schooljaar waarin hij voor het eerst wordt meegeteld als leerling in het voortgezet onderwijs korter dan een jaar
      in Nederland is.

      5 In afwijking van het derde en vierde lid kan tevens een aanvraag voor toelaatbaarheid tot het praktijkonderwijs
      bij een samenwerkingsverband worden ingediend voor een leerling die voldoet aan bij of krachtens algemene maatregel
      van bestuur te stellen criteria.

      6 Een beschikking van een samenwerkingsverband omtrent de toelaatbaarheid van een leerling is geen besluit als
      bedoeld in [artikel 8:4, derde lid, onder b, van de Algemene wet bestuursrecht][ref11].


