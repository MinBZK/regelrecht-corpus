  - number: 10b15
    text: |-
      1 Het bevoegd gezag van de school draagt de gehele cursusduur van een doorlopende leerroute vmbo-mbo zorg voor:

      a. de uitvoering van delen van het onderwijsprogramma die behoren tot het middelbaar algemeen voortgezet onderwijs
      of voorbereidend beroepsonderwijs dat deel uitmaakt van het onderwijsprogramma van die doorlopende leerroute vmbo-
      mbo; en

      b. de examinering en diplomering betreffende het middelbaar algemeen voortgezet onderwijs of voorbereidend
      beroepsonderwijs dat deel uitmaakt van het onderwijsprogramma van die doorlopende leerroute vmbo-mbo.

      2 Ten aanzien van de onderdelen van een doorlopende leerroute vmbo-mbo, bedoeld in het eerste lid, die in
      het derde leerjaar van die route plaatsvinden, is het bepaalde bij of krachtens de [artikelen 103a][ref1]
      en [103b, eerste, vierde, zevende, tiende en twaalfde tot en met vijftiende lid][ref2], [103c][ref3] en
      [103d][ref4], alsmede het bepaalde bij of krachtens de [artikelen 10][ref5], [12][ref6], [14][ref7], [15][ref8] en
      [25 van de Wet register onderwijsdeelnemers][ref9] van overeenkomstige toepassing.

      3 [Artikel 24b][ref10] is van overeenkomstige toepassing op klachten over met de doorlopende leerroute vmbo-
      mbo verband houdende gedragingen en beslissingen van het bevoegd gezag van de instelling voor beroepsonderwijs
      waarmee een samenwerkingsovereenkomst als bedoeld in artikel is [10b11, tweede lid][ref11], is gesloten, of
      van het personeel van dat bevoegd gezag. Onverminderd [artikel 24b, vierde lid][ref12], is de voorzitter van de
      klachtencommissie niet werkzaam voor of bij dat bevoegd gezag.


