  - number: 76f
    text: |-
      1 Burgemeester en wethouders stellen, na overleg met de bevoegde gezagsorganen van de andere dan gemeentelijke
      scholen op het grondgebied van de gemeente, jaarlijks ten behoeve van het onderwijs op het grondgebied van de
      gemeente voor een door hen te bepalen tijdstip een programma als bedoeld in het tweede lid vast. Het programma
      heeft betrekking op scholen als bedoeld in [artikel 76d, eerste lid, onderdelen a tot en met e][ref1].

      2 Het programma omvat de voorzieningen in de huisvesting, bedoeld in [artikel 76c][ref2], die in het jaar na de
      vaststelling van het programma voor bekostiging in aanmerking zullen worden gebracht voor andere dan gemeentelijke
      scholen en voorzieningen die nodig zijn voor gemeentelijke scholen.

      3 Burgemeester en wethouders nemen uitsluitend voorzieningen in de huisvesting in het programma op, voor zover:

      a. met de voorzieningen in het kalenderjaar volgend op het jaar van vaststelling van het programma redelijkerwijs
      een aanvang kan worden gemaakt dan wel de voorziening wordt gerealiseerd, en

      b. niet een van de weigeringsgronden, genoemd in [artikel 76k][ref3], van toepassing is.

      4 Indien het bekostigingsplafond, bedoeld in [artikel 76d][ref4], niet toereikend is, worden die voorzieningen in
      het programma opgenomen die uit dat bekostigingsplafond kunnen worden bekostigd, waarbij de volgorde wordt bepaald
      met inachtneming van de criteria, bedoeld in [artikel 76m, eerste lid, onderdeel c][ref5].

      5 De beschikking van burgemeester en wethouders kan een gedeelte van de gewenste voorziening dan wel een andere
      voorziening dan gewenst omvatten.

      6 Burgemeester en wethouders kunnen aan de opneming in het programma voorwaarden verbinden betreffende
      ingebruikneming of buitengebruikstelling van gebouwen of lokalen.

      7 Burgemeester en wethouders nemen bij de vaststelling van het programma de criteria, bedoeld in
      [artikel 76m, eerste lid, onderdeel c][ref6], in acht.

      8 Binnen vier weken na de vaststelling van het programma treden burgemeester en wethouders met het bevoegd gezag
      in overleg over de wijze van uitvoering. Indien dit overleg niet tot overeenstemming leidt, delen burgemeester en
      wethouders het bevoegd gezag mede dat zij niet kunnen instemmen met de door het bevoegd gezag gewenste wijze van
      uitvoering.

      9 Tijdens het in het eerste lid bedoelde overleg kunnen burgemeester en wethouders de Onderwijsraad verzoeken een
      advies uit te brengen over de vaststelling van het programma huisvestingsvoorzieningen in relatie tot de vrijheid
      van richting en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd
      dan wel uit eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht.
      Het advies wordt binnen vier weken uitgebracht aan burgemeester en wethouders. Het advies wordt bekend gemaakt
      tezamen met het programma.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76c
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel76k
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
