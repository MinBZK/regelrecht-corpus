  - number: 41o
    text: |-
      1 Er is een registervoorportaal. In het registervoorportaal zijn van leraren die zijn benoemd of
      tewerkgesteld zonder benoeming en niet voldoen aan de bekwaamheidseisen van het onderwijs dat zij verzorgen
      persoonsidentificerende gegevens en gegevens betreffende de school en de benoeming of tewerkstelling opgenomen.

      2 Het registervoorportaal heeft tot doel het inzichtelijk maken welke leraren die zijn benoemd of tewerkgesteld
      zonder benoeming niet voldoen aan de bekwaamheidseisen van het onderwijs dat zij verzorgen.

      3 In aanvulling op het tweede lid heeft het registervoorportaal tot doel gegevens te verstrekken:

      a. aan Onze Minister ten behoeve van de beleidsvorming; en

      b. aan de inspectie voor zover de verwerking van die gegevens noodzakelijk is voor de goede vervulling van haar
      publieke taak.

      4 Het eerste lid, is niet van toepassing op leraren die zijn benoemd of tewerkgesteld zonder benoeming op grond van
      [artikel 33, vijftiende lid][ref1].

      5 Onze Minister draagt zorg voor het beheer van het registervoorportaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
