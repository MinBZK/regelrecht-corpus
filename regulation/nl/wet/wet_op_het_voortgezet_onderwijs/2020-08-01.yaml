        artikel: '5'
  - number: '62'
    text: |-
      In deze afdeling worden de onder a tot en met d aangegeven schoolsoorten aangeduid met de daarbij vermelde
      afkortingen:

      a. vwo: voorbereidend wetenschappelijk onderwijs,

      b. havo: hoger algemeen voortgezet onderwijs,

      c. mavo: middelbaar algemeen voortgezet onderwijs,

      d. vbo: voorbereidend beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel62
  - number: '63'
    text: |-
      1 Bekostiging uit ’s Rijks kas van een school of scholengemeenschap neemt geen aanvang dan krachtens de bepalingen
      van deze afdeling.

      2 [Artikel 4:32 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de bekostiging van scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel432
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:32
  - number: '64'
    text: |-
      1 Onze Minister brengt een openbare of bijzondere school voor bekostiging in aanmerking indien redelijkerwijs kan
      worden aangenomen dat deze school zal worden bezocht door ten minste:

      a. 390 leerlingen voor een school voor vwo,

      b. 325 leerlingen voor een school voor havo en 130 leerlingen voor een afdeling voor havo,

      c. 260 leerlingen voor een school voor mavo,

      d. 260 leerlingen voor een school voor vbo met 1 profiel als bedoeld in [artikel 10b, derde lid][ref1],

      e. 160 leerlingen voor elk profiel van een school voor vbo indien meer dan 1 profiel binnen de school voor
      bekostiging in aanmerking wordt gebracht, of

      f. 120 leerlingen voor een school voor praktijkonderwijs.

      2 Onze Minister brengt een openbare of bijzondere scholengemeenschap voor bekostiging in aanmerking indien
      redelijkerwijs kan worden aangenomen dat het aantal leerlingen van elk van de samenstellende scholen ten minste
      drie kwart zal bedragen van het daarvoor in het eerste lid genoemde aantal.

      3 Onze Minister kan een school of scholengemeenschap die ontstaat na splitsing van een school of scholengemeenschap
      voor bekostiging in aanmerking brengen indien wordt voldaan aan voorwaarden die bij ministeriële regeling zijn
      vastgesteld. Deze voorwaarden zullen in elk geval betrekking hebben op:

      a. het aantal leerlingen op de teldatum in het jaar voorafgaand aan de aanvraag van de te splitsen school of van
      een of meer van de samenstellende scholen van de te splitsen scholengemeenschap, en

      b. het aantal leerlingen waarvan redelijkerwijs kan worden aangenomen dat deze na de splitsing de scholen of de
      samenstellende scholen van de scholengemeenschap zal bezoeken.

      4 Onze Minister kan een openbare school of scholengemeenschap waarvoor een aanvraag als bedoeld in
      [artikel 66, eerste lid][ref2], is ingediend, voor bekostiging in aanmerking brengen. Onze Minister brengt een
      openbare school of scholengemeenschap waarvoor een aanvraag als bedoeld in artikel 66, tweede lid, is ingediend
      voor bekostiging in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel66
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel64
