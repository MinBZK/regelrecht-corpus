  - number: '27'
    text: |-
      1 Het bevoegd gezag beslist over de toelating van leerlingen, met inachtneming van deze paragraaf. Bij of
      krachtens algemene maatregel van bestuur kunnen voor elke soort van scholen of voor aan scholen als bedoeld in
      [artikel 10a][ref1] verzorgde profielen voorwaarden voor de toelating en voorschriften omtrent verwijdering en
      voorwaardelijke bevordering worden vastgesteld. De algemene maatregel van bestuur bedoeld in de tweede volzin
      houdt in elk geval voorschriften in met betrekking tot de voorwaarden voor de toelating tot de scholen, bedoeld
      in de [artikelen 7][ref2], [8][ref3], [9][ref4] en [10a][ref5]. Definitieve verwijdering van een leerling
      waarop de [Leerplichtwet 1969][ref6] van toepassing is, vindt niet plaats dan nadat het bevoegd gezag ervoor heeft
      zorggedragen dat een andere school, een school voor voortgezet speciaal onderwijs, een school voor speciaal en
      voortgezet speciaal onderwijs, een instelling voor speciaal en voortgezet speciaal onderwijs dan wel een instelling
      als bedoeld in [artikel 1, onder c, van de Leerplichtwet 1969][ref7] bereid is de leerling toe te laten.

      1a Voor het volgen van een vorm van onderwijs als onderscheiden in [artikel 5][ref8] aan een school wordt
      uitsluitend als leerling toegelaten degene waarvan de ouders, voogden of verzorgers aantonen, dan wel, indien hij
      meerderjarig en handelingsbekwaam is, degene die aantoont dat hij:

      a. de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,

      b. vreemdeling is en jonger is dan 18 jaar op de eerste schooldag waarop de vorm van voortgezet onderwijs als
      onderscheiden in [artikel 5][ref9] begint waarvoor voor de eerste maal toelating wordt gewenst,

      c. vreemdeling is, 18 jaar of ouder is op de eerste schooldag waarop de vorm van voortgezet onderwijs als
      onderscheiden in [artikel 5][ref10] begint waarvoor voor de eerste maal toelating wordt gewenst en op die dag
      rechtmatig verblijf houdt in de zin van [artikel 8 van de Vreemdelingenwet 2000][ref11], of

      d. vreemdeling is, niet meer voldoet aan een van de voorwaarden, genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen voor een vorm van voortgezet onderwijs als onderscheiden in [artikel 5][ref12] is
      toegelaten tot een school, welke vorm van voortgezet onderwijs nog steeds wordt gevolgd en nog niet is voltooid.

      1b Indien na de toelating tot de school blijkt dat deze op welke grond dan ook niet in overeenstemming met lid 1a
      heeft plaatsgevonden, wordt de leerling onmiddellijk verwijderd.

      1c De toelating van de leerling wordt gebaseerd op het schooladvies, bedoeld
      in [artikel 42, tweede lid, van de Wet op het primair onderwijs][ref13] of
      [artikel 43, tweede lid, van de Wet op de expertisecentra][ref14].

      2 De toelating wordt niet afhankelijk gesteld van een andere dan een bij of krachtens de wet geregelde bijdrage.

      2a De aanmelding van leerlingen voor toelating geschiedt schriftelijk. De ouders doen de aanmelding zo mogelijk ten
      minste 10 weken voor de datum waarop toelating wordt gevraagd en geven bij de aanmelding aan bij welke school of
      scholen eveneens om toelating is verzocht.

      2b Het bevoegd gezag beoordeelt of de aanmelding een leerling betreft die extra ondersteuning behoeft. Hiertoe
      kan het bevoegd gezag de ouders verzoeken gegevens te overleggen betreffende stoornissen of handicaps van de
      leerling of beperkingen in de onderwijsparticipatie. Onder extra ondersteuning wordt niet verstaan ondersteuning
      ter bevordering van de beheersing van de Nederlandse taal met het oog op het voorkomen en bestrijden van
      onderwijsachterstanden.

      2c Indien de toelating van een leerling die extra ondersteuning behoeft, wordt geweigerd, vindt de weigering niet
      plaats dan nadat het bevoegd gezag er, na overleg met de ouders en met inachtneming van de ondersteuningsbehoefte
      van de leerling en de schoolondersteuningsprofielen van de betrokken scholen, voor heeft zorg gedragen dat een
      andere school bereid is de leerling toe te laten. Onder andere school kan ook worden verstaan een school voor
      voortgezet speciaal onderwijs, een school voor speciaal en voortgezet speciaal onderwijs, een instelling voor
      speciaal en voortgezet speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref15] of een instelling
      als bedoeld in [artikel 1, onder c, van de Leerplichtwet 1969][ref16].

      2d De leden 2b en 2c zijn niet van toepassing:

      a. indien op de school waar de leerling is aangemeld geen plaatsruimte beschikbaar is, of

      b. indien het bevoegd gezag de ouders bij de aanmelding verzoekt te verklaren dat zij de grondslag van het
      onderwijs op de school zullen respecteren dan wel te verklaren dat zij de grondslag van het onderwijs op de school
      zullen onderschrijven, en de ouders dit weigeren te verklaren, of

      c. indien de leerling niet voldoet aan de voorwaarden voor toelating gesteld bij of krachtens de algemene maatregel
      van bestuur, bedoeld in het eerste lid.

      2e Het bevoegd gezag neemt de beslissing over toelating van een leerling zo spoedig mogelijk doch uiterlijk 6
      weken na ontvangst van de aanmelding. Indien de beslissing, bedoeld in de vorige volzin, niet binnen 6 weken kan
      worden gegeven, deelt het bevoegd gezag dit aan de ouders mede en noemt het daarbij een zo kort mogelijke termijn
      waarbinnen de beslissing wel tegemoet kan worden gezien, welke termijn ten hoogste 4 weken bedraagt.

      2f Indien de aanmelding een leerling betreft die niet is ingeschreven op een andere school, een school voor
      voortgezet speciaal onderwijs, een school voor speciaal en voortgezet speciaal onderwijs of een instelling voor
      speciaal en voortgezet speciaal onderwijs voor wat betreft het daaraan verzorgde voortgezet speciaal onderwijs,
      en de beslissing over de toelating is 10 weken na de dag waarop het verzoek om toelating is gedaan nog niet
      genomen, wordt de leerling met ingang van de dag volgend op bedoelde 10 weken, doch niet eerder dan de datum waarop
      de leerling voldoet aan de voorwaarden om te kunnen worden toegelaten tot de school, tijdelijk geplaatst op de
      school en als leerling ingeschreven. Indien de leerling wordt toegelaten, wordt de tijdelijke plaatsing omgezet
      in een definitieve plaatsing. Indien de toelating van de leerling wordt geweigerd of een beslissing wordt genomen
      de aanmelding niet te behandelen, wordt de tijdelijke plaatsing beëindigd en wordt de leerling uitgeschreven
      met ingang van de dag die volgt op de dag waarop de toelating wordt geweigerd of de beslissing wordt genomen de
      aanmelding niet te behandelen.

      2g Het bevoegd gezag van een bijzondere school kan beslissen een aanmelding voor toelating niet te behandelen,
      indien de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanmelding of voor
      de voorbereiding van de toelatingsbeslissing, mits de ouders dan wel, indien de leerling meerderjarig en
      handelingsbekwaam is, de leerling, de gelegenheid hebben gehad de aanmelding binnen een door het bevoegd gezag
      gestelde termijn aan te vullen. Een beslissing om de aanmelding niet te behandelen wordt aan de ouders dan wel de
      leerling bekendgemaakt binnen vier weken nadat de aanmelding is aangevuld of nadat de daarvoor gestelde termijn
      ongebruikt is verstreken. De termijn voor het nemen van de toelatingsbeslissing wordt opgeschort met ingang van de
      dag waarop het bevoegd gezag krachtens de eerste volzin de ouders dan wel de leerling uitnodigt de aanmelding aan
      te vullen, tot de dag waarop de aanmelding is aangevuld of de daarvoor gestelde termijn ongebruikt is verstreken.

      3 Een leerling mag geen praktijkonderwijs meer volgen aan een school voor praktijkonderwijs na afloop van het
      schooljaar waarin hij de leeftijd van achttien jaren heeft bereikt. Op aanvraag van het bevoegd gezag, gedaan
      in het in de eerste volzin bedoelde schooljaar, kan de inspectie besluiten dat de leerling het daaropvolgende
      schooljaar praktijkonderwijs kan blijven volgen, indien zij van mening is dat zonder het volgen van dit schooljaar
      de leerling niet voldoende is voorbereid op de functies, bedoeld in [artikel 10f, derde lid, eerste volzin][ref17].
      De inspectie kan de tweede volzin op overeenkomstige wijze toepassen in het schooljaar waarin de leerling de
      leeftijd van 19 jaren heeft bereikt.

      4 Op bezwaarschriften tegen beslissingen over toelating of verwijdering van leerlingen, beslist het
      bevoegd gezag, voor zover het een bevoegd gezag van een openbare school betreft in afwijking van
      [artikel 7:10 van de Algemene wet bestuursrecht][ref18], binnen 4 weken na ontvangst van het bezwaarschrift, doch
      niet eerder dan nadat de leerling en, indien deze jonger is dan 18 jaar, ook diens ouders, voogden of verzorgers,
      in de gelegenheid is, respectievelijk zijn gesteld, te worden gehoord en kennis heeft, respectievelijk hebben
      kunnen nemen van de op die beslissingen betrekking hebbende adviezen of rapporten.


