    text: |-
      1 Voor leerlingen die op de datum van inwerkingtreding van artikel I, onderdelen C en D van de Wet tot wijziging
      van de Wet op het voortgezet onderwijs in verband met de integratie van het leerwegondersteunend onderwijs
      en praktijkonderwijs in het systeem van passend onderwijs (Integratie lwoo en pro in passend onderwijs) (Stb.
      XXX, XXX) door een regionale verwijzingscommissie zijn geïndiceerd voor leerwegondersteunend onderwijs of
      praktijkonderwijs op grond van [artikel 10e][ref1], respectievelijk [10g][ref2], van deze wet zoals die luidden
      op de dag voor die inwerkingtreding van artikel I, onderdelen A en B, van die wet, blijft de indicatie gelden na
      inwerkingtreding van die wet.

      2 In afwijking van het eerste lid, geldt de indicatie van de in het eerste lid bedoelde leerlingen die voor het
      eerst met ingang van het eerstvolgende schooljaar na inwerkingtreding van de Wet tot wijziging van de Wet op het
      voortgezet onderwijs in verband met de integratie van het leerwegondersteunend onderwijs en praktijkonderwijs in
      het systeem van passend onderwijs (Integratie lwoo en pro in passend onderwijs) (Stb. XXX, XXX) gebruik maken van
      de indicatie, tot de datum van inwerkingtreding van artikel I, onderdelen C en D, van die wet.


