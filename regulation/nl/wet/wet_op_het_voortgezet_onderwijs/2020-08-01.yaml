      1 Een school voor voorbereidend beroepsonderwijs als bedoeld in [artikel 10a][ref1], die voor 1 augustus 2016 in
      aanmerking is gebracht voor bekostiging van een of meer bij regeling van Onze Minister aan te wijzen afdelingen
      als bedoeld in [artikel 10c][ref2], zoals dat artikel luidde op 31 juli 2016, komt met ingang van 1 augustus
      2016 in aanmerking voor bekostiging van een of meer bij die regeling aan te wijzen profielen als bedoeld in
      [artikel 10b, derde lid][ref3], en [10d, derde lid][ref4].

      2 In de regeling, bedoeld in het eerste lid, kunnen tevens voorwaarden worden gesteld waaronder een
      school, die in schooljaar 2015–2016 een intrasectoraal of intersectoraal programma als bedoeld in
      [artikel 10b, zevende lid, onderdeel a][ref5], of [artikel 10d, zevende lid, onderdeel b][ref6], zoals die
      artikelen luidden op 31 juli 2016, verzorgde en die tot het verzorgen van dat programma gerechtigd was, met ingang
      van 1 augustus 2016 in aanmerking komt voor bekostiging van een of meer bij die regeling aan te wijzen profielen
      als bedoeld in de artikelen 10b, derde lid, en 10d, derde lid.

      3 Dit artikel vervalt met ingang van 1 augustus 2021.


