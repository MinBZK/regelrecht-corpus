  - number: 58a
    text: |-
      1 Het bevoegd gezag van een ingevolge [artikel 56][ref1] aangewezen school kan leerlingen
      in de gelegenheid stellen in het kader van het onderwijs waarvoor zij aan de school zijn
      ingeschreven deel te nemen aan een opleiding voortgezet algemeen volwassenenonderwijs als
      bedoeld in [artikel 7.3.1, eerste lid, onder a, van de Wet educatie en beroepsonderwijs][ref2]
      aan een instelling waarvoor wat betreft genoemde opleiding toepassing is gegeven aan
      [artikel 1.4a.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref3], en die opleiding met een examen af
      te sluiten.

      2 Het eerste lid vindt uitsluitend toepassing met het doel leerlingen met bijzondere kenmerken beter in staat te
      stellen een diploma als bedoeld in deze wet te behalen.

      3 Toepassing van het eerste lid berust op een samenwerkingsovereenkomst, gesloten tussen het bevoegd gezag, bedoeld
      in het eerste lid, en het bevoegd gezag van de in het eerste lid bedoelde instelling. De samenwerkingsovereenkomst
      omvat in elk geval:

      a. doel van de samenwerking,

      b. de doelgroep,

      c. de wijze waarop wordt nagegaan of het doel wordt bereikt,

      d. het onderwijsprogramma dat volgens de samenwerking wordt vormgegeven, en

      e. een regeling voor de beslechting van geschillen tussen partijen over de uitvoering van de overeenkomst.

      4 Bij algemene maatregel van bestuur wordt nader geregeld voor welke leerlingen en onder welke voorwaarden het
      eerste lid toepassing kan vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
