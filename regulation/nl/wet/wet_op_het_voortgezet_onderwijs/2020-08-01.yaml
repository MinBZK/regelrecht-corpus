    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel112
  - number: 118a
    text: |-
      1 Burgemeester en wethouders, de bevoegde gezagsorganen van de scholen in de gemeente, en de bevoegde
      gezagsorganen van de in de gemeente gelegen agrarische opleidingscentra, voor zover het betreft het daarin
      verzorgde voorbereidend beroepsonderwijs, voeren tenminste jaarlijks overleg over het voorkomen van segregatie,
      het bevorderen van integratie en het bestrijden van onderwijsachterstanden, de afstemming over inschrijvings-
      en toelatingsprocedures en het uit het overleg voortvloeiende voorstel van het bevoegd gezag van in de gemeente
      gevestigde scholen om tot een evenwichtige verdeling van leerlingen met een onderwijsachterstand over de scholen
      te komen. Het overleg is gericht op het maken van afspraken over de in de eerste volzin bedoelde onderwerpen.
      Deze afspraken hebben zoveel mogelijk het karakter van meetbare doelen. De inspectie rapporteert jaarlijks over
      de mate waarin die doelen worden bereikt. Burgemeester en wethouders kunnen de uitkomsten van het verplichte op
      overeenstemming gerichte overleg omzetten in bindende afspraken over onder andere de te realiseren prestaties en
      inspanningen, die – alvorens de afspraken tot stand komen – aan alle partijen worden voorgelegd. Indien het overleg
      over de voorgenomen bindende afspraken niet tot overeenstemming leidt, schrijven burgemeester en wethouders een
      nieuw overleg uit, waarbij zij initiatieven nemen tot het bereiken van een zo groot mogelijke consensus. Indien ook
      dit overleg niet tot overeenstemming leidt, vragen burgemeester en wethouders of een van de bevoegde gezagsorganen
      aan de geschillencommissie, bedoeld in het tweede lid, om een bindend advies. De geschillencommissie brengt binnen
      4 weken aan burgemeester en wethouders dan wel aan het bevoegd gezag dat om het advies heeft verzocht, een bindend
      advies uit. Burgemeester en wethouders maken dit advies bekend aan de bevoegde gezagsorganen van de scholen in
      de gemeente.

      2 Onze Minister stelt een geschillencommissie in.

      3 De commissie bestaat uit een voorzitter en 4 leden, die allen door Onze Minister worden benoemd. De 4 leden
      worden benoemd op voordracht van de gezamenlijke besturenorganisaties en de Vereniging van Nederlandse Gemeenten.
      De voorzitter is een jurist.

      4 De voorzitter en de leden worden benoemd voor een termijn van 4 jaar. Zij zijn opnieuw benoembaar. Op eigen
      verzoek wordt aan hen ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel118a
  - number: 118g
    text: |-
      1 Onder een voortijdige schoolverlater in de zin van deze titel wordt verstaan degene op wie
      [artikel 28, eerste lid onder a en b][ref1], van toepassing is en

      a. die het onderwijs aan de school waaraan hij is ingeschreven gedurende een aaneengesloten periode van ten minste
      vier weken of een door het bevoegd gezag te bepalen kortere periode zonder geldige reden, waaronder in ieder geval
      de redenen, bedoeld in [artikel 27a, negende lid][ref2], worden verstaan, niet meer volgt, of

      b. die niet meer aan een school is ingeschreven en evenmin is ingeschreven aan een instelling als bedoeld
      in de [Wet educatie en beroepsonderwijs][ref3] dan wel aan een school of instelling als bedoeld in de
      [Wet op de expertisecentra][ref4].

      2 Voor zover nodig in afwijking van het eerste lid wordt onder een voortijdige schoolverlater niet verstaan
      degene die in het bezit is van een getuigschrift van het praktijkonderwijs als bedoeld in [artikel 10f][ref5], een
      getuigschrift van het arbeidsmarktgerichte uitstroomprofiel of het uitstroomprofiel dagbesteding als bedoeld in
      [artikel 14d][ref6] respectievelijk [artikel 14g van de Wet op de expertisecentra][ref7] dan wel een diploma van
      een opleiding als bedoeld in [artikel 7.2.2, eerste lid onderdeel a, van de Wet educatie en beroepsonderwijs][ref8]
      en werkzaam is op grond van een arbeidsovereenkomst.


