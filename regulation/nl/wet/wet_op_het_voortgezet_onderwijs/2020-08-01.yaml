  - number: 73e
    text: |-
      De aanspraak op bekostiging blijft bestaan indien het bevoegd gezag over hemelsbreed gemeten een afstand van minder
      dan 3 kilometer van het huidige vestigingsadres:

      a. een vestiging verplaatst, of

      b. een deel van het onderwijsaanbod op een vestiging verplaatst naar een andere vestiging van dezelfde school of
      scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel73e
  - number: '74'
    text: |-
      1 Een bevoegd gezag van een school of scholengemeenschap kan samenwerken met ten minste 1 ander bevoegd gezag met
      als doel het onderwijsaanbod af te stemmen op de vraag van de leerlingen, ouders en andere belanghebbenden in hun
      regio.

      2 Een regio omvat een aaneengesloten gebied bestaande uit het grondgebied van een of meer gemeenten, met dien
      verstande dat:

      a. op de deelnemende vestigingen van scholen of scholengemeenschappen per gemeente ten minste 60 procent staat
      ingeschreven van alle leerlingen die op het grondgebied van die gemeente voortgezet onderwijs volgen, en

      b. ten minste 65 procent van de bevoegde gezagsorganen met een of meer vestigingen van scholen of
      scholengemeenschappen binnen die gemeente, bij de samenwerking betrokken is.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel74
  - number: 74a
    text: |-
      1 De samenwerkende bevoegde gezagsorganen stellen voor hun regio een regionaal plan onderwijsvoorzieningen vast,
      dat een gezamenlijk gedragen visie bevat op het onderwijs in de regio.

      2 In het plan worden in elk geval tot uitdrukking gebracht:

      a. de omvang en begrenzing van de regio,

      b. gegevens over het aanbod en gebruik van onderwijsvoorzieningen,

      c. een overzicht van de onderwijsvoorzieningen die de bevoegde gezagsorganen binnen de looptijd van het plan voor
      bekostiging in aanmerking willen laten brengen en een prognose van het aantal leerlingen per vestiging,

      d. de relatie van het bestaande en toekomstige onderwijsaanbod met het vervolgonderwijs en de arbeidsmarkt, en

      e. de opvattingen van de deelnemers aan het overleg, bedoeld in het vierde en vijfde lid, over het bestaande en
      toekomstige onderwijsaanbod in relatie tot het vervolgonderwijs, de arbeidsmarkt en de onderwijshuisvesting.

      3 Een regionaal plan onderwijsvoorzieningen geldt voor een periode van 5 jaar, die aanvangt op 1 augustus van enig
      kalenderjaar.

      4 Voordat een regionaal plan onderwijsvoorzieningen wordt vastgesteld, overleggen de samenwerkende bevoegde
      gezagsorganen over een concept van het plan met:

      a. de bevoegde gezagsorganen van de overige scholen of scholengemeenschappen in de regio,

      b. vertegenwoordigers van de desbetreffende provincie of provincies, en

      c. voor zover het gaat om het vbo, met vertegenwoordigers van het bedrijfsleven in de regio en met de bevoegde
      gezagsorganen van de regionale opleidingencentra en de agrarische opleidingscentra in de regio.

      5 Voordat de samenwerkende bevoegde gezagsorganen een regionaal plan onderwijsvoorzieningen vaststellen, wordt over
      een concept van het plan op overeenstemming gericht overleg gevoerd met het college van burgemeester en wethouders
      van de gemeente of gemeenten. Daartoe wordt een procedure vastgesteld door de samenwerkende bevoegde gezagsorganen
      en het college van burgemeester en wethouders van die gemeente of gemeenten, welke procedure een voorziening voor
      het beslechten van geschillen bevat.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel74a
  - number: 74b
    text: |-
      1 Onverminderd [artikel 74c][ref1] brengt Onze Minister voor bekostiging in aanmerking een onderwijsvoorziening
      als bedoeld in de onderdelen a tot en met h, indien de voorziening is opgenomen in een regionaal plan
      onderwijsvoorzieningen en indien nodig ook wordt voldaan aan de in die onderdelen genoemde voorwaarden. Een bevoegd
      gezag kan voor 1 november bij Onze Minister een aanvraag indienen voor bekostiging van:

      a. een vestiging die wordt verplaatst of een deel van het onderwijsaanbod van een vestiging dat wordt verplaatst
      naar een andere vestiging van dezelfde school, beide over hemelsbreed gemeten een afstand van 3 kilometer of meer
      van het huidige vestigingsadres,

      b. een nieuwe nevenvestiging, onder de verplichting dat ten minste een bij ministeriële regeling vast te stellen
      percentage van de leerlingen van 1 van de al bestaande vestigingen woont binnen hemelsbreed gemeten een afstand van
      10 kilometer van de nieuwe nevenvestiging,

      c. een nieuwe nevenvestiging buiten de regio van de samenwerkende bevoegde gezagsorganen, met dien verstande dat:

      1°. ten minste een bij ministeriële regeling vast te stellen percentage van de leerlingen van 1 van de al bestaande
      vestigingen woont binnen een hemelsbreed gemeten afstand van 10 kilometer van de nieuwe nevenvestiging,

      2°. geen van de bevoegde gezagsorganen in de desbetreffende regio of, bij afwezigheid van een regionaal
      plan onderwijsvoorzieningen aldaar, in de gemeente bedenkingen kenbaar maakt tegen bekostiging van de nieuwe
      nevenvestiging, en

      3°. het desbetreffende bevoegd gezag over de aanvraag op overeenstemming gericht overleg voert met het college van
      burgemeester en wethouders van de gemeente waar de nieuwe nevenvestiging wordt gevestigd,

      d. een of meer scholen die door het bevoegd gezag worden afgesplitst van een scholengemeenschap,

      e. onderwijs vanaf het vierde leerjaar op een hoofdvestiging of nevenvestiging aan een school voor vwo of havo,
      en onderwijs vanaf het derde leerjaar op een hoofd- of nevenvestiging aan een school voor mavo of vbo indien niet
      binnen hemelsbreed gemeten een afstand van 3 kilometer een andere vestiging van de school is gelegen waaraan dit
      onderwijs wordt verzorgd,

      f. onderwijs in de gemengde leerweg op een hoofdvestiging of nevenvestiging aan een school voor mavo of vbo of aan
      een agrarisch opleidingscentrum voor zover het gaat om het vbo, indien wordt voldaan aan voorwaarden die bij of
      krachtens algemene maatregel van bestuur zijn vastgesteld,

      g. op een hoofdvestiging of nevenvestiging van een school voor vbo: een profiel als bedoeld in
      [artikel 10b, derde lid, onderdelen a tot en met c en f tot en met j][ref2], indien wordt voldaan aan bij of
      krachtens algemene maatregel van bestuur te stellen voorwaarden, of

      h. het profiel dienstverlening en producten, bedoeld in [artikel 10b, derde lid, onderdeel j][ref3], aan een
      agrarisch opleidingscentrum, voor zover het betreft het voorbereidend beroepsonderwijs, indien wordt voldaan aan
      bij of krachtens algemene maatregel van bestuur te stellen voorwaarden.

      2 Onze Minister kan een onderwijsvoorziening als bedoeld in het eerste lid, onderdelen d tot en met h, die niet is
      opgenomen in een regionaal plan onderwijsvoorzieningen, voor bekostiging in aanmerking brengen indien de overige
      bevoegde gezagsorganen die deelnemen aan de regionale samenwerking instemmen met de aanvraag en wordt voldaan aan
      de in die onderdelen opgenomen voorwaarden.

      3 Onze Minister besluit voor 1 mei volgend op de aanvraag of de onderwijsvoorziening voor bekostiging in aanmerking
      wordt gebracht.

      4 Onverminderd [artikel 3:41 van de Algemene wet bestuursrecht][ref4] wordt een besluit tot bekostiging van een
      onderwijsvoorziening op grond van dit artikel gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel74c
