      1 Het bevoegd gezag stort het exploitatie-overschot terug in de desbetreffende overheidskas

      a. indien een openbare school ingevolge [artikel 107][ref1] of [110][ref2] wordt opgeheven,

      b. indien de bekostiging van een bijzondere school ingevolge een van de in onderdeel a genoemde artikelen wordt
      beëindigd, of

      c. indien een school ingevolge een beslissing van het bevoegd gezag wordt opgeheven en deze opheffing is
      gerealiseerd.

      2 Het exploitatietekort blijft in de gevallen, bedoeld in het eerste lid, voor rekening van het bevoegd gezag.

      3 Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de wijze waarop het exploitatie-
      overschot, bedoeld in het eerste lid, wordt berekend.


