  - number: '54'
    text: |-
      Het bestuur van een bijzondere school voor voortgezet onderwijs geeft binnen vier weken na de oprichting van de
      school onder overlegging van de statuten der instelling, die de school in stand houdt, en van de reglementen, van
      die oprichting kennis aan Onze Minister. Indien de statuten of reglementen worden gewijzigd of ingetrokken, wordt
      eveneens binnen vier weken van de wijziging of van de intrekking van de statuten of reglementen aan Onze Minister
      kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel54
  - number: '55'
    text: |-
      1 Algemeen voortgezet onderwijs wordt slechts gegeven door wie voldoet aan [artikel 33, eerste lid][ref1].
      De [artikelen 32e][ref2], [33, leden 1a tot en met vijf en veertien tot en met zeventien][ref3], [33a][ref4],
      [41a tot en met 41u][ref5] zijn van overeenkomstige toepassing.

      2 Onderwijsondersteunende werkzaamheden als bedoeld in [artikel 36, derde lid][ref6], worden met betrekking tot
      het algemeen voortgezet onderwijs slechts verricht door wie voldoet aan [artikel 35, eerste lid][ref7]. Artikel 35,
      tweede en derde lid, is van overeenkomstige toepassing.


