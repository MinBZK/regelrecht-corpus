      1 Bij het verstrijken van de looptijd van een regionaal plan onderwijsvoorzieningen als bedoeld in
      [artikel 74a][ref1] gaat de aanspraak op bekostiging verloren voor zover het betreft een profiel als bedoeld in
      artikel 74b, eerste lid, onderdeel g, al dan niet met gebruikmaking van artikel 74b, tweede lid, of g, met dien
      verstande dat de bekostiging nog een jaar wordt gehandhaafd voor zover het betreft het onderwijs aan leerlingen in
      het derde leerjaar en nog twee jaar voor zover het betreft het onderwijs aan leerlingen in het vierde leerjaar.

      2 Het eerste lid is niet van toepassing indien het desbetreffende profiel op grond van een aansluitend regionaal
      plan onderwijsvoorzieningen als bedoeld in [artikel 74a][ref2] of op grond van [artikel 65][ref3] voor bekostiging
      in aanmerking is gebracht.


