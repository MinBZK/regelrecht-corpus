        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003420
      - id: ref3
        bwb_id: BWBR0003549
  - number: 76e
    text: |-
      1 Het bevoegd gezag van een andere dan een gemeentelijke school dat een voorziening in de huisvesting wenst,
      dient een aanvraag voor opneming van die voorziening op het programma, bedoeld in [artikel 76f][ref1], in bij
      burgemeester en wethouders.

      2 Burgemeester en wethouders kunnen ten aanzien van voorzieningen als bedoeld in [artikel 76c][ref2] bekostiging
      verstrekken ter zake van de kosten van bouwvoorbereiding.

      3 Burgemeester en wethouders stellen vast, voor welk tijdstip de aanvraag wordt ingediend en aan welke voorwaarden
      deze dient te voldoen.

      4 Het derde lid is van overeenkomstige toepassing op de gemeentelijke scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76c
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel76e
