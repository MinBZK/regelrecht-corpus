  - number: 10b16
    text: |-
      1 In afwijking van de [artikelen 9][ref1] en [10a][ref2] en
      __REF002___________________________________________________________________________________________________________
      _ bedraagt de cursusduur van een doorlopende leerroute vmbo-mbo vanaf het derde leerjaar aan een school voor
      middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend beroepsonderwijs:

      a. voor een doorlopende leerroute vmbo-mbo die opleidt tot het diploma van een eenjarige basisberoepsopleiding ten
      minste twee en ten hoogste drie jaren;

      b. voor een doorlopende leerroute vmbo-mbo die opleidt tot het diploma van een tweejarige basisberoepsopleiding of
      tweejarige vakopleiding ten minste drie en ten hoogste vier jaren;

      c. voor een doorlopende leerroute vmbo-mbo die opleidt tot het diploma van een driejarige vakopleiding of de
      middenkaderopleiding ten minste vier en ten hoogste vijf jaren;

      d. voor een doorlopende leerroute vmbo-mbo die opleidt tot het diploma van een middenkaderopleiding als bedoeld
      in [artikel 7.2.4a, vierde lid, van de Wet educatie en beroepsonderwijs][ref4] ten minste vijf en ten hoogste zes
      jaren.

      2 Ten aanzien van de basisberoepsopleiding, vakopleiding of middenkaderopleiding die deel uitmaakt van
      een doorlopende leerroute vmbo-mbo wordt onder «cursusduur» mede verstaan «studieduur als bedoeld in
      de Wet educatie en beroepsonderwijs» en wordt onder «jaar» mede verstaan «studiejaar als bedoeld in
      [artikel 1.1.1, onderdeel r, van de Wet educatie en beroepsonderwijs][ref5]».


