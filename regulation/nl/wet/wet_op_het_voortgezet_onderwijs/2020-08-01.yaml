  - number: '65'
    text: |-
      1 Onze Minister brengt een nieuw te vormen profiel als bedoeld in [artikel 10b, derde lid][ref1], aan een al
      bekostigde school voor vbo voor bekostiging in aanmerking indien redelijkerwijs kan worden aangenomen dat dit
      profiel zal worden bezocht door ten minste:

      a. 160 leerlingen indien de school geen deel uitmaakt van een scholengemeenschap, of

      b. 120 leerlingen indien de school deel uitmaakt van een scholengemeenschap.

      2 Onze Minister brengt een nieuw te vormen school die wordt toegevoegd aan een al bekostigde school of
      scholengemeenschap voor bekostiging in aanmerking indien redelijkerwijs kan worden aangenomen dat deze nieuwe
      school zal worden bezocht door ten minste drie kwart van het daarvoor in [artikel 64, eerste lid][ref2], genoemde
      aantal leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
