  - number: 3b
    text: |-
      1 Het bevoegd gezag draagt zorg voor de veiligheid op school, waarbij het bevoegd gezag in ieder geval:

      a. beleid met betrekking tot de veiligheid voert,

      b. de veiligheid van leerlingen op school monitort met een instrument dat een representatief en actueel beeld
      geeft, en

      c. er zorg voor draagt dat bij een persoon ten minste de volgende taken zijn belegd:

      1°. het coördineren van het beleid in het kader van het tegengaan van pesten, en

      2°. het fungeren als aanspreekpunt in het kader van pesten.

      2 Onder veiligheid, bedoeld in het eerste lid, wordt verstaan de sociale, psychische en fysieke veiligheid van
      leerlingen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het instrument, bedoeld in het
      eerste lid, onderdeel b, dat door de school wordt vormgegeven of gekozen, waaronder:

      a. de aandachtsgebieden die het instrument inzichtelijk maakt,

      b. de representativiteit van het instrument, en

      c. de frequentie waarmee het instrument wordt ingezet.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel3b
  - number: '4'
    text: |-
      1 Ten behoeve van het schoolbezoek verstrekken burgemeester en wethouders aan ouders, voogden of verzorgers van
      in de gemeente verblijvende leerlingen die wegens hun lichamelijke, verstandelijke, zintuiglijke of psychische
      handicap op ander vervoer dan openbaar vervoer zijn aangewezen, dan wel vanwege een zodanige handicap niet
      zelfstandig van openbaar vervoer gebruik kunnen maken, op aanvraag vergoeding van de door burgemeester en
      wethouders noodzakelijk te achten vervoerskosten. Indien de leerling meerderjarig en handelingsbekwaam is, wordt
      de vergoeding op aanvraag verstrekt aan de leerling. De gemeenteraad stelt daartoe een nadere regeling vast, met
      inachtneming van het bepaalde in de volgende leden.

      2 De regeling maakt geen onderscheid tussen openbaar en bijzonder onderwijs.

      3 De regeling eerbiedigt de op godsdienst of levensbeschouwing van de ouders, voogden of verzorgers, dan wel,
      indien de leerling meerderjarig en handelingsbekwaam is, van de leerling berustende keuze van een school.

      4 De regeling houdt rekening met de van ouders redelijkerwijs te vergen inzet en voorziet erin dat het vervoer
      kan plaatsvinden op een wijze die voor de leerling passend is. De regeling bepaalt op welke wijze burgemeester en
      wethouders terzake advies van deskundigen inwinnen.

      5 De regeling bepaalt dat de kosten worden vergoed van vervoer over de afstand tussen de woning van de leerling
      en de dichtstbijzijnde voor de leerling toegankelijke school, met inachtneming van de keuze van de ouders, voogden
      of verzorgers, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, van de leerling, tenzij vervoer
      met betrekking tot een verder weg gelegen school voor de gemeente minder kosten met zich zou brengen en de ouders,
      voogden of verzorgers onderscheidenlijk de leerling met het vervoer naar die school instemmen.

      6 De regeling kan bepalen dat de gemeente, in plaats van vergoeding in geld te geven, het vervoer verzorgt of doet
      verzorgen.

      7 De regeling kan bepalen dat burgemeester en wethouders in bijzondere gevallen de bevoegdheid hebben ten gunste
      van de ouders, voogden of verzorgers, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, ten gunste
      van de leerling van de inhoud van de regeling af te wijken.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel4
  - number: '5'
    text: |-
      Het voortgezet onderwijs wordt onderscheiden in:

      a. voorbereidend wetenschappelijk onderwijs;

      b. hoger en middelbaar algemeen voortgezet onderwijs;

      c. voorbereidend beroepsonderwijs;

      d. praktijkonderwijs;

      e. andere vormen van voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel5
  - number: '6'
    text: |-
      De bepalingen van de hoofdstukken I en II van deze afdeling regelen het openbaar schoolonderwijs; de bepalingen van
      de hoofdstukken I en III zijn voorwaarden voor bekostiging van het bijzonder schoolonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel6
  - number: 6a
    text: |-
      Het onderwijs wordt gegeven en de examens worden afgenomen in het Nederlands. In afwijking van de eerste volzin kan
      een andere taal worden gebezigd:

      a. wanneer het onderwijs met betrekking tot die taal betreft, of

      b. indien de specifieke aard, de inrichting of de kwaliteit van het onderwijs dan wel de herkomst van de leerlingen
      daartoe noodzaakt, overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel6a
  - number: 6b
    text: |-
      Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel6b
  - number: 6c
    text: |-
      Het onderwijs wordt zodanig ingericht dat daarbij op structurele en herkenbare wijze aandacht wordt besteed aan het
      bestrijden van achterstanden in het bijzonder in de beheersing van de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel6c
  - number: 6d
    text: |-
      Onderwijs in lichamelijke opvoeding, bestaande uit praktische bewegingsactiviteiten, wordt gespreid verzorgd
      over alle leerjaren van het voortgezet onderwijs. Dit onderwijs vindt plaats gespreid over de schoolweken, en in
      zodanige substantiële omvang en schooltijd dat wordt voldaan aan de eisen op het gebied van kwaliteit, intensiteit
      en variëteit van de bewegingsactiviteiten neergelegd in kerndoelen en examenprogramma’s. Daarbij wordt uitgegaan
      van de situatie zoals die op 1 augustus 2005 voor het bewegingsonderwijs gold. In afwijking van de tweede volzin
      geldt voor het laatste leerjaar het voorschrift, dat het onderwijs in het eindexamenvak lichamelijke opvoeding niet
      eerder mag worden afgesloten dan in de maand december.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel6d
  - number: 6e
    text: |-
      1 Het bevoegd gezag stelt elk leerjaar om niet aan een leerling lesmateriaal ter beschikking.

      2 Onder lesmateriaal wordt verstaan: lesmateriaal dat naar vorm en inhoud is gericht op informatieoverdracht in
      onderwijsleersituaties en waarvan het gebruik binnen het onderwijsaanbod door het bevoegd gezag specifiek voor het
      desbetreffende leerjaar is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel6e
  - number: 6f
    text: |-
      1 Een onderwijsprogramma in het voortgezet onderwijs kan mede een maatschappelijke stage omvatten.

      2 Indien het onderwijsprogramma van een school tevens een maatschappelijke stage omvat, sluit het bevoegd gezag
      voor deze stage met de leerling en de stagebieder tezamen een schriftelijke stageovereenkomst.

      3 Voor vermelding op de cijferlijst bij het diploma, bedoeld in [artikel 29, derde lid][ref1], of op het
      getuigschrift, bedoeld in [artikel 29a][ref2], omvat de maatschappelijke stage tenminste 30 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel29a
