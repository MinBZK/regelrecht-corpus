  - number: 53f
    text: |-
      1 Fusies worden niet tot stand gebracht dan nadat daarvoor goedkeuring is verleend door Onze Minister.

      2 Indien bij een fusie een school voor praktijkonderwijs is betrokken, is goedkeuring niet vereist voor zover het
      die school betreft.

      3 De goedkeuring, bedoeld in het eerste lid, is niet vereist voor de bestuurlijke en institutionele fusie die
      noodzakelijk zijn voor de totstandkoming van de samenwerkingsschool, bedoeld in [artikel 53d, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53d
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel53f
