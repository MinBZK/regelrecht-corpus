  - number: 118ee
    text: |-
      1 Toepassing van [artikel 69, eerste en tweede lid][ref1], zoals luidend ingevolge de Wet van 25 mei 2018 tot
      wijziging van onder meer de Wet op het voortgezet onderwijs en de Wet voortgezet onderwijs BES in verband met
      modernisering van de bepalingen over voorzieningenplanning (Stb. 2018, 156) leidt niet eerder dan 1 jaar na
      inwerkingtreding van het betrokken artikellid tot het vervallen van de aanspraak op bekostiging.

      2 Toepassing van [artikel 107, derde lid][ref2], zoals luidend ingevolge de Wet van 25 mei 2018 tot wijziging van
      onder meer de Wet op het voortgezet onderwijs en de Wet voortgezet onderwijs BES in verband met modernisering van
      de bepalingen over voorzieningenplanning (Stb. 2018, 156) leidt niet eerder dan 2 jaar na inwerkingtreding van
      genoemd artikellid tot het opheffen van een openbare school of het beëindigen van de bekostiging van een bijzondere
      school.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel69
