  - number: 73c
    text: |-
      Onze Minister brengt voor bekostiging in aanmerking onderwijs vanaf het vierde leerjaar op een hoofdvestiging of
      nevenvestiging aan een school voor vwo of havo, en onderwijs vanaf het derde leerjaar op een hoofdvestiging of
      nevenvestiging van een school voor mavo of vbo indien:

      a. op de desbetreffende vestiging onderwijs in de eerste 3 respectievelijk 2 leerjaren van de desbetreffende
      schoolsoort wordt verzorgd, en

      b. de desbetreffende vestiging ligt binnen een hemelsbreed gemeten afstand van 3 kilometer van een andere vestiging
      van de school waar onderwijs vanaf het vierde respectievelijk derde leerjaar van de desbetreffende schoolsoort
      wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel73c
  - number: 73d
    text: |-
      1 Een tijdelijke nevenvestiging voorziet in de tijdelijke huisvestingsbehoefte van een hoofdvestiging of
      nevenvestiging en is gelegen op hemelsbreed gemeten een afstand van minder dan 3 kilometer van de hoofdvestiging
      of nevenvestiging.

      2 Onze Minister brengt een tijdelijke nevenvestiging voor bekostiging in aanmerking indien het bevoegd gezag heeft
      aangetoond dat het college van burgemeester en wethouders van de gemeente de benodigde huisvesting ter beschikking
      zal stellen. De verplichting in de eerste volzin is niet van toepassing op verticale scholengemeenschappen en op
      scholen waarvoor jaarlijks een bedrag voor huisvestingskosten wordt betaald op grond van [artikel 76v][ref1].

      3 Op een tijdelijke nevenvestiging kan onderwijs worden verzorgd in dezelfde schoolsoorten, in dezelfde profielen
      als bedoeld in de [artikelen 10b][ref2] en [10d][ref3], en in dezelfde leerjaren als op de hoofdvestiging of
      nevenvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76v
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
