  - number: 10b8
    text: |-
      1 Het bevoegd gezag kan bij de school ingeschreven leerlingen die daarbij naar zijn oordeel gebaat
      zijn, in de gelegenheid stellen om geheel of gedeeltelijk in plaats van de basisberoepsgerichte
      leerweg een entreeopleiding te volgen, met inachtneming van de [artikelen 7.2.7][ref1] en
      [8.1.1, derde lid, van de Wet educatie en beroepsonderwijs][ref2].

      2 De entreeopleiding stemt overeen met het programma-aanbod van de beroepsgerichte programma’s van de
      basisberoepsgerichte leerweg die aan de school wordt verzorgd.

      3 Het bevoegd gezag is niet gehouden, leerlingen die een entreeopleiding volgen als bedoeld in het eerste lid,
      gelegenheid te geven om aan de school een eindexamen in de basisberoepsgerichte leerweg af te leggen als bedoeld in
      [artikel 29, eerste lid][ref3].

      4 Leerlingen die een entreeopleiding volgen als bedoeld in het eerste lid, worden aangemerkt als leerlingen van de
      basisberoepsgerichte leerweg waarvoor de entreeopleiding geheel of gedeeltelijk in de plaats treedt.

      5 Ten aanzien van bij de school ingeschreven leerlingen jonger dan 16 jaar wordt de entreeopleiding verzorgd met
      inachtneming van de volgende vereisten:

      a. de beroepspraktijkvorming, bedoeld in de [artikelen 7.2.8][ref4] en
      [7.2.9 van de Wet educatie en beroepsonderwijs][ref5], omvat uitsluitend het verrichten van lichte arbeid van
      geschikte aard,

      b. in plaats van de basisberoepsgerichte leerweg wordt geheel of gedeeltelijk zowel binnenschools als buitenschools
      onderricht in de praktijk van het beroep verzorgd,

      c. een gekwalificeerde mentor of docentbegeleider bewaakt de voortgang van het onderricht in de praktijk van het
      beroep, en

      d. het binnenschools en buitenschools onderricht in de praktijk van het beroep worden geïntegreerd verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.7
