  - number: 30a
    text: |-
      1 Tegen een besluit inzake deelneming aan eindexamens staat administratief beroep open bij een bij algemene
      maatregel van bestuur aan te wijzen bestuursorgaan.

      2 In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen van
      het beroepschrift vijf dagen.

      3 In afwijking van
      [artikel 7:24, eerste, tweede, vierde, vijfde, zesde en zevende lid, van de Algemene wet bestuursrecht][ref2]
      beslist het beroepsorgaan binnen twee weken na ontvangst van het beroepschrift. Het kan de beslissing voor ten
      hoogste twee weken verdagen.

      4 Tegen een beslissing inzake deelneming aan eindexamens die geen besluit is, kan de betrokken leerling of zijn
      ouders voorziening vragen bij een bij algemene maatregel van bestuur aan te wijzen instantie.

      5 De termijn voor het indienen van het verzoekschrift bedraagt vijf dagen, met ingang van de dag na die waarop de
      beslissing aan de leerling is uitgereikt of toegezonden.

      6 De instantie, bedoeld in het vierde lid, beslist binnen twee weken na ontvangst van het verzoekschrift. Zij kan
      de beslissing voor ten hoogste twee weken verdagen.


