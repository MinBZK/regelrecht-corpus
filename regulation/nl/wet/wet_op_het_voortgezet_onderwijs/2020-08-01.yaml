  - number: 32d
    text: |-
      1 Het bevoegd gezag stelt ten behoeve van de directie van elk van zijn scholen, indien daaraan van een
      ondervertegenwoordiging van vrouwen in de directie sprake is, eenmaal in de 4 jaar een document inzake evenredige
      vertegenwoordiging van vrouwen in de schoolleiding vast.

      2 Het document bevat streefcijfers, met inbegrip van een bepaald tijdvak waarbinnen deze streefcijfers worden
      gerealiseerd, aan de hand waarvan door het bevoegd gezag een beleid inzake evenredige vertegenwoordiging van
      vrouwen in de schoolleiding wordt gevoerd, opdat in de directie van elke school van het bevoegd gezag vrouwen
      en mannen naar evenredigheid werkzaam zullen zijn. Voor de evenredige vertegenwoordiging wordt uitgegaan van de
      verhouding mannen en vrouwen voor wat betreft het onderwijzend personeel dat werkzaam is in het door de school
      verzorgde onderwijs, zoals die blijkt uit de daarover jaarlijks door Onze Minister gepubliceerde cijfers. Het
      document vermeldt tevens de maatregelen die het bevoegd gezag heeft genomen en zal nemen teneinde de in de eerste
      volzin bedoelde streefcijfers te realiseren en geeft een overzicht van de beoogde en bereikte resultaten van het
      beleid inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding gedurende de periode waarvoor het
      document geldt, onderscheidenlijk de periode waarvoor het vorige document gold.

      3 Indien door het bevoegd gezag aan het hoofd van de school een centrale directie wordt geplaatst en vrouwen daarin
      zijn ondervertegenwoordigd, stelt het bevoegd gezag overeenkomstig het bepaalde in het eerste en tweede lid tevens
      een document inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding ten behoeve van de centrale
      directie vast.

      4 Het bevoegd gezag draagt er zorg voor dat een exemplaar van het document, bedoeld in het eerste en derde
      lid, in het gebouw van de school ter inzage wordt gelegd op een voor het personeel, de ouders en de leerlingen
      toegankelijke plaats, alsmede dat een exemplaar wordt bewaard bij de administratie van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel32d
  - number: 32e
    text: |-
      1 Onder het beroep van leraar wordt verstaan het binnen de kaders van het onderwijskundig beleid van de school,
      verantwoordelijkheid dragen voor het vakinhoudelijke, vakdidactische en pedagogische proces in de school.

      2 Leraren komt een zelfstandige verantwoordelijkheid toe als het gaat om het beoordelen van de onderwijsprestaties
      van leerlingen.

      3 Leraren beschikken over voldoende vakinhoudelijke, vakdidactische en pedagogische zeggenschap, waaronder wordt
      verstaan de zeggenschap over:

      a. de inhoud van de lesstof;

      b. de wijze waarop de lesstof wordt aangeboden en de middelen die daarbij worden gebruikt;

      c. de te hanteren pedagogisch-didactische aanpak op de school en de wijze waarop daar uitvoering aan wordt gegeven,
      waaronder de begeleiding van de leerlingen en de contacten met de ouders;

      d. het in samenhang met de onderdelen a, b en c, onderhouden van de bekwaamheid van de leraren als onderdeel van
      het team.

      4 Het bevoegd gezag stelt in overleg met de leraren een professioneel statuut op waarin de afspraken zijn opgenomen
      over de wijze waarop de zeggenschap van leraren als bedoeld in het derde lid wordt georganiseerd. Bij het opstellen
      van het professioneel statuut wordt de professionele standaard van de beroepsgroep in acht genomen.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel32e
  - number: '33'
    text: |-
      1 Leraren worden door het bevoegd gezag benoemd dan wel tewerkgesteld zonder benoeming. Om tot leraar te kunnen
      worden benoemd of tewerkgesteld zonder benoeming dient de betrokkene:

      a. in het bezit te zijn van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1], die op het tijdstip van overlegging aan het bevoegd gezag
      niet ouder is dan 6 maanden,

      b. in het bezit te zijn van:

      1°. een getuigschrift, afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2],
      waaruit blijkt dat is voldaan aan de bekwaamheidseisen die zijn vastgesteld krachtens
      [artikel 36, eerste lid][ref3], of

      2°. een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref4], verleend ten aanzien van het onderwijs dat
      betrokkene zal geven, of

      3°. een geschiktheidsverklaring als bedoeld in [artikel 118k][ref5], en

      c. niet krachtens rechterlijke uitspraak van het geven van onderwijs te zijn uitgesloten.

      De eerste en tweede volzin zijn niet van toepassing op benoeming of tewerkstelling van leraren voor het verzorgen
      van een vak of ander programmaonderdeel dat door het bevoegd gezag is vastgesteld, uitgezonderd godsdienstonderwijs
      en levensbeschouwelijk vormingsonderwijs.

      1a Indien het bevoegd gezag een leraar benoemt of tewerkstelt zonder benoeming voor uitsluitend het
      geven van middelbaar algemeen voortgezet onderwijs of het geven van onderwijs in de eerste drie leerjaren
      van het hoger algemeen voortgezet onderwijs of van het voorbereidend wetenschappelijk onderwijs, is
      het eerste lid, onderdeel b, onder 3°, niet van toepassing en volstaat in afwijking van het eerste
      lid, onderdeel b, onder 1°, het bezit van het getuigschrift van een bacheloropleiding als bedoeld in
      [artikel 7.3a, eerste lid, onderdeel a, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6],
      waaruit blijkt dat:

      1°. de betrokkene in het kader van die opleiding met goed gevolg ten minste 30 studiepunten als bedoeld in
      [artikel 7.4, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref7], heeft besteed aan
      voorbereiding op het geven van onderwijs in een met zijn opleiding inhoudelijk overeenkomend vak in die leerjaren,
      en

      2°. is voldaan aan de bekwaamheidseisen, bedoeld in [artikel 36, eerste lid][ref8], voor zover die van toepassing
      zijn op dat onderwijs.

      1b Indien het bevoegd gezag een leraar benoemt of tewerkstelt zonder benoeming voor het geven van praktijkonderwijs
      als bedoeld in [artikel 10f][ref9] in één of meer bij algemene maatregel van bestuur aan te wijzen vakken,
      volstaat in afwijking van het eerste lid, onderdeel b, onder 1°, het bezit van een getuigschrift krachtens
      de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref10], waaruit blijkt dat ten aanzien van
      schoolonderwijs als bedoeld in [artikel 3, eerste lid, van de Wet op het primair onderwijs][ref11] is voldaan aan
      de bekwaamheidseisen die zijn vastgesteld krachtens [artikel 32a van die wet][ref12].

      1c Bij ministeriële regeling wordt:

      a. bepaald op grond van het getuigschrift van welke bacheloropleidingen als bedoeld in lid 1a onderwijs verzorgd
      kan worden in daarbij aan te wijzen vakken;

      b. ten aanzien van algemeen gebruikelijke vakken of programmaonderdelen, waarvoor op grond van een getuigschrift
      als bedoeld in het eerste lid, onderdeel b, onder 1°, niet rechtstreeks kan of kon worden vastgesteld dat wordt
      voldaan aan de voor die vakken of programmaonderdelen geldende bekwaamheidseisen, een overzicht gegeven van
      getuigschriften waarmee wordt voldaan aan de bekwaamheidseisen die gelden voor het geven van voortgezet onderwijs
      in die vakken of programmaonderdelen. In het overzicht kunnen eisen worden opgenomen omtrent bij- of nascholing.

      2 In bijzondere gevallen kan Onze Minister besluiten aan personen, die in een bepaald vak of onderdeel van een vak
      door buitengewone bekwaamheid uitmunten, ten aanzien van dit vak of dit onderdeel ontheffing te verlenen van de in
      het eerste lid onder b gestelde eisen.

      3 Bij tijdelijke afwezigheid van een leraar kan ten aanzien van degene die hem vervangt voor ten hoogste twaalf
      maanden worden afgeweken van de eisen, gesteld in het eerste lid, onderdeel b, met dien verstande dat de periode
      van twaalf maanden is verstreken vanaf de dag dat perioden van vervanging als bedoeld in dit lid elkaar met
      tussenpozen van niet meer dan drie maanden hebben opgevolgd en een periode van twaalf maanden, deze tussenpozen
      inbegrepen, is overschreden. Indien in een vacature niet terstond kan worden voorzien door de benoeming of
      tewerkstelling zonder benoeming van een leraar die aan de genoemde eisen voldoet, is het bepaalde in de vorige
      volzin van overeenkomstige toepassing. Deze termijn van een jaar kan met ten hoogste twee jaren worden verlengd
      indien het bevoegd gezag en de betrokkene schriftelijk verklaren dat betrokkene verplicht is zich in te spannen
      binnen twee jaren alsnog te voldoen aan de eisen gesteld in het eerste lid, onderdeel b. Het bevoegd gezag kan
      onder de voorwaarden, genoemd in de vorige volzin, een verlenging van nog eens twee jaren geven indien het dat
      noodzakelijk oordeelt vanwege de kwaliteit en de voortgang van het onderwijs op de school.

      4 Degene die benoembaar of tewerkstelbaar zonder benoeming is voor enig vak, mag, onverminderd het vijfde lid,
      door het bevoegd gezag gedurende ten hoogste twee jaren worden belast met werkzaamheden als leraar waarvoor hij
      niet voldoet aan de in [artikel 36, eerste lid][ref13], bedoelde bekwaamheidseisen. Aan de eerste volzin wordt
      uitsluitend toepassing gegeven indien het bevoegd gezag en betrokkene in ieder geval schriftelijk hebben verklaard
      dat betrokkene verplicht is zich in te spannen om binnen twee jaren alsnog te voldoen aan de bekwaamheidseisen voor
      die werkzaamheden. Het bevoegd gezag kan de in de eerste volzin bedoelde termijn verlengen met ten hoogste twee
      jaren indien het bevoegd gezag dat noodzakelijk oordeelt vanwege de kwaliteit en de voortgang van het onderwijs
      aan de school. De tweede volzin is in dat geval van overeenkomstige toepassing. De inspectie kan op aanvraag van
      het bevoegd gezag besluiten toe te staan dat in de eerste twee leerjaren wordt afgeweken van de eis, bedoeld in de
      tweede volzin.

      5 Indien in het onderwijsprogramma, bedoeld in [artikel 11c][ref14], sprake is van vakoverstijgende
      programmaonderdelen, kan in de eerste twee leerjaren worden gewerkt met teams die verantwoordelijk zijn voor de
      kwaliteit van het onderwijsprogramma voor die vakoverstijgende programmaonderdelen voorzover wordt voldaan aan de
      volgende voorwaarden:

      a. leraren die deel uitmaken van een team voldoen ieder aan bekwaamheidseisen als bedoeld in
      [artikel 36, eerste lid][ref15], waarbij de leraren in het team als geheel beschikken over de bekwaamheidseisen
      voor de vakken die zijn betrokken bij het vakoverstijgende programmaonderdeel,

      b. leraren die deel uitmaken van een team zijn ieder verantwoordelijk voor de kwaliteit van het deel van het
      onderwijs van het desbetreffende vakoverstijgende programmaonderdeel waarvoor zij voldoen aan de bekwaamheidseisen,
      bedoeld in [artikel 36, eerste lid][ref16], en

      c. het onderwijs in het desbetreffende vakoverstijgende programmaonderdeel kan worden verzorgd door:

      1°. leden van het team, en

      2°. andere leraren die daartoe naar het oordeel van het bevoegd gezag geschikt zijn. Daarbij stelt het bevoegd
      gezag, de opvattingen van de leden van het team in aanmerking nemend, vast of de inhoudelijke of didactische
      kennis en vaardigheden van deze leraren voldoende zijn. Indien dat niet het geval is, wordt eveneens vastgesteld
      hoe hierin alsnog wordt voorzien. Het bevoegd gezag legt dit vast in de geordende gegevens, bedoeld in
      [artikel 37a][ref17].

      5a Indien in het onderwijsprogramma van een doorlopende leerroute vmbo-mbo als bedoeld in
      [artikel 10b10][ref18] of de geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in
      [artikel 10b21][ref19] sprake is van vak- en sectoroverstijgende programmaonderdelen als bedoeld in
      [artikel 10b13, tweede lid, onderdeel a respectievelijk c][ref20], kan worden gewerkt met teams die
      verantwoordelijk zijn voor de kwaliteit van het onderwijsprogramma voor die vak- en sectoroverstijgende
      programmaonderdelen voorzover wordt voldaan aan de volgende voorwaarden:

      a. leraren en docenten die deel uitmaken van een team voldoen ieder aan bekwaamheidseisen als bedoeld in
      [artikel 36, eerste lid][ref21], of [artikel 4.2.3, eerste lid, van de Wet educatie en beroepsonderwijs][ref22],
      waarbij de leraren en docenten in het team als geheel beschikken over de bekwaamheidseisen voor alle vak- of
      sectoroverstijgende onderdelen van het onderwijsprogramma van de doorlopende leerroute vmbo-mbo of de geïntegreerde
      route vmbo-basisberoepsopleiding, en

      b. leraren en docenten die deel uitmaken van een team zijn ieder verantwoordelijk voor de kwaliteit
      van dat deel van het onderwijs in het desbetreffende vak- en sectoroverstijgende programmaonderdeel
      waarvoor zij voldoen aan de bekwaamheidseisen, bedoeld in [artikel 36, eerste lid][ref23], of
      [artikel 4.2.3, eerste lid, van de Wet educatie en beroepsonderwijs][ref24].

      5b Bij toepassing van het vijfde lid of lid 5a is het derde lid van overeenkomstige toepassing.

      6 Het bevoegd gezag beschikt over geordende gegevens over de toepassing van het derde lid, de eerste volzin van het
      vierde lid, het vijfde lid en lid 5a.

      7 Het eerste lid is niet van toepassing op een leraar, in zoverre deze belast is met het verrichten van
      werkzaamheden in verband met contractactiviteiten.

      8 Bij algemene maatregel van bestuur worden ten aanzien van leraren die in vaste dienst zijn verbonden aan een
      school, bedoeld in de [artikelen 7][ref25], [8][ref26], [9][ref27], [10a][ref28] en [10f][ref29], regelen gesteld
      omtrent de gronden waarop en de procedure volgens welke kan worden afgeweken van het eerste lid, onderdeel b.

      9 Onverminderd het derde, vierde en vijfde lid, lid 5a en het achtste lid en [artikel 35a][ref30] kan ten aanzien
      van ho-studenten die:

      a. aan een hogeschool een duale opleiding volgen als bedoeld in
      [artikel 7.7 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref31], en aan die opleiding ten
      minste 180 studiepunten hebben behaald, dan wel

      b. een duale opleiding als bedoeld in dat artikel aan een universiteit volgen

      tot leraar voortgezet onderwijs ten behoeve van het geven van het onderwijs waarvoor de desbetreffende opleiding
      opleidt tot het daarvoor vereiste getuigschrift, worden afgeweken van de eisen in het eerste lid onder b, met
      dien verstande dat het tijdelijk dienstverband van de ho-student een periode beslaat die overeenkomt met een
      volledig dienstverband van vijf maanden. De vorige volzin is van overeenkomstige toepassing ten aanzien van
      ho-studenten die ten minste 166 doch nog geen 180 studiepunten hebben behaald, indien door de desbetreffende
      hogeschool wordt verklaard dat de ho-student beschikt over met 180 studiepunten vergelijkbare en tevens voor het
      dienstverband relevante kennis, inzicht en vaardigheden. De toepassing van de vorige volzin vervalt ten aanzien
      van die ho-student die niet binnen vier weken na aanvang van het dienstverband over 180 studiepunten beschikt.
      De in [artikel 7.7, vijfde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref32] bedoelde
      overeenkomst vermeldt tevens de leraar onder wiens verantwoordelijkheid de betrokken ho-student werkzaamheden van
      onderwijskundige aard verricht.

      10

      11

      12 Het negende lid is, behoudens de eis van verblijf in het laatste jaar van de opleiding, van overeenkomstige
      toepassing ten aanzien van ho-studenten van een universitaire lerarenopleiding, met dien verstande dat afwijking
      bij de voltijdse vorm van die opleiding mogelijk is voor ten hoogste de periode van een schooljaar waarin onderwijs
      wordt gegeven, en bij de deeltijdse vorm van die opleiding voor ten hoogste twee jaren.

      13 Voor door het bevoegd gezag vastgestelde vakken en andere programma-onderdelen, uitgezonderd godsdienstonderwijs
      en levensbeschouwelijk vormingsonderwijs, kunnen bij algemene maatregel van bestuur regels worden vastgesteld ten
      aanzien van benoeming dan wel tewerkstelling zonder benoeming. Bij deze algemene maatregel van bestuur kan het
      eerste lid geheel of gedeeltelijk van toepassing of overeenkomstige toepassing worden verklaard.

      14 In geval van een geschiktheidsverklaring als bedoeld in [artikel 118k][ref33] vindt de benoeming of
      tewerkstelling zonder benoeming plaats voor een periode van ten hoogste twee aaneengesloten schooljaren. Het
      bevoegd gezag kan deze benoemingsperiode, al dan niet onder door dat gezag te stellen voorwaarden, verlengen met
      ten hoogste twee jaren indien het bevoegd gezag daarvoor redenen aanwezig acht. Het bevoegd gezag beschikt over
      geordende gegevens met betrekking tot de toepassing van de tweede volzin. Het bevoegd gezag dat betrokkene voor de
      eerste maal na afgifte van de geschiktheidsverklaring benoemt of tewerkstelt zonder benoeming, tekent het feit en
      de datum van benoeming of tewerkstelling zonder benoeming aan op die verklaring.

      15 Het bevoegd gezag kan afwijken van het eerste lid, onder b, ten aanzien van degene die gelet op specifieke
      kennis en bekwaamheden, samenhangend met ervaringen en werkzaamheden in andere sectoren van de samenleving en het
      bedrijfsleven, naar het oordeel van het bevoegd gezag voldoende bekwaam is om onder verantwoordelijkheid van een
      daartoe door het bevoegd gezag aan te wijzen leraar voor een beperkte betrekkingsomvang te worden belast met een
      uitsluitend lesgevende taak voor vakken waar die specifieke kennis en bekwaamheden in het bijzonder betrekking op
      hebben. De betrekkingsomvang is voor het totaal van de in de eerste volzin bedoelde lesgevende taken ten hoogste
      een aantal van op jaarbasis gemiddeld 6 klokuren per week.

      16 Onze Minister kan met betrekking tot een vak of ander programmaonderdeel waarvoor niet met een getuigschrift
      afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref34] kan worden aangetoond dat
      betrokkene voldoet aan de bekwaamheidseisen, bedoeld in [artikel 36, eerste lid][ref35], en waarvoor de bekwaamheid
      evenmin blijkt uit de regeling bedoeld in lid 1c, onderdeel b, verklaren dat een leraar wordt geacht bij benoeming
      of tewerkstelling zonder benoeming te voldoen aan de bekwaamheidseisen tot het geven van voortgezet onderwijs in
      dat vak of dat andere programmaonderdeel.


