  - number: '85'
    text: |-
      1 De bekostiging van de kosten van het in [artikel 84][ref1] bedoelde personeel wordt vastgesteld door de krachtens
      [artikel 84][ref2] vastgestelde formatie te vermenigvuldigen met een gemiddelde personeelslast, met inachtneming
      van ter zake bij of krachtens de in [artikel 84, eerste lid][ref3], bedoelde algemene maatregel van bestuur vast
      te stellen voorschriften. De gemiddelde personeelslast is het genormeerde bedrag van de personele middelen per
      formatieplaats voor elke personeelscategorie, in welk bedrag tevens zijn verwerkt incidentele loonontwikkelingen en
      algemene salarismaatregelen.

      2 Onder de personele middelen worden verstaan de middelen ten behoeve van de salarissen, toelagen, uitkeringen en
      vergoedingen ten behoeve van personeel van de scholen, alsmede de bijdragen tot hun pensioen en tot dat van hun
      nagelaten betrekkingen.

      3 De gemiddelde personeelslast, die per schoolsoort kan verschillen, wordt bij ministeriële regeling vastgesteld.


