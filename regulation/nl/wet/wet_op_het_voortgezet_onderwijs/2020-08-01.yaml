  - number: 118q
    text: |-
      1 Het in artikel 118n en het in artikel 118p bedoelde bestuur dragen zorg voor de kwaliteit van de werkzaamheden
      van de instelling.

      2 Onze Minister kan besluiten dat ten aanzien van een instelling een of meer van de in artikel 118n, of artikel
      118p, eerste lid, bedoelde bevoegdheden worden ontnomen indien gebleken is dat de kwaliteit van de uitoefening
      daarvan tekortschiet, dan wel indien niet of niet meer wordt voldaan aan het terzake bij en krachtens deze
      wet bepaalde. Artikel 6.10, vierde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek is van
      overeenkomstige toepassing ten aanzien van de ontneming.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel118q
  - number: 118r
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften vastgesteld voor de uitvoering van
      artikel 118l, tweede lid, onder b, en vierde lid.

      2 Tevens kunnen bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur voorschriften worden
      vastgesteld voor de uitvoering van deze titel, waaronder in elk geval voorschriften met betrekking tot:

      a. waarborging van de kwaliteit van het geschiktheidsonderzoek en van de instellingen die dat onderzoek uitvoeren,

      b. de scholing en begeleiding, en het bekwaamheidsonderzoek, waaronder voorschriften ter waarborging van de
      kwaliteit, alsmede

      c. de procedure voor het aanvragen van het geschiktheidsonderzoek en voor afgifte van de geschiktheidsverklaring.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel118r
  - number: 118s
    text: |-
      Het in artikel 118n en het in artikel 118p bedoelde bestuur verstrekken aan Onze Minister alle inlichtingen
      die deze nodig acht ten behoeve van een goede naleving van deze titel. Het bestuur zendt de inspectie van
      het onderwijs telkens na zes maanden een overzicht van in die periode afgegeven geschiktheidsverklaringen en
      bekwaamheidsonderzoeken waaraan met goed gevolg is deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel118s
  - number: 118t
    text: |-
      1 Met het oog op verbetering van de kwaliteit, toegankelijkheid of doelmatigheid van het voortgezet
      onderwijs kan bij wijze van experiment bij algemene maatregel van bestuur worden afgeweken van
      [titel II, afdeling I, hoofdstuk I][ref1] en van [titel III, afdeling II, van de wet][ref2].

      2 In geval van toepassing van het eerste lid wordt bij algemene maatregel van bestuur in elk geval bepaald:

      a. het doel van het experiment,

      b. op welke wijze van welke artikelen van het in het eerste lid genoemde hoofdstuk en de daar genoemde afdeling
      wordt afgeweken,

      c. de duur van het experiment, en

      d. op welke wijze en aan de hand van welke criteria de met het experiment beoogde effecten worden geëvalueerd.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van een experiment.

      4 Een experiment duurt ten hoogste zes jaar, tenzij een langere duur gezien de bijzondere aard van het experiment
      noodzakelijk is. Alsdan wordt de duur van het experiment op ten hoogste acht jaar bepaald. Indien een voorstel
      van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele wettelijke regeling
      voordat een experiment is afgelopen, kan Onze Minister het experiment verlengen tot het tijdstip waarop het
      wetsvoorstel tot wet is verheven en in werking treedt.

      5 Onze Minister zendt drie maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur als
      bedoeld in het eerste lid aan de Staten-Generaal, een verslag over de doeltreffendheid en de effecten van het
      experiment in de praktijk, evenals een standpunt over de voortzetting van die algemene maatregel van bestuur,
      anders dan een voortzetting als experiment.

      6 In verband met een experiment als bedoeld in het eerste lid, kan bij algemene maatregel van bestuur eveneens bij
      wijze van experiment worden afgeweken van:

      a. [artikel 1 van de Leerplichtwet 1969][ref3],

      b. [artikel 1 van de Les- en cursusgeldwet][ref4],

      c. [artikel 1.1 van de Wet studiefinanciering 2000][ref5],

      d. [artikel 1.1 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref6].

      7 Dit artikel is van overeenkomstige toepassing op een samenwerkingsverband van een school met een school
      als bedoeld in [artikel 1][ref7], een school als bedoeld in de [Wet op het primair onderwijs][ref8],
      een school of instelling als bedoeld in de [Wet op de expertisecentra][ref9], een instelling
      als bedoeld in de [Wet educatie en beroepsonderwijs][ref10] of een instelling als bedoeld in
      de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref11]. Bij samenwerking met een
      school of instelling kan voor die school of instelling respectievelijk worden afgeweken van
      [hoofdstuk I, titel I, artikelen 1][ref12] en [2][ref13], [titel II, afdeling 1][ref14], [afdeling 2][ref15],
      [artikelen 47][ref16] en [48][ref17], en [titel IV, afdeling 1][ref18], [2][ref19], [4 tot en met 7][ref20] en
      [afdeling 8, paragrafen 2][ref21], [3][ref22], [6][ref23] en [7][ref24] en [afdeling 9, paragrafen 1][ref25]
      en [2, van de Wet op het primair onderwijs][ref26], dan wel [titel I, artikelen 1][ref27] en
      [2][ref28], [titel II, afdeling 1][ref29], [afdeling 2, artikelen 50][ref30] en [51][ref31], en
      [titel IV, afdelingen 1][ref32], [2][ref33], [4 tot en met 6][ref34] en [afdeling 7, paragrafen 2][ref35],
      [3][ref36], [6][ref37] en [7][ref38], en [afdeling 8, artikelen 146 tot en met 149][ref39] en
      [151, van de Wet op de expertisecentra][ref40], [hoofdstuk 2, titel 2][ref41], en [hoofdstukken 6][ref42] en
      [7 van de Wet educatie en beroepsonderwijs][ref43] en [hoofdstuk 2, titel 2][ref44], [hoofdstuk 5][ref45],
      [hoofdstuk 6][ref46] en [7][ref47], [hoofdstuk 9, titel 2][ref48], [hoofdstuk 10, titel 3][ref49] en
      [hoofdstuk 11, paragraaf 4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref50]. Bij de algemene
      maatregel van bestuur, bedoeld in het tweede lid, wordt geregeld welke bij of krachtens de wet, de Wet op het
      primair onderwijs, de Wet op de expertisecentra, de Wet educatie en beroepsonderwijs of de Wet hoger onderwijs
      en wetenschappelijk onderzoek vastgestelde voorschriften van toepassing of van overeenkomstige toepassing zijn op
      de samenwerking.


