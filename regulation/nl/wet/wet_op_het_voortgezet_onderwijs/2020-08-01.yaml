  - number: 96k
    text: |-
      1 Na de voorlopige vaststelling van het bedrag van de overschrijding, bedoeld in [artikel 96i, zesde lid][ref1],
      keren burgemeester en wethouders aan het bevoegd gezag van een niet door de gemeente in stand gehouden school
      dat op grond van [artikel 96j, eerste lid][ref2], aanspraak heeft op een uitkering, een voorschot uit. Het
      voorschot omvat het voorlopig vastgestelde bedrag van de overschrijding, berekend op de wijze als is aangegeven in
      [artikel 96j, eerste en tweede lid][ref3].

      2 De bekendmaking van de beschikkingen tot voorlopige en definitieve vaststelling van het overschrijdingsbedrag,
      bedoeld in het zesde onderscheidenlijk zevende lid van [artikel 96i][ref4], behelst tevens een staat van de
      voorzieningen als bedoeld in [artikel 96i, eerste lid, onderdeel i][ref5], waarin per kalenderjaar wordt aangegeven
      het verloop van de toevoegingen en de onttrekkingen aan de voorzieningen.


