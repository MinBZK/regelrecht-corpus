  - number: 76w
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school is gehouden aan de gemeenteraad onderscheidenlijk
      burgemeester en wethouders alle inlichtingen te verschaffen die de gemeenteraad onderscheidenlijk burgemeester en
      wethouders voor een adequate uitvoering van de bepalingen in dit hoofdstuk noodzakelijk achten.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel76w
  - number: '77'
    text: |-
      1 De scholen, bedoeld in [afdeling I van titel II][ref1] worden door het Rijk bekostigd met inachtneming van de
      [artikelen 78 tot en met 106][ref2]. De uitgaven, bedoeld in de [artikelen 96g][ref3] en [96h][ref4], alsmede de
      bedragen die de gemeente krachtens deze wet in aanvulling op de rijksbekostiging verstrekt, blijven ten laste van
      de gemeente.

      2 Aan niet door de gemeente in stand gehouden scholen als bedoeld in [afdeling I van titel II][ref5] wordt uit de
      openbare kas geen bekostiging verstrekt dan krachtens de bepalingen van deze wet.

      3 Met betrekking tot een scholengemeenschap dan wel een verticale scholengemeenschap of een school en de daaraan
      verbonden cursussen in de zin van artikel 75b, eerste lid, kunnen zo nodig in afwijking van het bepaalde in deze
      afdeling bij of krachtens algemene maatregel van bestuur voorschriften worden gegeven voor de toepassing van deze
      afdeling.

      4 Voor de toepassing van deze afdeling zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      [artikel 42b][ref6] of een openbare rechtspersoon als bedoeld in [artikel 42a][ref7], tenzij het tegendeel blijkt.


