      1 Grondslag der berekening is het aantal leerlingen dat op 1 oktober van elk van de jaren bij de school was
      ingeschreven.

      2 Indien voor de leerlingen binnen redelijke afstand geen plaatsruimte beschikbaar is op een gelijksoortige school,
      waar het verlangde onderwijs wordt gegeven, past Onze Minister [artikel 107][ref1] zodanig toe, dat de leerlingen
      van elk leerjaar de cursus kunnen voltooien.

      3 [Artikel 107][ref2] blijft buiten toepassing, zolang de school niet alle leerjaren omvat.

      4 In bijzondere gevallen kan Onze Minister op aanvraag van het bevoegd gezag besluiten voor een door hem te bepalen
      tijd toe te staan, dat een openbare school in stand wordt gehouden of een bijzondere school wordt bekostigd, ook al
      is het aantal leerlingen minder, dan in [artikel 107][ref3] is vermeld. Onze Minister besluit binnen zes maanden na
      ontvangst van een aanvraag.

      5 Binnen acht weken na de bekendmaking door het Centraal Bureau voor de Statistiek dan wel door Onze Minister van
      de aantallen leerlingen per school voor voortgezet onderwijs, stellen gedeputeerde staten vast welke gemeentelijke
      scholen uit hun provincie gedurende reeds een jaar niet meer voldoen aan de voor hen geldende norm, genoemd in
      [artikel 107][ref4]. Wanneer er als gevolg van de opheffing van een school als bedoeld in de vorige volzin, naar
      hun oordeel niet meer voldoende zal zijn voorzien in de behoefte aan openbaar onderwijs in een genoegzaam aantal
      scholen, dragen gedeputeerde staten burgemeester en wethouders op een aanvraag te doen op grond van het vierde lid.


