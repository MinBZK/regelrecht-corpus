  - number: '61'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen inrichtingen voor voortgezet onderwijs als bedoeld in
      [artikel 5, onderdeel e][ref1], worden aangewezen die voor bekostiging uit 's Rijks kas in aanmerking komen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voor de aangewezen inrichtingen voor voortgezet onderwijs
      voorschriften worden gegeven voor de toepassing van de bij of krachtens deze wet vastgestelde voorschriften over:

      a. de inrichting van het onderwijs,

      b. de examens,

      c. de rechtspositie van het personeel,

      d. de benoembaarheidsvereisten van het personeel, en

      e. de aanvang, wijze en beëindiging van de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel61
