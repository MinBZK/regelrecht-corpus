    text: |-
      1 Het bevoegd gezag stelt nadat op overeenstemming gericht overleg is gevoerd met de ouders een
      ontwikkelingsperspectief vast:

      a. voor leerlingen die extra ondersteuning behoeven, voor zover het betreft leerlingen die voorbereidend
      beroepsonderwijs, middelbaar of hoger algemeen voortgezet onderwijs of voorbereidend wetenschappelijk
      onderwijs volgen, met uitzondering van leerlingen die leerwegondersteunend onderwijs volgen als bedoeld in
      [artikel 10e][ref1];

      b. voor leerlingen die praktijkonderwijs volgen.

      2 In afwijking van het eerste lid, wordt het deel van het ontwikkelingsperspectief betreffende de individuele
      begeleiding, bedoeld in [artikel 17b, eerste lid][ref2], vastgesteld nadat overeenstemming bereikt is tussen het
      bevoegd gezag en de ouders.

      3 Het ontwikkelingsperspectief wordt zo spoedig mogelijk, doch uiterlijk binnen zes weken na de inschrijving van
      de leerling vastgesteld. Indien het betreft een inschrijving op grond van [artikel 27, lid 2f][ref3], wordt het
      ontwikkelingsperspectief uiterlijk binnen zes weken na de definitieve plaatsing van de leerling vastgesteld.

      4 Het ontwikkelingsperspectief wordt ten minste één keer per schooljaar met de ouders geëvalueerd.

      5 Nadat op overeenstemming gericht overleg is gevoerd met de ouders of nadat overeenstemming bereikt is met de
      ouders voor zover het betreft de individuele begeleiding, bedoeld in [artikel 17b, eerste lid][ref4], kan het
      bevoegd gezag het ontwikkelingsperspectief bijstellen.

      6 Het ontwikkelingsperspectief bevat een omschrijving van de begeleiding, bedoeld in [artikel 17b][ref5]. Indien
      voor leerlingen als bedoeld in het eerste lid, onder a, bij de inrichting van het onderwijs wordt afgeweken van
      één of meer onderdelen van het onderwijsprogramma, wordt dat in het ontwikkelingsperspectief vermeld. Bij algemene
      maatregel van bestuur worden nadere voorschriften over de inhoud van het ontwikkelingsperspectief vastgesteld.


