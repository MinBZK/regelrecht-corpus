  - number: '71'
    text: |-
      1 Onze Minister kan, onder door hem te stellen voorwaarden, voor bekostiging in aanmerking brengen een school die
      wordt opgericht door omzetting van een bekostigde openbare school in een gelijksoortige bijzondere school.

      2 Onze Minister brengt voor bekostiging in aanmerking een school die wordt opgericht door omzetting van een
      bekostigde bijzondere school in een gelijksoortige openbare school of door omzetting van een bekostigde bijzondere
      school in een gelijksoortige bijzondere school van een andere richting.

      3 Onze Minister brengt voor bekostiging in aanmerking een school waaraan het onderwijs wordt uitgebreid met
      onderwijs van een andere richting.

      4 Een omzetting of uitbreiding kan slechts plaatsvinden met ingang van 1 augustus van enig kalenderjaar.

      5 Dit artikel is ook van toepassing op een scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel71
  - number: '72'
    text: |-
      1 Met inachtneming van de [artikelen 53e tot en met 53i][ref1] kan Onze Minister een school of scholengemeenschap
      die is ontstaan door samenvoeging van scholen of scholengemeenschappen voor bekostiging in aanmerking brengen,
      indien voor alle bij de samenvoeging betrokken scholen of scholengemeenschappen geldt dat ten minste een
      bij ministeriële regeling vast te stellen percentage van de leerlingen van een vestiging van die school of
      scholengemeenschap afkomstig is uit dezelfde postcodegebieden als de leerlingen van een vestiging van een andere
      bij de samenvoeging betrokken school of scholengemeenschap.

      2 Na een samenvoeging kan op een vestiging in elk geval onderwijs worden verzorgd in dezelfde schoolsoorten,
      in dezelfde profielen als bedoeld in de [artikelen 10b][ref2] en [10d][ref3] en in dezelfde leerjaren als op de
      desbetreffende vestiging voor de samenvoeging werd verzorgd.

      3 Een samenvoeging kan slechts plaatsvinden met ingang van 1 augustus van enig kalenderjaar.


