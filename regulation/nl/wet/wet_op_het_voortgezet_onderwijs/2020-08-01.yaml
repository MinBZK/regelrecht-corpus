  - number: 75a
    text: |-
      Onze Minister kan aanvullende middelen ter beschikking stellen die niet strekken tot
      bekostiging van het onderwijs, bedoeld in deze wet, en de schoolbegeleiding als bedoeld in de
      [artikelen 179 van de Wet op het primair onderwijs][ref1] en [165 van de Wet op de expertisecentra][ref2] ten
      behoeve daarvan, maar die direct of indirect dienstig zijn voor de uitvoering van het onderwijs of voor verhoging
      van de mogelijkheid tot deelname aan het onderwijs. Onze Minister stelt deze middelen ter beschikking onder nader
      te stellen voorwaarden. Bij de toepassing van dit artikel zijn de [artikelen 4][ref3], [5][ref4], [9][ref5] en
      [10 van de Wet overige OCW-subsidies][ref6] van toepassing.


