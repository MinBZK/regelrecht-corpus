  - number: 10b17
    text: |-
      1 In afwijking van [artikel 6g, derde en vierde lid][ref1], en
      [artikel 7.2.7, derde lid, onderdelen b, c en d, en achtste lid, van de Wet educatie en beroepsonderwijs][ref2]
      omvat het onderwijsprogramma van een doorlopende leerroute vmbo-mbo waarvan een beroepsopleiding in de
      beroepsopleidende leerweg, bedoeld in artikel 7.2.7, derde lid, van de Wet educatie en beroepsonderwijs deel
      uitmaakt:

      a. bij een cursusduur van twee jaren ten minste 2.000 klokuren, waarvan ten minste 1.400 begeleide onderwijsuren en
      ten minste 250 klokuren aan beroepspraktijkvorming;

      b. bij een cursusduur van drie jaren ten minste 3.000 klokuren, waarvan ten minste 2.400 begeleide onderwijsuren en
      ten minste 250 klokuren aan beroepspraktijkvorming;

      c. bij een cursusduur van vier jaren ten minste 4.000 klokuren, waarvan ten minste 2.950 begeleide onderwijsuren en
      ten minste 450 klokuren aan beroepspraktijkvorming;

      d. bij een cursusduur van vijf jaren ten minste 5.000 klokuren, waarvan ten minste 3.500 begeleide onderwijsuren en
      ten minste 900 klokuren aan beroepspraktijkvorming; en

      e. bij een cursusduur van zes jaren ten minste 6.000 klokuren, waarvan ten minste 4.050 begeleide onderwijsuren en
      ten minste 1.350 klokuren aan beroepspraktijkvorming.

      2 Het bevoegd gezag van de school en het bevoegd gezag van de instelling voor beroepsonderwijs kunnen gezamenlijk
      een onderwijsprogramma verzorgen dat minder uren omvat dan de in het eerste lid, onderdelen a tot en met e,
      genoemde aantallen mits de doorlopende leerroute vmbo-mbo aantoonbaar van voldoende kwaliteit is. In het geval
      dat het onderwijsprogramma minder uren omvat, legt het bevoegd gezag dit vast in het schoolplan, bedoeld in
      [artikel 24, eerste lid][ref3], en neemt dit op in de schoolgids, bedoeld in [artikel 24a, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
