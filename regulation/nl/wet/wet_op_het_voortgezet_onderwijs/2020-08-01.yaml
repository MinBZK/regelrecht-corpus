  - number: 53e
    text: |-
      1 In deze afdeling wordt verstaan onder:

        - *fusie:* een bestuurlijke of institutionele fusie,
        - *institutionele fusie:* een fusie als bedoeld in de [artikelen 72, eerste lid][ref1], en 72a, eerste lid,
      onderdelen a en b, waarbij een school ontstaat door samenvoeging van twee of meer scholen dan wel instellingen als
      bedoeld in de [Wet educatie en beroepsonderwijs][ref2],
        - *bestuurlijke fusie:* een fusie waarbij een of meer rechtspersonen de instandhouding van een school, een
      school als bedoeld in de [Wet op het primair onderwijs][ref3] dan wel de [Wet op de expertisecentra][ref4],
      een instelling als bedoeld in de Wet educatie en beroepsonderwijs of een instelling als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5] overdragen.

      2 Het eerste lid, onderdeel c, is niet van toepassing op het instellen van een openbare rechtspersoon als bedoeld
      in [artikel 42a, eerste lid, eerste volzin][ref6] of de instandhouding van een of meer openbare scholen door een
      stichting als bedoeld in [artikel 42b, eerste lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
