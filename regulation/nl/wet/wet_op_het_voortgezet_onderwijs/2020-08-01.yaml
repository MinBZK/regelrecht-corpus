  - number: 85d
    text: |-
      1 Indien op 1 februari het aantal leerlingen dat door het samenwerkingsverband toelaatbaar is verklaard tot het
      voortgezet speciaal onderwijs en is ingeschreven op scholen voor voortgezet speciaal onderwijs en speciaal en
      voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref1], voor
      zover het betreft het daaraan verzorgde voortgezet speciaal onderwijs, meer bedraagt dan op 1 oktober daaraan
      voorafgaand, draagt het samenwerkingsverband voor het verschil per leerling een bedrag over aan de school waar de
      leerling is ingeschreven. Het in de eerste volzin bedoelde bedrag is de som van:

      a. een bedrag dat afhankelijk is van de in de toelaatbaarheidsverklaring opgenomen ondersteuningsbehoefte van de
      leerling en dat overeenkomt met één van de normbedragen die bij ministeriële regeling worden vastgesteld, en

      b. een bij ministeriële regeling vast te stellen bedrag, welk bedrag wordt verhoogd met een bedrag dat wordt
      vermenigvuldigd met de geraamde landelijk gewogen gemiddelde leeftijd van leraren van scholen voor voortgezet
      speciaal onderwijs.

      2 De overdracht op grond van het eerste lid heeft betrekking op het schooljaar dat volgt op de in het eerste lid
      bedoelde peildatum.

      3 Indien de in [artikel 85b, eerste lid][ref2], bedoelde bekostiging niet voldoende is om daaruit de
      verplichtingen, bedoeld in dit artikel na te komen, dragen alle scholen en scholen voor voortgezet
      speciaal onderwijs en speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref3], voor zover het betreft het daaraan verzorgde voortgezet speciaal onderwijs,
      waarvan één of meer vestigingen zijn gelegen in het gebied van het samenwerkingsverband, de ontbrekende bekostiging
      over aan het samenwerkingsverband. Het aandeel van de onderscheiden scholen en scholen voor voortgezet speciaal
      onderwijs en speciaal en voortgezet speciaal onderwijs, bedoeld in de eerste volzin, wordt bepaald overeenkomstig
      de regeling die daarvoor op grond van [artikel 17a, achtste lid, onderdeel h][ref4], in het ondersteuningsplan van
      het samenwerkingsverband is opgenomen.


