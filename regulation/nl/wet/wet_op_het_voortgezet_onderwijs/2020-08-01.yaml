  - number: 103b
    text: |-
      1 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling gebruiken in het verkeer met de leerling op
      wie het nummer betrekking heeft, of, indien de leerling minderjarig is, met de ouders van deze leerling.

      2

      3

      4 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling, al dan niet tezamen met een of meer van de
      gegevens, bedoeld in [artikel 12, eerste lid, van de Wet register onderwijsdeelnemers][ref1], gebruiken in het
      verkeer met Onze Minister ten behoeve van de vaststelling van de bekostiging van de school.

      5 Het bevoegd gezag en het hoofd, bedoeld in [artikel 1, onder d, van de Leerplichtwet 1969][ref2],
      gebruiken het persoonsgebonden nummer van een leerling in contacten met een gemeente in het kader van de
      [Leerplichtwet 1969][ref3], tezamen met de gegevens die noodzakelijk zijn voor het toezicht op de naleving van
      [die wet][ref4] door de gemeente.

      6 Het bevoegd gezag gebruikt bij de opgave aan burgemeester en wethouders, bedoeld in
      [artikel 27d, eerste lid][ref5], en [artikel 28, eerste lid][ref6], het persoonsgebonden nummer van de betrokkene.

      7 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het contact met een andere school
      of een school of instelling voor ander onderwijs ten behoeve van de in- en uitschrijving van die leerling of ten
      behoeve van het volgen van onderwijs in een doorlopende leerroute vmbo-mbo als bedoeld in [artikel 10b10][ref7] of
      de geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in [artikel 10b21][ref8]. Onder dit contact wordt mede
      begrepen de uitwisseling van leergegevens en direct met het leren samenhangende begeleidingsgegevens. Bij algemene
      maatregel van bestuur worden de gegevens, bedoeld in de vorige volzin, gespecificeerd.

      8

      9 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling van het voortgezet onderwijs in het kader
      van de uitvoering van subsidieregelingen van het Europees Sociaal Fonds.

      10 Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een leerling ter uitvoering van
      [artikel 107, vijfde lid, van de Vreemdelingenwet 2000][ref9], anders dan ter nakoming van verplichtingen als
      referent in de zin van [artikel 1 van die wet][ref10].

      11 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in contacten met een school als bedoeld
      in de [Wet op de expertisecentra][ref11] in het kader van de ondersteuning die deze school biedt op grond van
      [artikel 8a, eerste lid, van de Wet op de expertisecentra][ref12].

      12 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling eenmalig gebruiken ten behoeve van het
      genereren van een pseudoniem voor deze leerling met het oog op het bieden van voorzieningen in het kader van het
      onderwijs en de begeleiding van leerlingen. Het bevoegd gezag draagt er zorg voor dat het pseudoniem wordt bewaard
      in de systemen waarin de leerlingen zijn geregistreerd.

      13 Het bevoegd gezag kan het pseudoniem, bedoeld in het twaalfde lid, gebruiken voor het genereren van een ander
      pseudoniem voor een leerling in het kader van de toegang tot en het gebruik van digitale leermiddelen of het
      digitaal afnemen van toetsen en examens, waarbij het bevoegd gezag er zorg voor draagt dat dit andere pseudoniem
      wordt bewaard in de systemen waarin de leerlingen zijn geregistreerd. Dit andere pseudoniem wordt uitsluitend
      verstrekt aan een leverancier die een digitaal product of een digitale dienst aanbiedt bestaande uit leerstof of
      toetsen en de daarmee samenhangende digitale diensten.

      14 Bij algemene maatregel van bestuur kunnen andere gevallen worden aangewezen dan het geval, bedoeld in het
      dertiende lid, waarvoor het bevoegd gezag op basis van het pseudoniem, bedoeld in het twaalfde lid, een ander
      pseudoniem kan genereren.

      Daarbij worden in ieder geval de categorieën van ontvangers van dit andere pseudoniem aangewezen.

      15 Bij ministeriële regeling worden regels gesteld over de voorwaarden waaronder de pseudoniemen, bedoeld in het
      twaalfde tot en met het veertiende lid, kunnen worden gegenereerd en gebruikt. Deze voorwaarden betreffen in ieder
      geval de duur en de beveiliging, waaronder de gescheiden opslag van de pseudoniemen.


