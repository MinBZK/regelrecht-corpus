  - number: '15'
    text: |-
      Bij algemene maatregel van bestuur wordt met betrekking tot de profielen, bedoeld in
      [artikel 12, tweede lid][ref1], vastgesteld:

      a. het relatieve gewicht van elk van de vakken binnen het geheel van de vakken van het eindexamen, uitgedrukt in
      een normatieve studielast per vak,

      b. de nadere ordening van de vakken, genoemd in de [artikelen 13][ref2] en [14][ref3], met het oog op hun plaats in
      het gemeenschappelijk deel, het profieldeel of het vrije deel,

      c. voorschriften over vakken en andere programma-onderdelen, bedoeld in [artikel 13, zevende lid][ref4], en
      [artikel 14, zesde lid][ref5], die het bevoegd gezag aanwijst, behalve godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs aan bijzondere scholen, en

      d. voorschriften over de mogelijkheid van vrijstelling en de bevoegdheid van het bevoegd gezag om ontheffing te
      verlenen van onderdelen van de [artikelen 13][ref6] en [14][ref7].


