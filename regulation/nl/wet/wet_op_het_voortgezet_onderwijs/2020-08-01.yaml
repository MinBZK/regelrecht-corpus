  - number: '97'
    text: |-
      1 Het bevoegd gezag van een bijzondere school houdt nauwkeurig boek van de inkomsten en uitgaven.

      2 Het bevoegd gezag van een bijzondere school geeft desverlangd aan de door Onze Minister aangewezen ambtenaren de
      boeken en bescheiden ter inzage. Het bevoegd gezag is gehouden deze boeken en bescheiden zeven jaren te bewaren.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel97
  - number: '99'
    text: |-
      1 Het bevoegd gezag besteedt de verstrekte bekostiging en de betaalde bedragen ten behoeve van die school op de
      wijze zoals aangegeven in het tweede tot en met vijfde lid.

      2 De voor voorzieningen in de huisvesting betaalde bedragen worden zodanig aangewend dat een behoorlijke en
      deugdelijke totstandkoming van deze voorzieningen is verzekerd. Indien na realisatie van de in de eerste volzin
      bedoelde voorzieningen de bedragen niet volledig zijn aangewend, kan het resterende deel daarvan worden aangewend
      voor de kosten van personeel of voorzieningen in de exploitatie.

      3 Het voor personeels- en exploitatiekosten betaalde bedrag wordt aangewend voor de kosten van personeel, zoals
      onderscheiden in de [artikelen 32][ref1] en [32a][ref2], voor voorzieningen in de exploitatie. In geval van een
      overschot op die bedragen, kan dat overschot worden aangewend voor voorzieningen in de huisvesting.

      4

      5 De verstrekte overschrijdingsbedragen worden ten behoeve van het onderwijs aan de scholen van het bevoegd gezag
      aangewend.

      6 Het bevoegd gezag kan de bedragen, bedoeld in het derde lid, mede aanwenden voor de kosten van personeel of
      voorzieningen in de exploitatie van:

      a. een andere school voor voortgezet onderwijs of een samenwerkingsverband;

      b. een verticale scholengemeenschap;

      c. een basisschool of een speciale school voor basisonderwijs als bedoeld in de
      [Wet op het primair onderwijs][ref3], een school voor speciaal onderwijs, voor voortgezet speciaal onderwijs
      of voor speciaal en voortgezet speciaal onderwijs dan wel een instelling voor speciaal en voortgezet speciaal
      onderwijs als bedoeld in de [Wet op de expertisecentra][ref4].

      7 De op grond van [artikel 77a][ref5], [artikel 96g][ref6] of [artikel 96h][ref7] verstrekte bekostiging wordt
      besteed aan het doel waarvoor zij zijn verleend.

      8 Het bevoegd gezag kan met het bevoegd gezag waarmee het een samenwerkingsovereenkomst heeft gesloten als bedoeld
      in [artikel 25a, derde lid][ref8], overeenkomen om vanwege de samenwerking een deel van de bekostiging over te
      dragen aan het andere bevoegd gezag, bedoeld in het eerste lid van dat artikel.

      9 Het samenwerkingsverband wendt het totaal van de in de [artikelen 85b][ref9], [85b1][ref10], [89a][ref11]
      en [89a1][ref12] bedoelde bedragen voor personeelskosten en de materiële instandhouding uitsluitend
      aan voor personeelskosten en kosten voor materiële instandhouding van het samenwerkingsverband voor
      ondersteuningsvoorzieningen.


