  - number: '120'
    text: |-
      Bij twijfel of deze wet op een of meer inrichtingen van onderwijs van toepassing is, wordt beslist bij koninklijk
      besluit.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel120
  - number: '121'
    text: |-
      1 De voordracht voor een krachtens [artikel 23a1, vierde lid][ref1], [41b, eerste of tweede lid][ref2], of
      [118t, tweede lid][ref3], vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken
      nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      2 Een krachtens [artikel 6g1, derde lid][ref4], [10, tiende lid][ref5], [10b, tiende of elfde lid][ref6],
      [10d, tiende of elfde lid][ref7], [10f, vijfde lid][ref8], [11b][ref9], [11c, tweede lid][ref10],
      [15][ref11], [22, eerste lid][ref12], [24a, tweede lid][ref13], [29, vierde lid][ref14],
      [36, eerste, tweede of derde lid][ref15], [38, tweede lid][ref16],[ 84, eerste lid][ref17],
      [96n, eerste lid][ref18], [103b, zevende lid][ref19], [118l, derde lid, onderdeel b][ref20], of
      [118r, eerste lid][ref21], vastgestelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het
      onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe strekkend
      voorstel van wet zo spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de
      beide kamers der Staten-Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur
      ingetrokken.

      3 Indien de verdeling van de in [artikel 96n, eerste lid, onderdeel c][ref22], bedoelde kosten bij ministeriële
      regeling wordt geregeld, is het tweede lid van overeenkomstige toepassing.

      4 De ministeriële regeling, bedoeld in [artikel 86, vijfde lid][ref23], wordt bekendgemaakt in de Staatscourant,
      onder gelijktijdige overlegging aan de Tweede Kamer der Staten-Generaal. De ministeriële regeling treedt niet
      eerder in werking dan nadat vier weken zijn verstreken na het overleggen aan de Tweede Kamer en gedurende die
      termijn niet door of namens de Kamer de wens tot overleg over de regeling te kennen wordt gegeven, dan wel met de
      Tweede Kamer overleg is gevoerd. De eerste en tweede volzin zijn van overeenkomstige toepassing ten aanzien van
      tussentijdse aanpassingen als bedoeld in artikel 86, zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
