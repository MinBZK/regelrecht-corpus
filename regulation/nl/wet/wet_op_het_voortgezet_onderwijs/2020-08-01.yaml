  - number: 10b2
    text: |-
      Het bevoegd gezag stelt bij de inrichting van het leer-werktraject in elk geval vast:

      a. de organisatie van de leerlingbegeleiding vanwege het bevoegd gezag zowel binnen de school als bij het bedrijf
      dat of de organisatie die het buitenschoolse praktijkgedeelte verzorgt, alsmede

      b. de invulling van het buitenschoolse praktijkgedeelte en waarborgt daarbij dat niet uitsluitend eenzijdige
      productiearbeid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel10b2
  - number: 10b3
    text: |-
      1 Het buitenschoolse praktijkgedeelte wordt verzorgd door een bedrijf of organisatie, op grondslag van een leer-
      werkovereenkomst, gesloten door het bevoegd gezag, de betrokken leerling of diens wettelijk vertegenwoordiger en
      dat bedrijf of die organisatie.

      2 De leer-werkovereenkomst regelt de rechten en plichten van partijen en omvat ten minste bepalingen over:

      a. inhoud, leerdoelen, duur, periode van en beoordelingsmaatstaven voor het buitenschoolse praktijkgedeelte,

      b. de begeleiding van de leerling, en

      c. de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden ontbonden.

      3 In afwijking van [artikel 7:610, tweede lid tweede volzin, van het Burgerlijk Wetboek][ref1], is in geval van
      strijd als bedoeld in die volzin, [artikel 10b3][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b3
