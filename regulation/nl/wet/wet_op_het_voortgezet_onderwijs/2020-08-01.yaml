    text: |-
      1 Het bevoegd gezag verstrekt aan Onze Minister de basisgegevens van leraren:

      a. die zijn benoemd of zijn tewerkgesteld zonder benoeming op grond van
      [artikel 33, eerste lid, onderdeel b, onder 3][ref1], en [118k, negende en twaalfde lid][ref2], of

      b. die onderwijs verzorgen op grond van de [artikelen 33, derde of vierde lid][ref3], of [35a][ref4],

      en draagt zorg voor het correct bijhouden van die gegevens ten behoeve van het registervoorportaal.

      2 Het eerste lid, onder b, is van overeenkomstige toepassing op een leraar die onderwijs verzorgt op grond van
      [artikel 33, vijfde lid][ref5], en niet voldoet aan de bekwaamheidseisen voor het onderwijs dat hij geeft.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de tijdstippen en de wijze van
      levering en over de correctie van de gegevens.


