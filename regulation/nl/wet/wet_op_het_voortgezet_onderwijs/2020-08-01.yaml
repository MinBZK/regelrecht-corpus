  - number: 27c
    text: |-
      1 Er is tot een bij koninklijk besluit te bepalen tijdstip een landelijke commissie voor geschillen waarbij
      elke school, school als bedoeld in de [Wet op het primair onderwijs][ref1] en school als bedoeld in de
      [Wet op de expertisecentra][ref2] is aangesloten.

      2 De commissie neemt kennis van geschillen tussen ouders en bevoegd gezag van een school die ontstaan bij de
      toepassing van:

      a. [artikel 26, eerste, tweede en vijfde lid][ref3], en

      b. [artikel 27, eerste lid, vierde volzin en de leden 2b, 2c en 2d][ref4].

      3 De commissie brengt op verzoek van de ouders binnen 10 weken een oordeel uit aan het bevoegd gezag, rekening
      houdend met het schoolondersteuningsprofiel en het ondersteuningsplan.

      4 Indien een geschil aanhangig is gemaakt bij de commissie en de ouders bezwaar hebben gemaakt tegen de beslissing
      over de toelating of de verwijdering, neemt het bevoegd gezag de beslissing op bezwaar niet dan nadat de commissie
      heeft geoordeeld. De termijn voor het nemen van de beslissing op bezwaar wordt opgeschort met ingang van de
      dag waarop het geschil aanhangig is gemaakt bij de commissie tot de dag waarop de commissie het oordeel heeft
      uitgebracht.

      5 Bij algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot de commissie, waaronder in elk
      geval het aantal leden, de wijze van benoeming en ontslag en de deskundigheid van de leden van de commissie.


