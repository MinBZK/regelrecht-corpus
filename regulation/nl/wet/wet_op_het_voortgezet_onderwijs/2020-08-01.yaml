  - number: 10b7
    text: |-
      1 Leer-werktrajecten worden verzorgd op grondslag van een samenwerkingsovereenkomst tussen het
      bevoegd gezag van de school en het bevoegd gezag van een regionaal opleidingencentrum of een
      agrarisch opleidingscentrum voor zover aan die instelling een basisberoepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder b, van de Wet educatie en beroepsonderwijs][ref1] wordt verzorgd.

      2 Een samenwerkingsovereenkomst als bedoeld in het eerste lid voorziet in elk geval in
      de inrichting van een doorlopende leerweg tot en met de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onder b, van de Wet educatie en beroepsonderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
