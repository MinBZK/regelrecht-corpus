  - number: '59'
    text: |-
      Onze Minister kan de aanwijzing intrekken, indien:

      a. niet langer wordt voldaan aan de voorschriften gegeven bij of krachtens de [artikelen 56][ref1],
      [58, met uitzondering van het zevende lid, onderdeel d][ref2], en [58a][ref3],

      b. niet of niet meer wordt voldaan aan de leveringsverplichting, bedoeld in
      [artikel 12, eerste, derde en vierde lid, van de Wet register onderwijsdeelnemers][ref4],

      c. het schoolbestuur of het personeel van de school in strijd handelt met
      [artikel 5:20 van de Algemene wet bestuursrecht][ref5], of

      d. van misbruik van de verleende aanwijzing is gebleken.


