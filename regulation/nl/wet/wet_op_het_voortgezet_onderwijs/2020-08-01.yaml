  - number: '34'
    text: |-
      1 Tot rector, directeur, conrector of adjunct-directeur kan slechts worden benoemd of tewerkgesteld zonder
      benoeming degene die:

      a. in het bezit is van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1], en

      b. met inachtneming van [artikel 33, eerste lid, onderdeel b][ref2], kan worden benoemd of tewerkgesteld zonder
      benoeming tot leraar in een van de vakken die aan de school worden onderwezen, en

      c. voor zover tot de functie werkzaamheden behoren waarvoor op grond van [artikel 36, tweede lid][ref3],
      bekwaamheidseisen zijn vastgesteld, in het bezit is van een getuigschrift, afgegeven krachtens de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4], dat is voldaan aan die eisen, of

      d. in het bezit is van een ten aanzien van de door hem te verrichten al dan niet in
      [artikel 36, tweede lid][ref5], bedoelde werkzaamheden verleende erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref6], of

      e. volgens bij algemene maatregel van bestuur te geven regels zijn bekwaamheid heeft aangetoond, en

      f. niet krachtens rechterlijke uitspraak is uitgesloten van het verrichten van de onder c bedoelde werkzaamheden.

      2 Het eerste lid, onderdeel b, is niet van toepassing op de leden van de centrale directie van een school als
      bedoeld in [artikel 32a, eerste lid][ref7].

      3 Het bevoegd gezag van een school aan het hoofd waarvan geen centrale directie is geplaatst, kan voor ten hoogste
      de helft van het aantal, bestaande uit de rector of de directeur en de aan de school verbonden conrectoren of
      adjunct-directeuren, afwijken van het bepaalde in het eerste lid, onderdeel b.


