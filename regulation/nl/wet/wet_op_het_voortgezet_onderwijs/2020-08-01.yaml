  - number: '69'
    text: |-
      1 De aanspraak op bekostiging op grond van [artikel 64][ref1] van een nieuwe school of scholengemeenschap vervalt,
      indien:

      a. vanaf het moment waarop de bekostiging overeenkomstig [artikel 68, tweede lid][ref2], aanvangt, geen onderwijs
      aan de nieuwe school of scholengemeenschap wordt gegeven, of

      b. het vestigingsadres niet binnen hemelsbreed gemeten een afstand van 3 kilometer van het bij de aanvraag om
      bekostiging opgegeven beoogde vestigingsadres komt te liggen.

      2 De aanspraak op bekostiging vervalt, indien binnen 1 jaar na het besluit van Onze Minister om een school op grond
      van [artikel 65, tweede lid][ref3], voor bekostiging in aanmerking te brengen, geen onderwijs aan de nieuwe school
      wordt gegeven.

      3 Op aanvraag van het bevoegd gezag kan Onze Minister besluiten in bijzondere gevallen de aanspraak op bekostiging
      voor een bepaalde tijd te handhaven.


