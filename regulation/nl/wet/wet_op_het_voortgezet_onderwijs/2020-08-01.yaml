  - number: 41c
    text: |-
      Onze Minister is voor de verwerking van persoonsgegevens in het kader van het lerarenregister de
      verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel41c
  - number: 41e
    text: |-
      Onze Minister stelt bij ministeriële regeling regels over de autorisatie van degenen die onder zijn gezag vallen
      voor verwerking van persoonsgegevens in het kader van het lerarenregister.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel41e
  - number: 41f
    text: |-
      1 Het lerarenregister bevat voor elke daarin opgenomen leraar:

      a. het burgerservicenummer;

      b. de geslachtsnaam, de voornamen, het geslacht, het adres, de postcode, en de geboortedatum van de leraar;

      c. gegevens betreffende de benoeming of tewerkstelling zonder benoeming, waaronder in ieder geval de ingangsdatum
      ervan;

      d. gegevens betreffende de school waaraan hij benoemd is of tewerkgesteld zonder benoeming, waaronder in ieder
      geval het registratienummer van de school;

      e. het onderwijs waarvoor de leraar kan opgaan voor herregistratie;

      f. voor welk onderwijs als bedoeld in onderdeel e de leraar opgaat voor herregistratie;

      g. gegevens betreffende de activiteiten voor herregistratie; en

      h. gegevens betreffende de herregistratie waaronder, indien van toepassing, de aantekening, bedoeld in
      [artikel 41k, tweede lid][ref1].

      2 Bij of krachtens algemene maatregel van bestuur kunnen de gegevens, bedoeld in het eerste lid, onderdelen c tot
      en met h, nader worden gespecificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41k
