  - number: 76j
    text: |-
      1 Burgemeester en wethouders beslissen bij beschikking met ingang van welk tijdstip in het jaar volgend op het jaar
      van vaststelling van het programma, bedoeld in [artikel 76f][ref1], de bekostiging van een voorziening die in het
      programma is opgenomen, daadwerkelijk een aanvang kan nemen, onverminderd het bepaalde in [artikel 76l][ref2].

      2 De aanspraak op bekostiging van een voorziening vervalt, indien niet binnen een in de verordening op basis
      van [artikel 76m][ref3] te bepalen termijn na de beschikking, bedoeld in het eerste lid, met betrekking tot de
      voorziening een bouwopdracht is gegeven dan wel een koop-, huur- of erfpachtovereenkomst is gesloten.


