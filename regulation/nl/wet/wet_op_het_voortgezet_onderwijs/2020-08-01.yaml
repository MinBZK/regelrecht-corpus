  - number: 76n
    text: |-
      1 Het bevoegd gezag van een andere dan een gemeentelijke school geeft opdracht de voorziening in de huisvesting
      waartoe op grond van de [artikelen 76f][ref1] en [76i][ref2] kan worden overgegaan, tot stand te brengen met
      daartoe door de gemeente beschikbaar te stellen gelden, tenzij het met burgemeester en wethouders overeenkomt dat
      de gemeente deze voorziening tot stand brengt.

      2 Indien de gemeente de voorziening in de huisvesting van een andere dan een gemeentelijke school tot stand
      heeft gebracht, worden gebouw en terrein aan het bevoegd gezag in eigendom overgedragen, tenzij burgemeester en
      wethouders en het bevoegd gezag anders overeenkomen.

      3 Indien de voorziening in de huisvesting, bedoeld in het tweede lid, niet voldoet aan de eisen voor
      eigendomsoverdracht, geven burgemeester en wethouders deze aan het bevoegd gezag in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76i
