  - number: 103a
    text: |-
      1 Het bevoegd gezag onderscheidenlijk het samenwerkingsverband draagt er zorg voor dat het ten behoeve
      van Onze Minister beschikt over geordende gegevens die van belang zijn voor de berekening van de hoogte
      van de bekostiging, alsmede over een verklaring over de juistheid van de bekostigingsgegevens, afgegeven
      door een door de toezichthouder of het toezichthoudend orgaan aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2, van het Burgerlijk Wetboek][ref1].

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de
      definiëring, de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.

      3 Het bevoegd gezag onderscheidenlijk het samenwerkingsverband bewaart de gegevens, bedoeld in het eerste lid, en
      de desbetreffende boeken en bescheiden gedurende een periode van zeven jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
