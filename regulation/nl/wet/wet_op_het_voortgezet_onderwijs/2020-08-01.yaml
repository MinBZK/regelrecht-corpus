  - number: 32b1
    text: |-
      1 Het bestuur kan hem bij wettelijk voorschrift opgedragen taken en bevoegdheden overdragen aan de centrale
      directie, de rector of de directeur van de school.

      2 De centrale directie, de rector of de directeur van de school kunnen hen bij wettelijk voorschrift opgedragen of
      door het bevoegd gezag overgedragen taken en bevoegdheden overdragen aan elkaar of aan de adjunct-directeur.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel32b1
  - number: 32c
    text: |-
      1 Het bevoegd gezag stelt na overleg met de rector, de directeur, de conrector en de adjunct-directeur en indien
      toepassing is gegeven aan [artikel 32a][ref1] met de centrale directie, een managementstatuut vast. In het
      managementstatuut is ten minste een regeling opgenomen betreffende de bevoegdheden van de rector, de directeur, de
      conrector en de adjunct-directeur en indien toepassing is gegeven aan [artikel 32a][ref2] van de bevoegdheden van
      de centrale directie, met betrekking tot de toedeling, bestemming en aanwending van de bekostiging.

      2 Het managementstatuut bevat tevens de aanduiding van de andere aan het bevoegd gezag bij wettelijk voorschrift
      toegekende taken en bevoegdheden waarvan het bevoegd gezag heeft bepaald dat de rector, de directeur, de conrector,
      de adjunct-directeur of de centrale directie van de school deze in naam van het bevoegd gezag kan uitoefenen. Het
      managementstatuut bevat voorts instructies ten aanzien van deze taken en bevoegdheden.

      3 In het managementstatuut worden tevens vastgelegd:

      a. de taken en bevoegdheden die het bestuur overdraagt aan de centrale directie, de rector en de directeur van de
      school, indien toepassing is gegeven aan [artikel 32b1, eerste lid][ref3];

      b. de taken en bevoegdheden die de centrale directie, de rector en de directeur van de school hebben overgedragen
      aan elkaar of aan de adjunct-directeur, indien toepassing is gegeven aan [artikel 32b1, tweede lid][ref4]; en

      c. de richtlijnen voor de uitoefening van de overgedragen taken en bevoegdheden.

      4 Het bevoegd gezag draagt er zorg voor dat een exemplaar van het managementstatuut in het gebouw van de school
      ter inzage beschikbaar is op een voor een ieder toegankelijke plaats. Het bevoegd gezag zendt een exemplaar van
      het managementstatuut, alsmede elke wijziging daarvan, zo spoedig mogelijk na de vaststelling ter kennisneming aan
      de inspectie.


