  - number: '68'
    text: |-
      1 Indien het bevoegd gezag daartoe op grond van [artikel 76e][ref1] een aanvraag indient, stelt het college van
      burgemeester en wethouders uiterlijk op 1 augustus van het zesde kalenderjaar na het besluit van Onze Minister
      om een school of scholengemeenschap voor bekostiging in aanmerking te brengen, huisvesting ter beschikking. Het
      besluit hiertoe maakt het college van burgemeester en wethouders meer dan 1 jaar voor het beschikbaar stellen van
      de huisvesting bekend.

      2 Indien huisvesting is vereist, vangt de bekostiging aan op 1 augustus van het kalenderjaar volgend op het
      kalenderjaar waarin het bevoegd gezag, voor 1 augustus, heeft aangetoond dat het college van burgemeester en
      wethouders de huisvesting ter beschikking zal stellen.

      3 Indien geen huisvesting is vereist, vangt de bekostiging aan op 1 augustus volgend op het besluit van Onze
      Minister om een school of scholengemeenschap voor bekostiging in aanmerking te brengen. Op verzoek van het bevoegd
      gezag kan dit tijdstip 1 of 2 jaar worden uitgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76e
