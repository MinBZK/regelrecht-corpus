  - number: '89'
    text: |-
      1 Indien bijzondere ontwikkelingen in het voortgezet onderwijs daartoe aanleiding geven, kunnen bij
      ministeriële regeling voorschriften worden vastgesteld omtrent het verstrekken van aanvullende bekostiging voor
      exploitatiekosten.

      2 Indien bijzondere ontwikkelingen in het voortgezet onderwijs aan een school daartoe aanleiding geven, kan Onze
      Minister op aanvraag van het bevoegd gezag onder door hem te stellen voorwaarden en voor een door hem te bepalen
      periode aanvullende bekostiging voor exploitatiekosten verstrekken. De aanvraag wordt ingediend in het kalenderjaar
      waarin deze ontwikkelingen zijn aangevangen. Onze Minister besluit binnen vier maanden na ontvangst van de
      aanvraag.

      3 Onze Minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.

      4 Onze Minister kan in verband met de in het tweede lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel89
  - number: 89a
    text: |-
      1 Aan het samenwerkingsverband wordt bekostiging voor materiële instandhouding toegekend.

      2 De in het eerste lid bedoelde bekostiging bestaat uit een bij ministeriële regeling vast te stellen bedrag per
      leerling voor het aantal leerlingen op vestigingen van scholen in het samenwerkingsverband op 1 oktober van het
      jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt.

      3 Voor elke leerling die op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt,
      was ingeschreven op een school voor voortgezet speciaal onderwijs of speciaal en voortgezet onderwijs behorend
      tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref1], wordt een bedrag in mindering gebracht
      op de in het eerste lid bedoelde bekostiging van het samenwerkingsverband dat de leerling op grond van
      [artikel 40, twaalfde lid, van de Wet op de expertisecentra][ref2] toelaatbaar heeft verklaard tot het voortgezet
      speciaal onderwijs. Het in de eerste volzin bedoelde bedrag is afhankelijk van de in de toelaatbaarheidsverklaring
      opgenomen ondersteuningsbehoefte van de leerling en komt overeen met één van de normbedragen die bij ministeriële
      regeling worden vastgesteld.

      4 Het derde lid is van overeenkomstige toepassing op leerlingen opgenomen in residentiële instellingen aan wie op
      1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt onderwijs werd gegeven op basis
      van een samenwerkingsovereenkomst als bedoeld in [artikel 71c, tweede lid, van de Wet op de expertisecentra][ref3],
      met dien verstande dat het normbedrag, bedoeld in [artikel 117, zevende lid, van die wet][ref4] in mindering wordt
      gebracht op de bekostiging van:

      a. het samenwerkingsverband:

      1°. dat verantwoordelijk is voor de bekostiging tijdens de inschrijving op een school voor voortgezet
      speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref5], indien de leerling onmiddellijk voorafgaand aan de opname in de residentiële
      instelling was ingeschreven op een school voor voortgezet speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs, of

      2°. waartoe de vestiging van de school behoort waar de leerling was ingeschreven en bekostigd onmiddellijk
      voorafgaand aan de opname in de residentiële instelling, of

      b. het samenwerkingsverband in het gebied waarvan de leerling woonachtig is, indien de leerling onmiddellijk
      voorafgaand aan de opname in de residentiële instelling niet was ingeschreven op een school of school voor
      voortgezet speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in
      de [Wet op de expertisecentra][ref6].

      5 [Artikel 89][ref7] is van overeenkomstige toepassing op het samenwerkingsverband.


