        artikel: 76u
        hoofdstuk: I
        afdeling: IA
  - number: 76u
    text: |-
      1 Burgemeester en wethouders en het bevoegd gezag van een andere dan een gemeentelijke school dat eigenaar is van
      het gebouw en terrein kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag blijvend heeft opgehouden dan
      wel blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht vatbaar gedeelte daarvan, voor de
      school te gebruiken.

      1a Bij toepassing van het eerste lid stellen burgemeester en wethouders en het bevoegd gezag van de desbetreffende
      school gezamenlijk vast of voorzieningen in een slechte bouwkundige staat verkeren als gevolg van het verwijtbaar
      nalaten van noodzakelijk onderhoud. Indien dat het geval is, vindt verrekening plaats van de daarmee gemoeide
      kosten.

      1b De gemeenteraad en het bevoegd gezag van de andere dan gemeentelijke scholen treffen gezamenlijk een voorziening
      voor het beslechten van geschillen die zich bij de toepassing van lid 1a voordoen.

      2 Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het eerste lid desgevraagd
      besluiten dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of
      een voor eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. De aanvraag om het besluit
      wordt gedaan door burgemeester en wethouders of door het bevoegd gezag van de school.

      3 Het bevoegd gezag van een andere dan een gemeentelijke school dat voornemens is gebouwen of terreinen, of
      een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, doet hiervan onverwijld mededeling aan
      burgemeester en wethouders.

      4 Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, of het in het tweede lid bedoelde
      besluit van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van
      de rechter, inhoudende een besluit als bedoeld in het tweede lid eerste volzin, in de plaats treedt van het
      vernietigde besluit, wordt de akte, het onherroepelijk geworden besluit onderscheidenlijk de uitspraak, tenzij
      deze een gebouw betreft als bedoeld in [artikel 28 van de Overgangswet W.V.O.][ref1] en waarvoor door het bevoegd
      gezag van rijkswege slechts een rentevergoeding is ontvangen, ingeschreven in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref2]. Door de inschrijving verkrijgt de gemeente
      de eigendom.

      5 Burgemeester en wethouders en het bevoegd gezag van een andere dan een gemeentelijke school dat eigenaar is van
      het schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het gebouw dat niet vatbaar is
      voor eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.

      6 Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het vijfde lid desgevraagd
      besluiten dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor
      het onderwijs nodig zal zijn. De aanvraag om het besluit wordt gedaan door burgemeester en wethouders of door het
      bevoegd gezag van de school. Alvorens op de aanvraag te besluiten, horen gedeputeerde staten de wederpartij.

      7 Zodra de in het vijfde lid bedoelde akte door beide partijen is getekend, of het in het zesde lid bedoelde
      besluit van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van
      de rechter, inhoudende een beslissing als bedoeld in het zesde lid eerste volzin, in de plaats treedt van het
      vernietigde besluit, kan het bevoegd gezag van een andere dan een gemeentelijke school het desbetreffende gedeelte
      van het gebouw met toestemming van burgemeester en wethouders verhuren.

      8 De toestemming, bedoeld in het zevende lid, wordt verleend voor een tijdvak van ten hoogste 3 jaren. Op verzoek
      van het bevoegd gezag kan dit tijdvak telkens worden verlengd met een termijn van ten hoogste 3 jaren.

      9 Op de verhuur, bedoeld in het zevende lid, is [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref3] niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel76u
