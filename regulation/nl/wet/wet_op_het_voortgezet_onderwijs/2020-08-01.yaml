  - number: '60'
    text: |-
      1 Jaarlijks geeft het College voor toetsen en examens gelegenheid om door het met gunstig gevolg afleggen van
      een staatsexamen, een diploma te verkrijgen, overeenkomende met een diploma van een school voor voorbereidend
      wetenschappelijk onderwijs, voor hoger algemeen voortgezet onderwijs , voor middelbaar algemeen voortgezet
      onderwijs en voor voorbereidend beroepsonderwijs, als bedoeld in [artikel 29, derde lid][ref1].

      2 Bij algemene maatregel van bestuur wordt bepaald, welke andere diploma's kunnen worden verkregen door het met
      gunstig gevolg afleggen van een staatsexamen voor het College voor toetsen en examens.

      3 Zij, die zijn afgewezen bij het eindexamen van een school of een school als bedoeld in
      [artikel 1 van de Wet op de expertisecentra][ref2], worden niet toegelaten tot het in hetzelfde jaar te houden
      overeenkomstige staatsexamen.

      4 De staatsexamens zijn openbaar, behoudens het schriftelijke gedeelte.

      5 Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in dit artikel bedoelde examens,
      die niet voor alle kandidaten dezelfde vakken en andere programma-onderdelen behoeven te omvatten. Daarbij kan
      worden bepaald het bedrag, dat voor de toelating tot deze examens verschuldigd is. Tevens kan daarbij worden
      bepaald dat dit bedrag is verschuldigd door het bevoegd gezag van een school ten aanzien waarvan toepassing is
      gegeven aan [artikel 29, lid 1a][ref3], of door het bevoegd gezag van een instelling ten aanzien waarvan toepassing
      is gegeven aan [artikel 6a.2.1 van de Wet educatie en beroepsonderwijs][ref4].

      6 Tegen een besluit inzake deelneming aan staatsexamens staat bezwaar open bij het College voor toetsen en examens.

      7 In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref5] bedraagt de termijn voor het indienen van
      een bezwaarschrift vijf dagen.

      8 In afwijking van [artikel 7:10, eerste, derde, vierde en vijfde lid, van de Algemene wet bestuursrecht][ref6]
      beslist het College voor toetsen en examens binnen twee weken na ontvangst van het bezwaarschrift. Het kan de
      beslissing voor ten hoogste twee weken verdagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
