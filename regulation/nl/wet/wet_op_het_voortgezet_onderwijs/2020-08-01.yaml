  - number: 76r
    text: |-
      1 Burgemeester en wethouders zijn bevoegd een gedeelte van een gebouw of terrein dat tijdelijk of gedurende een
      gedeelte van de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd als huisvesting voor
      een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde voortgezet onderwijs, of voor
      educatie als bedoeld in de [Wet educatie en beroepsonderwijs][ref1] dan wel voor andere culturele, maatschappelijke
      of recreatieve doeleinden te bestemmen. Het voorgenomen gebruik dient zich te verdragen met het onderwijs aan de
      in het gebouw gevestigde school. Tevens zijn burgemeester en wethouders bevoegd ten behoeve van het onderwijs in
      lichamelijke opvoeding of expressie-activiteiten een gebouw of terrein dan wel een gedeelte daarvan dat tijdelijk
      gedurende gedeelten van de dag of in het geheel niet nodig zal zijn voor de daar gevestigde school, gedurende
      die tijd als huisvesting voor een andere school, voor ander uit de openbare kas bekostigd onderwijs, niet zijnde
      voortgezet onderwijs, of voor educatie als bedoeld in de [Wet educatie en beroepsonderwijs][ref2] dan wel voor
      andere culturele, maatschappelijke of recreatieve doeleinden te bestemmen. Burgemeester en wethouders zijn bevoegd
      een sportterrein, buiten de tijden dat het terrein voor het voortgezet onderwijs wordt gebruikt, gedurende die tijd
      te bestemmen voor culturele, maatschappelijke of recreatieve doeleinden, op zodanige wijze dat het zich verdraagt
      met het onderwijs dat op het terrein wordt gegeven.

      2 Indien het gebouw of terrein in gebruik is voor een andere dan een gemeentelijke school, plegen burgemeester en
      wethouders vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met het bevoegd gezag van de
      andere school of nevenvestiging waarvoor de huisvesting is bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel76r
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0007625
  - number: 76s
    text: |-
      1 Voor zover [artikel 76r][ref1] geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw
      of terrein in gebruik geven ten behoeve van uit de openbare kas bekostigd onderwijs dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden. Voor zover niet nodig voor uit de openbare kas
      bekostigd onderwijs, kan het bevoegd gezag een gedeelte van het gebouw of terrein verhuren aan een derde,
      voor zover het gehuurde niet bestemd zal zijn als woon- of bedrijfsruimte in de zin van de [vijfde][ref2]
      en [zesde afdeling van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref3]. Indien het een andere dan een
      gemeentelijke school betreft, is voor verhuur toestemming van burgemeester en wethouders vereist.

      2 De ingebruikgeving of verhuur ingevolge het eerste lid eindigt:

      a. indien burgemeester en wethouders gebruik maken van hun bevoegdheid op grond van artikel 76r zonder dat enige
      schadeplicht ontstaat, of

      b. indien het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.

      3 Ingebruikgeving of verhuur ingevolge het eerste lid geschiedt niet indien het voorgenomen gebruik zich niet
      verdraagt met het onderwijs aan de in het gebouw gevestigde school.

      4 Op de ingebruikgeving en verhuur ingevolge het eerste lid is
      [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref4] niet van toepassing.

      5 Het zonder toestemming van burgemeester en wethouders verhuren van een gebouw of terrein door het bevoegd
      gezag van een andere dan een gemeentelijke school alsmede elk met dit artikel strijdig beding opgenomen in een
      huurovereenkomst met betrekking tot schoolgebouwen, is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76r
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Afdeling5
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Afdeling6
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel76s
