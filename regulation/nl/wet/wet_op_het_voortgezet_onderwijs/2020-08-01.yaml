        afdeling: I
  - number: 73b
    text: |-
      1 Een nevenvestiging komt tot stand door een samenvoeging als bedoeld in [artikel 72][ref1] of door vorming van een
      nieuwe nevenvestiging van een school als bedoeld in [artikel 74b, eerste lid, onderdeel b of c][ref2].

      2 Op een nevenvestiging van een school voor vwo of havo kan in elk geval onderwijs worden verzorgd in de eerste 3
      leerjaren van de desbetreffende schoolsoort.

      3 Op een nevenvestiging van een school voor mavo of vbo kan in elk geval onderwijs worden verzorgd in de eerste 2
      leerjaren van de desbetreffende schoolsoort.

      4 Op een nevenvestiging van een scholengemeenschap kan in elk geval onderwijs worden verzorgd in de in het tweede
      of derde lid genoemde leerjaren van de schoolsoorten die de scholengemeenschap omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel74b
