  - number: 17a1
    text: |-
      1 In afwijking van [artikel 10e, vierde lid][ref1], juncto [artikel 10g, derde lid][ref2],
      [artikel 17a, elfde lid][ref3] kan het samenwerkingsverband kiezen om voorschriften voor:

      a. de criteria en de procedure voor, of

      b. de duur van,

      het beoordelen of een leerling is aangewezen op het leerwegondersteunend onderwijs zelf vast te stellen.

      2 Het samenwerkingsverband kan er voor kiezen om in afwijking van [artikel 70][ref4], een school die is
      aangesloten bij dit samenwerkingsverband, voor te dragen aan Onze Minister, om die school voor bekostiging van
      leerwegondersteunend onderwijs in aanmerking te brengen.

      3 Het gebruik maken van de bevoegdheden, bedoeld in het eerste en het tweede lid, behoeft de instemming van de
      bevoegde gezagsorganen met vestigingen in het gebied van het desbetreffende samenwerkingsverband.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften vastgesteld omtrent de toepassing van
      de bevoegdheden, bedoeld in het eerste en het tweede lid.


