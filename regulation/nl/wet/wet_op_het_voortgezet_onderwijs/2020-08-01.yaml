  - number: '57'
    text: |-
      De aanwijzing geschiedt op een daartoe tot Onze Minister gerichte aanvraag van het schoolbestuur. Bij de aanvraag
      worden overgelegd:

      a. het schoolplan van de school;

      b. bewijsstukken dat wordt voldaan aan de bekwaamheidseisen;

      c. de statuten en het reglement van de rechtspersoon met volledige rechtsbevoegdheid, die de school in stand houdt.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel57
  - number: '58'
    text: |-
      1 Het schoolplan van een ingevolge [artikel 56][ref1] aangewezen school voldoet ten minste aan de voorschriften,
      gegeven bij of krachtens de [artikelen 6g][ref2], [6g1][ref3], [10][ref4], [10b][ref5], [10d][ref6],
      [11a tot en met 11f][ref7], [12 tot en met 15][ref8] en [24][ref9].

      2 Bij wijziging van het schoolplan doet het schoolbestuur daarvan onmiddellijk mededeling aan de inspectie.

      3 Onze Minister kan ten behoeve van de bijzondere inrichting van het onderwijs aan de school besluiten toe te
      staan, dat wordt afgeweken van het eerste lid. Onze Minister besluit binnen zes maanden na ontvangst van een
      aanvraag.

      4 De naam van de school duidt aan, met welke van de uit de openbare kas bekostigde scholen zij overeenkomt.

      5 De voorwaarden voor de toelating tot de school zijn ten minste gelijk aan die, vastgesteld krachtens
      [artikel 27, eerste lid, alsmede de leden 1a en 1b][ref10].

      6 [Artikel 23a1][ref11] is van overeenkomstige toepassing.

      7 Voor een school die is aangewezen op grond van [artikel 56][ref12] zijn van overeenkomstige toepassing:

      a. [artikel 103b, eerste, vijfde tot en met zevende en tiende tot en met twaalfde lid][ref13];

      b. [artikel 103f][ref14];

      c. de [artikelen 27b][ref15], [28][ref16] en [28a][ref17]; en

      d. de [artikelen 118g tot en met 118i][ref18].


