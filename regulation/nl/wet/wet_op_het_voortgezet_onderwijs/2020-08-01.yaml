  - number: 85c1
    text: |-
      Indien het totaal van de bedragen, bedoeld in [artikel 85b1, zesde en zevende lid][ref1], de personeelsbekostiging
      van het samenwerkingsverband, bedoeld in artikel 85b1, eerste lid, overschrijdt, wordt het bedrag waarmee die
      bekostiging wordt overschreden door Onze Minister in mindering gebracht op de personele bekostiging van alle
      scholen en scholen voor voortgezet speciaal onderwijs en speciaal en voortgezet speciaal onderwijs behorend tot
      cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref2], waarvan één of meer vestigingen zijn gelegen in
      het gebied van het samenwerkingsverband. Het bedrag dat in mindering wordt gebracht wordt bepaald per school dan
      wel school voor voortgezet speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3
      of 4, bedoeld in de Wet op het expertisecentra, voor zover het betreft het daaraan verzorgde voortgezet speciaal
      onderwijs, op basis van het leerlingenaantal op 1 oktober voorafgaand aan het jaar waarover de bekostiging
      plaatsvindt, van de desbetreffende vestiging of vestigingen in het gebied van het samenwerkingsverband.


