  - number: 74c
    text: |-
      Onze Minister wijst een aanvraag als bedoeld in [artikel 74b][ref1] af indien een bevoegd gezag dat niet deelneemt
      aan de samenwerking aantoont dat de onderwijsvoorziening leidt tot meer dan 10 procent leerlingverlies bij een
      vestiging van een school of scholengemeenschap van dat bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel74b
