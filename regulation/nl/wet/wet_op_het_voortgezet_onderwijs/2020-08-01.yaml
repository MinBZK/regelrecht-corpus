      Voor scholen die leerwegondersteunend onderwijs aanbieden, is [artikel 84, vierde lid][ref1], van overeenkomstige
      toepassing voor de bekostiging van leerlingen voor wie de regionale verwijzingscommissie heeft bepaald dat zij
      op dat onderwijs is aangewezen op grond van [artikel 10e][ref2] van deze wet zoals dat luidde de dag voor de
      inwerkingtreding van artikel I, onderdeel A, van de Wet tot wijziging van de Wet op het voortgezet onderwijs in
      verband met de integratie van het leerwegondersteunend onderwijs en praktijkonderwijs in het systeem van passend
      onderwijs (Integratie lwoo en pro in passend onderwijs) (Stb. XXX, XXX).


