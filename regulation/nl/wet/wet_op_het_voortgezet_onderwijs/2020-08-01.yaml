  - number: 10d
    text: |-
      1 Naast het onderwijs in de leerwegen, genoemd in de [artikelen 10][ref1] en [10b][ref2], kan onderwijs in de
      gemengde leerweg worden gegeven aan:

      a. een scholengemeenschap met in elk geval een school voor middelbaar algemeen voortgezet onderwijs en een school
      voor voorbereidend beroepsonderwijs, of

      b. een vestiging van een agrarisch opleidingscentrum wat het daarin verzorgde voorbereidend beroepsonderwijs
      betreft, indien:

      1°. het agrarisch opleidingscentrum onderdeel uitmaakt van een verticale scholengemeenschap waarvan tevens een
      school voor middelbaar algemeen voortgezet onderwijs onderdeel uitmaakt, en

      2°. het voorbereidend beroepsonderwijs op de desbetreffende vestiging deels leerlingen betrekt uit hetzelfde gebied
      als de desbetreffende school voor middelbaar algemeen voortgezet onderwijs.

      2 Het onderwijs in de gemengde leerweg is met ingang van het derde leerjaar ingericht volgens profielen. Een
      profiel is een in schooltijd verzorgd samenhangend onderwijsprogramma, zodanig ingericht dat het biedt:

      a. een algemene maatschappelijke voorbereiding en persoonlijke vorming, en

      b. een voorbereiding op naar inhoud verwante opleidingen in het aansluitend beroepsonderwijs.

      3 De school verzorgt één of meer profielen. De profielen zijn:

      a. bouwen, wonen en interieur,

      b. produceren, installeren en energie,

      c. mobiliteit en transport,

      d. media, vormgeving en ICT,

      e. maritiem en techniek,

      f. zorg en welzijn,

      g. economie en ondernemen,

      h. horeca, bakkerij en recreatie,

      i. groen,

      j. dienstverlening en producten.

      4 Elk profiel bestaat uit:

      a. een gemeenschappelijk deel, dat voor alle profielen gelijk is,

      b. een profieldeel, dat kenmerkend is voor dat profiel, en

      c. een vrij deel, dat bestaat uit door de leerling te kiezen vakken en andere programma-onderdelen.

      5 Het gemeenschappelijk deel van elk profiel in de gemengde leerweg omvat Nederlandse taal, Engelse taal,
      maatschappijleer, lichamelijke opvoeding en ten minste één van de vakken behorende tot de beeldende vorming,
      muziek, dans of drama.

      6 Het profieldeel van de gemengde leerweg omvat het bij het betreffende profiel behorende profielvak en, wat
      betreft:

      a. de profielen, genoemd in het derde lid, onderdelen a tot en met e: wiskunde en natuur- en scheikunde I,

      b. het profiel, genoemd in het derde lid, onderdeel f: biologie en, ter keuze van de leerling, wiskunde,
      maatschappijkunde, geschiedenis en staatsinrichting, of aardrijkskunde, met dien verstande dat het bevoegd gezag
      beslist welke van de laatste drie vakken wordt of worden aangeboden,

      c. de profielen, genoemd in het derde lid, onderdelen g en h: economie en, ter keuze van de leerling, wiskunde,
      Franse taal of Duitse taal,

      d. het profiel genoemd in het derde lid, onderdeel i: wiskunde en, ter keuze van de leerling, biologie of natuur-
      en scheikunde I,

      e. het profiel genoemd in het derde lid, onderdeel j: ter keuze van de leerling twee van de vakken wiskunde,
      economie, biologie en natuur- en scheikunde I.

      7 Het vrije deel van elk profiel in de gemengde leerweg:

      a. omvat door de leerling te kiezen vakken, genoemd in het zesde lid,

      b. omvat door de leerling te kiezen beroepsgerichte keuzevakken,

      c. kan omvatten natuur- en scheikunde II, Spaanse taal, Turkse taal, Arabische taal, vakken behorende tot de
      beeldende vorming, muziek, dans, drama, Friese taal en cultuur, lichamelijke opvoeding 2 en informatietechnologie,
      door de leerling te kiezen, en

      d. kan omvatten door het bevoegd gezag vast te stellen vakken en programma-onderdelen.

      8 Het bevoegd gezag beslist welke keuzetaal, genoemd in het zesde lid, onderdeel c, welke beroepsgerichte
      keuzevakken, bedoeld in het zevende lid, onderdeel b, en welke vakken, genoemd in het zevende lid, onderdeel c,
      worden aangeboden. Het bevoegd gezag kan tevens beslissen dat door het bevoegd gezag aan te wijzen vakken en andere
      programma-onderdelen, bedoeld in het zevende lid, onderdeel d, door alle leerlingen in het vrije deel moeten worden
      gevolgd.

      9 Het bevoegd gezag kan de leerling in de gelegenheid stellen, in plaats van de vakken, genoemd in het vijfde,
      zesde en zevende lid, onderdeel c, de overeenkomstige vakken, genoemd in dan wel aangewezen op grond van de
      [artikelen 13][ref3] en [14][ref4] te volgen.

      10 Bij of krachtens algemene maatregel van bestuur worden vastgesteld:

      a. de profielvakken, bedoeld in het zesde lid,

      b. voorschriften met betrekking tot de beroepsgerichte keuzevakken, bedoeld in het zevende lid, onderdeel b, en

      c. voorschriften over de mogelijkheid van vrijstelling en de bevoegdheid van het bevoegd gezag om ontheffing te
      verlenen van onderdelen van dit artikel.

      11 Onverminderd het zesde en zevende lid, kan bij algemene maatregel van bestuur worden vastgesteld het door alle
      leerlingen in het derde leerjaar te volgen minimum aantal vakken waarin eindexamen kan worden afgelegd, alsmede
      welke vakken het betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
