  - number: 96r
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven voor de verlening van voorschotten op
      de bekostiging en voor de verrekening van de betaalde voorschotten met het bedrag van de vastgestelde bekostiging
      of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel96r
  - number: 96r1
    text: |-
      Onze Minister is bevoegd tot verrekening van vorderingen krachtens deze wet van of op het bevoegd gezag van een
      school met vorderingen van of op Onze Minister krachtens een andere wet.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel96r1
  - number: 96s
    text: |-
      Indien een leerling in de loop van het schooljaar de school verlaat zonder de opleiding te hebben voltooid, en
      aansluitend wordt ingeschreven als leerling aan een andere school voor voortgezet onderwijs of als mbo-student
      of vavo-student aan een instelling voor educatie en beroepsonderwijs, kan het bevoegd gezag van de school met het
      bevoegd gezag van die andere school of die instelling overeenkomen een deel van de bekostiging over te dragen aan
      dat andere bevoegd gezag vanwege deze tussentijdse overstap.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel96s
  - number: 96t
    text: |-
      In afwijking van [artikel 99][ref1] kan het bevoegd gezag van de school met het bevoegd gezag van de
      instelling voor beroepsonderwijs waarmee het een samenwerkingsovereenkomst heeft gesloten als bedoeld in
      [artikel 10b11, tweede lid][ref2], overeenkomen om vanwege een doorlopende leerroute vmbo-mbo als bedoeld
      in [artikel 10b10, tweede lid][ref3], of de geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in
      [artikel 10b21, tweede lid][ref4], een deel van de bekostiging over te dragen aan dat andere bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b11
