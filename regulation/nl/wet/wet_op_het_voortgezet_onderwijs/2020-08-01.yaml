  - number: 24a
    text: |-
      1 De schoolgids bevat voor ouders, voogden, verzorgers en leerlingen informatie over de werkwijze van de school en
      bevat in elk geval informatie over:

      a. de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, waaronder, in ieder
      geval met betrekking tot het schooljaar voorafgaande aan het schooljaar waarin de schoolgids wordt vastgesteld en
      onderscheiden naar soort onderwijs, voor elk leerjaar

      1°. het percentage leerlingen dat doorstroomt naar een hoger leerjaar of een ander soort onderwijs,

      2°. het percentage leerlingen dat de school zonder diploma verlaat en het percentage leerlingen dat voor het
      eindexamen slaagt,

      b. de wijze waarop aan de ondersteuning van leerlingen die extra ondersteuning behoeven wordt vormgegeven,

      c. 1°. het totaal aantal uren en het soort activiteiten dat als onderwijstijd als bedoeld in
      [artikel 6g, eerste tot en met vijfde lid][ref1], wordt geprogrammeerd, de vakanties en andere dagen waarop geen
      onderwijs wordt verzorgd, alsmede wat het beleid is ten aanzien van lesuitval,

      2°. de inrichting van het onderwijsprogramma voor de eerste twee leerjaren waarbij wordt aangegeven of sprake is
      van vakoverstijgende programmaonderdelen en de inzet van het personeel daarbij,

      3°. de invulling van de maatschappelijke stage, bedoeld in [artikel 6f][ref2],

      d. de geldelijke bijdrage, bedoeld in [artikel 27, tweede lid][ref3], waarbij wordt vermeld dat deze vrijwillig is,

      e. de rechten en plichten van de ouders, de voogden, de verzorgers, de leerlingen en het bevoegd gezag, waaronder
      de informatie over de klachtenregeling, bedoeld in [artikel 24b][ref4], waarbij wat betreft de leerlingen
      kan worden volstaan met vermelding van de rechten en plichten opgenomen in het leerlingenstatuut, bedoeld in
      [artikel 24g][ref5],

      f. de wijze waarop het bevoegd gezag omgaat met de in [artikel 24, eerste lid][ref6], omschreven bijdragen,

      g. het beleid met betrekking tot de veiligheid,

      h. het verzuimbeleid,

      i. de wijze waarop de identiteitscommissie, bedoeld in [artikel 53d][ref7], invulling geeft aan het openbare
      karakter onderscheidenlijk de identiteit voor zover het betreft een samenwerkingsschool,

      ia. het leerlingenparticipatiebeleid, waaronder wordt begrepen de wijze waarop leerlingen worden betrokken
      bij de vorming van het beleid van de school, alsmede de wijze waarop deze betrokkenheid wordt gefaciliteerd en
      gestimuleerd,

      j. het samenwerkingsverband en in voorkomend geval de samenwerkingsverbanden waarbij het bevoegd gezag van de
      school is aangesloten,

      k. de persoon bij wie de taken, bedoeld in [artikel 3b, eerste lid, onderdeel c][ref8], zijn belegd, en

      l. de in het kader van het stelsel van kwaliteitszorg, bedoeld in [artikel 24, vierde lid][ref9], gedane
      bevindingen en de maatregelen die naar aanleiding daarvan zijn getroffen.

      2 Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven met betrekking tot de wijze waarop

      a. de resultaten worden beschreven die met het onderwijs worden bereikt, en

      b. de context wordt vermeld waarin de onder a bedoelde resultaten dienen te worden geplaatst.

      3 Het bevoegd gezag reikt de schoolgids uit aan de ouders, voogden, verzorgers dan wel de meerderjarige en
      handelingsbekwame leerling bij de inschrijving en jaarlijks na de vaststelling van de schoolgids.


