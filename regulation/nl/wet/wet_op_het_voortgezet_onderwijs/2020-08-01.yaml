  - number: '66'
    text: |-
      1 Gedeputeerde staten dragen er zorg voor dat is voorzien in de behoefte aan openbaar onderwijs door een voldoende
      aantal scholen in de provincie. Zij kunnen het college van burgemeester en wethouders van de gemeente opdragen, een
      aanvraag bij Onze Minister in te dienen om een openbare school of scholengemeenschap voor bekostiging in aanmerking
      te brengen indien de ouders, voogden of verzorgers van een naar hun oordeel voldoende groot aantal leerlingen
      hebben aangegeven dat zij dat wensen en het college van burgemeester en wethouders van de gemeente deze wens niet
      heeft ingewilligd.

      2 Onze Minister kan het college van burgemeester en wethouders van de gemeente opdragen een aanvraag bij hem in te
      dienen om een openbare school of scholengemeenschap voor bekostiging in aanmerking te brengen, indien gedeputeerde
      staten het eerste lid niet toepassen en de ouders, voogden of verzorgers van een naar zijn oordeel voldoende groot
      aantal leerlingen hebben aangegeven dat zij indiening van een dergelijke aanvraag wensen.

      3 Indien een besluit van Onze Minister op een aanvraag als bedoeld in dit artikel onherroepelijk is geworden,
      gaat het college van burgemeester en wethouders van de gemeente over tot stichting van de bij het besluit voor
      bekostiging in aanmerking gebrachte school of scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel66
  - number: '67'
    text: |-
      1 Het bevoegd gezag dient een aanvraag om een school voor bekostiging in aanmerking te brengen voor 1 november in
      bij Onze Minister.

      2 De aanvraag vermeldt de schoolsoort en het vestigingsadres van de school. Indien de aanvraag betrekking heeft op
      een school voor bijzonder onderwijs, wordt in de aanvraag ook vermeld van welke verlangde richting het onderwijs
      zal uitgaan.

      3 De aanvraag gaat vergezeld van een prognose over de te verwachten omvang. Het aantal leerlingen dat naar
      verwachting op het vestigingsadres een openbare school of een bijzondere school van de verlangde richting zal
      bezoeken, wordt voor elke schoolsoort berekend op basis van statistische gegevens die onder meer door het Centraal
      Bureau voor de Statistiek worden verstrekt.

      4 Een aanvraag voor een school voor praktijkonderwijs wordt ingediend in overeenstemming met de bevoegde
      gezagsorganen in het samenwerkingsverband waarvan de school deel gaat uitmaken en na overleg met de gemeente.

      5 Onze Minister besluit voor 1 mei volgend op de aanvraag of de school voor bekostiging in aanmerking wordt
      gebracht.

      6 Onverminderd [artikel 3:41 van de Algemene wet bestuursrecht][ref1] wordt een besluit tot bekostiging van een
      nieuwe school gepubliceerd in de Staatscourant.

      7 Dit artikel is van overeenkomstige toepassing op een aanvraag om een scholengemeenschap of een profiel als
      bedoeld in [artikel 10b, derde lid][ref2], dan wel een school of scholengemeenschap die ontstaat na splitsing van
      een school of scholengemeenschap dan wel een afdeling voor havo voor bekostiging in aanmerking te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel341
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
