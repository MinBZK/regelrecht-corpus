    text: |-
      1 Het openbaar onderwijs draagt bij aan de ontwikkeling van de leerlingen met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving, en met onderkenning
      van de betekenis van de verscheidenheid van die waarden.

      2 Openbare scholen zijn toegankelijk voor leerlingen zonder onderscheid naar godsdienst of levensbeschouwing.

      3 Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel42
  - number: 42a
    text: |-
      1 Een gemeenteraad kan bij verordening een openbare rechtspersoon instellen die tot doel heeft een of meer
      openbare scholen in de gemeente in stand te houden, al dan niet te zamen met openbare scholen als bedoeld in de
      [Wet op het primair onderwijs][ref1] of openbare scholen als bedoeld in de [Wet op de expertisecentra][ref2]. Een
      openbare rechtspersoon kan ook worden ingesteld door meer dan een gemeente ten behoeve van het in stand houden
      van openbare scholen in die gemeenten door het vaststellen van een voor wat betreft de onderwerpen, bedoeld in
      het vierde lid, gelijkluidende verordening, in welk geval de openbare rechtspersoon niet eerder tot stand komt dan
      nadat alle daartoe strekkende verordeningen in werking zijn getreden.

      2 De gemeenteraad of gemeenteraden maken het voornemen tot een besluit als bedoeld in het eerste lid bekend.

      3 De openbare rechtspersoon oefent met uitzondering van de besluitvorming over de opheffing van een openbare school
      alle taken en bevoegdheden uit van het bevoegd gezag. Hij bezit rechtspersoonlijkheid.

      4 De verordening, bedoeld in het eerste lid, voorziet in ieder geval in een regeling omtrent:

      a. de samenstelling, werkwijze en inrichting van het bestuur van de openbare rechtspersoon,

      b. de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de
      leden van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte,
      doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,

      c. de termijn waarvoor de bestuursleden worden benoemd,

      d. de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,

      e. de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,

      f. de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden, en

      g. de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode
      ten minste 5 jaren bedraagt, met dien verstande dat in de regeling een overheersende invloed van de overheid in het
      bestuur is verzekerd.

      De goedkeuring bedoeld in onderdeel d kan worden onthouden wegens strijd met het recht of met het algemeen belang,
      waaronder begrepen het financiële belang van de gemeente.

      5 Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.

      6 De vergaderingen van het bestuur van de openbare rechtspersoon zijn openbaar, tenzij het bestuur anders beslist,
      op gronden, vermeld in de verordening.

      7 Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.

      8 De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren
      in strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de openbare rechtspersoon
      te ontbinden.

      9 Indien de school een raad van toezicht heeft, is het vierde lid niet van toepassing en voorziet de verordening,
      bedoeld in het eerste lid, onverminderd [artikel 24e1][ref3] in ieder geval in een regeling omtrent:

      a. de samenstelling, werkwijze en inrichting van de raad van toezicht van de openbare rechtspersoon,

      b. de wijze van benoeming, herbenoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien
      verstande dat de leden van de raad van toezicht worden benoemd door de gemeenteraad of gemeenteraden en dat ten
      minste een derde gedeelte, doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders
      van de leerlingen die zijn ingeschreven op de betrokken school of scholen,

      c. de termijn waarvoor de leden van de raad van toezicht worden benoemd,

      d. de vaststelling van de begroting en de jaarrekening, en

      e. de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode
      ten minste 5 jaren bedraagt, met dien verstande dat in de regeling een overheersende invloed van de overheid in de
      raad van toezicht is verzekerd. Het vijfde, zesde en achtste lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel24e1
