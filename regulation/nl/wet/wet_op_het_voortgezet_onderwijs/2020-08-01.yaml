  - number: 10b11
    text: |-
      1 Een doorlopende leerroute vmbo-mbo wordt op grond van een samenwerkingsovereenkomst gezamenlijk verzorgd door het
      bevoegd gezag van een school en het bevoegd gezag van een instelling voor beroepsonderwijs.

      2 In de samenwerkingsovereenkomst zijn in elk geval afspraken opgenomen over:

      a. het profiel en het aanverwante opleidingsdomein of de aanverwante kwalificatie waarin de doorlopende leerroute
      vmbo-mbo wordt aangeboden;

      b. de vormgeving van de leiding over de doorlopende leerroute vmbo-mbo, waaronder de samenstelling en de wijze
      van benoeming van die leiding en de taken en bevoegdheden die door de bevoegde gezagsorganen van de school en de
      instelling voor beroepsonderwijs zijn opgedragen aan die leiding;

      c. de wijze waarop de leiding over de doorlopende leerroute vmbo-mbo inlichtingen verstrekt en verantwoording
      aflegt aan de bevoegde gezagsorganen van de school en de instelling voor beroepsonderwijs;

      d. de organisatorische en onderwijskundige inrichting van de doorlopende leerroute, waaronder de inzet van
      personeel en het gebruik van faciliteiten van de aan de overeenkomst deelnemende partijen;

      e. in geval van overdracht van een deel van de door de school of instelling voor
      beroepsonderwijs ontvangen bekostiging met toepassing van [artikel 96t][ref1] respectievelijk
      [artikel 8.5a.16 van de Wet educatie en beroepsonderwijs][ref2], de omvang en de bestemming van de over te dragen
      middelen;

      f. de inhoud van de overstapoptie, bedoeld in [artikel 10b20][ref3] en
      [artikel 8.5a.15 van de Wet educatie en beroepsonderwijs][ref4];

      g. de wijze waarop het bedrijfsleven zal worden betrokken bij de invulling van de doorlopende leerroute vmbo-mbo;

      h. de wijze van geschilbeslechting tussen de deelnemende partijen over de uitvoering van de overeenkomst;

      i. de voorwaarden waaronder een andere school of een andere instelling voor beroepsonderwijs partij kan worden bij
      de overeenkomst, de voorwaarden waaronder de overeenkomst kan worden opgezegd of ontbonden, alsmede de wijze waarop
      de overeenkomst in andere gevallen kan worden gewijzigd, telkens met het oog op het zoveel mogelijk beperken van de
      gevolgen voor de leerlingen en mbo-studenten; en

      j. de inrichting van de medezeggenschap door de medezeggenschapsorganen van de school onderscheidenlijk de
      instelling voor beroepsonderwijs.

      3 Het tweede lid is niet van toepassing indien de doorlopende leerroute vmbo-mbo volledig wordt verzorgd binnen
      een verticale scholengemeenschap of een agrarisch opleidingscentrum. In plaats daarvan regelt het bevoegd gezag
      van de verticale scholengemeenschap of van het agrarisch opleidingscentrum op overeenkomstige wijze de onderwerpen,
      genoemd in het tweede lid, met uitzondering van de onderdelen h tot en met j van dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96t
