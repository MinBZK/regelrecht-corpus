    text: |-
      1 Het registervoorportaal bevat voor elke daarin opgenomen leraar de basisgegevens die op grond van
      [artikel 41q][ref1] worden geleverd, waaronder in ieder geval het gegeven betreffende het onderwijs waarvoor hij is
      benoemd of tewerkgesteld zonder benoeming.

      2 Bij of krachtens algemene maatregel van bestuur kunnen de gegevens, bedoeld in het eerste lid, nader worden
      gespecificeerd.


