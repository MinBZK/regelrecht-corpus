    text: |-
      Burgemeester en wethouders stellen geen programma als bedoeld in [artikel 76f][ref1] en geen overzicht als bedoeld
      in [artikel 76g][ref2] vast, indien geen voorziening in de huisvesting nodig is noch een aanvraag is ingediend voor
      scholen als bedoeld in [artikel 76d, eerste lid, onderdelen a tot en met e][ref3].


