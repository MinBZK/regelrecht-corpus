  - number: 10b12
    text: |-
      1 Het bevoegd gezag van een school en het bevoegd gezag van een instelling voor beroepsonderwijs melden gezamenlijk
      aan Onze Minister dat zij een doorlopende leerroute vmbo-mbo aanbieden.

      2 Het eerste lid is van overeenkomstige toepassing op een agrarisch opleidingscentrum dat een doorlopende leerroute
      vmbo-mbo aanbiedt.
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel10b12
  - number: 10b13
    text: |-
      1 Een doorlopende leerroute vmbo-mbo wordt aangeboden op de locatie van de school of van de instelling voor
      beroepsonderwijs die de doorlopende leerroute vmbo-mbo verzorgt.

      2 Het bevoegd gezag van de school en het bevoegd gezag van de instelling voor beroepsonderwijs beschrijven voor de
      gehele doorlopende leerroute vmbo-mbo het onderwijsprogramma en de examinering per leerjaar. Daarbij wordt vermeld
      welke delen van het onderwijsprogramma en van het examen:

      a. voortgezet onderwijs betreffen, en welk deel daarbinnen vakoverstijgend is;

      b. beroepsonderwijs betreffen;

      c. een combinatie van voortgezet onderwijs en beroepsonderwijs betreffen, en welk deel daarbinnen voortgezet
      onderwijs onderscheidenlijk beroepsonderwijs betreft.

      3 Bij de beschrijving van het onderwijsprogramma wordt tevens vermeld bij welk deel daarvan gebruik wordt gemaakt
      van een team als bedoeld in [artikel 33, lid 5a][ref1].

      4 De leerling in een doorlopende leerroute vmbo-mbo kan in de gelegenheid gesteld worden om delen van het
      onderwijsprogramma te volgen en examens af te leggen die behoren tot de van die doorlopende leerroute deel
      uitmakende beroepsopleiding.

      5 De school kan aan een voormalige leerling, nadat die ingevolge [artikel 10b14, tweede lid][ref2], als mbo-student
      is ingeschreven aan een instelling voor beroepsonderwijs, delen van het onderwijsprogramma van een doorlopende
      leerroute vmbo-mbo aanbieden, die behoren tot het van die doorlopende leerroute deel uitmakende middelbaar algemeen
      voortgezet onderwijs of voorbereidend beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b14
