  - number: 59a
    text: |-
      1 De [artikelen 56][ref1], [57, aanhef en onderdelen a en b][ref2], [58, eerste tot en met zesde lid][ref3],
      en [59][ref4] zijn van overeenkomstige toepassing op scholen als bedoeld in
      [artikel 1 van de Wet op de expertisecentra][ref5] waar voortgezet speciaal onderwijs wordt verzorgd. Ten aanzien
      van scholen waar toepassing is gegegeven aan de eerste volzin, zijn de voorschriften gegeven bij of krachtens de
      [artikelen 6f][ref6] en [22][ref7] van overeenkomstige toepassing.

      2 Ten aanzien van scholen waar toepassing is gegeven aan het eerste lid, zijn de
      [artikelen 10b1 tot en met 10b8][ref8], [10b9, eerste en tweede lid][ref9], en [10b10 tot en met 10b21][ref10] van
      overeenkomstige toepassing voor zover het betreft het voorbereidend beroepsonderwijs.

      3 Onze Minister kan, onverminderd [artikel 59][ref11], de aanwijzing ingevolge het eerste lid intrekken indien niet
      langer wordt voldaan aan het eerste lid, tweede volzin, of het tweede lid.

      4 Ten aanzien van een op grond van het eerste lid aangewezen school kunnen bij algemene maatregel van bestuur
      onderscheidenlijk bij ministeriële regeling regels worden vastgesteld in afwijking van bij algemene maatregel van
      bestuur respectievelijk bij ministeriële regeling vastgestelde regels die gelden ingevolge het eerste en tweede
      lid, met dien verstande dat bij algemene maatregel van bestuur tevens kerndoelen kunnen worden vastgesteld in
      aanvulling op de kerndoelen die zijn vastgesteld op grond van [artikel 11b][ref12] van de Wet op het voortgezet
      onderwijs, waarbij tevens kan worden bepaald dat het onderwijs na de eerste twee leerjaren wordt verzorgd mede op
      basis van de kerndoelen die zijn vastgesteld op grond van dit lid.

      5 Ten aanzien van een op grond van het eerste lid aangewezen school kunnen provinciale staten van Fryslân bij
      verordening kerndoelen Friese taal en cultuur vaststellen in afwijking van de kerndoelen Friese taal en cultuur
      die zijn vastgesteld op grond van [artikel 11e][ref13], met dien verstande dat op die verordening artikel 11e van
      overeenkomstige toepassing is.

      6 Indien de aanvraag ingevolge het eerste lid, betrekking heeft op het voorbereidend beroepsonderwijs, geeft het
      bevoegd gezag aan in welke profielen, bedoeld in [artikel 10b, derde lid][ref14], het onderwijs wordt verzorgd.


