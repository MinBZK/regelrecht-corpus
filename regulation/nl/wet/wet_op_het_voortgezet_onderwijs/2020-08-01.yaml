  - number: 103h
    text: |-
      1 Indien naar het oordeel van Onze Minister het samenwerkingsverband zijn taak ernstig verwaarloost, kan tot een
      bij koninklijk besluit te bepalen datum Onze Minister de noodzakelijke voorzieningen treffen.

      2 De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat het
      samenwerkingsverband in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog zijn
      taak naar behoren uit te voeren.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing indien de bevoegde gezagsorganen, bedoeld in
      [artikel 17a, tweede lid][ref1], niet of niet tijdig voldoen aan de verplichtingen, bedoeld in genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
