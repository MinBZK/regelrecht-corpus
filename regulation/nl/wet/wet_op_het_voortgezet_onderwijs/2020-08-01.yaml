    text: |-
      1 Ten aanzien van leerlingen die extra ondersteuning behoeven, is het onderwijs gericht op individuele begeleiding
      die is afgestemd op de behoeften van de leerling. Zo nodig treedt het bevoegd gezag daarbij in overleg met:

      a. het college van burgemeester en wethouders van de gemeente waar de leerling zijn woonplaats heeft als bedoeld in
      [artikel 1.1. van de Jeugdwet][ref1],

      b. een instantie die jeugdgezondheidszorg uitvoert als bedoeld in [artikel 5 van de Wet publieke gezondheid][ref2],

      c. een instantie die maatschappelijke ondersteuning biedt als bedoeld in
      [artikel 1, eerste lid, onder g, 2°, van de Wet maatschappelijke ondersteuning][ref3],

      d. een zorgaanbieder als bedoeld in
      [artikel 1, eerste lid, onder j, van de Algemene Wet Bijzondere Ziektekosten][ref4] of

      e. een zorgaanbieder die geneeskundige geestelijke gezondheidszorg levert welke behoort tot de prestaties
      omschreven bij of krachtens de [Zorgverzekeringswet][ref5].

      2 Het bevoegd gezag stelt ten minste eenmaal in de 4 jaar een schoolondersteuningsprofiel vast.


