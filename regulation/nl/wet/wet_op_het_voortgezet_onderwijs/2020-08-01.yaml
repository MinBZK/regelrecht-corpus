  - number: 33a
    text: |-
      Onze Minister kan in aanvulling op [artikel 33, eerste lid][ref1], aan personen die in het bezit zijn van een
      buiten de Europese Economische Ruimte of Zwitserland behaald bewijsstuk, de bevoegdheid verlenen tot het geven van
      voortgezet onderwijs. Hij kan daarbij voorwaarden en beperkingen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel33a
