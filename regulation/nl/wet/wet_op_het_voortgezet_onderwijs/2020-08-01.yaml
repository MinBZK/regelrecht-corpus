  - number: 41m
    text: |-
      1 Gegevens van een leraar als bedoeld in [artikel 41f][ref1] worden verwijderd uit het lerarenregister:

      a. indien betrokkene Onze Minister hier om verzoekt;

      b. indien betrokkene de pensioengerechtigde leeftijd bereikt;

      c. indien betrokkene is overleden.

      2 In de gevallen, bedoeld in het eerste lid, onder b en c, worden alle in het lerarenregister geregistreerde
      gegevens van betrokkene verwijderd.

      3 Indien een of meerdere gegevens van een leraar op grond van het eerste lid worden verwijderd uit het
      lerarenregister, blijven deze gegevens tot vijf jaar na verwijdering bewaard.

      4 Indien op grond van [artikel 41g][ref2] gegevens worden verstrekt voor heropname van een leraar in
      het lerarenregister, worden door Onze Minister van deze leraar de bewaarde gegevens als bedoeld in
      [artikel 41f, eerste lid, onderdelen e tot en met h][ref3], opgenomen in het lerarenregister.

      5 Op verzoek van een leraar aan Onze Minister is het eerste lid, aanhef en onder b, op deze leraar niet van
      toepassing.

      6 Met pensioengerechtigde leeftijd wordt in dit artikel bedoeld de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a van de Algemene Ouderdomswet][ref4].


