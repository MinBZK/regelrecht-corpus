  - number: 53h
    text: |-
      1 Onze Minister kan goedkeuring onthouden indien als gevolg van de institutionele of bestuurlijke fusie:

      a. de daadwerkelijke variatie van het onderwijsaanbod, zowel in het opzicht van richting als van pedagogisch-
      didactische aanpak en schoolsoort binnen de gemeenten waarin de huidige leerlingen van die scholen of
      rechtspersonen woonachtig zijn, op significante wijze wordt belemmerd, of

      b. het aandeel per schoolsoort van de bij de fusie betrokken scholen in het aantal leerlingen in de gemeenten
      waarin de huidige leerlingen van die scholen woonachtig zijn een nader bij ministeriële regeling vast te stellen
      percentage overschrijdt.

      2 Onze Minister kan bovendien goedkeuring onthouden aan een institutionele fusie indien de percentages leerlingen
      betrokken bij de fusie minder zijn dan de percentages bedoeld in [artikel 72][ref1] of artikel 72a, eerste lid,
      onderdeel a.

      3 Onze Minister laat zich ten aanzien van de goedkeuring, bedoeld in het eerste en tweede lid, adviseren door
      een onafhankelijke adviescommissie, tenzij de noodzaak daartoe ontbreekt. Bij ministeriële regeling wordt bepaald
      wanneer er geen sprake is van de noodzaak bedoeld in de eerste volzin.

      4 Onze Minister stelt beleidsregels vast omtrent de uitoefening van de bevoegdheid, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
