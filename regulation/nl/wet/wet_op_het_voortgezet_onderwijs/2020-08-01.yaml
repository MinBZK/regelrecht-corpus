  - number: 96m
    text: |-
      1 Het bedrag van de bekostiging waarop het bevoegd gezag over een kalenderjaar aanspraak heeft, stelt Onze Minister
      vast op de som van de overeenkomstig het bepaalde in dit hoofdstuk verstrekte bekostiging en betaalde bedragen.

      2 Op het in het eerste lid bedoelde bedrag worden in mindering gebracht:

      a. de inkomsten die het bevoegd gezag geniet uit cursusgelden als bedoeld in de [Les- en cursusgeldwet][ref1],

      b. de inkomsten die het bevoegd gezag geniet uit verhaal van wettelijk verschuldigde bedragen en premies,

      c. de door Onze Minister vast te stellen waarde van roerende zaken die door vervreemding of op andere wijze worden
      onttrokken aan de bestemming, waartoe zij met de vergoeding zijn aangeschaft, en

      d. de opbrengst van werkstukken en van verrichte diensten anders dan in het kader van contractactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0004188
    url: https://wetten.overheid.nl/BWBR0002399/2020-08-01#Artikel96m
    references:
      - id: ref1
        bwb_id: BWBR0004188
  - number: 96n
    text: |-
      1 Op de bekostiging, bedoeld in [artikel 96m, eerste lid][ref1], [artikel 85b, eerste lid][ref2], en
      [artikel 85b1, eerste lid][ref3], wordt volgens bij of krachtens algemene maatregel van bestuur te stellen
      regels een bedrag in mindering gebracht in verband met de kosten van werkloosheidsuitkeringen, suppleties inzake
      arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid aan gewezen personeel anders dan
      op grond van de [Ziektewet][ref4]. Deze regels kunnen voorzien in:

      a. onderscheid in verband met de datum waarop gewezen personeel is ontslagen,

      b. onderscheid in verband met de beslissing van de rechtspersoon, bedoeld in [artikel 98b, eerste lid][ref5], zoals
      luidend op de dag voor de inwerkingtreding van [artikel IV van de wet van 12 mei 2005][ref6], Stb. 288, en

      c. verdeling van de in de eerste volzin bedoelde kosten over enerzijds de bevoegde gezagsorganen gezamenlijk en
      anderzijds individuele bevoegde gezagsorganen en samenwerkingsverbanden.

      2 Onze Minister kan het burgerservicenummer van een persoon, behorend tot gewezen personeel als bedoeld in het
      eerste lid, uitsluitend in het kader van het bepaalde bij of krachtens het eerste lid, gebruiken in het verkeer
      met:

      a. het bevoegd gezag van de school waar de in de aanhef bedoelde persoon werkzaam was, of

      b. de instantie die de uitkeringen verstrekt of heeft verstrekt.

      3 Het burgerservicenummer wordt op een daartoe strekkend verzoek van Onze Minister aan Onze Minister verstrekt door
      het bevoegd gezag van de school waar het gewezen personeelslid werkzaam was.


