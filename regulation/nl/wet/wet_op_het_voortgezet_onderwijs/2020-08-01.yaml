  - number: 72a
    text: |-
      1 Met inachtneming van de [artikelen 53e tot en met 53i][ref1] van deze wet en van de
      [artikelen 2.1.8 tot en met 2.1.12 van de Wet educatie en beroepsonderwijs][ref2] kan Onze Minister voor
      bekostiging in aanmerking brengen een school voor:

      a. mavo, vbo of praktijkonderwijs die wordt samengevoegd met een verticale scholengemeenschap waar een regionaal
      opleidingencentrum onderdeel van uitmaakt, indien ten minste een bij ministeriële regeling vast te stellen
      percentage van de leerlingen van een vestiging van de bij de samenvoeging betrokken school voor mavo, vbo of
      praktijkonderwijs afkomstig is uit dezelfde postcodegebieden als de leerlingen van een vestiging van de verticale
      scholengemeenschap, of

      b. mavo of praktijkonderwijs die wordt samengevoegd met een verticale scholengemeenschap waar een agrarisch
      opleidingscentrum onderdeel van uitmaakt, indien ten minste een bij ministeriële regeling vast te stellen
      percentage van de leerlingen van een vestiging van de bij de samenvoeging betrokken school voor mavo of
      praktijkonderwijs afkomstig is uit dezelfde postcodegebieden als de leerlingen van een vestiging van de verticale
      scholengemeenschap.

      2 Na een samenvoeging kan op een vestiging in elk geval onderwijs worden verzorgd in dezelfde schoolsoorten,
      in dezelfde profielen als bedoeld in de [artikelen 10b][ref3] en [10d][ref4] en in dezelfde leerjaren als op de
      desbetreffende vestiging voor de samenvoeging werd verzorgd.

      3 Een samenvoeging kan slechts plaatsvinden met ingang van 1 augustus van enig kalenderjaar.


