  - number: 10b4
    text: |-
      1 Het bedrijf dat of de organisatie die het buitenschoolse praktijkgedeelte verzorgt, draagt zorg voor de
      begeleiding van de leerlingen binnen het bedrijf respectievelijk de organisatie.

      2 Het bestuur van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven, bedoeld in
      [artikel 1.5.1 van de Wet educatie en beroepsonderwijs][ref1], zorgt ervoor dat bedrijven en organisaties die
      het buitenschoolse praktijkgedeelte verzorgen eenmaal in de vier jaar worden beoordeeld aan de hand van de
      kwaliteitseisen in [artikel 10b6][ref2]. Indien daartoe door bijzondere omstandigheden aanleiding bestaat kan
      controle frequenter plaats vinden.

      3 Het bestuur van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven erkent een bedrijf of organisatie
      als leerbedrijf voor het buitenschoolse praktijkgedeelte of handhaaft de erkenning bij een gunstige beoordeling op
      grond van het tweede lid, eerste volzin. Het bestuur weigert de erkenning of trekt de erkenning in, indien de in
      het tweede lid, eerste volzin, bedoelde beoordeling ongunstig is.

      4 Het bestuur vraagt geen vergoeding voor de kosten van de beoordeling, bedoeld in het tweede lid, en de
      beschikkingen, bedoeld in het derde lid.

      5 De erkenning vervalt van rechtswege als het leerbedrijf gedurende een aaneengesloten periode van vier jaar geen
      buitenschools praktijkgedeelte heeft verzorgd.

      6 Indien het bevoegd gezag na het sluiten van de leer-werkovereenkomst vaststelt dat de praktijkplaats niet of niet
      volledig beschikbaar is, de begeleiding tekortschiet of ontbreekt, of sprake is van andere omstandigheden die maken
      dat het buitenschoolse praktijkgedeelte niet naar behoren zal kunnen worden verzorgd, bevordert het bevoegd gezag,
      na overleg met het bestuur van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven dat een toereikende
      vervangende voorziening beschikbaar wordt gesteld.

      7 De Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven draagt zorg voor openbaarmaking van een overzicht van
      bedrijven en organisaties met een erkenning op grond van het derde lid, eerste volzin.

      8 Tot het verzorgen van het buitenschoolse praktijkgedeelte zijn uitsluitend bevoegd de bedrijven en organisaties
      met een erkenning op grond van het derde lid, eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.5.1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b6
