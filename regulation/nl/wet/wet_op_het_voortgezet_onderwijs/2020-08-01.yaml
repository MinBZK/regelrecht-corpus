        afdeling: I
  - number: 53g
    text: |-
      1 De rechtspersoon dient dan wel de rechtspersonen gezamenlijk dienen een aanvraag in bij Onze Minister voor het
      verkrijgen van de goedkeuring, bedoeld in [artikel 53f, eerste lid][ref1]. De aanvraag gaat vergezeld van:

      a. een door de rechtspersoon dan wel rechtspersonen opgestelde fusie-effectrapportage, en

      b. een schriftelijke verklaring van instemming met de fusie door de medezeggenschapsraden dan wel de
      gemeenschappelijke medezeggenschapsraden, dan wel

      c. de bindende uitspraak van de geschillencommissie, bedoeld in
      [artikel 32, derde lid, van de Wet medezeggenschap op scholen][ref2], dan wel de bindende uitspraak van de
      ondernemingskamer, bedoeld in [artikel 36, derde lid, van de Wet medezeggenschap op scholen][ref3].

      2 Een aanvraag als bedoeld in het eerste lid geldt eveneens als een aanvraag om voor bekostiging in aanmerking te
      komen als bedoeld in de [artikelen 72][ref4] en 72a.

      3 De fusie-effectrapportage bevat ten minste een weergave van:

      a. de motieven voor de fusie,

      b. de alternatieven voor de fusie,

      c. het tijdsbestek waarbinnen de fusie zal worden gerealiseerd,

      d. de te bereiken doelen,

      e. de effecten van de fusie op de keuzevrijheid, in het bijzonder de effecten van de fusie op de spreiding en
      omvang van de rechtspersonen en vestigingen van scholen in de gemeenten waarin de huidige leerlingen van die
      scholen woonachtig zijn, de onderwijskundige en bestuurlijke diversiteit van het onderwijsaanbod in de betreffende
      gemeenten,

      f. de financiële en personele gevolgen en de gevolgen voor leerlingen van de fusie, waaronder begrepen de gevolgen
      voor de voorzieningen,

      g. de wijze waarop over de fusie wordt gecommuniceerd,

      h. de wijze waarop de fusie wordt geëvalueerd, en

      i. een advies van burgemeester en wethouders van de betrokken gemeenten over de wenselijkheid van de voorgestelde
      fusie.

      4 Bij ministeriële regeling wordt een modelformulier voor de fusie-effectrapportage vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53f
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel72
