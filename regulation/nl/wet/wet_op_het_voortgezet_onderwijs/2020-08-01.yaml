  - number: 76i
    text: |-
      1 Het bevoegd gezag van een andere dan een gemeentelijke school dat een voorziening in de huisvesting wenst
      die niet in het programma, bedoeld in [artikel 76f][ref1], is opgenomen, maar die gelet op de voortgang van het
      onderwijs geen uitstel kan lijden, dient een aanvraag om bekostiging van die voorziening in bij burgemeester en
      wethouders.

      2 De beschikking kan een gedeelte van de gewenste voorziening dan wel een andere voorziening dan gewenst omvatten.
      Burgemeester en wethouders wijzen de aanvraag af, indien:

      a. de beslissing over de voorziening kan worden genomen bij de vaststelling van het eerstvolgende programma, of

      b. een van de weigeringsgronden, genoemd in
      [artikel 76k, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref2], van toepassing is.


