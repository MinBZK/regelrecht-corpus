  - number: 85c
    text: |-
      Indien het totaal van de bedragen, bedoeld in [artikel 85b, derde lid, eerste volzin, en vierde lid][ref1],
      de personeelsbekostiging van het samenwerkingsverband, bedoeld in artikel 85b, eerste lid, overschrijdt, wordt
      het bedrag waarmee die bekostiging wordt overschreden door Onze Minister in mindering gebracht op de personele
      bekostiging van alle scholen en scholen voor voortgezet speciaal onderwijs en speciaal en voortgezet speciaal
      onderwijs behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref2], waarvan één of meer
      vestigingen zijn gelegen in het gebied van het samenwerkingsverband. Het bedrag dat in mindering wordt gebracht
      wordt per school dan wel school voor voortgezet speciaal onderwijs of speciaal en voortgezet speciaal onderwijs
      behorend tot cluster 3 of 4, bedoeld in de Wet op het expertisecentra, voor zover het betreft het daaraan verzorgde
      voortgezet speciaal onderwijs, bepaald op basis van het leerlingenaantal van de desbetreffende vestiging of
      vestigingen in het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85b
      [ref2]: https://wetten.overheid.nl/BWBR0003549
