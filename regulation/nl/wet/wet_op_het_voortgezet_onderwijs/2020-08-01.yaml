  - number: 118i1
    text: |-
      1 Burgemeester en wethouders in een regio als bedoeld in artikel 118h, tweede lid, en de in dat lid bedoelde
      scholen, instellingen en organisaties stellen telkens voor een periode van vier jaren een regionaal programma
      op met maatregelen ter voorkoming en bestrijding van voortijdig schoolverlaten van jongeren tussen twaalf
      en drieëntwintig jaar. Het programma heeft mede betrekking op leer- en kwalificatieplichtigen en het volgen
      door burgemeester en wethouders van de deelname aan onderwijs en arbeidsmarkt van de personen, bedoeld in
      [artikel 118h, eerste lid, vierde volzin][ref1].

      2 Burgemeester en wethouders in een regio als bedoeld in [artikel 118h, tweede lid, en de in dat lid][ref2]
      bedoelde scholen, instellingen en organisaties voeren regionaal bestuurlijk overleg over de totstandkoming van het
      regionaal programma en de uitvoering en financiering van de daarin opgenomen maatregelen. Bij het overleg worden
      tevens de domeinen arbeid en zorg betrokken.

      3 Burgemeester en wethouders van de contactgemeente coördineren het regionaal bestuurlijk overleg, de
      totstandkoming van het regionaal programma en de uitvoering en financiering van de daarin opgenomen regionale
      maatregelen.

      4 De specifieke uitkering, bedoeld in [artikel 118h, vijfde lid][ref3], is mede bestemd voor de uitvoering van het
      regionaal programma.

      5 Burgemeester en wethouders van de contactgemeente geven in de effectrapportage, bedoeld in
      [artikel 118h, zevende lid][ref4], aan hoe de domeinen arbeid en zorg bij het regionale bestuurlijk overleg zijn
      betrokken en welke resultaten hiermee zijn bereikt.


