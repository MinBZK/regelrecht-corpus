        artikel: '1'
  - number: 27.1a
    text: |-
      Voor het volgen van een vorm van onderwijs als onderscheiden in [artikel 5][ref1] aan een school wordt uitsluitend
      als leerling toegelaten degene waarvan de ouders, voogden of verzorgers aantonen, dan wel, indien hij meerderjarig
      en handelingsbekwaam is, degene die aantoont dat hij:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '5'
  - number: 27.1a.a
    text: de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
  - number: 27.1a.b
    text: |-
      vreemdeling is en jonger is dan 18 jaar op de eerste schooldag waarop de vorm van voortgezet onderwijs als
      onderscheiden in [artikel 5][ref1] begint waarvoor voor de eerste maal toelating wordt gewenst,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '5'
  - number: 27.1a.c
    text: |-
      vreemdeling is, 18 jaar of ouder is op de eerste schooldag waarop de vorm van voortgezet onderwijs als
      onderscheiden in [artikel 5][ref1] begint waarvoor voor de eerste maal toelating wordt gewenst en op die dag
      rechtmatig verblijf houdt in de zin van [artikel 8 van de Vreemdelingenwet 2000][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 27.1a.d
    text: |-
      vreemdeling is, niet meer voldoet aan een van de voorwaarden, genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen voor een vorm van voortgezet onderwijs als onderscheiden in [artikel 5][ref1] is
      toegelaten tot een school, welke vorm van voortgezet onderwijs nog steeds wordt gevolgd en nog niet is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '5'
  - number: 27.1b
    text: |-
      Indien na de toelating tot de school blijkt dat deze op welke grond dan ook niet in overeenstemming met lid 1a
      heeft plaatsgevonden, wordt de leerling onmiddellijk verwijderd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
  - number: 27.1c
    text: |-
      De toelating van de leerling wordt gebaseerd op het schooladvies, bedoeld
      in [artikel 42, tweede lid, van de Wet op het primair onderwijs][ref1] of
      [artikel 43, tweede lid, van de Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel43
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '43'
  - number: '27.2'
    text: De toelating wordt niet afhankelijk gesteld van een andere dan een bij of krachtens de wet geregelde bijdrage.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
  - number: 27.2a
    text: |-
      De aanmelding van leerlingen voor toelating geschiedt schriftelijk. De ouders doen de aanmelding zo mogelijk ten
      minste 10 weken voor de datum waarop toelating wordt gevraagd en geven bij de aanmelding aan bij welke school of
      scholen eveneens om toelating is verzocht.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
  - number: 27.2b
    text: |-
      Het bevoegd gezag beoordeelt of de aanmelding een leerling betreft die extra ondersteuning behoeft. Hiertoe
      kan het bevoegd gezag de ouders verzoeken gegevens te overleggen betreffende stoornissen of handicaps van de
      leerling of beperkingen in de onderwijsparticipatie. Onder extra ondersteuning wordt niet verstaan ondersteuning
      ter bevordering van de beheersing van de Nederlandse taal met het oog op het voorkomen en bestrijden van
      onderwijsachterstanden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
  - number: 27.2c
    text: |-
      Indien de toelating van een leerling die extra ondersteuning behoeft, wordt geweigerd, vindt de weigering niet
      plaats dan nadat het bevoegd gezag er, na overleg met de ouders en met inachtneming van de ondersteuningsbehoefte
      van de leerling en de schoolondersteuningsprofielen van de betrokken scholen, voor heeft zorg gedragen dat een
      andere school bereid is de leerling toe te laten. Onder andere school kan ook worden verstaan een school voor
      voortgezet speciaal onderwijs, een school voor speciaal en voortgezet speciaal onderwijs, een instelling voor
      speciaal en voortgezet speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref1] of een instelling als
      bedoeld in [artikel 1, onder c, van de Leerplichtwet 1969][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '1'
  - number: 27.2d
    text: 'De leden 2b en 2c zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
  - number: 27.2d.a
    text: indien op de school waar de leerling is aangemeld geen plaatsruimte beschikbaar is, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
  - number: 27.2d.b
    text: |-
      indien het bevoegd gezag de ouders bij de aanmelding verzoekt te verklaren dat zij de grondslag van het onderwijs
      op de school zullen respecteren dan wel te verklaren dat zij de grondslag van het onderwijs op de school zullen
      onderschrijven, en de ouders dit weigeren te verklaren, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
  - number: 27.2d.c
    text: |-
      indien de leerling niet voldoet aan de voorwaarden voor toelating gesteld bij of krachtens de algemene maatregel
      van bestuur, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
  - number: 27.2e
    text: |-
      Het bevoegd gezag neemt de beslissing over toelating van een leerling zo spoedig mogelijk doch uiterlijk 6
      weken na ontvangst van de aanmelding. Indien de beslissing, bedoeld in de vorige volzin, niet binnen 6 weken kan
      worden gegeven, deelt het bevoegd gezag dit aan de ouders mede en noemt het daarbij een zo kort mogelijke termijn
      waarbinnen de beslissing wel tegemoet kan worden gezien, welke termijn ten hoogste 4 weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
  - number: 27.2f
    text: |-
      Indien de aanmelding een leerling betreft die niet is ingeschreven op een andere school, een school voor voortgezet
      speciaal onderwijs, een school voor speciaal en voortgezet speciaal onderwijs of een instelling voor speciaal
      en voortgezet speciaal onderwijs voor wat betreft het daaraan verzorgde voortgezet speciaal onderwijs, en de
      beslissing over de toelating is 10 weken na de dag waarop het verzoek om toelating is gedaan nog niet genomen,
      wordt de leerling met ingang van de dag volgend op bedoelde 10 weken, doch niet eerder dan de datum waarop de
      leerling voldoet aan de voorwaarden om te kunnen worden toegelaten tot de school, tijdelijk geplaatst op de
      school en als leerling ingeschreven. Indien de leerling wordt toegelaten, wordt de tijdelijke plaatsing omgezet
      in een definitieve plaatsing. Indien de toelating van de leerling wordt geweigerd of een beslissing wordt genomen
      de aanmelding niet te behandelen, wordt de tijdelijke plaatsing beëindigd en wordt de leerling uitgeschreven
      met ingang van de dag die volgt op de dag waarop de toelating wordt geweigerd of de beslissing wordt genomen de
      aanmelding niet te behandelen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
  - number: 27.2g
    text: |-
      Het bevoegd gezag van een bijzondere school kan beslissen een aanmelding voor toelating niet te behandelen,
      indien de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanmelding of voor
      de voorbereiding van de toelatingsbeslissing, mits de ouders dan wel, indien de leerling meerderjarig en
      handelingsbekwaam is, de leerling, de gelegenheid hebben gehad de aanmelding binnen een door het bevoegd gezag
      gestelde termijn aan te vullen. Een beslissing om de aanmelding niet te behandelen wordt aan de ouders dan wel de
      leerling bekendgemaakt binnen vier weken nadat de aanmelding is aangevuld of nadat de daarvoor gestelde termijn
      ongebruikt is verstreken. De termijn voor het nemen van de toelatingsbeslissing wordt opgeschort met ingang van de
      dag waarop het bevoegd gezag krachtens de eerste volzin de ouders dan wel de leerling uitnodigt de aanmelding aan
      te vullen, tot de dag waarop de aanmelding is aangevuld of de daarvoor gestelde termijn ongebruikt is verstreken.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
  - number: '27.3'
    text: |-
      Een leerling mag geen praktijkonderwijs meer volgen aan een school voor praktijkonderwijs na afloop van het
      schooljaar waarin hij de leeftijd van achttien jaren heeft bereikt. Op aanvraag van het bevoegd gezag, gedaan
      in het in de eerste volzin bedoelde schooljaar, kan de inspectie besluiten dat de leerling het daaropvolgende
      schooljaar praktijkonderwijs kan blijven volgen, indien zij van mening is dat zonder het volgen van dit schooljaar
      de leerling niet voldoende is voorbereid op de functies, bedoeld in [artikel 10f, derde lid, eerste volzin][ref1].
      De inspectie kan de tweede volzin op overeenkomstige wijze toepassen in het schooljaar waarin de leerling de
      leeftijd van 19 jaren heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '27.4'
    text: |-
      Op bezwaarschriften tegen beslissingen over toelating of verwijdering van leerlingen, beslist het
      bevoegd gezag, voor zover het een bevoegd gezag van een openbare school betreft in afwijking van
      [artikel 7:10 van de Algemene wet bestuursrecht][ref1], binnen 4 weken na ontvangst van het bezwaarschrift, doch
      niet eerder dan nadat de leerling en, indien deze jonger is dan 18 jaar, ook diens ouders, voogden of verzorgers,
      in de gelegenheid is, respectievelijk zijn gesteld, te worden gehoord en kennis heeft, respectievelijk hebben
      kunnen nemen van de op die beslissingen betrekking hebbende adviezen of rapporten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 27a.1
    text: |-
      Het bevoegd gezag weigert een leerling niet de toelating tot het vijfde leerjaar van het voorbereidend
      wetenschappelijk onderwijs dan wel het vierde leerjaar van het hoger algemeen voortgezet onderwijs op grond van
      zijn oordeel over kennis, vaardigheden of leerhouding van de leerling, indien de leerling in het bezit is van een
      diploma hoger algemeen voortgezet onderwijs onderscheidenlijk een diploma voorbereidend middelbaar beroepsonderwijs
      in de theoretische of gemengde leerweg.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a
  - number: 27a.2
    text: |-
      In afwijking van het eerste lid, mag het bevoegd gezag de toelating weigeren indien de leerling niet voldoet aan
      voorwaarden die bij algemene maatregel van bestuur kunnen worden gesteld met betrekking tot kennis, vaardigheden of
      leerhouding van de leerling.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a
  - number: 27a1.1
    text: |-
      Het bevoegd gezag stelt van iedere aan de school ingeschreven leerling die valt onder de werking van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1], vast, of deze leerling gedurende
      een aaneengesloten periode van ten minste 5 weken zonder geldige reden niet aan het onderwijs heeft deelgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a1
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 27a1.2
    text: |-
      Het bevoegd gezag meldt uiterlijk op de derde werkdag na afloop van een periode van afwezigheid van vier weken aan
      de leerling dat daarvan in de administratie van de school aantekening is gemaakt en verzoekt de leerling om opgaaf
      van de reden van de afwezigheid. Het bevoegd gezag doet daarbij mededeling van de opgave van de gegevens van de
      leerling, bedoeld in [artikel 28a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel28a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 28a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27a1.3
    text: 'Uiterlijk op de vijfde werkdag na de periode van 8 weken stelt het bevoegd gezag vast:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a1
  - number: 27a1.3.a
    text: |-
      of de reden die de leerling binnen 8 weken na de aanvang van de periode van 5 weken gaf voor zijn afwezigheid, een
      geldige is, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a1
  - number: 27a1.3.b
    text: |-
      dat de leerling binnen 8 weken na de aanvang van de periode van 5 weken geen reden heeft opgegeven voor zijn
      afwezigheid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a1
  - number: 27a1.4
    text: |-
      Het bevoegd gezag stelt tevens uiterlijk op de vijfde werkdag na afloop van de periode van 8 weken vast of de
      leerling voor het einde van die periode weer aan het onderwijs is gaan deelnemen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a1
  - number: 27a1.5
    text: |-
      Het bevoegd gezag meldt uiterlijk de vijfde werkdag na afloop van een periode van 8 weken aan Onze Minister de
      leerling die gedurende een aaneengesloten periode van ten minste 5 weken zonder opgave van geldige reden niet aan
      het onderwijs heeft deelgenomen. Tevens meldt het indien die leerling voor het einde van de periode van 8 weken
      weer aan het onderwijs is gaan deelnemen de datum ervan.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a1
  - number: 27a1.6
    text: |-
      De periode van 5 weken en de periode van 8 weken worden verlengd met de weken waarin vanwege vakantie geen
      onderwijs werd verzorgd. Zij wordt geacht niet te zijn onderbroken door deze vakantieweken.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a1
  - number: 27a1.7
    text: |-
      Het bevoegd gezag stuurt gelijktijdig met de mededelingen, bedoeld in het vijfde lid, een afschrift
      van de gegevens die over de betrokken leerling aan Onze Minister zijn verstrekt aan deze betrokkene.
      Het bevoegd gezag geeft daarbij tevens aan dat afwezigheid als bedoeld in het eerste lid, gevolgen
      heeft voor de tegemoetkoming in de onderwijsbijdrage en de schoolkosten van betrokkene op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1], alsmede welke beroepsgang voor
      betrokkene tegen de mededeling, bedoeld in het vijfde lid, open staat.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a1
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 27a1.8
    text: |-
      Indien het bevoegd gezag de mededelingen, bedoeld in het vijfde lid, heeft gedaan, kan de leerling binnen 6 weken
      na ontvangst van de gegevens, bedoeld in het zevende lid, bij het bevoegd gezag schriftelijk bedenkingen uiten
      tegen die mededelingen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a1
  - number: 27a1.9
    text: 'Onder afwezigheid met een geldige reden als bedoeld in het eerste lid wordt verstaan afwezigheid wegens:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a1
  - number: 27a1.9.a
    text: |-
      ziekte van de leerling, welke ziekte uitsluitend kan worden aangetoond door middel van een gedagtekende verklaring
      van een arts,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a1
  - number: 27a1.9.b
    text: |-
      zwangerschap of bevalling van de leerling, welke uitsluitend kan worden aangetoond door middel van een
      schriftelijke verklaring van een arts of verloskundige, gedurende een periode van 16 weken die, indien de leerling
      dat wenst, 6 weken voor de dag na de vermoedelijke datum van bevalling ingaat of gedurende een periode van 20 weken
      die, indien de leerling dat wenst, 10 weken voor de dag na de vermoedelijke datum van bevalling ingaat indien het
      een zwangerschap van meer dan één kind betreft, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a1
  - number: 27a1.9.c
    text: bijzondere familieomstandigheden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a1
  - number: 27a1.10
    text: |-
      Het bevoegd gezag kan bepalen dat de periode, bedoeld in het negende lid, onderdeel b, wordt verlengd als dit naar
      zijn oordeel passend is.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27a1
  - number: 27b.1
    text: |-
      Onverminderd bij algemene maatregel van bestuur gegeven voorschriften met betrekking tot de in- en uitschrijving
      van leerlingen, vindt toelating van een leerling als bedoeld in [artikel 27][ref1] slechts plaats nadat door de
      ouders, voogden of verzorgers of, indien de leerling meerderjarig is, door de leerling de gegevens betreffende
      de geslachtsnaam, de voorletters, de geboortedatum, het geslacht en het persoonsgebonden nummer van de leerling
      zijn overgelegd. Indien door de ouders, voogden of verzorgers of, indien de leerling meerderjarig is, door de
      leerling aannemelijk wordt gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, vindt de
      toelating plaats met inachtneming van het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27b.2
    text: |-
      De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt document,
      waarin de desbetreffende gegevens zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27b
  - number: 27b.3
    text: |-
      Indien door de ouders, voogden of verzorgers of, indien de leerling meerderjarig is, door de leerling aannemelijk
      wordt gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, meldt het bevoegd gezag
      binnen twee weken na het besluit tot toelating aan Onze Minister de beschikbare gegevens van de leerling, bedoeld
      in het eerste lid, alsmede zijn adres en woonplaats en, indien aanwezig, het leerlingadministratienummer.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27b
  - number: 27b.4
    text: |-
      Onze Minister verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het derde lid, aan het bevoegd
      gezag het burgerservicenummer van de leerling, dan wel, indien is gebleken dat hem niet van overheidswege een
      burgerservicenummer is verstrekt, het onderwijsnummer van de leerling. Het onderwijsnummer is een door Onze
      Minister uitgegeven en aan de leerling toegekend persoonsgebonden nummer.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27b
  - number: 27b.5
    text: |-
      Het bevoegd gezag neemt de in het eerste en vierde lid bedoelde gegevens op in de leerlingenadministratie van de
      school.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27b
  - number: 27b.6
    text: |-
      Indien aan een leerling een onderwijsnummer is toegekend en het bevoegd gezag daarna de beschikking krijgt over
      zijn burgerservicenummer, neemt het bevoegd gezag dit burgerservicenummer terstond als persoonsgebonden nummer
      op in de leerlingenadministratie van de school in de plaats van het onderwijsnummer. Het bevoegd gezag meldt deze
      wijziging binnen twee weken aan Onze Minister onder opgave van het burgerservicenummer en het onderwijsnummer van
      de leerling.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27b
  - number: 27c.1
    text: |-
      Er is tot een bij koninklijk besluit te bepalen tijdstip een landelijke commissie voor geschillen waarbij
      elke school, school als bedoeld in de [Wet op het primair onderwijs][ref1] en school als bedoeld in de
      [Wet op de expertisecentra][ref2] is aangesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27c
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: 27c.2
    text: |-
      De commissie neemt kennis van geschillen tussen ouders en bevoegd gezag van een school die ontstaan bij de
      toepassing van:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27c
  - number: 27c.2.a
    text: |-
      [artikel 26, eerste, tweede en vijfde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel26
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '26'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27c.2.b
    text: |-
      [artikel 27, eerste lid, vierde volzin en de leden 2b, 2c en 2d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 27c.3
    text: |-
      De commissie brengt op verzoek van de ouders binnen 10 weken een oordeel uit aan het bevoegd gezag, rekening
      houdend met het schoolondersteuningsprofiel en het ondersteuningsplan.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27c
  - number: 27c.4
    text: |-
      Indien een geschil aanhangig is gemaakt bij de commissie en de ouders bezwaar hebben gemaakt tegen de beslissing
      over de toelating of de verwijdering, neemt het bevoegd gezag de beslissing op bezwaar niet dan nadat de commissie
      heeft geoordeeld. De termijn voor het nemen van de beslissing op bezwaar wordt opgeschort met ingang van de
      dag waarop het geschil aanhangig is gemaakt bij de commissie tot de dag waarop de commissie het oordeel heeft
      uitgebracht.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27c
  - number: 27c.5
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot de commissie, waaronder in elk
      geval het aantal leden, de wijze van benoeming en ontslag en de deskundigheid van de leden van de commissie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27c
  - number: 27d.1
    text: |-
      Het bevoegd gezag geeft jaarlijks de leerlingen op die aan die school een opleiding praktijkonderwijs of
      de basisberoepsgerichte, kaderberoepsgerichte, gemengde of theoretische leerweg volgen, en naar verwachting
      het aankomend schooljaar hun opleiding zullen vervolgen aan een beroepsopleiding in de zin van de
      [Wet educatie en beroepsonderwijs][ref1]. De opgave wordt gedaan aan het college van burgemeester en wethouders van
      de woon- of verblijfplaats van deze leerlingen. Deze informatie wordt uitsluitend gebruikt om schooluitval bij de
      overgang naar het beroepsonderwijs als bedoeld in de Wet educatie en beroepsonderwijs, te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 27d.2
    text: |-
      Bij ministeriële regeling worden ter uitvoering van het eerste lid regels vastgesteld. Deze betreffen in ieder
      geval een specificatie van de bij de opgave te leveren gegevens, het tijdstip en de wijze waarop deze gegevens
      worden geleverd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27d
  - number: '28.1'
    text: |-
      Het bevoegd gezag doet onverwijld opgave aan burgemeester en wethouders van de gemeente waar de betrokkene woon- of
      verblijfplaats heeft van de gegevens van degene
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel28
  - number: 28.1.a
    text: |-
      op wie de [Leerplichtwet 1969][ref1] niet meer van toepassing is en die de leeftijd van 23 jaren nog niet heeft
      bereikt,


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 28.1.b
    text: |-
      die niet in het bezit is van een diploma voorbereidend wetenschappelijk
      onderwijs of hoger algemeen voortgezet onderwijs als bedoeld in [artikel 7][ref1]
      onderscheidenlijk [artikel 8][ref2] dan wel een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de Wet educatie en beroepsonderwijs][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 28.1.c
    text: die van de school wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel28
  - number: '28.2'
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel28
  - number: 28a
    text: |-
      Indien degene die voldoet aan [artikel 28, eerste lid, onderdelen a en b][ref1], het onderwijs aan de school
      gedurende een aaneengesloten periode van ten minste vier weken of een door het bevoegd gezag te bepalen kortere
      periode zonder geldige reden, waaronder in ieder geval de redenen, bedoeld in [artikel 27a, negende lid][ref2],
      worden verstaan, niet meer volgt, ontstaat voor het bevoegd gezag de leveringsverplichting, bedoeld in
      [artikel 12, derde lid, van de Wet register onderwijsdeelnemers][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel27a
      [ref3]: https://wetten.overheid.nl/BWBR0042012#Artikel12
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '28'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 27a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0042012
        artikel: '12'
  - number: 28b.1
    text: |-
      De deelname van leerlingen aan activiteiten die geen onderdeel uitmaken van het verplichte onderwijsprogramma
      en worden georganiseerd onder verantwoordelijkheid van het bevoegd gezag, wordt niet afhankelijk gesteld van een
      bijdrage als bedoeld in [artikel 27, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 28b.2
    text: 'Aan het eerste lid wordt in ieder geval voldaan voor de daar bedoelde activiteiten, indien:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel28b
  - number: 28b.2.a
    text: |-
      deze activiteiten buiten de kerndoelen, bedoeld in [artikel 11b][ref1], of eindtermen en eindexamenprogramma’s
      langdurig aan leerlingen worden aangeboden door een school die door dat bevoegd gezag in stand gehouden wordt,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 28b.2.b
    text: die school is aangesloten bij een verband van scholen die dergelijke activiteiten organiseren, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel28b
  - number: 28b.2.c
    text: |-
      krachtens een door dat verband vastgestelde code een regeling is getroffen voor de leerlingen ten aanzien van wie
      niet of niet geheel de gevraagde ouderbijdrage wordt betaald.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel28b
  - number: 28b.3
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gesteld aan de scholen, bedoeld in het tweede lid,
      onderdeel b, en aan de code, bedoeld in het tweede lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel28b
  - number: '29.1'
    text: |-
      Aan de leerlingen van de scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger algemeen voortgezet
      onderwijs, voor middelbaar algemeen voortgezet onderwijs en voor voorbereidend beroepsonderwijs wordt gelegenheid
      gegeven aan deze scholen een eindexamen af te leggen, tenzij in de plaats daarvan de gelegenheid bestaat tot het
      afleggen van een eindexamen, dat niet vanwege de school wordt afgenomen en het bevoegd gezag in verband hiermede
      een eindexamen aan de school niet nodig oordeelt. Het eindexamen kan voor elk vak of ander programma-onderdeel
      bestaan uit een schoolexamen, uit een centraal examen dan wel beide.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel29
  - number: 29.1a
    text: |-
      Indien ten aanzien van een schoolsoort of leerweg het gemiddelde verschil tussen de cijfers van het centraal
      examen en het schoolexamen over een periode van drie jaren meer dan een half punt bedraagt, kan Onze Minister in
      afwijking van het eerste lid besluiten dat het bevoegd gezag voor een periode van twee jaren leerlingen niet in de
      gelegenheid stelt een eindexamen af te leggen in de desbetreffende schoolsoort of leerweg.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel29
  - number: 29.1b
    text: |-
      Onze Minister besluit of toepassing wordt gegeven aan lid 1a nadat het bevoegd gezag van de school gedurende een
      periode van tenminste drie jaar de gelegenheid heeft gehad, het gemiddelde verschil, bedoeld in lid 1a, ongedaan te
      maken voor zover dat verschil meer dan een half punt bedraagt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel29
  - number: '29.2'
    text: |-
      Het eindexamen wordt afgenomen door de rector, de directeur, de conrector, de adjunct-directeur of een of
      meer leden van de centrale directie en leraren van de school. Het eindexamen staat onder toezicht van een of
      meer gecommitteerden behoudens voor bij of krachtens algemene maatregel van bestuur aan te wijzen examens en
      examenonderdelen. Bij of krachtens algemene maatregel van bestuur wordt bepaald door wie en op welke wijze de
      gecommitteerden worden aangewezen. Het eindexamen kan mede worden afgenomen door deskundigen. Het bevoegd gezag
      wijst de deskundigen aan.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel29
  - number: '29.3'
    text: |-
      Zij die het eindexamen met goed gevolg hebben afgelegd, ontvangen een diploma. Leerlingen van een school voor
      voorbereidend beroepsonderwijs voor zover het betreft de basisberoepsgerichte leerweg, die met goed gevolg
      een gedeelte van het examenprogramma hebben afgelegd, ontvangen een getuigschrift voorbereidend middelbaar
      beroepsonderwijs en leerlingen die een leer-werktraject met goed gevolg afsluiten, ontvangen een diploma
      basisberoepsgerichte leerweg/leer-werktraject. Onze Minister stelt de modellen van diploma's en getuigschriften
      vast.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel29
  - number: '29.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in dit artikel
      bedoelde eindexamens, alsmede omtrent programma-onderdelen, die niet voor alle leerlingen van een school
      dezelfde vakken en andere programma-onderdelen behoeven te omvatten. Bij deze algemene maatregel van bestuur
      worden tevens de eindexamenprogramma's vastgesteld. Bij de vaststelling van de eindexamenprogramma’s Nederlandse
      taal respectievelijk Nederlandse taal en literatuur worden de referentieniveaus Nederlandse taal in acht
      genomen die voor de desbetreffende schoolsoorten of voor dan wel binnen leerwegen zijn vastgesteld op grond van
      [artikel 2, tweede lid, aanhef en onderdeel c, van de Wet referentieniveaus Nederlandse taal en rekenen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel2
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0027679
        artikel: '2'
  - number: '29.5'
    text: |-
      Voor examens, die niet vanwege de school worden afgenomen, kunnen bij algemene maatregel van bestuur voorschriften
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel29
  - number: '29.6'
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs aan een school kan Onze Minister besluiten toe te staan
      dat wordt afgeweken van het bepaalde bij of krachtens dit artikel. Onze Minister besluit binnen zes maanden na
      ontvangst van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel29
  - number: 29a.1
    text: |-
      De directeur reikt een schooldiploma praktijkonderwijs uit aan de leerling die een school voor praktijkonderwijs
      verlaat en naar het oordeel van de directeur in aanmerking komt voor het schooldiploma. De directeur baseert zijn
      oordeel op een reglement dat door het bevoegd gezag wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel29a
  - number: 29a.2
    text: Een portfolio waarin de behaalde resultaten zijn opgenomen, maakt deel uit van het schooldiploma.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel29a
  - number: 29a.3
    text: Bij ministeriële regeling wordt een model voor het schooldiploma vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel29a
  - number: 29a.4
    text: |-
      De leerling die een deel van het programma heeft voltooid, de school voor praktijkonderwijs verlaat en niet op
      grond van het eerste lid een schooldiploma ontvangt, ontvangt een verklaring.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel29a
  - number: '30.1'
    text: |-
      Een diploma als bedoeld in [artikel 29, derde lid][ref1], kan ook worden uitgereikt aan degenen die niet als
      leerlingen van een school zijn ingeschreven, maar tot het eindexamen van die school zijn toegelaten en dit met
      gunstig gevolg hebben afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '30.2'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in het eerste lid bedoelde toelating
      tot het eindexamen. Daarbij wordt vastgesteld in welke gevallen een bedrag aan het bevoegd gezag verschuldigd is,
      alsmede de hoogte daarvan.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel30
  - number: 30a.1
    text: |-
      Tegen een besluit inzake deelneming aan eindexamens staat administratief beroep open bij een bij algemene maatregel
      van bestuur aan te wijzen bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel30a
  - number: 30a.2
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen van
      het beroepschrift vijf dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 30a.3
    text: |-
      In afwijking van
      [artikel 7:24, eerste, tweede, vierde, vijfde, zesde en zevende lid, van de Algemene wet bestuursrecht][ref1]
      beslist het beroepsorgaan binnen twee weken na ontvangst van het beroepschrift. Het kan de beslissing voor ten
      hoogste twee weken verdagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 30a.4
    text: |-
      Tegen een beslissing inzake deelneming aan eindexamens die geen besluit is, kan de betrokken leerling of zijn
      ouders voorziening vragen bij een bij algemene maatregel van bestuur aan te wijzen instantie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel30a
  - number: 30a.5
    text: |-
      De termijn voor het indienen van het verzoekschrift bedraagt vijf dagen, met ingang van de dag na die waarop de
      beslissing aan de leerling is uitgereikt of toegezonden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel30a
  - number: 30a.6
    text: |-
      De instantie, bedoeld in het vierde lid, beslist binnen twee weken na ontvangst van het verzoekschrift. Zij kan de
      beslissing voor ten hoogste twee weken verdagen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel30a
  - number: '31.1'
    text: |-
      De leerling die de school verlaat en aan wie geen diploma kan worden uitgereikt, ontvangt een verklaring waarin
      in ieder geval worden vermeld het tijdstip waarop hij de school verlaat en het leerjaar waartoe hij laatstelijk
      onvoorwaardelijk was bevorderd alsmede voor welke vormen van vervolgonderwijs en voor welke leerjaren daarvan hij
      geschikt wordt geacht. De verklaring wordt door het bevoegd gezag of namens het bevoegd gezag door de rector, de
      directeur, dan wel een of meer leden van de centrale directie, ondertekend.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel31
  - number: '31.4'
    text: Onze Minister stelt het model van de verklaring vast.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel31
  - number: '32.1'
    text: |-
      Aan een school voor voorbereidend wetenschappelijk onderwijs, algemeen voortgezet onderwijs, voorbereidend
      beroepsonderwijs en praktijkonderwijs zijn een of meer leraren verbonden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32
  - number: '32.2'
    text: |-
      Aan het hoofd van een school voor voorbereidend wetenschappelijk onderwijs staat een rector, aan het hoofd van een
      school voor algemeen voortgezet onderwijs, voorbereidend beroepsonderwijs en praktijkonderwijs een directeur.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32
  - number: '32.3'
    text: |-
      De conrectoren en de adjunct-directeuren hebben tot taak de rector onderscheidenlijk de directeur bij te staan en
      bij afwezigheid te vervangen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32
  - number: '32.4'
    text: Het overige personeel heeft tot taak het onderwijs te ondersteunen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32
  - number: '32.5'
    text: Een of meer leden van het personeel worden belast met de taak van schooldecaan.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32
  - number: '32.6'
    text: |-
      Het tweede en derde lid zijn niet van toepassing op de leden van de centrale directie, bedoeld in
      [artikel 32a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '32.7'
    text: |-
      Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van de verschillende categorieën
      personeel van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32
  - number: '32.8'
    text: |-
      Voor de toepassing van deze paragraaf wordt onder «vakken» tevens verstaan, programma-onderdelen als bedoeld in de
      [artikelen 13][ref1] en [14][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel14
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 32a.1
    text: |-
      Aan het hoofd van een school die aan bij algemene maatregel van bestuur te vermelden voorwaarden voldoet, kan het
      bevoegd gezag een centrale directie plaatsen bestaande uit ten hoogste vijf leden, waarvan er een door hem wordt
      benoemd tot voorzitter dan wel zonder benoeming tewerkgesteld als voorzitter. De formatie van de centrale directie
      omvat ten hoogste drie volledige formatieplaatsen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32a
  - number: 32a.2
    text: |-
      De centrale directie heeft in naam van het bevoegd gezag de leiding van de voorbereiding en de uitvoering van het
      beleid van de school, alsmede de coördinatie van de dagelijkse gang van zaken en van het beheer van de school.
      Indien toepassing is gegeven aan [artikel 32b][ref1], is de centrale directie tevens met de daar bedoelde taken en
      bevoegdheden belast.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 32b
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 32b
    text: |-
      Het bevoegd gezag van een school als bedoeld in [artikel 32a, eerste lid][ref1], kan bepalen dat hem bij wettelijk
      voorschrift toekomende taken en bevoegdheden in naam van het bevoegd gezag worden uitgeoefend door de centrale
      directie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 32b1.1
    text: |-
      Het bestuur kan hem bij wettelijk voorschrift opgedragen taken en bevoegdheden overdragen aan de centrale directie,
      de rector of de directeur van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32b1
  - number: 32b1.2
    text: |-
      De centrale directie, de rector of de directeur van de school kunnen hen bij wettelijk voorschrift opgedragen of
      door het bevoegd gezag overgedragen taken en bevoegdheden overdragen aan elkaar of aan de adjunct-directeur.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32b1
  - number: 32c.1
    text: |-
      Het bevoegd gezag stelt na overleg met de rector, de directeur, de conrector en de adjunct-directeur en indien
      toepassing is gegeven aan [artikel 32a][ref1] met de centrale directie, een managementstatuut vast. In het
      managementstatuut is ten minste een regeling opgenomen betreffende de bevoegdheden van de rector, de directeur, de
      conrector en de adjunct-directeur en indien toepassing is gegeven aan [artikel 32a][ref2] van de bevoegdheden van
      de centrale directie, met betrekking tot de toedeling, bestemming en aanwending van de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 32c.2
    text: |-
      Het managementstatuut bevat tevens de aanduiding van de andere aan het bevoegd gezag bij wettelijk voorschrift
      toegekende taken en bevoegdheden waarvan het bevoegd gezag heeft bepaald dat de rector, de directeur, de conrector,
      de adjunct-directeur of de centrale directie van de school deze in naam van het bevoegd gezag kan uitoefenen. Het
      managementstatuut bevat voorts instructies ten aanzien van deze taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32c
  - number: 32c.3
    text: 'In het managementstatuut worden tevens vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32c
  - number: 32c.3.a
    text: |-
      de taken en bevoegdheden die het bestuur overdraagt aan de centrale directie, de rector en de directeur van de
      school, indien toepassing is gegeven aan [artikel 32b1, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32b1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 32b1
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 32c.3.b
    text: |-
      de taken en bevoegdheden die de centrale directie, de rector en de directeur van de school hebben overgedragen aan
      elkaar of aan de adjunct-directeur, indien toepassing is gegeven aan [artikel 32b1, tweede lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32b1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 32b1
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 32c.3.c
    text: de richtlijnen voor de uitoefening van de overgedragen taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32c
  - number: 32c.4
    text: |-
      Het bevoegd gezag stelt het managementstatuut, alsmede elke wijziging daarvan, zo spoedig mogelijk na de
      vaststelling op een voor eenieder toegankelijke wijze beschikbaar.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32c
  - number: 32d
    text: Het bevoegd gezag streeft evenredige vertegenwoordiging van vrouwen in leidinggevende posities na.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32d
  - number: 32e.1
    text: |-
      Onder het beroep van leraar wordt verstaan het binnen de kaders van het onderwijskundig beleid van de school,
      verantwoordelijkheid dragen voor het vakinhoudelijke, vakdidactische en pedagogische proces in de school.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32e
  - number: 32e.2
    text: |-
      Leraren komt een zelfstandige verantwoordelijkheid toe als het gaat om het beoordelen van de onderwijsprestaties
      van leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32e
  - number: 32e.3
    text: |-
      Leraren beschikken over voldoende vakinhoudelijke, vakdidactische en pedagogische zeggenschap, waaronder wordt
      verstaan de zeggenschap over:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32e
  - number: 32e.3.a
    text: de inhoud van de lesstof;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32e
  - number: 32e.3.b
    text: de wijze waarop de lesstof wordt aangeboden en de middelen die daarbij worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32e
  - number: 32e.3.c
    text: |-
      de te hanteren pedagogisch-didactische aanpak op de school en de wijze waarop daar uitvoering aan wordt gegeven,
      waaronder de begeleiding van de leerlingen en de contacten met de ouders;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32e
  - number: 32e.3.d
    text: |-
      het in samenhang met de onderdelen a, b en c, onderhouden van de bekwaamheid van de leraren als onderdeel van het
      team.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32e
  - number: 32e.4
    text: |-
      Het bevoegd gezag stelt in overleg met de leraren een professioneel statuut op waarin de afspraken zijn opgenomen
      over de wijze waarop de zeggenschap van leraren als bedoeld in het derde lid wordt georganiseerd. Bij het opstellen
      van het professioneel statuut wordt de professionele standaard van de beroepsgroep in acht genomen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel32e
  - number: '33.1'
    text: |-
      Leraren worden door het bevoegd gezag benoemd dan wel tewerkgesteld zonder benoeming. Om tot leraar te kunnen
      worden benoemd of tewerkgesteld zonder benoeming dient de betrokkene:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
  - number: 33.1.a
    text: |-
      in het bezit te zijn van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1], die op het tijdstip van overlegging aan het bevoegd gezag
      niet ouder is dan 6 maanden,


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
