        artikel: '27'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '58.6'
    text: |-
      [Artikel 23a1][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel58
    references:
