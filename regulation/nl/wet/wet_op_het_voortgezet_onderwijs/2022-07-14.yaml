        afdeling: I
  - number: '56.3'
    text: Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel56
  - number: '57'
    text: |-
      De aanwijzing geschiedt op een daartoe tot Onze Minister gerichte aanvraag van het schoolbestuur. Bij de aanvraag
      worden overgelegd:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel57
  - number: 57.a
    text: het schoolplan van de school;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel57
  - number: 57.b
    text: bewijsstukken dat wordt voldaan aan de bekwaamheidseisen;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel57
  - number: 57.c
    text: de statuten en het reglement van de rechtspersoon met volledige rechtsbevoegdheid, die de school in stand houdt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel57
  - number: '58.1'
    text: |-
      Het schoolplan van een ingevolge [artikel 56][ref1] aangewezen school voldoet ten minste aan de voorschriften,
      gegeven bij of krachtens de [artikelen 6g][ref2], [6g1][ref3], [10][ref4], [10b][ref5], [10d][ref6],
      [11a tot en met 11f][ref7], [12 tot en met 15][ref8], [17][ref9] en [24][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel6g1
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10
