    text: |-
      met inachtneming van [artikel 33, eerste lid, onderdeel b][ref1], kan worden benoemd of tewerkgesteld zonder
      benoeming tot leraar in een van de vakken die aan de school worden onderwezen, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel34
