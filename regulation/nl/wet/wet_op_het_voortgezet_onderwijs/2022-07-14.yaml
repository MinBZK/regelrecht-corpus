        artikel: 118g
  - number: 58a.1
    text: |-
      Het bevoegd gezag van een ingevolge [artikel 56][ref1] aangewezen school kan leerlingen
      in de gelegenheid stellen in het kader van het onderwijs waarvoor zij aan de school zijn
      ingeschreven deel te nemen aan een opleiding voortgezet algemeen volwassenenonderwijs als
      bedoeld in [artikel 7.3.1, eerste lid, onder a, van de Wet educatie en beroepsonderwijs][ref2]
      aan een instelling waarvoor wat betreft genoemde opleiding toepassing is gegeven aan
      [artikel 1.4a.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref3], en die opleiding met een examen af
      te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '56'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 58a.2
    text: |-
      Het eerste lid vindt uitsluitend toepassing met het doel leerlingen met bijzondere kenmerken beter in staat te
      stellen een diploma als bedoeld in deze wet te behalen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel58a
  - number: 58a.3
    text: |-
      Toepassing van het eerste lid berust op een samenwerkingsovereenkomst, gesloten tussen het bevoegd gezag, bedoeld
      in het eerste lid, en het bevoegd gezag van de in het eerste lid bedoelde instelling. De samenwerkingsovereenkomst
      omvat in elk geval:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel58a
  - number: 58a.3.a
    text: doel van de samenwerking,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel58a
  - number: 58a.3.b
    text: de doelgroep,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel58a
  - number: 58a.3.c
    text: de wijze waarop wordt nagegaan of het doel wordt bereikt,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel58a
  - number: 58a.3.d
    text: het onderwijsprogramma dat volgens de samenwerking wordt vormgegeven, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel58a
  - number: 58a.3.e
    text: een regeling voor de beslechting van geschillen tussen partijen over de uitvoering van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel58a
  - number: 58a.4
    text: |-
      Bij algemene maatregel van bestuur wordt nader geregeld voor welke leerlingen en onder welke voorwaarden het eerste
      lid toepassing kan vinden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel58a
  - number: 58b.1
    text: |-
      Het bevoegd gezag van een ingevolge [artikel 56][ref1] aangewezen school kan leerlingen in het kader van het
      onderwijs waarvoor zij aan die school zijn ingeschreven in de gelegenheid stellen een doorlopende leerroute
      vmbo-mbo als bedoeld in [artikel 10b10][ref2] of de geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in
      [artikel 10b21][ref3] te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b10
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10b21
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel58b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '56'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b10
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10b21
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 58b.2
    text: |-
      Toepassing van het eerste lid berust op een samenwerkingsovereenkomst, gesloten tussen het
      bevoegd gezag, bedoeld in het eerste lid, en het bevoegd gezag van een instelling als bedoeld in
      [artikel 1.4.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel58b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 58b.3
    text: |-
      De [artikelen 10b10][ref1], [10b11, met uitzondering van het tweede lid, onderdeel e][ref2],
      [10b12 tot en met 10b14][ref3], [10b15, eerste en tweede lid][ref4], [10b16][ref5] en [10b19 tot en met 10b21][ref6]
      zijn van overeenkomstige toepassing, met dien verstande dat voor «instelling voor beroepsonderwijs» telkens wordt
      gelezen «instelling als bedoeld in [artikel 1.4.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref7]».


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b10
