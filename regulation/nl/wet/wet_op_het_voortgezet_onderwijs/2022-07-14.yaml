  - number: 34.1.d
    text: |-
      in het bezit is van een ten aanzien van de door hem te verrichten al dan niet in [artikel 36, tweede lid][ref1],
      bedoelde werkzaamheden verleende erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
