        artikel: '80'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
  - number: 118ll.5
    text: |-
      Het herverdeeleffect, bedoeld in het tweede lid, wordt per bevoegd gezag éénmalig vastgesteld. De bekostiging,
      bedoeld in het derde en vierde lid, die op grond van dit herverdeeleffect wordt vastgesteld, kan volgens bij
      ministeriele regeling te stellen regels worden aangepast aan loon-en prijsontwikkelingen, tenzij de toestand van ’s
      Rijks financiën zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118ll
  - number: 118ll.6
    text: |-
      Dit artikel is niet van toepassing op scholen ten aanzien waarvan door Onze Minister toepassing is gegeven aan
      [artikel 108, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel108
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118ll
    references:
