        afdeling: I
  - number: 109a.2
    text: |-
      Indien de toepassing van het eerste lid er toe zou leiden dat een school nog slechts onderwijs zou verzorgen in de
      eerste twee leerjaren dan is het eerste lid van toepassing op de gehele school.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel109a
  - number: 109a.3
    text: 'Alvorens Onze Minister toepassing geeft aan het eerste en tweede lid:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel109a
  - number: 109a.3.a
    text: |-
      heeft de inspectie een onderzoek als bedoeld in [artikel 11, derde lid, van de Wet op het onderwijstoezicht][ref1]
      verricht en heeft de inspectie Onze Minister meegedeeld dat het bevoegd gezag naar aanleiding van dit onderzoek
      niet bereid is afspraken te maken over verbeteringen dan wel dat uit het onderzoek naar de verbeteringen, bedoeld
      in artikel 11, vierde lid, van de Wet op het onderwijstoezicht blijkt dat sprake is van onvoldoende verbeteringen;


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
  - number: 109a.3.b
    text: |-
      heeft de inspectie daarover een inspectierapport als bedoeld in
      [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref1] uitgebracht; en


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
