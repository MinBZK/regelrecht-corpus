      stelt Onze Minister het bevoegd gezag vervolgens vier weken in de gelegenheid zijn zienswijze met betrekking tot de
      voorgenomen opheffing of de voorgenomen beëindiging van de bekostiging naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel109a
  - number: 109a.4
    text: |-
      Op een schoolsoort of leerweg die minder dan 2 schooljaren wordt bekostigd en waarvan de kwaliteit van het onderwijs
      in deze periode zeer zwak is, bedoeld in [artikel 23a1, eerste lid, zijn het eerste, tweede en derde lid][ref1] van
      overeenkomstige toepassing, indien het bevoegd gezag:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel109a
