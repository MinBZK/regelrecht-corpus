$id: wet_op_het_voortgezet_onderwijs
regulatory_layer: WET
publication_date: '2024-03-27'
valid_from: '2022-07-14'
bwb_id: BWBR0002399
url: https://wetten.overheid.nl/BWBR0002399/2022-07-14
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter verkrijging van een samenhangend geheel van
    onderwijsvoorzieningen het voortgezet onderwijs in een wet te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder: «Onze Minister»: Onze Minister van Onderwijs, Cultuur en Wetenschap; «de inspectie»: de
      inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref1]; «voortgezet onderwijs»: het voortgezet onderwijs,
      bedoeld in [artikel 2][ref2]; «school»: een school voor voortgezet onderwijs, tenzij het tegendeel blijkt;
      «openbare school»: a. een school in stand gehouden door een gemeente, dan wel door een openbaar lichaam, ingesteld
      bij een gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref3], waarin deelnemen
      een of meer gemeenten, al dan niet te zamen met een of meer privaatrechtelijke rechtspersonen met volledige
      rechtsbevoegdheid; b. een door een openbare rechtspersoon als bedoeld in [artikel 42a][ref4] in stand gehouden
      school; c. een door een stichting als bedoeld in [artikel 42b][ref5] of [artikel 53c][ref6] in stand gehouden
      school; «bijzondere school»: een door een natuurlijke persoon of door een privaatrechtelijke rechtspersoon,
      niet zijnde een stichting als bedoeld in [artikel 42b][ref7], in stand gehouden school; «scholengemeenschap»:
      een gemeenschap van twee of meer scholen voor voortgezet onderwijs; «verticale scholengemeenschap»: verticale
      scholengemeenschap als bedoeld in [artikel 2.6.1 van de Wet educatie en beroepsonderwijs][ref8]; «openbare
      rechtspersoon»: een rechtspersoon die krachtens publiekrecht is ingesteld als bedoeld in [artikel 42a][ref9];
      «het bevoegd gezag» : voor wat betreft: a. een openbare school: 1°. het college van burgemeester en wethouders,
      voor zover de raad niet anders bepaalt, en, indien de raad dit besluit, met inachtneming van door hem te stellen
      regelen; 2°. het krachtens de desbetreffende gemeenschappelijke regeling bevoegde orgaan; 3°. de openbare
      rechtspersoon, bedoeld in [artikel 42a][ref10]; dan wel 4°. de stichting, bedoeld in [artikel 42b][ref11] of
      [artikel 53c][ref12]; b. een bijzondere school: de rechtspersoon, bedoeld in [artikel 49, eerste lid][ref13];
      c. een samenwerkingsschool: de stichting, bedoeld in [artikel 53d][ref14]; «regionaal opleidingencentrum»: een
      regionaal opleidingencentrum als bedoeld in [artikel 1.3.1 van de Wet educatie en beroepsonderwijs][ref15];
      «agrarisch opleidingscentrum»: een agrarisch opleidingscentrum als bedoeld in
      [artikel 1.3.3 van de Wet educatie en beroepsonderwijs][ref16]; «burgerservicenummer»: burgerservicenummer
      als bedoeld in [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref17];
      «persoonsgebonden nummer»: het burgerservicenummer dan wel het door Onze Minister uitgegeven onderwijsnummer,
      bedoeld in [artikel 27b, vierde lid][ref18]; «contractactiviteiten»: activiteiten als bedoeld in
      [artikel 20, tweede lid][ref19]; «personeel»: a. de benoemde rector, directeur, conrector, adjunct-
      directeur of leraar, en overig personeel benoemd in een andere functie dan het geven van onderwijs,
      waaronder begrepen de leden van het bestuur van die scholen die zijn benoemd door een raad van toezicht
      als bedoeld in [artikel 24e1, derde lid][ref20], voor zover die leden mede zijn benoemd op basis van een
      arbeidsovereenkomst; b. het onder a bedoelde personeel dat zonder benoeming is tewerkgesteld, tenzij het
      betreft de toepassing van de [artikelen 38a tot en met 39a1][ref21], [40a][ref22], [53b][ref23] en [96o][ref24],
      voor zover niet anders is bepaald, en de toepassing van daarmee verband houdende wettelijke bepalingen;
      «nascholing»: een vorm van scholing, gegeven aan leden van het personeel om hun kennis, inzicht, vaardigheden
      en beroepshoudingen direct verband houdend met de uitoefening van hun beroep, voortbouwend op de in de
      initiële opleiding verworven aanvangsbekwaamheid te verdiepen en uit te breiden; «kerndoelen»: de op grond
      van [artikel 11b][ref25] vastgestelde na te streven inhoudelijke doelstellingen voor het onderwijsprogramma
      voor de eerste twee leerjaren, bedoeld in [artikel 11c][ref26], gericht op het verwerven door leerlingen
      van kennis, inzicht en vaardigheden; «ho-student»: degene die hoger onderwijs volgt, als bedoeld in
      [artikel 1.1, onderdeel b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref27]; «mbo-student»:
      student als bedoeld in [artikel 1.1.1, onderdeel n2, van de Wet educatie en beroepsonderwijs][ref28]; «vavo-
      student»: vavo-student als bedoeld in [artikel 1.1.1, onderdeel n4, van de Wet educatie en beroepsonderwijs][ref29];
      maatschappelijke stage: stage gericht op het verwerven van vaardigheden ten behoeve van het functioneren
      in de maatschappij, bestaande uit onbezoldigde vrijwilligersactiviteiten, niet zijnde de stage bedoeld
      in [artikel 22, derde lid, onderdeel b][ref30]; «College voor toetsen en examens»: het College voor
      toetsen en examens, bedoeld in [artikel 2, eerste lid, van de Wet College voor toetsen en examens][ref31];
      register onderwijsdeelnemers: register onderwijsdeelnemers als bedoeld in
      [artikel 4 van de Wet register onderwijsdeelnemers][ref32]; «schoolondersteuningsprofiel»: een
      beschrijving van de voorzieningen die zijn getroffen voor leerlingen die extra ondersteuning behoeven;
      «samenwerkingsverband»: een samenwerkingsverband als bedoeld in [artikel 17a, tweede lid][ref33] of
      een landelijk samenwerkingsverband als bedoeld in artikel 17a, zestiende lid, tenzij het tegendeel
      blijkt; «lerarenregister»: lerarenregister als bedoeld in [artikel 41a][ref34]; «registervoorportaal»:
      registervoorportaal als bedoeld in [artikel 41o][ref35]; «basisgegevens»: gegevens als bedoeld in
      [artikel 41f, eerste lid, onderdelen a tot en met d][ref36]; «belangstellingsmeting»: de belangstellingsmeting,
      bedoeld in [artikel 68][ref37]; «instelling voor beroepsonderwijs»: instelling als bedoeld in
      [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref38], waaraan beroepsonderwijs als bedoeld
      in [artikel 1.2.1, tweede lid, van die wet][ref39] wordt verzorgd; «opleidingsdomein»: opleidingsdomein als bedoeld
      in [artikel 1.1.1, onderdeel t2, van de Wet educatie en beroepsonderwijs][ref40]; «beroepsopleiding»: opleiding
      als bedoeld in [artikel 7.1.2, tweede lid, van de Wet educatie en beroepsonderwijs][ref41]; «kwalificatie»:
      de kwalificatie, bedoeld in [artikel 7.1.3, eerste lid, van de Wet educatie en beroepsonderwijs][ref42];
      «entreeopleiding»: entreeopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref43];
      «basisberoepsopleiding»: basisberoepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel b, van de Wet educatie en beroepsonderwijs][ref44]; «vakopleiding»:
      vakopleiding als bedoeld in [artikel 7.2.2, eerste lid, onderdeel c, van de Wet educatie en beroepsonderwijs][ref45];
      «middenkaderopleiding»: middenkaderopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel d, van de Wet educatie en beroepsonderwijs][ref46];
      «begeleide onderwijsuren»: begeleide onderwijsuren als bedoeld in
      [artikel 7.2.7, zesde lid, van de Wet educatie en beroepsonderwijs][ref47], met dien verstande dat ten aanzien
      van het eerste en tweede leerjaar van een doorlopende leerroute vmbo-mbo onder «begeleide onderwijsuren» mede
      wordt verstaan «onderwijstijd» als bedoeld in [artikel 6g][ref48]; «beroepspraktijkvorming»: het onderricht in de
      praktijk van het beroep, bedoeld in [artikel 7.2.8, eerste lid, van de Wet educatie en beroepsonderwijs][ref49].


