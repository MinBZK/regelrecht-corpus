  - number: 118ta
    text: |-
      In deze afdeling wordt verstaan onder: - *leerplichtige ontheemde jongere:* jongere als bedoeld in
      [artikel 2, eerste lid van de Leerplichtwet 1969][ref1] op wie [artikel 5 van die wet][ref2] niet van toepassing is
      en op wie de tijdelijke bescherming van toepassing is van artikel 2 van het Uitvoeringsbesluit, of artikel 7 van de
      Richtlĳn van toepassing is of is geweest;
        - *Richtlijn:* Richtlĳn 2001/55/EG van de Raad van 20 juli 2001 betreffende minimumnormen voor het verlenen van
      tĳdelĳke bescherming in geval van massale toestroom van ontheemden en maatregelen ter bevordering van een evenwicht
      tussen de inspanning van de lidstaten voor de opvang en het dragen van de consequenties van de opvang van deze
      personen (PbEU 2001, L 212);
        - *tijdelijke onderwijsvoorziening:* tijdelijke school of tijdelijke uitbreiding van een school, niet zijnde
      een school voor praktijkonderwijs, gericht op het geven of doen geven van onderwijs aan leerplichtige ontheemde
      jongeren met als doel een zo spoedig mogelijke doorstroom van leerlingen naar een school voor voortgezet onderwijs,
      school voor voortgezet speciaal onderwijs of een school voor speciaal en voortgezet speciaal onderwijs, niet zijnde
      een tijdelijke onderwijsvoorziening;
        - *Uitvoeringsbesluit:* Uitvoeringsbesluit (EU) 2022/382 van de Raad van 4 maart 2022 tot vaststelling van het
      bestaan van een massale toestroom van ontheemden uit Oekraïne in de zin van artikel 5 van [Richtlijn 2001/55/EG]
      (32001L0055), en tot invoering van tijdelijke bescherming naar aanleiding daarvan (PbEU 2022, L 071).


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118ta
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '5'
  - number: 118tb.1
    text: Het bevoegd gezag kan een tijdelijke onderwijsvoorziening inrichten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tb
  - number: 118tb.2
    text: Het bevoegd gezag meldt de inrichting van een tijdelijke onderwijsvoorziening onverwijld bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tb
  - number: 118tb.3
    text: |-
      Na een melding als bedoeld in het tweede lid, stelt het bevoegd gezag binnen twee maanden een inrichtingsplan op
      voor de tijdelijke onderwijsvoorziening en zendt het plan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tb
  - number: 118tb.4
    text: 'Het inrichtingsplan, bedoeld in het derde lid, bevat in ieder geval een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tb
  - number: 118tb.4.a
    text: de wijze waarop de tijdelijke onderwijsvoorziening zal worden ingericht;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tb
  - number: 118tb.4.b
    text: |-
      de wijze waarop de tijdelijke onderwijsvoorziening voortgezet onderwijs geeft met als doel een zo spoedig mogelijke
      doorstroom van leerlingen naar een school voor voortgezet onderwijs, een school voor voortgezet speciaal onderwijs
      of een school voor speciaal en voortgezet speciaal onderwijs, niet zijnde het onderwijs gegeven in een tijdelijke
      onderwijsvoorziening;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tb
  - number: 118tb.4.c
    text: |-
      de wijze waarop ten aanzien van de tijdelijke onderwijsvoorziening zal worden voldaan aan de zorgplicht, bedoeld
      in [artikel 3b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel3b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tb
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 3b
  - number: 118tb.4.d
    text: |-
      het personeelsbeleid, bedoeld in [artikel 24, derde lid][ref1], voor zover dat betrekking heeft op de tijdelijke
      onderwijsvoorziening;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tb
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 118tb.4.e
    text: |-
      de invulling van het onderwijsprogramma, bedoeld in [artikel 118tc][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118tc
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tb
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118tc
        afdeling: II
  - number: 118tb.5
    text: Bij de inrichting van het onderwijs wijkt het bevoegd gezag niet af van het inrichtingsplan.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tb
  - number: 118tb.6
    text: Het derde lid is van overeenkomstige toepassing op de wijziging van het inrichtingsplan.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tb
  - number: 118tb.7
    text: |-
      Het eerste lid is niet van toepassing op een school waarvan de kwaliteit van het onderwijs zeer zwak is als bedoeld
      in [artikel 23a1, eerste en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tb
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23a1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 118tb.8
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de melding, bedoeld in het tweede lid, en over het
      inrichtingsplan, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tb
  - number: 118tc.1
    text: |-
      Het bevoegd gezag stelt voor de tijdelijke onderwijsvoorziening de inhoud van het onderwijs vast in een
      onderwijsprogramma, dat in ieder geval:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tc
  - number: 118tc.1.a
    text: |-
      het ononderbroken ontwikkelingsproces van de leerlingen bevordert en borgt dat zij kunnen doorstromen naar een
      school voor voortgezet onderwijs, school voor voortgezet speciaal onderwijs of school voor speciaal en voortgezet
      speciaal onderwijs, niet zijnde een tijdelijke onderwijsvoorziening;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tc
  - number: 118tc.1.b
    text: |-
      actief burgerschap en sociale cohesie bevordert als bedoeld in [artikel 17][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tc
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '17'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 118tc.1.c
    text: |-
      zo veel mogelijk gericht is op de inhoud van het onderwijs, bedoeld in [artikel 11b][ref1], waarbij in ieder geval
      altijd aandacht wordt besteed aan:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tc
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 118tc.1.c.1°
    text: Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tc
  - number: 118tc.1.c.2°
    text: wiskunde;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tc
  - number: 118tc.1.c.3°
    text: lichamelijke opvoeding;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tc
  - number: 118tc.1.d
    text: het sociaal en emotioneel welbevinden van de leerlingen bevordert.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tc
  - number: 118tc.2
    text: |-
      Het bevoegd gezag beschikt over geordende gegevens over de invulling en spreiding van de uren in de tijdelijke
      onderwijsvoorziening.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tc
  - number: 118tc.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inhoud van het onderwijsprogramma, waarbij kan
      worden afgeweken van [titel II, afdeling I, hoofdstuk I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tc
    references:
      - id: ref1
        bwb_id: BWBR0002399
        hoofdstuk: I
        afdeling: I
  - number: 118td.1
    text: |-
      Een tijdelijke onderwijsvoorziening kan geen nevenvestiging zijn als bedoeld in [artikel 73b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel73b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118td
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 73b
        paragraaf: '2'
        afdeling: I
  - number: 118td.2
    text: |-
      Een tijdelijke onderwijsvoorziening kan een tijdelijke nevenvestiging zijn als bedoeld in
      [artikel 73d, eerste lid][ref1], met dien verstande dat, in afwijking van artikel 73d:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel73d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118td
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 73d
        paragraaf: '2'
        afdeling: I
  - number: 118td.2.a
    text: |-
      de tijdelijke nevenvestiging gelegen kan zijn op een afstand van meer dan drie kilometer van de hoofdvestiging
      of nevenvestiging;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118td
  - number: 118td.2.b
    text: |-
      het bevoegd gezag van een school binnen vier weken na de ingebruikname van de tijdelijke nevenvestiging voor een
      tijdelijke onderwijsvoorziening van die ingebruikname kennis dient te geven aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118td
  - number: 118td.3
    text: |-
      In afwijking van [artikel 73e][ref1] blijft de aanspraak op bekostiging van een tijdelijke onderwijsvoorziening
      die tevens een tijdelijke nevenvestiging is ook bestaan als de afstand als bedoeld in dat artikel groter is dan
      drie kilometer.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel73e
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118td
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 73e
        paragraaf: '2'
        afdeling: I
  - number: 118te.1
    text: |-
      Indien een vacature voor het geven van onderwijs in een tijdelijke onderwijsvoorziening niet kan worden vervuld
      door de benoeming of de tewerkstelling zonder benoeming van een bevoegde leraar als bedoeld in [artikel 2a][ref1],
      kan het onderwijs niet langer dan strikt noodzakelijk en voor ten hoogste twee jaren ook worden verzorgd door
      iemand die nog niet voldoet aan de bekwaamheidseisen, bedoeld in [artikel 36][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118te
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 118te.2
    text: |-
      Het bevoegd gezag draagt zorg voor schriftelijke afspraken met degene, bedoeld in het eerste lid, waarin wordt
      verklaard dat betrokkene zich inspant om binnen twee jaren alsnog te voldoen aan de bekwaamheidseisen, bedoeld
      in [artikel 36][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118te
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 118te.3
    text: 'Het eerste lid is niet van toepassing op het onderwijs in:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118te
  - number: 118te.3.1
    text: Nederlands;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118te
  - number: 118te.3.2
    text: wiskunde;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118te
  - number: 118te.3.3
    text: lichamelijke opvoeding;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118te
  - number: 118te.3.4
    text: actief burgerschap en sociale cohesie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118te
  - number: 118te.4
    text: |-
      Het bevoegd gezag legt ten aanzien van elke leraar in een tijdelijke onderwijsvoorziening vast over welke opleiding
      en ervaring degene die wordt benoemd of tewerkgesteld beschikt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118te
  - number: 118te.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118te
  - number: 118tf.1
    text: Het onderwijs aan een tijdelijke onderwijsvoorziening kan op afstand worden verzorgd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tf
  - number: 118tf.2
    text: |-
      Voor zover de aard van het afstandsonderwijs zich daar niet tegen verzet, is het bepaalde bij of krachtens deze wet
      ook van toepassing op het afstandsonderwijs
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tf
  - number: 118tf.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het afstandsonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tf
  - number: 118tg
    text: |-
      Bij ministeriële regeling kunnen, zo nodig in afwijking van hetgeen bij of krachtens deze wet is bepaald, voor een
      tijdelijke onderwijsvoorziening regels worden gesteld over:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tg
  - number: 118tg.a
    text: het doorstroomperspectief;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tg
  - number: 118tg.b
    text: |-
      het schoolplan, bedoeld in [artikel 24][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tg
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 118tg.c
    text: |-
      de schoolgids, bedoeld in [artikel 24a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tg
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 24a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 118tg.d
    text: activiteiten voor leerlingen met een grote achterstand in de Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tg
  - number: 118tg.e
    text: de plaatsing van leerlingen op een tijdelijke onderwijsvoorziening.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118tg
  - number: 118th
    text: |-
      Een krachtens deze afdeling vast te stellen ministeriële regeling wordt niet eerder vastgesteld dan twee weken
      nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118th
  - number: 118u.1
    text: |-
      Personen die in het bezit zijn van een getuigschrift, afgegeven krachtens de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], waaruit blijkt dat ten aanzien van het vak
      omgangskunde is voldaan aan de bekwaamheidseisen die zijn vastgesteld krachtens [artikel 36, eerste lid][ref2],
      zijn tevens benoembaar of tewerkstelbaar zonder benoeming voor het geven van praktijkonderwijs als bedoeld
      in [artikel 10f][ref3] en voor het geven van onderwijs aan groepen van uitsluitend geïndiceerde leerlingen in
      het leerwegondersteunend onderwijs, bedoeld in [artikel 10e][ref4], in de vakken Nederlands, Engels, wiskunde,
      geschiedenis, aardrijkskunde, biologie (incl. kennis der natuur), verzorging, muziek, handvaardigheid (textiele
      werkvormen) en tekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10e
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118u
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 10e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 118u.2
    text: 'Het eerste lid is uitsluitend van toepassing ten aanzien van personen die:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118u
  - number: 118u.2.a
    text: het in het eerste lid bedoelde getuigschrift hebben behaald na 1 augustus 2006;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118u
  - number: 118u.2.b
    text: |-
      voor 1 september 2012 zijn gestart met de opleiding tot leraar voortgezet onderwijs van de tweede graad in het vak
      omgangskunde aan de Fontys Hogeschool Tilburg, de NHL Hogeschool, de Hogeschool Leiden of de Hogeschool Utrecht; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118u
  - number: 118u.2.c
    text: |-
      uiterlijk op 31 augustus 2016 met goed gevolg de aanvullende opleiding «Leergang omgangskunde in praktijkonderwijs
      en leerwegondersteunend onderwijs» met een omvang van ten minste 420 uren studie hebben afgerond aan een van de in
      onderdeel b genoemde hogescholen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118u
  - number: 118v.1
    text: |-
      Het samenwerkingsverband stelt voor de voorschriften in
      [artikel 17a, achtste lid, onderdelen a, b, c, e en f][ref1], en [artikel 17a1, eerste en tweede lid][ref2], voor
      zover deze betrekking hebben op het beoordelen of een leerling is aangewezen op het leerwegondersteunend onderwijs
      en het toelaatbaar verklaren van leerlingen tot het praktijkonderwijs, een eerste ondersteuningsplan op, in
      aanvulling op het ondersteuningsplan bedoeld in artikel 17a, achtste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118v
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 17a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 17a1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 118v.2
    text: |-
      Het eerste ondersteuningsplan, bedoeld in het eerste lid, wordt op de datum van inwerkingtreding van dit artikel,
      aan de ondersteuningsplanraad voorgelegd. De ondersteuningsplanraad spreekt zich binnen vier weken nadat het
      voorstel is voorgelegd, uit over dit voorstel.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118v
  - number: 118v.3
    text: |-
      Indien aan het te nemen besluit van het samenwerkingsverband op het ondersteuningsplan, bedoeld in het eerste lid,
      de instemming door de ondersteuningsplanraad is onthouden, wordt het voorstel door het samenwerkingsverband binnen
      twee weken voorgelegd aan de commissie voor geschillen, bedoeld in de Wet medezeggenschap op scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118v
  - number: 118v.4
    text: |-
      De commissie voor geschillen, bedoeld in [artikel 30 van de Wet medezeggenschap op scholen][ref1],
      doet binnen vier weken uitspraak in geschillen over het voorstel van het ondersteuningsplan,
      bedoeld in het eerste lid. Van de uitspraak, bedoeld in de eerste volzin, staat, in afwijking van
      [artikel 36 van de Wet medezeggenschap op scholen][ref2], geen beroep open bij de Ondernemingskamer van het
      gerechtshof te Amsterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118v
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '36'
  - number: 118v.5
    text: |-
      In afwijking van [artikel 17a, tiende lid][ref1], stuurt het samenwerkingsverband uiterlijk 16 weken volgend op de
      periode genoemd in het tweede lid, eerste volzin, het ondersteuningsplan aan de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118v
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 17a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 118v.6
    text: |-
      Op het eerste ondersteuningsplan, bedoeld in het eerste lid, is [artikel 17a, negende lid][ref1], niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118v
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 17a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 118w
    text: |-
      Voor scholen die leerwegondersteunend onderwijs aanbieden, is [artikel 79a][ref1] van overeenkomstige toepassing
      voor de bekostiging van leerlingen voor wie de regionale verwijzingscommissie heeft bepaald dat zij op dat
      onderwijs zijn aangewezen op grond van [artikel 10e][ref2], zoals dat luidde op 31 december 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel79a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10e
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118w
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 79a
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 118y.1
    text: |-
      Voor leerlingen die op de datum van inwerkingtreding van artikel I, onderdelen C en D van de Wet tot wijziging
      van de Wet op het voortgezet onderwijs in verband met de integratie van het leerwegondersteunend onderwijs
      en praktijkonderwijs in het systeem van passend onderwijs (Integratie lwoo en pro in passend onderwijs)
      (Stb. 2015, 149) door een regionale verwijzingscommissie zijn geïndiceerd voor leerwegondersteunend onderwijs of
      praktijkonderwijs op grond van [artikel 10e][ref1], respectievelijk [10g][ref2], van deze wet zoals die luidden
      op de dag voor die inwerkingtreding van artikel I, onderdelen A en B, van die wet, blijft de indicatie gelden na
      inwerkingtreding van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10e
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10g
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118y
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10g
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 118y.2
    text: |-
      In afwijking van het eerste lid, geldt de indicatie van de in het eerste lid bedoelde leerlingen die voor het
      eerst met ingang van het eerstvolgende schooljaar na inwerkingtreding van de Wet tot wijziging van de Wet op het
      voortgezet onderwijs in verband met de integratie van het leerwegondersteunend onderwijs en praktijkonderwijs in
      het systeem van passend onderwijs (Integratie lwoo en pro in passend onderwijs) (Stb. 2015, 149) gebruik maken van
      de indicatie, tot de datum van inwerkingtreding van artikel I, onderdelen C en D, van die wet.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118y
  - number: 118dd.1
    text: |-
      Een school voor bijzonder onderwijs die op of na 1 juni 2006 is samengevoegd met een school voor openbaar
      onderwijs dan wel een school voor openbaar onderwijs die op of na 1 juni 2006 is samengevoegd met een school
      voor bijzonder onderwijs kan voor bekostiging in aanmerking worden gebracht als samenwerkingsschool als bedoeld
      in [artikel 53d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118dd
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53d
        hoofdstuk: IV
        afdeling: I
  - number: 118dd.2
    text: |-
      Een verzoek om voor bekostiging in aanmerking te worden gebracht als samenwerkingsschool
      wordt uiterlijk twee volledige schooljaren na inwerkingtreding van de
      __REF000___________________________________________________________________________________________________________
      _______________________________________________________________________________________________ (Stb. 2017, 327)
      ingediend bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0039948
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118dd
    references:
      - id: ref1
        bwb_id: BWBR0039948
  - number: 118dd.3
    text: |-
      Onze Minister willigt het verzoek in indien ten tijde van de samenvoeging werd voldaan aan
      [artikel 53d, eerste tot en met derde lid][ref1], zoals dat artikel luidt na de inwerkingtreding van
      [artikel III, onderdeel E, van de in het tweede lid genoemde wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53d
      [ref2]: https://wetten.overheid.nl/BWBR0039948#ArtikelIII
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118dd
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53d
        hoofdstuk: IV
        afdeling: I
      - id: ref2
        bwb_id: BWBR0039948
        artikel: III
  - number: 118dd.4
    text: |-
      Dit artikel vervalt met ingang van 1 augustus van het vijfde schooljaar na inwerkingtreding van de in het tweede
      lid genoemde [wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039948
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118dd
    references:
      - id: ref1
        bwb_id: BWBR0039948
  - number: 118ee.1
    text: |-
      Toepassing van [artikel 69, eerste en tweede lid][ref1], zoals luidend ingevolge de Wet van 25 mei 2018 tot
      wijziging van onder meer de Wet op het voortgezet onderwijs en de Wet voortgezet onderwijs BES in verband met
      modernisering van de bepalingen over voorzieningenplanning (Stb. 2018, 156) leidt niet eerder dan 1 jaar na
      inwerkingtreding van het betrokken artikellid tot het vervallen van de aanspraak op bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel69
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118ee
    references:
