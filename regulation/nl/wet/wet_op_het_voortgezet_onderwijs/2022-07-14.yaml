        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 74b
        paragraaf: '3'
        afdeling: I
  - number: 118hh.1
    text: |-
      Op aanvragen die voor de datum van inwerkingtreding van artikel II, onderdeel E, van de Wet tot wijziging van
      diverse onderwijswetten door het wijzigen van de systematiek van het in aanmerking brengen voor bekostiging van
      nieuwe openbare en bijzondere scholen zodat er meer ruimte is voor een nieuw onderwijsaanbod (Wet meer ruimte voor
      nieuwe scholen) (Stb. 2020, 160) zijn ingediend op grond van [artikel 53g][ref1] blijft [artikel 53h][ref2] zoals
      dat artikel luidde op de dag voor de inwerkingtreding van die wet, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53g
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel53h
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118hh
