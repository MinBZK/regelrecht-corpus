  - number: 59a.2
    text: |-
      Ten aanzien van scholen waar toepassing is gegeven aan het eerste lid, zijn de
      [artikelen 10b1 tot en met 10b8][ref1], [10b9, eerste en tweede lid][ref2], en [10b10 tot en met 10b21][ref3] van
      overeenkomstige toepassing voor zover het betreft het voorbereidend beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b9
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel11
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b9
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '11'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 59a.3
    text: |-
      Onze Minister kan, onverminderd [artikel 59][ref1], de aanwijzing ingevolge het eerste lid intrekken indien niet
      langer wordt voldaan aan het eerste lid, tweede volzin, of het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel59
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '59'
        afdeling: II
  - number: 59a.4
    text: |-
      Ten aanzien van een op grond van het eerste lid aangewezen school kunnen bij algemene maatregel van bestuur
      onderscheidenlijk bij ministeriële regeling regels worden vastgesteld in afwijking van bij algemene maatregel van
      bestuur respectievelijk bij ministeriële regeling vastgestelde regels die gelden ingevolge het eerste en tweede
      lid, met dien verstande dat bij algemene maatregel van bestuur tevens kerndoelen kunnen worden vastgesteld in
      aanvulling op de kerndoelen die zijn vastgesteld op grond van [artikel 11b][ref1] van de Wet op het voortgezet
      onderwijs, waarbij tevens kan worden bepaald dat het onderwijs na de eerste twee leerjaren wordt verzorgd mede op
      basis van de kerndoelen die zijn vastgesteld op grond van dit lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 59a.5
    text: |-
      Ten aanzien van een op grond van het eerste lid aangewezen school kunnen provinciale staten van Fryslân bij
      verordening kerndoelen Friese taal en cultuur vaststellen in afwijking van de kerndoelen Friese taal en cultuur
      die zijn vastgesteld op grond van [artikel 11e][ref1], met dien verstande dat op die verordening artikel 11e van
      overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 59a.6
    text: |-
      Indien de aanvraag ingevolge het eerste lid, betrekking heeft op het voorbereidend beroepsonderwijs, geeft het
      bevoegd gezag aan in welke profielen, bedoeld in [artikel 10b, derde lid][ref1], het onderwijs wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '60.1'
    text: |-
      Jaarlijks geeft het College voor toetsen en examens gelegenheid om door het met gunstig gevolg afleggen van
      een staatsexamen, een diploma te verkrijgen, overeenkomende met een diploma van een school voor voorbereidend
      wetenschappelijk onderwijs, voor hoger algemeen voortgezet onderwijs , voor middelbaar algemeen voortgezet
      onderwijs en voor voorbereidend beroepsonderwijs, als bedoeld in [artikel 29, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: '60.2'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald, welke andere diploma's kunnen worden verkregen door het met
      gunstig gevolg afleggen van een staatsexamen voor het College voor toetsen en examens.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel60
  - number: '60.3'
    text: |-
      Zij, die zijn afgewezen bij het eindexamen van een school of een school als bedoeld in
      [artikel 1 van de Wet op de expertisecentra][ref1], worden niet toegelaten tot het in hetzelfde jaar te houden
      overeenkomstige staatsexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '1'
  - number: '60.4'
    text: De staatsexamens zijn openbaar, behoudens het schriftelijke gedeelte.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel60
  - number: '60.5'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in dit artikel bedoelde examens, die
      niet voor alle kandidaten dezelfde vakken en andere programma-onderdelen behoeven te omvatten. Daarbij kan worden
      bepaald het bedrag, dat voor de toelating tot deze examens verschuldigd is. Tevens kan daarbij worden bepaald dat
      dit bedrag is verschuldigd door het bevoegd gezag van een school ten aanzien waarvan toepassing is gegeven aan
      [artikel 29, lid 1a][ref1], of door het bevoegd gezag van een instelling ten aanzien waarvan toepassing is gegeven
      aan [artikel 6a.2.1 van de Wet educatie en beroepsonderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 6a
  - number: '60.6'
    text: Tegen een besluit inzake deelneming aan staatsexamens staat bezwaar open bij het College voor toetsen en examens.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel60
  - number: '60.7'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen van
      een bezwaarschrift vijf dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '60.8'
    text: |-
      In afwijking van [artikel 7:10, eerste, derde, vierde en vijfde lid, van de Algemene wet bestuursrecht][ref1]
      beslist het College voor toetsen en examens binnen twee weken na ontvangst van het bezwaarschrift. Het kan de
      beslissing voor ten hoogste twee weken verdagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '61.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen inrichtingen voor voortgezet onderwijs als bedoeld in
      [artikel 5, onderdeel e][ref1], worden aangewezen die voor bekostiging uit 's Rijks kas in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '5'
  - number: '61.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor de aangewezen inrichtingen voor voortgezet onderwijs
      voorschriften worden gegeven voor de toepassing van de bij of krachtens deze wet vastgestelde voorschriften over:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel61
  - number: 61.2.a
    text: de inrichting van het onderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel61
  - number: 61.2.b
    text: de examens,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel61
  - number: 61.2.c
    text: de rechtspositie van het personeel,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel61
  - number: 61.2.d
    text: de benoembaarheidsvereisten van het personeel, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel61
  - number: 61.2.e
    text: de aanvang, wijze en beëindiging van de bekostiging.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel61
  - number: '62'
    text: |-
      In deze afdeling worden de onder a tot en met d aangegeven schoolsoorten aangeduid met de daarbij vermelde
      afkortingen:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel62
  - number: 62.a
    text: 'vwo: voorbereidend wetenschappelijk onderwijs,'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel62
  - number: 62.b
    text: 'havo: hoger algemeen voortgezet onderwijs,'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel62
  - number: 62.c
    text: 'mavo: middelbaar algemeen voortgezet onderwijs,'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel62
  - number: 62.d
    text: 'vbo: voorbereidend beroepsonderwijs.'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel62
  - number: '63.1'
    text: |-
      Bekostiging uit ’s Rijks kas van een school of scholengemeenschap neemt geen aanvang dan krachtens de bepalingen
      van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel63
  - number: '63.2'
    text: |-
      [Artikel 4:32 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de bekostiging van scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '64.1'
    text: 'Onze Minister brengt een openbare of bijzondere school voor bekostiging in aanmerking indien het bevoegd gezag:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
  - number: 64.1.a
    text: 'met de belangstellingsmeting aannemelijk maakt dat deze school zal worden bezocht door ten minste:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
  - number: 64.1.a.1
    text: 390 leerlingen voor een school voor vwo;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
  - number: 64.1.a.2
    text: 325 leerlingen voor een school voor havo en 130 leerlingen voor een afdeling voor havo;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
  - number: 64.1.a.3
    text: 260 leerlingen voor een school voor mavo;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
  - number: 64.1.a.4
    text: |-
      260 leerlingen voor een school voor vbo met 1 profiel als bedoeld in [artikel 10b, derde lid][ref1],;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 64.1.a.5
    text: |-
      160 leerlingen voor elk profiel van een school voor vbo indien meer dan 1 profiel binnen de school voor bekostiging
      in aanmerking wordt gebracht; of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
  - number: 64.1.a.6
    text: 120 leerlingen voor een school voor praktijkonderwijs; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
  - number: 64.1.b
    text: |-
      voldoet aan de verplichtingen, bedoeld in [artikel 67, eerste en tweede lid][ref1] en
      [artikel 67a, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel67a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '67'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 67a
        paragraaf: '1'
        afdeling: I
  - number: '64.2'
    text: |-
      Onze Minister brengt een openbare of bijzondere scholengemeenschap voor bekostiging in aanmerking indien het
      bevoegd gezag:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
  - number: 64.2.a
    text: |-
      met de belangstellingsmeting aannemelijk maakt dat het aantal leerlingen van elk van de samenstellende scholen ten
      minste drie kwart zal bedragen van het daarvoor in het eerste lid, onder a, genoemde aantal; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
  - number: 64.2.b
    text: |-
      voldoet aan de verplichtingen, bedoeld in [artikel 67, eerste en tweede lid][ref1] en
      [artikel 67a, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel67a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '67'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 67a
        paragraaf: '1'
        afdeling: I
  - number: '64.3'
    text: |-
      Onze Minister brengt een school of scholengemeenschap die ontstaat na splitsing van een school of
      scholengemeenschap voor bekostiging in aanmerking indien wordt voldaan aan de verplichtingen die zijn vastgesteld:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
  - number: 64.3.a
    text: |-
      in [artikel 67, eerste lid, aanhef en onderdeel d, tweede en derde lid][ref1] en
      [artikel 67a, eerste lid, tweede lid, onderdelen b, c en d, en derde lid][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel67a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '67'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 67a
        paragraaf: '1'
        afdeling: I
  - number: 64.3.b
    text: 'bij ministeriële regeling, waarin deze verplichtingen in elk geval betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
  - number: 64.3.b.1
    text: |-
      het aantal leerlingen op de teldatum in het jaar voorafgaand aan de aanvraag van de te splitsen school of van een
      of meer van de samenstellende scholen van de te splitsen scholengemeenschap;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
  - number: 64.3.b.2
    text: |-
      het aantal leerlingen waarvan redelijkerwijs kan worden aangenomen dat deze na de splitsing de scholen of de
      samenstellende scholen van de scholengemeenschap zal bezoeken; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
  - number: 64.3.b.3
    text: |-
      de wijze waarop op basis van de statistische gegevens, onder meer verstrekt door het Centraal Bureau voor de
      Statistiek, aannemelijk wordt gemaakt dat op 1 januari van het elfde jaar na indiening van de aanvraag de scholen
      die na splitsing ontstaan, worden bezocht door ten minste het voor de desbetreffende schoolsoort in het eerste lid
      bedoelde aantal leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
  - number: '64.4'
    text: |-
      Onze Minister brengt een openbare school of scholengemeenschap waarvoor een aanvraag als bedoeld in
      [artikel 66, eerste of tweede lid][ref1], is ingediend voor bekostiging in aanmerking, indien voldaan is aan
      de verplichtingen in [artikel 67, eerste en tweede lid][ref2] en [artikel 67a, eerste en tweede lid][ref3], met
      uitzondering van een document waaruit blijkt dat de gemeente van de beoogde plaats van vestiging van de school of
      scholengemeenschap is gevraagd om te overleggen over het voornemen tot het doen van een aanvraag om bekostiging.
      [Artikel 69][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel67a
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel69
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '66'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '67'
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 67a
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '69'
        paragraaf: '1'
        afdeling: I
  - number: 64a.1
    text: |-
      Onze Minister brengt een nevenvestiging van een school als bedoeld in [artikel 73, aanhef en onderdeel a][ref1],
      voor bekostiging in aanmerking indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel73
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '73'
        paragraaf: '2'
        afdeling: I
  - number: 64a.1.a
    text: |-
      het bevoegd gezag met de belangstellingsmeting aannemelijk maakt dat de nevenvestiging ten minste zal worden
      bezocht door:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64a
  - number: 64a.1.a.1
    text: 195 leerlingen voor een nevenvestiging voor vwo;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64a
  - number: 64a.1.a.2
    text: 195 leerlingen voor een nevenvestiging voor havo;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64a
  - number: 64a.1.a.3
    text: 130 leerlingen voor een nevenvestiging voor mavo;
