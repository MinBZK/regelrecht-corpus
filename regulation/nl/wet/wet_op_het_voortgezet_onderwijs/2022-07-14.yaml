    text: |-
      de scheiding tussen de functies van bestuur en het toezicht daarop, bedoeld in [artikel 24d][ref1] en [24e][ref2]
      en, indien toepassing wordt gegeven aan [artikel 32b1][ref3], een beschrijving van de over te dragen taken;


