  - number: 34.1.e
    text: volgens bij algemene maatregel van bestuur te geven regels zijn bekwaamheid heeft aangetoond, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel34
  - number: 34.1.f
    text: niet krachtens rechterlijke uitspraak is uitgesloten van het verrichten van de onder c bedoelde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel34
  - number: '34.2'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op de leden van de centrale directie van een school als bedoeld
      in [artikel 32a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel34
    references:
