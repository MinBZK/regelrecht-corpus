        artikel: '90'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003549
  - number: 96c.1
    text: |-
      De gemeente bekostigt aan het bevoegd gezag van een andere dan een gemeentelijke school dat is onderworpen aan een
      of meer van de in [artikel 220 van de Gemeentewet][ref1] bedoelde belastingen ter zake van onroerende zaken, het
      bedrag dat is uitgegeven voor de belastingen met betrekking tot de in de gemeente gelegen gebouwen en terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96c.1
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
  - number: 96g.1
    text: |-
      Indien in een gemeente uitsluitend een of meer andere rechtspersonen dan de gemeente openbare scholen in stand
      houden dan wel openbare scholen ontbreken en de gemeente uitgaven wil doen voor het desbetreffende onderwijs welke
      niet door het Rijk worden bekostigd, stelt de gemeenteraad bij verordening een regeling daarvoor vast en zijn de
      [artikelen 96i tot en met 96k][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '3'
        afdeling: II
  - number: 96g.2
    text: |-
      De regeling, bedoeld in het eerste lid, maakt geen onderscheid tussen openbaar en bijzonder onderwijs en voorziet
      in een behandeling van scholen naar dezelfde maatstaf.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96g
  - number: 96g.3
    text: |-
      De regeling, bedoeld in het eerste lid, bevat in elk geval de voorzieningen die door het bevoegd gezag van een in
      de gemeente gelegen, niet door de gemeente in stand gehouden school kunnen worden aangevraagd en de procedure voor
      het doen van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96g
  - number: 96g.4
    text: |-
      De gemeenteraad kan besluiten dat burgemeester en wethouders de regeling, bedoeld in het eerste lid, tijdelijk
      kunnen aanvullen met nieuwe voorzieningen. De aanvulling wordt binnen 1 week aan de bevoegde gezagsorganen van de
      niet door de gemeente in stand gehouden scholen gezonden. Binnen 12 weken na de totstandkoming van de aanvulling
      wordt deze voorgelegd aan de gemeenteraad en besluit de gemeenteraad over de bekrachtiging ervan. Indien de
      gemeenteraad niet binnen 12 weken een besluit heeft genomen, wordt de aanvulling gelijkgesteld met een aanvulling
      die is bekrachtigd. Een afwijzing van de aanvulling door de gemeenteraad heeft geen gevolgen voor aanvragen waarop
      reeds is besloten of die reeds zijn ingediend en die voorzieningen betreffen waarop de aanvulling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96g
  - number: 96g.6
    text: |-
      Voor de toepassing van dit artikel wordt een nevenvestiging aangemerkt als een nevenvestiging die is gelegen in de
      gemeente van de hoofdvestiging. De gemeenteraad kan in de verordening, bedoeld in het eerste lid, aan burgemeester
      en wethouders de bevoegdheid verlenen om, met inachtneming van de in die verordening gestelde regels, te besluiten
      dat in de gemeente gelegen nevenvestigingen van scholen waarvan de hoofdvestiging is gelegen in een andere
      gemeente in afwijking van de eerste volzin in aanmerking komen voor een of meer van de in de regeling genoemde
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96g
  - number: 96g.7
    text: |-
      Burgemeester en wethouders maken jaarlijks in een van overheidswege uitgegeven blad of een dag-, nieuws- of huis-
      aan-huisblad, dan wel op een andere geschikte wijze, een overzicht bekend van de op grond van de regeling, bedoeld
      in het eerste lid, toegekende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96g
  - number: 96h.1
    text: |-
      Indien een gemeente zelf een of meer openbare scholen in stand houdt en zij uitgaven wil doen ten behoeve van het
      voorbereidend wetenschappelijk onderwijs, het algemeen voortgezet onderwijs, het voorbereidend beroepsonderwijs of
      het praktijkonderwijs welke niet door het Rijk worden bekostigd, kan de gemeenteraad daarvoor bij verordening een
      regeling vaststellen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96h
  - number: 96h.2
    text: |-
      [Artikel 96g, tweede tot en met zevende lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96g
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96g
        hoofdstuk: III
        paragraaf: '2'
        afdeling: II
  - number: 96i.1
    text: |-
      Indien een gemeente een of meer scholen in stand houdt, stellen burgemeester en wethouders jaarlijks met betrekking
      tot die scholen voorlopig vast:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96i
  - number: 96i.1.a
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      personeelskosten,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96i
  - number: 96i.1.b
    text: |-
      het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      exploitatiekosten,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96i
  - number: 96i.1.c
    text: |-
      het totaal van de ontvangen bekostiging, bedoeld in de [artikelen 79][ref1] en [79a][ref2], alsmede de bedragen
      die krachtens [artikel 99, tweede lid, tweede volzin][ref3], voor personeel of voor voorzieningen in de exploitatie
      worden aangewend,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel79a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel99
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '79'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 79a
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '99'
        hoofdstuk: IV
        afdeling: II
  - number: 96i.1.d
    text: |-
      het totaal van de ontvangen aanvullende bekostiging, bedoeld in de [artikelen 82][ref1] en [83,][ref2]


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel83
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '82'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '83'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
  - number: 96i.1.e
    text: |-
      het bedrag dat de gemeente in het voorafgaande kalenderjaar heeft uitgegeven ten behoeve van de instandhouding van
      een rechtspersoon als bedoeld in [artikel 53b][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53b
        hoofdstuk: IV
        afdeling: I
  - number: 96i.1.f
    text: een staat van voorzieningen die zijn ingesteld ten behoeve van het openbaar onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96i
  - number: 96i.2
    text: |-
      Indien de gemeente een deel van de ontvangsten, bedoeld in het eerste lid, onderdelen c of d, toevoegt aan een
      voorziening, wordt dat deel aangemerkt als een uitgave als bedoeld in dat lid, onderdeel a, onderscheidenlijk als
      een uitgave als bedoeld de onderdelen b of e van dat lid. Indien de gemeente bedragen aan een voorziening onttrekt,
      worden deze aangemerkt als ontvangsten, bedoeld in het eerste lid, onderdelen c of d.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96i
  - number: 96i.3
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen b, c, d en e, worden buiten
      beschouwing gelaten de uitgaven en ontvangsten voor administratie, beheer en bestuur, bedoeld in
      [artikel 79, vierde lid, onderdeel g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel79
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '79'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
  - number: 96i.4
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen a, b en e worden buiten beschouwing
      gelaten de uitgaven die worden gedekt door ontvangsten van bedragen die door derden zijn betaald, de uitgaven
      die worden gedekt door ontvangsten op grond van een besluit als bedoeld in [artikel 96g, zesde lid][ref1], tweede
      volzin, en de uitgaven voor de voorzieningen waarvoor het bevoegd gezag van een niet door de gemeente in stand
      gehouden school op grond van de regeling, bedoeld in [artikel 96h, eerste lid][ref2], een aanvraag bij de gemeente
      kon indienen en wel gedurende de periode waarvoor een dergelijke aanvraag kon worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96g
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96h
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96g
        hoofdstuk: III
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96h
        hoofdstuk: III
        paragraaf: '2'
        afdeling: II
  - number: 96i.5
    text: |-
      Indien de gemeente een deel van de bekostiging voor personeels- en exploitatiekosten overdraagt aan een ander
      bevoegd gezag, wordt dat deel aangemerkt als een uitgave als bedoeld in het eerste lid, onderdelen a of b. Indien
      door een ander bevoegd gezag een deel van de bekostiging voor personeels- en exploitatiekosten aan de gemeente
      wordt overgedragen, wordt dat deel aangemerkt als een ontvangst als bedoeld in het eerste lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96i
  - number: 96i.6
    text: |-
      Om de vijf jaar stellen burgemeester en wethouders voorlopig vast het totaal van de vastgestelde uitgaven en
      ontvangsten in de voorafgaande vijf kalenderjaren, zoals in het eerste tot en met vijfde lid is aangegeven.
      Indien de uitgaven hoger zijn dan de ontvangsten, bepalen burgemeester en wethouders tevens het bedrag van de
      overschrijding. Indien een gemeente vanaf een tijdstip binnen een periode van vijf jaar als bedoeld in de eerste
      volzin geen school in stand houdt, stellen burgemeester en wethouders in afwijking van die volzin zo spoedig
      mogelijk na dat tijdstip voorlopig vast het totaal van de vastgestelde uitgaven en ontvangsten in het aan dat
      tijdstip voorafgaande deel van de periode van vijf jaar, zoals in het eerste tot en met vijfde lid is aangegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96i
  - number: 96i.7
    text: |-
      Na sluiting van de rekening van de gemeente stellen burgemeester en wethouders de in het eerste en zesde lid
      bedoelde bedragen, zo nodig gewijzigd, vast. In het geval de uitgaven hoger zijn dan de ontvangsten, bedoeld in
      het zesde lid, drukken burgemeester en wethouders vervolgens het bedrag van de overschrijding, bedoeld in genoemd
      lid, uit in een percentage van het totaal van de ontvangsten, bedoeld in het eerste lid onderdelen c en d. Het
      percentage wordt afgerond tot twee decimalen. Afronding naar beneden vindt plaats indien de derde decimaal kleiner
      is dan 5, en naar boven indien deze decimaal ten minste 5 bedraagt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96i
  - number: 96i.8
    text: |-
      Voor de toepassing van de [artikelen 96i tot en met 96k][ref1] worden uitgaven ten behoeve van een nevenvestiging
      aangemerkt als uitgaven ten behoeve van de hoofdvestiging van de school waaraan de nevenvestiging is verbonden.
      Indien ten behoeve van een school of nevenvestiging uitgaven worden gedaan door meer dan één gemeente, worden deze
      uitgaven aangemerkt als uitgaven van de gemeente op wier grondgebied de hoofdvestiging is gelegen. In het geval,
      bedoeld in de vorige volzin worden de besluiten ingevolge de [artikelen 96i tot en met 96k][ref2] genomen door
      laatstbedoelde gemeente en hebben deze mede betrekking op de uitgaven van de andere gemeente of gemeenten. Voor de
      toepassing van de [artikelen 96i tot en met 96k][ref3] wordt een nevenvestiging aangemerkt als een nevenvestiging
      die is gelegen in de gemeente van de hoofdvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96i
