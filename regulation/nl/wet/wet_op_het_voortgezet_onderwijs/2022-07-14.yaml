        paragraaf: '1'
        afdeling: I
  - number: 17a1.3
    text: |-
      Het gebruik maken van de bevoegdheden, bedoeld in het eerste en het tweede lid, behoeft de instemming van de
      bevoegde gezagsorganen met vestigingen in het gebied van het desbetreffende samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a1
  - number: 17a1.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften vastgesteld omtrent de toepassing van
      de bevoegdheden, bedoeld in het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a1
  - number: 17b.1
    text: |-
      Ten aanzien van leerlingen die extra ondersteuning behoeven, is het onderwijs gericht op individuele begeleiding
      die is afgestemd op de behoeften van de leerling. Zo nodig treedt het bevoegd gezag daarbij in overleg met:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17b
  - number: 17b.1.a
    text: |-
      het college van burgemeester en wethouders van de gemeente waar de leerling zijn woonplaats heeft als bedoeld in
      [artikel 1.1. van de Jeugdwet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 17b.1.b
    text: |-
      een instantie die jeugdgezondheidszorg uitvoert als bedoeld in [artikel 5 van de Wet publieke gezondheid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '5'
  - number: 17b.1.c
    text: |-
      een instantie die maatschappelijke ondersteuning biedt als bedoeld in
      [artikel 1, eerste lid, onder g, 2°, van de Wet maatschappelijke ondersteuning][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '1'
  - number: 17b.1.d
    text: |-
      een zorgaanbieder als bedoeld in [artikel 1, eerste lid, onder j, van de Algemene Wet Bijzondere Ziektekosten][ref1]
      of


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '1'
  - number: 17b.1.e
    text: |-
      een zorgaanbieder die geneeskundige geestelijke gezondheidszorg levert welke behoort tot de prestaties omschreven
      bij of krachtens de [Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 17b.2
    text: Het bevoegd gezag stelt ten minste eenmaal in de 4 jaar een schoolondersteuningsprofiel vast.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17b
  - number: '18.1'
    text: |-
      Bij het geven van onderwijs aan een leerling die is opgenomen in een ziekenhuis of die in verband met ziekte thuis
      verblijft, kan het bevoegd gezag van een school worden ondersteund.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel18
  - number: '18.2'
    text: 'De ondersteuning bedoeld in het eerste lid wordt verzorgd door:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel18
  - number: 18.2.a
    text: |-
      een educatieve voorziening als bedoeld in
      [artikel 1.4, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek ][ref1]indien de leerling
      is opgenomen in een academisch ziekenhuis of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 18.2.b
    text: |-
      een schoolbegeleidingsdienst als bedoeld in [artikel 180 van de Wet op het primair onderwijs][ref1] en
      [artikel 166 van de Wet op de expertisecentra][ref2] indien de leerling is opgenomen in een ziekenhuis niet zijnde
      een academisch ziekenhuis dan wel indien de leerling in verband met ziekte thuis verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel180
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel166
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '180'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '166'
  - number: '18.3'
    text: |-
      De ondersteuning bedoeld in het eerste lid kan in overeenstemming tussen de educatieve voorziening dan wel de
      schoolbegeleidingsdienst en de school waarbij de leerling is ingeschreven, mede het geven van onderwijs aan de
      leerling betreffen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel18
  - number: '18.4'
    text: |-
      Het Rijk verstrekt aan schoolbegeleidingsdiensten als bedoeld in het tweede lid, onderdeel b, bekostiging voor
      activiteiten die worden verricht met betrekking tot de ondersteuning bij het onderwijs aan zieke leerlingen. Bij
      ministeriële regeling kunnen nadere regels worden gesteld voor de bekostiging, bedoeld in de vorige volzin.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel18
  - number: '19'
    text: |-
      De bij of krachtens deze wet vastgestelde voorschriften ten aanzien van het voorbereidend beroepsonderwijs zijn van
      overeenkomstige toepassing op het voorbereidend beroepsonderwijs dat wordt verzorgd in agrarische opleidingscentra,
      tenzij bij of krachtens algemene maatregel van bestuur is bepaald dat dit niet of gedeeltelijk niet het geval is.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel19
  - number: '20.1'
    text: De scholen voor voortgezet onderwijs zijn dagscholen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel20
  - number: '20.2'
    text: |-
      Aan een school kunnen contractactiviteiten worden verricht, bestaande uit cursussen waarvan de kosten niet ten
      laste van 's Rijks kas komen, en uit werkzaamheden voor eigen rekening ten behoeve van derden, voor zover deze
      cursussen en werkzaamheden verband houden met het onderwijs aan de desbetreffende school en voor zover het belang
      van het onderwijs aan de school door deze cursussen en werkzaamheden niet wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel20
  - number: '21.1'
    text: |-
      De naam van de school duidt aan, tot welke van de soorten van scholen, bedoeld in de [artikelen 7][ref1],
      [8][ref2], [9][ref3], [10a][ref4] en [10f][ref5], de school behoort. Het bevoegd gezag van een school voor
      middelbaar algemeen voortgezet onderwijs, een school voor voorbereidend beroepsonderwijs, of een scholengemeenschap
      waarvan in ieder geval een school voor middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend
      beroepsonderwijs deel uitmaakt, kan voor die school de aanduiding «voorbereidend middelbaar beroepsonderwijs»
      hanteren. Bij verschil van mening tussen het bevoegd gezag en Onze Minister, tot welke van de soorten zij behoort,
      beslist Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10a
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
