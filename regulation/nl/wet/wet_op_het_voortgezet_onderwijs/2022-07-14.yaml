      - id: ref3
        bwb_id: BWBR0002399
  - number: 118ff.2
    text: |-
      Op besluiten tot bekostiging waarvan de aanvraag voor 1 november 2020 is ingediend op grond van
      [artikel 67, eerste lid][ref1], blijft [artikel 108][ref2] zoals dat artikel luidde op 31 oktober 2020 van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel108
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118ff
