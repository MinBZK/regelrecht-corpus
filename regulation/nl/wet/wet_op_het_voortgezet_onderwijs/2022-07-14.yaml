      Geschillen die in bezwaar, beroep of hoger beroep aanhangig zijn of binnen de bezwaar- dan wel beroepstermijn dan
      wel verschoonbaar daarbuiten aanhangig worden gemaakt tegen besluiten van Onze Minister die zijn genomen voor de
      inwerkingtreding van de Wet tot wijziging van diverse onderwijswetten door het wijzigen van de systematiek van het
      in aanmerking brengen voor bekostiging van nieuwe openbare en bijzondere scholen zodat er meer ruimte is voor een
      nieuw onderwijsaanbod (Wet meer ruimte voor nieuwe scholen) (Stb. 2020, 160) op grond van [artikel 53f][ref1] zoals
      luidend op de dag voor de inwerkingtreding van deze wet, worden behandeld op grond van de regelingen zoals deze
      gelden de dag voor deze wet in werking treedt. De eerste volzin is hangende het bezwaar, beroep of hoger beroep
      van overeenkomstige toepassing op de bevoegdheid tot het intrekken en vervangen van besluiten die tot de aldaar
      bedoelde geschillen hebben geleid.


