  - number: 17a1.1.a
    text: de criteria en de procedure voor, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a1
  - number: 17a1.1.b
    text: de duur van,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a1
  - number: 17a1.2
    text: |-
      Het samenwerkingsverband kan er voor kiezen om in afwijking van [artikel 70][ref1], een school die is
      aangesloten bij dit samenwerkingsverband, voor te dragen aan Onze Minister, om die school voor bekostiging van
      leerwegondersteunend onderwijs in aanmerking te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel70
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a1
