  - number: 118ll.2
    text: Het verschil tussen onderdelen a en b van het eerste lid is het herverdeeleffect van een bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118ll
  - number: 118ll.3
    text: |-
      Bij een positief of negatief herverdeeleffect voor een bevoegd gezag wordt de bekostiging voor de scholen van dat
      bevoegd gezag gedurende vier jaar vanaf het kalenderjaar volgend op de inwerkingtreding van de [artikelen 79][ref1]
      en [80][ref2] verminderd onderscheidenlijk vermeerderd met achtereenvolgens 80%, 60%, 40% en 20% van het
      herverdeeleffect.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel80
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118ll
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '79'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '80'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
  - number: 118ll.4
    text: |-
      Bij een herverdeeleffect voor een bevoegd gezag van tenminste 3% negatief, ontvangt het bevoegd gezag gedurende
      vier jaar vanaf het kalenderjaar volgend op de datum van inwerkingtreding van de [artikelen 79][ref1] en [80][ref2]
      het verschil tussen 3% negatief en het werkelijke negatieve herverdeeleffect, met dien verstande dat het bevoegd
      gezag niet meer ontvangt dan maximaal 100% van de berekende bekostiging, bedoeld in het eerste lid, onderdeel b. In
      het vijfde jaar na inwerkingtreding ontvangt het bevoegd gezag nog eenmaal 50% van dit verschil.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel80
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118ll
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '79'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
      - id: ref2
