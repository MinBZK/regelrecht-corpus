        paragraaf: '1'
        afdeling: II
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 79a
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
  - number: 96j.2
    text: |-
      Indien een gemeente gedurende een gedeelte van het desbetreffende tijdvak een of meer scholen in stand houdt,
      wordt voor het vaststellen van het overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het totaal van
      de ontvangsten van een niet door de gemeente in stand gehouden school over een overeenkomstig gedeelte van het
      desbetreffende tijdvak.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96j
  - number: 96k.1
    text: |-
      Na de voorlopige vaststelling van het bedrag van de overschrijding, bedoeld in [artikel 96i, zesde lid][ref1],
      keren burgemeester en wethouders aan het bevoegd gezag van een niet door de gemeente in stand gehouden school
      dat op grond van [artikel 96j, eerste lid][ref2], aanspraak heeft op een uitkering, een voorschot uit. Het
      voorschot omvat het voorlopig vastgestelde bedrag van de overschrijding, berekend op de wijze als is aangegeven in
      [artikel 96j, eerste en tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96j
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel96j
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96j
        hoofdstuk: III
        paragraaf: '3'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 96j
        hoofdstuk: III
        paragraaf: '3'
        afdeling: II
  - number: 96k.2
    text: |-
      De bekendmaking van de beschikkingen tot voorlopige en definitieve vaststelling van het overschrijdingsbedrag,
      bedoeld in het zesde onderscheidenlijk zevende lid van [artikel 96i][ref1], behelst tevens een staat van de
      voorzieningen als bedoeld in [artikel 96i, eerste lid, onderdeel f][ref2], waarin per kalenderjaar wordt
      aangegeven het verloop van de toevoegingen en de onttrekkingen aan de voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '3'
        afdeling: II
  - number: 96m.1
    text: |-
      Het bedrag van de bekostiging waarop het bevoegd gezag over een kalenderjaar aanspraak heeft, stelt Onze Minister
      vast op de som van de overeenkomstig het bepaalde in dit hoofdstuk verstrekte bekostiging en betaalde bedragen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96m
  - number: 96m.2
    text: 'Op het in het eerste lid bedoelde bedrag worden in mindering gebracht:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96m
  - number: 96m.2.a
    text: |-
      de inkomsten die het bevoegd gezag geniet uit cursusgelden als bedoeld in de [Les- en cursusgeldwet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0004188
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96m
    references:
      - id: ref1
        bwb_id: BWBR0004188
  - number: 96m.2.b
    text: de inkomsten die het bevoegd gezag geniet uit verhaal van wettelijk verschuldigde bedragen en premies,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96m
  - number: 96m.2.c
    text: |-
      de door Onze Minister vast te stellen waarde van roerende zaken die door vervreemding of op andere wijze worden
      onttrokken aan de bestemming, waartoe zij met de vergoeding zijn aangeschaft, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96m
  - number: 96m.2.d
    text: de opbrengst van werkstukken en van verrichte diensten anders dan in het kader van contractactiviteiten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96m
  - number: 96n.1
    text: |-
      Op de bekostiging, bedoeld in [artikel 96m, eerste lid][ref1], [artikel 84, eerste lid][ref2], en
      [artikel 85, eerste lid][ref3], wordt volgens bij of krachtens algemene maatregel van bestuur te stellen regels
      een bedrag in mindering gebracht in verband met de kosten van werkloosheidsuitkeringen, suppleties inzake
      arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid aan gewezen personeel anders dan
      op grond van de [Ziektewet][ref4]. Deze regels kunnen voorzien in:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96m
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel85
      [ref4]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96n
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96m
        hoofdstuk: III
        paragraaf: '4'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '84'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '85'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref4
        bwb_id: BWBR0001888
  - number: 96n.1.a
    text: onderscheid in verband met de datum waarop gewezen personeel is ontslagen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96n
  - number: 96n.1.b
    text: |-
      onderscheid in verband met de beslissing van de rechtspersoon, bedoeld in [artikel 98b, eerste lid][ref1], zoals
      luidend op de dag voor de inwerkingtreding van [artikel IV van de wet van 12 mei 2005][ref2], Stb. 288, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
      [ref2]: https://wetten.overheid.nl/BWBR0018327#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96n
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98b
        hoofdstuk: IV
        afdeling: II
      - id: ref2
        bwb_id: BWBR0018327
        artikel: IV
  - number: 96n.1.c
    text: |-
      verdeling van de in de eerste volzin bedoelde kosten over enerzijds de bevoegde gezagsorganen gezamenlijk
      en anderzijds individuele bevoegde gezagsorganen en samenwerkingsverbanden, waarbij de scholen of
      scholengemeenschappen die onderdeel zijn van een verticale scholengemeenschap hiervan kunnen worden uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96n
  - number: 96n.2
    text: |-
      Onze Minister kan het burgerservicenummer van een persoon, behorend tot gewezen personeel als bedoeld in het eerste
      lid, uitsluitend in het kader van het bepaalde bij of krachtens het eerste lid, gebruiken in het verkeer met:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96n
  - number: 96n.2.a
    text: het bevoegd gezag van de school waar de in de aanhef bedoelde persoon werkzaam was, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96n
  - number: 96n.2.b
    text: de instantie die de uitkeringen verstrekt of heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96n
  - number: 96n.3
    text: |-
      Het burgerservicenummer wordt op een daartoe strekkend verzoek van Onze Minister aan Onze Minister verstrekt door
      het bevoegd gezag van de school waar het gewezen personeelslid werkzaam was.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96n
  - number: 96o.2
    text: |-
      Op het bedrag, bedoeld in [artikel 96m, eerste lid][ref1], worden in mindering gebracht de salarissen, toelagen,
      uitkeringen of andere bijdragen waarop aanspraak wordt gemaakt door personeel dat


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96m
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96o
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96m
        hoofdstuk: III
        paragraaf: '4'
        afdeling: II
  - number: 96o.2.a
    text: |-
      langer dan twee jaar anders dan wegens vervanging of in geval van leraren indien de benoeming is geschied met
      toepassing van [artikel 33, derde lid juncto vijfde lid][ref1], onafgebroken, met een onderbreking van een week
      of minder dan wel met een of meer onderbrekingen gedurende een schoolvakantie, in een gelijksoortige functie in
      tijdelijke dienst verbonden is geweest aan een school van het bevoegd gezag, of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96o
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 96o.2.b
    text: |-
      langer dan drie jaar direct of indirect in verband met het verrichten van contractactiviteiten in tijdelijke dienst
      is benoemd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96o
  - number: 96o.6
    text: |-
      Bij ministeriële regeling wordt bepaald in welke gevallen geen vermindering als bedoeld in het tweede lid
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96o
  - number: 96o.8
    text: Onze Minister kan projecten aanwijzen waarvoor het tweede lid onderdeel a niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96o
  - number: 96r
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven voor de verlening van voorschotten op
      de bekostiging en voor de verrekening van de betaalde voorschotten met het bedrag van de vastgestelde bekostiging
      of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96r
  - number: 96r1
    text: |-
      Onze Minister is bevoegd tot verrekening van vorderingen krachtens deze wet van of op het bevoegd gezag van een
      school met vorderingen van of op Onze Minister krachtens een andere wet.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96r1
  - number: 96s
    text: |-
      Indien een leerling in de loop van het schooljaar de school verlaat zonder de opleiding te hebben voltooid, en
      aansluitend wordt ingeschreven als leerling aan een andere school voor voortgezet onderwijs of als mbo-student
      of vavo-student aan een instelling voor educatie en beroepsonderwijs, kan het bevoegd gezag van de school met het
      bevoegd gezag van die andere school of die instelling overeenkomen een deel van de bekostiging over te dragen aan
      dat andere bevoegd gezag vanwege deze tussentijdse overstap.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96s
  - number: 96t
    text: |-
      In afwijking van [artikel 99][ref1] kan het bevoegd gezag van de school met het bevoegd gezag van de
      instelling voor beroepsonderwijs waarmee het een samenwerkingsovereenkomst heeft gesloten als bedoeld in
      [artikel 10b11, tweede lid][ref2], overeenkomen om vanwege een doorlopende leerroute vmbo-mbo als bedoeld
      in [artikel 10b10, tweede lid][ref3], of de geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in
      [artikel 10b21, tweede lid][ref4], een deel van de bekostiging over te dragen aan dat andere bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b11
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10b10
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10b21
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96t
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '99'
        hoofdstuk: IV
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b11
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10b10
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 10b21
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '97.1'
    text: Het bevoegd gezag van een bijzondere school houdt nauwkeurig boek van de inkomsten en uitgaven.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel97
  - number: '97.2'
    text: |-
      Het bevoegd gezag van een bijzondere school geeft desverlangd aan de door Onze Minister aangewezen ambtenaren de
      boeken en bescheiden ter inzage. Het bevoegd gezag is gehouden deze boeken en bescheiden zeven jaren te bewaren.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel97
  - number: '99.1'
    text: |-
      Het bevoegd gezag besteedt de verstrekte bekostiging en de betaalde bedragen ten behoeve van die school op de wijze
      zoals aangegeven in het tweede tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel99
  - number: '99.2'
    text: |-
      De voor voorzieningen in de huisvesting betaalde bedragen worden zodanig aangewend dat een behoorlijke en
      deugdelijke totstandkoming van deze voorzieningen is verzekerd. Indien na realisatie van de in de eerste volzin
      bedoelde voorzieningen de bedragen niet volledig zijn aangewend, kan het resterende deel daarvan worden aangewend
      voor de kosten van personeel of voorzieningen in de exploitatie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel99
  - number: '99.3'
    text: |-
      Het voor personeels- en exploitatiekosten betaalde bedrag wordt aangewend voor de kosten van personeel, zoals
      onderscheiden in de [artikelen 32][ref1] en [32a][ref2], voor voorzieningen in de exploitatie. In geval van een
      overschot op die bedragen, kan dat overschot worden aangewend voor voorzieningen in de huisvesting.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '32'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 32a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '99.5'
    text: |-
      De verstrekte overschrijdingsbedragen worden ten behoeve van het onderwijs aan de scholen van het bevoegd gezag
      aangewend.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel99
  - number: '99.6'
    text: |-
      Het bevoegd gezag kan de bedragen, bedoeld in het derde lid, mede aanwenden voor de kosten van personeel of
      voorzieningen in de exploitatie van:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel99
  - number: 99.6.a
    text: een andere school voor voortgezet onderwijs of een samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel99
  - number: 99.6.b
    text: een verticale scholengemeenschap;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel99
  - number: 99.6.c
    text: |-
      een basisschool of een speciale school voor basisonderwijs als bedoeld in de [Wet op het primair onderwijs][ref1],
      een school voor speciaal onderwijs, voor voortgezet speciaal onderwijs of voor speciaal en voortgezet
      speciaal onderwijs dan wel een instelling voor speciaal en voortgezet speciaal onderwijs als bedoeld in de
      [Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: '99.7'
    text: |-
      De op grond van [artikel 77a][ref1], [artikel 96g][ref2] of [artikel 96h][ref3] verstrekte bekostiging wordt
      besteed aan het doel waarvoor zij zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel77a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96g
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel96h
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 77a
        hoofdstuk: I
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96g
        hoofdstuk: III
        paragraaf: '2'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 96h
        hoofdstuk: III
        paragraaf: '2'
        afdeling: II
  - number: '99.8'
    text: |-
      Het bevoegd gezag kan met het bevoegd gezag waarmee het een samenwerkingsovereenkomst heeft gesloten als bedoeld in
      [artikel 25a, derde lid][ref1], overeenkomen om vanwege de samenwerking een deel van de bekostiging over te dragen
      aan het andere bevoegd gezag, bedoeld in het eerste lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 25a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '99.9'
    text: |-
      Het samenwerkingsverband wendt het totaal van de in de [artikelen 84][ref1], [85][ref2], [89][ref3] en [90][ref4]
      bedoelde bedragen voor personeelskosten en de materiële instandhouding uitsluitend aan voor personeelskosten en
      kosten voor materiële instandhouding van het samenwerkingsverband voor ondersteuningsvoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel89
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel90
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '84'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '85'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '89'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '90'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: 99a
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het door het bevoegd gezag uitzetten van gelden, het
      aangaan van geldleningen en het aangaan van verbintenissen voor financiële producten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel99a
  - number: 99b
    text: |-
      Het bevoegd gezag beheert de middelen van de school op zodanige wijze dat het voortbestaan van de school is
      verzekerd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel99b
  - number: '100.1'
    text: |-
      De bedragen en bekostiging, bedoeld in [artikel 99][ref1], worden niet aangewend voor contractactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel99
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '99'
        hoofdstuk: IV
        afdeling: II
  - number: '100.2'
    text: |-
      Het bevoegd gezag van de scholen, bedoeld in [artikel 99][ref1], berekent voor de contractactiviteiten aan de
      betrokken derden de kosten zodanig dat aan het bepaalde in het eerste lid wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel99
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '99'
        hoofdstuk: IV
        afdeling: II
  - number: 102a.1
    text: |-
      De kosten van herstel van schade aan gebouwen, terreinen en roerende zaken ten behoeve waarvan met betrekking tot
      scholen bekostiging wordt genoten, worden niet door de gemeente vergoed, indien:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel102a
  - number: 102a.1.a
    text: die schade door schuld of nalatigheid van de rechtspersoon die de school in stand houdt, wordt toegebracht, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel102a
  - number: 102a.1.b
    text: |-
      het bevoegd gezag een beroep kan doen op een verzekering waarvoor de premie voor vergoeding in aanmerking komt,
      of voor de vergoeding van die schade door de gemeente een collectieve verzekering is afgesloten, voor zover die
      collectieve verzekering de schade dekt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel102a
  - number: 102a.2
    text: |-
      Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een door de gemeente bekostigde school voor
      vergoeding door de gemeente in aanmerking komt, treedt de gemeente op het moment van een uitdrukkelijk besluit tot
      vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel102a
  - number: '103.1'
    text: |-
      Het bevoegd gezag onderscheidenlijk het samenwerkingsverband stelt jaarlijks een jaarverslag over het voorafgaande
      kalenderjaar vast. Op deze jaarverslaggeving is [Boek 2, titel 9, van het Burgerlijk Wetboek][ref1], met
      uitzondering van de [afdelingen 1][ref2], [11][ref3] en [12][ref4], van overeenkomstige toepassing voor zover
      bij of krachtens algemene maatregel van bestuur niet anders is bepaald. Het jaarverslag bestaat ten minste uit de
      volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Afdeling1
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Afdeling11
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Afdeling12
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003045
        afdeling: '11'
      - id: ref4
        bwb_id: BWBR0003045
        afdeling: '12'
  - number: 103.1.a
    text: |-
      een bestuursverslag als bedoeld in [artikel 391 van Boek 2 van het Burgerlijk Wetboek][ref1] waarin de door het
      bevoegd gezag gehanteerde code voor goed bestuur wordt vermeld alsmede ten minste verantwoording wordt afgelegd
      over de afwijkingen van die code voor goed bestuur,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel391
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '391'
  - number: 103.1.b
    text: |-
      een jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1], waaruit dient te blijken
      dat sprake is van een rechtmatige en doelmatige aanwending van de bekostiging, met daarbij ingevolge het derde lid
      vast te stellen bijlagen,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
  - number: 103.1.c
    text: |-
      overige gegevens als bedoeld in [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
  - number: '103.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welke onderdelen het jaarverslag tevens dient te bevatten,
      dan wel welke onderdelen komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
  - number: '103.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een nadere invulling worden gegeven aan de onderdelen, bedoeld
      in het eerste lid, en kunnen nadere voorschriften worden gegeven over:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
  - number: 103.3.a
    text: de indeling en wijze van ordening van de gegevens per onderdeel van het jaarverslag,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
  - number: 103.3.b
    text: de wijze en het tijdstip waarop de desbetreffende onderdelen beschikbaar worden gesteld,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
  - number: 103.3.c
    text: de elektronische verzending van het cijfermatige deel uit de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
  - number: 103.3.d
    text: de grondslagen voor de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
  - number: '103.4'
    text: |-
      De beschikbaarstelling van de gegevens, bedoeld in het derde lid, onderdeel b, gaat vergezeld van een verklaring
      omtrent de getrouwheid en rechtmatigheid, afgegeven door een door de toezichthouder of het toezichthoudend orgaan
      aangewezen accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Bij de
      aanwijzing van de accountant bedingt de toezichthouder of het toezichthoudend orgaan dat de controle overeenkomstig
      een door Onze Minister vast te stellen accountantsprotocol plaatsvindt en dat aan Onze Minister op diens verzoek
      inzicht wordt geboden in de controlerapporten van de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '103.5'
    text: |-
      De code voor goed bestuur, bedoeld in het eerste lid, onderdeel a, bevat ten minste bepalingen over de wijze waarop
      invulling wordt gegeven aan:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
  - number: 103.5.a
    text: |-
      een beleid dat de eigen deskundigheid en verantwoordelijkheid van het personeel voor de kwaliteit van het onderwijs
      tot haar recht komt,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
  - number: 103.5.b
    text: een integere bedrijfsvoering, waaronder voorzieningen om verstrengeling van belangen tegen te gaan, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
  - number: 103.5.c
    text: afstemming met en verantwoording aan de ouders en andere belanghebbenden binnen en buiten de school.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
  - number: '103.6'
    text: Bij algemene maatregel van bestuur kan een branchecode voor goed bestuur worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
  - number: '103.7'
    text: Het bevoegd gezag onderscheidenlijk het samenwerkingsverband maakt het jaarverslag openbaar.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
  - number: '103.8'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven over de wijze en het tijdstip waarop
      openbaarmaking van het jaarverslag plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103
  - number: 103a.1
    text: |-
      Het bevoegd gezag onderscheidenlijk het samenwerkingsverband draagt er zorg voor dat het ten behoeve
      van Onze Minister beschikt over geordende gegevens die van belang zijn voor de berekening van de hoogte
      van de bekostiging, alsmede over een verklaring over de juistheid van de bekostigingsgegevens, afgegeven
      door een door de toezichthouder of het toezichthoudend orgaan aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2, van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 103a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103a
  - number: 103a.3
    text: |-
      Het bevoegd gezag onderscheidenlijk het samenwerkingsverband bewaart de gegevens, bedoeld in het eerste lid, en de
      desbetreffende boeken en bescheiden gedurende een periode van zeven jaren.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103a
  - number: 103a1.1
    text: |-
      Het bevoegd gezag onderscheidenlijk het samenwerkingsverband draagt er zorg voor dat het beschikt over geordende
      gegevens ten behoeve van het door Onze Minister te voeren beleid met betrekking tot het onderwijs, bedoeld in deze
      wet, en verleent desgevraagd medewerking aan door of namens Onze Minister uit te voeren onderzoek dat geheel of
      mede op deze gegevens is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103a1
  - number: 103a1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103a1
  - number: 103a2
    text: |-
      De voorschriften, bedoeld in [artikel 103, tweede lid][ref1], [artikel 103a, tweede lid][ref2], en
      [artikel 103a1, tweede lid][ref3], hebben geen betrekking op het persoonsgebonden nummer van een leerling of op
      andere gegevens waarmee een leerling wordt geïdentificeerd of identificeerbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel103a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel103a1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103a2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '103'
        hoofdstuk: IV
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 103a
        hoofdstuk: IV
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 103a1
        hoofdstuk: IV
        afdeling: II
  - number: 103a3.1
    text: |-
      Onverminderd de bevoegdheid van de inspectie op grond van de [Wet op het onderwijstoezicht][ref1] kan Onze Minister
      een onderzoek instellen of doen instellen naar de jaarverslaggeving, naar de gegevens die noodzakelijk zijn voor de
      vaststelling van de bekostiging, naar de rechtmatigheid van de bestedingen en naar de doelmatigheid van het beheer
      van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103a3
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: 103a3.2
    text: |-
      Indien uit een op grond van het eerste lid ingesteld onderzoek blijkt dat de bekostiging voor een school onjuist is
      vastgesteld, kan Onze Minister correcties aanbrengen op de bekostiging.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103a3
  - number: 103a3.3
    text: |-
      Onze Minister doet het bevoegd gezag schriftelijk mededeling van een besluit tot het aanbrengen van een correctie
      op de bekostiging.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103a3
  - number: 103a3.4
    text: |-
      Indien uit de jaarverslaggeving, bedoeld in [artikel 103, eerste lid][ref1], uit de verklaring van de
      accountant, bedoeld in artikel 103, vierde lid, of uit een op grond van het eerste lid ingesteld onderzoek
      blijkt dat de bekostiging voor een school onrechtmatig is besteed of evident ondoelmatig is aangewend,
      kan Onze Minister bepalen dat het desbetreffende gedeelte van de bekostiging niet ten laste komt van het
      Rijk of dat de daarmee gemoeide bedragen in mindering worden gebracht op de bekostiging, onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103a3
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '103'
        hoofdstuk: IV
        afdeling: II
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 103a3.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de wijze waarop wordt vastgesteld
      dat sprake is van evident ondoelmatige aanwending van de bekostiging als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103a3
  - number: 103a3.6
    text: |-
      De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103a3
  - number: 103a3.7
    text: |-
      Een in het tweede lid bedoelde correctie wordt indien de correctie strekt tot verhoging van de bekostiging, binnen
      acht weken na de mededeling, bedoeld in het derde lid, door Onze Minister betaald.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103a3
  - number: 103b.1
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een leerling gebruiken in het verkeer met de leerling op wie
      het nummer betrekking heeft, of, indien de leerling minderjarig is, met de ouders van deze leerling.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103b
  - number: 103b.4
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een leerling, al dan niet tezamen met een of meer van de
      gegevens, bedoeld in [artikel 12, eerste lid, van de Wet register onderwijsdeelnemers][ref1], gebruiken in het
      verkeer met Onze Minister ten behoeve van de vaststelling van de bekostiging van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel12
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '12'
  - number: 103b.5
    text: |-
      Het bevoegd gezag en het hoofd, bedoeld in [artikel 1, onder d, van de Leerplichtwet 1969][ref1],
      gebruiken het persoonsgebonden nummer van een leerling in contacten met een gemeente in het kader van de
      [Leerplichtwet 1969][ref2], tezamen met de gegevens die noodzakelijk zijn voor het toezicht op de naleving van
      [die wet][ref3] door de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002628
      [ref3]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002628
      - id: ref3
        bwb_id: BWBR0002628
  - number: 103b.6
    text: |-
      Het bevoegd gezag gebruikt bij de opgave aan burgemeester en wethouders, bedoeld in
      [artikel 27d, eerste lid][ref1], en [artikel 28, eerste lid][ref2], het persoonsgebonden nummer van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27d
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel28
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 27d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '28'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 103b.7
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het contact met een andere school of
      een school of instelling voor ander onderwijs ten behoeve van de in- en uitschrijving van die leerling of ten
      behoeve van het volgen van onderwijs in een doorlopende leerroute vmbo-mbo als bedoeld in [artikel 10b10][ref1] of
      de geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in [artikel 10b21][ref2]. Onder dit contact wordt mede
      begrepen de uitwisseling van leergegevens en direct met het leren samenhangende begeleidingsgegevens. Bij algemene
      maatregel van bestuur worden de gegevens, bedoeld in de vorige volzin, gespecificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b21
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b10
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b21
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 103b.9
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling van het voortgezet onderwijs in het kader
      van de uitvoering van subsidieregelingen van het Europees Sociaal Fonds.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103b
  - number: 103b.10
    text: |-
      Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een leerling ter uitvoering van
      [artikel 107, vijfde lid, van de Vreemdelingenwet 2000][ref1], anders dan ter nakoming van verplichtingen als
      referent in de zin van [artikel 1 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '1'
  - number: 103b.11
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in contacten met een school als bedoeld
      in de [Wet op de expertisecentra][ref1] in het kader van de ondersteuning die deze school biedt op grond van
      [artikel 8a, eerste lid, van de Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 8a
  - number: 103b.12
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een leerling eenmalig gebruiken ten behoeve van het genereren
      van een pseudoniem voor deze leerling met het oog op het bieden van voorzieningen in het kader van het onderwijs
      en de begeleiding van leerlingen. Het bevoegd gezag draagt er zorg voor dat het pseudoniem wordt bewaard in de
      systemen waarin de leerlingen zijn geregistreerd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103b
  - number: 103b.13
    text: |-
      Het bevoegd gezag kan het pseudoniem, bedoeld in het twaalfde lid, gebruiken voor het genereren van een ander
      pseudoniem voor een leerling in het kader van de toegang tot en het gebruik van digitale leermiddelen of het
      digitaal afnemen van toetsen en examens, waarbij het bevoegd gezag er zorg voor draagt dat dit andere pseudoniem
      wordt bewaard in de systemen waarin de leerlingen zijn geregistreerd. Dit andere pseudoniem wordt uitsluitend
      verstrekt aan een leverancier die een digitaal product of een digitale dienst aanbiedt bestaande uit leerstof of
      toetsen en de daarmee samenhangende digitale diensten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103b
  - number: 103b.14
    text: |-
      Bij algemene maatregel van bestuur kunnen andere gevallen worden aangewezen dan het geval, bedoeld in het dertiende
      lid, waarvoor het bevoegd gezag op basis van het pseudoniem, bedoeld in het twaalfde lid, een ander pseudoniem kan
      genereren. Daarbij worden in ieder geval de categorieën van ontvangers van dit andere pseudoniem aangewezen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103b
  - number: 103b.15
    text: |-
      Bij ministeriële regeling worden regels gesteld over de voorwaarden waaronder de pseudoniemen, bedoeld in het
      twaalfde tot en met het veertiende lid, kunnen worden gegenereerd en gebruikt. Deze voorwaarden betreffen in ieder
      geval de duur en de beveiliging, waaronder de gescheiden opslag van de pseudoniemen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103b
  - number: 103f
    text: |-
      Onverminderd het overigens bij of krachtens de wet bepaalde omtrent het gebruik van het burgerservicenummer door de
      gemeente, gebruikt de gemeente het persoonsgebonden nummer van een leerling of een voortijdige schoolverlater als
      bedoeld in [artikel 118g][ref1] uitsluitend ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118g
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118g
  - number: 103f.a
    text: |-
      een registratie van leerplichtige jongeren in het belang van het toezicht op de naleving van de
      [Leerplichtwet 1969][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103f
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 103f.b
    text: |-
      de registratie van gegevens van voortijdige schoolverlaters, bedoeld in
      [artikel 118h, eerste lid, eerste volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118h
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118h
  - number: 103f.c
    text: |-
      het systeem van doorverwijzing van voortijdige schoolverlaters naar onderwijs of arbeidsmarkt, bedoeld in
      [artikel 118h, eerste lid, tweede en derde volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118h
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118h
  - number: 103f.d
    text: |-
      verwerking van de gegevens, bedoeld in
      [artikel 21, eerste en derde lid, van de Wet register onderwijsdeelnemers][ref1], bij de registraties, bedoeld in
      de onderdelen a en b, en het systeem van doorverwijzing, bedoeld in onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel21
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103f
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '21'
  - number: 103g.1
    text: |-
      Indien sprake is van wanbeheer van een of meer bestuurders of toezichthouders kan Onze Minister de rechtspersoon
      die de school in stand houdt dan wel het samenwerkingsverband een aanwijzing geven. Een aanwijzing omvat een of
      meer maatregelen en is evenredig aan het doel waarvoor zij wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103g
  - number: 103g.2
    text: 'Onder wanbeheer wordt uitsluitend verstaan:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103g
  - number: 103g.2.a
    text: financieel wanbeleid,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103g
  - number: 103g.2.b
    text: |-
      ernstige nalatigheid om, in ieder geval in strijd met [artikel 23a][ref1], maatregelen te treffen die noodzakelijk
      zijn voor het waarborgen van de kwaliteit en goede voortgang van het onderwijs aan de school en om te voorkomen dat
      de kwaliteit van het stelsel van voortgezet onderwijs in gevaar komt;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 103g.2.c
    text: |-
      ongerechtvaardigde verrijking, al dan niet beoogd, van de rechtspersoon die de school in stand houdt, zichzelf dan
      wel een derde;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103g
  - number: 103g.2.d
    text: |-
      onrechtmatig handelen, waaronder wordt verstaan het in de hoedanigheid van bestuurder of toezichthouder handelen in
      strijd met wettelijke bepalingen waarmee financieel voordeel wordt behaald ten gunste van de rechtspersoon die de
      school in stand houdt, zichzelf of een derde, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103g
  - number: 103g.2.e
    text: |-
      het in ernstige mate verwaarlozen van de zorg voor wat door redelijkheid en billijkheid wordt gevorderd in de
      omgang met betrokkenen in de schoolorganisatie, waaronder wordt verstaan intimidatie of bedreiging van personeel,
      leerlingen of ouders door een bestuurder of toezichthouder.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103g
  - number: 103g.3
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten sprake is van wanbeheer alsmede de in
      verband daarmee te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103g
  - number: 103g.4
    text: Een aanwijzing bevat de termijn waarbinnen het bevoegd gezag aan de aanwijzing moet voldoen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103g
  - number: 103g.5
    text: 'Alvorens Onze Minister een aanwijzing als bedoeld in het eerste lid geeft:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103g
  - number: 103g.5.a
    text: |-
      heeft de inspectie een onderzoek als bedoeld in [artikel 11][ref1] of
      [artikel 15 van de Wet op het onderwijstoezicht verricht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel15
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103g
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '15'
  - number: 103g.5.b
    text: |-
      heeft de inspectie daarover een inspectierapport als bedoeld in
      [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref1] uitgebracht; en


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103g
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
  - number: 103g.5.c
    text: |-
      stelt Onze Minister de rechtspersoon vervolgens vier weken in de gelegenheid zijn zienswijze met betrekking tot de
      aanwijzing naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103g
  - number: 103h.1
    text: |-
      Indien naar het oordeel van Onze Minister het samenwerkingsverband zijn taak ernstig verwaarloost, kan tot een bij
      koninklijk besluit te bepalen datum Onze Minister de noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103h
  - number: 103h.2
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat het
      samenwerkingsverband in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog zijn
      taak naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103h
  - number: 103h.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing indien de bevoegde gezagsorganen, bedoeld in
      [artikel 17a, tweede lid][ref1], niet of niet tijdig voldoen aan de verplichtingen, bedoeld in genoemd artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel103h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 17a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '104.1'
    text: |-
      Indien het bevoegd gezag van een school dan wel het samenwerkingsverband in strijd handelt met het bepaalde
      bij of krachtens deze wet, waaronder tevens wordt verstaan het niet opvolgen van een aanwijzing als bedoeld in
      [artikel 103g][ref1], kan Onze Minister bepalen dat de bekostiging, voorschotten daaronder begrepen, geheel of
      gedeeltelijk wordt ingehouden dan wel opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103g
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103g
        hoofdstuk: IV
        afdeling: II
  - number: '104.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een school in
      strijd handelt met [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '104.3'
    text: |-
      Onze Minister kent de bekostiging wederom toe, indien blijkt dat de reden voor de toepassing van het eerste of
      tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel104
  - number: 104a.1
    text: |-
      Indien het bevoegd gezag tekortschiet in haar zorg voor de kwaliteit van het onderwijs, bedoeld in
      [artikel 23a][ref1], kan Onze Minister op verzoek van het bevoegd gezag van een school of uit eigen beweging in
      overeenstemming met het bevoegd gezag maatregelen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel104a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 104a.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel104a
  - number: 104a.3
    text: |-
      Onze Minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voorzover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel104a
  - number: 104a.4
    text: |-
      Het eerste tot en met het derde lid is van overeenkomstige toepassing ten aanzien van de kwaliteit van de
      uitoefening van de taken van het samenwerkingsverband en de kwaliteit van het bestuur van het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel104a
  - number: '106.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel106
  - number: 106.1.a
    text: de inrichting van de boekhouding van bijzondere scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel106
  - number: 106.1.b
    text: de wijze waarop door het bevoegd gezag verslag wordt gedaan van het financieel beheer van de school,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel106
  - number: 106.1.c
    text: de vaststelling door het bevoegd gezag van een begroting en een jaarrekening, alsmede de inrichting daarvan, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel106
  - number: 106.1.d
    text: de controle van de boekhouding en de administratie van de scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel106
  - number: '106.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven ter uitvoering van deze
      afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel106
  - number: '107.1'
    text: |-
      Een openbare school wordt opgeheven en de bekostiging van een bijzondere school wordt beëindigd indien de school
      gedurende drie achtereenvolgende schooljaren telkens is bezocht door een aantal leerlingen dat minder bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel107
  - number: 107.1.a
    text: 'voor een school voor praktijkonderwijs: 70 leerlingen,'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel107
  - number: 107.1.b
    text: |-
      voor een school voor voorbereidend beroepsonderwijs met één of twee profielen als bedoeld in
      [artikel 10b, derde lid][ref1]: 195 leerlingen,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 107.1.c
    text: |-
      voor een school voor voorbereidend beroepsonderwijs met drie of vier profielen als bedoeld in
      [artikel 10b, derde lid][ref1]: 240 leerlingen,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 107.1.d
    text: |-
      voor een school voor voorbereidend beroepsonderwijs met vijf of meer profielen als bedoeld in
      [artikel 10b, derde lid][ref1]: 360 leerlingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 107.1.e
    text: |-
      voor de overige scholen: drie kwart van het aantal leerlingen dat voor de desbetreffende schoolsoort is genoemd in
      [artikel 64, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel64
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '64'
        paragraaf: '1'
        afdeling: I
  - number: '107.2'
    text: |-
      Een openbare scholengemeenschap wordt opgeheven en de bekostiging van een bijzondere scholengemeenschap
      wordt beëindigd indien de scholengemeenschap gedurende drie achtereenvolgende schooljaren telkens is
      bezocht door een aantal leerlingen dat minder bedraagt dan de helft van het aantal leerlingen dat op grond
      van [artikel 64, eerste lid][ref1], vereist is voor stichting van de scholen die deel uitmaken van de
      scholengemeenschap, met dien verstande dat het voor scholen voor voorbereidend beroepsonderwijs binnen een
      scholengemeenschap gaat om:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel64
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '64'
        paragraaf: '1'
        afdeling: I
  - number: 107.2.a
    text: |-
      voor een school met één of twee profielen als bedoeld in [artikel 10b, derde lid][ref1]: 130 leerlingen,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 107.2.b
    text: |-
      voor een school met drie of vier profielen als bedoeld in [artikel 10b, derde lid][ref1]: 160 leerlingen,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 107.2.c
    text: |-
      voor een school met vijf of zes profielen als bedoeld in [artikel 10b, derde lid][ref1]: 240 leerlingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 107.2.d
    text: |-
      voor een school met zeven of meer profielen als bedoeld in [artikel 10b, derde lid][ref1]: 360 leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '107.3'
    text: |-
      Een openbare school binnen een scholengemeenschap wordt opgeheven en de bekostiging van een bijzondere school
      binnen een scholengemeenschap wordt beëindigd indien de school gedurende drie achtereenvolgende jaren:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel107
  - number: 107.3.a
    text: door nul leerlingen is bezocht indien het gaat om een school voor praktijkonderwijs, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel107
  - number: 107.3.b
    text: |-
      door nul leerlingen is bezocht voor zover het de hoogste twee leerjaren betreft indien het gaat om een school voor
      vwo, havo, mavo of vbo.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel107
  - number: '107.4'
    text: |-
      Indien een profiel als bedoeld in [artikel 10b][ref1] of [10d][ref2] aan een school voor voorbereidend
      beroepsonderwijs gedurende drie achtereenvolgende schooljaren telkens door nul leerlingen gevolgd is, wordt dat
      profiel aan een openbare school opgeheven, of gaat de aanspraak op bekostiging voor dat profiel aan een bijzondere
      school verloren met ingang van 1 augustus volgend op die drie achtereenvolgende schooljaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
