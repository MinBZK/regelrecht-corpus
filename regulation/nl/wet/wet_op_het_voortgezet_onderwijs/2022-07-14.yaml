        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '58.7'
    text: |-
      Voor een school die is aangewezen op grond van [artikel 56][ref1] zijn van overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '56'
        afdeling: II
  - number: 58.7.a
    text: |-
      [artikel 103b, eerste, vijfde tot en met zevende en tiende tot en met twaalfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel58
    references:
