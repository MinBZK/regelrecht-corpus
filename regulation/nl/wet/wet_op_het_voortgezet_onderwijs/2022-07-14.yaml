  - number: 96i.9
    text: |-
      Burgemeester en wethouders kunnen in overeenstemming met het bevoegd gezag van een niet door de gemeente in stand
      gehouden school besluiten dat met betrekking tot een of meer scholen van dat bevoegd gezag uitgaven die de gemeente
      doet ten behoeve van een door haar in stand gehouden school buiten beschouwing worden gelaten bij het vaststellen
      van de bedragen, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96i
  - number: 96j.1
    text: |-
      In het jaar volgend op de definitieve vaststelling, bedoeld in [artikel 96i, zevende lid][ref1], wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door de gemeente in stand gehouden school
      die gedurende een of meer jaren van het desbetreffende tijdvak in de gemeente was gevestigd, aanspraak heeft.
      Dit overschrijdingsbedrag wordt vastgesteld door het percentage, bedoeld in [artikel 96i, zevende lid][ref2], te
      vermenigvuldigen met het totaal van de ontvangsten van een niet door de gemeente in stand gehouden school dat is
      gebaseerd op de bedragen die krachtens de [artikelen 79][ref3] en [79a ][ref4]voor het desbetreffende tijdvak zijn
      vastgesteld, met dien verstande dat bij het vaststellen van het totaal van de ontvangsten, bedoeld in de vorige
      volzin, buiten beschouwing blijven de ontvangsten voor administratie, beheer en bestuur, bedoeld in artikel 79,
      vierde lid, onderdeel g.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96i
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel79
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel79a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel96j
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '3'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96i
        hoofdstuk: III
        paragraaf: '3'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
