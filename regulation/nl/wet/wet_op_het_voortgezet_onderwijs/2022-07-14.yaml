  - number: '59'
    text: 'Onze Minister kan de aanwijzing intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel59
  - number: 59.a
    text: |-
      niet langer wordt voldaan aan de voorschriften gegeven bij of krachtens de [artikelen 56][ref1],
      [58, met uitzondering van het zevende lid, onderdeel d][ref2], en [58a][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel58a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '56'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '58'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 58a
        afdeling: II
  - number: 59.b
    text: |-
      niet of niet meer wordt voldaan aan de leveringsverplichting, bedoeld in
      [artikel 12, eerste, derde en vierde lid, van de Wet register onderwijsdeelnemers][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel12
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '12'
  - number: 59.c
    text: |-
      het schoolbestuur of het personeel van de school in strijd handelt met
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 59.d
    text: van misbruik van de verleende aanwijzing is gebleken.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel59
  - number: 59a.1
    text: |-
      De [artikelen 56][ref1], [57, aanhef en onderdelen a en b][ref2], [58, eerste tot en met zesde lid][ref3],
      en [59][ref4] zijn van overeenkomstige toepassing op scholen als bedoeld in
      [artikel 1 van de Wet op de expertisecentra][ref5] waar voortgezet speciaal onderwijs wordt verzorgd. Ten aanzien
      van scholen waar toepassing is gegegeven aan de eerste volzin, zijn de voorschriften gegeven bij of krachtens de
      [artikelen 6f][ref6] en [22][ref7] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel59
      [ref5]: https://wetten.overheid.nl/BWBR0003549#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel6f
      [ref7]: https://wetten.overheid.nl/BWBR0002399#Artikel22
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel59a
