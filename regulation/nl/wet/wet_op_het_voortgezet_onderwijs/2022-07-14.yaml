  - number: 25a.4.c
    text: |-
      kan worden bepaald dat een in het eerste lid bedoelde leerling voor de toepassing van daarbij aan te wijzen
      wettelijke voorschriften wordt aangemerkt of mede wordt aangemerkt als vavo-student of student in de zin van de
      [Wet educatie en beroepsonderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 25a.5
    text: |-
      Indien het bevoegd gezag, bedoeld in het eerste lid, leerlingen in het kader van het onderwijs waarvoor zij aan de
      school zijn ingeschreven, ook onderwijs wil kunnen laten volgen dat een andere school voor voortgezet onderwijs van
      datzelfde bevoegd gezag verzorgt, zijn het eerste, tweede en vierde lid van overeenkomstige toepassing en regelt
      het bevoegd gezag op overeenkomstige wijze de onderwerpen van het derde lid, onder a tot en met e.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel25a
  - number: '26.1'
    text: |-
      Het bevoegd gezag stelt nadat op overeenstemming gericht overleg is gevoerd met de ouders een
      ontwikkelingsperspectief vast:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel26
  - number: 26.1.a
    text: |-
      voor leerlingen die extra ondersteuning behoeven, voor zover het betreft leerlingen die voorbereidend
      beroepsonderwijs, middelbaar of hoger algemeen voortgezet onderwijs of voorbereidend wetenschappelijk
      onderwijs volgen, met uitzondering van leerlingen die leerwegondersteunend onderwijs volgen als bedoeld in
      [artikel 10e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10e
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 26.1.b
    text: voor leerlingen die praktijkonderwijs volgen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel26
  - number: '26.2'
    text: |-
      In afwijking van het eerste lid, wordt het deel van het ontwikkelingsperspectief betreffende de individuele
      begeleiding, bedoeld in [artikel 17b, eerste lid][ref1], vastgesteld nadat overeenstemming bereikt is tussen het
      bevoegd gezag en de ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 17b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '26.3'
    text: |-
      Het ontwikkelingsperspectief wordt zo spoedig mogelijk, doch uiterlijk binnen zes weken na de inschrijving van
      de leerling vastgesteld. Indien het betreft een inschrijving op grond van [artikel 27, lid 2f][ref1], wordt het
      ontwikkelingsperspectief uiterlijk binnen zes weken na de definitieve plaatsing van de leerling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '26.4'
    text: Het ontwikkelingsperspectief wordt ten minste één keer per schooljaar met de ouders geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel26
  - number: '26.5'
    text: |-
      Nadat op overeenstemming gericht overleg is gevoerd met de ouders of nadat overeenstemming bereikt is met de ouders
      voor zover het betreft de individuele begeleiding, bedoeld in [artikel 17b, eerste lid][ref1], kan het bevoegd
      gezag het ontwikkelingsperspectief bijstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 17b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '26.6'
    text: |-
      Het ontwikkelingsperspectief bevat een omschrijving van de begeleiding, bedoeld in [artikel 17b][ref1]. Indien
      voor leerlingen als bedoeld in het eerste lid, onder a, bij de inrichting van het onderwijs wordt afgeweken van
      één of meer onderdelen van het onderwijsprogramma, wordt dat in het ontwikkelingsperspectief vermeld. Bij algemene
      maatregel van bestuur worden nadere voorschriften over de inhoud van het ontwikkelingsperspectief vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 17b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '27.1'
    text: |-
      Het bevoegd gezag beslist over de toelating van leerlingen, met inachtneming van deze paragraaf. Bij of
      krachtens algemene maatregel van bestuur kunnen voor elke soort van scholen of voor aan scholen als bedoeld in
      [artikel 10a][ref1] verzorgde profielen voorwaarden voor de toelating en voorschriften omtrent verwijdering en
      voorwaardelijke bevordering worden vastgesteld. De algemene maatregel van bestuur bedoeld in de tweede volzin
      houdt in elk geval voorschriften in met betrekking tot de voorwaarden voor de toelating tot de scholen, bedoeld
      in de [artikelen 7][ref2], [8][ref3], [9][ref4] en [10a][ref5]. Definitieve verwijdering van een leerling
      waarop de [Leerplichtwet 1969][ref6] van toepassing is, vindt niet plaats dan nadat het bevoegd gezag ervoor heeft
      zorggedragen dat een andere school, een school voor voortgezet speciaal onderwijs, een school voor speciaal en
      voortgezet speciaal onderwijs, een instelling voor speciaal en voortgezet speciaal onderwijs dan wel een instelling
      als bedoeld in [artikel 1, onder c, van de Leerplichtwet 1969][ref7] bereid is de leerling toe te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel10a
      [ref6]: https://wetten.overheid.nl/BWBR0002628
      [ref7]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel27
    references:
