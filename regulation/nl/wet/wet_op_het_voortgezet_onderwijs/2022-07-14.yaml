  - number: 33.5b
    text: Bij toepassing van het vijfde lid of lid 5a is het derde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
  - number: '33.6'
    text: |-
      Het bevoegd gezag beschikt over geordende gegevens over de toepassing van het derde lid, de eerste volzin van het
      vierde lid, het vijfde lid en lid 5a.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
  - number: '33.7'
    text: |-
