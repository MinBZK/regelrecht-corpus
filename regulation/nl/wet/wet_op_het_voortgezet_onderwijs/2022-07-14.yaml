  - number: 67a.2.c
    text: |-
      een document waaruit blijkt dat de gemeente van de beoogde plaats van vestiging, het samenwerkingsverband en de
      bevoegde gezagsorganen van de scholen en vestigingen binnen het voedingsgebied van de school, scholengemeenschap of
      nevenvestiging zijn gevraagd om te overleggen over het voornemen tot het doen van een aanvraag om bekostiging; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
  - number: 67a.2.d
    text: |-
      een verklaring omtrent het gedrag afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref1], van
      de personen die het bestuur en het intern toezicht vormen en die op het tijdstip van het doen van de aanvraag niet
      ouder is dan zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 67a.3
    text: 'De aanvraag bevat tevens:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
  - number: 67a.3.a
    text: een beschrijving van het beleid met betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
  - number: 67a.3.b
    text: |-
      een beschrijving van de beoogde samenstelling van de formatie van de school, scholengemeenschap, nevenvestiging of
      het profiel;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
  - number: 67a.3.c
    text: |-
      een beschrijving van de wijze waarop invulling wordt gegeven aan voorschriften die worden gesteld aan de
      bekwaamheid van de leraren, onderwijsondersteunende functionarissen, de rector, directeur, conrector of adjunct-
      directeur;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
  - number: 67a.3.d
    text: |-
      een beschrijving van de wijze waarop invulling wordt gegeven aan de zorg voor de sociale, psychische en fysieke
      veiligheid van leerlingen op de school, scholengemeenschap of nevenvestiging;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
  - number: 67a.3.e
    text: |-
      een meerjarenbegroting over de eerste drie schooljaren die gebaseerd is op de bekostiging die de school,
      scholengemeenschap of nevenvestiging zal ontvangen gegeven het aantal te verwachten leerlingen in die periode;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
  - number: 67a.3.f
    text: de verwachtingen met betrekking tot de huisvesting;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
  - number: 67a.3.g
    text: |-
      informatie over de hoogte van en het beleid ten aanzien van de vrijwillige geldelijke bijdrage die van de ouders
      zal worden gevraagd en het jaarlijks verwachte totaalbedrag van die bijdragen;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
  - number: 67a.3.h
    text: |-
      informatie over de wijze waarop het bevoegd gezag uitvoering zal geven aan de afspraken, bedoeld in
      [artikel 118a][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118a
  - number: 67a.3.i
    text: |-
      een beschrijving van de wijze waarop uitvoering wordt gegeven aan de [Wet medezeggenschap op scholen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020685
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0020685
  - number: 67a.4
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld aan de wijze waarop de aanvraag plaatsvindt en wordt een
      model voor de aanvraag vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
  - number: 67a.5
    text: |-
      In afwijking van het tweede lid, onderdeel c, bevat een aanvraag voor een school voor praktijkonderwijs
      een document waaruit blijkt dat deze aanvraag in overeenstemming is met de bevoegde gezagsorganen in het
      samenwerkingsverband waarvan de school deel gaat uitmaken en wordt deze ingediend na overleg met de gemeente van de
      beoogde plaats van vestiging.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
  - number: '68.1'
    text: |-
      De belangstellingsmeting wordt uitgevoerd aan de hand van hetzij ouderverklaringen dan wel, in bij ministeriële
      regeling te bepalen gevallen, een marktonderzoek.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
  - number: '68.2'
    text: 'De belangstellingsmeting:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
  - number: 68.2.a
    text: |-
      geeft inzicht in het te verwachten aantal leerlingen op 1 januari van het elfde jaar na de indiening van de
      aanvraag, bedoeld in [artikel 67, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel67
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '67'
        paragraaf: '1'
        afdeling: I
  - number: 68.2.b
    text: |-
      vindt plaats binnen het voedingsgebied dat een gebied omvat dat bestaat uit viercijferige postcodegebieden die
      geheel of gedeeltelijk zijn gelegen binnen een straal van vijftien kilometer van de beoogde plaats van vestiging
      van de school, scholengemeenschap of nevenvestiging.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
  - number: '68.3'
    text: |-
      Het te verwachten aantal leerlingen, bedoeld in het tweede lid, onderdeel a, wordt berekend overeenkomstig de
      formule q = (y/x *100%) * w * z, waarbij:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
  - number: 68.3.a
    text: |-
      voor de ouderverklaring geldt: y = aantal leerlingen in de leeftijd van 10 tot en met 12 jaar van wie in de
      ouderverklaring is aangegeven belangstelling te hebben voor de school, scholengemeenschap of nevenvestiging in de
      aanvraag; x = totaal aantal leerlingen in de leeftijd van 10 tot en met 12 jaar op 1 januari van het kalenderjaar
      waarin de aanvraag wordt gedaan in het voedingsgebied, bedoeld in het tweede lid onder b; w = het gemiddelde van
      het aantal leerlingen in de leeftijd van 12 jaar en in de leeftijd van 13 jaar in het voedingsgebied, bedoeld in
      het tweede lid, onder b, op 1 januari van het elfde jaar na de indiening van de aanvraag, gebaseerd op gegevens
      onder meer verstrekt door het Centraal Bureau voor de Statistiek, vermenigvuldigd met een bij ministeriële
      regeling te bepalen aantal verblijfsjaren, die de landelijke verhouding tussen het totaal aantal leerlingen en het
      aantal leerlingen in leerjaar 1 weergeeft van de schoolsoort, schoolsoorten of nevenvestiging waarop de aanvraag
      betrekking heeft; z = een bij ministeriële regeling te bepalen correctiefactor;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
  - number: 68.3.b
    text: |-
      voor het marktonderzoek geldt: y = aantal leerlingen in de leeftijd van 10 tot en met 12 jaar ten aanzien van wie
      in het marktonderzoek is aangegeven dat er belangstelling is voor de school, scholengemeenschap of nevenvestiging
      in de aanvraag; x = totaal aantal leerlingen in de leeftijd van 10 tot en met 12 jaar ten aanzien van wie aan
      het marktonderzoek is deelgenomen; w = het gemiddelde van het aantal leerlingen in de leeftijd van 12 jaar en
      in de leeftijd van 13 jaar in het voedingsgebied, bedoeld in het tweede lid, onder b, op 1 januari van het elfde
      jaar na de indiening van de aanvraag, gebaseerd op gegevens onder meer verstrekt door het Centraal Bureau voor de
      Statistiek, vermenigvuldigd met een bij ministeriële regeling te bepalen aantal verblijfsjaren, die de landelijke
      verhouding tussen het totaal aantal leerlingen en het aantal leerlingen in leerjaar 1 weergeeft van de schoolsoort,
      schoolsoorten of nevenvestiging waarop de aanvraag betrekking heeft; z = een bij ministeriële regeling te bepalen
      correctiefactor.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
  - number: '68.4'
    text: |-
      De ouderverklaring, bedoeld in het eerste lid, heeft betrekking op één leerling in de leeftijd van 10 tot en met
      12 jaar op 1 november van het kalenderjaar waarin de aanvraag wordt gedaan en wordt ingediend door de ouder van
      deze leerling.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
  - number: '68.5'
    text: 'Het marktonderzoek, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
  - number: 68.5.a
    text: heeft betrekking op leerlingen in de leeftijd van 10 tot en met 12 jaar,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
  - number: 68.5.b
    text: |-
      wordt afgenomen onder de ouders van leerlingen, bedoeld in onderdeel a, op een wetenschappelijk verantwoorde manier
      door een onafhankelijk onderzoeksbureau dat aantoonbaar werkt volgens een door een brancheorganisatie opgestelde
      gedragscode met betrekking tot de uitvoering van marktonderzoek,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
  - number: 68.5.c
    text: |-
      wordt uitgevoerd aan de hand van een aselecte steekproef uit de leerlingen, bedoeld in onderdeel a, die aantoonbaar
      representatief is voor die leerlingen, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
  - number: 68.5.d
    text: mag niet ouder zijn dan 24 maanden voorafgaand aan de uiterste indieningsdatum van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
  - number: '68.6'
    text: |-
      Indien uit de belangstellingsmeting van meer dan één aanvraag blijkt dat de betrokken postcodegebieden, bedoeld
      in het tweede lid, onderdeel b, elkaar overlappen en daardoor de som van de leerlingen voor wie belangstelling
      is aangetoond in het overlappende voedingsgebied groter is dan het totaal aantal leerlingen in de overlappende
      voedingsgebieden, worden de aantallen van de leerlingen voor wie belangstelling is aangetoond in het overlappende
      voedingsgebied naar evenredigheid verminderd tot de som van het totaal aantal leerlingen in het overlappende
      voedingsgebied voor wie belangstelling is aangetoond gelijk is aan het totaal aantal leerlingen in het overlappende
      voedingsgebied.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
  - number: '68.7'
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld aan de uitvoering van de belangstellingsmeting over:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
  - number: 68.7.a
    text: de wijze waarop de belangstellingsmeting wordt uitgevoerd; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
  - number: 68.7.b
    text: |-
      de omvang van het marktonderzoek in relatie tot de minimale verhoudingen tussen de verschillende onderdelen van de
      formule voor de belangstellingsmeting, bedoeld in het derde lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel68
  - number: '69.1'
    text: De bekostiging vangt aan op 1 augustus.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel69
  - number: '69.2'
    text: |-
      De aanspraak op bekostiging op grond van de [artikelen 64][ref1], [64a][ref2] en [65][ref3] vervalt, indien
      uiterlijk op de eerste schooldag na 1 augustus in het kalenderjaar na het besluit van Onze Minister geen onderwijs
      aan de nieuwe school, scholengemeenschap, nevenvestiging of in het nieuwe profiel wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel64a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel65
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '64'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 64a
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '65'
        paragraaf: '1'
        afdeling: I
  - number: '69.3'
    text: |-
      In afwijking van het tweede lid en op aanvraag van het bevoegd gezag of de gemeente van de beoogde plaats van
      vestiging van de school, scholengemeenschap of nevenvestiging kan Onze Minister besluiten in bijzondere gevallen de
      aanspraak op bekostiging voor een jaar te handhaven. Indien Onze Minister daartoe besluit, vervalt de aanspraak op
      bekostiging, indien uiterlijk op de eerste schooldag na 1 augustus in het tweede kalenderjaar na het in het tweede
      lid bedoelde besluit geen onderwijs wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel69
  - number: '70'
    text: |-
      Onze Minister kan op aanvraag van het bevoegd gezag van een school of scholengemeenschap leerwegondersteunend
      onderwijs als bedoeld in [artikel 10e][ref1] voor bekostiging in aanmerking brengen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10e
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '70.1'
    text: dat doelmatig is gelet op het geheel en de spreiding van het aanbod van leerwegondersteunend onderwijs, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel70
  - number: '70.2'
    text: |-
      de meerderheid van de bevoegde gezagsorganen van de overige scholen en scholengemeenschappen in het betrokken
      samenwerkingsverband instemt met de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel70
  - number: '71.1'
    text: |-
      Onze Minister kan, onder door hem te stellen voorwaarden, voor bekostiging in aanmerking brengen een school die
      wordt opgericht door omzetting van een bekostigde openbare school in een gelijksoortige bijzondere school.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel71
  - number: '71.2'
    text: |-
      Onze Minister brengt voor bekostiging in aanmerking een school die wordt opgericht door omzetting van een
      bekostigde bijzondere school in een gelijksoortige openbare school.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel71
  - number: '71.3'
    text: Een omzetting kan slechts plaatsvinden met ingang van 1 augustus van enig kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel71
  - number: '71.4'
    text: Dit artikel is ook van toepassing op een scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel71
  - number: '72.1'
    text: |-
      Met inachtneming van de [artikelen 53e tot en met 53i][ref1] kan Onze Minister een school of scholengemeenschap die
      is ontstaan door samenvoeging van scholen of scholengemeenschappen voor bekostiging in aanmerking brengen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53e
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53e
        hoofdstuk: V
        afdeling: I
  - number: 72.1.a
    text: |-
      voor alle bij de samenvoeging betrokken scholen of scholengemeenschappen ten minste een bij ministeriële regeling
      vast te stellen percentage van de leerlingen van een vestiging van die school of scholengemeenschap afkomstig is
      uit dezelfde postcodegebieden als de leerlingen van een vestiging van een andere bij de samenvoeging betrokken
      school of scholengemeenschap; of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel72
  - number: 72.1.b
    text: |-
      voor ten minste een van de bij de samenvoeging betrokken scholen of scholengemeenschappen sprake is van een
      bijzondere omstandigheid als bedoeld in [artikel 108, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel108
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '108'
        afdeling: III
  - number: '72.2'
    text: |-
      Indien niet wordt voldaan aan het eerste lid, kan Onze Minister met inachtneming van de
      [artikelen 53e tot en met 53i][ref1] een school of scholengemeenschap die is ontstaan door samenvoeging van
      scholen of scholengemeenschappen voor bekostiging in aanmerking brengen, indien de bij de samenvoeging betrokken
      vestigingen van de scholen of scholengemeenschappen zijn gelegen in dezelfde gemeente dan wel in aangrenzende
      gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53e
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53e
        hoofdstuk: V
        afdeling: I
  - number: '72.3'
    text: |-
      Na een samenvoeging kan op een vestiging in elk geval onderwijs worden verzorgd in dezelfde schoolsoorten, in
      dezelfde profielen als bedoeld in de [artikelen 10b][ref1] en [10d][ref2] en in dezelfde leerjaren als op de
      desbetreffende vestiging voor de samenvoeging werd verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '72.4'
    text: Samenvoeging vindt plaats met ingang van 1 augustus.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel72
  - number: '73'
    text: 'Aan een school of scholengemeenschap kan naast een hoofdvestiging zijn verbonden een:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73
  - number: 73.a
    text: nevenvestiging, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73
  - number: 73.b
    text: tijdelijke nevenvestiging.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73
  - number: 73a.1
    text: |-
      De eerste vestiging van een school of scholengemeenschap die op grond van [artikel 64][ref1] voor bekostiging in
      aanmerking is gebracht, wordt aangeduid als hoofdvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel64
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '64'
        paragraaf: '1'
        afdeling: I
  - number: 73a.2
    text: |-
      Naast het onderwijsaanbod dat mag worden verzorgd door het voor bekostiging in aanmerking brengen van een
      scholengemeenschap, kan op een hoofdvestiging van een scholengemeenschap in elk geval onderwijs worden verzorgd in
      de in [artikel 73b, tweede en derde lid][ref1], genoemde leerjaren van de schoolsoorten die de scholengemeenschap
      omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel73b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 73b
        paragraaf: '2'
        afdeling: I
  - number: 73b.1
    text: |-
      Een nevenvestiging komt tot stand door een samenvoeging als bedoeld in [artikel 72][ref1] of door vorming van een
      nieuwe nevenvestiging van een school of scholengemeenschap als bedoeld in [artikel 64a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel64a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '72'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 64a
        paragraaf: '1'
        afdeling: I
  - number: 73b.2
    text: |-
      Op een nevenvestiging van een school voor vwo of havo kan in elk geval onderwijs worden verzorgd in de eerste 3
      leerjaren van de desbetreffende schoolsoort.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73b
  - number: 73b.3
    text: |-
      Op een nevenvestiging van een school voor mavo of vbo kan in elk geval onderwijs worden verzorgd in de eerste 2
      leerjaren van de desbetreffende schoolsoort.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73b
  - number: 73b.4
    text: |-
      Op een nevenvestiging van een scholengemeenschap kan in elk geval onderwijs worden verzorgd in de in het tweede of
      derde lid genoemde leerjaren van de schoolsoort die ingevolge artikel 64a, eerste of tweede lid, voor bekostiging
      in aanmerking is gebracht.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73b
  - number: 73c
    text: |-
      Onze Minister brengt voor bekostiging in aanmerking onderwijs vanaf het vierde leerjaar op een hoofdvestiging of
      nevenvestiging aan een school voor vwo of havo, en onderwijs vanaf het derde leerjaar op een hoofdvestiging of
      nevenvestiging van een school voor mavo of vbo indien:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73c
  - number: 73c.a
    text: |-
      op de desbetreffende vestiging onderwijs in de eerste 3 respectievelijk 2 leerjaren van de desbetreffende
      schoolsoort wordt verzorgd, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73c
  - number: 73c.b
    text: |-
      de desbetreffende vestiging ligt binnen een hemelsbreed gemeten afstand van 3 kilometer van een andere vestiging
      van de school waar onderwijs vanaf het vierde respectievelijk derde leerjaar van de desbetreffende schoolsoort
      wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73c
  - number: 73d.1
    text: |-
      Een tijdelijke nevenvestiging voorziet in de tijdelijke huisvestingsbehoefte van een hoofdvestiging of
      nevenvestiging en is gelegen op hemelsbreed gemeten een afstand van minder dan 3 kilometer van de hoofdvestiging
      of nevenvestiging.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73d
  - number: 73d.2
    text: |-
      Onze Minister brengt een tijdelijke nevenvestiging voor bekostiging in aanmerking indien het bevoegd gezag heeft
      aangetoond dat het college van burgemeester en wethouders van de gemeente de benodigde huisvesting ter beschikking
      zal stellen. De verplichting in de eerste volzin is niet van toepassing op verticale scholengemeenschappen en op
      scholen waarvoor jaarlijks een bedrag voor huisvestingskosten wordt betaald op grond van [artikel 76v][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76v
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76v
        hoofdstuk: I
        afdeling: IA
  - number: 73d.3
    text: |-
      Op een tijdelijke nevenvestiging kan onderwijs worden verzorgd in dezelfde schoolsoorten, in dezelfde profielen
      als bedoeld in de [artikelen 10b][ref1] en [10d][ref2], en in dezelfde leerjaren als op de hoofdvestiging of
      nevenvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 73e
    text: |-
      De aanspraak op bekostiging blijft bestaan indien het bevoegd gezag over hemelsbreed gemeten een afstand van minder
      dan 3 kilometer van het huidige vestigingsadres:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73e
  - number: 73e.a
    text: een vestiging verplaatst, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73e
  - number: 73e.b
    text: |-
      een deel van het onderwijsaanbod op een vestiging verplaatst naar een andere vestiging van dezelfde school of
      scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel73e
  - number: '74.1'
    text: |-
      Een bevoegd gezag van een school of scholengemeenschap kan samenwerken met ten minste 1 ander bevoegd gezag met
      als doel het onderwijsaanbod af te stemmen op de vraag van de leerlingen, ouders en andere belanghebbenden in hun
      regio.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74
  - number: '74.2'
    text: |-
      Een regio omvat een aaneengesloten gebied bestaande uit het grondgebied van een of meer gemeenten, met dien
      verstande dat:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74
  - number: 74.2.a
    text: |-
      op de deelnemende vestigingen van scholen of scholengemeenschappen per gemeente ten minste 60 procent staat
      ingeschreven van alle leerlingen die op het grondgebied van die gemeente voortgezet onderwijs volgen, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74
  - number: 74.2.b
    text: |-
      ten minste 65 procent van de bevoegde gezagsorganen met een of meer vestigingen van scholen of
      scholengemeenschappen binnen die gemeente, bij de samenwerking betrokken is.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74
  - number: 74a.1
    text: |-
      De samenwerkende bevoegde gezagsorganen stellen voor hun regio een regionaal plan onderwijsvoorzieningen vast, dat
      een gezamenlijk gedragen visie bevat op het onderwijs in de regio.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74a
  - number: 74a.2
    text: 'In het plan worden in elk geval tot uitdrukking gebracht:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74a
  - number: 74a.2.a
    text: de omvang en begrenzing van de regio,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74a
  - number: 74a.2.b
    text: gegevens over het aanbod en gebruik van onderwijsvoorzieningen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74a
  - number: 74a.2.c
    text: |-
      een overzicht van de onderwijsvoorzieningen die de bevoegde gezagsorganen binnen de looptijd van het plan voor
      bekostiging in aanmerking willen laten brengen en een prognose van het aantal leerlingen per vestiging,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74a
  - number: 74a.2.d
    text: de relatie van het bestaande en toekomstige onderwijsaanbod met het vervolgonderwijs en de arbeidsmarkt, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74a
  - number: 74a.2.e
    text: |-
      de opvattingen van de deelnemers aan het overleg, bedoeld in het vierde en vijfde lid, over het bestaande en
      toekomstige onderwijsaanbod in relatie tot het vervolgonderwijs, de arbeidsmarkt en de onderwijshuisvesting.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74a
  - number: 74a.3
    text: |-
      Een regionaal plan onderwijsvoorzieningen geldt voor een periode van 5 jaar, die aanvangt op 1 augustus van enig
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74a
  - number: 74a.4
    text: |-
      Voordat een regionaal plan onderwijsvoorzieningen wordt vastgesteld, overleggen de samenwerkende bevoegde
      gezagsorganen over een concept van het plan met:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74a
  - number: 74a.4.a
    text: de bevoegde gezagsorganen van de overige scholen of scholengemeenschappen in de regio,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74a
  - number: 74a.4.b
    text: vertegenwoordigers van de desbetreffende provincie of provincies, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74a
  - number: 74a.4.c
    text: |-
      voor zover het gaat om het vbo, met vertegenwoordigers van het bedrijfsleven in de regio en met de bevoegde
      gezagsorganen van de regionale opleidingencentra en de agrarische opleidingscentra in de regio.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74a
  - number: 74a.5
    text: |-
      Voordat de samenwerkende bevoegde gezagsorganen een regionaal plan onderwijsvoorzieningen vaststellen, wordt over
      een concept van het plan op overeenstemming gericht overleg gevoerd met het college van burgemeester en wethouders
      van de gemeente of gemeenten. Daartoe wordt een procedure vastgesteld door de samenwerkende bevoegde gezagsorganen
      en het college van burgemeester en wethouders van die gemeente of gemeenten, welke procedure een voorziening voor
      het beslechten van geschillen bevat.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74a
  - number: 74b.1
    text: |-
      Onverminderd [artikel 74c][ref1] brengt Onze Minister voor bekostiging in aanmerking een onderwijsvoorziening
      als bedoeld in de onderdelen a tot en met f, indien de voorziening is opgenomen in een regionaal plan
      onderwijsvoorzieningen en indien nodig ook wordt voldaan aan de in die onderdelen genoemde voorwaarden. Een bevoegd
      gezag kan voor 1 november bij Onze Minister een aanvraag indienen voor bekostiging van:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel74c
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 74c
        paragraaf: '3'
        afdeling: I
  - number: 74b.1.a
    text: |-
      een vestiging die wordt verplaatst of een deel van het onderwijsaanbod van een vestiging dat wordt verplaatst naar
      een andere vestiging van dezelfde school, beide over hemelsbreed gemeten een afstand van 3 kilometer of meer van
      het huidige vestigingsadres,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74b
  - number: 74b.1.b
    text: een of meer scholen die door het bevoegd gezag worden afgesplitst van een scholengemeenschap,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74b
  - number: 74b.1.c
    text: |-
      onderwijs vanaf het vierde leerjaar op een hoofdvestiging of nevenvestiging aan een school voor vwo of havo, en
      onderwijs vanaf het derde leerjaar op een hoofd- of nevenvestiging aan een school voor mavo of vbo indien niet
      binnen hemelsbreed gemeten een afstand van 3 kilometer een andere vestiging van de school is gelegen waaraan dit
      onderwijs wordt verzorgd,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74b
  - number: 74b.1.d
    text: |-
      onderwijs in de gemengde leerweg op een hoofdvestiging of nevenvestiging aan een school voor mavo of vbo of aan
      een agrarisch opleidingscentrum voor zover het gaat om het vbo, indien wordt voldaan aan voorwaarden die bij of
      krachtens algemene maatregel van bestuur zijn vastgesteld,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74b
  - number: 74b.1.e
    text: |-
      op een hoofdvestiging of nevenvestiging van een school voor vbo: een profiel als bedoeld in
      [artikel 10b, derde lid, onderdelen a tot en met c en f tot en met j][ref1], indien wordt voldaan aan bij of
      krachtens algemene maatregel van bestuur te stellen voorwaarden, of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 74b.1.f
    text: |-
      het profiel dienstverlening en producten, bedoeld in [artikel 10b, derde lid, onderdeel j][ref1], aan een agrarisch
      opleidingscentrum, voor zover het betreft het voorbereidend beroepsonderwijs, indien wordt voldaan aan bij of
      krachtens algemene maatregel van bestuur te stellen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 74b.2
    text: |-
      Onze Minister kan een onderwijsvoorziening als bedoeld in het eerste lid, onderdelen b tot en met f, die niet is
      opgenomen in een regionaal plan onderwijsvoorzieningen, voor bekostiging in aanmerking brengen indien de overige
      bevoegde gezagsorganen die deelnemen aan de regionale samenwerking instemmen met de aanvraag en wordt voldaan aan
      de in die onderdelen opgenomen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74b
  - number: 74b.3
    text: |-
      Onze Minister besluit voor 1 mei volgend op de aanvraag of de onderwijsvoorziening voor bekostiging in aanmerking
      wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74b
  - number: 74b.4
    text: |-
      Onverminderd [artikel 3:41 van de Algemene wet bestuursrecht][ref1] wordt van een besluit tot bekostiging van een
      onderwijsvoorziening mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 74c
    text: |-
      Onze Minister wijst een aanvraag als bedoeld in [artikel 74b][ref1] af indien een bevoegd gezag dat niet deelneemt
      aan de samenwerking aantoont dat de onderwijsvoorziening leidt tot meer dan 10 procent leerlingverlies bij een
      vestiging van een school of scholengemeenschap van dat bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel74b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 74b
        paragraaf: '3'
        afdeling: I
  - number: 74d.1
    text: |-
      Indien het bevoegd gezag daarvoor op grond van [artikel 76e][ref1] een aanvraag indient, stelt het college van
      burgemeester en wethouders uiterlijk op 1 augustus van het zesde kalenderjaar na het besluit van Onze Minister
      om een onderwijsvoorziening als bedoeld in [artikel 74b, eerste lid, onderdeel a][ref2], voor bekostiging in
      aanmerking te brengen, huisvesting ter beschikking. Het college van burgemeester en wethouders maakt het besluit
      daartoe uiterlijk 1 jaar voor het beschikbaar stellen van de huisvesting bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76e
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel74b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76e
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 74b
        paragraaf: '3'
        afdeling: I
  - number: 74d.2
    text: |-
      Na een besluit van Onze Minister om een onderwijsvoorziening als bedoeld in [artikel 74b][ref1] voor bekostiging
      in aanmerking te brengen vangt de bekostiging van de betrokken onderwijsvoorziening aan op 1 augustus van enig
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel74b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 74b
        paragraaf: '3'
        afdeling: I
  - number: 74e
    text: |-
      Op de voorbereiding van de besluiten bedoeld in [artikel 74b, eerste en tweede lid][ref1], is [afdeling 3.4][ref2],
      met uitzondering van [artikel 3:18, van de Algemene wet bestuursrecht][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel74b
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel74e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 74b
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '75.1'
    text: |-
      Onze Minister kan in bijzondere gevallen cursussen voortgezet onderwijs, niet zijnde voorbereidend
      beroepsonderwijs, geheel of gedeeltelijk en voor een door hem te bepalen periode voor bekostiging in aanmerking
      brengen, indien naar zijn oordeel daaraan behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel75
  - number: '75.2'
    text: Onze Minister kan aan de bekostiging verplichtingen verbinden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel75
  - number: '75.3'
    text: |-
      Onze Minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels over de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel75
  - number: '75.4'
    text: |-
      Indien een cursus voortgezet onderwijs als bedoeld in het eerste lid voor bekostiging in aanmerking wordt gebracht,
      is [artikel 6e][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6e
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 75a
    text: |-
      Onze Minister kan aanvullende middelen ter beschikking stellen die niet strekken tot
      bekostiging van het onderwijs, bedoeld in deze wet, en de schoolbegeleiding als bedoeld in de
      [artikelen 179 van de Wet op het primair onderwijs][ref1] en [165 van de Wet op de expertisecentra][ref2] ten
      behoeve daarvan, maar die direct of indirect dienstig zijn voor de uitvoering van het onderwijs of voor verhoging
      van de mogelijkheid tot deelname aan het onderwijs. Onze Minister stelt deze middelen ter beschikking onder nader
      te stellen voorwaarden. Bij de toepassing van dit artikel zijn de [artikelen 4][ref3], [5][ref4], [9][ref5] en
      [10 van de Wet overige OCW-subsidies][ref6] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel165
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0009458#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0009458#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0009458#Artikel10
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '165'
      - id: ref3
        bwb_id: BWBR0009458
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0009458
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0009458
        artikel: '9'
      - id: ref6
        bwb_id: BWBR0009458
        artikel: '10'
  - number: '76'
    text: Bij ministeriële regeling worden nadere regels vastgesteld voor de uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76
  - number: 76a
    text: |-
      De [artikelen 76b tot en met 76w][ref1] zijn slechts van toepassing op scholen voor voorbereidend wetenschappelijk
      onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs, voor voorbereidend beroepsonderwijs en voor
      praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76b
        hoofdstuk: I
        afdeling: IA
  - number: 76b.1
    text: |-
      De gemeenteraad draagt onderscheidenlijk burgemeester en wethouders dragen ten behoeve van de gemeentelijke en
      van de andere dan gemeentelijke scholen zorg voor de voorzieningen in de huisvesting op het grondgebied van de
      gemeente overeenkomstig het bepaalde in dit hoofdstuk. Hij behandelt onderscheidenlijk zij behandelen daarbij de
      gemeentelijke en de andere dan gemeentelijke scholen op gelijke voet.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76b
  - number: 76b.2
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder een andere dan een gemeentelijke school mede begrepen een op het
      grondgebied van de gemeente gelegen nevenvestiging van een school waarvan de hoofdvestiging op het grondgebied van
      een andere gemeente is gelegen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76b
  - number: 76c.1
    text: 'Voor de toepassing van dit hoofdstuk worden onder voorzieningen in de huisvesting begrepen:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76c
  - number: 76c.1.a
    text: 'voor blijvend onderscheidenlijk voor tijdelijk gebruik bestemde voorzieningen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76c
  - number: 76c.1.a.1°
    text: |-
      nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een gedeelte
      daarvan, terreinen, alsmede eerste aanschaf van leer- en hulpmiddelen en meubilair,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76c
  - number: 76c.1.a.2°
    text: uitbreiding van de onder 1° bedoelde voorzieningen, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76c
  - number: 76c.1.a.3°
    text: medegebruik van een ruimte die geschikt is voor het onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76c
  - number: 76c.1.b
    text: herstel van constructiefouten aan het gebouw of het terrein;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76c
  - number: 76c.1.c
    text: |-
      herstel en vervanging in verband met schade aan gebouw, leer- en hulpmiddelen en meubilair in geval van bijzondere
      omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76c
  - number: 76c.2
    text: |-
      Bij algemene maatregel van bestuur worden bruto vloeroppervlakten per gelijktijdig aanwezige leerling
      voorgeschreven die voorzieningen in de huisvesting ten minste dienen te bevatten. Deze oppervlakten kunnen per
      schoolsoort verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76c
  - number: 76d.1
    text: |-
      Burgemeester en wethouders stellen jaarlijks ten behoeve van het eerstvolgende jaar voor een door hem te bepalen
      tijdstip een bekostigingsplafond vast voor de bekostiging van de voorzieningen in de huisvesting voor:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76d
  - number: 76d.1.a
    text: |-
      basisscholen als bedoeld in de [Wet op het primair onderwijs][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: 76d.1.b
    text: |-
      speciale scholen voor basisonderwijs als bedoeld in de [Wet op het primair onderwijs][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003420
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0003420
  - number: 76d.1.c
    text: |-
      scholen voor speciaal onderwijs, scholen voor voortgezet speciaal onderwijs, scholen voor speciaal en voortgezet
      speciaal onderwijs dan wel instellingen voor speciaal en voortgezet speciaal onderwijs als bedoeld in de
      [Wet op de expertisecentra][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76d
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 76d.1.d
    text: scholen voor voortgezet speciaal onderwijs als bedoeld in deze wet, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76d
  - number: 76d.1.e
    text: |-
      scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs, voor
      voorbereidend beroepsonderwijs en voor praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76d
  - number: 76d.2
    text: |-
      Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      in het eerste lid bedoelde scholen op het grondgebied van de gemeente.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76d
  - number: 76e.1
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school dat een voorziening in de huisvesting wenst,
      dient een aanvraag voor opneming van die voorziening op het programma, bedoeld in [artikel 76f][ref1], in bij
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
  - number: 76e.2
    text: |-
      Burgemeester en wethouders kunnen ten aanzien van voorzieningen als bedoeld in [artikel 76c][ref1] bekostiging
      verstrekken ter zake van de kosten van bouwvoorbereiding.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76c
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76c
        hoofdstuk: I
        afdeling: IA
  - number: 76e.3
    text: |-
      Burgemeester en wethouders stellen vast, voor welk tijdstip de aanvraag wordt ingediend en aan welke voorwaarden
      deze dient te voldoen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76e
  - number: 76e.4
    text: Het derde lid is van overeenkomstige toepassing op de gemeentelijke scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76e
  - number: 76f.1
    text: |-
      Burgemeester en wethouders stellen, na overleg met de bevoegde gezagsorganen van de andere dan gemeentelijke
      scholen op het grondgebied van de gemeente, jaarlijks ten behoeve van het onderwijs op het grondgebied van de
      gemeente voor een door hen te bepalen tijdstip een programma als bedoeld in het tweede lid vast. Het programma
      heeft betrekking op scholen als bedoeld in [artikel 76d, eerste lid, onderdelen a tot en met e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
  - number: 76f.2
    text: |-
      Het programma omvat de voorzieningen in de huisvesting, bedoeld in [artikel 76c][ref1], die in het jaar na de
      vaststelling van het programma voor bekostiging in aanmerking zullen worden gebracht voor andere dan gemeentelijke
      scholen en voorzieningen die nodig zijn voor gemeentelijke scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76c
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76c
        hoofdstuk: I
        afdeling: IA
  - number: 76f.3
    text: 'Burgemeester en wethouders nemen uitsluitend voorzieningen in de huisvesting in het programma op, voor zover:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76f
  - number: 76f.3.a
    text: |-
      met de voorzieningen in het kalenderjaar volgend op het jaar van vaststelling van het programma redelijkerwijs een
      aanvang kan worden gemaakt dan wel de voorziening wordt gerealiseerd, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76f
  - number: 76f.3.b
    text: |-
      niet een van de weigeringsgronden, genoemd in [artikel 76k][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76k
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76k
        hoofdstuk: I
        afdeling: IA
  - number: 76f.4
    text: |-
      Indien het bekostigingsplafond, bedoeld in [artikel 76d][ref1], niet toereikend is, worden die voorzieningen in het
      programma opgenomen die uit dat bekostigingsplafond kunnen worden bekostigd, waarbij de volgorde wordt bepaald met
      inachtneming van de criteria, bedoeld in [artikel 76m, eerste lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76m
        hoofdstuk: I
        afdeling: IA
  - number: 76f.5
    text: |-
      De beschikking van burgemeester en wethouders kan een gedeelte van de gewenste voorziening dan wel een andere
      voorziening dan gewenst omvatten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76f
  - number: 76f.6
    text: |-
      Burgemeester en wethouders kunnen aan de opneming in het programma voorwaarden verbinden betreffende
      ingebruikneming of buitengebruikstelling van gebouwen of lokalen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76f
  - number: 76f.7
    text: |-
      Burgemeester en wethouders nemen bij de vaststelling van het programma de criteria, bedoeld in
      [artikel 76m, eerste lid, onderdeel c][ref1], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76m
        hoofdstuk: I
        afdeling: IA
  - number: 76f.8
    text: |-
      Binnen vier weken na de vaststelling van het programma treden burgemeester en wethouders met het bevoegd gezag
      in overleg over de wijze van uitvoering. Indien dit overleg niet tot overeenstemming leidt, delen burgemeester en
      wethouders het bevoegd gezag mede dat zij niet kunnen instemmen met de door het bevoegd gezag gewenste wijze van
      uitvoering.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76f
  - number: 76f.9
    text: |-
      Tijdens het in het eerste lid bedoelde overleg kunnen burgemeester en wethouders de Onderwijsraad verzoeken een
      advies uit te brengen over de vaststelling van het programma huisvestingsvoorzieningen in relatie tot de vrijheid
      van richting en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd
      dan wel uit eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht.
      Het advies wordt binnen vier weken uitgebracht aan burgemeester en wethouders. Het advies wordt bekend gemaakt
      tezamen met het programma.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76f
  - number: 76g
    text: |-
      Burgemeester en wethouders stellen gelijktijdig met het programma, bedoeld in [artikel 76f][ref1], ten behoeve
      van het onderwijs op het grondgebied van de gemeente voor een door hen te bepalen tijdstip een overzicht vast van
      die voorzieningen die zijn aangevraagd dan wel nodig zijn, die niet op het programma zijn opgenomen. Daarbij wordt
      aangegeven waarom de desbetreffende voorzieningen niet zijn opgenomen. Het overzicht wordt ter inzage gelegd. Het
      overzicht heeft betrekking op scholen als bedoeld in [artikel 76d, eerste lid, onderdelen a tot en met e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
  - number: 76h
    text: |-
      Burgemeester en wethouders stellen geen programma als bedoeld in [artikel 76f][ref1] en geen overzicht als bedoeld
      in [artikel 76g][ref2] vast, indien geen voorziening in de huisvesting nodig is noch een aanvraag is ingediend voor
      scholen als bedoeld in [artikel 76d, eerste lid, onderdelen a tot en met e][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76g
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76g
        hoofdstuk: I
        afdeling: IA
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
  - number: 76i.1
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school dat een voorziening in de huisvesting wenst die niet
      in het programma, bedoeld in [artikel 76f][ref1], is opgenomen, maar die gelet op de voortgang van het onderwijs
      geen uitstel kan lijden, dient een aanvraag om bekostiging van die voorziening in bij burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
  - number: 76i.2
    text: |-
      De beschikking kan een gedeelte van de gewenste voorziening dan wel een andere voorziening dan gewenst omvatten.
      Burgemeester en wethouders wijzen de aanvraag af, indien:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76i
  - number: 76i.2.a
    text: de beslissing over de voorziening kan worden genomen bij de vaststelling van het eerstvolgende programma, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76i
  - number: 76i.2.b
    text: |-
      een van de weigeringsgronden, genoemd in
      [artikel 76k, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76k
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76k
        hoofdstuk: I
        afdeling: IA
  - number: 76j.1
    text: |-
      Burgemeester en wethouders beslissen bij beschikking met ingang van welk tijdstip in het jaar volgend op het jaar
      van vaststelling van het programma, bedoeld in [artikel 76f][ref1], de bekostiging van een voorziening die in het
      programma is opgenomen, daadwerkelijk een aanvang kan nemen, onverminderd het bepaalde in [artikel 76l][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76l
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76j
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76l
        hoofdstuk: I
        afdeling: IA
  - number: 76j.2
    text: |-
      De aanspraak op bekostiging van een voorziening vervalt, indien niet binnen een in de verordening op basis
      van [artikel 76m][ref1] te bepalen termijn na de beschikking, bedoeld in het eerste lid, met betrekking tot de
      voorziening een bouwopdracht is gegeven dan wel een koop-, huur- of erfpachtovereenkomst is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76j
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76m
        hoofdstuk: I
        afdeling: IA
  - number: 76k.1
    text: 'Een voorziening in de huisvesting wordt slechts geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76k
  - number: 76k.1.a
    text: |-
      de gewenste voorziening geen voorziening is in de zin van [artikel 76c][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76c
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76c
        hoofdstuk: I
        afdeling: IA
  - number: 76k.1.b
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de aard en de omvang van de voorzieningen waarover
      de school reeds beschikt, voor zover deze uit de openbare kas zijn bekostigd, gelet op de normen, bedoeld in
      [artikel 76m, eerste lid, onderdeel b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76m
        hoofdstuk: I
        afdeling: IA
  - number: 76k.1.c
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van het
      aantal leerlingen of onderwijskundige ontwikkelingen, zulks met inachtneming van het bepaalde in
      [artikel 76m, eerste lid, onderdelen c en d][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76m
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76m
        hoofdstuk: I
        afdeling: IA
  - number: 76k.1.d
    text: |-
      op andere wijze dan is gewenst redelijkerwijs in de behoefte aan huisvesting kan worden voorzien, onder meer
      doordat binnen redelijke afstand van de gewenste plaats van de voorziening gebruik dan wel medegebruik mogelijk is,
      of een reeds voor bekostiging in aanmerking gebracht gebouw of deel daarvan beschikbaar komt,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76k
  - number: 76k.1.e
    text: |-
      het bekostigingsplafond, bedoeld in [artikel 76d][ref1], niet toereikend is voor de te verstrekken voorzieningen
      voor scholen als bedoeld in het [eerste lid, onderdelen a tot en met e, van dat artikel][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76k
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76d
        hoofdstuk: I
        afdeling: IA
  - number: 76k.1.f
    text: de gewenste voorziening anders dan op grond van de onderdelen b tot en met d niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76k
  - number: 76k.2
    text: |-
      Een voorziening in de huisvesting kan tevens worden geweigerd, indien de voorziening als gevolg van het verwijtbaar
      nalaten van noodzakelijk onderhoud in een slechte bouwkundige staat verkeert of indien de voorziening nodig is voor
      herstel van schade die is veroorzaakt door schuld of toedoen van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76k
  - number: 76l
    text: |-
      Voorzieningen die in het programma, bedoeld in [artikel 76f,][ref1] zijn opgenomen, komen voor bekostiging in
      aanmerking, mits op het tijdstip dat daarvoor op grond van [artikel 76j][ref2] is vastgesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76j
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76l
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76j
        hoofdstuk: I
        afdeling: IA
  - number: 76l.a
    text: is voldaan aan de bij of krachtens de wet gestelde voorschriften, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76l
  - number: 76l.b
    text: |-
      de feiten en omstandigheden waarin de school verkeert, ten opzichte van de feiten en omstandigheden ten tijde van
      de vaststelling van het programma niet ingrijpend zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76l
  - number: 76m.1
    text: 'De gemeenteraad stelt bij verordening een regeling vast met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76m
  - number: 76m.1.a
    text: |-
      de voorzieningen die ingevolge [artikel 76c][ref1] voor bekostiging in aanmerking kunnen worden gebracht,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76c
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76m
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76c
        hoofdstuk: I
        afdeling: IA
  - number: 76m.1.b
    text: de oppervlakte en de indeling van schoolgebouwen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76m
  - number: 76m.1.c
    text: de urgentiecriteria,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76m
  - number: 76m.1.d
    text: de prognosecriteria,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76m
  - number: 76m.1.e
    text: |-
      de termijn bedoeld in [artikel 76j][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76j
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76m
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76j
        hoofdstuk: I
        afdeling: IA
  - number: 76m.1.f
    text: de procedure met betrekking tot verhuur en het medegebruik van ruimten voor het onderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76m
  - number: 76m.1.g
    text: |-
      de termijn gedurende welke een gebouw of terrein voor een school of nevenvestiging nog ten hoogste kan worden
      gebruikt bij toepassing van [artikel 76u][ref1], alsmede de procedure in verband met een eventueel op te maken
      staat van onderhoud, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76u
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76m
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76u
        hoofdstuk: I
        afdeling: IA
  - number: 76m.1.h
    text: |-
      de gegevens bedoeld in [artikel 76w][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76w
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76m
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76w
        hoofdstuk: I
        afdeling: IA
  - number: 76m.2
    text: |-
      De regeling wordt zodanig vastgesteld dat kan worden voldaan aan de redelijke eisen die het onderwijs aan de
      huisvesting van scholen in de gemeente stelt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76m
  - number: 76m.3
    text: |-
      De gemeenteraad stelt normen vast aan de hand waarvan de bedragen worden vastgesteld voor de toegekende
      voorzieningen in de huisvesting.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76m
  - number: 76m.4
    text: |-
      Burgemeester en wethouders betalen volgens door hen te stellen regels de bedragen aan de hand van de door de
      gemeenteraad gestelde normen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76m
  - number: 76m.5
    text: |-
      De gemeenteraad stelt de regeling, bedoeld in het eerste lid, dan wel een wijziging daarvan, niet vast dan nadat
      daarover op overeenstemming gericht overleg is gevoerd met door de bevoegde gezagsorganen van de andere dan
      gemeentelijke scholen in de gemeente aan te wijzen vertegenwoordigers. De gemeenteraad stelt daartoe een procedure
      vast.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76m
  - number: 76m.6
    text: |-
      Tijdens het in het vijfde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling of wijziging van de gemeentelijke verordening in relatie tot de vrijheid van richting
      en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd dan wel uit
      eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies
      wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met de verordening
      of de wijziging daarvan.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76m
  - number: 76n.1
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school geeft opdracht de voorziening in de huisvesting
      waartoe op grond van de [artikelen 76f][ref1] en [76i][ref2] kan worden overgegaan, tot stand te brengen met
      daartoe door de gemeente beschikbaar te stellen gelden, tenzij het met burgemeester en wethouders overeenkomt dat
      de gemeente deze voorziening tot stand brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76i
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76n
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76f
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76i
        hoofdstuk: I
        afdeling: IA
  - number: 76n.2
    text: |-
      Indien de gemeente de voorziening in de huisvesting van een andere dan een gemeentelijke school tot stand
      heeft gebracht, worden gebouw en terrein aan het bevoegd gezag in eigendom overgedragen, tenzij burgemeester en
      wethouders en het bevoegd gezag anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76n
  - number: 76n.3
    text: |-
      Indien de voorziening in de huisvesting, bedoeld in het tweede lid, niet voldoet aan de eisen voor
      eigendomsoverdracht, geven burgemeester en wethouders deze aan het bevoegd gezag in gebruik.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76n
  - number: 76o
    text: |-
      Tenzij het bevoegd gezag van een andere dan een gemeentelijke school dat aanspraak heeft op bekostiging van
      een voorziening in de huisvesting, met burgemeester en wethouders overeenkomt dat de gemeente deze voorziening
      tot stand brengt, behoeven de bouwplannen en de desbetreffende begrotingen de instemming van burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76o
  - number: 76p
    text: |-
      De gemeente brengt een voorziening in de huisvesting van een andere dan een gemeentelijke school slechts tot stand,
      indien tussen burgemeester en wethouders en het bevoegd gezag overeenstemming bestaat over de bouwplannen en de
      wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76p
  - number: 76q.1
    text: |-
      Het bevoegd gezag is verplicht het gebouw en terrein, alsmede de roerende zaken waarvoor bekostiging wordt genoten,
      behoorlijk te gebruiken en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76q
  - number: 76q.2
    text: |-
      Vervreemding door het bevoegd gezag van een andere dan een gemeentelijke school anders dan op grond van de
      [artikelen 42c][ref1] en [50][ref2], van gebouwen, terreinen en roerende zaken waarvoor bekostiging wordt genoten,
      of bezwaren met een zakelijk recht door het bevoegd gezag van een andere dan een gemeentelijke school van zodanige
      gebouwen en terreinen is zonder toestemming van burgemeester en wethouders nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel42c
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel50
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76q
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 42c
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '50'
        hoofdstuk: III
        afdeling: I
  - number: 76q.3
    text: |-
      Het tweede lid is niet van toepassing ten aanzien van het recht van opstal ten behoeve van een door de gemeente te
      plaatsen tijdelijke voorziening in de huisvesting op grond die eigendom is van het bevoegd gezag van de betrokken
      school.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76q
  - number: 76r.1
    text: |-
      Burgemeester en wethouders zijn bevoegd een gedeelte van een gebouw of terrein dat tijdelijk of gedurende een
      gedeelte van de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd als huisvesting voor
      een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde voortgezet onderwijs, of voor
      educatie als bedoeld in de [Wet educatie en beroepsonderwijs][ref1] dan wel voor andere culturele, maatschappelijke
      of recreatieve doeleinden te bestemmen. Het voorgenomen gebruik dient zich te verdragen met het onderwijs aan de
      in het gebouw gevestigde school. Tevens zijn burgemeester en wethouders bevoegd ten behoeve van het onderwijs in
      lichamelijke opvoeding of expressie-activiteiten een gebouw of terrein dan wel een gedeelte daarvan dat tijdelijk
      gedurende gedeelten van de dag of in het geheel niet nodig zal zijn voor de daar gevestigde school, gedurende
      die tijd als huisvesting voor een andere school, voor ander uit de openbare kas bekostigd onderwijs, niet zijnde
      voortgezet onderwijs, of voor educatie als bedoeld in de [Wet educatie en beroepsonderwijs][ref2] dan wel voor
      andere culturele, maatschappelijke of recreatieve doeleinden te bestemmen. Burgemeester en wethouders zijn bevoegd
      een sportterrein, buiten de tijden dat het terrein voor het voortgezet onderwijs wordt gebruikt, gedurende die tijd
      te bestemmen voor culturele, maatschappelijke of recreatieve doeleinden, op zodanige wijze dat het zich verdraagt
      met het onderwijs dat op het terrein wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76r
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0007625
  - number: 76r.2
    text: |-
      Indien het gebouw of terrein in gebruik is voor een andere dan een gemeentelijke school, plegen burgemeester en
      wethouders vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met het bevoegd gezag van de
      andere school of nevenvestiging waarvoor de huisvesting is bestemd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76r
  - number: 76s.1
    text: |-
      Voor zover [artikel 76r][ref1] geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw
      of terrein in gebruik geven ten behoeve van uit de openbare kas bekostigd onderwijs dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden. Voor zover niet nodig voor uit de openbare kas
      bekostigd onderwijs, kan het bevoegd gezag een gedeelte van het gebouw of terrein verhuren aan een derde,
      voor zover het gehuurde niet bestemd zal zijn als woon- of bedrijfsruimte in de zin van de [vijfde][ref2]
      en [zesde afdeling van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref3]. Indien het een andere dan een
      gemeentelijke school betreft, is voor verhuur toestemming van burgemeester en wethouders vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76r
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Afdeling5
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Afdeling6
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76s
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76r
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0005290
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005290
        afdeling: '6'
  - number: 76s.2
    text: 'De ingebruikgeving of verhuur ingevolge het eerste lid eindigt:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76s
  - number: 76s.2.a
    text: |-
      indien burgemeester en wethouders gebruik maken van hun bevoegdheid op grond van artikel 76r zonder dat enige
      schadeplicht ontstaat, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76s
  - number: 76s.2.b
    text: indien het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76s
  - number: 76s.3
    text: |-
      Ingebruikgeving of verhuur ingevolge het eerste lid geschiedt niet indien het voorgenomen gebruik zich niet
      verdraagt met het onderwijs aan de in het gebouw gevestigde school.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76s
  - number: 76s.4
    text: |-
      Op de ingebruikgeving en verhuur ingevolge het eerste lid is
      [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76s
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: 76s.5
    text: |-
      Het zonder toestemming van burgemeester en wethouders verhuren van een gebouw of terrein door het bevoegd
      gezag van een andere dan een gemeentelijke school alsmede elk met dit artikel strijdig beding opgenomen in een
      huurovereenkomst met betrekking tot schoolgebouwen, is nietig.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76s
  - number: 76t
    text: |-
      Voorzieningen aan gebouwen of terreinen in verband met verhuur krachtens de [artikelen 76s][ref1] of [76u][ref2]
      door het bevoegd gezag van een andere dan een gemeentelijke school, komen niet ten laste van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76s
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel76u
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76t
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76s
        hoofdstuk: I
        afdeling: IA
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 76u
        hoofdstuk: I
        afdeling: IA
  - number: 76u.1
    text: |-
      Burgemeester en wethouders en het bevoegd gezag van een andere dan een gemeentelijke school dat eigenaar is van
      het gebouw en terrein kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag blijvend heeft opgehouden dan
      wel blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht vatbaar gedeelte daarvan, voor de
      school te gebruiken.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76u
  - number: 76u.1a
    text: |-
      Bij toepassing van het eerste lid stellen burgemeester en wethouders en het bevoegd gezag van de desbetreffende
      school gezamenlijk vast of voorzieningen in een slechte bouwkundige staat verkeren als gevolg van het verwijtbaar
      nalaten van noodzakelijk onderhoud. Indien dat het geval is, vindt verrekening plaats van de daarmee gemoeide
      kosten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76u
  - number: 76u.1b
    text: |-
      De gemeenteraad en het bevoegd gezag van de andere dan gemeentelijke scholen treffen gezamenlijk een voorziening
      voor het beslechten van geschillen die zich bij de toepassing van lid 1a voordoen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76u
  - number: 76u.2
    text: |-
      Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het eerste lid desgevraagd besluiten
      dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor
      eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. De aanvraag om het besluit wordt gedaan
      door burgemeester en wethouders of door het bevoegd gezag van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76u
  - number: 76u.3
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school dat voornemens is gebouwen of terreinen, of
      een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, doet hiervan onverwijld mededeling aan
      burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76u
  - number: 76u.4
    text: |-
      Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, of het in het tweede lid bedoelde
      besluit van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van
      de rechter, inhoudende een besluit als bedoeld in het tweede lid eerste volzin, in de plaats treedt van het
      vernietigde besluit, wordt de akte, het onherroepelijk geworden besluit onderscheidenlijk de uitspraak, tenzij
      deze een gebouw betreft als bedoeld in [artikel 28 van de Overgangswet W.V.O.][ref1] en waarvoor door het bevoegd
      gezag van rijkswege slechts een rentevergoeding is ontvangen, ingeschreven in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref2]. Door de inschrijving verkrijgt de gemeente
      de eigendom.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76u
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: 76u.5
    text: |-
      Burgemeester en wethouders en het bevoegd gezag van een andere dan een gemeentelijke school dat eigenaar is van het
      schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het gebouw dat niet vatbaar is voor
      eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76u
  - number: 76u.6
    text: |-
      Gedeputeerde staten kunnen in geval van een geschil omtrent de toepassing van het vijfde lid desgevraagd besluiten
      dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs
      nodig zal zijn. De aanvraag om het besluit wordt gedaan door burgemeester en wethouders of door het bevoegd gezag
      van de school. Alvorens op de aanvraag te besluiten, horen gedeputeerde staten de wederpartij.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76u
  - number: 76u.7
    text: |-
      Zodra de in het vijfde lid bedoelde akte door beide partijen is getekend, of het in het zesde lid bedoelde besluit
      van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de rechter,
      inhoudende een beslissing als bedoeld in het zesde lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, kan het bevoegd gezag van een andere dan een gemeentelijke school het desbetreffende gedeelte van het
      gebouw met toestemming van burgemeester en wethouders verhuren.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76u
  - number: 76u.8
    text: |-
      De toestemming, bedoeld in het zevende lid, wordt verleend voor een tijdvak van ten hoogste 3 jaren. Op verzoek van
      het bevoegd gezag kan dit tijdvak telkens worden verlengd met een termijn van ten hoogste 3 jaren.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76u
  - number: 76u.9
    text: |-
      Op de verhuur, bedoeld in het zevende lid, is [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76u
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: 76v
    text: |-
      In afwijking van dit hoofdstuk kan de gemeenteraad besluiten dat jaarlijks een bedrag voor huisvestingskosten wordt
      betaald aan het bevoegd gezag van een andere dan een gemeentelijke school voor zover die op het grondgebied van die
      gemeente in stand wordt gehouden. De gemeenteraad neemt het besluit in overeenstemming met het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76v
  - number: 76v.1.1
    text: |-
      In afwijking van het bepaalde in dit hoofdstuk en onverminderd het tweede lid zijn de bepalingen inzake de
      huisvesting bij of krachtens de [Wet educatie en beroepsonderwijs][ref1] van toepassing op scholen voor voortgezet
      onderwijs die deel uitmaken van een verticale scholengemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76v.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 76v.1.2
    text: |-
      [Artikel 76u][ref1] is van overeenkomstige toepassing op de gebouwen en terreinen waarvan het bevoegd gezag
      van een andere dan een gemeentelijke school eigenaar is op het moment dat op of na 1 januari 1997 een verticale
      scholengemeenschap tot stand komt dan wel wordt uitgebreid met een school voor voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76u
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76v.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76u
        hoofdstuk: I
        afdeling: IA
  - number: 76v.1.3
    text: 'De gemeenteraad kan in overeenstemming met het bevoegd gezag besluiten:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76v.1
  - number: 76v.1.3.a
    text: dat het tweede lid niet van toepassing is,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76v.1
  - number: 76v.1.3.b
    text: dat daarvoor het bevoegd gezag of de gemeenteraad aan de andere partij een vergoeding is verschuldigd, alsmede
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76v.1
  - number: 76v.1.3.c
    text: in voorkomende gevallen, hoe hoog die vergoeding is.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76v.1
  - number: 76v.1.4
    text: |-
      Indien toepassing is gegeven aan het derde lid, vindt inschrijving van dat feit plaats in de openbare registers,
      bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76v.1
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: 76w
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school is gehouden aan de gemeenteraad onderscheidenlijk
      burgemeester en wethouders alle inlichtingen te verschaffen die de gemeenteraad onderscheidenlijk burgemeester en
      wethouders voor een adequate uitvoering van de bepalingen in dit hoofdstuk noodzakelijk achten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel76w
  - number: '77.1'
    text: |-
      Het Rijk bekostigt met inachtneming van deze afdeling de scholen, bedoeld in [afdeling I van titel II][ref1]. De
      uitgaven, bedoeld in de [artikelen 96g][ref2] en [96h][ref3], alsmede de bedragen die de gemeente krachtens deze
      wet in aanvulling op de rijksbekostiging verstrekt, blijven ten laste van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#AfdelingI
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96g
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel96h
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0002399
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 96g
        hoofdstuk: III
        paragraaf: '2'
        afdeling: II
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 96h
        hoofdstuk: III
        paragraaf: '2'
        afdeling: II
  - number: '77.2'
    text: |-
      Aan niet door de gemeente in stand gehouden scholen als bedoeld in [afdeling I van titel II][ref1] wordt uit de
      openbare kas geen bekostiging verstrekt dan krachtens de bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#AfdelingI
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0002399
        afdeling: I
  - number: '77.3'
    text: |-
      Met betrekking tot een scholengemeenschap dan wel een verticale scholengemeenschap of een school en de daaraan
      verbonden cursussen in de zin van artikel 75b, eerste lid, kunnen zo nodig in afwijking van het bepaalde in deze
      afdeling bij of krachtens algemene maatregel van bestuur voorschriften worden gegeven voor de toepassing van deze
      afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel77
  - number: '77.4'
    text: |-
      Voor de toepassing van deze afdeling zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      [artikel 42b][ref1] of een openbare rechtspersoon als bedoeld in [artikel 42a][ref2], tenzij het tegendeel blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel42b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel42a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 42b
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 42a
        hoofdstuk: II
        afdeling: I
  - number: '78'
    text: Het Rijk bekostigt met inachtneming van deze afdeling samenwerkingsverbanden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel78
  - number: '79.1'
    text: 'De bekostiging voor een school of scholengemeenschap bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79
  - number: 79.1.a
    text: |-
      een bedrag per vestiging van de school of scholengemeenschap, indien de vestiging voldoet aan bij algemene
      maatregel van bestuur gestelde voorwaarden, waarbij onderscheid kan worden gemaakt naar het soort vestiging wat
      betreft het al dan niet in aanmerking komen voor bekostiging en de hoogte van het bedrag; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79
  - number: 79.1.b
    text: een bedrag per leerling, waarbij onderscheid kan worden gemaakt naar schoolsoort, leerjaar, leerweg of profiel.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79
  - number: '79.2'
    text: |-
      Indien op één adres vestigingen van verschillende scholen of scholengemeenschappen van hetzelfde bevoegd gezag
      zijn gehuisvest, wordt aan iedere vestiging een deel van het bedrag per vestiging als bedoeld in het eerste lid,
      onderdeel a, verstrekt naar rato van het aantal vestigingen op dat adres, rekening houdend met het soort vestiging.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79
  - number: '79.3'
    text: |-
      De bekostiging is bestemd voor kosten voor personeel en exploitatie van een school. De bekostiging wordt per school
      of scholengemeenschap berekend aan de hand van een bij of krachtens algemene maatregel van bestuur vastgestelde
      berekeningswijze.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79
  - number: '79.4'
    text: 'De bekostiging van de scholen wordt verstrekt voor:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79
  - number: 79.4.a
    text: salarissen, toelagen, uitkeringen en vergoedingen voor het personeel;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79
  - number: 79.4.b
    text: bijdragen voor het pensioen voor het personeel en dat van de nagelaten betrekkingen;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79
  - number: 79.4.c
    text: |-
      de kosten van vervanging van het personeel, werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid,
      en uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de
      [Ziektewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 79.4.d
    text: onderhoud van het gebouw en het terrein;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79
  - number: 79.4.e
    text: energie- en waterverbruik;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79
  - number: 79.4.f
    text: |-
      middelen waaronder mede wordt verstaan lesmateriaal als bedoeld in [artikel 6e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6e
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 79.4.g
    text: administratie, beheer en bestuur;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79
  - number: 79.4.h
    text: loopbaanoriëntatie en -begeleiding;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79
  - number: 79.4.i
    text: schoonmaken van het gebouw en het terrein; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79
  - number: 79.4.j
    text: publiekrechtelijke heffingen, met uitzondering van belastingen ter zake van onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79
  - number: 79a.1
    text: |-
      Een school of scholengemeenschap die op grond van [artikel 70][ref1] dan wel [artikel 17a1, tweede lid][ref2],
      in aanmerking komt voor bekostiging van leerwegondersteunend onderwijs ontvangt in aanvulling op de bekostiging,
      bedoeld in [artikel 79, eerste lid][ref3], een bedrag voor bekostiging van personeelskosten en een bedrag voor
      bekostiging van exploitatiekosten per leerling voor wie het samenwerkingsverband heeft bepaald dat deze is
      aangewezen op leerwegondersteunend onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a1
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel79
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '70'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 17a1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '79'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
  - number: 79a.2
    text: |-
      Een school voor praktijkonderwijs als bedoeld in [artikel 10f][ref1], ontvangt in aanvulling op de bekostiging,
      bedoeld in [artikel 79, eerste lid][ref2], een bedrag voor bekostiging van personeelskosten en een bedrag voor
      bekostiging van exploitatiekosten per leerling voor wie het samenwerkingsverband heeft bepaald dat deze toelaatbaar
      is tot het praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel79
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel79a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '79'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
  - number: '80.1'
    text: |-
      Onze Minister stelt de hoogte van de bekostiging, bedoeld in de [artikelen 79][ref1] en [79a][ref2], zodanig vast
      dat zij voldoet aan de redelijke behoeften van een in normale omstandigheden verkerende school.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel79a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '79'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 79a
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
  - number: '80.2'
    text: |-
      Bij ministeriële regeling worden jaarlijks voor 1 oktober de bedragen, bedoeld in de
      [artikelen 79, eerste lid][ref1], en [79a][ref2], vastgesteld en worden regels gesteld over de termijnen van de
      betaling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel79a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '79'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 79a
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
  - number: '80.3'
    text: De vastgestelde bedragen gelden voor het kalenderjaar volgend op het tijdstip van vaststelling.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel80
  - number: '80.4'
    text: |-
      Bij de vaststelling van de bedragen, bedoeld in het eerste lid, of bij tussentijdse aanpassing van die bedragen,
      worden volgens bij ministeriële regeling te stellen regels loon- en prijsontwikkelingen verwerkt, tenzij de
      toestand van 's Rijks financiën zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel80
  - number: '81'
    text: |-
      Bij het bepalen van de hoogte van de bekostiging, bedoeld in de [artikel 79][ref1] en [79a][ref2], gaat Onze
      Minister, volgens daarover bij of krachtens algemene maatregel van bestuur gestelde regels, uit van het aantal
      leerlingen en het aantal en soort vestigingen van de school op 1 oktober van het jaar voorafgaand aan het jaar
      waarop de bekostiging betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel79a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '79'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 79a
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
  - number: '82.1'
    text: |-
      Indien bijzondere ontwikkelingen in het voortgezet onderwijs daartoe aanleiding geven, kunnen bij ministeriële
      regeling regels worden gesteld over het verstrekken van aanvullende bekostiging.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel82
  - number: '82.2'
    text: |-
      Onze Minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond vaststellen. In
      dat geval worden bij ministeriële regeling regels gesteld over de verdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel82
  - number: '82.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het verstrekken van aanvullende
      bekostiging voor een scholengemeenschap met een hoofd- of nevenvestiging waaraan elk van de schoolsoorten, genoemd
      in [artikel 5, onderdelen a tot en met c][ref1], wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '5'
  - number: '82.4'
    text: |-
      De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel82
  - number: '83.1'
    text: |-
      Indien bijzondere omstandigheden van een school daartoe aanleiding geven, kan Onze Minister aanvullende bekostiging
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel83
  - number: '83.2'
    text: 'De verstrekking vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel83
  - number: 83.2.a
    text: op aanvraag van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel83
  - number: 83.2.b
    text: indien nodig onder het verbinden van verplichtingen aan het bevoegd gezag aan de verstrekking; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel83
  - number: 83.2.c
    text: voor een bepaalde periode.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel83
  - number: '83.3'
    text: |-
      De aanvraag wordt ingediend in het kalenderjaar waarin de bijzondere omstandigheden zich voordoen. Onze Minister
      beslist binnen vier maanden na ontvangst van de aanvraag. Indien de beschikking niet binnen vier maanden kan
      worden gegeven, stelt Onze Minister de aanvrager daarvan schriftelijk in kennis en noemt bij daarbij een termijn
      waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel83
  - number: '83.4'
    text: |-
      Onze Minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond vaststellen. In
      dat geval worden bij ministeriële regeling regels gesteld over de verdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel83
  - number: '84.1'
    text: |-
      Aan het samenwerkingsverband wordt bekostiging toegekend voor leerwegondersteunend onderwijs, praktijkonderwijs en
      regionale ondersteuning. De bekostiging is een bedrag per leerling.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel84
  - number: '84.2'
    text: |-
      [Artikel 79, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel79
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '79'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
  - number: '84.3'
    text: |-
      Het aantal leerlingen voor de bekostiging voor leerwegondersteunend onderwijs, bedoeld in het eerste lid, wordt
      bepaald door:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel84
  - number: 84.3.a
    text: |-
      het aantal leerlingen op 1 oktober 2012 op vestigingen in het gebied van het samenwerkingsverband dat is
      ingeschreven als leerling die leerwegondersteunend onderwijs ontvangt uit te drukken in een percentage van het
      totaal aantal leerlingen ingeschreven op vestigingen in het gebied van het samenwerkingsverband op 1 oktober 2012;
      en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel84
  - number: 84.3.b
    text: |-
      het percentage, bedoeld onder a, toe te passen op het aantal leerlingen ingeschreven op vestigingen in het gebied
      van het samenwerkingsverband op 1 oktober van het jaar voorafgaand aan het jaar waarop de bekostiging betrekking
      heeft.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel84
  - number: '84.4'
    text: 'Het aantal leerlingen voor de bekostiging voor praktijkonderwijs, bedoeld in het eerste lid, wordt bepaald door:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel84
  - number: 84.4.a
    text: |-
      het aantal leerlingen op 1 oktober 2012 op vestigingen in het gebied van het samenwerkingsverband dat is
      ingeschreven als leerling op een school voor praktijkonderwijs uit te drukken in een percentage van het totaal
      aantal leerlingen ingeschreven op vestigingen in het gebied van het samenwerkingsverband op 1 oktober 2012; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel84
  - number: 84.4.b
    text: |-
      het percentage, bedoeld onder a, toe te passen op het aantal leerlingen ingeschreven op vestigingen in het gebied
      van het samenwerkingsverband op 1 oktober van het jaar voorafgaand aan het jaar waarop de bekostiging betrekking
      heeft.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel84
  - number: '84.5'
    text: |-
      De bekostiging voor regionale ondersteuning, bedoeld in het eerste lid, bestaat uit bedrag per leerling die is
      ingeschreven op een school of vestiging in het gebied van het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel84
  - number: '84.6'
    text: |-
      Voor elke leerling die op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt,
      was aangewezen op leerwegondersteunend onderwijs op een vestiging in het gebied van het samenwerkingsverband die
      bekostigd is op grond van [artikel 70][ref1] of [artikel 17a1, tweede lid][ref2], wordt een bedrag in mindering
      gebracht op de bekostiging van het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '70'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 17a1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '84.7'
    text: |-
      Voor elke leerling die op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt, was
      ingeschreven op een vestiging voor praktijkonderwijs in het gebied van het samenwerkingsverband, wordt een bedrag
      in mindering gebracht op de bekostiging van het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel84
  - number: '84.8'
    text: Bij ministeriële regeling worden de bedragen, bedoeld in het eerste, vierde, vijfde en zesde lid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel84
  - number: '85.1'
    text: |-
      Indien het totaal van de bedragen, bedoeld in [artikel 84, vierde lid][ref1], de bekostiging van het
      samenwerkingsverband, bedoeld in artikel 84, eerste lid, overschrijdt, wordt het bedrag waarmee die bekostiging
      wordt overschreden door Onze Minister in mindering gebracht op de bekostiging van alle scholen, waarvan een of meer
      vestigingen zijn gelegen in het gebied van het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel84
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '84'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: '85.2'
    text: |-
      Het bedrag, bedoeld in het eerste lid, dat in mindering wordt gebracht wordt bepaald per school op basis van het
      leerlingenaantal op 1 oktober voorafgaand aan het jaar waarover de bekostiging plaatsvindt, van de desbetreffende
      vestiging of vestigingen in het gebied van het samenwerkingsverband, met uitzondering van de leerlingen bedoeld in
      [artikel 84, vijfde en zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel84
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '84'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: '86.1'
    text: |-
      Aan het samenwerkingsverband wordt bekostiging toegekend voor de inrichting van de ondersteuningsstructuur en de
      ondersteuningsvoorzieningen voor de zware ondersteuning. De bekostiging bestaat uit een bedrag per leerling
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel86
  - number: '86.2'
    text: |-
      Onze Minister gaat bij het bepalen van de hoogte van de bekostiging, bedoeld in het eerste lid, uit van het aantal
      leerlingen op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt op de vestigingen
      van de scholen die op 1 januari zijn aangesloten bij een samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel86
  - number: '86.3'
    text: Bij ministeriële regeling wordt jaarlijks het bedrag, bedoeld in het eerste lid, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel86
  - number: '86.4'
    text: |-
      Voor elke leerling die op 1 februari van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt,
      was ingeschreven op een school voor voortgezet speciaal onderwijs en speciaal en voortgezet speciaal onderwijs,
      wordt een bedrag in mindering gebracht op de bekostiging van het samenwerkingsverband dat de leerling op grond van
      [artikel 40, twaalfde lid, van de Wet op de expertisecentra][ref1] toelaatbaar heeft verklaard tot het voortgezet
      speciaal onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
  - number: '86.5'
    text: |-
      Het bedrag, bedoeld in het derde lid, is afhankelijk van de in de toelaatbaarheidsverklaring opgenomen
      ondersteuningsbehoefte van de leerling en komt overeen met één van de bedragen die bij ministeriële regeling worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel86
  - number: '86.6'
    text: |-
      Het vierde lid is van overeenkomstige toepassing op leerlingen opgenomen in residentiële instellingen
      aan die op 1 februari van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt
      staan ingeschreven op een school op basis van een samenwerkingsovereenkomst als bedoeld in
      [artikel 71a, tweede lid, van de Wet op de expertisecentra][ref1], met dien verstande dat het bedrag, bedoeld in
      [artikel 117, zevende lid, van die wet][ref2] in mindering wordt gebracht op de bekostiging van:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 71a
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '117'
  - number: 86.6.a
    text: 'het samenwerkingsverband:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel86
  - number: 86.6.a.1°
    text: |-
      dat verantwoordelijk is voor de bekostiging tijdens de inschrijving op een school voor voortgezet
      speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 of 4, bedoeld in de
      [Wet op de expertisecentra][ref1], indien de leerling onmiddellijk voorafgaand aan de opname in de residentiële
      instelling was ingeschreven op een school voor voortgezet speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs, of


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 86.6.a.2°
    text: |-
      waartoe de vestiging van de school behoort waar de leerling was ingeschreven en bekostigd voorafgaand aan de opname
      in de residentiële instelling, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel86
  - number: 86.6.b
    text: |-
      het samenwerkingsverband in het gebied waar de leerling woont, indien de leerling onmiddellijk voorafgaand aan de
      opname in de residentiële instelling niet was ingeschreven en bekostigd op een school of, niet of niet op basis
      van een toelaatbaarheidsverklaring was ingeschreven op een school voor voortgezet speciaal onderwijs of speciaal en
      voortgezet speciaal onderwijs behorend tot cluster 3 of 4, bedoeld in de [Wet op de expertisecentra][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '86.7'
    text: |-
      De [artikelen 82][ref1] en [83][ref2] zijn van overeenkomstige toepassing op het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel83
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '82'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '83'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
  - number: '87.1'
    text: |-
      Indien het totaal van de bedragen, bedoeld in [artikel 86, vierde lid][ref1], bekostiging van het
      samenwerkingsverband, bedoeld in artikel 86, eerste lid, overschrijdt, wordt het bedrag waarmee die bekostiging
      wordt overschreden door Onze Minister in mindering gebracht op de bekostiging van alle scholen waarvan één of meer
      vestigingen zijn gelegen in het gebied van het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel86
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '86'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: '87.2'
    text: |-
      Het bedrag dat in mindering wordt gebracht wordt per school bepaald op basis van het leerlingenaantal van de
      desbetreffende vestiging of vestigingen in het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel87
  - number: '89.1'
    text: Aan het samenwerkingsverband wordt bekostiging voor materiële instandhouding toegekend.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel89
  - number: '89.2'
    text: |-
      De in het eerste lid bedoelde bekostiging bestaat uit een bij ministeriële regeling vast te stellen bedrag per
      leerling voor het aantal leerlingen op vestigingen van scholen in het samenwerkingsverband op 1 oktober van het
      jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel89
  - number: '89.3'
    text: |-
      Voor elke leerling die op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt,
      was ingeschreven op een school voor voortgezet speciaal onderwijs of speciaal en voortgezet onderwijs behorend
      tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref1], wordt een bedrag in mindering gebracht
      op de in het eerste lid bedoelde bekostiging van het samenwerkingsverband dat de leerling op grond van
      [artikel 40, twaalfde lid, van de Wet op de expertisecentra][ref2] toelaatbaar heeft verklaard tot het voortgezet
      speciaal onderwijs. Het in de eerste volzin bedoelde bedrag is afhankelijk van de in de toelaatbaarheidsverklaring
      opgenomen ondersteuningsbehoefte van de leerling en komt overeen met één van de normbedragen die bij ministeriële
      regeling worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '40'
  - number: '89.4'
    text: |-
      Het derde lid is van overeenkomstige toepassing op leerlingen opgenomen in residentiële instellingen aan wie op
      1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt onderwijs werd gegeven op basis
      van een samenwerkingsovereenkomst als bedoeld in [artikel 71c, tweede lid, van de Wet op de expertisecentra][ref1],
      met dien verstande dat het normbedrag, bedoeld in [artikel 117, zevende lid, van die wet][ref2] in mindering wordt
      gebracht op de bekostiging van:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel71c
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel117
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 71c
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '117'
  - number: 89.4.a
    text: 'het samenwerkingsverband:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel89
  - number: 89.4.a.1°
    text: |-
      dat verantwoordelijk is voor de bekostiging tijdens de inschrijving op een school voor voortgezet
      speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref1], indien de leerling onmiddellijk voorafgaand aan de opname in de residentiële
      instelling was ingeschreven op een school voor voortgezet speciaal onderwijs of speciaal en voortgezet speciaal
      onderwijs, of


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 89.4.a.2°
    text: |-
      waartoe de vestiging van de school behoort waar de leerling was ingeschreven en bekostigd onmiddellijk voorafgaand
      aan de opname in de residentiële instelling, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel89
  - number: 89.4.b
    text: |-
      het samenwerkingsverband in het gebied waarvan de leerling woonachtig is, indien de leerling onmiddellijk
      voorafgaand aan de opname in de residentiële instelling niet was ingeschreven op een school of school voor
      voortgezet speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in
      de [Wet op de expertisecentra][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: '89.5'
    text: Artikel 89 is van overeenkomstige toepassing op het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel89
  - number: '90.1'
    text: |-
      In aanvulling op de bekostiging van [artikel 89][ref1], ontvangt het samenwerkingsverband aanvullende bekostiging
      voor materiële instandhouding voor leerwegondersteunend onderwijs, praktijkonderwijs en bekostiging voor regionale
      ondersteuning als bedoeld in het tweede, derde en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel89
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '89'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
  - number: '90.2'
    text: |-
      De in het eerste lid bedoelde bekostiging voor leerwegondersteunend onderwijs bestaat uit een bij ministeriële
      regeling vast te stellen bedrag per leerling. Het aantal leerlingen wordt bepaald door:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel90
  - number: 90.2.a
    text: |-
      het aantal leerlingen op 1 oktober 2012 op vestigingen in het gebied van het samenwerkingsverband dat is
      ingeschreven als leerling die leerwegondersteunend onderwijs ontvangt uit te drukken in een percentage van het
      totaal aantal leerlingen ingeschreven op vestigingen in het gebied van het samenwerkingsverband op 1 oktober 2012;
      en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel90
  - number: 90.2.b
    text: |-
      het percentage, bedoeld onder a, toe te passen op het aantal leerlingen ingeschreven op vestigingen in het gebied
      van het samenwerkingsverband op 1 oktober van het jaar voorafgaand aan het jaar waarop de bekostiging betrekking
      heeft.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel90
  - number: '90.3'
    text: |-
      De in het eerste lid bedoelde bekostiging voor praktijkonderwijs bestaat uit een bij ministeriële regeling vast te
      stellen bedrag per leerling. Het aantal leerlingen wordt bepaald door:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel90
  - number: 90.3.a
    text: |-
      het aantal leerlingen op 1 oktober 2012 op vestigingen in het gebied van het samenwerkingsverband dat is
      ingeschreven als leerling op een school voor praktijkonderwijs uit te drukken in een percentage van het totaal
      aantal leerlingen ingeschreven op vestigingen in het gebied van het samenwerkingsverband op 1 oktober 2012; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel90
  - number: 90.3.b
    text: |-
      het percentage, bedoeld onder a, toe te passen op het aantal leerlingen op vestigingen in het gebied van het
      samenwerkingsverband op 1 oktober van het jaar voorafgaand aan het jaar waarop de bekostiging betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel90
  - number: '90.4'
    text: |-
      De in het eerste lid bedoelde bekostiging voor regionale ondersteuning bestaat uit een bij ministeriële regeling
      vast te stellen bedrag per leerling van de scholen en vestigingen in het gebied van het samenwerkingsverband. Bij
      of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de vaststelling en
      uitkering van bekostiging voor regionale ondersteuning.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel90
  - number: '90.5'
    text: |-
      Voor elke leerling die op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt,
      was aangewezen op leerwegondersteunend onderwijs op een vestiging in het gebied van het samenwerkingsverband die
      bekostigd is op grond van [artikel 70][ref1] dan wel [artikel 17a1, tweede lid][ref2], wordt een bij ministeriële
      regeling vast te stellen bedrag in mindering gebracht op de in het eerste lid bedoelde bekostiging van het
      samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '70'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 17a1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '90.6'
    text: |-
      Voor elke leerling die op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt,
      was ingeschreven op een vestiging voor praktijkonderwijs in het gebied van het samenwerkingsverband wordt een bij
      ministeriële regeling vast te stellen bedrag in mindering gebracht op de in het eerste lid bedoelde bekostiging van
      het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel90
  - number: '91'
    text: |-
      Indien het totaal van de bedragen, bedoeld in [artikel 89, derde lid, eerste volzin, en vierde lid][ref1],
      de materiële bekostiging van het samenwerkingsverband, bedoeld in artikel 89, eerste lid, overschrijdt, wordt
      het bedrag waarmee die bekostiging wordt overschreden door Onze Minister in mindering gebracht op de materiële
      bekostiging van alle scholen en scholen voor voortgezet speciaal onderwijs en speciaal en voortgezet speciaal
      onderwijs behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref2], waarvan één of meer
      vestigingen zijn gelegen in het gebied van het samenwerkingsverband. Het bedrag dat in mindering wordt gebracht
      wordt per school dan wel school voor voortgezet speciaal onderwijs of speciaal en voortgezet speciaal onderwijs
      behorend tot cluster 3 of 4, bedoeld in de Wet op het expertisecentra, voor zover het betreft het daaraan verzorgde
      voortgezet speciaal onderwijs, bepaald op basis van het leerlingenaantal van de desbetreffende vestiging of
      vestigingen in het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '89'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0003549
  - number: '92'
    text: |-
      Indien het totaal van de bedragen, bedoeld in [artikel 90, vijfde en zesde lid][ref1], de bekostiging van
      materiële instandhouding van het samenwerkingsverband, bedoeld in artikel 90, eerste lid, overschrijdt, wordt het
      bedrag waarmee die bekostiging wordt overschreden door Onze Minister in mindering gebracht op de bekostiging van
      materiële instandhouding van alle scholen en scholen voor voortgezet speciaal onderwijs en speciaal en voortgezet
      speciaal onderwijs behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref2], waarvan één
      of meer vestigingen zijn gelegen in het gebied van het samenwerkingsverband. Het bedrag dat in mindering wordt
      gebracht wordt bepaald per school dan wel school voor voortgezet speciaal onderwijs of speciaal en voortgezet
      speciaal onderwijs behorend tot cluster 3 of 4, bedoeld in de Wet op het expertisecentra, voor zover het betreft
      het daaraan verzorgde voortgezet speciaal onderwijs, op basis van het leerlingenaantal op 1 oktober voorafgaand
      aan het jaar waarover de bekostiging plaatsvindt, van de desbetreffende vestiging of vestigingen in het gebied van
      het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel92
    references:
      - id: ref1
