        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '22.2'
    text: 'De algemene maatregel van bestuur, bedoeld in het eerste lid, kan slechts voorschriften inhouden omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel22
  - number: 22.2.a
    text: |-
      de buitenschoolse praktijkcomponent van een leer-werktraject als bedoeld in [artikel 10b1][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 22.2.b
    text: |-
      de stage in de leerwegen genoemd in de [artikelen 10b][ref1] en [10d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 23a
    text: |-
      Het bevoegd gezag draagt zorg voor de kwaliteit van het onderwijs op de school. Onder zorg dragen voor de kwaliteit
      van het onderwijs wordt in elk geval verstaan het naleven van de bij of krachtens deze wet gegeven voorschriften en
      het uitvoeren van het stelsel van kwaliteitszorg, bedoeld in [artikel 24, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 23a1.1
    text: |-
      De kwaliteit van het onderwijs is zeer zwak indien de leerresultaten van het voorbereidend wetenschappelijk
      onderwijs, het hoger algemeen voortgezet onderwijs, het middelbaar algemeen voortgezet onderwijs, het voorbereidend
      beroepsonderwijs, het voorbereidend middelbaar beroepsonderwijs in de theoretische leerweg en de gemengde leerweg,
      het voorbereidend middelbaar beroepsonderwijs in de basisberoepsgerichte leerweg dan wel het voorbereidend
      middelbaar beroepsonderwijs in de kaderberoepsgerichte leerweg ernstig en langdurig tekortschieten en het bevoegd
      gezag in verband met dit tekortschieten eveneens tekortschiet in de naleving van een of meer bij of krachtens deze
      wet gegeven voorschriften. Het bevoegd gezag voldoet in elk geval niet aan de wettelijke opdracht om zorg te dragen
      voor de kwaliteit van het onderwijs, bedoeld in [artikel 23a][ref1], indien de kwaliteit van het onderwijs zeer
      zwak is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel23a1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 23a1.2
    text: |-
      Er is sprake van onvoldoende leerresultaten als bedoeld in het eerste lid indien in de schoolsoort dan wel de
      leerweg, bedoeld in het eerste lid, de gemiddelde eindexamenresultaten en het doorstroomrendement, gemeten over een
      periode van 3 schooljaren, liggen onder de normering, bedoeld in het vierde lid, die daarvoor geldt in vergelijking
      tot die leerresultaten over diezelfde schooljaren van dezelfde schoolsoorten of dezelfde leerwegen met een
      vergelijkbaar leerlingenbestand
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel23a1
  - number: 23a1.3
    text: |-
      Indien de leerresultaten van het onderwijs niet kunnen worden beoordeeld op grond van de regels gesteld bij of
      krachtens het vierde lid, is de kwaliteit van het onderwijs zeer zwak indien het bevoegd gezag ten aanzien van
      het onderwijs, bedoeld in het eerste lid, tekortschiet in de naleving van twee of meer bij of krachtens deze wet
      gegeven voorschriften en het bevoegd gezag dientengevolge tekortschiet in het zorg dragen voor de veiligheid op
      school, bedoeld in [artikel 3b][ref1], of het zodanig inrichten van het onderwijs dat leerlingen een ononderbroken
      ontwikkelingsproces kunnen doorlopen dan wel het afstemmen van het onderwijs op de voortgang in de ontwikkeling van
      de leerlingen, bedoeld in [artikel 2, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel3b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel2
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel23a1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 3b
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '2'
  - number: 23a1.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop
      leerresultaten worden gemeten. Voorts wordt de normering, bedoeld in het tweede lid, bepaald en de aard en het
      aantal van de gegevens die ten minste beschikbaar moeten zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel23a1
  - number: 23b
    text: |-
      Het bevoegd gezag rapporteert over de vorderingen van de leerlingen aan hun ouders, voogden of verzorgers, dan wel
      aan de leerlingen zelf indien zij meerderjarig en handelingsbekwaam zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel23b
  - number: 23c.1
    text: |-
      Indien de inspectie in het inspectierapport, bedoeld in [artikel 20 van de Wet op het onderwijstoezicht][ref1],
      tot het oordeel is gekomen dat de kwaliteit van het onderwijs zeer zwak is, als bedoeld in
      [artikel 23a1, eerste of derde lid][ref2], informeert het bevoegd gezag de ouders van de leerlingen van de school
      hierover door middel van in ieder geval de toezending van de door de inspectie opgestelde samenvatting van het
      inspectierapport welke samenvatting gelijktijdig met het inspectierapport ter beschikking is gesteld van het
      bevoegd gezag. De toezending, bedoeld in de eerste volzin, geschiedt binnen vier weken na de vaststelling van het
      inspectierapport.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 23a1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 23c.2
    text: |-
      Indien het bevoegd gezag niet of niet tijdig voldoet aan de verplichting, bedoeld in het eerste lid, zendt Onze
      Minister de samenvatting van het inspectierapport, bedoeld in het eerste lid, in de vijfde week na vaststelling van
      het inspectie rapport aan de ouders van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel23c
  - number: 23c.3
    text: |-
      Indien de inspectie op basis van een onderzoek als bedoeld in [artikel 11][ref1] of
      [artikel 15 van de Wet op het onderwijstoezicht][ref2] in het inspectierapport, bedoeld in
      [artikel 20 van genoemde wet][ref3], tot het oordeel is gekomen dat sprake is van een zeer zwakke school, betrekt
      het bevoegd gezag de ouders van de leerlingen van de school en de meerderjarige leerlingen bij de door het bevoegd
      gezag voorgenomen maatregelen ten behoeve van kwaliteitsverbetering.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '20'
  - number: '24.1'
    text: |-
      Het schoolplan bevat een beschrijving van het beleid met betrekking tot de kwaliteit van het onderwijs dat
      binnen de school wordt gevoerd, en omvat in elk geval het onderwijskundig beleid, het personeelsbeleid en het
      stelsel van kwaliteitszorg. Het schoolplan omvat mede het beleid ten aanzien van de aanvaarding van materiële
      bijdragen of geldelijke bijdragen, niet zijnde ouderbijdragen of op de onderwijswetgeving gebaseerde bijdragen,
      indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee de leerlingen binnen de schooltijden
      en tijdens de activiteiten die worden georganiseerd onder verantwoordelijkheid van het bevoegd gezag, alsmede
      tijdens het overblijven, zullen worden geconfronteerd. In het schoolplan wordt aangegeven op welke wijze de
      identiteitscommissie, bedoeld in [artikel 53d][ref1], invulling geeft aan het openbare karakter onderscheidenlijk
      de identiteit voor zover het betreft een samenwerkingsschool.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53d
        hoofdstuk: IV
        afdeling: I
  - number: '24.2'
    text: 'De beschrijving van het onderwijskundig beleid omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24
  - number: 24.2.a
    text: |-
      de uitwerking van de wettelijke voorschriften betreffende de uitgangspunten, de doelstelling en de inhoud van het
      onderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24
  - number: 24.2.b
    text: |-
      de door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs in een
      onderwijsprogramma,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24
  - number: 24.2.c
    text: het pedagogisch-didactisch klimaat en het schoolklimaat, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24
  - number: 24.2.d
    text: |-
      het zorg dragen voor de veiligheid op school, bedoeld in [artikel 3b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel3b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 3b
  - number: '24.3'
    text: 'De beschrijving van het personeelsbeleid omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24
  - number: 24.3.a
    text: het voldoen aan de eisen van bevoegdheid en de wijze waarop de bekwaamheid wordt onderhouden,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24
  - number: 24.3.b
    text: |-
      de maatregelen met betrekking tot het personeel die bijdragen aan de ontwikkeling en de uitvoering van het
      onderwijskundig beleid,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24
  - number: 24.3.c
    text: het pedagogisch-didactisch handelen van het onderwijspersoneel,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24
  - number: 24.3.d
    text: cijfers over de mate van evenredige vertegenwoordiging van vrouwen in leidinggevende posities, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24
  - number: 24.3.e
    text: de wijze waarop rekening wordt gehouden met de inbreng van leerlingen op dat beleid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24
  - number: '24.4'
    text: 'De beschrijving van het stelsel van kwaliteitszorg omvat in elk geval het zorg dragen voor:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24
  - number: 24.4.a
    text: |-
      het bewaken dat leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen en dat het onderwijs wordt
      afgestemd op de voortgang in de ontwikkeling van leerlingen, bedoeld in [artikel 2, tweede lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel2
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '2'
  - number: 24.4.b
    text: het vaststellen welke maatregelen ter verbetering nodig zijn.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24
  - number: 24a.1
    text: |-
      De schoolgids bevat voor ouders, voogden, verzorgers en leerlingen informatie over de werkwijze van de school en
      bevat in elk geval informatie over:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
  - number: 24a.1.a
    text: |-
      de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, waaronder, in ieder
      geval met betrekking tot het schooljaar voorafgaande aan het schooljaar waarin de schoolgids wordt vastgesteld en
      onderscheiden naar soort onderwijs, voor elk leerjaar
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
  - number: 24a.1.a.1°
    text: het percentage leerlingen dat doorstroomt naar een hoger leerjaar of een ander soort onderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
  - number: 24a.1.a.2°
    text: |-
      het percentage leerlingen dat de school zonder diploma verlaat en het percentage leerlingen dat voor het eindexamen
      slaagt,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
  - number: 24a.1.b
    text: de wijze waarop aan de ondersteuning van leerlingen die extra ondersteuning behoeven wordt vormgegeven,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
  - number: 24a.1.c.1°
    text: |-
      het totaal aantal uren en het soort activiteiten dat als onderwijstijd als bedoeld in
      [artikel 6g, eerste tot en met vijfde lid][ref1], wordt geprogrammeerd, de vakanties en andere dagen waarop geen
      onderwijs wordt verzorgd, alsmede wat het beleid is ten aanzien van lesuitval,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6g
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 24a.1.c.2°
    text: |-
      de inrichting van het onderwijsprogramma voor de eerste twee leerjaren waarbij wordt aangegeven of sprake is van
      vakoverstijgende programmaonderdelen en de inzet van het personeel daarbij,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
  - number: 24a.1.c.3°
    text: |-
      de invulling van de maatschappelijke stage, bedoeld in [artikel 6f][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6f
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 24a.1.d
    text: |-
      de geldelijke bijdrage, bedoeld in [artikel 27, tweede lid][ref1], waarbij wordt vermeld dat deze vrijwillig is en
      dat het niet voldoen van die bijdrage niet leidt tot het uitsluiten van leerlingen van deelname aan activiteiten,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 24a.1.e
    text: |-
      de rechten en plichten van de ouders, de voogden, de verzorgers, de leerlingen en het bevoegd gezag, waaronder
      de informatie over de klachtenregeling, bedoeld in [artikel 24b][ref1], waarbij wat betreft de leerlingen
      kan worden volstaan met vermelding van de rechten en plichten opgenomen in het leerlingenstatuut, bedoeld in
      [artikel 24g][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel24g
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 24b
        hoofdstuk: I
        paragraaf: '1'
