        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 11c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 11f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref6
        bwb_id: BWBR0002399
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 6g.6
    text: |-
      Het bevoegd gezag beschikt over geordende gegevens over die invulling en over de spreiding van de uren over de
      verschillende leerjaren.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6g
  - number: 6g.7
    text: |-
      De inspectie kan op verzoek van het bevoegd gezag ermee instemmen dat om lichamelijke of psychische redenen voor
      individuele leerlingen wordt afgeweken van het eerste, tweede, derde of vierde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6g
  - number: 6g1.1
    text: In elk schooljaar wordt op ten minste 189 dagen onderwijs verzorgd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6g1
  - number: 6g1.2
    text: |-
      In afwijking van het in het eerste lid genoemde aantal dagen behoeft in het laatste leerjaar geen onderwijs te
      worden verzorgd vanaf de aanvang van het eerste tijdvak waarin het centraal examen wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6g1
  - number: 6g1.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gesteld omtrent vakanties en andere
      dagen waarop geen onderwijs behoeft te worden verzorgd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6g1
  - number: 6g1.4
    text: |-
      Bij ministeriële regeling kunnen begin en eind van vakanties worden vastgesteld, die niet voor alle scholen gelijk
      behoeven te zijn. Daarbij kan het aantal dagen, genoemd in het eerste lid, voor een daarbij aan te geven groep
      scholen hoger of lager worden vastgesteld indien dit noodzakelijk is in verband met de spreiding van de landelijk
      vastgestelde vakanties over verschillende delen van Nederland.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6g1
  - number: 6h.1
    text: |-
      Indien een leerling gedurende een deel van het onderwijsprogramma onderwijs ontvangt op een school voor voortgezet
      speciaal onderwijs, op een school voor speciaal en voortgezet speciaal onderwijs, dan wel op een instelling
      voor speciaal en voortgezet speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref1], telt de tijd
      gedurende welke de leerling dit onderwijs ontvangt mee voor het aantal uren onderwijs dat de leerling ten minste
      moet ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6h
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 6h.2
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de uitvoering van het eerste lid
      alsmede omtrent de aard en de eisen aan de scholen en instellingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6h
  - number: '7.1'
    text: |-
      Voorbereidend wetenschappelijk onderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend
      wetenschappelijk onderwijs en dat mede algemene vorming omvat. Voorbereidend wetenschappelijk onderwijs wordt
      gegeven aan scholen voor voorbereidend wetenschappelijk onderwijs. Deze worden onderscheiden in gymnasia en
      athenea, elk met een cursusduur van zes jaren.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel7
  - number: '7.2'
    text: Aan de gymnasia wordt in elk geval onderwijs verzorgd in Latijnse taal en cultuur en Griekse taal en cultuur.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel7
  - number: '8'
    text: |-
      Hoger algemeen voortgezet onderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend hoger
      beroepsonderwijs en dat mede algemene vorming omvat. Het hoger algemeen voortgezet onderwijs wordt gegeven:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel8
  - number: 8.a
    text: aan scholen met een cursusduur van vijf jaren;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel8
  - number: 8.b
    text: |-
      aan afdelingen van scholen voor middelbaar algemeen voortgezet onderwijs. Deze hebben een cursusduur van twee jaren
      en vangen aan na vier jaren middelbaar algemeen voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel8
  - number: '9'
    text: |-
      Middelbaar algemeen voortgezet onderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend
      beroepsonderwijs dan wel op hoger algemeen voortgezet onderwijs, en dat mede algemene vorming omvat. Het middelbaar
      algemeen voortgezet onderwijs wordt gegeven aan scholen met een cursusduur van vier jaren.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel9
  - number: '10.1'
    text: Aan scholen voor middelbaar algemeen voortgezet onderwijs wordt onderwijs in de theoretische leerweg gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: '10.2'
    text: |-
      Het onderwijs aan scholen voor middelbaar algemeen voortgezet onderwijs is met ingang van het derde leerjaar
      ingericht volgens profielen. Een profiel is een in schooltijd verzorgd samenhangend onderwijsprogramma, zodanig
      ingericht dat het biedt:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.2.a
    text: een algemene maatschappelijke voorbereiding en persoonlijke vorming,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.2.b
    text: een voorbereiding op naar inhoud verwante opleidingen in het aansluitend beroepsonderwijs, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.2.c
    text: een voorbereiding op het hoger algemeen voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: '10.3'
    text: 'De school verzorgt alle profielen. De profielen zijn:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.3.a
    text: techniek,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.3.b
    text: zorg en welzijn,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.3.c
    text: economie, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.3.d
    text: groen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: '10.4'
    text: 'Elk profiel bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.4.a
    text: een gemeenschappelijk deel, dat voor alle profielen gelijk is,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.4.b
    text: een profieldeel, dat kenmerkend is voor dat profiel, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.4.c
    text: een vrij deel, dat bestaat uit door de leerling te kiezen vakken en andere programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: '10.5'
    text: |-
      Het gemeenschappelijk deel van elk profiel in de theoretische leerweg omvat Nederlandse taal, Engelse taal,
      maatschappijleer, lichamelijke opvoeding en ten minste één van de vakken behorende tot de beeldende vorming,
      muziek, dans of drama.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: '10.6'
    text: 'Het profieldeel van de theoretische leerweg omvat wat betreft:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.6.a
    text: 'het profiel techniek: wiskunde en natuur- en scheikunde I,'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.6.b
    text: |-
      het profiel zorg en welzijn: biologie en, ter keuze van de leerling, wiskunde, maatschappijkunde, geschiedenis en
      staatsinrichting, of aardrijkskunde, met dien verstande dat het bevoegd gezag beslist welke van de laatste drie
      vakken wordt of worden aangeboden,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.6.c
    text: 'het profiel economie: economie en, ter keuze van de leerling, wiskunde, Franse taal of Duitse taal,'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.6.d
    text: 'het profiel groen: wiskunde en, ter keuze van de leerling, biologie of natuur- en scheikunde I.'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: '10.7'
    text: 'Het vrije deel van de theoretische leerweg:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.7.a
    text: omvat door de leerling te kiezen vakken, genoemd in het zesde lid,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.7.b
    text: |-
      kan omvatten natuur- en scheikunde II, Spaanse taal, Turkse taal, Arabische taal, vakken behorende tot de beeldende
      vorming, muziek, dans, drama, Friese taal en cultuur, lichamelijke opvoeding 2 en informatietechnologie, door de
      leerling te kiezen, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.7.c
    text: kan omvatten door het bevoegd gezag vast te stellen vakken en programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10.7a
    text: |-
      Het bevoegd gezag stelt de leerling in de gelegenheid om, indien de leerling dat wenst, naast het
      onderwijsprogramma, bestaande uit de in het vierde lid bedoelde delen, beroepsgerichte keuzevakken als bedoeld in
      [artikel 10d][ref1] te volgen. Het achtste en tiende lid van artikel 10d zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '10.8'
    text: |-
      Het bevoegd gezag beslist welke keuzetaal, genoemd in het zesde lid, onderdeel c, en welke vakken, genoemd in het
      zevende lid, onderdeel b, worden aangeboden. Het bevoegd gezag kan tevens beslissen dat door het bevoegd gezag aan
      te wijzen vakken en andere programma-onderdelen, bedoeld in het zevende lid, onderdeel c, door alle leerlingen in
      het vrije deel moeten worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: '10.9'
    text: |-
      Het bevoegd gezag kan de leerling in de gelegenheid stellen, in plaats van de vakken, genoemd in het vijfde,
      zesde en zevende lid, onderdeel b, de overeenkomstige vakken, genoemd in dan wel aangewezen op grond van de
      [artikelen 13][ref1] en [14][ref2] te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel14
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '10.10'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld over de mogelijkheid van vrijstelling en de
      bevoegdheid van het bevoegd gezag om ontheffing te verlenen van onderdelen van dit artikel. Onverminderd het zesde
      en zevende lid, kan bij algemene maatregel van bestuur worden vastgesteld het door alle leerlingen in het derde
      leerjaar te volgen minimum aantal vakken waarin eindexamen kan worden afgelegd, alsmede welke vakken het betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10
  - number: 10a
    text: |-
      Voorbereidend beroepsonderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend beroepsonderwijs,
      bedoeld in [artikel 7.2.2, eerste lid, onderdelen b, c en d, van de Wet educatie en beroepsonderwijs][ref1] en dat
      mede algemene vorming omvat. Het voorbereidend beroepsonderwijs wordt gegeven aan scholen met een cursusduur van
      vier jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 10b.1
    text: |-
      Aan scholen voor voorbereidend beroepsonderwijs wordt, in elk profiel als bedoeld in het derde lid, onderwijs in de
      basisberoepsgerichte leerweg en de kaderberoepsgerichte leerweg gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.2
    text: |-
      Het onderwijs aan scholen voor voorbereidend beroepsonderwijs is met ingang van het derde leerjaar ingericht
      volgens profielen. Een profiel is een in schooltijd verzorgd samenhangend onderwijsprogramma, zodanig ingericht dat
      het biedt:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.2.a
    text: een algemene maatschappelijke voorbereiding en persoonlijke vorming, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.2.b
    text: een voorbereiding op naar inhoud verwante opleidingen in het aansluitend beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.3
    text: 'De school verzorgt één of meer profielen. De profielen zijn:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.3.a
    text: bouwen, wonen en interieur,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.3.b
    text: produceren, installeren en energie,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.3.c
    text: mobiliteit en transport,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.3.d
    text: media, vormgeving en ICT,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.3.e
    text: maritiem en techniek,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.3.f
    text: zorg en welzijn,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.3.g
    text: economie en ondernemen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.3.h
    text: horeca, bakkerij en recreatie,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.3.i
    text: groen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.3.j
    text: dienstverlening en producten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.4
    text: 'Elk profiel bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.4.a
    text: een gemeenschappelijk deel, dat voor alle profielen gelijk is,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.4.b
    text: een profieldeel, dat kenmerkend is voor dat profiel, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.4.c
    text: een vrij deel, dat bestaat uit door de leerling te kiezen vakken en andere programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.5
    text: |-
      Het gemeenschappelijk deel van elk profiel in de beroepsgerichte leerwegen omvat Nederlandse taal, Engelse taal,
      maatschappijleer, lichamelijke opvoeding en ten minste één van de vakken behorende tot de beeldende vorming,
      muziek, dans of drama.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.6
    text: |-
      Het profieldeel van de beroepsgerichte leerwegen omvat het bij het betreffende profiel behorende profielvak en,
      wat betreft:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.6.a
    text: 'de profielen, genoemd in het derde lid, onderdelen a tot en met e: wiskunde en natuur- en scheikunde I,'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.6.b
    text: |-
      het profiel, genoemd in het derde lid, onderdeel f: biologie en, ter keuze van de leerling, wiskunde,
      maatschappijkunde, geschiedenis en staatsinrichting, of aardrijkskunde, met dien verstande dat het bevoegd gezag
      beslist welke van de laatste drie vakken wordt of worden aangeboden,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.6.c
    text: |-
      de profielen, genoemd in het derde lid, onderdelen g en h: economie en, ter keuze van de leerling, wiskunde, Franse
      taal of Duitse taal,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.6.d
    text: |-
      het profiel genoemd in het derde lid, onderdeel i: wiskunde en, ter keuze van de leerling, biologie of natuur- en
      scheikunde I,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.6.e
    text: |-
      het profiel genoemd in het derde lid, onderdeel j: ter keuze van de leerling twee van de vakken wiskunde, economie,
      biologie en natuur- en scheikunde I.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.7
    text: 'Het vrije deel van elk profiel in de beroepsgerichte leerwegen:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.7.a
    text: omvat door de leerling te kiezen beroepsgerichte keuzevakken,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.7.b
    text: kan omvatten door het bevoegd gezag vast te stellen vakken en programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.8
    text: |-
      Het bevoegd gezag beslist welke keuzetaal, genoemd in het zesde lid, onderdeel c, en welke beroepsgerichte
      keuzevakken, bedoeld in het zevende lid, onderdeel a, worden aangeboden. Het bevoegd gezag kan tevens beslissen dat
      door het bevoegd gezag aan te wijzen vakken en andere programma-onderdelen, bedoeld in het zevende lid, onderdeel
      b, door alle leerlingen in het vrije deel moeten worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.9
    text: 'Het bevoegd gezag kan de leerling in de gelegenheid stellen:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.9.a
    text: |-
      in plaats van de vakken van de basisberoepsgerichte leerweg, genoemd in het vijfde en zesde lid, en de vakken
      die in de plaats komen van een tweede moderne vreemde taal, de overeenkomstige vakken van de kaderberoepsgerichte
      leerweg of de overeenkomstige vakken, genoemd in de [artikelen 10][ref1] en [10d][ref2] of de overeenkomstige
      vakken, genoemd in dan wel aangewezen op grond van de [artikelen 13][ref3] en [14][ref4] te volgen,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel14
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b.9.b
    text: |-
      in plaats van de vakken van de kaderberoepsgerichte leerweg, genoemd in het vijfde en zesde lid, en de
      vakken die in de plaats komen van een tweede moderne vreemde taal, de overeenkomstige vakken, genoemd in
      de[ artikelen 10][ref1] en [10d][ref2] of de overeenkomstige vakken, genoemd in dan wel aangewezen op grond van de
      [artikelen 13][ref3] en [14][ref4] te volgen,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel14
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b.9.c
    text: |-
      in plaats van de vakken van de basisberoepsgerichte leerweg, genoemd in het zevende lid, onderdeel a, de
      overeenkomstige vakken van de kaderberoepsgerichte leerweg te volgen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.9.d
    text: een of meer bij algemene maatregel van bestuur aan te wijzen extra vakken te volgen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.10
    text: 'Bij of krachtens algemene maatregel van bestuur worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.10.a
    text: de profielvakken, bedoeld in het zesde lid,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.10.b
    text: voorschriften met betrekking tot de beroepsgerichte keuzevakken, bedoeld in het zevende lid, onderdeel a, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.10.c
    text: |-
      voorschriften over de mogelijkheid van vrijstelling en de bevoegdheid van het bevoegd gezag om ontheffing te
      verlenen van onderdelen van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b.11
    text: |-
      Onverminderd het zesde en zevende lid, kan bij algemene maatregel van bestuur worden vastgesteld het door alle
      leerlingen in het derde leerjaar te volgen minimum aantal vakken waarin eindexamen kan worden afgelegd, alsmede
      welke vakken het betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b
  - number: 10b1.1
    text: |-
      Het bevoegd gezag kan de basisberoepsgerichte leerweg mede inrichten als leer-werktraject. Een leer-
      werktraject is een leerroute binnen de basisberoepsgerichte leerweg met een buitenschools praktijkgedeelte
      dat ten minste 640 klokuren, verzorgd in 80 dagen, en ten hoogste 1280 klokuren, verzorgd in 160 dagen,
      omvat van de gezamenlijke onderwijstijd van het derde en vierde leerjaar en welk traject specifiek is
      gericht op het behalen van een startkwalificatie op het niveau van de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onder b, van de Wet educatie en beroepsonderwijs][ref1]. Elke schoolweek in het derde
      en vierde leerjaar omvat ten minste binnenschools onderricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 10b1.2
    text: 'Een leer-werktraject omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b1
  - number: 10b1.2.a
    text: Nederlandse taal, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b1
  - number: 10b1.2.b
    text: een beroepsgericht programma.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b1
  - number: 10b1.3
    text: |-
      Het bevoegd gezag kan, na overleg met de leerling of diens wettelijk vertegenwoordiger, beslissen dat het leer-
      werktraject voor die leerling eveneens een of meer andere vakken van de basisberoepsgerichte leerweg omvat.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b1
  - number: 10b1.4
    text: |-
      Een leer-werktraject kan een maatschappelijke stage als bedoeld in [artikel 6f][ref1], omvatten, indien het
      onderdeel uitmaakt van het onderwijsprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6f
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b2
    text: 'Het bevoegd gezag stelt bij de inrichting van het leer-werktraject in elk geval vast:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b2
  - number: 10b2.a
    text: |-
      de organisatie van de leerlingbegeleiding vanwege het bevoegd gezag zowel binnen de school als bij het bedrijf dat
      of de organisatie die het buitenschoolse praktijkgedeelte verzorgt, alsmede
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b2
  - number: 10b2.b
    text: |-
      de invulling van het buitenschoolse praktijkgedeelte en waarborgt daarbij dat niet uitsluitend eenzijdige
      productiearbeid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b2
  - number: 10b3.1
    text: |-
      Het buitenschoolse praktijkgedeelte wordt verzorgd door een bedrijf of organisatie, op grondslag van een leer-
      werkovereenkomst, gesloten door het bevoegd gezag, de betrokken leerling of diens wettelijk vertegenwoordiger en
      dat bedrijf of die organisatie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b3
  - number: 10b3.2
    text: 'De leer-werkovereenkomst regelt de rechten en plichten van partijen en omvat ten minste bepalingen over:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b3
  - number: 10b3.2.a
    text: inhoud, leerdoelen, duur, periode van en beoordelingsmaatstaven voor het buitenschoolse praktijkgedeelte,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b3
  - number: 10b3.2.b
    text: de begeleiding van de leerling, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b3
  - number: 10b3.2.c
    text: de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden ontbonden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b3
  - number: 10b3.3
    text: |-
      In afwijking van [artikel 7:610, tweede lid tweede volzin, van het Burgerlijk Wetboek][ref1], is in geval van
      strijd als bedoeld in die volzin, [artikel 10b3][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b3
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b3
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b4.1
    text: |-
      Het bedrijf dat of de organisatie die het buitenschoolse praktijkgedeelte verzorgt, draagt zorg voor de begeleiding
      van de leerlingen binnen het bedrijf respectievelijk de organisatie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b4
  - number: 10b4.2
    text: |-
      Het bestuur van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven, bedoeld in
      [artikel 1.5.1 van de Wet educatie en beroepsonderwijs][ref1], zorgt ervoor dat bedrijven en organisaties die
      het buitenschoolse praktijkgedeelte verzorgen eenmaal in de vier jaar worden beoordeeld aan de hand van de
      kwaliteitseisen in [artikel 10b6][ref2]. Indien daartoe door bijzondere omstandigheden aanleiding bestaat kan
      controle frequenter plaats vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b6
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b6
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b4.3
    text: |-
      Het bestuur van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven erkent een bedrijf of organisatie als
      leerbedrijf voor het buitenschoolse praktijkgedeelte of handhaaft de erkenning bij een gunstige beoordeling op
      grond van het tweede lid, eerste volzin. Het bestuur weigert de erkenning of trekt de erkenning in, indien de in
      het tweede lid, eerste volzin, bedoelde beoordeling ongunstig is.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b4
  - number: 10b4.4
    text: |-
      Het bestuur vraagt geen vergoeding voor de kosten van de beoordeling, bedoeld in het tweede lid, en de
      beschikkingen, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b4
  - number: 10b4.5
    text: |-
      De erkenning vervalt van rechtswege als het leerbedrijf gedurende een aaneengesloten periode van vier jaar geen
      buitenschools praktijkgedeelte heeft verzorgd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b4
  - number: 10b4.6
    text: |-
      Indien het bevoegd gezag na het sluiten van de leer-werkovereenkomst vaststelt dat de praktijkplaats niet of niet
      volledig beschikbaar is, de begeleiding tekortschiet of ontbreekt, of sprake is van andere omstandigheden die maken
      dat het buitenschoolse praktijkgedeelte niet naar behoren zal kunnen worden verzorgd, bevordert het bevoegd gezag,
      na overleg met het bestuur van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven dat een toereikende
      vervangende voorziening beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b4
  - number: 10b4.7
    text: |-
      De Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven draagt zorg voor openbaarmaking van een actueel
      overzicht van organisaties met een erkenning als leerbedrijf als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b4
  - number: 10b4.8
    text: |-
      Tot het verzorgen van het buitenschoolse praktijkgedeelte zijn uitsluitend bevoegd de bedrijven en organisaties met
      een erkenning op grond van het derde lid, eerste volzin.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b4
  - number: 10b5.1
    text: |-
      Onze Minister verstrekt de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven, bedoeld in
      [artikel 1.5.1 van de Wet educatie en beroepsonderwijs][ref1], binnen het raam van de door de begrotingswetgever
      beschikbaar gestelde middelen subsidie voor de uitvoering van de taken, bedoeld in [artikel 10b4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b4
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b4
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b5.2
    text: |-
      De subsidie wordt per boekjaar verstrekt. De [artikelen 2.4.2][ref1] en
      [2.4.3 van de Wet educatie en beroepsonderwijs][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 10b6.1
    text: |-
      Tot het verzorgen van het buitenschoolse praktijkgedeelte zijn uitsluitend bevoegd bedrijven en organisaties ten
      aanzien waarvan wordt voldaan aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b6
  - number: 10b6.1.a
    text: |-
      op de leer-werkplek of combinatie van leer-werkplekken kunnen de door het bevoegd gezag vastgestelde
      praktijkopdrachten daadwerkelijk worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b6
  - number: 10b6.1.b
    text: elke praktijkopdracht als zodanig kan in één bedrijf of organisatie worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b6
  - number: 10b6.1.c
    text: |-
      in het bedrijf of de organisatie is een gekwalificeerde praktijkbegeleider of leermeester aanwezig, die in staat is
      om kennis, inzicht en vaardigheden van de leerling te beoordelen, alsmede vorderingen daarin, en de leerling zowel
      werkinhoudelijk als pedagogisch-didactisch te begeleiden;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b6
  - number: 10b6.1.d
    text: |-
      het bedrijf of de organisatie is bereid met de in het tweede lid bedoelde mentor of docentbegeleider contact te
      onderhouden;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b6
  - number: 10b6.1.e
    text: |-
      de mogelijkheid om binnen hetzelfde bedrijf of dezelfde organisatie, dezelfde moederorganisatie of dezelfde
      branche de leerdoelen van het voorbereidend middelbaar beroepsonderwijs en de eindtermen van de entreeopleiding
      of basisberoepsopleiding, bedoeld in de [Wet educatie en beroepsonderwijs][ref1] te behalen, zonder grote
      overgangsdrempels voor de leerling;


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b6
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 10b6.1.f
    text: |-
      het bedrijf of de organisatie waarborgt dat een gekwalificeerde praktijkbegeleider of leermeester is gekoppeld
      aan een leerling, en dat deze leermeester ervoor zorgt dat de leerling voldoende hulp en tijd krijgt om de
      praktijkopdrachten uit te voeren;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b6
  - number: 10b6.1.g
    text: |-
      het productie- of dienstverleningsproces is technisch en organisatorisch voldoende gevarieerd en kan leerlingen
      goed praktijkmateriaal bieden en hen gedegen opleiden;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b6
  - number: 10b6.1.h
    text: de leer-werkplek past binnen de dagelijkse bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b6
  - number: 10b6.1.i
    text: |-
      het bedrijf of de organisatie is bereid de leerling de vereiste praktijkopdrachten uit te laten voeren en het werk
      en het stageverslag te bespreken en te beoordelen;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b6
  - number: 10b6.1.j
    text: |-
      het bedrijf of de organisatie is geschikt voor de betrokken leeftijdsgroep waar het gaat om onder meer ruimte om te
      leren of fouten te maken, erkenning van jong zijn;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b6
  - number: 10b6.1.k
    text: |-
      het bedrijf of de organisatie respecteert, voor zover van toepassing, het multiculturele karakter van de
      leerlingenpopulatie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b6
  - number: 10b6.2
    text: |-
      Het bevoegd gezag draagt zorg voor beschikbaarheid van een gekwalificeerde mentor of docentbegeleider die de
      voortgang op de leer-werkplek alsmede de integratie tussen het binnenschools en buitenschools programma bewaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b6
  - number: 10b7.1
    text: |-
      Leer-werktrajecten worden verzorgd op grondslag van een samenwerkingsovereenkomst tussen het
      bevoegd gezag van de school en het bevoegd gezag van een regionaal opleidingencentrum of een
      agrarisch opleidingscentrum voor zover aan die instelling een basisberoepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder b, van de Wet educatie en beroepsonderwijs][ref1] wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 10b7.2
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in het eerste lid voorziet in elk geval in de
      inrichting van een doorlopende leerweg tot en met de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onder b, van de Wet educatie en beroepsonderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 10b8.1
    text: |-
      Het bevoegd gezag kan bij de school ingeschreven leerlingen die daarbij naar zijn oordeel gebaat
      zijn, in de gelegenheid stellen om geheel of gedeeltelijk in plaats van de basisberoepsgerichte
      leerweg een entreeopleiding te volgen, met inachtneming van de [artikelen 7.2.7][ref1] en
      [8.1.1, derde lid, van de Wet educatie en beroepsonderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
  - number: 10b8.2
    text: |-
      De entreeopleiding stemt overeen met het programma-aanbod van de beroepsgerichte programma’s van de
      basisberoepsgerichte leerweg die aan de school wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b8
  - number: 10b8.3
    text: |-
      Het bevoegd gezag is niet gehouden, leerlingen die een entreeopleiding volgen als bedoeld in het eerste lid,
      gelegenheid te geven om aan de school een eindexamen in de basisberoepsgerichte leerweg af te leggen als bedoeld in
      [artikel 29, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b8
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 10b8.4
    text: |-
      Leerlingen die een entreeopleiding volgen als bedoeld in het eerste lid, worden aangemerkt als leerlingen van de
      basisberoepsgerichte leerweg waarvoor de entreeopleiding geheel of gedeeltelijk in de plaats treedt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b8
  - number: 10b8.5
    text: |-
      Ten aanzien van bij de school ingeschreven leerlingen jonger dan 16 jaar wordt de entreeopleiding verzorgd met
      inachtneming van de volgende vereisten:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b8
  - number: 10b8.5.a
    text: |-
      de beroepspraktijkvorming, bedoeld in de [artikelen 7.2.8][ref1] en
      [7.2.9 van de Wet educatie en beroepsonderwijs][ref2], omvat uitsluitend het verrichten van lichte arbeid van
      geschikte aard,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 10b8.5.b
    text: |-
      in plaats van de basisberoepsgerichte leerweg wordt geheel of gedeeltelijk zowel binnenschools als buitenschools
      onderricht in de praktijk van het beroep verzorgd,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b8
  - number: 10b8.5.c
    text: |-
      een gekwalificeerde mentor of docentbegeleider bewaakt de voortgang van het onderricht in de praktijk van het
      beroep, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b8
  - number: 10b8.5.d
    text: het binnenschools en buitenschools onderricht in de praktijk van het beroep worden geïntegreerd verzorgd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b8
  - number: 10b9.1
    text: |-
      De entreeopleiding, bedoeld in [artikel 10b8][ref1], wordt onder verantwoordelijkheid van het bevoegd gezag
      verzorgd op grond van een samenwerkingsovereenkomst tussen het bevoegd gezag van de school en het bevoegd gezag van
      een instelling voor beroepsonderwijs waarvan het onderwijsaanbod mede deze entreeopleiding omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b8
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b9
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b8
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b9.2
    text: 'Een samenwerkingsovereenkomst als bedoeld in het eerste lid voorziet in elk geval in afspraken over:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b9
  - number: 10b9.2.a
    text: de entreeopleiding die geheel of gedeeltelijk in plaats van de basisberoepsgerichte leerweg zal worden verzorgd,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b9
  - number: 10b9.2.b
    text: de inschrijving van leerlingen als extraneus bij de instelling,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b9
  - number: 10b9.2.c
    text: de examinering en diplomering door de instelling,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b9
  - number: 10b9.2.d
    text: |-
      de invulling van de betrokkenheid van het bevoegd gezag bij de beroepspraktijkvorming, bedoeld in de
      [artikelen 7.2.8][ref1] en [7.2.9 van de Wet educatie en beroepsonderwijs][ref2], met dien verstande dat het
      bevoegd gezag de in dat [artikel 7.2.9][ref3] bedoelde overeenkomst mede ondertekent,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 10b9.2.e
    text: |-
      de toepassing van [artikel 10b8, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b8
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b9
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b8
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b9.2.f
    text: de rechtsbescherming van de leerling, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b9
  - number: 10b9.2.g
    text: de doorstroom van de leerlingen na het met goed gevolg afsluiten van de entreeopleiding.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b9
  - number: 10b9.3
    text: |-
      In geval van toepassing van [artikel 7.4.4a, derde lid, van de Wet educatie en beroepsonderwijs][ref1], is het
      bevoegd gezag belast met de uitvoering van de daar bedoelde examinering.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 10b9.4
    text: |-
      Indien het bevoegd gezag tevens het bevoegd gezag is van een instelling voor beroepsonderwijs, regelt het bevoegd
      gezag op overeenkomstige wijze de onderwerpen, genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b9
  - number: 10b10.1
    text: |-
      Het bevoegd gezag van een school voor middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend
      beroepsonderwijs kan leerlingen een doorlopende leerroute vmbo-mbo aanbieden, met inachtneming van de
      [artikelen 10b11 tot en met 10b20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '11'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b10.2
    text: |-
      Een doorlopende leerroute vmbo-mbo is een onderwijsprogramma vanaf het derde leerjaar aan een school voor
      middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend beroepsonderwijs, dat opleidt tot zowel
      een diploma voorbereidend middelbaar beroepsonderwijs als bedoeld in [artikel 29, derde lid][ref1], als het diploma
      van een basisberoepsopleiding, vakopleiding of middenkaderopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 10b10.3
    text: 'In een doorlopende leerroute vmbo-mbo worden tot één onderwijsprogramma geïntegreerd:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b10
  - number: 10b10.3.a
    text: |-
      de basisberoepsgerichte leerweg en een basisberoepsopleiding in een aanverwant opleidingsdomein of een aanverwante
      kwalificatie;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b10
  - number: 10b10.3.b
    text: |-
      de kaderberoepsgerichte leerweg en een vakopleiding in een aanverwant opleidingsdomein of een aanverwante
      kwalificatie;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b10
  - number: 10b10.3.c
    text: |-
      de kaderberoepsgerichte, gemengde of theoretische leerweg en een middenkaderopleiding in een aanverwant
      opleidingsdomein of een aanverwante kwalificatie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b10
  - number: 10b10.4
    text: |-
      Een doorlopende leerroute vmbo-mbo stemt wat betreft het daarvan onderdeel uitmakende voortgezet onderwijs overeen
      met een of meer van de profielen, bedoeld in [artikel 10][ref1], [10b][ref2] of [10d][ref3], die aan de school
      worden verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b10.5
    text: |-
      Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op een agrarisch opleidingscentrum wat betreft
      het voorbereidend beroepsonderwijs dat daaraan wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b10
  - number: 10b11.1
    text: |-
      Een doorlopende leerroute vmbo-mbo wordt op grond van een samenwerkingsovereenkomst gezamenlijk verzorgd door het
      bevoegd gezag van een school en het bevoegd gezag van een instelling voor beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b11
  - number: 10b11.2
    text: 'In de samenwerkingsovereenkomst zijn in elk geval afspraken opgenomen over:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b11
  - number: 10b11.2.a
    text: |-
      het profiel en het aanverwante opleidingsdomein of de aanverwante kwalificatie waarin de doorlopende leerroute
      vmbo-mbo wordt aangeboden;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b11
  - number: 10b11.2.b
    text: |-
      de vormgeving van de leiding over de doorlopende leerroute vmbo-mbo, waaronder de samenstelling en de wijze van
      benoeming van die leiding en de taken en bevoegdheden die door de bevoegde gezagsorganen van de school en de
      instelling voor beroepsonderwijs zijn opgedragen aan die leiding;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b11
  - number: 10b11.2.c
    text: |-
      de wijze waarop de leiding over de doorlopende leerroute vmbo-mbo inlichtingen verstrekt en verantwoording aflegt
      aan de bevoegde gezagsorganen van de school en de instelling voor beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b11
  - number: 10b11.2.d
    text: |-
      de organisatorische en onderwijskundige inrichting van de doorlopende leerroute, waaronder de inzet van personeel
      en het gebruik van faciliteiten van de aan de overeenkomst deelnemende partijen;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b11
  - number: 10b11.2.e
    text: |-
      in geval van overdracht van een deel van de door de school of instelling voor
      beroepsonderwijs ontvangen bekostiging met toepassing van [artikel 96t][ref1] respectievelijk
      [artikel 8.5a.16 van de Wet educatie en beroepsonderwijs][ref2], de omvang en de bestemming van de over te dragen
      middelen;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96t
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b11
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 96t
        hoofdstuk: III
        paragraaf: '4'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
  - number: 10b11.2.f
    text: |-
      de inhoud van de overstapoptie, bedoeld in [artikel 10b20][ref1] en
      [artikel 8.5a.15 van de Wet educatie en beroepsonderwijs][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b20
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b11
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b20
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
  - number: 10b11.2.g
    text: de wijze waarop het bedrijfsleven zal worden betrokken bij de invulling van de doorlopende leerroute vmbo-mbo;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b11
  - number: 10b11.2.h
    text: de wijze van geschilbeslechting tussen de deelnemende partijen over de uitvoering van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b11
  - number: 10b11.2.i
    text: |-
      de voorwaarden waaronder een andere school of een andere instelling voor beroepsonderwijs partij kan worden bij de
      overeenkomst, de voorwaarden waaronder de overeenkomst kan worden opgezegd of ontbonden, alsmede de wijze waarop
      de overeenkomst in andere gevallen kan worden gewijzigd, telkens met het oog op het zoveel mogelijk beperken van de
      gevolgen voor de leerlingen en mbo-studenten; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b11
  - number: 10b11.2.j
    text: |-
      de inrichting van de medezeggenschap door de medezeggenschapsorganen van de school onderscheidenlijk de instelling
      voor beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b11
  - number: 10b11.3
    text: |-
      Het tweede lid is niet van toepassing indien de doorlopende leerroute vmbo-mbo volledig wordt verzorgd binnen een
      verticale scholengemeenschap of een agrarisch opleidingscentrum. In plaats daarvan regelt het bevoegd gezag van
      de verticale scholengemeenschap of van het agrarisch opleidingscentrum op overeenkomstige wijze de onderwerpen,
      genoemd in het tweede lid, met uitzondering van de onderdelen h tot en met j van dat lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b11
  - number: 10b12.1
    text: |-
      Het bevoegd gezag van een school en het bevoegd gezag van een instelling voor beroepsonderwijs melden gezamenlijk
      aan Onze Minister dat zij een doorlopende leerroute vmbo-mbo aanbieden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b12
  - number: 10b12.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een agrarisch opleidingscentrum dat een doorlopende leerroute
      vmbo-mbo aanbiedt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b12
  - number: 10b13.1
    text: |-
      Een doorlopende leerroute vmbo-mbo wordt aangeboden op de locatie van de school of van de instelling voor
      beroepsonderwijs die de doorlopende leerroute vmbo-mbo verzorgt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b13
  - number: 10b13.2
    text: |-
      Het bevoegd gezag van de school en het bevoegd gezag van de instelling voor beroepsonderwijs beschrijven voor de
      gehele doorlopende leerroute vmbo-mbo het onderwijsprogramma en de examinering per leerjaar. Daarbij wordt vermeld
      welke delen van het onderwijsprogramma en van het examen:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b13
  - number: 10b13.2.a
    text: voortgezet onderwijs betreffen, en welk deel daarbinnen vakoverstijgend is;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b13
  - number: 10b13.2.b
    text: beroepsonderwijs betreffen;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b13
  - number: 10b13.2.c
    text: |-
      een combinatie van voortgezet onderwijs en beroepsonderwijs betreffen, en welk deel daarbinnen voortgezet onderwijs
      onderscheidenlijk beroepsonderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b13
  - number: 10b13.3
    text: |-
      Bij de beschrijving van het onderwijsprogramma wordt tevens vermeld bij welk deel daarvan gebruik wordt gemaakt van
      een team als bedoeld in [artikel 33, lid 5a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b13
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 10b13.4
    text: |-
      De leerling in een doorlopende leerroute vmbo-mbo kan in de gelegenheid gesteld worden om delen van het
      onderwijsprogramma te volgen en examens af te leggen die behoren tot de van die doorlopende leerroute deel
      uitmakende beroepsopleiding.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b13
  - number: 10b13.5
    text: |-
      De school kan aan een voormalige leerling, nadat die ingevolge [artikel 10b14, tweede lid][ref1], als mbo-student
      is ingeschreven aan een instelling voor beroepsonderwijs, delen van het onderwijsprogramma van een doorlopende
      leerroute vmbo-mbo aanbieden, die behoren tot het van die doorlopende leerroute deel uitmakende middelbaar algemeen
      voortgezet onderwijs of voorbereidend beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b14
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b13
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b14
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b14.1
    text: |-
      Een leerling die een doorlopende leerroute vmbo-mbo volgt, wordt gedurende de eerste twee leerjaren van
      die doorlopende leerroute vmbo-mbo aangemerkt als leerling van de leerweg en het profiel, bedoeld in
      [artikel 10][ref1], [10b][ref2] of [10d][ref3], die deel uitmaken van de door die leerling gevolgde doorlopende
      leerroute vmbo-mbo.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b14
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b14.2
    text: |-
      Een leerling in een doorlopende leerroute vmbo-mbo wordt met ingang van het derde leerjaar van die doorlopende
      leerroute vmbo-mbo uitgeschreven als leerling aan de school en wordt ingeschreven als mbo-student bij de instelling
      voor beroepsonderwijs, die het beroepsonderwijs binnen de doorlopende leerroute vmbo-mbo verzorgt. Het bevoegd gezag
      van de school overlegt daartoe aan het bevoegd gezag van de instelling voor beroepsonderwijs de gegevens van die
      leerling, bedoeld in [artikel 8.1.1a, eerste lid, eerste volzin, van de Wet educatie en beroepsonderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b14
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
  - number: 10b15.1
    text: 'Het bevoegd gezag van de school draagt de gehele cursusduur van een doorlopende leerroute vmbo-mbo zorg voor:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b15
  - number: 10b15.1.a
    text: |-
      de uitvoering van delen van het onderwijsprogramma die behoren tot het middelbaar algemeen voortgezet onderwijs
      of voorbereidend beroepsonderwijs dat deel uitmaakt van het onderwijsprogramma van die doorlopende leerroute vmbo-
      mbo; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b15
  - number: 10b15.1.b
    text: |-
      de examinering en diplomering betreffende het middelbaar algemeen voortgezet onderwijs of voorbereidend
      beroepsonderwijs dat deel uitmaakt van het onderwijsprogramma van die doorlopende leerroute vmbo-mbo.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b15
  - number: 10b15.2
    text: |-
      Ten aanzien van de onderdelen van een doorlopende leerroute vmbo-mbo, bedoeld in het eerste lid, die in
      het derde leerjaar van die route plaatsvinden, is het bepaalde bij of krachtens de [artikelen 103a][ref1]
      en [103b, eerste, vierde, zevende, tiende en twaalfde tot en met vijftiende lid][ref2], [103c][ref3] en
      [103d][ref4], alsmede het bepaalde bij of krachtens de [artikelen 10][ref5], [12][ref6], [14][ref7], [15][ref8] en
      [25 van de Wet register onderwijsdeelnemers][ref9] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel103c
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel103d
      [ref5]: https://wetten.overheid.nl/BWBR0042012#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0042012#Artikel12
      [ref7]: https://wetten.overheid.nl/BWBR0042012#Artikel14
      [ref8]: https://wetten.overheid.nl/BWBR0042012#Artikel15
      [ref9]: https://wetten.overheid.nl/BWBR0042012#Artikel25
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b15
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103a
        hoofdstuk: IV
        afdeling: II
      - id: ref2
