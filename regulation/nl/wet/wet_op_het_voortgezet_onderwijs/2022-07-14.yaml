        bwb_id: BWBR0002399
        artikel: '69'
        paragraaf: '1'
        afdeling: I
  - number: 118ee.2
    text: |-
      Toepassing van [artikel 107, derde lid][ref1], zoals luidend ingevolge de Wet van 25 mei 2018 tot wijziging van
      onder meer de Wet op het voortgezet onderwijs en de Wet voortgezet onderwijs BES in verband met modernisering van
      de bepalingen over voorzieningenplanning (Stb. 2018, 156) leidt niet eerder dan 2 jaar na inwerkingtreding van
      genoemd artikellid tot het opheffen van een openbare school of het beëindigen van de bekostiging van een bijzondere
      school.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118ee
    references:
