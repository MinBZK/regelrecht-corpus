  - number: '121.2'
    text: |-
      Een krachtens [artikel 6g1, derde lid][ref1], [10, tiende lid][ref2], [10b, tiende of elfde lid][ref3],
      [10d, tiende of elfde lid][ref4], [10f, vijfde lid][ref5], [11b][ref6], [11c, tweede lid][ref7],
      [15][ref8], [22, eerste lid][ref9], [24a, tweede lid][ref10], [29, vierde lid][ref11],
      [36, eerste, tweede of derde lid][ref12], [38, tweede lid][ref13], [96n, eerste lid][ref14],
      [103b, zevende lid][ref15], [118l, derde lid, onderdeel b][ref16], of [118r, eerste lid][ref17], vastgestelde
      algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal overgelegd. Hij treedt in werking
      op een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij koninklijk besluit wordt vastgesteld,
      tenzij binnen die termijn door of namens een der kamers of door ten minste een vijfde van het grondwettelijk aantal
      leden van een der kamers de wens te kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur
      bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.
      Indien het voorstel van wet wordt ingetrokken of indien een van de beide kamers der Staten-Generaal besluit het
      voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.


