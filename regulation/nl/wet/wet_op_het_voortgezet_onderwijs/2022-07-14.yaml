  - number: 118jj.1
    text: |-
      De eindexamens omvatten voor leerlingen die geen eindexamen in het vak wiskunde afleggen een schoolexamen
      rekenen. Bij de vaststelling van de opgaven van dit schoolexamen worden de referentieniveaus rekenen in acht
      genomen die voor de desbetreffende schoolsoorten of voor dan wel binnen leerwegen zijn vastgesteld op grond van
      [artikel 2, tweede lid, aanhef en onderdeel c, van de Wet referentieniveaus Nederlandse taal en rekenen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel2
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118jj
    references:
      - id: ref1
        bwb_id: BWBR0027679
        artikel: '2'
  - number: 118jj.2
    text: Bij of krachtens algemene maatregel van bestuur worden omtrent dit schoolexamen nadere voorschriften vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118jj
  - number: 118jj.3
    text: |-
      Dit artikel is ook van toepassing op leerlingen die het eindexamen afleggen aan een school die is aangewezen op
      grond van [artikel 56][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118jj
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '56'
        afdeling: II
  - number: 118jj.4
    text: Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118jj
  - number: 118kk.1
    text: |-
      Het staatsexamen, bedoeld in [artikel 60, eerste lid][ref1], omvat voor kandidaten die geen
      staatsexamen in het vak wiskunde afleggen een college-examen rekenen. Bij de vaststelling van
      de opgaven van dit college-examen worden de referentieniveaus rekenen in acht genomen die voor
      de desbetreffende schoolsoorten of voor dan wel binnen leerwegen zijn vastgesteld op grond van
      [artikel 2, tweede lid, aanhef en onderdeel c, van de Wet referentieniveaus Nederlandse taal en rekenen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0027679#Artikel2
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118kk
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '60'
        afdeling: III
      - id: ref2
        bwb_id: BWBR0027679
        artikel: '2'
  - number: 118kk.2
    text: Bij of krachtens algemene maatregel van bestuur worden omtrent dit college-examen nadere voorschriften vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118kk
  - number: 118kk.3
    text: Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118kk
  - number: 118ll.1
    text: |-
      De bekostiging voor de scholen van een bevoegd gezag ingaande het kalenderjaar volgend op het jaar waarin de
      [artikelen 79][ref1] en [80][ref2] in werking treden wordt eenmalig berekend op basis van de telgegevens op 1
      oktober in het jaar van inwerkingtreding van deze artikelen:


