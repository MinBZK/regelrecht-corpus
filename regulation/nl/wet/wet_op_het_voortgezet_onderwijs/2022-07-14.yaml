  - number: '121.3'
    text: |-
      Indien de verdeling van de in [artikel 96n, eerste lid, onderdeel c][ref1], bedoelde kosten bij ministeriële
      regeling wordt geregeld, is het tweede lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel96n
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel121
