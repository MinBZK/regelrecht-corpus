        paragraaf: '3'
        afdeling: I
  - number: 35.1.c
    text: |-
      in het bezit is van een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1], verleend ten aanzien van de door hem te
      verrichten werkzaamheden, of


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 35.1.d
    text: volgens bij algemene maatregel van bestuur te geven regels zijn bekwaamheid heeft aangetoond, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel35
  - number: 35.1.e
    text: niet krachtens rechterlijke uitspraak is uitgesloten van het verrichten van die werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel35
  - number: '35.2'
    text: |-
      Het eerste lid is niet van toepassing op een onderwijsondersteunende functionaris voor zover deze is belast met
      werkzaamheden in verband met contractactiviteiten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel35
  - number: '35.3'
    text: |-
      De onderwijsondersteunende functionaris die niet voldoet aan de eisen van het eerste lid, onder b, c of d, mag
      voor zover het werkzaamheden betreft waarvoor op grond van [artikel 36, derde lid][ref1], bekwaamheidseisen
      zijn vastgesteld, niettemin met die werkzaamheden worden belast, voor een periode van ten hoogste twee jaren.
      Aan de eerste volzin wordt uitsluitend toepassing gegeven indien het bevoegd gezag en betrokkene in ieder geval
      schriftelijk hebben verklaard dat betrokkene verplicht is zich in te spannen om binnen twee jaren alsnog te voldoen
      aan de bekwaamheidseisen voor die werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '35.4'
    text: |-
      Ten aanzien van ho-studenten aan een opleiding als bedoeld in
      [artikel 7.7, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1]
      en mbo-studenten aan de beroepsbegeleidende leerweg van een opleiding als bedoeld in
      [artikel 7.2.2 van de Wet educatie en beroepsonderwijs][ref2] die in het kader van die opleiding
      onderwijsondersteunende werkzaamheden verrichten waarvoor op grond van [artikel 36, derde lid][ref3],
      bekwaamheidseisen zijn vastgesteld, kan voor de duur van die werkzaamheden worden afgeweken van het eerste lid
      onder b tot en met d.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 35a
    text: |-
      Volgens regelen, te stellen bij algemene maatregel van bestuur, kunnen in bijzondere gevallen, in afwijking van
      de eisen van benoembaarheid, gesteld in [artikel 33, eerste lid onder b][ref1], leraren die voldoen aan de in
      [artikel 36, eerste juncto vijfde lid][ref2], bedoelde bekwaamheidseisen, niet zijnde bekwaamheidseisen voor de
      periode van voorbereidend hoger onderwijs, tot een bepaald aantal lessen tijdelijk tevens onderwijs geven in het
      desbetreffende vak of de desbetreffende combinatie van vakken aan de scholen of leerjaren van scholen waarvoor moet
      worden voldaan aan laatstgenoemde bekwaamheidseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '36.1'
    text: Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor leraren.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel36
  - number: '36.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor werkzaamheden van leidinggevende aard die nauw verband houden met
      het pedagogisch-didactische klimaat op de school of onderwijskundige leiding omvatten, bekwaamheidseisen worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel36
  - number: '36.3'
    text: |-
      Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor bij die maatregel aan te wijzen
      onderwijsondersteunende werkzaamheden die rechtstreeks verband houden met het onderwijsleerproces.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel36
  - number: '36.4'
    text: |-
      De in het eerste lid bedoelde bekwaamheidseisen zijn gericht op het handelen in het onderwijsleerproces, het
      algemeen professioneel handelen en het werken binnen een onderwijsorganisatie. Zij omvatten in elk geval eisen ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel36
  - number: 36.4.a
    text: pedagogisch-didactische kennis, inzicht en vaardigheden, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel36
  - number: 36.4.b
    text: vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel36
  - number: '36.5'
    text: |-
      De in het eerste lid bedoelde bekwaamheidseisen kunnen worden onderscheiden naar schoolsoort en naar samenhangende
      leerjaren, met dien verstande dat zij in elk geval specifiek worden vastgesteld voor de periode van voorbereidend
      hoger onderwijs, bedoeld in artikel 12, eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel36
  - number: '36.6'
    text: |-
      Onze Minister stelt een beroepsorganisatie die hij vanuit het oogpunt van beroepskwaliteit representatief acht voor
      onderwijspersoneel als bedoeld in deze wet, in de gelegenheid hem een voorstel te doen voor de in het eerste en
      derde lid voorgeschreven bekwaamheidseisen en kan een representatief geachte beroepsorganisatie in de gelegenheid
      stellen hem een voorstel te doen voor bekwaamheidseisen die op grond van het tweede lid kunnen worden vastgesteld.
      Onze Minister stelt deze organisatie vervolgens in elk geval eenmaal in de zes jaar in de gelegenheid, hem een
      voorstel te doen over ongewijzigde handhaving of wijziging van de bekwaamheidseisen voor zover vastgesteld. Uit een
      voorstel als bedoeld in de eerste of tweede volzin blijkt tevens, in hoeverre dat voorstel mede steun geniet van
      een vertegenwoordiging van bevoegde gezagsorganen, van ouders en van leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel36
  - number: '37'
    text: |-
      Degene die voor een bepaald vak voldoet aan de in [artikel 36, eerste juncto vijfde lid][ref1], bedoelde
      bekwaamheidseisen voor de periode van voorbereidend hoger onderwijs, is daarmee tevens bekwaam voor dat vak voor
      zover dat wordt verzorgd in het voortgezet onderwijs niet zijnde de periode van voorbereidend hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 37a
    text: |-
      Het bevoegd gezag beschikt ten aanzien van elk personeelslid dat een functie of werkzaamheden verricht waarvoor
      bekwaamheidseisen zijn vastgesteld, over geordende gegevens met betrekking tot de bekwaamheid en het onderhouden
      van de bekwaamheid. Ten behoeve van de onderlinge vergelijkbaarheid en herkenbaarheid van de gegevens kunnen bij
      ministeriële regeling voorschriften worden vastgesteld over de inrichting en wijze van ordening van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel37a
  - number: 37b.1
    text: |-
      Degene die op 31 juli 2017 voor het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs aan een
      school is benoemd of tewerkgesteld zonder benoeming, alsmede degene die eerder al voor het geven van dat onderwijs
      benoemd is geweest of tewerkgesteld zonder benoeming, voldoet aan de bekwaamheidseisen voor het geven van dat
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel37b
  - number: 37b.2
    text: |-
      Degene die binnen een periode van vijf jaren gerekend vanaf 1 augustus 2017 voor de eerste keer wordt benoemd of
      tewerkgesteld zonder benoeming voor het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs
      aan een school, dient binnen een periode van vijf jaren gerekend vanaf het tijdstip van die eerste benoeming of
      die eerste tewerkstelling zonder benoeming, te voldoen aan de bekwaamheidseisen voor het geven van dat onderwijs
      om belast te kunnen blijven worden met de desbetreffende werkzaamheden. Bij algemene maatregel van bestuur kan
      deze periode worden verlengd met een daarbij te bepalen periode indien verlenging noodzakelijk is voor een goede
      invoering van die bekwaamheidseisen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel37b
  - number: 37b.3
    text: 'Het eerste en tweede lid zijn van overeenkomstige toepassing op degene die:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel37b
  - number: 37b.3.a
    text: |-
      onderwijsondersteunende werkzaamheden ten behoeve van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs
      aan een school verricht, vanaf het moment dat voor die werkzaamheden bekwaamheidseisen zijn vastgesteld; of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel37b
  - number: 37b.3.b
    text: |-
      is aangewezen, eerder was aangewezen onderscheidenlijk voor de eerste keer wordt aangewezen voor het geven van
      godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs op openbare scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel37b
  - number: 37b.4
    text: Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel37b
  - number: 37c
    text: |-
      [Artikel 24, derde lid][ref1], vindt, wat het onderhouden van de bekwaamheid betreft, voor een bepaalde
      personeelscategorie voor het eerst toepassing met ingang van het tijdstip waarop de bekwaamheidseisen voor die
      categorie in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 37f
    text: |-
      Ten behoeve van een scholengemeenschap of een verticale scholengemeenschap worden bij algemene maatregel van
      bestuur voorschriften vastgesteld met betrekking tot de toepassing van de [artikelen 32 tot en met 37][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel37f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '32'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '38.1'
    text: |-
      Degene die beschikt over een in artikel 118k bedoelde geschiktheidsverklaring, het bevoegd gezag dat benoemt of
      tewerkstelt zonder benoeming, en het bestuur van een instelling die werkzaamheden uitvoert als bedoeld in artikel
      118p, eerste lid, onder a, sluiten een overeenkomst die hun wederzijdse rechten en plichten omvat met betrekking
      tot het uitvoeren van de noodzakelijk geachte scholing en begeleiding, met inachtneming van de beoordeling,
      bedoeld in artikel 118l, tweede lid, onder c. Indien na het sluiten van de overeenkomst blijkt dat de scholing
      of begeleiding niet volgens de overeenkomst kan worden uitgevoerd, treft het bevoegd gezag tijdig een toereikende
      vervangende voorziening.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel38
  - number: '38.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van
      het eerste lid, waaronder in elk geval voorschriften ter waarborging van de kwaliteit van het daarin bepaalde.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel38
  - number: '38.3'
    text: |-
      Voor zover betrokkene de werkzaamheden ten aanzien waarvan hem een geschiktheidsverklaring is verstrekt, verricht
      bij twee of meer bevoegde gezagsorganen, dragen deze bevoegde gezagsorganen er zorg voor dat de overeenkomsten,
      bedoeld in het eerste lid, waarbij zij ten aanzien van betrokkene partij zijn, op elkaar worden afgestemd. Zonodig
      wordt een al gesloten overeenkomst daartoe gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel38
  - number: 38a
    text: Het bevoegd gezag draagt er zorg voor dat de rechtspositie van het personeel wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel38a
  - number: '39'
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat de rector, de directeur, de conrectoren, de adjunct-directeuren, de
      leden van de centrale directie, de leraren en het overige personeel.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39
  - number: 39a.1
    text: |-
      Het bevoegd gezag benoemt de rector, de directeur, de conrector en de adjunct-directeur, de centrale directie, de
      leraren en het overige personeel, bedoeld in [artikel 39][ref1], in algemene dienst van het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel39
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '39'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 39a.2
    text: |-
      Onder benoeming in algemene dienst van het bevoegd gezag wordt in dit artikel verstaan een benoeming ten behoeve
      van het verrichten van werkzaamheden aan door het bevoegd gezag in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39a
  - number: 39a1.1
    text: |-
      Het bevoegd gezag draagt er zorg voor dat afschriften van de bewijsstukken waarmee de bekwaamheid wordt aangetoond,
      van de geschiktheidsverklaringen, van de verklaringen omtrent het gedrag en van de arbeidsovereenkomsten van het
      aan de school verbonden personeel worden bewaard.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39a1
  - number: 39a1.2
    text: Het eerste lid is van overeenkomstige toepassing op personeel dat is tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39a1
  - number: 39c.1
    text: |-
      Het bevoegd gezag is verplicht aan ho-studenten die in opleiding zijn voor een functie in het voortgezet onderwijs,
      in de educatie of het beroepsonderwijs, bedoeld in de [Wet educatie en beroepsonderwijs][ref1], in het hoger
      beroepsonderwijs of in het basisonderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste
      ervaring in de school te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39c
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 39c.2
    text: |-
      De verplichting, bedoeld in het eerste lid, betreft ho-studenten die zijn ingeschreven voor een opleiding voor het
      beroep van leraar waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft of
      anderszins studeren om aan de bekwaamheidseisen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39c
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 39c.3
    text: |-
      Het in uren uitgedrukte aantal lessen en onderdelen van het in schooltijd verzorgd onderwijsprogramma waarvoor
      het bevoegd gezag in enig schooljaar verplicht is, ho-studenten als bedoeld in het eerste lid tot de school toe te
      laten, bedraagt gezamenlijk 5 procent van het in uren uitgedrukte totale aantal in dat schooljaar te geven lessen
      en te verzorgen onderdelen van het in schooltijd verzorgd onderwijsprogramma. Onze Minister kan het percentage
      lager stellen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39c
  - number: 39c.4
    text: |-
      Een bevoegd gezag kan een ho-student de verdere toegang tot de school ontzeggen, indien deze in de school in strijd
      handelt met de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot
      de school wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van de
      betrokken opleidingsinstelling.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39c
  - number: 39c.5
    text: |-
      De rector of de directeur dan wel de centrale directie regelt, onder verantwoordelijkheid van het bevoegd gezag,
      de werkzaamheden in verband met de begeleiding door de leraren van de ho-studenten in de school in overeenstemming
      met de leraren, alsmede in overeenstemming met de betrokken opleidingsinstellingen, dan wel, indien het betreft
      ho-studenten die zich voorbereiden op het afleggen van een staatsexamen ter verkrijging van een bewijs van
      bekwaamheid, in overeenstemming met de betrokken staatsexamencommissie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39c
  - number: 39c.6
    text: |-
      Onze Minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor een schooljaar.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39c
  - number: 39c.7
    text: |-
      De scholen waarop ho-studenten als bedoeld in het eerste lid, zijn toegelaten, zijn toegankelijk voor de inspectie
      belast met het toezicht op de opleidingsinstellingen, voor de directieleden en de door deze aan te wijzen docenten
      van die opleidingsinstellingen, alsmede voor de leden van de betrokken staatsexamencommissies, een en ander voor
      zover zulks voor de uitoefening van het toezicht op de praktische vorming onderscheidenlijk de begeleiding van de
      praktische vorming van de in de school aanwezige ho-studenten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39c
  - number: 39c.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden in verband met het bepaalde in dit artikel nadere
      voorschriften gegeven, betreffende de navolgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39c
  - number: 39c.8.a
    text: |-
      het maximum aantal lessen in een vak van een schoolsoort, gedurende dewelke het bevoegd gezag in enig schooljaar
      verplicht is ho-studenten als bedoeld in het eerste lid, toe te laten, welk maximum de 20 procent niet te boven
      mag gaan;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39c
  - number: 39c.8.b
    text: |-
      het maximum aantal ho-studenten als bedoeld in het eerste lid, dat bij dezelfde les kan worden toegelaten, welk
      maximum, behoudens bijzondere omstandigheden, de 3 niet te boven mag gaan, alsmede de gevolgen die het toelaten van
      meer dan een ho-student bij dezelfde les heeft voor het maximum, bedoeld in het derde lid, en het maximum, bedoeld
      in dit lid onder a.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39c
  - number: 39c.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in verband met het bepaalde in dit artikel nadere
      voorschriften worden gegeven, betreffende de navolgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39c
  - number: 39c.9.a
    text: |-
      de wijze van aanmelden van ho-studenten als bedoeld in het eerste lid, alsmede de termijn die voor de aanmelding
      door het bevoegd gezag mag worden gesteld;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39c
  - number: 39c.9.b
    text: |-
      de wijze waarop door de school bekendheid moet worden gegeven aan opleidingsinstellingen en staatsexamencommissies
      over de beschikbaarheid en de aard van schoolpracticumplaatsen;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39c
  - number: 39c.9.c
    text: de categorieën ho-studenten ten aanzien van wie de verplichting, bedoeld in het eerste lid, niet geldt;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39c
  - number: 39c.9.d
    text: |-
      regulering in de situatie dat, bij een beperkte beschikbaarheid van schoolpracticumplaatsen aan de school,
      gelijktijdig ho-studenten die in opleiding zijn voor een functie in het voortgezet onderwijs, en ho-studenten die
      in opleiding zijn voor een functie in het basisonderwijs, worden aangemeld;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39c
  - number: 39c.9.e
    text: |-
      de vakken en andere programma-onderdelen van een schoolsoort, waarvoor in verband met de geringe omvang van het
      onderwijs daarin, de in het eerste lid bedoelde verplichting niet geldt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel39c
  - number: 40a
    text: |-
      Over de door het bevoegd gezag ingevolge [artikel 38a][ref1] te treffen regelingen, alsmede over andere
      aangelegenheden van algemeen belang voor de rechtstoestand van het personeel, wordt door of namens het bevoegd
      gezag overleg gevoerd met de daarvoor in aanmerking komende verenigingen van werknemers, op een met deze
      schriftelijk overeengekomen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 38a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '41'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het verrichten van contractactiviteiten er niet toe leidt dat minder dan
      51% van de personeelskosten van de school uit 's Rijks kas wordt bekostigd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41
  - number: 41a.1
    text: |-
      Er is een lerarenregister. In het lerarenregister zijn van leraren voor wie
      de grond voor benoeming of tewerkstelling zonder benoeming is gelegen in
      [artikelen 33, eerste lid, onderdeel b, onderdelen 1 en 2, lid 1a, lid 1b, tweede of zestiende lid][ref1],
      [33a][ref2] of [33b][ref3], persoonsidentificerende gegevens en gegevens betreffende de school, de benoeming of
      tewerkstelling zonder benoeming, en de herregistratie opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel33a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel33b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 33a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 33b
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 41a.2
    text: 'Het lerarenregister heeft tot doel:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41a
  - number: 41a.2.a
    text: |-
      het vastleggen van het onderwijs waarvoor een leraar is benoemd of tewerkgesteld zonder benoeming op grond
      van [artikelen 33, eerste lid, onderdeel b, onderdelen 1 en 2, lid 1a, lid 1b, tweede of zestiende lid][ref1],
      [33a][ref2] of [33b][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel33a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel33b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 33a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 33b
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 41a.2.b
    text: het vastleggen op welke wijze een leraar voldoet aan de bekwaamheidseisen; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41a
  - number: 41a.2.c
    text: het vastleggen of een leraar voldoet aan de herregistratiecriteria.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41a
  - number: 41a.3
    text: 'In aanvulling op het tweede lid heeft het lerarenregister tot doel gegevens te verstrekken:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41a
  - number: 41a.3.a
    text: aan Onze Minister ten behoeve van de beleidsvorming; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41a
  - number: 41a.3.b
    text: |-
      aan de inspectie voor zover de verwerking van die gegevens noodzakelijk is voor de goede vervulling van haar
      publieke taak.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41a
  - number: 41a.4
    text: Onze Minister draagt zorg voor het beheer van het lerarenregister.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41a
  - number: 41c
    text: |-
      Onze Minister is voor de verwerking van persoonsgegevens in het kader van het lerarenregister de
      verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41c
  - number: 41e
    text: |-
      Onze Minister stelt bij ministeriële regeling regels over de autorisatie van degenen die onder zijn gezag vallen
      voor verwerking van persoonsgegevens in het kader van het lerarenregister.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41e
  - number: 41f.1
    text: 'Het lerarenregister bevat voor elke daarin opgenomen leraar:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41f
  - number: 41f.1.a
    text: het burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41f
  - number: 41f.1.b
    text: de geslachtsnaam, de voornamen, het geslacht, het adres, de postcode, en de geboortedatum van de leraar;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41f
  - number: 41f.1.c
    text: |-
      gegevens betreffende de benoeming of tewerkstelling zonder benoeming, waaronder in ieder geval de ingangsdatum
      ervan;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41f
  - number: 41f.1.d
    text: |-
      gegevens betreffende de school waaraan hij benoemd is of tewerkgesteld zonder benoeming, waaronder in ieder geval
      het registratienummer van de school;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41f
  - number: 41f.1.e
    text: het onderwijs waarvoor de leraar kan opgaan voor herregistratie;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41f
  - number: 41f.1.f
    text: voor welk onderwijs als bedoeld in onderdeel e de leraar opgaat voor herregistratie;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41f
  - number: 41f.1.g
    text: gegevens betreffende de activiteiten voor herregistratie; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41f
  - number: 41f.1.h
    text: |-
      gegevens betreffende de herregistratie waaronder, indien van toepassing, de aantekening, bedoeld in artikel 41k,
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41f
  - number: 41f.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen de gegevens, bedoeld in het eerste lid, onderdelen c tot en
      met h, nader worden gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41f
  - number: 41g.1
    text: |-
      Het bevoegd gezag verstrekt aan Onze Minister de basisgegevens van
      leraren die zijn benoemd of tewerkgesteld zonder benoeming op grond van
      [artikelen 33, eerste lid, onderdeel b, onderdelen 1 en 2, lid 1a, lid 1b, tweede of zestiende lid][ref1],
      [33a][ref2] of [33b][ref3] en draagt zorg voor het correct bijhouden van die gegevens ten behoeve van het
      lerarenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel33a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel33b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 33a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 33b
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 41g.2
    text: |-
      De leraar verstrekt aan Onze Minister de gegevens, genoemd in
      [artikel 41f, eerste lid, onderdelen e tot en met g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41f
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41f
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 41g.3
    text: |-
      Indien een leraar niet is benoemd of tewerkgesteld zonder benoeming, kan hij ten behoeve van opname in
      het lerarenregister de gegevens als genoemd in [artikel 41f, eerste lid, onderdelen e tot en met g][ref1],
      verstrekken aan Onze Minister mits hij tevens gegevens, bedoeld in artikel 41f,
      eerste lid, onderdelen a en b, verstrekt en middels een bewijsstuk als bedoeld in de
      [artikelen 33, eerste lid, onderdeel b, onderdelen 1 en 2, lid 1a, lid 1b, tweede of zestiende lid][ref2],
      [33a][ref3] of [33b][ref4], aantoont dat hij aan de bekwaamheidseisen voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41f
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel33a
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel33b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41f
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 33a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 33b
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 41g.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de tijdstippen en over de wijze
      van levering, de correctie van de gegevens en over het aantonen van de bekwaamheidseisen, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41g
  - number: 41h.1
    text: |-
      De gegevens, bedoeld in [artikel 41f, eerste lid, onder b][ref1], zijn gekoppeld aan het burgerservicenummer van de
      desbetreffende leraar en worden door Onze Minister verkregen uit de basisregistratie personen indien de leraar als
      ingezetene is ingeschreven in de basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41f
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41f
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 41h.2
    text: |-
      Indien de leraar niet als ingezetene is ingeschreven in de basisregistratie personen, worden de desbetreffende
      gegevens verkregen uit de levering op grond van [artikel 41g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41g
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41g
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 41i
    text: |-
      Nadat een leraar de gegevens, bedoeld in [artikel 41g, tweede en derde lid][ref1], heeft verstrekt, neemt Onze
      Minister het burgerservicenummer en de andere gegevens die zijn geleverd op grond van artikel 41g en verkregen op
      grond van [artikel 41h][ref2] of [41r, tweede lid][ref3], op in het lerarenregister, met dien verstande dat hij de
      basisgegevens slechts opneemt voor zover deze niet kunnen worden verkregen uit de basisadministratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41g
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel41h
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel41r
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41g
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 41h
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 41r
        hoofdstuk: I
        paragraaf: '5'
        afdeling: I
  - number: 41j.1
    text: |-
      Indien een of meer van de basisgegevens van een leraar in het lerarenregister afwijken van de betreffende
      basisgegevens behorende bij de benoeming of tewerkstelling zonder benoeming van deze leraar, kan de betrokkene
      Onze Minister elektronisch verzoeken deze gegevens te verbeteren. Onze Minister verzoekt het bevoegd gezag om hem
      overeenkomstig [artikel 41g, eerste lid][ref1], de juiste gegevens te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41g
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41j
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41g
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 41j.2
    text: |-
      Indien het bevoegd gezag na het verzoek van Onze Minister constateert dat de basisgegevens van de leraar in het
      lerarenregister overeenkomen met de betreffende basisgegevens behorende bij de benoeming of tewerkstelling zonder
      benoeming van deze leraar, deelt hij dit elektronisch mee aan Onze Minister en deelt Onze Minister dit elektronisch
      mee aan de betrokkene.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41j
  - number: 41j.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op de gegevens die op grond van [artikel 41h][ref1] zijn
      overgenomen uit de basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41h
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41j
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41h
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 41j.4
    text: |-
      Een beslissing op een verzoek als bedoeld in het eerste lid, eerste volzin, geldt als een besluit in de zin van de
      [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41j
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 41m.1
    text: |-
      Gegevens van een leraar als bedoeld in [artikel 41f][ref1] worden verwijderd uit het lerarenregister:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41f
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41m
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41f
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 41m.1.a
    text: indien betrokkene Onze Minister hier om verzoekt;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41m
  - number: 41m.1.b
    text: indien betrokkene de pensioengerechtigde leeftijd bereikt;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41m
  - number: 41m.1.c
    text: indien betrokkene is overleden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41m
  - number: 41m.2
    text: |-
      In de gevallen, bedoeld in het eerste lid, onder b en c, worden alle in het lerarenregister geregistreerde gegevens
      van betrokkene verwijderd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41m
  - number: 41m.3
    text: |-
      Indien een of meerdere gegevens van een leraar op grond van het eerste lid worden verwijderd uit het
      lerarenregister, blijven deze gegevens tot vijf jaar na verwijdering bewaard.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41m
  - number: 41m.4
    text: |-
      Indien op grond van [artikel 41g][ref1] gegevens worden verstrekt voor heropname van een leraar in
      het lerarenregister, worden door Onze Minister van deze leraar de bewaarde gegevens als bedoeld in
      [artikel 41f, eerste lid, onderdelen e tot en met h][ref2], opgenomen in het lerarenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41g
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel41f
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41m
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41g
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 41f
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 41m.5
    text: |-
      Op verzoek van een leraar aan Onze Minister is het eerste lid, aanhef en onder b, op deze leraar niet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41m
  - number: 41m.6
    text: |-
      Met pensioengerechtigde leeftijd wordt in dit artikel bedoeld de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a van de Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41m
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 41n.2
    text: |-
      Op verzoek van het bevoegd gezag van de school waaraan de leraar is benoemd of tewerkgesteld zonder benoeming
      worden in aanvulling op de gegevens, bedoeld in het eerste lid, de volgende gegevens van een leraar verstrekt:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41n
  - number: 41n.2.a
    text: het geslacht, het adres, de postcode en de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41n
  - number: 41n.2.b
    text: gegevens betreffende de benoeming of tewerkstelling zonder benoeming;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41n
  - number: 41n.2.c
    text: gegevens betreffende de school waaraan hij is benoemd of tewerkgesteld zonder benoeming;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41n
  - number: 41n.2.d
    text: |-
      indien het bevoegd gezag daarvoor toestemming heeft van de leraar: gegevens betreffende de activiteiten voor
      herregistratie;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41n
  - number: 41n.2.e
    text: overige gegevens betreffende de herregistratie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41n
  - number: 41n.3
    text: 'Bij of krachtens algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41n
  - number: 41n.3.a
    text: wordt de wijze waarop de gegevens van een leraar worden verstrekt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41n
  - number: 41n.3.c
    text: kunnen de gegevens, bedoeld in het eerste lid en tweede lid, nader worden gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41n
  - number: 41n.5
    text: |-
      De betrokkene heeft toegang tot de gegevens die worden bewaard op grond van [artikel 41m, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41m
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41n
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41m
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: 41n.6
    text: 'Uit het lerarenregister worden aan Onze Minister gegevens verstrekt ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41n
  - number: 41n.6.b
    text: de beleidsvorming.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41n
  - number: 41n.7
    text: |-
      Uit het lerarenregister worden aan de inspectie gegevens verstrekt voor zover de verwerking van die gegevens
      noodzakelijk is voor de goede vervulling van haar publieke taak.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41n
  - number: 41n.8
    text: |-
      Bij de verstrekking, bedoeld in het zesde en zevende lid, kunnen persoonsgegevens worden verwerkt, indien dat
      noodzakelijk is voor de in het zesde lid of zevende lid genoemde doelen, onverminderd de verplichting voor de
      verwerkingsverantwoordelijke om passende technische en organisatorische maatregelen te treffen als bedoeld in
      artikel 25 van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41n
  - number: 41o.1
    text: |-
      Er is een registervoorportaal. In het registervoorportaal zijn van leraren die zijn benoemd of tewerkgesteld zonder
      benoeming en niet voldoen aan de bekwaamheidseisen van het onderwijs dat zij verzorgen persoonsidentificerende
      gegevens en gegevens betreffende de school en de benoeming of tewerkstelling opgenomen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41o
  - number: 41o.2
    text: |-
      Het registervoorportaal heeft tot doel het inzichtelijk maken welke leraren die zijn benoemd of tewerkgesteld
      zonder benoeming niet voldoen aan de bekwaamheidseisen van het onderwijs dat zij verzorgen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41o
  - number: 41o.3
    text: 'In aanvulling op het tweede lid heeft het registervoorportaal tot doel gegevens te verstrekken:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41o
  - number: 41o.3.a
    text: aan Onze Minister ten behoeve van de beleidsvorming; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41o
  - number: 41o.3.b
    text: |-
      aan de inspectie voor zover de verwerking van die gegevens noodzakelijk is voor de goede vervulling van haar
      publieke taak.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41o
  - number: 41o.4
    text: |-
      Het eerste lid, is niet van toepassing op leraren die zijn benoemd of tewerkgesteld zonder benoeming op grond van
      [artikel 33, vijftiende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41o
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 41o.5
    text: Onze Minister draagt zorg voor het beheer van het registervoorportaal.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41o
  - number: 41p.1
    text: |-
      Het registervoorportaal bevat voor elke daarin opgenomen leraar de basisgegevens die op grond van
      [artikel 41q][ref1] worden geleverd, waaronder in ieder geval het gegeven betreffende het onderwijs waarvoor hij is
      benoemd of tewerkgesteld zonder benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41q
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41p
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41q
        hoofdstuk: I
        paragraaf: '5'
        afdeling: I
  - number: 41p.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen de gegevens, bedoeld in het eerste lid, nader worden
      gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41p
  - number: 41q.1
    text: 'Het bevoegd gezag verstrekt aan Onze Minister de basisgegevens van leraren:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41q
  - number: 41q.1.a
    text: |-
      die zijn benoemd of zijn tewerkgesteld zonder benoeming op grond van
      [artikel 33, eerste lid, onderdeel b, onder 3][ref1], en [118k, negende en twaalfde lid][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel118k
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41q
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 118k
  - number: 41q.1.b
    text: |-
      die onderwijs verzorgen op grond van de [artikelen 33, derde of vierde lid][ref1], of [35a][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel35a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41q
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 35a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 41q.2
    text: |-
      Het eerste lid, onder b, is van overeenkomstige toepassing op een leraar die onderwijs verzorgt op grond van
      [artikel 33, vijfde lid][ref1], en niet voldoet aan de bekwaamheidseisen voor het onderwijs dat hij geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41q
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 41q.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de tijdstippen en de wijze van
      levering en over de correctie van de gegevens.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41q
  - number: 41r.1
    text: 'De leraar blijft voor het onderwijs waarvoor hij in het registervoorportaal is opgenomen vermeld:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41r
  - number: 41r.1.a
    text: totdat hij voldoet aan de bekwaamheidseisen van dat onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41r
  - number: 41r.1.b
    text: maximaal voor de duur van de periode, genoemd in het artikel op grond waarvan deze leraar dit onderwijs geeft.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41r
  - number: 41r.2
    text: |-
      Het bevoegd gezag stelt een leraar die in het registervoorportaal is opgenomen in staat te voldoen aan de vereisten
      om voor het desbetreffende onderwijs in het lerarenregister te kunnen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41r
  - number: 41r.3
    text: |-
      Vanaf het moment dat een leraar voor het onderwijs waarvoor hij in het registervoorportaal is opgenomen, voldoet
      aan de criteria om in het lerarenregister te worden vermeld, worden de gegevens van deze leraar verstrekt voor
      opname in het lerarenregister.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41r
  - number: 41r.4
    text: |-
      Indien een leraar opgenomen is in het registervoorportaal niet langer voldoet aan de vereisten die op grond van de
      in [artikel 41q, eerste en tweede lid][ref1], genoemde bepalingen zijn gesteld aan de leraar, worden de gegevens
      van deze leraar verwijderd uit het registervoorportaal en gedurende vijf jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41q
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41r
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41q
        hoofdstuk: I
        paragraaf: '5'
        afdeling: I
  - number: 41s.2
    text: |-
      Op verzoek van het bevoegd gezag van de school waaraan de leraar is benoemd of tewerkgesteld zonder benoeming
      worden in aanvulling op de gegevens, bedoeld in het eerste lid, de volgende gegevens van een leraar verstrekt:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41s
  - number: 41s.2.a
    text: het geslacht, het adres, de postcode en de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41s
  - number: 41s.2.b
    text: overige gegevens betreffende de benoeming of tewerkstelling zonder benoeming; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41s
  - number: 41s.2.c
    text: gegevens betreffende de school waaraan hij is benoemd of tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41s
  - number: 41s.3
    text: 'Bij of krachtens algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41s
  - number: 41s.3.a
    text: wordt de wijze waarop de gegevens van een leraar worden verstrekt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41s
  - number: 41s.3.c
    text: kunnen de gegevens, bedoeld in het eerste lid en tweede lid, nader worden gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41s
  - number: 41s.4
    text: |-
      De leraar heeft toegang tot de gegevens die worden bewaard op grond van [artikel 41r, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41r
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41s
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41r
        hoofdstuk: I
        paragraaf: '5'
        afdeling: I
  - number: 41s.5
    text: Uit het registervoorportaal worden aan Onze Minister gegevens verstrekt ten behoeve van de beleidsvorming.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41s
  - number: 41s.6
    text: |-
      Uit het registervoorportaal worden aan de inspectie gegevens verstrekt voor zover de verwerking van die gegevens
      noodzakelijk is voor de goede vervulling van haar publieke taak.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41s
  - number: 41s.7
    text: |-
      Bij de verstrekking, bedoeld in het vijfde en zesde lid, kunnen persoonsgegevens worden verwerkt, voor zover
      dat noodzakelijk is voor de in het vijfde of zesde lid genoemde doelen, onverminderd de verplichting voor de
      verwerkingsverantwoordelijke om passende technische en organisatorische maatregelen te treffen als bedoeld in
      artikel 25 van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41s
  - number: 41u
    text: |-
      De [artikelen 41a, vierde lid][ref1], [41c][ref2], [41e][ref3] en [41h tot en met 41j][ref4], zijn van
      overeenkomstige toepassing op het registervoorportaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel41a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel41c
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel41e
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel41h
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel41u
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 41a
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 41c
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 41e
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 41h
        hoofdstuk: I
        paragraaf: '4'
        afdeling: I
  - number: '42.1'
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de leerlingen met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving, en met onderkenning
      van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42
  - number: '42.2'
    text: Openbare scholen zijn toegankelijk voor leerlingen zonder onderscheid naar godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42
  - number: '42.3'
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42
  - number: 42a.1
    text: |-
      Een gemeenteraad kan bij verordening een openbare rechtspersoon instellen die tot doel heeft een of meer
      openbare scholen in de gemeente in stand te houden, al dan niet te zamen met openbare scholen als bedoeld in de
      [Wet op het primair onderwijs][ref1] of openbare scholen als bedoeld in de [Wet op de expertisecentra][ref2]. Een
      openbare rechtspersoon kan ook worden ingesteld door meer dan een gemeente ten behoeve van het in stand houden
      van openbare scholen in die gemeenten door het vaststellen van een voor wat betreft de onderwerpen, bedoeld in
      het vierde lid, gelijkluidende verordening, in welk geval de openbare rechtspersoon niet eerder tot stand komt dan
      nadat alle daartoe strekkende verordeningen in werking zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: 42a.2
    text: De gemeenteraad of gemeenteraden maken het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.3
    text: |-
      De openbare rechtspersoon oefent met uitzondering van de besluitvorming over de opheffing van een openbare school
      alle taken en bevoegdheden uit van het bevoegd gezag. Hij bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.4
    text: 'De verordening, bedoeld in het eerste lid, voorziet in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.4.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.4.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte, doch
      geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.4.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.4.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.4.e
    text: de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.4.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.4.g
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt, met dien verstande dat in de regeling een overheersende invloed van de overheid in het
      bestuur is verzekerd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.5
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.6
    text: |-
      De vergaderingen van het bestuur van de openbare rechtspersoon zijn openbaar, tenzij het bestuur anders beslist, op
      gronden, vermeld in de verordening.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.7
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.8
    text: |-
      De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren
      in strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de openbare rechtspersoon
      te ontbinden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.9
    text: |-
      Indien de school een raad van toezicht heeft, is het vierde lid niet van toepassing en voorziet de verordening,
      bedoeld in het eerste lid, onverminderd [artikel 24e1][ref1] in ieder geval in een regeling omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24e1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 24e1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 42a.9.a
    text: de samenstelling, werkwijze en inrichting van de raad van toezicht van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.9.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien
      verstande dat de leden van de raad van toezicht worden benoemd door de gemeenteraad of gemeenteraden en dat ten
      minste een derde gedeelte, doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders
      van de leerlingen die zijn ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.9.c
    text: de termijn waarvoor de leden van de raad van toezicht worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.9.d
    text: de vaststelling van de begroting en de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42a.9.e
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt, met dien verstande dat in de regeling een overheersende invloed van de overheid in de raad
      van toezicht is verzekerd. Het vijfde, zesde en achtste lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42a
  - number: 42b.1
    text: |-
      Een gemeenteraad kan besluiten dat een of meer openbare scholen in de gemeente in stand worden gehouden door een
      stichting die zich ten doel stelt het in stand houden van een of meer openbare scholen, al dan niet te zamen met
      openbare scholen als bedoeld in de [Wet op het primair onderwijs][ref1] of de [Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: 42b.2
    text: De gemeenteraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.3
    text: |-
      Een stichting die een openbare school in stand houdt, wordt opgericht door een of meer gemeenten, al dan niet te
      zamen met een of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.4
    text: |-
      Onverminderd [artikel 53d, eerste lid][ref1], is het statutaire doel van de stichting uitsluitend het geven van
      openbaar onderwijs overeenkomstig [artikel 42][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53d
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel42
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53d
        hoofdstuk: IV
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '42'
        hoofdstuk: II
        afdeling: I
  - number: 42b.5
    text: |-
      De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken en
      bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.6
    text: 'Onverminderd het vierde lid, voorzien de statuten in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.6.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.6.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de gemeenteraad of gemeenteraden en dat ten minste een derde gedeelte, doch
      geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn
      ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.6.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.6.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de desbetreffende gemeenteraad of gemeenteraden en de
      vaststelling van de jaarrekening na instemming van de desbetreffende gemeenteraad of gemeenteraden,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.6.e
    text: de wijze waarop de gemeenteraad of gemeenteraden toezicht op het bestuur uitoefenen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.6.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.6.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.6.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.7
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de desbetreffende gemeenteraad of
      gemeenteraden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.8
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad of gemeenteraden verslag uit over de werkzaamheden, waarbij in
      ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.9
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.10
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      gemeenteraad of gemeenteraden de maatregelen die zij nodig achten om de continuïteit van het onderwijsproces te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.11
    text: |-
      De gemeenteraad of gemeenteraden zijn in geval van ernstige taakverwaarlozing door het bestuur of functioneren in
      strijd met de wet bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de stichting te ontbinden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.12
    text: |-
      Indien de school een raad van toezicht heeft, is het zesde lid niet van toepassing en voorzien de statuten,
      onverminderd [artikel 24e1][ref1], in ieder geval in een regeling omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24e1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 24e1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 42b.12.a
    text: de samenstelling, werkwijze en inrichting van de raad van toezicht van de stichting,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.12.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien
      verstande dat de leden van de raad van toezicht worden benoemd door de gemeenteraad of gemeenteraden en dat ten
      minste een derde gedeelte, doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders
      van de leerlingen die zijn ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.12.c
    text: de termijn waarvoor de leden van de raad van toezicht worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.12.d
    text: de vaststelling van de begroting en de jaarrekening,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.12.e
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42b.12.f
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van
      de overheid in de raad van toezicht is verzekerd. Het achtste, negende en elfde lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42b
  - number: 42c.1
    text: |-
      Een rechtspersoon die een openbare school in stand houdt, kan de instandhouding van die school overdragen aan een
      andere rechtspersoon die tot de instandhouding van een openbare school bevoegd is.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42c
  - number: 42c.2
    text: |-
      De overdracht geschiedt bij notariële akte. Bij deze akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van gebouwen, terreinen en roerende zaken over te dragen. Deze akte geldt tevens als akte van
      levering, bedoeld in [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1]. In de akte wordt tevens bepaald dat
      de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen benoemt met ingang van de datum
      van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42c
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: 42c.3
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger, onverminderd hetgeen verder voor de
      overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42c
  - number: 42c.4
    text: |-
      Voor zover het betreft scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen
      voortgezet onderwijs, voor voorbereidend beroepsonderwijs en voor praktijkonderwijs kunnen burgemeester en
      wethouders in bijzondere omstandigheden ontheffing verlenen van de verplichting tot overdracht van de rechten ten
      aanzien van gebouwen, terreinen en roerende zaken.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel42c
  - number: '43'
    text: |-
      In afwijking van [artikel 39][ref1] leggen Gedeputeerde Staten van de desbetreffende provincie de disciplinaire
      straf of de schorsing op of verlenen zij het ontslag, indien het betreft een rector, een directeur, een conrector,
      een adjunct-directeur, een lid van de centrale directie of een leraar van een openbare school, die tevens lid van
      de raad der gemeente is, welke die school in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel39
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '39'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: '44.1'
    text: Het onderwijs aan openbare scholen wordt gegeven met eerbiediging van ieders geloofs- of levensovertuiging.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel44
  - number: '44.2'
    text: |-
      Wij kunnen hem, die zich in dit opzicht aan plichtsverzuim schuldig maakt, voor ten hoogste een jaar en bij
      herhaling voor onbepaalde tijd in zijn bevoegdheid tot het geven van onderwijs aan een openbare school schorsen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel44
  - number: '46.1'
    text: |-
      Aan de openbare scholen worden op verzoek van kerkelijke gemeenten of van plaatselijke kerken de leerlingen in
      de gelegenheid gesteld in de schoollokalen godsdienstonderwijs te volgen van godsdienstleraren, daartoe door die
      gemeenten of kerken aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel46
  - number: '46.2'
    text: De schoollokalen worden, zo nodig verwarmd en verlicht, kosteloos voor het godsdienstonderwijs beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel46
  - number: '46.3'
    text: |-
      Bij een geschil omtrent het vaststellen van lessen of het beschikbaar stellen van lokalen van openbare scholen
      beslist Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel46
  - number: '46.4'
    text: |-
      Aan de kerkelijke gemeenten of de plaatselijke kerken kan een subsidie worden verstrekt. De
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref1] zijn van toepassing, met dien verstande dat de
      subsidie slechts kan worden verstrekt bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '46.5'
    text: |-
      Voor de toepassing van dit artikel worden met kerkelijke gemeenten gelijkgesteld verenigingen met volledige
      rechtsbevoegdheid, die zich blijkens de statuten het geven of doen geven van godsdienstonderwijs ten doel stellen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel46
  - number: '46.6'
    text: |-
      Het bevoegd gezag ziet erop toe dat dit onderwijs uitsluitend wordt gegeven door een leraar die blijkens een
      daartoe strekkende verklaring van de aanwijzende kerkelijke gemeente of plaatselijke kerk:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel46
  - number: 46.6.a
    text: |-
      voldoet aan de bekwaamheidseisen die krachtens [artikel 36, eerste lid][ref1], voor het geven van dat onderwijs
      zijn vastgesteld, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 46.6.b
    text: zijn bekwaamheid onderhoudt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel46
  - number: '47.1'
    text: |-
      Aan de openbare scholen worden op verzoek van door Ons tot dit doel toegelaten genootschappen op geestelijke
      grondslag de leerlingen, wier ouders, voogden of verzorgers daartoe de wens te kennen geven, in de gelegenheid
      gesteld in de schoollokalen levensbeschouwelijk vormingsonderwijs te volgen van leraren, daartoe door deze
      genootschappen aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel47
  - number: '47.2'
    text: De schoollokalen worden, zo nodig verwarmd en verlicht, kosteloos voor het vormingsonderwijs beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel47
  - number: '47.3'
    text: |-
      Bij een geschil omtrent het vaststellen van lessen of het beschikbaar stellen van lokalen van openbare scholen
      beslist Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel47
  - number: '47.4'
    text: |-
      Aan de genootschappen, bedoeld in het eerste lid, kan een subsidie worden verstrekt. De
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref1] zijn van toepassing, met dien verstande dat de
      subsidie slechts kan worden verstrekt bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '47.5'
    text: |-
      Het bevoegd gezag ziet erop toe dat dit onderwijs uitsluitend wordt gegeven door een leraar die blijkens een
      daartoe strekkende verklaring van het aanwijzend genootschap op geestelijke grondslag:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel47
  - number: 47.5.a
    text: |-
      voldoet aan de bekwaamheidseisen die krachtens [artikel 36, eerste lid][ref1], voor het geven van dat onderwijs
      zijn vastgesteld, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 47.5.b
    text: zijn bekwaamheid onderhoudt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel47
  - number: '48.1'
    text: |-
      Indien binnen redelijke afstand van de woning van de leerling niet de gelegenheid bestaat tot het volgen van het
      onderwijs aan een openbare school, mag aan deze leerling de toegang tot een gelijksoortige, uit de openbare kas
      bekostigde bijzondere school niet worden geweigerd op grond van levensbeschouwing, tenzij de school uitsluitend
      bestemd is voor interne leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel48
  - number: '48.2'
    text: |-
      Indien tot een bijzondere school ingevolge het eerste lid andere leerlingen worden toegelaten dan voor wie de
      school in verband met de levensbeschouwing wordt in stand gehouden, kunnen deze leerlingen niet worden verplicht
      tot het volgen van de lessen in de vakken of andere programma-onderdelen, die in verband met die levensbeschouwing
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel48
  - number: '49.1'
    text: |-
      De bijzondere school staat onder het bestuur van een rechtspersoon met volledige rechtsbevoegdheid die zich het
      geven van onderwijs in de zin van deze wet ten doel stelt zonder daarbij het maken van winst te beogen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel49
  - number: '49.2'
    text: Het schoolbestuur draagt zorg voor een deskundig beheer.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel49
  - number: '50.1'
    text: |-
      De rechtspersoon die een bijzondere school in stand houdt, kan de instandhouding van die school overdragen aan een
      andere rechtspersoon die voldoet aan het bepaalde in [artikel 49, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel49
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '49'
        hoofdstuk: III
        afdeling: I
  - number: '50.2'
    text: |-
      De overdracht geschiedt bij notariële akte. Bij deze akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van gebouwen, terreinen en roerende zaken over te dragen. Deze akte geldt tevens als akte van
      levering, bedoeld in [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1]. In de akte wordt tevens bepaald dat
      de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen benoemt met ingang van de datum
      van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: '50.3'
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid treedt de verkrijgende rechtspersoon in alle uit de
      wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de school, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel50
  - number: '50.4'
    text: |-
      Voor zover het betreft scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen
      voortgezet onderwijs en voor voorbereidend beroepsonderwijs kunnen burgemeester en wethouders in bijzondere
      omstandigheden ontheffing verlenen van de verplichting tot overdracht van de rechten ten aanzien van gebouwen,
      terreinen en roerende zaken.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel50
  - number: '50.5'
    text: |-
      Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1] van een rechtspersoon
      die een school in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende rechtspersoon de
      school in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de school overgaat. In het
      laatste geval zijn het tweede tot en met vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
  - number: 53a
    text: |-
      In een geval als bedoeld in [artikel 39c, vierde lid, eerste volzin][ref1], maakt het bevoegd gezag van een
      bijzondere school de beslissing tot ontzegging van de toegang tot de school schriftelijk en met redenen omkleed
      bekend aan de betrokken ho-student.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel39c
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 39c
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 53b.1
    text: Op het personeel van een rechtspersoon met volledige rechtsbevoegdheid die
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53b
  - number: 53b.1.a
    text: |-
      uitsluitend wordt bestuurd door een bevoegd gezag al dan niet met een of meer andere bevoegde gezagsorganen als
      bedoeld in deze wet, de [Wet op het primair onderwijs][ref1] of de [Wet op de expertisecentra][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: 53b.1.b
    text: |-
      zich blijkens de statuten dan wel de gemeenschappelijke regeling,
      bedoeld in de [Wet gemeenschappelijke regelingen][ref1], behoudens
      [artikel 20, derde, vierde en vijfde lid, van de Wet op het primair onderwijs][ref2], uitsluitend ten doel stelt
      om ten behoeve van scholen en andere onderwijsinstellingen die uit 's Rijks kas worden bekostigd, werkzaamheden
      te verrichten ter verzekering van de goede gang van het onderwijs met uitzondering van het leiden van de school,
      het geven van onderwijs en het verrichten van werkzaamheden op het terrein van de schoolbegeleiding, bedoeld in
      [artikel 1 van de Wet op het primair onderwijs][ref3] en van de [Wet op de expertisecentra][ref4],


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0003740
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0003420
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: '1'
  - number: 53b.1.c
    text: niet het maken van winst beoogt,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53b
  - number: 53b.1.d
    text: wordt gefinancierd met behulp van bijdragen van de bevoegde gezagsorganen waarvoor diensten worden verricht, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53b
  - number: 53b.1.e
    text: Onze Minister heeft medegedeeld als rechtspersoon in de zin van dit artikel werkzaam te willen zijn,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53b
  - number: 53b.2
    text: Onder bevoegd gezag en bevoegde gezagsorganen in het eerste lid onderdeel a wordt mede verstaan de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53b
  - number: 53b.4
    text: |-
      De in het eerste lid onder a bedoelde bevoegde gezagsorganen delen Onze Minister mede dat zij het bestuur vormen
      van een rechtspersoon in de zin van dit artikel. Voorts verschaffen zij Onze Minister en de door hem aangewezen
      personen desgevraagd alle inlichtingen omtrent de rechtspersoon en zijn activiteiten. De in het eerste lid
      onder a bedoelde bevoegde gezagsorganen kunnen Onze Minister mededelen dat zij erin toestemmen dat de gevraagde
      inlichtingen rechtstreeks door het bestuur van de rechtspersoon zelf aan Onze Minister en de door hem aangewezen
      personen worden verschaft.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53b
  - number: 53b.5
    text: |-
      De gemeente en het bevoegd gezag dat deel uitmaakt van het bestuur van de rechtspersoon, zijn verplicht op de
      naleving van de in de voorgaande leden genoemde voorschriften toe te zien.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53b
  - number: 53c.1
    text: |-
      De instandhouding van een of meer openbare en een of meer bijzondere scholen kan worden opgedragen of overgedragen
      aan een stichting die met dit doel wordt onderscheidenlijk is opgericht. De besluitvorming van de zijde van de
      gemeente vindt plaats door de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
  - number: 53c.2
    text: |-
      Het statutaire doel van de stichting is in elk geval het geven van openbaar onderwijs en bijzonder onderwijs in
      afzonderlijke scholen voor openbaar onderscheidenlijk bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
  - number: 53c.3
    text: |-
      De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken en
      bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
  - number: 53c.4
    text: 'De statuten voorzien in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
  - number: 53c.4.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
  - number: 53c.4.b
    text: de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
  - number: 53c.4.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
  - number: 53c.4.d
    text: |-
      de vaststelling van de begroting en jaarrekening na overleg met de gemeenteraad van de gemeente waarin de school
      waar openbaar onderwijs wordt gegeven, gevestigd is,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
  - number: 53c.4.e
    text: |-
      de wijze waarop de gemeenteraad van de gemeente waarin de school waar openbaar onderwijs wordt gegeven, gevestigd
      is, toezicht op het bestuur van die school uitoefent,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
  - number: 53c.4.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
  - number: 53c.4.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
  - number: 53c.4.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd voor zover het openbaar onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
  - number: 53c.5
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de gemeenteraad van de gemeente
      waarin de school waar openbaar onderwijs wordt gegeven, gevestigd is. Instemming kan slechts worden onthouden
      indien overheersende invloed van de overheid in het bestuur niet is verzekerd voor zover het openbaar onderwijs
      betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
  - number: 53c.6
    text: |-
      Het bestuur brengt jaarlijks aan de gemeenteraad van de gemeente waarin de school waar openbaar onderwijs wordt
      gegeven, gevestigd is, verslag uit over de werkzaamheden, waarbij in ieder geval aandacht wordt geschonken aan de
      wezenskenmerken van het openbaar onderwijs. Het verslag wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
  - number: 53c.7
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
  - number: 53c.8
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover het
      openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waarin de openbare school is gelegen, de
      maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het openbaar
      onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
  - number: 53c.9
    text: |-
      Indien de laatste afzonderlijke openbare school en de laatste afzonderlijke bijzondere school die door de stichting
      in stand worden gehouden, zijn gefuseerd tot een samenwerkingsschool als bedoeld in [artikel 53d][ref1] kan de
      instandhouding van die samenwerkingsschool opgedragen blijven aan de stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53d
        hoofdstuk: IV
        afdeling: I
  - number: 53d.1
    text: |-
      Een samenwerkingsschool is een school waarin zowel openbaar onderwijs als bijzonder onderwijs wordt aangeboden.
      Een samenwerkingsschool kan uitsluitend tot stand komen door samenvoeging van één of meer openbare scholen
      met één of meer bijzondere scholen en wordt in stand gehouden door een stichting, een stichting als bedoeld in
      [artikel 53c][ref1] of een stichting als bedoeld in [artikel 42b][ref2] waarvan het statutaire doel in ieder geval
      is het in stand houden van een samenwerkingsschool. De [artikelen 42c][ref3] en [50][ref4] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53c
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel42b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel42c
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel50
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53c
        hoofdstuk: IV
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 42b
        hoofdstuk: II
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 42c
        hoofdstuk: II
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '50'
        hoofdstuk: III
        afdeling: I
  - number: 53d.2
    text: 'Een samenwerkingsschool kan uitsluitend tot stand komen indien:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53d.2.a
    text: |-
      met die totstandkoming van de samenwerkingsschool de continuïteit van het openbaar of bijzonder onderwijs
      gehandhaafd kan blijven; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53d.2.b
    text: de betrokken scholen en scholengemeenschappen alle leerjaren omvatten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53d.3
    text: |-
      Van een situatie als bedoeld in het tweede lid, onderdeel a, is sprake indien één van de betrokken scholen op
      1 oktober van het eerste of tweede schooljaar voorafgaand aan de fusiedatum werd bezocht door een aantal leerlingen
      gelijk aan of minder dan:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53d.3.a
    text: 120 leerlingen voor praktijkonderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53d.3.b
    text: 260 leerlingen voor voorbereidend beroepsonderwijs met één profiel;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53d.3.c
    text: 160 leerlingen per profiel voor voorbereidend beroepsonderwijs met twee of meer profielen;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53d.3.d
    text: |-
      4/3 van het aantal leerlingen voor de overige scholen dat voor de desbetreffende schoolsoort is genoemd in
      [artikel 107, eerste lid onder e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
  - number: 53d.3.e
    text: |-
      3/2 van het aantal leerlingen genoemd in [artikel 107, tweede lid][ref1], voor praktijkonderwijs, middelbaar
      algemeen voortgezet onderwijs en hoger algemeen voortgezet onderwijs binnen een scholengemeenschap;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
  - number: 53d.3.f
    text: 130 leerlingen voor een afdeling voor hoger algemeen voortgezet onderwijs binnen een scholengemeenschap;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53d.3.g
    text: 293 leerlingen voor voorbereidend wetenschappelijk onderwijs binnen een scholengemeenschap; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53d.3.h
    text: 'voor scholen voor voorbereidend beroepsonderwijs binnen een scholengemeenschap:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53d.3.h.1
    text: |-
      195 leerlingen voor een school met één profiel als bedoeld in [10b, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 53d.3.h.2
    text: |-
      120 leerlingen per profiel voor een school met twee of meer profielen als bedoeld in [10b, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 53d.4
    text: Samenwerkingsscholen zijn toegankelijk voor leerlingen zonder onderscheid naar godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53d.5
    text: Aan een samenwerkingsschool is een identiteitscommissie verbonden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53d.6
    text: |-
      De identiteitscommissie adviseert gevraagd en ongevraagd het bevoegd gezag en de rector, directeur of centrale
      directie over alle aangelegenheden die betrekking hebben op de wijze waarop invulling wordt gegeven aan het
      openbare karakter en de identiteit van de samenwerkingsschool. De identiteitscommissie kan tevens voorstellen doen
      over de aangelegenheden, bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53d.7
    text: |-
      De statuten van de stichting die de samenwerkingsschool in stand houdt, voorzien in een regeling over de
      identiteitscommissie waarin in ieder geval de samenstelling, benoeming, herbenoeming, ontslag, duur van de
      benoeming, werkwijze, inrichting en bevoegdheden van de identiteitscommissie zijn vastgelegd alsmede een
      voorziening voor het beslechten van geschillen tussen het bevoegd gezag en de identiteitscommissie. Bij de
      samenstelling van de identiteitscommissie is sprake van een evenwichtige verdeling tussen openbaar en bijzonder
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53d.8
    text: |-
      Wijziging van de statuten van de stichting die de samenwerkingsschool in stand houdt voor zover die betrekking
      hebben op de regeling over de identiteitscommissie, is slechts mogelijk indien het bevoegd gezag en de
      identiteitscommissie daartoe gezamenlijk besluiten. Indien het een stichting betreft anders dan een stichting
      als bedoeld in [artikel 53c][ref1] en anders dan bedoeld in [artikel 42b][ref2], kan een wijziging als bedoeld
      in de eerste volzin uitsluitend tot stand komen met instemming van de gemeenteraad van de gemeente waarin
      de samenwerkingsschool gevestigd is. Instemming kan slechts worden onthouden indien overheersende invloed
      van de overheid in de identiteitscommissie niet is verzekerd voor zover het openbaar onderwijs binnen de
      samenwerkingsschool betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53c
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel42b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53c
        hoofdstuk: IV
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 42b
        hoofdstuk: II
        afdeling: I
  - number: 53d.9
    text: |-
      De stichting anders dan een stichting als bedoeld in [artikel 53c][ref1] en anders dan bedoeld in
      [artikel 42b][ref2] brengt jaarlijks aan de gemeenteraad van de gemeente waarin de samenwerkingsschool gevestigd
      is, verslag uit over de werkzaamheden waarbij in ieder geval aandacht wordt geschonken aan de wezenskenmerken van
      het openbaar onderwijs. Het verslag wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53c
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel42b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53c
        hoofdstuk: IV
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 42b
        hoofdstuk: II
        afdeling: I
  - number: 53d.10
    text: |-
      De voorschriften van deze wet en van andere wetten die het voortgezet onderwijs betreffen, alsmede de daarop
      gebaseerde regelingen, voor zover die voorschriften en regelingen betrekking hebben op een bijzondere school,
      zijn van overeenkomstige toepassing op een samenwerkingsschool als bedoeld in het eerste lid, tenzij het tegendeel
      blijkt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53d.11
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover
      het openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd
      is, de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het
      openbaar onderwijs betreft. De feitelijke samenwerking wordt beëindigd op 1 augustus van het jaar na een daartoe
      door de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is, en het bevoegd gezag van de
      samenwerkingsschool gezamenlijk genomen besluit.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53d.12
    text: |-
      Overdracht, opheffing of samenvoeging van de samenwerkingsschool is slechts mogelijk na instemming van de
      gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53d
  - number: 53e.1
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *fusie:* institutionele fusie of bestuursoverdracht,
        - *institutionele fusie:* fusie als bedoeld in [artikel 72, eerste lid][ref1], waarbij een school of
      scholengemeenschap ontstaat door samenvoeging van twee of meer scholen of scholengemeenschappen,
        - *bestuursoverdracht:* overdracht van een school of scholengemeenschap door het bevoegd gezag dat deze in stand
      houdt aan een ander bevoegd gezag in de zin van deze wet of een andere onderwijswet.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '72'
        paragraaf: '1'
        afdeling: I
  - number: 53e.2
    text: |-
      Het eerste lid, onderdeel c, is niet van toepassing op het instellen van een openbare rechtspersoon als bedoeld
      in [artikel 42a, eerste lid, eerste volzin][ref1] of de instandhouding van een of meer openbare scholen door een
      stichting als bedoeld in [artikel 42b, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel42a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel42b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 42a
        hoofdstuk: II
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 42b
        hoofdstuk: II
        afdeling: I
  - number: 53f.1
    text: Fusies worden niet tot stand gebracht dan nadat daarvoor goedkeuring is verleend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53f
  - number: 53f.2
    text: |-
      Indien bij een fusie een school voor praktijkonderwijs is betrokken, is goedkeuring niet vereist voor zover het die
      school betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53f
  - number: 53f.3
    text: |-
      De goedkeuring, bedoeld in het eerste lid, is niet vereist voor de bestuurlijke en institutionele fusie die
      noodzakelijk zijn voor de totstandkoming van de samenwerkingsschool, bedoeld in [artikel 53d, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53d
        hoofdstuk: IV
        afdeling: I
  - number: 53g.1
    text: |-
      De rechtspersoon dient dan wel de rechtspersonen gezamenlijk dienen een aanvraag in bij Onze Minister voor het
      verkrijgen van de goedkeuring, bedoeld in [artikel 53f, eerste lid][ref1]. De aanvraag gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53f
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53f
        hoofdstuk: V
        afdeling: I
  - number: 53g.1.a
    text: een door de rechtspersoon dan wel rechtspersonen opgestelde fusie-effectrapportage, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53g
  - number: 53g.1.b
    text: |-
      een schriftelijke verklaring van instemming met de fusie door de medezeggenschapsraden dan wel de
      gemeenschappelijke medezeggenschapsraden, dan wel
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53g
  - number: 53g.1.c
    text: |-
      de bindende uitspraak van de geschillencommissie op grond van
      [artikel 32, eerste dan wel vierde lid, tweede volzin, van de Wet medezeggenschap op scholen][ref1], dan wel de
      bindende uitspraak van de ondernemingskamer op grond van [artikel 36 van de Wet medezeggenschap op scholen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53g
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '36'
  - number: 53g.2
    text: |-
      Een aanvraag als bedoeld in het eerste lid geldt eveneens als een aanvraag om voor bekostiging in aanmerking te
      komen als bedoeld in [artikel 72][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '72'
        paragraaf: '1'
        afdeling: I
  - number: 53g.3
    text: 'De fusie-effectrapportage bevat ten minste een weergave van:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53g
  - number: 53g.3.a
    text: de motieven voor de fusie,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53g
  - number: 53g.3.b
    text: de alternatieven voor de fusie,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53g
  - number: 53g.3.c
    text: het tijdsbestek waarbinnen de fusie zal worden gerealiseerd,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53g
  - number: 53g.3.d
    text: de te bereiken doelen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53g
  - number: 53g.3.e
    text: |-
      de effecten van de fusie op de keuzevrijheid, in het bijzonder de effecten van de fusie op de spreiding en omvang
      van de rechtspersonen en vestigingen van scholen in de gemeenten waarin de huidige leerlingen van die scholen
      woonachtig zijn, de onderwijskundige en bestuurlijke diversiteit van het onderwijsaanbod in de betreffende
      gemeenten,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53g
  - number: 53g.3.f
    text: |-
      de financiële en personele gevolgen en de gevolgen voor leerlingen van de fusie, waaronder begrepen de gevolgen
      voor de voorzieningen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53g
  - number: 53g.3.g
    text: de wijze waarop over de fusie wordt gecommuniceerd,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53g
  - number: 53g.3.h
    text: de wijze waarop de fusie wordt geëvalueerd, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53g
  - number: 53g.3.i
    text: |-
      een advies van burgemeester en wethouders van de betrokken gemeenten over de wenselijkheid van de voorgestelde
      fusie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53g
  - number: 53g.4
    text: Bij ministeriële regeling wordt een modelformulier voor de fusie-effectrapportage vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53g
  - number: 53h.1
    text: 'Onze Minister kan goedkeuring onthouden indien als gevolg van de institutionele of bestuursoverdracht:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53h
  - number: 53h.1.a
    text: |-
      de daadwerkelijke variatie van het onderwijsaanbod, waaronder schoolsoort binnen de gemeenten waarin de huidige
      leerlingen van die scholen of rechtspersonen woonachtig zijn, op significante wijze wordt belemmerd, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53h
  - number: 53h.1.b
    text: |-
      het aandeel per schoolsoort van de bij de fusie betrokken scholen in het aantal leerlingen in de gemeenten
      waarin de huidige leerlingen van die scholen woonachtig zijn een nader bij ministeriële regeling vast te stellen
      percentage overschrijdt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53h
  - number: 53h.2
    text: |-
      Onze Minister kan bovendien goedkeuring onthouden aan een institutionele fusie indien de percentages leerlingen
      betrokken bij de fusie minder zijn dan de percentages bedoeld in [artikel 72][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53h
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '72'
        paragraaf: '1'
        afdeling: I
  - number: 53h.3
    text: |-
      Onze Minister laat zich ten aanzien van de goedkeuring, bedoeld in het eerste en tweede lid, adviseren door een
      onafhankelijke adviescommissie, tenzij de noodzaak daartoe ontbreekt. Bij ministeriële regeling wordt bepaald
      wanneer er geen sprake is van de noodzaak bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53h
  - number: 53h.4
    text: Onze Minister stelt beleidsregels vast omtrent de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53h
  - number: 53i.1
    text: |-
      Onze Minister besluit binnen 13 weken op een aanvraag als bedoeld in [artikel 53f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53f
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53i
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53f
        hoofdstuk: V
        afdeling: I
  - number: 53i.2
    text: |-
      De termijn bedoeld in het eerste lid kan ten hoogste met 13 weken worden verlengd. Van deze verlenging wordt,
      binnen de 13 weken bedoeld in het eerste lid, mededeling gedaan aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53i
  - number: 53i.3
    text: |-
      Op het besluit bedoeld in het eerste lid is [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel53i
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '54'
    text: |-
      Het bestuur van een bijzondere school voor voortgezet onderwijs geeft binnen vier weken na de oprichting van de
      school onder overlegging van de statuten der instelling, die de school in stand houdt, en van de reglementen, van
      die oprichting kennis aan Onze Minister. Indien de statuten of reglementen worden gewijzigd of ingetrokken, wordt
      eveneens binnen vier weken van de wijziging of van de intrekking van de statuten of reglementen aan Onze Minister
      kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel54
  - number: '55.1'
    text: |-
      Algemeen voortgezet onderwijs wordt slechts gegeven door wie voldoet aan [artikel 33, eerste lid][ref1]. De
      [artikelen 32e][ref2], [33, leden 1a tot en met vijf en veertien tot en met zeventien][ref3], [33a][ref4],
      [41a tot en met 41u][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel32e
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel33a
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel41a
