  - number: '108.5'
    text: |-
      In bijzondere gevallen kan Onze Minister op aanvraag van het bevoegd gezag besluiten voor een door hem te bepalen
      tijd toe te staan, dat een openbare school in stand wordt gehouden of een bijzondere school wordt bekostigd, ook
      al is het aantal leerlingen minder, dan in [artikel 107][ref1] is vermeld of als sprake is van een situatie als
      bedoeld in het derde lid, tweede volzin, of vierde lid, tweede volzin. Onze Minister besluit binnen zes maanden na
      ontvangst van een aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel108
