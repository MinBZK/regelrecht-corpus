        bwb_id: BWBR0042012
        artikel: '25'
  - number: 10b15.3
    text: |-
      [Artikel 24b][ref1] is van overeenkomstige toepassing op klachten over met de doorlopende leerroute vmbo-
      mbo verband houdende gedragingen en beslissingen van het bevoegd gezag van de instelling voor beroepsonderwijs
      waarmee een samenwerkingsovereenkomst als bedoeld in artikel is [10b11, tweede lid][ref2], is gesloten, of
      van het personeel van dat bevoegd gezag. Onverminderd [artikel 24b, vierde lid][ref3], is de voorzitter van de
      klachtencommissie niet werkzaam voor of bij dat bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b11
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel24b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b15
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 24b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b11
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 24b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b16.1
    text: |-
      In afwijking van de [artikelen 9][ref1] en [10a][ref2] en
      __REF002___________________________________________________________________________________________________________
      _ bedraagt de cursusduur van een doorlopende leerroute vmbo-mbo vanaf het derde leerjaar aan een school voor
      middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend beroepsonderwijs:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b16
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '9'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 10b16.1.a
    text: |-
      voor een doorlopende leerroute vmbo-mbo die opleidt tot het diploma van een eenjarige basisberoepsopleiding ten
      minste twee en ten hoogste drie jaren;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b16
  - number: 10b16.1.b
    text: |-
      voor een doorlopende leerroute vmbo-mbo die opleidt tot het diploma van een tweejarige basisberoepsopleiding of
      tweejarige vakopleiding ten minste drie en ten hoogste vier jaren;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b16
  - number: 10b16.1.c
    text: |-
      voor een doorlopende leerroute vmbo-mbo die opleidt tot het diploma van een driejarige vakopleiding of de
      middenkaderopleiding ten minste vier en ten hoogste vijf jaren;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b16
  - number: 10b16.1.d
    text: |-
      voor een doorlopende leerroute vmbo-mbo die opleidt tot het diploma van een middenkaderopleiding als bedoeld in
      [artikel 7.2.4a, vierde lid, van de Wet educatie en beroepsonderwijs][ref1] ten minste vijf en ten hoogste zes
      jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b16
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 10b16.2
    text: |-
      Ten aanzien van de basisberoepsopleiding, vakopleiding of middenkaderopleiding die deel uitmaakt van
      een doorlopende leerroute vmbo-mbo wordt onder «cursusduur» mede verstaan «studieduur als bedoeld in
      de Wet educatie en beroepsonderwijs» en wordt onder «jaar» mede verstaan «studiejaar als bedoeld in
      [artikel 1.1.1, onderdeel r, van de Wet educatie en beroepsonderwijs][ref1]».


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b16
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 10b17.1
    text: |-
      In afwijking van [artikel 6g, derde en vierde lid][ref1], en
      [artikel 7.2.7, derde lid, onderdelen b, c en d, en achtste lid, van de Wet educatie en beroepsonderwijs][ref2]
      omvat het onderwijsprogramma van een doorlopende leerroute vmbo-mbo waarvan een beroepsopleiding in de
      beroepsopleidende leerweg, bedoeld in artikel 7.2.7, derde lid, van de Wet educatie en beroepsonderwijs deel
      uitmaakt:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b17
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6g
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 10b17.1.a
    text: |-
      bij een cursusduur van twee jaren ten minste 2.000 klokuren, waarvan ten minste 1.400 begeleide onderwijsuren en
      ten minste 250 klokuren aan beroepspraktijkvorming;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b17
  - number: 10b17.1.b
    text: |-
      bij een cursusduur van drie jaren ten minste 3.000 klokuren, waarvan ten minste 2.400 begeleide onderwijsuren en
      ten minste 250 klokuren aan beroepspraktijkvorming;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b17
  - number: 10b17.1.c
    text: |-
      bij een cursusduur van vier jaren ten minste 4.000 klokuren, waarvan ten minste 2.950 begeleide onderwijsuren en
      ten minste 450 klokuren aan beroepspraktijkvorming;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b17
  - number: 10b17.1.d
    text: |-
      bij een cursusduur van vijf jaren ten minste 5.000 klokuren, waarvan ten minste 3.500 begeleide onderwijsuren en
      ten minste 900 klokuren aan beroepspraktijkvorming; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b17
  - number: 10b17.1.e
    text: |-
      bij een cursusduur van zes jaren ten minste 6.000 klokuren, waarvan ten minste 4.050 begeleide onderwijsuren en ten
      minste 1.350 klokuren aan beroepspraktijkvorming.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b17
  - number: 10b17.2
    text: |-
      Het bevoegd gezag van de school en het bevoegd gezag van de instelling voor beroepsonderwijs kunnen gezamenlijk
      een onderwijsprogramma verzorgen dat minder uren omvat dan de in het eerste lid, onderdelen a tot en met e,
      genoemde aantallen mits de doorlopende leerroute vmbo-mbo aantoonbaar van voldoende kwaliteit is. In het geval
      dat het onderwijsprogramma minder uren omvat, legt het bevoegd gezag dit vast in het schoolplan, bedoeld in
      [artikel 24, eerste lid][ref1], en neemt dit op in de schoolgids, bedoeld in [artikel 24a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel24a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b17
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 24a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b18.1
    text: |-
      In afwijking van [artikel 6g, derde en vierde lid][ref1], en
      [artikel 7.2.7, vierde lid, eerste volzin, van de Wet educatie en beroepsonderwijs][ref2], en onverminderd
      [artikel 8.1.1, derde lid, van die wet][ref3] omvat het onderwijsprogramma van een doorlopende leerroute vmbo-mbo
      waarvan een beroepsopleiding in de beroepsbegeleidende leerweg, bedoeld in artikel 7.2.7, vierde lid, van de Wet
      educatie en beroepsonderwijs deel uitmaakt:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b18
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6g
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '8'
  - number: 10b18.1.a
    text: |-
      bij een cursusduur van twee jaren ten minste 1.850 klokuren, waarvan ten minste 900 begeleide onderwijsuren en ten
      minste 610 klokuren aan beroepspraktijkvorming;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b18
  - number: 10b18.1.b
    text: |-
      bij een cursusduur van drie jaren ten minste 2.850 klokuren, waarvan ten minste 2.200 begeleide onderwijsuren en
      ten minste 610 klokuren aan beroepspraktijkvorming;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b18
  - number: 10b18.1.c
    text: |-
      bij een cursusduur van vier jaren 3.700 klokuren, waarvan ten minste 2.400 begeleide onderwijsuren en ten minste
      1.220 klokuren aan beroepspraktijkvorming;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b18
  - number: 10b18.1.d
    text: |-
      bij een cursusduur van vijf jaren ten minste 4.550 klokuren, waarvan ten minste 2.600 begeleide onderwijsuren en
      ten minste 1.830 klokuren aan beroepspraktijkvorming; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b18
  - number: 10b18.1.e
    text: |-
      bij een cursusduur van zes jaren ten minste 5.400 klokuren, waarvan ten minste 2.800 begeleide onderwijsuren en ten
      minste 2.300 klokuren aan beroepspraktijkvorming.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b18
  - number: 10b18.2
    text: |-
      Het bevoegd gezag van de school en het bevoegd gezag van de instelling voor beroepsonderwijs kunnen gezamenlijk
      een onderwijsprogramma verzorgen dat minder uren omvat dan de in het eerste lid, onderdelen a tot en met e,
      genoemde aantallen mits de doorlopende leerroute vmbo-mbo aantoonbaar van voldoende kwaliteit is. In het geval
      dat het onderwijsprogramma minder uren omvat, legt het bevoegd gezag dit vast in het schoolplan, bedoeld in
      [artikel 24, eerste lid][ref1], en neemt dit op in de schoolgids, bedoeld in [artikel 24a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel24a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b18
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 24a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b19.1
    text: |-
      Afhankelijk van de inrichting van de doorlopende leerroute vmbo-mbo door het bevoegd gezag vallen het eerste
      en tweede tijdvak van het centraal examen van het eindexamen, bedoeld in [artikel 29, eerste lid][ref1], in het
      tweede of derde leerjaar van die doorlopende leerroute vmbo-mbo. Het bevoegd gezag kan leerlingen in de gelegenheid
      stellen om in het eerste leerjaar van de doorlopende leerroute vmbo-mbo centraal examen af te leggen in een of meer
      vakken van het eindexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b19
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 10b19.2
    text: |-
      Het derde tijdvak van het centraal examen wordt afgenomen door het College voor toetsen en examens aansluitend aan
      het leerjaar waarin de kandidaat centraal examen heeft afgelegd in het eerste of tweede tijdvak.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b19
  - number: 10b19.3
    text: |-
      Het bepaalde bij of krachtens [artikel 29][ref1] is van overeenkomstige toepassing op het derde leerjaar van een
      doorlopende leerroute vmbo-mbo.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b19
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 10b19.4
    text: |-
      Indien een voormalige leerling van de school, nadat die ingevolge [artikel 10b14, tweede lid][ref1], als mbo-
      student is ingeschreven aan de instelling voor beroepsonderwijs waarmee de school gezamenlijk een doorlopende
      leerroute vmbo-mbo verzorgt nog geen volledig eindexamen vmbo heeft afgelegd, meldt het bevoegd gezag van de
      school hem in het derde leerjaar van de doorlopende leerroute vmbo-mbo aan als kandidaat voor het eindexamen.
      Het eindexamen wordt afgenomen onder verantwoordelijkheid van het bevoegd gezag van de school. De directeur en de
      secretaris van de school stellen de uitslag van het eindexamen vast. De directeur reikt de kandidaat die geslaagd
      is voor het eindexamen een diploma van de betreffende leerweg uit.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b14
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b19
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b14
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b19.5
    text: |-
      Indien de leerling in het eerste of tweede leerjaar van de doorlopende leerroute vmbo-mbo in één of meer vakken
      centraal examen heeft afgelegd, en niet is bevorderd tot het volgende leerjaar, vervallen de met dit centrale
      examen behaalde resultaten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b19
  - number: 10b19.6
    text: |-
      Indien de leerling is afgewezen voor het eindexamen, treedt de overstapoptie, bedoeld in [artikel 10b20][ref1]
      in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b20
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b19
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b20
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b20.1
    text: |-
      Indien deelname van de leerling aan een doorlopende leerroute vmbo-mbo wordt beëindigd voordat hij deze met
      succes heeft afgerond wordt hij door het bevoegd gezag van de school of het bevoegd gezag van de instelling voor
      beroepsonderwijs in staat gesteld een vmbo-diploma of het diploma van een beroepsopleiding te behalen, passend bij
      het naar het gezamenlijk oordeel van beide betrokken bevoegde gezagsorganen bereikte onderwijsniveau en de leeftijd
      van de leerling.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b20
  - number: 10b20.2
    text: |-
      Indien de leerling ingevolge het eerste lid een diploma van een beroepsopleiding wil behalen bij dezelfde
      instelling voor beroepsonderwijs, zijn de [artikelen 8.1.1c][ref1], [8.2.1][ref2], [8.2.2][ref3] en
      [8.2.2a van de Wet educatie en beroepsonderwijs][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b20
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '8'
  - number: 10b20.3
    text: |-
      Het eerste lid is niet van toepassing indien de leerling definitief van de school wordt verwijderd als bedoeld in
      [artikel 27, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b20
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b21.1
    text: |-
      In overleg met de leerling en diens ouders kan het bevoegd gezag van een school voor voorbereidend
      beroepsonderwijs leerlingen die daarbij naar zijn oordeel gebaat zijn in de gelegenheid stellen om in plaats van
      de basisberoepsgerichte leerweg een geïntegreerde route vmbo-basisberoepsopleiding te volgen. Het bevoegd gezag
      besluit hiertoe slechts na overleg met het bevoegd gezag van de instelling voor beroepsonderwijs waarmee het
      een samenwerkingsovereenkomst als bedoeld in [artikel 8.4.3 van de Wet educatie en beroepsonderwijs][ref1] heeft
      gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b21
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
  - number: 10b21.2
    text: |-
      De geïntegreerde route vmbo-basisberoepsopleiding is een onderwijsprogramma vanaf het derde leerjaar aan een school
      voor voorbereidend beroepsonderwijs, dat opleidt tot het diploma van een basisberoepsopleiding in een aanverwant
      opleidingsdomein of een aanverwante kwalificatie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b21
  - number: 10b21.3
    text: |-
      De geïntegreerde route vmbo-basisberoepsopleiding stemt wat betreft het daarvan onderdeel uitmakende voortgezet
      onderwijs overeen met een of meer van de profielen, bedoeld in [artikel 10b, derde lid][ref1], die aan de school
      worden verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b21
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b21.4
    text: |-
      Het bevoegd gezag is niet gehouden leerlingen die de geïntegreerde route vmbo-basisberoepsopleiding volgen
      gelegenheid te geven om aan de school een eindexamen in de basisberoepsgerichte leerweg af te leggen als bedoeld in
      [artikel 29, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b21
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 10b21.5
    text: |-
      De [artikelen 10b11 tot en met 10b20][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b21
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '11'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10b21.6
    text: |-
      Dit artikel is van overeenkomstige toepassing op een agrarisch opleidingscentrum wat betreft het voorbereidend
      beroepsonderwijs dat daaraan wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10b21
  - number: 10d.1
    text: |-
      Naast het onderwijs in de leerwegen, genoemd in de [artikelen 10][ref1] en [10b][ref2], kan onderwijs in de
      gemengde leerweg worden gegeven aan:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10d.1.a
    text: |-
      een scholengemeenschap met in elk geval een school voor middelbaar algemeen voortgezet onderwijs en een school voor
      voorbereidend beroepsonderwijs, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.1.b
    text: |-
      een vestiging van een agrarisch opleidingscentrum wat het daarin verzorgde voorbereidend beroepsonderwijs betreft,
      indien:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.1.b.1°
    text: |-
      het agrarisch opleidingscentrum onderdeel uitmaakt van een verticale scholengemeenschap waarvan tevens een school
      voor middelbaar algemeen voortgezet onderwijs onderdeel uitmaakt, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.1.b.2°
    text: |-
      het voorbereidend beroepsonderwijs op de desbetreffende vestiging deels leerlingen betrekt uit hetzelfde gebied als
      de desbetreffende school voor middelbaar algemeen voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.2
    text: |-
      Het onderwijs in de gemengde leerweg is met ingang van het derde leerjaar ingericht volgens profielen. Een profiel
      is een in schooltijd verzorgd samenhangend onderwijsprogramma, zodanig ingericht dat het biedt:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.2.a
    text: een algemene maatschappelijke voorbereiding en persoonlijke vorming, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.2.b
    text: een voorbereiding op naar inhoud verwante opleidingen in het aansluitend beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.3
    text: 'De school verzorgt één of meer profielen. De profielen zijn:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.3.a
    text: bouwen, wonen en interieur,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.3.b
    text: produceren, installeren en energie,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.3.c
    text: mobiliteit en transport,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.3.d
    text: media, vormgeving en ICT,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.3.e
    text: maritiem en techniek,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.3.f
    text: zorg en welzijn,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.3.g
    text: economie en ondernemen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.3.h
    text: horeca, bakkerij en recreatie,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.3.i
    text: groen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.3.j
    text: dienstverlening en producten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.4
    text: 'Elk profiel bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.4.a
    text: een gemeenschappelijk deel, dat voor alle profielen gelijk is,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.4.b
    text: een profieldeel, dat kenmerkend is voor dat profiel, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.4.c
    text: een vrij deel, dat bestaat uit door de leerling te kiezen vakken en andere programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.5
    text: |-
      Het gemeenschappelijk deel van elk profiel in de gemengde leerweg omvat Nederlandse taal, Engelse taal,
      maatschappijleer, lichamelijke opvoeding en ten minste één van de vakken behorende tot de beeldende vorming,
      muziek, dans of drama.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.6
    text: 'Het profieldeel van de gemengde leerweg omvat het bij het betreffende profiel behorende profielvak en, wat betreft:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.6.a
    text: 'de profielen, genoemd in het derde lid, onderdelen a tot en met e: wiskunde en natuur- en scheikunde I,'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.6.b
    text: |-
      het profiel, genoemd in het derde lid, onderdeel f: biologie en, ter keuze van de leerling, wiskunde,
      maatschappijkunde, geschiedenis en staatsinrichting, of aardrijkskunde, met dien verstande dat het bevoegd gezag
      beslist welke van de laatste drie vakken wordt of worden aangeboden,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.6.c
    text: |-
      de profielen, genoemd in het derde lid, onderdelen g en h: economie en, ter keuze van de leerling, wiskunde, Franse
      taal of Duitse taal,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.6.d
    text: |-
      het profiel genoemd in het derde lid, onderdeel i: wiskunde en, ter keuze van de leerling, biologie of natuur- en
      scheikunde I,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.6.e
    text: |-
      het profiel genoemd in het derde lid, onderdeel j: ter keuze van de leerling twee van de vakken wiskunde, economie,
      biologie en natuur- en scheikunde I.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.7
    text: 'Het vrije deel van elk profiel in de gemengde leerweg:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.7.a
    text: omvat door de leerling te kiezen vakken, genoemd in het zesde lid,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.7.b
    text: omvat door de leerling te kiezen beroepsgerichte keuzevakken,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.7.c
    text: |-
      kan omvatten natuur- en scheikunde II, Spaanse taal, Turkse taal, Arabische taal, vakken behorende tot de beeldende
      vorming, muziek, dans, drama, Friese taal en cultuur, lichamelijke opvoeding 2 en informatietechnologie, door de
      leerling te kiezen, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.7.d
    text: kan omvatten door het bevoegd gezag vast te stellen vakken en programma-onderdelen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.8
    text: |-
      Het bevoegd gezag beslist welke keuzetaal, genoemd in het zesde lid, onderdeel c, welke beroepsgerichte
      keuzevakken, bedoeld in het zevende lid, onderdeel b, en welke vakken, genoemd in het zevende lid, onderdeel c,
      worden aangeboden. Het bevoegd gezag kan tevens beslissen dat door het bevoegd gezag aan te wijzen vakken en andere
      programma-onderdelen, bedoeld in het zevende lid, onderdeel d, door alle leerlingen in het vrije deel moeten worden
      gevolgd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.9
    text: |-
      Het bevoegd gezag kan de leerling in de gelegenheid stellen, in plaats van de vakken, genoemd in het vijfde,
      zesde en zevende lid, onderdeel c, de overeenkomstige vakken, genoemd in dan wel aangewezen op grond van de
      [artikelen 13][ref1] en [14][ref2] te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel14
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10d.10
    text: 'Bij of krachtens algemene maatregel van bestuur worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.10.a
    text: de profielvakken, bedoeld in het zesde lid,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.10.b
    text: voorschriften met betrekking tot de beroepsgerichte keuzevakken, bedoeld in het zevende lid, onderdeel b, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.10.c
    text: |-
      voorschriften over de mogelijkheid van vrijstelling en de bevoegdheid van het bevoegd gezag om ontheffing te
      verlenen van onderdelen van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10d.11
    text: |-
      Onverminderd het zesde en zevende lid, kan bij algemene maatregel van bestuur worden vastgesteld het door alle
      leerlingen in het derde leerjaar te volgen minimum aantal vakken waarin eindexamen kan worden afgelegd, alsmede
      welke vakken het betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10d
  - number: 10e.1
    text: |-
      Leerwegondersteunend onderwijs wordt verzorgd ter voorbereiding op of gedurende het volgen van onderwijs in een van
      de leerwegen, genoemd in de [artikelen 10][ref1], [10b][ref2] en [10d][ref3], ten behoeve van de leerling voor wie
      vaststaat dat een orthopedagogische en orthodidactische benadering is geboden met het oog op het afsluiten van het
      onderwijs in een van deze leerwegen. Leerwegondersteunend onderwijs wordt zodanig in het onderwijs geïntegreerd en
      ingericht dat de leerling een ononderbroken ontwikkelingsproces, gericht op het afsluiten als bedoeld in de eerste
      volzin, kan volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10e.2
    text: |-
      Leerwegondersteunend onderwijs wordt verzorgd, indien de leerling met behulp van de voorzieningen, bedoeld in
      [artikel 24, tweede lid, tweede volzin][ref1], niet een ononderbroken ontwikkelingsproces als bedoeld in het eerste
      lid, kan volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10e.3
    text: |-
      Het bevoegd gezag beslist na overleg met de ouders van de leerling of aan de leerling leerwegondersteunend
      onderwijs wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10e
  - number: 10e.4
    text: |-
      Het samenwerkingsverband beslist op aanvraag van het bevoegd gezag of de leerling op leerwegondersteunend onderwijs
      is aangewezen. Het bevoegd gezag voegt bij de aanvraag na overleg met de ouders een op de desbetreffende leerling
      betrekking hebbend onderwijskundig rapport als bedoeld in [artikel 42 van de Wet op het primair onderwijs][ref1]
      en [artikel 43 van de Wet op de expertisecentra][ref2]. [Artikel 10g, derde, vierde en zesde lid][ref3], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10g
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '43'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10g
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10f.1
    text: Praktijkonderwijs wordt gegeven aan scholen voor praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10f
  - number: 10f.2
    text: Praktijkonderwijs is onderwijs voor leerlingen voor wie vaststaat dat
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10f
  - number: 10f.2.a
    text: overwegend een orthopedagogische en orthodidactische benadering is geboden, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10f
  - number: 10f.2.b
    text: |-
      het volgen van het onderwijs in een van de leerwegen, genoemd in de [artikelen 10][ref1], [10b][ref2]
      en [10d][ref3], al dan niet in combinatie met het volgen van leerwegondersteunend onderwijs, bedoeld in
      [artikel 10e][ref4], niet leidt tot het behalen van een diploma of een getuigschrift voorbereidend middelbaar
      beroepsonderwijs als bedoeld in [artikel 29][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10e
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 10e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 10f.3
    text: |-
      Praktijkonderwijs bestaat uit een gedeelte waarin aangepast theoretisch onderwijs, persoonlijkheidsvorming
      en het aanleren van sociale vaardigheden worden verzorgd, en een gedeelte waarin de leerling wordt voorbereid
      op het uitoefenen van functies op de arbeidsmarkt. Praktijkonderwijs wordt zo veel mogelijk op basis van
      de kerndoelen verzorgd en is er op gericht dat leerlingen zo veel mogelijk het referentieniveau Nederlandse
      taal en het referentieniveau rekenen bereiken die voor het praktijkonderwijs zijn vastgesteld op grond van
      [artikel 2, tweede lid, aanhef en onderdeel c, van de Wet referentieniveaus Nederlandse taal en rekenen][ref1].
      Praktijkonderwijs bereidt de leerling voor op functies binnen de regionale
      arbeidsmarkt op een niveau dat ligt onder het niveau van de entreeopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref2]


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10f
    references:
      - id: ref1
        bwb_id: BWBR0027679
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 10f.3a
    text: |-
      Het praktijkonderwijs wordt zodanig ingericht dat de leerlingen per schooljaar ten minste 1000 klokuren
      praktijkonderwijs ontvangen. De leerlingen ontvangen per dag ten hoogste 5,5 uren praktijkonderwijs, voor zover het
      betreft aangepast theoretisch onderwijs, persoonlijkheidsvorming en het aanleren van sociale vaardigheden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10f
  - number: 10f.4
    text: |-
      Het bevoegd gezag van een school voor praktijkonderwijs kan, met inachtneming van de tweede volzin van het derde
      lid en van lid 3a, indien dat ten behoeve van de leerling noodzakelijk is, bij het aanbieden van dat onderwijs
      afwijken van de voorschriften, gegeven bij of krachtens de [artikelen 6g1][ref1], [11a tot en met 11c][ref2] en
      [29][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6g1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6g1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 11a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 10f.5
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld met betrekking tot de vakken die het
      praktijkonderwijs omvat, alsmede met betrekking tot het aantal uren dat het onderricht in de praktijk van de
      uitoefening van een vak of beroep gedurende een schoolweek ten hoogste omvat.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10f
  - number: 10g.1
    text: |-
      Aan de ouders van een leerling van wie het bevoegd gezag van de school waar de leerling zich aanmeldt dan wel van
      de school waaraan de leerling is ingeschreven, redelijkerwijs kan aannemen dat deze niet in staat is het onderwijs
      in een van de leerwegen, genoemd in de [artikelen 10][ref1], [10b][ref2] en [10d][ref3], al dan niet in combinatie
      met leerwegondersteunend onderwijs, bedoeld in [artikel 10e][ref4], met een diploma of getuigschrift voorbereidend
      middelbaar beroepsonderwijs als bedoeld in [artikel 29, derde lid][ref5], af te sluiten, kan het bevoegd gezag
      voorstellen deze leerling in plaats daarvan praktijkonderwijs te doen volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10e
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel29
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 10e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 10g.2
    text: |-
      Het samenwerkingsverband beslist op aanvraag van het bevoegd gezag of de leerling toelaatbaar is tot
      het praktijkonderwijs. De aanvraag gaat vergezeld van een op de desbetreffende leerling betrekking
      hebbend onderwijskundig rapport als bedoeld in [artikel 42 van de Wet op het primair onderwijs][ref1] en
      [artikel 43 van de Wet op de expertisecentra][ref2] en de op schrift gestelde zienswijze van de ouders. Indien
      het samenwerkingsverband heeft bepaald dat de leerling toelaatbaar is tot het praktijkonderwijs, beslist het
      bevoegd gezag van de school voor praktijkonderwijs na overleg met de ouders van de leerling over de toelating van
      de leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel43
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '43'
  - number: 10g.3
    text: 'Een aanvraag bij een samenwerkingsverband kan worden ingediend voor een leerling die:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10g
  - number: 10g.3.a
    text: |-
      rechtstreeks afkomstig is van een school of instelling als bedoeld in de [Wet op het primair onderwijs][ref1] of de
      [Wet op de expertisecentra][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
  - number: 10g.3.b
    text: rechtstreeks afkomstig is van het eerste leerjaar van een school voor voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10g
  - number: 10g.4
    text: |-
      In afwijking van het derde lid kan een aanvraag slechts worden ingediend na dat schooljaar, indien het een
      vreemdeling betreft als bedoeld in [artikel 27, lid 1a, onderdeel b of c][ref1], die op 1 oktober van het
      schooljaar waarin hij voor het eerst wordt meegeteld als leerling in het voortgezet onderwijs korter dan een jaar
      in Nederland is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '27'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 10g.5
    text: |-
      In afwijking van het derde en vierde lid kan tevens een aanvraag voor toelaatbaarheid tot het praktijkonderwijs bij
      een samenwerkingsverband worden ingediend voor een leerling die voldoet aan bij of krachtens algemene maatregel van
      bestuur te stellen criteria.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10g
  - number: 10g.6
    text: |-
      Een beschikking van een samenwerkingsverband omtrent de toelaatbaarheid van een leerling is geen besluit als
      bedoeld in [artikel 8:4, derde lid, onder b, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 11a
    text: |-
      Het onderwijs in de eerste twee leerjaren wordt zodanig ingericht dat met behoud van keuzevrijheid de doorstroming
      van leerlingen wordt bevorderd naar een van de profielen, bedoeld in de [artikelen 10][ref1], [10b][ref2] of
      [10d][ref3] of naar het derde leerjaar voorbereidend wetenschappelijk onderwijs en hoger algemeen voortgezet
      onderwijs en vervolgens naar de periode van voorbereidend hoger onderwijs, bedoeld in [artikel 12][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel12
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 10d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11b
    text: 'Bij algemene maatregel van bestuur worden kerndoelen vastgesteld, waarbij aandacht wordt besteed aan aspecten van:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11b
  - number: 11b.a
    text: Nederlandse taal,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11b
  - number: 11b.b
    text: Engelse taal,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11b
  - number: 11b.c
    text: geschiedenis en staatsinrichting,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11b
  - number: 11b.d
    text: aardrijkskunde,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11b
  - number: 11b.e
    text: economie,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11b
  - number: 11b.f
    text: wiskunde,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11b
  - number: 11b.g
    text: natuur- en scheikunde,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11b
  - number: 11b.h
    text: biologie,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11b
  - number: 11b.i
    text: verzorging,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11b
  - number: 11b.j
    text: informatiekunde,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11b
  - number: 11b.k
    text: techniek,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11b
  - number: 11b.l
    text: lichamelijke opvoeding, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11b
  - number: 11b.m
    text: beeldende vorming, muziek, drama en dans.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11b
  - number: 11c.1
    text: |-
      Het bevoegd gezag richt voor de eerste twee leerjaren een in schooltijd verzorgd samenhangend onderwijsprogramma
      in. Dit programma voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11c
  - number: 11c.1.a
    text: |-
      het bevoegd gezag werkt de kerndoelen uit voor de verschillende schoolsoorten en verschillende groepen leerlingen,
      onverminderd de doorstroombevordering met behoud van keuzevrijheid van leerlingen, bedoeld in [artikel 11a][ref1],
      en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11c.1.b
    text: in de eerste twee leerjaren worden gezamenlijk ten minste 1425 uren onderwijs verzorgd op basis van de kerndoelen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11c
  - number: 11c.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven voor het verzorgen van
      onderwijs in de eerste twee leerjaren naast het onderwijs dat wordt verzorgd op basis van de kerndoelen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11c
  - number: 11c.3
    text: Het bevoegd gezag beschikt over geordende gegevens met betrekking tot de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11c
  - number: 11d.1
    text: |-
      Het bevoegd gezag van een school voor voorbereidend wetenschappelijk onderwijs, voor algemeen voortgezet onderwijs
      en voor voorbereidend beroepsonderwijs kan na overleg met de ouders een leerling ontheffing verlenen voor
      onderdelen van het onderwijsprogramma, bedoeld in [artikel 11c, eerste lid, onderdeel a][ref1]. Het bevoegd gezag
      bepaalt bij de ontheffing welk onderwijs voor de leerling in de plaats komt voor de onderdelen waarvoor ontheffing
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11c
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11d.2
    text: |-
      Het bevoegd gezag van een school voor voorbereidend wetenschappelijk onderwijs, voor algemeen voortgezet
      onderwijs en voor voorbereidend beroepsonderwijs kan voor leerlingen die daarvoor in aanmerking komen, bij
      de inrichting van het onderwijs afwijken van een of meer programmaonderdelen of van de voorschriften bedoeld
      in [artikel 11c, eerste lid, onderdeel a][ref1]. De laatste volzin van het eerste lid is van overeenkomstige
      toepassing. Bij algemene maatregel van bestuur wordt bepaald hoe wordt vastgesteld welke leerlingen in aanmerking
      komen voor deze afwijkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11c
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11d.3
    text: 'Voor leerlingen:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11d
  - number: 11d.3.a
    text: |-
      die leerwegondersteunend onderwijs volgen als bedoeld in [artikel 10e][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10e
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11d.3.b
    text: |-
      voor wie het bevoegd gezag het volgen van een leer-werktraject als bedoeld in [artikel 10b1][ref1] het meest
      geschikt acht, verzorgt het bevoegd gezag in de eerste twee leerjaren gezamenlijk ten minste 1425 uren onderwijs op
      basis van kerndoelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11e.1
    text: |-
      Op de scholen in de provincie Fryslân wordt met inachtneming van de daarvoor vastgestelde kerndoelen tevens
      onderwijs gegeven in de Friese taal en cultuur, tenzij gedeputeerde staten op aanvraag van het bevoegd gezag
      gedeeltelijke of volledige ontheffing van deze verplichting hebben verleend. Gedeputeerde staten stellen in een
      beleidsregel criteria vast voor die gedeeltelijke en volledige ontheffing. De vaststelling van deze criteria
      geschiedt niet eerder dan nadat gedeputeerde staten overleg hebben gevoerd met het Friese voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11e
  - number: 11e.2
    text: |-
      Provinciale staten van Fryslân stellen de kerndoelen Friese taal en cultuur, bedoeld in het eerste lid, bij
      verordening vast. De vaststelling geschiedt niet eerder dan nadat gedeputeerde staten overleg hebben gevoerd met
      het Friese voortgezet onderwijs. De verordening behoeft de goedkeuring van Onze Minister. Indien Onze Minister
      voornemens is goedkeuring te onthouden, verzoekt hij de Onderwijsraad een advies uit te brengen. Het verzoek bevat
      een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies wordt binnen zes weken uitgebracht
      aan Onze Minister en wordt bekend gemaakt. Onze Minister informeert beide Kamers der Staten-Generaal over zijn
      voornemen om al dan niet goed te keuren. [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is niet van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 11e.3
    text: |-
      Onze Minister kan goedkeuring in ieder geval onthouden indien aan de volgende voorwaarden, waarvoor gedeputeerde
      staten gegevens aandragen, niet wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11e
  - number: 11e.3.a
    text: |-
      het bestaan van voldoende draagvlak in het Friese voortgezet onderwijs voor de voorgelegde kerndoelen Friese taal
      en cultuur;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11e
  - number: 11e.3.b
    text: |-
      dat de kerndoelen Friese taal en cultuur niet meer inspanningen vergen van het Friese voortgezet onderwijs
      dan het aandeel van het onderwijs in de Friese taal en cultuur binnen het onderwijsprogramma, bedoeld in
      [artikel 11c, eerste lid][ref1], rechtvaardigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11c
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11e.4
    text: |-
      Onze Minister kan goedkeuring in ieder geval onthouden indien de kerndoelen Friese taal en cultuur geen aandacht
      schenken aan:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11e
  - number: 11e.4.a
    text: het zich mondeling uitdrukken in het Fries en het verstaan van de Fries gesproken taal,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11e
  - number: 11e.4.b
    text: het zich schriftelijk uitdrukken in het Fries en het verwerven van informatie uit in het Fries gestelde teksten,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11e
  - number: 11e.4.c
    text: bevordering van het begrip van de Friese taal en cultuur, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11e
  - number: 11e.4.d
    text: het ontwikkelen van een positieve houding ten aanzien van het gebruik van het Fries.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11e
  - number: 11f
    text: |-
      Op het onderwijs in het derde leerjaar aan scholen voor voorbereidend wetenschappelijk onderwijs en voor hoger
      algemeen voortgezet onderwijs zijn van overeenkomstige toepassing:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11f
  - number: 11f.a
    text: |-
      [artikel 11a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 11f.b
    text: |-
      [artikel 11c][ref1] met uitzondering van het eerste lid, tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11c
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel11f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 11c
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '12.1'
    text: |-
      Het onderwijs aan scholen voor voorbereidend wetenschappelijk onderwijs en aan scholen voor hoger algemeen
      voortgezet onderwijs omvat met ingang van het vierde leerjaar een periode van voorbereidend hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel12
  - number: '12.2'
    text: |-
      De periode van voorbereidend hoger onderwijs is ingericht volgens profielen. Een profiel is een samenhangend
      onderwijsprogramma, zodanig ingericht dat het biedt:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel12
  - number: 12.2.a
    text: een algemene maatschappelijke voorbereiding en persoonlijke vorming,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel12
  - number: 12.2.b
    text: een algemene voorbereiding op het hoger onderwijs, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel12
  - number: 12.2.c
    text: een bijzondere voorbereiding op groepen van naar inhoud verwante opleidingen in het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel12
  - number: '12.3'
    text: 'De school verzorgt alle profielen. De profielen zijn:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel12
  - number: 12.3.a
    text: het profiel natuur en techniek;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel12
  - number: 12.3.b
    text: het profiel natuur en gezondheid;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel12
  - number: 12.3.c
    text: het profiel economie en maatschappij;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel12
  - number: 12.3.d
    text: het profiel cultuur en maatschappij.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel12
  - number: '12.4'
    text: 'Elk profiel bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel12
  - number: 12.4.a
    text: een gemeenschappelijk deel, dat voor alle profielen van de desbetreffende schoolsoort gelijk is,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel12
  - number: 12.4.b
    text: een profieldeel, dat kenmerkend is voor dat profiel, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel12
  - number: 12.4.c
    text: een vrij deel.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel12
  - number: '12.5'
    text: |-
      Het bevoegd gezag richt het onderwijs in de periode van voorbereidend hoger onderwijs in op de grondslag van een
      normatieve studielast voor de leerling van 1600 uren per leerjaar, uitgaande van 40 weken met elk een normatieve
      studielast van 40 uren. Het bevoegd gezag richt daarbij een in schooltijd verzorgd samenhangend onderwijsprogramma
      in.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel12
  - number: '13.1'
    text: 'Het gemeenschappelijk deel van elk profiel in het atheneum omvat:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: 13.1.a
    text: Nederlandse taal en literatuur,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: 13.1.b
    text: Engelse taal en literatuur,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: 13.1.c
    text: |-
      een andere moderne vreemde taal en literatuur, bij algemene maatregel van bestuur aan te wijzen, of Friese taal en
      cultuur, ter keuze van de leerling, voor zover het bevoegd gezag deze vakken aanbiedt,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: 13.1.d
    text: maatschappijleer,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: 13.1.e
    text: |-
      culturele en kunstzinnige vorming, met dien verstande dat indien Latijnse taal en cultuur of Griekse taal en
      cultuur, dan wel beide, deel uitmaken van het profiel, de leerling is vrijgesteld van het volgen van het vak
      culturele en kunstzinnige vorming, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: 13.1.f
    text: lichamelijke opvoeding.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: '13.2'
    text: 'Het gemeenschappelijk deel van elk profiel in het gymnasium omvat:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: 13.2.a
    text: Nederlandse taal en literatuur,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: 13.2.b
    text: Engelse taal en literatuur,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: 13.2.c
    text: |-
      Latijnse taal en cultuur of Griekse taal en cultuur, ter keuze van de leerling uit deze beide door het bevoegd
      gezag aan te bieden vakken,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: 13.2.d
    text: maatschappijleer, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: 13.2.e
    text: lichamelijke opvoeding.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: '13.3'
    text: 'Het profieldeel van het profiel natuur en techniek in het gymnasium en atheneum omvat:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: 13.3.a
    text: wiskunde,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: 13.3.b
    text: natuurkunde,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: 13.3.c
    text: scheikunde, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: 13.3.d
    text: |-
      een vak ter keuze van de leerling uit vakken die bij algemene maatregel van bestuur zijn aangewezen, voor zover het
      bevoegd gezag deze vakken aanbiedt.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel13
  - number: '13.4'
