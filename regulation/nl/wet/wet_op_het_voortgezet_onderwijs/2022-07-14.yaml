  - number: '33.12'
    text: |-
      Het negende lid is, behoudens de eis van verblijf in het laatste jaar van de opleiding, van overeenkomstige
      toepassing ten aanzien van ho-studenten van een universitaire lerarenopleiding, met dien verstande dat afwijking
      bij de voltijdse vorm van die opleiding mogelijk is voor ten hoogste de periode van een schooljaar waarin onderwijs
      wordt gegeven, en bij de deeltijdse vorm van die opleiding voor ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
  - number: '33.13'
    text: |-
      Voor door het bevoegd gezag vastgestelde vakken en andere programma-onderdelen, uitgezonderd godsdienstonderwijs
      en levensbeschouwelijk vormingsonderwijs, kunnen bij algemene maatregel van bestuur regels worden vastgesteld ten
      aanzien van benoeming dan wel tewerkstelling zonder benoeming. Bij deze algemene maatregel van bestuur kan het
      eerste lid geheel of gedeeltelijk van toepassing of overeenkomstige toepassing worden verklaard.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
  - number: '33.14'
    text: |-
      In geval van een geschiktheidsverklaring als bedoeld in [artikel 118k][ref1] vindt de benoeming of tewerkstelling
      zonder benoeming plaats voor een periode van ten hoogste twee aaneengesloten schooljaren. Het bevoegd gezag kan
      deze benoemingsperiode, al dan niet onder door dat gezag te stellen voorwaarden, verlengen met ten hoogste twee
      jaren indien het bevoegd gezag daarvoor redenen aanwezig acht. Het bevoegd gezag beschikt over geordende gegevens
      met betrekking tot de toepassing van de tweede volzin. Het bevoegd gezag dat betrokkene voor de eerste maal na
      afgifte van de geschiktheidsverklaring benoemt of tewerkstelt zonder benoeming, tekent het feit en de datum van
      benoeming of tewerkstelling zonder benoeming aan op die verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118k
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 118k
  - number: '33.15'
    text: |-
      Het bevoegd gezag kan afwijken van het eerste lid, onder b, ten aanzien van degene die gelet op specifieke
      kennis en bekwaamheden, samenhangend met ervaringen en werkzaamheden in andere sectoren van de samenleving en het
      bedrijfsleven, naar het oordeel van het bevoegd gezag voldoende bekwaam is om onder verantwoordelijkheid van een
      daartoe door het bevoegd gezag aan te wijzen leraar voor een beperkte betrekkingsomvang te worden belast met een
      uitsluitend lesgevende taak voor vakken waar die specifieke kennis en bekwaamheden in het bijzonder betrekking op
      hebben. De betrekkingsomvang is voor het totaal van de in de eerste volzin bedoelde lesgevende taken ten hoogste
      een aantal van op jaarbasis gemiddeld 6 klokuren per week.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
  - number: '33.16'
    text: |-
      Onze Minister kan met betrekking tot een vak of ander programmaonderdeel waarvoor niet met een getuigschrift
      afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] kan worden aangetoond dat
      betrokkene voldoet aan de bekwaamheidseisen, bedoeld in [artikel 36, eerste lid][ref2], en waarvoor de bekwaamheid
      evenmin blijkt uit de regeling bedoeld in lid 1c, onderdeel b, verklaren dat een leraar wordt geacht bij benoeming
      of tewerkstelling zonder benoeming te voldoen aan de bekwaamheidseisen tot het geven van voortgezet onderwijs in
      dat vak of dat andere programmaonderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '36'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 33a
    text: |-
      Onze Minister kan in aanvulling op [artikel 33, eerste lid][ref1], aan personen die in het bezit zijn van een
      buiten de Europese Economische Ruimte of Zwitserland behaald bewijsstuk, de bevoegdheid verlenen tot het geven van
      voortgezet onderwijs. Hij kan daarbij voorwaarden en beperkingen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '33'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 33b
    text: |-
      In afwijking van [artikel 33, eerste lid, onderdeel b][ref1], kan met het verzorgen van onderwijs in de
      entreeopleiding, bedoeld in [artikel 10b8][ref2], ook worden belast degene die in het bezit is van een
      geschiktheidsverklaring als bedoeld in [artikel 4.2.4, eerste lid, van de Wet educatie en beroepsonderwijs][ref3]
      voor tot die entreeopleiding behorend onderwijs, met dien verstande dat betrokkene tevens in het bezit is van een
      getuigschrift als bedoeld in [artikel 7a.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33b
    references:
