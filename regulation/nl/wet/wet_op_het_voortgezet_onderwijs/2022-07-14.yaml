  - number: '2.1'
    text: |-
      Het voortgezet onderwijs, bedoeld in deze wet, omvat het onderwijs dat wordt gegeven na het
      basisonderwijs en na het speciaal onderwijs. Het omvat niet het voortgezet speciaal onderwijs als
      bedoeld in de [Wet op de expertisecentra][ref1], educatie en beroepsonderwijs als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref2] en het hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0007625
  - number: '2.2'
    text: |-
      Het onderwijs wordt zodanig ingericht dat de leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen. Het
      wordt afgestemd op de voortgang in de ontwikkeling van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel2
  - number: 2a
    text: Voortgezet onderwijs mag slechts worden gegeven door degene die daartoe ingevolge deze wet bevoegd is.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel2a
  - number: '3.1'
    text: |-
      Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn school
      met taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden
      als bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een minderjarige leerling van
      de school, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '6'
  - number: '3.2'
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van
      een redelijk vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf
      als bedoeld in het eerste lid jegens een minderjarige leerling van de school, doet het bevoegd
      gezag onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 127][ref1] juncto
      [artikel 141 van het Wetboek van Strafvordering][ref2], en stelt het bevoegd gezag de vertrouwensinspecteur daarvan
      onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van aangifte, stelt het de ouders van de
      betrokken leerling, onderscheidenlijk de betreffende ten behoeve van de school met taken belaste persoon, hiervan
      op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '3.3'
    text: |-
      Indien een personeelslid op enigerlei wijze bekend is geworden dat een ten behoeve van de school met taken belast
      persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een
      minderjarige leerling van de school, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3
  - number: 3a.1
    text: |-
      Het bevoegd gezag of de natuurlijke persoon dan wel de rechtspersoon die een school in stand houdt die niet uit de
      openbare kas wordt bekostigd, stelt voor het personeel een meldcode vast waarin stapsgewijs wordt aangegeven hoe
      met signalen van huiselijk geweld of kindermishandeling wordt omgegaan en die er redelijkerwijs aan bijdraagt dat
      zo snel en adequaat mogelijk hulp kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3a
  - number: 3a.2
    text: |-
      Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
  - number: 3a.3
    text: |-
      Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 3a.4
    text: |-
      Het bevoegd gezag of de natuurlijke persoon dan wel de rechtspersoon die een school in stand houdt die niet uit de
      openbare kas wordt bekostigd, bevordert de kennis en het gebruik van de meldcode.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3a
  - number: 3a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3a
  - number: 3b.1
    text: 'Het bevoegd gezag draagt zorg voor de veiligheid op school, waarbij het bevoegd gezag in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3b
  - number: 3b.1.a
    text: beleid met betrekking tot de veiligheid voert,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3b
  - number: 3b.1.b
    text: |-
      de veiligheid van leerlingen op school monitort met een instrument dat een representatief en actueel beeld geeft,
      en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3b
  - number: 3b.1.c
    text: 'er zorg voor draagt dat bij een persoon ten minste de volgende taken zijn belegd:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3b
  - number: 3b.1.c.1°
    text: het coördineren van het beleid in het kader van het tegengaan van pesten, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3b
  - number: 3b.1.c.2°
    text: het fungeren als aanspreekpunt in het kader van pesten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3b
  - number: 3b.2
    text: |-
      Onder veiligheid, bedoeld in het eerste lid, wordt verstaan de sociale, psychische en fysieke veiligheid van
      leerlingen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3b
  - number: 3b.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het instrument, bedoeld in het
      eerste lid, onderdeel b, dat door de school wordt vormgegeven of gekozen, waaronder:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3b
  - number: 3b.3.a
    text: de aandachtsgebieden die het instrument inzichtelijk maakt,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3b
  - number: 3b.3.b
    text: de representativiteit van het instrument, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3b
  - number: 3b.3.c
    text: de frequentie waarmee het instrument wordt ingezet.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3b
  - number: 3b.4
    text: |-
      Het bevoegd gezag zendt onverwijld de resultaten van de monitor, bedoeld in het eerste lid, onderdeel b, aan de
      inspectie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel3b
  - number: '4.1'
    text: |-
      Ten behoeve van het schoolbezoek verstrekken burgemeester en wethouders aan ouders, voogden of verzorgers van in de
      gemeente verblijvende leerlingen die wegens hun lichamelijke, verstandelijke, zintuiglijke of psychische handicap
      op ander vervoer dan openbaar vervoer zijn aangewezen, dan wel vanwege een zodanige handicap niet zelfstandig van
      openbaar vervoer gebruik kunnen maken, op aanvraag vergoeding van de door burgemeester en wethouders noodzakelijk
      te achten vervoerskosten. Indien de leerling meerderjarig en handelingsbekwaam is, wordt de vergoeding op aanvraag
      verstrekt aan de leerling. De gemeenteraad stelt daartoe een nadere regeling vast, met inachtneming van het
      bepaalde in de volgende leden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel4
  - number: '4.2'
    text: De regeling maakt geen onderscheid tussen openbaar en bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel4
  - number: '4.3'
    text: |-
      De regeling eerbiedigt de op godsdienst of levensbeschouwing van de ouders, voogden of verzorgers, dan wel, indien
      de leerling meerderjarig en handelingsbekwaam is, van de leerling berustende keuze van een school.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel4
  - number: '4.4'
    text: |-
      De regeling houdt rekening met de van ouders redelijkerwijs te vergen inzet en voorziet erin dat het vervoer kan
      plaatsvinden op een wijze die voor de leerling passend is. De regeling bepaalt op welke wijze burgemeester en
      wethouders terzake advies van deskundigen inwinnen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel4
  - number: '4.5'
    text: |-
      De regeling bepaalt dat de kosten worden vergoed van vervoer over de afstand tussen de woning van de leerling en
      de dichtstbijzijnde voor de leerling toegankelijke school, met inachtneming van de keuze van de ouders, voogden
      of verzorgers, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, van de leerling, tenzij vervoer
      met betrekking tot een verder weg gelegen school voor de gemeente minder kosten met zich zou brengen en de ouders,
      voogden of verzorgers onderscheidenlijk de leerling met het vervoer naar die school instemmen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel4
  - number: '4.6'
    text: |-
      De regeling kan bepalen dat de gemeente, in plaats van vergoeding in geld te geven, het vervoer verzorgt of doet
      verzorgen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel4
  - number: '4.7'
    text: |-
      De regeling kan bepalen dat burgemeester en wethouders in bijzondere gevallen de bevoegdheid hebben ten gunste van
      de ouders, voogden of verzorgers, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, ten gunste van
      de leerling van de inhoud van de regeling af te wijken.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel4
  - number: '5'
    text: 'Het voortgezet onderwijs wordt onderscheiden in:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel5
  - number: 5.a
    text: voorbereidend wetenschappelijk onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel5
  - number: 5.b
    text: hoger en middelbaar algemeen voortgezet onderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel5
  - number: 5.c
    text: voorbereidend beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel5
  - number: 5.d
    text: praktijkonderwijs;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel5
  - number: 5.e
    text: andere vormen van voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel5
  - number: '6'
    text: |-
      De bepalingen van de hoofdstukken I en II van deze afdeling regelen het openbaar schoolonderwijs; de bepalingen van
      de hoofdstukken I en III zijn voorwaarden voor bekostiging van het bijzonder schoolonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6
  - number: 6a
    text: |-
      Het onderwijs wordt gegeven en de examens worden afgenomen in het Nederlands. In afwijking van de eerste volzin kan
      een andere taal worden gebezigd:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6a
  - number: 6a.a
    text: wanneer het onderwijs met betrekking tot die taal betreft, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6a
  - number: 6a.b
    text: |-
      indien de specifieke aard, de inrichting of de kwaliteit van het onderwijs dan wel de herkomst van de leerlingen
      daartoe noodzaakt, overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6a
  - number: 6b
    text: |-
      Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6b
  - number: 6c
    text: |-
      Het onderwijs wordt zodanig ingericht dat daarbij op structurele en herkenbare wijze aandacht wordt besteed aan het
      bestrijden van achterstanden in het bijzonder in de beheersing van de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6c
  - number: 6d
    text: |-
      Onderwijs in lichamelijke opvoeding, bestaande uit praktische bewegingsactiviteiten, wordt gespreid verzorgd
      over alle leerjaren van het voortgezet onderwijs. Dit onderwijs vindt plaats gespreid over de schoolweken, en in
      zodanige substantiële omvang en schooltijd dat wordt voldaan aan de eisen op het gebied van kwaliteit, intensiteit
      en variëteit van de bewegingsactiviteiten neergelegd in kerndoelen en examenprogramma’s. Daarbij wordt uitgegaan
      van de situatie zoals die op 1 augustus 2005 voor het bewegingsonderwijs gold. In afwijking van de tweede volzin
      geldt voor het laatste leerjaar het voorschrift, dat het onderwijs in het eindexamenvak lichamelijke opvoeding niet
      eerder mag worden afgesloten dan in de maand december.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6d
  - number: 6e.1
    text: Het bevoegd gezag stelt elk leerjaar om niet aan een leerling lesmateriaal ter beschikking.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6e
  - number: 6e.2
    text: |-
      Onder lesmateriaal wordt verstaan: lesmateriaal dat naar vorm en inhoud is gericht op informatieoverdracht in
      onderwijsleersituaties en waarvan het gebruik binnen het onderwijsaanbod door het bevoegd gezag specifiek voor het
      desbetreffende leerjaar is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6e
  - number: 6f.1
    text: Een onderwijsprogramma in het voortgezet onderwijs kan mede een maatschappelijke stage omvatten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6f
  - number: 6f.2
    text: |-
      Indien het onderwijsprogramma van een school tevens een maatschappelijke stage omvat, sluit het bevoegd gezag voor
      deze stage met de leerling en de stagebieder tezamen een schriftelijke stageovereenkomst.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6f
  - number: 6f.3
    text: |-
      Voor vermelding op de cijferlijst bij het diploma, bedoeld in [artikel 29, derde lid][ref1], of op het
      schooldiploma praktijkonderwijs, bedoeld in [artikel 29a][ref2], omvat de maatschappelijke stage tenminste 30 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel29a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '29'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 29a
        hoofdstuk: I
        paragraaf: '2'
        afdeling: I
  - number: 6g.1
    text: |-
      Voorbereidend wetenschappelijk onderwijs aan scholen als bedoeld in [artikel 7][ref1], omvat ten minste 5.700
      klokuren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 6g.2
    text: 'Hoger algemeen voortgezet onderwijs:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6g
  - number: 6g.2.a
    text: |-
      aan scholen als bedoeld in [artikel 8, onderdeel a][ref1], omvat ten minste 4.700 klokuren;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 6g.2.b
    text: |-
      aan afdelingen als bedoeld in [artikel 8, onderdeel b][ref1], omvat ten minste 1.700 klokuren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel8
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '8'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 6g.3
    text: |-
      Middelbaar algemeen voortgezet onderwijs aan scholen als bedoeld in [artikel 9][ref1], omvat ten minste 3.700
      klokuren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel9
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '9'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 6g.4
    text: |-
      Voorbereidend beroepsonderwijs aan scholen als bedoeld in [artikel 10a][ref1], omvat ten minste 3.700 klokuren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 6g.5
    text: |-
      Het bevoegd gezag vult de uren in met activiteiten die worden verzorgd in een onderwijsprogramma als
      bedoeld in de [artikelen 10, tweede lid][ref1], [10b, tweede lid][ref2], [10d, tweede lid][ref3],
      [11c, eerste lid][ref4], [11f][ref5] en [12, vijfde lid, tweede volzin][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel11c
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel11f
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel12
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel6g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
