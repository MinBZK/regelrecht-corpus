      [Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118g
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0003549
  - number: 118g.2
    text: |-
      Voor zover nodig in afwijking van het eerste lid wordt onder een voortijdige schoolverlater niet verstaan degene
      die in het bezit is van een getuigschrift van het praktijkonderwijs als bedoeld in [artikel 10f][ref1], een
      getuigschrift van het arbeidsmarktgerichte uitstroomprofiel of het uitstroomprofiel dagbesteding als bedoeld in
      [artikel 14d][ref2] respectievelijk [artikel 14g van de Wet op de expertisecentra][ref3] dan wel een diploma van
      een opleiding als bedoeld in [artikel 7.2.2, eerste lid onderdeel a, van de Wet educatie en beroepsonderwijs][ref4]
      en werkzaam is op grond van een arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14d
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel14g
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118g
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10f
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 14d
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 14g
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 118h.1
    text: |-
      Burgemeester en wethouders dragen zorg voor registratie van de gegevens die het
      bevoegd gezag ingevolge [artikel 28][ref1] heeft gemeld of waarover zij op grond van
      [artikel 21, eerste en derde lid, van de Wet register onderwijsdeelnemers][ref2] beschikken. Burgemeester en
      wethouders dragen bovendien zorg voor een systeem van doorverwijzing naar onderwijs of arbeidsmarkt van de in
      [artikel 118g][ref3] bedoelde voortijdige schoolverlaters en voor het onderhoud van dit systeem. Het systeem
      heeft mede betrekking op de gegevens waarover de gemeente beschikt in het kader van de uitvoering van de
      [Leerplichtwet 1969][ref4]. Burgemeester en wethouders volgen de deelname aan onderwijs en arbeidsmarkt van de
      personen, bedoeld in [artikel 118g, tweede lid][ref5], die de leeftijd van 23 jaren nog niet hebben bereikt. Voor
      de uitvoering van de eerste, tweede en vierde volzin kunnen bij ministeriële regeling nadere voorschriften worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0042012#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel118g
      [ref4]: https://wetten.overheid.nl/BWBR0002628
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel118g
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel118h
    references:
      - id: ref1
