  - number: '34.1'
    text: |-
      Tot rector, directeur, conrector of adjunct-directeur kan slechts worden benoemd of tewerkgesteld zonder benoeming
      degene die:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel34
  - number: 34.1.a
    text: |-
      in het bezit is van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1], en


