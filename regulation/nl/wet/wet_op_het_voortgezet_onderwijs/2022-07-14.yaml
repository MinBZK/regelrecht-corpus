  - number: 64a.3
    text: |-
      Van het aantal leerlingen voor de nieuwe nevenvestiging, en van de leerlingen van 1 van de al bestaande vestigingen
      van de school of scholengemeenschap is ten minste een bij ministeriële regeling vast te stellen percentage
      afkomstig uit dezelfde postcodegebieden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64a
  - number: '65.1'
    text: |-
      Onze Minister brengt een nieuw te vormen profiel als bedoeld in [artikel 10b, derde lid][ref1], aan een al
      bekostigde school voor vbo voor bekostiging in aanmerking indien het bevoegd gezag:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 65.1.a
    text: 'met de belangstellingsmeting aannemelijk maakt dat dit profiel zal worden bezocht door ten minste:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel65
  - number: 65.1.a.1
    text: 160 leerlingen indien de school geen deel uitmaakt van een scholengemeenschap; of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel65
  - number: 65.1.a.2
    text: 120 leerlingen indien de school deel uitmaakt van een scholengemeenschap; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel65
  - number: 65.1.b
    text: |-
      voldoet aan de verplichtingen, bedoeld in [artikel 67, eerste en tweede lid][ref1] en
      [artikel 67a, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel67a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '67'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 67a
        paragraaf: '1'
        afdeling: I
  - number: '65.2'
    text: |-
      Onze Minister brengt een nieuw te vormen school die wordt toegevoegd aan een al bekostigde school of
      scholengemeenschap voor bekostiging in aanmerking indien het bevoegd gezag:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel65
  - number: 65.2.a
    text: |-
      met de belangstellingsmeting aannemelijk maakt dat deze nieuwe school zal worden bezocht door ten minste drie kwart
      van het daarvoor in [artikel 64, eerste lid, onderdeel a][ref1], genoemde aantal leerlingen; en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel64
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '64'
        paragraaf: '1'
        afdeling: I
  - number: 65.2.b
    text: |-
      voldoet aan de verplichtingen, bedoeld in [artikel 67, eerste en tweede lid][ref1] en
      [artikel 67a, eerste en tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel67a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '67'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 67a
        paragraaf: '1'
        afdeling: I
  - number: '65.3'
    text: |-
      De [artikelen 68][ref1] en [69][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel69
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '68'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '69'
        paragraaf: '1'
        afdeling: I
  - number: '66.1'
    text: |-
      Gedeputeerde staten dragen er zorg voor dat is voorzien in de behoefte aan openbaar onderwijs door een voldoende
      aantal scholen in de provincie. Zij kunnen het college van burgemeester en wethouders van de gemeente opdragen, een
      aanvraag bij Onze Minister in te dienen om een openbare school of scholengemeenschap voor bekostiging in aanmerking
      te brengen indien de ouders, voogden of verzorgers van een naar hun oordeel voldoende groot aantal leerlingen
      hebben aangegeven dat zij dat wensen en het college van burgemeester en wethouders van de gemeente deze wens niet
      heeft ingewilligd.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel66
  - number: '66.2'
    text: |-
      Onze Minister kan het college van burgemeester en wethouders van de gemeente opdragen een aanvraag bij hem in te
      dienen om een openbare school of scholengemeenschap voor bekostiging in aanmerking te brengen, indien gedeputeerde
      staten het eerste lid niet toepassen en de ouders, voogden of verzorgers van een naar zijn oordeel voldoende groot
      aantal leerlingen hebben aangegeven dat zij indiening van een dergelijke aanvraag wensen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel66
  - number: '66.3'
    text: |-
      Indien een besluit van Onze Minister op een aanvraag als bedoeld in dit artikel onherroepelijk is geworden,
      gaat het college van burgemeester en wethouders van de gemeente over tot stichting van de bij het besluit voor
      bekostiging in aanmerking gebrachte school of scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel66
  - number: '67.1'
    text: |-
      Het bevoegd gezag dient voor 1 november bij Onze Minister een aanvraag in om voor bekostiging in aanmerking te
      brengen:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
  - number: 67.1.a
    text: een school;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
  - number: 67.1.b
    text: een scholengemeenschap;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
  - number: 67.1.c
    text: |-
      een nevenvestiging van een school of scholengemeenschap als bedoeld in [artikel 73, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel73
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '73'
        paragraaf: '2'
        afdeling: I
  - number: 67.1.d
    text: een school of scholengemeenschap die zal ontstaan na splitsing van een school of scholengemeenschap; of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
  - number: 67.1.e
    text: |-
      een nieuw te vormen profiel als bedoeld in [artikel 10b, derde lid][ref1], aan een al bekostigde school voor vbo.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: '67.2'
    text: |-
      Indien het bevoegd gezag het voornemen heeft om een aanvraag, bedoeld in het eerste lid, in te dienen, meldt het
      bevoegd gezag dit aan Onze Minister voor 1 juli voorafgaand aan die voorgenomen aanvraag. Bij ministeriële regeling
      kunnen nadere regels worden gesteld aan de wijze waarop deze melding plaatsvindt en kan een model voor de melding
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
  - number: '67.3'
    text: |-
      De inspectie adviseert Onze Minister of de aanvraag, bedoeld in het eerste lid, voldoet aan de verplichtingen,
      bedoeld in [artikel 67a, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel67a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 67a
        paragraaf: '1'
        afdeling: I
  - number: '67.4'
    text: 'Onze Minister controleert of de belangstellingsmeting juist en volledig is en besluit voor 1 juni:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
  - number: 67.4.a
    text: |-
      met inachtneming van [artikel 64][ref1], op de aanvraag als bedoeld in het eerste lid, of de school,
      scholengemeenschap of school of scholengemeenschap na splitsing met ingang van 1 augustus van het kalenderjaar
      volgend op het besluit van Onze Minister voor bekostiging in aanmerking wordt gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel64
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '64'
        paragraaf: '1'
        afdeling: I
  - number: 67.4.b
    text: |-
      met inachtneming van [artikel 64a][ref1], op de aanvraag als bedoeld in het eerste lid, of de nevenvestiging met
      ingang van 1 augustus van het kalenderjaar volgend op het besluit van Onze Minister voor bekostiging in aanmerking
      wordt gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel64a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 64a
        paragraaf: '1'
        afdeling: I
  - number: 67.4.c
    text: |-
      met inachtneming van [artikel 65][ref1], op de aanvraag als bedoeld in het eerste lid, of het nieuw te vormen
      profiel met ingang van 1 augustus van het kalenderjaar volgend op het besluit van Onze Minister voor bekostiging in
      aanmerking wordt gebracht; of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel65
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '65'
        paragraaf: '1'
        afdeling: I
  - number: 67.4.d
    text: |-
      met inachtneming van [artikel 64, vierde lid][ref1], op een aanvraag als bedoeld in
      [artikel 66, eerste lid of tweede lid][ref2], of de openbare school of scholengemeenschap met ingang van 1 augustus
      van het kalenderjaar volgend op het besluit van Onze Minister voor bekostiging in aanmerking wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel66
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '64'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '66'
        paragraaf: '1'
        afdeling: I
  - number: '67.5'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] kan Onze Minister de aanvraag, bedoeld in het
      eerste lid, afwijzen indien deze is ingediend door een rechtspersoon, niet zijnde een gemeente, die voorafgaande
      aan de aanvraag een of meer scholen in stand heeft gehouden waarop [artikel 109a, eerste lid][ref2], van toepassing
      is geweest of waarvan een of meer van de bestuurders of toezichthouders deel uitmaakte of uitmaakt van een andere
      rechtspersoon die een dergelijke school in stand heeft gehouden, welke toepassing onherroepelijk is geworden en
      ten tijde van de aanvraag nog geen vijf jaren oud is gerekend vanaf de ontvangst van het besluit tot toepassing van
      artikel 109a, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel109a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 109a
        afdeling: III
  - number: '67.6'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] kan Onze Minister de aanvraag, bedoeld
      in het eerste lid, afwijzen indien de aanvraag is ingediend door een rechtspersoon, niet zijnde een
      gemeente, die reeds een of meer scholen in stand houdt en die een aanwijzing heeft ontvangen als bedoeld in
      [artikel 103g, eerste lid][ref2], of waarvan een of meer van de bestuurders of toezichthouders deel uitmaakte of
      uitmaakt van een andere rechtspersoon die een dergelijke aanwijzing heeft ontvangen welke aanwijzing onherroepelijk
      is geworden en ten tijde van de aanvraag nog geen vijf jaren oud is gerekend vanaf de ontvangst van het besluit tot
      toepassing van artikel 103g, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel103g
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 103g
        hoofdstuk: IV
        afdeling: II
  - number: '67.7'
    text: |-
      Onverminderd [artikel 3:41 van de Algemene wet bestuursrecht][ref1] wordt van de besluiten, bedoeld in het vierde,
      vijfde en zesde lid, mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '67.8'
    text: |-
      Voor uitsluitend de controle of de gegevens uit de ouderverklaringen, bedoeld in [artikel 68, vierde lid][ref1],
      juist en volledig zijn, maakt Onze Minister gebruik van het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref2], van een van de ouders en de
      leerling waarop de ouderverklaring betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '68'
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '1'
  - number: '67.9'
    text: |-
      Onze Minister stelt op voordracht van de inspectie een kader vast waarin de werkwijze voor het advies, bedoeld
      in het derde lid, is vastgelegd. Deze werkwijze omvat in ieder geval een gesprek over de aanvraag met het bevoegd
      gezag dat de aanvraag heeft ingediend. Dit kader wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
  - number: '67.10'
    text: |-
      Burgemeester en wethouders van de beoogde plaats van vestiging van de school, scholengemeenschap of nevenvestiging
      kunnen voor de datum, genoemd in het eerste lid, bij Onze Minister een zienswijze naar voren brengen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67
  - number: 67a.1
    text: |-
      Een aanvraag als bedoeld in [artikel 67, eerste lid][ref1], vermeldt:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel67
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '67'
        paragraaf: '1'
        afdeling: I
  - number: 67a.1.a
    text: de schoolsoort of schoolsoorten;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
  - number: 67a.1.b
    text: of het openbaar of bijzonder onderwijs betreft; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
  - number: 67a.1.c
    text: |-
      de beoogde plaats van vestiging van de school, scholen, scholengemeenschap, scholengemeenschappen of
      nevenvestiging.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
  - number: 67a.2
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
  - number: 67a.2.a
    text: een belangstellingsmeting;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel67a
  - number: 67a.2.b
    text: |-
