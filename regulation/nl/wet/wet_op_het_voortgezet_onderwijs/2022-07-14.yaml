        artikel: '107'
        afdeling: III
  - number: '108.6'
    text: |-
      Binnen acht weken na de bekendmaking door het Centraal Bureau voor de Statistiek dan wel door Onze Minister van
      de aantallen leerlingen per school voor voortgezet onderwijs, stellen gedeputeerde staten vast welke gemeentelijke
      scholen uit hun provincie gedurende reeds een jaar niet meer voldoen aan de voor hen geldende norm, genoemd in
      [artikel 107][ref1]. Wanneer er als gevolg van de opheffing van een school als bedoeld in de vorige volzin, naar
      hun oordeel niet meer voldoende zal zijn voorzien in de behoefte aan openbaar onderwijs in een genoegzaam aantal
      scholen, dragen gedeputeerde staten burgemeester en wethouders op een aanvraag te doen op grond van het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel107
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
  - number: '109.1'
    text: |-
      Bij het verstrijken van de looptijd van een regionaal plan onderwijsvoorzieningen als bedoeld in
      [artikel 74a][ref1] gaat de aanspraak op bekostiging verloren voor zover het betreft een profiel als bedoeld in
      [artikel 74b, eerste lid, onderdeel e of f][ref2], al dan niet met gebruikmaking van artikel 74b, tweede lid,
      met dien verstande dat de bekostiging nog een jaar wordt gehandhaafd voor zover het betreft het onderwijs aan
      leerlingen in het derde leerjaar en nog twee jaar voor zover het betreft het onderwijs aan leerlingen in het vierde
      leerjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel74a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel74b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 74a
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 74b
        paragraaf: '3'
        afdeling: I
  - number: '109.2'
    text: |-
      Het eerste lid is niet van toepassing indien het desbetreffende profiel op grond van een aansluitend regionaal plan
      onderwijsvoorzieningen als bedoeld in [artikel 74a][ref1] of op grond van [artikel 65][ref2] voor bekostiging in
      aanmerking is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel74a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel65
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel109
