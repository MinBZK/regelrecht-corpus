        artikel: 118k
  - number: 33.1.c
    text: niet krachtens rechterlijke uitspraak van het geven van onderwijs te zijn uitgesloten.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
  - number: 33.1a
    text: |-
      Indien het bevoegd gezag een leraar benoemt of tewerkstelt zonder benoeming voor uitsluitend het geven
      van middelbaar algemeen voortgezet onderwijs of het geven van onderwijs in de eerste drie leerjaren
      van het hoger algemeen voortgezet onderwijs of van het voorbereidend wetenschappelijk onderwijs, is
      het eerste lid, onderdeel b, onder 3°, niet van toepassing en volstaat in afwijking van het eerste
      lid, onderdeel b, onder 1°, het bezit van het getuigschrift van een bacheloropleiding als bedoeld in
      [artikel 7.3a, eerste lid, onderdeel a, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1],
      waaruit blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
    references:
