  - number: 33.1c
    text: 'Bij ministeriële regeling wordt:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
  - number: 33.1c.a
    text: |-
      bepaald op grond van het getuigschrift van welke bacheloropleidingen als bedoeld in lid 1a onderwijs verzorgd kan
      worden in daarbij aan te wijzen vakken;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
  - number: 33.1c.b
    text: |-
      ten aanzien van algemeen gebruikelijke vakken of programmaonderdelen, waarvoor op grond van een getuigschrift als
      bedoeld in het eerste lid, onderdeel b, onder 1°, niet rechtstreeks kan of kon worden vastgesteld dat wordt voldaan
      aan de voor die vakken of programmaonderdelen geldende bekwaamheidseisen, een overzicht gegeven van getuigschriften
      waarmee wordt voldaan aan de bekwaamheidseisen die gelden voor het geven van voortgezet onderwijs in die vakken of
      programmaonderdelen. In het overzicht kunnen eisen worden opgenomen omtrent bij- of nascholing.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
  - number: '33.2'
    text: |-
      In bijzondere gevallen kan Onze Minister besluiten aan personen, die in een bepaald vak of onderdeel van een vak
      door buitengewone bekwaamheid uitmunten, ten aanzien van dit vak of dit onderdeel ontheffing te verlenen van de in
      het eerste lid onder b gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
  - number: '33.3'
    text: |-
      Bij tijdelijke afwezigheid van een leraar kan ten aanzien van degene die hem vervangt voor ten hoogste twaalf
      maanden worden afgeweken van de eisen, gesteld in het eerste lid, onderdeel b, met dien verstande dat de periode
      van twaalf maanden is verstreken vanaf de dag dat perioden van vervanging als bedoeld in dit lid elkaar met
      tussenpozen van niet meer dan drie maanden hebben opgevolgd en een periode van twaalf maanden, deze tussenpozen
      inbegrepen, is overschreden. Indien in een vacature niet terstond kan worden voorzien door de benoeming of
      tewerkstelling zonder benoeming van een leraar die aan de genoemde eisen voldoet, is het bepaalde in de vorige
      volzin van overeenkomstige toepassing. Deze termijn van een jaar kan met ten hoogste twee jaren worden verlengd
      indien het bevoegd gezag en de betrokkene schriftelijk verklaren dat betrokkene verplicht is zich in te spannen
      binnen twee jaren alsnog te voldoen aan de eisen gesteld in het eerste lid, onderdeel b. Het bevoegd gezag kan
      onder de voorwaarden, genoemd in de vorige volzin, een verlenging van nog eens twee jaren geven indien het dat
      noodzakelijk oordeelt vanwege de kwaliteit en de voortgang van het onderwijs op de school.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
  - number: '33.4'
    text: |-
      Degene die benoembaar of tewerkstelbaar zonder benoeming is voor enig vak, mag, onverminderd het vijfde lid,
      door het bevoegd gezag gedurende ten hoogste twee jaren worden belast met werkzaamheden als leraar waarvoor hij
      niet voldoet aan de in [artikel 36, eerste lid][ref1], bedoelde bekwaamheidseisen. Aan de eerste volzin wordt
      uitsluitend toepassing gegeven indien het bevoegd gezag en betrokkene in ieder geval schriftelijk hebben verklaard
      dat betrokkene verplicht is zich in te spannen om binnen twee jaren alsnog te voldoen aan de bekwaamheidseisen voor
      die werkzaamheden. Het bevoegd gezag kan de in de eerste volzin bedoelde termijn verlengen met ten hoogste twee
      jaren indien het bevoegd gezag dat noodzakelijk oordeelt vanwege de kwaliteit en de voortgang van het onderwijs
      aan de school. De tweede volzin is in dat geval van overeenkomstige toepassing. De inspectie kan op aanvraag van
      het bevoegd gezag besluiten toe te staan dat in de eerste twee leerjaren wordt afgeweken van de eis, bedoeld in de
      tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel36
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel33
    references:
