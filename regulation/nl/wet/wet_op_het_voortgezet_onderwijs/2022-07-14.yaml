        bwb_id: BWBR0002399
        artikel: '107'
        afdeling: III
  - number: 118ff.1
    text: |-
      Op aanvragen die voor 1 november 2020 zijn ingediend op grond van de [artikelen 67, eerste lid][ref1], en
      [74b, eerste lid, onderdelen b en c][ref2], blijft [Titel III][ref3], zoals die titel luidde op 31 oktober 2020
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel74b
