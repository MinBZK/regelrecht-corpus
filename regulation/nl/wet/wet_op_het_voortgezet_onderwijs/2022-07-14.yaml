  - number: 24a.1.f
    text: |-
      de wijze waarop het bevoegd gezag omgaat met de in [artikel 24, eerste lid][ref1], omschreven bijdragen,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 24a.1.g
    text: het beleid met betrekking tot de veiligheid,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
  - number: 24a.1.h
    text: het verzuimbeleid,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
  - number: 24a.1.i
    text: |-
      de wijze waarop de identiteitscommissie, bedoeld in [artikel 53d][ref1], invulling geeft aan het openbare karakter
      onderscheidenlijk de identiteit voor zover het betreft een samenwerkingsschool,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53d
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53d
        hoofdstuk: IV
        afdeling: I
  - number: 24a.1.ia
    text: |-
      het leerlingenparticipatiebeleid, waaronder wordt begrepen de wijze waarop leerlingen worden betrokken bij
      de vorming van het beleid van de school, alsmede de wijze waarop deze betrokkenheid wordt gefaciliteerd en
      gestimuleerd,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
  - number: 24a.1.j
    text: |-
      het samenwerkingsverband en in voorkomend geval de samenwerkingsverbanden waarbij het bevoegd gezag van de school
      is aangesloten,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
  - number: 24a.1.k
    text: |-
      de persoon bij wie de taken, bedoeld in [artikel 3b, eerste lid, onderdeel c][ref1], zijn belegd, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel3b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 3b
  - number: 24a.1.l
    text: |-
      de in het kader van het stelsel van kwaliteitszorg, bedoeld in [artikel 24, vierde lid][ref1], gedane bevindingen
      en de maatregelen die naar aanleiding daarvan zijn getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel24
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 24a.2
    text: Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven met betrekking tot de wijze waarop
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
  - number: 24a.2.a
    text: de resultaten worden beschreven die met het onderwijs worden bereikt, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
  - number: 24a.2.b
    text: de context wordt vermeld waarin de onder a bedoelde resultaten dienen te worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a
  - number: 24a1.1
    text: |-
      Het bevoegd gezag stelt ten minste eenmaal in de vier jaar het schoolplan vast en stelt dit zo spoedig mogelijk na
      de vaststelling beschikbaar voor de inspectie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a1
  - number: 24a1.2
    text: |-
      Het bevoegd gezag stelt jaarlijks de schoolgids vast ten behoeve van het eerstvolgende schooljaar en stelt deze
      zo spoedig mogelijk na de vaststelling beschikbaar voor de ouders, voogden, verzorgers dan wel de meerderjarige en
      handelingsbekwame leerling, en de inspectie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24a1
  - number: 24b.1
    text: |-
      Ouders, voogden, verzorgers dan wel leerlingen, en personeelsleden kunnen bij de klachtencommissie, bedoeld in
      het tweede lid, onderdeel a, een klacht indienen over gedragingen en beslissingen van het bevoegd gezag of het
      personeel, waaronder discriminatie, dan wel het nalaten van gedragingen en het niet nemen van beslissingen door het
      bevoegd gezag of het personeel.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24b.2
    text: 'Het bevoegd gezag treft een regeling voor de behandeling van klachten. Deze regeling vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24b.2.a
    text: de instelling van een klachtencommissie, die klachten behandelt,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24b.2.b
    text: de wijze waarop de klachtencommissie haar werkzaamheden verricht,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24b.2.c
    text: de termijn waarbinnen de klager een klacht kan indienen en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24b.2.d
    text: |-
      de termijn waarbinnen mededeling plaatsvindt van het oordeel, bedoeld in het zesde lid, en hoe bij noodzakelijke
      afwijking van deze termijn wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24b.3
    text: |-
      Deze regeling strekt ter vervanging van klachtenregelingen op grond van andere voorschriften dan dit artikel en
      strekt niet ter vervanging van een andere voorziening die op grond van een wettelijke regeling, niet zijnde een
      klachtenregeling, voor de klager openstaat of heeft opengestaan.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24b.4
    text: Deze regeling
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24b.4.a
    text: |-
      voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit ten minste drie leden,
      waaronder een voorzitter die geen deel uitmaakt van het bevoegd gezag en niet werkzaam is voor of bij het bevoegd
      gezag, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24b.4.b
    text: |-
      waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24b.5
    text: 'De klager en degene over wie is geklaagd krijgen de gelegenheid:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24b.5.a
    text: hun zienswijze mondeling of schriftelijk toe te lichten en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24b.5.b
    text: zich bij de behandeling van de klacht te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24b.6
    text: |-
      De klachtencommissie vormt zich een oordeel over de gegrondheid van de klacht en deelt dit oordeel, al dan niet
      vergezeld van aanbevelingen, schriftelijk mede aan de klager, degene over wie is geklaagd en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24b.7
    text: |-
      Het bevoegd gezag deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onderdeel a, binnen 4 weken
      na ontvangst van het in het zesde lid bedoelde oordeel van de klachtencommissie schriftelijk mede of hij het
      oordeel over de gegrondheid van de klacht deelt en of hij naar aanleiding van dat oordeel maatregelen zal nemen en
      zo ja welke. Bij afwijking van de in de eerste volzin bedoelde termijn, doet het bevoegd gezag daarvan met redenen
      omkleed mededeling aan de klager en de klachtencommissie onder vermelding van de termijn waarbinnen het bevoegd
      gezag zijn standpunt bekend zal maken.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24b.8
    text: |-
      Degene die betrokken is bij de uitvoering van dit artikel en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, is verplicht tot geheimhouding daarvan,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24b.9
    text: |-
      Gegevens die betrekking hebben op een klacht worden bewaard op een plaats die uitsluitend toegankelijk is voor de
      leden van de klachtencommissie en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24b
  - number: 24d.1
    text: |-
      Het bevoegd gezag draagt mede in verband met de verplichting, bedoeld in [artikel 23a][ref1], zorg voor een goed
      bestuurde school met een scheiding tussen de functies van bestuur en het toezicht daarop, en met een rechtmatig
      bestuur en beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24d
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 24d.2
    text: |-
      De benoeming in de functies van het bestuur en het interne toezicht op het bestuur, bedoeld in het eerste lid,
      geschiedt op basis van vooraf openbaar gemaakte profielen. Bij de benoeming van de leden van de raad van toezicht
      wordt de medezeggenschapsraad van de school, bedoeld in [artikel 3 van de Wet medezeggenschap op scholen][ref1],
      in de gelegenheid gesteld een bindende voordracht te doen voor een lid. Bij de benoeming van de leden
      van de raad van toezicht van het samenwerkingsverband wordt de ondersteuningsplanraad, bedoeld in
      [artikel 4a van de Wet medezeggenschap op scholen][ref2], in de gelegenheid gesteld een bindende voordracht te doen
      voor een lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24d
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: 4a
  - number: 24d.3
    text: Het eerste lid en het tweede lid, eerste volzin, zijn van overeenkomstige toepassing op een samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24d
  - number: 24e.1
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de functies van bestuur en intern toezicht op het bestuur in functionele
      of organieke zin zijn gescheiden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24e
  - number: 24e.2
    text: |-
      Een intern toezichthouder of een lid van het interne toezichthoudend orgaan functioneert onafhankelijk van het
      bestuur.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24e
  - number: 24e.3
    text: Dit artikel is van overeenkomstige toepassing op een samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24e
  - number: 24e1.1
    text: |-
      De interne toezichthouder of het interne toezichthoudend orgaan houdt toezicht op de uitvoering van de taken en de
      uitoefening van de bevoegdheden door het bestuur en staat het bestuur met raad terzijde. De toezichthouder of het
      toezichthoudend orgaan is ten minste belast met:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24e1
  - number: 24e1.1.a
    text: |-
      het goedkeuren van de begroting en het jaarverslag en, indien van toepassing, het strategisch meerjarenplan van
      de school;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24e1
  - number: 24e1.1.b
    text: |-
      het toezien op de naleving door het bestuur van wettelijke verplichtingen, de code voor goed bestuur, bedoeld in
      [artikel 103, eerste lid, onderdeel a][ref1], en de afwijkingen van die code;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24e1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '103'
        hoofdstuk: IV
        afdeling: II
  - number: 24e1.1.c
    text: |-
      het toezien op de rechtmatige verwerving en de doelmatige en rechtmatige bestemming en aanwending van de middelen
      van de school verkregen op grond van deze wet;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24e1
  - number: 24e1.1.d
    text: |-
      het aanwijzen van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] die verslag uitbrengt aan de toezichthouder
      of het toezichthoudend orgaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24e1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 24e1.1.e
    text: |-
      het jaarlijks afleggen van verantwoording over de uitvoering van de taken en de uitoefening van de bevoegdheden,
      bedoeld onder a tot en met d, in het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24e1
  - number: 24e1.2
    text: |-
      De taken en bevoegdheden van de interne toezichthouder of het interne toezichthoudend orgaan zijn zodanig dat hij
      een deugdelijk en onafhankelijk intern toezicht kan uitoefenen. Indien sprake is van meer dan een toezichthouder of
      van een toezichthoudend orgaan is de eerste volzin van overeenkomstige toepassing met betrekking tot de combinatie
      van de toezichthouders of de samenstelling van het toezichthoudend orgaan.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24e1
  - number: 24e1.3
    text: |-
      De interne toezichthouder of het interne toezichthoudend orgaan pleegt ten minste tweemaal per jaar overleg met
      de medezeggenschapsraad.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24e1
  - number: 24e1.4
    text: |-
      Indien het intern toezicht wordt uitgeoefend door een raad van toezicht, zijn het eerste lid en het tweede lid van
      overeenkomstige toepassing ten aanzien van de raad van toezicht. Een raad van toezicht is tevens belast met het
      benoemen, schorsen en ontslaan van de leden van het bestuur, alsmede de toepassing van [38a tot en met 39a1][ref1],
      [40a][ref2] en de daarmee verband houdende wettelijke bepalingen op leden van het bestuur die mede tot het
      personeel behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel40a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24e1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '39'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 40a
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 24e1.5
    text: |-
      Dit artikel is, met uitzondering van het derde lid, van overeenkomstige toepassing op een
      samenwerkingsverband. De interne toezichthouder of het interne toezichthoudend orgaan van het
      samenwerkingsverband pleegt ten minste tweemaal per jaar overleg met de ondersteuningsplanraad, bedoeld in
      [artikel 4a van de Wet medezeggenschap op scholen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24e1
    references:
      - id: ref1
        bwb_id: BWBR0020685
        artikel: 4a
  - number: 24g.1
    text: |-
      Het bevoegd gezag van een school legt elke twee jaar in een reglement, leerlingenstatuut genaamd, de rechten en
      plichten van de leerlingen vast.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24g
  - number: 24g.2
    text: |-
      In het leerlingenstatuut worden in elk geval voorschriften opgenomen, strekkende tot handhaving van de goede gang
      van zaken binnen de instelling en, de wijze waarop uitvoering wordt gegeven aan de bescherming van gegevens uit de
      persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24g
  - number: 24g.3
    text: Het bevoegd gezag stelt de actuele versie van het leerlingenstatuut voor de leerlingen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel24g
  - number: '25'
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs aan een school kan Onze Minister besluiten toe te staan
      dat van de [artikelen 6d][ref1], [6g][ref2], [6g1][ref3], [7 tot en met 11f][ref4], [12 tot en met 15][ref5], en
      van de voorschriften, bedoeld in [artikel 22][ref6], wordt afgeweken. Onze Minister besluit binnen zes maanden na
      ontvangst van een aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6d
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel6g
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel6g1
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0002399#Artikel22
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6d
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 6g
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 6g1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0002399
        artikel: '7'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0002399
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref6
        bwb_id: BWBR0002399
        artikel: '22'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 25a.1
    text: |-
      Het bevoegd gezag kan leerlingen in de gelegenheid stellen in het kader van het onderwijs waarvoor zij aan de
      school zijn ingeschreven:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel25a
  - number: 25a.1.a
    text: |-
      ook onderwijs te ontvangen dat een school van een ander bevoegd gezag of een instelling voor educatie en
      beroepsonderwijs verzorgt, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel25a
  - number: 25a.1.b
    text: |-
      deel te nemen aan een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid onder a, van de Wet educatie en beroepsonderwijs][ref1] en die opleiding met een examen
      af te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 25a.2
    text: 'Het eerste lid vindt uitsluitend toepassing met het doel:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel25a
  - number: 25a.2.a
    text: leerlingen met bijzondere kenmerken beter in staat te stellen een diploma als bedoeld in deze wet te behalen,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel25a
  - number: 25a.2.b
    text: leerlingen meer kansen te geven om vervolgonderwijs met gunstig resultaat te volgen, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel25a
  - number: 25a.2.c
    text: onderwijsvoorzieningen doelmatiger te gebruiken.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel25a
  - number: 25a.3
    text: |-
      Toepassing van het eerste lid berust op een samenwerkingsovereenkomst, gesloten tussen het bevoegd gezag
      van de school en het bevoegd gezag van de in het eerste lid bedoelde andere school of instelling. De
      samenwerkingsovereenkomst omvat in elk geval:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel25a
  - number: 25a.3.a
    text: het doel van de samenwerking,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel25a
  - number: 25a.3.b
    text: de doelgroep,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel25a
  - number: 25a.3.c
    text: de wijze waarop wordt nagegaan of het doel wordt bereikt,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel25a
  - number: 25a.3.d
    text: het onderwijsprogramma dat volgens de samenwerking wordt vormgegeven,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel25a
  - number: 25a.3.e
    text: |-
      in geval van overdracht van een deel van de bekostiging met toepassing van [artikel 99, achtste lid][ref1], de
      omvang en de bestemming van de over te dragen middelen, en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel99
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel25a
    references:
