  - number: '17.1'
    text: |-
      Het onderwijs bevordert actief burgerschap en sociale cohesie op doelgerichte en samenhangende wijze, waarbij het
      onderwijs zich in ieder geval herkenbaar richt op:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17
  - number: 17.1.a
    text: |-
      het bijbrengen van respect voor en kennis van de basiswaarden van de democratische rechtsstaat, zoals verankerd in
      de [Grondwet][ref1], en de universeel geldende fundamentele rechten en vrijheden van de mens, en het handelen naar
      deze basiswaarden op school;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 17.1.b
    text: |-
      het ontwikkelen van de sociale en maatschappelijke competenties die de leerling in staat stellen deel uit te maken
      van en bij te dragen aan de pluriforme, democratische Nederlandse samenleving; en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17
  - number: 17.1.c
    text: |-
      het bijbrengen van kennis over en respect voor verschillen in godsdienst, levensovertuiging, politieke gezindheid,
      afkomst, geslacht, handicap of seksuele gerichtheid alsmede de waarde dat gelijke gevallen gelijk behandeld worden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17
  - number: '17.2'
    text: |-
      Het bevoegd gezag draagt zorg voor een schoolcultuur die in overeenstemming is met de waarden, bedoeld in het
      eerste lid, onderdeel a, creëert een omgeving waarin leerlingen worden gestimuleerd actief te oefenen met de omgang
      met en het handelen naar deze waarden en draagt voorts zorg voor een omgeving waarin leerlingen en personeel zich
      veilig en geaccepteerd weten, ongeacht de in het eerste lid, onder c, genoemde verschillen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17
  - number: 17a.1
    text: |-
      Het bevoegd gezag van één of meer scholen is voor elke vestiging van die school of scholen aangesloten bij een
      samenwerkingsverband als bedoeld in het tweede lid of bij een landelijk samenwerkingsverband als bedoeld in het
      zestiende lid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.2
    text: |-
      Een samenwerkingsverband omvat alle binnen een gebied als bedoeld in het derde lid gelegen vestigingen van
      scholen, scholen voor voortgezet speciaal onderwijs en scholen voor speciaal en voortgezet speciaal onderwijs,
      voor zover daaraan voortgezet speciaal onderwijs wordt verzorgd, behorend tot cluster 3 en 4, bedoeld in de
      [Wet op de expertisecentra][ref1], met uitzondering van de vestigingen waarvoor het bevoegd gezag is aangesloten
      bij een landelijk samenwerkingsverband. Het samenwerkingsverband stelt zich ten doel een samenhangend geheel
      van ondersteuningsvoorzieningen binnen en tussen de scholen, bedoeld in de vorige volzin, te realiseren en wel
      zodanig dat leerlingen een ononderbroken ontwikkelingsproces kunnen doormaken en leerlingen die extra ondersteuning
      behoeven een zo passend mogelijke plaats in het onderwijs krijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 17a.3
    text: Bij ministeriële regeling worden voor de samenwerkingsverbanden aaneengesloten gebieden aangewezen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.3a
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop een samenwerkingsverband
      dat is gelegen aan de landsgrens bij de vervulling van zijn taken kan samenwerken met een school of instelling
      in België of in een van de bondsstaten Noord-Rijnland-Westfalen, Nedersaksen of Bremen van de Bondsrepubliek
      Duitsland.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.4
    text: |-
      De bevoegde gezagsorganen van de scholen, bedoeld in het tweede lid, geven het samenwerkingsverband vorm door
      het oprichten van een rechtspersoon met volledige rechtsbevoegdheid zonder winstoogmerk, waarin uitsluitend deze
      bevoegde gezagsorganen deelnemen, behoudens deelname van een bevoegd gezag op grond van het vijfde lid. De statuten
      van de rechtspersoon bevatten een voorziening voor de beslechting van geschillen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.5
    text: |-
      Indien het bevoegd gezag van een school voor voortgezet speciaal onderwijs of een school voor speciaal en
      voortgezet speciaal onderwijs, behorend tot cluster 3 en 4, bedoeld in de [Wet op de expertisecentra][ref1],
      waarvan de vestiging of vestigingen zijn gelegen buiten het gebied van een samenwerkingsverband, wenst
      deel te nemen aan dit samenwerkingsverband, wordt dit bevoegd gezag niet uitgesloten van deelname aan het
      samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 17a.6
    text: 'Het samenwerkingsverband heeft in elk geval tot taak:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.6.a
    text: het vaststellen van een ondersteuningsplan,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.6.b
    text: |-
      het verdelen en toewijzen van ondersteuningsmiddelen en ondersteuningsvoorzieningen aan de scholen, bedoeld in het
      tweede lid,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.6.c
    text: |-
      het beoordelen of leerlingen aangewezen zijn op het leerwegondersteunend onderwijs, of toelaatbaar zijn tot het
      praktijkonderwijs of het voortgezet speciaal onderwijs, op verzoek van het bevoegd gezag van een school als bedoeld
      in het tweede lid waar de leerling is aangemeld of ingeschreven, en
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.6.d
    text: |-
      het adviseren over de ondersteuningsbehoefte van een leerling op verzoek van het bevoegd gezag van een school als
      bedoeld in het tweede lid waar de leerling is aangemeld of ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.7
    text: |-
      Het samenwerkingsverband stelt ten minste eenmaal in de 4 jaar een ondersteuningsplan vast. Bij het vaststellen
      van het ondersteuningsplan kunnen door het samenwerkingsverband slechts beperkingen worden gesteld aan de door de
      school gewenste invulling van het schoolondersteuningsprofiel, indien dat voor het samenwerkingsverband met het oog
      op de beschikbare ondersteuningsmiddelen en ondersteuningsvoorzieningen een onevenredige belasting zou vormen.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.8
    text: 'Het ondersteuningsplan omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.8.a
    text: |-
      de wijze waarop wordt voldaan aan het tweede lid, tweede volzin, waaronder tevens zijn begrepen de
      basisondersteuningsvoorzieningen die op alle vestigingen van scholen in het samenwerkingsverband aanwezig zijn,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.8.b
    text: |-
      de procedure en criteria voor de verdeling, besteding en toewijzing van ondersteuningsmiddelen en
      ondersteuningsvoorzieningen aan de scholen, bedoeld in het tweede lid, mede bezien in het perspectief van een
      meerjarenbegroting,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.8.c
    text: |-
      de procedure en criteria voor de plaatsing van leerlingen op scholen voor voortgezet speciaal onderwijs en
      speciaal en voortgezet speciaal onderwijs, en de procedure voor het beoordelen of een leerling is aangewezen op het
      leerwegondersteunend onderwijs en het toelaatbaar verklaren van leerlingen tot het praktijkonderwijs, voor zover de
      algemene maatregel van bestuur, bedoeld in het elfde lid, daarin niet voorziet,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.8.d
    text: |-
      de procedure en het beleid met betrekking tot de terugplaatsing of overplaatsing naar het
      voortgezet onderwijs van leerlingen van scholen voor voortgezet speciaal onderwijs en speciaal en
      voortgezet speciaal onderwijs voor wie de periode waarop de toelaatbaarheidsverklaring, bedoeld in
      [artikel 40, twaalfde lid, van de Wet op de expertisecentra][ref1] betrekking heeft, is verstreken,


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
  - number: 17a.8.e
    text: |-
      de beoogde en bereikte kwalitatieve en kwantitatieve resultaten van het onderwijs aan leerlingen die extra
      ondersteuning behoeven en de daarmee samenhangende bekostiging,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.8.f
    text: |-
      de wijze waarop aan de ouders informatie wordt verstrekt over de ondersteuningsvoorzieningen en over de
      onafhankelijke ondersteuningsmogelijkheden voor ouders,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.8.h
    text: |-
      de wijze waarop wordt vastgesteld of sprake is van een meer dan gemiddelde toename van het
      aantal ingeschreven leerlingen met een nieuwe toelaatbaarheidsverklaring als bedoeld in
      [artikel 40, tiende of twaalfde lid, van de Wet op de expertisecentra][ref1], bij de aan het samenwerkingsverband
      deelnemende scholen voor voortgezet speciaal onderwijs en speciaal en voortgezet speciaal onderwijs in de periode
      na 1 februari, en hoe deze scholen hierin tegemoet worden gekomen. Leerlingen als bedoeld in artikel 40, zestiende
      lid, van de Wet op de expertisecentra, blijven buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '40'
  - number: 17a.9
    text: |-
      Het ondersteuningsplan wordt niet vastgesteld voordat over een concept van het plan op overeenstemming
      gericht overleg heeft plaatsgevonden met burgemeester en wethouders van de desbetreffende
      gemeente of gemeenten en overleg heeft plaatsgevonden met het samenwerkingsverband, bedoeld in
      [artikel 18a, tweede lid, van de Wet op het primair onderwijs][ref1], waarvan het gebied geheel of gedeeltelijk
      samenvalt met het gebied van het samenwerkingsverband. Het samenwerkingsverband nodigt het bevoegd gezag van
      een instelling voor beroepsonderwijs met een of meer vestigingen in het gebied van het samenwerkingsverband
      uit voor het overleg met burgemeester en wethouders over het onderdeel van het ondersteuningsplan, bedoeld in
      [artikel 17a, achtste lid, onder a][ref2]. Het overleg met burgemeester en wethouders vindt plaats overeenkomstig
      een procedure, vastgesteld door het samenwerkingsverband en burgemeester en wethouders van die gemeente of
      gemeenten. De procedure bevat een voorziening voor het beslechten van geschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 17a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 17a.10
    text: |-
      Het ondersteuningsplan wordt voor 1 mei voorafgaand aan het eerste schooljaar van de periode waarop het plan
      betrekking heeft, toegezonden aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.10a
    text: |-
      Het samenwerkingsverband kan, met het oog op de doelstelling, bedoeld in het tweede lid, een of meer
      orthopedagogisch-didactische centra inrichten. Bij algemene maatregel van bestuur kunnen regels worden gesteld over
      de voorwaarden waaronder een zodanige voorziening kan worden ingericht.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.11
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven voor de procedure en de criteria voor
      het beoordelen of een leerling is aangewezen op het leerwegondersteunend onderwijs of het toelaatbaar verklaren van
      leerlingen tot het praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.12
    text: |-
      Het samenwerkingsverband draagt er zorg voor dat deskundigen in elk geval het samenwerkingsverband adviseren
      over het beoordelen of een leerling is aangewezen op het leerwegondersteunend onderwijs of de toelaatbaarheid
      van leerlingen tot het praktijkonderwijs of het voortgezet speciaal onderwijs. Bij algemene maatregel van bestuur
      worden nadere voorschriften gegeven met betrekking tot de aard van de noodzakelijke deskundigheid.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.13
    text: |-
      Het samenwerkingsverband stelt een adviescommissie als bedoeld in
      [artikel 7:13 van de Algemene wet bestuursrecht][ref1] in, die adviseert over bezwaarschriften betreffende
      besluiten van het samenwerkingsverband over de beoordeling of een leerling is aangewezen op het
      leerwegondersteunend onderwijs en de toelaatbaarheid van leerlingen tot het praktijkonderwijs of het voortgezet
      speciaal onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 17a.14
    text: |-
      Het samenwerkingsverband is bevoegd gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15, van de
      Algemene verordening gegevensbescherming te verwerken met betrekking tot leerlingen, voor zover dit noodzakelijk
      is voor de uitoefening van de taken, bedoeld in het zesde lid, onderdelen b tot en met d. Het samenwerkingsverband
      verstrekt de gegevens, bedoeld in de eerste volzin, niet aan derden, met uitzondering van het bevoegd gezag van de
      school waar de desbetreffende leerling is aangemeld of ingeschreven. Het samenwerkingsverband bewaart de gegevens
      op een plaats die uitsluitend toegankelijk is voor het samenwerkingsverband en de deskundigen, bedoeld in het
      twaalfde lid. Het samenwerkingsverband bewaart de gegevens tot drie jaar na afloop van:
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.14.a
    text: |-
      de beoordeling of een leerling is aangewezen op het leerwegondersteunend onderwijs of van het toelaatbaar verklaren
      van leerlingen tot het praktijkonderwijs of het voortgezet speciaal onderwijs,
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.14.b
    text: |-
      de advisering over de ondersteuningsbehoefte van de leerling aan het bevoegd gezag van de school waar de leerling
      is aangemeld of ingeschreven, of
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.14.c
    text: |-
      de toewijzing van ondersteuningsmiddelen of ondersteuningsvoorzieningen aan de school, voor zover het voor die
      toewijzing nodig was gegevens van de leerling als bedoeld in de eerste volzin te verwerken.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a.15
    text: |-
      Het samenwerkingsverband kent aan elke beslissing als bedoeld in [artikel 10e, vierde lid, eerste volzin][ref1],
      en aan elke toelaatbaarheidsverklaring als bedoeld in [artikel 10g][ref2], en
      [artikel 40, twaalfde lid, van de Wet op de expertisecentra][ref3] een volgnummer toe. Het samenwerkingsverband
      verstrekt van elk advies over de ondersteuningsbehoefte van een leerling als bedoeld in het veertiende lid,
      afschrift aan de ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10e
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10g
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel40
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10e
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10g
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '40'
  - number: 17a.16
    text: |-
      Bevoegde gezagsorganen van tot dezelfde richting behorende scholen en scholen als bedoeld in de
      [Wet op de expertisecentra][ref1] waaraan voortgezet speciaal onderwijs behorend tot cluster 3 en 4 wordt verzorgd
      kunnen aangesloten blijven of kunnen zich aansluiten bij een landelijk samenwerkingsverband als bedoeld in dit lid,
      zoals dat luidde vóór de datum van inwerkingtreding van dit lid zoals dat is komen te luiden met de Wet van 20 mei
      2020 tot wijziging van diverse onderwijswetten door het wijzigen van de systematiek van het in aanmerking brengen
      voor bekostiging van nieuwe openbare en bijzondere scholen zodat er meer ruimte is voor een nieuw onderwijsaanbod
      (Wet meer ruimte voor nieuwe scholen) (Stb. 2020, 160). Op een landelijk samenwerkingsverband zijn het tweede
      tot en met het vijftiende lid, met uitzondering van het derde lid en het vijfde lid, en het zeventiende lid van
      overeenkomstige toepassing. Indien een bevoegd gezag scholen heeft met ten minste de richting van de scholen die
      behoren tot het landelijk samenwerkingsverband bepaalt het bevoegd gezag eenmalig of aansluiting bij het landelijk
      samenwerkingsverband wordt gevraagd. Het landelijk samenwerkingsverband beslist over de aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 17a.17
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden vastgesteld met betrekking tot de
      samenwerkingsverbanden.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel17a
  - number: 17a1.1
    text: |-
      In afwijking van [artikel 10e, vierde lid][ref1], juncto [artikel 10g, derde lid][ref2],
      [artikel 17a, elfde lid][ref3] kan het samenwerkingsverband kiezen om voorschriften voor:


