  - number: 58.7.c
    text: |-
      de [artikelen 27b][ref1], [28][ref2] en [28a][ref3]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel28a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel58
