        paragraaf: '4'
        afdeling: II
  - number: '121.4'
    text: |-
      Een krachtens [artikel 82, eerste lid][ref1], vast te stellen ministeriële regeling wordt, voor zover die
      betrekking heeft op aanvullende bekostiging voor geïsoleerde scholen of scholengemeenschappen, aan de beide
      Kamers der Staten-Generaal overgelegd. De ministeriële regeling wordt niet eerder vastgesteld dan vier weken na de
      overlegging van het ontwerp. Indien een der Kamers der Staten-Generaal besluit niet in te stemmen met het ontwerp,
      wordt de ministeriële regeling niet vastgesteld en kan niet eerder dan vier weken na het besluit van die Kamer der
      Staten-Generaal een nieuw ontwerp aan beide kamers der Staten-Generaal worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel82
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel121
    references:
