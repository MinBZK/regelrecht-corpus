  - number: 64a.2
    text: |-
      Onze Minister brengt een nevenvestiging van een scholengemeenschap als bedoeld in
      [artikel 73, aanhef en onderdeel a][ref1], voor bekostiging in aanmerking indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel73
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '73'
        paragraaf: '2'
        afdeling: I
  - number: 64a.2.a
    text: |-
      het bevoegd gezag met de belangstellingsmeting aannemelijk maakt dat het aantal leerlingen van elk van de
      samenstellende scholen ten minste drie kwart zal bedragen van het daarvoor in het eerste lid, onder a, genoemde
      aantal;
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64a
  - number: 64a.2.b
    text: |-
      het onderwijs op de scholengemeenschap waaraan de nevenvestiging is verbonden niet zeer zwak
      is als bedoeld in [artikel 23a1, eerste en derde lid][ref1], of door de inspectie ingevolge
      [artikel 11 van de Wet op het onderwijstoezicht][ref2] als onvoldoende is beoordeeld; en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel11
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel64a
