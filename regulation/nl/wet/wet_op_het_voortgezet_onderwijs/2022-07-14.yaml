        artikel: '82'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: II
  - number: 123a
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de [artikelen 23a1][ref1] en [109a][ref2], en
      vervolgens telkens na vijf jaar aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van de
      artikelen 23a1 en 109a in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23a1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel109a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel123a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 23a1
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 109a
        afdeling: III
  - number: 123b
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van artikel III van de Wet van 4 juni 2015 tot
      wijziging van enige onderwijswetten in verband met het invoeren van de verplichting voor scholen om zorg te dragen
      voor de veiligheid op school (Stb. 238) aan de Staten-Generaal een verslag over de doeltreffendheid en effecten van
      de [artikelen 3b][ref1] en [24a, eerste lid, onderdeel k][ref2], in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel3b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel24a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel123b
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 3b
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 24a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 123c
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de Wet van 29 november 2017 tot wijziging
      van diverse onderwijswetten in verband met het pseudonimiseren van het persoonsgebonden nummer van een
      onderwijsdeelnemer ten behoeve van het bieden van voorzieningen in het kader van het onderwijs en de begeleiding
      van onderwijsdeelnemers (Stb. 508) aan de Staten-Generaal een verslag over de doeltreffendheid en effecten van
      [artikel 103b, twaalfde tot en met vijftiende lid][ref1], in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel123c
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103b
        hoofdstuk: IV
        afdeling: II
  - number: 123d
    text: |-
      Onze Minister zendt na vijf, tien en vijftien jaar na de inwerkingtreding van de Wet van 20 mei 2020 tot wijziging
      van diverse onderwijswetten door het wijzigen van de systematiek van het in aanmerking brengen voor bekostiging van
      nieuwe openbare en bijzondere scholen zodat er meer ruimte is voor een nieuw onderwijsaanbod (Wet meer ruimte voor
      nieuwe scholen) (Stb. 2020, 160) aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van de
      gewijzigde systematiek van het in aanmerking brengen voor bekostiging van nieuwe scholen in de praktijk. Daarbij
      wordt in ieder geval gelet op de effecten op de segregatie.
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel123d
  - number: 123e
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de Wet van 8 april 2020 tot wijziging van de Wet op
      het voortgezet onderwijs en de [Wet voortgezet onderwijs BES][ref1] in verband met het faciliteren van een gelijke
      kans op doorstroom naar het hoger algemeen voortgezet onderwijs en het voorbereidend wetenschappelijk onderwijs
      (Stb. 2020, 121) aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van [artikel 27a][ref2]
      in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0030284
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel27a
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel123e
    references:
      - id: ref1
        bwb_id: BWBR0030284
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 27a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: I
  - number: 123f
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de Wet van 28 oktober 2020 tot wijziging van
      onder meer de Wet op het voortgezet onderwijs en de Wet voortgezet onderwijs BES in verband met vereenvoudiging
      van de grondslagen van de bekostiging voor personeels- en exploitatiekosten van de scholen voor voortgezet
      onderwijs (vereenvoudiging grondslagen bekostiging vo-scholen; Stb. 2020, 437), en vervolgens telkens na
      vier jaar, aan de Staten-Generaal verslag over de doeltreffendheid en de effecten van de wijzigingen in
      [titel III, afdeling II, hoofdstuk II][ref1], in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002399/2022-07-14#Artikel123f
    references:
      - id: ref1
        bwb_id: BWBR0002399
        hoofdstuk: II
        afdeling: II
