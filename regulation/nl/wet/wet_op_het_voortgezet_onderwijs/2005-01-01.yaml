preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter verkrijging van een samenhangend geheel van
    onderwijsvoorzieningen het voortgezet onderwijs in een wet te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder:

      «Onze Minister»: Onze Minister van Onderwijs, Cultuur en Wetenschap en, voor wat betreft het landbouwonderwijs,
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

      «de inspectie»: de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref1];

      «voortgezet onderwijs»: het voortgezet onderwijs, bedoeld in [artikel 2][ref2]

      «school»: een school voor voortgezet onderwijs, tenzij het tegendeel blijkt;

      «openbare school»:

      a. een school in stand gehouden door een gemeente, dan wel door een openbaar lichaam, ingesteld bij een
      gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref3] (Stb. 1984, 669), waarin
      deelnemen een of meer gemeenten, al dan niet te zamen met een of meer privaatrechtelijke rechtspersonen met
      volledige rechtsbevoegdheid;

      b. een door een openbare rechtspersoon als bedoeld in [artikel 42a][ref4] in stand gehouden school;

      c. een door een stichting als bedoeld in [artikel 42b][ref5] of [artikel 53c][ref6] in stand gehouden school;

      «bijzondere school»: een door een natuurlijke persoon of door een privaatrechtelijke rechtspersoon, niet zijnde een
      stichting als bedoeld in [artikel 42b][ref7], in stand gehouden school;

      «openbare rechtspersoon»: een rechtspersoon die krachtens publiekrecht is ingesteld als bedoeld in
      [artikel 42a][ref8];

      «het bevoegd gezag» : voor wat betreft:

      a. een openbare school:

      1°. het college van burgemeester en wethouders, voor zover de raad niet anders bepaalt, en, indien de raad dit
      besluit, met inachtneming van door hem te stellen regelen;

      2°. het krachtens de desbetreffende gemeenschappelijke regeling bevoegde orgaan;

      3°. de openbare rechtspersoon, bedoeld in [artikel 42a][ref9]; dan wel

      4°. de stichting, bedoeld in [artikel 42b][ref10] of [artikel 53c][ref11];

      b. een bijzondere school: het schoolbestuur;

      «Informatie Beheer Groep»: de Informatie Beheer Groep, genoemd in de
      [Wet verzelfstandiging Informatiseringsbank][ref12];

      «persoonsgebonden nummer»: het sociaal-fiscaalnummer, bedoeld in
      [artikel 2, derde lid, onder j, van de Algemene wet inzake rijksbelastingen][ref13], dan wel het door de Informatie
      Beheer Groep uitgegeven onderwijsnummer, bedoeld in [artikel 27b, vierde lid][ref14];

      «contractactiviteiten»: activiteiten als bedoeld in [artikel 20, tweede lid][ref15];

      «de basisvorming in het voortgezet onderwijs»: het onderwijs, bedoeld in de [artikelen 11a tot en met 11e][ref16];

      «personeel»:

      a. de benoemde rector, directeur, conrector, adjunct-directeur of leraar, en overig personeel benoemd in een andere
      functie dan het geven van onderwijs;

      b. het onder a bedoelde personeel dat zonder benoeming is tewerkgesteld, tenzij het betreft de toepassing
      van de artikelen [38a tot en met 39a][ref17], [40][ref18], [40a][ref19], [43a, eerste en tweede lid][ref20],
      [51, eerste tot en met derde lid][ref21], [52][ref22], [52a][ref23], [53][ref24], [53b][ref25], [96o][ref26]
      en [96q.1][ref27], voor zover niet anders is bepaald, en de toepassing van daarmee verband houdende wettelijke
      bepalingen;

      «nascholing»: een vorm van scholing, gegeven aan leden van het personeel om hun kennis, inzicht, vaardigheden
      en beroepshoudingen direct verband houdend met de uitoefening van hun beroep, voortbouwend op de in de initiële
      opleiding verworven aanvangsbekwaamheid te verdiepen en uit te breiden;

      «leerlinggebonden budget»: een leerlinggebonden budget voor een leerling als bedoeld in [artikel 77a][ref28].


