    text: |-
      Bij twijfel of deze wet op een of meer inrichtingen van onderwijs van toepassing is, wordt beslist bij koninklijk
      besluit.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel120
  - number: '122'
    text: |-
      1 Voortgezet onderwijs wordt niet gegeven in lokalen, die door de krachtens de [Gezondheidswet][ref1] (Stb.
      1956, 51) bevoegde inspecteur van het staatstoezicht op de volksgezondheid zijn afgekeurd als schadelijk voor
      de gezondheid, gevaar opleverende voor de veiligheid of wegens onvoldoende ruimte voor het aantal in die lokalen
      toegelaten leerlingen.

      2 De inspecteur, bedoeld in het eerste lid, zendt zijn besluit tot afkeuring aan burgemeester en wethouders van de
      gemeente waarin het lokaal ligt. Op dezelfde dag doet hij van zijn besluit mededeling aan Onze minister; voorts,
      indien het een uit de openbare kas bekostigde school betreft, aan de inspectie en, indien het een bijzondere school
      betreft, aan het schoolbestuur.

      3 Indien de inspecteur, bedoeld in het eerste lid, besluit dat het lokaal voldoende is verbeterd of dat het aantal
      leerlingen voldoende is beperkt, mag het onderwijs worden hervat. Aan hen, die ingevolge het bepaalde in het tweede
      lid van de afkeuring mededeling hebben ontvangen, wordt van dit besluit op gelijke wijze mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002202
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0002202
  - number: '123'
    text: |-
      1 Hij, die in strijd met het voorschrift van [artikel 122, eerste lid][ref1], onderwijs geeft of doet geven in een
      afgekeurd lokaal, wordt gestraft met geldboete van de tweede categorie.

      2 Het feit, strafbaar gesteld in dit artikel, is een overtreding.


