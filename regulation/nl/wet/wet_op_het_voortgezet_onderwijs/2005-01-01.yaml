  - number: 10e
    text: |-
      1 Leerwegondersteunend onderwijs wordt verzorgd ter voorbereiding op of gedurende het volgen van onderwijs in een
      van de leerwegen, genoemd in de [artikelen 10][ref1], [10b][ref2] en [10d][ref3], ten behoeve van de leerling voor
      wie vaststaat dat een orthopedagogische en orthodidactische benadering is geboden met het oog op het afsluiten van
      het onderwijs in een van deze leerwegen. Leerwegondersteunend onderwijs wordt zodanig in het onderwijs geïntegreerd
      en ingericht dat de leerling een ononderbroken ontwikkelingsproces, gericht op het afsluiten als bedoeld in de
      eerste volzin, kan volgen.

      2 Leerwegondersteunend onderwijs wordt verzorgd, indien de leerling met behulp van de voorzieningen, bedoeld in
      [artikel 24, tweede lid, tweede volzin][ref4], niet een ononderbroken ontwikkelingsproces als bedoeld in het eerste
      lid, kan volgen.

      3 Het bevoegd gezag beslist na overleg met de ouders van de leerling of aan de leerling leerwegondersteunend
      onderwijs wordt aangeboden.

      4 De in [artikel 10g][ref5] bedoelde regionale verwijzingscommissie beslist op aanvraag van het bevoegd
      gezag of de leerling op leerwegondersteunend onderwijs is aangewezen. Het bevoegd gezag voegt bij de aanvraag
      na overleg met de ouders een op de desbetreffende leerling betrekking hebbend onderwijskundig rapport.
      [Artikel 10g, derde lid, vijfde lid, eerste volzin, en zesde tot en met negende lid][ref6], is van overeenkomstige
      toepassing.

      5 In afwijking van [artikel 10g, vijfde lid, eerste volzin][ref7], kan de regionale verwijzingscommissie tegelijk
      met de beslissing dat een leerling niet is aangewezen op leerwegondersteunend onderwijs, beslissen dat die leerling
      toelaatbaar is tot het praktijkonderwijs. Alvorens daartoe te beslissen, hoort de regionale verwijzingscommissie de
      ouders van de leerling en het bevoegd gezag van de betrokken school of afdeling voor praktijkonderwijs.

      6 [Artikel 10g, vierde lid][ref8], is van overeenkomstige toepassing op de leerling die op basis van een
      beschikking van de regionale verwijzingscommissie is toegelaten.


