  - number: '76'
    text: Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel76
  - number: 76a
    text: |-
      De [artikelen 76b tot en met 76w][ref1] zijn slechts van toepassing op scholen voor voorbereidend wetenschappelijk
      onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs, voor voorbereidend beroepsonderwijs en voor
      praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76b
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 76b
        hoofdstuk: I
        afdeling: IA
  - number: 76b
    text: |-
      1 De gemeenteraad draagt ten behoeve van de gemeentelijke en van de andere dan gemeentelijke scholen zorg voor de
      voorzieningen in de huisvesting op het grondgebied van de gemeente overeenkomstig het bepaalde in dit hoofdstuk.
      Hij behandelt daarbij de gemeentelijke en de andere dan gemeentelijke scholen op gelijke voet.

      2 Voor de toepassing van dit hoofdstuk wordt onder een andere dan een gemeentelijke school mede begrepen een op het
      grondgebied van de gemeente gelegen nevenvestiging van een school waarvan de hoofdvestiging op het grondgebied van
      een andere gemeente is gelegen.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel76b
  - number: 76c
    text: |-
      1 Voor de toepassing van dit hoofdstuk worden onder voorzieningen in de huisvesting begrepen:

      a. voor blijvend onderscheidenlijk voor tijdelijk gebruik bestemde voorzieningen, bestaande uit:

      1°. nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een
      gedeelte daarvan, terreinen, alsmede eerste aanschaf van leer- en hulpmiddelen en meubilair,

      2°. uitbreiding van de onder 1° bedoelde voorzieningen, en

      3°. medegebruik van een ruimte die geschikt is voor het onderwijs;

      b. herstel van constructiefouten aan het gebouw of het terrein;

      c. herstel en vervanging in verband met schade aan gebouw, leer- en hulpmiddelen en meubilair in geval van
      bijzondere omstandigheden.

      2 Bij algemene maatregel van bestuur worden bruto vloeroppervlakten per gelijktijdig aanwezige leerling
      voorgeschreven die voorzieningen in de huisvesting ten minste dienen te bevatten. Deze oppervlakten kunnen per
      schoolsoort verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel76c
  - number: 76d
    text: |-
      1 De gemeenteraad stelt jaarlijks ten behoeve van het eerstvolgende jaar voor een door hem te bepalen tijdstip een
      bekostigingsplafond vast voor de bekostiging van de voorzieningen in de huisvesting voor:

      a. basisscholen als bedoeld in de [Wet op het primair onderwijs][ref1],

      b. speciale scholen voor basisonderwijs als bedoeld in de [Wet op het primair onderwijs][ref2],

      c. scholen voor speciaal onderwijs, scholen voor voortgezet speciaal onderwijs, scholen voor speciaal en
      voortgezet speciaal onderwijs dan wel instellingen voor speciaal en voortgezet speciaal onderwijs als bedoeld in de
      [Wet op de expertisecentra][ref3],

      d. scholen voor voortgezet speciaal onderwijs als bedoeld in deze wet, en

      e. scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs,
      voor voorbereidend beroepsonderwijs en voor praktijkonderwijs.

      2 Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      in het eerste lid bedoelde scholen op het grondgebied van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0003549
