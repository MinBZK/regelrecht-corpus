  - number: 123a
    text: |-
      1 Onze minister is ten aanzien van de rechtspersoon, bedoeld in [artikel 98a][ref1], bevoegd tot:

      a. instemming met de statuten van de rechtspersoon, alsmede van wijziging van de statuten,

      b. instemming met de bijdrage, bedoeld in [artikel 98a, tweede lid][ref2],

      c. het geven van algemene aanwijzingen aan de rechtspersoon in verband met de minimaal door de rechtspersoon te
      geven waarborgen, bedoeld in [artikel 98a, eerste lid][ref3], zulks in verband met de goede voortgang van het
      onderwijs,

      d. het geven van algemene aanwijzingen aan de rechtspersoon met het oog op de afstemming van activiteiten van de
      rechtspersoon op het algemene beleid inzake preventie van ziekteverzuim en arbeidsongeschiktheid,

      e. het geven van algemene aanwijzingen aan de rechtspersoon om de nakoming te verzekeren van verplichtingen die bij
      dit deel aan de rechtspersoon zijn opgedragen,

      f. het geven van algemene aanwijzingen aan de rechtspersoon om de door Onze minister gewenste inlichtingen te
      verkrijgen,

      g. het geven van algemene aanwijzingen aan de rechtspersoon in gevallen dat het algemeen belang dit in belangrijke
      mate vereist,

      h. intrekking van de aanwijzing van de rechtspersoon.

      2 De rechtspersoon brengt jaarlijks voor 1 april aan Onze minister over het afgelopen jaar verslag uit over zijn
      werkzaamheden, voortvloeiend uit [artikel 98a][ref4].

      3 Onze minister zendt het verslag, bedoeld in het tweede lid, vergezeld van zijn advies daarover, voor 1 mei
      volgend op de datum, bedoeld in het tweede lid, aan de Tweede Kamer der Staten-Generaal.

      4 Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de uitoefening van de in het
      eerste lid bedoelde bevoegdheden en omtrent de gevolgen van intrekking van de aanwijzing van de rechtspersoon.

      5 Krachtens bij algemene maatregel van bestuur vast te stellen voorschriften kan Onze Minister subsidie verlenen
      aan de rechtspersoon ten behoeve van:

      a. bedragen die, gedurende een vooraf vastgestelde periode en tot een vooraf vastgestelde maximale
      hoogte, strekken ter vervanging van de vergoeding in verband met de kosten van vervanging, bedoeld in
      [artikel 84b, eerste lid][ref5], en de bijdrage, bedoeld in het tweede lid,

      b. een bijdrage aan de kosten van de bedrijfsvoering van de rechtspersoon, en

      c. een bijdrage ten behoeve van de uitoefening van landelijke taken in het kader van de bedrijfsgezondheidszorg.

      6 Bij de algemene maatregel van bestuur, bedoeld in het vijfde lid, kan ten behoeve van een in dat lid bedoelde
      subsidie een subsidieplafond worden vastgesteld.

      7 De rechtspersoon kan ten behoeve van de uitoefening van landelijke taken in het kader van de
      bedrijfsgezondheidszorg subsidie aan derden verstrekken.

      8 Het toezicht op de rechtspersoon is opgedragen aan Onze minister. Met het toezicht zijn belast de bij besluit
      van Onze minister aangewezen ambtenaren. Een besluit als bedoeld in de tweede volzin wordt bekendgemaakt in de
      Staatscourant.

      9 De algemene maatregel van bestuur, bedoeld in het vierde en vijfde lid, wordt aan de Tweede Kamer der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken
      en gedurende die termijn niet door of namens de Kamer de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.


