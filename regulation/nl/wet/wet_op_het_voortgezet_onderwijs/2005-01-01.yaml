  - number: 65a
    text: |-
      1 Het plan omvat tevens:

      a. een toelichting, en

      b. een toetsingskader.

      2 De toelichting bevat in elk geval de beschikkingen, houdende afwijzing van de verzoeken om opneming in het plan.
      Bovendien wordt in de toelichting in elk geval melding gemaakt van het oordeel van provinciale staten en gemeenten,
      bedoeld in [artikel 66, vijfde en zesde lid][ref1].

      3 Het toetsingskader omvat de uiteenzetting van het toe- en afwijzingsbeleid, aangaande verzoeken om opneming in
      het plan, en heeft in elk geval betrekking op de plannen die in de drie opvolgende jaren zullen worden vastgesteld.

      4 In het toetsingskader kan, onverminderd het bepaalde in [artikel 69][ref2], worden bepaald welk soort of welke
      soorten van scholen, onderscheidenlijk welk soort of welke soorten van afdelingen, gedurende een of meer jaren niet
      in het plan zullen worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel69
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '66'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '69'
        afdeling: I
  - number: '66'
    text: |-
      1 Een verzoek om opneming in het plan wordt voor 1 januari van het jaar van de vaststelling van het plan, bij Onze
      minister ingediend

      a. door de gemeenteraad, indien het een openbare school betreft die door een gemeente in stand wordt gehouden,

      b. door het krachtens de desbetreffende gemeenschappelijke regeling bevoegde orgaan, indien het een openbare school
      betreft die door een openbaar lichaam als bedoeld in [artikel 1][ref1] in stand wordt gehouden,

      c. door het bestuur van een openbare rechtspersoon als bedoeld in [artikel 42a][ref2] dan wel van een stichting als
      bedoeld in [artikel 42b][ref3] indien het een openbare school betreft die door een openbare rechtspersoon of een
      stichting in stand wordt gehouden, dan wel

      d. door het schoolbestuur, indien het een bijzondere school betreft.

      2 Ten minste eenmaal in de drie jaren stellen gedeputeerde staten vast, of voldoende is voorzien in de behoefte aan
      openbaar onderwijs in een genoegzaam aantal scholen.

      3 Gedeputeerde staten kunnen de gemeente opdragen een verzoek te richten tot Onze minister om opneming in het
      plan van een openbare school, indien de ouders, voogden en verzorgers van een naar hun oordeel voldoend aantal
      leerlingen hiertoe de wens hebben te kennen gegeven en de gemeente daaraan niet heeft voldaan.

      3a Onze minister kan de gemeente opdragen een verzoek tot hem te richten om opneming op het plan van een openbare
      school, indien gedeputeerde staten geen toepassing geven aan het derde lid en ouders, voogden en verzorgers van een
      naar zijn oordeel voldoend aantal leerlingen hiertoe de wens hebben te kennen gegeven.

      4 Elk verzoek is met redenen omkleed, vermeldt de aard en de plaats van vestiging van de school en gaat vergezeld
      van een prognose omtrent de te verwachten omvang. Een verzoek tot opneming in het plan van een school voor
      praktijkonderwijs dan wel van een afdeling voor praktijkonderwijs, bedoeld in [artikel 10f, eerste lid][ref4],
      wordt gedaan in overeenstemming met de bevoegde gezagsorganen in het samenwerkingsverband waarvan die school
      dan wel die afdeling deel gaat uitmaken, en gaat vergezeld van een advies van de gemeente waarin die school
      dan wel die afdeling wordt gevestigd. Indien het verzoek namens de raad, het krachtens de desbetreffende
      gemeenschappelijke regeling bevoegde orgaan of het schoolbestuur wordt ingediend door een rechtspersoon met
      volledige rechtsbevoegdheid, die zich de bevordering van het voortgezet onderwijs ten doel stelt, is het vervat in
      een deelplan, waarin zijn opgenomen de scholen, waarvan de oprichting in de drie kalenderjaren, waarover het plan
      zich uitstrekt, door die rechtspersoon wordt voorgestaan.

      5 Elk verzoek, bedoeld in het voorgaande lid, wordt door Onze minister toegezonden aan de provincie die het
      aangaat. Binnen vier maanden na ontvangst stellen Provinciale Staten Onze minister in kennis van hun oordeel over
      deze verzoeken.

      6 Het bepaalde in het voorgaande lid is van overeenkomstige toepassing met betrekking tot verzoeken die de
      gemeenten Amsterdam, Rotterdam, 's-Gravenhage en Utrecht aangaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel42a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel42b
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel66
