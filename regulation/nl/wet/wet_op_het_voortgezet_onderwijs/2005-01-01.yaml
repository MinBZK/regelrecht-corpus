  - number: 27a
    text: |-
      1 Het bevoegd gezag stelt van iedere aan de school ingeschreven leerling die valt onder de werking van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1], vast, of deze leerling gedurende
      een aaneengesloten periode van ten minste 5 weken zonder geldige reden niet aan het onderwijs heeft deelgenomen. In
      afwijking van de vorige volzin kan Onze Minister bepalen dat voor soorten van voortgezet onderwijs de in die volzin
      bedoelde vaststelling wordt gedaan indien een ingeschreven studerende in een of meer vakken, deelvakken of andere
      programma-onderdelen niet aan het onderwijs heeft deelgenomen. Onder afwezigheid met geldige reden wordt verstaan
      afwezigheid wegens ziekte van de leerling, welke ziekte uitsluitend kan worden aangetoond door middel van een
      gedagtekende verklaring van een arts, en afwezigheid wegens bijzondere familie-omstandigheden.

      2 Het bevoegd gezag meldt uiterlijk op de derde werkdag na afloop van een periode van afwezigheid van 5 weken aan
      de leerling dat daarvan in de administratie van de school aantekening is gemaakt en verzoekt de leerling om opgaaf
      van de reden van de afwezigheid.

      3 Uiterlijk op de vijfde werkdag na de periode van 8 weken stelt het bevoegd gezag vast:

      a. of de reden die de leerling binnen 8 weken na de aanvang van de periode van 5 weken gaf voor zijn afwezigheid,
      een geldige is, of

      b. dat de leerling binnen 8 weken na de aanvang van de periode van 5 weken geen reden heeft opgegeven voor zijn
      afwezigheid.

      4 Het bevoegd gezag stelt tevens uiterlijk op de vijfde werkdag na afloop van de periode van 8 weken vast of de
      leerling voor het einde van die periode weer aan het onderwijs is gaan deelnemen.

      5 Het bevoegd gezag meldt uiterlijk de vijfde werkdag na afloop van een periode van 8 weken aan de Informatie
      Beheer Groep de leerling die gedurende een aaneengesloten periode van ten minste 5 weken zonder opgave van geldige
      reden niet aan het onderwijs heeft deelgenomen. Tevens meldt het indien die leerling voor het einde van de periode
      van 8 weken weer aan het onderwijs is gaan deelnemen de datum ervan.

      6 De periode van 5 weken en de periode van 8 weken worden verlengd met de weken waarin vanwege vakantie geen
      onderwijs werd verzorgd. Zij wordt geacht niet te zijn onderbroken door deze vakantieweken.

      7 Het bevoegd gezag stuurt gelijktijdig met de mededelingen, bedoeld in het vijfde lid, een afschrift
      van de gegevens die over de betrokken leerling aan de Informatie Beheer Groep zijn verstrekt aan deze
      betrokkene. Het bevoegd gezag geeft daarbij tevens aan dat afwezigheid als bedoeld in het eerste lid,
      gevolgen heeft voor de tegemoetkoming in de onderwijsbijdrage en de schoolkosten van betrokkene op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2], alsmede welke beroepsgang voor
      betrokkene tegen de mededeling, bedoeld in het vijfde lid, open staat.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
