      1 De scholen voor voortgezet onderwijs zijn dagscholen.

      2 Aan een school kunnen contractactiviteiten worden verricht, bestaande uit cursussen waarvan de kosten niet ten
      laste van 's Rijks kas komen, en uit werkzaamheden voor eigen rekening ten behoeve van derden, voor zover deze
      cursussen en werkzaamheden verband houden met het onderwijs aan de desbetreffende school en voor zover het belang
      van het onderwijs aan de school door deze cursussen en werkzaamheden niet wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel20
  - number: '21'
    text: |-
      1 De naam van de school duidt aan, tot welke van de soorten van scholen, bedoeld in de [artikelen 7][ref1],
      [8][ref2], [9][ref3], [10a][ref4] en [10f][ref5], de school behoort. Het bevoegd gezag van een school voor
      middelbaar algemeen voortgezet onderwijs, een school voor voorbereidend beroepsonderwijs, of een scholengemeenschap
      waarvan in ieder geval een school voor middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend
      beroepsonderwijs deel uitmaakt, kan voor die school de aanduiding «voorbereidend middelbaar beroepsonderwijs»
      hanteren. Bij verschil van mening tussen het bevoegd gezag en Onze minister, tot welke van de soorten zij behoort,
      beslist Onze minister.

      2 In het maatschappelijk verkeer brengt het bevoegd gezag ondubbelzinnig tot uitdrukking, welk bij en krachtens
      deze wet geregeld, uit 's Rijks kas bekostigd onderwijs de leerlingen volgen, en in voorkomend geval welk onderwijs
      de school verzorgt met toepassing van [artikel 20, tweede lid][ref6].


