  - number: 98a
    text: |-
      1 Het bevoegd gezag van bij algemene maatregel van bestuur aan te wijzen scholen is aangesloten bij een
      rechtspersoon met volledige rechtsbevoegdheid die zich ten doel stelt waarborgen te bieden voor de kosten van
      vervanging bij afwezigheid van personeel. De eerste volzin is van overeenkomstige toepassing op het bestuur van een
      centrale dienst voor zover het betreft personeel dat is belast met het geven van leerwegondersteunend onderwijs dan
      wel het uitoefenen van taken en bevoegdheden als bedoeld in artikel 53b, eerste lid, tweede volzin. De in de eerste
      volzin bedoelde rechtspersoon wordt door Onze minister aangewezen.

      2 Het bevoegd gezag onderscheidenlijk het bestuur van de in het eerste lid bedoelde scholen onderscheidenlijk
      centrale diensten is voorts verplicht aan de in dat lid bedoelde rechtspersoon jaarlijks een door die rechtspersoon
      vast te stellen bijdrage te voldoen in verband met de kosten van vervanging.

      3 Van de in het eerste juncto tweede lid bedoelde verplichting kan Onze minister op verzoek van het bevoegd gezag
      onderscheidenlijk het bestuur ontheffing verlenen op grond van bezwaren van godsdienstige of levensbeschouwelijke
      aard. Onze minister verleent de ontheffing slechts, indien het bevoegd gezag onderscheidenlijk het bestuur aantoont
      dat een afdoende andere voorziening is getroffen met betrekking tot de gevolgen van vervanging bij afwezigheid
      van personeel. Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag. Indien de beschikking niet
      binnen zes maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een
      termijn waarbinnen de beschikking wel tegemoet kan worden gezien.

      4 De rechtspersoon kan regels vaststellen ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel98a
  - number: 98a1
    text: |-
      1 De rechtspersoon, bedoeld in [artikel 98a][ref1], kan het sociaal-fiscaal nummer van het personeelslid dat bij
      afwezigheid wordt vervangen, en van degene die het personeelslid tijdelijk vervangt, uitsluitend in het kader van
      het doel, bedoeld in [artikel 98a, eerste lid][ref2], gebruiken in het verkeer met:

      a. het personeelslid onderscheidenlijk degene die het personeelslid tijdelijk vervangt,

      b. het bevoegd gezag van de school dan wel het bestuur van de centrale dienst waar de in onderdeel a bedoelde
      personen werkzaam zijn,

      c. Onze Minister,

      d. de instantie, bedoeld in [artikel 98b, vijfde lid][ref3], of

      e. het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4].

      2 Het sociaal-fiscaal nummer wordt op een daartoe strekkend verzoek van de in het eerste lid bedoelde rechtspersoon
      aan die rechtspersoon verstrekt door het bevoegd gezag van de school dan wel het bestuur van de centrale dienst
      waar het personeelslid dat bij afwezigheid wordt vervangen, werkzaam is.

      3 Indien dat ten behoeve van het verslag, bedoeld in [artikel 123a, tweede lid][ref5], noodzakelijk is, worden
      gegevens daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon
      kunnen worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de controle
      op de rechtmatigheid en de doelmatigheid van door de rechtspersoon gedane uitgaven. Daarbij kunnen de sociaal-
      fiscale nummers worden vergeleken met de sociaal-fiscale nummers die door andere daartoe bij of krachtens de wet
      bevoegde instanties zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98a
