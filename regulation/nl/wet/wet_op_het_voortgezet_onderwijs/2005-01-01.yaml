  - number: '59'
    text: |-
      Onze minister kan de aanwijzing intrekken, indien niet langer wordt voldaan aan de artikelen 56 en 58
      of indien van misbruik van de verleende aanwijzing is gebleken. De aanwijzing kan door Onze minister
      tevens worden ingetrokken indien het schoolbestuur of het personeel van de school in strijd handelt met
      [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel520
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:20
  - number: '60'
    text: |-
      1 Jaarlijks wordt gelegenheid gegeven om door het met gunstig gevolg afleggen van een staatsexamen voor een door de
      Informatie Beheer Groep in te stellen commissie een diploma te verkrijgen, overeenkomende met een diploma van een
      school voor voorbereidend wetenschappelijk onderwijs, voor hoger algemeen voortgezet onderwijs en voor middelbaar
      algemeen voortgezet onderwijs, als bedoeld in [artikel 29, eerste lid][ref1].

      2 Bij algemene maatregel van bestuur wordt bepaald, welke andere diploma's kunnen worden verkregen door het met
      gunstig gevolg afleggen van een staatsexamen voor een door de Informatie Beheer Groep in te stellen commissie.

      3 Zij, die zijn afgewezen bij het eindexamen van een school, worden niet toegelaten tot het in hetzelfde jaar te
      houden overeenkomstige staatsexamen.

      4 De staatsexamens zijn openbaar, behoudens het schriftelijke gedeelte.

      5 Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in dit artikel bedoelde examens,
      die niet voor alle kandidaten dezelfde vakken en andere programma-onderdelen behoeven te omvatten. Daarbij kan
      worden bepaald het bedrag, dat voor de toelating tot deze examens verschuldigd is.

      6 [Artikel 30a][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel30a
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel60
