  - number: '80'
    text: |-
      1 Bij ministeriële regeling worden programma's van eisen vastgesteld die de grondslag vormen voor de bekostiging
      van:

      a. de blijvende voorzieningen in de huisvesting voor een school,

      b. de tijdelijke voorzieningen in de huisvesting voor een school, en

      c. de voorzieningen in de inventaris.

      2 Elk programma van eisen omvat:

      a. een omschrijving van de in aanmerking genomen componenten waaruit de voorzieningen zijn opgebouwd,

      b. de daarvoor noodzakelijk geachte bedragen, en

      c. de wijze waarop de voor elke voorziening vast te stellen bekostiging wordt berekend.

      3 Een programma van eisen kan er in voorzien dat voor in dat programma genoemde groepen van scholen de bedragen,
      bedoeld in het tweede lid onderdeel b, hoger worden gesteld.

      4 De programma's van eisen voldoen aan de redelijke behoeften van een in normale omstandigheden verkerende school.

      5 Alle ontwerpen van ministeriële regelingen tot vaststelling van de programma's van eisen worden gezamenlijk
      bekendgemaakt in het officiële publikatieblad van het Ministerie van Onderwijs, Cultuur en Wetenschap. De
      ministeriële regelingen treden niet in werking dan nadat zes weken na die bekendmaking zijn verstreken. De
      ministeriële regelingen worden binnen vier weken na de vaststelling bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel80
  - number: '81'
    text: |-
      1 Het programma van eisen, bedoeld in [artikel 80, eerste lid onderdeel a][ref1], heeft betrekking op:

      a. nieuwbouw,

      b. uitbreiding,

      c. aanpassing van een gebouw dat als blijvende voorziening in de huisvesting geldt,

      d. terreinen daaronder begrepen vestiging van erfpacht en andere beperkte rechten, en

      e. te verwerven gebouwen.

      2 Het programma van eisen, bedoeld in [artikel 80, eerste lid onderdeel b][ref2], heeft betrekking op:

      a. nieuwbouw van tijdelijke lokalen,

      b. verplaatsing van tijdelijke lokalen,

      c. huur van gebouwen,

      d. huur van terreinen, en

      e. te verwerven gebouwen.

      3 Het programma van eisen, bedoeld in [artikel 80, eerste lid onderdeel c][ref3], heeft betrekking op:

      a. schoolmeubelen, en

      b. leer- en hulpmiddelen.

      4 De programma's van eisen, bedoeld in het eerste tot en met derde lid, hebben tevens betrekking op herstel van
      schade.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel80
