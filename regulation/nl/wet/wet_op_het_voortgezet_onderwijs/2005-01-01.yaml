  - number: 100a
    text: |-
      1 Voor zover gebouwen, terreinen of roerende zaken ten behoeve waarvan bekostiging wordt genoten geheel of
      gedeeltelijk tijdelijk niet nodig zijn voor het onderwijs aan de school, kan het bevoegd gezag deze voor ten
      hoogste een jaar, doch uiterlijk tot het einde van het schooljaar, in gebruik geven aan het bevoegd gezag van een
      andere school voor voortgezet onderwijs of van een uit 's Rijks kas bekostigde school voor ander onderwijs.

      2 Het eerste lid is eveneens van toepassing ten aanzien van nader door Onze minister aan te wijzen lokalen, voor
      zover deze gedurende gedeelten van de dag niet nodig zijn voor het onderwijs aan de school.

      3 Ingebruikgeving voor een langere periode dan op grond van het eerste lid toegestaan, behoeft de toestemming van
      Onze minister. Onze minister kan om gewichtige redenen zodanige toestemming weigeren. Onze Minister besluit binnen
      drie maanden na ontvangst van een aanvraag. Indien de beschikking niet binnen drie maanden kan worden gegeven,
      stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel
      tegemoet kan worden gezien.

      4 Voor zover gebouwen, terreinen of roerende zaken, als bedoeld in het eerste lid, dan wel lokalen, als bedoeld
      in het tweede lid, naar zijn oordeel geheel of gedeeltelijk niet nodig zullen zijn voor het onderwijs aan de
      school, is Onze minister bevoegd deze in gebruik te geven aan het bevoegd gezag van een andere school voor
      voortgezet onderwijs of van een uit 's Rijks kas bekostigde school voor ander onderwijs, behoudens voor de periode
      dat reeds ingebruikgeving ingevolge het eerste, tweede of derde lid, dan wel ingevolge [artikel 100b][ref1],
      onderscheidenlijk verhuur ingevolge [artikel 100c][ref2], heeft plaatsgevonden.

      5 Alvorens een beslissing te nemen als bedoeld in het derde lid, tweede volzin, of in het vierde lid, treedt Onze
      minister in overleg met het bevoegd gezag van de betrokken scholen.

      6 Indien gebouwen, terreinen of roerende zaken zonder toestemming van Onze minister in gebruik zijn gegeven voor
      een langere termijn dan in het eerste lid bedoeld, eindigt de ingebruikgeving indien Onze minister het vierde lid
      wenst toe te passen.

      7 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot ingebruikgeving als
      bedoeld in dit artikel.

      8 Het eerste tot en met zevende lid zijn slechts van toepassing op andere vormen van voortgezet onderwijs als
      bedoeld in [afdeling IV van titel II][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel100b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel100c
      [ref3]: https://wetten.overheid.nl/BWBR0002399#AfdelingIV
