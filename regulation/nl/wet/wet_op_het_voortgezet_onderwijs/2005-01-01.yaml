    text: |-
      1 Het bevoegd gezag doet onverwijld opgave aan burgemeester en wethouders van de gemeente waar de betrokkene woon-
      of verblijfplaats heeft van de gegevens van degene

      a. op wie de [Leerplichtwet 1969][ref1] niet meer van toepassing is en die de leeftijd van 23 jaren nog niet heeft
      bereikt,

      b. die niet in het bezit is van een diploma voorbereidend wetenschappelijk
      onderwijs of hoger algemeen voortgezet onderwijs als bedoeld in [artikel 7][ref2]
      onderscheidenlijk [artikel 8][ref3] dan wel een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de Wet educatie en beroepsonderwijs][ref4], en

      c. die

      1°. het onderwijs aan de school gedurende een aaneengesloten periode van ten minste een maand of een door het
      bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer volgt, of

      2°. bij de school wordt in- of uitgeschreven of van de school wordt verwijderd.

      2 Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van het eerste lid.


