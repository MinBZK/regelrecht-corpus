        afdeling: I
  - number: 52a
    text: |-
      1 Het beroep, bedoeld in [artikel 52][ref1], wordt schriftelijk ingesteld binnen zes weken, nadat de beslissing
      aan betrokkene is medegedeeld. Bij overschrijding van deze termijn ten gevolge van omstandigheden die de betrokkene
      niet kunnen worden verweten, laat de commissie niet-ontvankelijkverklaring op die grond achterwege.

      2 Tijdens de behandeling door de commissie van beroep loopt geen verjaring met betrekking tot rechtsvorderingen ter
      zake van beslissingen die aan het oordeel van de commissie zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel52
