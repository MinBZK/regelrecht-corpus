  - number: 11b
    text: |-
      1 De basisvorming in het voortgezet onderwijs beslaat een periode van drie leerjaren.

      2 Het bevoegd gezag draagt er zorg voor dat de basisvorming in het voortgezet onderwijs zodanig wordt ingericht dat
      de kerndoelen, bedoeld in [artikel 11a][ref1], in drie leerjaren kunnen worden bereikt.

      3 Het bevoegd gezag kan in de loop van de periode, bedoeld in het eerste lid, met het oog op het belang van
      leerlingen, de basisvorming in het voortgezet onderwijs zodanig inrichten dat leerlingen de kerndoelen, bedoeld in
      [artikel 11a][ref2], in ten minste twee en ten hoogste vier leerjaren kunnen bereiken.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
