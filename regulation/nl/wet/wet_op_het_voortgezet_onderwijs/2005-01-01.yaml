  - number: '99'
    text: |-
      1 Het bevoegd gezag besteedt de verstrekte bekostiging en de betaalde bedragen ten behoeve van die school op de
      wijze zoals aangegeven in het tweede tot en met vijfde lid.

      2 De voor voorzieningen in de huisvesting betaalde bedragen worden zodanig aangewend dat een behoorlijke en
      deugdelijke totstandkoming van deze voorzieningen is verzekerd. Indien na realisatie van de in de eerste volzin
      bedoelde voorzieningen de bedragen niet volledig zijn aangewend, kan het resterende deel daarvan worden aangewend
      voor de kosten van personeel, de kosten van nascholing of voorzieningen in de exploitatie.

      3 Het voor personeels- en exploitatiekosten betaalde bedrag wordt, tezamen met het voor nascholingskosten betaalde
      bedrag, aangewend voor de kosten van personeel, zoals onderscheiden in de [artikelen 32][ref1] en [32a][ref2], voor
      de kosten van nascholing of voor voorzieningen in de exploitatie. In geval van een overschot op die bedragen, kan
      dat overschot worden aangewend voor voorzieningen in de huisvesting.

      4

      5 De verstrekte overschrijdingsbedragen worden ten behoeve van het onderwijs aan de scholen van het bevoegd gezag
      aangewend.

      6 Het bevoegd gezag kan de bedragen, bedoeld in het derde lid, mede aanwenden voor de kosten van personeel, de
      kosten van nascholing of voorzieningen in de exploitatie van:

      a. een andere school voor voortgezet onderwijs;

      b. een scholengemeenschap waarvan een of meer scholen voor voortgezet onderwijs deel uitmaken;

      c. een basisschool of een speciale school voor basisonderwijs als bedoeld in de
      [Wet op het primair onderwijs][ref3], een school voor speciaal onderwijs, voor voortgezet speciaal onderwijs
      of voor speciaal en voortgezet speciaal onderwijs dan wel een instelling voor speciaal en voortgezet speciaal
      onderwijs als bedoeld in de [Wet op de expertisecentra][ref4].

      7 De op grond van [artikel 77a][ref5], [artikel 96g][ref6] of [artikel 96h][ref7] verstrekte bekostiging wordt
      besteed aan het doel waarvoor zij zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32
