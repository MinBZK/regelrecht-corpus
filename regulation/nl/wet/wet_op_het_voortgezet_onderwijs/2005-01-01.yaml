  - number: 11g
    text: |-
      1 In afwijking van de [artikelen 10f, derde lid, tweede volzin][ref1], [11a, vijfde lid][ref2],
      [11b, tweede en derde lid][ref3], en [11f, tweede lid][ref4], beslist het bevoegd gezag welke kerndoelen of
      onderdelen van kerndoelen, vastgesteld op grond van [artikel 11a, vierde lid][ref5], het als aan het eind van de
      basisvorming te bereiken doelstellingen hanteert.

      2 In afwijking van [artikel 11a, vierde lid][ref6], en van
      [artikel 4, derde lid, van het Besluit kerndoelen en adviesurentabel basisvorming 1998–2003][ref7] gelden de
      kerndoelen die in genoemd besluit zijn vastgelegd, tot een bij koninklijk besluit te bepalen tijdstip.

      3 In afwijking van de [artikelen 11b, tweede en derde lid][ref8], [11c, tweede lid][ref9], en [11d][ref10]
      worden, onverminderd het bepaalde in het vierde lid, ten behoeve van leerlingen in het voortgezet onderwijs in
      de eerste drie leerjaren gezamenlijk ten minste 2800 lesuren van 50 minuten onderwijs in de vakken genoemd in
      [artikel 11a, tweede lid][ref11], met dien verstande dat in die periode:

      a. in elk vak genoemd in [artikel 11a, tweede lid, onder a][ref12], met uitzondering van informatiekunde, ten
      minste 80 lesuren van 50 minuten onderwijs worden verzorgd, en

      b. in de vakken genoemd in [artikel 11a, tweede lid, onder b][ref13], gezamenlijk ten minste 160 lesuren van 50
      minuten onderwijs worden verzorgd.

      4 In afwijking van het derde lid en in afwijking van de [artikelen 11b][ref14], [11c, tweede lid][ref15],
      [11d][ref16] en [11e, tweede en derde lid][ref17], worden ten behoeve van leerlingen:

      a. voor wie naar de verwachting van het bevoegd gezag het onderwijs in de basisberoepsgerichte leerweg als bedoeld
      in [artikel 10b, eerste lid][ref18], het meest geschikt is, of

      b. die leerwegondersteunend onderwijs volgen als bedoeld in [artikel 10e][ref19], in de eerste twee
      leerjaren gezamenlijk ten minste 1920 lesuren van 50 minuten onderwijs verzorgd in vakken genoemd in
      [artikel 11a, tweede lid][ref20].

      5 In afwijking van [artikel 11c, vierde lid][ref21], behoeft het bevoegd gezag van een school voor voorbereidend
      beroepsonderwijs bij toepassing van [dat artikellid][ref22], [artikel 11e, tweede lid][ref23], niet in acht te
      nemen.


