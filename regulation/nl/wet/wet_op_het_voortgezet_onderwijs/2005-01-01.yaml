  - number: 42c
    text: |-
      1 Een rechtspersoon die een openbare school in stand houdt, kan de instandhouding van die school overdragen aan een
      andere rechtspersoon die tot de instandhouding van een openbare school bevoegd is.

      2 De overdracht geschiedt bij notariële akte. Bij deze akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van gebouwen, terreinen en roerende zaken over te dragen. Deze akte geldt tevens als akte van
      levering, bedoeld in [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1]. In de akte wordt tevens bepaald dat
      de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen aanstelt met ingang van de datum
      van overdracht.

      3 Door overdracht met inachtneming van het eerste en tweede lid treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger, onverminderd hetgeen verder voor de
      overgang daarvan naar burgerlijk recht is vereist.

      4 Voor zover het betreft scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen
      voortgezet onderwijs, voor voorbereidend beroepsonderwijs en voor praktijkonderwijs kan de gemeenteraad in
      bijzondere omstandigheden ontheffing verlenen van de verplichting tot overdracht van de rechten ten aanzien van
      gebouwen, terreinen en roerende zaken. Voor zover het betreft andere vormen van voortgezet onderwijs als bedoeld
      in [afdeling IV][ref2] kan Onze minister in bijzondere omstandigheden ontheffing verlenen van de verplichting tot
      overdracht van de rechten ten aanzien van gebouwen, terreinen en roerende zaken. Onze Minister besluit binnen zes
      maanden na ontvangst van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze
      Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan
      worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0002399#AfdelingIV
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel42c
