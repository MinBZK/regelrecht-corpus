  - number: '67'
    text: |-
      1 Het plan vermeldt van elke school de aard, de plaats van vestiging en de te verwachten omvang en geeft aan, welke
      scholen in het eerste jaar voor bekostiging uit 's Rijks kas in aanmerking zullen worden gebracht.

      2 Indien scholen op het plan worden vermeld zonder aanduiding van het eerste jaar van bekostiging uit 's Rijks kas,
      worden de redenen daarvan aan het plan toegevoegd.

      3 Behoudens het bepaalde in het vierde lid zijn in ieder plan mede opgenomen de scholen uit het vorige plan, die
      nog niet voor bekostiging in aanmerking zijn gebracht.

      4 Op verzoek van de aanvrager, dan wel indien zich naar het oordeel van Onze minister omstandigheden hebben
      voorgedaan, die bij de vaststelling van een plan niet bekend waren, kan uit het plan een in een vorig plan
      opgenomen school vervallen.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel67
  - number: '68'
    text: |-
      1 Indien Onze Minister van oordeel is dat een andere school dan wordt gevraagd, dan wel een andere plaats van
      vestiging meer in overeenstemming is met een evenwichtig geheel van onderwijsvoorzieningen, treedt hij, alvorens
      het plan wordt vastgesteld, in overleg met de aanvrager.

      2 Indien het verzoek om opneming in het plan in strijd is met het laatst vastgestelde toetsingskader, bedoeld in
      [artikel 65a][ref1], wijst Onze minister het verzoek af voor 1 februari, volgend op de ontvangst.

      3 Indien het verzoek om opneming in het plan gelijk of nagenoeg gelijk is aan het verzoek dat het voorgaande jaar
      is gedaan, en indien in het verzoek geen nieuw gebleken feiten of veranderde omstandigheden worden vermeld, wijst
      Onze Minister het verzoek af voor 1 februari, volgend op de ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel65a
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 65a
        afdeling: I
  - number: '69'
    text: |-
      1 Onze minister neemt in het plan in elk geval op de scholen, waarvan redelijkerwijs kan worden aangenomen dat zij,
      gelet op de belangstelling voor het desbetreffende schooltype en op het leerlingenverloop, blijkens statistische
      gegevens, waaronder die verstrekt door het Centraal Bureau voor de Statistiek, zullen worden bezocht door ten
      minste

      a. driehonderd vijfenvijftig leerlingen, voor wat betreft een gymnasium;

      b. driehonderd veertig leerlingen, voor wat betreft een atheneum;

      c. vierhonderd zestig leerlingen, voor wat betreft een lyceum;

      d. driehonderd zestig leerlingen, voor wat betreft een school en honderd vijfentwintig voor wat betreft een
      afdeling voor hoger algemeen voortgezet onderwijs;

      e. tweehonderd zestig leerlingen, voor wat betreft een school voor middelbaar algemeen voortgezet onderwijs;

      f. driehonderd twintig leerlingen voor wat betreft een school voor voorbereidend beroepsonderwijs
      bestaande uit een afdeling als bedoeld in [artikel 10c, onderdeel a][ref1], en een afdeling als bedoeld in
      [artikel 10c, onderdeel b][ref2], of uit twee afdelingen als bedoeld in [artikel 10c, onderdeel c][ref3];

      g. tweehonderd zestig leerlingen voor wat betreft een school voor voorbereidend beroepsonderwijs bestaande uit de
      afdeling, bedoeld in [artikel 10c, onderdeel d][ref4];

      h. honderd zestig leerlingen voor elke nieuw te vormen afdeling als bedoeld in
      [artikel 10c, onderdeel a, b of c][ref5], aan een reeds bekostigde of nieuw te vormen school voor voorbereidend
      beroepsonderwijs;

      i. tweehonderd zestig leerlingen voor elke nieuw te vormen afdeling als bedoeld in
      [artikel 10c, onderdeel d][ref6], aan een reeds bekostigde of nieuw te vormen school voor voorbereidend
      beroepsonderwijs.

      2 Een scholengemeenschap, in zich verenigende twee of meer van de in het eerste lid genoemde scholen, wordt in
      ieder geval in het plan opgenomen, indien op gelijke wijze als volgens het eerste lid kan worden aangetoond, dat
      het aantal leerlingen van elk der samenstellende scholen, behalve van een daartoe behorend lyceum en een school als
      bedoeld in het eerste lid, de onderdelen f tot en met i, ten minste drie vierden zal bedragen van het daarvoor in
      het eerste lid genoemde aantal.

      3 Bij de toepassing van de voorgaande leden worden niet in aanmerking genomen de leerlingen, voor wie binnen
      redelijke afstand plaatsruimte beschikbaar zal zijn op een gelijksoortige school, waar het verlangde onderwijs
      wordt gegeven, tenzij deze school uitsluitend voor interne leerlingen bestemd is.


