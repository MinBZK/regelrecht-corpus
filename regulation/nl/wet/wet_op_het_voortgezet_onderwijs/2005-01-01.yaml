  - number: '78'
    text: |-
      De kosten van de scholen zijn:

      a. huisvestingskosten,

      b. inventariskosten,

      c. personeelskosten,

      d. nascholingskosten, en

      e. exploitatiekosten.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel78
  - number: '79'
    text: |-
      De [artikelen 80 tot en met 83][ref1] zijn slechts van toepassing op andere vormen van voortgezet onderwijs als
      bedoeld in [afdeling IV van titel II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0002399#AfdelingIV
