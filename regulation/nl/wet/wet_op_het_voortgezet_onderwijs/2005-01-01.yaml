  - number: 96i
    text: |-
      1 Indien een gemeente een of meer scholen in stand houdt, stelt de gemeenteraad jaarlijks met betrekking tot die
      scholen voorlopig vast:

      a. het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      personeelskosten,

      b. het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      nascholingskosten,

      c. het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven ten behoeve van de
      exploitatiekosten,

      d. het totaal van de ontvangsten, bedoeld in artikel 85,

      e. het totaal van de ontvangsten dat is gebaseerd op de vergoeding van de kosten van de in artikel 85b bedoelde
      nascholing,

      f. het totaal van de ontvangsten dat is gebaseerd op de bedragen die krachtens artikel 86 voor de exploitatiekosten
      voor dat kalenderjaar zijn vastgesteld, alsmede de bedragen die krachtens artikel 99, tweede lid tweede volzin,
      voor voorzieningen in de exploitatie worden aangewend,

      g. het totaal van de aanvullende ontvangsten waaronder worden verstaan de bedragen die krachtens artikel 89 voor de
      exploitatiekosten voor dat kalenderjaar zijn vastgesteld,

      h. het bedrag dat de gemeente in het voorafgaande kalenderjaar heeft uitgegeven ten behoeve van de instandhouding
      van een rechtspersoon als bedoeld in artikel 53b, en

      i. een staat van voorzieningen die zijn ingesteld ten behoeve van het openbaar onderwijs.

      2 Indien de gemeente een deel van de ontvangsten, bedoeld in het eerste lid onderdeel d, of een deel van de
      ontvangsten, bedoeld in onderdeel e van dat lid, dan wel een deel van de ontvangsten, bedoeld in de onderdelen
      f of g van dat lid, toevoegt aan een voorziening, wordt dat deel aangemerkt als een uitgave als bedoeld in dat
      lid onderdeel a, onderscheidenlijk als een uitgave als bedoeld in de onderdelen b, c of h van dat lid. Indien de
      gemeente bedragen aan een voorziening onttrekt, worden deze aangemerkt als ontvangsten, bedoeld in het eerste lid
      onderdeel d, onderscheidenlijk als ontvangsten als bedoeld in de onderdelen e, f of g van dat lid.

      3 Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen c, f, g en h, worden buiten
      beschouwing gelaten de uitgaven en ontvangsten voor administratie, beheer en bestuur, bedoeld in artikel 86, eerste
      lid, onderdeel d, alsmede het bedrag dat door de gemeente met toepassing van artikel 118b, eerste lid, ter zake van
      exploitatiekosten is uitgegeven.

      4 Bij het vaststellen van de bedragen, bedoeld in het eerste lid onderdeel a en d, worden buiten beschouwing
      gelaten de bedragen die door de gemeente met toepassing van artikel 118b, eerste lid, in het voorafgaande
      kalenderjaar zijn uitgegeven ten behoeve van de personeelskosten, onderscheidenlijk de daarop betrekking hebbende
      ontvangsten. Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen a, b, c en h worden
      voorts buiten beschouwing gelaten de uitgaven die worden gedekt door ontvangsten van bedragen die door derden zijn
      betaald, de uitgaven die worden gedekt door ontvangsten op grond van een besluit als bedoeld in artikel 96g, zesde
      lid, tweede volzin, en de uitgaven voor de voorzieningen waarvoor het bevoegd gezag van een niet door de gemeente
      in stand gehouden school op grond van de regeling, bedoeld in artikel 96h, eerste lid, een aanvraag bij de gemeente
      kon indienen en wel gedurende de periode waarvoor een dergelijke aanvraag kon worden gedaan.

      5 Indien de gemeente een deel van de bekostiging voor personeels- en exploitatiekosten overdraagt aan een ander
      bevoegd gezag, wordt dat deel aangemerkt als een uitgave als bedoeld in het eerste lid, onderdeel a of onderdeel
      c. Indien door een ander bevoegd gezag een deel van de bekostiging voor personeels- en exploitatiekosten aan de
      gemeente wordt overgedragen, wordt dat deel aangemerkt als een ontvangst als bedoeld in het eerste lid, onderdeel
      d, of onderdeel f.

      6 Om de vijf jaar stelt de gemeenteraad voorlopig vast het totaal van de vastgestelde uitgaven en ontvangsten in de
      voorafgaande vijf kalenderjaren, zoals in het eerste tot en met vijfde lid is aangegeven. Indien de uitgaven hoger
      zijn dan de ontvangsten, bepaalt de gemeenteraad tevens het bedrag van de overschrijding. Indien een gemeente vanaf
      een tijdstip binnen een periode van vijf jaar als bedoeld in de eerste volzin geen school in stand houdt, stelt
      de gemeenteraad in afwijking van die volzin zo spoedig mogelijk na dat tijdstip voorlopig vast het totaal van de
      vastgestelde uitgaven en ontvangsten in het aan dat tijdstip voorafgaande deel van de periode van vijf jaar, zoals
      in het eerste tot en met vijfde lid is aangegeven.

      7 Na sluiting van de rekening van de gemeente stelt de gemeenteraad de in het eerste en zesde lid bedoelde
      bedragen, zo nodig gewijzigd, vast. In het geval de uitgaven hoger zijn dan de ontvangsten, bedoeld in het
      zesde lid, drukt de gemeenteraad vervolgens het bedrag van de overschrijding, bedoeld in genoemd lid, uit in een
      percentage van het totaal van de ontvangsten, bedoeld in het eerste lid onderdelen d tot en met g. Het percentage
      wordt afgerond tot twee decimalen. Afronding naar beneden vindt plaats indien de derde decimaal kleiner is dan 5,
      en naar boven indien deze decimaal ten minste 5 bedraagt.

      8 Voor de toepassing van de artikelen 96i tot en met 96k worden uitgaven ten behoeve van een nevenvestiging
      aangemerkt als uitgaven ten behoeve van de hoofdvestiging van de school waaraan de nevenvestiging is verbonden.
      Indien ten behoeve van een school of nevenvestiging uitgaven worden gedaan door meer dan één gemeente, worden
      deze uitgaven aangemerkt als uitgaven van de gemeente op wier grondgebied de hoofdvestiging is gelegen. In het
      geval, bedoeld in de vorige volzin worden de besluiten ingevolge de artikelen 96i tot en met 96k genomen door
      laatstbedoelde gemeente en hebben deze mede betrekking op de uitgaven van de andere gemeente of gemeenten. Voor de
      toepassing van de artikelen 96i tot en met 96k wordt een nevenvestiging aangemerkt als een nevenvestiging die is
      gelegen in de gemeente van de hoofdvestiging.

      9 De gemeenteraad kan in overeenstemming met het bevoegd gezag van een niet door de gemeente in stand gehouden
      school besluiten dat met betrekking tot een of meer scholen van dat bevoegd gezag uitgaven die de gemeente doet
      ten behoeve van een door haar in stand gehouden school buiten beschouwing worden gelaten bij het vaststellen van de
      bedragen, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel96i
  - number: 96j
    text: |-
      1 In het jaar volgend op de definitieve vaststelling, bedoeld in artikel 96i, zevende lid, wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door de gemeente in stand gehouden
      school die gedurende een of meer jaren van het desbetreffende tijdvak in de gemeente was gevestigd, aanspraak
      heeft. Dit overschrijdingsbedrag wordt vastgesteld door het percentage, bedoeld in artikel 96i, zevende lid,
      te vermenigvuldigen met het totaal van de ontvangsten van een niet door de gemeente in stand gehouden school
      dat is gebaseerd op de bedragen die krachtens de artikelen 84, eerste tot en met derde lid, 85, 85a en 86 voor
      het desbetreffende tijdvak zijn vastgesteld, met dien verstande dat bij het vaststellen van het totaal van de
      ontvangsten, bedoeld in de vorige volzin, buiten beschouwing blijven de ontvangsten voor administratie, beheer en
      bestuur, bedoeld in artikel 86, eerste lid, onderdeel d.

      2 Indien een gemeente gedurende een gedeelte van het desbetreffende tijdvak een of meer scholen in stand houdt,
      wordt voor het vaststellen van het overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het totaal van
      de ontvangsten van een niet door de gemeente in stand gehouden school over een overeenkomstig gedeelte van het
      desbetreffende tijdvak.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel96j
  - number: 96k
    text: |-
      1 Na de voorlopige vaststelling van het bedrag van de overschrijding, bedoeld in [artikel 96i, zesde lid][ref1],
      keren burgemeester en wethouders aan het bevoegd gezag van een niet door de gemeente in stand gehouden school
      dat op grond van [artikel 96j, eerste lid][ref2], aanspraak heeft op een uitkering, een voorschot uit. Het
      voorschot omvat het voorlopig vastgestelde bedrag van de overschrijding, berekend op de wijze als is aangegeven in
      [artikel 96j, eerste en tweede lid][ref3].

      2 Burgemeester en wethouders zijn bevoegd tijdens het vijfjarig tijdvak op verzoek van het bevoegd gezag van een
      niet door de gemeente in stand gehouden school jaarlijks een deel van het naar verwachting uit te betalen voorschot
      in mindering daarop uit te keren.

      3 De bekendmaking van de beschikkingen tot voorlopige en definitieve vaststelling van het overschrijdingsbedrag,
      bedoeld in het zesde onderscheidenlijk zevende lid van [artikel 96i][ref4], behelst tevens een staat van de
      voorzieningen als bedoeld in [artikel 96i, eerste lid, onderdeel i][ref5], waarin per kalenderjaar wordt aangegeven
      het verloop van de toevoegingen en de onttrekkingen aan de voorzieningen.

      4 Het bevoegd gezag van een in het eerste lid bedoelde school kan tegen de in het derde lid bedoelde beschikkingen
      administratief beroep instellen bij gedeputeerde staten.


