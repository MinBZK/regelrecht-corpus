  - number: '32'
    text: |-
      1 Aan een school voor voorbereidend wetenschappelijk onderwijs, algemeen voortgezet onderwijs, voorbereidend
      beroepsonderwijs en praktijkonderwijs zijn een of meer leraren verbonden.

      2 Aan het hoofd van een school voor voorbereidend wetenschappelijk onderwijs staat een rector, aan het hoofd van
      een school voor algemeen voortgezet onderwijs, voorbereidend beroepsonderwijs en praktijkonderwijs een directeur.

      3 De conrectoren en de adjunct-directeuren hebben tot taak de rector onderscheidenlijk de directeur bij te staan en
      bij afwezigheid te vervangen.

      4 Tot rector, directeur, conrector of adjunct-directeur kan slechts worden benoemd dan wel tewerkgesteld zonder
      benoeming hij, die met inachtneming van [artikel 33, eerste lid][ref1], kan worden benoemd tot leraar in een
      van de vakken, die aan de school worden onderwezen. Bij algemene maatregel van bestuur worden voorschriften
      vastgesteld omtrent het aantal door de rector, directeur, conrector of adjunct-directeur ten minste te geven
      lessen en, in verband daarmee, omtrent de toepassing van de derde volzin. Voor ten hoogste de helft van het aantal
      personeelsleden, bestaande uit de rector of de directeur en de aan de school verbonden conrectoren of adjunct-
      directeuren, kan het bevoegd gezag afwijken van de eerste volzin, met uitzondering van het vereiste van de in
      [artikel 33, eerste lid, onder a][ref2], bedoelde verklaring omtrent het gedrag, mits daarbij de voorschriften,
      bedoeld in de tweede volzin, in acht worden genomen.

      5 Het overige personeel heeft tot taak het onderwijs te ondersteunen. Bij benoeming van een lid van het overige
      personeel is [artikel 33, eerste lid, aanhef en onder a][ref3], van overeenkomstige toepassing.

      6 Een of meer leden van het personeel worden belast met de taak van schooldecaan.

      7 Het tweede en derde lid, en het vierde lid met uitzondering van het vereiste van de in
      [artikel 33, eerste lid, onder a][ref4], bedoelde verklaring omtrent het gedrag, zijn niet van toepassing op de
      leden van de centrale directie, bedoeld in [artikel 32a, eerste lid][ref5].

      8 Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van de verschillende categorieën
      personeel van de school. Het bevoegd gezag bepaalt, zoveel mogelijk tegelijk met de vaststelling van het in de
      eerste volzin bedoelde beleid met betrekking tot de formatie, functies en taken van het personeel van de school,
      met inachtneming van de daaromtrent bij algemene maatregel van bestuur te geven nadere voorschriften.

      9 Voor de toepassing van deze paragraaf wordt onder «vakken» tevens verstaan, programma-onderdelen als bedoeld in
      de [artikelen 13][ref6] en [14][ref7].


