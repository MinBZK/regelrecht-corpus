  - number: '23'
    text: |-
      Ten behoeve van de scholen voor middelbaar algemeen voortgezet onderwijs en de scholen voor voorbereidend
      beroepsonderwijs wordt bij algemene maatregel van bestuur een adviesurentabel vastgesteld voor het aantal lessen
      dat gedurende de cursus in elk van de vakken genoemd in de [artikelen 10][ref1], [10b][ref2] en [10d][ref3] of
      in groepen van die vakken ten minste kan worden verzorgd, en het aantal studielessen dat gedurende de cursus ten
      minste kan worden verzorgd. De algemene maatregel van bestuur, bedoeld in de eerste volzin, wordt aan de beide
      Kamers der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging
      zijn verstreken en gedurende die termijn niet door of namens een van beide Kamers de wens wordt te kennen gegeven
      dat het in die maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend
      wetsvoorstel zo spoedig mogelijk ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
