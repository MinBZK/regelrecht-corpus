  - number: '89'
    text: |-
      1 Indien bijzondere ontwikkelingen in het voortgezet onderwijs daartoe aanleiding geven, kunnen bij
      ministeriële regeling voorschriften worden vastgesteld omtrent het verstrekken van aanvullende bekostiging voor
      exploitatiekosten.

      2 Indien bijzondere ontwikkelingen in het voortgezet onderwijs aan een school daartoe aanleiding geven, kan Onze
      minister op verzoek van het bevoegd gezag onder door hem te stellen voorwaarden en voor een door hem te bepalen
      periode aanvullende bekostiging voor exploitatiekosten verstrekken. Het verzoek wordt ingediend in het kalenderjaar
      waarin deze ontwikkelingen zijn aangevangen. Onze minister besluit binnen vier maanden na ontvangst van het
      verzoek. Indien de beschikking niet binnen vier maanden kan worden gegeven, stelt Onze minister de verzoeker
      daarvan in kennis en noemt hij daarbij een termijn waarop de beschikking wel tegemoet kan worden gezien.

      3 Onze minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.

      4 Onze minister kan in verband met de in het tweede lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel89
  - number: 96b
    text: |-
      1 Onverminderd het bepaalde in de [artikelen 76y][ref1] en [96c][ref2] en met inachtneming van het programma
      van eisen, bedoeld in [artikel 80, eerste lid][ref3], verstrekt het Rijk aan het bevoegd gezag van openbare en
      bijzondere scholen het bedrag van de bekostiging ten behoeve van de voorzieningen, bedoeld in [artikel 81][ref4].

      2 In bij algemene maatregel van bestuur aan te wijzen gevallen worden de kosten van de voorzieningen in de
      huisvesting gedurende een bepaalde periode jaarlijks vergoed. De algemene maatregel van bestuur bevat tevens
      voorschriften over de lengte van de periode en de aard van de vergoeding.

      3 In geval van verstrekking van aanvullende bekostiging als bedoeld in [artikel 83][ref5] verstrekt het Rijk aan
      het bevoegd gezag van openbare en bijzondere scholen het bedrag van deze bekostiging.

      4 Het eerste tot en met derde lid zijn slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld
      in [afdeling IV van titel II][ref6].


