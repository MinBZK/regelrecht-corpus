  - number: 96r
    text: |-
      1 Op de bekostiging of onderdelen daarvan kunnen voorschotten worden verleend volgens regels, te stellen bij of
      krachtens algemene maatregel van bestuur.

      2 Bij of krachtens algemene maatregel van bestuur worden tevens voorschriften gegeven voor de verrekening van de
      betaalde voorschotten met het bedrag van de vastgestelde bekostiging of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel96r
  - number: '97'
    text: |-
      1 Het bevoegd gezag van een bijzondere school houdt nauwkeurig boek van de inkomsten en uitgaven.

      2 Het bevoegd gezag van een bijzondere school geeft desverlangd aan de door Onze minister aangewezen ambtenaren de
      boeken en bescheiden ter inzage. Het bevoegd gezag is gehouden deze boeken en bescheiden zeven jaren te bewaren.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel97
  - number: '98'
    text: |-
      1 Het bevoegd gezag is verplicht gebouwen, terreinen en roerende zaken ten behoeve waarvan bekostiging wordt
      genoten, behoorlijk te gebruiken en te onderhouden. Ten behoeve van het onderhoud van gebouwen, terreinen en
      roerende zaken stelt het bevoegd gezag jaarlijks volgens bij algemene maatregel van bestuur te stellen regels een
      onderhoudsprogramma vast.

      2 Het vervreemden door het bevoegd gezag van een school anders dan op grond van [artikel 42c][ref1] of
      [artikel 50][ref2], of het onderwerpen aan enig beperkt recht van gebouwen, terreinen en roerende zaken waarvoor
      bekostiging wordt genoten, is zonder toestemming van Onze minister nietig. Onze minister besluit binnen zes
      maanden na ontvangst van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze
      minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan
      worden gezien.

      3 Het eerste en tweede lid zijn slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld in
      [afdeling IV van titel II][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel42c
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0002399#AfdelingIV
