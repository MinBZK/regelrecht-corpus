  - number: '22'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden voor de scholen voor voorbereidend wetenschappelijk
      onderwijs, algemeen voortgezet onderwijs en voorbereidend beroepsonderwijs voorschriften vastgesteld omtrent de
      inrichting van het onderwijs. Deze voorschriften kunnen per schoolsoort verschillen. Voor de scholen, bedoeld
      in de [artikelen 7][ref1], [8][ref2], [9][ref3] en [10a][ref4], alsmede voor het onderwijs, bedoeld in
      [artikel 11f][ref5], kunnen afzonderlijke voorschriften worden gegeven. De bij deze algemene maatregel van bestuur
      gegeven voorschriften zijn niet van toepassing op scholen en afdelingen voor voorbereidend beroepsonderwijs
      waarvoor [artikel 24, vijfde lid][ref6], wordt toegepast. De algemene maatregel van bestuur, bedoeld in de eerste
      volzin, wordt aan de beide Kamers der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat
      vier weken na de overlegging zijn verstreken en niet door of namens een van beide Kamers de wens wordt te kennen
      gegeven dat het in die maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend
      wetsvoorstel zo spoedig mogelijk ingediend.

      2 De algemene maatregel van bestuur, bedoeld in het eerste lid, houdt voor alle schoolsoorten voorschriften in
      omtrent de tijd die per cursusjaar ten hoogste voor vakantie mag worden besteed, met dien verstande dat begin en
      einde van de zomervakantie kunnen worden voorgeschreven.

      3 De algemene maatregel van bestuur, bedoeld in het eerste lid, kan, naast het bepaalde in het tweede lid, slechts
      voorschriften inhouden omtrent:

      a. voor het middelbaar algemeen voortgezet onderwijs en het voorbereidend beroepsonderwijs, het aantal lessen dat
      gedurende de cursus in vakken of in groepen van vakken ten minste moet worden verzorgd en het aantal studielessen
      dat gedurende de cursus ten minste moet worden verzorgd, alsmede voor het voorbereidend wetenschappelijk onderwijs
      en het hoger algemeen voortgezet onderwijs, het in uren uitgedrukte aantal lessen dat gedurende de cursus in
      lichamelijke opvoeding ten minste moet worden verzorgd,

      b. voor het middelbaar algemeen voortgezet onderwijs en het voorbereidend beroepsonderwijs:

      1°. het aantal lessen dat – behoudens godsdienst- of levensbeschouwelijk vormingsonderwijs aan bijzondere scholen –
      gedurende de cursus mag worden besteed aan het onderwijs in andere, door het bevoegd gezag te kiezen vakken,

      2°. het aantal lessen dat gedurende de cursus in alle vakken te zamen moet worden verzorgd, met inbegrip van de
      studielessen,

      3°. de duur van de lessen en van de studielessen, en

      c. de stage, alsmede de buitenschoolse praktijkcomponent van een leer-werktraject als bedoeld in
      [artikel 10b1][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel9
