  - number: '85'
    text: |-
      1 De vergoeding van de kosten van het in [artikel 84][ref1] bedoelde personeel wordt vastgesteld door de krachtens
      [artikel 84][ref2] vastgestelde formatie te vermenigvuldigen met een gemiddelde personeelslast, met inachtneming
      van ter zake bij of krachtens de in [artikel 84, eerste lid][ref3], bedoelde algemene maatregel van bestuur vast
      te stellen voorschriften. De gemiddelde personeelslast is het genormeerde bedrag van de personele middelen per
      formatieplaats voor elke personeelscategorie, in welk bedrag tevens zijn verwerkt incidentele loonontwikkelingen en
      algemene salarismaatregelen.

      2 Onder de personele middelen worden verstaan de middelen ten behoeve van de salarissen, toelagen, uitkeringen,
      overhevelingstoeslagen en vergoedingen ten behoeve van personeel van de scholen, alsmede de bijdragen tot hun
      pensioen en tot dat van hun nagelaten betrekkingen.

      3 De gemiddelde personeelslast kan per schoolsoort verschillen.

      4 De gemiddelde personeelslast van de personeelscategorie van de leraren wordt per schoolsoort jaarlijks
      vastgesteld met inachtneming van de landelijke gewogen gemiddelde leeftijd van deze personeelscategorie van die
      schoolsoort. De in de eerste volzin bedoelde gemiddelde personeelslast wordt voorts per school gecorrigeerd voor de
      mate waarin de gewogen gemiddelde leeftijd van de personeelscategorie van de leraren van die school afwijkt van de
      desbetreffende in de eerste volzin bedoelde gewogen gemiddelde leeftijd.

      5 Bij ministeriële regeling wordt de gemiddelde personeelslast vastgesteld en worden nadere regels vastgesteld met
      betrekking tot de in het vierde lid bedoelde correctie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel84
