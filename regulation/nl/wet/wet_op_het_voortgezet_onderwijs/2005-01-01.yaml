  - number: '26'
    text: |-
      1 Het bevoegd gezag van een school waar een visueel gehandicapte leerling is ingeschreven of een leerling voor
      wie een leerlinggebonden budget beschikbaar is, stelt in overeenstemming met de ouders voor elk schooljaar een
      handelingsplan op. Indien de inschrijving van de in de eerste volzin bedoelde leerling plaatsvindt op of na 1
      augustus wordt het handelingsplan zo spoedig mogelijk doch uiterlijk een maand na die inschrijving opgesteld.

      2 In het handelingsplan dat betrekking heeft op het laatste schooljaar van de periode gedurende welke voor de
      leerling een leerlinggebonden budget beschikbaar is, wordt aangegeven dat de voortzetting van de voorzieningen die
      voor de leerling zijn getroffen op basis van het leerlinggebonden budget, afhankelijk is van een nieuwe beoordeling
      door een zodanige commissie voor de indicatiestelling.

      3 Het handelingsplan wordt jaarlijks met de ouders geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel26
  - number: '27'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen voor elke soort van scholen of voor afdelingen van die
      scholen voorwaarden voor de toelating en voorschriften omtrent verwijdering en voorwaardelijke bevordering worden
      vastgesteld. De algemene maatregel van bestuur bedoeld in de eerste volzin houdt in elk geval voorschriften in
      met betrekking tot de voorwaarden voor de toelating tot de scholen, bedoeld in de [artikelen 7][ref1], [8][ref2],
      [9][ref3] en [10a][ref4]. Definitieve verwijdering van een leerling waarop de [Leerplichtwet 1969][ref5] van
      toepassing is, vindt niet plaats dan nadat het bevoegd gezag ervoor heeft zorggedragen dat een andere school, dan
      wel een instelling als bedoeld in [artikel 1, onder c, van de Leerplichtwet 1969][ref6] bereid is de leerling toe
      te laten.

      1a Voor het volgen van een vorm van onderwijs als onderscheiden in [artikel 5][ref7] aan een school wordt
      uitsluitend als leerling toegelaten degene waarvan de ouders, voogden of verzorgers aantonen, dan wel, indien hij
      meerderjarig en handelingsbekwaam is, degene die aantoont dat hij:

      a. de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,

      b. vreemdeling is en jonger is dan 18 jaar op de eerste schooldag waarop de vorm van voortgezet onderwijs als
      onderscheiden in [artikel 5][ref8] begint waarvoor voor de eerste maal toelating wordt gewenst,

      c. vreemdeling is, 18 jaar of ouder is op de eerste schooldag waarop de vorm van voortgezet onderwijs als
      onderscheiden in [artikel 5][ref9] begint waarvoor voor de eerste maal toelating wordt gewenst en op die dag
      rechtmatig verblijf houdt in de zin van [artikel 8 van de Vreemdelingenwet 2000][ref10], of

      d. vreemdeling is, niet meer voldoet aan een van de voorwaarden, genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen voor een vorm van voortgezet onderwijs als onderscheiden in [artikel 5][ref11] is
      toegelaten tot een school, welke vorm van voortgezet onderwijs nog steeds wordt gevolgd en nog niet is voltooid.

      1b Indien na de toelating tot de school blijkt dat deze op welke grond dan ook niet in overeenstemming met lid 1a
      heeft plaatsgevonden, wordt de leerling onmiddellijk verwijderd.

      2 De toelating wordt niet afhankelijk gesteld van een andere dan een bij of krachtens de wet geregelde bijdrage.
      Overeenkomsten waarbij ouders worden verplicht tot het betalen van een geldelijke bijdrage zijn nietig, behoudens
      voorzover zij na de toelating van de leerling tot de school schriftelijk zijn aangegaan en in het desbetreffende
      schriftelijke stuk aan de ouders kenbaar is gemaakt dat het een vrijwillige bijdrage betreft waarvoor de
      overeenkomst niet behoeft te worden aangegaan, doch waarvoor geldt dat na de ondertekening wel een verplichting
      tot betaling van de overeengekomen bijdrage bestaat. Zodanige overeenkomsten zijn evenzeer nietig, indien deze niet
      hebben voorzien in de vermelding dat de ouders de mogelijkheid hebben er voor te kiezen om de overeenkomst slechts
      voor bepaalde voorzieningen aan te gaan en ten behoeve daarvan niet een specificatie voor de te onderscheiden
      voorzieningen in de overeenkomst is opgenomen. Zodanige overeenkomsten zijn voorts nietig indien ten aanzien
      daarvan geen reductie- en kwijtscheldingsregeling geldt en de inhoud van die regeling niet in de overeenkomst is
      opgenomen. Een overeenkomst wordt telkens voor de periode van een schooljaar aangegaan.

      3 Een leerling mag na vijf jaren te rekenen vanaf het ogenblik dat hij is aangevangen met voortgezet onderwijs,
      geen onderwijs meer volgen aan een school voor middelbaar algemeen voortgezet onderwijs, aan een school voor
      voorbereidend beroepsonderwijs en in de eerste drie leerjaren van een school voor hoger algemeen voortgezet
      onderwijs of voorbereidend wetenschappelijk onderwijs. Indien een leerling na 31 januari van het schooljaar
      aanvangt met voortgezet onderwijs, eindigt het vijfde jaar op 31 juli van het schooljaar waarin de periode
      van vijf jaren verstrijkt. Een leerling mag geen praktijkonderwijs meer volgen aan een school of afdeling voor
      praktijkonderwijs na afloop van het schooljaar waarin hij de leeftijd van achttien jaren heeft bereikt. Op een
      daartoe strekkend verzoek van het bevoegd gezag, gedaan in het in de derde volzin bedoelde schooljaar, kan de
      inspectie toestaan dat de leerling het daaropvolgende schooljaar praktijkonderwijs kan blijven volgen, indien zij
      van mening is dat zonder het volgen van dit schooljaar de leerling niet voldoende is voorbereid op de functies,
      bedoeld in [artikel 10f, derde lid, derde volzin][ref12]. De inspectie kan de vierde volzin op overeenkomstige
      wijze toepassen in het schooljaar waarin de leerling de leeftijd van 19 jaren heeft bereikt.

      4 Het derde lid is niet van toepassing op scholen voor voorbereidend beroepsonderwijs die zijn aangewezen op grond
      van [artikel 24, vijfde lid][ref13], voor zover het onderwijs bestemd is voor gehandicapte leerlingen.

      5 Op een daartoe strekkend verzoek van het bevoegd gezag, gedaan in het vijfde jaar van de periode,
      genoemd in het derde lid, kan de inspectie die periode met ten hoogste een jaar verlengen ten behoeve
      van een leerling die voorafgaand aan het voortgezet onderwijs geen basisonderwijs als bedoeld in de
      [Wet op het primair onderwijs][ref14], of speciaal onderwijs dan wel voortgezet speciaal onderwijs als bedoeld in
      de [Wet op de expertisecentra][ref15] heeft gevolgd en die voldoet aan de volgende vereisten:

      a. hij heeft bij het begin van het vijfde jaar van die periode de leeftijd van 18 jaren nog niet bereikt, en

      b. hij volgt onderwijs aan een school voor voorbereidend beroepsonderwijs of aan een school voor middelbaar
      algemeen voortgezet onderwijs.

      6 Op een daartoe strekkend verzoek van het bevoegd gezag, gedaan in het vijfde jaar van de periode, genoemd in het
      derde lid, kan de inspectie die periode met ten hoogste een jaar verlengen ten behoeve van een leerling die voldoet
      aan de volgende vereisten:

      a. hij heeft in de eerste vier jaren van de periode van vijf jaren vanwege langdurige ziekte of vanwege bijzondere,
      van de wil van die leerling onafhankelijke omstandigheden meer dan 12 maanden het onderwijs niet kunnen volgen,
      dan wel

      b. hij heeft in het vijfde jaar vanwege langdurige ziekte of ten gevolge van bijzondere, van de wil van die
      leerling onafhankelijke omstandigheden lange tijd het onderwijs niet kunnen volgen, en

      c. hij volgt onderwijs aan een school voor voorbereidend beroepsonderwijs of aan een school voor middelbaar
      algemeen voortgezet onderwijs.

      7 De inspectie willigt een verzoek, bedoeld in het vijfde en zesde lid, slechts in indien zij verwacht dat de
      leerling:

      a. niet in staat zal zijn in dat vijfde jaar de opleiding met goed gevolg te voltooien, en

      b. in de periode van de verlenging wel in staat zal zijn de opleiding met goed gevolg te voltooien.

      8 Het vijfde en zesde lid kunnen niet tegelijkertijd worden toegepast ten aanzien van dezelfde leerling.

      9 Indien het verzoek, bedoeld in het vijfde of zesde lid, een leerling betreft die leerwegondersteunend onderwijs
      volgt op basis van een beschikking van de regionale verwijzingscommissie, willigt de inspectie dat verzoek niet in
      dan nadat zij kennis heeft genomen van een recent op de desbetreffende leerling betrekking hebbend handelingsplan,
      bedoeld in [artikel 10e, zesde lid][ref16], juncto [artikel 10g, vierde lid][ref17].

      10 Onverminderd het vijfde tot en met achtste lid, kan de inspectie, volgens bij of krachtens algemene maatregel
      van bestuur vast te stellen voorschriften, op een daartoe strekkend verzoek van het bevoegd gezag, ten aanzien van
      een leerling op individuele basis de verblijfsduur met een jaar verlengen, voor zover toepassing van het derde lid,
      eerste en tweede volzin, gelet op het belang van de leerling zal leiden tot een onbillijkheid van overwegende aard.

      11 Bij algemene maatregel van bestuur kunnen, in afwijking van de [artikelen 7:10][ref18] en
      [7:24 van de Algemene wet bestuursrecht][ref19] (Stb. 1992, 315), kortere termijnen dan in de artikelen vermeld,
      worden bepaald voor het op een bezwaar- of beroepschrift te nemen besluit van het bevoegd gezag van een openbare
      school ter zake van de toelating en verwijdering van leerlingen.


