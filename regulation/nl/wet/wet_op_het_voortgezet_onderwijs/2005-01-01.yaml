  - number: '65'
    text: |-
      1 Onze Minister van Onderwijs, Cultuur en Wetenschap stelt na overleg met de daarvoor in aanmerking komende
      organisaties en, voor zover het betreft het landbouwonderwijs, in overleg met Onze Minister van Landbouw, Natuur
      en Voedselkwaliteit, jaarlijks een plan van scholen vast, die in de drie kalenderjaren, volgende op het jaar van
      de vaststelling voor bekostiging uit 's Rijks kas in aanmerking zullen worden gebracht. Dit plan heeft ten doel te
      komen tot een evenwichtig geheel van onderwijsvoorzieningen naar soort van onderwijs, mede gelet op het verlangde
      onderwijs in het betrokken gebied. Op het plan worden uitsluitend scholen geplaatst waarover overleg heeft plaats
      gevonden met de in de eerste volzin bedoelde organisaties.

      2 Het ontwerp van het Plan van Scholen wordt jaarlijks voor 1 september bekendgemaakt in het officiële
      publicatieblad van het Ministerie van Onderwijs, Cultuur en Wetenschap en aan de Tweede Kamer der Staten-Generaal
      overgelegd. Het plan wordt niet vastgesteld dan nadat vier weken na de bekendmaking en overlegging zijn verstreken
      en gedurende die termijn niet door of namens de Kamer de wens te kennen wordt gegeven dat over dat ontwerp overleg
      gewenst wordt. De vaststelling van het Plan van Scholen geschiedt voor 1 oktober, volgend op de datum van de
      bekendmaking van het ontwerp.

      3 Bij de samenstelling van het plan wordt uitgegaan van de verzoeken en de deelplannen, bedoeld in
      [artikel 66][ref1].

      4 Indien een bijzondere school wordt opgericht, die niet in het plan is opgenomen, komt deze school niet voor
      bekostiging uit 's Rijks kas in aanmerking gedurende ten minste drie kalenderjaren, volgende op het jaar van de
      oprichting, tenzij [artikel 69][ref2] of [artikel 72][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel65
    references:
      - id: ref1
