  - number: '64'
    text: |-
      1 In deze afdeling wordt onder school verstaan:

      a. een school als bedoeld in [afdeling I van titel II][ref1],

      b. een afdeling, als bedoeld in de [artikelen 8, eerste lid, onderdeel b][ref2], en [10f, eerste lid][ref3], en

      c. een afdeling voor voorbereidend beroepsonderwijs als bedoeld in [artikel 10c][ref4].

      2 De [artikelen 65 tot en met 74][ref5] zijn niet van toepassing:

      a. op cursussen;

      b. indien twee of meer uit de openbare kas bekostigde scholen, als bedoeld in [afdeling I][ref6] van titel II,
      worden verenigd tot een lyceum of tot een scholengemeenschap, tenzij het derde lid van toepassing is;

      c. bij omzetting van een bekostigde bijzondere school in een gelijksoortige openbare school of omgekeerd, bij
      omzetting van een bekostigde bijzondere school in een gelijksoortige bijzondere school van een andere richting en
      bij uitbreiding van het onderwijs aan een school met onderwijs van een of meer andere richtingen.

      3 De [artikelen 65 tot en met 74][ref7] zijn van overeenkomstige toepassing met betrekking tot een bekostigde
      school waarvoor Onze minister de toestemming, bedoeld in [artikel 75, derde lid][ref8], niet heeft verleend.

      3a In afwijking van het bepaalde in het derde lid zijn gedurende de schooljaren 1993/1994, 1994/1995 en 1995/1996
      de [artikelen 65 tot en met 74][ref9] van overeenkomstige toepassing met betrekking tot een bekostigde school die
      ten aanzien van een splitsing of verplaatsing niet in het overzicht, bedoeld in [artikel 75a, vierde lid][ref10],
      is opgenomen.

      4 De bekostiging uit de openbare kas van een school neemt geen aanvang dan krachtens de bepalingen van deze
      afdeling.

      5 Voor het bij of krachtens deze afdeling bepaalde, treden voor de toepassing van de
      [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref11] (Stb. 1992, 315) de in [artikel 65][ref12] bedoelde
      organisaties in de plaats van het bevoegd gezag.

      6 [Artikel 4:32 van de Algemene wet bestuursrecht][ref13] is niet van toepassing op de bekostiging van scholen.


