  - number: 76g
    text: |-
      De gemeenteraad stelt gelijktijdig met het programma, bedoeld in [artikel 76f][ref1], ten behoeve van het onderwijs
      op het grondgebied van de gemeente voor een door hem te bepalen tijdstip een overzicht vast van die voorzieningen
      die zijn aangevraagd dan wel nodig zijn, die niet op het programma zijn opgenomen. Daarbij wordt aangegeven waarom
      de desbetreffende voorzieningen niet zijn opgenomen. Het overzicht wordt ter inzage gelegd. Het overzicht heeft
      betrekking op scholen als bedoeld in [artikel 76d, eerste lid, onderdelen a tot en met e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel76f
