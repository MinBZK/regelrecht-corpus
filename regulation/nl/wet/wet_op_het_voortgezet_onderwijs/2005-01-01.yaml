  - number: '35'
    text: |-
      1 Het bezit van een bewijs van bekwaamheid van de eerste graad voor het desbetreffende vak of de combinatie
      van vakken is vereist voor het geven van onderwijs in de hoogste drie leerjaren van scholen voor voorbereidend
      wetenschappelijk onderwijs, in de hoogste twee leerjaren van scholen voor hoger algemeen voortgezet onderwijs, in
      afdelingen, als bedoeld in [artikel 8, eerste lid][ref1].

      2 Het bezit van een bewijs van bekwaamheid van de tweede graad voor het desbetreffende vak of de combinatie
      van vakken is vereist voor het geven van onderwijs in de laagste drie leerjaren van scholen voor voorbereidend
      wetenschappelijk onderwijs en van scholen voor hoger algemeen voortgezet onderwijs, aan scholen voor
      middelbaar algemeen voortgezet onderwijs, aan scholen voor voorbereidend beroepsonderwijs en aan scholen voor
      praktijkonderwijs.

      3 Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de vereisten voor het geven van
      onderwijs aan daarbij aan te geven schoolsoorten en in daarbij aan te geven vakken of combinaties van vakken,
      waarbij van het bepaalde in het eerste en tweede lid wordt afgeweken.

      4 Een bewijs van bekwaamheid van de eerste graad geldt tevens als bewijs van bekwaamheid van de tweede graad voor
      het vak of de combinaties van vakken, waarop dat bewijs van bekwaamheid betrekking heeft, en voor bij algemene
      maatregel van bestuur aan te wijzen andere vakken of combinaties van vakken.

      5 De algemene maatregel van bestuur, bedoeld in het derde en vierde lid, wordt aan de Tweede Kamer der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na overlegging zijn verstreken, en
      gedurende die termijn niet door of namens de Kamer de wens wordt te kennen gegeven tot overleg over het onderwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel8
