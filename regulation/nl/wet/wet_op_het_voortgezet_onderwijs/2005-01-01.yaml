  - number: '106'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent:

      a. de inrichting van de boekhouding van bijzondere scholen,

      b. de wijze waarop door het bevoegd gezag verslag wordt gedaan van het financieel beheer van de school,

      c. de vaststelling door het bevoegd gezag van een begroting en een jaarrekening, alsmede de inrichting daarvan, en

      d. de controle van de boekhouding en de administratie van de scholen.

      2 Bij algemene maatregel van bestuur worden voorschriften gegeven omtrent de erkenning van godsdienstige of
      levensbeschouwelijke bezwaren tegen het sluiten van een verzekering.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven ter uitvoering van
      deze afdeling.

      4 Indien een beschikking niet binnen de bij of krachtens de algemene maatregel van bestuur, bedoeld in dit artikel,
      gestelde termijn kan worden gegeven, stelt Onze minister de aanvrager daarvan in kennis en noemt hij daarbij een
      termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel106
  - number: '107'
    text: |-
      1 Een openbare school voor m.a.v.o., een openbare school voor h.a.v.o., een openbaar atheneum, of een openbaar
      gymnasium wordt opgeheven en de aanspraak op bekostiging ten behoeve van een zodanige bijzondere school gaat
      verloren, indien de school gedurende drie achtereenvolgende schooljaren telkens is bezocht door minder dan 240
      leerlingen.

      2 Een openbare school voor voorbereidend beroepsonderwijs wordt opgeheven en de aanspraak op bekostiging ten
      behoeve van een zodanige bijzondere school gaat verloren:

      a. voor zover het betreft een school voor voorbereidend beroepsonderwijs met één of meer afdelingen uit één,
      twee of drie van de sectoren, bedoeld in [artikel 10c][ref1], indien de school gedurende drie achtereenvolgende
      schooljaren telkens is bezocht door minder dan 240 leerlingen,

      b. voor zover het betreft een school voor voorbereidend beroepsonderwijs met één of meer afdelingen uit alle vier
      sectoren, bedoeld in [artikel 10c][ref2], indien de school gedurende drie achtereenvolgende schooljaren telkens is
      bezocht door minder dan 360 leerlingen.

      3 Een openbaar lyceum wordt opgeheven en de aanspraak op bekostiging ten behoeve van een bijzonder lyceum gaat
      verloren, indien de school gedurende drie achtereenvolgende schooljaren telkens is bezocht door minder dan 300
      leerlingen.

      4 Indien één op het basisonderwijs aansluitende school deel uitmaakt van een scholengemeenschap is het bepaalde
      in het eerste, tweede, dan wel derde lid op die school van toepassing. Indien twee of meer op het basisonderwijs
      aansluitende openbare scholen deel uitmaken van een scholengemeenschap, worden al deze op het basisonderwijs
      aansluitende scholen opgeheven en gaat de aanspraak op bekostiging ten behoeve van al deze op het basisonderwijs
      aansluitende bijzondere scholen verloren, indien de scholen gedurende drie achtereenvolgende schooljaren telkens
      zijn bezocht door minder dan gemiddeld 30 leerlingen per leerjaar per school. Voor de toepassing van de tweede
      volzin wordt:

      a. een lyceum beschouwd als een school met 10 leerjaren,

      b. een school voor voorbereidend beroepsonderwijs met afdelingen uit twee of drie van de sectoren, bedoeld in
      [artikel 10c][ref3], beschouwd als een school met 8 leerjaren en

      c. een school voor voorbereidend beroepsonderwijs met afdelingen uit alle vier sectoren, bedoeld in
      [artikel 10c][ref4], beschouwd als een school met 12 leerjaren.

      5 Voor wat betreft de afdelingen van scholen voor voorbereidend beroepsonderwijs, wordt een afdeling opgeheven
      en gaat de aanspraak op bekostiging ten behoeve van een afdeling van een bijzondere school verloren, indien de
      afdeling in een leerjaar voorafgaande aan het laatste leerjaar gedurende twee achtereenvolgende jaren door geen
      leerlingen is bezocht.

      6 Een afdeling van een openbare school voor voorbereidend beroepsonderwijs wordt niet opgeheven en de aanspraak op
      bekostiging ten behoeve van een afdeling van een bijzondere school voor voorbereidend beroepsonderwijs gaat niet
      verloren vanwege het overeenkomstig [artikel 10b, negende lid][ref5], of [10d, negende lid][ref6], verzorgen van
      een of meer intrasectorale programma's.

      7

      8

      9

      10 Indien scholen die onderdeel van een scholengemeenschap vormen, of afdelingen door het bevoegd gezag worden
      opgeheven, worden deze voor de toepassing van het tweede lid geacht niet te bestaan, met ingang van de datum
      waarop de uitvoering van het besluit van het bevoegd gezag een aanvang neemt. Leerlingen die een nog niet opgeheven
      tweede leerjaar bezoeken, dat tevens het tweede leerjaar is van een of meer scholen van een scholengemeenschap of
      afdelingen van een school of scholengemeenschap, die niet wordt opgeheven, worden geheel toegerekend aan dat deel
      van de school of scholengemeenschap, dat niet wordt opgeheven. Het bepaalde in de voorgaande volzinnen is tevens
      van toepassing, indien de opheffing het gevolg is van het bepaalde in de laatste volzin van het tweede of vierde
      lid.


