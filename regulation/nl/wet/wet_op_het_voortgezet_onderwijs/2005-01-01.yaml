  - number: 39c
    text: |-
      1 Het bevoegd gezag is verplicht aan studenten die in opleiding zijn voor een functie in het voortgezet onderwijs,
      in de educatie of het beroepsonderwijs, bedoeld in de [Wet educatie en beroepsonderwijs][ref1], in het hoger
      beroepsonderwijs of in het basisonderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste
      ervaring in de school te verkrijgen.

      2 De verplichting, bedoeld in het eerste lid, betreft studenten die zijn ingeschreven voor een opleiding voor het
      beroep van leraar waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] betrekking heeft, of
      anderszins studeren voor een bewijs van voldoende pedagogische en didactische voorbereiding.

      3 Het in uren uitgedrukte aantal lessen en onderdelen van het in schooltijd verzorgd onderwijsprogramma waarvoor
      het bevoegd gezag in enig schooljaar verplicht is, studenten als bedoeld in het eerste lid tot de school toe te
      laten, bedraagt gezamenlijk 5 procent van het in uren uitgedrukte totale aantal in dat schooljaar te geven lessen
      en te verzorgen onderdelen van het in schooltijd verzorgd onderwijsprogramma. Onze minister kan het percentage
      lager stellen.

      4 Een bevoegd gezag kan een student de verdere toegang tot de school ontzeggen, indien deze in de school in strijd
      handelt met de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot
      de school wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van de
      betrokken opleidingsinstelling dan wel aan de betrokken staatsexamencommissie, en aan de inspectie.

      5 De rector of de directeur dan wel de centrale directie regelt, onder verantwoordelijkheid van het bevoegd gezag,
      de werkzaamheden in verband met de begeleiding door de leraren van de studenten in de school in overeenstemming
      met de leraren, alsmede in overeenstemming met de betrokken opleidingsinstellingen, dan wel, indien het betreft
      studenten die zich voorbereiden op het afleggen van een staatsexamen ter verkrijging van een bewijs van bekwaamheid
      of een bewijs van voldoende pedagogische en didactische voorbereiding, in overeenstemming met de betrokken
      staatsexamencommissie.

      6 Onze minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor een schooljaar.

      7 De scholen waarop studenten als bedoeld in het eerste lid, zijn toegelaten, zijn toegankelijk voor de inspectie
      belast met het toezicht op de opleidingsinstellingen, voor de directieleden en de door deze aan te wijzen docenten
      van die opleidingsinstellingen, alsmede voor de leden van de betrokken staatsexamencommissies, een en ander voor
      zover zulks voor de uitoefening van het toezicht op de praktische vorming onderscheidenlijk de begeleiding van de
      praktische vorming van de in de school aanwezige studenten noodzakelijk is.

      8 Bij of krachtens algemene maatregel van bestuur worden in verband met het bepaalde in dit artikel nadere
      voorschriften gegeven, betreffende de navolgende onderwerpen:

      a. het maximum aantal lessen in een vak van een schoolsoort, gedurende dewelke het bevoegd gezag in enig schooljaar
      verplicht is studenten als bedoeld in het eerste lid, toe te laten, welk maximum de 20 procent niet te boven mag
      gaan;

      b. het maximum aantal studenten als bedoeld in het eerste lid, dat bij dezelfde les kan worden toegelaten, welk
      maximum, behoudens bijzondere omstandigheden, de 3 niet te boven mag gaan, alsmede de gevolgen die het toelaten van
      meer dan een student bij dezelfde les heeft voor het maximum, bedoeld in het derde lid, en het maximum, bedoeld in
      dit lid onder a.

      9 Bij of krachtens algemene maatregel van bestuur kunnen in verband met het bepaalde in dit artikel nadere
      voorschriften worden gegeven, betreffende de navolgende onderwerpen:

      a. de wijze van aanmelden van studenten als bedoeld in het eerste lid, alsmede de termijn die voor de aanmelding
      door het bevoegd gezag mag worden gesteld;

      b. de wijze waarop door de school bekendheid moet worden gegeven aan opleidingsinstellingen en
      staatsexamencommissies over de beschikbaarheid en de aard van schoolpracticumplaatsen;

      c. de categorieën studenten ten aanzien van wie de verplichting, bedoeld in het eerste lid, niet geldt;

      d. regulering in de situatie dat, bij een beperkte beschikbaarheid van schoolpracticumplaatsen aan de school,
      gelijktijdig studenten die in opleiding zijn voor een functie in het voortgezet onderwijs, en studenten die in
      opleiding zijn voor een functie in het basisonderwijs, worden aangemeld;

      e. de vakken en andere programma-onderdelen van een schoolsoort, waarvoor in verband met de geringe omvang van het
      onderwijs daarin, de in het eerste lid bedoelde verplichting niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0005682
