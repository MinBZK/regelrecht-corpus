  - number: 10b4
    text: |-
      1 Het bedrijf dat of de organisatie die het buitenschoolse gedeelte verzorgt, draagt zorg voor de begeleiding van
      de leerlingen binnen het bedrijf respectievelijk de organisatie.

      2 De landelijke organen voor het beroepsonderwijs dragen zorg voor een regelmatige beoordeling van bedrijven en
      organisaties die het buitenschoolse praktijkgedeelte verzorgen, aan de hand van de eisen in [artikel 10b6][ref1].
      De landelijke organen dragen gezamenlijk zorg voor openbaarmaking van een overzicht van bedrijven en
      organisaties met een gunstige beoordeling op grond van de eerste volzin. Tot het verzorgen van het buitenschoolse
      praktijkgedeelte zijn uitsluitend bevoegd de bedrijven en organisaties met een gunstige beoordeling op grond van
      die volzin.

      3 Indien het bevoegd gezag na het sluiten van de leer-werkovereenkomst vaststelt dat de praktijkplaats niet of niet
      volledig beschikbaar is, de begeleiding tekortschiet of ontbreekt, of sprake is van andere omstandigheden die maken
      dat het buitenschoolse praktijkgedeelte niet naar behoren zal kunnen worden verzorgd, bevordert het bevoegd gezag,
      na overleg met het bestuur van het desbetreffende landelijk orgaan voor het beroepsonderwijs, dat een toereikende
      vervangende voorziening beschikbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b6
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel10b4
