  - number: '43'
    text: |-
      In afwijking van [artikel 39][ref1] leggen Gedeputeerde Staten van de desbetreffende provincie de disciplinaire
      straf of de schorsing op of verlenen zij het ontslag, indien het betreft een rector, een directeur, een conrector,
      een adjunct-directeur, een lid van de centrale directie of een leraar van een openbare school, die tevens lid van
      de raad der gemeente is, welke die school in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel39
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '39'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 43a
    text: |-
      1 De rector, de directeur, de conrectoren, de adjunct-directeuren, de leden van de centrale directie, de leraren en
      het overige personeel, bedoeld in [artikel 38a][ref1], van de openbare school, zijn in het bezit van een door het
      bevoegd gezag getekende akte van aanstelling. De akte van aanstelling bevat ten minste:

      a. de naam en het adres van het bevoegd gezag;

      b. de naam, de voornamen en de geboortedatum van de betrokkene;

      c. de datum van ingang van de aanstelling;

      d. de functie waarin de betrokkene wordt aangesteld;

      e. de bepaling of de aanstelling in vaste of in tijdelijke dienst geschiedt en in het laatste geval de gronden voor
      de tijdelijkheid en de duur van de aanstelling;

      f. de omvang van de betrekking;

      g. de op de dag van zijn aanstelling van toepassing zijnde schaal en het salarisnummer;

      h. de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag.

      2 Het bevoegd gezag draagt zorg dat afschriften van de bewijzen van bekwaamheid, van de verklaringen omtrent het
      gedrag, alsmede van de akte van aanstelling van het aan de school verbonden personeel worden bewaard.

      3 Het tweede lid is van overeenkomstige toepassing op personeel dat is tewerkgesteld zonder aanstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel38a
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel43a
