  - number: 103d
    text: |-
      1 De Informatie Beheer Groep verstrekt uit het basisregister onderwijs, bedoeld in
      [artikel 9a van de Wet verzelfstandiging Informatiseringsbank][ref1], aan Onze minister de gegevens die Onze
      minister nodig heeft voor de bekostiging van scholen en de begrotings- en beleidsvoorbereiding. Voorzover de door
      het bevoegd gezag aan de Informatie Beheer Groep verstrekte gegevens naar het oordeel van Onze minister onjuist of
      onvolledig zijn, kan Onze minister ten behoeve van de vaststelling van de bekostiging van deze gegevens afwijken.
      De Informatie Beheer Groep neemt in dat geval de door Onze minister vastgestelde gewijzigde gegevens op in het
      basisregister onderwijs, nadat het desbetreffende besluit tot vaststelling van de bekostiging onherroepelijk is
      geworden.

      2 De Informatie Beheer Groep verstrekt uit het basisregister onderwijs, bedoeld in
      [artikel 9a van de Wet verzelfstandiging Informatiseringsbank][ref2], aan de inspectie de gegevens die de inspectie
      nodig heeft voor het toezicht op het voortgezet onderwijs.

      3 Onverminderd [artikel 103c, derde lid][ref3], worden de gegevens, bedoeld in het eerste en het tweede lid, op een
      zodanige wijze verstrekt, dat de leerlingen niet geïdentificeerd of identificeerbaar zijn. Bij algemene maatregel
      van bestuur worden regels gesteld omtrent het verstrekken van de gegevens. Daarbij worden in ieder geval regels
      gesteld omtrent de inhoud en de samenstelling van de gegevens, de wijze waarop de gegevens worden verstrekt, de
      tijdstippen waarop de gegevens worden verstrekt, en de perioden waarop de gegevens betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel9a
