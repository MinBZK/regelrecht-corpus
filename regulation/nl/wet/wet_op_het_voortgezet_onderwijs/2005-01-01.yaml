  - number: 96g1
    text: |-
      1 Indien de gemeenteraad ten aanzien van een of meer door de gemeente in stand gehouden openbare scholen besluit
      dat deze met ingang van een datum die is gelegen in de periode die aanvangt met een bij koninklijk besluit te
      bepalen datum en eindigt met ingang van het zevende schooljaar daaropvolgend, in stand zullen worden gehouden door
      een of meer andere rechtspersonen dan de gemeente, kan de regeling, bedoeld in [artikel 96g, eerste lid][ref1],
      dan wel de regeling, bedoeld in [artikel 96h, eerste lid][ref2], bij effectuering van dat besluit ten aanzien van
      die scholen en in afwijking van [artikel 96g, tweede lid][ref3], dan wel een regeling op grond van dit artikel
      bij effectuering van dat besluit ten aanzien van die scholen, erin voorzien dat door de gemeente aan een of meer
      andere rechtspersonen dan de gemeente die die scholen in stand houden, een vergoeding voor administratie, beheer en
      bestuur wordt toegekend als aangegeven in het tweede lid.

      2 De vergoeding, die op grond van het eerste lid kan worden toegekend, bedraagt gedurende het eerste en het
      tweede schooljaar volgend op het tijdstip waarop de scholen, bedoeld in het eerste lid, niet langer door de
      gemeente in stand worden gehouden, maximaal 4 maal 18% van de vergoeding voor de exploitatiekosten, op grond van
      [artikel 86][ref4], en gedurende het derde, vierde en het vijfde schooljaar maximaal 3 maal 18% van die vergoeding.

      3 Indien de gemeenteraad besluit scholen niet langer in stand te houden vanaf een andere datum dan 1 augustus
      dan geldt als het eerste schooljaar, bedoeld in het tweede lid, het deel van het schooljaar dat volgt op de datum
      waarop de gemeente die scholen niet langer in stand houdt en bedraagt de vergoeding die voor dat eerste schooljaar
      maximaal kan worden toegekend voor administratie, beheer en bestuur een evenredig deel van de vergoeding die op
      grond van het tweede lid maximaal kan worden toegekend.

      4 Voor de toepassing van het tweede lid wordt per school uitgegaan van de vergoeding voor exploitatiekosten voor
      het schooljaar direct voorafgaand aan het tijdstip waarop door de gemeente de desbetreffende school niet langer in
      stand wordt gehouden.

      5 De op grond van het eerste lid toe te kennen vergoeding kan in een schooljaar niet hoger zijn dan de in het
      daaraan voorafgaande schooljaar op grond van dit artikel toegekende vergoeding. De eerste volzin is niet van
      toepassing ten aanzien van de vergoeding voor het tweede schooljaar indien de vergoeding voor het eerste schooljaar
      is bepaald op grond van het derde lid. Bij de toepassing van de eerste volzin blijft het teruggestorte bedrag,
      bedoeld in het zevende lid, buiten beschouwing.

      6 Het bevoegd gezag dat een school als bedoeld in het eerste lid in stand houdt die voor die tijd door de gemeente
      in stand werd gehouden, legt aan die gemeente en aan de andere rechtspersonen die een of meer niet door de gemeente
      in stand gehouden scholen in die gemeente in stand houden, jaarlijks een verklaring van een accountant als bedoeld
      in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref5] over met betrekking tot de uitgaven en
      ontvangsten voor administratie, beheer en bestuur.

      7 Voor zover voor een school als bedoeld in het eerste lid, de vergoeding, bedoeld in het eerste lid, vermeerderd
      met 18% van de vergoeding voor de exploitatiekosten, op grond van [artikel 86][ref6], in een schooljaar niet
      volledig is aangewend voor uitgaven voor administratie, beheer en bestuur, wordt het verschil door het bevoegd
      gezag, bedoeld in het zesde lid, teruggestort in de gemeentekas.


