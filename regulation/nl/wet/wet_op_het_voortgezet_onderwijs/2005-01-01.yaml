  - number: '61'
    text: |-
      De door Ons aan te wijzen inrichtingen voor voortgezet onderwijs, bedoeld in [artikel 5, onderdeel e][ref1], kunnen
      volgens bij algemene maatregel van bestuur te stellen regels door het Rijk worden bekostigd. Een belanghebbende kan
      beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State tegen besluiten ten aanzien waarvan in
      de algemene maatregel van bestuur ingevolge de vorige volzin de [artikelen 76z][ref2], [105][ref3] en [111][ref4]
      van overeenkomstige toepassing zijn verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel5
