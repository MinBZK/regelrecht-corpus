  - number: '73'
    text: |-
      Zodra de bekostiging van een in het plan opgenomen school een aanvang kan nemen, beslist Onze minister bij
      beschikking, met ingang van welk tijdstip dit kan geschieden.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel73
  - number: '74'
    text: |-
      1 De bekostiging vangt in elk geval aan, nadat de school vijf achtereenvolgende jaren in het plan is opgenomen.

      2 Ten aanzien van een school, die ingevolge [artikel 72][ref1] voor het eerst in het plan wordt opgenomen, vangt
      deze termijn aan in het jaar, waarin het beroep werd ingesteld, en ten aanzien van een school, die ingevolge dat
      artikel weer in het plan wordt opgenomen, in het jaar, waarin de school voor het eerst in het plan werd opgenomen.

      3 De aanspraak op bekostiging vervalt, indien de voorgenomen oprichting van de desbetreffende school niet is
      verwezenlijkt binnen twee jaren na het jaar, waarin de bekostiging een aanvang had kunnen nemen, tenzij Onze
      minister in bijzondere gevallen anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '72'
        afdeling: I
  - number: '75'
    text: |-
      1 Onze minister kan, de daarvoor in aanmerking komende organisaties gehoord, onder door hem te stellen voorwaarden
      voor bekostiging in aanmerking brengen een school die wordt opgericht door middel van een omzetting, als bedoeld in
      [artikel 64, tweede lid, onder c][ref1].

      2 Onze minister kan, de daarvoor in aanmerking komende organisaties gehoord, toestaan dat een bekostigde school
      wordt gesplitst of een andere plaats van vestiging krijgt. Onze minister kan aan zijn toestemming voorwaarden
      verbinden.

      3 Naar aanleiding van een verzoek op grond van het eerste lid, betreffende de omzetting van een openbare school in
      een gelijksoortige bijzondere school, of een verzoek op grond van het tweede lid, betreffende de verplaatsing van
      een openbare school, stellen gedeputeerde staten vast of voldoende zal zijn voorzien in de behoefte aan openbaar
      onderwijs in een genoegzaam aantal scholen, indien Onze Minister in het verzoek zou toestemmen. Gedeputeerde staten
      kunnen de gemeente binnen zes maanden nadat het verzoek te hunner kennis is gebracht opdragen het zodanige verzoek
      in te trekken, indien de ouders, voogden en verzorgers van een naar hun oordeel voldoend aantal leerlingen hiertoe
      de wens hebben te kennen gegeven en de gemeente daaraan niet heeft voldaan.

      4 Voor zover het gaat om scholen waaraan op het basisonderwijs aansluitend voortgezet onderwijs wordt gegeven en
      de verzoeken op grond van het eerste en tweede lid, betrekking hebben op de schooljaren 1993/1994, 1994/1995 en
      1995/1996 is [artikel 75a][ref2] van toepassing.

      5 Onze minister kan op grond van bijzondere omstandigheden met ingang van 1 augustus 1996, de daarvoor in
      aanmerking komende organisaties gehoord, onder door hem te stellen voorwaarden een nevenvestiging voor bekostiging
      in aanmerking brengen.

      6 Onze minister besluit binnen tien maanden na ontvangst van een aanvraag tot omzetting, splitsing of verplaatsing.
      Indien de beschikking niet binnen tien maanden kan worden gegeven, stelt Onze minister de aanvrager daarvan in
      kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel75a
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel75
