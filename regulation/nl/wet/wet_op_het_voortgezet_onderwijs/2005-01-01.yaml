  - number: 27b
    text: |-
      1 Onverminderd bij algemene maatregel van bestuur gegeven voorschriften met betrekking tot de in- en uitschrijving
      van leerlingen, vindt toelating van een leerling als bedoeld in [artikel 27][ref1] slechts plaats nadat door de
      ouders, voogden of verzorgers of, indien de leerling meerderjarig is, door de leerling de gegevens betreffende
      de geslachtsnaam, de voorletters, de geboortedatum, het geslacht en het persoonsgebonden nummer van de leerling
      zijn overgelegd. Indien door de ouders, voogden of verzorgers of, indien de leerling meerderjarig is, door de
      leerling aannemelijk wordt gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, vindt de
      toelating plaats met inachtneming van het derde lid.

      2 De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt
      document dan wel een door een andere school of een school of instelling voor ander onderwijs verstrekt bewijs van
      uitschrijving, waarin de desbetreffende gegevens zijn opgenomen.

      3 Indien door de ouders, voogden of verzorgers of, indien de leerling meerderjarig is, door de leerling aannemelijk
      wordt gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, meldt het bevoegd gezag
      binnen twee weken na het besluit tot toelating aan de Informatie Beheer Groep de beschikbare gegevens van de
      leerling, bedoeld in het eerste lid, alsmede zijn adres en woonplaats.

      4 De Informatie Beheer Groep verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het derde lid,
      aan het bevoegd gezag het sociaal-fiscaalnummer van de leerling, dan wel, indien is gebleken dat hem niet van
      overheidswege een sociaal-fiscaalnummer is verstrekt, het onderwijsnummer van de leerling. Het onderwijsnummer is
      een door de Informatie Beheer Groep uitgegeven en aan de leerling toegekend persoonsgebonden nummer.

      5 Het bevoegd gezag neemt de in het eerste lid bedoelde gegevens op in de leerlingenadministratie van de school.

      6 Indien aan een leerling een onderwijsnummer is toegekend en het bevoegd gezag daarna de beschikking krijgt over
      zijn sociaal-fiscaalnummer, neemt het bevoegd gezag dit sociaal-fiscaalnummer terstond als persoonsgebonden nummer
      op in de leerlingenadministratie van de school in de plaats van het onderwijsnummer. Het bevoegd gezag meldt
      deze wijziging binnen twee weken aan de Informatie Beheer Groep onder opgave van het sociaal-fiscaalnummer en het
      onderwijsnummer van de leerling.


