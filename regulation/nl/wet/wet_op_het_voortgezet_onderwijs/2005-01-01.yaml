  - number: 76y
    text: |-
      1 De voorzieningen in de huisvesting en de inventaris komen slechts voor bekostiging in aanmerking, voor zover Onze
      minister met de voorzieningen heeft ingestemd.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de
      uitvoering van dit artikel.

      3 Onze minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen.
      In dat geval worden bij of krachtens de algemene maatregel van bestuur bedoeld in het tweede lid regels omtrent de
      verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel76y
  - number: 76z
    text: |-
      Tegen een besluit van Onze minister ingevolge deze afdeling kan een belanghebbende beroep instellen bij de Afdeling
      bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel76z
  - number: '77'
    text: |-
      1 De scholen, bedoeld in [afdeling I van titel II][ref1] worden door het Rijk bekostigd met inachtneming van de
      [artikelen 76y][ref2], [76z][ref3] en [78 tot en met 106][ref4]. De uitgaven, bedoeld in de [artikelen 96g][ref5]
      en [96h][ref6], alsmede de bedragen die de gemeente krachtens deze wet in aanvulling op de rijksbekostiging
      verstrekt, blijven ten laste van de gemeente.

      2 Aan niet door de gemeente in stand gehouden scholen als bedoeld in [afdeling I van titel II][ref7] wordt uit de
      openbare kas geen bekostiging verstrekt dan krachtens de bepalingen van deze wet.

      3 Met betrekking tot een scholengemeenschap of een school en de daaraan verbonden cursussen in de zin van
      [artikel 75b, eerste lid][ref8], alsmede met betrekking tot de scholen voor praktijkonderwijs kunnen zo nodig in
      afwijking van het bepaalde in deze afdeling bij of krachtens algemene maatregel van bestuur voorschriften worden
      gegeven voor de toepassing van deze afdeling.

      4 Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de vaststelling
      en uitkering van een budget ten behoeve van aanvullende zorg voor leerlingen van de scholen in het
      samenwerkingsverband, in aanvulling op de vergoeding, berekend op grond van het bij of krachtens deze afdeling
      bepaalde. Het budget wordt binnen het raam van de door de begrotingswetgever daartoe beschikbaar gestelde middelen
      vastgesteld en uitgekeerd. De algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend. Het bepaalde in de vorige drie volzinnen is niet van toepassing, indien het ontwerp van de algemene
      maatregel van bestuur voordien aan de beide kamers is overgelegd en door of namens de kamers te kennen is gegeven
      dat van de procedure, bedoeld in de vorige drie volzinnen, kan worden afgeweken.

      5 Voor de toepassing van deze afdeling zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      [artikel 42b][ref9] of een openbare rechtspersoon als bedoeld in [artikel 42a][ref10], tenzij het tegendeel blijkt.


