  - number: 100b
    text: |-
      1 Voor zover gebouwen, terreinen of roerende zaken ten behoeve waarvan bekostiging wordt genoten, die geheel of
      gedeeltelijk tijdelijk niet nodig zijn voor het onderwijs aan de school, niet nodig zijn voor het onderwijs aan een
      andere school voor voortgezet onderwijs of aan een uit 's Rijks kas bekostigde school voor ander onderwijs, kan het
      bevoegd gezag deze voor ten hoogste een jaar, doch uiterlijk tot het einde van het schooljaar, in gebruik geven aan
      derden ten behoeve van andere culturele, maatschappelijke of recreatieve doeleinden.

      2 [Artikel 100a, derde tot en met zevende lid][ref1], is van overeenkomstige toepassing.

      3 Het eerste en tweede lid zijn slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld in
      [afdeling IV van titel II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel100a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#AfdelingIV
