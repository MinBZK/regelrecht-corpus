        paragraaf: '3'
        afdeling: I
  - number: 32c
    text: |-
      1 Het bevoegd gezag van een school stelt een directiestatuut vast.

      2 Het directiestatuut bevat in ieder geval de aanduiding van de aan het bevoegd gezag bij wettelijk voorschrift
      toegekende taken en bevoegdheden waarvan het bevoegd gezag heeft bepaald dat de rector, de directeur, de conrector,
      de adjunct-directeur of de centrale directie van de school deze in naam van het bevoegd gezag kan uitoefenen. Het
      directiestatuut bevat voorts instructies ten aanzien van deze taken en bevoegdheden.

      3 Het bevoegd gezag draagt er zorg voor dat een exemplaar van het directiestatuut in het gebouw van de school
      ter inzage wordt gelegd op een voor een ieder toegankelijke plaats. Het bevoegd gezag zendt een exemplaar van
      het directiestatuut, alsmede elke wijziging daarvan, zo spoedig mogelijk na de vaststelling ter kennisneming aan
      de inspectie.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel32c
  - number: 32d
    text: |-
      1 Het bevoegd gezag stelt ten behoeve van de directie van elk van zijn scholen, indien daaraan van een
      ondervertegenwoordiging van vrouwen in de directie sprake is, eenmaal in de 4 jaar een document inzake evenredige
      vertegenwoordiging van vrouwen in de schoolleiding vast.

      2 Het document bevat streefcijfers, met inbegrip van een bepaald tijdvak waarbinnen deze streefcijfers worden
      gerealiseerd, aan de hand waarvan door het bevoegd gezag een beleid inzake evenredige vertegenwoordiging van
      vrouwen in de schoolleiding wordt gevoerd, opdat in de directie van elke school van het bevoegd gezag vrouwen
      en mannen naar evenredigheid werkzaam zullen zijn. Voor de evenredige vertegenwoordiging wordt uitgegaan van de
      verhouding mannen en vrouwen voor wat betreft het onderwijzend personeel dat werkzaam is in het door de school
      verzorgde onderwijs, zoals die blijkt uit de daarover jaarlijks door Onze minister gepubliceerde cijfers. Het
      document vermeldt tevens de maatregelen die het bevoegd gezag heeft genomen en zal nemen teneinde de in de eerste
      volzin bedoelde streefcijfers te realiseren en geeft een overzicht van de beoogde en bereikte resultaten van het
      beleid inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding gedurende de periode waarvoor het
      document geldt, onderscheidenlijk de periode waarvoor het vorige document gold.

      3 Indien door het bevoegd gezag aan het hoofd van de school een centrale directie wordt geplaatst en vrouwen daarin
      zijn ondervertegenwoordigd, stelt het bevoegd gezag overeenkomstig het bepaalde in het eerste en tweede lid tevens
      een document inzake evenredige vertegenwoordiging van vrouwen in de schoolleiding ten behoeve van de centrale
      directie vast.

      4 Het bevoegd gezag draagt er zorg voor dat een exemplaar van het document, bedoeld in het eerste en derde
      lid, in het gebouw van de school ter inzage wordt gelegd op een voor het personeel, de ouders en de leerlingen
      toegankelijke plaats, alsmede dat een exemplaar wordt bewaard bij de administratie van de school.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel32d
  - number: '33'
    text: |-
      1 Leraren worden door het bevoegd gezag benoemd dan wel tewerkgesteld zonder benoeming. Om tot leraar te kunnen
      worden benoemd of tewerkgesteld zonder benoeming dient de betrokkene in het bezit te zijn van:

      a. een verklaring omtrent het gedrag, afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref1],
      die op het tijdstip van overlegging aan het bevoegd gezag niet ouder is dan 6 maanden;

      b. een bewijs van bekwaamheid voor het door hem aan die school te geven onderwijs;

      c. een bewijs van voldoende pedagogische en didactische voorbereiding, voor zover aangewezen bij algemene maatregel
      van bestuur;

      d. in plaats van een bewijs als bedoeld onder b en een bewijs als bedoeld onder c
      gezamenlijk, een ten aanzien van het door hem te geven onderwijs afgegeven EG-verklaring
      als bedoeld in de [Algemene wet erkenning EG-hoger-onderwijsdiploma's][ref2] dan wel in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref3]; en die niet krachtens rechterlijke uitspraak van het geven
      van onderwijs is uitgesloten.

      2 In bijzondere gevallen kan Onze minister aan personen, die in een bepaald vak of onderdeel van een vak door
      buitengewone bekwaamheid uitmunten, ten aanzien van dit vak of dit onderdeel ontheffing verlenen van de in het
      eerste lid onder b en c gestelde eisen.

      3 Bij tijdelijke afwezigheid van een leraar kan ten aanzien van degene, die hem vervangt, telkens voor ten hoogste
      een jaar worden afgeweken van de eisen, gesteld in het eerste lid onder b en c. Indien in een vacature niet
      terstond kan worden voorzien door de benoeming of de tewerkstelling zonder benoeming van een leraar die aan de
      genoemde eisen voldoet, is het bepaalde in de vorige volzin van overeenkomstige toepassing.

      4 In het eerste leerjaar van een school voor voorbereidend wetenschappelijk onderwijs, voor algemeen voortgezet
      onderwijs, voor voorbereidend beroepsonderwijs, of voor praktijkonderwijs kan een leraar, die daartoe naar het
      oordeel van het bevoegd gezag bekwaam is, ook onderwijs geven in andere vakken dan die, waarvoor het in zijn bezit
      zijnde bewijs van bekwaamheid, bedoeld in het eerste lid onder b, geldt. In bijzondere gevallen kan het bepaalde in
      de vorige volzin eveneens toepassing vinden ten aanzien van een leraar in het tweede leerjaar van een daarbedoelde
      school.

      5 In de gevallen, bedoeld in het derde en vierde lid, is, voorzover niet bij de algemene maatregel van bestuur,
      bedoeld in [artikel 35a][ref4], anders is bepaald, de toestemming van de inspectie vereist. Tegen de weigering van
      de toestemming kan het bevoegd gezag een voorziening vragen bij Onze minister. Het vragen van voorziening wordt
      gelijkgesteld met het instellen van administratief beroep.

      6 Het eerste lid onder b en c is niet van toepassing op een leraar, in zoverre deze belast is met het geven van
      godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs.

      7 Het eerste lid is niet van toepassing op een leraar, in zoverre deze belast is met het verrichten van
      werkzaamheden in verband met contractactiviteiten.

      8 Bij algemene maatregel van bestuur worden ten aanzien van leraren die in vaste dienst zijn verbonden aan een
      school, bedoeld in de [artikelen 7][ref5], [8][ref6], [9][ref7], [10a][ref8] en [10f][ref9], regelen gesteld
      omtrent de gronden waarop en de procedure volgens welke kan worden afgeweken van het eerste lid, onderdeel b.

      9 Onverminderd het derde, vierde en achtste lid en [artikel 35a][ref10] kan ten aanzien van studenten die:

      a. aan een hogeschool een duale opleiding volgen als bedoeld in
      [artikel 7.7 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref11], en aan die opleiding ten
      minste 126 studiepunten hebben behaald, dan wel

      b. een duale opleiding als bedoeld in dat artikel aan een universiteit volgen

      tot leraar voortgezet onderwijs ten behoeve van het geven van het onderwijs waarvoor de desbetreffende opleiding
      opleidt tot het daarvoor vereiste getuigschrift, worden afgeweken van de eisen in het eerste lid onder b en
      c, met dien verstande dat het tijdelijk dienstverband van de student een periode beslaat die overeenkomt met
      een volledig dienstverband van vijf maanden. De vorige volzin is van overeenkomstige toepassing ten aanzien
      van studenten die ten minste 116 doch nog geen 126 studiepunten hebben behaald, indien door de desbetreffende
      hogeschool wordt verklaard dat de student beschikt over met 126 studiepunten vergelijkbare en tevens voor het
      dienstverband relevante kennis, inzicht en vaardigheden. De toepassing van de vorige volzin vervalt ten aanzien
      van die student die niet binnen vier weken na aanvang van het dienstverband over 126 studiepunten beschikt. De
      in [artikel 7.7, vijfde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref12] bedoelde
      overeenkomst vermeldt tevens de leraar onder wiens verantwoordelijkheid de betrokken student werkzaamheden van
      onderwijskundige aard verricht.

      10

      11

      12 Het negende lid is, behoudens de eis van verblijf in het laatste jaar van de opleiding, van overeenkomstige
      toepassing ten aanzien van studenten van een universitaire lerarenopleiding, met dien verstande dat afwijking bij
      de voltijdse vorm van die opleiding mogelijk is voor ten hoogste de periode van een schooljaar waarin onderwijs
      wordt gegeven, en bij de deeltijdse vorm van die opleiding voor ten hoogste twee jaren.

      13 Bij algemene maatregel van bestuur kunnen, zo nodig afwijkende, regels worden gesteld met betrekking tot de
      toepassing van het eerste lid ten aanzien van het verzorgen van door het bevoegd gezag vastgestelde vakken en
      andere programma-onderdelen, behoudens godsdienstonderwijs en levensbeschouwelijk vormingsonderwijs.


