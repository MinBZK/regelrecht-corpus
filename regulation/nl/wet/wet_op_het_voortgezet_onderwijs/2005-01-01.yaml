  - number: '44'
    text: |-
      1 Het onderwijs aan openbare scholen wordt gegeven met eerbiediging van ieders geloofs- of levensovertuiging.

      2 Wij kunnen hem, die zich in dit opzicht aan plichtsverzuim schuldig maakt, voor ten hoogste een jaar en bij
      herhaling voor onbepaalde tijd in zijn bevoegdheid tot het geven van onderwijs aan een openbare school schorsen.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel44
  - number: '46'
    text: |-
      1 Aan de openbare scholen worden op verzoek van kerkelijke gemeenten of van plaatselijke kerken de leerlingen in
      de gelegenheid gesteld in de schoollokalen godsdienstonderwijs te volgen van godsdienstleraren, daartoe door die
      gemeenten of kerken aan te wijzen.

      2 De schoollokalen worden, zo nodig verwarmd en verlicht, kosteloos voor het godsdienstonderwijs beschikbaar
      gesteld.

      3 Bij een geschil omtrent het vaststellen van lessen of het beschikbaar stellen van lokalen van openbare scholen
      beslist Onze minister.

      4 Aan de kerkelijke gemeenten of de plaatselijke kerken kan een subsidie worden verstrekt. De
      [artikelen 4 tot en met 19 van de Wet overige OCenW-subsidies][ref1] zijn van toepassing, met dien verstande dat de
      subsidie slechts kan worden verstrekt bij algemene maatregel van bestuur.

      5 Voor de toepassing van dit artikel worden met kerkelijke gemeenten gelijkgesteld verenigingen met volledige
      rechtsbevoegdheid, die zich blijkens de statuten het geven of doen geven van godsdienstonderwijs ten doel stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '47'
    text: |-
      1 Aan de openbare scholen worden op verzoek van door Ons tot dit doel toegelaten genootschappen op geestelijke
      grondslag de leerlingen, wier ouders, voogden of verzorgers daartoe de wens te kennen geven, in de gelegenheid
      gesteld in de schoollokalen levensbeschouwelijk vormingsonderwijs te volgen van leraren, daartoe door deze
      genootschappen aan te wijzen.

      2 De schoollokalen worden, zo nodig verwarmd en verlicht, kosteloos voor het vormingsonderwijs beschikbaar gesteld.

      3 Bij een geschil omtrent het vaststellen van lessen of het beschikbaar stellen van lokalen van openbare scholen
      beslist Onze minister.

      4 Aan de genootschappen, bedoeld in het eerste lid, kan een subsidie worden verstrekt. De
      [artikelen 4 tot en met 19 van de Wet overige OCenW-subsidies][ref1] zijn van toepassing, met dien verstande dat de
      subsidie slechts kan worden verstrekt bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '48'
    text: |-
      1 Indien binnen redelijke afstand van de woning van de leerling niet de gelegenheid bestaat tot het volgen van het
      onderwijs aan een openbare school, mag aan deze leerling de toegang tot een gelijksoortige, uit de openbare kas
      bekostigde bijzondere school niet worden geweigerd op grond van levensbeschouwing, tenzij de school uitsluitend
      bestemd is voor interne leerlingen.

      2 Indien tot een bijzondere school ingevolge het eerste lid andere leerlingen worden toegelaten dan voor wie de
      school in verband met de levensbeschouwing wordt in stand gehouden, kunnen deze leerlingen niet worden verplicht
      tot het volgen van de lessen in de vakken of andere programma-onderdelen, die in verband met die levensbeschouwing
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel48
  - number: 48a
    text: |-
      Indien het bevoegd gezag van een bijzondere school aan de Informatie Beheer Groep de mededeling heeft gedaan,
      bedoeld in [artikel 27a, vijfde lid][ref1], kan de leerling binnen 6 weken na ontvangst van de gegevens, bedoeld in
      [artikel 27a, zevende lid][ref2], bij het bevoegd gezag schriftelijk bedenkingen uiten tegen die mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel27a
