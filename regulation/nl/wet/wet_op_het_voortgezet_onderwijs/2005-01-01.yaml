  - number: '57'
    text: |-
      De aanwijzing geschiedt op een daartoe tot Onze minister gericht verzoek van het schoolbestuur. Bij het verzoek
      worden overgelegd:

      a. het schoolplan van de school;

      b. een opgave van de bewijzen van bekwaamheid en van voldoende pedagogische en didactische voorbereiding van de
      leraren;

      c. de statuten en het reglement van de rechtspersoon met volledige rechtsbevoegdheid, die de school in stand houdt.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel57
  - number: '58'
    text: |-
      1 Het schoolplan van een ingevolge [artikel 56][ref1] aangewezen school voldoet ten minste aan de voorschriften,
      gegeven bij of krachtens de [artikelen 10][ref2], [10b][ref3], [10d][ref4], [11a tot en met 11f][ref5],
      [12 tot en met 15][ref6], [22][ref7] en [24][ref8].

      2 Bij wijziging van het schoolplan doet het schoolbestuur daarvan onmiddellijk mededeling aan de inspectie.

      3 Onze minister kan ten behoeve van de bijzondere inrichting van het onderwijs aan de school toestaan, dat wordt
      afgeweken van het eerste lid. Onze minister besluit binnen zes maanden na ontvangst van een aanvraag. Indien de
      beschikking niet binnen zes maanden kan worden gegeven, stelt Onze minister de aanvrager daarvan in kennis en noemt
      hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.

      4 De naam van de school duidt aan, met welke van de uit de openbare kas bekostigde scholen zij overeenkomt.

      5 De voorwaarden voor de toelating tot de school zijn ten minste gelijk aan die, vastgesteld krachtens
      [artikel 27, eerste lid, alsmede de leden 1a en 1b][ref9].

      6 [Artikel 33][ref10] is van toepassing.


