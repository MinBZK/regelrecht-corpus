  - number: '19'
    text: |-
      1 In een scholengemeenschap zijn tot één school verenigd een school of inrichting in de zin van deze wet en een of
      meer andere al dan niet in deze wet bedoelde scholen, niet zijnde instellingen van hoger onderwijs.

      2 Aan een school of aan een scholengemeenschap kan een nevenvestiging zijn verbonden indien de nevenvestiging is
      tot stand gebracht op de wijze en voldoet aan de voorwaarden bepaald krachtens [artikel 75, vijfde lid][ref1].
      Aan een scholengemeenschap kan eveneens een nevenvestiging zijn verbonden indien de nevenvestiging is tot stand
      gebracht op de wijze en voldoet aan de voorwaarden, bedoeld in [artikel 75a][ref2].

      3 Bij of krachtens algemene maatregel van bestuur kunnen ten behoeve van scholengemeenschappen waarin tot
      één school zijn verenigd een school of inrichting in de zin van deze wet en een of meer andere scholen
      in de zin van een andere dan deze wet, nadere voorschriften worden gegeven, zo nodig in afwijking van de
      [artikelen 32 tot en met 41][ref3].

      4 Aan een school voor middelbaar algemeen voortgezet onderwijs of een school voor voorbereidend
      beroepsonderwijs of aan een scholengemeenschap waarvan ten minste een school voor middelbaar algemeen
      voortgezet onderwijs of een school voor voorbereidend beroepsonderwijs deel uitmaakt, kan een
      nevenvestiging zijn verbonden, indien de nevenvestiging is tot stand gebracht op de wijze en voldoet aan
      de voorwaarden, bedoeld in [artikel IV, derde lid][ref4], onderscheidenlijk[artikel V, derde lid][ref5], of
      [VIII, vierde lid, van de Wet van 25 mei 1998][ref6] (Stb. 337). Aan een school voor praktijkonderwijs kan
      een nevenvestiging zijn verbonden indien die is tot stand gebracht op de wijze en voldoet aan de voorwaarden,
      bedoeld in de regels die voor nevenvestigingen aan scholen voor praktijkonderwijs zijn gesteld krachtens
      [artikel XXII van de in de eerste volzin genoemde wet][ref7].

      5 Bij of krachtens algemene maatregel van bestuur kan ten behoeve van het voorbereidend beroepsonderwijs, verzorgd
      in agrarische opleidingscentra als bedoeld in [artikel 1.3.3 van de Wet educatie en beroepsonderwijs][ref8], worden
      vastgesteld dat het bepaalde bij of krachtens de Wet op het voortgezet onderwijs geheel of gedeeltelijk niet van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel75a
