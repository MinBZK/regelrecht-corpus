  - number: 53c
    text: |-
      1 De instandhouding van een of meer openbare en een of meer bijzondere scholen kan worden opgedragen of
      overgedragen aan een stichting die met dit doel wordt onderscheidenlijk is opgericht.

      2 Het statutaire doel van de stichting is in elk geval het geven van openbaar onderwijs en onderwijs van een of
      meer richtingen in afzonderlijke scholen voor openbaar onderscheidenlijk bijzonder onderwijs.

      3 De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken
      en bevoegdheden van het bevoegd gezag uit.

      4 Het personeel dat werkzaam is aan de openbare school en niet is tewerkgesteld zonder benoeming, wordt benoemd
      krachtens een arbeidsovereenkomst naar burgerlijk recht.

      5 De statuten voorzien in ieder geval in een regeling omtrent:

      a. de samenstelling, werkwijze en inrichting van het bestuur van de stichting,

      b. de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden,

      c. de termijn waarvoor de bestuursleden worden benoemd,

      d. de vaststelling van de begroting en jaarrekening na overleg met de gemeenteraad van de gemeente waarin de
      openbare school is gelegen,

      e. de wijze waarop de gemeenteraad van de gemeente waarin de openbare school is gelegen, toezicht op het bestuur
      van de openbare school uitoefent,

      f. de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,

      g. de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en

      h. de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd voor zover het openbaar onderwijs betreft.

      6 De statuten van de stichting kunnen slechts worden gewijzigd na goedkeuring van de gemeenteraad van de gemeente
      waarin de openbare school is gelegen. Goedkeuring kan slechts worden onthouden indien overheersende invloed van de
      overheid in het bestuur niet is verzekerd voor zover het openbaar onderwijs betreft.

      7 Het bestuur brengt jaarlijks aan de gemeenteraad van de gemeente waarin de openbare school is gelegen, verslag
      uit over de werkzaamheden, waarbij in ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar
      onderwijs. Het verslag wordt bekendgemaakt.

      8 De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.

      9 In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover
      het openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waarin de openbare school is gelegen, de
      maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het openbaar
      onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel53c
  - number: '54'
    text: |-
      Het bestuur van een bijzondere school voor voortgezet onderwijs geeft binnen vier weken na de oprichting van de
      school onder overlegging van de statuten der instelling, die de school in stand houdt, en van de reglementen, van
      die oprichting kennis aan Onze minister. Indien de statuten of reglementen worden gewijzigd of ingetrokken, wordt
      eveneens binnen vier weken van de wijziging of van de intrekking van de statuten of reglementen aan Onze minister
      kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel54
  - number: '55'
    text: |-
      1 Algemeen voortgezet onderwijs mag slechts worden gegeven door hem, die in het bezit is van:

      a. een verklaring omtrent het gedrag, als bedoeld in [artikel 33, eerste lid onder a][ref1];

      b. een bewijs van bekwaamheid, als bedoeld in [artikel 33, eerste lid onder b][ref2]; en die niet krachtens
      rechterlijke uitspraak van het geven van onderwijs is uitgesloten.

      2 Het eerste lid onder b is niet van toepassing op een leraar, in zoverre deze belast is met het geven van
      godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs.

      3 [Artikel 33, tweede tot en met vijfde lid][ref3], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel33
