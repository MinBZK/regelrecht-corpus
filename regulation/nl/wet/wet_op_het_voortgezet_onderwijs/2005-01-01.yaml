  - number: '102'
    text: |-
      1 [Artikel 101][ref1] is niet van toepassing, indien en voor zover Onze minister heeft toegestaan, dat gebouwen,
      terreinen of roerende zaken worden bestemd voor ander onderwijs, dan wel worden gebruikt voor andere culturele of
      maatschappelijke doeleinden.

      2 Het eerste lid is slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld in
      [afdeling IV van titel II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel101
