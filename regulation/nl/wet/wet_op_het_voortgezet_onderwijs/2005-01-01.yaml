  - number: 96d
    text: |-
      1 Met inachtneming van de [artikelen 84 tot en met 85][ref1] en [86, eerste lid][ref2], verstrekt het Rijk
      jaarlijks aan het bevoegd gezag van openbare en bijzondere scholen een bekostigingsbedrag ten behoeve van de
      personeels- en exploitatiekosten gezamenlijk.

      2 In geval van het verstrekken van aanvullende bekostiging als bedoeld in [artikel 85a][ref3] of [artikel 89][ref4]
      verstrekt het Rijk aan het desbetreffende bevoegd gezag het bedrag van deze bekostiging.


