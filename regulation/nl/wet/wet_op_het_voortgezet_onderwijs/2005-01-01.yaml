  - number: 11c
    text: |-
      1 Gedurende de eerste drie leerjaren van het voortgezet onderwijs worden per leerjaar ten minste 1280 lesuren van
      50 minuten onderwijs verzorgd.

      2 Gedurende de periode die aan basisvorming wordt besteed, worden, behoudens in geval van toepassing van
      [artikel 11d][ref1] of het derde lid, per leerjaar tenminste 1000 lesuren van 50 minuten onderwijs verzorgd in
      de vakken genoemd in [artikel 11a, tweede lid][ref2]. Na het tweede leerjaar kan het bevoegd gezag een lager
      aantal lesuren hanteren, afhankelijk van de mate waarin een leerling de vakken die de basisvorming omvat,
      heeft afgesloten. Indien het bevoegd gezag gedurende de eerste twee jaren van de periode van basisvorming naast
      onderwijs in de vakken, genoemd in [artikel 11a, tweede lid][ref3], tevens onderwijs in andere vakken, niet
      zijnde godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs, aanbiedt, draagt het er zorg voor dat voor
      het onderwijs in deze andere vakken uitgangspunten worden gehanteerd in overeenstemming met de kerndoelen bedoeld
      in [artikel 11a][ref4].

      3 Het bevoegd gezag van een school voor middelbaar algemeen voortgezet onderwijs of voor voorbereidend
      beroepsonderwijs kan in het eerste of tweede leerjaar, ter voorbereiding op het onderwijs in een van de leerwegen,
      bedoeld in de [artikelen 10][ref5], [10b][ref6] en [10d][ref7], een programma verzorgen ter oriëntatie op het
      onderwijs in de sectoren van die leerwegen. Het in de eerste volzin bedoelde programma omvat niet meer dan 10
      procent van het aantal lesuren over de eerste twee leerjaren.

      4 Het bevoegd gezag van een school voor voorbereidend beroepsonderwijs kan, in plaats van het derde lid en
      met inachtneming van [artikel 11e, tweede lid][ref8], in het eerste of tweede leerjaar, ter voorbereiding
      op het onderwijs in de basisberoepsgerichte leerweg, bedoeld in [artikel 10b][ref9], een programma
      verzorgen ter oriëntatie op het onderwijs in de sectoren van die leerweg. Het in de eerste volzin bedoelde
      programma is uitsluitend bestemd voor de leerling die is toegelaten tot het leerwegondersteunend onderwijs,
      bedoeld in [artikel 10e][ref10], en voor wie naar de verwachting van het bevoegd gezag het onderwijs in de
      basisberoepsgerichte leerweg het meest geschikt is. Het programma omvat niet meer dan 20 procent van het aantal
      lesuren over de eerste twee leerjaren.

      5 Het onderwijs kan worden verzorgd in een ander aantal minuten per lesuur dan 50. In dat geval dient de totale
      tijd waarin onderwijs wordt verzorgd niet te dalen beneden die welke is voorgeschreven.


