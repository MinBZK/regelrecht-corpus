  - number: 96h
    text: |-
      1 Indien een gemeente zelf een of meer openbare scholen in stand houdt en zij uitgaven wil doen ten behoeve van
      het voorbereidend wetenschappelijk onderwijs, het algemeen voortgezet onderwijs, het voorbereidend beroepsonderwijs
      of het praktijkonderwijs welke niet door het Rijk worden bekostigd, kan de gemeenteraad onverminderd
      [artikel 118b, eerste lid][ref1], daarvoor bij verordening een regeling vaststellen.

      2 [Artikel 96g, tweede tot en met zevende lid][ref2], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96g
