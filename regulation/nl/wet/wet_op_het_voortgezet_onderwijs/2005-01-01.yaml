  - number: '11'
    text: |-
      1 Op aanvraag van het bevoegd gezag van een in [artikel 10h, eerste lid][ref1], bedoelde school kan Onze Minister
      toestaan dat het bevoegd gezag zijn deelname aan een samenwerkingsverband ten aanzien van die school beëindigt,
      indien:

      a. het bevoegd gezag kan aantonen dat alle bevoegde gezagsorganen in het betrokken samenwerkingsverband hiermee
      instemmen,

      b. het bevoegd gezag kan aantonen dat hij ten aanzien van die school aan een ander samenwerkingsverband deelneemt,

      c. met alle bevoegde gezagsorganen in het betrokken samenwerkingsverband een regeling is getroffen met betrekking
      tot de financiële en personele consequenties,

      d. door de beëindiging van de deelname geen aanspraken ontstaan op werkloosheidsuitkeringen voor personeel dat
      werkzaam is aan de scholen in het samenwerkingsverband, waaronder de school ten aanzien waarvan de deelname wordt
      beëindigd, en

      e. de inspectie een positief advies heeft uitgebracht.

      2 Bij algemene maatregel van bestuur kunnen nadere voorschriften worden vastgesteld met betrekking tot de
      samenwerkingsverbanden.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10h
