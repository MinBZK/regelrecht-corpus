  - number: 96q.1
    text: |-
      1 Het bij of krachtens [artikel 96o][ref1] bepaalde is van overeenkomstige toepassing indien de rechtspersoon,
      bedoeld in [artikel 53b][ref2], personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in
      [artikel 96o][ref3] van de rechtspersoon of van een bevoegd gezag waarvoor diensten worden verricht, dan wel
      niet handelt overeenkomstig het bepaalde in laatstgenoemde artikelleden. Van het gewezen personeel, bedoeld in de
      eerste volzin, is uitgezonderd het personeel van het bevoegd gezag waarvoor diensten worden verricht, waarvan de
      dienstbetrekking is beëindigd op een tijdstip dat meer dan twee jaar ligt voor de aanvang van de dienstverlening.

      2 In geval van toepassing van het eerste lid wordt het in mindering te brengen bedrag in gelijke mate verdeeld over
      de scholen waarvoor diensten worden verricht.

      3 Het bij of krachtens [artikel 96o][ref4] bepaalde is eveneens van overeenkomstige toepassing

      a. indien een bevoegd gezag waarvoor diensten worden verricht, personeel benoemt met voorbijgaan van gewezen
      personeel van de rechtspersoon, bedoeld in [artikel 53b][ref5], en

      b. indien een bevoegd gezag waarvoor geen diensten meer worden verricht, in het tijdvak van vijf jaar na
      beëindiging van de dienstverlening personeel benoemt met voorbijgaan van gewezen personeel als bedoeld in onderdeel
      a.


