  - number: 76w
    text: |-
      Het bevoegd gezag van een andere dan een gemeentelijke school is gehouden aan de gemeente alle inlichtingen te
      verschaffen die de gemeente voor een adequate uitvoering van de bepalingen in dit hoofdstuk noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel76w
  - number: 76x
    text: |-
      De [artikelen 76y][ref1] en [76z][ref2] zijn slechts van toepassing op andere vormen van voortgezet onderwijs als
      bedoeld in [afdeling IV van titel II][ref3].


