  - number: 96o
    text: |-
      1 Op het bedrag, bedoeld in [artikel 96m, eerste lid][ref1], worden in mindering gebracht de salarissen, toelagen,
      uitkeringen of andere bijdragen waarop aanspraak wordt gemaakt door personeel dat is benoemd met voorbijgaan van
      personeel dat een gelijksoortige functie uitoefent of heeft uitgeoefend aan een school van het bevoegd gezag,
      voor zover laatstbedoeld personeel in het genot is van wachtgeld of een andere ontslaguitkering en direct aan die
      ontslaguitkering voorafgaand langer dan een jaar onafgebroken in dienst is geweest van het bevoegd gezag. Voor de
      toepassing van de eerste volzin wordt, indien het betreft openbaar onderwijs, onder «school van het bevoegd gezag»
      verstaan elke binnen de desbetreffende gemeente gelegen school, met uitzondering van de binnen die gemeente gelegen
      nevenvestigingen waarvan de hoofdvestiging in een andere gemeente is gelegen.

      2 Op het in het eerste lid bedoelde bedrag worden eveneens in mindering gebracht de salarissen, toelagen,
      uitkeringen of andere bijdragen waarop aanspraak wordt gemaakt door personeel dat

      a. langer dan twee jaar anders dan wegens vervanging of in geval van leraren indien de benoeming is geschied met
      toepassing van [artikel 33, derde lid juncto vijfde lid][ref2], onafgebroken, met een onderbreking van een week
      of minder dan wel met een of meer onderbrekingen gedurende een schoolvakantie, in een gelijksoortige functie in
      tijdelijke dienst verbonden is geweest aan een school van het bevoegd gezag, of

      b. langer dan drie jaar direct of indirect in verband met het verrichten van contractactiviteiten in tijdelijke
      dienst is benoemd.

      De in onderdeel a genoemde termijn van twee jaar kan in geval van een of meer ziekteperioden van langer dan vier
      weken met deze ziekteperioden worden verlengd.

      3 Op het in het eerste lid bedoelde bedrag worden eveneens in mindering gebracht de kosten van
      werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en
      arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref3]. De eerste volzin is niet
      van toepassing, indien de rechtspersoon, bedoeld in [artikel 98b][ref4], op een daartoe strekkend verzoek van het
      bevoegd gezag, voorafgaand aan het ontslag heeft ingestemd met het ten laste van die rechtspersoon brengen van de
      kosten van uitkeringen of suppleties als bedoeld in de eerste volzin.

      4 Het eerste lid is eveneens van toepassing, indien de benoeming heeft plaatsgevonden in aansluiting op een
      benoeming in tijdelijke dienst in dezelfde functie.

      5 Met gewezen personeel dat in het genot is van wachtgeld of van een andere ontslaguitkering als bedoeld in het
      eerste lid, wordt gelijkgesteld personeel aan wie op grond van het leerlingenverloop op of na 1 februari ontslag
      is of zal worden aangezegd, op grond van welk ontslag recht op wachtgeld of een andere ontslaguitkering zou kunnen
      ontstaan. In afwijking van de eerste volzin kan voor een periode tot uiterlijk de datum van ingang van het recht op
      wachtgeld of op een andere ontslaguitkering in een vacature worden voorzien zonder dat de vermindering, bedoeld in
      het eerste lid, plaatsvindt.

      6 Bij ministeriële regeling wordt bepaald in welke gevallen geen vermindering als bedoeld in het eerste en tweede
      lid plaatsvindt.

      7 Onze minister kan in andere gevallen dan voorzien in de ministeriële regeling, bedoeld in het zesde lid, wegens
      gewichtige redenen op verzoek van het bevoegd gezag besluiten dat de vermindering van de bekostiging, bedoeld in
      het eerste lid, niet zal plaatsvinden. Onze Minister besluit binnen vier maanden na ontvangst van een aanvraag.
      Indien de beschikking niet binnen vier maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in
      kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien. Uitsluitend op
      grond van door het bevoegd gezag aangevoerde bijzondere omstandigheden kan Onze minister bepalen dat de beslissing,
      bedoeld in de eerste volzin, betrekking heeft of mede betrekking heeft op een periode voorafgaand aan de datum
      waarop het bevoegd gezag het in de eerste volzin bedoelde verzoek heeft ingediend.

      8 Onze minister kan projecten aanwijzen waarvoor het tweede lid onderdeel a niet van toepassing is.


