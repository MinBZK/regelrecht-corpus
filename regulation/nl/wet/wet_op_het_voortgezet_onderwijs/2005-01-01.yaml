  - number: 38a
    text: |-
      1 Met inachtneming van bij of krachtens algemene maatregel van bestuur vastgestelde voorschriften als bedoeld in
      het tweede en derde lid regelt het bevoegd gezag van een openbare school de rechtspositie van het personeel en
      draagt het bevoegd gezag van een bijzondere school zorg voor de regeling van de rechtspositie van het personeel.

      2 Bij algemene maatregel van bestuur onderscheidenlijk bij of krachtens algemene maatregel van bestuur worden
      voorschriften vastgesteld betreffende:

      a. salarisschalen en uitgangspunten waaraan een door het bevoegd gezag in te richten functiewaarderingssysteem moet
      voldoen, en

      b. rechten en plichten van het personeel en het bevoegd gezag bij ziekte, bevalling, zwangerschap,
      arbeidsongeschiktheid en ontslag, dan wel met betrekking tot bedrijfsgezondheidskundige begeleiding, voor zover
      deze bij wet voorgeschreven rechten en verplichtingen te boven gaan, dan wel de voorwaarden waaronder het bevoegd
      gezag deze rechten en plichten zelf regelt of voor de regeling daarvan zorg draagt.

      3 Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld betreffende algemene arbeidsduur.

      4 Onder regeling van de rechtspositie als bedoeld in het eerste lid wordt tevens begrepen het vaststellen van
      bepalingen inzake aanstelling, benoeming, schorsing, disciplinaire maatregelen en ontslag van personeel. De
      bepalingen omtrent ontslag mogen het personeel van de openbare scholen niet minder rechten verschaffen dan
      die welke voor werknemers met een arbeidsovereenkomst voortvloeien uit de bepalingen van dwingend recht van
      [titel 10 van boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: '39'
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat de rector, de directeur, de conrectoren, de adjunct-directeuren, de
      leden van de centrale directie, de leraren en het overige personeel.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel39
  - number: 39a
    text: |-
      1 Het bevoegd gezag benoemt de rector, de directeur, de conrector en de adjunct-directeur, de centrale directie, de
      leraren en het overige personeel, bedoeld in [artikel 39][ref1], in algemene dienst van het bevoegd gezag.

      2 Onder benoeming in algemene dienst van het bevoegd gezag wordt in dit artikel en in de [artikelen 43a][ref2] en
      [51][ref3] verstaan een benoeming ten behoeve van het verrichten van werkzaamheden aan door het bevoegd gezag in
      stand gehouden scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel39
