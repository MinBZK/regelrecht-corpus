  - number: 10b5
    text: |-
      1 De landelijke organen voor het beroepsonderwijs hebben ten behoeve van hun in [artikel 10b4][ref1] geregelde
      taken aanspraak op bekostiging uit 's Rijks kas.

      2 De rijksbijdrage waarop de in het eerste lid bedoelde aanspraak betrekking heeft, wordt, binnen het raam
      van de door de begrotingswetgever beschikbaar gestelde middelen, per landelijk orgaan berekend aan de hand van
      maatstaven, neergelegd in een berekeningswijze die is vastgesteld bij of krachtens algemene maatregel van bestuur.
      De maatstaven hebben in elk geval betrekking op het aantal leer-werkovereenkomsten waarbij het landelijk orgaan
      partij is.

      3 De [artikelen 2.4.1][ref2], [2.4.2][ref3], [2.5.2 tot en met 2.5.9][ref4] en
      [11.1 van de Wet educatie en beroepsonderwijs][ref5] zijn van overeenkomstige toepassing op landelijke organen die
      taken uitvoeren als bedoeld in [artikel 10b4][ref6].


