  - number: 118f
    text: |-
      1 Het toezicht op het gemeentelijk onderwijsachterstandenbeleid in de gemeente is opgedragen aan het
      gemeentebestuur. Het toezicht op het gemeentebestuur in verband met de evaluatie van de landelijke doelstellingen
      van het beleid inzake onderwijsachterstandenbestrijding wordt uitgeoefend door bij besluit van Onze minister
      aangewezen personen. Het toezicht op de bevoegde gezagsorganen van de scholen en andere instellingen die betrokken
      zijn of betrokken worden bij de uitvoering van het plan of een besluit omtrent de verdeling van middelen indien
      wordt afgezien van de vaststelling van het plan, wordt in verband met de opstelling van het plan of het in
      deze volzin bedoelde besluit en voor de evaluatie uitgeoefend door bij besluit van de gemeenteraad aangewezen
      personen. De [artikelen 5:12 tot en met 5:17][ref1] en [5:20 van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing.

      2 Indien het bevoegd gezag van een school naar het oordeel van de gemeenteraad de middelen,
      bedoeld in [artikel 118b, vierde lid, onderdelen a en b][ref3], niet besteedt overeenkomstig het
      onderwijsachterstandenplan, of een besluit omtrent de verdeling van middelen indien de gemeenteraad op grond
      van [artikel 118b, eerste lid tweede volzin][ref4], heeft afgezien van de vaststelling van het plan, kan de
      gemeenteraad de middelen geheel of gedeeltelijk inhouden.

      3 Indien het bevoegd gezag van een school naar het oordeel van de gemeenteraad de middelen, bedoeld in
      [artikel 118b, vierde lid, onderdeel c][ref5], niet besteedt overeenkomstig het onderwijsachterstandenplan, maakt
      de gemeenteraad hiervan melding aan Onze minister.

      4 Indien het gemeentebestuur naar het oordeel van Onze minister de voorschriften in deze titel niet nakomt, kan
      Onze minister de uitkering, bedoeld in [artikel 118d][ref6], geheel of gedeeltelijk inhouden.

      5 Indien Onze Minister toepassing geeft aan het vierde lid in verband met een besluit van het gemeentebestuur dat
      leidt tot kosten van werkloosheidsuitkeringen en de rechtspersoon, bedoeld in [artikel 98b, eerste lid][ref7],
      een verzoek als bedoeld in [artikel 96o, derde lid][ref8], met betrekking tot een niet door de gemeente in stand
      gehouden school als gevolg van dat besluit van het gemeentebestuur heeft ingewilligd, vergoedt Onze Minister aan
      deze rechtspersoon de als gevolg van die inwilliging gemaakte kosten van werkloosheidsuitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel512
