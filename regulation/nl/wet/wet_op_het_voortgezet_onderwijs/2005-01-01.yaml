  - number: 35a
    text: |-
      Volgens regelen, te stellen bij algemene maatregel van bestuur kunnen in bijzondere gevallen, in afwijking
      van de eisen, gesteld in [artikel 33, eerste lid onder b en c][ref1], leraren die in het bezit zijn of worden
      geacht in het bezit te zijn van een bewijs van bekwaamheid van de tweede graad en van een bewijs als bedoeld in
      [artikel 33, eerste lid onder c][ref2], tot een bepaald aantal lessen tijdelijk tevens onderwijs geven in het
      desbetreffende vak of de combinatie van vakken aan de scholen of leerjaren van scholen, waarvoor het bezit van een
      bewijs van bekwaamheid van de eerste graad is vereist. In de gevallen bedoeld in de eerste volzin, is melding aan
      de inspectie vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
