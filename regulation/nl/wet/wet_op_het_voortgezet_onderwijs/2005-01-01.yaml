  - number: 75d
    text: |-
      Onze minister kan onder nader te stellen voorwaarden aanvullende middelen ter beschikking stellen, die niet
      strekken tot bekostiging van het onderwijs, bedoeld in deze wet, en de schoolbegeleiding als bedoeld in de
      [artikelen 179 van de Wet op het primair onderwijs][ref1] en [165 van de Wet op de expertisecentra][ref2] ten
      behoeve daarvan, maar die direct of indirect dienstig zijn voor de uitvoering van het onderwijs of voor verhoging
      van de mogelijkheid tot deelname aan het onderwijs. Voor zover toepassing van de eerste volzin het verstrekken van
      subsidie betreft, zijn de [artikelen 4 tot en met 19 van de Wet overige OCenW-subsidies][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel179
