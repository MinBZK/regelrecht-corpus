  - number: '86'
    text: |-
      1 De bekostiging voor de exploitatiekosten van de scholen heeft betrekking op de volgende componenten:

      a. onderhoud van het gebouw en het terrein,

      b. energie- en waterverbruik,

      c. middelen,

      d. administratie, beheer en bestuur,

      e. loopbaanoriëntatie en -begeleiding,

      f. schoonmaken, en

      g. publiekrechtelijke heffingen, met uitzondering van belastingen ter zake van onroerende zaken.

      2 De bekostiging wordt zodanig vastgesteld dat zij voldoet aan de redelijke behoeften van een in normale
      omstandigheden verkerende school.

      3 De bekostiging omvat:

      a. een vast bedrag per school,

      b. een bedrag dat afhankelijk is van de normatieve ruimtebehoefte per leerling,

      c. een bedrag dat afhankelijk is van het aantal leerlingen van de school, en

      d. voor scholen met leerwegondersteunend onderwijs dat op grond van [artikel 75c][ref1] in aanmerking is
      gebracht voor bekostiging een bedrag dat afhankelijk is van het aantal leerlingen in dat onderwijs voor wie de
      regionale verwijzingscommissie heeft bepaald dat zij op dat onderwijs zijn aangewezen of toelaatbaar zijn tot het
      praktijkonderwijs.

      4 De in het derde lid onder a tot en met c bedoelde bedragen kunnen per schoolsoort en per groep van leerlingen
      verschillen. De in het derde lid onder b en c bedoelde bedragen kunnen bovendien verschillen voor:

      a. de eerste twee leerjaren van de school, en

      b. de overige leerjaren.

      5 Bij ministeriële regeling worden jaarlijks voor 1 februari de in het derde lid onder a tot en met d bedoelde
      bedragen vastgesteld. Bij deze regeling worden tevens nadere voorschriften gegeven omtrent de wijze waarop de
      bekostiging wordt berekend, alsmede voorschriften omtrent de wijze waarop de bekostiging wordt vastgesteld. De
      vastgestelde bedragen gelden voor het schooljaar dat aanvangt na het tijdstip van vaststelling.

      6 Bij de vaststelling van de in het derde lid onder a tot en met c bedoelde bedragen, dan wel als tussentijdse
      aanpassing van die bedragen, worden volgens bij ministeriële regeling te geven regels loon- en prijsontwikkelingen
      verwerkt, tenzij de toestand van 's Rijks schatkist zich daartegen verzet.

      7 De ministeriële regeling, bedoeld in het vijfde lid, wordt bekendgemaakt in het officiële publicatieblad van het
      Ministerie van Onderwijs, Cultuur en Wetenschap, onder gelijktijdige overlegging aan de Tweede Kamer der Staten-
      Generaal. Van de bekendmaking wordt mededeling gedaan in de Staatscourant. De ministeriële regeling treedt niet
      eerder in werking dan nadat 4 weken zijn verstreken na het overleggen aan de Tweede Kamer en gedurende die termijn
      niet door of namens de Kamer de wens tot overleg over de regeling te kennen wordt gegeven, dan wel met de Tweede
      Kamer overleg is gevoerd. De eerste tot en met derde volzin zijn van overeenkomstige toepassing ten aanzien van
      tussentijdse aanpassingen als bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel75c
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel86
