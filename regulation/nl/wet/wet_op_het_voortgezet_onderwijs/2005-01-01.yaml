  - number: 118g
    text: |-
      1 Onder een voortijdige schoolverlater in de zin van deze titel wordt verstaan degene op wie
      [artikel 28, eerste lid onder a en b][ref1], van toepassing is en

      a. die het onderwijs aan de school waaraan hij is ingeschreven gedurende een aaneengesloten periode van ten minste
      een maand of een door het bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer volgt, of

      b. die niet meer aan een school is ingeschreven en evenmin is ingeschreven aan een instelling als bedoeld
      in de [Wet educatie en beroepsonderwijs][ref2] dan wel aan een school of instelling als bedoeld in de
      [Wet op de expertisecentra][ref3].

      2 Voor zover nodig in afwijking van het eerste lid wordt onder een voortijdige schoolverlater
      niet verstaan degene die in het bezit is van een getuigschrift van het praktijkonderwijs
      als bedoeld in artikel 10f dan wel een diploma van een opleiding als bedoeld in artikel
      [7.2.2, eerste lid onderdeel a, van de Wet educatie en beroepsonderwijs][ref4] en werkzaam is op grond van een
      aanstelling of arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0007625
      [ref3]: https://wetten.overheid.nl/BWBR0003549
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
