  - number: 96c
    text: |-
      1 Onverminderd het bepaalde in [artikel 76y][ref1] en met inachtneming van het programma van eisen, bedoeld in
      [artikel 80, eerste lid][ref2], verstrekt het Rijk een bekostigingsbedrag aan de gemeente voor het bevoegd gezag
      van een andere dan een gemeentelijke school volgens bij algemene maatregel van bestuur te stellen regels ten
      behoeve van:

      a. de kosten van gebouwen en terreinen die gesticht zijn ten behoeve van educatie en beroepsonderwijs als bedoeld
      in de [Wet educatie en beroepsonderwijs][ref3], basisonderwijs, speciaal onderwijs of voortgezet speciaal onderwijs
      en herbestemd worden ten behoeve van een andere dan een gemeentelijke school, en

      b. de kosten van het gebruik van gemeentelijke voorzieningen in de huisvesting ten behoeve van het onderwijs in
      lichamelijke oefening, die niet zijn gesticht voor onderwijsdoelen.

      2 Onverminderd het bepaalde in [artikel 76y][ref4] en met inachtneming van het programma van eisen, bedoeld
      in [artikel 80, eerste lid][ref5], verstrekt het Rijk voor een openbare of bijzondere school die geheel of
      gedeeltelijk een gebouw in gebruik heeft van het bevoegd gezag van een andere openbare of bijzondere school volgens
      bij algemene maatregel van bestuur te stellen regels, aan dat bevoegd gezag een bekostigingsbedrag ten behoeve van
      de kosten van de voorzieningen die in verband met het gebruik worden getroffen.

      3 Het eerste en tweede lid zijn slechts van toepassing op andere vormen van voortgezet onderwijs als bedoeld in
      [afdeling IV van titel II][ref6].


