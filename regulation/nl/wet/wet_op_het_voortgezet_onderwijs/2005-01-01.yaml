  - number: 102a
    text: |-
      1 De kosten van herstel van schade aan gebouwen, terreinen en roerende zaken ten behoeve waarvan met betrekking tot
      scholen bekostiging wordt genoten, worden niet door de gemeente vergoed, indien:

      a. die schade door schuld of nalatigheid van de rechtspersoon die de school in stand houdt, wordt toegebracht, of

      b. het bevoegd gezag een beroep kan doen op een verzekering waarvoor de premie voor vergoeding in aanmerking komt,
      of voor de vergoeding van die schade door de gemeente een collectieve verzekering is afgesloten, voor zover die
      collectieve verzekering de schade dekt.

      2 Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een door de gemeente bekostigde school voor
      vergoeding door de gemeente in aanmerking komt, treedt de gemeente op het moment van een uitdrukkelijk besluit tot
      vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel102a
  - number: 102a.1
    text: |-
      1 De kosten van herstel van schade aan gebouwen, terreinen en roerende zaken, ten behoeve waarvan met betrekking
      tot andere vormen van voortgezet onderwijs als bedoeld in [afdeling IV van titel II][ref1] bekostiging wordt
      genoten, worden niet door het Rijk vergoed, indien:

      a. die schade door schuld of nalatigheid van de gemeente of de rechtspersoon die de school in stand houdt, wordt
      toegebracht, of

      b. het bevoegd gezag voor die schade een beroep kan doen op een verzekering waarvoor de premie voor vergoeding in
      aanmerking komt, of voor de vergoeding van die schade door Onze minister een collectieve verzekering is afgesloten.

      2 Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een uit 's Rijks kas bekostigde school voor
      vergoeding door het Rijk in aanmerking komt, treedt het Rijk op het moment van een uitdrukkelijke beschikking tot
      vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden mocht hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#AfdelingIV
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel102a.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        afdeling: IV
  - number: '103'
    text: |-
      1 Het bevoegd gezag draagt er zorg voor dat het ten behoeve van Onze Minister beschikt over een overzichtelijke
      informatieverzameling van de financiële gegevens die op enigerlei wijze van belang zijn voor de bekostiging,
      bedoeld in deze afdeling.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de wijze van
      beschikbaarstelling van de gegevens, bedoeld in het eerste lid, en de wijze van ordening daarvan.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel103
  - number: 103a
    text: |-
      1 Het bevoegd gezag draagt er zorg voor dat het beschikt over geordende gegevens ten behoeve van het door Onze
      minister te voeren beleid met betrekking tot het onderwijs en verleent desgevraagd medewerking aan door of namens
      Onze minister uit te voeren onderzoek dat geheel of mede op deze gegevens is gebaseerd.

      2 Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de wijze van beschikbaarstelling
      van de in het eerste lid bedoelde gegevens.

      3 Bij algemene maatregel van bestuur worden voorschriften vastgesteld over de wijze van ordening van de informatie
      en over de kengetallen waarover informatie beschikbaar is of wordt verstrekt.

      4 Een algemene maatregel van bestuur als bedoeld in het tweede en derde lid treedt niet eerder in werking dan 12
      maanden na de datum van uitgifte van het Staatsblad waarin zij is geplaatst.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel103a
  - number: 103b
    text: |-
      1 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling gebruiken in het verkeer met de leerling op
      wie het nummer betrekking heeft, of, indien de leerling minderjarig is, met de ouders van deze leerling.

      2 Het bevoegd gezag verstrekt het persoonsgebonden nummer van iedere leerling aan de Informatie Beheer Groep,
      tezamen met de volgende gegevens van de leerling:

      a. de postcode van de woonplaats;

      b. de datum van in- of uitschrijving;

      c. de soort onderwijs;

      d. indien van toepassing de leerweg, de sector, de afdeling of het profiel;

      e. het leerjaar;

      f. het behaalde diploma;

      g. de vakken waarin examen is afgelegd, de cijfers van het schoolexamen en het centraal examen, de eindcijfers en
      de uitslag van het eindexamen of deeleindexamen;

      h. indien van toepassing de aanduiding van de minderheidsgroep en de verblijfsduur in Nederland, voorzover de
      desbetreffende minderheidsgroep of verblijfsduur als categorie is opgenomen in een ministeriële regeling waarin
      voorschriften zijn vastgesteld omtrent toekenning van een aanvullende vergoeding voor personeelskosten als bedoeld
      in [artikel 85a, eerste lid][ref1]; en

      i. het registratienummer van de school dan wel scholengemeenschap of, indien sprake is van een nevenvestiging, het
      registratienummer daarvan.

      3 Bij ministeriële regeling kan een nadere specificatie worden gegeven van de gegevens, bedoeld in het tweede lid.
      Bij ministeriële regeling kunnen voorts regels worden gesteld omtrent de tijdstippen en de wijze van verstrekking
      van de gegevens, bedoeld in het tweede lid.

      4 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling, al dan niet tezamen met een of meer van de
      gegevens, bedoeld in het tweede lid, gebruiken in het verkeer met Onze minister ten behoeve van de vaststelling van
      de bekostiging van de school.

      5 Het bevoegd gezag en het hoofd, bedoeld in [artikel 1, onder d, van de Leerplichtwet 1969][ref2],
      gebruiken het persoonsgebonden nummer van een leerling in contacten met een gemeente in het kader van de
      [Leerplichtwet 1969][ref3], tezamen met de gegevens die noodzakelijk zijn voor het toezicht op de naleving van
      [die wet][ref4] door de gemeente.

      6 Het bevoegd gezag gebruikt bij de opgave aan burgemeester en wethouders, bedoeld in
      [artikel 28, eerste lid][ref5], het persoonsgebonden nummer van de betrokkene.

      7 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het contact met een andere school of
      een school of instelling voor ander onderwijs ten behoeve van de in- en uitschrijving van die leerling.

      8 Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een leerling ter uitvoering van
      [artikel 107, tweede en vijfde lid, van de Vreemdelingenwet 2000][ref6].


