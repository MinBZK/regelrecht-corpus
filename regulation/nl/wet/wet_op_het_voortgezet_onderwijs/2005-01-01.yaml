  - number: '101'
    text: |-
      1 Indien gebouwen, terreinen of roerende zaken van andere vormen van voortgezet onderwijs als bedoeld in
      [afdeling IV van titel II][ref1], ten behoeve waarvan bekostiging in de huisvestingskosten of inventariskosten is
      genoten, geheel of gedeeltelijk aan hun bestemming worden onttrokken of met toestemming van Onze minister worden
      vervreemd, anders dan bedoeld in de [artikelen 42c][ref2] en [50][ref3], dan wel indien de bekostiging wordt
      beëindigd, is de gemeente dan wel de rechtspersoon aan het Rijk een bedrag verschuldigd. Het bevoegd gezag kan,
      buiten het geval van vervreemding, in de plaats van betaling van dit bedrag de eigendom van die gebouwen, terreinen
      of roerende zaken binnen vier maanden aan het Rijk overdragen.

      2 Onze minister stelt het bedrag, bedoeld in het eerste lid, vast op de grondslag van de waarde van de gebouwen,
      terreinen of roerende zaken en de door het bevoegd gezag daarvoor ontvangen bekostiging en uit eigen middelen
      bestede gelden.

      3 Bij overdracht van de eigendom van gebouwen, terreinen of roerende zaken ingevolge het eerste lid vergoedt het
      Rijk, indien gedeelten van de gebouwen, terreinen of roerende zaken uit eigen middelen zijn betaald en hiervoor
      geen bekostiging werd genoten, een door Onze minister te bepalen waarde.

      4

      5 Volgens regelen te stellen bij algemene maatregel van bestuur kan van de voorgaande leden worden afgeweken,
      wanneer het betreft tijdelijke voorzieningen in gebouwen of terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#AfdelingIV
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel42c
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel50
