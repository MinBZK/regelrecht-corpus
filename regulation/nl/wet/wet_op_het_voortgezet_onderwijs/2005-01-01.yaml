  - number: '34'
    text: |-
      1 De bewijzen van bekwaamheid, bedoeld in [artikel 33, eerste lid onder b][ref1], worden onderscheiden in bewijzen
      van bekwaamheid van de eerste en van de tweede graad.

      2 De bewijzen van bekwaamheid worden aangewezen bij algemene maatregel van bestuur. Bij de aanwijzing worden de
      graad van het bewijs van bekwaamheid en het vak of de combinatie van vakken waarvoor het bewijs van bekwaamheid
      geldt, vermeld.

      3 Aan de aanwijzing, bedoeld in het tweede lid, kunnen voorwaarden met betrekking tot de inhoud van de gevolgde
      studie en de opgedane praktijkervaring worden verbonden.

      4 De algemene maatregel van bestuur, bedoeld in het tweede lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken, en
      gedurende die termijn niet door of namens de Kamer de wens wordt te kennen gegeven tot overleg over het onderwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel33
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel34
