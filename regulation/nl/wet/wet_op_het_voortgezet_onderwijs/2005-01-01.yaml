  - number: 75a
    text: |-
      1 Het bevoegd gezag dat voornemens is met ingang van 1 augustus van een van de schooljaren 1993/1994, 1994/1995
      of 1995/1996 een omzetting, splitsing, verplaatsing of nevenvestiging van een school tot stand te brengen, doet
      voor een door Onze minister te bepalen tijdstip voorafgaand aan het desbetreffende schooljaar een verzoek aan
      Onze minister tot opneming in het door provinciale staten op te stellen advies voor omzettingen, splitsingen,
      verplaatsingen en nevenvestigingen. Onze minister zendt het verzoek ter advisering aan provinciale staten.

      2 Provinciale staten stellen jaarlijks, voor de in het eerste lid bedoelde schooljaren, de daarvoor in aanmerking
      komende bevoegde gezagsorganen van belanghebbende scholen gehoord, het advies, bedoeld in het eerste lid op. Aan
      het advies worden toegevoegd de verzoeken die niet zijn ingewilligd en de motivering daarvan. Tevens wordt aan het
      advies toegevoegd een opgave van de bedenkingen die door de in de eerste volzin bedoelde bevoegde gezagsorganen
      tegen het advies zijn ingebracht en de door provinciale staten daarop genomen beslissing. Provinciale staten
      zenden het advies voor een door Onze minister te bepalen tijdstip aan Onze minister en maken het voor een door Onze
      minister te bepalen tijdstip bekend in de Staatscourant. Zij zenden tevens een verslag omtrent de totstandkoming
      van de in het derde lid, onderdeel a bedoelde scholengemeenschappen aan Onze minister.

      3 Een verzoek als bedoeld in het eerste lid wordt slechts in het advies, bedoeld in dat lid opgenomen, indien:

      a. het verzoek wordt gedaan door het bevoegd gezag van een scholengemeenschap die met ingang van een van de in het
      eerste lid genoemde tijdstippen tot stand komt,

      b. aan een nevenvestiging in elk geval basisvorming wordt gegeven,

      c. een nevenvestiging wordt verbonden aan de in onderdeel a bedoelde scholengemeenschap waarin in ieder geval tot
      een school zijn verenigd een school voor voorbereidend beroepsonderwijs, waaraan ten minste twee afdelingen uit
      verschillende groepen, bedoeld in artikel 10a, tweede lid, de onderdelen a tot en met g, dan wel h tot en met l,
      dan wel m, dan wel n tot en met o, dan wel p, zijn verbonden, alsmede ten minste twee van de volgende scholen: een
      school voor middelbaar algemeen voortgezet onderwijs, een school voor hoger algemeen voortgezet onderwijs en een
      school voor voorbereidend wetenschappelijk onderwijs,

      d. het tot stand brengen van een omzetting, splitsing, verplaatsing of nevenvestiging niet leidt tot een verstoring
      van het evenwichtig geheel van onderwijsvoorzieningen naar soort van onderwijs, mede gelet op het verlangde
      onderwijs in het betrokken gebied, en

      e. de nevenvestiging zal worden bezocht door tenminste 120 leerlingen.

      4 Onze minister stelt, de daarvoor in aanmerking komende organisaties gehoord, vóór een door Onze minister te
      bepalen tijdstip een overzicht van omzettingen, splitsingen, en verplaatsingen vast en stelt in dat overzicht
      tevens vast welke nevenvestigingen voor bekostiging uit 's Rijks kas in aanmerking zullen worden gebracht. Bij
      de vaststelling van dit overzicht toetst Onze minister of het tot stand brengen van een omzetting, splitsing,
      verplaatsing of nevenvestiging niet leidt tot een verstoring van het evenwichtig geheel van voorzieningen,
      mede gelet op het verlangd onderwijs in alle betrokken gebieden. Het overzicht wordt binnen twee weken na de
      vaststelling in de Staatscourant bekendgemaakt en toegezonden aan de bevoegde gezagsorganen die een verzoek tot
      opneming in het overzicht hebben gedaan. Indien aan een verzoek tot opneming in het overzicht geen gevolg is
      gegeven, wordt de motivering hiervan vermeld bij de bekendmaking aan de aanvrager. Tegen een besluit van Onze
      minister ingevolge dit artikel kan een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de
      Raad van State. Indien beroep is ingesteld en de uitspraak strekt tot opneming van de gevraagde voorziening in het
      overzicht, neemt Onze minister de gevraagde voorziening op in het eerste na de uitspraak vast te stellen overzicht.

      5 Het bevoegd gezag van een scholengemeenschap waarin in ieder geval tot één school zijn verenigd een school voor
      middelbaar algemeen voortgezet onderwijs en een school voor voorbereidend beroepsonderwijs waaraan ten minste
      twee afdelingen uit verschillende groepen, bedoeld in artikel 10a, tweede lid, de onderdelen a tot en met g dan
      wel h tot en met l dan wel m, dan wel n tot en met o, dan wel p zijn verbonden, kan eveneens een verzoek tot
      instandhouding van een nevenvestiging doen. Een verzoek als bedoeld in de eerste volzin wordt slechts in het
      advies, bedoeld in het eerste lid opgenomen, indien:

      a. het bevoegd gezag als bedoeld in de aanhef, eerste volzin tevens bevoegd gezag is van een scholengemeenschap
      waarin in ieder geval tot één school zijn verenigd een school voor hoger algemeen voortgezet onderwijs en een
      school voor voorbereidend wetenschappelijk onderwijs,

      b. het bevoegd gezag aantoont dat er afspraken tot stand zijn gebracht tussen de scholengemeenschap, bedoeld in
      de aanhef, eerste volzin en de scholengemeenschap bedoeld onder a, met het oog op het verkrijgen van een goede
      aansluiting op vervolgonderwijs voor de leerlingen van de eerstbedoelde scholengemeenschap,

      c. aan de nevenvestiging in elk geval basisvorming wordt verzorgd,

      d. de nevenvestiging zal worden bezocht door tenminste 120 leerlingen,

      e. het tot stand brengen van de nevenvestiging niet leidt tot een verstoring van het evenwichtig geheel van
      onderwijsvoorzieningen naar soort van onderwijs, mede gelet op het verlangde onderwijs in het betrokken gebied, en

      f. de nevenvestiging tot stand wordt gebracht met ingang van 1 augustus van een van de schooljaren 1993/1994,
      1994/1995 of 1995/1996.

      Het eerste, tweede en vierde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel75a
  - number: 75b
    text: |-
      1 Onze minister kan in bijzondere gevallen cursussen voortgezet onderwijs, niet zijnde voorbereidend
      beroepsonderwijs, geheel of gedeeltelijk en voor een door hem te bepalen periode voor bekostiging in aanmerking
      brengen, indien naar zijn oordeel daaraan behoefte bestaat.

      2 Onze minister kan aan de bekostiging verplichtingen verbinden.

      3 Onze minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel75b
  - number: 75c
    text: |-
      1 Leerwegondersteunend onderwijs komt voor bekostiging in aanmerking voor zover de school of een
      daaraan uiterlijk op 1 augustus 2002 verbonden school of afdeling voor bekostiging van dat onderwijs in
      aanmerking kwam op grond van [artikel II, eerste of tweede lid][ref1], [artikel IV, eerste lid][ref2], of
