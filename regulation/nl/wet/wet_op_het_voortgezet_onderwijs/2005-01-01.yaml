  - number: '29'
    text: |-
      1 Aan de leerlingen van de scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger algemeen voortgezet
      onderwijs, voor middelbaar algemeen voortgezet onderwijs en voor voorbereidend beroepsonderwijs wordt gelegenheid
      gegeven aan deze scholen een eindexamen af te leggen, tenzij in de plaats daarvan de gelegenheid bestaat tot het
      afleggen van een eindexamen, dat niet vanwege de school wordt afgenomen en het bevoegd gezag in verband hiermede
      een eindexamen aan de school niet nodig oordeelt.

      2 Het eindexamen wordt afgenomen door de rector, de directeur, de conrector, de adjunct-directeur of een of
      meer leden van de centrale directie en leraren van de school onder toezicht, behoudens in nader bij algemene
      maatregel van bestuur te noemen gevallen, van een of meer door de Informatie Beheer Groep, dan wel, voor zover het
      landbouwonderwijs betreft, Onze Minister van Landbouw, Natuur en Voedselkwaliteit aan te wijzen gecommitteerden.
      Het eindexamen kan mede worden afgenomen door deskundigen. Het bevoegd gezag wijst de deskundigen aan.

      3 Zij die het eindexamen met goed gevolg hebben afgelegd, ontvangen een diploma. Leerlingen van een school
      voor voorbereidend beroepsonderwijs voor zover het betreft de basisberoepsgerichte leerweg, die met goed gevolg
      een gedeelte van het examenprogramma hebben afgelegd, ontvangen een getuigschrift voorbereidend middelbaar
      beroepsonderwijs en leerlingen die een leer-werktraject met goed gevolg afsluiten, ontvangen een diploma
      basisberoepsgerichte leerweg/leer-werktraject. Onze minister stelt de modellen van diploma's en getuigschriften
      vast.

      4 Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in dit artikel
      bedoelde eindexamens, alsmede omtrent programma-onderdelen, die niet voor alle leerlingen van een school dezelfde
      vakken, deelvakken en andere programma-onderdelen behoeven te omvatten. Bij deze algemene maatregel van bestuur
      worden tevens de eindexamenprogramma's vastgesteld. De algemene maatregel van bestuur, bedoeld in de vorige
      volzinnen, wordt aan de beide Kamers der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat
      vier weken na de overlegging zijn verstreken en niet door of namens een van beide Kamers de wens wordt te kennen
      gegeven dat het in die maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend
      wetsvoorstel zo spoedig mogelijk ingediend.

      5 Voor examens, die niet vanwege de school worden afgenomen, kunnen bij algemene maatregel van bestuur
      voorschriften worden gegeven.

      6 Ten behoeve van de bijzondere inrichting van het onderwijs aan een school kan Onze minister toestaan dat wordt
      afgeweken van het bepaalde bij of krachtens dit artikel. Onze minister besluit binnen zes maanden na ontvangst van
      een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze minister de aanvrager
      daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel29
  - number: 29a
    text: |-
      Leerlingen die een school voor praktijkonderwijs verlaten, ontvangen een getuigschrift praktijkonderwijs, met dien
      verstande dat het bevoegd gezag aan leerlingen die de opleiding hebben afgerond en daarvoor naar het oordeel van
      het bevoegd gezag in aanmerking komen, een schooldiploma praktijkonderwijs kan uitreiken. Onze minister stelt het
      model van het getuigschrift vast.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel29a
  - number: '30'
    text: |-
      1 Een diploma als bedoeld in [artikel 29, derde lid][ref1], kan ook worden uitgereikt aan degenen die niet als
      leerlingen van een school zijn ingeschreven, maar tot het eindexamen van die school zijn toegelaten en dit met
      gunstig gevolg hebben afgelegd.

      2 Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de in het eerste lid bedoelde
      toelating tot het eindexamen. Daarbij wordt vastgesteld in welke gevallen een bedrag aan het bevoegd gezag
      verschuldigd is, alsmede de hoogte daarvan.


