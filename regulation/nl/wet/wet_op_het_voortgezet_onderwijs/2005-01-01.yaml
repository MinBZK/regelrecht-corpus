  - number: 96m
    text: |-
      1 Het bedrag van de bekostiging waarop het bevoegd gezag over een kalenderjaar aanspraak heeft, stelt Onze minister
      vast op de som van de overeenkomstig het bepaalde in dit hoofdstuk verstrekte bekostiging en betaalde bedragen.

      2 Op het in het eerste lid bedoelde bedrag worden in mindering gebracht:

      a. de inkomsten die het bevoegd gezag geniet uit cursusgelden als bedoeld in de [Les- en cursusgeldwet][ref1] (Stb.
      1987, 343),

      b. de inkomsten die het bevoegd gezag geniet uit verhaal van wettelijk verschuldigde bedragen en premies,

      c. de door Onze minister vast te stellen waarde van roerende zaken die door vervreemding of op andere wijze worden
      onttrokken aan de bestemming, waartoe zij met de vergoeding zijn aangeschaft,

      d. de opbrengst van werkstukken en van verrichte diensten anders dan in het kader van contractactiviteiten, en

      e. de opbrengst die het bevoegd gezag geniet uit verhuur van gebouwen, terreinen en roerende zaken waarvoor
      bekostiging wordt genoten, dan wel als vergoeding voor veroorzaakte kosten bij het doen gebruiken daarvan anders
      dan wegens verhuur, een en ander volgens bij ministeriële regeling te stellen regels.

      3 Het bepaalde in het tweede lid, onder e, is slechts van toepassing op andere vormen van voortgezet onderwijs als
      bedoeld in [afdeling IV van titel II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004188
      [ref2]: https://wetten.overheid.nl/BWBR0002399#AfdelingIV
