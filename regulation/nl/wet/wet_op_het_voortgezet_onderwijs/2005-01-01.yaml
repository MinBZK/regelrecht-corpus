  - number: 118a
    text: |-
      1 Bij algemene maatregel van bestuur wordt voor een periode van telkens 4 schooljaren een landelijk beleidskader
      vastgesteld. De algemene maatregel van bestuur, bedoeld in de eerste volzin, wordt aan de beide kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en
      gedurende die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die
      maatregel geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig
      mogelijk ingediend. Het bepaalde in de vorige drie volzinnen is niet van toepassing, voor zover het ontwerp van de
      algemene maatregel van bestuur voordien aan beide kamers der Staten-Generaal is overgelegd en door of namens een
      der kamers te kennen is gegeven dat van de procedure, bedoeld in de tweede tot en met vierde volzin, kan worden
      afgeweken.

      2 Het landelijk beleidskader vermeldt de landelijke doelstellingen van het beleid inzake
      onderwijsachterstandenbestrijding en verstrekt informatie over de voornemens van de rijksoverheid met betrekking
      tot de landelijke evaluatie van het beleid inzake onderwijsachterstandenbestrijding.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel118a
  - number: 118b
    text: |-
      1 De gemeenteraad stelt voor een periode van telkens 4 schooljaren een plan vast, onderwijsachterstandenplan
      genaamd, ter bestrijding van onderwijsachterstanden. Indien het totaal van de voor de bestrijding van
      onderwijsachterstanden bestemde middelen, bedoeld in het vierde lid, onderdelen a en c, minder is dan € 113 500,
      kan de gemeenteraad afzien van de vaststelling van het plan. In dat geval besluit de gemeenteraad op andere wijze
      omtrent de verdeling van de middelen, bedoeld in het vierde lid, onderdelen a en b, waarbij de gemeenteraad het
      landelijk beleidskader in acht neemt.

      2 Onder onderwijsachterstanden worden verstaan die negatieve effecten op de leer- en ontwikkelingsmogelijkheden van
      leerlingen, die het gevolg zijn van sociale, economische en culturele omstandigheden.

      3 Het onderwijsachterstandenplan vermeldt in elk geval:

      a. de wijze waarop de doelstellingen, genoemd in het landelijk beleidskader, bedoeld in [artikel 118a][ref1], in
      kwalitatieve en kwantitatieve zin worden uitgewerkt,

      b. de wijze waarop de voor de bestrijding van onderwijsachterstanden bestemde middelen, anders dan de in onderdeel
      c genoemde middelen, worden ingezet, alsmede de scholen en instellingen die de daaruit voortvloeiende activiteiten
      zullen verrichten,

      c. de wijze waarop de scholen de door hen ontvangen middelen in het kader van onderwijsachterstandenbestrijding
      inzetten, voor zover het betreft de aanvullende bekostiging voor personeelskosten in verband met bijzondere groepen
      leerlingen, verstrekt op grond van [artikel 85a][ref2], anders dan de middelen bestemd voor:

      1°. tussentijdse instroom van leerlingen in het voorafgaand schooljaar,

      2°. herberekening van middelen, en

      3°. tussentijdse instroom van leerlingen in het lopend schooljaar, met dien verstande dat de scholen de zeggenschap
      hebben over de wijze waarop dit wordt geoperationaliseerd,

      d. de wijze waarop de scholen verantwoording afleggen over de inzet van de in onderdeel c bedoelde middelen in
      overeenstemming met het plan en de wijze waarop de scholen en instellingen rekening en verantwoording afleggen
      inzake de besteding van de middelen, bedoeld in het vierde lid, onderdelen a en b,

      e. de procedure met betrekking tot de wijziging van het plan, en

      f. de wijze waarop de gemeenteraad het gemeentelijk onderwijsachterstandenbeleid evalueert.

      4 Het onderwijsachterstandenplan vermeldt tevens de omvang van de voor de bestrijding van onderwijsachterstanden
      bestemde middelen, waarbij onderscheid wordt gemaakt tussen:

      a. de middelen die de gemeente als specifieke uitkering, bedoeld in [artikel 118d][ref3], uit 's Rijks kas ontvangt
      voor de bestrijding van onderwijsachterstanden,

      b. de middelen, anders dan bedoeld in onderdeel a, die de gemeenteraad bestemt voor de bestrijding van
      onderwijsachterstanden, en

      c. de middelen, bedoeld in het derde lid, onderdeel c, die de scholen ontvangen.

      De gemeenteraad kan de onderdelen a en c van het plan, voor zover het betreft een aanpassing als gevolg van de
      wijziging van de omvang van deze middelen, zonder toepassing van het zesde lid wijzigen, indien het voornemen tot
      wijziging is bekend gemaakt en niet binnen vier weken na de bekendmaking door ten minste een bevoegd gezag van een
      in de gemeente gelegen school is verzocht om het op overeenstemming gericht overleg te doen plaatsvinden.

      5 Het onderwijsachterstandenplan heeft betrekking op:

      a. basisscholen en speciale scholen voor basisonderwijs,

      b. scholen als bedoeld in de [Wet op de expertisecentra][ref4],

      c. scholen als bedoeld in deze wet, en

      d. andere instellingen.

      Voor de toepassing van deze titel wordt met een school gelijkgesteld een op het grondgebied van de gemeente gelegen
      nevenvestiging van een school waarvan de hoofdvestiging in een andere gemeente is gelegen.

      6 Vaststelling en wijziging van het onderwijsachterstandenplan of het nemen van een besluit omtrent de verdeling
      van middelen indien wordt afgezien van vaststelling van het plan, geschiedt niet dan na op overeenstemming
      gericht overleg met de bevoegde gezagsorganen van alle scholen in de gemeente. De gemeenteraad stelt daartoe bij
      verordening een procedure vast, met dien verstande dat in de verordening in ieder geval wordt bepaald:

      a. vanaf wanneer en tot welk moment het gemeentebestuur de Onderwijsraad kan verzoeken een advies als bedoeld in
      het tiende lid, uit te brengen,

      b. dat de termijn voor het uitbrengen van het advies wordt opgeschort met ingang van de dag waarop de Onderwijsraad
      het gemeentebestuur uitnodigt het verzoek voor het uitbrengen van het advies aan te vullen met de gegevens die de
      Onderwijsraad nodig heeft voor een goede vervulling van diens taak, tot de dag waarop het verzoek is aangevuld, en

      c. dat het gemeentebestuur gedurende de termijn voor het uitbrengen van het advies geen besluit neemt.

      Bij het overleg kunnen door het gemeentebestuur andere instellingen worden betrokken.

      7 Binnen een jaar na de vaststelling van het landelijk beleidskader, bedoeld in [artikel 118a][ref5], stelt de
      gemeenteraad het onderwijsachterstandenplan vast.

      8 Het onderwijsachterstandenplan kan tussentijds worden gewijzigd.

      9 Indien de vaststelling en wijziging van het onderwijsachterstandenplan of een besluit omtrent de verdeling van
      middelen indien wordt afgezien van vaststelling van het plan, leiden tot kosten van werkloosheidsuitkeringen, komen
      deze kosten ten laste van het Rijk indien het ontstaan van deze kosten in redelijkheid is toe te rekenen aan het
      Rijk.

      10 Tijdens het in het zesde lid bedoelde overleg kan de gemeenteraad de Onderwijsraad verzoeken een advies uit
      te brengen over de vaststelling of wijziging van het onderwijsachterstandenplan in relatie tot de vrijheid van
      richting en de vrijheid van inrichting. Het verzoek wordt gedaan indien het bevoegd gezag hierom heeft gevraagd
      dan wel uit eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht.
      Het advies wordt binnen vier weken uitgebracht aan de gemeenteraad. Het advies wordt bekend gemaakt tezamen met
      het plan. Dit lid is van overeenkomstige toepassing op een besluit omtrent de verdeling van middelen indien wordt
      afgezien van vaststelling van het plan.

      11 Het gemeentebestuur kan een subsidieplafond vaststellen en bepalen hoe het beschikbare bedrag met inachtneming
      daarvan wordt verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel85a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel118d
      [ref4]: https://wetten.overheid.nl/BWBR0003549
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel118a
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel118b
