  - number: 118c
    text: |-
      Ten behoeve van leerlingen van 14 jaar en ouder die behoren tot een van de groepen leerlingen, bedoeld in
      [artikel 37 van het Inrichtingsbesluit W.V.O.][ref1], en die voor de eerste maal als leerling aan een Nederlandse
      school zijn ingeschreven, kunnen activiteiten worden verricht die zijn gericht op een verbeterde doorstroming
      naar het vervolgonderwijs indien dit van belang is in verband met activiteiten in het kader van het voorkomen en
      bestrijden van onderwijsachterstanden. De activiteiten kunnen zonodig afwijken van het bepaalde bij of krachtens de
      [artikelen 11a tot en met 11f][ref2] en [22][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel37
