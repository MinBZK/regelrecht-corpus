  - number: 77a
    text: |-
      1 Indien op verzoek van de ouders van een leerling voor wie op basis van een beoordeling door een commissie voor
      de indicatiestelling als bedoeld in [artikel 28c van de Wet op de expertisecentra][ref1], een leerlinggebonden
      budget beschikbaar is, die leerling wordt ingeschreven bij een school, meldt het bevoegd gezag van die school die
      inschrijving aan Onze minister.

      2 Indien sprake is van een eerste inschrijving bij een school als leerling voor wie een leerlinggebonden budget
      beschikbaar is, wordt met ingang van de eerste dag van de maand volgend op de in het eerste lid bedoelde melding
      aan het bevoegd gezag van die school ten behoeve van die leerling een leerlinggebonden budget toegekend, dat wordt
      berekend op een bij algemene maatregel van bestuur vastgestelde wijze. De omvang van het leerlinggebonden budget
      is afhankelijk van de onderwijssoort waarvoor de leerling toelaatbaar is verklaard en van de onderwijssoort van
      de school waarbij de leerling wordt ingeschreven. In de vorige volzin wordt met de onderwijssoort van de school
      waarbij de leerling is ingeschreven tevens bedoeld het toegelaten zijn tot het leerwegondersteunend onderwijs.

      3 Indien ten behoeve van een leerling voor wie een leerlinggebonden budget beschikbaar is in het lopende schooljaar
      dat budget aan het bevoegd gezag van een school is toegekend, wordt bij inschrijving van die leerling bij een
      andere school, het in het tweede lid bedoelde leerlinggebonden budget aan het bevoegd gezag van laatstbedoelde
      school toegekend met ingang van het nieuwe schooljaar.

      4 Het bevoegd gezag van de school is verplicht een bij algemene maatregel van bestuur te bepalen deel van het
      leerlinggebonden budget te besteden bij een school als bedoeld in de Wet op de expertisecentra waarbinnen onderwijs
      wordt gegeven van de soort waarvoor de leerling toelaatbaar is verklaard. Het in de eerste volzin bedoelde deel kan
      voor de onderwijssoorten, bedoeld in [artikel 2, tweede lid, van de Wet op de expertisecentra][ref2], verschillend
      worden vastgesteld. De eerste volzin is van overeenkomstige toepassing ten aanzien van een leerling die toelaatbaar
      is verklaard tot het cluster, bedoeld in [artikel 2, vierde lid onder d, van de Wet op de expertisecentra][ref3].

      5 Bij de melding, bedoeld in het eerste lid, geeft het bevoegd gezag tevens aan bij welke school bedoeld
      in de [Wet op de expertisecentra][ref4] het in het vierde lid bedoelde deel van het leerlinggebonden budget
      wordt besteed. Op grond van deze melding kent Onze minister dat deel van het leerlinggebonden budget toe aan
      laatstbedoelde school.

      6 Een krachtens het tweede en vierde lid vastgestelde algemene maatregel van bestuur wordt aan de Tweede Kamer
      der Staten-Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat 4 weken na de overlegging zijn
      verstreken bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens de kamer de wens te
      kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval
      wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. De vorige 3 volzinnen zijn niet van
      toepassing, voor zover het ontwerp van een algemene maatregel van bestuur voordien aan de Tweede Kamer der Staten-
      Generaal is voorgelegd en door of namens de kamer te kennen is gegeven dat van de procedure, bedoeld in de vorige 3
      volzinnen, kan worden afgeweken.


