  - number: '72'
    text: |-
      Indien op grond van [artikel 75c1][ref1] beroep is ingesteld tegen:

      a. een besluit omtrent het vervallen van een school uit het plan, anders dan op verzoek van de aanvrager op grond
      van [artikel 67, vierde lid][ref2], of

      b. een besluit waarbij aan een verzoek tot opneming van een school in het plan geen gevolg is gegeven,

      en de uitspraak strekt tot opneming van een school in het plan van scholen, neemt Onze minister de school op in het
      eerste na de uitspraak vast te stellen plan van scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel75c1
