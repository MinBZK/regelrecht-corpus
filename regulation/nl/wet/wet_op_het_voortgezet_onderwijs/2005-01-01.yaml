  - number: 118h
    text: |-
      1 Burgemeester en wethouders dragen zorg voor registratie van de gegevens die het bevoegd gezag ingevolge artikel
      28 heeft gemeld. Burgemeester en wethouders dragen bovendien zorg voor een systeem van doorverwijzing naar
      onderwijs of arbeidsmarkt van de in artikel 118g bedoelde voortijdige schoolverlaters en voor het onderhoud van
      dit systeem. Het systeem heeft mede betrekking op de gegevens waarover de gemeente beschikt in het kader van
      de uitvoering van de [Leerplichtwet 1969][ref1]. Voor de uitvoering van de eerste en tweede volzin kunnen bij
      ministeriële regeling nadere voorschriften worden vastgesteld.

      2 Voor de vervulling van hun in het eerste lid bedoelde taken werken de colleges van burgemeester en wethouders
      samen binnen bij of krachtens algemene maatregel van bestuur vastgestelde regio's. Zij maken tevens afspraken
      met scholen, instellingen als bedoeld in de [Wet educatie en beroepsonderwijs][ref2], scholen en instellingen als
      bedoeld in de [Wet op de expertisecentra][ref3] en organisaties die zijn betrokken bij het voorkomen en bestrijden
      van voortijdig schoolverlaten.

      3 De gemeentebesturen in een regio wijzen uit hun midden een contactgemeente aan. Deze aanwijzing wordt onverwijld
      gemeld aan Onze Minister. Burgemeester en wethouders van de contactgemeente vervullen coördinerende taken met het
      oog op het voorkomen en bestrijden van voortijdig schoolverlaten. In dat verband:

      a. maken zij afspraken met de in het tweede lid bedoelde scholen, instellingen en organisaties over de inzet en
      verantwoordelijkheid bij het voorkomen en bestrijden van voortijdig schoolverlaten;

      b. dragen zij zorg voor de totstandkoming van een regionaal netwerk van die scholen, instellingen en organisaties;

      c. organiseren en coördineren zij de in het eerste lid bedoelde melding, registratie en doorverwijzing.

      4 Indien gemeentebesturen in een regio een andere contactgemeente aanwijzen, dragen burgemeester en wethouders
      van de vorige contactgemeente alle bescheiden die betrekking hebben op de uitvoering van dit artikel over aan
      burgemeester en wethouders van de opvolgende contactgemeente. De wijziging van de aanwijzing wordt onverwijld
      gemeld aan Onze Minister.

      5 Ter tegemoetkoming in de kosten van uitvoering van het eerste tot en met derde lid kent Onze Minister binnen
      het raam van de door de begrotingswetgever beschikbaar gestelde middelen jaarlijks uiterlijk in september ten
      behoeve van de activiteiten van de gemeentebesturen in de regio aan de contactgemeente een specifieke uitkering
      toe. Deze uitkering heeft betrekking op het daarop volgende kalenderjaar. De contactgemeente draagt er zorg voor
      dat de gemeentebesturen in de regio gebruik kunnen maken van de instrumenten die met behulp van deze uitkering
      zijn verwezenlijkt. Bij of krachtens algemene maatregel van bestuur worden regels gegeven voor de berekening en
      betaling van de uitkering. De berekening geschiedt in elk geval aan de hand van het aantal volwassen inwoners van
      de gemeenten in de regio op 1 januari van het jaar voorafgaande aan het jaar van de uitkering, waarbij rekening
      wordt gehouden met het opleidingsniveau en met de etnische achtergrond van die inwoners. Bij de berekening van een
      deel van de uitkering kunnen de volwassen inwoners van gemeenten die op grond van een andere regeling reeds een
      vergoeding voor de bestrijding van voortijdig schoolverlaten ontvangen, buiten beschouwing worden gelaten. Onze
      Minister hanteert het aantal volwassen inwoners van de gemeenten in de regio dat blijkt uit de gegevens die het
      Centraal Bureau voor de Statistiek op verzoek van Onze Minister daarover verstrekt.

      6 Het bevoegd gezag geeft aan de door de gemeenteraad aangewezen personen alle gevraagde bescheiden ter inzage
      en verstrekt de gevraagde inlichtingen die van belang zijn voor het voorkomen en bestrijden van voortijdig
      schoolverlaten.

      7 De gemeentebesturen in een regio stellen streefcijfers vast voor de in die regio te behalen resultaten.
      Burgemeester en wethouders van de contactgemeente stellen mede namens de andere gemeenten in de regio jaarlijks
      een effectrapportage vast waarin zowel de streefcijfers als de bereikte resultaten zijn aangegeven en waarin
      afwijkingen worden toegelicht.

      8 Indien burgemeester en wethouders van de contactgemeente het bepaalde bij of krachtens het eerste tot en met
      zevende lid niet nakomen, kan Onze Minister de uitkering geheel of gedeeltelijk inhouden of opschorten. Onze
      Minister gaat niet over tot gehele of gedeeltelijke inhouding dan na overleg met burgemeester en wethouders van
      de contactgemeente. Onze Minister kan de uitkering wederom toekennen indien de reden voor inhouding of opschorting
      is vervallen.

      9 Onze Minister kan de in het vijfde lid bedoelde uitkering geheel of gedeeltelijk terugvorderen
      indien uit de rekening van de gemeente, bedoeld in artikel [197 van de Gemeentewet][ref4], het
      gemeentelijk verslag omtrent het financieel beheer, bedoeld in [artikel 197 van de Gemeentewet][ref5],
      het verslag van de accountant, bedoeld in [artikel 213, tweede lid, van de Gemeentewet][ref6], dan wel
      uit een afzonderlijke verantwoording, voorzien van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref7], niet blijkt dat de uitkering is besteed in
      overeenstemming met de bepalingen van dit artikel.


