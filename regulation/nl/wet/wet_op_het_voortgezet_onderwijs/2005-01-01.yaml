  - number: 10f
    text: |-
      1 Praktijkonderwijs wordt gegeven aan scholen voor praktijkonderwijs, alsmede aan afdelingen voor
      praktijkonderwijs, verbonden aan scholen voor voorbereidend beroepsonderwijs en aan scholengemeenschappen waarvan
      ten minste een school voor voorbereidend beroepsonderwijs deel uitmaakt.

      2 Praktijkonderwijs is onderwijs voor leerlingen voor wie vaststaat dat

      a. overwegend een orthopedagogische en orthodidactische benadering is geboden, en

      b. het volgen van het onderwijs in een van de leerwegen, genoemd in de [artikelen 10][ref1], [10b][ref2]
      en [10d][ref3], al dan niet in combinatie met het volgen van leerwegondersteunend onderwijs, bedoeld in
      [artikel 10e][ref4], niet leidt tot het behalen van een diploma of een getuigschrift voorbereidend middelbaar
      beroepsonderwijs als bedoeld in [artikel 29][ref5].

      3 Praktijkonderwijs bestaat uit een gedeelte waarin aangepast theoretisch onderwijs, persoonlijkheidsvorming en
      het aanleren van sociale vaardigheden worden verzorgd, en een gedeelte waarin de leerling wordt voorbereid op
      het uitoefenen van functies op de arbeidsmarkt. Praktijkonderwijs wordt zodanig ingericht dat de kerndoelen van
      de basisvorming zo veel mogelijk kunnen worden bereikt. Praktijkonderwijs bereidt de leerling voor op functies
      binnen de regionale arbeidsmarkt op een niveau dat ligt onder het niveau van de assistentopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref6].

      3a In afwijking van [artikel 11c, eerste lid][ref7], wordt het praktijkonderwijs zodanig ingericht dat de
      leerlingen per schooljaar ten minste 1000 klokuren praktijkonderwijs ontvangen. De leerlingen ontvangen
      per dag ten hoogste 5,5 klokuren praktijkonderwijs, voor zover het betreft aangepast theoretisch onderwijs,
      persoonlijkheidsvorming en het aanleren van sociale vaardigheden.

      4 Het bevoegd gezag van een school voor praktijkonderwijs of van een school met een afdeling voor praktijkonderwijs
      kan, met inachtneming van de tweede volzin van het derde lid en van lid 3a, indien dat ten behoeve van de leerling
      noodzakelijk is, bij het aanbieden van dat onderwijs afwijken van de voorschriften, gegeven bij of krachtens de
      [artikelen 11a tot en met 11c][ref8], [22][ref9] en [29][ref10].

      5 Bij algemene maatregel van bestuur worden voorschriften vastgesteld met betrekking tot de vakken die het
      praktijkonderwijs omvat, alsmede met betrekking tot het aantal uren dat het onderricht in de praktijk van de
      uitoefening van een vak of beroep gedurende een schoolweek ten hoogste omvat.

      6 De in het vijfde lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.


