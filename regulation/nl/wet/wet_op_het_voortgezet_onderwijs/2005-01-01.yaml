  - number: 32a
    text: |-
      1 Aan het hoofd van een school die aan bij algemene maatregel van bestuur te vermelden voorwaarden voldoet, kan het
      bevoegd gezag een centrale directie plaatsen bestaande uit ten hoogste vijf leden, waarvan er een door hem wordt
      benoemd tot voorzitter dan wel zonder benoeming tewerkgesteld als voorzitter. De formatie van de centrale directie
      omvat ten hoogste drie volledige formatieplaatsen.

      2 De centrale directie heeft in naam van het bevoegd gezag de leiding van de voorbereiding en de uitvoering van
      het beleid van de school, alsmede de coördinatie van de dagelijkse gang van zaken en van het beheer van de school.
      Indien toepassing is gegeven aan [artikel 32b][ref1], is de centrale directie tevens met de daar bedoelde taken en
      bevoegdheden belast.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32b
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 32b
        hoofdstuk: I
        paragraaf: '3'
        afdeling: I
  - number: 32b
    text: |-
      Het bevoegd gezag van een school als bedoeld in [artikel 32a, eerste lid][ref1], kan bepalen dat hem bij wettelijk
      voorschrift toekomende taken en bevoegdheden in naam van het bevoegd gezag worden uitgeoefend door de centrale
      directie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel32b
