  - number: 100c
    text: |-
      1 Voor zover gebouwen, terreinen of roerende zaken ten behoeve waarvan bekostiging wordt genoten, die geheel of
      gedeeltelijk tijdelijk niet nodig zijn voor het onderwijs aan de school, niet nodig zijn voor het onderwijs aan een
      andere school voor voortgezet onderwijs of aan een uit 's Rijks kas bekostigde school voor ander onderwijs, dan wel
      voor andere culturele, maatschappelijke of recreatieve doeleinden, kan het bevoegd gezag deze voor ten hoogste een
      jaar, doch uiterlijk tot het einde van het schooljaar, verhuren aan derden ten behoeve van andere doeleinden.

      2 Het bevoegd gezag gaat niet over tot de verhuur bedoeld in het eerste lid indien:

      a. het voorgenomen gebruik zich niet verdraagt met het onderwijs aan de school;

      b. het te verhuren gebouw of gedeelte daarvan bestemd zal zijn voor woon- of bedrijfsruimte in de zin van de
      [vijfde][ref1] en [zesde afdeling van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref2].

      3 Verhuur voor een langere periode dan op grond van het eerste lid toegestaan, behoeft de toestemming van
      Onze Minister, de inspectie gehoord. Onze Minister kan om gewichtige redenen zodanige toestemming weigeren. De
      huurovereenkomst wordt voor een bepaalde tijd aangegaan.

      4 De huurovereenkomst eindigt van rechtswege aan het einde van de overeengekomen termijn. Op de overeenkomst is
      [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref3] niet van toepassing.

      5 Het verhuren van gebouwen of terreinen door het bevoegd gezag in strijd met dit artikel is nietig.

      6 Het eerste tot en met vijfde lid zijn slechts van toepassing op andere vormen van voortgezet onderwijs als
      bedoeld in [afdeling IV van titel II][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling5
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Afdeling6
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
      [ref4]: https://wetten.overheid.nl/BWBR0002399#AfdelingIV
