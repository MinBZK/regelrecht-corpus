  - number: '49'
    text: |-
      1 De bijzondere school staat onder het bestuur van een rechtspersoon met volledige rechtsbevoegdheid die zich het
      geven van onderwijs in de zin van deze wet ten doel stelt zonder daarbij het maken van winst te beogen.

      2 Het schoolbestuur draagt zorg voor een deskundig beheer.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel49
  - number: '50'
    text: |-
      1 De rechtspersoon die een bijzondere school in stand houdt, kan de instandhouding van die school overdragen aan
      een andere rechtspersoon die voldoet aan het bepaalde in [artikel 49, eerste lid][ref1].

      2 De overdracht geschiedt bij notariële akte. Bij deze akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van gebouwen, terreinen en roerende zaken over te dragen. Deze akte geldt tevens als akte van
      levering, bedoeld in [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref2]. In de akte wordt tevens bepaald dat
      de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen benoemt met ingang van de datum
      van overdracht.

      3 Door overdracht met inachtneming van het eerste en tweede lid treedt de verkrijgende rechtspersoon in alle uit de
      wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de school, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.

      4 Voor zover het betreft scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen
      voortgezet onderwijs en voor voorbereidend beroepsonderwijs kan de gemeenteraad in bijzondere omstandigheden
      ontheffing verlenen van de verplichting tot overdracht van de rechten ten aanzien van gebouwen, terreinen en
      roerende zaken. Voor zover het betreft andere vormen van voortgezet onderwijs als bedoeld in [afdeling IV][ref3]
      van deze wet kan Onze minister in bijzondere omstandigheden ontheffing verlenen van de verplichting tot overdracht
      van de rechten ten aanzien van gebouwen, terreinen en roerende zaken. Onze Minister besluit binnen zes maanden na
      ontvangst van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister
      de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.

      5 Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref4] van een rechtspersoon
      die een school in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende rechtspersoon de
      school in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de school overgaat. In het
      laatste geval zijn het tweede tot en met vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel49
