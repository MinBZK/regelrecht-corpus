  - number: 10b6
    text: |-
      1 Tot het verzorgen van het buitenschoolse praktijkgedeelte zijn uitsluitend bevoegd bedrijven en organisaties ten
      aanzien waarvan wordt voldaan aan de volgende eisen:

      a. op de leer-werkplek of combinatie van leer-werkplekken kunnen de door het bevoegd gezag vastgestelde
      praktijkopdrachten daadwerkelijk worden uitgevoerd;

      b. elke praktijkopdracht als zodanig kan in één bedrijf of organisatie worden uitgevoerd;

      c. in het bedrijf of de organisatie is een gekwalificeerde praktijkbegeleider of leermeester aanwezig, die in staat
      is om kennis, inzicht en vaardigheden van de leerling te beoordelen, alsmede vorderingen daarin, en de leerling
      zowel werkinhoudelijk als pedagogisch-didactisch te begeleiden;

      d. het bedrijf of de organisatie is bereid met de in het tweede lid bedoelde mentor of docentbegeleider contact
      te onderhouden;

      e. de mogelijkheid om binnen hetzelfde bedrijf of dezelfde organisatie, dezelfde moederorganisatie of dezelfde
      branche de leerdoelen van het voorbereidend middelbaar beroepsonderwijs en de eindtermen van de assistenopleiding
      of basisberoepsopleiding, bedoeld in de [Wet educatie en beroepsonderwijs][ref1] te behalen, zonder grote
      overgangsdrempels voor de leerling;

      f. het bedrijf of de organisatie waarborgt dat een gekwalificeerde praktijkbegeleider of leermeester is gekoppeld
      aan een leerling, en dat deze leermeester ervoor zorgt dat de leerling voldoende hulp en tijd krijgt om de
      praktijkopdrachten uit te voeren;

      g. het productie- of dienstverleningsproces is technisch en organisatorisch voldoende gevarieerd en kan leerlingen
      goed praktijkmateriaal bieden en hen gedegen opleiden;

      h. de leer-werkplek past binnen de dagelijkse bedrijfsvoering;

      i. het bedrijf of de organisatie is bereid de leerling de vereiste praktijkopdrachten uit te laten voeren en het
      werk en het stageverslag te bespreken en te beoordelen;

      j. het bedrijf of de organisatie is geschikt voor de betrokken leeftijdsgroep waar het gaat om onder meer ruimte om
      te leren of fouten te maken, erkenning van jong zijn;

      k. het bedrijf of de organisatie respecteert, voor zover van toepassing, het multiculturele karakter van de
      leerlingenpopulatie.

      2 Het bevoegd gezag draagt zorg voor beschikbaarheid van een gekwalificeerde mentor of docentbegeleider die de
      voortgang op de leer-werkplek alsmede de integratie tussen het binnenschools en buitenschools programma bewaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel10b6
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 10b7
    text: |-
      1 Leer-werktrajecten worden verzorgd op grondslag van een samenwerkingsovereenkomst tussen het
      bevoegd gezag van de school en het bevoegd gezag van een regionaal opleidingencentrum, een regionaal
      opleidingencentrum in een samenwerkingsverband of een agrarisch opleidingscentrum als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref1] voor zover aan die instelling een basisberoepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder b, van de Wet educatie en beroepsonderwijs][ref2] wordt verzorgd.

      2 Een samenwerkingsovereenkomst als bedoeld in het eerste lid voorziet in elk geval in
      de inrichting van een doorlopende leerweg tot en met de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onder b, van de Wet educatie en beroepsonderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel10b7
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 7.2.2
      - id: ref3
        bwb_id: BWBR0007625
        artikel: 7.2.2
  - number: 10c
    text: |-
      De sectoren, genoemd in artikel 10b, derde lid, omvatten elk een of meer afdelingen, onderscheiden als volgt:

      a. de sector techniek:

      1. bouwtechniek,

      2. metaaltechniek,

      3. elektrotechniek,

      4. voertuigentechniek,

      5. installatietechniek,

      6. grafische techniek,

      7. transport en logistiek,

      8. afdelingen, aangewezen ingevolge artikel 24, vijfde lid,

      b. de sector zorg en welzijn:

      1. verzorging,

      2. uiterlijke verzorging,

      c. de sector economie:

      1. administratie,

      2. handel en verkoop,

      3. mode en commercie,

      4. consumptief,

      d. de sector landbouw:

      landbouw en natuurlijke omgeving.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel10c
  - number: 10d
    text: |-
      1 Aan een scholengemeenschap waarvan ten minste een school voor middelbaar algemeen voortgezet onderwijs en een
      school voor voorbereidend beroepsonderwijs deel uitmaken, kan, naast het onderwijs in de leerwegen, genoemd in
      de [artikelen 10][ref1] en [10b][ref2], onderwijs in de gemengde leerweg worden gegeven. In afwijking van de
      eerste volzin kan Onze Minister van Onderwijs, Cultuur en Wetenschap onder door hem te stellen voorwaarden, op
      aanvraag van het bevoegd gezag van een school voor middelbaar algemeen voortgezet onderwijs of van een school
      voor voorbereidend beroepsonderwijs, toestaan dat aan die school onderwijs in de gemengde leerweg wordt gegeven.
      In afwijking van de eerste volzin, kan Onze Minister van Landbouw, Natuur en Voedselkwaliteit onder door hem
      te stellen voorwaarden, op aanvraag van het bevoegd gezag van een agrarisch opleidingscentrum als bedoeld in
      [artikel 1.3.3 van de Wet educatie en beroepsonderwijs][ref3], ten behoeve van het daarin verzorgde voorbereidend
      beroepsonderwijs en in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschap, toestaan dat
      onderwijs in de gemengde leerweg wordt gegeven.

      2 De gemengde leerweg omvat een samenhangend onderwijsprogramma, gericht op:

      a. een algemene maatschappelijke voorbereiding en persoonlijke vorming, en

      b. een voorbereiding op naar inhoud verwante opleidingen in het aansluitend beroepsonderwijs.

      3 Het onderwijs in de gemengde leerweg kan met ingang van het derde leerjaar worden gegeven, en wordt uiterlijk met
      ingang van het vierde leerjaar gegeven in een of meer van de volgende sectoren:

      a. techniek,

      b. zorg en welzijn,

      c. economie, en

      d. landbouw.

      4 Het onderwijs in de gemengde leerweg bestaat voor elke sector uit:

      a. een gemeenschappelijk deel, dat voor alle sectoren gelijk is,

      b. een sectordeel, dat kenmerkend is voor die sector, en

      c. een vrij deel, dat bestaat uit een door de leerling te kiezen afdelingsvak, dan wel intrasectoraal te kiezen
      andere programma-onderdelen van een of meer afdelingen binnen de desbetreffende sector, mogelijkerwijs aangevuld
      met andere te kiezen programma-onderdelen.

      5 Het gemeenschappelijk deel van de gemengde leerweg omvat Nederlandse taal, Engelse taal, maatschappijleer,
      lichamelijke opvoeding en ten minste één van de vakken behorende tot de beeldende vorming, muziek, dans of drama.

      6 Het sectordeel van de gemengde leerweg omvat wat betreft:

      a. de sector techniek: wiskunde en natuur- en scheikunde I,

      b. de sector zorg en welzijn: biologie en, ter keuze van de leerling, wiskunde, maatschappijleer II, geschiedenis
      en staatsinrichting, of aardrijkskunde, met dien verstande dat het bevoegd gezag beslist welke van de laatste drie
      vakken wordt of worden aangeboden,

      c. de sector economie: economie en, ter keuze van de leerling, wiskunde, Franse taal of Duitse taal,

      d. de sector landbouw: wiskunde en, ter keuze van de leerling, biologie of natuur- en scheikunde I.

      7 Het vrije deel van de gemengde leerweg:

      a. omvat door de leerling te kiezen vakken, genoemd in het zesde lid,

      b. omvat door de leerling te kiezen bij de sector behorende afdelingsvakken of intrasectoraal te kiezen programma-
      onderdelen,

      c. kan omvatten natuur- en scheikunde II, Spaanse taal, Turkse taal, Arabische taal, vakken behorende tot de
      beeldende vorming, muziek, dans, drama, door de leerling te kiezen, en

      d. kan omvatten door het bevoegd gezag vast te stellen vakken en programma-onderdelen.

      8 Het bevoegd gezag beslist welke keuzetaal, genoemd in het zesde lid, onderdeel c, en welke vakken, genoemd in
      het zevende lid, onderdelen b en c, worden aangeboden. Het bevoegd gezag kan tevens beslissen dat door het bevoegd
      gezag aan te wijzen vakken en andere programma-onderdelen, bedoeld in het zevende lid, onderdeel d, door alle
      leerlingen in het vrije deel moeten worden gevolgd.

      9 Onze Minister kan op aanvraag van het bevoegd gezag toestemming verlenen tot het verzorgen van een of meer
      intrasectorale programma's, tenzij dat niet doelmatig is gelet op het geheel en de spreiding van het aanbod van
      voorbereidend beroepsonderwijs. Onze Minister zendt elke aanvraag voor advies aan de provincie die het aangaat,
      alsmede aan de daarvoor in aanmerking komende organisaties.

      10 Bij algemene maatregel van bestuur worden vastgesteld:

      a. de afdelingsvakken en intrasectoraal te kiezen programma-onderdelen, bedoeld in het zevende lid, onderdeel b,

      b. voorschriften met betrekking tot intrasectoraal te kiezen programma-onderdelen en met betrekking tot de
      aanvraag, bedoeld in het negende lid,

      c. voorschriften omtrent de mogelijkheid vrijstelling te verlenen van onderdelen van dit artikel ten behoeve van
      leerlingen met bijzondere kenmerken, en

      d. voorwaarden waaronder vakken en programma-onderdelen, bedoeld in het zesde en zevende lid, kunnen worden
      verzorgd ten behoeve van leerlingen door een andere school voor voorbereidend beroepsonderwijs dan die waar die
      leerlingen zijn ingeschreven.

      Onverminderd het zesde en zevende lid, kan bij algemene maatregel van bestuur worden vastgesteld het door alle
      leerlingen in het derde leerjaar te volgen minimum aantal vakken waarin eindexamen kan worden afgelegd, alsmede
      welke vakken het betreft.

      11 De in het tiende lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.


