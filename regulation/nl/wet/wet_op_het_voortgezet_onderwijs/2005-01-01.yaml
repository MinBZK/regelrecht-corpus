  - number: 103c
    text: |-
      1 De Informatie Beheer Groep neemt de door het bevoegd gezag verstrekte persoonsgebonden nummers en andere
      gegevens, bedoeld in [artikel 103b, tweede lid][ref1], op in het basisregister onderwijs, bedoeld in
      [artikel 9a van de Wet verzelfstandiging Informatiseringsbank][ref2], nadat zij deze gegevens heeft getoetst
      op juistheid en volledigheid. De Informatie Beheer Groep verstrekt de gegevens, inclusief de gegevens, bedoeld
      in [artikel 9b, eerste lid, onderdeel g, van de Wet verzelfstandiging Informatiseringsbank][ref3], zoals zij
      voornemens is die gegevens in het basisregister onderwijs op te nemen, aan het bevoegd gezag. Onverminderd de derde
      volzin van [artikel 103d, eerste lid][ref4], kan de Informatie Beheer Groep de door het bevoegd gezag verstrekte
      gegevens uitsluitend met instemming van het bevoegd gezag wijzigen.

      2 Het bevoegd gezag verstrekt de Informatie Beheer Groep alle inlichtingen die zij nodig acht voor de uitvoering
      van de taak, bedoeld in het eerste lid. Het bevoegd gezag werkt eraan mee dat de in het basisregister onderwijs
      opgenomen gegevens juist en volledig zijn.

      3 Indien de Informatie Beheer Groep naar aanleiding van de toetsing, bedoeld in het eerste lid, redenen heeft om
      aan te nemen dat een bevoegd gezag in strijd handelt of heeft gehandeld met het bepaalde bij of krachtens deze
      wet, meldt zij dit aan Onze minister. Indien Onze minister een onderzoek door de inspectie nodig acht, verstrekt de
      Informatie Beheer Groep ten behoeve van dit onderzoek de persoonsgebonden nummers en andere gegevens van leerlingen
      aan de inspectie. De inspectie meldt de uitkomst van het onderzoek aan Onze minister en de Informatie Beheer Groep.
      Indien de inspectie constateert dat het bevoegd gezag in strijd handelt of heeft gehandeld met het bepaalde bij
      of krachtens deze wet, meldt zij de uitkomst van het onderzoek aan Onze minister, tezamen met de voor die uitkomst
      relevante gegevens die aan de inspectie werden verstrekt.

      4 Onze minister en de inspectie verstrekken ter uitvoering van
      [artikel 107, tweede lid, van de Vreemdelingenwet 2000][ref5] geen gegevens die zij op grond van het derde lid
      hebben ontvangen.


