  - number: '4'
    text: |-
      1 Ten behoeve van het schoolbezoek verstrekken burgemeester en wethouders aan ouders, voogden of verzorgers van in
      de gemeente verblijvende leerlingen die wegens hun lichamelijke, verstandelijke of zintuiglijke handicap op ander
      vervoer dan openbaar vervoer zijn aangewezen, dan wel vanwege een zodanige handicap niet zelfstandig van openbaar
      vervoer gebruik kunnen maken, op aanvraag bekostiging van de door burgemeester en wethouders noodzakelijk te achten
      vervoerskosten. Indien de leerling meerderjarig en handelingsbekwaam is, wordt de bekostiging op aanvraag verstrekt
      aan de leerling. De gemeenteraad stelt daartoe een nadere regeling vast, met inachtneming van het bepaalde in de
      volgende leden.

      2 De regeling maakt geen onderscheid tussen openbaar en bijzonder onderwijs.

      3 De regeling eerbiedigt de op godsdienst of levensbeschouwing van de ouders, voogden of verzorgers, dan wel,
      indien de leerling meerderjarig en handelingsbekwaam is, van de leerling berustende keuze van een school.

      4 De regeling voorziet erin dat het vervoer kan plaatsvinden op een wijze die voor de leerling passend is. De
      regeling bepaalt op welke wijze burgemeester en wethouders terzake advies van deskundigen inwinnen.

      5 De regeling bepaalt dat de kosten worden vergoed van vervoer over de afstand tussen de woning van de leerling
      en de dichtstbijzijnde voor de leerling toegankelijke school, met inachtneming van de keuze van de ouders, voogden
      of verzorgers, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, van de leerling, tenzij vervoer
      met betrekking tot een verder weg gelegen school voor de gemeente minder kosten met zich zou brengen en de ouders,
      voogden of verzorgers onderscheidenlijk de leerling met het vervoer naar die school instemmen.

      6 De regeling kan bepalen dat de gemeente, in plaats van bekostiging in geld te geven, het vervoer verzorgt of
      doet verzorgen.

      7 De regeling kan bepalen dat burgemeester en wethouders in bijzondere gevallen de bevoegdheid hebben ten gunste
      van de ouders, voogden of verzorgers, dan wel, indien de leerling meerderjarig en handelingsbekwaam is, ten gunste
      van de leerling van de inhoud van de regeling af te wijken.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel4
  - number: '5'
    text: |-
      Het voortgezet onderwijs wordt onderscheiden in:

      a. voorbereidend wetenschappelijk onderwijs;

      b. hoger en middelbaar algemeen voortgezet onderwijs;

      c. voorbereidend beroepsonderwijs;

      d. praktijkonderwijs;

      e. andere vormen van voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel5
  - number: '6'
    text: |-
      De bepalingen van de hoofdstukken I en II van deze afdeling regelen het openbaar schoolonderwijs; de bepalingen van
      de hoofdstukken I en III zijn voorwaarden voor bekostiging van het bijzonder schoolonderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel6
  - number: 6a
    text: |-
      Het onderwijs wordt gegeven en de examens worden afgenomen in het Nederlands. In afwijking van de eerste volzin kan
      een andere taal worden gebezigd:

      a. wanneer het onderwijs met betrekking tot die taal betreft, of

      b. indien de specifieke aard, de inrichting of de kwaliteit van het onderwijs dan wel de herkomst van de deelnemers
      daartoe noodzaakt, overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel6a
  - number: 6b
    text: |-
      Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel6b
  - number: '7'
    text: |-
      1 Voorbereidend wetenschappelijk onderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend
      wetenschappelijk onderwijs en dat mede algemene vorming omvat. Voorbereidend wetenschappelijk onderwijs wordt
      gegeven aan gymnasia, athenea en lycea, elk met een cursusduur van zes jaren.

      2 Aan de gymnasia wordt in elk geval onderwijs verzorgd in Latijnse taal en letterkunde en Griekse taal en
      letterkunde.

      3 Het onderwijs aan de gymnasia en athenea omvat:

      a. de in artikel 11a bedoelde periode van basisvorming, en

      b. de in artikel 12 bedoelde periode van voorbereidend hoger onderwijs.

      4 Elke school die een gymnasium en een atheneum omvat, is een lyceum. Van een lyceum is ten minste het eerste
      leerjaar gemeenschappelijk.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel7
  - number: '8'
    text: |-
      1 Hoger algemeen voortgezet onderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend hoger
      beroepsonderwijs en dat mede algemene vorming omvat. Het hoger algemeen voortgezet onderwijs wordt gegeven:

      a. aan scholen met een cursusduur van vijf jaren;

      b. aan afdelingen van athenea, lycea en scholen voor middelbaar algemeen voortgezet onderwijs. Deze hebben een
      cursusduur van twee jaren en vangen aan na drie jaren voorbereidend wetenschappelijk onderwijs of na vier jaren
      middelbaar algemeen voortgezet onderwijs.

      2 Het onderwijs aan deze scholen en afdelingen omvat:

      a. de in artikel 11a bedoelde periode van basisvorming, en

      b. de in artikel 12 bedoelde periode van voorbereidend hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel8
  - number: '9'
    text: |-
      Middelbaar algemeen voortgezet onderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend
      beroepsonderwijs dan wel op hoger algemeen voortgezet onderwijs, en dat mede algemene vorming omvat. Het middelbaar
      algemeen voortgezet onderwijs wordt gegeven aan scholen met een cursusduur van vier jaren.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel9
  - number: '10'
    text: |-
      1 Aan scholen voor middelbaar algemeen voortgezet onderwijs wordt onderwijs in de theoretische leerweg gegeven.

      2 De theoretische leerweg omvat een samenhangend onderwijsprogramma, gericht op:

      a. een algemene maatschappelijke voorbereiding en persoonlijke vorming,

      b. een voorbereiding op naar inhoud verwante opleidingen in het aansluitend beroepsonderwijs, en

      c. een voorbereiding op het hoger algemeen voortgezet onderwijs.

      3 Het onderwijs in de theoretische leerweg kan met ingang van het derde leerjaar worden gegeven, en wordt uiterlijk
      met ingang van het vierde leerjaar gegeven in de volgende sectoren:

      a. techniek,

      b. zorg en welzijn,

      c. economie, en

      d. landbouw.

      4 Het onderwijs in de theoretische leerweg bestaat voor elke sector uit:

      a. een gemeenschappelijk deel, dat voor alle sectoren gelijk is,

      b. een sectordeel, dat kenmerkend is voor die sector, en

      c. een vrij deel, dat bestaat uit door de leerling te kiezen vakken en andere programma-onderdelen.

      5 Het gemeenschappelijk deel van de theoretische leerweg omvat Nederlandse taal, Engelse taal, maatschappijleer,
      lichamelijke opvoeding en ten minste één van de vakken behorende tot de beeldende vorming, muziek, dans of drama.

      6 Het sectordeel van de theoretische leerweg omvat wat betreft:

      a. de sector techniek: wiskunde en natuur- en scheikunde I,

      b. de sector zorg en welzijn: biologie en, ter keuze van de leerling, wiskunde, maatschappijleer II, geschiedenis
      en staatsinrichting, of aardrijkskunde, met dien verstande dat het bevoegd gezag beslist welke van de laatste drie
      vakken wordt of worden aangeboden,

      c. de sector economie: economie en, ter keuze van de leerling, wiskunde, Franse taal of Duitse taal,

      d. de sector landbouw: wiskunde en, ter keuze van de leerling, biologie of natuur- en scheikunde I.

      7 Het vrije deel van de theoretische leerweg:

      a. omvat door de leerling te kiezen vakken, genoemd in het zesde lid,

      b. kan omvatten natuur- en scheikunde II, Spaanse taal, Turkse taal, Arabische taal, vakken behorende tot de
      beeldende vorming, muziek, dans, drama, door de leerling te kiezen, en

      c. kan omvatten door het bevoegd gezag vast te stellen vakken en programma-onderdelen.

      8 Het bevoegd gezag beslist welke keuzetaal, genoemd in het zesde lid, onderdeel c, en welke vakken, genoemd in het
      zevende lid, onderdeel b, worden aangeboden. Het bevoegd gezag kan tevens beslissen dat door het bevoegd gezag aan
      te wijzen vakken en andere programma-onderdelen, bedoeld in het zevende lid, onderdeel c, door alle leerlingen in
      het vrije deel moeten worden gevolgd.

      9 Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de mogelijkheid vrijstelling te
      verlenen van onderdelen van dit artikel ten behoeve van leerlingen met bijzondere kenmerken. Onverminderd het zesde
      en zevende lid, kan bij algemene maatregel van bestuur worden vastgesteld het door alle leerlingen in het derde
      leerjaar te volgen minimum aantal vakken waarin eindexamen kan worden afgelegd, alsmede welke vakken het betreft.

      10 De in het negende lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel10
  - number: 10a
    text: |-
      Voorbereidend beroepsonderwijs is het onderwijs dat is ingericht ter voorbereiding op aansluitend beroepsonderwijs,
      bedoeld in [artikel 7.2.2, eerste lid, onderdelen b, c en d, van de Wet educatie en beroepsonderwijs][ref1] en dat
      mede algemene vorming omvat. Het voorbereidend beroepsonderwijs wordt gegeven aan scholen met een cursusduur van
      vier jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 7.2.2
  - number: 10b
    text: |-
      1 Aan scholen voor voorbereidend beroepsonderwijs wordt, in elke afdeling als bedoeld in artikel 10c, onderwijs in
      de basisberoepsgerichte leerweg en de kaderberoepsgerichte leerweg gegeven.

      2 De beroepsgerichte leerwegen omvatten een samenhangend onderwijsprogramma, gericht op:

      a. een algemene maatschappelijke voorbereiding en persoonlijke vorming, en

      b. een voorbereiding op naar inhoud verwante opleidingen in het aansluitend beroepsonderwijs.

      3 Het onderwijs in de beroepsgerichte leerwegen kan met ingang van het derde leerjaar worden gegeven, en wordt
      uiterlijk met ingang van het vierde leerjaar gegeven in een of meer van de volgende sectoren:

      a. techniek,

      b. zorg en welzijn,

      c. economie, en

      d. landbouw.

      4 Het onderwijs in de beroepsgerichte leerwegen bestaat voor elke sector uit:

      a. een gemeenschappelijk deel, dat voor alle sectoren gelijk is,

      b. een sectordeel, dat kenmerkend is voor die sector, en

      c. een vrij deel, dat bestaat uit door de leerling te kiezen afdelingsvakken, dan wel intrasectoraal te kiezen
      programma-onderdelen van een of meer afdelingen binnen de desbetreffende sector, mogelijkerwijs aangevuld met
      andere te kiezen programma-onderdelen.

      5 Het gemeenschappelijk deel van de beroepsgerichte leerwegen omvat Nederlandse taal, Engelse taal,
      maatschappijleer, lichamelijke opvoeding en ten minste één van de vakken behorende tot de beeldende vorming,
      muziek, dans of drama.

      6 Het sectordeel van de basisberoepsgerichte leerweg omvat wat betreft:

      a. de sector techniek: wiskunde en natuur- en scheikunde I,

      b. de sector zorg en welzijn: biologie en, ter keuze van de leerling, wiskunde, maatschappijleer II, geschiedenis
      en staatsinrichting, of aardrijkskunde, met dien verstande dat het bevoegd gezag beslist welke van de laatste drie
      vakken wordt of worden aangeboden,

      c. de sector economie: economie en, ter keuze van de leerling, wiskunde, Franse taal of Duitse taal,

      d. de sector landbouw: wiskunde en, ter keuze van de leerling, biologie of natuur- en scheikunde I.

      De eerste volzin is van overeenkomstige toepassing op de kaderberoepsgerichte leerweg.

      7 Het vrije deel van de beroepsgerichte leerwegen:

      a. omvat door de leerling te kiezen bij de sector behorende afdelingsvakken of intrasectoraal te kiezen programma-
      onderdelen,

      b. kan omvatten door het bevoegd gezag vast te stellen vakken en programma-onderdelen.

      8 Het bevoegd gezag beslist welke keuzetaal, genoemd in het zesde lid, onderdeel c, en welke vakken, genoemd in het
      zevende lid, onderdeel a, worden aangeboden. Het bevoegd gezag kan tevens beslissen dat door het bevoegd gezag aan
      te wijzen vakken en andere programma-onderdelen, bedoeld in het zevende lid, onderdeel b, door alle leerlingen in
      het vrije deel moeten worden gevolgd.

      9 Onze Minister kan op aanvraag van het bevoegd gezag toestemming verlenen tot het verzorgen van een of meer
      intrasectorale programma's, tenzij dat niet doelmatig is gelet op het geheel en de spreiding van het aanbod van
      voorbereidend beroepsonderwijs. Onze Minister kan hierbij ten aanzien van afdelingen die deel uitmaken van een
      intrasectoraal programma toestemming verlenen af te wijken van het voorschrift in het eerste lid dat in elke
      afdeling onderwijs in de basisberoepsgerichte leerweg en in de kaderberoepsgerichte leerweg wordt gegeven. Onze
      Minister zendt elke aanvraag voor advies aan de provincie die het aangaat, alsmede aan de daarvoor in aanmerking
      komende organisaties.

      10 Bij algemene maatregel van bestuur worden vastgesteld:

      a. de afdelingsvakken en intrasectoraal te kiezen programma-onderdelen, bedoeld in het zevende lid, onderdeel a,

      b. voorschriften met betrekking tot intrasectoraal te kiezen programma-onderdelen en met betrekking tot de
      aanvraag, bedoeld in het negende lid,

      c. voorschriften omtrent de mogelijkheid vrijstelling te verlenen van onderdelen van dit artikel ten behoeve van
      leerlingen met bijzondere kenmerken, en

      d. voorwaarden waaronder vakken en programma-onderdelen, bedoeld in het zesde en zevende lid, kunnen worden
      verzorgd ten behoeve van leerlingen door een andere school voor voorbereidend beroepsonderwijs dan die waar die
      leerlingen zijn ingeschreven.

      Onverminderd het zesde en zevende lid, kan bij algemene maatregel van bestuur worden vastgesteld het door alle
      leerlingen in het derde leerjaar te volgen minimum aantal vakken waarin eindexamen kan worden afgelegd, alsmede
      welke vakken het betreft.

      11 De in het tiende lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel10b
  - number: 10b1
    text: |-
      1 Het bevoegd gezag kan de basisberoepsgerichte leerweg mede inrichten als leer-werktraject. Een leer-
      werktraject is een leerroute binnen de basisberoepsgerichte leerweg met een buitenschools praktijkgedeelte
      dat ten minste 640 klokuren, verzorgd in 80 dagen, en ten hoogste 1280 klokuren, verzorgd in 160 dagen,
      omvat van de gezamenlijke onderwijstijd van het derde en vierde leerjaar en welk traject specifiek is
      gericht op het behalen van een startkwalificatie op het niveau van de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onder b, van de Wet educatie en beroepsonderwijs][ref1]. Elke schoolweek in het derde
      en vierde leerjaar omvat ten minste binnenschools onderricht.

      2 Een leer-werktraject omvat in elk geval:

      a. Nederlandse taal, en

      b. een beroepsgericht programma.

      3 Het bevoegd gezag kan, na overleg met de leerling of diens wettelijk vertegenwoordiger, beslissen dat het leer-
      werktraject voor die leerling eveneens een of meer andere vakken van de basisberoepsgerichte leerweg omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel10b1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 7.2.2
  - number: 10b2
    text: |-
      Het bevoegd gezag stelt bij de inrichting van het leer-werktraject in elk geval vast:

      a. de organisatie van de leerlingbegeleiding vanwege het bevoegd gezag zowel binnen de school als bij het bedrijf
      dat of de organisatie die het buitenschoolse praktijkgedeelte verzorgt, alsmede

      b. de invulling van het buitenschoolse praktijkgedeelte en waarborgt daarbij dat niet uitsluitend eenzijdige
      productiearbeid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel10b2
  - number: 10b3
    text: |-
      1 Het buitenschoolse praktijkgedeelte wordt verzorgd door een bedrijf of organisatie, op grondslag van een leer-
      werkovereenkomst, gesloten door het bevoegd gezag, de betrokken leerling of diens wettelijk vertegenwoordiger,
      dat bedrijf of die organisatie, en het bestuur van het desbetreffende landelijk orgaan, geregeld in de
      [Wet educatie en beroepsonderwijs][ref1], dat daarmee verklaart:

      a. dat het een bedrijf of organisatie betreft dat respectievelijk die voldoet aan de kwaliteitscriteria, genoemd in
      [artikel 10b6][ref2], en

      b. voor zover van toepassing, dat de gronden voor dat kwaliteitsoordeel nog steeds aanwezig zijn.

      2 De leer-werkovereenkomst regelt de rechten en plichten van partijen en omvat ten minste bepalingen over:

      a. inhoud, leerdoelen, duur, periode van en beoordelingsmaatstaven voor het buitenschoolse praktijkgedeelte,

      b. de begeleiding van de leerling, en

      c. de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden ontbonden.

      3 In afwijking van [artikel 7:610, tweede lid tweede volzin, van het Burgerlijk Wetboek][ref3], is in geval van
      strijd als bedoeld in die volzin, [artikel 10b3][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b6
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10b3
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel10b3
    references:
