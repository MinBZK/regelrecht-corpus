  - number: '100'
    text: |-
      1 De bedragen en bekostiging, bedoeld in [artikel 99][ref1], worden niet aangewend voor contractactiviteiten.

      2 Het bevoegd gezag van de scholen, bedoeld in [artikel 99][ref2], berekent voor de contractactiviteiten aan de
      betrokken derden de kosten zodanig dat aan het bepaalde in het eerste lid wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel99
