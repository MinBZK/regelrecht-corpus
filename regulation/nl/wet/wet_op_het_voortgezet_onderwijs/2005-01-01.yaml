  - number: '51'
    text: |-
      1 De rector, de directeur, de conrectoren, de adjunct-directeuren, de leden van de centrale directie, de leraren en
      het overige personeel, bedoeld in [artikel 38a][ref1], van de bijzondere school zijn in het bezit van een door het
      bevoegd gezag en door henzelf getekende akte van benoeming. Deze akte van benoeming bevat ten minste:

      a. de naam en het adres van het bevoegd gezag;

      b. de naam, de voornamen en de geboortedatum van de betrokkene;

      c. de datum van ingang van de benoeming;

      d. de functie waarin de betrokkene wordt benoemd;

      e. de bepaling of de benoeming in vaste of in tijdelijke dienst geschiedt en in het laatste geval de gronden voor
      de tijdelijkheid en de duur van de benoeming;

      f. de omvang van de betrekking;

      g. de op de dag van zijn benoeming van toepassing zijnde schaal en het salarisnummer;

      h. de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag.

      2 De akte van benoeming bevat bepalingen inzake gronden voor schorsing, ontslag en disciplinaire maatregelen.

      3 Het bevoegd gezag draagt zorg dat afschriften van de bewijzen van bekwaamheid, van de verklaringen omtrent het
      gedrag, alsmede van de akten van benoeming van het aan de school verbonden personeel worden bewaard.

      4 Het derde lid is van overeenkomstige toepassing op personeel dat is tewerkgesteld zonder benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel38
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel51
