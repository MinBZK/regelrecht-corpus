  - number: '13'
    text: |-
      1 Het gemeenschappelijk deel van elk profiel in het voorbereidend wetenschappelijk onderwijs omvat:

      Nederlandse taal en letterkunde, Engelse taal en letterkunde, Duitse taal en letterkunde, Franse taal en
      letterkunde, algemene natuurwetenschappen, de combinatie geschiedenis en maatschappijleer, culturele en
      kunstzinnige vorming, lichamelijke opvoeding.

      2 Het profieldeel van de profielen in het voorbereidend wetenschappelijk onderwijs omvat:

      a. voor het profiel natuur en techniek: wiskunde, natuurkunde, scheikunde,

      b. voor het profiel natuur en gezondheid: wiskunde, natuurkunde, scheikunde, biologie,

      c. voor het profiel economie en maatschappij: economie, wiskunde, geschiedenis, aardrijkskunde, en

      d. voor het profiel cultuur en maatschappij:

      1°. een moderne taal met de daarbij behorende letterkunde ter keuze van de leerling, of ter keuze van de leerling
      Latijnse taal en letterkunde of Griekse taal en letterkunde,

      2°. ter keuze van het bevoegd gezag of, indien het bevoegd gezag daarvoor kiest, ter keuze van de leerling: een
      andere moderne of klassieke taal met de daarbij behorende letterkunde ter keuze van de leerling, of filosofie,

      3°. culturele en kunstzinnige vorming,

      4°. geschiedenis, en

      5°. wiskunde.

      3 Het vrije deel kan omvatten:

      a. door de leerling te kiezen vakken, genoemd in het tweede lid,

      b. maatschappijleer, management en organisatie, informatica, lichamelijke opvoeding, en voor het atheneum tevens
      klassieke culturele vorming, door de leerling te kiezen, en

      c. door het bevoegd gezag vast te stellen vakken en andere programma-onderdelen.

      4 Vakken kunnen met het oog op hun plaats in het gemeenschappelijk deel, het profieldeel of het vrije deel, worden
      verdeeld in deelvakken.

      5 Het bevoegd gezag beslist welke in het tweede lid, onder d, bedoelde keuzetalen met de daarbij behorende
      letterkunde en welke in het derde lid, onder a en b, bedoelde vakken, worden aangeboden. Het bevoegd gezag
      kan tevens besluiten dat door het bevoegd gezag aan te wijzen vakken en andere programma-onderdelen door alle
      leerlingen in het vrije deel moeten worden gevolgd.

      6 In afwijking van het eerste lid omvat het onderwijs in het gymnasium voor elke leerling klassieke culturele
      vorming in plaats van culturele en kunstzinnige vorming. Het onderwijs in het gymnasium omvat bovendien voor elke
      leerling Latijnse taal en letterkunde of Griekse taal en letterkunde, dan wel beide, ter keuze van de leerling. Het
      in het eerste lid genoemde vak culturele en kunstzinnige vorming kan in het gymnasium behoren tot de vakken van het
      vrije deel.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel13
  - number: '14'
    text: |-
      1 Het gemeenschappelijk deel van elk profiel in het hoger algemeen voortgezet onderwijs omvat:

      Nederlandse taal en letterkunde, Engelse taal en letterkunde, een andere moderne taal met de daarbij
      behorende letterkunde ter keuze van de leerling, algemene natuurwetenschappen, de combinatie geschiedenis en
      maatschappijleer, culturele en kunstzinnige vorming, lichamelijke opvoeding.

      2 Het profieldeel van de profielen in het hoger algemeen voortgezet onderwijs omvat:

      a. voor het profiel natuur en techniek: wiskunde, natuurkunde, scheikunde,

      b. voor het profiel natuur en gezondheid: wiskunde, natuurkunde, scheikunde, biologie,

      c. voor het profiel economie en maatschappij: economie, wiskunde, geschiedenis, aardrijkskunde, en

      d. voor het profiel cultuur en maatschappij: een moderne taal met de daarbij behorende letterkunde ter keuze van de
      leerling, culturele en kunstzinnige vorming, geschiedenis, economie, wiskunde.

      3 Het vrije deel kan omvatten:

      a. door de leerling te kiezen vakken, genoemd in het tweede lid,

      b. maatschappijleer, filosofie, management en organisatie, informatica, lichamelijke opvoeding, door de leerling te
      kiezen, en

      c. door het bevoegd gezag vast te stellen vakken en andere programma-onderdelen.

      4 Vakken kunnen met het oog op hun plaats in het gemeenschappelijk deel, het profieldeel of het vrije deel, worden
      verdeeld in deelvakken.

      5 Het bevoegd gezag beslist welke in het eerste lid en het tweede lid, onder d, bedoelde keuzetalen met de daarbij
      behorende letterkunde en welke in het derde lid, onder a en b, bedoelde vakken worden aangeboden. Het bevoegd
      gezag kan tevens besluiten dat door het bevoegd gezag aan te wijzen vakken en andere programma-onderdelen door alle
      leerlingen in het vrije deel moeten worden gevolgd.

      6 Tevens kan het bevoegd gezag de leerling in de gelegenheid stellen, in het vrije deel te kiezen uit in artikel 13
      genoemde vakken.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel14
  - number: '15'
    text: |-
      1 Bij algemene maatregel van bestuur worden met betrekking tot de in [artikel 12, tweede lid][ref1], bedoelde
      profielen vastgesteld:

      a. de normatieve studielast van het gemeenschappelijk deel, het profieldeel en het vrije deel,

      b. de verdeling van vakken in deelvakken, alsmede de nadere ordening van de in de [artikelen 13][ref2] en
      [14][ref3] genoemde vakken met het oog op hun plaats in het gemeenschappelijk deel, het profieldeel of het vrije
      deel,

      c. de normatieve studielast van de vakken en deelvakken,

      d. voorschriften omtrent de vakken en andere programma-onderdelen, bedoeld in de
      [artikelen 13, derde lid, onder c][ref4], en [14, derde lid, onder c][ref5], behoudens godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs aan bijzondere scholen,

      e. voorschriften omtrent de mogelijkheid, vrijstelling te verlenen van onderdelen van de [artikelen 13][ref6] en
      [14][ref7] ten behoeve van leerlingen met bijzondere kenmerken, waartoe in elk geval kunnen behoren leerlingen die
      niet in staat zijn, onderwijs in lichamelijke opvoeding te volgen, en

      f. de inpassing van het in [artikel 13, zesde lid][ref8], bepaalde, in het bij het eerste tot en met vierde lid van
      [artikel 13][ref9] en in het krachtens [artikel 15][ref10] bepaalde.

      2 Tevens kan bij de in het eerste lid bedoelde algemene maatregel van bestuur in afwijking van
      [artikel 12, vijfde lid][ref11], tweede volzin, worden bepaald dat het in schooltijd verzorgde onderwijsprogramma
      in het laatste leerjaar een geringer aantal dan 1000 uren onderwijs omvat, maar ten minste een bij die algemene
      maatregel van bestuur te bepalen aantal uren.

      3 De in het eerste lid bedoelde algemene maatregel van bestuur wordt aan de beide Kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.


