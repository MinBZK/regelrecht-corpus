  - number: '82'
    text: |-
      1 Een wijziging van een ministeriële regeling als bedoeld in [artikel 80][ref1] wordt bekendgemaakt in het
      officiële publikatieblad van het Ministerie van Onderwijs, Cultuur en Wetenschap voor 1 augustus van het jaar
      voorafgaand aan het jaar waarop die wijziging betrekking heeft.

      2 Het ontwerp van de in het eerste lid bedoelde regeling wordt bekendgemaakt in het in dat lid genoemde
      publikatieblad. De ministeriële regeling treedt niet in werking dan nadat vier weken na die bekendmaking zijn
      verstreken.


