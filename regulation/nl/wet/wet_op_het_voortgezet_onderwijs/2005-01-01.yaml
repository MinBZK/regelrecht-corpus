  - number: 53b
    text: |-
      1 Op het personeel van een rechtspersoon met volledige rechtsbevoegdheid die

      a. uitsluitend wordt bestuurd door een bevoegd gezag al dan niet met een of meer andere bevoegde gezagsorganen als
      bedoeld in deze wet, de [Wet op het primair onderwijs][ref1] of de [Wet op de expertisecentra][ref2],

      b. zich blijkens de statuten dan wel de gemeenschappelijke regeling,
      bedoeld in de [Wet gemeenschappelijke regelingen][ref3], behoudens
      [artikel 20, derde, vierde en vijfde lid, van de Wet op het primair onderwijs][ref4], uitsluitend ten doel stelt
      om ten behoeve van scholen en andere onderwijsinstellingen die uit 's Rijks kas worden bekostigd, werkzaamheden te
      verrichten ter verzekering van de goede gang van het onderwijs met uitzondering van het leiden van de school, het
      geven van onderwijs en het verrichten van werkzaamheden op het terrein van de schoolbegeleiding als bedoeld in de
      [artikelen 179 van de Wet op het primair onderwijs][ref5] en [165 van de Wet op de expertisecentra][ref6],

      c. niet het maken van winst beoogt,

      d. wordt gefinancierd met behulp van bijdragen van de bevoegde gezagsorganen waarvoor diensten worden verricht,
      waaronder begrepen formatierekeneenheden die zijn toegekend op basis van [artikel 122, eerste lid onder c][ref7],
      of [artikel 132 van de Wet op het primair onderwijs][ref8], en

      e. Onze minister heeft medegedeeld als rechtspersoon in de zin van dit artikel werkzaam te willen zijn,

      zijn van toepassing de in [artikel 38a][ref9] bedoelde voorschriften en regels. Voor de toepassing van de eerste
      volzin, onderdeel b, wordt onder «het geven van onderwijs» niet begrepen het geven van leerwegondersteunend
      onderwijs, bedoeld in [artikel 10e][ref10], en het uitoefenen van taken en bevoegdheden, bedoeld in
      [artikel 10h, zesde lid][ref11]. Voor de toepassing van de eerste volzin, onder b, wordt onder het geven van
      onderwijs niet begrepen het onderwijs dat wordt gegeven door personeel dat is benoemd of aangesteld op formatie als
      bedoeld in [artikel 122, eerste lid onder c][ref12], of [132 van de Wet op het primair onderwijs][ref13].

      2 Onder bevoegd gezag en bevoegde gezagsorganen in het eerste lid onderdeel a wordt mede verstaan de gemeenteraad.

      3 Het bestuur van de rechtspersoon is aangesloten bij een commissie van beroep als bedoeld in [artikel 52][ref14].
      De leden en plaatsvervangende leden van een commissie van beroep mogen niet behoren tot het bestuur of het
      personeel van de rechtspersoon.

      4 De in het eerste lid onder a bedoelde bevoegde gezagsorganen delen Onze minister mede dat zij het bestuur vormen
      van een rechtspersoon in de zin van dit artikel. Voorts verschaffen zij Onze minister en de door hem aangewezen
      personen desgevraagd alle inlichtingen omtrent de rechtspersoon en zijn activiteiten. De in het eerste lid
      onder a bedoelde bevoegde gezagsorganen kunnen Onze minister mededelen dat zij erin toestemmen dat de gevraagde
      inlichtingen rechtstreeks door het bestuur van de rechtspersoon zelf aan Onze minister en de door hem aangewezen
      personen worden verschaft.

      5 De gemeente en het bevoegd gezag dat deel uitmaakt van het bestuur van de rechtspersoon, zijn verplicht op de
      naleving van de in de voorgaande leden genoemde voorschriften toe te zien.

      6 De [artikelen 40b][ref15], [52][ref16] en [52a][ref17] zijn van overeenkomstige toepassing ten aanzien van het
      personeel van de rechtspersoon met dien verstande dat een geschillencommissie haar werkzaamheden uitstrekt over ten
      minste vijf rechtspersonen als bedoeld in dit artikel.


