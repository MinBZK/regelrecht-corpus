  - number: 98b
    text: |-
      1 Het bevoegd gezag van een school is aangesloten bij een rechtspersoon met volledige rechtsbevoegdheid
      die zich ten doel stelt waarborgen te bieden voor de kosten van werkloosheidsuitkeringen, suppleties inzake
      arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders
      dan op grond van de [Ziektewet][ref1]. De eerste volzin is van overeenkomstige toepassing op het bestuur van een
      centrale dienst voor zover het betreft personeel dat is belast met het geven van leerwegondersteunend onderwijs dan
      wel het uitoefenen van taken en bevoegdheden als bedoeld in [artikel 53b, eerste lid, tweede volzin][ref2]. De in
      de eerste volzin bedoelde rechtspersoon wordt door Onze Minister aangewezen.

      2 Het bevoegd gezag onderscheidenlijk het bestuur voldoet aan de rechtspersoon jaarlijks een door die
      rechtspersoon vast te stellen bijdrage in verband met de kosten van werkloosheidsuitkeringen, suppleties inzake
      arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan
      op grond van de [Ziektewet][ref3].

      3 Van de in het eerste en tweede lid bedoelde verplichting kan Onze Minister op verzoek van het bevoegd gezag
      onderscheidenlijk het bestuur ontheffing verlenen op grond van bezwaren van godsdienstige of levensbeschouwelijke
      aard. Onze Minister verleent de ontheffing slechts, indien het bevoegd gezag onderscheidenlijk het bestuur aantoont
      dat een afdoende andere voorziening is getroffen met betrekking tot de kosten van werkloosheidsuitkeringen,
      suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen
      personeel anders dan op grond van de [Ziektewet][ref4]. Onze Minister besluit binnen zes maanden na ontvangst van
      een verzoek. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de verzoeker
      daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.

      4 De rechtspersoon stelt regels vast voor de behandeling, beoordeling en beantwoording van een verzoek van het
      bevoegd gezag onderscheidenlijk het bestuur als bedoeld in [artikel 96o, derde lid][ref5] onderscheidenlijk
      [artikel 96q.1][ref6]. Indien het bevoegd gezag onderscheidenlijk het bestuur zich beroept op overwegingen van
      godsdienstige of levensbeschouwelijke aard, betrekt de rechtspersoon die overwegingen bij de beoordeling van een in
      de eerste volzin bedoeld verzoek.

      5 Indien de rechtspersoon het in het vierde lid bedoelde verzoek heeft ingewilligd, vergoedt hij aan de instantie
      die de werkloosheidsuitkeringen, de suppleties inzake arbeidsongeschiktheid alsmede de uitkeringen wegens ziekte
      en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref7] verstrekt of heeft
      verstrekt, de kosten van die uitkeringen of suppleties.

      6 Tegen een besluit van de rechtspersoon kan het bevoegd gezag onderscheidenlijk het bestuur beroep instellen bij
      de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
