  - number: '83'
    text: |-
      1 Indien bijzondere ontwikkelingen in het onderwijs daartoe aanleiding geven, kan Onze minister op verzoek van
      het bevoegd gezag van een school voor een door hem te bepalen periode en een door hem te bepalen doel aanvullende
      bekostiging voor huisvestings- en inventariskosten verstrekken.

      2 Indien voor de kosten, bedoeld in artikel 81, eerste lid onderdeel e en tweede lid onderdeel e, de vastgestelde
      normbedragen niet toereikend zijn, kan Onze minister op verzoek van het bevoegd gezag van een school voor een door
      hem te bepalen periode aanvullende bekostiging verstrekken.

      3 Onze minister besluit binnen negen maanden na ontvangst van een verzoek. Indien de beschikking niet binnen negen
      maanden kan worden gegeven, stelt Onze minister de verzoeker daarvan in kennis en noemt hij daarbij een termijn
      waarbinnen de beschikking wel tegemoet kan worden gezien.

      4 Onze minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel83
  - number: '84'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden voor de scholen de grondslagen vastgesteld voor de omvang
      van de formatie van:

      a. de rectoren, directeuren, conrectoren en adjunct-directeuren,

      b. de leraren, en

      c. het onderwijsondersteunend personeel.

      De formatie is redelijkerwijs voldoende voor het leiden en beheren van de school, wat de onder a genoemde
      personeelscategorie betreft, voor het geven van onderwijs, wat de onder b genoemde personeelscategorie betreft,
      en voor de overige werkzaamheden voortvloeiende uit het geven van onderwijs, alsmede voor de ondersteuning van het
      onderwijs, wat de onder c genoemde personeelscategorie betreft.

      2 De grondslagen van de berekening van de omvang van de formatie worden wat het in het eerste lid onder a, b en c
      genoemde personeel betreft in elk geval gevormd door:

      a. een normatieve relatie tussen het aantal leerlingen en het aantal personeelsleden van de school, onderscheiden
      naar personeelscategorieën, en

      b. een opslag in verband met formatieve fricties en vanwege herbezetting in verband met arbeidsduurverkorting.

      3 De grondslagen worden wat het in het eerste lid onder b genoemde personeel betreft bovendien gevormd door een
      vast aantal formatieplaatsen.

      4 Voor het in het eerste lid, onderdeel b, bedoelde personeel wordt voor scholen met leerwegondersteunend onderwijs
      dat op grond van [artikel 75c][ref1] in aanmerking komt voor bekostiging een afzonderlijke grondslag vastgesteld op
      basis van het aantal leerlingen in dat onderwijs voor wie de regionale verwijzingscommissie heeft bepaald dat zij
      op dat onderwijs zijn aangewezen of toelaatbaar zijn tot het praktijkonderwijs.

      5 De algemene maatregel van bestuur, bedoeld in het eerste lid, wordt aan de beide Kamers der Staten-Generaal
      overgelegd. Een maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel75c
