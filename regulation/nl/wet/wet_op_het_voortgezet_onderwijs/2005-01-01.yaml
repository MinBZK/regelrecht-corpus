  - number: 11e
    text: |-
      1 Het bevoegd gezag van een school als bedoeld in de [artikelen 7][ref1], [8][ref2], [9][ref3] en [10a][ref4],
      kan na overleg met de ouders een leerling op individuele basis vrijstelling verlenen voor een van de vakken genoemd
      in [artikel 11a, tweede lid][ref5]. Het bevoegd gezag bepaalt bij de vrijstelling welk onderwijs voor de leerling
      in de plaats komt voor het vak waarvan vrijstelling is verleend. Het bevoegd gezag geeft de inspectie kennis van
      de verleende vrijstelling en vermeldt de gronden waarop deze vrijstelling berust. De eerste volzin vindt geen
      toepassing indien ten aanzien van de leerling met toepassing van [artikel 11c, vierde lid][ref6], een oriënterend
      programma is vastgesteld.

      2 Indien het bevoegd gezag een oriënterend programma als bedoeld in [artikel 11c, vierde lid][ref7],
      vaststelt, verleent het de leerling vrijstelling van het vak Franse taal of het vak Duitse taal, genoemd
      in [artikel 11a, tweede lid, onder a][ref8]. Het bevoegd gezag geeft de inspectie kennis van de verleende
      vrijstelling. Vaststelling van een oriënterend programma en verlening van vrijstelling als bedoeld in de eerste
      volzin blijven achterwege indien de leerling reeds met toepassing van [artikel 11e, eerste lid][ref9], is
      vrijgesteld voor een van de vakken, genoemd in [artikel 11a, tweede lid][ref10].

      3 De scholen, bedoeld in de [artikelen 7][ref11], [8][ref12], 9 en 10a, kunnen ten behoeve van
      leerlingen die daarvoor in aanmerking komen, bij de inrichting van het onderwijs voor een of meer vakken
      afwijken van de kerndoelen en van de voorschriften, bedoeld in [artikel 11a, tweede lid][ref13], en
      [artikel 22, derde lid, de onderdelen a tot en met d][ref14], voor zover deze voorschriften verband houden met
      het bepaalde in [artikel 11a][ref15]. Het bevoegd gezag bepaalt bij vrijstelling van een of meer vakken, genoemd
      in [artikel 11a, tweede lid][ref16], welk onderwijs in de vakken, genoemd in [artikel 11a, tweede lid][ref17],
      daarvoor in de plaats komt. Bij algemene maatregel van bestuur wordt bepaald op welke wijze wordt vastgesteld welke
      leerlingen in aanmerking komen voor de afwijkingen, bedoeld in dit lid. De algemene maatregel van bestuur, bedoeld
      in de vorige volzin, wordt aan de beide Kamers der Staten-Generaal overgelegd. De maatregel treedt niet in werking
      dan nadat vier weken na de overlegging zijn verstreken en gedurende die termijn niet door of namens een van beide
      Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde onderwerp bij de wet wordt geregeld.
      Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.


