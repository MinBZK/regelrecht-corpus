  - number: 76v
    text: |-
      In afwijking van dit hoofdstuk kan de gemeenteraad besluiten dat jaarlijks een bedrag voor huisvestingskosten wordt
      betaald aan het bevoegd gezag van een andere dan een gemeentelijke school voor zover die op het grondgebied van die
      gemeente in stand wordt gehouden. De gemeenteraad neemt het besluit in overeenstemming met het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0002399/2005-01-01#Artikel76v
  - number: 76v.1
    text: |-
      1 In afwijking van het bepaalde in dit hoofdstuk en onverminderd het tweede lid zijn de bepalingen inzake de
      huisvesting bij of krachtens de [Wet educatie en beroepsonderwijs][ref1] van toepassing op scholen voor voortgezet
      onderwijs die deel uitmaken van een scholengemeenschap waarin tot één instelling zijn verenigd:

      a. een regionaal opleidingencentrum als bedoeld in de [Wet educatie en beroepsonderwijs][ref2] en een school voor
      voortgezet onderwijs, dan wel

      b. een agrarisch opleidingscentrum als bedoeld in de [Wet educatie en beroepsonderwijs][ref3] en een school voor
      middelbaar algemeen voortgezet onderwijs.

      2 [Artikel 76u][ref4] is van overeenkomstige toepassing op de gebouwen en terreinen waarvan het bevoegd
      gezag van een andere dan een gemeentelijke school eigenaar is op het moment dat op of na 1 januari 1997 een
      scholengemeenschap als bedoeld in het eerste lid tot stand komt dan wel wordt uitgebreid met een school voor
      voortgezet onderwijs.

      3 De gemeenteraad kan in overeenstemming met het bevoegd gezag besluiten:

      a. dat het tweede lid niet van toepassing is,

      b. dat daarvoor het bevoegd gezag of de gemeenteraad aan de andere partij een vergoeding is verschuldigd, alsmede

      c. in voorkomende gevallen, hoe hoog die vergoeding is.

      4 Indien toepassing is gegeven aan het derde lid, vindt inschrijving van dat feit plaats in de openbare registers,
      bedoeld in [afdeling 2 van titel 1 van Boek 2 van het Burgerlijk Wetboek][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625
