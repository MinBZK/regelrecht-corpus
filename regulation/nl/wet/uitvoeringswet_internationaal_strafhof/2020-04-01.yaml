  - number: '68.2'
    text: |-
      [Artikel 67, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel67
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel68
