        paragraaf: '3'
  - number: '69.1'
    text: |-
      De tenuitvoerlegging overeenkomstig [artikel 67, vierde lid][ref1], of [artikel 68, tweede lid][ref2], van
      een door het Strafhof opgelegde gevangenisstraf geschiedt met inachtneming van het bij of krachtens het
      [Wetboek van Strafrecht][ref3], het [Wetboek van Strafvordering][ref4], de [Penitentiaire beginselenwet][ref5] of
      enige bijzondere strafwet betreffende de tenuitvoerlegging van rechterlijke beslissingen bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0001854
      [ref4]: https://wetten.overheid.nl/BWBR0001903
