---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: uitvoeringswet_internationaal_strafhof
regulatory_layer: WET
publication_date: '2017-03-09'
valid_from: '2020-04-01'
bwb_id: BWBR0013796
url: https://wetten.overheid.nl/BWBR0013796/2020-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het nodig is om ter uitvoering van het Statuut van het Internationaal
    Strafhof voorzieningen te treffen met betrekking tot de samenwerking met en bijstand aan het Internationaal
    Strafhof en de tenuitvoerlegging van zijn vonnissen;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van deze rijkswet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
  - number: 1.1.a
    text: |-
      Statuut: het op 17 juli 1998 te Rome tot stand gekomen Statuut van Rome inzake het Internationale Strafhof (Trb.
      2000, 120);
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
  - number: 1.1.b
    text: |-
      Strafhof: het Internationale Strafhof, opgericht bij het Statuut, respectievelijk elk van zijn organen voor de
      daaraan toegewezen taken;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
  - number: 1.1.c
    text: |-
      consultatie: overleg als bedoeld in artikel 97 van het Statuut, tussen een staat die partij is bij het Statuut, en
      het Strafhof;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
  - number: 1.1.d
    text: |-
      samenwerking: de samenwerking, bedoeld in deel 9 van het Statuut, tussen het Strafhof en de staten die partij zijn
      bij het Statuut;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
  - number: 1.1.e
    text: |-
      overlevering: de ter beschikkingstelling van een persoon door Nederland, Aruba, Curaçao of Sint Maarten aan het
      Strafhof ten behoeve van een bij het Strafhof tegen hem gericht strafrechtelijk onderzoek of de tenuitvoerlegging
      van een hem door het Strafhof opgelegde gevangenisstraf;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
  - number: 1.1.f
    text: |-
      tenuitvoerlegging: de tenuitvoerlegging van uitspraken van het Strafhof, bedoeld in deel 10 van het Statuut, met
      inbegrip van de toepassing van voorlopige maatregelen ten behoeve van die tenuitvoerlegging;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
  - number: 1.1.g
    text: 'bijstand: de bijstand die Nederland in zijn hoedanigheid van Gastland aan het Strafhof verleent;'
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
  - number: 1.1.h
    text: |-
      doorvoer: het begeleid vervoer over Nederlands grondgebied van personen, afkomstig van een vreemde staat en met als
      bestemming het Strafhof, dan wel afkomstig van het Strafhof en met als bestemming een vreemde staat;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
  - number: 1.1.i
    text: 'Onze Minister: Onze Minister van Justitie;'
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
  - number: 1.1.j
    text: |-
      [Wetboek van Strafvordering][ref1]: het [Wetboek van Strafvordering][ref2] van het Europese deel van het
      Koninkrijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0001903
  - number: '1.2'
    text: 'In deze wet wordt mede verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
  - number: 1.2.a
    text: |-
      Nederlands grondgebied of Nederlands gebied: het grondgebied van de openbare lichamen Bonaire, Sint Eustatius en
      Saba;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
  - number: 1.2.b
    text: 'in Nederland: in de openbare lichamen Bonaire, Sint Eustatius en Saba;'
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
  - number: 1.2.c
    text: 'Nederlandse ambtenaren: ambtenaren van de openbare lichamen Bonaire, Sint Eustatius en Saba;'
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
  - number: 1.2.d
    text: 'Nederlands recht: het geldende recht in de openbare lichamen Bonaire, Sint Eustatius en Saba.'
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
  - number: '1.3'
    text: |-
      Onder officier van justitie, hulpofficier van justitie en opsporingsambtenaar wordt uitsluitend voor de toepassing
      van de [artikelen 13 tot en met 19a][ref1], mede verstaan de officier van justitie van het openbaar ministerie bij
      het gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba, de hulpofficier van justitie, bedoeld in artikel
      191 van het Wetboek van Strafvordering BES, en de opsporingsambtenaar, bedoeld in artikel 184 van dat wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel13
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '2.1'
    text: |-
      Onverminderd de overige leden van dit artikel is deze rijkswet van toepassing op Nederland, Aruba, Curaçao en Sint
      Maarten.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel2
  - number: '2.2'
    text: |-
      Indien het verzoek van het Strafhof inhoudt een verzoek om een handeling, te verrichten door de autoriteiten van
      Aruba, Curaçao of Sint Maarten, wordt het verzoek, in afwijking van [artikel 3, eerste lid][ref1], in behandeling
      genomen door de Minister van Justitie van Aruba, Curaçao onderscheidenlijk Sint Maarten. Deze zendt het verzoek
      overeenkomstig artikel 3, tweede en vierde lid, door aan de procureur-generaal van Aruba en aan de procureur-
      generaal voor Curaçao, voor Sint Maarten en voor de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel3
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '3'
        hoofdstuk: '1'
  - number: '2.3'
    text: |-
      In de gevallen, bedoeld in het tweede lid, zijn, in afwijking van het bepaalde in de [hoofdstukken 2][ref1],
      [3][ref2] en [4][ref3] van deze wet en behoudens strijd met het Statuut, het Uitleveringsbesluit van Aruba,
      Curaçao en Sint Maarten alsmede het Wetboek van Strafvordering van Aruba, Curaçao onderscheidenlijk Sint Maarten
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0013796#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013796
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013796
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0013796
        hoofdstuk: '4'
  - number: '2.4'
    text: |-
      Tegen een uitspraak van de bevoegde rechter van Aruba, Curaçao of Sint Maarten op of naar aanleiding van een
      verzoek van het Strafhof tot overlevering of tenuitvoerlegging staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel2
  - number: '3.1'
    text: |-
      Een overeenkomstig het Statuut ontvangen verzoek van het Strafhof om samenwerking, om tenuitvoerlegging of
      om vervolging van een misdrijf, gericht tegen de rechtspleging van het Strafhof, wordt door Onze Minister in
      behandeling genomen. Zo het verzoek niet tot Onze Minister is gericht, wordt het door de geadresseerde onverwijld
      aan hem doorgezonden.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel3
  - number: '3.2'
    text: |-
      Tenzij Onze Minister het verzoek zelf kan afdoen dan wel van oordeel is dat eerst aanvullende informatie van het
      Strafhof is vereist, en behoudens het derde en vierde lid, zendt hij het verzoek onverwijld door aan de officier
      van justitie bij het arrondissementsparket Den Haag.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel3
  - number: '3.3'
    text: |-
      Indien het verzoek betrekking heeft op de tenuitvoerlegging van een door het Strafhof opgelegde gevangenisstraf,
      handelt Onze Minister daarmee overeenkomstig de [artikelen 67][ref1] en [68][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel68
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '67'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '68'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '3.4'
    text: |-
      Indien het verzoek betrekking heeft op de tenuitvoerlegging van een bevel tot het doen van herstelbetalingen als
      bedoeld in artikel 75 van het Statuut, treft Onze Minister de maatregelen die naar zijn oordeel nodig zijn voor een
      goede uitvoering van het bevel. Indien het bevel inhoudt een verplichting voor de veroordeelde tot betaling van een
      som geld ten behoeve van een of meer begunstigden, zendt Onze Minister het verzoek onverwijld door aan de officier
      van justitie bij het arrondissementsparket Den Haag, die daarmee handelt overeenkomstig de [artikelen 72][ref1]
      en [83][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel83
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '83'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '3.5'
    text: |-
      Een verzoek om bijstand wordt door Onze Minister of de door deze daartoe aangewezen autoriteiten in behandeling
      genomen.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel3
  - number: '3.6'
    text: Onze Minister licht het Strafhof regelmatig in over de voortgang van de behandeling van de verzoeken.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel3
  - number: '4'
    text: |-
      Tot de behandeling, voor zover aan de rechter opgedragen, van verzoeken van het Strafhof om samenwerking of
      tenuitvoerlegging, alsmede van enig beroep, beklag of verzet in verband daarmee, is de rechtbank Den Haag bij
      uitsluiting bevoegd.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel4
  - number: '5.1'
    text: |-
      Op verzoek van enige Nederlandse autoriteit, belast met de behandeling van een strafzaak, kan Onze Minister
      overeenkomstig artikel 93, tiende lid, van het Statuut, een verzoek om rechtshulp van en samenwerking met het
      Strafhof aan het Strafhof richten.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel5
  - number: '5.2'
    text: |-
      Stukken betreffende ambtshandelingen terzake van opsporing en vervolging die de autoriteiten van het Strafhof
      hebben opgemaakt en naar aanleiding van een verzoek overleggen, hebben de bewijskracht die toekomt aan stukken
      betreffende overeenkomstige, door Nederlandse ambtenaren verrichte handelingen, met dien verstande dat hun
      bewijskracht niet uitgaat boven die welke zij voor het Strafhof hebben.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel5
  - number: '6'
    text: |-
      Politiegegevens kunnen ook zonder daartoe strekkend verzoek worden verstrekt aan het Strafhof indien dit voor de
      goede uitvoering van zijn taak noodzakelijk is. De verstrekking vindt plaats door tussenkomst van een of meerdere
      landelijke eenheden van de politie.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel6
  - number: '7.1'
    text: |-
      Indien Onze Minister van oordeel is dat voor de inwilliging van een verzoek van het Strafhof om samenwerking of
      tenuitvoerlegging belemmeringen of hindernissen bestaan, consulteert deze onverwijld het Strafhof teneinde deze
      belemmeringen of hindernissen weg te nemen.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel7
  - number: '7.2'
    text: 'Belemmeringen of hindernissen als bedoeld in het eerste lid kunnen in ieder geval bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel7
  - number: 7.2.a
    text: onvoldoende informatie voor de inwilliging van het verzoek;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel7
  - number: 7.2.b
    text: |-
      het feit dat een op verzoek van het Strafhof aan te houden persoon ondanks uiterste inspanningen niet in Nederland
      wordt aangetroffen;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel7
  - number: 7.2.c
    text: |-
      het feit dat is gebleken dat een op grond van een aanhoudingsbevel op verzoek van het Strafhof aangehouden persoon
      niet de in het bevel genoemde persoon is;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel7
  - number: 7.2.d
    text: |-
      het feit dat inwilliging van het verzoek in zijn huidige vorm strijd zou meebrengen met een reeds eerder,
      voorafgaande aan het verzoek, bestaande verdragsrechtelijke verplichting jegens een andere staat;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel7
  - number: 7.2.e
    text: |-
      het feit dat inwilliging van het verzoek in zijn huidige vorm zou leiden tot schending van het beginsel van ne bis
      in idem, bedoeld in artikel 20 van het Statuut;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel7
  - number: 7.2.f
    text: |-
      het feit dat tegen de opgeëiste persoon wegens dezelfde gedragingen een vervolging in Nederland gaande of in
      voorbereiding is;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel7
  - number: 7.2.g
    text: |-
      het feit dat de onmiddellijke inwilliging van het verzoek van het Strafhof een onderzoek of vervolging in een
      andere zaak dan die waarop het verzoek betrekking heeft, zou belemmeren;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel7
  - number: 7.2.h
    text: |-
      het feit dat de inwilliging van het verzoek de nationale veiligheidsbelangen van Nederland als bedoeld in artikel
      72 van het Statuut zou schaden;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel7
  - number: 7.2.i
    text: |-
      het geval, bedoeld in [artikel 25, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel25
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '25'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '7.3'
    text: |-
      Indien de officier van justitie, belast met de uitvoering van een verzoek van het Strafhof, belemmeringen of
      hindernissen als bedoeld in dit artikel signaleert, stelt hij Onze Minister hiervan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel7
  - number: '7.4'
    text: |-
      Onze Minister verzoekt het Strafhof om binnen een in overleg vast te stellen redelijke termijn te reageren. Op
      verzoek van het Strafhof kan deze termijn worden verlengd.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel7
  - number: '7.5'
    text: |-
      Voor de duur van de termijn, bedoeld in het vierde lid, wordt de behandeling van een verzoek om overlevering van
      een persoon dan wel om tenuitvoerlegging van een uitspraak van het Strafhof opgeschort. De behandeling van een
      verzoek om enigerlei andere vorm van samenwerking kan door Onze Minister, onderscheidenlijk door de officier van
      justitie, na overleg met Onze Minister, worden opgeschort.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel7
  - number: '7.6'
    text: |-
      Indien Onze Minister of de door deze aangewezen autoriteiten van oordeel zijn dat een verzoek om bijstand van het
      Gastland niet kan worden ingewilligd, pleegt hij onverwijld en met inachtneming van de zetelovereenkomst, bedoeld
      in artikel 3, tweede lid, van het Statuut, en de daarop gebaseerde regelingen en overeenkomsten overleg met het
      Strafhof teneinde de zaak op te lossen.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel7
  - number: '8.1'
    text: |-
      Indien en zolang het Strafhof een betwisting van de ontvankelijkheid van een zaak of de rechtsmacht van het
      Strafhof ingevolge artikel 18 of 19 van het Statuut onderzoekt, wordt de behandeling van een op die zaak betrekking
      hebbend verzoek om overlevering van een persoon opgeschort.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel8
  - number: '8.2'
    text: |-
      In het geval, bedoeld in het eerste lid, kan de behandeling van een verzoek om enigerlei andere vorm van
      samenwerking door Onze Minister, onderscheidenlijk door de officier van justitie, na overleg met Onze Minister,
      worden opgeschort, tenzij het Strafhof heeft bepaald dat de Aanklager kan voortgaan met het vergaren van het bewijs
      ingevolge het genoemde artikel 18 of 19.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel8
  - number: '9'
    text: |-
      Op betekeningen, kennisgevingen en oproepingen, gedaan krachtens deze wet, zijn de
      [artikelen 36b tot en met 36i][ref1], en [36n van het Wetboek van Strafvordering][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel36b
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel36n
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 36b
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 36n
  - number: '10'
    text: |-
      Voor zover in deze wet niet anders is bepaald, is zij mede van toepassing op een verzoek van het Strafhof om
      samenwerking of om tenuitvoerlegging terzake van een misdrijf, gericht tegen de rechtspleging van het Strafhof, als
      bedoeld in artikel 70, eerste lid, van het Statuut.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel10
  - number: '11.1'
    text: |-
      Op verzoek van het Strafhof en met inachtneming van de bepalingen van [dit hoofdstuk][ref1] worden personen aan het
      Strafhof overgeleverd:


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013796
        hoofdstuk: '2'
  - number: 11.1.a
    text: |-
      ter vervolging en berechting terzake van strafbare feiten, tot kennisneming waarvan het Strafhof ingevolge het
      Statuut bevoegd is;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel11
  - number: 11.1.b
    text: ter tenuitvoerlegging van een door het Strafhof opgelegde gevangenisstraf.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel11
  - number: '11.2'
    text: |-
      De [Uitleveringswet][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002559
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002559
  - number: '12.1'
    text: |-
      Overlevering wordt niet toegestaan dan onder de algemene voorwaarde dat de opgeëiste persoon alleen met
      uitdrukkelijke toestemming van Onze Minister zal worden vervolgd, gestraft of op enige andere wijze in zijn
      persoonlijke vrijheid beperkt terzake van feiten die voor het tijdstip van zijn overlevering zijn begaan en
      waarvoor hij niet is overgeleverd.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel12
  - number: '12.2'
    text: |-
      Overlevering wordt niet toegestaan dan onder de algemene voorwaarde dat de opgeëiste persoon alleen met
      uitdrukkelijke toestemming van Onze Minister door het Strafhof ter beschikking zal worden gesteld aan de
      autoriteiten van een derde staat terzake van feiten die voor het tijdstip van zijn overlevering zijn begaan. De
      toestemming kan worden gegeven ten aanzien van strafbare feiten waarvoor de opgeëiste persoon ook door Nederland
      aan de derde staat had kunnen worden uitgeleverd.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel12
  - number: '13.1'
    text: Op verzoek van het Strafhof kan een persoon voorlopig worden aangehouden.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel13
  - number: '13.2'
    text: Iedere officier van justitie of hulpofficier is bevoegd de voorlopige aanhouding te bevelen.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel13
  - number: '13.3'
    text: |-
      Kan het optreden van de officier van justitie of de hulpofficier niet worden afgewacht, dan is elke
      opsporingsambtenaar bevoegd de persoon aan te houden.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel13
  - number: '13.4'
    text: |-
      De aangehouden persoon wordt zo spoedig mogelijk voorgeleid voor de officier van justitie bij het
      arrondissementsparket Den Haag.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel13
  - number: '13.5'
    text: |-
      Indien de opgeëiste persoon zich in de openbare lichamen Bonaire, Sint Eustatius en Saba bevindt, blijft het
      vierde lid buiten toepassing. De aangehouden persoon die zich in de openbare lichamen Bonaire, Sint Eustatius en
      Saba bevindt wordt zo spoedig mogelijk voorgeleid voor de officier van justitie van het openbaar ministerie van de
      openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel13
  - number: '14.1'
    text: |-
      Na de opgeëiste persoon, met inachtneming van de artikelen 55, tweede lid, en 59, tweede lid, van het Statuut,
      te hebben gehoord, kan de officier van justitie bevelen dat de opgeëiste persoon gedurende drie dagen, te rekenen
      vanaf het tijdstip van de voorlopige aanhouding, in verzekering gesteld zal blijven.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel14
  - number: '14.2'
    text: |-
      Indien de opgeëiste persoon zich bevindt in de openbare lichamen Bonaire, Sint Eustatius en Saba, wordt het bevel
      door de officier van justitie van het openbaar ministerie van Bonaire, Sint Eustatius en Saba, bedoeld in het
      eerste lid, gegeven in overleg met de officier van justitie bij het arrondissementsparket Den Haag. Met het oog op
      de toepassing van het derde lid kan de termijn van inverzekeringstelling éénmaal met drie dagen worden verlengd.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel14
  - number: '14.3'
    text: |-
      Indien een opgeëiste persoon in de openbare lichamen Bonaire, Sint Eustatius en Saba overeenkomstig deze paragraaf
      in verzekering is gesteld, wordt hij binnen de termijnen van het eerste lid en tweede lid overgedragen aan de
      officier van justitie bij het arrondissementsparket Den Haag.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel14
  - number: '14.4'
    text: |-
      Het derde lid kan buiten toepassing blijven indien de opgeëiste persoon tegenover de officier van justitie die hem
      hoort, heeft verklaard in te stemmen met zijn onmiddellijke overlevering, de officier van justitie heeft beslist
      dat de persoon ter beschikking zal worden gesteld van het Strafhof en de feitelijke overlevering kan plaatsvinden
      binnen de termijnen van het eerste lid en tweede lid.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel14
  - number: '15.1'
    text: |-
      De rechter-commissaris, belast met de behandeling van strafzaken, kan op vordering van de officier van justitie de
      bewaring van de opgeëiste persoon bevelen.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel15
  - number: '15.2'
    text: Alvorens een bevel ingevolge het eerste lid te geven hoort de rechter-commissaris zo mogelijk de opgeëiste persoon.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel15
  - number: '16.1'
    text: |-
      Ambtshalve, op de vordering van de officier van justitie of op het verzoek van de opgeëiste persoon of diens
      raadsman kan de rechter-commissaris bevelen dat de vrijheidsbeneming krachtens de bepalingen van deze paragraaf
      wegens dringende en uitzonderlijke omstandigheden wordt beëindigd of voorwaardelijk wordt opgeschort of geschorst.
      De te stellen voorwaarden strekken in ieder geval ter voorkoming van vlucht.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel16
  - number: '16.2'
    text: |-
      De rechter-commissaris gaat niet over tot het bevel, bedoeld in het eerste lid, dan nadat het Strafhof, daartoe
      door tussenkomst van Onze Minister geconsulteerd, binnen een door Onze Minister te stellen termijn, aanbevelingen
      ingevolge artikel 59, vijfde lid, van het Statuut heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel16
  - number: '16.3'
    text: |-
      De opschorting of schorsing eindigt van rechtswege zodra de officier van justitie overeenkomstig [artikel 32][ref1]
      in kennis is gesteld van de beslissing van Onze Minister waarbij de overlevering is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel32
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '32'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '16.4'
    text: |-
      Op bevelen tot voorwaardelijke opschorting en schorsing, krachtens het eerste lid gegeven, zijn de
      [artikelen 80, eerste en derde tot en met vijfde lid][ref1], en [81 tot en met 88][ref2], met uitzondering van
      [artikel 86, vijfde lid, van het Wetboek van Strafvordering][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel86
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '81'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '86'
  - number: '16.5'
    text: |-
      De rechter-commissaris kan ambtshalve, op de vordering van de officier van justitie of op het verzoek van de
      opgeëiste persoon of diens raadsman het bevel tot bewaring opheffen indien binnen zestig dagen na de dag van
      de voorlopige aanhouding van het Strafhof geen verzoek tot overlevering, met de daarbij behorende stukken, is
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel16
  - number: '17'
    text: |-
      Van elke beslissing, genomen krachtens een van de [artikelen 13 tot en met 16][ref1], geeft de officier van
      justitie onverwijld kennis aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel13
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '18.1'
    text: |-
      De officier van justitie die van Onze Minister het verzoek tot overlevering heeft ontvangen, is bevoegd de
      aanhouding te bevelen, welk bevel in het gehele land ten uitvoer kan worden gelegd.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel18
  - number: '18.2'
    text: |-
      De persoon wordt na zijn aanhouding binnen vierentwintig uren voor de officier van justitie geleid. Na de opgeëiste
      persoon, met inachtneming van de artikelen 55, tweede lid, en 59, tweede lid, van het Statuut, te hebben gehoord,
      kan de officier van justitie bevelen dat de opgeëiste persoon in verzekering gesteld zal blijven tot het tijdstip
      waarop de rechtbank over zijn gevangenhouding beslist.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel18
  - number: '19'
    text: |-
      Wanneer de opgeëiste persoon, op de dag waarop de officier van justitie het verzoek tot overlevering ontvangt,
      reeds krachtens [artikel 14][ref1] in verzekering is gesteld, kan de vrijheidsbeneming, in afwijking van
      [artikel 15, eerste lid][ref2], op bevel van de officier van justitie worden voortgezet tot het tijdstip waarop de
      rechtbank over de gevangenhouding beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel15
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 19a.1
    text: |-
      Nadat de opgeëiste persoon, met inachtneming van de artikelen 55, tweede lid en 59, tweede lid, van het Statuut,
      is gehoord, kan de officier van justitie bij het parket in eerste aanleg van de openbare lichamen bevelen dat de
      opgeëiste persoon gedurende drie dagen, te rekenen vanaf het tijdstip van voorlopige aanhouding, in verzekering
      gesteld zal blijven. Hij overlegt daartoe met de officier van justitie bij het arrondissementsparket Den Haag.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel19a
  - number: 19a.2
    text: |-
      Indien de opgeëiste persoon op de dag waarop de officier van justitie het verzoek tot uitlevering ontvangt reeds
      krachtens [artikel 14][ref1] in de openbare lichamen Bonaire, Sint Eustatius en Saba in verzekering is gesteld,
      kan de vrijheidsbeneming – met afwijking van artikel 14 – uitsluitend op bevel van de officier van justitie bij
      het arrondissementsparket Den Haag worden voortgezet tot het tijdstip waarop de rechtbank over de gevangenhouding
      beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel14
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 19a.3
    text: |-
      Indien de opgeëiste persoon in de openbare lichamen Bonaire, Sint Eustatius en Saba in verzekering is
      gesteld, wordt hij binnen de termijnen van het eerste lid overgedragen aan de officier van justitie bij het
      arrondissementsparket Den Haag.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel19a
  - number: 19a.4
    text: |-
      Het derde lid kan buiten toepassing blijven indien de opgeëiste persoon tegenover de officier van justitie die hem
      hoort, heeft verklaard in te stemmen met zijn onmiddellijke overlevering, de officier van justitie heeft beslist
      dat de persoon ter beschikking zal worden gesteld van het Strafhof en de feitelijke overlevering kan plaatsvinden
      binnen de termijn van [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel14
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 19a.5
    text: |-
      Nadat de opgeëiste persoon is gehoord, kan de officier van justitie bij het arrondissementsparket Den Haag in
      overleg met de officier van justitie bij het gerecht in eerste aanleg van de openbare lichamen Bonaire, Sint
      Eustatius en Saba bevelen dat de vrijheidsbeneming wordt voortgezet tot het tijdstip waarop de rechtbank over zijn
      gevangenhouding beslist.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel19a
  - number: '20.1'
    text: |-
      Ambtshalve, op de vordering van de officier van justitie of op het verzoek van de opgeëiste persoon of diens
      raadsman kan de rechter-commissaris bevelen dat de vrijheidsbeneming krachtens de bepalingen van deze paragraaf
      wegens dringende en uitzonderlijke omstandigheden wordt beëindigd of voorwaardelijk wordt opgeschort of geschorst.
      De te stellen voorwaarden strekken in ieder geval ter voorkoming van vlucht.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel20
  - number: '20.2'
    text: |-
      [Artikel 16, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel16
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '21.1'
    text: |-
      Nadat hij het verzoek tot overlevering heeft ontvangen, vordert de officier van justitie zo spoedig mogelijk dat de
      rechtbank het verzoek in behandeling zal nemen. Hij legt daarbij de stukken aan de rechtbank over.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel21
  - number: '21.2'
    text: |-
      Een afschrift van de krachtens het eerste lid vereiste vordering wordt aan de opgeëiste persoon betekend. Daarbij
      wordt hem mededelinggedaan van de feiten waarvoor zijn overlevering is gevraagd, met vermelding van de tijden en de
      plaatsen waarop deze zijn begaan, een en ander zoals bij het verzoek tot overlevering omschreven, alsmede van het
      feit dat het een verzoek tot overlevering aan het Strafhof betreft. De eerste en de tweede volzin gelden eveneens
      in het geval dat de officier van justitie naar aanleiding van een naderhand ontvangen verzoek zijn vordering heeft
      aangevuld of gewijzigd. Van de ontvangst van aanvullende stukken, die in het dossier worden gevoegd, wordt de
      opgeëiste persoon mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel21
  - number: '21.3'
    text: |-
      Nadat de stukken aan de rechtbank zijn overgelegd, mag de kennisneming daarvan aan de opgeëiste persoon en diens
      raadsman niet worden onthouden. Het bepaalde bij en krachtens [artikel 32 van het Wetboek van Strafvordering][ref1]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel32
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '32'
  - number: '22.1'
    text: |-
      Dadelijk na de ontvangst van de in [artikel 21][ref1] bedoelde vordering bepaalt de voorzitter van de rechtbank, zo
      veel mogelijk bij voorrang, het tijdstip waarop de opgeëiste persoon door de rechtbank zal worden gehoord. Hij kan
      daarbij diens medebrenging bevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel21
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '22.2'
    text: |-
      De griffier van de rechtbank doet onverwijld aan de officier van justitie en aan de opgeëiste persoon mededeling
      van het voor het verhoor bepaalde tijdstip. Die mededeling en, zo een bevel tot medebrenging is gegeven, een
      afschrift van dat bevel worden aan de opgeëiste persoon betekend.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel22
  - number: '22.3'
    text: |-
      Indien niet blijkt dat de opgeëiste persoon reeds een raadsman heeft, geeft de voorzitter aan het bestuur van de
      raad voor rechtsbijstand last tot aanwijzing van een raadsman.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel22
  - number: '23.1'
    text: |-
      Het verhoor van de opgeëiste persoon geschiedt in het openbaar, tenzij deze een behandeling van de zaak met
      gesloten deuren verlangt of de rechtbank op de vordering van de officier van justitie of ambtshalve om gewichtige,
      in het proces-verbaal der zitting te vermelden redenen sluiting der deuren beveelt.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel23
  - number: '23.2'
    text: Het verhoor heeft plaats in tegenwoordigheid van de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel23
  - number: '23.3'
    text: Bij zijn verhoor kan de opgeëiste persoon zich door zijn raadsman doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel23
  - number: '23.4'
    text: |-
      Is de opgeëiste persoon niet verschenen en acht de rechtbank zijn aanwezigheid bij het verhoor wenselijk, dan
      gelast de rechtbank tegen een door haar te bepalen tijdstip zijn dagvaarding, zo nodig onder bijvoeging van een
      bevel tot medebrenging.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel23
  - number: '24.1'
    text: |-
      De rechtbank onderzoekt de identiteit van de opgeëiste persoon, alsmede de ontvankelijkheid van het verzoek tot
      overlevering en de mogelijkheid van inwilliging daarvan.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel24
  - number: '24.2'
    text: |-
      De officier van justitie geeft ter zitting van de rechtbank zijn opvatting over de toelaatbaarheid van de verzochte
      overlevering en legt een schriftelijke samenvatting daaromtrent aan de rechtbank over. De opgeëiste persoon en
      diens raadsman worden eveneens in de gelegenheid gesteld tot het maken van terzake dienende opmerkingen omtrent het
      verzoek tot overlevering en de in verband daarmede te nemen beslissingen.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel24
  - number: '24.3'
    text: |-
      Indien de rechtbank zulks met het oog op het door haar krachtens het eerste lid in te stellen onderzoek
      noodzakelijk acht, gelast zij, zo nodig onder bijvoeging van een bevel tot medebrenging, tegen een door haar te
      bepalen tijdstip de dagvaarding of schriftelijke oproeping van getuigen of deskundigen.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel24
  - number: '25.1'
    text: |-
      De rechtbank schorst het onderzoek met het oog op consultatie van het Strafhof, indien naar het voorlopig oordeel
      van de rechtbank de aan haar voorgeleide persoon niet degene is wiens overlevering is gevraagd.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel25
  - number: '25.2'
    text: Omtrent het besluit en de overwegingen van de rechtbank licht de officier van justitie Onze Minister in.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel25
  - number: '26.1'
    text: |-
      Op de vordering van de officier van justitie kan de rechtbank ter zitting de gevangenneming van de opgeëiste
      persoon bevelen.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel26
  - number: '26.2'
    text: |-
      Voordat het onderzoek ter zitting wordt gesloten, beslist de rechtbank ambtshalve omtrent de gevangenhouding van de
      opgeëiste persoon, zo deze in bewaring of in verzekering is gesteld.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel26
  - number: '26.3'
    text: |-
      Ambtshalve, op de vordering van de officier van justitie of op het verzoek van de opgeëiste persoon of diens
      raadsman kan de rechtbank bevelen dat de vrijheidsbeneming krachtens de bepalingen van deze paragraaf wegens
      dringende en uitzonderlijke omstandigheden wordt beëindigd of voorwaardelijk wordt opgeschort of geschorst. De te
      stellen voorwaarden strekken in ieder geval ter voorkoming van vlucht.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel26
  - number: '26.4'
    text: |-
      [Artikel 16, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel16
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '27.1'
    text: |-
      Zo spoedig mogelijk na de sluiting van het onderzoek ter zitting doet de rechtbank uitspraak omtrent het verzoek
      tot overlevering. De uitspraak wordt met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel27
  - number: '27.2'
    text: |-
      Indien de rechtbank bevindt dat zich het geval, bedoeld in [artikel 25, eerste lid][ref1], voordoet, verklaart zij
      bij haar uitspraak de overlevering ontoelaatbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel25
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '25'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '27.3'
    text: In alle andere gevallen verklaart de rechtbank bij haar uitspraak de overlevering toelaatbaar.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel27
  - number: '27.4'
    text: Tegen de uitspraak staat geen rechtsmiddel open. De uitspraak is dadelijk uitvoerbaar.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel27
  - number: '28.1'
    text: |-
      Indien de opgeëiste persoon niet bij de voorlezing van de uitspraak van de rechtbank aanwezig is, wordt de
      uitspraak aan hem betekend.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel28
  - number: '28.2'
    text: |-
      De rechtbank zendt aan Onze Minister onverwijld een gewaarmerkt afschrift van haar uitspraak toe. Indien de
      overlevering toelaatbaar is verklaard, doet zij het afschrift vergezeld gaan van haar advies omtrent het aan het
      verzoek tot overlevering te geven gevolg. Een afschrift van het advies wordt door de griffier aan de opgeëiste
      persoon en diens raadsman ter hand gesteld of toegezonden.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel28
  - number: '28.3'
    text: De griffier zendt het verzoek tot overlevering met de daarbij behorende stukken terug aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel28
  - number: '29.1'
    text: |-
      Ten aanzien van de bijstand van een raadsman, de behandeling van de zaak door de rechtbank, de beraadslaging
      en de uitspraak zijn de [artikelen 37][ref1], [38][ref2], [43 tot en met 45][ref3], [226][ref4],
      [260, eerste lid][ref5], [268][ref6], [269, vijfde lid][ref7], [271][ref8], [272][ref9], [273, derde lid][ref10],
      [274 tot en met 277][ref11], [279][ref12], [281][ref13], [286][ref14], [289, eerste en derde lid][ref15],
      [290 tot en met 301][ref16], [318 tot en met 322][ref17], [324 tot en met 327][ref18], [328 tot en met 331][ref19],
      [345, eerste en derde lid][ref20], [346][ref21], [357][ref22], [362][ref23], [363][ref24] en
      [365, eerste tot en met vijfde lid van het Wetboek van Strafvordering][ref25] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel37
