  - number: '78.5'
    text: |-
      Indien de officier van justitie overeenkomstig [artikel 76, tweede lid][ref1], heeft geweigerd een getuige te doen
      oproepen kan de veroordeelde de rechtbank verzoeken alsnog de oproeping van de getuige te bevelen. De rechtbank
      gaat hiertoe over indien zij van oordeel is dat de officier van justitie in redelijkheid niet tot zijn beslissing
      heeft kunnen komen.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel76
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '78.6'
    text: |-
      De in het vierde lid genoemde artikelen vinden geen toepassing voor zover deze betrekking hebben op een getuige
      wiens identiteit niet of slechts ten dele blijkt.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel78
  - number: '78.7'
    text: |-
      De officier van justitie legt, na voorlezing, een conclusie aan de rechtbank over. Indien zijn conclusie strekt
      tot bewilliging in de tenuitvoerlegging, omschrijft de officier van justitie de straf of maatregel die naar zijn
      oordeel in plaats van de door het Strafhof opgelegde straf behoort te worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel78
  - number: '78.8'
    text: |-
      De officier van justitie kan, zolang het onderzoek ter zitting niet is gesloten, zijn vordering, bedoeld in
      [artikel 73][ref1], intrekken. Van het intrekken van de vordering stelt hij de veroordeelde terstond in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel73
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '79.1'
    text: |-
      De rechtbank verleent verlof tot tenuitvoerlegging van de beslissing van het Strafhof en legt, met inachtneming
      van het daaromtrent in het Statuut voorgeschrevene, de straf of maatregel op die op het overeenkomstige feit naar
      Nederlands recht is gesteld. De uitspraak van de rechtbank wordt met redenen omkleed. De [artikelen 353][ref1] en
      [357 van het Wetboek van Strafvordering][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel353
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel357
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '353'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '357'
  - number: '79.2'
    text: |-
      In geen geval is de rechtbank bevoegd een zwaardere straf of maatregel op te leggen dan door het Strafhof is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel79
  - number: '79.3'
    text: Tegen de uitspraak staat geen rechtsmiddel open. De uitspraak is dadelijk uitvoerbaar.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel79
  - number: '79.4'
    text: De rechtbank zendt aan Onze Minister onverwijld een gewaarmerkt afschrift van haar uitspraak toe.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel79
  - number: '79.5'
    text: |-
      De [artikelen 363][ref1] en [365, eerste tot en met vijfde lid van het Wetboek van Strafvordering][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel363
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel365
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '363'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '365'
  - number: '80'
    text: |-
      Op de tenuitvoerlegging van een op grond van [artikel 79][ref1] opgelegde straf of maatregel is
      [artikel 69, eerste lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel69
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '79'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '69'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '81.1'
    text: |-
      Onverminderd de overige bepalingen van deze paragraaf is [dit artikel][ref1] van toepassing op een verzoek van het
      Strafhof om tenuitvoerlegging van een geldboete.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel81
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '81'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '81.2'
    text: |-
      Op de oplegging, overeenkomstig [artikel 79, eerste lid][ref1], van een geldboete is
      [artikel 23, derde, vierde, zevende en achtste lid, van het Wetboek van Strafrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '79'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '81.3'
    text: |-
      Bij oplegging van een geldboete blijft een bevel als bedoeld in
      [artikel 24c, eerste lid, van het Wetboek van Strafrecht][ref1] achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel24c
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 24c
  - number: '81.4'
    text: |-
      Indien de veroordeelde onwillig blijkt om het verschuldigde bedrag te betalen en volledig verhaal onmogelijk is
      gebleken of daarvan door het openbaar ministerie is afgezien, zendt de officier van justitie het verzoek met de
      daarbij behorende stukken zo spoedig mogelijk terug aan Onze Minister, die het Strafhof in kennis stelt.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel81
  - number: '81.5'
    text: |-
      Indien het Strafhof in het geval, bedoeld in het vierde lid, de duur van de aan de veroordeelde opgelegde
      gevangenisstraf verlengt en die gevangenisstraf in Nederland ten uitvoer wordt gelegd, zijn de [artikelen 67][ref1]
      en [68][ref2] ten aanzien van het extra deel van de gevangenisstraf van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel68
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '67'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '68'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '82.1'
    text: |-
      Onverminderd de overige bepalingen van deze paragraaf is dit artikel van toepassing op een verzoek van het Strafhof
      om tenuitvoerlegging van een bevel tot verbeurdverklaring.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel82
  - number: '82.2'
    text: |-
      Bij zijn vordering, bedoeld in [artikel 73][ref1], legt de officier van justitie tevens een lijst van voorwerpen of
      vorderingen over die ingevolge de [artikelen 61 tot en met 63][ref2] in beslag zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel61
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '82.3'
    text: |-
      Ingeval de rechtbank verlof verleent tot tenuitvoerlegging van een bevel tot verbeurdverklaring,
      spreekt zij de verbeurdverklaring uit van de desbetreffende voorwerpen. Indien verbeurdverklaring
      van een of meer van de voorwerpen niet mogelijk is, kan de rechtbank overeenkomstig de
      [artikelen 36b tot en met 36d van het Wetboek van Strafrecht][ref1] de onttrekking aan het verkeer van de
      desbetreffende voorwerpen uitspreken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: '82.4'
    text: |-
      Indien verbeurdverklaring of onttrekking aan het verkeer van een of meer van de voorwerpen niet mogelijk is, legt
      de rechtbank aan de veroordeelde de verplichting op tot betaling van een geldbedrag aan de staat ter ontneming
      van wederrechtelijk verkregen voordeel. Met inachtneming van de beslissing van het Strafhof stelt zij het bedrag
      vast op het bedrag van de voorwerpen of het gedeelte daarvan waarvan de verbeurdverklaring of onttrekking aan het
      verkeer niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel82
  - number: '82.5'
    text: |-
      Op uitspraken, voor zover houdende een verbeurdverklaring of onttrekking aan het verkeer, zijn de
      [artikelen 552b][ref1], [552e][ref2] en [552g van het Wetboek van Strafvordering][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552b
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel552e
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel552g
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552b
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 552e
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 552g
  - number: '82.6'
    text: |-
      Op uitspraken, voor zover houdende de oplegging van een verplichting tot betaling van een geldbedrag
      aan de staat ter ontneming van wederrechtelijk verkregen voordeel, zijn de [artikelen 6:4:9][ref1] en
      [6:6:26 van het Wetboek van Strafvordering][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '82.7'
    text: |-
      [Artikel 65][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel65
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '65'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '83.1'
    text: |-
      Onverminderd de overige bepalingen van deze paragraaf is dit artikel van toepassing op een verzoek van het Strafhof
      om tenuitvoerlegging van een bevel als bedoeld in artikel 75 van het Statuut, inhoudend een verplichting voor de
      veroordeelde tot betaling van een som geld ten behoeve van een of meer begunstigden.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel83
  - number: '83.2'
    text: |-
      De officier van justitie doet de begunstigde of begunstigden van het bevel oproepen, tenzij oproeping
      redelijkerwijs niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel83
  - number: '83.3'
    text: De begunstigde heeft recht op kennisneming van de stukken.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel83
  - number: '83.4'
    text: |-
      De begunstigde kan zich doen bijstaan. Hij kan zich ook doen vertegenwoordigen door een advocaat, indien deze
      verklaart daartoe bepaaldelijk gevolmachtigd te zijn, of door een daartoe bij bijzondere volmacht door hem
      schriftelijk gemachtigde.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel83
  - number: '83.5'
    text: |-
      Ter zitting wordt de begunstigde in de gelegenheid gesteld het woord te voeren over de vordering van de officier
      van justitie.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel83
  - number: '83.6'
    text: |-
      Ingeval de rechtbank verlof verleent tot tenuitvoerlegging van het bevel bedoeld in het tweede lid, legt zij aan de
      veroordeelde overeenkomstig [artikel 36f, eerste lid, van het Wetboek van Strafrecht][ref1] de verplichting op tot
      betaling aan de staat van een som geld ten behoeve van de begunstigde of begunstigden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36f
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 36f
  - number: '83.7'
    text: |-
      In geen geval is de rechtbank bevoegd de som geld op een hoger bedrag te bepalen dan door het Strafhof is
      vastgesteld. De rechtbank treedt niet in een nieuw onderzoek naar de rechten van belanghebbenden, tenzij erkenning
      van de beslissing van het Strafhof daaromtrent onverenigbaar zou zijn met de Nederlandse openbare orde.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel83
  - number: '83.8'
    text: De staat keert een ontvangen bedrag onverwijld uit aan de door het Strafhof aangewezen personen of instellingen.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel83
  - number: '83.9'
    text: |-
      Het [vijfde tot en met zevende lid van artikel 36f van het Wetboek van Strafrecht][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36f
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 36f
  - number: '84'
    text: |-
      Al hetgeen wordt verkregen uit straffen en bevelen als bedoeld in [artikel 72][ref1] komt ten bate van het
      Strafhof, onverminderd [artikel 83, achtste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel83
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '83'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '85.1'
    text: |-
      Doorvoer van personen die als verdachten door de autoriteiten van een vreemde staat aan het Strafhof worden
      overgeleverd, geschiedt in opdracht van het Strafhof door en onder de bewaking van door Onze Minister aangewezen
      Nederlandse ambtenaren.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel85
  - number: '85.2'
    text: |-
      Doorvoer van andere personen die op verzoek van het Strafhof naar Nederland zijn overgebracht of gekomen, geschiedt
      in opdracht van het Strafhof door en onder de bewaking van door Onze Minister aangewezen Nederlandse ambtenaren.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel85
  - number: '85.3'
    text: |-
      Het transport in Nederland buiten de onder het gezag van het Strafhof staande ruimten van personen aan wie op last
      van het Strafhof hun vrijheid is ontnomen, geschiedt in opdracht van het Strafhof door en onder de bewaking van
      door Onze Minister aangewezen Nederlandse ambtenaren.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel85
  - number: '85.4'
    text: |-
      De in dit artikel bedoelde ambtenaren zijn bevoegd alle dienstige maatregelen te nemen ter beveiliging van de
      betrokken personen en ter voorkoming van hun ontvluchting.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel85
  - number: '86.1'
    text: |-
      Doorvoer van personen die door het Strafhof aan de autoriteiten van een vreemde staat worden overgedragen,
      geschiedt in opdracht van het Strafhof door en onder de bewaking van door Onze Minister aangewezen Nederlandse
      ambtenaren.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel86
  - number: '86.2'
    text: |-
      De in dit artikel bedoelde ambtenaren zijn bevoegd alle dienstige maatregelen te nemen ter beveiliging van de
      betrokken personen en ter voorkoming van hun ontvluchting.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel86
  - number: '87.1'
    text: |-
      Ingeval getuigen, deskundigen, slachtoffers of andere personen die aanwezig dienen te zijn op de zetel van het
      Strafhof, van welke nationaliteit ook, naar Nederland komen ten vervolge op een dagvaarding of oproeping dan
      wel een bevel tot medebrenging van het Strafhof of ten vervolge op een verzoek van het Strafhof aan Nederland om
      toelating overeenkomstig de voorwaarden vermeld in de zetelovereenkomst, bedoeld in artikel 3, tweede lid, van het
      Statuut kunnen zij in Nederland niet worden vervolgd, aangehouden of aan enige andere vrijheidsbeperkende maatregel
      worden onderworpen voor feiten of veroordelingen die voorafgingen aan hun aankomst in Nederland.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel87
  - number: '87.2'
    text: |-
      De in het eerste lid bedoelde immuniteit vervalt indien de desbetreffende persoon, hoewel hij gedurende vijftien
      achtereenvolgende dagen na het tijdstip waarop zijn aanwezigheid niet meer door het Strafhof werd vereist, de
      mogelijkheid had Nederland te verlaten, hier te lande is gebleven of in Nederland is teruggekeerd na het te hebben
      verlaten.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel87
  - number: '88'
    text: |-
      De Nederlandse wet is niet van toepassing op vrijheidsontneming ondergaan op last van het Strafhof binnen in
      Nederland aan het Strafhof ter beschikking gestelde ruimten.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel88
  - number: '89'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel89
  - number: '90'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet Internationaal Strafhof.'
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel90
