  - number: '70.1'
    text: |-
      Indien het Strafhof overeenkomstig artikel 104 van het Statuut besluit de veroordeelde over te brengen naar een
      andere staat, wordt de betrokkene zo spoedig mogelijk ter beschikking gesteld van de autoriteiten van die staat,
      zulks op een door Onze Minister, na overleg met die autoriteiten, te bepalen tijd en plaats.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel70
  - number: '70.2'
    text: |-
      Op het moment dat de betrokkene ter beschikking van de in het eerste lid bedoelde autoriteiten wordt gesteld,
      eindigt de tenuitvoerlegging in Nederland van de hem opgelegde gevangenisstraf van rechtswege.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel70
  - number: '71.1'
    text: |-
      Mededelingen, gewisseld tussen de veroordeelde en het Strafhof, worden niet belemmerd en zijn vertrouwelijk. De
      indiening door de veroordeelde van een verzoekschrift of enig ander geschrift kan door tussenkomst van de directeur
      van de inrichting waarin de veroordeelde verblijft, geschieden. De directeur draagt in dat geval zorg dat het
      geschrift, voorzien van een dagtekening, onverwijld aan het Strafhof wordt gezonden.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel71
  - number: '71.2'
    text: |-
      Daartoe door het Strafhof aangewezen personen hebben overeenkomstig
      [artikel 38, zevende lid, tweede tot en met vierde volzin, van de Penitentiaire beginselenwet][ref1], toegang tot
      de veroordeelde in de inrichting waarin hij verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel38
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '38'
  - number: '71.3'
    text: |-
      Verzoeken van het Strafhof om informatie die het Strafhof nodig heeft voor de uitoefening van zijn toezichthoudende
      taak overeenkomstig artikel 106 van het Statuut, worden door Onze Minister zo veel mogelijk ingewilligd.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel71
  - number: '71.4'
    text: |-
      Op verzoek van het Strafhof wordt de veroordeelde die daarmee instemt, tijdelijk ter beschikking van het Strafhof
      gesteld met het oog op enig door het Strafhof te verrichten onderzoek in verband met de tenuitvoerlegging.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel71
  - number: '72'
    text: |-
      Deze paragraaf is van toepassing op een verzoek van het Strafhof tot tenuitvoerlegging van een of meer van de
      volgende straffen en bevelen, door het Strafhof opgelegd onderscheidenlijk uitgevaardigd:
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel72
  - number: 72.a
    text: een geldboete;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel72
  - number: 72.b
    text: |-
      een bevel tot verbeurdverklaring van opbrengsten, goederen en vermogensbestanddelen die direct of indirect door het
      misdrijf zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel72
  - number: 72.c
    text: |-
      een bevel als bedoeld in artikel 75 van het Statuut, inhoudend een verplichting voor de veroordeelde tot betaling
      van een som geld ten behoeve van een of meer begunstigden.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel72
  - number: '73'
    text: |-
      De officier van justitie vordert binnen twee weken na de dag waarop hij het verzoek met de daarbij behorende
      stukken heeft ontvangen, dat de rechtbank verlof verleent tot tenuitvoerlegging. Bij zijn vordering legt de
      officier van justitie de stukken aan de rechtbank over. Een afschrift van de vordering wordt aan de veroordeelde
      betekend.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel73
  - number: '74.1'
    text: |-
      Zo spoedig mogelijk na ontvangst van de in [artikel 73][ref1] bedoelde vordering bepaalt de voorzitter van de
      rechtbank het tijdstip waarop de rechtbank een aanvang zal maken met de behandeling van de vordering. Tussen de
      dag waarop de mededeling om ter zitting te verschijnen aan de veroordeelde is betekend en die der zitting moet een
      termijn van ten minste tien dagen verlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel73
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '74.2'
    text: |-
      Met toestemming van de veroordeelde kan deze termijn worden verkort, mits van deze toestemming uit een
      schriftelijke verklaring blijkt.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel74
  - number: '75'
    text: |-
      De griffier van de rechtbank doet onverwijld aan de officier van justitie en aan de veroordeelde mededeling van
      het tijdstip dat voor de behandeling van de vordering is bepaald. Daarbij wordt de veroordeelde, indien niet blijkt
      dat hij reeds een raadsman heeft, opmerkzaam gemaakt op zijn bevoegdheid een of meer raadslieden te kiezen en op de
      mogelijkheden tot toevoeging van een raadsman, alsmede op zijn recht op kennisneming van de processtukken.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel75
  - number: '76.1'
    text: |-
      De officier van justitie en de veroordeelde zijn bevoegd ten behoeve van het onderzoek dat de rechtbank ingevolge
      deze paragraaf heeft te verrichten en de beslissingen die zij heeft te nemen, getuigen en deskundigen te doen
      oproepen.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel76
  - number: '76.2'
    text: |-
      De officier van justitie kan bij met redenen omklede beslissing weigeren getuigen of deskundigen op te roepen,
      indien redelijkerwijs moet worden aangenomen dat deze door de veroordeelde zijn opgegeven teneinde ter zitting
      verklaringen af te leggen ter betwisting van feiten, als bedoeld in [artikel 78, derde lid][ref1]. De beslissing
      wordt onverwijld schriftelijk ter kennis van de veroordeelde gebracht. Hij wordt daarbij opmerkzaam gemaakt op het
      bepaalde in [artikel 78, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel78
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '78'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '78'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '77.1'
    text: |-
      De behandeling van de vordering heeft plaats in tegenwoordigheid van de officier van justitie. De veroordeelde
      wordt in de gelegenheid gesteld daarbij aanwezig te zijn en kan zich door zijn raadsman doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel77
  - number: '77.2'
    text: |-
      De behandeling van de vordering geschiedt in het openbaar, tenzij de rechtbank op verzoek van de veroordeelde of om
      gewichtige, in het proces-verbaal van de zitting te vermelden redenen sluiting der deuren beveelt.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel77
  - number: '77.3'
    text: |-
      Indien de veroordeelde rechtens van zijn vrijheid is beroofd op last van het Strafhof of van de autoriteiten van
      een vreemde staat, kan hij voor het bijwonen van de zitting naar de rechtbank worden overgebracht.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel77
  - number: '78.1'
    text: |-
      De rechtbank onderzoekt de identiteit van de veroordeelde, de ontvankelijkheid van de officier van justitie,
      alsmede de mogelijkheid van tenuitvoerlegging in Nederland van de beslissing van het Strafhof en de feiten en
      omstandigheden die voor haar beslissing van belang zijn.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel78
  - number: '78.2'
    text: |-
      De officier van justitie en de veroordeelde en diens raadsman worden in de gelegenheid gesteld ter zitting van de
      rechtbank te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel78
  - number: '78.3'
    text: |-
      De rechtbank is gebonden aan de vaststelling van de feiten die het Strafhof kennelijk aan zijn beslissing ten
      grondslag heeft gelegd. Zij treedt niet in een nieuw onderzoek naar deze feiten.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel78
  - number: '78.4'
    text: |-
      De [artikelen 260, eerste lid][ref1], [268][ref2], [269, vijfde lid][ref3], [271, eerste lid][ref4],
      [272][ref5], [273, derde lid][ref6], [274 tot en met 277][ref7], [278, tweede lid][ref8], [279][ref9],
