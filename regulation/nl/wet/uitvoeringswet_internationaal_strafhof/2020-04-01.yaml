  - number: '29.2'
    text: |-
      De in het eerste lid genoemde artikelen vinden geen toepassing voor zover deze betrekking hebben op een getuige
      wiens identiteit niet of slechts ten dele blijkt.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel29
  - number: '30.1'
    text: |-
      Nadat Onze Minister de stukken overeenkomstig [artikel 28, derde lid][ref1], heeft terugontvangen, beslist hij zo
      spoedig mogelijk op het verzoek tot overlevering.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel28
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '30.2'
    text: |-
      Indien de overlevering toelaatbaar is verklaard en Onze Minister nadere informatie van het Strafhof nodig acht voor
      een verantwoorde beslissing, kan hij de beslissing aanhouden en het Strafhof consulteren. Indien de consultatie
      van het Strafhof daartoe aanleiding geeft, kan hij het dossier van de zaak opnieuw toezenden aan de officier van
      justitie die het verzoek tot overlevering heeft behandeld, waarna de [artikelen 21 tot en met 29][ref1] opnieuw
      toepassing vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel21
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '30.3'
    text: |-
      Indien tegen de opgeëiste persoon wegens hetzelfde feit een strafvervolging in Nederland gaande is, geeft Onze
      Minister bij zijn beslissing tot inwilliging van het verzoek tevens opdracht de vervolging te staken.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel30
  - number: '30.4'
    text: Indien en voor zover de overlevering ontoelaatbaar is verklaard, wordt op het verzoek afwijzend beschikt.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel30
  - number: '31'
    text: |-
      Indien het Strafhof en een of meer staten de overlevering onderscheidenlijk uitlevering van dezelfde persoon hebben
      gevraagd, beslist Onze Minister met inachtneming van artikel 90 van het Statuut.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel31
  - number: '32'
    text: |-
      Van zijn beslissing op het verzoek tot overlevering geeft Onze Minister onverwijld kennis aan de officier van
      justitie en het Strafhof.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel32
  - number: '33.1'
    text: |-
      Binnen tien dagen na de beslissing van Onze Minister tot gehele of gedeeltelijke inwilliging van het verzoek om
      overlevering wordt de opgeëiste persoon op een door Onze Minister in overleg met het Strafhof vastgestelde tijd en
      plaats ter beschikking van het Strafhof gesteld.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel33
  - number: '33.2'
    text: |-
      Een overeenkomstig [artikel 26][ref1] bevolen vrijheidsbeneming kan tot de feitelijke overlevering worden
      voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel26
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '33.3'
    text: |-
      Na een afwijzende beslissing van Onze Minister gelast de officier van justitie de beëindiging van de
      vrijheidsbeneming zodra hij kennis heeft gekregen van die beslissing.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel33
  - number: '34.1'
    text: |-
      Indien zulks voor de toepassing van [artikel 33, eerste lid][ref1], of [35, tweede lid][ref2], noodzakelijk
      is, wordt de opgeëiste persoon op bevel van de daartoe door Onze Minister aangeschreven officier van justitie
      aangehouden voor ten hoogste drie dagen. Indien de overlevering niet binnen de termijn van drie dagen heeft kunnen
      plaatsvinden, kan het bevel tot aanhouding door de officier van justitie eenmaal voor ten hoogste drie dagen worden
      verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel35
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '33'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '35'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '34.2'
    text: |-
      Na verlenging van de in het eerste lid bedoelde termijn door de officier van justitie, kan deze uitsluitend op
      vordering van de officier van justitie door de rechter-commissaris met vier dagen worden verlengd. Deze verlenging
      kan slechts geschieden wanneer de overlevering door bijzondere omstandigheden niet binnen de termijn van zes dagen
      heeft kunnen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel34
  - number: '35.1'
    text: |-
      In afwijking van de [artikelen 33, eerste lid][ref1], en [34][ref2] kan de beslissing omtrent de tijd en de plaats
      van overlevering worden aangehouden, indien en zolang tegen de opgeëiste persoon een strafrechtelijke vervolging in
      Nederland gaande is of een door een Nederlandse rechter tegen hem gewezen strafvonnis nog geheel of ten dele voor
      tenuitvoerlegging vatbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel34
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '33'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '35.2'
    text: |-
      In gevallen als voorzien in het eerste lid kan Onze Minister, zo hij daarvoor termen aanwezig acht, bepalen dat
      de opgeëiste persoon, ten behoeve van diens berechting door het Strafhof, reeds aanstonds ter beschikking van het
      Strafhof wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel35
  - number: '35.3'
    text: |-
      Ondergaat de opgeëiste persoon, te wiens aanzien het tweede lid wordt toegepast, een vrijheidsstraf, dan komt de
      tijd gedurende welke hij ter beschikking is gesteld van het Strafhof, in mindering op zijn straftijd.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel35
  - number: '36.1'
    text: |-
      De persoon wiens voorlopige aanhouding of overlevering vanwege het Strafhof is verzocht, wordt voorafgaand aan
      ieder verhoor gewezen op de mogelijkheid te verklaren dat hij instemt met onmiddellijke overlevering.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel36
  - number: '36.2'
    text: |-
      Tot de aanvang van de zitting kan hij een verklaring als bedoeld in het eerste lid afleggen ten overstaan van de
      rechter-commissaris. Tijdens de zitting kan hij de verklaring afleggen ten overstaan van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel36
  - number: '36.3'
    text: |-
      De opgeëiste persoon kan zich bij het afleggen van de verklaring doen bijstaan door een raadsman. Hierop wordt, zo
      hij zonder raadsman verschijnt, zijn aandacht gevestigd door de rechter-commissaris.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel36
  - number: '36.4'
    text: |-
      Voordat hij de verklaring aflegt, wordt de opgeëiste persoon over de mogelijke gevolgen daarvan ingelicht. Van de
      verklaring wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel36
  - number: '36.5'
    text: De rechter-commissaris zendt het proces-verbaal aan de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel36
  - number: '37.1'
    text: |-
      Nadat een verklaring overeenkomstig [artikel 36][ref1] is afgelegd, kan de officier van justitie beslissen dat de
      opgeëiste persoon ter beschikking zal worden gesteld van het Strafhof.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel36
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '37.2'
    text: |-
      Het eerste lid blijft buiten toepassing indien blijkt dat tegen de opgeëiste persoon in Nederland een
      strafrechtelijke vervolging gaande is of dat tegen hem door een Nederlandse rechter een nog geheel of ten dele
      voor tenuitvoerlegging vatbaar strafvonnis is gewezen. In dat geval doet de officier van justitie een vordering als
      bedoeld in [artikel 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel21
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '37.3'
    text: |-
      Van elke beslissing, genomen krachtens het eerste of tweede lid, geeft de officier van justitie onverwijld kennis
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel37
  - number: '38.1'
    text: |-
      Indien de officier van justitie overeenkomstig [artikel 37, eerste lid][ref1], heeft beslist dat de opgeëiste
      persoon ter beschikking zal worden gesteld van het Strafhof, blijft [artikel 21][ref2] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel21
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '37'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '38.2'
    text: |-
      Is de in [artikel 21][ref1] bedoelde vordering reeds bij de rechtbank ingediend, dan wordt deze onverwijld
      ingetrokken. De griffier van de rechtbank stelt alsdan het verzoek tot overlevering, met de daarbij behorende
      stukken, weder in handen van de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel21
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '38.3'
    text: Van het intrekken van de vordering geeft de officier van justitie kennis aan de opgeëiste persoon.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel38
  - number: '39.1'
    text: |-
      Binnen tien dagen nadat de officier van justitie een beslissing heeft genomen als bedoeld in
      [artikel 37, eerste lid][ref1], wordt de opgeëiste persoon op een door Onze Minister in overleg met het Strafhof
      vastgesteld moment ter beschikking van het Strafhof gesteld. De opgeëiste persoon kan tot dan toe in bewaring of in
      verzekering gesteld blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel37
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '37'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '39.2'
    text: |-
      De officier van justitie kan, zo nodig, met het oog op de overlevering krachtens de bepalingen van deze paragraaf,
      de aanhouding van de opgeëiste persoon bevelen. [Artikel 34][ref1] is verder van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel34
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '40'
    text: |-
      In geval van overlevering krachtens deze paragraaf is [artikel 12, eerste lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel12
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '41.1'
    text: |-
      Voorwerpen, aangetroffen in het bezit van degene wiens overlevering of voorlopige aanhouding krachtens het Statuut
      is gevraagd, kunnen op verzoek van het Strafhof in beslag worden genomen. De inbeslagneming geschiedt door of op
      last van de officier of hulpofficier van justitie, bevoegd tot het geven van een bevel tot aanhouding of voorlopige
      aanhouding.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel41
  - number: '41.2'
    text: |-
      Bij de in [artikel 21][ref1] bedoelde vordering legt de officier van justitie een lijst van de in beslag genomen
      voorwerpen aan de rechtbank voor.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel21
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '42.1'
    text: |-
      De rechtbank beslist bij haar uitspraak omtrent het verzoek tot overlevering tevens over de afgifte, dan wel de
      teruggave, van de in beslag genomen voorwerpen. Afgifte van die voorwerpen aan het Strafhof kan alleen worden
      bevolen voor het geval van inwilliging van het verzoek tot overlevering.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel42
  - number: '42.2'
    text: |-
      Met het oog op mogelijke rechten van derden kan de rechtbank ten aanzien van bepaalde voorwerpen beslissen, dat
      afgifte aan het Strafhof slechts mag geschieden onder het beding, dat die voorwerpen onmiddellijk zullen worden
      teruggezonden nadat daarvan het voor de strafvordering nodige gebruik zal zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel42
  - number: '42.3'
    text: |-
      Het bepaalde bij en krachtens de [artikelen 116 tot en met 119][ref1], [552a][ref2] en
      [552c tot en met 552e van het Wetboek van Strafvordering][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel552c
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '116'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 552a
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 552c
  - number: '42.4'
    text: |-
      In geval van overlevering overeenkomstig de bepalingen van [§ 6 van dit hoofdstuk][ref1] beslist de officier van
      justitie over de afgifte, dan wel de teruggave, van de in beslag genomen voorwerpen, behoudens de bevoegdheden van
      de rechtbank krachtens het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0013796
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '43'
    text: |-
      Ten aanzien van de bevelen tot vrijheidsbeneming, gegeven krachtens dit hoofdstuk, zijn de
      [artikelen 52 tot en met 55][ref1] en [57 van de Uitleveringswet][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel57
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0002559
        artikel: '57'
  - number: '44.1'
    text: |-
      In gevallen waarin de overlevering bij rechterlijk gewijsde ontoelaatbaar is verklaard, kan de rechtbank Den Haag,
      op verzoek van de opgeëiste persoon, hem een vergoeding ten laste van de staat toekennen voor de schade die hij
      heeft geleden ten gevolge van de vrijheidsbeneming, bevolen krachtens deze wet. Onder schade is begrepen het nadeel
      dat niet in vermogensschade bestaat. De [artikelen 533, derde, vierde en zesde lid][ref1], [534][ref2], [535][ref3]
      en [536 van het Wetboek van Strafvordering][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel533
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel534
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel535
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel536
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '533'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '534'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '535'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '536'
  - number: '44.2'
    text: |-
      In gevallen als bedoeld in het eerste lid vinden de [artikelen 529][ref1] en
      [530 van het Wetboek van Strafvordering][ref2] overeenkomstige toepassing op de vergoeding van kosten en schaden
      voor de opgeëiste persoon of diens erfgenamen. In de plaats van het in artikel 529, tweede lid, van het Wetboek van
      Strafvordering bedoelde gerecht treedt de rechtbank Den Haag.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel529
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel530
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '529'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '530'
  - number: '45.1'
    text: |-
      Aan verzoeken van het Strafhof om enigerlei vorm van samenwerking als bedoeld in artikel 93 van het Statuut wordt
      zo veel mogelijk het verlangde gevolg gegeven, met inachtneming van de bepalingen van [dit hoofdstuk][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0013796
        hoofdstuk: '3'
  - number: '45.2'
    text: |-
      Aan verzoeken van het Strafhof om samenwerking als bedoeld in artikel 93, eerste lid, onder l, van het Statuut
      wordt zo spoedig mogelijk het verlangde gevolg gegeven, tenzij de inwilliging ervan strijdt met de wet.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel45
  - number: '46.1'
    text: |-
      Aan een verzoek om samenwerking als bedoeld in dit hoofdstuk wordt zo veel mogelijk voldaan op de wijze die in het
      verzoek is aangegeven, met inbegrip van het volgen van de daarin uiteengezette procedures en het toestaan aan in
      het verzoek vermelde personen om aanwezig te zijn en te helpen bij de uitvoering.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel46
  - number: '46.2'
    text: |-
      De met de uitvoering van verzoeken om samenwerking belaste Nederlandse autoriteiten zijn verantwoordelijk voor de
      veiligheid van daarbij betrokken personen en zijn te dien einde bevoegd voorwaarden te stellen aan de wijze waarop
      aan verzoeken om samenwerking uitvoering wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel46
  - number: '47'
    text: |-
      Het betekenen en uitreiken van stukken aan derden, ter voldoening aan een verzoek om samenwerking, geschiedt met
      overeenkomstige toepassing van de wettelijke voorschriften betreffende het betekenen en uitreiken van Nederlandse
      stukken van vergelijkbare strekking.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel47
  - number: '48.1'
    text: |-
      Onze Minister kan toestaan dat personen die in Nederland rechtens van hun vrijheid zijn beroofd, tijdelijk ter
      beschikking van het Strafhof worden gesteld voor identificatiedoeleinden, ter verkrijging van getuigenverklaringen
      of met het oog op andere vormen van samenwerking. De betrokken persoon wordt slechts ter beschikking van het
      Strafhof gesteld, indien hij vrijelijk zijn toestemming daarvoor geeft na omtrent de gevolgen daarvan behoorlijk te
      zijn ingelicht.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel48
  - number: '48.2'
    text: |-
      Ondergaat de ter beschikking te stellen persoon, te wiens aanzien het eerste lid wordt toegepast, een
      vrijheidsstraf, dan komt de tijd gedurende welke hij ter beschikking is gesteld van het Strafhof, in mindering op
      zijn straftijd.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel48
  - number: '49'
    text: |-
      De officier van justitie die het verzoek om samenwerking heeft ontvangen, beslist onverwijld omtrent het daaraan te
      geven gevolg. De officier van justitie roept voor de uitvoering ervan zo nodig de tussenkomst in van het openbaar
      ministerie in andere arrondissementen of van de procureur-generaal voor Curaçao, voor Sint Maarten en voor de
      openbare lichamen Bonaire, Sint Eustatius en Saba. In het belang van een spoedige en doelmatige afdoening kan hij
      het verzoek overdragen aan zijn ambtgenoot in een ander arrondissement.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel49
  - number: '50.1'
    text: 'De officier van justitie stelt het verzoek om samenwerking in handen van de rechter-commissaris:'
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel50
  - number: 50.1.a
    text: |-
      indien het strekt tot het horen van personen die niet bereid zijn vrijwillig te verschijnen en de gevraagde
      verklaring af te leggen;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel50
  - number: 50.1.b
    text: |-
      indien het strekt tot het meewerken aan een verhoor door het Strafhof van een getuige of deskundige per
      videoconferentie;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel50
  - number: 50.1.c
    text: |-
      indien uitdrukkelijk is gevraagd om een beëdigde verklaring of om een verklaring, afgelegd ten overstaan van een
      rechter;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel50
  - number: 50.1.d
    text: |-
      indien het met het oog op het verlangde gevolg nodig is dat stukken van overtuiging in beslag worden genomen en
      daartoe bevoegdheidsuitoefening door de rechter-commissaris nodig is.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel50
  - number: '50.2'
    text: |-
      In andere dan de in het eerste lid voorziene gevallen kan de officier van justitie het verzoek van het Strafhof in
      handen van de rechter-commissaris stellen.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel50
  - number: '50.3'
    text: |-
      De overlegging van het verzoek geschiedt bij een schriftelijke vordering, waarin wordt omschreven welke
      verrichtingen van de rechter-commissaris worden verlangd.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel50
  - number: '50.4'
    text: De vordering, bedoeld in het derde lid, kan te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel50
  - number: '51.1'
    text: |-
      De in [artikel 50, derde lid][ref1], bedoelde vordering heeft dezelfde rechtsgevolgen als de
      vordering tot het verrichten van onderzoekshandelingen door de rechter-commissaris, als bedoeld in
      [artikel 181 van het Wetboek van Strafvordering][ref2], zulks voor wat betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel181
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '181'
  - number: 51.1.a
    text: |-
      de bevoegdheden van de rechter-commissaris ten aanzien van de door hem te horen verdachten, getuigen en
      deskundigen, alsmede die tot het bevelen van de uitlevering of overbrenging van stukken van overtuiging, het nemen
      van maatregelen in het belang van het onderzoek, het laten verrichten van een DNA-onderzoek alsmede het daartoe
      bevelen van het afnemen van celmateriaal, het betreden van plaatsen, het doorzoeken van plaatsen, het in beslag
      nemen van stukken van overtuiging en het onderzoeken van gegevens in geautomatiseerde werken;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel51
  - number: 51.1.b
    text: de bevoegdheden van de officier van justitie;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel51
  - number: 51.1.c
    text: de rechten en verplichtingen van de door de rechter-commissaris te horen personen;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel51
  - number: 51.1.d
    text: de bijstand van een raadsman;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel51
  - number: 51.1.e
    text: de verrichtingen van de griffier.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel51
  - number: '51.2'
    text: |-
      In afwijking van het eerste lid heeft een vordering als bedoeld in [artikel 50, derde lid][ref1],
      welke is gedaan met het oog op de voldoening aan een verzoek tot het meewerken aan een verhoor door
      het Strafhof van een getuige of deskundige per videoconferentie, dezelfde rechtsgevolgen als een
      vordering tot het verrichten van onderzoekshandelingen door de rechter-commissaris, als bedoeld in
      [artikel 181 van het Wetboek van Strafvordering][ref2], voor zover het betreft de toepassing van de
      [artikelen 190, eerste en vierde lid][ref3], [191][ref4], [210, eerste lid, tweede volzin][ref5],
      [213][ref6], [215][ref7], [217 tot en met 219a][ref8], [221 tot en met 225][ref9], [226a, eerste lid][ref10],
      [226c, eerste lid][ref11], [226f][ref12] en [236 van het Wetboek van Strafvordering][ref13].


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel181
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel190
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel191
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel210
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel213
      [ref7]: https://wetten.overheid.nl/BWBR0001903#Artikel215
      [ref8]: https://wetten.overheid.nl/BWBR0001903#Artikel217
      [ref9]: https://wetten.overheid.nl/BWBR0001903#Artikel221
      [ref10]: https://wetten.overheid.nl/BWBR0001903#Artikel226a
      [ref11]: https://wetten.overheid.nl/BWBR0001903#Artikel226c
      [ref12]: https://wetten.overheid.nl/BWBR0001903#Artikel226f
      [ref13]: https://wetten.overheid.nl/BWBR0001903#Artikel236
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '181'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '190'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '191'
      - id: ref5
        bwb_id: BWBR0001903
        artikel: '210'
      - id: ref6
        bwb_id: BWBR0001903
        artikel: '213'
      - id: ref7
        bwb_id: BWBR0001903
        artikel: '215'
      - id: ref8
        bwb_id: BWBR0001903
        artikel: '217'
      - id: ref9
        bwb_id: BWBR0001903
        artikel: '221'
      - id: ref10
        bwb_id: BWBR0001903
        artikel: 226a
      - id: ref11
        bwb_id: BWBR0001903
        artikel: 226c
      - id: ref12
        bwb_id: BWBR0001903
        artikel: 226f
      - id: ref13
        bwb_id: BWBR0001903
        artikel: '236'
  - number: '51.3'
    text: |-
      Ter voldoening aan een verzoek van het Strafhof om samenwerking kan, anders dan overeenkomstig het eerste en tweede
      lid, geen gebruik van dwangmiddelen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel51
  - number: '52.1'
    text: 'Voor zover het verzoek van het Strafhof om samenwerking strekt tot:'
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel52
  - number: 52.1.a
    text: onderzoek van telecommunicatie,
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel52
  - number: 52.1.b
    text: stelselmatige observatie van personen,
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel52
  - number: 52.1.c
    text: infiltratie,
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel52
  - number: 52.1.d
    text: pseudo-koop of -dienstverlening,
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel52
  - number: 52.1.e
    text: het stelselmatig inwinnen van informatie omtrent de persoon tegen wie een onderzoek loopt,
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel52
  - number: 52.1.f
    text: het heimelijk betreden van een besloten plaats,
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel52
  - number: 52.1.g
    text: het opnemen van vertrouwelijke communicatie met een technisch hulpmiddel,
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel52
  - number: 52.1.h
    text: |-
      een verkennend onderzoek, kan de officier van justitie de hem in de [titels IVa](onbekend), [V](onbekend), [Va]
      (onbekend) en [Vc van het Eerste Boek van het Wetboek van Strafvordering](onbekend) met het oog daarop toegekende
      bevoegdheden uitoefenen. Voor zover het verzoek daartoe strekt, kan eveneens toepassing worden gegeven aan
      [artikel 126ff van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel126ff
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 126ff
  - number: '52.2'
    text: |-
      Ter voldoening aan een verzoek van het Strafhof om samenwerking kan geen gebruik van de in het eerste lid bedoelde
      bevoegdheden worden gemaakt en kan aan [artikel 126ff van het Wetboek van Strafvordering][ref1] geen toepassing
      worden gegeven, anders dan overeenkomstig het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel126ff
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 126ff
  - number: '52.3'
    text: |-
      Processen-verbaal en andere voorwerpen, verkregen door toepassing van een van de bevoegdheden tot
      het onderzoeken van telecommunicatie of het opnemen van vertrouwelijke communicatie met een technisch
      hulpmiddel, kunnen worden afgegeven aan het Strafhof voor zover de rechtbank daartoe verlof verleent. De
      [artikelen 21 tot en met 25 van het Wetboek van Strafvordering][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel21
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '21'
  - number: '52.4'
    text: |-
      De artikelen 126aa, tweede lid, alsmede [126bb tot en met 126dd van het Wetboek van Strafvordering][ref1] zijn van
      overeenkomstige toepassing. [Artikel 126cc][ref2] is slechts van toepassing voor zover de betreffende processen-
      verbaal en andere voorwerpen niet aan het Strafhof zijn afgegeven. De officier van justitie draagt er zorg voor dat
      een betrokkene de processen-verbaal en andere voorwerpen die op hem betrekking hebben, op enig moment kan inzien.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel126bb
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel126cc
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 126bb
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 126cc
  - number: '53.1'
    text: |-
      De rechter-commissaris doet het verzoek om samenwerking, na bijvoeging van de processen-verbaal van de door hem
      afgenomen verhoren en van die van zijn verdere verrichtingen, zo spoedig mogelijk teruggaan naar de officier van
      justitie.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel53
  - number: '53.2'
    text: |-
      De door de rechter-commissaris in beslag genomen stukken van overtuiging en onder hem berustende gegevensdragers
      waarop gegevens zijn opgenomen die zijn vergaard met gebruikmaking van enige strafvorderlijke bevoegdheid
      worden ter beschikking van de officier van justitie gesteld, voor zover de rechtbank daartoe verlof verleent. De
      [artikelen 21 tot en met 25 van het Wetboek van Strafvordering][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel21
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '21'
  - number: '53.3'
    text: |-
      Tenzij aannemelijk is dat de rechthebbenden op de in beslag genomen stukken van overtuiging niet in Nederland
      verblijf houden, wordt het krachtens het tweede lid vereiste verlof slechts verleend onder het voorbehoud, dat bij
      de afgifte aan het Strafhof wordt bedongen, dat de stukken zullen worden teruggezonden zodra daarvan het voor de
      strafvordering nodige gebruik is gemaakt.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel53
  - number: '53.4'
    text: |-
      Het bepaalde bij en krachtens de [artikelen 116 tot en met 119][ref1], [552a][ref2], [552ca][ref3],
      [552d, eerste lid][ref4], en [552e van het Wetboek van Strafvordering][ref5] is ten aanzien van het gestelde in
      het eerste tot en met derde lid van overeenkomstige toepassing. In de plaats van het volgens die artikelen bevoegde
      gerecht treedt de rechtbank die bevoegd is tot het verlenen van het krachtens het tweede lid van dit artikel
      vereiste verlof.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel552ca
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel552d
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel552e
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '116'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 552a
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 552ca
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 552d
      - id: ref5
        bwb_id: BWBR0001903
        artikel: 552e
  - number: '54.1'
    text: |-
      Na beëindiging van zijn werkzaamheden ter voldoening aan het verzoek om samenwerking zendt de officier van justitie
      het verzoek met de daarbij behorende stukken zo spoedig mogelijk terug aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel54
  - number: '54.2'
    text: |-
      Onze Minister stelt het Strafhof onverwijld in kennis van de wijze waarop uitvoering is gegeven aan het verzoek,
      alsmede van de resultaten daarvan.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel54
  - number: '55'
    text: |-
      Op verzoek van het Strafhof en met inachtneming van de bepalingen van dit hoofdstuk kunnen door het Strafhof bij
      onherroepelijke uitspraak opgelegde straffen in Nederland ten uitvoer worden gelegd.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel55
  - number: '56.1'
    text: |-
      Terzake van gevangenisstraffen die door het Strafhof zijn opgelegd wegens een of meer van de misdrijven, bedoeld
      in artikel 5 van het Statuut, en waarvan de tenuitvoerlegging in Nederland plaatsvindt, kan geen gratie worden
      verzocht en verleend. Een verzoekschrift om vermindering of kwijtschelding van zodanige straf wordt door Onze
      Minister onverwijld doorgezonden aan het Strafhof.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel56
  - number: '56.2'
    text: |-
      Op een daartoe strekkend verzoek van het Strafhof maakt Onze Minister aan het Strafhof zijn zienswijze bekend met
      betrekking tot de heroverweging van een straf als bedoeld in het eerste lid overeenkomstig artikel 110 van het
      Statuut. Met het oog daarop kan Onze Minister het advies inwinnen van de rechtbank Den Haag en kan hij overigens
      bij derden alle inlichtingen inwinnen die hij nodig acht.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel56
  - number: '56.3'
    text: |-
      Terzake van gevangenisstraffen die door het Strafhof zijn opgelegd wegens een misdrijf gericht tegen de
      rechtspleging van het Strafhof als bedoeld in artikel 70, eerste lid, van het Statuut, alsmede terzake van overige
      door het Strafhof opgelegde straffen, kan, indien de tenuitvoerlegging in Nederland plaatsvindt, overeenkomstig
      [artikel 6:7:1 van het Wetboek van Strafvordering][ref1] gratie worden verzocht en verleend. Alvorens omtrent de
      gratieverlening wordt beslist, consulteert Onze Minister het Strafhof teneinde diens zienswijze te vernemen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '57'
    text: |-
      Ten aanzien van de bevelen tot voorlopige vrijheidsbeneming, gegeven krachtens dit hoofdstuk, zijn de
      [artikelen 61 tot en met 64a][ref1] en [66 van de Wet overdracht tenuitvoerlegging strafvonnissen][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004028#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0004028#Artikel66
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004028
        artikel: '61'
      - id: ref2
        bwb_id: BWBR0004028
        artikel: '66'
  - number: '58.1'
    text: |-
      De door het Strafhof overeenkomstig artikel 75 van het Statuut gegeven burgerrechtelijke beslissingen worden in
      Nederland erkend en kunnen er ten uitvoer worden gelegd, nadat zij er op verzoek van een belanghebbende uitvoerbaar
      zijn verklaard.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel58
  - number: '58.2'
    text: 'Erkenning en tenuitvoerlegging vinden niet plaats indien:'
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel58
  - number: 58.2.a
    text: de erkenning of tenuitvoerlegging kennelijk strijdig is met de Nederlandse openbare orde;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel58
  - number: 58.2.b
    text: |-
      het stuk dat het geding inleidt of een gelijkwaardig stuk niet regelmatig en zo tijdig als met het oog op zijn
      verdediging nodig was, aan de verweerder tegen wie verstek werd verleend, is betekend of is medegedeeld, tenzij de
      verweerder tegen de beslissing geen rechtsmiddel heeft aangewend terwijl hij daartoe in staat was;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel58
  - number: 58.2.c
    text: de beslissing onverenigbaar is met een tussen dezelfde partijen in het Koninkrijk gegeven beslissing;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel58
  - number: 58.2.d
    text: |-
      de beslissing onverenigbaar is met een beslissing die vroeger in een andere staat tussen dezelfde partijen is
      gegeven in een geschil dat hetzelfde onderwerp betreft en op dezelfde oorzaak berust, mits deze laatste beslissing
      voldoet aan de voorwaarden voor erkenning in Nederland.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel58
  - number: '58.3'
    text: |-
      De bevoegdheid van het Strafhof wordt door de rechter niet getoetst. De bevoegdheidsregels van het Strafhof
      betreffen niet de openbare orde als bedoeld in het tweede lid, onder a.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel58
  - number: '58.4'
    text: In geen geval zal worden overgegaan tot een onderzoek van de juistheid van de door het Strafhof gegeven beslissing.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel58
  - number: '58.5'
    text: |-
      Alleen beslissingen van het Strafhof waartegen geen gewoon rechtsmiddel meer openstaat, komen in aanmerking voor
      tenuitvoerlegging.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel58
  - number: '58.6'
    text: |-
      Beslissingen van het Strafhof die tot vergoedingen leiden welke de werkelijk geleden materiële en immateriële
      schade te boven gaan, worden niet erkend voorzover zij buitensporig zijn.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel58
  - number: '58.7'
    text: |-
      Verzoeken als bedoeld in het eerste en het zesde lid worden gericht tot de voorzieningenrechter van de rechtbank
      Den Haag.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel58
  - number: '58.8'
    text: |-
      Voor zover daarvan in [dit artikel][ref1] niet wordt afgeweken, zijn op het verzoek de bepalingen van de
      [artikelen 985 tot en met 992 van het Wetboek van Burgerlijke Rechtsvordering][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel985
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '985'
  - number: '59'
    text: |-
      De officier van justitie die een verzoek van het Strafhof als bedoeld in [artikel 60, eerste lid][ref1],
      [61, eerste lid][ref2], [62, eerste lid][ref3], of [63, eerste lid][ref4], heeft ontvangen, beslist onverwijld
      omtrent het daaraan te geven gevolg. [Artikel 49, tweede en derde volzin][ref5], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0013796#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0013796#Artikel63
      [ref5]: https://wetten.overheid.nl/BWBR0013796#Artikel49
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '60'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013796
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0013796
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0013796
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '60.1'
    text: |-
      Op verzoek van het Strafhof kan de persoon die door het Strafhof is veroordeeld tot een gevangenisstraf en zich in
      vrijheid bevindt, voorlopig worden aangehouden, indien gegronde redenen bestaan voor de verwachting dat deze straf
      in Nederland ten uitvoer zal worden gelegd.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel60
  - number: '60.2'
    text: |-
      [De artikelen 13 tot en met 17][ref1] zijn van overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel13
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 60.2.a
    text: |-
      de bewaring wordt bevolen voor een termijn van ten hoogste dertig dagen en op vordering van de officier van
      justitie telkens met een termijn van ten hoogste dertig dagen kan worden verlengd, totdat de tenuitvoerlegging van
      de gevangenisstraf overeenkomstig [artikel 67, vierde lid][ref1], of [artikel 68, tweede lid][ref2], een aanvang
      neemt;


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel68
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '67'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '68'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 60.2.b
    text: |-
      de in [artikel 16, vijfde lid][ref1], genoemde termijn dertig dagen bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel16
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '61.1'
    text: |-
      Naar aanleiding van een verzoek van het Strafhof om samenwerking of om tenuitvoerlegging van een verbeurdverklaring
      kan, overeenkomstig de bepalingen van de [negende afdeling van titel IV van het Eerste Boek van het Wetboek
      van Strafvordering](onbekend), een strafrechtelijk financieel onderzoek worden ingesteld dat is gericht op de
      bepaling van hier te lande aanwezig of verworven voordeel dat wederrechtelijk is verkregen door een persoon die
      aan onderzoek door het Strafhof is onderworpen. Onder wederrechtelijk verkregen voordeel worden mede verstaan
      voorwerpen die, middellijk of onmiddellijk, zijn verkregen door middel van het misdrijf waarvan die persoon wordt
      verdacht.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel61
  - number: '61.2'
    text: |-
      Tijdens het strafrechtelijk financieel onderzoek kan inbeslagneming van voorwerpen overeenkomstig
      [artikel 94, tweede lid][ref1], en [artikel 94a, tweede lid, van het Wetboek van Strafvordering][ref2] slechts
      plaatsvinden, indien gegronde redenen bestaan voor de verwachting dat te dier aanzien vanwege het Strafhof een
      verzoek om tenuitvoerlegging van een verbeurdverklaring zal worden gedaan dan wel [artikel 82, vierde lid][ref3],
      zal worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel94a
      [ref3]: https://wetten.overheid.nl/BWBR0013796#Artikel82
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '94'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 94a
      - id: ref3
        bwb_id: BWBR0013796
        artikel: '82'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '61.3'
    text: |-
      De officier van justitie doet van de instelling onderscheidenlijk de sluiting van een strafrechtelijk financieel
      onderzoek onverwijld mededeling aan Onze Minister. Daarbij doet hij tevens mededeling van alle voor het Strafhof
      dienstige inlichtingen.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel61
  - number: '62.1'
    text: 'Naar aanleiding van een verzoek van het Strafhof kunnen voorwerpen in beslag worden genomen:'
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel62
  - number: 62.1.a
    text: ten aanzien waarvan door het Strafhof een bevel tot verbeurdverklaring kan worden gegeven,
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel62
  - number: 62.1.b
    text: |-
      tot bewaring van het recht tot verhaal voor een overeenkomstig [artikel 82, vierde lid][ref1], op te leggen
      verplichting tot betaling van een geldbedrag aan de staat ter ontneming van wederrechtelijk verkregen voordeel, of


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel82
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '82'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 62.1.c
    text: die kunnen dienen om wederrechtelijk verkregen voordeel aan te tonen.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel62
  - number: '62.2'
    text: 'Inbeslagneming als bedoeld in het eerste lid, onder a en b, kan slechts plaatsvinden indien:'
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel62
  - number: 62.2.a
    text: inbeslagneming naar Nederlands recht is toegestaan en
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel62
  - number: 62.2.b
    text: |-
      gegronde redenen bestaan voor de verwachting dat ten aanzien van de voorwerpen vanwege het Strafhof een verzoek om
      tenuitvoerlegging van een verbeurdverklaring zal worden gedaan dan wel [artikel 82, vierde lid][ref1], zal worden
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel82
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '82'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '63.1'
    text: |-
      Op verzoek van het Strafhof kunnen voorwerpen in beslag worden genomen ten aanzien waarvan door het Strafhof een
      bevel tot verbeurdverklaring is gegeven.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel63
  - number: '63.2'
    text: 'Inbeslagneming als bedoeld in het eerste lid kan slechts plaatsvinden indien:'
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel63
  - number: 63.2.a
    text: inbeslagneming naar Nederlands recht is toegestaan en
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel63
  - number: 63.2.b
    text: |-
      gegronde redenen bestaan voor de verwachting dat het in het eerste lid bedoelde bevel op korte termijn in Nederland
      ten uitvoer zal worden gelegd.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel63
  - number: '64.1'
    text: |-
      Tot inbeslagneming als bedoeld in [de artikelen 62][ref1] en [63][ref2] zijn bevoegd de rechter-
      commissaris en, voor zover die bevoegdheid niet aan de rechter-commissaris is voorbehouden, de officier
      van justitie en de hulpofficier. Op vordering van de officier van justitie kan de rechter-commissaris
      de bevoegdheden uitoefenen welke hem als gevolg van het toewijzen van een vordering als bedoeld in
      [artikel 181 van het Wetboek van Strafvordering][ref3] toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0013796#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel181
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013796
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '181'
  - number: '64.2'
    text: |-
      De [artikelen 94b tot en met 94d][ref1], [96 tot en met 119][ref2], [552a][ref3], [552c][ref4], [552ca][ref5],
      [552e][ref6] en [6:1:5 van het Wetboek van Strafvordering][ref7] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel94b
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel552c
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel552ca
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel552e
      [ref7]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 94b
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '96'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 552a
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 552c
      - id: ref5
        bwb_id: BWBR0001903
        artikel: 552ca
      - id: ref6
        bwb_id: BWBR0001903
        artikel: 552e
      - id: ref7
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '65.1'
    text: |-
      Bij de overeenkomstige toepassing van de [artikelen 552a][ref1], onderscheidenlijk
      [552c van het Wetboek van Strafvordering][ref2] treedt de rechter niet in een nieuw onderzoek naar de rechten van
      belanghebbenden, indien daarover in verband met een bevel tot verbeurdverklaring door het Strafhof een vaststelling
      is gedaan. De rechter kan slechts in een dergelijk nieuw onderzoek treden indien:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel552c
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 552c
  - number: 65.1.a
    text: |-
      die vaststelling betrekking heeft op rechten terzake van in Nederland gelegen onroerende goederen of in Nederland
      te boek gestelde registergoederen;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel65
  - number: 65.1.b
    text: |-
      die vaststelling betreft de geldigheid, de nietigheid of de ontbinding van in Nederland gevestigde rechtspersonen
      of de besluiten van hun organen;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel65
  - number: 65.1.c
    text: |-
      die vaststelling is gedaan zonder dat de belanghebbende die niet is verschenen, tijdig tevoren van het geding in
      kennis was gesteld;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel65
  - number: 65.1.d
    text: die vaststelling onverenigbaar is met een terzake eerder in Nederland gegeven rechterlijke beslissing;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel65
  - number: 65.1.e
    text: erkenning van die vaststelling onverenigbaar zou zijn met de Nederlandse openbare orde.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel65
  - number: '65.2'
    text: |-
      Indien en zolang terzake van de rechten van een belanghebbende een procedure voor het Strafhof aanhangig is, is
      deze in zijn klaagschrift of vordering niet ontvankelijk.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel65
  - number: '66'
    text: |-
      Deze paragraaf is van toepassing op een verzoek van het Strafhof tot tenuitvoerlegging van een door het Strafhof
      opgelegde gevangenisstraf:
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel66
  - number: 66.a
    text: |-
      indien Nederland zich bereid heeft verklaard veroordeelden te aanvaarden en het Strafhof Nederland overeenkomstig
      artikel 103, eerste lid, onderdeel a, van het Statuut aanwijst;
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel66
  - number: 66.b
    text: |-
      indien Nederland als Gastland overeenkomstig artikel 103, vierde lid, van het Statuut gehouden is de
      gevangenisstraf ten uitvoer te leggen.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel66
  - number: '67.1'
    text: |-
      In het geval, bedoeld in [artikel 66, onder a][ref1], beslist Onze Minister of aan de aanwijzing van het Strafhof
      gevolg wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel66
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0013796
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '67.2'
    text: |-
      Op de beslissing van Onze Minister, bedoeld in het eerste lid, is [artikel 10 van het Wetboek van Strafrecht][ref1]
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel10
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '10'
  - number: '67.3'
    text: Onze Minister deelt het Strafhof zo spoedig mogelijk zijn beslissing mee.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel67
  - number: '67.4'
    text: |-
      De tenuitvoerlegging geschiedt op voordracht van de officier van justitie bij het arrondissementsparket Den Haag
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel67
  - number: '68.1'
    text: |-
      In het geval, bedoeld in [artikel 66, onder b][ref1], wordt de door het Strafhof opgelegde gevangenisstraf op
      aanwijzing van Onze Minister in Nederland ten uitvoer gelegd of verder ten uitvoer gelegd, overeenkomstig de
      voorwaarden vermeld in de zetelovereenkomst, bedoeld in artikel 3, tweede lid, van het Statuut. Op de beslissing
      van Onze Minister is [artikel 10 van het Wetboek van Strafrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013796#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel10
    url: https://wetten.overheid.nl/BWBR0013796/2020-04-01#Artikel68
