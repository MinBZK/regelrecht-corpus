        artikel: 5a
      - id: ref3
        bwb_id: BWBR0006286
        artikel: 5b
  - number: 5d
    text: |-
      Indien verscheidene schuldeisers uit hoofde van beslag of korting aanspraak hebben op een deel van de bezoldiging
      geschiedt de verdeling naar evenredigheid der inschulden, voor zover niet de ene schuldeiser voorrang heeft boven
      de anderen.
    url: https://wetten.overheid.nl/BWBR0006286/2024-07-01#Artikel5d
  - number: 5e
    text: |-
      1 Overdracht, inpandgeving of elke andere handeling waardoor de minister of staatssecretaris of zijn nagelaten
      betrekkingen enig recht op zijn bezoldiging aan een derde toekent of toekennen, is slechts geldig voor dat deel van
      de bezoldiging waarop beslag geldig zou zijn.

      2 Een volmacht tot voldoening of invordering van de bezoldiging is slechts geldig indien zij schriftelijk is
      verleend en is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0006286/2024-07-01#Artikel5e
  - number: 5f
    text: |-
      Betaling of afgifte aan een gemachtigde, nadat een volmacht tot voldoening of invorderingen van bezoldiging is
      geëindigd, ontlasten de Staat, indien een gegeven opdracht tot de betaling of afgifte niet meer tijdig kon worden
      ingetrokken, toen de Staat van het eindigen van de volmacht kennis kreeg.
    url: https://wetten.overheid.nl/BWBR0006286/2024-07-01#Artikel5f
  - number: 5g
    text: |-
      Beslag omvat in deze wet ook de invordering, bedoeld in [artikel 19 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0006286/2024-07-01#Artikel5g
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
  - number: '6'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006286/2024-07-01#Artikel6
  - number: '7'
    text: 'Deze wet wordt aangehaald als: Wet rechtspositie ministers en staatssecretarissen.'
    url: https://wetten.overheid.nl/BWBR0006286/2024-07-01#Artikel7
