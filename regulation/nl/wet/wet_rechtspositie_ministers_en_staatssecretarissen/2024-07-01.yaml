        artikel: '3'
      - id: ref4
        bwb_id: BWBR0006286
        artikel: '2'
  - number: '5'
    text: |-
      Onverschuldigd betaalde bezoldiging of uitkeringen als bedoeld in [artikel 1, derde lid][ref1],
      [artikel 2, eerste lid][ref2], en [artikel 3][ref3] kunnen worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0006286#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006286#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006286#Artikel3
    url: https://wetten.overheid.nl/BWBR0006286/2024-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006286
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006286
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006286
        artikel: '3'
  - number: 5a
    text: |-
      1 Met de bezoldiging en de uitkeringen, bedoeld in [artikel 1, derde lid][ref1], [artikel 2, eerste lid][ref2], en
      [artikel 3][ref3], kan worden verrekend hetgeen de minister of staatssecretaris of zijn nagelaten betrekkingen zelf
      als zodanig aan de Staat verschuldigd is of zijn.

      2 Verrekening als bedoeld in het eerste lid kan plaatshebben ondanks gelegd beslag of toegepaste korting als
      bedoeld in [artikel 5b, eerste lid][ref4].

      3 Verrekening als bedoeld in het eerste lid is slechts in zoverre geldig als een beslag op die bezoldiging of
      uitkeringen geldig zou zijn, met dien verstande dat verrekening van hetgeen wegens genoten huisvesting of voeding
      is verschuldigd eveneens kan plaatsvinden met dat deel van de bezoldiging dat de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref5] vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0006286#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006286#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006286#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0006286#Artikel5b
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0006286/2024-07-01#Artikel5a
