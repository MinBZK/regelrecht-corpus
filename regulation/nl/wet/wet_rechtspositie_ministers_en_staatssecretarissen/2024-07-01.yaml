        artikel: 475c
  - number: 5b
    text: |-
      1 Op de bezoldiging en de uitkeringen, bedoeld in [artikel 1, derde lid][ref1], [artikel 2, eerste lid][ref2],
      en [artikel 3][ref3], kan ten behoeve van een schuldeiser van de minister of staatssecretaris of zijn nagelaten
      betrekkingen een korting worden toegepast, mits de minister of staatssecretaris onderscheidenlijk zijn nagelaten
      betrekkingen de vordering van de schuldeiser erkent of erkennen dan wel het bestaan van de vordering blijkt uit een
      in kracht van gewijsde gegane rechterlijke uitspraak dan wel uit een authentieke akte.

      2 Korting is slechts in zoverre geldig als een beslag op die bezoldiging geldig zou zijn.

      3 Beslag, faillissement, surséance van betaling en toepassing ten aanzien van de minister of staatssecretaris of
      zijn nagelaten betrekkingen van de schuldsaneringsregeling natuurlijke personen sluiten korting uit.


      [ref1]: https://wetten.overheid.nl/BWBR0006286#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006286#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006286#Artikel3
    url: https://wetten.overheid.nl/BWBR0006286/2024-07-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0006286
        artikel: '1'
      - id: ref2
