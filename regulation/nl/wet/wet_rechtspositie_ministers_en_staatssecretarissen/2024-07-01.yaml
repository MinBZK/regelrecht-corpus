        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006286
        artikel: '3'
  - number: 5c
    text: |-
      Voor de toepassing van [artikel 475b, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] worden,
      onverminderd [artikel 5a, tweede lid][ref2], en [artikel 5b, derde lid][ref3], verrekening en korting gelijkgesteld
      met beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475b
      [ref2]: https://wetten.overheid.nl/BWBR0006286#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0006286#Artikel5b
    url: https://wetten.overheid.nl/BWBR0006286/2024-07-01#Artikel5c
    references:
