preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de rechtspositie van ministers en staatssecretarissen
    wettelijk te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006286/2024-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De bezoldiging van ministers wordt bepaald op € 14.760,00 per maand. De bezoldiging van staatssecretarissen wordt
      bepaald op € 13.787,12 per maand.

      2 Indien voor de ambtenaren die op grond van een arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie
      van Binnenlandse Zaken en Koninkrijksrelaties in een collectieve arbeidsovereenkomst een wijziging van het loon
      is overeengekomen en daarbij is bepaald dat die wijziging een algemeen karakter draagt, wordt bij ministeriële
      regeling met ingang van de datum, waarop die wijziging ingaat, de bezoldiging van ministers en staatssecretarissen
      dienovereenkomstig gewijzigd, onder nadere vaststelling, voor zoveel nodig, van de in het eerste lid genoemde
      bedragen.

      3 Indien voor de ambtenaren, bedoeld in het tweede lid, in een collectieve arbeidsovereenkomst een eenmalige
      uitkering is overeengekomen, ontvangen ministers en staatssecretarissen deze op gelijke voet.
    url: https://wetten.overheid.nl/BWBR0006286/2024-07-01#Artikel1
  - number: '2'
    text: |-
      1 Boven en behalve de bezoldiging, bedoeld in [artikel 1][ref1], ontvangen ministers en staatssecretarissen een
      eindejaarsuitkering van 8,3 procent van de bezoldiging en een vakantie-uitkering van 8 procent van de bezoldiging.

      2 Bij algemene maatregel van bestuur worden regels gesteld ten aanzien van:

      a. de voorzieningen die aan de ministers en staatssecretarissen ter beschikking worden gesteld en noodzakelijk zijn
      voor de vervulling van hun ambt;

      b. een vaste vergoeding voor de kosten van voorzieningen die voor eigen rekening van de ministers en
      staatssecretarissen komen en door hen mede worden aangewend ten behoeve van de vervulling van hun ambt.

      3 In de in het tweede lid bedoelde algemene maatregel van bestuur kan worden bepaald dat in deze algemene maatregel
      van bestuur opgenomen bedragen bij ministeriële regeling kunnen worden gewijzigd op een in deze algemene maatregel
      van bestuur aangegeven wijze.

      4 Onder de in het tweede lid, onder a, bedoelde voorzieningen zijn in ieder geval begrepen die met betrekking
      tot verhuizing en verblijf, beveiliging, informatie en communicatie, binnenlandse en buitenlandse dienstreizen en
      vervoer alsmede een voorziening voor bedrijfsgeneeskundige zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0006286#Artikel1
    url: https://wetten.overheid.nl/BWBR0006286/2024-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006286
        artikel: '1'
  - number: 2a
    text: |-
      1 Een minister of staatssecretaris die naar het oordeel van een arts een structurele
      functionele beperking heeft, kan aanspraak maken op een voorziening als bedoeld in
      [artikel 35, tweede en derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1].

      2 Het gestelde bij of krachtens [artikel 35, vijfde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0006286/2024-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '35'
  - number: '3'
    text: |-
      Na het overlijden van een minister of staatssecretaris wordt op de voet van hetgeen voor de ambtenaren die
      op grond van een arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties daaromtrent in een collectieve arbeidsovereenkomst is overeengekomen een uitkering toegekend.
    url: https://wetten.overheid.nl/BWBR0006286/2024-07-01#Artikel3
  - number: '4'
    text: |-
      1 Op de bezoldiging en uitkeringen, bedoeld in [artikel 1, derde lid][ref1], [artikel 2, eerste lid][ref2],
      en [artikel 3][ref3] is, voor zover in deze wet niet anders is bepaald, beslag mogelijk overeenkomstig de
      voorschriften van het gemene recht.

      2 Kostenvergoedingen krachtens [artikel 2, tweede lid][ref4], zijn niet vatbaar voor beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0006286#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006286#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006286#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0006286#Artikel2
    url: https://wetten.overheid.nl/BWBR0006286/2024-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006286
        artikel: '1'
      - id: ref2
