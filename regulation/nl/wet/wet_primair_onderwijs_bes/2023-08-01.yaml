    text: de door de school gehanteerde instructietaal of instructietalen,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel16
  - number: 16.1.i
    text: het beleid met betrekking tot de veiligheid,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel16
  - number: 16.1.j
    text: |-
      de wijze waarop de voorzieningen, bedoeld in [artikel 50][ref1], worden georganiseerd,


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel50
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel16
