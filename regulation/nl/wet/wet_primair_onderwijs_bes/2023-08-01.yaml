        afdeling: '1'
  - number: 16.1.f
    text: |-
      de rechten en plichten van de ouders, de leerlingen en het bevoegd gezag, waaronder de informatie over de
      klachtenregeling, bedoeld in [artikel 17][ref1], en de gronden voor vrijstelling van het onderwijs, bedoeld in
