  - number: '5.1'
    text: |-
      Bij eilandsverordening worden regels gegeven met betrekking tot het verstrekken van voeding en kleding aan
      alsmede het mogelijk maken van vervoer naar en van school voor leerlingen die zonder deze voorzieningen
      redelijkerwijs niet in staat zouden zijn de school geregeld te bezoeken als bedoeld in de [artikelen 6][ref1] en
      [7 van de Leerplichtwet BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel7
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0030281
        artikel: '7'
  - number: '5.2'
    text: De eilandsverordening maakt geen onderscheid tussen openbaar en bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel5
  - number: '5.3'
    text: |-
      De eilandsverordening eerbiedigt de op godsdienst of levensbeschouwing van de ouders berustende keuze van een
      school.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel5
  - number: '5.4'
    text: De eilandsverordening voorziet erin dat het vervoer kan plaatsvinden op een wijze die voor de leerling passend is.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel5
  - number: '5.5'
    text: |-
      De eilandsverordening kan bepalen dat het openbaar lichaam, in plaats van vergoeding in geld te geven, het
      verstrekken van voeding of kleding of het vervoer verzorgt of doet verzorgen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel5
  - number: '5.6'
    text: |-
      De eilandsverordening kan bepalen dat het bestuurscollege in bijzondere gevallen de bevoegdheid heeft ten gunste
      van de ouders van de inhoud van de eilandsverordening af te wijken.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel5
  - number: '5.7'
    text: |-
      De eilandsverordening bepaalt dat voor leerlingen die wegens hun lichamelijke, verstandelijke of zintuiglijke
      handicap op ander vervoer dan openbaar vervoer zijn aangewezen, dan wel vanwege een zodanige handicap niet
      zelfstandig van openbaar vervoer gebruik kunnen maken, een adequate voorziening wordt getroffen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel5
  - number: '6.1'
    text: |-
      Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn school met
      taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden als
      bedoeld in het [Tweede Boek, titel XIV, van het Wetboek van Strafrecht BES][ref1] jegens een leerling
      van de school, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028570
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028570
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '6'
  - number: '6.2'
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van een redelijk
      vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf als bedoeld in het eerste
      lid jegens een leerling van de school, doet het bevoegd gezag onverwijld aangifte bij een opsporingsambtenaar
      als bedoeld in [artikel 1][ref1] juncto [artikel 184 van het Wetboek van Strafvordering BES][ref2], en stelt het
      bevoegd gezag de vertrouwensinspecteur daarvan onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het
      doen van aangifte, stelt het de ouders van de betrokken leerling, onderscheidenlijk de betreffende ten behoeve van
      de school met taken belaste persoon, hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '6.3'
    text: |-
      Indien een personeelslid op enigerlei wijze bekend is geworden dat een ten behoeve van de school met taken belast
      persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een
      leerling van de school, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel6
  - number: 6a.1
    text: 'Het bevoegd gezag draagt zorg voor de veiligheid op school, waarbij het bevoegd gezag in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel6a
  - number: 6a.1.a
    text: beleid met betrekking tot de veiligheid voert,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel6a
  - number: 6a.1.b
    text: |-
      de veiligheid van leerlingen op school monitort met een instrument dat een representatief en actueel beeld geeft,
      en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel6a
  - number: 6a.1.c
    text: 'er zorg voor draagt dat bij een persoon ten minste de volgende taken zijn belegd:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel6a
  - number: 6a.1.c.1°
    text: het coördineren van het beleid in het kader van het tegengaan van pesten, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel6a
  - number: 6a.1.c.2°
    text: het fungeren als aanspreekpunt in het kader van pesten.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel6a
  - number: 6a.2
    text: |-
      Onder veiligheid, bedoeld in het eerste lid, wordt verstaan de sociale, psychische en fysieke veiligheid van
      leerlingen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel6a
  - number: 6a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het instrument, bedoeld in het
      eerste lid, onderdeel b, dat door de school wordt vormgegeven of gekozen, waaronder:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel6a
  - number: 6a.3.a
    text: de aandachtsgebieden die het instrument inzichtelijk maakt,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel6a
  - number: 6a.3.b
    text: de representativiteit van het instrument, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel6a
  - number: 6a.3.c
    text: de frequentie waarmee het instrument wordt ingezet.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel6a
  - number: 6a.4
    text: |-
      Het bevoegd gezag zendt onverwijld de resultaten van de monitor, bedoeld in het eerste lid, onderdeel b, aan de
      inspectie.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel6a
  - number: '7'
    text: |-
      Het bevoegd gezag van een bijzondere school geeft binnen vier weken na de oprichting van de school onder
      overlegging van de statuten van de rechtspersoon, die de school in stand houdt, en van de reglementen, van die
      oprichting kennis aan Onze Minister. Indien de statuten of reglementen worden gewijzigd of ingetrokken, wordt
      eveneens binnen vier weken van de wijziging of van de intrekking van de statuten of reglementen aan Onze Minister
      kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel7
  - number: '8'
    text: |-
      Ten laste van een andere openbare kas dan van Rijk en openbaar lichaam worden geen scholen in stand gehouden, noch
      uitgaven voor een school gedaan. Openbare lichamen doen geen uitgaven voor een niet door het openbaar lichaam in
      stand gehouden school dan krachtens de wet.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel8
  - number: '9.1'
    text: |-
      Deze wet is niet van toepassing op scholen die uitsluitend bestemd zijn voor kinderen die niet de Nederlandse
      nationaliteit hebben.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel9
  - number: '9.2'
    text: Bij twijfel of op een school het eerste lid van toepassing is, besluit de Kroon, de Raad van State gehoord.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel9
  - number: '10.1'
    text: |-
      Het onderwijs wordt zodanig ingericht dat de leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen. Het
      wordt afgestemd op de voortgang in de ontwikkeling van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel10
  - number: '10.2'
    text: |-
      Het onderwijs richt zich in elk geval op de emotionele en de verstandelijke ontwikkeling, en op het ontwikkelen van
      creativiteit, op het verwerven van noodzakelijke kennis en van sociale, culturele en lichamelijke vaardigheden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel10
  - number: '10.3'
    text: |-
      Het onderwijs bevordert actief burgerschap en sociale cohesie op doelgerichte en samenhangende wijze, waarbij het
      onderwijs zich in ieder geval herkenbaar richt op:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel10
  - number: 10.3.a
    text: |-
      het bijbrengen van respect voor en kennis van de basiswaarden van de democratische rechtsstaat, zoals verankerd in
      de [Grondwet][ref1], en de universeel geldende fundamentele rechten en vrijheden van de mens, en het handelen naar
      deze basiswaarden op school;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 10.3.b
    text: |-
      het ontwikkelen van de sociale en maatschappelijke competenties die de leerling in staat stellen deel uit te maken
      van en bij te dragen aan de pluriforme, democratische Caribisch Nederlandse samenleving; en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel10
  - number: 10.3.c
    text: |-
      het bijbrengen van kennis over en respect voor verschillen in godsdienst, levensovertuiging, politieke gezindheid,
      afkomst, geslacht, handicap of seksuele gerichtheid alsmede de waarde dat gelijke gevallen gelijk behandeld worden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel10
  - number: 10.3a
    text: |-
      Het bevoegd gezag draagt zorg voor een schoolcultuur die in overeenstemming is met de waarden, bedoeld in het derde
      lid, onderdeel a, creëert een omgeving waarin leerlingen worden gestimuleerd actief te oefenen met de omgang met en
      het handelen naar deze waarden en draagt voorts zorg voor een omgeving waarin leerlingen en personeel zich veilig
      en geaccepteerd weten, ongeacht de in het derde lid, onder c, genoemde verschillen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel10
  - number: '10.4'
    text: |-
      De scholen voorzien in een leerlingvolgsysteem waarin in elk geval de vorderingen van de leerling op de
      basisvaardigheden worden bijgehouden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel10
  - number: '10.5'
    text: |-
      Ten aanzien van leerlingen met een specifieke onderwijsbehoefte, is het onderwijs gericht op individuele
      begeleiding die is afgestemd op de behoeften van de leerling.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel10
  - number: '10.6'
    text: 'Het onderwijs wordt zodanig ingericht dat:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel10
  - number: 10.6.a
    text: de leerlingen in beginsel binnen een tijdvak van 8 aaneensluitende schooljaren de school kunnen doorlopen;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel10
  - number: 10.6.b
    text: |-
      de leerlingen in 8 schooljaren ten minste 7 520 uren onderwijs ontvangen, met dien verstande dat de leerlingen
      in de eerste 4 schooljaren ten minste 3 520 uren onderwijs en in de laatste 4 schooljaren ten minste 3 760 uren
      onderwijs ontvangen, en aan de leerlingen in de laatste 6 schooljaren ten hoogste 7 weken van het schooljaar 4
      dagen per week onderwijs wordt gegeven, die evenwichtig zijn verdeeld over het schooljaar, bij een schoolweek van
      in beginsel niet minder dan 5 dagen onderwijs, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel10
  - number: 10.6.c
    text: de onderwijsactiviteiten evenwichtig over de dag worden verdeeld.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel10
  - number: '10.7'
    text: |-
      Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel10
  - number: '10.8'
    text: |-
      Het onderwijs wordt zodanig ingericht dat daarbij op structurele en herkenbare wijze aandacht wordt besteed aan het
      bestrijden van achterstanden in het bijzonder van taalachterstanden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel10
  - number: '11.1'
    text: 'Het onderwijs in het openbaar lichaam Bonaire omvat, waar mogelijk in samenhang:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: 11.1.a
    text: zintuiglijke en lichamelijke oefening;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: 11.1.b
    text: Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: 11.1.c
    text: Papiaments;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: 11.1.d
    text: Engelse taal;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: 11.1.e
    text: rekenen en wiskunde;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: 11.1.f
    text: enkele kennisgebieden;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: 11.1.g
    text: expressie-activiteiten;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: 11.1.h
    text: bevordering van sociale redzaamheid, waaronder gedrag in het verkeer;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: 11.1.i
    text: bevordering van gezond gedrag.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: '11.2'
    text: 'Bij de kennisgebieden wordt in elk geval aandacht besteed aan:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: 11.2.a
    text: aardrijkskunde;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: 11.2.b
    text: geschiedenis;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: 11.2.c
    text: de natuur, waaronder biologie;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: 11.2.d
    text: maatschappelijke verhoudingen, waaronder staatsinrichting;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: 11.2.e
    text: geestelijke stromingen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: 11.2a
    text: |-
      Het onderwijs in zintuiglijke en lichamelijke oefening, bedoeld in het eerste lid, aanhef en onderdeel a, wordt
      gespreid verzorgd over alle schooljaren en beslaat in een schooljaar gemiddeld ten minste twee uren per schoolweek.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: '11.3'
    text: |-
      Het onderwijs kan naast de onderwijsactiviteiten, genoemd in het eerste en tweede lid, tevens de Spaanse taal
      omvatten.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: '11.4'
    text: |-
      Ten aanzien van de onderwijsactiviteiten, genoemd in het eerste en tweede lid, worden bij algemene maatregel van
      bestuur kerndoelen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: '11.5'
    text: |-
      Voor de school geldt de eis dat zij tenminste de kerndoelen bij haar onderwijsactiviteiten als aan het eind van
      het basisonderwijs te bereiken doelstellingen hanteert. Kerndoelen geven een beschrijving van kwaliteiten van
      leerlingen op het gebied van kennis, inzicht en vaardigheden. Indien de eerste volzin niet kan worden toegepast
      voor een leerling met een specifieke onderwijsbehoefte, wordt in het handelingsplan, bedoeld in [artikel 45][ref1],
      aangegeven wat daarvan de reden is en welke vervangende onderwijsdoelen worden gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel45
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '45'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: '11.6'
    text: |-
      Indien een bevoegd gezag van een bijzondere school dringend bedenkingen heeft tegen de krachtens het vierde lid
      vastgestelde kerndoelen, kan het bevoegd gezag eigen kerndoelen voor de school vaststellen. Deze kerndoelen zijn
      van gelijk niveau als de kerndoelen, bedoeld in het vierde lid. Het bevoegd gezag zendt de vastgestelde kerndoelen
      aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: '11.7'
    text: Het onderwijs wordt gegeven in het Nederlands en in het Papiaments.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: '11.8'
    text: |-
      Onze Minister kan in bijzondere gevallen op aanvraag van het bevoegd gezag besluiten toe te staan dat wordt
      afgeweken van de voorschriften in het eerste en tweede lid. De toestemming wordt verleend voor een bepaald tijdvak;
      zij kan voorwaarden bevatten.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel11
  - number: '12.1'
    text: 'Het onderwijs in de openbare lichamen Sint Eustatius en Saba omvat, waar mogelijk in samenhang:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: 12.1.a
    text: zintuiglijke en lichamelijke oefening;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: 12.1.b
    text: Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: 12.1.c
    text: Engelse taal;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: 12.1.d
    text: rekenen en wiskunde;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: 12.1.e
    text: enkele kennisgebieden;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: 12.1.f
    text: expressie-activiteiten;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: 12.1.g
    text: bevordering van sociale redzaamheid, waaronder gedrag in het verkeer;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: 12.1.h
    text: bevordering van gezond gedrag.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: '12.2'
    text: 'Bij de kennisgebieden wordt in elk geval aandacht besteed aan:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: 12.2.a
    text: aardrijkskunde;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: 12.2.b
    text: geschiedenis;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: 12.2.c
    text: de natuur, waaronder biologie;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: 12.2.d
    text: maatschappelijke verhoudingen, waaronder staatsinrichting;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: 12.2.e
    text: geestelijke stromingen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: 12.2a
    text: |-
      Het onderwijs in zintuiglijke en lichamelijke oefening, bedoeld in het eerste lid, aanhef en onderdeel a, wordt
      gespreid verzorgd over alle schooljaren en beslaat in een schooljaar gemiddeld ten minste twee uren per schoolweek.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: '12.3'
    text: |-
      Het onderwijs kan naast de onderwijsactiviteiten, genoemd in het eerste en tweede lid, tevens de Spaanse taal
      omvatten.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: '12.4'
    text: |-
      Ten aanzien van de onderwijsactiviteiten, genoemd in het eerste en tweede lid, worden bij algemene maatregel van
      bestuur kerndoelen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: '12.5'
    text: |-
      Voor de school geldt de eis dat zij tenminste de kerndoelen bij haar onderwijsactiviteiten als aan het eind van
      het basisonderwijs te bereiken doelstellingen hanteert. Kerndoelen geven een beschrijving van kwaliteiten van
      leerlingen op het gebied van kennis, inzicht en vaardigheden. Indien de eerste volzin niet kan worden toegepast
      voor een leerling met een specifieke onderwijsbehoefte, wordt in het handelingsplan, bedoeld in [artikel 45][ref1],
      aangegeven wat daarvan de reden is en welke vervangende onderwijsdoelen worden gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel45
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '45'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: '12.6'
    text: |-
      Indien een bevoegd gezag van een bijzondere school dringend bedenkingen heeft tegen de krachtens het vierde lid
      vastgestelde kerndoelen, kan het bevoegd gezag eigen kerndoelen voor de school vaststellen. Deze kerndoelen zijn
      van gelijk niveau als de kerndoelen, bedoeld in het vierde lid. Het bevoegd gezag zendt de vastgestelde kerndoelen
      aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: '12.7'
    text: Het onderwijs wordt gegeven in het Nederlands en in het Engels.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: '12.8'
    text: |-
      Onze Minister kan in bijzondere gevallen op aanvraag van het bevoegd gezag besluiten toe te staan dat wordt
      afgeweken van de voorschriften in het eerste en tweede lid. De toestemming wordt verleend voor een bepaald tijdvak;
      zij kan voorwaarden bevatten.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel12
  - number: '13'
    text: |-
      Het bevoegd gezag draagt zorg voor de kwaliteit van het onderwijs op de school. Onder zorg dragen voor de kwaliteit
      van het onderwijs wordt in elk geval verstaan het naleven van de bij of krachtens deze wet gegeven voorschriften en
      het uitvoeren van het stelsel van kwaliteitszorg, bedoeld in [artikel 15, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel15
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '15'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '14'
    text: Het bevoegd gezag rapporteert over de vorderingen van de leerlingen aan hun ouders.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel14
  - number: '15.1'
    text: |-
      Het schoolplan bevat een beschrijving van het beleid met betrekking tot de kwaliteit van het onderwijs dat
      binnen de school wordt gevoerd, en omvat in elk geval het onderwijskundig beleid, het personeelsbeleid en het
      stelsel van kwaliteitszorg. In het schoolplan wordt aangegeven op welke wijze de identiteitscommissie, bedoeld
      in [artikel 22a][ref1], invulling geeft aan het openbare karakter onderscheidenlijk de identiteit voor zover het
      betreft een samenwerkingsschool. Het schoolplan omvat mede het beleid ten aanzien van de aanvaarding van materiële
      bijdragen of geldelijke bijdragen, niet zijnde ouderbijdragen of op de onderwijswetgeving gebaseerde bijdragen,
      indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee de leerlingen binnen de schooltijden en
      tijdens de activiteiten die worden georganiseerd onder verantwoordelijkheid van het bevoegd gezag, alsmede tijdens
      het overblijven, zullen worden geconfronteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel22a
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: 22a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '15.2'
    text: 'De beschrijving van het onderwijskundig beleid omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel15
  - number: 15.2.a
    text: |-
      de uitwerking van de wettelijke voorschriften betreffende de uitgangspunten, de doelstelling en de inhoud van het
      onderwijs,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel15
  - number: 15.2.b
    text: |-
      de door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs in een
      onderwijsprogramma,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel15
  - number: 15.2.c
    text: het pedagogisch-didactisch klimaat en het schoolklimaat,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel15
  - number: 15.2.d
    text: |-
      het zorg dragen voor de veiligheid op school, bedoeld in [artikel 6a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel6a
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: 6a
        hoofdstuk: I
  - number: '15.3'
    text: 'De beschrijving van het personeelsbeleid omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel15
  - number: 15.3.a
    text: het voldoen aan de eisen van bevoegdheid en de wijze waarop de bekwaamheid wordt onderhouden,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel15
  - number: 15.3.b
    text: |-
      de maatregelen met betrekking tot het personeel die bijdragen aan de ontwikkeling en de uitvoering van het
      onderwijskundig beleid, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel15
  - number: 15.3.c
    text: het pedagogisch-didactisch handelen van het onderwijspersoneel.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel15
  - number: '15.4'
    text: 'De beschrijving van het stelsel van kwaliteitszorg omvat in elk geval het zorg dragen voor:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel15
  - number: 15.4.a
    text: |-
      het bewaken dat een ononderbroken ontwikkelingsproces van leerlingen mogelijk wordt gemaakt en dat het onderwijs
      wordt afgestemd op de ontwikkeling van leerlingen, bedoeld in [artikel 10, eerste lid][ref1], mede met behulp van
      het leerling- en onderwijsvolgsysteem, bedoeld in artikel 10, vierde lid,


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel10
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 15.4.b
    text: het vaststellen welke maatregelen ter verbetering nodig zijn, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel15
  - number: 15.4.c
    text: |-
      het vorm geven aan de uitwerking van het eilandelijk zorgplan, bedoeld in [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel27
