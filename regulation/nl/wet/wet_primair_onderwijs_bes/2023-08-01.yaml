  - number: '155.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven over de vaststelling door het bevoegd
      gezag van een begroting en de inrichting daarvan.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel155
  - number: '155.2'
    text: Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel155
  - number: '156'
    text: |-
      Tot de datum van inwerkingtreding van [artikel 76, derde lid][ref1], is een aanvraag om een besluit als
      bedoeld in artikel 76, eerste of tweede lid, met redenen omkleed en gaat vergezeld van de gegevens, genoemd in
      [artikel 72, tweede lid][ref2]. Onze Minister willigt de aanvraag om een besluit als bedoeld in artikel 76, eerste
      lid, slechts in, ingeval:


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel72
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel156
    references:
