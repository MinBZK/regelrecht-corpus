  - number: '161'
    text: |-
      De artikelen die niet bij Besluit van 3 februari 2011, houdende vaststelling van het tijdstip van inwerkingtreding
      van een aantal onderdelen van de Aanpassingswet openbare lichamen Bonaire, Sint Eustatius en Saba (Stb. 2011, 34)
      in werking zijn getreden, treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan, verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel161
  - number: '162'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van artikel IV van de Wet van 4 juni 2015 tot wijziging
      van enige onderwijswetten in verband met het invoeren van de verplichting voor scholen om zorg te dragen voor de
      veiligheid op school (Stb. 238) aan de Staten-Generaal een verslag over de doeltreffendheid en effecten van de
      [artikelen 6a][ref1] en [16, eerste lid, onderdeel m][ref2], in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel16
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel162
