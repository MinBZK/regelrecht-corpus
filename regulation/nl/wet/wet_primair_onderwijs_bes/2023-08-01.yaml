    text: |-
      de wijze waarop het bevoegd gezag omgaat met de in [artikel 15, eerste lid][ref1], omschreven bijdragen,


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel15
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel16
    references:
