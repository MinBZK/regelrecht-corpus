  - number: '149.2'
    text: |-
      Onverminderd [artikel 3, eerste lid, onderdelen a en c][ref1], mogen in afwijking van artikel 3, eerste lid,
      onderdeel b, en [artikel 34, vijfde lid][ref2], degenen die geen getuigschrift als bedoeld in artikel 3, eerste
      lid, onderdeel b, onder 1°, maar wel voor het tijdstip van de inwerkingtreding van dit artikel een opleiding
      begonnen zijn die leidt tot een bewijs van bekwaamheid tot het geven van onderwijs in de tweede cyclus als
      bedoeld in de landsverordening funderend onderwijs gedurende een periode van vijf jaar na het tijdstip van de
      inwerkingtreding van dit artikel, met dit bewijs van bekwaamheid worden benoemd tot leraar.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel34
