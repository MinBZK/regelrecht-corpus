  - number: '16.1'
    text: |-
      De schoolgids bevat voor ouders en leerlingen informatie over de werkwijze van de school en bevat in elk geval
      informatie over:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel16
  - number: 16.1.a
    text: |-
      de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, met dien verstande dat
      bij algemene maatregel van bestuur voorschriften kunnen worden gegeven met betrekking tot de wijze waarop:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel16
  - number: 16.1.a.1°
    text: de resultaten worden beschreven die met het onderwijsleerproces worden bereikt, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel16
  - number: 16.1.a.2°
    text: de context wordt vermeld waarin de onder 1° bedoelde resultaten dienen te worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel16
  - number: 16.1.b
    text: de wijze waarop aan de zorg voor het jonge kind wordt vormgegeven,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel16
  - number: 16.1.c
    text: de wijze waarop aan de zorg voor leerlingen met specifieke onderwijsbehoeften wordt vormgegeven,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel16
  - number: 16.1.d
    text: de wijze waarop de verplichte onderwijstijd wordt benut,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel16
  - number: 16.1.e
    text: |-
      de geldelijke bijdrage, bedoeld in [artikel 44, eerste lid][ref1], waarbij wordt vermeld dat deze vrijwillig is en
      dat het niet voldoen van die bijdrage niet leidt tot het uitsluiten van leerlingen van deelname aan activiteiten,


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel44
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel16
    references:
      - id: ref1
