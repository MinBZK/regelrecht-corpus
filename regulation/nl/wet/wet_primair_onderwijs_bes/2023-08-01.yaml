  - number: 16.1.n
    text: |-
      de wijze waarop de identiteitscommissie, bedoeld in [artikel 22a][ref1], invulling geeft aan het openbare karakter
      onderscheidenlijk de identiteit voor zover het betreft een samenwerkingsschool.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel22a
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: 22a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 16a.1
    text: |-
      Het bevoegd gezag stelt ten minste eenmaal in de vier jaar het schoolplan vast en stelt dit zo spoedig mogelijk na
      de vaststelling beschikbaar voor de inspectie.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel16a
  - number: 16a.2
    text: |-
      Het bevoegd gezag stelt jaarlijks de schoolgids vast ten behoeve van het eerstvolgende schooljaar en stelt deze zo
      spoedig mogelijk na de vaststelling beschikbaar voor de ouders en de inspectie.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel16a
  - number: '17.1'
    text: |-
      Ouders en personeelsleden kunnen bij de klachtencommissie, bedoeld in het tweede lid, onderdeel a, een klacht
      indienen over gedragingen en beslissingen van het bevoegd gezag of het personeel, waaronder discriminatie, dan wel
      het nalaten van gedragingen en het niet nemen van beslissingen door het bevoegd gezag of het personeel.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: '17.2'
    text: 'Het bevoegd gezag treft een regeling voor de behandeling van klachten. Deze regeling vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: 17.2.a
    text: de instelling van een klachtencommissie, die klachten behandelt,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: 17.2.b
    text: de wijze waarop de klachtencommissie haar werkzaamheden verricht,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: 17.2.c
    text: de termijn waarbinnen de klager een klacht kan indienen en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: 17.2.d
    text: |-
      de termijn waarbinnen mededeling plaatsvindt van het oordeel, bedoeld in het zesde lid, en hoe bij noodzakelijke
      afwijking van deze termijn wordt gehandeld.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: '17.3'
    text: |-
      Deze regeling strekt ter vervanging van klachtenregelingen op grond van andere voorschriften dan dit artikel en
      strekt niet ter vervanging van een andere voorziening die op grond van een wettelijke regeling, niet zijnde een
      klachtenregeling, voor de klager openstaat of heeft opengestaan.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: '17.4'
    text: 'Deze regeling:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: 17.4.a
    text: |-
      voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit ten minste drie leden,
      waaronder een voorzitter die geen deel uitmaakt van het bevoegd gezag en niet werkzaam is voor of bij het bevoegd
      gezag en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: 17.4.b
    text: |-
      waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: '17.5'
    text: 'De klager en degene over wie is geklaagd dan wel de instantie waarover is geklaagd krijgen de gelegenheid:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: 17.5.a
    text: hun zienswijze mondeling of schriftelijk toe te lichten, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: 17.5.b
    text: zich bij de behandeling van de klacht te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: '17.6'
    text: |-
      De klachtencommissie vormt zich een oordeel over de gegrondheid van de klacht en deelt dit oordeel, al dan niet
      vergezeld van aanbevelingen, schriftelijk mede aan de klager, degene over wie is geklaagd dan wel de instantie
      waarover is geklaagd en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: '17.7'
    text: |-
      Het bevoegd gezag deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onderdeel a, binnen 4 weken
      na ontvangst van het in het zesde lid bedoelde oordeel van de klachtencommissie schriftelijk mede of hij het
      oordeel over de gegrondheid van de klacht deelt en of hij naar aanleiding van dat oordeel maatregelen zal nemen en
      zo ja welke. Bij afwijking van de in de eerste volzin bedoelde termijn, doet het bevoegd gezag daarvan met redenen
      omkleed mededeling aan de klager en de klachtencommissie onder vermelding van de termijn waarbinnen het bevoegd
      gezag zijn standpunt bekend zal maken.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: '17.8'
    text: |-
      Degene die betrokken is bij de uitvoering van dit artikel en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, is verplicht tot geheimhouding daarvan,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: '17.9'
    text: |-
      Gegevens die betrekking hebben op een klacht worden bewaard op een plaats die uitsluitend toegankelijk is voor de
      leden van de klachtencommissie en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel17
  - number: '18.1'
    text: Aan een school is een medezeggenschapsraad verbonden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel18
  - number: '18.2'
    text: De medezeggenschapsraad van een school bestaat uit ten minste 4 leden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel18
  - number: '18.3'
    text: De medezeggenschapsraad van een school bestaat uit
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel18
  - number: 18.3.a
    text: leden die uit en door het personeel worden gekozen, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel18
  - number: 18.3.b
    text: leden die uit en door de ouders worden gekozen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel18
  - number: '18.4'
    text: De aantallen leden, bedoeld in het derde lid, onderdeel a en onderdeel b, zijn aan elkaar gelijk.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel18
  - number: '18.5'
    text: |-
      Indien het bevoegd gezag personeel heeft benoemd of te werk gesteld zonder benoeming dat werkzaamheden verricht
      ten behoeve van meer dan een school, kan een medezeggenschapsraad worden ingesteld die bestaat uit leden die uit en
      door dat personeel worden gekozen. De medezeggenschapsraad bestaat in dat geval uit ten minste 2 leden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel18
  - number: '18.6'
    text: Geen lid van de medezeggenschapsraad kunnen zijn degenen die deel uitmaken van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel18
  - number: '18.7'
    text: |-
      Een personeelslid dat is opgedragen om namens het bevoegd gezag op te treden in besprekingen met de
      medezeggenschapsraad kan niet tevens lid zijn van de medezeggenschapsraad.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel18
  - number: '18.8'
    text: |-
      Kandidaten voor de verkiezing van het deel van de medezeggenschapsraad dat uit en door het personeel wordt gekozen,
      kunnen worden gesteld door personeelsleden en door organisaties van personeel. Kandidaten voor de verkiezing van
      het deel van de medezeggenschapsraad dat uit en door de ouders wordt gekozen, kunnen worden gesteld door ouders en
      door organisaties van ouders.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel18
  - number: '18.9'
    text: De verkiezing van de leden van de medezeggenschapsraad geschiedt bij geheime schriftelijke stemming.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel18
  - number: '18.10'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven over de periode waarin de verkiezing van de
      leden van de medezeggenschapsraad plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel18
  - number: '18.11'
    text: |-
      Het bevoegd gezag draagt er zorg voor, dat de leden van de medezeggenschapsraad niet uit hoofde van hun
      lidmaatschap van de raad worden benadeeld in hun positie met betrekking tot de school. De eerste volzin is van
      overeenkomstige toepassing ten aanzien van kandidaatleden en voormalige leden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel18
  - number: '18.12'
    text: |-
      De beëindiging anders dan op eigen verzoek van de betrekking van een lid van het personeel mag geen verband houden
      met de kandidaatstelling voor het lidmaatschap, het lidmaatschap of het voormalig lidmaatschap van de betrokkene
      van de medezeggenschapsraad. Een beëindiging van de betrekking in strijd met dit lid is nietig.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel18
  - number: '18.13'
    text: |-
      De medezeggenschapsraad kiest uit hun midden een voorzitter en een of meer plaatsvervangende voorzitters. De
      voorzitter, of bij diens verhindering een plaatsvervangende voorzitter, vertegenwoordigt de raad in rechte.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel18
  - number: '19.1'
    text: |-
      Het bevoegd gezag stelt de medezeggenschapsraad, bedoeld in [artikel 18][ref1], ten minste twee maal per jaar in de
      gelegenheid de algemene gang van zaken in de school met hem te bespreken.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel18
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '19.2'
    text: |-
      Het bevoegd gezag en de medezeggenschapsraad komen bijeen indien daarom onder opgave van redenen door het bevoegd
      gezag, de vertegenwoordigers van ouders of de vertegenwoordigers van personeel wordt verzocht. De besprekingen
      kunnen namens het bevoegd gezag worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel19
  - number: '20.1'
    text: |-
      Indien een leerling gedurende een deel van de week onderwijs ontvangt op een andere school of wordt begeleid bij
      het expertisecentrum onderwijszorg, telt de tijd gedurende welke de leerling dit onderwijs ontvangt mee voor het
      aantal uren onderwijs dat de leerling ten minste moet ontvangen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel20
  - number: '20.2'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld omtrent vakanties. Daarbij kunnen begin en eind
      van vakanties worden vastgesteld die niet voor alle scholen gelijk behoeven te zijn.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel20
  - number: 21a.1
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent fusies.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel21a
  - number: 21a.2
    text: |-
      Onder fusie wordt verstaan: een fusie waarbij een of meer rechtspersonen de instandhouding van een school
      overdragen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel21a
  - number: 21a.3
    text: |-
      Voor de toepassing van dit artikel wordt onder school mede verstaan: een school als bedoeld in de
      [Wet op het voortgezet onderwijs BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0030284
  - number: 21a.4
    text: 'De voorschriften, bedoeld in het eerste lid, kunnen inhouden:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel21a
  - number: 21a.4.a
    text: dat toestemming vooraf is vereist;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel21a
  - number: 21a.4.b
    text: dat bij die regeling vast te stellen criteria in acht worden genomen;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel21a
  - number: 21a.4.c
    text: dat bij die regeling voorgeschreven procedures in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel21a
  - number: '22.1'
    text: |-
      De instandhouding van een of meer openbare en een of meer bijzondere scholen kan worden opgedragen of overgedragen
      aan een stichting die met dit doel wordt onderscheidenlijk is opgericht. De besluitvorming van de zijde van het
      openbaar lichaam vindt plaats door de eilandsraad.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: '22.2'
    text: |-
      Het statutaire doel van de stichting is in elk geval het geven van openbaar onderwijs en bijzonder onderwijs in
      afzonderlijke scholen voor openbaar onderscheidenlijk bijzonder onderwijs.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: '22.3'
    text: De stichting oefent alle taken en bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: '22.4'
    text: |-
      Het personeel dat werkzaam is aan de openbare school en niet zonder benoeming is tewerkgesteld, wordt benoemd
      krachtens een arbeidsovereenkomst naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: '22.5'
    text: 'De statuten voorzien in ieder geval in een regeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: 22.5.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: 22.5.b
    text: de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: 22.5.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: 22.5.d
    text: |-
      de vaststelling van de begroting en jaarrekening na overleg met de eilandsraad van het openbaar lichaam waarin de
      openbare school is gelegen,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: 22.5.e
    text: |-
      de wijze waarop de eilandsraad van het openbaar lichaam waarin de openbare school is gelegen, toezicht op het
      bestuur van de openbare school uitoefent,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: 22.5.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: 22.5.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: 22.5.h
    text: |-
      de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd voor zover het openbaar onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: '22.6'
    text: |-
      De statuten van de stichting kunnen slechts worden gewijzigd na goedkeuring van de eilandsraad van het openbaar
      lichaam waarin de openbare school is gelegen. Goedkeuring kan slechts worden onthouden indien overheersende invloed
      van de overheid in het bestuur niet is verzekerd voor zover het openbaar onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: '22.7'
    text: |-
      Het bestuur brengt jaarlijks aan de eilandsraad van het openbaar lichaam waarin de openbare school is gelegen,
      verslag uit over de werkzaamheden, waarbij in ieder geval aandacht wordt geschonken aan de wezenskenmerken van het
      openbaar onderwijs. Het verslag wordt bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: '22.8'
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: '22.9'
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover het
      openbaar onderwijs betreft, neemt de eilandsraad van het openbaar lichaam waarin de openbare school is gelegen,
      de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het openbaar
      onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
  - number: '22.10'
    text: |-
      Indien de laatste afzonderlijke openbare school en de laatste afzonderlijke bijzondere school die door de stichting
      in stand worden gehouden, zijn gefuseerd tot een samenwerkingsschool als bedoeld in [artikel 22a][ref1] kan de
      instandhouding van die samenwerkingsschool opgedragen blijven aan de stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel22a
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: 22a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 22a.1
    text: |-
      Een samenwerkingsschool is een school waarin zowel openbaar onderwijs als bijzonder onderwijs wordt aangeboden.
      Een samenwerkingsschool kan uitsluitend tot stand komen door samenvoeging van één of meer openbare scholen
      met één of meer bijzondere scholen en wordt in stand gehouden door een stichting, een stichting als bedoeld in
      [artikel 22][ref1] of een stichting als bedoeld in [artikel 54][ref2] waarvan het statutaire doel in ieder geval
      is het in stand houden van een samenwerkingsschool. De [artikelen 55][ref3] en [61][ref4] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0030280#Artikel61
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '22'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '54'
        hoofdstuk: I
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0030280
        artikel: '55'
        hoofdstuk: I
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0030280
        artikel: '61'
        hoofdstuk: I
        afdeling: '3'
  - number: 22a.2
    text: 'Een samenwerkingsschool kan uitsluitend tot stand komen indien:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22a
  - number: 22a.2.a
    text: |-
      met die totstandkoming van de samenwerkingsschool de continuïteit van het openbaar of bijzonder onderwijs
      gehandhaafd kan blijven; en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22a
  - number: 22a.2.b
    text: de betrokken scholen ten minste zes schooljaren zijn bekostigd.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22a
  - number: 22a.3
    text: |-
      Van een situatie als bedoeld in het tweede lid, onderdeel a, is sprake indien één van de betrokken scholen op
      1 oktober van het eerste of tweede schooljaar voorafgaand aan de fusiedatum werd bezocht door ten hoogste 83
      leerlingen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22a
  - number: 22a.4
    text: Samenwerkingsscholen zijn toegankelijk voor alle kinderen zonder onderscheid van godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22a
  - number: 22a.5
    text: Aan een samenwerkingsschool is een identiteitscommissie verbonden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22a
  - number: 22a.6
    text: |-
      De identiteitscommissie adviseert gevraagd en ongevraagd het bevoegd gezag en de directeur over alle
      aangelegenheden die betrekking hebben op de wijze waarop invulling wordt gegeven aan het openbare karakter en de
      identiteit van de samenwerkingsschool. De identiteitscommissie kan tevens voorstellen doen over de aangelegenheden,
      bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22a
  - number: 22a.7
    text: |-
      De statuten van de stichting die de samenwerkingsschool in stand houdt, voorzien in een regeling over de
      identiteitscommissie waarin in ieder geval de samenstelling, benoeming, herbenoeming, ontslag, duur van de
      benoeming, werkwijze, inrichting en bevoegdheden van de identiteitscommissie zijn vastgelegd alsmede een
      voorziening voor het beslechten van geschillen tussen het bevoegd gezag en de identiteitscommissie. Bij de
      samenstelling van de identiteitscommissie is sprake van een evenwichtige verdeling tussen openbaar en bijzonder
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22a
  - number: 22a.8
    text: |-
      Wijziging van de statuten van de stichting die de samenwerkingsschool in stand houdt voor zover die betrekking
      hebben op de regeling over de identiteitscommissie, is slechts mogelijk indien het bevoegd gezag en de
      identiteitscommissie daartoe gezamenlijk besluiten. Indien het een stichting betreft anders dan een stichting
      als bedoeld in [artikel 22][ref1] en anders dan bedoeld in [artikel 54][ref2], kan een wijziging als bedoeld
      in de eerste volzin uitsluitend tot stand komen met goedkeuring van de eilandsraad van het openbaar lichaam
      waarin de samenwerkingsschool gelegen is. Goedkeuring kan slechts worden onthouden indien overheersende invloed
      van de overheid in de identiteitscommissie niet is verzekerd voor zover het openbaar onderwijs binnen de
      samenwerkingsschool betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel54
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '22'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '54'
        hoofdstuk: I
        afdeling: '2'
  - number: 22a.9
    text: |-
      De stichting anders dan een stichting als bedoeld in [artikel 22][ref1] en anders dan bedoeld in [artikel 54][ref2]
      brengt jaarlijks aan de eilandsraad van het openbaar lichaam waarin de samenwerkingsschool gelegen is, verslag
      uit over de werkzaamheden waarbij in ieder geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar
      onderwijs. Het verslag wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel54
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '22'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '54'
        hoofdstuk: I
        afdeling: '2'
  - number: 22a.10
    text: |-
      De voorschriften van deze wet en van andere wetten die het primair onderwijs betreffen, alsmede de daarop
      gebaseerde regelingen, voor zover die voorschriften en regelingen betrekking hebben op een bijzondere school,
      zijn van overeenkomstige toepassing op een samenwerkingsschool als bedoeld in het eerste lid, tenzij het tegendeel
      blijkt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22a
  - number: 22a.11
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover het
      openbaar onderwijs betreft, neemt de eilandsraad van het openbaar lichaam waar de samenwerkingsschool gelegen
      is, de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het
      openbaar onderwijs betreft. De feitelijke samenwerking wordt beëindigd op 1 augustus van het jaar na een daartoe
      door de eilandsraad van het openbaar lichaam waar de samenwerkingsschool gelegen is, en het bevoegd gezag van de
      samenwerkingsschool gezamenlijk genomen besluit.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel22a
  - number: '23.1'
    text: |-
      Het bevoegd gezag draagt mede in verband met de verplichting, bedoeld in [artikel 13][ref1], zorg voor een goed
      bestuurde school met een scheiding tussen de functies van bestuur en het toezicht daarop, en met een rechtmatig
      bestuur en beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel13
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '23.2'
    text: |-
      De benoeming in de functies van het bestuur en het toezicht op het bestuur, bedoeld in het eerste lid, geschiedt op
      basis van vooraf openbaar gemaakte profielen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel23
  - number: '24.1'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de functies van bestuur en intern toezicht op het bestuur in functionele
      of organieke zin zijn gescheiden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel24
  - number: '24.2'
    text: |-
      Een intern toezichthouder of een lid van het interne toezichthoudend orgaan functioneert onafhankelijk van het
      bestuur.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel24
  - number: '25.1'
    text: |-
      De interne toezichthouder of het interne toezichthoudend orgaan houdt toezicht op de uitvoering van de taken en de
      uitoefening van de bevoegdheden door het bestuur en staat het bestuur met raad terzijde. De toezichthouder of het
      toezichthoudend orgaan is ten minste belast met:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel25
  - number: 25.1.a
    text: |-
      het goedkeuren van de begroting en het jaarverslag en, indien van toepassing, het strategisch meerjarenplan van
      de school;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel25
  - number: 25.1.b
    text: |-
      het toezien op de naleving door het bestuur van wettelijke verplichtingen, de code voor goed bestuur, bedoeld in
      [artikel 125, eerste lid, onderdeel a][ref1], en de afwijkingen van die code;


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel125
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '125'
        hoofdstuk: I
        afdeling: '8'
  - number: 25.1.c
    text: |-
      het toezien op de rechtmatige verwerving en de doelmatige en rechtmatige bestemming en aanwending van de middelen
      van de school verkregen op grond van deze wet;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel25
  - number: 25.1.d
    text: |-
      het aanwijzen van een deskundige als bedoeld in
      [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref1] die verslag uitbrengt aan de
      toezichthouder of het toezichthoudend orgaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: 25.1.e
    text: |-
      het jaarlijks afleggen van verantwoording over de uitvoering van de taken en de uitoefening van de bevoegdheden,
      bedoeld onder a tot en met d, in het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel25
  - number: '25.2'
    text: |-
      De taken en bevoegdheden van de interne toezichthouder of het interne toezichthoudend orgaan zijn zodanig dat hij
      een deugdelijk en onafhankelijk intern toezicht kan uitoefenen. Indien sprake is van meer dan een toezichthouder of
      van een toezichthoudend orgaan is de eerste volzin van overeenkomstige toepassing met betrekking tot de combinatie
      van de toezichthouders of de samenstelling van het toezichthoudend orgaan.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel25
  - number: '25.3'
    text: |-
      De interne toezichthouder of het interne toezichthoudend orgaan pleegt ten minste tweemaal per jaar overleg met de
      medezeggenschapsraad van de school.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel25
  - number: '25.4'
    text: |-
      Indien het intern toezicht wordt uitgeoefend door een raad van toezicht, zijn het eerste tot en met derde
      lid van overeenkomstige toepassing ten aanzien van de raad van toezicht. Een raad van toezicht is tevens
      belast met het benoemen, schorsen en ontslaan van de leden van het bestuur, alsmede de toepassing van
      de [artikelen 31, vijfde lid][ref1], [37][ref2], [39][ref3], [40][ref4] en [64][ref5] van deze wet, de
      [Ambtenarenwet BES][ref6] en de daarmee verband houdende wettelijke bepalingen op leden van het bestuur die mede
      tot het personeel behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0030280#Artikel40
      [ref5]: https://wetten.overheid.nl/BWBR0030280#Artikel64
      [ref6]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '31'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '37'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0030280
        artikel: '39'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0030280
        artikel: '40'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0030280
        artikel: '64'
        hoofdstuk: I
        afdeling: '3'
      - id: ref6
        bwb_id: BWBR0028215
  - number: '26.1'
    text: |-
      Het bevoegd gezag is voor elk van zijn scholen aangesloten bij een samenwerkingsverband met, voor zover aanwezig in
      het openbaar lichaam:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel26
  - number: 26.1.a
    text: een of meer scholen,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel26
  - number: 26.1.b
    text: een of meer scholen voor voortgezet onderwijs,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel26
  - number: 26.1.c
    text: |-
      een of meer instellingen als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: 26.1.d
    text: |-
      de uitvoeringsinstantie, bedoeld in [artikel 5, tweede lid, van de Wet sociale kanstrajecten jongeren BES][ref1],
      en


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel5
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028506
        artikel: '5'
  - number: 26.1.e
    text: een expertisecentrum onderwijszorg.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel26
  - number: '26.2'
    text: |-
      In afwijking van het eerste lid kan een samenwerkingsverband bestaan uit de betrokkenen, bedoeld in de bedoeld in
      de onderdelen a, b, c of d die gezamenlijk een expertisecentrum onderwijszorg in stand houden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel26
  - number: '26.3'
    text: |-
      Het samenwerkingsverband stelt zich ten doel een samenhangend geheel van zorgvoorzieningen binnen en tussen scholen
      en in samenwerking met de betrokkenen, bedoeld in het eerste lid, onderdelen b tot en met e, te realiseren en wel
      zodanig dat zoveel mogelijk leerlingen, deelnemers, vavo-studenten en studenten een ononderbroken onderwijsloopbaan
      kunnen doormaken.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel26
  - number: '26.4'
    text: Per openbaar lichaam is er één samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel26
  - number: '26.5'
    text: |-
      Indien een bevoegd gezag wenst deel te nemen aan het samenwerkingsverband, wordt deze deelname door de bevoegde
      gezagsorganen van het samenwerkingsverband niet geweigerd.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel26
  - number: '26.6'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de wijze waarop een geschil tussen de organisaties, bedoeld in
      het eerste lid, over aangelegenheden die het samenwerkingsverband aangaan, wordt beslecht.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel26
  - number: '27.1'
    text: |-
      Het bevoegd gezag stelt samen met de bevoegde gezagsorganen die samenwerken in een samenwerkingsverband en met het
      expertisecentrum onderwijszorg indien [artikel 26, eerste lid][ref1], van toepassing is, jaarlijks voor 1 mei een
      gezamenlijk eilandelijk zorgplan vast voor het daaropvolgende schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel26
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '26'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '27.2'
    text: 'Het eilandelijk zorgplan bevat in elk geval een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel27
  - number: 27.2.a
    text: |-
      de wijze waarop wordt voldaan aan [artikel 26, eerste en derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel26
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '26'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: 27.2.b
    text: |-
      de wijze, waarop de bekostiging voor de zorgvoorzieningen, bedoeld in [artikel 68][ref1], wordt ingezet,


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel68
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '68'
        hoofdstuk: I
        afdeling: '1'
  - number: 27.2.c
    text: |-
      de wijze waarop de subsidie voor de taken, bedoeld in [artikel 28, eerste lid][ref1], en voor zover van toepassing
      het zevende lid van dat artikel, wordt ingezet,


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel28
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '28'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: 27.2.d
    text: |-
      de beoogde en bereikte kwalitatieve en kwantitatieve resultaten ten aanzien van de onderwijskundige opvang van de
      leerlingen, deelnemers, vavo-studenten en studenten met een specifieke onderwijsbehoefte,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel27
  - number: 27.2.e
    text: de procedures voor de handelingsgerichte diagnose van leerlingen, deelnemers, vavo-studenten en studenten, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel27
  - number: 27.2.f
    text: de wijze waarop aan de ouders informatie wordt verstrekt over de zorgvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel27
  - number: '27.3'
    text: |-
      Het eilandelijk zorgplan wordt voor 15 mei voorafgaand aan het schooljaar waarop het betrekking heeft, toegezonden
      aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel27
  - number: '28.1'
    text: |-
      Onze Minister kan op verzoek een rechtspersoon aanwijzen die naar zijn oordeel in staat is deskundige ondersteuning
      te bieden aan leerlingen met een specifieke onderwijsbehoefte waarin binnen de school redelijkerwijs niet kan
      worden voorzien en waaronder in elk geval de volgende taken worden verstaan:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel28
  - number: 28.1.a
    text: |-
      het verzorgen van onderwijsondersteunende activiteiten aan leerlingen met een lichamelijke, verstandelijke,
      zintuiglijke, geestelijke of meervoudige handicap of stoornis,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel28
  - number: 28.1.b
    text: |-
      het verzorgen van ambulante begeleiding ten behoeve van leerlingen met een lichamelijke, verstandelijke,
      zintuiglijke, geestelijke of meervoudige handicap of stoornis,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel28
  - number: 28.1.c
    text: |-
      het verrichten van handelingsgerichte diagnostiek ten behoeve van de leerlingen op verzoek van het bevoegd gezag,
      het samenwerkingsverband of de ouders, of
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel28
  - number: 28.1.d
    text: |-
      het op verzoek van een bevoegd gezag, het samenwerkingsverband of de ouders van leerlingen adviseren en collegiaal
      consulteren.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel28
  - number: '28.2'
    text: |-
      De rechtspersoon, bedoeld in het eerste lid, wordt voor de toepassing van deze wet aangeduid als expertisecentrum
      onderwijszorg.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel28
  - number: '28.3'
    text: |-
      Een leerling die binnen een locatie van het expertisecentrum onderwijszorg wordt begeleid, blijft ingeschreven bij
      de school. Het bevoegd gezag van deze school blijft verantwoordelijk voor de leerling tijdens het verblijf binnen
      het expertisecentrum onderwijszorg. Onder deze verantwoordelijkheid valt in elk geval de zorg voor het geven van
      adequaat onderwijs door een leraar die daartoe bevoegd is op grond van [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel3
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '3'
        hoofdstuk: I
  - number: '28.4'
    text: |-
      Met inachtneming van [artikel 99, derde lid][ref1] vergoedt het bevoegd gezag voor het begeleiden van zijn
      leerling, bedoeld in het derde lid, naar redelijkheid en indien dit naar het oordeel van het samenwerkingsverband,
      bedoeld in [artikel 26][ref2], nodig is, de kosten die worden gemaakt door:


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel26
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '99'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '26'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: 28.4.a
    text: het expertisecentrum onderwijszorg, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel28
  - number: 28.4.b
    text: |-
      een ander bevoegd gezag van een school of instelling als bedoeld in
      [artikel 26, eerste lid, onderdelen a tot en met c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel26
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '26'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '28.5'
    text: Per openbaar lichaam is er één expertisecentrum onderwijszorg.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel28
  - number: '28.6'
    text: |-
      Het expertisecentrum onderwijszorg treft een regeling voor de behandeling van klachten over gedragingen en
      beslissingen van het bestuur van dit centrum of het personeel, waaronder discriminatie, dan wel het nalaten van
      gedragingen en het niet nemen van beslissingen door het bestuur of het personeel voor zover het betreft zijn
      onderscheidenlijk hun werkzaamheden in het kader van het onderwijsproces of de deskundige ondersteuning, bedoeld in
      het eerste lid. [Artikel 17][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel17
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '17'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '28.7'
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven over de taken van het expertisecentrum onderwijszorg.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel28
  - number: '29.1'
    text: |-
      Met het toezicht op de uitvoering van de taken, bedoeld in [artikel 28, eerste lid][ref1], en voor zover van
      toepassing het zevende lid van dat artikel, zijn belast de bij besluit van Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel28
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '28'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '29.2'
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '29.3'
    text: |-
      Onze Minister is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] ten aanzien van de in het eerste lid bedoelde
      ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '30.1'
    text: |-
      Onze Minister is bevoegd tot het treffen van noodzakelijke voorzieningen indien het expertisecentrum onderwijszorg
      naar het oordeel van Onze Minister zijn taken ernstig verwaarloost.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel30
  - number: '30.2'
    text: |-
      De voorzieningen, bedoeld in het eerste lid, worden niet eerder getroffen dan nadat het expertisecentrum
      onderwijszorg in de gelegenheid is gesteld om binnen een door Onze Minister te stellen redelijke termijn alsnog
      zijn taken naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel30
  - number: '31.1'
    text: |-
      Aan elke school zijn 1 of 2 directeuren verbonden, bij wie onder verantwoordelijkheid van het bevoegd gezag de
      onderwijskundige, organisatorische en huishoudelijke leiding berust. De functie van directeur kan minder dan een
      volledige formatieplaats omvatten. De directeur van een school kan tevens met de leiding worden belast van een
      andere school waar de functie van directeur vacant is. De directeur van een school kan tevens directeur zijn van
      een andere school.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel31
  - number: '31.2'
    text: Aan een school zijn een of meer leraren verbonden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel31
  - number: '31.3'
    text: |-
      Een of meer leraren kunnen tevens tot adjunct-directeur worden benoemd dan wel tewerkgesteld zonder benoeming.
      Indien geen adjunct-directeur wordt benoemd dan wel tewerkgesteld zonder benoeming en aan de school slechts 1
      directeur is verbonden, wijst het bevoegd gezag een leraar aan als plaatsvervanger van de directeur.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel31
  - number: '31.4'
    text: |-
      Voor zover het betreft de functie van directeur en adjunct-directeur, wordt in geval van samenvoeging van scholen
      de overblijvende school gelijkgesteld met een nieuwe school. De directeur, onderscheidenlijk de adjunct-directeur
      of adjunct-directeuren, kan slechts een van de directeuren onderscheidenlijk kunnen slechts een of meer van de
      adjunct-directeuren van de samen te voegen scholen zijn, tenzij geen van de betrokkenen de desbetreffende functie
      wenst te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel31
  - number: '31.5'
    text: |-
      Het bevoegd gezag kan tevens personeel, dat werkzaamheden verricht ten behoeve van meer dan een school, benoemen
      of tewerkstellen zonder benoeming waaronder begrepen leden van het bestuur van die scholen voor zover het intern
      toezicht wordt uitgeoefend door een raad van toezicht als bedoeld in [artikel 25, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel25
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '25'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '31.6'
    text: Aan een school kan onderwijsondersteunend personeel zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel31
  - number: '31.7'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welke rechtspositionele gevolgen zijn verbonden aan functies
      die zowel onderwijsgevende als onderwijsondersteunende taken omvatten.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel31
  - number: '31.8'
    text: |-
      Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van de verschillende categorieën
      personeel van de school. Indien toepassing is gegeven aan het vijfde lid, stelt het bevoegd gezag tevens jaarlijks
      het beleid vast met betrekking tot de formatie van dat personeel. Zoveel mogelijk tegelijk met de vaststelling
      van het in de eerste en tweede volzin bedoelde beleid met betrekking tot de formatie, bepaalt het bevoegd gezag
      functies en taken van het personeel van de school, met inachtneming van de daaromtrent bij algemene maatregel van
      bestuur te geven nadere voorschriften, en in voorkomend geval functies en taken van het in het vijfde lid bedoelde
      personeel.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel31
  - number: '32.1'
    text: |-
      Het bestuur kan hem bij wettelijk voorschrift opgedragen taken en bevoegdheden overdragen aan de directeur van de
      school of indien toepassing is gegeven aan [artikel 31, vijfde lid][ref1], het in dat artikellid bedoelde personeel
      voor zover dat is belast met managementtaken met betrekking tot de scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel31
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '31'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '32.2'
    text: |-
      De directeur van de school of indien toepassing is gegeven aan [artikel 31, vijfde lid][ref1], het in dat
      artikellid bedoelde personeel voor zover dat is belast met managementtaken met betrekking tot de scholen, kan hem
      bij wettelijk voorschrift opgedragen, of door het bevoegd gezag overgedragen, taken en bevoegdheden overdragen aan
      elkaar of aan de adjunct-directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel31
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '31'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '33.1'
    text: |-
      Het bevoegd gezag stelt na overleg met de directeur en indien toepassing is gegeven aan
      [artikel 31, vijfde lid][ref1], met het in dat artikellid bedoelde personeel voor zover dat is belast met
      managementtaken met betrekking tot de scholen, een managementstatuut vast. In het managementstatuut is ten minste
      een regeling opgenomen betreffende de bevoegdheden van de directeur en indien toepassing is gegeven aan artikel
      31, vijfde lid, tevens van de bevoegdheden van het in dat artikellid bedoelde personeel voor zover dat is belast
      met managementtaken met betrekking tot de scholen en met betrekking tot de toedeling, bestemming en aanwending van
      de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel31
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '31'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '33.2'
    text: |-
      Het managementstatuut bevat tevens de aanduiding van de andere aan het bevoegd gezag bij wettelijk voorschrift
      toegekende taken en bevoegdheden waarvan het bevoegd gezag heeft bepaald dat de directeur van de school of indien
      toepassing is gegeven aan [artikel 31, vijfde lid][ref1], het in dat artikellid bedoelde personeel voor zover dat
      is belast met managementtaken met betrekking tot de scholen, deze in naam van het bevoegd gezag kan uitoefenen. Het
      managementstatuut bevat voorts instructies ten aanzien van deze taken en bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel31
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '31'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '33.3'
    text: 'In het managementstatuut worden tevens vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel33
  - number: 33.3.a
    text: |-
      de taken en bevoegdheden die het bestuur overdraagt aan de directeur van de school of indien toepassing is
      gegeven aan [artikel 31, vijfde lid][ref1], het in dat artikellid bedoelde personeel voor zover dat is belast met
      managementtaken met betrekking tot de scholen, indien toepassing is gegeven aan [artikel 32, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel32
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '31'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '32'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 33.3.b
    text: |-
      de taken en bevoegdheden die het bestuur, de directeur van de school of indien toepassing is gegeven aan
      [artikel 31, vijfde lid][ref1], het in dat artikellid bedoelde personeel voor zover dat is belast met
      managementtaken met betrekking tot de scholen overdraagt aan de adjunct-directeur, indien toepassing is gegeven aan
      [artikel 32, tweede lid][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel32
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '31'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '32'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 33.3.c
    text: de richtlijnen voor de uitoefening van de overgedragen taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel33
  - number: '33.4'
    text: |-
      Het bevoegd gezag stelt het managementstatuut, alsmede elke wijziging daarvan, zo spoedig mogelijk na de
      vaststelling op een voor eenieder toegankelijke wijze beschikbaar.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel33
  - number: '34.1'
    text: |-
      Directeuren, adjunct-directeuren en leraren worden door het bevoegd gezag benoemd dan wel tewerkgesteld zonder
      benoeming.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
  - number: '34.2'
    text: 'Tot directeur of adjunct-directeur kan slechts worden benoemd of tewerkgesteld zonder benoeming degene die:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
  - number: 34.2.a
    text: 'in het bezit is van:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
  - number: 34.2.a.1°
    text: |-
      een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref1], die op het tijdstip van
      overlegging aan het bevoegd gezag niet ouder is dan 6 maanden,


      [ref1]: https://wetten.overheid.nl/BWBR0028258
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028258
  - number: 34.2.a.2°
    text: |-
      een getuigschrift, afgegeven krachtens de Wet op het hoger onderwijs en
      wetenschappelijk onderzoek, of van een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 34.2.b
    text: |-
      voor zover tot de functie werkzaamheden behoren waarvoor op grond van [artikel 35, tweede lid][ref1],
      bekwaamheidseisen zijn vastgesteld, in het bezit is van:


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel35
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '35'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 34.2.b.1°
    text: |-
      een getuigschrift, afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] waaruit
      blijkt dat aan die eisen is voldaan, of


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 34.2.b.2°
    text: |-
      een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1], verleend ten aanzien van de in
      [artikel 35, tweede lid][ref2], bedoelde werkzaamheden die betrokkene zal verrichten, of


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel35
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '35'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 34.2.b.3°
    text: |-
      een bewijsstuk dat hij volgens bij algemene maatregel van bestuur te geven regels zijn bekwaamheid heeft
      aangetoond, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
  - number: 34.2.c
    text: |-
      niet krachtens rechterlijke uitspraak is uitgesloten van het verrichten van de werkzaamheden waarop de benoeming of
      de tewerkstelling zonder benoeming is gericht.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
  - number: '34.3'
    text: |-
      De directeur of adjunct-directeur die niet voldoet aan de eisen van het tweede lid, onder b, mag voor zover het
      werkzaamheden betreft waarvoor op grond van [artikel 35, tweede lid][ref1], bekwaamheidseisen zijn vastgesteld,
      niettemin met die werkzaamheden worden belast, voor een periode van ten hoogste twee jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel35
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '35'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '34.4'
    text: |-
      De directeur of adjunct-directeur die op grond van [artikel 3][ref1] bevoegd is tot het geven van onderwijs of
      die op grond van [artikel 4][ref2] bevoegd is tot het verrichten van de daar bedoelde onderwijsondersteunende
      werkzaamheden, kan tevens worden belast met het geven van onderwijs respectievelijk met het verrichten van die
      onderwijsondersteunende werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel4
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '4'
        hoofdstuk: I
  - number: '34.5'
    text: |-
      Om te kunnen worden benoemd of tewerkgesteld zonder benoeming tot leraar dient betrokkene te voldoen aan
      [artikel 3, eerste lid][ref1], of op grond van het derde lid van dat artikel bevoegd te zijn tot het geven van
      onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel3
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '3'
        hoofdstuk: I
  - number: '34.6'
    text: |-
      De onderwijsondersteunend functionaris die wordt belast met werkzaamheden waarvoor op grond
      van [artikel 35, derde lid][ref1], bekwaamheidseisen zijn vastgesteld, dient te voldoen aan
      [artikel 4, eerste lid][ref2], onverminderd het tweede en derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel4
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '35'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '4'
        hoofdstuk: I
  - number: '34.7'
    text: |-
      De onderwijsondersteunend functionaris die wordt belast met andere werkzaamheden dan die waarvoor op grond van
      [artikel 35, derde lid][ref1], bekwaamheidseisen zijn vastgesteld, dient:


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel35
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '35'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 34.7.a
    text: |-
      in het bezit te zijn van de verklaring, bedoeld in [artikel 3, eerste lid, onder a][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel3
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '3'
        hoofdstuk: I
  - number: 34.7.b
    text: te voldoen aan de overige vereisten voor de te vervullen functie.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
  - number: '34.8'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de vereisten, bedoeld in het zevende
      lid, onder b.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
  - number: '34.9'
    text: |-
      Indien betrokkene in het bezit is van een geschiktheidsverklaring als bedoeld in [artikel 137][ref1] vindt
      de benoeming of tewerkstelling zonder benoeming plaats voor een periode van ten hoogste twee aaneengesloten
      schooljaren. Het bevoegd gezag kan deze benoemingsperiode, al dan niet onder door dat gezag te stellen voorwaarden,
      verlengen met ten hoogste twee jaren indien het bevoegd gezag daarvoor redenen aanwezig acht. Het bevoegd gezag
      beschikt over geordende gegevens met betrekking tot de toepassing van de tweede volzin. Het bevoegd gezag dat
      betrokkene voor de eerste maal na afgifte van de geschiktheidsverklaring benoemt of tewerkstelt zonder benoeming,
      tekent het feit en de datum van benoeming of tewerkstelling zonder benoeming aan op die verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel137
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '137'
        hoofdstuk: I
        afdeling: '9'
  - number: '35.1'
    text: Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor leraren.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel35
  - number: '35.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen bekwaamheidseisen worden vastgesteld voor werkzaamheden van
      leidinggevende aard die nauw verband houden met het pedagogisch-didactische klimaat op de school of
      die onderwijskundige leiding omvatten, en kunnen ook voor andere werkzaamheden van leidinggevende aard
      bekwaamheidseisen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel35
  - number: '35.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen bekwaamheidseisen worden vastgesteld voor bij die maatregel aan te wijzen
      onderwijsondersteunende werkzaamheden die rechtstreeks verband houden met het onderwijsleerproces.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel35
  - number: '35.4'
    text: |-
      De in het eerste lid bedoelde bekwaamheidseisen zijn gericht op het handelen in het onderwijsleerproces, het
      algemeen professioneel handelen en het werken binnen een onderwijsorganisatie. Zij omvatten in elk geval eisen ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel35
  - number: 35.4.a
    text: pedagogisch-didactische kennis, inzicht en vaardigheden, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel35
  - number: 35.4.b
    text: vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel35
  - number: '35.5'
    text: |-
      Onze Minister stelt een beroepsorganisatie die hij vanuit het oogpunt van beroepskwaliteit representatief acht
      voor onderwijspersoneel als bedoeld in deze wet, in de gelegenheid hem een voorstel te doen voor de in het eerste,
      tweede of derde lid voorgeschreven bekwaamheidseisen en kan een representatief geachte beroepsorganisatie in de
      gelegenheid stellen hem een voorstel te doen voor bekwaamheidseisen die op grond van het tweede lid kunnen worden
      vastgesteld. Onze Minister stelt deze organisatie vervolgens in elk geval eenmaal in de zes jaar in de gelegenheid,
      hem een voorstel te doen over ongewijzigde handhaving of wijziging van de bekwaamheidseisen voor zover vastgesteld.
      Uit een voorstel als bedoeld in de eerste of tweede volzin blijkt tevens, in hoeverre dat voorstel mede steun
      geniet van een vertegenwoordiging van bevoegde gezagsorganen en ouders van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel35
  - number: '36'
    text: |-
      Het bevoegd gezag beschikt ten aanzien van elk personeelslid dat een functie of werkzaamheden verricht waarvoor
      bekwaamheidseisen zijn vastgesteld, over geordende gegevens met betrekking tot de bekwaamheid en het onderhouden
      van de bekwaamheid. Ten behoeve van de onderlinge vergelijkbaarheid en herkenbaarheid van de gegevens kunnen bij
      ministeriële regeling voorschriften worden vastgesteld over de inrichting en wijze van ordening van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel36
  - number: '37.1'
    text: |-
      De [Ambtenarenwet BES][ref1] en de daarop berustende regelingen zijn voor het personeel van een school voor
      bijzonder onderwijs van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028215
  - number: '37.2'
    text: Voor de salarissen en toelagen van het personeel wordt een regeling vastgesteld bij eilandsbesluit.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel37
  - number: '37.3'
    text: |-
      Het bestuurscollege stelt de regeling, bedoeld in het tweede lid, dan wel een wijziging daarvan niet vast dan nadat
      daarover op overeenstemming gericht overleg is gevoerd met de bevoegde gezagsorganen en met de onderwijsvakbonden
      of, bij het ontbreken daarvan, met een representatief te achten vertegenwoordiging van het personeel.
      [Artikel 101 van de Ambtenarenwet BES][ref1] is niet van toepassing op de vaststelling dan wel wijziging van de
      regeling, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel101
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '101'
  - number: '38'
    text: |-
      [ Artikel 3, eerste lid, onderdeel b, van het Rechtspositiebesluit ambtenaren BES][ref1] is niet van toepassing op
      het personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel3
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '3'
  - number: '39'
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat het personeel. Van een benoeming in vaste dienst en in tijdelijke
      dienst voor langer dan een half jaar, alsmede van een ontslag uit een zodanige betrekking, doet het bevoegd gezag
      terstond mededeling aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel39
  - number: '40.1'
    text: |-
      Het bevoegd gezag benoemt de directeur en de adjunct-directeur, de leraren en het onderwijsondersteunend personeel
      in algemene dienst van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel40
  - number: '40.2'
    text: |-
      Onder benoeming in algemene dienst van het bevoegd gezag wordt verstaan een benoeming ten behoeve van het
      verrichten van werkzaamheden aan door het bevoegd gezag in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel40
  - number: '41.1'
    text: |-
      Het bevoegd gezag is verplicht aan studenten die in opleiding zijn voor een functie in het basisonderwijs of in
      het voortgezet onderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste ervaring in de school
      te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel41
  - number: '41.2'
    text: 'De verplichting, bedoeld in het eerste lid, betreft:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel41
  - number: 41.2.a
    text: |-
      studenten die op een school voor de opleiding van onderwijzend personeel zijn ingeschreven of anderszins studeren
      om aan de bekwaamheidseisen te voldoen;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel41
  - number: 41.2.b
    text: |-
      in een schooljaar gelijktijdig niet meer studenten als bedoeld onder a, dan de helft van het aantal groepsleraren
      in dat jaar.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel41
  - number: '41.3'
    text: |-
      Een bevoegd gezag kan een student de verdere toegang tot de school ontzeggen indien deze in de school in strijd
      handelt met de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot
      de school wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van de
      betrokken opleidingsinstelling.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel41
  - number: '41.4'
    text: |-
      De directeur regelt, onder verantwoordelijkheid van het bevoegd gezag, de werkzaamheden in verband met de
      begeleiding door het onderwijzend personeel van de studenten in de school in overeenstemming met dit personeel,
      alsmede in overeenstemming met de betrokken opleidingsinstellingen, dan wel, indien het betreft studenten die zich
      voorbereiden op het afleggen van een staatsexamen om te voldoen aan de bekwaamheidseisen, in overeenstemming met de
      betrokken staatsexamencommissie.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel41
  - number: '41.5'
    text: |-
      Onze Minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor een schooljaar.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel41
  - number: '41.6'
    text: |-
      De scholen waarop studenten als bedoeld in het eerste lid zijn toegelaten, zijn toegankelijk voor de inspectie
      belast met het toezicht op de opleidingsinstellingen, voor de directeuren en de door deze aan te wijzen leraren
      van die opleidingsinstellingen, alsmede voor de leden van de betrokken staatsexamencommissies, een en ander voor
      zover zulks voor de uitoefening van het toezicht op de praktische vorming, onderscheidenlijk de begeleiding van de
      praktische vorming van de in de school aanwezige studenten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel41
  - number: '43.1'
    text: Om als leerling tot een school te worden toegelaten, moet een kind de leeftijd van 4 jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel43
  - number: '43.2'
    text: |-
      Het bevoegd gezag kan voor kinderen die nog niet eerder tot een school zijn toegelaten, toelatingstijdstippen
      vaststellen op ten minste eenmaal per maand.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel43
  - number: '43.3'
    text: |-
      In de periode vanaf de leeftijd van 3 jaar en 10 maanden tot het bereiken van de leeftijd van 4 jaar kan het
      bevoegd gezag kinderen gedurende ten hoogste 5 dagen toelaten. Deze kinderen zijn geen leerlingen in de zin van
      de wet.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel43
  - number: '43.4'
    text: |-
      Leerlingen bij wie naar het oordeel van de directeur van de school de grondslag voor het volgen van aansluitend
      voortgezet onderwijs in voldoende mate is gelegd, verlaten aan het einde van het schooljaar de school, mits
      hierover met de ouders overeenstemming bestaat. In elk geval verlaten de leerlingen de school aan het einde van het
      schooljaar waarin zij de leeftijd van 14 jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel43
  - number: '44.1'
    text: |-
      De beslissing over toelating, schorsing en verwijdering van leerlingen berust bij het bevoegd gezag. De toelating
      tot de school is niet afhankelijk van het houden van rechtmatig verblijf in de zin van de [artikelen 3][ref1],
      [5a][ref2] of [6 van de Wet toelating en uitzetting BES][ref3]. De toelating mag niet afhankelijk worden gesteld
      van een geldelijke bijdrage van de ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0028571#Artikel6
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028571
        artikel: 5a
      - id: ref3
        bwb_id: BWBR0028571
        artikel: '6'
  - number: '44.2'
    text: |-
      Overeenkomsten waarbij ouders worden verplicht tot het betalen van een geldelijke bijdrage zijn nietig, behoudens
      voor zover zij na de toelating van de leerling tot de school schriftelijk zijn aangegaan en in het desbetreffende
      schriftelijke stuk aan de ouders kenbaar is gemaakt dat het een vrijwillige bijdrage betreft waarvoor de
      overeenkomst niet behoeft te worden aangegaan, doch waarvoor geldt dat na de ondertekening wel een verplichting
      tot betaling van de overeengekomen bijdrage bestaat. Zodanige overeenkomsten zijn evenzeer nietig, indien deze niet
      hebben voorzien in de vermelding dat de ouders de mogelijkheid hebben er voor te kiezen om de overeenkomst slechts
      voor bepaalde voorzieningen aan te gaan en ten behoeve daarvan niet een specificatie voor de te onderscheiden
      voorzieningen in de overeenkomst is opgenomen. Zodanige overeenkomsten zijn voorts nietig indien ten aanzien
      daarvan geen reductie- en kwijtscheldingsregeling geldt en de inhoud van die regeling niet in de overeenkomst is
      opgenomen. Een overeenkomst wordt telkens voor de periode van een schooljaar aangegaan.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel44
  - number: '44.3'
    text: |-
      Toelating van leerlingen tot een school voor bijzonder onderwijs wordt slechts geweigerd op grond van godsdienstige
      of levensbeschouwelijke redenen of aantoonbaar plaatsgebrek.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel44
  - number: '44.4'
    text: |-
      Voordat wordt besloten tot schorsing van drie dagen of meer of definitieve verwijdering, hoort het bevoegd gezag
      de betrokken ouders. Definitieve verwijdering van een leerling vindt niet plaats dan nadat het bevoegd gezag ervoor
      heeft zorg gedragen dat een andere school bereid is de leerling toe te laten.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel44
  - number: '44.5'
    text: |-
      Indien de beslissing, bedoeld in het eerste lid, is genomen door het bevoegd gezag van een openbare
      school en tegen die beslissing bezwaar is gemaakt, besluit het bevoegd gezag, in afwijking van
      [artikel 69, eerste lid, van de Wet administratieve rechtspraak BES][ref1], binnen vier weken na ontvangst van
      het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel69
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '69'
  - number: '46.1'
    text: |-
      Onverminderd bij algemene maatregel van bestuur gegeven voorschriften met betrekking tot de in- en uitschrijving
      van leerlingen, vindt toelating van een leerling als bedoeld in [artikel 44][ref1] slechts plaats nadat de ouders
      de gegevens betreffende de geslachtsnaam, de voorletters, de geboortedatum, het geslacht en het persoonsgebonden
      nummer BES van de leerling hebben overgelegd. Indien de ouders aannemelijk maken dat zij geen persoonsgebonden
      nummer BES van de leerling kunnen overleggen, vindt de toelating plaats met inachtneming van het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel44
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '44'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: '46.2'
    text: |-
      De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt document
      dan wel een door een andere school verstrekt bewijs van uitschrijving, waarin de desbetreffende gegevens zijn
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel46
  - number: '46.3'
    text: |-
      Indien de ouders aannemelijk maken dat zij geen persoonsgebonden nummer BES van de leerling kunnen overleggen,
      meldt het bevoegd gezag binnen twee weken na het besluit tot toelating aan Onze Minister de beschikbare gegevens
      van de leerling, bedoeld in het eerste lid, alsmede zijn adres en woonplaats
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel46
  - number: '46.5'
    text: |-
      Het bevoegd gezag neemt de in het eerste lid bedoelde gegevens op in de leerlingenadministratie van de school. Bij
      ministeriële regeling kan worden bepaald welke andere gegevens in de leerlingenadministratie worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel46
  - number: '47.1'
    text: |-
      De leerlingen nemen deel aan alle voor hen bestemde onderwijsactiviteiten, met dien verstande dat die
      onderwijsactiviteiten voor de leerlingen onderling kunnen verschillen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel47
  - number: '47.2'
    text: |-
      Het bevoegd gezag kan op verzoek van de ouders een leerling vrijstellen van het deelnemen aan bepaalde
      onderwijsactiviteiten. Een vrijstelling kan slechts worden verleend op door het bevoegd gezag vastgestelde gronden.
      Het bevoegd gezag bepaalt bij de vrijstelling welke onderwijsactiviteiten voor de leerling in de plaats komen van
      die waarvan vrijstelling is verleend.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel47
  - number: 47a.1
    text: |-
      De deelname van leerlingen aan activiteiten die geen onderdeel uitmaken van het verplichte onderwijsprogramma
      en worden georganiseerd onder verantwoordelijkheid van het bevoegd gezag, wordt niet afhankelijk gesteld van een
      bijdrage als bedoeld in [artikel 44, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel44
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '44'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: 47a.2
    text: 'Aan het eerste lid wordt in ieder geval voldaan voor de daar bedoelde activiteiten, indien:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel47a
  - number: 47a.2.a
    text: |-
      deze activiteiten buiten de kerndoelen, bedoeld in [artikel 11, vierde lid][ref1], langdurig aan leerlingen worden
      aangeboden door een school die door dat bevoegd gezag in stand gehouden wordt,


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel11
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '11'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 47a.2.b
    text: die school is aangesloten bij een verband van scholen die dergelijke activiteiten organiseren, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel47a
  - number: 47a.2.c
    text: |-
      krachtens een door dat verband vastgestelde code een regeling is getroffen voor de leerlingen ten aanzien van wie
      niet of niet geheel de gevraagde ouderbijdrage wordt betaald.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel47a
  - number: 47a.3
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gesteld aan de scholen, bedoeld in het tweede lid,
      onderdeel b, en aan de code, bedoeld in het tweede lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel47a
  - number: '48'
    text: |-
      Over iedere leerling die de school verlaat, stelt de directeur, na overleg met het onderwijzend personeel, ten
      behoeve van de ontvangende school of school voor voortgezet onderwijs een onderwijskundig rapport op. Afschrift
      van dit rapport wordt aan de ouders van de leerling verstrekt. Bij algemene maatregel van bestuur worden nadere
      voorschriften omtrent dit rapport gegeven.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel48
  - number: '50.1'
    text: |-
      Het bevoegd gezag draagt zorg voor een voorziening voor leerlingen om de middagpauze onder toezicht door te
      brengen, indien ouders hierom verzoeken. Ingeval de voorziening, bedoeld in de eerste volzin, tot stand komt,
      draagt het bevoegd gezag er zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel50
  - number: 50.1.a
    text: er een overblijfaanpak tot stand komt,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel50
  - number: 50.1.b
    text: |-
      overleg over de overblijfaanpak tot stand komt met degenen die met het toezicht op de leerlingen worden belast, en
      met de ouders,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel50
  - number: 50.1.c
    text: het overblijven plaats vindt in een veilige en kindvriendelijke ruimte, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel50
  - number: 50.1.d
    text: |-
      ten minste de helft van degenen die met het toezicht op de leerlingen worden belast, een scholing heeft gevolgd op
      het gebied van het overblijven.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel50
  - number: '50.2'
    text: |-
      De kosten die hieruit voortvloeien komen voor rekening van de ouders. Indien de leerlingen van de voorziening,
      bedoeld in de eerste volzin, gebruik maken, draagt het bevoegd gezag er zorg voor dat degene, die met het toezicht
      op de leerlingen wordt belast, voor wettelijke aansprakelijkheid verzekerd is. Het bevoegd gezag van een bijzondere
      school is, telkenmale voor de duur van een schooljaar, ontheven van de verplichting tot verzekering indien:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel50
  - number: 50.2.a
    text: |-
      deze verplichting zich naar zijn oordeel niet verdraagt met de godsdienstige of levensbeschouwelijke overtuiging
      die aan de school ten grondslag ligt; en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel50
  - number: 50.2.b
    text: het bevoegd gezag van zijn oordeel mededeling heeft gedaan aan de ouders.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel50
  - number: '50.3'
    text: |-
      Het bevoegd gezag van een school draagt op daarvoor met ouders afgesproken dagen, zorg voor de organisatie van
      opvang van leerlingen, op doordeweekse niet-schooldagen, niet zijnde algemeen erkende feestdagen en op schooldagen
      gedurende de voor- en naschoolse periode, tussen bij ministeriële regeling te bepalen tijdstippen, indien een of
      meer ouders hierom verzoeken. De kosten die uit de opvang als bedoeld in de eerste volzin voortvloeien, komen voor
      rekening van de ouders.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel50
  - number: '52.1'
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de leerlingen met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse en Caribische samenleving en met
      onderkenning van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel52
  - number: '52.2'
    text: Openbare scholen zijn toegankelijk voor alle kinderen zonder onderscheid van godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel52
  - number: '52.3'
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel52
  - number: '53.1'
    text: |-
      Een eilandsraad kan bij verordening een openbare rechtspersoon instellen die tot doel heeft een of meer openbare
      scholen in het openbaar lichaam in stand te houden, al dan niet tezamen met openbare scholen voor voortgezet
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: '53.2'
    text: De eilandsraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: '53.3'
    text: |-
      De openbare rechtspersoon oefent alle taken en bevoegdheden uit van het bevoegd gezag. Hij bezit
      rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: '53.4'
    text: |-
      De verordening, bedoeld in het eerste lid, voorziet in ieder geval in een regeling waarin een overheersende invloed
      van de overheid in het bestuur is verzekerd, en waarin voorts wordt geregeld:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: 53.4.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: 53.4.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de eilandsraad en dat ten minste een derde gedeelte, doch geen meerderheid,
      van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn ingeschreven op de
      betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: 53.4.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: 53.4.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de eilandsraad en de vaststelling van de jaarrekening na
      instemming van de eilandsraad,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: 53.4.e
    text: de wijze waarop de eilandsraad toezicht op het bestuur uitoefent,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: 53.4.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: 53.4.g
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: '53.5'
    text: |-
      De goedkeuring, bedoeld in het vierde lid, onderdeel d, kan worden onthouden wegens strijd met het recht of met het
      algemeen belang, waaronder begrepen het financiële belang van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: '53.6'
    text: |-
      Het bestuur brengt jaarlijks aan de eilandsraad verslag uit over de werkzaamheden, waarbij in ieder geval aandacht
      wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: '53.7'
    text: |-
      De vergaderingen van het bestuur van de openbare rechtspersoon zijn openbaar, tenzij het bestuur anders beslist, op
      gronden, vermeld in de verordening.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: '53.8'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      eilandsraad de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: '53.9'
    text: |-
      De eilandsraad is in geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet
      bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de openbare rechtspersoon te ontbinden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: '53.10'
    text: |-
      Indien de school een raad van toezicht heeft, is het vierde lid niet van toepassing en voorziet de verordening,
      bedoeld in het eerste lid, onverminderd [artikel 25][ref1], in ieder geval in een regeling waarin een overheersende
      invloed van de overheid in de raad van toezicht is verzekerd, en waarin voorts wordt geregeld:


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel25
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '25'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 53.10.a
    text: de samenstelling, werkwijze en inrichting van de raad van toezicht van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: 53.10.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien
      verstande dat de leden van de raad van toezicht worden benoemd door de eilandsraad en dat ten minste een derde
      gedeelte, doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen
      die zijn ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: 53.10.c
    text: de termijn waarvoor de leden van de raad van toezicht worden benoemd,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: 53.10.d
    text: de vaststelling van de begroting en de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: 53.10.e
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt. Het vijfde, zesde en achtste lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel53
  - number: '54.1'
    text: |-
      Een eilandsraad kan besluiten dat een of meer openbare scholen in het openbaar lichaam in stand worden gehouden
      door een stichting die zich ten doel stelt het in stand houden van een of meer openbare scholen, al dan niet
      tezamen met openbare scholen voor voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: '54.2'
    text: De eilandsraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: '54.3'
    text: |-
      Een stichting die een openbare school in stand houdt, wordt opgericht door een openbaar lichaam, al dan niet
      tezamen met een of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: '54.4'
    text: |-
      Onverminderd [artikel 22a, eerste lid][ref1], is het statutaire doel van de stichting uitsluitend het geven van
      openbaar onderwijs overeenkomstig [artikel 46][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel46
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: 22a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '46'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: '54.5'
    text: De stichting oefent alle taken en bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: '54.6'
    text: |-
      Onverminderd het vierde lid voorzien de statuten in ieder geval in een regeling waarin een overheersende invloed
      van de overheid in het bestuur is verzekerd:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: 54.6.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: 54.6.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de eilandsraad en dat ten minste een derde gedeelte, doch geen meerderheid,
      van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn ingeschreven op de
      betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: 54.6.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: 54.6.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de eilandsraad en de vaststelling van de jaarrekening na
      instemming van de eilandsraad,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: 54.6.e
    text: de wijze waarop de eilandsraad toezicht op het bestuur uitoefent,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: 54.6.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: 54.6.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: 54.6.h
    text: de bevoegdheid de stichting te ontbinden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: '54.7'
    text: |-
      De goedkeuring, bedoeld in het zesde lid, onderdeel d, kan worden onthouden wegens strijd met het recht of met het
      algemeen belang, waaronder begrepen het financiële belang van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: '54.8'
    text: De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de eilandsraad.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: '54.9'
    text: |-
      Het bestuur brengt jaarlijks aan de eilandsraad verslag uit over de werkzaamheden, waarbij in ieder geval aandacht
      wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: '54.10'
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: '54.11'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      eilandsraad de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: '54.12'
    text: |-
      De eilandsraad is in geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet
      bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de stichting te ontbinden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: '54.13'
    text: |-
      Indien de school een raad van toezicht heeft, is het zesde lid niet van toepassing en voorzien de statuten,
      onverminderd [artikel 25][ref1], in ieder geval in een regeling waarin een overheersende invloed van de overheid in
      de raad van toezicht is verzekerd:


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel25
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '25'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 54.13.a
    text: de samenstelling, werkwijze en inrichting van de raad van toezicht van de stichting,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: 54.13.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien
      verstande dat de leden van de raad van toezicht worden benoemd door de eilandsraad en dat ten minste een derde
      gedeelte, doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen
      die zijn ingeschreven op de betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: 54.13.c
    text: de termijn waarvoor de leden van de raad van toezicht worden benoemd,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: 54.13.d
    text: de vaststelling van de begroting en de jaarrekening,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: 54.13.e
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: 54.13.f
    text: de bevoegdheid de stichting te ontbinden. Het achtste, negende en elfde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel54
  - number: '55.1'
    text: |-
      De rechtspersoon die een openbare school in stand houdt, kan de instandhouding van die school overdragen aan
      een andere rechtspersoon die tot instandhouding van een openbare school bevoegd is. De overdracht geschiedt bij
      notariële akte.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel55
  - number: '55.2'
    text: |-
      Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering als bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel89
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '89'
  - number: '55.3'
    text: |-
      In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en
      onder dezelfde voorwaarden als vermeld in de schriftelijke aanstelling, aan de school aanstelt met ingang van de
      datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel55
  - number: '55.4'
    text: |-
      Door overdracht met inachtneming van de voorgaande leden treedt de verkrijgende rechtspersoon in alle uit de wet
      voortvloeiende rechten en verplichtingen die zijn rechtsvoorganger bezit in zijn hoedanigheid van bevoegd gezag,
      onverminderd hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel55
  - number: '56'
    text: |-
      Het bevoegd gezag stelt de leerlingen in de gelegenheid op de school, binnen de schooltijden, godsdienstonderwijs
      of levensbeschouwelijk vormingsonderwijs te ontvangen. Van de tijd daaraan te besteden worden ten
      hoogste 120 uren per schooljaar meegeteld voor het aantal uren onderwijs dat de leerlingen krachtens
      [artikel 10, zesde lid, aanhef en onder b][ref1], ten minste moeten ontvangen. Voor de leerlingen die dit onderwijs
      niet volgen, voorziet het bevoegd gezag in andere onderwijsactiviteiten op de school.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel10
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '57.1'
    text: |-
      Godsdienstonderwijs wordt gegeven door leraren daartoe aangewezen door kerkelijke gemeenten, plaatselijke kerken,
      of rechtspersonen met volledige rechtsbevoegdheid die zich blijkens hun statuten het geven van godsdienstonderwijs
      ten doel stellen. Levensbeschouwelijk vormingsonderwijs wordt gegeven door leraren daartoe aangewezen door
      volledige rechtsbevoegdheid bezittende organisaties op geestelijke grondslag.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel57
  - number: '57.2'
    text: |-
      Het bevoegd gezag ziet erop toe dat dit onderwijs uitsluitend wordt gegeven door een leraar die blijkens een
      daartoe strekkende verklaring van de aanwijzende instantie:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel57
  - number: 57.2.a
    text: |-
      voldoet aan de bekwaamheidseisen die krachtens [artikel 35, eerste lid][ref1], voor het geven van dat onderwijs
      zijn vastgesteld, en


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel35
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '35'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 57.2.b
    text: zijn bekwaamheid onderhoudt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel57
  - number: '58'
    text: |-
      De Rijksvertegenwoordiger is, in afwijking van [artikel 39][ref1], bevoegd de disciplinaire straf of de schorsing
      op te leggen dan wel het ontslag te verlenen, indien het een directeur, een adjunct-directeur, of een ander lid
      van het onderwijzend personeel van een openbare school betreft en deze tevens lid is van de eilandsraad van het
      openbaar lichaam die de school in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel39
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '39'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '59.1'
    text: |-
      De aanstelling of tewerkstelling zonder aanstelling van de mede-directeur, de adjunct-directeur of leraren
      geschiedt, de directeur gehoord.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel59
  - number: '59.2'
    text: |-
      De aanstelling en de overplaatsing van directeuren en adjunct-directeuren geschiedt door het bevoegd gezag, het
      personeel gehoord.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel59
  - number: '60'
    text: |-
      Een bijzondere school wordt in stand gehouden door een rechtspersoon met volledige rechtsbevoegdheid die zich
      blijkens de statuten of reglementen het geven van onderwijs ten doel stelt zonder daarbij het maken van winst te
      beogen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel60
  - number: '61.1'
    text: |-
      De rechtspersoon die de school in stand houdt, kan de instandhouding van de school overdragen aan een andere
      rechtspersoon die voldoet aan [artikel 60][ref1]. De overdracht geschiedt bij notariële akte.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel60
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '60'
        hoofdstuk: I
        afdeling: '3'
  - number: '61.2'
    text: |-
      Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel89
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '89'
  - number: '61.3'
    text: |-
      In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en
      onder dezelfde voorwaarden als vermeld in de akte van benoeming, benoemt met ingang van de datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel61
  - number: '61.4'
    text: |-
      Door overdracht met inachtneming van de voorgaande leden, treedt de verkrijgende rechtspersoon in alle uit de
      wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de school, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel61
  - number: '61.5'
    text: |-
      Bij een splitsing als bedoeld in [artikel 335 van Boek 2 van het Burgerlijk Wetboek BES][ref1] van een
      rechtspersoon die een school in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende
      rechtspersoon de school in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de school
      overgaat. In het laatste geval zijn het tweede tot en met vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel335
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '335'
  - number: '62'
    text: |-
      Onverminderd de [artikelen 11][ref1] en [12][ref2] kunnen de onderwijsactiviteiten godsdienstonderwijs
      of levensbeschouwelijk vormingsonderwijs omvatten. Van de tijd daaraan te besteden worden ten
      hoogste 120 uren per schooljaar meegeteld voor het aantal uren onderwijs dat de leerlingen krachtens
      [artikel 10, zesde lid, aanhef en onder b][ref3], ten minste moeten ontvangen. Het geven van godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs kan worden opgedragen aan een niet aan de school verbonden leraar.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel10
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '11'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0030280
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '63.1'
    text: |-
      Indien binnen redelijke afstand van de woning van de leerling geen gelegenheid bestaat tot het volgen van
      openbaar onderwijs, mag de toelating tot de school niet worden geweigerd op grond van godsdienstige gezindheid
      of levensbeschouwing. Het voorgaande is niet van toepassing indien de school uitsluitend is bestemd voor interne
      leerlingen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel63
  - number: '63.2'
    text: |-
      Leerlingen die ingevolge het eerste lid zijn toegelaten, kunnen niet worden verplicht godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs te volgen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel63
  - number: '64.1'
    text: Ieder personeelslid is in het bezit van een door het bevoegd gezag en hemzelf getekende akte van benoeming.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel64
  - number: '64.2'
    text: |-
      De akte van benoeming bevat ten minste bepalingen van gelijke inhoud als de bepalingen die zijn vastgesteld in
      [artikel 8 van het Rechtspositiebesluit ambtenaren BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel8
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '8'
  - number: '65.1'
    text: |-
      Indien het bevoegd gezag van een bijzondere school op grond van [artikel 41, derde lid][ref1], een student de
      toegang weigert, deelt het deze beslissing, schriftelijk en met redenen omkleed, mede door toezending of uitreiking
      aan de student, onverminderd het bepaalde in dat artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel41
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '41'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '65.2'
    text: |-
      Indien het bevoegd gezag van een bijzondere school op grond van [artikel 44][ref1] weigert een leerling toe te
      laten dan wel een leerling verwijdert, deelt het de beslissing daartoe, schriftelijk en met redenen omkleed, mede
      door toezending of uitreiking aan de ouders. Daarbij wordt tevens de inhoud van het bepaalde in het derde lid,
      eerste volzin, vermeld. Het bevoegd gezag neemt de beslissing, bedoeld in de eerste volzin, zo spoedig mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel44
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '44'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: '65.3'
    text: |-
      Binnen 6 weken na de mededeling, bedoeld in het tweede lid, kunnen de ouders bij het bevoegd gezag schriftelijk hun
      bezwaren kenbaar maken tegen de beslissing. Het bevoegd gezag beslist binnen 4 weken na ontvangst van de bezwaren.
      Alvorens te beslissen hoort het bevoegd gezag de ouders.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel65
  - number: '66.1'
    text: |-
      Het Rijk bekostigt openbare en de bijzondere scholen met in achtneming van deze titel, met uitzondering van
      [afdeling 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0030280
        hoofdstuk: I
        afdeling: '3'
  - number: '66.2'
    text: |-
      Geen bekostiging vindt plaats indien leerlingen van verschillende scholen al dan niet van hetzelfde bevoegd gezag
      gezamenlijk onderwijs ontvangen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel66
  - number: '66.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld ter uitvoering van het eerste lid.
      Deze algemene maatregel van bestuur bevat in ieder geval een regeling van de termijnen waarbinnen besluiten moeten
      worden genomen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel66
  - number: '67.1'
    text: |-
      Onze Minister kan aanvullende middelen ter beschikking stellen die niet strekken tot bekostiging van het onderwijs,
      bedoeld in deze wet, wet, of de schoolbegeleiding ten behoeve daarvan, maar direct of indirect nodig zijn voor de
      uitvoering van het onderwijs of voor de bevordering van deelname aan het onderwijs.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel67
  - number: '67.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel67
  - number: '67.3'
    text: |-
      De [titels 4.1][ref1] en [4.2 van de Algemene wet bestuursrecht][ref2] en de [artikelen 4][ref3],[5][ref4],
      [9][ref5] en [10 van de Wet overige OCW- subsidies][ref6] zijn op dit artikel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0009458#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0009458#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0009458#Artikel10
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0009458
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0009458
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0009458
        artikel: '9'
      - id: ref6
        bwb_id: BWBR0009458
        artikel: '10'
  - number: '68.1'
    text: |-
      Het Rijk bekostigt openbare en bijzondere scholen voor zorg voor leerlingen met een specifieke onderwijsbehoefte.
      Deze bekostiging is verwerkt in de bedragen, bedoeld in [artikel 100][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel100
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '100'
        hoofdstuk: I
        afdeling: '4'
  - number: '68.2'
    text: |-
      Onze Minister kan aan een of meer scholen extra bekostiging verstrekken voor de zorg voor leerlingen met een
      specifieke onderwijsbehoefte.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel68
  - number: '68.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ter uitvoering van het eerste
      en tweede lid.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel68
  - number: '69.1'
    text: Onze Minister verstrekt het expertisecentrum onderwijszorg subsidie.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel69
  - number: '69.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gegeven over het verstrekken van subsidie aan het expertisecentrum
      onderwijszorg voor de taken, bedoeld in [artikel 28, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel28
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '28'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '1'
  - number: '69.3'
    text: |-
      De [titels 4.1][ref1] en [4.2 van de Algemene wet bestuursrecht][ref2] en de
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref3] zijn van toepassing op de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '70.1'
    text: |-
      In afwijking van [artikel 7, eerste lid, van de Wet administratieve rechtspraak BES][ref1] kan een belanghebbende
      beroep instellen bij het Gemeenschappelijke Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint
      Eustatius en Saba tegen:


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel7
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '7'
  - number: 70.1.a
    text: |-
      een besluit of een van rechtswege verleende goedkeuring als bedoeld in de [afdelingen 2][ref1] en [8][ref2] van
      deze titel,


      [ref1]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0030280
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0030280
        hoofdstuk: I
        afdeling: '8'
  - number: 70.1.b
    text: |-
      een besluit als bedoeld in [artikel 104, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel104
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '104'
        hoofdstuk: I
        afdeling: '4'
  - number: 70.1.c
    text: |-
      een besluit als bedoeld in [artikel 103][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel103
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '103'
        hoofdstuk: I
        afdeling: '4'
  - number: '70.2'
    text: |-
      De [artikelen 54][ref1] en [55 Wet administratieve rechtspraak BES][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel55
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '54'
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '55'
  - number: '71.1'
    text: |-
      Voor de toepassing van deze titel zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      [artikel 54][ref1] of een openbare rechtspersoon als bedoeld in [artikel 53][ref2], tenzij het tegendeel blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel53
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '54'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '53'
        hoofdstuk: I
        afdeling: '2'
  - number: '71.2'
    text: |-
      Indien een openbare school in stand wordt gehouden door een stichting of een openbare rechtspersoon, wordt
      deze aangemerkt als een door het openbaar lichaam in stand gehouden openbare school voor de toepassing van
      [afdeling 2][ref1] en [afdeling 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0030280
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0030280
        hoofdstuk: I
        afdeling: '8'
  - number: '72.1'
    text: Onze Minister kan een school voor bekostiging in aanmerking brengen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: '72.2'
    text: |-
      De bekostiging van een openbare en een bijzondere school kan slechts een aanvang nemen indien het bevoegd gezag een
      aanvraag daartoe heeft ingediend bij Onze Minister. Deze aanvraag vermeldt of het openbaar of bijzonder onderwijs
      betreft, en de beoogde plaats van vestiging van de school.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: '72.3'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: 72.3.a
    text: |-
      een belangstellingsmeting als bedoeld in [artikel 72a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72a
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: 72a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 72.3.b
    text: |-
      het voorgenomen beleid over de kwaliteit van het onderwijs dat binnen de school zal worden gevoerd, voor zover dit
      betreft de uitwerking van de wettelijke voorschriften voor:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: 72.3.b.1
    text: |-
      de inhoud van het onderwijs, bedoeld in [artikel 10, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel10
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 72.3.b.2
    text: |-
      de inrichting van het onderwijs, bedoeld in [artikel 10, eerste lid][ref1] en een leerlingvolgsysteem als bedoeld
      in artikel 10, vierde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel10
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 72.3.b.3
    text: |-
      de inrichting van het onderwijs, bedoeld in [artikel 10, zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel10
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 72.3.b.4
    text: |-
      de inhoud van het onderwijs, die dekkend zal zijn voor de kerndoelen, bedoeld in [artikel 11][ref1] of [12][ref2];
      en


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel12
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '11'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 72.3.b.5
    text: |-
      de scheiding tussen de functies van bestuur en het toezicht daarop, bedoeld in [artikel 23][ref1] en [24][ref2] en,
      indien toepassing wordt gegeven aan [artikel 32][ref3], een beschrijving van de over te dragen taken;


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel32
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '23'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '24'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0030280
        artikel: '32'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 72.3.c
    text: |-
      een document waaruit blijkt dat het openbaar lichaam van het eiland van vestiging van de school en de bevoegde
      gezagsorganen van de scholen en vestigingen binnen het voedingsgebied van de school zijn gevraagd om te overleggen
      over het voornemen tot het doen van een aanvraag om bekostiging; en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: 72.3.d
    text: |-
      een verklaring omtrent het gedrag afgegeven volgens de
      [Wet justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref1] van de personen die het bestuur
      en het intern toezicht vormen en die op het tijdstip van het doen van de aanvraag niet ouder is dan zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0028258
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0028258
  - number: '72.4'
    text: 'De aanvraag bevat tevens:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: 72.4.a
    text: een beschrijving van het beleid met betrekking tot de bewaking en verbetering van de kwaliteit van het onderwijs;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: 72.4.b
    text: een beschrijving van de beoogde samenstelling van de formatie van de school;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: 72.4.c
    text: |-
      een beschrijving van de wijze waarop invulling wordt gegeven aan de voorschriften die worden gesteld aan de
      bekwaamheid van leraren, en degenen die onderwijsondersteunende werkzaamheden verrichten en werkzaamheden verricht
      van leidinggevende aard;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: 72.4.d
    text: |-
      een beschrijving van de wijze waarop invulling wordt gegeven aan de zorg voor de sociale, psychische en fysieke
      veiligheid van leerlingen op school;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: 72.4.e
    text: |-
      een meerjarenbegroting over de eerste drie schooljaren die is gebaseerd op de bekostiging die de school zal
      ontvangen gegeven het aantal te verwachten leerlingen in die periode;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: 72.4.f
    text: de verwachtingen met betrekking tot de huisvesting;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: 72.4.g
    text: |-
      informatie over de hoogte van en het beleid ten aanzien van de vrijwillige geldelijke bijdrage die van de ouders
      zal worden gevraagd en het jaarlijks verwachte totaalbedrag van die bijdragen; en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: 72.4.h
    text: een beschrijving van de wijze waarop uitvoering wordt gegeven aan de medezeggenschap in de school.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: '72.5'
    text: |-
      Een school wordt slechts voor bekostiging in aanmerking gebracht indien op grond van de belangstellingsmeting
      aannemelijk is dat zij binnen 8 jaar vanaf de datum van ingang van de bekostiging zal worden bezocht door ten
      minste 200 leerlingen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: '72.6'
    text: |-
      De [artikelen 73 tot en met 75][ref1] zijn niet van toepassing bij omzetting van een bekostigde bijzondere school
      in een bekostigde openbare school of omgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel73
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '73'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '72.7'
    text: De bekostiging kan slechts aanvangen per 1 augustus van een schooljaar.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: '72.8'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de elementen, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: '72.9'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld aan de wijze waarop de aanvraag plaatsvindt en kan
      een model voor de aanvraag worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72
  - number: 72a.1
    text: |-
      De belangstellingsmeting, bedoeld in [artikel 72, tweede lid, onderdeel a][ref1], wordt uitgevoerd aan de hand van
      hetzij ouderverklaringen dan wel, in bij ministeriële regeling te bepalen gevallen, een marktonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 72a.2
    text: 'De belangstellingsmeting:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
  - number: 72a.2.a
    text: |-
      geeft inzicht in het te verwachten aantal kinderen op 1 januari van het elfde jaar na de indiening van de aanvraag;
      en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
  - number: 72a.2.b
    text: vindt plaats binnen het voedingsgebied dat het eiland omvat van de beoogde plaats van vestiging van de school.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
  - number: 72a.3
    text: |-
      Het te verwachten aantal leerlingen, bedoeld in het tweede lid, onderdeel a, wordt berekend overeenkomstig de
      formule q = (y/x *100%) * w * z, waarbij:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
  - number: 72a.3.a
    text: |-
      in het geval van keuze voor de ouderverklaring geldt: y = aantal kinderen in de leeftijd van 2 tot en met 4 jaar
      van wie in de ouderverklaring is aangegeven belangstelling te hebben voor de school in de aanvraag; x = totaal
      aantal kinderen in de leeftijd van 2 tot en met 4 jaar op 1 januari van het kalenderjaar waarin de aanvraag wordt
      gedaan, in het voedingsgebied, bedoeld in het tweede lid, onder b; w = het totaal aantal kinderen in de leeftijd
      van 4 tot en met 11 jaar, vermeerderd met 30 procent van het aantal kinderen in de leeftijd van 12 jaar in het
      voedingsgebied, bedoeld in het tweede lid onder b, op 1 januari van het elfde jaar na de indiening van de aanvraag,
      gebaseerd op gegevens onder meer verstrekt door het Centraal Bureau voor de Statistiek; z = een bij ministeriële
      regeling te bepalen correctiefactor;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
  - number: 72a.3.b
    text: |-
      in het geval van keuze voor het marktonderzoek geldt: y = aantal kinderen in de leeftijd van 2 tot en met 4 jaar
      ten aanzien van wie in het marktonderzoek is aangegeven dat er belangstelling is voor de school in de aanvraag;
      x = totaal aantal kinderen in de leeftijd van 2 tot en met 4 jaar, ten aanzien van wie in het marktonderzoek is
      deelgenomen; w = het totaal aantal kinderen in de leeftijd van 4 tot en met 11 jaar vermeerderd met 30 procent
      van het aantal kinderen in de leeftijd van 12 jaar in het voedingsgebied, bedoeld in het tweede lid onder b, op
      1 januari van het elfde jaar na de indiening van de aanvraag, gebaseerd op gegevens onder meer verstrekt door het
      Centraal Bureau voor de Statistiek; z = een bij ministeriële regeling te bepalen correctiefactor.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
  - number: 72a.4
    text: |-
      De ouderverklaring, bedoeld in het eerste lid, heeft betrekking op één kind in de leeftijd van 2 tot en met 4
      jaar op 1 november van het kalenderjaar waarin de aanvraag wordt gedaan en wordt ingediend door de ouder van deze
      leerling.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
  - number: 72a.5
    text: 'Het marktonderzoek, bedoeld in het eerste lid,:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
  - number: 72a.5.a
    text: heeft betrekking op kinderen in de leeftijd van 2 tot en met 4 jaar;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
  - number: 72a.5.b
    text: |-
      wordt afgenomen onder de ouders van kinderen, bedoeld in onderdeel a, op een wetenschappelijk verantwoorde manier
      door een onafhankelijk onderzoeksbureau dat aantoonbaar werkt volgens een door een brancheorganisatie opgestelde
      gedragscode met betrekking tot de uitvoering van marktonderzoek;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
  - number: 72a.5.c
    text: |-
      wordt uitgevoerd aan de hand van een aselecte steekproef uit de kinderen, bedoeld in onderdeel a, die aantoonbaar
      representatief is voor die kinderen; en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
  - number: 72a.5.d
    text: mag niet ouder zijn dan 24 maanden voorafgaand aan de uiterste indieningsdatum van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
  - number: 72a.6
    text: |-
      Indien uit de belangstellingsmeting van meer dan één aanvraag blijkt dat de betrokken postcodegebieden, bedoeld
      in het tweede lid, onderdeel b, elkaar overlappen en daardoor de som van de kinderen voor wie belangstelling
      is aangetoond in het overlappende voedingsgebied groter is dan het totaal aantal kinderen in het overlappende
      voedingsgebied, worden de aantallen van de kinderen voor wie belangstelling is aangetoond in het overlappende
      voedingsgebied naar evenredigheid verminderd tot de som van het totaal kinderen in het overlappende voedingsgebied
      voor wie belangstelling is aangetoond gelijk is aan het totaal aantal kinderen in het overlappende voedingsgebied.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
  - number: 72a.7
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld aan de uitvoering van de belangstellingsmeting over:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
  - number: 72a.7.a
    text: de wijze waarop de belangstellingsmeting wordt uitgevoerd; en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
  - number: 72a.7.b
    text: |-
      de omvang van het marktonderzoek in relatie tot de minimale verhoudingen tussen de verschillende onderdelen van de
      formule voor de belangstellingsmeting, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel72a
  - number: '73.1'
    text: |-
      Indien uit schriftelijke verklaringen van ten minste 50 verschillende ouders van kinderen tot en met de
      leeftijd van 12 jaar behoefte blijkt te bestaan aan het volgen van openbaar onderwijs en dat in die behoefte
      niet of onvoldoende wordt voorzien, onderzoekt het bestuurscollege of uit de belangstellingsmeting, bedoeld in
      [artikel 72, tweede lid, onderdeel a][ref1], voldoende belangstelling blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '73.2'
    text: |-
      Indien uit de belangstellingsmeting voldoende belangstelling is gebleken, dient het bestuurscollege een aanvraag
      als bedoeld in [artikel 72, eerste tot en met derde lid][ref1], in, met uitzondering van een document waaruit
      blijkt dat de gemeente van de beoogde plaats van vestiging van de school is gevraagd om te overleggen over het
      voornemen tot het doen van een aanvraag om bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '73.3'
    text: |-
      Voor een openbare school wordt in elk geval door het bestuurscollege een aanvraag als bedoeld in [artikel 72][ref1]
      ingediend, indien binnen 10 kilometer van de plaats in de gemeente waar het onderwijs moet worden gegeven over de
      weg gemeten geen school aanwezig is waar openbaar onderwijs wordt gegeven en aan het volgen van openbaar onderwijs
      behoefte bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '73.4'
    text: |-
      Indien binnen 10 kilometer van de plaats in de gemeente waar het onderwijs moet worden gegeven over de weg gemeten
      geen school aanwezig is waar openbaar onderwijs wordt gegeven en aan het volgen van openbaar onderwijs behoefte
      bestaat, brengt Onze Minister een openbare school waarvoor een aanvraag is gedaan voor bekostiging in aanmerking,
      indien voldaan is aan de voorschriften van [artikel 72, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '75.1'
    text: |-
      De aanvraag, bedoeld in [artikel 72, tweede lid][ref1], wordt ingediend voor 1 november. De inspectie adviseert
      Onze Minister of de aanvraag voldoet aan de verplichtingen, bedoeld in artikel 72, derde lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '75.2'
    text: |-
      Indien het bevoegd gezag het voornemen heeft om een aanvraag, bedoeld in het eerste lid, in te dienen, meldt het
      bevoegd gezag dit voor 1 juli aan Onze Minister voorafgaand aan die voorgenomen aanvraag. Bij ministeriële regeling
      kunnen nadere regels worden gesteld aan de wijze waarop deze melding plaatsvindt en kan een model voor de melding
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel75
  - number: '75.3'
    text: |-
      Onze Minister controleert of de belangstellingsmeting, bedoeld in [artikel 72, derde lid, onderdeel a][ref1],
      juist en volledig is en besluit op basis van de aanvraag, bedoeld in artikel 72, tweede, derde en vijfde lid, voor
      1 juni of de school met ingang van 1 augustus van het kalenderjaar volgend op het besluit van Onze Minister voor
      bekostiging in aanmerking wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '75.4'
    text: |-
      Onze Minister kan de aanvraag, bedoeld in [artikel 72, tweede lid][ref1], afwijzen indien de aanvraag is
      ingediend door een rechtspersoon, niet zijnde een gemeente, die reeds een of meer scholen in stand houdt en
      die een aanwijzing heeft ontvangen als bedoeld in [artikel 128, eerste lid][ref2], of waarvan een of meer van
      de bestuurders of toezichthouders deel uitmaakte of uitmaakt van een andere rechtspersoon die een dergelijke
      aanwijzing heeft ontvangen welke aanwijzing onherroepelijk is geworden en ten tijde van de aanvraag nog geen vijf
      jaren oud is gerekend vanaf de ontvangst van het besluit tot toepassing van artikel 128, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel128
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '128'
        hoofdstuk: I
        afdeling: '8'
  - number: '75.5'
    text: |-
      De bekostiging vangt aan op 1 augustus. De aanspraak op bekostiging vervalt indien uiterlijk op de eerste schooldag
      na1 augustus in het kalenderjaar na het besluit van Onze Minister geen onderwijs aan de nieuwe school wordt
      gegeven.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel75
  - number: '75.6'
    text: |-
      In afwijking van het vijfde lid en op aanvraag van het bevoegd gezag of het openbaar lichaam van het eiland van
      vestiging van de school kan Onze Minister besluiten in bijzondere gevallen de aanspraak op bekostiging voor een
      jaar te handhaven. Indien Onze Minister daartoe besluit, vervalt de aanspraak op bekostiging, indien uiterlijk
      op de eerste schooldag na 1 augustus in het tweede kalenderjaar na het in het vijfde lid bedoelde besluit geen
      onderwijs wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel75
  - number: '75.7'
    text: |-
      Dit artikel is niet van toepassing op de totstandkoming van een nevenvestiging, bij omzetting van een
      bekostigde bijzondere school in een bekostigde openbare school of omgekeerd en bij de totstandkoming van een
      samenwerkingsschool.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel75
  - number: '75.8'
    text: |-
      Onverminderd [artikel 3:41 van de Algemene wet bestuursrecht][ref1] worden besluiten, bedoeld in het derde, vierde
      en vijfde lid, gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '75.9'
    text: |-
      Voor uitsluitend de controle of de gegevens uit de ouderverklaringen, bedoeld in
      [artikel 72a, vijfde lid, onderdeel a][ref1], juist en volledig zijn, maakt Onze Minister gebruik van het
      burgerservicenummer van een van de ouders en het kind waarop de ouderverklaring betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72a
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: 72a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '75.10'
    text: |-
      Onze Minister stelt op voordracht van de inspectie een kader vast waarin de werkwijze voor het advies, bedoeld in
      het eerste lid, is vastgelegd. Deze werkwijze omvat in ieder geval een gesprek over de aanvraag met het bevoegd
      gezag dat de aanvraag heeft ingediend. Dit kader wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel75
  - number: '75.11'
    text: |-
      Het bestuurscollege van de beoogde plaats van vestiging van de school kan voor de datum, genoemd in het eerste lid,
      bij Onze Minister een zienswijze naar voren brengen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel75
  - number: '76.1'
    text: |-
      Onze Minister kan onder door hem te stellen voorwaarden voor bekostiging in aanmerking brengen een school die
      wordt omgezet van een bijzondere school in een openbare school of omgekeerd dan wel een school die tot stand komt
      als samenwerkingsschool als bedoeld in [artikel 22a, eerste lid][ref1]. Een omzetting kan slechts plaatsvinden met
      ingang van 1 augustus van enig kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel22a
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: 22a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '76.2'
    text: |-
      Indien het bevoegd gezag binnen een gemeente een vestiging verplaatst over hemelsbreed gemeten een afstand van
      minder dan 3 kilometer van het huidige vestigingsadres, blijft de aanspraak op bekostiging bestaan.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel76
  - number: '76.3'
    text: |-
      Indien het bevoegd gezag een vestiging verplaatst over hemelsbreed gemeten 3 kilometer of meer van het huidige
      vestigingsadres, zijn de [artikelen 72][ref1], [72a][ref2] en [75][ref3] van overeenkomstige toepassing. Onze
      Minister kan onder door hem te stellen voorwaarden een vestiging voor bekostiging in aanmerking blijven brengen
      zonder dat de belangstellingsmeting aannemelijk maakt dat de vestiging op 1 januari van het elfde jaar na de
      verplaatsing zal worden bezocht door ten minste het aantal leerlingen dat overeenkomt met de stichtingsnorm.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel72a
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel75
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: 72a
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0030280
        artikel: '75'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '77'
    text: Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel77
  - number: '78.1'
    text: |-
      De eilandsraad of het bestuurscollege draagt overeenkomstig het bepaalde in deze afdeling ten behoeve van de
      scholen zorg voor de voorzieningen in de huisvesting op het grondgebied van het openbaar lichaam. Deze huisvesting
      is zodanig dat kan worden voldaan aan de redelijke eisen die het onderwijs aan de huisvesting van scholen in het
      openbaar lichaam stelt. De eilandsraad of het bestuurscollege behandelt daarbij de door het openbaar lichaam in
      stand gehouden scholen en de andere scholen op gelijke voet.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel78
  - number: '78.2'
    text: |-
      Bij algemene maatregel van bestuur worden bruto vloeroppervlakten per gelijktijdig aanwezige leerling
      voorgeschreven die voorzieningen in de huisvesting ten minste dienen te bevatten.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel78
  - number: '79.1'
    text: 'Voor de toepassing van deze afdeling worden onder voorzieningen in de huisvesting begrepen:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel79
  - number: 79.1.a
    text: 'voor blijvend onderscheidenlijk voor tijdelijk gebruik bestemde voorzieningen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel79
  - number: 79.1.a.1°
    text: |-
      nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een gedeelte
      daarvan, terreinen, alsmede eerste aanschaf van onderwijsleerpakketten en meubilair,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel79
  - number: 79.1.a.2°
    text: uitbreiding van de onder 1° bedoelde voorzieningen, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel79
  - number: 79.1.a.3°
    text: medegebruik van een ruimte die geschikt is voor het onderwijs;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel79
  - number: 79.1.b
    text: |-
      herstel van constructiefouten aan het gebouw, alsmede herstel en vervanging in verband met schade aan gebouw,
      onderwijsleerpakketten en meubilair in geval van bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel79
  - number: '79.2'
    text: De kosten van bouwvoorbereiding kunnen tot de kosten van huisvesting worden gerekend.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel79
  - number: '80.1'
    text: |-
      Het bestuurscollege stelt jaarlijks, na overleg met de betrokken bevoegde gezagsorganen, ten behoeve van het
      eerstvolgende jaar voor een door het college te bepalen tijdstip een bekostigingsplafond vast voor de bekostiging
      van de voorzieningen in de huisvesting voor:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel80
  - number: 80.1.a
    text: scholen, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel80
  - number: 80.1.b
    text: |-
      scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs, voor
      voorbereidend beroepsonderwijs en voor praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel80
  - number: '80.2'
    text: |-
      Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      in het eerste lid bedoelde scholen op het grondgebied van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel80
  - number: '81.1'
    text: |-
      Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat een voorziening in de
      huisvesting wenst, dient een aanvraag voor 1 september voorafgaand aan het jaar waarop de aanvraag betrekking heeft
      in bij het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel81
  - number: '81.2'
    text: De eilandsraad stelt bij verordening de vereisten van de aanvraag vast.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel81
  - number: '81.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de door het openbaar lichaam in stand gehouden
      scholen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel81
  - number: '82.1'
    text: |-
      Het bestuurscollege beslist voor 1 januari van het jaar waarop de aanvraag betrekking heeft op de aanvraag.
      Het bestuurscollege geeft het bevoegd gezag de gelegenheid om een onvolledige aanvraag binnen een door het
      bestuurscollege te stellen termijn aan te vullen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel82
  - number: '82.2'
    text: 'Het bestuurscollege kan besluiten de aanvraag niet te behandelen, indien:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel82
  - number: 82.2.a
    text: |-
      het bevoegd gezag niet heeft voldaan aan de vereisten voor het in behandeling nemen van de aanvraag, uit de
      eilandsverordening, bedoeld in [artikel 81, tweede lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel81
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '81'
        hoofdstuk: I
        afdeling: '3'
  - number: 82.2.b
    text: |-
      de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanvraag of voor de voorbereiding
      van de beschikking.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel82
  - number: '82.3'
    text: |-
      Indien het bekostigingsplafond, bedoeld in [artikel 80][ref1], niet toereikend is, wordt de volgorde van verlening
      van bekostiging bepaald op basis van de urgentie van de gevraagde voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel80
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '80'
        hoofdstuk: I
        afdeling: '3'
  - number: '82.4'
    text: |-
      De beschikking van het bestuurscollege kan een gedeelte van de gewenste voorziening dan wel een andere voorziening
      dan gewenst omvatten.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel82
  - number: '83.1'
    text: |-
      In afwijking van de termijnen genoemd in de [artikelen 81][ref1] en [82][ref2], beslist het bestuurscollege binnen
      vier weken op een aanvraag voor een voorziening in de huisvesting die gelet op de voortgang van het onderwijs geen
      uitstel kan lijden.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel82
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '81'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '82'
        hoofdstuk: I
        afdeling: '3'
  - number: '83.2'
    text: 'Het bestuurcollege wijst de aanvraag af, indien:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel83
  - number: 83.2.a
    text: |-
      het besluit over de voorziening kan worden genomen met inachtneming van de termijn, bedoeld in
      [artikel 82, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel82
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '82'
        hoofdstuk: I
        afdeling: '3'
  - number: 83.2.b
    text: |-
      een van de weigeringsgronden, genoemd in
      [artikel 84, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel84
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '84'
        hoofdstuk: I
        afdeling: '3'
  - number: '84.1'
    text: 'Een voorziening in de huisvesting wordt slechts geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel84
  - number: 84.1.a
    text: |-
      de gewenste voorziening geen voorziening is in de zin van [artikel 79][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel79
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '79'
        hoofdstuk: I
        afdeling: '3'
  - number: 84.1.b
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de aard en de omvang van de voorzieningen waarover de
      school reeds beschikt, voor zover deze uit de openbare kas zijn bekostigd,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel84
  - number: 84.1.c
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van het aantal
      leerlingen of onderwijskundige ontwikkelingen,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel84
  - number: 84.1.d
    text: |-
      op andere wijze dan wordt gewenst redelijkerwijs in de behoefte aan huisvesting kan worden voorzien, onder meer
      doordat binnen redelijke afstand van de gewenste plaats van de voorziening gebruik dan wel medegebruik mogelijk is,
      of een reeds voor bekostiging in aanmerking gebracht gebouw of deel daarvan beschikbaar komt,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel84
  - number: 84.1.e
    text: |-
      het bekostigingsplafond, bedoeld in [artikel 80][ref1], niet toereikend is voor de te verstrekken voorzieningen
      voor scholen als bedoeld in het eerste lid, onderdelen a en b, van dat artikel, of


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel80
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '80'
        hoofdstuk: I
        afdeling: '3'
  - number: 84.1.f
    text: de gewenste voorziening anders dan op grond van de onderdelen b tot en met d niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel84
  - number: '84.2'
    text: |-
      Een voorziening in de huisvesting kan tevens worden geweigerd, indien de voorziening als gevolg van het verwijtbaar
      nalaten van noodzakelijk onderhoud in een slechte bouwkundige staat verkeert of indien de voorziening nodig is voor
      herstel van schade die is veroorzaakt door schuld of toedoen van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel84
  - number: '85.1'
    text: |-
      Het bestuurscollege beslist met ingang van welk tijdstip de bekostiging van een voorziening daadwerkelijk een
      aanvang kan nemen, onverminderd het bepaalde in [artikel 86][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel86
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '86'
        hoofdstuk: I
        afdeling: '3'
  - number: '85.2'
    text: |-
      De aanspraak op bekostiging van een voorziening vervalt, indien niet binnen een bij de beschikking te
      bepalen termijn met betrekking tot de voorziening een bouwopdracht is gegeven dan wel een koop-, huur- of
      erfpachtovereenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel85
  - number: '86'
    text: |-
      Voorzieningen komen voor bekostiging in aanmerking, mits op het op grond van [artikel 85, eerste lid][ref1],
      vastgestelde tijdstip,


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel85
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '85'
        hoofdstuk: I
        afdeling: '3'
  - number: 86.a
    text: is voldaan aan de bij of krachtens de wet gestelde voorschriften, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel86
  - number: 86.b
    text: |-
      de feiten en omstandigheden waarin de school verkeert, ten opzichte van de feiten en omstandigheden ten tijde van
      de vaststelling van de beschikking tot verlening niet ingrijpend zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel86
  - number: '87.1'
    text: |-
      Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school geeft opdracht de voorziening
      in de huisvesting waartoe op grond van de [artikelen 82][ref1] en [83][ref2] kan worden overgegaan, tot stand te
      brengen met daartoe door het openbaar lichaam beschikbaar te stellen gelden, tenzij het met het bestuurscollege
      overeenkomt dat het openbaar lichaam deze voorziening tot stand brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel83
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '82'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '83'
        hoofdstuk: I
        afdeling: '3'
  - number: '87.2'
    text: |-
      Indien het openbaar lichaam de voorziening in de huisvesting van een niet door het openbaar lichaam in stand
      gehouden school tot stand heeft gebracht, worden gebouw en terrein aan het bevoegd gezag in eigendom overgedragen,
      tenzij het bestuurscollege en het bevoegd gezag anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel87
  - number: '87.3'
    text: |-
      Indien de voorziening in de huisvesting, bedoeld in het tweede lid, niet voldoet aan de eisen voor
      eigendomsoverdracht, geeft het bestuurscollege deze aan het bevoegd gezag in gebruik.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel87
  - number: '88'
    text: |-
      Indien het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school aanspraak heeft op
      bekostiging van een voorziening in de huisvesting, behoeven de bouwplannen en de desbetreffende begrotingen de
      instemming van het bestuurscollege, tenzij het bevoegd gezag met het bestuurscollege overeenkomt dat het openbaar
      lichaam deze voorziening tot stand brengt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel88
  - number: '89'
    text: |-
      Het openbaar lichaam brengt een voorziening in de huisvesting van een niet door het openbaar lichaam in stand
      gehouden school slechts tot stand, indien tussen het bestuurscollege en het bevoegd gezag overeenstemming bestaat
      over de bouwplannen en de wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel89
  - number: '90.1'
    text: |-
      Het bevoegd gezag is verplicht het gebouw en terrein, alsmede de roerende zaken waarvoor bekostiging wordt genoten,
      behoorlijk te gebruiken en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel90
  - number: '90.2'
    text: |-
      Vervreemding door het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school anders dan op
      grond van [artikel 55][ref1] of [artikel 61][ref2] van gebouwen, terreinen en roerende zaken waarvoor bekostiging
      wordt genoten, of bezwaren met een zakelijk recht door het bevoegd gezag van een niet door het openbaar lichaam in
      stand gehouden school van zodanige gebouwen en terreinen, is zonder toestemming van het bestuurscollege nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel61
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '55'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '61'
        hoofdstuk: I
        afdeling: '3'
  - number: '90.3'
    text: |-
      Het tweede lid is niet van toepassing ten aanzien van het recht van opstal ten behoeve van een door het openbaar
      lichaam te plaatsen tijdelijke voorziening in de huisvesting op grond die eigendom is van het bevoegd gezag van de
      betrokken school.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel90
  - number: '91.1'
    text: |-
      Het bestuurscollege is bevoegd een gedeelte van een gebouw of terrein dat tijdelijk of gedurende een gedeelte van
      de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd te bestemmen als huisvesting voor
      een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde basisonderwijs, of voor educatie
      als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1] dan wel voor andere culturele, maatschappelijke
      of recreatieve doeleinden. Het voorgenomen gebruik dient zich te verdragen met het onderwijs aan de in het gebouw
      gevestigde school. Tevens is het bestuurscollege bevoegd ten behoeve van het onderwijs in lichamelijke oefening
      of expressie-activiteiten een gebouw of terrein dan wel een gedeelte daarvan dat tijdelijk gedurende gedeelten van
      de dag of in het geheel niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd te bestemmen als
      huisvesting voor een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde basisonderwijs,
      of voor educatie als bedoeld in de Wet educatie en beroepsonderwijs BES dan wel voor andere culturele,
      maatschappelijke of recreatieve doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: '91.2'
    text: |-
      Indien het gebouw of terrein in gebruik is voor een niet door het openbaar lichaam in stand gehouden school pleegt
      het bestuurscollege vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met het bevoegd gezag
      van die school waarvoor de huisvesting is bestemd.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel91
  - number: '92.1'
    text: |-
      Voor zover [artikel 91][ref1] geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw
      of terrein in gebruik geven ten behoeve van uit de openbare kas bekostigd onderwijs dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden. Voor zover niet nodig voor uit de openbare kas
      bekostigd onderwijs, kan het bevoegd gezag een gedeelte van het gebouw of terrein verhuren aan een derde,
      voor zover het gehuurde niet bestemd zal zijn als woon- of bedrijfsruimte in de zin van de [vijfde][ref2] en
      [zesde afdeling van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref3]. Indien het een niet door het openbaar
      lichaam in stand gehouden school betreft, is voor verhuur toestemming van het bestuurscollege vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Afdeling5
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Afdeling6
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '91'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005290
        afdeling: '6'
  - number: '92.2'
    text: 'De ingebruikgeving of verhuur ingevolge het eerste lid eindigt:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel92
  - number: 92.2.a
    text: |-
      indien het bestuurscollege gebruik maakt van zijn bevoegdheid op grond van [artikel 91][ref1] zonder dat enige
      schadeplicht ontstaat, of


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel91
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '91'
        hoofdstuk: I
        afdeling: '3'
  - number: 92.2.b
    text: indien het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel92
  - number: '92.3'
    text: |-
      Ingebruikgeving of verhuur ingevolge het eerste lid geschiedt niet indien het voorgenomen gebruik zich niet
      verdraagt met het onderwijs aan de in het gebouw gevestigde school.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel92
  - number: '92.4'
    text: |-
      Op de ingebruikgeving en verhuur ingevolge het eerste lid is
      [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: '92.5'
    text: |-
      Het zonder toestemming van het bestuurscollege verhuren van een gebouw of terrein door het bevoegd gezag van een
      niet door het openbaar lichaam in stand gehouden school alsmede elk met dit artikel strijdig beding opgenomen in
      een huurovereenkomst met betrekking tot schoolgebouwen, is nietig.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel92
  - number: '93'
    text: |-
      Voorzieningen aan gebouwen of terreinen in verband met verhuur krachtens de [artikelen 92][ref1] of [94][ref2]
      door het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school komen niet ten laste van het
      openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel94
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '92'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '94'
        hoofdstuk: I
        afdeling: '3'
  - number: '94.1'
    text: |-
      Het bestuurscollege en het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat
      eigenaar is van het gebouw en terrein, kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag blijvend
      heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht vatbaar
      gedeelte daarvan, voor de school te gebruiken.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel94
  - number: '94.2'
    text: |-
      De Rijksvertegenwoordiger kan in geval van een geschil omtrent de toepassing van het eerste lid desgevraagd
      besluiten dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of
      een voor eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. De aanvraag om het besluit
      wordt gedaan door het bestuurscollege of door het bevoegd gezag van de school. Alvorens op de aanvraag te
      besluiten, hoort de Rijksvertegenwoordiger de wederpartij.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel94
  - number: '94.3'
    text: |-
      Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat voornemens is gebouwen
      of terreinen, of een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, doet hiervan onverwijld
      mededeling aan het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel94
  - number: '94.4'
    text: |-
      Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, of het in het tweede lid bedoelde besluit
      van de Rijksvertegenwoordiger onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de
      rechter, inhoudende een besluit als bedoeld in het tweede lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, wordt de akte, het onherroepelijk geworden besluit onderscheidenlijk de uitspraak, ingeschreven in de
      openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek BES][ref1]. Door de
      inschrijving verkrijgt het openbaar lichaam de eigendom.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Afdeling2
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0028745
        afdeling: '2'
  - number: '94.5'
    text: |-
      Het vierde lid is niet van toepassing indien het gebouw of terrein volledig voor rekening van het bevoegd gezag
      van een niet door het openbaar lichaam in stand gehouden school is gebouwd of aangelegd, tenzij het bestuurscollege
      en het bevoegd gezag anders overeenkomen. Het bestuurscollege en het bevoegd gezag van een niet door het openbaar
      lichaam in stand gehouden school bepalen gezamenlijk de vergoeding van het openbaar lichaam aan het bevoegd gezag
      en, indien de gebouwen en terreinen niet meer voor het basisonderwijs worden gebruikt, de verplichtingen van
      het bevoegd gezag ten opzichte van het openbaar lichaam. Het tweede lid is van overeenkomstige toepassing. Bij
      ministeriële regeling kunnen regels worden gesteld over de toepassing van de eerste en tweede volzin.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel94
  - number: '94.6'
    text: |-
      Het bestuurscollege en het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat
      eigenaar is van het schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het gebouw dat
      niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel94
  - number: '94.7'
    text: |-
      De Rijksvertegenwoordiger kan in geval van een geschil omtrent de toepassing van het vijfde lid desgevraagd
      besluiten dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor
      het onderwijs nodig zal zijn. De aanvraag om het besluit wordt gedaan door het bestuurscollege of door het bevoegd
      gezag van de school. Alvorens op de aanvraag te besluiten, hoort de Rijksvertegenwoordiger de wederpartij.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel94
  - number: '94.8'
    text: |-
      Zodra de in het vijfde lid bedoelde akte door beide partijen is getekend, of het in het zesde lid bedoelde
      besluit van de Rijksvertegenwoordiger onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak
      van de rechter, inhoudende een beslissing als bedoeld in het zesde lid eerste volzin, in de plaats treedt van het
      vernietigde besluit, kan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school het
      desbetreffende gedeelte van het gebouw met toestemming van het bestuurscollege verhuren.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel94
  - number: '94.9'
    text: |-
      De toestemming, bedoeld in het zevende lid, wordt verleend voor een tijdvak van ten hoogste 3 jaren. Op aanvraag
      van het bevoegd gezag kan dit tijdvak telkens worden verlengd met een termijn van ten hoogste 3 jaren.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel94
  - number: '94.10'
    text: |-
      Op de verhuur, bedoeld in het zevende lid, is [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: '95'
    text: |-
      In afwijking van deze afdeling kan de eilandsraad besluiten dat jaarlijks een bedrag voor huisvestingskosten wordt
      betaald aan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school. De eilandsraad neemt
      het besluit in overeenstemming met het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel95
  - number: '96'
    text: |-
      Het bevoegd gezag van een niet door het desbetreffende openbaar lichaam in stand gehouden school is gehouden
      aan de eilandsraad onderscheidenlijk het bestuurscollege alle inlichtingen te verschaffen die de eilandsraad
      onderscheidenlijk bestuurscollege voor een adequate uitvoering van de bepalingen in deze afdeling noodzakelijk
      achten.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel96
  - number: '97.1'
    text: |-
      Het bevoegd gezag, dan wel het openbaar lichaam dat eigenaar is van een schoolgebouw, zorgt voor het deel van de
      exploitatie waarop de bekostiging, bedoeld in [artikel 99, tweede lid, aanhef en onderdelen d, e en j][ref1],
      betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel99
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '99'
        hoofdstuk: I
        afdeling: '4'
  - number: '97.2'
    text: |-
      Het bevoegd gezag van een bijzondere school dat eigenaar is van een schoolgebouw, kan met het bestuurscollege
      overeenkomen dat het openbaar lichaam het in het eerste lid bedoelde deel van de exploitatie, bedoeld in het eerste
      lid, geheel of gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel97
  - number: '97.3'
    text: |-
      Het bevoegd gezag dat eigenaar is van een schoolgebouw kan met een bevoegd gezag dat gebruikmaakt van dat
      schoolgebouw overeenkomen dat het laatstgenoemde bevoegd gezag een deel van de exploitatie, bedoeld in het eerste
      lid, geheel of gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel97
  - number: '97.4'
    text: |-
      Indien het openbaar lichaam eigenaar is van het schoolgebouw, kan het bevoegd gezag van een bijzondere school met
      het openbaar lichaam overeenkomen dat het bevoegd gezag het deel van de exploitatie, bedoeld in het eerste lid,
      geheel of gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel97
  - number: '97.5'
    text: |-
      Het bevoegd gezag zorgt voor het deel van de exploitatie waarop de bekostiging, bedoeld in
      [artikel 99, tweede lid, aanhef en onderdeel f, g en i][ref1], betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel99
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '99'
        hoofdstuk: I
        afdeling: '4'
  - number: '98'
    text: |-
      Het openbaar lichaam bekostigt aan het bevoegd gezag van een niet door het
      openbaar lichaam in stand gehouden school dat is onderworpen aan een of meer der in
      [artikel 43 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] bedoelde belastingen ter
      zake van onroerende zaken het bedrag dat is uitgegeven voor de belastingen met betrekking tot de in het openbaar
      lichaam gelegen gebouwen en terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel43
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '43'
  - number: '99.1'
    text: De bekostiging van een school is bestemd voor kosten voor personeel en exploitatie van die school.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: '99.2'
    text: 'De bekostiging van de scholen wordt in ieder geval verstrekt voor de kosten van:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: 99.2.a
    text: de salarissen, toelagen, uitkeringen en vergoedingen voor het personeel;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: 99.2.b
    text: |-
      personeel op grond van voorschriften bij of krachtens de [Ambtenarenwet BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0028215
  - number: 99.2.c
    text: de bijdragen voor het pensioen voor het personeel en dat van de nagelaten betrekkingen;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: 99.2.d
    text: het onderhoud van het gebouw en het terrein;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: 99.2.e
    text: het energie- en waterverbruik;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: 99.2.f
    text: de middelen;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: 99.2.g
    text: de administratie, het beheer en het bestuur;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: 99.2.h
    text: de loopbaanoriëntatie en -begeleiding;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: 99.2.i
    text: de schoonmaak van het gebouw en het terrein; en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: 99.2.j
    text: de publiekrechtelijke heffingen, met uitzondering van belastingen ter zake van onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: '99.3'
    text: |-
      Het bevoegd gezag wendt met in achtneming van het eilandelijk zorgplan de bekostiging aan voor de kosten, bedoeld
      in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: '99.4'
    text: 'Het bevoegd gezag kan de bekostiging mede aanwenden voor de kosten, bedoeld in het tweede lid, van:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: 99.4.a
    text: een andere school;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: 99.4.b
    text: een school voor voortgezet onderwijs;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: 99.4.c
    text: |-
      een instelling als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: 99.4.d
    text: het expertisecentrum onderwijszorg.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: '99.5'
    text: |-
      Het bevoegd gezag beheert de middelen van de school op zodanige wijze dat het voortbestaan van de school is
      verzekerd.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: '99.6'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: '99.7'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het door het bevoegd gezag uitzetten van gelden, het
      aangaan van geldleningen en het aangaan van verbintenissen voor financiële producten.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel99
  - number: '100.1'
    text: Onze Minister stelt jaarlijks de bekostiging voor een school vast.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel100
  - number: '100.2'
    text: De bekostiging voor een school bestaat uit een bedrag per school en een bedrag per leerling.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel100
  - number: '100.3'
    text: |-
      Onze Minister kan extra bekostiging toekennen. Bij of krachtens algemene maatregel van bestuur worden regels
      gesteld over de gevallen waarin, de voorwaarden waaronder en het bedrag dat aan extra bekostiging kan worden
      toegekend. In ieder geval wordt extra bekostiging toegekend vanwege de geïsoleerde ligging van een school en het
      prijspeil van Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel100
  - number: '100.4'
    text: |-
      Onze Minister stelt de hoogte van de bedragen, bedoeld in het tweede en derde lid, zodanig vast dat zij voldoet aan
      de redelijke behoeften van een in normale omstandigheden verkerende school.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel100
  - number: '100.5'
    text: |-
      Bij ministeriële regeling worden jaarlijks de bedragen, bedoeld in het tweede en derde lid, vastgesteld, worden
      nadere regels gesteld over de wijze waarop de hoogte van de bekostiging wordt berekend en worden regels gesteld
      over de termijnen van de betaling daarvan.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel100
  - number: '100.6'
    text: |-
      De bedragen, bedoeld in het tweede en derde lid, gelden voor het kalenderjaar volgend op het tijdstip van de
      vaststelling.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel100
  - number: '100.7'
    text: |-
      Bij de vaststelling of tussentijdse aanpassing van de bedragen, bedoeld in het eerste en vijfde lid, worden loon-
      en prijsontwikkelingen verwerkt, tenzij de toestand van 's Rijks financiën zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel100
  - number: '101'
    text: |-
      In geval van samenvoeging van basisscholen, waarbij een of meer basisscholen worden opgeheven en sprake is
      van een minimale instroom van leerlingen in de samengevoegde basisschool, wordt de bekostiging, bedoeld in
      [artikel 100, eerste lid][ref1], van alle betrokken basisscholen gehandhaafd tot het einde van het kalenderjaar
      waarin de basisscholen zijn samengevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel100
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '100'
        hoofdstuk: I
        afdeling: '4'
  - number: '102.1'
    text: |-
      Bij het bepalen van de hoogte van de bekostiging, bedoeld in [artikel 100, eerste lid][ref1], gaat Onze Minister
      uit van het aantal leerlingen van de school op 1 februari van het voorafgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel100
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '100'
        hoofdstuk: I
        afdeling: '4'
  - number: '102.2'
    text: |-
      Voor een school die voor het eerst wordt bekostigd gaat Onze Minister bij het bepalen van de bekostiging, bedoeld
      in [artikel 100, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel100
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '100'
        hoofdstuk: I
        afdeling: '4'
  - number: 102.2.a
    text: |-
      voor de resterende maanden van het kalenderjaar waarin de school wordt geopend, uit van het aantal leerlingen op
      1 oktober volgende op de opening en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel102
  - number: 102.2.b
    text: |-
      voor het daaropvolgende kalenderjaar, uit van het aantal leerlingen van de school op 1 februari volgende op de
      opening.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel102
  - number: '102.3'
    text: |-
      In geval van samenvoeging van scholen, bedoeld in [artikel 101, eerste lid][ref1], gaat Onze Minister bij
      het bepalen van de hoogte van de bekostiging, bedoeld in [artikel 100, eerste lid][ref2], uit van het aantal
      leerlingen van alle bij de samenvoeging betrokken scholen, voor elke school vastgesteld volgens het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel100
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '101'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '100'
        hoofdstuk: I
        afdeling: '4'
  - number: '102.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ter uitvoering van het eerste lid tot en met
      het derde lid.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel102
  - number: '103.1'
    text: |-
      In geval van bijzondere ontwikkelingen in het basisonderwijs, kan Onze Minister in aanvulling op de bekostiging,
      bedoeld in [artikel 100][ref1], bekostiging verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel100
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '100'
        hoofdstuk: I
        afdeling: '4'
  - number: '103.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het verstrekken van de aanvullende bekostiging, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel103
  - number: '103.3'
    text: |-
      Onze Minister kan een bekostigingsplafond instellen voor de aanvullende bekostiging, bedoeld in het eerste lid. In
      dat geval worden bij ministeriële regeling regels gesteld over de verdeling.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel103
  - number: '104.1'
    text: |-
      In geval van bijzondere omstandigheden, kan Onze Minister voor een school in aanvulling op de bekostiging, bedoeld
      in de [artikelen 100][ref1] en [103][ref2], bekostiging verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel103
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '100'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '103'
        hoofdstuk: I
        afdeling: '4'
  - number: '104.2'
    text: 'De bekostiging vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel104
  - number: 104.2.a
    text: op aanvraag van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel104
  - number: 104.2.b
    text: indien nodig, onder het opleggen van verplichtingen aan het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel104
  - number: 104.2.c
    text: voor een bepaalde periode.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel104
  - number: '104.3'
    text: |-
      De aanvraag wordt niet eerder ingediend dan 16 weken voorafgaand aan het kalenderjaar waarin de bijzondere
      omstandigheden zich zullen voordoen en niet later dan in het kalenderjaar waarin die omstandigheden zich hebben
      voorgedaan.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel104
  - number: '104.4'
    text: |-
      Onze Minister beslist binnen 16 weken na ontvangst van de aanvraag. Onze Minister kan deze termijn eenmaal met ten
      hoogste 28 weken verlengen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel104
  - number: '104.5'
    text: |-
      Onze Minister kan een bekostigingsplafond instellen voor de aanvullende bekostiging, bedoeld in het eerste lid. In
      dat geval worden bij ministeriële regeling regels gesteld over de verdeling.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel104
  - number: '105.1'
    text: |-
      Het bestuurscollege stelt na overleg met de bevoegde gezagen van de niet door het openbaar lichaam in stand
      gehouden scholen het aantal uren per week vast dat per groep leerlingen ten hoogste:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel105
  - number: 105.1.a
    text: ter beschikking wordt gesteld in een ruimte voor het onderwijs in lichamelijke oefening, of
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel105
  - number: 105.1.b
    text: voor bekostiging voor de exploitatie van een ruimte voor het onderwijs in lichamelijke oefening in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel105
  - number: '105.2'
    text: Het aantal uren, bedoeld in het eerste lid, wordt vastgesteld op ten minste twee uren.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel105
  - number: '105.3'
    text: 'Het bestuurscollege stelt de hoogte vast van:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel105
  - number: 105.3.a
    text: de bekostiging, bedoeld in het eerste lid, onder b, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel105
  - number: 105.3.b
    text: |-
      de bekostiging voor de vaste kosten van de exploitatie van een ruimte voor lichamelijke oefening waarvan de
      eigendom berust bij het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel105
  - number: '105.4'
    text: |-
      De hoogte van de bekostiging, bedoeld in het derde lid, kan verschillend worden vastgesteld, afhankelijk van de
      oppervlakte van de ruimte, alsmede tussen ruimten voor de exploitatie waarvan op grond van de onderwijswetgeving
      bekostiging wordt verleend en ruimten waarvoor dat niet het geval is.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel105
  - number: '106.1'
    text: |-
      Het openbaar lichaam verstrekt jaarlijks aan het bevoegd gezag van een niet door het openbaar lichaam in stand
      gehouden school dat eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel106
  - number: 106.1.a
    text: |-
      een bedrag dat wordt bepaald ingevolge [artikel 105][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel105
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '105'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '5'
  - number: 106.1.b
    text: voor zover het gebruik van die ruimte ontoereikend is een overeenkomstig het tweede lid vastgesteld bedrag.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel106
  - number: '106.2'
    text: |-
      Voor zover geen ruimte ter beschikking is gesteld als bedoeld in [artikel 105, eerste lid onderdeel a][ref1],
      verstrekt het openbaar lichaam jaarlijks aan het bevoegd gezag van een niet door het openbaar lichaam in stand
      gehouden school dat geen eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening een bedrag dat
      wordt bepaald ingevolge artikel 105, eerste lid onderdeel b, en derde lid onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel105
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '105'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '5'
  - number: '107.1'
    text: |-
      Indien in een openbaar lichaam uitsluitend een of meer andere rechtspersonen dan het openbaar lichaam openbare
      scholen in stand houdt of houden of openbare scholen ontbreken en het openbaar lichaam uitgaven wil doen voor het
      onderwijs aan die scholen welke niet door het Rijk worden bekostigd, stelt de eilandsraad bij eilandsverordening
      een regeling daarvoor vast en zijn de [artikelen 109 tot en met 113][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel109
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '109'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '6'
  - number: '107.2'
    text: |-
      De regeling, bedoeld in het eerste lid, maakt geen onderscheid tussen openbaar en bijzonder onderwijs en voorziet
      in een behandeling van scholen naar dezelfde maatstaf.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel107
  - number: '107.3'
    text: |-
      De regeling, bedoeld in het eerste lid, bevat in ieder geval de voorzieningen die door het bevoegd gezag van een
      niet door het openbaar lichaam in stand gehouden school kunnen worden aangevraagd en de aanvraagprocedure.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel107
  - number: '107.4'
    text: |-
      De eilandsraad kan besluiten dat het bestuurscollege de regeling, bedoeld in het eerste lid, tijdelijk kan
      aanvullen met nieuwe voorzieningen. De aanvulling wordt binnen een week aan de bevoegde gezagsorganen van de
      niet door het openbaar lichaam in stand gehouden scholen gezonden. Binnen 12 weken na de totstandkoming van de
      aanvulling wordt deze voorgelegd aan de eilandsraad en besluit de eilandsraad over de bekrachtiging ervan. Indien
      de eilandsraad niet binnen 12 weken heeft besloten, wordt de aanvulling gelijk gesteld met een aanvulling die is
      bekrachtigd. Een afwijzing van de aanvulling door de eilandsraad heeft geen gevolgen voor aanvragen waarop reeds is
      besloten of die reeds zijn ingediend en die voorzieningen betreffen waarop de aanvulling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel107
  - number: '107.5'
    text: |-
      [Artikel 7, eerste lid, van de Wet administratieve rechtspraak BES][ref1] is van overeenkomstige toepassing op de
      regeling, bedoeld in het eerste lid, een wijziging daarvan, of de aanvulling, bedoeld in het vierde lid, die door
      de eilandsraad is bekrachtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel7
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '7'
  - number: '107.6'
    text: |-
      Het bestuurscollege maakt jaarlijks in een van overheidswege uitgegeven blad of een dag-, nieuws- of huis-aan-
      huisblad, dan wel op een andere geschikte wijze, een overzicht bekend van voorzieningen die zijn toegekend op grond
      van de regeling, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel107
  - number: '108.1'
    text: |-
      Indien een openbaar lichaam zelf een of meer openbare scholen in stand houdt en hij uitgaven wil doen voor
      het onderwijs aan die scholen welke niet door het Rijk worden bekostigd, kan de eilandsraad daarvoor bij
      eilandsverordening een regeling vaststellen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel108
  - number: '108.2'
    text: |-
      [Artikel 107, tweede tot en met zesde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel107
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '107'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '5'
  - number: '109.1'
    text: |-
      Indien een openbaar lichaam voor een of meer door hem in stand gehouden scholen meer uitgaven doet dan door
      het Rijk worden bekostigd, wordt met inachtneming van deze paragraaf aan het bevoegd gezag van de niet door het
      openbaar lichaam in stand gehouden scholen om de vijf jaar een overschrijdingsbedrag verstrekt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel109
  - number: '109.2'
    text: |-
      Indien een openbaar lichaam vanaf een tijdstip binnen een periode van vijf jaar als bedoeld in het eerste lid,
      geen school in stand houdt, wordt, in afwijking van die volzin, het overschrijdingsbedrag toegekend uiterlijk
      31 december van het kalenderjaar dat volgt op dat tijdstip waarop het openbaar lichaam niet langer een school in
      stand houdt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel109
  - number: '109.3'
    text: |-
      Het bestuurscollege kan in overeenstemming met het bevoegd gezag van een niet door het openbaar lichaam in
      stand gehouden school besluiten dat met betrekking tot een of meer scholen van dat bevoegd gezag uitgaven die
      het openbaar lichaam doet voor een door hem in stand gehouden school buiten beschouwing worden gelaten bij het
      vaststellen van de bedragen, bedoeld in de [artikelen 110][ref1] en [111][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel111
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '110'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '111'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '6'
  - number: '110.1'
    text: |-
      Het bestuurscollege stelt jaarlijks vast in welke mate het voor de door het openbaar lichaam in stand
      gehouden scholen meer dan wel minder uitgaven zal doen dan door het Rijk worden bekostigd. Deze vaststelling
      geschiedt voor het komende begrotingsjaar en het resterende deel van het vijfjarig tijdvak, bedoeld in
      [artikel 109, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel109
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '109'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '6'
  - number: '110.2'
    text: |-
      Indien voor het komende begrotingsjaar meer uitgaven zullen worden gedaan dan door het Rijk worden bekostigd,
      verleent het bestuurscollege in dat begrotingsjaar aan het bevoegd gezag van de niet door het openbaar
      lichaam in stand gehouden scholen een voorschot op het te verwachten overschrijdingsbedrag, bedoeld in
      [artikel 109, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel109
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '109'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '6'
  - number: '110.3'
    text: |-
      Indien uit het besluit van het bestuurscollege, bedoeld in het eerste lid, blijkt dat de hiervoor bedoelde
      meeruitgaven in de resterende jaren van het vijfjarig tijdvak geheel of ten dele worden gecompenseerd door minder
      uitgaven, wordt hiermee rekening gehouden bij de bepaling van de hoogte van het voorschot.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel110
  - number: '110.4'
    text: |-
      Indien uit de jaarlijkse voorlopige vaststelling van de bedragen, bedoeld in [artikel 111, eerste lid][ref1],
      blijkt dat, in afwijking van hetgeen is vastgesteld bij het besluit van het bestuurscollege, bedoeld in het
      eerste lid, meer uitgaven zijn gedaan dan door het Rijk worden bekostigd, verleent het bestuurscollege alsnog een
      voorschot aan het bevoegd gezag van de niet door het openbaar lichaam in stand gehouden scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel111
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '111'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '6'
  - number: '110.5'
    text: |-
      Bij de bepaling van de hoogte van het voorschot, bedoeld in het vierde lid, is het derde lid van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel110
  - number: '111.1'
    text: 'Indien een openbaar lichaam een of meer scholen in stand houdt, stelt het bestuurscollege jaarlijks voorlopig vast:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel111
  - number: 111.1.a
    text: |-
      het totaal van de bedragen, bedoeld in [artikel 115, derde lid][ref1], die in het voorafgaande kalenderjaar zijn
      uitgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel115
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '115'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '6'
  - number: 111.1.b
    text: |-
      het totaal van de ontvangsten, bedoeld in de [artikelen 99][ref1], [100][ref2], [103][ref3] en [104][ref4], in het
      voorafgaande kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel103
      [ref4]: https://wetten.overheid.nl/BWBR0030280#Artikel104
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '99'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '100'
        hoofdstuk: I
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0030280
        artikel: '103'
        hoofdstuk: I
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0030280
        artikel: '104'
        hoofdstuk: I
        afdeling: '4'
  - number: 111.1.c
    text: een staat van voorzieningen die zijn ingesteld voor de door het openbaar lichaam in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel111
  - number: '111.2'
    text: |-
      Indien het openbaar lichaam een deel van de ontvangsten, bedoeld in het eerste lid, aanhef en onder b, toevoegt aan
      een voorziening, wordt dat deel aangemerkt als een uitgave als bedoeld in het eerste lid, aanhef en onder a.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel111
  - number: '111.3'
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdeel c, worden buiten beschouwing gelaten de
      uitgaven en ontvangsten voor:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel111
  - number: 111.3.a
    text: |-
      de administratie, het beheer, het bestuur, bedoeld in [artikel 99, tweede lid, onderdeel g][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel99
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '99'
        hoofdstuk: I
        afdeling: '4'
  - number: 111.3.b
    text: de exploitatie van een ruimte voor het onderwijs in lichamelijke oefening.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel111
  - number: '111.4'
    text: |-
      Bij het vaststellen van de bedragen, bedoeld in het eerste lid onderdeel a, worden buiten beschouwing gelaten
      de uitgaven die worden gedekt door ontvangsten van bedragen die door derden zijn betaald en de uitgaven voor de
      voorzieningen waarvoor het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school op grond
      van de regeling, bedoeld in [artikel 108, eerste lid][ref1], een aanvraag bij het openbaar lichaam kon indienen en
      wel gedurende de periode waarvoor een dergelijke aanvraag kon worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel108
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '108'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '5'
  - number: '111.5'
    text: |-
      Bij het vaststellen van de bedragen bedoeld in het eerste lid, onder c, mogen voorzieningen die volgens de
      desbetreffende rijksbekostiging een afschrijvingstermijn van ten minste 20 jaar hebben, over ten hoogste 20 jaar
      worden aangemerkt als jaarlijkse uitgaven op grond van rente op basis van een fictieve lening met een looptijd van
      ten hoogste 20 jaar en een lineaire aflossing.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel111
  - number: '111.6'
    text: |-
      Indien het openbaar lichaam een deel van de bekostiging voor uitgaven overdraagt aan een ander bevoegd gezag,
      wordt dat deel aangemerkt als een uitgave als bedoeld in het eerste lid, onderdeel a. Indien door een ander bevoegd
      gezag een deel van de bekostiging aan het openbaar lichaam wordt overgedragen, wordt dat deel aangemerkt als een
      ontvangst als bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel111
  - number: '111.7'
    text: |-
      Om de vijf jaar stelt het bestuurscollege voorlopig vast het totaal van de vastgestelde uitgaven en ontvangsten
      in de voorafgaande vijf kalenderjaren, zoals in het eerste tot en met zesde lid is aangegeven. Indien de uitgaven
      hoger zijn dan de ontvangsten, bepaalt het bestuurscollege tevens het bedrag van de overschrijding. Indien een
      openbaar lichaam vanaf een tijdstip binnen een periode van vijf jaar als bedoeld in de eerste volzin geen school
      in stand houdt, stelt het bestuurscollege in afwijking van die volzin zo spoedig mogelijk na dat tijdstip voorlopig
      vast het totaal van de vastgestelde uitgaven en ontvangsten in het aan dat tijdstip voorafgaande deel van de
      periode van vijf jaar, zoals in het eerste tot en met zesde lid is aangegeven.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel111
  - number: '111.8'
    text: |-
      Na sluiting van de rekening van het openbaar lichaam stelt het bestuurscollege de in het eerste en zevende lid
      bedoelde bedragen, zo nodig gewijzigd, vast. In het geval, bedoeld in het zevende lid, tweede volzin, drukt
      het bestuurscollege vervolgens het bedrag van de overschrijding uit in een percentage van het totaal van de
      ontvangsten, bedoeld in het eerste lid, onderdelen c en d. Het percentage wordt afgerond tot twee decimalen.
      Afronding naar beneden vindt plaats indien de derde decimaal kleiner is dan 5, en naar boven indien deze decimaal
      ten minste 5 bedraagt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel111
  - number: '112.1'
    text: |-
      In het jaar volgend op de definitieve vaststelling, bedoeld in [artikel 111, achtste lid][ref1], wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden
      school, die gedurende een of meer jaren van het desbetreffende tijdvak in het openbaar lichaam was gevestigd,
      aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel111
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '111'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '6'
  - number: '112.2'
    text: |-
      Het overschrijdingsbedrag, bedoeld in het eerste lid, wordt vastgesteld door het percentage, bedoeld in
      [artikel 111, achtste lid][ref1], te vermenigvuldigen met het totaal van de ontvangsten van een niet door het
      openbaar lichaam in stand gehouden school dat is gebaseerd op de bedragen die krachtens de [artikel 99][ref2]
      voor het desbetreffende tijdvak zijn vastgesteld, met dien verstande dat bij het vaststellen van het totaal van de
      ontvangsten, bedoeld in voorgaande volzin, buiten beschouwing blijven de ontvangsten, bedoeld in artikel 99, tweede
      lid, onderdeel g, en de exploitatie van de ruimte voor het onderwijs in lichamelijke oefening.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel99
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '111'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '99'
        hoofdstuk: I
        afdeling: '4'
  - number: '112.3'
    text: |-
      Indien aan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school een deel van
      de bekostiging is overgedragen door een ander bevoegd gezag, wordt bij het vaststellen van het totaal van de
      ontvangsten, bedoeld in het tweede lid, tweede volzin, dat deel bij genoemde school wel en bij de school van
      laatstgenoemd bevoegd gezag niet aangemerkt als ontvangsten.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel112
  - number: '112.4'
    text: |-
      Indien een openbaar lichaam voor een niet door het openbaar lichaam in stand gehouden school het deel van de
      kosten, bedoeld in [artikel 99, tweede lid, onderdelen d, e en j][ref1], betrekking hebben, geheel of gedeeltelijk
      verzorgt, wordt een overeenkomstig deel van de ontvangsten in mindering gebracht op het totaal van de ontvangsten
      voor de betrokken school waarover ingevolge het eerste lid het overschrijdingsbedrag wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel99
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '99'
        hoofdstuk: I
        afdeling: '4'
  - number: '112.5'
    text: |-
      Indien een openbaar lichaam gedurende een gedeelte van het desbetreffende tijdvak een of meer scholen in stand
      houdt, wordt voor het vaststellen van het overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het
      totaal van de ontvangsten van een niet door het openbaar lichaam in stand gehouden school over een overeenkomstig
      gedeelte van het desbetreffende tijdvak.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel112
  - number: '113.1'
    text: |-
      Aan het bevoegd gezag van de niet door het openbaar lichaam in stand gehouden scholen wordt een afschrift gezonden
      van de besluiten van het bestuurscollege tot vaststelling van de mate waarin meer dan wel minder uitgaven worden
      gedaan, bedoeld in [artikel 110, eerste lid][ref1], tot verlening van het voorschot, bedoeld in artikel 110,
      tweede of derde lid, en tot voorlopige en definitieve vaststelling van het overschrijdingsbedrag, bedoeld in
      [artikel 111, zevende en achtste lid][ref2]. Daarbij is opgenomen een staat van voorzieningen als bedoeld in
      artikel 111, eerste lid onderdeel d, waarin per kalenderjaar wordt aangegeven het verloop van de toevoegingen en de
      onttrekkingen aan de voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel111
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '110'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '111'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '6'
  - number: '113.2'
    text: |-
      De toezending geschiedt binnen twee weken na de dag waarop het bestuurscollege een besluit als bedoeld in het
      eerste lid heeft genomen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel113
  - number: '113.3'
    text: |-
      In afwijking van [artikel 55 van de Wet administratieve rechtspraak BES][ref1] kan het bevoegd gezag van een niet
      door het openbaar lichaam in stand gehouden school tegen de in het eerste lid bedoelde besluiten beroep instellen
      bij de Rijksvertegenwoordiger. De [artikelen 54][ref2] en 55 van de Wet administratieve rechtspraak BES zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel54
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '54'
  - number: '114.1'
    text: |-
      Op de bekostiging of onderdelen daarvan kunnen voorschotten worden verleend volgens regels, te stellen bij of
      krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel114
  - number: '114.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden tevens voorschriften gegeven voor de verrekening van de
      betaalde voorschotten met het bedrag van de vastgestelde bekostiging of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel114
  - number: '115'
    text: |-
      Onze Minister is bevoegd tot verrekening van vorderingen krachtens deze wet van of op het bevoegd gezag van een
      school met vorderingen van of op Onze Minister krachtens een andere wet.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel115
  - number: '116.1'
    text: |-
      De bekostiging van een bijzondere school wordt beëindigd en een openbare school wordt opgeheven indien het aantal
      leerlingen op de teldatum 1 oktober, gedurende 3 achtereenvolgende schooljaren telkens minder heeft bedragen
      dan 23. De eerste volzin is niet van toepassing gedurende de eerste 8 schooljaren van de bekostiging van een
      school. In afwijking van de tweede volzin eindigt de bekostiging van een in die volzin bedoelde bijzondere
      school en wordt een openbare school opgeheven met ingang van het vijfde schooljaar indien het aantal leerlingen
      van een school als bedoeld in de tweede volzin in het vierde schooljaar van de bekostiging niet ten minste de
      helft van de stichtingsnorm bedraagt. De tweede en derde volzin is niet van toepassing op scholen als bedoeld in
      [artikel 76][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel76
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '76'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '116.2'
    text: |-
      De beëindiging van de bekostiging van een bijzondere school of de opheffing van een openbare school geschiedt met
      ingang van 1 augustus volgend op de 3 achtereenvolgende schooljaren, bedoeld in het eerste lid. De beëindiging van
      de bekostiging van een bijzondere school of de opheffing van een openbare school ten aanzien waarvan gedurende de
      eerste 8 schooljaren van de bekostiging van de school het eerste lid, tweede volzin, toepassing diende te vinden,
      geschiedt met ingang van 1 augustus volgend op die 8 schooljaren.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel116
  - number: '116.3'
    text: |-
      Indien binnen 10 km van een school waarbinnen openbaar onderwijs wordt gegeven, over de weg gemeten geen school
      aanwezig is waarbinnen openbaar onderwijs wordt gegeven en aan het volgen van openbaar onderwijs behoefte bestaat,
      wordt de eerstgenoemde school niet opgeheven op grond van dit artikel.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel116
  - number: '117.1'
    text: |-
      Het bevoegd gezag van een school die op de teldatum 1 oktober minder dan 23 leerlingen telt, kan Onze Minister
      verzoeken in afwijking van [artikel 116, eerste en tweede lid][ref1], die bijzondere school te blijven bekostigen
      of die openbare school in stand te houden voor een door Onze Minister te bepalen termijn. Een besluit tot
      instandhouding wordt in elk geval niet genomen indien het bevoegd gezag tekortschiet in haar zorg voor de kwaliteit
      van het onderwijs, bedoeld in [artikel 13][ref2], of geen perspectief bestaat op structurele toename van het aantal
      leerlingen van de school tot het aantal van ten minste 23 op 1 oktober voorafgaand aan de datum waarop de door Onze
      Minister te bepalen termijn eindigt. Het al dan niet aanwezig zijn van basisscholen in de omgeving van de school
      kan Onze Minister eveneens betrekken bij zijn besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel13
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '116'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '117.2'
    text: |-
      Een aanvraag als bedoeld in het eerste lid moet voor 1 februari voorafgaand aan de datum voor de beëindiging
      van de bekostiging onderscheidenlijk de opheffing schriftelijk worden ingediend bij Onze Minister. De aanvraag
      gaat vergezeld van gegevens ter onderbouwing van het perspectief, bedoeld in het eerste lid, een beredeneerde
      leerlingprognose en gegevens over de ligging van de school ten opzichte van de dichtstbijzijnde basisscholen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel117
  - number: '117.3'
    text: 'Onze Minister besluit voor 1 mei, volgend op de aanvraag, bedoeld in het tweede lid, dat:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel117
  - number: 117.3.a
    text: |-
      met ingang van 1 augustus van het volgende schooljaar de bekostiging van de bijzondere school wordt beëindigd dan
      wel de openbare school wordt opgeheven, of
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel117
  - number: 117.3.b
    text: |-
      met ingang van 1 augustus van het volgende schooljaar de bekostiging van de bijzondere school wordt voortgezet of
      de openbare school in stand wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel117
  - number: '117.4'
    text: |-
      Onze Minister kan de termijn, bedoeld in het eerste lid, op aanvraag van het bevoegd gezag eenmalig verlengen met
      maximaal de duur van de termijn die op grond van het eerste lid ten aanzien van de school door hem was bepaald. De
      tweede en derde volzin van het eerste lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel117
  - number: '118.1'
    text: De eilandsraad kan besluiten tot vermindering van het aantal openbare scholen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel118
  - number: '118.2'
    text: |-
      De openbare rechtspersoon, bedoeld in [artikel 53][ref1], en de stichting, bedoeld in [artikel 22][ref2] of
      [54][ref3], kunnen besluiten tot opheffing van een door die openbare rechtspersoon of stichting in stand gehouden
      school. Een besluit tot opheffing wordt uiterlijk op 1 augustus van het schooljaar voorafgaand aan de beoogde
      datum van opheffing medegedeeld aan de eilandsraad. Indien de eilandsraad voor 1 februari daaropvolgend besluit
      dat hij de school in stand wenst te houden, wordt deze niet opgeheven, maar wordt de instandhouding van de school
      overgedragen aan het openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel54
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '53'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '22'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0030280
        artikel: '54'
        hoofdstuk: I
        afdeling: '2'
  - number: '118.3'
    text: |-
      In afwijking van het eerste lid en het tweede lid, eerste volzin, vindt opheffing niet plaats in het geval, bedoeld
      in [artikel 116, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel116
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '116'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '7'
  - number: '118.4'
    text: |-
      Indien een besluit tot opheffing, bedoeld in het tweede lid, in afwijking van de tweede volzin van dat lid
      na 1 augustus, maar uiterlijk op 1 januari van het schooljaar voorafgaand aan de beoogde datum van opheffing
      wordt medegedeeld aan de eilandsraad, dan wordt de school slechts opgeheven op grond van dat besluit indien de
      eilandsraad uiterlijk op 1 februari volgend op die mededeling besluit om in te stemmen met opheffing van de school.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel118
  - number: '118.5'
    text: |-
      Indien het besluit, bedoeld in het tweede lid, na 1 januari van het schooljaar voorafgaand aan de beoogde datum van
      opheffing wordt medegedeeld aan de eilandsraad, dan wordt de school niet opgeheven op grond van dat besluit.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel118
  - number: '119.1'
    text: |-
      Indien naar het oordeel van Onze Minister de bekostiging van een bijzondere school dient te worden beëindigd of
      een openbare school dient te worden opgeheven, maakt Onze Minister dit voor 1 januari voorafgaand aan de datum van
      beëindiging van de bekostiging onderscheidenlijk opheffing van de school bekend aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel119
  - number: '119.2'
    text: |-
      Indien naar het oordeel van het bevoegd gezag sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 116, derde lid][ref1], deelt het bevoegd gezag dit voor 1 februari voorafgaand aan de datum voor de
      opheffing schriftelijk mede aan Onze Minister. Bij algemene maatregel van bestuur kan worden bepaald welke gegevens
      bij deze mededeling worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel116
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '116'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '7'
  - number: '119.3'
    text: |-
      Voor zover Onze Minister niet reeds heeft bekendgemaakt dat hij de mededeling, bedoeld in het tweede lid, buiten
      behandeling laat wegens het niet verstrekken van de voorgeschreven gegevens, maakt hij voor 1 mei, volgend op de
      mededeling, bedoeld in het tweede lid, aan het bevoegd gezag van de desbetreffende school bekend dat:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel119
  - number: 119.3.a
    text: |-
      naar zijn oordeel geen sprake is van een uitzonderingssituatie, bedoeld in het tweede lid, en dat met ingang van 1
      augustus van het volgende schooljaar de openbare school dient te worden opgeheven, of
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel119
  - number: 119.3.b
    text: met ingang van 1 augustus van het volgende schooljaar de openbare school in stand dient te worden gehouden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel119
  - number: '119.4'
    text: |-
      Indien Onze Minister niet voor 1 mei, volgend op de mededeling, bedoeld in het tweede lid, een bekendmaking als
      bedoeld in het derde lid heeft gedaan, dient met ingang van 1 augustus van het volgende schooljaar de openbare
      school met ingang van laatstgenoemde datum in stand te worden gehouden.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel119
  - number: '120.1'
    text: |-
      Indien de bekostiging van een bijzondere school wordt beëindigd of het bevoegd gezag tot de opheffing van de school
      beslist, eindigt het recht op het gebouw en terrein en worden alle roerende zaken, behalve die welke het bevoegd
      gezag uit eigen middelen heeft aangeschaft, aan het openbaar lichaam op wiens grondgebied het gebouw en terrein
      zijn gelegen, overgedragen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel120
  - number: '120.2'
    text: |-
      [Artikel 94, eerste tot en met vijfde lid][ref1], is van overeenkomstige toepassing met dien verstande dat in de
      verklaring ingevolge het eerste lid en het besluit ingevolge het tweede lid als datum waarop het bevoegd gezag
      blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein voor de school te gebruiken, zal
      worden genoemd de datum waarop de bekostiging is geëindigd dan wel zal eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel94
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '94'
        hoofdstuk: I
        afdeling: '3'
  - number: '121.1'
    text: |-
      Indien de bekostiging van de laatste bijzondere school van een bevoegd gezag wordt beëindigd of het bevoegd gezag
      tot de opheffing van de laatste school beslist, dan wel de laatste openbare school wordt opgeheven, stort het
      bevoegd gezag de niet bestede bekostigingsbedragen terug in de desbetreffende overheidskas.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel121
  - number: '121.2'
    text: Het exploitatietekort blijft in de gevallen, bedoeld in het eerste lid, voor rekening van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel121
  - number: '121.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de wijze waarop het
      exploitatieoverschot, bedoeld in het eerste lid, wordt berekend.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel121
  - number: '122.1'
    text: |-
      Onze Minister kan het bevoegd gezag een aanwijzing tot het nemen van een of meer maatregelen geven, indien sprake
      is van wanbeheer.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122
  - number: '122.2'
    text: 'Onder wanbeheer wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122
  - number: 122.2.a
    text: financieel wanbeleid;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122
  - number: 122.2.b
    text: |-
      het in ernstige of langdurig mate nalaten om, in ieder geval in strijd met [artikel 13][ref1], maatregelen
      te treffen die noodzakelijk zijn voor het waarborgen van de kwaliteit en de goede voortgang van het onderwijs,
      waaronder de deugdelijke afsluiting daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel13
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 122.2.c
    text: het door een bestuurder of toezichthouder ongerechtvaardigd verrijken van het bevoegd gezag, zichzelf of een derde;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122
  - number: 122.2.d
    text: |-
      het in de hoedanigheid van bestuurder of toezichthouder handelen in strijd met wettelijke bepalingen waardoor
      financieel voordeel wordt behaald ten gunste van het bevoegd gezag, zichzelf of een derde;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122
  - number: 122.2.e
    text: |-
      het in ernstige mate verwaarlozen van de zorg voor wat door redelijkheid en billijkheid wordt gevorderd in de
      omgang met betrokkenen in de schoolorganisatie, waaronder in ieder geval wordt verstaan intimidatie of bedreiging
      van personeel, leerlingen of ouders door een bestuurder of toezichthouder;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122
  - number: 122.2.f
    text: |-
      het handelen in strijd met de zorgplicht voor de veiligheid, bedoeld in [artikel 6a][ref1], dat leidt of dreigt te
      leiden tot het toebrengen van ernstige sociale, psychische of fysieke schade aan een of meer leerlingen;


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel6a
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: 6a
        hoofdstuk: I
  - number: 122.2.g
    text: |-
      het structureel of flagrant handelen in strijd met de burgerschapsopdracht, bedoeld in
      [artikel 10, derde lid en lid 3a][ref1], dat leidt of dreigt te leiden tot ernstige aantasting van een of meer
      basiswaarden van de democratische rechtsstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel10
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '122.3'
    text: |-
      Onze Minister motiveert in de aanwijzing waarom het doel van de aanwijzing niet met een minder zwaar middel kan
      worden bereikt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122
  - number: '122.4'
    text: De aanwijzing vermeldt de termijn waarbinnen zij moet worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122
  - number: '122.5'
    text: |-
      Voordat Onze Minister een spoedaanwijzing geeft heeft de inspectie een onderzoek als bedoeld in [artikel 11][ref1]
      of [artikel 15 van de Wet op het onderwijstoezicht][ref2] verricht en daarover een inspectierapport uitgebracht
      als bedoeld in [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref3], waaruit volgt dat sprake is van
      wanbeheer als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '20'
  - number: 122a.1
    text: |-
      Onze Minister kan het bevoegd gezag een spoedaanwijzing tot het nemen van een of meer voorlopige maatregelen geven,
      indien:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122a
  - number: 122a.1.a
    text: het bevoegd gezag tekortschiet in de naleving van het bepaalde bij of krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122a
  - number: 122a.1.b
    text: |-
      uit dat tekortschieten of mede uit dat tekortschieten een wezenlijk vermoeden van wanbeheer als bedoeld in
      [artikel 122, tweede lid][ref1], volgt; en


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel122
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '122'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '7'
  - number: 122a.1.c
    text: dat is vereist in verband met onverwijlde spoed.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122a
  - number: 122a.2
    text: |-
      Onze Minister motiveert in de spoedaanwijzing waarom het doel van de spoedaanwijzing niet met een minder zwaar
      middel kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122a
  - number: 122a.3
    text: De spoedaanwijzing vermeldt de termijn waarbinnen zij moet worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122a
  - number: 122a.4
    text: |-
      De spoedaanwijzing bepaalt de duur waarvoor zij geldt. Deze geldigheidsduur bedraagt ten hoogste zes maanden.
      Onze Minister kan de geldingsduur eenmalig verlengen met ten hoogste zes maanden. Op een verlengingsbesluit is het
      eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122a
  - number: 122a.5
    text: |-
      Voordat Onze Minister een spoedaanwijzing geeft heeft de inspectie een onderzoek als bedoeld in [artikel 11][ref1]
      of [artikel 15 van de Wet op het onderwijstoezicht][ref2] verricht en daarover een inspectierapport uitgebracht als
      bedoeld in [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref3], waaruit volgt dat is voldaan aan de
      vereisten, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '20'
  - number: 122a.6
    text: |-
      Onze Minister informeert de beide Kamers der Staten-Generaal onverwijld nadat toepassing is gegeven aan het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel122a
  - number: '123.1'
    text: |-
      Indien het bevoegd gezag van een school in strijd handelt met het bepaalde bij of krachtens deze wet, waaronder
      mede wordt verstaan het niet opvolgen van een aanwijzing als bedoeld in [artikel 122][ref1] of een spoedaanwijzing
      als bedoeld in [artikel 122a][ref2], kan Onze Minister de bekostiging, voorschotten daaronder begrepen, geheel of
      gedeeltelijk inhouden dan wel opschorten.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel122a
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '122'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: 122a
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '7'
  - number: '123.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een school in
      strijd handelt met [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '123.3'
    text: |-
      Onze Minister kent de bekostiging wederom toe, indien blijkt dat de reden voor de toepassing van het eerste of
      tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel123
  - number: '124.1'
    text: |-
      Indien het bevoegd gezag tekortschiet in haar zorg voor de kwaliteit van het onderwijs, bedoeld in
      [artikel 13][ref1], kan Onze Minister op verzoek van het bevoegd gezag van een school of uit eigen beweging in
      overeenstemming met het bevoegd gezag maatregelen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel13
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '13'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '124.2'
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel124
  - number: '124.3'
    text: |-
      Onze Minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voor zover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel124
  - number: '125.1'
    text: |-
      Het bevoegd gezag stelt jaarlijks een jaarverslag over het voorafgaande kalenderjaar vast. Op deze
      jaarverslaggeving is [Boek 2, titel 9, van het Burgerlijk Wetboek][ref1], met uitzondering van de
      [afdelingen 1][ref2], [11][ref3] en [12][ref4], van overeenkomstige toepassing voor zover bij of krachtens algemene
      maatregel van bestuur niet anders is bepaald. Het jaarverslag bestaat ten minste uit de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Afdeling1
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Afdeling11
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Afdeling12
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003045
        afdeling: '11'
      - id: ref4
        bwb_id: BWBR0003045
        afdeling: '12'
  - number: 125.1.a
    text: |-
      een bestuursverslag als bedoeld in [artikel 391 van Boek 2 van het Burgerlijk Wetboek][ref1] waarin de door het
      bevoegd gezag gehanteerde code voor goed bestuur wordt vermeld alsmede ten minste verantwoording wordt afgelegd
      over de afwijkingen van die code voor goed bestuur,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel391
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '391'
  - number: 125.1.b
    text: |-
      een jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1], waaruit dient te blijken
      dat sprake is van een rechtmatige en doelmatige aanwending van de bekostiging, met daarbij ingevolge het derde lid
      vast te stellen bijlagen,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
  - number: 125.1.c
    text: |-
      overige gegevens als bedoeld in [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
  - number: '125.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welke onderdelen het jaarverslag tevens dient te bevatten,
      dan wel welke onderdelen komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
  - number: '125.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een nadere invulling worden gegeven aan de onderdelen, bedoeld
      in het eerste en tweede lid, en kunnen nadere voorschriften worden gegeven over:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
  - number: 125.3.a
    text: de indeling en de wijze van ordening van de gegevens per onderdeel van het jaarverslag,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
  - number: 125.3.b
    text: de wijze en het tijdstip waarop de desbetreffende onderdelen beschikbaar gesteld worden,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
  - number: 125.3.c
    text: de elektronische verzending van het cijfermatige deel uit de jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
  - number: 125.3.d
    text: de grondslagen voor de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
  - number: '125.4'
    text: |-
      De beschikbaarstelling van de gegevens, bedoeld in het derde lid, onder b, gaat vergezeld van een verklaring
      omtrent de getrouwheid en rechtmatigheid, afgegeven door een door de toezichthouder of het toezichthoudend orgaan
      aangewezen deskundige als bedoeld in [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref1].
      Bij de aanwijzing van de deskundige bedingt de toezichthouder of het toezichthoudend orgaan dat de controle
      overeenkomstig een door Onze Minister vast te stellen accountantsprotocol plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '125.5'
    text: |-
      De code voor goed bestuur, bedoeld in het eerste lid, onderdeel a, bevat ten minste bepalingen over de wijze waarop
      invulling wordt gegeven aan:
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
  - number: 125.5.a
    text: |-
      een beleid dat de eigen deskundigheid en verantwoordelijkheid van het personeel voor de kwaliteit van het onderwijs
      tot haar recht komt,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
  - number: 125.5.b
    text: een integere bedrijfsvoering, waaronder voorzieningen om verstrengeling van belangen tegen te gaan, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
  - number: 125.5.c
    text: afstemming met en verantwoording aan de ouders en andere belanghebbenden binnen en buiten de school.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
  - number: '125.6'
    text: Bij algemene maatregel van bestuur kan een branchecode voor goed bestuur worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
  - number: '125.7'
    text: Het bevoegd gezag maakt het jaarverslag openbaar.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
  - number: '125.8'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven over de wijze en het tijdstip waarop
      openbaarmaking van het jaarverslag plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel125
  - number: '126.1'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het ten behoeve van Onze Minister beschikt over geordende gegevens die
      van belang zijn voor de berekening van de hoogte van de bekostiging, alsmede over een verklaring over de juistheid
      van de bekostigingsgegevens, afgegeven door een door de toezichthouder of het toezichthoudend orgaan aangewezen
      deskundige als bedoeld in [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '126.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel126
  - number: '126.3'
    text: |-
      Het bevoegd gezag bewaart de gegevens, bedoeld in het eerste lid, en de desbetreffende boeken en bescheiden
      gedurende een periode van zeven jaren.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel126
  - number: '127.1'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het beschikt over geordende gegevens ten behoeve van het door Onze
      Minister te voeren beleid met betrekking tot het onderwijs, bedoeld in deze wet, en verleent desgevraagd
      medewerking aan door of namens Onze Minister uit te voeren onderzoek dat geheel of mede op deze gegevens is
      gebaseerd.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel127
  - number: '127.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel127
  - number: '128'
    text: |-
      De voorschriften, bedoeld in [artikel 131, derde lid][ref1], [artikel 132, tweede lid][ref2], en
      [artikel 133, tweede lid][ref3], hebben geen betrekking op het persoonsgebonden nummer BES van een leerling of op
      andere gegevens waarmee een leerling wordt geïdentificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel132
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel133
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '131'
        hoofdstuk: I
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '132'
        hoofdstuk: I
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0030280
        artikel: '133'
        hoofdstuk: I
        afdeling: '9'
  - number: '129.1'
    text: |-
      Onverminderd de bevoegdheid van de inspectie op grond van de [Wet op het onderwijstoezicht][ref1] kan Onze Minister
      een onderzoek instellen of doen instellen naar de jaarverslaggeving, naar de gegevens die noodzakelijk zijn voor de
      vaststelling van de bekostiging, naar de rechtmatigheid van de bestedingen en naar de doelmatigheid van het beheer
      van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: '129.2'
    text: |-
      Indien uit een op grond van het eerste lid ingesteld onderzoek blijkt dat de bekostiging voor een school onjuist is
      vastgesteld, kan Onze Minister correcties aanbrengen op de bekostiging.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel129
  - number: '129.3'
    text: |-
      Onze Minister doet het bevoegd gezag schriftelijk mededeling van een besluit tot het aanbrengen van een correctie
      op de bekostiging.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel129
  - number: '129.4'
    text: |-
      Indien uit de jaarverslaggeving, bedoeld in [125, eerste lid][ref1], uit de verklaring van de deskundige,
      bedoeld in 125, vierde lid, of uit een op grond van het eerste lid ingesteld onderzoek blijkt dat de bekostiging
      voor een school onrechtmatig is besteed of evident ondoelmatig is aangewend, kan Onze Minister bepalen dat het
      desbetreffende gedeelte van de bekostiging niet ten laste komt van het Rijk of dat de daarmee gemoeide bedragen in
      mindering worden gebracht op de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel125
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '125'
        hoofdstuk: I
        afdeling: '8'
  - number: '129.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de wijze waarop wordt vastgesteld
      dat sprake is van evident ondoelmatige aanwending van de bekostiging als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel129
  - number: '129.6'
    text: |-
      De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel129
  - number: '129.7'
    text: |-
      Een in het tweede lid bedoelde correctie wordt indien de correctie strekt tot verhoging van de bekostiging, binnen
      acht weken na de mededeling, bedoeld in het derde lid, door Onze Minister betaald.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel129
  - number: '140.1'
    text: |-
      Met het oog op verbetering van de kwaliteit, toegankelijkheid of doelmatigheid van het basisonderwijs kan bij wijze
      van experiment bij algemene maatregel van bestuur worden afgeweken van [hoofdstuk I, titel I, artikelen 1][ref1]
      en [2][ref2], [titel II, afdeling 1][ref3] en [afdeling 2][ref4], [artikelen 53][ref5] en [54][ref6] en
      [titel III, afdelingen 1][ref7], [2][ref8], [4 tot en met 6][ref9] en 7, paragraaf 1 van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
      [ref4]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
      [ref5]: https://wetten.overheid.nl/BWBR0030280#Artikel53
      [ref6]: https://wetten.overheid.nl/BWBR0030280#Artikel54
      [ref7]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
      [ref8]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
      [ref9]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0030280
        hoofdstuk: I
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0030280
        hoofdstuk: I
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0030280
        artikel: '53'
        hoofdstuk: I
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0030280
        artikel: '54'
        hoofdstuk: I
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0030280
        hoofdstuk: I
        afdeling: '1'
      - id: ref8
        bwb_id: BWBR0030280
        hoofdstuk: I
        afdeling: '2'
      - id: ref9
        bwb_id: BWBR0030280
        hoofdstuk: I
        afdeling: '4'
  - number: '140.2'
    text: 'In geval van toepassing van het eerste lid wordt bij algemene maatregel van bestuur in elk geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel140
  - number: 140.2.a
    text: het doel van het experiment,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel140
  - number: 140.2.b
    text: op welke wijze van welke in het eerste lid bedoelde voorschriften wordt afgeweken,
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel140
  - number: 140.2.c
    text: de duur van het experiment, en
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel140
  - number: 140.2.d
    text: op welke wijze en aan de hand van welke criteria de met het experiment beoogde effecten worden geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel140
  - number: '140.3'
    text: Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van een experiment.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel140
  - number: '140.4'
    text: |-
      Een experiment duurt ten hoogste zes jaar, tenzij een langere duur gezien de bijzondere aard van het experiment
      noodzakelijk is. Alsdan wordt de duur van het experiment op ten hoogste acht jaar bepaald. Indien een voorstel
      van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele wettelijke regeling,
      voordat een experiment is afgelopen, kan Onze Minister het experiment verlengen tot het tijdstip waarop het
      wetsvoorstel tot wet is verheven en in werking treedt.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel140
  - number: '140.5'
    text: |-
      Onze Minister zendt drie maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur als
      bedoeld in het eerste lid aan de Staten-Generaal, een verslag over de doeltreffendheid en de effecten van het
      experiment in de praktijk, evenals een standpunt over de voortzetting van die algemene maatregel van bestuur,
      anders dan een voortzetting als experiment.
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel140
  - number: '140.6'
    text: |-
      In verband met een experiment als bedoeld in het eerste lid, kan bij algemene maatregel van bestuur eveneens bij
      wijze van experiment worden afgeweken van [artikel 1 van de Leerplichtwet BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel1
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '1'
  - number: '140.7'
    text: |-
      Dit artikel is van overeenkomstige toepassing op een samenwerkingsverband van een school met een school als bedoeld
      in [artikel 1][ref1], of een school als bedoeld in de [Wet voortgezet onderwijs 2020][ref2]. Bij samenwerking met
      een school als bedoeld in de Wet voortgezet onderwijs 2020 kan worden afgeweken van de Wet voortgezet onderwijs
      2020, met uitzondering van [hoofdstuk 3][ref3], [paragrafen 7][ref4] en [10][ref5], de [hoofdstukken 4][ref6],
      [6][ref7] en [9][ref8], en [hoofdstuk 11][ref9], [paragrafen 4][ref10] en [6][ref11], van die wet. Bij de
      algemene maatregel van bestuur, bedoeld in het tweede lid, wordt geregeld welke bij of krachtens de wet, of de
      Wet voortgezet onderwijs 2020 vastgestelde voorschriften van toepassing of van overeenkomstige toepassing zijn op
      de samenwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0044212
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Hoofdstuk3
