  - number: '149.1'
    text: |-
      Onverminderd [artikel 3, eerste lid, onderdelen a en c][ref1], mogen in afwijking van artikel 3, eerste lid,
      onderdeel b, en [artikel 34, vijfde lid][ref2], degenen die geen getuigschrift bezitten als bedoeld in artikel 3,
      eerste lid, onderdeel b, onder 1°, maar wel voor het tijdstip van de inwerkingtreding van dit artikel een opleiding
      begonnen zijn die leidt tot een bewijs van bekwaamheid tot het geven van onderwijs in de eerste cyclus als bedoeld
      in de Landsverordening funderend onderwijs of de Wet primair onderwijs BES zoals die wet op 10 oktober 2010 is
      komen te luiden, gedurende een periode van vijf jaar na het tijdstip van de inwerkingtreding van dit artikel, met
      dit bewijs van bekwaamheid worden benoemd of tewerkgesteld worden zonder benoeming tot leraar in de groepen één tot
      en met vier.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel34
    url: https://wetten.overheid.nl/BWBR0030280/2023-08-01#Artikel149
