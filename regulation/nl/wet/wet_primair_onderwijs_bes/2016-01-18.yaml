    text: |-
      Bij eilandsverordening worden regels gegeven met betrekking tot het verstrekken van voeding en kleding aan
      alsmede het mogelijk maken van vervoer naar en van school voor leerlingen die zonder deze voorzieningen
      redelijkerwijs niet in staat zouden zijn de school geregeld te bezoeken als bedoeld in de [artikelen 6][ref1] en
      [7 van de Leerplichtwet BES][ref2].


