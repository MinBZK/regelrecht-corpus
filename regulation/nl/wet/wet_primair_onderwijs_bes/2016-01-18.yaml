        paragraaf: '3'
        afdeling: '1'
  - number: '160'
    text: |-
      Een openbaar orgaan als bedoeld in artikel 35 van de Wet primair onderwijs BES zoals die wet op 10 oktober 2010 is
      komen te luiden, wordt aangemerkt als een openbare rechtspersoon als bedoeld in [artikel 53][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel53
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '53'
        hoofdstuk: I
        afdeling: '2'
  - number: '161'
    text: |-
      De aanspraak op bekostiging van een school die direct voorafgaand aan de inwerkingtreding van [artikel 72][ref1]
      werd bekostigd op grond van de Wet primair onderwijs BES zoals die wet op 10 oktober 2010 is komen te luiden,
      berust vanaf de inwerkingtreding van [artikel 72][ref2] op [hoofdstuk I, titel III][ref3] en op hoofdstuk II.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel161
    references:
