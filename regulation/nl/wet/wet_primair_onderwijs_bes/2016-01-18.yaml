  - number: '1'
    text: |-
      In deze wet wordt verstaan onder: **basisregister onderwijs**: een basisregister onderwijs als bedoeld in
      [artikel 24b van de Wet op het onderwijstoezicht][ref1]; **bevoegd gezag**: voor wat betreft a. een openbare
      school: 1°. het bestuurscollege van het betreffende openbaar lichaam, voor zover de eilandsraad niet anders
      bepaalt, en, indien de eilandsraad dit besluit, met inachtneming van door hem te stellen regelen; 2°. de openbare
      rechtspersoon, bedoeld in [artikel 53][ref2]; dan wel 3°. de stichting, bedoeld in [artikel 54][ref3]; b. een
      bijzondere school: de rechtspersoon, bedoeld in [artikel 60][ref4]; **bijzondere school**: een door een natuurlijk
      persoon of een privaatrechtelijke rechtspersoon, niet zijnde een stichting als bedoeld in [artikel 54][ref5], in
      stand gehouden school; **deelnemers**: deelnemers als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref6];
      **expertisecentrum onderwijszorg**: de rechtspersoon, bedoeld in [artikel 28, eerste lid][ref7]; **inspectie of
      inspecteur**: de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref8], voor zover belast met taken op het
      gebied van het basisonderwijs; **Onderwijsraad**: de Onderwijsraad, bedoeld in de [Wet op de Onderwijsraad][ref9];
      **Onze Minister**: Onze Minister van Onderwijs, Cultuur en Wetenschap; **openbaar lichaam**: het openbaar lichaam
      Bonaire, Sint Eustatius of Saba; **openbare rechtspersoon**: een rechtspersoon die krachtens publiekrecht is
      ingesteld als bedoeld in [artikel 53][ref10]; **openbare school**: a. een door een openbaar lichaam, al dan niet
      tezamen met een of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid in stand gehouden school;
      b. een door een openbare rechtspersoon als bedoeld in [artikel 53][ref11] in stand gehouden school; dan wel c.
      een door een stichting als bedoeld in [artikel 54][ref12] in stand gehouden school; **ouders**: ouders, voogden
      of verzorgers; **personeel**: a. de benoemde directeur, het personeel benoemd in een functie voor het geven van
      onderwijs, het personeel benoemd in een andere functie dan het geven van onderwijs, of het personeel dat is benoemd
      voor het verrichten van werkzaamheden ten behoeve van meer dan een school, waaronder begrepen de leden van het
      bestuur van die scholen die zijn benoemd door een raad van toezicht als bedoeld in [artikel 25, derde lid][ref13],
      voor zover die leden mede zijn benoemd op basis van een arbeidsovereenkomst of een schriftelijke aanstelling;
      b. het onder a bedoelde personeel dat zonder benoeming is tewerkgesteld, tenzij het betreft de toepassing van de
      [artikelen 37][ref14], [39][ref15], [40][ref16], [58][ref17], [64][ref18] en [111][ref19], voor zover niet anders
      is bepaald, en de toepassing van daarmee verband houdende wettelijke bepalingen; **persoonsgebonden nummer BES**:
      het administratienummer van de leerling, dan wel het door Onze Minister uitgegeven onderwijsnummer, bedoeld in
      [artikel 46, vierde lid][ref20]; **Rijksvertegenwoordiger**: Rijksvertegenwoordiger voor de openbare lichamen
      Bonaire, Sint Eustatius en Saba; **school**: een school waar basisonderwijs wordt gegeven; **school voor voortgezet
      onderwijs**: een school voor voortgezet onderwijs als bedoeld in de [Wet voortgezet onderwijs BES][ref21];
      **schooljaar**: het tijdvak van 1 augustus tot en met 31 juli daaraanvolgend.


