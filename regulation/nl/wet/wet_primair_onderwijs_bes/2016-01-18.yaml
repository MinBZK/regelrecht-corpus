        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0030280
        hoofdstuk: I
  - number: '162.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven over de vaststelling door het bevoegd
      gezag van een begroting en de inrichting daarvan.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel162
  - number: '162.2'
    text: Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel162
  - number: '163'
    text: |-
      Tot de datum van inwerkingtreding van [artikel 76, derde lid][ref1], is een aanvraag om een besluit als
      bedoeld in artikel 76, eerste of tweede lid, met redenen omkleed en gaat vergezeld van de gegevens, genoemd in
      [artikel 72, tweede lid][ref2]. Onze Minister willigt de aanvraag om een besluit als bedoeld in artikel 76, eerste
      lid, slechts in, ingeval:


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel72
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '76'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 163.a
    text: |-
      de school bij toepassing van [artikel 72, derde lid][ref1], door hem in aanmerking zou worden gebracht voor
      bekostiging,


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 163.b
    text: |-
      indien op de onder a genoemde grond geen bekostiging zou kunnen worden verstrekt en het een omzetting in een
      openbare school of een uitbreiding met openbaar onderwijs betreft, binnen 10 kilometer van de plaats in het
      openbaar lichaam waar het onderwijs moet worden gegeven over de weg gemeten geen school aanwezig is waarbinnen
      openbaar onderwijs wordt gegeven en aan het volgen van openbaar onderwijs behoefte bestaat, of
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel163
  - number: 163.c
    text: |-
      de bekostiging van de school, indien daaraan het onderwijs wordt uitgebreid met openbaar onderwijs of met
      onderwijs van een of meer richtingen, van uitsluitend een of meer op te heffen scholen, met inachtneming van
      [artikel 122, eerste lid][ref1], gedurende ten minste 20 achtereenvolgende jaren zou kunnen worden voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel122
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '122'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '8'
  - number: '164.1'
    text: |-
      Tot de datum van inwerkingtreding van [artikel 101][ref1] wordt voor de bekostiging van personeel een bedrag per
      leerling toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel101
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '101'
        hoofdstuk: I
        afdeling: '5'
  - number: '164.2'
    text: 'Het bedrag, bedoeld in het eerste lid, kan in elk geval verschillend worden vastgesteld voor leerlingen:'
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel164
  - number: 164.2.a
    text: van een school in de leeftijd van 4 tot en met 7 jaar, en
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel164
  - number: 164.2.b
    text: van een school in de leeftijd van 8 jaar en ouder.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel164
  - number: '164.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald in welke gevallen en onder welke voorwaarden aanvullende
      bekostiging voor personeelskosten kan worden toegekend. In ieder geval wordt aanvullende bekostiging toegekend voor
      kleine scholen, schoolleiding en de bestrijding van onderwijsachterstanden. De omvang van de aanvullende vergoeding
      wordt bij of krachtens algemene maatregel van bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel164
  - number: '164.4'
    text: Bij ministeriële regeling wordt het bedrag, bedoeld in het eerste lid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel164
  - number: '164.5'
    text: |-
      De bekostiging, bedoeld in het eerste lid, en de bekostiging voor kleine scholen, schoolleiding en de bestrijding
      van onderwijsachterstanden, bedoeld in de tweede volzin van het derde lid, is redelijkerwijs voldoende voor het
      leiden en beheren van de school, voor het geven van onderwijs aan de school en voor de overige werkzaamheden die
      verband houden met het onderwijs aan de school.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel164
  - number: '164.6'
    text: |-
      Tot de datum van inwerkingtreding van [artikel 101][ref1] worden verwijzingen naar artikel 101 gelezen als
      verwijzingen naar [artikel 164][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel164
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '101'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '164'
        hoofdstuk: II
  - number: '165'
    text: |-
      Tot de datum van inwerkingtreding van [artikel 102, derde lid][ref1], geldt dat voor de toepassing van
      [artikel 101, eerste lid][ref2], ingeval van samenvoeging van scholen het aantal leerlingen van alle bij de
      samenvoeging betrokken scholen, voor elke school wordt vastgesteld volgens het eerste lid van artikel 102.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel101
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '102'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '101'
        hoofdstuk: I
        afdeling: '5'
  - number: '166'
    text: |-
      Tot de datum van inwerkingtreding van [artikel 105, eerste lid][ref1], wordt bij ministeriële regeling de
      grondslag vastgesteld voor de omvang van de bekostiging voor personeels- en arbeidsmarktbeleid. Deze grondslag kan
      verschillend worden vastgesteld voor scholen en voor groepen van scholen. De omvang van de bekostiging is in ieder
      geval afhankelijk of mede afhankelijk van het aantal leerlingen op de teldatum, bedoeld in [artikel 102][ref2], en
      de samenstelling van het leerlingenbestand.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel102
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '105'
        hoofdstuk: I
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '102'
        hoofdstuk: I
        afdeling: '5'
  - number: '167.1'
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip zendt het bevoegd gezag voor 15 oktober volgend op de teldatum
      1 oktober aan Onze Minister een opgave van het aantal leerlingen. Indien deze opgave niet voor die datum wordt
      gedaan, stelt Onze Minister het aantal leerlingen, indien die gegevens voor de voortzetting of beëindiging van de
      bekostiging onderscheidenlijk de opheffing of instandhouding van een school noodzakelijk zijn, ambtshalve vast.
      Een opgave van het aantal leerlingen op of na 15 oktober aan Onze Minister heeft geen invloed op het ambtshalve
      vastgestelde aantal leerlingen voor zover het betreft het al of niet beëindigen van de bekostiging van een
      bijzondere school of de opheffing of instandhouding van een openbare school.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel167
  - number: '167.2'
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip wijst Onze Minister het bevoegd gezag voorafgaand aan de
      teldatum 1 oktober op de verplichting, bedoeld in de eerste volzin van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel167
  - number: 167a.1
    text: |-
      In afwijking van de [artikelen 78 tot en met 84][ref1] en met overeenkomstige toepassing van [artikel 87][ref2]
      gelden voor de jaren 2011 tot en met 2017 de voorschriften van het tweede tot en met zevende lid voor de
      voorziening in de huisvesting van uit 's Rijks kas bekostigde scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel87
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel167a
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '78'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '87'
        hoofdstuk: I
        afdeling: '3'
  - number: 167a.2
    text: |-
      Onze Minister en het bestuurscollege van het openbaar lichaam zijn voor de jaren 2011 tot en met 2017 gezamenlijk
      verantwoordelijk voor de huisvesting van uit ’s Rijks kas bekostigde scholen alsmede voor de financiering daarvan.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel167a
  - number: 167a.3
    text: |-
      Onze Minister en het bestuurscollege van het openbaar lichaam sluiten ter invulling van de gezamenlijke
      verantwoordelijkheid, bedoeld in het tweede lid, namens de Staat der Nederlanden onderscheidenlijk namens het
      betreffende openbaar lichaam, een of meer convenanten.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel167a
  - number: 167a.4
    text: |-
      Overeenkomstig het convenant of de convenanten, bedoeld in het derde lid, stelt Onze Minister voor elk van de
      openbare lichamen een plan vast, waarin de voornemens op het terrein van de huisvesting, bedoeld in het tweede lid,
      alsmede de financiering daarvan, op hoofdlijnen worden beschreven.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel167a
  - number: 167a.5
    text: |-
      Onze Minister stelt de plannen, bedoeld in het vierde lid, vast in overeenstemming met het bestuurscollege van het
      openbaar lichaam en na overleg met de betreffende bevoegde gezagsorganen van de scholen.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel167a
  - number: 167a.6
    text: |-
      Onze Minister kan een of meer plannen, bedoeld in het vierde lid, in overeenstemming met het bestuurscollege van
      het betreffende openbaar lichaam, wijzigen.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel167a
  - number: 167a.7
    text: |-
      De plannen dan wel een wijziging daarvan, worden aan de betrokken bevoegde gezagsorganen van de scholen en in de
      Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel167a
  - number: 167b
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip blijven de bepalingen van de Wet primair onderwijs BES zoals
      die is komen te luiden op 10 oktober 2010, van kracht voor zover de regeling van de daarin opgenomen onderwerpen
      niet is vervangen door de inwerkingtreding van overeenkomstige onderwerpen in deze wet. De vorige volzin is niet
      van toepassing op de onderwerpen geregeld in de [artikelen 14][ref1], [16][ref2] en [18][ref3] van de Wet primair
      onderwijs BES zoals die is komen te luiden op 10 oktober 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel18
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel167b
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '14'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0030280
        artikel: '18'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: 167ba
    text: |-
      Op het tijdstip waarop [artikel 16][ref1] in werking treedt, vervalt het tweede lid van [artikel 44][ref2], onder
      vernummering van het derde tot en met het vijfde lid tot tweede tot en met vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel44
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel167ba
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '16'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '44'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: 167c
    text: |-
      De artikelen die niet bij Besluit van 3 februari 2011, houdende vaststelling van het tijdstip van inwerkingtreding
      van een aantal onderdelen van de Aanpassingswet openbare lichamen Bonaire, Sint Eustatius en Saba (Stb. 2011, 34)
      in werking zijn getreden, treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan, verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel167c
  - number: '168'
    text: 'Deze wet wordt aangehaald als: Wet primair onderwijs BES.'
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel168
