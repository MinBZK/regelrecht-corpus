        bwb_id: BWBR0030280
        artikel: '35'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 3.2.b
    text: |-
      in het bezit is van een bij ministeriële regeling aangewezen getuigschrift dat specifiek is gericht op de
      bekwaamheid tot het geven van dat onderwijs, of onderwijs volgt ter verkrijging van een dergelijk getuigschrift,
      in welk laatste geval betrokkene het onderwijs in deze onderwijsactiviteit mag geven gedurende ten hoogste twee
      aaneengesloten schooljaren, gerekend vanaf het moment waarop betrokkene het onderwijs ter verkrijging van dit
      getuigschrift voor de eerste maal volgt.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister kan aan personen die in het bezit zijn van een buiten Nederland behaald bewijsstuk waarmee
      de bekwaamheid wordt aangetoond, de bevoegdheid tot het geven van schoolonderwijs verlenen. Hij kan daarbij
      voorwaarden en beperkingen stellen.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel3
  - number: '3.4'
    text: |-
      Ten aanzien van studenten die een duale opleiding volgen als bedoeld in
      [artikel 7.7 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] leidend tot een getuigschrift
      als bedoeld in het eerste lid, onder b.1°, en aan die opleiding ten minste 180 studiepunten hebben behaald, kan
      worden afgeweken van de eisen in het eerste lid onder b, met dien verstande dat het tijdelijk dienstverband van de
      student een periode beslaat die overeenkomt met een volledig dienstverband van vijf maanden. De vorige volzin is
      van overeenkomstige toepassing ten aanzien van studenten die ten minste 166 doch nog geen 180 studiepunten hebben
      behaald, indien door de desbetreffende hogeschool wordt verklaard dat de student beschikt over met 180 studiepunten
      vergelijkbare en tevens voor het dienstverband relevante kennis, inzicht en vaardigheden. De toepassing van de
      vorige volzin vervalt ten aanzien van die student die niet binnen vier weken na aanvang van het dienstverband over
      180 studiepunten beschikt. De in artikel 7.7, vijfde lid, van de Wet op het hoger onderwijs en wetenschappelijk
      onderzoek bedoelde overeenkomst vermeldt tevens de leraar onder wiens verantwoordelijkheid de betrokken student
      werkzaamheden van onderwijskundige aard verricht.


