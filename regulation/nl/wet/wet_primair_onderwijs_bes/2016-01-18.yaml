  - number: '3.2'
    text: |-
      Het onderwijs in de onderwijsactiviteit zintuiglijke en lichamelijke oefening in het derde tot en met achtste
      schooljaar kan in afwijking van het eerste lid, onderdeel b. 1°, behalve door degene die beschikt over een in dat
      onderdeel b. 1° bedoeld getuigschrift waaruit blijkt dat wordt voldaan aan de bekwaamheidseisen voor het geven van
      lichamelijke opvoeding in het voortgezet onderwijs, uitsluitend worden gegeven door degene die:
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel3
  - number: 3.2.a
    text: |-
      beschikt over een in dat onderdeel b. 1° bedoeld getuigschrift waaruit blijkt dat wordt voldaan aan de
      bekwaamheidseisen die zijn vastgesteld krachtens [artikel 35, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel35
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel3
    references:
