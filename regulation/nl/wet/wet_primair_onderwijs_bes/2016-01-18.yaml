  - number: 145a.2
    text: 'In geval van toepassing van het eerste lid wordt bij algemene maatregel van bestuur in elk geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel145a
  - number: 145a.2.a
    text: het doel van het experiment,
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel145a
  - number: 145a.2.b
    text: op welke wijze van welke in het eerste lid bedoelde voorschriften wordt afgeweken,
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel145a
  - number: 145a.2.c
    text: de duur van het experiment, en
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel145a
  - number: 145a.2.d
    text: op welke wijze en aan de hand van welke criteria de met het experiment beoogde effecten worden geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel145a
  - number: 145a.3
    text: Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van een experiment.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel145a
  - number: 145a.4
    text: |-
      Een experiment duurt ten hoogste zes jaar, tenzij een langere duur gezien de bijzondere aard van het experiment
      noodzakelijk is. Alsdan wordt de duur van het experiment op ten hoogste acht jaar bepaald. Indien een voorstel
      van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele wettelijke regeling,
      voordat een experiment is afgelopen, kan Onze Minister het experiment verlengen tot het tijdstip waarop het
      wetsvoorstel tot wet is verheven en in werking treedt.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel145a
  - number: 145a.5
    text: |-
      Onze Minister zendt drie maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur als
      bedoeld in het eerste lid aan de Staten-Generaal, een verslag over de doeltreffendheid en de effecten van het
      experiment in de praktijk, evenals een standpunt over de voortzetting van die algemene maatregel van bestuur,
      anders dan een voortzetting als experiment.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel145a
  - number: 145a.6
    text: |-
      In verband met een experiment als bedoeld in het eerste lid, kan bij algemene maatregel van bestuur eveneens bij
      wijze van experiment worden afgeweken van [artikel 1 van de Leerplichtwet BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel1
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel145a
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '1'
  - number: 145a.7
    text: |-
      Dit artikel is van overeenkomstige toepassing op een samenwerkingsverband van een school met een school
      als bedoeld in [artikel 1][ref1], of een school als bedoeld in de [Wet voortgezet onderwijs BES][ref2].
      Bij samenwerking met een school als bedoeld in de Wet voortgezet onderwijs BES kan worden afgeweken van
      [titel II, afdeling I, hoofdstuk I][ref3] en [titel III, afdeling III van de Wet voortgezet onderwijs BES][ref4].
      Bij de algemene maatregel van bestuur, bedoeld in het tweede lid, wordt geregeld welke bij of krachtens de wet, of
      de Wet voortgezet onderwijs BES vastgestelde voorschriften van toepassing of van overeenkomstige toepassing zijn op
      de samenwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030284
      [ref3]: https://wetten.overheid.nl/BWBR0030284#HoofdstukI
      [ref4]: https://wetten.overheid.nl/BWBR0030284#AfdelingIII
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel145a
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0030284
      - id: ref3
        bwb_id: BWBR0030284
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0030284
        afdeling: III
  - number: '146.1'
    text: |-
      Onze Minister kan bepalen dat geen of slechts een gedeeltelijke bekostiging wordt verstrekt voor uitgaven die het
      gevolg zijn van schuld of nalatigheid van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel146
  - number: '146.2'
    text: |-
      Indien de uitgaven bedoeld in het eerste lid, voor bekostiging door het Rijk in aanmerking komen, treedt het Rijk
      op het moment van een uitdrukkelijk besluit tot bekostiging in alle rechten die het bevoegd gezag ter zake tegen
      derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel146
  - number: '146.3'
    text: |-
      Indien het openbaar lichaam een collectieve verzekering heeft afgesloten voor de vergoeding van schade, ontstaan
      aan gebouwen, terreinen of roerende zaken van een niet door het openbaar lichaam in stand gehouden school, heeft
      het bevoegd gezag van de desbetreffende school jegens het openbaar lichaam geen aanspraak op vergoeding van
      dergelijke schade, voor zover die collectieve verzekering de schade dekt.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel146
  - number: '146.4'
    text: |-
      Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een niet door het openbaar lichaam in stand
      gehouden school voor vergoeding door het openbaar lichaam in aanmerking komt, treedt het openbaar lichaam op het
      moment van een uitdrukkelijk besluit tot vergoeding in alle rechten die het bevoegd gezag ter zake van die schade
      tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel146
  - number: '151.1'
    text: |-
      Indien een bij of krachtens de wet gestelde termijn door het bevoegd gezag wordt overschreden en het openbaar
      lichaam daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum
      bekostiging van het Rijk voor de materiële instandhouding ontvangt dan het geval zou zijn geweest indien deze
      termijn wel in acht was genomen, vergoedt het bevoegd gezag de door het openbaar lichaam geleden schade.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel151
  - number: '151.2'
    text: |-
      Indien een bij of krachtens de wet gestelde termijn door het bestuurscollege wordt overschreden en het bevoegd
      gezag daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum
      bekostiging van het Rijk voor de materiële instandhouding ontvangt dan het geval zou zijn geweest indien deze
      termijn wel in acht was genomen, vergoedt het openbaar lichaam de door het bevoegd gezag geleden schade.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel151
  - number: '151.3'
    text: |-
      Het bestuurscollege en het bevoegd gezag kunnen in onderling overleg de in het eerste en tweede lid
      bedoelde verplichting tot schadevergoeding matigen. Indien dit overleg niet tot overeenstemming leidt, is
      [artikel 106 van Boek 6 van het Burgerlijk Wetboek BES][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel106
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '106'
  - number: '152'
    text: |-
      Het bevoegd gezag van een bijzondere school is verplicht de uit de overheidskassen ontvangen gelden overeenkomstig
      de bestemming te gebruiken. Van de inkomsten en uitgaven wordt volgens bij algemene maatregel van bestuur te geven
      voorschriften nauwkeurig boekgehouden.
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel152
  - number: '153'
    text: |-
      Een beslissing als bedoeld in de [artikelen 41, derde lid][ref1], en [44, eerste lid][ref2],
      van een bevoegd gezag van een openbare school geldt als een beschikking als bedoeld in
      [artikel 3 van de Wet administratieve rechtspraak BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Artikel3
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '41'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '44'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0028455
        artikel: '3'
  - number: '154.1'
    text: |-
      In afwijking van [artikel 3, eerste lid][ref1], en [artikel 34, vijfde lid][ref2], mag basisonderwijs in de
      groepen één tot en met vier tevens gegeven worden door degenen die op de dag voorafgaand aan het tijdstip van
      de inwerkingtreding van dit artikel, bevoegd waren tot het geven van basisonderwijs in de eerste cyclus en dit
      onderwijs gaven op een van de scholen in de openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel34
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '34'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '154.2'
    text: |-
      In afwijking van [artikel 3, eerste lid][ref1], en [artikel 34, vijfde lid][ref2], mag basisonderwijs tevens
      gegeven worden door degenen die op de dag voorafgaand aan het tijdstip van de inwerkingtreding van dit artikel,
      bevoegd waren tot het geven van basisonderwijs in de tweede cyclus en dit onderwijs gaven op een van de scholen in
      de openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel34
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '34'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '155'
    text: |-
      In afwijking van [artikel 3, eerste lid][ref1], en [artikel 34, vijfde lid][ref2], mag gedurende een periode
      van vijf jaar na het tijdstip van de inwerkingtreding van dit artikel, basisonderwijs tevens gegeven worden door
      degenen die voor dat tijdstip basisonderwijs gaven op een van de scholen in de openbare lichamen zonder daartoe
      bevoegd te zijn mits zij binnen zes maanden na dat tijdstip in het bezit zijn van een verklaring omtrent het
      gedrag, afgegeven volgens de Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES, die op
      het tijdstip van overlegging aan het bevoegd gezag niet ouder is dan zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel34
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '34'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '156.1'
    text: |-
      Onverminderd [artikel 3, eerste lid, onderdelen a en c][ref1], mogen in afwijking van artikel 3, eerste lid,
      onderdeel b, en [artikel 34, vijfde lid][ref2], degenen die geen getuigschrift bezitten als bedoeld in artikel 3,
      eerste lid, onderdeel b, onder 1°, maar wel voor het tijdstip van de inwerkingtreding van dit artikel een opleiding
      begonnen zijn die leidt tot een bewijs van bekwaamheid tot het geven van onderwijs in de eerste cyclus als bedoeld
      in de Landsverordening funderend onderwijs of de Wet primair onderwijs BES zoals die wet op 10 oktober 2010 is
      komen te luiden, gedurende een periode van vijf jaar na het tijdstip van de inwerkingtreding van dit artikel, met
      dit bewijs van bekwaamheid worden benoemd of tewerkgesteld worden zonder benoeming tot leraar in de groepen één tot
      en met vier.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel34
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '34'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '156.2'
    text: |-
      Onverminderd [artikel 3, eerste lid, onderdelen a en c][ref1], mogen in afwijking van artikel 3, eerste lid,
      onderdeel b, en [artikel 34, vijfde lid][ref2], degenen die geen getuigschrift als bedoeld in artikel 3, eerste
      lid, onderdeel b, onder 1°, maar wel voor het tijdstip van de inwerkingtreding van dit artikel een opleiding
      begonnen zijn die leidt tot een bewijs van bekwaamheid tot het geven van onderwijs in de tweede cyclus als
      bedoeld in de landsverordening funderend onderwijs gedurende een periode van vijf jaar na het tijdstip van de
      inwerkingtreding van dit artikel, met dit bewijs van bekwaamheid worden benoemd tot leraar.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel34
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '34'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '157'
    text: |-
      In afwijking van [artikel 3, tweede lid][ref1], kunnen degenen die op de dag voorafgaand aan het tijdstip van de
      inwerkingtreding van dit artikel, werkzaam waren op een van de scholen voor basisonderwijs in de openbare lichamen,
      het onderwijs in de onderwijsactiviteit zintuiglijke en lichamelijke oefening in het eerste tot en met achtste
      schooljaar geven.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel3
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '3'
        hoofdstuk: I
  - number: '158'
    text: |-
      In afwijking van [artikel 4, eerste lid][ref1], mogen onderwijsondersteunende werkzaamheden als bedoeld in
      [artikel 35, derde lid][ref2], ook worden verricht door degene die op de dag voorafgaand aan het tijdstip van de
      inwerkingtreding van dit artikel, deze onderwijsondersteunende werkzaamheden verrichtte op een van de scholen in de
      openbare lichamen en daartoe bevoegd waren.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel35
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '35'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '159'
    text: |-
      In afwijking van [artikel 4, eerste lid][ref1], mogen gedurende een periode van vijf jaar na het
      tijdstip van de inwerkingtreding van dit artikel, onderwijsondersteunende werkzaamheden als bedoeld in
      [artikel 35, derde lid][ref2], ook worden verricht door degenen die op de dag voorafgaand aan het tijdstip van
      de inwerkingtreding van dit artikel, deze werkzaamheden verrichtten op een van de scholen in de openbare lichamen
      zonder daartoe bevoegd te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel35
    url: https://wetten.overheid.nl/BWBR0030280/2016-01-18#Artikel159
    references:
