  - number: '8'
    text: |-
      1 Indien het bevoegd gezag een redelijk vermoeden heeft dat zich binnen de sfeer van
      een onder diens gezag ressorterende school een misdrijf tegen de zeden als bedoeld in
      [Titel XIV van het Wetboek van Strafrecht BES][ref1] dan wel het misdrijf van zware mishandeling bedoeld in de
      [artikelen 315][ref2] of [316 van dat Wetboek][ref3] heeft voorgedaan jegens of gepleegd door leerlingen, de
      directeur, leerkrachten, overig personeel of anderszins onder diens gezag verkerende personen, dan wel derden,
      doet het daarvan onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 184, eerste lid][ref4],
      of [artikel 185 van het Wetboek van Strafvordering BES][ref5]. In geval van betrokkenheid van leerlingen, de
      directeur, een leerkracht, overig personeel of anderszins onder diens gezag verkerende personen, stelt het bevoegd
      gezag alvorens over te gaan tot het doen van aangifte, de ouders respectievelijk de betreffende betrokkene hiervan
      op de hoogte.

      2 Indien het bevoegd gezag een redelijk vermoeden heeft dat een ten behoeve van zijn school met
      taken belast persoon of een ander persoon zich schuldig heeft gemaakt aan fysiek geweld jegens een
      leerling of jegens een ten behoeve van zijn school met taken belast persoon, doet het bevoegd gezag
      onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 184, eerste lid][ref6], of
      [artikel 185 van het Wetboek van Strafvordering BES][ref7]. Alvorens over te gaan tot het doen van aangifte, stelt
      het bevoegd gezag de ouders van de betrokken leerling, de directeur, onderscheidenlijk de betreffende ten behoeve
      van de school met taken belast persoon hiervan op de hoogte.

      3 Indien een personeelslid, niet zijnde de directeur, een redelijk vermoeden heeft dat een ten behoeve van de
      school met taken belast persoon, niet zijnde de directeur, zich schuldig maakt of heeft gemaakt aan een misdrijf
      als bedoeld in het eerste lid jegens een leerling van de school, stelt het personeelslid de directeur daarvan
      onverwijld in kennis, die op zijn beurt het bevoegd gezag daarvan onverwijld op de hoogte stelt.

      4 Indien een personeelslid een redelijk vermoeden heeft, dat de directeur zich schuldig heeft gemaakt aan een
      misdrijf als bedoeld in het eerste of tweede lid jegens een leerling van de school, stelt het personeelslid het
      bevoegd gezag daarvan onverwijld in kennis.

      5 Indien een personeelslid van mening is dat het bevoegd gezag de verplichtingen ingevolge dit artikel onvoldoende
      heeft nageleefd, stelt deze het bestuurscollege, dan wel, indien het bevoegd gezag het bestuurscollege is, Onze
      Minister, daarvan onverwijld gemotiveerd in kennis.


