        afdeling: '1'
  - number: '13'
    text: >-
      Het bevoegd gezag rapporteert ten minste drie keer per schooljaar schriftelijk over de vorderingen van de
      leerlingen aan hun ouders. De rapportage geschiedt in bewoordingen en in cijfers.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel13
  - number: '14'
    text: >-
      1 Het bevoegd gezag draagt er zorg voor dat er voor elke onder zijn gezag staande school een
      schoolontwikkelingsplan is waarin wordt aangegeven op welke wijze en op welke termijn de school de
      onderscheidenlijke onderwijscomponenten bedoeld in het tweede lid zal realiseren.


      2 Centraal in het schoolontwikkelingsplan staat de beschrijving van het beleid met betrekking tot de kwaliteit
      van het onderwijs dat binnen de school wordt verzorgd. Het begint met een formulering van de missie van de
      school en omvat in elk geval een beschrijving van het personeelsbeleid, het onderwijskundige beleid, waaronder
      het pedagogische en het didactische beleid, en een beschrijving van de onderwijs- en schoolorganisatie en het
      schoolcurriculum.


      3 Bij ministeriële regeling worden regels gegeven ten aanzien van de eisen waaraan het schoolontwikkelingsplan
      dient te voldoen.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel14
  - number: '15'
    text: >-
      1 Het bevoegd gezag stelt ten minste eenmaal in de vier jaar het schoolontwikkelingsplan vast.


      2 Het bevoegd gezag zendt het schoolontwikkelingsplan dan wel de wijzigingen daarvan onmiddellijk na de
      vaststelling aan de inspectie.


      3 Indien de inspectie van oordeel is, dat het schoolontwikkelingsplan niet voldoet aan de bij of krachtens deze
      wet gegeven voorschriften of anderszins gebreken vertoont en het bevoegd gezag wijziging weigert, vraagt zij het
      oordeel van Onze Minister, aan wiens uitspraak het bevoegd gezag zich onderwerpt.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel15
  - number: '16'
    text: |-
      1 Het bevoegd gezag stelt jaarlijks vóór de aanvang van het nieuwe schooljaar de schoolgids vast en zendt deze
      onmiddellijk na de vaststelling aan de inspectie.

      2 De schoolgids bevat voor ouders en leerlingen informatie over de werkwijze van de school en bevat in elk geval
      informatie over:

      a. de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, met dien verstande
      dat bij ministeriële regeling voorschriften kunnen worden gegeven met betrekking tot de wijze waarop:

      1°. de resultaten worden beschreven die met het onderwijsleerproces worden bereikt, en

      2°. de context wordt vermeld waarin de in onderdeel 1° bedoelde resultaten dienen te worden geplaatst;

      b. de wijze waarop in zijn algemeenheid aan de zorg voor de leerlingen wordt vormgegeven;

      c. de wijze waarop aan de zorg voor leerlingen met specifieke onderwijsbehoeften wordt vormgegeven;

      d. de wijze waarop de verplichte onderwijstijd wordt benut;

      e. de geldelijke bijdrage, bedoeld in [artikel 20, eerste lid][ref1], en de vrijwilligheid daarvan;

      f. de rechten en plichten van de ouders, de leerlingen, het personeel en het bevoegd gezag, waaronder de informatie
      over de klachtenregeling, bedoeld in [artikel 18][ref2], de gronden voor ontheffing van het onderwijs, bedoeld in
      [artikel 22, tweede lid][ref3], en de nascholing;

      g. de wijze waarop het bevoegd gezag omgaat met de in[ artikel 14, tweede lid][ref4], omschreven bijdragen, en

      h. de voor de school geldende instructietaal of instructietalen.

      3 Bij de inschrijving danwel bij de aanvang van het nieuwe schooljaar ontvangen de ouders de voor dat schooljaar
      geldende schoolgids.


