  - number: '12'
    text: |-
      Het bevoegd gezag draagt zorg voor de kwaliteit van het onderwijs op de school. Onder zorg dragen voor de kwaliteit
      van het onderwijs wordt in elk geval verstaan: het uitvoeren van het in het schoolontwikkelingsplan, bedoeld in
      [artikel 14][ref1], beschreven beleid op een zodanige wijze dat de wettelijke opdrachten voor het onderwijs en
      de door het bevoegd gezag in het schoolontwikkelingsplan opgenomen eigen opdrachten voor het onderwijs, worden
      gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028735#Artikel14
