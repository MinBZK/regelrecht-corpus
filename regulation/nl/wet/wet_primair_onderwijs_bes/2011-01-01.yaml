  - number: '1'
    text: |-
      Deze wet verstaat onder:

      - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
      - *school:* school voor funderend onderwijs;
      - *school voor speciaal funderend onderwijs:* school voor onderwijs aan kinderen die vanwege een zintuiglijke,
      lichamelijke of geestelijke tekortkoming of vanwege hun gedrag aangewezen zijn op speciale voorzieningen en
      specialistische opvang die het reguliere onderwijs niet kan bieden;
      - *openbare school:* door een openbaar lichaam dan wel een openbaar orgaan als bedoeld in [artikel 35][ref1], in
      stand gehouden school;
      - *bijzondere school:* door een natuurlijke persoon of door een privaatrechtelijke rechtspersoon in stand gehouden
      school;
      - *bevoegd gezag: voor wat betreft:* 1°. een openbare school: 1. het bestuurscollege van het desbetreffende
      openbaar lichaam of 2. het openbaar orgaan, bedoeld in [artikel 35][ref2]; 2°. een bijzondere school: het
      schoolbestuur;
      - *eerste cyclus:* een leerperiode van vier jaren waarmee het funderend onderwijs aanvangt;
      - *tweede cyclus:* een leerperiode van vier jaren volgend op de eerste cyclus van het funderend onderwijs;
      - *ouders:* de ouders of voogden, dan wel bij ontstentenis daarvan de verzorgers van de leerling;
      - *schooljaar:* het tijdvak van 1 augustus tot en met 31 juli daaraanvolgend;
      - *nascholing:* een vorm van scholing, gegeven aan leden van het personeel van een school voor funderend onderwijs
      om hun kennis, inzicht, vaardigheden en beroepshoudingen direct verband houdend met de uitoefening van hun beroep,
      voortbouwend op de in de genoten opleiding verworven aanvangsbekwaamheid te verdiepen en uit te breiden;
      - *instructietaal:* de taal waarin de leerlingen in de te beheersen leerstof worden onderwezen;
      - *talenonderwijs:* het onderwijs dat betrekking heeft op het leren beheersen van de talen die in het curriculum
      van de school zijn opgenomen;
      - *inspectie:* de inspectie, bedoeld in de Wet op het onderwijstoezicht.


