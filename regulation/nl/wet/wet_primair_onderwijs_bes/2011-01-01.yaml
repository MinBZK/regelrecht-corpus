  - number: '7'
    text: |-
      1 Per openbaar lichaam bestaat een onderwijsraad voor funderend onderwijs die, naast het betreffende
      bestuurscollege, Onze Minister adviseert bij voorgenomen wijziging van deze wet en bij het geven van
      toepassing aan de [artikelen 4, tweede lid][ref1], [11, derde lid][ref2], [16, tweede lid onderdeel a][ref3],
      [17, tweede lid][ref4], en [46, vijfde lid][ref5], en waarin zijn vertegenwoordigd:

      a. de bevoegde gezagsorganen die één of meerdere scholen in het betreffende openbaar lichaam in stand houden;

      b. voor zover aanwezig, de vakbond van het personeel of een vertegenwoordiging van het personeel van de scholen in
      het betreffende openbaar lichaam, en

      c. vertegenwoordigers van de ouders van kinderen die in het betreffende openbaar lichaam funderend onderwijs
      volgen, met dien verstande dat ingeval van het bestaan van een hen overkoepelende organisatie, deze organisatie in
      de vertegenwoordiging voorziet.

      Aan genoemde organisaties en organen wordt deze gelegenheid verleend, indien zij naar het oordeel van Onze Minister
      voldoende representatief zijn.

      2 Bij ministeriële regeling wordt geregeld:

      a. de coördinatie van de werkzaamheden van de raad;

      b. het aantal vertegenwoordigers bedoeld in het eerste lid, onder respectievelijk a, b en c;

      c. de besluitvorming binnen de raad;

      d. de wijze waarop de onderwijsraad advies uitbrengt, en

      e. de door Onze Minister te nemen maatregelen om de continuïteit van de adviesfunctie te garanderen in geval van
      ernstige taakverwaarlozing door de raad.

      3 Indien daarover overeenstemming wordt bereikt tussen alle in het eerste lid onderdelen a tot en met c bedoelde
      onderwijsinstanties in de verschillende openbare lichamen, kunnen zij zich organiseren in één gezamenlijke intra-
      eilandelijke onderwijsraad voor funderend onderwijs.

      4 De respectievelijke onderwijsraden voor funderend onderwijs stellen Onze Minister op de hoogte van hun
      samenstelling en plaats van vestiging, met dien verstande dat voor zover de betreffende onderwijsraad niet anders
      beslist, als postadres geldt het adres van het bevoegd gezag van de openbare scholen.

      5 Aan de bestuurscolleges en de eilandelijke onderwijsraden voor funderend onderwijs wordt ten minste twee maanden
      de gelegenheid gegeven Onze Minister van advies te dienen in de gevallen als bedoeld in het eerste lid.

      6 Onze Minister geeft gemotiveerd aan of gevolg wordt gegeven aan het advies en stelt het desbetreffende
      bestuurscollege dan wel de desbetreffende onderwijsraad daarvan schriftelijk in kennis.


