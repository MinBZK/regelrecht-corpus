  - number: '9'
    text: >-
      1 Het onderwijs wordt afgestemd op de voortgang in de ontwikkeling en vorming van de leerlingen en kenmerkt zich
      door flexibele vooruitgang en een grote mate van individualisering door middel van differentiatie in groepsverband.


      2 Het onderwijs richt zich in elk geval op de emotionele, morele en geestelijke ontwikkeling en vorming, en op het
      ontwikkelen van creativiteit, op het verwerven van noodzakelijke kennis, inzicht en attitudes en sociale, culturele
      en lichamelijke vaardigheden.


      3 De scholen voorzien in een leerlingvolgsysteem dat minimaal drie elementen omvat:


      a. het volgen van de ontwikkeling en vorming van de leerling;


      b. het registreren van de onderwijsresultaten, en


      c. het determineren van het niveau van de onderwijsresultaten.


      4 Het onderwijs wordt zodanig ingericht dat:


      a. de leerlingen in de eerste cyclus ten minste 4000 uren onderwijs en in de tweede cyclus ten minste 4400 uren
      onderwijs ontvangen;


      b. de leerlingen binnen een tijdvak van 8 aaneensluitende jaren de school kunnen doorlopen, en


      c. bij een schooltijd van meer dan 2 uren een pauze wordt gehouden van ten minste 15 minuten en tussen de ochtend-
      en middagschooltijd een pauze van ten minste 1 uur.


      5 Het onderwijs kan zodanig worden ingericht dat de leerlingen gezamenlijk in groepen van verschillende opvolgende
      leeftijden, van verschillende ontwikkelingsniveaus of van een combinatie daarvan worden ingedeeld.


      6 Bij ministeriële regeling wordt het aantal vakantiedagen van de leerlingen, de bij die beschikking genoemde
      feestdagen daaronder begrepen, vastgesteld.


      7 Bij eilandsbesluit, houdende algemene maatregelen, worden de begin- en einddata van de vakanties vastgesteld.
      Alvorens over te gaan tot de vaststelling, bedoeld in de eerste volzin, hoort het bestuurscollege de bevoegde
      gezagsorganen.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel9
  - number: '10'
    text: |-
      1 Het bevoegd gezag beslist welke instructietaal of instructietalen in het onderwijs aan de school wordt
      respectievelijk worden gehanteerd, met dien verstande dat deze taal of talen uitsluitend het Engels, het Nederlands
      of het Papiamentu zijn.

      2 Bij de in het eerste lid te nemen beslissing houdt het bevoegd gezag er rekening mee dat met de te hanteren
      voertaal of voertalen redelijkerwijze de kerndoelen, bedoeld in [artikel 11][ref1], kunnen worden bereikt.

      3 Een wijziging in de door de school te hanteren instructietaal of instructietalen kan slechts plaatsvinden met
      ingang van de eerste dag van een schooljaar, mits zulks ten minste zestien maanden daaraan voorafgaand door het
      bevoegd gezag in tenminste twee in het desbetreffende openbaar lichaam verschijnende dagbladen bekend is gemaakt.
      Een dergelijke wijziging kan geen betrekking hebben op de cohorten die op de datum van bekendmaking van die
      wijziging reeds op de school aanwezig waren.

      4 Scholen dragen zorg voor een zo optimaal mogelijke aansluiting van leerlingen met een moedertaal die niet
      overeenkomt met de op de school gehanteerde instructietaal of instructietalen.


      [ref1]: https://wetten.overheid.nl/BWBR0028735#Artikel11
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel10
