  - number: '2'
    text: >-
      1 Het funderend onderwijs is het onderwijs bestemd voor kinderen vanaf 4 jaar. Het legt mede de grondslag voor het
      volgen van voortgezet onderwijs.


      2 Het funderend onderwijs heeft tot doel de algemene vorming van de in het eerste lid bedoelde kinderen in de
      Antilliaanse samenleving, gezien in samenhang met het Koninkrijk der Nederlanden en de Caribische regio in het
      bijzonder en in de wereld in zijn algemeenheid. Het biedt hun ongeacht hun achtergrond, een brede intellectuele,
      sociale, emotionele, motorische, artistieke en morele vorming. Het schept de voorwaarden waaronder zij zich
      individueel en als groepslid kunnen ontplooien tot jongeren die optimaal maatschappelijk kunnen participeren.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel2
  - number: '3'
    text: |-
      1 In de onderscheiden cycli van het funderend onderwijs en in een educatiegebied mag slechts onderwijs worden
      gegeven door degene die:

      a. in het bezit is van een verklaring van goed zedelijk gedrag, afgegeven volgens de de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref1] welke op het tijdstip van
      overlegging ten behoeve van de benoeming dan wel, indien van een benoeming geen sprake is op het tijdstip waarop
      met het onderwijs wordt begonnen, niet ouder is dan zes maanden;

      b. voor de desbetreffende cyclus, onderscheidenlijk het desbetreffende educatiegebied, in het bezit is van een
      bewijs van bekwaamheid als bedoeld in [artikel 4, eerste lid][ref2], of van een daarmee krachtens het derde lid
      gelijk gesteld bewijs van bekwaamheid, dan wel in het bezit is van een bewijs van bekwaamheid als bedoeld in
      artikel 4, tweede lid, dan wel van Onze Minister krachtens het vierde lid de bevoegdheid heeft verkregen;

      c. in het bezit van een geneeskundige verklaring, welke op het tijdstip van overlegging ten behoeve van de
      benoeming dan wel, indien van een benoeming geen sprake is, op het tijdstip waarop met het onderwijs wordt
      begonnen, niet ouder is dan zes maanden en

      d. niet krachtens rechterlijke uitspraak van het geven van onderwijs is uitgesloten of krachtens
      [artikel 30, tweede lid][ref3], de bevoegdheid tot het geven van onderwijs is ontzegd, en

      e. niet krachtens het zesde lid de bevoegdheid tot het geven van funderend onderwijs is ontnomen.

      2 Het eerste lid onderdeel b, is niet van toepassing voor het geven van godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs.

      3 Bij ministeriële regeling kan een buiten de openbare lichamen Bonaire, Sint Eustatius en Saba verworven bewijs
      worden gelijkgesteld met een bewijs van bekwaamheid genoemd in [artikel 4, eerste lid][ref4]. Daarbij kunnen
      voorwaarden en beperkingen worden gesteld.

      4 Door Onze Minister kan aan personen die in het bezit zijn van een buiten de openbare lichamen Bonaire, Sint
      Eustatius en Saba behaald bewijs van bekwaamheid, de bevoegdheid tot het geven van onderwijs worden verleend.
      Daarbij kunnen voorwaarden en beperkingen worden gesteld.

      5 Ten aanzien van studenten in het laatste jaar van een opleiding tot leerkracht funderend onderwijs die praktische
      vorming behoeven kan voor ten hoogste de periode van twee schooljaren worden afgeweken van de eisen, gesteld in het
      eerste lid, onderdeel b, op voorwaarde dat de desbetreffende student

      a. het door hem te verzorgen onderwijs geeft in het kader van een dusdanig stageverband dat de student daarbij
      intussen ook lessen blijft volgen aan en begeleid wordt vanuit de instelling waaraan voornoemde opleiding is
      verbonden, en

      b. wordt begeleid door een of meer ervaren leerkrachten van de school waar betrokkene werkzaam is en deze
      leerkrachten bij die begeleiding nauw samenwerken met de in onderdeel a bedoelde instelling.

      6 Bij ministeriële regeling kan een regeling worden gegeven voor verplicht door elke leerkracht te volgen
      nascholing. De inhoud van de nascholing behoeft niet voor alle leerkrachten gelijk te zijn en kan per groep van
      leerkrachten afhankelijk gesteld worden van vooropleiding, werkervaring en het bezit van bepaalde bewijzen van
      bekwaamheid. Door Onze Minister kan aan de leerkracht die niet aan de verplichtingen krachtens deze regeling
      voldoet, de bevoegdheid tot het geven van funderend onderwijs worden ontnomen.


