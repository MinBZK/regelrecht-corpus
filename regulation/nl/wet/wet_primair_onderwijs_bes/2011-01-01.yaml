        afdeling: '1'
  - number: '11'
    text: |-
      1 Het onderwijs omvat, waar mogelijk in samenhang, de volgende educatiegebieden:

      a. taal, geletterdheid en communicatie, betrekking hebbend op het Engels, het Nederlands, het Papiamentu en het
      Spaans;

      b. rekenen en wiskunde;

      c. mens en maatschappij;

      d. mens, natuur en technologie;

      e. culturele en artistieke vorming;

      f. gezonde levensstijl en bewegingsonderwijs;

      g. sociaal emotionele vorming, en

      h. algemene mensvorming.

      2 Aan een bijzondere school omvat het educatiegebied algemene mensvorming tevens godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs. Het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs
      kan worden opgedragen aan een niet aan de school verbonden leerkracht. Met betrekking tot de eerste
      volzin mogen per schooljaar ten hoogste 60 uren van het aantal uren onderwijs dat de leerlingen krachtens
      [artikel 9, vierde lid, onderdeel a][ref1], ten minste moeten ontvangen, aan het godsdienstonderwijs of
      levensbeschouwelijke vormingsonderwijs worden besteed.

      3 Ten aanzien van de educatiegebieden, genoemd in het eerste lid, worden bij algemene maatregel van bestuur
      kerndoelen vastgesteld.

      4 Voor de school geldt de eis dat zij ten minste de kerndoelen bij haar onderwijsactiviteiten als aan het eind van
      het funderend onderwijs te bereiken doelstellingen hanteert. Kerndoelen geven een beschrijving van kwaliteiten van
      leerlingen op het gebied van kennis, attitudes, inzicht en vaardigheden.

      5 Indien het bevoegd gezag van een bijzondere school op grond van godsdienstige of levensbeschouwelijke overtuiging
      ernstige bedenkingen heeft tegen de krachtens het derde lid vastgestelde kerndoelen, kan het bevoegd gezag eigen
      kerndoelen voor de school voorstellen. Deze kerndoelen zijn van ten minste gelijk niveau als de kerndoelen, bedoeld
      in het derde lid. Het bevoegd gezag zendt de voorgestelde kerndoelen ter goedkeuring aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028735#Artikel9
