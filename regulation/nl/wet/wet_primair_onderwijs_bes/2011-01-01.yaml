        artikel: '69'
  - number: '21'
    text: >-
      1 Over iedere leerling die de school verlaat stelt de directeur, na overleg met het onderwijzende personeel, ten
      behoeve van de ontvangende school een onderwijskundig rapport op. Afschrift van dit rapport wordt aan de ouders van
      de leerling verstrekt.


      2 Bij of krachtens ministeriële regeling worden regels gegeven ten aanzien van de eisen waaraan het onderwijskundig
      rapport dient te voldoen.


      3 De vorm van het onderwijskundig rapport wordt door het bestuurscollege vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel21
  - number: '22'
    text: >-
      1 De leerlingen nemen deel aan alle voor hen bestemde onderwijsactiviteiten.


      2 Het bevoegd gezag kan op verzoek van de ouders een leerling ontheffing geven van het deelnemen aan
      bepaalde onderwijsactiviteiten. Een ontheffing kan slechts worden verleend op grond van godsdienstige
      of levensbeschouwelijke redenen, een verklaring van een lichamelijke dan wel zintuiglijke handicap dan
      wel een leerstoornis, afgegeven door een deskundige. Het bevoegd gezag bepaalt bij de ontheffing welke
      onderwijsactiviteiten voor de leerling in de plaats komen van die waarvan ontheffing is verleend.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel22
  - number: '23'
    text: |-
      Het bevoegd gezag stelt de ouders van de leerlingen en andere vrijwilligers in de gelegenheid ondersteunende
      werkzaamheden ten behoeve van de school en het onderwijs te verrichten. De ouders en andere vrijwilligers zijn
      daarbij gehouden de aanwijzingen op te volgen van de directeur en het overige onderwijzende personeel, die
      verantwoordelijk blijven voor de gang van zaken. Om ondersteunende werkzaamheden ten behoeve van de school en het
      onderwijs te kunnen verrichten, dienen de betrokken ouders en andere vrijwilligers in het bezit te zijn van de
      verklaringen, bedoeld in [artikel 3, eerste lid onderdelen a en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028735#Artikel3
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028735
        artikel: '3'
        hoofdstuk: I
  - number: '24'
    text: >-
      1 Aan elke school is één directeur verbonden, bij wie onder verantwoordelijkheid van het bevoegd gezag de
      onderwijskundige, organisatorische en huishoudelijke leiding berust.


      2 Aan een school zijn één of meer leerkrachten verbonden. Eén van de leerkrachten van de school wordt tevens tot
      adjunct-directeur benoemd.


      3 Per cyclus kan op voordracht van de directeur een leerkracht tot cycluscoördinator worden benoemd die belast is
      met de leiding van de onderwijskundige aangelegenheden van de desbetreffende cyclus.


      4 Aan een school kan onderwijsondersteunend personeel zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel24
  - number: '25'
    text: >-
      1 Het bevoegd gezag stelt een directiestatuut vast.


      2 Het directiestatuut bevat in ieder geval de aanduiding van de aan het bevoegd gezag bij of krachtens wettelijk
      voorschrift toegekende taken en bevoegdheden waarvan het bevoegd gezag heeft bepaald dat de directeur van de school
      deze in naam van het bevoegd gezag kan uitoefenen. Het directiestatuut bevat voorts instructies ten aanzien van
      deze taken en bevoegdheden.


      3 Het bevoegd gezag draagt er zorg voor dat een exemplaar van het directiestatuut in het gebouw van de school
      ter inzage wordt gelegd op een voor een ieder toegankelijke plaats. Het bevoegd gezag zendt een exemplaar van
      het directiestatuut, alsmede elke wijziging daarvan, zo spoedig mogelijk na de vaststelling ter kennisneming aan
      de inspectie.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel25
  - number: '26'
    text: |-
      1 Om tot leerkracht te kunnen worden benoemd, dient de betrokkene:

      a. te voldoen aan [artikel 3, eerste lid][ref1], en

      b. op grond van de in de opleiding tot leerkracht funderend onderwijs gestelde vereisten en gebruikte criteria
      blijk te hebben gegeven van voldoende beheersing van de krachtens [artikel 10][ref2] vastgestelde instructietaal of
      instructietalen waarin betrokkene onderwijs zal verzorgen.

      2 Om te kunnen worden benoemd voor uitsluitend het geven van godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs dient de betrokkene, in afwijking van het eerste lid, slechts te voldoen aan
      [artikel 3, eerste lid onderdelen a, c, d en e][ref3].

      3 Om te kunnen worden benoemd in een niet onderwijsgevende functie, de directeur uitgezonderd, dient de betrokkene
      in het bezit te zijn van de verklaringen, bedoeld in [artikel 3, eerste lid onderdelen a en c][ref4].


