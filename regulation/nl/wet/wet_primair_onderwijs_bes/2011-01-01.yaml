  - number: '44'
    text: >-
      De kosten van de openbare en de bijzondere scholen worden door het openbaar lichaam vergoed volgens de bepalingen
      van deze titel.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel44
  - number: '45'
    text: |-
      1 De eilandsraad kan op aanvraag van het bevoegd gezag een school voor bekostiging in aanmerking brengen indien
      er, met inachtneming van hetgeen is bepaald in [artikel 47][ref1], sprake is van voldoende behoefte aan die school.
      Bij inwilliging van de aanvraag ontstaat de aanspraak op bekostiging met ingang van het schooljaar volgend op de
      inwilliging, dan wel een eerder door de eilandsraad vast te stellen moment.

      2 Bij eilandsverordening wordt vastgesteld de wijze waarop de in het eerste lid bedoelde behoefte wordt bepaald, en
      worden voorschriften gegeven met betrekking tot de indiening en behandeling van aanvragen om bekostiging op grond
      van het eerste lid. Bij het vaststellen van deze voorschriften geldt als uitgangspunt dat op de aanvraag wordt
      beslist binnen negen maanden na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0028735#Artikel47
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0028735
        artikel: '47'
        hoofdstuk: I
  - number: '46'
    text: >-
      1 De vergoeding heeft ten minste betrekking op:


      a. personeel;


      b. onderhoud, beveiliging, verzekering en vervanging van inventaris;


      c. onderhoud, beveiliging en verzekering van gebouwen en terreinen;


      d. energie;


      e. administratie, beheer en bestuur;


      f. schoonmaken;


      g. heffingen;


      h. huur van gebouwen en terreinen;


      i. investeringen in gebouwen en terreinen;


      j. eerste inrichting;


      k. nascholing, en


      l. leerlingenzorg.


      2 De vergoeding is toereikend met het oog op een goede verzorging van het funderend onderwijs.


      3 Voor onderwijsondersteunende activiteiten kan het bestuurscollege een afzonderlijke vergoeding toekennen.


      4 Bij eilandsbesluit, houdende algemene maatregelen, worden voor zover van toepassing geregeld:


      a. de gevallen waarin de niet in het eerste lid genoemde kostensoorten voor vergoeding in aanmerking komen;


      b. de wijze waarop vergoedingen als bedoeld in het eerste lid worden berekend;


      c. de voorwaarden waaronder een vergoeding als bedoeld in het derde lid kan worden toegekend;


      d. de wijze waarop de vergoedingen beschikbaar worden gesteld aan de bevoegde gezagsorganen, daaronder in elk geval
      begrepen regels over de betalingswijze, de betalingstermijnen, voor zover van toepassing de bevoorschotting en het
      al dan niet mede voor andere, alsdan aan te wijzen doeleinden mogen aanwenden van de vergoedingen, en


      e. de verantwoording van de rechtmatigheid en de doelmatigheid van de aanwending van de vergoedingen.


      5 Vooruitlopend op een wijziging van het eerste lid, kunnen bij algemene maatregel van bestuur kostensoorten worden
      aangewezen waarop de vergoeding eveneens betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel46
  - number: '47'
    text: >-
      1 De eilandsraad kan besluiten dat een school niet meer voor bekostiging in aanmerking komt, indien niet langer
      sprake is van voldoende behoefte aan die school. De wijze waarop wordt vastgesteld dat niet langer sprake is
      van voldoende behoefte, wordt geregeld bij eilandsverordening, met dien verstande dat daarin ten aanzien van
      de bepaling van mate van behoefte slechts geobjectiveerde normen met betrekking tot de minimale omvang van het
      leerlingenbestand, welke noodzakelijk geacht mag worden om een school in de zin van deze wet in stand te kunnen
      houden, gesteld kunnen worden. De behoefte wordt niet in voldoende mate aanwezig geacht indien de school naar
      mening van de eilandsraad bezocht zal worden door minder dan 75 leerlingen.


      2 In geval van een beslissing als bedoeld in het eerste lid, vervalt de aanspraak op bekostiging voor een school
      op een nader door de eilandsraad te bepalen tijdstip, welk tijdstip in elk geval samenvalt met het einde van een
      schooljaar.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel47
  - number: '48'
    text: >-
      1 Het bevoegd gezag van een bijzondere school geeft het bestuurscollege alle inlichtingen die het voor de
      toepassing van deze titel verlangt. De informatie wordt verstrekt in een door het bestuurscollege vast te stellen
      vorm.


      2 Het bevoegd gezag, de eilandsraad en het bestuurscollege verschaffen aan Onze Minister alle informatie die deze
      nodig acht ten behoeve van een goede uitvoering van deze wet en voor het door hem te voeren beleid met betrekking
      tot het funderend onderwijs. De informatie wordt verstrekt in een door Onze Minister vast te stellen vorm.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel48
  - number: '49'
    text: >-
      1 Indien het bevoegd gezag van een niet door het bestuurscollege in stand gehouden school een bij of krachtens
      deze wet gegeven voorschrift niet nakomt, kan het bestuurscollege bepalen dan wel bepaalt het bestuurscollege op
      aanwijzing van Onze Minister, dat de vergoeding of de bevoorschotting op de vergoeding geheel of gedeeltelijk wordt
      ingehouden dan wel opgeschort.


      2 Het bestuurscollege kent de vergoeding wederom toe, indien hem blijkt, dan wel Onze Minister te kennen heeft
      gegeven, dat de reden voor de toepassing van het eerste lid is vervallen.


      3 Afschrift van een beslissing als bedoeld in het eerste en tweede lid zendt het bestuurscollege aan Onze Minister.


      4 Indien het bestuurscollege een bij of krachtens deze wet gegeven voorschrift niet nakomt, informeert Onze
      Minister de eilandsraad.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel49
  - number: '50'
    text: '[wijzigt de Landsverordening onderwijskundige experimenten]'
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel50
  - number: '51'
    text: '[wijzigt de Landsverordening voortgezet onderwijs]'
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel51
  - number: '52'
    text: '[wijzigt de Landsverordening secundair beroepsonderwijs en educatie]'
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel52
  - number: '53'
    text: '[wijzigt de Leerplichtlandsverordening]'
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel53
  - number: '54'
    text: >-
      1 De Landsverordening kleuteronderwijs wordt ingetrokken, met dien verstande dat de bij en krachtens die
      verordening vastgestelde bepalingen van toepassing blijven op het onderwijs waarvoor het funderend onderwijs nog
      niet ingevolge de stapsgewijze invoering bedoeld in artikel 56 in de plaats is getreden.


      2 De Landsverordening basisonderwijs is met uitzondering van de bepalingen die betrekking hebben op het speciaal
      onderwijs niet meer van toepassing, met dien verstande dat de bij en krachtens die verordening vastgestelde
      bepalingen van toepassing blijven op het onderwijs waarvoor het funderend onderwijs nog niet ingevolge de
      stapsgewijze invoering bedoeld in artikel 56 in de plaats is getreden.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel54
  - number: 55 t/m 57
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel55_tm_57
  - number: '58'
    text: >-
      Het dienstverband tussen een bevoegd gezag dat een of meer scholen voor funderend onderwijs in stand houdt en het
      bij dat bevoegd gezag voor het kleuteronderwijs of het basisonderwijs in dienst zijnde personeel kan niet worden
      beëindigd op gronden die verband houden met de invoering van het funderend onderwijs.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel58
  - number: 59 t/m 61
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel59_tm_61
  - number: '62'
    text: >-
      Op geschillen tussen personeel en bevoegd gezag die ingevolge de op de dag voorafgaande aan de inwerkingtreding van
      deze wet geldende voorschriften aanhangig zijn gemaakt bij een commissie van beroep of bij de rechter, blijven de
      op die dag geldende regelingen van toepassing.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel62
  - number: '63'
    text: |-
      1 Indien een bevoegdheid tot het geven van onderwijs krachtens artikel 33 van de Landsverordening basisonderwijs of
      artikel 28 van de Landsverordening kleuteronderwijs is vervallen of ontnomen, wordt deze geacht te zijn vervallen
      of ontnomen krachtens [artikel 30][ref1].

      2 Degene die in zijn bevoegdheid tot het geven van onderwijs krachtens artikel 35 van de Landsverordening
      basisonderwijs of artikel 30 van de Landsverordening kleuteronderwijs is geschorst, wordt geacht in zijn
      bevoegdheid tot het geven van onderwijs te zijn geschorst krachtens [artikel 34][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028735#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0028735#Artikel34
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0028735
        artikel: '30'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028735
        artikel: '34'
        hoofdstuk: I
        afdeling: '2'
  - number: '64'
    text: >-
      De daarvoor in aanmerking komende rechtspersonen brengen voor zover noodzakelijk binnen zes maanden na de
      inwerkingtreding van de Landsverordening funderend onderwijs hun statuten of reglementen in overeenstemming met de
      in deze wet gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel64
  - number: 65 t/m 68
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel65_tm_68
  - number: '69'
    text: >-
      Voorzover deze wet daarin niet voorziet, alsmede indien nodig in afwijking van het bij of krachtens deze wet
      bepaalde, kunnen bij ministeriële regeling, desgewenst per openbaar lichaam, voorschriften worden vastgesteld ten
      behoeve van een goede invoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel69
  - number: '70'
    text: >-
      1 De bevoegde gezagsorganen, de bestuurscolleges, de eilandsraden en de scholen zijn verplicht Onze Minister en de
      door hem aangewezen ambtenaren desgevraagd alle inlichtingen te geven die nodig zijn voor een goede uitvoering van
      deze wet.


      2 Bij ministeriële regeling kunnen voorschriften worden gegeven ten aanzien van het formaat waarin de inlichtingen
      moeten worden aangeleverd.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel70
  - number: '71'
    text: 'Deze wet wordt aangehaald als: Wet primair onderwijs BES.'
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel71
  - number: '72'
    text: '[vervallen]'
