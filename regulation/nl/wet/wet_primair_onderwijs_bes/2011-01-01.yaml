  - number: '19'
    text: >-
      1 Om als leerling tot een school te worden toegelaten, moet een kind de leeftijd van vier jaar hebben bereikt.


      2 Het bevoegd gezag stelt voor kinderen die nog niet eerder tot een school zijn toegelaten, toelatingstijdstippen
      vast op ten minste de eerste schooldag van elke maand.


      3 De leerling verlaat de school in principe aan het eind van het schooljaar waarin deze de leeftijd van twaalf
      jaar heeft bereikt, doch uiterlijk aan het eind van het schooljaar waarin deze de leeftijd van veertien jaar heeft
      bereikt.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel19
  - number: '20'
    text: |-
      1 De beslissing over toelating, schorsing en definitieve verwijdering van leerlingen berust bij het bevoegd gezag.
      De toelating, schorsing en definitieve verwijdering mag niet afhankelijk gesteld worden van een geldelijke bijdrage
      van de ouders.

      2 Onverminderd het derde lid wordt toelating van een leerling tot een school voor bijzonder onderwijs slechts
      geweigerd op grond van godsdienstige of levensbeschouwelijke redenen of aantoonbaar plaatsgebrek doch niet op grond
      van de taalachtergrond van de leerling of op grond van onvoldoende ontwikkeling in de educatiegebieden. De leerling
      wordt bij toelating volgens diens leeftijd geplaatst in de desbetreffende cyclus.

      3 Verwijzing van leerlingen naar een school voor speciaal funderend onderwijs of een afdeling voor speciaal
      funderend onderwijs, verbonden aan een school, vindt slechts plaats op grond van een onderzoek door een
      plaatsingscommissie volgens door het bestuurscollege van het desbetreffende openbaar lichaam te stellen regelen.

      4 Voordat wordt besloten tot schorsing van drie dagen of meer of definitieve verwijdering, hoort het bevoegd gezag
      de inspectie, de eilandelijke leerplichtambtenaar, de betrokken leerkracht en de betrokken ouders. Definitieve
      verwijdering van een leerling vindt niet plaats dan nadat het bevoegd gezag ervoor heeft zorggedragen dat een
      andere school bereid is de leerling toe te laten.

      5 Indien tegen het besluit, bedoeld in het eerste lid, van het bevoegd gezag van
      een openbare school bezwaar is gemaakt, besluit het bevoegd gezag in afwijking van
      [artikel 69, eerste lid, van de Wet administratieve rechtspraak BES][ref1] binnen 4 weken na ontvangst van het
      bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel69
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel20
