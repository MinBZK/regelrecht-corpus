  - number: '4'
    text: |-
      1 De bewijzen van bekwaamheid tot het geven van het onderwijs, bedoeld in
      [artikel 3, eerste lid onderdeel b][ref1], aan een school zijn:

      a. voor de eerste en tweede cyclus:

      1. het diploma applicatiecursus leerkracht funderend onderwijs eerste respectievelijk tweede cyclus;

      2. het diploma leerkracht funderend onderwijs eerste respectievelijk tweede, cyclus.

      b. voor de onderscheiden educatiegebieden van de tweede cyclus:

      1. het diploma applicatiecursus leerkracht funderend onderwijs voor het desbetreffende educatiegebied van de tweede
      cyclus;

      2. het diploma leerkracht funderend onderwijs voor het desbetreffende educatiegebied van de tweede cyclus.

      2 De bewijzen, genoemd in het eerste lid, moeten zijn verkregen op het niveau van bachelor aan een
      opleidingsinstituut dat door Onze Minister als zodanig is aangewezen en zijn afgegeven conform een door Onze
      Minister goedgekeurd diplomamodel. Onze Minister kan naast de bewijzen, genoemd in de eerste volzin, bewijzen
      aanwijzen die zijn verkregen aan een ander opleidingsinstituut.

      3 Bij algemene maatregel van bestuur kunnen bewijzen van bekwaamheid worden aangewezen die, naast de
      in het eerste lid genoemde, bevoegdheid verlenen tot het geven van onderwijs in een of meer van de in
      [artikel 11, eerste lid][ref2], genoemde educatiegebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0028735#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028735#Artikel11
