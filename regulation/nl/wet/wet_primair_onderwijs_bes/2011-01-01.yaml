  - number: '30'
    text: |-
      1 De bevoegdheid tot het geven van onderwijs vervalt van rechtswege bij onherroepelijke veroordeling wegens
      een misdrijf tegen de zeden als bedoeld in [Titel XIV van het Wetboek van Strafrecht BES][ref1] jegens een
      minderjarige.

      2 Door Onze Minister kan aan een leerkracht, die onherroepelijk is veroordeeld wegens een ander misdrijf dan
      bedoeld in het eerste lid of die bij het geven van onderwijs opvattingen steunt of verkondigt die strijden met
      de goede zeden of een aansporing inhouden tot ongehoorzaamheid aan de wettelijke regelingen binnen de openbare
      lichamen Bonaire, Sint Eustatius en Saba, de bevoegdheid tot het geven van onderwijs worden ontnomen.

      3 De bevoegdheid tot het geven van onderwijs vervalt van rechtswege indien de leerkracht in een periode van 5
      achtereenvolgende schooljaren niet heeft deelgenomen aan nascholing in de zin van [artikel 31][ref2].

      4 De leerkracht die op grond van dit artikel de bevoegdheid tot het geven van onderwijs verliest, is van rechtswege
      ontslagen met ingang van de dag waarop de beslissing onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0028570
      [ref2]: https://wetten.overheid.nl/BWBR0028735#Artikel31
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028570
      - id: ref2
        bwb_id: BWBR0028735
        artikel: '31'
        hoofdstuk: I
        afdeling: '1'
  - number: '31'
    text: >-
      Het bevoegd gezag stelt jaarlijks in verband met de nascholing van het personeel van de school een nascholingsplan
      vast. Het nascholingsplan geeft voor het komende schooljaar een overzicht van door het bevoegd gezag voorgenomen
      nascholingsactiviteiten. Het nascholingsplan bevat tevens een raming van de kosten van de door het bevoegd gezag
      voorgenomen nascholingsactiviteiten.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel31
  - number: '32'
    text: >-
      1 Het bevoegd gezag is verplicht aan studenten die in opleiding zijn voor een functie als leerkracht in het
      funderend onderwijs, gelegenheid te bieden de, als onderdeel van hun opleiding, vereiste ervaring in de school
      te verkrijgen.


      2 De verplichting bedoeld in het eerste lid, betreft:


      a. studenten die bij de opleiding tot leerkracht funderend onderwijs zijn ingeschreven of anderszins studeren voor
      een bewijs van bekwaamheid, dan wel voor een bewijs van voldoende pedagogische en didactische voorbereiding, en


      b. in een schooljaar gelijktijdig niet meer studenten als bedoeld onder a. dan een derde van het aantal
      leerkrachten, werkzaam aan de desbetreffende school in dat schooljaar.


      3 Het bevoegd gezag kan een student de verdere toegang tot de school ontzeggen indien deze in de school in strijd
      handelt met de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot de
      school wordt mededeling gedaan door toezending of uitreiking van een afschrift van het schriftelijke en met redenen
      omklede besluit aan de student, voor zover deze minderjarig is ook aan zijn ouders, het bevoegd gezag van de
      betrokken opleidingsinstelling en aan de inspectie.


      4 De directeur regelt, onder verantwoordelijkheid van het bevoegd gezag, de werkzaamheden in verband met de
      begeleiding door het onderwijzend personeel van de studenten in de school in overeenstemming met dit personeel,
      alsmede in overeenstemming met de betrokken opleidingsinstellingen.


      5 De inspectie kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor een schooljaar.


      6 De scholen waarop studenten als bedoeld in het eerste lid zijn toegelaten, zijn mede toegankelijk voor de
      directeuren en de door dezen aan te wijzen leerkrachten van de betrokken opleidingsinstellingen, een en ander voor
      zover zulks voor de begeleiding van de praktische vorming van de in de school aanwezige studenten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel32
  - number: '33'
    text: >-
      1 Het gezondheidstoezicht op de scholen wordt uitgeoefend door of vanwege het bestuurscollege en strekt zich
      uit over alle gebouwen waarin en terreinen waarop funderend onderwijs wordt gegeven en over het personeel van de
      scholen en de leerlingen.


      2 Geen onderwijs wordt gegeven in gebouwen of terreinen ten aanzien waarvan het bestuurscollege heeft besloten, dat
      zij niet voldoen aan de geldende bouwvoorschriften.


      3 Een besluit als bedoeld in het tweede lid wordt schriftelijk en met redenen omkleed gegeven.


      4 Het bestuurscollege maakt zijn besluit onmiddellijk openbaar op de wijze waarop van eilandswege officiële
      berichten worden bekendgemaakt.


      5 Nadat het bestuurscollege schriftelijk heeft verklaard dat het gebouw of het terrein voldoende is verbeterd mag
      het onderwijs worden hervat. Het derde en vierde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel33
  - number: '34'
    text: >-
      1 Het openbaar onderwijs draagt bij aan de ontwikkeling en vorming van de leerlingen met aandacht voor de
      godsdienstige, levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlands Antilliaanse
      samenleving.


      2 Openbare scholen zijn toegankelijk voor alle kinderen zonder onderscheid van godsdienst of levensbeschouwing.


      3 Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel34
  - number: '35'
    text: |-
      1 Een eilandsraad kan bij eilandsverordening een openbaar orgaan instellen die tot doel heeft een of meer openbare
      scholen voor funderend onderwijs in het openbaar lichaam in stand te houden, al dan niet samen met openbare scholen
      voor speciaal funderend onderwijs, openbare scholen als bedoeld in de [Wet voortgezet onderwijs BES][ref1] of een
      openbare instelling als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref2].

      2 De eilandsraad maakt het voornemen tot het vaststellen van de verordening, bedoeld in het eerste lid, bekend.

      3 Het openbaar orgaan oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle
      taken en bevoegdheden uit van het bevoegd gezag. Het bezit rechtspersoonlijkheid.

      4 De eilandsverordening, bedoeld in het eerste lid, voorziet in ieder geval in een regeling omtrent:

      a. de samenstelling, werkwijze en inrichting van het bestuur van het openbaar orgaan, met dien verstande dat in de
      regeling een overheersende invloed van de overheid in het bestuur is verzekerd;

      b. de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de eilandsraad en dat ten minste een derde deel, doch geen meerderheid, van die
      leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn ingeschreven op de betrokken
      school of scholen;

      c. de termijn waarvoor de bestuursleden worden benoemd;

      d. de vaststelling van de begroting en de jaarrekening na goedkeuring door de betreffende eilandsraad;

      e. de wijze waarop de eilandsraad toezicht op het bestuur uitoefent;

      f. de gronden waarop het bestuur kan besluiten de vergadering besloten te houden, en

      g. de periode waarvoor het openbaar orgaan in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt;

      5 Het bestuur brengt jaarlijks verslag uit aan de eilandsraad over de werkzaamheden, waarbij in ieder geval
      aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt bekendgemaakt.

      6 De vergaderingen van het bestuur van het openbaar orgaan zijn openbaar, tenzij het bestuur anders beslist, op
      gronden vermeld in de eilandsverordening, bedoeld in het eerste lid.

      7 Indien voor 1 januari van het jaar waarvoor de begroting geldt de begroting niet is goedgekeurd, neemt de
      eilandsraad de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen.

      8 De eilandsraad is in geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet-
      en regelgeving bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig het openbaar orgaan te ontbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0028424
      [ref2]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028424
      - id: ref2
        bwb_id: BWBR0028395
  - number: '36'
    text: >-
      1 De aanstelling en de overplaatsing van directeuren en adjunct-directeuren geschiedt door het bevoegd gezag, het
      personeel gehoord.


      2 De aanstelling en de overplaatsing van het overige personeel geschiedt door het bevoegd gezag, de directeuren en
      adjunct-directeuren van de desbetreffende scholen gehoord.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel36
  - number: '37'
    text: |-
      Het bevoegd gezag stelt de leerlingen in de gelegenheid op de school, binnen de schooltijden, godsdienstonderwijs
      of levensbeschouwelijk vormingsonderwijs te ontvangen. Ten hoogste 60 uren per schooljaar van het aantal uren
      onderwijs dat de leerlingen krachtens [artikel 9, vierde lid, onderdeel a][ref1], ten minste moeten ontvangen,
      mogen aan het godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs worden besteed. Voor de leerlingen die
      dit onderwijs niet volgen, voorziet het bevoegd gezag in andere onderwijsactiviteiten op de school.


      [ref1]: https://wetten.overheid.nl/BWBR0028735#Artikel9
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028735
        artikel: '9'
        hoofdstuk: I
        afdeling: '1'
  - number: '38'
    text: >-
      Godsdienstonderwijs wordt gegeven door leerkrachten daartoe aangewezen door kerkelijke gemeenten, plaatselijke
      kerken, of rechtspersonen met volledige rechtsbevoegdheid die zich volgens hun statuten het geven van
      godsdienstonderwijs ten doel stellen. Levensbeschouwelijk vormingsonderwijs wordt gegeven door leerkrachten daartoe
      aangewezen door volledige rechtsbevoegdheid bezittende organisaties op geestelijke grondslag.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel38
  - number: '39'
    text: >-
      1 Ieder personeelslid in dienst van het bevoegd gezag is in het bezit van een door het bevoegd gezag getekende akte
      van aanstelling. De akte van aanstelling bevat in elk geval:


      a. de naam en het adres van het bevoegd gezag;


      b. de naam, de voornamen en de geboortedatum van de betrokkene;


      c. de datum van ingang en de omvang van de aanstelling;


      d. de functie waarin de betrokkene wordt aangesteld;


      e. de bepaling of de aanstelling in vaste of in tijdelijke dienst geschiedt en in het laatste geval de gronden voor
      de tijdelijkheid en de duur van de aanstelling;


      f. de op de dag van zijn aanstelling van toepassing zijnde schaal en het daarbinnen geldende dienstjaar;


      g. de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag, en


      h. voor personeelsleden die bij de uitoefening van hun functie kennis nemen van persoonlijke gegevens van
      leerlingen, voorschriften omtrent geheimhouding daarvan, voor zover een geheimhoudingsplicht niet uit anderen
      hoofde is verzekerd.


      2 Het bevoegd gezag draagt zorg dat afschriften van de bewijzen van bekwaamheid, van de verklaringen omtrent het
      gedrag, alsmede van de akten van aanstelling van het aan de school verbonden personeel worden bewaard en zendt
      tevens een afschrift van de bewijzen van bekwaamheid aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel39
  - number: '40'
    text: >-
      Een bijzondere school wordt in stand gehouden door een rechtspersoon met volledige rechtsbevoegdheid die zich
      volgens de statuten of reglementen het geven van onderwijs ten doel stelt zonder daarbij het maken van winst te
      beogen.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel40
  - number: '41'
    text: >-
      1 Indien, over de weg gemeten, binnen 5 kilometer van de woning van de leerling geen gelegenheid bestaat tot het
      volgen van openbaar onderwijs, mag de toelating tot de school niet worden geweigerd op grond van godsdienstige
      gezindheid of levensbeschouwing.


      2 Leerlingen die ingevolge het eerste lid zijn toegelaten, kunnen niet worden verplicht godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs te volgen. Voor de leerlingen die dit onderwijs niet volgen, voorziet het
      bevoegd gezag in andere onderwijsactiviteiten op de school.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel41
  - number: '42'
    text: >-
      1 Ieder personeelslid is in het bezit van een door het bevoegd gezag en hemzelf getekende akte van benoeming. De
      akte van benoeming bevat in elk geval:


      a. de naam en het adres van het bevoegd gezag;


      b. de naam, de voornamen en de geboortedatum van de betrokkene;


      c. de datum van ingang en de omvang van de benoeming;


      d. de functie waarin de betrokkene wordt benoemd;


      e. de bepaling of de benoeming in vaste of tijdelijke dienst geschiedt en in het laatste geval de gronden voor de
      tijdelijkheid en de duur van de benoeming;


      f. de op de dag van zijn benoeming van toepassing zijnde schaal en het daarbinnen geldende dienstjaar;


      g. de bepaling dat de betrokkene werkzaam zal zijn in algemene dienst van het bevoegd gezag, en


      h. voor personeelsleden die bij de uitoefening van hun functie kennis nemen van persoonlijke gegevens van
      leerlingen, voorschriften omtrent geheimhouding daarvan, voor zover een geheimhoudingsplicht niet uit anderen
      hoofde is verzekerd.


      2 De akte van benoeming bevat ten minste bepalingen betreffende gronden voor schorsing, ontslag en disciplinaire
      maatregelen alsmede de bepaling dat de voorschriften betreffende de materiële rechtspositie van het personeel bij
      het openbaar onderwijs van overeenkomstige toepassing zijn.


      3 Het bevoegd gezag draagt zorg dat afschriften van de bewijzen van bekwaamheid, van de verklaringen omtrent het
      gedrag, alsmede van de akten van benoeming van het aan de school verbonden personeel worden bewaard en zendt tevens
      een afschrift van de bewijzen van bekwaamheid aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel42
  - number: '43'
    text: |-
      1 Indien het bevoegd gezag van een bijzondere school op grond van [artikel 32, derde lid][ref1], een student die
      in opleiding is voor een functie als leerkracht funderend onderwijs de toegang ontzegt, deelt het deze beslissing,
      schriftelijk en met redenen omkleed, mede door toezending of uitreiking aan de student, voor zover deze minderjarig
      is ook aan zijn ouders, het bevoegd gezag van de betrokken opleidingsinstelling en aan de inspectie. Daarbij wordt
      tevens de inhoud van het bepaalde in het derde lid, eerste volzin, vermeld.

      2 Indien het bevoegd gezag van een bijzondere school op grond van [artikel 20][ref2] weigert een leerling toe te
      laten dan wel een leerling verwijdert, deelt het de beslissing daartoe, schriftelijk en met redenen omkleed, mede
      door toezending of uitreiking aan de ouders. Daarbij wordt tevens de inhoud van het bepaalde in het derde lid,
      eerste volzin, vermeld.

      3 Binnen 4 weken na de mededeling, bedoeld in het eerste en het tweede lid, kunnen de student onderscheidenlijk
      de ouders bij het bevoegd gezag schriftelijk hun bezwaren kenbaar maken tegen de beslissing. Het bevoegd gezag
      beslist binnen 4 weken na ontvangst van de bezwaren. Alvorens te beslissen hoort het bevoegd gezag de student
      onderscheidenlijk de ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0028735#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0028735#Artikel20
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel43
