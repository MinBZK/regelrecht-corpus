  - number: '17'
    text: >-
      1 Aan elke school voor funderend onderwijs is een oudercommissie verbonden.


      2 Bij algemene maatregel van bestuur kan een nadere regeling worden gegeven ten aanzien van de inrichting, de wijze
      van verkiezing van de leden en de bevoegdheid van de oudercommissie.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel17
  - number: '18'
    text: |-
      1 Ouders en personeelsleden kunnen bij de klachtencommissie, bedoeld in het tweede lid, onderdeel a, een
      klacht indienen over gedragingen of beslissingen van het bevoegd gezag of het personeel dan wel het nalaten van
      gedragingen of het niet nemen van beslissingen door het bevoegd gezag of het personeel voor zover die betrekking
      hebben op de school waaraan zij verbonden zijn.

      2 Het bevoegd gezag treft een regeling voor de behandeling van klachten. Deze regeling vermeldt in ieder geval:

      a. de instelling van een klachtencommissie, die klachten behandelt;

      b. de wijze waarop de klachtencommissie haar werkzaamheden verricht;

      c. de termijn waarbinnen de klager een klacht kan indienen, en

      d. de termijn waarbinnen mededeling plaatsvindt van het oordeel, bedoeld in het zesde lid, en hoe bij noodzakelijke
      afwijking van deze termijn wordt gehandeld.

      3 Deze regeling:

      a. voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit een lid aangewezen
      door het bevoegd gezag, een lid aangewezen door de voor het personeel werkzame onderwijsvakbond of bij afwezigheid
      hiervan een lid aangewezen door het personeel en een lid voorgedragen door de oudercommissie, bedoeld in
      [artikel 17][ref1]. De in de vorige volzin genoemde leden wijzen een vierde lid, tevens voorzitter, aan. De
      voorzitter mag geen deel uitmaken van het bevoegd gezag, en niet werkzaam zijn bij enig bevoegd gezag, en

      b. waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft.

      4 De klager en degene over wie is geklaagd dan wel de instantie waarover is geklaagd, krijgen de gelegenheid:

      a. hun zienswijze mondeling of schriftelijk toe te lichten, en

      b. zich bij de behandeling van de klacht te laten bijstaan.

      5 De klachtencommissie vormt zich een oordeel over de gegrondheid van de klacht en deelt dit oordeel, al dan niet
      vergezeld van aanbevelingen, schriftelijk mede aan de klager, degene over wie is geklaagd en het bevoegd gezag.

      6 Het bevoegd gezag deelt de klager en de klachtencommissie binnen twee weken na ontvangst van het in het vijfde
      lid bedoelde oordeel van de klachtencommissie schriftelijk mede of hij het oordeel over de gegrondheid van de
      klacht deelt en of hij naar aanleiding van dat oordeel maatregelen zal nemen en zo ja welke. Bij afwijking van
      de in de eerste volzin genoemde termijn, doet het bevoegd gezag daarvan met redenen omkleed mededeling aan de
      klager en de klachtencommissie onder vermelding van de termijn, welke termijn ten hoogste twee weken mag bedragen,
      waarbinnen het bevoegd gezag zijn standpunt bekend zal maken.

      7 Degene die betrokken is bij de uitvoering van dit artikel en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, is verplicht tot geheimhouding daarvan,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.

      8 Gegevens die betrekking hebben op een klacht worden bewaard op een plaats die uitsluitend toegankelijk is voor de
      leden van de klachtencommissie.


