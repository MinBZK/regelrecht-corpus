  - number: '5'
    text: >-
      1 Tot directeur kunnen worden benoemd:


      1. zij die in het bezit zijn van:


      a. het diploma applicatiecursus leerkracht funderend onderwijs eerste of tweede cyclus of het diploma leerkracht
      funderend onderwijs eerste of tweede cyclus, en


      b. een diploma van het nascholingsprogramma voor directeur van een school voor funderend onderwijs, en


      c. minimaal drie jaar ervaring hebben als leerkracht op een school voor funderend onderwijs of gewezen
      basisonderwijs dan wel als hoofd op een school voor gewezen kleuteronderwijs.


      2. zij die een door Onze Minister aangewezen opleiding op het terrein van school- en onderwijsmanagement met goed
      gevolg hebben afgerond.


      2 De bewijzen, genoemd in het eerste lid, moeten zijn verkregen aan een opleidingsinstituut dat door Onze Minister
      als zodanig is aangewezen om nascholing te verzorgen, en zijn afgegeven conform een door Onze Minister goedgekeurd
      diplomamodel.
