  - number: '27'
    text: >-
      1 Bij eilandsbesluit, houdende algemene maatregelen wordt een regeling vastgesteld voor de salarissen en toelagen
      van het personeel van een school alsmede de omvang van de personeelsformatie waarop een school voor een schooljaar
      recht heeft. De omvang van de personeelsformatie is:


      a. afhankelijk van het aantal leerlingen van de school en mede van de samenstelling van het leerlingenbestand van
      de school;


      b. afhankelijk van een genormeerde groepsgrootte, waarbij het aantal leerlingen in de eerste cyclus gemiddeld 24 en
      ten hoogste 26 per groep bedraagt en in de tweede cyclus gemiddeld 26 en ten hoogste 28 per groep bedraagt, en


      c. redelijkerwijs voldoende voor het leiden en beheren van de school, voor het geven van onderwijs aan de school en
      voor de overige werkzaamheden die verband houden met het onderwijs aan de school.


      2 Op een daartoe strekkend verzoek van het bevoegd gezag kan het bestuurscollege beslissen dat voor een school
      lagere gemiddelden gelden dan de gemiddelden genoemd in dit lid onder b, indien binnen een straal van 10 kilometer
      van die school geen andere school bestaat die leerlingen kan toelaten die bij onverkorte toepassing van hetgeen is
      bepaald in het eerste lid onder b niet toelaatbaar zijn op de eerst bedoelde school.


      3 Het bestuurscollege stelt de regeling, bedoeld in het eerste lid, dan wel een wijziging daarvan, niet vast dan
      nadat daarover op overeenstemming gericht overleg is gevoerd met de betreffende bevoegde gezagsorganen van de
      scholen en onderwijsvakbond en bij diens afwezigheid met een vertegenwoordiging van het personeel.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel27
  - number: '28'
    text: Het bevoegd gezag stelt het personeel aan dan wel benoemt het personeel en schorst en ontslaat het personeel.
    url: https://wetten.overheid.nl/BWBR0028735/2011-01-01#Artikel28
  - number: '29'
    text: |-
      1 Het bevoegd gezag stelt het personeel aan dan wel benoemt het personeel in algemene dienst van het bevoegd gezag.

      2 Onder aanstelling dan wel benoeming in algemene dienst van het bevoegd gezag wordt in dit artikel en in de
      [artikelen 39][ref1] en [42][ref2] verstaan een aanstelling dan wel benoeming ten behoeve van het verrichten van
      werkzaamheden aan door het bevoegd gezag in stand gehouden scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0028735#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0028735#Artikel42
