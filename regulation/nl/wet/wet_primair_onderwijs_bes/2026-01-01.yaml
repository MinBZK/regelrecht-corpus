    text: |-
      1 Het bevoegd gezag draagt mede in verband met de verplichting, bedoeld in [artikel 13][ref1], zorg voor een goed
      bestuurde school met een scheiding tussen de functies van bestuur en het toezicht daarop, en met een rechtmatig
      bestuur en beheer.

      2 De benoeming in de functies van het bestuur en het toezicht op het bestuur, bedoeld in het eerste lid, geschiedt
      op basis van vooraf openbaar gemaakte profielen.


