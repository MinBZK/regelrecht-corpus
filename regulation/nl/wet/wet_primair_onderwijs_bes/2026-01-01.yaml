    text: |-
      In afwijking van [artikel 13a, tweede lid][ref1], worden de leerresultaten die zijn behaald in de drie schooljaren
      voorafgaand aan de inwerkingtreding van [artikel V, onderdeel B, van de wet tot wijziging van een aantal
      onderwijswetten in verband met aanpassingen op het gebied van de doorstroom van het basisonderwijs naar het
      voortgezet onderwijs en wijziging van de stelselinrichting van doorstroomtoetsen en toetsen verbonden aan leerling-
      en onderwijsvolgsystemen in het basisonderwijs](onbekend), niet meegenomen in de beoordeling van de kwaliteit van
      het onderwijs.


