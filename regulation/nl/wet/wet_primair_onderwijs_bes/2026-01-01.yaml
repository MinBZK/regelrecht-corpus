    text: |-
      1 Indien de bekostiging van een bijzondere school wordt beëindigd of het bevoegd gezag tot de opheffing van de
      school beslist, eindigt het recht op het gebouw en terrein en worden alle roerende zaken, behalve die welke het
      bevoegd gezag uit eigen middelen heeft aangeschaft, aan het openbaar lichaam op wiens grondgebied het gebouw en
      terrein zijn gelegen, overgedragen.

      2 [Artikel 94, eerste tot en met vijfde lid][ref1], is van overeenkomstige toepassing met dien verstande dat in
      de verklaring ingevolge het eerste lid en het besluit ingevolge het tweede lid als datum waarop het bevoegd gezag
      blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein voor de school te gebruiken, zal
      worden genoemd de datum waarop de bekostiging is geëindigd dan wel zal eindigen.


