  - number: '91'
    text: |-
      1 Het bestuurscollege is bevoegd een gedeelte van een gebouw of terrein dat tijdelijk of gedurende een gedeelte
      van de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd te bestemmen als huisvesting voor
      een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde basisonderwijs, of voor educatie
      als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1] dan wel voor andere culturele, maatschappelijke
      of recreatieve doeleinden. Het voorgenomen gebruik dient zich te verdragen met het onderwijs aan de in het gebouw
      gevestigde school. Tevens is het bestuurscollege bevoegd ten behoeve van het onderwijs in lichamelijke oefening
      of expressie-activiteiten een gebouw of terrein dan wel een gedeelte daarvan dat tijdelijk gedurende gedeelten van
      de dag of in het geheel niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd te bestemmen als
      huisvesting voor een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde basisonderwijs,
      of voor educatie als bedoeld in de Wet educatie en beroepsonderwijs BES dan wel voor andere culturele,
      maatschappelijke of recreatieve doeleinden.

      2 Indien het gebouw of terrein in gebruik is voor een niet door het openbaar lichaam in stand gehouden school
      pleegt het bestuurscollege vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met het bevoegd
      gezag van die school waarvoor de huisvesting is bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: '92'
    text: |-
      1 Voor zover [artikel 91][ref1] geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw
      of terrein in gebruik geven ten behoeve van uit de openbare kas bekostigd onderwijs dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden. Voor zover niet nodig voor uit de openbare kas
      bekostigd onderwijs, kan het bevoegd gezag een gedeelte van het gebouw of terrein verhuren aan een derde,
      voor zover het gehuurde niet bestemd zal zijn als woon- of bedrijfsruimte in de zin van de [vijfde][ref2] en
      [zesde afdeling van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref3]. Indien het een niet door het openbaar
      lichaam in stand gehouden school betreft, is voor verhuur toestemming van het bestuurscollege vereist.

      2 De ingebruikgeving of verhuur ingevolge het eerste lid eindigt:

      a. indien het bestuurscollege gebruik maakt van zijn bevoegdheid op grond van [artikel 91][ref4] zonder dat enige
      schadeplicht ontstaat, of

      b. indien het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.

      3 Ingebruikgeving of verhuur ingevolge het eerste lid geschiedt niet indien het voorgenomen gebruik zich niet
      verdraagt met het onderwijs aan de in het gebouw gevestigde school.

      4 Op de ingebruikgeving en verhuur ingevolge het eerste lid is
      [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref5] niet van toepassing.

      5 Het zonder toestemming van het bestuurscollege verhuren van een gebouw of terrein door het bevoegd gezag van een
      niet door het openbaar lichaam in stand gehouden school alsmede elk met dit artikel strijdig beding opgenomen in
      een huurovereenkomst met betrekking tot schoolgebouwen, is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Afdeling5
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Afdeling6
      [ref4]: https://wetten.overheid.nl/BWBR0030280#Artikel91
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
