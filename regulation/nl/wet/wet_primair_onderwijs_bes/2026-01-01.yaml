      1 Met het toezicht op de uitvoering van de taken, bedoeld in [artikel 28, eerste lid][ref1], en voor zover van
      toepassing het zevende lid van dat artikel, zijn belast de bij besluit van Onze Minister aangewezen ambtenaren.

      2 De [artikelen 5:13][ref2], [5:15][ref3], [5:16][ref4], [5:17][ref5] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref6] zijn van overeenkomstige toepassing.

      3 Onze Minister is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref7] ten aanzien van de in het eerste lid bedoelde
      ambtenaren.


