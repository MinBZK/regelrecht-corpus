  - number: '157'
    text: |-
      1 Tot een bij koninklijk besluit te bepalen tijdstip zendt het bevoegd gezag voor 15 oktober volgend op de teldatum
      1 oktober aan Onze Minister een opgave van het aantal leerlingen. Indien deze opgave niet voor die datum wordt
      gedaan, stelt Onze Minister het aantal leerlingen, indien die gegevens voor de voortzetting of beëindiging van de
      bekostiging onderscheidenlijk de opheffing of instandhouding van een school noodzakelijk zijn, ambtshalve vast.
      Een opgave van het aantal leerlingen op of na 15 oktober aan Onze Minister heeft geen invloed op het ambtshalve
      vastgestelde aantal leerlingen voor zover het betreft het al of niet beëindigen van de bekostiging van een
      bijzondere school of de opheffing of instandhouding van een openbare school.

      2 Tot een bij koninklijk besluit te bepalen tijdstip wijst Onze Minister het bevoegd gezag voorafgaand aan de
      teldatum 1 oktober op de verplichting, bedoeld in de eerste volzin van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel157
  - number: '158'
    text: |-
      1 In afwijking van de [artikelen 78 tot en met 84][ref1] en met overeenkomstige toepassing van [artikel 87][ref2]
      gelden voor het jaar 2011 tot en met een bij koninklijk besluit te bepalen tijdstip de voorschriften van het tweede
      tot en met zevende lid voor de voorziening in de huisvesting van uit 's Rijks kas bekostigde scholen.

      2 Onze Minister en het bestuurscollege van het openbaar lichaam zijn voor het jaar 2011 tot en met een bij
      koninklijk besluit te bepalen tijdstip gezamenlijk verantwoordelijk voor de huisvesting van uit ’s Rijks kas
      bekostigde scholen alsmede voor de financiering daarvan.

      3 Onze Minister en het bestuurscollege van het openbaar lichaam sluiten ter invulling van de gezamenlijke
      verantwoordelijkheid, bedoeld in het tweede lid, namens de Staat der Nederlanden onderscheidenlijk namens het
      betreffende openbaar lichaam, een of meer convenanten.

      4 Overeenkomstig het convenant of de convenanten, bedoeld in het derde lid, stelt Onze Minister voor elk van de
      openbare lichamen een plan vast, waarin de voornemens op het terrein van de huisvesting, bedoeld in het tweede lid,
      alsmede de financiering daarvan, op hoofdlijnen worden beschreven.

      5 Onze Minister stelt de plannen, bedoeld in het vierde lid, vast in overeenstemming met het bestuurscollege van
      het openbaar lichaam en na overleg met de betreffende bevoegde gezagsorganen van de scholen.

      6 Onze Minister kan een of meer plannen, bedoeld in het vierde lid, in overeenstemming met het bestuurscollege van
      het betreffende openbaar lichaam, wijzigen.

      7 De plannen dan wel een wijziging daarvan, worden aan de betrokken bevoegde gezagsorganen van de scholen en in de
      Staatscourant bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel78
