  - number: '16'
    text: |-
      1 De schoolgids bevat voor ouders en leerlingen informatie over de werkwijze van de school en bevat in elk geval
      informatie over:

      a. de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, met dien verstande
      dat bij algemene maatregel van bestuur voorschriften kunnen worden gegeven met betrekking tot de wijze waarop:

      1°. de resultaten worden beschreven die met het onderwijsleerproces worden bereikt, en

      2°. de context wordt vermeld waarin de onder 1° bedoelde resultaten dienen te worden geplaatst.

      b. de wijze waarop aan de zorg voor het jonge kind wordt vormgegeven,

      c. de wijze waarop aan de zorg voor leerlingen met specifieke onderwijsbehoeften wordt vormgegeven,

      d. de wijze waarop de verplichte onderwijstijd wordt benut,

      e. de geldelijke bijdrage, bedoeld in [artikel 44, eerste lid][ref1], waarbij wordt vermeld dat deze vrijwillig
      is en dat het niet voldoen van die bijdrage niet leidt tot het uitsluiten van leerlingen van deelname aan
      activiteiten,

      f. de rechten en plichten van de ouders, de leerlingen en het bevoegd gezag, waaronder de informatie over de
      klachtenregeling, bedoeld in [artikel 17][ref2], en de gronden voor vrijstelling van het onderwijs, bedoeld in
      [artikel 47, tweede lid][ref3],

      g. de wijze waarop het bevoegd gezag omgaat met de in [artikel 15, eerste lid][ref4], omschreven bijdragen,

      h. de door de school gehanteerde instructietaal of instructietalen,

      i. het beleid met betrekking tot de veiligheid,

      j. de wijze waarop de voorzieningen, bedoeld in [artikel 50][ref5], worden georganiseerd,

      k. het verzuimbeleid,

      l. de in het kader van het stelsel van kwaliteitszorg, bedoeld in [artikel 15, vierde lid][ref6], gedane
      bevindingen en de maatregelen die naar aanleiding daarvan zijn getroffen,

      m. de persoon bij wie de taken, bedoeld in [artikel 6a, eerste lid, onderdeel c][ref7], zijn belegd,

      n. de wijze waarop de identiteitscommissie, bedoeld in [artikel 22a][ref8], invulling geeft aan het openbare
      karakter onderscheidenlijk de identiteit voor zover het betreft een samenwerkingsschool,

      o. voor wat betreft het openbare lichaam Bonaire, de wijze van totstandkoming van het schooladvies en het
      definitieve schooladvies, bedoeld in [artikel 51d, eerste en derde lid][ref9], en

      p. voor wat betreft het openbare lichaam Bonaire, de wijze waarop het bevoegd gezag ouders en leerlingen
      actief informeert over de totstandkoming van het schooladvies en het definitieve schooladvies, bedoeld in
      [artikel 51d, eerste en derde lid][ref10].

      2


