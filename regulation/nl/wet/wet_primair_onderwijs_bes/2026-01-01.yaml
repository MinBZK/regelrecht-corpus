        paragraaf: '1'
        afdeling: '1'
  - number: '57'
    text: |-
      1 Godsdienstonderwijs wordt gegeven door leraren daartoe aangewezen door kerkelijke gemeenten, plaatselijke kerken,
      of rechtspersonen met volledige rechtsbevoegdheid die zich blijkens hun statuten het geven van godsdienstonderwijs
      ten doel stellen. Levensbeschouwelijk vormingsonderwijs wordt gegeven door leraren daartoe aangewezen door
      volledige rechtsbevoegdheid bezittende organisaties op geestelijke grondslag.

      2 Het bevoegd gezag ziet erop toe dat dit onderwijs uitsluitend wordt gegeven door een leraar die blijkens een
      daartoe strekkende verklaring van de aanwijzende instantie:

      a. voldoet aan de bekwaamheidseisen die krachtens [artikel 35, eerste lid][ref1], voor het geven van dat onderwijs
      zijn vastgesteld, en

      b. zijn bekwaamheid onderhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel35
