  - number: '110'
    text: |-
      1 Het bestuurscollege stelt jaarlijks vast in welke mate het voor de door het openbaar lichaam in stand
      gehouden scholen meer dan wel minder uitgaven zal doen dan door het Rijk worden bekostigd. Deze vaststelling
      geschiedt voor het komende begrotingsjaar en het resterende deel van het vijfjarig tijdvak, bedoeld in
      [artikel 109, eerste lid][ref1].

      2 Indien voor het komende begrotingsjaar meer uitgaven zullen worden gedaan dan door het Rijk worden bekostigd,
      verleent het bestuurscollege in dat begrotingsjaar aan het bevoegd gezag van de niet door het openbaar
      lichaam in stand gehouden scholen een voorschot op het te verwachten overschrijdingsbedrag, bedoeld in
      [artikel 109, eerste lid][ref2].

      3 Indien uit het besluit van het bestuurscollege, bedoeld in het eerste lid, blijkt dat de hiervoor bedoelde
      meeruitgaven in de resterende jaren van het vijfjarig tijdvak geheel of ten dele worden gecompenseerd door minder
      uitgaven, wordt hiermee rekening gehouden bij de bepaling van de hoogte van het voorschot.

      4 Indien uit de jaarlijkse voorlopige vaststelling van de bedragen, bedoeld in [artikel 111, eerste lid][ref3],
      blijkt dat, in afwijking van hetgeen is vastgesteld bij het besluit van het bestuurscollege, bedoeld in het
      eerste lid, meer uitgaven zijn gedaan dan door het Rijk worden bekostigd, verleent het bestuurscollege alsnog een
      voorschot aan het bevoegd gezag van de niet door het openbaar lichaam in stand gehouden scholen.

      5 Bij de bepaling van de hoogte van het voorschot, bedoeld in het vierde lid, is het derde lid van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel109
