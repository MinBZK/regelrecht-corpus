  - number: '27'
    text: |-
      1 Het bevoegd gezag stelt samen met de bevoegde gezagsorganen die samenwerken in een samenwerkingsverband en met
      het expertisecentrum onderwijszorg indien [artikel 26, eerste lid][ref1], van toepassing is, jaarlijks voor 1 mei
      een gezamenlijk eilandelijk zorgplan vast voor het daaropvolgende schooljaar.

      2 Het eilandelijk zorgplan bevat in elk geval een beschrijving van:

      a. de wijze waarop wordt voldaan aan [artikel 26, eerste en derde lid][ref2],

      b. de wijze, waarop de bekostiging voor de zorgvoorzieningen, bedoeld in [artikel 68][ref3], wordt ingezet,

      c. de wijze waarop de subsidie voor de taken, bedoeld in [artikel 28, eerste lid][ref4], en voor zover van
      toepassing het zevende lid van dat artikel, wordt ingezet,

      d. de beoogde en bereikte kwalitatieve en kwantitatieve resultaten ten aanzien van de onderwijskundige opvang van
      de leerlingen, deelnemers, vavo-studenten en studenten met een specifieke onderwijsbehoefte,

      e. de procedures voor de handelingsgerichte diagnose van leerlingen, deelnemers, vavo-studenten en studenten, en

      f. de wijze waarop aan de ouders informatie wordt verstrekt over de zorgvoorzieningen.

      3 Het eilandelijk zorgplan wordt voor 15 mei voorafgaand aan het schooljaar waarop het betrekking heeft,
      toegezonden aan de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel26
