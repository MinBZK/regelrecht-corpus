  - number: '86'
    text: |-
      Voorzieningen komen voor bekostiging in aanmerking, mits op het op grond van [artikel 85, eerste lid][ref1],
      vastgestelde tijdstip,

      a. is voldaan aan de bij of krachtens de wet gestelde voorschriften, en

      b. de feiten en omstandigheden waarin de school verkeert, ten opzichte van de feiten en omstandigheden ten tijde
      van de vaststelling van de beschikking tot verlening niet ingrijpend zijn gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel85
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel86
