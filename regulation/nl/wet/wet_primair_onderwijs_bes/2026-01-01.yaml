  - number: '98'
    text: |-
      Het openbaar lichaam bekostigt aan het bevoegd gezag van een niet door het
      openbaar lichaam in stand gehouden school dat is onderworpen aan een of meer der in
      [artikel 43 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] bedoelde belastingen ter
      zake van onroerende zaken het bedrag dat is uitgegeven voor de belastingen met betrekking tot de in het openbaar
      lichaam gelegen gebouwen en terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel43
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '43'
  - number: '99'
    text: |-
      1 De bekostiging van een school is bestemd voor kosten voor personeel en exploitatie van die school.

      2 De bekostiging van de scholen wordt in ieder geval verstrekt voor de kosten van:

      a. de salarissen, toelagen, uitkeringen en vergoedingen voor het personeel;

      b. personeel op grond van voorschriften bij of krachtens de [Ambtenarenwet BES][ref1];

      c. de bijdragen voor het pensioen voor het personeel en dat van de nagelaten betrekkingen;

      d. het onderhoud van het gebouw en het terrein;

      e. het energie- en waterverbruik;

      f. de middelen;

      g. de administratie, het beheer en het bestuur;

      h. de loopbaanoriëntatie en -begeleiding;

      i. de schoonmaak van het gebouw en het terrein; en

      j. de publiekrechtelijke heffingen, met uitzondering van belastingen ter zake van onroerende zaken.

      3 Het bevoegd gezag wendt met in achtneming van het eilandelijk zorgplan de bekostiging aan voor de kosten, bedoeld
      in het tweede lid.

      4 Het bevoegd gezag kan de bekostiging mede aanwenden voor de kosten, bedoeld in het tweede lid, van:

      a. een andere school;

      b. een school voor voortgezet onderwijs;

      c. een instelling als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref2], en

      d. het expertisecentrum onderwijszorg.

      5 Het bevoegd gezag beheert de middelen van de school op zodanige wijze dat het voortbestaan van de school is
      verzekerd.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld ter uitvoering van het eerste lid.

      7 Bij ministeriële regeling kunnen regels worden gesteld over het door het bevoegd gezag uitzetten van gelden, het
      aangaan van geldleningen en het aangaan van verbintenissen voor financiële producten.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
      [ref2]: https://wetten.overheid.nl/BWBR0028395
