  - number: '26'
    text: |-
      1 Het bevoegd gezag is voor elk van zijn scholen aangesloten bij een samenwerkingsverband met, voor zover aanwezig
      in het openbaar lichaam:

      a. een of meer scholen,

      b. een of meer scholen voor voortgezet onderwijs,

      c. een of meer instellingen als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1],

      d. de uitvoeringsinstantie, bedoeld in [artikel 5, tweede lid, van de Wet sociale kanstrajecten jongeren BES][ref2],
      en

      e. een expertisecentrum onderwijszorg.

      2 In afwijking van het eerste lid kan een samenwerkingsverband bestaan uit de betrokkenen, bedoeld in de bedoeld in
      de onderdelen a, b, c of d die gezamenlijk een expertisecentrum onderwijszorg in stand houden.

      3 Het samenwerkingsverband stelt zich ten doel een samenhangend geheel van zorgvoorzieningen binnen en tussen
      scholen en in samenwerking met de betrokkenen, bedoeld in het eerste lid, onderdelen b tot en met e, te realiseren
      en wel zodanig dat zoveel mogelijk leerlingen, deelnemers, vavo-studenten en studenten een ononderbroken
      onderwijsloopbaan kunnen doormaken.

      4 Per openbaar lichaam is er één samenwerkingsverband.

      5 Indien een bevoegd gezag wenst deel te nemen aan het samenwerkingsverband, wordt deze deelname door de bevoegde
      gezagsorganen van het samenwerkingsverband niet geweigerd.

      6 Bij ministeriële regeling worden regels gesteld over de wijze waarop een geschil tussen de organisaties, bedoeld
      in het eerste lid, over aangelegenheden die het samenwerkingsverband aangaan, wordt beslecht.


      [ref1]: https://wetten.overheid.nl/BWBR0028395
      [ref2]: https://wetten.overheid.nl/BWBR0028506#Artikel5
