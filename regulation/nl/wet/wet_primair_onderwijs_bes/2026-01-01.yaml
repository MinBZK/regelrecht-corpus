  - number: '141'
    text: |-
      1 Onze Minister kan bepalen dat geen of slechts een gedeeltelijke bekostiging wordt verstrekt voor uitgaven die het
      gevolg zijn van schuld of nalatigheid van het bevoegd gezag.

      2 Indien de uitgaven bedoeld in het eerste lid, voor bekostiging door het Rijk in aanmerking komen, treedt het Rijk
      op het moment van een uitdrukkelijk besluit tot bekostiging in alle rechten die het bevoegd gezag ter zake tegen
      derden mocht hebben.

      3 Indien het openbaar lichaam een collectieve verzekering heeft afgesloten voor de vergoeding van schade, ontstaan
      aan gebouwen, terreinen of roerende zaken van een niet door het openbaar lichaam in stand gehouden school, heeft
      het bevoegd gezag van de desbetreffende school jegens het openbaar lichaam geen aanspraak op vergoeding van
      dergelijke schade, voor zover die collectieve verzekering de schade dekt.

      4 Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een niet door het openbaar lichaam in stand
      gehouden school voor vergoeding door het openbaar lichaam in aanmerking komt, treedt het openbaar lichaam op het
      moment van een uitdrukkelijk besluit tot vergoeding in alle rechten die het bevoegd gezag ter zake van die schade
      tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel141
  - number: '142'
    text: |-
      1 Het bevoegd gezag kan het persoonsgebonden nummer BES van een leerling gebruiken in het verkeer met de leerling
      op wie het nummer betrekking heeft, of met de ouders van deze leerling.

      2 Het bevoegd gezag verstrekt het persoonsgebonden nummer BES van iedere leerling aan Onze Minister, tezamen met de
      volgende gegevens van de leerling:

      a. geslacht, geboortedatum en postcode van de woonplaats;

      b. de datum van in- of uitschrijving;

      c. de groep;

      d. indien van toepassing voor- en vroegschoolse educatie;

      e. indien van toepassing de uitslag van een onder verantwoordelijkheid van de school afgenomen onafhankelijke
      eindtoets basisonderwijs;

      f. het advies omtrent het volgen van aansluitend voortgezet onderwijs bij het verlaten van de school, zoals
      opgenomen in het onderwijskundig rapport, bedoeld in [artikel 48][ref1];

      g. het registratienummer van de school;

      h. bekostigingsindicatie.

      3 Bij ministeriële regeling kan een nadere specificatie worden gegeven van de gegevens, bedoeld in het tweede
      en zevende lid, en kan worden bepaald welke van de gegevens, bedoeld in het tweede en zevende lid, niet langer
      behoeven te worden verstrekt. Bij ministeriële regeling kunnen voorts regels worden gesteld omtrent de tijdstippen
      en de wijze van verstrekking van de gegevens, bedoeld in het tweede en zevende lid.

      4 Het bevoegd gezag kan het persoonsgebonden nummer BES van een leerling, al dan niet tezamen met een of meer van
      de gegevens, bedoeld in het tweede en zevende lid, gebruiken in het verkeer met Onze Minister ten behoeve van de
      vaststelling van de bekostiging van de school.

      5 Het bevoegd gezag en het hoofd, bedoeld in artikel 1, onder d, van de Leerplichtwet BES, gebruiken het
      persoonsgebonden nummer BES van een leerling in contacten met een openbaar lichaam in het kader van de
      Leerplichtwet BES, tezamen met de gegevens die noodzakelijk zijn voor het toezicht op de naleving van die wet door
      het openbaar lichaam.

      6 Het bevoegd gezag gebruikt het persoonsgebonden nummer BES van een leerling in het contact met een andere school
      of een school voor ander onderwijs ten behoeve van de in- en uitschrijving van die leerling en bij het overleggen
      van het onderwijskundig rapport, bedoeld in [artikel 48][ref2].

      7 Indien de gegevens over de nationaliteit van de leerling niet zijn opgenomen in de basisadministratie, bedoeld in
      [artikel 1 van de Wet basisadministraties persoonsgegevens BES][ref3], worden deze gegevens door het bevoegd gezag
      verstrekt aan Onze Minister.

      8 Het bevoegd gezag kan het persoonsgebonden nummer BES van een leerling eenmalig gebruiken ten behoeve van het
      genereren van een pseudoniem voor deze leerling met het oog op het bieden van voorzieningen in het kader van het
      onderwijs en de begeleiding van leerlingen. Het bevoegd gezag draagt er zorg voor dat het pseudoniem wordt bewaard
      in de systemen waarin de leerlingen zijn geregistreerd.

      9 Het bevoegd gezag kan het pseudoniem, bedoeld in het achtste lid, gebruiken voor het genereren van een ander
      pseudoniem voor een leerling in het kader van de toegang tot en het gebruik van digitale leermiddelen of het
      digitaal afnemen van toetsen, waarbij het bevoegd gezag er zorg voor draagt dat dit andere pseudoniem wordt bewaard
      in de systemen waarin de leerlingen zijn geregistreerd. Dit andere pseudoniem wordt uitsluitend verstrekt aan
      een leverancier die een digitaal product of een digitale dienst aanbiedt bestaande uit leerstof of toetsen en de
      daarmee samenhangende digitale diensten.

      10 Bij algemene maatregel van bestuur kunnen andere gevallen worden aangewezen dan het geval, bedoeld in het
      negende lid, waarvoor het bevoegd gezag op basis van het pseudoniem, bedoeld in het achtste lid, een ander
      pseudoniem kan genereren. Daarbij worden in ieder geval de categorieën van ontvangers van dit andere pseudoniem
      aangewezen.

      11 Bij ministeriële regeling worden regels gesteld over de voorwaarden waaronder de pseudoniemen, bedoeld in het
      achtste tot en met het tiende lid, kunnen worden gegenereerd en gebruikt. Deze voorwaarden betreffen in ieder geval
      de duur en de beveiliging, waaronder de gescheiden opslag van de pseudoniemen.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel48
