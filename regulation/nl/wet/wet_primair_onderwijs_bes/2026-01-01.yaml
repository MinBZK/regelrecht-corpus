  - number: '54'
    text: |-
      1 Een eilandsraad kan besluiten dat een of meer openbare scholen in het openbaar lichaam in stand worden gehouden
      door een stichting die zich ten doel stelt het in stand houden van een of meer openbare scholen, al dan niet
      tezamen met openbare scholen voor voortgezet onderwijs.

      2 De eilandsraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.

      3 Een stichting die een openbare school in stand houdt, wordt opgericht door een openbaar lichaam, al dan niet
      tezamen met een of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid.

      4 Onverminderd [artikel 22a, eerste lid][ref1], is het statutaire doel van de stichting uitsluitend het geven van
      openbaar onderwijs overeenkomstig [artikel 46][ref2].

      5 De stichting oefent alle taken en bevoegdheden van het bevoegd gezag uit.

      6 Onverminderd het vierde lid voorzien de statuten in ieder geval in een regeling waarin een overheersende invloed
      van de overheid in het bestuur is verzekerd:

      a. de samenstelling, werkwijze en inrichting van het bestuur van de stichting,

      b. de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de eilandsraad en dat ten minste een derde gedeelte, doch geen meerderheid,
      van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn ingeschreven op de
      betrokken school of scholen,

      c. de termijn waarvoor de bestuursleden worden benoemd,

      d. de vaststelling van de begroting na goedkeuring door de eilandsraad en de vaststelling van de jaarrekening na
      instemming van de eilandsraad,

      e. de wijze waarop de eilandsraad toezicht op het bestuur uitoefent,

      f. de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,

      g. de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en

      h. de bevoegdheid de stichting te ontbinden.

      7 De goedkeuring, bedoeld in het zesde lid, onderdeel d, kan worden onthouden wegens strijd met het recht of met
      het algemeen belang, waaronder begrepen het financiële belang van het openbaar lichaam.

      8 De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de eilandsraad.

      9 Het bestuur brengt jaarlijks aan de eilandsraad verslag uit over de werkzaamheden, waarbij in ieder geval
      aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar gemaakt.

      10 De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.

      11 Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      eilandsraad de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen.

      12 De eilandsraad is in geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet
      bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de stichting te ontbinden.

      13 Indien de school een raad van toezicht heeft, is het zesde lid niet van toepassing en voorzien de statuten,
      onverminderd [artikel 25][ref3], in ieder geval in een regeling waarin een overheersende invloed van de overheid in
      de raad van toezicht is verzekerd:

      a. de samenstelling, werkwijze en inrichting van de raad van toezicht van de stichting,

      b. de wijze van benoeming, herbenoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien
      verstande dat de leden van de raad van toezicht worden benoemd door de eilandsraad en dat ten minste een derde
      gedeelte, doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen
      die zijn ingeschreven op de betrokken school of scholen,

      c. de termijn waarvoor de leden van de raad van toezicht worden benoemd,

      d. de vaststelling van de begroting en de jaarrekening,

      e. de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt,

      f. de bevoegdheid de stichting te ontbinden. Het achtste, negende en elfde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel25
