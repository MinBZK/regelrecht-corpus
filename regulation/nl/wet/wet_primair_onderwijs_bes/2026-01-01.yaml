    text: |-
      Over iedere leerling die de school verlaat, stelt de directeur, na overleg met het onderwijzend personeel, ten
      behoeve van de ontvangende school of school voor voortgezet onderwijs een onderwijskundig rapport op. Afschrift
      van dit rapport wordt aan de ouders van de leerling verstrekt. Bij algemene maatregel van bestuur worden nadere
      voorschriften omtrent dit rapport gegeven.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel48
  - number: '50'
    text: |-
      1 Het bevoegd gezag draagt zorg voor een voorziening voor leerlingen om de middagpauze onder toezicht door te
      brengen, indien ouders hierom verzoeken. Ingeval de voorziening, bedoeld in de eerste volzin, tot stand komt,
      draagt het bevoegd gezag er zorg voor dat:

      a. er een overblijfaanpak tot stand komt,

      b. overleg over de overblijfaanpak tot stand komt met degenen die met het toezicht op de leerlingen worden belast,
      en met de ouders,

      c. het overblijven plaats vindt in een veilige en kindvriendelijke ruimte, en

      d. ten minste de helft van degenen die met het toezicht op de leerlingen worden belast, een scholing heeft gevolgd
      op het gebied van het overblijven.

      2 De kosten die hieruit voortvloeien komen voor rekening van de ouders. Indien de leerlingen van de voorziening,
      bedoeld in de eerste volzin, gebruik maken, draagt het bevoegd gezag er zorg voor dat degene, die met het toezicht
      op de leerlingen wordt belast, voor wettelijke aansprakelijkheid verzekerd is. Het bevoegd gezag van een bijzondere
      school is, telkenmale voor de duur van een schooljaar, ontheven van de verplichting tot verzekering indien:

      a. deze verplichting zich naar zijn oordeel niet verdraagt met de godsdienstige of levensbeschouwelijke overtuiging
      die aan de school ten grondslag ligt; en

      b. het bevoegd gezag van zijn oordeel mededeling heeft gedaan aan de ouders.

      3 Het bevoegd gezag van een school draagt op daarvoor met ouders afgesproken dagen, zorg voor de organisatie van
      opvang van leerlingen, op doordeweekse niet-schooldagen, niet zijnde algemeen erkende feestdagen en op schooldagen
      gedurende de voor- en naschoolse periode, tussen bij ministeriële regeling te bepalen tijdstippen, indien een of
      meer ouders hierom verzoeken. De kosten die uit de opvang als bedoeld in de eerste volzin voortvloeien, komen voor
      rekening van de ouders.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel50
  - number: '51'
    text: |-
      1 Indien de inspectie op basis van een onderzoek als bedoeld in [artikel 11][ref1] of
      [artikel 15 van de Wet op het onderwijstoezicht][ref2], in het inspectierapport, bedoeld in
      [artikel 20 van genoemde wet][ref3], tot het oordeel is gekomen dat sprake is van een zeer zwakke school,
      informeert het bevoegd gezag de ouders van de leerlingen van de school hierover door middel van in ieder geval
      de toezending van de door de inspectie opgestelde samenvatting van het inspectierapport welke samenvatting
      gelijktijdig met het inspectierapport ter beschikking is gesteld van het bevoegd gezag. De toezending, bedoeld in
      de eerste volzin, geschiedt binnen vier weken na de vaststelling van het inspectierapport.

      2 Indien het bevoegd gezag niet of niet tijdig voldoet aan de verplichting, bedoeld in het eerste lid, zendt Onze
      Minister de samenvatting van het inspectierapport, bedoeld in het eerste lid, in de vijfde week na vaststelling van
      het inspectierapport aan de ouders van de leerlingen.


