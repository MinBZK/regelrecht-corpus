  - number: '75'
    text: |-
      1 De aanvraag, bedoeld in [artikel 72, tweede lid][ref1], wordt ingediend voor 1 november. De inspectie adviseert
      Onze Minister of de aanvraag voldoet aan de verplichtingen, bedoeld in artikel 72, derde lid, onderdeel b.

      2 Indien het bevoegd gezag het voornemen heeft om een aanvraag, bedoeld in het eerste lid, in te dienen, meldt het
      bevoegd gezag dit voor 1 juli aan Onze Minister voorafgaand aan die voorgenomen aanvraag. Bij ministeriële regeling
      kunnen nadere regels worden gesteld aan de wijze waarop deze melding plaatsvindt en kan een model voor de melding
      worden vastgesteld.

      3 Onze Minister controleert of de belangstellingsmeting, bedoeld in [artikel 72, derde lid, onderdeel a][ref2],
      juist en volledig is en besluit op basis van de aanvraag, bedoeld in artikel 72, tweede, derde en vijfde lid, voor
      1 juni of de school met ingang van 1 augustus van het kalenderjaar volgend op het besluit van Onze Minister voor
      bekostiging in aanmerking wordt gebracht. Indien Onze Minister de aanvraag op grond van de belangstellingsmeting
      en de voor de school geldende stichtingsnorm, bedoeld in artikel 72, vijfde lid, afwijst, blijft het advies van de
      inspectie, bedoeld in het eerste lid, achterwege.

      4 Onze Minister kan de aanvraag, bedoeld in [artikel 72, tweede lid][ref3], afwijzen indien de aanvraag is
      ingediend door een rechtspersoon, niet zijnde een gemeente, die reeds een of meer scholen in stand houdt en
      die een aanwijzing heeft ontvangen als bedoeld in [artikel 128, eerste lid][ref4], of waarvan een of meer van
      de bestuurders of toezichthouders deel uitmaakte of uitmaakt van een andere rechtspersoon die een dergelijke
      aanwijzing heeft ontvangen welke aanwijzing onherroepelijk is geworden en ten tijde van de aanvraag nog geen vijf
      jaren oud is gerekend vanaf de ontvangst van het besluit tot toepassing van artikel 128, eerste lid.

      5 De bekostiging vangt aan op 1 augustus. De aanspraak op bekostiging vervalt indien uiterlijk op de eerste
      schooldag na1 augustus in het kalenderjaar na het besluit van Onze Minister geen onderwijs aan de nieuwe school
      wordt gegeven.

      6 In afwijking van het vijfde lid en op aanvraag van het bevoegd gezag of het openbaar lichaam van het eiland van
      vestiging van de school kan Onze Minister besluiten in bijzondere gevallen de aanspraak op bekostiging voor een
      jaar te handhaven. Indien Onze Minister daartoe besluit, vervalt de aanspraak op bekostiging, indien uiterlijk
      op de eerste schooldag na 1 augustus in het tweede kalenderjaar na het in het vijfde lid bedoelde besluit geen
      onderwijs wordt gegeven.

      7 Dit artikel is niet van toepassing op de totstandkoming van een nevenvestiging, bij omzetting van een
      bekostigde bijzondere school in een bekostigde openbare school of omgekeerd en bij de totstandkoming van een
      samenwerkingsschool.

      8 Onverminderd [artikel 3:41 van de Algemene wet bestuursrecht][ref5] worden besluiten, bedoeld in het derde,
      vierde en vijfde lid, gepubliceerd in de Staatscourant.

      9 Voor uitsluitend de controle of de gegevens uit de ouderverklaringen, bedoeld in
      [artikel 72a, vijfde lid, onderdeel a][ref6], juist en volledig zijn, maakt Onze Minister gebruik van het
      burgerservicenummer van een van de ouders en het kind waarop de ouderverklaring betrekking heeft.

      10 Onze Minister stelt op voordracht van de inspectie een kader vast waarin de werkwijze voor het advies, bedoeld
      in het eerste lid, is vastgelegd. Deze werkwijze omvat in ieder geval een gesprek over de aanvraag met het bevoegd
      gezag dat de aanvraag heeft ingediend. Dit kader wordt bekendgemaakt in de Staatscourant.

      11 Het bestuurscollege van de beoogde plaats van vestiging van de school kan voor 1 december, volgend op de datum,
      genoemd in het eerste lid, bij Onze Minister een zienswijze naar voren brengen.


