  - number: '4'
    text: |-
      1 Onderwijsondersteunende werkzaamheden als bedoeld in [artikel 35, derde lid][ref1], mogen slechts worden verricht
      door degene die:

      a. in het bezit is van een verklaring omtrent het gedrag die op het tijdstip van overlegging aan het bevoegd gezag
      niet ouder is dan zes maanden, en

      b. in het bezit is van een getuigschrift afgegeven krachtens de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], de [Wet educatie en beroepsonderwijs][ref3]
      of de [Wet educatie en beroepsonderwijs BES][ref4], waaruit blijkt dat is voldaan aan de in
      [artikel 35, derde lid][ref5], bedoelde bekwaamheidseisen,

      c. het bezit is van een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref6], verleend ten aanzien van de door hem te
      verrichten werkzaamheden, of

      d. volgens bij algemene maatregel van bestuur te geven regels zijn bekwaamheid heeft aangetoond, en

      e. niet krachtens rechterlijke uitspraak is uitgesloten van het verrichten van deze werkzaamheden.

      2 De onderwijsondersteunende functionaris die niet voldoet aan de eisen van het eerste lid, onder b, c of d,
      mag voor zover het werkzaamheden betreft waarvoor op grond van [artikel 35, derde lid][ref7], bekwaamheidseisen
      zijn vastgesteld, niettemin met die werkzaamheden worden belast, voor een periode van ten hoogste twee jaren.
      Aan de eerste volzin wordt uitsluitend toepassing gegeven indien het bevoegd gezag en betrokkene in ieder geval
      schriftelijk hebben verklaard dat betrokkene verplicht is zich in te spannen om binnen twee jaren alsnog te voldoen
      aan de bekwaamheidseisen voor die werkzaamheden.

      3 Ten aanzien van studenten aan een opleiding als bedoeld in
      [artikel 7.7, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref8],
      studenten aan de beroepsbegeleidende leerweg van een opleiding als bedoeld in
      [artikel 7.2.2 van de Wet educatie en beroepsonderwijs][ref9] en studenten aan de beroepsbegeleidende
      leerweg van een opleiding als bedoeld in [artikel 7.2.2 van de Wet educatie en beroepsonderwijs BES][ref10]
      die in het kader van die opleiding onderwijsondersteunende werkzaamheden verrichten waarvoor op grond van
      [artikel 35, derde lid][ref11], bekwaamheidseisen zijn vastgesteld, kan voor de duur van die werkzaamheden worden
      afgeweken van het eerste lid, onder b tot en met d.


