  - number: '77'
    text: Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel77
  - number: '78'
    text: |-
      1 De eilandsraad of het bestuurscollege draagt overeenkomstig het bepaalde in deze afdeling ten behoeve van de
      scholen zorg voor de voorzieningen in de huisvesting op het grondgebied van het openbaar lichaam. Deze huisvesting
      is zodanig dat kan worden voldaan aan de redelijke eisen die het onderwijs aan de huisvesting van scholen in het
      openbaar lichaam stelt. De eilandsraad of het bestuurscollege behandelt daarbij de door het openbaar lichaam in
      stand gehouden scholen en de andere scholen op gelijke voet.

      2 Bij algemene maatregel van bestuur worden bruto vloeroppervlakten per gelijktijdig aanwezige leerling
      voorgeschreven die voorzieningen in de huisvesting ten minste dienen te bevatten.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel78
  - number: '79'
    text: |-
      1 Voor de toepassing van deze afdeling worden onder voorzieningen in de huisvesting begrepen:

      a. voor blijvend onderscheidenlijk voor tijdelijk gebruik bestemde voorzieningen, bestaande uit:

      1°. nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een
      gedeelte daarvan, terreinen, alsmede eerste aanschaf van onderwijsleerpakketten en meubilair,

      2°. uitbreiding van de onder 1° bedoelde voorzieningen, en

      3°. medegebruik van een ruimte die geschikt is voor het onderwijs;

      b. herstel van constructiefouten aan het gebouw, alsmede herstel en vervanging in verband met schade aan gebouw,
      onderwijsleerpakketten en meubilair in geval van bijzondere omstandigheden.

      2 De kosten van bouwvoorbereiding kunnen tot de kosten van huisvesting worden gerekend.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel79
  - number: '80'
    text: |-
      1 Het bestuurscollege stelt jaarlijks, na overleg met de betrokken bevoegde gezagsorganen, ten behoeve van het
      eerstvolgende jaar voor een door het college te bepalen tijdstip een bekostigingsplafond vast voor de bekostiging
      van de voorzieningen in de huisvesting voor:

      a. scholen, en

      b. scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs,
      voor voorbereidend beroepsonderwijs en voor praktijkonderwijs.

      2 Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      in het eerste lid bedoelde scholen op het grondgebied van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel80
  - number: '81'
    text: |-
      1 Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat een voorziening in de
      huisvesting wenst, dient een aanvraag voor 1 september voorafgaand aan het jaar waarop de aanvraag betrekking heeft
      in bij het bestuurscollege.

      2 De eilandsraad stelt bij verordening de vereisten van de aanvraag vast.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op de door het openbaar lichaam in stand gehouden
      scholen.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel81
  - number: '82'
    text: |-
      1 Het bestuurscollege beslist voor 1 januari van het jaar waarop de aanvraag betrekking heeft op de aanvraag.
      Het bestuurscollege geeft het bevoegd gezag de gelegenheid om een onvolledige aanvraag binnen een door het
      bestuurscollege te stellen termijn aan te vullen.

      2 Het bestuurscollege kan besluiten de aanvraag niet te behandelen,

      indien:

      a. het bevoegd gezag niet heeft voldaan aan de vereisten voor het in behandeling nemen van de aanvraag, uit de
      eilandsverordening, bedoeld in [artikel 81, tweede lid][ref1], of

      b. de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanvraag of voor de
      voorbereiding van de beschikking.

      3 Indien het bekostigingsplafond, bedoeld in [artikel 80][ref2], niet toereikend is, wordt de volgorde van
      verlening van bekostiging bepaald op basis van de urgentie van de gevraagde voorziening.

      4 De beschikking van het bestuurscollege kan een gedeelte van de gewenste voorziening dan wel een andere
      voorziening dan gewenst omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel80
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel82
