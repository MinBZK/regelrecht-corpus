      In afwijking van [artikel 3, tweede lid][ref1], kunnen degenen die op de dag voorafgaand aan het tijdstip van de
      inwerkingtreding van dit artikel, werkzaam waren op een van de scholen voor basisonderwijs in de openbare lichamen,
      het onderwijs in de onderwijsactiviteit zintuiglijke en lichamelijke oefening in het eerste tot en met achtste
      schooljaar geven.


