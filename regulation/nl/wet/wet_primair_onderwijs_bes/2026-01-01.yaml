    text: |-
      Het in artikel 140 en het in [artikel 142][ref1] bedoelde bestuur verstrekt aan Onze Minister alle inlichtingen
      die deze nodig acht ten behoeve van een goede naleving van deze afdeling. Op verzoek van de inspectie zendt het
      bestuur een overzicht van afgegeven geschiktheidsverklaringen en bekwaamheidsonderzoeken waaraan met goed gevolg
      is deelgenomen.


