  - number: '15'
    text: |-
      1 Het schoolplan bevat een beschrijving van het beleid met betrekking tot de kwaliteit van het onderwijs dat
      binnen de school wordt gevoerd, en omvat in elk geval het onderwijskundig beleid, het personeelsbeleid en het
      stelsel van kwaliteitszorg. In het schoolplan wordt aangegeven op welke wijze de identiteitscommissie, bedoeld
      in [artikel 22a][ref1], invulling geeft aan het openbare karakter onderscheidenlijk de identiteit voor zover het
      betreft een samenwerkingsschool. Het schoolplan omvat mede het beleid ten aanzien van de aanvaarding van materiële
      bijdragen of geldelijke bijdragen, niet zijnde ouderbijdragen of op de onderwijswetgeving gebaseerde bijdragen,
      indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee de leerlingen binnen de schooltijden en
      tijdens de activiteiten die worden georganiseerd onder verantwoordelijkheid van het bevoegd gezag, alsmede tijdens
      het overblijven, zullen worden geconfronteerd.

      2 De beschrijving van het onderwijskundig beleid omvat in elk geval:

      a. de uitwerking van de wettelijke voorschriften betreffende de uitgangspunten, de doelstelling en de inhoud van
      het onderwijs,

      b. de door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs in een
      onderwijsprogramma,

      c. het pedagogisch-didactisch klimaat en het schoolklimaat,

      d. het zorg dragen voor de veiligheid op school, bedoeld in [artikel 6a][ref2],

      e. het programma voor vroegschoolse educatie.

      Bij de beschrijving van het onderwijskundig beleid worden tevens de voorzieningen betrokken die zijn getroffen voor
      leerlingen met specifieke onderwijsbehoeften.

      3 De beschrijving van het personeelsbeleid omvat in elk geval:

      a. het voldoen aan de eisen van bevoegdheid en de wijze waarop de bekwaamheid wordt onderhouden,

      b. de maatregelen met betrekking tot het personeel die bijdragen aan de ontwikkeling en de uitvoering van het
      onderwijskundig beleid, en

      c. het pedagogisch-didactisch handelen van het onderwijspersoneel.

      4 De beschrijving van het stelsel van kwaliteitszorg omvat in elk geval het zorg dragen voor:

      a. het bewaken dat een ononderbroken ontwikkelingsproces van leerlingen mogelijk wordt gemaakt en dat het onderwijs
      wordt afgestemd op de ontwikkeling van leerlingen, bedoeld in [artikel 10, eerste lid][ref3], mede met behulp van
      het leerling- en onderwijsvolgsysteem, bedoeld in [artikel 51a, eerste lid][ref4],

      b. het vaststellen welke maatregelen ter verbetering nodig zijn, en

      c. het vorm geven aan de uitwerking van het eilandelijk zorgplan, bedoeld in [artikel 27][ref5].


