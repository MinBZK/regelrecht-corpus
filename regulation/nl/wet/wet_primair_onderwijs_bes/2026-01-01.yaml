      1 In afwijking van [artikel 7, eerste lid, van de Wet administratieve rechtspraak BES][ref1] kan een belanghebbende
      beroep instellen bij het Gemeenschappelijke Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint
      Eustatius en Saba tegen:

      a. een besluit of een van rechtswege verleende goedkeuring als bedoeld in de [afdelingen 2][ref2] en [8][ref3] van
      deze titel,

      b. een besluit als bedoeld in [artikel 104, eerste lid][ref4], en

      c. een besluit als bedoeld in [artikel 103][ref5].

      2 De [artikelen 54][ref6] en [55 Wet administratieve rechtspraak BES][ref7] zijn van overeenkomstige toepassing.


