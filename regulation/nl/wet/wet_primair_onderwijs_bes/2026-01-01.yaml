      [artikel 1.1, onder g, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];
        - *instellingsbestuur:* het instellingsbestuur, bedoeld in
      [artikel 1.1, onderdeel j, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], met
      dien verstande dat voor zover het openbare instellingen betreft, de [artikelen 9.2, tweede lid][ref3],
      [10.9, tweede lid][ref4], en [11.1, tweede lid, van die wet][ref5] van overeenkomstige toepassing zijn.


