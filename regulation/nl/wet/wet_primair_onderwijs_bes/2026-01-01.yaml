  - number: '83'
    text: |-
      1 In afwijking van de termijnen genoemd in de [artikelen 81][ref1] en [82][ref2], beslist het bestuurscollege
      binnen vier weken op een aanvraag voor een voorziening in de huisvesting die gelet op de voortgang van het
      onderwijs geen uitstel kan lijden.

      2 Het bestuurcollege wijst de aanvraag af, indien:

      a. het besluit over de voorziening kan worden genomen met inachtneming van de termijn, bedoeld in
      [artikel 82, eerste lid][ref3], of

      b. een van de weigeringsgronden, genoemd in
      [artikel 84, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref4], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel81
