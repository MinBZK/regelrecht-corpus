  - number: '105'
    text: |-
      1 Het bestuurscollege stelt na overleg met de bevoegde gezagen van de niet door het openbaar lichaam in stand
      gehouden scholen het aantal uren per week vast dat per groep leerlingen ten hoogste:

      a. ter beschikking wordt gesteld in een ruimte voor het onderwijs in lichamelijke oefening, of

      b. voor bekostiging voor de exploitatie van een ruimte voor het onderwijs in lichamelijke oefening in aanmerking
      komt.

      2 Het aantal uren, bedoeld in het eerste lid, wordt vastgesteld op ten minste twee uren.

      3 Het bestuurscollege stelt de hoogte vast van:

      a. de bekostiging, bedoeld in het eerste lid, onder b, en

      b. de bekostiging voor de vaste kosten van de exploitatie van een ruimte voor lichamelijke oefening waarvan de
      eigendom berust bij het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school.

      4 De hoogte van de bekostiging, bedoeld in het derde lid, kan verschillend worden vastgesteld, afhankelijk van de
      oppervlakte van de ruimte, alsmede tussen ruimten voor de exploitatie waarvan op grond van de onderwijswetgeving
      bekostiging wordt verleend en ruimten waarvoor dat niet het geval is.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel105
  - number: '106'
    text: |-
      1 Het openbaar lichaam verstrekt jaarlijks aan het bevoegd gezag van een niet door het openbaar lichaam in stand
      gehouden school dat eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening:

      a. een bedrag dat wordt bepaald ingevolge [artikel 105][ref1], en

      b. voor zover het gebruik van die ruimte ontoereikend is een overeenkomstig het tweede lid vastgesteld bedrag.

      2 Voor zover geen ruimte ter beschikking is gesteld als bedoeld in [artikel 105, eerste lid onderdeel a][ref2],
      verstrekt het openbaar lichaam jaarlijks aan het bevoegd gezag van een niet door het openbaar lichaam in stand
      gehouden school dat geen eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening een bedrag dat
      wordt bepaald ingevolge artikel 105, eerste lid onderdeel b, en derde lid onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel105
