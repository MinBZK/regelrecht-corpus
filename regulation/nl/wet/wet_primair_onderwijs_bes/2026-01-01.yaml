  - number: '122'
    text: |-
      1 Onze Minister kan het bevoegd gezag een aanwijzing tot het nemen van een of meer maatregelen geven, indien sprake
      is van wanbeheer.

      2 Onder wanbeheer wordt verstaan:

      a. financieel wanbeleid;

      b. het in ernstige of langdurig mate nalaten om, in ieder geval in strijd met [artikel 13][ref1], maatregelen
      te treffen die noodzakelijk zijn voor het waarborgen van de kwaliteit en de goede voortgang van het onderwijs,
      waaronder de deugdelijke afsluiting daarvan;

      c. het door een bestuurder of toezichthouder ongerechtvaardigd verrijken van het bevoegd gezag, zichzelf of een
      derde;

      d. het in de hoedanigheid van bestuurder of toezichthouder handelen in strijd met wettelijke bepalingen waardoor
      financieel voordeel wordt behaald ten gunste van het bevoegd gezag, zichzelf of een derde;

      e. het in ernstige mate verwaarlozen van de zorg voor wat door redelijkheid en billijkheid wordt gevorderd in de
      omgang met betrokkenen in de schoolorganisatie, waaronder in ieder geval wordt verstaan intimidatie of bedreiging
      van personeel, leerlingen of ouders door een bestuurder of toezichthouder;

      f. het handelen in strijd met de zorgplicht voor de veiligheid, bedoeld in [artikel 6a][ref2], dat leidt of dreigt
      te leiden tot het toebrengen van ernstige sociale, psychische of fysieke schade aan een of meer leerlingen;

      g. het structureel of flagrant handelen in strijd met de burgerschapsopdracht, bedoeld in
      [artikel 10, derde lid en lid 3a][ref3], dat leidt of dreigt te leiden tot ernstige aantasting van een of meer
      basiswaarden van de democratische rechtsstaat.

      3 Onze Minister motiveert in de aanwijzing waarom het doel van de aanwijzing niet met een minder zwaar middel kan
      worden bereikt.

      4 De aanwijzing vermeldt de termijn waarbinnen zij moet worden uitgevoerd.

      5 Voordat Onze Minister een spoedaanwijzing geeft heeft de inspectie een onderzoek als bedoeld in
      [artikel 11][ref4] of [artikel 15 van de Wet op het onderwijstoezicht][ref5] verricht en daarover een
      inspectierapport uitgebracht als bedoeld in [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref6],
      waaruit volgt dat sprake is van wanbeheer als bedoeld in het tweede lid.


