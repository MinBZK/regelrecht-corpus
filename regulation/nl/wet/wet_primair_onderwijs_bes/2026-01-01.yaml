  - number: '143'
    text: |-
      Onverminderd het overigens bij of krachtens de wet bepaalde omtrent het gebruik van het ID-nummer dat van de
      leerling is opgenomen in de basisadministratie persoonsgegevens van het openbaar lichaam, gebruikt het openbaar
      lichaam het persoonsgebonden nummer BES van een leerling uitsluitend ten behoeve van een registratie van
      leerplichtige jongeren in het belang van het toezicht op de naleving van de [Leerplichtwet BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030281
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel143
