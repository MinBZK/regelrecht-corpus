  - number: 34a
    text: |-
      1 Het bevoegd gezag bewaart een afschrift van de verklaring omtrent het gedrag van een persoon die:

      a. werkzaam is als of voor een particuliere onderwijsaanbieder; en

      b. werkzaamheden verricht die een bijdrage leveren aan het onderwijsleerproces en die plaatsvinden:

      1°. in het schoolgebouw tijdens of aansluitend op de onderwijstijd; of

      2°. onder verantwoordelijkheid van het bevoegd gezag.

      2 Het bevoegd gezag bewaart het afschrift, bedoeld in het eerste lid, gedurende het schooljaar waarin de
      werkzaamheden worden verricht.

      3 Het bevoegd gezag controleert ieder schooljaar voorafgaand aan de eerste keer dat de persoon, bedoeld in het
      eerste lid, werkzaamheden verricht of de verklaring omtrent het gedrag waarvan een afschrift wordt verstrekt niet
      ouder is dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel34a
  - number: '35'
    text: |-
      1 Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor leraren.

      2 Bij algemene maatregel van bestuur kunnen bekwaamheidseisen worden vastgesteld voor werkzaamheden
      van leidinggevende aard die nauw verband houden met het pedagogisch-didactische klimaat op de school of
      die onderwijskundige leiding omvatten, en kunnen ook voor andere werkzaamheden van leidinggevende aard
      bekwaamheidseisen worden vastgesteld.

      3 Bij algemene maatregel van bestuur kunnen bekwaamheidseisen worden vastgesteld voor bij die maatregel aan te
      wijzen onderwijsondersteunende werkzaamheden die rechtstreeks verband houden met het onderwijsleerproces.

      4 De in het eerste lid bedoelde bekwaamheidseisen zijn gericht op het handelen in het onderwijsleerproces, het
      algemeen professioneel handelen en het werken binnen een onderwijsorganisatie. Zij omvatten in elk geval eisen ten
      aanzien van:

      a. pedagogisch-didactische kennis, inzicht en vaardigheden, en

      b. vakbekwaamheid.

      5 Onze Minister stelt een beroepsorganisatie die hij vanuit het oogpunt van beroepskwaliteit representatief acht
      voor onderwijspersoneel als bedoeld in deze wet, in de gelegenheid hem een voorstel te doen voor de in het eerste,
      tweede of derde lid voorgeschreven bekwaamheidseisen en kan een representatief geachte beroepsorganisatie in de
      gelegenheid stellen hem een voorstel te doen voor bekwaamheidseisen die op grond van het tweede lid kunnen worden
      vastgesteld. Onze Minister stelt deze organisatie vervolgens in elk geval eenmaal in de zes jaar in de gelegenheid,
      hem een voorstel te doen over ongewijzigde handhaving of wijziging van de bekwaamheidseisen voor zover vastgesteld.
      Uit een voorstel als bedoeld in de eerste of tweede volzin blijkt tevens, in hoeverre dat voorstel mede steun
      geniet van een vertegenwoordiging van bevoegde gezagsorganen en ouders van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel35
  - number: '36'
    text: |-
      Het bevoegd gezag beschikt ten aanzien van elk personeelslid dat een functie of werkzaamheden verricht waarvoor
      bekwaamheidseisen zijn vastgesteld, over geordende gegevens met betrekking tot de bekwaamheid en het onderhouden
      van de bekwaamheid. Ten behoeve van de onderlinge vergelijkbaarheid en herkenbaarheid van de gegevens kunnen bij
      ministeriële regeling voorschriften worden vastgesteld over de inrichting en wijze van ordening van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel36
  - number: '37'
    text: |-
      1 De [Ambtenarenwet BES][ref1] en de daarop berustende regelingen zijn voor het personeel van een school voor
      bijzonder onderwijs van overeenkomstige toepassing.

      2 Voor de salarissen en toelagen van het personeel wordt een regeling vastgesteld bij eilandsbesluit.

      3 Het bestuurscollege stelt de regeling, bedoeld in het tweede lid, dan wel een wijziging daarvan niet vast
      dan nadat daarover op overeenstemming gericht overleg is gevoerd met de bevoegde gezagsorganen en met de
      onderwijsvakbonden of, bij het ontbreken daarvan, met een representatief te achten vertegenwoordiging van het
      personeel. [Artikel 101 van de Ambtenarenwet BES][ref2] is niet van toepassing op de vaststelling dan wel wijziging
      van de regeling, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
      [ref2]: https://wetten.overheid.nl/BWBR0028215#Artikel101
