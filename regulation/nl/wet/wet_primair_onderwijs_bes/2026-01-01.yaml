  - number: '95'
    text: |-
      In afwijking van deze afdeling kan de eilandsraad besluiten dat jaarlijks een bedrag voor huisvestingskosten wordt
      betaald aan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school. De eilandsraad neemt
      het besluit in overeenstemming met het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel95
  - number: '96'
    text: |-
      Het bevoegd gezag van een niet door het desbetreffende openbaar lichaam in stand gehouden school is gehouden
      aan de eilandsraad onderscheidenlijk het bestuurscollege alle inlichtingen te verschaffen die de eilandsraad
      onderscheidenlijk bestuurscollege voor een adequate uitvoering van de bepalingen in deze afdeling noodzakelijk
      achten.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel96
  - number: '97'
    text: |-
      1 Het bevoegd gezag, dan wel het openbaar lichaam dat eigenaar is van een schoolgebouw, zorgt voor het deel van
      de exploitatie waarop de bekostiging, bedoeld in [artikel 99, tweede lid, aanhef en onderdelen d, e en j][ref1],
      betrekking heeft.

      2 Het bevoegd gezag van een bijzondere school dat eigenaar is van een schoolgebouw, kan met het bestuurscollege
      overeenkomen dat het openbaar lichaam het in het eerste lid bedoelde deel van de exploitatie, bedoeld in het eerste
      lid, geheel of gedeeltelijk verzorgt.

      3 Het bevoegd gezag dat eigenaar is van een schoolgebouw kan met een bevoegd gezag dat gebruikmaakt van dat
      schoolgebouw overeenkomen dat het laatstgenoemde bevoegd gezag een deel van de exploitatie, bedoeld in het eerste
      lid, geheel of gedeeltelijk verzorgt.

      4 Indien het openbaar lichaam eigenaar is van het schoolgebouw, kan het bevoegd gezag van een bijzondere school
      met het openbaar lichaam overeenkomen dat het bevoegd gezag het deel van de exploitatie, bedoeld in het eerste lid,
      geheel of gedeeltelijk verzorgt.

      5 Het bevoegd gezag zorgt voor het deel van de exploitatie waarop de bekostiging, bedoeld in
      [artikel 99, tweede lid, aanhef en onderdeel f, g en i][ref2], betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel99
