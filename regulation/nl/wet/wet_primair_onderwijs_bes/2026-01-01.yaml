  - number: '72'
    text: |-
      1 Onze Minister kan een school voor bekostiging in aanmerking brengen.

      2 De bekostiging van een openbare en een bijzondere school kan slechts een aanvang nemen indien het bevoegd
      gezag een aanvraag daartoe heeft ingediend bij Onze Minister. Deze aanvraag vermeldt of het openbaar of bijzonder
      onderwijs betreft, en de beoogde plaats van vestiging van de school.

      3 De aanvraag gaat vergezeld van:

      a. een belangstellingsmeting als bedoeld in [artikel 72a][ref1];

      b. het voorgenomen beleid over de kwaliteit van het onderwijs dat binnen de school zal worden gevoerd, voor zover
      dit betreft de uitwerking van de wettelijke voorschriften voor:

      1° de inhoud van het onderwijs, bedoeld in [artikel 10, derde lid][ref2];

      2° de inrichting van het onderwijs, bedoeld in [artikel 10, eerste lid][ref3] en een leerlingvolgsysteem als
      bedoeld in artikel 10, vierde lid;

      3° de inrichting van het onderwijs, bedoeld in [artikel 10, zesde lid][ref4];

      4° de inhoud van het onderwijs, die dekkend zal zijn voor de kerndoelen, bedoeld in [artikel 11][ref5] of
      [12][ref6]; en

      5° de scheiding tussen de functies van bestuur en het toezicht daarop, bedoeld in [artikel 23][ref7] en [24][ref8]
      en, indien toepassing wordt gegeven aan [artikel 32][ref9], een beschrijving van de over te dragen taken;

      c. een document waaruit blijkt dat het openbaar lichaam van het eiland van vestiging van de school en de bevoegde
      gezagsorganen van de scholen en vestigingen binnen het voedingsgebied van de school zijn gevraagd om te overleggen
      over het voornemen tot het doen van een aanvraag om bekostiging; en

      d. een verklaring omtrent het gedrag van de personen die het bestuur en het intern toezicht vormen en die op het
      tijdstip van het doen van de aanvraag niet ouder is dan zes maanden.

      4 De aanvraag bevat tevens:

      a. een beschrijving van het beleid met betrekking tot de bewaking en verbetering van de kwaliteit van het
      onderwijs;

      b. een beschrijving van de beoogde samenstelling van de formatie van de school;

      c. een beschrijving van de wijze waarop invulling wordt gegeven aan de voorschriften die worden gesteld aan de
      bekwaamheid van leraren, en degenen die onderwijsondersteunende werkzaamheden verrichten en werkzaamheden verricht
      van leidinggevende aard;

      d. een beschrijving van de wijze waarop invulling wordt gegeven aan de zorg voor de sociale, psychische en fysieke
      veiligheid van leerlingen op school;

      e. een meerjarenbegroting over de eerste drie schooljaren die is gebaseerd op de bekostiging die de school zal
      ontvangen gegeven het aantal te verwachten leerlingen in die periode;

      f. de verwachtingen met betrekking tot de huisvesting;

      g. informatie over de hoogte van en het beleid ten aanzien van de vrijwillige geldelijke bijdrage die van de ouders
      zal worden gevraagd en het jaarlijks verwachte totaalbedrag van die bijdragen; en

      h. een beschrijving van de wijze waarop uitvoering wordt gegeven aan de medezeggenschap in de school.

      5 Een school wordt slechts voor bekostiging in aanmerking gebracht indien op grond van de belangstellingsmeting
      aannemelijk is dat zij binnen 8 jaar vanaf de datum van ingang van de bekostiging zal worden bezocht door ten
      minste 200 leerlingen.

      6 De [artikelen 73 tot en met 75][ref10] zijn niet van toepassing bij omzetting van een bekostigde bijzondere
      school in een bekostigde openbare school of omgekeerd.

      7 De bekostiging kan slechts aanvangen per 1 augustus van een schooljaar.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de elementen, bedoeld in het
      tweede lid.

      9 Bij ministeriële regeling kunnen nadere regels worden gesteld aan de wijze waarop de aanvraag plaatsvindt en kan
      een model voor de aanvraag worden vastgesteld.


