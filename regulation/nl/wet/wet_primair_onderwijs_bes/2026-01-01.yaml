      1 Het openbaar onderwijs draagt bij aan de ontwikkeling van de leerlingen met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse en Caribische samenleving en met
      onderkenning van de betekenis van de verscheidenheid van die waarden.

      2 Openbare scholen zijn toegankelijk voor alle kinderen zonder onderscheid van godsdienst of levensbeschouwing.

      3 Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel52
  - number: '53'
    text: |-
      1 Een eilandsraad kan bij verordening een openbare rechtspersoon instellen die tot doel heeft een of meer openbare
      scholen in het openbaar lichaam in stand te houden, al dan niet tezamen met openbare scholen voor voortgezet
      onderwijs.

      2 De eilandsraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.

      3 De openbare rechtspersoon oefent alle taken en bevoegdheden uit van het bevoegd gezag. Hij bezit
      rechtspersoonlijkheid.

      4 De verordening, bedoeld in het eerste lid, voorziet in ieder geval in een regeling waarin een overheersende
      invloed van de overheid in het bestuur is verzekerd, en waarin voorts wordt geregeld:

      a. de samenstelling, werkwijze en inrichting van het bestuur van de openbare rechtspersoon,

      b. de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de eilandsraad en dat ten minste een derde gedeelte, doch geen meerderheid,
      van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn ingeschreven op de
      betrokken school of scholen,

      c. de termijn waarvoor de bestuursleden worden benoemd,

      d. de vaststelling van de begroting na goedkeuring door de eilandsraad en de vaststelling van de jaarrekening na
      instemming van de eilandsraad,

      e. de wijze waarop de eilandsraad toezicht op het bestuur uitoefent,

      f. de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden, en

      g. de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode
      ten minste 5 jaren bedraagt.

      5 De goedkeuring, bedoeld in het vierde lid, onderdeel d, kan worden onthouden wegens strijd met het recht of met
      het algemeen belang, waaronder begrepen het financiële belang van het openbaar lichaam.

      6 Het bestuur brengt jaarlijks aan de eilandsraad verslag uit over de werkzaamheden, waarbij in ieder geval
      aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar gemaakt.

      7 De vergaderingen van het bestuur van de openbare rechtspersoon zijn openbaar, tenzij het bestuur anders beslist,
      op gronden, vermeld in de verordening.

      8 Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      eilandsraad de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen.

      9 De eilandsraad is in geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet
      bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de openbare rechtspersoon te ontbinden.

      10 Indien de school een raad van toezicht heeft, is het vierde lid niet van toepassing en voorziet de verordening,
      bedoeld in het eerste lid, onverminderd [artikel 25][ref1], in ieder geval in een regeling waarin een overheersende
      invloed van de overheid in de raad van toezicht is verzekerd, en waarin voorts wordt geregeld:

      a. de samenstelling, werkwijze en inrichting van de raad van toezicht van de openbare rechtspersoon,

      b. de wijze van benoeming, herbenoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien
      verstande dat de leden van de raad van toezicht worden benoemd door de eilandsraad en dat ten minste een derde
      gedeelte, doch geen meerderheid, van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen
      die zijn ingeschreven op de betrokken school of scholen,

      c. de termijn waarvoor de leden van de raad van toezicht worden benoemd,

      d. de vaststelling van de begroting en de jaarrekening, en

      e. de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode
      ten minste 5 jaren bedraagt. Het vijfde, zesde en achtste lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel25
