      Het bekwaamheidsonderzoek strekt ertoe, vast te stellen of de leraar voldoet aan de in
      [artikel 35, eerste lid][ref1], bedoelde bekwaamheidseisen voor het onderwijs waarvoor die eisen zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel35
