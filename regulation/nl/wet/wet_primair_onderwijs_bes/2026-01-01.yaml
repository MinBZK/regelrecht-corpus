      1 Het bevoegd gezag gebruikt een leerling- en onderwijsvolgsysteem waaruit de vorderingen in de kennis
      en vaardigheden blijken op het niveau van de leerling, de groep en de school. Aan een leerling- en
      onderwijsvolgsysteem zijn, behoudens voor de eerste twee schooljaren, in elk geval door het College voor toetsen en
      examens erkende toetsen verbonden.

      2 De toetsen, bedoeld in het eerste lid, meten kennis en vaardigheden van de leerling, voor wat betreft het
      openbare lichaam Bonaire in elk geval op het terrein van Papiaments, Nederlandse taal en rekenen en wiskunde,
      en voor wat betreft de openbare lichamen Sint Eustatius en Saba in elk geval op het terrein van Engelse taal,
      Nederlandse taal en rekenen en wiskunde.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel51a
  - number: 51b
    text: |-
      1 In het openbaar lichaam Bonaire neemt het bevoegd gezag in de eerste of tweede volledige week van februari bij
      een leerling in het laatste leerjaar van het basisonderwijs een door het College voor toetsen en examens erkende
      doorstroomtoets af. De doorstroomtoets is een objectief, tweede gegeven voor het vaststellen van het niveau van de
      leerling voor het volgen van aansluitend voortgezet onderwijs.

      2 Een doorstroomtoets meet kennis en vaardigheden van de leerling op het terrein van Papiaments, Nederlandse taal
      en rekenen en wiskunde. Het bevoegd gezag kan bij een leerling tevens een doorstroomtoets voor de kennisgebieden,
      genoemd in [artikel 11, tweede lid, onderdelen a, b en c][ref1], afnemen.


