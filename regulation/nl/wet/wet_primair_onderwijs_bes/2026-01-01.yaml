  - number: '46'
    text: |-
      1 Onverminderd bij algemene maatregel van bestuur gegeven voorschriften met betrekking tot de in- en uitschrijving
      van leerlingen, vindt toelating van een leerling als bedoeld in [artikel 44][ref1] slechts plaats nadat de ouders
      de gegevens betreffende de geslachtsnaam, de voorletters, de geboortedatum, het geslacht en het persoonsgebonden
      nummer BES van de leerling hebben overgelegd. Indien de ouders aannemelijk maken dat zij geen persoonsgebonden
      nummer BES van de leerling kunnen overleggen, vindt de toelating plaats met inachtneming van het derde lid.

      2 De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt document
      dan wel een door een andere school verstrekt bewijs van uitschrijving, waarin de desbetreffende gegevens zijn
      opgenomen.

      3 Indien de ouders aannemelijk maken dat zij geen persoonsgebonden nummer BES van de leerling kunnen overleggen,
      meldt het bevoegd gezag binnen twee weken na het besluit tot toelating aan Onze Minister de beschikbare gegevens
      van de leerling, bedoeld in het eerste lid, alsmede zijn adres en woonplaats

      4

      5 Het bevoegd gezag neemt de in het eerste lid bedoelde gegevens op in de leerlingenadministratie van de school.
      Bij ministeriële regeling kan worden bepaald welke andere gegevens in de leerlingenadministratie worden opgenomen.

      6


