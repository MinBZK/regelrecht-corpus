  - number: '113'
    text: |-
      1 Aan het bevoegd gezag van de niet door het openbaar lichaam in stand gehouden scholen wordt een afschrift
      gezonden van de besluiten van het bestuurscollege tot vaststelling van de mate waarin meer dan wel minder
      uitgaven worden gedaan, bedoeld in [artikel 110, eerste lid][ref1], tot verlening van het voorschot, bedoeld in
      artikel 110, tweede of derde lid, en tot voorlopige en definitieve vaststelling van het overschrijdingsbedrag,
      bedoeld in [artikel 111, zevende en achtste lid][ref2]. Daarbij is opgenomen een staat van voorzieningen als
      bedoeld in artikel 111, eerste lid onderdeel d, waarin per kalenderjaar wordt aangegeven het verloop van de
      toevoegingen en de onttrekkingen aan de voorzieningen.

      2 De toezending geschiedt binnen twee weken na de dag waarop het bestuurscollege een besluit als bedoeld in het
      eerste lid heeft genomen.

      3 In afwijking van [artikel 55 van de Wet administratieve rechtspraak BES][ref3] kan het bevoegd gezag van een
      niet door het openbaar lichaam in stand gehouden school tegen de in het eerste lid bedoelde besluiten beroep
      instellen bij de Rijksvertegenwoordiger. De [artikelen 54][ref4] en 55 van de Wet administratieve rechtspraak BES
      zijn van overeenkomstige toepassing.


