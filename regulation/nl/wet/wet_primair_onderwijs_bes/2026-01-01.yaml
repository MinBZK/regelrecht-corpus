  - number: '107'
    text: |-
      1 Indien in een openbaar lichaam uitsluitend een of meer andere rechtspersonen dan het openbaar lichaam openbare
      scholen in stand houdt of houden of openbare scholen ontbreken en het openbaar lichaam uitgaven wil doen voor het
      onderwijs aan die scholen welke niet door het Rijk worden bekostigd, stelt de eilandsraad bij eilandsverordening
      een regeling daarvoor vast en zijn de [artikelen 109 tot en met 113][ref1] niet van toepassing.

      2 De regeling, bedoeld in het eerste lid, maakt geen onderscheid tussen openbaar en bijzonder onderwijs en voorziet
      in een behandeling van scholen naar dezelfde maatstaf.

      3 De regeling, bedoeld in het eerste lid, bevat in ieder geval de voorzieningen die door het bevoegd gezag van een
      niet door het openbaar lichaam in stand gehouden school kunnen worden aangevraagd en de aanvraagprocedure.

      4 De eilandsraad kan besluiten dat het bestuurscollege de regeling, bedoeld in het eerste lid, tijdelijk kan
      aanvullen met nieuwe voorzieningen. De aanvulling wordt binnen een week aan de bevoegde gezagsorganen van de
      niet door het openbaar lichaam in stand gehouden scholen gezonden. Binnen 12 weken na de totstandkoming van de
      aanvulling wordt deze voorgelegd aan de eilandsraad en besluit de eilandsraad over de bekrachtiging ervan. Indien
      de eilandsraad niet binnen 12 weken heeft besloten, wordt de aanvulling gelijk gesteld met een aanvulling die is
      bekrachtigd. Een afwijzing van de aanvulling door de eilandsraad heeft geen gevolgen voor aanvragen waarop reeds is
      besloten of die reeds zijn ingediend en die voorzieningen betreffen waarop de aanvulling betrekking heeft.

      5 [Artikel 7, eerste lid, van de Wet administratieve rechtspraak BES][ref2] is van overeenkomstige toepassing op
      de regeling, bedoeld in het eerste lid, een wijziging daarvan, of de aanvulling, bedoeld in het vierde lid, die
      door de eilandsraad is bekrachtigd.

      6 Het bestuurscollege maakt jaarlijks in een van overheidswege uitgegeven blad of een dag-, nieuws- of huis-aan-
      huisblad, dan wel op een andere geschikte wijze, een overzicht bekend van voorzieningen die zijn toegekend op grond
      van de regeling, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel7
