      1 Het instellingsbestuur van een instelling voor hoger onderwijs die werkzaamheden uitvoert als bedoeld
      in [artikel 142, eerste lid, onder a][ref1], is partij bij de in [artikel 42, eerste lid][ref2], bedoelde
      overeenkomst.

      2 Indien na het sluiten van die overeenkomst blijkt dat de scholing of begeleiding niet volgens de overeenkomst kan
      worden uitgevoerd, treft dat instellingsbestuur tijdig een toereikende vervangende voorziening.


