  - number: 13a
    text: |-
      1 De kwaliteit van het onderwijs is zeer zwak indien de leerresultaten op de school aan het eind van het zevende
      of het achtste schooljaar op groepsniveau ernstig en langdurig tekortschieten en het bevoegd gezag in verband
      met dit tekortschieten eveneens tekortschiet in de naleving van een of meer bij of krachtens deze wet gegeven
      voorschriften. Het bevoegd gezag voldoet in elk geval niet aan de wettelijke opdracht om zorg te dragen voor de
      kwaliteit van het onderwijs, bedoeld in [artikel 13][ref1], indien de kwaliteit van het onderwijs zeer zwak is.

      2 Er is sprake van onvoldoende leerresultaten als bedoeld in het eerste lid indien op de school de leerresultaten
      op het gebied van Nederlandse taal en rekenen en wiskunde en, voor wat betreft het openbare lichaam Bonaire, op het
      gebied van Papiaments of, voor wat betreft de openbare lichamen Sint Eustatius en Saba, de Engelse taal, gemeten
      over een periode van 3 schooljaren, liggen onder de in het vijfde lid bedoelde normering die daarvoor geldt in
      vergelijking tot die leerresultaten over diezelfde schooljaren van scholen met een vergelijkbaar leerlingenbestand.

      3 De leerresultaten van de school worden, voor wat betreft het openbaar lichaam Bonaire, jaarlijks beoordeeld
      op basis van de resultaten van de afgelegde doorstroomtoetsen, bedoeld in [artikel 51b, eerste lid][ref2],
      op het gebied van Papiaments, Nederlandse taal en rekenen en wiskunde, met uitzondering van de resultaten van
      doorstroomtoetsen afgelegd door:

      a. zeer moeilijk lerende leerlingen;

      b. meervoudig gehandicapte leerlingen voor wie het zeer moeilijk lerend zijn een van de handicaps is; en

      c. leerlingen die vier jaar of korter in het openbaar lichaam Bonaire zijn en om die reden de Nederlandse taal
      onvoldoende beheersen.

      4 De leerresultaten van de school worden, voor wat betreft de openbare lichamen Sint Eustatius en Saba, jaarlijks
      beoordeeld op basis van de resultaten van door leerlingen in het laatste leerjaar van het basisonderwijs afgelegde
      toetsen, bedoeld in [artikel 51a, eerste lid][ref3], op het gebied van Engelse taal, Nederlandse taal en rekenen
      en wiskunde.

      5 Indien de leerresultaten van de school niet kunnen worden beoordeeld op grond van de regels gesteld bij of
      krachtens het zesde lid, is de kwaliteit van het onderwijs zeer zwak indien de school tekortschiet in de naleving
      van twee of meer bij of krachtens deze wet gegeven voorschriften en de school dientengevolge tekortschiet in het
      zorg dragen voor de veiligheid op school, bedoeld in [artikel 6a][ref4], of het zodanig inrichten van het onderwijs
      dat leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen dan wel het afstemmen van het onderwijs op de
      voortgang in de ontwikkeling van de leerlingen, bedoeld in [artikel 10, eerste lid][ref5].

      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop
      leerresultaten worden gemeten, genormeerd en beoordeeld. Voorts wordt de normering, bedoeld in het derde lid,
      bepaald en wordt bepaald bij welk aantal leerlingen in het achtste schooljaar van een bepaalde school voor die
      school voor de periode van 3 schooljaren, bedoeld in het tweede lid, onderdeel a, wordt gelezen 5 schooljaren.

      7 De voordracht voor een krachtens het zesde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


