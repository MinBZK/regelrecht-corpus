      het onderwijs aan die scholen welke niet door het Rijk worden bekostigd, kan de eilandsraad daarvoor bij
      eilandsverordening een regeling vaststellen.

      2 [Artikel 107, tweede tot en met zesde lid][ref1], is van toepassing.


