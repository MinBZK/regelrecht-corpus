  - number: '71'
    text: |-
      1 Voor de toepassing van deze titel zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      [artikel 54][ref1] of een openbare rechtspersoon als bedoeld in [artikel 53][ref2], tenzij het tegendeel blijkt.

      2 Indien een openbare school in stand wordt gehouden door een stichting of een openbare rechtspersoon, wordt
      deze aangemerkt als een door het openbaar lichaam in stand gehouden openbare school voor de toepassing van de
      [afdelingen 2][ref3] en [7][ref4] van deze titel.


