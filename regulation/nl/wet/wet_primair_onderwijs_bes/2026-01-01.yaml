      1 De aanstelling of tewerkstelling zonder aanstelling van de mede-directeur, de adjunct-directeur of leraren
      geschiedt, de directeur gehoord.

      2 De aanstelling en de overplaatsing van directeuren en adjunct-directeuren geschiedt door het bevoegd gezag, het
      personeel gehoord.
