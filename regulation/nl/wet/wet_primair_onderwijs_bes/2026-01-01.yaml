        bwb_id: BWBR0030281
  - number: '144'
    text: |-
      1 Indien een bij of krachtens de wet gestelde termijn door het bevoegd gezag wordt overschreden en het openbaar
      lichaam daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum
      bekostiging van het Rijk ontvangt dan het geval zou zijn geweest indien deze termijn wel in acht was genomen,
      vergoedt het bevoegd gezag de door het openbaar lichaam geleden schade.

      2 Indien een bij of krachtens de wet gestelde termijn door het bestuurscollege wordt overschreden en het bevoegd
      gezag daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum
      bekostiging van het Rijk ontvangt dan het geval zou zijn geweest indien deze termijn wel in acht was genomen,
      vergoedt het openbaar lichaam de door het bevoegd gezag geleden schade.

      3 Het bestuurscollege en het bevoegd gezag kunnen in onderling overleg de in het eerste en tweede lid
      bedoelde verplichting tot schadevergoeding matigen. Indien dit overleg niet tot overeenstemming leidt, is
      [artikel 106 van Boek 6 van het Burgerlijk Wetboek BES][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel106
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel144
