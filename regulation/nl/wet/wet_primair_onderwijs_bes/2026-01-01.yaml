  - number: 6a
    text: |-
      1 Het bevoegd gezag draagt zorg voor de veiligheid op school, waarbij het bevoegd gezag in ieder geval:

      a. beleid met betrekking tot de veiligheid voert,

      b. de veiligheid van leerlingen op school monitort met een instrument dat een representatief en actueel beeld
      geeft, en

      c. er zorg voor draagt dat bij een persoon ten minste de volgende taken zijn belegd:

      1°. het coördineren van het beleid in het kader van het tegengaan van pesten, en

      2°. het fungeren als aanspreekpunt in het kader van pesten.

      2 Onder veiligheid, bedoeld in het eerste lid, wordt verstaan de sociale, psychische en fysieke veiligheid van
      leerlingen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het instrument, bedoeld in het
      eerste lid, onderdeel b, dat door de school wordt vormgegeven of gekozen, waaronder:

      a. de aandachtsgebieden die het instrument inzichtelijk maakt,

      b. de representativiteit van het instrument, en

      c. de frequentie waarmee het instrument wordt ingezet.

      4 Het bevoegd gezag zendt onverwijld de resultaten van de monitor, bedoeld in het eerste lid, onderdeel b, aan
      de inspectie.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel6a
  - number: '7'
    text: |-
      Het bevoegd gezag van een bijzondere school geeft binnen vier weken na de oprichting van de school onder
      overlegging van de statuten van de rechtspersoon, die de school in stand houdt, en van de reglementen, van die
      oprichting kennis aan Onze Minister. Indien de statuten of reglementen worden gewijzigd of ingetrokken, wordt
      eveneens binnen vier weken van de wijziging of van de intrekking van de statuten of reglementen aan Onze Minister
      kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel7
  - number: '8'
    text: |-
      Ten laste van een andere openbare kas dan van Rijk en openbaar lichaam worden geen scholen in stand gehouden, noch
      uitgaven voor een school gedaan. Openbare lichamen doen geen uitgaven voor een niet door het openbaar lichaam in
      stand gehouden school dan krachtens de wet.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel8
  - number: '9'
    text: |-
      1 Deze wet is niet van toepassing op scholen die uitsluitend bestemd zijn voor kinderen die niet de Nederlandse
      nationaliteit hebben.

      2 Bij twijfel of op een school het eerste lid van toepassing is, besluit de Kroon, de Raad van State gehoord.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel9
  - number: '10'
    text: |-
      1 Het onderwijs wordt zodanig ingericht dat de leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen.
      Het wordt afgestemd op de voortgang in de ontwikkeling van de leerlingen.

      2 Het onderwijs richt zich in elk geval op de emotionele en de verstandelijke ontwikkeling, en op het ontwikkelen
      van creativiteit, op het verwerven van noodzakelijke kennis en van sociale, culturele en lichamelijke vaardigheden.

      3 Het onderwijs bevordert actief burgerschap en sociale cohesie op doelgerichte en samenhangende wijze, waarbij het
      onderwijs zich in ieder geval herkenbaar richt op:

      a. het bijbrengen van respect voor en kennis van de basiswaarden van de democratische rechtsstaat, zoals verankerd
      in de [Grondwet][ref1], en de universeel geldende fundamentele rechten en vrijheden van de mens, en het handelen
      naar deze basiswaarden op school;

      b. het ontwikkelen van de sociale en maatschappelijke competenties die de leerling in staat stellen deel uit te
      maken van en bij te dragen aan de pluriforme, democratische Caribisch Nederlandse samenleving; en

      c. het bijbrengen van kennis over en respect voor verschillen in godsdienst, levensovertuiging, politieke
      gezindheid, afkomst, geslacht, handicap of seksuele gerichtheid alsmede de waarde dat gelijke gevallen gelijk
      behandeld worden.

      3a Het bevoegd gezag draagt zorg voor een schoolcultuur die in overeenstemming is met de waarden, bedoeld in het
      derde lid, onderdeel a, creëert een omgeving waarin leerlingen worden gestimuleerd actief te oefenen met de omgang
      met en het handelen naar deze waarden en draagt voorts zorg voor een omgeving waarin leerlingen en personeel zich
      veilig en geaccepteerd weten, ongeacht de in het derde lid, onder c, genoemde verschillen.

      4 Ten aanzien van leerlingen met een specifieke onderwijsbehoefte, is het onderwijs gericht op individuele
      begeleiding die is afgestemd op de behoeften van de leerling.

      5 Het onderwijs wordt zodanig ingericht dat:

      a. de leerlingen in beginsel binnen een tijdvak van 8 aaneensluitende schooljaren de school kunnen doorlopen;

      b. de leerlingen in 8 schooljaren ten minste 7 520 uren onderwijs ontvangen, met dien verstande dat de leerlingen
      in de eerste 4 schooljaren ten minste 3 520 uren onderwijs en in de laatste 4 schooljaren ten minste 3 760 uren
      onderwijs ontvangen, en aan de leerlingen in de laatste 6 schooljaren ten hoogste 7 weken van het schooljaar 4
      dagen per week onderwijs wordt gegeven, die evenwichtig zijn verdeeld over het schooljaar, bij een schoolweek van
      in beginsel niet minder dan 5 dagen onderwijs, en

      c. de onderwijsactiviteiten evenwichtig over de dag worden verdeeld.

      6 Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.

      7 Het onderwijs wordt zodanig ingericht dat daarbij op structurele en herkenbare wijze aandacht wordt besteed aan
      het bestrijden van achterstanden in het bijzonder van taalachterstanden, waarin ook door middel van vroegschoolse
      educatie wordt voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '11'
    text: |-
      1 Het onderwijs in het openbaar lichaam Bonaire omvat, waar mogelijk in samenhang:

      a. zintuiglijke en lichamelijke oefening;

      b. Nederlandse taal;

      c. Papiaments;

      d. Engelse taal;

      e. rekenen en wiskunde;

      f. enkele kennisgebieden;

      g. expressie-activiteiten;

      h. bevordering van sociale redzaamheid, waaronder gedrag in het verkeer;

      i. bevordering van gezond gedrag.

      2 Bij de kennisgebieden wordt in elk geval aandacht besteed aan:

      a. aardrijkskunde;

      b. geschiedenis;

      c. de natuur, waaronder biologie;

      d. maatschappelijke verhoudingen, waaronder staatsinrichting;

      e. geestelijke stromingen.

      2a Het onderwijs in zintuiglijke en lichamelijke oefening, bedoeld in het eerste lid, aanhef en onderdeel a, wordt
      gespreid verzorgd over alle schooljaren en beslaat in een schooljaar gemiddeld ten minste twee uren per schoolweek.

      3 Het onderwijs kan naast de onderwijsactiviteiten, genoemd in het eerste en tweede lid, tevens de Spaanse taal
      omvatten.

      4 Ten aanzien van de onderwijsactiviteiten, genoemd in het eerste en tweede lid, worden bij algemene maatregel van
      bestuur kerndoelen vastgesteld.

      5 Voor de school geldt de eis dat zij tenminste de kerndoelen bij haar onderwijsactiviteiten als aan het eind
      van het basisonderwijs te bereiken doelstellingen hanteert. Kerndoelen geven een beschrijving van kwaliteiten van
      leerlingen op het gebied van kennis, inzicht en vaardigheden. Indien de eerste volzin niet kan worden toegepast
      voor een leerling met een specifieke onderwijsbehoefte, wordt in het handelingsplan, bedoeld in [artikel 45][ref1],
      aangegeven wat daarvan de reden is en welke vervangende onderwijsdoelen worden gehanteerd.

      6 Indien een bevoegd gezag van een bijzondere school dringend bedenkingen heeft tegen de krachtens het vierde lid
      vastgestelde kerndoelen, kan het bevoegd gezag eigen kerndoelen voor de school vaststellen. Deze kerndoelen zijn
      van gelijk niveau als de kerndoelen, bedoeld in het vierde lid. Het bevoegd gezag zendt de vastgestelde kerndoelen
      aan de inspecteur.

      7 Het onderwijs wordt gegeven in het Nederlands en in het Papiaments.

      8 Onze Minister kan in bijzondere gevallen op aanvraag van het bevoegd gezag besluiten toe te staan dat wordt
      afgeweken van de voorschriften in het eerste en tweede lid. De toestemming wordt verleend voor een bepaald tijdvak;
      zij kan voorwaarden bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel45
