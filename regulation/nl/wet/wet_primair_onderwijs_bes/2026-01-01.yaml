    text: |-
      1 Onverminderd de bevoegdheid van de inspectie op grond van de [Wet op het onderwijstoezicht][ref1] kan Onze
      Minister een onderzoek instellen of doen instellen naar de jaarverslaggeving, naar de gegevens die noodzakelijk
      zijn voor de vaststelling van de bekostiging, naar de rechtmatigheid van de bestedingen en naar de doelmatigheid
      van het beheer van de school.

      2 Indien uit een op grond van het eerste lid ingesteld onderzoek blijkt dat de bekostiging voor een school onjuist
      is vastgesteld, kan Onze Minister correcties aanbrengen op de bekostiging.

      3 Onze Minister doet het bevoegd gezag schriftelijk mededeling van een besluit tot het aanbrengen van een correctie
      op de bekostiging.

      4 Indien uit de jaarverslaggeving, bedoeld in [125, eerste lid][ref2], uit de verklaring van de deskundige,
      bedoeld in 125, vierde lid, of uit een op grond van het eerste lid ingesteld onderzoek blijkt dat de bekostiging
      voor een school onrechtmatig is besteed of evident ondoelmatig is aangewend, kan Onze Minister bepalen dat het
      desbetreffende gedeelte van de bekostiging niet ten laste komt van het Rijk of dat de daarmee gemoeide bedragen in
      mindering worden gebracht op de bekostiging.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de wijze waarop wordt
      vastgesteld dat sprake is van evident ondoelmatige aanwending van de bekostiging als bedoeld in het vierde lid.

      6 De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.

      7 Een in het tweede lid bedoelde correctie wordt indien de correctie strekt tot verhoging van de bekostiging,
      binnen acht weken na de mededeling, bedoeld in het derde lid, door Onze Minister betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel125
