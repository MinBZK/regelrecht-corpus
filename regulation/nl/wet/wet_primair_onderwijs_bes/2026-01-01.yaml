  - number: '131'
    text: |-
      1 Aan degene die blijkens een geschiktheidsonderzoek als bedoeld in [artikel 138][ref1] voldoende geschikt wordt
      geacht voor het beroep van leraar en in staat moet worden geacht binnen twee jaar na benoeming of tewerkstelling
      zonder benoeming tot leraar met goed gevolg deel te nemen aan het in artikel 141 bedoelde bekwaamheidsonderzoek,
      geeft het bestuur van een instelling die op grond van artikel 140 is erkend, een geschiktheidsverklaring af.

      2 Bij ministeriële regeling wordt een model voor de geschiktheidsverklaring vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel138
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel131
