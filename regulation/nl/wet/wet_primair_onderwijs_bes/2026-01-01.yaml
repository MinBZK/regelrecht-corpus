  - number: '33'
    text: |-
      1 Het bevoegd gezag stelt na overleg met de directeur en indien toepassing is gegeven aan
      [artikel 31, vijfde lid][ref1], met het in dat artikellid bedoelde personeel voor zover dat is belast met
      managementtaken met betrekking tot de scholen, een managementstatuut vast. In het managementstatuut is ten minste
      een regeling opgenomen betreffende de bevoegdheden van de directeur en indien toepassing is gegeven aan artikel
      31, vijfde lid, tevens van de bevoegdheden van het in dat artikellid bedoelde personeel voor zover dat is belast
      met managementtaken met betrekking tot de scholen en met betrekking tot de toedeling, bestemming en aanwending van
      de bekostiging.

      2 Het managementstatuut bevat tevens de aanduiding van de andere aan het bevoegd gezag bij wettelijk voorschrift
      toegekende taken en bevoegdheden waarvan het bevoegd gezag heeft bepaald dat de directeur van de school of indien
      toepassing is gegeven aan [artikel 31, vijfde lid][ref2], het in dat artikellid bedoelde personeel voor zover dat
      is belast met managementtaken met betrekking tot de scholen, deze in naam van het bevoegd gezag kan uitoefenen. Het
      managementstatuut bevat voorts instructies ten aanzien van deze taken en bevoegdheden.

      3 In het managementstatuut worden tevens vastgelegd:

      a. de taken en bevoegdheden die het bestuur overdraagt aan de directeur van de school of indien toepassing is
      gegeven aan [artikel 31, vijfde lid][ref3], het in dat artikellid bedoelde personeel voor zover dat is belast met
      managementtaken met betrekking tot de scholen, indien toepassing is gegeven aan [artikel 32, eerste lid][ref4];

      b. de taken en bevoegdheden die het bestuur, de directeur van de school of indien toepassing is gegeven
      aan [artikel 31, vijfde lid][ref5], het in dat artikellid bedoelde personeel voor zover dat is belast met
      managementtaken met betrekking tot de scholen overdraagt aan de adjunct-directeur, indien toepassing is gegeven aan
      [artikel 32, tweede lid][ref6]; en

      c. de richtlijnen voor de uitoefening van de overgedragen taken en bevoegdheden.

      4 Het bevoegd gezag stelt het managementstatuut, alsmede elke wijziging daarvan, zo spoedig mogelijk na de
      vaststelling op een voor eenieder toegankelijke wijze beschikbaar.


