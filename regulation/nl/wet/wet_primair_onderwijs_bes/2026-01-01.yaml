  - number: '111'
    text: |-
      1 Indien een openbaar lichaam een of meer scholen in stand houdt, stelt het bestuurscollege jaarlijks voorlopig
      vast:

      a. het totaal van de bedragen, bedoeld in [artikel 115, derde lid][ref1], die in het voorafgaande kalenderjaar
      zijn uitgegeven;

      b. het totaal van de ontvangsten, bedoeld in de [artikelen 99][ref2], [100][ref3], [103][ref4] en [104][ref5], in
      het voorafgaande kalenderjaar;

      c. een staat van voorzieningen die zijn ingesteld voor de door het openbaar lichaam in stand gehouden scholen.

      2 Indien het openbaar lichaam een deel van de ontvangsten, bedoeld in het eerste lid, aanhef en onder b, toevoegt
      aan een voorziening, wordt dat deel aangemerkt als een uitgave als bedoeld in het eerste lid, aanhef en onder a.

      3 Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdeel c, worden buiten beschouwing gelaten de
      uitgaven en ontvangsten voor:

      a. de administratie, het beheer, het bestuur, bedoeld in [artikel 99, tweede lid, onderdeel g][ref6], en

      b. de exploitatie van een ruimte voor het onderwijs in lichamelijke oefening.

      4 Bij het vaststellen van de bedragen, bedoeld in het eerste lid onderdeel a, worden buiten beschouwing gelaten
      de uitgaven die worden gedekt door ontvangsten van bedragen die door derden zijn betaald en de uitgaven voor de
      voorzieningen waarvoor het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school op grond
      van de regeling, bedoeld in [artikel 108, eerste lid][ref7], een aanvraag bij het openbaar lichaam kon indienen en
      wel gedurende de periode waarvoor een dergelijke aanvraag kon worden gedaan.

      5 Bij het vaststellen van de bedragen bedoeld in het eerste lid, onder c, mogen voorzieningen die volgens de
      desbetreffende rijksbekostiging een afschrijvingstermijn van ten minste 20 jaar hebben, over ten hoogste 20 jaar
      worden aangemerkt als jaarlijkse uitgaven op grond van rente op basis van een fictieve lening met een looptijd van
      ten hoogste 20 jaar en een lineaire aflossing.

      6 Indien het openbaar lichaam een deel van de bekostiging voor uitgaven overdraagt aan een ander bevoegd gezag,
      wordt dat deel aangemerkt als een uitgave als bedoeld in het eerste lid, onderdeel a. Indien door een ander bevoegd
      gezag een deel van de bekostiging aan het openbaar lichaam wordt overgedragen, wordt dat deel aangemerkt als een
      ontvangst als bedoeld in het eerste lid, onderdeel b.

      7 Om de vijf jaar stelt het bestuurscollege voorlopig vast het totaal van de vastgestelde uitgaven en ontvangsten
      in de voorafgaande vijf kalenderjaren, zoals in het eerste tot en met zesde lid is aangegeven. Indien de uitgaven
      hoger zijn dan de ontvangsten, bepaalt het bestuurscollege tevens het bedrag van de overschrijding. Indien een
      openbaar lichaam vanaf een tijdstip binnen een periode van vijf jaar als bedoeld in de eerste volzin geen school
      in stand houdt, stelt het bestuurscollege in afwijking van die volzin zo spoedig mogelijk na dat tijdstip voorlopig
      vast het totaal van de vastgestelde uitgaven en ontvangsten in het aan dat tijdstip voorafgaande deel van de
      periode van vijf jaar, zoals in het eerste tot en met zesde lid is aangegeven.

      8 Na sluiting van de rekening van het openbaar lichaam stelt het bestuurscollege de in het eerste en zevende
      lid bedoelde bedragen, zo nodig gewijzigd, vast. In het geval, bedoeld in het zevende lid, tweede volzin, drukt
      het bestuurscollege vervolgens het bedrag van de overschrijding uit in een percentage van het totaal van de
      ontvangsten, bedoeld in het eerste lid, onderdelen c en d. Het percentage wordt afgerond tot twee decimalen.
      Afronding naar beneden vindt plaats indien de derde decimaal kleiner is dan 5, en naar boven indien deze decimaal
      ten minste 5 bedraagt.


