  - number: '112'
    text: |-
      1 In het jaar volgend op de definitieve vaststelling, bedoeld in [artikel 111, achtste lid][ref1], wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden
      school, die gedurende een of meer jaren van het desbetreffende tijdvak in het openbaar lichaam was gevestigd,
      aanspraak heeft.

      2 Het overschrijdingsbedrag, bedoeld in het eerste lid, wordt vastgesteld door het percentage, bedoeld in
      [artikel 111, achtste lid][ref2], te vermenigvuldigen met het totaal van de ontvangsten van een niet door het
      openbaar lichaam in stand gehouden school dat is gebaseerd op de bedragen die krachtens de [artikel 99][ref3]
      voor het desbetreffende tijdvak zijn vastgesteld, met dien verstande dat bij het vaststellen van het totaal van de
      ontvangsten, bedoeld in voorgaande volzin, buiten beschouwing blijven de ontvangsten, bedoeld in artikel 99, tweede
      lid, onderdeel g, en de exploitatie van de ruimte voor het onderwijs in lichamelijke oefening.

      3 Indien aan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school een deel van
      de bekostiging is overgedragen door een ander bevoegd gezag, wordt bij het vaststellen van het totaal van de
      ontvangsten, bedoeld in het tweede lid, tweede volzin, dat deel bij genoemde school wel en bij de school van
      laatstgenoemd bevoegd gezag niet aangemerkt als ontvangsten.

      4 Indien een openbaar lichaam voor een niet door het openbaar lichaam in stand gehouden school het deel van de
      kosten, bedoeld in [artikel 99, tweede lid, onderdelen d, e en j][ref4], betrekking hebben, geheel of gedeeltelijk
      verzorgt, wordt een overeenkomstig deel van de ontvangsten in mindering gebracht op het totaal van de ontvangsten
      voor de betrokken school waarover ingevolge het eerste lid het overschrijdingsbedrag wordt vastgesteld.

      5 Indien een openbaar lichaam gedurende een gedeelte van het desbetreffende tijdvak een of meer scholen in stand
      houdt, wordt voor het vaststellen van het overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het
      totaal van de ontvangsten van een niet door het openbaar lichaam in stand gehouden school over een overeenkomstig
      gedeelte van het desbetreffende tijdvak.


