  - number: '45'
    text: |-
      1 Het bevoegd gezag van een school waar een leerling met een specifieke onderwijsbehoefte is ingeschreven, stelt
      in overeenstemming met de ouders en met inachtneming van [artikel 28, derde lid][ref1], voor elk schooljaar
      een handelingsplan op. Indien de inschrijving van de in de eerste volzin bedoelde leerling plaatsvindt op of na
      1 augustus wordt het handelingsplan zo spoedig mogelijk doch uiterlijk een maand na die inschrijving opgesteld.

      2 Het bevoegd gezag stelt het handelingsplan op nadat het bevoegd gezag de leerling in de gelegenheid heeft gesteld
      op een door de leerling te bepalen wijze vrijelijk zijn mening hierover naar voren te brengen. Het bevoegd gezag
      biedt de leerling daartoe de ondersteuning die hij nodig heeft.

      3 Het bevoegd gezag omschrijft in het handelingsplan de inbreng van de leerling en hoe deze van invloed is geweest
      op de vast- of bijstelling van het handelingsplan.

      4 Het bevoegd gezag licht aan de leerling toe op welke wijze diens mening van invloed is geweest op de vast- of
      bijstelling van het handelingsplan.

      5 Het bevoegd gezag evalueert het handelingsplan ten minste één keer per schooljaar met de ouders en de leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel28
