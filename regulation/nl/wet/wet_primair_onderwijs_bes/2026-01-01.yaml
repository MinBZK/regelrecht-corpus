  - number: '5'
    text: |-
      1 Bij eilandsverordening worden regels gegeven met betrekking tot het verstrekken van voeding en kleding
      aan alsmede het mogelijk maken van vervoer naar en van school voor leerlingen die zonder deze voorzieningen
      redelijkerwijs niet in staat zouden zijn de school geregeld te bezoeken als bedoeld in de [artikelen 6][ref1] en
      [7 van de Leerplichtwet BES][ref2].

      2 De eilandsverordening maakt geen onderscheid tussen openbaar en bijzonder onderwijs.

      3 De eilandsverordening eerbiedigt de op godsdienst of levensbeschouwing van de ouders berustende keuze van een
      school.

      4 De eilandsverordening voorziet erin dat het vervoer kan plaatsvinden op een wijze die voor de leerling passend
      is.

      5 De eilandsverordening kan bepalen dat het openbaar lichaam, in plaats van vergoeding in geld te geven, het
      verstrekken van voeding of kleding of het vervoer verzorgt of doet verzorgen.

      6 De eilandsverordening kan bepalen dat het bestuurscollege in bijzondere gevallen de bevoegdheid heeft ten gunste
      van de ouders van de inhoud van de eilandsverordening af te wijken.

      7 De eilandsverordening bepaalt dat voor leerlingen die wegens hun lichamelijke, verstandelijke of zintuiglijke
      handicap op ander vervoer dan openbaar vervoer zijn aangewezen, dan wel vanwege een zodanige handicap niet
      zelfstandig van openbaar vervoer gebruik kunnen maken, een adequate voorziening wordt getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel7
