  - number: '100'
    text: |-
      1 Onze Minister stelt jaarlijks de bekostiging voor een school vast.

      2 De bekostiging voor een school bestaat uit een bedrag per school en een bedrag per leerling.

      3 Onze Minister kan extra bekostiging toekennen. Bij of krachtens algemene maatregel van bestuur worden regels
      gesteld over de gevallen waarin, de voorwaarden waaronder en het bedrag dat aan extra bekostiging kan worden
      toegekend. In ieder geval wordt extra bekostiging toegekend vanwege de geïsoleerde ligging van een school en het
      prijspeil van Sint Eustatius en Saba.

      4 Onze Minister stelt de hoogte van de bedragen, bedoeld in het tweede en derde lid, zodanig vast dat zij voldoet
      aan de redelijke behoeften van een in normale omstandigheden verkerende school.

      5 Bij ministeriële regeling worden jaarlijks de bedragen, bedoeld in het tweede en derde lid, vastgesteld, worden
      nadere regels gesteld over de wijze waarop de hoogte van de bekostiging wordt berekend en worden regels gesteld
      over de termijnen van de betaling daarvan.

      6 De bedragen, bedoeld in het tweede en derde lid, gelden voor het kalenderjaar volgend op het tijdstip van de
      vaststelling.

      7 Bij de vaststelling of tussentijdse aanpassing van de bedragen, bedoeld in het eerste en vijfde lid, worden loon-
      en prijsontwikkelingen verwerkt, tenzij de toestand van 's Rijks financiën zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0030280/2026-01-01#Artikel100
  - number: '101'
    text: |-
      In geval van samenvoeging van basisscholen, waarbij een of meer basisscholen worden opgeheven en sprake is
      van een minimale instroom van leerlingen in de samengevoegde basisschool, wordt de bekostiging, bedoeld in
      [artikel 100, eerste lid][ref1], van alle betrokken basisscholen gehandhaafd tot het einde van het kalenderjaar
      waarin de basisscholen zijn samengevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel100
