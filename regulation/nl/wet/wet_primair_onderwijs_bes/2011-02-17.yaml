        paragraaf: '2'
        afdeling: '1'
  - number: 119.2.a
    text: een andere school,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel119
  - number: 119.2.b
    text: een school voor voortgezet onderwijs,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel119
  - number: 119.2.c
    text: |-
      een instelling als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: 119.2.d
    text: het expertisecentrum onderwijszorg.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel119
  - number: '119.3'
    text: |-
      De verstrekte overschrijdingsbedragen worden ten behoeve van het onderwijs aan de scholen van het bevoegd gezag
      aangewend.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel119
  - number: '119.4'
    text: |-
      De op grond van [artikel 112][ref1] of [artikel 113][ref2] verstrekte vergoeding wordt besteed aan het doel
      waarvoor zij is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel113
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '112'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '113'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '7'
  - number: '120.1'
    text: |-
      Op de bekostiging of onderdelen daarvan kunnen voorschotten worden verleend volgens regels, te stellen bij of
      krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel120
  - number: '120.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden tevens voorschriften gegeven voor de verrekening van de
      betaalde voorschotten met het bedrag van de vastgestelde bekostiging of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel120
  - number: '121'
    text: |-
      Onze Minister is bevoegd tot verrekening van vorderingen krachtens deze wet van of op het bevoegd gezag van een
      school met vorderingen van of op Onze Minister krachtens een andere wet.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel121
  - number: '122.1'
    text: |-
      De bekostiging van een bijzondere school wordt beëindigd en een openbare school wordt opgeheven indien het aantal
      leerlingen op de teldatum 1 oktober, gedurende 3 achtereenvolgende schooljaren telkens minder heeft bedragen dan
      23. De eerste volzin is niet van toepassing gedurende de eerste 5 schooljaren van de bekostiging van een school. De
      tweede volzin is niet van toepassing op scholen als bedoeld in [artikel 76][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel76
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '76'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '122.2'
    text: |-
      De beëindiging van de bekostiging van een bijzondere school of de opheffing van een openbare school geschiedt met
      ingang van 1 augustus volgend op de 3 achtereenvolgende schooljaren, bedoeld in het eerste lid. De beëindiging van
      de bekostiging van een bijzondere school of de opheffing van een openbare school ten aanzien waarvan gedurende de
      eerste 5 schooljaren van de bekostiging van de school het eerste lid, tweede volzin, toepassing diende te vinden,
      geschiedt met ingang van 1 augustus volgend op die 5 schooljaren.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel122
  - number: '122.3'
    text: |-
      Indien binnen 10 km van een school waarbinnen openbaar onderwijs wordt gegeven, over de weg gemeten geen school
      aanwezig is waarbinnen openbaar onderwijs wordt gegeven en aan het volgen van openbaar onderwijs behoefte bestaat,
      wordt de eerstgenoemde school niet opgeheven op grond van dit artikel.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel122
  - number: '123.1'
    text: |-
      Het bevoegd gezag van een school die op de teldatum 1 oktober minder dan 23 leerlingen telt, kan Onze Minister
      verzoeken in afwijking van [artikel 122, eerste en tweede lid][ref1], die bijzondere school te blijven bekostigen
      of die openbare school in stand te houden voor een door Onze minister te bepalen termijn. Een besluit tot
      instandhouding wordt in elk geval niet genomen indien de kwaliteit van het onderwijs op de school, bedoeld in de
      Wet op het onderwijstoezicht, onvoldoende is of geen perspectief bestaat op structurele toename van het aantal
      leerlingen van de school tot het aantal van ten minste 23 op 1 oktober voorafgaand aan de datum waarop de door Onze
      minister te bepalen termijn eindigt. Het al dan niet aanwezig zijn van basisscholen in de omgeving van de school
      kan Onze minister eveneens betrekken bij zijn besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel122
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '122'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '8'
  - number: '123.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid moet voor 1 februari voorafgaand aan de datum voor de beëindiging
      van de bekostiging onderscheidenlijk de opheffing schriftelijk worden ingediend bij Onze Minister. Het verzoek
      gaat vergezeld van gegevens ter onderbouwing van het perspectief, bedoeld in het eerste lid, een beredeneerde
      leerlingprognose en gegevens over de ligging van de school ten opzichte van de dichtstbijzijnde basisscholen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel123
  - number: '123.3'
    text: 'Onze minister besluit voor 1 mei, volgend op het verzoek, bedoeld in het tweede lid, dat:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel123
  - number: 123.3.a
    text: |-
      met ingang van 1 augustus van het volgende schooljaar de bekostiging van de bijzondere school wordt beëindigd dan
      wel de openbare school wordt opgeheven, of
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel123
  - number: 123.3.b
    text: |-
      met ingang van 1 augustus van het volgende schooljaar de bekostiging van de bijzondere school wordt voortgezet of
      de openbare school in stand wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel123
  - number: '123.4'
    text: |-
      Onze minister kan de termijn, bedoeld in het eerste lid, op verzoek van het bevoegd gezag eenmalig verlengen met
      maximaal de duur van de termijn die op grond van het eerste lid ten aanzien van de school door hem was bepaald. De
      tweede en derde volzin van het eerste lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel123
  - number: '124'
    text: |-
      De eilandsraad kan besluiten tot vermindering van het aantal openbare scholen. In afwijking van de eerste volzin
      vindt opheffing van een openbare school niet plaats in het geval, bedoeld in [artikel 122, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel122
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '122'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '8'
  - number: '125.1'
    text: |-
      Indien naar het oordeel van Onze Minister de bekostiging van een bijzondere school dient te worden beëindigd of
      een openbare school dient te worden opgeheven, maakt Onze Minister dit voor 1 januari voorafgaand aan de datum van
      beëindiging van de bekostiging onderscheidenlijk opheffing van de school bekend aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel125
  - number: '125.2'
    text: |-
      Indien naar het oordeel van het bevoegd gezag sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 122, derde lid][ref1], deelt het bevoegd gezag dit voor 1 februari voorafgaand aan de datum voor de
      opheffing schriftelijk mede aan Onze Minister. Bij algemene maatregel van bestuur kan worden bepaald welke gegevens
      bij deze mededeling worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel122
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '122'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '8'
  - number: '125.3'
    text: |-
      Voor zover Onze Minister niet reeds heeft bekendgemaakt dat hij de mededeling, bedoeld in het tweede lid, buiten
      behandeling laat wegens het niet verstrekken van de voorgeschreven gegevens, maakt hij voor 1 mei, volgend op de
      mededeling, bedoeld in het tweede lid, aan het bevoegd gezag van de desbetreffende school bekend dat:
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel125
  - number: 125.3.a
    text: |-
      naar zijn oordeel geen sprake is van een uitzonderingssituatie, bedoeld in het tweede lid, en dat met ingang van 1
      augustus van het volgende schooljaar de openbare school dient te worden opgeheven, of
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel125
  - number: 125.3.b
    text: met ingang van 1 augustus van het volgende schooljaar de openbare school in stand dient te worden gehouden.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel125
  - number: '125.4'
    text: |-
      Indien Onze Minister niet voor 1 mei, volgend op de mededeling, bedoeld in het tweede lid, een bekendmaking als
      bedoeld in het derde lid heeft gedaan, dient met ingang van 1 augustus van het volgende schooljaar de openbare
      school met ingang van laatstgenoemde datum in stand te worden gehouden.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel125
  - number: '126.1'
    text: |-
      Indien de bekostiging van een bijzondere school wordt beëindigd of het bevoegd gezag tot de opheffing van de school
      beslist, eindigt het recht op het gebouw en terrein en worden alle roerende zaken, behalve die welke het bevoegd
      gezag uit eigen middelen heeft aangeschaft, aan het openbaar lichaam op wiens grondgebied het gebouw en terrein
      zijn gelegen, overgedragen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel126
  - number: '126.2'
    text: |-
      [Artikel 94, eerste tot en met vijfde lid][ref1], is van overeenkomstige toepassing met dien verstande dat in de
      verklaring ingevolge het eerste lid en het besluit ingevolge het tweede lid als datum waarop het bevoegd gezag
      blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein voor de school te gebruiken, zal
      worden genoemd de datum waarop de bekostiging is geëindigd dan wel zal eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel94
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '94'
        hoofdstuk: I
        afdeling: '3'
  - number: '127.1'
    text: |-
      Indien de bekostiging van de laatste bijzondere school van een bevoegd gezag wordt beëindigd of het bevoegd gezag
      tot de opheffing van de laatste school beslist, dan wel de laatste openbare school wordt opgeheven, stort het
      bevoegd gezag de niet bestede bekostigingsbedragen terug in de desbetreffende overheidskas.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel127
  - number: '127.2'
    text: Het exploitatietekort blijft in de gevallen, bedoeld in het eerste lid, voor rekening van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel127
  - number: '127.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de wijze waarop het
      exploitatieoverschot, bedoeld in het eerste lid, wordt berekend.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel127
  - number: '128.1'
    text: |-
      Indien sprake is van wanbeheer van een of meer bestuurders of toezichthouders kan Onze Minister de rechtspersoon
      die de school in stand houdt een aanwijzing geven. Een aanwijzing omvat een of meer maatregelen en is evenredig aan
      het doel waarvoor zij wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel128
  - number: '128.2'
    text: 'Onder wanbeheer wordt uitsluitend verstaan:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel128
  - number: 128.2.a
    text: financieel wanbeleid,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel128
  - number: 128.2.b
    text: |-
      ongerechtvaardigde verrijking, al dan niet beoogd, van de rechtspersoon die de school in stand houdt, zichzelf dan
      wel een derde,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel128
  - number: 128.2.c
    text: |-
      onrechtmatig handelen, waaronder wordt verstaan het in de hoedanigheid van bestuurder of toezichthouder handelen in
      strijd met wettelijke bepalingen of de kennelijke geest van wettelijke bepalingen waarmee financieel voordeel wordt
      behaald ten gunste van de rechtspersoon die de school in stand houdt, zichzelf of een derde, en
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel128
  - number: 128.2.d
    text: |-
      het in ernstige mate verwaarlozen van de zorg voor wat door redelijkheid en billijkheid wordt gevorderd in de
      omgang met betrokkenen in de schoolorganisatie, waaronder wordt verstaan intimidatie of bedreiging van personeel,
      leerlingen of ouders door een bestuurder of toezichthouder.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel128
  - number: '128.3'
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten sprake is van wanbeheer alsmede de in
      verband daarmee te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel128
  - number: '128.4'
    text: Een aanwijzing bevat de termijn waarbinnen het bevoegd gezag aan de aanwijzing moet voldoen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel128
  - number: '128.5'
    text: 'Alvorens Onze Minister een aanwijzing als bedoeld in het eerste lid geeft:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel128
  - number: 128.5.a
    text: |-
      heeft de inspectie een onderzoek als bedoeld in [artikel 11][ref1] of
      [artikel 15 van de Wet op het onderwijstoezicht][ref2] verricht,


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel15
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '15'
  - number: 128.5.b
    text: |-
      heeft de inspectie daarover een inspectierapport als bedoeld in
      [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref1] uitgebracht, en


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
  - number: 128.5.c
    text: |-
      stelt Onze Minister de rechtspersoon vervolgens vier weken in de gelegenheid zijn zienswijze met betrekking tot de
      aanwijzing naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel128
  - number: '129.1'
    text: |-
      Indien het bevoegd gezag van een school in strijd handelt met het bepaalde bij of krachtens deze wet, waaronder
      tevens wordt verstaan het niet opvolgen van een aanwijzing als bedoeld in [artikel 133][ref1], kan Onze Minister
      bepalen dat de bekostiging, voorschotten daaronder begrepen, geheel of gedeeltelijk wordt ingehouden dan wel
      opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel133
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '133'
        hoofdstuk: I
        afdeling: '9'
  - number: '129.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een school in
      strijd handelt met [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '129.3'
    text: |-
      Onze Minister kent de bekostiging wederom toe, indien blijkt dat de reden voor de toepassing van het eerste of
      tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel129
  - number: '132.1'
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het ten behoeve van Onze Minister beschikt over geordende gegevens die
      van belang zijn voor de berekening van de hoogte van de bekostiging, alsmede over een verklaring over de juistheid
      van de bekostigingsgegevens, afgegeven door een door de toezichthouder of het toezichthoudend orgaan aangewezen
      deskundige als bedoeld in [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '132.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de definiëring,
      de wijze van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel132
  - number: '132.3'
    text: |-
      Het bevoegd gezag bewaart de gegevens, bedoeld in het eerste lid, en de desbetreffende boeken en bescheiden
      gedurende een periode van zeven jaren.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel132
  - number: '135.1'
    text: |-
      De deskundige, bedoeld in [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref1], die door Onze
      Minister is belast met het onderzoek van de controlerapporten, bedoeld in [artikel 131, vierde lid][ref2], en met
      het onderzoek van de juistheid van de bekostigingsgegevens, bedoeld in [artikel 132][ref3], heeft met het oog op
      het verrichten van dat onderzoek toegang tot de plaats waar de desbetreffende boeken en bescheiden worden bewaard.
      Aan de deskundige wordt desgevraagd inzage in de boeken en bescheiden gegeven en worden alle inlichtingen verstrekt
      die deze voor de uitvoering van zijn taak nodig oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel131
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel132
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '131'
        hoofdstuk: I
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0030280
        artikel: '132'
        hoofdstuk: I
        afdeling: '9'
  - number: '135.2'
    text: |-
      Onze Minister kan naast het deskundigenonderzoek, bedoeld in het eerste lid, een onderzoek instellen of doen
      instellen naar de rechtmatigheid van het beheer op grond van de ter beschikking gestelde controlerapporten,
      bedoeld in [artikel 131, vierde lid][ref1], en de bekostigingsgegevens, bedoeld in [artikel 132][ref2]. Het bevoegd
      gezag verstrekt aan degene die door Onze Minister met het onderzoek is belast, alle inlichtingen die deze voor de
      uitvoering van zijn taak nodig oordeelt en geeft desgevraagd inzage in de boeken en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel132
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '131'
        hoofdstuk: I
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '132'
        hoofdstuk: I
        afdeling: '9'
  - number: '146.1'
    text: |-
      Onze Minister kan bepalen dat geen of slechts een gedeeltelijke bekostiging wordt verstrekt voor uitgaven die het
      gevolg zijn van schuld of nalatigheid van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel146
  - number: '146.2'
    text: |-
      Indien de uitgaven bedoeld in het eerste lid, voor bekostiging door het Rijk in aanmerking komen, treedt het Rijk
      op het moment van een uitdrukkelijk besluit tot bekostiging in alle rechten die het bevoegd gezag ter zake tegen
      derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel146
  - number: '146.3'
    text: |-
      Indien het openbaar lichaam een collectieve verzekering heeft afgesloten voor de vergoeding van schade, ontstaan
      aan gebouwen, terreinen of roerende zaken van een niet door het openbaar lichaam in stand gehouden school, heeft
      het bevoegd gezag van de desbetreffende school jegens het openbaar lichaam geen aanspraak op vergoeding van
      dergelijke schade, voor zover die collectieve verzekering de schade dekt.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel146
  - number: '146.4'
    text: |-
      Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een niet door het openbaar lichaam in stand
      gehouden school voor vergoeding door het openbaar lichaam in aanmerking komt, treedt het openbaar lichaam op het
      moment van een uitdrukkelijk besluit tot vergoeding in alle rechten die het bevoegd gezag ter zake van die schade
      tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel146
  - number: '151.1'
    text: |-
      Indien een bij of krachtens de wet gestelde termijn door het bevoegd gezag wordt overschreden en het openbaar
      lichaam daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum
      bekostiging van het Rijk voor de materiële instandhouding ontvangt dan het geval zou zijn geweest indien deze
      termijn wel in acht was genomen, vergoedt het bevoegd gezag de door het openbaar lichaam geleden schade.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel151
  - number: '151.2'
    text: |-
      Indien een bij of krachtens de wet gestelde termijn door het bestuurscollege wordt overschreden en het bevoegd
      gezag daardoor geen bekostiging van het Rijk dan wel lagere bekostiging of met ingang van een latere datum
      bekostiging van het Rijk voor de materiële instandhouding ontvangt dan het geval zou zijn geweest indien deze
      termijn wel in acht was genomen, vergoedt het openbaar lichaam de door het bevoegd gezag geleden schade.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel151
  - number: '151.3'
    text: |-
      Het bestuurscollege en het bevoegd gezag kunnen in onderling overleg de in het eerste en tweede lid
      bedoelde verplichting tot schadevergoeding matigen. Indien dit overleg niet tot overeenstemming leidt, is
      [artikel 106 van Boek 6 van het Burgerlijk Wetboek BES][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028749#Artikel106
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0028749
        artikel: '106'
  - number: '152'
    text: |-
      Het bevoegd gezag van een bijzondere school is verplicht de uit de overheidskassen ontvangen gelden overeenkomstig
      de bestemming te gebruiken. Van de inkomsten en uitgaven wordt volgens bij algemene maatregel van bestuur te geven
      voorschriften nauwkeurig boekgehouden.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel152
  - number: '153'
    text: |-
      Een beslissing als bedoeld in de [artikelen 41, derde lid][ref1], en [44, eerste lid][ref2],
      van een bevoegd gezag van een openbare school geldt als een beschikking als bedoeld in
      [artikel 3 van de Wet administratieve rechtspraak BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0028455#Artikel3
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '41'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '44'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0028455
        artikel: '3'
  - number: '161'
    text: |-
      De aanspraak op bekostiging van een school die direct voorafgaand aan de inwerkingtreding van [artikel 72][ref1]
      werd bekostigd op grond van de Wet primair onderwijs BES zoals die wet op 10 oktober 2010 is komen te luiden,
      berust vanaf de inwerkingtreding van [artikel 72][ref2] op [hoofdstuk I, titel III][ref3] en op hoofdstuk II.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0030280
        hoofdstuk: I
  - number: '162.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven over de vaststelling door het bevoegd
      gezag van een begroting en de inrichting daarvan.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel162
  - number: '162.2'
    text: Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel162
  - number: '163'
    text: |-
      Tot de datum van inwerkingtreding van [artikel 76, derde lid][ref1], is een aanvraag om een besluit als
      bedoeld in artikel 76, eerste of tweede lid, met redenen omkleed en gaat vergezeld van de gegevens, genoemd in
      [artikel 72, tweede lid][ref2]. Onze Minister willigt de aanvraag om een besluit als bedoeld in artikel 76, eerste
      lid, slechts in, ingeval:


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel72
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '76'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 163.a
    text: |-
      de school bij toepassing van [artikel 72, derde lid][ref1], door hem in aanmerking zou worden gebracht voor
      bekostiging,


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 163.b
    text: |-
      indien op de onder a genoemde grond geen bekostiging zou kunnen worden verstrekt en het een omzetting in een
      openbare school of een uitbreiding met openbaar onderwijs betreft, binnen 10 kilometer van de plaats in het
      openbaar lichaam waar het onderwijs moet worden gegeven over de weg gemeten geen school aanwezig is waarbinnen
      openbaar onderwijs wordt gegeven en aan het volgen van openbaar onderwijs behoefte bestaat, of
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel163
  - number: 163.c
    text: |-
      de bekostiging van de school, indien daaraan het onderwijs wordt uitgebreid met openbaar onderwijs of met
      onderwijs van een of meer richtingen, van uitsluitend een of meer op te heffen scholen, met inachtneming van
      [artikel 122, eerste lid][ref1], gedurende ten minste 20 achtereenvolgende jaren zou kunnen worden voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel122
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '122'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '8'
  - number: '164.1'
    text: |-
      Tot de datum van inwerkingtreding van [artikel 101][ref1] wordt voor de bekostiging van personeel een bedrag per
      leerling toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel101
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '101'
        hoofdstuk: I
        afdeling: '5'
  - number: '164.2'
    text: 'Het bedrag, bedoeld in het eerste lid, kan in elk geval verschillend worden vastgesteld voor leerlingen:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel164
  - number: 164.2.a
    text: van een school in de leeftijd van 4 tot en met 7 jaar, en
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel164
  - number: 164.2.b
    text: van een school in de leeftijd van 8 jaar en ouder.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel164
  - number: '164.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald in welke gevallen en onder welke voorwaarden aanvullende
      bekostiging voor personeelskosten kan worden toegekend. In ieder geval wordt aanvullende bekostiging toegekend voor
      kleine scholen, schoolleiding en de bestrijding van onderwijsachterstanden. De omvang van de aanvullende vergoeding
      wordt bij of krachtens algemene maatregel van bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel164
  - number: '164.4'
    text: Bij ministeriële regeling wordt het bedrag, bedoeld in het eerste lid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel164
  - number: '164.5'
    text: |-
      De bekostiging, bedoeld in het eerste lid, en de bekostiging voor kleine scholen, schoolleiding en de bestrijding
      van onderwijsachterstanden, bedoeld in de tweede volzin van het derde lid, is redelijkerwijs voldoende voor het
      leiden en beheren van de school, voor het geven van onderwijs aan de school en voor de overige werkzaamheden die
      verband houden met het onderwijs aan de school.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel164
  - number: '164.6'
    text: |-
      Tot de datum van inwerkingtreding van [artikel 101][ref1] worden verwijzingen naar artikel 101 gelezen als
      verwijzingen naar [artikel 164][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel164
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '101'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '164'
        hoofdstuk: II
  - number: '165'
    text: |-
      Tot de datum van inwerkingtreding van [artikel 102, derde lid][ref1], geldt dat voor de toepassing van
      [artikel 101, eerste lid][ref2], ingeval van samenvoeging van scholen het aantal leerlingen van alle bij de
      samenvoeging betrokken scholen, voor elke school wordt vastgesteld volgens het eerste lid van artikel 102.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel101
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '102'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '101'
        hoofdstuk: I
        afdeling: '5'
  - number: '166'
    text: |-
      Tot de datum van inwerkingtreding van [artikel 105, eerste lid][ref1], wordt bij ministeriële regeling de
      grondslag vastgesteld voor de omvang van de bekostiging voor personeels- en arbeidsmarktbeleid. Deze grondslag kan
      verschillend worden vastgesteld voor scholen en voor groepen van scholen. De omvang van de bekostiging is in ieder
      geval afhankelijk of mede afhankelijk van het aantal leerlingen op de teldatum, bedoeld in [artikel 102][ref2], en
      de samenstelling van het leerlingenbestand.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel102
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '105'
        hoofdstuk: I
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '102'
        hoofdstuk: I
        afdeling: '5'
  - number: '167.1'
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip zendt het bevoegd gezag voor 15 oktober volgend op de teldatum
      1 oktober aan Onze Minister een opgave van het aantal leerlingen. Indien deze opgave niet voor die datum wordt
      gedaan, stelt Onze Minister het aantal leerlingen, indien die gegevens voor de voortzetting of beëindiging van de
      bekostiging onderscheidenlijk de opheffing of instandhouding van een school noodzakelijk zijn, ambtshalve vast.
      Een opgave van het aantal leerlingen op of na 15 oktober aan Onze Minister heeft geen invloed op het ambtshalve
      vastgestelde aantal leerlingen voor zover het betreft het al of niet beëindigen van de bekostiging van een
      bijzondere school of de opheffing of instandhouding van een openbare school.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel167
  - number: '167.2'
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip wijst Onze Minister het bevoegd gezag voorafgaand aan de
      teldatum 1 oktober op de verplichting, bedoeld in de eerste volzin van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel167
  - number: 167a.1
    text: |-
      In afwijking van de [artikelen 78 tot en met 84][ref1] en met overeenkomstige toepassing van [artikel 87][ref2]
      gelden de voorschriften van het tweede tot en met negende lid voor de voorziening in de huisvesting van uit 's
      Rijks kas bekostigde scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel87
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel167a
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '78'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '87'
        hoofdstuk: I
        afdeling: '3'
  - number: 167a.2
    text: |-
      Onze Minister verstrekt voor de jaren 2011 tot en met 2015 aan elk van de openbare
      lichamen Bonaire, Sint Eustatius en Saba een bijzondere uitkering als bedoeld in artikel
      [Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] ten behoeve van de uitvoering van een
      door hem vast te stellen plan voor de voorziening in de huisvesting van uit 's Rijks kas bekostigde scholen
      voor basisonderwijs, scholen voor voortgezet onderwijs en instellingen voor beroepsonderwijs, alsmede voor de
      voorziening in de huisvesting van kinderopvang.


      [ref1]: https://wetten.overheid.nl/BWBR0028151
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel167a
    references:
      - id: ref1
        bwb_id: BWBR0028151
  - number: 167a.3
    text: |-
      Het plan vermeldt voor elk jaar welke scholen, instellingen voor beroepsonderwijs of kinderopvangvoorzieningen in
      dat jaar voor een voorziening in de huisvesting in aanmerking worden gebracht, onder vermelding van de daarvoor
      beschikbare bedragen. Het plan geeft aan welk deel van het bedrag dat nodig is voor de voorzieningen in de
      huisvesting wordt gedekt uit de bijzondere uitkering en welk deel uit de vrije uitkering.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel167a
  - number: 167a.4
    text: |-
      Onze Minister stelt het plan vast in overeenstemming met de bestuurscolleges van de openbare lichamen en na overleg
      met de bevoegde gezagsorganen van de scholen, de instellingen en met de besturen van de kinderopvangvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel167a
  - number: 167a.5
    text: |-
      Onze Minister besluit jaarlijks in overeenstemming met de bestuurscolleges van de openbare lichamen in hoeverre het
      plan wijziging behoeft.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel167a
  - number: 167a.6
    text: |-
      Indien een voorziening in de huisvesting die voor het desbetreffende jaar niet in het plan is opgenomen, geen
      uitstel kan lijden, kan Onze Minister het plan wijzigen dan wel de bijzondere uitkering verhogen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel167a
  - number: 167a.7
    text: |-
      Het plan dan wel de wijziging daarvan wordt aan de bevoegde gezagsorganen van scholen, instellingen en aan de
      besturen van de kinderopvangvoorzieningen en in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel167a
  - number: 167a.8
    text: |-
      Overeenkomstig het plan brengt de eilandsraad of het bestuurscollege jaarlijks de voorzieningen die voor het
      daaropvolgende jaar in het plan zijn opgenomen, voor bekostiging in aanmerking.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel167a
  - number: 167a.9
    text: |-
      Het bestuurscollege verantwoordt jegens Onze Minister de bijzondere uitkering in een bijlage bij de jaarrekening,
      bedoeld in [artikel 28, eerste lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1].
      Uit de bijlage blijkt op welke wijze de uitkering is aangewend en de rechtmatigheid daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel28
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel167a
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '28'
  - number: 167a.10
    text: |-
      Onze Minister kan nadere regelen stellen omtrent de in de bijlage te verstrekken informatie voor zover deze nodig
      is voor een beoordeling van besteding van de bijzondere uitkering.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel167a
  - number: 167b
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip blijven de bepalingen van de Wet primair onderwijs BES zoals
      die is komen te luiden op 10 oktober 2010, van kracht voor zover de regeling van de daarin opgenomen onderwerpen
      niet is vervangen door de inwerkingtreding van overeenkomstige onderwerpen in deze wet. De vorige volzin is niet
      van toepassing op de onderwerpen geregeld in de [artikelen 14][ref1], [16][ref2] en [18][ref3] van de Wet primair
      onderwijs BES zoals die is komen te luiden op 10 oktober 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel18
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel167b
