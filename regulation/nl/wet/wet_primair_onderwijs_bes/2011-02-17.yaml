  - number: '2'
    text: |-
      Het basisonderwijs is het onderwijs bestemd voor kinderen vanaf de leeftijd van omstreeks 4 jaar. Het legt mede de
      grondslag voor het volgen van aansluitend voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel2
  - number: '6.1'
    text: |-
      Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn school met
      taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden als
      bedoeld in het [Tweede Boek, titel XIV, van het Wetboek van Strafrecht BES][ref1] jegens een leerling
      van de school, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028570
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028570
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '6'
  - number: '6.2'
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van een redelijk
      vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf als bedoeld in het eerste
      lid jegens een leerling van de school, doet het bevoegd gezag onverwijld aangifte bij een opsporingsambtenaar
      als bedoeld in [artikel 1][ref1] juncto [artikel 184 van het Wetboek van Strafvordering BES][ref2], en stelt het
      bevoegd gezag de vertrouwensinspecteur daarvan onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het
      doen van aangifte, stelt het de ouders van de betrokken leerling, onderscheidenlijk de betreffende ten behoeve van
      de school met taken belaste persoon, hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '6.3'
    text: |-
      Indien een personeelslid op enigerlei wijze bekend is geworden dat een ten behoeve van de school met taken belast
      persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een
      leerling van de school, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel6
  - number: '7'
    text: |-
      Het bevoegd gezag van een bijzondere school geeft binnen vier weken na de oprichting van de school onder
      overlegging van de statuten van de rechtspersoon, die de school in stand houdt, en van de reglementen, van die
      oprichting kennis aan Onze Minister. Indien de statuten of reglementen worden gewijzigd of ingetrokken, wordt
      eveneens binnen vier weken van de wijziging of van de intrekking van de statuten of reglementen aan Onze Minister
      kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel7
  - number: '8'
    text: |-
      Ten laste van een andere openbare kas dan van Rijk en openbaar lichaam worden geen scholen in stand gehouden, noch
      uitgaven voor een school gedaan. Openbare lichamen doen geen uitgaven voor een niet door het openbaar lichaam in
      stand gehouden school dan krachtens de wet.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel8
  - number: '9.1'
    text: |-
      Deze wet is niet van toepassing op scholen die uitsluitend bestemd zijn voor kinderen die niet de Nederlandse
      nationaliteit hebben.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel9
  - number: '9.2'
    text: Bij twijfel of op een school het eerste lid van toepassing is, besluit de Kroon, de Raad van State gehoord.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel9
  - number: '31.1'
    text: |-
      Aan elke school zijn 1 of 2 directeuren verbonden, bij wie onder verantwoordelijkheid van het bevoegd gezag de
      onderwijskundige, organisatorische en huishoudelijke leiding berust. De functie van directeur kan minder dan een
      volledige formatieplaats omvatten. De directeur van een school kan tevens met de leiding worden belast van een
      andere school waar de functie van directeur vacant is. De directeur van een school kan tevens directeur zijn van
      een andere school.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel31
  - number: '31.2'
    text: Aan een school zijn een of meer leraren verbonden.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel31
  - number: '31.3'
    text: |-
      Een of meer leraren kunnen tevens tot adjunct-directeur worden benoemd dan wel tewerkgesteld zonder benoeming.
      Indien geen adjunct-directeur wordt benoemd dan wel tewerkgesteld zonder benoeming en aan de school slechts 1
      directeur is verbonden, wijst het bevoegd gezag een leraar aan als plaatsvervanger van de directeur.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel31
  - number: '31.4'
    text: |-
      Voor zover het betreft de functie van directeur en adjunct-directeur, wordt in geval van samenvoeging van scholen
      de overblijvende school gelijkgesteld met een nieuwe school. De directeur, onderscheidenlijk de adjunct-directeur
      of adjunct-directeuren, kan slechts een van de directeuren onderscheidenlijk kunnen slechts een of meer van de
      adjunct-directeuren van de samen te voegen scholen zijn, tenzij geen van de betrokkenen de desbetreffende functie
      wenst te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel31
  - number: '31.5'
    text: |-
      Het bevoegd gezag kan tevens personeel, dat werkzaamheden verricht ten behoeve van meer dan een school, benoemen
      of tewerkstellen zonder benoeming waaronder begrepen leden van het bestuur van die scholen voor zover het intern
      toezicht wordt uitgeoefend door een raad van toezicht als bedoeld in [artikel 25, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel25
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '25'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '31.6'
    text: Aan een school kan onderwijsondersteunend personeel zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel31
  - number: '31.7'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welke rechtspositionele gevolgen zijn verbonden aan functies
      die zowel onderwijsgevende als onderwijsondersteunende taken omvatten.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel31
  - number: '37.1'
    text: |-
      De [Wet materieel ambtenarenrecht BES][ref1] en de daarop berustende regelingen zijn voor het personeel van een
      school voor bijzonder onderwijs van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028215
  - number: '37.2'
    text: Voor de salarissen en toelagen van het personeel wordt een regeling vastgesteld bij eilandsbesluit.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel37
  - number: '37.3'
    text: |-
      Het bestuurscollege stelt de regeling, bedoeld in het tweede lid, dan wel een wijziging daarvan niet vast dan nadat
      daarover op overeenstemming gericht overleg is gevoerd met de bevoegde gezagsorganen en met de onderwijsvakbonden
      of, bij het ontbreken daarvan, met een representatief te achten vertegenwoordiging van het personeel.
      [Artikel 101 van de Wet materieel ambtenarenrecht BES][ref1] is niet van toepassing op de vaststelling dan wel
      wijziging van de regeling, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel101
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '101'
  - number: '38'
    text: |-
      [Artikel 6, eerste lid, onderdeel b, van de Wet materieel ambtenarenrecht BES][ref1] is niet van toepassing op
      het personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel6
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '6'
  - number: '39'
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat het personeel. Van een benoeming in vaste dienst en in tijdelijke
      dienst voor langer dan een half jaar, alsmede van een ontslag uit een zodanige betrekking, doet het bevoegd gezag
      terstond mededeling aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel39
  - number: '40.1'
    text: |-
      Het bevoegd gezag benoemt de directeur en de adjunct-directeur, de leraren en het onderwijsondersteunend personeel
      in algemene dienst van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel40
  - number: '40.2'
    text: |-
      Onder benoeming in algemene dienst van het bevoegd gezag wordt verstaan een benoeming ten behoeve van het
      verrichten van werkzaamheden aan door het bevoegd gezag in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel40
  - number: '41.1'
    text: |-
      Het bevoegd gezag is verplicht aan studenten die in opleiding zijn voor een functie in het basisonderwijs of in
      het voortgezet onderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste ervaring in de school
      te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel41
  - number: '41.2'
    text: 'De verplichting, bedoeld in het eerste lid, betreft:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel41
  - number: 41.2.a
    text: |-
      studenten die op een school voor de opleiding van onderwijzend personeel zijn ingeschreven of anderszins studeren
      om aan de bekwaamheidseisen te voldoen;
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel41
  - number: 41.2.b
    text: |-
      in een schooljaar gelijktijdig niet meer studenten als bedoeld onder a, dan de helft van het aantal groepsleraren
      in dat jaar.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel41
  - number: '41.3'
    text: |-
      Een bevoegd gezag kan een student de verdere toegang tot de school ontzeggen indien deze in de school in strijd
      handelt met de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot
      de school wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van de
      betrokken opleidingsinstelling dan wel aan de betrokken staatsexamencommissie, en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel41
  - number: '41.4'
    text: |-
      De directeur regelt, onder verantwoordelijkheid van het bevoegd gezag, de werkzaamheden in verband met de
      begeleiding door het onderwijzend personeel van de studenten in de school in overeenstemming met dit personeel,
      alsmede in overeenstemming met de betrokken opleidingsinstellingen, dan wel, indien het betreft studenten die zich
      voorbereiden op het afleggen van een staatsexamen om te voldoen aan de bekwaamheidseisen, in overeenstemming met de
      betrokken staatsexamencommissie.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel41
  - number: '41.5'
    text: |-
      Onze Minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor een schooljaar.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel41
  - number: '41.6'
    text: |-
      De scholen waarop studenten als bedoeld in het eerste lid zijn toegelaten, zijn toegankelijk voor de inspectie
      belast met het toezicht op de opleidingsinstellingen, voor de directeuren en de door deze aan te wijzen leraren
      van die opleidingsinstellingen, alsmede voor de leden van de betrokken staatsexamencommissies, een en ander voor
      zover zulks voor de uitoefening van het toezicht op de praktische vorming, onderscheidenlijk de begeleiding van de
      praktische vorming van de in de school aanwezige studenten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel41
  - number: '52.1'
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de leerlingen met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse en Caribische samenleving en met
      onderkenning van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel52
  - number: '52.2'
    text: Openbare scholen zijn toegankelijk voor alle kinderen zonder onderscheid van godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel52
  - number: '52.3'
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel52
  - number: '53.1'
    text: |-
      Een eilandsraad kan bij verordening een openbare rechtspersoon instellen die tot doel heeft een of meer openbare
      scholen in het openbaar lichaam in stand te houden, al dan niet tezamen met openbare scholen voor voortgezet
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel53
  - number: '53.2'
    text: De eilandsraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel53
  - number: '53.3'
    text: |-
      De openbare rechtspersoon oefent met uitzondering van de besluitvorming over de opheffing van een openbare school
      alle taken en bevoegdheden uit van het bevoegd gezag. Hij bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel53
  - number: '53.4'
    text: |-
      De verordening, bedoeld in het eerste lid, voorziet in ieder geval in een regeling waarin een overheersende invloed
      van de overheid in het bestuur is verzekerd, en waarin voorts wordt geregeld:
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel53
  - number: 53.4.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de openbare rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel53
  - number: 53.4.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de eilandsraad en dat ten minste een derde gedeelte, doch geen meerderheid,
      van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn ingeschreven op de
      betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel53
  - number: 53.4.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel53
  - number: 53.4.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de eilandsraad en de vaststelling van de jaarrekening na
      instemming van de eilandsraad,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel53
  - number: 53.4.e
    text: de wijze waarop de eilandsraad toezicht op het bestuur uitoefent,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel53
  - number: 53.4.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden, en
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel53
  - number: 53.4.g
    text: |-
      de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen, met dien verstande dat deze periode ten
      minste 5 jaren bedraagt.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel53
  - number: '53.5'
    text: |-
      De goedkeuring, bedoeld in het vierde lid, onderdeel d, kan worden onthouden wegens strijd met het recht of met het
      algemeen belang, waaronder begrepen het financiële belang van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel53
  - number: '53.6'
    text: |-
      Het bestuur brengt jaarlijks aan de eilandsraad verslag uit over de werkzaamheden, waarbij in ieder geval aandacht
      wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel53
  - number: '53.7'
    text: |-
      De vergaderingen van het bestuur van de openbare rechtspersoon zijn openbaar, tenzij het bestuur anders beslist, op
      gronden, vermeld in de verordening.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel53
  - number: '53.8'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      eilandsraad de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel53
  - number: '53.9'
    text: |-
      De eilandsraad is in geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet
      bevoegd zelf te voorzien in het bestuur van de scholen en zo nodig de openbare rechtspersoon te ontbinden.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel53
  - number: '54.1'
    text: |-
      Een eilandsraad kan besluiten dat een of meer openbare scholen in het openbaar lichaam in stand worden gehouden
      door een stichting die zich ten doel stelt het in stand houden van een of meer openbare scholen, al dan niet
      tezamen met openbare scholen voor voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: '54.2'
    text: De eilandsraad maakt het voornemen tot een besluit als bedoeld in het eerste lid bekend.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: '54.3'
    text: |-
      Een stichting die een openbare school in stand houdt, wordt opgericht door een openbaar lichaam, al dan niet
      tezamen met een of meer privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: '54.4'
    text: |-
      Het statutaire doel van de stichting is uitsluitend het geven van openbaar onderwijs overeenkomstig
      [artikel 52][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel52
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '52'
        hoofdstuk: I
        afdeling: '2'
  - number: '54.5'
    text: |-
      De stichting oefent met uitzondering van de besluitvorming over de opheffing van een openbare school alle taken en
      bevoegdheden van het bevoegd gezag uit.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: '54.6'
    text: |-
      Onverminderd het vierde lid voorzien de statuten in ieder geval in een regeling waarin een overheersende invloed
      van de overheid in het bestuur is verzekerd:
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: 54.6.a
    text: de samenstelling, werkwijze en inrichting van het bestuur van de stichting,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: 54.6.b
    text: |-
      de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden, met dien verstande dat de leden
      van het bestuur worden benoemd door de eilandsraad en dat ten minste een derde gedeelte, doch geen meerderheid,
      van die leden wordt benoemd op bindende voordracht van de ouders van de leerlingen die zijn ingeschreven op de
      betrokken school of scholen,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: 54.6.c
    text: de termijn waarvoor de bestuursleden worden benoemd,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: 54.6.d
    text: |-
      de vaststelling van de begroting na goedkeuring door de eilandsraad en de vaststelling van de jaarrekening na
      instemming van de eilandsraad,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: 54.6.e
    text: de wijze waarop de eilandsraad toezicht op het bestuur uitoefent,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: 54.6.f
    text: de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: 54.6.g
    text: |-
      de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: 54.6.h
    text: de bevoegdheid de stichting te ontbinden.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: '54.7'
    text: |-
      De goedkeuring, bedoeld in het zesde lid, onderdeel d, kan worden onthouden wegens strijd met het recht of met het
      algemeen belang, waaronder begrepen het financiële belang van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: '54.8'
    text: De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de eilandsraad.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: '54.9'
    text: |-
      Het bestuur brengt jaarlijks aan de eilandsraad verslag uit over de werkzaamheden, waarbij in ieder geval aandacht
      wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het verslag wordt openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: '54.10'
    text: |-
      De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: '54.11'
    text: |-
      Indien voor 1 februari van het jaar waarvoor de begroting geldt, de begroting niet is goedgekeurd, neemt de
      eilandsraad de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel54
  - number: '55.1'
    text: |-
      De rechtspersoon die een openbare school in stand houdt, kan de instandhouding van die school overdragen aan
      een andere rechtspersoon die tot instandhouding van een openbare school bevoegd is. De overdracht geschiedt bij
      notariële akte.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel55
  - number: '55.2'
    text: |-
      Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering als bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel89
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '89'
  - number: '55.3'
    text: |-
      In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en
      onder dezelfde voorwaarden als vermeld in de schriftelijke aanstelling, aan de school aanstelt met ingang van de
      datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel55
  - number: '55.4'
    text: |-
      Door overdracht met inachtneming van de voorgaande leden treedt de verkrijgende rechtspersoon in alle uit de wet
      voortvloeiende rechten en verplichtingen die zijn rechtsvoorganger bezit in zijn hoedanigheid van bevoegd gezag,
      onverminderd hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel55
  - number: '56'
    text: |-
      Het bevoegd gezag stelt de leerlingen in de gelegenheid op de school, binnen de schooltijden, godsdienstonderwijs
      of levensbeschouwelijk vormingsonderwijs te ontvangen. Van de tijd daaraan te besteden worden ten
      hoogste 120 uren per schooljaar meegeteld voor het aantal uren onderwijs dat de leerlingen krachtens
      [artikel 10, zesde lid, aanhef en onder b][ref1], ten minste moeten ontvangen. Voor de leerlingen die dit onderwijs
      niet volgen, voorziet het bevoegd gezag in andere onderwijsactiviteiten op de school.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel10
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '57.1'
    text: |-
      Godsdienstonderwijs wordt gegeven door leraren daartoe aangewezen door kerkelijke gemeenten, plaatselijke kerken,
      of rechtspersonen met volledige rechtsbevoegdheid die zich blijkens hun statuten het geven van godsdienstonderwijs
      ten doel stellen. Levensbeschouwelijk vormingsonderwijs wordt gegeven door leraren daartoe aangewezen door
      volledige rechtsbevoegdheid bezittende organisaties op geestelijke grondslag.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel57
  - number: '57.2'
    text: |-
      Het bevoegd gezag ziet erop toe dat dit onderwijs uitsluitend wordt gegeven door een leraar die blijkens een
      daartoe strekkende verklaring van de aanwijzende instantie:
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel57
  - number: 57.2.a
    text: |-
      voldoet aan de bekwaamheidseisen die krachtens [artikel 35, eerste lid][ref1], voor het geven van dat onderwijs
      zijn vastgesteld, en


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel35
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '35'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: 57.2.b
    text: zijn bekwaamheid onderhoudt.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel57
  - number: '58'
    text: |-
      De Rijksvertegenwoordiger is, in afwijking van [artikel 39][ref1], bevoegd de disciplinaire straf of de schorsing
      op te leggen dan wel het ontslag te verlenen, indien het een directeur, een adjunct-directeur, of een ander lid
      van het onderwijzend personeel van een openbare school betreft en deze tevens lid is van de eilandsraad van het
      openbaar lichaam die de school in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel39
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '39'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '59.1'
    text: |-
      De aanstelling of tewerkstelling zonder aanstelling van de mede-directeur, de adjunct-directeur of leraren
      geschiedt, de directeur gehoord.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel59
  - number: '59.2'
    text: |-
      De aanstelling en de overplaatsing van directeuren en adjunct-directeuren geschiedt door het bevoegd gezag, het
      personeel gehoord.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel59
  - number: '60'
    text: |-
      Een bijzondere school wordt in stand gehouden door een rechtspersoon met volledige rechtsbevoegdheid die zich
      blijkens de statuten of reglementen het geven van onderwijs ten doel stelt zonder daarbij het maken van winst te
      beogen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel60
  - number: '61.1'
    text: |-
      De rechtspersoon die de school in stand houdt, kan de instandhouding van de school overdragen aan een andere
      rechtspersoon die voldoet aan [artikel 60][ref1]. De overdracht geschiedt bij notariële akte.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel60
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '60'
        hoofdstuk: I
        afdeling: '3'
  - number: '61.2'
    text: |-
      Bij deze akte verbindt de overdragende rechtspersoon zich tevens de rechten ten aanzien van gebouwen en
      terreinen alsmede de roerende zaken over te dragen. Deze akte geldt tevens als akte van levering bedoeld in
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel89
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '89'
  - number: '61.3'
    text: |-
      In de akte wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en
      onder dezelfde voorwaarden als vermeld in de akte van benoeming, benoemt met ingang van de datum van overdracht.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel61
  - number: '61.4'
    text: |-
      Door overdracht met inachtneming van de voorgaande leden, treedt de verkrijgende rechtspersoon in alle uit de
      wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de school, onverminderd
      hetgeen verder voor de overgang daarvan naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel61
  - number: '61.5'
    text: |-
      Bij een splitsing als bedoeld in [artikel 335 van Boek 2 van het Burgerlijk Wetboek BES][ref1] van een
      rechtspersoon die een school in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende
      rechtspersoon de school in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de school
      overgaat. In het laatste geval zijn het tweede tot en met vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel335
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '335'
  - number: '62'
    text: |-
      Onverminderd de [artikelen 11][ref1] en [12][ref2] kunnen de onderwijsactiviteiten godsdienstonderwijs
      of levensbeschouwelijk vormingsonderwijs omvatten. Van de tijd daaraan te besteden worden ten
      hoogste 120 uren per schooljaar meegeteld voor het aantal uren onderwijs dat de leerlingen krachtens
      [artikel 10, zesde lid, aanhef en onder b][ref3], ten minste moeten ontvangen. Het geven van godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs kan worden opgedragen aan een niet aan de school verbonden leraar.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel10
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '11'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '12'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0030280
        artikel: '10'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '1'
  - number: '63.1'
    text: |-
      Indien binnen redelijke afstand van de woning van de leerling geen gelegenheid bestaat tot het volgen van
      openbaar onderwijs, mag de toelating tot de school niet worden geweigerd op grond van godsdienstige gezindheid
      of levensbeschouwing. Het voorgaande is niet van toepassing indien de school uitsluitend is bestemd voor interne
      leerlingen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel63
  - number: '63.2'
    text: |-
      Leerlingen die ingevolge het eerste lid zijn toegelaten, kunnen niet worden verplicht godsdienstonderwijs of
      levensbeschouwelijk vormingsonderwijs te volgen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel63
  - number: '64.1'
    text: Ieder personeelslid is in het bezit van een door het bevoegd gezag en hemzelf getekende akte van benoeming.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel64
  - number: '64.2'
    text: |-
      De akte van benoeming bevat ten minste bepalingen van gelijke inhoud als de bepalingen die zijn vastgesteld in
      [artikel 11 van de Wet materieel ambtenarenrecht BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel11
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '11'
  - number: '65.1'
    text: |-
      Indien het bevoegd gezag van een bijzondere school op grond van [artikel 41, derde lid][ref1], een student de
      toegang weigert, deelt het deze beslissing, schriftelijk en met redenen omkleed, mede door toezending of uitreiking
      aan de student, onverminderd het bepaalde in dat artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel41
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '41'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '65.2'
    text: |-
      Indien het bevoegd gezag van een bijzondere school op grond van [artikel 44][ref1] weigert een leerling toe te
      laten dan wel een leerling verwijdert, deelt het de beslissing daartoe, schriftelijk en met redenen omkleed, mede
      door toezending of uitreiking aan de ouders. Daarbij wordt tevens de inhoud van het bepaalde in het derde lid,
      eerste volzin, vermeld. Het bevoegd gezag neemt de beslissing, bedoeld in de eerste volzin, zo spoedig mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel44
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '44'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '1'
  - number: '65.3'
    text: |-
      Binnen 6 weken na de mededeling, bedoeld in het tweede lid, kunnen de ouders bij het bevoegd gezag schriftelijk hun
      bezwaren kenbaar maken tegen de beslissing. Het bevoegd gezag beslist binnen 4 weken na ontvangst van de bezwaren.
      Alvorens te beslissen hoort het bevoegd gezag de ouders.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel65
  - number: '66.1'
    text: |-
      De openbare en de bijzondere scholen worden door het Rijk bekostigd volgens de bepalingen van deze titel met
      uitzondering van [afdeling 3][ref1]. Geen bekostiging vindt plaats indien groepen van leerlingen van verschillende
      scholen al dan niet van hetzelfde bevoegd gezag gezamenlijk onderwijs ontvangen. De bedragen die het openbaar
      lichaam krachtens deze wet in aanvulling op de rijksbekostiging verstrekt blijven ten laste van het openbaar
      lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0030280
        hoofdstuk: I
        afdeling: '3'
  - number: '66.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven ter uitvoering van het eerste lid. Deze
      algemene maatregel van bestuur bevat in elk geval een regeling omtrent de termijnen binnen welke besluiten moeten
      worden genomen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel66
  - number: '66.3'
    text: 'De algemene maatregel van bestuur bedoeld in het tweede lid, bevat tevens:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel66
  - number: 66.3.a
    text: |-
      een regeling omtrent de betaling van de bedragen van de bekostiging voor de materiële voorzieningen ten behoeve van
      de instandhouding voortvloeiende uit het gebruik door een school van voorzieningen die voor meer dan een school of
      voor andere doeleinden zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel66
  - number: 66.3.b
    text: |-
      een financiële regeling tussen het Rijk en de bevoegde gezagsorganen die personeel in dienst hebben dat niet door
      het Rijk wordt bekostigd ter zake van een korting op de bekostiging ter compensatie van de kosten van de voor dat
      personeel geldende rechtspositionele voorzieningen, voor zover deze ten laste van 's Rijks kas komen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel66
  - number: '67'
    text: |-
      Onze Minister kan onder nader te stellen voorwaarden aanvullende middelen ter beschikking stellen
      die niet strekken tot bekostiging van het onderwijs, bedoeld in deze wet, maar die direct of
      indirect dienstig zijn voor de uitvoering van het onderwijs of voor verhoging van de mogelijkheid
      tot deelname aan het onderwijs. Voor zover toepassing van de eerste volzin het verstrekken van
      subsidie betreft, zijn de [titels 4.1][ref1] en [4.2 van de Algemene wet bestuursrecht][ref2] en de
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0009458
        artikel: '4'
  - number: '68.1'
    text: Het Rijk bekostigt openbare en bijzondere scholen voor zorg voor leerlingen met een specifieke onderwijsbehoefte.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel68
  - number: '68.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven ter uitvoering van het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel68
  - number: '68.3'
    text: |-
      De in het eerste lid bedoelde bekostiging is voor wat betreft de materiële instandhouding verwerkt in de bedragen,
      bedoeld in de [artikelen 101][ref1] dan wel [164][ref2], en [103][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel164
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel103
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '101'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '164'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0030280
        artikel: '103'
        hoofdstuk: I
        afdeling: '5'
  - number: '70.1'
    text: |-
      In afwijking van [artikel 7, eerste lid, van de Wet administratieve rechtspraak BES][ref1] kan een belanghebbende
      beroep instellen bij het Gemeenschappelijke Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint
      Eustatius en Saba tegen:


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel7
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '7'
  - number: 70.1.a
    text: |-
      een besluit of een van rechtswege verleende goedkeuring als bedoeld in de [afdelingen 2][ref1] en [8][ref2] van
      deze titel,


      [ref1]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0030280
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0030280
        hoofdstuk: I
        afdeling: '8'
  - number: 70.1.b
    text: |-
      een besluit als bedoeld in [artikel 103, tweede lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel103
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '103'
        hoofdstuk: I
        afdeling: '5'
  - number: 70.1.c
    text: |-
      een besluit als bedoeld in [artikel 108][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel108
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '108'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '7'
  - number: '70.2'
    text: |-
      De [artikelen 54][ref1] en [55 Wet administratieve rechtspraak BES][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel55
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '54'
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '55'
  - number: '71.1'
    text: |-
      Voor de toepassing van deze titel zijn de voorschriften die betrekking hebben op bijzondere scholen, van
      overeenkomstige toepassing op openbare scholen die in stand worden gehouden door een stichting als bedoeld in
      [artikel 54][ref1] of een openbare rechtspersoon als bedoeld in [artikel 53][ref2], tenzij het tegendeel blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel53
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '54'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '53'
        hoofdstuk: I
        afdeling: '2'
  - number: '71.2'
    text: |-
      Indien een openbare school in stand wordt gehouden door een stichting of een openbare rechtspersoon, wordt
      deze aangemerkt als een door het openbaar lichaam in stand gehouden openbare school voor de toepassing van
      [afdeling 2][ref1] en [afdeling 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0030280#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0030280
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0030280
        hoofdstuk: I
        afdeling: '8'
  - number: '72.1'
    text: Onze Minister kan een school voor bekostiging in aanmerking brengen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel72
  - number: '72.2'
    text: |-
      Een aanvraag aan Onze Minister voor bekostiging vermeldt naam en adres van het bevoegd gezag en als het om een
      bijzondere school gaat, de richting en gaat vergezeld van:
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel72
  - number: 72.2.a
    text: een prognose van het te verwachten aantal leerlingen,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel72
  - number: 72.2.b
    text: de beschrijving van het voedingsgebied,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel72
  - number: 72.2.c
    text: de aanduiding van de plaats in het openbaar lichaam waar het onderwijs moet worden gegeven, en
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel72
  - number: 72.2.d
    text: het voorgestelde jaar van ingang van de bekostiging.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel72
  - number: '72.3'
    text: |-
      Een school wordt slechts voor bekostiging in aanmerking gebracht indien op grond van de bij de aanvraag overgelegde
      gegevens aannemelijk is dat zij binnen 5 jaar vanaf de datum van ingang van de bekostiging en voorts gedurende 15
      jaar na die periode van 5 jaar zal worden bezocht door ten minste 200 leerlingen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel72
  - number: '72.4'
    text: |-
      De [artikelen 73 tot en met 75][ref1] zijn niet van toepassing op bij omzetting van een bekostigde bijzondere
      school in een bekostigde openbare school of omgekeerd, bij omzetting van een bekostigde bijzondere school in
      een bekostigde bijzondere school van een andere richting en bij uitbreiding van het onderwijs aan een school met
      openbaar onderwijs of met onderwijs van een of meer richtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel73
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '73'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '72.5'
    text: De bekostiging kan slechts aanvangen per 1 augustus van een schooljaar.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel72
  - number: '72.6'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de elementen, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel72
  - number: '73'
    text: |-
      Onze Minister brengt een openbare school in elk geval voor bekostiging in aanmerking, indien binnen 10 kilometer
      van de plaats in het openbaar lichaam waar het onderwijs moet worden gegeven over de weg gemeten geen school
      aanwezig is waarbinnen openbaar onderwijs wordt gegeven en aan het volgen van openbaar onderwijs behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel73
  - number: '74'
    text: |-
      Bij de berekening van het aantal leerlingen dat een openbare of een bijzondere school zal bezoeken, worden
      niet meegeteld leerlingen die wonen binnen redelijke afstand van een openbare school, onderscheidenlijk van een
      bijzondere school van de desbetreffende richting of richtingen en voor wie op die school plaatsruimte aanwezig is.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel74
  - number: '75.1'
    text: |-
      Onze Minister beslist, na overleg met het betrokken bestuurscollege, binnen 6 maanden op de aanvraag, bedoeld in
      [artikel 72, tweede lid][ref1]. Onze Minister geeft het bevoegd gezag de gelegenheid om een onvolledige aanvraag
      binnen een door Onze Minister te stellen termijn aan te vullen.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 75.1a
    text: 'Onze Minister kan besluiten de aanvraag niet te behandelen, indien:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel75
  - number: 75.1a.a
    text: |-
      het bevoegd gezag niet heeft voldaan aan de vereisten voor het in behandeling nemen van de aanvraag, bedoeld in
      [artikel 72, tweede lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: 75.1a.b
    text: |-
      de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanvraag of voor de voorbereiding
      van de beschikking.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel75
  - number: '75.2'
    text: |-
      De aanspraak op bekostiging vervalt indien het onderwijs op de school niet is aangevangen binnen drie schooljaren
      volgend op het besluit. De aanspraak vervalt tevens indien binnen die periode zich omstandigheden hebben voorgedaan
      die bij de vaststelling van het besluit niet bekend waren, en die, waren zij wel bekend geweest, tot een ander
      besluit zouden hebben geleid.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel75
  - number: '76.1'
    text: |-
      Onze Minister kan onder door hem te stellen voorwaarden voor bekostiging in aanmerking brengen een school die wordt
      omgezet, als bedoeld in [artikel 72, vierde lid][ref1], of waaraan het onderwijs wordt uitgebreid met openbaar
      onderwijs, dan wel met onderwijs van een of meer richtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel72
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '72'
        hoofdstuk: I
        paragraaf: '1'
        afdeling: '2'
  - number: '76.2'
    text: |-
      Onze Minister kan toestaan dat een bekostigde school een andere plaats van vestiging krijgt. Onze Minister kan aan
      zijn toestemming voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel76
  - number: '77'
    text: Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel77
  - number: '78.1'
    text: |-
      De eilandsraad of het bestuurscollege draagt overeenkomstig het bepaalde in deze afdeling ten behoeve van de
      scholen zorg voor de voorzieningen in de huisvesting op het grondgebied van het openbaar lichaam. Deze huisvesting
      is zodanig dat kan worden voldaan aan de redelijke eisen die het onderwijs aan de huisvesting van scholen in het
      openbaar lichaam stelt. De eilandsraad of het bestuurscollege behandelt daarbij de door het openbaar lichaam in
      stand gehouden scholen en de andere scholen op gelijke voet.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel78
  - number: '78.2'
    text: |-
      Bij algemene maatregel van bestuur worden bruto vloeroppervlakten per gelijktijdig aanwezige leerling
      voorgeschreven die voorzieningen in de huisvesting ten minste dienen te bevatten.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel78
  - number: '79.1'
    text: 'Voor de toepassing van deze afdeling worden onder voorzieningen in de huisvesting begrepen:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel79
  - number: 79.1.a
    text: 'voor blijvend onderscheidenlijk voor tijdelijk gebruik bestemde voorzieningen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel79
  - number: 79.1.a.1°
    text: |-
      nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een gedeelte
      daarvan, terreinen, alsmede eerste aanschaf van onderwijsleerpakketten en meubilair,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel79
  - number: 79.1.a.2°
    text: uitbreiding van de onder 1° bedoelde voorzieningen, en
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel79
  - number: 79.1.a.3°
    text: medegebruik van een ruimte die geschikt is voor het onderwijs;
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel79
  - number: 79.1.b
    text: 'voorzieningen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel79
  - number: 79.1.b.1°
    text: |-
      aanpassingen met uitzondering van het aanbrengen van een invalidentoilet en het toegankelijk maken van het gebouw
      voor gehandicapten, en
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel79
  - number: 79.1.b.2°
    text: |-
      vervanging binnenkozijnen en binnendeuren inclusief hang- en sluitwerk, algehele vervanging onderdelen van
      een klimaatbeheersingssysteem, alsmede onderhoud aan de buitenzijde van het gebouw met uitzondering van het
      buitenschilderwerk;
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel79
  - number: 79.1.c
    text: |-
      herstel van constructiefouten aan het gebouw, alsmede herstel en vervanging in verband met schade aan gebouw,
      onderwijsleerpakketten en meubilair in geval van bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel79
  - number: '79.2'
    text: De kosten van bouwvoorbereiding kunnen tot de kosten van huisvesting worden gerekend.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel79
  - number: '80.1'
    text: |-
      Het bestuurscollege stelt jaarlijks, na overleg met de betrokken bevoegde gezagsorganen, ten behoeve van het
      eerstvolgende jaar voor een door het college te bepalen tijdstip een bekostigingsplafond vast voor de bekostiging
      van de voorzieningen in de huisvesting voor:
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel80
  - number: 80.1.a
    text: scholen, en
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel80
  - number: 80.1.b
    text: |-
      scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet onderwijs, voor
      voorbereidend beroepsonderwijs en voor praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel80
  - number: '80.2'
    text: |-
      Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      in het eerste lid bedoelde scholen op het grondgebied van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel80
  - number: '81.1'
    text: |-
      Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat een voorziening in de
      huisvesting wenst, dient een aanvraag voor 1 september voorafgaand aan het jaar waarop de aanvraag betrekking heeft
      in bij het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel81
  - number: '81.2'
    text: De eilandsraad stelt bij verordening de vereisten van de aanvraag vast.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel81
  - number: '81.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de door het openbaar lichaam in stand gehouden
      scholen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel81
  - number: '82.1'
    text: |-
      Het bestuurscollege beslist voor 1 januari van het jaar waarop de aanvraag betrekking heeft op de aanvraag.
      Het bestuurscollege geeft het bevoegd gezag de gelegenheid om een onvolledige aanvraag binnen een door het
      bestuurscollege te stellen termijn aan te vullen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel82
  - number: '82.2'
    text: 'Het bestuurscollege kan besluiten de aanvraag niet te behandelen, indien:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel82
  - number: 82.2.a
    text: |-
      het bevoegd gezag niet heeft voldaan aan de vereisten voor het in behandeling nemen van de aanvraag, uit de
      eilandsverordening, bedoeld in [artikel 81, tweede lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel81
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '81'
        hoofdstuk: I
        afdeling: '3'
  - number: 82.2.b
    text: |-
      de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanvraag of voor de voorbereiding
      van de beschikking.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel82
  - number: '82.3'
    text: |-
      Indien het bekostigingsplafond, bedoeld in [artikel 80][ref1], niet toereikend is, wordt de volgorde van verlening
      van bekostiging bepaald op basis van de urgentie van de gevraagde voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel80
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '80'
        hoofdstuk: I
        afdeling: '3'
  - number: '82.4'
    text: |-
      De beschikking van het bestuurscollege kan een gedeelte van de gewenste voorziening dan wel een andere voorziening
      dan gewenst omvatten.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel82
  - number: '83.1'
    text: |-
      In afwijking van de termijnen genoemd in de [artikelen 81][ref1] en [82][ref2], beslist het bestuurscollege binnen
      vier weken op een aanvraag voor een voorziening in de huisvesting die gelet op de voortgang van het onderwijs geen
      uitstel kan lijden.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel82
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '81'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '82'
        hoofdstuk: I
        afdeling: '3'
  - number: '83.2'
    text: 'Het bestuurcollege wijst de aanvraag af, indien:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel83
  - number: 83.2.a
    text: |-
      het besluit over de voorziening kan worden genomen met inachtneming van de termijn, bedoeld in
      [artikel 82, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel82
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '82'
        hoofdstuk: I
        afdeling: '3'
  - number: 83.2.b
    text: |-
      een van de weigeringsgronden, genoemd in
      [artikel 84, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel84
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '84'
        hoofdstuk: I
        afdeling: '3'
  - number: '84.1'
    text: 'Een voorziening in de huisvesting wordt slechts geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel84
  - number: 84.1.a
    text: |-
      de gewenste voorziening geen voorziening is in de zin van [artikel 79][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel79
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '79'
        hoofdstuk: I
        afdeling: '3'
  - number: 84.1.b
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de aard en de omvang van de voorzieningen waarover de
      school reeds beschikt, voor zover deze uit de openbare kas zijn bekostigd,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel84
  - number: 84.1.c
    text: |-
      de gewenste voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van het aantal
      leerlingen of onderwijskundige ontwikkelingen,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel84
  - number: 84.1.d
    text: |-
      op andere wijze dan wordt gewenst redelijkerwijs in de behoefte aan huisvesting kan worden voorzien, onder meer
      doordat binnen redelijke afstand van de gewenste plaats van de voorziening gebruik dan wel medegebruik mogelijk is,
      of een reeds voor bekostiging in aanmerking gebracht gebouw of deel daarvan beschikbaar komt,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel84
  - number: 84.1.e
    text: |-
      het bekostigingsplafond, bedoeld in [artikel 80][ref1], niet toereikend is voor de te verstrekken voorzieningen
      voor scholen als bedoeld in het eerste lid, onderdelen a en b, van dat artikel, of


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel80
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '80'
        hoofdstuk: I
        afdeling: '3'
  - number: 84.1.f
    text: de gewenste voorziening anders dan op grond van de onderdelen b tot en met d niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel84
  - number: '84.2'
    text: |-
      Een voorziening in de huisvesting kan tevens worden geweigerd, indien de voorziening als gevolg van het verwijtbaar
      nalaten van noodzakelijk onderhoud in een slechte bouwkundige staat verkeert of indien de voorziening nodig is voor
      herstel van schade die is veroorzaakt door schuld of toedoen van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel84
  - number: '85.1'
    text: |-
      Het bestuurscollege beslist met ingang van welk tijdstip de bekostiging van een voorziening daadwerkelijk een
      aanvang kan nemen, onverminderd het bepaalde in [artikel 86][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel86
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '86'
        hoofdstuk: I
        afdeling: '3'
  - number: '85.2'
    text: |-
      De aanspraak op bekostiging van een voorziening vervalt, indien niet binnen een bij de beschikking te
      bepalen termijn met betrekking tot de voorziening een bouwopdracht is gegeven dan wel een koop-, huur- of
      erfpachtovereenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel85
  - number: '86'
    text: |-
      Voorzieningen komen voor bekostiging in aanmerking, mits op het op grond van [artikel 85, eerste lid][ref1],
      vastgestelde tijdstip,


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel85
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '85'
        hoofdstuk: I
        afdeling: '3'
  - number: 86.a
    text: is voldaan aan de bij of krachtens de wet gestelde voorschriften, en
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel86
  - number: 86.b
    text: |-
      de feiten en omstandigheden waarin de school verkeert, ten opzichte van de feiten en omstandigheden ten tijde van
      de vaststelling van de beschikking tot verlening niet ingrijpend zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel86
  - number: '87.1'
    text: |-
      Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school geeft opdracht de voorziening
      in de huisvesting waartoe op grond van de [artikelen 82][ref1] en [83][ref2] kan worden overgegaan, tot stand te
      brengen met daartoe door het openbaar lichaam beschikbaar te stellen gelden, tenzij het met het bestuurscollege
      overeenkomt dat het openbaar lichaam deze voorziening tot stand brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel83
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '82'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '83'
        hoofdstuk: I
        afdeling: '3'
  - number: '87.2'
    text: |-
      Indien het openbaar lichaam de voorziening in de huisvesting van een niet door het openbaar lichaam in stand
      gehouden school tot stand heeft gebracht, worden gebouw en terrein aan het bevoegd gezag in eigendom overgedragen,
      tenzij het bestuurscollege en het bevoegd gezag anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel87
  - number: '87.3'
    text: |-
      Indien de voorziening in de huisvesting, bedoeld in het tweede lid, niet voldoet aan de eisen voor
      eigendomsoverdracht, geeft het bestuurscollege deze aan het bevoegd gezag in gebruik.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel87
  - number: '88'
    text: |-
      Indien het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school aanspraak heeft op
      bekostiging van een voorziening in de huisvesting, behoeven de bouwplannen en de desbetreffende begrotingen de
      instemming van het bestuurscollege, tenzij het bevoegd gezag met het bestuurscollege overeenkomt dat het openbaar
      lichaam deze voorziening tot stand brengt.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel88
  - number: '89'
    text: |-
      Het openbaar lichaam brengt een voorziening in de huisvesting van een niet door het openbaar lichaam in stand
      gehouden school slechts tot stand, indien tussen het bestuurscollege en het bevoegd gezag overeenstemming bestaat
      over de bouwplannen en de wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel89
  - number: '90.1'
    text: |-
      Het bevoegd gezag is verplicht het gebouw en terrein, alsmede de roerende zaken waarvoor bekostiging wordt genoten,
      behoorlijk te gebruiken en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel90
  - number: '90.2'
    text: |-
      Vervreemding door het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school anders dan op
      grond van [artikel 55][ref1] of [artikel 61][ref2] van gebouwen, terreinen en roerende zaken waarvoor bekostiging
      wordt genoten, of bezwaren met een zakelijk recht door het bevoegd gezag van een niet door het openbaar lichaam in
      stand gehouden school van zodanige gebouwen en terreinen, is zonder toestemming van het bestuurscollege nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel61
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '55'
        hoofdstuk: I
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '61'
        hoofdstuk: I
        afdeling: '3'
  - number: '90.3'
    text: |-
      Het tweede lid is niet van toepassing ten aanzien van het recht van opstal ten behoeve van een door het openbaar
      lichaam te plaatsen tijdelijke voorziening in de huisvesting op grond die eigendom is van het bevoegd gezag van de
      betrokken school.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel90
  - number: '91.1'
    text: |-
      Het bestuurscollege is bevoegd een gedeelte van een gebouw of terrein dat tijdelijk of gedurende een gedeelte van
      de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd te bestemmen als huisvesting voor
      een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde basisonderwijs, of voor educatie
      als bedoeld in de [Wet educatie en beroepsonderwijs BES][ref1] dan wel voor andere culturele, maatschappelijke
      of recreatieve doeleinden. Het voorgenomen gebruik dient zich te verdragen met het onderwijs aan de in het gebouw
      gevestigde school. Tevens is het bestuurscollege bevoegd ten behoeve van het onderwijs in lichamelijke oefening
      of expressie-activiteiten een gebouw of terrein dan wel een gedeelte daarvan dat tijdelijk gedurende gedeelten van
      de dag of in het geheel niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd te bestemmen als
      huisvesting voor een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde basisonderwijs,
      of voor educatie als bedoeld in de Wet educatie en beroepsonderwijs BES dan wel voor andere culturele,
      maatschappelijke of recreatieve doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: '91.2'
    text: |-
      Indien het gebouw of terrein in gebruik is voor een niet door het openbaar lichaam in stand gehouden school pleegt
      het bestuurscollege vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met het bevoegd gezag
      van die school waarvoor de huisvesting is bestemd.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel91
  - number: '92.1'
    text: |-
      Voor zover [artikel 91][ref1] geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw
      of terrein in gebruik geven ten behoeve van uit de openbare kas bekostigd onderwijs dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden. Voor zover niet nodig voor uit de openbare kas
      bekostigd onderwijs, kan het bevoegd gezag een gedeelte van het gebouw of terrein verhuren aan een derde,
      voor zover het gehuurde niet bestemd zal zijn als woon- of bedrijfsruimte in de zin van de [vijfde][ref2] en
      [zesde afdeling van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref3]. Indien het een niet door het openbaar
      lichaam in stand gehouden school betreft, is voor verhuur toestemming van het bestuurscollege vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Afdeling5
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Afdeling6
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '91'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005290
        afdeling: '6'
  - number: '92.2'
    text: 'De ingebruikgeving of verhuur ingevolge het eerste lid eindigt:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel92
  - number: 92.2.a
    text: |-
      indien het bestuurscollege gebruik maakt van zijn bevoegdheid op grond van [artikel 91][ref1] zonder dat enige
      schadeplicht ontstaat, of


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel91
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '91'
        hoofdstuk: I
        afdeling: '3'
  - number: 92.2.b
    text: indien het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel92
  - number: '92.3'
    text: |-
      Ingebruikgeving of verhuur ingevolge het eerste lid geschiedt niet indien het voorgenomen gebruik zich niet
      verdraagt met het onderwijs aan de in het gebouw gevestigde school.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel92
  - number: '92.4'
    text: |-
      Op de ingebruikgeving en verhuur ingevolge het eerste lid is
      [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: '92.5'
    text: |-
      Het zonder toestemming van het bestuurscollege verhuren van een gebouw of terrein door het bevoegd gezag van een
      niet door het openbaar lichaam in stand gehouden school alsmede elk met dit artikel strijdig beding opgenomen in
      een huurovereenkomst met betrekking tot schoolgebouwen, is nietig.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel92
  - number: '93'
    text: |-
      Voorzieningen aan gebouwen of terreinen in verband met verhuur krachtens de [artikelen 92][ref1] of [94][ref2]
      door het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school komen niet ten laste van het
      openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel94
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '92'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '94'
        hoofdstuk: I
        afdeling: '3'
  - number: '94.1'
    text: |-
      Het bestuurscollege en het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat
      eigenaar is van het gebouw en terrein, kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag blijvend
      heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht vatbaar
      gedeelte daarvan, voor de school te gebruiken.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel94
  - number: '94.2'
    text: |-
      De Rijksvertegenwoordiger kan in geval van een geschil omtrent de toepassing van het eerste lid desgevraagd
      besluiten dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of
      een voor eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. De aanvraag om het besluit
      wordt gedaan door het bestuurscollege of door het bevoegd gezag van de school. Alvorens op de aanvraag te
      besluiten, hoort de Rijksvertegenwoordiger de wederpartij.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel94
  - number: '94.3'
    text: |-
      Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat voornemens is gebouwen
      of terreinen, of een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, doet hiervan onverwijld
      mededeling aan het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel94
  - number: '94.4'
    text: |-
      Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, of het in het tweede lid bedoelde besluit
      van de Rijksvertegenwoordiger onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van de
      rechter, inhoudende een besluit als bedoeld in het tweede lid eerste volzin, in de plaats treedt van het vernietigde
      besluit, wordt de akte, het onherroepelijk geworden besluit onderscheidenlijk de uitspraak, ingeschreven in de
      openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek BES][ref1]. Door de
      inschrijving verkrijgt het openbaar lichaam de eigendom.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Afdeling2
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0028745
        afdeling: '2'
  - number: '94.5'
    text: |-
      Het vierde lid is niet van toepassing indien het gebouw of terrein volledig voor rekening van het bevoegd gezag
      van een niet door het openbaar lichaam in stand gehouden school is gebouwd of aangelegd, tenzij het bestuurscollege
      en het bevoegd gezag anders overeenkomen. Het bestuurscollege en het bevoegd gezag van een niet door het openbaar
      lichaam in stand gehouden school bepalen gezamenlijk de vergoeding van het openbaar lichaam aan het bevoegd gezag
      en, indien de gebouwen en terreinen niet meer voor het basisonderwijs worden gebruikt, de verplichtingen van
      het bevoegd gezag ten opzichte van het openbaar lichaam. Het tweede lid is van overeenkomstige toepassing. Bij
      ministeriële regeling kunnen regels worden gesteld over de toepassing van de eerste en tweede volzin.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel94
  - number: '94.6'
    text: |-
      Het bestuurscollege en het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat
      eigenaar is van het schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het gebouw dat
      niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel94
  - number: '94.7'
    text: |-
      De Rijksvertegenwoordiger kan in geval van een geschil omtrent de toepassing van het vijfde lid desgevraagd
      besluiten dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor
      het onderwijs nodig zal zijn. De aanvraag om het besluit wordt gedaan door het bestuurscollege of door het bevoegd
      gezag van de school. Alvorens op de aanvraag te besluiten, hoort de Rijksvertegenwoordiger de wederpartij.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel94
  - number: '94.8'
    text: |-
      Zodra de in het vijfde lid bedoelde akte door beide partijen is getekend, of het in het zesde lid bedoelde
      besluit van de Rijksvertegenwoordiger onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak
      van de rechter, inhoudende een beslissing als bedoeld in het zesde lid eerste volzin, in de plaats treedt van het
      vernietigde besluit, kan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school het
      desbetreffende gedeelte van het gebouw met toestemming van het bestuurscollege verhuren.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel94
  - number: '94.9'
    text: |-
      De toestemming, bedoeld in het zevende lid, wordt verleend voor een tijdvak van ten hoogste 3 jaren. Op verzoek van
      het bevoegd gezag kan dit tijdvak telkens worden verlengd met een termijn van ten hoogste 3 jaren.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel94
  - number: '94.10'
    text: |-
      Op de verhuur, bedoeld in het zevende lid, is [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 230a
  - number: '95'
    text: |-
      In afwijking van deze afdeling kan de eilandsraad besluiten dat jaarlijks een bedrag voor huisvestingskosten wordt
      betaald aan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school. De eilandsraad neemt
      het besluit in overeenstemming met het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel95
  - number: '96'
    text: |-
      Het bevoegd gezag van een niet door het desbetreffende openbaar lichaam in stand gehouden school is gehouden
      aan de eilandsraad onderscheidenlijk het bestuurscollege alle inlichtingen te verschaffen die de eilandsraad
      onderscheidenlijk bestuurscollege voor een adequate uitvoering van de bepalingen in deze afdeling noodzakelijk
      achten.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel96
  - number: '97.1'
    text: 'De bekostiging voor de materiële instandhouding van de scholen heeft betrekking op de volgende componenten:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel97
  - number: 97.1.a
    text: onderhoud,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel97
  - number: 97.1.b
    text: energie- en waterverbruik,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel97
  - number: 97.1.c
    text: middelen, waaronder mede wordt verstaan lesmateriaal,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel97
  - number: 97.1.d
    text: administratie, beheer en bestuur,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel97
  - number: 97.1.e
    text: schoonmaken, en
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel97
  - number: 97.1.f
    text: publiekrechtelijke heffingen, met uitzondering van belastingen ter zake van onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel97
  - number: '97.2'
    text: |-
      De bekostiging wordt zodanig vastgesteld dat zij voldoet aan de redelijke behoeften van een in normale
      omstandigheden verkerende school.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel97
  - number: '97.3'
    text: 'De bekostiging omvat:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel97
  - number: 97.3.a
    text: een vast bedrag per school,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel97
  - number: 97.3.c
    text: een bedrag dat afhankelijk is van het aantal leerlingen van de school.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel97
  - number: '97.4'
    text: |-
      Bij ministeriële regeling worden jaarlijks voor 1 oktober de in het derde lid onder a tot en met c bedoelde
      bedragen vastgesteld. Bij deze regeling kunnen tevens nadere voorschriften worden gegeven omtrent de wijze waarop
      de bekostiging wordt berekend, alsmede omtrent de wijze waarop de bekostiging wordt vastgesteld. De vastgestelde
      bedragen gelden voor het kalenderjaar dat aanvangt na het tijdstip van vaststelling.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel97
  - number: '97.5'
    text: |-
      Bij de vaststelling van de in het derde lid onder a tot en met c bedoelde bedragen, dan wel als tussentijdse
      aanpassing van die bedragen, worden volgens bij ministeriële regeling te geven regels loon- en prijsontwikkelingen
      verwerkt, tenzij de toestand van 's Rijks schatkist zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel97
  - number: '98.1'
    text: |-
      Indien bijzondere ontwikkelingen in het basisonderwijs daartoe aanleiding geven, kunnen bij ministeriële
      regeling voorschriften worden vastgesteld omtrent het verstrekken van aanvullende bekostiging voor de materiële
      instandhouding.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel98
  - number: '98.2'
    text: |-
      Indien bijzondere bekostiging op grond van [artikel 103][ref1] wordt toegekend, kan Onze Minister bepalen dat, voor
      de periode waarvoor die bijzondere bekostiging wordt toegekend, tevens aanvullende bekostiging voor de materiële
      instandhouding wordt toegekend. Bij ministeriële regeling kunnen nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel103
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '103'
        hoofdstuk: I
        afdeling: '5'
  - number: '98.3'
    text: |-
      Onze Minister kan in verband met de in het eerste lid en het tweede lid bedoelde bekostiging een
      bekostigingsplafond instellen. In dat geval worden bij ministeriële regeling regels omtrent de verdeling
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel98
  - number: '99.1'
    text: |-
      Het bestuurscollege stelt na overleg met de bevoegde gezagsorganen van de niet door het openbaar lichaam in stand
      gehouden scholen het aantal klokuren per week vast dat per groep leerlingen ten hoogste:
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel99
  - number: 99.1.a
    text: ter beschikking wordt gesteld in een ruimte voor het onderwijs in lichamelijke oefening, of
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel99
  - number: 99.1.b
    text: |-
      voor bekostiging voor de materiële instandhouding van een ruimte voor het onderwijs in lichamelijke oefening in
      aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel99
  - number: '99.2'
    text: Het aantal klokuren, bedoeld in het eerste lid, wordt vastgesteld op ten minste 1,5.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel99
  - number: '99.3'
    text: 'Het bestuurscollege stelt de hoogte vast van:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel99
  - number: 99.3.a
    text: de bekostiging, bedoeld in het eerste lid, onder b, en
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel99
  - number: 99.3.b
    text: |-
      de bekostiging voor de vaste kosten van de materiële instandhouding van een ruimte voor lichamelijke oefening
      waarvan de eigendom berust bij het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel99
  - number: '99.4'
    text: |-
      Bij de vaststelling, bedoeld in het derde lid, kan onderscheid worden gemaakt naar gelang de oppervlakte van de
      ruimte, alsmede tussen ruimten voor de exploitatie waarvan op grond van de onderwijswetgeving bekostiging wordt
      verleend en ruimten waarvoor dat niet het geval is.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel99
  - number: '100.1'
    text: |-
      Het bevoegd gezag, dan wel het openbaar lichaam dat eigenaar is van een schoolgebouw, zorgt voor het deel van
      de materiële instandhouding waarop de componenten bedoeld in [artikel 97, eerste lid, onder a, b en f][ref1],
      betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel97
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '97'
        hoofdstuk: I
        afdeling: '4'
  - number: '100.2'
    text: |-
      Het bevoegd gezag van een bijzondere school dat eigenaar is van een schoolgebouw, kan met het bestuurscollege
      overeenkomen dat het openbaar lichaam het in het eerste lid bedoelde deel van de materiële instandhouding geheel of
      gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel100
  - number: '100.3'
    text: |-
      Het bevoegd gezag, bedoeld in het eerste lid, kan met een bevoegd gezag dat gebruik maakt van de voorziening in
      de huisvesting van het eerstgenoemde bevoegd gezag, overeenkomen dat het laatstgenoemde bevoegd gezag het in het
      eerste lid bedoelde deel van de materiële instandhouding geheel of gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel100
  - number: '100.4'
    text: |-
      Ingeval het openbaar lichaam eigenaar is van het schoolgebouw, kan het bevoegd gezag van een bijzondere school
      met het openbaar lichaam overeenkomen dat het bevoegd gezag het in het eerste lid bedoelde deel van de materiële
      instandhouding geheel of gedeeltelijk verzorgt.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel100
  - number: '100.5'
    text: |-
      Het bevoegd gezag zorgt voor het deel van de materiële instandhouding waarop de componenten, bedoeld in
      [artikel 97, eerste lid, onder c, d en e][ref1], betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel97
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '97'
        hoofdstuk: I
        afdeling: '4'
  - number: '102.1'
    text: |-
      Voor de toepassing van [artikel 101, eerste lid][ref1], geldt het aantal leerlingen van de school op 1 oktober van
      het voorafgaande schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel101
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '101'
        hoofdstuk: I
        afdeling: '5'
  - number: '102.2'
    text: |-
      Voor de toepassing van [artikel 101, eerste lid][ref1], voor het schooljaar waarin een nieuwe school wordt
      geopend en voor het daaropvolgende schooljaar geldt het aantal leerlingen van de school op 1 oktober volgende op
      de opening.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel101
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '101'
        hoofdstuk: I
        afdeling: '5'
  - number: '102.3'
    text: |-
      Voor de toepassing van [artikel 101, eerste lid][ref1], geldt ingeval van samenvoeging van scholen het aantal
      leerlingen van alle bij de samenvoeging betrokken scholen, voor elke school vastgesteld volgens het eerste lid, en
      de gewogen gemiddelde leeftijd van de leraren van alle bij de samenvoeging betrokken scholen op 1 oktober van het
      voorafgaande schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel101
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '101'
        hoofdstuk: I
        afdeling: '5'
  - number: '103.1'
    text: |-
      Indien bijzondere ontwikkelingen in het basisonderwijs daartoe aanleiding geven, kunnen bij ministeriële regeling
      voorschriften worden vastgesteld omtrent het verstrekken van bijzondere bekostiging voor personeelskosten.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel103
  - number: '103.2'
    text: |-
      In verband met bijzondere omstandigheden kan Onze Minister op verzoek van het bevoegd gezag van een school onder
      door hem op te leggen verplichtingen bijzondere bekostiging voor personeelskosten verstrekken.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel103
  - number: '103.3'
    text: |-
      Een aanvraag als bedoeld in het tweede lid wordt ingediend ten hoogste vier maanden voorafgaand aan het schooljaar
      waarin de bijzondere omstandigheden zich zullen voordoen en niet later dan in het schooljaar waarin die bijzondere
      omstandigheden zich hebben voorgedaan. Onze Minister besluit binnen vier maanden na ontvangst van een in het tweede
      lid bedoelde aanvraag. Indien de beschikking niet binnen vier maanden kan worden gegeven, stelt Onze Minister de
      aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel103
  - number: '103.4'
    text: |-
      Onze Minister kan in verband met de in het eerste en tweede lid bedoelde bekostiging een bekostigingsplafond
      instellen. In dat geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel103
  - number: '104.1'
    text: |-
      Aan de school wordt in verband met de kosten voor personeel wegens voorschriften die zijn gegeven bij of krachtens
      de [Wet materieel ambtenarenrecht][ref1] bekostiging verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0028215
  - number: '104.2'
    text: |-
      De in het eerste lid bedoelde bekostiging is verwerkt in de bedragen en in de vermenigvuldigingsbedragen van de
      verhoging, bedoeld in de [artikelen 101][ref1] en [103][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel103
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '101'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '103'
        hoofdstuk: I
        afdeling: '5'
  - number: '105.2'
    text: |-
      Met inachtneming van het eerste lid verstrekt het Rijk jaarlijks aan het bevoegd gezag van de openbare en
      bijzondere scholen bekostiging ten behoeve van personeels- en arbeidsmarktbeleid.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel105
  - number: '106'
    text: |-
      Het openbaar lichaam bekostigt aan het bevoegd gezag van een niet door het
      openbaar lichaam in stand gehouden school dat is onderworpen aan een of meer der in
      [artikel 43 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] bedoelde belastingen ter
      zake van onroerende zaken het bedrag dat is uitgegeven voor de belastingen met betrekking tot de in het openbaar
      lichaam gelegen gebouwen en terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel43
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '43'
  - number: '107.1'
    text: |-
      Het Rijk verstrekt jaarlijks aan het bevoegd gezag bekostiging ten behoeve van de materiële instandhouding waarop
      de componenten, bedoeld in [artikel 97, eerste lid][ref1], betrekking hebben, waarbij voor het bevoegd gezag geldt
      dat indien toepassing is gegeven aan [artikel 100, tweede lid][ref2], dan wel indien geen overeenkomst als bedoeld
      in artikel 100, derde of vierde lid tot stand is gekomen, dit bevoegd gezag de bekostiging aan het openbaar lichaam
      dan wel aan het desbetreffende bevoegd gezag overdraagt voor zover deze de materiële instandhouding verzorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel100
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '97'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '100'
        hoofdstuk: I
        afdeling: '4'
  - number: '107.2'
    text: |-
      Grondslag voor de bekostiging van de in het eerste lid bedoelde kosten zijn de voor het desbetreffende jaar
      vastgestelde bedragen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel107
  - number: '107.3'
    text: |-
      Ingeval een samenvoeging plaatsvindt tussen 1 januari en 1 oktober daaropvolgend, wordt de bekostiging ten behoeve
      van de uitgaven voor de voorzieningen, bedoeld in [artikel 97][ref1], van alle bij de samenvoeging betrokken
      scholen gehandhaafd tot het einde van het jaar waarin de samenvoeging plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel97
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '97'
        hoofdstuk: I
        afdeling: '4'
  - number: '107.4'
    text: |-
      Ingeval een samenvoeging plaatsvindt tussen 1 oktober en 1 januari daaropvolgend, wordt de bekostiging ten behoeve
      van de uitgaven voor de voorzieningen, bedoeld in [artikel 97][ref1], van alle bij de samenvoeging betrokken
      scholen gehandhaafd tot het einde van het jaar waarin de samenvoeging plaatsvond, en wordt de bekostiging van
      de uitgaven voor die voorzieningen voor het jaar volgend op de samenvoeging, gebaseerd op de bekostiging van de
      uitgaven voor die voorzieningen van alle bij de samenvoeging betrokken scholen, zoals die golden op 1 oktober van
      het jaar van samenvoeging.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel97
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '97'
        hoofdstuk: I
        afdeling: '4'
  - number: '108.1'
    text: |-
      Jaarlijks voor 1 maart kan aan Onze Minister verhoging van de bekostiging worden gevraagd, indien op grond van
      bijzondere omstandigheden van de school in dat jaar het totale bedrag niet voldoende is voor de noodzakelijke
      uitgaven van de school.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel108
  - number: '108.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid, kan slechts worden gedaan door het bevoegd gezag voor zover het betreft
      de materiële instandhouding waarop de componenten, bedoeld in [artikel 97, eerste lid][ref1], betrekking hebben.
      In afwijking van de vorige volzin kan ingeval [artikel 100, tweede, derde of vierde lid][ref2], is toegepast, het
      bevoegd gezag dat dan wel het openbaar lichaam dat de materiële instandhouding geheel of gedeeltelijk verzorgt, het
      verzoek indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel100
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '97'
        hoofdstuk: I
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '100'
        hoofdstuk: I
        afdeling: '4'
  - number: '108.3'
    text: 'Onze Minister wijst het verzoek in elk geval af indien:'
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel108
  - number: 108.3.a
    text: |-
      in het jaar waarvoor de componenten zijn vastgesteld, het totaal van de noodzakelijke uitgaven voor de materiële
      instandhouding van de school, niet ten minste 5% meer zal bedragen dan het totaal van de uit 's Rijks kas daarvoor
      te verstrekken inkomsten,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel108
  - number: 108.3.b
    text: |-
      de bijzondere omstandigheden het gevolg zijn van een bij algemene maatregel van bestuur aan te geven omstandigheid
      of afwijking van de omvang van de componenten van de voorziening ten aanzien waarvan de bijzondere omstandigheden
      zouden bestaan,
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel108
  - number: 108.3.c
    text: |-
      de bijzondere omstandigheid het gevolg is van een verschil tussen het prijsniveau in enig jaar en de op grond van
      [artikel 97][ref1] vastgestelde of aangepaste bedragen, of


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel97
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '97'
        hoofdstuk: I
        afdeling: '4'
  - number: 108.3.d
    text: |-
      het bevoegd gezag of het openbaar lichaam dat het verzoek heeft ingediend, niet aantoont dat het de bijzondere
      omstandigheden niet op enigerlei wijze had kunnen voorkomen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel108
  - number: '108.4'
    text: |-
      Een verzoek als bedoeld in het eerste lid gaat vergezeld van een verklaring van de deskundige, bedoeld in
      [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref1], van de juistheid van de gegevens die bij
      het verzoek zijn gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
  - number: '108.5'
    text: |-
      Onze Minister besluit binnen drie maanden. Indien technisch onderzoek zulks noodzakelijk maakt, kan Onze Minister
      deze termijn eenmaal met ten hoogste zes maanden verdagen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel108
  - number: '108.6'
    text: |-
      Onze Minister kan in verband met de in het eerste lid bedoelde verhoging een bekostigingsplafond instellen. In dat
      geval worden bij ministeriële regeling regels omtrent de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel108
  - number: '109.1'
    text: |-
      Het openbaar lichaam verstrekt jaarlijks aan het bevoegd gezag van een niet door het openbaar lichaam in stand
      gehouden school dat eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening:
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel109
  - number: 109.1.a
    text: |-
      een bekostigingsbedrag dat wordt bepaald ingevolge [artikel 99][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel99
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '99'
        hoofdstuk: I
        afdeling: '4'
  - number: 109.1.b
    text: |-
      voor zover het gebruik van die ruimte ontoereikend is een overeenkomstig het tweede lid vast te stellen
      bekostigingsbedrag.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel109
  - number: '109.2'
    text: |-
      Voor zover geen ruimte ter beschikking is gesteld als bedoeld in [artikel 99, eerste lid onder a][ref1], verstrekt
      het openbaar lichaam jaarlijks aan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden
      school dat geen eigenaar is van een ruimte voor het onderwijs in lichamelijke oefening een bekostigingsbedrag dat
      wordt bepaald ingevolge artikel 99, eerste lid onder b, en derde lid onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel99
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '99'
        hoofdstuk: I
        afdeling: '4'
  - number: '110.1'
    text: |-
      Met inachtneming van de [artikelen 101][ref1], en [102][ref2], verstrekt het Rijk jaarlijks aan het bevoegd gezag
      een bekostigingsbedrag ten behoeve van de personeelskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel102
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '101'
        hoofdstuk: I
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '102'
        hoofdstuk: I
        afdeling: '5'
  - number: '110.2'
    text: |-
      In geval van het verstrekken van een bijzondere bekostiging als bedoeld in [artikel 103][ref1] verstrekt het Rijk
      aan het desbetreffende bevoegd gezag het bedrag van deze bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel103
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '103'
        hoofdstuk: I
        afdeling: '5'
  - number: '110.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot het betalen van het
      in het eerste en tweede lid bedoelde bedrag.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel110
  - number: '110.4'
    text: |-
      Op het in het eerste en tweede lid bedoelde bedrag kunnen op een bij ministeriële regeling vast te stellen wijze
      in mindering worden gebracht de inkomsten die het bevoegd gezag direct of indirect geniet vanwege uitkeringen of
      toelagen waarop door het personeel aanspraak kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel110
  - number: '111.1'
    text: |-
      Op de bekostiging, bedoeld in [artikel 110][ref1] kan volgens bij of krachtens algemene maatregel van bestuur te
      stellen regels een bedrag in mindering worden gebracht in verband met de kosten waarop aanspraak wordt gemaakt door
      personeel dat is benoemd met voorbijgaan van:


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel110
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '110'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '7'
  - number: 111.1.a
    text: personeel dat een gelijksoortige functie uitoefent aan een school van het bevoegd gezag, of
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel111
  - number: 111.1.b
    text: personeel dat een gelijksoortige functie heeft uitgeoefend aan een school van het bevoegd gezag, en
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel111
  - number: 111.1.b.1°
    text: in het genot is van wachtgeld, of
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel111
  - number: 111.1.b.2°
    text: |-
      van een andere ontslaguitkering en direct aan die ontslaguitkering voorafgaand langer dan een jaar onafgebroken in
      dienst is geweest van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel111
  - number: '111.2'
    text: |-
      Voor de toepassing van het eerste lid wordt, indien het betreft openbaar onderwijs, onder «school van het bevoegd
      gezag» verstaan elke binnen het desbetreffende openbaar lichaam gelegen school.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel111
  - number: '112.1'
    text: |-
      Indien in een openbaar lichaam uitsluitend een of meer andere rechtspersonen dan het openbaar lichaam openbare
      scholen in stand houdt of houden of openbare scholen ontbreken en het openbaar lichaam uitgaven wil doen voor het
      onderwijs aan die scholen welke niet door het Rijk worden bekostigd, stelt de eilandsraad bij eilandsverordening
      een regeling daarvoor vast en zijn de [artikelen 114 tot en met 118][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel114
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '114'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '7'
  - number: '112.2'
    text: |-
      De regeling, bedoeld in het eerste lid, maakt geen onderscheid tussen openbaar en bijzonder onderwijs en voorziet
      in een behandeling van scholen naar dezelfde maatstaf.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel112
  - number: '112.3'
    text: |-
      De regeling, bedoeld in het eerste lid, bevat in elk geval de voorzieningen die door het bevoegd gezag van een
      niet door het openbaar lichaam in stand gehouden school kunnen worden aangevraagd en de procedure voor het doen van
      een aanvraag.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel112
  - number: '112.4'
    text: |-
      De eilandsraad kan besluiten dat het bestuurscollege de regeling, bedoeld in het eerste lid, tijdelijk kan
      aanvullen met nieuwe voorzieningen. De aanvulling wordt binnen 1 week aan de bevoegde gezagsorganen van de
      niet door het openbaar lichaam in stand gehouden scholen gezonden. Binnen 12 weken na de totstandkoming van de
      aanvulling wordt deze voorgelegd aan de eilandsraad en besluit de eilandsraad over de bekrachtiging ervan. Indien
      de eilandsraad niet binnen 12 weken heeft besloten, wordt de aanvulling gelijk gesteld met een aanvulling die is
      bekrachtigd. Een afwijzing van de aanvulling door de eilandsraad heeft geen gevolgen voor aanvragen waarop reeds is
      besloten of die reeds zijn ingediend en die voorzieningen betreffen waarop de aanvulling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel112
  - number: '112.5'
    text: |-
      [Artikel 7, eerste lid, van de Wet administratieve rechtspraak BES][ref1] is van overeenkomstige toepassing op de
      regeling, bedoeld in het eerste lid, een wijziging daarvan, of de aanvulling, bedoeld in het vierde lid, die door
      de eilandsraad is bekrachtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel7
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '7'
  - number: '112.6'
    text: |-
      Het bestuurscollege maakt jaarlijks in een van overheidswege uitgegeven blad of een dag-, nieuws- of huis-aan-
      huisblad, dan wel op een andere geschikte wijze, een overzicht bekend van de op grond van de regeling, bedoeld in
      het eerste lid, toegekende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel112
  - number: '113.1'
    text: |-
      Indien een openbaar lichaam zelf een of meer openbare scholen in stand houdt en hij uitgaven wil doen voor
      het onderwijs aan die scholen welke niet door het Rijk worden bekostigd, kan de eilandsraad daarvoor bij
      eilandsverordening een regeling vaststellen.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel113
  - number: '113.2'
    text: |-
      [Artikel 112, tweede tot en met zesde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel112
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '112'
        hoofdstuk: I
        paragraaf: '4'
        afdeling: '7'
  - number: '114.1'
    text: |-
      Indien een openbaar lichaam ten behoeve van een of meer door hem in stand gehouden scholen meer uitgaven doet voor
      het personeel en de materiële instandhouding dan door het Rijk worden bekostigd, wordt met inachtneming van de
      [artikelen 114 tot en met 118][ref1] aan het bevoegd gezag van de niet door het openbaar lichaam in stand gehouden
      scholen om de vijf jaar een overschrijdingsbedrag verstrekt. Indien een openbaar lichaam vanaf een tijdstip binnen
      een periode van vijf jaar als bedoeld in de eerste volzin geen school in stand houdt, wordt, in afwijking van die
      volzin, het overschrijdingsbedrag toegekend uiterlijk 31 december van het kalenderjaar dat volgt op dat tijdstip
      waarop het openbaar lichaam niet langer een school in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel114
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '114'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '7'
  - number: '114.2'
    text: |-
      Het bestuurscollege kan in overeenstemming met het bevoegd gezag van een niet door het openbaar lichaam in stand
      gehouden school besluiten dat met betrekking tot een of meer scholen van dat bevoegd gezag uitgaven die het
      openbaar lichaam doet ten behoeve van een door hem in stand gehouden school buiten beschouwing worden gelaten bij
      het vaststellen van de bedragen, bedoeld in de [artikelen 115][ref1] en [116][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel116
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '115'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '116'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '7'
  - number: '115.1'
    text: |-
      Het bestuurscollege stelt jaarlijks vast in welke mate het ten behoeve van de door het openbaar lichaam in stand
      gehouden scholen meer dan wel minder uitgaven zal doen voor het personeel en de materiële instandhouding dan door
      het Rijk worden bekostigd. Deze vaststelling geschiedt voor het komende begrotingsjaar en het resterende deel van
      het vijfjarig tijdvak, bedoeld in [artikel 114, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel114
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '114'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '7'
  - number: '115.2'
    text: |-
      Indien voor het komende begrotingsjaar meer uitgaven zullen worden gedaan voor het personeel en de materiële
      instandhouding dan door het Rijk worden bekostigd, verleent het bestuurscollege in dat begrotingsjaar aan het
      bevoegd gezag van de niet door het openbaar lichaam in stand gehouden scholen een voorschot op het te verwachten
      overschrijdingsbedrag, bedoeld in [artikel 114, eerste lid][ref1]. Indien uit het besluit van het bestuurscollege,
      bedoeld in het eerste lid, blijkt dat de hiervoor bedoelde meer-uitgaven in de resterende jaren van het vijfjarig
      tijdvak geheel of ten dele worden gecompenseerd door minder uitgaven, wordt hiermee rekening gehouden bij de
      bepaling van de hoogte van het voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel114
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '114'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '7'
  - number: '115.3'
    text: |-
      Indien uit de jaarlijkse voorlopige vaststelling van de bedragen, bedoeld in [artikel 116, eerste lid][ref1],
      blijkt dat, in afwijking van hetgeen is vastgesteld bij het besluit van het bestuurscollege, bedoeld in het eerste
      lid, meer uitgaven zijn gedaan voor personeel en materiële instandhouding dan door het Rijk worden bekostigd,
      verleent het bestuurscollege alsnog een voorschot aan het bevoegd gezag van de niet door het openbaar lichaam in
      stand gehouden scholen. Bij de bepaling van de hoogte van het voorschot is de tweede volzin van het tweede lid van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel116
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '116'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '7'
  - number: '117.1'
    text: |-
      In het jaar volgend op de definitieve vaststelling, bedoeld in [artikel 116, achtste lid][ref1], wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden
      school, die gedurende een of meer jaren van het desbetreffende tijdvak in het openbaar lichaam was gevestigd,
      aanspraak heeft. Dit overschrijdingsbedrag wordt vastgesteld door het percentage, bedoeld in artikel 116, achtste
      lid, te vermenigvuldigen met het totaal van de ontvangsten van een niet door het openbaar lichaam in stand gehouden
      school dat is gebaseerd op de bedragen die krachtens de [artikelen 97][ref2] en [110][ref3] voor het desbetreffende
      tijdvak zijn vastgesteld, met dien verstande dat bij het vaststellen van het totaal van de ontvangsten, bedoeld
      in voorgaande volzin, buiten beschouwing blijven de ontvangsten op grond van de component administratie, beheer en
      bestuur, bedoeld in [artikel 97, eerste lid, onder d][ref4], voor de materiële instandhouding van het onderwijs in
      lichamelijke oefening.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel110
      [ref4]: https://wetten.overheid.nl/BWBR0030280#Artikel97
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '116'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '97'
        hoofdstuk: I
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0030280
        artikel: '110'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '7'
      - id: ref4
        bwb_id: BWBR0030280
        artikel: '97'
        hoofdstuk: I
        afdeling: '4'
  - number: '117.2'
    text: |-
      Indien aan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school een deel van de
      bekostiging voor personeelskosten is overgedragen door een ander bevoegd gezag, wordt bij het vaststellen van het
      totaal van de ontvangsten, bedoeld in het eerste lid, tweede volzin, dat deel bij genoemde school wel en bij de
      school van laatstgenoemd bevoegd gezag niet aangemerkt als ontvangsten.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel117
  - number: '117.3'
    text: |-
      Indien een openbaar lichaam voor een niet door het openbaar lichaam in stand gehouden school het deel van de
      materiële instandhouding waarop de componenten, bedoeld in [artikel 97, eerste lid, onder a, b en f][ref1],
      betrekking hebben, geheel of gedeeltelijk verzorgt, wordt een overeenkomstig deel van de ontvangsten in mindering
      gebracht op het totaal van de ontvangsten voor de betrokken school waarover ingevolge het eerste lid het
      overschrijdingsbedrag wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel97
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '97'
        hoofdstuk: I
        afdeling: '4'
  - number: '117.4'
    text: |-
      Indien een openbaar lichaam gedurende een gedeelte van het desbetreffende tijdvak een of meer scholen in stand
      houdt, wordt voor het vaststellen van het overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het
      totaal van de ontvangsten van een niet door het openbaar lichaam in stand gehouden school over een overeenkomstig
      gedeelte van het desbetreffende tijdvak.
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel117
  - number: '118.1'
    text: |-
      Aan het bevoegd gezag van de niet door het openbaar lichaam in stand gehouden scholen wordt een afschrift gezonden
      van de besluiten van het bestuurscollege tot vaststelling van de mate waarin meer dan wel minder uitgaven worden
      gedaan, bedoeld in [artikel 115, eerste lid][ref1], tot verlening van het voorschot, bedoeld in artikel 115,
      tweede of derde lid, en tot voorlopige en definitieve vaststelling van het overschrijdingsbedrag, bedoeld in
      [artikel 116, zevende en achtste lid][ref2]. Daarbij is opgenomen een staat van voorzieningen als bedoeld in
      artikel 116, eerste lid onder h, waarin per kalenderjaar wordt aangegeven het verloop van de toevoegingen en de
      onttrekkingen aan de voorzieningen. De toezending geschiedt binnen 2 weken na de dag waarop het bestuurscollege een
      besluit als bedoeld in de eerste volzin heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel116
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '115'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '116'
        hoofdstuk: I
        paragraaf: '5'
        afdeling: '7'
  - number: '118.2'
    text: |-
      In afwijking van [artikel 55 van de Wet administratieve rechtspraak BES][ref1] kan het bevoegd gezag van een
      niet door het openbaar lichaam in stand gehouden school tegen de in het eerste lid bedoelde beschikkingen beroep
      instellen bij de Rijksvertegenwoordiger. De [artikelen 54][ref2] en 55 van de Wet administratieve rechtspraak BES
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028455#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel54
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0028455
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '54'
  - number: '119.1'
    text: |-
      Het bevoegd gezag wendt met inachtneming van het eilandelijk zorgplan het totaal van de in de
      [artikelen 105][ref1], [107][ref2] en [110][ref3] bedoelde bedragen voor de kosten voor de materiële instandhouding
      en de personeelskosten uitsluitend aan voor kosten voor materiële instandhouding, personeelskosten van de
      school of personeelskosten in verband met benoeming of tewerkstelling zonder benoeming van personeel, bedoeld in
      [artikel 31, vijfde lid][ref4], dan wel mede voor die kosten van een van de andere scholen van dat bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel107
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel110
      [ref4]: https://wetten.overheid.nl/BWBR0030280#Artikel31
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '105'
        hoofdstuk: I
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '107'
        hoofdstuk: I
        paragraaf: '2'
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0030280
        artikel: '110'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '7'
      - id: ref4
        bwb_id: BWBR0030280
        artikel: '31'
        hoofdstuk: I
        paragraaf: '3'
        afdeling: '1'
  - number: '119.2'
    text: |-
      Het bevoegd gezag kan de in de [artikelen 105][ref1], [107][ref2] en [110][ref3] bedoelde bedragen voor de
      kosten voor de materiële instandhouding en voor de personeelskosten mede aanwenden voor de vergoeding, bedoeld in
      [artikel 28, vierde lid][ref4], en voor de in het eerste lid bedoelde kosten van:


      [ref1]: https://wetten.overheid.nl/BWBR0030280#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel107
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel110
      [ref4]: https://wetten.overheid.nl/BWBR0030280#Artikel28
    url: https://wetten.overheid.nl/BWBR0030280/2011-02-17#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0030280
        artikel: '105'
        hoofdstuk: I
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '107'
        hoofdstuk: I
