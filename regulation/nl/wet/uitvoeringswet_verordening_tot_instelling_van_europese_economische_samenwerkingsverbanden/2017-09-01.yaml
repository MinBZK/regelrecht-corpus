  - number: '4'
    text: |-
      Een rechtspersoon kan bestuurder zijn van een Europees economisch samenwerkingsverband. Deze rechtspersoon wijst
      een of meer vertegenwoordigers aan in de zin van artikel 19, tweede lid, van de verordening. Zij zijn aansprakelijk
      als waren zij zelf bestuurders van het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0004579/2017-09-01#Artikel4
  - number: '6'
    text: |-
      Als bevoegde autoriteit in de zin van artikel 32, eerste lid, van de Verordening wordt aangewezen: het openbaar
      ministerie.
    url: https://wetten.overheid.nl/BWBR0004579/2017-09-01#Artikel6
  - number: '7'
    text: |-
      Het is aan een persoon die geen Europees economisch samenwerkingsverband is, verboden zaken te doen met gebruik
      van die aanduiding of de afkorting EESV. In geval van overtreding van dit verbod kan ieder Europees economisch
      samenwerkingsverband vorderen dat de overtreder zich daarvan onthoudt, op straffe van een door de rechter te
      bepalen dwangsom.
    url: https://wetten.overheid.nl/BWBR0004579/2017-09-01#Artikel7
  - number: '8'
    text: |-
      1 Een coöperatie kan, mits voldaan wordt aan de bepalingen van de Verordening, worden omgezet in een Europees
      economisch samenwerkingsverband, zonder dat daardoor het bestaan van de rechtspersoon wordt beëindigd.

      2 Een Europees economisch samenwerkingsverband kan worden omgezet in een coöperatie met wettelijke
      aansprakelijkheid, zonder dat daardoor het bestaan van de rechtspersoon wordt beëindigd. Het besluit daartoe moet
      eenstemmig worden genomen, tenzij de overeenkomst tot oprichting of de statuten anders bepalen of een zodanige
      omzetting niet toelaten. De omzetting geschiedt bij een voor een Nederlandse notaris te verlijden akte.
    url: https://wetten.overheid.nl/BWBR0004579/2017-09-01#Artikel8
  - number: '11'
    text: |-
      Deze wet treedt in werking met ingang van 1 juli 1989. Indien het *Staatsblad* waarin deze wet wordt geplaatst,
      wordt uitgegeven na 30 juni 1989, treedt zij in werking met ingang van de dag na de datum van uitgifte van het
      *Staatsblad* waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004579/2017-09-01#Artikel11
