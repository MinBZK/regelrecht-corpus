        artikel: '8'
  - number: '2'
    text: |-
      Ter uitvoering van artikel 39 van de Verordening wordt als register voor de inschrijving van een
      Europees economisch samenwerkingsverband met zetel in Nederland of van een Nederlandse vestiging
      van een ander Europees economisch samenwerkingsverband aangewezen: het handelsregister bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0004579/2017-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: '3'
    text: |-
      1 Een Europees economisch samenwerkingsverband met zetel in Nederland bezit rechtspersoonlijkheid met ingang van
      de dag van zijn inschrijving in het handelsregister. De vereffening van het samenwerkingsverband eindigt op het
      tijdstip waarop geen aan de vereffenaars bekende baten meer aanwezig zijn en het samenwerkingsverband behoudt tot
      dat tijdstip zijn rechtspersoonlijkheid.

      2 [ Titel 1 van Boek 2 van het Burgerlijk Wetboek][ref1] is op de in het eerste lid bedoelde rechtspersoon
      van toepassing met uitzondering van de [artikelen 11][ref2], [18][ref3], [19 vierde lid, eerste zin][ref4], en
      [21 eerste lid onder ][ref5] De [artikelen 138][ref6] en [149 van dat boek][ref7] zijn op die rechtspersoon van
      overeenkomstige toepassing.

      3 De bepalingen van [Titel 8, Afdeling 2, van boek 2 van het Burgerlijk Wetboek][ref8] zijn van toepassing, dan
      wel van overeenkomstige toepassing op een Europees economisch samenwerkingsverband met zetel in Nederland. Tot
      het indienen van een verzoek als bedoeld in [artikel 345][ref9] betreffende een zodanig samenwerkingsverband zijn
      bevoegd de leden van het samenwerkingsverband, een vereniging van werknemers als bedoeld in [artikel 347][ref10],
      alsmede degenen aan wie daartoe bij de oprichtingsovereenkomst of bij overeenkomst met het samenwerkingsverband de
      bevoegdheid is toegekend. De verplichting van [artikel 351, eerste lid, derde zin][ref11], geldt ook voor de leden
      van het samenwerkingsverband.

      4 De in [artikel 10, tweede lid, van boek 2 van het Burgerlijk Wetboek][ref12] bedoelde bescheiden van een
      Europees economisch samenwerkingsverband moeten zijn voorzien van een toelichting en vormen daarmee te zamen de
      jaarrekening. Deze moet zodanig zijn ingericht, dat zij volgens de normen die in het maatschappelijk verkeer als
      aanvaardbaar worden beschouwd een zodanig inzicht geeft, dat een verantwoord oordeel kan worden gevormd omtrent
      het vermogen en het resultaat, alsmede voorzover mogelijk, omtrent de solvabiliteit en de liquiditeit van het
      samenwerkingsverband. De jaarrekening dient voorts een getrouw, duidelijk en stelselmatig beeld te verschaffen
      van de financiële toestand van het samenwerkingsverband. Het samenwerkingsverband laat de jaarrekening onderzoeken
      door een deskundige als bedoeld in [artikel 393 van boek 2 van het Burgerlijk Wetboek][ref13]. De opdracht tot het
      onderzoek wordt verleend door en het verslag omtrent het onderzoek wordt uitgebracht aan de gezamenlijk handelende
      leden van het samenwerkingsverband.


