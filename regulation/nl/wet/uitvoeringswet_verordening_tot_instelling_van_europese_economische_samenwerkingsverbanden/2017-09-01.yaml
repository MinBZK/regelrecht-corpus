preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is wettelijke bepalingen vast te stellen ter uitvoering
    van de Verordening Nr. 2137/85 van de Raad van de Europese Gemeenschappen van 25 juli 1985 tot instelling van
    Europese economische samenwerkingsverbanden (PbEG L 199/1);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004579/2017-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van de [artikelen 1][ref1] tot en met [8][ref2] van deze wet wordt onder "Verordening" verstaan
      de [Verordening nr. 2137/85](31985R2137) van de Raad van de Europese Gemeenschappen van 25 juli 1985 tot instelling
      van de Europese economische samenwerkingsverbanden (*PbEG* L 199/1).


      [ref1]: https://wetten.overheid.nl/BWBR0004579#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004579#Artikel8
    url: https://wetten.overheid.nl/BWBR0004579/2017-09-01#Artikel1
