  - number: '11'
    text: |-
      Met het toezicht op de naleving van deze regeling is belast de Inspectie Werk en Inkomen, genoemd in
      [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0020126/2006-07-26#Artikel11
