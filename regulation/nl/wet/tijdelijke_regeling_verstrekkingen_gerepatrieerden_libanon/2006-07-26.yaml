preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, en9 van de Kaderwet SZW-subsidies en de artikelen 34, eerste lid, onderdeel e,
    en 77 van de Wet structuur uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020126/2006-07-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. buitengewone kosten: noodzakelijke, onvermijdbare kosten die in Nederland worden gemaakt en die vanwege hun aard
      of hoogte in redelijkheid niet geacht kunnen worden door de gerepatrieerde zelf te worden betaald;

      b. gerepatrieerde: de Nederlander, zijn partner of huwelijkspartner; zijn ouder of stiefouder, dan wel zijn kind,
      stief- of pleegkind, of kleinkind jonger dan 21 jaar, die in verband met de crisis in Libanon op of na 18 juli 2006
      vanuit Libanon tijdelijk naar Nederland is gekomen en na aankomst in Nederland, in aansluiting op de briefing, door
      het bevoegde gezag als evacué is geregistreerd;

      c. Minister: de Minister van Sociale Zaken en Werkgelegenheid;

      d. SVB: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0020126/2006-07-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: '2'
    text: |-
      1 De SVB stelt op aanvraag het recht op de verstrekkingen, bedoeld in
      [artikel 3, aanhef en onderdelen a tot en met c][ref1], vast. Het recht op de verstrekkingen, bedoeld in
      [artikel 3, aanhef en onderdelen d en e][ref2], wordt door de SVB ambtshalve vastgesteld op basis van de gegevens
      die de gerepatrieerde in het kader van de registratie als evacué heeft verstrekt.

      2 Een aanvraag wordt bij de SVB ingediend door middel van een door de SVB beschikbaar gesteld aanvraagformulier.


      [ref1]: https://wetten.overheid.nl/BWBR0020126#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020126#Artikel3
    url: https://wetten.overheid.nl/BWBR0020126/2006-07-26#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020126
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020126
        artikel: '3'
  - number: '3'
    text: |-
      De gerepatrieerde heeft gedurende zijn tijdelijk verblijf in Nederland recht op de volgende verstrekkingen:

      a. een eenmalige tegemoetkoming voor de aanloopkosten;

      b. een wekelijkse financiële toelage voor de aanschaf van voedsel, kleding en andere persoonlijke uitgaven;

      c. betaling van buitengewone kosten;

      d. de dekking van de kosten van medische verstrekkingen overeenkomstig een daartoe te treffen ziektekostenregeling
      voorzover deze kosten niet uit hoofde van een andere ziektekostenregeling worden vergoed; of

      e. een verzekering tegen de financiële gevolgen van wettelijke aansprakelijkheid voorzover deze kosten niet uit
      hoofde van een andere verzekering worden vergoed.
    url: https://wetten.overheid.nl/BWBR0020126/2006-07-26#Artikel3
  - number: '4'
    text: |-
      1 De in [artikel 3][ref1] bedoelde verstrekkingen kunnen geheel of gedeeltelijk aan een gerepatrieerde worden
      onthouden, indien de gerepatrieerde niet desgevraagd de gegevens verstrekt die nodig zijn voor het vaststellen van
      het recht op verstrekkingen. Daartoe behoren in ieder geval gegevens die noodzakelijk zijn voor het vaststellen van
      de naam, de geboortedatum, de nationaliteit, het land van herkomst, de gezinssamenstelling, de datum van aankomst
      in Nederland, de middelen waarover in Nederland kan worden beschikt en de aanwezige verzekeringen voor ziektekosten
      en wettelijke aansprakelijkheid.

      2 De SVB kan een verstrekking als bedoeld in [artikel 3, aanhef en onderdelen a tot en met c][ref2], geheel of
      gedeeltelijk weigeren, indien blijkt dat de gerepatrieerde hier te lande over voldoende middelen kan beschikken om
      geheel of gedeeltelijk in de kosten van die verstrekking te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0020126#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020126#Artikel3
    url: https://wetten.overheid.nl/BWBR0020126/2006-07-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020126
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020126
        artikel: '3'
  - number: '5'
    text: |-
      De in [artikel 3][ref1] bedoelde verstrekkingen eindigen in ieder geval:

      a. met ingang van de dag waarop de gerepatrieerde Nederland verlaat;

      b. met ingang van de dag waarop de gerepatrieerde zich blijvend in Nederland vestigt; of

      c. indien een gerepatrieerde in strijd met de waarheid gegevens heeft verstrekt of verzwegen, met het oogmerk om
      aldus voor zichzelf of voor anderen, ten onrechte een aanspraak te doen ontstaan op de verstrekkingen, dan wel ten
      onrechte de hoogte van de verstrekkingen te doen stijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0020126#Artikel3
    url: https://wetten.overheid.nl/BWBR0020126/2006-07-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020126
        artikel: '3'
  - number: '6'
    text: |-
      1 De hoogte van de in [artikel 3, aanhef en onderdeel a][ref1], bedoelde eenmalige tegemoetkoming voor de
      aanloopkosten bedraagt € 40,–.

      2 De hoogte van de in [artikel 3, aanhef en onderdeel b][ref2], bedoelde financiële toelage bedraagt voor:

      a. een volwassene € 40,–, doch voor een alleenstaande ouder met een kind jonger dan 18 jaar € 67,–;

      b. een kind tot en met 11 jaar € 8,–;

      c. een kind ouder dan 11 jaar en jonger dan 18 jaar € 12,–.

      3 De eenmalige tegemoetkoming voor de aanloopkosten en de financiële toelage worden op een door de SVB te bepalen
      tijdstip en wijze aan de gerepatrieerde beschikbaar gesteld.

      4 De eenmalige tegemoetkoming en de financiële toelage voor de aanloopkosten voor een gerepatrieerde jonger dan
      18 jaar, die een kind is van, of verzorgd wordt door een of meer in Nederland verblijvende gerepatrieerden worden
      uitbetaald aan één van die gerepatrieerden.


      [ref1]: https://wetten.overheid.nl/BWBR0020126#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020126#Artikel3
    url: https://wetten.overheid.nl/BWBR0020126/2006-07-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020126
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020126
        artikel: '3'
  - number: '7'
    text: |-
      1 Een gerepatrieerde kan een vergoeding ontvangen voor buitengewone kosten, bedoeld in
      [artikel 3, aanhef en onderdeel c][ref1], die hij heeft gemaakt.

      2 Buitengewone kosten worden slechts betaald voorzover vooraf door de SVB aan de gerepatrieerde toestemming is
      verleend voor het maken van deze kosten, met uitzondering van kosten die voortvloeien uit noodsituaties waarin geen
      mogelijkheid bestond tot het verzoeken om toestemming.

      3 De toestemming, bedoeld in het tweede lid, wordt verleend voorzover de kosten noodzakelijk zijn en niet op andere
      wijze in de betaling kan worden voorzien.

      4 Kosten die samenhangen met een door de gerepatrieerde gepleegde onrechtmatige daad, gepleegd misdrijf of begane
      overtreding zijn in ieder geval geen buitengewone kosten als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020126#Artikel3
    url: https://wetten.overheid.nl/BWBR0020126/2006-07-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020126
        artikel: '3'
  - number: '8'
    text: |-
      1 Het treffen van een ziektekostenregeling als bedoeld in [artikel 3, aanhef en onderdeel d][ref1],
      houdt in het door de Minister ten behoeve van de gerepatrieerde sluiten van een verzekering tegen de in
      [artikel 10 van de Zorgverzekeringswet][ref2] en [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref3]
      bedoelde risico’s, alsmede het door de Minister betalen van de daarvoor verschuldigde kosten.

      2 Het verzekeren tegen de financiële gevolgen van wettelijke aansprakelijkheid, bedoeld in
      [artikel 3, aanhef en onderdeel e][ref4], houdt in het door de Minister ten behoeve van de gerepatrieerde sluiten
      van een verzekering voor de wettelijke aansprakelijkheid van de gerepatrieerde jegens een derde voor een som van
      maximaal € 1.000.000,– per gebeurtenis, alsmede het door de Minister betalen van de daarvoor verschuldigde kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0020126#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0020126#Artikel3
    url: https://wetten.overheid.nl/BWBR0020126/2006-07-26#Artikel8
