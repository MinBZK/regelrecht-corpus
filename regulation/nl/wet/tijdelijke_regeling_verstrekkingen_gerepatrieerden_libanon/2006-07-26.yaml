        hoofdstuk: '7'
  - number: '12'
    text: |-
      De [Algemene Regeling SZW-subsidies][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009211
    url: https://wetten.overheid.nl/BWBR0020126/2006-07-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009211
  - number: '13'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst, werkt terug tot en met 18 juli 2006 en vervalt dertien weken na inwerkingtreding.

      2 In afwijking van het eerste lid kan de Minister beslissen de regeling binnen de termijn van 13 weken
      na inwerkingtreding te laten vervallen, voorzover de Minister van Buitenlandse Zaken het woonland van de
      gerepatrieerde veilig heeft verklaard.

      3 De regeling, zoals die voor de datum waarop deze vervalt geldt, blijft van toepassing op de financiële
      afwikkeling van deze regeling.
    url: https://wetten.overheid.nl/BWBR0020126/2006-07-26#Artikel13
