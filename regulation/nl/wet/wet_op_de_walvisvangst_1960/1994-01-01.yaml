preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is nieuwe regelen te stellen met betrekking tot de
    uitoefening van de walvisvangst;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002347/1994-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Deze wet verstaat onder "walvissen": baleinwalvissen en potvissen.'
    url: https://wetten.overheid.nl/BWBR0002347/1994-01-01#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister van Landbouw en Visserij van een Nederlands schip uit
      walvissen te vangen of te doden dan wel aan boord van zodanig schip walvissen te verwerken.

      2 Aan een vergunning, als bedoeld in het vorige lid, worden voorschriften verbonden ter bescherming van de
      walvisstand dan wel ter bevordering van het wetenschappelijk onderzoek met betrekking tot walvissen.

      3 Bij de in lid 2 bedoelde voorschriften zal worden verboden:

      a. walvissen van bepaalde soorten, walvissen welke een bepaalde lengte niet hebben bereikt en vrouwelijke
      walvissen, welke vergezeld worden door jonge dieren, te vangen of te doden;

      b. walvissen in bepaalde zeegebieden te vangen, te doden of te verwerken;

      c. gedode walvissen, niet, niet tijdig of niet volledig te verwerken.

      Deze voorschriften kunnen voorts onder meer regelen inhouden omtrent het vangen, doden of verwerken van walvissen
      in bepaalde tijdvakken, omtrent het tijdstip, waarop de walvisvangst ieder seizoen moet worden gestaakt, omtrent
      de wijze van beloning van de harpoeniers en de bemanningen van de vaartuigen waarmede de walvisvangst zal worden
      uitgeoefend, zomede omtrent de door de vergunninghouder met betrekking tot de walvisvangst te verstrekken gegevens.

      4 Onze Minister kan de aan de vergunning verbonden voorschriften wijzigen of intrekken dan wel aan die
      voorschriften nieuwe toevoegen.
    url: https://wetten.overheid.nl/BWBR0002347/1994-01-01#Artikel2
  - number: '5'
    text: De Wet op de Walvisvangst (*Stb.* 1951, 98) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002347/1994-01-01#Artikel5
  - number: '6'
    text: |-
      Deze wet treedt in werking op een nader door Ons te bepalen tijdstip. Zij kan worden aangehaald als "Wet op de
      Walvisvangst 1960".
    url: https://wetten.overheid.nl/BWBR0002347/1994-01-01#Artikel6
