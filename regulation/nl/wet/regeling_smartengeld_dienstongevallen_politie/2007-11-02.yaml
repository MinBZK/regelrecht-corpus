  - number: '8'
    text: |-
      1 De in [artikel 2, eerste lid, onder a][ref1], en [artikel 7, eerste lid][ref2], bedoelde meldingen gelden als
      aanvraag tot vergoeding van smartengeld.

      2 Indien sprake is van een dienstongeval wordt de beschikking op de aanvraag genomen uiterlijk drie weken nadat de
      mate van invaliditeit is vastgesteld, tenzij met toepassing van [artikel 5][ref3] een tweede uitkeringspercentage
      wordt vastgesteld. In dat geval wordt de beschikking uiterlijk drie weken na de vaststelling van het tweede
      uitkeringspercentage genomen.

      3 Indien sprake is van een verzoek als bedoeld in [artikel 5, eerste lid][ref4], wordt de beschikking genomen
      uiterlijk drie weken nadat de mate van invaliditeit is vastgesteld of, indien het verzoek na vaststelling van de
      invaliditeit is ingediend, uiterlijk drie weken na het verzoek.


