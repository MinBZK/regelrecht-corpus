  - number: '5'
    text: |-
      1 Indien op grond van [artikel 3][ref1] of [artikel 4][ref2] een uitkeringspercentage is vastgesteld en het
      dienstongeval tevens heeft geleid tot arbeidsongeschiktheid, wordt een tweede uitkeringspercentage vastgesteld,
      tenzij de ambtenaar het bevoegd gezag schriftelijk verzoekt niet tot vaststelling daarvan over te gaan..

      2 Het bevoegd gezag wijst een deskundige aan die het tweede uitkeringspercentage vaststelt aan de hand van de in
      het derde lid opgenomen tabel. Daarbij wordt uitgegaan van de mate van arbeidsongeschiktheid zoals bepaald door
      het ter zake van de uitvoering van de arbeidsongeschiktheidsregelingen bevoegde orgaan. De vaststelling vindt
      plaats zodra voorzienbaar is dat de mate van arbeidsongeschiktheid ten gevolge van het dienstongeval niet meer zal
      toenemen of afnemen, doch uiterlijk drie jaar na het dienstongeval.

      3 Het onderstaande uitkeringspercentage van het bedrag, genoemd in [artikel 54a, eerste lid, van het besluit][ref3]
      wordt vastgesteld bij een arbeidsongeschiktheidspercentage van:


