  - number: '6'
    text: |-
      1 Bij een post-whiplashsyndroom ten gevolge van een dienstongeval waarbij medisch objectief geen lichamelijke
      afwijkingen kunnen worden vastgesteld, wordt slechts smartengeld toegekend indien overeenkomstig de richtlijnen van
      de Nederlandse Vereniging voor Neurologie sprake is van invaliditeit als bedoeld in die richtlijnen.

      2 Het bevoegd gezag wijst een deskundige aan die de in het eerste lid bedoelde mate van invaliditeit vaststelt. Het
      uitkeringspercentage is gelijk aan de vastgestelde mate van invaliditeit.

      3 Het bevoegd gezag draagt de kosten van de vaststelling, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0022745/2007-11-02#Artikel6
  - number: '7'
    text: |-
      1 De ambtenaar die als gevolg van een dienstongeval mogelijk een besmetting met het Humane Immunodificiency Virus
      (HIV) heeft opgelopen, meldt het dienstongeval dat de vermoedelijke aanleiding was voor de besmetting schriftelijk
      binnen 5 × 24 uur aan het bevoegd gezag en laat zich binnen één week na dat dienstongeval testen op de besmetting.
      Hij onderwerpt zich aan een tweede test op een daarvoor medisch geïndiceerd tijdstip.

      2 Indien vast komt te staan dat tussen de eerste en de tweede test seroconversie heeft plaatsgevonden, wordt
      aangenomen dat de besmetting een gevolg is van het dienstongeval en wordt naar keuze van de ambtenaar

      a. een zesde deel van het in [artikel 54a, eerste lid, van het besluit][ref1] genoemde bedrag aan hem uitgekeerd of

      b. het in [artikel 54a, tweede lid, van het besluit][ref2] genoemde bedrag aan zijn nabestaanden uitgekeerd indien
      hij binnen 20 jaar als gevolg van de besmetting overlijdt.

      3 De ambtenaar maakt de keuze, bedoeld in het tweede lid, binnen acht weken nadat is vast komen te staan dat
      seroconversie heeft plaatsgevonden.

      4 Het bevoegd gezag draagt de kosten van de in het eerste lid bedoelde testen.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel54a
    url: https://wetten.overheid.nl/BWBR0022745/2007-11-02#Artikel7
