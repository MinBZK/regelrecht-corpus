articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. besluit: het [Besluit algemene rechtspositie politie][ref1];

      b. ambtenaar: de ambtenaar, bedoeld in [artikel 1, eerste lid, onderdeel i, van het besluit][ref2];

      c. bevoegd gezag: het bevoegd gezag, bedoeld in [artikel 1, eerste lid, onderdeel l, van het besluit][ref3];

      d. dienstongeval: een dienstongeval als bedoeld in [artikel 1, eerste lid, onderdeel z, van het besluit][ref4];

      e. invaliditeit: het objectief medisch vast te stellen blijvende gehele of gedeeltelijke functieverlies van een
      orgaan of enig ander deel van het lichaam;

      f. smartengeld: een vergoeding ter hoogte van een met inachtneming van deze regeling vast te stellen
      uitkeringspercentage van het bedrag genoemd in [artikel 54a, eerste lid, van het besluit][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006516
