  - number: '9'
    text: |-
      In het geval geheel of gedeeltelijk ten onrechte smartengeld is toegekend op grond van door de ambtenaar of zijn
      vertegenwoordiger, bedoeld in van [artikel 2, derde lid][ref1], verstrekte gegevens waarvan zij wisten of moesten
      weten dat deze gegevens onjuist waren, kan het bevoegd gezag het besluit tot toekenning van smartengeld herzien
      of intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0022745#Artikel2
