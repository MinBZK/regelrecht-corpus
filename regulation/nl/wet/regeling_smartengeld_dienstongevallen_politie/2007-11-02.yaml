        artikel: 54a
  - number: '2'
    text: |-
      1 De ambtenaar die een dienstongeval heeft gehad dat heeft geleid of kan leiden tot invaliditeit:

      a. meldt het dienstongeval zo spoedig mogelijk en in ieder geval binnen 150 dagen na het dienstongeval schriftelijk
      aan het bevoegd gezag;

      b. licht het bevoegd gezag zo volledig mogelijk in over het dienstongeval;

      c. stelt zich direct onder geneeskundige behandeling;

      d. doet al het mogelijke om een spoedig herstel te bevorderen, onder meer door de aanwijzingen van de behandelend
      arts op te volgen en

      e. verleent zijn medewerking aan de vaststelling van de ontstane invaliditeit.

      2 Indien de ambtenaar niet handelt overeenkomstig het eerste lid, onderdelen a tot en met d, kan alleen recht op
      smartengeld ontstaan indien:

      a. hij in redelijkheid aantoont dat de ontstane invaliditeit uitsluitend het gevolg is van het dienstongeval en

      b. het bevoegd gezag als gevolg van dit verzuim niet in zijn belangen is geschaad.

      3 Een ander kan namens de ambtenaar voldoen aan het eerste lid, onderdelen a en b, en het tweede lid, onderdeel a,
      mits die ander geacht kan worden de belangen van de ambtenaar te vertegenwoordigen.

      4 Onderzoekskosten die voortvloeien uit het tweede lid, onderdeel a, komen voor rekening van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0022745/2007-11-02#Artikel2
  - number: '3'
    text: |-
      1 Het bevoegd gezag wijst een deskundige aan die de als gevolg van het dienstongeval ontstane mate van invaliditeit
      van de ambtenaar vaststelt aan de hand van de Guides to the Evaluation of Permanent Impairment van de American
      Medical Association. De vaststelling vindt plaats zodra voorzienbaar is dat de toestand van de ambtenaar niet meer
      zal verbeteren of verslechteren, doch uiterlijk twee jaar na het dienstongeval.

      2 Het smartengeld is gelijk aan de in procenten vastgestelde mate van invaliditeit, tenzij op grond van
      [artikel 4][ref1] een hoger uitkeringspercentage wordt vastgesteld.

      3 Indien de ambtenaar anders dan als gevolg van het dienstongeval overlijdt voordat het uitkeringspercentage kan
      worden vastgesteld, wordt uitgekeerd naar het bedrag dat naar verwachting zou zijn uitgekeerd.

      4 Het bevoegd gezag draagt de kosten van de vaststelling, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022745#Artikel4
