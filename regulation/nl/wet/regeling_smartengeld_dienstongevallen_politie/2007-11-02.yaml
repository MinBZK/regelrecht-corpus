      2 Bij gedeeltelijke amputatie of gedeeltelijk verlies van het gebruiksvermogen wordt een evenredig deel van het
      genoemde uitkeringspercentage vastgesteld. Bij amputatie of volledig verlies van het gebruiksvermogen van één of
      meer vingers van een hand bedraagt het uitkeringspercentage nooit meer dan bij verlies van de arm tussen pols en
      ellebooggewricht.

