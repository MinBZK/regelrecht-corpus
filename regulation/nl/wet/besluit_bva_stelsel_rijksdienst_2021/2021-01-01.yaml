  - number: 1.a
    text: '*Rijksdienst:* de kerndepartementen en de daaronder ressorterende dienstonderdelen;'
    url: https://wetten.overheid.nl/BWBR0044617/2021-01-01#Artikel1
  - number: 1.b
    text: |-
      *Dienstonderdeel:* een onder de verantwoordelijkheid van de desbetreffende minister ressorterende directie,
      afdeling, instelling, dienst of bedrijf;
    url: https://wetten.overheid.nl/BWBR0044617/2021-01-01#Artikel1
  - number: 1.c
    text: '*Ambtelijke leiding:* hoogste ambtenaar van het ministerie, organisatieonderdeel;'
    url: https://wetten.overheid.nl/BWBR0044617/2021-01-01#Artikel1
  - number: 1.d
    text: |-
      *BVA Rijk:* Beveiligingsautoriteit Rijk, bedoeld in [artikel 7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044617#Artikel7
