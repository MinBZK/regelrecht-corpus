  - number: '7'
    text: |-
      1 De instelling stelt de cliëntenraad in de gelegenheid advies uit te brengen over elk door haar voorgenomen
      besluit inzake:

      a. een wijziging van de doelstelling of de grondslag van de instelling;

      b. een fusie of duurzame samenwerking waarbij de instelling is betrokken;

      c. een overdracht van de zeggenschap over de zorg of een onderdeel daarvan;

      d. een gehele of gedeeltelijke beëindiging dan wel een belangrijke uitbreiding van de zorgverlening;

      e. een belangrijke wijziging in de organisatie van de zorgverlening;

      f. een profielschets voor de benoeming van de leden van het toezichthoudend orgaan en de leden van het bestuur van
      de instelling;

      g. de vaststelling van de begroting en de jaarrekening van de instelling;

      h. het algemene huisvestingsbeleid van een instelling die erop is ingericht cliënten langdurig te laten verblijven,
      alsmede een ingrijpende verbouwing, nieuwbouw of verhuizing van een instelling waarin deze cliënten verblijven, en

      i. de selectie en benoeming van personen die leiding geven aan degenen die zorg verlenen aan cliënten, indien het
      een instelling betreft die erop is ingericht cliënten langdurig te laten verblijven.

      2 Indien de instelling meerdere cliëntenraden heeft, geldt het eerste lid slechts voor die cliëntenraad of
      cliëntenraden, die ingevolge de medezeggenschapsregeling bevoegd zijn advies over het desbetreffende onderwerp uit
      te brengen.

      3 Het advies wordt op een zodanig tijdstip gevraagd dat de cliëntenraad redelijkerwijs genoeg tijd heeft zich een
      goed oordeel ter zake te vormen en dat het advies van wezenlijke invloed kan zijn op het te nemen besluit.

      4 De cliëntenraad brengt zijn met redenen omkleed advies over een voorgenomen besluit uit binnen een redelijke
      termijn.

      5 De instelling neemt geen van een schriftelijk door de cliëntenraad uitgebracht advies afwijkend besluit dan nadat
      daarover, voor zover dat redelijkerwijze mogelijk is, ten minste eenmaal met de cliëntenraad overleg is gepleegd.

      6 De instelling doet van een besluit inzake een onderwerp waarover de cliëntenraad schriftelijk advies heeft
      uitgebracht, schriftelijk, en voor zover zij van het advies afwijkt onder opgave van redenen, mededeling aan de
      cliëntenraad.
    url: https://wetten.overheid.nl/BWBR0042294/2025-07-05#Artikel7
  - number: '8'
    text: |-
      1 De instelling behoeft de instemming van de cliëntenraad voor elk door haar voorgenomen besluit inzake:

      a. de medezeggenschapsregeling, de regeling, bedoeld in
      [artikel 13, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref1], alsmede andere voor cliënten
      geldende regelingen;

      b. een profielschets voor het benoemen van personen als bedoeld in
      [artikel 15 van de Wet kwaliteit, klachten en geschillen zorg][ref2];

      c. de procedure voor het opstellen en bespreken van zorgplannen;

      d. het algemene beleid ter zake van kwaliteit, veiligheid en hygiëne;

      e. het algemene beleid ter zake van de toelating van cliënten tot de zorgverlening en beëindiging daarvan;

      f. het algemene beleid ter zake van voedingsaangelegenheden, geestelijke verzorging, recreatiemogelijkheden of
      ontspanningsactiviteiten en maatschappelijke bijstand, indien het een instelling betreft waarin cliënten gedurende
      het etmaal kunnen verblijven;

      g. een sociaal plan voor cliënten in geval van een ingrijpende verbouwing, nieuwbouw of verhuizing van een
      instelling die erop is ingericht cliënten langdurig te laten verblijven;

      h. de inrichting van voor de zorgverlening bestemde ruimtes bij ingrijpende verbouwing, nieuwbouw of verhuizing van
      een instelling die erop is ingericht cliënten langdurig te laten verblijven, en

      i. de selectie en benoeming van personen die de cliëntenraad de onafhankelijke ondersteuning, bedoeld in
      [artikel 6, derde lid][ref3], zullen verlenen.

      2 Indien de instelling meerdere cliëntenraden heeft, geldt het eerste lid slechts voor die cliëntenraad of
      cliëntenraden, die ingevolge de medezeggenschapsregeling bevoegd zijn om met het desbetreffende voorgenomen besluit
      in te stemmen.

      3 De instelling legt het te nemen besluit schriftelijk aan de cliëntenraad voor op een zodanig tijdstip dat de
      cliëntenraad redelijkerwijs genoeg tijd heeft zich een goed oordeel ter zake te vormen.

      4 De cliëntenraad onthoudt zijn instemming niet dan nadat daarover, voor zover dat redelijkerwijs mogelijk is, ten
      minste eenmaal met de instelling overleg is gepleegd. De cliëntenraad deelt zijn beslissing zo spoedig mogelijk
      schriftelijk, in geval van het onthouden van de instemming met redenen omkleed, aan de instelling mee.

      5 Zo spoedig mogelijk na het ontvangen van de beslissing van de cliëntenraad geeft de instelling daar een reactie
      op.

      6 Indien de instelling voor het voorgenomen besluit geen instemming van de cliëntenraad heeft verkregen, kan zij de
      commissie van vertrouwenslieden toestemming vragen om het besluit te nemen. De commissie geeft slechts toestemming
      indien:

      a. de beslissing van de cliëntenraad om geen instemming te geven onredelijk is, of

      b. het voorgenomen besluit van de instelling gevergd wordt om zwaarwegende redenen.

      7 Een besluit als bedoeld in het eerste lid, genomen zonder de instemming van de cliëntenraad of de toestemming
      van de commissie van vertrouwenslieden is nietig indien de cliëntenraad tegenover de instelling schriftelijk een
      beroep op de nietigheid heeft gedaan. De cliëntenraad kan slechts een beroep op de nietigheid doen binnen een maand
      nadat de instelling hem haar besluit heeft medegedeeld dan wel, bij gebreke van deze mededeling, de cliëntenraad is
      gebleken dat de instelling uitvoering of toepassing geeft aan haar besluit.

      8 Indien de medezeggenschapsregeling wordt vastgesteld of gewijzigd en er geen cliëntenraad is
      ingesteld of functioneert, behoeft de instelling voor het besluit tot vaststelling of wijziging van
      de medezeggenschapsregeling de instemming van een representatief te achten delegatie van cliënten of
      hun vertegenwoordigers dan wel van een representatief te achten organisatie van cliënten. De betrokken
      delegatie of organisatie wordt in dat geval voor de toepassing van het derde tot en met zevende lid, en
      [artikel 14, eerste, derde, vierde, achtste en tiende lid][ref4], aangemerkt als cliëntenraad, voor zover het
      besluiten betreft omtrent de medezeggenschapsregeling.


