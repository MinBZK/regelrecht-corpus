  - number: '14'
    text: |-
      1 De instelling, bedoeld in [artikel 3, eerste lid][ref1], stelt in overeenstemming met de cliëntenraad of
      cliëntenraden een uit drie leden bestaande commissie van vertrouwenslieden in, waarvan een lid door haar wordt
      aangewezen, een lid door de cliëntenraad of cliëntenraden wordt aangewezen en een lid door de beide andere leden
      wordt aangewezen, of wijst een door een of meer cliëntenorganisaties en een of meer organisaties van instellingen
      ingestelde commissie van vertrouwenslieden aan.

      2 De commissie van vertrouwenslieden heeft tot taak te bemiddelen en zo nodig een uitspraak te doen.

      3 Organisaties als bedoeld in het eerste lid die een commissie van vertrouwenslieden hebben ingesteld, waarborgen
      dat:

      a. een instelling of een cliëntenraad aan de commissie een geschil kan voorleggen
      over de uitvoering van de [artikelen 3, tweede tot en met negende lid][ref2],
      [4, tweede, derde en vierde lid][ref3], [5, tweede tot en met vierde lid][ref4], [6][ref5],
      [7][ref6], [8, eerste tot en met vijfde, en achtste lid][ref7], [9, tweede en derde lid][ref8], en
      [13, eerste tot en met vierde lid][ref9], alsmede over de uitvoering van de medezeggenschapsregeling;

      b. een instelling aan de commissie kan verzoeken een beslissing te nemen als bedoeld in
      [artikel 8, zesde lid][ref10], [9, vierde lid][ref11], of [13, vijfde lid][ref12];

      c. een cliëntenraad aan de commissie kan verzoeken een beslissing te nemen als bedoeld in
      [artikel 9, vierde lid][ref13];

      d. een representatief te achten delegatie van cliënten of hun vertegenwoordigers aan de commissie kan verzoeken een
      beslissing te nemen als bedoeld in [artikel 13, zesde lid][ref14]; en

      e. een voor een locatie representatief te achten delegatie van cliënten of hun vertegenwoordigers aan de commissie
      een geschil kan voorleggen over de uitvoering van [artikel 3, vierde lid][ref15].

      4 Van een uitspraak of een beslissing van de commissie van vertrouwenslieden kan in beroep worden gekomen bij de
      ondernemingskamer van het gerechtshof Amsterdam.

      5 Het beroep wordt ingeleid door indiening van een verzoek binnen drie maanden nadat de verzoekende partij van de
      in het vierde lid bedoelde uitspraak of beslissing op de hoogte is gesteld. De wederpartij wordt van het beroep in
      kennis gesteld.

      6 De ondernemingskamer behandelt het verzoek met de meeste spoed.

      7 Tegen een uitspraak van de ondernemingskamer kan geen beroep in cassatie worden ingesteld.

      8 Nadat de termijn, bedoeld in het vijfde lid, ongebruikt verlopen is, kan de cliëntenraad of de representatief te
      achten delegatie van cliënten of hun vertegenwoordigers de ondernemingskamer schriftelijk verzoeken de instelling
      te bevelen een uitspraak van de commissie van vertrouwenslieden na te leven. Een verzoeker die niet vooraf
      schriftelijk aan de instelling heeft verzocht te handelen overeenkomstig hetgeen in het verzoekschrift is verzocht
      en deze daarbij niet een redelijke termijn heeft gegeven om aan dat verzoek te voldoen, wordt niet-ontvankelijk
      verklaard.

      9 De ondernemingskamer kan in haar beslissing aan de instelling de verplichting opleggen bepaalde handelingen te
      verrichten of na te laten.

      10 In rechtsgedingen als bedoeld in het vierde of achtste lid kan de cliëntenraad niet in de proceskosten worden
      veroordeeld.

      11 De kosten voor het voorleggen van een verzoek als bedoeld in het derde lid, onderdelen d en e, komen voor
      rekening van de instelling, met uitzondering van de kosten van juridische bijstand indien onderdeel d van
      toepassing is. In rechtsgedingen als bedoeld in het achtste lid, kan de delegatie, bedoeld in het derde lid,
      onderdeel d of e, niet in de proceskosten worden veroordeeld.


