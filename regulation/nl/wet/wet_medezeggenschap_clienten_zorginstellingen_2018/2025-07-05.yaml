        bwb_id: BWBR0034925
        artikel: 4.2.5
  - number: '27'
    text: |-
      Onze Minister voor Medische Zorg zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal
      een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0042294/2025-07-05#Artikel27
  - number: '28'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0042294/2025-07-05#Artikel28
  - number: '29'
    text: 'Deze wet wordt aangehaald als: Wet medezeggenschap cliënten zorginstellingen 2018.'
    url: https://wetten.overheid.nl/BWBR0042294/2025-07-05#Artikel29
