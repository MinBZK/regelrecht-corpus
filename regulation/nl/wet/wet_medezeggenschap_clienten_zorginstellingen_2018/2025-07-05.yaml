  - number: '5'
    text: |-
      1 De cliëntenraad regelt zijn werkwijze, met inbegrip van zijn vertegenwoordiging in en buiten rechte, in een
      huishoudelijk reglement.

      2 De cliëntenraad zorgt voor:

      a. het regelmatig inventariseren van de wensen en meningen van de betrokken cliënten en hun vertegenwoordigers, en

      b. het informeren van de betrokken cliënten en hun vertegenwoordigers over zijn werkzaamheden en de resultaten
      daarvan.

      3 De instelling verleent de cliëntenraad hulp bij de uitvoering van het tweede lid.

      4 De cliëntenraad betrekt bij zijn werkzaamheden de resultaten van inspraak als bedoeld in [artikel 2][ref1] en
      informeert de betrokken cliënten en hun vertegenwoordigers hoe hij dit heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0042294#Artikel2
