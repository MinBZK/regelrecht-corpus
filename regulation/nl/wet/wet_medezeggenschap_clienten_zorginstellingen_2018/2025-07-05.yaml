  - number: '2'
    text: |-
      1 De instelling die erop is ingericht cliënten langdurig te laten verblijven, stelt haar cliënten en hun
      vertegenwoordigers in de gelegenheid inspraak uit te oefenen in aangelegenheden die direct van invloed zijn op het
      dagelijks leven van de cliënten.

      2 De instelling informeert de desbetreffende cliënten alsmede hun vertegenwoordigers over hetgeen zij heeft gedaan
      met de resultaten van de inspraak.
    url: https://wetten.overheid.nl/BWBR0042294/2025-07-05#Artikel2
  - number: '3'
    text: |-
      1 Een instelling stelt een cliëntenraad in die binnen het kader van de doelstellingen van de instelling in het
      bijzonder de gemeenschappelijke belangen van de betrokken cliënten behartigt, indien:

      a. bij de instelling, niet zijnde een instelling als bedoeld in onderdeel b, in de regel meer dan tien natuurlijke
      personen zorg verlenen;

      b. bij de instelling waarin cliënten niet gedurende ten minste een etmaal kunnen verblijven en die bij algemene
      maatregel van bestuur aan te wijzen zorg verleent, in de regel meer dan vijfentwintig natuurlijke personen zorg
      verlenen.

      2 De instelling regelt na overleg met de cliëntenraad of, indien er geen cliëntenraad is ingesteld of deze niet
      functioneert, na overleg met een representatief te achten delegatie van cliënten of hun vertegenwoordigers dan wel
      met een representatief te achten organisatie van cliënten, in een medezeggenschapsregeling schriftelijk het aantal
      leden van een cliëntenraad, de wijze van benoeming en ontslag, welke personen tot lid kunnen worden benoemd en de
      zittingsduur van de leden. Deze regeling is zodanig dat een cliëntenraad redelijkerwijze representatief kan worden
      geacht voor de betrokken cliënten en redelijkerwijze in staat kan worden geacht hun gemeenschappelijke belangen
      te behartigen.

      3 In de medezeggenschapsregeling wordt tevens geregeld op welke wijze een cliëntenraad wordt betrokken bij de
      voorbereiding van een besluit inzake:

      a. een wijziging van de doelstelling of de grondslag van de instelling;

      b. een fusie of duurzame samenwerking waarbij de instelling is betrokken;

      c. een overdracht van de zeggenschap over de zorg of een onderdeel daarvan;

      d. een ingrijpende verbouwing, nieuwbouw of verhuizing van een instelling die erop is ingericht cliënten langdurig
      te laten verblijven, en

      e. de selectie en benoeming van personen die leiding geven aan degenen die zorg verlenen aan cliënten, indien het
      een instelling betreft die erop is ingericht cliënten langdurig te laten verblijven.

      4 Onverminderd het eerste lid kan een instelling meerdere cliëntenraden instellen. Indien een instelling die erop
      is ingericht cliënten langdurig te laten verblijven of die bij cliënten thuis zorg laat verlenen, meerdere locaties
      in stand houdt, is deze instelling verplicht om voor elk van die locaties een cliëntenraad in te stellen, tenzij
      een voor zo een locatie representatief te achten delegatie van cliënten of hun vertegenwoordigers heeft aangegeven
      hier geen behoefte aan te hebben of dit in redelijkheid voor een of meer van die locaties niet aangewezen is.

      5 Er kan een centrale cliëntenraad worden ingesteld. Een centrale cliëntenraad is een cliëntenraad in de zin van
      deze wet.

      6 Indien meerdere cliëntenraden worden ingesteld, worden de taken en bevoegdheden van iedere cliëntenraad in een
      medezeggenschapsregeling geregeld, waarbij aan een cliëntenraad die de belangen van de cliënten op een bepaalde
      locatie behartigt in elk geval de taken en bevoegdheden worden toegekend met betrekking tot aangelegenheden die
      specifiek de cliënten op die locatie raken. De in [artikel 8, eerste lid, aanhef en onderdeel a][ref1], geregelde
      bevoegdheid van een cliëntenraad om in te stemmen met de medezeggenschapsregeling kan niet aan een andere
      cliëntenraad worden overgedragen.

      7 In de medezeggenschapsregeling wordt geregeld hoe wordt bewerkstelligd dat de voor het vervullen van de taak
      van de cliëntenraad benodigde informatie wordt verstrekt op een zodanige wijze dat deze voor de cliëntenraad
      begrijpelijk is.

      8 De instelling stelt de cliëntenraad in de gelegenheid om een vacature voor die raad op een daarvoor geschikte
      wijze onder de aandacht te brengen van de cliënten en hun vertegenwoordigers en helpt hem daar desgevraagd bij.

      9 De instelling brengt de medezeggenschapsregeling, alsmede een wijziging daarvan, op een daarvoor geschikte wijze
      onder de aandacht van de cliënten en hun vertegenwoordigers.


      [ref1]: https://wetten.overheid.nl/BWBR0042294#Artikel8
