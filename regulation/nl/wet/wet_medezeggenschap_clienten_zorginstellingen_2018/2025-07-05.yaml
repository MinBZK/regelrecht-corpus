  - number: '4'
    text: |-
      1 Indien het aantal natuurlijke personen die in de regel bij een instelling zorg verlenen, daalt beneden het aantal
      waarbij de instelling ingevolge [artikel 3, eerste lid][ref1], een cliëntenraad dient in te stellen, deelt de
      instelling aan de cliëntenraad, de cliënten en hun vertegenwoordigers schriftelijk of elektronisch mede of hij de
      cliëntenraad vrijwillig in stand zal houden dan wel de cliëntenraad zal ontbinden. In het geval van ontbinding,
      houdt de instelling de cliëntenraad in stand gedurende ten minste drie maanden na de in de eerste volzin bedoelde
      mededeling.

      2 Zodra een instelling schriftelijk of elektronisch onder de aandacht van de cliëntenraad, de cliënten en hun
      vertegenwoordigers heeft gebracht dat hij vrijwillig een cliëntenraad in stand houdt, zijn de volgende bepalingen
      van overeenkomstige toepassing:

        - [artikelen 3, tweede lid][ref2], en [6][ref3];
        - [artikelen 14][ref4] en [15][ref5], voor zover deze artikelen betrekking hebben op bepalingen die van toepassing
      of van overeenkomstige toepassing zijn op vrijwillig in stand gehouden cliëntenraden.

      3 De instelling die vrijwillig een cliëntenraad in stand houdt legt in overleg met de cliëntenraad vast over welke
      onderwerpen de cliëntenraad medezeggenschap heeft en op welke wijze de medezeggenschap geregeld is.

      4 De instelling kan een vrijwillig in stand gehouden cliëntenraad op grond van een belangrijke wijziging van de
      omstandigheden ontbinden.

      5 [Artikel 13, tweede tot en met vijfde lid][ref6], is van toepassing op een voornemen om een cliëntenraad wegens
      toepasselijkheid van het eerste of vierde lid te ontbinden.

      6 De instelling brengt het besluit tot ontbinding van een vrijwillig in stand gehouden cliëntenraad schriftelijk of
      elektronisch onder de aandacht van de cliëntenraad, de cliënten en hun vertegenwoordigers.

      7 Indien een instelling een cliëntenraad heeft ingesteld hoewel zij daartoe gezien het aantal zorgverleners
      dat in de regel bij haar werkzaam is niet verplicht is, is het bepaalde in het tweede tot en met zesde lid van
      overeenkomstige toepassing.


