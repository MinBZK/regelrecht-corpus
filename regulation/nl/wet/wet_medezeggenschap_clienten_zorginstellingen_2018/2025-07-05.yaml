  - number: '26'
    text: |-
      1 De voor het tijdstip van inwerkingtreding van deze wet aangevangen procedures inzake de naleving van de
      [Jeugdwet][ref1] zoals die wet luidde tot het tijdstip van inwerkingtreding van [artikel 16][ref2] van deze wet,
      worden afgewikkeld overeenkomstig [artikel 4.2.11 van die wet][ref3] zoals die wet luidde tot het tijdstip van
      inwerkingtreding van artikel 16 van deze wet.

      2 Een jeugdhulpaanbieder, gecertificeerde instelling of pleegzorgaanbieder die betrokken is bij een procedure
      als bedoeld in het eerste lid en op grond van de [Jeugdwet][ref4] zoals deze luidt na inwerkingtreding
      van [artikel 16][ref5] van deze wet niet verplicht is tot het instellen of aanwijzen van een commissie van
      vertrouwenslieden, houdt een op grond van [artikel 4.2.11][ref6] of de [artikelen 4.2.12][ref7] juncto 4.2.11
      van de Jeugdwet, zoals deze artikelen luidden voor de inwerkingtreding van artikel 16 van deze wet, ingestelde
      commissie of aanwijzing in stand zolang dat nodig is voor de toepassing van het eerste lid.

      3 Een cliënten- of pleegouderraad die op grond van [paragraaf 4.2.b van de Jeugdwet][ref8] is ingesteld voor of op
      de dag, voorafgaand aan het tijdstip van inwerkingtreding van [artikel 16][ref9] van deze wet, wordt aangemerkt als
      een cliënten- respectievelijk pleegouderraad die is ingesteld op grond van [artikel 4.2.4][ref10] respectievelijk
      [4.2.5 van de Jeugdwet][ref11].

      4 Een jeugdhulpaanbieder, gecertificeerde instelling of pleegzorgaanbieder die voor de inwerkingtreding van
      [artikel 16][ref12] van deze wet reeds een medezeggenschapsregeling heeft vastgesteld, stelt binnen zes maanden na
      het tijdstip van inwerkingtreding van dat artikel een medezeggenschapsregeling vast die voldoet aan de krachtens
      de [artikelen 4.2.4][ref13] of [4.2.5 van de Jeugdwet][ref14] gestelde eisen. Tot het tijdstip waarop een zodanige
      regeling is vastgesteld, doch ten hoogste totdat de in de eerste volzin bedoelde zes maanden zijn verstreken,
      wordt een regeling die is vastgesteld voor de inwerkingtreding van artikel 16 van deze wet aangemerkt als een
      medezeggenschapsregeling die voldoet aan de krachtens de artikelen 4.2.4 of 4.2.5 van de Jeugdwet gestelde eisen.


