  - number: '6'
    text: |-
      1 De instelling verstrekt de cliëntenraad tijdig en desgevraagd schriftelijk alle inlichtingen en gegevens die
      deze voor de vervulling van zijn taak redelijkerwijs nodig heeft. De instelling verstrekt de cliëntenraad voorts
      ten minste eenmaal per jaar mondeling of schriftelijk algemene gegevens omtrent het beleid dat in het verstreken
      tijdvak is gevoerd en in het komende jaar zal worden gevoerd.

      2 De instelling staat een cliëntenraad het gebruik toe van de voorzieningen waarover zij beschikt en die de
      cliëntenraad voor de vervulling van zijn werkzaamheden redelijkerwijs nodig heeft.

      3 De kosten die redelijkerwijs noodzakelijk zijn voor de vervulling van de werkzaamheden van de cliëntenraad,
      waaronder de kosten die verband houden met scholing, onafhankelijke ondersteuning en het voorleggen van een geschil
      of een verzoek aan een commissie van vertrouwenslieden, komen ten laste van de instelling. In afwijking van de
      vorige zin komen, tenzij anders afgesproken, kosten van juridische bijstand voor het voorleggen van een geschil aan
      de commissie van vertrouwenslieden niet voor rekening van de instelling.

      4 De instelling kan in overeenstemming met een cliëntenraad de kosten die de cliëntenraad in enig jaar zal maken,
      vaststellen op een bepaald bedrag dat de cliëntenraad naar eigen inzicht kan besteden. Kosten, anders dan de kosten
      voor het voeren van rechtsgedingen, waardoor het in de eerste volzin bedoelde bedrag zou worden overschreden, komen
      slechts ten laste van de instelling voor zover zij in het dragen daarvan toestemt.

      5 Kosten die een cliëntenraad maakt voor het voeren van rechtsgedingen over de toepassing van deze wet alsmede
      kosten verbonden aan het indienen van verzoeken als bedoeld in [artikel 12][ref1] en [14, achtste lid][ref2], komen
      slechts ten laste van de instelling indien deze kosten redelijkerwijs noodzakelijk zijn en de instelling er vooraf
      van in kennis is gesteld dat dergelijke kosten zullen worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0042294#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0042294#Artikel14
