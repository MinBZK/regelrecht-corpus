  - number: '9'
    text: |-
      1 De cliëntenraad is bevoegd de instelling ongevraagd te adviseren over onderwerpen die voor de cliënten van belang
      zijn.

      2 De instelling besluit zo spoedig mogelijk of zij een ongevraagd advies zal volgen. Indien zij voornemens is
      een van een schriftelijk advies afwijkend besluit te nemen, overlegt zij daarover, voor zover dat redelijkerwijze
      mogelijk is, ten minste eenmaal met de cliëntenraad.

      3 De instelling doet van een besluit inzake een onderwerp waarover de cliëntenraad schriftelijk advies heeft
      uitgebracht, schriftelijk, en voor zover zij van het advies afwijkt en de cliëntenraad daar niet mee heeft
      ingestemd, onder opgave van redenen, mededeling aan de cliëntenraad.

      4 Indien de instelling zonder dat de cliëntenraad daarmee heeft ingestemd heeft besloten om een ongevraagd
      schriftelijk advies over een onderwerp als bedoeld in [artikel 8, eerste lid][ref1], niet of niet geheel uit te
      voeren, kan:

      a. de cliëntenraad de commissie van vertrouwenslieden verzoeken uit te spreken dat het advies toch dient te worden
      uitgevoerd, of

      b. de instelling de commissie van vertrouwenslieden verzoeken om het door de instelling genomen besluit te
      bevestigen.

      5 De commissie weigert het verzoek, bedoeld in het vierde lid, onderdeel a, dan wel willigt het verzoek, bedoeld
      in het vierde lid, onderdeel b, in, indien de weigering van de instelling om het advies geheel te volgen redelijk
      is. Tenzij de commissie van mening is dat het advies in het geheel niet gevolgd hoeft te worden, bepaalt zij tevens
      welk deel van het advies uitgevoerd dient te worden en wanneer daarmee een aanvang moet zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0042294#Artikel8
