  - number: '10'
    text: |-
      Een instelling legt in haar statuten of, indien zij geen statuten heeft, anderszins schriftelijk vast dat de
      cliëntenraad in de gelegenheid wordt gesteld om een bindende voordracht te doen voor de benoeming van ten minste
      één lid van het toezichthoudende orgaan van de instelling.
    url: https://wetten.overheid.nl/BWBR0042294/2025-07-05#Artikel10
  - number: '11'
    text: |-
      1 Het toezichthoudende orgaan van de instelling en de cliëntenraad overleggen ten minste één keer per jaar.

      2 Het toezichthoudende orgaan informeert de cliëntenraad ten minste één keer per jaar over hetgeen zij heeft gedaan
      met de inbreng van de cliëntenraad in het overleg of de overleggen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0042294/2025-07-05#Artikel11
  - number: '12'
    text: |-
      1 De cliëntenraad van een instelling die een rechtspersoon is als bedoeld in
      [artikel 3 van Boek 2 van het Burgerlijk Wetboek][ref1], kan een verzoek in het kader van het recht van enquête,
      bedoeld in [afdeling 2 van titel 8 van Boek 2 van het Burgerlijk Wetboek][ref2], indienen bij de ondernemingskamer
      van het gerechtshof Amsterdam.

      2 De [artikelen 345][ref3] en [348 tot en met 359 van Boek 2 van het Burgerlijk Wetboek][ref4] zijn van
      overeenkomstige toepassing.

      3 De cliëntenraad die een verzoek als bedoeld in het eerste lid heeft gedaan, kan niet worden veroordeeld in de
      proceskosten voor de behandeling van dat verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Afdeling2
