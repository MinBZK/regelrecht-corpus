  - number: '13'
    text: |-
      1 Behalve in het geval, bedoeld in [artikel 4, eerste of vierde lid][ref1], kan de instelling een cliëntenraad
      slechts ontbinden indien deze structureel tekortschiet in de behartiging van de gemeenschappelijke belangen van de
      cliënten wier belangen hij dient te behartigen.

      2 Het voornemen om een cliëntenraad te ontbinden behoeft de instemming van die cliëntenraad.

      3 De instelling legt het voornemen om de cliëntenraad te ontbinden schriftelijk onder vermelding van de redenen
      daarvoor aan de cliëntenraad voor op een zodanig tijdstip dat deze raad redelijkerwijs genoeg tijd heeft om zich
      een goed oordeel ter zake te vormen.

      4 [Artikel 8, vierde en vijfde lid][ref2], zijn van toepassing op een schriftelijk verzoek tot ontbinding van de
      cliëntenraad.

      5 Indien de cliëntenraad zijn instemming aan het voornemen tot ontbinding onthoudt dan wel zich niet houdt aan de
      verplichting, bedoeld in [artikel 8, vierde lid][ref3], kan de commissie van vertrouwenslieden op verzoek van de
      instelling toestemming tot ontbinding van de cliëntenraad verlenen.

      6 Indien een representatief te achten delegatie van cliënten of hun vertegenwoordigers van mening is dat de
      cliëntenraad ontbonden dient te worden en de instelling en de cliëntenraad weigeren daaraan hun medewerking te
      verlenen, kan de commissie van vertrouwenslieden op verzoek van deze delegatie uitspreken dat de instelling de
      cliëntenraad dient te ontbinden.

      7 De commissie van vertrouwenslieden geeft de toestemming, bedoeld in het vijfde en zesde lid, slechts indien
      sprake is van de situatie, bedoeld in het eerste lid, en er redelijkerwijs geen andere oplossing is dan ontbinding
      van de cliëntenraad.


      [ref1]: https://wetten.overheid.nl/BWBR0042294#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0042294#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0042294#Artikel8
