preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo, Wij in overweging genomen hebben, dat het wenselijk is de medezeggenschap van cliënten in zorginstellingen te
    versterken en daartoe een nieuwe Wet medezeggenschap cliënten zorginstellingen vast te stellen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0042294/2025-07-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *cliënt:* een natuurlijke persoon ten behoeve van wie een instelling werkzaam is;
        - *commissie van vertrouwenslieden:* een commissie als bedoeld in [artikel 14][ref1];
        - *instelling:* een instelling als bedoeld in
      [artikel 1, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref2];
        - *medezeggenschapsregeling:* een regeling als bedoeld in [artikel 3][ref3];
        - *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;
        - *zorg:* zorg als bedoeld bij of krachtens de [Wet kwaliteit, klachten en geschillen zorg][ref4].

      2 Bij algemene maatregel van bestuur wordt bepaald op welke vormen van zorg of categorieën van instellingen, gezien
      de wijze waarop de zorg wordt verleend, het doel van de zorg of de relatie tussen de cliënt en de instelling, deze
      wet niet van toepassing is.


