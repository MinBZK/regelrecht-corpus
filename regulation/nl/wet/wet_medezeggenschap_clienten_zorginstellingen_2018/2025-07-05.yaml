  - number: '24'
    text: |-
      De [Wet medezeggenschap cliënten zorginstellingen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007920
    url: https://wetten.overheid.nl/BWBR0042294/2025-07-05#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007920
  - number: '25'
    text: |-
      1 De voor het tijdstip van inwerkingtreding van deze wet aangevangen procedures inzake de naleving van de
      [Wet medezeggenschap cliënten zorginstellingen][ref1] zoals die wet luidde tot het tijdstip van inwerkingtreding
      van deze wet, worden afgewikkeld overeenkomstig [artikel 10 van die wet][ref2].

      2 Een instelling die betrokken is bij een procedure als bedoeld in het eerste lid en op grond van deze wet niet
      verplicht is tot het instellen of aanwijzen van een commissie van vertrouwenslieden, houdt een op grond van
      [artikel 10 van de Wet medezeggenschap cliënten zorginstellingen][ref3] ingestelde commissie of aanwijzing in
      stand zolang dat nodig is voor de toepassing van het eerste lid.

      3 Een cliëntenraad die op grond van [artikel 2 van de Wet medezeggenschap cliënten zorginstellingen][ref4] is
      ingesteld voor of op de dag, voorafgaand aan het tijdstip van inwerkingtreding van deze wet, wordt aangemerkt als
      een cliëntenraad die is ingesteld op grond van [artikel 3, eerste lid][ref5].

      4 Een instelling als bedoeld in [artikel 3, eerste lid][ref6], of [artikel 4, tweede lid][ref7], die op grond van
      [artikel 2 van de Wet medezeggenschap cliënten zorginstellingen][ref8] reeds een medezeggenschapsregeling heeft
      vastgesteld, stelt binnen zes maanden na het tijdstip van inwerkingtreding van deze wet een medezeggenschapsregeling
      vast die voldoet aan de in deze wet gestelde eisen. Tot het tijdstip waarop een zodanige regeling is vastgesteld,
      doch ten hoogste totdat de in de eerste volzin bedoelde zes maanden zijn verstreken, wordt een regeling die is
      vastgesteld op grond van [artikel 2 van de Wet medezeggenschap cliënten zorginstellingen][ref9] aangemerkt als een
      medezeggenschapsregeling die voldoet aan de eisen van artikel 3.


