    text: |-
      Het bepaalde bij of krachtens de [artikelen 3][ref1], [4][ref2], [5][ref3], [6][ref4] en [7][ref5], waarbij aan
      ondernemers verplichtingen worden opgelegd, is mede bindend voor andere natuurlijke en rechtspersonen, voor zover
      deze handelingen verrichten die bedrijfsmatig in ondernemingen waarvoor het productschap is ingesteld, plegen te
      worden verricht.


