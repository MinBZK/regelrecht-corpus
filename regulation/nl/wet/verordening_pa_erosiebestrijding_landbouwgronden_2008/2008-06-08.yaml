  - number: '2'
    text: |-
      1 Deze verordening is van toepassing op landbouwgronden voorzover deze geheel of gedeeltelijk zijn gelegen in de
      navolgende gemeenten:

      Eijsden, Maastricht, Meerssen, Stein, Geleen, Beek, Schinnen, Nuth, Voerendaal, Simpelveld, Vaals, Gulpen-Wittem,
      Margraten, Valkenburg a/d/ Geul, Sittard, Onderbanken, Brunssum, Landgraaf, Heerlen, Kerkrade.

      2 Deze verordening is niet van toepassing op de in het eerste lid bedoelde landbouwgronden, voor zover deze zijn
      gelegen:

        - in het watervoerend en waterbergend winterbed in het Maasdal;
        - in de inundatiegebieden van de rivier de Geul;
        - ten noorden van de wegen Sittard – Wehr en Sittard – Urmond.
    url: https://wetten.overheid.nl/BWBR0023995/2008-06-08#Artikel2
  - number: '3'
    text: |-
      1 De ondernemer is verplicht:

      a. met betrekking tot elk perceel landbouwgrond, dat hij in gebruik heeft en dat zichtbaar is aangetast door
      meer dan normale bodemerosie, onverwijld hiervan melding te doen aan de secretaris onder opgave van een zo exact
      mogelijke plaatsaanduiding met situatieschets;

      b. te gedogen dat door de secretaris namens het bestuur aangewezen personen de bij hem in gebruik zijnde
      landbouwgronden aan een onderzoek onderwerpen naar het voorkomen van, dan wel de gevoeligheid voor bodemerosie;

      c. alle door de onder b bedoelde personen gewenste gegevens te verstrekken voor zover deze redelijkerwijs relevant
      geacht moeten worden voor het onder b bedoelde onderzoek;

      d. om aan te geven welke van de in lid 2 genoemde maatregelen het meest geschikt is om de erosie adequaat te
      bestrijden.

      2 De secretaris is, namens het bestuur, bevoegd om in het belang van de bestrijding van bodemerosie de volgende
      landbouwkundige maatregelen, dan wel combinaties daarvan, voor te schrijven:

      a. toepassen van een bodembedekker die in het voorjaar, onmiddellijk na het inzaaien van het hoofdgewas mag worden
      vervangen door een strodek;

      b. het blijvend omzetten van landbouwgrond in grasland en het handhaven van grasland;

      c. herinzaai van grasland in het najaar;

      d. minimaliseren van grondbewerking;

      e. grondbewerking na de oogst;

      f. Voorkomen en opheffen van spoorvorming;

      g. bodemstructuur verbeterende maatregelen;

      h. draineren;

      i. verbreken van storende lagen;

      j. grondbewerking volgens de hoogtelijnen;

      k. beperken van de lengte van percelen gerekend loodrecht van de hoogtelijn hellingafwaarts;

      l. strokenbouw;

      m. begreppeling.
    url: https://wetten.overheid.nl/BWBR0023995/2008-06-08#Artikel3
  - number: '4'
    text: |-
      De ondernemer die landbouwgrond in gebruik heeft, is verplicht:

      a. na elke oogst een op het voorkomen van bodemerosie gerichte grondbewerking uit te voeren met een minimale diepte
      van 20 centimeter, behoudens bij de toepassing van grasondergroei en bij de aanwezigheid van meerjarige teelten;

      b. de onder a. bedoelde grondbewerking dient zo spoedig mogelijk na de oogst te worden uitgevoerd, doch vóór
      1 oktober na de oogst van granen en vóór 1 december na de oogst van de overige gewassen;

      c. bij het inzaaien van bieten of maïs de sporen van de trekkerwielen te wissen, tenzij de directzaaimethode wordt
      toegepast;

      d. na de teelt van maïs en granen een groenbemester toe te passen, tenzij het korrelmaïs, ccm of mks betreft,
      dan wel bij de oogst van granen alle stro op het land achterblijft, waarbij de verplichting zoals opgenomen in
      onderdeel a niet mag leiden tot een verwijdering van de gewasresten;

      e. bij de teelt van een erosiebevorderend gewas aan de onderzijde van het gewasperceel een waterremmende
      voorziening te realiseren, tenminste in de vorm van een berm, graft, heg, houtwal, sloot, schot, bloemrijke
      akkerrand of niet-erosiebevorderend gewas met een minimale breedte van 3 meter.
    url: https://wetten.overheid.nl/BWBR0023995/2008-06-08#Artikel4
  - number: '5'
    text: |-
      1 Het is een ondernemer verboden landbouwgronden met een hellingspercentage van 2% of méér, met een
      erosiebevorderend gewas te betelen.

      2 Het in het eerste lid bedoelde verbod geldt niet voor gewaspercelen met een hellingspercentage van 2 tot 5%
      indien:

      a. de erosiebevorderende gewassen over geen grotere aaneengesloten lengte dan 400 meter worden geteeld en

      b. toepassing wordt gegeven aan de directzaaimethode, mulchmethode of een strodek.

      3 Het in het eerste lid bedoelde verbod geldt niet voor gewaspercelen met een gemiddeld hellingspercentage van 5
      tot 18% indien:

      a. de erosiebevorderende gewassen over geen grotere aaneengesloten lengte dan 300 meter worden geteeld en

      b. toepassing wordt gegeven aan de directzaaimethode, mulchmethode of een strodek.

      4 Indien bij het bereiken van het lengtecriterium voor de teelt van een erosiebevorderend gewas, zoals vermeld in
      onderdeel a van de leden 2 en 3, afwisseling plaatsvindt met een niet-erosiebevorderend gewas, dient op de eerste
      plaats dit niet-erosiebevorderende gewas over de volle breedte te grenzen aan het erosiebevorderende gewas en dient
      op de tweede plaats de lengte van het niet-erosiebevorderende gewas tenminste 100 meter te bedragen, alvorens een
      volgend erosiebevorderend gewas wordt geteeld.

      5 Het is een ondernemer verboden landbouwgrond met een hellingspercentage van 18% of méér anders te exploiteren dan
      als grasland.
    url: https://wetten.overheid.nl/BWBR0023995/2008-06-08#Artikel5
  - number: '6'
    text: |-
      1 De ondernemer die landbouwgronden in gebruik heeft, niet zijnde grasland, en die gelegen zijn in een
      knelpuntgebied, kan een bedrijfserosieplan laten goedkeuren en dient hieraan uitvoering te geven.

      2 De ondernemer die landbouwgronden in gebruik heeft als grasland en die gelegen zijn in een knelpuntgebied, is
      verplicht een bedrijfserosieplan te laten goedkeuren en hieraan uitvoering te geven, indien hij voornemens is de
      landbouwgronden anders te exploiteren dan als grasland.

      3 Voor de ondernemer die beschikt over een goedgekeurd bedrijfserosieplan is het in de
      [artikelen 4 tot en met 5][ref1] bepaalde niet van toepassing, met uitzondering van:

      a. het bepaalde in [artikel 4, onderdelen a tot en met c][ref2] en

      b. [artikel 5, vijfde lid][ref3] en

      c. de verplichting om bij een hellingspercentage van 12 tot 18% toepassing te geven aan de directzaaimethode,
      mulchmethode of een strodek.

      4 De voorzitter kan, namens het bestuur, bij besluit nadere regelen stellen aan het bedrijfserosieplan.

      5 De ondernemer die voornemens is een bedrijfserosieplan in te dienen, dient een retributie te voldoen van € 114,–.

      6 De secretaris beslist namens het bestuur over de goedkeuring van het bedrijfserosieplan.


