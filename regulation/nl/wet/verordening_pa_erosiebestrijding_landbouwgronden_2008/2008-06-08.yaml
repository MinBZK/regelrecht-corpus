  - number: '7'
    text: |-
      1 De ondernemer die voornemens is om landbouwgronden, in gebruik als grasland en gelegen in een gebied als bedoeld
      in [artikel 6][ref1], te scheuren met het doel die gronden weer in te zaaien als grasland (graslandvernieuwing) of
      met het doel elders binnen het bedrijf een zelfde areaal landbouwgrond om te zetten in grasland (wisselteelt) meldt
      dit voornemen tenminste vier weken voorafgaand aan het scheuren aan de Limburgse Land- en Tuinbouwbond.

      2 [Artikel 6, tweede lid][ref2], is niet van toepassing.


