preamble:
  text: |-
    Gelet op de artikelen 93, 95, 104, eerste en derde lid, en 126, tweede lid, van de Wet op de bedrijfsorganisatie en
    op de artikelen 8, 17 en 18 van het Instellingsbesluit akkerbouwproductschappen;

    Gehoord de Commissie Teeltaangelegenheden ;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0023995/2008-06-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze verordening verstaat onder:










                  a.


                  productschap


                  :


                  Productschap Akkerbouw;




                  b.


                  bestuur


                  :


                  bestuur van het productschap;




                  c.


                  dagelijks bestuur


                  :


                  dagelijks bestuur van het productschap;




                  d.


                  voorzitter


                  :


                  voorzitter van het productschap;




                  e.


                  secretaris


                  :


                  secretaris van het productschap;




                  f.


                  commissie


                  :


                  Commissie Teeltaangelegenheden;




                  g.


                  onderneming


                  :


                  onderneming waarvoor het productschap is ingesteld;




                  h.


                  ondernemer


                  :


                  de natuurlijke of rechtspersoon die een onderneming drijft;




                  i.


                  landbouwgrond


                  :


                  grond waarop akkerbouw wordt beoefend inclusief tijdelijk braakliggende landbouwgronden;




                  j.


                  bodemerosie


                  :


                  de versnelde afvoer van bodemmateriaal door oppervlakkig afstromend water met als gevolg sedimentatie
      van het geërodeerde materiaal op lager gelegen terreinen;




                  k.


                  normale bodemerosie


                  :


                  bodemerosie waarbij geen geulerosie plaatsvindt dieper dan 30 centimeter;




                  l.


                  erosiebevorderend gewas


                  :


                  maïs, aardappelen, bieten, cichorei;




                  m.


                  directzaaimethode


                  :


                  een gewas dat direct na de oogst van een hoofdgewas wordt ingezaaid en waarvan de gewasresten gedurende
      de opkomst van het nieuwe hoofdgewas blijven gehandhaafd,




                  n.


                  strodek


                  :


                  laag stro die wordt aangebracht op de landbouwgrond en gedurende de opkomst van het hoofdgewas wordt
      gehandhaafd, dan wel slechts oppervlakkig wordt ondergewerkt;




                  o.


                  perceel


                  :


                  een oppervlakte grond, in eigendom of in gebruik bij een onderneming, waarop één soort gewas geteeld
      wordt;




                  p.


                  gewasperceel


                  :


                  een perceel grond, in gebruik bij één bedrijf, waarop één hoofdgewas aanwezig is en waarvan de
      buitengrenzen zijn bepaald door duidelijk waarneembare kavelgrenzen zoals wegen, graften, heggen, houtwallen,
      sloten, dan wel doordat op het aangrenzende perceel (mits bij dezelfde ondernemer in gebruik) andere dan wel geen
      gewassen aanwezig zijn;




                  q.


                  lengte van een gewasperceel


                  :


                  die zijde van het gewasperceel, die het minst parallel loopt met de hoofdinrichting van de
      hoogtelijnen;




                  r.


                  breedte van een gewasperceel


                  :


                  die zijde van het gewasperceel, die het meest parallel loopt met de hoofdinrichting van de
      hoogtelijnen;




                  s.


                  hellingspercentage


                  :


                  het quotiënt van het hoogteverschil en de horizontale afstand, uitgedrukt in procenten, volgens de in
      de [bijlage 1][ref1] aangegeven meetmethode;




                  t.


                  knelpuntgebieden


                  :


                  de gebieden, gelegen in een stroomgebied en als zodanig aangeduid op de kaart, die als bijlage 2 bij
      deze verordening gaat, waar belangrijke wateroverlast kan optreden




                  u.


                  mulchmethode


                  :


                  een gewas dat direct na de oogst van een hoofdgewas wordt ingezaaid en waarvan de gewasresten vooraf
      aan het inzaaien van het nieuwe hoofdgewas oppervlakkig worden ingewerkt;




                  v.


                  groenbemester


                  :


                  een gewas dat direct na de oogst van een hoofdgewas wordt ingezaaid en waarvan de gewasresten vooraf
      aan het inzaaien van het nieuwe hoofdgewas worden weggewerkt, gevolgd door een traditionele zaaibedbereiding;




                  w.


                  grasondergroei


                  :


                  teeltsysteem waarbij gras wordt ingezaaid tijdens de teelt van een hoofdgewas, leidend tot een grasmat
      die na de oogst van het hoofdgewas in stand wordt gehouden;




                  x.


                  bedrijfserosieplan


                  :


                  een plan van aanpak voor de erosiebestrijding op bedrijfsniveau.


      [ref1]: https://wetten.overheid.nl/BWBR0023995
    url: https://wetten.overheid.nl/BWBR0023995/2008-06-08#Artikel1
