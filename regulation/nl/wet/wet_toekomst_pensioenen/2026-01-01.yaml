preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is om het pensioenstelsel te herzien, over te gaan tot
    standaardisering van het nabestaandenpensioen en de fiscale behandeling van pensioen te wijzigen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0048328/2026-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Onderdelen A t/m W:

      Onderdeel X:

      Het in artikel II, onderdeel E, onderdeel 2, onder b, genoemde bedrag en het in onderdeel Ea, eerstgenoemde bedrag
      worden vóór toepassing van die onderdelen vervangen door andere bedragen. Deze bedragen worden berekend door de te
      vervangen bedragen te vermenigvuldigen met de ingevolge [artikel 10.1 van de Wet inkomstenbelasting 2001][ref1]
      aan het begin van het kalenderjaar 2023 toegepaste inflatiecorrectie op die bedragen, genoemd in
      [artikel 3.127, tweede en derde lid, van die wet][ref2].

      Onderdeel Y:

      Het in artikel II, onderdeel Ea, als tweede genoemde bedrag wordt vóór toepassing van dat
      onderdeel vervangen door een ander bedrag. Dit bedrag wordt berekend door de aan het begin van
      het kalenderjaar 2023 geldende uitkeringen voor gehuwde personen zonder toeslag als omschreven in
      [artikel 9, eerste lid, onderdeel b, en vijfde lid, van de Algemene Ouderdomswet][ref3], vermeerderd met de
      vakantietoeslag, te vermenigvuldigen met de factor 100/75.


