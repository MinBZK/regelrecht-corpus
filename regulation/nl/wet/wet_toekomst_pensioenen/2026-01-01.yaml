  - number: III
    text: |-
      Onderdelen A t/m V:

      Onderdeel W:

      Het in artikel III, onderdeel B, in [artikel 18a, derde lid][ref1], genoemde bedrag wordt vóór toepassing
      van dat onderdeel vervangen door een ander bedrag. Dit bedrag wordt berekend door de aan het begin
      van het kalenderjaar 2023 geldende uitkeringen voor gehuwde personen zonder toeslag als omschreven in
      [artikel 9, eerste lid, onderdeel b, en vijfde lid, van de Algemene Ouderdomswet][ref2], vermeerderd met de
      vakantietoeslag, te vermenigvuldigen met de factor 100/75.

      Onderdeel X:

      Het in artikel III, onderdeel E, in [artikel 18d, tweede lid][ref3], genoemde bedrag wordt vóór toepassing van
      dat onderdeel vervangen door een ander bedrag. Dit bedrag wordt gesteld op het aan het begin van het kalenderjaar
      2023 geldende bedrag dat na aftrek van de in te houden loonbelasting en premie voor de volksverzekeringen,
      rekening houdend met de algemene heffingskorting voor een persoon die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref4], nog niet heeft bereikt, gelijk is aan het netto-
      ouderdomspensioen per maand, bedoeld in [artikel 9, vijfde lid, onderdeel a, van die wet,][ref5] waarbij de nodig
      geachte afronding wordt aangebracht.


