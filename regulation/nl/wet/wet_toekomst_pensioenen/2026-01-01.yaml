  - number: XIIIa
    text: |-
      Ingeval de samenloop van wetten die in 2022 of 2023 in het Staatsblad zijn of worden gepubliceerd en wijzigingen
      aanbrengen in een of meer belastingwetten, niet of niet juist is geregeld, of indien als gevolg van die samenloop
      onjuistheden ontstaan in de aanduiding van artikelen, artikelonderdelen, verwijzingen en dergelijke in de
      desbetreffende wetten, kunnen die wetten op dit punt bij ministeriële regeling worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0048328/2026-01-01#ArtikelXIIIa
  - number: XIIIb
    text: |-
      Onze Minister voor Armoedebeleid, Participatie en Pensioenen draagt er zorg voor dat per 1 januari
      2028 het aantal werknemers dat geen deelnemer als bedoeld in [artikel 1 van de Pensioenwet][ref1] of
      [artikel 1, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2] is, met vijftig procent is
      gereduceerd ten opzichte van het aantal in 2019.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0048328/2026-01-01#ArtikelXIIIb
