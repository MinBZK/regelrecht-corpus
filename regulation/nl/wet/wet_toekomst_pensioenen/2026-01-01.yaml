  - number: XIV
    text: |-
      1 Onze Minister voor Armoedebeleid, Participatie en Pensioenen zendt aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk:

      a. binnen vijf jaar na inwerkingtreding van deze wet, voor zover het betreft de voorschriften
      tijdens de transitieperiode, bedoeld in [hoofdstuk 6b van de Pensioenwet][ref1] en
      [hoofdstuk 5a van de Wet verplichte beroepspensioenregeling][ref2] en de geschilleninstantie, bedoeld in
      [artikel 48c van de Pensioenwet][ref3] en [artikel 59c van de Wet verplichte beroepspensioenregeling][ref4];

      b. binnen vier jaar na het einde van de transitieperiode, waarbij in het bijzonder aandacht zal worden besteed aan
      het kader voor de pensioenovereenkomsten, de wijzigingen ten aanzien van het nabestaandenpensioen en het fiscale
      kader waaronder ook het harmoniseren van het fiscale kader van de tweede en derde pensioenpijler;

      c. in het tweede jaar volgend op het einde van de compensatieperiode, bedoeld in
      [artikel 150f, eerste lid, onderdeel b, van de Pensioenwet][ref5], voor zover het betreft
      het overgangsrecht voor de progressieve premie in [artikel 220e van de Pensioenwet][ref6] en
      [artikel 214e van de Wet verplichte beroepspensioenregeling][ref7]; en

      d. voor zover het de zorgplicht, bedoeld in [artikel XIIIB van deze wet][ref8], betreft op de volgende data:

      1°. 1 oktober 2023;

      2°. 1 oktober 2025;

      3°. 1 oktober 2027; en

      4°. 1 oktober 2028,

      waarbij tevens telkens een door het CBS, als bedoeld in
      [artikel 1, onderdeel b, van de Wet op het Centraal bureau voor de statistiek][ref9],
      aan het einde van het voorgaande kalenderjaar vastgestelde omvang van het aantal
      werknemers dat geen deelnemer is als bedoeld in [artikel 1 van de Pensioenwet][ref10] of
      [artikel 1, eerste lid, van de Wet verplichte beroepspensioenregeling][ref11], wordt meegezonden.

      2 Onze Minister voor Armoedebeleid, Participatie en Pensioenen monitort en zendt aan de Staten-
      Generaal tijdens de transitieperiode, bedoeld in [hoofdstuk 6b van de Pensioenwet][ref12] en
      [hoofdstuk 5a van de Wet verplichte beroepspensioenregeling][ref13], tenminste jaarlijks ten aanzien van
      onderdeel a en ten minste periodiek ten aanzien van onderdeel b, een verslag over de volgende punten met als doel
      tijdig knelpunten met betrekking tot de voortgang van de transitie te kunnen identificeren en voor zover nodig
      aanvullende maatregelen te kunnen nemen:

      a. het transitiebeeld op hoofdlijnen:

      1°. de voortgang van de besluitvorming en implementatie, waaronder de voortgang van de
      interne collectieve waardeoverdracht, bedoeld in [artikel 150m van de Pensioenwet][ref14] en
      [artikel 145l van de Wet verplichte beroepspensioenregeling][ref15];

      2°. de transitiekeuzes die zijn gemaakt, waaronder de premiehoogte, de stabiliteit van de uitkering, de hoogte van
      de premie voor en dekking van het nabestaandenpensioen en de compensatieregeling; en

      3°. de ervaringen met de transitie en het nieuwe stelsel van belanghebbenden bij de pensioenregeling, werkgevers,
      de partijen die de wijziging van de pensioenregeling overeenkomen of zijn overeengekomen, toezichthouders en
      pensioenuitvoerders; en

      b. de doelstellingen:

      1°. eerder perspectief op een koopkrachtig pensioen;

      2°. het pensioen wordt transparanter en persoonlijker; en

      3°. het pensioenstelsel sluit beter aan bij de ontwikkelingen in de maatschappij en op de arbeidsmarkt.


