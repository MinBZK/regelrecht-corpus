$id: absintwet_1909
regulatory_layer: WET
publication_date: '2005-05-10'
valid_from: '2000-02-01'
bwb_id: BWBR0001877
url: https://wetten.overheid.nl/BWBR0001877/2000-02-01
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is, bepalingen betreffende absint vast te stellen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001877/2000-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het is verboden absint in te voeren, te vervoeren, te vervaardigen, te verkoopen, af te leveren of ten verkoop of
      ter aflevering voorhanden te hebben.
    url: https://wetten.overheid.nl/BWBR0001877/2000-02-01#Artikel1
  - number: '2'
    text: De doorvoer van absint is geoorloofd onder de voorwaarden, bij algemeenen maatregel van bestuur vast te stellen.
    url: https://wetten.overheid.nl/BWBR0001877/2000-02-01#Artikel2
  - number: 2a
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van het
      Staatstoezicht op de volksgezondheid.

      2 De in het eerste lid bedoelde ambtenaren beschikken niet over de bevoegdheden, genoemd in de
      [artikelen 5:18][ref1] en [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel519
    url: https://wetten.overheid.nl/BWBR0001877/2000-02-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:18
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:19
  - number: '3'
    text: |-
      Met het opsporen van de overtredingen van deze wet zijn, behalve de bij
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen personen, belast de ambtenaren van het
      Staatstoezicht op de Volksgezondheid en die van de rijksbelastingdienst, bevoegd inzake douane.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0001877/2000-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '4'
    text: |-
      1 De opsporingsambtenaren zijn te allen tijde bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. Zij
      kunnen daartoe hun uitlevering vorderen.

      2 Zij hebben, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is toegang:

      a. tot de vervoermiddelen met inbegrip van woongedeelten, waarvan hun bekend is of redelijkerwijze door hen kan
      worden vermoed, dat daarmede absint wordt ingevoerd of vervoerd;

      b. tot de plaatsen, waar een overtreding van deze wet gepleegd wordt, of waar redelijkerwijze vermoed kan worden,
      dat zoodanige overtreding gepleegd wordt.
    url: https://wetten.overheid.nl/BWBR0001877/2000-02-01#Artikel4
  - number: '5'
    text: |-
      Overtreding van [artikel 1][ref1] van deze wet wordt gestraft met hechtenis van ten hoogste drie maanden of
      geldboete van de tweede categorie.

      2 Indien tijdens het plegen van het feit nog geen twee jaren zijn verloopen sedert een vroegere veroordeeling
      van den schuldige wegens overtreding van genoemd artikel onherroepelijk is geworden of de opgelegde geldboete is
      betaald, wordt de overtreding, onverminderd de verbeurdverklaring van het absint, gestraft met hechtenis van ten
      hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001877#Artikel1
    url: https://wetten.overheid.nl/BWBR0001877/2000-02-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001877
        artikel: '1'
  - number: '6'
    text: De bij deze wet strafbaar gestelde feiten worden beschouwd als misdrijven.
    url: https://wetten.overheid.nl/BWBR0001877/2000-02-01#Artikel6
  - number: '7'
    text: |-
      Deze wet kan worden aangehaald onder den titel "Absintwet", doch met bijvoeging van het jaar en het nummer van het
      *Staatsblad*, waarin de wet is geplaatst.
    url: https://wetten.overheid.nl/BWBR0001877/2000-02-01#Artikel7
  - number: '8'
    text: Deze wet treedt in werking op een nader door Ons te bepalen dag.
    url: https://wetten.overheid.nl/BWBR0001877/2000-02-01#Artikel8
