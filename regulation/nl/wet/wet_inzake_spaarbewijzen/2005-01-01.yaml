$id: wet_inzake_spaarbewijzen
regulatory_layer: WET
publication_date: '2004-07-06'
valid_from: '2005-01-01'
bwb_id: BWBR0003797
url: https://wetten.overheid.nl/BWBR0003797/2005-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te geven met betrekking tot de uitgifte, de
    verhandeling en de uitbetaling van niet op naam gestelde spaarbewijzen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003797/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      a. spaarbewijzen: waardepapieren aan toonder, welke een nominale vordering op de uitgevende instelling inhouden en
      waarbij de rente niet gedurende de looptijd opeisbaar wordt;

      b. Onze Minister: Onze Minister van Financiën;

      c. de Bank: De Nederlandsche Bank N.V.;

      d. representatieve organisatie: een organisatie, die met betrekking tot de uitvoering van deze wet door Onze
      Minister, de Bank gehoord, als representatieve organisatie voor een groep van ondernemingen en instellingen is
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0003797/2005-01-01#Artikel1
  - number: '2'
    text: |-
      1 Indien de Bank met de representatieve organisaties overeenstemming bereikt over de invoering van een regeling
      omtrent de uitgifte, de verhandeling en de uitbetaling tegen inlevering van spaarbewijzen, kunnen Wij deze regeling
      algemeen verbindend verklaren ten aanzien van de ondernemingen en instellingen, die spaarbewijzen uitgeven.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de wijze van uitvoeren
      van een algemeen verbindend verklaarde regeling.

      3 Een algemene maatregel van bestuur als bedoeld in het tweede lid treedt niet eerder in werking dan een maand na
      de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling
      gedaan aan de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003797/2005-01-01#Artikel2
  - number: '3'
    text: |-
      1 Voor de duur dat een regeling als bedoeld in [artikel 2][ref1] van kracht is, geldt het in de volgende leden
      bepaalde.

      2 Overdracht en aanvaarding van spaarbewijzen is verboden tenzij door tussenkomst van een lid van de Vereniging
      voor de Effectenhandel dan wel de onderneming of instelling die de spaarbewijzen heeft uitgegeven.

      3 Het in het tweede lid bepaalde is niet van toepassing op overdracht en aanvaarding van spaarbewijzen indien
      de overdracht en aanvaarding geschieden door natuurlijke personen anders dan in de uitoefening van hun beroep of
      bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0003797#Artikel2
    url: https://wetten.overheid.nl/BWBR0003797/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003797
        artikel: '2'
  - number: 3a
    text: |-
      De onderneming of instelling die bedrijfsmatig een spaarbewijs uitgeeft of een uitbetaling doet tegen inlevering
      van een spaarbewijs onderscheidenlijk degene die tussenkomst verleent bij de overdracht en aanvaarding van een
      spaarbewijs, stelt bij deze handeling de identiteit van de tegenpartij onderscheidenlijk van degene die het
      spaarbewijs overdraagt en van degene die het spaarbewijs aanvaardt, vast aan de hand van een document als bedoeld
      in [artikel 1 van de Wet op de identificatieplicht][ref1] en neemt de aard en het nummer daarvan alsmede een
      duidelijke omschrijving van het aantal, de soort en de onderscheiden nummers van de betrokken spaarbewijzen op in
      de administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0003797/2005-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '4'
    text: |-
      Handelen in strijd met een op grond van [artikel 2][ref1] algemeen verbindend verklaarde regeling of de krachtens
      [artikel 2, tweede lid][ref2], gegeven nadere regels is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0003797#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003797#Artikel2
    url: https://wetten.overheid.nl/BWBR0003797/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003797
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003797
        artikel: '2'
  - number: '6'
    text: |-
      Deze wet is niet van toepassing op:

      a. waardepapieren, uitgegeven door publiekrechtelijke lichamen;

      b. waardepapieren die zijn uitgegeven op een tijdstip, waarop een regeling als bedoeld in [artikel 2][ref1] niet
      van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0003797#Artikel2
    url: https://wetten.overheid.nl/BWBR0003797/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003797
        artikel: '2'
  - number: '7'
    text: |-
      1 Deze wet kan worden aangehaald als: Wet inzake spaarbewijzen.

      2 Zij treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0003797/2005-01-01#Artikel7
