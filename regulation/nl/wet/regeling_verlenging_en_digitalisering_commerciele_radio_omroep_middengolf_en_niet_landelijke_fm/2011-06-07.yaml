  - number: '8'
    text: |-
      1 Indien de aanvraag, bedoeld in [artikel 2, eerste lid][ref1], wordt toegewezen, wijst de minister gelijktijdig de
      aanvraag voor een vergunning voor digitale radio-omroep toe.

      2 De minister kan een vergunning voor digitale radio-omroep verlenen die minder dan een achttiende deel maar ten
      minste 1/21 deel van de capaciteit van een allotment betreft indien het aantal aanvragen om vergunningen voor
      digitale radio-omroep voor die allotment dat op grond van deze regeling is gedaan of dat in het kader van een
      toekomstige verleningsprocedure kan worden gedaan, hiertoe naar het oordeel van de minister aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel2
