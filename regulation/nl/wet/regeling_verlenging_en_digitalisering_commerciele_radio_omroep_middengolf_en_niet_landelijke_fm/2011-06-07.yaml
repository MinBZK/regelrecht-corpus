  - number: '7'
    text: |-
      1 Een aanvraag van een houder van een FM- of een middengolfvergunning, uitgezonderd een houder van een
      middengolfvergunning als bedoeld in [artikel 2, achtste lid][ref1], voor een vergunning voor digitale radio-omroep
      met betrekking tot de in [artikel 6, eerste en tweede lid][ref2], bedoelde frequentiecapaciteit wordt ingediend bij
      de minister.

      2 Indien de in [artikel 2, eerste lid][ref3], bedoelde aanvraag om verlenging betrekking heeft op verscheidene
      FM- of middengolfvergunningen, heeft de aanvraag, bedoeld in het eerste lid, betrekking op even veel vergunningen
      voor digitale radio-omroep als het aantal te verlengen FM- of middengolfvergunningen waarbij is gekozen voor de
      in artikel 2, zesde lid, onder a, vermelde optie, met dien verstande dat per allotment slechts een vergunning voor
      digitale radio-omroep wordt aangevraagd.

      3 [Artikel 2, tweede tot en met vijfde lid][ref4], is van overeenkomstige toepassing.

      4 [Artikel 4][ref5] is van overeenkomstige toepassing met dien verstande dat ook in het geval dat bij de aanvraag
      voor een vergunning voor digitale radio-omroep niet is voldaan aan [artikel 2, tweede lid][ref6], de aanvrager in
      de gelegenheid wordt gesteld het verzuim te herstellen overeenkomstig artikel 4.


