  - number: '6'
    text: |-
      1 Voor een houder van een FM- of een middengolfvergunning, uitgezonderd een houder van een middengolfvergunning
      als bedoeld in [artikel 2, achtste lid][ref1], is voor het verkrijgen van een vergunning een achttiende deel van
      de capaciteit van de allotment die overeenkomstig [bijlage 3][ref2] is gekoppeld aan de desbetreffende FM- of
      middengolfvergunning, beschikbaar voor het gelijktijdig uitzenden van de radioprogramma’s die worden uitgezonden
      met gebruikmaking van de FM-vergunning respectievelijk de middengolfvergunning, behoudens het bepaalde in
      [artikel 8, tweede lid][ref3].

      2 Indien de vergunninghouder verscheidene FM- of middengolfvergunningen heeft, is voor het verkrijgen van
      een vergunning beschikbaar voor het gelijktijdig uitzenden van de radioprogramma’s die worden uitgezonden met
      gebruikmaking van de desbetreffende FM-vergunningen respectievelijk middengolfvergunningen, behoudens het bepaalde
      in [artikel 8, tweede lid][ref4]:

      a. indien deze vergunningen op grond van [bijlage 3][ref5] zijn gekoppeld aan dezelfde allotment: een achttiende
      deel van de capaciteit van die allotment;

      b. indien deze vergunningen op grond van [bijlage 3][ref6] niet zijn gekoppeld aan dezelfde allotment: een
      achttiende deel van de capaciteit van elk van de gekoppelde allotments.

      3 Het eerste en tweede lid gelden niet langer voor zover de aanvraag, bedoeld in [artikel 2, eerste lid][ref7],
      niet wordt toegewezen of voor zover bij de toepassing van artikel 2, zesde lid, is gekozen voor de onder b van die
      bepaling vermelde optie.


