preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Onderwijs, Cultuur en Wetenschap;

    Gelet op de artikelen 9, eerste en vierde lid, 11, derde lid, en 12 van het Frequentiebesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *minister:* Minister van Economische Zaken, Landbouw en Innovatie;

      b. *commerciële radio-omroep:* radio-omroep als bedoeld in [artikel 1.1, eerste lid, van de Mediawet 2008][ref1]
      die wordt verzorgd door een commerciële media-instelling als bedoeld in artikel 1.1, eerste lid, van die wet;

      c. *kavel:* frequentie of samenstel van frequenties voor het gebruik waarvan een vergunning kan worden verleend;

      d. *FM-vergunning:* een vergunning voor commerciële radio-omroep voor één van de kavels B1
      tot en met B37 met een looptijd tot en met 31 augustus 2011 die verleend is op grond van de
      [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref2],
      de [Regeling vervolg verdeling frequenties commerciële radio-omroep 2003][ref3] of de
      [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2007][ref4];

      e. *middengolfvergunning:* een vergunning voor commerciële radio-omroep voor één van de kavels C1 tot
      en met C12, uitgezonderd kavel C8, met een looptijd tot en met 31 augustus 2011 die verleend is op grond
      van de [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref5],
      de [Regeling vervolg verdeling frequenties commerciële radio-omroep 2003][ref6] of de
      [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2007][ref7];

      f. *radioprogramma:* radioprogramma als bedoeld in [artikel 1.1, eerste lid, van de Mediawet 2008][ref8];

      g. *allotment:* een geografisch afgebakend deel van een frequentieband, zijnde een van de allotments 6B, 7A, 8A,
      9D-N en 9D-Z, zoals omschreven in [bijlage 3][ref9];

      h. *vergunning voor digitale radio-omroep:* een vergunning voor het gebruik van een deel van de capaciteit van een
      allotment, zoals nader bepaald in [artikel 6][ref10];

      i. *doorgifte-overeenkomst:* een schriftelijke overeenkomst, gesloten tussen een houder van een FM-vergunning
      of een middengolfvergunning en een houder van een vergunning voor digitale omroep die betrekking heeft op
      de frequentieband 219,496–221,208 MHz of op de in de tabel behorende bij nationale voetnoot 002 van het
      Nationaal Frequentieplan 2005 bedoelde frequentiebanden, voor de gelijktijdige en ongewijzigde doorgifte door
      de houder van de vergunning voor digitale omroep van radioprogramma’s van de houder van de FM-vergunning of de
      middengolfvergunning.


