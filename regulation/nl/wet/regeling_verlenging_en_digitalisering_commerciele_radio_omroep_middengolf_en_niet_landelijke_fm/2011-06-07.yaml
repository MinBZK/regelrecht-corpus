  - number: '2'
    text: |-
      1 Een aanvraag om verlenging van de looptijd van een FM- of een middengolfvergunning tot en met 31 augustus 2017
      wordt ingediend bij de minister.

      2 De aanvraag wordt na inwerkingtreding van deze regeling en uiterlijk 28 juni 2011 om 14.00 uur per post ontvangen
      dan wel door middel van persoonlijke overhandiging ingediend op het volgende adres: Agentschap Telecom, Emmasingel
      1, 9726 AH Groningen.

      3 Bij persoonlijke overhandiging van de aanvraag wordt een bewijs van ontvangst afgegeven dat is voorzien van datum
      en tijdstip van ontvangst en ondertekening.

      4 De aanvrager dient slechts één aanvraag in, ook indien hij als houder van verscheidene FM- of
      middengolfvergunningen aanspraak wenst te maken op verlenging van zijn vergunningen.

      5 De aanvraag wordt ingediend met gebruikmaking van het in [bijlage 1][ref1] opgenomen model en gaat vergezeld van
      de in dit model genoemde gegevens en bescheiden.

      6 Bij de aanvraag maakt de aanvrager per te verlengen FM- of middengolfvergunning kenbaar of hij aan de in
      nationale voetnoot 004 van het Nationaal Frequentieplan 2005 bedoelde koppeling voldoet en blijft voldoen:

      a. door middel van een vergunning voor digitale radio-omroep overeenkomstig de [artikelen 6][ref2] en [7][ref3];
      of

      b. door middel van doorgifte op basis van een overeenkomst als bedoeld in [artikel 1, onder i][ref4].

      7 De aanvrager doet, uitgaand van zijn in het zesde lid bedoelde keuze, zijn aanvraag vergezeld gaan van:

      a. een aanvraag voor een vergunning voor digitale radio-omroep overeenkomstig [artikel 7][ref5];

      b. een kopie van een door hem gesloten doorgifte-overeenkomst die voldoet aan het gestelde in [bijlage 2][ref6].

      8 Het zesde en zevende lid zijn niet van toepassing op de aanvrager van verlenging van een middengolfvergunning die
      mede beschikt over een vergunning voor digitale radio-omroep binnen het frequentiebereik 219,584–221,120 MHz.


