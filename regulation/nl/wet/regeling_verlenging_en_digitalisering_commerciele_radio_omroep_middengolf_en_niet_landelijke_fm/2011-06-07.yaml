---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_verlenging_en_digitalisering_commerciele_radio_omroep_middengolf_en_niet_landelijke_fm
regulatory_layer: WET
publication_date: '2013-02-15'
valid_from: '2011-06-07'
bwb_id: BWBR0030039
url: https://wetten.overheid.nl/BWBR0030039/2011-06-07
preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Onderwijs, Cultuur en Wetenschap;

    Gelet op de artikelen 9, eerste en vierde lid, 11, derde lid, en 12 van het Frequentiebesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel1
  - number: 1.a
    text: '*minister:* Minister van Economische Zaken, Landbouw en Innovatie;'
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel1
  - number: 1.b
    text: |-
      *commerciële radio-omroep:* radio-omroep als bedoeld in [artikel 1.1, eerste lid, van de Mediawet 2008][ref1] die
      wordt verzorgd door een commerciële media-instelling als bedoeld in artikel 1.1, eerste lid, van die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: 1.c
    text: '*kavel:* frequentie of samenstel van frequenties voor het gebruik waarvan een vergunning kan worden verleend;'
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel1
  - number: 1.d
    text: |-
      *FM-vergunning:* een vergunning voor commerciële radio-omroep voor één van de kavels B1
      tot en met B37 met een looptijd tot en met 31 augustus 2011 die verleend is op grond van de
      [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref1],
      de [Regeling vervolg verdeling frequenties commerciële radio-omroep 2003][ref2] of de
      [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2007][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0014741
      [ref2]: https://wetten.overheid.nl/BWBR0015414
      [ref3]: https://wetten.overheid.nl/BWBR0022818
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014741
      - id: ref2
        bwb_id: BWBR0015414
      - id: ref3
        bwb_id: BWBR0022818
  - number: 1.e
    text: |-
      *middengolfvergunning:* een vergunning voor commerciële radio-omroep voor één van de kavels C1 tot en
      met C12, uitgezonderd kavel C8, met een looptijd tot en met 31 augustus 2011 die verleend is op grond
      van de [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref1],
      de [Regeling vervolg verdeling frequenties commerciële radio-omroep 2003][ref2] of de
      [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2007][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0014741
      [ref2]: https://wetten.overheid.nl/BWBR0015414
      [ref3]: https://wetten.overheid.nl/BWBR0022818
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014741
      - id: ref2
        bwb_id: BWBR0015414
      - id: ref3
        bwb_id: BWBR0022818
  - number: 1.f
    text: |-
      *radioprogramma:* radioprogramma als bedoeld in [artikel 1.1, eerste lid, van de Mediawet 2008][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: 1.g
    text: |-
      *allotment:* een geografisch afgebakend deel van een frequentieband, zijnde een van de allotments 6B, 7A, 8A, 9D-N
      en 9D-Z, zoals omschreven in [bijlage 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030039
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0030039
  - number: 1.h
    text: |-
      *vergunning voor digitale radio-omroep:* een vergunning voor het gebruik van een deel van de capaciteit van een
      allotment, zoals nader bepaald in [artikel 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel6
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '6'
        paragraaf: '3'
  - number: 1.i
    text: |-
      *doorgifte-overeenkomst:* een schriftelijke overeenkomst, gesloten tussen een houder van een FM-vergunning
      of een middengolfvergunning en een houder van een vergunning voor digitale omroep die betrekking heeft op
      de frequentieband 219,496–221,208 MHz of op de in de tabel behorende bij nationale voetnoot 002 van het
      Nationaal Frequentieplan 2005 bedoelde frequentiebanden, voor de gelijktijdige en ongewijzigde doorgifte door
      de houder van de vergunning voor digitale omroep van radioprogramma’s van de houder van de FM-vergunning of de
      middengolfvergunning.
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel1
  - number: '2.1'
    text: |-
      Een aanvraag om verlenging van de looptijd van een FM- of een middengolfvergunning tot en met 31 augustus 2017
      wordt ingediend bij de minister.
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel2
  - number: '2.2'
    text: |-
      De aanvraag wordt na inwerkingtreding van deze regeling en uiterlijk 28 juni 2011 om 14.00 uur per post ontvangen
      dan wel door middel van persoonlijke overhandiging ingediend op het volgende adres: Agentschap Telecom, Emmasingel
      1, 9726 AH Groningen.
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel2
  - number: '2.3'
    text: |-
      Bij persoonlijke overhandiging van de aanvraag wordt een bewijs van ontvangst afgegeven dat is voorzien van datum
      en tijdstip van ontvangst en ondertekening.
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel2
  - number: '2.4'
    text: |-
      De aanvrager dient slechts één aanvraag in, ook indien hij als houder van verscheidene FM- of
      middengolfvergunningen aanspraak wenst te maken op verlenging van zijn vergunningen.
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel2
  - number: '2.5'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van het in [bijlage 1][ref1] opgenomen model en gaat vergezeld van de
      in dit model genoemde gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0030039
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0030039
  - number: '2.6'
    text: |-
      Bij de aanvraag maakt de aanvrager per te verlengen FM- of middengolfvergunning kenbaar of hij aan de in nationale
      voetnoot 004 van het Nationaal Frequentieplan 2005 bedoelde koppeling voldoet en blijft voldoen:
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel2
  - number: 2.6.a
    text: |-
      door middel van een vergunning voor digitale radio-omroep overeenkomstig de [artikelen 6][ref1] en [7][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030039#Artikel7
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0030039
        artikel: '7'
        paragraaf: '3'
  - number: 2.6.b
    text: |-
      door middel van doorgifte op basis van een overeenkomst als bedoeld in [artikel 1, onder i][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel1
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '1'
        paragraaf: '1'
  - number: '2.7'
    text: 'De aanvrager doet, uitgaand van zijn in het zesde lid bedoelde keuze, zijn aanvraag vergezeld gaan van:'
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel2
  - number: 2.7.a
    text: |-
      een aanvraag voor een vergunning voor digitale radio-omroep overeenkomstig [artikel 7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel7
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '7'
        paragraaf: '3'
  - number: 2.7.b
    text: |-
      een kopie van een door hem gesloten doorgifte-overeenkomst die voldoet aan het gestelde in [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030039
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0030039
  - number: '2.8'
    text: |-
      Het zesde en zevende lid zijn niet van toepassing op de aanvrager van verlenging van een middengolfvergunning die
      mede beschikt over een vergunning voor digitale radio-omroep binnen het frequentiebereik 219,584–221,120 MHz.
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel2
  - number: '3'
    text: |-
      Indien niet is voldaan aan [artikel 2, tweede lid][ref1], weigert de minister de verlenging van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel2
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '2'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      Indien de aanvraag niet is geweigerd op grond van [artikel 3][ref1] en de aanvrager heeft niet voldaan aan een van
      de in [artikel 2, vierde tot en met zevende lid][ref2], gestelde eisen, deelt de minister dit de aanvrager mee en
      stelt de minister de aanvrager in de gelegenheid het verzuim te herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030039#Artikel2
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030039
        artikel: '2'
        paragraaf: '2'
  - number: '4.2'
    text: |-
      De aanvrager heeft gedurende acht werkdagen te rekenen vanaf de dag na dagtekening van de mededeling, bedoeld in
      het eerste lid, de gelegenheid het verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel4
  - number: '4.3'
    text: |-
      De gegevens of bescheiden ten behoeve van het verzuimherstel worden per post ontvangen op dan wel door middel
      van persoonlijke overhandiging ingediend op het adres, genoemd in [artikel 2, tweede lid][ref1], binnen de in het
      tweede lid bedoelde termijn, met dien verstande dat de ontvangst geschiedt vóór 17.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel2
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '2'
        paragraaf: '2'
  - number: '4.4'
    text: |-
      Indien het verzuim niet binnen de termijn, bedoeld in het tweede en het derde lid, en op de wijze,
      vermeld in het derde lid, is hersteld of de aanvrager na herstel niet heeft voldaan aan de in
      [artikel 2, vierde tot en met zevende lid][ref1], gestelde eisen, kan de aanvraag buiten behandeling worden
      gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel2
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '2'
        paragraaf: '2'
  - number: '5'
    text: |-
      Indien de aanvraag niet is afgewezen of buiten behandeling is gesteld op grond van [artikel 3][ref1]
      onderscheidenlijk [artikel 4, vierde lid][ref2], zijn de [artikelen 3.6][ref3] en [3.7 van de wet][ref4] van
      overeenkomstige toepassing bij het nemen van een besluit op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030039#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0025028#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0025028#Artikel3
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030039
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0025028
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0025028
        artikel: '3'
  - number: '6.1'
    text: |-
      Voor een houder van een FM- of een middengolfvergunning, uitgezonderd een houder van een middengolfvergunning
      als bedoeld in [artikel 2, achtste lid][ref1], is voor het verkrijgen van een vergunning een achttiende deel van
      de capaciteit van de allotment die overeenkomstig [bijlage 3][ref2] is gekoppeld aan de desbetreffende FM- of
      middengolfvergunning, beschikbaar voor het gelijktijdig uitzenden van de radioprogramma’s die worden uitgezonden
      met gebruikmaking van de FM-vergunning respectievelijk de middengolfvergunning, behoudens het bepaalde in
      [artikel 8, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030039
      [ref3]: https://wetten.overheid.nl/BWBR0030039#Artikel8
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030039
      - id: ref3
        bwb_id: BWBR0030039
        artikel: '8'
        paragraaf: '3'
  - number: '6.2'
    text: |-
      Indien de vergunninghouder verscheidene FM- of middengolfvergunningen heeft, is voor het verkrijgen van een
      vergunning beschikbaar voor het gelijktijdig uitzenden van de radioprogramma’s die worden uitgezonden met
      gebruikmaking van de desbetreffende FM-vergunningen respectievelijk middengolfvergunningen, behoudens het bepaalde
      in [artikel 8, tweede lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel8
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '8'
        paragraaf: '3'
  - number: 6.2.a
    text: |-
      indien deze vergunningen op grond van [bijlage 3][ref1] zijn gekoppeld aan dezelfde allotment: een achttiende deel
      van de capaciteit van die allotment;


      [ref1]: https://wetten.overheid.nl/BWBR0030039
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0030039
  - number: 6.2.b
    text: |-
      indien deze vergunningen op grond van [bijlage 3][ref1] niet zijn gekoppeld aan dezelfde allotment: een achttiende
      deel van de capaciteit van elk van de gekoppelde allotments.


      [ref1]: https://wetten.overheid.nl/BWBR0030039
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0030039
  - number: '6.3'
    text: |-
      Het eerste en tweede lid gelden niet langer voor zover de aanvraag, bedoeld in [artikel 2, eerste lid][ref1],
      niet wordt toegewezen of voor zover bij de toepassing van artikel 2, zesde lid, is gekozen voor de onder b van die
      bepaling vermelde optie.


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel2
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '2'
        paragraaf: '2'
  - number: '7.1'
    text: |-
      Een aanvraag van een houder van een FM- of een middengolfvergunning, uitgezonderd een houder van een
      middengolfvergunning als bedoeld in [artikel 2, achtste lid][ref1], voor een vergunning voor digitale radio-omroep
      met betrekking tot de in [artikel 6, eerste en tweede lid][ref2], bedoelde frequentiecapaciteit wordt ingediend bij
      de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030039#Artikel6
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030039
        artikel: '6'
        paragraaf: '3'
  - number: '7.2'
    text: |-
      Indien de in [artikel 2, eerste lid][ref1], bedoelde aanvraag om verlenging betrekking heeft op verscheidene FM-
      of middengolfvergunningen, heeft de aanvraag, bedoeld in het eerste lid, betrekking op even veel vergunningen
      voor digitale radio-omroep als het aantal te verlengen FM- of middengolfvergunningen waarbij is gekozen voor de
      in artikel 2, zesde lid, onder a, vermelde optie, met dien verstande dat per allotment slechts een vergunning voor
      digitale radio-omroep wordt aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel2
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '2'
        paragraaf: '2'
  - number: '7.3'
    text: |-
      [Artikel 2, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel2
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '2'
        paragraaf: '2'
  - number: '7.4'
    text: |-
      [Artikel 4][ref1] is van overeenkomstige toepassing met dien verstande dat ook in het geval dat bij de aanvraag
      voor een vergunning voor digitale radio-omroep niet is voldaan aan [artikel 2, tweede lid][ref2], de aanvrager in
      de gelegenheid wordt gesteld het verzuim te herstellen overeenkomstig artikel 4.


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030039#Artikel2
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030039
        artikel: '2'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Indien de aanvraag, bedoeld in [artikel 2, eerste lid][ref1], wordt toegewezen, wijst de minister gelijktijdig de
      aanvraag voor een vergunning voor digitale radio-omroep toe.


      [ref1]: https://wetten.overheid.nl/BWBR0030039#Artikel2
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0030039
        artikel: '2'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      De minister kan een vergunning voor digitale radio-omroep verlenen die minder dan een achttiende deel maar ten
      minste 1/21 deel van de capaciteit van een allotment betreft indien het aantal aanvragen om vergunningen voor
      digitale radio-omroep voor die allotment dat op grond van deze regeling is gedaan of dat in het kader van een
      toekomstige verleningsprocedure kan worden gedaan, hiertoe naar het oordeel van de minister aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel8
  - number: '10'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel10
  - number: '11'
    text: |-
      Deze regeling wordt aangehaald als: Regeling verlenging en digitalisering commerciële radio-omroep (middengolf en
      niet-landelijke FM).
    url: https://wetten.overheid.nl/BWBR0030039/2011-06-07#Artikel11
