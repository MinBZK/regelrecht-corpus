  - number: '4'
    text: |-
      1 Indien de aanvraag niet is geweigerd op grond van [artikel 3][ref1] en de aanvrager heeft niet voldaan aan een
      van de in [artikel 2, vierde tot en met zevende lid][ref2], gestelde eisen, deelt de minister dit de aanvrager mee
      en stelt de minister de aanvrager in de gelegenheid het verzuim te herstellen.

      2 De aanvrager heeft gedurende acht werkdagen te rekenen vanaf de dag na dagtekening van de mededeling, bedoeld in
      het eerste lid, de gelegenheid het verzuim te herstellen.

      3 De gegevens of bescheiden ten behoeve van het verzuimherstel worden per post ontvangen op dan wel door middel
      van persoonlijke overhandiging ingediend op het adres, genoemd in [artikel 2, tweede lid][ref3], binnen de in het
      tweede lid bedoelde termijn, met dien verstande dat de ontvangst geschiedt vóór 17.00 uur.

      4 Indien het verzuim niet binnen de termijn, bedoeld in het tweede en het derde lid, en op de
      wijze, vermeld in het derde lid, is hersteld of de aanvrager na herstel niet heeft voldaan aan de in
      [artikel 2, vierde tot en met zevende lid][ref4], gestelde eisen, kan de aanvraag buiten behandeling worden
      gelaten.


