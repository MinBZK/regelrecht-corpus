        artikel: '52'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '18'
  - number: '5'
    text: |-
      1 De Minister van Onderwijs, Cultuur en Wetenschap beslist, in overeenstemming met de Minister van Financiën op een
      aanvraag binnen acht weken na de indiening ervan.

      2 Een afschrift van het besluit wordt gezonden aan de projectbeheerder.
    url: https://wetten.overheid.nl/BWBR0016112/2003-12-25#Artikel5
  - number: '6'
    text: |-
      1 De verklaring kan voor geen langere periode worden afgegeven dan voor de verwachte levensduur van het project en
      voor ten hoogste dertig jaren.

      2 De verklaring vermeldt de aard van het project, het projectvermogen en de periode waarvoor de verklaring geldt.

      3 In de verklaring kunnen nadere voorwaarden worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0016112/2003-12-25#Artikel6
  - number: '7'
    text: |-
      1 De Minister van Onderwijs, Cultuur en Wetenschap kan, in overeenstemming met de Minister van Financiën, de
      verklaring intrekken indien:

      a. de ter zake verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de aanvraag een andere beslissing
      zou zijn genomen als bij de beoordeling daarvan de juiste of volledige gegevens bekend waren geweest;

      b. blijkt dat de uitvoering van het project zodanig afwijkt van het project op grond waarvan de verklaring is
      afgegeven, dat op de aanvraag een andere beslissing zou zijn genomen als bij de beoordeling daarvan de gewijzigde
      uitvoering bekend zou zijn geweest;

      c. blijkt dat de projectbeheerder de vermogenstoestand van het project niet afzonderlijk administreert;

      d. niet voldaan wordt aan één of meer van de voorwaarden die in de verklaring zijn opgenomen;

      e. de melding bedoeld in [artikel 8][ref1] niet onverwijld is geschied.

      2 Het besluit tot intrekking kan terugwerkende kracht hebben.

      3 Het besluit tot intrekking wordt gezonden aan de aanvrager die ingevolge [artikel 4, eerste lid][ref2], een
      aanvraag heeft ingediend.

      4 Een afschrift van het besluit wordt gezonden aan de projectbeheerder en de inspecteur Belastingdienst Amsterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0016112#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0016112#Artikel4
    url: https://wetten.overheid.nl/BWBR0016112/2003-12-25#Artikel7
    references:
      - id: ref1
