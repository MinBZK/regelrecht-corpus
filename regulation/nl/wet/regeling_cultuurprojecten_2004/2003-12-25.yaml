preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Financiën;

    Gelet op artikel 5.18a, derde lid, en zesde lid, van de Wet inkomstenbelasting 2001;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0016112/2003-12-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Deze regeling geeft uitvoering aan
      [artikel 5.18a, derde lid, en zesde lid, van de Wet inkomstenbelasting 2001][ref1].

      2 In deze regeling wordt verstaan onder:

      a. project: in Nederland gelegen technisch, functioneel en in de tijd samenhangend geheel van activa en
      werkzaamheden;

      b. bestaand project: project als bedoeld in [artikel 2, onderdelen a, b en c][ref2], waarvoor voor 1 januari 2004
      een begin met de uitvoering van de bijbehorende fysieke werkzaamheden is gemaakt;

      c. projectbeheerder: degene voor wiens rekening en risico het project wordt ontwikkeld en in stand gehouden;

      d. projectvermogen: vermogen dat nodig is voor de financiering van activa en werkzaamheden die noodzakelijk zijn
      voor en uitsluitend dienstbaar zijn aan de uitvoering van een project;

      e. verklaring: schriftelijk besluit van de Minister van Onderwijs, Cultuur en Wetenschap als bedoeld in
      [artikel 5.18a, derde lid, van de Wet inkomstenbelasting 2001,][ref3] waarin wordt verklaard dat een project in
      het belang is van de Nederlandse podiumkunsten of de Nederlandse musea;

      f. accountantsverklaring: verklaring afgegeven door een registeraccountant of een accountant-
      administratieconsulent.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5.18a
      [ref2]: https://wetten.overheid.nl/BWBR0016112#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel5.18a
