        artikel: '8'
      - id: ref2
        bwb_id: BWBR0016112
        artikel: '4'
  - number: '8'
    text: |-
      Indien de uitvoering van een project wordt gewijzigd doet de instelling die het kapitaal verschaft ten behoeve van
      het een project waarvoor een verklaring is afgegeven, daarvan onverwijld melding aan de Minister van Onderwijs,
      Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0016112/2003-12-25#Artikel8
  - number: '9'
    text: |-
      Ten behoeve van de vaststelling van een verklaring en van de daar toe van belang zijnde gegevens en van de
      daar aan verbonden rechten en plichten is ten aanzien van de kredietinstelling of de beleggingsinstelling,
      bedoeld in [artikel 5.18a, tweede lid, van de Wet inkomstenbelasting 2001][ref1], en de projectbeheerder
      [Hoofdstuk VIII, afdeling 2, van de Algemene wet inzake rijksbelastingen][ref2] van overeenkomstige toepassing,
      waarbij de aldaar jegens de inspecteur opgelegde verplichtingen mede gelden jegens de door de Minister van
      Onderwijs, Cultuur en Wetenschap aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5.18a
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
    url: https://wetten.overheid.nl/BWBR0016112/2003-12-25#Artikel9
