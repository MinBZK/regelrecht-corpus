  - number: '2'
    text: |-
      De Minister Onderwijs, Cultuur en Wetenschap geeft, in overeenstemming met de Minister van Financiën, een
      verklaring af voor:

      a. projecten die naar zijn oordeel in het belang van de Nederlandse podiumkunsten;

      b. projecten die naar zijn oordeel in het belang van de Nederlandse musea;

      c. andere projecten die naar zijn oordeel in het belang zijn van de Nederlandse podiumkunsten en de Nederlandse
      musea.
    url: https://wetten.overheid.nl/BWBR0016112/2003-12-25#Artikel2
  - number: '3'
    text: |-
      Een verklaring wordt niet afgegeven voor:

      a. een bestaand project;

      b. een project waarvan het project vermogen minder bedraagt dan € 22.689;

      c. een project waarvan het niet aannemelijk is dat het enig eigen rendement, subsidies van overheden en
      sponsorbijdragen daaronder begrepen, heeft; dan wel

      d. een project waarvan het te verwachten economisch rendement in verhouding tot het belang voor de Nederlandse
      podiumkunsten en de Nederlandse musea zodanig is dat het naar het oordeel van de Minister van Onderwijs, Cultuur en
      Wetenschap zonder toepassing van deze regeling tot stand kan komen.
    url: https://wetten.overheid.nl/BWBR0016112/2003-12-25#Artikel3
  - number: '4'
    text: |-
      1 Een verklaring kan slechts worden aangevraagd door en afgegeven aan:

      a. een kredietinstelling als bedoeld in [artikel 52 van de Wet toezicht kredietwezen 1992][ref1], of

      b. een beleggingsinstelling als bedoeld in [artikel 18 van de Wet toezicht beleggingsinstellingen][ref2].

      2 De aanvraag voor projecten dient te worden ingediend bij het Ministerie van Onderwijs, Cultuur en Wetenschap.

      3 Voor projecten waarvoor reeds eerder een verklaring is afgegeven kan een nieuwe aanvraag eerst drie jaar voor
      afloop van de geldende verklaring worden ingediend.

      4 De aanvraag wordt ingediend met gebruikmaking van een formulier dat door de Minister van Onderwijs, Cultuur en
      Wetenschap op aanvraag beschikbaar wordt gesteld.

      5 Aan een aanvrager kan worden verzocht nadere gegevens te verstrekken die van belang kunnen zijn voor de
      beoordeling van het project.

      6 Aan een aanvrager kan worden verzocht een accountantsverklaring te overleggen, waaruit de juistheid of
      aannemelijkheid van de in de aanvraag vermelde gegevens blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel18
    url: https://wetten.overheid.nl/BWBR0016112/2003-12-25#Artikel4
    references:
      - id: ref1
