preamble:
  text: |-
    Gelet op de artikelen 93, 95 en 104 van de Wet op de bedrijfsorganisatie, artikel 12 van het Instellingsbesluit
    Akkerbouwproductschappen en artikel 2 van de Verordening PDV algemene bepalingen 2003;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018024/2010-05-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze verordening neemt over de terminologie van de verordeningen genoemd in [artikel 2][ref1] en verstaat voorts
      onder:







                  a. producten die bedoeld zijn voor het voederen van dieren


                  :


                  voedermiddelen, voormengsels, toevoegingsmiddelen, diervoeders en alle andere producten die bedoeld
      zijn om te worden gebruikt of gebruikt worden voor het voederen van dieren;




                  b. controle van documenten


                  :


                  de verificatie van de documenten die het product dat bedoeld is voor het voederen van dieren
      vergezellen of van andere informatie over dit product;




                  c. overeenstemmingscontrole


                  :


                  de verificatie, door visuele inspectie, van de overeenstemming tussen de documenten, de merktekens en
      de producten die bedoeld zijn voor het voederen van dieren;




                  d. fysieke controle


                  :


                  de controle van de producten die bedoeld zijn voor het voederen van dieren, hetgeen een monsterneming
      en een onderzoek van de monsters in een laboratorium kan omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0018024#Artikel2
    url: https://wetten.overheid.nl/BWBR0018024/2010-05-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018024
        artikel: '2'
        paragraaf: '2'
  - number: '2.1'
    text: |-
      Het toezicht op de naleving van het bepaalde bij of krachtens: - [Verordening PDV gemedicineerd voeder 2003][ref1]
        - [Verordening PDV monitoring zoönosen en zoönoseverwekkers diervoedersector 2005][ref2] vindt plaats
      overeenkomstig deze verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0014695
      [ref2]: https://wetten.overheid.nl/BWBR0018025
    url: https://wetten.overheid.nl/BWBR0018024/2010-05-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014695
      - id: ref2
        bwb_id: BWBR0018025
  - number: '2.2'
    text: |-
      De ondernemer is verplicht alle medewerking te verlenen en desgevraagd de gevraagde gegevens te verstrekken ten
      behoeve van de uitvoering van het toezicht bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018024/2010-05-30#Artikel2
  - number: '3.1'
    text: |-
      Het toezicht bedoeld in [artikel 2][ref1] vindt plaats door middel van:


      [ref1]: https://wetten.overheid.nl/BWBR0018024#Artikel2
    url: https://wetten.overheid.nl/BWBR0018024/2010-05-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018024
        artikel: '2'
        paragraaf: '2'
  - number: 3.1.a
    text: administratieve controle, inclusief controle van documenten;
    url: https://wetten.overheid.nl/BWBR0018024/2010-05-30#Artikel3
  - number: 3.1.b
    text: |-
      overeenstemmingscontrole en andere visuele en instrumentele inspectie en controle van producten die bedoeld zijn
      voor het (uiteindelijk) voederen van dieren, bedrijfsinrichting en apparatuur;
    url: https://wetten.overheid.nl/BWBR0018024/2010-05-30#Artikel3
  - number: 3.1.c
    text: fysieke controle;
    url: https://wetten.overheid.nl/BWBR0018024/2010-05-30#Artikel3
  - number: '3.2'
    text: |-
      De voorzitter is bevoegd om, namens het bestuur en gehoord het Commissie Kwaliteitsbeleid Diervoedersector,
      bij besluit nadere voorschriften vast te stellen omtrent bemonstering en keuring en de daarbij te hanteren
      onderzoekmethoden.
    url: https://wetten.overheid.nl/BWBR0018024/2010-05-30#Artikel3
  - number: '4'
    text: |-
      Het toezicht op de voortbrenging van en op de producten zelf die bedoeld zijn voor het voederen van dieren, bestemd
      voor aflevering buiten Nederland, is gelijk aan het toezicht op producten die bedoeld zijn voor het voederen van
      dieren, bestemd voor aflevering in Nederland.
    url: https://wetten.overheid.nl/BWBR0018024/2010-05-30#Artikel4
  - number: '5'
    text: |-
      Tot uitvoering van het in [artikel 2][ref1] van deze verordening bedoeld toezicht zijn bevoegd - de medewerkers van
      de inspectie-instelling die daarvoor door de secretaris is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0018024#Artikel2
    url: https://wetten.overheid.nl/BWBR0018024/2010-05-30#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018024
        artikel: '2'
        paragraaf: '2'
  - number: '6'
    text: |-
      Op overtreding van het bepaalde in [artikel 2, tweede lid][ref1] worden tuchtrechtelijke maatregelen gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018024#Artikel2
    url: https://wetten.overheid.nl/BWBR0018024/2010-05-30#Artikel6
    references:
