  - number: '13'
    text: |-
      Tot de taak van de in dit besluit genoemde dienstonderdelen behoort voorts de uitvoering van andere taken dan
      vermeld, in opdracht van de Minister, de secretaris-generaal of de directeur-generaal, voorzover hogere wet- en
      regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel13
  - number: '14.1'
    text: |-
      1 De directeur-generaal is verantwoordelijk voor het beheer en de ter inzage legging van dit besluit.

      2 Het beheer geschiedt met inachtneming van de desbetreffende (richtlijnen inzake) administratieve
      organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel14.1
  - number: '14.2'
    text: |-
      Wijziging van dit besluit is voorbehouden aan de secretaris-generaal en geschiedt op voordracht van de directeur-
      generaal, na advisering door de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel14.2
  - number: '15.1'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na plaatsing van dit besluit in de Staatscourant en
      werkt terug tot en met 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel15.1
  - number: '15.2'
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit directoraat-generaal Veiligheid (Organisatiebesluit DGV).'
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel15.2
  - number: '15.3'
    text: |-
      Het [Organisatiebesluit DGOOV][ref1] van 1 september 2004 wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0017848
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel15.3
    references:
      - id: ref1
        bwb_id: BWBR0017848
