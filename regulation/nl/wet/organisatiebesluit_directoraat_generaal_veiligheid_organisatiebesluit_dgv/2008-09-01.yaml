articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - Ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - Minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - de directeur-generaal: de directeur-generaal Veiligheid.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit heeft betrekking op het Directoraat-generaal Veiligheid, genoemd in het
      [Organisatiebesluit BZK 2006][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020525
  - number: '3.1'
    text: |-
      Het bureau Directeur-Generaal heeft de volgende taken:

      a. het coördineren van de beleidsprocessen en het ondersteunen van de bestuursprocessen;

      b. het ontwikkelen van de kaderstelling op DG-niveau;

      c. het uitvoeren van de integrale control (beleids- en PIOFACH-control);

      d. het adviseren ten aanzien van het strategische beleid;

      e. het vervullen van het opdrachtgeverschap Gemeenschappelijke Diensten.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel3.1
  - number: '4.1'
    text: |-
      1 De afdeling Financiën Directoraat-generaal Veiligheid staat onder leiding van een hoofd.

      2 De afdeling is belast met de volgende taken:

      a. het adviseren over de financieel-economische aspecten van het beleid van het directoraat-generaal in brede zin;

      b. het zorgdragen voor de directie- en directoraat-generaalbrede bijdrage aan de begrotings- en
      verantwoordingscyclus;

      c. het initiëren en coördineren van de totstandkoming van het jaarplan/bestedingsplan van de directies
      en het bevorderen van een systematische uitvoering ervan, inclusief het (laten) verstrekken van relevante
      managementinformatie;

      d. het houden van toezicht op het Nederlands bureau brandweerexamens (Nbbe), het Nederlands Instituut Fysieke
      Veiligheid Nibra, het Rode Kruis en de Reddingsbrigade Nederland;

      e. het uitvoeren van bovengenoemde taken voor het bureau Landelijk Management Development Politie en Brandweer en
      de eenheid Bewaking en Beveiliging (EBB);

      f. het uitvoeren van specifieke taken met betrekking tot het Interim Besluit doeluitkering bestrijding;

      g. het leveren van een bijdrage aan het beheer van de Coöperatie Informatiemanagement Politie, de ICT-Service
      Coöperatie Politie, Justitie en Veiligheid en het Centrum voor Criminaliteitspreventie en Veiligheid;

      h. het voor bovengenoemde taken binnen het directoraat-generaal fungeren als aanspreekpunt voor DG-Control, de
      directie Financieel-economische Zaken, de Auditdienst, de Algemene Rekenkamer en het Ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel4.1
  - number: '5.1'
    text: |-
      De directie Strategie bestaat uit de volgende onderdelen:

      a. de Stafafdeling (S);

      b. de afdeling Strategie, Onderzoek en Monitoring (SOM);

      c. de afdeling Integraal Veiligheidsbeleid (IVB);

      d. de afdeling Internationale Samenwerking (IS);

      e. de afdeling Informatiebeleid (IB).
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel5.1
  - number: '5.2'
    text: |-
      1 De stafafdeling staat onder leiding van een hoofd.

      2 De Stafafdeling heeft de volgende taken:

      a. het beleidsinhoudelijk adviseren en ondersteunen van de directieleiding op het gebied van
      organisatie(-ontwikkeling), financiën, personeelsbeleid;

      b. het fungeren als aanspreekpunt voor het facility-management

      c. het coördineren van de directiebrede parlementaire aangelegenheden;

      d. het adviseren en ondersteunen bij in- en externe overleggen;

      e. het uitvoeren van de integrale planning en control van de directie;

      f. het coördineren van de werkbezoeken van de bewindspersonen;

      g. het zorgen voor – en ondersteunen in – de integrale informatievoorziening;

      h. het ontwikkelen en verbeteren van de interne- en externe communicatie;

      i. het voeren van het beheer en het coördineren van de intranet- en internetsites van de directie;

      j. het ontwikkelen, beheren en coördineren van het relatiebeheer van de directie;

      k. het beantwoorden brieven van particulieren.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel5.2
  - number: '5.3'
    text: |-
      1 De afdeling Strategie, Onderzoek en Monitoring staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het initiëren, formuleren en bewaken van één voortdurende, actuele en samenhangende strategische agenda;

      b. het adviseren over strategische beleidsontwikkeling;

      c. het uitvoeren van DGV-brede monitoring en het verzorgen van gegevensrapportages;

      d. het verzorgen van kennismanagement;

      e. het (laten) verrichten van onderzoek en het adviseren over voorgaande zaken;

      f. het vergroten van het presterend vermogen van de DGV-partners in veiligheid.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel5.3
  - number: '5.4'
    text: |-
      1 De afdeling Integraal Veiligheidsbeleid staat onder leiding van een hoofd.

      2 De afdeling Integraal Veiligheidsbeleid heeft de volgende taken:

      a. het formuleren van (richtinggevend) integraal veiligheidsbeleid en het bevorderen van een effectieve aanpak van
      de implementatie/uitvoering van dit beleid;

      b. het leggen van dwarsverbanden, het signaleren van lacunes en knelpunten en het entameren van integraliteit in de
      veiligheidsketen gericht op samenhang, synergie en samenwerking;

      c. het bevorderen van publiekprivate samenwerking (PPS) en het versterken van de regierol van gemeenten op het
      gebied van het integraal veiligheidsbeleid;

      d. het versterken van de coördinerende rol van de Minister van BZK op het gebied van de veiligheid, onder meer door
      het voeren van de (adjunct-)secretariaten van de Raad voor de Veiligheid en Rechtsorde (RvdVR) en van het Nationaal
      Platform Criminaliteitsbeheersing (NPC);

      e. het beleidsmatig aansturen van het Centrum voor Criminaliteitspreventie en Veiligheid (CCV);

      f. het creëren en onderhouden van een netwerk met andere Ministeries medeoverheden en maatschappelijke
      organisaties.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel5.4
  - number: '5.5'
    text: |-
      1 De afdeling Internationale Samenwerking staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het zorgdragen voor kennis en inzicht in de DGV-brede aspecten van internationaal veiligheidsbeleid en het
      ontwikkelen van visie en beleid;

      b. het coördineren binnen DGV met betrekking tot. internationaal beleid;

      c. het coördineren en verzorgen van de BZK-inbreng in diverse raadsgroepen en de Europese Raad voor de Ministers
      van Justitie en Binnenlandse Zaken (JBZ-raad);

      d. het ontwikkelen van een gezamenlijke strategie en het ontwikkelen van kaders en instrumenten voor internationale
      samenwerking en de aanpak van veiligheidsvraagstukken DGV-breed;

      e. het verzamelen en analyseren van informatie/ontwikkelingen over het door andere landen en internationale
      organisaties gevoerde veiligheidsbeleid en dit beoordelen op relevantie voor het Nederlandse DGV-beleid;

      f. het in nauw overleg met de directie Politie coördineren van het dossier Terrorismebestrijding;

      g. het coördineren van het uitzendingenbeleid Nederlandse politie in vredesmissies en het bewaken van de uitvoering
      hiervan en van de overige uitzendingen van experts op DGV-terrein;

      h. het coördineren van de samenwerking op DGV-gebied tussen Nederland en de Nederlandse Antillen en Aruba;

      i. het coördineren van de documentatievoorzieningen met betrekking tot NAVO- en EU- en overige internationale
      documenten; het (mede) opstellen van brochures; het regelen en begeleiden van bezoeken uit het buitenland; het
      regelen van bezoeken aan het buitenland; het verzorgen van het relatiebeheer en de communicatie;

      j. het signaleren van internationale ontwikkelingen en deze vertalen naar het nationale veiligheidsbeleid; het
      internationaal uitdragen van het nationaal beleid;

      k. het opzetten en onderhouden van een uitgebreid netwerk binnen de nationale en internationale instituties en
      organisaties die betrokken zijn bij de beleidsterreinen van de afdeling.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel5.5
  - number: '5.6'
    text: |-
      1 De afdeling Informatiebeleid staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het monitoren van de (lange termijn) kansen en bedreigingen van ICT-ontwikkelingen en het vertalen daarvan naar
      een DGV-brede informatiestrategie en het op basis daarvan ontwikkelen van scenario’s;

      b. het vertalen van de strategische agenda van de Minister in informatiebeleid;

      c. het ontwikkelen en geven van beleidskaders in de ICT van de DGV-diensten en zijn veiligheidspartners, alsmede
      het bevorderen van de implementatie van die ICT-prioriteiten;

      d. het formuleren van de politiek/bestuurlijke wensen inzake de informatievoorziening van de brandweer en de
      politie;

      e. het tot stand brengen van een DGV-informatiehuishouding die zoveel mogelijk gezamenlijk en waar nodig
      sectorspecifiek wordt uitgevoerd;

      f. het voeren van het strategisch beheer, eigendom en beleid van DGV-brede ICT-voorzieningen en ICT-voorzieningen
      met een multidisciplinair, vitaal of internationaal karakter;

      g. het in samenwerking met de domeindirecties en de directie Crisisbeheersing onderzoeken van de kwetsbaarheid
      van onze samenleving ten gevolge van de uitval van vitale ICT-voorzieningen en het ontwikkelen van een DGV-
      beveiligingsbeleid;

      h. het betrokken zijn bij voor informatiebeleid relevante ontwikkelingen van wet- en regelgeving;

      i. het stimuleren van innovaties, proeven en onderzoeken;

      j. het onderhouden van de contacten met de vraagorganisatie(s), de aanbodorganisatie, ketenpartners,
      domeindirecties, andere departementen en internationale gremia;

      k. het geven van bestuurlijke adviezen aan de BZK-vertegenwoordiger in de Regieraad ICT Politie en het monitoren
      van de uitvoering van de programma’s en begroting van de vraagorganisatie(s) en aanbodorganisatie;

      l. er voor zorgen dat de ketenpartners informatiebehoefte inzake multidisciplinaire ICT-voorzieningen formuleren.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel5.6
  - number: '6.1'
    text: |-
      De directie Crisisbeheersing bestaat uit de volgende organisatie onderdelen:

      a. het Bedrijfsbureau (BB);

      b. de afdeling Bestuurlijke en Juridische Zaken (BJZ);

      c. het Expertisecentrum Risico- en Crisiscommunicatie (ERC);

      d. de afdeling Risicobeleid (RB);

      e. de afdeling Preparatie Centraal (PC);

      f. de afdeling Preparatie Decentraal (PD);

      g. het Nationaal Crisiscentrum (NCC);

      h. het Landelijk Operatoneel Coördinatiecentrum.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel6.1
  - number: '6.2'
    text: |-
      1 Het Bedrijfsbureau staat onder leiding van een hoofd.

      2 Het bureau heeft de volgende taken:

      a. het ondersteunen van de directieleiding, inclusief plaatsvervangend directeur Crisisbeheersing als hoofd NCC;

      b. het voorbereiden van vergaderingen, waaronder het MT Crisisbeheersing en de overleggen waarvan het
      bedrijfsbureau het secretariaat voert;

      c. het coördineren van parlementaire aangelegenheden, Algemene Overleggen en Ministerraadstukken;

      d. het introduceren van nieuwe medewerkers;

      e. het coördineren van Beleidsprocessen;

      f. het verzorgen van administratie en documentatie;

      g. het ondersteunen van het operationeel proces van het NCC.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel6.2
  - number: '6.3'
    text: |-
      1 De afdeling Bestuurlijke en Juridische Zaken staat onder leiding van een hoofd.

      2 De afdeling voert de volgende taken uit t.b.v. de directie Crisisbeheersing en de directie Brandweer en GHOR:

      a. het uitvoeren van de juridische control onder meer door middel van het toetsen van producten en voornemens van
      de directie;

      b. het adviseren over politiek bestuurlijke aspecten van het directiebeleid en het coördineren van parlementaire
      aangelegenheden;

      c. het adviseren over de bestuurlijke structuur en het bestuurlijk juridisch kader waarbinnen de crisis- en
      rampenbeheersing is georganiseerd;

      d. het adviseren over de bestuurlijk-juridische aspecten bij de voorbereiding van wetgeving;

      e. het behandelen van bezwaar- en beroepszaken;

      f. het verlenen van bestuurlijke en juridische ondersteuning bij de totstandkoming van beleid, het opstellen van
      regelgeving en het behandelen van juridische vraagstukken van algemene aard voor de directie Crisisbeheersing en in
      voorkomende gevallen andere directies binnen DGV en voor de departementsleiding.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel6.3
  - number: '6.4'
    text: |-
      1 Het expertisecentrum Risico- en Crisiscommunicatie staat onder leiding van een hoofd.

      2 Het centrum heeft de volgende taken.

      a. het verzamelen van kennis en het ontwikkelen van expertise op het terrein van crisis- en risicocommunicatie; het
      beschikbaar maken van deze kennis en expertise voor overheidsinstanties;

      b. het ontwikkelen van beleid op het gebied van risico- en crisiscommunicatie;

      c. het adviseren over de communicatiestrategie rond thema’s, onderwerpen of gebeurtenissen die kunnen uitgroeien
      tot een crisis;

      d. het adviseren over de communicatiestrategie ten tijde van een werkelijke crisis;

      e. het eventueel leiding geven aan de uitvoering van de communicatiestrategie en/of het ondersteuning bieden op het
      gebied van woordvoering, publieks- en verwanteninformatie en nieuwe media;

      f. het verzorgen van opleidingen voor voorlichters, communicatieadviseurs en bestuurders op het gebied van risico-
      en crisiscommunicatie en het organiseren van en participeren in oefeningen en trainingen op dit terrein;

      g. het ontwikkelen, inrichten en beheren van publieksinformatiesystemen bij crisis als bijvoorbeeld een landelijke
      crisiswebsite, een centraal publieksinformatienummer.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel6.4
  - number: '6.5'
    text: |-
      1 De afdeling Risicobeleid staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het, monitoren en analyseren van politieke, maatschappelijke, economische, sociale en technische ontwikkelingen
      zowel nationaal als internationaal, voorzover die van invloed kunnen zijn op de publieke veiligheid in Nederland en
      kunnen leiden tot potentiële crises en rampen;

      b. het analyseren van beleidsontwikkelingen die van invloed kunnen zijn op de publieke veiligheid van burgers en
      kunnen leiden tot mogelijke crises en rampen;

      c. het opstellen en analyseren van mogelijke crisisscenario’s;

      d. het bijdragen aan de ontwikkeling van duidelijke beleidslijnen t.a.v. de rol die het thema veiligheid in het
      algemeen en de mogelijkheid van crisis- en rampenbeheersing in het bijzonder moet hebben binnen de (bestuurlijke)
      besluitvorming zowel publiek als privaat op alle niveaus;

      e. het, in samenspraak met andere departementen, ontwikkelen van een visie hoe crises en rampen zoveel als mogelijk
      te voorkomen en beheersbaar te maken;

      f. het, in samenspraak met partners in veiligheid, komen tot duidelijke en integrale beleidskaders, op grond
      waarvan risico’s en onveiligheid maatschappelijk geaccepteerd kunnen worden;

      g. het behartigen van de beleidsmatige aspecten van de Onderzoeksraad voor de Veiligheid (OVV) en, indien het
      voortouw ligt bij BZK, het coördineren van een reactie op de aanbevelingen van de OVV;

      h. het regisseren en coördineren van het continue beleidsproces ten aanzien van vitale infrastructuur; het
      waarborgen van de samenhang van de beschermende maatregelen;

      i. het bijdragen aan beleidsvorming rond onderdelen die binnen de verantwoordelijkheid van BZK vallen ten aanzien
      van de vitale infrastructuur;

      j. het ontwikkelen van een beleidsvisie ter versterking van het algemene veiligheidsbewustzijn.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel6.5
  - number: '6.6'
    text: |-
      1 De afdeling Preparatie Centraal staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het ontwikkelen van beleid om de verantwoordelijkheid van de Minister van BZK ten aanzien van crisisbeheersing
      te versterken;

      b. het ontwikkelen van beleid om de verantwoordelijkheid van de nationaal coördinator crisisbeheersing te
      versterken;

      c. het coördineren van het interdepartementale beleid op het terrein van crisisbeheersing;

      d. het ontwikkelen van instrumenten ten behoeve van crisisbesluitvorming;

      e. het ontwikkelen van beleid met betrekking tot Early-warning systems;

      f. het versterken van de centrale en interdepartementale planvorming;

      g. het coördineren en uitvoeren van de rapportage aan de Tweede Kamer over de stand van zaken ten aanzien van
      crisis- en rampenbeheersing;

      h. het ontwikkelen, uitvoeren en evalueren van het opleidings- en oefenbeleid voor preparatie en respons;

      i. het invulling geven aan de interdepartementale beleidsafstemming ten aanzien van crisis- en rampenbeheersing;

      j. het organiseren van oefening en preparatie van de respons voor interdepartementaal en bestuurlijk Nederland;

      k. het opleiden en preparen medewerkers werkzaam in de respons;

      l. het (mede)ontwikkelen van en participeren in de uitvoering van oefeningen internationaal, nationaal,
      provinciaal, regionaal en gemeentelijk en BZK;

      m. het onderhouden van het Operationele Departementaal Handboek BZK;

      n. het ontwikkelen en uitvoeren van het kwaliteitsborgingsysteem crisisbeheersing;

      o. het evalueren van daadwerkelijke incidenten/crises gericht op preparatie en het functioneren van de respons.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel6.6
  - number: '6.7'
    text: |-
      1 De afdeling Preparatie Decentraal staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het meetbaar en toetsbaar maken van het zorgniveau van de rampenbestrijding en crisisbeheersing;

      b. het verbeteren van de voorbereiding van en de respons op een (dreigende) terroristische aanslag met nucleaire,
      biologische en/of chemische middelen, die zoveel mogelijk aansluit bij bestaande structuren van crisisbeheersing
      en rampenbestrijding;

      c. het ontwikkelen van specifiek beleid t.a.v. crisistypen;

      d. het versterken van de decentrale planvorming;

      e. het organiseren van de totstandkoming van een samenhangend en gecoördineerd beleid van rijk, provincies en
      gemeenten ten aanzien van de rampenbestrijding en crisisbeheersing in brede zin;

      f. het invulling geven aan de toezichthoudende rol van BZK ten aanzien van de voorbereiding op de rampenbestrijding
      en de crisisbeheersing door de lagere overheden en hulpverleningsorganisaties;

      g. het ontwikkelen van integraal kwaliteitsbeleid t.a.v. rampenbestrijding en crisisbeheersing;

      h. het invulling geven aan de beleidsverantwoordelijkheid voor de afhandeling van schade bij rampen en zware
      ongevallen;

      i. het uitvoeren van beleid ten aanzien van nazorg door het Rijk, de provincies en gemeenten;

      j. het evalueren van crises en rampen;

      k. het initiëren van onderzoek op rampen- en crisisbeheersingsgebied.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel6.7
  - number: '6.8'
    text: |-
      1 Het Nationaal Crisiscentrum staat onder leiding van een hoofd tevens plaatsvervangend directeur Crisisbeheersing.

      2 Het Nationaal Crisiscentrum heeft de volgende taken:

      a. het signaleren van (dreigende) potentiële crises of rampen en van (dreigende) ingrijpende verstoringen van de
      openbare orde en veiligheid die de coördinatie van BZK vereist en het daadwerkelijk inspelen op gebeurtenissen/
      evenementen waarbij een dergelijke situatie kan ontstaan en het reageren daarop;

      b. het voorbereiden van de daadwerkelijke reactie van de Minister van BZK op crises en rampen of de dreiging
      daarvan;

      c. het formuleren van protocollen voor de besluitvorming en van handboeken voor de (voorbereiding van de) aanpak
      bij (dreigende) crises of rampen en de bijstelling daarvan op basis van de ervaringen in de praktijk;

      d. het signaleren van ervaringen die moeten leiden tot een bijstelling van het beleid ten aanzien van crises en
      rampen;

      e. het ontwikkelen van beleid dat direct gerelateerd is aan de uitvoering van de responsfase;

      f. het coördineren van interbestuurlijke en -departementale inzet voor bijstand op het gebied van crisisbeheersing
      rampenbestrijding en handhaving openbare orde;

      g. het coördineren van interdepartementale inzet voor bijstand en het faciliteren conform Nationaal Handboek
      Crisisbeheersing ten tijde van (dreigende) crises;

      h. het fungeren als International Point of Contact voor Internationale bijstands- en hulpverleningsverzoeken;

      i. het verzorgen van informatie-uitwisseling bij grensoverschrijdende incidenten.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel6.8
  - number: '6.9'
    text: |-
      1 Het Landelijk Operationeel Coördinatiecentrum staat onder leiding van een hoofd.

      2 Het Landelijk Operationeel Coördinatiecentrum heeft de volgende taken:

      a. het uitvoeren van de taak van de Minister op het gebied van bijstandsverlening bij crises, rampen en
      grootschalige incidenten:

      i. coördineren van de mono- en multidisciplinaire inzet van politie, brandweer, defensie en GHOR;

      ii. adviseren over multidisciplinaire inzet, op aanvraag van de Minister van BZK of de regio;

      iii. opstellen van situatierapporten;

      iv. coördineren van de internationale inzet op operationeel niveau;

      b. het uitvoeren van de volgende reguliere- en voorbereidingstaken m.b.t. operaties:

      i. het optreden als contactpunt voor veiligheidsregio’s;

      ii. het planmatig voorbereiden op het eigenoptreden;

      iii. het coördineren en uitvoeren van opschalingsoefeningen;

      iv. het maken en actueel houden van relevante overzichten.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel6.9
  - number: '7.1'
    text: |-
      De directie Brandweer en GHOR bestaat uit de volgende onderdelen:

      a. de Stafafdeling (S);

      b. de afdeling Bestuur en Organisatie (B&O);

      c. de afdeling Taken Brandweer en GHOR (TBG);

      d. de afdeling Kwaliteit Personeel en Materieel (KPM);

      e. de afdeling Kennis- en Informatiemanagement (KIM);

      f. de Landelijke Faciliteit Rampenbeheersing i.o. (LFR i.o.).
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel7.1
  - number: '7.2'
    text: |-
      1 De Stafafdeling staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het coördineren van beheersaangelegenheden binnen de directie;

      b. het bewaken van de voortgang van de beleidsprocessen;

      c. het coördineren van de interne besluitvormingsprocedures en verantwoordingscycli;

      d. het bewaken van de voortgang en kwaliteit van de stukkenstroom naar de departementsleiding en de
      bewindspersonen;

      e. het ondersteunen van de secretariaatswerkzaamheden binnen de directie;

      f. het coördineren van de parlementaire aangelegenheden;

      g. het fungeren als centraal aanspreekpunt bij het Algemeen Overleg;

      h. het bewaken van de voortgang en de samenhang bij de beantwoording van de Kamervragen;

      i. het voeren van overleg met stafafdelingen binnen DGV/MTV.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel7.2
  - number: '7.3'
    text: |-
      1 De afdeling Bestuur en Organisatie staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het zorgdragen voor de financiering van de brandweer en GHOR;

      b. het ontwikkelen en toepassen van een kwaliteitssysteem voor brandweer en GHOR;

      c. het versterken van de toepassing van relevante ondersteunende faciliteiten zoals informatie, communicatie
      en technologie (ICT) voorzieningen in een multidisciplinaire context, binnen de beleidskaders van de directie
      Strategie ten aanzien van ICT;

      d. het uitvoeren van de bijdrageregeling inzake explosieven;

      e. het versterken van de bestuurlijke organisatie door beleidsontwikkeling gericht op de kolom van respectievelijk
      brandweer en GHOR ten aanzien van de versterking van de organisatie door het stellen van kwaliteits- en prestatie-
      eisen.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel7.3
  - number: '7.4'
    text: |-
      1 De afdeling Taken Brandweer en GHOR staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het voeren van een taakdiscussie met brandweer en voor zover relevant voor de GHOR;

      b. het ontwikkelen van beleid ten aanzien van fysieke veiligheidsvraagstukken;

      c. het uitvoeren van het [Besluit Bedrijfsbrandweren][ref1], het evalueren van het Besluit en het zorgdragen voor
      afstemming tussen bedrijfsbrandweren en brandweerkorpsen;

      d. het ontwikkelen van adequaat instrumentarium;

      e. het bevorderen en versterken van de positie van de brandweer en GHOR als veiligheidsadviseurs ten aanzien van
      lokale veiligheidstaken;

      f. het ontwikkelen van beleid met betrekking tot veiligheidsbewustzijn;

      g. het afstemmen van het beleid van de directie Crisisbeheersing ten aanzien van de multidisciplinaire taken van
      brandweer en GHOR;

      h. het afstemmen van beleid inzake GHOR en dagelijkse zorg met VWS;

      i. het toetsen van de kwetsbaarheid van brandweer en GHOR met betrekking tot vitale infrastructuur;

      j. het bevorderen en versterken van de positie van de brandweer en GHOR als veiligheidsadviseurs ten aanzien van
      lokale veiligheidstaken;

      k. het ontwikkelen van beleid voor opschaling.


      [ref1]: https://wetten.overheid.nl/BWBR0004694
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0004694
  - number: '7.5'
    text: |-
      1 De afdeling Kwaliteit Personeel en Materieel staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het stellen van kwaliteitseisen ten aanzien van de werving en selectie van brandweer- en GHOR personeel;

      b. het ontwikkelen van een systeem gericht op vakbekwaamheidscertificatie voor de brandweer;

      c. het coördineren van bestuurlijk en operationeel opleiden en oefenen, zowel monodisciplinair als ten behoeve van
      grootschalig optreden van brandweer en GHOR;

      d. vanuit het opdrachtgeverschap van de Landelijke Faciliteit voor de Rampenbestrijding (LFR) het zorgdragen voor
      adequaat materieel;

      e. het ontwikkelen van beleid ten aanzien van het Nederlands Instituut voor de Brandweerzorg (NIBRA) en beleid ten
      aanzien van het Nederlands Bureau Brandweer Examens (Nbbe);

      f. het samenwerken als counterpartner met het Landelijk Management Development politie en brandweer.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel7.5
  - number: '7.6'
    text: |-
      1 De afdeling Kennis- en Informatiemanagement (KIM) staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het voeren van het relatiebeheer ten behoeve van de directies Brandweer en Crisisbeheersing;

      b. het zorgdragen voor het kennismanagement en de informatievoorziening;

      c. het coördineren van onderzoek voorzover het de specifieke verantwoordelijkheid van de directies Brandweer en
      Crisisbeheersing betreft;

      d. het zorgdragen voor monitoring en trendsignalering.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel7.6
  - number: '7.7'
    text: |-
      1 De Landelijke faciliteit Rampenbestrijding i.o. staat onder leiding van een directeur.

      2 De faciliteit heeft de volgende taken:

      a. uitvoeren van opdrachten zoals verleend door de afdeling KPM op het gebied van rampenbeheersing en brandweerzorg
      in benodigd materieel, telecommunicatie, geneeskundige hulpverlening, logistiek en in beleid betreffende het
      waarschuwen van bevolking;

      b. het verstrekken van extra materieel voor grootschalige brandbestrijding en technische hulpverlening aan de
      regionale brandweren;

      c. het verstrekken van extra materieel voor de geneeskundige hulpverlening bij ongevallen en rampen alsmede de
      bijzonder politiemiddelen voor de directie Politie;

      d. De Landelijke faciliteit Rampenbestrijding handelt verder alsof zij reeds een agentschap is en voert daartoe
      een batenlastenadministratie.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel7.7
  - number: '8.1'
    text: |-
      De directie Politie bestaat uit de volgende onderdelen:

      a. de Stafafdeling (S);

      b. het cluster Organisatie, Taken en Bevoegdheden Politie bestaande uit:

      i. de afdeling Bestuurlijke en Juridische Zaken (BJZ);

      ii. de afdeling Politieel Veiligheidsbeleid (PVB);

      c. het cluster Personeel Politie bestaande uit:

      i. de afdeling Arbeidsvoorwaardenbeleid (AB);

      ii. de afdeling Onderwijs en Loopbaanbeleid (O&L);

      d. het cluster Middelen bestaande uit:

      i. de afdeling Financiën (F);

      ii. de afdeling Bedrijfsvoeringsbeleid (BB);

      e. het cluster Kennisontwikkeling en Relatiebeheer bestaande uit:

      i. de afdeling Relatiebeheer (RB);

      ii. de afdeling Informatie, Kennisontwikkeling en Onderzoek (IKOO).
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel8.1
  - number: '8.2'
    text: |-
      1 De Stafafdeling staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het coördineren van alle afdelingsoverstijgende beleids- en bestuursaangelegenheden van de directie Politie
      en in voorkomende gevallen advisering hierover; het beleidsinhoudelijke ondersteunen van de directieleiding in de
      beantwoording van burgerbrieven;

      b. het voeren van het ambtelijk secretariaat van diverse interne en externe overleggen;

      c. het coördineren van parlementaire aangelegenheden;

      d. het verzorgen van interne en externe informatievoorziening over de directie;

      e. het optreden als aanspreekpunt voor het facility-management van de directie;

      f. het coördineren van het managementassistententeam van de directie.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel8.2
  - number: '8.3'
    text: |-
      1 De afdeling Bestuurlijke en Juridische Zaken staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het ontwikkelen van beleidskaders, onder meer terzake van (wijzigingen van) de [Politiewet 1993][ref1] en de
      daarop gebaseerde regelgeving; het evalueren van en zorgen voor de implementatie van aangekondigde maatregelen;

      b. het verlenen van bestuurlijke en juridische ondersteuning bij de totstandkoming van beleid en regelgeving en het
      behandelen van juridische vraagstukken van algemene aard voor de directie Politie en in voorkomende gevallen andere
      directies binnen DGV en voor de departementsleiding;

      c. het ontwikkelen van beleid ten aanzien van openbare ordehandhaving.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0006299
  - number: '8.4'
    text: |-
      1 De afdeling Politieel Veiligheidsbeleid staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het ondersteunen van de korpsen bij de ontwikkeling en uitvoering van hun beleid;

      b. het ontwikkelen van kaders voor (bovenregionale) samenwerking en voorzieningen binnen het politieconcern;

      c. het ontwikkelen van beleid op het vlak van de taken, de organisatie en de professionaliteit van de politie, op
      zowel korps- als concernniveau;

      d. het bewaken en monitoren van de uitvoering van politiële taken als opsporing, toezicht, handhaving,
      noodhulpverlening en kerntaken;

      e. het stimuleren van het innovatief vermogen in de korpsen.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel8.4
  - number: '8.5'
    text: |-
      1 De afdeling Arbeidsvoorwaardenbeleid staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het voorbereiden en tot stand brengen van een arbeidsvoorwaardenbeleid (CAO) voor de politieorganisatie,
      inclusief het georganiseerd overleg met de politievakorganisaties;

      b. het zorgen voor vastlegging van het arbeidsvoorwaardenbeleid in (rechtspositionele) wet- en regelgeving;

      c. het voor de politiekorpsen fungeren als aanspreek- en informatiepunt met betrekking tot vraagstukken op het
      gebied van de rechtspositie en arbeidsvoorwaarden;

      d. het ten behoeve van een aantal overlegvormen op het terrein van arbeidsvoorwaardenbeleid verzorgen van het
      secretariaat, en regisseren van de voorbereiding, inbreng, voortgang, resultaten en onderlinge afstemming.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel8.5
  - number: '8.6'
    text: |-
      1 De afdeling Onderwijs en Loopbaanbeleid staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het ontwikkelen, vaststellen en evalueren van beleid betreffende het politieonderwijs en de inrichting ervan;

      b. het ontwerpen van eisen aan toekomstig onderwijs;

      c. het vaststellen van het eindniveau en de duur van verplichte opleidingen;

      d. het ontwikkelen, vaststellen en evalueren van beleid betreffende de verdere ontwikkeling van medewerkers voor
      het op peil houden van de eenheid en de kwaliteit van de politie;

      e. het beheren van het systeem van functiewaardering;

      f. het vaststellen van de topformatie van de regiokorpsen;

      g. het ontwikkelen en uitvoeren van het diversiteits- en het integriteitsbeleid;

      h. het afstemmen van het landelijke en regionaal loopbaanbeleid;

      i. het ondersteunen van het regionaal en landelijk wervingsbeleid.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel8.6
  - number: '8.7'
    text: |-
      1 De afdeling Bedrijfsvoeringsbeleid staat onder leiding van een hoofd

      2 De afdeling heeft de volgende taken:

      a. het vormgeven en onderhouden van het bekostigingsstelsel (gecombineerd stelsel van algemene, bijzondere en
      aanvullende bijdragen) voor de Nederlandse politie en het politieonderwijs. Uitgangspunt van het stelsel is een
      evenwichtige allocatie van de middelen van het Rijk;

      b. het inhoudelijk toetsen van begrotingen en jaarrekeningen van korpsen. Politieacademie en (op te richten)
      samenwerkingsverbanden binnen de Nederlandse politie (w.o. ICT-voorzieningen) en het beoordelen van het financieel
      beheer van deze organisaties;

      c. het vernieuwen en onderhouden van comptabele regelgeving;

      d. het ontwikkelen van beleidskaders en instrumenten ter bevordering van doelmatige bedrijfsvoering;

      e. het actief bevorderen van vergelijkbaarheid van korpsen door middel van uniformering, standaardisering en
      stimulering;

      f. het ontwikkelen van beleid op het terrein van ICT politie;

      g. het zorgdragen van de bekostiging van bewapening; uitrusting en kleding van politie alsmede het zorgdragen voor
      landelijke facilitaire voorzieningen ten behoeve van de politie;

      h. het adviseren van de overige beleidsafdelingen van DGV over beleidsdossiers waarbij bedrijfsvoering van de
      korpsen en de Politieacademie een rol speelt.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel8.7
  - number: '8.8'
    text: |-
      1 De afdeling Financiën staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. advisering over de financieel-economische aspecten van het directiebeleid in brede zin;

      b. zorgdragen voor de directie-specifieke bijdrage aan de begrotings- en verantwoordingscyclus;

      c. initiëren en coördineren van de totstandkoming van het jaarplan/bestedingsplan van de directie en het bevorderen
      van een systematische uitvoering ervan, inclusief het (laten) verstrekken van relevante managementinformatie;

      d. het voor bovengenoemde taken binnen de directie fungeren als aanspreekpunt voor DG-Control, de dienst
      Financieel-economische Zaken en Control, de Auditdienst, de Algemene Rekenkamer en het Ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel8.8
  - number: '8.9'
    text: |-
      1 De afdeling Relatiebeheer staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het fungeren als aanspreekpunt voor en het informeren van de politiekorpsen over relevante landelijke beleids-
      en beheersmatige ontwikkelingen en trends;

      b. het fungeren als aanspreekpunt voor en het informeren en adviseren van de ambtelijke en politieke leiding over
      regionale politiële aangelegenheden;

      c. het verkrijgen van inzicht in de effecten van departementaal beleid in de politiekorpsen;

      d. het signaleren en inventariseren van regionale beleids- en beheersontwikkelingen en deze inzichtelijk maken voor
      de directie;

      e. het voorbereiden van gesprekken met de korpsbeheerder/korpschef inzake de uitvoering van de prestatieafspraken;

      f. het voorbereiden van de gesprekken met de korpsbeheerder/korpschef inzake de beheers- en beleidsmatige
      ontwikkelingen van het korps op basis van jaarplan, jaarverslag, begroting en jaarrekening;

      g. het voorbereiden van werkbezoeken van de Minister(s) en ambtelijke leiding aan politiekorpsen;

      h. het adviseren van de beleidsafdelingen van DGV over regionale politiële aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel8.9
  - number: '8.10'
    text: |-
      1 De afdeling Informatie, Kennisontwikkeling en Onderzoek staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a. het vergaren, delen, borgen, veredelen en analyseren van kennis en informatie op het terrein van politie,
      alsmede het intern en extern beschikbaar stellen daarvan;

      b. het bevorderen van het gebruik van kennis en informatie;

      c. het ontwikkelen en bewaken van een samenhangend onderzoeksbeleid voor de directie, inclusief directiebrede
      onderzoekscoördinatie;

      d. het vergroten van het strategisch vermogen van de directie;

      e. het bewaken van de voortgang van de resultaatsafspraken met de politiekorpsen door gegevensverzameling,
      (trend)analyse, probleemverkenning en ontwikkeling van meetinstrumenten;

      f. het ontwikkelen en bewaken van beleidskaders ten behoeve van informatie uitwisseling.
    url: https://wetten.overheid.nl/BWBR0020523/2008-09-01#Artikel8.10
  - number: '9'
    text: |-
