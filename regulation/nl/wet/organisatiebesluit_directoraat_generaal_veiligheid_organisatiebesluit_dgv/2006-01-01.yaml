  - number: '14'
    text: |-
      Tot de taak van de in dit besluit genoemde dienstonderdelen behoort voorts de uitvoering van andere taken dan
      vermeld, in opdracht van de minister, de secretaris-generaal of de directeur-generaal, voor zover hogere wet- en
      regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel14
  - number: 15:1.1
    text: De directeur-generaal is verantwoordelijk voor het beheer en de terinzagelegging van dit besluit.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel151
  - number: 15:1.2
    text: |-
      Het beheer geschiedt met inachtneming van de desbetreffende (richtlijnen inzake) administratieve
      organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel151
  - number: 15:2
    text: |-
      Wijziging van dit besluit is voorbehouden aan de secretaris-generaal en geschiedt op voordracht van de directeur-
      generaal, na advisering door de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel152
  - number: 16:1
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na plaatsing van dit besluit in de Staatscourant en
      werkt terug tot en met 1 september 2004.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel161
  - number: 16:2
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit directoraat-generaal Veiligheid (Organisatiebesluit DGV).'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel162
  - number: 16:3
    text: |-
      Het [Organisatiebesluit DGOOV][ref1] van 17 september 2003 wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0015588
