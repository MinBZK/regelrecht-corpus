articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - de directeur-generaal: de directeur-generaal Veiligheid.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel1
  - number: '2'
    text: |-
      Dit besluit heeft betrekking op het directoraat-generaal Veiligheid, genoemd in het
      [Organisatiebesluit BZK 2004][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017563
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017563
  - number: 3:1
    text: 'Het bureau Directeur-Generaal heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel31
  - number: 3:1.a
    text: het coördineren van de beleidsprocessen en het ondersteunen van de bestuursprocessen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel31
  - number: 3:1.b
    text: het ontwikkelen van de kaderstelling op DG-niveau;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel31
  - number: 3:1.c
    text: het uitvoeren van de integrale control (beleids- en PIOFACH-control);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel31
  - number: 3:1.d
    text: het adviseren ten aanzien van het strategische beleid;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel31
  - number: 3:1.e
    text: het vervullen van het opdrachtgeverschap Gemeenschappelijke Diensten.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel31
  - number: 4:1
    text: 'De directie Strategie bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel41
  - number: 4:1.a
    text: de stafafdeling (S);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel41
  - number: 4:1.b
    text: de afdeling Strategie, Onderzoek en Monitoring (SOM);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel41
  - number: 4:1.c
    text: de afdeling Integraal Veiligheidsbeleid (IVB);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel41
  - number: 4:1.d
    text: de afdeling Internationale Samenwerking (IS);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel41
  - number: 4:1.e
    text: de afdeling Informatiebeleid (IB);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel41
  - number: 4:1.f
    text: de afdeling Financiën (F).
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel41
  - number: 4:2.1
    text: De stafafdeling staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel42
  - number: 4:2.2
    text: 'De stafafdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel42
  - number: 4:2.2.a
    text: |-
      het beleidsinhoudelijk adviseren en ondersteunen van de directieleiding op het gebied van
      organisatie(ontwikkeling), financiën, personeelsbeleid;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel42
  - number: 4:2.2.b
    text: het fungeren als aanspreekpunt voor het facility-management;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel42
  - number: 4:2.2.c
    text: het coördineren van de directiebrede parlementaire aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel42
  - number: 4:2.2.d
    text: het adviseren en ondersteunen bij in- en externe overleggen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel42
  - number: 4:2.2.e
    text: het uitvoeren van de integrale planning en control van de directie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel42
  - number: 4:2.2.f
    text: het coördineren van de werkbezoeken van de bewindspersonen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel42
  - number: 4:2.2.g
    text: het zorgen voor – en ondersteunen in – de integrale informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel42
  - number: 4:2.2.h
    text: het ontwikkelen en verbeteren van de interne en externe communicatie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel42
  - number: 4:2.2.i
    text: het voeren van het beheer en het coördineren van de intranet- en internetsites van de directie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel42
  - number: 4:2.2.j
    text: het ontwikkelen, beheren en coördineren van het relatiebeheer van de directie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel42
  - number: 4:2.2.k
    text: het beantwoorden van brieven van particulieren.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel42
  - number: 4:3.1
    text: De afdeling Strategie, Onderzoek en Monitoring staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel43
  - number: 4:3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel43
  - number: 4:3.2.a
    text: het initiëren, formuleren en bewaken van één voortdurende, actuele en samenhangende strategische agenda;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel43
  - number: 4:3.2.b
    text: het adviseren over strategische beleidsontwikkeling;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel43
  - number: 4:3.2.c
    text: het uitvoeren van DGV-brede monitoring en het verzorgen van gegevensrapportages;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel43
  - number: 4:3.2.d
    text: het verzorgen van kennismanagement;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel43
  - number: 4:3.2.e
    text: het (laten) verrichten van onderzoek en het adviseren over voorgaande zaken;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel43
  - number: 4:3.2.f
    text: het vergroten van het presterend vermogen van de DGV-partners in veiligheid.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel43
  - number: 4:4.1
    text: De afdeling Integraal Veiligheidsbeleid staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel44
  - number: 4:4.2
    text: 'De afdeling Integraal Veiligheidsbeleid heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel44
  - number: 4:4.2.a
    text: |-
      het formuleren van (richtinggevend) integraal veiligheidsbeleid en het bevorderen van een effectieve aanpak van de
      implementatie/uitvoering van dit beleid;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel44
  - number: 4:4.2.b
    text: |-
      het leggen van dwarsverbanden, het signaleren van lacunes en knelpunten en het entameren van integraliteit in de
      veiligheidsketen gericht op samenhang, synergie en samenwerking;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel44
  - number: 4:4.2.c
    text: |-
      het bevorderen van publiekprivate samenwerking (PPS) en het versterken van de regierol van gemeenten op het gebied
      van het integraal veiligheidsbeleid;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel44
  - number: 4:4.2.d
    text: |-
      het versterken van de coördinerende rol van de minister van BZK op het gebied van de veiligheid, onder meer door
      het voeren van de (adjunct-)secretariaten van de Raad voor de Veiligheid en Rechtsorde (RvdVR) en van het Nationaal
      Platform Criminaliteitsbeheersing (NPC);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel44
  - number: 4:4.2.e
    text: het beleidsmatig aansturen van het Centrum voor Criminaliteitspreventie en Veiligheid (CCV);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel44
  - number: 4:4.2.f
    text: het creëren en onderhouden van een netwerk met andere ministeries medeoverheden en maatschappelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel44
  - number: 4:5.1
    text: De afdeling Internationale Samenwerking staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel45
  - number: 4:5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel45
  - number: 4:5.2.a
    text: |-
      het zorgdragen voor kennis en inzicht in de DGV-brede aspecten van internationaal veiligheidsbeleid en het
      ontwikkelen van visie en beleid;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel45
  - number: 4:5.2.b
    text: het coördineren binnen DGV met betrekking tot. internationaal beleid;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel45
  - number: 4:5.2.c
    text: |-
      het coördineren en verzorgen van de BZK-inbreng in diverse raadsgroepen en de Europese Raad voor de ministers van
      Justitie en Binnenlandse Zaken (JBZ-raad);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel45
  - number: 4:5.2.d
    text: |-
      het ontwikkelen van een gezamenlijke strategie en het ontwikkelen van kaders en instrumenten voor internationale
      samenwerking en de aanpak van veiligheidsvraagstukken DGV-breed;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel45
  - number: 4:5.2.e
    text: |-
      het verzamelen en analyseren van informatie/ontwikkelingen over het door andere landen en internationale
      organisaties gevoerde veiligheidsbeleid en dit beoordelen op relevantie voor het Nederlandse DGV-beleid;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel45
  - number: 4:5.2.f
    text: het in nauw overleg met de directie Politie coördineren van het dossier Terrorismebestrijding;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel45
  - number: 4:5.2.g
    text: |-
      het coördineren van het uitzendingenbeleid Nederlandse politie in vredesmissies en het bewaken van de uitvoering
      hiervan en van de overige uitzendingen van experts op DGV-terrein;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel45
  - number: 4:5.2.h
    text: het coördineren van de samenwerking op DGV-gebied tussen Nederland en de Nederlandse Antillen en Aruba;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel45
  - number: 4:5.2.i
    text: |-
      het coördineren van de documentatievoorzieningen met betrekking tot NAVO- en EU- en overige internationale
      documenten; het (mede) opstellen van brochures; het regelen en begeleiden van bezoeken uit het buitenland; het
      regelen van bezoeken aan het buitenland; het verzorgen van het relatiebeheer en de communicatie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel45
  - number: 4:5.2.j
    text: |-
      het signaleren van internationale ontwikkelingen en deze vertalen naar het nationale veiligheidsbeleid; het
      internationaal uitdragen van het nationaal beleid;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel45
  - number: 4:5.2.k
    text: |-
      het opzetten en onderhouden van een uitgebreid netwerk binnen de nationale en internationale instituties en
      organisaties die betrokken zijn bij de beleidsterreinen van de afdeling.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel45
  - number: 4:6.1
    text: De afdeling Informatiebeleid staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel46
  - number: 4:6.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel46
  - number: 4:6.2.a
    text: |-
      het monitoren van de (lange termijn) kansen en bedreigingen van ICT-ontwikkelingen en het vertalen daarvan naar een
      DGV-brede informatiestrategie en het op basis daarvan ontwikkelen van scenario’s;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel46
  - number: 4:6.2.b
    text: het vertalen van de strategische agenda van de minister in informatiebeleid;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel46
  - number: 4:6.2.c
    text: |-
      het ontwikkelen en geven van beleidskaders in de ICT van de DGV-diensten en zijn veiligheidspartners, alsmede het
      bevorderen van de implementatie van die ICT-prioriteiten;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel46
  - number: 4:6.2.d
    text: het formuleren van de politiek/bestuurlijke wensen inzake de informatievoorziening van de brandweer en de politie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel46
  - number: 4:6.2.e
    text: |-
      het tot stand brengen van een DGV-informatiehuishouding die zoveel mogelijk gezamenlijk en waar nodig
      sectorspecifiek wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel46
  - number: 4:6.2.f
    text: |-
      het voeren van het strategisch beheer, eigendom en beleid van DGV-brede ICT-voorzieningen en ICT-voorzieningen met
      een multidisciplinair, vitaal of internationaal karakter;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel46
  - number: 4:6.2.g
    text: |-
      het in samenwerking met de domeindirecties en de directie Crisisbeheersing onderzoeken van de kwetsbaarheid
      van onze samenleving ten gevolge van de uitval van vitale ICT-voorzieningen en het ontwikkelen van een DGV-
      beveiligingsbeleid;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel46
  - number: 4:6.2.h
    text: het betrokken zijn bij voor informatiebeleid relevante ontwikkelingen van wet- en regelgeving;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel46
  - number: 4:6.2.i
    text: het stimuleren van innovaties, proeven en onderzoeken;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel46
  - number: 4:6.2.j
    text: |-
      het onderhouden van de contacten met de vraagorganisatie(s), de aanbodorganisatie, ketenpartners, domeindirecties,
      andere departementen en internationale gremia;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel46
  - number: 4:6.2.k
    text: |-
      het geven van bestuurlijke adviezen aan de BZK-vertegenwoordiger in de Regieraad ICT Politie en het monitoren van
      de uitvoering van de programma’s en begroting van de vraagorganisatie(s) en aanbodorganisatie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel46
  - number: 4:6.2.l
    text: er voor zorgen dat de ketenpartners informatiebehoefte inzake multidisciplinaire ICT-voorzieningen formuleren.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel46
  - number: 4:7.1
    text: De afdeling Financiën staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel47
  - number: 4:7.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel47
  - number: 4:7.2.a
    text: het adviseren over de financieel-economische aspecten van het directiebeleid in brede zin;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel47
  - number: 4:7.2.b
    text: het zorgdragen voor de directie-specifieke bijdrage aan de begrotings- en verantwoordingscyclus;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel47
  - number: 4:7.2.c
    text: |-
      het initiëren en coördineren van de totstandkoming van het jaarplan/bestedingsplan van de directie en
      het bevorderen van een systematische uitvoering ervan, inclusief het (laten) verstrekken van relevante
      managementinformatie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel47
  - number: 4:7.2.d
    text: |-
      het uitvoeren van bovengenoemde taken voor de projectdirectie C2000, het bureau Landelijk Management Development
      Politie en Brandweer en de eenheid Bewaking en Beveiliging (EBB);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel47
  - number: 4:7.2.e
    text: |-
      het leveren van een bijdrage aan het beheer van het agentschap Informatie- en Communicatietechnologie Organisatie,
      de Coöperatie Informatiemanagement Politie, de ICT-Service Coöperatie Politie, Justitie en Veiligheid en het
      Centrum voor Criminaliteitspreventie en Veiligheid;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel47
  - number: 4:7.2.f
    text: |-
      het voor bovengenoemde taken binnen de directie fungeren als aanspreekpunt voor DG-Control, de dienst Financieel-
      economische Zaken en Control, de Auditdienst, de Algemene Rekenkamer en het ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel47
  - number: 5:1
    text: 'De directie Crisisbeheersing bestaat uit de volgende afdelingen:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel51
  - number: 5:1.a
    text: het Bedrijfsbureau (BB);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel51
  - number: 5:1.b
    text: de afdeling Bestuurlijke en Juridische Zaken (BJZ);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel51
  - number: 5:1.c
    text: het Expertisecentrum Risico- en Crisiscommunicatie (ERC);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel51
  - number: 5:1.d
    text: de afdeling Risicobeleid (RB);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel51
  - number: 5:1.e
    text: de afdeling Preparatie Centraal (PC);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel51
  - number: 5:1.f
    text: de afdeling Preparatie Decentraal (PD);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel51
  - number: 5:1.g
    text: de afdeling Nationaal Coördinatiecentrum (NCC).
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel51
  - number: 5:2.1
    text: Het Bedrijfsbureau staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel52
  - number: 5:2.2
    text: 'Het bureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel52
  - number: 5:2.2.a
    text: het ondersteunen van de directieleiding, inclusief plaatsvervangend directeur Crisisbeheersing als hoofd NCC;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel52
  - number: 5:2.2.b
    text: |-
      het voorbereiden van vergaderingen, waaronder het MT Crisisbeheersing en de overleggen waarvan het bedrijfsbureau
      het secretariaat voert;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel52
  - number: 5:2.2.c
    text: het coördineren van parlementaire aangelegenheden, Algemene Overleggen en ministerraadstukken;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel52
  - number: 5:2.2.d
    text: het introduceren van nieuwe medewerkers;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel52
  - number: 5:2.2.e
    text: het coördineren van Beleidsprocessen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel52
  - number: 5:2.2.f
    text: het verzorgen van administratie en documentatie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel52
  - number: 5:2.2.g
    text: het ondersteunen van het operationeel proces van het NCC.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel52
  - number: 5:3.1
    text: De afdeling Bestuurlijke en Juridische Zaken staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel53
  - number: 5:3.2
    text: 'De afdeling voert de volgende taken uit t.b.v. de directie Crisisbeheersing en de directie Brandweer en GHOR:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel53
  - number: 5:3.2.a
    text: |-
      het uitvoeren van de juridische control onder meer door middel van het toetsen van producten en voornemens van
      de directie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel53
  - number: 5:3.2.b
    text: |-
      het adviseren over politiek bestuurlijke aspecten van het directiebeleid en het coördineren van parlementaire
      aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel53
  - number: 5:3.2.c
    text: |-
      het adviseren over de bestuurlijke structuur en het bestuurlijk juridisch kader waarbinnen de crisis- en
      rampenbeheersing is georganiseerd;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel53
  - number: 5:3.2.d
    text: het adviseren over de bestuurlijk-juridische aspecten bij de voorbereiding van wetgeving;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel53
  - number: 5:3.2.e
    text: het behandelen van bezwaar- en beroepszaken;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel53
  - number: 5:3.2.f
    text: |-
      het verlenen van bestuurlijke en juridische ondersteuning bij de totstandkoming van beleid, het opstellen van
      regelgeving en het behandelen van juridische vraagstukken van algemene aard voor de directie Crisisbeheersing en in
      voorkomende gevallen andere directies binnen DGV en voor de departementsleiding.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel53
  - number: 5:4.1
    text: Het expertisecentrum Risico- en Crisiscommunicatie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel54
  - number: 5:4.2
    text: 'Het centrum heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel54
  - number: 5:4.2.a
    text: |-
      het verzamelen van kennis en het ontwikkelen van expertise op het terrein van crisis- en risicocommunicatie; het
      beschikbaar maken van deze kennis en expertise voor overheidsinstanties;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel54
  - number: 5:4.2.b
    text: het ontwikkelen van beleid op het gebied van risico- en crisiscommunicatie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel54
  - number: 5:4.2.c
    text: |-
      het adviseren over de communicatiestrategie rond thema’s, onderwerpen of gebeurtenissen die kunnen uitgroeien tot
      een crisis;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel54
  - number: 5:4.2.d
    text: het adviseren over de communicatiestrategie ten tijde van een werkelijke crisis;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel54
  - number: 5:4.2.e
    text: |-
      het eventueel leiding geven aan de uitvoering van de communicatiestrategie en/of het ondersteuning bieden op het
      gebied van woordvoering, publieks- en verwanteninformatie en nieuwe media;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel54
  - number: 5:4.2.f
    text: |-
      het verzorgen van opleidingen voor voorlichters, communicatieadviseurs en bestuurders op het gebied van risico- en
      crisiscommunicatie en het organiseren van en participeren in oefeningen en trainingen op dit terrein;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel54
  - number: 5:4.2.g
    text: het verzorgen van de woordvoering voor de NCCB.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel54
  - number: 5:5.1
    text: De afdeling Risicobeleid staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel55
  - number: 5:5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel55
  - number: 5:5.2.a
    text: |-
      het monitoren en analyseren van politieke, maatschappelijke, economische, sociale en technische ontwikkelingen
      zowel nationaal als internationaal, voorzover die van invloed kunnen zijn op de publieke veiligheid in Nederland en
      kunnen leiden tot potentiële crises en rampen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel55
  - number: 5:5.2.b
    text: |-
      het analyseren van beleidsontwikkelingen die van invloed kunnen zijn op de publieke veiligheid van burgers en
      kunnen leiden tot mogelijke crises en rampen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel55
  - number: 5:5.2.c
    text: het opstellen en analyseren van mogelijke crisisscenario’s;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel55
  - number: 5:5.2.d
    text: |-
      het bijdragen aan de ontwikkeling van duidelijke beleidslijnen t.a.v. de rol die het thema veiligheid in het
      algemeen en de mogelijkheid van crisis- en rampenbeheersing in het bijzonder moet hebben binnen de (bestuurlijke)
      besluitvorming zowel publiek als privaat op alle niveaus;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel55
  - number: 5:5.2.e
    text: |-
      het, in samenspraak met andere departementen, ontwikkelen van een visie hoe crises en rampen zoveel als mogelijk te
      voorkomen en beheersbaar te maken;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel55
  - number: 5:5.2.f
    text: |-
      het, in samenspraak met partners in veiligheid, komen tot duidelijke en integrale beleidskaders, op grond waarvan
      risico’s en onveiligheid maatschappelijk geaccepteerd kunnen worden;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel55
  - number: 5:5.2.g
    text: |-
      het behartigen van de beleidsmatige aspecten van de Onderzoeksraad voor de Veiligheid (OVV) en, indien het voortouw
      ligt bij BZK, het coördineren van een reactie op de aanbevelingen van de OVV;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel55
  - number: 5:5.2.h
    text: |-
      het regisseren en coördineren van het continue beleidsproces ten aanzien van vitale infrastructuur; het waarborgen
      van de samenhang van de beschermende maatregelen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel55
  - number: 5:5.2.i
    text: |-
      het bijdragen aan beleidsvorming rond onderdelen die binnen de verantwoordelijkheid van BZK vallen ten aanzien van
      de vitale infrastructuur;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel55
  - number: 5:5.2.j
    text: het ontwikkelen van een beleidsvisie ter versterking van het algemene veiligheidsbewustzijn.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel55
  - number: 5:6.1
    text: De afdeling Preparatie Centraal staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:6.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:6.2.a
    text: |-
      het ontwikkelen van beleid om de verantwoordelijkheid van de minister van BZK ten aanzien van crisisbeheersing
      te versterken;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:6.2.b
    text: het ontwikkelen van beleid om de verantwoordelijkheid van de nationaal coördinator crisisbeheersing te versterken;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:6.2.c
    text: het coördineren van het interdepartementale beleid op het terrein van crisisbeheersing;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:6.2.d
    text: het ontwikkelen van instrumenten ten behoeve van crisisbesluitvorming;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:6.2.e
    text: het ontwikkelen van beleid met betrekking tot Early-warning systems;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:6.2.f
    text: het versterken van de centrale en interdepartementale planvorming;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:6.2.g
    text: |-
      het coördineren en uitvoeren van de rapportage aan de Tweede Kamer over de stand van zaken ten aanzien van crisis-
      en rampenbeheersing;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:6.2.h
    text: het ontwikkelen, uitvoeren en evalueren van het opleidings- en oefenbeleid voor preparatie en respons;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:6.2.i
    text: het invulling geven aan de interdepartementale beleidsafstemming ten aanzien van crisis- en rampenbeheersing;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:6.2.j
    text: het organiseren van oefening en preparatie van de respons voor interdepartementaal en bestuurlijk Nederland;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:6.2.k
    text: het opleiden en prepareren van medewerkers werkzaam in de respons;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:6.2.l
    text: |-
      het (mede)ontwikkelen van en participeren in de uitvoering van oefeningen internationaal, nationaal, provinciaal,
      regionaal en gemeentelijk en BZK;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:6.2.m
    text: het onderhouden van het Operationele Departementaal Handboek BZK;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:6.2.n
    text: het ontwikkelen en uitvoeren van het kwaliteitsborgingsysteem crisisbeheersing;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:6.2.o
    text: het evalueren van daadwerkelijke incidenten/crises gericht op preparatie en het functioneren van de respons.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel56
  - number: 5:7.1
    text: De afdeling Preparatie Decentraal staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel57
  - number: 5:7.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel57
  - number: 5:7.2.a
    text: het meetbaar en toetsbaar maken van het zorgniveau van de rampenbestrijding en crisisbeheersing;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel57
  - number: 5:7.2.b
    text: |-
      het verbeteren van de voorbereiding van en de respons op een (dreigende) terroristische aanslag met nucleaire,
      biologische en/of chemische middelen, die zoveel mogelijk aansluit bij bestaande structuren van crisisbeheersing
      en rampenbestrijding;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel57
  - number: 5:7.2.c
    text: het ontwikkelen van specifiek beleid t.a.v. crisistypen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel57
  - number: 5:7.2.d
    text: het versterken van de decentrale planvorming;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel57
  - number: 5:7.2.e
    text: het vaststellen van de beleidskaders t.a.v. het waarschuwen van en het geven van voorlichting aan burgers;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel57
  - number: 5:7.2.f
    text: |-
      het organiseren van de totstandkoming van een samenhangend en gecoördineerd beleid van rijk, provincies en
      gemeenten ten aanzien van de rampenbestrijding en crisisbeheersing in brede zin;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel57
  - number: 5:7.2.g
    text: |-
      het invulling geven aan de toezichthoudende rol van BZK ten aanzien van de voorbereiding op de rampenbestrijding en
      de crisisbeheersing door de lagere overheden en hulpverleningsorganisaties;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel57
  - number: 5:7.2.h
    text: het ontwikkelen van integraal kwaliteitsbeleid t.a.v. rampenbestrijding en crisisbeheersing;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel57
  - number: 5:7.2.i
    text: |-
      het invulling geven aan de beleidsverantwoordelijkheid voor de afhandeling van schade bij rampen en zware
      ongevallen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel57
  - number: 5:7.2.j
    text: het uitvoeren van beleid ten aanzien van nazorg door het Rijk, de provincies en gemeenten;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel57
  - number: 5:7.2.k
    text: het evalueren van crises en rampen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel57
  - number: 5:7.2.l
    text: het initiëren van onderzoek op rampen- en crisisbeheersingsgebied.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel57
  - number: 5:8.1
    text: |-
      De afdeling Nationaal Coördinatiecentrum staat onder leiding van een hoofd tevens plaatsvervangend Nationaal
      Coördinator Crisisbeheersing.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel58
  - number: 5:8.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel58
  - number: 5:8.2.a
    text: |-
      het signaleren van (dreigende) potentiële crises of rampen en van (dreigende) ingrijpende verstoringen van de
      openbare orde en veiligheid die de coördinatie van BZK vereist en het daadwerkelijk inspelen op gebeurtenissen/
      evenementen waarbij een dergelijke situatie kan ontstaan en het reageren daarop;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel58
  - number: 5:8.2.b
    text: het voorbereiden van de daadwerkelijke reactie van de minister van BZK op crises en rampen of de dreiging daarvan;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel58
  - number: 5:8.2.c
    text: |-
      het formuleren van protocollen voor de besluitvorming en van handboeken voor de (voorbereiding van de) aanpak bij
      (dreigende) crises of rampen en de bijstelling daarvan op basis van de ervaringen in de praktijk;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel58
  - number: 5:8.2.d
    text: |-
      het signaleren van ervaringen die moeten leiden tot een bijstelling van het beleid ten aanzien van crises en
      rampen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel58
  - number: 5:8.2.e
    text: het ontwikkelen van beleid dat direct gerelateerd is aan de uitvoering van de responsfase;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel58
  - number: 5:8.2.f
    text: |-
      het coördineren van interbestuurlijke en -departementale inzet voor bijstand op het gebied van crisibeheersing
      rampenbestrijding en handhaving openbare orde;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel58
  - number: 5:8.2.g
    text: |-
      het coördineren van interdepartementale inzet voor bijstand en het faciliteren conform Nationaal Handboek
      Crisisbeheersing ten tijde van (dreigende) crises;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel58
  - number: 5:8.2.h
    text: het fungeren als International Point of Contact voor Internationale bijstands- en hulpverleningsverzoeken;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel58
  - number: 5:8.2.i
    text: het verzorgen van informatie-uitwisseling bij grensoverschrijdende incidenten;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel58
  - number: 5:8.2.j
    text: het uitvoeren van de raak van de Minister op het gebied van bijstandsverlening.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel58
  - number: 6:1
    text: 'De directie Brandweer en GHOR bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel61
  - number: 6:1.a
    text: de stafafdeling (S);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel61
  - number: 6:1.b
    text: de afdeling Bestuur en Organisatie (B&O);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel61
  - number: 6:1.c
    text: de afdeling Taken Brandweer en GHOR (TBG);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel61
  - number: 6:1.d
    text: de afdeling Kwaliteit Personeel en Materieel (KPM);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel61
  - number: 6:1.e
    text: de afdeling Financiën (F);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel61
  - number: 6:1.f
    text: de afdeling Kennis- en Informatiemanagement (KIM);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel61
  - number: 6:1.g
    text: de afdeling Uitvoering en Beheer (U&B).
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel61
  - number: 6:2.1
    text: Het stafafdeling staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel62
  - number: 6:2.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel62
  - number: 6:2.2.a
    text: het coördineren van beheersaangelegenheden binnen de directie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel62
  - number: 6:2.2.b
    text: het bewaken van de voortgang van de beleidsprocessen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel62
  - number: 6:2.2.c
    text: het coördineren van de interne besluitvormingsprocedures en verantwoordingscycli;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel62
  - number: 6:2.2.d
    text: het bewaken van de voortgang en kwaliteit van de stukkenstroom naar de departementsleiding en de bewindspersonen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel62
  - number: 6:2.2.e
    text: het ondersteunen van de secretariaatswerkzaamheden binnen de directie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel62
  - number: 6:2.2.f
    text: |-
      het coördineren van de parlementaire aangelegenheden, het fungeren als centraal aanspreekpunt bij het Algemeen
      Overleg;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel62
  - number: 6:2.2.g
    text: het bewaken van de voortgang en de samenhang bij de beantwoording van de kamervragen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel62
  - number: 6:2.2.h
    text: het voeren van overleg met stafafdelingen binnen DGV/MTV.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel62
  - number: 6:3.1
    text: De afdeling Bestuur en Organisatie staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel63
  - number: 6:3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel63
  - number: 6:3.2.a
    text: het zorgdragen voor de financiering van de brandweer en GHOR;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel63
  - number: 6:3.2.b
    text: het ontwikkelen en toepassen van een kwaliteitssysteem voor brandweer en GHOR;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel63
  - number: 6:3.2.c
    text: |-
      het versterken van de toepassing van relevante ondersteunende faciliteiten zoals informatie, communicatie en
      technologie (ICT) voorzieningen in een multidisciplinaire context, binnen de beleidskaders van de directie
      Strategie ten aanzien van ICT;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel63
  - number: 6:3.2.d
    text: het uitvoeren van de bijdrageregeling inzake explosieven;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel63
  - number: 6:3.2.e
    text: |-
      het versterken van de bestuurlijke organisatie door beleidsontwikkeling gericht op de kolom van respectievelijk
      brandweer en GHOR ten aanzien van de versterking van de organisatie door het stellen van kwaliteits- en prestatie-
      eisen.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel63
  - number: 6:4.1
    text: De afdeling Taken Brandweer en GHOR staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel64
  - number: 6:4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel64
  - number: 6:4.2.a
    text: het voeren van een taakdiscussie met brandweer en voor zover relevant voor de GHOR;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel64
  - number: 6:4.2.b
    text: het ontwikkelen van beleid ten aanzien van fysieke veiligheidsvraagstukken;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel64
  - number: 6:4.2.c
    text: |-
      het uitvoeren van het [Besluit Bedrijfsbrandweren][ref1], het evalueren van het Besluit en het zorgdragen voor
      afstemming tussen bedrijfsbrandweren en brandweerkorpsen;


      [ref1]: https://wetten.overheid.nl/BWBR0004694
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004694
  - number: 6:4.2.d
    text: het ontwikkelen van adequaat instrumentarium;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel64
  - number: 6:4.2.e
    text: |-
      het bevorderen en versterken van de positie van de brandweer en GHOR als veiligheidsadviseurs ten aanzien van
      lokale veiligheidstaken;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel64
  - number: 6:4.2.f
    text: het ontwikkelen van beleid met betrekking tot veiligheidsbewustzijn;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel64
  - number: 6:4.2.g
    text: |-
      het afstemmen van het beleid van de directie Crisisbeheersing ten aanzien van de multidisciplinaire taken van
      brandweer en GHOR;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel64
  - number: 6:4.2.h
    text: het afstemmen van beleid inzake GHOR en dagelijkse zorg met VWS;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel64
  - number: 6:4.2.i
    text: het toetsen van de kwetsbaarheid van brandweer en GHOR met betrekking tot vitale infrastructuur;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel64
  - number: 6:4.2.j
    text: |-
      het bevorderen en versterken van de positie van de brandweer en GHOR als veiligheidsadviseurs ten aanzien van
      lokale veiligheidstaken;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel64
  - number: 6:4.2.k
    text: het ontwikkelen van beleid voor opschaling.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel64
  - number: 6:5.1
    text: De afdeling Kwaliteit Personeel en Materieel staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel65
  - number: 6:5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel65
  - number: 6:5.2.a
    text: het stellen van kwaliteitseisen ten aanzien van de werving en selectie van brandweer- en GHOR-personeel;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel65
  - number: 6:5.2.b
    text: het ontwikkelen van een systeem gericht op vakbekwaamheidscertificatie voor de brandweer;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel65
  - number: 6:5.2.c
    text: |-
      het coördineren van bestuurlijk en operationeel opleiden en oefenen, zowel monodisciplinair als ten behoeve van
      grootschalig optreden van brandweer en GHOR;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel65
  - number: 6:5.2.d
    text: |-
      vanuit het opdrachtgeverschap van de Landelijke Faciliteit voor de Rampenbestrijding (LFR) het zorgdragen voor
      adequaat materieel;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel65
  - number: 6:5.2.e
    text: |-
      het ontwikkelen van beleid ten aanzien van het Nederlands Instituut voor de Brandweerzorg (NIBRA) en beleid ten
      aanzien van het Nederlands Bureau Brandweer Examens (Nbbe);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel65
  - number: 6:5.2.f
    text: het samenwerken als counterpartner met het Landelijk Management Development politie en brandweer.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel65
  - number: 6:6.1
    text: De afdeling Financiën staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel66
  - number: 6:6.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel66
  - number: 6:6.2.a
    text: het adviseren over de financieel-economische aspecten van het directiebeleid in brede zin;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel66
  - number: 6:6.2.b
    text: het zorgdragen voor de directiespecifieke bijdrage aan de begrotings- en verantwoordingscyclus;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel66
  - number: 6:6.2.c
    text: |-
      het initiëren en coördineren van de totstandkoming van het jaarplan/bestedingsplan van de directie en
      het bevorderen van een systematische uitvoering ervan, inclusief het (laten) verstrekken van relevante
      managementinformatie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel66
  - number: 6:6.2.d
    text: het houden van toezicht op Nbbe, NIBRA, Rode Kruis, Reddingsbrigade Nederland;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel66
  - number: 6:6.2.e
    text: het uitvoeren van specifieke taken met betrekking tot het Interim Besluit doeluitkering bestrijding;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel66
  - number: 6:6.2.f
    text: het tevens uitvoeren van bovengenoemde taken voor de directie Crisisbeheersing;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel66
  - number: 6:6.2.g
    text: |-
      het voor bovengenoemde taken binnen de directie fungeren als aanspreekpunt voor DG-Control, de dienst Financieel-
      economische Zaken en Control, de Auditdienst, de Algemene Rekenkamer en het ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel66
  - number: 6:7.1
    text: De afdeling Kennis- en Informatiemanagement (KIM) staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel67
  - number: 6:7.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel67
  - number: 6:7.2.a
    text: het voeren van het relatiebeheer ten behoeve van de directies Brandweer en Crisisbeheersing;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel67
  - number: 6:7.2.b
    text: het zorgdragen voor het kennismanagement en de informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel67
  - number: 6:7.2.c
    text: |-
      het coördineren van onderzoek voorzover het de specifieke verantwoordelijkheid van de directies Brandweer en
      Crisisbeheersing betreft;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel67
  - number: 6:7.2.d
    text: het zorgdragen voor monitoring en trendsignalering.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel67
  - number: 6:8.1
    text: De afdeling Uitvoering en Beheer staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel68
  - number: 6:8.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel68
  - number: 6:8.2.a
    text: |-
      de vertaling van het directiebeleid op het gebied van rampenbeheersing en brandweerzorg in benodigd materieel,
      telecommunicatie, geneeskundige hulpverlening, logistiek en in beleid betreffende het waarschuwen van bevolking;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel68
  - number: 6:8.2.b
    text: |-
      het verstrekken van extra materieel voor grootschalige brandbestrijding en technische hulpverlening aan de
      regionale brandweren;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel68
  - number: 6:8.2.c
    text: |-
      het verstrekken van extra materieel voor de geneeskundige hulpverlening bij ongevallen en rampen alsmede de
      bijzonder politiemiddelen voor de directie Politie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel68
  - number: 6:8.2.d
    text: |-
      het voor evengenoemde taken op centraal niveau ontwikkelen van beleid, overgaan tot aanbesteding en ontwikkelen van
      logistieke beleidskaders voor de instandhouding ervan;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel68
  - number: 6:8.2.e
    text: |-
      het beheer van bijzondere (politie)middelen, de uitrustingen voor de rampenbestrijdingen en de distributie en
      inname van uitrustingen wordt uitgevoerd door het Logistiek Centrum Zoetermeer.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel68
  - number: 7:1
    text: 'De directie Politie bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel71
  - number: 7:1.a
    text: de stafafdeling (S);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel71
  - number: 7:1.b
    text: 'het cluster Organisatie, Taken en Bevoegdheden Politie bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel71
  - number: 7:1.b.a
    text: de afdeling Bestuurlijke en Juridische Zaken (BJZ);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel71
  - number: 7:1.b.b
    text: de afdeling Politieel Veiligheidsbeleid (PVB);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel71
  - number: 7:1.c
    text: 'het cluster Personeel Politie bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel71
  - number: 7:1.c.a
    text: de afdeling Arbeidsvoorwaardenbeleid (AB);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel71
  - number: 7:1.c.b
    text: de afdeling Onderwijs en Loopbaanbeleid (O&L);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel71
  - number: 7:1.d
    text: 'het cluster Middelen bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel71
  - number: 7:1.d.a
    text: de afdeling Financiën (F);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel71
  - number: 7:1.d.b
    text: de afdeling Bedrijfsvoeringsbeleid (BB);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel71
  - number: 7:1.e
    text: 'het cluster Kennisontwikkeling en Relatiebeheer bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel71
  - number: 7:1.e.a
    text: de afdeling Relatiebeheer (RB);
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel71
  - number: 7:1.e.b
    text: de afdeling Informatie, Kennisontwikkeling en Onderzoek (IKOO).
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel71
  - number: 7:2.1
    text: De stafafdeling staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel72
  - number: 7:2.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel72
  - number: 7:2.2.a
    text: |-
      het coördineren van alle afdelingsoverstijgende beleids- en bestuursaangelegenheden van de directie Politie en
      in voorkomende gevallen advisering hierover; het beleidsinhoudelijke ondersteunen van de directieleiding in de
      beantwoording van burgerbrieven;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel72
  - number: 7:2.2.b
    text: het voeren van het ambtelijk secretariaat van diverse interne en externe overleggen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel72
  - number: 7:2.2.c
    text: het coördineren van parlementaire aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel72
  - number: 7:2.2.d
    text: het verzorgen van interne en externe informatievoorziening over de directie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel72
  - number: 7:2.2.e
    text: het optreden als aanspreekpunt voor het facility-management van de directie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel72
  - number: 7:2.2.f
    text: het coördineren van het managementassistententeam van de directie.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel72
  - number: 7:3.1
    text: De afdeling Bestuurlijke en Juridische Zaken staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel73
  - number: 7:3.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel73
  - number: 7:3.2.a
    text: |-
      het ontwikkelen van beleidskaders, onder meer ter zake van (wijzigingen van) de [Politiewet 1993][ref1] en de
      daarop gebaseerde regelgeving; het evalueren van en zorgen voor de implementatie van aangekondigde maatregelen;


      [ref1]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006299
  - number: 7:3.2.b
    text: |-
      het verlenen van bestuurlijke en juridische ondersteuning bij de totstandkoming van beleid, het opstellen van
      regelgeving en het behandelen van juridische vraagstukken van algemene aard voor de directie Politie en in
      voorkomende gevallen andere directies binnen DGV en voor de departementsleiding;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel73
  - number: 7:3.2.c
    text: het ontwikkelen van beleid ten aanzien van openbare ordehandhaving.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel73
  - number: 7:4.1
    text: De afdeling Politieel Veiligheidsbeleid staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel74
  - number: 7:4.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel74
  - number: 7:4.2.a
    text: het ondersteunen van de korpsen bij de ontwikkeling en uitvoering van hun beleid;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel74
  - number: 7:4.2.b
    text: het ontwikkelen van kaders voor (bovenregionale) samenwerking en voorzieningen binnen het politieconcern;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel74
  - number: 7:4.2.c
    text: |-
      het adviseren ten aanzien van beleid op het vlak van de taken, de organisatie en de professionaliteit van de
      politie, op zowel korps- als concernniveau;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel74
  - number: 7:4.2.d
    text: |-
      het bewaken en monitoren van de uitvoering van politiële taken als opsporing, toezicht, handhaving,
      noodhulpverlening en kerntaken;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel74
  - number: 7:4.2.e
    text: het stimuleren van het innovatief vermogen in de korpsen.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel74
  - number: 7:5.1
    text: De afdeling Arbeidsvoorwaardenbeleid staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel75
  - number: 7:5.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel75
  - number: 7:5.2.a
    text: |-
      het voorbereiden en tot stand brengen van een arbeidsvoorwaardenbeleid (CAO) voor de politieorganisatie, inclusief
      het georganiseerd overleg met de politievakorganisaties;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel75
  - number: 7:5.2.b
    text: het zorgen voor vastlegging van het arbeidsvoorwaardenbeleid in (rechtspositionele) wet- en regelgeving;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel75
  - number: 7:5.2.c
    text: |-
      het voor de politiekorpsen fungeren als aanspreek- en informatiepunt met betrekking tot vraagstukken op het gebied
      van de rechtspositie en arbeidsvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel75
  - number: 7:5.2.d
    text: |-
      het ten behoeve van een aantal overlegvormen op het terrein van arbeidsvoorwaardenbeleid verzorgen van het
      secretariaat, en regisseren van de voorbereiding, inbreng, voortgang, resultaten en onderlinge afstemming.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel75
  - number: 7:6.1
    text: De afdeling Onderwijs en Loopbaanbeleid staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel76
  - number: 7:6.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel76
  - number: 7:6.2.a
    text: het ontwikkelen, vaststellen en evalueren van beleid betreffende het politieonderwijs en de inrichting ervan;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel76
  - number: 7:6.2.b
    text: het ontwerpen van eisen aan toekomstig onderwijs;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel76
  - number: 7:6.2.c
    text: het vaststellen van het eindniveau en de duur van verplichte opleidingen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel76
  - number: 7:6.2.d
    text: |-
      het ontwikkelen, vaststellen en evalueren van beleid betreffende de verdere ontwikkeling van medewerkers voor het
      op peil houden van de eenheid en de kwaliteit van de politie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel76
  - number: 7:6.2.e
    text: het beheren van het systeem van functiewaardering;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel76
  - number: 7:6.2.f
    text: het vaststellen van de topformatie van de regiokorpsen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel76
  - number: 7:6.2.g
    text: het ontwikkelen en uitvoeren van het diversiteits- en het integriteitsbeleid;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel76
  - number: 7:6.2.h
    text: het afstemmen van het landelijke en regionaal loopbaanbeleid;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel76
  - number: 7:6.2.i
    text: het ondersteunen van het regionaal en landelijk wervingsbeleid.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel76
  - number: 7:7.1
    text: De afdeling Bedrijfsvoeringsbeleid staat onder leiding van een hoofd
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel77
  - number: 7:7.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel77
  - number: 7:7.2.a
    text: |-
      het vormgeven en onderhouden van het bekostigingsstelsel (gecombineerd stelsel van algemene, bijzondere en
      aanvullende bijdragen) voor de Nederlandse politie en het politieonderwijs. Uitgangspunt van het stelsel is een
      evenwichtige allocatie van de middelen van het Rijk;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel77
  - number: 7:7.2.b
    text: |-
      het inhoudelijk toetsen van begrotingen en jaarrekeningen van korpsen. Politieacademie en (op te richten)
      samenwerkingsverbanden binnen de Nederlandse politie (w.o. ICT-voorzieningen) en het beoordelen van het financieel
      beheer van deze organisaties;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel77
  - number: 7:7.2.c
    text: het vernieuwen en onderhouden van comptabele regelgeving;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel77
  - number: 7:7.2.d
    text: het ontwikkelen van beleidskaders en instrumenten ter bevordering van doelmatige bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel77
  - number: 7:7.2.e
    text: |-
      het actief bevorderen van vergelijkbaarheid van korpsen door middel van uniformering, standaardisering en
      stimulering;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel77
  - number: 7:7.2.f
    text: het ontwikkelen van beleid op het terrein van ICT politie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel77
  - number: 7:7.2.g
    text: |-
      het zorgdragen van de bekostiging van bewapening; uitrusting en kleding van politie alsmede het zorgdragen voor
      landelijke facilitaire voorzieningen ten behoeve van de politie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel77
  - number: 7:7.2.h
    text: |-
      het adviseren van de overige beleidsafdelingen van DGV over beleidsdossiers waarbij bedrijfsvoering van de korpsen
      en de Politieacademie een rol speelt.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel77
  - number: 7:8.1
    text: De afdeling Financiën staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel78
  - number: 7:8.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel78
  - number: 7:8.2.a
    text: advisering over de financieel-economische aspecten van het directiebeleid in brede zin;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel78
  - number: 7:8.2.b
    text: zorgdragen voor de directie-specifieke bijdrage aan de begrotings- en verantwoordingscyclus;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel78
  - number: 7:8.2.c
    text: |-
      initiëren en coördineren van de totstandkoming van het jaarplan/bestedingsplan van de directie en het bevorderen
      van een systematische uitvoering ervan, inclusief het (laten) verstrekken van relevante managementinformatie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel78
  - number: 7:8.2.d
    text: |-
      het voor bovengenoemde taken binnen de directie fungeren als aanspreekpunt voor DG-Control, de dienst Financieel-
      economische Zaken en Control, de Auditdienst, de Algemene Rekenkamer en het ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel78
  - number: 7:9.1
    text: De afdeling Relatiebeheer staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel79
  - number: 7:9.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel79
  - number: 7:9.2.a
    text: |-
      het fungeren als aanspreekpunt voor en het informeren van de politiekorpsen over relevante (beleids)ontwikkelingen
      en trends;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel79
  - number: 7:9.2.b
    text: het verkrijgen van inzicht in de effecten van beleid in de politiekorpsen;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel79
  - number: 7:9.2.c
    text: |-
      het voorbereiden van gesprekken met de korpsbeheerder/korpschef inzake de uitvoering van de prestatieafspraken in
      het kader van de beleids- en beheerscyclus Rijk-regio;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel79
  - number: 7:9.2.d
    text: het voorbereiden van werkbezoeken van de minister(s) en ambtelijke leiding aan politiekorpsen.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel79
  - number: 7:10.1
    text: De afdeling Informatie, Kennisontwikkeling en Onderzoek staat onder leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel710
  - number: 7:10.2
    text: 'De afdeling heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel710
  - number: 7:10.2.a
    text: |-
      het vergaren, delen, borgen, veredelen en analyseren van kennis en informatie op het terrein van politie, alsmede
      het intern en extern beschikbaar stellen daarvan;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel710
  - number: 7:10.2.b
    text: het bevorderen van het gebruik van kennis en informatie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel710
  - number: 7:10.2.c
    text: |-
      het ontwikkelen en bewaken van een samenhangend onderzoeksbeleid voor de directie, inclusief directiebrede
      onderzoekscoördinatie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel710
  - number: 7:10.2.d
    text: het ontwikkelen en bewaken van de strategische beleidsagenda van de directie;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel710
  - number: 7:10.2.e
    text: |-
      het bewaken van de voortgang van de resultaatsafspraken met de politiekorpsen door gegevensverzameling,
      (trend)analyse, probleemverkenning en ontwikkeling van meetinstrumenten;
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel710
  - number: 7:10.2.f
    text: het ontwikkelen en bewaken van beleidskaders ten behoeve van informatie-uitwisseling.
    url: https://wetten.overheid.nl/BWBR0017848/2006-01-01#Artikel710
