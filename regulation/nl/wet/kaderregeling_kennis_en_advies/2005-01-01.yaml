preamble:
  text: |-
    Gelet op de artikelen 2 en 4 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            minister:

              Minister van Landbouw, Natuur en Voedselkwaliteit;



            b
            landbouw:

              akkerbouw, weidebouw, veehouderij, pluimveehouderij, tuinbouw - daaronder begrepen fruitteelt en het kweken
      van bomen, bloemen en bloembollen - teelt van griendhout en elke andere vorm van bodemcultuur hier te lande met
      uitzondering van bosbouw;



            c
            landbouwbedrijf:

              geheel van productie-eenheden in Nederland bestaande uit een of meer gebouwen of gedeelten daarvan en
      daarbijbehorende landbouwgrond, uitsluitend of in hoofdzaak dienende tot uitoefening van de landbouw;



            d
            ondernemer:

              natuurlijke persoon of privaatrechtelijke rechtspersoon, die voor eigen rekening en risico een
      landbouwbedrijf uitoefent of voornemens is uit te oefenen;



            e
            deskundige:

              natuurlijke persoon of privaatrechtelijke rechtspersoon, die door beroep in het bijzonder bekwaam is een
      ondernemer te adviseren, dan wel de in [artikel 2][ref1] bedoelde activiteiten uit te voeren;



            f
            bevordering van de productie en de afzet:

              bevordering van de productie en de afzet van landbouwproducten van hoge kwaliteit als bedoeld in afdeling
      13 van de Communautaire richtsnoeren voor staatssteun in de landbouwsector, PbEG 2000, C 28;



            g
            technische ondersteuning:

              technische ondersteuning in de landbouwsector als bedoeld in afdeling 14 van de Communautaire richtsnoeren
      voor staatssteun in de landbouwsector, PbEG 2000, C 28;



            h
            Dienst Regelingen:

              Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0014105#Artikel2
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014105
        artikel: '2'
        paragraaf: II
  - number: '2'
    text: |-
      De minister kan ter stimulering van de duurzame ontwikkeling van de agrarische sector op aanvraag subsidie
      verstrekken aan ondernemers ter zake van de volgende categorieën van activiteiten:
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel2
  - number: 2.a
    text: het consulteren van deskundigen met het oog op de bedrijfsontwikkeling of -beëindiging;
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel2
  - number: 2.b
    text: |-
      het laten verrichten van bedrijfsdoorlichtingen, met uitzondering van kwaliteits- en productcontroles, door
      deskundigen;
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel2
  - number: 2.c
    text: |-
      het laten verrichten van onderzoek, met uitzondering van kwaliteits- en productcontroles, door deskundigen met het
      oog op de ontwikkeling van landbouwproducten van hoge kwaliteit;
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel2
  - number: 2.d
    text: het consulteren van deskundigen ten behoeve van het opstellen van plannen gericht op de bedrijfsontwikkeling;
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel2
  - number: 2.e
    text: het consulteren van deskundigen ten behoeve van het opstellen van plannen gericht op de bedrijfsbeëindiging;
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel2
  - number: 2.f
    text: |-
      het volgen van opleidingen of trainingen door ondernemers gericht op de bedrijfsontwikkeling bij daartoe
      gespecialiseerde instellingen of organisaties, of
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel2
  - number: 2.g
    text: |-
      het volgen van opleidingen of trainingen door ondernemers gericht op de bedrijfsbeëindiging bij daartoe
      gespecialiseerde instellingen of organisaties.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel2
  - number: '3'
    text: 'Geen subsidie wordt verleend:'
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel3
  - number: 3.a
    text: |-
      voor in [artikel 2][ref1] bedoelde activiteiten waarmee een begin van uitvoering is gemaakt alvorens de ontvangst
      van een aanvraag tot subsidieverlening schriftelijk aan de aanvrager is bevestigd;


      [ref1]: https://wetten.overheid.nl/BWBR0014105#Artikel2
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014105
        artikel: '2'
        paragraaf: II
  - number: 3.b
    text: |-
      voor in [artikel 2][ref1] bedoelde activiteiten, waarvoor op grond van enig ander wettelijk voorschrift subsidie
      wordt verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0014105#Artikel2
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014105
        artikel: '2'
        paragraaf: II
  - number: 3.c
    text: |-
      voor opleidingen en trainingen die onderdeel van normale programma's of van leergangen voor middelbaar of hoger
      landbouw- en bosbouwonderwijs vormen;
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel3
  - number: 3.d
    text: indien de bij de beschikking tot subsidieverlening vast te stellen subsidie niet ten minste € 250,- bedraagt;
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel3
  - number: 3.e
    text: |-
      indien de subsidieverlening, voor zover betrekking hebbend op de categorie van activiteiten bedoeld in
      [artikel 2, onderdeel c][ref1], er toe zou leiden dat van overheidswege aan de ondernemer in een periode van drie
      jaar meer dan € 100.000 aan bijdragen voor de bevordering van de productie en de afzet wordt verstrekt, of


      [ref1]: https://wetten.overheid.nl/BWBR0014105#Artikel2
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014105
        artikel: '2'
        paragraaf: II
  - number: 3.f
    text: |-
      indien de subsidieverlening, voor zover betrekking hebbend op de categorieën van activiteiten bedoeld in
      [artikel 2, onderdelen a, b, d, e f en g][ref1] ertoe zou leiden dat van overheidswege aan de ondernemer in een
      periode van drie jaar meer dan € 100.000 aan bijdragen voor technische ondersteuning wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014105#Artikel2
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014105
        artikel: '2'
        paragraaf: II
  - number: '4.1'
    text: 'Als subsidiabele kosten worden uitsluitend aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel4
  - number: 4.1.a
    text: de door deskundigen in rekening gebrachte kosten, en
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel4
  - number: 4.1.b
    text: de door instellingen of organisaties in rekening gebrachte kosten van opleidingen en trainingen.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel4
  - number: '4.2'
    text: |-
      De kosten, bedoeld in het eerste lid, worden uitsluitend in aanmerking genomen voor zover deze kosten rechtstreeks
      zijn toe te rekenen aan één of meerdere van de in [artikel 2][ref1] bedoelde categorieën van activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0014105#Artikel2
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014105
        artikel: '2'
        paragraaf: II
  - number: '5.1'
    text: |-
      De minister kan per kalenderjaar één of meer aanvraagperioden vaststellen voor subsidieaanvragen op grond van deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel5
  - number: '5.2'
    text: |-
      De minister stelt voor iedere aanvraagperiode een subsidieplafond vast voor op grond van deze regeling te verlenen
      subsidies.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel5
  - number: '5.3'
    text: 'De minister kan per aanvraagperiode:'
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel5
  - number: 5.3.a
    text: |-
      één of meer van in [artikel 2][ref1] bedoelde categorieën van activiteiten aanwijzen, waarvoor subsidie kan worden
      aangevraagd;


      [ref1]: https://wetten.overheid.nl/BWBR0014105#Artikel2
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014105
        artikel: '2'
        paragraaf: II
  - number: 5.3.b
    text: criteria vaststellen ter zake van de activiteiten, waarvoor subsidie kan worden aangevraagd, of
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel5
  - number: 5.3.c
    text: één of meer categorieën van ondernemers aanwijzen, die subsidie kunnen aanvragen.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel5
  - number: '5.4'
    text: De minister maakt besluiten als bedoeld in het eerste tot en met het derde lid bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel5
  - number: '6.1'
    text: |-
      De subsidie bedraagt maximaal 75% van de subsidiabele kosten en per ondernemer niet meer dan € 8.000,- per
      aanvraagperiode.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel6
  - number: '6.2'
    text: |-
      De minister kan voor een aanvraagperiode het in het eerste lid bedoelde subsidiepercentage per categorie van
      activiteiten als bedoeld in [artikel 2][ref1] lager vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0014105#Artikel2
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014105
        artikel: '2'
        paragraaf: II
  - number: '6.3'
    text: |-
      De minister kan voor een aanvraagperiode de in het eerste lid bedoelde maximaal te verlenen subsidie lager
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel6
  - number: '6.4'
    text: De minister maakt besluiten als bedoeld in het tweede en derde lid bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel6
  - number: '7'
    text: |-
      Op grond van deze regeling wordt aan een ondernemer gedurende een periode van drie kalenderjaren maximaal €
      25.000,- aan subsidie verleend.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel7
  - number: '8'
    text: |-
      De aanvraag tot subsidieverlening wordt bij Dienst Regelingen ingediend, op een daartoe door Dienst Regelingen ter
      beschikking gesteld formulier.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel8
  - number: '9.1'
    text: De aanvragen tot subsidieverlening worden behandeld op volgorde van binnenkomst.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien door toewijzing van subsidieaanvragen met dezelfde datum van ontvangst het subsidieplafond als bedoeld
      in [artikel 6, tweede lid][ref1], zou worden overschreden, geschiedt de toewijzing volgens een rangschikking van
      de subsidieaanvragen, waarbij telkenmale de hoogst gerangschikte subsidieaanvraag het eerste voor toewijzing in
      aanmerking komt. De rangschikking vindt plaats volgens loting, die geschiedt door een door de minister aan te
      wijzen notaris.


      [ref1]: https://wetten.overheid.nl/BWBR0014105#Artikel6
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014105
        artikel: '6'
        paragraaf: II
  - number: '10.1'
    text: |-
      De subsidieverlening wordt geweigerd of ingetrokken indien de aanvrager naast de aanvraag tot subsidieverlening in
      hetzelfde kalenderjaar een andere aanvraag tot subsidieverlening op grond van deze regeling heeft ingediend en deze
      aanvraag door ernstige nalatigheid of opzet onjuist is.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel10
  - number: '10.2'
    text: |-
      De subsidieverlening wordt geweigerd of ingetrokken indien de aanvrager naast de aanvraag tot subsidieverlening in
      het voorgaande kalenderjaar een andere aanvraag tot subsidieverlening op grond van deze regeling heeft ingediend en
      deze aanvraag door opzet onjuist is.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel10
  - number: '11'
    text: De subsidieontvanger voert de activiteit uit,
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel11
  - number: 11.a
    text: overeenkomstig de aanvraag waarop de beschikking tot subsidieverlening betrekking heeft en
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel11
  - number: 11.b
    text: |-
      binnen 6 maanden na ontvangst van de beschikking tot subsidieverlening of in de gevallen dat in de beschikking tot
      subsidieverlening een andere termijn is genoemd, binnen deze termijn.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel11
  - number: '12.1'
    text: |-
      De aanvraag tot subsidievaststelling wordt binnen 9 maanden na ontvangst van de beschikking tot subsidieverlening
      ingediend bij Dienst Regelingen, op een daartoe door Dienst Regelingen ter beschikking gesteld formulier.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel12
  - number: '12.2'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 11, onderdeel b][ref1], laatste volzin, wordt de aanvraag tot
      subsidievaststelling binnen de op grond van dit artikel vastgestelde termijn ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0014105#Artikel11
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014105
        artikel: '11'
        paragraaf: IV
  - number: '12.3'
    text: 'De aanvraag tot subsidievaststelling gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel12
  - number: 12.3.a
    text: |-
      een afschrift van een factuur waaruit kan worden opgemaakt op welk tijdstip de activiteit is aangevangen en
      beëindigd;
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel12
  - number: 12.3.b
    text: een bankafschrift waaruit de betaling van de in onderdeel a bedoelde factuur blijkt, en
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel12
  - number: 12.3.c
    text: een schriftelijk bewijsstuk waaruit kan worden opgemaakt dat de activiteit daadwerkelijk verricht is.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel12
  - number: '13'
    text: 'De subsidievaststelling wordt geweigerd of ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel13
  - number: 13.a
    text: |-
      indien de aanvrager naast de aanvraag tot subsidievaststelling in hetzelfde kalenderjaar een andere aanvraag
      tot subsidieverlening of -vaststelling op grond van deze regeling heeft ingediend en deze aanvraag door ernstige
      nalatigheid of opzet onjuist is;
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel13
  - number: 13.b
    text: |-
      indien de aanvrager naast de aanvraag tot subsidieverstelling in het voorgaande kalenderjaar een andere aanvraag
      tot subsidieverlening of -vaststelling op grond van deze regeling heeft ingediend en deze aanvraag door opzet
      onjuist is;
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel13
  - number: 13.c
    text: |-
      indien de subsidievaststelling, voor zover betrekking hebbend op de categorie van activiteiten bedoeld in
      [artikel 2, onderdeel c][ref1], er toe zou leiden dat aan de ondernemer van overheidswege in een periode van drie
      jaar meer dan € 100.000 aan bijdragen voor de bevordering van de productie en de afzet wordt verstrekt, of


      [ref1]: https://wetten.overheid.nl/BWBR0014105#Artikel2
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014105
        artikel: '2'
        paragraaf: II
  - number: 13.d
    text: |-
      indien de subsidievaststelling, voor zover betrekking hebbend op de categorieën van activiteiten bedoeld in
      [artikel 2, onderdelen a, b, d, e f en g][ref1], er toe zou leiden dat van overheidswege aan de ondernemer in een
      periode van drie jaar meer dan € 100.000 aan bijdragen voor technische ondersteuning wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014105#Artikel2
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014105
        artikel: '2'
        paragraaf: II
  - number: '14.1'
    text: |-
      Een subsidie wordt verleend onder voorbehoud van goedkeuring van deze regeling door de Commissie van de Europese
      Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel14
  - number: '14.2'
    text: |-
      De beslissing tot verlening van een subsidie kan worden ingetrokken of gewijzigd indien dit noodzakelijk is ter
      verkrijging van de goedkeuring van de Commissie van de Europese Gemeenschappen of wegens het uitblijven ervan.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel14
  - number: '15'
    text: |-
      Met het toezicht op de naleving van deze regeling zijn belast de door de minister aangewezen ambtenaren van het
      Ministerie van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel15
  - number: '16'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel16
  - number: '17'
    text: 'Deze regeling wordt aangehaald als: Kaderregeling kennis en advies.'
    url: https://wetten.overheid.nl/BWBR0014105/2005-01-01#Artikel17
