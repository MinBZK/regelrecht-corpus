  - number: '79.2'
    text: |-
      De commandant zendt na het einde van het tuchtproces in eerste aanleg bericht omtrent de afloop daarvan aan het
      openbaar ministerie bij het in [artikel 81, eerste lid][ref1], bedoelde gerecht.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel81
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
  - number: '79.3'
    text: |-
      De toepassing van het bepaalde in het eerste lid doet niet af aan het formele recht tot strafvordering
      van het openbaar ministerie. Indien het strafbare feit wordt afgedaan met toepassing van
      [artikel 74 van het Wetboek van Strafrecht][ref1] of indien een vervolging terzake leidt tot een schuldigverklaring
      door de rechter, wordt bij het stellen van voorwaarden onderscheidenlijk bij de oplegging van een straf rekening
      gehouden met de wegens de schending van een gedragsregel van deze wet opgelegde straf.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '80.1'
    text: |-
      Indien de commandant gedurende het tuchtproces meent dat een in de beschuldiging omschreven gedraging niet de
      schending van een dienstvoorschrift oplevert, omdat dit dienstvoorschrift naar zijn oordeel in strijd is met
      een hogere regeling, schorst hij het tuchtproces, voorzover het deze gedraging betreft. De termijn bedoeld in
      [artikel 54, eerste lid, onder b][ref1], wordt in dat geval met de duur van de schorsing verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel54
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '54'
        hoofdstuk: V
        paragraaf: '1'
  - number: '80.2'
    text: |-
      Hij roept over de vermeende strijdigheid schriftelijk de beslissing in van het in [artikel 81, eerste lid][ref1],
      bedoelde gerecht onder overlegging van de op de zaak betrekking hebbende stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel81
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
  - number: '80.3'
    text: |-
      Indien het gerecht beslist dat het dienstvoorschrift niet in strijd is met een hogere regeling, deelt het deze
      beslissing mee aan de commandant. Deze hervat het tuchtproces met inachtneming van die beslissing.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80
  - number: '80.4'
    text: |-
      Indien het tuchtproces terzake van andere gedragingen inmiddels is voortgezet en geëindigd met een uitspraak,
      hervat de commandant, nadat hij de beslissing van het gerecht heeft ontvangen, het op grond van het
      eerste lid geschorste tuchtproces. De commandant neemt daarbij de door hem gegeven uitspraak in acht. De
      [artikelen 48, derde lid][ref1], en [75][ref2] zijn niet van toepassing met dien verstande dat een op te leggen
      straf gelijksoortig moet zijn aan de al opgelegde straf en het totaal het maximum niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel75
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '48'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '75'
        hoofdstuk: V
        paragraaf: '6'
  - number: '80.5'
    text: |-
      Indien de commandant reeds een beslissing heeft genomen als bedoeld in [artikel 74, derde lid][ref1], of de straf
      van berisping heeft opgelegd, kan alsnog een straf of een andere straf worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel74
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '74'
        hoofdstuk: V
        paragraaf: '6'
  - number: '80.6'
    text: |-
      Indien het gerecht beslist dat het dienstvoorschrift waaromtrent zijn beslissing is gevraagd in strijd is met een
      hogere regeling, spreekt het de beschuldigde vrij met betrekking tot de in het eerste lid bedoelde gedraging.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80
  - number: '80.7'
    text: Tegen de beslissing van het gerecht staat geen verdere voorziening open.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80
  - number: 80a.1
    text: |-
      De gestrafte kan binnen vijf dagen na de uitreiking van het afschrift van de uitspraak beklag doen bij de
      beklagmeerdere.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80a
  - number: 80a.2
    text: |-
      Onder de gestrafte wordt mede verstaan degene ten wiens aanzien een beslissing is genomen als bedoeld in
      [artikel 74, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel74
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '74'
        hoofdstuk: V
        paragraaf: '6'
  - number: 80a.3
    text: |-
      De gestrafte kan in beklag ook de beslissing van de commandant met betrekking tot de wijze van tenuitvoerlegging
      van een straf van strafdienst of van uitgaansverbod aan het oordeel van de beklagmeerdere onderwerpen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80a
  - number: 80b.1
    text: Het beklag wordt gedaan bij beklagschrift, dat bij de commandant wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80b
  - number: 80b.2
    text: De beklagprocedure vangt aan met de indiening van het beklagschrift bij de commandant.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80b
  - number: 80b.3
    text: |-
      Als dag van indiening geldt de dag van ontvangst van het beklagschrift door of namens de commandant. De dag van
      ontvangst wordt terstond op het beklagschrift aangetekend.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80b
  - number: 80c.1
    text: De commandant zendt het beklagschrift onverwijld door naar de beklagmeerdere.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80c
  - number: 80c.2
    text: |-
      Hij voegt daarbij alle op de zaak betrekking hebbende stukken met opgave van de bewijsmiddelen op grond waarvan hij
      tot de overtuiging is gekomen dat een in de beschuldiging omschreven gedraging heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80c
  - number: 80d.1
    text: |-
      Indien het beklagschrift na de beklagtermijn bedoeld in [artikel 80a, eerste lid][ref1], is ingediend, verklaart de
      beklagmeerdere het beklag niet ontvankelijk. Deze verklaring wordt vastgelegd in een schriftelijk stuk dat aan de
      gestrafte wordt uitgereikt. De datum van de uitreiking wordt op het schriftelijk stuk aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80a
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80d
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80a
        hoofdstuk: V
        paragraaf: '1'
  - number: 80d.2
    text: |-
      Ten aanzien van een na afloop van de beklagtermijn ingediend beklagschrift blijft niet-ontvankelijkverklaring
      achterwege indien redelijkerwijs niet kan worden geoordeeld dat de gestrafte in verzuim is geweest. Een beslissing
      ter zake is gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80d
  - number: 80e.1
    text: De gestrafte kan zich in ieder stadium van de beklagprocedure doen bijstaan door een vertrouwensman.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80e
  - number: 80e.2
    text: |-
      De [artikelen 57][ref1], [58][ref2], [59, met uitzondering van de laatste volzin van het tweede lid][ref3], en
      [60][ref4] zijn van overeenkomstige toepassing met dien verstande dat voor commandant wordt gelezen beklagmeerdere.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0004788#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0004788#Artikel60
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80e
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '57'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '58'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004788
        artikel: '59'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004788
        artikel: '60'
        hoofdstuk: V
        paragraaf: '2'
  - number: 80f.1
    text: De beklagmeerdere kan de gestrafte doen horen ter voorbereiding van het onderzoek op beklag.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80f
  - number: 80f.2
    text: |-
      De gestrafte is verplicht te verschijnen. [Artikel 80i, tweede lid, eerste volzin][ref1], is van overeenkomstige
      toepassing. De gestrafte is niet verplicht te antwoorden. Dit wordt hem voor of bij aanvang van het ter
      voorbereiding horen ter kennis gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80i
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80f
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80i
        hoofdstuk: V
        paragraaf: '2'
  - number: 80f.3
    text: |-
      De beklagmeerdere kan de commandant, getuigen en deskundigen horen of doen horen in ieder stadium van de
      beklagprocedure.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80f
  - number: 80f.4
    text: De verklaringen van de gehoorde personen worden schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80f
  - number: 80g.1
    text: |-
      De beklagmeerdere bepaalt op welke dag het onderzoek op beklag zal aanvangen. Deze dag kan niet later worden
      bepaald dan uiterlijk de dertigste dag na de dag van indiening van het beklagschrift.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80g
  - number: 80g.2
    text: |-
      De dagen waarop de gestrafte en de beklagmeerdere zich om redenen van dienst niet in hetzelfde land bevinden,
      tellen niet mee voor de bepaling van de termijn genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80g
  - number: 80h.1
    text: |-
      De gestrafte wordt door of namens de beklagmeerdere schriftelijk opgeroepen voor het onderzoek op beklag. Dit
      onderzoek vangt niet eerder aan dan op de tweede dag na de dag waarop de oproeping aan de gestrafte is uitgereikt,
      tenzij de gestrafte om eerdere behandeling verzoekt.[ Artikel 62][ref1] is van overeenkomstige toepassing met dien
      verstande dat voor beschuldiging wordt gelezen oproeping.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel62
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80h
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '62'
        hoofdstuk: V
        paragraaf: '3'
  - number: 80h.2
    text: De beklagmeerdere roept de commandant, de getuigen en deskundigen op wier verschijning hij nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80h
  - number: 80h.3
    text: |-
      De gestrafte en zijn vertrouwensman kunnen verzoeken dat ook andere getuigen en deskundigen worden gehoord. De
      beklagmeerdere voldoet aan dit verzoek, tenzij het onderzoek daardoor wordt geschaad of het verzoek kennelijk
      onredelijk is.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80h
  - number: 80h.4
    text: |-
      [Artikel 65, derde, vierde en vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel65
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80h
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '65'
        hoofdstuk: V
        paragraaf: '4'
  - number: 80i.1
    text: |-
      De beklagmeerdere is verplicht de gestrafte in persoon te horen tijdens het onderzoek op beklag, tenzij deze is
      gehoord als bedoeld in [artikel 80f, eerste lid][ref1], en te kennen heeft gegeven op horen in persoon geen prijs
      te stellen en de beklagmeerdere het horen in persoon niet nodig oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80f
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80i
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80f
        hoofdstuk: V
        paragraaf: '1'
  - number: 80i.2
    text: |-
      Indien de gestrafte niet verschijnt wegens een gewichtige reden van verhindering schort de beklagmeerdere het
      onderzoek op beklag op of schorst hij dit. De termijn bedoeld in [artikel 80r, tweede lid, onder b][ref1], wordt in
      dat geval voor de duur van de opschorting of schorsing verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80r
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80i
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80r
        hoofdstuk: V
        paragraaf: '2'
  - number: 80i.3
    text: |-
      Indien de gestrafte niet verschijnt zonder een gewichtige reden van verhindering, doet de beklagmeerdere het beklag
      verder af.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80i
  - number: 80j.1
    text: De beklagmeerdere houdt het onderzoek op beklag op de grondslag van de beschuldiging.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80j
  - number: 80j.2
    text: Het onderzoek op beklag is niet openbaar.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80j
  - number: 80k
    text: |-
      De gestrafte is niet verplicht te antwoorden. Dit wordt hem voor of bij aanvang van het onderzoek op beklag ter
      kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80k
  - number: 80l.1
    text: De beklagmeerdere hoort de commandant, de getuigen en de deskundigen indien zij zijn opgeroepen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80l
  - number: 80l.2
    text: |-
      Hij stelt de gestrafte en de vertrouwensman in de gelegenheid de commandant, de getuigen en de deskundigen, door
      zijn tussenkomst, vragen te stellen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80l
  - number: 80l.3
    text: Hij stelt de vertrouwensman in de gelegenheid het woord te voeren.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80l
  - number: 80m
    text: |-
      De gestrafte wordt voor de sluiting van het onderzoek op beklag in de gelegenheid gesteld het laatste woord te
      voeren.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80m
  - number: 80n
    text: |-
      Ten aanzien van de bewijsmiddelen zijn de bepalingen van paragraaf 5 van Titel I van dit hoofdstuk van toepassing.
      Als bewijsmiddel wordt tevens erkend de eigen waarneming door de beklagmeerdere tijdens het onderzoek op beklag.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80n
  - number: 80o.1
    text: |-
      Na sluiting van het onderzoek beraadt de beklagmeerdere zich of hij door de inhoud van de in [artikel 80n][ref1]
      bedoelde bewijsmiddelen de overtuiging heeft gekregen dat een in de beschuldiging omschreven gedraging van de
      gestrafte heeft plaatsgevonden en of zulks een schending van een gedragsregel oplevert.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80n
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80o
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80n
        hoofdstuk: V
        paragraaf: '2'
  - number: 80o.2
    text: |-
      Met betrekking tot een beklag als bedoeld in [artikel 80a, derde lid][ref1], wordt door de beklagmeerdere aan de
      hand van de door de commandant opgegeven motivering beoordeeld of de wijze van de tenuitvoerlegging als passend kan
      worden beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80a
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80o
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80a
        hoofdstuk: V
        paragraaf: '1'
  - number: 80p.1
    text: Na het sluiten van het onderzoek op beklag beslist de beklagmeerdere uiterlijk op de eerstvolgende werkdag.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80p
  - number: 80p.2
    text: 'De beslissing van de beklagmeerdere luidt:'
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80p
  - number: 80p.2.a
    text: bevestiging van de bestreden beslissing, zo nodig met verbetering of aanvulling;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80p
  - number: 80p.2.b
    text: |-
      bevestiging van de bestreden schuldigverklaring, zonodig met verbetering of aanvulling, met vermindering van de
      strafmaat binnen de opgelegde strafsoort;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80p
  - number: 80p.2.c
    text: |-
      bevestiging van de bestreden schuldigverklaring, zonodig met verbetering of aanvulling, met wijziging van de
      opgelegde straf in de straf van berisping;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80p
  - number: 80p.2.d
    text: |-
      bevestiging van de bestreden schuldigverklaring, zonodig met verbetering of aanvulling, met tenietdoening van de
      straf;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80p
  - number: 80p.2.e
    text: vrijspraak;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80p
  - number: 80p.2.f
    text: |-
      bevestiging van de bestreden schuldigverklaring, zonodig met verbetering of aanvulling, met verklaring dat
      ten onrechte geen straf is opgelegd of dat de opgelegde straf ontoereikend is en verwijzing naar het in
      [artikel 81, eerste lid][ref1], bedoelde gerecht.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel81
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80p
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
  - number: 80p.3
    text: |-
      Indien een beklag is gedaan als bedoeld in [artikel 80a, derde lid][ref1], verklaart de beklagmeerdere dit beklag
      bij gemotiveerde schriftelijke beslissing geheel of gedeeltelijk gegrond of ongegrond. Indien een beklag geheel
      of gedeeltelijk gegrond is verklaard, bepaalt de beklagmeerdere, volgens bij of krachtens algemene maatregel van
      Rijksbestuur te stellen regelen, op welke wijze het door de gestrafte geleden nadeel zal worden hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80a
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80p
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80a
        hoofdstuk: V
        paragraaf: '1'
  - number: 80p.4
    text: 'De beslissing in eerste aanleg wordt vernietigd:'
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80p
  - number: 80p.4.a
    text: |-
      indien enige in [Titel I van dit hoofdstuk][ref1] voorgeschreven termijn is geschonden;


      [ref1]: https://wetten.overheid.nl/BWBR0004788#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80p
    references:
      - id: ref1
        bwb_id: BWBR0004788
        hoofdstuk: V
  - number: 80p.4.b
    text: |-
      indien enige andere vorm dan onder a bedoeld, is verzuimd en redelijkerwijs kan worden aangenomen dat de gestrafte
      daardoor in zijn verdediging is geschaad.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80p
  - number: 80q.1
    text: |-
      De beslissing wordt vastgelegd in een schriftelijk stuk, de uitspraak op beklag. [Artikel 77][ref1] is van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel77
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80q
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '77'
        hoofdstuk: V
        paragraaf: '6'
  - number: 80q.2
    text: |-
      De uitspraak op beklag wordt door de beklagmeerdere onverwijld aan de commandant toegezonden. Door of namens de
      commandant wordt onverwijld een afschrift van de uitspraak op beklag uitgereikt aan de gestrafte. De datum van
      uitreiking wordt aangetekend op de uitspraak en op het uitgereikte afschrift.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80q
  - number: 80q.3
    text: |-
      Indien de uitspraak op beklag een verwijzing inhoudt wordt daarvan bij de uitreiking aan de gestrafte mededeling
      gedaan.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80q
  - number: 80r.1
    text: |-
      De beklagprocedure eindigt met een beslissing als bedoeld in de [artikelen 80d, eerste lid][ref1], of
      [80p, tweede of derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80d
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel80p
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80r
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80d
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: 80p
        hoofdstuk: V
        paragraaf: '2'
  - number: 80r.2
    text: |-
      De beklagprocedure eindigt van rechtswege en de beslissing waartegen beklag is gedaan, is van rechtswege
      vernietigd:
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80r
  - number: 80r.2.a
    text: |-
      indien er binnen de ingevolge [artikel 80g][ref1] voorgeschreven termijn geen onderzoek op beklag is aangevangen;


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80g
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80r
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80g
        hoofdstuk: V
        paragraaf: '2'
  - number: 80r.2.b
    text: |-
      indien er 30 dagen zijn verlopen nadat het onderzoek op beklag is aangevangen en er geen beslissing als bedoeld in
      [artikel 80p, tweede of derde lid][ref1], is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80p
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80r
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80p
        hoofdstuk: V
        paragraaf: '2'
  - number: 80r.3
    text: |-
      [Artikel 50, tweede lid][ref1], is van overeenkomstige toepassing met dien verstande dat de beklagmeerdere is
      belast met de uitvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel50
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80r
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '50'
        hoofdstuk: IV
  - number: 80s.1
    text: |-
      Nadat aan de gestrafte een afschrift van de uitspraak op beklag als bedoeld in
      [artikel 80p, tweede lid, onder f][ref1], is uitgereikt, zendt de commandant de uitspraak op beklag onverwijld naar
      het gerecht.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80p
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80s
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80p
        hoofdstuk: V
        paragraaf: '2'
  - number: 80s.2
    text: |-
      Bij de behandeling en afdoening van het beklag na verwijzing zijn de bepalingen van paragraaf 2 van Titel II van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80s
  - number: 80t
    text: |-
      Indien de tenuitvoerlegging van de opgelegde straf is opgeschort of geschorst, wordt, als de beslissing van de
      beklagmeerdere daartoe aanleiding geeft, de straf of het resterende deel van de straf zo spoedig mogelijk ten
      uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel80t
  - number: '81.1'
    text: |-
      De gestrafte kan beroep instellen bij het gerecht, dat ingevolge de bepalingen van de
      [Wet militaire strafrechtspraak][ref1] bevoegd zou zijn geweest, indien de desbetreffende gedraging een misdrijf
      zou hebben opgeleverd. Dit beroep wordt ingesteld binnen vijf dagen na de uitreiking:


      [ref1]: https://wetten.overheid.nl/BWBR0004789
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0004789
  - number: 81.1.a
    text: |-
      van een schriftelijk stuk als bedoeld in [artikel 80d, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80d
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80d
        hoofdstuk: V
        paragraaf: '1'
  - number: 81.1.b
    text: van een afschrift van een uitspraak op beklag.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel81
  - number: '81.2'
    text: |-
      [Artikel 80a, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80a
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80a
        hoofdstuk: V
        paragraaf: '1'
  - number: '81.3'
    text: |-
      De beklagmeerdere kan binnen vijf dagen na verloop van de termijn bedoeld in [artikel 80a, eerste lid][ref1], en
      er geen beklag is gedaan, bij het in het eerste lid bedoelde gerecht beroep instellen op de grond dat naar zijn
      oordeel ten onrechte geen straf is opgelegd of de opgelegde straf ontoereikend is.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80a
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80a
        hoofdstuk: V
        paragraaf: '1'
  - number: '81.4'
    text: |-
      Indien de beklagmeerdere een oordeel heeft gegeven over de wijze van tenuitvoerlegging als bedoeld in
      [het derde lid van artikel 80a][ref1], kan in beroep eveneens de wijze van tenuitvoerlegging van de straf van
      strafdienst of van uitgaansverbod aan het oordeel van het gerecht worden onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80a
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80a
        hoofdstuk: V
        paragraaf: '1'
  - number: '82.1'
    text: Het beroep wordt ingesteld bij beroepschrift, dat bij de commandant moet worden ingediend.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel82
  - number: '82.2'
    text: |-
      De commandant zendt het beroepschrift onverwijld naar het gerecht. De commandant en de beklagmeerdere voegen
      daarbij alle op de zaak betrekking hebbende stukken met opgave van de bewijsmiddelen op grond waarvan zij tot de
      overtuiging zijn gekomen dat een in de beschuldiging omschreven gedraging heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel82
  - number: '82.3'
    text: |-
      Indien het beroep is ingesteld door de beklagmeerdere, doet de commandant daarvan mededeling aan degene op wie de
      uitspraak betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel82
  - number: '83'
    text: |-
      Als dag van indiening geldt de dag van ontvangst van het beroepschrift door of namens de commandant. De dag van
      ontvangst wordt terstond op het beroepschrift aangetekend.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel83
  - number: '84'
    text: |-
      Ten aanzien van een na afloop van de beroepstermijn ingediend beroepschrift blijft niet-ontvankelijkverklaring
      achterwege indien redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest. Een beslissing
      ter zake is gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel84
  - number: '85'
    text: |-
      Zodra het beroepschrift is ingediend, kan de voorzitter van de militaire kamer, bedoeld in [artikel 87][ref1],
      de tenuitvoerlegging van een straf van strafdienst of van uitgaansverbod opschorten of schorsen. Hiervan wordt
      aantekening gesteld op het beroepschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel87
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '87'
        hoofdstuk: V
        paragraaf: '2'
  - number: '86'
    text: |-
      De griffier van het gerecht stelt zo spoedig mogelijk afschriften van het beroepschrift en van de op de zaak
      betrekking hebbende stukken ter beschikking van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel86
  - number: '87.1'
    text: |-
      Het beroep wordt zo spoedig mogelijk behandeld door een meervoudige militaire kamer bij het in [artikel 81][ref1]
      bedoelde gerecht.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel81
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
  - number: '87.2'
    text: De voorzitter van de militaire kamer bepaalt op welke dag het beroep wordt behandeld.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel87
  - number: '87.3'
    text: |-
      [Artikel 17, elfde lid, van de Wet militaire strafrechtspraak][ref1] is van overeenkomstige toepassing, met dien
      verstande dat de uitvoering van de overdracht geschiedt door de griffier.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#Artikel17
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0004789
        artikel: '17'
  - number: '88.1'
    text: De oproeping van de gestrafte geschiedt door de griffier.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel88
  - number: '88.2'
    text: De termijn van oproeping is tenminste zes dagen. Op verzoek van de gestrafte kan deze termijn worden verkort.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel88
  - number: '88.3'
    text: |-
      Indien de gestrafte niet verschijnt en het gerecht zijn aanwezigheid in persoon noodzakelijk acht, stelt het de
      behandeling voor bepaalde tijd uit en gelast de oproeping van de gestrafte.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel88
  - number: '88.4'
    text: Indien de gestrafte wederom niet verschijnt, kan het gerecht het beroep vervallen verklaren.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel88
  - number: '89.1'
    text: |-
      Indien beroep is ingesteld door de beklagmeerdere worden deze en degene op wie de uitspraak betrekking heeft, door
      de griffier opgeroepen. De termijn van oproeping is tenminste zes dagen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel89
  - number: '89.2'
    text: |-
      Indien de beklagmeerdere niet verschijnt en het gerecht zijn aanwezigheid in persoon noodzakelijk acht, stelt het
      de behandeling voor bepaalde tijd uit en gelast zijn oproeping.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel89
  - number: '89.3'
    text: Indien de beklagmeerdere wederom niet verschijnt, kan het gerecht het beroep vervallen verklaren.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel89
  - number: '90.1'
    text: |-
      De voorzitter bepaalt welke getuigen en deskundigen zullen worden opgeroepen. [Artikel 65, tweede lid][ref1], is
      van overeenkomstige toepassing met dien verstande dat het verzoek tenminste drie dagen voor de behandeling dient te
      zijn binnengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel65
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '65'
        hoofdstuk: V
        paragraaf: '4'
  - number: '90.2'
    text: De oproepingen geschieden door de griffier.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel90
  - number: '90.3'
    text: Getuigen en deskundigen zijn verplicht te verschijnen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel90
  - number: '90.4'
    text: |-
      Voor getuigen is [artikel 284, tweede lid][ref1], en voor deskundigen is
      [artikel 296, eerste lid, onder 1°, van het Wetboek van Strafvordering][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel284
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel296
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '284'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '296'
  - number: '90.5'
    text: |-
      [Artikel 65, vierde en vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel65
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '65'
        hoofdstuk: V
        paragraaf: '4'
  - number: '91'
    text: |-
      Het openbaar ministerie kan desgewenst bij de behandeling van het beroep zijn oordeel over de zaak kenbaar maken
      aan de militaire kamer.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel91
  - number: '92.1'
    text: De gestrafte kan zich bij de behandeling van zijn beroep doen bijstaan door een vertrouwensman.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel92
  - number: '92.2'
    text: |-
      De [artikelen 57][ref1], [58][ref2], [59, eerste lid][ref3], en [60][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0004788#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0004788#Artikel60
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '57'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '58'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004788
        artikel: '59'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004788
        artikel: '60'
        hoofdstuk: V
        paragraaf: '2'
  - number: '92.3'
    text: Als vertrouwensman kan ook een advocaat optreden.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel92
  - number: '92.4'
    text: |-
      De voorzitter kan de gestrafte een advocaat als vertrouwensman toevoegen. Een daartoe strekkend verzoek dient
      tenminste drie dagen voor de behandeling van het beroep bij het gerecht te zijn binnengekomen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel92
  - number: '92.5'
    text: Het bepaalde in de vorige leden wordt de gestrafte bij de oproeping medegedeeld.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel92
  - number: '92.6'
    text: |-
      De overeenkomstig het vierde lid toegevoegde advocaat ontvangt een beloning en vergoeding van door hem gemaakte
      onkosten volgens regelen te stellen bij algemene maatregel van Rijksbestuur.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel92
  - number: '92.7'
    text: |-
      De voorgaande bepalingen zijn van overeenkomstige toepassing op degene op wie de uitspraak betrekking heeft, indien
      het beroep is ingesteld door de beklagmeerdere.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel92
  - number: '93.1'
    text: |-
      De behandeling van het beroep geschiedt ter openbare terechtzitting. De voorzitter heeft de leiding van de
      behandeling. Hij kan op verzoek van de gestrafte, de commandant of de beklagmeerdere, of om redenen aan de openbare
      orde ontleend gelasten dat de behandeling achter gesloten deuren plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel93
  - number: '93.2'
    text: |-
      De [artikelen 62][ref1], [67-69][ref2], [74][ref3] en [75][ref4] zijn van overeenkomstige toepassing, met dien
      verstande dat voor commandant gelezen wordt militaire kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0004788#Artikel74
      [ref4]: https://wetten.overheid.nl/BWBR0004788#Artikel75
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '62'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '67'
        hoofdstuk: V
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004788
        artikel: '74'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0004788
        artikel: '75'
        hoofdstuk: V
        paragraaf: '6'
  - number: '93.3'
    text: |-
      Ten aanzien van de bewijsmiddelen is [artikel 80n][ref1] van toepassing. Als bewijsmiddel wordt tevens erkend de
      eigen waarneming door de militaire kamer tijdens het onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80n
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80n
        hoofdstuk: V
        paragraaf: '2'
  - number: '93.4'
    text: |-
      Na sluiting van het onderzoek beraadt de militaire kamer zich of zij door de inhoud van de in het derde lid
      genoemde bewijsmiddelen de overtuiging heeft gekregen dat een in de beschuldiging omschreven gedraging van de
      gestrafte heeft plaatsgevonden en, in bevestigend geval, of zulks de schending van een gedragsregel oplevert.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel93
  - number: '94.1'
    text: |-
      De militaire kamer kan een verhoor schriftelijk doen geschieden dan wel de ondervraging opdragen aan een van haar
      leden of aan een opsporingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel94
  - number: '94.2'
    text: |-
      Het lid van de militaire kamer beëdigt, indien er naar zijn oordeel een gegrond vermoeden bestaat dat de getuige
      niet op de terechtzitting zal kunnen verschijnen, de getuige dat hij de gehele waarheid en niets dan de waarheid
      zal zeggen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel94
  - number: '94.3'
    text: |-
      De deskundige wordt door het lid van de militaire kamer beëdigd dat hij zijn taak naar zijn geweten zal vervullen.
      4. Van de reden van de beëdiging als bedoeld in het tweede lid wordt in het proces-verbaal melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel94
  - number: '95.1'
    text: |-
      Het gerecht beslist uiterlijk 14 dagen na afloop van de behandeling van het beroep in een schriftelijke, met
      redenen omklede uitspraak.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel95
  - number: '95.2'
    text: |-
      De voorlezing van de uitspraak in beroep geschiedt in het openbaar en de uitspraak wordt de gestrafte in persoon
      betekend.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel95
  - number: '95.3'
    text: |-
      Een afschrift van de uitspraak wordt toegezonden aan de commandant, de beklagmeerdere, en aan Onze Minister van
      Defensie.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel95
  - number: '96.1'
    text: |-
      Het gerecht verklaart zich onbevoegd van het beroep kennis te nemen, verklaart het beroep niet ontvankelijk, of
      bevestigt de beslissing waartegen beroep is ingesteld, zonodig met verbetering of aanvulling daarvan, of doet de
      zaak af met gehele of gedeeltelijke vernietiging van die beslissing.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel96
  - number: '96.2'
    text: |-
      Indien een beroep is ingesteld als bedoeld in [artikel 81, vierde lid][ref1], verklaart het gerecht bij
      gemotiveerde beslissing dit beroep geheel of gedeeltelijk gegrond of ongegrond.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel81
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
  - number: '97'
    text: 'De beslissing waartegen beroep is ingesteld wordt vernietigd:'
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel97
  - number: 97.a
    text: |-
      Indien enige in de [Titels I][ref1] of[ IA van dit hoofdstuk][ref2] voorgeschreven termijn is geschonden;


      [ref1]: https://wetten.overheid.nl/BWBR0004788#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0004788#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0004788
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004788
        hoofdstuk: V
  - number: 97.b
    text: |-
      indien enige andere vorm dan onder *a* bedoeld, is verzuimd en redelijkerwijs kan worden aangenomen dat de
      gestrafte daardoor in zijn verdediging is geschaad.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel97
  - number: '98'
    text: |-
      Indien bij de beslissing in beroep een reeds geheel of gedeeltelijk tenuitvoergelegde straf van strafdienst of
      van uitgaansverbod wordt tenietgedaan of verminderd, of een beroep als bedoeld in [artikel 81, vierde lid][ref1],
      geheel of gedeeltelijk gegrond wordt verklaard, bepaalt het gerecht, volgens bij of krachtens algemene maatregel
      van Rijksbestuur te stellen regelen, op welke wijze het door de gestrafte geleden nadeel zal worden hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel81
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
  - number: '99'
    text: |-
      Indien de tenuitvoerlegging van de opgelegde straf is opgeschort of geschorst, wordt, als de beslissing van het
      gerecht daartoe aanleiding geeft, de straf of het resterende deel van de straf zo spoedig mogelijk ten uitvoer
      gelegd.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel99
  - number: '100'
    text: |-
      Tegen de beslissing in beroep staat geen verdere voorziening open, onverminderd de bevoegdheid van de Procureur-
      Generaal bij de Hoge Raad om zich in het belang der wet in cassatie te voorzien.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel100
  - number: '101'
    text: |-
      Indien het beroep is ingesteld bij een mobiele rechtbank, is het bepaalde in deze paragraaf omtrent de militaire
      kamer van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel101
  - number: '102.1'
    text: |-
      In geval van ontdekking op heterdaad is, indien bijzondere omstandigheden dat onverwijld vorderen, iedere meerdere
      bevoegd degene die wordt verdacht van de schending van een gedragsregel aan te houden en hem naar een plaats van
      verhoor te geleiden. [Artikel 128 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel128
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '128'
  - number: '102.2'
    text: De meerdere is bevoegd van iedere mindere te vorderen hem bij de geleiding bijstand te verlenen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel102
  - number: '102.3'
    text: |-
      Indien de meerdere de plaats van aanhouding niet terstond kan verlaten, is hij bevoegd van iedere mindere te
      vorderen voor de geleiding zorg te dragen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel102
  - number: '103.1'
    text: |-
      De commandant is bevoegd een geschrift als bedoeld in [artikel 30][ref1] of [31][ref2], dan wel een ander voorwerp
      waarvan hij redelijkerwijs mag aannemen dat het tot bewijs kan dienen van de schending van een gedragsregel, in te
      nemen of te doen innemen.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel31
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '30'
        hoofdstuk: II
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '31'
        hoofdstuk: II
        paragraaf: '8'
  - number: '103.2'
    text: |-
      Indien de commandant niet aanwezig is en zijn optreden niet kan worden afgewacht, dan wel indien degene die wordt
      verdacht van de schending van een gedragsregel onbekend is, komt de in het vorige lid genoemde bevoegdheid mede toe
      aan door Onze Minister van Defensie aangewezen functionarissen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel103
  - number: '103.3'
    text: |-
      Het in het eerste lid bedoelde geschrift of voorwerp wordt zo spoedig mogelijk ter beschikking gesteld van de
      rechthebbende, doch in elk geval:
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel103
  - number: 103.3.a
    text: zodra de commandant beslist geen beschuldiging uit te reiken;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel103
  - number: 103.3.b
    text: |-
      zodra blijkt dat geen beschuldiging kan worden uitgereikt op grond van het bepaalde in
      [artikel 53, eerste, tweede of vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel53
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '53'
        hoofdstuk: V
        paragraaf: '1'
  - number: 103.3.c
    text: tien dagen na de uitreiking van de uitspraak in eerste aanleg, indien geen beklag is gedaan of beroep is ingesteld;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel103
  - number: 103.3.d
    text: |-
      vijf dagen na de uitreiking van een uitspraak op beklag die geen verwijzing inhoudt als bedoeld in
      [artikel 80p, tweede lid, onder f][ref1], indien geen beroep is ingesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80p
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80p
        hoofdstuk: V
        paragraaf: '2'
  - number: 103.3.e
    text: zodra het tuchtproces op een andere wijze eindigt;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel103
  - number: 103.3.f
    text: bij de uitspraak in beroep.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel103
  - number: '103.4'
    text: |-
      Indien toepassing is gegeven aan [artikel 78][ref1] wordt, in afwijking van het gestelde in het derde lid, het
      geschrift of voorwerp ter beschikking gesteld van de opsporingsambtenaar. Deze terbeschikkingstelling geldt als een
      inbeslagneming door een opsporingsambtenaar als bedoeld in het [Wetboek van Strafvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '78'
        hoofdstuk: V
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0001903
  - number: '103.5'
    text: |-
      Het in het eerste lid bedoelde geschrift of voorwerp wordt op de wijze te bepalen bij algemene maatregel van
      Rijksbestuur gedurende zes maanden ter beschikking gehouden van de rechthebbende. Is teruggave alsdan niet mogelijk
      gebleken dan wordt het geschrift of voorwerp vernietigd.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel103
  - number: '104.1'
    text: |-
      Over de inneming van een geschrift of voorwerp als bedoeld in [artikel 103][ref1] kan de rechthebbende zich binnen
      5 dagen schriftelijk beklagen bij de voorzitter van de militaire kamer als bedoeld in [artikel 87][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel87
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '103'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '87'
        hoofdstuk: V
        paragraaf: '2'
  - number: '104.2'
    text: |-
      Met betrekking tot de wijze van indiening van het klaagschrift zijn de [artikelen 82][ref1], [83][ref2] en
      [84][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel83
      [ref3]: https://wetten.overheid.nl/BWBR0004788#Artikel84
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '82'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '83'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004788
        artikel: '84'
        hoofdstuk: V
        paragraaf: '1'
  - number: '104.3'
    text: |-
      De voorzitter van de militaire kamer geeft zo spoedig mogelijk een met redenen omklede beschikking, nadat de klager
      in de gelegenheid is gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel104
  - number: '104.4'
    text: |-
      Acht de voorzitter van de militaire kamer het beklag gegrond, dan gelast hij dat het geschrift of voorwerp zo
      spoedig mogelijk ter beschikking wordt gesteld van de rechthebbende, indien dat nog niet is geschied op grond van
      het bepaalde in [artikel 103, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel103
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '103'
        hoofdstuk: VI
  - number: '104.5'
    text: |-
      Een afschrift van de beschikking wordt uitgereikt aan de klager en aan degene die het geschrift of voorwerp heeft
      ingenomen of doen innemen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel104
  - number: '104.6'
    text: Tegen de beschikking staat geen verdere voorziening open.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel104
  - number: '105'
    text: |-
      Onverminderd de bepalingen van het Verdrag van Genève betreffende de behandeling van
      krijgsgevangenen, van 12 augustus 1949, is deze wet, met uitzondering van [hoofdstuk III][ref1],
      van overeenkomstige toepassing op krijgsgevangenen en andere geïnterneerde personen die ingevolge
      [artikel 65 van het Wetboek van Militair Strafrecht][ref2] gedeeltelijk met Nederlandse militairen zijn
      gelijkgesteld, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004788#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel65
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0004788
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '65'
  - number: 105.a
    text: |-
      de straffen, omschreven in [artikel 89, eerste lid][ref1], van vorengenoemd verdrag, worden geacht te zijn voorzien
      in deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel89
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '89'
        hoofdstuk: V
        paragraaf: '2'
  - number: 105.b
    text: |-
      met betrekking tot de tenuitvoerlegging van de straf, omschreven in [artikel 89, eerste lid, onder 1][ref1] van
      vorengenoemd verdrag, de [artikelen 44-46 van deze wet][ref2] van overeenkomstige toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel44
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '89'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '44'
        hoofdstuk: III
  - number: 105.c
    text: |-
      de tenuitvoerlegging van de straf, omschreven in [artikel 89, eerste lid, onder 4][ref1] van vorengenoemd verdrag,
      geschiedt volgens regelen te stellen bij algemene maatregel van Rijksbestuur;


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel89
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '89'
        hoofdstuk: V
        paragraaf: '2'
  - number: 105.d
    text: |-
      de vergrijpen, bedoeld in [artikel 93, tweede en derde lid][ref1], van vorengenoemd verdrag, worden geacht
      in te houden schendingen van gedragsregels van deze wet, terwijl ten aanzien van die feiten het gestelde in
      [artikel 78 van deze wet][ref2] buiten toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel78
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '93'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '78'
        hoofdstuk: V
        paragraaf: '7'
  - number: '106'
    text: De Wet op de Krijgstucht wordt ingetrokken, behoudens het bepaalde in de volgende artikelen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel106
  - number: '107.1'
    text: |-
      De op het tijdstip van inwerkingtreden van deze Rijkswet bij de ingevolge de artikelen 39-43 van de Wet op de
      Krijgstucht tot straffen bevoegde autoriteiten, of bij de ingevolge artikel 61 van die wet tot behandeling van een
      beklag bevoegde meerdere, aanhangige zaken betreffende krijgstuchtelijke vergrijpen als bedoeld in artikel 2 van
      die wet, worden behandeld en afgedaan op de wijze, als bepaald in die wet, door die autoriteit onderscheidenlijk
      meerdere. Andere straffen dan die voorzien bij deze wet kunnen niet worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel107
  - number: '107.2'
    text: |-
      Indien op het tijdstip van inwerkingtreden van deze Rijkswet de termijn van beklag als bedoeld in artikel 62 van
      de Wet op de Krijgstucht, dan wel van de mogelijkheid om ingevolge artikel 67 van die wet de eindbeslissing van het
      Hoog Militair Gerechtshof in te roepen, nog niet is verstreken, dient dit beklag onderscheidenlijk deze inroeping
      te worden gedaan in de vorm van een beroep, in te stellen naar de regels, gesteld in [hoofdstuk V, titel II][ref1],
      van deze Rijkswet, en met toepassing van die regels te worden behandeld en afgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0004788
        hoofdstuk: V
  - number: '107.3'
    text: |-
      Zaken betreffende de inroeping van een eindbeslissing ingevolge artikel 67 van de Wet op de Krijgstucht, die op
      het tijdstip van inwerkingtreden van deze Rijkswet bij het Hoog Militair Gerechtshof aanhangig zijn, worden in de
      stand waarin zij zich bevinden overgedragen aan het gerecht dat uit hoofde van [artikel 81 van deze Rijkswet][ref1]
      bevoegd is het beroep inzake tuchtrechtelijke uitspraken te behandelen, en door dat gerecht behandeld en afgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel81
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
  - number: '108.1'
    text: |-
      Tegen beslissingen van het Hoog Militair Gerechtshof, genomen ingevolge artikel 67 van de Wet op de Krijgstucht,
      die op het tijdstip van inwerkingtreden van deze Rijkswet nog niet onherroepelijk zijn geworden en waartegen nog
      geen beroep in cassatie is ingesteld, kan binnen 14 dagen na de uitspraak zulk beroep worden ingesteld op de wijze
      als voorgeschreven voor het instellen van cassatie tegen arresten van het Gerechtshof te Arnhem.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel108
  - number: '108.2'
    text: |-
      Indien de Hoge Raad een beslissing van het Hoog Militair Gerechtshof, genomen ingevolge artikel 67 van de Wet op
      de Krijgstucht, na het tijdstip van inwerkingtreden van deze Rijkswet in cassatie vernietigt, wordt de zaak, indien
      zij niet door de Hoge Raad zelf wordt afgedaan, verwezen naar het gerecht dat uit hoofde van [artikel 81][ref1] van
      deze Rijkswet bevoegd is.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel81
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
  - number: '108.3'
    text: |-
      In de zaken, waarin toepassing is gegeven aan [artikel 107, derde lid][ref1], van deze Rijkswet, voorzover deze een
      strafbaar feit betreffen, blijven de bepalingen van de Rijkswet van 22 februari 1979 (*Stb.* 69) tot invoering van
      de rechtsmiddelen van cassatie, cassatie in het belang der wet en herziening in het militair strafprocesrecht op de
      beslissing van het gerecht van kracht. Het voorgaande lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel107
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '107'
        hoofdstuk: VIII
  - number: '109'
    text: |-
      De krijgstuchtelijke straffen, op grond van de Wet op de Krijgstucht opgelegd voor het tijdstip van inwerkingtreden
      van deze Rijkswet, of met toepassing van [artikel 107, eerste lid, van deze Rijkswet][ref1] opgelegd, worden ten
      uitvoer gelegd op de wijze als bij of krachtens die wet bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel107
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel109
