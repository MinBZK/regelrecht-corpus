---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_militair_tuchtrecht
regulatory_layer: WET
publication_date: '2013-01-24'
valid_from: '2002-01-01'
bwb_id: BWBR0004788
url: https://wetten.overheid.nl/BWBR0004788/2002-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de gedragsregels van het militair tuchtrecht vast te
    stellen bij de wet, alsmede nieuwe voorschriften te geven inzake de tuchtstraffen en de behandeling van tuchtzaken;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De zowel in deze wet als in het [Wetboek van Militair Strafrecht][ref1] voorkomende uitdrukkingen hebben in beide
      dezelfde betekenis. [Artikel 61 van het Wetboek van Militair Strafrecht][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001869
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel61
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001869
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '61'
  - number: '2'
    text: De straffen, in deze wet voorzien, zijn van toepassing op de militair die een gedragsregel van deze wet schendt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel2
  - number: '3.1'
    text: 'De gedragsregels van deze wet zijn van toepassing:'
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel3
  - number: 3.1.a
    text: gedurende de tijd waarin de militair dienst doet of behoort te doen;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel3
  - number: 3.1.b
    text: op een militaire plaats;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel3
  - number: 3.1.c
    text: anders dan in de gevallen, genoemd onder *a* en *b*, indien en voorzover de wet de toepassing voorschrijft.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      Onder de tijd waarin de militair dienst doet of behoort te doen, wordt in deze wet mede verstaan de tijd waarin de
      militair in uniform gekleed gaat.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel3
  - number: '3.3'
    text: |-
      Onder militaire plaats wordt in deze wet verstaan een gebouw, terrein, vaartuig, luchtvaartuig of voertuig, dat
      in gebruik is bij of ten behoeve van de krijgsmacht, of dat de militair tot verblijf of gebruik dient bij de
      vervulling van zijn taak in internationaal verband of waar de militair zich in krijgsgevangenschap bevindt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      In deze wet wordt onder commandant verstaan de militair die ingevolge [artikel 49][ref1] tot straffen bevoegd is.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel49
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '49'
        hoofdstuk: IV
  - number: '4.2'
    text: |-
      In deze wet wordt onder beklagmeerdere verstaan de onmiddellijk boven de commandant gestelde bevelvoerende
      meerdere. Onze Minister van Defensie kan bij ministeriële regeling andere militairen aanwijzen als beklagmeerderen.
      In dat geval treedt de onmiddellijk boven de commandant gestelde bevelvoerende meerdere niet meer op als
      beklagmeerdere.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel4
  - number: '5'
    text: |-
      In deze wet wordt onder beschuldigde verstaan de militair aan wie een beschuldiging is uitgereikt op grond van het
      op feiten of omstandigheden gebaseerde vermoeden dat hij een in deze wet omschreven gedragsregel heeft geschonden.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel5
  - number: 5a
    text: |-
      Indien een Nederlandse militair behoort tot een internationaal militair samenwerkingsverband wordt ten aanzien van
      die Nederlandse militair voor de toepassing van [Hoofdstuk II van deze wet][ref1] mede verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0004788#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0004788
        hoofdstuk: II
  - number: 5a.a
    text: 'andere militair: de vreemde militair die behoort tot dat internationaal militair samenwerkingsverband;'
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel5a
  - number: 5a.b
    text: 'krijgsmacht: dat internationaal militair samenwerkingsverband.'
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel5a
  - number: '6.1'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die enig gegeven, de dienst betreffende, mededeelt aan
      of ter beschikking stelt van iemand die tot kennisneming daarvan niet bevoegd is, voor zover de verplichting tot
      geheimhouding uit de aard der zaak volgt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel6
  - number: '6.2'
    text: |-
      Het eerste lid is mede van toepassing op de militair die geen dienst doet of behoort te doen, en zich niet bevindt
      op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel6
  - number: '7'
    text: In strijd met de militaire tucht gedraagt zich de militair die ongeoorloofd afwezig is.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel7
  - number: '8'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair aan wiens schuld het is te wijten dat hij niet in staat
      is dienstverplichtingen te vervullen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel8
  - number: '9'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die zich onttrekt aan dienstverplichtingen, deze
      verplichtingen zonder toestemming niet vervult of ophoudt te vervullen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel9
  - number: '10'
    text: In strijd met de militaire tucht gedraagt zich hij die zijn taak als militair onzorgvuldig verricht.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel10
  - number: '11'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die een andere militair of iemand, die anderszins bij
      of ten behoeve van de krijgsmacht werkzaam is, geen hulp verleent, indien en voor zover deze nodig is en kan worden
      gevergd.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel11
  - number: '12'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die zich door lijdelijkheid of onwilligheid tegen
      militaire diensten verzet.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel12
  - number: '13.1'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die de uitvoering van een in het belang van de militaire
      dienst genomen maatregel belet, belemmert of verijdelt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel13
  - number: '13.2'
    text: |-
      Het eerste lid is mede van toepassing op de militair die geen dienst doet of behoort te doen, en zich niet bevindt
      op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel13
  - number: '14.1'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die een andere militair of iemand, die anderszins bij of
      ten behoeve van de krijgsmacht werkzaam is, zonder noodzaak hindert bij de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel14
  - number: '14.2'
    text: |-
      Het eerste lid is mede van toepassing op de militair die geen dienst doet of behoort te doen, en zich niet bevindt
      op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel14
  - number: '15'
    text: In strijd met de militaire tucht gedraagt zich de militair die een dienstbevel niet opvolgt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel15
  - number: '16'
    text: |-
      Het voorgaande artikel is niet toepasselijk indien de bevolen gedraging onrechtmatig is of door de militair te
      goeder trouw als onrechtmatig werd beschouwd.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel16
  - number: '17'
    text: |-
      Indien twee of meer onderling strijdige dienstbevelen zijn gegeven, is het niet opvolgen van een bevel dat
      voorafgaat aan het laatst gehandhaafde geen met de militaire tucht strijdige gedraging.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel17
  - number: '18.1'
    text: In strijd met de militaire tucht gedraagt zich de militair die een dienstvoorschrift niet opvolgt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel18
  - number: '18.2'
    text: |-
      Het eerste lid is mede van toepassing op de militair die geen dienst doet of behoort te doen, en zich niet bevindt
      op een militaire plaats, indien het in het dienstvoorschrift gegeven ge- of verbod betrekking heeft op het gedrag
      van de militair die zich voor de uitoefening van zijn dienst buiten Nederland bevindt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel18
  - number: '19'
    text: |-
      Het voorgaande artikel is niet toepasselijk indien een van het dienstvoorschrift afwijkend dienstbevel is
      opgevolgd.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel19
  - number: '20'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die een andere militair of iemand, die anderszins bij
      of ten behoeve van de krijgsmacht werkzaam is, in het openbaar of in zijn tegenwoordigheid met enig kwaad bedreigt,
      uitscheldt of bespot.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel20
  - number: '21'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die tegen beter weten in een aantijging tegen of
      een klacht over een andere militair of iemand, die anderszins bij of ten behoeve van de krijgsmacht werkzaam is
      inbrengt of inzendt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel21
  - number: '22'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die de persoon van een andere militair of iemand, die
      anderszins bij of ten behoeve van de krijgsmacht werkzaam is, aantast.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel22
  - number: '23'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die een andere militair of iemand, die anderszins bij of
      ten behoeve van de krijgsmacht werkzaam is, nodeloos in gevaar brengt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel23
  - number: '24'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die een mededeling, die hij uit hoofde van zijn ambt
      moet doen, niet of onjuist doet.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel24
  - number: '25.1'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die door misbruik van zijn invloed als meerdere
      tegenover een mindere deze overhaalt iets te doen, niet te doen of te dulden, indien daaruit enig nadeel voor de
      dienst, de mindere of een derde kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel25
  - number: '25.2'
    text: |-
      Het eerste lid is mede van toepassing op de militair die geen dienst doet of behoort te doen, en zich niet bevindt
      op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel25
  - number: '26.1'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die door gift, belofte, bedreiging of misleiding een
      andere militair:
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel26
  - number: 26.1.a
    text: weerhoudt van het ter kennis van de commandant brengen van een inbreuk op een gedragsregel, omschreven in deze wet;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel26
  - number: 26.1.b
    text: |-
      overhaalt tot het valselijk ter kennis van de commandant brengen van een inbreuk op een gedragsregel, omschreven in
      deze wet;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel26
  - number: 26.1.c
    text: overhaalt tot of weerhoudt van het instellen van beroep, het doen van een beklag of het indienen van een verzoek.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel26
  - number: '26.2'
    text: |-
      Het eerste lid is mede van toepassing op de militair die geen dienst doet of behoort te doen, en zich niet bevindt
      op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel26
  - number: '27'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die, wetende dat een mindere inbreuk maakt of heeft
      gemaakt op een gedragsregel van deze wet, nalaat maatregelen te nemen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel27
  - number: '28'
    text: In strijd met de militaire tucht gedraagt zich de militair die een onrechtmatig bevel geeft aan een mindere.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel28
  - number: '29'
    text: In strijd met de militaire tucht gedraagt zich de militair die wanordelijkheden veroorzaakt of daaraan deelneemt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel29
  - number: '30.1'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die een andere militair mondeling of bij geschrifte
      opruit tot een inbreuk op enige in deze wet omschreven gedragsregel, alsmede de militair die een dergelijk
      geschrift verspreidt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel30
  - number: '30.2'
    text: |-
      Het eerste lid is mede van toepassing op de militair die geen dienst doet of behoort te doen, en zich niet bevindt
      op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel30
  - number: '31'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die een geschrift verspreidt of op enige andere wijze
      openbaar maakt op een plaats, een tijdstip of een wijze, waaromtrent bij dienstvoorschrift een verbod is gegeven in
      het belang van het verkeer of ter voorkoming van belemmering van de dienst of ter bescherming van rijksgoederen of
      goederen van derden.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel31
  - number: '32'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die inbreuk maakt op de regels die bij dienstvoorschrift
      zijn vastgelegd inzake meningsuiting die anders dan door middel van geschrift plaatsvindt, voorzover die regels
      niet de inhoud van de uiting betreffen, en zijn gegeven in het belang van het verkeer of ter bestrijding of
      voorkoming van ongeregeldheden en verstoringen van het ordelijk verloop van de dienst.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel32
  - number: '33.1'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die een betoging organiseert of daaraan deelneemt,
      indien deze op een militaire plaats gehouden wordt zonder dat toestemming is gevraagd van het bevoegd gezag, dan
      wel indien de toestemming is geweigerd in het belang van het verkeer, of omdat redelijkerwijs is te verwachten dat
      ongeregeldheden zullen plaatsvinden of het ordelijk verloop van de dienst zal worden verstoord.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel33
  - number: '33.2'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die buiten een militaire plaats in uniform deelneemt
      aan een betoging, tenzij deze in het land waar de militair is aangesteld dan wel waar hij als dienstplichtige in
      werkelijke dienst is gekomen plaatsvindt en uitsluitend tot onderwerp heeft de voor de militairen algemeen geldende
      arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel33
  - number: '34'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die een vergadering organiseert of daaraan deelneemt,
      indien die op een militaire plaats wordt gehouden zonder dat toestemming is gevraagd van het bevoegd gezag, dan
      wel indien de toestemming is geweigerd in het belang van het verkeer, of omdat redelijkerwijs is te verwachten dat
      ongeregeldheden zullen plaatsvinden of het ordelijk verloop van de dienst zal worden verstoord.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel34
  - number: '35.1'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die, zich voor de uitoefening van de dienst op
      het gebied van een vreemde mogendheid bevindend, enige, niet het Koninkrijk betreffende, politieke activiteit
      ontplooit. Onder politieke activiteit is niet begrepen het uitoefenen van het actief en passief kiesrecht.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel35
  - number: '35.2'
    text: |-
      Het eerste lid is mede van toepassing op de militair die geen dienst doet of behoort te doen, en zich niet bevindt
      op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel35
  - number: '36.1'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die zonder daartoe gerechtigd te zijn gebruik maakt van
      goederen of diensten van de krijgsmacht, van een andere militair of van iemand, die anderszins bij of ten behoeve
      van de krijgsmacht werkzaam is, dan wel deze goederen wegneemt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel36
  - number: '36.2'
    text: |-
      Voorzover het goederen of diensten van de krijgsmacht betreft is het eerste lid mede van toepassing op de militair
      die geen dienst doet of behoort te doen, en die zich niet bevindt op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel36
  - number: '37'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die enig goed, in gebruik bij of ten behoeve van de
      krijgsmacht, onzorgvuldig behandelt of onderhoudt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel37
  - number: '38'
    text: In strijd met de militaire tucht gedraagt zich de militair die in uniform nodeloos slordig gekleed gaat.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel38
  - number: '39.1'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die enig goed, in gebruik bij of ten behoeve van de
      krijgsmacht, van een andere militair of van iemand, die anderszins bij of ten behoeve van de krijgsmacht werkzaam
      is, vernielt, beschadigt, onbruikbaar of onklaar maakt dan wel wegmaakt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel39
  - number: '39.2'
    text: |-
      Voorzover het een goed in gebruik bij of ten behoeve van de krijgsmacht betreft is het eerste lid mede van
      toepassing op de militair die geen dienst doet of behoort te doen, en zich niet bevindt op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel39
  - number: '40'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die de aan een andere militair of iemand, die anderszins
      bij of ten behoeve van de krijgsmacht werkzaam is, voor persoonlijk gebruik ter beschikking gestelde ruimte niet
      respecteert.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel40
  - number: '41'
    text: 'De straffen zijn:'
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel41
  - number: 41.a
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel41
  - number: 41.b
    text: geldboete;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel41
  - number: 41.c
    text: strafdienst;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel41
  - number: 41.d
    text: uitgaansverbod.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel41
  - number: '42.1'
    text: De berisping bestaat uit een geschrift waarvan het model door Onze Minister van Defensie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel42
  - number: '42.2'
    text: |-
      De tenuitvoerlegging van de berisping geschiedt door de uitreiking van het geschrift tegelijk met de uitreiking van
      het afschrift van de uitspraak.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel42
  - number: '43.1'
    text: |-
      Het bedrag van de geldboete is tenminste € 2 en ten hoogste  € 45. In de Nederlandse Antillen onderscheidenlijk in
      Aruba zijn deze bedragen ANG 10 en ANG 100, onderscheidenlijk AWG 10 en AWG 100.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel43
  - number: '43.2'
    text: |-
      Een geldboete kan niet worden opgelegd indien daardoor de som van de geldboetes, ingevolge deze wet in een
      kalendermaand aan de militair opgelegd, een bedrag van € 90, dan wel ANG 200 onderscheidenlijk AWG 200, te boven
      zou gaan.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel43
  - number: '43.3'
    text: |-
      Ingeval de schending van een gedragsregel plaatsvindt terwijl de militair deelneemt aan een operatie
      in internationaal verband buiten het Koninkrijk is, in afwijking van het eerste lid, het bedrag van de
      geldboete ten hoogste € 90, dan wel ANG 200 onderscheidenlijk AWG 200. Een geldboete met toepassing van
      [de voorgaande volzin][ref1] kan niet worden opgelegd indien daardoor de som bedoeld in het tweede lid een bedrag
      van € 270, dan wel ANG 600 onderscheidenlijk AWG 600, te boven zou gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel43
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '43'
        hoofdstuk: III
  - number: '44.1'
    text: |-
      De geldboete moet binnen drie dagen na de uitreiking van het afschrift van de uitspraak door de gestrafte worden
      betaald.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel44
  - number: '44.2'
    text: |-
      De commandant kan de gestrafte op zijn verzoek eenmaal uitstel van betaling verlenen voor ten hoogste achtentwintig
      dagen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel44
  - number: '44.3'
    text: |-
      De geldboete moet in ieder geval worden betaald als het feitelijk verblijf onder de wapenen van de gestrafte
      eindigt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel44
  - number: '45.1'
    text: |-
      Bij gebreke van betaling binnen de bij of ingevolge het voorgaand artikel gestelde termijn worden de niet betaalde
      geldboetes op de militaire bezoldiging van de gestrafte ingehouden.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel45
  - number: '45.2'
    text: De inhouding geschiedt door de functionaris belast met de uitbetaling van de militaire bezoldiging.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel45
  - number: '45.3'
    text: |-
      Op het in te houden bedrag wordt een toeslag berekend van tien procent met een minimum van € 0,45, dan wel ANG 1
      onderscheidenlijk AWG 1, welke op gelijke wijze als de geldboete op de aan een gestrafte toekomende bezoldiging
      wordt ingehouden.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel45
  - number: '46'
    text: |-
      Bij of krachtens algemene maatregel van Rijksbestuur worden regels gesteld met betrekking tot de invordering, de
      inhouding, de verantwoording en de bestemming van de ingevorderde of ingehouden gelden.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel46
  - number: '47.1'
    text: |-
      De strafdienst bestaat uit het verrichten van dienst door de gestrafte in overeenstemming met zijn rang, stand of
      functie, buiten de voor hem geldende diensturen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel47
  - number: '47.2'
    text: De strafdienst wordt opgelegd voor de duur van ten hoogste drie uren op ten hoogste tien werkdagen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel47
  - number: '47.3'
    text: Een militair ondergaat op dezelfde dag niet meer dan een straf van strafdienst.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel47
  - number: '47.4'
    text: Een militair ondergaat per kalendermaand de straf van strafdienst niet gedurende meer dan vijftien werkdagen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel47
  - number: '47.5'
    text: |-
      Indien een militair op grond van het bepaalde in het vorige lid in een kalendermaand een hem opgelegde straf van
      strafdienst niet volledig ondergaat, zal hij het resterende deel in de volgende kalendermaand ondergaan.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel47
  - number: '47.6'
    text: |-
      De tenuitvoerlegging van de strafdienst vangt zo spoedig mogelijk aan na de uitreiking van het afschrift van de
      uitspraak en vindt voor zover mogelijk plaats op achtereenvolgende werkdagen. Strafdienst wordt niet ten uitvoer
      gelegd tijdens verlofdagen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel47
  - number: '47.7'
    text: Het ondergaan van de straf van strafdienst is dienst.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel47
  - number: '47.8'
    text: |-
      In geval van ontslag uit de militaire dienst eindigt de tenuitvoerlegging van de strafdienst van rechtswege op het
      moment waarop dat ontslag ingaat.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel47
  - number: '47.9'
    text: |-
      Onverminderd het bepaalde in het vorige lid kan de beklagmeerdere het feitelijk verblijf onder de wapenen van
      degene die de straf van strafdienst ondergaat, verlengen totdat die straf is ondergaan.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel47
  - number: '47.10'
    text: |-
      Op de dag waarop de straf van uitgaansverbod wordt ondergaan, kan niet ook de straf van strafdienst worden
      ondergaan.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel47
  - number: '47.11'
    text: Onttrekking aan strafdienst schorst van rechtswege de straf.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel47
  - number: '48.1'
    text: |-
      Het uitgaansverbod bestaat uit de verplichting om op de door de commandant aan te wijzen militaire plaats of
      gedeelten daarvan aanwezig te zijn en te blijven.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel48
  - number: '48.2'
    text: |-
      Aan de militair die gestraft is met de straf van uitgaansverbod, kan worden opgedragen gedurende de tijd, dat hij
      die straf ondergaat, dienst te verrichten in overeenstemming met zijn rang, stand of functie.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel48
  - number: '48.3'
    text: |-
      Het uitgaansverbod kan worden opgelegd indien de militair de gedragsregel van [artikel 7][ref1] of van
      [artikel 15][ref2] heeft geschonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel15
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '15'
        hoofdstuk: II
        paragraaf: '4'
  - number: '48.4'
    text: Het uitgaansverbod wordt opgelegd voor de duur van ten hoogste vier aaneengesloten dagen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel48
  - number: '48.5'
    text: |-
      Een militair ondergaat per kalendermaand de straf van uitgaansverbod niet gedurende meer dan acht dagen, en
      voor zover de tenuitvoerlegging geheel of ten dele in het weekend plaatsvindt, gedurende niet meer dan twee
      opeenvolgende weekenden.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel48
  - number: '48.6'
    text: |-
      Het [derde, vijfde, zevende, achtste, negende, tiende en elfde lid van artikel 47][ref1] zijn van overeenkomstige
      toepassing. Het [zesde lid van artikel 47][ref2] is van overeenkomstige toepassing met dien verstande dat de
      tenuitvoerlegging ook plaatsvindt op vrije dagen niet zijnde verlofdagen.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel47
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '47'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '47'
        hoofdstuk: III
  - number: '48.7'
    text: |-
      Ingeval schending van de gedragsregel van [artikel 7][ref1] wordt afgedaan met toepassing van
      [artikel 79, eerste lid][ref2], of indien er nog geen 90 dagen zijn verlopen nadat aan de militair een uitspraak
      is uitgereikt waarin hij schuldig werd verklaard aan schending van diezelfde gedragsregel is, indien de straf van
      uitgaansverbod wordt opgelegd, in afwijking van het vierde en vijfde lid, het aantal op te leggen dagen ten hoogste
      acht en het aantal in een kalendermaand te ondergane dagen uitgaansverbod ten hoogste twaalf.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel79
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '79'
        hoofdstuk: V
        paragraaf: '7'
  - number: '49.1'
    text: 'De bevoegdheid tot het opleggen van straffen aan onder zijn bevelen staande militairen komt toe aan:'
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel49
  - number: 49.1.a
    text: |-
      de bevelvoerende militair van een oorlogsschip, inrichting van de zeemacht, compagnie, eskadron, batterij of
      squadron;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel49
  - number: 49.1.b
    text: |-
      de door Onze Minister van Defensie aangewezen bevelvoerende militair van een andere militaire eenheid dan onder
      a genoemd.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel49
  - number: '49.2'
    text: |-
      Aan boord van een oorlogsschip komt de bevoegdheid tot het opleggen van straffen aan militairen, die op dat schip
      zijn ingescheept, uitsluitend toe aan de bevelvoerende militair van dat schip.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel49
  - number: '49.3'
    text: |-
      Indien een bevelvoerende militair als bedoeld in het eerste lid, onder a of b, zelf degene is van wie wordt vermoed
      dat hij een in deze wet omschreven gedragsregel heeft geschonden, komt de bevoegdheid tot het opleggen van straffen
      toe aan de onmiddellijk boven hem gestelde bevelvoerende meerdere.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel49
  - number: '49.4'
    text: |-
      De bevoegdheid tot het opleggen van straffen komt toe aan de onmiddellijk boven een in het eerste lid bedoelde
      bevelvoerende militair gestelde bevelvoerende meerdere indien het betreft een in een van de [artikelen 20-23][ref1]
      omschreven gedraging tegen de persoon van de in het eerste lid bedoelde bevelvoerende militair.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel20
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '20'
        hoofdstuk: II
        paragraaf: '6'
  - number: '49.5'
    text: |-
      Indien een militair van wie wordt vermoed dat hij een in deze wet omschreven gedragsregel heeft geschonden hoger of
      ouder in rang is dan de in het eerste lid bedoelde bevelvoerende militair komt de bevoegdheid tot het opleggen van
      straffen toe aan de onmiddellijk boven laatstbedoelde militair gestelde bevelvoerende meerdere van hogere rang dan
      eerstbedoelde militair.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel49
  - number: '49.6'
    text: |-
      Indien in de gevallen bedoeld in het derde, vierde of vijfde lid de aldaar aangewezen bevelvoerende militair geen
      tuchtproces kan doen aanvangen binnen de in [artikel 53, eerste lid][ref1], genoemde termijn, wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel53
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '53'
        hoofdstuk: V
        paragraaf: '1'
  - number: 49.6.a
    text: |-
      het tuchtproces gehouden door de in het eerste lid bedoelde bevelvoerende militair zelf in het geval bedoeld in het
      vierde lid;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel49
  - number: 49.6.b
    text: deze termijn verlengd met 21 dagen in de gevallen bedoeld in het derde of vijfde lid.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel49
  - number: '50.1'
    text: |-
      De bevoegdheid om, hetzij de tenuitvoerlegging van een straf van een geldboete hoger dan € 35, dan wel ANG 75
      onderscheidenlijk AWG 75, van strafdienst of van uitgaansverbod op te schorten of te schorsen, hetzij, na verloop
      van de termijn bedoeld in [artikel 80a, eerste lid][ref1], en buiten het geval dat tegen de uitspraak beklag is
      gedaan, een strafoplegging teniet te doen, te wijzigen in de straf van berisping, binnen de opgelegde strafsoort
      de strafmaat te verminderen of te wijzigen in een beslissing als bedoeld in [artikel 74, derde lid][ref2], komt
      toe aan:


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80a
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel74
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80a
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '74'
        hoofdstuk: V
        paragraaf: '6'
  - number: 50.1.a
    text: de commandant;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel50
  - number: 50.1.b
    text: de beklagmeerdere.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel50
  - number: '50.2'
    text: |-
      Bij tenietdoening of vermindering van de straf dan wel wijziging in de straf van berisping of in een beslissing als
      bedoeld in [artikel 74, derde lid][ref1], is [artikel 98][ref2] van overeenkomstige toepassing, met dien verstande
      dat voor gerecht wordt gelezen degene die vermindert, teniet doet, wijzigt of beslist geen straf op te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel98
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '74'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '98'
        hoofdstuk: V
        paragraaf: '2'
  - number: '51.1'
    text: |-
      Het tuchtproces in eerste aanleg vangt aan met de uitreiking door of namens de commandant aan de militair, van
      wie wordt vermoed dat hij een in deze wet omschreven gedragsregel heeft geschonden, van een schriftelijk stuk, de
      beschuldiging, hetwelk een omschrijving inhoudt van deze schending.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel51
  - number: '51.2'
    text: De commandant behoudt een afschrift van de beschuldiging.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel51
  - number: '51.3'
    text: De datum van de uitreiking wordt aangetekend op het afschrift bedoeld in het voorgaande lid.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel51
  - number: '51.4'
    text: Terzake van dezelfde gedraging kan slechts eenmaal een beschuldiging worden uitgereikt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel51
  - number: '51.5'
    text: |-
      Wijziging van de beschuldiging is voor de aanvang van het onderzoek mogelijk. In geen geval worden wijzigingen
      toegelaten die ten gevolge hebben dat de beschuldiging niet langer dezelfde gedraging in de zin van
      [artikel 52, onder b][ref1] zou inhouden. De wijziging wordt onverwijld, doch in ieder geval voor de aanvang van
      het onderzoek, aan de beschuldigde schriftelijk meegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel52
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '52'
        hoofdstuk: V
        paragraaf: '1'
  - number: '52'
    text: 'De beschuldiging vermeldt:'
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel52
  - number: 52.a
    text: de naam, rang en militaire eenheid van de betreffende militair;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel52
  - number: 52.b
    text: |-
      de omschrijving van een of meer gedragingen die vermoedelijk de schending van een of meer gedragsregels inhouden
      met vermelding van feiten en omstandigheden waarop dat vermoeden is gegrond en met opgave van tijd en plaats waarop
      die gedraging of gedragingen hebben plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel52
  - number: 52.c
    text: de mededeling dat de commandant heeft besloten terzake een onderzoek te houden;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel52
  - number: 52.d
    text: het artikel of de artikelen op grond waarvan de beschuldiging wordt uitgereikt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel52
  - number: '53.1'
    text: |-
      Behoudens [artikel 49, zesde lid][ref1], wordt geen beschuldiging uitgereikt indien er 21 dagen zijn verlopen
      nadat de gedraging heeft plaatsgevonden of, voor zover het betreft een vermoedelijke schending van een van
      de gedragsregels omschreven in de [artikelen 6][ref2], [23][ref3], [26][ref4], [37][ref5] of [39][ref6],
      indien er 21 dagen zijn verlopen nadat de gedraging werd ontdekt of, indien toepassing is gegeven aan
      [artikel 78, eerste lid][ref7], of [79, eerste lid][ref8], indien er 21 dagen zijn verlopen nadat de beslissing van
      het openbaar ministerie ter kennis is gekomen van de commandant.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004788#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0004788#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0004788#Artikel37
      [ref6]: https://wetten.overheid.nl/BWBR0004788#Artikel39
      [ref7]: https://wetten.overheid.nl/BWBR0004788#Artikel78
      [ref8]: https://wetten.overheid.nl/BWBR0004788#Artikel79
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '49'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004788
        artikel: '23'
        hoofdstuk: II
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0004788
        artikel: '26'
        hoofdstuk: II
        paragraaf: '7'
      - id: ref5
        bwb_id: BWBR0004788
        artikel: '37'
        hoofdstuk: II
        paragraaf: '9'
      - id: ref6
        bwb_id: BWBR0004788
        artikel: '39'
        hoofdstuk: II
        paragraaf: '9'
      - id: ref7
        bwb_id: BWBR0004788
        artikel: '78'
        hoofdstuk: V
        paragraaf: '7'
      - id: ref8
        bwb_id: BWBR0004788
        artikel: '79'
        hoofdstuk: V
        paragraaf: '7'
  - number: '53.2'
    text: Geen beschuldiging wordt uitgereikt aan degene die feitelijk niet meer onder de wapenen verblijft.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel53
  - number: '53.3'
    text: |-
      De in het eerste lid bedoelde termijn bedraagt 60 dagen indien in de beschuldiging is aangegeven dat de gedraging
      heeft plaatsgevonden terwijl de militair deelneemt aan een operatie in internationaal verband buiten het Koninkrijk
      en de militair en de commandant zich om redenen van dienst niet in hetzelfde land bevinden op het tijdstip waarop
      de gedraging volgens de beschuldiging eindigde.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel53
  - number: '53.4'
    text: |-
      Voor de bepaling van de duur van de termijn waarbinnen een beschuldiging kan worden uitgereikt als bedoeld in
      het eerste lid, worden de dagen waarop verlof is verleend aan de militair aan wie de commandant voornemens is een
      beschuldiging uit te reiken, of de dagen waarop deze militair door ziekte of ongeoorloofde afwezigheid niet bij
      zijn eenheid aanwezig is, niet meegeteld.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel53
  - number: '53.5'
    text: |-
      Geen beschuldiging wordt uitgereikt indien uit feiten of omstandigheden blijkt of redelijkerwijze moet worden
      vermoed dat er 60 dagen zijn verlopen nadat de gedraging heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel53
  - number: '53.6'
    text: |-
      Ingeval toepassing is gegeven aan [artikel 78, eerste lid][ref1], of [79, eerste lid][ref2], wordt de in het vijfde
      lid genoemde termijn met 30 dagen verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel79
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '78'
        hoofdstuk: V
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '79'
        hoofdstuk: V
        paragraaf: '7'
  - number: '53.7'
    text: Een beschuldiging, uitgereikt in strijd met de voorgaande leden, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel53
  - number: '54.1'
    text: 'Het tuchtproces in eerste aanleg eindigt:'
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel54
  - number: 54.1.a
    text: |-
      met een beslissing als bedoeld in de [artikelen 53, zesde lid][ref1], [76, eerste lid][ref2],
      [78, tweede lid][ref3], of [80, zesde lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0004788#Artikel78
      [ref4]: https://wetten.overheid.nl/BWBR0004788#Artikel80
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '53'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '76'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0004788
        artikel: '78'
        hoofdstuk: V
        paragraaf: '7'
      - id: ref4
        bwb_id: BWBR0004788
        artikel: '80'
        hoofdstuk: V
        paragraaf: '7'
  - number: 54.1.b
    text: |-
      van rechtswege indien er na 21 dagen sedert de aanvang van het tuchtproces geen beslissing is genomen
      als bedoeld in [artikel 76, eerste lid][ref1], behoudens de verlenging van deze termijn ingevolge de
      [artikelen 59, tweede lid][ref2], [64, tweede of derde lid][ref3], of [80, eerste lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0004788#Artikel64
      [ref4]: https://wetten.overheid.nl/BWBR0004788#Artikel80
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '76'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '59'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004788
        artikel: '64'
        hoofdstuk: V
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0004788
        artikel: '80'
        hoofdstuk: V
        paragraaf: '7'
  - number: 54.1.c
    text: van rechtswege bij ontslag uit de militaire dienst.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel54
  - number: '54.2'
    text: |-
      Behoudens in het geval uitspraak is gedaan als bedoeld in [artikel 76, eerste lid][ref1], deelt de commandant aan
      de beschuldigde schriftelijk mee dat het tuchtproces is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel76
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '76'
        hoofdstuk: V
        paragraaf: '6'
  - number: '55'
    text: |-
      Het feitelijk verblijf onder de wapenen kan door de beklagmeerdere worden verlengd voor het houden van een
      tuchtproces in eerste aanleg, behoudens in het geval bedoeld in [artikel 80, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '80'
        hoofdstuk: V
        paragraaf: '7'
  - number: '56.1'
    text: |-
      De beschuldigde kan zich in ieder stadium van het tuchtproces in eerste aanleg doen bijstaan door een
      vertrouwensman.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel56
  - number: '56.2'
    text: Het bepaalde in het voorgaande lid wordt de beschuldigde bij het uitreiken van de beschuldiging medegedeeld.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel56
  - number: '57.1'
    text: |-
      De vertrouwensman kan door de beschuldigde worden gekozen uit het militair en burgerpersoneel, in dienstbetrekking
      bij het departement van defensie en gelegerd of tewerkgesteld op hetzelfde schip, in dezelfde inrichting of
      kazerne, dan wel op dezelfde basis of bij hetzelfde onderdeel als de beschuldigde.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel57
  - number: '57.2'
    text: In bijzondere gevallen kan de commandant ook andere personen als vertrouwensman toelaten.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel57
  - number: '58'
    text: Medebeschuldigden in dezelfde zaak worden niet als vertrouwensman toegelaten.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel58
  - number: '59.1'
    text: |-
      De commandant kan de vertrouwensman voor de verdere duur van het tuchtproces in eerste aanleg uitsluiten wegens
      verstoring van de ordelijke behandeling van de zaak.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel59
  - number: '59.2'
    text: |-
      Ingeval van uitsluiting van zijn vertrouwensman wordt de beschuldigde op zijn verzoek in de gelegenheid gesteld
      binnen 24 uur een nieuwe vertrouwensman te kiezen. De termijn bedoeld in [artikel 54, eerste lid, onder b][ref1],
      wordt in dat geval met een dag verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel54
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '54'
        hoofdstuk: V
        paragraaf: '1'
  - number: '60'
    text: Het optreden als vertrouwensman is dienst.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel60
  - number: '61.1'
    text: |-
      De commandant kan de beschuldigde doen horen ter voorbereiding van het onderzoek. [Artikel 67][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel67
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '67'
        hoofdstuk: V
        paragraaf: '4'
  - number: '61.2'
    text: De commandant kan getuigen en deskundigen horen of doen horen in ieder stadium van het tuchtproces.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel61
  - number: '61.3'
    text: De verklaringen van de op grond van het eerste of tweede lid gehoorde personen worden schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel61
  - number: '62'
    text: |-
      De beschuldigde en zijn vertrouwensman kunnen na de uitreiking van de beschuldiging de op de zaak betrekking
      hebbende stukken inzien, tenzij het belang van geheimhouding van gegevens of het belang van derden zich daartegen
      verzet.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel62
  - number: '63.1'
    text: De commandant roept de beschuldigde schriftelijk op voor het onderzoek.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel63
  - number: '63.2'
    text: Het onderzoek vangt niet eerder aan dan 24 uur na de uitreiking van de beschuldiging.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel63
  - number: '63.3'
    text: Indien de beschuldigde om een eerdere behandeling verzoekt, kan de commandant daartoe besluiten.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel63
  - number: '64.1'
    text: De beschuldigde is verplicht te verschijnen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel64
  - number: '64.2'
    text: |-
      Indien de beschuldigde niet verschijnt wegens een gewichtige reden van verhindering, schort de commandant het
      onderzoek op of schorst hij dit. De termijn bedoeld in [artikel 54, eerste lid, onder b][ref1], wordt in dat geval
      voor de duur van de opschorting of schorsing, doch ten hoogste 21 dagen verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel54
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '54'
        hoofdstuk: V
        paragraaf: '1'
  - number: '64.3'
    text: |-
      Indien de beschuldigde niet verschijnt zonder een gewichtige reden van verhindering, schort de commandant het
      onderzoek op of schorst hij dit voor bepaalde tijd en wordt de beschuldigde nogmaals schriftelijk opgeroepen.
      Hij is bevoegd de medebrenging van de beschuldigde te gelasten. De tweede volzin van het voorgaande lid is van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel64
  - number: '65.1'
    text: De commandant roept de getuigen en deskundigen op wier verschijning hij nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel65
  - number: '65.2'
    text: |-
      De beschuldigde en zijn vertrouwensman kunnen verzoeken dat ook andere getuigen en deskundigen worden gehoord.
      De commandant voldoet aan dit verzoek, tenzij het onderzoek daardoor wordt geschaad of het verzoek kennelijk
      onredelijk is.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel65
  - number: '65.3'
    text: De opgeroepen getuigen en deskundigen zijn verplicht te verschijnen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel65
  - number: '65.4'
    text: |-
      Ten aanzien van getuigen en deskundigen zijn de [artikelen 217-219 van het Wetboek van Strafvordering][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '65.5'
    text: |-
      De vergoeding van door getuigen en deskundigen gemaakte onkosten geschiedt volgens regelen te stellen bij algemene
      maatregel van Rijksbestuur.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel65
  - number: '66.1'
    text: De commandant houdt het onderzoek op de grondslag van de beschuldiging.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel66
  - number: '66.2'
    text: Het onderzoek is niet openbaar.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel66
  - number: '67'
    text: |-
      De beschuldigde is niet verplicht te antwoorden. Dit wordt hem voor of bij de aanvang van het onderzoek ter kennis
      gebracht.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel67
  - number: '68.1'
    text: De commandant hoort de beschuldigde, de getuigen en de deskundigen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel68
  - number: '68.2'
    text: |-
      Hij stelt de beschuldigde en de vertrouwensman in de gelegenheid de getuigen en deskundigen, door zijn tussenkomst,
      vragen te stellen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel68
  - number: '68.3'
    text: Hij stelt de vertrouwensman in de gelegenheid het woord te voeren.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel68
  - number: '69'
    text: De beschuldigde wordt voor de sluiting van het onderzoek in de gelegenheid gesteld het laatste woord te voeren.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel69
  - number: '70'
    text: 'Als bewijsmiddelen worden alleen erkend:'
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel70
  - number: 70.a
    text: eigen waarneming door de commandant van een in de beschuldiging omschreven gedraging;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel70
  - number: 70.b
    text: eigen waarneming door de commandant tijdens het onderzoek;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel70
  - number: 70.c
    text: verklaringen van de beschuldigde;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel70
  - number: 70.d
    text: verklaringen van een getuige;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel70
  - number: 70.e
    text: verklaringen van een deskundige;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel70
  - number: 70.f
    text: geschriften.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel70
  - number: '71'
    text: |-
      Op zichzelf leveren voldoende grondslag voor de overtuiging dat de in de beschuldiging omschreven gedraging heeft
      plaatsgevonden:
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel71
  - number: 71.a
    text: de eigen waarneming genoemd in het voorgaande artikel onder *a*;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel71
  - number: 71.b
    text: |-
      de in een getuigenverklaring of in een geschrift opgenomen waarneming van een in de beschuldiging omschreven
      gedraging, door een militair of andere ambtenaar, die uit hoofde van zijn functie of rang met enig toezicht op de
      naleving van gedragsregels is belast.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel71
  - number: '72'
    text: Feiten of omstandigheden van algemene bekendheid behoeven geen bewijs.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel72
  - number: '73'
    text: |-
      Na sluiting van het onderzoek beraadt de commandant zich of hij door de inhoud van de in [artikel 70][ref1]
      genoemde bewijsmiddelen de overtuiging heeft gekregen dat een in de beschuldiging omschreven gedraging van de
      beschuldigde heeft plaatsgevonden en, in bevestigend geval, of zulks de schending van een gedragsregel oplevert.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel70
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '70'
        hoofdstuk: V
        paragraaf: '5'
  - number: '74.1'
    text: Is de commandant van oordeel dat een gedragsregel is geschonden, dan beraadt hij zich over de oplegging van straf.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel74
  - number: '74.2'
    text: Acht de commandant de beschuldigde strafbaar, dan legt hij een straf voorzien in deze wet op.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel74
  - number: '74.3'
    text: |-
      Indien de commandant dit in verband met de geringe betekenis van de gedraging of gelet op de persoon van de
      beschuldigde of zijn persoonlijke omstandigheden raadzaam acht, legt hij geen straf op.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel74
  - number: '74.4'
    text: In andere gevallen dan bedoeld in het tweede en derde lid spreekt de commandant de beschuldigde vrij.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel74
  - number: '75'
    text: |-
      Bij bestraffing van een militair die een of meer in deze wet genoemde gedragsregels heeft geschonden, wordt slechts
      een straf opgelegd.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel75
  - number: '76.1'
    text: |-
      Na het sluiten van het onderzoek beslist de commandant uiterlijk op de eerstvolgende werkdag. Deze beslissing wordt
      vastgelegd in een schriftelijk stuk, de uitspraak.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel76
  - number: '76.2'
    text: De uitspraak wordt door of namens de commandant onverwijld aan de beschuldigde uitgereikt.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel76
  - number: '76.3'
    text: De datum van uitreiking wordt op de uitspraak en op het afschrift bedoeld in het tweede lid aangetekend.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel76
  - number: '77'
    text: 'De uitspraak vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel77
  - number: 77.a
    text: de naam, rang en militaire eenheid van de beschuldigde;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel77
  - number: 77.b
    text: de bewezen gedraging of gedragingen;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel77
  - number: 77.c
    text: de geschonden gedragsregel of gedragsregels;
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel77
  - number: 77.d
    text: de beslissing.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel77
  - number: '78.1'
    text: |-
      Is de commandant van oordeel dat een hem ter kennis gekomen gedraging een strafbaar feit betreft, dan is hij
      verplicht daarvan onverwijld aangifte te doen bij een opsporingsambtenaar, behoudens in het geval dat voldaan wordt
      aan de voorwaarden gesteld op grond van het bepaalde in [artikel 59 van het Wetboek van Militair Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel59
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '59'
  - number: '78.2'
    text: |-
      Indien de commandant na de uitreiking van de beschuldiging tot het oordeel komt dat de gedraging een strafbaar feit
      betreft, trekt hij de beschuldiging in, indien hij nog niet tot een uitspraak is gekomen.
    url: https://wetten.overheid.nl/BWBR0004788/2002-01-01#Artikel78
  - number: '79.1'
    text: |-
      Indien een gedraging naar het oordeel van de commandant een van de strafbare feiten oplevert omschreven
      in de [artikelen 267, aanhef en onder 1° en 2°][ref1], [300, eerste lid][ref2], [310][ref3],
      [311, aanhef en onder 4° en 5°][ref4], [321][ref5] of [350 van het Wetboek van Strafrecht][ref6] of
      omschreven in de [artikelen 96, aanhef en onder 2° en 3°][ref7], [98, aanhef en onder 2°][ref8],
      [166][ref9] of [169 van het Wetboek van Militair Strafrecht][ref10] met dien verstande dat de duur van de in de
      [artikelen 96][ref11] en [98 van het Wetboek van Militair Strafrecht][ref12] genoemde ongeoorloofde afwezigheid ten
      hoogste acht dagen is en het openbaar ministerie bij het in [artikel 81, eerste lid][ref13], bedoelde gerecht de
      commandant mededeelt dat het voorshands instemt met tuchtrechtelijke afdoening, kan de commandant een beschuldiging
      uitreiken, voor zover de gedraging tevens de schending van een gedragsregel van deze wet inhoudt. Van de mededeling
      van het openbaar ministerie wordt aantekening gedaan in het stuk, bedoeld in [artikel 76, eerste lid][ref14].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel267
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel300
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel310
