  - number: '50'
    text: |-
      1 De bevoegdheid om, hetzij de tenuitvoerlegging van een straf van een geldboete hoger dan € 35, ANG 75, AWG 75,
      onderscheidenlijk USD 42, van strafdienst of van uitgaansverbod op te schorten of te schorsen, hetzij, na verloop
      van de termijn bedoeld in [artikel 80a, eerste lid][ref1], en buiten het geval dat tegen de uitspraak beklag is
      gedaan, een strafoplegging teniet te doen, te wijzigen in de straf van berisping, binnen de opgelegde strafsoort
      de strafmaat te verminderen of te wijzigen in een beslissing als bedoeld in [artikel 74, derde lid][ref2], komt
      toe aan:

      a. de commandant;

      b. de beklagmeerdere.

      2 Bij tenietdoening of vermindering van de straf dan wel wijziging in de straf van berisping of in een beslissing
      als bedoeld in [artikel 74, derde lid][ref3], is [artikel 98][ref4] van overeenkomstige toepassing, met dien
      verstande dat voor gerecht wordt gelezen degene die vermindert, teniet doet, wijzigt of beslist geen straf op te
      leggen.


