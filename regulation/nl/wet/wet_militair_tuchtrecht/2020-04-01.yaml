  - number: 80s
    text: |-
      1 Nadat aan de gestrafte een afschrift van de uitspraak op beklag als bedoeld in
      [artikel 80p, tweede lid, onder f][ref1], is uitgereikt, zendt de commandant de uitspraak op beklag onverwijld naar
      het gerecht.

      2 Bij de behandeling en afdoening van het beklag na verwijzing zijn de bepalingen van paragraaf 2 van Titel II van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80p
