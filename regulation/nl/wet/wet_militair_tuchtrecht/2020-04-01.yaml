  - number: '104'
    text: |-
      1 Over de inneming van een geschrift of voorwerp als bedoeld in [artikel 103][ref1] kan de rechthebbende zich
      binnen 5 dagen schriftelijk beklagen bij de voorzitter van de militaire kamer als bedoeld in [artikel 87][ref2].

      2 Met betrekking tot de wijze van indiening van het klaagschrift zijn de [artikelen 82][ref3], [83][ref4] en
      [84][ref5] van overeenkomstige toepassing.

      3 De voorzitter van de militaire kamer geeft zo spoedig mogelijk een met redenen omklede beschikking, nadat de
      klager in de gelegenheid is gesteld te worden gehoord.

      4 Acht de voorzitter van de militaire kamer het beklag gegrond, dan gelast hij dat het geschrift of voorwerp zo
      spoedig mogelijk ter beschikking wordt gesteld van de rechthebbende, indien dat nog niet is geschied op grond van
      het bepaalde in [artikel 103, derde lid][ref6].

      5 Een afschrift van de beschikking wordt uitgereikt aan de klager en aan degene die het geschrift of voorwerp heeft
      ingenomen of doen innemen.

      6 Tegen de beschikking staat geen verdere voorziening open.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel103
