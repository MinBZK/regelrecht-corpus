  - number: '105'
    text: |-
      Onverminderd de bepalingen van het Verdrag van Genève betreffende de behandeling van krijgsgevangenen,
      van 12 augustus 1949, is deze rijkswet, met uitzondering van [hoofdstuk III][ref1], van
      overeenkomstige toepassing op krijgsgevangenen en andere geïnterneerde personen die ingevolge
      [artikel 65 van het Wetboek van Militair Strafrecht][ref2] gedeeltelijk met Nederlandse militairen zijn
      gelijkgesteld, met dien verstande dat:

      a. de straffen, omschreven in [artikel 89, eerste lid][ref3], van vorengenoemd verdrag, worden geacht te zijn
      voorzien in deze rijkswet;

      b. met betrekking tot de tenuitvoerlegging van de straf, omschreven in [artikel 89, eerste lid, onder 1][ref4] van
      vorengenoemd verdrag, de [artikelen 44-46 van deze rijkswet][ref5] van overeenkomstige toepassing zijn;

      c. de tenuitvoerlegging van de straf, omschreven in [artikel 89, eerste lid, onder 4][ref6] van vorengenoemd
      verdrag, geschiedt volgens regelen te stellen bij algemene maatregel van Rijksbestuur;

      d. de vergrijpen, bedoeld in [artikel 93, tweede en derde lid][ref7], van vorengenoemd verdrag, worden geacht
      in te houden schendingen van gedragsregels van deze rijkswet, terwijl ten aanzien van die feiten het gestelde in
      [artikel 78 van deze rijkswet][ref8] buiten toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#HoofdstukIII
