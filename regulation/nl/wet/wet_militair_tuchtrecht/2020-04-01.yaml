  - number: '94'
    text: |-
      1 De militaire kamer kan een verhoor schriftelijk doen geschieden dan wel de ondervraging opdragen aan een van haar
      leden of aan een opsporingsambtenaar.

      2 Het lid van de militaire kamer beëdigt, indien er naar zijn oordeel een gegrond vermoeden bestaat dat de getuige
      niet op de terechtzitting zal kunnen verschijnen, de getuige dat hij de gehele waarheid en niets dan de waarheid
      zal zeggen.

      3 De deskundige wordt door het lid van de militaire kamer beëdigd dat hij zijn taak naar zijn geweten zal
      vervullen.

      4. Van de reden van de beëdiging als bedoeld in het tweede lid wordt in het proces-verbaal melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel94
  - number: '95'
    text: |-
      1 Het gerecht beslist uiterlijk 14 dagen na afloop van de behandeling van het beroep in een schriftelijke, met
      redenen omklede uitspraak.

      2 De voorlezing van de uitspraak in beroep geschiedt in het openbaar en de uitspraak wordt de gestrafte in persoon
      betekend.

      3 Een afschrift van de uitspraak wordt toegezonden aan de commandant, de beklagmeerdere, en aan Onze Minister van
      Defensie.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel95
  - number: '96'
    text: |-
      1 Het gerecht verklaart zich onbevoegd van het beroep kennis te nemen, verklaart het beroep niet ontvankelijk, of
      bevestigt de beslissing waartegen beroep is ingesteld, zonodig met verbetering of aanvulling daarvan, of doet de
      zaak af met gehele of gedeeltelijke vernietiging van die beslissing.

      2 Indien een beroep is ingesteld als bedoeld in [artikel 81, vierde lid][ref1], verklaart het gerecht bij
      gemotiveerde beslissing dit beroep geheel of gedeeltelijk gegrond of ongegrond.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel81
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
  - number: '97'
    text: |-
      De beslissing waartegen beroep is ingesteld wordt vernietigd:

      a. Indien enige in de [Titels I][ref1] of[ IA van dit hoofdstuk][ref2] voorgeschreven termijn is geschonden;

      b. indien enige andere vorm dan onder *a* bedoeld, is verzuimd en redelijkerwijs kan worden aangenomen dat de
      gestrafte daardoor in zijn verdediging is geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0004788#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0004788
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004788
        hoofdstuk: V
  - number: '98'
    text: |-
      Indien bij de beslissing in beroep een reeds geheel of gedeeltelijk tenuitvoergelegde straf van strafdienst of
      van uitgaansverbod wordt tenietgedaan of verminderd, of een beroep als bedoeld in [artikel 81, vierde lid][ref1],
      geheel of gedeeltelijk gegrond wordt verklaard, bepaalt het gerecht, volgens bij of krachtens algemene maatregel
      van Rijksbestuur te stellen regelen, op welke wijze het door de gestrafte geleden nadeel zal worden hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel81
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
  - number: '99'
    text: |-
      Indien de tenuitvoerlegging van de opgelegde straf is opgeschort of geschorst, wordt, als de beslissing van het
      gerecht daartoe aanleiding geeft, de straf of het resterende deel van de straf zo spoedig mogelijk ten uitvoer
      gelegd.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel99
  - number: '100'
    text: |-
      Tegen de beslissing in beroep staat geen verdere voorziening open, onverminderd de bevoegdheid van de Procureur-
      Generaal bij de Hoge Raad om zich in het belang der wet in cassatie te voorzien.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel100
  - number: '101'
    text: |-
      Indien het beroep is ingesteld bij een mobiele rechtbank, is het bepaalde in deze paragraaf omtrent de militaire
      kamer van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel101
  - number: '102'
    text: |-
      1 In geval van ontdekking op heterdaad is, indien bijzondere omstandigheden dat onverwijld vorderen, iedere
      meerdere bevoegd degene die wordt verdacht van de schending van een gedragsregel aan te houden en hem naar een
      plaats van verhoor te geleiden. [Artikel 128 van het Wetboek van Strafvordering][ref1] is van overeenkomstige
      toepassing.

      2 De meerdere is bevoegd van iedere mindere te vorderen hem bij de geleiding bijstand te verlenen.

      3 Indien de meerdere de plaats van aanhouding niet terstond kan verlaten, is hij bevoegd van iedere mindere te
      vorderen voor de geleiding zorg te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel128
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '128'
  - number: '103'
    text: |-
      1 De commandant is bevoegd een geschrift als bedoeld in [artikel 30][ref1] of [31][ref2], dan wel een ander
      voorwerp waarvan hij redelijkerwijs mag aannemen dat het tot bewijs kan dienen van de schending van een
      gedragsregel, in te nemen of te doen innemen.

      2 Indien de commandant niet aanwezig is en zijn optreden niet kan worden afgewacht, dan wel indien de dader van de
      schending van een gedragsregel onbekend is, komt de in het vorige lid genoemde bevoegdheid mede toe aan door Onze
      Minister van Defensie aangewezen functionarissen.

      3 Het in het eerste lid bedoelde geschrift of voorwerp wordt zo spoedig mogelijk ter beschikking gesteld van de
      rechthebbende, doch in elk geval:

      a. zodra de commandant beslist geen beschuldiging uit te reiken;

      b. zodra blijkt dat geen beschuldiging kan worden uitgereikt op grond van het bepaalde in
      [artikel 53, eerste, tweede of vijfde lid][ref3];

      c. tien dagen na de uitreiking van de uitspraak in eerste aanleg, indien geen beklag is gedaan of beroep is
      ingesteld;

      d. vijf dagen na de uitreiking van een uitspraak op beklag die geen verwijzing inhoudt als bedoeld in
      [artikel 80p, tweede lid, onder f][ref4], indien geen beroep is ingesteld;

      e. zodra het tuchtproces op een andere wijze eindigt;

      f. bij de uitspraak in beroep.

      4 Indien toepassing is gegeven aan [artikel 78][ref5] wordt, in afwijking van het gestelde in het derde lid, het
      geschrift of voorwerp ter beschikking gesteld van de opsporingsambtenaar. Deze terbeschikkingstelling geldt als een
      inbeslagneming door een opsporingsambtenaar als bedoeld in het [Wetboek van Strafvordering][ref6].

      5 Het in het eerste lid bedoelde geschrift of voorwerp wordt op de wijze te bepalen bij algemene maatregel van
      Rijksbestuur gedurende zes maanden ter beschikking gehouden van de rechthebbende. Is teruggave alsdan niet mogelijk
      gebleken dan wordt het geschrift of voorwerp vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel31
