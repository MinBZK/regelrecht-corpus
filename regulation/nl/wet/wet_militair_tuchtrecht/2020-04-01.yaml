        artikel: '60'
        hoofdstuk: V
        paragraaf: '2'
  - number: 80f
    text: |-
      1 De beklagmeerdere kan de gestrafte doen horen ter voorbereiding van het onderzoek op beklag.

      2 De gestrafte is verplicht te verschijnen. [Artikel 80i, tweede lid, eerste volzin][ref1], is van overeenkomstige
      toepassing. De gestrafte is niet verplicht te antwoorden. Dit wordt hem voor of bij aanvang van het ter
      voorbereiding horen ter kennis gebracht.

      3 De beklagmeerdere kan de commandant, getuigen en deskundigen horen of doen horen in ieder stadium van de
      beklagprocedure.

      4 De verklaringen van de gehoorde personen worden schriftelijk vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80i
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80f
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80i
        hoofdstuk: V
        paragraaf: '2'
  - number: 80g
    text: |-
      1 De beklagmeerdere bepaalt op welke dag het onderzoek op beklag zal aanvangen. Deze dag kan niet later worden
      bepaald dan uiterlijk de dertigste dag na de dag van indiening van het beklagschrift.

      2 De dagen waarop de gestrafte en de beklagmeerdere zich om redenen van dienst niet in hetzelfde land bevinden,
      tellen niet mee voor de bepaling van de termijn genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80g
  - number: 80h
    text: |-
      1 De gestrafte wordt door of namens de beklagmeerdere schriftelijk opgeroepen voor het onderzoek op beklag. Dit
      onderzoek vangt niet eerder aan dan op de tweede dag na de dag waarop de oproeping aan de gestrafte is uitgereikt,
      tenzij de gestrafte om eerdere behandeling verzoekt.[ Artikel 62][ref1] is van overeenkomstige toepassing met dien
      verstande dat voor beschuldiging wordt gelezen oproeping.

      2 De beklagmeerdere roept de commandant, de getuigen en deskundigen op wier verschijning hij nodig oordeelt.

      3 De gestrafte en zijn vertrouwensman kunnen verzoeken dat ook andere getuigen en deskundigen worden gehoord.
      De beklagmeerdere voldoet aan dit verzoek, tenzij het onderzoek daardoor wordt geschaad of het verzoek kennelijk
      onredelijk is.

      4 [Artikel 65, derde, vierde en vijfde lid][ref2], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel65
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80h
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '62'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '65'
        hoofdstuk: V
        paragraaf: '4'
  - number: 80i
    text: |-
      1 De beklagmeerdere is verplicht de gestrafte in persoon te horen tijdens het onderzoek op beklag, tenzij deze is
      gehoord als bedoeld in [artikel 80f, eerste lid][ref1], en te kennen heeft gegeven op horen in persoon geen prijs
      te stellen en de beklagmeerdere het horen in persoon niet nodig oordeelt.

      2 Indien de gestrafte niet verschijnt wegens een gewichtige reden van verhindering schort de beklagmeerdere het
      onderzoek op beklag op of schorst hij dit. De termijn bedoeld in [artikel 80r, tweede lid, onder b][ref2], wordt in
      dat geval voor de duur van de opschorting of schorsing verlengd.

      3 Indien de gestrafte niet verschijnt zonder een gewichtige reden van verhindering, doet de beklagmeerdere het
      beklag verder af.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80f
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel80r
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80i
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80f
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: 80r
        hoofdstuk: V
        paragraaf: '2'
  - number: 80j
    text: |-
      1 De beklagmeerdere houdt het onderzoek op beklag op de grondslag van de beschuldiging.

      2 Het onderzoek op beklag is niet openbaar.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80j
  - number: 80k
    text: |-
      De gestrafte is niet verplicht te antwoorden. Dit wordt hem voor of bij aanvang van het onderzoek op beklag ter
      kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80k
  - number: 80l
    text: |-
      1 De beklagmeerdere hoort de commandant, de getuigen en de deskundigen indien zij zijn opgeroepen.

      2 Hij stelt de gestrafte en de vertrouwensman in de gelegenheid de commandant, de getuigen en de deskundigen, door
      zijn tussenkomst, vragen te stellen.

      3 Hij stelt de vertrouwensman in de gelegenheid het woord te voeren.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80l
  - number: 80m
    text: |-
      De gestrafte wordt voor de sluiting van het onderzoek op beklag in de gelegenheid gesteld het laatste woord te
      voeren.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80m
  - number: 80n
    text: |-
      Ten aanzien van de bewijsmiddelen zijn de bepalingen van paragraaf 5 van Titel I van dit hoofdstuk van toepassing.
      Als bewijsmiddel wordt tevens erkend de eigen waarneming door de beklagmeerdere tijdens het onderzoek op beklag.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80n
  - number: 80o
    text: |-
      1 Na sluiting van het onderzoek beraadt de beklagmeerdere zich of hij door de inhoud van de in [artikel 80n][ref1]
      bedoelde bewijsmiddelen de overtuiging heeft gekregen dat een in de beschuldiging omschreven gedraging van de
      gestrafte heeft plaatsgevonden en of zulks een schending van een gedragsregel oplevert.

      2 Met betrekking tot een beklag als bedoeld in [artikel 80a, derde lid][ref2], wordt door de beklagmeerdere aan de
      hand van de door de commandant opgegeven motivering beoordeeld of de wijze van de tenuitvoerlegging als passend kan
      worden beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80n
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel80a
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80o
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80n
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: 80a
        hoofdstuk: V
        paragraaf: '1'
  - number: 80p
    text: |-
      1 Na het sluiten van het onderzoek op beklag beslist de beklagmeerdere uiterlijk op de eerstvolgende werkdag.

      2 De beslissing van de beklagmeerdere luidt:

      a. bevestiging van de bestreden beslissing, zo nodig met verbetering of aanvulling;

      b. bevestiging van de bestreden schuldigverklaring, zonodig met verbetering of aanvulling, met vermindering van de
      strafmaat binnen de opgelegde strafsoort;

      c. bevestiging van de bestreden schuldigverklaring, zonodig met verbetering of aanvulling, met wijziging van de
      opgelegde straf in de straf van berisping;

      d. bevestiging van de bestreden schuldigverklaring, zonodig met verbetering of aanvulling, met tenietdoening van
      de straf;

      e. vrijspraak;

      f. bevestiging van de bestreden schuldigverklaring, zonodig met verbetering of aanvulling, met verklaring
      dat ten onrechte geen straf is opgelegd of dat de opgelegde straf ontoereikend is en verwijzing naar het in
      [artikel 81, eerste lid][ref1], bedoelde gerecht.

      3 Indien een beklag is gedaan als bedoeld in [artikel 80a, derde lid][ref2], verklaart de beklagmeerdere dit beklag
      bij gemotiveerde schriftelijke beslissing geheel of gedeeltelijk gegrond of ongegrond. Indien een beklag geheel
      of gedeeltelijk gegrond is verklaard, bepaalt de beklagmeerdere, volgens bij of krachtens algemene maatregel van
      Rijksbestuur te stellen regelen, op welke wijze het door de gestrafte geleden nadeel zal worden hersteld.

      4 De beslissing in eerste aanleg wordt vernietigd:

      a. indien enige in [Titel I van dit hoofdstuk][ref3] voorgeschreven termijn is geschonden;

      b. indien enige andere vorm dan onder a bedoeld, is verzuimd en redelijkerwijs kan worden aangenomen dat de
      gestrafte daardoor in zijn verdediging is geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel80a
      [ref3]: https://wetten.overheid.nl/BWBR0004788#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80p
    references:
