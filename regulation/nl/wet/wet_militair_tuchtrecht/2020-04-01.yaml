  - number: '80'
    text: |-
      1 Indien de commandant gedurende het tuchtproces meent dat een in de beschuldiging omschreven gedraging niet
      de schending van een dienstvoorschrift oplevert, omdat dit dienstvoorschrift naar zijn oordeel in strijd is met
      een hogere regeling, schorst hij het tuchtproces, voorzover het deze gedraging betreft. De termijn bedoeld in
      [artikel 54, eerste lid, onder b][ref1], wordt in dat geval met de duur van de schorsing verlengd.

      2 Hij roept over de vermeende strijdigheid schriftelijk de beslissing in van het in [artikel 81, eerste lid][ref2],
      bedoelde gerecht onder overlegging van de op de zaak betrekking hebbende stukken.

      3 Indien het gerecht beslist dat het dienstvoorschrift niet in strijd is met een hogere regeling, deelt het deze
      beslissing mee aan de commandant. Deze hervat het tuchtproces met inachtneming van die beslissing.

      4 Indien het tuchtproces terzake van andere gedragingen inmiddels is voortgezet en geëindigd met een uitspraak,
      hervat de commandant, nadat hij de beslissing van het gerecht heeft ontvangen, het op grond van het eerste lid
      geschorste tuchtproces. De commandant neemt daarbij de door hem gegeven uitspraak in acht. [Artikel 75][ref3] is
      niet van toepassing met dien verstande dat een op te leggen straf gelijksoortig moet zijn aan de al opgelegde straf
      en het totaal het maximum niet te boven mag gaan.

      5 Indien de commandant reeds een beslissing heeft genomen als bedoeld in [artikel 74, derde lid][ref4], of de straf
      van berisping heeft opgelegd, kan alsnog een straf of een andere straf worden opgelegd.

      6 Indien het gerecht beslist dat het dienstvoorschrift waaromtrent zijn beslissing is gevraagd in strijd is met een
      hogere regeling, spreekt het de beschuldigde vrij met betrekking tot de in het eerste lid bedoelde gedraging.

      7 Tegen de beslissing van het gerecht staat geen verdere voorziening open.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0004788#Artikel75
      [ref4]: https://wetten.overheid.nl/BWBR0004788#Artikel74
