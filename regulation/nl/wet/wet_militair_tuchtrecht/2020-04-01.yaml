  - number: 80q
    text: |-
      1 De beslissing wordt vastgelegd in een schriftelijk stuk, de uitspraak op beklag. [Artikel 77][ref1] is van
      toepassing.

      2 De uitspraak op beklag wordt door de beklagmeerdere onverwijld aan de commandant toegezonden. Door of namens
      de commandant wordt onverwijld een afschrift van de uitspraak op beklag uitgereikt aan de gestrafte. De datum van
      uitreiking wordt aangetekend op de uitspraak en op het uitgereikte afschrift.

      3 Indien de uitspraak op beklag een verwijzing inhoudt wordt daarvan bij de uitreiking aan de gestrafte mededeling
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel77
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80q
