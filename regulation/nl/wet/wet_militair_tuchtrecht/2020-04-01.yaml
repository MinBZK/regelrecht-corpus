  - number: '106'
    text: De Wet op de Krijgstucht wordt ingetrokken, behoudens het bepaalde in de volgende artikelen.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel106
  - number: '107'
    text: |-
      1 De op het tijdstip van inwerkingtreden van deze Rijkswet bij de ingevolge de artikelen 39-43 van de Wet op de
      Krijgstucht tot straffen bevoegde autoriteiten, of bij de ingevolge artikel 61 van die wet tot behandeling van een
      beklag bevoegde meerdere, aanhangige zaken betreffende krijgstuchtelijke vergrijpen als bedoeld in artikel 2 van
      die wet, worden behandeld en afgedaan op de wijze, als bepaald in die wet, door die autoriteit onderscheidenlijk
      meerdere. Andere straffen dan die voorzien bij deze wet kunnen niet worden opgelegd.

      2 Indien op het tijdstip van inwerkingtreden van deze Rijkswet de termijn van beklag als bedoeld in artikel 62 van
      de Wet op de Krijgstucht, dan wel van de mogelijkheid om ingevolge artikel 67 van die wet de eindbeslissing van het
      Hoog Militair Gerechtshof in te roepen, nog niet is verstreken, dient dit beklag onderscheidenlijk deze inroeping
      te worden gedaan in de vorm van een beroep, in te stellen naar de regels, gesteld in [hoofdstuk V, titel II][ref1],
      van deze Rijkswet, en met toepassing van die regels te worden behandeld en afgedaan.

      3 Zaken betreffende de inroeping van een eindbeslissing ingevolge artikel 67 van de Wet op de Krijgstucht, die op
      het tijdstip van inwerkingtreden van deze Rijkswet bij het Hoog Militair Gerechtshof aanhangig zijn, worden in de
      stand waarin zij zich bevinden overgedragen aan het gerecht dat uit hoofde van [artikel 81 van deze Rijkswet][ref2]
      bevoegd is het beroep inzake tuchtrechtelijke uitspraken te behandelen, en door dat gerecht behandeld en afgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel81
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0004788
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
  - number: '108'
    text: |-
      1 Tegen beslissingen van het Hoog Militair Gerechtshof, genomen ingevolge artikel 67 van de Wet op de Krijgstucht,
      die op het tijdstip van inwerkingtreden van deze Rijkswet nog niet onherroepelijk zijn geworden en waartegen nog
      geen beroep in cassatie is ingesteld, kan binnen 14 dagen na de uitspraak zulk beroep worden ingesteld op de wijze
      als voorgeschreven voor het instellen van cassatie tegen arresten van het gerechtshof Arnhem-Leeuwarden.

      2 Indien de Hoge Raad een beslissing van het Hoog Militair Gerechtshof, genomen ingevolge artikel 67 van de Wet op
      de Krijgstucht, na het tijdstip van inwerkingtreden van deze Rijkswet in cassatie vernietigt, wordt de zaak, indien
      zij niet door de Hoge Raad zelf wordt afgedaan, verwezen naar het gerecht dat uit hoofde van [artikel 81][ref1] van
      deze Rijkswet bevoegd is.

      3 In de zaken, waarin toepassing is gegeven aan [artikel 107, derde lid][ref2], van deze Rijkswet, voorzover deze
      een strafbaar feit betreffen, blijven de bepalingen van de Rijkswet van 22 februari 1979 (*Stb.* 69) tot invoering
      van de rechtsmiddelen van cassatie, cassatie in het belang der wet en herziening in het militair strafprocesrecht
      op de beslissing van het gerecht van kracht. Het voorgaande lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel107
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004788
        artikel: '107'
        hoofdstuk: VIII
  - number: '109'
    text: |-
      De krijgstuchtelijke straffen, op grond van de Wet op de Krijgstucht opgelegd voor het tijdstip van inwerkingtreden
      van deze Rijkswet, of met toepassing van [artikel 107, eerste lid, van deze Rijkswet][ref1] opgelegd, worden ten
      uitvoer gelegd op de wijze als bij of krachtens die wet bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel107
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel109
