$id: wet_militair_tuchtrecht
regulatory_layer: WET
publication_date: '2013-01-24'
valid_from: '2020-04-01'
bwb_id: BWBR0004788
url: https://wetten.overheid.nl/BWBR0004788/2020-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de gedragsregels van het militair tuchtrecht vast te
    stellen bij de wet, alsmede nieuwe voorschriften te geven inzake de tuchtstraffen en de behandeling van tuchtzaken;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De zowel in deze rijkswet als in het [Wetboek van Militair Strafrecht][ref1] voorkomende uitdrukkingen hebben in
      beide dezelfde betekenis. [Artikel 61 van het Wetboek van Militair Strafrecht][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001869
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel61
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001869
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '61'
  - number: '2'
    text: |-
      De straffen, in deze rijkswet voorzien, zijn van toepassing op de militair die een gedragsregel van deze rijkswet
      schendt.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel2
  - number: '3'
    text: |-
      1 De gedragsregels van deze rijkswet zijn van toepassing:

      a. gedurende de tijd waarin de militair dienst doet of behoort te doen;

      b. op een militaire plaats;

      c. anders dan in de gevallen, genoemd onder a en b, indien en voorzover de rijkswet de toepassing voorschrijft.

      2 Onder de tijd waarin de militair dienst doet of behoort te doen, wordt in deze rijkswet mede verstaan de tijd
      waarin de militair in uniform gekleed gaat.

      3 Onder militaire plaats wordt in deze rijkswet verstaan een gebouw, terrein, vaartuig, luchtvaartuig of voertuig,
      dat in gebruik is bij of ten behoeve van de krijgsmacht, of dat de militair tot verblijf of gebruik dient bij de
      vervulling van zijn taak in internationaal verband of waar de militair zich in krijgsgevangenschap bevindt.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel3
  - number: '4'
    text: |-
      1 In deze rijkswet wordt onder commandant verstaan de militair die ingevolge [artikel 49][ref1] tot straffen
      bevoegd is.

      2 In deze rijkswet wordt onder beklagmeerdere verstaan de onmiddellijk boven de commandant gestelde bevelvoerende
      meerdere. Onze Minister van Defensie kan bij ministeriële regeling andere militairen aanwijzen als beklagmeerderen.
      In dat geval treedt de onmiddellijk boven de commandant gestelde bevelvoerende meerdere niet meer op als
      beklagmeerdere.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel49
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '49'
        hoofdstuk: IV
  - number: '5'
    text: |-
      In deze rijkswet wordt onder beschuldigde verstaan de militair aan wie een beschuldiging is uitgereikt op grond
      van het op feiten of omstandigheden gebaseerde vermoeden dat hij een in deze rijkswet omschreven gedragsregel heeft
      geschonden.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel5
  - number: 5a
    text: |-
      Indien een Nederlandse militair behoort tot een internationaal militair samenwerkingsverband wordt ten aanzien van
      die Nederlandse militair voor de toepassing van [Hoofdstuk II van deze rijkswet][ref1] mede verstaan onder:

      a. andere militair: de vreemde militair die behoort tot dat internationaal militair samenwerkingsverband;

      b. krijgsmacht: dat internationaal militair samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0004788
        hoofdstuk: II
  - number: '6'
    text: |-
      1 In strijd met de militaire tucht gedraagt zich de militair die enig gegeven, de dienst betreffende, mededeelt aan
      of ter beschikking stelt van iemand die tot kennisneming daarvan niet bevoegd is, voor zover de verplichting tot
      geheimhouding uit de aard der zaak volgt.

      2 Het eerste lid is mede van toepassing op de militair die geen dienst doet of behoort te doen, en zich niet
      bevindt op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel6
  - number: '7'
    text: In strijd met de militaire tucht gedraagt zich de militair die ongeoorloofd afwezig is.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel7
  - number: '8'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair aan wiens schuld het is te wijten dat hij niet in staat
      is dienstverplichtingen te vervullen.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel8
  - number: '9'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die zich onttrekt aan dienstverplichtingen, deze
      verplichtingen zonder toestemming niet vervult of ophoudt te vervullen.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel9
  - number: '10'
    text: In strijd met de militaire tucht gedraagt zich hij die zijn taak als militair onzorgvuldig verricht.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel10
  - number: '11'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die een andere militair of iemand, die anderszins bij
      of ten behoeve van de krijgsmacht werkzaam is, geen hulp verleent, indien en voor zover deze nodig is en kan worden
      gevergd.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel11
  - number: '12'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die zich door lijdelijkheid of onwilligheid tegen
      militaire diensten verzet.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel12
  - number: '13'
    text: |-
      1 In strijd met de militaire tucht gedraagt zich de militair die de uitvoering van een in het belang van de
      militaire dienst genomen maatregel belet, belemmert of verijdelt.

      2 Het eerste lid is mede van toepassing op de militair die geen dienst doet of behoort te doen, en zich niet
      bevindt op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel13
  - number: '14'
    text: |-
      1 In strijd met de militaire tucht gedraagt zich de militair die een andere militair of iemand, die anderszins bij
      of ten behoeve van de krijgsmacht werkzaam is, zonder noodzaak hindert bij de uitoefening van zijn taak.

      2 Het eerste lid is mede van toepassing op de militair die geen dienst doet of behoort te doen, en zich niet
      bevindt op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel14
  - number: '15'
    text: In strijd met de militaire tucht gedraagt zich de militair die een dienstbevel niet opvolgt.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel15
  - number: '16'
    text: |-
      Het voorgaande artikel is niet toepasselijk indien de bevolen gedraging onrechtmatig is of door de militair te
      goeder trouw als onrechtmatig werd beschouwd.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel16
  - number: '17'
    text: |-
      Indien twee of meer onderling strijdige dienstbevelen zijn gegeven, is het niet opvolgen van een bevel dat
      voorafgaat aan het laatst gehandhaafde geen met de militaire tucht strijdige gedraging.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel17
  - number: '18'
    text: |-
      1 In strijd met de militaire tucht gedraagt zich de militair die een dienstvoorschrift niet opvolgt.

      2 Het eerste lid is mede van toepassing op de militair die geen dienst doet of behoort te doen, en zich niet
      bevindt op een militaire plaats, indien het in het dienstvoorschrift gegeven ge- of verbod betrekking heeft op het
      gedrag van de militair die zich voor de uitoefening van zijn dienst buiten Nederland bevindt.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel18
  - number: '19'
    text: |-
      Het voorgaande artikel is niet toepasselijk indien een van het dienstvoorschrift afwijkend dienstbevel is
      opgevolgd.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel19
  - number: '20'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die een andere militair of iemand, die anderszins bij
      of ten behoeve van de krijgsmacht werkzaam is, in het openbaar of in zijn tegenwoordigheid met enig kwaad bedreigt,
      uitscheldt of bespot.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel20
  - number: '21'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die tegen beter weten in een aantijging tegen of
      een klacht over een andere militair of iemand, die anderszins bij of ten behoeve van de krijgsmacht werkzaam is
      inbrengt of inzendt.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel21
  - number: '22'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die de persoon van een andere militair of iemand, die
      anderszins bij of ten behoeve van de krijgsmacht werkzaam is, aantast.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel22
  - number: '23'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die een andere militair of iemand, die anderszins bij of
      ten behoeve van de krijgsmacht werkzaam is, nodeloos in gevaar brengt.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel23
  - number: '24'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die een mededeling, die hij uit hoofde van zijn ambt
      moet doen, niet of onjuist doet.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel24
  - number: '25'
    text: |-
      1 In strijd met de militaire tucht gedraagt zich de militair die door misbruik van zijn invloed als meerdere
      tegenover een mindere deze overhaalt iets te doen, niet te doen of te dulden, indien daaruit enig nadeel voor de
      dienst, de mindere of een derde kan ontstaan.

      2 Het eerste lid is mede van toepassing op de militair die geen dienst doet of behoort te doen, en zich niet
      bevindt op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel25
  - number: '26'
    text: |-
      1 In strijd met de militaire tucht gedraagt zich de militair die door gift, belofte, bedreiging of misleiding een
      andere militair:

      a. weerhoudt van het ter kennis van de commandant brengen van een inbreuk op een gedragsregel, omschreven in deze
      rijkswet;

      b. overhaalt tot het valselijk ter kennis van de commandant brengen van een inbreuk op een gedragsregel, omschreven
      in deze rijkswet;

      c. overhaalt tot of weerhoudt van het instellen van beroep, het doen van een beklag of het indienen van een
      verzoek.

      2 Het eerste lid is mede van toepassing op de militair die geen dienst doet of behoort te doen, en zich niet
      bevindt op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel26
  - number: '27'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die, wetende dat een mindere inbreuk maakt of heeft
      gemaakt op een gedragsregel van deze rijkswet, nalaat maatregelen te nemen.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel27
  - number: '28'
    text: In strijd met de militaire tucht gedraagt zich de militair die een onrechtmatig bevel geeft aan een mindere.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel28
  - number: '29'
    text: In strijd met de militaire tucht gedraagt zich de militair die wanordelijkheden veroorzaakt of daaraan deelneemt.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel29
  - number: '30'
    text: |-
      1 In strijd met de militaire tucht gedraagt zich de militair die een andere militair mondeling of bij geschrifte
      opruit tot een inbreuk op enige in deze rijkswet omschreven gedragsregel, alsmede de militair die een dergelijk
      geschrift verspreidt.

      2 Het eerste lid is mede van toepassing op de militair die geen dienst doet of behoort te doen, en zich niet
      bevindt op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel30
  - number: '31'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die een geschrift verspreidt of op enige andere wijze
      openbaar maakt op een plaats, een tijdstip of een wijze, waaromtrent bij dienstvoorschrift een verbod is gegeven in
      het belang van het verkeer of ter voorkoming van belemmering van de dienst of ter bescherming van rijksgoederen of
      goederen van derden.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel31
  - number: '32'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die inbreuk maakt op de regels die bij dienstvoorschrift
      zijn vastgelegd inzake meningsuiting die anders dan door middel van geschrift plaatsvindt, voorzover die regels
      niet de inhoud van de uiting betreffen, en zijn gegeven in het belang van het verkeer of ter bestrijding of
      voorkoming van ongeregeldheden en verstoringen van het ordelijk verloop van de dienst.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel32
  - number: '33'
    text: |-
      1 In strijd met de militaire tucht gedraagt zich de militair die een betoging organiseert of daaraan deelneemt,
      indien deze op een militaire plaats gehouden wordt zonder dat toestemming is gevraagd van het bevoegd gezag, dan
      wel indien de toestemming is geweigerd in het belang van het verkeer, of omdat redelijkerwijs is te verwachten dat
      ongeregeldheden zullen plaatsvinden of het ordelijk verloop van de dienst zal worden verstoord.

      2 In strijd met de militaire tucht gedraagt zich de militair die buiten een militaire plaats in uniform deelneemt
      aan een betoging, tenzij deze in het land waar de militair is aangesteld dan wel waar hij als dienstplichtige in
      werkelijke dienst is gekomen plaatsvindt en uitsluitend tot onderwerp heeft de voor de militairen algemeen geldende
      arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel33
  - number: '34'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die een vergadering organiseert of daaraan deelneemt,
      indien die op een militaire plaats wordt gehouden zonder dat toestemming is gevraagd van het bevoegd gezag, dan
      wel indien de toestemming is geweigerd in het belang van het verkeer, of omdat redelijkerwijs is te verwachten dat
      ongeregeldheden zullen plaatsvinden of het ordelijk verloop van de dienst zal worden verstoord.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel34
  - number: '35'
    text: |-
      1 In strijd met de militaire tucht gedraagt zich de militair die, zich voor de uitoefening van de dienst op
      het gebied van een vreemde mogendheid bevindend, enige, niet het Koninkrijk betreffende, politieke activiteit
      ontplooit. Onder politieke activiteit is niet begrepen het uitoefenen van het actief en passief kiesrecht.

      2 Het eerste lid is mede van toepassing op de militair die geen dienst doet of behoort te doen, en zich niet
      bevindt op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel35
  - number: '36'
    text: |-
      1 In strijd met de militaire tucht gedraagt zich de militair die zonder daartoe gerechtigd te zijn gebruik maakt
      van goederen of diensten van de krijgsmacht, van een andere militair of van iemand, die anderszins bij of ten
      behoeve van de krijgsmacht werkzaam is, dan wel deze goederen wegneemt.

      2 Voorzover het goederen of diensten van de krijgsmacht betreft is het eerste lid mede van toepassing op de
      militair die geen dienst doet of behoort te doen, en die zich niet bevindt op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel36
  - number: '37'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die enig goed, in gebruik bij of ten behoeve van de
      krijgsmacht, onzorgvuldig behandelt of onderhoudt.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel37
  - number: '38'
    text: In strijd met de militaire tucht gedraagt zich de militair die in uniform nodeloos slordig gekleed gaat.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel38
  - number: '39'
    text: |-
      1 In strijd met de militaire tucht gedraagt zich de militair die enig goed, in gebruik bij of ten behoeve van de
      krijgsmacht, van een andere militair of van iemand, die anderszins bij of ten behoeve van de krijgsmacht werkzaam
      is, vernielt, beschadigt, onbruikbaar of onklaar maakt dan wel wegmaakt.

      2 Voorzover het een goed in gebruik bij of ten behoeve van de krijgsmacht betreft is het eerste lid mede van
      toepassing op de militair die geen dienst doet of behoort te doen, en zich niet bevindt op een militaire plaats.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel39
  - number: '40'
    text: |-
      In strijd met de militaire tucht gedraagt zich de militair die de aan een andere militair of iemand, die anderszins
      bij of ten behoeve van de krijgsmacht werkzaam is, voor persoonlijk gebruik ter beschikking gestelde ruimte niet
      respecteert.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel40
  - number: '41'
    text: |-
      De straffen zijn:

      a. berisping;

      b. geldboete;

      c. strafdienst;

      d. uitgaansverbod.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel41
  - number: '42'
    text: |-
      1 De berisping bestaat uit een geschrift waarvan het model door Onze Minister van Defensie wordt vastgesteld.

      2 De tenuitvoerlegging van de berisping geschiedt door de uitreiking van het geschrift tegelijk met de uitreiking
      van het afschrift van de uitspraak.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel42
  - number: '43'
    text: |-
      1 Het bedrag van de geldboete is ten minste € 3 en ten hoogste € 350. In Aruba zijn deze bedragen AWG 6 en AWG 770.
      In Curaçao en Sint Maarten zijn deze bedragen ANG 6 en ANG 770. In de openbare lichamen Bonaire, Sint Eustatius en
      Saba zijn deze bedragen USD 3 en USD 430.

      2 Een geldboete kan niet worden opgelegd indien daardoor de som van de geldboetes, ingevolge deze rijkswet in een
      kalendermaand aan de militair opgelegd, een bedrag van € 700 dan wel ANG 1540, AWG 1540 onderscheidenlijk USD 860
      te boven zou gaan.

      3 Ingeval de schending van een gedragsregel plaatsvindt terwijl de militair deelneemt aan een operatie in
      internationaal verband buiten het Koninkrijk is, in afwijking van het eerste lid, het bedrag van de geldboete ten
      hoogste € 700 dan wel ANG 1540, AWG 1540 onderscheidenlijk USD 860. Een geldboete met toepassing van de voorgaande
      volzin kan niet worden opgelegd indien daardoor de som, bedoeld in het tweede lid, een bedrag van € 1400 dan wel
      ANG 3080, AWG 3080 onderscheidenlijk USD 1720 te boven zou gaan.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel43
  - number: '44'
    text: |-
      1 De geldboete moet binnen drie dagen na de uitreiking van het afschrift van de uitspraak door de gestrafte worden
      betaald.

      2 De commandant kan de gestrafte op zijn verzoek eenmaal uitstel van betaling verlenen voor ten hoogste
      achtentwintig dagen.

      3 De geldboete moet in ieder geval worden betaald als het feitelijk verblijf onder de wapenen van de gestrafte
      eindigt.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel44
  - number: '45'
    text: |-
      1 Bij gebreke van betaling binnen de bij of ingevolge het voorgaand artikel gestelde termijn worden de niet
      betaalde geldboetes op de militaire bezoldiging van de gestrafte ingehouden.

      2 De inhouding geschiedt door de functionaris belast met de uitbetaling van de militaire bezoldiging.

      3 Op het in te houden bedrag wordt een toeslag berekend van tien procent met een minimum van € 0,45, ANG 1, AWG
      1, onderscheidenlijk USD 1 welke op gelijke wijze als de geldboete op de aan een gestrafte toekomende bezoldiging
      wordt ingehouden.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel45
  - number: '46'
    text: |-
      Bij of krachtens algemene maatregel van Rijksbestuur worden regels gesteld met betrekking tot de invordering, de
      inhouding, de verantwoording en de bestemming van de ingevorderde of ingehouden gelden.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel46
  - number: '47'
    text: |-
      1 De strafdienst bestaat uit het verrichten van dienst door de gestrafte in overeenstemming met zijn rang, stand of
      functie, buiten de voor hem geldende diensturen.

      2 De strafdienst wordt opgelegd voor de duur van ten hoogste drie uren op ten hoogste tien werkdagen.

      3 Een militair ondergaat op dezelfde dag niet meer dan een straf van strafdienst.

      4 Een militair ondergaat per kalendermaand de straf van strafdienst niet gedurende meer dan vijftien werkdagen.

      5 Indien een militair op grond van het bepaalde in het vorige lid in een kalendermaand een hem opgelegde straf van
      strafdienst niet volledig ondergaat, zal hij het resterende deel in de volgende kalendermaand ondergaan.

      6 De tenuitvoerlegging van de strafdienst vangt zo spoedig mogelijk aan na de uitreiking van het afschrift van de
      uitspraak en vindt voor zover mogelijk plaats op achtereenvolgende werkdagen. Strafdienst wordt niet ten uitvoer
      gelegd tijdens verlofdagen.

      7 Het ondergaan van de straf van strafdienst is dienst.

      8 In geval van ontslag uit de militaire dienst eindigt de tenuitvoerlegging van de strafdienst van rechtswege op
      het moment waarop dat ontslag ingaat.

      9 Onverminderd het bepaalde in het vorige lid kan de beklagmeerdere het feitelijk verblijf onder de wapenen van
      degene die de straf van strafdienst ondergaat, verlengen totdat die straf is ondergaan.

      10 Op de dag waarop de straf van uitgaansverbod wordt ondergaan, kan niet ook de straf van strafdienst worden
      ondergaan.

      11 Onttrekking aan strafdienst schorst van rechtswege de straf.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel47
  - number: '48'
    text: |-
      1 Het uitgaansverbod bestaat uit de verplichting om op de door de commandant aan te wijzen militaire plaats of
      gedeelten daarvan aanwezig te zijn en te blijven.

      2 Aan de militair die gestraft is met de straf van uitgaansverbod, kan worden opgedragen gedurende de tijd, dat hij
      die straf ondergaat, dienst te verrichten in overeenstemming met zijn rang, stand of functie.

      3 Het uitgaansverbod wordt opgelegd voor de duur van ten hoogste vier aaneengesloten dagen.

      4 Een militair ondergaat per kalendermaand de straf van uitgaansverbod niet gedurende meer dan acht dagen, en
      voor zover de tenuitvoerlegging geheel of ten dele in het weekend plaatsvindt, gedurende niet meer dan twee
      opeenvolgende weekenden.

      5 Het [derde, vijfde, zevende, achtste, negende, tiende en elfde lid van artikel 47][ref1] zijn van overeenkomstige
      toepassing. Het [zesde lid van artikel 47][ref2] is van overeenkomstige toepassing met dien verstande dat de
      tenuitvoerlegging ook plaatsvindt op vrije dagen niet zijnde verlofdagen.

      6 Ingeval schending van de gedragsregel van [artikel 7][ref3] wordt afgedaan met toepassing van
      [artikel 79, eerste lid][ref4], of indien er nog geen 90 dagen zijn verlopen nadat aan de militair een uitspraak
      is uitgereikt waarin hij schuldig werd verklaard aan schending van diezelfde gedragsregel is, indien de straf van
      uitgaansverbod wordt opgelegd, in afwijking van het derde en vierde lid, het aantal op te leggen dagen ten hoogste
      acht en het aantal in een kalendermaand te ondergane dagen uitgaansverbod ten hoogste twaalf.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel47
