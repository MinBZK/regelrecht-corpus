  - number: '49'
    text: |-
      1 De bevoegdheid tot het opleggen van straffen aan onder zijn bevelen staande militairen komt toe aan:

      a. de bevelvoerende militair van een oorlogsschip, inrichting van de zeemacht, compagnie, eskadron, batterij of
      squadron;

      b. de door Onze Minister van Defensie aangewezen bevelvoerende militair van een andere militaire eenheid dan onder
      a genoemd.

      2 Aan boord van een oorlogsschip komt de bevoegdheid tot het opleggen van straffen aan militairen, die op dat schip
      zijn ingescheept, uitsluitend toe aan de bevelvoerende militair van dat schip.

      3 Indien een bevelvoerende militair als bedoeld in het eerste lid, onder a of b, zelf degene is van wie wordt
      vermoed dat hij een in deze rijkswet omschreven gedragsregel heeft geschonden, komt de bevoegdheid tot het opleggen
      van straffen toe aan de onmiddellijk boven hem gestelde bevelvoerende meerdere.

      4 De bevoegdheid tot het opleggen van straffen komt toe aan de onmiddellijk boven een in het eerste lid bedoelde
      bevelvoerende militair gestelde bevelvoerende meerdere indien het betreft een in een van de [artikelen 20-23][ref1]
      omschreven gedraging tegen de persoon van de in het eerste lid bedoelde bevelvoerende militair.

      5 Indien een militair van wie wordt vermoed dat hij een in deze rijkswet omschreven gedragsregel heeft geschonden
      hoger of ouder in rang is dan de in het eerste lid bedoelde bevelvoerende militair komt de bevoegdheid tot het
      opleggen van straffen toe aan de onmiddellijk boven laatstbedoelde militair gestelde bevelvoerende meerdere van
      hogere rang dan eerstbedoelde militair.

      6 Indien in de gevallen bedoeld in het derde, vierde of vijfde lid de aldaar aangewezen bevelvoerende militair geen
      tuchtproces kan doen aanvangen binnen de in [artikel 53, eerste lid][ref2], genoemde termijn, wordt:

      a. het tuchtproces gehouden door de in het eerste lid bedoelde bevelvoerende militair zelf in het geval bedoeld in
      het vierde lid;

      b. deze termijn verlengd met 21 dagen in de gevallen bedoeld in het derde of vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel53
