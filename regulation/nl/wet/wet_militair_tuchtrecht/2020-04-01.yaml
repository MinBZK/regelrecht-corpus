        artikel: '77'
        hoofdstuk: V
        paragraaf: '6'
  - number: 80r
    text: |-
      1 De beklagprocedure eindigt met een beslissing als bedoeld in de [artikelen 80d, eerste lid][ref1], of
      [80p, tweede of derde lid][ref2].

      2 De beklagprocedure eindigt van rechtswege en de beslissing waartegen beklag is gedaan, is van rechtswege
      vernietigd:

      a. indien er binnen de ingevolge [artikel 80g][ref3] voorgeschreven termijn geen onderzoek op beklag is
      aangevangen;

      b. indien er 30 dagen zijn verlopen nadat het onderzoek op beklag is aangevangen en er geen beslissing als bedoeld
      in [artikel 80p, tweede of derde lid][ref4], is genomen.

      Het feit dat de beklagprocedure van rechtswege is geëindigd, wordt vastgelegd in een schriftelijk stuk dat aan de
      gestrafte wordt uitgereikt.

      3 [Artikel 50, tweede lid][ref5], is van overeenkomstige toepassing met dien verstande dat de beklagmeerdere is
      belast met de uitvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80d
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel80p
