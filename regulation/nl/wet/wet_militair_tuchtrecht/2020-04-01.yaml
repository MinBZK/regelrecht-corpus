  - number: '56'
    text: |-
      1 De beschuldigde kan zich in ieder stadium van het tuchtproces in eerste aanleg doen bijstaan door een
      vertrouwensman.

      2 Het bepaalde in het voorgaande lid wordt de beschuldigde bij het uitreiken van de beschuldiging medegedeeld.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel56
  - number: '57'
    text: |-
      1 De vertrouwensman kan door de beschuldigde worden gekozen uit het militair en burgerpersoneel, in
      dienstbetrekking bij het departement van defensie en gelegerd of tewerkgesteld op hetzelfde schip, in dezelfde
      inrichting of kazerne, dan wel op dezelfde basis of bij hetzelfde onderdeel als de beschuldigde.

      2 In bijzondere gevallen kan de commandant ook andere personen als vertrouwensman toelaten.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel57
  - number: '58'
    text: Medebeschuldigden in dezelfde zaak worden niet als vertrouwensman toegelaten.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel58
  - number: '59'
    text: |-
      1 De commandant kan de vertrouwensman voor de verdere duur van het tuchtproces in eerste aanleg uitsluiten wegens
      verstoring van de ordelijke behandeling van de zaak.

      2 Ingeval van uitsluiting van zijn vertrouwensman wordt de beschuldigde op zijn verzoek in de gelegenheid gesteld
      binnen 24 uur een nieuwe vertrouwensman te kiezen. De termijn bedoeld in [artikel 54, eerste lid, onder b][ref1],
      wordt in dat geval met een dag verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel54
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '54'
        hoofdstuk: V
        paragraaf: '1'
  - number: '60'
    text: Het optreden als vertrouwensman is dienst.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel60
  - number: '61'
    text: |-
      1 De commandant kan de beschuldigde doen horen ter voorbereiding van het onderzoek. [Artikel 67][ref1] is van
      overeenkomstige toepassing.

      2 De commandant kan getuigen en deskundigen horen of doen horen in ieder stadium van het tuchtproces.

      3 De verklaringen van de op grond van het eerste of tweede lid gehoorde personen worden schriftelijk vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel67
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '67'
        hoofdstuk: V
        paragraaf: '4'
  - number: '62'
    text: |-
      De beschuldigde en zijn vertrouwensman kunnen na de uitreiking van de beschuldiging de op de zaak betrekking
      hebbende stukken inzien, tenzij het belang van geheimhouding van gegevens of het belang van derden zich daartegen
      verzet.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel62
  - number: '63'
    text: |-
      1 De commandant roept de beschuldigde schriftelijk op voor het onderzoek.

      2 Het onderzoek vangt niet eerder aan dan 24 uur na de uitreiking van de beschuldiging.

      3 Indien de beschuldigde om een eerdere behandeling verzoekt, kan de commandant daartoe besluiten.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel63
  - number: '64'
    text: |-
      1 De beschuldigde is verplicht te verschijnen.

      2 Indien de beschuldigde niet verschijnt wegens een gewichtige reden van verhindering, schort de commandant het
      onderzoek op of schorst hij dit. De termijn bedoeld in [artikel 54, eerste lid, onder b][ref1], wordt in dat geval
      voor de duur van de opschorting of schorsing, doch ten hoogste 21 dagen verlengd.

      3 Indien de beschuldigde niet verschijnt zonder een gewichtige reden van verhindering, schort de commandant het
      onderzoek op of schorst hij dit voor bepaalde tijd en wordt de beschuldigde nogmaals schriftelijk opgeroepen.
      Hij is bevoegd de medebrenging van de beschuldigde te gelasten. De tweede volzin van het voorgaande lid is van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel54
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '54'
        hoofdstuk: V
        paragraaf: '1'
  - number: '65'
    text: |-
      1 De commandant roept de getuigen en deskundigen op wier verschijning hij nodig oordeelt.

      2 De beschuldigde en zijn vertrouwensman kunnen verzoeken dat ook andere getuigen en deskundigen worden gehoord.
      De commandant voldoet aan dit verzoek, tenzij het onderzoek daardoor wordt geschaad of het verzoek kennelijk
      onredelijk is.

      3 De opgeroepen getuigen en deskundigen zijn verplicht te verschijnen.

      4 Ten aanzien van getuigen en deskundigen zijn de [artikelen 217-219 van het Wetboek van Strafvordering][ref1] van
      overeenkomstige toepassing.

      5 De vergoeding van door getuigen en deskundigen gemaakte onkosten geschiedt volgens regelen te stellen bij
      algemene maatregel van Rijksbestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '66'
    text: |-
      1 De commandant houdt het onderzoek op de grondslag van de beschuldiging.

      2 Het onderzoek is niet openbaar.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel66
  - number: '67'
    text: |-
      De beschuldigde is niet verplicht te antwoorden. Dit wordt hem voor of bij de aanvang van het onderzoek ter kennis
      gebracht.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel67
  - number: '68'
    text: |-
      1 De commandant hoort de beschuldigde, de getuigen en de deskundigen.

      2 Hij stelt de beschuldigde en de vertrouwensman in de gelegenheid de getuigen en deskundigen, door zijn
      tussenkomst, vragen te stellen.

      3 Hij stelt de vertrouwensman in de gelegenheid het woord te voeren.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel68
  - number: '69'
    text: De beschuldigde wordt voor de sluiting van het onderzoek in de gelegenheid gesteld het laatste woord te voeren.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel69
  - number: '70'
    text: |-
      Als bewijsmiddelen worden alleen erkend:

      a. eigen waarneming door de commandant van een in de beschuldiging omschreven gedraging;

      b. eigen waarneming door de commandant tijdens het onderzoek;

      c. verklaringen van de beschuldigde;

      d. verklaringen van een getuige;

      e. verklaringen van een deskundige;

      f. geschriften.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel70
  - number: '71'
    text: |-
      Op zichzelf leveren voldoende grondslag voor de overtuiging dat de in de beschuldiging omschreven gedraging heeft
      plaatsgevonden:

      a. de eigen waarneming genoemd in het voorgaande artikel onder *a*;

      b. de in een getuigenverklaring of in een geschrift opgenomen waarneming van een in de beschuldiging omschreven
      gedraging, door een militair of andere ambtenaar, die uit hoofde van zijn functie of rang met enig toezicht op de
      naleving van gedragsregels is belast.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel71
  - number: '72'
    text: Feiten of omstandigheden van algemene bekendheid behoeven geen bewijs.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel72
  - number: '73'
    text: |-
      Na sluiting van het onderzoek beraadt de commandant zich of hij door de inhoud van de in [artikel 70][ref1]
      genoemde bewijsmiddelen de overtuiging heeft gekregen dat een in de beschuldiging omschreven gedraging van de
      beschuldigde heeft plaatsgevonden en, in bevestigend geval, of zulks de schending van een gedragsregel oplevert.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel70
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '70'
        hoofdstuk: V
        paragraaf: '5'
  - number: '74'
    text: |-
      1 Is de commandant van oordeel dat een gedragsregel is geschonden, dan beraadt hij zich over de oplegging van
      straf.

      2 Acht de commandant de beschuldigde strafbaar, dan legt hij een straf voorzien in deze rijkswet op.

      3 Indien de commandant dit in verband met de geringe betekenis van de gedraging of gelet op de persoon van de
      beschuldigde of zijn persoonlijke omstandigheden raadzaam acht, legt hij geen straf op.

      4 In andere gevallen dan bedoeld in het tweede en derde lid spreekt de commandant de beschuldigde vrij.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel74
  - number: '75'
    text: |-
      Bij bestraffing van een militair die een of meer in deze rijkswet genoemde gedragsregels heeft geschonden, wordt
      slechts een straf opgelegd.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel75
  - number: '76'
    text: |-
      1 Na het sluiten van het onderzoek beslist de commandant uiterlijk op de eerstvolgende werkdag. Deze beslissing
      wordt vastgelegd in een schriftelijk stuk, de uitspraak.

      2 De uitspraak wordt door of namens de commandant onverwijld aan de beschuldigde uitgereikt.

      3 De datum van uitreiking wordt op de uitspraak en op het afschrift bedoeld in het tweede lid aangetekend.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel76
  - number: '77'
    text: |-
      De uitspraak vermeldt in ieder geval:

      a. de naam, rang en militaire eenheid van de beschuldigde;

      b. de bewezen gedraging of gedragingen;

      c. de geschonden gedragsregel of gedragsregels;

      d. de beslissing.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel77
  - number: '78'
    text: |-
      1 Is de commandant van oordeel dat een hem ter kennis gekomen gedraging een strafbaar feit betreft, dan is hij
      verplicht daarvan onverwijld aangifte te doen bij een opsporingsambtenaar, behoudens in het geval dat voldaan wordt
      aan de voorwaarden gesteld op grond van het bepaalde in [artikel 59 van het Wetboek van Militair Strafrecht][ref1].

      2 Indien de commandant na de uitreiking van de beschuldiging tot het oordeel komt dat de gedraging een strafbaar
      feit betreft, trekt hij de beschuldiging in, indien hij nog niet tot een uitspraak is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel59
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '59'
  - number: '79'
    text: |-
      1 Indien een gedraging naar het oordeel van de commandant een van de strafbare feiten oplevert
      omschreven in de [artikelen 267, aanhef en onder 1° en 2°][ref1], [300, eerste lid][ref2], [310][ref3],
      [311, eerste lid, aanhef en onder 4° en 5°][ref4], [321][ref5] of [350 van het Wetboek van Strafrecht][ref6]
      of omschreven in de [artikelen 96, aanhef en onder 2° en 3°][ref7], [98, aanhef en onder 2°][ref8],
      [166][ref9] of [169 van het Wetboek van Militair Strafrecht][ref10] met dien verstande dat de duur van de in de
      [artikelen 96][ref11] en [98 van het Wetboek van Militair Strafrecht][ref12] genoemde ongeoorloofde afwezigheid
      ten hoogste acht dagen is en het openbaar ministerie bij het in [artikel 81, eerste lid][ref13], bedoelde
      gerecht de commandant mededeelt dat het voorshands instemt met tuchtrechtelijke afdoening, kan de commandant
      een beschuldiging uitreiken, voor zover de gedraging tevens de schending van een gedragsregel van deze rijkswet
      inhoudt. Van de mededeling van het openbaar ministerie wordt aantekening gedaan in het stuk, bedoeld in
      [artikel 76, eerste lid][ref14].

      2 De commandant zendt na het einde van het tuchtproces in eerste aanleg bericht omtrent de afloop daarvan aan het
      openbaar ministerie bij het in [artikel 81, eerste lid][ref15], bedoelde gerecht.

      3 De toepassing van het bepaalde in het eerste lid doet niet af aan het formele recht tot
      strafvordering van het openbaar ministerie. Indien het strafbare feit wordt afgedaan met toepassing
      van [artikel 74 van het Wetboek van Strafrecht][ref16] of indien een vervolging terzake leidt tot een
      schuldigverklaring door de rechter, wordt bij het stellen van voorwaarden onderscheidenlijk bij de oplegging van
      een straf rekening gehouden met de wegens de schending van een gedragsregel van deze rijkswet opgelegde straf.


