  - number: '54'
    text: |-
      1 Het tuchtproces in eerste aanleg eindigt:

      a. met een beslissing als bedoeld in de [artikelen 53, zevende lid][ref1], [76, eerste lid][ref2],
      [78, tweede lid][ref3], of [80, zesde lid][ref4];

      b. van rechtswege indien er na 21 dagen sedert de aanvang van het tuchtproces geen beslissing is genomen
      als bedoeld in [artikel 76, eerste lid][ref5], behoudens de verlenging van deze termijn ingevolge de
      [artikelen 59, tweede lid][ref6], [64, tweede of derde lid][ref7], of [80, eerste lid][ref8];

      c. van rechtswege bij ontslag uit de militaire dienst.

      2 Behoudens in het geval uitspraak is gedaan als bedoeld in [artikel 76, eerste lid][ref9], deelt de commandant aan
      de beschuldigde schriftelijk mee dat het tuchtproces is geëindigd.


