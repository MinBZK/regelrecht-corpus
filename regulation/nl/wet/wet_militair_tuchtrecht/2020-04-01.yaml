  - number: 80a
    text: |-
      1 De gestrafte kan binnen vijf dagen na de uitreiking van het afschrift van de uitspraak beklag doen bij de
      beklagmeerdere.

      2 Onder de gestrafte wordt mede verstaan degene ten wiens aanzien een beslissing is genomen als bedoeld in
      [artikel 74, derde lid][ref1].

      3 De gestrafte kan in beklag ook de beslissing van de commandant met betrekking tot de wijze van tenuitvoerlegging
      van een straf van strafdienst of van uitgaansverbod aan het oordeel van de beklagmeerdere onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel74
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '74'
        hoofdstuk: V
        paragraaf: '6'
  - number: 80b
    text: |-
      1 Het beklag wordt gedaan bij beklagschrift, dat bij de commandant wordt ingediend.

      2 De beklagprocedure vangt aan met de indiening van het beklagschrift bij de commandant.

      3 Als dag van indiening geldt de dag van ontvangst van het beklagschrift door of namens de commandant. De dag van
      ontvangst wordt terstond op het beklagschrift aangetekend.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80b
  - number: 80c
    text: |-
      1 De commandant zendt het beklagschrift onverwijld door naar de beklagmeerdere.

      2 Hij voegt daarbij alle op de zaak betrekking hebbende stukken met opgave van de bewijsmiddelen op grond waarvan
      hij tot de overtuiging is gekomen dat een in de beschuldiging omschreven gedraging heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80c
  - number: 80d
    text: |-
      1 Indien het beklagschrift na de beklagtermijn bedoeld in [artikel 80a, eerste lid][ref1], is ingediend, verklaart
      de beklagmeerdere het beklag niet ontvankelijk. Deze verklaring wordt vastgelegd in een schriftelijk stuk dat aan
      de gestrafte wordt uitgereikt. De datum van de uitreiking wordt op het schriftelijk stuk aangetekend.

      2 Ten aanzien van een na afloop van de beklagtermijn ingediend beklagschrift blijft niet-ontvankelijkverklaring
      achterwege indien redelijkerwijs niet kan worden geoordeeld dat de gestrafte in verzuim is geweest. Een beslissing
      ter zake is gemotiveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel80a
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80d
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: 80a
        hoofdstuk: V
        paragraaf: '1'
  - number: 80e
    text: |-
      1 De gestrafte kan zich in ieder stadium van de beklagprocedure doen bijstaan door een vertrouwensman.

      2 De [artikelen 57][ref1], [58][ref2], [59, met uitzondering van de laatste volzin van het tweede lid][ref3], en
      [60][ref4] zijn van overeenkomstige toepassing met dien verstande dat voor commandant wordt gelezen beklagmeerdere.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel58
