  - number: '51'
    text: |-
      1 Het tuchtproces in eerste aanleg vangt aan met de uitreiking door of namens de commandant aan de militair, van
      wie wordt vermoed dat hij een in deze rijkswet omschreven gedragsregel heeft geschonden, van een schriftelijk stuk,
      de beschuldiging, hetwelk een omschrijving inhoudt van deze schending.

      2 De commandant behoudt een afschrift van de beschuldiging.

      3 De datum van de uitreiking wordt aangetekend op het afschrift bedoeld in het voorgaande lid.

      4 Terzake van dezelfde gedraging kan slechts eenmaal een beschuldiging worden uitgereikt.

      5 Wijziging van de beschuldiging is voor de aanvang van het onderzoek mogelijk. In geen geval worden
      wijzigingen toegelaten die ten gevolge hebben dat de beschuldiging niet langer dezelfde gedraging in de zin van
      [artikel 52, onder b][ref1] zou inhouden. De wijziging wordt onverwijld, doch in ieder geval voor de aanvang van
      het onderzoek, aan de beschuldigde schriftelijk meegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel52
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '52'
        hoofdstuk: V
        paragraaf: '1'
  - number: '52'
    text: |-
      De beschuldiging vermeldt:

      a. de naam, rang en militaire eenheid van de betreffende militair;

      b. de omschrijving van een of meer gedragingen die vermoedelijk de schending van een of meer gedragsregels inhouden
      met vermelding van feiten en omstandigheden waarop dat vermoeden is gegrond en met opgave van tijd en plaats waarop
      die gedraging of gedragingen hebben plaatsgevonden;

      c. de mededeling dat de commandant heeft besloten terzake een onderzoek te houden;

      d. het artikel of de artikelen op grond waarvan de beschuldiging wordt uitgereikt.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel52
  - number: '53'
    text: |-
      1 Behoudens [artikel 49, zesde lid][ref1], wordt geen beschuldiging uitgereikt indien er 21 dagen zijn verlopen
      nadat de gedraging heeft plaatsgevonden of, voor zover het betreft een vermoedelijke schending van een van
      de gedragsregels omschreven in de [artikelen 6][ref2], [23][ref3], [26][ref4], [37][ref5] of [39][ref6],
      indien er 21 dagen zijn verlopen nadat de gedraging werd ontdekt of, indien toepassing is gegeven aan
      [artikel 78, eerste lid][ref7], of [79, eerste lid][ref8], indien er 21 dagen zijn verlopen nadat de beslissing van
      het openbaar ministerie ter kennis is gekomen van de commandant.

      2 Geen beschuldiging wordt uitgereikt aan degene die feitelijk niet meer onder de wapenen verblijft.

      3 De in het eerste lid bedoelde termijn bedraagt 60 dagen indien in de beschuldiging is aangegeven dat de gedraging
      heeft plaatsgevonden terwijl de militair deelneemt aan een operatie in internationaal verband buiten het Koninkrijk
      en de militair en de commandant zich om redenen van dienst niet in hetzelfde land bevinden op het tijdstip waarop
      de gedraging volgens de beschuldiging eindigde.

      4 Voor de bepaling van de duur van de termijn waarbinnen een beschuldiging kan worden uitgereikt als bedoeld in
      het eerste lid, worden de dagen waarop verlof is verleend aan de militair aan wie de commandant voornemens is een
      beschuldiging uit te reiken, of de dagen waarop deze militair door ziekte of ongeoorloofde afwezigheid niet bij
      zijn eenheid aanwezig is, niet meegeteld.

      5 Geen beschuldiging wordt uitgereikt indien uit feiten of omstandigheden blijkt of redelijkerwijze moet worden
      vermoed dat er 60 dagen zijn verlopen nadat de gedraging heeft plaatsgevonden.

      6 Ingeval toepassing is gegeven aan [artikel 78, eerste lid][ref9], of [79, eerste lid][ref10], wordt de in het
      vijfde lid genoemde termijn met 30 dagen verlengd.

      7 Een beschuldiging, uitgereikt in strijd met de voorgaande leden, wordt ingetrokken.


