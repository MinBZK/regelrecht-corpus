        paragraaf: '1'
  - number: '82'
    text: |-
      1 Het beroep wordt ingesteld bij beroepschrift, dat bij de commandant moet worden ingediend.

      2 De commandant zendt het beroepschrift onverwijld naar het gerecht. De commandant en de beklagmeerdere voegen
      daarbij alle op de zaak betrekking hebbende stukken met opgave van de bewijsmiddelen op grond waarvan zij tot de
      overtuiging zijn gekomen dat een in de beschuldiging omschreven gedraging heeft plaatsgevonden.

      3 Indien het beroep is ingesteld door de beklagmeerdere, doet de commandant daarvan mededeling aan degene op wie de
      uitspraak betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel82
  - number: '83'
    text: |-
      Als dag van indiening geldt de dag van ontvangst van het beroepschrift door of namens de commandant. De dag van
      ontvangst wordt terstond op het beroepschrift aangetekend.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel83
  - number: '84'
    text: |-
      Ten aanzien van een na afloop van de beroepstermijn ingediend beroepschrift blijft niet-ontvankelijkverklaring
      achterwege indien redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest. Een beslissing
      ter zake is gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel84
  - number: '85'
    text: |-
      Zodra het beroepschrift is ingediend, kan de voorzitter van de militaire kamer, bedoeld in [artikel 87][ref1],
      de tenuitvoerlegging van een straf van strafdienst of van uitgaansverbod opschorten of schorsen. Hiervan wordt
      aantekening gesteld op het beroepschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel87
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '87'
        hoofdstuk: V
        paragraaf: '2'
  - number: '86'
    text: |-
      De griffier van het gerecht stelt zo spoedig mogelijk afschriften van het beroepschrift en van de op de zaak
      betrekking hebbende stukken ter beschikking van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel86
  - number: '87'
    text: |-
      1 Het beroep wordt zo spoedig mogelijk behandeld door een meervoudige militaire kamer bij het in [artikel 81][ref1]
      bedoelde gerecht.

      2 De voorzitter van de militaire kamer bepaalt op welke dag het beroep wordt behandeld.

      3 [Artikel 17, elfde lid, van de Wet militaire strafrechtspraak][ref2] is van overeenkomstige toepassing, met dien
      verstande dat de uitvoering van de overdracht geschiedt door de griffier.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0004789#Artikel17
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0004788
        artikel: '81'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004789
        artikel: '17'
  - number: '88'
    text: |-
      1 De oproeping van de gestrafte geschiedt door de griffier.

      2 De termijn van oproeping is tenminste zes dagen. Op verzoek van de gestrafte kan deze termijn worden verkort.

      3 Indien de gestrafte niet verschijnt en het gerecht zijn aanwezigheid in persoon noodzakelijk acht, stelt het de
      behandeling voor bepaalde tijd uit en gelast de oproeping van de gestrafte.

      4 Indien de gestrafte wederom niet verschijnt, kan het gerecht het beroep vervallen verklaren.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel88
  - number: '89'
    text: |-
      1 Indien beroep is ingesteld door de beklagmeerdere worden deze en degene op wie de uitspraak betrekking heeft,
      door de griffier opgeroepen. De termijn van oproeping is tenminste zes dagen.

      2 Indien de beklagmeerdere niet verschijnt en het gerecht zijn aanwezigheid in persoon noodzakelijk acht, stelt het
      de behandeling voor bepaalde tijd uit en gelast zijn oproeping.

      3 Indien de beklagmeerdere wederom niet verschijnt, kan het gerecht het beroep vervallen verklaren.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel89
  - number: '90'
    text: |-
      1 De voorzitter bepaalt welke getuigen en deskundigen zullen worden opgeroepen. [Artikel 65, tweede lid][ref1], is
      van overeenkomstige toepassing met dien verstande dat het verzoek tenminste drie dagen voor de behandeling dient te
      zijn binnengekomen.

      2 De oproepingen geschieden door de griffier.

      3 Getuigen en deskundigen zijn verplicht te verschijnen.

      4 Voor getuigen is [artikel 290, vierde lid][ref2], en voor deskundigen is
      [artikel 51m, tweede lid, van het Wetboek van Strafvordering][ref3] van overeenkomstige toepassing.

      5 [Artikel 65, vierde en vijfde lid][ref4], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel290
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel51m
      [ref4]: https://wetten.overheid.nl/BWBR0004788#Artikel65
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel90
