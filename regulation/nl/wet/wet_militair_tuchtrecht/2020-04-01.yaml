  - number: '93'
    text: |-
      1 De behandeling van het beroep geschiedt ter openbare terechtzitting. De voorzitter heeft de leiding van de
      behandeling. Hij kan op verzoek van de gestrafte, de commandant of de beklagmeerdere, of om redenen aan de openbare
      orde ontleend gelasten dat de behandeling achter gesloten deuren plaatsvindt.

      2 De [artikelen 62][ref1], [67-69][ref2], [74][ref3] en [75][ref4] zijn van overeenkomstige toepassing, met dien
      verstande dat voor commandant gelezen wordt militaire kamer.

      3 Ten aanzien van de bewijsmiddelen is [artikel 80n][ref5] van toepassing. Als bewijsmiddel wordt tevens erkend de
      eigen waarneming door de militaire kamer tijdens het onderzoek.

      4 Na sluiting van het onderzoek beraadt de militaire kamer zich of zij door de inhoud van de in het derde lid
      genoemde bewijsmiddelen de overtuiging heeft gekregen dat een in de beschuldiging omschreven gedraging van de
      gestrafte heeft plaatsgevonden en, in bevestigend geval, of zulks de schending van een gedragsregel oplevert.


