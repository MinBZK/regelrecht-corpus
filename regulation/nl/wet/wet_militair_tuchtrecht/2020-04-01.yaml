  - number: '91'
    text: |-
      Het openbaar ministerie kan desgewenst bij de behandeling van het beroep zijn oordeel over de zaak kenbaar maken
      aan de militaire kamer.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel91
  - number: '92'
    text: |-
      1 De gestrafte kan zich bij de behandeling van zijn beroep doen bijstaan door een vertrouwensman.

      2 De [artikelen 57][ref1], [58][ref2], [59, eerste lid][ref3], en [60][ref4] zijn van overeenkomstige toepassing.

      3 Als vertrouwensman kan ook een advocaat optreden.

      4 De voorzitter kan de gestrafte een advocaat als vertrouwensman toevoegen. Een daartoe strekkend verzoek dient
      tenminste drie dagen voor de behandeling van het beroep bij het gerecht te zijn binnengekomen.

      5 Het bepaalde in de vorige leden wordt de gestrafte bij de oproeping medegedeeld.

      6 De overeenkomstig het vierde lid toegevoegde advocaat ontvangt een beloning en vergoeding van door hem gemaakte
      onkosten volgens regelen te stellen bij algemene maatregel van Rijksbestuur.

      7 De voorgaande bepalingen zijn van overeenkomstige toepassing op degene op wie de uitspraak betrekking heeft,
      indien het beroep is ingesteld door de beklagmeerdere.


      [ref1]: https://wetten.overheid.nl/BWBR0004788#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0004788#Artikel59
