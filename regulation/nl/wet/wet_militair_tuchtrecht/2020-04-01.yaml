  - number: 80t
    text: |-
      Indien de tenuitvoerlegging van de opgelegde straf is opgeschort of geschorst, wordt, als de beslissing van de
      beklagmeerdere daartoe aanleiding geeft, de straf of het resterende deel van de straf zo spoedig mogelijk ten
      uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel80t
  - number: '81'
    text: |-
      1 De gestrafte kan beroep instellen bij het gerecht, dat ingevolge de bepalingen van de
      [Wet militaire strafrechtspraak][ref1] bevoegd zou zijn geweest, indien de desbetreffende gedraging een misdrijf
      zou hebben opgeleverd. Dit beroep wordt ingesteld binnen vijf dagen na de uitreiking:

      a. van een schriftelijk stuk als bedoeld in [artikel 80d, eerste lid][ref2];

      b. van een afschrift van een uitspraak op beklag.

      2 [Artikel 80a, tweede lid][ref3], is van overeenkomstige toepassing.

      3 De beklagmeerdere kan binnen vijf dagen na verloop van de termijn bedoeld in [artikel 80a, eerste lid][ref4],
      en er geen beklag is gedaan, bij het in het eerste lid bedoelde gerecht beroep instellen op de grond dat naar zijn
      oordeel ten onrechte geen straf is opgelegd of de opgelegde straf ontoereikend is.

      4 Indien de beklagmeerdere een oordeel heeft gegeven over de wijze van tenuitvoerlegging als bedoeld in
      [het derde lid van artikel 80a][ref5], kan in beroep eveneens de wijze van tenuitvoerlegging van de straf van
      strafdienst of van uitgaansverbod aan het oordeel van het gerecht worden onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0004789
      [ref2]: https://wetten.overheid.nl/BWBR0004788#Artikel80d
      [ref3]: https://wetten.overheid.nl/BWBR0004788#Artikel80a
      [ref4]: https://wetten.overheid.nl/BWBR0004788#Artikel80a
      [ref5]: https://wetten.overheid.nl/BWBR0004788#Artikel80a
    url: https://wetten.overheid.nl/BWBR0004788/2020-04-01#Artikel81
