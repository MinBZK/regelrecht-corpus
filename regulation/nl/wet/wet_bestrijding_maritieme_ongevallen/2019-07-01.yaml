---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_bestrijding_maritieme_ongevallen
regulatory_layer: WET
publication_date: '2023-05-10'
valid_from: '2019-07-01'
bwb_id: BWBR0037162
url: https://wetten.overheid.nl/BWBR0037162/2019-07-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen dat het nodig is nieuwe regels te stellen over de bestrijding van maritieme
    ongevallen, onder intrekking van de Wet bestrijding ongevallen Noordzee, en Boek 8 van het Burgerlijk Wetboek
    alsmede enige andere wetten te wijzigen, ter uitvoering van het op 18 mei 2007 te Nairobi tot stand gekomen
    Internationaal Verdrag inzake het opruimen van wrakken, 2007 (Trb. 2008, 115);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.a
    text: '*Onze Minister:* Onze Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.b
    text: |-
      *schip:* een zeeschip, ongeacht het type, met inbegrip van draagvleugelboten, luchtkussenvaartuigen,
      onderwatervaartuigen, drijvende vaartuigen en drijvende platforms, met uitzondering van platforms die ter plaatse
      worden ingezet bij de exploratie, exploitatie of productie van minerale rijkdommen van de zeebodem;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.c
    text: '*kapitein:* degene die het gezag heeft over het schip;'
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.d
    text: |-
      *maritiem ongeval:* een aanvaring, een stranding of een ander navigatieincident of een ander voorval aan boord
      van het schip of daarbuiten waardoor materiële schade aan een schip of zijn lading wordt veroorzaakt of dreigt te
      worden veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.e
    text: '*wrak:*'
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.e.1°
    text: als gevolg van een maritiem ongeval gezonken of gestrand schip;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.e.2°
    text: |-
      als gevolg van een maritiem ongeval gezonken of gestrand deel van een schip, met inbegrip van zaken die zich aan
      boord van dat schip bevinden of hebben bevonden;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.e.3°
    text: |-
      als gevolg van een maritiem ongeval op zee door een schip verloren zaak die is gestrand, gezonken of op zee op
      drift geraakt, of
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.e.4°
    text: |-
      schip dat als gevolg van een maritiem ongeval op het punt van zinken of stranden staat of naar redelijkerwijs
      verwacht kan worden zal zinken of stranden indien niet reeds doeltreffende maatregelen worden genomen om hulp te
      verlenen aan het in gevaar verkerend schip of andere zaak;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.f
    text: '*gevaar:* elke situatie of dreiging die:'
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.f.1°
    text: een gevaar of belemmering vormt voor de scheepvaart of
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.f.2°
    text: |-
      naar redelijkerwijs verwacht kan worden zal uitmonden in grote schadelijke gevolgen voor het mariene milieu of
      schade aan de kustlijn of daarmee samenhangende belangen van een of meer staten;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.g
    text: |-
      *daarmee samenhangende belangen:* de belangen van een kuststaat die rechtstreeks worden getroffen of bedreigd door
      een wrak, zoals:
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.g.1°
    text: |-
      maritieme activiteiten op of voor de kust, in een haven of in zeemondingen, met inbegrip van de visserij, die een
      essentieel middel van bestaan vormt voor de betrokken personen;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.g.2°
    text: toeristische attracties en andere economische belangen in het betrokken gebied;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.g.3°
    text: |-
      de gezondheid van de bevolking aan de kust en het welzijn van het betrokken gebied, met inbegrip van het behoud van
      de levende mariene rijkdommen en van de flora en fauna;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.g.4°
    text: infrastructuur buitengaats en onder water;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.h
    text: |-
      *opruiming en opruimen:* elke vorm van voorkomen, beperken of ongedaan maken van het gevaar dat ontstaat door een
      wrak;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.i
    text: |-
      *geregistreerde eigenaar:* degene die als eigenaar van het schip is ingeschreven of, bij het ontbreken van
      registratie, de persoon of personen die eigenaar was of waren van het schip op het tijdstip van het maritiem
      ongeval; indien evenwel een schip eigendom is van een staat en geëxploiteerd wordt door een maatschappij die in
      die staat is geregistreerd als exploitant van het schip, wordt onder «geregistreerde eigenaar» die maatschappij
      verstaan;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.j
    text: |-
      *exploitant van het schip:* de eigenaar van het schip of elke andere organisatie of persoon, zoals de manager of
      rompbevrachter, die namens de eigenaar de verantwoordelijkheid heeft aanvaard voor de exploitatie van het schip en
      die bij de aanvaarding van die verantwoordelijkheid de verplichting op zich heeft genomen zich te kwijten van alle
      bijbehorende taken en verantwoordelijkheden die worden opgelegd door de Internationale Veiligheidsbeleidscode (ISM-
      code), zoals gewijzigd;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.k
    text: |-
      *staat waar het schip geregistreerd is:* met betrekking tot een geregistreerd schip, de staat waarin het schip is
      geregistreerd en met betrekking tot een niet-geregistreerd schip, de staat waarvan het schip gerechtigd is de vlag
      te voeren;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.l
    text: |-
      *Nederlands schip:* schip dat op grond van Nederlandse rechtsregels gerechtigd is de vlag van het Koninkrijk te
      voeren;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.m
    text: |-
      *Verdrag:* het op 18 mei 2007 te Nairobi tot stand gekomen Internationaal Verdrag inzake het opruimen van wrakken,
      2007 (Trb. 2008, 115);
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.n
    text: |-
      *Verdragsgebied:* de exclusieve economische zone van een Staat die Partij is, vastgesteld overeenkomstig
      het internationale recht, of, indien een Staat die partij is een dergelijke zone niet heeft vastgesteld, een
      gebied buiten en grenzend aan de territoriale zee van die Staat, door die Staat vastgesteld overeenkomstig het
      internationale recht, en dat zich niet verder uitstrekt dan 200 zeemijl van de basislijnen vanwaar de breedte van
      zijn territoriale zee wordt gemeten, een en ander met dien verstande dat indien een Staat overeenkomstig artikel
      3, tweede lid, van het Verdrag een kennisgeving heeft gedaan dat hij de toepassing van het Verdrag uitbreidt tot
      wrakken die zich binnen zijn grondgebied, met inbegrip van de territoriale zee, bevinden, het Verdragsgebied van
      die Staat dienovereenkomstig wordt uitgebreid;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: 1.o
    text: |-
      *interventiezone:* het gedeelte van de Noordzee dat zich uitstrekt in het noorden tot de breedtegraad van 56°
      noorderbreedte en in het zuiden tot de breedtegraad van 51°10» noorderbreedte, voor zover niet behorend tot
      territoriale zee van Nederland of een andere staat.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel1
  - number: '2.1'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt onder het verlenen van hulp aan een schip
      mede verstaan het verlenen van hulp aan zaken die zich aan boord daarvan bevinden of aan van dat schip afkomstige
      drijvende of gezonken zaken.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel2
  - number: '2.2'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt onder de Nederlandse territoriale zee mede
      verstaan het gedeelte van de Westerschelde dat is gelegen tussen de territoriale zee en de lengtegraad van 3°35»
      oosterlengte.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel2
  - number: '3'
    text: |-
      Indien het schip toebehoort aan een rederij die een boekhouder heeft aangesteld, of indien er sprake is
      van rompbevrachting, treedt de boekhouder, onderscheidenlijk de rompbevrachter voor de toepassing van
      [paragraaf 2.2][ref1] en [hoofdstuk 3][ref2] en, in samenhang daarmee, de [hoofdstukken 4][ref3] en [5][ref4] en
      de daarop berustende bepalingen in de plaats van de geregistreerde eigenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0037162#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0037162#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0037162
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037162
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0037162
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0037162
        hoofdstuk: '5'
  - number: '4.1'
    text: |-
      Dit hoofdstuk is van toepassing op een wrak dat als gevolg van een maritiem ongeval een gevaar vormt in de
      Nederlandse territoriale zee en de Nederlandse exclusieve economische zone, voor zover niet elders in dit hoofdstuk
      anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel4
  - number: '4.2'
    text: Dit hoofdstuk is van overeenkomstige toepassing op de Nederlandse binnenwateren.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel4
  - number: '5.1'
    text: 'Indien zich een maritiem ongeval heeft voorgedaan ten gevolge waarvan:'
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel5
  - number: 5.1.1°
    text: een schip is gezonken of gestrand;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel5
  - number: 5.1.2°
    text: |-
      een deel van een schip, met inbegrip van zaken die zich aan boord van dat schip bevinden of hebben bevonden, is
      gezonken of gestrand;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel5
  - number: 5.1.3°
    text: een door een schip op zee verloren zaak is gestrand, gezonken of op zee op drift geraakt, of
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel5
  - number: 5.1.4°
    text: |-
      een schip op het punt van zinken of stranden staat of naar redelijkerwijs verwacht kan worden, zal zinken of
      stranden indien niet reeds doeltreffende maatregelen worden genomen om hulp te verlenen,
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel5
  - number: '5.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de te verstrekken informatie,
      alsmede de wijze waarop de melding geschiedt en de informatie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel5
  - number: '5.3'
    text: |-
      Het eerste lid en het bepaalde krachtens het tweede lid is niet van toepassing voor zover op grond
      van [artikel 12 van de Wet voorkoming verontreiniging door schepen][ref1] of een voorschrift krachtens
      [artikel 4 van de Scheepvaartverkeerswet][ref2] aan een bevoegd gezag van het ongeval melding moet worden gemaakt
      en daarbij de in het tweede lid bedoelde informatie moet worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel4
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '4'
  - number: '6'
    text: |-
      Indien bij een maritiem ongeval als bedoeld in [artikel 5, eerste lid, onder 1° tot en met 4°][ref1], een
      Nederlands schip is betrokken dat zich bevindt in een deel van het Verdragsgebied dat onder buitenlandse
      jurisdictie staat, maakt de kapitein of de exploitant van het schip daarvan zo spoedig mogelijk melding aan de
      bevoegde autoriteit van de getroffen staat, en verstrekt daarbij de gegevens, bedoeld in artikel 5, tweede lid, van
      het Verdrag. Zodra door de kapitein of de exploitant van het schip aan de meldplicht uit hoofde van dit artikel is
      voldaan, is de ander daarvan ontslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel5
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '7.1'
    text: |-
      Zodra Onze Minister op de hoogte is van de aanwezigheid van een wrak, draagt hij er zorg voor dat onmiddellijk de
      deelnemers aan het scheepvaartverkeer en de betrokken staten worden gewaarschuwd.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel7
  - number: '7.2'
    text: |-
      Indien Onze Minister redenen heeft om aan te nemen dat een wrak een gevaar vormt, draagt hij er zorg voor dat alle
      redelijkerwijs uitvoerbare maatregelen worden getroffen om de precieze locatie van het wrak vast te stellen.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel7
  - number: '8.1'
    text: |-
      Zodra Onze Minister op de hoogte is van de aanwezigheid van een wrak, neemt hij een beschikking, inhoudend dat het
      wrak een gevaar vormt, indien hij daarvoor met inachtneming van de criteria van artikel 6 van het Verdrag gronden
      aanwezig acht.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel8
  - number: '8.2'
    text: |-
      Indien Onze Minister overeenkomstig het eerste lid heeft vastgesteld dat een wrak een gevaar vormt, draagt hij er
      zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel8
  - number: 8.2.a
    text: |-
      alle redelijke maatregelen worden getroffen om het wrak te markeren overeenkomstig het toepasselijke internationaal
      aanvaarde systeem voor bebakening;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel8
  - number: 8.2.b
    text: |-
      de bijzonderheden van de markering van het wrak worden bekendgemaakt met behulp van alle gepaste middelen, met
      inbegrip van zeevaartkundige publicaties;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel8
  - number: 8.2.c
    text: |-
      de beschikking wordt bekendgemaakt aan de geregistreerde eigenaar en wordt zo spoedig mogelijk medegedeeld aan de
      staat waar het schip geregistreerd is;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel8
  - number: 8.2.d
    text: |-
      met het bevoegd gezag van de staat waar het schip geregistreerd is en van andere staten die negatieve gevolgen van
      het wrak ondervinden overleg wordt gevoerd over de met betrekking tot het wrak te treffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel8
  - number: '9.1'
    text: |-
      Indien Onze Minister overeenkomstig [artikel 8][ref1] heeft vastgesteld dat een wrak een gevaar vormt, draagt de
      geregistreerde eigenaar er zorg voor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel8
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 9.1.a
    text: het wrak wordt opgeruimd en
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel9
  - number: 9.1.b
    text: |-
      aan Onze Minister een bewijs wordt overgelegd van verzekering of andere financiële zekerheid als vereist op grond
      van artikel 12 van het Verdrag, tenzij een andere belanghebbende een zodanig bewijs heeft overgelegd.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel9
  - number: '9.2'
    text: |-
      De geregistreerde eigenaar kan ter voldoening aan het eerste lid, onderdeel a, een overeenkomst sluiten met een
      hulpverlener of andere persoon teneinde het wrak te doen opruimen.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel9
  - number: '9.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing met betrekking tot een wrak van een Nederlands schip
      dat zich bevindt in een deel van het Verdragsgebied dat onder buitenlandse jurisdictie staat, ingeval de bevoegde
      autoriteit overeenkomstig artikel 6 van het Verdrag heeft vastgesteld dat een wrak een gevaar vormt.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel9
  - number: '10'
    text: 'Indien Onze Minister overeenkomstig artikel 6 van het Verdrag heeft vastgesteld dat een wrak een gevaar vormt:'
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel10
  - number: 10.a
    text: |-
      stelt hij in een beschikking een redelijke termijn binnen welke de geregistreerde eigenaar het wrak moet opruimen,
      rekening houdend met de aard van het vastgestelde gevaar;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel10
  - number: 10.b
    text: |-
      vermeldt hij bij de bekendmaking van de beschikking met de door hem gestelde termijn dat hij het wrak
      overeenkomstig [artikel 13][ref1] en [artikel 8:656 van het Burgerlijk Wetboek][ref2] voor rekening van de
      geregistreerde eigenaar kan doen opruimen indien de geregistreerde eigenaar verzuimt het wrak binnen die termijn op
      te ruimen en


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel656
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '656'
  - number: 10.c
    text: |-
      stelt hij de geregistreerde eigenaar schriftelijk ervan in kennis dat hij voornemens is onmiddellijk op te treden
      indien het gevaar bijzonder groot wordt.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel10
  - number: '11'
    text: |-
      Alvorens het opruimen aanvangt, kan Onze Minister in een tot de geregistreerde eigenaar gerichte beschikking
      voorschriften vastleggen voor dit opruimen, uitsluitend voor zover dat nodig is om te waarborgen dat het opruimen
      geschiedt in overeenstemming met overwegingen betreffende de veiligheid en de bescherming van het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel11
  - number: '12'
    text: |-
      Wanneer het opruimen door de geregistreerde eigenaar is aangevangen, kan Onze Minister besluiten tot optreden
      bij het opruimen voor zover dat nodig is om te waarborgen dat dit doeltreffend geschiedt, in overeenstemming met
      overwegingen betreffende de veiligheid en de bescherming van het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel12
  - number: '13.1'
    text: |-
      Indien de geregistreerde eigenaar verzuimt het wrak binnen de ingevolge [artikel 10, onder a][ref1], vastgestelde
      termijn op te ruimen, of indien geen contact kan worden gelegd met de geregistreerde eigenaar, kan Onze Minister
      het wrak langs de naar zijn oordeel meest praktische en snelle weg doen opruimen, in overeenstemming met
      overwegingen betreffende de veiligheid en de bescherming van het mariene milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel10
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '13.2'
    text: |-
      Voorts kan Onze Minister in omstandigheden waarin onmiddellijk optreden vereist is en hij de staat waar het schip
      geregistreerd is en de geregistreerde eigenaar daarvan in kennis heeft gesteld, het wrak langs de naar zijn oordeel
      meest praktische en snelle weg doen opruimen, in overeenstemming met overwegingen betreffende de veiligheid en de
      bescherming van het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel13
  - number: '14.1'
    text: |-
      Met betrekking tot een wrak dat zich bevindt in de territoriale zee of op een van de binnenwateren zijn
      [artikel 8, tweede lid, onderdeel c][ref1], wat betreft mededeling aan de staat waar het schip geregistreerd is, en
      d, alsmede de kennisgevingsverplichtingen van [artikel 13, tweede lid][ref2], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Artikel13
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0037162
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '14.2'
    text: |-
      Met betrekking tot een wrak dat zich bevindt op een van de binnenwateren berusten taken en bevoegdheden die elders
      in dit hoofdstuk zijn opgedragen of toegekend aan Onze Minister bij de ingevolge de [Waterwet][ref1] ter plaatse
      bevoegde beheerder dan wel beheerder die is belast met het waterstaatkundig beheer, indien dat aldaar afzonderlijk
      is toegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0025458
  - number: '14.3'
    text: |-
      De beheerder overlegt over de uitoefening van de taken en bevoegdheden met het op grond van de
      [Scheepvaartverkeerswet][ref1] bevoegde gezag. Indien ter plaatse een beheerder die is belast met het
      waterstaatkundig beheer bevoegd is, overlegt deze voorts over de uitoefening van de taken en bevoegdheden met
      andere ingevolge de [Waterwet][ref2] ter plaatse bevoegde beheerders. Overleg op grond van dit lid vindt niet
      plaats indien zich een situatie voordoet die onmiddellijk ingrijpen noodzakelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004364
      [ref2]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004364
      - id: ref2
        bwb_id: BWBR0025458
  - number: '15'
    text: |-
      De kapitein of de geregistreerde eigenaar van een schip dat is betrokken bij een maritiem ongeval in de Nederlandse
      territoriale zee neemt, onverminderd [artikel 9][ref1], de nodige maatregelen om gevaar als gevolg van dat
      ongeval te voorkomen, te beperken of ongedaan te maken, en verleent alle nodige medewerking aan de toepassing van
      maatregelen als bedoeld in [artikel 16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Artikel16
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037162
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '16.1'
    text: |-
      Onze Minister kan ten aanzien van een schip dat zich bevindt in de Nederlandse territoriale zee, onverminderd de
      [paragrafen 2.3][ref1] en [2.4][ref2], alle maatregelen nemen die nodig zijn om een veilige vaart en de veiligheid
      van personen te verzekeren en het mariene milieu en het kustmilieu te beschermen ingeval:


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0037162
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0037162
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 16.1.a
    text: zich met betrekking tot het schip een maritiem ongeval voordoet;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel16
  - number: 16.1.b
    text: |-
      zich een ander voorval of een omstandigheid met gevolgen voor de veiligheid van het schip of van de scheepvaart
      voordoet;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel16
  - number: 16.1.c
    text: zich een situatie voordoet die tot verontreiniging van de wateren of de kust van een staat kan leiden, dan wel
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel16
  - number: 16.1.d
    text: in zee drijvende verontreinigende stoffen, containers of stukgoederen worden waargenomen
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel16
  - number: '16.2'
    text: |-
      De maatregelen op grond van het eerste lid kunnen in elk geval bestaan uit een beschikking, houdende aanwijzingen
      aan de kapitein die betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel16
  - number: 16.2.a
    text: |-
      de aanwezigheid van het schip en de zaken die zich aan boord daarvan bevinden op een bepaalde plaats of in een
      bepaald gebied;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel16
  - number: 16.2.b
    text: |-
      het verplaatsen van het schip en de zaken die zich aan boord daarvan bevinden van of naar een bepaalde plaats, met
      inbegrip van een Nederlandse haven of een bepaald gebied;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel16
  - number: 16.2.c
    text: het doen verlenen van hulp aan het schip;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel16
  - number: 16.2.d
    text: |-
      het aan de grond zetten, tot zinken brengen of vernietigen van het schip alsmede het onschadelijk maken,
      verwijderen, overboord zetten, tot zinken brengen of vernietigen van de zaken die zich aan boord van het schip
      bevinden op een bepaalde plaats of in een bepaald gebied.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel16
  - number: '16.3'
    text: |-
      Bij toepassing van het tweede lid, onderdeel b, kunnen aan de kapitein of de geregistreerde eigenaar met betrekking
      tot de toegang van het schip tot of het verblijf van het schip in de haven beperkende voorschriften worden opgelegd
      in het belang van de openbare veiligheid van het gebied waarin de haven is gelegen.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel16
  - number: '16.4'
    text: |-
      Indien een schip wordt gesleept onder een sleep- of bergingsovereenkomst, kunnen de in het eerste lid bedoelde
      maatregelen ook worden genomen jegens de betrokken bijstands-, bergings- en sleepvaartondernemingen.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel16
  - number: '16.5'
    text: 'De maatregelen op grond van het eerste lid kunnen voorts in elk geval inhouden het vanwege Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel16
  - number: 16.5.a
    text: |-
      verrichten van datgene, met betrekking waartoe ingevolge het tweede of derde lid aanwijzingen kunnen worden
      gegeven;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel16
  - number: 16.5.b
    text: |-
      verrichten van onderzoek naar de toestand van het schip en de aard en de toestand van de zaken die zich aan boord
      daarvan bevinden, of
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel16
  - number: 16.5.c
    text: overnemen van het gezag over het schip.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel16
  - number: '17.1'
    text: |-
      Indien na een maritiem ongeval of daarmee verband houdende handelingen waarvan redelijkerwijs kan worden
      verwacht dat zij zullen leiden tot aanzienlijke schadelijke gevolgen, zich een ernstig en dreigend gevaar, door
      verontreiniging of dreigende verontreiniging, voordoet voor de Nederlandse kust of voor daarmee samenhangende
      belangen van Nederland, en het desbetreffende schip zich in de interventiezone bevindt, maakt de kapitein van dat
      ongeval zo spoedig mogelijk melding aan een daartoe door Onze Minister aangewezen instantie. Ingeval de kapitein
      hiertoe niet in staat is, rust de meldingsplicht op de exploitant van het schip.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel17
  - number: '17.2'
    text: |-
      In een situatie als bedoeld in het eerste lid zijn de kapitein en de exploitant van het desbetreffende schip en
      de eigenaar van gevaarlijke of verontreinigende stoffen aan boord van het desbetreffende schip verder verplicht
      om alle in verband met het ongeval gevraagde gegevens onmiddellijk te verstrekken en om desgevraagd onmiddellijk
      mededeling te doen van alle maatregelen die vanwege het schip in verband met het ongeval zijn genomen.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel17
  - number: '17.3'
    text: |-
      [Artikel 5, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel5
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '18.1'
    text: |-
      Onze Minister kan, onverminderd de [paragrafen 2.3][ref1] en [2.4][ref2], ten aanzien van schepen, met inbegrip
      van wrakken, in de interventiezone de maatregelen nemen die nodig zijn ter bescherming van de Nederlandse kust of
      daarmee samenhangende belangen van Nederland, tegen verontreiniging of dreigende verontreiniging na een maritiem
      ongeval of daarmee verband houdende handelingen waarvan redelijkerwijs kan worden verwacht dat deze zullen leiden
      tot aanzienlijke schadelijke gevolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0037162
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0037162
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '18.2'
    text: |-
      [Artikel 16, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel16
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '19.1'
    text: |-
      Onze Minister oefent zijn in [artikel 16][ref1] of [18][ref2] bedoelde bevoegdheid niet uit dan na overleg met de
      geregistreerde eigenaar en, indien hulpverlening is aangevangen of overeengekomen, na overleg met de hulpverlener,
      tenzij zich een situatie voordoet die onmiddellijk ingrijpen nodig maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Artikel18
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037162
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '19.2'
    text: |-
      Onze Minister oefent zijn in [artikel 16][ref1] of [18][ref2] bedoelde bevoegdheid niet uit ten aanzien van een
      schip onder buitenlandse vlag dan nadat met de vlaggenstaat overleg is gepleegd, tenzij zich een situatie voordoet
      die onmiddellijk ingrijpen nodig maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Artikel18
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037162
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '19.3'
    text: |-
      Wanneer een schip op grond van een voorschrift, aanwijzing of maatregel als bedoeld in [artikel 16][ref1] of
      [18][ref2] naar een Nederlandse haven wordt gebracht, kan Onze Minister de exploitant of kapitein van het schip
      verzoeken een verzekeringsbewijs met betrekking tot een verzekering tegen maritieme vorderingen over te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Artikel18
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037162
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '19.4'
    text: |-
      Een verzoek tot overlegging van een verzekeringsbewijs leidt niet tot vertraging bij de opvang van een schip dat
      bijstand behoeft.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel19
  - number: '19.5'
    text: |-
      Het ontbreken van een verzekeringsbewijs is geen grond voor een weigering een aanwijzing te geven of een maatregel
      te treffen gericht op de opvang van een schip dat bijstand behoeft op een daarvoor geschikte locatie.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel19
  - number: '20'
    text: |-
      Onze Minister oefent zijn bevoegdheid op grond van [artikel 11][ref1], [12][ref2], [13][ref3], [16][ref4] of
      [18][ref5] ten aanzien van een schip dat zich in de Noordzee bevindt niet uit dan in overeenstemming met Onze
      Ministers wie het mede aangaat, tenzij zich een situatie voordoet die onmiddellijk ingrijpen nodig maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0037162#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0037162#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0037162#Artikel18
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037162
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0037162
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref4
        bwb_id: BWBR0037162
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref5
        bwb_id: BWBR0037162
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '21.1'
    text: |-
      Indien zich schadelijke gevolgen van een maritiem ongeval in de Noordzee voordoen die van invloed zijn voor
      het gebied van een gemeente, verstrekt Onze Minister de nodige inlichtingen aan de burgemeester en, in geval
      van een situatie als bedoeld in [artikel 39 van de Wet veiligheidsregio’s][ref1], aan de voorzitter van de
      veiligheidsregio.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel39
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '39'
  - number: '21.2'
    text: |-
      Indien de toepassing van [artikel 11][ref1], [12][ref2], [13][ref3], [16][ref4] of [18][ref5] met betrekking tot
      een schip dat zich bevindt in de Noordzee van invloed zal zijn voor het gebied van de gemeente, wordt over de
      gevolgen daarvan vooraf overleg gevoerd met de burgemeester, dan wel, in geval van een situatie als bedoeld in
      [artikel 39 van de Wet veiligheidsregio’s][ref6], de voorzitter van de veiligheidsregio, tenzij zich een situatie
      voordoet die onmiddellijk ingrijpen nodig maakt. In dat geval wordt dit overleg zo spoedig mogelijk gevoerd. Onze
      Minister verstrekt aan de Commissaris van de Koning de nodige inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0037162#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0037162#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0037162#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0027466#Artikel39
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037162
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0037162
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref4
        bwb_id: BWBR0037162
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref5
        bwb_id: BWBR0037162
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref6
        bwb_id: BWBR0027466
        artikel: '39'
  - number: '22.1'
    text: |-
      Indien Onze Minister ingevolge [artikel 11][ref1], [12][ref2], [13][ref3], [16][ref4] of [18][ref5] een schip naar
      een Nederlandse haven doet brengen, laat het daartoe bevoegde gezag het schip toe tot de aangewezen haven.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0037162#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0037162#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0037162#Artikel18
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037162
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0037162
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref4
        bwb_id: BWBR0037162
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref5
        bwb_id: BWBR0037162
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '22.2'
    text: |-
      Onze Minister neemt de in het eerste lid bedoelde maatregel slechts na overleg met het in het eerste lid bedoelde
      gezag, tenzij zich een situatie voordoet die onmiddellijk ingrijpen nodig maakt. In dat geval wordt dit overleg zo
      spoedig mogelijk gevoerd.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel22
  - number: '23'
    text: |-
      Ten behoeve van de goede uitvoering van deze wet met betrekking tot schepen, met inbegrip van wrakken, die zich
      bevinden in de Noordzee wordt bij besluit van Onze Minister, handelend in overeenstemming met Onze Ministers wie
      het mede aangaat, een plan vastgesteld inzake de organisatie en de coördinatie van de bestrijding van gevaar in of
      vanuit de Noordzee.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel23
  - number: '24'
    text: |-
      Indien Onze Minister ingevolge [artikel 11][ref1], [12][ref2], [13][ref3], [16][ref4] of [18][ref5] een schip naar
      een Nederlandse haven heeft doen brengen, vergoedt Onze Minister de redelijke kosten van die maatregelen van het
      daartoe bevoegde gezag die redelijkerwijs nodig zijn om het gevaar verbonden aan het brengen van het schip naar en
      het verblijf in de haven te voorkomen, te beperken of ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0037162#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0037162#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0037162#Artikel18
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037162
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0037162
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref4
        bwb_id: BWBR0037162
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref5
        bwb_id: BWBR0037162
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '25.1'
    text: |-
      Indien een persoon, nadat een maritiem ongeval heeft plaatsgevonden, hulp heeft verleend aan het desbetreffende
      schip en als gevolg van een besluit of handeling van Onze Minister krachtens [artikel 11][ref1], [12][ref2],
      [13][ref3], [16][ref4] of [18][ref5] bij de hulpverlening schade heeft geleden die hij niet kan verhalen op de
      geregistreerde eigenaar van dat schip of een andere persoon, kent Onze Minister de hulpverlener op diens verzoek
      een billijke tegemoetkoming in die schade toe.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0037162#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0037162#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0037162#Artikel18
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037162
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0037162
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref4
        bwb_id: BWBR0037162
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref5
        bwb_id: BWBR0037162
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '25.2'
    text: |-
      Een tegemoetkoming als bedoeld in het eerste lid wordt geweigerd of kan slechts gedeeltelijk worden toegekend,
      indien de door de hulpverlener geleden schade geheel respectievelijk gedeeltelijk is te wijten aan diens schuld of
      de schuld van degenen voor wie hij aansprakelijk is.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel25
  - number: '25.3'
    text: |-
      Onze Minister neemt bij de toepassing van het eerste lid bij de bepaling van de door de hulpverlener geleden schade
      in het bijzonder in aanmerking:
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel25
  - number: 25.3.a
    text: de bij de hulpverlening gemaakte kosten;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel25
  - number: 25.3.b
    text: het verlies of de beschadiging van het bij de hulpverlening ingezet materieel of gebruikte materialen;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel25
  - number: 25.3.c
    text: de bij de hulpverlening gelopen risico's;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel25
  - number: 25.3.d
    text: het gederfde hulploon.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel25
  - number: '26.1'
    text: |-
      De geregistreerde eigenaar van een in Nederland teboekstaand met een brutotonnage van 300 of
      meer schip is verplicht een verzekering of andere financiële zekerheid, zoals een bankgarantie,
      in stand te houden ter dekking van zijn aansprakelijkheid overeenkomstig het bepaalde in
      [afdeling 6 van titel 6 van Boek 8 van het Burgerlijk Wetboek][ref1] en artikel 12 van het Verdrag, voor het bedrag
      berekend in overeenstemming met artikel 6, eerste lid, onderdeel b, van het op 19 november 1976 te Londen tot stand
      gekomen Verdrag inzake beperking van aansprakelijkheid voor maritieme vorderingen (Trb. 1980, 23), zoals gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Afdeling6
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005034
        afdeling: '6'
  - number: '26.2'
    text: |-
      De geregistreerde eigenaar van een schip met een brutotonnage van 300 of meer dat buiten Nederland teboekstaat
      of een andere dan de Nederlandse vlag voert is verplicht om, indien het schip een haven of laad- of losplaats in
      Nederland aanloopt of verlaat of een Nederlands binnenwater bevaart, een verzekering of andere financiële zekerheid,
      zoals een bankgarantie, in stand te houden voor het bedrag berekend in overeenstemming met artikel 6, eerste lid,
      onderdeel b, van het op 19 november 1976 te Londen tot stand gekomen Verdrag inzake beperking van aansprakelijkheid
      voor maritieme vorderingen (Trb. 1980, 23), zoals gewijzigd ter dekking van zijn aansprakelijkheid overeenkomstig
      het bepaalde in [afdeling 6 van titel 6 van Boek 8 van het Burgerlijk Wetboek][ref1] en artikel 12 van het Verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Afdeling6
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005034
        afdeling: '6'
  - number: '27'
    text: |-
      De overeenkomst tot verstrekking van financiële zekerheid ten aanzien van een schip dat teboekstaat in Nederland of
      in een staat die geen partij is bij het Verdrag, voldoet aan het volgende:
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel27
  - number: 27.a
    text: |-
      de overeenkomst is aangegaan met een verzekeraar, een bank of andere financiële instelling of een andere persoon
      van wie Onze Minister de financiële draagkracht tot het geven van dekking voor de aansprakelijkheid voldoende
      oordeelt;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel27
  - number: 27.b
    text: |-
      de gelden uit hoofde van de overeenkomst kunnen, indien de verstrekker van financiële zekerheid buiten Nederland is
      gevestigd, feitelijk in Nederland ter beschikking komen;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel27
  - number: 27.c
    text: |-
      uit de overeenkomst blijkt dat de benadeelde, in overeenstemming met artikel 12, tiende lid, van het Verdrag, zijn
      vordering rechtstreeks tegen de verstrekker van financiële zekerheid kan instellen; indien de overeenkomst een
      beding inhoudt dat de geregistreerde eigenaar zelf voor een deel in de vergoeding van de schade zal bijdragen,
      blijkt uit de overeenkomst dat de verstrekker van financiële zekerheid niettemin jegens de benadeelde ter zake van
      schade gehouden blijft tot betaling ook van dat deel van de schadevergoeding;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel27
  - number: 27.d
    text: |-
      uit de overeenkomst blijkt dat de verstrekker van financiële zekerheid deze binnen de tijdsduur waarvoor het
      certificaat als bedoeld in [artikel 28][ref1] is uitgegeven, niet eerder kan schorsen of beëindigen of zodanig
      wijzigen dat hij niet meer aan dit artikel voldoet, dan na verloop van drie maanden na de datum van ontvangst van
      een mededeling als bedoeld in [artikel 30][ref2], tenzij het certificaat is ingeleverd of een nieuw certificaat is
      afgegeven vóór het verstrijken van de termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Artikel30
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '28'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0037162
        artikel: '30'
        hoofdstuk: '6'
  - number: '28.1'
    text: |-
      Onze Minister geeft aan de geregistreerde eigenaar van een in Nederland teboekstaand schip of van een schip
      dat niet is teboekgesteld in een staat die partij is bij het Verdrag, op diens verzoek een certificaat af als
      omschreven in artikel 12, tweede en vierde lid, van het Verdrag, indien hem is gebleken dat de geregistreerde
      eigenaar aan zijn in [artikel 26][ref1] bedoelde verplichting voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel26
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '26'
        hoofdstuk: '6'
  - number: '28.2'
    text: 'Bij het verzoek moet de geregistreerde eigenaar de volgende gegevens en stukken overleggen:'
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel28
  - number: 28.2.a
    text: de naam en woonplaats van de geregistreerde eigenaar en de plaats waar diens hoofdkantoor is gevestigd;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel28
  - number: 28.2.b
    text: |-
      een uittreksel uit de registratie voor schepen als bedoeld in
      [artikel 101, eerste lid, van de Kadasterwet][ref1], vermeldende ten minste de gegevens bedoeld in
      [artikel 85, tweede lid, onder a, c, d, e, f, g en j, van die wet][ref2], alsmede de gegevens omtrent niet
      doorgehaalde voorlopige aantekeningen, met dien verstande dat ingeval dat uittreksel meer dan twee dagen vóór de
      dag der overlegging is afgegeven, op dat uittreksel een verklaring van de bewaarder van het Kadaster en de openbare
      registers moet voorkomen, afgegeven binnen voornoemde termijn van twee dagen, dat sedert de afgifte de op dat
      uittreksel vermelde gegevens geen wijziging hebben ondergaan;


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '101'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '85'
  - number: 28.2.c
    text: een afschrift van de overeenkomst tot verstrekking van financiële zekerheid;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel28
  - number: 28.2.d
    text: |-
      de naam van degene die de financiële zekerheid verstrekt en de plaats waar diens hoofdkantoor is gevestigd,
      alsmede, zo nodig, het kantoor waar deze zekerheid wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel28
  - number: 28.2.e
    text: het tijdstip waarop de financiële zekerheid ingaat en het tijdstip waarop deze een einde neemt.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel28
  - number: '29'
    text: |-
      Onze Minister wijst een verzoek als bedoeld in [artikel 28][ref1] af indien de overgelegde gegevens of stukken
      onvoldoende of onjuist zijn of de overeenkomst tot verstrekking van financiële zekerheid niet voldoet aan de
      daaraan in [artikel 27][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Artikel27
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '28'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0037162
        artikel: '27'
        hoofdstuk: '6'
  - number: '30.1'
    text: |-
      De geregistreerde eigenaar aan wie een certificaat is afgegeven, is verplicht om onmiddellijk aan Onze Minister
      schriftelijk mededeling te doen van het ongeldig worden, de schorsing of de beëindiging van de overeenkomst tot
      verstrekking van financiële zekerheid binnen de tijdsduur waarvoor het certificaat is afgegeven, alsmede van elke
      wijziging welke zich gedurende die tijdsduur voordoet in de gegevens welke bij het in [artikel 28][ref1] bedoelde
      verzoek zijn overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel28
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '28'
        hoofdstuk: '6'
  - number: '30.2'
    text: |-
      Onze Minister draagt zorg, dat van een mededeling als bedoeld in het eerste lid ten aanzien van een overeenkomst
      tot verstrekking van financiële zekerheid voor een in Nederland teboekstaand schip schriftelijk of elektronisch
      kennis wordt gegeven aan het kantoor van de Dienst voor het Kadaster en de openbare registers, waar de openbare
      registers waarin het verzoek tot teboekstelling van het schip is ingeschreven, worden gehouden, welke kennisgeving
      aldaar wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel30
  - number: '30.3'
    text: |-
      Het bestaan en de dagtekening van ontvangst van kennisgevingen als bedoeld in tweede lid worden onverwijld vermeld
      in de registratie voor schepen, bedoeld in [artikel 85 van de Kadasterwet][ref1]. Kennisgevingen als bedoeld in het
      tweede lid zijn openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '85'
  - number: '30.4'
    text: |-
      De in het eerste lid bedoelde mededeling kan behalve door de geregistreerde eigenaar ook worden gedaan door degene
      die de financiële zekerheid verstrekt.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel30
  - number: '31.1'
    text: |-
      Onze Minister kan een certificaat intrekken indien door wijziging in de gegevens welke bij het in
      [artikel 28][ref1] bedoelde verzoek zijn overgelegd of doordat die gegevens onvoldoende of onjuist blijken te zijn,
      het niet of niet meer voldoet aan de bij of krachtens dit hoofdstuk gestelde eisen, of indien er goede gronden zijn
      om aan te nemen dat de financiële draagkracht van de verstrekker van de financiële zekerheid onvoldoende was, of
      is geworden of, indien deze buiten Nederland is gevestigd, blijkt van een beletsel voor het feitelijk in Nederland
      beschikbaar komen van de gelden uit hoofde van de overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel28
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '28'
        hoofdstuk: '6'
  - number: '31.2'
    text: In de beschikking wordt een termijn gesteld voor de inlevering van het certificaat.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel31
  - number: '31.3'
    text: |-
      De werking van de beschikking wordt opgeschort totdat de beroepstermijn is verstreken of, indien beroep is
      ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel31
  - number: '32.1'
    text: |-
      De geregistreerde eigenaar is verplicht om het certificaat zo spoedig mogelijk nadat overeenkomstig
      [artikel 30][ref1] mededeling is gedaan van het ongeldig worden, de schorsing of de beëindiging van de overeenkomst
      tot verstrekking van financiële zekerheid, of nadat de tijdsduur waarvoor het certificaat is afgegeven is
      verstreken, bij Onze Minister in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel30
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '30'
        hoofdstuk: '6'
  - number: '32.2'
    text: |-
      De geregistreerde eigenaar is verplicht om het certificaat ingeval van onherroepelijke intrekking bij Onze Minister
      in te leveren binnen de termijn bedoeld in [artikel 31, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel31
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '31'
        hoofdstuk: '6'
  - number: '33.1'
    text: |-
      Onze Minister zendt een afschrift van elk door hem ten aanzien van een in Nederland teboekstaand schip afgegeven
      certificaat, alsmede van elke onherroepelijke beschikking tot intrekking van een ten aanzien van een in Nederland
      teboekstaand schip afgegeven certificaat, aan het kantoor van de Dienst voor het Kadaster en de openbare registers,
      welke kennisgeving aldaar wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel33
  - number: '33.2'
    text: |-
      [Artikel 30, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel30
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '30'
        hoofdstuk: '6'
  - number: '34'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld betreffende de voor de afgifte van een certificaat als bedoeld
      in [artikel 28][ref1] verschuldigde vergoeding en de wijze van betaling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel28
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '28'
        hoofdstuk: '6'
  - number: '35.1'
    text: |-
      Een Nederlands schip met een brutotonnage van 300 of meer vaart niet een in Nederland, met inbegrip van de
      Nederlandse territoriale zee, gelegen haven of ankerplaats binnen of vertrekt daaruit niet, indien het voor
      dat schip overeenkomstig het gestelde in [artikel 28][ref1] dan wel artikel 12, veertiende lid, van het Verdrag
      afgegeven certificaat zich niet aan boord bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel28
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '28'
        hoofdstuk: '6'
  - number: '35.2'
    text: |-
      Een niet in Nederland geregistreerd schip met een brutotonnage van 300 of meer vaart niet een in Nederland of in de
      Nederlandse territoriale zee gelegen haven of ankerplaats binnen of vertrekt daaruit niet, als voor dat schip niet
      overeenkomstig artikel 12 van het Verdrag een certificaat als bedoeld in dat artikel is afgegeven of indien dat
      certificaat zich niet aan boord bevindt.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel35
  - number: '35.3'
    text: |-
      In afwijking van het eerste en tweede lid behoeft het certificaat zich niet aan boord te bevinden indien
      elektronisch, overeenkomstig artikel 12, dertiende lid, van het Verdrag, door of vanwege Onze Minister kan worden
      gecontroleerd of voor het desbetreffende schip een certificaat is afgegeven.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel35
  - number: '36.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de ambtenaren die zijn
      aangewezen bij besluit van Onze Minister dan wel van het ingevolge [artikel 14, tweede lid][ref1], bevoegde
      bestuursorgaan. Zij zijn tevens belast met het uitvoeren van maatregelen, genomen krachtens [artikel 12][ref2],
      [13][ref3], [16][ref4] of [18][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0037162#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0037162#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0037162#Artikel18
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037162
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0037162
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref4
        bwb_id: BWBR0037162
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref5
        bwb_id: BWBR0037162
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '36.2'
    text: |-
      De krachtens het eerste lid aangewezen ambtenaren zijn bevoegd een schip te betreden voor zover dat redelijkerwijs
      nodig is voor de uitoefening van de in het eerste lid bedoelde taken en met inachtneming van artikel 220 en
      afdeling 7 van Deel XII van het VN-Zeerechtverdrag.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel36
  - number: '36.3'
    text: |-
      Zij gebruiken zo nodig de hulp van de sterke arm voor het betreden van het schip en voor het aan boord uitvoeren
      van maatregelen, genomen ingevolge [artikel 13][ref1], [16][ref2] of [18][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0037162#Artikel18
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0037162
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037162
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0037162
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '36.4'
    text: |-
      Bij toepassing van het tweede lid legitimeren de daarin bedoelde ambtenaren zich desgevraagd en doen zij mededeling
      van het doel van het betreden van het schip.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel36
  - number: '36.5'
    text: |-
      De krachtens het eerste lid aangewezen ambtenaren kunnen zich bij toepassing van het tweede lid door bepaalde door
      hen aan te wijzen personen doen vergezellen.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel36
  - number: '37.1'
    text: |-
      Deze wet is niet van toepassing op buitenlandse oorlogsschepen en buitenlandse militaire luchtvaartuigen, alsmede
      buitenlandse schepen of buitenlandse luchtvaartuigen die eigendom zijn van of in beheer zijn bij een staat ten
      tijde dat zij uitsluitend worden gebruikt in dienst van de overheid voor andere dan handelsdoeleinden.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel37
  - number: '37.2'
    text: |-
      Deze wet is, behoudens het bepaalde in het derde lid van dit artikel, niet van toepassing op Nederlandse
      oorlogsschepen en Nederlandse militaire luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel37
  - number: '37.3'
    text: |-
      Onze Minister van Defensie neemt na overleg met Onze Minister en Onze Ministers wie het mede aangaat ten aanzien
      van Nederlandse oorlogsschepen en Nederlandse militaire luchtvaartuigen de maatregelen die nodig zijn om gevaar van
      maritieme ongevallen met deze schepen of luchtvaartuigen te voorkomen, te beperken of ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel37
  - number: '38'
    text: |-
      De Nederlandse strafwet is, waar nodig met inachtneming van artikel 220 en afdeling 7 van Deel XII van het VN-
      Zeerechtverdrag en onverminderd het recht van andere staten om overeenkomstig het VN-Zeerechtverdrag of het
      Verdrag tot rechtsvervolging over te gaan, mede toepasselijk op ieder die zich aan boord van een Nederlands
      schip buiten Nederland schuldig maakt aan overtreding van de bij of krachtens [artikel 5][ref1], [6][ref2],
      [9, eerste lid, onderdeel a][ref3], [15][ref4] of [17][ref5] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0037162#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037162#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037162#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0037162#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0037162#Artikel17
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel38
    references:
