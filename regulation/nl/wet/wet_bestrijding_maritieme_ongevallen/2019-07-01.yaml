  - number: '39'
    text: |-
      De toepasselijkheid van deze wet wordt beperkt door de in het Verdrag en het overige internationaal zeerecht
      erkende uitzonderingen.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel39
  - number: '40'
    text: |-
      De uitvoering van deze wet geschiedt met inachtneming van de relevante bepalingen van de IMO-richtsnoeren
      betreffende de billijke behandeling van zeelieden bij een ongeval op zee in de onder hun jurisdictie vallende
      wateren.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel40
  - number: '47'
    text: |-
      De [Wet bestrijding ongevallen Noordzee][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005444
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005444
  - number: '48'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel48
  - number: '49'
    text: 'Deze wet wordt aangehaald als: Wet bestrijding maritieme ongevallen.'
    url: https://wetten.overheid.nl/BWBR0037162/2019-07-01#Artikel49
