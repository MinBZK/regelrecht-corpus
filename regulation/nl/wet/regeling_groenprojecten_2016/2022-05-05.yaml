articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *accountantsverklaring:* verklaring, afgegeven door een registeraccountant of een accountant-
      administratieconsulent;
        - *Algemene Groepsvrijstellingsverordening:* Verordening (EU) nr. 651/2014 van de Commissie van
      17 juni 2014 waarbij bepaalde categorieën steun op grond van de artikelen 107 en 108 van het
      Verdrag met de interne markt verenigbaar worden verklaard (PbEU 2014, L 187); *bestaand project:*
      a. project als bedoeld in de [artikelen 2, eerste lid, aanhef en onderdelen a, b, g en h][ref1],
      [3 tot en met 8][ref2], [9, onderdelen a tot en met c en e tot en met i][ref3], [10 tot en met 12][ref4],
      waarvoor ten minste zes maanden voor de dag waarop de aanvraag tot afgifte van een groenverklaring
      wordt ingediend met de uitvoering van de werkzaamheden is aangevangen; b. project als bedoeld in
      [artikel 2, eerste lid, aanhef en onderdelen c tot en met f][ref5], dat ten minste zes maanden voor de dag waarop
      de aanvraag tot afgifte van een groenverklaring wordt ingediend reeds voldeed aan een van de projectomschrijvingen
      in het betreffende onderdeel; c. project als bedoeld in [artikel 9, aanhef en onderdeel d][ref6], waarvoor meer dan
      acht maanden voor de dag waarop de aanvraag tot afgifte van een groenverklaring wordt ingediend de hypotheekakte
      werd gepasseerd dan wel de leenovereenkomst werd gesloten;
        - *biomassa:* biomassa als bedoeld in artikel 2 van de Algemene Groepsvrijstellingsverordening;
        - *Bouwbesluit:* het op de datum van aanvraag van de groenverklaring geldende Bouwbesluit;
        - *bruto vloeroppervlak:* oppervlakte gemeten op vloerniveau langs de buitenomtrek van opgaande
      scheidingsconstructies die de desbetreffende ruimte of groep van ruimten omsluiten;
        - *bruto-subsidie-equivalent:* bruto-subsidie-equivalent als bedoeld in artikel 2 van de Algemene
      Groepsvrijstellingsverordening;
        - *de-minimisverordening landbouw:* Verordening (EU) nr. 1408/2013 van de Commissie van 18 december 2013
      betreffende de toepassing van de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie
      op de-minimissteun in de landbouwsector (PbEU 2013, L 352);
        - *duurzaam geproduceerd hout:* hout dat voldoet aan de Dutch Procurement Criteria for Timber ten aanzien van
      duurzaam bosbeheer en de handelsketen, volgens de bijbehorende beoordelingsmethode, zoals bij brief van 24 juli
      2008 is vastgesteld door de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer (Kamerstukken II
      2007/08, 30 196, nr. 35);
        - *duurzame melkveehouderij:* het bedrijfsmatig houden van melkkoeien op een duurzame wijze met een integraal
      duurzaam veehouderijsysteem dat in uitvoering overeenstemt met een duurzame melkveestal die op grond van de
      [artikelen 3.31][ref7] of [3.42a van de Wet inkomstenbelasting 2001][ref8] door de Minister van Infrastructuur en
      Waterstaat is aangewezen als bedrijfsmiddel dat in het belang is van het Nederlandse milieu;
        - *eigenaar-bewoner:* natuurlijk persoon die een woning in eigendom heeft dan wel verkrijgt en daarin zijn
      hoofdverblijf heeft of zal hebben, dan wel de erfpachter, vruchtgebruiker of gerechtigde tot een appartementsrecht
      als bedoeld in [artikel 106 van Boek 5 van het Burgerlijk Wetboek][ref9], voor zover deze rechten betrekking hebben
      op een woning;
        - *energielabelklasse:* energielabelklasse als bedoeld in
      [artikel 2.1, achtste lid, van het Besluit energieprestatie gebouwen][ref10];
        - *Groen Label Kas:* tuinbouwkas die wordt gebruikt voor het bedrijfsmatig telen van tuinbouwgewassen met een
      lagere milieubelasting en die in technische uitvoering overeenstemt met een tuinbouwkas die op grond van de
      [artikelen 3.31][ref11] of [3.42a van de Wet inkomstenbelasting 2001][ref12] door de Minister van Infrastructuur en
      Waterstaat is aangewezen als bedrijfsmiddel dat in het belang is van het Nederlandse milieu;
        - *groenverklaring:* schriftelijk besluit van de Minister van Infrastructuur en Waterstaat als bedoeld in
      [artikel 5.14, derde lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref13], waarin wordt verklaard dat een
      project in het belang is van de bescherming van het milieu, waaronder natuur en bos;
        - *kmo:* kleine, middelgrote en micro-ondernemingen in de zin van bijlage 1 van de Landbouw
      Groepsvrijstellingsverordening;
        - *Landbouw Groepsvrijstellingsverordening:* Verordening (EU) nr. 702/2014 van de Commissie van 25 juni 2014
      waarbij bepaalde categorieën steun in de landbouw- en de bosbouwsector en in plattelandsgebieden op grond van de
      artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie met de interne markt verenigbaar
      worden verklaard (PbEU 2014, L 193);
        - *landbouwsector:* landbouwsector als bedoeld in artikel 2 van de Landbouw Groepsvrijstellingsverordening;
        - *Maatlat Duurzame Veehouderij en Aquacultuur:* veehouderij die wordt gebruikt voor het bedrijfsmatig
      houden van melkvee en die in technische uitvoering overeenstemt met een veehouderij die op grond van de
      [artikelen 3.31][ref14] of [3.42a van de Wet inkomstenbelasting 2001][ref15] door de Minister van Infrastructuur en
      Waterstaat is aangewezen als bedrijfsmiddel dat in het belang is van het Nederlandse milieu;
        - *project:* in Nederland gelegen technisch, functioneel en in de tijd samenhangend geheel van activa en
      werkzaamheden;
        - *projectbeheerder:* degene voor wiens rekening en risico een project wordt ontwikkeld en in stand wordt gehouden;
        - *projectvermogen:* vermogen dat nodig is voor de financiering van vaste activa en voor de werkzaamheden om de
      vaste activa te plaatsen, voor zover noodzakelijk voor en uitsluitend dienstbaar aan de totstandbrenging van een
      project;
        - *recycling:* recycling als bedoeld in artikel 2 van de Algemene Groepsvrijstellingsverordening;
        - *utiliteitsgebouw:* gebouw waarvoor in het Bouwbesluit een energieprestatie-eis is vastgelegd, met uitzondering
      van woningen;
        - *verbeterproject:* project gericht op een wezenlijke verandering van een bestaand project, waardoor dit project
      naar inrichting, aard of omvang een wijziging ondergaat die het project aanmerkelijk waardevoller maakt voor het
      milieu, waaronder natuur en bos;
        - *woning:* gebouw, bedoeld voor bewoning, dat voortdurend als hoofdverblijf ter beschikking staat aan een
      of meer natuurlijke personen en per wooneenheid ten minste is voorzien van een eigen toegang, toilet, bad- of
      douchevoorziening, alsmede van een energieaansluiting, bedoeld voor een kooktoestel om een maaltijd te kunnen
      bereiden.


