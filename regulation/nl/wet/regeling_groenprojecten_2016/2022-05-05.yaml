      1 De Minister van Infrastructuur en Waterstaat kan, in overeenstemming met de Minister van Financiën en na overleg
      met de Minister van Economische Zaken en Klimaat en de Minister van Landbouw, Natuur en Voedselkwaliteit, een
      groenverklaring afgeven voor projecten in de categorie natuur, die zijn gericht op:

      a. de ontwikkeling en instandhouding van natuur- en landschappelijke waarden in gebieden die als Natura 2000-gebied
      zijn aangewezen op grond van de [Wet natuurbescherming][ref1], of in Nationale Parken of gebieden die onderdeel
      zijn van het Natuurnetwerk Nederland;

      b. de ontwikkeling en instandhouding van natuur- en natuurlijke gebiedseigen landschappelijke en cultuurhistorische
      waarden binnen de begrenzing van de Nationale Landschappen, met uitzondering van opstallen;

      c. de ontwikkeling en instandhouding van nieuwe natuur- en landschappelijke waarden van opengestelde landgoederen
      als bedoeld in [artikel 7, eerste lid, van het Rangschikkingsbesluit Natuurschoonwet 1928][ref2], met uitzondering
      van opstallen;

      d. de ontwikkeling en instandhouding van nieuwe natuur- en landschappelijke waarden die in aanmerking zijn gekomen
      voor subsidie op grond van het landelijk format van de provinciale Subsidieregeling Kwaliteitsimpuls Natuur en
      Landschap SKNL natuurbeheer;

      e. de ontwikkeling en instandhouding van natuur- en landschappelijke waarden die in aanmerking zijn gekomen voor
      subsidie op grond van hoofdstuk 3 van de provinciale Subsidieverordening Natuur en Landschapsbeheer 2016;

      f. de ontwikkeling en instandhouding van natuur en landschappelijke waarden die voldoen aan de vereisten die zijn
      opgenomen in [bijlage 1][ref3];

      g. het bevorderen en in stand houden van biodiversiteit, mits dit geen economische activiteit betreft, door de
      aanleg van:

      1°. visgeleidingssystemen voor het opheffen van kunstmatige barrières;

      2°. landdiergeleidingssystemen voor het opheffen van kunstmatige barrières; of

      3°. vogelwaarschuwingssystemen of alarmeringsystemen ter voorkoming van botsingen van vogels met niet natuurlijke
      obstakels; of

      h. natuur- en milieueducatie gericht op inheemse natuur, mits het geheel aan werkzaamheden geen economische
      activiteit betreft, de educatie een primair en aantoonbaar doel is van het project en geen deel uitmaakt van het
      reguliere onderwijscurriculum.

      2 De projecten, genoemd in het eerste lid, aanhef en onderdelen a, b en c, worden niet uitgevoerd door een
      onderneming die actief is in de landbouwsector.


