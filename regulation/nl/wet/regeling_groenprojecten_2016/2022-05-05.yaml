  - number: '10'
    text: |-
      De Minister van Infrastructuur en Waterstaat kan, in overeenstemming met de Minister van Financiën en na overleg
      met de Minister van Economische Zaken en Klimaat en de Minister van Landbouw, Natuur en Voedselkwaliteit, een
      groenverklaring afgeven voor projecten in de categorie duurzame mobiliteit, die zijn gericht op:

      a. de realisatie van:

      1°. vrijliggende of verhoogde fietspaden die verhard zijn met asfalt en die woon- of verblijfsgebieden verbinden
      met werkgebieden of woonkernen met meer dan 50.000 inwoners, of die de bereikbaarheid per fiets van transferia,
      P&R-terreinen, OV-stations of OV-halteplaatsen, kantoren- of bedrijventerreinen, scholen, medische- en
      zorginstellingen of toeristische attracties vergroten, of die deel uitmaken van het landelijk fietsroutenetwerk; of

      2°. overdekte fietsenstallingen of de aanschaf van fietsen voor niet-commercieel gemeenschappelijk gebruik; of

      b. de aanschaf van:

      1°. niet-railgebonden duurzame voertuigen voor vervoer, geschikt voor personenvervoer van meer dan
      acht passagiers, over de openbare weg of op bedrijfsterreinen in de openlucht, met een elektrisch of
      brandstofcelaandrijvingssysteem, dan wel rijdend op waterstof, (bio-)LNG of (bio-)CNG, dan wel een combinatie van
      voornoemde technieken; of

      2°. duurzame binnenvaartschepen die voorzien zijn van een dieselelektrisch, batterijelektrisch of
      brandstofcelsysteem voor de voortstuwing, of uitsluitend varen op waterstof, (bio-)LNG of (bio-)CNG of een
      combinatie van voornoemde technieken of brandstoffen, danwel voorzien zijn van dual-fuel motoren voor de combinatie
      van (bio-)LNG of (bio-)CNG en diesel, al dan niet in combinatie met een rompoptimalisatieonderzoek, met dien
      verstande dat bij gebruik van (bio-)LNG of (bio-)CNG als brandstof wordt aangetoond dat de methaanslip niet hoger
      is dan 3 gram per kWh.
    url: https://wetten.overheid.nl/BWBR0037778/2022-05-05#Artikel10
  - number: '11'
    text: |-
      De Minister van Infrastructuur en Waterstaat kan, in overeenstemming met de Minister van Financiën en na overleg
      met de Minister van Economische Zaken en Klimaat en de Minister van Landbouw, Natuur en Voedselkwaliteit, een
      groenverklaring afgeven voor projecten in de categorie duurzame waterketens:

      a. die gericht zijn op het:

      1°. gescheiden afvoeren en infiltreren, met uitzondering van diepte-infiltratie, van regenwater, gevallen op
      verharde oppervlakken binnen de bebouwde kom;

      2°. gescheiden afvoeren en opslaan voor gebruik als proceswater, met uitzondering van gebruik in de land- en
      tuinbouw, van regenwater, gevallen op verharde oppervlakken;

      3°. gescheiden afvoeren voor lozing op oppervlaktewater van regenwater, gevallen op verharde oppervlakken binnen de
      bebouwde kom;

      b. die zijn gericht op de ondergrondse opslag van zoet water of regenwater, gelegen op minimaal vijf en maximaal 75
      meter onder maaiveld en geschikt voor gebruik in de land- en tuinbouw; of

      c. die zijn gericht op waterbehandeling op innovatieve en duurzame wijze en bestemd voor:

      1°. de bereiding van drinkwater;

      2°. de bereiding van drinkwater uitgaande van afvalwaterstromen; of

      3°. de behandeling van afvalwater ter realisatie van een gesloten watersysteem binnen de inrichting, met
      uitzondering van de gangbare technieken voor voedingswater in de tuinbouw ter vervanging van niet-gesloten
      systemen;

      4°. de behandeling van afvalwater gericht op het terugwinnen en hergebruik van de in het afvalwater aanwezige
      stoffen, ter vervanging van een bestaand systeem dat werkt zonder een dergelijke terugwinning en hergebruik;

      5°. de behandeling van afvalwater, dan wel bereiding van drinkwater waarbij een reductie van ten minste 50% in het
      energiegebruik wordt gerealiseerd ten opzichte van de bestaande of te vervangen installatie, bij gelijkblijvende of
      verbeterde zuiveringsresultaten; of

      6°. de specifieke behandeling van hormoonrijk en geneesmiddelrijk afvalwater of de behandeling van afvalwater dat
      verontreinigd is met prioritaire stoffen, waarbij een reductie van ten minste 50% van de effluentwaarde van deze
      stoffen wordt gerealiseerd ten opzichte van de effluentwaarde van deze stoffen van de bestaande of de te vervangen
      installatie.
    url: https://wetten.overheid.nl/BWBR0037778/2022-05-05#Artikel11
  - number: '12'
    text: |-
      De Minister van Infrastructuur en Waterstaat kan, in overeenstemming met de Minister van Financiën en na overleg
      met de Minister van Economische Zaken en Klimaat en de Minister van Landbouw, Natuur en Voedselkwaliteit, een
      groenverklaring afgeven voor projecten in de categorie klimaatadaptatie die gericht zijn op:

      a. de aanleg en inrichting of herinrichting van retentiegebieden om wateroverlast op regionaal of lokaal niveau te
      voorkomen mits de retentiegebieden een natuurcomponent kennen;

      b. gebouwgebonden waterberging in stedelijk gebied, gelegen op, in of onder het gebouw, met uitzondering van
      parkeergarages;

      c. de aanleg van vegetatiedaken en verticale tuinen in stedelijk gebied; of

      d. akkerbouwproductie van teelten op zilte grond, waarbij het gewas is geselecteerd en aangepast aan het
      zoutgehalte in de grond en het grondwater.
    url: https://wetten.overheid.nl/BWBR0037778/2022-05-05#Artikel12
  - number: '13'
    text: |-
      1 Een groenverklaring wordt aangevraagd door en afgegeven aan een kredietinstelling of een beleggingsinstelling als
      bedoeld in [artikel 5.14, tweede lid, van de Wet inkomstenbelasting 2001][ref1], die voornemens is in belangrijke
      mate bij te dragen aan het verstrekken van kredieten ten behoeve van een project als bedoeld in dat artikellid dan
      wel het direct of indirect beleggen van vermogen in bedoeld project.

      2 Een aanvraag wordt ingediend door middel van het daartoe bestemde aanvraagformulier bij de Rijksdienst voor
      Ondernemend Nederland.

      3 Aan een aanvrager kan worden verzocht een accountantsverklaring over te leggen, waaruit de juistheid of
      aannemelijkheid van de in de aanvraag vermelde gegevens blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5.14
    url: https://wetten.overheid.nl/BWBR0037778/2022-05-05#Artikel13
