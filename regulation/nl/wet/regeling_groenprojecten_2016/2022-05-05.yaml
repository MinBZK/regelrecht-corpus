  - number: '22'
    text: |-
      Aan de in deze regeling bedoelde normen, meetvoorschriften, tests, groenverklaringen en certificaten worden
      gelijkgesteld normen, meetvoorschriften, tests en certificaten die ten minste een gelijkwaardig beschermingsniveau
      bieden.
    url: https://wetten.overheid.nl/BWBR0037778/2022-05-05#Artikel22
  - number: '23'
    text: |-
      1 Op projecten waarvoor voorafgaande aan 1 april 2016 een aanvraag voor een groenverklaring is ingediend, blijft de
      [Regeling groenprojecten 2010][ref1] blijft van toepassing.

      2 Een aanvraag voor een groenverklaring waarvoor de vergunning voor het project is aangevraagd voor 1 januari 2021,
      wordt beoordeeld met inachtneming van de Regeling groenprojecten 2016 zoals deze luidde op 31 december 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0027439
    url: https://wetten.overheid.nl/BWBR0037778/2022-05-05#Artikel23
