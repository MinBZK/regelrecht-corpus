        artikel: '20'
        hoofdstuk: '5'
  - number: '20'
    text: |-
      Indien de uitvoering van een project wijzigt, doet de krediet- of beleggingsinstelling die kapitaal verschaft ten
      behoeve van een project waarvoor een groenverklaring is afgegeven, daarvan onverwijld melding aan de Minister van
      Infrastructuur en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0037778/2022-05-05#Artikel20
  - number: '21'
    text: |-
      Ten behoeve van de vaststelling van een groenverklaring is ten aanzien van de krediet- of beleggingsinstelling,
      bedoeld in [artikel 5.14, tweede lid, van de Wet inkomstenbelasting 2001][ref1], en de projectbeheerder
      [hoofdstuk VIII, afdeling 2, van de Algemene wet inzake rijksbelastingen][ref2] van overeenkomstige toepassing
      inzake de verstrekking van de van belang zijnde gegevens en de daaraan verbonden rechten en plichten. Hierbij
      gelden de aan de inspecteur opgelegde verplichtingen eveneens voor de door de Minister van Infrastructuur en
      Waterstaat aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5.14
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
    url: https://wetten.overheid.nl/BWBR0037778/2022-05-05#Artikel21
