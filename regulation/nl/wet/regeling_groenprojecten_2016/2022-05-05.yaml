  - number: '18'
    text: |-
      Indien met een project waarvoor een groenverklaring is verstrekt een financieel
      voordeel wordt behaald van meer dan € 500.000, dan wel met een project als bedoeld in de
      [artikelen 2, eerste lid, aanhef en onderdelen d, e of f][ref1], [3][ref2], voor zover het de productie van
      landbouwproducten betreft, [4][ref3], [11, aanhef en onderdeel b][ref4], of [12, aanhef en onderdeel d][ref5],
      waarvoor een groenverklaring is verstrekt een financieel voordeel wordt behaald van meer dan € 60.000,
      maakt de Minister van Infrastructuur en Waterstaat de gegevens, genoemd in bijlage III van de Algemene
      Groepsvrijstellingsverordening en de Landbouw Groepsvrijstellingsverordening, van de begunstigde openbaar.


