      1 Ter zake van een project als bedoeld in [artikel 2, eerste lid, aanhef en onderdeel e][ref1], komt voor een
      groenverklaring in aanmerking een bedrag van ten hoogste € 5.000 per hectare voor projecten als bedoeld in
      hoofdstuk 3 van de provinciale Subsidieverordening Natuur en Landschapsbeheer 2016.

      2 Ter zake van een project als bedoeld in [artikel 2, eerste lid, aanhef en onderdeel f][ref2], komt voor
      een groenverklaring in aanmerking de waarde van de grond in eigendom of in gebruik waarop de activiteit wordt
      uitgevoerd.

      3 Ter zake van een project als bedoeld in [artikel 3, aanhef en onderdeel c][ref3], komt voor een groenverklaring
      in aanmerking een bedrag dat is gebaseerd op de kosten die worden gemaakt om tot een kwaliteitsregeling waarvoor
      steun wordt verleend toe te treden en de jaarlijkse bijdrage voor deelname aan die kwaliteitsregeling, inclusief,
      in voorkomend geval, de kosten van de controles die nodig zijn om te verifiëren of het productdossier wordt
      nageleefd.

      4 Het projectvermogen met betrekking tot een project als bedoeld in artikel 4, aanhef en onderdeel a, is
      gemaximeerd op € 100 per vierkante meter kasoppervlak, exclusief de kosten voor zelf opgewekte of zelf gewonnen
      energie als bedoeld in de [artikelen 7, aanhef en onderdelen c, d, e of g][ref4], of [8][ref5], aanhef en
      onderdeel a, of duurzame energie als bedoeld in artikel 7, aanhef en onderdeel f.

      5 Het projectvermogen met betrekking tot een project als bedoeld in [artikel 4, aanhef en onderdeel b][ref6], is
      gemaximeerd tot € 1.000.000 per stal.

      6 Het projectvermogen met betrekking tot een project als bedoeld in [artikel 8, aanhef en onderdelen c en d][ref7],
      is gemaximeerd tot € 250.000 per project.

      7 Ter zake van een project als bedoeld in [artikel 9, aanhef en onderdeel a][ref8], komt voor een groenverklaring
      in aanmerking een bedrag van € 150.000 indien het een grondgebonden woning betreft, en een bedrag van € 100.000
      indien het een niet-grondgebonden woning betreft.

      8 Ter zake van een project als bedoeld in [artikel 9, aanhef en onderdelen b en c][ref9], komt voor een
      groenverklaring in aanmerking een bedrag van € 1.000 per vierkante meter bruto vloeroppervlak van het gedeelte van
      een pand met woonbestemming, tot een maximum van € 100.000 per gerealiseerde woning.

      9 Op een project als bedoeld in [artikel 9, aanhef en onderdelen d en e][ref10], is de volgende tabel van
      toepassing:









                    Bij een verbeteringsniveau van de energieprestatie zoals opgenomen onder


