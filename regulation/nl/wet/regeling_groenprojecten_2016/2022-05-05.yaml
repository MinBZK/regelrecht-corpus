      De Minister van Infrastructuur en Waterstaat kan, in overeenstemming met de Minister van Financiën en na overleg
      met de Minister van Economische Zaken en Klimaat en de Minister van Landbouw, Natuur en Voedselkwaliteit, een
      groenverklaring afgeven voor projecten in de categorie landbouw, die zijn gericht op:

      a. het bedrijfsmatig telen van gewassen in een Groen Label Kas, met niveau A, conform het van toepassing zijnde
      certificatieschema Groen Label Kas op het moment van indiening van de aanvraag, mits er geen voorzieningen aanwezig
      zijn voor het wegkoelen van opgewekte warmte; of

      b. een duurzame melkveehouderij, die is voorzien van een certificaat A conform het van toepassing zijnde
      certificatieschema van de Maatlat Duurzame Veehouderij en Aquacultuur, onderdeel MDV – melkveestallen op het moment
      van indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0037778/2022-05-05#Artikel4
  - number: '5'
    text: |-
      De Minister van Infrastructuur en Waterstaat kan, in overeenstemming met de Minister van Financiën en na overleg
      met de Minister van Economische Zaken en Klimaat en de Minister van Landbouw, Natuur en Voedselkwaliteit, een
      groenverklaring afgeven voor projecten in de categorie duurzame grondstoffen, die zijn gericht op de industriële
      verwerking van biomassa tot producten die niet geschikt zijn voor menselijke of dierlijke consumptie, met
      uitzondering van de verwerking van genoemde stoffen tot energie of energiedragers, mits dit proces een voor
      Nederland niet gangbare combinatie van grondstof tot product betreft en dit leidt tot een vermindering van de
      aantasting van het milieu.
    url: https://wetten.overheid.nl/BWBR0037778/2022-05-05#Artikel5
  - number: '6'
    text: |-
      De Minister van Infrastructuur en Waterstaat kan, in overeenstemming met de Minister van Financiën en na overleg
      met de Minister van Economische Zaken en Klimaat en de Minister van Landbouw, Natuur en Voedselkwaliteit, een
      groenverklaring afgeven voor projecten in de categorie terugwinning en recycling, die zijn gericht op vermindering
      van milieudruk en op vermindering van de inzet van primaire grondstoffen voor producten door toepassing van:

      a. nog niet gangbare processen voor terugwinning van materialen, producten of grondstoffen, anders dan energie
      of energiedragers, uit stromen waarvoor een laagwaardigere verwerking gangbaar is, waardoor de inzet van primaire
      grondstoffen beperkt kan worden;

      b. processen gericht op de verwerking van stortbare baggerspecie tot grondstoffen waardoor de inzet van primaire
      grondstoffen beperkt kan worden; of

      c. een pyrolyse-installatie, bestemd voor het onder zuurstofarme of zuurstofloze omstandigheden thermisch
      ontleden van afvalstoffen die niet voor recycling geschikt zijn, maar conform de minimumstandaard in het Landelijk
      afvalbeheerplan 2009-2021 verbrand of gestort mogen worden, waarbij de vrijkomende vaste, vloeibare of gasvormige
      reactieproducten worden toegepast als grondstof voor nieuwe producten of materialen, niet zijnde brandstoffen.
    url: https://wetten.overheid.nl/BWBR0037778/2022-05-05#Artikel6
  - number: '7'
    text: |-
      De Minister van Infrastructuur en Waterstaat kan, in overeenstemming met de Minister van Financiën en na overleg
      met de Minister van Economische Zaken en Klimaat en de Minister van Landbouw, Natuur en Voedselkwaliteit, een
      groenverklaring afgeven voor projecten in de categorie duurzame energie, die zijn gericht op:

      a. het realiseren van een biogasopwaardeerinstallatie, bestemd voor het produceren van gas van aardgasnetkwaliteit,
      waarbij uitsluitend uit biomassa of uit mest verkregen gassen als energie-input mogen dienen, met dien verstande
      dat hierbij uitgezonderd zijn installaties die worden gebruikt voor de productie van biobrandstoffen op basis van
      voedingsgewassen of waarvoor een leverings- of bijmengverplichting geldt;

      b. het realiseren van een biobrandstofproductie-installatie, bestemd voor het produceren van vloeibare of
      gasvormige duurzame brandstoffen uit houtachtige of cellulose-achtige verbindingen door:

      1°. hogedrukontleding;

      2°. hogetemperatuurontleding;

      3°. gebruik van het Fischer-Tropschproces dan wel een hiermee vergelijkbaar proces; of

      4°. cellulose fermentatie, met uitzondering van mesofiele en thermofiele mestvergisting;

      c. het opwekken van elektrische energie door middel van een windturbine die is gecertificeerd volgens de Europese
      veiligheidsnormen IEC 61400-1, Ed. 3 of IEC 61400-22;

      d. het opwekken van elektrische energie met behulp van fotovoltaïsche cellen, eventueel in combinatie met de opslag
      van de opgewekte elektriciteit;

      e. het gebruik van thermische zonne-energie door middel van zonnecollectoren, eventueel in combinatie met een van
      de volgende warmtepompen:

      1°. een warmtepomp met voor water/water-systemen een coëfficiënt of performance van ten minste 4,0, bij een
      conditie van W10/W45 conform de norm EN 14511; of

      2°. een warmtepomp met voor brine/water-systemen een coëfficiënt of performance van ten minste 3,2, bij een
      conditie van B0/W45 conform de norm EN 14511;

      f. het winnen van aardwarmte; of

      g. het opwekken van elektrische energie uit water of waterkracht, mits de waterkrachtinstallatie voldoet aan
      [Richtlijn 2000/60/EG](32000L0060) van het Europees Parlement en de Raad van 23 oktober 2000 tot vaststelling van
      een kader voor communautaire maatregelen betreffende het waterbeleid (PbEG 2000, L 327) en voor zover het project
      is voorzien van maatregelen ter bescherming van de biodiversiteit, en met uitzondering van het opwekken van energie
      met behulp van stoomturbines.
    url: https://wetten.overheid.nl/BWBR0037778/2022-05-05#Artikel7
  - number: '8'
    text: |-
      De Minister van Infrastructuur en Waterstaat kan, in overeenstemming met de Minister van Financiën en na overleg
      met de Minister van Economische Zaken en Klimaat en de Minister van Landbouw, Natuur en Voedselkwaliteit, een
      groenverklaring afgeven voor projecten in de categorie energiebesparing, die zijn gericht op:

      a. het met behulp van warmtepompen en een gesloten bodemwarmtewisselaar of aquifer opwaarderen van laagwaardige
      warmte naar hoogwaardige warmte op een zodanige wijze dat de hoogwaardige warmte nuttig wordt aangewend, door
      middel van:

      1°. een warmtepomp met voor water/water systemen een coëfficiënt of performance van ten minste 4,0, bij een
      conditie van W10/W45 conform de norm EN 14511; of

      2°. een warmtepomp met voor brine/water systemen een coëfficiënt of performance van ten minste 3,2, bij een
      conditie van B0/W45 conform de norm EN 14511;

      b. koeling met behulp van een warmtepomp waarbij de warmte gelijktijdig voor ten minste 50% nuttig wordt toegepast
      binnen het bedrijf;

      c. het aanleggen van energiearme buitenverlichting bestemd voor het verlichten van openbare wegen, openbare
      pleinen, openbare gebouwen, bruggen, openbare parken, parkeerterreinen, verharde bedrijfsterreinen of
      sportaccommodaties, en bestaande uit masten, led-lampen en specifiek voor die lampen geschikte armaturen, en indien
      van toepassing elektronische voorschakelapparaten en bijbehorende verlichtingsmanagementsystemen;

      d. het aanleggen van energiearme buitenverlichting bestemd voor het verlichten van openbare wegen, openbare
      pleinen, openbare gebouwen, bruggen, openbare parken, parkeerterreinen, verharde bedrijfsterreinen of
      sportaccommodaties waarbij aantoonbaar een energiebesparing wordt gerealiseerd door een toename van het
      systeemrendement in lumen/Watt van ten minste 30% ten opzichte van het gemiddeld energiegebruik bij soortgelijke
      gangbare installaties, en bestaande uit masten, lampen en armaturen, en indien van toepassing elektronische
      voorschakelapparaten en bijbehorende verlichtingsmanagementsystemen;

      e. het aanleggen van warmtedistributienetten en het bouwen van bijstookketels en warmtebuffers, ten behoeve van
      warmtebenutting die voor ten minste 80% afkomstig is van een of meer van onderstaande bronnen:

      1°. restwarmte van installaties in de industrie waarbij geen elektriciteit wordt opgewekt en
      afvalverbrandingsinstallaties voor stedelijk afval;

      2°. restwarmte van elektriciteitsopwekkingsinstallaties met een elektrisch rendement van ten minste 30% en een
      minimaal vermogen van 20 MW;

      3°. een aardwarmtebron; of

      f. het aanleggen van koudedistributienetten waarbij de koude afkomstig is van een hernieuwbare bron, restwarmte
      van installaties in de industrie waarbij geen elektriciteit wordt opgewekt of afvalverbrandingsinstallaties voor
      stedelijk afval.
    url: https://wetten.overheid.nl/BWBR0037778/2022-05-05#Artikel8
  - number: '9'
    text: |-
      De Minister van Infrastructuur en Waterstaat kan, in overeenstemming met de Minister van Financiën en na overleg
      met de Minister van Economische Zaken en Klimaat en de Minister van Landbouw, Natuur en Voedselkwaliteit, een
      groenverklaring afgeven voor projecten in de categorie duurzaam bouwen, waarbij, indien hout wordt toegepast,
      uitsluitend gebruik wordt gemaakt van duurzaam geproduceerd hout, en die zijn gericht op:

      a. het realiseren van nieuw te bouwen woningen, waarvan het primair fossiel energiegebruik gelijk is aan 0;

      b. het door herbestemming van gebouwen zonder woonfunctie realiseren van nieuwe woningen, waarvan:

      1°. de energielabelklasse na de herbestemming energieklasse A of beter is; en

      2°. de geluidswering tussen de woningen onderling ten minste gelijk is aan het niveau dat voor nieuwbouwwoningen
      wordt voorgeschreven;

      c. het door herbestemming van gebouwen zonder woonfunctie en met de status van Rijks- of Gemeentemonument
      realiseren van nieuwe woningen, waarvan:

      1°. De energielabelklasse na herbestemming energieklasse B of beter is; en

      2°. de geluidswering tussen de woningen onderling ten minste gelijk is aan het niveau dat voor nieuwbouwwoningen
      wordt voorgeschreven;

      d. het renoveren van bestaande woningen door de eigenaar-bewoner, waarbij energiebesparende maatregelen worden
      toegepast, die leiden tot een verbetering van de energielabelklasse van de woning:

      1°. met ten minste twee energielabelklassen, waarbij de energielabelklasse van de woningen na renovatie
      energielabelklasse B of beter is;

      2°. met ten minste vier energielabelklassen, waarbij de energielabelklasse van de woningen na renovatie
      energielabelklasse B of beter is;

      3°. met ten minste vijf energielabelklassen, waarbij de energielabelklasse van de woningen na renovatie
      energielabelklasse A of beter is; of

      4°. tot energielabelklasse A++++;

      e. het renoveren van bestaande woningen door anderen dan de eigenaar-bewoner, waarbij energiebesparende maatregelen
      worden toegepast, die leiden tot een verbetering van de energielabelklasse van de woning als bedoeld in onderdeel
      d;

      f. het realiseren van duurzame utiliteitsgebouwen, waarvoor in het [Bouwbesluit][ref1] een energieprestatie-eis is
      opgenomen en die voldoen aan de voorschriften bedoeld in [bijlage 2][ref2] bij deze regeling en waarbij het primair
      fossiel energiegebruik van het gebouw gelijk is aan 0;

      g. het renoveren van bestaande utiliteitsgebouwen, waarvoor in het [Bouwbesluit][ref3] een energieprestatie-eis
      is opgenomen en die voldoen aan [bijlage 3][ref4] van deze regeling en waarbij de energielabelklasse na renovatie
      is verbeterd:

      1°. met ten minste twee energielabelklassen;

      2°. met ten minste vier energielabelklassen;

      3°. met ten minste zes energielabelklassen; of

      4°. tot energielabelklasse A++++;

      h. het realiseren van duurzame gebouwen met een industriefunctie, waarvoor in het [Bouwbesluit][ref5] voorschriften
      zijn gesteld voor de thermische isolatie, met uitzondering van gebouwen met een lichte industriefunctie, en
      waarvan:

      1°. de hemelwaterafvoer is afgekoppeld van het rioleringsstelsel; en

      2°. het primair fossiel energiegebruik kleiner is dan of gelijk is aan 0; of

      i. het renoveren van bestaande gebouwen met een industriefunctie, waarvoor in het [Bouwbesluit][ref6] voorschriften
      zijn gesteld voor de thermische isolatie, met uitzondering van gebouwen met een lichte industriefunctie, en waarvan
      het primair fossiel energiegebruik kleiner is dan of gelijk is aan 0.


      [ref1]: https://wetten.overheid.nl/BWBR0030461
      [ref2]: https://wetten.overheid.nl/BWBR0037778
