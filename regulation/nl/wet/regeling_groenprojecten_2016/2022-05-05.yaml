      10 Ter zake van een project als bedoeld in [artikel 9, aanhef en onderdeel f][ref12], komt voor een groenverklaring
      in aanmerking een bedrag van ten hoogste € 1.000 per vierkante meter bruto vloeroppervlak voor projecten die
      voldoen aan de eisen, bedoeld in artikel 9, onderdeel f.

      11 Ter zake van een project met betrekking tot een utiliteitsgebouw als bedoeld in [artikel 9, onderdeel g][ref13],
      komt voor een groenverklaring in aanmerking:

      a. maximaal € 300 per vierkante meter bruto vloeroppervlak indien het project voldoet aan de energieprestatie
      bedoeld in [artikel 9, onderdeel g, onder 1°][ref14], of maximaal € 450 per vierkante meter bruto vloeroppervlak
      indien het project tevens is aangewezen als Rijks- of Gemeentemonument;

      b. maximaal € 450 per vierkante meter bruto vloeroppervlak indien het project voldoet aan de energieprestatie
      bedoeld in [artikel 9, onderdeel g, onder 2°][ref15], of maximaal € 600 per vierkante meter bruto vloeroppervlak
      indien het project tevens is aangewezen als Rijks- of Gemeentemonument;

      c. maximaal € 600 per vierkante meter bruto vloeroppervlak indien het project voldoet aan de energieprestatie
      bedoeld in [artikel 9, onderdeel g, onder 3°][ref16], of maximaal € 750 per vierkante meter bruto vloeroppervlak
      indien het project tevens is aangewezen als Rijks- of Gemeentemonument; of

      d. maximaal € 750 per vierkante meter bruto vloeroppervlak indien het project voldoet aan de energieprestatie
      bedoeld in [artikel 9, onderdeel g, onder 4°][ref17], of maximaal € 1.000 per vierkante meter bruto vloeroppervlak
      indien het project tevens is aangewezen als Rijks- of Gemeentemonument.

      12 Ter zake van een project met betrekking tot een gebouw met een industriefunctie als bedoeld in
      [artikel 9, onderdeel h][ref18], komt voor een groenverklaring in aanmerking een bedrag van ten hoogste € 400 per
      vierkante meter bruto vloeroppervlak.

      13 Ter zake van een project met betrekking tot een gebouw met een industriefunctie als bedoeld in
      [artikel 9, onderdeel i][ref19], komt voor een groenverklaring in aanmerking een bedrag van ten hoogste € 300 per
      vierkante meter bruto vloeroppervlak.

      14 Voor projecten als bedoeld in [artikel 10, aanhef en onderdeel b, onder 1°][ref20], wordt de groenverklaring
      beperkt tot 50% van het projectvermogen.

      15 Voor projecten als bedoeld in [artikel 10, aanhef en onderdeel b, onder 2°][ref21], wordt de groenverklaring
      beperkt tot 15% van het projectvermogen of, indien tevens een rompoptimalisatieonderzoek is uitgevoerd, tot 20% van
      het projectvermogen.

      16 Indien het projectvermogen het bedrag van 35.000.000 te boven gaat, kan de Minister van Infrastructuur en
      Waterstaat het projectvermogen beperken tot € 35.000.000.

      17 Ter zake van een project als bedoeld in [artikel 3, aanhef en onderdelen a en b][ref22], komt voor
      een groenverklaring in aanmerking een bedrag dat is gemoeid met de verwerving van grond, voor zover dit
      het bedrag dat voortvloeit uit de toepassing van artikel 14, zesde lid, onderdeel a, van de Landbouw
      Groepsvrijstellingsverordening overschrijdt en tot een maximum dat op grond van de de-minimisverordening landbouw
      is toegestaan.


