  - number: '19'
    text: |-
      1 De Minister van Infrastructuur en Waterstaat kan, in overeenstemming met de Minister van Financiën en na overleg
      met de Minister van Economische Zaken en Klimaat en de Minister van Landbouw, Natuur en Voedselkwaliteit, de
      groenverklaring intrekken indien:

      a. de ter zake verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de aanvraag een andere beslissing
      zou zijn genomen als bij de beoordeling daarvan de juiste of volledige gegevens bekend waren geweest;

      b. blijkt dat de uitvoering van het project in aanzienlijke mate afwijkt van de projectbeschrijving op grond
      waarvan de groenverklaring is afgegeven;

      c. blijkt dat de projectbeheerder de vermogenstoestand van het project niet afzonderlijk administreert;

      d. niet wordt voldaan aan de voorschriften die in de groenverklaring zijn opgenomen; of

      e. de melding, bedoeld in [artikel 20][ref1], niet onverwijld is geschied.

      2 Het besluit tot intrekking kan terugwerkende kracht hebben.

      3 Het besluit tot intrekking wordt gezonden aan de aanvrager. Een afschrift van het besluit wordt gezonden aan de
      projectbeheerder en aan de inspecteur van de Belastingdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0037778#Artikel20
    url: https://wetten.overheid.nl/BWBR0037778/2022-05-05#Artikel19
