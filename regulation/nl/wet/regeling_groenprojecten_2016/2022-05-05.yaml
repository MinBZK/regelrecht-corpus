      1 De groenverklaring geldt ten hoogste voor de levensduur van een project, maar niet langer dan:

      a. tien jaren;

      b. tot en met 31 december 2021 indien de groenverklaring een project betreft als bedoeld in
      [artikel 2, eerste lid, aanhef en onderdeel f][ref1];

      c. vijf jaren indien de groenverklaring een project betreft als bedoeld in
      [artikel 3, aanhef en onderdeel c][ref2]; of

      d. vijftien jaren, indien de groenverklaring een project betreft als bedoeld in
      [artikel 7, aanhef en onderdelen d of e][ref3], of [artikel 8, aanhef en onderdeel a][ref4], dat wordt uitgevoerd
      op of aan een woning en voor rekening en risico van de eigenaar-bewoner.

      2 De groenverklaring treedt maximaal negen maanden na de afgifte hiervan in werking.

      3 De groenverklaring vermeldt de aard van het project, het projectvermogen, de datum waarop de groenverklaring in
      werking treedt en de periode waarvoor de groenverklaring geldt.

      4 De groenverklaring voor een project als bedoeld in
      [artikel 2, eerste lid, aanhef en onderdelen a, b, g en h][ref5], vervalt indien binnen twee jaar na de dag van
      afgifte hiervan geen aanvang is gemaakt met de uitvoering van de werkzaamheden.

      5 In de groenverklaring kunnen nadere voorschriften worden opgenomen.


