        bwb_id: BWBR0011353
        artikel: '5.14'
  - number: '14'
    text: |-
      1 De Minister van Infrastructuur en Waterstaat beslist, in overeenstemming met de Minister van Financiën en na
      overleg met de Minister van Economische Zaken en Klimaat en de Minister van Landbouw, Natuur en Voedselkwaliteit,
      op een volledige aanvraag binnen acht weken na de indiening ervan.

      2 Een volledige aanvraag is een aanvraag waarbij geen aanvullende informatie nodig is voor de beoordeling ervan.

      3 Een afschrift van het besluit wordt gezonden aan de projectbeheerder.
    url: https://wetten.overheid.nl/BWBR0037778/2022-05-05#Artikel14
  - number: '15'
    text: |-
      1 Een groenverklaring wordt in ieder geval niet afgegeven op aanvragen voor:

      a. bestaande projecten;

      b. projecten waarvoor reeds een groenverklaring is verstrekt;

      c. projecten in de landbouwsector die niet worden uitgevoerd door een kmo;

      d. projecten die niet voldoen aan de vereisten die zijn gesteld in de Algemene Groepsvrijstellingsverordening dan
      wel in de Landbouw Groepsvrijstellingsverordening;

      e. projecten waarvan het projectvermogen minder bedraagt dan € 25.000, tenzij het projecten betreft als bedoeld in
      de [artikelen 7, aanhef en onderdelen d en e][ref1] en [8, aanhef en onderdeel a][ref2], welke worden uitgevoerd op
      of aan een woning en voor rekening en risico van de eigenaar-bewoner;

      f. projecten als bedoeld in [artikel 2, eerste lid, aanhef en onderdelen a, b en c][ref3], indien de steun meer
      bedraagt dan € 1.000.000 per onderneming;

      g. projecten als bedoeld in de [artikelen 2, eerste lid, aanhef en onderdelen d, e en f][ref4], [3][ref5],
      [4][ref6], [11, aanhef en onderdeel b][ref7], en [12, aanhef en onderdeel d][ref8], indien het bruto-subsidie-
      equivalent meer bedraagt dan € 500.000 per onderneming per investeringsproject;

      h. projecten als bedoeld in [artikel 3, aanhef en onderdeel c][ref9], indien het bruto-subsidie-equivalent meer
      bedraagt dan € 3.000 per jaar per onderneming;

      i. projecten als bedoeld in de [artikelen 5][ref10], [6][ref11], [7][ref12],
      [8, aanhef en onderdelen a, b, c en f][ref13], [9][ref14], [10, aanhef en onderdeel b][ref15],
      [11, aanhef en onderdeel a, onder 2° en onderdeel c, onder 3° tot en met 6°][ref16], en
      [12, aanhef en onderdelen a, b en c][ref17], indien de steun meer bedraagt dan € 15.000.000 per onderneming per
      investeringsproject;

      j. projecten als bedoeld in [artikel 8, aanhef en onderdeel e][ref18], indien de steun meer bedraagt dan
      € 20.000.000 per onderneming per investeringsproject;

      k. projecten waarvoor, vanwege toekenning van een financieel of ander voordeel door de overheid of de Europese
      Commissie uit dezen en anderen hoofde dan op grond van deze regeling, een zodanig voordeel ontstaat dat dit het
      totale toegestane voordeel op grond van regelgeving van de Europese Unie zou overschrijden;

      l. projecten waarvan het niet aannemelijk is dat het enig eigen rendement heeft, subsidies van overheden daaronder
      begrepen;

      m. projecten waarvan het te verwachten economische rendement van het project in verhouding tot het risico zodanig
      is dat het zonder toepassing van de regeling tot stand kan komen;

      n. investeringen door een onderneming ten aanzien waarvan een bevel tot terugvordering uitstaat, overeenkomstig
      artikel 1, vierde lid, onderdelen a en b, van de Algemene Groepsvrijstellingsverordening of artikel 1, vijfde lid,
      van de Landbouw Groepsvrijstellingsverordening; of

      o. investeringen door een onderneming in moeilijkheden, overeenkomstig artikel 1, vierde lid, onderdeel c, van de
      Algemene Groepsvrijstellingsverordening of artikel 1, zesde lid, van de Landbouw Groepsvrijstellingsverordening.

      2 Een groenverklaring wordt niet afgegeven voor projecten als bedoeld in de [artikelen 6, onderdeel c][ref19],
      [9, onderdelen h en i][ref20], en [12][ref21], waarvoor reeds voor de inwerkingtreding van deze regeling met de
      uitvoering van de werkzaamheden is aangevangen en waarvoor binnen zes maanden na inwerkingtreding van deze regeling
      een groenverklaring wordt aangevraagd.

      3 Een groenverklaring wordt niet afgegeven indien de aanvrager, na daartoe een verzoek ontvangen te hebben, niet
      binnen de gestelde termijn de gegevens verstrekt die van belang kunnen zijn voor de beoordeling van het project.

      4 Het eerste lid, onderdeel d, is niet van toepassing op een aanvraag op grond van
      [artikel 3, aanhef en onderdelen a en b][ref22], voor zover dat deel van de aanvraag voldoet aan de vereisten van
      de de-minimisverordening landbouw.


