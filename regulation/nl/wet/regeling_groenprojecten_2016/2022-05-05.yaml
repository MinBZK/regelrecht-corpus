      De Minister van Infrastructuur en Waterstaat kan, in overeenstemming met de Minister van Financiën en na overleg
      met de Minister van Economische Zaken en Klimaat en de Minister van Landbouw, Natuur en Voedselkwaliteit, een
      groenverklaring afgeven voor projecten in de categorie biologische landbouw, die zijn gericht op:

      a. het produceren of verwerken van biologische plantaardige landbouwproducten overeenkomstig het
      [Landbouwkwaliteitsbesluit 2007][ref1];

      b. het produceren of verwerken van biologische dierlijke landbouwproducten overeenkomstig het
      [Besluit dierlijke producten][ref2]; of

      c. deelname van producenten van landbouwproducten aan de kwaliteitsregeling in de zin van [Verordening (EU)
      2018/848](32748R2018) van het Europees Parlement en de Raad van 30 mei 2018 inzake de biologische productie en de
      etikettering van biologische producten en tot intrekking van Verordening (EG) nr. 834/2007 van de Raad (PbEU 2018,
      L 150).


