  - number: '9.2'
    text: Er is een Managementteam Douane.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.2.a
    text: |-
      Het Managementteam Douane is verantwoordelijk voor het realiseren van de doelen en de uitvoering van taken en
      opdrachten en geeft richting aan de sturing van het DGD, waarbij de DGD eindverantwoordelijkheid draagt.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.2.b
    text: |-
      Het Managementteam Douane bestaat uit de DGD (voorzitter), de directeuren genoemd in het eerste lid, onder a tot en
      met e, en het hoofd, genoemd in het eerste lid, onder g.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.2.c
    text: |-
      De hoofden genoemd in het eerste lid, onder h tot en met j, maken geen deel uit van het Managementteam Douane.
      Zij ontvangen de stukken, kunnen agendapunten aandragen voor het Managementteam Douane en kunnen deelnemen aan de
      besprekingen, voor zover agendapunten hun werkterrein raken.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: '9.3'
    text: Twee van de in het tweede lid, onder b, genoemde directeuren vervullen tevens de rol van plaatsvervangend DGD.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: '10.1'
    text: |-
      De directie Juridische Zaken (DJZ) van het Ministerie van Financiën heeft tot taak het voorbereiden van regelgeving
      op het gebied van het Organisatiebesluit en het [Mandaatbesluit Directoraten-Generaal Belastingdienst, Toeslagen en
      Douane](onbekend).
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel10
  - number: '10.2'
    text: |-
      De DGBD, de DGTSL en de DGD, ieder voor zover het hen aangaat, zijn verantwoordelijk voor een juiste, volledige en
      tijdige aanlevering aan de directie Juridische Zaken van de gegevens die een goed beheer van dit besluit mogelijk
      maken.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel10
  - number: '10.3'
    text: |-
      Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel10
  - number: '11'
    text: |-
      Het [Organisatiebesluit Directoraat-Generaal Belastingdienst 2020][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0041509
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0041509
  - number: '12'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij wordt
      geplaatst, en werkt zij terug tot en met 1 januari 2021.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel12
  - number: '13'
    text: |-
      Dit besluit wordt aangehaald als: Organisatiebesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane
      2021.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel13
