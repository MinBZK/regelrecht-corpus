preamble:
  text: |-
    Gelet op hoofdstuk 5, 5A en 5B van het Organisatiebesluit Ministerie van Financiën 2020 en op het Mandaatbesluit
    Ministerie van Financiën 2020,

    en gelet op artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011;

    Besluit vast te stellen het navolgende Organisatiebesluit:
  url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel1
  - number: 1.a
    text: '*het ministerie:* het Ministerie van Financiën;'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel1
  - number: 1.b
    text: '*het DGBD:* het Directoraat-Generaal Belastingdienst;'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel1
  - number: 1.c
    text: '*het DGTSL:* het Directoraat-Generaal Toeslagen;'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel1
  - number: 1.d
    text: '*het DGD:* het Directoraat-Generaal Douane;'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel1
  - number: 1.e
    text: '*de minister:* de Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel1
  - number: 1.f
    text: '*de staatssecretaris:* de Staatssecretaris van Financiën;'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel1
  - number: 1.g
    text: |-
      *algemene leiding DGBD:* de directeur-generaal Belastingdienst (de DGBD) en/of de plaatsvervangend directeur-
      generaal Belastingdienst (pDGBD);
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel1
  - number: 1.h
    text: '*algemene leiding DGTSL:* de directeur-generaal Toeslagen (de DGTSL) en/of diens plaatsvervanger;'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel1
  - number: 1.i
    text: '*algemene leiding DGD:* de directeur-generaal Douane (de DGD) en/of diens plaatsvervanger;'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel1
  - number: 1.j
    text: |-
      *directeuren van de topstructuur DGBD:* algemeen directeuren van het DGBD, (hoofd)directeuren van concerndirecties,
      shared service organisaties (SSO) of corporate diensten van het DGBD; en
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel1
  - number: 1.k
    text: |-
      *bedrijfsvoering:* onderwerpen op de terreinen van personeel en organisatie, informatievoorziening en ict, inkoop,
      huisvesting, facilitaire zaken en beveiliging.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel1
  - number: '2'
    text: 'De volgende dienstonderdelen van het Ministerie van Financiën vormen samen de Belastingdienst:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel2
  - number: 2.a
    text: het Directoraat-Generaal Belastingdienst (DGBD);
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel2
  - number: 2.b
    text: het Directoraat-Generaal Toeslagen (DGTSL);
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel2
  - number: 2.c
    text: het Directoraat-Generaal Douane (DGD).
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel2
  - number: '3'
    text: Het Directoraat-Generaal Belastingdienst staat onder leiding van de directeur-generaal Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel3
  - number: '4'
    text: 'Het DGBD bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.a
    text: 'de volgende directies:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.a.i
    text: de directie Bestuurlijke en Politieke Zaken (BPZ);
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.a.ii
    text: de directie Organisatie en Personeel;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.b
    text: 'de volgende uitvoeringsdirecties:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.b.i
    text: de directie Fiscale Inlichtingen- en Opsporingsdienst (FIOD);
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.b.ii
    text: de directie Particulieren;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.b.iii
    text: de directie Midden- en Kleinbedrijf;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.b.iv
    text: de directie Grote Ondernemingen;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.b.v
    text: de directie Centrale Administratieve Processen;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.b.vi
    text: de directie Klantinteractie en -services;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.b.vii
    text: de directie Informatievoorziening;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.c
    text: '**** de volgende concerndirecties:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.c.i
    text: de concerndirectie Fiscale en Juridische Zaken;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.c.ii
    text: de concerndirectie Uitvoerings- en Handhavingsbeleid;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.c.iii
    text: de concerndirectie Informatievoorziening- en Databeheersing;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.c.iv
    text: de concerndirectie Innovatie en Strategie;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.c.v
    text: de concerndirectie Control en Financiën;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.d
    text: 'de volgende corporate diensten en shared service organisaties (SSO):'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.d.i
    text: de corporate dienst Vaktechniek;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.d.ii
    text: de corporate dienst Datafundamenten en Analyse;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.d.iii
    text: de corporate dienst Communicatie;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.d.iv
    text: de SSO Financieel en Managementinformatie;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.d.v
    text: de SSO Facilitaire Dienstverlening;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: 4.e
    text: de tijdelijke programmadirectie Buitengewone Zaken Blauw.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel4
  - number: '5.1'
    text: Er is een directieteam DGBD.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: 5.1.a
    text: 'Het directieteam overlegt regelmatig over:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: 5.1.a.i
    text: |-
      de hoofdlijnen van beleidsontwikkeling en -uitvoering van het DGBD en geeft richting en sturing aan het DGBD,
      waarbij de DGBD de eindverantwoordelijkheid draagt;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: 5.1.a.ii
    text: 'de richting en aansturing van:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: 5.1.a.ii.1
    text: het primaire proces/de uitvoering;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: 5.1.a.ii.2
    text: de controlfunctie; en
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: 5.1.a.ii.3
    text: de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: 5.1.a.iii
    text: de beleidscyclus; en
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: 5.1.a.iv
    text: |-
      besluitvorming over kaderstelling (vaststellen op welke wijze rijksbrede en departementale kaders voor het DGBD
      worden vertaald naar uitvoeringsbeleid en implementatie).
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: 5.1.b
    text: 'Deelnemers aan het directieteam zijn:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: 5.1.b.i
    text: |-
      de DGBD (voorzitter), de pDGBD, alle algemeen directeuren primair proces van het DGBD, hoofddirecteur Control &
      Financiën, hoofddirecteur Fiscale en Juridische Zaken, directeur Uitvoerings- en Handhavingsbeleid en de directeur
      Organisatie en Personeel;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: 5.1.b.ii
    text: 'Agendalid en standing invitation: overige directeuren van de concerndirecties;'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: 5.1.b.iii
    text: 'Agendalid: directeuren ressorterend onder de pDGBD.'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: '5.2'
    text: Er is een concernstaf.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: 5.2.a
    text: |-
      De concernstaf overlegt regelmatig over de richting en aansturing van de concerndirecties en het bevorderen van
      synergie.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: 5.2.b
    text: |-
      Deelnemers aan de concernstaf zijn de DGBD (voorzitter), de pDGBD, directeur Control & Financiën,
      (hoofd)directeuren concerndirecties.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: '5.3'
    text: Er is een pDG-staf.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: 5.3.a
    text: De pDG-staf overlegt regelmatig over de richting en aansturing van de Corporate Diensten/SSO’s.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: 5.3.b
    text: |-
      Deelnemers aan de pDG-staf zijn de pDGBD (voorzitter), alle directeuren Corporate Diensten/SSO’s, directeur
      investeringsagenda, controller.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel5
  - number: '6'
    text: Het Directoraat-Generaal Toeslagen staat onder leiding van de directeur-generaal Toeslagen.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel6
  - number: '7'
    text: 'Het Directoraat-Generaal Toeslagen bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7
  - number: 7.a
    text: de directie Toeslagen;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7
  - number: 7.b
    text: de tijdelijke directie Uitvoeringsorganisatie Herstel Toeslagen;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7
  - number: 7.c
    text: de directie Strategie, Recht & Beleid;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7
  - number: 7.d
    text: de directie Mensen, Middelen & Communicatie;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7
  - number: 7.e
    text: de directie Informatiestromen & Digitale Ontwikkeling;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7
  - number: 7.f
    text: de directie Control & Risk;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7
  - number: 7.g
    text: de directie Business Ontwikkeling;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7
  - number: 7.h
    text: het Bureau DG.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7
  - number: 7a.1
    text: De directie Toeslagen staat onder leiding van een algemeen directeur.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.2
    text: 'De directie Toeslagen heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.2.a
    text: het juist, tijdig en rechtmatig toekennen van toeslagen, die niet (semi)automatisch gedaan kunnen worden;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.2.b
    text: het waarmaken van de geformuleerde beloftes richting toeslaggerechtigden;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.2.c
    text: |-
      het (dagelijks) managen van de eigen operatie door het organiseren van het reguliere werk, het reageren op
      verstoringen en problemen en het zorgen voor kwaliteitsbeheersing, voorraadbeheer en capaciteitsmanagement;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.2.d
    text: |-
      het (systematisch) zoeken naar mogelijkheden om bestaande processen structureel te verbeteren en vernieuwen om te
      komen tot een optimale uitvoering;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.2.e
    text: |-
      in samenspraak met het directoraat-generaal Belastingdienst/FIOD en Functioneel Parket signalen van oneigenlijk
      gebruik en misbruik in de strafrechtketen brengen.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.3
    text: 'De directie Toeslagen bestaat uit de volgende subdirecties en afdelingen:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.3.a
    text: |-
      de Afdeling Vaktechniek en Directieondersteuning, die onder leiding staat van een afdelingshoofd en die is
      onderverdeeld in teams, die elk onder leiding staat van een teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.3.b
    text: |-
      de Afdeling Support, die onder leiding staat van een afdelingshoofd en die is onderverdeeld in teams, die elk onder
      leiding staat van een teamleider, en het Programmamanagementbureau;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.3.c
    text: |-
      de subdirectie Interactie en Dienstverlening, die onder leiding staat van een directeur en die bestaat uit de
      volgende afdelingen:
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.3.c.i
    text: |-
      de afdeling Burgerinteractie & Dienstverlening, die onder leiding staat van een afdelingshoofd en die is
      onderverdeeld in teams, die elk onder leiding staat van een teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.3.c.ii
    text: de afdeling Digitaal, die onder leiding staat van een afdelingshoofd;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.3.c.iii
    text: |-
      de afdeling Telefonie, die onder leiding staat van een afdelingshoofd en die is onderverdeeld in teams, die elk
      onder leiding staat van een teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.3.d
    text: 'de subdirectie Operatie, die onder leiding staat van een directeur en die bestaat uit de volgende afdelingen:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.3.d.i
    text: |-
      de afdeling Operatieregie, die onder leiding staat van een afdelingshoofd en die is onderverdeeld in teams, die elk
      onder leiding staat van een teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.3.d.ii
    text: |-
      de afdeling Uitval/Uitworp, die onder leiding staat van een afdelingshoofd en die is onderverdeeld in teams, die
      elk onder leiding staat van een teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.3.d.iii
    text: |-
      de afdeling Massaal Proces, die onder leiding staat van een afdelingshoofd en die is onderverdeeld in teams, die
      elk onder leiding staat van een teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.3.d.iv
    text: |-
      de afdeling Toezicht, die onder leiding staat van een afdelingshoofd en die is onderverdeeld in teams, die elk
      onder leiding staat van een teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.3.d.v
    text: |-
      de afdeling Bezwaar & Beroep, die onder leiding staat van een afdelingshoofd en die is onderverdeeld in teams, die
      elk onder leiding staat van een teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.3.d.vi
    text: |-
      de afdeling Vraag & Objectadministratie, die onder leiding staat van een afdelingshoofd en die is onderverdeeld in
      teams, die elk onder leiding staat van een teamleider.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7a.4
    text: Een van de directeuren, bedoeld in het derde lid, vervult tevens de rol van plaatsvervangend algemeen directeur.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7a
  - number: 7b.1
    text: De directie Uitvoeringsorganisatie Herstel Toeslagen staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7b
  - number: 7b.2
    text: 'De directie Uitvoeringsorganisatie Herstel Toeslagen heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7b
  - number: 7b.2.a
    text: het toekennen van herstelregelingen;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7b
  - number: 7b.2.b
    text: het afhandelen van alle verzoeken die verband houden of kunnen houden met de toekenning van herstelregelingen;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7b
  - number: 7b.2.c
    text: het waarmaken van de geformuleerde beloftes richting gedupeerden;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7b
  - number: 7b.2.d
    text: |-
      het (dagelijks) managen van de eigen operatie door het organiseren van het reguliere werk, het reageren op
      verstoringen en problemen en het zorgen voor kwaliteitsbeheersing, voorraadbeheer en capaciteitsmanagement;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7b
  - number: 7b.2.e
    text: |-
      het (systematisch) zoeken naar mogelijkheden om bestaande processen structureel te verbeteren en vernieuwen om te
      komen tot een optimale uitvoering.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7b
  - number: 7b.3
    text: 'De directie Uitvoeringsorganisatie Herstel Toeslagen bestaat uit de volgende clusters:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7b
  - number: 7b.3.a
    text: Cluster Staf, dat onder leiding staat van een clusterdirecteur;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7b
  - number: 7b.3.b
    text: Cluster Service, dat onder leiding staat van een clustermanager;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7b
  - number: 7b.3.c
    text: Cluster Kinderopvangtoeslag, dat onder leiding staat van een clusterdirecteur;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7b
  - number: 7b.3.d
    text: Cluster Nieuwe Regelingen, dat onder leiding staat van een programmadirecteur;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7b
  - number: 7b.3.e
    text: Cluster Bezwaar, Beroep en Ingebrekestellingen & Werkelijke Schade, dat onder leiding staat van een clustermanager;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7b
  - number: 7b.3.f
    text: Programma Human Resources, dat onder leiding staat van een programmadirecteur.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7b
  - number: 7b.4
    text: |-
      De clusterdirecteur, bedoeld in het derde lid, onder a, is tevens de plaatsvervangend directeur van de directie
      Uitvoeringsorganisatie Herstel Toeslagen.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7b
  - number: 7b.5
    text: |-
      De clusterdirecteuren, de clustermanagers en de programmadirecteuren, bedoeld in het derde
      en vierde lid, worden in hun mandaat gelijkgesteld aan afdelingshoofden in de zin van het
      [Mandaatbesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045078
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0045078
  - number: 7c.1
    text: |-
      De directie Strategie, Recht & Beleid staat onder leiding van een directeur, tevens plaatsvervangend directeur-
      generaal Toeslagen.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7c
  - number: 7c.2
    text: 'De directie Strategie Recht & Beleid heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7c
  - number: 7c.2.a
    text: |-
      bijdragen aan een toeslagenbeleid dat tegemoet komt aan de behoeften van toeslaggerechtigden, goed uitvoerbaar is
      en aansluit bij de wet en algemene rechtsbeginselen;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7c
  - number: 7c.2.b
    text: het namens de directeur-generaal vervullen van de rol van opdrachtnemer voor de opdrachtgevers;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7c
  - number: 7c.2.c
    text: |-
      het als kaderstellende directie samen met de uitvoerende directies vertalen van besluiten naar uitvoeringskaders en
      het bewaken van de eenheid van beleid en uitvoering;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7c
  - number: 7c.2.d
    text: |-
      het coördineren van de inhoudelijke bijdrage van het directoraat-generaal aan het parlementaire proces, waaronder
      de regievoering op het schrijven van Kamerbrieven en het beantwoorden van Kamervragen namens het directoraat-
      generaal.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7c
  - number: 7c.3
    text: 'De directie Strategie, Recht & Beleid bestaat uit de volgende afdelingen:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7c
  - number: 7c.3.a
    text: de afdeling Strategie, Toekomst & Herstel, dat onder leiding staat van een afdelingshoofd;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7c
  - number: 7c.3.b
    text: de afdeling Juridische Zaken en Vaktechniek, dat onder leiding staat van een afdelingshoofd;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7c
  - number: 7c.3.c
    text: de afdeling Uitvoeringsbeleid, dat onder leiding staat van een afdelingshoofd.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7c
  - number: 7c.4
    text: Een van de afdelingshoofden, bedoeld in het derde lid, vervult tevens de rol van plaatsvervangend directeur.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7c
  - number: 7d.1
    text: De directie Mensen, Middelen & Communicatie staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.2
    text: 'De directie Mensen, Middelen & Communicatie:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.2.a
    text: |-
      ondersteunt de directeur-generaal Toeslagen bij alle verantwoordelijkheden op het vlak van bedrijfsvoering om zo
      bij te dragen aan het realiseren van de inrichtings-, uitvoerings- en ontwikkelopgave van het directoraat-generaal
      Toeslagen; en
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.2.b
    text: 'is daartoe kaderstellend en ondersteunend en heeft daarbij de volgende taakgebieden:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.2.b.i
    text: Personeel;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.2.b.ii
    text: Organisatieontwikkeling;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.2.b.iii
    text: Communicatie;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.2.b.iv
    text: Huisvesting;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.2.b.v
    text: Informatiehuishouding en informatiebeheer;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.2.b.vi
    text: Integrale veiligheid;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.2.b.vii
    text: Planning & Control, HR-control/formatiebeheer en interne beheersing;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.2.b.viii
    text: Inkoop.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.3
    text: 'De directie Mensen, Middelen & Communicatie bestaat uit de volgende afdelingen:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.3.a
    text: |-
      de afdeling Mensen, die onder leiding staat van een afdelingshoofd en is onderverdeeld in een aantal
      clusters, waarvan cluster HR Advies en Realisatie onder leiding staat van een manager, tevens plaatsvervangend
      afdelingshoofd;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.3.b
    text: |-
      de afdeling Middelen, die onder leiding staat van een afdelingshoofd en is onderverdeeld in een aantal clusters,
      waarvan cluster Bedrijfsvoering onder leiding staat van een manager, tevens plaatsvervangend afdelingshoofd;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.3.c
    text: |-
      de afdeling Communicatie, die onder leiding staat van een afdelingshoofd en is onderverdeeld in een aantal
      clusters, die elk onder leiding staat van een manager, waarvan één tevens de rol heeft van plaatsvervangend
      afdelingshoofd.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.4
    text: |-
      Het afdelingshoofd Mensen, bedoeld in het derde lid, onderdeel a, vervult tevens de rol van plaatsvervangend
      directeur.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
  - number: 7d.5
    text: |-
      De managers, bedoeld in het derde lid, worden in hun mandaat gelijkgesteld aan teamleiders in de zin van het
      [Mandaatbesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045078
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0045078
  - number: 7e.1
    text: |-
      De directie Informatiestromen & Digitale Ontwikkeling staat onder leiding van een directeur, tevens Chief
      Information Officer van Dienst Toeslagen.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7e
  - number: 7e.2
    text: De directie Informatiestromen & Digitale Ontwikkeling heeft de taken behorende bij de CIO-Office.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7e
  - number: 7e.3
    text: 'De directie Informatiestromen & Digitale Ontwikkeling bestaat uit de volgende afdelingen:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7e
  - number: 7e.3.a
    text: de afdeling Product en Porfolio, dat onder leiding staat van een afdelingshoofd;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7e
  - number: 7e.3.b
    text: de afdeling Architectuur en Strategie, dat onder leiding staat van een afdelingshoofd; en
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7e
  - number: 7e.3.c
    text: de afdeling Bureau CIO, dat onder leiding staat van een afdelingshoofd.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7e
  - number: 7e.4
    text: |-
      Het afdelingshoofd van Bureau CIO, bedoeld in het derde lid, onderdeel c, vervult tevens de rol van
      plaatsvervangend directeur.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7e
  - number: 7f.1
    text: De directie Control & Risk staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7f.2
    text: 'De directie Control & Risk heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7f.2.a
    text: het zelfstandig uitvoeren van de Toeslagenbrede (business en financiële) control;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7f.2.b
    text: het bewaken en het voeren van regie op de P&C-cyclus en bijdragen aan de departementale P&C-cyclus;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7f.2.c
    text: het bewaken van de rijksbrede en departementale kaders voor de financiën, control, financieel en materieel beheer;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7f.2.d
    text: |-
      onafhankelijk gevraagd en ongevraagd signaleren en adviseren (m.b.t. geld, formatie en bezetting, data en
      doelmatigheid);
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7f.2.e
    text: |-
      interne beheersing, coördinatie richting de Accountantsdienst Rijk en – via de directie Financieel-Economische
      Zaken – de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7f.2.f
    text: |-
      het ontwikkelen, beheren en monitoren van het geheel van de control frameworks en overige systemen voor de diverse
      vormen van control en kwaliteitsborging binnen het directoraat-generaal als geheel;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7f.2.g
    text: |-
      het opstellen van een integrale Strategische Risicoanalyse en de verdere borging van risicomanagement binnen het
      directoraat-generaal;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7f.2.h
    text: het beleggen van budgetverantwoordelijkheid;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7f.2.i
    text: |-
      ontwikkelen en beheren van normen voor inrichting van de AO/IC-organisatie, in samenwerking met de directie
      Financieel-Economische Zaken en directoraat-generaal/directie Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7f.2.j
    text: |-
      het afstemmen met de (concern)controller van het Ministerie van Financiën, de directie Financieel-Economische Zaken
      en het directoraat-generaal Belastingdienst/concerndirectie Control en Financiën.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7f.3
    text: |-
      De directie Control & Risk bestaat uit de volgende clusters die ieder onder functionele leiding staan van een
      clustercoördinator:
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7f.3.a
    text: het cluster DG-control;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7f.3.b
    text: het cluster DO-control;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7f.3.c
    text: het cluster Kennis Organisatie, Proces & Risk.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7f.4
    text: Een van de clustercoördinatoren vervult tevens de rol van plaatsvervangend directeur.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7f
  - number: 7g.1
    text: De directie Business Ontwikkeling staat onder leiding van een programmadirecteur.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7g
  - number: 7g.2
    text: |-
      De directie draagt de zorg voor integrale regie, samenhang en ondersteuning voor de ontwikkelopgaven van het
      directoraat-generaal en heeft daarbij de volgende hoofdtaken:
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7g
  - number: 7g.2.a
    text: |-
      het op basis van opdracht adviseren, aanjagen en ondersteunen bij de veranderopgaven van het directoraat-generaal,
      die project- of programmamatig worden opgepakt;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7g
  - number: 7g.2.b
    text: |-
      het – in opdracht – opzetten en aansturen van deze programma’s en projecten gericht op de verdere ontwikkeling van
      het directoraat-generaal’
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7g
  - number: 7g.2.c
    text: |-
      het voorzien in voldoende kwalitatief hoogwaardige interne capaciteit op het terrein van project- of
      programmamanagement om invulling te kunnen geven aan de projecten en programma’s voor het directoraat-generaal.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7g
  - number: 7h.1
    text: Het Bureau DG staat onder leiding van een afdelingshoofd.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7h
  - number: 7h.2
    text: 'Het Bureau DG heeft de volgende hoofdtaken:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7h
  - number: 7h.2.a
    text: Bestuursadvisering;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7h
  - number: 7h.2.b
    text: Procescoördinatie- en organisatie;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7h
  - number: 7h.2.c
    text: Bestuursondersteuning.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7h
  - number: 7h.3
    text: 'Het Bureau DG bestaat uit de volgende clusters:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7h
  - number: 7h.3.a
    text: het cluster Toeslagen Regulier, dat onder leiding staat van het afdelingshoofd;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7h
  - number: 7h.3.b
    text: het cluster Toeslagen Herstel, dat onder leiding staat van een teamleider.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7h
  - number: 7h.4
    text: De teamleider, bedoeld in het derde lid, onderdeel b, vervult tevens de rol van plaatsvervangend afdelingshoofd.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7h
  - number: 7h.5
    text: |-
      Het afdelingshoofd, bedoeld in het eerste en derde lid, onderdeel a, wordt
      in het mandaat gelijkgesteld aan een afdelingshoofd in de zin van het
      [Mandaatbesluit Directoraten-Generaal Belastingdienst, Toeslagen en Douane 2021][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045078
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel7h
    references:
      - id: ref1
        bwb_id: BWBR0045078
  - number: '8'
    text: Het Directoraat-Generaal Douane staat onder leiding van de directeur-generaal Douane.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel8
  - number: '9.1'
    text: 'Het DGD bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.1.a
    text: |-
      De directie Strategie, Beleid & Internationaal, die onder leiding staat van een directeur. Het onderdeel
      bestaat uit de volgende afdelingen, elk onder leiding van een afdelingshoofd, waarvan één tevens de rol van
      plaatsvervangend directeur vervult:
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.1.a.i
    text: Strategie, die is onderverdeeld in teams die elk onder leiding staan van het afdelingshoofd of een teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.1.a.ii
    text: Beleid, die is onderverdeeld in teams die elk onder leiding staan van het afdelingshoofd of een teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.1.a.iii
    text: Internationaal, die is onderverdeeld in teams die elk onder leiding staan van het afdelingshoofd of een teamleider.
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.1.b
    text: 'De directie Operaties, die onder leiding staat van een directeur. De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.1.b.i
    text: |-
      Bureau Operaties, dat onder leiding staat van de adjunct directeur Operaties. Het Bureau Operaties bestaat uit de
      volgende afdelingen, elk onder leiding van een afdelingshoofd:
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.1.b.i.a
    text: |-
      Strategie & Projecten, die is onderverdeeld in teams die elk onder leiding staan van het afdelingshoofd of een
      teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.1.b.i.b
    text: |-
      Domein & Operatie, die is onderverdeeld in teams die elk onder leiding staan van het afdelingshoofd of een
      teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.1.b.ii
    text: De acht regiokantoren;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.1.b.ii.a
    text: |-
      Regiokantoor Douane Amsterdam, dat onder leiding staat van een afdelingshoofd, een plaatsvervangend afdelingshoofd
      en een hoofd. Het onderdeel bestaat uit diverse teams, elk onder leiding van een teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.1.b.ii.b
    text: |-
      Regiokantoor Douane Arnhem, dat onder leiding staat van een afdelingshoofd en een plaatsvervangend afdelingshoofd.
      Het onderdeel bestaat uit diverse teams, elk onder leiding van een teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.1.b.ii.c
    text: |-
      Regiokantoor Douane Breda, dat onder leiding staat van een afdelingshoofd, een plaatsvervangend afdelingshoofd en
      een hoofd. Het onderdeel bestaat uit diverse teams, elk onder leiding van een teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.1.b.ii.d
    text: |-
      Regiokantoor Douane Eindhoven, dat onder leiding staat van een afdelingshoofd en een plaatsvervangend
      afdelingshoofd. Het onderdeel bestaat uit diverse teams, elk onder leiding van een teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.1.b.ii.e
    text: |-
      Regiokantoor Douane Groningen, dat onder leiding staat van een afdelingshoofd en een plaatsvervangend
      afdelingshoofd. Het onderdeel bestaat uit diverse teams, elk onder leiding van een teamleider;
    url: https://wetten.overheid.nl/BWBR0045076/2025-06-21#Artikel9
  - number: 9.1.b.ii.f
    text: |-
      Regiokantoor Douane Rotterdam Haven, dat onder leiding staat van een afdelingshoofd, een plaatsvervangend
