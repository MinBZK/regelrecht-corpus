articles:
  - number: '1'
    text: |-
      1 Indien buitengewone omstandigheden dit naar het oordeel van het Presidium noodzakelijk maken, kan het Presidium
      besluiten tijdelijk bezoekers de toegang tot het gebouw van de Kamer of in het bijzonder de tribunes te ontzeggen
      of deze toegang op andere wijze te beperken.

      2 Tijdens een periode waarin een maatregel als bedoeld in het eerste lid geldt, blijven genodigden en
      geaccrediteerde journalisten toegang tot het gebouw of de tribunes hebben, voor zover dit naar het oordeel van
      het Presidium verantwoord is. Het Presidium kan tevens toestaan dat andere bezoekers tot het gebouw of de tribunes
      worden toegelaten.

      3 Een maatregel als bedoeld in het eerste lid, kan voor de duur van ten hoogste drie maanden worden genomen en
      telkens worden verlengd, en wordt niet langer gehandhaafd dan door het Presidium noodzakelijk wordt geacht in
      verband met de buitengewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0040797/2020-03-13#Artikel1
  - number: '2'
    text: |-
      1 Het Presidium kan degene die een overtreding heeft begaan als bedoeld in
      [artikel 152, tweede of derde lid, van het Reglement van Orde van de Tweede Kamer][ref1] tijdelijk de toegang tot
      het gebouw van de Kamer of in het bijzonder de tribunes ontzeggen. De toegang kan slechts worden ontzegd indien
      naar het oordeel van het Presidium de overtreding de orde ernstig heeft verstoord en vrees bestaat voor een nieuwe
      verstoring van de orde.

      2 De in het eerste lid bedoelde ontzegging kan voor de duur van ten hoogste drie maanden worden vastgesteld en
      telkens worden verlengd, en wordt niet langer gehandhaafd dan door het Presidium noodzakelijk wordt geacht op basis
      van de overwegingen, bedoeld in het eerste lid, tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0006023#Artikel152
    url: https://wetten.overheid.nl/BWBR0040797/2020-03-13#Artikel2
