preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij het in overweging genomen hebben, dat het wenselijk is om de Wet inkomensvoorziening kunstenaars te
    wijzigen teneinde de toegang tot de Wet inkomensvoorziening kunstenaars voor een kunstenaar die over vermogen
    beschikt dat gebonden is in een door hem of zijn gezin bewoonde woning met bijbehorend erf te bevorderen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011462/2005-01-01#ArtikelAanhef
articles:
  - number: V
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011462/2005-01-01#ArtikelV
