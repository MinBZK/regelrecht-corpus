---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: instellingswet_autoriteit_consument_en_markt
regulatory_layer: WET
publication_date: '2021-01-14'
valid_from: '2013-04-01'
bwb_id: BWBR0033043
url: https://wetten.overheid.nl/BWBR0033043/2013-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om het toezicht op markten te stroomlijnen ter
    bevordering van de kwaliteit van het toezicht en de bescherming van het belang van de consument, en daarom regels
    te stellen die het toezicht zoveel mogelijk onderbrengen bij één onafhankelijke toezichthouder;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Autoriteit Consument en Markt:* de
      Autoriteit Consument en Markt, genoemd in [artikel 2, eerste lid][ref1];
        - *Onze Minister:* Onze Minister van Economische Zaken, Landbouw en Innovatie.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.1'
    text: Er is een Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel2
  - number: '2.2'
    text: De Autoriteit Consument en Markt is belast met de taken die haar bij of krachtens de wet zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel2
  - number: '3.1'
    text: De Autoriteit Consument en Markt bestaat uit ten minste drie en ten hoogste vijf leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel3
  - number: '3.2'
    text: |-
      Benoeming vindt plaats op grond van de deskundigheid die nodig is voor de uitoefening van de taken van de
      Autoriteit Consument en Markt alsmede op grond van maatschappelijke kennis en ervaring.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel3
  - number: '3.3'
    text: |-
      De voorzitter wordt benoemd voor een periode van zeven jaar en de overige leden worden benoemd voor een periode van
      vijf jaar. De voorzitter en de overige leden kunnen eenmaal worden herbenoemd voor eenzelfde periode.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel3
  - number: '3.4'
    text: |-
      In het geval van een vacature vormen de overblijvende leden voor een periode van ten hoogste negen maanden nadat de
      vacature is ontstaan de Autoriteit Consument en Markt, met de bevoegdheden van de voltallige Autoriteit Consument
      en Markt.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel3
  - number: '3.5'
    text: |-
      Onverminderd [artikel 13, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] heeft een lid geen
      financiële of andere belangen waardoor zijn onpartijdigheid in het geding kan zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel13
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '13'
  - number: '3.6'
    text: |-
      Onverminderd [artikel 12 van de Kaderwet zelfstandige bestuursorganen][ref1] maakt Onze Minister een besluit tot
      ontslag bekend door kennisgeving van de zakelijke inhoud van dat besluit in de Staatscourant. De redenen van het
      ontslag worden in die kennisgeving openbaar gemaakt indien de betrokkene daarom verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel12
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '12'
  - number: '4.1'
    text: De Autoriteit Consument en Markt stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel4
  - number: '4.2'
    text: |-
      De Autoriteit Consument en Markt maakt het bestuursreglement na de goedkeuring, bedoeld in
      [artikel 11 van de Kaderwet zelfstandige bestuursorganen][ref1], bekend in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel11
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '11'
  - number: '5.1'
    text: |-
      Onze Minister stelt ten behoeve van de uitvoering van de in [artikel 2, tweede lid][ref1], bedoelde taken,
      personeel ter beschikking van de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
        hoofdstuk: '2'
  - number: '5.2'
    text: De Autoriteit Consument en Markt stelt een mandaatregeling op ten aanzien van de bevoegdheden van het personeel.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel5
  - number: '5.3'
    text: |-
      De mandaatregeling behoeft de goedkeuring van Onze Minister. Onze Minister onthoudt zijn goedkeuring indien de
      mandaatregeling naar zijn oordeel een goede taakuitoefening door de Autoriteit Consument en Markt kan belemmeren.
      De mandaatregeling wordt na goedkeuring door de Autoriteit Consument en Markt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel5
  - number: '5.4'
    text: |-
      Indien Onze Minister van oordeel is dat de mandaatregeling een goede taakuitoefening belemmert, kan hij de
      Autoriteit Consument en Markt verzoeken de mandaatregeling te wijzigen.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel5
  - number: '5.5'
    text: |-
      Indien de Autoriteit Consument en Markt binnen dertien weken geen gevolg heeft gegeven aan een verzoek als bedoeld
      in het vierde lid kan Onze Minister de Autoriteit Consument en Markt opdragen de mandaatregeling op een door hem
      gewenste wijze aan te passen.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel5
  - number: '6.1'
    text: |-
      Onverminderd [artikel 18, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] bevat het jaarverslag een
      globale beschrijving van de ontwikkeling van de markt in de postsector en de telecommunicatiesector.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '6.2'
    text: |-
      Bij de toepassing van [artikel 18, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1] wordt het
      jaarverslag mede gezonden aan Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '6.3'
    text: |-
      Onze Minister zendt zo spoedig mogelijk zijn bevindingen omtrent het jaarverslag, alsmede de bevindingen van Onze
      Minister van Infrastructuur en Milieu, aan de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel6
  - number: '7.1'
    text: |-
      Gegevens of inlichtingen welke in verband met enige werkzaamheid ten behoeve van de uitvoering van een taak als
      bedoeld in [artikel 2, tweede lid][ref1], zijn verkregen mogen uitsluitend worden gebruikt voor de uitvoering van
      die taak of enige andere taak als bedoeld in artikel 2, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
        hoofdstuk: '2'
  - number: '7.2'
    text: |-
      Het eerste lid is niet van toepassing voor zover een wettelijk voorschrift het gebruik van verkregen gegevens of
      inlichtingen regelt.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel7
  - number: '7.3'
    text: |-
      In afwijking van het eerste lid is de Autoriteit Consument en Markt bevoegd gegevens of inlichtingen te verstrekken
      aan:
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel7
  - number: 7.3.a
    text: |-
      een bestuursorgaan, dienst, toezichthouder en andere persoon, belast met de opsporing van strafbare feiten,
      onderscheidenlijk het toezicht op de naleving van wettelijke voorschriften, indien bij regeling van Onze Minister
      is bepaald dat verstrekking noodzakelijk is voor de goede vervulling van een aan dat bestuursorgaan, die dienst,
      die toezichthouder of die andere persoon opgedragen taak,
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel7
  - number: 7.3.b
    text: |-
      een buitenlandse instelling, indien het gaat om gegevens of inlichtingen die van betekenis zijn of kunnen zijn voor
      de uitoefening van de taak van die buitenlandse instelling en die buitenlandse instelling op grond van nationale
      wettelijke regels is belast met de toepassing van regels op dezelfde gebieden als waarop de taken, bedoeld in
      [artikel 2, tweede lid][ref1], betrekking hebben, of


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
        hoofdstuk: '2'
  - number: 7.3.c
    text: |-
      degene op wie de gegevens of inlichtingen betrekking hebben voor zover deze gegevens of inlichtingen door of namens
      hem zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel7
  - number: '7.4'
    text: |-
      Verstrekking aan een bestuursorgaan, dienst, toezichthouder of andere persoon als bedoeld in het derde lid, onder
      a, of aan een in het derde lid, onder b, bedoelde buitenlandse instelling vindt uitsluitend plaats indien:
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel7
  - number: 7.4.a
    text: de geheimhouding van de gegevens of inlichtingen in voldoende mate is gewaarborgd, en
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel7
  - number: 7.4.b
    text: |-
      voldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel7
  - number: '8'
    text: |-
      Onze Minister kan nadere regels vaststellen over de in
      [artikel 20 van de Kaderwet zelfstandige bestuursorganen][ref1] bedoelde verstrekking van gegevens of inlichtingen
      van de Autoriteit Consument en Markt aan Onze Minister of Onze Minister van Infrastructuur en Milieu en nadere
      regels over de verstrekking van gegevens of inlichtingen door Onze Minister of Onze Minister van Infrastructuur en
      Milieu aan de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
  - number: '9.1'
    text: |-
      Onze Minister en Onze Minister van Infrastructuur en Milieu onthouden zich van instructies die op een individuele
      zaak betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel9
  - number: '9.2'
    text: |-
      De leden en het personeel van de Autoriteit Consument en Markt verlangen of ontvangen geen instructies die op een
      individuele zaak betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel9
  - number: '10.1'
    text: |-
      In afwijking van [artikel 22, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] kan Onze Minister of
      Onze Minister van Infrastructuur en Milieu een besluit van de Autoriteit Consument en Markt uitsluitend vernietigen
      indien het een besluit van algemene strekking betreft en de vernietiging geschiedt wegens onbevoegdheid van de
      Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '22'
  - number: '10.2'
    text: |-
      [Artikel 10:35 van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '11'
    text: |-
      Indien de Autoriteit Consument en Markt bij werkzaamheden ten behoeve van de uitvoering van een wet die valt onder
      de verantwoordelijkheid van Onze Minister van Infrastructuur en Milieu haar taak ernstig verwaarloost, treft Onze
      Minister de in [artikel 23, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] bedoelde voorzieningen
      na overleg met Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel23
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '23'
  - number: '12'
    text: |-
      Onze Minister stelt het verslag, bedoeld in
      [artikel 39, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], op na overleg met Onze Minister van
      Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel39
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '39'
  - number: '42.1'
    text: |-
      Besluiten van de raad van bestuur van de Nederlandse Mededingingsautoriteit, het college voor de post- en
      telecommunicatiemarkt of de Consumentenautoriteit worden na inwerkingtreding van [artikel 2][ref1] van deze wet
      aangemerkt als besluiten van de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
        hoofdstuk: '2'
  - number: '42.2'
    text: |-
      Aanvragen en bezwaarschriften, ingediend bij de Nederlandse Mededingingsautoriteit, het college voor de post- en
      telecommunicatiemarkt of de Consumentenautoriteit, worden na inwerkingtreding van [artikel 2][ref1] van deze wet
      aangemerkt als aanvragen en bezwaarschriften, ingediend bij de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
        hoofdstuk: '2'
  - number: '42.3'
    text: |-
      In bestuursrechtelijke rechtsgedingen treedt op het tijdstip van inwerkingtreding van [artikel 2][ref1] van deze
      wet de Autoriteit Consument en Markt in de plaats van de Nederlandse Mededingingsautoriteit, het college voor de
      post- en telecommunicatiemarkt of de Consumentenautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
        hoofdstuk: '2'
  - number: '42.4'
    text: |-
      In civielrechtelijke rechtsgedingen treedt op het tijdstip van inwerkingtreding van [artikel 2][ref1] van deze wet
      de Staat in de plaats van het college voor de post- en telecommunicatieautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
        hoofdstuk: '2'
  - number: '42.5'
    text: |-
      In overeenkomsten treedt op het tijdstip van inwerkingtreding van [artikel 2][ref1] van deze wet de Staat in de
      plaats van het college voor de post- en telecommunicatieautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
        hoofdstuk: '2'
  - number: '42.6'
    text: |-
      In samenwerkingsprotocollen treedt op het tijdstip van inwerkingtreding van [artikel 2][ref1] van deze wet de
      Autoriteit Consument en Markt in de plaats van de raad van bestuur van de Nederlandse Mededingingsautoriteit, het
      college voor de post- en telecommunicatiemarkt of de Consumentenautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
        hoofdstuk: '2'
  - number: '42.7'
    text: |-
      In zaken waarin voor het tijdstip van inwerkingtreding van [artikel 2][ref1] van deze wet aan de Nationale
      ombudsman is verzocht een onderzoek te doen dan wel de Nationale ombudsman een onderzoek heeft ingesteld naar
      een gedraging die kan worden toegerekend aan de Nederlandse Mededingingsautoriteit, het college voor de post-
      en telecommunicatiemarkt of de Consumentenautoriteit, treedt de Autoriteit Consument en Markt op dat tijdstip
      in de plaats van de Nederlandse Mededingingsautoriteit, het college voor de post- en telecommunicatiemarkt
      respectievelijk de Consumentenautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
        hoofdstuk: '2'
  - number: '42.8'
    text: |-
      Archiefbescheiden van de Nederlandse Mededingingsautoriteit, het college voor de post- en telecommunicatiemarkt
      en de Consumentenautoriteit worden overgedragen aan de Autoriteit Consument en Markt, voor zover zij niet
      overeenkomstig de [Archiefwet 1995][ref1] zijn overgebracht naar een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '43.1'
    text: |-
      De vaststelling door de Autoriteit Consument en Markt van een begroting als bedoeld in
      [artikel 25 van de Kaderwet zelfstandige bestuursorganen][ref1] vindt voor het eerst plaats ten aanzien van het
      kalenderjaar na dat waarin deze wet in het Staatsblad is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel25
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '25'
  - number: '43.2'
    text: |-
      Onze Minister stelt voor de Autoriteit Consument en Markt een voorlopig bestuursreglement vast. Het voorlopig
      reglement geldt totdat het bestuursreglement van de Autoriteit Consument en Markt de goedkeuring van Onze Minister
      heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel43
  - number: '43.3'
    text: |-
      De vaststelling door de Autoriteit Consument en Markt van een jaarverslag als bedoeld in
      [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref1] vindt voor het eerst plaats ten aanzien van
      het kalenderjaar waarin deze wet in het Staatsblad is geplaatst en betreft dan geheel of gedeeltelijk de
      taakuitoefening van de Nederlandse Mededingingsautoriteit onderscheidenlijk het college voor de post- en
      telecommunicatiemarkt onderscheidenlijk de Consumentenautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '44.1'
    text: |-
      Met ingang van het tijdstip van inwerkingtreding van [artikel 2][ref1] van deze wet is het personeel van het
      college voor de post- en telecommunicatiemarkt aangesteld in algemene dienst van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
        hoofdstuk: '2'
  - number: '44.2'
    text: |-
      De overgang van de in het eerste lid bedoelde personeelsleden vindt plaats met een rechtspositie die als geheel ten
      minste gelijkwaardig is aan die welke voor elk van hen gold bij het college voor de post- en telecommunicatiemarkt.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel44
  - number: '44.3'
    text: |-
      Op het tijdstip van inwerkingtreding van [artikel 2][ref1] van deze wet gaan de vermogensbestanddelen van het
      college voor de post- en telecommunicatiemarkt onder algemene titel over op de Staat tegen een door Onze Minister
      in overeenstemming met Onze Minister van Financiën te bepalen waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
        hoofdstuk: '2'
  - number: '44.4'
    text: |-
      Ingeval krachtens het derde lid registergoederen overgaan, doet Onze Minister van
      Financiën de overgang van die registergoederen onverwijld inschrijven in de openbare
      registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1].
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '24'
  - number: 44a
    text: |-
      Op overtredingen van het bij of krachtens de [Wet handhaving consumentenbescherming][ref1] bepaalde, waarvoor
      op grond van de Wet handhaving consumentenbescherming zoals die luidde onmiddellijk voorafgaand aan het tijdstip
      van inwerkingtreding van [artikel 30][ref2] van deze wet, een bestuurlijke boete kon worden opgelegd, en die zijn
      begaan en beëindigd voor het tijdstip van inwerkingtreding van artikel 30 van deze wet, blijft de Wet handhaving
      consumentenbescherming van toepassing zoals die luidde onmiddellijk voor het genoemde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0020586
      [ref2]: https://wetten.overheid.nl/BWBR0033043#Artikel30
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0020586
      - id: ref2
        bwb_id: BWBR0033043
        artikel: '30'
        hoofdstuk: '3'
  - number: '45'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de gevolgen van de inwerkingtreding van
      deze wet voor zover de [artikelen 42 tot en met 44][ref1] daarin niet voorzien. Deze regels gelden uiterlijk tot
      en met 31 december van het kalenderjaar na dat waarin zij in werking zijn getreden. Van het vaststellen van deze
      regels wordt kennis gegeven aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel42
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '42'
        hoofdstuk: '4'
  - number: '46'
    text: |-
      De [Wet Onafhankelijke post- en telecommunicatieautoriteit][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008807
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008807
  - number: '47'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel47
  - number: '48'
    text: 'Deze wet wordt aangehaald als: Instellingswet Autoriteit Consument en Markt.'
    url: https://wetten.overheid.nl/BWBR0033043/2013-04-01#Artikel48
