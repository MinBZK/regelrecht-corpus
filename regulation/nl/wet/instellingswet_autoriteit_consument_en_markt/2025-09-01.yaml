    text: |-
      De Autoriteit Consument en Markt kan in geval van overtreding van een wettelijk voorschrift met het toezicht op de
      naleving waarvan zij is belast, aan de overtreder een bindende aanwijzing opleggen.
    url: https://wetten.overheid.nl/BWBR0033043/2025-09-01#Artikel12j
  - number: 12k
    text: |-
      1 De Autoriteit Consument en Markt kan de termijn, genoemd in
      [artikel 5:51, eerste lid, van de Algemene wet bestuursrecht][ref1], met ten hoogste dertien weken verlengen,
      indien voor de desbetreffende overtreding bij wettelijk voorschrift is bepaald dat een bestuurlijke boete kan
      worden opgelegd van ten hoogste 10% van de omzet van de overtreder.

      2 Van deze verlenging wordt mededeling gedaan aan de overtreder.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de bevoegdheid tot verlenging,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel551
