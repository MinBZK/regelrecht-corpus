  - number: 12f
    text: |-
      1 De ambtenaar die is binnengetreden, maakt op zijn ambtseed of -belofte een schriftelijk verslag op omtrent het
      binnentreden.

      2 In het verslag vermeldt hij:

      a. zijn naam of nummer en zijn hoedanigheid;

      b. de dagtekening van de machtiging en de naam van de rechter-commissaris die de machtiging heeft gegeven;

      c. de wettelijke bepaling waarop het binnentreden berust en het doel waartoe is binnengetreden;

      d. de plaats waar is binnengetreden en de naam van degene bij wie is binnengetreden;

      e. de wijze van binnentreden en het tijdstip waarop in de woning is binnengetreden en waarop deze is verlaten;

      f. hetgeen in de woning is verricht en overigens is voorgevallen;

      g. de namen of nummers en de hoedanigheid van de overige personen die zijn binnengetreden.

      3 Het verslag wordt uiterlijk op de vierde dag na die waarop is binnengetreden, toegezonden aan de rechter-
      commissaris die de machtiging heeft gegeven.

      4 Een afschrift van het verslag wordt uiterlijk op de vierde dag na die waarop is binnengetreden, aan degene bij
      wie is binnengetreden, uitgereikt of toegezonden. Indien het doel waartoe is binnengetreden daartoe noodzaakt,
      kan deze uitreiking of toezending worden uitgesteld. Uitreiking of toezending geschiedt in dat geval zodra het
      belang van dit doel het toelaat. Indien het niet mogelijk is het afschrift uit te reiken of toe te zenden, houdt
      de rechter-commissaris of de ambtenaar die is binnengetreden het afschrift gedurende zes maanden beschikbaar voor
      degene bij wie is binnengetreden.

      5 De [artikelen 10][ref1] en [11 van de Algemene wet op het binnentreden][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel11
