  - number: 44b
    text: |-
      Een besluit als bedoeld in [artikel 49a, eerste lid, van de Mededingingswet][ref1] tot het bindend verklaren
      van een toezegging en de aanvraag tot het nemen van een dergelijk besluit worden na de inwerkingtreding
      van [artikel 12h][ref2] van de Instellingswet Autoriteit Consument en Markt aangemerkt als een besluit
      onderscheidenlijk aanvraag als bedoeld in artikel 12h, eerste lid, van de Instellingswet Autoriteit Consument en
      Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel49a
      [ref2]: https://wetten.overheid.nl/BWBR0033043#Artikel12h
