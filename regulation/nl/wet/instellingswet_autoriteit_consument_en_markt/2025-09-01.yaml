      1 Met ingang van het tijdstip van inwerkingtreding van [artikel 2][ref1] van deze wet is het personeel van het
      college voor de post- en telecommunicatiemarkt aangesteld in algemene dienst van het Rijk.

      2 De overgang van de in het eerste lid bedoelde personeelsleden vindt plaats met een rechtspositie die als
      geheel ten minste gelijkwaardig is aan die welke voor elk van hen gold bij het college voor de post- en
      telecommunicatiemarkt.

      3 Op het tijdstip van inwerkingtreding van [artikel 2][ref2] van deze wet gaan de vermogensbestanddelen van het
      college voor de post- en telecommunicatiemarkt onder algemene titel over op de Staat tegen een door Onze Minister
      in overeenstemming met Onze Minister van Financiën te bepalen waarde.

      4 Ingeval krachtens het derde lid registergoederen overgaan, doet Onze Minister van
      Financiën de overgang van die registergoederen onverwijld inschrijven in de openbare
      registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref3].
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref4] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033043#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel24
