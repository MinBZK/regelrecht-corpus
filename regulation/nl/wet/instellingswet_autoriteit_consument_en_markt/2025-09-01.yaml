  - number: 6a
    text: |-
      1 De kosten van de Autoriteit Consument en Markt die samenhangen met de uitvoering van de taken, bedoeld in
      [artikel 2, tweede lid][ref1], worden ten laste gebracht van marktorganisaties, tenzij bij wettelijk voorschrift
      anders is bepaald.

      2 De kosten van de Autoriteit Consument en Markt die samenhangen met het uit eigen beweging doen van
      marktonderzoeken en maken van rapportages, bedoeld in [artikel 2, vierde lid][ref2], met de behandeling van
      bezwaar- en beroepschriften, met het sanctioneren van overtredingen waaronder het nemen en bekendmaken van
      besluiten omtrent het opleggen van bestuurlijke sancties en bindende aanwijzingen, met werkzaamheden die
      uitsluitend ten behoeve van andere overheidsorganisaties worden verricht, en met het geven van deskundige raad aan
      Onze Minister of Onze Minister van Infrastructuur en Milieu worden niet ten laste gebracht van marktorganisaties.

      3 De kosten van de Autoriteit Consument en Markt die samenhangen met het nemen en bekendmaken van besluiten,
      niet zijnde beschikkingen, en het toezicht op de naleving van wettelijke voorschriften worden niet ten laste van
      marktorganisaties gebracht indien:

      a. de desbetreffende werkzaamheden niet gericht zijn op het tot stand brengen van marktordening of er geen sprake
      is van een voldoende afgebakende groep marktorganisaties die van de werkzaamheden profijt hebben, of

      b. de baten naar verwachting niet opwegen tegen de kosten van de Autoriteit Consument en Markt om de in de aanhef
      bedoelde kosten ten laste te brengen van marktorganisaties.

      4 Bij algemene maatregel van bestuur kunnen andere kosten worden aangewezen die in afwijking van het eerste lid
      niet ten laste van marktorganisaties worden gebracht.

      5 De systematiek volgens welke de kosten worden bepaald en ten laste worden gebracht van marktorganisaties houdt
      in dat:

      a. ten hoogste de door de Autoriteit Consument en Markt gemaakte kosten ten laste van marktorganisaties worden
      gebracht,

      b. zowel directe als indirecte kosten ten laste van marktorganisaties kunnen worden gebracht,

      c. de kosten van de Autoriteit Consument en Markt die samenhangen met de uitvoering van een taak voor een
      specifieke sector uitsluitend ten laste worden gebracht van marktorganisaties in die sector, en

      d. de kosten samenhangend met het geven van een beschikking of met de behandeling van een aanvraag van een
      marktorganisatie tot het geven van een beschikking ten laste kunnen worden gebracht van de marktorganisatie aan wie
      de beschikking is gericht of die de aanvraag heeft gedaan.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de systematiek volgens
      welke de kosten worden bepaald en ten laste gebracht van marktorganisaties en regels over de in dat kader door
      marktorganisaties aan de Autoriteit Consument en Markt te verstrekken gegevens. In die maatregel kan worden bepaald
      dat voor daarbij aan te wijzen categorieën van besluiten van de Autoriteit Consument en Markt de gemiddelde kosten
      van een desbetreffend besluit ten laste van een marktorganisatie worden gebracht.

      7 De bedragen die de Autoriteit Consument en Markt ter vergoeding van de kosten aan marktorganisaties in rekening
      brengt worden bij ministeriële regeling vastgesteld.

      8 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat, ten behoeve van een geleidelijke overgang
      naar de op basis van de voorgaande leden aan marktorganisaties in rekening te brengen vergoedingen, gedurende een
      periode van ten hoogste drie jaren na inwerkingtreding van dit artikel andere bedragen in rekening worden gebracht.
      Daarbij kan gedifferentieerd worden naar marktsector.

      9 De Autoriteit Consument en Markt kan de door marktorganisaties verschuldigde bedragen
      invorderen bij dwangbevel. [Titel 4.4][ref3], met uitzondering van de [artikelen 4:85][ref4] en
      [4:95, van de Algemene wet bestuursrecht][ref5] is, voor zover al niet van toepassing, van overeenkomstige
      toepassing.

      10 Voor zover een door de Autoriteit Consument en Markt in rekening gebracht bedrag verplicht tot betaling van een
      geldsom, komt deze geldsom toe aan de Staat der Nederlanden.


