  - number: '6'
    text: |-
      1 Onverminderd [artikel 18, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] bevat het jaarverslag
      informatie over de benoemingen en ontslagen van leden van de Autoriteit Consument en Markt, het bedrag aan
      middelen dat in het desbetreffende jaar is toegewezen en eventuele veranderingen in dit bedrag in vergelijking
      met voorgaande jaren, een overzicht van de kosten die op basis van [artikel 6a, eerste lid][ref2], ten laste zijn
      gebracht van marktorganisaties en een globale beschrijving van de ontwikkeling van de markt in de postsector en
      de telecommunicatiesector.

      2 Bij de toepassing van [artikel 18, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref3] wordt het
      jaarverslag mede gezonden aan Onze Minister van Infrastructuur en Milieu.

      3 Onze Minister zendt zo spoedig mogelijk zijn bevindingen omtrent het jaarverslag, alsmede de bevindingen van Onze
      Minister van Infrastructuur en Milieu, aan de beide Kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0033043#Artikel6a
