  - number: 44d
    text: |-
      Indien een overtreding van een zelfstandige last of van [artikel 5:20 van de Algemene wet bestuursrecht][ref1] is
      begaan en beëindigd voor de inwerkingtreding van [artikel 12m, eerste en derde lid][ref2], van de Instellingswet
      Autoriteit Consument en Markt, is artikel 12m, eerste en derde lid, niet van toepassing indien de Autoriteit
      Consument en Markt voor die overtredingen onmiddellijk voor het tijdstip van inwerkingtreding van artikel 12m,
      eerste en derde lid, geen bestuurlijke sanctie kon opleggen.


