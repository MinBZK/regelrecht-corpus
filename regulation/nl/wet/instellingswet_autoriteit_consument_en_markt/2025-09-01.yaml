    text: |-
      1 Een machtiging als bedoeld in [artikel 12d, eerste lid][ref1], is met redenen omkleed en ondertekend en vermeldt:

      a. de naam van de rechter-commissaris die de machtiging heeft gegeven;

      b. de naam of het nummer en de hoedanigheid van degene aan wie de machtiging is gegeven;

      c. de wettelijke bepaling waarop het binnentreden berust en het doel waartoe wordt binnengetreden;

      d. de dagtekening.

      2 Indien het betreden dermate spoedeisend is dat de machtiging niet tevoren op schrift kan worden gesteld, zorgt de
      rechter-commissaris zo spoedig mogelijk voor de opschriftstelling.

      3 De machtiging blijft ten hoogste van kracht tot en met de derde dag na die waarop zij is gegeven.

      4 [Artikel 6 van de Algemene wet op het binnentreden][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel12d
