  - number: 12h
    text: |-
      1 Onverminderd [artikel 5:45 van de Algemene wet bestuursrecht][ref1] vervalt de bevoegdheid van de Autoriteit
      Consument en Markt tot het opleggen van een bestuurlijke boete of een last onder dwangsom aan een marktorganisatie,
      indien de Autoriteit Consument en Markt op aanvraag van die marktorganisatie besluit tot het bindend verklaren van
      een door die marktorganisatie gedane toezegging.

      2 De Autoriteit Consument en Markt kan een besluit nemen als bedoeld in het eerste lid, indien zij het bindend
      verklaren van een toezegging doelmatiger acht dan het opleggen van een bestuurlijke boete of een last onder
      dwangsom.

      3 De marktorganisatie dient de aanvraag voor het nemen van een besluit als bedoeld in het eerste lid in, voordat
      de Autoriteit Consument en Markt een besluit omtrent het opleggen van een bestuurlijke boete of een last onder
      dwangsom heeft genomen.

      4 De termijn, bedoeld in [artikel 5:45, eerste lid, van de Algemene wet bestuursrecht][ref2] wordt opgeschort met
      ingang van de dag waarop de Autoriteit Consument en Markt de aanvraag ontvangt, tot de dag waarop de Autoriteit
      Consument en Markt een besluit op de aanvraag heeft genomen. Artikel 5:45, derde lid, van de Algemene wet
      bestuursrecht is van overeenkomstige toepassing.

      5 De marktorganisatie gedraagt zich overeenkomstig het besluit, bedoeld in het eerste lid.

      6 De Autoriteit Consument en Markt bepaalt gedurende welke periode het besluit, bedoeld in het eerste lid, geldt en
      kan deze periode telkens verlengen.

      7 De Autoriteit Consument en Markt kan een besluit als bedoeld in het eerste lid of een besluit tot verlenging als
      bedoeld in het zesde lid, wijzigen of intrekken indien:

      a. er een wezenlijke verandering is opgetreden in de feiten waarop het besluit berust;

      b. het besluit berust op door de marktorganisatie verstrekte onvolledige, onjuiste of misleidende gegevens;

      c. de marktorganisatie in strijd met het vijfde lid handelt.

      8 Alvorens de Autoriteit Consument en Markt een besluit als bedoeld in het eerste lid neemt op het gebied van
      mededinging, informeert zij naar de standpunten van marktorganisaties die actief waren op de markt waar het
      handelen waarop de toezegging betrekking heeft, plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel545
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel545
