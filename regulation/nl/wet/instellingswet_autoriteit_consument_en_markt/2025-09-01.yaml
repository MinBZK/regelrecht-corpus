  - number: 12s
    text: |-
      1 Ingeval een bestuurlijke boete is opgelegd aan een marktorganisatie als bedoeld in
      [artikel 1, onder 2°][ref1], kan de Autoriteit Consument en Markt, bij gebreke van betaling binnen de in
      [artikel 4:112, eerste lid, van de Algemene wet bestuursrecht][ref2] bedoelde termijn als gevolg van insolventie
      van die marktorganisatie, bij elk van de marktorganisaties, bedoeld in de begripsomschrijving van artikel 1, onder
      1°, die bij de eerstbedoelde marktorganisatie waren vertegenwoordigd in het besluitvormende orgaan op het tijdstip
      van de beslissing tot het begaan van de overtreding, de bestuurlijke boete invorderen.

      2 Indien na invordering overeenkomstig het eerste lid, de bestuurlijke boete niet volledig is betaald, kan de
      Autoriteit Consument en Markt het resterende bedrag invorderen van elk van de vertegenwoordigde marktorganisaties,
      bedoeld in het eerste lid, die tijdens de overtreding actief waren op de markt waar de overtreding is begaan.

      3 Bij toepassing van het eerste en tweede lid kan van elke vertegenwoordigde marktorganisatie geen hoger
      bedrag worden gevorderd dan 10% van de omzet behaald in het meest recente boekjaar ten aanzien waarvan de
      vertegenwoordigde marktorganisatie een jaarrekening beschikbaar heeft of zou moeten hebben.

      4 Een vertegenwoordigde marktorganisatie waarvan op grond van het eerste of tweede lid een bestuurlijke boete wordt
      gevorderd, is niet verplicht tot betaling indien zij aantoont dat zij de beslissing, bedoeld in het eerste lid,
      niet heeft uitgevoerd en zij hetzij niet op de hoogte was van die beslissing hetzij actief afstand heeft genomen
      van die beslissing voordat het onderzoek naar de overtreding was aangevangen.

      5 Alvorens toepassing te geven aan het eerste lid ten aanzien van een bestuurlijke boete die is opgelegd wegens
      overtreding van de [artikelen 6, eerste lid][ref3], of [24, eerste lid, van de Mededingingswet][ref4], dan wel
      de artikelen 101 of 102 van het Verdrag betreffende de werking van de Europese Unie, verplicht de Autoriteit
      Consument en Markt een marktorganisatie als bedoeld in [artikel 1, onder 2°][ref5], waarbij betaling als
      gevolg van insolventie van die marktorganisatie niet mogelijk is, ertoe om bij elk van de marktorganisaties,
      bedoeld in artikel 1, onder 1°, die bij de eerstbedoelde marktorganisatie waren vertegenwoordigd, binnen
      een door de Autoriteit Consument en Markt te stellen termijn, bijdragen te vragen ter betaling van de boete.
      [Artikel 4:125 van de Algemene wet bestuursrecht][ref6] is van overeenkomstige toepassing.


