    text: |-
      1 De werking van een beschikking van de Autoriteit Consument en Markt tot oplegging van een bestuurlijke boete
      wordt opgeschort totdat de termijn voor het indienen van een bezwaarschrift tegen die beschikking, is verstreken.

      2 Indien binnen de in het eerste lid bedoelde termijn een bezwaarschrift is ingediend, wordt, in afwijking van het
      eerste lid, de werking van de beschikking opgeschort met 24 weken gerekend met ingang van de dag na die waarop het
      besluit op de voorgeschreven wijze aan de overtreder is bekendgemaakt of, indien dat eerder is, tot de dag na die
      waarop de beslissing op bezwaar op de voorgeschreven wijze aan de overtreder is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0033043/2025-09-01#Artikel12p
  - number: 12q
    text: |-
      Onverminderd [artikel 10:3, vierde lid, van de Algemene wet bestuursrecht][ref1] worden de werkzaamheden in
      verband met het opleggen van een bestuurlijke boete niet verricht door personen die betrokken zijn geweest bij de
      opstelling van het rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref2] en het
      daaraan voorafgaande onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel103
