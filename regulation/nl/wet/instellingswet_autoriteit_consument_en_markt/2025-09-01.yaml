  - number: 12m
    text: |-
      1 De Autoriteit Consument en Markt kan aan de overtreder een bestuurlijke boete opleggen van ten hoogste € 900.000
      of, indien dat meer is, van ten hoogste 1% van de omzet van de marktorganisatie, indien deze een marktorganisatie
      is als bedoeld in [artikel 1, onder 1°][ref1], dan wel, indien de overtreding door een marktorganisatie als
      bedoeld in artikel 1, onder 2°, is begaan van de gezamenlijke omzet van de aangesloten marktorganisaties, in geval
      van:

      a. overtreding van [artikel 6b, eerste en tweede lid][ref2],

      b. overtreding van een zelfstandige last,

      c. overtreding van [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref3], of

      d. verbreking, opheffing of beschadiging van een verzegeling als bedoeld in [artikel 12b, eerste lid][ref4], het
      op andere wijze verijdelen van de door die verzegeling beoogde afsluiting of van het door de marktorganisatie
      achterwege laten van voldoende maatregelen om verijdeling van de door de verzegeling beoogde afsluiting van door
      haar gebruikte bedrijfsruimten of voorwerpen te voorkomen.

      2 De Autoriteit Consument en Markt kan in geval van overtreding van [artikel 12h, vijfde lid][ref5], de overtreder
      een bestuurlijke boete opleggen van ten hoogste € 900.000, of indien dat meer is, van ten hoogste 10% van de
      omzet van de marktorganisatie, als bedoeld in [artikel 1, onder 1°][ref6], dan wel, indien de overtreding door
      een marktorganisatie als bedoeld in artikel 1, onder 2°, is begaan, van de gezamenlijke omzet van de aangesloten
      marktorganisaties.

      3 Ingeval van een overtreding als bedoeld in het eerste lid, onderdeel a of b kan de Autoriteit Consument en Markt
      een last onder dwangsom opleggen.

      4 [Artikel 184 van het Wetboek van Strafrecht is][ref7] niet van toepassing op de in het eerste lid, onderdeel
      c, bedoelde overtreding en [artikel 199 van het Wetboek van Strafrecht][ref8] is niet van toepassing op de in het
      eerste lid, onderdeel d, bedoelde overtreding.

      5 De bestuurlijke boete die ingevolge het eerste of tweede lid ten hoogste kan worden opgelegd wordt verhoogd met
      100%, indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de overtreding opgemaakte
      rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref9], een aan die overtreder
      voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde bestuurlijke boete
      onherroepelijk is geworden.


