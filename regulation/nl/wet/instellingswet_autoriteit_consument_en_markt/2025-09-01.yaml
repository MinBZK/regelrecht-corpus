preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om het toezicht op markten te stroomlijnen ter
    bevordering van de kwaliteit van het toezicht en de bescherming van het belang van de consument, en daarom regels
    te stellen die het toezicht zoveel mogelijk onderbrengen bij één onafhankelijke toezichthouder;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0033043/2025-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in [artikel 2, eerste lid][ref1];
        - *bindende aanwijzing:* een zelfstandige last die wegens een overtreding wordt opgelegd;
        - *marktorganisatie:* 1°. een rechtspersoon, natuurlijke persoon of andere entiteit handelend in de uitoefening
      van een beroep of bedrijf, met inbegrip van een onderneming als bedoeld in artikel 101 van het Verdrag betreffende
      de werking van de Europese Unie; 2°. een organisatie waarin meerdere rechtspersonen, natuurlijke personen of
      andere entiteiten handelend in de uitoefening van een beroep of bedrijf verenigd zijn, met inbegrip van een
      ondernemersvereniging als bedoeld in artikel 101 van het Verdrag betreffende de werking van de Europese Unie;
        - *Onze Minister:* Onze Minister van Economische Zaken en Klimaat;
        - *Verordening (EU) 2016/679:* [Verordening (EU) 2016/679](32579R2016) van het Europees Parlement en de Raad van
      27 april 2016 betreffende de bescherming van natuurlijke personen in verband met de verwerking van persoonsgegevens
      en betreffende het vrije verkeer van die gegevens en tot intrekking van [Richtlijn 95/46/EG](31995L0046) (algemene
      verordening gegevensbescherming) (Pb EU 2016, L 119);
        - *zelfstandige last:* de enkele last tot het verrichten van bepaalde handelingen, bedoeld in
      [artikel 5:2, tweede lid, van de Algemene wet bestuursrecht][ref2], ter bevordering van de naleving van wettelijke
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
