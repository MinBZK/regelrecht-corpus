  - number: 12u
    text: |-
      1 De Autoriteit Consument en Markt maakt een door haar genomen beschikking tot het opleggen van
      een bestuurlijke sanctie of een bindende aanwijzing, niet zijnde een beschikking als bedoeld
      in [artikel 12v, eerste lid][ref1], openbaar met dien verstande dat gegevens die ingevolge
      [Artikel 5.1, eerste, tweede en vijfde lid, van de Wet open overheid][ref2] niet voor verstrekking in aanmerking
      komen, niet openbaar worden gemaakt.

      2 De openbaarmaking van de beschikking geschiedt niet eerder dan nadat tien werkdagen zijn verstreken na de dag
      waarop de beschikking aan de overtreder bekend is gemaakt, tenzij de overtreder de beschikking zelf heeft openbaar
      gemaakt, heeft doen openbaar maken of heeft aangegeven geen bedenkingen te hebben tegen eerdere openbaarmaking.

      3 Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref3], wordt de openbaarmaking van de beschikking opgeschort
      totdat de voorzieningenrechter uitspraak heeft gedaan of het verzoek is ingetrokken.

      4 Indien de openbaarmaking van de beschikking naar het oordeel van de Autoriteit Consument en Markt in strijd is
      of zou kunnen komen met het doel van het aan de Autoriteit Consument en Markt opgedragen toezicht op de naleving,
      blijft openbaarmaking achterwege.

      5 Het eerste tot en met vierde lid zijn mede van toepassing op een door de Autoriteit Consument en Markt genomen
      beslissing op bezwaar strekkend tot het opleggen van een bestuurlijke sanctie of bindende aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel12v
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5.1
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel881
