  - number: 12l
    text: |-
      1 De Autoriteit Consument en Markt kan met het oog op de bepaling van de hoogte van de op te leggen bestuurlijke
      boete de boekhouding van de marktorganisatie onderzoeken teneinde de voor de oplegging van de bestuurlijke boete
      in aanmerking te nemen financiële gegevens te kunnen bepalen. Zij kan zich laten bijstaan door een onafhankelijke
      financieel deskundige.

      2 De marktorganisatie verleent medewerking aan een onderzoek als bedoeld in het eerste lid.

      3 De Autoriteit Consument en Markt kan de marktorganisatie die in strijd handelt met het tweede lid een
      bestuurlijke boete opleggen van ten hoogste € 900.000.

      4 De bestuurlijke boete die ingevolge het derde lid ten hoogste kan worden opgelegd wordt verhoogd met 100%,
      indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de overtreding opgemaakte
      rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref1], een aan die overtreder
      voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde bestuurlijke boete
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel548
