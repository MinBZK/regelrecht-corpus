  - number: '5'
    text: |-
      1 Onze Minister stelt ten behoeve van de uitvoering van de in [artikel 2, tweede lid][ref1], bedoelde taken,
      personeel ter beschikking van de Autoriteit Consument en Markt.

      2 De Autoriteit Consument en Markt stelt een mandaatregeling op ten aanzien van de bevoegdheden van het personeel.

      3 De mandaatregeling behoeft de goedkeuring van Onze Minister. Onze Minister onthoudt zijn goedkeuring indien de
      mandaatregeling naar zijn oordeel een goede taakuitoefening door de Autoriteit Consument en Markt kan belemmeren.
      De mandaatregeling wordt na goedkeuring door de Autoriteit Consument en Markt bekendgemaakt in de Staatscourant.

      4 Indien Onze Minister van oordeel is dat de mandaatregeling een goede taakuitoefening belemmert, kan hij de
      Autoriteit Consument en Markt verzoeken de mandaatregeling te wijzigen.

      5 Indien de Autoriteit Consument en Markt binnen dertien weken geen gevolg heeft gegeven aan een verzoek als
      bedoeld in het vierde lid kan Onze Minister de Autoriteit Consument en Markt opdragen de mandaatregeling op een
      door hem gewenste wijze aan te passen.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
