    text: |-
      1 Aan een last onder dwangsom kunnen voorschriften worden verbonden inzake het verstrekken van gegevens aan de
      Autoriteit Consument en Markt.

      2 Een last onder dwangsom geldt voor een door de Autoriteit Consument en Markt te bepalen termijn van ten hoogste
      twee jaren.

      3 De bevoegdheid tot het opleggen van een last onder dwangsom vervalt vijf jaren nadat de overtreding heeft
      plaatsgevonden. [Artikel 5:45, derde lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel545
