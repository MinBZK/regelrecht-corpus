  - number: 12v
    text: |-
      1 De Autoriteit Consument en Markt maakt een door haar genomen beschikking tot het opleggen van een bestuurlijke
      sanctie of een bindende aanwijzing openbaar indien voor de desbetreffende overtreding bij wettelijk voorschrift is
      bepaald dat een bestuurlijke boete kan worden opgelegd van ten hoogste 10% van de omzet van de overtreder en met
      dien verstande dat:

      a. gegevens als bedoeld in [artikel 5.1, eerste lid, onderdeel c, van de Wet open overheid][ref1] niet openbaar
      worden gemaakt;

      b. gegevens als bedoeld in [artikel 5.1, tweede lid, onderdeel f, van de Wet open overheid][ref2] niet openbaar
      worden gemaakt, indien het belang van openbaarheid naar het oordeel van de Autoriteit Consument en Markt niet
      opweegt tegen het belang, bedoeld in artikel 5.1, tweede lid, onderdeel f, van de Wet open overheid;

      c. namen van betrokken natuurlijke personen niet openbaar worden gemaakt, indien het belang van
      openbaarmaking naar het oordeel van de Autoriteit Consument en Markt niet opweegt tegen het belang, bedoeld in
      [artikel 5.1, tweede lid, onderdeel e, van de Wet open overheid][ref3];

      d. de naam van de overtredende marktorganisatie altijd openbaar wordt gemaakt, ook indien de naam van een
      natuurlijke persoon van die naam deel uitmaakt.

      2 Het openbaar maken van informatie blijft in afwijking van het eerste lid, onderdeel a, in
      geval van milieu-informatie eveneens achterwege voor zover het belang van openbaarheid naar
      het oordeel van de Autoriteit Consument en Markt niet opweegt tegen het belang, bedoeld in
      [artikel 5.1, eerste lid, onderdeel c, van de Wet open overheid][ref4].

      3 [Artikel 12u, tweede tot en met vierde lid][ref5], zijn van toepassing.

      4 Het eerste lid is mede van toepassing op een door de Autoriteit Consument en Markt genomen
      beslissing op bezwaar strekkend tot het opleggen van een bestuurlijke sanctie of bindende aanwijzing.
      [Artikel 12u, tweede tot en met vierde lid][ref6], is van toepassing.


