    text: |-
      1 Onze Minister en Onze Minister van Infrastructuur en Milieu onthouden zich van instructies die op een individuele
      zaak betrekking hebben.

      2 De leden en het personeel van de Autoriteit Consument en Markt verlangen of ontvangen geen instructies die op een
      individuele zaak betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0033043/2025-09-01#Artikel9
  - number: '10'
    text: |-
      1 In afwijking van [artikel 22, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] kan Onze Minister
      of Onze Minister van Infrastructuur en Milieu een besluit van de Autoriteit Consument en Markt uitsluitend
      vernietigen indien het een besluit van algemene strekking betreft en de vernietiging geschiedt wegens onbevoegdheid
      van de Autoriteit Consument en Markt.

      2 [Artikel 10:35 van de Algemene wet bestuursrecht][ref2] is niet van toepassing.

      3 Onze Minister of Onze Minister van Infrastructuur en Milieu kan geen besluiten vernietigen op het gebied
      van energie, post, telecommunicatie en vervoer die de Autoriteit Consument en Markt neemt op grond van het
      bepaalde bij of krachtens een voor een specifieke marktsector geldende wet of op het gebied van mededinging.
      [Artikel 22, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref3] is op die besluiten niet van
      toepassing.

      4 Onze Minister of Onze Minister van Infrastructuur en Milieu zendt een afschrift van een besluit tot vernietiging
      aan de Tweede en de Eerste Kamer der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel1035
