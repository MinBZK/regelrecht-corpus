  - number: 6b
    text: |-
      1 Een ieder verstrekt de Autoriteit Consument en Markt desgevraagd de gegevens en inlichtingen en verschaft
      haar desgevraagd inzage in de gegevens en bescheiden die redelijkerwijs nodig zijn voor de uitvoering van de in
      [artikel 2, tweede lid][ref1], bedoelde taken.

      2 De Autoriteit Consument en Markt kan een termijn stellen waarbinnen de in het eerste lid bedoelde gegevens,
      inlichtingen of bescheiden worden verstrekt.

      3 Zij die uit hoofde van ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het
      verlenen van medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.

      4 De Autoriteit Consument en Markt draagt er zorg voor dat de wijze waarop zij uitvoering geeft aan het eerste lid
      zodanig is dat de daaruit voortvloeiende lasten voor marktorganisaties zo laag mogelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
