    text: |-
      1 De Autoriteit Consument en Markt kan door haar genomen andere besluiten dan beschikkingen tot het opleggen van
      een bestuurlijke sanctie of bindende aanwijzing openbaar maken, alsmede andere documenten die door haar of in haar
      opdracht zijn vervaardigd voor de uitvoering van de aan haar bij of krachtens de wet opgedragen taken.

      2 Gegevens die ingevolge [artikel 5.1, eerste, tweede en vijfde lid, van de Wet open overheid][ref1] niet voor
      verstrekking in aanmerking komen, worden niet openbaar gemaakt.

      3 [Artikel 12u, tweede en derde lid][ref2], is van overeenkomstige toepassing indien de Autoriteit Consument en
      Markt op grond van het eerste lid besluit tot openbaarmaking van een besluit.

      4 [Artikel 12u, vierde lid][ref3], is van overeenkomstige toepassing.

      5 Eenieder kan verzoeken om toepassing van het eerste lid. Het verzoek wordt toegewezen, voor zover het tweede of
      het vierde lid hieraan niet in de weg staan.

      6 Het eerste lid is niet van toepassing, voor zover een wettelijk voorschrift de openbaarmaking regelt.


