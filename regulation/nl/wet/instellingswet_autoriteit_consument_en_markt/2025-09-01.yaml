    text: |-
      Indien voor de inwerkingtreding van [artikel 12n][ref1] van de Instellingswet Autoriteit Consument en Markt een
      overtreding is begaan en beëindigd, blijft met betrekking tot de hoogte van de boete die ten hoogste kan worden
      opgelegd aan een in [artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht][ref2] bedoelde overtreder
      het recht gelden zoals dat luidde onmiddellijk voor het tijdstip van inwerkingtreding van genoemd artikel 12n.


