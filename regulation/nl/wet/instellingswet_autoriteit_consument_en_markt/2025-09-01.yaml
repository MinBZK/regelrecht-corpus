  - number: '3'
    text: |-
      1 De Autoriteit Consument en Markt bestaat uit drie leden, onder wie de voorzitter.

      2 Benoeming vindt plaats op grond van de deskundigheid die nodig is voor de uitoefening van de taken van de
      Autoriteit Consument en Markt alsmede op grond van maatschappelijke kennis en ervaring.

      3 De voorzitter wordt benoemd voor een periode van zeven jaar en de overige leden worden benoemd voor een periode
      van vijf jaar. De voorzitter en de overige leden kunnen eenmaal worden herbenoemd voor eenzelfde periode.

      4 In het geval van een vacature vormen de overblijvende leden, in afwijking van het eerste lid, voor een periode
      van ten hoogste negen maanden nadat de vacature is ontstaan de Autoriteit Consument en Markt, met de bevoegdheden
      van de voltallige Autoriteit Consument en Markt.

      5 Onverminderd [artikel 13, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] heeft een lid geen
      financiële of andere belangen waardoor zijn onpartijdigheid in het geding kan zijn.

      6 Een lid van de Autoriteit Consument en Markt legt jaarlijks een schriftelijke verklaring af dat hij geen belangen
      heeft als bedoeld in het vijfde lid. In die verklaring worden alle directe en indirecte belangen vermeld die van
      invloed kunnen zijn op de uitoefening van zijn functie.

      7 Onverminderd [artikel 12 van de Kaderwet zelfstandige bestuursorganen][ref2] doet Onze Minister mededeling van
      een besluit tot ontslag in de Staatscourant. De redenen van het ontslag worden in die mededeling openbaar gemaakt
      indien de betrokkene daarom verzoekt.

      8 Bij ministeriële regeling worden de voorwaarden voor schorsing en ontslag van de leden van de Autoriteit
      Consument en Markt nader uitgewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel12
