  - number: 44c
    text: |-
      Indien het bij koninklijke boodschap van 26 april 2013 ingediende voorstel van wet tot wijziging van
      de Instellingswet Autoriteit Consument en Markt en enige andere wetten in verband met de stroomlijning
      van het door de Autoriteit Consument en Markt te houden markttoezicht (Kamerstukken 33 622) tot
      wet is verheven en [artikel XI, onderdeel AA, van die wet][ref1] in werking is getreden, blijft
      [artikel 62 van de Mededingingswet][ref2], zoals dat luidde onmiddellijk voor het tijdstip van inwerkingtreding
      van genoemd artikel XI, onderdeel AA, van toepassing of van overeenkomstige toepassing op beschikkingen van de
      Autoriteit Consument en Markt tot oplegging van een bestuurlijke boete voor overtredingen ter zake waarvan voor
      de inwerkingtreding van [artikel 12k][ref3] van de Instellingswet Autoriteit Consument en Markt een rapport als
      bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref4] is opgemaakt.


