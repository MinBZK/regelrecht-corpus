  - number: '7'
    text: |-
      1 Gegevens of inlichtingen welke in verband met enige werkzaamheid ten behoeve van de uitvoering van een taak
      als bedoeld in [artikel 2, tweede lid][ref1], zijn verkregen mogen uitsluitend worden gebruikt voor zover dat
      noodzakelijk is voor de uitvoering van die taak of van enige andere taak als bedoeld in artikel 2, tweede lid.

      2 Het eerste lid is niet van toepassing voor zover een wettelijk voorschrift het gebruik van verkregen gegevens of
      inlichtingen regelt.

      3 In afwijking van het eerste lid is de Autoriteit Consument en Markt bevoegd gegevens of inlichtingen te
      verstrekken aan:

      a. een bestuursorgaan, dienst, toezichthouder en andere persoon, belast met de opsporing van strafbare feiten,
      onderscheidenlijk het toezicht op de naleving van wettelijke voorschriften, indien bij regeling van Onze Minister
      is bepaald dat verstrekking noodzakelijk is voor de goede vervulling van een aan dat bestuursorgaan, die dienst,
      die toezichthouder of die andere persoon opgedragen taak,

      b. een buitenlandse instelling, indien het gaat om gegevens of inlichtingen die van betekenis zijn of kunnen
      zijn voor de uitoefening van de taak van die buitenlandse instelling en die buitenlandse instelling op grond
      van nationale wettelijke regels is belast met de toepassing van regels op dezelfde gebieden als waarop de taken,
      bedoeld in [artikel 2, tweede lid][ref2], betrekking hebben, of

      c. degene op wie de gegevens of inlichtingen betrekking hebben voor zover deze gegevens of inlichtingen door of
      namens hem zijn verstrekt.

      4 Verstrekking aan een bestuursorgaan, dienst, toezichthouder of andere persoon als bedoeld in het derde lid, onder
      a, of aan een in het derde lid, onder b, bedoelde buitenlandse instelling vindt uitsluitend plaats indien:

      a. de geheimhouding van de gegevens of inlichtingen in voldoende mate is gewaarborgd, en

      b. voldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.

      5 Gelet op artikel 9, tweede lid, onderdeel g, van [Verordening (EU) 2016/679](32579R2016) verwerkt de Autoriteit
      Consument en Markt gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15, van [Verordening (EU) 2016/679]
      (32579R2016), die noodzakelijk zijn ten behoeve van het toezicht of de taken waarmee de Autoriteit Consument
      en Markt is belast op grond van de [hoofdstukken 2][ref3], [3][ref4], [4][ref5], [5][ref6], [8][ref7] en
      [10 van de Mededingingswet][ref8], voor zover het de zorgsector betreft, en artikel 2, vierde lid, voor zover het
      marktonderzoeken en rapportages in de zorgsector betreft.

      6 De Autoriteit Consument en Markt verwerkt de gegevens, bedoeld in het vijfde lid, slechts indien daarop
      pseudonimisering als bedoeld in artikel 4, onderdeel 5, van [Verordening (EU) 2016/679](32579R2016) is toegepast en
      vervolgens onafgebroken is gecontinueerd.

      7 Gelet op artikel 23, eerste lid, onderdeel e, van [Verordening (EU) 2016/679](32579R2016) is artikel 21, eerste
      lid, tweede volzin, van [Verordening (EU) 2016/679](32579R2016) bij de verwerking, bedoeld in het vijfde lid, niet
      van toepassing.

      8 Indien toepassing wordt gegeven aan het vijfde lid worden de gegevens over gezondheid alleen verwerkt door
      personen die uit hoofde van een wettelijk voorschrift dan wel krachtens een overeenkomst tot geheimhouding zijn
      verplicht.


