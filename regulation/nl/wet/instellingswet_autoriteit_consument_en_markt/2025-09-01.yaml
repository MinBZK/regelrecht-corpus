      1 De Autoriteit Consument en Markt stelt een bestuursreglement vast.

      2 De Autoriteit Consument en Markt maakt het bestuursreglement na de goedkeuring, bedoeld in
      [artikel 11 van de Kaderwet zelfstandige bestuursorganen][ref1], bekend in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel11
