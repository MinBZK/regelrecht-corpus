  - number: 12o
    text: |-
      1 Indien de Autoriteit Consument en Markt een bestuurlijke boete kan opleggen van ten hoogste een percentage
      van de omzet van de overtreder, wordt onder omzet van de overtreder verstaan de netto-omzet, bedoeld in
      [artikel 377, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref1] die de overtreder heeft behaald in het meest
      recente boekjaar ten aanzien waarvan de overtreder een jaarrekening beschikbaar heeft of zou moeten hebben.

      2 Indien de overtreding is begaan door een marktorganisatie als bedoeld in [artikel 1, onder 2°][ref2],
      en de Autoriteit Consument en Markt een bestuurlijke boete kan opleggen van ten hoogste een percentage van
      de gezamenlijke omzet van de marktorganisaties, bedoeld in artikel 1, onder 1°, die bij de eerstbedoelde
      marktorganisatie zijn aangesloten, is het eerste lid van overeenkomstige toepassing op de berekening van de omzet
      van een aangesloten marktorganisatie.

      3 Indien de Autoriteit Consument en Markt op grond van de [Postwet 2009][ref3] of de [Telecommunicatiewet][ref4]
      een bestuurlijke boete kan opleggen van ten hoogste een percentage van de omzet van de overtreder wordt,
      in afwijking van het eerste lid, onder omzet van de overtreder verstaan de netto-omzet, bedoeld in
      [artikel 377, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref5] die de overtreder in Nederland heeft behaald
      in het meest recente boekjaar ten aanzien waarvan de overtreder een jaarrekening beschikbaar heeft of zou moeten
      hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel377
