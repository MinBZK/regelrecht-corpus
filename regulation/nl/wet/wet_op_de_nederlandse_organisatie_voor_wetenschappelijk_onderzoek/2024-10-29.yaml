        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: 1a
    text: Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel1a
  - number: '2'
    text: |-
      1 Er is een organisatie, genaamd Nederlandse organisatie voor wetenschappelijk onderzoek.

      2 De organisatie bezit rechtspersoonlijkheid; zij is gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel2
  - number: 2a
    text: |-
      Op de organisatie is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing met uitzondering van
      [artikel 15 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel15
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '15'
  - number: '3'
    text: |-
      1 De organisatie heeft tot taak het bevorderen van de kwaliteit van wetenschappelijk onderzoek alsmede het
      initiëren en stimuleren van nieuwe ontwikkelingen in het wetenschappelijk onderzoek.

      2 De organisatie voert haar taak uit in het bijzonder door het toewijzen van middelen.

      3 De organisatie bevordert de overdracht van kennis van de resultaten van door haar geïnitieerd en gestimuleerd
      onderzoek ten behoeve van de maatschappij.

      4 De organisatie richt zich bij het uitvoeren van haar taak in hoofdzaak op het universitaire onderzoek. Daarbij
      let zij op het aspect van coördinatie en bevordert deze waar nodig.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel3
  - number: 3a
    text: |-
      Onderzoeksgegevens die louter tot stand zijn gekomen met een wetenschappelijk oogmerk en die geen betrekking hebben
      op de bestuursvoering van de organisatie kunnen beschikbaar worden gesteld voor wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel3a
  - number: '4'
    text: De organisatie heeft een raad van bestuur, een raad van toezicht en vier domeinbesturen.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel4
  - number: '5'
    text: |-
      1 De raad van bestuur bestaat uit een voorzitter en ten hoogste vijf overige leden, waarvan één van die leden de
      portefeuille bedrijfsvoering en financiën heeft.

      2 Het lidmaatschap van de raad van bestuur is onverenigbaar met het lidmaatschap van de raad van toezicht. Een lid
      van het personeel kan niet tevens worden benoemd tot lid van de raad van bestuur.

      3 De voorzitters van de vier domeinbesturen zijn lid van de raad van bestuur. Onze Minister benoemt, schorst en
      ontslaat de voorzitter van de raad van bestuur en het overige lid met de portefeuille bedrijfsvoering en financiën.

      4 Benoeming van de voorzitter en het lid met de portefeuille bedrijfsvoering en financiën geschiedt op voordracht
      van de raad van toezicht en geschiedt voor ten hoogste vijf jaar. De leden kunnen ten hoogste eenmaal opnieuw
      benoemd worden.

      5 Onze Minister stelt de Koninklijke Nederlandse Akademie van Wetenschappen en de universiteiten, genoemd in de
      [bijlage bij de Wet op het hoger onderwijs en wetenschappelijk onderzoek](onbekend), gezamenlijk, in de gelegenheid
      van hun gevoelens te doen blijken over een voornemen tot benoeming van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel5
  - number: '6'
    text: |-
      1 De raad van bestuur is belast met het besturen van de organisatie.

      2 Alle bevoegdheden welke niet bij of krachtens de wet aan een ander orgaan van de organisatie zijn opgedragen,
      komen toe aan de raad van bestuur.

      3 De raad van bestuur is, met inachtneming van het instellingsplan en de door Onze Minister goedgekeurde begroting,
      belast met het verstrekken van middelen ten behoeve van onderzoeksprojecten en onderzoeksprogramma’s.

      4 De raad van bestuur kan voor de verstrekking van middelen regels stellen, waaronder de vaststelling van
      subsidieplafonds.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel6
  - number: '7'
    text: |-
      1 De voorzitter van de raad van bestuur vertegenwoordigt de organisatie in en buiten rechte.

      2 De raad van bestuur wijst uit zijn midden een vice-voorzitter aan, die bij afwezigheid of ontstentenis van de
      voorzitter deze vervangt.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel7
  - number: '8'
    text: |-
      1 Onverminderd [artikel 11 van de Kaderwet zelfstandige bestuursorganen][ref1] stelt de raad van bestuur een
      bestuursreglement voor de organisatie vast.

      2 Het bestuursreglement regelt nader het bestuur en de inrichting van de organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel11
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '11'
  - number: '9'
    text: |-
      1 De raad van bestuur voert het personeelsbeleid en personeelsbeheer, daaronder begrepen het aangaan en beëindigen
      van arbeidsovereenkomsten met het personeel.

      2 Voor zover bij algemene maatregel van bestuur niet anders is bepaald, is op het personeel van de organisatie het
      bij of krachtens [artikel 4.5 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] bepaalde van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel4.5
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '4.5'
  - number: '10'
    text: |-
      1 De raad van toezicht bestaat uit een voorzitter en ten hoogste vijf overige leden.

      2 Het lidmaatschap van de raad van toezicht is onverenigbaar met het lidmaatschap van de raad van bestuur. Een lid
      van het personeel kan niet tevens worden benoemd tot lid van de raad van toezicht.

      3 Onze Minister benoemt, schorst en ontslaat de leden van de raad van toezicht.

      4 Een van de overige leden wordt benoemd op voordracht van Onze Minister van Economische Zaken.

      5 Voor een van de andere overige leden kan de ondernemingsraad van de organisatie personen aanbevelen.

      6 Benoeming geschiedt voor ten hoogste vijf jaar en leden kunnen ten hoogste eenmaal opnieuw worden benoemd.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel10
  - number: '11'
    text: |-
      1 De raad van toezicht staat de raad van bestuur met raad ter zijde en geeft desgevraagd of uit eigen beweging
      advies over het beleid van de raad van bestuur. Bij de vervulling van zijn taak richt de raad zich naar het
      belang van de organisatie en neemt daarbij de doelstelling van de organisatie, bedoeld in [artikel 3][ref1], als
      uitgangspunt.

      2 De raad van toezicht stelt een reglement vast betreffende zijn werkwijze waarin in ieder geval in het bijzonder
      aandacht is voor:

      a. goed bestuur van de organisatie;

      b. de voordrachten voor de leden van de raad van bestuur;

      c. de wijze waarop hij zijn advies geeft over de begroting, de jaarrekening, het jaarverslag en het
      instellingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel3
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '3'
        hoofdstuk: I
  - number: '12'
    text: |-
      1 De organisatie kent vier onderzoeksdomeinen.

      2 De raad van bestuur bepaalt het wetenschappelijk werkterrein van elk van de onderzoeksdomeinen.

      3 Een onderzoeksdomein wordt geleid door een domeinbestuur.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel12
  - number: '13'
    text: |-
      1 Een domeinbestuur bestaat uit een voorzitter en ten hoogste acht leden, waarvan ten minste één niet afkomstig is
      uit een wetenschappelijke dienstbetrekking.

      2 Onze Minister benoemt, schorst en ontslaat de voorzitter van een domeinbestuur. Benoeming geschiedt op voordracht
      van de raad van toezicht.

      3 De raad van bestuur benoemt, schorst en ontslaat de overige leden van een domeinbestuur. Benoeming geschiedt op
      voordracht van het desbetreffende domeinbestuur.

      4 De benoeming van de voorzitter en de overige leden geschiedt voor ten hoogste drie jaar. De leden kunnen ten
      hoogste eenmaal opnieuw worden benoemd.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel13
  - number: '14'
    text: |-
      1 Een domeinbestuur heeft tot taak de raad van bestuur desgevraagd of uit eigen beweging te adviseren op het gebied
      van diens wetenschappelijk werkterrein.

      2 De raad van bestuur kan aan een domeinbestuur mandaat verlenen om, met inachtneming van door de raad van bestuur
      te geven richtlijnen, het instellingsplan en de door Onze Minister goedgekeurde begroting, middelen te verstrekken
      ten behoeve van onderzoeksprojecten en onderzoeksprogramma’s.

      3 De raad van bestuur kan in het bestuursreglement de taak van een domeinbestuur en de inrichting van een
      onderzoeksdomein nader bepalen.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel14
  - number: 16a
    text: |-
      1 Onze Minister stelt het wetenschapsbudget vast. Het wetenschapsbudget heeft betrekking op een tijdvak van ten
      minste vier jaren.

      2 Onze Minister agendeert, in overeenstemming met het gevoelen van de raad van ministers, in het wetenschapsbudget
      beleidsonderwerpen op het terrein van het fundamenteel en toegepast onderzoek.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel16a
  - number: '17'
    text: |-
      1 Het wetenschapsbudget wordt vastgesteld uiterlijk vier jaar na het tijdstip van vaststelling van het vorige
      wetenschapsbudget. Na overleg met de beide Kamers der Staten-Generaal kan het wetenschapsbudget uiterlijk zes
      maanden na het tijdstip, bedoeld in de eerste volzin, worden vastgesteld.

      2 Onze Minister biedt uiterlijk zes maanden voorafgaand aan het tijdstip waarop het wetenschapsbudget moet zijn
      vastgesteld, een ontwerp daarvan aan de beide Kamers der Staten-Generaal aan.

      3 Onze Minister maakt het vastgestelde wetenschapsbudget bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel17
  - number: '18'
    text: |-
      1 De raad van bestuur stelt een instellingsplan op uiterlijk vier jaar na het tijdstip van het vaststellen van het
      vorige plan.

      2 De raad van bestuur hoort de raad van toezicht over het instellingsplan en stelt het instellingsplan vervolgens
      vast. Na vaststelling zendt de raad van bestuur het plan onverwijld aan Onze Minister.

      3 De raad van bestuur vraagt de domeinbesturen om voorstellen. Daarnaast houdt hij bij het opstellen van het
      instellingsplan rekening met het wetenschapsbudget, de instellingsplannen van universiteiten en verkenningen,
      rapporten, adviezen en aanbevelingen, een en ander voor zover die naar het oordeel van de raad van bestuur van
      belang zijn voor de uitvoering van de taken van de organisatie.

      4 Het instellingsplan omvat in elk geval:

      a. doelstellingen van de organisatie op middellange termijn;

      b. hoofdlijnen van het te voeren beleid en de daarin te stellen prioriteiten;

      c. financiële, personele, materiële en organisatorische voorwaarden die moeten worden vervuld.

      5 Onze Minister brengt zijn standpunt over het instellingsplan binnen zes maanden na ontvangst van het plan ter
      kennis van de raad van bestuur. Onze Minister zendt een afschrift van zijn standpunt en van het plan aan beide
      Kamers van de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel18
  - number: '19'
    text: |-
      1 De inkomsten van de organisatie bestaan uit:

      a. de bijdrage uit ’s Rijks kas;

      b. inkomsten, die samenhangen met voorzieningen waarvoor de rijksbijdrage is verleend;

      c. andere inkomsten.

      2 De rijksbijdrage wordt vastgesteld of nader vastgesteld door de vaststelling of nadere vaststelling bij wet van
      het hoofdstuk van de rijksbegroting waarop zij is voorgesteld. De rijksbijdrage wordt betaald in zodanige termijnen
      en tot zodanige bedragen als voor het doen van de betalingen door de organisatie nodig is.

      3 Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop een voorschot betaald
      overeenkomstig door Onze Minister te stellen regelen.

      4 Bij vaststelling van de rijksbijdrage blijven inkomsten als bedoeld in het eerste lid onder c, buiten
      beschouwing.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel19
  - number: '20'
    text: |-
      De raad van bestuur is belast met het doelmatig beheer van de financiën en de vermogensbestanddelen van de
      organisatie.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel20
  - number: '21'
    text: |-
      1 De raad van bestuur stelt jaarlijks een begroting op voor het daaropvolgende kalenderjaar. Nadat de raad van
      toezicht over de begroting is gehoord, stelt de raad van bestuur de begroting vast.

      2 Onverminderd de [artikelen 26 tot en met 30 van de Kaderwet zelfstandige bestuursorganen][ref1], is in de
      begroting een allocatie van middelen opgenomen die in overeenstemming is met het instellingsplan.

      3 De raad van bestuur zendt de begroting voor 1 november ter goedkeuring aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '26'
  - number: '24'
    text: |-
      1 Onverminderd [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref1] geeft het bestuursverslag aan in
      hoeverre de doelstellingen uit het instellingsplan zijn verwezenlijkt.

      2 De raad van bestuur stelt het jaarverslag vast, gehoord de raad van toezicht.
      Na vaststelling draagt de raad van bestuur zorg voor de verzending, bedoeld in
      [artikel 18, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '25'
    text: |-
      1 De goedkeuring, bedoeld in [artikel 34, derde lid, van de Kaderwet zelfstandige bestuursorganen][ref1], kan
      tevens worden onthouden op de grond dat de jaarrekening naar het oordeel van Onze Minister niet of niet voldoende
      in overeenstemming is met het instellingsplan. [Artikel 10:30 van de Algemene wet bestuursrecht][ref2] is van
      overeenkomstige toepassing.

      2 De raad van bestuur stelt de jaarrekening op. Nadat de raad van toezicht over de jaarrekening is gehoord, stelt
      de raad van bestuur de jaarrekening vast.

      3 De raad van bestuur zendt de jaarrekening ter goedkeuring aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel1030
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 10:30
  - number: '26'
    text: |-
      Onverminderd [artikel 35 van de Kaderwet zelfstandige bestuursorganen][ref1] kan Onze Minister, indien uitgaven
      zijn geschied in strijd met het bepaalde bij of krachtens de wet, dan wel indien werkzaamheden ten behoeve waarvan
      de rijksbijdrage is verleend, niet behoorlijk zijn uitgevoerd of de rijksbijdrage ondoelmatig is aangewend, bepalen
      dat de daarmee gemoeide bedragen in mindering worden gebracht op de rijksbijdrage. Hij maakt dit binnen een jaar na
      ontvangst van de jaarrekening bekend aan het algemeen bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel35
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '35'
  - number: '27'
    text: |-
      1 Bij ministeriële regeling kunnen voorschriften worden vastgesteld voor de inrichting van de begroting, het
      bestuursverslag en de jaarrekening.

      2 Bij ministeriële regeling worden voorschriften vastgesteld voor de inrichting van het accountantsprotocol.
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel27
  - number: '45'
    text: |-
      In afwijking van [artikel 5, vierde lid][ref1], en [artikel 13, tweede lid][ref2], vindt de benoeming van de
      eerste leden van de raad van bestuur en de voorzitters van de domeinbesturen plaats op basis van openbaar gemaakte
      functieprofielen en laat Onze Minister zich adviseren door een benoemingsadviescommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004191#Artikel13
    url: https://wetten.overheid.nl/BWBR0004191/2024-10-29#Artikel45
    references:
