  - number: '46'
    text: Deze wet treedt in werking met ingang van 1 februari 1988.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel46
  - number: '47'
    text: 'Deze wet wordt aangehaald als: Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek.'
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel47
