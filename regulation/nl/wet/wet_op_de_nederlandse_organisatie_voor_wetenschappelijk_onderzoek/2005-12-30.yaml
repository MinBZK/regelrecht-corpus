---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_nederlandse_organisatie_voor_wetenschappelijk_onderzoek
regulatory_layer: WET
publication_date: '2024-04-30'
valid_from: '2005-12-30'
bwb_id: BWBR0004191
url: https://wetten.overheid.nl/BWBR0004191/2005-12-30
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de taak en de bestuursstructuur van de Nederlandse
    organisatie voor zuiver-wetenschappelijk onderzoek te wijzigen;

    dat het in verband daarmede noodzakelijk is de regeling van deze organisatie, vervat in de Wet op het Zuiver-
    Wetenschappelijk Onderzoek (Stb. 1950, K5), te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel1
  - number: 1.b
    text: |-
      organisatie: de organisatie, genoemd in [artikel 2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel2
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '2'
        hoofdstuk: I
  - number: 1.c
    text: |-
      reglement: het reglement, bedoeld in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel16
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '16'
        hoofdstuk: II
        paragraaf: '5'
  - number: '2.1'
    text: Er is een organisatie, genaamd Nederlandse organisatie voor wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel2
  - number: '2.2'
    text: De organisatie bezit rechtspersoonlijkheid; zij is gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel2
  - number: '3.1'
    text: |-
      De organisatie heeft tot taak het bevorderen van de kwaliteit van wetenschappelijk onderzoek alsmede het initiëren
      en stimuleren van nieuwe ontwikkelingen in het wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel3
  - number: '3.2'
    text: De organisatie voert haar taak uit in het bijzonder door het toewijzen van middelen.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel3
  - number: '3.3'
    text: |-
      De organisatie bevordert de overdracht van kennis van de resultaten van door haar geïnitieerd en gestimuleerd
      onderzoek ten behoeve van de maatschappij.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel3
  - number: '3.4'
    text: |-
      De organisatie richt zich bij het uitvoeren van haar taak in hoofdzaak op het universitaire onderzoek. Daarbij let
      zij op het aspect van coördinatie en bevordert deze waar nodig.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel3
  - number: '4'
    text: |-
      Aan het algemeen bestuur behoort de bevoegdheid tot regeling en bestuur van de organisatie, voor zover die niet bij
      of krachtens deze wet aan de gebiedsbesturen is opgedragen.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel4
  - number: '5'
    text: |-
      Het algemeen bestuur is verantwoording verschuldigd aan Onze Minister. Het verstrekt aan Onze Minister de gevraagde
      inlichtingen.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel5
  - number: '6.1'
    text: |-
      Het algemeen bestuur bestaat uit een voorzitter en ten hoogste zes overige leden. Het aantal leden wordt bij
      koninklijk besluit bepaald.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel6
  - number: '6.2'
    text: |-
      De voorzitter en de overige leden van het algemeen bestuur worden benoemd bij koninklijk besluit op voordracht
      van Onze Minister, het algemeen bestuur gehoord. De benoeming geschiedt voor een termijn van vijf jaren. De leden
      kunnen éénmaal opnieuw worden benoemd.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel6
  - number: '6.3'
    text: |-
      Onze Minister stelt de Koninklijke Nederlandse Akademie van Wetenschappen en de universiteiten, genoemd in de
      bijlage bij de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], gezamenlijk, in de gelegenheid van
      hun gevoelens te doen blijken over de voordrachten, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '6.4'
    text: |-
      De voorzitter en de overige leden van het algemeen bestuur kunnen bij koninklijk besluit op voordracht van Onze
      Minister, het algemeen bestuur gehoord, om zwaarwichtige redenen worden geschorst en tussentijds ontslagen.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel6
  - number: '6.5'
    text: |-
      Het lidmaatschap van het algemeen bestuur is onverenigbaar met dat van een gebiedsbestuur. Een lid van het
      personeel kan niet worden benoemd tot lid van het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel6
  - number: '7.1'
    text: De voorzitter van het algemeen bestuur vertegenwoordigt de organisatie in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel7
  - number: '7.2'
    text: |-
      Het algemeen bestuur wijst uit zijn midden een vice-voorzitter aan, die bij afwezigheid of ontstentenis van de
      voorzitter deze vervangt.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel7
  - number: '8.1'
    text: Het algemeen bestuur wordt bijgestaan door een algemeen directeur.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel8
  - number: '8.2'
    text: Het algemeen bestuur benoemt, schorst en ontslaat de algemeen directeur.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel8
  - number: '8.3'
    text: De algemeen directeur is belast met de leiding van het bureau van de organisatie.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel8
  - number: '8.4'
    text: Het algemeen bestuur stelt de taakomschrijving van de algemeen directeur vast, de gebiedsbesturen gehoord.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel8
  - number: 8a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden vastgesteld voor de rechtspositie van
      de voorzitter en de andere leden van het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel8a
  - number: '9.1'
    text: Bij reglement wordt vastgesteld voor welke wetenschapsgebieden er gebiedsbesturen zijn.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel9
  - number: '9.2'
    text: |-
      Een gebiedsbestuur is, met inachtneming van door het algemeen bestuur te geven richtlijnen, het instellingsplan,
      bedoeld in [artikel 18, eerste lid][ref1], en de door Onze Minister goedgekeurde begroting, belast met het
      toewijzen van middelen ten behoeve van onderzoeksprojecten en onderzoekprogramma's.


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel18
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: '9.3'
    text: Een gebiedsbestuur adviseert het algemeen bestuur desgevraagd of uit eigen beweging.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel9
  - number: '9.4'
    text: Bij reglement wordt bepaald welke de verdere bevoegdheden van de onderscheiden gebiedsbesturen zijn.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel9
  - number: '9.5'
    text: |-
      Een gebiedsbestuur is verantwoording verschuldigd aan het algemeen bestuur. Het verstrekt aan het algemeen bestuur
      de gevraagde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel9
  - number: '10.1'
    text: |-
      Een gebiedsbestuur bestaat uit een voorzitter en ten hoogste acht overige leden. Het aantal leden wordt door het
      algemeen bestuur bepaald.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel10
  - number: '10.2'
    text: |-
      De voorzitter en de overige leden van een gebiedsbestuur worden benoemd door het algemeen bestuur, op voordracht
      van het zittende gebiedsbestuur. De benoeming geschiedt voor een termijn van drie jaren. De leden kunnen tweemaal
      opnieuw worden benoemd.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel10
  - number: '10.3'
    text: |-
      De voorzitter en de overige leden van een gebiedsbestuur kunnen door het algemeen bestuur, het desbetreffende
      gebiedsbestuur gehoord, worden geschorst en tussentijds ontslagen.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel10
  - number: '10.4'
    text: |-
      Het lidmaatschap van een gebiedsbestuur is onverenigbaar met dat van het algemeen bestuur of van enig ander
      gebiedsbestuur. Een lid van het personeel kan niet worden benoemd tot lid van een gebiedsbestuur.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel10
  - number: '13'
    text: |-
      Het algemeen bestuur voert het personeelsbeleid en personeelsbeheer, daar onder begrepen de bevoegdheid tot het in
      dienst nemen, schorsen en ontslaan van het personeel.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel13
  - number: '14'
    text: |-
      Voor zover bij algemene maatregel van bestuur niet anders is bepaald, is op het personeel van de organisatie het
      bij of krachtens [artikel 4.5. van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] bepaalde van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel4
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '4'
  - number: '15'
    text: |-
      Het bestuur en de inrichting van de organisatie alsmede de bestuurlijke betrekkingen van de organisatie tot de
      onderzoekorganisaties voor zover daaraan krachtens deze wet middelen worden toegewezen, worden nader bij reglement
      geregeld.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel15
  - number: '16.1'
    text: Het reglement wordt vastgesteld door het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel16
  - number: '16.2'
    text: Het reglement of een wijziging daarvan behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel16
  - number: '16.3'
    text: |-
      De goedkeuring kan worden onthouden wegens strijd met het recht of op de grond dat het reglement naar het oordeel
      van Onze Minister een goede taakuitoefening door de organisatie kan belemmeren.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel16
  - number: 16a.1
    text: |-
      Onze Minister stelt het wetenschapsbudget vast. Het wetenschapsbudget heeft betrekking op een tijdvak van ten
      minste vier jaren.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel16a
  - number: 16a.2
    text: |-
      Onze Minister agendeert, in overeenstemming met het gevoelen van de raad van ministers, in het wetenschapsbudget
      beleidsonderwerpen op het terrein van het fundamenteel en toegepast onderzoek.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel16a
  - number: '17.1'
    text: |-
      Het wetenschapsbudget wordt vastgesteld uiterlijk vier jaar na het tijdstip van vaststelling van het vorige
      wetenschapsbudget. Na overleg met de beide Kamers der Staten-Generaal kan het wetenschapsbudget uiterlijk zes
      maanden na het tijdstip, bedoeld in de eerste volzin, worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister biedt uiterlijk zes maanden voorafgaand aan het tijdstip waarop het wetenschapsbudget moet zijn
      vastgesteld, een ontwerp daarvan aan de beide Kamers der Staten-Generaal aan.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel17
  - number: '17.3'
    text: |-
      Over de wijze waarop het vastgestelde wetenschapsbudget wordt openbaar gemaakt, doet Onze Minister mededeling in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel17
  - number: '18.1'
    text: |-
      Het algemeen bestuur stelt, rekening houdend met voorstellen van de gebiedsbesturen, een instellingsplan vast
      uiterlijk vier jaar na het tijdstip van vaststelling van het vorige plan. Het algemeen bestuur zendt het plan na
      vaststelling onverwijld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel18
  - number: '18.2'
    text: |-
      In het instellingsplan wordt tevens rekening gehouden met het wetenschapsbudget, bedoeld in [artikel 16a][ref1], de
      instellingsplannen van universiteiten, verkenningen, rapporten, adviezen en aanbevelingen, een en ander voorzover
      die naar het oordeel van het algemeen bestuur van belang zijn voor de uitvoering van de taken van de organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel16a
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: 16a
        hoofdstuk: III
        paragraaf: '1'
  - number: '18.3'
    text: 'Het instellingsplan omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel18
  - number: 18.3.a
    text: doelstellingen van de organisatie op middellange termijn;
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel18
  - number: 18.3.b
    text: hoofdlijnen van het te voeren beleid en de daarin te stellen prioriteiten;
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel18
  - number: 18.3.c
    text: financiële, personele, materiële en organisatorische voorwaarden die moeten worden vervuld.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel18
  - number: '18.4'
    text: |-
      Onze Minister brengt zijn standpunt over het instellingsplan binnen zes maanden na ontvangst van het plan ter
      kennis van het algemeen bestuur. Onze Minister doet daarvan en van het instellingsplan afschrift toekomen aan de
      beide Kamers van de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel18
  - number: '18.5'
    text: |-
      Onze Minister kan zijn standpunt over het instellingsplan gedurende de looptijd daarvan wijzigen, indien de
      vaststelling van een nieuw wetenschapsbudget daartoe aanleiding geeft. Het vierde lid is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel18
  - number: '19.1'
    text: 'De inkomsten van de organisatie bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel19
  - number: 19.1.a
    text: de bijdrage uit ’s Rijks kas;
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel19
  - number: 19.1.b
    text: inkomsten, die samenhangen met voorzieningen waarvoor de rijksbijdrage is verleend;
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel19
  - number: 19.1.c
    text: andere inkomsten.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel19
  - number: '19.2'
    text: |-
      De rijksbijdrage wordt vastgesteld of nader vastgesteld door de vaststelling of nadere vaststelling bij wet van het
      hoofdstuk van de rijksbegroting waarop zij is voorgesteld. De rijksbijdrage wordt betaald in zodanige termijnen en
      tot zodanige bedragen als voor het doen van de betalingen door de organisatie nodig is.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel19
  - number: '19.3'
    text: |-
      Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop een voorschot betaald overeenkomstig
      door Onze Minister te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel19
  - number: '19.4'
    text: Bij vaststelling van de rijksbijdrage blijven inkomsten als bedoeld in het eerste lid onder c, buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel19
  - number: '19.5'
    text: |-
      Onze Minister stelt regels met betrekking tot de bestemming van saldi die voortvloeien uit de inkomsten, bedoeld in
      het eerste lid onder a en b.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel19
  - number: '20'
    text: |-
      Het algemeen bestuur is belast met het doelmatig beheer van de financiën en de vermogensbestanddelen van de
      organisatie.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel20
  - number: '21.1'
    text: Het algemeen bestuur zendt jaarlijks voor 1 november aan Onze Minister de begroting voor het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel21
  - number: '21.2'
    text: |-
      De begroting behelst een raming van de baten en lasten van de organisatie, een raming van de voorgenomen
      investeringsuitgaven en een raming van de inkomsten en uitgaven. In de begroting is een allocatie van middelen
      opgenomen die in overeenstemming is met het instellingsplan, bedoeld in [artikel 18][ref1]. In de begroting wordt
      rekening gehouden met de voorstellen van de gebiedsbesturen.


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel18
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: '21.3'
    text: |-
      De begrotingsposten worden ieder afzonderlijk van een toelichting voorzien. Uit de toelichting blijkt steeds welke
      begrotingsposten betrekking hebben op de uitoefening van de bij of krachtens de wet aan de organisatie opgedragen
      taken dan wel op andere activiteiten.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel21
  - number: '21.4'
    text: |-
      Tenzij de activiteiten waarop de begroting betrekking heeft nog niet eerder werden verricht, behelst de begroting
      een vergelijking met de begroting van het lopende jaar en de laatst goedgekeurde jaarrekening, bedoeld in
      [artikel 25][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel25
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '25'
        hoofdstuk: III
        paragraaf: '3'
  - number: '22.1'
    text: |-
      Het besluit tot vaststelling van de begroting, bedoeld in [artikel 21, eerste lid][ref1], behoeft de goedkeuring
      van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel21
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '22.2'
    text: |-
      De goedkeuring wordt verleend of onthouden aan de vastgestelde begroting in haar geheel. De goedkeuring kan slechts
      worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel22
  - number: '22.3'
    text: |-
      Indien Onze Minister binnen twee maanden na ontvangst geen toepassing heeft gegeven aan het eerste lid, wordt het
      besluit tot vaststelling van de begroting geacht te zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel22
  - number: '23'
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en de
      begrote baten en lasten dan wel inkomsten en uitgaven, doet het algemeen bestuur daarvan onverwijld mededeling aan
      Onze Minister onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel23
  - number: '24'
    text: |-
      Het algemeen bestuur zendt jaarlijks voor 1 juli het jaarverslag aan Onze Minister. Het jaarverslag beschrijft de
      taakuitoefening en het gevoerde beleid en geeft aan in hoeverre de doelstellingen uit het instellingsplan, bedoeld
      in artikel 18, zijn verwezenlijkt.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel24
  - number: '25.1'
    text: Gelijktijdig met het jaarverslag dient het algemeen bestuur de jaarrekening bij Onze Minister in.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel25
  - number: '25.2'
    text: Het besluit tot vaststelling van de jaarrekening behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel25
  - number: '25.3'
    text: |-
      De goedkeuring kan slechts worden onthouden wegens strijd met het recht of het algemeen belang dan wel op de
      grond dat de jaarrekening naar het oordeel van Onze Minister niet of niet voldoende in overeenstemming is met het
      instellingsplan. [Artikel 10:30 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '25.4'
    text: |-
      Indien Onze Minister binnen één jaar na ontvangst geen toepassing heeft gegeven aan het tweede lid, wordt het
      besluit tot vaststelling van de jaarrekening geacht te zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel25
  - number: '26.1'
    text: |-
      De jaarrekening, waarin rekening en verantwoording wordt afgelegd van het financieel beheer en van de geleverde
      prestaties over het verstreken boekjaar, wordt ingericht zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '26.2'
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door het algemeen
      bestuur aangewezen accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].
      Bij de aanwijzing van de accountant bedingt het algemeen bestuur dat aan Onze Minister desgevraagd inzicht wordt
      geboden in de controlewerkzaamheden van de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '26.3'
    text: |-
      De verklaring, bedoeld in het tweede lid, heeft mede betrekking op de rechtmatige inning en besteding van de
      middelen door de organisatie.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel26
  - number: '26.4'
    text: |-
      De accountant voegt bij de verklaring, bedoeld in het tweede lid, tevens een verslag van zijn bevindingen over de
      vraag of het beheer en inrichting van de werkzaamheden van de organisatie voldoen aan eisen van doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel26
  - number: '26.5'
    text: |-
      Indien uitgaven zijn geschied in strijd met het bepaalde bij of krachtens de wet, dan wel indien werkzaamheden
      ten behoeve waarvan de rijksbijdrage is verleend, niet behoorlijk zijn uitgevoerd of de rijksbijdrage ondoelmatig
      is aangewend, kan Onze Minister, onverminderd [artikel 25][ref1], bepalen dat de daarmee gemoeide bedragen in
      mindering worden gebracht op de rijksbijdrage. Hij maakt dit binnen een jaar na de ontvangst van de jaarrekening
      bekend aan het algemeen bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel25
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '25'
        hoofdstuk: III
        paragraaf: '3'
  - number: '27'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld voor de inrichting van de begroting, het
      jaarverslag en de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel27
  - number: '30'
    text: |-
      Een belanghebbende kan tegen een besluit van een gebiedsbestuur administratief beroep instellen bij het algemeen
      bestuur.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel30
  - number: '31.1'
    text: De besluiten van het algemeen bestuur kunnen bij koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel31
  - number: '31.2'
    text: Het koninklijk besluit tot schorsing of vernietiging wordt in het *Staatsblad* geplaatst.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel31
  - number: '32.1'
    text: De besluiten van een gebiedsbestuur kunnen door het algemeen bestuur worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel32
  - number: '32.2'
    text: |-
      In afwijking van [artikel 10:44, derde lid, van de Algemene wet bestuursrecht][ref1] kan de schorsing niet langer
      duren dan 17 weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '33.1'
    text: |-
      Indien het algemeen bestuur naar het oordeel van Onze Minister zijn taak ernstig verwaarloost, kan Onze Minister de
      noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel33
  - number: '33.2'
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat het algemeen bestuur
      in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog zijn taak naar behoren uit
      te voeren.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel33
  - number: '33.3'
    text: |-
      Onze Minister stelt de beide Kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004191/2005-12-30#Artikel33
  - number: '41'
    text: |-
      Het instellingsplan, bedoeld in [artikel 18][ref1], wordt voor de eerste maal uitgebracht in het jaar 2006. Tot
      het tijdstip van kennisname van het standpunt door het algemeen bestuur, bedoeld in [artikel 18, vierde lid][ref2],
      wordt, voor de toepassing van de [artikelen 9, tweede lid][ref3], [21, tweede lid][ref4], en [25, derde lid][ref5],
      de beleidsnota, bedoeld in [artikel 17][ref6] zoals die bepaling luidde op de dag voorafgaande aan de
      inwerkingtreding van deze wet, beschouwd als instellingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004191#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0004191#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0004191#Artikel21
