preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de taak en de bestuursstructuur van de Nederlandse
    organisatie voor zuiver-wetenschappelijk onderzoek te wijzigen;

    dat het in verband daarmede noodzakelijk is de regeling van deze organisatie, vervat in de Wet op het Zuiver-
    Wetenschappelijk Onderzoek (Stb. 1950, K5), te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;

      b. organisatie: de organisatie, genoemd in [artikel 2, eerste lid][ref1];

      c. reglement: het reglement, bedoeld in [artikel 16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004191#Artikel16
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004191
        artikel: '16'
        hoofdstuk: II
        paragraaf: '5'
  - number: '2'
    text: |-
      1 Er is een organisatie, genaamd Nederlandse organisatie voor wetenschappelijk onderzoek.

      2 De organisatie bezit rechtspersoonlijkheid; zij is gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel2
  - number: 2a
    text: |-
      Op de organisatie is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing met uitzondering van
      [artikel 15 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel15
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '15'
  - number: '3'
    text: |-
      1 De organisatie heeft tot taak het bevorderen van de kwaliteit van wetenschappelijk onderzoek alsmede het
      initiëren en stimuleren van nieuwe ontwikkelingen in het wetenschappelijk onderzoek.

      2 De organisatie voert haar taak uit in het bijzonder door het toewijzen van middelen.

      3 De organisatie bevordert de overdracht van kennis van de resultaten van door haar geïnitieerd en gestimuleerd
      onderzoek ten behoeve van de maatschappij.

      4 De organisatie richt zich bij het uitvoeren van haar taak in hoofdzaak op het universitaire onderzoek. Daarbij
      let zij op het aspect van coördinatie en bevordert deze waar nodig.
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel3
  - number: '4'
    text: |-
      1 Aan het algemeen bestuur behoort de bevoegdheid tot regeling en bestuur van de organisatie.

      2 Het algemeen bestuur is, met inachtneming van het instellingsplan, bedoeld in [artikel 18, eerste lid][ref1],
      en de door Onze Minister goedgekeurde begroting, belast met het toewijzen van middelen ten behoeve van
      onderzoeksprojecten en onderzoeksprogramma’s.


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel18
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: '6'
    text: |-
      1 Het algemeen bestuur bestaat uit een voorzitter en ten hoogste zes overige leden. Het aantal leden wordt door
      Onze Minister vastgesteld.

      2 Onverminderd [artikel 12 van de Kaderwet zelfstandige bestuursorganen][ref1], worden de voorzitter en de overige
      leden van het algemeen bestuur benoemd door Onze Minister, het algemeen bestuur gehoord. De benoeming geschiedt
      voor een termijn van ten hoogste vijf jaren. De leden kunnen éénmaal opnieuw worden benoemd.

      3 Onze Minister stelt de Koninklijke Nederlandse Akademie van Wetenschappen en de universiteiten, genoemd in de
      bijlage bij de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], gezamenlijk, in de gelegenheid van
      hun gevoelens te doen blijken over een voornemen tot benoeming als bedoeld in het tweede lid.

      4 Het lidmaatschap van het algemeen bestuur is onverenigbaar met dat van een gebiedsbestuur. Een lid van het
      personeel kan niet worden benoemd tot lid van het algemeen bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0005682
  - number: '7'
    text: |-
      1 De voorzitter van het algemeen bestuur vertegenwoordigt de organisatie in en buiten rechte.

      2 Het algemeen bestuur wijst uit zijn midden een vice-voorzitter aan, die bij afwezigheid of ontstentenis van de
      voorzitter deze vervangt.
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel7
  - number: '8'
    text: |-
      1 Het algemeen bestuur wordt bijgestaan door een algemeen directeur.

      2 Het algemeen bestuur benoemt, schorst en ontslaat de algemeen directeur.

      3 De algemeen directeur is belast met de leiding van het bureau van de organisatie.

      4 Het algemeen bestuur stelt de taakomschrijving van de algemeen directeur vast, de gebiedsbesturen gehoord.
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel8
  - number: '9'
    text: |-
      1 Het algemeen bestuur kan voor een wetenschapsgebied een gebiedsbestuur instellen.

      2 Onverminderd mandaatverlening aan andere organisaties dan gebiedsbesturen, kan het algemeen bestuur aan een
      gebiedsbestuur mandaat verlenen om, met inachtneming van door het algemeen bestuur te geven richtlijnen, het
      instellingsplan, bedoeld in [artikel 18, eerste lid][ref1], en de door Onze Minister goedgekeurde begroting,
      middelen te verstrekken ten behoeve van onderzoeksprojecten en onderzoeksprogramma’s.

      3 Een gebiedsbestuur adviseert het algemeen bestuur desgevraagd of uit eigen beweging.

      4 Bij reglement wordt bepaald welke de verdere bevoegdheden en inrichting van een gebiedsbestuur zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel18
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: '13'
    text: |-
      Het algemeen bestuur voert het personeelsbeleid en personeelsbeheer, daar onder begrepen de bevoegdheid tot het in
      dienst nemen, schorsen en ontslaan van het personeel.
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel13
  - number: '14'
    text: |-
      Voor zover bij algemene maatregel van bestuur niet anders is bepaald, is op het personeel van de organisatie het
      bij of krachtens [artikel 4.5. van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] bepaalde van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel4.5
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '4.5'
  - number: '15'
    text: |-
      Het bestuur en de inrichting van de organisatie alsmede de bestuurlijke betrekkingen van de organisatie tot de
      onderzoekorganisaties voor zover daaraan krachtens deze wet middelen worden toegewezen, worden nader bij reglement
      geregeld.
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel15
  - number: '16'
    text: |-
      Onverminderd [artikel 11 van de Kaderwet zelfstandige bestuursorganen][ref1] wordt het reglement vastgesteld door
      het algemeen bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel11
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '11'
  - number: 16a
    text: |-
      1 Onze Minister stelt het wetenschapsbudget vast. Het wetenschapsbudget heeft betrekking op een tijdvak van ten
      minste vier jaren.

      2 Onze Minister agendeert, in overeenstemming met het gevoelen van de raad van ministers, in het wetenschapsbudget
      beleidsonderwerpen op het terrein van het fundamenteel en toegepast onderzoek.
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel16a
  - number: '17'
    text: |-
      1 Het wetenschapsbudget wordt vastgesteld uiterlijk vier jaar na het tijdstip van vaststelling van het vorige
      wetenschapsbudget. Na overleg met de beide Kamers der Staten-Generaal kan het wetenschapsbudget uiterlijk zes
      maanden na het tijdstip, bedoeld in de eerste volzin, worden vastgesteld.

      2 Onze Minister biedt uiterlijk zes maanden voorafgaand aan het tijdstip waarop het wetenschapsbudget moet zijn
      vastgesteld, een ontwerp daarvan aan de beide Kamers der Staten-Generaal aan.

      3 Over de wijze waarop het vastgestelde wetenschapsbudget wordt openbaar gemaakt, doet Onze Minister mededeling in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel17
  - number: '18'
    text: |-
      1 Het algemeen bestuur stelt, rekening houdend met voorstellen van de gebiedsbesturen, een instellingsplan vast
      uiterlijk vier jaar na het tijdstip van vaststelling van het vorige plan. Het algemeen bestuur zendt het plan na
      vaststelling onverwijld aan Onze Minister.

      2 In het instellingsplan wordt tevens rekening gehouden met het wetenschapsbudget, bedoeld in [artikel 16a][ref1],
      de instellingsplannen van universiteiten, verkenningen, rapporten, adviezen en aanbevelingen, een en ander
      voorzover die naar het oordeel van het algemeen bestuur van belang zijn voor de uitvoering van de taken van de
      organisatie.

      3 Het instellingsplan omvat in elk geval:

      a. doelstellingen van de organisatie op middellange termijn;

      b. hoofdlijnen van het te voeren beleid en de daarin te stellen prioriteiten;

      c. financiële, personele, materiële en organisatorische voorwaarden die moeten worden vervuld.

      4 Onze Minister brengt zijn standpunt over het instellingsplan binnen zes maanden na ontvangst van het plan ter
      kennis van het algemeen bestuur. Onze Minister doet daarvan en van het instellingsplan afschrift toekomen aan de
      beide Kamers van de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel16a
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: 16a
        hoofdstuk: III
        paragraaf: '1'
  - number: '19'
    text: |-
      1 De inkomsten van de organisatie bestaan uit:

      a. de bijdrage uit ’s Rijks kas;

      b. inkomsten, die samenhangen met voorzieningen waarvoor de rijksbijdrage is verleend;

      c. andere inkomsten.

      2 De rijksbijdrage wordt vastgesteld of nader vastgesteld door de vaststelling of nadere vaststelling bij wet van
      het hoofdstuk van de rijksbegroting waarop zij is voorgesteld. De rijksbijdrage wordt betaald in zodanige termijnen
      en tot zodanige bedragen als voor het doen van de betalingen door de organisatie nodig is.

      3 Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop een voorschot betaald
      overeenkomstig door Onze Minister te stellen regelen.

      4 Bij vaststelling van de rijksbijdrage blijven inkomsten als bedoeld in het eerste lid onder c, buiten
      beschouwing.
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel19
  - number: '20'
    text: |-
      Het algemeen bestuur is belast met het doelmatig beheer van de financiën en de vermogensbestanddelen van de
      organisatie.
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel20
  - number: '21'
    text: |-
      1 Het algemeen bestuur zendt jaarlijks voor 1 november aan Onze Minister de begroting voor het daaropvolgende jaar.

      2 Onverminderd de [artikelen 26 tot en met 30 van de Kaderwet zelfstandige bestuursorganen][ref1], is in de
      begroting een allocatie van middelen opgenomen die in overeenstemming is met het instellingsplan, bedoeld in
      [artikel 18][ref2]. In de begroting wordt rekening gehouden met de voorstellen van de gebiedsbesturen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004191#Artikel18
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0004191
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24'
    text: |-
      Onverminderd [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref1] geeft het bestuursverslag aan in
      hoeverre de doelstellingen uit het instellingsplan, bedoeld in [artikel 18][ref2], zijn verwezenlijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004191#Artikel18
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0004191
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
  - number: '25'
    text: |-
      De goedkeuring, bedoeld in [artikel 34, derde lid, van de Kaderwet zelfstandige bestuursorganen][ref1],
      kan tevens worden onthouden op de grond dat de jaarrekening naar het oordeel van Onze Minister niet
      of niet voldoende in overeenstemming is met het instellingsplan, bedoeld in [artikel 18][ref2].
      [Artikel 10:30 van de Algemene wet bestuursrecht][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004191#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel1030
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0004191
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: 10:30
  - number: '26'
    text: |-
      Onverminderd [artikel 35 van de Kaderwet zelfstandige bestuursorganen][ref1] kan Onze Minister, indien uitgaven
      zijn geschied in strijd met het bepaalde bij of krachtens de wet, dan wel indien werkzaamheden ten behoeve waarvan
      de rijksbijdrage is verleend, niet behoorlijk zijn uitgevoerd of de rijksbijdrage ondoelmatig is aangewend, bepalen
      dat de daarmee gemoeide bedragen in mindering worden gebracht op de rijksbijdrage. Hij maakt dit binnen een jaar na
      ontvangst van de jaarrekening bekend aan het algemeen bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel35
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '35'
  - number: '27'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld voor de inrichting van de begroting, het
      bestuursverslag en de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel27
  - number: '46'
    text: Deze wet treedt in werking met ingang van 1 februari 1988.
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel46
  - number: '47'
    text: 'Deze wet wordt aangehaald als: Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek.'
    url: https://wetten.overheid.nl/BWBR0004191/2015-11-01#Artikel47
