preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat wettelijke voorzieningen moeten worden getroffen ter uitvoering van
    het op 25 juni 1998 te Aarhus (Denemarken) totstandgekomen Verdrag betreffende toegang tot informatie, inspraak
    bij besluitvorming en toegang tot de rechter inzake milieuaangelegenheden, door middel van wijziging van de Wet
    milieubeheer, de Wet openbaarheid van bestuur en enige andere wetten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017266/2005-02-14#ArtikelAanhef
articles:
  - number: VIII
    text: |-
      Op de ten tijde van de inwerkingtreding van deze wet ingestelde beroepen tegen beschikkingen op grond van de
      [Wet openbaarheid van bestuur][ref1] dan wel de [Archiefwet 1995][ref2], blijven de bepalingen van voornoemde
      wetten, zoals die luidden vóór de inwerkingtreding van deze wet, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0017266/2005-02-14#ArtikelVIII
    references:
