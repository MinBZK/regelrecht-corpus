regulatory_layer: WET
publication_date: '2009-07-31'
valid_from: '2009-08-01'
bwb_id: BWBR0026196
url: https://wetten.overheid.nl/BWBR0026196/2009-08-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de in de Pensioenwet, de Sanctiewet 1977,
    de Wet financiële betrekkingen buitenland 1994, de Wet inzake de geldtransactiekantoren, de Wet op het
    financieel toezicht, de Wet ter voorkoming van witwassen en financieren van terrorisme, de Wet toezicht
    accountantsorganisaties, de Wet toezicht trustkantoren, de Wet verplichte beroepspensioenregeling en de Wet
    verplichte deelneming in een bedrijfstakpensioenfonds 2000 opgenomen regels met betrekking tot de uitoefening van
    de bevoegdheid tot het opleggen van een bestuurlijke boete te wijzigen teneinde de handhaving van deze wetten te
    verbeteren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0026196/2009-08-01#ArtikelAanhef
articles:
  - number: XII
    text: |-
      Ter zake van overtredingen die hebben plaatsgevonden of zijn aangevangen voor het tijdstip van inwerkingtreding van
      deze wet, blijft het recht zoals dat gold voor dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0026196/2009-08-01#ArtikelXII
  - number: XIII
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0026196/2009-08-01#ArtikelXIII
  - number: XIV
    text: 'Deze wet wordt aangehaald als: Wet wijziging boetestelsel financiële wetgeving.'
    url: https://wetten.overheid.nl/BWBR0026196/2009-08-01#ArtikelXIV
