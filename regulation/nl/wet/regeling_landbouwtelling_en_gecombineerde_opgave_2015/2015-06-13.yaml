  - number: '3'
    text: |-
      1 Het formulier heeft betrekking op de periode van 1 april 2015 tot en met 15 mei 2015.

      2 De periode, bedoeld in het eerste lid, is het tijdvak waarin een landbouwtelling als bedoeld in
      [artikel 25, eerste lid, van de Landbouwwet][ref1] wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel25
    url: https://wetten.overheid.nl/BWBR0036489/2015-06-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '25'
  - number: '4'
    text: |-
      1 Een opgaveplichtige verstrekt:

      a. informatie naar de toestand van de veestapel zoals die was op 1 april 2015,

      b. informatie over de toestand van de beteelde percelen zoals die is of wordt verwacht op 15 mei 2015, en

      c. de naam van het gewas waarmee een perceel zal worden beteeld, als dat niet is beteeld op 15 mei 2015.

      2 Een opgaveplichtige verstrekt overige informatie naar de toestand op zijn onderneming op het moment van
      ondertekening van het formulier.
    url: https://wetten.overheid.nl/BWBR0036489/2015-06-13#Artikel4
  - number: '5'
    text: |-
      1 Betalingen uit het Diergezondheidsfonds voor maatregelen en voorzieningen die verband houden met de preventie
      en de bestrijding van besmettelijke dierziekten worden verricht met inachtneming van Deel I en Deel II, onderdeel
      1.2.1.3, van de staatssteunrichtsnoeren.

      2 Om aanspraak te kunnen maken op betalingen die verband houden met preventie van besmettelijke dierziekten als
      bedoeld in het eerste lid, in de periode die loopt van 15 mei 2015 tot 15 mei 2016, dient door de houder uiterlijk
      op 15 juni 2015 bij de minister een daartoe strekkende opgave te zijn ingediend door middel van het formulier
      Diergezondheidsfonds.

      3 De houder kan geen aanspraak maken op betalingen als bedoeld in het eerste lid, indien:

      a. de onderneming die de houder drijft, een onderneming in moeilijkheden is als bedoeld in punt 35, onderdeel 15,
      van de staatssteunrichtsnoeren; of

      b. ten aanzien van de onderneming die de houder drijft, een bevel tot terugvordering uitstaat als bedoeld in punt
      27 van de staatssteunrichtsnoeren.
    url: https://wetten.overheid.nl/BWBR0036489/2015-06-13#Artikel5
  - number: '6'
    text: |-
      Het formulier en het formulier Diergezondheidsfonds kunnen door de opgaveplichtige respectievelijk de houder langs
      elektronische weg worden ingevuld, ondertekend en ingediend op het internetadres www.mijnrvo.nl.
    url: https://wetten.overheid.nl/BWBR0036489/2015-06-13#Artikel6
  - number: '7'
    text: |-
      1 Een opgaveplichtige of de houder kan op de volgende wijzen elektronisch toegang krijgen tot het formulier en het
      formulier Diergezondheidsfonds:

      a. in geval er sprake is van een verplichting tot registratie bij de Kamer van Koophandel op grond van
      [artikel 5 van de Handelsregisterwet 2007][ref1], aan de hand van een E-herkenningsmiddel;

      b. voor natuurlijke personen die niet vallen onder de verplichting tot registratie bij de Kamer van Koophandel op
      grond van [artikel 5 van de Handelsregisterwet 2007][ref2], aan de hand van DigiD; of

      c. aan de hand van een toegangscode die door de minister is verstrekt aan een opgaveplichtige of een houder in
      het buitenland.

      2 De minister verstrekt aan een opgaveplichtige, een houder of de gemachtigde van een opgaveplichtige of een houder
      een tancode ter ondertekening van het elektronisch formulier.

      3 De minister kan besluiten geen tancode te verstrekken of al verstrekte tancodes in te trekken indien de
      ondertekenaar, een met de ondertekenaar geassocieerd bedrijf, of een met de ondertekenaar geassocieerde organisatie
      in het verleden een tancode heeft gebruikt in strijd met deze regeling of op andere wijze de integriteit van een
      verstrekte handtekening heeft geschonden.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel5
    url: https://wetten.overheid.nl/BWBR0036489/2015-06-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '5'
  - number: '8'
    text: |-
      1 De minister neemt een elektronisch verzonden formulier of formulier Diergezondheidsfonds dat niet overeenkomstig
      deze regeling is ingediend niet in behandeling.

      2 De minister neemt een elektronisch verzonden bericht waarvan de betrouwbaarheid of vertrouwelijkheid onvoldoende
      is gewaarborgd, gelet op de aard en de inhoud van het bericht en het doel waarvoor het wordt gebruikt, niet in
      behandeling.

      3 De minister informeert degene die het elektronisch verzonden formulier of formulier Diergezondheidsfonds heeft
      ondertekend zo spoedig mogelijk over een besluit als bedoeld in het eerste of het tweede lid.
    url: https://wetten.overheid.nl/BWBR0036489/2015-06-13#Artikel8
  - number: '9'
    text: |-
