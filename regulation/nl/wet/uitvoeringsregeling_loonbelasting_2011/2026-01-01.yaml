  - number: 8.4b
    text: |-
      1 Iedere inhoudingsplichtige die ingevolge [artikel 32, eerste lid, van de wet][ref1] samen met andere
      inhoudingsplichtigen als één inhoudingsplichtige wordt beschouwd legt in zijn administratie vast:

      a. het door hem verstrekte loon waarover in het kalenderjaar met toepassing van de [artikelen 20a][ref2],
      [20b][ref3], [26][ref4] en [26b van de wet][ref5] belasting is geheven;

      b. het door hem verstrekte loon dat ingevolge [artikel 31a, vijftiende lid, van de wet][ref6] bij de bepaling van
      het loon, bedoeld in artikel 31a, tweede lid, van de wet, buiten beschouwing wordt gelaten;

      c. de in het kalenderjaar ingevolge [artikel 31, eerste lid, onderdeel f en onderdeel g, van de wet][ref7] door
      hem aangewezen vergoedingen en verstrekkingen, met uitzondering van de vergoedingen en verstrekkingen die ingevolge
      [artikel 31a, tweede lid, van de wet][ref8] naast de vrije ruimte zoals bepaald in artikel 31a, derde lid, van de
      wet, met inachtneming van artikel 31a, vijftiende lid, van de wet, in mindering komen;

      d. van de andere inhoudingsplichtigen, bedoeld in de aanhef, per inhoudingsplichtige:

      1°. de naam en het voor de loonbelasting, premie voor de volksverzekeringen, premies werknemersverzekeringen en
      inkomensafhankelijke bijdrage Zorgverzekeringswet geldende identificatienummer (loonheffingennummer);

      2°. het door die inhoudingsplichtige verstrekte loon waarover in het kalenderjaar met toepassing van de
      [artikelen 20a][ref9], [20b][ref10], [26][ref11] en [26b van de wet][ref12] belasting is geheven;

      3°. het door die inhoudingsplichtige verstrekte loon dat ingevolge [artikel 31a, vijftiende lid, van de wet][ref13]
      bij de bepaling van het loon, bedoeld in artikel 31a, tweede lid, van de wet, buiten beschouwing wordt gelaten;

      4°. de in het kalenderjaar ingevolge [artikel 31, eerste lid, onderdeel f en onderdeel g, van de wet][ref14]
      door die inhoudingsplichtige aangewezen vergoedingen en verstrekkingen, met uitzondering van de vergoedingen en
      verstrekkingen die ingevolge [artikel 31a, tweede lid, van de wet][ref15] naast de vrije ruimte zoals bepaald in
      artikel 31a, derde lid, van de wet, met inachtneming van artikel 31a, vijftiende lid, van de wet, in mindering
      komen;

      e. de berekening van de gezamenlijk verschuldigde belasting, bedoeld in
      [artikel 32, eerste lid, van de wet][ref16], en, ingeval deze belasting meer bedraagt dan nihil, de naam en het
      loonheffingennummer van de inhoudingsplichtige die deze belasting heeft aangegeven en afgedragen.

      2 Van verwevenheid in financieel, organisatorisch en economisch opzicht tussen inhoudingsplichtige stichtingen als
      bedoeld in [artikel 32, tweede lid, van de wet][ref17] is sprake indien statutair is vastgelegd dat:

      a. het bestuur van een van de stichtingen, bedoeld in de aanhef, de bestuursleden van de andere stichtingen,
      bedoeld in de aanhef, benoemt of een bindende voordracht doet voor de benoeming van die bestuursleden;

      b. bij vereffening bij faillissement of opheffing van een stichting als bedoeld in de aanhef het vermogen van die
      stichting wordt overgedragen aan een van de andere stichtingen, bedoeld in de aanhef.


