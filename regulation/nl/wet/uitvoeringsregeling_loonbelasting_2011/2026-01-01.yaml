  - number: '7.3'
    text: |-
      1 De inhoudingsplichtige administreert bij de loonadministratie de gegevens met betrekking tot uitkeringen en
      verstrekkingen als bedoeld in [artikel 11, eerste lid, onderdelen m en o, van de wet][ref1].

      2 De inhoudingsplichtige kan de in het eerste lid bedoelde gegevens op een andere plaats administreren dan bij de
      loonadministratie, mits:

      a. hij dit onder vermelding van de nieuwe bewaarplaats vooraf meldt aan de inspecteur, en

      b. de gegevens op verzoek van de inspecteur voor controle beschikbaar komen op de plaats waar de loonadministratie
      wordt gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
