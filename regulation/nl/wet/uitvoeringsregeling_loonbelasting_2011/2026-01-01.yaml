  - number: '2.2'
    text: |-
      1 De arbeidsverhouding van degene die als sekswerker persoonlijk arbeid verricht, wordt niet als dienstbetrekking
      beschouwd, indien aan de volgende voorwaarden wordt voldaan:

      a. met betrekking tot de arbeidsverhouding van de sekswerker wordt voldaan aan de in het tweede lid bedoelde
      voorwaarden;

      b. met betrekking tot de inkomsten van de sekswerker wordt voldaan aan de in het derde lid bedoelde voorwaarden;

      c. de exploitant leeft de bepalingen van de Algemene verordening gegevensbescherming alsmede
      [artikel 67 van de Algemene wet inzake rijksbelastingen][ref1] na;

      d. [artikel 2g van het besluit][ref2] wordt toegepast;

      e. de exploitant verstrekt het voorlichtingsmateriaal van de Belastingdienst over de arbeidsverhouding van degene
      die als sekswerker persoonlijk arbeid verricht, aan de sekswerker;

      f. de exploitant heeft met de sekswerker een schriftelijke overeenkomst gesloten waarin wordt verklaard dat aan de
      onderdelen a tot en met e zal worden voldaan;

      g. de exploitant voldoet met betrekking tot al zijn arbeidsverhoudingen met degenen die als sekswerker persoonlijk
      arbeid verrichten, aan de onderdelen a tot en met f;

      h. de exploitant draagt, binnen de geldende betalingstermijnen, de verschuldigde loonbelasting, premie
      volksverzekeringen, omzetbelasting en inkomensafhankelijke bijdrage [Zorgverzekeringswet][ref3] af en leeft
      [hoofdstuk 7][ref4] na;

      i. de administratie van de exploitant is duidelijk en inzichtelijk en de exploitant voldoet aan
      [artikel 52 van de Algemene wet inzake rijksbelastingen][ref5];

      j. de exploitant heeft een vergunning voor het bedrijfsmatig geven van gelegenheid tot het verrichten van seksuele
      handelingen met of voor een derde tegen betaling indien dat vereist is op grond van de daarvoor geldende regels;

      k. de exploitant is met de Belastingdienst schriftelijk overeengekomen dat hij zal voldoen aan de voorwaarden in
      dit lid.

      2 De in het eerste lid, onderdeel a, bedoelde voorwaarden met betrekking tot de arbeidsverhouding van de sekswerker
      zijn dat:

      a. de sekswerker werkzaamheden kan weigeren en de eigen werktijden bepaalt;

      b. de sekswerker vrij is in de kledingkeuze, mits de gekozen kleding gangbaar is in de branche;

      c. de sekswerker mag weigeren om alcohol te drinken, en

      d. de sekswerker vrij is in de keuze van een medische begeleider.

      3 De in het eerste lid, onderdeel b, bedoelde voorwaarden met betrekking tot de inkomsten van de sekswerker zijn
      dat:

      a. de afspraken met betrekking tot de inkomsten schriftelijk zijn vastgelegd en worden nageleefd, en door de
      werkgever bij de administratie worden bewaard;

      b. de exploitant bij iedere uitbetaling van inkomsten een overzicht aan de sekswerker verstrekt en aan het eind van
      het jaar een jaaroverzicht van de inkomsten verstrekt;

      c. de inkomsten direct opeisbaar zijn;

      d. de exploitant de sekswerker geen boeten volgens een boetesysteem of vergelijkbaar systeem in rekening brengt, en

      e. de vergoeding voor extra werkzaamheden, die niet vooraf zijn overeengekomen met een cliënt, volledig toekomt aan
      de sekswerker.

      4 Voor de toepassing van dit artikel wordt verstaan onder:

      a. *inkomsten van de sekswerker:* al hetgeen door de sekswerker uit de arbeidsverhouding met de exploitant wordt
      genoten;

      b. *exploitant:* degene op wie de verplichting rust het loon van de sekswerker te betalen.


