  - number: '7.7'
    text: |-
      Indien een inhoudingsplichtige in enig tijdvak voorziet dat hij gerekend vanaf het einde van dat tijdvak ten
      minste 12 maanden geen inhoudingsplichtige zal zijn, doet hij daarvan binnen een maand na afloop van dat tijdvak
      mededeling aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel7.7
  - number: '7.8'
    text: |-
      1 Indien de gewezen inhoudingsplichtige binnen de in [artikel 28a, tweede lid, onderdelen a of c, van de wet][ref1]
      bedoelde termijn constateert dat hij een onjuiste of onvolledige aangifte heeft gedaan, is hij verplicht binnen
      acht weken na deze constatering al dan niet door middel van een correctiebericht alsnog de juiste en volledige
      gegevens te verstrekken.

      2 Indien de inspecteur ten aanzien van de gewezen inhoudingsplichtige binnen de in
      [artikel 28a, tweede lid, onderdelen b of d, van de wet][ref2] bedoelde termijn constateert dat deze een onjuiste
      of onvolledige aangifte heeft gedaan, kan hij deze verplichten binnen een door hem te stellen termijn al dan niet
      door middel van een correctiebericht alsnog de juiste en volledige gegevens te verstrekken.

      3 Voor de inhoudingsplichtige voor wie het tijdvak waarover de loonbelasting moet worden
      betaald een kalenderhalfjaar of kalenderjaar is, geldt in afwijking in zoverre van
      [artikel 28a, tweede lid, onderdelen a en c, van de wet][ref3] dat het correctiebericht met de juiste en volledige
      gegevens binnen acht weken na de constatering van de onjuistheid of onvolledigheid moet worden verstrekt.

      4 Ten aanzien van de inhoudingsplichtige voor wie het tijdvak waarover de loonbelasting moet
      worden betaald een kalenderhalfjaar of kalenderjaar is, geldt in afwijking in zoverre van
      [artikel 28a, tweede lid, onderdelen b en d, van de wet][ref4] dat het correctiebericht met de juiste en volledige
      gegevens binnen een door de inspecteur te stellen termijn moet worden verstrekt.

      5 Indien een correctiebericht betrekking heeft op een aangifte over een tijdvak in een verstreken kalenderjaar kan:

      a. de inhoudingsplichtige, in afwijking van [artikel 28a, tweede lid, onderdeel c, van de wet][ref5], dat
      correctiebericht binnen acht weken na de constatering van de onjuistheid of onvolledigheid los van een aangifte aan
      de inspecteur toezenden;

      b. de inspecteur, in afwijking van [artikel 28a, tweede lid, onderdeel d, van de wet][ref6], de inhoudingsplichtige
      verplichten dat correctiebericht al dan niet gelijktijdig met een aangifte binnen een door hem te stellen termijn
      aan hem toe te zenden.


