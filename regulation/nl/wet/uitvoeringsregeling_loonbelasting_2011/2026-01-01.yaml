  - number: '8.6'
    text: |-
      1 Voor de toepassing van [artikel 32ba van de wet][ref1] wordt een uitkering, een bijdrage of een premie eveneens
      beschouwd niet te drukken op een inhoudingsplichtige voor zover de inhoudingsplichtige aannemelijk maakt dat hij
      ter zake op een later moment bedragen van werknemers gaat inhouden of van andere inhoudingsplichtigen bijdragen of
      premies voldaan gaat krijgen.

      2 Indien de in het eerste lid bedoelde inhouding of voldoening niet binnen een jaar na het in
      [artikel 32ba, tweede lid, van de wet][ref2] bedoelde tijdstip heeft plaatsgevonden, wordt de uitkering, de
      bijdrage of de premie op dat moment geacht op de inhoudingsplichtige te drukken.

      3 Voor de toepassing van [artikel 32ba, derde lid, van de wet][ref3] blijven bedragen die de inhoudingsplichtige
      van werknemers heeft ingehouden buiten aanmerking, voor zover deze bedragen ingevolge de op het moment van
      inhouding ter zake van deze inhouding geldende tekst van [artikel 11 van de wet][ref4] niet tot het loon behoren.

      4 Voor de toepassing van [artikel 32ba, derde lid, van de wet][ref5] blijven bijdragen en premies die de
      inhoudingsplichtige van andere inhoudingsplichtigen voldaan heeft gekregen buiten aanmerking, voor zover artikel
      32ba, eerste lid, van de wet bij die andere inhoudingsplichtigen niet van toepassing is geweest op deze bijdragen
      en premies.


