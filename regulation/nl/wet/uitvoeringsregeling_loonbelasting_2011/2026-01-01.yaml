  - number: '8.2'
    text: |-
      De verklaring, bedoeld in [artikel 31a, tweede lid, onderdeel d, van de wet][ref1], wordt afgegeven door de door
      de Stichting van de Arbeid in dat kader benoemde uitvoeringsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31a
