  - number: '3.0'
    text: |-
      1 Bij opkoop van een deel van de aandelen van een niet-beursgenoteerde onderneming waarin
      werknemers aandelen hebben verkregen bij uitoefening van een aandelenoptierecht als bedoeld in
      [artikel 10a, eerste lid, van de wet][ref1], waarop artikel 10a, eerste lid, onderdeel a, van de wet nog geen
      toepassing heeft gevonden en waarbij voor deze aandelen op basis van inschrijving door de inhoudingsplichtige wordt
      bepaald welke werknemer voor welk deel zijn aandelen kan vervreemden, worden deze aandelen geacht verhandelbaar te
      worden in de zin van artikel 10a, eerste lid, onderdeel a, onder 2°, van de wet voor:

      a. een werknemer die zich heeft ingeschreven: voor hetgeen die werknemer feitelijk op basis van de uitkomst van de
      inschrijving kan vervreemden;

      b. een werknemer die zich had kunnen inschrijven: voor hetgeen die werknemer indien hij zich had ingeschreven
      had kunnen vervreemden bepaald naar de verhouding waarin het maximaal op te kopen aantal aandelen staat tot het
      maximaal aan te bieden aantal aandelen van alle werknemers die zich konden inschrijven met dien verstande dat
      indien de opkoop feitelijk geen doorgang vindt hetgeen hij had kunnen vervreemden op nihil wordt gesteld.

      2 De inhoudingsplichtige administreert bij de loonadministratie:

      a. het aanbod van degene die de aandelen wil opkopen en de voorwaarden die hierbij worden gesteld;

      b. de beschrijving van het proces van inschrijving voor de opkoop;

      c. welke werknemers zich kunnen inschrijven en voor welk deel van hun aandelen;

      d. welke werknemers zich hebben ingeschreven en welk deel van hun aandelen zij feitelijk vervreemden.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel3.0
