  - number: '7.1'
    text: |-
      1 Ten aanzien van een in [artikel 27, zesde lid, van de wet][ref1] bedoeld kind, kan de inspecteur onder door
      hem te stellen voorwaarden toestaan dat de belasting wordt ingehouden op de eerste werkdag van het volgende
      kalenderjaar, met toepassing van de loonbelastingtabellen voor het kalenderjaar waarin het loon is verstrekt.
      Alsdan wordt het in dat kalenderjaar verstrekte loon geacht in gelijke delen te zijn verstrekt over de
      kalenderkwartalen waarin het kind werkzaam is geweest, en vinden [artikel 26 van de wet][ref2] en de krachtens dat
      artikel vastgestelde loonbelastingtabellen voor bijzondere beloningen geen toepassing.

      2 Voor de toepassing van [artikel 19, eerste lid, van de Algemene wet inzake rijksbelastingen][ref3] wordt de
      belasting, bedoeld in het eerste lid, geacht te zijn ingehouden in het kalenderjaar waarin het loon is verstrekt.

      3 Indien de belasting wordt ingehouden op de voet van het eerste lid, zijn ten aanzien van het in dat lid bedoelde
      kind de [artikelen 7.2][ref4] en [7.9][ref5] niet van toepassing.


