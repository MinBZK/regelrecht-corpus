  - number: '9.1'
    text: |-
      Degene tot wie een werknemer in dienstbetrekking staat – of, indien krachtens [artikel 8 van de wet][ref1]
      een ander als inhoudingsplichtige is aangewezen, die ander – wordt geacht de uitkeringen ingevolge de
      socialeverzekeringswetten te verstrekken die door zijn tussenkomst worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel8
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '8'
  - number: '9.2'
    text: |-
      Degene tot wie een werknemer in dienstbetrekking staat – of, indien krachtens [artikel 8 van de wet][ref1]
      een ander als inhoudingsplichtige is aangewezen, die ander – berekent de belasting over de door hem verstrekte
      aanvullingen op uitkeringen ingevolge de socialeverzekeringswetten over het gezamenlijk bedrag en brengt op de
      aldus berekende belasting in mindering de op de uitkeringen ingehouden belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel8
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '8'
  - number: '9.3'
    text: |-
      Een inhoudingsplichtige die aan een of meer werknemers loon uit een vroegere dienstbetrekking – niet zijnde
      uitkeringen ingevolge de [Participatiewet][ref1] – verstrekt, wordt ook geacht te verstrekken:

      a. het loon uit een vroegere dienstbetrekking dat door zijn tussenkomst wordt uitbetaald;

      b. de uit de vroegere dienstbetrekking genoten aanspraak op uitkeringen ingevolge een ziektekostenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: '9.4'
    text: |-
      1 Een inhoudingsplichtige wordt in de gevallen, bedoeld in de [artikelen 9.1][ref1] en [9.3][ref2], alsmede indien
      hij loon uit meer dan een vroegere dienstbetrekking verstrekt, geacht het totale bedrag aan loon te verstrekken uit
      een dienstbetrekking of vroegere dienstbetrekking.

      2 Het eerste lid is niet van toepassing op de samenloop van:

      a. een tegemoetkoming als bedoeld in [artikel 63a van de Wet werk en inkomen naar arbeidsvermogen]
      (onbekend), [artikel 65l van de Wet op de arbeidsongeschiktheidsverzekering](onbekend), [artikel 67i
      van de Wet arbeidsongeschiktheidsverzekering zelfstandigen](onbekend) of [artikel 3:75 van de Wet
      arbeidsongeschiktheidsvoorziening jonggehandicapten](onbekend) en ander loon uit vroegere dienstbetrekking dat de
      inhoudingsplichtige verstrekt;

      b. een uitkering ter zake van een afkoop als bedoeld in
      [artikel 3.133, tweede lid, onderdeel d, van de Wet inkomstenbelasting 2001][ref3] en ander loon uit vroegere
      dienstbetrekking dat de inhoudingsplichtige verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028236#Artikel9.1
      [ref2]: https://wetten.overheid.nl/BWBR0028236#Artikel9.3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3.133
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel9.4
