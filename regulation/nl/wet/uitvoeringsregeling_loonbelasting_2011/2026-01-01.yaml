  - number: 3.1a
    text: |-
      Als niet tot het loon behorende voorzieningen voor militaire oorlogs- of dienstslachtoffers die verband houden
      met invaliditeit als bedoeld in [artikel 11, eerste lid, onderdeel l, van de wet][ref1] worden aangewezen:
      voorzieningen in de zin van de [Voorzieningenregeling voor militaire oorlogs- en dienstslachtoffers][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008406
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel3.1a
