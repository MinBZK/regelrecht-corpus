  - number: 12.3a
    text: |-
      De marktrente, bedoeld in [artikel 38p, eerste lid, van de wet][ref1], die vanaf 1 januari van een kalenderjaar
      gedurende dat kalenderjaar van toepassing is, is het rekenkundig gemiddelde van de U-rendementen over de
      maanden van het voorafgaande kalenderjaar zoals deze maandelijks zijn gepubliceerd door het Centrum voor
      Verzekeringstatistiek van het Verbond van Verzekeraars. In 2026 is deze marktrente 2,593%.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel38p
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel12.3a
