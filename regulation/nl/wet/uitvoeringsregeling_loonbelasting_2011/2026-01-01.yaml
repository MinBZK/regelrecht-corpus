        bwb_id: BWBR0028236
        artikel: '7.2'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 35a
  - number: '10.4'
    text: |-
      1 De inhoudingsplichtige administreert bij de loonadministratie de gegevens met betrekking tot de aan de artiest
      of beroepssporter verstrekte kostenvergoedingen en verstrekkingen, voor zover deze niet tot de gage, bedoeld in
      [artikel 35 van de wet][ref1], behoren, alsmede aanspraken om na verloop van tijd of onder een voorwaarde een of
      meer uitkeringen of verstrekkingen te ontvangen.

      2 De inhoudingsplichtige kan de in het eerste lid bedoelde gegevens op een andere plaats administreren, mits:

      a. hij dit onder vermelding van de nieuwe bewaarplaats vooraf meldt aan de inspecteur, en

      b. de gegevens op verzoek van de inspecteur voor controle beschikbaar komen op de plaats waar de administratie
      wordt gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel10.4
