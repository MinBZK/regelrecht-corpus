  - number: '3.1'
    text: |-
      Voor de toepassing van [artikel 11, eerste lid, onderdelen m en o, van de wet][ref1], en van
      [artikel 3.3a, onderdeel b][ref2], wordt het loon in aanmerking genomen met inachtneming van het volgende:

      a. [artikel 11, eerste lid, onderdeel j, van de wet][ref3] vindt geen toepassing;

      b. tantièmes en toevallige bijzondere beloningen, alsmede tot het loon behorende aanspraken worden niet in
      aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028236#Artikel3.3a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel11
