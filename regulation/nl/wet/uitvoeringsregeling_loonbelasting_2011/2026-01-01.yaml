  - number: '11.7'
    text: |-
      1 [Artikel 11.4][ref1] is niet van toepassing indien de in te houden belasting nihil bedraagt doordat:

      a. het buitenlandse gezelschap slechts vergoedingen en verstrekkingen als bedoeld in
      [artikel 35g, derde lid, onderdelen a, b en c, van de wet][ref2] ontvangt, of

      b. met betrekking tot het optreden of de sportbeoefening de gezelschapskostenvergoedingsbeschikking, bedoeld in
      [artikel 12a, zevende lid, van het besluit][ref3], wordt toegepast.

      2 Het eerste lid is niet van toepassing voor zover de inspecteur zulks ten aanzien van de inhoudingsplichtige bij
      voor bezwaar vatbare beschikking verklaart.


