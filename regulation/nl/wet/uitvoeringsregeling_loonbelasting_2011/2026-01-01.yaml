  - number: '8.1'
    text: |-
      Als uitkeringen van publiekrechtelijke aard die buiten aanmerking worden gelaten in het kader van
      de heffing van andere belastingen of in het kader van andere wettelijke regelingen als bedoeld in
      [artikel 31, eerste lid, onderdeel c, van de wet][ref1] worden aangewezen:

      a. uitkeringen ingevolge de [Uitkeringswet tegemoetkoming twee tot vijfjarige diensttijd veteranen][ref2];

      b. tegemoetkomingen ingevolge [artikel 63a van de Wet werk en inkomen naar arbeidsvermogen]
      (onbekend), [artikel 65l van de Wet op de arbeidsongeschiktheidsverzekering](onbekend), [artikel 67i
      van de Wet arbeidsongeschiktheidsverzekering zelfstandigen](onbekend) en [artikel 3:75 van de Wet
      arbeidsongeschiktheidsvoorziening jonggehandicapten](onbekend);

      c. uitkeringen verstrekt door de Conterganstiftung für behinderte Menschen;

      d. uitkeringen op grond van de [Uitkeringsregeling Backpay][ref3];

      e. uitkeringen aan bij of krachtens [artikel 78f van de Participatiewet][ref4] verleende bijstand aan zelfstandigen
      die eerst in de vorm van een renteloze geldlening is verstrekt en daarna is omgezet in een bedrag om niet;

      f. uitkeringen op grond van de Gesetz zur Zahlbarmachung von Renten aus Beschäftigungen in einem Ghetto;

      g. uitkeringen op grond van de Bundesgesetz zur Entschädigung für auf dem Gebiet des ehemaligen Deutschen Reiches
      lebende Opfer der NS-Verfolgung;

      h. uitkeringen uit het Härtefonds für rassisch Verfolgte nicht jüdischen Glaubens;

      i. tegemoetkomingen ingevolge [artikel 78gg, eerste lid, van de Participatiewet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
