  - number: '7.5'
    text: |-
      1 De inhoudingsplichtige stelt voor de datum van aanvang van de werkzaamheden van de werknemer, of
      voor de aanvang van de werkzaamheden indien de dienstbetrekking is overeengekomen op de datum waarop de
      werkzaamheden aanvangen, de identiteit van de werknemer vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] en houdt een
      afschrift van dat document voor controle beschikbaar bij de loonadministratie.

      2 Indien uit het afschrift van het in het eerste lid bedoelde document niet de aard en het nummer van dat document
      blijkt, administreert de inhoudingsplichtige de aard en het nummer van dat document bij de loonadministratie.

      3 De inspecteur kan, al dan niet onder door hem te stellen voorwaarden, bepalen dat de in dit artikel bedoelde
      gegevens en afschriften op een andere plaats worden bewaard.

      4 De inhoudingsplichtige bewaart de in dit artikel bedoelde gegevens en afschriften ten minste vijf jaren na het
      einde van het kalenderjaar waarin de dienstbetrekking is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel7.5
