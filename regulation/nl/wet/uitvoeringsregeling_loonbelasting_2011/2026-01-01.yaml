  - number: '7.9'
    text: |-
      1 De werknemer verstrekt voor de datum van aanvang van de werkzaamheden, of voor de aanvang van de
      werkzaamheden indien de dienstbetrekking is overeengekomen op de datum waarop de werkzaamheden aanvangen, aan de
      inhoudingsplichtige schriftelijk, gedagtekend en ondertekend:

      a. zijn naam met voorletters;

      b. zijn geboortedatum;

      c. zijn burgerservicenummer;

      d. zijn adres met postcode;

      e. zijn woonplaats en, ingeval hij niet in Nederland woont, zijn woonland en regio.

      Ingeval de werknemer geen werkzaamheden verricht, wordt de in de vorige volzin bedoelde opgave gedaan voordat de
      werknemer loon van de inhoudingsplichtige geniet.

      2 De inhoudingsplichtige bewaart de in het eerste lid bedoelde gegevens ten minste vijf jaren na het einde van het
      kalenderjaar waarin de dienstbetrekking is geëindigd.

      3 De vorige leden zijn niet van toepassing ten aanzien van:

      a. de werknemer die uitkeringen geniet ingevolge de [Participatiewet][ref1];

      b. de werknemer die uitkeringen geniet wegens tijdelijke arbeidsongeschiktheid of uitkeringen ingevolge de
      [Werkloosheidswet][ref2], indien degene tot wie de werknemer in dienstbetrekking staat of laatstelijk heeft
      gestaan, de voor de heffing van de belasting vereiste gegevens, daaronder begrepen het burgerservicenummer,
      schriftelijk mededeelt aan de inhoudingsplichtige;

      c. de in Nederland wonende werknemer die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3], niet heeft bereikt en loon uit vroegere
      dienstbetrekking geniet indien de inhoudingsplichtige weet dat de werknemer tevens een uitkering ingevolge de
      [Algemene nabestaandenwet][ref4], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5] of een uitkering
      of een inkomensvoorziening ingevolge de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6] geniet;

      d. de in Nederland wonende werknemer die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref7], heeft bereikt en loon uit tegenwoordige
      dienstbetrekking geniet, of loon uit vroegere dienstbetrekking geniet waarin niet zijn begrepen de uitkeringen
      ingevolge de [Algemene Ouderdomswet][ref8];

      e. de in Nederland wonende werknemer die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref9], heeft bereikt en loon geniet in de vorm van
      uitkeringen ingevolge de [Algemene Ouderdomswet][ref10] of loon uit vroegere dienstbetrekking geniet waarin zijn
      begrepen de uitkeringen ingevolge de Algemene Ouderdomswet;

      f. de werknemer die loon geniet in de vorm van een tegemoetkoming als bedoeld in [artikel 63a van de Wet werk
      en inkomen naar arbeidsvermogen](onbekend), [artikel 65l van de Wet op de arbeidsongeschiktheidsverzekering]
      (onbekend), [artikel 67i van de Wet arbeidsongeschiktheidsverzekering zelfstandigen](onbekend) of [artikel 3:75 van
      de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten](onbekend).

      4 Indien de inhoudingsplichtige niet bekend is met het burgerservicenummer van de in het derde lid bedoelde
      werknemer, verzoekt de inhoudingsplichtige voor de eerste loonverstrekking de werknemer om opgave van
      zijn burgerservicenummer. De werknemer doet deze opgave voor de eerste loonverstrekking toekomen aan de
      inhoudingsplichtige.


