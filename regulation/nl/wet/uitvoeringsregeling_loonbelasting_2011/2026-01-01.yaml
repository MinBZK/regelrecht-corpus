        bwb_id: BWBR0008406
  - number: '3.3'
    text: |-
      Voor de toepassing van [artikel 11, eerste lid, onderdeel r, onder 2°, van de wet][ref1] wordt als geclausuleerd
      verlof aangewezen: verlof dat voor specifieke doeleinden wordt toegekend, zoals buitengewoon verlof,
      zwangerschapsverlof, bevallingsverlof, kraamverlof, ouderschapsverlof, adoptieverlof, verlof in verband met
      pleegzorg, calamiteiten- en ander kort verzuimverlof, kort- en langdurend zorgverlof, educatief verlof, politiek
      verlof en palliatief verlof.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel3.3
    references:
