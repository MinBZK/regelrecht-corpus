        bwb_id: BWBR0002471
        artikel: '11'
  - number: 3.3a
    text: |-
      Tot het loon behoren niet:

      a. aanspraken op een eenmalige uitkering bij het beëindigen van de dienstbetrekking anders dan vanwege
      arbeidsongeschiktheid of overlijden van de werknemer, vervroegd uittreden of het bereiken van de
      pensioengerechtigde leeftijd;

      b. aanspraken op een eenmalige uitkering bij het beëindigen van de dienstbetrekking wegens arbeidsongeschiktheid
      of het bereiken van de pensioengerechtigde leeftijd, indien deze uitkering driemaal het loon van een maand niet
      overtreft;

      c. aanspraken op uitkeringen en verstrekkingen in door de Minister aan te wijzen gevallen.
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel3.3a
  - number: '3.5'
    text: |-
      Tot het loon behoort niet de krachtens de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2] verstrekte premie,
      bedoeld in artikel 2.8, eerste lid, onderdeel b, van het Algemene inkomensbesluit socialezekerheidswetten, mits in
      het jaar waarin de premie is verstrekt geen vergoeding is genoten als bedoeld in artikel 2.8, eerste lid, onderdeel
      c, van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel3.5
    references:
