  - number: 8.4a
    text: |-
      1 Tot de voorzieningen, bedoeld in [artikel 31a, tweede lid, onderdeel h, van de wet][ref1], behoren, ingeval deze
      geheel of gedeeltelijk op de werkplek gebruikt of verbruikt worden:

      a. voorzieningen voor zover die direct samenhangen met verplichtingen van de inhoudingsplichtige op grond van het
      bepaalde bij of krachtens de [Arbeidsomstandighedenwet][ref2], met inachtneming van [artikel 44 van die wet][ref3];

      b. hulpmiddelen die ook elders gebruikt kunnen worden en die geheel of nagenoeg geheel zakelijk gebruikt worden.

      2 In afwijking in zoverre van [artikel 1.2, eerste lid, onderdeel f][ref4], wordt voor de toepassing van het eerste
      lid, onderdeel a, onder werkplek tevens verstaan:

      a. in geval van thuiswerk in de zin van de [Arbeidsomstandighedenwet][ref5] een werkruimte
      gelegen in een woning, een duurzaam aan een plaats gebonden schip of een woonwagen in de zin van
      [artikel 1, onderdeel l, van de Wet op de huurtoeslag][ref6], de aanhorigheden daaronder begrepen, van de
      werknemer;

      b. de plaats waar uitvoering wordt gegeven aan het arbeidsomstandighedenbeleid dat de inhoudingsplichtige voert op
      grond van de [Arbeidsomstandighedenwet][ref7].


