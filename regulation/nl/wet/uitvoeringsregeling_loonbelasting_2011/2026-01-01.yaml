      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel8a
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel8a
