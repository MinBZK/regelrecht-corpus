        bwb_id: BWBR0002489
        artikel: 10d
  - number: '6.1'
    text: |-
      Ten aanzien van de werknemer die doorgaans op minder dan vijf dagen per week werkzaam is, wordt in afwijking in
      zoverre van [artikel 25, eerste lid, van de wet][ref1], als loontijdvak aangemerkt:

      a. indien het loon per week wordt uitbetaald: de week;

      b. indien het loon per vier weken wordt uitbetaald: het tijdvak van vier weken;

      c. indien het loon per maand wordt uitbetaald: de maand.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel25
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '25'
  - number: '6.3'
    text: |-
      1 Ten aanzien van de loon uit tegenwoordige dienstbetrekking genietende werknemer die met betrekking tot een
      kalenderkwartaal als student of scholier wordt aangemerkt en die schriftelijk, gedagtekend en ondertekend te kennen
      heeft gegeven dat te zijnen aanzien het kwartaal als loontijdvak wordt aangemerkt, kan, in afwijking in zoverre van
      [artikel 25, eerste lid, van de wet][ref1], voor loonbetalingen waarvan het inhoudingstijdstip in dat kwartaal is
      gelegen, dat kwartaal als loontijdvak worden aangemerkt.

      2 Voor de toepassing van het eerste lid wordt met betrekking tot een kalenderkwartaal als student of scholier
      aangemerkt:

      a. de werknemer die bij het begin van het kalenderkwartaal recht heeft op een gift of een prestatiebeurs op grond
      van de [Wet studiefinanciering 2000][ref2] of de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3];

      b. de werknemer die bij het begin van het kalenderkwartaal recht heeft op een tegemoetkoming op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref4];

      c. de werknemer voor wie bij het begin van het kalenderkwartaal recht bestaat op kinderbijslag ingevolge de
      [Algemene Kinderbijslagwet][ref5];

      d. de werknemer die bij het begin van het kalenderkwartaal staat ingeschreven bij een onderwijsinstelling waar hij
      een voltijdse opleiding volgt en die inwoner is van een lidstaat van de Europese Unie, van een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of van Zwitserland en die in het bezit is
      van een door de Minister aangewezen internationale studentenkaart.

      3 Voor de toepassing van het eerste lid bewaart de inhoudingsplichtige bij zijn loonadministratie een schriftelijke
      door de werknemer gedagtekende en ondertekende verklaring dat te zijnen aanzien het kwartaal als loontijdvak kan
      worden aangemerkt, alsmede:

      a. ingeval het tweede lid, onderdeel a of b, van toepassing is: het burgerservicenummer;

      b. ingeval het tweede lid, onderdeel c, van toepassing is: het burgerservicenummer;

      c. ingeval het tweede lid, onderdeel d, van toepassing is: een kopie van de internationale studentenkaart.

      4 Indien in het kwartaal meer dan eens loon wordt verstrekt, wordt de op een inhoudingstijdstip verschuldigde
      belasting bepaald op de belasting die is verschuldigd over het in dat kwartaal in totaal verstrekte loon,
      verminderd met de reeds ingehouden belasting.

      5 Bij toepassing van dit artikel is in geval van twee opeenvolgende dienstbetrekkingen
      [artikel 23 van de wet][ref6] niet van toepassing.


