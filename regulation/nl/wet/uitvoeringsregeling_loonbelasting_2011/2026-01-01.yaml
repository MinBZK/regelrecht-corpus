        artikel: '18'
  - number: '4.2'
    text: |-
      Voor de toepassing van [artikel 10d van het besluit][ref1] worden van de staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte aangewezen: IJsland, Noorwegen en Liechtenstein.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel10d
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel4.2
    references:
