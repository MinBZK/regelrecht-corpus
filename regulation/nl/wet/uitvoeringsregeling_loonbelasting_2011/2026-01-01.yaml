  - number: '7.6'
    text: |-
      1 De eerstedagsmelding, bedoeld in [artikel 28, eerste lid, onderdeel g, van de wet][ref1], bevat:

      a. het loonheffingennummer van de inhoudingsplichtige;

      b. het burgerservicenummer van de werknemer of, bij het ontbreken daarvan, een uniek personeelsnummer;

      c. de naam van de werknemer;

      d. de geboortedatum van de werknemer;

      e. de datum van aanvang van de werkzaamheden.

      2 De eerstedagsmelding, bedoeld in het eerste lid, hoeft niet te worden gedaan ingeval de werknemer
      zijn werkzaamheden aanvangt bij een inhoudingsplichtige die met de zonder onderbreking voorafgaande
      inhoudingsplichtige van de werknemer behoort tot dezelfde samenhangende groep inhoudingsplichtigen in de zin van
      [artikel 27e van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel27e
