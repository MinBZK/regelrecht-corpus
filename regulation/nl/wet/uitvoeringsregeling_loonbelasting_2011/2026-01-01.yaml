        artikel: 31a
  - number: 8.2a
    text: |-
      Ingeval het loon, bedoeld in [artikel 10eb, eerste en tweede lid, van het besluit][ref1], van een werknemer als
      gevolg van het opnemen van ouderschapsverlof, zwangerschapsverlof, aanvullend geboorteverlof, pleegzorgverlof
      of adoptieverlof in een tijdvak op jaarbasis lager is dan het bedrag, genoemd in artikel 10eb, eerste lid,
      onderscheidenlijk tweede lid, van het besluit, wordt in dat loontijdvak bij de toepassing van dat artikel ten
      aanzien van de werknemer uitgegaan van het loon, bedoeld in dat artikel, dat de werknemer zou hebben genoten indien
      hij geen van de genoemde soorten verlof zou hebben opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel10eb
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel8.2a
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 10eb
  - number: '8.3'
    text: |-
      1 Als regio als bedoeld in [artikel 10e, tweede lid, onderdeel c, onder 4°, van het besluit][ref1] worden
      aangewezen:

      a. de landen in Azië (waaronder Hong Kong en het gedeelte van Turkije dat ten oosten van de Bosporus is gelegen);

      b. de landen in Afrika;

      c. de landen in Latijns Amerika (waaronder Aruba, Curaçao, Sint Maarten en de BES eilanden);

      d. de volgende landen in Europa: Albanië, Armenië, Azerbeidzjan, Belarus, Bosnië en Herzegovina, Bulgarije,
      Estland, Georgië, Hongarije, Kosovo, Kroatië, Letland, Litouwen, Macedonië, Moldavië, Montenegro, Oekraïne, Polen,
      Roemenië, Rusland, Servië, Slovenië, Slowakije en Tsjechië.

      2 Onder de in het eerste lid genoemde landen worden begrepen gebieden gelegen buiten de territoriale wateren van
      die landen waar deze in overeenstemming met het internationale recht soevereine rechten kunnen uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel10e
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel8.3
