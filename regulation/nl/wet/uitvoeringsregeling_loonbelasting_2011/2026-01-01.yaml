  - number: '8.4'
    text: |-
      1 Voor de toepassing van [artikel 31a, tweede lid, onderdeel f, van de wet][ref1] verhuist de werknemer in
      ieder geval in het kader van de dienstbetrekking ingeval hij binnen twee jaar na de aanvaarding van een nieuwe
      dienstbetrekking of na overplaatsing binnen de bestaande dienstbetrekking door de verhuizing de afstand tussen zijn
      woning en de plaats van zijn dienstbetrekking met ten minste 60% verkleint terwijl tot die verhuizing de afstand
      tussen zijn woning en de plaats van zijn dienstbetrekking ten minste 25 kilometer bedroeg.

      2 Onder afstand als bedoeld in het eerste lid wordt verstaan de afstand gemeten langs de meest gebruikelijke weg.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31a
