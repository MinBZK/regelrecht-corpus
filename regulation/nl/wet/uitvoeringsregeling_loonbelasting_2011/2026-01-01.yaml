      ieder geval niet tot de gage, bedoeld in [artikel 35g van de wet][ref1], indien deze vergoedingen € 0,55 per
      gewerkte dag niet te boven gaan.

      2 Het eerste lid is niet van toepassing indien tijdens de werktijd consumpties die geen deel uitmaken van een
      maaltijd, worden verstrekt.


