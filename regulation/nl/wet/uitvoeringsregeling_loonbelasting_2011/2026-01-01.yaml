        bwb_id: BWBR0017017
        artikel: '1.5'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1.7'
  - number: '3.11'
    text: |-
      1 De waarde van het genot van een ter beschikking gestelde woning waarvan het gebruik voor de behoorlijke
      vervulling van de dienstbetrekking is vereist, wordt gesteld op de waarde in het economische verkeer van dat genot
      met een maximum van 18% van het voor de werknemer op jaarbasis geldende loon bij een overeengekomen arbeidsduur van
      36 uur per kalenderweek.

      2 Voor de toepassing van het eerste lid wordt de waarde van het genot van de woning waarvan het gebruik voor de
      behoorlijke vervulling van de dienstbetrekking is vereist, aangemerkt als niet behorend tot het voor de werknemer
      op jaarbasis geldende loon.
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel3.11
  - number: '3.12'
    text: |-
      1 De waarde van een aanspraak om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of
      verstrekkingen te ontvangen, wordt gesteld op de bedragen die bij een derde worden gestort of, voor zover geen
      stortingen worden verricht, zouden moeten worden gestort teneinde de aanspraak te dekken.

      2 In afwijking in zoverre van het eerste lid wordt per kalenderjaar de waarde van een aanspraak ingevolge een
      ziektekostenregeling ten behoeve van ten minste 25 werknemers of gewezen werknemers die gedurende het gehele
      voorafgaande kalenderjaar heeft bestaan, voor zover geen stortingen bij derden worden verricht, gesteld op het
      bedrag van de gemiddelde uitkering. De gemiddelde uitkering is het rekenkundige gemiddelde van de jaargemiddelden
      van de afgelopen vijf kalenderjaren. Het jaargemiddelde is het gezamenlijke bedrag van de ter zake door of namens
      de inhoudingsplichtige gedane uitkeringen en verstrekkingen naar de waarde in het economische verkeer, gedeeld
      door het aantal personen dat in het desbetreffende jaar gedurende ten minste zes maanden gerechtigd is geweest.
      Indien zulks tot een lagere gemiddelde uitkering leidt, worden het hoogste en het laagste jaargemiddelde buiten
      beschouwing gelaten en is de gemiddelde uitkering het rekenkundige gemiddelde van de jaargemiddelden van de andere
      drie kalenderjaren.

      3 Indien de in het tweede lid bedoelde regeling minder dan vijf gehele kalenderjaren heeft bestaan, is dat lid van
      overeenkomstige toepassing op het mindere aantal gehele kalenderjaren, met dien verstande dat bij een bestaansduur
      van de regeling van een of twee gehele kalenderjaren de laatste volzin van dat lid niet van toepassing is.

      4 De waarde van een aanspraak ingevolge een wettelijke Belgische ziektekostenverzekering bedraagt
      maximaal het gezamenlijke bedrag van de voor dat jaar geldende standaardpremie, bedoeld in
      [artikel 4 van de Wet op de zorgtoeslag][ref1], welke standaardpremie tweemaal in aanmerking wordt genomen ingeval
      sprake is van een op grond van Verordening (EG) nr. 883/2004 van het Europees Parlement en de Raad van 29 april
      2004 betreffende de coördinatie van de socialezekerheidsstelsels (PbEU 2004, L 166) meeverzekerde echtgenoot
      als bedoeld in die verordening, en het voor dat jaar geldende maximumbedrag van de inkomensafhankelijke bijdrage
      volgens [hoofdstuk 5 van de Zorgverzekeringswet][ref2].

      5 In afwijking van de vorige leden wordt de waarde van een aanspraak op een ziektekostenregeling met een waarde van
      ten hoogste € 27 per jaar op nihil gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018451#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0028236/2026-01-01#Artikel3.12
