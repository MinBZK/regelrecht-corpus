  - number: '7.4'
    text: |-
      1 De inhoudingsplichtige verstrekt aan de werknemer een jaaropgaaf.

      2 De jaaropgaaf, bedoeld in het eerste lid, bevat in elk geval de volgende gegevens:

      a. de naam van de werknemer;

      b. het burgerservicenummer van de werknemer;

      c. de naam van de inhoudingsplichtige;

      d. het in het voorafgaande kalenderjaar door de werknemer genoten loon;

      e. de op het loon, bedoeld in onderdeel d, ingehouden loonbelasting en premie voor de volksverzekeringen;

      f. de door de inhoudingsplichtige over het loon, bedoeld in onderdeel d, verschuldigde premies
      werknemersverzekeringen en inkomensafhankelijke bijdrage [Zorgverzekeringswet][ref1];

      g. de op het loon, bedoeld in onderdeel d, ingehouden inkomensafhankelijke bijdrage [Zorgverzekeringswet][ref2];

      h. de volgens [artikel 22a van de wet][ref3] toegekende arbeidskorting ter zake van het loon dat wordt belast
      volgens de loonbelastingtabellen, bedoeld in [artikel 25, tweede lid, van de wet][ref4].

      3 De verstrekking van de jaaropgaaf, bedoeld in het eerste lid, kan achterwege blijven indien aan de werknemer
      opgave van de gegevens, bedoeld in het tweede lid, is verstrekt in de vorm van een opgave als bedoeld in
      [artikel 626 van Boek 7 van het Burgerlijk Wetboek][ref5].

      4 Ten aanzien van de werknemer van wie in verband met gemoedsbezwaren geen premie voor de volksverzekeringen is
      geheven, bevat de jaaropgaaf de mededeling dat in plaats van premie voor de volksverzekeringen tot eenzelfde bedrag
      premievervangende belasting is ingehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
