  - number: '7.2'
    text: |-
      1 De inhoudingsplichtige legt voor iedere werknemer voor de eerste loonverstrekking in het kalenderjaar een
      loonstaat aan en houdt deze vervolgens bij. De loonstaat wordt opgemaakt overeenkomstig het door de inspecteur
      verstrekte model. De inhoudingsplichtige mag een van het model afwijkende loonstaat gebruiken, mits deze ten minste
      de mogelijkheid biedt op duidelijke wijze dezelfde gegevens te administreren als het model.

      2 De inhoudingsplichtige wordt geacht aan het eerste lid te voldoen ingeval hij met behulp van elektronische
      apparatuur alle van belang zijnde gegevens vastlegt en hij die gegevens op elk gewenst tijdstip op schrift in de
      vorm van een van de in het eerste lid bedoelde loonstaten ter inzage kan verstrekken.

      3 De inspecteur kan onder door hem te stellen voorwaarden ermee instemmen dat de inhoudingsplichtige de op de
      loonstaat te vermelden gegevens op een andere dan de in het eerste of het tweede lid bedoelde wijze administreert.
      De instemming kan te allen tijde worden ingetrokken indien de administratie niet zodanig is ingericht dat een
      deugdelijke controle gewaarborgd is.

      4 De inhoudingsplichtige ontleent de in het hoofd van de loonstaat te vermelden gegevens aan:

      a. de laatstelijk door de werknemer op grond van [artikel 7.9][ref1] verstrekte informatie;

      b. de door de werknemer of de Belastingdienst verstrekte opgave van het burgerservicenummer.

      5 In afwijking in zoverre van het vierde lid, aanhef en onderdeel a, vermeldt de inhoudingsplichtige in het hoofd
      van de loonstaat de gegevens die hem bekend zijn:

      a. indien hij weet dat de laatstelijk door de werknemer op grond van [artikel 7.9][ref2] verstrekte informatie
      onjuist is;

      b. zolang de werknemer geen informatie als bedoeld in [artikel 7.9][ref3] heeft verstrekt;

      c. indien de werknemer geen informatie als bedoeld in [artikel 7.9][ref4] hoeft te verstrekken.

      6 De inhoudingsplichtige houdt, behalve in de gevallen, bedoeld in [artikel 26b van de wet][ref5], de belasting in
      aan de hand van de gegevens, vermeld in het hoofd van de loonstaat.

      7 De inhoudingsplichtige houdt de loonadministratie op de plaats waar hij in Nederland kantoor houdt of, indien
      zodanig kantoor niet wordt gehouden, op de plaats waar hij in Nederland woont of gevestigd is, of op de plaats waar
      hij in Nederland een vaste inrichting voor de uitoefening van zijn bedrijf of beroep of een in Nederland wonende of
      gevestigde vaste vertegenwoordiger heeft. Bij gebreke daarvan houdt hij de loonadministratie onder zijn berusting.
      De inspecteur kan een andere plaats aanwijzen.

      8 Ingeval de loonberekening door derden wordt uitgevoerd met behulp van mechanische of elektronische apparatuur,
      kan de Minister, onder door hem te stellen voorwaarden, bepalen dat de loonadministratie op een andere plaats wordt
      bewaard.

      9 Dit artikel is niet van toepassing ten aanzien van de werknemer die uitkeringen geniet ingevolge de
      [Participatiewet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0028236#Artikel7.9
      [ref2]: https://wetten.overheid.nl/BWBR0028236#Artikel7.9
      [ref3]: https://wetten.overheid.nl/BWBR0028236#Artikel7.9
