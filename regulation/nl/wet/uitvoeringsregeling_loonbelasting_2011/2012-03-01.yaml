  - number: '10.7'
    text: |-
      1 [Artikel 10.3][ref1] is niet van toepassing indien de in te houden belasting nihil bedraagt doordat:

      a. de artiest of beroepssporter slechts vergoedingen en verstrekkingen als bedoeld in
      [artikel 35, derde lid, onderdelen a, b en c, van de wet][ref2] geniet, of

      b. met betrekking tot het optreden of de sportbeoefening de individuele kostenvergoedingsbeschikking of de
      gezelschapskostenvergoedingsbeschikking, bedoeld in [artikel 12a, zevende lid, van het besluit][ref3], wordt
      toegepast.

      2 Het eerste lid is niet van toepassing voor zover de inspecteur zulks ten aanzien van de inhoudingsplichtige bij
      voor bezwaar vatbare beschikking verklaart.


      [ref1]: https://wetten.overheid.nl/BWBR0028236#Artikel10.3
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35
