  - number: '3.8'
    text: |-
      De waarde van de volgende voorzieningen die op de werkplek gebruikt of verbruikt worden, wordt gesteld op de
      daarbij vermelde bedragen:

      a. maaltijden: de waarde wordt gesteld op € 2,95;

      b. huisvesting en inwoning, anders dan de ter behoorlijke vervulling van de dienstbetrekking ter beschikking
      gestelde woning, met inbegrip van – indien mede verstrekt – het genot van energie, water en bewassing: de waarde
      wordt gesteld € 5,10 per dag;

      c. door de inhoudingsplichtige verrichte kinderopvang waarvoor aanspraak op een
      kinderopvangtoeslag onderscheidenlijk aanspraak op een tegemoetkoming kan ontstaan op de voet
      van [artikel 1.5 van de Wet kinderopvangen kwaliteitseisen peuterspeelzalen][ref1]: de waarde
      wordt gesteld op het aantal uren genoten kinderopvang maal de uurprijs vastgesteld krachtens
      [artikel 1.7, tweede lid, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.7
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel3.8
