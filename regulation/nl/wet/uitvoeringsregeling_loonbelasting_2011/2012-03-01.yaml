  - number: '7.9'
    text: |-
      1 De werknemer verstrekt voor de datum van aanvang van de werkzaamheden, of voor de aanvang van de
      werkzaamheden indien de dienstbetrekking is overeengekomen op de datum waarop de werkzaamheden aanvangen, aan de
      inhoudingsplichtige schriftelijk, gedagtekend en ondertekend:

      a. zijn naam met voorletters;

      b. zijn geboortedatum;

      c. zijn burgerservicenummer of, bij het ontbreken daarvan, zijn sociaal-fiscaalnummer;

      d. zijn adres met postcode;

      e. zijn woonplaats en, ingeval hij niet in Nederland woont, zijn woonland en regio.

      Ingeval de werknemer geen werkzaamheden verricht, wordt de in de vorige volzin bedoelde opgave gedaan voordat de
      werknemer loon van de inhoudingsplichtige geniet.

      2 De inhoudingsplichtige bewaart de in het eerste lid bedoelde gegevens ten minste vijf jaren na het einde van het
      kalenderjaar waarin de dienstbetrekking is geëindigd.

      3 De vorige leden zijn niet van toepassing ten aanzien van:

      a. de werknemer die uitkeringen geniet ingevolge de [Wet werk en bijstand][ref1] of de
      [Wet investeren in jongeren][ref2], zoals deze luidde op de dag voor inwerkingtreding van
      __REF002___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _______________________________________________________ (Stb. 650);

      b. de werknemer die uitkeringen geniet ingevolge de [Wet werk en inkomen kunstenaars][ref4], zoals deze op 31
      december 2011 luidde;

      c. de werknemer die uitkeringen geniet wegens tijdelijke arbeidsongeschiktheid of uitkeringen ingevolge de
      [Werkloosheidswet][ref5], indien degene tot wie de werknemer in dienstbetrekking staat of laatstelijk heeft
      gestaan, de voor de heffing van de belasting vereiste gegevens, daaronder begrepen het burgerservicenummer of, bij
      het ontbreken daarvan, het sociaal-fiscaalnummer, schriftelijk mededeelt aan de inhoudingsplichtige;

      d. de in Nederland wonende werknemer die de leeftijd van 65 jaar niet heeft bereikt en loon uit vroegere
      dienstbetrekking geniet indien de inhoudingsplichtige weet dat de werknemer tevens een uitkering ingevolge de
      [Algemene nabestaandenwet][ref6], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7] of een uitkering
      of een inkomensvoorziening ingevolge de [Wet werk en arbeidsondersteuning jonggehandicapten][ref8] geniet;

      e. de in Nederland wonende werknemer die de leeftijd van 65 jaar heeft bereikt en loon uit tegenwoordige
      dienstbetrekking geniet, of loon uit vroegere dienstbetrekking geniet waarin niet zijn begrepen de uitkeringen
      ingevolge de [Algemene Ouderdomswet][ref9];

      f. de in Nederland wonende werknemer die de leeftijd van 65 jaar heeft bereikt en loon geniet in de vorm van
      uitkeringen ingevolge de [Algemene Ouderdomswet][ref10] of loon uit vroegere dienstbetrekking geniet waarin zijn
      begrepen de uitkeringen ingevolge de Algemene Ouderdomswet;

      g. de werknemer die loon geniet in de vorm van een tegemoetkoming als bedoeld in artikel 10 van de Wet
      tegemoetkoming chronisch zieken en gehandicapten.

      4 Indien de inhoudingsplichtige niet bekend is met het burgerservicenummer of, bij het ontbreken daarvan, het
      sociaal-fiscaalnummer van de in het vierde lid bedoelde werknemer, verzoekt de inhoudingsplichtige voor de eerste
      loonverstrekking de werknemer om opgave van zijn burgerservicenummer of, bij het ontbreken daarvan, zijn sociaal-
      fiscaalnummer. De werknemer doet deze opgave voor de eerste loonverstrekking toekomen aan de inhoudingsplichtige.


