  - number: 3.3a
    text: |-
      Tot het loon behoren niet:

      a. aanspraken op een eenmalige uitkering bij het beëindigen van de dienstbetrekking anders dan vanwege
      arbeidsongeschiktheid of overlijden van de werknemer, vervroegd uittreden of het bereiken van de
      pensioengerechtigde leeftijd;

      b. aanspraken op een eenmalige uitkering bij het beëindigen van de dienstbetrekking wegens arbeidsongeschiktheid
      of het bereiken van de pensioengerechtigde leeftijd, indien deze uitkering driemaal het loon van een maand niet
      overtreft;

      c. aanspraken op uitkeringen en verstrekkingen in door de Minister aan te wijzen gevallen.
