        bwb_id: BWBR0028236
        artikel: '7.2'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 35a
  - number: '10.4'
    text: |-
      1 De inhoudingsplichtige administreert bij de loonadministratie de gegevens met betrekking tot de aan de artiest
      of beroepssporter verstrekte kostenvergoedingen en verstrekkingen, voor zover deze niet tot de gage, bedoeld in
      [artikel 35 van de wet][ref1], behoren, alsmede aanspraken om na verloop van tijd of onder een voorwaarde een of
      meer uitkeringen of verstrekkingen te ontvangen.

      2 De inhoudingsplichtige kan de in het eerste lid bedoelde gegevens op een andere plaats administreren, mits:

      a. hij dit onder vermelding van de nieuwe bewaarplaats vooraf meldt aan de inspecteur, en

      b. de gegevens op verzoek van de inspecteur voor controle beschikbaar komen op de plaats waar de administratie
      wordt gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '35'
  - number: '10.5'
    text: |-
      De inhoudingsplichtige verstrekt aan de artiest of beroepssporter een jaaropgaaf. Aan de niet in Nederland wonende
      artiest of beroepssporter verstrekt de inhoudingsplichtige een jaaropgaaf slechts op diens verzoek.
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel10.5
  - number: '10.6'
    text: |-
      1 De inhoudingsplichtige stelt zodra de artiest of beroepssporter zijn werkzaamheden
      aanvangt diens identiteit vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] en houdt een
      afschrift van dat document voor controle beschikbaar bij de loonadministratie.

      2 [Artikel 7.5, tweede, derde en vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028236#Artikel7.5
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel10.6
    references:
