      1 Fooien en dergelijke prestaties van derden worden niet tot het loon gerekend, voor zover bij het bepalen van het
      voor de werknemer rechtens geldende loon met het ontvangen van deze fooien of dergelijke prestaties van derden geen
      rekening is gehouden.

      2 De werknemer die werkzaam is bij een onderneming waarin horeca-activiteiten worden verricht en die van zijn
      werkgever niet ten minste het voor hem rechtens geldende loon ontvangt, wordt geacht fooien en dergelijke
      prestaties van derden te genieten tot een bedrag ter grootte van dat rechtens geldende loon verminderd met het
      rechtstreeks van de werkgever ontvangen loon. Indien de werkgever in overeenstemming met de werknemer het bedrag
      aan fooien en dergelijke prestaties van derden op een hoger bedrag schat, wordt van dat geschatte bedrag uitgegaan.
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel3.6
  - number: '3.7'
    text: |-
      1 De waarde van de volgende voorzieningen, in redelijkheid, wordt gesteld op nihil, ingeval deze geheel of
      gedeeltelijk op de werkplek gebruikt of verbruikt worden:

      a. voorzieningen waarvan het niet gebruikelijk is deze elders te gebruiken of verbruiken;

      b. voorzieningen die rechtstreeks voortvloeien uit het arbeidsomstandighedenbeleid dat de inhoudingsplichtige voert
      op grond van de [Arbeidsomstandighedenwet][ref1];

      c. ter beschikking gestelde kleding die:

      1°. uitsluitend of nagenoeg uitsluitend geschikt is om tijdens de vervulling van de dienstbetrekking te worden
      gedragen;

      2°. per kledingstuk is voorzien van een of meer duidelijk zichtbare, aan de inhoudingsplichtige gebonden
      beeldmerken met een oppervlakte van tezamen ten minste 70cm², of

      3°. achterblijft op de werkplek;

      d. consumpties die geen deel uitmaken van een maaltijd;

      e. ter beschikking gestelde hulpmiddelen, waaronder computers en dergelijke apparatuur, gereedschappen en
      toebehoren, die ook elders gebruikt kunnen worden en die geheel of nagenoeg geheel zakelijk gebruikt worden;

      f. ter beschikking gestelde mobiele communicatiemiddelen – niet zijnde computers en dergelijke apparatuur – waarvan
      het zakelijke gebruik van meer dan bijkomstig belang is;

      g. huisvesting en inwoning, met inbegrip van – indien mede verstrekt – het genot van energie, water en bewassing,
      ter vervulling van de dienstbetrekking, indien de werknemer niet op de werkplek woont en zich redelijkerwijs niet
      aan deze voorziening kan onttrekken.

      2 In afwijking in zoverre van [artikel 1.2, eerste lid, onderdeel f][ref2], wordt voor de toepassing van het
      eerste lid, onderdeel b, in geval van thuiswerk in de zin van de [Arbeidsomstandighedenwet][ref3] onder werkplek
      tevens verstaan een werkruimte gelegen in een woning, een duurzaam aan een plaats gebonden schip of een woonwagen
      in de zin van [artikel 1 van de Huisvestingswet][ref4], de aanhorigheden daaronder begrepen, van de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
      [ref2]: https://wetten.overheid.nl/BWBR0028236#Artikel1.2
      [ref3]: https://wetten.overheid.nl/BWBR0010346
      [ref4]: https://wetten.overheid.nl/BWBR0005674#Artikel1
