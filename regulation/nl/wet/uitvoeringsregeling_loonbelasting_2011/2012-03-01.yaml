  - number: '8.1'
    text: |-
      Als uitkeringen van publiekrechtelijke aard die buiten aanmerking worden gelaten in het kader van
      de heffing van andere belastingen of in het kader van andere wettelijke regelingen als bedoeld in
      [artikel 31, eerste lid, onderdeel c, van de wet][ref1] worden aangewezen:

      a. uitkeringen ingevolge de Uitkeringswet tegemoetkoming twee tot vijfjarige diensttijd veteranen;

      b. tegemoetkomingen ingevolge [artikel 10 van de Wet tegemoetkoming chronisch zieken en gehandicapten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0025003#Artikel10
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel8.1
