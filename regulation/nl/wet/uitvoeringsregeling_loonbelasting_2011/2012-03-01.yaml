  - number: '2.1'
    text: |-
      1 Aan het in [artikel 5b, eerste lid, onder 2°, van de wet][ref1] bedoelde aannemelijk maken wordt voldaan, indien
      degene met wie het gezelschap het optreden in Nederland of de sportbeoefening in Nederland is overeengekomen of
      degene van wie het gezelschap de gage ontvangt:

      a. voor aanvang van het optreden of de sportbeoefening aan de hand van een document
      – waarvan hij een afschrift voor controle beschikbaar houdt – als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref2], van ten minste het
      merendeel van de leden heeft vastgesteld dat zij inwoner zijn van dan wel gevestigd zijn in een land waarmee de
      Staat der Nederlanden een verdrag ter voorkoming van dubbele belasting heeft gesloten, Aruba, Curaçao, Sint Maarten
      of de BES eilanden;

      b. beschikt over de volgende documenten:

      1°. een afschrift van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref3] dat betrekking heeft
      op de leider of vertegenwoordiger van het gezelschap;

      2°. een schriftelijke verklaring van de leider of vertegenwoordiger van het gezelschap dat het gezelschap
      hoofdzakelijk bestaat uit leden die inwoner zijn van of gevestigd zijn in een land waarmee de Staat der Nederlanden
      een verdrag ter voorkoming van dubbele belasting heeft gesloten, Aruba, Curaçao, Sint Maarten of de BES eilanden;

      3°. een schriftelijke overeenkomst betreffende het optreden in Nederland of de sportbeoefening in Nederland, of
      een afschrift van die overeenkomst, waarin het gezelschap als vestigingsland vermeldt een land waarmee de Staat der
      Nederlanden een verdrag ter voorkoming van dubbele belasting heeft gesloten, Aruba, Curaçao, Sint Maarten of de BES
      eilanden, en

      4°. een afschrift van een bank- of girorekening waaruit blijkt dat de gage van het gezelschap is overgemaakt naar
      een rekeninghouder die woont of is gevestigd in het in onderdeel c bedoelde vestigingsland.

      2 Het eerste lid is niet van toepassing indien aan degene met wie het gezelschap het optreden in Nederland of de
      sportbeoefening in Nederland is overeengekomen of aan degene van wie het gezelschap de gage ontvangt, onjuiste
      verklaringen, documenten of gegevens zijn verstrekt en deze dit weet of redelijkerwijs had moeten weten.


