  - number: '6.4'
    text: |-
      Ingeval de inhoudingsplichtige van de werknemer en de zonder onderbreking voorafgaande inhoudingsplichtige van de
      werknemer behoren tot een samenhangende groep inhoudingsplichtigen in de zin van [artikel 27e van de wet][ref1],
      wordt de werknemer voor de toepassing van [artikel 26, vierde lid, van de wet][ref2] geacht het van deze
      inhoudingsplichtigen genoten loon van één inhoudingsplichtige te hebben genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27e
