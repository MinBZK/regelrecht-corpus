      1 De Belastingdienst verstrekt aan de inhoudingsplichtige het model van de gageverklaring met de daarbij behorende
      toelichting. De inhoudingsplichtige reikt dienovereenkomstig een gageverklaring met toelichting aan de leider of
      vertegenwoordiger van een buitenlands gezelschap uit:

      a. zodra hij ten aanzien van het gezelschap inhoudingsplichtige wordt;

      b. op verzoek van de leider of vertegenwoordiger van het gezelschap;

      c. zodra hij weet dat zich een wijziging heeft voorgedaan in de gegevens die de leider of vertegenwoordiger van het
      gezelschap in de laatstelijk ingeleverde gageverklaring heeft verstrekt en die wijziging tot gevolg heeft dat het
      gezelschap een hoger bedrag aan belasting wordt verschuldigd.

      2 De inhoudingsplichtige mag in plaats van het door de Belastingdienst verstrekte model van de gageverklaring
      gebruikmaken van een eigen model gageverklaring, mits dat model ten minste de gegevens bevat van het door de
      Belastingdienst verstrekte model, inclusief de gebruiksaanwijzing en de toelichting op de vragen.

      3 De leider of vertegenwoordiger van het gezelschap verzoekt de inhoudingsplichtige om uitreiking van een
      gageverklaring indien zich een wijziging voordoet in de eerder door hem verstrekte gegevens en die wijziging tot
      gevolg heeft dat een hoger bedrag aan belasting wordt verschuldigd.

      4 De leider of vertegenwoordiger van het gezelschap aan wie een gageverklaring is uitgereikt, is gehouden de
      daarbij gevraagde gegevens te verstrekken door de gageverklaring duidelijk, stellig en zonder voorbehoud ingevuld
      en ondertekend, in te leveren bij de inhoudingsplichtige voor de eerste gageverstrekking.

      5 De inhoudingsplichtige bewaart de gageverklaring ten minste vijf jaren na het einde van het kalenderjaar
      waarin het optreden of de sportbeoefening heeft plaatsgevonden bij de loonadministratie. Desgevraagd doet de
      inhoudingsplichtige de gageverklaring aan de inspecteur toekomen binnen een door deze gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel11.3
  - number: '11.4'
    text: |-
      1 De inhoudingsplichtige legt voor ieder buitenlands gezelschap voor de eerste gageverstrekking in het kalenderjaar
      een loonstaat aan en houdt deze vervolgens bij.

      2 De loonstaat wordt opgemaakt overeenkomstig het door de inspecteur verstrekte model. De inhoudingsplichtige mag
      een van het model afwijkende loonstaat gebruiken, mits deze ten minste de mogelijkheid biedt op duidelijke wijze
      dezelfde gegevens te administreren als het model.

      3 De inhoudingsplichtige ontleent de in het hoofd van de loonstaat te vermelden gegevens aan de laatstelijk van de
      leider of vertegenwoordiger van het gezelschap terugontvangen gageverklaring.

      4 In afwijking in zoverre van het derde lid vermeldt de inhoudingsplichtige in het hoofd van de loonstaat de
      gegevens die hem bekend zijn:

      a. indien hij weet dat de laatstelijk van de leider of vertegenwoordiger van het gezelschap terugontvangen
      gageverklaring onjuiste gegevens bevat;

      b. zolang hij niet de laatstelijk uitgereikte gageverklaring ingevuld van de leider of vertegenwoordiger van het
      gezelschap heeft terugontvangen.

      5 [Artikel 7.2, tweede, derde, zevende en achtste lid][ref1], is van overeenkomstige toepassing.

      6 De inhoudingsplichtige houdt, behalve in de gevallen, bedoeld in [artikel 35h, derde lid, van de wet][ref2], de
      belasting in aan de hand van de gegevens, vermeld in het hoofd van de loonstaat.


