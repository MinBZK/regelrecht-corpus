      - id: ref1
        bwb_id: BWBR0002471
        artikel: 31a
  - number: 8.2a
    text: |-
      Ingeval het loon, bedoeld in [artikel 10eb, eerste en tweede lid, van het besluit][ref1], van een werknemer als
      gevolg van het opnemen van ouderschapsverlof of zwangerschapsverlof in een tijdvak op jaarbasis lager is dan
      het bedrag, genoemd in artikel 10eb, eerste lid, onderscheidenlijk tweede lid, van het besluit, wordt in dat
      loontijdvak bij de toepassing van dat artikel ten aanzien van de werknemer uitgegaan van het loon, bedoeld in dat
      artikel, dat de werknemer zou hebben genoten indien hij geen ouderschapsverlof of zwangerschapsverlof zou hebben
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel10eb
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel8.2a
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 10eb
  - number: '8.3'
    text: |-
      1 Als regio als bedoeld in [artikel 10e, tweede lid, onderdeel c, onder 4°, van het besluit][ref1] worden
      aangewezen:

      a. de landen in Azië (waaronder Hong Kong en het gedeelte van Turkije dat ten oosten van de Bosporus is gelegen);

      b. de landen in Afrika;

      c. de landen in Latijns Amerika (waaronder Aruba, Curaçao, Sint Maarten en de BES eilanden);

      d. de volgende landen in Europa: Albanië, Armenië, Azerbeidzjan, Belarus, Bosnië en Herzegovina, Bulgarije,
      Estland, Georgië, Hongarije, Kosovo, Kroatië, Letland, Litouwen, Macedonië, Moldavië, Montenegro, Oekraïne, Polen,
      Roemenië, Rusland, Servië, Slovenië, Slowakije en Tsjechië.

      2 Onder de in het eerste lid genoemde landen worden begrepen gebieden gelegen buiten de territoriale wateren van
      die landen waar deze in overeenstemming met het internationale recht soevereine rechten kunnen uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel10e
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 10e
  - number: '8.4'
    text: |-
      1 Voor de toepassing van [artikel 31a, tweede lid, onderdeel f, van de wet][ref1] verhuist de werknemer in
      ieder geval in het kader van de dienstbetrekking ingeval hij binnen twee jaar na de aanvaarding van een nieuwe
      dienstbetrekking of na overplaatsing binnen de bestaande dienstbetrekking door de verhuizing de afstand tussen zijn
      woning en de plaats van zijn dienstbetrekking met ten minste 60% verkleint terwijl tot die verhuizing de afstand
      tussen zijn woning en de plaats van zijn dienstbetrekking ten minste 25 kilometer bedroeg.

      2 Onder afstand als bedoeld in het eerste lid wordt verstaan de afstand gemeten langs de meest gebruikelijke weg.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31a
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 31a
  - number: '8.5'
    text: |-
      Als eindheffingsbestanddelen als bedoeld in [artikel 32ab, eerste lid, van de wet][ref1] worden aangewezen:

      a. voordelen uit spaarsystemen en goederen of diensten, in de promotionele sfeer;

      b. verstrekkingen die tegelijkertijd en voor dezelfde gelegenheid aan de eigen werknemers zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ab
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel8.5
    references:
