  - number: 12.7a
    text: |-
      Ingeval de inhoudingsplichtige in het aan het kalenderjaar voorafgaande kalenderjaar
      [artikel 10f, eerste of vierde lid, van het beslui][ref1]t, zoals dat luidde op 31 december 2010, heeft toegepast,
      wordt het in dat voorafgaande kalenderjaar in artikel 10f, tweede of vierde lid, van het besluit, zoals dat luidde
      op 31 december 2010, bedoelde bedrag geacht te behoren tot het loon van het eerste loontijdvak van het kalenderjaar
      en geacht te zijn betaald op de laatste werkdag in januari van het kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel10f
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel12.7a
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 10f
  - number: 12.7b
    text: |-
      Ingeval het loon, bedoeld in [artikel 9a, eerste en tweede lid, van het besluit][ref1] zoals dat luidde op
      31 december 2010, van een werknemer als bedoeld in [artikel 39c, eerste lid, van de wet][ref2] als gevolg van
      het opnemen van ouderschapsverlof of zwangerschapsverlof in een tijdvak op jaarbasis lager is dan het bedrag,
      genoemd in artikel 9a, eerste lid, onderscheidenlijk tweede lid, van het besluit zoals dat luidde op 31 december
      2010, wordt in dat loontijdvak bij de toepassing van dat artikel ten aanzien van de werknemer uitgegaan van
      het loon, bedoeld in dat artikel, dat de werknemer zou hebben genoten indien hij geen ouderschapsverlof of
      zwangerschapsverlof zou hebben opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel39c
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel12.7b
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 9a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 39c
