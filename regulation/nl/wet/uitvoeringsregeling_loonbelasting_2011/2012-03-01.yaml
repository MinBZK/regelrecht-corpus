      - id: ref2
        bwb_id: BWBR0025003
        artikel: '10'
  - number: '8.2'
    text: |-
      De verklaring, bedoeld in [artikel 31a, tweede lid, onderdeel d, van de wet][ref1], wordt afgegeven door de
      Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31a
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel8.2
