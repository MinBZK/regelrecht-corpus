      In afwijking van de [artikelen 6][ref1] en [7 van de wet][ref2] wordt ten aanzien van de hulp van de thuiswerker
      die doorgaans voor een opdrachtgever arbeid verricht, de opdrachtgever van die thuiswerker als inhoudingsplichtige
      aangewezen.


