  - number: '12.3'
    text: |-
      Voor de actuariële herrekening, bedoeld in de [artikelen 38c][ref1] en [38d][ref2] van de wet, mag de in de
      regeling vastgestelde ingangsdatum worden vervangen door 1 januari 2006, indien de ingangsdatum in de regeling is
      vastgesteld op een eerdere datum dan 1 januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel38c
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel38d
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel12.3
    references:
