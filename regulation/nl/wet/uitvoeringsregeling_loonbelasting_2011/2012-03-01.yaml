  - number: '12.2'
    text: |-
      1 Voor de toepassing van [artikel 32ba, derde lid, van de wet][ref1], blijven bedragen die de inhoudingsplichtige
      van werknemers heeft ingehouden buiten aanmerking, voor zover deze bedragen ingevolge de op het moment van
      inhouding ter zake van deze inhouding geldende tekst van [artikel 11 van de wet][ref2] niet tot het loon behoren.

      2 Voor de toepassing van [artikel 32ba, derde lid, van de wet][ref3], blijven bijdragen en premies die de
      inhoudingsplichtige van andere inhoudingsplichtigen voldaan heeft gekregen buiten aanmerking, voor zover
      [artikel 32ba, eerste lid, van de wet][ref4], bij die andere inhoudingsplichtigen niet van toepassing is op deze
      bijdragen en premies.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel12.2
