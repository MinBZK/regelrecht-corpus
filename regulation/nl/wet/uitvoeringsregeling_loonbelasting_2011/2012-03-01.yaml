  - number: '9.5'
    text: |-
      1 Indien een inhoudingsplichtige aan de werknemer loon verstrekt over een ander tijdvak dan dat waarover hij het
      regelmatig wederkerende loon verstrekt, wordt naar het loon over dat andere tijdvak verschuldigde belasting, ter
      keuze van de inhoudingsplichtige, berekend hetzij door toepassing van de tabel voor bijzondere beloningen, hetzij
      volgens het tweede en het derde lid.

      2 De belasting naar het loon over het andere tijdvak is gelijk aan het verschil van:

      a. de belasting die op het tijdstip waarop het loon over het andere tijdvak wordt verstrekt, verschuldigd zou
      zijn indien op dat tijdstip tevens werd verstrekt het loon over de met dat andere tijdvak geheel of gedeeltelijk
      samenvallende tijdvakken van het regelmatig wederkerende loon, en

      b. de belasting die op het tijdstip waarop het loon over het andere tijdvak wordt verstrekt, verschuldigd zou zijn
      indien op dat tijdstip uitsluitend werd verstrekt het loon over de met dat andere tijdvak geheel of gedeeltelijk
      samenvallende tijdvakken van het regelmatig wederkerende loon.

      3 Voor de toepassing van het tweede lid, onderdelen a en b, wordt als loontijdvak aangemerkt een tijdvak dat
      even groot is als de gezamenlijke met het andere tijdvak geheel of gedeeltelijk samenvallende tijdvakken van het
      regelmatig wederkerende loon.

      4 Ingeval regelmatig wederkerend loon wordt verstrekt over tijdvakken van verschillende duur die gedeeltelijk
      samenvallen, wordt slechts het loon over het kortste van die tijdvakken als regelmatig wederkerend loon beschouwd.

      5 Ingeval een inhoudingsplichtige loon uit meer dan een vroegere dienstbetrekking verstrekt of geacht wordt te
      verstrekken, wordt de belasting naar het loon over het andere tijdvak – indien dit, afgezien van het vierde lid,
      regelmatig wederkerend loon is – steeds berekend volgens het tweede en het derde lid.
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel9.5
  - number: '9.6'
    text: |-
      Ingeval de in te houden belasting mede afhankelijk is van loon dat is verstrekt of geacht wordt te zijn verstrekt
      door een derde, of van loon van een derde dat door de inhoudingsplichtige geacht wordt te zijn verstrekt, deelt
      die derde de van belang zijnde gegevens alsmede het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-
      fiscaalnummer van de werknemer, schriftelijk mede aan de inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel9.6
  - number: '9.7'
    text: |-
      1 De inspecteur kan onder door hem te stellen voorwaarden ermee instemmen dat de inhoudingsplichtige met betrekking
      tot bepaalde categorieën werknemers voorlopig volstaat met uitbetaling van een geschat nettoloon, gevolgd door
      periodieke afrekening.

      2 De inhoudingsplichtige rekent bij de laatste loonverstrekking in een tijdvak van ten hoogste drie maanden met
      de werknemer de belasting af die is verschuldigd ter zake van het in dat tijdvak aan de werknemer toekomende loon
      waarop de instemming betrekking heeft, met dien verstande dat bij de laatste loonverstrekking in een kalenderjaar
      steeds afrekening plaatsvindt. Daarbij wordt de verschuldigde belasting bepaald als ware het loon verstrekt op het
      tijdstip waarop de afrekening plaatsvindt en over het tijdvak waarop de afrekening betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel9.7
  - number: '10.1'
    text: |-
      1 Vergoedingen ter zake van consumpties tijdens de werktijd die geen deel uitmaken van een maaltijd, behoren
      in ieder geval niet tot de gage, bedoeld in [artikel 35 van de wet][ref1], indien deze vergoedingen € 0,55 per
      gewerkte dag niet te boven gaan.

      2 Het eerste lid is niet van toepassing indien tijdens de werktijd consumpties die geen deel uitmaken van een
      maaltijd, worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '35'
  - number: '10.2'
    text: |-
      1 De Belastingdienst verstrekt aan de inhoudingsplichtige het model van de gageverklaring met de daarbij behorende
      toelichting. De inhoudingsplichtige reikt dienovereenkomstig een gageverklaring met toelichting aan de artiest of
      beroepssporter uit:

      a. zodra hij ten aanzien van de artiest of beroepssporter inhoudingsplichtige wordt;

      b. op verzoek van de artiest of beroepssporter;

      c. zodra hij weet dat zich een wijziging heeft voorgedaan in de gegevens die de artiest of beroepssporter in
      de laatstelijk ingeleverde gageverklaring heeft verstrekt en die wijziging tot gevolg heeft dat de artiest of
      beroepssporter een hoger bedrag aan belasting wordt verschuldigd.

      2 De inhoudingsplichtige mag in plaats van het door de Belastingdienst verstrekte model van de gageverklaring
      gebruikmaken van een eigen model gageverklaring, mits dat model ten minste de gegevens bevat van het door de
      Belastingdienst verstrekte model, inclusief de gebruiksaanwijzing en de toelichting op de vragen.

      3 De artiest of beroepssporter verzoekt de inhoudingsplichtige om uitreiking van een gageverklaring indien zich een
      wijziging voordoet in de eerder door hem verstrekte gegevens en die wijziging tot gevolg heeft dat een hoger bedrag
      aan belasting wordt verschuldigd.

      4 De artiest of beroepssporter aan wie een gageverklaring is uitgereikt, is gehouden de daarbij gevraagde gegevens
      te verstrekken door de gageverklaring duidelijk, stellig en zonder voorbehoud ingevuld en ondertekend, in te
      leveren bij de inhoudingsplichtige. De artiest of beroepssporter levert de ingevulde en ondertekende gageverklaring
      in voor de eerste gageverstrekking.

      5 De inhoudingsplichtige bewaart de gageverklaring tot ten minste vijf jaren na het einde van het kalenderjaar
      waarin het optreden of de sportbeoefening heeft plaatsgevonden bij de loonadministratie. Desgevraagd doet de
      inhoudingsplichtige de gageverklaring aan de inspecteur toekomen binnen een door deze gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel10.2
  - number: '10.3'
    text: |-
      1 De inhoudingsplichtige legt voor iedere artiest of beroepssporter voor de eerste gageverstrekking in het
      kalenderjaar een loonstaat aan en houdt deze vervolgens bij. De loonstaat wordt opgemaakt overeenkomstig het door
      de inspecteur verstrekte model. De inhoudingsplichtige mag een van het model afwijkende loonstaat gebruiken, mits
      deze ten minste de mogelijkheid biedt op duidelijke wijze dezelfde gegevens te administreren als het model.

      2 De inhoudingsplichtige ontleent de in het hoofd van de loonstaat te vermelden gegevens aan:

      a. de laatstelijk van de artiest of beroepssporter terugontvangen gageverklaring;

      b. de door de in Nederland wonende artiest of beroepssporter verstrekte opgaaf van zijn burgerservicenummer of, bij
      het ontbreken daarvan, zijn sociaal-fiscaalnummer, of de door de inspecteur verstrekte opgaaf van dat nummer.

      3 In afwijking in zoverre van het tweede lid, aanhef en onderdeel a, vermeldt de inhoudingsplichtige in het hoofd
      van de loonstaat de gegevens die hem bekend zijn:

      a. indien hij weet dat de laatstelijk van de artiest of beroepssporter terugontvangen gageverklaring onjuiste
      gegevens bevat;

      b. zolang hij niet de laatstelijk uitgereikte gageverklaring ingevuld van de artiest of beroepssporter heeft
      terugontvangen.

      4 [Artikel 7.2, tweede, derde, zevende en achtste lid][ref1], is van overeenkomstige toepassing.

      5 De inhoudingsplichtige houdt, behalve in de gevallen, bedoeld in [artikel 35a, derde lid, van de wet][ref2], de
      belasting in aan de hand van de gegevens, vermeld in het hoofd van de loonstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028236#Artikel7.2
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35a
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel10.3
    references:
