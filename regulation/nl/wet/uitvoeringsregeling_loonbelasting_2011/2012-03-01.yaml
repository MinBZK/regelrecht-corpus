      met invaliditeit als bedoeld in [artikel 11, eerste lid, onderdeel l, van de wet][ref1] worden aangewezen:
      voorzieningen in de zin van de [Voorzieningenregeling voor militaire oorlogs- en dienstslachtoffers][ref2].


