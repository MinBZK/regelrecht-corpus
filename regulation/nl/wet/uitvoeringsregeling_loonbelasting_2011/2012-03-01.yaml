        artikel: '1'
  - number: '7.6'
    text: |-
      1 De eerstedagsmelding, bedoeld in [artikel 28, eerste lid, onderdeel f, van de wet][ref1], wordt langs
      elektronische weg gedaan.

      2 Ingeval met toepassing van
      [artikel 20, derde lid, van de Uitvoeringsregeling Algemene wet inzake rijksbelastingen 1994][ref2] voor de
      loonbelasting ontheffing is verleend van de in het tweede lid van dat artikel genoemde verplichting tot het
      doen van aangifte langs elektronische weg, wordt, in afwijking van het eerste lid, de eerstedagsmelding gedaan
      door het invullen, ondertekenen en inleveren of toezenden van het door de inspecteur uitgereikte of toegezonden
      meldingsformulier.

      3 De eerstedagsmelding bevat:

      a. het loonheffingennummer van de inhoudingsplichtige;

      b. het burgerservicenummer van de werknemer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer of, bij het
      ontbreken van deze nummers, een uniek personeelsnummer;

      c. de naam van de werknemer;

      d. de geboortedatum van de werknemer;

      e. de datum van aanvang van de werkzaamheden.

      Ingeval de eerstedagsmelding ingevolge het tweede lid met een meldingsformulier wordt gedaan, bevat de
      eerstedagsmelding tevens de naam van de inhoudingsplichtige.

      4 De vorige leden zijn niet van toepassing ingeval de werknemer zijn werkzaamheden aanvangt bij een
      inhoudingsplichtige die met de zonder onderbreking voorafgaande inhoudingsplichtige van de werknemer behoort tot
      dezelfde samenhangende groep inhoudingsplichtigen in de zin van [artikel 27e van de wet][ref3].


