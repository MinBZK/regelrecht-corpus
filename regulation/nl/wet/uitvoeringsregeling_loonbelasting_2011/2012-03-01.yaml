  - number: '12.7'
    text: |-
      Ingeval de inhoudingsplichtige [artikel 39c, eerste lid, van de wet][ref1] toepast:

      a. zijn niet van toepassing:

      1°. hoofdstuk 4a van het besluit;

      2°. de [artikelen 3.7][ref2], [3.8][ref3], [3.9][ref4], [3.10][ref5], [3.11][ref6], [7.3][ref7], [8.2][ref8],
      [8.3][ref9], [8.4][ref10], [8.5][ref11], [10.1][ref12], [11.2][ref13] en 12.7a;

      b. blijven van toepassing:

      1°. de [artikelen 8 tot en met 10][ref14] en [10f van het besluit][ref15], zoals deze op 31 december 2010 luidden;

      2°. de [artikelen 2][ref16], [8][ref17], , [20][ref18], [21][ref19], [21a][ref20], [21b][ref21],
      [22][ref22], [23][ref23], [24][ref24], [25][ref25], [26][ref26], [27][ref27], [28][ref28], [29][ref29],
