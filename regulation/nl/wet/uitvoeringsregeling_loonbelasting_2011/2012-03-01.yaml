        artikel: 38c
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 38d
  - number: '12.4'
    text: |-
      Voor aanspraken ingevolge een regeling voor verlofsparen als bedoeld in
      [artikel 11 van de wet][ref1], zoals dit op 31 december 2005 luidde, blijven de
      [artikelen 12 tot en met 16 van de Uitvoeringsregeling loonbelasting 2001][ref2], zoals deze op 31 december
      2005 luidden, van toepassing, voor zover deze aanspraken niet zijn omgezet in aanspraken ingevolge een
      levensloopregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel12
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel12.4
