  - number: '1.2'
    text: |-
      1 Deze regeling verstaat onder:

        - *wet:* de [Wet op de loonbelasting 1964][ref1];
        - *besluit:* het [Uitvoeringsbesluit loonbelasting 1965][ref2];
        - *belasting:* ingeval [artikel 27b, eerste lid, van de wet][ref3] van toepassing is: het gezamenlijke bedrag van
      de belasting en de premie voor de volksverzekeringen;
        - *inhoudingsplichtigenverklaring:* de verklaring dat degene aan wie die verklaring is afgegeven ten aanzien van
      artiesten of beroepssporters als inhoudingsplichtige is aangewezen;
        - *Minister:* de Minister van Financiën
        - *werkplek:* iedere plaats die in verband met het verrichten van arbeid wordt gebruikt en waarvoor voor de
      inhoudingsplichtige de [Arbeidsomstandighedenwet][ref4] van toepassing is, met dien verstande dat niet als werkplek
      wordt aangemerkt een werkruimte gelegen in een woning, een duurzaam aan een plaats gebonden schip of een woonwagen
      in de zin van [artikel 1 van de Huisvestingswet][ref5], de aanhorigheden daaronder begrepen, van de werknemer;
        - *verbonden vennootschap:* een verbonden vennootschap als bedoeld in [artikel 10a, zevende lid, van de wet][ref6];
        - *jaaropgaaf:* de opgave van het in het kalenderjaar genoten loon, de ingehouden belasting en andere gegevens die
      van belang kunnen zijn voor de heffing van de inkomstenbelasting;
        - *heffingskorting:* de standaardloonheffingskorting, bedoeld in [artikel 21c van de wet][ref7].

      2 In deze regeling wordt onder een uitkering ingevolge een sociale verzekeringswet mede verstaan de toeslag die
      ingevolge de [Toeslagenwet][ref8] wordt verleend op die uitkering.


