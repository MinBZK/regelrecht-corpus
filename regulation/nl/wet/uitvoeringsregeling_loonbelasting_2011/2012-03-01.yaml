  - number: '7.10'
    text: |-
      1 De [artikelen 7.5][ref1] en [7.9][ref2] zijn niet van toepassing ingeval de werknemer zijn werkzaamheden aanvangt
      bij een inhoudingsplichtige die met de zonder onderbreking voorafgaande inhoudingsplichtige van de werknemer
      behoort tot dezelfde samenhangende groep inhoudingsplichtigen in de zin van [artikel 27e van de wet][ref3].

      2 Zodra de inhoudingsplichtige en de zonder onderbreking voorafgaande inhoudingsplichtigen van de werknemer niet
      langer tot dezelfde samenhangende groep inhoudingsplichtigen behoren, zijn de [artikelen 7.5][ref4] en [7.9][ref5]
      alsnog van toepassing alsof de inhoudingsplichtige op dat moment ten aanzien van de werknemer inhoudingsplichtige
      wordt en de werknemer op dat moment zijn werkzaamheden aanvangt.

      3 Het tweede lid is niet van toepassing indien de ten aanzien van de werknemer van belang zijnde stukken, bedoeld
      in de [artikelen 7.5][ref6] en [7.9][ref7], aan de inhoudingsplichtige zijn overgedragen. Artikel 7.5, vierde lid,
      en artikel 7.9, derde lid, zijn van overeenkomstige toepassing.


