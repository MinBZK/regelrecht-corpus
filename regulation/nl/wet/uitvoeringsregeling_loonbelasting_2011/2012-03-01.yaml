    text: |-
      De waarde van het genot van een in het kader van de dienstbetrekking ter beschikking gestelde openbaarvervoerkaart
      of voordeelurenkaart, bedoeld in [artikel 13, derde lid, onderdeel b, van de wet][ref1], wordt, indien aannemelijk
      is dat deze kaart mede dient voor zakelijke reizen, waaronder woon-werkverkeer, gesteld op nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13
