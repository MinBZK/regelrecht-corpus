  - number: '12.1'
    text: |-
      1 Ten aanzien van de werknemer die op 31 december 2000 overeenkomstig de loonbelastingverklaring was ingedeeld in
      tariefgroep 0, wordt de belasting ingehouden zonder toepassing van de heffingskorting.

      2 Ten aanzien van de werknemer die op 31 december 2000 overeenkomstig de loonbelastingverklaring was ingedeeld in
      tariefgroep 1, 2, 3, 4 of 5, wordt de belasting ingehouden met toepassing van de heffingskorting.

      3 Het bepaalde in het eerste lid en tweede lid is van toepassing
      totdat de inhoudingsplichtige op grond van het bepaalde in
      [artikel 65, eerste lid, onderdeel b of onderdeel c, van de Uitvoeringsregeling loonbelasting 2001][ref1], zoals
      dat op 31 december 2006 luidde, aan de werknemer een loonbelastingverklaring moet uitreiken of totdat de werknemer
      op grond van [artikel 23, eerste lid, van de wet][ref2] een verzoek doet om toepassing van de heffingskorting of
      overeenkomstig deze bepaling verzoekt de heffingskorting niet meer toe te passen.

      4 De laatstelijk van de werknemer terugontvangen loonbelastingverklaring, bedoeld in
      [artikel 29, vierde lid, van de wet][ref3], zoals dat op 31 december 2006 luidde, wordt voor de toepassing
      van de heffingskorting aangemerkt als een verzoek als bedoeld in [artikel 23, eerste lid, van de wet][ref4]
      onderscheidenlijk de intrekking van een dergelijk verzoek.

      5 De inhoudingsplichtige bewaart de in het vierde lid bedoelde loonbelastingverklaring ten minste vijf jaren na het
      einde van het kalenderjaar waarin de dienstbetrekking is geëindigd bij de loonadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel29
