  - number: '4.2'
    text: |-
      Voor de toepassing van [artikel 19a van de wet][ref1] worden van de staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte aangewezen: IJsland, Noorwegen en Liechtenstein.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel4.2
    references:
