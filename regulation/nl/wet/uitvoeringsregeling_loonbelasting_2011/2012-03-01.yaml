      1 De waarde van het rentevoordeel van een door de inhoudingsplichtige dan wel door een met de inhoudingsplichtige
      verbonden vennootschap aan de werknemer verstrekte geldlening, daaronder begrepen een gedeelte van een geldlening,
      wordt gesteld op nihil, indien het rentevoordeel – indien tot het loon gerekend – als aftrekbare kosten in de
      zin van de [artikelen 3.120 tot en met 3.123 van de Wet inkomstenbelasting 2001][ref1] in aanmerking zou worden
      genomen, en:

      a. de werknemer schriftelijk aan de inhoudingsplichtige verklaart, onder vermelding van het
      bestedingsdoel en onderbouwing met schriftelijke bescheiden, dat de geldlening kan worden
      aangemerkt als een geldlening waarvan de rente aftrekbare kosten zijn in de zin van de
      [artikelen 3.120 tot en met 3.123 van de Wet inkomstenbelasting 2001][ref2];

      b. de inhoudingsplichtige de verklaring en bescheiden, bedoeld in onderdeel a, bij de loonadministratie bewaart,
      tenzij daarvan met overeenkomstige toepassing van [artikel 7.3, tweede lid][ref3], wordt afgeweken, en

      c. de inhoudingsplichtige de toepassing van dit lid in de aangifte loonheffingen vermeldt.

      2 Het eerste lid is van overeenkomstige toepassing op aan een geldlening als bedoeld in het eerste lid verbonden
      kosten.

      3 Het rentevoordeel van een door de inhoudingsplichtige dan wel door een met de inhoudingsplichtige verbonden
      vennootschap aan de werknemer verstrekte geldlening ter zake van de aanschaf van een fiets, elektrische fiets of
      elektrische scooter wordt gesteld op nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.120
