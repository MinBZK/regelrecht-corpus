        artikel: 32ba
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 32ba
  - number: '8.7'
    text: |-
      1 Een regeling ingevolge welke de jaarlijkse arbeidsduur ten opzichte van de jaarlijkse arbeidsduur in het
      voorafgaande kalenderjaar met ten hoogste 50% wordt verminderd, wordt niet aangemerkt als een regeling voor
      vervroegde uittreding in de zin van [artikel 32ba van de wet][ref1]. De eerste volzin is niet van toepassing
      indien:

      a. de arbeidsduur meer dan 50% lager is dan de arbeidsduur in het laatste kalenderjaar voorafgaand aan het begin
      van de periode die aanvangt 10 jaar direct voorafgaande aan de in de pensioenregeling vastgestelde ingangsdatum, of

      b. anders dan als gevolg van ziekte, arbeidsongeschiktheid of jaarlijks vakantieverlof, per week minder dan 50%
      van de arbeidsduur per week zoals die gold in het laatste kalenderjaar, bedoeld in onderdeel a, feitelijk pleegt te
      worden gewerkt.

      2 Een regeling die uitsluitend voorziet in uitkeringen als bedoeld in
      [artikel 11, eerste lid, onderdeel f, van de wet][ref2], wordt niet aangemerkt als een regeling voor vervroegde
      uittreding in de zin van [artikel 32ba van de wet][ref3], indien:

      a. deze uitkeringen naar aard, strekking, omvang en uitkeringsduur overeenkomen met de uitkeringen ingevolge
      aanspraken als bedoeld in [artikel 11, eerste lid, onderdeel e, van de wet][ref4], en

      b. werknemers die deze uitkeringen genieten in de periode van de uitkeringen geen uitkeringen ter zake van dezelfde
      dienstbetrekking genieten ingevolge [artikel 11, eerste lid, onderdeel e, van de wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel11
