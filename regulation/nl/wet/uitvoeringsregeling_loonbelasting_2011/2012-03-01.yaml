      zal worden ingehouden door een ander dan degene met wie de sportbeoefening is overeengekomen ten aanzien
      van de beroepssporter, wordt in afwijking van [artikel 8a, eerste en tweede lid, van de wet][ref2] als
      inhoudingsplichtige aangewezen: degene die op grond van de overeenkomst de inhouding overneemt.


