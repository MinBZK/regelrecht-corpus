  - number: 12.2a
    text: |-
      1 Voor de toepassing van [artikel 32ba, derde lid, van de wet][ref1], blijven bedragen die de inhoudingsplichtige
      van werknemers heeft ingehouden voor de helft buiten aanmerking, voor zover deze bedragen ingevolge de op het
      moment van inhouding ter zake van deze inhouding geldende tekst van [artikel 11 van de wet][ref2] voor de helft
      niet tot het loon behoren en voor zover blijkt dat deze bedragen met het oog op de toepassing van artikel 32ba,
      derde lid, van de wet op een ongebruikelijk tijdstip zijn ingehouden.

      2 Voor de toepassing van [artikel 32ba, derde lid, van de wet][ref3], blijven bijdragen en premies die de
      inhoudingsplichtige van andere inhoudingsplichtigen voldaan heeft gekregen voor de helft buiten aanmerking,
      voor zover artikel 32ba, eerste lid, van de wet bij die andere inhoudingsplichtigen naar een tarief van 26% van
      toepassing is op deze bijdragen en premies en voor zover blijkt dat deze bijdragen en premies met het oog op de
      toepassing van artikel 32ba, derde lid, van de wet op een ongebruikelijk tijdstip zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
    url: https://wetten.overheid.nl/BWBR0028236/2012-03-01#Artikel12.2a
