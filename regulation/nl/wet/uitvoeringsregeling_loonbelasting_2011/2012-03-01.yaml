  - number: '3.13'
    text: |-
      1 De rittenregistratie, bedoeld in [artikel 13bis, vierde lid, van de wet][ref1], bevat ten minste de volgende
      gegevens:

      a. merk, type en kenteken van de auto;

      b. periode van terbeschikkingstelling van de auto;

      c. per rit:

      1°. datum;

      2°. beginstand en eindstand van de kilometerteller;

      3°. beginadres en eindadres;

      4°. de gereden route indien deze afwijkt van de meest gebruikelijke;

      5°. het karakter van de rit.

      2 Indien in een loontijdvak de vergoeding die de werknemer voor het gebruik voor privédoeleinden verschuldigd is,
      uitgaat boven het voor dat loontijdvak op grond van [artikel 13bis, eerste tot en met derde lid, van de wet][ref2]
      berekende voordeel, wordt in dat loontijdvak een negatief bedrag ter grootte van het verschil tussen het berekende
      voordeel en de verschuldigde vergoeding als voordeel in aanmerking genomen, voor zover op kalenderjaarbasis het
      berekende voordeel ten minste gelijk is aan de vergoeding voor het gebruik voor privédoeleinden.

      3 Een verzoek om een verklaring geen privégebruik als bedoeld in [artikel 13bis, dertiende lid, van de wet][ref3]
      bevat ten minste de volgende gegevens:

      a. de naam, het adres en het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer van de
      werknemer;

      b. het kenteken van de auto, indien dit bekend is en het verzoek betrekking heeft op één auto;

      c. het jaar van ingang van de verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
