preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is Verordening (EU) nr. 910/2014 van het Europees
    Parlement en de Raad van 23 juli 2014 betreffende elektronische identificatie en vertrouwensdiensten voor
    elektronische transacties in de interne markt en tot intrekking van Richtlijn 1999/93/EG (PbEU 2014, L257) uit
    te voeren, en dat het wenselijk is de hiervoor noodzakelijke bepalingen aan te passen in de Boeken 3 en 6 van
    het Burgerlijk Wetboek, de Telecommunicatiewet, de Algemene wet bestuursrecht, alsmede daarmee samenhangende
    wijzigingen van andere wetten;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0039151/2017-03-10#ArtikelAanhef
articles:
  - number: XI.1
    text: |-
      [Artikel 1.1 van de Telecommunicatiewet][ref1], zoals dat luidde voor het tijdstip van inwerkingtreding van
      [artikel I, onderdeel A][ref2], van deze wet, is van toepassing op de in de volgende leden gebruikte begrippen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0039151#ArtikelI
    url: https://wetten.overheid.nl/BWBR0039151/2017-03-10#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0039151
        artikel: I
  - number: XI.2
    text: |-
      Indien voor het tijdstip van inwerkingtreding van artikel I van deze wet een
      aanvraag door een certificatiedienstverlener is ingediend tot registratie, bedoeld in
      [artikel 2.1, vijfde lid, van de Telecommunicatiewet][ref1] zoals dit artikellid luidde voor inwerkingtreding van
      [artikel I][ref2] van deze wet, en op het tijdstip van inwerkingtreding van deze wet hierop nog geen besluit is
      genomen door de Autoriteit Consument en Markt, wordt die aanvraag door Onze Minister behandeld als een aanvraag
      waarop deze wet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039151#ArtikelI
    url: https://wetten.overheid.nl/BWBR0039151/2017-03-10#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0039151
        artikel: I
  - number: XI.3
    text: |-
      Indien voor het tijdstip van inwerkingtreding van artikel I van deze wet een aanvraag door een instelling
      als bedoeld in [artikel 18.17a, eerste lid, van de Telecommunicatiewet][ref1] zoals die wet luidde voor
      inwerkingtreding van [artikel I][ref2] van deze wet, bij Onze Minister is ingediend en op het tijdstip van
      inwerkingtreding van deze wet hierop nog geen besluit is genomen, wordt die aanvraag door Onze Minister behandeld
      als een aanvraag waarop deze wet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0039151#ArtikelI
    url: https://wetten.overheid.nl/BWBR0039151/2017-03-10#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0039151
        artikel: I
  - number: XI.4
    text: |-
      Ten aanzien van de behandeling van bezwaar of beroep dat voor of na het tijdstip van inwerkingtreding van deze wet
      is gemaakt of ingesteld tegen een besluit genomen door de Autoriteit Consument en Markt voor de inwerkingtreding
      van [artikel I][ref1] van deze wet op een aanvraag door een certificatiedienstverlener tot registratie als bedoeld
      in [artikel 2.1, vijfde lid, van de Telecommunicatiewet][ref2] zoals dit artikellid luidde voor inwerkingtreding
      van artikel I van deze wet, is het recht zoals dat gold voor het tijdstip van inwerkingtreding van artikel I van
      deze wet van toepassing en behandelt de Autoriteit Consument en Markt het gemaakte bezwaar of ingestelde beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0039151#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel2
    url: https://wetten.overheid.nl/BWBR0039151/2017-03-10#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0039151
        artikel: I
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '2'
  - number: XI.5
    text: |-
      Ten aanzien van de behandeling van bezwaar of beroep dat voor of na het tijdstip van inwerkingtreding
      van deze wet is gemaakt of ingesteld tegen een besluit genomen door Onze Minister voor de
      inwerkingtreding van [artikel I][ref1] van deze wet op een aanvraag door een instelling als bedoeld in
      [artikel 18.17a, eerste lid, van de Telecommunicatiewet][ref2] zoals dit artikellid luidde voor inwerkingtreding
      van deze wet, is het recht zoals dat gold voor het tijdstip van inwerkingtreding van artikel I van deze wet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039151#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel18
    url: https://wetten.overheid.nl/BWBR0039151/2017-03-10#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0039151
        artikel: I
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '18'
  - number: XI.6
    text: |-
      Een door de Minister aangewezen instelling als bedoeld in
      [artikel 18.17a, eerste lid, van de Telecommunicatiewet][ref1] zoals dit artikellid luidde voor inwerkingtreding
      van [artikel I][ref2] van deze wet, wordt na inwerkingtreding van artikel I van deze wet aangemerkt als een
      aangewezen instelling als bedoeld in dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0039151#ArtikelI
    url: https://wetten.overheid.nl/BWBR0039151/2017-03-10#ArtikelXI
    references:
