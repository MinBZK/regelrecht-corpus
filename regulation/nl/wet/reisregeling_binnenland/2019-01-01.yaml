  - number: '5'
    text: |-
      1 De vergoeding wegens verblijfkosten als bedoeld in [artikel 13, eerste lid, van het besluit][ref1] omvat voor
      ieder vol etmaal dat de dienstreis duurt een bedrag van € 5,07 voor kleine uitgaven overdag (dagcomponent) alsmede
      een bedrag van € 15,12 voor kleine uitgaven 's-avonds (avondcomponent) vermeerderd met:

      a. € 15,67 voor een lunch (lunchcomponent);

      b. € 23,71 voor een avondmaaltijd (dinercomponent);

      c. € 103,72 voor logies (logiescomponent);

      d. € 10,13 voor een ontbijt (ontbijtcomponent).

      2 De aanspraak op de onder het eerste lid onderdeel a, b, c en d bedoelde vergoedingen bestaat slechts indien voor
      het verkrijgen van de respectievelijke verstrekkingen kosten zijn gemaakt in een daarvoor bestemde gelegenheid.

      3 Bij aansluitende dienstreizen kan de avondcomponent als bedoeld in het eerste lid niet langer dan voor de eerste
      acht avonden worden toegekend. Voor ieder volgend etmaal dat binnen die dienstreizen valt, wordt het bedrag van de
      avondcomponent gehalveerd.

      4 Voor een resterend gedeelte van een etmaal dan wel voor een incidentele dienstreis van kortere duur dan een
      etmaal worden de uit te keren bedragen voor verblijfkosten berekend overeenkomstig het eerste, het tweede en het
      derde lid, met dien verstande dat:

      a. de dagcomponent slechts wordt toegekend, indien mede wordt voldaan aan de voorwaarde dat ten minste 4 uren in
      het resterende gedeelte of in de dienstreis valt;

      b. de avondcomponent en de ontbijtcomponent slechts worden toegekend, indien mede wordt voldaan aan de voorwaarde
      dat een overnachting in het resterende gedeelte of in de dienstreis valt;

      c. de lunchcomponent respectievelijk de dinercomponent slechts worden toegekend, indien mede wordt voldaan aan de
      voorwaarde dat de tijd tussen 12.00 uur en 14.00 uur respectievelijk tussen 18.00 uur en 21.00 uur geheel in het
      resterende gedeelte of in de dienstreis valt.

      5 De vergoeding voor een overnachting als bedoeld in [artikel 13, derde lid, van het besluit][ref2] is gelijk aan
      de werkelijke kosten.


