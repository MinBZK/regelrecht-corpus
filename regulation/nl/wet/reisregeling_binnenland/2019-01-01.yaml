    text: |-
      1 In deze regeling wordt verstaan onder ‘besluit’: [Reisbesluit binnenland][ref1].

      2 De begripsomschrijvingen in [artikel 2 van het besluit][ref2] zijn voor de toepassing van deze regeling van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005889
