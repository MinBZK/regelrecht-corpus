  - number: '2'
    text: |-
      De vergoeding voor het gebruik van een eigen motorvoertuig of bromfiets als bedoeld in
      [artikel 7 van het besluit][ref1], bedraagt € 0,37 per afgelegde kilometer.


      [ref1]: https://wetten.overheid.nl/BWBR0005889#Artikel7
    url: https://wetten.overheid.nl/BWBR0005912/2019-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005889
        artikel: '7'
  - number: '3'
    text: |-
      De vergoeding voor het gebruik van een eigen motorvoertuig of bromfiets als bedoeld in
      [artikel 8 van het besluit][ref1] bedraagt in beide gevallen € 0,09 per afgelegde kilometer. Deze vergoeding wordt
      verhoogd met € 0,09 per afgelegde kilometer voor iedere in het kader van de dienstreis meereizende betrokkene, tot
      een maximum van € 0,37 per afgelegde kilometer.


      [ref1]: https://wetten.overheid.nl/BWBR0005889#Artikel8
    url: https://wetten.overheid.nl/BWBR0005912/2019-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005889
        artikel: '8'
  - number: '4'
    text: |-
      De vergoeding voor het gebruik van een eigen fiets als bedoeld in [artikel 9 van het besluit][ref1] bedraagt:

      a. € 0,37 per afgelegde kilometer indien openbaar vervoer niet mogelijk of niet doelmatig is;

      b. € 0,09 per afgelegde kilometer, vermeerderd met de eventuele kosten van stalling, indien openbaar vervoer wel
      doelmatig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005889#Artikel9
    url: https://wetten.overheid.nl/BWBR0005912/2019-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005889
        artikel: '9'
  - number: 4a
    text: |-
      1 Het gedeelte van de in de [artikelen 2][ref1], [3][ref2] en [4][ref3] genoemde vergoeding dat uitgaat boven
      het bedrag per kilometer dat maximaal belastingvrij mag worden vergoed, strekt mede tot vergoeding van kilometers
      die al dan niet op grond van het [Reisbesluit binnenland][ref4], het [Reisbesluit buitenland][ref5], het
      [Verplaatsingskostenbesluit 1989][ref6] en daarvan afgeleide regelingen nog aanvullend belastingvrij kunnen worden
      vergoed.

      2 De toepassing van het eerste lid geschiedt per kalenderjaar.

      3 Bij tussentijdse beëindiging van de dienstbetrekking in de loop van een kalenderjaar dient de na toepassing van
      het eerste lid eventueel verschuldigde loonheffing te worden ingehouden uiterlijk in de kalendermaand volgende op
      de kalendermaand waarin de dienstbetrekking eindigt.

      4 Bij de toepassing van het eerste en tweede lid worden de vergoedingen, genoemd in de [artikelen 2][ref7],
      [3][ref8] en [4][ref9] toegekend als voorschot.

      5 Na afloop van het desbetreffende kalenderjaar worden de in het vierde lid bedoelde vergoedingen definitief
      vastgesteld.

      6 Voor de berekening van de loonheffing over het bovenmatig deel van de in het desbetreffende
      kalenderjaar uitbetaalde vergoedingen dient te worden uitgegaan van alle daadwerkelijk afgelegde
      dienstreiskilometers, vermeerderd met de overeenkomstig de [artikelen 11, vierde lid][ref10], [12][ref11]
      en [13 van de Verplaatsingskostenregeling 1989][ref12] berekende woon-werkverkeerkilometers waarvoor een
      tegemoetkoming is toegekend.


