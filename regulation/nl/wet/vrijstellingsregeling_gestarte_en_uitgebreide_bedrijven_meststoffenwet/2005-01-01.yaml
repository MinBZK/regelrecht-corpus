  - number: '5'
    text: |-
      Voor de toepassing van [artikel 2][ref1] wordt uitsluitend in aanmerking genomen het aantal dieren van de
      onderscheiden diercategorieën, dat kan worden gestaafd met de gegevens van de administratie en de, desgevraagd door
      de inspecteur van de Dienst Regelingen, door de heffingplichtige overgelegde andere bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0011238#Artikel2
    url: https://wetten.overheid.nl/BWBR0011238/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011238
        artikel: '2'
  - number: '6'
    text: |-
      Voor de toepassing van artikel 43 van de wet wordt dat deel van de belastbare hoeveelheid mineralen, waarover door
      toepassing van [artikel 2][ref1] geen heffing is geheven, niet in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011238#Artikel2
    url: https://wetten.overheid.nl/BWBR0011238/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011238
        artikel: '2'
  - number: '7'
    text: |-
      1 De vrijstelling, bedoeld in [artikel 2, eerste lid][ref1], is van toepassing onder voorbehoud van instemming van
      de Commissie van de Europese Gemeenschappen.

      2 De voorwaarden waaronder de vrijstelling wordt toegepast kunnen komen te vervallen of worden gewijzigd ter
      verkrijging van de instemming van de Commissie van de Europese Gemeenschappen voor deze regeling, of wegens het
      uitblijven daarvan.

      3 Van de instemming van de Commissie van de Europese Gemeenschappen wordt melding gemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0011238#Artikel2
    url: https://wetten.overheid.nl/BWBR0011238/2005-01-01#Artikel7
