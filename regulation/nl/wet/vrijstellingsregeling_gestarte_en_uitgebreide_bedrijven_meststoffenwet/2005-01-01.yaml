        bwb_id: BWBR0010268
  - number: '3'
    text: |-
      1 In zoverre in afwijking van [artikel 2, eerste lid, onderdeel a][ref1], is de toename op een bedrijf dat in het
      kalenderjaar waarin de veestapel is uitgebreid is ontstaan door samenvoeging van bedrijven of splitsing van een
      bedrijf, ten minste 15% van het aantal dieren dat onmiddellijk na de samenvoeging, onderscheidenlijk de splitsing,
      aanwezig was op het door samenvoeging of splitsing ontstane bedrijf.

      2 In zoverre in afwijking van [artikel 2, tweede lid][ref2], eerste gedachtestreepje, wordt het aantal dieren van
      de in de bijlage bij de regeling genoemde diercategorieën dat gemiddeld op een bedrijf als bedoeld in het eerste
      lid werd gehouden in het kalenderjaar waarin de veestapel is uitgebreid, verminderd met het aantal dieren van de
      desbetreffende diercategorie dat onmiddellijk na de samenvoeging, onderscheidenlijk de splitsing, aanwezig was op
      het desbetreffende bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0011238#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011238#Artikel2
    url: https://wetten.overheid.nl/BWBR0011238/2005-01-01#Artikel3
    references:
