preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op artikel 59, eerste en derde lid, van de Meststoffenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011238/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder wet: [Meststoffenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0011238/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '2'
    text: |-
      1 Een bedrijf waarop in enig kalenderjaar het aantal dieren, uitgedrukt in grootvee-eenheden overeenkomstig
      de daarvoor in bijlage A bij de wet opgenomen normen, dat gemiddeld op het bedrijf is gehouden is toegenomen,
      is in dat kalenderjaar vrijgesteld van de heffingen, bedoeld in titel 2 van hoofdstuk IV van de wet, tot een
      overeenkomstig het tweede lid bepaalde belastbare hoeveelheid mineralen, uitgedrukt in kilogrammen fosfaat en
      stikstof, indien is voldaan aan elk van de volgende voorwaarden:

      a. de toename is ten minste 15% van het aantal dieren dat gemiddeld op het bedrijf is gehouden in het voorafgaande
      kalenderjaar;

      b. de toename is ten minste 15% van het aantal dieren dat gemiddeld op het bedrijf is gehouden in het kalenderjaar
      waarin het bedrijf laatstelijk ingevolge deze regeling is vrijgesteld;

      c. de toename is ten minste 3 grootvee-eenheden.

      2 De belastbare hoeveelheid mineralen waarvoor de vrijstelling geldt wordt bepaald door achtereenvolgens:

        - het aantal dieren van elk van de in de bijlage bij de regeling genoemde diercategorieën dat gemiddeld op het
      bedrijf is gehouden in het desbetreffende kalenderjaar, te verminderen met het aantal dieren van de desbetreffende
      diercategorie dat gemiddeld op het bedrijf is gehouden in het voorafgaande kalenderjaar, of, indien het gemiddeld
      op het bedrijf gehouden aantal dieren, uitgedrukt in grootvee-eenheden overeenkomstig de daarvoor in bijlage A
      bij de wet opgenomen normen, in het voorafgaande kalenderjaar lager is dan in het kalenderjaar waarin het bedrijf
      laatstelijk ingevolge deze regeling is vrijgesteld, met het aantal dieren van de desbetreffende diercategorie dat
      gemiddeld op het bedrijf is gehouden in het kalenderjaar waarin het bedrijf laatstelijk ingevolge deze regeling
      is vrijgesteld,
        - de uitkomsten te vermenigvuldigen met de voor de desbetreffende diercategorie in de tabel die in de bijlage
      bij de regeling is opgenomen aangegeven hoeveelheid fosfaat, onderscheidenlijk stikstof, in voorkomend geval
      onderscheiden naar de mestcode waarmee de door dieren van de desbetreffende diercategorie geproduceerde meststoffen
      in bijlage C bij de wet worden aangeduid,
        - de aldus berekende hoeveelheden fosfaat, onderscheidenlijk stikstof, die groter zijn dan nihil, bij elkaar op te
      tellen en op de uitkomst daarvan de hoeveelheden fosfaat, onderscheidenlijk stikstof, die kleiner zijn dan nihil,
      in mindering te brengen.

      3 Indien de vrijstelling betrekking heeft op 1998 worden voor de toepassing van dit artikel
      de dieren van de diercategorieën 400 tot en met 407, 410 en 411, onderscheiden in bijlage A
      bij de wet, die in aanmerking zijn genomen bij de bepaling van het aantal dieren waarop de
      [Vrijstellingsregeling herbevolking varkenshouderijen Meststoffenwet][ref1] van toepassing is, buiten beschouwing
      gelaten.

      4 Indien het bedrijf is ontstaan in de loop van het kalenderjaar, bedoeld in het eerste lid, onderdeel a, dan
      wel onderdeel b, wordt voor de toepassing van die bepalingen, en van het tweede lid, eerste gedachtestreepje, het
      gemiddeld in het desbetreffende jaar gehouden aantal dieren bepaald als het aantal dat gemiddeld werd gehouden in
      het na het ontstaan van het bedrijf resterende deel van dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010268
    url: https://wetten.overheid.nl/BWBR0011238/2005-01-01#Artikel2
    references:
