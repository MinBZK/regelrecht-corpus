        bwb_id: BWBR0011238
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011238
        artikel: '2'
  - number: '4'
    text: |-
      1 Bij de aangifte, bedoeld in [artikel 28 van de wet][ref1], die betrekking heeft op het jaar waarvoor de
      vrijstelling, bedoeld in [artikel 2, eerste lid][ref2], geldt, wordt door de heffingplichtige melding gemaakt
      van het overeenkomstig [artikel 2, tweede lid][ref3], en in voorkomend geval [artikel 3, tweede lid][ref4],
      berekende aantal dieren van de onderscheiden diercategorieën. De heffingplichtige maakt ten aanzien van de
      dieren van de in de bijlage bij de regeling onderscheiden diercategorieën 300, 301, 310, 311 en 411 tevens
      melding van de mestcode waarmee de door de desbetreffende dieren geproduceerde meststoffen worden aangeduid in
      [bijlage C bij de wet][ref5].

      2 De melding geschiedt op een daartoe door de Minister van Landbouw, Natuur en Voedselkwaliteit vastgesteld
      formulier, dat overeenkomstig de daarop aangegeven wijze wordt ingevuld.

      3 Bij de melding wordt een afschrift van de dieradministratie met betrekking tot het jaar waarop de vrijstelling
      van toepassing is meegezonden.

      4 De heffingplichtige die overeenkomstig
      [artikel 9a, eerste lid, van de Regeling uitvoering heffingen en verrekening Meststoffenwet][ref6] geen aangifte
      doet, is vrijgesteld van de verplichting tot het doen de melding.


