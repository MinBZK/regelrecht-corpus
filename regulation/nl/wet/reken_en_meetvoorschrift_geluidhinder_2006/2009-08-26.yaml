---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: reken_en_meetvoorschrift_geluidhinder_2006
regulatory_layer: WET
publication_date: '2012-06-27'
valid_from: '2009-08-26'
bwb_id: BWBR0020773
url: https://wetten.overheid.nl/BWBR0020773/2009-08-26
preamble:
  text: |-
    Gelet op de artikelen 110d, 110e, 110f, eerste en derde lid, 110g en 110h van de Wet geluidhinder;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: besluit: [Besluit geluidhinder][ref1]; bijlage: bijlage bij deze regeling;
      Minister: 'Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer; wet: [Wet geluidhinder][ref2].'


      [ref1]: https://wetten.overheid.nl/BWBR0020445
      [ref2]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0020445
      - id: ref2
        bwb_id: BWBR0003227
  - number: '1.2'
    text: |-
      De resultaten van het akoestisch onderzoek, ter bepaling van het equivalent geluidsniveau, worden vastgelegd in een
      overeenkomstig [hoofdstuk 1 van bijlage I][ref1] ingericht akoestisch rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0020773
  - number: 1.3.1
    text: |-
      De waarde van het door berekening of door meting verkregen equivalente geluidsniveau wordt afgerond naar het
      dichtstbijzijnde gehele getal, waarbij een halve eenheid wordt afgerond naar het even getal.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel1.3
  - number: 1.3.2
    text: |-
      Bij de vaststelling van het verschil tussen twee geluidsbelastingwaarden wordt, in afwijking van het eerste lid, de
      afronding slechts toegepast op het resultaat van de berekening van het verschil.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel1.3
  - number: '1.4'
    text: |-
      Het effect van de samenloop van de verschillende geluidsbronnen, bedoeld in [artikel 110f van de wet][ref1], wordt
      bepaald overeenkomstig de in [hoofdstuk 2 van bijlage I][ref2] beschreven rekenmethode.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110f
      [ref2]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110f
      - id: ref2
        bwb_id: BWBR0020773
  - number: 1.5.1
    text: |-
      Bij de bepaling van het equivalente geluidsniveau vanwege een industrieterrein, een weg of een spoorweg, wordt
      rekening gehouden met:
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel1.5
  - number: 1.5.1.a
    text: de verzwakking van het geluid ten gevolge van de geometrische uitbreiding van het geluidsveld;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel1.5
  - number: 1.5.1.b
    text: de verzwakking van het geluid door absorptie van geluidsenergie in de atmosfeer;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel1.5
  - number: 1.5.1.c
    text: de invloed van de bodem op de geluidsoverdracht;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel1.5
  - number: 1.5.1.d
    text: de meteorologische invloeden op de geluidsoverdracht.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel1.5
  - number: 1.5.2
    text: |-
      Bij de bepaling van het equivalente geluidsniveau wordt, afhankelijk van de situatie, bovendien rekening gehouden
      met de effecten op de geluidsoverdracht, die het gevolg zijn van één of meer:
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel1.5
  - number: 1.5.2.a
    text: reflecties van het geluid;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel1.5
  - number: 1.5.2.b
    text: afschermingen van het geluid.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel1.5
  - number: 1.5.3
    text: |-
      Indien het equivalente geluidsniveau wordt bepaald ter plaatse van de gevel van een woning of ander geluidsgevoelig
      gebouw, wordt slechts rekening gehouden met het op de gevel invallende geluid.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel1.5
  - number: '1.6'
    text: |-
      Met meetmethoden als bedoeld in deze regeling worden gelijkgesteld meetmethoden die zijn vastgesteld in een andere
      lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is
      bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, en een nauwkeurigheid bieden die
      ten minste gelijkwaardig is aan het niveau dat met de in deze regeling genoemde meetmethoden wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel1.6
  - number: '2.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: geluidsbron: geluidafstralend toestel, apparaat, gebouw of activiteit,
      dan wel een combinatie hiervan, binnen een inrichting of industrieterrein; immissiepunt: plaats waarop het
      equivalent geluidsniveau wordt bepaald; immissierelevante bronsterkte: geluidsvermogensniveau van een denkbeeldige
      bron, gelegen in het centrum van de werkelijke geluidsbron, die in de richting van het immissiepunt dezelfde
      geluiddrukniveaus veroorzaakt als de werkelijke geluidsbron; representatieve bedrijfssituatie: toestand waarbij de
      voor de geluidproductie relevante omstandigheden kenmerkend zijn voor een bedrijfsvoering bij volledige capaciteit
      in het te beschouwen gedeelte van het etmaal.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.1
  - number: 2.2.1
    text: 'Bij de bepaling van het equivalente geluidsniveau van een industrieterrein wordt rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.2
  - number: 2.2.1.a
    text: |-
      de over de betreffende periode energetisch gemiddelde immissierelevante bronsterkte bij een representatieve
      bedrijfssituatie;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.2
  - number: 2.2.1.b
    text: de invloed van de vegetatie op de geluidsoverdracht.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.2
  - number: 2.2.2
    text: |-
      Indien de vaststelling van de geluidsbelasting vanwege een industrieterrein plaats vindt ten behoeve van de
      vaststelling of wijziging van een geluidszone rond dat terrein, bevindt het immissiepunt zich op een hoogte van
      vijf meter boven het maaiveld.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.2
  - number: 2.2.3
    text: |-
      Indien de vaststelling van de geluidsbelasting vanwege een industrieterrein plaats vindt ten behoeve van de
      vaststelling van de geluidsbelasting van de gevel van woningen, of andere geluidsgevoelige gebouwen, bevindt het
      immissiepunt zich op het punt van de gevel, waar de hoogste geluidsbelasting optreedt.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.2
  - number: 2.3.1
    text: |-
      Bepaling van het equivalente geluidsniveau vanwege een industrieterrein vindt plaats volgens een van de methoden
      van de Handleiding meten en rekenen industrielawaai 1999, onder de in genoemde handleiding bepaalde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.3
  - number: 2.3.2
    text: |-
      Op het overeenkomstig het eerste lid bepaalde equivalente geluidsniveau vanwege een industrieterrein kan het
      bevoegd gezag een aftrek toepassen als bedoeld in [bijlage II][ref1], onder de in [die bijlage][ref2] genoemde
      voorwaarden en voor zover het toepassen van de aftrek niet in strijd is met de gewenste optimale akoestische en
      ruimtelijke indeling op en rond het industrieterrein, zoals onder meer kan blijken uit een:


      [ref1]: https://wetten.overheid.nl/BWBR0020773
      [ref2]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0020773
      - id: ref2
        bwb_id: BWBR0020773
  - number: 2.3.2.a
    text: |-
      zonebeheerplan als bedoeld in [artikel 164 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel164
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '164'
  - number: 2.3.2.b
    text: |-
      gemeentelijke nota industrielawaai als bedoeld in de Handreiking industrielawaai en vergunningverlening, MBG
      98065226, 21 oktober 1998;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.3
  - number: 2.3.2.c
    text: |-
      gemeentelijk milieubeleidsplan als bedoeld in [artikel 4.16 van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
  - number: 2.3.2.d
    text: |-
      provinciaal milieubeleidsplan als bedoeld in [artikel 4.9 van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
  - number: 2.3.2.e
    text: ontwerpbestemmingsplan die reeds ter inzage is gelegd;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.3
  - number: 2.3.2.f
    text: ontwerp voor een projectbesluit dat reeds ter inzage is gelegd;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.3
  - number: 2.3.2.g
    text: |-
      ontwerpvergunning op grond van de [Wet milieubeheer][ref1] dat reeds ter inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 2.3.3
    text: |-
      Indien meer bestuursorganen bevoegd zijn tot het vaststellen van een hogere waarde met betrekking tot de
      geluidsbelasting vanwege een industrieterrein op grond van [artikel 110a van de wet][ref1] of tot het verlenen van
      een vergunning op grond van de [Wet milieubeheer][ref2] voor op dat industrieterrein gelegen inrichtingen, kan de
      aftrek, bedoeld in het tweede lid, slechts worden toegepast na overleg met die bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110a
      - id: ref2
        bwb_id: BWBR0003245
  - number: 2.3.4
    text: |-
      Tegelijkertijd met, of zo spoedig mogelijk na de bekendmaking wordt van een besluit waarin bij de bepaling van het
      equivalente geluidsniveau vanwege een industrieterrein of een gedeelte daarvan, een aftrek bedoeld in het tweede
      lid is toegepast, mededeling gedaan aan de bestuursorganen, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.3
  - number: '2.4'
    text: |-
      Van de in [artikel 2.3, eerste lid][ref1], bedoelde methode kan, geheel of gedeeltelijk worden afgeweken indien
      aannemelijk wordt gemaakt dat die werkwijze:


      [ref1]: https://wetten.overheid.nl/BWBR0020773#Artikel2
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0020773
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.a
    text: |-
      een belangrijke tijdsbesparing of kostenbesparing oplevert en in de betreffende situatie nagenoeg even nauwkeurig
      is als een van de methoden van de in [artikel 2.3, eerste lid][ref1], bedoelde handleiding;


      [ref1]: https://wetten.overheid.nl/BWBR0020773#Artikel2
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0020773
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.b
    text: |-
      in de betreffende situatie belangrijk nauwkeuriger is dan een van de methoden van de in
      [artikel 2.3, eerste lid][ref1], bedoelde handleiding, of


      [ref1]: https://wetten.overheid.nl/BWBR0020773#Artikel2
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0020773
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.c
    text: |-
      voldoende nauwkeurig is en geen van de methoden van de in [artikel 2.3, eerste lid][ref1], bedoelde handleiding in
      de betreffende situatie leidt tot een voldoende representatief equivalent geluidsniveau.


      [ref1]: https://wetten.overheid.nl/BWBR0020773#Artikel2
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0020773
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.1.1
    text: |-
      In dit hoofdstuk wordt verstaan onder: dicht asfaltbeton: typeaanduiding dicht asfaltbeton zoals gespecificeerd
      in de Standaard RAW-bepalingen 2005, ISBN 90 6628 443 9; etmaalperiode: gedeelte van een etmaal, waarover het
      equivalente geluidsniveau wordt bepaald; maatgevende verkeersintensiteit: verkeersintensiteit, zoals die, in het
      voor de geluidsbelasting bepalende jaar, gemiddeld over een representatief tijdvak, optreedt; verkeersintensiteit:
      aantal motorvoertuigen van een categorie motorvoertuigen als bedoeld in het tweede lid, dat jaarlijks per uur,
      gemiddeld over een etmaalperiode, een waarneempunt passeert; verkeerssnelheid: voor het betreffende wegvak
      representatief te achten gemiddelde snelheid per categorie motorvoertuigen als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.1
  - number: 3.1.2
    text: |-
      Voor de toepassing van dit hoofdstuk worden de volgende categorieën motorvoertuigen onderscheiden: categorie
      lv (lichte motorvoertuigen): motorvoertuigen op drie of meer wielen, met uitzondering van de in categorie mv en
      categorie zv bedoelde motorvoertuigen; categorie mv (middelzware motorvoertuigen): gelede en ongelede autobussen,
      alsmede andere motorvoertuigen die ongeleed zijn en voorzien van een enkele achteras waarop vier banden zijn
      gemonteerd; categorie zv (zware motorvoertuigen): gelede motorvoertuigen, alsmede motorvoertuigen die zijn voorzien
      van een dubbele achteras, met uitzondering van autobussen.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.1
  - number: 3.1.3
    text: |-
      Als gebruik wordt gemaakt van automatische telapparatuur met een van het tweede lid afwijkende categorie-indeling,
      zijn deze tellingen toepasbaar als van deze automatische telapparatuur is aangetoond dat het berekende, op tienden
      van decibellen afgeronde equivalente geluidsniveau niet meer dan 0,5 dB afwijkt bij voor de betreffende wegtype
      representatieve verkeerssamenstelling.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.1
  - number: 3.2.1
    text: 'Bij de bepaling van het equivalente geluidsniveau vanwege een weg, wordt rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.2
  - number: 3.2.1.a
    text: de maatgevende verkeersintensiteiten van de onderscheiden categorieën motorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.2
  - number: 3.2.1.b
    text: de verkeerssnelheden van de onderscheiden categorieën motorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.2
  - number: 3.2.1.c
    text: de geluidemissies van de onderscheiden categorieën motorvoertuigen, bepaald op een wegdek van dicht asfaltbeton;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.2
  - number: 3.2.1.d
    text: de invloed van het wegdektype op de geluidemissie.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.2
  - number: 3.2.2
    text: |-
      Bij de bepaling van het equivalente geluidsniveau wordt, afhankelijk van de situatie, bovendien rekening gehouden
      met de effecten op de geluidemissie en geluidsoverdracht, die het gevolg zijn van één of meer:
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.2
  - number: 3.2.2.a
    text: hellingen in het beschouwde weggedeelte;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.2
  - number: 3.2.2.b
    text: met verkeerslichten geregelde kruispunten van wegen;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.2
  - number: 3.2.2.c
    text: snelheidsbeperkende maatregelen.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.2
  - number: 3.3.1
    text: |-
      Het equivalente geluidsniveau wordt bepaald volgens de in [hoofdstuk 2 van bijlage III][ref1] beschreven
      Standaardrekenmethode II.


      [ref1]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0020773
  - number: 3.3.2
    text: |-
      In afwijking van het eerste lid kan het equivalente geluidsniveau worden bepaald volgens de in
      [hoofdstuk 1 van bijlage III][ref1] beschreven Standaardrekenmethode I, indien de desbetreffende situatie valt
      binnen het toepassingsgebied van die Standaardrekenmethode I.


      [ref1]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0020773
  - number: 3.3.3
    text: |-
      In afwijking van het eerste en tweede lid kan het equivalente geluidsniveau tevens worden bepaald volgens de
      Standaardmeetmethode, bedoeld in [hoofdstuk 3 van bijlage III][ref1], indien de desbetreffende situatie valt binnen
      het toepassingsgebied van die Standaardmeetmethode.


      [ref1]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0020773
  - number: '3.4'
    text: |-
      Bij een van dicht asfaltbeton afwijkend wegdektype, wordt het effect van het afwijkende wegdektype op de
      geluidemissie bepaald overeenkomstig de in [hoofdstuk 4 van bijlage III][ref1] beschreven methode.


      [ref1]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0020773
  - number: '3.5'
    text: |-
      Het effect op het equivalente geluidsniveau van de in [hoofdstuk 2 van bijlage III][ref1] beschreven schermtop op
      de geluidemissie bepaald overeenkomstig de in [hoofdstuk 5 van bijlage III][ref2] beschreven methode.


      [ref1]: https://wetten.overheid.nl/BWBR0020773
      [ref2]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0020773
      - id: ref2
        bwb_id: BWBR0020773
  - number: '3.6'
    text: |-
      De ingevolge [artikel 110g van de wet][ref1] toe te passen aftrek op de volgens de
      [artikelen 1.3, eerste lid][ref2], en [3.7, onderdeel b en c][ref3], bepaalde waarde van het equivalente
      geluidsniveau, vanwege een weg, van de gevel van woningen of van andere geluidsgevoelige gebouwen of aan de grens
      van geluidsgevoelige terreinen bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110g
      [ref2]: https://wetten.overheid.nl/BWBR0020773#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020773#Artikel3
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110g
      - id: ref2
        bwb_id: BWBR0020773
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0020773
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.6.a
    text: |-
      2 dB voor wegen waarvoor de representatief te achten snelheid van lichte motorvoertuigen 70 km/uur of meer
      bedraagt;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.6
  - number: 3.6.b
    text: 5 dB voor de overige wegen;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.6
  - number: 3.6.c
    text: |-
      0 dB bij toepassing van [artikel 3.2 van het Bouwbesluit 2003][ref1] en bij toepassing van de
      [artikelen 111, tweede en derde lid][ref2], [111a][ref3], [112][ref4] en [113 van de wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel111
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel111a
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel112
      [ref5]: https://wetten.overheid.nl/BWBR0003227#Artikel113
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0012727
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '111'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: 111a
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '112'
      - id: ref5
        bwb_id: BWBR0003227
        artikel: '113'
  - number: '3.7'
    text: |-
      Voor de berekening van het akoestisch effect van een wijziging op of aan een weg, worden, in afwijking van
      [artikel 1.3][ref1], de volgende uitgangspunten gehanteerd:


      [ref1]: https://wetten.overheid.nl/BWBR0020773#Artikel1
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0020773
        artikel: '1'
        hoofdstuk: '1'
  - number: 3.7.a
    text: |-
      indien een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting is vastgesteld, wordt gerekend met het
      getal van de hogere waarde, zoals deze is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.7
  - number: 3.7.b
    text: |-
      voor de heersende waarde van de geluidsbelasting wordt gerekend met het onafgeronde getal, waarbij uitvoering is
      gegeven aan [artikel 3.6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020773#Artikel3
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0020773
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.7.c
    text: |-
      voor de geluidsbelasting in het toekomstige maatgevende jaar wordt gerekend met het onafgeronde getal, waarbij
      uitvoering is gegeven aan [artikel 3.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020773#Artikel3
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0020773
        artikel: '3'
        hoofdstuk: '3'
  - number: '3.8'
    text: |-
      Indien een ten hoogste toelaatbare geluidsbelasting vanwege een weg in dB(A) is vastgesteld, wordt die waarde
      omgerekend tot de waarde van de geluidsbelasting in dB door de getalswaarde van de vastgestelde waarde te
      verminderen met het verschil tussen de heersende geluidsbelasting in dB(A) en de heersende geluidsbelasting in dB.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel3.8
  - number: 4.1.1
    text: |-
      In dit hoofdstuk wordt verstaan onder: eenheid: afhankelijk van de spoorvoertuigcategorie een locomotief, een
      treinstel, een rijtuig of een wagen; emissiegetal: getal dat de sterkte aangeeft van het geëmitteerde geluid
      ten gevolge van het gezamenlijk spoorvoertuigverkeer op een bepaald spoorweggedeelte, zonodig gespecificeerd per
      oktaafband en per onderscheiden bronhoogte; emissietraject: gedeelte van een spoorweg waarop de geluidemissie
      constant kan worden verondersteld; etmaalperiode: gedeelte van een etmaal, waarover het equivalente geluidsniveau
      wordt bepaald; snelheid: de voor het betreffende emissietraject, per etmaalperiode, representatief te achten
      snelheid per categorie spoorvoertuigen, als bedoeld in het tweede lid; verkeersintensiteit: het aantal eenheden van
      een categorie spoorvoertuigen, als bedoeld in het tweede lid, dat per uur, gemiddeld over een etmaalperiode, op een
      bepaald emissietraject passeert.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.1
  - number: 4.1.2
    text: |-
      Elk spoorvoertuig dat op een bepaald traject van de spoorweg gebruik maakt, wordt voor de toepassing van deze
      regeling toegedeeld aan de desbetreffende spoorvoertuigcategorie, genoemd in [hoofdstuk 1 van bijlage IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0020773
  - number: '4.2'
    text: 'Bij de bepaling van het emissiegetal van een bepaald emissietraject wordt rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.2
  - number: 4.2.a
    text: de verkeersintensiteiten van de onderscheiden categorieën spoorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.2
  - number: 4.2.b
    text: de snelheid van de onderscheiden categorieën spoorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.2
  - number: 4.2.c
    text: de specifieke geluidemissies van de onderscheiden categorieën spoorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.2
  - number: 4.2.d
    text: de bronhoogten die representatief te achten zijn voor de betrokken categorieën spoorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.2
  - number: 4.2.e
    text: de mogelijke extra geluidemissie die optreedt bij het remmen van de betrokken categorieën spoorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.2
  - number: 4.2.f
    text: de voor het betreffende emissietraject karakteristieke baangesteldheid;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.2
  - number: 4.2.g
    text: de wijze van spoorstaafoplegging.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.2
  - number: 4.3.1
    text: |-
      De Minister draagt zorg voor de samenstelling en het beheer van een emissieregister, waarin de gegevens, bedoeld in
      [hoofdstuk 7 van bijlage IV][ref1], worden vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0020773
  - number: 4.3.2
    text: Het emissieregister is openbaar.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.3
  - number: 4.4.1
    text: |-
      Bij de bepaling van het equivalente geluidsniveau, vanwege een spoorweg, wordt rekening gehouden met de
      emissiegegevens zoals vastgelegd in het emissieregister, bedoeld in [artikel 4.3][ref1], of, indien het een
      berekening betreft voor het toekomstig maatgevende jaar, met de emissiegetallen van de relevante emissietrajecten
      bepaald overeenkomstig [artikel 4.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020773#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020773#Artikel4
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0020773
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0020773
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.2
    text: |-
      De Minister kan, na overleg met de instanties die op de desbetreffende locatie de spoorweginfrastructuur en het
      gebruik daarvan beheren, afwijking toestaan van het eerste lid, indien de daar bedoelde gegevens onvoldoende
      representatief zijn.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.4
  - number: '4.5'
    text: |-
      Het emissiegetal van een bepaald emissietraject en het equivalente geluidsniveau, vanwege een spoorweg, worden
      bepaald door middel van berekening dan wel meting.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.5
  - number: 4.6.1
    text: |-
      De berekening van het emissiegetal van een bepaald emissietraject wordt uitgevoerd volgens de in
      [hoofdstuk 2 en 3 van bijlage IV][ref1] beschreven methode.


      [ref1]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0020773
  - number: 4.6.2
    text: |-
      In gevallen waarin de in het eerste lid genoemde methode leidt tot een voor de betreffende situatie onvoldoende
      representatief emissiegetal, wordt het emissiegetal bepaald volgens de in [hoofdstuk 6 van bijlage IV][ref1]
      beschreven methode.


      [ref1]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0020773
  - number: 4.7.1
    text: |-
      Het equivalente geluidsniveau wordt berekend volgens de Standaardrekenmethode II, bedoeld in
      [hoofdstuk 5 van bijlage IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0020773
  - number: 4.7.2
    text: |-
      In afwijking van het eerste lid kan het equivalente geluidsniveau worden bepaald volgens de in
      [hoofdstuk 4 van bijlage IV][ref1] beschreven Standaardrekenmethode I, indien de desbetreffende situatie valt
      binnen het toepassingsgebied van die Standaardrekenmethode I.


      [ref1]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0020773
  - number: 4.7.3
    text: |-
      In afwijking van het eerste en tweede lid kan het equivalente geluidsniveau tevens worden bepaald volgens de
      Standaardmeetmethode, bedoeld in [hoofdstuk 6 van bijlage IV][ref1], indien de desbetreffende situatie valt binnen
      het toepassingsgebied van die Standaardmeetmethode.


      [ref1]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0020773
  - number: 4.7a.1
    text: |-
      De in [artikel 1b, vierde lid, onder a, van de wet][ref1] bedoelde gemiddelde emissie wordt berekend volgens
      waarin Ej de overeenkomstig formule 2.1 van [bijlage IV][ref2] berekende emissie is in jaar j voorafgaand aan de
      wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.7a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 1b
      - id: ref2
        bwb_id: BWBR0020773
  - number: 4.7a.2
    text: |-
      In afwijking van [artikel 1.3, tweede lid][ref1], wordt het in [artikel 1b, vierde lid, onder a, van de wet][ref2]
      bedoelde verschil afgerond op één cijfer achter de komma.


      [ref1]: https://wetten.overheid.nl/BWBR0020773#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel1b
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.7a
    references:
      - id: ref1
        bwb_id: BWBR0020773
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 1b
  - number: '4.8'
    text: |-
      Indien een ten hoogste toelaatbare geluidsbelasting vanwege een spoorweg in dB(A) is vastgesteld, wordt die waarde
      omgerekend tot de waarde voor de geluidsbelasting in dB door de getalswaarde te verminderen met 2.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel4.8
  - number: '5.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder gevel: de uitwendige scheidingsconstructie zoals gedefinieerd in het
      [Bouwbesluit 2003][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012727
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0012727
  - number: 5.2.1
    text: |-
      Het equivalent geluidsniveau binnen een gebouw ten behoeve van de vaststelling van de geluidsbelasting
      ter plaatse wordt bepaald door het equivalente geluidsniveau buiten het gebouw, bepaald overeenkomstig de
      [hoofdstukken 2][ref1], [3][ref2] of [4][ref3], te verminderen met de geluidwering van de gevel.


      [ref1]: https://wetten.overheid.nl/BWBR0020773#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0020773#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0020773#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0020773
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020773
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0020773
        hoofdstuk: '4'
  - number: 5.2.2
    text: De geluidwering van een gevel kan worden bepaald door middel van meting of berekening.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel5.2
  - number: '5.3'
    text: 'Bij de bepaling van de geluidwering van de gevel wordt rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel5.3
  - number: 5.3.a
    text: het geluidsspectrum, behorend bij het equivalente geluidsniveau buiten het gebouw;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel5.3
  - number: 5.3.b
    text: de structuur van de gevel en de oriëntatie van de geveldelen ten opzichte van de geluidsbron;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel5.3
  - number: 5.3.c
    text: de geluidwerende kwaliteit en de afmetingen van de elementen waaruit de gevel is opgebouwd;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel5.3
  - number: 5.3.d
    text: het volume van het betreffend vertrek bij berekening, of de nagalmtijd van het betreffend vertrek bij meting;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel5.3
  - number: 5.3.e
    text: de geluidwerende kwaliteit van voorzieningen in de gevel voor ventilatie in geopende stand;
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel5.3
  - number: 5.3.f
    text: geluidlekken.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel5.3
  - number: 5.4.1
    text: |-
      Bij de bepaling van de geluidwering van de gevel wordt uitgegaan van het A-gewogen referentiespectrum behorend bij
      het equivalent geluidsniveau buiten de woning of het andere geluidsgevoelige gebouw.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel5.4
  - number: 5.4.2
    text: |-
      Tenzij anders vermeld en gemotiveerd wordt daarbij voor wegverkeer en spoorwegverkeer uitgegaan van de
      referentiespectra voor deze twee verkeerssoorten bepaald overeenkomstig NEN 5077.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel5.4
  - number: 5.4.3
    text: |-
      In afwijking van het tweede lid wordt het referentiespectrum voor wegverkeer toegepast, indien in het maatgevende
      jaar op een spoorweg meer dan 30% spoorwegvoertuigen passeren behorende tot de categorieën 4 of 5, bedoeld in
      [artikel 4.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020773#Artikel4
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0020773
        artikel: '4'
        hoofdstuk: '4'
  - number: 5.5.1
    text: |-
      De meting van de geluidwering van een gevel wordt uitgevoerd volgens de in NEN 5077, hoofdstuk 4 beschreven
      meetmethode.
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel5.5
  - number: 5.5.2
    text: |-
      De berekening van de geluidwering van een gevel wordt uitgevoerd volgens de in NEN-EN 12354-3 beschreven
      rekenmethode, toegepast op de wijze zoals beschreven in [bijlage V][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020773
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0020773
  - number: 6.1.1
    text: |-
      De geluidsbelasting, bedoeld in [artikel 88, eerste lid, van de wet][ref1], en [artikel 3.6 van het besluit][ref2],
      wordt bepaald volgens het Reken- en meetvoorschrift verkeerslawaai, zoals dat luidde tot het tijdstip van
      inwerkingtreding van het [Reken- en meetvoorschrift wegverkeerslawaai 2002][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0020445#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013548
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '88'
      - id: ref2
        bwb_id: BWBR0020445
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013548
  - number: 6.1.2
    text: |-
      Bij toepassing van het eerste lid bedraagt de toe te passen aftrek ingevolge [artikel 110g van de wet][ref1] 5 dB.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110g
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110g
  - number: 6.1.3
    text: |-
      Op de bepaling van de geluidsbelasting, bedoeld in [artikel 4.17 van het besluit][ref1] is, het
      [Reken- en Meetvoorschrift Railverkeerslawaai][ref2] van toepassing zoals dat luidde voor het tijdstip van
      inwerkingtreding van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020445#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004171
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0020445
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004171
  - number: '6.2'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de
      [wet van 5 juli 2006 houdende wijziging van de Wet geluidhinder][ref1] (modernisering instrumentarium geluidbeleid,
      eerste fase; Stb. 350) in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0020051
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0020051
  - number: '6.3'
    text: 'Deze regeling wordt aangehaald als: Reken- en meetvoorschrift geluidhinder 2006.'
    url: https://wetten.overheid.nl/BWBR0020773/2009-08-26#Artikel6.3
