$id: wet_op_de_identificatieplicht
regulatory_layer: WET
publication_date: '1994-03-24'
valid_from: '2001-04-01'
bwb_id: BWBR0006297
url: https://wetten.overheid.nl/BWBR0006297/2001-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter verbetering van de handhaving van regelingen voor de uitvoering
    waarvan bekendheid met de identiteit van een persoon van belang is, wenselijk is te bepalen met welke documenten
    de identiteit van personen in bij de wet aangewezen gevallen kan worden vastgesteld alsmede enige van deze gevallen
    aan te wijzen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006297/2001-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Als documenten waarmee in bij de wet aangewezen gevallen de identiteit van personen kan worden vastgesteld, worden
      aangewezen:
    url: https://wetten.overheid.nl/BWBR0006297/2001-04-01#Artikel1
  - number: 1.1.1°
    text: |-
      een geldig reisdocument als bedoeld in
      [artikel 2, eerste lid, onder a, b, c, d, e en g, of tweede lid, van de Paspoortwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0006297/2001-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '2'
  - number: 1.1.2°
    text: |-
      de documenten waarover een vreemdeling ingevolge de [Vreemdelingenwet 2000][ref1] moet beschikken ter vaststelling
      van zijn identiteit, nationaliteit en verblijfsrechtelijke positie.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0006297/2001-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: '1.2'
    text: |-
      Onze Minister van Justitie kan, al dan niet voor een bepaald tijdvak, andere dan de in het eerste lid bedoelde
      documenten aanwijzen ter vaststelling van de identiteit van personen.
    url: https://wetten.overheid.nl/BWBR0006297/2001-04-01#Artikel1
  - number: '23.1'
    text: |-
      Artikel 50*b*, derde lid, van de Organisatiewet Sociale Verzekering, zoals dat artikel bij deze wet is gewijzigd,
      is uitsluitend van toepassing ten aanzien van verzekerden die hun werkzaamheden zijn aangevangen of die loon zijn
      gaan genieten op of na het tijdstip van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0006297/2001-04-01#Artikel23
  - number: '23.2'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid stelt, na overleg met Onze Minister van Financiën en gehoord de
      Sociale Verzekeringsraad, een termijn, aanvangende op het tijdstip van inwerkingtreding van deze wet, waarbinnen
      de verzekerden die hun werkzaamheden zijn aangevangen of die loon zijn gaan genieten voor het tijdstip van
      inwerkingtreding van deze wet, een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1]
      ter inzage dienen te verstrekken aan de werkgever teneinde deze in staat te stellen de aard en het nummer van dit
      document in de administratie op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0006297/2001-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
        hoofdstuk: I
  - number: '23.3'
    text: |-
      De verplichting bedoeld in het tweede lid geldt als een verplichting van de verzekerde als bedoeld in artikel
      50*c*, tweede lid, van de Organisatiewet Sociale Verzekering, zoals dat artikel bij deze wet is gewijzigd.
    url: https://wetten.overheid.nl/BWBR0006297/2001-04-01#Artikel23
  - number: '24'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006297/2001-04-01#Artikel24
  - number: '25'
    text: Deze wet kan worden aangehaald als "Wet op de identificatieplicht".
    url: https://wetten.overheid.nl/BWBR0006297/2001-04-01#Artikel25
