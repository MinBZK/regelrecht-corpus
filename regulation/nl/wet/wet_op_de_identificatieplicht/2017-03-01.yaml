  - number: '2'
    text: |-
      Een ieder die de leeftijd van veertien jaar heeft bereikt, is verplicht op de eerste
      vordering van een ambtenaar als bedoeld in [artikel 8 van de Politiewet 2012][ref1] of
      [artikel 6a van de Wet op de bijzondere opsporingsdiensten][ref2], een identiteitsbewijs als bedoeld in
      [artikel 1][ref3] ter inzage aan te bieden. Deze verplichting geldt ook indien de vordering wordt gedaan door een
      toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0019919#Artikel6a
