preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter verbetering van de handhaving van regelingen voor de uitvoering
    waarvan bekendheid met de identiteit van een persoon van belang is, wenselijk is te bepalen met welke documenten
    de identiteit van personen in bij de wet aangewezen gevallen kan worden vastgesteld alsmede enige van deze gevallen
    aan te wijzen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006297/2017-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Als documenten waarmee in bij de wet aangewezen gevallen de identiteit van personen kan worden vastgesteld,
      worden aangewezen:

      1°. een geldig reisdocument als bedoeld in [artikel 2, eerste lid, onder a, b, c, d, e en g][ref1], of een
      Nederlandse identiteitskaart en vervangende Nederlandse identiteitskaart als bedoeld in artikel 2, tweede lid, van
      de Paspoortwet;

      2°. de documenten waarover een vreemdeling ingevolge de [Vreemdelingenwet 2000][ref2] moet beschikken ter
      vaststelling van zijn identiteit, nationaliteit en verblijfsrechtelijke positie;

      3°. een geldig nationaal, diplomatiek of dienstpaspoort dat is afgegeven door het daartoe bevoegde gezag in een
      andere lidstaat van de Europese Gemeenschappen of in een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte, voor zover de houder de nationaliteit van die andere lidstaat bezit;

      4°. een geldig rijbewijs dat is afgegeven op basis van de Wegenverkeerswet, een geldig rijbewijs als bedoeld in
      [artikel 107 van de Wegenverkeerswet 1994][ref3] of een rijbewijs dat is afgegeven door het daartoe bevoegde gezag
      in een andere lidstaat van de Europese Gemeenschappen of in een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte, waarvan de houder in Nederland woonachtig is, zolang de bij de
      [Wegenverkeerswet 1994](onbekend) vastgestelde termijn van geldigheid in Nederland niet is verstreken, aan de
      houder geen administratieve maatregel bedoeld in [paragraaf 9 van hoofdstuk VI van de Wegenverkeerswet 1994][ref4]
      is opgelegd of aan hem niet de bijkomende straf bedoeld in [artikel 179 van die wet][ref5] is opgelegd en mits het
      rijbewijs is voorzien van een pasfoto van de houder.

      2 Onze Minister van Veiligheid en Justitie kan, al dan niet voor een bepaald tijdvak, andere dan de in het eerste
      lid bedoelde documenten aanwijzen ter vaststelling van de identiteit van personen.


