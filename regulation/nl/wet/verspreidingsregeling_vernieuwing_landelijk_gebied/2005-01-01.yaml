articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            b
            project:

              samenhangend geheel van activiteiten, dat geheel of gedeeltelijk is gericht op een vernieuwingsproces in
      het landelijk gebied;



            c
            projectonderdeel:

              een gedeelte van een project, dat bestaat uit één of meer activiteiten, die zijn gericht op een
      vernieuwingsproces in het landelijk gebied;



            d
            Dienst Regelingen:

              Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0012624/2005-01-01#Artikel1
  - number: '2'
    text: |-
      De minister kan op aanvraag subsidie verlenen aan projecten of projectonderdelen die bijdragen aan de verspreiding
      van kennis over innovatiemogelijkheden, bijdragen aan de sociaal-economische versterking van het landelijk gebied,
      een vanuit regionaal perspectief vernieuwende activiteit inhouden en tevens passen in een of meer van de volgende
      categorieën:

      a. de sociale, culturele, ecologische of recreatieve versterking van het landelijk gebied;

      b. de versterking van de sociale samenhang en samenwerking in het landelijk gebied;

      c. het ontwikkelen van nieuwe organisatievormen in het beheer van water, bos, natuur en landschap, cultureel
      erfgoed of recreatievoorzieningen door natuurlijke personen en rechtspersonen, of;

      d. de ontwikkeling of verbetering van streekgebonden productie, be- of verwerking van of het handelen in
      streekgebonden producten afkomstig uit de landbouw, bosbouw of visserij.
    url: https://wetten.overheid.nl/BWBR0012624/2005-01-01#Artikel2
  - number: '3'
    text: |-
      1 De minister kan ieder begrotingsjaar één of meer aanvraagperioden instellen. De minister kan tevens één of meer
      aanvraagperioden instellen voor:

        - een bepaalde regio met een specifieke problematiek betreffende de in [artikel 2, onderdeel a tot en met d][ref1],
      genoemde categorieën, of
        - een nader te bepalen subcategorie van projecten of projectonderdelen, die aan de verspreiding van kennis over
      innovatiemogelijkheden, bedoeld in [artikel 2][ref2], bijdragen.

      2 De minister stelt per aanvraagperiode een subsidieplafond vast.

      3 De minister stelt gelijktijdig met de vaststelling van een subsidieplafond het in
      [artikel 6, tweede lid, onderdeel e][ref3], bedoelde percentage vast.

      4 De minister kan per aanvraagperiode afwegingscriteria vaststellen, die hij hanteert bij de beoordeling, bedoeld
      in [artikel 10, eerste lid][ref4].

      5 De minister maakt besluiten als bedoeld in het eerste tot en met het vierde lid bekend in de Staatscourant.


