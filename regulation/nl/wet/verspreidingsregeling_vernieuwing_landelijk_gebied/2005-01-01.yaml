  - number: '10'
    text: |-
      1 De minister beoordeelt:

      a. of en zo ja, in welke mate de projecten of projectonderdelen voldoen aan de criteria, gesteld in
      [artikel 2][ref1];

      b. in welke mate de projecten of projectonderdelen voldoen aan de door de minister vastgestelde afwegingscriteria,
      bedoeld in [artikel 3, vierde lid][ref2], en;

      c. in welke mate de aanvrager zelf bijdraagt aan de financiering van het project of projectonderdeel.

      2 De minister kan een aanvraag tot subsidieverlening voor een project of projectonderdeel dat naar zijn oordeel
      niet of niet geheel voldoet aan de criteria, bedoeld in [artikel 2][ref3], geheel of gedeeltelijk afwijzen.

      3 De minister stelt een rangschikking van de aanvragen op, waarbij aanvragen:

      a. hoger worden gerangschikt naarmate ze naar het oordeel van de minister meer voldoen aan de door de minister
      ingevolge [artikel 3, vierde lid][ref4], vastgestelde afwegingscriteria, en;

      b. vervolgens hoger worden gerangschikt naarmate ze naar het oordeel van de minister meer voldoen aan de criteria,
      gesteld in [artikel 2][ref5], en;

      c. vervolgens hoger worden gerangschikt naarmate de financiële bijdrage van de aanvrager aan het project of
      projectonderdeel, dat voor subsidie in aanmerking komt hoger is in vergelijking met de subsidiabele kosten.


