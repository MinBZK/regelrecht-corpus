  - number: '4'
    text: |-
      1 De minister kan voor projecten of projectonderdelen als bedoeld in [artikel 2][ref1] een subsidie verlenen aan
      natuurlijke personen, privaatrechtelijke rechtspersonen, die niet zijn opgericht door of vanwege de overheid, of
      een openbaar nutsbedrijf.

      2 Geen subsidie wordt verleend aan organisaties die overwegend zijn gericht op onderzoek, scholing, opleiding,
      voorlichting, advies of begeleiding.

      3 Geen subsidie wordt verleend voor projecten of projectonderdelen waarmee een begin van uitvoering is gemaakt
      alvorens de ontvangst van de aanvraag tot subsidieverlening schriftelijk aan de aanvrager is bevestigd.

      4 Geen subsidie wordt verleend, indien het bij de beschikking tot subsidieverlening vast te stellen subsidiebedrag
      niet ten minste € 9075,60 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0012624#Artikel2
