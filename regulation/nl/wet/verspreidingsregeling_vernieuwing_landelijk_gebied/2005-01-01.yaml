  - number: '9'
    text: |-
      De minister kan zich bij de beoordeling van de aanvragen laten bijstaan door hem aan te wijzen deskundigen uit of
      met betrekking tot de regio, bedoeld in [artikel 3, eerste lid][ref1], eerste aandachtsstreepje.


      [ref1]: https://wetten.overheid.nl/BWBR0012624#Artikel3
    url: https://wetten.overheid.nl/BWBR0012624/2005-01-01#Artikel9
