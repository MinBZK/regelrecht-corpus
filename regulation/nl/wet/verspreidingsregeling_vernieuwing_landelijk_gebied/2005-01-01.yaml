  - number: '15'
    text: |-
      1 De aanvraag tot subsidievaststelling wordt binnen vier maanden na afloop van het project of projectonderdeel
      waarvoor de subsidie is verstrekt maar uiterlijk 3 jaar en vier maanden na aanvang van de uitvoering ingediend bij
      Dienst Regelingen, op een door de minister vastgesteld formulier.

      2 De aanvraag tot subsidievaststelling gaat vergezeld van:

      a. een activiteitenverslag dat ten minste bestaat uit een beschrijving van:

        - de mate waarin het project of projectonderdeel heeft bijgedragen aan de in het projectplan omschreven
      doelstellingen;
        - de informatie over het project of projectonderdeel en een beschrijving van de kennis die met het project of
      projectonderdeel is opgedaan, en
        - de wijze waarop de informatie over het project of projectonderdeel en de opgedane kennis openbaar is gemaakt;

      b. een financieel verslag, bestaande uit een rekening en een verklaring van een accountant of een accountant-
      administratieconsulent als bedoeld in artikel 2:393, eerste lid, van het Burgerlijk Wetboek waaruit blijkt dat is
      voldaan aan de in deze regeling gestelde verplichtingen.

      3 De accountant of accountant-administratieconsulent, bedoeld in het tweede lid, onderdeel b, controleert met
      inachtneming van het in de bijlage bij deze regeling opgenomen controleprotocol.

      4 De minister kan de Accountantsdienst van het Ministerie van Landbouw, Natuurbeheer en Visserij een review laten
      uitvoeren op de door de accountant van de aanvrager verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0012624/2005-01-01#Artikel15
  - number: '16'
    text: |-
      1 De minister kan de subsidieontvanger op aanvraag ten hoogste eenmaal per zes maanden voorschotten verlenen.

      2 Het totaal van de verleende voorschotten bedraagt nooit meer dan 80% van het bedrag waarop de subsidie
      overeenkomstig de beschikking tot subsidieverlening ten hoogste kan worden vastgesteld.

      3 De aanvraag van de beschikking tot voorschotverlening gaat vergezeld van een overzicht van de
      liquiditeitsbehoefte.
    url: https://wetten.overheid.nl/BWBR0012624/2005-01-01#Artikel16
  - number: '17'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref1] of
      [artikel 6, tweede lid, van de Kaderwet LNV-subsidies][ref2], worden de terug te vorderen bedragen vermeerderd met
      de wettelijke rente over de periode vanaf het moment van uitbetaling tot aan het moment van algehele voldoening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel457
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel6
    url: https://wetten.overheid.nl/BWBR0012624/2005-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:57
      - id: ref2
        bwb_id: BWBR0009194
        artikel: '6'
  - number: '18'
    text: |-
      Uiterlijk vijf jaar na instelling van de eerste aanvraagperiode voor deze regeling wordt een verslag gepubliceerd
      over de doeltreffendheid en de effecten van de regeling in de praktijk.
    url: https://wetten.overheid.nl/BWBR0012624/2005-01-01#Artikel18
  - number: '19'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0012624/2005-01-01#Artikel19
  - number: '20'
    text: 'Deze regeling wordt aangehaald als: Verspreidingsregeling vernieuwing landelijk gebied.'
    url: https://wetten.overheid.nl/BWBR0012624/2005-01-01#Artikel20
