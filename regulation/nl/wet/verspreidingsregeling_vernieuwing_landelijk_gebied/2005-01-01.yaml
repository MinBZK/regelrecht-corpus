  - number: '7'
    text: |-
      1 De subsidie bedraagt 50% van de subsidiabele kosten of zoveel minder als door de aanvrager wordt aangegeven bij
      de aanvraag tot subsidieverlening.

      2 Indien voor de subsidiabele kosten, bedoeld in het eerste lid, of een gedeelte daarvan door de minister of een
      ander bestuursorgaan dan de minister subsidie is of zal worden verstrekt, wordt slechts een zodanig bedrag aan
      subsidie op grond van deze regeling verstrekt dat de som van de subsidies niet meer bedraagt dan het in het eerste
      lid genoemde percentage van de subsidiabele kosten.

      3 Indien voor de subsidiabele kosten, bedoeld in het eerste lid, of een gedeelte daarvan door de minister of
      een ander bestuursorgaan dan de minister, subsidie is of zal worden verstrekt, wordt op grond van deze regeling
      slechts een zodanig bedrag aan subsidie verstrekt dat de subsidie of de som van de subsidies niet meer bedraagt
      dan € 100000,- indien de subsidieontvanger is aan te merken als een onderneming, die niet voldoet aan het criterium
      kleine of middelgrote onderneming, als bedoeld in bijlage 1 van de [verordening (EG) nr. 70/2001](32001R0070) van
      de Commissie van de Europese Gemeenschappen van 12 januari 2001 betreffende de toepassing van de artikelen 87 en 88
      van het EG-verdrag op staatssteun voor kleine en middelgrote ondernemingen (PbEG L10).
    url: https://wetten.overheid.nl/BWBR0012624/2005-01-01#Artikel7
  - number: '8'
    text: |-
      1 De aanvraag tot subsidieverlening wordt ingediend bij Dienst Regelingen, op een door de minister vastgesteld
      formulier.

      2 Aanvragen, die worden ingediend:

      a. buiten de opengestelde aanvraagperioden,

      b. voor projecten of projectonderdelen die worden uitgevoerd in een andere regio, dan waarvoor de aanvraagperiode
      is opengesteld, of,

      c. voor een andere dan de op grond van [artikel 3, eerste lid][ref1], nader bepaalde subcategorie van projecten of
      projectonderdelen, dan waarvoor de aanvraagperiode is opengesteld,

      worden niet in behandeling genomen.

      3 De aanvraag tot subsidieverlening gaat vergezeld van:

      a. een projectplan, dat bestaat uit een beschrijving van de doelstellingen en achtergronden van het project, het
      geheel van activiteiten, waarvoor geheel of gedeeltelijk subsidie wordt aangevraagd, een tijdsplanning van de
      activiteiten en de wijze van uitvoering;

      b. een begroting van de kosten en een opgave van de financieringswijze van het project, en;

      c. in voorkomend geval, indien het project in een samenwerkingsverband wordt uitgevoerd, het samenwerkingscontract,
      met daarin tenminste een overzicht van de aan het samenwerkingsverband deelnemende natuurlijke en rechtspersonen
      alsmede van de verdeling van de bevoegdheden, verantwoordelijkheden en financiële verplichtingen tussen de
      verschillende deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0012624#Artikel3
    url: https://wetten.overheid.nl/BWBR0012624/2005-01-01#Artikel8
