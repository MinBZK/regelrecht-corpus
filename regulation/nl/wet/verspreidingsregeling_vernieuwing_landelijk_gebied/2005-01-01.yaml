  - number: '11'
    text: |-
      1 De minister beslist, gelijktijdig op de aanvragen, die in dezelfde aanvraagperiode zijn ingediend.

      2 De minister geeft de beschikking tot subsidieverlening binnen vijf maanden na afloop van de aanvraagperiode
      waarin de aanvraag van een beschikking tot subsidieverlening is ingediend. Indien deze termijn niet kan worden
      gehaald, stelt de minister de aanvrager daarvan in kennis en noemt hij daarbij een redelijke termijn waarop de
      beschikking tegemoet kan worden gezien.

      3 De minister verstrekt subsidie tot een bedrag van ten hoogste € 453780,22 per project of projectonderdeel.

      4 Indien meerdere projectonderdelen voor subsidiëring in aanmerking komen, verstrekt de minister in totaal een
      subsidie tot een bedrag van ten hoogste € 453780,22 voor het gehele project.
    url: https://wetten.overheid.nl/BWBR0012624/2005-01-01#Artikel11
  - number: '12'
    text: |-
      De subsidieverlening kan worden geweigerd indien een gegronde reden bestaat om aan te nemen dat de financiering van
      het project niet toereikend zal zijn.
    url: https://wetten.overheid.nl/BWBR0012624/2005-01-01#Artikel12
  - number: '13'
    text: |-
      1 Subsidies of voorschotten daarop worden verleend onder voorbehoud van goedkeuring van de Commissie van de
      Europese Gemeenschappen.

      2 De beslissing tot verlening van een subsidie of een voorschot daarop kan worden ingetrokken of gewijzigd
      indien dit noodzakelijk is in verband met het verkrijgen van de goedkeuring van de Commissie van de Europese
      Gemeenschappen voor deze regeling of wegens het uitblijven daarvan.
    url: https://wetten.overheid.nl/BWBR0012624/2005-01-01#Artikel13
  - number: '14'
    text: |-
      1 De subsidieontvanger voert het project of projectonderdeel overeenkomstig het projectplan uit en maakt
      uiterlijk een jaar na bekendmaking van de beschikking tot subsidieverlening een aanvang met de uitvoering. De
      subsidieontvanger doet binnen 14 dagen na aanvang van het project of projectonderdeel mededeling van het moment van
      aanvang bij Dienst Regelingen.

      2 Wijzigingen in het projectplan zijn toegestaan mits:

      a. deze geen wijzigingen betreffen van de doelstelling van het project en

      b. deze vooraf zijn gemeld aan Dienst Regelingen en zijn goedgekeurd door de minister.

      De minister deelt de subsidieontvanger mede of de wijziging van het projectplan gevolgen heeft voor de verleende
      subsidie of voor de bij de verlening van de subsidie vastgestelde verplichtingen.

      3 Een wijziging als bedoeld in het tweede lid heeft niet tot gevolg dat de subsidie wordt vastgesteld op een hoger
      bedrag dan het bedrag waarop de subsidie overeenkomstig de beschikking tot subsidieverlening ten hoogste kan worden
      vastgesteld.

      4 Indien het project of projectonderdeel langer duurt dan één jaar, rapporteert de subsidieontvanger jaarlijks in
      de vorm van een verslag over de voortgang van de activiteiten op een door de minister te bepalen wijze. Dit verslag
      bestaat ten minste uit een beschrijving van:

      a. de activiteiten die tot dan toe in het kader van het project zijn verricht, en;

      b. de mate waarin deze activiteiten hebben bijgedragen aan de in het projectplan omschreven doelstellingen.

      5 De subsidieontvanger is verplicht de kennis die met het project of projectonderdeel wordt opgedaan, onmiddellijk
      na afloop van het project of projectonderdeel aan een ieder beschikbaar te stellen en daarover in het openbaar
      informatie te verstrekken.

      6 De subsidieontvanger is verplicht een administratie te voeren die zodanig is ingericht dat daaruit te allen
      tijde op eenvoudige en duidelijke wijze alle projectkosten kunnen worden afgelezen, gespecificeerd overeenkomstig
      de in [artikel 6][ref1] onderscheiden subsidiabele kosten, waarbij op basis van een sluitende tijdschrijving en
      in aansluiting op de gemaakte loonkosten, kosten voor uitzendkrachten en kosten voor eigen arbeid een vastgestelde
      urenverantwoording aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0012624#Artikel6
