  - number: '5'
    text: |-
      Als subsidiabele kosten worden uitsluitend in aanmerking genomen kosten die tot maximaal drie jaren na aanvang van
      het project worden gemaakt voor een project of projectonderdeel.
    url: https://wetten.overheid.nl/BWBR0012624/2005-01-01#Artikel5
  - number: '6'
    text: |-
      1 Als subsidiabele kosten worden in aanmerking genomen de volgende, door de aanvrager aan te tonen kosten,
      voorzover zij noodzakelijk zijn voor en rechtstreeks zijn toe te rekenen aan het project of projectonderdeel,
      waarop de beschikking tot subsidieverlening, bedoeld in [artikel 11][ref1], betrekking heeft:

      a. 1º. loonkosten, die worden gemaakt en betaald voor het direct bij de uitvoering van de projecten of
      projectonderdelen betrokken personeel, berekend op basis van het brutojaarloon volgens de verzamelloonlijst van
      de betrokken medewerkers, exclusief volledige winstafhankelijke uitkeringen, verhoogd met de wettelijke of op
      grond van een collectieve arbeidsovereenkomst verschuldigde opslagen voor sociale lasten, met een maximum van 1600
      productieve uren per medewerker per jaar;

      2º. kosten, die worden gemaakt en betaald voor het inhuren van uitzendkrachten met een maximum van 1600 productieve
      uren per medewerker per jaar;

      3º. indien de aanvrager minder dan 10 werknemers heeft, de kosten die berekend op basis van de toepasselijke
      loonschaal worden gemaakt en betaald voor leidinggevend en toezichthoudend personeel met een maximum van 1600
      productieve uren per medewerker per jaar;

      4º. indien de aanvrager minder dan 10 werknemers heeft, de op basis van een in redelijkheid toepasselijke
      loonschaal berekende kosten voor de door de aanvrager zelf verrichte arbeid met een maximum van 1600 productieve
      uren per jaar;

      b. de gemaakte en betaalde kosten van aangeschafte machines en apparatuur, gebaseerd op de historische
      aanschafprijzen, of de aan de projecten of projectonderdelen toe te rekenen leasetermijnen, tot een maximum van 50%
      van de historische aanschafprijzen of van de in totaal verschuldigde leasetermijnen, exclusief financieringskosten
      en winstopslagen bij transacties met een groepsmaatschappij;

      c. de gemaakte en betaalde kosten van verbruikte materialen en hulpmiddelen, gebaseerd op historische
      aanschafprijzen, exclusief financieringskosten en winstopslagen bij transacties met een groepsmaatschappij;

      d. de aan derden verschuldigde gemaakte en betaalde kosten ter zake van studies en onderzoeksactiviteiten en ter
      zake van de verwerving van kennis en intellectuele eigendomsrechten alsmede ter zake van de bescherming van die
      rechten, exclusief financieringskosten en winstopslagen bij transacties met een groepsmaatschappij;

      e. de gemaakte en betaalde reis- en verblijfkosten en kosten van deelname aan symposia tot een maximum van 15% van
      de in onderdeel a bedoelde loonkosten;

      f. de gemaakte en betaalde kosten voor uitvoering van de activiteiten door derden.

      2 Als subsidiabele kosten worden in aanmerking genomen de volgende kosten, voorzover zij noodzakelijk zijn
      voor en rechtstreeks zijn toe te rekenen aan het project of het projectonderdeel waarop de beschikking tot
      subsidieverlening, bedoeld in [artikel 11][ref2], betrekking heeft:

      a. een forfaitaire opslag voor de algemene kosten van 20% van de in het eerste lid, onderdeel a, subonderdelen 1 en
      2, bedoelde loonkosten, indien de aanvrager 10 of meer werknemers in dienst of als uitzendkracht heeft;

      b. door de aanvrager aantoonbaar gemaakte en betaalde kosten verbonden aan het verwerven of huren van onroerende
      zaken, voorzover de kosten bestaan uit rentevergoedingen, overdrachtskosten, of huurtermijnen indien die kosten
      noodzakelijk zijn voor het aanbrengen van voorzieningen of voor inrichtingsactiviteiten, tot een maximum van 50%
      van de subsidie welke is verleend op grond van het eerste lid;

      c. door de aanvrager aantoonbaar gemaakte en aan derden verschuldigde en betaalde kosten voor planvorming indien
      deze onderdeel vormen van het project of projectonderdeel, tot een maximum van 25% van de subsidie, welke is
      verleend op grond van het eerste lid;

      d. door de aanvrager aantoonbaar gemaakte en betaalde kosten voor voorlichting over het project of onderdelen van
      het project tot een maximum van 15% van de subsidie, welke is verleend op grond van het eerste lid;

      e. door de aanvrager aantoonbaar gemaakte en aan derden verschuldigde en betaalde kosten voor het uitvoeren van
      haalbaarheidsonderzoeken met een door de minister nader vast te stellen percentage van de subsidie, welke is
      verleend op grond van het eerste lid, tot een maximum van € 45378,02.

      3 Indien het project of projectonderdeel geheel of gedeeltelijk niet tot uitvoering wordt gebracht, wordt een naar
      het oordeel van de minister redelijke bijdrage aan de kosten voor het uitvoeren van een haalbaarheidsonderzoek
      verstrekt.

      4 Als subsidiabele kosten worden, tot een maximum van € 11344,51 in aanmerking genomen de kosten, bedoeld in het
      tweede lid, onderdeel c, ter voorbereiding van een aanvraag als bedoeld in [artikel 8][ref3], indien:

      a. de aanvrager op het tijdstip van de aanvraag minder dan 25 werknemers in dienst heeft;

      b. de aanvraag tot subsidieverlening is gevolgd door een beschikking tot subsidieverlening als bedoeld in
      [artikel 11][ref4].

      5 Verschuldigde omzetbelasting wordt als subsidiabele kosten in aanmerking genomen, indien de aanvrager
      omzetbelasting niet kan verrekenen met door hem af te dragen omzetbelasting.

      6 Bij de beschikking tot subsidieverlening wordt een forfaitaire opslag voor onvoorziene kosten van 5% van de in
      het eerste, tweede en vierde lid, bedoelde kosten voor subsidie in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012624#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0012624#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0012624#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0012624#Artikel11
