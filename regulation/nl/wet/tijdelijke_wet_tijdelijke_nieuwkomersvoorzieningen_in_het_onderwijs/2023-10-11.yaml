regulatory_layer: WET
publication_date: '2023-10-10'
valid_from: '2023-10-11'
bwb_id: BWBR0048720
url: https://wetten.overheid.nl/BWBR0048720/2023-10-11
preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat de toestroom nieuwkomers scholen en gemeenten voor de grote uitdaging
    plaatst om alle leerplichtige nieuwkomers tijdig van onderwijs te voorzien en dat scholen en gemeenten daarin
    ondersteund moeten worden door tijdelijk en onder voorwaarden tijdelijke nieuwkomersvoorzieningen mogelijk te
    maken;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0048720/2023-10-11#ArtikelAanhef
articles:
  - number: III
    text: >-
      Onze Minister voor Primair en Voortgezet Onderwijs zendt binnen drie jaar na de inwerkingtreding van deze wet aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0048720/2023-10-11#ArtikelIII
  - number: IV
    text: >-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0048720/2023-10-11#ArtikelIV
  - number: V
    text: 'Deze wet wordt aangehaald als: Tijdelijke wet tijdelijke nieuwkomersvoorzieningen in het onderwijs.'
    url: https://wetten.overheid.nl/BWBR0048720/2023-10-11#ArtikelV
