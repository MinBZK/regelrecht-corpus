  - number: 20b.e
    text: |-
      de verklaring dat de elektriciteit uitsluitend wordt aangewend in een walstroominstallatie die geheel
      of nagenoeg geheel bestemd is voor schepen niet zijnde particuliere pleziervaartuigen als bedoeld in
      [artikel 70a, derde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel70a
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 70a
  - number: 20b.f
    text: |-
      de verklaring dat de walstroominstallatie beschikt over een zelfstandige aansluiting en dat
      deze walstroominstallatie geen deel uitmaakt van een meer omvattende onroerende zaak als bedoeld
      in [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref1],
      of dat de walstroominstallatie beschikt over een comptabele meetinrichting als bedoeld in
      [artikel a18a van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007178
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0007178
  - number: 20c
    text: |-
      De belastingvermindering, bedoeld in [artikel 63, eerste lid, van de wet][ref1], wordt toegepast
      door de leverancier die leveringen verricht via het primaire allocatiepunt, bedoeld in de
      [Begrippencode elektriciteit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0037938
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20c
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '63'
      - id: ref2
        bwb_id: BWBR0037938
  - number: '21.1'
    text: |-
      Voor de toepassing van [artikel 63, vierde lid, van de wet][ref1] wordt een gedeelte van een maand als een hele
      maand aangemerkt bij aanvang van de verbruiksperiode vóór de zestiende dag van de kalendermaand en bij einde van de
      verbruiksperiode na de vijftiende dag van de kalendermaand.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel63
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '63'
  - number: '21.2'
    text: |-
      Toepassing van het eerste lid kan achterwege blijven indien een gedeelte van een maand in aanmerking wordt genomen
      naar evenredigheid van het aantal dagen.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel21
  - number: '22'
    text: |-
