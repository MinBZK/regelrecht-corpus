  - number: '1.2'
    text: 'Voor de toepassing van deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel1
  - number: 1.2.a
    text: |-
      *de wet:* de [Wet belastingen op milieugrondslag][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007168
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007168
  - number: 1.2.b
    text: |-
      *het besluit:* het [Uitvoeringsbesluit belastingen op milieugrondslag][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007178
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007178
  - number: '4.1'
    text: |-
      Voor de toepassing van [artikel 14, eerste lid, tweede volzin, van de wet][ref1] wordt een gedeelte van een maand
      als een hele maand aangemerkt bij aanvang van de verbruiksperiode vóór de zestiende dag van de kalendermaand en bij
      einde van de verbruiksperiode na de vijftiende dag van de kalendermaand.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel14
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '14'
  - number: '4.2'
    text: |-
      Toepassing van het eerste lid kan achterwege blijven indien een gedeelte van een maand in aanmerking wordt genomen
      naar evenredigheid van het aantal dagen.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel4
  - number: '4.3'
    text: |-
      Voor de toepassing van [artikel 14, tweede lid, van de wet][ref1] wordt een aansluiting van een
      particuliere installatie voor centrale watervoorziening aangemerkt als meerdere aansluitingen,
      waarbij het aantal aansluitingen wordt bepaald op het aantal onroerende zaken als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref2] die via die installatie van
      water worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '16'
  - number: '4.4'
    text: |-
      De verklaring, bedoeld in [artikel 14, derde lid, van de wet][ref1], wordt ondertekend en bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel14
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '14'
  - number: 4.4.a
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel4
  - number: 4.4.b
    text: naam en adres van de exploitant;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel4
  - number: 4.4.c
    text: naam en adres van de leverancier, en
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel4
  - number: 4.4.d
    text: |-
      het aantal alsmede een omschrijving van de onroerende zaken met plaatselijke en kadastrale aanduiding, die
      gemiddeld op de installatie zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel4
  - number: '5'
    text: |-
      In het verzoek om teruggaaf, bedoeld in [artikel 20, eerste lid, van de wet][ref1], worden de volgende gegevens
      vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel20
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '20'
  - number: 5.a
    text: het tijdvak waarover teruggaaf wordt verzocht;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel5
  - number: 5.b
    text: naam en adres van de verbruiker;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel5
  - number: 5.c
    text: BSN of RSIN van de verbruiker;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel5
  - number: 5.d
    text: naam en adres van de leveranciers;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel5
  - number: 5.e
    text: de hoeveelheid leidingwater waarvoor teruggaaf wordt verzocht per leverancier;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel5
  - number: 5.f
    text: de periode van levering van het leidingwater, en
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel5
  - number: 5.g
    text: het bedrag aan belasting dat wordt teruggevraagd.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel5
  - number: '6'
    text: |-
      De administratie van de belastingplichtige, bedoeld in [artikel 21, eerste lid, van de wet][ref1], is zodanig
      ingericht dat daarin op overzichtelijke wijze de gegevens zijn opgenomen met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel21
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '21'
  - number: 6.a
    text: de hoeveelheid leidingwater die is geleverd;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel6
  - number: 6.b
    text: de opbouw van de voorschotbedragen;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel6
  - number: 6.c
    text: de herleiding van de voorschotbedragen naar de hoeveelheden leidingwater;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel6
  - number: 6.d
    text: de belasting begrepen in voorschotnota's en voorschotbedragen;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel6
  - number: 6.e
    text: de belasting begrepen in eindfacturen;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel6
  - number: 6.f
    text: de belasting begrepen in facturen;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel6
  - number: 6.g
    text: het aantal aansluitingen voor leidingwater;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel6
  - number: 6.h
    text: de periode van aansluiting;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel6
  - number: 6.i
    text: het aantal malen dat de bovengrens is toegepast;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel6
  - number: 6.j
    text: de evenredige toedeling van de bovengrens bij afwijkende verbruiksperioden;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel6
  - number: 6.k
    text: het eigen verbruik;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel6
  - number: 6.l
    text: de contracten ten aanzien van de onbemeterde aansluitingen;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel6
  - number: 6.m
    text: |-
      de toepassing van de regeling, bedoeld in [artikel 14, derde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel14
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '14'
  - number: 6.n
    text: |-
      de toepassing van de vrijstelling, bedoeld in [artikel 19 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel19
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '19'
  - number: '7.1'
    text: |-
      Het gewicht van de afvalstoffen die ter verwijdering worden afgegeven, bedoeld in
      [artikel 25, eerste lid, onderdeel a, van de wet][ref1], wordt onder verantwoordelijkheid van de houder van
      een inrichting onmiddellijk vóór dan wel aansluitend op de afgifte bepaald in kilogrammen door weging met een
      meetinstrument dat voldoet aan de eisen die bij of krachtens de [Metrologiewet][ref2] worden gesteld aan een
      meetinstrument.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0019517
  - number: '7.2'
    text: |-
      In afwijking van het eerste lid kan de inspecteur voor afvalstoffen die per schip aan de inrichting worden
      afgegeven ter verwijdering met de houder van de inrichting afwijkende afspraken maken over de wijze waarop het
      gewicht van die afvalstoffen wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel7
  - number: '7.3'
    text: |-
      In afwijking van het eerste lid wordt het gewicht van afvalstoffen die worden verwijderd binnen de inrichting
      waarin deze zijn ontstaan als bedoeld in [artikel 23, eerste lid, onderdeel b, van de wet][ref1], bepaald
      onmiddellijk vóór de verwijdering binnen de inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel23
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '23'
  - number: '8'
    text: |-
      De houder van de inrichting waaraan afvalstoffen ter verwijdering worden afgegeven die naar Nederland zijn
      overgebracht als bedoeld in [artikel 23, eerste lid, onderdeel a, van de wet][ref1], neemt in zijn administratie
      een afschrift op van de kennisgeving, bedoeld in artikel 4 van EVOA.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel23
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '23'
  - number: 8a
    text: |-
      Bij een aanvraag, als bedoeld in [artikel 25a, eerste lid, van de wet][ref1], geschiedt de vaststelling
      van de juistheid van de identiteit van de aanvrager door middel van eHerkenning op basis van minimaal
      betrouwbaarheidsniveau 2.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel25a
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: 25a
  - number: 8b.1
    text: |-
      De verklaring, bedoeld in [artikel 11c, tweede lid, van het besluit][ref1] wordt uiterlijk twee werkdagen
      voorafgaand aan de afgifte ter verwijdering aan de houder van de inrichting overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007178#Artikel11c
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0007178
        artikel: 11c
  - number: 8b.2
    text: |-
      De verklaring wordt ondertekend door een daartoe bevoegde procuratiehouder van het gecertificeerd
      asbestverwijderingsbedrijf, bedoeld in [artikel 11c, eerste lid, onderdeel a, van het besluit][ref1], en bevat
      ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0007178#Artikel11c
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0007178
        artikel: 11c
  - number: 8b.2.a
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel8b
  - number: 8b.2.b
    text: |-
      de naam, het adres en het certificeringsnummer van het gecertificeerd asbestverwerkingsbedrijf, bedoeld in
      [artikel 1, tweede lid, onderdeel g, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007178#Artikel1
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0007178
        artikel: '1'
  - number: 8b.2.c
    text: |-
      het nummer dan wel de nummers van de sloopmelding in het landelijk asbestvolgsysteem, bedoeld in
      [artikel 1, tweede lid, onderdeel h, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007178#Artikel1
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0007178
        artikel: '1'
  - number: 8b.2.d
    text: |-
      het adres van het gesaneerde dak dan wel de gesaneerde daken waarvan het onvermengd asbest en de asbesthoudende
      producten afkomstig zijn; en
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel8b
  - number: 8b.2.e
    text: |-
      de verklaring dat het asbest en de asbesthoudende producten die ter verwijdering aan de inrichting worden afgegeven
      voldoen aan de voorwaarden en beperkingen, genoemd in [artikel 11c, eerste lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007178#Artikel11c
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0007178
        artikel: 11c
  - number: 8b.3
    text: |-
      De houder van de inrichting vermeldt uiterlijk bij de afgifte ter
      verwijdering op de verklaring het afvalstroomnummer, bedoeld in
      [artikel 9, eerste lid, van het Besluit melden bedrijfsafvalstoffen en gevaarlijke afvalstoffen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017874#Artikel9
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0017874
        artikel: '9'
  - number: '9'
    text: |-
      Een plaats waar geen kolen worden vervaardigd, maar die dient voor de opslag van kolen, kan uitsluitend als
      inrichting worden aangemerkt, indien de hoeveelheid kolen die aldaar gemiddeld over een jaar voorhanden is, meer
      bedraagt dan 20.000 kilogram.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel9
  - number: '10'
    text: |-
      Het verzoek om een vergunning voor een inrichting, bedoeld in [artikel 39, eerste lid, van de wet][ref1], bevat de
      volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel39
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '39'
  - number: 10.a
    text: |-
      een omschrijving van de aard van het bedrijf waaruit onder meer moet blijken of de vergunning mede wordt gevraagd
      voor de vervaardiging van kolen of uitsluitend voor de opslag van kolen;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel10
  - number: 10.b
    text: |-
      een omschrijving van de administratie en de administratieve organisatie met betrekking tot de als inrichting aan te
      merken plaats, alsmede het adres waar de administratie wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel10
  - number: 10.c
    text: |-
      de hoeveelheid kolen die naar verwachting in de inrichting per jaar zal worden vervaardigd dan wel gemiddeld over
      een jaar voorhanden zal zijn;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel10
  - number: 10.d
    text: het adres en de kadastrale aanduiding van de als inrichting aan te wijzen plaats, en
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel10
  - number: 10.e
    text: de persoon op wiens naam de vergunning dient te worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel10
  - number: '11'
    text: |-
      De verklaring, bedoeld in [artikel 17, eerste lid, van het besluit][ref1], bevat de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0007178#Artikel17
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007178
        artikel: '17'
  - number: 11.a
    text: in het geval van uitslag, de naam, het adres en het vergunningnummer van de vergunninghouder van de inrichting;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel11
  - number: 11.b
    text: in het geval van invoer, de naam en het adres van degene die de kolen levert;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel11
  - number: 11.c
    text: de naam en het adres van de gebruiker;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel11
  - number: 11.d
    text: de hoeveelheid kolen waarvoor vrijstelling wordt verleend;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel11
  - number: 11.e
    text: de plaats van levering van de kolen;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel11
  - number: 11.f
    text: de datum van levering van de kolen, en
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel11
  - number: 11.g
    text: het kalenderjaar waarop de verklaring betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel11
  - number: '12.1'
    text: |-
      De administratie van degene die verzoekt om teruggaaf van belasting, bedoeld in
      [artikel 45, eerste en tweede lid, van de wet][ref1], is zodanig ingericht dat daarin op overzichtelijke wijze alle
      voor de vaststelling van het bedrag van de teruggaaf van belang zijnde gegevens zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel45
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '45'
  - number: '12.2'
    text: |-
      Het verzoek om teruggaaf, bedoeld in [artikel 45, eerste en tweede lid, van de wet][ref1], bevat de volgende
      gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel45
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '45'
  - number: 12.2.a
    text: de naam en het adres van degene die de kolen levert;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel12
  - number: 12.2.b
    text: de naam en het adres van de gebruiker;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel12
  - number: 12.2.c
    text: BSN of RSIN van de gebruiker;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel12
  - number: 12.2.d
    text: de hoeveelheid kolen waarvoor teruggaaf wordt verzocht;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel12
  - number: 12.2.e
    text: de plaats van levering van de kolen;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel12
  - number: 12.2.f
    text: het tijdvak waarover teruggaaf wordt verzocht, en
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel12
  - number: 12.2.g
    text: het bedrag aan kolenbelasting dat wordt teruggevraagd.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel12
  - number: '14.1'
    text: |-
      Voor de toepassing van [artikel 47, eerste lid, onderdeel k, van de wet][ref1] worden producten, afvalstoffen
      en residuen van de landbouw, met inbegrip van plantaardige en dierlijke stoffen, de bosbouw en aanverwante
      bedrijfstakken, alsmede industrieel en huishoudelijk afval met een aandeel onvermijdbare kunststoffen en ander
      materiaal van lang-cyclisch organische oorsprong van ten hoogste 3 massaprocent per partij, geacht geheel
      biologisch afbreekbaar te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '47'
  - number: '14.2'
    text: |-
      Voor de toepassing van het eerste lid wordt als partij aangemerkt de op basis van één specificatie geleverde
      hoeveelheid materiaal die voor controle op het aandeel onvermijdbare kunststoffen en ander materiaal van lang-
      cyclisch organische oorsprong door degene die het materiaal gebruikt voor de opwekking van elektriciteit gedurende
      een door hem vastgestelde periode als eenheid wordt aangemerkt en als zodanig identificeerbaar is.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel14
  - number: '15.1'
    text: |-
      Voor de toepassing van [artikel 47, eerste lid, onderdeel p, van de wet][ref1] wordt onder energiebelasting mede
      verstaan opslag duurzame energie, als bedoeld in [artikel 1, eerste lid, van de Wet opslag duurzame energie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0032660#Artikel1
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0032660
        artikel: '1'
  - number: '15.2'
    text: |-
      Berekeningen voor de toepassing van [artikel 47, eerste lid, onderdeel p, van de wet][ref1] worden gemaakt op basis
      van een kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel47
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '47'
  - number: '16.1'
    text: |-
      [Artikel 50, vierde lid, van de wet][ref1] is van toepassing indien degene aan wie het aardgas of de elektriciteit
      geleverd wordt, een verklaring heeft overgelegd aan de leverancier dat hij leveringen aan de verbruiker verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '50'
  - number: '16.2'
    text: 'De verklaring, bedoeld in het eerste lid, wordt ondertekend en bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel16
  - number: 16.2.a
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel16
  - number: 16.2.b
    text: naam en adres van degene die op zijn beurt leveringen aan de verbruiker verricht; en
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel16
  - number: 16.2.c
    text: naam en adres van de leverancier.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel16
  - number: '16.3'
    text: |-
      Degene aan wie met toepassing van [artikel 50, vierde lid, van de wet][ref1] aardgas of elektriciteit wordt
      geleverd, dient:


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '50'
  - number: 16.3.a
    text: |-
      zijn administratie zodanig in te richten dat daarin op overzichtelijke wijze de gegevens zijn opgenomen omtrent
      alle voor de heffing van de energiebelasting van belang zijnde bedrijfshandelingen, en
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel16
  - number: 16.3.b
    text: |-
      de hoeveelheid aardgas onderscheidenlijk elektriciteit te meten die wordt betrokken voor verbruik als bedoeld in
      [artikel 50, derde lid, onderdeel c, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '50'
  - number: '16.4'
    text: |-
      Wanneer degene aan wie het aardgas of de elektriciteit wordt geleverd niet langer leveringen aan de verbruiker
      verricht, meldt hij onmiddellijk schriftelijk aan de leverancier dat [artikel 50, vierde lid, van de wet][ref1]
      niet langer van toepassing is ten aanzien van aan hem geleverd aardgas of aan hem geleverde elektriciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel50
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '50'
  - number: 16a.1
    text: |-
      De verklaring bedoeld in [artikel b18a van het besluit][ref1] wordt ondertekend en bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0007178
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0007178
  - number: 16a.1.a
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel16a
  - number: 16a.1.b
    text: naam en adres van de energieopslagfaciliteit;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel16a
  - number: 16a.1.c
    text: naam en adres van de leverancier.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel16a
  - number: 16a.2
    text: |-
      De organisatorische eenheid die de energieopslagfaciliteit beheert, dient zijn administratie zodanig in te richten
      dat daarin op overzichtelijke wijze de gegevens zijn opgenomen omtrent alle voor de heffing van de energiebelasting
      van belang zijnde bedrijfshandelingen.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel16a
  - number: 16a.3
    text: |-
      De organisatorische eenheid meldt onmiddellijk schriftelijk aan zijn leverancier indien hij niet langer een
      energieopslagfaciliteit exploiteert.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel16a
  - number: 16a.4
    text: |-
      De verklaring kan worden samengevoegd met de verklaring, bedoeld in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007159#Artikel16
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0007159
        artikel: '16'
        hoofdstuk: VI
  - number: '17'
    text: |-
      Op de administratie van de fiscaal vertegenwoordiger, bedoeld in [artikel 54, eerste lid, van de wet][ref1], is
      [artikel 28][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0007159#Artikel28
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '54'
      - id: ref2
        bwb_id: BWBR0007159
        artikel: '28'
        hoofdstuk: VI
  - number: '19'
    text: |-
      De verklaring, bedoeld in [artikel 20, eerste lid, van het besluit][ref1], wordt ondertekend en bevat de volgende
      gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0007178#Artikel20
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007178
        artikel: '20'
  - number: 19.a
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel19
  - number: 19.b
    text: naam en adres van de verbruiker; en
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel19
  - number: 19.c
    text: naam en adres van de leverancier.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel19
  - number: '20.1'
    text: |-
      Als tuinbouwproducten als bedoeld in [artikel 60, eerste lid, van de wet][ref1] worden aangemerkt groenten, fruit
      en sierteeltproducten.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel60
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '60'
  - number: '20.2'
    text: |-
      De tarieven, genoemd in [artikel 60, eerste lid, van de wet][ref1], vinden slechts toepassing indien de leverancier
      per aansluiting een door de verbruiker ondertekende verklaring kan overleggen waaruit blijkt dat deze het aardgas
      gebruikt voor verwarming ter bevordering van het groeiproces van tuinbouwproducten, en waarin voorts zijn vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel60
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '60'
  - number: 20.2.a
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20
  - number: 20.2.b
    text: de naam en het adres van de verbruiker, en
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20
  - number: 20.2.c
    text: de naam en het adres van de leverancier.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20
  - number: '20.3'
    text: |-
      De verklaring, bedoeld in het tweede lid, heeft betrekking op al het via de aansluiting aan de verbruiker geleverde
      aardgas. Indien slechts een deel van dat aardgas wordt gebruikt voor het in het tweede lid vermelde doel, wordt dit
      in de verklaring vermeld en wordt dat deel uitgedrukt in een percentage van het geheel.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20
  - number: '20.4'
    text: |-
      Indien een gegeven als bedoeld in het tweede lid, onderdeel b of c, of in het derde lid wijzigt, geeft de
      verbruiker binnen zes weken een nieuwe verklaring af aan de leverancier.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20
  - number: '20.5'
    text: |-
      De verbruiker trekt de verklaring binnen zes weken schriftelijk in, indien het door hem afgenomen aardgas
      niet langer wordt gebruikt voor verwarming ter bevordering van het groeiproces van tuinbouwproducten. In de te
      ondertekenen verklaring wordt de datum van wijziging van gebruik opgenomen.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20
  - number: '20.6'
    text: |-
      Onder verwarming ter bevordering van het groeiproces van tuinbouwproducten als bedoeld in
      [artikel 60, eerste lid, van de wet][ref1], wordt verstaan het verwarmen van kassen waarin tuinbouwproducten worden
      gekweekt. Als verwarming ter bevordering van het groeiproces van tuinbouwproducten wordt mede aangemerkt: - de
      verwarming van bloembollenschuren voor bloemknopbevordering en kwaliteitsbehandeling van de bloembollen;
        - de verwarming van de grond via een buizennet voor de behandeling van bloembollen;
        - de verwarming voor de teelt en het drogen van tuinbouwzaden;
        - de verwarming voor het prepareren van plantuitjes met het doel de kwaliteit van consumptie-uitjes te verbeteren;
        - de opwekking van stoom voor het ontsmetten van tuinbouwgronden;
        - de opwekking van stoom voor het kiemvrij maken van mest die wordt gebruikt voor het kweken van champignons;
        - de verwarming van champignoncellen;
        - de bestrijding van nachtvorst in boomgaarden met behulp van kachels;
        - de verwarming voor het forceren van asperges, rabarber en witlof;
        - de verwarming voor het in cellen in bloei trekken van trekheesters;
        - de verwarming voor het prepareren van aardbeiplanten.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel60
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '60'
  - number: 20a.1
    text: |-
      De omstandigheid, bedoeld in [artikel 21c, tweede lid, onderdeel a, van het besluit][ref1], blijkt uit de
      beschikking van de ontvanger waarbij hij het verzoek om uitstel van betaling afwijst omdat naar zijn oordeel: - de
      betalingsproblemen structureel zijn en het bedrijf van de verbruiker niet voldoende levensvatbaar is; of
        - uit door de verbruiker verstrekte gegevens blijkt dat het bedrijf van de verbruiker niet voldoende solvabel is.


      [ref1]: https://wetten.overheid.nl/BWBR0007178#Artikel21c
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0007178
        artikel: 21c
  - number: 20a.2
    text: |-
      De datum waarop de omstandigheid, bedoeld in [artikel 21c, tweede lid, onderdeel a, van het besluit][ref1],
      zich voordoet is de datum van de dagtekening van de beschikking waarbij het verzoek om uitstel van betaling
      onherroepelijk is afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0007178#Artikel21c
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0007178
        artikel: 21c
  - number: 20a.3
    text: |-
      Indien het einde van de termijn van drie maanden, bedoeld in [artikel 21c, derde lid, van het besluit][ref1], niet
      samenvalt met het einde van een periode waarvoor de leverancier het geleverde aardgas aan de verbruiker in rekening
      brengt, past de leverancier het tarief, bedoeld in [artikel 60, eerste lid, van de wet][ref2], naar evenredigheid
      toe.


      [ref1]: https://wetten.overheid.nl/BWBR0007178#Artikel21c
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel60
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0007178
        artikel: 21c
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '60'
  - number: 20b
    text: |-
      De verklaring, bedoeld in [artikel 21d, eerste lid, van het besluit][ref1], wordt door de verbruiker ondertekend en
      bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0007178#Artikel21d
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0007178
        artikel: 21d
  - number: 20b.a
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20b
  - number: 20b.b
    text: naam en adres van de verbruiker;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20b
  - number: 20b.c
    text: naam en adres van de leverancier;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel20b
