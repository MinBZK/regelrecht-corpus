    text: |-
      De administratie van degene die een verzoek als bedoeld in het eerste of tweede lid om teruggaaf indient, is
      zodanig ingericht dat daarin op overzichtelijke wijze alle voor de vaststelling van het bedrag van de teruggaaf van
      belang zijnde gegevens zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel25
  - number: '26.1'
    text: |-
      De teruggaafregeling, bedoeld in [artikel 69, tweede lid, van de wet][ref1], is van toepassing mits:


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel69
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel26
    references:
