  - number: '28.2'
    text: |-
      Voor de toepassing van [artikel 57 van de wet][ref1] blijkt uit de administratie van de belastingplichtige, bedoeld
      in [artikel 53, tweede lid, van de wet][ref2], hoeveel aardgas en elektriciteit aan hem is geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel53
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0007168
        artikel: '53'
  - number: '29.1'
    text: |-
      De administratie van een installatie waarin zuivere biomassa zodanig wordt verwerkt dat daaruit elektriciteit wordt
      opgewekt, dient zodanig te zijn ingericht dat daarin op overzichtelijke wijze alle gegevens zijn opgenomen welke
      van belang zijn voor de jaarlijkse vaststelling van:
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel29
  - number: 29.1.a
    text: |-
      de door de installatie geproduceerde hoeveelheid elektriciteit alsmede de aan het distributienet geleverde
      hoeveelheid elektriciteit;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel29
  - number: 29.1.b
    text: de verbruikte hoeveelheid fossiele brandstof en de energie-inhoud daarvan;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel29
  - number: 29.1.c
    text: de verbruikte hoeveelheid biomassa die als zuivere biomassa kan worden aangemerkt en de energie-inhoud daarvan;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel29
  - number: 29.1.d
    text: |-
      de verbruikte hoeveelheid biomassa die niet als zuivere biomassa kan worden aangemerkt en de energie-inhoud
      daarvan;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel29
  - number: 29.1.e
    text: het netto elektrisch rendement van de installatie.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel29
  - number: '29.2'
    text: |-
      De administratie van een installatie waarin zuivere biomassa wordt verwerkt op een wijze als bedoeld in het eerste
      lid, dient zodanig te zijn ingericht dat daarin op overzichtelijke wijze de gegevens zijn opgenomen omtrent alle
      voor de toepassing van [artikel 14][ref1] van belang zijnde bedrijfshandelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007159#Artikel14
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007159
        artikel: '14'
        hoofdstuk: VI
  - number: '29.3'
    text: |-
      De administratie van een installatie waarin biomassa zodanig wordt verwerkt dat daaruit stortgas,
      rioolwaterzuiveringsgas of biogas wordt gewonnen, dient zodanig te zijn ingericht dat daarin op overzichtelijke
      wijze alle gegevens zijn opgenomen welke van belang zijn voor de jaarlijkse vaststelling van de door de installatie
      gewonnen en aan het distributienet geleverde hoeveelheid stortgas, rioolwaterzuiveringsgas, of biogas.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel29
  - number: 29a.1
    text: |-
      Het percentage van de met aardgas opgewekte warmte die vanuit een energiebedrijf voor glastuinbouw direct of
      indirect naar een of meer glastuinbouwbedrijven is getransporteerd, wordt berekend met de formule: A / B * 100%.
      Hierbij is: A = de som van alle met aardgas opgewekte warmte in gigajoule die vanuit het energiebedrijf voor
      glastuinbouw in het tijdvak direct of indirect bij glastuinbouwbedrijven is afgeleverd; B = de som van alle met
      aardgas opgewekte warmte in gigajoule die vanuit het energiebedrijf voor glastuinbouw in het tijdvak bij alle
      afnemers is afgeleverd.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel29a
  - number: 29a.2
    text: |-
      Een energiebedrijf voor glastuinbouw monitort de hoeveelheid met aardgas opgewekte warmte die direct of indirect is
      afgeleverd bij glastuinbouwbedrijven of andere afnemers.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel29a
  - number: 29a.3
    text: |-
      Voor de toepassing van dit artikel wordt onder warmte verstaan de thermische energie die voor ruimteverwarming of
      de verwarming van tapwater wordt geleverd door middel van het transport van water of een andere vloeistof.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel29a
  - number: 29b.1
    text: |-
      De belastingplichtige monitort de hoeveelheid aardgas die in een kalenderjaar is verstookt op basis van de
      eindfactuur van de energieleverancier over dat kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel29b
  - number: 29b.2
    text: |-
      In afwijking van het eerste lid kan de belastingplichtige de hoeveelheid aardgas die is verstookt monitoren aan de
      hand van:
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel29b
  - number: 29b.2.a
    text: de twaalf maandfacturen van het kalenderjaar waarover de heffing is verschuldigd;
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel29b
  - number: 29b.2.b
    text: andere schriftelijke afleveringsbewijzen waaruit de in het kalenderjaar verstookte hoeveelheid aardgas blijkt.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel29b
  - number: '33'
    text: |-
      De administratie van degene die verzoekt om teruggaaf van belasting, bedoeld in
      [artikel 92, eerste lid, van de wet][ref1], is zodanig ingericht dat daarin op overzichtelijke wijze alle voor de
      vaststelling van het bedrag van de teruggaaf van belang zijnde gegevens zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel92
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '92'
  - number: 33a
    text: |-
      Indien een verzoek om teruggaaf langs elektronische weg wordt ingediend, worden de bij het verzoek over te leggen
      bescheiden niet bij het verzoek overgelegd, maar desgevraagd aan de inspecteur verstrekt.
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel33a
  - number: '34'
    text: |-
      Deze regeling treedt in werking met ingang van de datum waarop de bepalingen van de
      [Wet belastingen op milieugrondslag][ref1] en van het [Uitvoeringsbesluit][ref2] waarop deze regeling berust, in
      werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0007168
      [ref2]: https://wetten.overheid.nl/BWBR0007178
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007168
      - id: ref2
        bwb_id: BWBR0007178
  - number: '35'
    text: 'Deze regeling wordt aangehaald als: Uitvoeringsregeling belastingen op milieugrondslag.'
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel35
