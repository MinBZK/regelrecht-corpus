    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel26
  - number: 26.1.c
    text: |-
      de instelling die voldoet aan de voorwaarden, bedoeld in
      [artikel 5c, onderdelen a en b, van de Algemene wet inzake rijksbelastingen][ref1], verklaart dat aan die
      voorwaarden en aan de voorwaarde, bedoeld in [artikel 69, tweede lid, onderdeel e, van de wet][ref2], is voldaan,
      en de in artikel 5c, onderdeel a, van de Algemene wet inzake rijksbelastingen genoemde regelgeving desgevraagd
      wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5c
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel69
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel26
    references:
