        bwb_id: BWBR0007168
        artikel: '69'
  - number: 26.1.a
    text: |-
      de instelling verklaart dat is voldaan aan de voorwaarden, bedoeld in
      [artikel 69, tweede lid, onderdelen a, b en d, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel69
    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '69'
  - number: 26.1.b
