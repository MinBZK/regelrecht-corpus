      [60, vijfde lid][ref15], [60b, vierde lid][ref16], [63, zevende lid][ref17], [64, zevende lid][ref18],
      [67, vierde lid][ref19], [68, vierde lid][ref20], [69, achtste lid][ref21], [70, vijfde lid][ref22],
      [70a, vierde lid][ref23], [71, tweede en derde lid][ref24], [71t, tweede lid][ref25], [71ta, derde lid][ref26],
      [71w, derde lid][ref27], en [92, zesde lid, van de Wet belastingen op milieugrondslag][ref28]
      en de [artikelen 6, tweede lid][ref29], [11c, vierde lid][ref30], [18, vijfde lid][ref31],
      [19, tweede lid, onderdeel c][ref32], [21c, zesde lid][ref33], [27, vierde lid][ref34], en
      [28, vijfde lid, van het Uitvoeringsbesluit belastingen op milieugrondslag][ref35].


