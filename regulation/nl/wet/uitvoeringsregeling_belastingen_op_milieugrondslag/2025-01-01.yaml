    url: https://wetten.overheid.nl/BWBR0007159/2025-01-01#Artikel26
  - number: 26.2.d
    text: |-
      de instelling die het verzoek om teruggaaf doet, een bezettingsoverzicht overlegt van de
      bezettingsgraad in tijd en oppervlakte, dan wel in huuropbrengsten, van de onroerende zaak, waaruit
      blijkt dat de onroerende zaak hoofdzakelijk in gebruik is geweest bij meer dan één instelling die
      een algemeen nut beogende instelling is of die een instelling is die voldoet aan de voorwaarden,
      bedoeld in [artikel 5c, onderdelen a en b, van de Algemene wet inzake rijksbelastingen][ref1], en
      [artikel 69, tweede lid, onderdeel e, van de wet][ref2].


