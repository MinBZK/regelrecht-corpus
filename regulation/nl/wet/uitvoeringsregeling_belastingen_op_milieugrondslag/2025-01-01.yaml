    text: |-
      Deze regeling geeft uitvoering aan de artikelen [14, tweede en vierde lid][ref1], [20, vierde lid][ref2],
      [21, tweede lid][ref3], [23, vijfde lid][ref4], [25, vierde lid][ref5], [38, tweede lid, onderdeel b][ref6],
      [39, tweede lid][ref7], [44, vijfde lid][ref8], [45, vierde lid][ref9], [47, tweede en vijfde lid][ref10],
