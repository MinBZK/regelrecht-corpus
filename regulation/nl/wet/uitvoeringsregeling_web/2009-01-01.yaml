articles:
  - number: 5.4c
    text: |-
      1 In afwijking van [artikel 4.2.8 van het besluit][ref1] verstrekt het landelijk orgaan vóór 15 november 2003 aan
      de minister een opgave van het aantal door dat landelijk orgaan erkende leerbedrijven op de peildatum 1 oktober
      2003.

      2 De verklaring omtrent de getrouwheid, bedoeld in [artikel 2.5.3, vierde lid][ref2], juncto
      [artikel 2.5.10, eerste lid, van de wet][ref3] heeft mede betrekking op de opgave, bedoeld in het eerste lid.


