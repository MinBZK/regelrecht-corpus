      In afwijking van [artikel 4.2.8 van het besluit][ref1] verstrekt het landelijk orgaan vóór 15 november 2003 aan de
      minister een opgave van het aantal door dat landelijk orgaan erkende leerbedrijven op de peildatum 1 oktober 2003.


