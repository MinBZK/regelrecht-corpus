  - number: 3.3.3
    text: |-
      1 Het bevoegd gezag van een instelling heeft naast de aanspraak op grond van [artikel 2.2.2 van het besluit][ref1],
      in geval van een agrarisch opleidingscentrum vermeerderd met de rijksbijdrage zoals vastgesteld op grond
      van [artikel 2.3.2 van het besluit][ref2], artikel 2, tweede lid, artikel 5, tweede lid, of op grond van
      [artikel 2 van het Besluit bekostiging agrarische innovatie- en praktijkcentra 1997][ref3], per kalenderjaar
      aanspraak op een vergoeding voor uitkeringen.

      2 De vergoeding, bedoeld in het eerste lid, is voor het jaar 2001 en verder, het bedrag berekend volgens de
      volgende formule:








                    *(PI + InbI + EduI)*


                    x W




                    (PL + InbL + EduL)






      In deze formule en voor zover van toepassing de formule, bedoeld in [artikel 3.3.4][ref4], wordt verstaan onder:

      PI: de rijksbijdrage voor de exploitatiekosten, zoals omschreven in het eerste lid, van de desbetreffende
      instelling voor het kalenderjaar voorafgaande aan het desbetreffende kalenderjaar;

      InbI: de hoogte van het bedrag dat met de overeenkomst of de overeenkomsten inburgering van de desbetreffende
      instelling in het kalenderjaar voorafgaand aan het desbetreffende kalenderjaar is gemoeid, blijkend uit de
      jaarrekening van de instelling;

      EduI: de hoogte van het bedrag dat met de overeenkomst of overeenkomsten educatie van de desbetreffende instelling
      in het kalenderjaar voorafgaand aan het desbetreffende kalenderjaar is gemoeid, blijkend uit de jaarrekening van
      de instelling;

      PL: de rijksbijdrage voor de exploitatiekosten, zoals omschreven in het eerste lid, van de instellingen voor het
      kalenderjaar voorafgaande aan het desbetreffende kalenderjaar;

      InbL: de hoogte van het bedrag dat met de overeenkomsten inburgering van de instellingen in het kalenderjaar
      voorafgaand aan het desbetreffende kalenderjaar is gemoeid, blijkend uit de jaarrekeningen van de instellingen;

      EduL: de hoogte van het bedrag dat met de overeenkomsten educatie van de instellingen in het kalenderjaar
      voorafgaand aan het desbetreffende kalenderjaar is gemoeid, blijkend uit de jaarrekeningen van de instellingen;

      W: het in artikel 20.01 van de begroting van de uitgaven van het Ministerie van Onderwijs, Cultuur en Wetenschappen
      en in de artikelen 16.07 en 16.08 van de begroting van het ministerie van Landbouw, Natuurbeheer en Visserij van
      het desbetreffende kalenderjaar, opgenomen wachtgeldbudget voor de instellingen.

      3 De vergoeding, bedoeld in het eerste lid, is voor het jaar 2000, het bedrag berekend volgens de formule, bedoeld
      in het tweede lid, met dien verstande dat in afwijking van het tweede lid in die formule wordt verstaan onder:

      PI: de rijksbijdrage, berekend met inachtneming van artikel 2, artikel 7, derde lid, en artikel 8, van de
      Overgangsregeling bekostiging beroepsonderwijs WEB tot 2000, en de rijksbijdrage, berekend met inachtneming van
      de artikelen 3, 4, 5, eerste lid, en 6 van de Overgangsregeling bekostiging opleidingen tot vepleegkundige en
      verzorgende beroepen WEB tot 2000, voor de desbetreffende instelling voor het jaar 1999,

      PL: de rijksbijdrage, berekend met inachtneming van artikel 2, artikel 7, derde lid, en artikel 8, van de
      Overgangsregeling bekostiging beroepsonderwijs WEB tot 2000, en de rijksbijdrage, berekend met inachtneming van
      de artikelen 3, 4, 5, eerste lid, en 6 van de Overgangsregeling bekostiging opleidingen tot verpleegkundige en
      verzorgende beroepen WEB tot 2000, van de instellingen voor het jaar 1999,

      Inbl: de hoogte van het bedrag dat met de overeenkomst of overeenkomsten inburgering van de desbetreffende
      instelling is gemoeid in het jaar 1999,

      Edul: de hoogte van het bedrag dat met de overeenkomst of overeenkomsten educatie van de desbetreffende instelling
      is gemoeid in het jaar 1999,

      InbL: de hoogte van het bedrag dat met de overeenkomst of overeenkomsten inburgering van de instellingen is gemoeid
      in het jaar 1999, en

      EduL: de hoogte van het bedrag dat met de overeenkomst of overeenkomsten educatie van de instellingen is gemoeid in
      het jaar 1999.

      4 De uitkomsten van de in het tweede en derde lid bedoelde berekeningen wordt rekenkundig afgerond op twee cijfers
      achter de komma.

      5 De minister kan voor zover het betreft educatie en inburgering, in afwachting van de indiening van de
      jaarrekeningen door de instellingen, een voorlopig bedrag toevoegen aan de rijksbijdrage.


