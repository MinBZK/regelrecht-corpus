  - number: 3.2.5
    text: |-
      1 Het bevoegd gezag van een instelling kan de minister verzoeken goed te keuren dat een deelnemer, in
      aanvulling op [artikel 2.2.3, eerste lid, onderdeel a, van de definitie van DDi, van het besluit][ref1],
      op 1 oktober als deelnemer in de beroepsbegeleidende leerweg van de opleidingen, bedoeld in
      [artikel 7.2.2, eerste lid onderdelen a en b, van de wet][ref2] voor bekostiging in aanmerking wordt gebracht. Het
      bevoegd gezag toont voor 1 juni van het daaropvolgende jaar aan dat:

      a. met deze deelnemer een praktijkovereenkomst is gesloten als bedoeld in [artikel 7.2.8 van de wet][ref3],

      b. deze deelnemer is aangesteld in een dienstbetrekking als bedoeld in
      [artikel 4 van de Wet inschakeling werkzoekenden][ref4], of

      c. deze deelnemer is aangesteld in een dienstbetrekking krachtens arbeidsovereenkomst als bedoeld in
      [artikel 610 van Boek 7 van het Burgerlijk Wetboek][ref5], bij een bedrijf waar de praktijk van het beroep kan
      worden geoefend.

      2 De minister keurt het verzoek goed indien:

      a. het een deelnemer betreft ten aanzien van wie op 1 augustus van het jaar waarin deze deelnemer voor de eerste
      maal wordt ingeschreven aan de instelling de volledige leerplicht is geëindigd, maar die de leeftijd van 18 jaren
      nog niet heeft bereikt;

      b. uit de onderwijsovereenkomst met de deelnemer blijkt dat voorbereidende en ondersteunende activiteiten als
      bedoeld in [artikel 7.2.2, vierde lid, van de wet][ref6] worden toegevoegd aan de opleiding of het deel waarvoor de
      deelnemer is ingeschreven;

      c. het een deelnemer betreft die bij de inschrijving voor de opleiding of het deel daarvan niet in het bezit is
      van:

      1. een diploma beroepsonderwijs van een opleiding als bedoeld in [artikel 7.2.2, eerste lid, van de wet][ref7],

      2. een bewijs dat de eerste drie leerjaren van een school voor hoger algemeen voortgezet onderwijs of van een
      school voor voorbereidend wetenschappelijk onderwijs met gunstig gevolg zijn doorlopen.

      3. een diploma middelbaar algemeen voortgezet onderwijs,

      4. een diploma voorbereidend beroepsonderwijs of lager beroepsonderwijs, dan wel een diploma verkregen op grond van
      een eindexamen waarbij één of meer vakken volgens het A-programma en de overige vakken volgens het B-programma zijn
      geëxamineerd, of

      5. een ander diploma of bewijs dat overeenkomt met onder 1 tot en met 4 verkregen diploma of bewijs, en

      d. het bevoegd gezag van de instelling verklaart dat:

      1. ten aanzien van de deelnemer uiterlijk op 31 december van het jaar waarin deze deelnemer voor de
      eerste maal wordt ingeschreven aan de instelling, door de gemeente en de Arbeidsvoorzieningsorganisatie
      een traject zal worden vastgesteld dat is gericht op inschakeling in het arbeidsproces als bedoeld in
      [artikel 9, eerste lid, van de Wet inschakeling werkzoekenden][ref8], of

      2. ten behoeve van de deelnemer uiterlijk op 31 december van het jaar waarin deze deelnemer voor de eerste maal
      wordt ingeschreven aan de instelling, een leerplaats beschikbaar zal worden gesteld waar de praktijk van het beroep
      kan worden geoefend.

      3 Het verzoek, bedoeld in het eerste lid, wordt door het bevoegd gezag van de instelling voor 1 november van het
      jaar waarin deze deelnemer voor de eerste maal wordt ingeschreven aan de instelling, ingediend bij de inspecteur.
      Daartoe vult het bevoegd gezag het als bijlage 10 bij deze regeling gevoegde formulier in. De minister beslist
      binnen zes weken na ontvangst van het verzoek.


