  - number: 3.5.1
    text: |-
      1 Indien de minister van een instelling het formulier Bekostigingstelling beroepsonderwijs van
      [bijlage 4 behorende bij het besluit][ref1] niet uiterlijk 1 juli van het jaar voorafgaand aan het bekostigingsjaar
      voorzien van een goedkeurende accountantsverklaring heeft ontvangen, stelt de minister de hoogte van de
      rijksbijdrage voor deze instelling voor het desbetreffende kalenderjaar ambtshalve vast, op de wijze bedoeld in het
      tweede tot en met het vijfde lid.

      2 Bij de toepassing van [artikel 2.2.2 van het besluit][ref2] wordt voor een instelling, bedoeld in het eerste lid,
      bij de berekening van de rijksbijdrage voor exploitatiekosten voor het beroepsonderwijs:

      a. in afwijking van [artikel 2.2.3, eerste lid, van het besluit][ref3], de uitkomst van het gedeelte van de formule
      boven de streep vastgesteld op 90% van de uitkomst van dat deel van de formule van het voorgaande kalenderjaar;

      b. in afwijking van [artikel 2.2.4 van het besluit][ref4], de uitkomst van het gedeelte van de formule boven de
      streep vastgesteld op 90% van de uitkomst van dat deel van de formule van het voorgaande kalenderjaar;

      c. in afwijking van [artikel 3.2.2][ref5] het aantal deelnemers bedoeld in de onderdelen a, b en c van deze
      bepaling vastgesteld op 90% van het aantal deelnemers dat is gehanteerd bij de berekening van de rijksbijdrage van
      het voorgaande kalenderjaar.

      3 Indien toepassing wordt gegeven aan het eerste lid, wordt in [artikel 2.2.4 van het besluit][ref6]
      in de begripsbepalingen LD1, LD2 en LD3 tevens gelezen: alsmede de op grond van
      [artikel 3.5.1, tweede lid onderdeel b][ref7], van de Uitvoeringsregeling WEB vastgestelde aantallen diploma's.

      4 De instellingen, bedoeld in het eerste lid, dienen uiterlijk 1 november van het jaar voorafgaand aan het
      bekostigingsjaar het in het eerste lid bedoelde formulier, voorzien van een goedkeurende accountantsverklaring, in
      bij de minister.

      5 Indien uit het formulier, bedoeld in het vierde lid, blijkt dat toepassing van [artikel 2.2.3][ref8]
      respectievelijk [artikel 2.2.4 van het besluit][ref9] en [artikel 3.2.2][ref10] van de regeling leidt tot een
      lagere waarde dan vastgesteld op grond van het tweede lid onderdelen a, b respectievelijk c wordt de vergoeding van
      de instelling berekend op grond van die lagere waarde.

      6 Indien uit het formulier, bedoeld in het vierde lid, blijkt dat toepassing van [artikel 2.2.3][ref11]
      respectievelijk [artikel 2.2.4 van het besluit][ref12] en [artikel 3.2.2][ref13] van de regeling leidt tot een
      gelijke of hogere waarde dan vastgesteld op grond van het tweede lid, onderdelen a, b respectievelijk c, wordt de
      vergoeding van de instelling berekend op grond van het tweede lid.


