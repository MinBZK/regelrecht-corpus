  - number: 3.1.2
    text: |-
      1 Het aantal formatieplaatsen wordt verhoogd met één formatieplaats per agrarisch opleidingscentrum.

      2 Indien twee of meer agrarische opleidingscentra een fusie met elkaar aangaan, behoudt het agrarisch
      opleidingscentrum dat tengevolge van de fusie tot stand komt het aantal formatieplaatsen, bedoeld in het eerste
      lid, dat ieder van de agrarische opleidingscentra afzonderlijk vóór de fusie had, voor een periode van drie jaren
      na het jaar waarin de fusie plaatsvond.

      3 In aanvulling op het bepaalde in het eerste lid wordt het aantal formatieplaatsen uitgebreid met:

      a. een halve formatieplaats per school voor voorbereidend beroepsonderwijs met een afdeling landbouw en natuurlijke
      omgeving die uiterlijk op 1 augustus 1991 deel uitmaakte van het agrarisch opleidingscentrum, en

      b. twee formatieplaatsen per school met een afdeling paardenhouderij en paardensport die uiterlijk op 1 augustus
      1991 deel uitmaakte van een agrarisch opleidingscentrum.

      4 De prijs per leerling beroepsonderwijs en leerwegondersteunend onderwijs, bedoeld in
      [artikel 2.3.2 van het besluit][ref1], bedraagt

      a. voor de leerling beroepsonderwijs ƒ 8.502,-, en

      b. voor de leerling leerwegondersteunend onderwijs ƒ 12.988,-.

      5 De prijs per leerling kan worden aangepast in verband met salarismaatregelen en prijsbijstellingen die
      voortvloeien uit de rijksbegroting.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2.3.2
