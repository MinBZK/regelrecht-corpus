  - number: 3.3.2
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. instelling:

      een instelling als bedoeld in [artikel 1.3.1 van de wet][ref1], een agrarisch innovatie- en praktijkcentrum als
      bedoeld in [artikel 1.3.4 van de wet][ref2], een instituut als bedoeld in [artikel 12.3.8 van de wet][ref3] of een
      hogeschool als bedoeld in [artikel 12.3.9 van de wet][ref4];

      b. uitkering:

      een werkloosheidsuitkering als bedoeld in de [Hoofdstukken I][ref5] en
      [II van het Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref6] of suppletie inzake arbeidsongeschiktheid
      als bedoeld in Hoofdstuk 3, van het tijdelijk Besluit ziekte en arbeidsongeschiktheid onderwijs- en
      onderzoekpersoneel, voortvloeiend uit een dienstbetrekking aan een instelling;

      c. overeenkomst inburgering:

      een overeenkomst als bedoeld in [artikel 2.3.4 van de wet][ref7], die betrekking heeft op de educatieve programma's
      bedoeld in [artikel 2.3.1, tweede lid, van de wet][ref8];

      d. overeenkomst educatie:

      een overeenkomst als bedoeld in [artikel 2.3.4, eerste lid, van de wet][ref9].


