articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. wet:

      de [Wet educatie en beroepsonderwijs][ref1], en

      b. besluit:

      het [Uitvoeringsbesluit WEB][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0010646
