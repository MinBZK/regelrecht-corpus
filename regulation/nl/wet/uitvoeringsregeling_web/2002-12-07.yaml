    text: |-
      1 De minister verhoogt de rijksbijdrage voor het beroepsonderwijs van een instelling voor het kalenderjaar 2000,
      zoals berekend op grond van de [artikelen 2.2.2][ref1] en [2.4.1 van het besluit][ref2], indien E.2000 lager is
      dan E.1999, volgens de volgende formule: (E.1999 - E.2000) x 20% x 2,38376. In de eerste volzin wordt verstaan
      onder: 'E.1999: het totaal van de bedragen die door gemeenten op grond van een overeenkomst als bedoeld in'
      [artikel 2.3.4 van de wet][ref3], aan de desbetreffende instelling zijn toegekend en beschikbaar gesteld voor het
      kalenderjaar 1999, gecorrigeerd naar het prijspeil dat ten grondslag ligt aan Bekendmaking rijksbijdrage educatie
      2000 (Uitleg OCenW-Regelingen 1999, nr.23); E.2000: het totaal van de door de minister berekende bedragen die de
      bij E.1999 bedoelde gemeenten, op grond van het verschil tussen de nieuwe berekening en de oude berekening, zoals
      die voor de desbetreffende gemeenten zijn vastgesteld op grond van [artikel 6.2.1 van het besluit][ref4], bij
      ongewijzigd beleid van de betreffende gemeente aan de desbetreffende instelling voor het kalenderjaar 2000 zouden
      toekennen.

      2 In geval voor 1 januari 2000 samenvoeging van instellingen als bedoeld in
      [artikel 2.1.3, tweede lid onderdeel b, van de wet][ref5], plaatsvindt, worden de bedragen zoals omschreven in
      E.1999, bedoeld in het eerste lid, van instellingen die bij de samenvoeging betrokken zijn, opgeteld. De op deze
      wijze verkregen bedragen van E1999 worden gebruikt voor de berekening van E.2000 van de nieuwe instelling.

      3 In geval voor 1 januari 2000 afspraken tussen instellingen inzake een splitsing als bedoeld in
      [artikel 9.1.3, derde lid, van de wet][ref6], worden gemaakt over opleidingen educatie, verstrekken de betrokken
      bevoegde gezagorganen tezamen een opgave van E.1999 van elk bij de splitsing betrokken instelling afzonderlijk.


