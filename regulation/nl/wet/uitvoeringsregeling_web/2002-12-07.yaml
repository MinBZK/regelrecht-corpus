  - number: 5.3a
    text: |-
      1 In afwijking van [artikel 4.2.5, tweede lid, van het besluit][ref1] wordt per landelijk orgaan het aantal
      normatieve bpv-plaatsen ten aanzien van de beroepsbegeleidende leerweg berekend door het aantal normatieve bpv-
      plaatsen zoals voor dat landelijk orgaan berekend voor het bekostigingsjaar 2001 en het aantal deelnemers aan
      de beroepsbegeleidende leerweg op 1 oktober 2000 te middelen. Bij deze berekening wordt onder deelnemer aan de
      beroepsbegeleidende leerweg verstaan:

      a. de deelnemer die op de bedoelde datum als daadwerkelijk schoolgaand stond ingeschreven aan de beroepsbegeleidende
      leerweg en voor wie een overeenkomst als bedoeld in [artikel 7.2.8, tweede lid, van de wet][ref2] is afgesloten en

      b. de deelnemer die op de bedoelde datum als daadwerkelijk schoolgaand stond ingeschreven aan een opleiding
      beroepsbegeleidend onderwijs als bedoeld in [artikel 12.3.24, eerste lid, onderdeel b, van de wet][ref3].

      2 In afwijking van[ artikel 4.2.5, tweede lid, van het besluit][ref4] wordt per landelijk orgaan het aantal
      normatieve bpv-plaatsen ten aanzien van de beroepsopleidende leerweg berekend door bij elkaar op te tellen:

        - 35% van het gemiddelde van het aantal voltijds deelnemers aan de beroepsopleidende leerweg op 1 oktober 1998 en
      het aantal voltijds deelnemers aan de beroepsopleidende leerweg op 1 oktober 2000 en
        - 10% van het gemiddelde van het aantal deeltijds deelnemers aan de beroepsopleidende leerweg op 1 oktober 1998 en
      het aantal deeltijds deelnemers aan de beroepsopleidende leerweg op 1 oktober 2000.

      Bij deze berekening wordt verstaan onder:

      a. voltijds deelnemer aan de beroepsopleidende leerweg: de voltijds deelnemer die op de bedoelde datum als
      daadwerkelijk schoolgaand stond ingeschreven aan de beroepsopleidende leerweg dan wel aan een opleiding middelbaar
      beroepsonderwijs als bedoeld in [artikel 12.3.24, eerste lid, onderdeel b, van de wet][ref5] en

      b. deeltijds deelnemer: de deeltijds deelnemer die op de bedoelde datum als daadwerkelijk schoolgaand stond
      ingeschreven aan de beroepsopleidende leerweg of aan een opleiding deeltijds middelbaar beroepsonderwijs als
      bedoeld in [artikel 12.3.24, eerste lid, onderdeel b, van de wet][ref6].

      3 In afwijking van [artikel 4.2.7, tweede lid, onderdeel c][ref7], en [artikel 4.2.8 van het besluit][ref8]
      wordt voor elk landelijk orgaan het aantal leerbedrijven in de beroepsbegeleidende leerweg vastgesteld door
      achtereenvolgens:

        - het aantal erkende leerbedrijven op 1 oktober 1999 en het aantal erkende leerbedrijven op 1 oktober 2000 te
      middelen;
        - de uitkomst daarvan te delen door de som van het aantal normatieve bpv-plaatsen, berekend volgens het eerste en
      het tweede lid, en
        - de uitkomst daarvan te vermenigvuldigen met het aantal normatieve bpv-plaatsen, berekend volgens het eerste lid.

      4 In afwijking van [artikel 4.2.7, tweede lid, onderdeel d][ref9], en [artikel 4.2.8 van het besluit][ref10]
      wordt voor elk landelijk orgaan het aantal leerbedrijven in de beroepsopleidende leerweg vastgesteld door
      achtereenvolgens:

        - het aantal erkende leerbedrijven op 1 oktober 1999 en het aantal erkende leerbedrijven op 1 oktober 2000 te
      middelen;
        - de uitkomst daarvan te delen door de som van het aantal normatieve bpv-plaatsen, berekend volgens het eerste en
      het tweede lid en
        - de uitkomst daarvan te vermenigvuldigen met het aantal normatieve bpv-plaatsen, berekend volgens het tweede lid.


