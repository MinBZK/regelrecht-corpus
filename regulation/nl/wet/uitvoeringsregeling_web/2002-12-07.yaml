      1 De minister gaat gedurende het kalenderjaar waarop de verminderingen, bedoeld in
      [artikel 3.3.4, eerste lid][ref1], betrekking hebben, over tot een voorlopige inhouding op de rijksbijdrage.

      2 De definitieve vaststelling van de verminderingen, bedoeld in het eerste lid, vindt plaats in maart of zoveel
      eerder als mogelijk is, volgend op het in het eerste lid bedoelde kalenderjaar.


