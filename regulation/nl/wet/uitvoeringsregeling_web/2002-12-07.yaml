  - number: '5.1'
    text: |-
      1 De minister kan aan de rijksbijdrage, berekend op grond van [artikel 2.4.2 van de wet][ref1], ten behoeve van
      specifieke, door de minister aan te duiden activiteiten van beperkte duur en onder door hem te stellen voorwaarden
      aanvullende bedragen toevoegen. De minister maakt in voorkomend geval zijn voornemens hiertoe bij gelegenheid
      van de indiening van het voorstel van wet inzake de rijksbegroting voor het jaar waarop de aanvullende bedragen
      betrekking hebben, aan de Tweede Kamer der Staten-Generaal bekend.

      2 De omvang van de aanvullende bedragen bedraagt ten hoogste 2% van de rijksbijdrage, berekend op grond van
      [artikel 2.4.2 van de wet][ref2]. Indien de minister bij gelegenheid van de indiening van de in het eerste lid
      bedoelde begroting aantoont dat voor de in dat lid bedoelde activiteiten een groter bedrag noodzakelijk is, kan van
      het in de eerste volzin bedoelde percentage worden afgeweken.

      3 De minister beslist binnen negen maanden na ontvangst van een aanvraag voor een aanvullend bedrag als bedoeld
      in het eerste lid. Indien de beschikking niet binnen negen maanden kan worden afgegeven, stelt de minister de
      aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.


