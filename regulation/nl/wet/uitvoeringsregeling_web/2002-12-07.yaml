  - number: 3.2.4
    text: |-
      Het plan, bedoeld in [artikel 6.1.4, tweede lid, van het besluit][ref1], voldoet aan de volgende voorwaarden:

      a. het beleid van de instelling ten aanzien van de besteding van de overgangsgelden is uiteengezet,

      b. de in het plan opgenomen maatregelen zijn toereikend om een structureel lagere bekostiging van de instelling te
      kunnen opvangen, en

      c. het bevat de perioden waarbinnen elk van de maatregelen wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel6.1.4
