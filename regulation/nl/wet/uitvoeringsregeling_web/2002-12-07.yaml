  - number: 3.2.2
    text: |-
      Het deel van de rijksbijdrage voor voorbereidende en ondersteunende activiteiten als bedoeld in artikel 7.2.2,
      vierde lid, van de wet, wordt op grond van artikel 6.1.1, tweede lid, van het besluit, berekend door het
      landelijk beschikbare budget ten behoeve van de voorbereidende en ondersteunende activiteiten, zoals dat voor
      dat kalenderjaar is vastgesteld op grond van artikel 2.2.1, eerste lid, van het besluit te verdelen naar rato van
      het aantal deelnemers dat op 1 oktober van het tweede kalenderjaar voorafgaand aan het desbetreffende jaar per
      instelling aan de opleidingen als bedoeld in artikel 7.2.2, eerste lid, onderdelen a en b, van de wet, deelneemt,
      waarbij:

      a. het aantal deelnemers aan de opleiding, bedoeld in artikel 7.2.2, eerste lid, onderdeel a, van de wet, met de
      factor 1 wordt vermenigvuldigd,

      b. het aantal deelnemers aan de opleiding, bedoeld in artikel 7.2.2, eerste lid onderdeel b, van de wet, met de
      factor 0,4 wordt vermenigvuldigd, en

      c. het aantal deelnemers dat voldoet aan de voorwaarden, bedoeld in artikel 6.1.2 van het besluit, met de factor 1
      wordt vermenigvuldigd.
    url: https://wetten.overheid.nl/BWBR0010930/2002-12-07#Artikel3.2.2
