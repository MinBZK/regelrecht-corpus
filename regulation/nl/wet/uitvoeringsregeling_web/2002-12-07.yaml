  - number: 4.1.2
    text: |-
      De rijksbijdrage per gemeente wordt aan de gemeente toegekend onder de voorwaarde dat gedurende de periode van 1
      januari tot 31 december van het jaar waarvoor de middelen worden toegekend, één of meer overeenkomsten als bedoeld
      in [artikel 2.3.4, eerste lid, van de wet][ref1] van kracht zijn, op grond waarvan die gemeente zich verplicht
      tot toekenning en beschikbaarstelling van het totale bedrag van de rijksbijdrage voor deze periode ten behoeve van
      activiteiten gedurende de looptijd van de overeenkomst of overeenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.3.4
    url: https://wetten.overheid.nl/BWBR0010930/2002-12-07#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 2.3.4
  - number: 4.1.3
    text: |-
      1 Indien een gemeente besluit tot een vermindering van het bedrag van de verplichting ten opzichte van een bepaalde
      instelling, gedurende of na afloop van het kalenderjaar waarvoor de desbetreffende rijksbijdrage is toegekend, is
      die vermindering niet eerder van kracht dan nadat:

      a. tussen het gemeentebestuur en het bevoegd gezag van de instelling een redelijke termijn voor de vermindering is
      overeengekomen, of,

      b. de schade is vergoed die de instelling lijdt doordat zij in vertrouwen op het voortduren van de overeenkomst
      anders heeft gehandeld dan zij bij vermindering met toepassing van een redelijke termijn zou hebben gedaan.

      2 Het eerste lid is van overeenkomstige toepassing op wijzigingen in de overeenkomst, bedoeld in het eerste lid.

      3 Het eerste lid is niet van toepassing indien de vermindering het gevolg is van een vermindering van de
      rijksbijdrage voor de desbetreffende gemeente voor de desbetreffende periode.
    url: https://wetten.overheid.nl/BWBR0010930/2002-12-07#Artikel4.1.3
  - number: 4.1.4
    text: |-
      1 Voor 1 juli van het jaar volgend op het jaar waarvoor de middelen aan de gemeente worden verstrekt,
      dient de gemeente bij de minister een verantwoording in waaruit blijkt dat de rijksbijdrage, bedoeld in
      [artikel 2.3.1, eerste lid, van de wet][ref1], door de gemeente in het betreffende jaar rechtmatig is besteed dan
      wel verplicht. Indien de activiteiten als bedoeld in [artikel 4.1.2, vierde lid][ref2], waarvoor de gemeente zich
      heeft verplicht, niet of niet volledig door de instellingen zijn geleverd en de gemeente uit dien hoofde in enig
      jaar aanspraken heeft jegens de instelling, besteedt de gemeente de middelen die voortvloeien uit deze aanspraken,
      uiterlijk in het jaar volgend op het jaar waarin die middelen zijn terugontvangen, en verantwoordt de gemeente die
      middelen in het jaar volgend op het jaar waarin de middelen zijn besteed.

      2 De verantwoording gaat vergezeld van een verklaring omtrent de getrouwheid afgegeven door een door de gemeente
      aangewezen accountant, bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3]. Bij de
      aanwijzing van de accountant bedingt het bevoegd gezag dat aan de minister op diens verzoek inzicht wordt geboden
      in de controlerapporten van de accountant.

      3 Ten behoeve van de verklaring van de accountant wordt door de minister een controleprotocol opgesteld.

      4 De minister kan tot uiterlijk 1 juli van het jaar waarvoor de middelen aan de gemeente worden verstrekt, nadere
      regels stellen ten aanzien van de rekening en verantwoording.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0010930#Artikel4.1.2
