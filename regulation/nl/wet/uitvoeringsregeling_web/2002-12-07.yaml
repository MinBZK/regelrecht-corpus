  - number: 2.1.1
    text: |-
      1 In overeenstemming met het desbetreffende onderdeel van de rijksbegroting die is vastgesteld voor het
      desbetreffende begrotingsjaar, stelt de minister jaarlijks de omvang van het beschikbare budget voor de
      exploitatiekosten respectievelijk voor de huisvestingskosten voor Het Christelijk Instituut voor Doven "Effatha"
      en Het Instituut voor Doven "Sint-Michielsgestel" vast, ten behoeve van het verzorgen van beroepsopleidingen
      als bedoeld in [artikel 12.3.8 van de wet][ref1]. Deze budgetten worden jaarlijks toegevoegd aan de landelijk
      beschikbare budgetten voor de exploitatiekosten respectievelijk de huisvestingskosten voor het beroepsonderwijs als
      bedoeld in [artikel 2.1.3 van het besluit][ref2].

      2 De [artikelen 2.2.1 tot en met 2.2.5][ref3] en [artikel 2.4.1 van het besluit][ref4] zijn van toepassing ten
      aanzien van de in het eerste lid genoemde instituten.

      3 De minister verhoogt de uitkomst van de berekening, bedoeld in het tweede lid, tot de hoogte van het totaal van
      de rijksbijdragen voor 1999, berekend op grond van de artikelen 9, 14b en 14i van de Overgangsregeling bekostiging
      beroepsonderwijs WEB tot 2000 en de Regeling bekostiging huisvesting BVE-sector.


