  - number: 3.3.4
    text: |-
      1 De minister brengt op de rijksbijdrage van een instelling voor een kalenderjaar een bedrag in mindering volgens
      de volgende formule:








                    *(PI + InbI + EduI)*


                    x (A + B + C + D)




                    (PL + InbL + EduL)






      In deze formule wordt verstaan onder:

      A: de kosten van de uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel van de instellingen
      voortvloeiend uit een ontslag dat is geëffectueerd voor 1 augustus 1995;

      B: de kosten van de uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel van de instellingen
      voortvloeiend uit een ontslag dat is geëffectueerd in de periode tussen 31 juli 1995 en 1 augustus 1998 en waarvoor
      de rechtspersoon, bedoeld in [artikel 4.4.2 van de wet][ref1], zoals luidend op 31 juli 1998, heeft ingestemd
      op grond van [artikel 2.5.8, derde lid, van de wet][ref2], zoals luidend op 31 juli 1998, met het ten laste van
      bedoelde rechtspersoon brengen van de kosten van deze uitkeringen;

      C: 40% van de kosten van de uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel van de
      instellingen voortvloeiend uit een ontslag dat is geëffectueerd op of na 1 augustus 1998;

      D: 100% van de kosten van de uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel
      van een instelling die de taken beëindigt, anders dan op grond van een samenvoeging als bedoeld in
      [artikel 2.1.3, tweede lid onderdeel b, van de wet][ref3] of een bestuursoverdracht dan wel een splitsing als
      bedoeld in [artikel 9.1.3 van de wet][ref4], indien het bevoegd gezag van deze instelling niet tevens een andere
      instelling onder zijn bestuur heeft.

      2 Vervolgens worden door de minister op de rijksbijdrage van een instelling voor een kalenderjaar in mindering
      gebracht:

      a. de kosten van de uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel van de instelling
      voortvloeiend uit een ontslag dat is geëffectueerd in de periode tussen 1 augustus 1995 en 31 juli 1998 en waarvoor
      de rechtspersoon, bedoeld in [artikel 4.4.2 van de wet][ref5], zoals luidend op 31 juli 1998, niet heeft ingestemd
      op grond van [artikel 2.5.8, derde lid, van de wet][ref6], zoals luidend op 31 juli 1998, met het ten laste van
      bedoelde rechtspersoon brengen van de kosten van deze uitkeringen, en

      b. 60% van de kosten van de uitkeringen in het desbetreffende kalenderjaar van gewezen personeel van de instelling
      voortvloeiend uit een ontslag dat op of na 1 augustus 1998 is geëffectueerd.

      3 De uitkomsten van de in het eerste en tweede lid bedoelde berekeningen worden rekenkundig afgerond op twee
      cijfers achter de komma.


