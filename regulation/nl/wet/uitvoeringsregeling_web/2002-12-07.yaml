  - number: 3.1.1
    text: |-
      1 Het bedrag ten behoeve van de huisvestingskosten, bedoeld in [artikel 2.4.1, tweede lid, van het besluit][ref1],
      bedraagt ƒ 1.026,- per leerling aan een school voor voortgezet onderwijs als bedoeld in
      [deel I van de Wet op het voortgezet onderwijs][ref2].

      2 Het bedrag ten behoeve van de huisvestingskosten, bedoeld in [artikel 2.4.1, derde lid, van het besluit][ref3],
      bedraagt ƒ 1.010,- per leerling aan het voorbereidend beroepsonderwijs verzorgd aan een agrarisch opleidingscentrum
      als bedoeld in [artikel 1.3.3 van de wet][ref4].

      3 De bedragen, bedoeld in het eerste en tweede lid, kunnen worden aangepast in verband met uit de rijksbegroting
      voortvloeiende maatregelen.


