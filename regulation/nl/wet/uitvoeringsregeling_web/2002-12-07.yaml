  - number: 3.1.3
    text: |-
      1 In afwijking van artikel 2.2.2, vierde lid, van de wet stelt de minister jaarlijks het landelijk beschikbare
      budget vast ten behoeve van de kosten voor gehandicapte deelnemers voor het beroepsonderwijs voor:

      a. de instellingen, bedoeld in de artikelen 1.3.1 van de wet, met uitzondering van een agrarisch opleidingscentrum
      als bedoeld in artikel 1.3.3 van de wet;

      b. de instituten, bedoeld in artikel 12.3.8 van de wet;

      c. de hogescholen, bedoeld in artikel 12.3.9 van de wet, gezamenlijk.

      2 De minister verdeelt het voor een kalenderjaar vastgestelde budget ten behoeve van de gehandicapte deelnemers
      over de instellingen, bedoeld in het tweede lid, naar rato van het totaal van de voor dat kalenderjaar op grond van
      de artikelen 2.2.3 en 2.2.4 van het besluit, berekende rijksbijdrage voor die instelling.
    url: https://wetten.overheid.nl/BWBR0010930/2002-12-07#Artikel3.1.3
  - number: 3.2.1
    text: |-
      1 De gegevens ten behoeve van de bekostiging van het jaar 2000, bedoeld in
      [artikel 6.1.1, eerste en vierde lid, van het besluit][ref1] worden, voor zover het diploma's van opleidingen
      beroepsbegeleidend onderwijs betreft, niet zijnde opleidingen op het gebied van de landbouw en de natuurlijke
      omgeving, vastgesteld in [bijlage 1][ref2] bij deze regeling.

      2 De gegevens ten behoeve van de bekostiging voor het jaar 2001, bedoeld in
      [artikel 6.1.1, eerste en vierde lid, van het besluit][ref3] worden, voorzover het diploma's van opleidingen
      beroepsbegeleidend onderwijs betreft, niet zijnde opleidingen op het gebied van de landbouw en de natuurlijke
      omgeving, vastgesteld in [bijlage 8][ref4] bij deze regeling.


