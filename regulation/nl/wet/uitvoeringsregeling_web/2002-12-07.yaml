    text: |-
      1 Op grond van [artikel 6.1.1, derde lid, van het besluit][ref1] worden de prijsfactoren, deeltijdfactoren en
      het niveau van de beroepsopleidingen op het gebied van de landbouw en de natuurlijke omgeving, vastgesteld in
      [bijlage 2a][ref2] bij deze regeling.

      2 Op grond van [artikel 6.1.1, derde lid, van het besluit][ref3] worden de prijsfactoren, deeltijdfactoren en het
      niveau van de overige beroepsopleidingen, vastgesteld in [bijlage 2b][ref4] bij deze regeling.


