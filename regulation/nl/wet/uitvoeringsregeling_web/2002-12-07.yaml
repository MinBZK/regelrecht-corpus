  - number: '5.3'
    text: |-
      1 In afwijking van [artikel 4.2.5, tweede lid, van het besluit][ref1] wordt, onverminderd het achtste lid, het
      aantal normatieve bpv-plaatsen:

      a. ten aanzien van de beroepsbegeleidende leerweg berekend door het aantal deelnemers dat op 1 oktober 1998 als
      daadwerkelijk schoolgaand stond ingeschreven in de beroepsbegeleidende leerweg en waarvoor een overeenkomst als
      bedoeld in [artikel 7.2.8, tweede lid, van de wet][ref2] is afgesloten, op te tellen bij het aantal leerlingen
      dat op 1 oktober 1998 als daadwerkelijk schoolgaand stond ingeschreven aan de opleidingen bbo als bedoeld in
      [artikel 12.3.24, eerste lid, onderdeel b, van de wet][ref3];

      b. ten aanzien van de beroepsopleidende leerweg berekend door het aantal voltijds deelnemers in de
      beroepsopleidende leerweg en het aantal voltijds leerlingen van de opleidingen mbo, als bedoeld in
      [artikel 12.3.24, eerste lid, onderdeel b, van de wet][ref4], dat op 1 oktober 1998 als daadwerkelijk schoolgaand
      stond ingeschreven, vermenigvuldigd met 35%, op te tellen bij het aantal deeltijds deelnemers en het aantal
      leerlingen dat op 1 oktober 1998 als daadwerkelijk schoolgaand stond ingeschreven aan de beroepsopleidende leerweg
      respectievelijk de opleidingen deeltijds mbo, vermenigvuldigd met 10%.

      2 In afwijking van [artikel 4.2.7, tweede lid, onderdeel c][ref5], en [artikel 4.2.8 van het besluit][ref6] wordt
      het aantal leerbedrijven voor elk landelijk orgaan in de beroepsbegeleidende leerweg vastgesteld door het op grond
      van [artikel 5.4][ref7] opgegeven aantal erkende leerbedrijven op 1 oktober 1999 te delen door het totaal aantal
      normatieve bpv-plaatsen, bedoeld in het eerste lid, van dat landelijk orgaan en de uitkomst te vermenigvuldigen met
      het aantal normatieve bpv-plaatsen in de beroepsbegeleidende leerweg, bedoeld in het eerste lid, onderdeel a, van
      dat landelijk orgaan.

      3 In afwijking van [artikel 4.2.7, tweede lid, onderdeel d][ref8], en [artikel 4.2.8 van het besluit][ref9] wordt
      het aantal leerbedrijven voor elk landelijk orgaan in de beroepsopleidende leerweg vastgesteld door het op grond
      van [artikel 5.4][ref10] opgegeven aantal erkende leerbedrijven op 1 oktober 1999 te delen door het totaal aantal
      normatieve bpv-plaatsen, bedoeld in het eerste lid, van dat landelijk orgaan, en de uitkomst te vermenigvuldigen
      met het aantal normatieve bpv-plaatsen in de beroepsopleidende leerweg, bedoeld in het eerste lid onderdeel b, van
      dat landelijk orgaan.

      4 Een landelijk orgaan kan schriftelijk verzoeken om berekening van het aantal normatieve bpv-plaatsen als bedoeld
      in het eerste lid, onderdeel a, aan de hand van:

      a. het aantal praktijkovereenkomsten zoals vermeld op het formulier bedoeld in het vijfde lid in plaats van het
      aantal deelnemers bedoeld in het eerste lid, onderdeel a; of

      b. het aantal door hem afgesloten leerovereenkomsten, zoals vermeld op het door de minister vastgestelde en door
      de accountant van het landelijk orgaan gecontroleerde formulier betreffende de telling leerovereenkomsten en
      leerbedrijven 1998/1999 in plaats van het aantal leerlingen als bedoeld in het eerste lid, onderdeel a.

      5 Een landelijk orgaan maakt voor het in het vierde lid, onderdeel a, bedoelde verzoek gebruik van het door de
      minister bij brief kenmerk IGP/GGV-2000/195927 M van 12 oktober 2000 voor het desbetreffende landelijk orgaan
      vastgestelde formulier en voorziet dit van een verklaring omtrent de getrouwheid van de gegevens door een
      accountant als bedoeld in [artikel 393, eerste lid, Boek 2 van het Burgerlijk Wetboek][ref11].

      6 Een landelijk orgaan maakt in het, in het vierde lid onder b, bedoelde verzoek aannemelijk dat de in het eerste
      lid, onderdeel a, bedoelde leerlinggegevens niet volledig overeenkomen met de door het landelijk orgaan verrichte
      werkzaamheden.

      7 De in het vierde lid bedoelde verzoeken dienen zo snel mogelijk doch uiterlijk op 10 november 2000 in het bezit
      van de minister te zijn.

      8 a. Indien het verzoek, bedoeld in het vierde lid onder a, voldoet aan de bij dit artikel gestelde voorwaarden,
      berekent de minister het aantal normatieve bpv-plaatsen aan de hand van het aantal deelnemers met een
      praktijkovereenkomst op 1 oktober 1998, zoals vermeld op het formulier genoemd in het vijfde lid, in plaats van het
      aantal deelnemers als bedoeld in het eerste lid, onderdeel a.

      b. Indien het verzoek, bedoeld in het vierde lid onder b, voldoet aan de bij dit artikel gestelde voorwaarden,
      berekent de minister het aantal normatieve bpv-plaatsen aan de hand van het aantal leerlingen met een
      leerovereenkomst op 31 oktober 1998, 31 december 1998 respectievelijk 1 april 1999, vermenigvuldigd met 25%, 50%
      respectievelijk 25% in plaats van het aantal leerlingen als bedoeld in het eerste lid, onderdeel a.


