  - number: 6.5.1
    text: |-
      1 In aanvulling op [artikel 6.1.3, eerste lid, van het besluit][ref1] wordt artikel 8 van de Regeling bekostiging
      huisvesting bve-sector uitsluitend betrokken bij de berekening van het bedrag voor de huisvestingskosten voor het
      betreffende kalenderjaar, indien:

      a. het bevoegd gezag voor 15 februari van het betreffende jaar een aanvraag indient bij de minister voor een
      aanvullende vergoeding;

      b. het verzoek wordt ingediend door het bevoegd gezag van een instelling ten aanzien waarvan in 1997 een aanvraag
      is gehonoreerd op grond van artikel 7 van de Regeling bekostiging huisvesting bve-sector, zoals luidend op 19
      december 1997 dan wel afgewezen op grond van artikel 7, tweede lid, onderdeel c, van die regeling;

      c. het een aanvraag betreft in verband met de huurpenningen voor een schoolgebouw die door het bevoegd gezag
      verschuldigd zijn op grond van een huurovereenkomst die door het bevoegd gezag, dan wel diens rechtsvoorganger,
      voor 1 januari 1997 is gesloten:

      a. zonder uitdrukkelijke instemming van de minister, blijkend uit een beschikking, of

      b. voor een langere duur dan wel onder andere voorwaarden dan waarvoor door de minister instemming, blijkend uit
      een beschikking, is verleend.

      2 Een aanvraag als bedoeld in het eerste lid, wordt slechts gehonoreerd indien het bevoegd gezag naar het oordeel
      van de minister aannemelijk heeft gemaakt dat:

      a. dit bevoegd gezag, dan wel diens rechtsvoorganger, gelet op de eigen taak, positie en verantwoordelijkheid in
      redelijkheid geen verwijt te maken valt over de ontstane situatie,

      b. dit bevoegd gezag al het mogelijke in het werk stelt om de betreffende huurovereenkomst binnen afzienbare tijd
      geheel of gedeeltelijk te ontbinden, dan wel op te zeggen, dan wel de gevolgen van de overeenkomst te wijzigen, en

      c. de onder zijn beheer staande instelling, zonder een aanvullende vergoeding, bedoeld in het eerste lid, in
      zodanige financiële omstandigheden komt te verkeren dat het voortbestaan van de instelling in het geding komt.

      3 Bij de aanvraag, bedoeld in het eerste lid, geeft het bevoegd gezag tevens aan op welk schoolgebouw,
      respectievelijk welke schoolgebouwen, de door hem, dan wel diens rechtsvoorganger, gesloten huurovereenkomst
      betrekking heeft, alsmede het aantal vierkante meters brutovloeroppervlak en de verschuldigde huursom per jaar
      van dat gebouw. Het bevoegd gezag legt aan de minister een gewaarmerkt afschrift over van de desbetreffende
      huurovereenkomst.

      4 De minister berekent de aanvullende vergoeding volgens de formule:

      Vt = O x (Ht - Nt)

      In deze formule wordt verstaan onder:

      Vt: aanvullende vergoeding van het betreffende kalenderjaar;

      O: vierkante meters brutovloeroppervlak van het gebouw waarvoor de aanvullende vergoeding wordt aangevraagd;

      Ht: huurbedrag per vierkante meter brutovloeroppervlak van het betreffende gebouw;

      Nt: normbedrag huurvergoeding per vierkante meter brutovloeroppervlak in het betreffende kalenderjaar, vastgesteld
      volgens de formule:









                        Nt =


                        *Lt*


                        x N 1999




                        L1999






      In deze formule wordt verstaan onder:

      Lt: landelijk beschikbare budget voor de huisvestingskosten beroepsonderwijs in het betreffende kalenderjaar;

      L1999: landelijk beschikbare budget voor de huisvestingskosten beroepsonderwijs in 1999;

      N1999: normbedrag huurvergoeding per vierkante meter brutovloeroppervlak in 1999, zijnde € 52,90.

      5 Indien de uitkomst van het onderdeel (Ht - Nt) van de formule, bedoeld in het vierde lid, negatief is, wordt het
      verzoek om een aanvullende vergoeding afgewezen.


