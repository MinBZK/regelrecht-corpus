  - number: 4.2.2
    text: |-
      De rijksbijdrage, bedoeld in [artikel 2.3.1, eerste lid, van de wet][ref1], per gemeente kan binnen een periode van
      vijf jaren na de vaststelling door de minister worden ingetrokken of ten nadele van de gemeente worden gewijzigd op
      de volgende gronden:

      a. handelen in strijd met de wettelijke voorschriften dan wel met de verplichtingen of voorwaarden die op grond van
      wettelijke regels zijn verbonden aan de rijksbijdrage bedoeld in de aanhef;

      b. handelen in strijd met het controleprotocol, bedoeld in [artikel 4.1.4, derde lid][ref2], of met de doelstelling
      van de rijksbijdrage, bedoeld in [artikel 1.2.1, eerste lid, van de wet][ref3];

      c. indien de vaststelling van de rijksbijdrage onjuist was en de gemeente dit wist of behoorde te weten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0010930#Artikel4.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1.2.1
