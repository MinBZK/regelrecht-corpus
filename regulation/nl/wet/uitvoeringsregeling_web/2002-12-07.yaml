  - number: 4.1.1
    text: |-
      1 De gemeente kan de rijksbijdrage tezamen met een of meer andere gemeenten besteden.

      2 In geval van samenwerking als bedoeld in het eerste lid, wijzen de samenwerkende gemeenten een gemeente of
      een publiekrechtelijke rechtspersoon als bedoeld in [artikel 8 van de Wet gemeenschappelijke regelingen][ref1]
      aan die namens die gemeenten de rijksbijdrage ontvangt, verantwoordt en waarbij met inachtneming van het
      bepaalde bij of krachtens de wet eventuele opschorting of terugvordering van de rijksbijdrage als bedoeld in de
      [artikelen 4.2.1][ref2] en [4.2.2][ref3], plaatsvindt.

      3 In geval van samenwerking als bedoeld in het eerste lid, ontvangt de minister voor 1 december van het jaar
      voorafgaand aan het jaar waarvoor de middelen aan de gemeente worden verstrekt daarvan een mededeling.

      4 Indien gemeenten de uitkering tezamen met een of meer andere gemeenten besteden, wordt de informatie, bedoeld in
      [artikel 2.3.6 van de wet][ref4], namens die gemeenten gezamenlijk ingediend door de in het tweede lid aangewezen
      gemeente of publiekrechtelijke rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
