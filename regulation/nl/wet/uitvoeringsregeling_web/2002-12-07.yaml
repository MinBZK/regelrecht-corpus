  - number: 2.1.3
    text: |-
      De instituten, bedoeld in [artikel 2.1.1][ref1], nemen voor de beroepsopleidingen verzorgd aan die instituten in
      acht hetgeen bij of krachtens de wet is bepaald ten aanzien van:

      a. de taken van de instellingen ten aanzien van het beroepsonderwijs, bedoeld in [artikel 1.3.5 van de wet][ref2];

      b. de kwaliteitszorg, bedoeld in [artikel 1.3.6 van de wet][ref3];

      c. de contractactiviteiten, bedoeld in [artikel 1.7.1 van de wet][ref4];

      d. de voorschriften betreffende het personeel van de instellingen, bedoeld in de [titels 1][ref5] en
      [2 van hoofdstuk 4 van de wet][ref6];

      e. de voorschriften betreffende ontneming van van rechten ten aanzien van bestaand onderwijsaanbod, bedoeld in
      [artikel 6.1.4 van de wet][ref7] en ten aanzien van onthouding van rechten ten aanzien van voorgenomen onderwijs
      uit oogpunt van kwaliteit of niet naleving wettelijke voorschriften, bedoeld in [artikel 6.1.6 van de wet][ref8];

      f. de voorschriften betreffende de beëindiging van registratie van beroepsopleidingen, bedoeld in
      [artikel 6.4.4 van de wet][ref9];

      g. het onderwijs en de examens betreffende het beroepsonderwijs, bedoeld in [hoofdstuk 7 van de wet][ref10], met
      dien verstande dat bij de toepassing van:

      1. [artikel 7.2.8 van de wet][ref11] het bevoegd gezag van een instituut tevens met het oog op de handicap van de
      deelnemer nadere regels kan vaststellen ten aanzien van de beroepspraktijkvorming;

      2. het eerste lid van [artikel 7.4.2 van de wet][ref12] het bevoegd gezag van een instituut er tevens zorg voor
      draagt dat bij het afleggen van het examen rekening wordt gehouden met de aard van de handicap van de deelnemer;

      h. de rechtsbescherming van de deelnemer, bedoeld in [titel 5 van hoofdstuk 7 van de wet][ref13];

      i. de inschrijving en vooropleidingseisen van [hoofdstuk 8 van de wet][ref14], met dien verstande dat bij de
      toepassing van [artikel 8.1.3, derde lid, van de wet][ref15] tevens de wederzijdse rechten en verplichtingen van
      het instituut en de deelnemer die voortvloeien uit de specifieke handicap van de deelnemer, worden opgenomen;

      j. de opneming in het Centraal register;

      k. de voorschriften inzake bestuur en bestuursoverdracht, bedoeld in
      [paragraaf 1 van titel 1 van hoofdstuk 9 van de wet][ref16];

      l. de [hoofdstukken 10][ref17] en [11 van de wet][ref18].


