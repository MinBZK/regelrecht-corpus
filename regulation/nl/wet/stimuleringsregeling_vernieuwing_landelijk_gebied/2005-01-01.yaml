  - number: '25'
    text: |-
      Eén jaar na inwerkingtreding en voorts iedere drie jaar wordt een verslag gepubliceerd over de doeltreffendheid en
      de effecten van de subsidie in de praktijk.
    url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#Artikel25
