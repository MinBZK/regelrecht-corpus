  - number: '16'
    text: |-
      1 De aanvraag tot subsidievaststelling wordt binnen vier maanden na afloop van het project ingediend bij Dienst
      Regelingen, op een daartoe vastgesteld formulier.

      2 De aanvraag tot subsidievaststelling gaat vergezeld van:

      a. een activiteitenverslag dat ten minste bestaat uit een beschrijving van:

        - de mate waarin de activiteiten hebben bijgedragen aan de in het projectplan omschreven doelstellingen;
        - de kennis en informatie die bij het project zijn opgedaan, en
        - de wijze waarop deze kennis en informatie openbaar is of zal worden gemaakt;

      b. een financieel verslag, bestaande uit een rekening en een verklaring van een accountant of een accountant-
      administratieconsulent als bedoeld in artikel 2:393, eerste lid, van het Burgerlijk Wetboek, waaruit blijkt dat is
      voldaan aan de in deze regeling gestelde voorwaarden en verplichtingen.

      3 De accountant of accountant-administratieconsulent, bedoeld in het tweede lid, onderdeel b, controleert met
      inachtneming van het in de bijlage bij deze regeling opgenomen controleprotocol.
    url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#Artikel16
  - number: '17'
    text: De minister geeft een beschikking tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#Artikel17
  - number: '21'
    text: |-
      1 De minister kan de subsidieontvanger op diens verzoek ten hoogste eenmaal per zes maanden voorschotten verlenen.

      2 Het totaal van de verleende voorschotten kan nooit meer bedragen dan 80 % van het bedrag waarop de subsidie
      overeenkomstig de beschikking tot subsidieverlening ten hoogste kan worden vastgesteld.

      3 De aanvraag tot de beschikking tot voorschotverlening gaat vergezeld van een overzicht van de
      liquiditeitsbehoefte.
    url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#Artikel21
  - number: '24'
    text: |-
      1

      Indien toepassing wordt gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref1] of
      [artikel 6, tweede lid, van de Kaderwet LNV-subsidies][ref2], worden de terug te vorderen bedragen vermeerderd met
      de wettelijke rente over de periode vanaf het moment van uitbetaling tot aan het moment van algehele voldoening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel457
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel6
