preamble:
  text: |-
    Gelet op artikel 12, vijfde lid, van Verordening (EEG) nr. 2328/91 van de Raad van 15 juli 1991, betreffende de
    verbetering van de doeltreffendheid van de landbouwstructuur;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: Minister van Landbouw, Natuurbeheer en Visserij;

      b. innovatieproject: samenhangend geheel van activiteiten gericht op vernieuwingen en vernieuwingsprocessen, met
      inbegrip van de eerste toepassingen op praktijkschaal, in het landelijk gebied;

      c. rechtspersonen: privaatrechtelijke rechtspersonen, met uitzondering van rechtspersonen die zijn opgericht door
      of vanwege de overheid, niet zijnde openbare nutsbedrijven;

      d. landbouwbedrijf: geheel van productie-eenheden in Nederland bestaande uit één of meer gebouwen of gedeelten
      daarvan en daarbij behorende landbouwgrond, uitsluitend of onder meer dienende tot de uitoefening van de landbouw.
    url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#Artikel1
  - number: '2'
    text: |-
      1 De minister kan ter stimulering van de vernieuwing van het landelijk gebied in Nederland op aanvraag subsidie
      verlenen voor innovatieprojecten die:

      a. vanuit landelijk perspectief een voorbeeldfunctie hebben op het gebied van natuur, recreatie, bos, landschap of
      cultuurhistorie, al dan niet in relatie tot de agrarische bedrijfsvoering;

      b. bijdragen aan de sociaal-economische versterking van het landelijk gebied, aan de verbetering van de samenhang
      tussen stedelijk en landelijk gebied of aan vernieuwingen in het beheer van bos, natuur en landschap door
      natuurlijke personen en rechtspersonen die een landbouw- of bosbouwbedrijf uitoefenen; en

      c. een duur van ten hoogste vijf jaren hebben.

      2 De subsidieverlening wordt geweigerd voor innovatieprojecten:

      a. met de uitvoering waarvan een aanvang is gemaakt alvorens de ontvangst van de aanvraag schriftelijk aan de
      aanvrager is bevestigd;

      b. die gericht zijn op de productie, be- of verwerking van of het handelen in producten afkomstig uit de landbouw,
      bosbouw of visserij.
    url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#Artikel2
  - number: '3'
    text: |-
      1 De minister stelt ieder begrotingsjaar of per aanvraagperiode een subsidieplafond vast voor op grond van deze
      regeling te verstrekken subsidies. Hij geeft hiervan kennis in de Staatscourant.

      2 De minister voorziet in een gelijktijdige beslissing op aanvragen met betrekking tot soortgelijke projecten op
      basis van een vergelijking van hun geschiktheid om bij te dragen aan de doelstellingen van de subsidie.
    url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#Artikel3
  - number: '4'
    text: |-
      1 De minister kan voor innovatieprojecten als bedoeld in [artikel 2][ref1] een subsidie verlenen aan:

      a. natuurlijke of rechtspersonen of

      b. geen rechtspersoonlijkheid bezittend samenwerkingsverband van natuurlijke of rechtspersonen dat voor
      gezamenlijke rekening en risico een innovatieproject uitvoert.

      2 De subsidieverlening wordt geweigerd aan organisaties die overwegend zijn gericht op onderzoek, scholing,
      opleiding, voorlichting, advies of begeleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0008661#Artikel2
    url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008661
        artikel: '2'
        paragraaf: '2'
  - number: '5'
    text: |-
      1 Als subsidiabele kosten worden uitsluitend in aanmerking genomen kosten die tijdens de looptijd van een project
      worden gemaakt, waarbij het totale subsidiebedrag ten minste € 9.075,60 en ten hoogste € 453.780,22 per project
      bedraagt.

      2 Als subsidiabele kosten worden voorts uitsluitend in aanmerking genomen:

      a. de volgende, door de aanvrager aantoonbaar gemaakte en betaalde kosten, voorzover zij noodzakelijk zijn en
      rechtstreeks zijn toe te rekenen aan de onderdelen van het project waarop de beschikking tot subsidieverlening,
      bedoeld in [artikel 11][ref1], betrekking heeft:

        - loonkosten van het direct bij de uitvoering van het project betrokken personeel, berekend op basis van het
      brutojaarloon volgens de verzamelloonlijst van de betrokken medewerkers, exclusief volledige winstafhankelijke
      uitkeringen, verhoogd met de wettelijke dan wel op grond van een collectieve arbeidsovereenkomst verschuldigde
      opslagen voor sociale lasten, te delen door 1600;
        - de loonkosten van het leidinggevend en toezichthoudend personeel, berekend op de wijze van het eerste streepje,
      indien de aanvrager minder dan 10 werknemers heeft;
        - de kosten van aangeschafte machines en apparatuur, gebaseerd op de historische aanschafprijzen, of de aan het
      project toe te rekenen lease-termijnen, exclusief financieringskosten en winstopslagen bij transacties binnen
      een groep, tot een maximum van 50% van de historische aanschafprijzen of van de in totaal verschuldigde lease-
      termijnen;
        - kosten van verbruikte materialen en hulpmiddelen, gebaseerd op historische aanschafprijzen, exclusief
      winstopslagen bij transacties binnen een groep;
        - kosten verbonden aan het verwerven van onroerende zaken indien die kosten noodzakelijk zijn voor het aanbrengen
      van voorzieningen of voor inrichtingsactiviteiten van het project, tot een maximum van 50% van de totale
      subsidiabele kosten;
        - aan derden verschuldigde kosten voor planvorming indien deze een integraal onderdeel vormen van het project, tot
      een maximum van 25% van de totale subsidiabele kosten;
        - aan derden verschuldigde kosten ter zake van studies en onderzoeksactiviteiten en ter zake van de verwerving
      van kennis en intellectuele eigendomsrechten alsmede ter zake van de bescherming van die rechten, exclusief
      winstopslagen bij transacties binnen een groep;
        - kosten voor voorlichting over het project tot een maximum van 10% van de totale subsidiabele kosten; en
        - reis- en verblijfkosten en kosten van deelname aan symposia tot een maximum van 15% van de in het eerste streepje
      bedoelde loonkosten;
        - kosten voor uitvoering van het project door derden;

      b. een forfaitaire opslag voor de algemene kosten van 20% van de in onderdeel a, aanhef en onder het eerste
      streepje, bedoelde loonkosten, indien de aanvrager 10 of meer werknemers in dienst heeft.

      3 Indien de aanvrager op het tijdstip van de aanvraag tot subsidieverlening geen of minder dan 10 werknemers in
      dienst heeft, komen de kosten voor de door de aanvrager ten behoeve van het project verrichte arbeid in aanmerking
      voor een vergoeding van € 18,15 per uur.

      4 Eveneens als subsidiabele kosten worden, tot een maximum van € 11.344,51 in aanmerking genomen de kosten,
      bedoeld in het tweede lid, onderdeel a, onder het zevende streepje, ter voorbereiding van een aanvraag tot
      subsidieverlening als bedoeld in [artikel 8][ref2], indien:

      a. de aanvrager op het tijdstip van de aanvraag tot subsidieverlening minder dan 25 werknemers in dienst heeft en

      b. de aanvraag tot subsidieverlening is gevolgd door een beschikking tot subsidieverlening als bedoeld in
      [artikel 11][ref3].

      5 De kosten worden in aanmerking genomen met inbegrip van de verschuldigde omzetbelasting, indien de aanvrager
      omzetbelasting niet kan verrekenen met door hem af te dragen omzetbelasting.

      6 Eveneens als subsidiabele kosten worden in aanmerking genomen naar het oordeel van de minister onvoorziene kosten
      tot een maximum van 5% van de in het tweede en derde lid bedoelde subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0008661#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008661#Artikel8
