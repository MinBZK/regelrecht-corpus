  - number: '6'
    text: |-
      1 De subsidie bedraagt 75% van de subsidiabele kosten of zoveel minder als door de aanvrager wordt aangegeven bij
      de aanvraag tot subsidieverlening.

      2 In afwijking van het eerste lid bedraagt de subsidie 35% en 20% voor onroerende respectievelijk roerende zaken
      van de kosten, bedoeld in [artikel 5, tweede lid, onderdeel a][ref1], aanhef en derde en vijfde streepje, voor
      innovatieprojecten voorzover die investeringen op landbouwbedrijven inhouden.

      3 Indien voor de subsidiabele kosten of een gedeelte daarvan uit anderen hoofde subsidie is of zal worden
      verstrekt, wordt slechts een zodanig bedrag aan subsidie op grond van deze regeling verstrekt dat de som van de
      subsidies de in het eerste en tweede lid genoemde percentages niet overschrijdt.

      4 In afwijking van het derde lid wordt, indien voor de subsidiabele kosten, bedoeld in het eerste lid, of een
      gedeelte daarvan door een ander bestuursorgaan dan de minister, subsidie is of zal worden verstrekt, slechts een
      zodanig bedrag aan subsidie op grond van deze regeling verstrekt dat de som van de subsidies niet meer bedraagt dan
      90% van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0008661#Artikel5
    url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008661
        artikel: '5'
        paragraaf: '2'
  - number: '7'
    text: |-
      1 De minister kan per kalenderjaar één of meer aanvraagperioden vaststellen.

      2 De minister kan per kalenderjaar of per aanvraagperiode bepalen dat slechts voor bepaalde categorieën
      innovatieprojecten een aanvraag tot subsidieverlening kan worden ingediend.

      3 De minister kan nader bepalen dat bij de beoordeling, bedoeld in [artikel 10, eerste lid][ref1], prioriteit wordt
      gegeven aan bepaalde categorieën innovatieprojecten.

      4 De minister maakt de besluiten, bedoeld in het eerste tot en met het derde lid, bekend in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0008661#Artikel10
    url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008661
        artikel: '10'
        paragraaf: '3'
  - number: '8'
    text: |-
      1 De aanvraag tot subsidieverlening voor innovatieprojecten wordt ingediend bij Dienst Regelingen, op een daartoe
      vastgesteld formulier.

      2 De aanvraag tot subsidieverlening gaat vergezeld van:

      a. in voorkomend geval, het aan het samenwerkingsverband ten grondslag liggende samenwerkingscontract, met daarin
      in elk geval een overzicht van de aan het samenwerkingsverband deelnemende natuurlijke en rechtspersonen alsmede
      van de verdeling van de verantwoordelijkheden, bevoegdheden en financiële verplichtingen tussen de verschillende
      deelnemers;

      b. een projectplan, inhoudende een beschrijving van de doelstellingen en achtergronden van het project, de
      activiteiten, een tijdsplanning van de activiteiten en de wijze van uitvoering; en

      c. een begroting van de kosten en een opgave van de financieringswijze van het project.
    url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#Artikel8
  - number: '9'
    text: |-
      1 Er is een onafhankelijke Beoordelingscommissie vernieuwing landelijk gebied, die tot taak heeft de haar daartoe
      voorgelegde aanvragen tot subsidieverlening overeenkomstig [artikel 10][ref1] te beoordelen en hierover advies uit
      te brengen aan de minister.

      2 De beoordelingscommissie bestaat uit een voorzitter, tevens lid, en ten minste drie doch ten hoogste twaalf
      leden.

      3 De minister benoemt op basis van hun specifieke kennis en deskundigheid de voorzitter en de leden van de
      beoordelingscommissie voor een termijn van drie jaar. Ze zijn te allen tijde opnieuw benoembaar.

      4 De beoordelingscommissie stelt haar werkwijze vast.

      5 Het secretariaat wordt gevoerd door door de minister aan te wijzen ambtenaren van het Ministerie van Landbouw,
      Natuurbeheer en Visserij.


      [ref1]: https://wetten.overheid.nl/BWBR0008661#Artikel10
    url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008661
        artikel: '10'
        paragraaf: '3'
  - number: '10'
    text: |-
      1 De beoordelingscommissie beoordeelt in welke mate het innovatieproject:

      a. een innovatief karakter heeft;

      b. door samenwerking de betrokkenheid en de participatie van meerdere actoren stimuleert; en

      c. een uitstralingseffect kan hebben voor toepassing door anderen.

      2 De beoordelingscommissie kan de minister adviseren een aanvraag tot subsidieverlening geheel of gedeeltelijk af
      te wijzen.

      3 De beoordelingscommissie brengt na de beoordeling van de innovatieprojecten, advies uit aan de minister in
      de vorm van een rangschikking van de aanvragen waarover de commissie ingevolge het tweede lid niet afwijzend
      adviseert, waarbij aanvragen:

      a. hoger worden gerangschikt naarmate ze naar het oordeel van de beoordelingscommissie meer voldoen aan de in het
      eerste lid bedoelde criteria en

      b. die in gelijke mate aan de in het eerste lid bedoelde criteria voldoen, hoger worden gerangschikt indien ze
      voldoen aan de door de minister ingevolge [artikel 7, derde lid][ref1], vastgestelde prioriteiten of naarmate de
      eigen financiële bijdrage aan het innovatieproject procentueel hoger is.


      [ref1]: https://wetten.overheid.nl/BWBR0008661#Artikel7
    url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008661
        artikel: '7'
        paragraaf: '3'
  - number: '11'
    text: |-
      1 De minister beslist op de aanvragen die in de betrokken aanvraagperiode zijn ingediend. De minister beslist,
      gezien het advies van de beoordelingscommissie, gelijktijdig op de aanvragen die van een dergelijk advies zijn
      voorzien.

      2 De minister geeft de beschikking tot subsidieverlening binnen vijf maanden na afloop van de aanvraagperiode
      waarin de aanvraag tot subsidieverlening is ingediend. Indien deze termijn niet kan worden gehaald, stelt de
      minister de aanvrager daarvan in kennis en noemt hij daarbij een redelijke termijn waarop de beschikking tegemoet
      kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#Artikel11
  - number: '13'
    text: |-
      De subsidieverlening kan worden geweigerd indien een gegronde reden bestaat om aan te nemen dat de financiering van
      het project niet toereikend zal zijn.
    url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#Artikel13
  - number: '14'
    text: |-
      1 De subsidieontvanger voert het project uit:

      a. overeenkomstig het projectplan waarop de beschikking tot subsidieverlening betrekking heeft, behoudens
      goedgekeurde wijzigingen van het project als bedoeld in het tweede lid en

      b. binnen de in [artikel 2, eerste lid, onderdeel c][ref1], bedoelde periode, waarbij uiterlijk in het jaar volgend
      op het jaar waarin de ontvangst van de aanvraag tot subsidieverlening schriftelijk aan de aanvrager is bevestigd,
      een aanvang wordt gemaakt met de uitvoering.

      2 Wijzigingen in het projectplan gedurende de looptijd van het project zijn toegestaan, mits:

      a. deze geen wijzigingen ten aanzien van de doelstelling van het project betreffen en

      b. deze voorafgaand zijn gemeld aan Dienst Regelingen en zijn goedgekeurd door de minister. De minister deelt
      de subsidieontvanger mede of en in welke mate de wijziging van het projectplan gevolgen heeft voor de verleende
      subsidie of voor de bij de verlening van de subsidie vastgestelde verplichtingen.

      3 Een wijziging als bedoeld in het tweede lid kan geen verhoging tot gevolg hebben van het bedrag van de subsidie
      of het bedrag waarop de subsidie overeenkomstig de beschikking tot subsidieverlening ten hoogste kan worden
      vastgesteld.

      4 Indien de projectduur langer dan één jaar is, rapporteert de subsidieontvanger halverwege de projectduur in
      de vorm van een tussenverslag omtrent de voortgang van het project op een door de minister te bepalen wijze. Dit
      verslag bestaat ten minste uit een beschrijving van:

      a. de activiteiten die tot dan toe in het kader van het project zijn verricht en

      b. de mate waarin deze activiteiten hebben bijgedragen aan de in het projectplan omschreven doelstellingen.

      5 De subsidieontvanger is verplicht de kennis en informatie die met het project worden opgedaan, onmiddellijk na
      afloop van het project openbaar te maken.

      6 De subsidieontvanger is verplicht een administratie te voeren die zodanig is ingericht dat daaruit te allen
      tijde op eenvoudige en duidelijke wijze alle projectkosten kunnen worden afgelezen, gespecificeerd overeenkomstig
      de in [artikel 5, tweede en derde lid][ref2], onderscheiden kostensoorten, met dien verstande dat ter zake
      van de loonkosten en de kosten voor eigen arbeid een door middel van een sluitende tijdschrijving vastgestelde
      urenverantwoording aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0008661#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008661#Artikel5
    url: https://wetten.overheid.nl/BWBR0008661/2005-01-01#Artikel14
