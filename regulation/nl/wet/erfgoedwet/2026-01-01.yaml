  - number: '9.3'
    text: |-
      1 De [Monumentenwet 1988][ref1], zoals die wet luidde voor inwerkingtreding van deze wet, blijft van toepassing op:

      a. de aanwijzing van een monument en de wijziging in het register, indien een adviesaanvraag als bedoeld in
      [artikel 3, tweede lid, van de Monumentenwet 1988][ref2], zoals dat luidde voor inwerkingtreding van deze wet, is
      gedaan voor de datum van inwerkingtreding van deze wet;

      b. een verzoek als bedoeld in [artikel 8, eerste lid, van de Monumentenwet 1988][ref3], zoals dat luidde voor
      inwerkingtreding van deze wet, waar nog niet op is beslist.

      2 Op subsidies verstrekt op grond van [artikel 34 van de Monumentenwet 1988][ref4] blijven de regels van toepassing
      die op de dag voor inwerkingtreding van deze wet op die subsidies van kracht waren.


