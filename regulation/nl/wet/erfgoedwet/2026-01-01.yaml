  - number: '6.13'
    text: |-
      1 De kosten verbonden aan de toepassing van inbewaringneming als bedoeld in [artikel 6.11][ref1], kunnen, indien
      daartoe aanleiding bestaat, bij beschikking van Onze Minister geheel of ten dele ten laste worden gebracht van
      degene die het verbod van [artikel 6.10][ref2] overtreedt.

      2 In elk geval zijn geen kosten verschuldigd indien:

      a. bij uitspraak die in kracht van gewijsde is gegaan, de rechtsvordering, bedoeld in [artikel 6.15][ref3], wordt
      afgewezen dan wel een schadeloosstelling of billijke vergoeding als bedoeld in artikel 6.15, derde lid, wordt
      toegekend; of

      b. Onze Minister definitief van teruggave van het cultuurgoed afziet.

      3 Indien zich een geval als bedoeld in het tweede lid voordoet, nadat Onze Minister een beschikking als bedoeld in
      het eerste lid heeft gegeven, trekt hij deze beschikking in.

      4 De beschikking vermeldt het in rekening te brengen bedrag. Onder de kosten kunnen worden begrepen de kosten
      verbonden aan de voorbereiding van de inbewaringneming.

      5 Onze Minister kan van de overtreder bij dwangbevel de ingevolge de vorige leden verschuldigde kosten, verhoogd
      met de op de invordering vallende kosten, invorderen.

      6 Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale
      titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref4]. Tenuitvoerlegging
      vindt niet plaats zolang het geval, bedoeld in het tweede lid, onder a, zich nog kan voordoen.

      7 Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van Onze
      Minister.

      8 Het verzet schorst de tenuitvoerlegging. Op verzoek van Onze Minister kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel6.11
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel6.10
      [ref3]: https://wetten.overheid.nl/BWBR0037521#Artikel6.15
      [ref4]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel6.13
