  - number: '1.3'
    text: |-
      Onze Minister brengt ten minste eenmaal in de vier jaar een wetenschappelijk rapport uit, waarin de ontwikkeling
      van de staat van het cultureel erfgoed in Nederland wordt beschreven.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel1.3
  - number: '2.1'
    text: |-
      Onze Minister wie het aangaat, een college van staat of een instelling zorgt dat museale cultuurgoederen van de
      Staat in beheer in goede staat zijn.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      Onze Minister wie het aangaat, een college van staat of een instelling bevordert de toegankelijkheid van museale
      cultuurgoederen van de Staat in beheer.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel2.2
  - number: '2.3'
    text: |-
      1 Onze Minister wie het aangaat, een college van staat of een instelling treft maatregelen ter voorkoming van
      diefstal, verlies, beschadiging of vernietiging van museale cultuurgoederen van de Staat in beheer.

      2 Onze Minister wie het aangaat, een college van staat of een instelling meldt de vermissing of het tenietgaan van
      een museaal cultuurgoed van de Staat onverwijld aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel2.3
  - number: '2.4'
    text: |-
      Onze Minister wie het aangaat, een college van staat of een instelling zorgt voor:

      a. registratie van de museale cultuurgoederen van de Staat in beheer; en

      b. beschrijving van de administratieve organisatie van het beheer met inachtneming van deze paragraaf en toepassing
      van de procedures die in de administratieve organisatie zijn vastgelegd.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel2.4
  - number: '2.5'
    text: |-
      Onze Minister wie het aangaat of een college van staat beëindigt het beheer van een museaal cultuurgoed van de
      Staat of het verstrekken van middelen aan een instelling ten behoeve daarvan slechts na overleg met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel2.5
  - number: '2.6'
    text: |-
      1 Onze Minister is belast met het privaatrechtelijk beheer van de museale cultuurgoederen van de Staat.

      2 Onze Minister houdt een lijst bij van alle museale cultuurgoederen van de Staat die aanwezig zijn bij Onze
      Ministers wie het aangaat, de colleges van staat en de instellingen aan wie museale cultuurgoederen van de Staat in
      beheer zijn gegeven.

      3 Onze Minister kan Onze Minister wie het aangaat, een college van staat of een instelling aanwijzingen geven over
      het beheer van museale cultuurgoederen van de Staat.

      4 Onze Minister kan het beheer van een museaal cultuurgoed van de Staat tijdelijk overnemen van Onze Minister wie
      het aangaat, een college van staat of een instelling indien het behoud van het cultuurgoed in gevaar komt.

      5 Onze Minister aanvaardt namens de Staat cultuurgoederen of verzamelingen die zich in Nederland of daarbuiten
      bevinden die voldoen aan de criteria, bedoeld in [artikel 3.7][ref1], voor zover deze onbezwaard, om niet en
      zonder belastende voorwaarden worden overgedragen. Onze Minister draagt vervolgens zorg voor het beheer van deze
      cultuurgoederen of verzamelingen.

      6 Onze Minister kan het vijfde lid buiten toepassing laten of daarvan afwijken voor zover onverkorte toepassing
      daarvan, gelet op daarmee verband houdende kosten, in redelijkheid niet kan worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel3.7
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel2.6
