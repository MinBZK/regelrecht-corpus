  - number: '7.1'
    text: Onze Minister kan ten behoeve van het behoud van cultureel erfgoed subsidie verstrekken.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel7.1
  - number: '7.2'
    text: |-
      Onze Minister verstrekt subsidie aan een instelling die is belast met een taak als bedoeld in [artikel 2.8][ref1]
      voor de zorg voor het beheer van museale cultuurgoederen van de Staat of andere cultuurgoederen.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel2.8
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '2.8'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '7.3'
    text: |-
      1 Onze Minister kan op aanvraag meerjarige subsidie verstrekken voor het normale onderhoud van rijksmonumenten.

      2 Onze Minister kan op aanvraag subsidie verstrekken voor de restauratie van rijksmonumenten.

      3 Onze Minister kan op aanvraag subsidie verstrekken in verband met de herbestemming van monumenten.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel7.3
  - number: '7.4'
    text: |-
      1 Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].

      2 In geval van het niet vervullen van die voorwaarde worden de verleende subsidiebedragen verlaagd tot het
      bedrag van de subsidie dat na de vaststelling of goedkeuring van de begroting ter beschikking staat, een en
      ander naar rato van het aantal subsidieaanvragers aan wie subsidie is verleend en van de hoogte van de verleende
      subsidiebedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '7.5'
    text: |-
      1 Onze Minister kan een of meer subsidieplafonds vaststellen voor de verstrekking van subsidies.

      2 Indien Onze Minister een subsidieplafond vaststelt, wordt tegelijkertijd vermeld op welke wijze het beschikbare
      bedrag wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel7.5
  - number: '7.6'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] wordt ten behoeve van een rijksmonument in
      ieder geval geen subsidie verleend indien voor de werkzaamheden waarvoor subsidie wordt gevraagd een lening op
      grond van [artikel 7.8][ref2] is verstrekt en de werkzaamheden waarvoor de lening is verstrekt nog niet zijn
      afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel435
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel7.8
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:35
      - id: ref2
        bwb_id: BWBR0037521
        artikel: '7.8'
        hoofdstuk: '7'
