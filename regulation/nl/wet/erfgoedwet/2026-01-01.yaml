  - number: '6.14'
    text: |-
      1 De inbewaringneming, bedoeld in [artikel 6.11][ref1], eindigt:

      a. bij teruggave van de cultuurgoederen aan de autoriteiten van het desbetreffende bezet gebied of voorheen bezet
      gebied na toewijzing van een rechtsvordering als bedoeld in [artikel 6.15][ref2];

      b. bij afwijzing van een rechtsvordering tot teruggave als bedoeld in [artikel 6.15][ref3];

      c. bij beschikking van Onze Minister, indien de autoriteiten van het desbetreffende bezet gebied of voorheen bezet
      gebied een door hen ingediend verzoek tot inbewaringneming van cultuurgoederen intrekken, dan wel indien zij bij
      inbewaringneming van cultuurgoederen uit eigen beweging door Onze Minister verklaren geen verzoek tot teruggave van
      cultuurgoederen in te dienen; of

      d. bij beschikking van Onze Minister wegens andere redenen dan bedoeld onder a tot en met c.

      2 Indien de inbewaringneming, bedoeld in [artikel 6.11][ref4], eindigt zonder dat het cultuurgoed wordt
      teruggegeven aan de in het eerste lid, onder a, bedoelde autoriteiten, wordt het afgegeven aan degene die het
      cultuurgoed bij de aanvang van de inbewaringneming onder zich hield, dan wel aan degene die redelijkerwijs als
      rechthebbende kan worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel6.11
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel6.15
      [ref3]: https://wetten.overheid.nl/BWBR0037521#Artikel6.15
      [ref4]: https://wetten.overheid.nl/BWBR0037521#Artikel6.11
