  - number: '8.8'
    text: |-
      1 De ambtenaren, bedoeld in [artikel 8.4, eerste lid, onder a en b][ref1], zijn belast met het op verzoek van een
      lidstaat van de Europese Unie of van een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte opsporen van een door die staat in het verzoek omschreven roerende zaak die krachtens de
      nationale wetgeving van die staat een cultuurgoed is in de zin van artikel 2, onder 1, van [Richtlijn 2014/60]
      (32014L0060)/EU van het Europees parlement en de Raad van 15 mei 2014 betreffende de teruggave van cultuurgoederen
      die op onrechtmatige wijze buiten het grondgebied van een lidstaat zijn gebracht en houdende wijziging van
      Verordening (EU) nr. 1024/2012 (PbEU 2014, L 159), mits die zaak in de zin van die richtlijn op onrechtmatige wijze
      buiten het grondgebied van die staat is gebracht.

      2 Een wijziging van [Richtlijn 2014/60](32014L0060)/EU gaat voor de toepassing van dit artikel gelden met ingang
      van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekend gemaakt, een ander tijdstip wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel8.4
