  - number: '4.23'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister of van een andere bevoegde autoriteit als bedoeld in artikel
      2, tweede lid, van [Verordening (EG) nr. 116/2009](32009R0116) van de Raad van 18 december 2008 betreffende de
      uitvoer van cultuurgoederen (PbEU 2009, L 39), cultuurgoederen die behoren tot een categorie, vermeld in bijlage
      I van genoemde verordening, uit te voeren buiten de gebieden waarop het Verdrag betreffende de Europese Unie van
      toepassing is.

      2 Onze Minister kan bepalen dat het verbod, bedoeld in het eerste lid, niet geldt voor oudheidkundige voorwerpen
      ouder dan honderd jaar, die afkomstig zijn van opgravingen en vondsten op het land en in de zee dan wel van
      oudheidkundige locaties, indien deze cultuurgoederen:

      a. van beperkt archeologisch of wetenschappelijk belang zijn;

      b. niet rechtstreeks afkomstig zijn van opgravingen, vondsten en archeologische locaties in een lidstaat van de
      Europese Unie; en

      c. zich legaal op de markt bevinden.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.23
  - number: 4.23a
    text: |-
      1 Het is verboden om cultuurgoederen als bedoeld in artikel 3, eerste lid, van de [Verordening (EU) 2019/880]
      (32780R2019), binnen te brengen vanuit gebieden buiten het douanegebied van de Europese Unie.

      2 Cultuurgoederen, als bedoeld in bijlage, deel B van de [Verordening (EU) 2019/880](32780R2019) kunnen worden
      ingevoerd vanuit gebieden gelegen buiten het douanegebied van de Europese Unie, indien daarvoor door Onze Minister
      of een bevoegde autoriteit in een andere lidstaat van de Europese Unie een vergunning is afgegeven als bedoeld in
      artikel 4 van de verordening.

      3 Cultuurgoederen, als bedoeld in bijlage, deel C van de [Verordening (EU) 2019/880](32780R2019) kunnen worden
      ingevoerd vanuit gebieden gelegen buiten het douanegebied van de Europese Unie, indien daarvoor een verklaring kan
      worden overlegd als bedoeld in artikel 5 van de verordening.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.23a
  - number: '5.1'
    text: |-
      1 Het is verboden zonder certificaat daartoe handelingen te verrichten met betrekking tot het opsporen, onderzoeken
      of verwerven van cultureel erfgoed of onderdelen daarvan, waardoor verstoring van de bodem, of verstoring of gehele
      of gedeeltelijke verplaatsing of verwijdering van een archeologisch monument of cultureel erfgoed onder water
      optreedt.

      2 Bij of krachtens algemene maatregel van bestuur kunnen gevallen worden geregeld waarop het eerste lid niet
      van toepassing is. Voor die gevallen kunnen bepaalde onderdelen van dit hoofdstuk worden uitgesloten of van
      overeenkomstige toepassing worden verklaard.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel5.1
  - number: '5.2'
    text: |-
      1 Een certificaat als bedoeld in [artikel 5.1, eerste lid][ref1], wordt op aanvraag verstrekt door een instelling
      die door Onze Minister hiertoe is aangewezen.

      2 Onze Minister wijst een instelling slechts aan indien deze beschikt over accreditatie waarmee de Stichting
      Raad voor Accreditatie kenbaar heeft gemaakt dat er gedurende een bepaalde periode een gerechtvaardigd vertrouwen
      bestaat dat de certificerende instelling competent is voor het verstrekken van certificaten en dat wordt voldaan
      aan eisen met betrekking tot de onafhankelijkheid, onpartijdigheid, continuïteit of aan andere eisen waarmee de
      kwaliteit van de verstrekking kan worden bevorderd.

      3 Met accreditatie wordt gelijkgesteld accreditatie afgegeven door een daartoe bevoegde instelling in een andere
      lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is
      bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, op basis van onderzoekingen of
      documenten die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het beschermingsniveau dat met de
      toetsing aan de eisen in het tweede lid wordt geboden.

      4 De Kaderwet zelfstandige bestuursorganen is niet van toepassing op instellingen die op grond van het eerste lid
      zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '5.1'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '5.3'
    text: |-
      Een certificerende instelling verstrekt een certificaat slechts indien de aanvrager voldoende aantoont opgravingen
      en de daarbij behorende handelingen, bedoeld in [artikel 5.4, eerste lid][ref1], op professionele wijze te zullen
      verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5.4
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel5.3
