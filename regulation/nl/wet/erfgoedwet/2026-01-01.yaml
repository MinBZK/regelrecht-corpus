  - number: '9.1'
    text: |-
      1 Tot het tijdstip waarop het bij koninklijke boodschap van 16 juni 2014 ingediende voorstel van wet houdende
      regels over het beschermen en benutten van de fysieke leefomgeving (Omgevingswet) (Kamerstukken ) tot wet is
      verheven en in werking is getreden:

      a. blijven de [hoofdstukken II, paragrafen 2][ref1] en [3][ref2], [IV][ref3], [V, paragrafen 1][ref4] en
      [9][ref5], en [VI van de Monumentenwet 1988][ref6], zoals die luidden voor inwerkingtreding van deze wet, van
      toepassing;

      b. is [artikel 5 van de Monumentenwet 1988][ref7], zoals dat luidde voor inwerkingtreding van deze
      wet, van overeenkomstige toepassing voor een monument of archeologisch monument met ingang van de
      datum waarop het ontwerpbesluit tot aanwijzing als rijksmonument wordt toegezonden als bedoeld in
      [artikel 3:13, eerste lid, van de Algemene wet bestuursrecht][ref8].

      2 Bij de toepassing van het eerste lid blijven de volgende bepalingen, zoals die luidden voor inwerkingtreding van
      deze wet, van toepassing:

      a. [bijlage 1 behorende bij de Algemene wet bestuursrecht][ref9];

      b. [artikel 1a, onderdeel 2, van de Wet op de economische delicten][ref10].


