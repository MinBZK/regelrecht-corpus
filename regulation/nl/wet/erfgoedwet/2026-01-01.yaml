  - number: '5.10'
    text: |-
      1 Degene die anders dan bij het verrichten van opgravingen een vondst doet waarvan hij weet dan wel redelijkerwijs
      moet vermoeden dat het een archeologische vondst betreft, meldt dit zo spoedig mogelijk bij Onze Minister.

      2 De gerechtigde tot een archeologische vondst als bedoeld in het eerste lid, is gehouden de vondst gedurende zes
      maanden, te rekenen van de dag van de in het eerste lid bedoelde melding, ter beschikking te houden of te stellen
      voor wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel5.10
  - number: '5.11'
    text: |-
      Degene die bij het opsporen van archeologische monumenten, zonder het verrichten van een opgraving, waarnemingen
      doet, waarvan hij weet dan wel redelijkerwijs moet vermoeden dat die waarnemingen van belang zijn voor de
      archeologische monumentenzorg, meldt die waarnemingen zo spoedig mogelijk bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel5.11
  - number: '5.12'
    text: |-
      1 Onze Minister houdt een Centraal archeologisch informatiesysteem in stand waarin in ieder geval worden opgenomen:

      a. het rijksmonumentenregister voor zover dat archeologische monumenten betreft;

      b. de beslissingen op aanvragen om een omgevingsvergunning voor een rijksmonumentenactiviteit als
      bedoeld in [artikel 5.1, eerste lid, aanhef en onder b, van de Omgevingswet][ref1] voor zover het
      archeologische monumenten betreft en de beslissingen op de aanvragen om vergunning als bedoeld in
      [artikel 11, tweede lid, van de Monumentenwet 1988][ref2], zoals die wet luidde voor inwerkingtreding van deze wet;

      c. het rapport, bedoeld in [artikel 5.6, vierde lid][ref3]; en

      d. de meldingen, bedoeld in de [artikelen 5.6, eerste en tweede lid][ref4], [5.10, eerste lid][ref5], en
      [5.11][ref6].

      2 Het Centraal archeologisch informatiesysteem kan door eenieder worden geraadpleegd.

      3 Het auteursrecht op de rapporten, bedoeld in [artikel 5.6, vierde lid][ref7], en de daarin opgenomen werken is
      voorbehouden.

      4 Het auteursrecht en het databankenrecht, bedoeld in [artikel 2, eerste lid, van de Databankenwet][ref8], op het
      Centraal archeologisch informatiesysteem zijn voorbehouden.

      5 Voor de verstrekking van informatie uit het Centraal archeologisch informatiesysteem kunnen kosten in rekening
      worden gebracht, volgens door Onze Minister vast te stellen tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5.1
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0037521#Artikel5.6
