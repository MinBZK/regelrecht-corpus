  - number: '9.6'
    text: |-
      1 Op een opgraving die is aangevangen voor inwerkingtreding van deze wet blijft
      [hoofdstuk V van de Monumentenwet 1988][ref1] zoals die wet luidde voor inwerkingtreding van deze wet van
      toepassing.

      2 Tot een jaar na inwerkingtreding van deze wet kan een opgraving zonder certificaat plaatsvinden, voor zover
      degene die de opgraving verricht voor de desbetreffende handelingen beschikt over een vergunning als bedoeld in
      [artikel 45 van de Monumentenwet 1988][ref2] zoals die wet luidde voor inwerkingtreding van deze wet. De bij of
      krachtens de [Monumentenwet 1988][ref3] gestelde regels met betrekking tot de vergunning blijven in dat geval van
      toepassing en [artikel 5.6][ref4] is van overeenkomstige toepassing.

      3 [Artikel 5.2, tweede lid][ref5], is tot twee jaar na inwerkingtreding van deze wet niet van toepassing. Indien
      een instelling is aangewezen op grond van artikel 5.2 en deze na die twee jaar niet beschikt over accreditatie,
      schorst Onze Minister de aanwijzing of trekt hij deze in.


