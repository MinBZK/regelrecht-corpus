  - number: '7.7'
    text: |-
      1 Onze Minister stelt nadere regels voor de verstrekking van subsidies als bedoeld in de [artikelen 7.2][ref1] en
      [7.3, eerste en derde lid][ref2].

      2 Onze Minister kan nadere regels stellen voor de verstrekking van subsidies als bedoeld in de
      [artikelen 7.1][ref3] en [7.3, tweede lid][ref4].

      3 Bij de nadere regels kan Onze Minister bepalen dat het verstrekken van gegevens, het indienen van aanvragen
      daaronder begrepen, uitsluitend via elektronische weg kan geschieden. Daarbij kan worden afgeweken van de
      [artikelen 2:7, tweede lid][ref5], en [2:8 van de Algemene wet bestuursrecht][ref6].


