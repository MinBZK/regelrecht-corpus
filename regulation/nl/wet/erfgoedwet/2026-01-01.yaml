      1 Monumenten die zijn ingeschreven als bedoeld in de [artikelen 6, eerste lid][ref1], en
      [7, derde lid, van de Monumentenwet 1988][ref2], zoals die luidden voor de inwerkingtreding van deze wet, worden
      geacht te zijn ingeschreven op grond van [artikel 3.3, derde lid][ref3], van deze wet.

      2 Roerende zaken en verzamelingen die als beschermde voorwerpen onderscheidenlijk beschermde verzamelingen zijn
      aangewezen op grond van de [Wet tot behoud van cultuurbezit][ref4] worden geacht te zijn aangewezen als beschermde
      cultuurgoederen onderscheidenlijk beschermde verzamelingen op grond van deze wet.


