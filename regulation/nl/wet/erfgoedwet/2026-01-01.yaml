  - number: '2.11'
    text: |-
      1 Onze Minister kan een besluit als bedoeld in [artikel 2.8][ref1] intrekken:

      a. op verzoek van de desbetreffende instelling;

      b. indien de instelling niet voldoet aan de verplichtingen op grond van deze wet; of

      c. op basis van de overwegingen, bedoeld in [artikel 2.8, derde lid][ref2].

      2 Bij toepassing van het eerste lid, onder c, treedt het besluit niet eerder in werking dan vier jaren na
      dagtekening van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel2.8
