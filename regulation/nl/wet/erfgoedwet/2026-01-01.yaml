        paragraaf: '3.2'
  - number: '2.7'
    text: |-
      1 Onze Minister stelt nadere regels over het beheer van museale cultuurgoederen van de Staat.

      2 De regels kunnen onder meer betrekking hebben op:

      a. onderhoud en restauratie;

      b. registratie en administratie;

      c. veiligheidszorg;

      d. schade, aansprakelijkheid en verzekeringen; en

      e. waardering van en advisering over cultuurgoederen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel2.7
  - number: '2.8'
    text: |-
      1 Onze Minister kan bij besluit een instelling belasten met de zorg voor het beheer van museale cultuurgoederen van
      de Staat of andere cultuurgoederen.

      2 Een besluit als bedoeld in het eerste lid is voor onbepaalde tijd.

      3 Een besluit als bedoeld in het eerste lid wordt genomen met inachtneming van:

      a. de deskundigheid, kennis en ervaring van de instelling met het beheren en behouden van cultuurgoederen;

      b. de geschiktheid van de voorzieningen van de instelling voor het beheren en behouden van cultuurgoederen en de
      toegankelijkheid van de voorzieningen voor het publiek;

      c. het belang van cultuurgoederen van de instelling of de samenhang van die cultuurgoederen met museale
      cultuurgoederen van de Staat;

      d. de verantwoordelijkheid die andere bestuursorganen voor de desbetreffende cultuurgoederen hebben genomen;

      e. de doelmatige besteding van middelen.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel2.8
  - number: '2.9'
    text: |-
      1 Het besluit, bedoeld in [artikel 2.8, eerste lid][ref1], vermeldt op welke cultuurgoederen of verzamelingen het
      besluit ziet.

      2 Onze Minister kan na overleg met de desbetreffende instelling het besluit wijzigen ten aanzien van de
      cultuurgoederen of verzamelingen waar het op ziet.

      3 Voor zover het besluit betrekking heeft op museale cultuurgoederen van de Staat worden deze cultuurgoederen
      voor de tijd dat het besluit daarop betrekking heeft van rechtswege in bruikleen gegeven als bedoeld in
      [artikel 1777 van Boek 7A van het Burgerlijk Wetboek][ref2].

      4 Voor zover het besluit betrekking heeft op andere cultuurgoederen of verzamelingen, is [paragraaf 2.1][ref3]
      op die cultuurgoederen en verzamelingen van overeenkomstige toepassing, met uitzondering van
      [artikel 2.6, vierde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel2.8
