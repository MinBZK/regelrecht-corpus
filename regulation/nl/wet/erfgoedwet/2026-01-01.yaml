  - number: '5.13'
    text: |-
      Onze Minister kan regels stellen over de wijze waarop een melding als bedoeld in [artikel 5.6][ref1], [5.10][ref2]
      of [5.11][ref3] plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5.6
