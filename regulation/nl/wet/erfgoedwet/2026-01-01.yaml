  - number: '8.1'
    text: |-
      Onze Minister is belast met de bestuursrechtelijke handhaving van het bepaalde bij of krachtens deze wet. Deze
      taak omvat:

      a. het houden van toezicht op de naleving van het bepaalde bij of krachtens deze wet, met inbegrip van het
      verzamelen en registreren van gegevens die hiervoor van belang zijn; en

      b. het opleggen van een bestuurlijke sanctie wegens een gedraging die in strijd is met het bepaalde bij of
      krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel8.1
  - number: '8.2'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde bij of
      krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel8.2
  - number: '8.3'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit door Onze
      Minister aangewezen inspecteurs en andere bij besluit van Onze Minister daartoe aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel8.3
  - number: '8.4'
    text: |-
      1 Met de opsporing van de strafbaar gestelde overtredingen van het bepaalde bij of krachtens deze wet zijn,
      onverminderd [artikel 141 van het Wetboek van Strafvordering][ref1], belast:

      a. de toezichthouders, bedoeld in [artikel 8.3][ref2], voor zover zij daartoe bij besluit van Onze Minister van
      Veiligheid en Justitie zijn aangewezen;

      b. de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane.

      2 De ambtenaren, bedoeld in het eerste lid, onder a en b, zijn tevens belast met de opsporing van de feiten
      strafbaar gesteld in de [artikelen 179 tot en met 182][ref3] en [184 van het Wetboek van Strafrecht][ref4], voor
      zover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel8.3
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel8.4
