  - number: '8.7'
    text: |-
      1 Onze Minister wie het aangaat, een college van staat of een instelling die museale cultuurgoederen van de Staat
      beheert, verstrekt desgevraagd de inlichtingen die de toezichthouders, bedoeld in [artikel 8.3][ref1], voor de
      uitoefening van het toezicht nodig hebben.

      2 Onze Minister wie het aangaat, een college van staat of een instelling verleent de toezichthouders toegang tot
      de museale cultuurgoederen van de Staat in beheer en verleent hen desgevraagd inzage in alle daartoe bijgehouden
      administraties, documenten en andere informatiedragers.

      3 De toezichthouders melden hun bevindingen aan Onze Minister wie het aangaat, een college van staat of een
      instelling en geven daarbij zo nodig aan welke voorzieningen naar hun oordeel dienen te worden getroffen ten
      behoeve van het beheer.

      4 De toezichthouders leggen periodiek een samenvatting van de bevindingen, bedoeld in het derde lid, over aan Onze
      Minister.

      5 Dit artikel is van overeenkomstige toepassing op een instelling die op grond van [artikel 2.8][ref2] is belast
      met de zorg voor het beheer van andere cultuurgoederen.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel8.3
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel2.8
