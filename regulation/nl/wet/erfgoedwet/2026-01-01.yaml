        artikel: '3.1'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037521
        artikel: '3.2'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '3.5'
    text: |-
      De bewaarder van het kadaster en de openbare registers doet binnen veertien dagen mededeling van een wijziging
      in de kadastrale aanduiding van een rijksmonument aan Onze Minister, die deze wijziging overneemt in het
      rijksmonumentenregister.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.5
  - number: '3.6'
    text: |-
      Ingeval het rijksmonumentenregister niet gelijkluidend is aan een
      afschrift van dat register in de openbare registers, bedoeld in
      [artikel 1, onder c, van de Wet kenbaarheid publiekrechtelijke beperkingen onroerende zaken][ref1], bepaalt het
      afschrift in de openbare registers of een monument of archeologisch monument wordt aangemerkt als rijksmonument.


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel1
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0016876
        artikel: '1'
  - number: '3.7'
    text: |-
      1 Onze Minister kan ambtshalve besluiten een cultuurgoed dat van bijzondere cultuurhistorische of wetenschappelijke
      betekenis of uitzonderlijke schoonheid is en dat als onvervangbaar en onmisbaar behoort te worden behouden voor het
      Nederlands cultuurbezit aan te wijzen als beschermd cultuurgoed.

      2 Onze Minister kan ambtshalve besluiten een verzameling van bijzondere cultuurhistorische of wetenschappelijke
      betekenis, die als geheel of door een of meer van de cultuurgoederen die een wezenlijk onderdeel van de verzameling
      zijn als onvervangbaar en onmisbaar behoort te worden behouden voor het Nederlands cultuurbezit, aan te wijzen als
      beschermde verzameling.

      3 Het besluit tot aanwijzing als beschermde verzameling gaat vergezeld van een algemene omschrijving van de
      beschermde verzameling en van een opsomming van de cultuurgoederen die tot de beschermde verzameling behoren.

      4 Een cultuurgoed is:

      a. onvervangbaar indien er geen of nagenoeg geen ander of gelijksoortig cultuurgoed in goede staat in Nederland
      aanwezig is;

      b. onmisbaar indien het een symboolfunctie, schakelfunctie of ijkfunctie heeft.

      5 Bij de aanwijzing als beschermde verzameling is het vierde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.7
  - number: '3.8'
    text: |-
      1 In een spoedeisend geval kan Onze Minister bij het besluit tot aanwijzing als beschermde verzameling, in
      afwijking van [artikel 3.7, derde lid][ref1], volstaan met een algemene omschrijving van de verzameling.

      2 Onze Minister stelt in een geval als bedoeld in het eerste lid zo spoedig mogelijk na het besluit tot aanwijzing
      een opsomming vast van de cultuurgoederen die tot de verzameling behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel3.7
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '3.7'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '3.9'
    text: |-
      1 Voor aanwijzing van een cultuurgoed als beschermd cultuurgoed of opneming van een cultuurgoed in de opsomming van
      een beschermde verzameling is toestemming van de eigenaar vereist indien deze:

      a. de vervaardiger van het cultuurgoed is of de erfgenaam van de vervaardiger;

      b. degene is die het cultuurgoed in Nederland heeft gebracht of die het binnen vijf jaar, nadat het in Nederland is
      gebracht, heeft verworven, of de erfgenaam van een van hen.

      2 Het eerste lid is ook van toepassing op de erfgenaam die het cultuurgoed anders dan door vererving heeft
      verkregen.

      3 Het eerste lid is alleen van toepassing op de erfgenaam gedurende dertig jaar of, voor zover het
      archiefbescheiden betreft, vijftig jaar na het overlijden van de erflater.

      4 Indien de eigenaar, bedoeld in het eerste lid, onder b, een rechtspersoon is, is het eerste lid alleen van
      toepassing gedurende dertig jaar of, voor zover het archiefbescheiden betreft, vijftig jaar nadat die rechtspersoon
      het cultuurgoed in Nederland heeft gebracht, of de eigendom van het cultuurgoed binnen vijf jaar, nadat het in
      Nederland is gebracht, heeft verworven.

      5 Het terugbrengen naar Nederland van een cultuurgoed dat zich tijdelijk buiten Nederland heeft bevonden, geldt
      niet als het in Nederland brengen, bedoeld in het eerste lid, onder b.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.9
  - number: '3.10'
    text: |-
      1 Onze Minister gaat niet over tot aanwijzing als beschermd cultuurgoed of als beschermde verzameling indien een
      cultuurgoed als bedoeld in [artikel 3.7, eerste lid][ref1], een verzameling of een deel daarvan:

      a. berust onder iemand die tijdelijk zijn woonplaats naar Nederland verplaatst;

      b. door een niet-ingezetene wordt uitgeleend voor tijdelijke tentoonstelling in Nederland; of

      c. wegens hiermee vergelijkbare omstandigheden naar het oordeel van Onze Minister niet in Nederland thuishoort.

      2 Onze Minister gaat niet eerder dan een jaar nadat de omstandigheden, bedoeld in het eerste lid, onder a tot
      en met c, zich niet meer hebben voorgedaan over tot aanwijzing als beschermd cultuurgoed of als beschermde
      verzameling.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel3.7
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '3.7'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '3.11'
    text: |-
      1 Onze Minister houdt een register van de beschermde cultuurgoederen en beschermde verzamelingen bij.

      2 Het register kan door een ieder worden geraadpleegd, met uitzondering van de gegevens over de eigenaar of
      verblijfplaats van een beschermd cultuurgoed of beschermde verzameling.

      3 Het register bevat in ieder geval voor een:

      a. beschermd cultuurgoed: beschrijving en motivering van de aanwijzing;

      b. beschermde verzameling: algemene omschrijving, opsomming van de cultuurgoederen die behoren tot de verzameling
      en motivering van de aanwijzing van de verzameling.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.11
  - number: '3.12'
    text: |-
      1 Onze Minister kan een besluit tot aanwijzing als beschermd cultuurgoed of als beschermde verzameling ambtshalve
      wijzigen of intrekken.

      2 Onze Minister kan ambtshalve verbeteringen van feitelijke aard aanbrengen in de beschrijving van een
      beschermd cultuurgoed, de algemene omschrijving van een beschermde verzameling of de opsomming van de beschermde
      cultuurgoederen die behoren tot een beschermde verzameling.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.12
  - number: '3.13'
    text: |-
      Onze Minister kan ambtshalve besluiten een rijksmonument tezamen met cultuurgoederen aan te wijzen als ensemble,
      indien het geheel van rijksmonument en de cultuurgoederen in onderlinge samenhang van bijzondere cultuurhistorische
      of wetenschappelijke betekenis is.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.13
  - number: '3.14'
    text: |-
      1 Onze Minister houdt een informatiesysteem van aangewezen ensembles bij dat is gekoppeld aan het
      rijksmonumentenregister.

      2 Het informatiesysteem kan door een ieder worden geraadpleegd.

      3 Het informatiesysteem bevat voor een opgenomen ensemble in ieder geval een algemene omschrijving, een opsomming
      van het rijksmonument en, voor zover de eigenaar daarmee heeft ingestemd, de cultuurgoederen die behoren tot het
      ensemble en de motivering van de aanwijzing van het ensemble.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.14
  - number: '3.15'
    text: |-
      1 Onze Minister kan een besluit tot aanwijzing als ensemble ambtshalve wijzigen of intrekken.

      2 Onze Minister kan ambtshalve verbeteringen van feitelijke aard aanbrengen in de beschrijving van het ensemble.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.15
  - number: '3.16'
    text: |-
      1 De gemeenteraad kan een erfgoedverordening vaststellen.

      2 De verordening ziet op het beheer en behoud van cultureel erfgoed gelegen binnen de desbetreffende gemeente, dat
      van bijzonder belang is voor die gemeente vanwege de cultuurhistorische of wetenschappelijke betekenis.

      3 Het college van burgemeester en wethouders houdt een gemeentelijk erfgoedregister van aangewezen cultureel
      erfgoed bij.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.16
  - number: '3.17'
    text: |-
      1 Provinciale staten kunnen een erfgoedverordening vaststellen.

      2 De verordening ziet op het beheer en behoud van cultureel erfgoed geheel of gedeeltelijk gelegen binnen
      de desbetreffende provincie, dat van bijzonder belang is voor die provincie vanwege de cultuurhistorische of
      wetenschappelijke betekenis.

      3 De verordening bevat geen regels over de fysieke leefomgeving als bedoeld in
      [artikel 2.6 van de Omgevingswet][ref1].

      4 Gedeputeerde staten houden een provinciaal erfgoedregister van aangewezen cultureel erfgoed bij.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '2.6'
  - number: '3.18'
    text: |-
      Als cultuurgoederen als bedoeld in artikel 6.1, onder c, en artikel 2, onder 1, van [Richtlijn 2014/60]
      (32014L0060)/EU van het Europees parlement en de Raad van 15 mei 2014 betreffende de teruggave van cultuurgoederen
      die op onrechtmatige wijze buiten het grondgebied van een lidstaat zijn gebracht en houdende wijziging van
      Verordening (EU) nr. 1024/2012 (PbEU 2014, L 159) worden voor Nederland aangewezen:

      a. beschermde cultuurgoederen;

      b. cultuurgoederen als bedoeld in [artikel 4.22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel4.22
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '4.22'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '4.1'
    text: |-
      In deze paragraaf wordt verstaan onder handeling: handeling als bedoeld in
      [artikel 4.4, onder a tot en met g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel4.4
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '4.4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '4.2'
    text: |-
      De eigenaar van een beschermd cultuurgoed deelt degene aan wie hij het cultuurgoed vervreemdt of aan wie hij
      met betrekking tot het cultuurgoed rechten verleent vooraf mee dat het cultuurgoed is aangewezen als beschermd
      cultuurgoed.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.2
  - number: '4.3'
    text: |-
      Degene die een beschermd cultuurgoed onder zich heeft, toont het desgevraagd aan de inspecteur en meldt deze
      onverwijld de vermissing of het tenietgaan van het cultuurgoed.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      Zonder voorafgaande schriftelijke melding aan de inspecteur is het verboden een beschermd cultuurgoed:

      a. te verplaatsen;

      b. in veiling te brengen;

      c. te vervreemden;

      d. te bezwaren;

      e. te verhuren;

      f. in bruikleen te geven; of

      g. bij boedelscheiding aan een niet-ingezetene toe te delen.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.4
  - number: '4.5'
    text: |-
      1 Gedurende zes weken na de verzending van de melding, bedoeld in [artikel 4.4][ref1], is een handeling verboden
      zonder de toestemming van de inspecteur of van Onze Minister, tenzij die melding alleen het voornemen tot
      verplaatsing binnen Nederland betreft.

      2 Indien een handeling strekt tot het buiten Nederland brengen van een beschermd cultuurgoed, kan alleen Onze
      Minister toestemming geven.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel4.4
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '4.4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '4.6'
    text: |-
      1 Indien Onze Minister binnen de termijn, bedoeld in [artikel 4.5, eerste lid][ref1], bij degene die de melding
      heeft gedaan schriftelijk bedenkingen tegen de handeling heeft aangevoerd, is die handeling verboden.

      2 De bedenkingen kunnen alleen zijn gegrond op de overweging dat er gevaar is voor het verlies van het beschermd
      cultuurgoed voor het in Nederland aanwezige cultuurbezit.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel4.5
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '4.5'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '4.7'
    text: |-
      1 Onze Minister kan bij het aanvoeren van bedenkingen meedelen dat het verbod niet geldt voor zover aan de
      handeling uitvoering wordt gegeven met inachtneming van door hem daarbij gestelde voorschriften.

      2 De voorschriften strekken alleen ter voorkoming van het verlies van het beschermd cultuurgoed voor het in
      Nederland aanwezige cultuurbezit.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.7
  - number: '4.8'
    text: |-
      1 Indien Onze Minister geen bedenkingen heeft aangevoerd, is een handeling na een jaar na de verzending van de
      melding opnieuw verboden.

      2 Onze Minister bevestigt desgevraagd binnen acht dagen schriftelijk dat hij geen bedenkingen heeft tegen een
      handeling, indien de termijn, bedoeld in [artikel 4.5, eerste lid][ref1], is verstreken zonder dat hij bedenkingen
      heeft aangevoerd.

      3 Indien Onze Minister eerder aangevoerde bedenkingen intrekt, is een handeling na een jaar na de intrekking
      opnieuw verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel4.5
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '4.5'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '4.9'
    text: |-
      1 Onze Minister doet door plaatsing in de Staatscourant mededeling van de bedenkingen die hij met betrekking tot
      een beschermd cultuurgoed heeft aangevoerd tegen:

      a. vervreemding;

      b. toedeling aan een niet-ingezetene; of

      c. verplaatsing naar de buiten Nederland gelegen vaste woonplaats van de eigenaar.

      2 De mededeling vermeldt het beschermd cultuurgoed, de handeling, bedoeld in het eerste lid, en de bedenkingen.

      3 De mededeling bevat geen gegevens over betrokken partijen of over de verblijfplaats van het beschermd
      cultuurgoed.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.9
  - number: '4.10'
    text: |-
      1 Gedurende zes weken na de publicatie in de Staatscourant kunnen mogelijke kopers van het beschermd cultuurgoed
      zich aanmelden bij Onze Minister.

      2 Onze Minister geeft een aanmelding onverwijld door aan de eigenaar van het beschermd cultuurgoed.

      3 Na afloop van de termijn, bedoeld in het eerste lid, gelden bedenkingen als bedoeld in
      [artikel 4.9, eerste lid][ref1], als een aanbod van de Staat tot aankoop van het beschermd cultuurgoed op de in de
      [artikelen 4.13][ref2] en [4.14][ref3] geregelde wijze.

      4 Het aanbod geldt drie maanden.

      5 Op schriftelijk verzoek van de eigenaar kan het moment van de aanvang van het aanbod worden uitgesteld.

      6 Onze Minister en de eigenaar kunnen de termijn, bedoeld in het vierde lid, in onderling overleg verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel4.9
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel4.13
      [ref3]: https://wetten.overheid.nl/BWBR0037521#Artikel4.14
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '4.9'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037521
        artikel: '4.13'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0037521
        artikel: '4.14'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '4.11'
    text: |-
      De [artikelen 4.9][ref1] en [4.10][ref2] zijn niet van toepassing indien Onze Minister bij het aanvoeren van
      bedenkingen een mededeling heeft gedaan als bedoeld in [artikel 4.7, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel4.9
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel4.10
      [ref3]: https://wetten.overheid.nl/BWBR0037521#Artikel4.7
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '4.9'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037521
        artikel: '4.10'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0037521
        artikel: '4.7'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '4.12'
    text: |-
      De in [artikel 4.10, vierde lid][ref1], bedoelde termijn wordt opgeschort, zolang over een aanbod van de Staat tot
      aankoop van een beschermd cultuurgoed:

      a. bij de rechtbank Den Haag een procedure als bedoeld in [artikel 4.14, eerste lid][ref2], aanhangig is; of

      b. tussen de Staat en de eigenaar een overeenkomst tot arbitrage bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel4.10
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel4.14
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '4.10'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037521
        artikel: '4.14'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '4.13'
    text: |-
      Onze Minister treedt onverwijld na aanvang van de termijn, bedoeld in [artikel 4.10, vierde lid][ref1], met de
      eigenaar in onderhandeling over de koopprijs en de overige verkoopvoorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel4.10
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '4.10'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '4.14'
    text: |-
      1 Indien de onderhandelingen, bedoeld in [artikel 4.13][ref1], niet tot overeenstemming leiden, wordt de prijs op
      verzoek van een van de partijen vastgesteld door de rechtbank Den Haag, tenzij de eigenaar te kennen geeft af te
      zien van de handeling of Onze Minister de daartegen aangevoerde bedenkingen intrekt.

      2 Alvorens te beslissen vraagt de rechtbank advies aan deskundigen.

      3 De griffier zendt een afschrift van het deskundigenadvies aan de verzoeker en de wederpartij, die binnen een door
      de rechter te bepalen termijn hun opmerkingen over het advies bij de griffie kunnen indienen.

      4 Tegen beschikkingen op grond van dit artikel staat uitsluitend beroep in cassatie open.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel4.13
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '4.13'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '4.15'
    text: |-
      1 Binnen een maand nadat de koopprijs ingevolge [artikel 4.14][ref1] onherroepelijk is vastgesteld, kan Onze
      Minister aan de eigenaar meedelen van het aanvoeren van bedenkingen af te zien en kan de eigenaar aan Onze Minister
      meedelen van het verrichten van de gemelde handeling af te zien.

      2 Indien aan het eerste lid geen uitvoering wordt gegeven, geldt de vastgestelde koopprijs als overeengekomen
      tussen partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel4.14
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '4.14'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '4.16'
    text: |-
      1 Onze Minister vergoedt desgevraagd uitgaven van een belanghebbende voor zover het nut daarvan is teniet gedaan
      door bedenkingen die zijn aangevoerd op grond van [artikel 4.6][ref1].

      2 Het eerste lid is niet van toepassing indien de bedenkingen hebben geleid tot aankoop door de Staat van het
      desbetreffende beschermd cultuurgoed of een dergelijke aankoop achterwege is gebleven vanwege de aankoop door een
      derde.

      3 Onze Minister vergoedt geen uitgaven die wegens de mogelijkheid dat bedenkingen zouden worden aangevoerd
      redelijkerwijs achterwege hadden moeten blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel4.16
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '4.16'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '4.17'
    text: |-
      1 Een voorgenomen besluit tot vervreemding van een cultuurgoed of een verzameling wordt door Onze Minister,
      gedeputeerde staten of het college van burgemeester en wethouders bekendgemaakt op een door Onze Minister
      aangewezen wijze.

      2 De bekendmaking bevat in elk geval een beschrijving van het cultuurgoed of de verzameling, een motivering van de
      voorgenomen vervreemding en een mededeling of advies wordt gevraagd als bedoeld in [artikel 4.18][ref1].

      3 Voor zover geen advies wordt gevraagd als bedoeld in [artikel 4.18][ref2], kan een ieder gedurende zes weken
      na de dag van bekendmaking van het voornemen bij Onze Minister, gedeputeerde staten onderscheidenlijk het college
      van burgemeester en wethouders zienswijzen indienen over de vraag of het cultuurgoed of de verzameling van
      bijzondere cultuurhistorische of wetenschappelijke betekenis is en onvervangbaar en onmisbaar voor het Nederlands
      cultuurbezit.

      4 Gedurende de termijn, bedoeld in het derde lid, wordt niet overgegaan tot vervreemding van het cultuurgoed
      of de verzameling. Na deze termijn worden ingediende zienswijzen door Onze Minister, gedeputeerde staten
      onderscheidenlijk het college van burgemeester en wethouders beoordeeld en wordt zo nodig alsnog advies gevraagd
      als bedoeld in [artikel 4.18][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel4.18
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel4.18
