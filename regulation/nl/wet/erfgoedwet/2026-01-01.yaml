    text: |-
      1 De [Wet tot behoud van cultuurbezit][ref1], zoals die wet luidde voor inwerkingtreding van deze wet, blijft van
      toepassing op:

      a. de aanwijzing van een beschermd voorwerp of beschermde verzameling, bedoeld in [artikel 2][ref2], [3][ref3] of
      [3a van de Wet tot behoud van cultuurbezit][ref4], zoals die luidden voor inwerkingtreding van deze wet, indien de
      procedure is aangevangen voor de datum van inwerkingtreding van deze wet;

      b. de wijziging van een aanwijzing, bedoeld in
      [artikel 3d, tweede lid, van de Wet tot behoud van cultuurbezit][ref5], zoals dat luidde voor inwerkingtreding van
      deze wet, indien de procedure is aangevangen voor de datum van inwerkingtreding van deze wet;

      c. een verzoek als bedoeld in [artikel 3d, eerste lid, van de Wet tot behoud van cultuurbezit][ref6], zoals dat
      luidde voor inwerkingtreding van deze wet, waar nog niet op is beslist;

      d. een voornemen als bedoeld in [artikel 7, eerste lid, van de Wet tot behoud van cultuurbezit][ref7], zoals dat
      luidde voor inwerkingtreding van deze wet, indien dit is gemeld voor de datum van inwerkingtreding van deze wet;

      e. een aanvraag als bedoeld in [artikel 14 van de Wet tot behoud van cultuurbezit][ref8], zoals dat luidde voor
      inwerkingtreding van deze wet, die is ingediend voor de datum van inwerkingtreding van deze wet alsmede een geschil
      over een besluit op een dergelijke aanvraag.

      2 Een vergunning die is verleend op grond van [artikel 14a][ref9] of
      [artikel 14b van de Wet tot behoud van cultuurbezit][ref10] wordt geacht een vergunning als bedoeld in
      [artikel 4.22][ref11] onderscheidenlijk [artikel 4.23][ref12] van deze wet te zijn.


