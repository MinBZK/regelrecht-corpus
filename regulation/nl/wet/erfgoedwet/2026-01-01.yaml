  - number: '6.1'
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *Unesco-verdrag 1970:* op 14 november 1970 te Parijs tot stand gekomen Overeenkomst inzake de middelen om
      onrechtmatige invoer, uitvoer of eigendomsoverdracht van cultuurgoederen te verbieden en te verhinderen (Trb. 1972,
      nr. 50 en Trb. 1983, nr. 66);
        - *verdragsstaat:* staat die het Unesco-verdrag 1970 heeft bekrachtigd;
        - *cultuurgoed:* zaak die door elke verdragsstaat om godsdienstige of wereldlijke redenen is aangewezen als
      belangrijk voor de oudheidkunde, de prehistorie, de geschiedenis, de letterkunde, de kunst of de wetenschap en
      derhalve van wezenlijk belang is voor zijn cultureel erfgoed en die behoort tot de in artikel 1 van het Unesco-
      verdrag 1970 opgesomde categorieën.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel6.1
  - number: '6.2'
    text: |-
      1 Onze Minister verricht hetgeen in aanmerking komt ter uitvoering van de artikelen 2, 5, 6, 7, 9, 10, 13, onder
      a, b en d, en 14 van het Unesco-verdrag 1970, behoudens voor zover het betreft het in artikel 10, onder a, van het
      Verdrag bedoelde opleggen aan antiekhandelaren van regels, waarvan de overtreding strafbaar is.

      2 Onze Minister kan nadere regels stellen in verband met de uitvoering.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel6.2
  - number: '6.3'
    text: |-
      Het is verboden een cultuurgoed binnen Nederland te brengen dat:

      a. buiten het grondgebied van een verdragsstaat is gebracht met schending van de bepalingen die in overeenstemming
      met de doelstellingen van het Unesco-verdrag 1970 door die verdragsstaat zijn vastgesteld ter zake van de uitvoer
      van cultuurgoederen uit die verdragsstaat of ter zake van eigendomsoverdracht van cultuurgoederen; of

      b. in een verdragsstaat is ontvreemd.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel6.3
  - number: '6.4'
    text: |-
      1 Onze Minister kan een cultuurgoed ten aanzien waarvan een redelijk vermoeden bestaat dat daarmee het verbod,
      bedoeld in [artikel 6.3][ref1], is overtreden, in bewaring nemen voor de tijd die Onze Minister nodig acht om de
      verdragsstaat waaruit het cultuurgoed afkomstig is, in staat te stellen op dit cultuurgoed beslag te doen leggen.
      Deze tijd mag niet langer zijn dan twaalf weken.

      2 De inbewaringneming kan eenmaal voor ten hoogste twaalf weken worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel6.3
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '6.3'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '6.5'
    text: |-
      1 Onze Minister stelt voorafgaand aan de inbewaringneming of een verlenging daarvan zijn beslissing daartoe op
      schrift. De schriftelijke beslissing is een beschikking.

      2 De beschikking van de inbewaringneming of verlenging daarvan wordt zo spoedig mogelijk bekend gemaakt aan:

      a. de bezitter van het in bewaring genomen cultuurgoed, voor zover deze bekend is; en

      b. degene die ten tijde van de inbewaringneming het cultuurgoed onder zich hield.

      3 Indien de situatie dermate spoedeisend is dat Onze Minister de beslissing tot inbewaringneming niet tevoren op
      schrift kan stellen, zorgt hij alsnog zo spoedig mogelijk voor opschriftstelling en voor de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel6.5
  - number: '6.6'
    text: |-
      1 De inbewaringneming eindigt doordat op het cultuurgoed in opdracht van de staat waaruit het afkomstig is, beslag
      wordt gelegd, of de tijd waarvoor de inbewaringneming geldt, ongebruikt is verstreken.

      2 Indien de inbewaringneming eindigt zonder dat beslag wordt gelegd op het cultuurgoed, wordt het afgegeven
      aan degene die het cultuurgoed bij de aanvang van de inbewaringneming onder zich hield, dan wel aan degene die
      redelijkerwijs als rechthebbende kan worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel6.6
  - number: '6.7'
    text: |-
      Van een cultuurgoed dat in strijd met het verbod, bedoeld in [artikel 6.3][ref1], binnen Nederland is gebracht, kan
      met inachtneming van de [artikelen 1011a tot en met 1011d van het Wetboek van Burgerlijke Rechtsvordering][ref2]
      teruggave worden gevorderd door de verdragsstaat waaruit het cultuurgoed afkomstig is of door de rechthebbende op
      dat cultuurgoed.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel6.3
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1011a
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '6.3'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 1011a
  - number: '6.8'
    text: |-
      Deze paragraaf is niet van toepassing, wanneer de schending van de in [artikel 6.3, onder a][ref1], bedoelde
      bepalingen dan wel de in artikel 6.3, onder b, bedoelde ontvreemding vóór 1 juli 2009 heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel6.3
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '6.3'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '6.9'
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *Protocol:* Protocol van 14 mei 1954 behorend bij het op die dag te ’s-Gravenhage tot stand gekomen Verdrag
      inzake de bescherming van culturele goederen in geval van een gewapend conflict (Trb. 1955, 47);
        - *bezet gebied:* op of na 14 januari 1959 tijdens een gewapend conflict bezet gebied waarop artikel I van het
      Protocol van toepassing is;
        - *cultuurgoed:* zaak als bedoeld in artikel 1, onder a, van het Verdrag inzake de bescherming van culturele
      goederen in geval van een gewapend conflict (Trb. 1955, 47).
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel6.9
  - number: '6.10'
    text: |-
      Het is verboden om een cultuurgoed dat afkomstig is uit een bezet gebied Nederland binnen te brengen of in
      Nederland onder zich te houden.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel6.10
  - number: '6.11'
    text: |-
      1 Onze Minister neemt een cultuurgoed ten aanzien waarvan een redelijk vermoeden bestaat dat daarmee het verbod,
      bedoeld in [artikel 6.10][ref1], wordt overtreden in bewaring:

      a. uit eigen beweging bij het binnenbrengen in Nederland; of

      b. op verzoek van de autoriteiten van het desbetreffende bezet gebied of voorheen bezet gebied.

      2 Onze Minister kan in Nederland aangetroffen cultuurgoederen ten aanzien waarvan het redelijke vermoeden, bedoeld
      in het eerste lid, bestaat, eveneens uit eigen beweging in bewaring nemen, indien een redelijke verwachting bestaat
      dat een verzoek als bedoeld in het eerste lid, onder b, zal worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel6.10
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '6.10'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '6.12'
    text: |-
      1 [Artikel 6.5][ref1] is van overeenkomstige toepassing op een inbewaringneming als bedoeld in
      [artikel 6.11][ref2].

      2 In aanvulling op [artikel 6.5, tweede lid][ref3], wordt de beschikking van een inbewaringneming ook zo spoedig
      mogelijk bekend gemaakt aan:

      a. de autoriteiten van het desbetreffende bezet gebied;

      b. de eigenaar van het in bewaring genomen cultuurgoed, voor zover deze bekend is; en

      c. beperkt gerechtigden met betrekking tot het cultuurgoed, voor zover deze bekend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel6.5
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel6.11
      [ref3]: https://wetten.overheid.nl/BWBR0037521#Artikel6.5
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel6.12
