preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wetgeving op het terrein van cultureel erfgoed
    te bundelen, te structureren en te vereenvoudigen, en tevens om onder meer de omgang met museale collecties
    wettelijk vorm te geven, het vervreemden van cultuurgoederen in bezit van overheden te regelen en het stelsel van
    kwaliteitsborging in de archeologie te moderniseren;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *archeologisch monument:* terrein dat deel uitmaakt van cultureel erfgoed vanwege de daar aanwezige
      overblijfselen, voorwerpen of andere sporen van menselijke aanwezigheid in het verleden, met inbegrip van die
      overblijfselen, voorwerpen en sporen;
        - *archeologische vondst:* overblijfsel, voorwerp of ander spoor van menselijke aanwezigheid in het verleden
      afkomstig van een archeologisch monument;
        - *beschermd cultuurgoed:* cultuurgoed dat: a. als zodanig is aangewezen op grond van
      [artikel 3.7, eerste lid][ref1]; b. voorkomt in een opsomming als bedoeld in [artikel 3.7, derde lid][ref2]; of
      c. in geval van de aanwijzing van een beschermde verzameling op grond van [artikel 3.8, eerste lid][ref3], zolang
      nog geen opsomming voor die verzameling is vastgesteld, redelijkerwijs onder de algemene omschrijving van die
      beschermde verzameling valt;
        - *beschermde verzameling:* verzameling die is aangewezen op grond van [artikel 3.7, tweede lid][ref4];
        - *certificaat:* certificaat als bedoeld in [artikel 5.1, eerste lid][ref5];
        - *college van staat:* het Kabinet van de Koning, de Staten-Generaal, de overige Hoge Colleges van Staat, de
      Kabinetten van de Gouverneurs of de Commissie van toezicht betreffende de inlichtingen- en veiligheidsdiensten;
        - *cultureel erfgoed:* uit het verleden geërfde materiële en immateriële bronnen, in de loop van de tijd tot stand
      gebracht door de mens of ontstaan uit de wisselwerking tussen mens en omgeving, die mensen, onafhankelijk van
      het bezit ervan, identificeren als een weerspiegeling en uitdrukking van zich voortdurend ontwikkelende waarden,
      overtuigingen, kennis en tradities, en die aan hen en toekomstige generaties een referentiekader bieden;
        - *cultuurgoed:* roerende zaak die deel uitmaakt van cultureel erfgoed;
        - *ensemble:* een op grond van [artikel 3.13][ref6] aangewezen rijksmonument met cultuurgoederen;
        - *inspecteur:* inspecteur als bedoeld in [artikel 8.3][ref7];
        - *instelling:* krachtens privaatrecht opgerichte rechtspersoon met volledige rechtsbevoegdheid;
        - *kerkelijk monument:* monument dat eigendom is van een kerkgenootschap, een zelfstandig onderdeel daarvan,
      een lichaam waarin kerkgenootschappen zijn verenigd, of van een ander genootschap op geestelijke grondslag en
      dat uitsluitend of voor een overwegend deel wordt gebruikt voor het gezamenlijk belijden van de godsdienst of
      levensovertuiging;
        - *monument:* onroerende zaak die deel uitmaakt van cultureel erfgoed;
        - *museaal cultuurgoed van de Staat:* cultuurgoed van bijzonder belang dat eigendom is van de Staat of waarvan de
      zorg aan de Staat is toevertrouwd;
        - *normaal onderhoud:* noodzakelijke reguliere werkzaamheden die gericht zijn op het behoud van monumentale waarde;
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *opgraving:* handelingen als bedoeld in [artikel 5.1, eerste lid][ref8];
        - *restauratie:* werkzaamheden die het normale onderhoud te boven gaan en noodzakelijk zijn voor herstel;
        - *rijksmonument:* monument of archeologisch monument dat is ingeschreven in het rijksmonumentenregister;
        - *rijksmonumentenregister:* register als bedoeld in [artikel 3.3][ref9];
        - *Staat:* Staat der Nederlanden;
        - *Verordening (EU) 2019/880:* [Verordening (EU) 2019/880](32780R2019) van het Europees parlement en de Raad van
      17 april 2019, betreffende het binnenbrengen en de invoer van cultuurgoederen (PbEU 2019, L 151);
        - *verzameling:* cultuurgoederen die uit cultuurhistorisch of wetenschappelijk oogpunt bij elkaar horen.


