  - number: '5.6'
    text: |-
      1 Een certificaathouder meldt de aanvang van een opgraving aan Onze Minister.

      2 Binnen twee weken na voltooiing van de opgraving meldt een certificaathouder aan Onze Minister de eerste
      bevindingen.

      3 Een certificaathouder conserveert de aangetroffen archeologische vondsten en draagt deze, alsmede de daarbij
      behorende opgravingsdocumentatie, binnen twee jaar na voltooiing van de opgraving over aan de eigenaar.

      4 Binnen twee jaar na voltooiing van een opgraving legt een certificaathouder aan Onze Minister, aan de eigenaar en
      aan het college van burgemeester en wethouders van de gemeente waar de opgraving heeft plaatsgevonden het rapport,
      bedoeld in [artikel 5.4, eerste lid][ref1], over.

      5 Onze Minister kan ontheffing verlenen van de voorschriften, bedoeld in het tweede tot en met vierde lid, voor
      zover een certificaathouder in een geval redelijkerwijs niet in staat is aan een voorschrift te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5.4
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '5.4'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '5.7'
    text: |-
      Een archeologische vondst die is aangetroffen bij een opgraving en waarop niemand zijn recht van eigendom kan
      bewijzen, is eigendom van:

      a. de provincie waar de vondst is aangetroffen;

      b. de gemeente waar de vondst is aangetroffen, indien die gemeente beschikt over een aangewezen depot als bedoeld
      in [artikel 5.8, tweede lid][ref1]; of

      c. de Staat, indien de vondst is aangetroffen buiten het grondgebied van enige gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5.8
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '5.8'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '5.8'
    text: |-
      1 Gedeputeerde staten houden een depot in stand waarin archeologische vondsten die zijn aangetroffen bij
      opgravingen binnen die provincie kunnen worden opgeslagen op een wijze die uit een oogpunt van behoud en
      toegankelijkheid verantwoord is.

      2 Op verzoek van het college van burgemeester en wethouders kunnen gedeputeerde staten in de desbetreffende
      gemeente een depot aanwijzen waarin archeologische vondsten die in die gemeente zijn aangetroffen bij opgravingen
      kunnen worden opgeslagen op een wijze die uit een oogpunt van behoud en toegankelijkheid verantwoord is.

      3 Onze Minister kan depots aanwijzen voor de opslag van archeologische vondsten aangetroffen bij een opgraving
      buiten enige gemeente en wijst in ieder geval voor de opslag van archeologische vondsten die verband houden met de
      scheepvaart één of meer depots aan, die naar zijn oordeel in het bijzonder geschikt zijn voor die opslag.

      4 Bij of krachtens algemene maatregel van bestuur kunnen voor een verantwoorde opslag van archeologische vondsten
      en de daarbij behorende opgravingsdocumentatie en rapporten eisen worden gesteld met het oog op behoud en
      toegankelijkheid.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel5.8
  - number: '5.9'
    text: |-
      1 Archeologische vondsten die op grond van [artikel 5.7][ref1] eigendom van een gemeente, provincie
      of de Staat zijn alsmede de daarbij behorende opgravingsdocumentatie en rapporten, bedoeld in
      [artikel 5.6, derde en vierde lid][ref2], worden opgeslagen in depots als bedoeld in [artikel 5.8][ref3].

      2 Onze Minister kan bepalen dat archeologische vondsten die verband houden met de scheepvaart en die zijn
      gevonden bij het verrichten van opgravingen alsmede de daarbij behorende opgravingsdocumentatie en rapporten
      worden opgeslagen in een depot dat is aangewezen voor vondsten in verband met de scheepvaart als bedoeld in
      [artikel 5.8, derde lid][ref4].

      3 Onze Minister kan binnen zes maanden na de melding, bedoeld in [artikel 5.6, tweede lid][ref5], bepalen dat een
      archeologische vondst die op grond van [artikel 5.7][ref6] eigendom van een gemeente of provincie is, in verband
      met het belang daarvan voor het publiek, in beheer wordt gegeven aan een museale instelling.

      4 De [Archiefwet 1995][ref7] is niet van toepassing op opgravingsdocumentatie en rapporten die in verband met een
      opgraving tot stand zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5.7
