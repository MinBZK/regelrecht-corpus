  - number: '3.1'
    text: |-
      1 Onze Minister kan ambtshalve besluiten een monument of archeologisch monument dat van algemeen belang is vanwege
      zijn schoonheid, betekenis voor de wetenschap of cultuurhistorische waarde aan te wijzen als rijksmonument.

      2 Onze Minister vraagt over het besluit advies aan het college van burgemeester en wethouders van de gemeente waar
      het monument of archeologisch monument zich bevindt.

      3 Onze Minister vraagt over het besluit tevens advies aan gedeputeerde staten indien het monument of archeologisch
      monument zich bevindt buiten een krachtens de [Wegenverkeerswet 1994](onbekend) vastgestelde bebouwde kom.

      4 Onze Minister besluit over aanwijzing van een kerkelijk monument na overleg met de eigenaar.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Op de voorbereiding van het besluit over aanwijzing als rijksmonument is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.

      2 Het college van burgemeester en wethouders adviseert binnen acht weken.

      3 Onze Minister neemt het besluit zo spoedig mogelijk en uiterlijk binnen zes maanden.

      4 De in het derde lid bedoelde termijn vangt aan met ingang van de dag waarop het ontwerpbesluit ter inzage is
      gelegd.

      5 Onze Minister zendt een exemplaar van zijn besluit aan het college van burgemeester en wethouders van de gemeente
      waar het monument of archeologisch monument zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '3.3'
    text: |-
      1 Onze Minister houdt een register van de rijksmonumenten bij.

      2 Het rijksmonumentenregister kan door eenieder worden geraadpleegd.

      3 Onze Minister schrijft in het register de monumenten en archeologische monumenten in, voor zover geen beroep
      tegen het besluit tot aanwijzing als rijksmonument is ingesteld of een beroep is afgewezen.

      4 Het rijksmonumentenregister bevat gegevens over de inschrijving en ter identificatie van de rijksmonumenten.

      5 Onze Minister zendt een afschrift van de inschrijving in het register aan het college van burgemeester en
      wethouders van de gemeente waar het rijksmonument zich bevindt of, indien het rijksmonument zich niet bevindt op
      het grondgebied van een gemeente, aan de Minister van Infrastructuur en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      1 Onze Minister kan ambtshalve wijzigingen aanbrengen in het rijksmonumentenregister.

      2 Indien de wijziging ziet op het schrappen uit het register van een rijksmonument zijn de [artikelen 3.1][ref1] en
      [3.2][ref2] van overeenkomstige toepassing, tenzij dat rijksmonument als zodanig is tenietgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel3.4
