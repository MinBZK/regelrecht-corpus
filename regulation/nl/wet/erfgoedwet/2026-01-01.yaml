  - number: '7.8'
    text: |-
      1 Onze Minister zorgt dat ter financiering van de kosten van de instandhouding van rijksmonumenten een lening kan
      worden verkregen.

      2 De voorwaarden waaronder en wijze waarop een lening wordt verstrekt, worden in de Staatscourant bekend gemaakt.

      3 Onze Minister kan een bedrag vaststellen dat gedurende een bepaald tijdvak ten hoogste beschikbaar is voor de
      verstrekking van leningen.

      4 Provincies, gemeenten, waterschappen en openbare lichamen die zijn ingesteld met toepassing van de
      [Wet gemeenschappelijke regelingen][ref1], komen niet in aanmerking voor een lening.

      5 Een lening wordt in ieder geval niet verstrekt indien deze voor dezelfde werkzaamheden wordt gevraagd waarvoor op
      grond van [artikel 7.3][ref2] subsidie is verleend en de uitvoering van de werkzaamheden waarvoor de lening wordt
      gevraagd, in dezelfde periode plaatsvindt als de periode waarvoor de subsidie is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel7.3
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel7.8
