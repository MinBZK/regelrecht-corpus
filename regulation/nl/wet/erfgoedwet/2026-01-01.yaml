  - number: '4.18'
    text: |-
      Over een besluit tot vervreemding van een cultuurgoed of verzameling wordt door Onze Minister, gedeputeerde staten,
      het college van burgemeester en wethouders of het bevoegde orgaan van een andere publiekrechtelijke rechtspersoon
      advies gevraagd aan een commissie van onafhankelijke deskundigen, indien:

      a. redelijkerwijs kan worden vermoed dat het cultuurgoed of de verzameling bijzondere cultuurhistorische of
      wetenschappelijke betekenis heeft en onvervangbaar en onmisbaar is voor het Nederlands cultuurbezit; en

      b. vervreemding wordt overwogen aan een andere partij dan de Staat, een provincie, een gemeente, of een andere
      publiekrechtelijke rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.18
  - number: '4.19'
    text: |-
      De commissie adviseert over de vraag of de voorgenomen vervreemding een cultuurgoed of verzameling betreft van
      bijzondere cultuurhistorische of wetenschappelijke betekenis dat of die onvervangbaar en onmisbaar is voor het
      Nederlands cultuurbezit.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.19
  - number: '4.20'
    text: |-
      1 De commissie bestaat uit ten minste drie leden, de voorzitter inbegrepen.

      2 De deskundigheid van de commissie ziet mede op de specifieke eigenschappen van het cultuurgoed of de verzameling
      waarover om advies wordt gevraagd.

      3 De leden verrichten anders dan uit hoofde van het lidmaatschap van de commissie geen werkzaamheden voor de
      betrokken publiekrechtelijke rechtspersoon. Ook anderszins hebben deze leden geen belangen of functies waardoor de
      onafhankelijkheid van hun inbreng of het vertrouwen in die onafhankelijkheid in het geding kan zijn.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.20
  - number: '4.21'
    text: |-
      Indien het advies van de commissie de strekking heeft dat het een cultuurgoed of verzameling betreft van bijzondere
      cultuurhistorische of wetenschappelijke betekenis dat of die onvervangbaar en onmisbaar is voor het Nederlands
      cultuurbezit, wordt daarvan, onder toezending van een afschrift van het advies, aan Onze Minister melding gedaan
      door gedeputeerde staten, het college van burgemeester en wethouders of het bevoegde orgaan van een andere
      publiekrechtelijke rechtspersoon ten minste dertien weken voordat wordt overgegaan tot vervreemding aan een andere
      partij dan de Staat, een provincie, gemeente of andere publiekrechtelijke rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel4.21
  - number: '4.22'
    text: |-
      1 Het is verboden een cultuurgoed dat deel uitmaakt van een openbare collectie die is vermeld in de inventarislijst
      van een museum, een archief of een vaste collectie van een bibliotheek, en waarvan de Staat of een ander openbaar
      lichaam eigenaar is, buiten Nederland te brengen zonder dat de eigenaar daarvoor schriftelijk toestemming heeft
      gegeven.

      2 Indien de eigenaar zich daarover niet verklaart, kan zijn toestemming op verzoek van een belanghebbende worden
      vervangen door een vergunning van Onze Minister.

      3 Het verbod, bedoeld in het eerste lid, geldt ook voor een cultuurgoed dat deel uitmaakt van:

      a. een inventarislijst van cultuurgoederen van cultuurhistorische of wetenschappelijke betekenis waarvan een
      kerkgenootschap, een zelfstandig onderdeel daarvan, of een ander genootschap op religieuze grondslag eigenaar is;

      b. een openbare collectie die is vermeld in de inventarislijst van een museum, een archief of een vaste collectie
      van een bibliotheek, en waarvan de eigendom berust bij een privaatrechtelijke rechtspersoon die in overwegende mate
      wordt gefinancierd door subsidie die door de Staat of een ander overheidslichaam wordt verstrekt, en die door Onze
      Minister voor de toepassing van dit verbod is aangewezen;

      c. de lijst van museale cultuurgoederen van de Staat, bedoeld in [artikel 2.6, tweede lid][ref1].

      4 Het verbod, bedoeld in het eerste lid, geldt bovendien voor:

      a. rijksmonumenten en onderdelen daarvan;

      b. onrechtmatig opgegraven archeologische vondsten; en

      c. archiefbescheiden en onderdelen daarvan als bedoeld in
      [artikel 1, onder c, onder 1 tot en met 3, van de Archiefwet 1995][ref2], die ouder zijn dan vijftig jaar.

      5 [Artikel 4.3][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0037521#Artikel4.3
