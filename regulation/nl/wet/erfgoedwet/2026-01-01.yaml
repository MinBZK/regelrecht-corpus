  - number: '8.6'
    text: |-
      1 De ambtenaren, bedoeld in de [artikelen 8.3][ref1] en [8.4][ref2], zijn bevoegd:

      a. met medeneming van de benodigde apparatuur, een woning binnen te treden zonder toestemming van de bewoner; of

      b. te vorderen dat de bewoner hun beschermde cultuurgoederen, museale cultuurgoederen van de Staat of
      cultuurgoederen als bedoeld in [artikel 4.22][ref3], [artikel 4.23][ref4] of [hoofdstuk 6][ref5], die in de woning
      aanwezig zijn, toont.

      2 Voor het toezicht op de naleving van de bepalingen van [hoofdstuk 6][ref6] zijn de toezichthouders bevoegd:

      a. ruimten en voorwerpen te verzegelen, voor zover dat voor de uitoefening van de in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref7] bedoelde bevoegdheden redelijkerwijs noodzakelijk is; of

      b. zo nodig met behulp van de sterke arm de bevoegdheid, bedoeld in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref8] uit te oefenen.


