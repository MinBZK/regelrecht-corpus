  - number: '2.10'
    text: |-
      1 Een instelling die is belast met de zorg, bedoeld in [artikel 2.8, eerste lid][ref1], voert planmatig beleid voor
      het behoud en beheer van de cultuurgoederen of verzamelingen.

      2 Onze Minister kan nadere regels stellen voor het planmatig beleid of kan daarvoor verplichtingen verbinden aan
      het besluit, bedoeld in [artikel 2.8, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel2.8
