  - number: '6.15'
    text: |-
      1 Onze Minister stelt, nadat hij een cultuurgoed in bewaring heeft genomen als bedoeld in [artikel 6.11][ref1],
      voor de rechter die naar de regels van het [Wetboek van Burgerlijke Rechtsvordering][ref2] bevoegd is, een
      rechtsvordering tot teruggave van dat cultuurgoed in tegen de bezitter, of bij ontstentenis van een bezitter, tegen
      de houder.

      2 De [artikelen 86][ref3], [88, eerste lid][ref4], en [99, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref5],
      noch overeenkomsten op grond waarvan cultuurgoederen afkomstig uit bezet gebied zijn vervreemd of bezwaard, kunnen
      worden tegengeworpen aan Onze Minister die op grond van het eerste lid een cultuurgoed opeist.

      3 De rechter die een rechtsvordering als bedoeld in het eerste lid toewijst, kent ten laste van de Staat aan de
      bezitter of de houder toe:

      a. een schadeloosstelling, indien deze aannemelijk maakt het cultuurgoed in eigendom te hebben of te hebben
      verkregen; dan wel voor zover het betreft andere gevallen:

      b. een naar gelang van de omstandigheden billijke vergoeding, indien deze bij de verkrijging van het cultuurgoed de
      nodige zorgvuldigheid heeft betracht.

      4 Indien de bezitter of de houder van wie de teruggave van een cultuurgoed wordt gevorderd, niet voldoet aan de
      verplichting die [artikel 87 van Boek 3 van het Burgerlijk Wetboek][ref6] hem oplegt, blijft het derde lid, onder
      b, ten aanzien van hem buiten toepassing.

      5 Een rechtsvordering als bedoeld in het eerste lid verjaart niet.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel6.11
      [ref2]: https://wetten.overheid.nl/BWBR0001903
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel86
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel88
      [ref5]: https://wetten.overheid.nl/BWBR0005291#Artikel99
      [ref6]: https://wetten.overheid.nl/BWBR0005291#Artikel87
