        artikel: '5.4'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '5.4'
    text: |-
      1 Een certificaathouder zorgt ervoor dat bij het verrichten van een opgraving de verrichte handelingen en
      aangetroffen archeologische vondsten worden gedocumenteerd, de vondsten worden geconserveerd en een rapport wordt
      opgesteld waarin de resultaten van de handelingen zijn beschreven.

      2 Een certificaathouder verricht de opgraving en de overige handelingen, bedoeld in het eerste lid, op
      professionele wijze.

      3 Een certificerende instelling treft passende maatregelen indien een certificaathouder opgravingen of de overige
      handelingen, bedoeld in het eerste lid, niet op professionele wijze verricht en schorst of trekt een certificaat zo
      nodig in.
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel5.4
  - number: '5.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over:

      a. het verrichten van een opgraving op professionele wijze;

      b. het vaststellen van een richtlijn, zoals een beoordelingsrichtlijn of protocol met eisen ter bevordering van de
      professionaliteit van het verrichten van een opgraving waaraan een aanvrager dient te voldoen om in aanmerking te
      komen voor een certificaat;

      c. het handelen overeenkomstig een richtlijn als bedoeld in onderdeel b;

      d. het indienen van een aanvraag voor een aanwijzing als bedoeld in [artikel 5.2][ref1], de gegevens die bij een
      aanvraag dienen te worden verstrekt, de gronden waarop en de voorwaarden waaronder Onze Minister een aanwijzing
      kan verlenen, wijzigen, weigeren, schorsen of intrekken, de voorschriften die aan een aanwijzing kunnen worden
      verbonden en de termijn waarvoor een aanwijzing kan worden verleend of geschorst;

      e. de werkzaamheden door een certificerende instelling die onder het verstrekken van certificaten als bedoeld in
      [artikel 5.2][ref2] worden verstaan;

      f. tarieven die door een certificerende instelling in rekening kunnen worden gebracht voor het afgeven van een
      certificaat;

      g. het doen van een mededeling aan Onze Minister van een intrekking of een schorsing van een certificaat of
      accreditatie;

      h. de uitwisseling van informatie tussen certificerende instellingen onderling en met Onze Minister in het kader
      van toezicht en handhaving.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel5.2
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel5.2
    url: https://wetten.overheid.nl/BWBR0037521/2026-01-01#Artikel5.5
