  - number: '3'
    text: |-
      1 De datum van eerste toelating wordt vastgesteld op de datum van eerste afgifte van het kentekenbewijs, indien de
      aanvrager één van de hiernavolgende documenten overlegt:

      a. een niet tenaamgestelde Fahrzeugbrief, behorend bij een uit Duitsland afkomstig voertuig, waarop geen datum van
      eerste toelating is vermeld,

      b. een Certificate of Origin, behorend bij een uit de Verenigde Staten van Amerika afkomstig voertuig,

      c. een Dichiarazione per Immatricola-zione, behorende bij een uit Italië afkomstig voertuig,

      d. een New Vehicle Information Statement (NVIS-document), behorend bij een uit Canada afkomstig voertuig,

      e. een Demande de Certificat D'immatriculation d'un véhicule neuf, behorend bij een uit Frankrijk afkomstig
      voertuig,

      f. een document dat naar het oordeel van de Dienst Wegverkeer gelijkwaardig moet worden beschouwd aan de onder a
      tot en met e genoemde bewijzen,

      g. een verklaring van de fabrikant of de door de fabrikant gemachtigde importeur dat het ter keuring aangeboden
      voertuig niet reeds eerder is toegelaten tot het verkeer op de weg,

      h. een originele aankoopnota uit het laatste land waar het voertuig is verkocht voorafgaande aan de overbrenging
      naar Nederland, met daarop vermeld:

        - het BTW-nummer van de verkoper,
        - het identificatienummer van het voertuig,
        - de verklaring van de verkoper dat het voertuig niet eerder is geregistreerd, en

      een verklaring van niet-registratie van een instantie die voertuigen registreert in het land waar de aankoopnota
      vandaan komt,

      of

      i. voor zover het voertuig wordt onderzocht binnen 3 maanden na de afgifte van het hierna bedoelde kentekenbewijs:
      een buitenlands kentekenbewijs waaruit blijkt dat de registratie van het voertuig dan wel de geldigheid van het
      kentekenbewijs binnen 2 dagen na afgifte van dat bewijs tot het moment van onderzoek is geschorst.

      Indien uit het hiervoor bedoelde kentekenbewijs niet blijkt dat het voertuig vóór de afgifte van dat bewijs niet
      eerder is geregistreerd, dient tevens een uit hetzelfde land afkomstige originele aankoopnota te worden overgelegd
      met daarop vermeld:

        - het BTW-nummer van de verkoper,
        - het identificatienummer van het voertuig,
        - de verklaring van de verkoper dat het voertuig vóór de afgifte van het hiervoor bedoelde kentekenbewijs niet
      eerder is geregistreerd.

      2 Voor zover de in het eerste lid, onderdeel h, bedoelde aankoopnota wordt overgelegd, behoeft de in dat onderdeel
      bedoelde verklaring van niet-registratie niet te worden overgelegd, indien:

        - de aanvrager verklaart dat het voertuig niet eerder is geregistreerd, en
        - de aankoopnota afkomstig is uit een land waarvan het aldaar gehouden kentekenregister middels datacommunicatie
      rechtstreeks aan de hand van het identificatienummer is te raadplegen door hiertoe aangewezen ambtenaren van de
      Dienst Wegverkeer en uit raadpleging blijkt dat het voertuig in dat land niet geregistreerd is of is geweest.
    url: https://wetten.overheid.nl/BWBR0008558/2005-09-01#Artikel3
  - number: '4'
    text: |-
      1 Indien de aanvrager een door een bevoegde autoriteit afgegeven document overlegt waaruit de datum van eerste
      toelating blijkt, wordt de datum van eerste toelating vastgesteld op deze datum.

      2 Indien uit het in het eerste lid bedoelde document slechts een maand van eerste toelating blijkt, wordt de datum
      van eerste toelating gesteld op de eerste dag van die maand. Indien uit het document slechts een jaar van eerste
      toelating blijkt, wordt de datum van eerste toelating gesteld op 30 juni van dat jaar.

      3 Indien uit het in het eerste lid bedoelde document niet de datum, de maand of het jaar van eerste toelating
      blijkt, doch wel de datum van fabricage, wordt de datum van eerste toelating vastgesteld op de datum van fabricage.
      Indien uit het document slechts een maand van fabricage blijkt, wordt de datum van fabricage gesteld op de eerste
      dag van die maand. Indien uit het document slechts een jaar van fabricage blijkt, wordt de datum van fabricage
      gesteld op 30 juni van dat jaar.

      4 Indien uit het in het eerste lid bedoelde document niet de datum, de maand of het jaar van eerste toelating of
      van fabricage blijkt, doch wel het modeljaar, wordt de datum van eerste toelating vastgesteld op 28 februari van
      het modeljaar.
    url: https://wetten.overheid.nl/BWBR0008558/2005-09-01#Artikel4
  - number: '5'
    text: |-
      1 Indien de aanvrager niet één van de in de [artikelen 3][ref1] en [4][ref2] genoemde documenten overlegt, dan wel
      indien aan de hand van het bepaalde in [artikel 4][ref3] geen datum van eerste toelating kan worden vastgesteld,
      wordt de datum van eerste toelating, overeenkomstig het bepaalde in het tweede tot en met vierde lid, vastgesteld
      aan de hand van het identificatienummer.

      2 Indien uit het identificatienummer een datum van fabricage blijkt, wordt de datum van eerste toelating
      vastgesteld op de datum van fabricage. Indien uit het nummer slechts een maand van fabricage blijkt, wordt de datum
      van fabricage gesteld op de eerste dag van die maand. Indien uit het nummer slechts een jaar van fabricage blijkt,
      wordt de datum van fabricage gesteld op 30 juni van dat jaar.

      3 Indien uit het identificatienummer niet de datum, de maand of het jaar van fabricage blijkt, doch wel het
      modeljaar, wordt de datum van eerste toelating vastgesteld op 28 februari van het modeljaar.

      4 Indien uit het identificatienummer niet de datum, de maand of het jaar van fabricage of het modeljaar blijkt,
      wordt door de Dienst Wegverkeer de datum van fabricage bepaald en wordt de datum van eerste toelating vastgesteld
      op deze datum.


      [ref1]: https://wetten.overheid.nl/BWBR0008558#Artikel3
