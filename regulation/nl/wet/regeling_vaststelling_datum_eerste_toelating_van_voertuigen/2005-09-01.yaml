articles:
  - number: '1'
    text: |-
      Voor zover de vaststelling van de datum van eerste toelating geschiedt in het kader van de aanvraag van een
      kentekenbewijs zonder afzonderlijk onderzoek van het betrokken motorrijtuig of de betrokken aanhangwagen, wordt de
      datum van eerste toelating vastgesteld op de datum van eerste afgifte van het kentekenbewijs.
    url: https://wetten.overheid.nl/BWBR0008558/2005-09-01#Artikel1
  - number: '2'
    text: |-
      Voor zover de vaststelling van de datum van eerste toelating geschiedt in het kader van de aanvraag van een
      kentekenbewijs met een afzonderlijk onderzoek van het betrokken motorrijtuig of de betrokken aanhangwagen, wordt de
      datum van eerste toelating vastgesteld overeenkomstig het bepaalde in de [artikelen 3][ref1] tot en met [9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008558#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008558#Artikel9
    url: https://wetten.overheid.nl/BWBR0008558/2005-09-01#Artikel2
