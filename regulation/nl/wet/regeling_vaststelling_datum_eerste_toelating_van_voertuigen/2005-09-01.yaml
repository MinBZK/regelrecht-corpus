  - number: '8'
    text: |-
      Indien een voertuig in gebruik is genomen reeds voor het tot het verkeer op de weg is toegelaten, wordt de datum
      van eerste toelating vastgesteld op de datum van fabricage of het modeljaar, overeenkomstig het bepaalde in
      [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008558#Artikel5
    url: https://wetten.overheid.nl/BWBR0008558/2005-09-01#Artikel8
    references:
