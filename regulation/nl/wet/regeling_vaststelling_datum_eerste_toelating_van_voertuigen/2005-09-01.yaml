  - number: '7'
    text: |-
      1 Indien een voertuig reeds eerder in Nederland tot het verkeer op de weg is toegelaten, wordt, in afwijking van de
      voorgaande artikelen, de datum van eerste toelating vastgesteld op de datum van eerste toelating welke blijkt uit
      het kentekenregister of het eerder afgegeven kentekenbewijs.

      2 In afwijking van het eerste lid stelt de Dienst Wegverkeer, overeenkomstig het bepaalde in
      [artikel 5][ref1], de datum van eerste toelating vast van een bromfiets die is gekentekend overeenkomstig
