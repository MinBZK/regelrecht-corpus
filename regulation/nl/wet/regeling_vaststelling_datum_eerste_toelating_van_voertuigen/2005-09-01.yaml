  - number: '6'
    text: |-
      Indien de overeenkomstig de [artikelen 4][ref1] of [5][ref2] vastgestelde datum van eerste toelating na de datum
      van het eerste onderzoek van het voertuig ligt, wordt de datum van eerste toelating vastgesteld op de datum van het
      eerste onderzoek.


