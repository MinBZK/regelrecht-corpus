      ___________________________________________________________________________________________________________________
      ____________________________ (Stb. 281), indien de bromfiets ter keuring aan de Dienst Wegverkeer wordt aangeboden
      in verband met een wijziging van de constructie als bedoeld in [hoofdstuk 6 van het Voertuigreglement][ref3].


