  - number: '10'
    text: |-
      1 Indien er in het kader van de aanvraag van een kentekenbewijs twijfel bestaat over de vraag of het voertuig niet
      eerder tot het verkeer op de weg is toegelaten, dan wel of de vastgestelde datum van eerste toelating correct is,
      kan de Dienst Wegverkeer door middel van raadpleging van registers in andere landen onderzoeken of en wanneer het
      voertuig eerder tot het verkeer op de weg is toegelaten.

      2 Indien het in het eerste lid bedoelde onderzoek binnen drie weken nadat het voertuig technisch en administratief
      in orde is bevonden geen resultaat oplevert, wordt een kentekenbewijs afgegeven en wordt de overeenkomstig de
      voorgaande artikelen vastgestelde datum van eerste toelating vermeld. Wordt nadien alsnog een afwijkende datum van
      eerste toelating gevonden dan kan het kentekenbewijs ongeldig worden verklaard en op het nieuwe kentekenbewijs de
      gevonden datum van eerste toelating worden vermeld.
    url: https://wetten.overheid.nl/BWBR0008558/2005-09-01#Artikel10
  - number: '11'
    text: |-
      De regeling van de minister van Verkeer en Waterstaat van 9 december 1994, nr RV 188308, houdende vaststelling van
      regels omtrent de wijze waarop de datum van eerste toelating tot de openbare weg op het kentekenbewijs, dan wel het
      registratiebewijs van een voertuig wordt bepaald (Stcrt. 241), wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008558/2005-09-01#Artikel11
  - number: '12'
    text: Deze regeling treedt in werking met ingang van 1 juli 1997.
    url: https://wetten.overheid.nl/BWBR0008558/2005-09-01#Artikel12
  - number: '13'
    text: 'Deze regeling wordt aangehaald als: Regeling vaststelling datum eerste toelating van voertuigen.'
    url: https://wetten.overheid.nl/BWBR0008558/2005-09-01#Artikel13
