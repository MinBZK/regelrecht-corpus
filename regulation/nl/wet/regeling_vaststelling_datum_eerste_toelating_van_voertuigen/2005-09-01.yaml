        bwb_id: BWBR0008558
        artikel: '5'
        hoofdstuk: '2'
  - number: '9'
    text: |-
      Indien een kentekenbewijs wordt aangevraagd voor een samengesteld voertuig of voor een voertuig, waarvan het
      originele identificatienummer ontbreekt of onleesbaar is geworden, wordt de datum van eerste toelating vastgesteld
      overeenkomstig de voorgaande artikelen nadat de identiteit van het voertuig aan de hand van een nader onderzoek
      overeenkomstig de hiervoor vastgestelde regels is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008558/2005-09-01#Artikel9
