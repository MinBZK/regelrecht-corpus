        artikel: '26'
  - number: '7'
    text: |-
      De opgave ten behoeve van de telling, bedoeld in [artikel 2][ref1] van deze regeling, de aanvragen, bedoeld in
      [artikel 6, onder a, c en d][ref2] van deze regeling en de verstrekking van gegevens, bedoeld in artikel 6, onder
      b, van deze regeling, kunnen gezamenlijk elektronisch worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0027441#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027441#Artikel6
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0027441
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0027441
        artikel: '6'
        paragraaf: '1'
  - number: '8'
    text: |-
      1 De gezamenlijke elektronische indiening geschiedt met het daartoe bestemde elektronische formulier.

      2 Het formulier wordt elektronisch ondertekend met een door de minister aan de ondertekenaar ter beschikking
      gestelde eenmalig bruikbare tancode.

      3 De minister bevestigt de ontvangst van een elektronisch ingediend formulier.
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel8
  - number: '9'
    text: |-
      Een tancode wordt uitsluitend overeenkomstig deze regeling gebruikt voor het doel waarvoor en door degene aan wie
      de tancode is verstrekt.
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel9
  - number: '10'
    text: |-
      De minister verstrekt op een met redenen omkleed verzoek van de aanvrager een set tancodes ten behoeve van de
      elektronische handtekening, ingeval

      a. deze geen tancodes heeft ontvangen;

      b. de verstrekte tancodes zijn gebruikt, of

      c. van verlies van eerder verstrekte tancodes.
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel10
  - number: '11'
    text: |-
      De minister kan besluiten een set tancodes niet te verstrekken of in te trekken, indien de indiener of een met hem
      geassocieerd bedrijf of organisatie in het verleden een tancode heeft gebruikt in strijd met deze regeling of op
      andere wijze de integriteit van een verstrekte handtekening heeft geschonden.
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel11
  - number: '12'
    text: |-
      1 Een belanghebbende kan de aan hem verstrekte tancodes doen gebruiken door een gemachtigde als bedoeld in
      [artikel 2:1 van de Algemene wet bestuursrecht][ref1] ten behoeve van het indienen van een elektronische formulier
      namens belanghebbende.

      2 De gemachtigde maakt bij het indienen van de aanvraag, de opgave onderscheidenlijk de verstrekking als bedoeld
      in [artikel 7][ref2] slechts gebruik van de aan de gemachtigde ter beschikking gestelde toegangscodes tot het
      elektronische formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0027441#Artikel7
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 2:1
      - id: ref2
        bwb_id: BWBR0027441
        artikel: '7'
        paragraaf: '2'
  - number: '13'
    text: |-
      1 De minister kan een elektronisch formulier weigeren, indien dit niet overeenkomstig deze regeling is ingediend.

      2 De minister kan een elektronisch verzonden bericht weigeren voor zover de betrouwbaarheid of vertrouwelijkheid
      van dit bericht onvoldoende is gewaarborgd, gelet op de aard en de inhoud van het bericht en het doel waarvoor het
      wordt gebruikt.

      3 De minister deelt een weigering op grond van dit artikel zo spoedig mogelijk aan de afzender mede.
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel13
  - number: '14'
    text: |-
      Als tijdstip waarop een elektronisch formulier door de minister elektronisch is ontvangen, geldt het tijdstip
      waarop alle vereiste bescheiden als bedoeld in de artikelen 12 en 13 van Verordening (EG) nr. 1122/2009 van de
      Commissie van 30 november 2009 tot vaststelling van bepalingen ter uitvoering van Verordening (EG) nr. 73/2009
      van de Raad wat betreft de randvoorwaarden, de modulatie en het geïntegreerd beheers- en controlesysteem in het
      kader van de bij die verordening ingestelde regelingen inzake rechtstreekse steunverlening aan landbouwers en
      ter uitvoering van Verordening (EG) nr. 1234/2007 van de Raad wat betreft de randvoorwaarden in het kader van de
      steunregeling voor de wijnsector (PbEU L 316) zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel14
  - number: '15'
    text: |-
      De minister kan besluiten de elektronische aanvraag, opgave onderscheidenlijk verstrekking niet te behandelen,
      indien het elektronisch formulier geheel of gedeeltelijk is geweigerd op grond van [artikel 13][ref1].
      [Artikel 4:5 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027441#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0027441
        artikel: '13'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '16'
    text: |-
      De [Regeling landbouwtelling en gecombineerde opgave 2009][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0025553
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0025553
  - number: '17'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel17
  - number: '18'
    text: 'Deze regeling wordt aangehaald als: Regeling landbouwtelling en gecombineerde opgave 2010.'
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel18
