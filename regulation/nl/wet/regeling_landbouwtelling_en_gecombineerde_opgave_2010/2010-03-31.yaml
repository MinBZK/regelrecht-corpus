preamble:
  text: |-
    Gelet op Verordening (EG) nr. 1698/2005 van de Raad van 20 september 2005 inzake steun voor plattelandsontwikkeling
    uit het Europees Landbouwfonds voor Plattelandsontwikkeling (ELFPO) (PbEU L 277);

    Gelet op Verordening 1975/2006 van de Commissie van 7 december 2006 houdende uitvoeringsbepalingen van Verordening
    (EG) nr. 1698/2005 van de Raad met betrekking tot de toepassing van controleprocedures en van de randvoorwaarden in
    het kader van de steunmaatregelen voor plattelandsontwikkeling;

    Gelet op de artikelen 38g, onderdeel b, 55 tot en met 57 van de Regeling GLB-inkomenssteun 2006 en artikel 26 van
    het Uitvoeringsbesluit Meststoffenwet;

    Voorts gelet op de artikelen 24 en 25 van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *Dienst Regelingen:* Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      b. *beschrijvingsbiljet:* formulier, waarvan het model als [bijlagen I tot en met VII][ref1] bij deze regeling
      is opgenomen;

      c. *opgaveplichtige:* persoon die, anders dan in het kader van de teelt van griendhout, riet en biezen, in de
      landbouw zijn hoofdbestaan of een gedeelte van zijn bestaan vindt, voor zover aan hem een beschrijvingsbiljet,
      bedoeld in onderdeel b, dan wel anderszins een oproep voor de landbouwtelling is uitgereikt of toegezonden;

      d. *probleemgebiedenvergoeding:* betaling als bedoeld in artikel 36, onderdeel a, subonderdelen i) en ii), van
      Verordening (EG) nr. 1698/2005 van de Raad van 20 september 2005 inzake steun voor plattelandsontwikkeling uit het
      Europees Landbouwfonds voor Plattelandsontwikkeling (ELFPO) (PbEU L 277);

      e. *minister:* Minister van Landbouw, Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0027441
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0027441
  - number: '2'
    text: |-
      In het tijdvak dat loopt van 1 april 2010 tot en met 15 mei 2010 wordt een landbouwtelling gehouden als bedoeld in
      de [artikelen 24][ref1] en [25 van de Landbouwwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel25
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '25'
  - number: '3'
    text: |-
      Ten behoeve van de telling, bedoeld in [artikel 2][ref1], wordt door de minister aan landbouwers een oproep
      uitgereikt of toegezonden tot deelname aan de landbouwtelling.

      Voor de toepassing van [artikel 24 van de Landbouwwet][ref2] geldt de uitreiking of toezending van deze oproep als
      uitreiking of toezending van het beschrijvingsbiljet, bedoeld in dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0027441#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel24
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0027441
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '24'
  - number: '4'
    text: |-
      1 De opgaveplichtige verstrekt de ten aanzien van de veestapel gevraagde gegevens naar de toestand op 1 april 2010.

      2 De opgaveplichtige verstrekt de ten aanzien van de oppervlakten gevraagde gegevens naar de verwachte toestand
      op 15 mei 2010. Indien een beteelde oppervlakte op 15 mei 2010 nog niet zal zijn beteeld, wordt de eerstvolgende
      geplande teelt opgegeven.

      3 Onverminderd het eerste en tweede lid, verstrekt de opgaveplichtige de op het beschrijvingsbiljet gevraagde
      gegevens naar de toestand op de datum van verzending, tenzij op het biljet anders is aangegeven, en neemt daarbij
      de overige op het biljet of door Dienst Regelingen gegeven aanwijzingen in acht.
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel4
  - number: '5'
    text: |-
      1 De bedrijfsomvang wordt bepaald op basis van de totale standaardopbrengst van het bedrijf. Deze omvang wordt
      uitgedrukt in euro's.

      2 De standaardopbrengst wordt vastgesteld met inachtneming van [bijlage VIII][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0027441
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0027441
  - number: '6'
    text: |-
      Onverminderd het bepaalde in [artikel 4][ref1] maakt de uit dien hoofde opgaveplichtige die tevens gehouden is:

      a. gegevens te verstrekken met betrekking tot subsidieaanvragen op grond van de bedrijfstoeslagregeling,
      de productiesteun voor zetmeelaardappelen en zaaizaad van vezelvlas en de specifieke steunregelingen
      als opgenomen in [Hoofdstuk 2a van de Regeling GLB-inkomenssteun 2006][ref2], bedoeld in
      [artikel 2, eerste lid, onder 2, onderdelen a tot en met c, van de Regeling GLB-inkomenssteun 2006][ref3],

      b. gegevens te verstrekken, als bedoeld in [artikel 26, eerste lid, van het UitvoeringsbesluitMeststoffenwet][ref4],

      c. gegevens te verstrekken met betrekking tot de aanvraag voor probleemgebiedenvergoeding, of

      d. gegevens te verstrekken met betrekking tot subsidieaanvragen op grond van de Subsidieverordening natuur- en
      landschapsbeheer, de Subsidieregeling agrarisch natuurbeheer of de Subsidieregeling agrarisch natuurbeheer van de
      onderscheiden provincies,

      voor het verstrekken van alle onderscheiden gegevens gebruik van het beschrijvingsbiljet.


      [ref1]: https://wetten.overheid.nl/BWBR0027441#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Hoofdstuk2a
      [ref3]: https://wetten.overheid.nl/BWBR0019131#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0019031#Artikel26
    url: https://wetten.overheid.nl/BWBR0027441/2010-03-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027441
        artikel: '4'
        paragraaf: '1'
      - id: ref2
