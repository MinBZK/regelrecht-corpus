  - number: '34'
    text: |-
      De directeur-generaal kan het burgerservicenummer opnemen in een registratie en daarvan gebruik maken ten behoeve
      van statistische doeleinden. De directeur-generaal kan het burgerservicenummer gebruiken in contacten met personen
      en instanties voor zover deze zelf gemachtigd zijn tot het gebruik van dat nummer in een registratie.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel34
  - number: '35'
    text: |-
      De directeur-generaal kan ten behoeve van statistische doeleinden persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens][ref1] verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
  - number: '36'
    text: |-
      Met inachtneming van een goede vervulling van zijn taak draagt de directeur-generaal er zorg voor dat de verwerving
      van gegevens op zodanige wijze geschiedt dat de daaruit voortvloeiende administratieve lasten voor ondernemingen,
      vrije beroepsbeoefenaren, instellingen en rechtspersonen die volgens hun statuten tot doel hebben de belangen van
      de betrokken ondernemingen, vrije beroepsbeoefenaren en instellingen te behartigen, zo laag mogelijk zijn.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel36
  - number: '37'
    text: |-
      1 De door de directeur-generaal in het kader van de uitoefening van de taken ter uitvoering van deze wet ontvangen
      gegevens worden uitsluitend gebruikt voor statistische doeleinden.

      2 De in het eerste lid bedoelde gegevens worden niet verstrekt aan anderen dan degenen die belast zijn met de
      uitvoering van de taak van het CBS.

      3 De in het eerste lid bedoelde gegevens worden slechts zodanig openbaar gemaakt dat daaraan geen herkenbare
      gegevens over een afzonderlijk persoon, huishouden, onderneming of instelling kunnen worden ontleend, tenzij,
      ingeval het gegevens met betrekking tot een onderneming of instelling betreft, er een gegronde reden is om aan te
      nemen dat bij de betrokken onderneming of instelling geen bedenkingen bestaan tegen de openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel37
  - number: '38'
    text: |-
      De directeur-generaal draagt op de voet van de ter zake voor de Rijksdienst geldende voorschriften zorg voor de
      nodige technische en organisatorische voorzieningen ter beveiliging van zijn gegevens tegen verlies of aantasting
      en tegen onbevoegde kennisneming, wijziging en verstrekking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel38
  - number: 38a
    text: |-
      1 In deze paragraaf wordt verstaan onder [verordening 638/2004](32004R0638): [verordening (EG) nr. 638/2004]
      (32004R0638) van het Europees Parlement en de Raad van de Europese Unie van 31 maart 2004 betreffende de
      communautaire statistieken van het goederenverkeer tussen de lidstaten en houdende intrekking van [Verordening
      (EEG) nr. 3330/91](31991R3330) (PbEG L 102).

      2 De [artikelen 33, derde tot en met vijfde lid][ref1] en [37, derde lid][ref2], zijn niet van toepassing op de
      uitvoering van [verordening 638/2004](32004R0638).


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0015926#Artikel37
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel38a
