        hoofdstuk: '5'
        paragraaf: '3'
  - number: '43'
    text: |-
      1 De directeur-generaal kan een bestuurlijke boete opleggen van ten hoogste € 5 000 aan de in
      [artikel 33, tweede lid][ref1], bedoelde rechtspersonen en de in [artikel 33, derde lid][ref2], bedoelde
      ondernemingen, vrije beroepsbeoefenaren, instellingen en rechtspersonen die de in die leden bedoelde gegevens niet,
      niet tijdig of niet volledig verstrekken.

      2 De directeur-generaal kan een bestuurlijke boete opleggen van ten hoogste € 5 000 aan degene die niet, niet
      tijdig of niet volledig een opgave als bedoeld in [artikel 38b][ref3] doet.

      3 Onze Minister kan, in overeenstemming met Onze Minister van Veiligheid en Justitie, regels stellen ter zake van
      de uitoefening van de bevoegdheid tot oplegging van een bestuurlijke boete.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0015926#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0015926#Artikel38b
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015926
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0015926
        artikel: 38b
        hoofdstuk: '5'
        paragraaf: 2a
  - number: '48'
    text: |-
      De werking van de beschikking tot oplegging van een bestuurlijke boete wordt opgeschort totdat de beroepstermijn is
      verstreken, of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel48
  - number: '51'
    text: |-
      De directeur-generaal kan in plaats van een bestuurlijke boete aan de in [artikel 33, derde lid][ref1], bedoelde
      ondernemingen, vrije beroepsbeoefenaren, instellingen en rechtspersonen die de in dat artikellid bedoelde gegevens
      niet, niet tijdig of niet volledig verstrekken of aan degene die niet, niet tijdig of niet volledig een opgave als
      bedoeld in [artikel 38b][ref2] doet, een last onder dwangsom opleggen. Een bestuurlijke boete en een last onder
      dwangsom kunnen tevens gezamenlijk worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0015926#Artikel38b
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015926
        artikel: 38b
        hoofdstuk: '5'
        paragraaf: 2a
  - number: '52'
    text: |-
      1 Aan een last onder dwangsom kunnen voorschriften worden verbonden inzake het verstrekken van gegevens aan de
      directeur-generaal.

      2 Een last geldt voor een door de directeur-generaal te bepalen termijn van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel52
  - number: 52a
    text: |-
      Het CBS verleent op verzoek van de Europese Commissie bijstand bij een inspectie op grond van artikel 5, vierde
      lid, van Gedelegeerd besluit 2012/678/EU van de Commissie van 29 juni 2012 betreffende onderzoeken en boeten
      in verband met de manipulatie van statistieken als bedoeld in Verordening (EU) nr. 1173/2011 van het Europees
      Parlement en de Raad inzake de effectieve handhaving van het begrotingstoezicht in het eurogebied (Pb EU 2012,
      L 306).
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel52a
  - number: 52b
    text: |-
      1 De directeur-generaal wijst, in geval van een verzoek om bijstand als bedoeld in [artikel 52a][ref1], bij besluit
      de ambtenaren aan die zijn belast met het verlenen van deze bijstand.

      2 De ambtenaren, bedoeld in het eerste lid, hebben de bevoegdheden, genoemd in artikel 5, eerste lid, onderdelen
      a tot en met e, van Gedelegeerd besluit 2012/678/EU van de Commissie van 29 juni 2012 betreffende onderzoeken
      en boeten in verband met de manipulatie van statistieken als bedoeld in Verordening (EU) nr. 1173/2011 van het
      Europees Parlement en de Raad inzake de effectieve handhaving van het begrotingstoezicht in het eurogebied (Pb EU
      2012, L 306).


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel52a
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: 52a
        hoofdstuk: 5a
  - number: 52c
    text: |-
      Op gegevens die verkregen zijn bij het verlenen van bijstand als bedoeld in [artikel 52a][ref1] is
      [artikel 37][ref2] niet van toepassing, met dien verstande dat deze gegevens alleen aan de Europese Commissie
      verstrekt worden.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel52a
      [ref2]: https://wetten.overheid.nl/BWBR0015926#Artikel37
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel52c
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: 52a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0015926
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '53'
    text: |-
      Het jaarverslag van de directeur-generaal verschaft tevens inzicht in de administratieve lasten in dat jaar
      voor ondernemingen en instellingen als gevolg van de verwerving van gegevens door de directeur-generaal, in
      de voorzieningen die de directeur-generaal heeft getroffen ingevolge [artikel 36][ref1] en in de mate van
      terugdringing van de administratieve lasten.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel36
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '36'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '55'
    text: |-
      Onze Minister kan nadere regels stellen over de inrichting van het jaarverslag, bedoeld in [artikel 53][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel53
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '53'
        hoofdstuk: '6'
  - number: '56'
    text: |-
      Onverminderd [artikel 18, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1], maakt de directeur-
      generaal het jaarverslag openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '57'
    text: |-
      Onze Minister kan nadere regels stellen met betrekking tot de gegevensuitwisseling, bedoeld in
      [artikel 20, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
  - number: '58'
    text: |-
      Onverminderd [artikel 39, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] bevat het daarbedoelde
      verslag een evaluatie van de onafhankelijkheid van het functioneren van het CBS.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel39
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '39'
  - number: '60'
    text: |-
      De kosten voor de uitoefening van de taken ter uitvoering van deze wet komen ten laste van de rijksbegroting, met
      uitzondering van de kosten voor de uitvoering van de statistische werkzaamheden voor derden.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel60
  - number: '63'
    text: Onze Minister kan nadere regels stellen over de inrichting van de begroting.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel63
  - number: '64'
    text: De directeur-generaal zendt de begroting jaarlijks vóór 1 april aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel64
  - number: '65'
    text: |-
      Onverminderd [artikel 29, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1] kan de goedkeuring worden
      onthouden indien Onze Minister bezwaar heeft tegen de hoogte van het voorgestelde bedrag dat in de rijksbegroting
      zal worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel29
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '29'
  - number: '67'
    text: |-
      1 De directeur-generaal houdt de financiële middelen van het CBS aan in rekening-courant bij Onze Minister van
      Financiën.

      2 De directeur-generaal kan voor de uitoefening van de taken ter uitvoering van deze wet beschikken over de
      financiële middelen die hij in rekening-courant bij Onze Minister van Financiën aanhoudt.

      3 Onze Minister van Financiën stelt in overeenstemming met Onze Minister, na overleg met de directeur-generaal,
      regels omtrent de rente die over de saldi van de in dit artikel bedoelde rekening-courant wordt vergoed
      onderscheidenlijk in rekening wordt gebracht.

      4 Onze Minister van Financiën brengt voor het beheer van de in dit artikel bedoelde rekening-courant geen kosten
      in rekening.

      5 De directeur-generaal kan met de goedkeuring en onder garantie van Onze Minister ten behoeve van de financiering
      van investeringen, leningen bij Onze Minister van Financiën verkrijgen, indien de investeringen benodigd zijn voor
      de uitoefening van de taken ter uitvoering van deze wet.

      6 Onze Minister van Financiën kan in overeenstemming met Onze Minister nadere regels stellen omtrent het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel67
  - number: '68'
    text: |-
      De directeur-generaal behoeft voorafgaande instemming van Onze Minister voor de handelingen, bedoeld in
      [artikel 32 van de Kaderwet zelfstandige bestuursorganen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel32
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '32'
  - number: '70'
    text: De directeur-generaal zendt de jaarrekening jaarlijks vóór 1 april aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel70
  - number: '73'
    text: |-
      Onze Minister kan nadere regels stellen over de inrichting van de jaarrekening en aandachtspunten voor de
      accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel73
  - number: '75'
    text: |-
      De [wet van 28 december 1936, houdende maatregelen tot het verkrijgen van juiste economische statistieken][ref1]
      (Stb. 639DD), wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001982
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0001982
  - number: '76'
    text: |-
      De [Wet verstrekking gegevens CBS voor statistische doeleinden][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004339
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004339
  - number: '77'
    text: |-
      De [Wet op het Centraal bureau en de Centrale commissie voor de statistiek][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008005
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0008005
  - number: '78'
    text: |-
      1 Met ingang van het tijdstip van verzelfstandiging van het CBS zijn de personeelsleden van het onder Onze Minister
      ressorterende CBS van rechtswege ontslagen en aangesteld als ambtenaar in dienst van het verzelfstandigde CBS.

      2 De overgang van de in het eerste lid bedoelde personeelsleden vindt plaats met een rechtspositie die als
      geheel ten minste gelijkwaardig is aan die welke voor elk van hen gold bij het onder Onze Minister ressorterende
      dienstonderdeel.

      3 De personen die op het tijdstip van verzelfstandiging van het CBS krachtens een arbeidsovereenkomst naar
      burgerlijk recht behoren tot het personeel van het onder Onze Minister ressorterende CBS, zijn met ingang van
      dat tijdstip van rechtswege ontslagen en aangesteld in dienst van het verzelfstandigde CBS met een rechtspositie
      die als geheel ten minste gelijkwaardig is aan die welke voor elk van hen gold bij het onder Onze Minister
      ressorterende dienstonderdeel.

      4 De door Onze Minister vastgestelde rechtspositieregels die op het tijdstip van verzelfstandiging van het CBS
      gelden voor het personeel van het onder Onze Minister ressorterende CBS blijven met ingang van dat tijdstip van
      overeenkomstige toepassing op het personeel in dienst van het verzelfstandigde CBS totdat daarin op grond van
      [artikel 7, eerste lid][ref1], is voorzien door de directeur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel7
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '79'
    text: |-
      1 Onze Minister bepaalt in overeenstemming met Onze Minister van Financiën welke vermogensbestanddelen van de Staat
      die aan het onder Onze Minister ressorterende CBS worden toegerekend, worden toebedeeld aan het verzelfstandigde
      CBS.

      2 De in het eerste lid bedoelde vermogensbestanddelen gaan met ingang van het tijdstip van verzelfstandiging van
      het CBS onder algemene titel over op het verzelfstandigde CBS tegen een door Onze Minister in overeenstemming met
      Onze Minister van Financiën te bepalen waarde.

      3 Ingeval krachtens het eerste en het tweede lid registergoederen overgaan, zal verandering in de tenaamstelling
      in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1]
      plaatsvinden. De daartoe nodige opgaven worden door de zorg van Onze Minister van Financiën aan de bewaarders van
      de desbetreffende registers gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '80'
    text: |-
      Archiefbescheiden van het onder Onze Minister ressorterende CBS gaan met ingang van het tijdstip van
      verzelfstandiging van het CBS over naar het verzelfstandigde CBS, voor zover zij niet overeenkomstig de
      [Archiefwet 1995][ref1] zijn overgebracht naar een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '81'
    text: |-
      1 In wettelijke procedures en rechtsgedingen, waarbij het onder Onze Minister ressorterende CBS is betrokken,
      treedt met ingang van het tijdstip van verzelfstandiging van het CBS het verzelfstandigde CBS dan wel de directeur-
      generaal in de plaats van de Staat dan wel Onze Minister.

      2 In zaken waarin voor het tijdstip van verzelfstandiging van het CBS aan de Nationale ombudsman is verzocht een
      onderzoek te doen dan wel de Nationale ombudsman een onderzoek heeft ingesteld naar een gedraging die kan worden
      toegerekend aan het onder Onze Minister ressorterende CBS, treedt de directeur-generaal op dat tijdstip als
      bestuursorgaan in de zin van de [Wet Nationale ombudsman][ref1] in de plaats van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003372
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0003372
  - number: '83'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel83
