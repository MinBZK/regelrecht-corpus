        paragraaf: '2'
  - number: 38b
    text: |-
      De informatieplichtigen, bedoeld in artikel 7 van [verordening 638/2004](32004R0638), die gehouden zijn tot het
      doen van een opgave op grond van die verordening, verstrekken de desbetreffende gegevens kosteloos aan het CBS.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel38b
  - number: 38c
    text: |-
      1 Bij ministeriële regeling wordt vastgesteld:

      a. welke gegevens als bedoeld in artikel 9, tweede lid, van [verordening 638/2004](32004R0638) moeten worden
      opgegeven;

      b. op welke wijze de in onderdeel a bedoelde gegevens moeten worden opgegeven;

      c. de hoogte van de in artikel 10, eerste lid, van [verordening 638/2004](32004R0638) bedoelde statistische
      drempels;

      d. al hetgeen verder nodig is ter voldoening aan de op [verordening 638/2004](32004R0638) berustende voorschriften.

      2 Bij ministeriële regeling kan de aard en de hoogte van de in artikel 10, vierde lid, van [verordening 638/2004]
      (32004R0638) bedoelde statistische drempels worden vastgesteld.

      3 De in het eerste lid, onderdeel c, en in het tweede lid bedoelde drempels worden per kalenderjaar vastgesteld.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel38c
  - number: 38d
    text: |-
      Het in artikel 13, tweede lid, van [verordening 638/2004](32004R0638) bedoelde verslag wordt opgesteld door het
      CBS.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel38d
  - number: '39'
    text: |-
      1 In afwijking van [artikel 37][ref1] verstrekt de directeur-generaal gegevens aan Eurostat, nationale statistische
      instanties van de lidstaten van de Europese Unie of leden van het Europees Stelsel van Centrale Banken, voor zover
      deze verstrekking noodzakelijk is ingevolge een besluit van de Raad van de Europese Unie en het Europees Parlement.

      2 Bij elke andere verstrekking aan Eurostat, nationale statistische instanties van de lidstaten van de Europese
      Unie of leden van het Europees Stelsel van Centrale Banken vergewist de directeur-generaal zich ervan dat alle
      administratieve, technische en organisatorische maatregelen zijn genomen die voor de fysieke en logistieke
      bescherming van vertrouwelijke gegevens en voor het voorkomen van enige onwettige openbaarmaking en gebruik voor
      niet-statistische doeleinden bij de verspreiding van Europese en nationale statistieken nodig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel37
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '40'
    text: |-
      1 In afwijking van [artikel 37][ref1] kan de directeur-generaal, uitsluitend ten behoeve van statistische
      doeleinden in het kader van de uitvoering van de [Wet financiële betrekkingen buitenland 1994][ref2], gegevens
      verstrekken aan De Nederlandsche Bank NV.

      2 De in het eerste lid bedoelde gegevens worden aangewezen in een door Onze Minister, na overleg met Onze Minister
      van Financiën, vast te stellen regeling.

      3 De op grond van het eerste lid verstrekte gegevens worden door De Nederlandsche Bank NV uitsluitend gebruikt voor
      werkzaamheden in het kader van de [Wet financiële betrekkingen buitenland 1994][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006547
      [ref3]: https://wetten.overheid.nl/BWBR0006547
