  - number: '41'
    text: |-
      1 In afwijking van [artikel 37][ref1] kan de directeur-generaal op verzoek, ten behoeve van statistisch of
      wetenschappelijk onderzoek, een verzameling van gegevens met betrekking tot het gebruik waarvan passende
      maatregelen zijn genomen om herkenning van afzonderlijke personen, huishoudens, ondernemingen of instellingen te
      voorkomen, verstrekken aan een dienst, organisatie of instelling als bedoeld in het tweede lid, dan wel daartoe
      toegang verlenen.

      2 Een verzameling van gegevens als bedoeld in het eerste lid kan worden verstrekt, dan wel daartoe kan toegang
      worden verleend aan:

      a. een universiteit in de zin van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2];

      b. een bij wet ingestelde organisatie of instelling voor wetenschappelijk onderzoek;

      c. bij of krachtens de wet ingestelde planbureaus;

      d. de communautaire en nationale instanties voor de statistiek van de lidstaten van de Europese Unie;

      e. onderzoeksafdelingen van ministeries en andere diensten, organisaties en instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005682
  - number: '42'
    text: |-
      De directeur-generaal willigt een verzoek als bedoeld in [artikel 41][ref1] slechts in, indien de verzoeker naar
      het oordeel van de directeur-generaal voldoende maatregelen heeft getroffen om te voorkomen dat de verzameling van
      gegevens voor andere doeleinden dan statistisch of wetenschappelijk onderzoek wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel41
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '41'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 42a
    text: |-
      1 In afwijking van [artikel 37][ref1] kan de directeur-generaal op verzoek, ten behoeve van wetenschappelijk
      onderzoek op het terrein van de volksgezondheid, gegevens verstrekken die het CBS ten behoeve van statistisch
      onderzoek op grond van [artikel 12a van de Wet op de lijkbezorging][ref2] heeft verzameld, van personen die in een
      wetenschappelijk onderzoek waren betrokken.

      2 De directeur-generaal willigt een verzoek als bedoeld in het eerste lid slechts in, indien de betrokkene tot een
      zodanige verstrekking zijn uitdrukkelijke toestemming heeft gegeven dan wel, indien de betrokkene tot een zodanige
      verstrekking geen uitdrukkelijke toestemming heeft kunnen geven, voor zover verzoeker voldoende aantoont dat:

      a. het vragen van toestemming bij leven van de betrokkene in redelijkheid niet mogelijk was of kon worden gevergd;

      b. niet gebleken is dat de betrokkene bij leven bezwaar heeft gemaakt tegen het verwerken van diens
      persoonsgegevens ten behoeve van wetenschappelijke onderzoek;

      c. het onderzoek een algemeen belang dient;

      d. het onderzoek niet zonder de desbetreffende gegevens kan worden uitgevoerd;

      e. het onderzoek overigens voldoet aan daaraan redelijkerwijs te stellen eisen.

      3 De directeur-generaal kan nadere voorwaarden verbinden aan een verstrekking krachtens het eerste lid.

      4 De [artikelen 41, tweede lid][ref3], en [42][ref4] zijn van overeenkomstige toepassing.

      5 Onze Minister stelt, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, gehoord het
      College bescherming persoonsgegevens, nadere regels met betrekking tot de in het eerste lid bedoelde bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0015926#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0015926#Artikel42
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '37'
        hoofdstuk: '5'
