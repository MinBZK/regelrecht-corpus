        paragraaf: '2'
  - number: '17'
    text: |-
      1 Onze Minister bepaalt, in overeenstemming met het gevoelen van de raad van ministers en binnen zes maanden na
      ontvangst van het meerjarenprogramma, zijn standpunt over de ter verwezenlijking van het meerjarenprogramma te
      vervullen financiële en organisatorische voorwaarden.

      2 Onze Minister zendt het standpunt aan de directeur-generaal en de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel17
  - number: '18'
    text: |-
      De directeur-generaal bepaalt de methoden waarmee de in de werk- en meerjarenprogramma's opgenomen onderzoeken
      worden uitgevoerd en de wijze waarop de resultaten van die onderzoeken worden openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel18
  - number: '20'
    text: |-
      1 Er is een raad van advies, waarvan de leden worden benoemd, geschorst en ontslagen door Onze Minister.

      2 De raad van advies heeft onder andere tot taak de directeur-generaal desgevraagd of uit eigen beweging te
      adviseren over de uitvoering van de taken en bevoegdheden van de directeur-generaal.

      3 Het bestuursreglement, bedoeld in [artikel 2b][ref1], regelt in elk geval de samenstelling van de raad van
      advies, de benoemingsduur van de leden, de werkwijze van de raad en de onderwerpen waarover de raad adviseert,
      waartoe in ieder geval behoren:

      a. het meerjarenprogramma, bedoeld in [artikel 14][ref2], en het werkprogramma, bedoeld in [artikel 15][ref3];

      b. de wijze waarop de nauwkeurigheid en de volledigheid van de van overheidswege openbaar te maken statistieken
      kunnen worden bevorderd zodat deze voorzien in de behoeften van praktijk, beleid en wetenschap;

      c. de bedrijfsvoering van het CBS en een efficiënte besteding van middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel2b
