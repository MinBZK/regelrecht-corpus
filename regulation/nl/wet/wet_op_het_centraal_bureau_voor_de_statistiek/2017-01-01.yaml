  - number: '15'
    text: |-
      1 De directeur-generaal stelt jaarlijks een werkprogramma voor het daaropvolgende jaar vast. Hij kan het
      werkprogramma tussentijds wijzigen.

      2 In het werkprogramma wordt vastgelegd welke werkzaamheden het CBS in een bepaald jaar zal uitvoeren, voor zover
      de beschikbare middelen dat toelaten.

      3 Het werkprogramma bevat een beschrijving van het belang van een statistiek voor praktijk, beleid en wetenschap,
      de vraag of een statistiek noodzakelijk is op grond van Europese of andere regelgeving, een verantwoording omtrent
      de belangrijkste niet-gehonoreerde verzoeken om statistieken en een paragraaf met de kosten en opbrengsten van
      de statistieken.

      4 De directeur-generaal zendt het werkprogramma ten minste twee maanden vóór het begin van het kalenderjaar waarop
      het werkprogramma betrekking heeft, ter goedkeuring aan Onze Minister.

      5 Onze Minister geeft binnen zes weken na ontvangst van het werkprogramma of een wijziging van het werkprogramma
      een beschikking omtrent de goedkeuring ervan.

      6 De goedkeuring wordt uitsluitend onthouden aan het werkprogramma of een wijziging ervan indien dat werkprogramma
      of die wijziging naar het oordeel van Onze Minister niet past binnen de financiële en organisatorische voorwaarden
      die zijn opgenomen in het desbetreffende standpunt, bedoeld in het [artikel 17, eerste lid][ref1].

      7 De directeur-generaal maakt het werkprogramma en wijzigingen daarvan, na goedkeuring door Onze Minister,
      openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel17
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel15
