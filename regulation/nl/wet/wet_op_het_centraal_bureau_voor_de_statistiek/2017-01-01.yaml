  - number: '33'
    text: |-
      1 De directeur-generaal is bevoegd ten behoeve van statistische doeleinden gebruik te maken van gegevens uit
      registraties die in verband met de uitvoering van een wettelijke taak worden bijgehouden bij:

      a. instellingen en diensten van:

      1º. het Rijk;

      2º. provincies;

      3º. gemeenten;

      4º. waterschappen;

      5º. openbare lichamen, gevormd ingevolge de [Wet gemeenschappelijke regelingen][ref1];

      b. openbare lichamen als bedoeld in [artikel 134 van de Grondwet][ref2];

      c. zelfstandige bestuursorganen op het niveau van de centrale overheid.

      2 De directeur-generaal is voorts bevoegd ten behoeve van statistische doeleinden gebruik te maken van gegevens uit
      registraties die worden bijgehouden door bij algemene maatregel van bestuur aangewezen rechtspersonen die een bij
      of krachtens de wet geregelde taak uitoefenen of geheel of gedeeltelijk, direct of indirect, worden bekostigd uit
      middelen van de Staat of uit de opbrengst van bij of krachtens de wet ingestelde heffingen.

      3 Voor zover de in het eerste en tweede lid bedoelde verwerving niet de benodigde gegevens oplevert, is de
      directeur-generaal bevoegd ten behoeve van statistische doeleinden bij algemene maatregel van bestuur aan te wijzen
      gegevens op te vragen bij door die maatregel aangewezen categorieën van ondernemingen, vrije beroepsbeoefenaren,
      instellingen en rechtspersonen.

      4 De in het eerste lid bedoelde instellingen, diensten, lichamen en zelfstandige bestuursorganen, de in het tweede
      lid bedoelde rechtspersonen en de in het derde lid bedoelde ondernemingen, vrije beroepsbeoefenaren, instellingen
      en rechtspersonen verstrekken de in die leden bedoelde gegevens kosteloos op verzoek van de directeur-generaal
      binnen een bij algemene maatregel van bestuur te bepalen termijn. Daarbij kan geen beroep worden gedaan op
      geheimhoudingsverplichtingen, tenzij deze verplichtingen gebaseerd zijn op internationale regelgeving.

      5 Voor zover de in het derde lid bedoelde gegevens liggen op het terrein van het Nederlandse bankwezen en deze door
      De Nederlandsche Bank NV uit hoofde van haar taken worden verzameld, geschiedt de verwerving van deze gegevens na
      overleg met en door tussenkomst van De Nederlandsche Bank NV. Ten aanzien van de overige gegevens op het terrein
      van het Nederlandse bankwezen geschiedt de verwerving van deze gegevens na overleg met De Nederlandsche Bank NV.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel134
