preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is over te gaan tot externe verzelfstandiging van het
    dienstonderdeel Centraal bureau voor de statistiek door oprichting van een zelfstandig bestuursorgaan en nieuwe
    regels vast te stellen inzake de verwerving, het gebruik en de verstrekking van gegevens in het kader van de
    statistische informatievoorziening;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. Onze Minister: Onze Minister van Economische Zaken;

      b. CBS: het Centraal bureau voor de statistiek;

      c. directeur-generaal: de directeur-generaal van de statistiek;

      d. CBS-organisatie: de directeur-generaal en de bij of voor het CBS werkzame personen;

      e. Europese statistieken: statistieken ter uitvoering van bindende EU-rechtshandelingen.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel1
  - number: '2'
    text: |-
      1 Er is een Centraal bureau voor de statistiek.

      2 Het CBS bezit rechtspersoonlijkheid.

      3 De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: 2a
    text: |-
      1 Het CBS bestaat uit één lid, de directeur-generaal, met de titel van directeur-generaal van de statistiek.

      2 De directeur-generaal wordt benoemd voor een periode van ten hoogste zeven jaren en kan eenmaal worden herbenoemd
      voor een periode van ten hoogste drie jaren.

      3 Bij het openvallen van de functie van directeur-generaal doet de raad van advies een aanbeveling voor de
      vervulling van deze functie aan Onze Minister.

      4 Schorsing en ontslag van de directeur-generaal vindt niet plaats dan nadat de raad van advies is gehoord.

      5 Onze Minister kan regels stellen ten aanzien van de plaatsvervanging van de directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel2a
  - number: 2b
    text: |-
      1 De directeur-generaal stelt een bestuursreglement vast.

      2 Het bestuursreglement bevat ten minste een regeling van:

      a. de structuur van de CBS-organisatie;

      b. de samenstelling en werkwijze van de leidinggevenden van de onderdelen van de CBS-organisatie en hun onderlinge
      taakverdeling op hoofdlijnen.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel2b
  - number: '3'
    text: |-
      1 Het CBS heeft tot taak het van overheidswege verrichten van statistisch onderzoek ten behoeve van praktijk,
      beleid en wetenschap en het openbaar maken van de op grond van zodanig onderzoek samengestelde statistieken.

      2 Het CBS bevordert:

      a. een statistische informatievoorziening van overheidswege die voorziet in de behoeften van praktijk, beleid en
      wetenschap;

      b. de nauwkeurigheid en volledigheid van de van overheidswege openbaar te maken statistieken.

      3 Door Onze Minister of één van Onze andere Ministers wordt slechts een nieuw statistisch onderzoek ingesteld of in
      een onderzoek dat reeds plaatsvindt wijziging gebracht, nadat de directeur-generaal is gehoord.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel3
  - number: '4'
    text: Het CBS is op nationaal niveau belast met de productie van Europese statistieken.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel4
  - number: '5'
    text: |-
      1 Het CBS kan in incidentele gevallen statistische werkzaamheden voor derden verrichten. Deze werkzaamheden
      mogen niet leiden tot mededinging met private aanbieders van vergelijkbare diensten die uit een oogpunt van goede
      marktwerking ongewenst is.

      2 Onze Minister kan nadere regels stellen over de werkzaamheden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel5
  - number: '14'
    text: |-
      1 De directeur-generaal stelt ten minste eenmaal in de vijf jaren een meerjarenprogramma vast, waarin op
      hoofdlijnen wordt vastgelegd welke werkzaamheden het CBS zal uitvoeren in de komende jaren.

      2 Het meerjarenprogramma bevat voorts een beschrijving van de op middellange en lange termijn te realiseren
      doelstellingen, de hoofdlijnen van het daarop te richten beleid en de financiële en organisatorische voorwaarden
      die daartoe vervuld moeten worden.

      3 De directeur-generaal zendt het meerjarenprogramma ten minste 14 maanden voorafgaand aan het begin van de periode
      waarop het meerjarenprogramma betrekking heeft, ter goedkeuring aan Onze Minister.

      4 Onze Minister geeft binnen acht weken na bepaling van het standpunt bedoeld in [artikel 17, eerste lid][ref1],
      een beschikking omtrent de goedkeuring van het meerjarenprogramma.

      5 De goedkeuring wordt uitsluitend onthouden aan het meerjarenprogramma indien dat naar het oordeel van Onze
      Minister niet past binnen de financiële en organisatorische voorwaarden die zijn opgenomen in het naar aanleiding
      van dat meerjarenprogramma bepaalde standpunt, bedoeld in [artikel 17, eerste lid][ref2].

      6 De directeur-generaal maakt het meerjarenprogramma, na goedkeuring door Onze Minister, openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0015926#Artikel17
    url: https://wetten.overheid.nl/BWBR0015926/2017-01-01#Artikel14
    references:
