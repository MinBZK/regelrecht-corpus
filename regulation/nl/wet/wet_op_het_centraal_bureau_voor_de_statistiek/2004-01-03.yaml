---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_het_centraal_bureau_voor_de_statistiek
regulatory_layer: WET
publication_date: '2025-07-23'
valid_from: '2004-01-03'
bwb_id: BWBR0015926
url: https://wetten.overheid.nl/BWBR0015926/2004-01-03
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is over te gaan tot externe verzelfstandiging van het
    dienstonderdeel Centraal bureau voor de statistiek door oprichting van een zelfstandig bestuursorgaan en nieuwe
    regels vast te stellen inzake de verwerving, het gebruik en de verstrekking van gegevens in het kader van de
    statistische informatievoorziening;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel1
  - number: 1.b
    text: 'CBS: het Centraal bureau voor de statistiek;'
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel1
  - number: 1.c
    text: 'directeur-generaal: de directeur-generaal van de statistiek;'
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel1
  - number: 1.d
    text: 'CCS: de Centrale commissie voor de statistiek.'
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel1
  - number: '2.1'
    text: Er is een Centraal bureau voor de statistiek.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel2
  - number: '2.2'
    text: Het CBS bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel2
  - number: '3'
    text: |-
      Het CBS heeft tot taak het van overheidswege verrichten van statistisch onderzoek ten behoeve van praktijk, beleid
      en wetenschap en het openbaar maken van de op grond van zodanig onderzoek samengestelde statistieken.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel3
  - number: '4'
    text: Het CBS is op nationaal niveau belast met de productie van communautaire statistieken.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel4
  - number: '5.1'
    text: |-
      Het CBS kan in incidentele gevallen statistische werkzaamheden voor derden verrichten. Deze werkzaamheden mogen
      niet leiden tot mededinging met private aanbieders van vergelijkbare diensten die uit een oogpunt van goede
      marktwerking ongewenst is.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel5
  - number: '5.2'
    text: Onze Minister kan nadere regels stellen over de werkzaamheden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel5
  - number: '6'
    text: 'Het CBS heeft twee bestuursorganen:'
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel6
  - number: 6.a
    text: |-
      de directeur-generaal, bedoeld in [artikel 8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel8
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 6.b
    text: |-
      de CCS, bedoeld in [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel20
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '20'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '7.1'
    text: |-
      Op het personeel in dienst van het CBS zijn de rechtspositieregels die gelden voor de ambtenaren die zijn
      aangesteld bij ministeries, van overeenkomstige toepassing. De in die regels neergelegde bevoegdheden, met
      uitzondering van de aan Ons dan wel aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties toegekende
      bevoegdheden tot het stellen van regels, worden uitgeoefend door de directeur-generaal. Voor zover in die regels
      is bepaald dat bevoegdheden worden uitgeoefend met medebetrokkenheid van Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, worden deze bevoegdheden uitgeoefend met medebetrokkenheid van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel7
  - number: '7.2'
    text: Bij algemene maatregel van bestuur kan gedeeltelijk worden afgeweken van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel7
  - number: '8.1'
    text: |-
      Het bestuur van het CBS wordt gevormd door een directeur-generaal met de titel van directeur-generaal van de
      statistiek. De directeur-generaal kan niet tevens zijn een aan Onze Minister ondergeschikte ambtenaar.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel8
  - number: '8.2'
    text: Onze Minister stelt regels ten aanzien van de plaatsvervanging van de directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel8
  - number: '9.1'
    text: Onze Minister benoemt, schorst en ontslaat de directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel9
  - number: '9.2'
    text: |-
      Schorsing en ontslag vindt, gehoord de CCS, slechts plaats wegens ongeschiktheid of onbekwaamheid voor de vervulde
      functie dan wel wegens andere zwaarwegende in de persoon van de betrokkene gelegen redenen. Ontslag vindt voorts
      plaats op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel9
  - number: '10.1'
    text: |-
      De directeur-generaal wordt benoemd voor een periode van ten hoogste zeven jaren en kan eenmaal worden herbenoemd
      voor een periode van ten hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel10
  - number: '10.2'
    text: |-
      Bij het openvallen van de functie van directeur-generaal doet de CCS een aanbeveling voor de vervulling van deze
      functie aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel10
  - number: '11.1'
    text: |-
      De directeur-generaal vervult geen nevenfuncties die ongewenst zijn met het oog op een goede vervulling van zijn
      functie of de handhaving van zijn onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel11
  - number: '11.2'
    text: |-
      De directeur-generaal meldt het voornemen tot het aanvaarden van een nevenfunctie anders dan uit hoofde van zijn
      functie aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel11
  - number: '11.3'
    text: |-
      Nevenfuncties van de directeur-generaal anders dan uit hoofde van zijn functie worden openbaar gemaakt.
      Openbaarmaking geschiedt door het ter inzage leggen van een opgave van deze nevenfuncties bij het CBS en bij Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel11
  - number: '12.1'
    text: De directeur-generaal geniet een bezoldiging.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel12
  - number: '12.2'
    text: Onze Minister stelt de rechtspositie van de directeur-generaal vast.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel12
  - number: '12.3'
    text: |-
      Buiten de bezoldiging en de vergoeding van bijzondere kosten in verband met zijn functie geniet de directeur-
      generaal geen inkomsten ten laste van het CBS.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel12
  - number: '12.4'
    text: |-
      Ten aanzien van de directeur-generaal wordt met overeenkomstige toepassing van
      [artikel 383 van Boek 2 van het Burgerlijk Wetboek][ref1] verslag gedaan in het jaarverslag, bedoeld in
      [artikel 53][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel383
      [ref2]: https://wetten.overheid.nl/BWBR0015926#Artikel53
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '383'
      - id: ref2
        bwb_id: BWBR0015926
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '13.1'
    text: De directeur-generaal is belast met het besturen van het CBS.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel13
  - number: '13.2'
    text: De directeur-generaal vertegenwoordigt het CBS in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel13
  - number: '14.1'
    text: |-
      De directeur-generaal stelt ten minste eenmaal in de vijf jaren een meerjarenprogramma op, waarin op hoofdlijnen
      wordt vastgelegd welke werkzaamheden het CBS zal uitvoeren in de komende jaren.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel14
  - number: '14.2'
    text: |-
      Het meerjarenprogramma bevat voorts een beschrijving van de op middellange en lange termijn te realiseren
      doelstellingen, de hoofdlijnen van het daarop te richten beleid en de financiële en organisatorische voorwaarden
      die daartoe vervuld moeten worden.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel14
  - number: '15.1'
    text: |-
      De directeur-generaal stelt jaarlijks een werkprogramma voor het daaropvolgende jaar op. Hij kan het werkprogramma
      tussentijds wijzigen.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel15
  - number: '15.2'
    text: |-
      In het werkprogramma wordt vastgelegd welke werkzaamheden het CBS in een bepaald jaar zal uitvoeren, voor zover de
      beschikbare middelen dat toelaten.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel15
  - number: '15.3'
    text: |-
      Het werkprogramma bevat een beschrijving van het belang van een statistiek voor praktijk, beleid en wetenschap,
      de vraag of een statistiek noodzakelijk is op grond van Europese of andere regelgeving, een verantwoording omtrent
      de belangrijkste niet-gehonoreerde verzoeken om statistieken en een paragraaf met de kosten en opbrengsten van
      de statistieken.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel15
  - number: '16.1'
    text: |-
      De directeur-generaal legt het meerjarenprogramma en het werkprogramma vóór 1 november en de wijzigingen in het
      werkprogramma tussentijds ter vaststelling voor aan de CCS.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel16
  - number: '16.2'
    text: |-
      De directeur-generaal legt het meerjarenprogramma, het werkprogramma en de wijzigingen in het werkprogramma,
      na vaststelling door de CCS, ter inzage bij het CBS gedurende de periode waarvoor zij gelden. Hiervan doet hij
      mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel16
  - number: '17.1'
    text: De CCS zendt het meerjarenprogramma vóór 1 december aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister brengt zijn standpunt over de financiële en organisatorische voorwaarden die vervuld moeten worden
      ter verwezenlijking van het meerjarenprogramma, bepaald in overeenstemming met het gevoelen van de raad van
      ministers, binnen zes maanden na ontvangst van het programma ter kennis van de directeur-generaal, de CCS en de
      Tweede Kamer der Staten-Generaal. Hiervan doet hij mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel17
  - number: '18'
    text: |-
      De directeur-generaal bepaalt de methoden waarmee de in de werk- en meerjarenprogramma's opgenomen onderzoeken
      worden uitgevoerd en de wijze waarop de resultaten van die onderzoeken worden openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel18
  - number: '19'
    text: |-
      De directeur-generaal behoeft voor instemming met mandaatverlening de goedkeuring van Onze Minister, tenzij het
      mandaatverlening door Onze Minister betreft. De goedkeuring kan worden onthouden wegens strijd met het recht of
      op de grond dat de te mandateren bevoegdheid naar het oordeel van Onze Minister een goede taakuitoefening door de
      directeur-generaal kan belemmeren.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel19
  - number: '20'
    text: Het bestuur van het CBS wordt mede gevormd door een Centrale commissie voor de statistiek.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel20
  - number: '21.1'
    text: |-
      De CCS bestaat uit de voorzitter en een even aantal overige leden dat ten minste zes en ten hoogste tien bedraagt.
      De voorzitter en de overige leden kunnen niet tevens zijn een aan Onze Minister ondergeschikte ambtenaar.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel21
  - number: '21.2'
    text: |-
      De secretaris is een door de directeur-generaal, in overeenstemming met de voorzitter van de CCS, aangewezen
      personeelslid van het CBS. De secretaris is geen lid van de CCS.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel21
  - number: '21.3'
    text: De secretaris staat onder het gezag van de CCS en legt over werkzaamheden uitsluitend aan de CCS verantwoording af.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel21
  - number: '22.1'
    text: |-
      Onze Minister benoemt, schorst en ontslaat de voorzitter en de overige leden van de CCS. Onze Minister wijst een
      lid aan als plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel22
  - number: '22.2'
    text: Bij het openvallen van een plaats doet de CCS een aanbeveling voor de vervulling daarvan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel22
  - number: '22.3'
    text: |-
      Schorsing en ontslag vindt slechts plaats wegens ongeschiktheid of onbekwaamheid voor de vervulde functie dan wel
      wegens andere zwaarwegende in de persoon van de betrokkene gelegen redenen. Ontslag vindt voorts plaats op eigen
      verzoek.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel22
  - number: '23.1'
    text: |-
      De leden van de CCS worden benoemd voor een periode van ten hoogste vier jaren. Zij kunnen eenmaal worden
      herbenoemd.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel23
  - number: '23.2'
    text: |-
      Bij tussentijds aftreden treedt het lid dat wordt benoemd ter vervulling van de opengevallen plaats, af op het
      tijdstip waarop degene in wiens plaats hij is benoemd, had moeten aftreden. Hij is terstond herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel23
  - number: '24.1'
    text: De leden van de CCS hebben recht op een schadeloosstelling.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel24
  - number: '24.2'
    text: Onze Minister stelt de schadeloosstelling vast.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel24
  - number: '24.3'
    text: |-
      Buiten de schadeloosstelling en de vergoeding van bijzondere kosten in verband met hun functie genieten de leden
      van de CCS geen inkomsten ten laste van het CBS.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel24
  - number: '24.4'
    text: |-
      Ten aanzien van de leden van de CCS wordt met overeenkomstige toepassing van
      [artikel 383 van Boek 2 van het Burgerlijk Wetboek][ref1] verslag gedaan in het jaarverslag, bedoeld in
      [artikel 54][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel383
      [ref2]: https://wetten.overheid.nl/BWBR0015926#Artikel54
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '383'
      - id: ref2
        bwb_id: BWBR0015926
        artikel: '54'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '25'
    text: 'De CCS heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel25
  - number: 25.a
    text: |-
      het bevorderen van een statistische informatievoorziening van overheidswege die voorziet in de behoeften van
      praktijk, beleid en wetenschap;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel25
  - number: 25.b
    text: het bevorderen van de nauwkeurigheid en de volledigheid van de van overheidswege openbaar te maken statistieken;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel25
  - number: 25.c
    text: het beoordelen van het meerjarenprogramma en het werkprogramma van het CBS;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel25
  - number: 25.d
    text: |-
      erop toe te zien dat de verwerving van gegevens door het CBS op zodanige wijze geschiedt dat daaruit voortvloeiende
      administratieve lasten voor ondernemingen en instellingen zo laag mogelijk zijn;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel25
  - number: 25.e
    text: |-
      erop toe te zien dat de door het CBS verrichte statistische werkzaamheden voor derden niet leiden tot mededinging
      met private aanbieders van vergelijkbare diensten die uit een oogpunt van goede marktwerking ongewenst is;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel25
  - number: 25.f
    text: |-
      toe te zien op de uitvoering door de directeur-generaal van de bevoegdheid tot het beschikbaar stellen van
      verzamelingen van gegevens ten behoeve van statistisch of wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel25
  - number: '26.1'
    text: |-
      De CCS stelt een bestuursreglement vast dat, evenals de wijzigingen daarin, de goedkeuring van Onze Minister
      behoeft.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel26
  - number: '26.2'
    text: |-
      De goedkeuring kan worden onthouden wegens strijd met het recht of op grond dat het reglement naar het oordeel van
      Onze Minister een goede taakuitoefening door de CCS kan belemmeren.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel26
  - number: '26.3'
    text: De CCS komt jaarlijks ten minste viermaal bijeen.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel26
  - number: '27'
    text: |-
      Door een van Onze Ministers wordt slechts een nieuw statistisch onderzoek ingesteld of in een onderzoek dat reeds
      plaatsvindt wijziging gebracht, nadat de CCS is gehoord.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel27
  - number: '28'
    text: |-
      Ter uitvoering van haar taak kan de CCS zich rechtstreeks tot derden wenden tot het verkrijgen van de inlichtingen
      die zij behoeft.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel28
  - number: '29.1'
    text: |-
      De CCS kan de voorbereiding van bepaalde beslissingen en taken opdragen aan al dan niet uit haar midden ingestelde
      subcommissies of aan de directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel29
  - number: '29.2'
    text: |-
      [Artikel 24][ref1] is van overeenkomstige toepassing op de leden van subcommissies die geen lid zijn van de CCS.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel24
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '30'
    text: |-
      De voorzitter van de CCS kan in spoedeisende gevallen de in [artikel 16, eerste lid][ref1], bedoelde bevoegdheid
      van de CCS, voor zover het een wijziging van het werkprogramma betreft, en de in [artikel 27][ref2] bedoelde
      bevoegdheden uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0015926#Artikel27
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015926
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '31'
    text: Stukken van of namens de CCS uitgaande, worden door de voorzitter en de secretaris ondertekend.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel31
  - number: '32'
    text: Beslissingen van de CCS worden genomen overeenkomstig het standpunt van de meerderheid van de leden.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel32
  - number: '33.1'
    text: |-
      De directeur-generaal is bevoegd ten behoeve van statistische doeleinden gebruik te maken van gegevens uit
      registraties die in verband met de uitvoering van een wettelijke taak worden bijgehouden bij:
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel33
  - number: 33.1.a
    text: 'instellingen en diensten van:'
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel33
  - number: 33.1.a.1º
    text: het Rijk;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel33
  - number: 33.1.a.2º
    text: provincies;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel33
  - number: 33.1.a.3º
    text: gemeenten;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel33
  - number: 33.1.a.4º
    text: waterschappen;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel33
  - number: 33.1.a.5º
    text: |-
      openbare lichamen, gevormd ingevolge de [Wet gemeenschappelijke regelingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 33.1.b
    text: |-
      openbare lichamen als bedoeld in [artikel 134 van de Grondwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
  - number: 33.1.c
    text: zelfstandige bestuursorganen op het niveau van de centrale overheid.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel33
  - number: '33.2'
    text: |-
      De directeur-generaal is voorts bevoegd ten behoeve van statistische doeleinden gebruik te maken van gegevens
      uit registraties die worden bijgehouden door bij algemene maatregel van bestuur, gehoord de CCS, aangewezen
      rechtspersonen die een bij of krachtens de wet geregelde taak uitoefenen of geheel of gedeeltelijk, direct of
      indirect, worden bekostigd uit middelen van de Staat of uit de opbrengst van bij of krachtens de wet ingestelde
      heffingen.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel33
  - number: '33.3'
    text: |-
      Voor zover de in het eerste en tweede lid bedoelde verwerving niet de benodigde gegevens oplevert, is de directeur-
      generaal bevoegd ten behoeve van statistische doeleinden bij algemene maatregel van bestuur, gehoord de CCS,
      aan te wijzen gegevens op te vragen bij door die maatregel aangewezen categorieën van ondernemingen, vrije
      beroepsbeoefenaren, instellingen en rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel33
  - number: '33.4'
    text: |-
      De in het eerste lid bedoelde instellingen, diensten, lichamen en zelfstandige bestuursorganen, de in het tweede
      lid bedoelde rechtspersonen en de in het derde lid bedoelde ondernemingen, vrije beroepsbeoefenaren, instellingen
      en rechtspersonen verstrekken de in die leden bedoelde gegevens kosteloos op verzoek van de directeur-generaal
      binnen een bij algemene maatregel van bestuur te bepalen termijn. Daarbij kan geen beroep worden gedaan op
      geheimhoudingsverplichtingen, tenzij deze verplichtingen gebaseerd zijn op internationale regelgeving.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel33
  - number: '33.5'
    text: |-
      Voor zover de in het derde lid bedoelde gegevens liggen op het terrein van het Nederlandse bankwezen en deze door
      De Nederlandsche Bank NV uit hoofde van haar taken worden verzameld, geschiedt de verwerving van deze gegevens na
      overleg met en door tussenkomst van De Nederlandsche Bank NV. Ten aanzien van de overige gegevens op het terrein
      van het Nederlandse bankwezen geschiedt de verwerving van deze gegevens na overleg met De Nederlandsche Bank NV.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel33
  - number: '34'
    text: |-
      De directeur-generaal kan het sociaal-fiscaal nummer, bedoeld in
      [artikel 47b, derde lid, van de Algemene wet inzake rijksbelastingen][ref1], opnemen in een registratie en daarvan
      gebruik maken ten behoeve van statistische doeleinden. De directeur-generaal kan het sociaal-fiscaal nummer
      gebruiken in contacten met personen en instanties voor zover deze zelf gemachtigd zijn tot het gebruik van dat
      nummer in een registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47b
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 47b
  - number: '35'
    text: |-
      De directeur-generaal kan ten behoeve van statistische doeleinden persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens][ref1] verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
  - number: '36'
    text: |-
      Met inachtneming van een goede vervulling van zijn taak draagt de directeur-generaal er zorg voor dat de verwerving
      van gegevens op zodanige wijze geschiedt dat de daaruit voortvloeiende administratieve lasten voor ondernemingen,
      vrije beroepsbeoefenaren, instellingen en rechtspersonen die volgens hun statuten tot doel hebben de belangen van
      de betrokken ondernemingen, vrije beroepsbeoefenaren en instellingen te behartigen, zo laag mogelijk zijn.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel36
  - number: '37.1'
    text: |-
      De door de directeur-generaal in het kader van de uitoefening van de taken ter uitvoering van deze wet ontvangen
      gegevens worden uitsluitend gebruikt voor statistische doeleinden.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel37
  - number: '37.2'
    text: |-
      De in het eerste lid bedoelde gegevens worden niet verstrekt aan anderen dan degenen die belast zijn met de
      uitvoering van de taak van het CBS.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel37
  - number: '37.3'
    text: |-
      De in het eerste lid bedoelde gegevens worden slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens
      over een afzonderlijk persoon, huishouden, onderneming of instelling kunnen worden ontleend, tenzij, ingeval het
      gegevens met betrekking tot een onderneming of instelling betreft, er een gegronde reden is om aan te nemen dat bij
      de betrokken onderneming of instelling geen bedenkingen bestaan tegen de openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel37
  - number: '38'
    text: |-
      De directeur-generaal draagt op de voet van de ter zake voor de Rijksdienst geldende voorschriften zorg voor de
      nodige technische en organisatorische voorzieningen ter beveiliging van zijn gegevens tegen verlies of aantasting
      en tegen onbevoegde kennisneming, wijziging en verstrekking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel38
  - number: '39.1'
    text: |-
      In afwijking van[ artikel 37][ref1] verstrekt de directeur-generaal gegevens aan de communautaire en nationale
      instanties voor de statistiek van de lidstaten van de Europese Unie voor zover deze verstrekking noodzakelijk is
      voor de productie van specifieke communautaire statistieken.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel37
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '39.2'
    text: |-
      Bij elke andere verstrekking aan de communautaire en nationale instanties voor de statistiek van de lidstaten
      van de Europese Unie vergewist de directeur-generaal zich ervan dat alle administratieve, technische en
      organisatorische maatregelen zijn genomen die voor de fysieke en logistieke bescherming van vertrouwelijke gegevens
      en voor het voorkomen van enige onwettige openbaarmaking en gebruik voor niet-statistische doeleinden bij de
      verspreiding van communautaire en nationale statistieken nodig zijn.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel39
  - number: '40.1'
    text: |-
      In afwijking van [artikel 37][ref1] kan de directeur-generaal, uitsluitend ten behoeve van statistische doeleinden
      in het kader van de uitvoering van de [Wet financiële betrekkingen buitenland 1994][ref2], gegevens verstrekken
      aan De Nederlandsche Bank NV.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006547
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006547
  - number: '40.2'
    text: |-
      De in het eerste lid bedoelde gegevens worden aangewezen in een door Onze Minister, na overleg met Onze Minister
      van Financiën en gehoord de CCS, vast te stellen regeling.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel40
  - number: '40.3'
    text: |-
      De op grond van het eerste lid verstrekte gegevens worden door De Nederlandsche Bank NV uitsluitend gebruikt voor
      werkzaamheden in het kader van de [Wet financiële betrekkingen buitenland 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006547
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006547
  - number: '40.4'
    text: |-
      [Artikel 17a van de Wet melding ongebruikelijke transacties][ref1] is op deze gegevens niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel17a
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: 17a
  - number: '41.1'
    text: |-
      In afwijking van [artikel 37][ref1] kan de directeur-generaal op verzoek, ten behoeve van statistisch of
      wetenschappelijk onderzoek, een verzameling van gegevens met betrekking tot het gebruik waarvan passende
      maatregelen zijn genomen om herkenning van afzonderlijke personen, huishoudens, ondernemingen of instellingen te
      voorkomen, verstrekken aan een dienst, organisatie of instelling als bedoeld in het tweede lid, dan wel daartoe
      toegang verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel37
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '41.2'
    text: |-
      Een verzameling van gegevens als bedoeld in het eerste lid kan worden verstrekt, dan wel daartoe kan toegang worden
      verleend aan:
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel41
  - number: 41.2.a
    text: |-
      een universiteit in de zin van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 41.2.b
    text: een bij wet ingestelde organisatie of instelling voor wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel41
  - number: 41.2.c
    text: bij of krachtens de wet ingestelde planbureaus;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel41
  - number: 41.2.d
    text: de communautaire en nationale instanties voor de statistiek van de lidstaten van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel41
  - number: 41.2.e
    text: |-
      onderzoeksafdelingen van ministeries en andere diensten, organisaties en instellingen, voor zover daartoe
      instemming van de CCS is verkregen.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel41
  - number: '42'
    text: |-
      De directeur-generaal willigt een verzoek als bedoeld in [artikel 41][ref1] slechts in, indien de verzoeker naar
      het oordeel van de directeur-generaal voldoende maatregelen heeft getroffen om te voorkomen dat de verzameling van
      gegevens voor andere doeleinden dan statistisch of wetenschappelijk onderzoek wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel41
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '41'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 42a.1
    text: |-
      In afwijking van [artikel 37][ref1] kan de directeur-generaal op verzoek, ten behoeve van wetenschappelijk
      onderzoek op het terrein van de volksgezondheid, gegevens verstrekken die het CBS ten behoeve van statistisch
      onderzoek op grond van [artikel 12a van de Wet op de lijkbezorging][ref2] heeft verzameld, van personen die in een
      wetenschappelijk onderzoek waren betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel12a
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: 12a
  - number: 42a.2
    text: |-
      De directeur-generaal willigt een verzoek als bedoeld in het eerste lid slechts in, indien de betrokkene tot een
      zodanige verstrekking zijn uitdrukkelijke toestemming heeft gegeven dan wel, indien de betrokkene tot een zodanige
      verstrekking geen uitdrukkelijke toestemming heeft kunnen geven, voor zover verzoeker voldoende aantoont dat:
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel42a
  - number: 42a.2.a
    text: het vragen van toestemming bij leven van de betrokkene in redelijkheid niet mogelijk was of kon worden gevergd;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel42a
  - number: 42a.2.b
    text: |-
      niet gebleken is dat de betrokkene bij leven bezwaar heeft gemaakt tegen het verwerken van diens persoonsgegevens
      ten behoeve van wetenschappelijke onderzoek;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel42a
  - number: 42a.2.c
    text: het onderzoek een algemeen belang dient;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel42a
  - number: 42a.2.d
    text: het onderzoek niet zonder de desbetreffende gegevens kan worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel42a
  - number: 42a.2.e
    text: het onderzoek overigens voldoet aan daaraan redelijkerwijs te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel42a
  - number: 42a.3
    text: De directeur-generaal kan nadere voorwaarden verbinden aan een verstrekking krachtens het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel42a
  - number: 42a.4
    text: |-
      De [artikelen 41, tweede lid][ref1], en [42][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0015926#Artikel42
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '41'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0015926
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 42a.5
    text: |-
      Onze Minister stelt, in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport, gehoord de
      CCS en het College bescherming persoonsgegevens, nadere regels met betrekking tot de in het eerste lid bedoelde
      bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel42a
  - number: '43.1'
    text: |-
      De directeur-generaal kan een bestuurlijke boete opleggen van ten hoogste € 5 000 aan de in
      [artikel 33, tweede lid][ref1], bedoelde rechtspersonen en de in [artikel 33, derde lid][ref2], bedoelde
      ondernemingen, vrije beroepsbeoefenaren, instellingen en rechtspersonen die de in die leden bedoelde gegevens niet,
      niet tijdig of niet volledig verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0015926#Artikel33
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015926
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '43.2'
    text: De boete komt toe aan het CBS.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel43
  - number: '43.3'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Justitie, regels stellen ter zake van de uitoefening
      van de bevoegdheid tot oplegging van een boete.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel43
  - number: '44'
    text: |-
      Degene jegens wie een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan verbinden dat hem een
      boete zal worden opgelegd, is niet verplicht ter zake daarvan enige verklaring af te leggen. Hij wordt hiervan in
      kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel44
  - number: '45.1'
    text: |-
      Indien de directeur-generaal voornemens is een boete op te leggen, geeft hij de betrokkene daarvan kennis onder
      vermelding van de gronden waarop het voornemen berust.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel45
  - number: '45.2'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt de directeur-generaal de betrokkene
      in de gelegenheid om naar keuze schriftelijk of mondeling binnen een redelijke termijn zijn zienswijze naar voren
      te brengen voordat de boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '46'
    text: |-
      De directeur-generaal legt geen boete op indien degene aan wie het niet, niet tijdig of niet volledig verstrekken
      van gegevens kan worden toegerekend aannemelijk maakt dat hem ter zake geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel46
  - number: '47.1'
    text: De directeur-generaal legt de boete op bij beschikking.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel47
  - number: '47.2'
    text: 'De beschikking vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel47
  - number: 47.2.a
    text: het feit ter zake waarvan de bestuurlijke boete wordt opgelegd, alsmede het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel47
  - number: 47.2.b
    text: het bedrag van de boete;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel47
  - number: 47.2.c
    text: de termijn waarbinnen de boete moet worden betaald.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel47
  - number: '48'
    text: |-
      De werking van de beschikking tot oplegging van een boete wordt opgeschort totdat de beroepstermijn is verstreken,
      of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel48
  - number: '49.1'
    text: De boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel49
  - number: '49.2'
    text: |-
      Indien niet tijdig is betaald, wordt degene die de boete is verschuldigd schriftelijk bevolen binnen twee weken
      alsnog het bedrag van de boete, verhoogd met de kosten van de aanmaning te betalen.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel49
  - number: '49.3'
    text: |-
      Bij gebreke van betaling binnen de in het tweede lid genoemde termijn, kan de directeur-generaal de verschuldigde
      boete, verhoogd met de op de aanmaning en invordering betrekking hebbende kosten, invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel49
  - number: '49.4'
    text: |-
      Het dwangbevel wordt op kosten van degene die de boete is verschuldigd bij deurwaardersexploot betekend en levert
      een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '49.5'
    text: Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van het CBS.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel49
  - number: '49.6'
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van het CBS kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel49
  - number: '50'
    text: |-
      De werkzaamheden in verband met het opleggen van een boete worden verricht door personen die niet betrokken zijn
      bij het vaststellen van de overtreding en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel50
  - number: '51'
    text: |-
      De directeur-generaal kan in plaats van een bestuurlijke boete aan de in [artikel 33, derde lid][ref1], bedoelde
      ondernemingen, vrije beroepsbeoefenaren, instellingen en rechtspersonen die de in dat artikellid bedoelde gegevens
      niet, niet tijdig of niet volledig verstrekken, een last onder dwangsom opleggen. Een bestuurlijke boete en een
      last onder dwangsom kunnen tevens gezamenlijk worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel33
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '52.1'
    text: |-
      Aan een last onder dwangsom kunnen voorschriften worden verbonden inzake het verstrekken van gegevens aan de
      directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel52
  - number: '52.2'
    text: Een last geldt voor een door de directeur-generaal te bepalen termijn van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel52
  - number: '52.3'
    text: |-
      De [artikelen 5:32, vierde en vijfde lid][ref1], [5:33][ref2], [5:34, eerste lid][ref3], en
      [5:35 van de Algemene wet bestuursrecht][ref4] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '53.1'
    text: De directeur-generaal stelt jaarlijks een jaarverslag op.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel53
  - number: '53.2'
    text: |-
      Het jaarverslag beschrijft de taakuitoefening en het gevoerde beleid ter uitvoering van deze wet en van andere
      wetten, voor zover in de desbetreffende wet niet is voorzien in een afzonderlijke verplichting tot het opstellen
      van een verslag. Het jaarverslag beschrijft voorts het gevoerde beleid met betrekking tot de kwaliteitszorg.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel53
  - number: '53.3'
    text: |-
      Het jaarverslag verschaft tevens inzicht in de administratieve lasten in dat jaar voor ondernemingen en
      instellingen als gevolg van de verwerving van gegevens door de directeur-generaal, in de voorzieningen die
      de directeur-generaal heeft getroffen ingevolge [artikel 36][ref1] en in de mate van terugdringing van de
      administratieve lasten.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel36
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '36'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '53.4'
    text: |-
      Het jaarverslag wordt vóór 1 maart ter goedkeuring aan de CCS gezonden, die het vóór 1 april aan Onze Minister
      zendt.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel53
  - number: '54.1'
    text: |-
      De CCS stelt jaarlijks een jaarverslag op. Het jaarverslag beschrijft de taakuitoefening en het gevoerde beleid.
      Het jaarverslag beschrijft voorts het gevoerde beleid met betrekking tot de kwaliteitszorg.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel54
  - number: '54.2'
    text: Het jaarverslag wordt vóór 1 april ter goedkeuring aan Onze Minister gezonden.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel54
  - number: '55'
    text: |-
      Onze Minister kan regels stellen over de inrichting van het jaarverslag, bedoeld in de [artikelen 53][ref1] en
      [54][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0015926#Artikel54
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015926
        artikel: '54'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '56.1'
    text: |-
      De directeur-generaal legt het door de CCS goedgekeurde jaarverslag, bedoeld in [artikel 53][ref1], en het door
      Onze Minister goedgekeurde jaarverslag, bedoeld in [artikel 54][ref2], ter inzage bij het CBS gedurende acht weken.
      Hiervan doet de directeur-generaal mededeling in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0015926#Artikel54
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015926
        artikel: '54'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '56.2'
    text: Onze Minister zendt onverwijld een afschrift van de jaarverslagen aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel56
  - number: 56a.1
    text: 'De directeur-generaal en de CCS zien met betrekking tot de uitoefening van hun taken en bevoegdheden toe op:'
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel56a
  - number: 56a.1.a
    text: een tijdige voorbereiding en uitvoering;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel56a
  - number: 56a.1.b
    text: de kwaliteit van de daarbij gebruikte procedures;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel56a
  - number: 56a.1.c
    text: de zorgvuldige behandeling van personen en instellingen die met hen in aanraking komen;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel56a
  - number: 56a.1.d
    text: de zorgvuldige behandeling van bezwaarschriften en klachten die worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel56a
  - number: 56a.2
    text: |-
      De directeur-generaal en de CCS treffen voorzieningen waardoor personen en instellingen, die met hen in aanraking
      komen, in de gelegenheid zijn voorstellen tot verbeteringen van werkwijzen en procedures te doen.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel56a
  - number: 56a.3
    text: |-
      In de jaarverslagen, bedoeld in de [artikelen 53][ref1] en [54][ref2], doen de directeur-generaal en de CCS verslag
      van hetgeen tot uitvoering van het eerste en het tweede lid is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0015926#Artikel54
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0015926
        artikel: '54'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '57.1'
    text: |-
      De directeur-generaal en de CCS verstrekken desgevraagd aan Onze Minister alle voor de uitoefening van zijn taak
      benodigde inlichtingen. Onze Minister kan inzage vorderen van alle zakelijke gegevens en bescheiden, indien dat
      voor de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel57
  - number: '57.2'
    text: |-
      De directeur-generaal en de CCS geven bij het verstrekken van de in het eerste lid bedoelde inlichtingen waar nodig
      aan welke gegevens een vertrouwelijk karakter dragen. Dit vertrouwelijke karakter kan voortvloeien uit de aard van
      de gegevens, dan wel uit het feit dat natuurlijke of rechtspersonen deze hebben verstrekt onder het beding dat zij
      als vertrouwelijk zullen gelden.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel57
  - number: '57.3'
    text: Onze Minister kan nadere regels stellen met betrekking tot de in het eerste lid bedoelde gegevensuitwisseling.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel57
  - number: '58.1'
    text: Onze Minister kan een besluit van de directeur-generaal en van de CCS vernietigen.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel58
  - number: '58.2'
    text: Van een vernietigingsbesluit wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel58
  - number: '59.1'
    text: |-
      Indien naar het oordeel van Onze Minister de directeur-generaal zijn taak dan wel de CCS haar taak ernstig
      verwaarloost, kan Onze Minister de noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel59
  - number: '59.2'
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat het orgaan in de
      gelegenheid is gesteld om binnen een door Onze minister te stellen termijn alsnog zijn taak naar behoren uit te
      voeren.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel59
  - number: '59.3'
    text: |-
      Onze Minister stelt de beide kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel59
  - number: '60'
    text: |-
      De kosten voor de uitoefening van de taken ter uitvoering van deze wet komen ten laste van de rijksbegroting, met
      uitzondering van de kosten voor de uitvoering van de statistische werkzaamheden voor derden.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel60
  - number: '61.1'
    text: De directeur-generaal stelt jaarlijks een begroting op.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel61
  - number: '61.2'
    text: |-
      De begroting bevat een voorstel aan Onze Minister aangaande het bedrag dat in het betreffende jaar in de
      rijksbegroting zal worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel61
  - number: '62.1'
    text: |-
      De begroting behelst een raming van de baten en lasten, een raming van de voorgenomen investeringsuitgaven en een
      raming van de inkomsten en uitgaven.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel62
  - number: '62.2'
    text: De begrotingsposten worden ieder afzonderlijk van een toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel62
  - number: '62.3'
    text: |-
      Uit de toelichting blijkt steeds welke begrotingsposten betrekking hebben op de uitoefening van de bij of krachtens
      de wet opgedragen taken dan wel op andere activiteiten.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel62
  - number: '62.4'
    text: |-
      Tenzij de activiteiten waarop de begroting betrekking heeft, nog niet eerder werden verricht, behelst de begroting
      een vergelijking met de begroting van het lopende jaar en de laatst goedgekeurde jaarrekening.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel62
  - number: '63'
    text: Onze Minister kan regels stellen over de inrichting van de begroting.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel63
  - number: '64.1'
    text: De directeur-generaal zendt de begroting vóór 1 februari aan de CCS.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel64
  - number: '64.2'
    text: De directeur-generaal stelt de begroting vast in overeenstemming met de CCS.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel64
  - number: '64.3'
    text: De directeur-generaal zendt de begroting vóór 1 april aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel64
  - number: '65.1'
    text: Het besluit tot vaststelling van de begroting behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel65
  - number: '65.2'
    text: |-
      De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang, of indien Onze Minister
      bezwaar heeft tegen de hoogte van het voorgestelde bedrag dat in de rijksbegroting zal worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel65
  - number: '66'
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en de
      begrote baten en lasten dan wel inkomsten en uitgaven, doet de directeur-generaal daarvan onverwijld mededeling aan
      de CCS en Onze Minister onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel66
  - number: '67.1'
    text: |-
      De directeur-generaal houdt de financiële middelen van het CBS aan in rekening-courant bij Onze Minister van
      Financiën.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel67
  - number: '67.2'
    text: |-
      De directeur-generaal kan voor de uitoefening van de taken ter uitvoering van deze wet beschikken over de
      financiële middelen die hij in rekening-courant bij Onze Minister van Financiën aanhoudt.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel67
  - number: '67.3'
    text: |-
      Onze Minister van Financiën stelt in overeenstemming met Onze Minister, na overleg met de directeur-generaal,
      regels omtrent de rente die over de saldi van de in dit artikel bedoelde rekening-courant wordt vergoed
      onderscheidenlijk in rekening wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel67
  - number: '67.4'
    text: |-
      Onze Minister van Financiën brengt voor het beheer van de in dit artikel bedoelde rekening-courant geen kosten
      in rekening.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel67
  - number: '67.5'
    text: |-
      De directeur-generaal kan met de goedkeuring en onder garantie van Onze Minister ten behoeve van de financiering
      van investeringen, leningen bij Onze Minister van Financiën verkrijgen, indien de investeringen benodigd zijn voor
      de uitoefening van de taken ter uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel67
  - number: '67.6'
    text: Onze Minister van Financiën kan in overeenstemming met Onze Minister nadere regels stellen omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel67
  - number: '68'
    text: 'De directeur-generaal behoeft voorafgaande instemming van Onze Minister voor:'
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel68
  - number: 68.a
    text: het oprichten dan wel deelnemen in een rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel68
  - number: 68.b
    text: het in eigendom verwerven, het vervreemden of het bezwaren van registergoederen;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel68
  - number: 68.c
    text: |-
      het aangaan en beëindigen van overeenkomsten tot verkrijging, vervreemding of bezwaring van registergoederen of tot
      huur, verhuur of pacht daarvan;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel68
  - number: 68.d
    text: het aangaan van kredietovereenkomsten en van overeenkomsten van geldlening;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel68
  - number: 68.e
    text: |-
      het aangaan van overeenkomsten waarbij het CBS zich verbindt tot zekerheidstelling met inbegrip van
      zekerheidstelling voor schulden van derden of waarbij het zich als borg of hoofdelijk medeschuldenaar verbindt of
      zich voor een derde sterk maakt;
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel68
  - number: 68.f
    text: |-
      het vormen van andere fondsen en reserveringen dan de egalisatiereserve, bedoeld in [artikel 69][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel69
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 68.g
    text: het doen van aangifte tot zijn faillissement of het aanvragen van zijn surséance van betaling.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel68
  - number: '69.1'
    text: De directeur-generaal vormt een egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel69
  - number: '69.2'
    text: |-
      Het verschil tussen de gerealiseerde baten en de gerealiseerde lasten komt ten gunste onderscheidenlijk ten laste
      van de egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel69
  - number: '69.3'
    text: De van de egalisatiereserve genoten rente wordt aan de egalisatiereserve toegevoegd.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel69
  - number: '70.1'
    text: De directeur-generaal stelt jaarlijks een jaarrekening op.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel70
  - number: '70.2'
    text: De directeur-generaal zendt de jaarrekening vóór 1 maart aan de CCS.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel70
  - number: '70.3'
    text: De directeur-generaal stelt de jaarrekening vast in overeenstemming met de CCS.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel70
  - number: '70.4'
    text: De directeur-generaal zendt de jaarrekening vóór 1 april aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel70
  - number: '71.1'
    text: Het besluit tot vaststelling van de jaarrekening behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel71
  - number: '71.2'
    text: De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel71
  - number: '72.1'
    text: |-
      De jaarrekening, waarin rekening en verantwoording wordt afgelegd van het financieel beheer en van de geleverde
      prestaties over het verstreken boekjaar, wordt ingericht zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '72.2'
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid,
      afgegeven door een door de directeur-generaal aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Bij de aanwijzing van de accountant bedingt
      de directeur-generaal dat aan Onze Minister desgevraagd inzicht wordt geboden in de controlewerkzaamheden van de
      accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '72.3'
    text: |-
      De verklaring, bedoeld in het tweede lid, heeft mede betrekking op de rechtmatige inning en besteding van de
      middelen door het CBS.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel72
  - number: '72.4'
    text: |-
      De accountant voegt bij de verklaring, bedoeld in het tweede lid, tevens een verslag van zijn bevindingen over de
      vraag of het beheer en de organisatie van het CBS voldoen aan eisen van doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel72
  - number: '73'
    text: |-
      Onze Minister kan regels stellen over de inrichting van de jaarrekening en aandachtspunten voor de
      accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel73
  - number: '75'
    text: |-
      De [wet van 28 december 1936, houdende maatregelen tot het verkrijgen van juiste economische statistieken][ref1]
      (Stb. 639DD), wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001982
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0001982
  - number: '76'
    text: |-
      De [Wet verstrekking gegevens CBS voor statistische doeleinden][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004339
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004339
  - number: '77'
    text: |-
      De [Wet op het Centraal bureau en de Centrale commissie voor de statistiek][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008005
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0008005
  - number: '78.1'
    text: |-
      Met ingang van het tijdstip van verzelfstandiging van het CBS zijn de personeelsleden van het onder Onze Minister
      ressorterende CBS van rechtswege ontslagen en aangesteld als ambtenaar in dienst van het verzelfstandigde CBS.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel78
  - number: '78.2'
    text: |-
      De overgang van de in het eerste lid bedoelde personeelsleden vindt plaats met een rechtspositie die als geheel
      ten minste gelijkwaardig is aan die welke voor elk van hen gold bij het onder Onze Minister ressorterende
      dienstonderdeel.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel78
  - number: '78.3'
    text: |-
      De personen die op het tijdstip van verzelfstandiging van het CBS krachtens een arbeidsovereenkomst naar burgerlijk
      recht behoren tot het personeel van het onder Onze Minister ressorterende CBS, zijn met ingang van dat tijdstip
      van rechtswege ontslagen en aangesteld in dienst van het verzelfstandigde CBS met een rechtspositie die als
      geheel ten minste gelijkwaardig is aan die welke voor elk van hen gold bij het onder Onze Minister ressorterende
      dienstonderdeel.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel78
  - number: '78.4'
    text: |-
      De door Onze Minister vastgestelde rechtspositieregels die op het tijdstip van verzelfstandiging van het CBS
      gelden voor het personeel van het onder Onze Minister ressorterende CBS blijven met ingang van dat tijdstip van
      overeenkomstige toepassing op het personeel in dienst van het verzelfstandigde CBS totdat daarin op grond van
      [artikel 7, eerste lid][ref1], is voorzien door de directeur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel7
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '79.1'
    text: |-
      Onze Minister bepaalt in overeenstemming met Onze Minister van Financiën welke vermogensbestanddelen van de Staat
      die aan het onder Onze Minister ressorterende CBS worden toegerekend, worden toebedeeld aan het verzelfstandigde
      CBS.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel79
  - number: '79.2'
    text: |-
      De in het eerste lid bedoelde vermogensbestanddelen gaan met ingang van het tijdstip van verzelfstandiging van het
      CBS onder algemene titel over op het verzelfstandigde CBS tegen een door Onze Minister in overeenstemming met Onze
      Minister van Financiën te bepalen waarde.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel79
  - number: '79.3'
    text: |-
      Ingeval krachtens het eerste en het tweede lid registergoederen overgaan, zal verandering in de tenaamstelling
      in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1]
      plaatsvinden. De daartoe nodige opgaven worden door de zorg van Onze Minister van Financiën aan de bewaarders van
      de desbetreffende registers gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '80'
    text: |-
      Archiefbescheiden van het onder Onze Minister ressorterende CBS gaan met ingang van het tijdstip van
      verzelfstandiging van het CBS over naar het verzelfstandigde CBS, voor zover zij niet overeenkomstig de
      [Archiefwet 1995][ref1] zijn overgebracht naar een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '81.1'
    text: |-
      In wettelijke procedures en rechtsgedingen, waarbij het onder Onze Minister ressorterende CBS is betrokken, treedt
      met ingang van het tijdstip van verzelfstandiging van het CBS het verzelfstandigde CBS dan wel de directeur-
      generaal in de plaats van de Staat dan wel Onze Minister.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel81
  - number: '81.2'
    text: |-
      In zaken waarin voor het tijdstip van verzelfstandiging van het CBS op grond van
      [artikel 12 van de Wet Nationale ombudsman][ref1] aan de Nationale ombudsman is verzocht een onderzoek te doen
      dan wel de Nationale ombudsman op grond van [artikel 15 van die wet][ref2] een onderzoek heeft ingesteld naar een
      gedraging die kan worden toegerekend aan het onder Onze minister ressorterende CBS, treedt de directeur-generaal op
      dat tijdstip als bestuursorgaan in de zin van de [Wet Nationale ombudsman][ref3] in de plaats van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003372#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003372
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003372
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0003372
  - number: '82'
    text: |-
      Onze Minister zendt elke vijf jaar een verslag aan beide kamers der Staten-Generaal ten behoeve van de beoordeling
      van de doelmatigheid en doeltreffendheid van het functioneren van het CBS.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel82
  - number: '83'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel83
  - number: '84'
    text: 'Deze wet wordt aangehaald als: Wet op het Centraal bureau voor de statistiek.'
    url: https://wetten.overheid.nl/BWBR0015926/2004-01-03#Artikel84
