---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_luchtkwaliteit_ozon
regulatory_layer: WET
publication_date: '2007-11-01'
valid_from: '2007-01-01'
bwb_id: BWBR0017451
url: https://wetten.overheid.nl/BWBR0017451/2007-01-01
preamble:
  text: |-
    Gelet op richtlijn nr. 2002/3/EG van het Europees Parlement en de Raad van 12 februari 2002 betreffende ozon in
    de lucht (PbEG L 67), richtlijn nr. 96/62/EG van de Raad van de Europese Unie van 27 september 1996 inzake de
    beoordeling en het beheer van de luchtkwaliteit (PbEG L 296) en de artikelen 5.1, 5.2, 5.2a, 5.3, 5.4 en 21.6,
    zesde lid, van de Wet milieubeheer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel1
  - number: 1.1.a
    text: |-
      acht-uurgemiddelde concentratie: concentratie in de buitenlucht, gemiddeld over acht achtereenvolgende
      uurgemiddelde concentraties, uitgedrukt in microgram per m3 lucht bij een temperatuur van 293 Kelvin en een druk
      van 101,3 kiloPascal;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel1
  - number: 1.1.b
    text: |-
      agglomeratie: stedelijk gebied met ten minste 250.000 inwoners, aangewezen in
      [artikel 2 van de Meetregeling luchtkwaliteit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012666#Artikel2
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012666
        artikel: '2'
  - number: 1.1.c
    text: |-
      alarmdrempel: kwaliteitsniveau van de buitenlucht dat bij kortstondige overschrijding risico’s voor de gezondheid
      van de mens inhoudt;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel1
  - number: 1.1.d
    text: |-
      AOT40-waarde: gesommeerd verschil tussen de uurgemiddelde concentraties van ozon boven 80 microgram per m3 en
      80 microgram per m3 tussen 08.00 uur en 20.00 uur Midden-Europese-Tijd, over een bepaalde periode, uitgedrukt in
      (microgram per m3) · uur;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel1
  - number: 1.1.e
    text: |-
      informatiedrempel: kwaliteitsniveau van de buitenlucht dat bij kortstondige overschrijding risico’s voor de
      gezondheid van bijzonder gevoelige bevolkingsgroepen inhoudt;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel1
  - number: 1.1.f
    text: |-
      meetmethode: procedure van het bemonsteren van de buitenlucht, het analyseren van aldus verkregen luchtmonsters,
      het kalibreren van daartoe te gebruiken apparatuur, alsmede de verwerking van het signaal tot uurgemiddelde, dan
      wel acht-uurgemiddelde concentraties;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel1
  - number: 1.1.g
    text: 'minister: Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel1
  - number: 1.1.h
    text: |-
      plandrempel: kwaliteitsniveau van de buitenlucht dat bij overschrijden aanleiding geeft tot het opstellen van een
      plan als bedoeld in [artikel 13][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017451#Artikel13
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017451
        artikel: '13'
        paragraaf: '4'
  - number: 1.1.i
    text: |-
      richtwaarde: bij deze regeling vastgestelde richtwaarde als bedoeld in
      [artikel 5.1, derde lid, van de Wet milieubeheer][ref1], ten aanzien van het kwaliteitsniveau van de buitenlucht;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: 1.1.j
    text: |-
      uurgemiddelde concentratie: concentratie in de buitenlucht, gemiddeld over een heel uur, uitgedrukt in microgram
      per m3 lucht bij een temperatuur van 293 Kelvin en een druk van 101,3 kiloPascal;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel1
  - number: 1.1.k
    text: |-
      vluchtige organische stoffen: antropogene en biogene organische verbindingen, uitgezonderd methaan, die onder
      invloed van zonlicht door reactie met stikstofoxiden fotochemische oxidanten kunnen vormen;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel1
  - number: 1.1.l
    text: |-
      zone: gedeelte van het Nederlandse grondgebied, aangewezen in [artikel 3 van de Meetregeling luchtkwaliteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012666#Artikel3
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012666
        artikel: '3'
  - number: '1.2'
    text: |-
      Deze regeling is niet van toepassing op een arbeidsplaats als bedoeld in
      [artikel 1, derde lid, onder g, van de Arbeidsomstandighedenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel1
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '1'
  - number: '2'
    text: |-
      Bestuursorganen houden, bij de uitoefening van bevoegdheden die gevolgen voor de luchtkwaliteit ten aanzien van
      ozon kunnen hebben, behoudens voorzover de betrokken wettelijke regeling zich daartegen verzet, rekening met de
      volgende richtwaarden voor ozon, opdat die waarden op 1 januari 2010 zo veel mogelijk zijn bereikt:
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel2
  - number: 2.a
    text: |-
      120 microgram per m3 als hoogste acht-uurgemiddelde concentratie van een dag, waarbij geldt dat deze gemiddeld over
      drie jaar op maximaal vijfentwintig dagen per kalenderjaar mag worden overschreden;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel2
  - number: 2.b
    text: |-
      18.000 (microgram per m3) · uur als AOT40-waarde voor de periode van 1 mei tot en met 31 juli, gemiddeld over vijf
      jaar.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel2
  - number: '3'
    text: |-
      Bestuursorganen houden, bij de uitoefening van bevoegdheden die gevolgen voor de luchtkwaliteit ten aanzien van
      ozon kunnen hebben, behoudens voorzover de betrokken wettelijke regeling zich daartegen verzet, rekening met de
      volgende richtwaarden voor ozon, opdat die waarden op 1 januari 2020 zo veel mogelijk zijn bereikt:
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel3
  - number: 3.a
    text: 120 microgram per m3 als hoogste acht-uurgemiddelde concentratie van een dag, gedurende een kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel3
  - number: 3.b
    text: 6.000 (microgram per m3) · uur als AOT40-waarde voor de periode van 1 mei tot en met 31 juli van een kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel3
  - number: '4'
    text: |-
      Bestuursorganen nemen voor ozon een informatiedrempel in acht van 180 microgram per m3 als uurgemiddelde
      concentratie.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel4
  - number: '5'
    text: Bestuursorganen nemen voor ozon een alarmdrempel in acht van 240 microgram per m3 als uurgemiddelde concentratie.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel5
  - number: '6'
    text: |-
      De minister stelt in agglomeraties en zones de luchtverontreiniging door ozon vast met gebruikmaking van vaste
      meetpunten.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel6
  - number: '7.1'
    text: |-
      De agglomeraties Amsterdam/Haarlem, Den Haag/Leiden en Rotterdam/Dordrecht bevatten elk ten minste drie vaste
      meetpunten voor ozon, waarvan er twee tevens als meetpunt voor stikstofdioxide worden gebruikt. Per agglomeratie
      worden twee van de bedoelde meetpunten in voorstedelijk gebied geplaatst.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel7
  - number: '7.2'
    text: |-
      De agglomeraties Utrecht, Eindhoven en Heerlen/Kerkrade bevatten elk ten minste één vast meetpunt voor ozon, dat
      tevens als meetpunt voor stikstofdioxide wordt gebruikt. Per agglomeratie wordt één van de bedoelde meetpunten in
      voorstedelijk gebied geplaatst.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel7
  - number: '8.1'
    text: |-
      Zone noord en zone zuid bevatten elk ten minste zes vaste meetpunten voor ozon, waarvan er drie tevens als meetpunt
      voor stikstofdioxide worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel8
  - number: '8.2'
    text: |-
      Zone midden bevat ten minste zeven vaste meetpunten voor ozon, waarvan er vier tevens als meetpunt voor
      stikstofdioxide worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel8
  - number: '8.3'
    text: Per zone wordt één van de in het eerste en tweede lid genoemde meetpunten in voorstedelijk gebied geplaatst.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel8
  - number: '8.4'
    text: |-
      Van de in het eerste en tweede lid genoemde meetpunten wordt in totaal één meetpunt tevens als meetpunt voor
      stikstofoxiden en vluchtige organische stoffen gebruikt.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel8
  - number: '9'
    text: |-
      Meetpunten voor de meting van concentraties ozon ter controle van de naleving van de [artikelen 2][ref1],
      [3][ref2], [4][ref3] en [5][ref4] worden zodanig geplaatst dat:


      [ref1]: https://wetten.overheid.nl/BWBR0017451#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017451#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0017451#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0017451#Artikel5
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017451
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017451
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017451
        artikel: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0017451
        artikel: '5'
        paragraaf: '2'
  - number: 9.a
    text: |-
      gegevens kunnen worden verkregen over de gebieden binnen zones en agglomeraties waar de hoogste concentraties
      voorkomen waaraan de bevolking dan wel de vegetatie kan worden blootgesteld;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel9
  - number: 9.b
    text: zij zich bevinden buiten de directe invloedssfeer van plaatselijke emissiebronnen;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel9
  - number: 9.c
    text: |-
      gegevens kunnen worden verkregen die representatief zijn voor soortgelijke plaatsen buiten de onmiddellijke
      omgeving van de meetpunten.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel9
  - number: '10'
    text: |-
      Monsterneming bij de in de [artikelen 7][ref1] en [8][ref2] bedoelde meetpunten geschiedt op een zodanige wijze
      dat:


      [ref1]: https://wetten.overheid.nl/BWBR0017451#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0017451#Artikel8
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017451
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017451
        artikel: '8'
        paragraaf: '3'
  - number: 10.a
    text: |-
      de lucht rond de inlaatbuis vrij kan stromen en er geen voorwerpen zijn die de luchtstroom in de omgeving van de
      monsternemer beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel10
  - number: 10.b
    text: de hoogte van de inlaatbuis tussen anderhalve en vier meter boven de grond ligt;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel10
  - number: 10.c
    text: de uitlaatbuis op een zodanige plaats is gesitueerd dat de lucht daaruit niet opnieuw in de inlaatbuis kan komen.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel10
  - number: '11'
    text: |-
      Voor de meting van de luchtverontreiniging door ozon wordt gebruik gemaakt van een meetmethode waarvan de bovenste
      analysegrens ten minste 1000 microgram per m3 bedraagt en waarbij de onder operationele condities verkregen
      meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de gemeten en de
      werkelijke concentratie minder is dan 15 procent voor uurgemiddelde concentraties tussen 70 microgram per m3 en 500
      microgram per m3.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel11
  - number: '12.1'
    text: Per meetpunt voor de meting van ozon worden uurgemiddelde concentraties bepaald.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel12
  - number: '12.2'
    text: |-
      Indien minder dan vijfenveertig minuten meetsignalen beschikbaar zijn, wordt geen uurgemiddelde concentratie
      bepaald.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel12
  - number: '12.3'
    text: |-
      Uit acht achtereenvolgende uurgemiddelde concentraties worden acht-uurgemiddelde concentraties voortschrijdend
      berekend. Het eerste acht-uurgemiddelde op een dag betreft de periode van 17.00 uur op de voorgaande dag tot 1.00
      uur; het laatste acht-uurgemiddelde op een dag betreft de periode van 16.00 uur tot 24 uur.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel12
  - number: '12.4'
    text: |-
      Indien in een periode van acht uur minder dan zes uurgemiddelde concentraties van ozon beschikbaar zijn, wordt geen
      acht-uurgemiddelde concentratie berekend.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel12
  - number: '12.5'
    text: |-
      Indien per dag minder dan achttien voortschrijdende acht-uurgemiddelden beschikbaar zijn wordt geen hoogste acht-
      uurgemiddelde per dag bepaald.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel12
  - number: '12.6'
    text: |-
      Uit de uurgemiddelde concentraties wordt voor de periode 1 mei tot en met 31 juli en de periode 1 april tot en met
      30 september een AOT 40-waarde berekend.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel12
  - number: '12.7'
    text: |-
      Indien minder dan 90 procent van de uurwaarden tussen 08.00 uur en 20.00 uur Midden-Europese-Tijd in de periode van
      1 mei tot en met 31 juli en in de periode van 1 april tot en met 30 september beschikbaar zijn, worden geen AOT40-
      waarden berekend.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel12
  - number: '12.8'
    text: |-
      Indien ten minste 90 procent, maar minder dan 100 procent van de uurwaarden tussen 08.00 uur en 20.00 uur Midden-
      Europese-Tijd in de periode van 1 mei tot en met 31 juli en in de periode van 1 april tot en met 30 september
      beschikbaar zijn, worden de AOT40-waarden bepaald door de gemeten AOT40-waarde te vermenigvuldigen met de uitkomst
      van het totaal aantal mogelijke uren in die periodes gedeeld door het aantal gemeten uurgemiddelde concentraties.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel12
  - number: '12.9'
    text: |-
      Indien voor vijf van de zes maanden in de periode van 1 april tot en met 30 september minder dan 90 procent
      van de hoogste acht-uurgemiddelde concentraties van de dagen dan wel minder dan 90 procent van de uurgemiddelde
      concentraties tussen 08.00 uur en 20.00 uur beschikbaar zijn, wordt het aantal overschrijdingen van de acht-
      uurgemiddelde concentratie en de hoogste acht-uurgemiddelde concentratie per jaar niet bepaald.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel12
  - number: '12.10'
    text: |-
      Indien het drie-jaargemiddelde van het aantal overschrijdingen, bedoeld in [artikel 2, onder a][ref1], niet kan
      worden vastgesteld op basis van een volledige en ononderbroken reeks jaargegevens, wordt gebruik gemaakt van de
      gegevens van ten minste één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017451#Artikel2
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0017451
        artikel: '2'
        paragraaf: '2'
  - number: '12.11'
    text: |-
      Indien het vijf-jaargemiddelde van de AOT40-waarde, bedoeld in [artikel 2, onder b][ref1], niet kan worden
      vastgesteld op basis van een volledige en ononderbroken reeks jaargegevens wordt gebruik gemaakt van de gegevens
      van ten minste drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017451#Artikel2
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0017451
        artikel: '2'
        paragraaf: '2'
  - number: '13.1'
    text: |-
      De minister stelt voor plaatsen waar de in [artikel 2][ref1] genoemde richtwaarden voor ozon worden overschreden
      een plan vast waarin wordt aangegeven op welke wijze met inzet van proportionele maatregelen zo veel mogelijk
      voldaan zal worden aan die waarden. De minister draagt zorg voor de uitvoering van het plan.


      [ref1]: https://wetten.overheid.nl/BWBR0017451#Artikel2
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017451
        artikel: '2'
        paragraaf: '2'
  - number: '13.2'
    text: |-
      Een plan als bedoeld in het eerste lid bevat ten minste de in de bijlage, behorende bij deze regeling, genoemde
      gegevens.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel13
  - number: '13.3'
    text: |-
      Een plan wordt vastgesteld voor 1 december van het jaar volgend op het jaar waarin de overschrijding van de waarden
      door de toepassing van [artikel 6][ref1] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017451#Artikel6
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017451
        artikel: '6'
        paragraaf: '3'
  - number: '13.4'
    text: |-
      Voor plaatsen waar ingevolge de [artikelen 25][ref1] of [26 van het Besluit luchtkwaliteit][ref2] tevens voor een
      andere luchtverontreinigende stof een plan wordt vastgesteld en uitgevoerd, draagt de minister zorg voor één plan
      voor de desbetreffende stoffen. Het tweede lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0012550#Artikel26
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012550
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0012550
        artikel: '26'
  - number: '14'
    text: |-
      Op plaatsen waar de luchtkwaliteit voldoet aan de in [artikel 2][ref1] genoemde richtwaarden, maar niet in
      overeenstemming is met de in [artikel 3][ref2] genoemde richtwaarden, treft de minister kosten-effectieve
      maatregelen teneinde die overschrijding zoveel mogelijk te beëindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0017451#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017451#Artikel3
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017451
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017451
        artikel: '3'
        paragraaf: '2'
  - number: '15.1'
    text: |-
      De commissaris van de Koningin doet van een overschrijding van de in [artikel 4][ref1] genoemde informatiedrempel
      of de in [artikel 5][ref2] genoemde alarmdrempel zo spoedig mogelijk mededeling aan het publiek. Daarbij worden ten
      minste de volgende gegevens verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0017451#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017451#Artikel5
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0017451
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017451
        artikel: '5'
        paragraaf: '2'
  - number: 15.1.a
    text: |-
      de drempel die is overschreden, de datum, het tijdstip, de duur en de plaats van de overschrijding en, indien
      bekend, de oorzaak van de overschrijding;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel15
  - number: 15.1.b
    text: |-
      een prognose voor de volgende middag, dag of dagen, met betrekking tot: - de ontwikkeling van de concentratie en de
      gegevens die aan die verwachting ten grondslag liggen,
        - het geografische gebied waar de overschrijding zich zal voordoen en
        - de duur van de overschrijding;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel15
  - number: 15.1.c
    text: |-
      de bevolkingsgroep of bevolkingsgroepen waarvoor de overschrijding risico’s kan inhouden voor de gezondheid,
      alsmede de te verwachten symptomen en te treffen voorzorgsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel15
  - number: 15.1.d
    text: bronnen voor het verkrijgen van nadere informatie;
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel15
  - number: 15.1.e
    text: de hoogste uurgemiddelde concentratie en de hoogste acht-uurgemiddelde concentratie van ozon.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel15
  - number: '15.2'
    text: |-
      Wanneer de informatiedrempel, bedoeld in [artikel 4][ref1], of de alarmdrempel, bedoeld in [artikel 5][ref2],
      dreigt te worden overschreden, geeft de commissaris van de Koningin, voor zover dat in de gegeven omstandigheden
      redelijkerwijs mogelijk is, uitvoering aan het eerste lid, met uitzondering van onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0017451#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017451#Artikel5
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0017451
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017451
        artikel: '5'
        paragraaf: '2'
  - number: '15.3'
    text: |-
      [Artikel 48, derde lid, van de Wet inzake de luchtverontreiniging][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel48
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002731
        artikel: '48'
  - number: '16'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel16
  - number: '17'
    text: 'Deze regeling wordt aangehaald als: Regeling luchtkwaliteit ozon.'
    url: https://wetten.overheid.nl/BWBR0017451/2007-01-01#Artikel17
