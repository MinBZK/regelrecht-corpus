  - number: '2'
    text: Het houden, doden of doen doden van een pelsdier is verboden.
    url: https://wetten.overheid.nl/BWBR0032739/2024-01-01#Artikel2
  - number: '3'
    text: |-
      1 Degene die op de dag van inwerkingtreding van deze wet nertsen als pelsdier houdt, doet daarvan binnen vier weken
      na inwerkingtreding van deze wet melding aan Onze Minister, onder opgave van:

      a. het aantal nertsen dat hij volgens zijn vergunning, als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1],
      mag houden;

      b. het aantal huisvestingsplaatsen, onderscheiden naar het aantal huisvestingsplaatsen voor reuen, voedsters en
      jonge dieren, dat op het tijdstip van melding in de nertsenhouderij beschikbaar is;

      c. het aantal nertsen dat op het tijdstip van melding door hem wordt gehouden, onderscheiden naar de aantallen
      reuen, voedsters en de daarbij behorende jonge dieren; en

      d. de plaats of plaatsen waar de nertsen op het tijdstip van melding worden gehouden.

      2 Het eerste lid is van overeenkomstige toepassing op degene die op de dag van inwerkingtreding van deze wet:

      a. geen nertsen als pelsdieren houdt;

      b. beschikt over een vergunning, als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref2], ten behoeve van het
      houden van nertsen als pelsdieren; en

      c. beschikt over huisvestingsplaatsen.

      3 Het eerste lid is van overeenkomstige toepassing op degene die na de inwerkingtreding van deze wet een
      nertsenhouderij heeft verkregen in verband met een bijzondere omstandigheid van de overdrager, met dien verstande
      dat de melding binnen vier weken na de overdracht van de nertsenhouderij plaatsvindt.

      4 Onder een bijzondere omstandigheid als bedoeld in het derde lid wordt verstaan de omstandigheid dat de
      nertsenhouder groot financieel nadeel lijdt doordat:

      a. hij door plotselinge arbeidsongeschiktheid niet langer in staat is het houden van nertsen voort te zetten;

      b. de nertsenhouderij deel uitmaakt van een te verdelen gemeenschap en de nertsenhouderij als vermogensbestanddeel
      te gelde moet worden gemaakt om de gemeenschap te kunnen verdelen; of

      c. hij wegens het bereiken van de leeftijd van 65 jaar de nertsenhouderij niet wil of kan voortzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
    url: https://wetten.overheid.nl/BWBR0032739/2024-01-01#Artikel3
