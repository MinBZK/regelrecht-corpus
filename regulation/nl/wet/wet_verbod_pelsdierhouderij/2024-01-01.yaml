preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het houden, doden of doen doden van pelsdieren te
    verbieden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032739/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. *huisvestingsplaats:* leefruimte dienende tot het houden van nertsen, bestaande uit één of meer compartimenten
      en voorzien van één of meer verrijkingsobjecten, met daaraan gekoppelde nestboxen, en die ten minste voldoet aan de
      eisen gesteld in de Verordening welzijnsnormen nertsen (PPE) 2003, zoals deze luidde op 17 januari 2008;

      b. *nerts:* dier behorend tot de diersoort Mustela vison;

      c. *nertsenhouderij:* bedrijf of een gedeelte daarvan, als bedoeld in
      [artikel 1, onderdeel i, van de Meststoffenwet][ref1], dienende tot het houden van nertsen, zulks beoordeeld naar
      de feitelijke omstandigheden;

      d. *Onze Minister:* Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

      e. *pelsdier:* dier dat gehouden wordt uitsluitend of in hoofdzaak ter verkrijging van de pels.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0032739/2024-01-01#Artikel1
