  - number: '7'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over tegemoetkoming in de kosten van sloop
      of ombouw van gebouwen waarin nertsen beroepsmatig gehouden worden, die als gevolg van het verbod, bedoeld in
      [artikel 2][ref1], hun functie verliezen.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0032739#Artikel2
    url: https://wetten.overheid.nl/BWBR0032739/2024-01-01#Artikel7
