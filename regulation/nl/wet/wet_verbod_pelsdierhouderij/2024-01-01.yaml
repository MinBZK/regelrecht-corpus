  - number: '4'
    text: |-
      [Artikel 2][ref1] is niet van toepassing op degene bedoeld in [artikel 3, eerste tot en met derde lid][ref2], tot
      en met de dertiende dag na de datum van inwerkingtreding van de Wet van 16 december 2020 tot wijziging van de Wet
      verbod pelsdierhouderij in verband met een vervroegde beëindiging van de pelsdierhouderij (Stb. 2020, 555), indien
      hij:

      a. aan de meldingsplicht van [artikel 3][ref3] heeft voldaan;

      b. de nertsen houdt in een huisvestingsplaats;

      c. niet meer nertsen houdt dan het aantal nertsen waarvoor hij een omgevingsvergunning voor een milieubelastende
      activiteit als bedoeld in [artikel 5.1, tweede lid, aanhef en onder b, van de Omgevingswet][ref4] heeft;

      d. niet meer nertsen houdt dan het aantal huisvestingsplaatsen dat ten behoeve van het houden van die soort nertsen
      op het tijdstip van melding in de nertsenhouderij beschikbaar was; en

      e. de nertsen houdt op dezelfde plaats als waar zij werden gehouden op het tijdstip van melding, dan wel op een
      andere plaats, mits op de oude plaats niet langer sprake is van een nertsenhouderij en van deze verplaatsing
      melding is gedaan aan Onze Minister.


