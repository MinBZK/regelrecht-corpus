  - number: '8'
    text: |-
      Onze Minister kent een pelsdierhouder op aanvraag een vergoeding toe voor schade veroorzaakt door de Wet van
      16 december 2020 tot wijziging van de Wet verbod pelsdierhouderij in verband met een vervroegde beëindiging van de
      pelsdierhouderij (Stb. 2020, 555) die uitgaat boven het normale maatschappelijke risico.
    url: https://wetten.overheid.nl/BWBR0032739/2024-01-01#Artikel8
  - number: '11'
    text: |-
      Onze Minister is bevoegd degene die op het moment van inwerkingtreding van deze wet nertsen als pelsdier houdt en
      op 1 januari 2014 55 jaar of ouder is, tegemoetkoming te verlenen bij onbillijkheden van overwegende aard die zich
      als gevolg van het verbod, bedoeld in [artikel 2][ref1], ten aanzien van zijn pensioenvoorziening voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0032739#Artikel2
