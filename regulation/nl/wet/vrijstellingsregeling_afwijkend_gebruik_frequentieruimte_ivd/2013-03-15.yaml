preamble:
  text: |-
    Gelet op artikel 3.10, derde lid, j°. 3.10, tweede lid, van de Telecommunicatiewet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018355/2013-03-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: de Minister van Economische Zaken;

      b. wet: [Telecommunicatiewet][ref1];

      c. een afwijkend gebruik van de frequentieruimte: een afwijkend gebruik van de frequentieruimte dat bestaat uit
      scannen of jammen, ter uitvoering van de taken, bedoeld in [artikel 3.22, derde lid, onder c, van de wet][ref2];

      d. scannen: het met daartoe geschikte apparatuur automatisch en herhaald systematisch aftasten van een bepaalde
      frequentieband teneinde informatie te vergaren met betrekking tot een bepaald nummer of bepaalde nummers in een
      bepaald gebied;

      e. jammen: het met daartoe geschikte apparatuur tijdelijk verstoren of onmogelijk maken van een normaal gebruik van
      een geselecteerd nummer of alle nummers over een bepaalde frequentieband in een bepaald gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3.22
    url: https://wetten.overheid.nl/BWBR0018355/2013-03-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3.22'
  - number: '2'
    text: |-
      Voor een afwijkend gebruik van de frequentieruimte is geen ontheffing als bedoeld in
      [artikel 3.22, derde lid, van de wet][ref1] vereist voor zover de desbetreffende frequentieruimte ingevolge
      het frequentieplan als bedoeld in [artikel 3.1, eerste lid, van de wet][ref2] is bestemd voor openbare mobiele
      telecommunicatiediensten en wordt voldaan aan de [artikelen 3 tot en met 9][ref3] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3.22
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3.1
      [ref3]: https://wetten.overheid.nl/BWBR0018355#Artikel3
    url: https://wetten.overheid.nl/BWBR0018355/2013-03-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3.22'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3.1'
      - id: ref3
        bwb_id: BWBR0018355
        artikel: '3'
  - number: '3'
    text: |-
      1 Aan een afwijkend gebruik van de frequentieruimte ligt een besluit van of namens de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties onderscheidenlijk de Minister van Defensie ten grondslag.

      2 Het besluit, bedoeld in het eerste lid, omvat ten minste de volgende gegevens:

      a. datum en tijdstip waarop het besluit is genomen;

      b. de periode waarbinnen afwijkend gebruik van de frequentieruimte mag plaatsvinden;

      c. de persoon of instantie aan wie de bevoegdheid tot afwijkend gebruik van de frequentieruimte wordt verleend;

      d. welke vorm van afwijkend gebruik van de frequentieruimte er plaats mag vinden en ingeval van jammen, op welke
      wijze dit zal plaats vinden;

      e. een zo nauwkeurig mogelijke aanduiding van de geografische locaties waar de apparatuur met behulp waarvan
      afwijkend gebruik van de frequentieruimte kan plaatsvinden, mag worden ingezet.
    url: https://wetten.overheid.nl/BWBR0018355/2013-03-15#Artikel3
  - number: '4'
    text: |-
      1 Het besluit tot een afwijkend gebruik dat uit jammen bestaat, wordt door of namens de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties onderscheidenlijk de Minister van Defensie schriftelijk aan de Minister gemeld binnen
      ten hoogste 24 uur nadat het is genomen.

      2 Het besluit tot een afwijkend gebruik dat uit jammen bestaat, wordt voorafgaand aan de tenuitvoerlegging in ieder
      geval mondeling gemeld.

      3 Bij de melding worden de gegevens, bedoeld in [artikel 3, tweede lid, onderdelen a, b en d][ref1], en voor zover
      mogelijk, tevens de te hanteren vermogens van de te gebruiken apparatuur verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0018355#Artikel3
    url: https://wetten.overheid.nl/BWBR0018355/2013-03-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018355
        artikel: '3'
  - number: '5'
    text: |-
      1 De periode als bedoeld in [artikel 3, tweede lid, onder b][ref1], bedraagt:

      a. in geval van scannen ten hoogste drie maanden;

      b. in geval van jammen ten hoogste 24 uur.

      2 Het afwijkend gebruik van de frequentieruimte geschiedt niet langer dan strikt noodzakelijk is voor het beoogde
      operationele doel. Het daarbij gebruikte vermogen is niet groter dan strikt noodzakelijk is voor het beoogde
      operationele doel.


      [ref1]: https://wetten.overheid.nl/BWBR0018355#Artikel3
    url: https://wetten.overheid.nl/BWBR0018355/2013-03-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018355
        artikel: '3'
  - number: '6'
    text: |-
      1 De apparatuur die wordt gebruikt voor het afwijkend gebruik van de frequentieruimte is voorzien van een
      inrichting waarmee het uitgezonden vermogen kan worden geregeld.

      2 De apparatuur die wordt gebruikt voor scannen is voorzien van een inrichting, waarmee de nummergegevens zodanig
      worden geselecteerd dat het selectieproces niet meer dan een plaatselijke, zeer geringe verandering van de
      functionaliteiten van het desbetreffende netwerk kan veroorzaken.
    url: https://wetten.overheid.nl/BWBR0018355/2013-03-15#Artikel6
  - number: '7'
    text: |-
      Met de in [artikel 6][ref1] bedoelde apparatuur wordt gelijkgesteld apparatuur die rechtmatig is vervaardigd of
      in de handel is gebracht in een andere lidstaat van de Europese Unie dan wel rechtmatig is vervaardigd in een
      staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe
      strekkend Verdrag dat Nederland bindt, en die voldoet aan eisen die een beschermingsniveau bieden dat ten minste
      gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0018355#Artikel6
    url: https://wetten.overheid.nl/BWBR0018355/2013-03-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018355
        artikel: '6'
  - number: '8'
    text: |-
      Bevoegd tot het bedienen van de apparatuur waarmee een afwijkend gebruik van de frequentieruimte kan worden gemaakt
      zijn de door het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst onderscheidenlijk de directeur van de
      Militaire Inlichtingen- en Veiligheidsdienst aangewezen ambtenaren, die blijk hebben gegeven te beschikken over
      voldoende kennis betreffende de juridische, technische en operationele aspecten van het gebruik van de apparatuur.
    url: https://wetten.overheid.nl/BWBR0018355/2013-03-15#Artikel8
  - number: '9'
    text: |-
      1 De in [artikel 8][ref1] bedoelde ambtenaar maakt na een afwijkend gebruik van de frequentieruimte een verslag op.
      Het verslag vermeldt:

      a. de gegevens, bedoeld in [artikel 3, tweede lid, onder a tot en met c][ref2];

      b. de vorm van afwijkend gebruik van de frequentieruimte die heeft plaatsgevonden en in geval van jammen, op welke
      wijze dit heeft plaatsgevonden;

      c. de tijdens het gebruik van de apparatuur gehanteerde instellingen en vermogens;

      d. de data, de tijdstippen waarop en de locaties waar de apparatuur is gebruikt;

      e. de gegevens die door het gebruik van de apparatuur zijn verkregen.

      2 De gegevens, bedoeld in het eerste lid, onder b tot en met d, worden op een daartoe strekkend verzoek verstrekt
      aan de Minister, indien dit noodzakelijk is in verband met de uitoefening van toezicht achteraf op de naleving van
      hetgeen bij of krachtens [hoofdstuk 3 van de wet][ref3] is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018355#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018355#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0018355/2013-03-15#Artikel9
    references:
