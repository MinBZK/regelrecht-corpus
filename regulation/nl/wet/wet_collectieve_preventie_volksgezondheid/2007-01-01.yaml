preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is wettelijke regels te stellen betreffende de bemoeienis
    van gemeentebesturen met collectieve preventie op het gebied van de volksgezondheid alsmede een wettelijke basis te
    bieden voor specifieke uitkeringen ter zake;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004760/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. collectieve preventie: bescherming en bevordering van de gezondheid van de bevolking of van specifieke groepen
      daaruit alsmede het voorkómen en het vroegtijdig opsporen van ziekten onder die bevolking;

      c. epidemie van infectieziekten: een in korte tijd sterke toename van het aantal nieuwe patiënten lijdend aan een
      bij of krachtens [artikel 2][ref1] of [3 van de Infectieziektenwet][ref2] aangewezen ziekte;

      d. jeugdgezondheidszorg: preventieve gezondheidszorg ten behoeve van personen in de leeftijd van nul tot negentien
      jaar, bestaande uit de in [artikel 3a, tweede lid][ref3], bedoelde taken.

      2 Bij algemene maatregel van bestuur kan voor één of meer van de bij die maatregel aangewezen taken met betrekking
      tot de jeugdgezondheidszorg een van het eerste lid, onderdeel d, afwijkende leeftijdsgrens worden vastgesteld, met
      dien verstande dat de maximumleeftijd ten hoogste op negentien jaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004760#Artikel3a
    url: https://wetten.overheid.nl/BWBR0004760/2007-01-01#Artikel1
