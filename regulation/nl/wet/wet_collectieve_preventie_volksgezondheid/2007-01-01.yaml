        artikel: 5:18
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:19
  - number: '8'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen met het oog op het bepaalde in [artikel 2, tweede lid, onder ][ref1],
      regels worden gesteld met betrekking tot het verstrekken van gegevens aan burgemeester en wethouders door personen
      en instellingen werkzaam op het terrein van de volksgezondheid. In de maatregel kan het stellen van nadere regels
      ten aanzien van daarbij aangewezen onderwerpen aan Onze Minister worden opgedragen.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het verstrekken van
      systematische informatie door gemeenten aan Onze Minister inzake de uitvoering van de wet.

      3 De in dit artikel bedoelde algemene maatregelen van bestuur bevatten ten minste regels met betrekking tot de
      bescherming van de persoonlijke levenssfeer en de vergoeding van kosten, en kunnen de in het eerste en tweede lid
      bedoelde gegevensverstrekking verplicht stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004760#Artikel2
    url: https://wetten.overheid.nl/BWBR0004760/2007-01-01#Artikel8
