  - number: '4'
    text: |-
      1 Indien de gemeenteraad een bijdrage heft voor het verrichten van werkzaamheden in het kader van collectieve
      preventie draagt hij er zorg voor dat dit niet ten koste gaat van het bereik van deze werkzaamheden.

      2 Geen bijdrage wordt geheven voor de bij of krachtens de [artikelen 3][ref1] en [3a][ref2] opgedragen taken,
      behoudens in gevallen bij algemene maatregel van bestuur genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0004760#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004760#Artikel3a
    url: https://wetten.overheid.nl/BWBR0004760/2007-01-01#Artikel4
