  - number: '6'
    text: |-
      1 Burgemeester en wethouders dragen er zorg voor dat de gemeentelijke gezondheidsdienst in ieder geval beschikt
      over deskundigen op de volgende terreinen:

      a. geneeskunde;

      b. epidemiologie;

      c. verpleegkunde;

      d. gezondheidsvoorlichting en -opvoeding;

      e. tandzorg;

      f. gedragswetenschappen;

      g. informatica.

      2 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de door de in het eerste lid genoemde
      deskundigen gevolgde opleidingen of verlangde deskundigheidseisen; de gestelde regels kunnen verschillen naar
      gelang de taken van de gemeentelijke gezondheidsdienst waarvoor de deskundigen worden ingezet.
    url: https://wetten.overheid.nl/BWBR0004760/2007-01-01#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister bevordert de kwaliteit en de doelmatigheid van de collectieve preventie.

      2 Hij stelt voor het eerst in 2002 en vervolgens elke vier jaar bij nota landelijke prioriteiten vast op het gebied
      van de collectieve preventie.

      3 Hij stelt in ieder geval eenmaal per vier jaar een landelijk programma vast voor uitvoering van onderzoek op het
      terrein van collectieve preventie.

      4 Hij draagt zorg voor de instandhouding en verbetering van de landelijke ondersteuningsstructuur.

      5 Hij bevordert de interdepartementale en internationale samenwerking op het gebied van de collectieve preventie.
    url: https://wetten.overheid.nl/BWBR0004760/2007-01-01#Artikel7
  - number: 7a
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van het
      Staatstoezicht op de volksgezondheid.

      2 De in het eerste lid bedoelde ambtenaren beschikken niet over de bevoegdheden, genoemd in de artikelen
      [5:18][ref1] en [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel519
    url: https://wetten.overheid.nl/BWBR0004760/2007-01-01#Artikel7a
    references:
      - id: ref1
