        paragraaf: '2'
  - number: '2'
    text: |-
      1 Burgemeester en wethouders bevorderen de totstandkoming en de continuïteit van en de samenhang binnen collectieve
      preventie alsmede de onderlinge afstemming tussen deze collectieve preventie en de curatieve gezondheidszorg.

      2 Ter verwezenlijking van het bepaalde in het eerste lid dragen burgemeester en wethouders in ieder geval zorg
      voor:

      a. het verwerven van, op epidemiologische analyse gebaseerd, inzicht in de gezondheidssituatie van de bevolking;
      deze taak omvat in ieder geval het eenmaal per vier jaar, voorafgaand aan de opstelling van de nota gemeentelijk
      gezondheidsbeleid, bedoeld in [artikel 3b][ref1], op landelijk gelijkvormige wijze verzamelen en analyseren van
      gegevens omtrent deze gezondheidssituatie. Bij algemene maatregel van bestuur kunnen hieraan nadere regels worden
      gesteld.

      b. het bewaken van gezondheidsaspecten in bestuurlijke beslissingen;

      c. het bijdragen aan opzet, uitvoering en afstemming van preventieprogramma's, met inbegrip van
      gezondheidsvoorlichting en -opvoeding;

      d. het bevorderen van medisch-milieukundige zorg, waaronder in ieder geval wordt verstaan het signaleren van
      ongewenste situaties, het adviseren over risico's, in het bijzonder bij rampen of dreiging van rampen, het
      beantwoorden van vragen uit de bevolking, het geven van voorlichting en het doen van onderzoek;

      e. het bevorderen van technische hygiënezorg, waaronder in ieder geval wordt verstaan het bijhouden van een lijst
      met instellingen waar, gezien de aard van de doelgroep en de omstandigheden waaronder de activiteiten worden
      verricht, een verhoogd risico bestaat op verspreiding van pathogene micro-organismen, het adviseren van deze
      instellingen over mogelijkheden op het gebied van bouw, inrichting en organisatie van de activiteiten om deze
      risico's te verkleinen, het signaleren van ongewenste situaties, het beantwoorden van vragen uit de bevolking en
      het geven van voorlichting;

      f. het bieden van psychosociale hulp bij rampen.

      3 Bij algemene maatregel van bestuur kunnen de in het tweede lid, onder a en onder c tot en met f, vermelde
      werkzaamheden nader worden uitgewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004760#Artikel3b
    url: https://wetten.overheid.nl/BWBR0004760/2007-01-01#Artikel2
    references:
