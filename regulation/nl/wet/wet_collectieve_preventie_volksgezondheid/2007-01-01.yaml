  - number: '5'
    text: |-
      1 Ter uitvoering van bij of krachtens deze wet opgedragen taken dragen burgemeester en wethouders zorg voor de
      instelling en instandhouding van gemeentelijke gezondheidsdiensten.

      2 Alvorens besluiten te nemen die belangrijke gevolgen kunnen hebben voor de collectieve preventie vragen
      burgemeester en wethouders advies aan de gemeentelijke gezondheidsdienst.
    url: https://wetten.overheid.nl/BWBR0004760/2007-01-01#Artikel5
  - number: 5a
    text: |-
      Met inachtneming van bij algemene maatregel van bestuur te stellen regels, staat het
      burgemeester en wethouders vrij om de taken of onderdelen van taken, als bedoeld in artikel
      [3a, tweede lid, onder a tot en met d][ref1], te laten uitvoeren door instellingen die zorg verlenen als bedoeld in
      [artikel 16 van het Besluit zorgaanspraken AWBZ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004760#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel16
    url: https://wetten.overheid.nl/BWBR0004760/2007-01-01#Artikel5a
    references:
