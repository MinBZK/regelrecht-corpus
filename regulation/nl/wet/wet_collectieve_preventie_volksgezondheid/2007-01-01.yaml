        bwb_id: BWBR0004760
        artikel: 3b
        paragraaf: '2'
  - number: '3'
    text: |-
      1 Burgemeester en wethouders dragen zorg voor de uitvoering van de infectieziektebestrijding, waaronder in ieder
      geval wordt verstaan algemene infectieziektebestrijding, bestrijding van seksueel overdraagbare aandoeningen,
      waaronder aids, tuberculosebestrijding, bron- en contactopsporing bij vermoeden op epidemieën van infectieziekten,
      het beantwoorden van vragen uit de bevolking en het geven van voorlichting en begeleiding, voorzover dit bij
      algemene maatregel van bestuur is bepaald.

      2 Onze Minister kan ter zake van de bestrijding van een epidemie van infectieziekten een aanwijzing geven aan
      burgemeester en wethouders, indien zij niet of niet naar behoren maatregelen treffen ter bestrijding van de
      epidemie, terwijl er ernstig gevaar voor de volksgezondheid dreigt en een bovenregionale verspreiding van de
      desbetreffende infectieziekte te verwachten is.

      3 Onze Minister pleegt over een voornemen tot het geven van een aanwijzing overleg met burgemeester en wethouders.
      Hij deelt het nemen van de aanwijzing, onder vermelding van de redenen daarvoor, mee aan de beide kamers van de
      Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0004760/2007-01-01#Artikel3
  - number: 3a
    text: |-
      1 Burgemeester en wethouders dragen eveneens zorg voor de uitvoering van de jeugdgezondheidszorg.

      2 Ter verwezenlijking van het eerste lid dragen burgemeester en wethouders in ieder geval zorg voor:

        - het op systematische wijze volgen en signaleren van ontwikkelingen in de gezondheidstoestand van jeugdigen en van
      gezondheidsbevorderende en -bedreigende factoren;
        - het ramen van de behoeften aan zorg;
        - de vroegtijdige opsporing en preventie van specifieke stoornissen, met uitzondering van de perinatale screening
      op phenylketonurie (PKU), congenitale hypothyroïdie (CHT) en adrenogenitaal syndroom (AGS) en het aanbieden van
      vaccinaties voortkomend uit het Rijksvaccinatieprogramma;
        - het geven van voorlichting, advies, instructie en begeleiding;
        - het formuleren van maatregelen ter beïnvloeding van gezondheidsbedreigingen.

      3 Bij algemene maatregel van bestuur kunnen de in het tweede lid genoemde taken nader worden uitgewerkt.
    url: https://wetten.overheid.nl/BWBR0004760/2007-01-01#Artikel3a
  - number: 3b
    text: |-
      De gemeenteraad stelt vóór 1 juli 2003 en vervolgens elke vier jaar een nota gemeentelijk gezondheidsbeleid vast,
      waarin hij tenminste aangeeft hoe burgemeester en wethouders uitvoering geven aan de in de [artikelen 2][ref1],
      [3, eerste lid][ref2], en [3a][ref3] genoemde taken en de in [artikel 5, tweede lid][ref4], genoemde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0004760#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004760#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004760#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0004760#Artikel5
    url: https://wetten.overheid.nl/BWBR0004760/2007-01-01#Artikel3b
