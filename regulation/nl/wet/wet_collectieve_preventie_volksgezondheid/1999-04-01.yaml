---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_collectieve_preventie_volksgezondheid
regulatory_layer: WET
publication_date: '2008-11-18'
valid_from: '1999-04-01'
bwb_id: BWBR0004760
url: https://wetten.overheid.nl/BWBR0004760/1999-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is wettelijke regels te stellen betreffende de bemoeienis
    van gemeentebesturen met collectieve preventie op het gebied van de volksgezondheid alsmede een wettelijke basis te
    bieden voor specifieke uitkeringen ter zake;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel1
  - number: 1.b
    text: |-
      collectieve preventie: bewaking en bevordering van de volksgezondheid voor zover deze samenhangt met risico’s met
      een collectief karakter;
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel1
  - number: 1.c
    text: |-
      epidemie van infectieziekten: een in korte tijd sterke toename van het aantal nieuwe patiënten lijdend aan een bij
      of krachtens [artikel 2][ref1] of[ 3 van de Infectieziektenwet][ref2] aangewezen ziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0009684#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009684#Artikel3
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009684
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009684
        artikel: '3'
  - number: '2.1'
    text: |-
      De gemeenteraad bevordert de totstandkoming en de continuïteit van en de samenhang binnen collectieve preventie
      alsmede de onderlinge afstemming tussen deze collectieve preventie en de curatieve gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel2
  - number: '2.2'
    text: 'Ter verwezenlijking van het bepaalde in het eerste lid draagt de gemeenteraad in ieder geval zorg voor:'
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel2
  - number: 2.2.a
    text: het verwerven van, op epidemiologische analyse gebaseerd, inzicht in de gezondheidssituatie van de bevolking;
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel2
  - number: 2.2.b
    text: het bewaken van gezondheidsaspecten in bestuurlijke beslissingen met gevolgen voor het leefmilieu;
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel2
  - number: 2.2.c
    text: het bevorderen van de hygiëne en de psycho-hygiëne;
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel2
  - number: 2.2.d
    text: |-
      het bijdragen aan opzet, uitvoering en afstemming van preventieprogramma's, met inbegrip van
      gezondheidsvoorlichting en -opvoeding.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel2
  - number: '2.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen de in het tweede lid, onder *d*, vermelde werkzaamheden nader worden
      uitgewerkt.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel2
  - number: '3.1'
    text: |-
      De gemeenteraad draagt zorg voor de uitvoering van de collectieve preventie betreffende infectieziekten en terzake
      van gezondheidsrisico’s voor jeugdigen, voorzover dit bij algemene maatregel van bestuur is bepaald.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister kan ter zake van de bestrijding van een epidemie van infectieziekten een aanwijzing geven aan de
      gemeenteraad, indien deze niet of niet naar behoren maatregelen treft ter bestrijding van de epidemie, terwijl
      er ernstig gevaar voor de volksgezondheid dreigt en een bovenregionale verspreiding van de desbetreffende
      infectieziekte te verwachten is.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister pleegt over een voornemen tot het geven van een aanwijzing overleg met de gemeenteraad. Hij deelt het
      nemen van de aanwijzing, onder vermelding van de redenen daarvoor, mee aan de beide kamers van de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel3
  - number: '4.1'
    text: |-
      Indien de gemeenteraad een bijdrage heft voor het verrichten van werkzaamheden in het kader van collectieve
      preventie draagt hij er zorg voor dat dit niet ten koste gaat van het bereik van deze werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel4
  - number: '4.2'
    text: |-
      Geen bijdrage wordt geheven voor de bij of krachtens [artikel 3][ref1] opgedragen taken, behoudens in gevallen bij
      algemene maatregel van bestuur genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0004760#Artikel3
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004760
        artikel: '3'
        paragraaf: '2'
  - number: '5.1'
    text: |-
      Ter uitvoering van bij of krachtens deze wet opgedragen taken dragen de gemeenteraden zorg voor de instelling en
      instandhouding van gemeentelijke gezondheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel5
  - number: '5.2'
    text: |-
      Alvorens besluiten te nemen die belangrijke gevolgen kunnen hebben voor de collectieve preventie vraagt de
      gemeenteraad onderscheidenlijk burgemeester en wethouders advies aan de gemeentelijke gezondheidsdienst.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel5
  - number: '6.1'
    text: |-
      De gemeenteraad draagt er zorg voor dat de gemeentelijke gezondheidsdienst in ieder geval beschikt over deskundigen
      op de volgende terreinen:
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel6
  - number: 6.1.a
    text: geneeskunde;
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel6
  - number: 6.1.b
    text: epidemiologie;
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel6
  - number: 6.1.c
    text: verpleegkunde;
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel6
  - number: 6.1.d
    text: gezondheidsvoorlichting en -opvoeding;
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel6
  - number: 6.1.e
    text: tandzorg;
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel6
  - number: 6.1.f
    text: gedragswetenschappen;
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel6
  - number: 6.1.g
    text: informatica.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel6
  - number: '6.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de door de in het eerste lid genoemde
      deskundigen gevolgde opleidingen of verlangde deskundigheidseisen; de gestelde regels kunnen verschillen naar
      gelang de taken van de gemeentelijke gezondheidsdienst waarvoor de deskundigen worden ingezet.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel6
  - number: 6a.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van het
      Staatstoezicht op de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel6a
  - number: 6a.2
    text: |-
      De in het eerste lid bedoelde ambtenaren beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1]
      en [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '8.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op het bepaalde in [artikel 2, tweede lid, onder ][ref1],
      regels worden gesteld met betrekking tot het verstrekken van gegevens aan gemeenten door personen en instellingen
      werkzaam op het terrein van de volksgezondheid. In de maatregel kan het stellen van nadere regels ten aanzien van
      daarbij aangewezen onderwerpen aan Onze Minister worden opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0004760#Artikel2
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004760
        artikel: '2'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het verstrekken van
      systematische informatie door gemeenten aan Onze Minister inzake de uitvoering van de wet.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel8
  - number: '8.3'
    text: |-
      De in dit artikel bedoelde algemene maatregelen van bestuur bevatten ten minste regels met betrekking tot de
      bescherming van de persoonlijke levenssfeer en de vergoeding van kosten, en kunnen de in het eerste en tweede lid
      bedoelde gegevensverstrekking verplicht stellen.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel8
  - number: '10'
    text: |-
      Tot het tijdstip waarop een algemene maatregel van bestuur als bedoeld in [artikel 7][ref1] in werking treedt
      doch uiterlijk tot 1 januari 1991 blijven ten aanzien van de uitkeringen terzake van de epidemiologie, de medische
      milieukunde, de acquired immune deficiency syndrome (Aids-)bestrijding, de sportgezondheidszorg, de preventie
      van hart- en vaatziekten, het gezonde stedenproject, de Perspectieven Nota Limburg en het Integraal Structuurplan
      noorden des lands voor zover betrekking hebbend op collectieve preventie, de regels van toepassing die ter zake
      van toepassing waren op de dag voor de inwerkingtreding van deze wet. Wijziging van die regels bij ministeriële
      regeling is mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0004760#Artikel7
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004760
        artikel: '7'
        paragraaf: '3'
  - number: '11'
    text: |-
      Voorzover in 1989 de TBC-bestrijding geschiedde door, vanwege het Rijk gesubsidieerde, privaatrechtelijke
      rechtspersonen en in 1990 deze taak niet in overeenstemming met deze rechtspersonen is overgenomen door de
      gemeenten, wordt de subsidiëring van die rechtspersonen ten behoeve van deze taak vanaf 1 januari 1990 door de
      betrokken gemeenten in ieder geval voortgezet tot en met 31 december 1990, dan wel indien dit tijdstip eerder valt,
      tot aan het moment waarop deze taak op eerdergenoemde wijze door de gemeente is overgenomen.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel11
  - number: '12'
    text: |-
      Het Besluit proefgemeenten (*Stb.* 1982, 497) is met ingang van 1 januari 1989 niet meer van toepassing op
      activiteiten op het terrein van jeugdgezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel12
  - number: '14'
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 1989. Indien het *Staatsblad* waarin zij wordt
      geplaatst wordt uitgegeven na 31 december 1988, treedt zij in werking met ingang van de dag na de datum van
      uitgifte van het *Staatsblad* waarin zij wordt geplaatst en werkt zij met uitzondering van het bepaalde in
      [artikel 5, eerste lid][ref1], terug tot en met 1 januari 1989.


      [ref1]: https://wetten.overheid.nl/BWBR0004760#Artikel5
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004760
        artikel: '5'
        paragraaf: '2'
  - number: '15'
    text: Deze wet kan worden aangehaald als 'Wet collectieve preventie volksgezondheid'.
    url: https://wetten.overheid.nl/BWBR0004760/1999-04-01#Artikel15
