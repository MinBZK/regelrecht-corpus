---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: experimentenwet_stad_en_milieu
regulatory_layer: WET
publication_date: '2006-01-31'
valid_from: '2005-07-01'
bwb_id: BWBR0010041
url: https://wetten.overheid.nl/BWBR0010041/2005-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is experimenten in het belang van een zuinig en doelmatig
    ruimtegebruik en het bereiken van een optimale leefkwaliteit in het stedelijk gebied mogelijk te maken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: Onze Minister: Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer; experimenteergebied: een gebied als bedoeld
      in [artikel 2][ref1]; milieukwaliteitseis: bij of krachtens de wet vastgestelde eis ten aanzien van
      de kwaliteit van een onderdeel van het milieu; inspecteur: als zodanig bij besluit van Onze Minister
      aangewezen ambtenaar; bevoegd gezag: bestuursorgaan dat bevoegd is tot het geven van een beschikking of
      het nemen van een ander besluit; toezichthoudend bestuursorgaan: bestuursorgaan dat toezicht als bedoeld in
      [titel 10.2 van de Algemene wet bestuursrecht][ref2], uitoefent op een ander bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0010041#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010041
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '2.1'
    text: Deze wet is van toepassing op de gebieden, vermeld in de bij deze wet behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel2
  - number: '2.2'
    text: Onze Minister kan bij ministeriële regeling andere gebieden aanwijzen waarop deze wet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel2
  - number: '2.3'
    text: |-
      Een krachtens het tweede lid vast te stellen ministeriële regeling treedt niet eerder in werking dan 8 weken na
      de datum van uitgifte van de Staatscourant waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling
      gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel2
  - number: '3.1'
    text: |-
      De gemeenteraad kan ten aanzien van een experimenteergebied binnen vijf jaar na inwerkingtreding van deze wet
      in het belang van een zuinig en doelmatig ruimtegebruik en het bereiken van een optimale leefkwaliteit in het
      stedelijke gebied een besluit nemen tot afwijking van:
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel3
  - number: 3.1.a
    text: milieukwaliteitseisen met betrekking tot bodem, geluid, lucht en externe veiligheid;
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel3
  - number: 3.1.b
    text: |-
      procedurele bepalingen en bepalingen inzake bevoegdheden, gesteld bij of krachtens de [Wet geluidhinder][ref1],
      de [Wet milieubeheer][ref2], de [Wet bodembescherming][ref3], de [Wet op de Ruimtelijke Ordening][ref4], de
      [Woningwet][ref5] en de [Wet op de stads- en dorpsvernieuwing][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0003994
      [ref4]: https://wetten.overheid.nl/BWBR0002375
      [ref5]: https://wetten.overheid.nl/BWBR0005181
      [ref6]: https://wetten.overheid.nl/BWBR0003709
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003227
      - id: ref2
        bwb_id: BWBR0003245
      - id: ref3
        bwb_id: BWBR0003994
      - id: ref4
        bwb_id: BWBR0002375
      - id: ref5
        bwb_id: BWBR0005181
      - id: ref6
        bwb_id: BWBR0003709
  - number: '3.2'
    text: |-
      De in het eerste lid, onder a, bedoelde bevoegdheid geldt niet met betrekking tot milieukwaliteitseisen, gesteld
      bij of krachtens de [Luchtvaartwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: '3.3'
    text: |-
      De in het eerste lid bedoelde bevoegdheid geldt niet, voor zover door de afwijking strijd zou ontstaan met EG-
      richtlijnen.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel3
  - number: '4'
    text: |-
      De gemeenteraad maakt van de bevoegdheid bedoeld in [artikel 3, eerste lid][ref1], niet eerder gebruik dan nadat
      hij tot het oordeel is gekomen dat daarmee, vergeleken met de situatie waarbij de binnen de geldende regelgeving
      bestaande mogelijkheden optimaal worden benut, de belangen genoemd in de aanhef van [artikel 3, eerste lid][ref2],
      aanzienlijk beter gediend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010041#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010041#Artikel3
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010041
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010041
        artikel: '3'
  - number: '5.1'
    text: |-
      Op de voorbereiding van een besluit krachtens [artikel 3, eerste lid][ref1], is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing. Het ontwerp van het besluit wordt tevens
      toegezonden aan de inspecteur en de daarbij een belang hebbende andere bestuursorganen. Van het ontwerp wordt
      mededeling gedaan door kennisgeving in de Staatscourant. Zienswijzen kunnen naar voren worden gebracht door een
      ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0010041#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010041
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '5.2'
    text: |-
      De gemeenteraad stelt de inspecteur en gedeputeerde staten in de gelegenheid advies uit te brengen over het ontwerp
      van het besluit.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel5
  - number: '5.3'
    text: |-
      De gemeenteraad stelt het terzake van de bepaling waarvan afwijking wordt overwogen bevoegde gezag in de
      gelegenheid advies uit te brengen over het ontwerp van het besluit. Het bevoegd gezag betrekt bij de voorbereiding
      van zijn advies de bestuursorganen die ingevolge enig wettelijk voorschrift zijn aangewezen om hem terzake van
      advies te dienen.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel5
  - number: '5.4'
    text: |-
      Het derde lid vindt geen toepassing voor zover een orgaan van de gemeente als bevoegd gezag of adviseur is
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel5
  - number: '5.5'
    text: |-
      Het besluit wordt zo spoedig mogelijk, doch uiterlijk zes maanden na de terinzagelegging van het ontwerp, genomen.
      De gemeenteraad kan deze termijn verlengen met een door hem te bepalen redelijke termijn. De motivering omvat
      de reden voor de verlenging. Van een besluit tot verlenging wordt, tegelijkertijd met de bekendmaking ervan,
      mededeling gedaan aan de inspecteur, de betrokken andere bestuursorganen en degenen die zienswijzen naar voren
      hebben gebracht over het ontwerp van het besluit.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel5
  - number: '6'
    text: |-
      Indien de gemeenteraad besluit tot afwijking van milieukwaliteitseisen, worden de daaruit voortvloeiende nadelige
      gevolgen zoveel mogelijk beperkt. Voor zover dit niet mogelijk is, worden de nadelige gevolgen gecompenseerd op
      een zodanige wijze dat daarmee de belangen genoemd in de aanhef van [artikel 3, eerste lid][ref1], gediend zijn.
      Compensatie geschiedt zoveel mogelijk binnen het betreffende onderdeel van de milieukwaliteit. De compensatie heeft
      zoveel mogelijk plaats binnen het experimenteergebied.


      [ref1]: https://wetten.overheid.nl/BWBR0010041#Artikel3
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010041
        artikel: '3'
  - number: '7'
    text: |-
      In een besluit krachtens [artikel 3, eerste lid][ref1], worden aangegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0010041#Artikel3
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010041
        artikel: '3'
  - number: 7.a
    text: het experimenteergebied waarop het besluit betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel7
  - number: 7.b
    text: de bepalingen ten aanzien waarvan tot afwijking is besloten;
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel7
  - number: 7.c
    text: |-
      de eisen met betrekking tot de kwaliteit van het milieu, die gelden ter vervanging van de milieukwaliteitseisen
      waarvan wordt afgeweken;
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel7
  - number: 7.d
    text: de procedures die worden gevolgd ter vervanging van die waarvan wordt afgeweken;
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel7
  - number: 7.e
    text: de wijze waarop wordt voorzien in de bevoegdheden waarvan wordt afgeweken;
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel7
  - number: 7.f
    text: |-
      de gevolgen die de uitvoering van het besluit met zich brengt voor de onderscheidene onderdelen en objecten binnen
      het experimenteergebied;
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel7
  - number: 7.g
    text: de wijze waarop de nadelige gevolgen van afwijking van milieukwaliteitseisen worden beperkt en gecompenseerd;
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel7
  - number: 7.h
    text: de termijnen waarvoor de afwijkingen gelden.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel7
  - number: '8'
    text: 'De motivering van het besluit bevat in ieder geval een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel8
  - number: 8.a
    text: |-
      de visie van de gemeente op de gewenste leefkwaliteit van het experimenteergebied, mede in relatie tot het
      ruimtegebruik en de leefkwaliteit in het stedelijk gebied waarbinnen het experimenteergebied is gelegen;
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel8
  - number: 8.b
    text: |-
      de wijze waarop getracht is binnen de geldende regelgeving het gewenste ruimtegebruik en de gewenste leefkwaliteit
      te realiseren;
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel8
  - number: 8.c
    text: |-
      de van de geldende milieukwaliteitseisen, procedurele bepalingen of bepalingen inzake bevoegdheden ondervonden
      beperkingen alsmede een uiteenzetting over de meerwaarde die de afwijking daarvan met zich brengt met het oog op
      het bereiken van het gewenste ruimtegebruik en de gewenste leefkwaliteit;
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel8
  - number: 8.d
    text: |-
      de effecten van het besluit op de volksgezondheid en het milieu en de overwegingen met betrekking tot het beperken
      en compenseren van de nadelige gevolgen van afwijking van milieukwaliteitseisen;
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel8
  - number: 8.e
    text: de wijze waarop onderzoek zal worden gedaan naar de gevolgen van de uitvoering van het besluit;
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel8
  - number: 8.f
    text: |-
      de wijze waarop bij de voorbereiding van het besluit ingezetenen, betrokken bestuursorganen en andere
      belanghebbenden zijn betrokken;
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel8
  - number: 8.g
    text: |-
      de naar voren gebrachte zienswijzen en uitgebrachte adviezen en de overwegingen van de gemeenteraad omtrent de naar
      voren gebrachte zienswijzen en uitgebrachte adviezen;
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel8
  - number: 8.h
    text: |-
      de overwegingen die hebben geleid tot de in het besluit aangegeven termijnen waarvoor de afwijkingen gelden,
      alsmede de maatregelen die zullen worden getroffen teneinde die termijnen niet te overschrijden.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel8
  - number: '9.1'
    text: |-
      Een krachtens [artikel 3, eerste lid][ref1], vastgesteld besluit behoeft de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0010041#Artikel3
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010041
        artikel: '3'
  - number: '9.2'
    text: |-
      De goedkeuring kan worden onthouden indien de aard van de naar voren gebrachte zienswijzen en uitgebrachte adviezen
      daartoe naar het oordeel van Onze Minister aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel9
  - number: '10'
    text: |-
      Het niet tijdig bekendmaken van een besluit omtrent goedkeuring of een besluit tot verdaging van de beslissing
      omtrent goedkeuring heeft niet tot gevolg dat een besluit tot goedkeuring geacht wordt te zijn genomen.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel10
  - number: '11.1'
    text: |-
      Burgemeester en wethouders maken een krachtens [artikel 3, eerste lid][ref1], genomen besluit bekend, zodra het
      is goedgekeurd. Tegelijkertijd met de bekendmaking wordt van het besluit mededeling gedaan door kennisgeving in de
      Staatscourant. Bij de bekendmaking en de mededeling wordt door burgemeester en wethouders tevens mededeling gedaan
      van het goedkeuringsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0010041#Artikel3
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010041
        artikel: '3'
  - number: '11.2'
    text: |-
      Van de onthouding van goedkeuring wordt door burgemeester en wethouders zo spoedig mogelijk mededeling gedaan door
      kennisgeving in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel11
  - number: '12.1'
    text: |-
      Tegen een besluit krachtens [artikel 3, eerste lid][ref1], kan een belanghebbende, in afwijking van
      [artikel 8:2 van de Algemene wet bestuursrecht][ref2], beroep instellen bij de Afdeling bestuursrechtspraak van de
      Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0010041#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010041
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '12.2'
    text: |-
      Voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] worden de
      goedkeuring en het besluit krachtens [artikel 3, eerste lid][ref2], als één besluit aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0010041#Artikel3
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0010041
        artikel: '3'
  - number: '12.3'
    text: |-
      Tegen een besluit tot onthouding van goedkeuring kan uitsluitend de gemeenteraad beroep instellen bij de Afdeling
      bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel12
  - number: '12.4'
    text: |-
      Beroep tegen besluiten ter uitvoering van een besluit als bedoeld in [artikel 3, eerste lid][ref1], is slechts
      mogelijk, voor zover het beroep niet is gericht tegen de inhoud van het laatstbedoelde besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0010041#Artikel3
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010041
        artikel: '3'
  - number: '13'
    text: |-
      De bestuursorganen die met de uitvoering en handhaving van de in [artikel 3, eerste lid][ref1], bedoelde bepalingen
      zijn belast en de toezichthoudende bestuursorganen nemen bij de uitoefening van hun taak ten aanzien van de
      experimenteergebieden het daarop betrekking hebbende besluit krachtens [artikel 3, eerste lid][ref2], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0010041#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010041#Artikel3
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010041
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010041
        artikel: '3'
  - number: '14.1'
    text: |-
      Burgemeester en wethouders zenden Onze Minister gedurende een periode van vijf jaar jaarlijks een
      verslag van de voortgang en de bevindingen met betrekking tot de uitvoering van een besluit krachtens
      [artikel 3, eerste lid][ref1]. Het eerste verslag wordt toegezonden een jaar nadat Onze Minister het besluit heeft
      goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0010041#Artikel3
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010041
        artikel: '3'
  - number: '14.2'
    text: |-
      Onze Minister zendt binnen twee jaar en binnen zes jaar na inwerkingtreding van deze wet aan de beide kamers der
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk. In het verslag
      binnen zes jaar na inwerkingtreding van deze wet worden in ieder geval de werkingsduur van deze wet en de gevolgen
      daarvan in beschouwing genomen.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel14
  - number: '14.3'
    text: |-
      Indien Onze Minister zulks nodig acht, zetten burgemeester en wethouders ook na afloop van de in het eerste lid
      genoemde termijn van vijf jaar, de verslaglegging gedurende een door Onze Minister te bepalen termijn voort.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel14
  - number: '15.1'
    text: |-
      De gemeenteraad kan een besluit krachtens [artikel 3, eerste lid][ref1], ook na afloop van de in de aanhef van dat
      artikellid bedoelde termijn, in die zin wijzigen dat de daarin opgenomen afwijkingen geheel of gedeeltelijk komen
      te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0010041#Artikel3
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010041
        artikel: '3'
  - number: '15.2'
    text: |-
      Met betrekking tot een wijzigingsbesluit als bedoeld in het eerste lid, zijn de [artikelen 5][ref1], [9][ref2],
      [10][ref3], [11][ref4] en [12][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010041#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010041#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0010041#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0010041#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0010041#Artikel12
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010041
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0010041
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0010041
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0010041
        artikel: '11'
      - id: ref5
        bwb_id: BWBR0010041
        artikel: '12'
  - number: '15.3'
    text: |-
      Indien de uitvoering van een besluit krachtens [artikel 3, eerste lid][ref1], onvoorziene en ontoelaatbare effecten
      blijkt te hebben op de volksgezondheid of het milieu, neemt de gemeenteraad de noodzakelijke maatregelen teneinde
      deze effecten tot een verantwoord niveau terug te brengen. Met betrekking tot de besluitvorming ten aanzien van
      deze maatregelen zijn de in het tweede lid genoemde artikelen van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010041#Artikel3
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010041
        artikel: '3'
  - number: '16'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van deze wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel16
  - number: '17'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel17
  - number: '18'
    text: 'Deze wet wordt aangehaald als: Experimentenwet Stad en Milieu.'
    url: https://wetten.overheid.nl/BWBR0010041/2005-07-01#Artikel18
