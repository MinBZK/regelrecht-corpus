$id: regeling_aanhoudings_en_ondersteuningseenheid_en_samenwerking_speciale_eenheden
regulatory_layer: WET
publication_date: '2020-12-01'
valid_from: '2017-01-01'
bwb_id: BWBR0020933
url: https://wetten.overheid.nl/BWBR0020933/2017-01-01
preamble:
  text: |-
    Gelet op artikel 46, eerste, tweede en derde lid en artikel 60, tweede lid, van de Politiewet 1993 en artikel 8,
    tweede lid, van het Besluit beheer regionale politiekorpsen;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel1
  - number: 1.a
    text: |-
      aanhoudings- en ondersteuningseenheid: een onderdeel als bedoeld in [artikel 16, eerste lid, van het Besluit beheer
      politie](onbekend);
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel1
  - number: 1.b
    text: |-
      aanhoudings- en ondersteuningseenheid van de Koninklijke marechaussee: aanhoudings- en ondersteuningseenheid die is
      ondergebracht bij de Brigade Speciale Beveiligingsopdrachten van de Koninklijke marechaussee;
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel1
  - number: 1.c
    text: |-
      de Dienst Speciale Interventies: de dienst, bedoeld in
      [artikel 2 van de Regeling Dienst speciale interventies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026381#Artikel2
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0026381
        artikel: '2'
  - number: '3.1'
    text: |-
      Een aanhoudings- en ondersteuningseenheid bestaat uit twee secties, een eenheidscommandant en een ondersteunend
      medewerker.
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel3
  - number: '3.2'
    text: Een sectie bestaat uit elf leden en twee sectiecommandanten.
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel3
  - number: '4'
    text: |-
      De korpschef stelt de termijn vast gedurende welke een ambtenaar van politie ononderbroken deel uit maakt van een
      aanhoudings- en ondersteuningseenheid, tot een maximum van 6 jaar.
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel4
  - number: '5.1'
    text: |-
      De ambtenaar van politie die deel uitmaakt van een aanhoudings- en ondersteuningseenheid, voldoet aan de eindtermen
      van de door de Minister van Veiligheid en Justitie aan te wijzen vervolgopleiding.
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel5
  - number: '5.2'
    text: |-
      De korpschef draagt er zorg voor dat de kennis en vaardigheden van de ambtenaar van politie die deel uitmaakt van
      een aanhoudings- en ondersteuningseenheid worden onderhouden op minimaal het niveau van de eindtermen, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel5
  - number: '8'
    text: |-
      De korpschef en de Minister van Defensie maken afspraken over beheersmatige samenwerking tussen de aanhoudings- en
      ondersteuningseenheden en de aanhoudings- en ondersteuningseenheid van de Koninklijke marechaussee. De afspraken
      hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel8
  - number: 8.a
    text: de afstemming van uitrusting en opleidingen;
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel8
  - number: 8.b
    text: het op een gelijk niveau brengen van de frequentie van inzet van een eenheid.
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel8
  - number: '9'
    text: |-
      De korpschef en de Minister van Defensie maken afspraken over beheersmatige samenwerking tussen de aanhoudings-
      en ondersteuningseenheden, de aanhoudings- en ondersteuningseenheid van de Koninklijke marechaussee en de Dienst
      Speciale Interventies. De afspraken hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel9
  - number: 9.a
    text: |-
      de opleiding, uitrusting en beschikbaarheid van personeel van de aanhoudings- en ondersteuningseenheden en de
      aanhoudings- en ondersteuningseenheid van de Koninklijke marechaussee, ten behoeve van het gezamenlijk optreden met
      de Dienst Speciale Interventies;
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel9
  - number: 9.b
    text: |-
      stages door het personeel van de Dienst Speciale Interventies bij de aanhoudings- en ondersteuningseenheden en de
      aanhoudings- en ondersteuningseenheid van de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel9
  - number: '10'
    text: |-
      De [Organisatieregeling aanhoudings- en ondersteuningseenheden][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006551
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006551
  - number: 10a
    text: |-
      Deze regeling berust op de [artikelen 5][ref1] en [57 van de Politiewet 2012][ref2] en [artikel 16, tweede lid, van
      het Besluit beheer politie](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel57
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '57'
  - number: '11'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel11
  - number: '12'
    text: |-
      Deze regeling wordt aangehaald als: Regeling aanhoudings- en ondersteuningseenheid en samenwerking speciale
      eenheden.
    url: https://wetten.overheid.nl/BWBR0020933/2017-01-01#Artikel12
