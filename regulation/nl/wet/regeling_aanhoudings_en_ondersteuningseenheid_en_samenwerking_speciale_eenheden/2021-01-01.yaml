preamble:
  text: |-
    Gelet op artikel 46, eerste, tweede en derde lid en artikel 60, tweede lid, van de Politiewet 1993 en artikel 8,
    tweede lid, van het Besluit beheer regionale politiekorpsen;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0020933/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *aanhoudings- en ondersteuningsteam:* een team als bedoeld in
      [artikel 11, onder a, van het Besluit beheer politie][ref1].

      b. aanhoudings- en ondersteuningseenheid van de Koninklijke marechaussee: aanhoudings- en ondersteuningseenheid die
      is ondergebracht bij de Brigade Speciale Beveiligingsopdrachten van de Koninklijke marechaussee;

      c. *de bijzondere bijstandseenheid:* de bijzondere bijstandseenheid, bedoeld in
      [artikel 2 van de Regeling Dienst speciale interventies][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0026381#Artikel2
    url: https://wetten.overheid.nl/BWBR0020933/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0026381
        artikel: '2'
  - number: '3'
    text: |-
      1 Een aanhoudings- en ondersteuningsteam bestaat uit twee secties, een eenheidscommandant en een ondersteunend
      medewerker.

      2 Een sectie bestaat uit elf leden en twee sectiecommandanten.
    url: https://wetten.overheid.nl/BWBR0020933/2021-01-01#Artikel3
  - number: '5'
    text: |-
      1 De ambtenaar van politie die deel uitmaakt van een aanhoudings- en ondersteuningsteam, voldoet aan de
      kwalificaties van een door de Minister van Justitie en Veiligheid aan te wijzen politieopleiding.

      2 De korpschef draagt er zorg voor dat de kennis en vaardigheden van de ambtenaar van politie die deel uitmaakt van
      een aanhoudings- en ondersteuningsteam worden onderhouden op minimaal het niveau van de kwalificaties, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020933/2021-01-01#Artikel5
  - number: '8'
    text: |-
      De korpschef en de Minister van Defensie maken afspraken over beheersmatige samenwerking tussen de aanhoudings-
      en ondersteuningsteams en de aanhoudings- en ondersteuningseenheid van de Koninklijke marechaussee. De afspraken
      hebben in ieder geval betrekking op:

      a. de afstemming van uitrusting en opleidingen;

      b. het op een gelijk niveau brengen van de frequentie van inzet van een eenheid.
    url: https://wetten.overheid.nl/BWBR0020933/2021-01-01#Artikel8
  - number: '9'
    text: |-
      De korpschef en de Minister van Defensie maken afspraken over beheersmatige samenwerking tussen de Dienst
      speciale interventies, bedoeld in [artikel 11 van het Besluit beheer politie][ref1], en de aanhoudings- en
      ondersteuningseenheid van de Koninklijke marechaussee. De afspraken hebben in ieder geval betrekking op:

      a. de opleiding, uitrusting en beschikbaarheid van personeel van de aanhoudings- en ondersteuningsteams en de
      aanhoudings- en ondersteuningseenheid van de Koninklijke marechaussee, ten behoeve van het gezamenlijk optreden met
      de bijzondere bijstandseenheid;

      b. stages door het personeel van de bijzondere bijstandseenheid bij de aanhoudings- en ondersteuningsteams en de
      aanhoudings- en ondersteuningseenheid van de Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel11
    url: https://wetten.overheid.nl/BWBR0020933/2021-01-01#Artikel9
    references:
