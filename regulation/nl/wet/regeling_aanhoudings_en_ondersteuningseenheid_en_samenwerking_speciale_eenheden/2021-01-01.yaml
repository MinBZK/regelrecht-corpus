        artikel: '11'
  - number: '10'
    text: |-
      De [Organisatieregeling aanhoudings- en ondersteuningseenheden][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006551
    url: https://wetten.overheid.nl/BWBR0020933/2021-01-01#Artikel10
    references:
