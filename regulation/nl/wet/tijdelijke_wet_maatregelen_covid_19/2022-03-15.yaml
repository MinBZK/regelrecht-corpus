  - number: VIIa
    text: |-
      In afwijking van [artikel 6 van de Wet justitiële en strafvorderlijke gegevens][ref1] worden
      justitiële gegevens betreffende zaken waarin een geldboete is opgelegd voor overtreding van
      [artikel 443 van het Wetboek van Strafrecht][ref2], voor zover het een overtreding betreft in verband met
      maatregelen genomen ter bestrijding van de epidemie van covid-19, of een directe dreiging daarvan, zo snel mogelijk
      na de inwerkingtreding van deze wet vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel443
    url: https://wetten.overheid.nl/BWBR0044337/2022-03-15#ArtikelVIIa
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '443'
  - number: VIIb
    text: |-
      Binnen een maand na inwerkingtreding van deze wet brengt de voorzitter van de veiligheidsregio een verslag uit als
      bedoeld in [artikel 40, eerste lid, van de Wet veiligheidsregio's][ref1] over het verloop van de gebeurtenissen
      en de besluiten die hij heeft genomen voor de bestrijding van de epidemie van covid-19, of een directe
      dreiging daarvan, tot het moment van die inwerkingtreding. Artikel 40, tweede tot en met zesde lid, van de Wet
      veiligheidsregio’s is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel40
    url: https://wetten.overheid.nl/BWBR0044337/2022-03-15#ArtikelVIIb
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '40'
  - number: VIII
    text: |-
      1 Met ingang van drie maanden na het tijdstip van inwerkingtreding van deze wet vervallen:

      a. [hoofdstuk Va][ref1], [paragraaf 1a van hoofdstuk VII][ref2] en de [artikelen 64a][ref3],
      [68bis][ref4], [68ka][ref5] en [68kb van de Wet publieke gezondheid][ref6];

      b. [artikel 28, zevende lid, van de Arbeidsomstandighedenwet][ref7];

      c. [artikel 2, twaalfde lid, van de Arbeidsveiligheidswet BES][ref8];

      d. [artikel 1.57e van de Wet kinderopvang][ref9].

      2 Bij koninklijk besluit kan voor in het eerste lid genoemde bepalingen of onderdelen daarvan worden bepaald dat
      zij op een eerder tijdstip vervallen.

      3 Bij koninklijk besluit kan voor in het eerste lid genoemde bepalingen of onderdelen daarvan worden bepaald dat
      zij op een later tijdstip vervallen, met dien verstande dat dit tijdstip steeds ten hoogste drie maanden na het
      tijdstip ligt waarop die bepalingen of onderdelen zouden vervallen.

      4 De voordracht voor een koninklijk besluit als bedoeld in het derde lid wordt niet eerder gedaan dan twee weken
      nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd. Indien een der Kamers der Staten-Generaal
      binnen die termijn besluit niet in te stemmen met dat ontwerp, wordt er ten aanzien van dat ontwerp geen voordracht
      gedaan. Een besluit als bedoeld in de vorige zin kan worden genomen op voorstel van een of meer leden van een der
      Kamers der Staten-Generaal.


