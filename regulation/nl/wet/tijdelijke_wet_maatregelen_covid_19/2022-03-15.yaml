preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voor de huidige fase van de bestrijding van de epidemie
    van covid-19 tijdelijk een aanvullend wettelijk instrumentarium te creëren in de Wet publieke gezondheid dat
    voor de langere termijn een juridische basis vormt voor een samenleving waarin het houden van afstand en andere
    gedragsvoorschriften van groot belang zijn;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0044337/2022-03-15#ArtikelAanhef
articles:
  - number: II
    text: |-
      Indien [artikel 1 van de Tijdelijke wet COVID-19 Justitie en Veiligheid][ref1] is vervallen op het tijdstip waarop
      deze wet in werking treedt of vervalt op een later tijdstip, blijft dat artikel vanaf dat tijdstip van toepassing
      op de procedure, bedoeld in [artikel 58f, tweede lid, tweede zin, van de Wet publieke gezondheid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0043413#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
    url: https://wetten.overheid.nl/BWBR0044337/2022-03-15#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0043413
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58f
  - number: VII
    text: |-
      [Artikel 122 van de Gemeentewet][ref1] en
      [artikel 216 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2] zijn niet van toepassing op de
      bepalingen van gemeentelijke verordeningen onderscheidenlijk eilandsverordeningen die voorzien in bestrijding
      van de epidemie, bedoeld in [hoofdstuk Va van de Wet publieke gezondheid][ref3], en niet met het bepaalde bij of
      krachtens dat hoofdstuk in strijd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel216
      [ref3]: https://wetten.overheid.nl/BWBR0024705#HoofdstukVa
    url: https://wetten.overheid.nl/BWBR0044337/2022-03-15#ArtikelVII
    references:
