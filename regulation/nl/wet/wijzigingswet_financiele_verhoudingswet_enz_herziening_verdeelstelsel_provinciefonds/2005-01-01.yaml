  - number: '10'
    text: |-
      1 De omgevingsadressendichtheid van een adres is het aantal adressen in de omgeving van het adres, gedeeld door het
      oppervlak in vierkante kilometers van de omgeving.

      2 De omgeving van een adres wordt gevormd door het rastervierkant, waarin het adres is gelegen en de twaalf meest
      nabijgelegen rastervierkanten.
    url: https://wetten.overheid.nl/BWBR0008995/2005-01-01#Artikel10
  - number: '11'
    text: |-
      1 Onze Ministers stellen het aantal kilometers gewogen weglengte van de wegen in beheer bij de provincie vast,
      door het aantal kilometers weglengte van de wegen die in beheer zijn bij de provincie te vermenigvuldigen met
      een wegingsfactor die een maat is voor de kosten per kilometer van het onderhoud van de wegen in de provincie, in
      verhouding met die kosten in alle provincies.

      2 Op de voorbereiding van het besluit, bedoeld in het eerste lid, is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0008995/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '12'
    text: |-
      1 De algemene uitkering over de jaren 1998 tot en met 2000, zoals deze voor een provincie wordt vastgesteld
      overeenkomstig [hoofdstuk 2 van de Financiële-verhoudingswet][ref1], wordt vermeerderd of verminderd met een
      bedrag overeenkomstig de kolommen 1 tot en met 3 in de tabel die als [bijlage 3][ref2] bij deze wet is gevoegd.

      2 De algemene uitkering over de jaren 2001 en volgende, zoals deze voor een provincie wordt vastgesteld
      overeenkomstig [hoofdstuk 2 van de Financiële-verhoudingswet][ref3], wordt vermeerderd of verminderd met een
      bedrag overeenkomstig kolom 4 in de tabel die als [bijlage 3][ref4] bij deze wet is gevoegd.

      3 De bedragen, bedoeld in het eerste en tweede lid, worden vermenigvuldigd met het quotiënt van de uitkeringsfactor
      over het uitkeringsjaar en de uitkeringsfactor over het jaar 1998. De uitkeringsfactor is het quotiënt van het voor
      de algemene uitkering beschikbare bedrag en de som van de uitkeringsbases.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Hoofdstuk2
