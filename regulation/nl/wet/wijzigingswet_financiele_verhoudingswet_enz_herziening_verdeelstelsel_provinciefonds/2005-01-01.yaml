  - number: '13'
    text: |-
      1 De vaststelling van een uitkering uit het provinciefonds over de uitkeringsjaren voor de inwerkingtreding van
      deze wet en de rechtsgedingen die daarop betrekking hebben, geschieden volgens de wettelijke regels, zoals deze
      luidden voor inwerkingtreding van deze wet.

      2 Indien de over de uitkeringsjaren vóór de inwerkingtreding van deze wet verrichte betalingen aan een provincie
      hoger of lager zijn dan de voor die uitkeringsjaren vastgestelde uitkeringen wordt het verschil teruggevorderd of
      uitbetaald. Het verschil komt ten goede aan of ten laste van het provinciefonds.

      3 Het Besluit rivierdijkversterking/hoofdwaterkeringen Provinciefonds berust na de inwerkingtreding
      van deze wet op [artikel 13 van de Financiële-verhoudingswet][ref1]. Op dit besluit is
      [artikel 13, derde lid, van de Financiële-verhoudingswet][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel13
