  - number: '8'
    text: |-
      1 Bij de vaststelling van de algemene uitkering aan een provincie stellen Onze Ministers zo nodig het aantal
      eenheden per verdeelmaatstaf voor de provincie vast. Voor zover in de bijlage bij een verdeelmaatstaf een bron is
      vermeld, kunnen Onze Ministers het aantal eenheden ontlenen aan een opgave van het vermelde orgaan of de vermelde
      instantie.

      2 De vaststelling van het aantal eenheden per verdeelmaatstaf voor een provincie geschiedt naar de toestand op 1
      januari van het uitkeringsjaar waarover het aantal wordt vastgesteld, tenzij in de bijlage een peildatum bij een
      verdeelmaatstaf is vermeld. In dat geval geschiedt de vaststelling naar de toestand op deze datum.

      3 Indien op grond van het tweede lid een peildatum moet worden gehanteerd die ligt vóór de datum van instelling van
      de provincie of vóór de datum waarop de grenzen van de provincie zijn gewijzigd, stellen Onze Ministers het aantal
      eenheden vast op basis van een redelijke schatting van de toestand zoals die op de peildatum zou zijn geweest als
      de instelling of wijziging op die datum reeds was ingegaan.
    url: https://wetten.overheid.nl/BWBR0008995/2005-01-01#Artikel8
  - number: '9'
    text: |-
      1 Bij de bepaling van het totaal van de in een kalenderjaar ontvangen hoofdsommen van de motorrijtuigenbelasting,
      wordt het tarief van de [Wet op de motorrijtuigenbelasting 1994][ref1] gehanteerd, zoals dat geldt op 1 april 1995.
      De verhoging van de belasting, bedoeld in artikel 23, tweede lid, van die wet en de vermindering van de belasting,
      bedoeld in de artikelen 28 en 68 van die wet, blijven buiten beschouwing.

      2 In afwijking van het eerste lid wordt voor de periode tot 1 april 1997 bij de bepaling van het totaal
      van de in een kalenderjaar ontvangen hoofdsommen van de motorrijtuigenbelasting, het tarief van de
      [Wet op de motorrijtuigenbelasting 1966][ref2] gehanteerd, zoals dat luidde bij aanvang van het kalenderjaar 1980.
      De vermeerdering van belasting, bedoeld in artikel 6 van die wet en het vaste bedrag, genoemd in artikel 8, tweede
      lid, onderdeel *a*, van die wet, blijven buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0006324
      [ref2]: https://wetten.overheid.nl/BWBR0002534
