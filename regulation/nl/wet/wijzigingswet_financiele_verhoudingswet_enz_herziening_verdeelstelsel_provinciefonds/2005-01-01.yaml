preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te stellen inzake de financiële
    verhouding tussen het Rijk en de provincies, deze regels op te nemen in de Financiële-verhoudingswet en daartoe
    deze wet en andere wetten te wijzigen en regels te stellen inzake de invoering van deze nieuwe regels;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008995/2005-01-01#ArtikelAanhef
articles:
  - number: '6'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Ministers: Onze Minister van Binnenlandse Zaken en Onze Minister van Financiën;

      b. het CBS: het Centraal bureau voor de statistiek;

      c. rastervierkanten: vierkanten van 500 bij 500 meter, zoals deze worden gebruikt in het geografisch basisregister
      van het CBS;

      d. de uitkeringsfactor: het quotiënt van het voor de algemene uitkeringen beschikbare bedrag en de som van de
      uitkeringsbases.
    url: https://wetten.overheid.nl/BWBR0008995/2005-01-01#Artikel6
  - number: '7'
    text: |-
      1 In afwijking van [artikel 8, derde lid, van de Financiële-verhoudingswet][ref1] worden bij de verdeling van
      het provinciefonds voor de eerste maal de verdeelmaatstaven gehanteerd die zijn vermeld in [bijlage 1][ref2] bij
      deze wet. Op de hantering van de maatstaven zijn de bepalingen van dit hoofdstuk van toepassing. Bij regeling
      van Onze Ministers kunnen nadere voorschriften worden gegeven omtrent de toepassing van de in dit hoofdstuk en
      [bijlage 1][ref3] gebruikte begrippen en omtrent de wijze van telling van het aantal eenheden per verdeelmaatstaf.

      2 In afwijking van [artikel 9, eerste lid, van de Financiële-verhoudingswet][ref4] gelden voor de
      maatstaven, bedoeld in het eerste lid, voor het eerste uitkeringsjaar na de inwerkingtreding van deze wet
      de bedragen per eenheid die zijn vermeld in [bijlage 2][ref5] bij deze wet. Onze Ministers kunnen deze
      bedragen aanpassen in verband met wijzigingen ten aanzien van het fonds over de jaren 1997 en 1998, die
      door middel van wijzigingen in de bedragen per eenheid over de provincies verdeeld behoren te worden.
      [Artikel 9, tweede lid, van de Financiële-verhoudingswet][ref6] blijft buiten toepassing bij de vaststelling van
      de bedragen per eenheid voor bedoelde maatstaven.


