  - number: 1a
    text: |-
      Deze regeling is tevens gebaseerd op [artikel 6.51a, tweede lid, van de Wlv][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6.51a
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 6.51a
  - number: '2'
    text: |-
      1 Deze regeling is uitsluitend van toepassing op:

      a. ondernemingen die een aanvraag tot erkenning hebben gedaan, en

      b. erkende instanties.

      2 Deze regeling is van toepassing op de volgende handelingen, bedoeld in [bijlage 1 bij de VLG][ref1],
      [bijlage 1 bij de VSG][ref2], [bijlage 1 bij de VBG][ref3], of zoals omschreven in de Technische Voorschriften:

      a. de goedkeuring van het prototype, het onderzoek en de beproeving alsmede het afgeven van certificaten en
      kernmerken voor drukhouders, verpakkingen, grote verpakkingen, IBC’s of tanks, alsmede handelingen ten behoeve
      daarvan;

      b. het toezicht houden op de juiste werking van kwaliteitssystemen en kwaliteitsborgingsystemen voor het ontwerp,
      de constructie, appendages, bedrijfsuitrusting, productie, ombouw, reconditionering, reparatie en beproeving van
      drukhouders, verpakkingen, grote verpakkingen, bulkcontainers, IBC’s of tanks;

      c. het beoordelen van de kwaliteit van gerecycleerde kunststoffen in relatie tot de fabricage van nieuwe
      verpakkingen;

      d. de conformiteitsbeoordeling van drukhouders, het bijhouden van een actuele lijst van de onderzoeksinstanties en
      hun identiteitskenmerken alsmede van de toegelaten fabrikanten en hun identiteitskenmerken;

      e. het beoordelen van de geschiktheid voor het gebruik voor specifieke stoffen van drukhouders, verpakkingen, grote
      verpakkingen, IBC’s of tanks en het stellen van speciale voorwaarden daaraan;

      f. het toelaten van verruiming van de toegestane gebruiksduur of maximale beproevingsinterval voor drukhouders
      en verpakkingen;

      g. het erkennen van alternatieve methoden voor het aantonen van chemische bestendigheid van kunststofverpakkingen;

      h. het vaststellen van vervoersvoorwaarden voor drukhouders voor gebruik als brandstofreservoirs voor hete-
      luchtvervoermiddelen;

      i. het uitvoeren van testprocedures op ladingmonsters voor het vaststellen van ladingeigenschappen en het afgeven
      van bijbehorende ladingcertificaten als bedoeld in appendix 2 bij de IMSBC-Code.

      3 Voor zover de uitvoering van de in het tweede lid genoemde handelingen betrekking heeft op drukhouders en
      tanks als bedoeld in de [Regeling vervoerbare drukapparatuur 2011][ref4], is de uitvoering van deze handelingen
      voorbehouden aan de op grond van die regeling aangemelde instanties.


      [ref1]: https://wetten.overheid.nl/BWBR0010054
      [ref2]: https://wetten.overheid.nl/BWBR0010053
      [ref3]: https://wetten.overheid.nl/BWBR0010115
      [ref4]: https://wetten.overheid.nl/BWBR0030099
