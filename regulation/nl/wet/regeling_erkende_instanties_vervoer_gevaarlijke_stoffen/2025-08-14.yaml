preamble:
  text: |-
    Gelet op de artikelen 10a en 34 van de Wet vervoer gevaarlijke stoffen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *erkenning:* erkenning als bedoeld in [artikel 10a van de Wvgs][ref1] of [artikel 6.51a van de Wlv][ref2];
        - *erkende instantie:* onderneming die beschikt over een geldige erkenning;
        - *IBC’s:* Intermediate Bulk Containers;
        - *IMSBC-Code:* de bij resolutie MSC.268(85) van de Maritieme Veiligheidscommissie van de Internationale Maritieme
      Organisatie van de Verenigde Naties aangenomen Internationale Maritieme Code voor het vervoer van vaste lading in
      bulk (International Maritime Solid Bulk Cargoes Code);
        - *minister:* Minister van Infrastructuur en Waterstaat;
        - *onderneming:* onderneming als bedoeld in [artikel 5 van de Handelsregisterwet][ref3], met privaatrechtelijke
      rechtspersoonlijkheid;
        - *Technische Voorschriften:* Technische Voorschriften als bedoeld in
      [artikel 1 van het Besluit vervoer gevaarlijke stoffen door de lucht][ref4];
        - *VBG:* [Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref5];
        - *VLG:* [Regeling vervoer over land van gevaarlijke stoffen][ref6];
        - *VSG:* [Regeling vervoer over de spoorweg van gevaarlijke stoffen][ref7];
        - *Wlv:* [Wet luchtvaart][ref8];
        - *Wvgs:* [Wet vervoer gevaarlijke stoffen][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel10
