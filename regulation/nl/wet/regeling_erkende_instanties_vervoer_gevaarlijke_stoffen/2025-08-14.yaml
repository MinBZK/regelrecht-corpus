  - number: '3'
    text: |-
      De aanvrager verstrekt bij de aanvraag tot erkenning in elk geval de volgende bescheiden en gegevens:

      a. een kwaliteitssysteem als bedoeld in [artikel 9][ref1];

      b. gegevens die de onafhankelijkheid en onpartijdigheid van de aanvrager aantonen, en

      c. de polis van een verzekering als bedoeld in [artikel 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0026901#Artikel12
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0026901
        artikel: '12'
        paragraaf: '2'
  - number: '4'
    text: |-
      1 De minister kan een erkenning verlenen aan een onderneming, indien die onderneming voldoet aan de in de
      [paragraaf 2][ref1] van deze regeling opgenomen voorwaarden.

      2 De erkenning heeft alleen betrekking op de handelingen die worden vermeld in de beschikking waarmee de
      erkenning wordt verleend en die een nadere uitvoering zijn van de voorschriften van [bijlage 1 bij de VLG][ref2],
      [bijlage 1 bij de VSG][ref3], [bijlage 1 bij de VBG][ref4], de IMSBC-Code of de Technische Voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0010054
      [ref3]: https://wetten.overheid.nl/BWBR0010053
      [ref4]: https://wetten.overheid.nl/BWBR0010115
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0026901
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010054
      - id: ref3
        bwb_id: BWBR0010053
      - id: ref4
        bwb_id: BWBR0010115
  - number: '5'
    text: De erkenning is gedurende tien jaar vanaf de bekendmaking geldig.
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel5
  - number: '6'
    text: |-
      Indien een erkende instantie voornemens is wijzigingen door te voeren in de bescheiden en gegevens,
      bedoeld in [artikel 3][ref1], die gevolgen kunnen hebben voor de uitvoering van de handelingen, bedoeld in
      [artikel 2, tweede lid][ref2], legt die erkende instantie de bescheiden en gegevens met de voorgenomen wijzigingen
      voorafgaand aan het doorvoeren daarvan ter beoordeling en goedkeuring voor aan de Inspectie Leefomgeving en
      Transport.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0026901#Artikel2
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
  - number: '7'
    text: |-
      De erkende instantie hanteert geen tarieven of andere vereisten, die de toegang tot het uitvoeren van handelingen
      als bedoeld in [artikel 2, tweede lid][ref1], door die erkende instantie onnodig belemmeren.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
  - number: '8'
    text: |-
      1 De erkende instantie waarborgt de onafhankelijkheid en onpartijdigheid van de onderneming zowel als die van de
      personen die zijn betrokken bij handelingen als bedoeld in [artikel 2, tweede lid][ref1], ten opzichte van een
      opdrachtgever en andere betrokken partijen.

      2 Indien de bezoldiging van personen die zijn betrokken bij handelingen als bedoeld in
      [artikel 2, tweede lid][ref2], op enige wijze afhankelijk is van het aantal van die handelingen dat is uitgevoerd,
      of het resultaat van die handelingen, is dat in elk geval in strijd met het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026901#Artikel2
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
  - number: '9'
    text: |-
      De erkende instantie beschikt over een geschikt kwaliteitssysteem, waarin de organisatorische, personele en
      procedurele kwaliteitsborging is beschreven en handelt ernaar.
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel9
  - number: '10'
    text: |-
      1 De erkende instantie heeft voor de uitvoering van handelingen als bedoeld in [artikel 2, tweede lid][ref1], de
      beschikking over medewerkers met voldoende vakbekwaamheid voor de uitvoering van die werkzaamheden alsmede voor het
      toezicht op de uitvoering van die werkzaamheden.

      2 In het kwaliteitssysteem, bedoeld in [artikel 9][ref2], wordt aandacht besteed aan opleiding, kwalificatie en
      ervaring.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026901#Artikel9
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0026901
        artikel: '9'
        paragraaf: '2'
  - number: '11'
    text: |-
      De erkende instantie draagt zorg voor uitvoering van handelingen als bedoeld in [artikel 2, tweede lid][ref1], in
      overeenstemming met de geldende voorschriften, waaronder in elk geval die in de [VBG][ref2], de [VLG][ref3], de
      [VSG][ref4], de IMSBC-Code of de Technische Voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010115
      [ref3]: https://wetten.overheid.nl/BWBR0010054
      [ref4]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0010115
      - id: ref3
        bwb_id: BWBR0010054
      - id: ref4
        bwb_id: BWBR0010053
  - number: '12'
    text: |-
      De erkende instantie beschikt over een aansprakelijkheidsverzekering die de risico’s dekt die gepaard gaan met de
      uitgevoerde handelingen.
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel12
  - number: '13'
    text: |-
      Voorafgaand aan de uitvoering van handelingen als bedoeld in [artikel 2, tweede lid][ref1], stelt de erkende
      instantie aan een opdrachtgever een document ter beschikking waarin per categorie objecten is vastgelegd welke van
      de handelingen als bedoeld in artikel 2, tweede lid, worden uitgevoerd, de te hanteren methode en de eisen waaraan
      zal worden getoetst.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
  - number: '14'
    text: |-
      1 De erkende instantie verstrekt zonder schriftelijke toestemming van de opdrachtgever geen informatie aan derden
      over handelingen als bedoeld in [artikel 2, tweede lid, onder a][ref1], met uitzondering van overheidsdienaren in
      de uitoefening van hun functie.

      2 De erkende instantie verplicht alle bij handelingen als bedoeld in [artikel 2, tweede lid][ref2], betrokken
      medewerkers tot geheimhouding als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026901#Artikel2
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
  - number: '15'
    text: |-
      De erkende instantie doet jaarlijks voor 1 april verslag aan de minister, waarbij voor elke handeling als bedoeld
      in [artikel 2, tweede lid][ref1], het aantal verrichte handelingen en het resultaat van de beoordeling wordt
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
  - number: '16'
    text: |-
      1 Alle handelingen waarvoor een erkenning is verleend, worden binnen een periode van twaalf maanden na het verlenen
      daarvan tenminste eenmaal uitgevoerd.

      2 De erkende instantie laat een erkenning niet langer dan een aaneengesloten periode van twaalf maanden ongebruikt.

      3 Als een handeling waarvoor een erkenning is verleend langer dan een aaneengesloten periode van twaalf maanden
      niet is uitgevoerd, kan de erkenning worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel16
  - number: '17'
    text: |-
      De erkende instantie besteedt het uitvoeren van de handelingen, bedoeld in [artikel 2, tweede lid][ref1], niet
      uit, tenzij:

      a. de te hanteren methode schriftelijk is vastgelegd in een modelovereenkomst voordat de werkzaamheden worden
      uitbesteed;

      b. de opdrachtgever van het voornemen tot uitbesteding op de hoogte wordt gesteld en uitdrukkelijk kenbaar maakt
      dat hij instemt met de voorgenomen uitbesteding en de betreffende onderaannemer;

      c. het geven van een eindoordeel over de keuring of certificering voorbehouden blijft aan de erkende instantie;

      d. de onderaannemer tenminste voldoet aan de eisen, bedoeld in de [artikelen 8][ref2], [9][ref3], [10][ref4],
      [13][ref5] en [14][ref6], en

      e. de erkende instantie waarborgt dat geen verdere onderaanbesteding dan de onderaannemer plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026901#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0026901#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0026901#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0026901#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0026901#Artikel14
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0026901
        artikel: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0026901
        artikel: '9'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0026901
        artikel: '10'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0026901
        artikel: '13'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0026901
        artikel: '14'
        paragraaf: '2'
  - number: '18'
    text: |-
      1 De erkende instantie houdt een register bij van elke uitbesteding van keuring of certificatie.

      2 Het register bevat voor een gekeurd object of certificatie de naam van de onderaannemer, het kenmerk van het
      certificaat en het kenmerk van het keuringsrapport.
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel18
  - number: 18a
    text: |-
      De erkende instantie houdt toezicht op de juiste werking van de kwaliteitssystemen van de bij haar aangesloten
      onderaannemers, producenten en bedrijfslaboratoria.
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel18a
  - number: '19'
    text: |-
      1 Bij het eerste verlenen van een erkenning met toepassing van deze regeling vervalt een erkenning voor die
      onderneming, genoemd in:

      a. artikel 1 van [bijlage 4 bij de Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref1];

      b. artikel 1 van [bijlage 3 bij de Regeling vervoer over land van gevaarlijke stoffen][ref2], of

      c. artikel 1 van [bijlage 3 bij de Regeling vervoer over de spoorweg van gevaarlijke stoffen][ref3],

      zoals die luidden tot het moment van inwerkingtreding van deze regeling.

      2 Een erkenning als bedoeld in de in het eerste lid, onder a tot en met c, genoemde regelingen, vervalt in elk
      geval met ingang van twee jaar na de datum waarop deze regeling in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0010115
      [ref2]: https://wetten.overheid.nl/BWBR0010054
      [ref3]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0010115
      - id: ref2
        bwb_id: BWBR0010054
      - id: ref3
        bwb_id: BWBR0010053
  - number: 19a
    text: |-
      Een wijziging van de IMSBC-Code gaat voor de toepassing van deze regeling gelden met ingang van de dag waarop
      die wijziging internationaal in werking treedt, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel19a
  - number: '20'
    text: Deze regeling treedt in werking met ingang van 1 april 2010.
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel20
  - number: '21'
    text: 'Deze regeling wordt aangehaald als: Regeling erkende instanties vervoer gevaarlijke stoffen.'
    url: https://wetten.overheid.nl/BWBR0026901/2025-08-14#Artikel21
