---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_erkende_instanties_vervoer_gevaarlijke_stoffen
regulatory_layer: WET
publication_date: '2025-08-13'
valid_from: '2019-04-20'
bwb_id: BWBR0026901
url: https://wetten.overheid.nl/BWBR0026901/2019-04-20
preamble:
  text: |-
    Gelet op de artikelen 10a en 34 van de Wet vervoer gevaarlijke stoffen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *onderneming:* onderneming als bedoeld in artikel 5 van de
      Handelsregisterwet, met privaatrechtelijke rechtspersoonlijkheid;
        - *wet:* [Wet vervoer gevaarlijke stoffen][ref1];
        - *erkenning:* erkenning als bedoeld in [artikel 10a van de wet][ref2];
        - *erkende instantie:* onderneming die beschikt over een geldige erkenning;
        - *Minister:* Minister van Infrastructuur en Milieu;
        - *ADNR:* Règlement pour le transport des matières dangereuses sur le Rhin;
        - *ADN:* Accord Européen relatif au Transport International des Marchandises Dangereuses par voie de Navigation
      (ADN);
        - *ADR:* Accord Européen relatif au transport international des marchandises dangereuses par route;
        - *RID:* Règlement concernant le transport international ferroviaire des marchandises dangereuses;
        - *IMSBC-Code:* de bij resolutie MSC.268(85) van de Maritieme Veiligheidscommissie van de Internationale Maritieme
      Organisatie van de Verenigde Naties aangenomen Internationale Maritieme Code voor het vervoer van vaste lading in
      bulk (International Maritime Solid Bulk Cargoes Code).


      [ref1]: https://wetten.overheid.nl/BWBR0007606
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel10a
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007606
      - id: ref2
        bwb_id: BWBR0007606
        artikel: 10a
  - number: '2.1'
    text: 'Deze regeling is uitsluitend van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel2
  - number: 2.1.a
    text: ondernemingen die een aanvraag tot erkenning hebben gedaan, en
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel2
  - number: 2.1.b
    text: erkende instanties.
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel2
  - number: '2.2'
    text: 'Deze regeling is van toepassing op de volgende handelingen:'
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel2
  - number: 2.2.a
    text: |-
      keuren of certificeren van verpakkingen, drukhoudende tanks, of de bouw en uitrusting van binnenvaartschepen, als
      bedoeld in de vermelde randnummers in de bijlage bij deze regeling;
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel2
  - number: 2.2.b
    text: classificeren van gevaarlijke vaste lading in bulk en afgeven van ladingcertificaten, als bedoeld in de IMSBC-Code.
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel2
  - number: '3'
    text: 'De aanvrager verstrekt bij de aanvraag tot erkenning in elk geval de volgende bescheiden en gegevens:'
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel3
  - number: 3.a
    text: |-
      een kwaliteitsborgingsysteem als bedoeld in [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel9
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '9'
        paragraaf: '2'
  - number: 3.b
    text: gegevens die de onafhankelijkheid en onpartijdigheid van de aanvrager aantonen, en
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel3
  - number: 3.c
    text: |-
      de polis van een verzekering als bedoeld in [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel12
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '12'
        paragraaf: '2'
  - number: '4'
    text: |-
      De Minister kan een erkenning verlenen aan een onderneming, indien die onderneming voldoet aan de in de
      [paragraaf 2][ref1] van deze regeling opgenomen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0026901
        paragraaf: '2'
  - number: '5'
    text: De erkenning is gedurende tien jaar vanaf de bekendmaking geldig.
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel5
  - number: '6'
    text: |-
      Indien een erkende instantie handelingen, bedoeld in [artikel 2, tweede lid][ref1], voornemens is wijzigingen
      door te voeren in de bescheiden en gegevens als bedoeld in [artikel 3][ref2], die gevolgen kunnen hebben voor de
      uitvoering van die handelingen, overlegt die erkende instantie deze gewijzigde bescheiden en gegevens voorafgaand
      aan de voorgenomen wijziging, aan de Inspectie Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026901#Artikel3
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0026901
        artikel: '3'
        paragraaf: '1'
  - number: '7'
    text: |-
      De erkende instantie hanteert geen tarieven of andere vereisten, die de toegang tot het uitvoeren van handelingen
      als bedoeld in [artikel 2, tweede lid][ref1], door die erkende instantie onnodig belemmeren.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
  - number: '8.1'
    text: |-
      De erkende instantie waarborgt de onafhankelijkheid en onpartijdigheid van de onderneming zowel als die van de
      personen die zijn betrokken bij handelingen als bedoeld in [artikel 2, tweede lid][ref1], ten opzichte van een
      opdrachtgever en andere betrokken partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Indien de bezoldiging van personen die zijn betrokken bij handelingen als bedoeld in [artikel 2, tweede lid][ref1],
      op enige wijze afhankelijk is van het aantal van die handelingen dat is uitgevoerd, of het resultaat van die
      handelingen, is dat in elk geval in strijd met het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
  - number: '9'
    text: |-
      De erkende instantie beschikt over een geschikt kwaliteitsborgingsysteem, schriftelijk vastgelegd in een document
      dat de organisatorische, personele en procedurele kwaliteitsborgen beschrijft.
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel9
  - number: '10.1'
    text: |-
      De erkende instantie heeft voor de uitvoering van handelingen als bedoeld in [artikel 2, tweede lid][ref1], de
      beschikking over medewerkers met voldoende vakbekwaamheid voor de uitvoering van die werkzaamheden alsmede voor het
      toezicht op de uitvoering van die werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
  - number: '10.2'
    text: |-
      In het kwaliteitsborgingsysteem, bedoeld in [artikel 9][ref1], wordt aandacht besteed aan opleiding, kwalificatie
      en ervaring.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel9
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '9'
        paragraaf: '2'
  - number: '11'
    text: |-
      De erkende instantie draagt zorg voor uitvoering van handelingen als bedoeld in
      [artikel 2, tweede lid][ref1], in overeenstemming met de geldende voorschriften, waaronder in
      elk geval die in de [Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref2],
      de [Regeling vervoer over land van gevaarlijke stoffen][ref3], de
      [Regeling vervoer over de spoorweg van gevaarlijke stoffen][ref4] of de IMSBC-Code.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010115
      [ref3]: https://wetten.overheid.nl/BWBR0010054
      [ref4]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0010115
      - id: ref3
        bwb_id: BWBR0010054
      - id: ref4
        bwb_id: BWBR0010053
  - number: '12'
    text: |-
      De erkende instantie beschikt over een aansprakelijkheidsverzekering met een dekking van tenminste vijf miljoen
      euro.
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel12
  - number: '13'
    text: |-
      Voorafgaand aan de uitvoering van handelingen als bedoeld in [artikel 2, tweede lid][ref1], stelt de erkende
      instantie aan een opdrachtgever een document ter beschikking waarin per categorie objecten is vastgelegd welke van
      de handelingen als bedoeld in artikel 2, tweede lid, worden uitgevoerd, de te hanteren methode en de eisen waaraan
      zal worden getoetst.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
  - number: '14.1'
    text: |-
      De erkende instantie verstrekt zonder schriftelijke toestemming van de opdrachtgever geen informatie aan derden
      over handelingen als bedoeld in [artikel 2, tweede lid, onder a][ref1], met uitzondering van overheidsdienaren in
      de uitoefening van hun functie.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
  - number: '14.2'
    text: |-
      De erkende instantie verplicht alle bij handelingen als bedoeld in [artikel 2, tweede lid][ref1], betrokken
      medewerkers tot geheimhouding als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
  - number: '15'
    text: |-
      De erkende instantie doet jaarlijks verslag aan de Minister, waarbij voor elke handeling als bedoeld in
      [artikel 2, tweede lid][ref1], het aantal verrichte handelingen en het resultaat van de beoordeling wordt vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
  - number: '16.1'
    text: De erkende instantie maakt binnen twaalf maanden na het verlenen van een erkenning daarvan gebruik.
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel16
  - number: '16.2'
    text: De erkende instantie laat een erkenning niet langer dan een aaneengesloten periode van twaalf maanden ongebruikt.
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel16
  - number: '17'
    text: |-
      De erkende instantie besteedt het uitvoeren van de handelingen, bedoeld in [artikel 2, tweede lid, onder a][ref1],
      niet uit, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel2
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '2'
        paragraaf: '1'
  - number: 17.a
    text: |-
      de te hanteren methode schriftelijk is vastgelegd in een modelovereenkomst voordat de werkzaamheden worden
      uitbesteed;
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel17
  - number: 17.b
    text: |-
      de opdrachtgever van het voornemen tot uitbesteding op de hoogte wordt gesteld en uitdrukkelijk kenbaar maakt dat
      hij instemt met de voorgenomen uitbesteding en de betreffende onderaannemer;
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel17
  - number: 17.c
    text: het geven van een eindoordeel over de keuring of certificering voorbehouden blijft aan de erkende instantie;
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel17
  - number: 17.d
    text: |-
      de onderaannemer tenminste voldoet aan de eisen, bedoeld in de [artikelen 8][ref1], [9][ref2], [10][ref3] en
      [14][ref4], en


      [ref1]: https://wetten.overheid.nl/BWBR0026901#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0026901#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0026901#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0026901#Artikel14
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0026901
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0026901
        artikel: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0026901
        artikel: '10'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0026901
        artikel: '14'
        paragraaf: '2'
  - number: 17.e
    text: de erkende instantie waarborgt dat geen verdere onderaanbesteding dan de onderaannemer plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel17
  - number: '18.1'
    text: De erkende instantie houdt een register bij van elke uitbesteding van keuring of certificatie.
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel18
  - number: '18.2'
    text: |-
      Het register bevat voor een gekeurd object of certificatie de naam van de onderaannemer, het kenmerk van het
      certificaat en het kenmerk van het keuringsrapport.
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel18
  - number: '19.1'
    text: |-
      Bij het eerste verlenen van een erkenning met toepassing van deze regeling vervalt een erkenning voor die
      onderneming, genoemd in:
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel19
  - number: 19.1.a
    text: |-
      artikel 1 van [bijlage 4 bij de Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010115
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0010115
  - number: 19.1.b
    text: |-
      artikel 1 van [bijlage 3 bij de Regeling vervoer over land van gevaarlijke stoffen][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0010054
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0010054
  - number: 19.1.c
    text: |-
      artikel 1 van [bijlage 3 bij de Regeling vervoer over de spoorweg van gevaarlijke stoffen][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0010053
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0010053
  - number: '19.2'
    text: |-
      Een erkenning als bedoeld in de in het eerste lid, onder a tot en met c, genoemde regelingen, vervalt in elk geval
      met ingang van twee jaar na de datum waarop deze regeling in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel19
  - number: 19a
    text: |-
      Een wijziging van de IMSBC-Code gaat voor de toepassing van deze regeling gelden met ingang van de dag waarop
      die wijziging internationaal in werking treedt, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel19a
  - number: '20'
    text: Deze regeling treedt in werking met ingang van 1 april 2010.
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel20
  - number: '21'
    text: 'Deze regeling wordt aangehaald als: Regeling erkende instanties vervoer gevaarlijke stoffen.'
    url: https://wetten.overheid.nl/BWBR0026901/2019-04-20#Artikel21
