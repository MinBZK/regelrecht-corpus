  - number: '36'
    text: |-
      1 De arbeidsongeschiktheidsuitkering gaat in op de dag, met ingang waarvan de betrokkene aan de vereisten voor het
      recht op toekenning van die uitkering voldoet.

      2 In afwijking van het eerste lid kan de uitkering niet vroeger ingaan dan een jaar voor de dag, waarop
      de aanvraag om toekenning dan wel voortzetting van de uitkering werd ingediend. Het Uitvoeringsinstituut
      werknemersverzekeringen kan voor bijzondere gevallen van de eerste zin afwijken.

      3 Toekenning van arbeidsongeschiktheidsuitkering vindt niet plaats, indien deze zou ingaan op of na de in
      [artikel 19, eerste lid, onderdeel a][ref1], bedoelde dag.


