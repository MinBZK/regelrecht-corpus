  - number: '37'
    text: Herziening dan wel heropening van de arbeidsongeschiktheidsuitkering vindt op aanvraag of ambtshalve plaats.
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel37
  - number: '38'
    text: |-
      1 De herziening van de arbeidsongeschiktheidsuitkering gaat in op de dag, waarop de verzekerde op grond van deze
      wet voor een hogere of lagere uitkering in aanmerking komt.

      2 Met betrekking tot de herziening van de arbeidsongeschiktheidsuitkering, die een verhoging van die uitkering
      tot gevolg heeft, alsmede met betrekking tot de heropening van de uitkering is [artikel 36, tweede lid][ref1], van
      overeenkomstige toepassing.

      3 De herziening van een arbeidsongeschiktheidsuitkering ter zake van afneming van de arbeidsongeschiktheid gaat in
      op de dag, aangegeven in de daartoe strekkende beschikking van het Uitvoeringsinstituut werknemersverzekeringen.

      4 Indien de herziening van de arbeidsongeschiktheidsuitkering verband houdt met een voltooide scholing of
      opleiding, gaat deze herziening niet eerder in dan een jaar na voltooiing van die scholing of opleiding. Indien de
      verzekerde eerder inkomsten uit arbeid verwerft, is [artikel 58, eerste lid][ref2], tot uiterlijk het einde van dat
      jaar van overeenkomstige toepassing.

      5 De heropening van de uitkering, bedoeld in [artikel 21][ref3], gaat in op de dag, met ingang waarvan de
      betrokkene weer arbeidsongeschikt is geworden.

      6 Heropening van de arbeidsongeschiktheidsuitkering vindt niet plaats, indien deze zou ingaan op of na de in
      [artikel 19, eerste lid, onderdeel a][ref4], bedoelde dag.


