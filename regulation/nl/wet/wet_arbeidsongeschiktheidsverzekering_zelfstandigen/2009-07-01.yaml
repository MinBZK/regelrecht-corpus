  - number: '65'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij is vastgesteld dat onverschuldigd is betaald.
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel65
  - number: 65a
    text: |-
      1 In afwijking van [artikel 63, eerste lid][ref1], kan het Uitvoeringsinstituut werknemersverzekeringen, op verzoek
      van de belanghebbende, besluiten gedeeltelijk van terugvordering of gedeeltelijk van verdere terugvordering af te
      zien door medewerking aan een schuldregeling, indien:

      a. redelijkerwijs te voorzien is dat de belanghebbende niet zal kunnen voortgaan met het betalen van zijn schulden
      of indien hij in de toestand verkeert dat hij heeft opgehouden te betalen;

      b. redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde vorderingen, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen;

      c. de vordering van het Uitvoeringsinstituut werknemersverzekeringen wegens onverschuldigd betaalde uitkering ten
      minste zal worden voldaan naar evenredigheid met de vorderingen van de schuldeisers van gelijke rang;

      d. een naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen betrouwbare
      schuldregeling tot stand is gekomen door tussenkomst van een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref2];

      e. aannemelijk is dat medewerking aan een schuldregeling niet concurrentieverstorend werkt; en

      f. uitdeling in het kader van de schuldregeling plaatsvindt overeenkomstig
      [artikel 349 van de Faillissementswet][ref3].

      2 Het eerste lid is niet van toepassing indien een vordering is ontstaan door het niet nakomen door
      de belanghebbende van de verplichting, bedoeld in [artikel 70][ref4], en hiervoor een boete als
      bedoeld in [artikel 48][ref5] is opgelegd, dan wel indien hiervoor aangifte is gedaan op grond van het
      [Wetboek van Strafrecht][ref6].

      3 Het besluit tot het afzien van terugvordering of van verdere terugvordering wordt ingetrokken of ten nadele van
      belanghebbende gewijzigd indien:

      a. niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling tot stand is gekomen die
      voldoet aan de eisen, bedoeld in het eerste lid;

      b. de belanghebbende zijn schuld aan het Uitvoeringsinstituut werknemersverzekeringen niet overeenkomstig de
      schuldregeling voldoet; of

      c. onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een
      ander besluit zou hebben geleid.

      4 Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld ten aanzien van de
      bevoegdheid om mee te werken aan schuldregelingen.


