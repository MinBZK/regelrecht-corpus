  - number: '61'
    text: |-
      1 Na het overlijden van de verzekerde, aan wie een arbeidsongeschiktheidsuitkering is toegekend, wordt met ingang
      van de dag na het overlijden, de uitkering in de vorm van een overlijdensuitkering betaald:

      a. aan de langstlevende van de echtgenoten;

      b. bij ontstentenis van de in onderdeel *a* bedoelde persoon, de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;

      c. bij ontstentenis van de in de onderdelen *a* en *b* bedoelde personen degenen ten aanzien van wie de overledene
      grotendeels in de kosten van bestaan voorzag en met wie hij in gezinsverband leefde.

      2 Met de verzekerde aan wie een arbeidsongeschiktheidsuitkering is toegekend, wordt voor de toepassing van dit
      artikel gelijkgesteld, de persoon wiens overlijden heeft plaatsgevonden in de maand waarin hij de leeftijd van 65
      jaar zou hebben bereikt, doch voor het bereiken van deze leeftijd is overleden, en die uitsluitend op grond van
      [artikel 19, eerste lid, onderdeel a][ref1], over de dag van zijn overlijden geen recht op uitkering had.

      3 De overlijdensuitkering is gelijk aan het bedrag van de uitkering over één maand, doch niet over de zaterdagen
      en de zondagen, berekend naar de hoogte van die uitkering op de dag of laatstelijk voor de dag van overlijden van
      de verzekerde.

      4 In verband met het overlijden van de verzekerde aan wie een uitkering is toegekend, is
      [artikel 19, eerste lid, onderdeel a][ref2] niet van toepassing.

      5 De overlijdensuitkering wordt op aanvraag aan de rechthebbende of rechthebbenden, bedoeld in het eerste lid, door
      het Uitvoeringsinstituut werknemersverzekeringen betaald.

      6 De overlijdensuitkering wordt in een bedrag ineens betaald.

      7 Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan arbeidsongeschiktheidsuitkering dat
      over na het overlijden gelegen dagen reeds is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel19
