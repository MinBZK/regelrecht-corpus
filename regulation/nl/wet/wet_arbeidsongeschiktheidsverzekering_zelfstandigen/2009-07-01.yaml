  - number: '2'
    text: |-
      1 Arbeidsongeschikt, geheel of gedeeltelijk, is de persoon die als rechtstreeks en objectief medisch vast te
      stellen gevolg van ziekte, gebreken, zwangerschap of bevalling geheel of gedeeltelijk niet in staat is om met
      arbeid te verdienen, hetgeen gezonde personen, met soortgelijke opleiding en ervaring, ter plaatse waar hij arbeid
      verricht of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen.

      2 De verzekerde die op en sedert het tijdstip dat zijn verzekering een aanvang neemt, reeds gedeeltelijk
      arbeidsongeschikt is in de zin van het eerste lid, wordt voor wat de door hem aan deze wet te ontlenen aanspraken
      betreft als geheel of gedeeltelijk arbeidsongeschikt aangemerkt, indien hij als rechtstreeks en objectief medisch
      vast te stellen gevolg van ziekte, gebreken, zwangerschap of bevalling geheel of gedeeltelijk niet in staat is om
      met arbeid te verdienen, hetgeen soortgelijke personen, die in dezelfde mate arbeidsongeschikt zijn in de zin van
      het eerste lid, ter plaatse waar hij arbeid verricht of het laatst heeft verricht, of in de omgeving daarvan, met
      arbeid gewoonlijk verdienen.

      3 Indien de bij de aanvang van de verzekering aanwezige arbeidsongeschiktheid in de zin van het eerste lid
      naderhand is afgenomen vindt het tweede lid vervolgens overeenkomstige toepassing, met dien verstande dat voor
      de aanvang van de verzekering in de plaats treedt het tijdstip waarop de arbeidsongeschiktheid in de zin van het
      eerste lid is afgenomen.

      4 Onder de in het eerste en tweede lid eerstgenoemde arbeid wordt verstaan alle algemeen geaccepteerde arbeid
      waartoe de verzekerde met zijn krachten en bekwaamheden in staat is.

      5 Bij de vaststelling van de mate van arbeidsongeschiktheid wordt buiten beschouwing gelaten of de verzekerde de
      arbeid feitelijk kan verkrijgen.

      6 Bij de toepassing van dit artikel wordt buiten beschouwing gelaten, hetgeen wordt of kan worden ontvangen voor
      arbeid verricht bij wijze van sociale werkvoorziening.

      7 Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot het eerste tot en met zesde lid nadere
      en zonodig afwijkende regels worden gesteld.

      8 Van een ontwerp van een besluit tot vaststelling, wijziging of intrekking van:

      a. een algemene maatregel van bestuur als bedoeld in het zevende lid;

      b. een krachtens de in onderdeel a bedoelde algemene maatregel van bestuur getroffen ministeriële regeling, wordt
      mededeling gedaan in de Staatscourant. Een voordracht tot vaststelling, wijziging of intrekking van een algemene
      maatregel van bestuur als bedoeld in onderdeel a, wordt niet gedaan en de vaststelling, wijziging of intrekking
      van een regeling als bedoeld in onderdeel b, geschiedt niet eerder dan nadat vier weken na die mededeling zijn
      verstreken.

      9 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent een afwijkende
      wijze van vaststelling van de mate van arbeidsongeschiktheid in gevallen waarin recht bestaat op een
      arbeidsongeschiktheidsuitkering en een uitkering inzake arbeidsongeschiktheid op grond van een andere wettelijke
      regeling ter verzekering tegen geldelijke gevolgen van langdurige arbeidsongeschiktheid.

      10 Bij de beoordeling van arbeidsongeschiktheid als bedoeld in deze wet maakt de verzekeringsarts zo veel
      mogelijk gebruik van de bij ministeriële regeling vastgelegde wetenschappelijke inzichten die de beoordeling van
      arbeidsongeschiktheid kunnen ondersteunen.
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel2
  - number: '3'
    text: |-
      1 Verzekerd op grond van deze wet is de persoon die vóór de inwerkingtreding van
      [artikel I, onderdeel C, van de Wet einde toegang verzekering WAZ][ref1] als zelfstandige, beroepsbeoefenaar of
      meewerkende echtgenoot arbeidsongeschikt is geworden:

      a. gedurende de periode waarover hij aanspraak maakt op een arbeidsongeschiktheidsuitkering in verband met die
      arbeidsongeschiktheid, doch uitsluitend omdat de wachttijd, bedoeld in [artikel 7, tweede lid][ref2], op hem van
      toepassing is, geen recht op arbeidsongeschiktheidsuitkering heeft;

      b. gedurende vier weken na afloop van de wachttijd, bedoeld in [artikel 7, tweede lid][ref3], betreffende die
      arbeidsongeschiktheid, indien hij na afloop van die wachttijd niet arbeidsongeschikt is, doch dat wel is binnen
      vier weken na afloop van die wachttijd;

      c. gedurende de periode waarover hij recht heeft op arbeidsongeschiktheidsuitkering in verband met die
      arbeidsongeschiktheid;

      d. gedurende de periode waarover hem een toelage als bedoeld in
      [artikel 28 van de Wet op de (re)integratie arbeidsgehandicapten][ref4] is toegekend in verband met die
      arbeidsongeschiktheid;

      e. gedurende het tijdvak van vier weken, bedoeld in [artikel 20, eerste lid][ref5], indien dat tijdvak is
      aangevangen vóór de inwerkingtreding van [artikel I, onderdeel C, van de Wet einde toegang verzekering WAZ][ref6].

      2 Niet verzekerd is de vreemdeling die niet rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref7].

      3 Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste en tweede lid, uitbreiding dan
      wel beperking worden gegeven aan de kring van verzekerden.

      4 Bij een algemene maatregel van bestuur als bedoeld in het derde lid, kan worden afgeweken van het tweede lid ten
      aanzien van:

      a. vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben verricht;

      b. vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref8], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref9].


