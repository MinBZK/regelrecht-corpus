  - number: '58'
    text: |-
      1 Indien verzekerde, die recht heeft op een arbeidsongeschiktheidsuitkering inkomsten uit arbeid geniet,
      wordt die arbeid gedurende een aaneengesloten tijdvak van vijf jaar, vanaf de eerste dag waarover de inkomsten
      uit arbeid worden genoten, niet aangemerkt als arbeid, bedoeld in [artikel 2, vierde lid][ref1], en wordt de
      arbeidsongeschiktheidsuitkering niet ingetrokken of herzien, doch wordt de uitkering:

      a. niet betaald, indien de inkomsten uit arbeid zodanig zijn, dat als die arbeid wel arbeid als bedoeld in
      [artikel 2, vierde lid][ref2], zou zijn, niet langer sprake zou zijn van arbeidsongeschiktheid van ten minste 25%;
      of

      b. indien onderdeel a niet van toepassing is, betaald tot een bedrag ter grootte van de
      arbeidsongeschiktheidsuitkering, zoals deze zou zijn vastgesteld, indien die arbeid wel arbeid als bedoeld in
      [artikel 2, vierde lid][ref3], zou zijn.

      Na afloop van het in de eerste zin genoemde tijdvak wordt de arbeid aangemerkt als arbeid, bedoeld in
      [artikel 2, vierde lid][ref4].

      2 Het in het eerste lid genoemde tijdvak van vijf jaar:

      a. wordt niet onderbroken indien gedurende perioden van korter dan vier weken geen inkomsten uit arbeid worden
      genoten;

      b. wordt, indien gedurende een periode van vier weken of langer geen inkomsten uit arbeid worden genoten,
      onderbroken indien vervolgens opnieuw inkomsten worden genoten uit dezelfde arbeid als de arbeid die werd verricht
      voor de onderbreking, met dien verstande dat het van de vijf jaar resterende tijdvak aanvangt vanaf het moment dat
      opnieuw de inkomsten uit die arbeid worden genoten.

      3 Indien de verzekerde die recht heeft op een arbeidsongeschiktheidsuitkering, inkomsten uit
      arbeid geniet ingevolge een arbeidsovereenkomst als bedoeld in de [hoofdstukken 2][ref5] en
      [3 van de Wet sociale werkvoorziening][ref6], vindt het tweede lid geen toepassing.

      4 Maandelijks wordt, wat betreft onderdeel b in afwijking van [paragraaf 5.3 van de Zorgverzekeringswet][ref7], aan
      ’s Rijks kas afgedragen het geraamde bedrag aan arbeidsongeschiktheidsuitkeringen die op grond van het derde lid
      niet worden uitbetaald wegens het genieten van dat loon, alsmede van de dientengevolge niet uitbetaalde vakantie-
      uitkeringen, vermeerderd met:

      a. het bedrag aan premies dat het Uitvoeringsinstituut werknemersverzekeringen bij uitbetaling op grond van enige
      wet over dat bedrag verschuldigd zou zijn en dat niet op de uitkeringen in mindering kan worden gebracht, en

      b. de op grond van [artikel 46 van de Zorgverzekeringswet][ref8] vergoede inkomensafhankelijke bijdrage, bedoeld in
      [artikel 41 van die wet][ref9], over dat bedrag.

      5 Bij ministeriële regeling worden regels gesteld met betrekking tot het eerste lid. Deze regels hebben in elk
      geval betrekking op de gelijkstelling van inkomsten in verband met arbeid met inkomsten als bedoeld in het eerste
      lid.

      6 Bij ministeriële regeling kan worden bepaald dat het tweede lid geen toepassing vindt ten aanzien van andere
      vormen van arbeid die de verzekerde gaat verrichten.


