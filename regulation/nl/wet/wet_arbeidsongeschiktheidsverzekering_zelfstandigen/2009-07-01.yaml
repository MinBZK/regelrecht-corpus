  - number: 55a
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van een arbeidsongeschiktheidsuitkering op
      indien de persoon aan wie de uitkering is toegekend een vreemdeling is die niet rechtmatig in Nederland verblijf
      houdt als bedoeld in [artikel 8 van de Vreemdelingenwet 2000][ref1].

      2 De betaling van een arbeidsongeschiktheidsuitkering wordt hervat indien de betrokkene daartoe een aanvraag
      indient en het Uitvoeringsinstituut werknemersverzekeringen is gebleken dat hij feitelijk buiten Nederland woont of
      verblijf houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel55a
