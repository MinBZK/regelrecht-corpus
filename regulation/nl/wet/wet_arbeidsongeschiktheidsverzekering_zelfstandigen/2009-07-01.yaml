        artikel: '7'
  - number: 67e
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen kan, in het kader van de bevordering van de inschakeling in de
      arbeid, toestemming verlenen aan de verzekerde, die recht heeft op een arbeidsongeschiktheidsuitkering om op een
      proefplaats bij een werkgever gedurende maximaal drie maanden onbeloonde werkzaamheden te verrichten.

      2 Tijdens het verrichten van werkzaamheden op een proefplaats als bedoeld in het eerste lid wordt de
      arbeidsongeschiktheidsuitkering niet ingetrokken of herzien.

      3 De onbeloonde werkzaamheden op een proefplaats als bedoeld in het eerste lid zijn:

      a. werkzaamheden, waartoe de verzekerde, bedoeld in het eerste lid, met zijn krachten en bekwaamheden in staat is;

      b. werkzaamheden, waarbij de werkgever, bij wie de proefplaatsing geschiedt, een aansprakelijkheids- en
      ongevallenverzekering ten behoeve van de verzekerde, bedoeld in het eerste lid, heeft afgesloten;

      c. werkzaamheden, die de verzekerde, bedoeld in het eerste lid, niet reeds eerder onbeloond op een proefplaats bij
      die werkgever of diens rechtsvoorganger heeft verricht; en

      d. werkzaamheden, waarbij er, naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen, een reëel
      uitzicht is op een op de onbeloonde werkzaamheden aansluitende dienstbetrekking van dezelfde of grotere omvang voor
      ten minste 6 maanden.

      4 Indien de werkzaamheden, bedoeld in het eerste lid, wegens ziekte worden onderbroken, wordt de periode waarin een
      uitkering bij ziekte wordt ontvangen, voor de toepassing van dat lid buiten beschouwing gelaten.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel67e
  - number: 67f
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag aan de werkgever die met een persoon
      die recht heeft op een arbeidsongeschiktheidsuitkering en die een indicatiebeschikking heeft als bedoeld
      in het derde lid, een dienstbetrekking, niet zijnde een dienstbetrekking als bedoeld in [hoofdstuk 2][ref1]
      of [3 van de Wet sociale werkvoorziening][ref2], aangaat of is aangegaan na de inwerkingtreding van de
      [Wet stimulering arbeidsparticipatie][ref3], subsidie voor loonkosten verlenen indien de dienstbetrekking een
      overeengekomen duur van ten minste twaalf maanden heeft. De subsidie kan slechts worden verstrekt indien deze
      persoon op de eerste dag van de dienstbetrekking de leeftijd van 50 jaar niet heeft bereikt.

      2 Indien de dienstbetrekking, bedoeld in het eerste lid, een uitzendovereenkomst als bedoeld in
      [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref4] betreft, verstrekt het Uitvoeringsinstituut
      werknemersverzekeringen slechts subsidie indien de derde, in wiens opdracht de persoon die recht heeft op een
      arbeidsongeschiktheidsuitkering ter beschikking wordt gesteld om arbeid te verrichten, zich jegens de werkgever
      verplicht die persoon tenminste twaalf maanden arbeid te laten verrichten. Indien de uitzendovereenkomst binnen
      deze twaalf maanden wordt gevolgd door een dienstbetrekking bij de derde, voor ten minste de resterende duur van de
      twaalf maanden, kan het Uitvoeringsinstituut werknemersverzekeringen op aanvraag aan die derde loonkostensubsidie
      verstrekken voor maximaal de resterende duur van de twaalf maanden.

      3 Het Uitvoeringsinstituut werknemersverzekeringen kan van de persoon die recht heeft op een
      arbeidsongeschiktheidsuitkering vaststellen dat hij in aanmerking komt voor toepassing van het eerste lid, indien
      het Uitvoeringsinstituut werknemersverzekeringen van oordeel is dat met het oog op de inschakeling in de arbeid
      geen andere voorziening of instrument meer geschikt is. De vaststelling, bedoeld in de eerste zin, geschiedt bij
      indicatiebeschikking.

      4 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt de subsidie slechts:

      a. indien naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen reële behoefte bestaat aan de
      arbeid die op grond van de dienstbetrekking, bedoeld in het eerste lid, zal worden verricht en die arbeid geen
      additionele arbeid betreft;

      b. indien er naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen een reëel uitzicht is
      op continuering van de dienstbetrekking voor ten minste zes maanden na afloop van de periode waarover de
      loonkostensubsidie wordt verstrekt, dan wel op een op die dienstbetrekking aansluitende dienstbetrekking van
      dezelfde of grotere omvang voor ten minste zes maanden;

      c. indien ten behoeve van de persoon die recht heeft op een arbeidsongeschiktheidsuitkering in de vijf jaar
      voorafgaand aan de indicatiebeschikking, bedoeld in het derde lid, niet eerder loonkostensubsidie op grond van dit
      artikel of het Tijdelijk besluit brugbanen herbeoordeelden is verstrekt; en

      d. indien de persoon die recht heeft op een arbeidsongeschiktheidsuitkering in de zes maanden voorafgaand
      aan de indicatiebeschikking, bedoeld in het derde lid, geen werkzaamheden op een proefplaats als bedoeld in
      [artikel 67e][ref5] of [artikel 76a van de WW][ref6] heeft verricht.

      5 Onder additionele arbeid als bedoeld in het vierde lid, onderdeel a, wordt verstaan primair op de
      arbeidsinschakeling gerichte arbeid of het naast of in aanvulling op reguliere arbeid verrichten van werkzaamheden
      die niet leiden tot verdringing op de arbeidsmarkt.

      6 De subsidie bedraagt ten hoogste 50% van het wettelijk minimumloon, bedoeld in
      [artikel 8, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref7] of, indien het een werknemer
      jonger dan 23 jaar betreft, het voor zijn leeftijd geldende minimumloon, bedoeld in [artikel 7, derde lid][ref8],
      en [artikel 8, derde lid][ref9], van deze wet. Het bedrag, bedoeld in de eerste zin, wordt naar evenredigheid
      verminderd, indien de overeengekomen arbeidsduur korter is dan de normale arbeidsduur, bedoeld in
      [artikel 12 van laatstgenoemde wet][ref10].

      7 De subsidie kan voor maximaal twaalf maanden worden verstrekt.

      8 Indien de persoon, bedoeld in het eerste lid, ziekengeld ontvangt op grond van de [Ziektewet][ref11] wordt het,
      naar werkdagen herleide, aan de werkgever verstrekte subsidiebedrag, bedoeld in het eerste lid, verminderd met
      dit ziekengeld.

      9 Indien de dienstbetrekking, bedoeld in het eerste lid, is aangegaan alvorens een aanvraag om subsidie voor
      loonkosten met betrekking tot die dienstbetrekking wordt ingediend, wordt de aanvraag om subsidie uiterlijk binnen
      drie maanden na de eerste dag van het verrichten van arbeid ingediend.

      10 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot dit artikel, welke regels betrekking
      kunnen hebben op:

      a. nadere subsidievoorwaarden; en

      b. een subsidieplafond.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0025045
