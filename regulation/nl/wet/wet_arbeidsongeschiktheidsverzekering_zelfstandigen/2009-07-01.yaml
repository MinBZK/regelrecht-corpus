  - number: '47'
    text: |-
      1 Een maatregel als bedoeld in [artikel 45][ref1] of [46][ref2] wordt afgestemd op de ernst van de gedraging en de
      mate waarin de verzekerde de gedraging kan worden verweten. Van het opleggen van een maatregel wordt in elk geval
      afgezien, indien elke vorm van verwijtbaarheid ontbreekt.

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een maatregel als bedoeld in het
      eerste lid en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet tijdig nakomen van de
      verplichting, bedoeld in [artikel 70][ref3], indien het niet tijdig nakomen van de verplichting niet heeft geleid
      tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering, of ter zake van het zich niet houden aan het
      voorschrift, bedoeld in [artikel 35, vierde lid][ref4], tenzij het niet tijdig nakomen van de verplichting of het
      zich niet houden aan het voorschrift plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop
      eerder aan de werknemer een zodanige waarschuwing is gegeven.

      3 Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een maatregel indien daarvoor
      dringende redenen aanwezig zijn.

      4 Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een bestuurlijke boete als
      bedoeld in [artikel 48][ref5] wordt opgelegd.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste lid.


