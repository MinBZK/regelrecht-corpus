  - number: 54a
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen de verzekerde de uitkering tijdelijk of blijvend, geheel
      of gedeeltelijk heeft geweigerd dan wel hem een bestuurlijke boete heeft opgelegd, stelt het Uitvoeringsinstituut
      werknemersverzekeringen het reïntegratiebedrijf dat ten behoeve van die verzekerde werkzaamheden gericht
      op vergroting van de mogelijkheden tot het verrichten van arbeid of op inschakeling in arbeid verricht, van
      die beschikking in kennis voorzover dat noodzakelijk is voor de uitvoering van de werkzaamheden door het
      reïntegratiebedrijf.
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel54a
  - number: '55'
    text: |-
      1 De arbeidsongeschiktheidsuitkering wordt betaalbaar gesteld door het Uitvoeringsinstituut
      werknemersverzekeringen. De betaling geschiedt als regel in tijdvakken van een maand.

      2 Onverminderd het tweede lid, schort het Uitvoeringsinstituut werknemersverzekeringen de betaling van de
      arbeidsongeschiktheidsuitkering op of schorst het de betaling, indien het op grond van duidelijke aanwijzingen van
      oordeel is of het gegronde vermoeden heeft dat:

      a. het recht op uitkering niet of niet meer bestaat;

      b. recht op een lagere uitkering bestaat;

      c. de verzekerde of zijn wettelijke vertegenwoordiger een verplichting als bedoeld in [artikel 45][ref1],
      [46][ref2] of [70][ref3] niet of niet behoorlijk is nagekomen.

      3 Indien de arbeidsongeschiktheidsuitkering in het buitenland wordt uitbetaald:

      a. worden de daaraan verbonden kosten van overmaking op de uitkering in mindering gebracht; en

      b. geschiedt de betaling in afwijking van [artikel 4:89, derde lid, van de Algemene wet bestuursrecht][ref4] op het
      tijdstip waarop de rekening van de daartoe door de schuldeiser aangewezen bank wordt gecrediteerd.

      4 Wanneer de verzekerde, aan wie een arbeidsongeschiktheidsuitkering is toegekend, een ander machtigt om de
      uitkering in ontvangst te nemen, onderscheidenlijk een verleende machtiging intrekt, wordt daaraan gevolg gegeven
      met ingang van een betalingstijdvak, aanvangende na de dag waarop de machtiging wordt ingediend, onderscheidenlijk
      waarop van haar intrekking mededeling wordt gedaan, doch niet later dan de eerste dag van de tweede maand na de dag
      van indiening onderscheidenlijk de mededeling.

      5 Indien een reïntegratiebedrijf aan het Uitvoeringsinstituut werknemersverzekeringen heeft gemeld dat het
      gegronde vermoeden bestaat dat een persoon aan wie een uitkering is toegekend onvoldoende medewerking verleent
      aan de op hem betrekking hebbende werkzaamheden van het reïntegratiebedrijf, neemt het Uitvoeringsinstituut
      werknemersverzekeringen een besluit omtrent de gehele of gedeeltelijke opschorting of schorsing van de betaling van
      de uitkering aan die persoon voor de duur van ten hoogste acht weken.

      7 Het Uitvoeringsinstituut werknemersverzekeringen stelt het reïntegratiebedrijf in kennis van een besluit tot
      opschorting of schorsing als bedoeld in het zesde lid.


