  - number: 67g
    text: |-
      1 In afwijking van [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref1] en
      [artikel 30, eerste lid, onderdeel b, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] is
      [artikel 67f][ref3] van overeenkomstige toepassing met betrekking tot de persoon:

      a. wiens arbeidsongeschiktheidsuitkering is ingetrokken als gevolg van de toepassing van
      [artikel 35, vijfde lid][ref4], alsmede de persoon op wie [dat artikel][ref5], op grond van
      [artikel 2, tweede lid, van het Besluit eenmalige herbeoordelingen arbeidsongeschiktheidswetten][ref6], niet van
      toepassing is en wiens arbeidsongeschiktheidsuitkering is ingetrokken;

      b. die op de dag voorafgaand aan de eerste dag van de dienstbetrekking met betrekking waartoe loonkostensubsidie
      wordt aangevraagd, geen uitkering ontvangt op grond van een wet waaraan uitvoering wordt gegeven door het
      Uitvoeringsinstituut werknemersverzekeringen of de [Wet werk en bijstand][ref7]; en

      c. die op de dag voorafgaand aan de eerste dag van de dienstbetrekking met betrekking
      waartoe loonkostensubsidie wordt aangevraagd geen tegemoetkoming ontvangt op grond van de
      [Tijdelijke regeling inkomensgevolgen herbeoordeelde arbeidsongeschikten][ref8].

      2 De leeftijdsgrens, bedoeld in [artikel 67f, eerste lid][ref9], is niet van toepassing op deze persoon.


