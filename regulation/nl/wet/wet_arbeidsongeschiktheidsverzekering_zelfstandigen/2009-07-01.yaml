        artikel: 10a
  - number: '68'
    text: |-
      Bij de vaststelling van de schadevergoeding, waarop de verzekerde naar burgerlijk recht aanspraak kan maken ter
      zake van zijn arbeidsongeschiktheid, houdt de rechter rekening met de aanspraken, die hij op grond van deze wet
      heeft.
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel68
  - number: '69'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen heeft voor de op grond van deze wet gemaakte kosten verhaal
      op de persoon die in verband met het veroorzaken van arbeidsongeschiktheid jegens de verzekerde naar burgerlijk
      recht tot schadevergoeding is verplicht, doch ten hoogste tot het bedrag, waarvoor deze bij het ontbreken van de
      aanspraken krachtens deze wet naar burgerlijk recht aansprakelijk zou zijn, verminderd met een bedrag, gelijk aan
      dat van de schadevergoeding tot betaling waarvan de aansprakelijke persoon jegens de verzekerde naar burgerlijk
      recht is gehouden.

      2 Overeenkomstig door Onze Minister te stellen regels kan het Uitvoeringsinstituut werknemersverzekeringen in
      plaats van het bedrag van de periodieke verstrekkingen de contante waarde daarvan vorderen.

      3 De in het eerste lid bedoelde aansprakelijke is eveneens verplicht tot vergoeding van de door
      het Uitvoeringsinstituut werknemersverzekeringen gemaakte redelijke kosten ter nakoming van de
      verplichtingen tot inschakeling in de arbeid van de verzekerde, die op het Uitvoeringsinstituut
      werknemersverzekeringen rusten op grond van deze wet en de daarop berustende bepalingen alsmede de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] en de daarop berustende bepalingen. De aansprakelijke
      kan hetzelfde verweer voeren dat hem jegens de verzekerde ten dienste zou hebben gestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: '70'
    text: |-
      1 De verzekerde, diens wettelijke vertegenwoordiger alsmede de instelling, bedoeld in [artikel 57][ref1], waaraan
      arbeidsongeschiktheidsuitkering wordt betaald, zijn verplicht aan het Uitvoeringsinstituut werknemersverzekeringen,
      op zijn verzoek of onverwijld uit eigen beweging alle feiten en omstandigheden mee te delen, waarvan hun
      redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op uitkering, de hoogte van de
      uitkering, het geldend maken van het recht op uitkering of op het bedrag van de uitkering, dat wordt betaald.

      2 Op de verzekerde die aanspraak maakt op of recht heeft op vakantie-uitkering alsmede op diens wettelijke
      vertegenwoordiger, rusten overeenkomstige verplichtingen als omschreven in het eerste lid.

      3 De verzekerde aan wie een reïntegratie-instrument als bedoeld in [hoofdstuk 3A][ref2] is verstrekt of toegekend,
      of aan wie verstrekking of toekenning daarvan wordt overwogen, alsmede diens wettelijk vertegenwoordiger, zijn
      verplicht aan het Uitvoeringsinstituut werknemersverzekeringen op zijn verzoek of onverwijld uit eigen beweging
      alle feiten en omstandigheden mee te delen, waarvan hun redelijkerwijs duidelijk moet zijn dat zij van invloed
      kunnen zijn op de verstrekking of toekenning of op de duur of de hoogte van het reïntegratie-instrument.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Hoofdstuk3A
