  - number: 67b
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen kan aan de persoon die recht heeft op een
      arbeidsongeschiktheidsuitkering en die arbeid als zelfstandige verricht of gaat verrichten op aanvraag
      inkomenssuppletie toekennen, indien zijn inkomen uit het bedrijf of beroep lager is dan zijn resterende
      verdiencapaciteit.

      2 De inkomenssuppletie wordt verstrekt over perioden waarin het bedrijf of beroep wordt uitgeoefend, doch
      ten hoogste over een periode van vier jaar te rekenen vanaf de dag met ingang waarvan voor de eerste maal
      inkomenssuppletie is toegekend.

      3 De inkomenssuppletie wordt voor de toepassing van de wettelijke bepalingen inzake premieheffing aangemerkt als
      een uitkering op grond van deze wet.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de hoogte van de
      inkomenssuppletie.
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel67b
  - number: 67c
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld op grond
      waarvan het Uitvoeringsinstituut werknemersverzekeringen op aanvraag van de zelfstandige die een recht heeft op een
      arbeidsongeschiktheidsuitkering, in het kader van de bevordering en ondersteuning bij de inschakeling in de arbeid
      als zelfstandige aan die verzekerde voorzieningen kan verstrekken.
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel67c
  - number: 67d
    text: |-
      1 De zelfstandige die recht heeft op een arbeidsongeschiktheidsuitkering heeft recht op ondersteuning bij
      arbeidsinschakeling en, met inachtneming van de daarvoor geldende wettelijke bepalingen, op de naar het oordeel van
      het Uitvoeringsinstituut werknemersverzekeringen noodzakelijk geachte voorziening gericht op arbeidsinschakeling.

      2 Voor de toepassing van het eerste lid wordt voor personen die blijkens een indicatiebeschikking of
      herindicatiebeschikking tot de doelgroep behoren van de [Wet sociale werkvoorziening][ref1] onder een voorziening
      gericht op arbeidsinschakeling mede verstaan een voorziening gericht op het verkrijgen van arbeid in een
      dienstbetrekking als bedoeld in de [artikelen 2][ref2] en [7 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel67d
