  - number: '59'
    text: |-
      1 Indien ter zake van arbeidsongeschiktheid zowel recht ontstaat op herziening van de
      arbeidsongeschiktheidsuitkering in verband met de [artikelen 12 tot en met 17][ref1] als op een uitkering
      op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref2] uit hoofde van een dienstbetrekking die is
      aangevangen na het intreden van de arbeidsongeschiktheid op grond waarvan het recht is ontstaan op eerstbedoelde
      uitkering wordt de arbeidsongeschiktheidsuitkering uitbetaald voorzover deze de uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref3] overtreft, doch in elk geval uitbetaald tot de hoogte van het
      bedrag onmiddellijk voorafgaande aan de herziening.

      2 Voor de toepassing van het eerste lid wordt onder arbeidsongeschiktheidsuitkering en uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref4] tevens verstaan de vakantie-uitkering waarop uit hoofde van die
      uitkeringen recht bestaat, voorzover die vakantie-uitkering over dezelfde periode is berekend.

      3 Het eerste lid is niet van toepassing op de persoon die een uitkering ontvangt op grond van de vrijwillige
      verzekering als bedoeld in [paragraaf 2.2 van de Wet werk en inkomen naar arbeidsvermogen][ref5].

      4 Voor de toepassing van het eerste lid wordt als arbeidsongeschiktheidsuitkering van de verzekerde op wie
      [artikel 58][ref6] van toepassing is, in aanmerking genomen het bedrag van die uitkering nadat bedoeld artikel
      toepassing heeft gevonden.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld:

      a. met betrekking tot het eerste lid;

      b. ter voorkoming of beperking van samenloop van arbeidsongeschiktheidsuitkering met de in het eerste lid bedoelde
      uitkeringen in situaties waarin deze leden niet of onvoldoende voorzien.


