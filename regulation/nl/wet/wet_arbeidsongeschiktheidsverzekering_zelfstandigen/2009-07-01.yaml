    text: |-
      1 Onverminderd hetgeen overigens in deze wet is bepaald ter zake van herziening of intrekking van een beschikking
      tot toekenning van arbeidsongeschiktheidsuitkering, alsook ter zake van een weigering van een zodanige uitkering,
      herziet het Uitvoeringsinstituut werknemersverzekeringen een dergelijke beschikking of trekt het deze in:

      a. ter uitvoering van een beslissing als bedoeld in [artikel 11][ref1];

      b. indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 45][ref2], [46][ref3] of
      [70][ref4] heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van een uitkering;

      c. indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend;

      d. indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 45][ref5], [46][ref6] of
      [70][ref7] ertoe leidt dat niet kan worden vastgesteld of nog recht op uitkering bestaat.

      2 Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van herziening of intrekking als bedoeld in het eerste lid af te zien.

      3 Een besluit tot toekenning van loonsuppletie als bedoeld in [artikel 67a][ref8] en van inkomenssuppletie als
      bedoeld in [artikel 67b][ref9] wordt ingetrokken of herzien indien die loonsuppletie of de inkomenssuppletie ten
      onrechte of tot een te hoog bedrag is vastgesteld.


