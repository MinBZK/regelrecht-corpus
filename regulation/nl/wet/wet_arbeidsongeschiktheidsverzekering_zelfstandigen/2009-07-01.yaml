  - number: '95'
    text: |-
      1 Onverminderd [artikel 95a][ref1], worden de beschikkingen op grond van deze wet en de daarop berustende
      bepalingen gegeven binnen een redelijke termijn na ontvangst van de aanvraag.

      2 De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.

      3 Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.

      4 Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen acht weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel95a
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 95a
        hoofdstuk: '9'
  - number: 95a
    text: |-
      1 Een beschikking over het verzekerd zijn op grond van deze wet wordt gegeven binnen dertien weken na ontvangst van
      de aanvraag.

      2 Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen dertien weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.

      3 Indien een beschikking als bedoeld in het eerste lid om andere dan de in het tweede lid bedoelde redenen niet
      binnen dertien weken kan worden gegeven, wordt de aanvrager daarvan schriftelijk in kennis gesteld onder vermelding
      van een zo kort mogelijke termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel95a
  - number: 95b
    text: |-
      In afwijking van [artikel 7:3 van de Algemene wet bestuursrecht][ref1] kan van het horen van een belanghebbende
      worden afgezien indien de belanghebbende niet binnen een door het Uitvoeringsinstituut werknemersverzekeringen
      gestelde redelijke termijn, verklaart dat hij gebruik wil maken van het recht te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel73
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel95b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:3
  - number: '96'
    text: |-
      1 In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken na ontvangst van het bezwaarschrift.

      2 Indien bezwaar wordt gemaakt tegen een besluit waaraan een medische of arbeidskundige beoordeling ten grondslag
      ligt, beslist het Uitvoeringsinstituut werknemersverzekeringen binnen zeventien weken of, indien het advies vraagt
      aan een deskundige die niet onder zijn verantwoordelijkheid werkzaam is binnen een en twintig weken, na ontvangst
      van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel710
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:10
  - number: '97'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de behandeling van bezwaarschriften
      tegen besluiten, waaraan een medische of arbeidskundige beoordeling ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel97
  - number: '98'
    text: |-
      1 Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van de [artikelen 1, derde tot en met zevende lid][ref1], [3 tot en met 6][ref2]
      en de op die artikelen berustende bepalingen.

      2 Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven
      inzake beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats
      inneemt van een gerechtshof.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel98
