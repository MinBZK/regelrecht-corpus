  - number: '4'
    text: |-
      Zelfstandige is de persoon, jonger dan 65 jaar:

      a. die in Nederland woont en die winst uit onderneming geniet, tenzij hij de onderneming niet voor eigen rekening
      feitelijk drijft;

      b. die niet in Nederland woont en die winst uit Nederlandse onderneming geniet, tenzij hij de onderneming niet voor
      eigen rekening feitelijk drijft.
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel4
  - number: 4a
    text: |-
      1 De beschikking, bedoeld in [artikel 3.156 van de Wet inkomstenbelasting 2001][ref1], waarin de voordelen, die de
      belastingplichtige geniet of zal gaan genieten uit een arbeidsrelatie of uit arbeidsrelaties waarin sprake is van
      hetzelfde soort van werkzaamheden die onder overeenkomstige condities worden verricht, worden aangemerkt als winst
      uit een onderneming, heeft voor de termijn waarvoor deze beschikking geldt als gevolg dat de belastingplichtige,
      met betrekking tot die arbeidsrelaties, wordt aangemerkt als zelfstandige als bedoeld in [artikel 4][ref2].

      2 Indien de beschikking, bedoeld in het eerste lid, wordt herzien, laat dat het in het eerste lid bedoelde gevolg
      onverlet, voor de termijn waarvoor die beschikking gold.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.156
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel4
