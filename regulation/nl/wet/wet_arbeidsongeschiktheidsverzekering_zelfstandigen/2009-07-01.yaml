  - number: '50'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij de bestuurlijke boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel50
  - number: '53'
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de verzekerde of zijn wettelijke
      vertegenwoordiger wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel869
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:69
  - number: '54'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen verrekent de bestuurlijke boete met
      een uitkering op grond van deze wet, de [Werkloosheidswet][ref1], de [Ziektewet][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref6], de [Wet arbeid en zorg][ref7] of een toeslag op grond van
      de [Toeslagenwet][ref8], die de persoon aan wie een bestuurlijke boete is opgelegd ontvangt.

      2 De Sociale verzekeringsbank onderscheidenlijk de gemeente betaalt het bedrag van de bestuurlijke boete, zonder
      dat daarvoor een machtiging nodig is, op zijn verzoek aan het Uitvoeringsinstituut werknemersverzekeringen
      indien de persoon aan wie een bestuurlijke boete is opgelegd een uitkering ontvangt op grond van de
      [Algemene Ouderdomswet][ref9], de [Algemene nabestaanden wet][ref10], de [Wet werk en bijstand][ref11],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref12], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref13] of de
      [Wet werk en inkomen kunstenaars][ref14].

      3 De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref15] aan de raad voor de kinderbescherming
      toegekende bevoegdheid komt gelijkelijk toe aan het Uitvoeringsinstituut werknemersverzekeringen. Indien het
      Uitvoeringsinstituut werknemersverzekeringen gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het
      dwangbevel, in afwijking van [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref16], door middel van
      toezending per post aan de persoon aan wie de boete is opgelegd.

      4 Zolang de verzekerde of zijn wettelijke vertegenwoordiger zijn verplichting, bedoeld in
      [artikel 48, vierde lid][ref17], niet of niet behoorlijk nakomt:

      a. is het Uitvoeringsinstituut werknemersverzekeringen in afwijking van
      [artikel 4:93, derde lid, van de Algemene wet bestuursrecht][ref18] bevoegd tot verrekening van de bestuurlijke
      boete voor zover beslag op de vordering van de schuldeiser nietig zou zijn;

      b. geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref19], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref20], niet bij de invordering van een bestuurlijke boete bij
      dwangbevel.


