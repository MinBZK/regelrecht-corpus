  - number: '16'
    text: |-
      1 Ter zake van toeneming van de arbeidsongeschiktheid die intreedt binnen vijf jaar na de datum van toekenning
      of herziening van de arbeidsongeschiktheidsuitkering en die voortkomt uit dezelfde oorzaak als die waaruit
      de arbeidsongeschiktheid ter zake waarvan uitkering wordt genoten, is voortgekomen, vindt herziening van de
      arbeidsongeschiktheidsuitkering steeds plaats, zodra de toegenomen arbeidsongeschiktheid onafgebroken vier weken
      heeft geduurd.

      2 Voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste lid, worden perioden van toegenomen
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen
      of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering in verband met zwangerschap
      of bevalling op grond van [artikel 3:18][ref1] of [3:30, eerste lid, van de Wet arbeid en zorg][ref2] wordt
      genoten, tenzij de ongeschiktheid redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak.
      Bij de vaststelling van de eerstgenoemde periode van vier weken blijven perioden, waarin uitkering in verband met
      zwangerschap of bevalling op grond van [artikel 3:18][ref3] of [3:30, eerste lid, van de Wet arbeid en zorg][ref4]
      wordt genoten, buiten beschouwing.

      3 Dit artikel vindt geen toepassing, indien recht bestaat op herziening van de arbeidsongeschiktheidsuitkering op
      grond van [artikel 14][ref5] of [15, eerste lid, onderdelen a tot en met c, of derde lid][ref6].


