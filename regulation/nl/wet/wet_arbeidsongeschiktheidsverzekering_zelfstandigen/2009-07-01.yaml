  - number: '12'
    text: |-
      1 De arbeidsongeschiktheidsuitkering wordt herzien wanneer de verzekerde, aan wie zij is toegekend, op grond van
      deze wet voor een hogere of lagere uitkering in aanmerking komt.

      2 Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van de arbeidsongeschiktheidsuitkering
      plaats met inachtneming van de [artikelen 13 tot en met 16][ref1].

      3 De arbeidsongeschiktheidsuitkering van de verzekerde die deelneemt aan een voor hem gewenste opleiding of
      scholing, wordt gedurende deze opleiding of scholing niet herzien in verband met een daaruit voortvloeiende
      afneming van de arbeidsongeschiktheid, tenzij [artikel 9, derde lid][ref2], van toepassing is. Indien de
      verzekerde tijdens de opleiding of scholing inkomsten uit arbeid verwerft, is [artikel 58, eerste lid][ref3], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel13
