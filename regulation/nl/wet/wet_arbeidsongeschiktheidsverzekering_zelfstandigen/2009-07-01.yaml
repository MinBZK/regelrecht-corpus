  - number: '46'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig [artikel 45][ref1], indien de verzekerde:

      a. de door het Uitvoeringsinstituut werknemersverzekeringen of de door hem daartoe aangewezen deskundige krachtens
      [artikel 43][ref2] in het belang van een behandeling of genezing of tot behoud, herstel of bevordering van de
      mogelijkheid tot het verrichten van arbeid en tot registratie als werkzoekende bij het Uitvoeringsinstituut
      werknemersverzekeringen gegeven voorschriften zonder deugdelijke grond niet opvolgt;

      b. zich niet, zolang als het Uitvoeringsinstituut werknemersverzekeringen of de door hem daartoe aangewezen
      deskundige te kennen heeft gegeven dit noodzakelijk te achten, onder geneeskundige behandeling stelt of indien hij
      de voorschriften van de behandelende arts niet opvolgt;

      c. zich schuldig maakt aan gedragingen, waardoor zijn genezing wordt belemmerd of nalaat voldoende mee te werken om
      aanpassing aan zijn ziekte of gebrek te verkrijgen;

      d. de controlevoorschriften, bedoeld in [artikel 44][ref3], of de verplichting, bedoeld in
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4] niet of niet behoorlijk
      is nagekomen of de verplichting, bedoeld in [artikel 70][ref5], niet binnen de door het Uitvoeringsinstituut
      werknemersverzekeringen daarvoor vastgestelde termijn is nagekomen;

      e. zijn arbeidsongeschiktheid opzettelijk heeft veroorzaakt;

      f. zich niet houdt aan het voorschrift, bedoeld in [artikel 35, vierde lid][ref6];

      g. zonder redelijke gronden niet meewerkt aan een scholing of opleiding die wenselijk wordt geacht voor zijn
      inschakeling in de arbeid;

      h. indien de belanghebbende zonder redelijke gronden niet meewerkt aan het opstellen van de reïntegratievisie,
      bedoeld in [artikel 30a, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref7] of het
      reïntegratieplan, bedoeld in [artikel 30a, derde lid, van die wet][ref8];

      i. indien de belanghebbende de verplichtingen die zijn opgenomen in de reïntegratievisie bedoeld in
      [artikel 30a, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref9] of in het
      reïntegratieplan, bedoeld in [artikel 30a, derde lid, van die wet][ref10] niet of niet behoorlijk is nagekomen;

      j. indien de belanghebbende die bij deelname aan een reïntegratietraject zijn reïntegratieverplichtingen niet
      naleeft, de reden daarvan niet onmiddellijk aan het reïntegratiebedrijf heeft medegedeeld.

      2 Voor de toepassing van het eerste lid wordt niet als arbeid beschouwd arbeid op grond van een dienstbetrekking
      als bedoeld in [hoofdstuk 2][ref11] of [3 van de Wet sociale werkvoorziening][ref12].

      3 Het eerste lid, onderdeel g, is niet van toepassing op de verzekerde die blijkens een indicatiebeschikking of
      herindicatiebeschikking tot de doelgroep behoort van de [Wet sociale werkvoorziening][ref13].


