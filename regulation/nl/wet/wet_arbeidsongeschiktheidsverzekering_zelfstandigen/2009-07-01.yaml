  - number: 101a
    text: |-
      Arbeidsongeschiktheidsuitkeringen die zijn toegekend voor de inwerkingtreding van de Wet wijziging systematiek
      herbeoordelingen arbeidsongeschiktheidswetten worden geacht te zijn toegekend voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel101a
  - number: 101b
    text: |-
      De [artikelen 7a][ref1], [19a][ref2], en [21a][ref3], zijn niet van toepassing op de persoon die:

      a) op 31 december 1999 op grond van de [artikelen 7][ref4] dan wel [22][ref5] recht heeft op een
      arbeidsongeschiktheidsuitkering en op die dag niet in Nederland woont, en

      b) op 19 december 2005 dit recht op uitkering uitsluitend nog heeft op grond van [artikel 2 van de wet van
      9 december 2004](onbekend), houdende goedkeuring van het voornemen tot opzegging van het op 28 juni 1962 te
      Genève totstandgekomen Verdrag betreffende de gelijkheid van behandeling van eigen onderdanen en vreemdelingen met
      betrekking tot de sociale zekerheid (Verdrag Nr. 118 aangenomen door de Internationale Arbeidsconferentie in haar
      zesenveertigste zitting; Trb. 1962, 122 en Trb. 1964, 23) (Stb. 2004, 715).


