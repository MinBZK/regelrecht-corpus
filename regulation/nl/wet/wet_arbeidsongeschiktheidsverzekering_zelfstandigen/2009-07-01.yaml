  - number: '20'
    text: |-
      1 Indien de verzekerde:

      a. wiens arbeidsongeschiktheidsuitkering wegens afneming van arbeidsongeschiktheid op grond van
      [artikel 19, eerste lid, onderdeel b][ref1], is ingetrokken; of

      b. die aan het einde van de wachttijd, bedoeld in [artikel 7, tweede lid][ref2], ongeschikt is tot het
      verrichten van zijn arbeid wegens ziekte, gebreken, zwangerschap of bevalling, maar geen recht had op
      arbeidsongeschiktheidsuitkering omdat hij niet arbeidsongeschikt was;

      binnen vijf jaar na de datum van die intrekking dan wel binnen vijf jaar na het bereiken van het einde van die
      wachttijd arbeidsongeschikt wordt en deze arbeidsongeschiktheid voortkomt uit dezelfde oorzaak als die waaruit de
      arbeidsongeschiktheid ter zake waarvan de ingetrokken uitkering werd genoten dan wel als die op grond waarvan hij
      ongeschikt was tot het verrichten van zijn arbeid wegens ziekte, gebreken, zwangerschap of bevalling voortkomt,
      vindt toekenning van arbeidsongeschiktheidsuitkering steeds plaats, zodra die arbeidsongeschiktheid onafgebroken
      vier weken heeft geduurd.

      2 Voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen
      of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering in verband met zwangerschap
      of bevalling op grond van [artikel 3:18][ref3] of [3:30, eerste lid, van de Wet arbeid en zorg][ref4] wordt
      genoten, tenzij de ongeschiktheid redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak.
      Bij de vaststelling van de eerstgenoemde periode van vier weken blijven perioden, waarin uitkering in verband met
      zwangerschap of bevalling op grond van [artikel 3:18][ref5] of [3:30, eerste lid, van de Wet arbeid en zorg][ref6]
      wordt genoten, buiten beschouwing.

      3 Dit artikel vindt geen toepassing:

      a. indien op grond van [artikel 21][ref7] aanspraak bestaat op heropening van de arbeidsongeschiktheidsuitkering;
      of

      b. indien [artikel 29b van de Ziektewet][ref8] toepassing kan vinden, tenzij de toe te kennen
      arbeidsongeschiktheidsuitkering het ziekengeld overtreft.

      4 In de gevallen, waarin dit artikel toepassing vindt wordt de grondslag van de toe te kennen
      arbeidsongeschiktheidsuitkering niet lager gesteld dan de grondslag die voor de berekening van de laatstelijk
      ontvangen arbeidsongeschiktheidsuitkering in aanmerking werd genomen, dan wel de grondslag die in aanmerking zou
      zijn genomen, indien na het einde van de wachttijd, bedoeld in [artikel 7, eerste lid][ref9], recht zou hebben
      bestaan op een arbeidsongeschiktheidsuitkering, zoals die sinds de beëindiging van de uitkering onderscheidenlijk
      sinds het einde van die wachttijd op grond van [artikel 8][ref10] zou zijn herzien.

      5 [Artikel 7b][ref11] en de daarop berustende bepalingen zijn van overeenkomstige toepassing.


