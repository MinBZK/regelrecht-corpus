  - number: '15'
    text: |-
      1 Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering
      steeds plaats zodra de toeneming van de arbeidsongeschiktheid optreedt, indien deze intreedt:

      a. binnen vier weken na de dag, met ingang waarvan de arbeidsongeschiktheidsuitkering werd toegekend;

      b. binnen vier weken na de dag, met ingang waarvan de arbeidsongeschiktheidsuitkering wegens toegenomen
      arbeidsongeschiktheid werd herzien;

      c. binnen vier weken na de dag, met ingang waarvan de arbeidsongeschiktheidsuitkering, die voordien was berekend
      naar een arbeidsongeschiktheid van 80% of meer, wegens afneming van de arbeidsongeschiktheid is herzien naar een
      arbeidsongeschiktheid van minder dan 80%;

      d. binnen een bij ministeriële regeling aan te geven tijdvak in daarbij aan te wijzen gevallen.

      2 Indien de arbeidsongeschiktheidsuitkering werd toegekend, onderscheidenlijk wegens toegenomen
      arbeidsongeschiktheid werd herzien, met toepassing van [artikel 36, tweede lid][ref1], onderscheidenlijk
      [artikel 38, tweede lid][ref2], geldt met betrekking tot het eerste lid, onderdeel *a* en *b*, als dag met ingang
      waarvan de arbeidsongeschiktheidsuitkering werd toegekend onderscheidenlijk herzien de dag, met ingang waarvan
      die uitkering zou zijn toegekend, onderscheidenlijk zou zijn herzien, indien [artikel 36, tweede lid][ref3],
      onderscheidenlijk [artikel 38, tweede lid][ref4], geen toepassing zou hebben gevonden.

      3 Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering op
      grond van een herbeoordeling als bedoeld in [artikel 35, zesde lid][ref5], plaats met ingang van 22 februari 2007.

      4 Bij ministeriële regeling kunnen regels worden gesteld voor gevallen waarbij direct herziening van de
      arbeidsongeschiktheidsuitkering plaatsvindt. Op grond van deze regels kan bedoelde herziening slechts plaatsvinden
      ten behoeve van de verzekerde die bij hervatting van de arbeid in het bedrijfs- of beroepsleven winst of inkomsten
      geniet, die minder bedragen dan evenredig is aan zijn nog bestaande arbeidsgeschiktheid.


