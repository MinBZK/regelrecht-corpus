    text: |-
      1 Onvervreemdbaar en niet vatbaar voor verpanding en belening zijn:

      a. de arbeidsongeschiktheidsuitkering;

      b. de verhoging van de arbeidsongeschiktheidsuitkering, bedoeld in [artikel 10][ref1];

      c. de vakantie-uitkering;

      d. de loonsuppletie, bedoeld in [artikel 67a][ref2];

      e. de inkomenssuppletie, bedoeld in [artikel 67b][ref3];

      f. de voorzieningen, bedoeld in [artikel 67c][ref4].

      2 Volmacht tot ontvangst van een uitkering onder welke vorm of welke benaming ook verleend, is steeds herroepelijk.

      3 Elk beding, strijdig met dit artikel, is nietig.


