  - number: 3a
    text: |-
      Zo nodig in afwijking van [artikel 3][ref1] en de daarop berustende bepalingen:

      a. wordt als verzekerde aangemerkt de persoon van wie de verzekering op grond van deze wet voortvloeit uit de
      toepassing van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;

      b. wordt niet als verzekerde aangemerkt de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
