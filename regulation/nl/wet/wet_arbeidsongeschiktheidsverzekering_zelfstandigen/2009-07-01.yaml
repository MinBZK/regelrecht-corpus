  - number: '8'
    text: |-
      1 De arbeidsongeschiktheidsuitkering wordt berekend naar de grondslag.

      2 Voor de verzekerde, bedoeld in [artikel 4][ref1], is de grondslag:

      a. hetgeen hij in het boekjaar, onmiddellijk voorafgaande aan het intreden van zijn arbeidsongeschiktheid als
      zelfstandige gemiddeld per dag aan winst heeft genoten; of, indien dit leidt tot een hoger bedrag,

      b. hetgeen hij in de vijf boekjaren, onmiddellijk voorafgaande aan het intreden van zijn arbeidsongeschiktheid als
      zelfstandige gemiddeld per dag aan winst heeft genoten.

      3 Voor de verzekerde, bedoeld in [artikel 5][ref2], is de grondslag:

      a. hetgeen hij in het kalenderjaar onmiddellijk voorafgaande aan het intreden van zijn arbeidsongeschiktheid als
      beroepsbeoefenaar gemiddeld per dag aan inkomsten heeft genoten; of, indien dit leidt tot een hoger bedrag,

      b. hetgeen hij in de vijf kalenderjaren onmiddellijk voorafgaande aan het intreden van zijn arbeidsongeschiktheid
      als beroepsbeoefenaar gemiddeld per dag aan inkomsten heeft genoten.

      4 Voor de verzekerde, bedoeld in [artikel 6][ref3], is de grondslag hetgeen hij over een tijdvak, gelegen in de in
      het tweede lid genoemde perioden, op basis van de geleverde arbeidsinbreng gemiddeld per dag aan inkomsten geacht
      kan worden te hebben genoten.

      5 Indien de verzekerde, bedoeld in [artikel 4][ref4] en [6][ref5], tevens verzekerde is op grond van
      [artikel 5][ref6] wordt de grondslag bepaald op een bedrag dat de uitkomst vormt van de samentelling van de
      gemiddelde winst of inkomsten per dag als bedoeld in het tweede lid en vierde lid en de gemiddelde inkomsten per
      dag als bedoeld in het derde lid.

      6 Voor personen die op grond van [artikel 3, derde lid][ref7], zijn verzekerd kan bij of krachtens algemene
      maatregel van bestuur, zonodig in afwijking van het tweede tot en met vierde lid, een grondslag worden vastgesteld.

      7 De grondslag bedraagt ten hoogste het minimumloon.

      8 Onder het in het zevende lid bedoelde minimumloon wordt verstaan het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref8], gedeeld door 21,75,
      of, indien het een persoon jonger dan 23 jaar betreft, het minimumloon per maand dat voor zijn leeftijd geldt op
      grond van [artikel 7, derde lid][ref9], en [artikel 8, derde lid, van genoemde wet][ref10], gedeeld door 21,75.

      9 Indien het minimumloon wordt herzien wordt de grondslag, bedoeld in het tweede tot en met zesde lid naar
      evenredigheid herzien.

      10 Een herziening van de uitkering als gevolg van een herziening van de grondslag van het minimumloon vindt plaats
      zonder dat dit bij beschikking is vastgesteld.

      11 Het Uitvoeringsinstituut werknemersverzekeringen betaalt de herziene uitkering, bedoeld in het tiende lid, bij
      de eerstvolgende uitkeringsbetaling nadat de grondslag van het minimumloon is herzien.

      12 Indien de verzekerde die recht heeft op een arbeidsongeschiktheidsuitkering met ingang van
      dezelfde dag recht heeft op toekenning van een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref11] wordt het bedrag van de overeenkomstig het tweede tot en met
      zesde lid vastgestelde grondslag, doch ten hoogste het door Onze Minister in overeenstemming met Onze Minister van
      Financiën bij ministeriële regeling aan te wijzen bedrag, verminderd met een bedrag dat gelijk is aan het dagloon
      dat aan de arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref12] ten
      grondslag ligt.

      13 Indien de verzekerde die recht heeft op arbeidsongeschiktheidsuitkering bij het intreden van
      de arbeidsongeschiktheid tevens verzekerde was op grond van [artikel 3][ref13], [4][ref14] of
      [5 van de Wet op de arbeidsongeschiktheidsverzekering][ref15], wordt het bedrag van de overeenkomstig het
      tweede tot en met zesde lid vastgestelde grondslag, doch ten hoogste het door Onze Minister in overeenstemming
      met Onze Minister van Financiën bij ministeriële regeling aan te wijzen bedrag, verminderd met een bedrag dat
      gelijk is aan het loon dat hij als werknemer genoot, voor zover dat loon als dagloon aan de toekenning van een
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref16] ten grondslag
      ligt of zou liggen als hij bij het intreden van de arbeidsongeschiktheid tevens arbeidsongeschikt is in de zin van
      [die wet][ref17] dan wel arbeidsongeschikt zou zijn geworden in de zin van [die wet][ref18]. De eerste zin blijft
      buiten toepassing als [artikel 59, eerste of tweede lid][ref19], van toepassing is.

      14 Indien de verzekerde die recht heeft op arbeidsongeschiktheidsuitkering op de dag van het intreden
      van de arbeidsongeschiktheid recht had op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref20], ziekengeld op grond van de [Ziektewet][ref21], uitkering
      op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref22] of een uitkering op
      grond van de [Werkloosheidswet][ref23], wordt het bedrag van de overeenkomstig het tweede tot en met zesde lid
      vastgestelde grondslag, doch ten hoogste het door Onze Minister in overeenstemming met Onze Minister van Financiën
      bij ministeriële regeling aan te wijzen bedrag, verminderd met het bedrag van genoemde uitkering op grond van
      de [Wet op de arbeidsongeschiktheidsverzekering][ref24], de [Ziektewet][ref25], de [Wet arbeid en zorg][ref26]
      of de [Werkloosheidswet][ref27] waarop hij recht heeft op de dag voorafgaande aan het intreden van de
      arbeidsongeschiktheid. De eerste zin blijft buiten toepassing als [artikel 59, eerste of tweede lid][ref28], van
      toepassing is.

      15 Indien het in het twaalfde lid bedoelde dagloon, het in het dertiende lid bedoelde loon of het in het veertiende
      lid bedoelde bedrag van de uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref29], de
      [Ziektewet][ref30], de [Wet arbeid en zorg][ref31] of de [Werkloosheidswet][ref32], alsmede het in die leden
      genoemde bedrag van de overeenkomstig het tweede tot en met zesde lid vastgestelde grondslag lager is dan het
      minimumloon, bedoeld in het achtste lid, bedraagt de grondslag voor de arbeidsongeschiktheidsuitkering het
      minimumloon, verminderd met dat dagloon, loon of bedrag, tenzij de grondslag, berekend op grond van het tweede tot
      en met zesde lid tot een lager bedrag leidt, in welk geval laatstgenoemd bedrag als grondslag geldt.

      16 De toepassing van het twaalfde, dertiende en veertiende lid geldt onverminderd het zevende lid.

      17 Voor de toepassing van het twaalfde tot en met het veertiende lid wordt onder loon,
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref33],
      ziekengeld op grond van de [Ziektewet][ref34], uitkering op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref35] of uitkering op grond van de
      [Werkloosheidswet][ref36] tevens verstaan de vakantie-uitkering waarop uit hoofde van dat loon of die
      uitkering recht bestaat, voor zover die vakantie-uitkering over dezelfde periode is berekend. Voor de
      toepassing van het vijftiende lid wordt onder loon, arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref37], ziekengeld op grond van de [Ziektewet][ref38], uitkering op
      grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref39] of uitkering op grond van de
      [Werkloosheidswet][ref40] niet verstaan de vakantie-uitkering waarop uit hoofde van dat loon of die uitkering recht
      bestaat en wordt onder dagloon verstaan het dagloon maal 100/108.

      18 Het twaalfde tot en met vijftiende lid is niet van toepassing op de persoon
      die een uitkering ontvangt op grond van de vrijwillige verzekering, bedoeld in
      [hoofdstuk VI van de Wet op de arbeidsongeschiktheidsverzekering][ref41], [hoofdstuk IV van de Ziektewet][ref42]
      of [hoofdstuk III van de Werkloosheidswet][ref43]. Het veertiende en vijftiende lid is evenmin van toepassing op de
      persoon die op grond van [artikel 3:6, tweede lid, van de Wet arbeid en zorg][ref44] een uitkering ontvangt.

      19 Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld met
      betrekking tot de winst, de inkomsten en de periode waarover de winst en de inkomsten worden berekend, bedoeld in
      het tweede tot en met het zesde lid.

      20 Voor de toepassing van het twaalfde tot en met het vijftiende lid en het zeventiende lid wordt met een
      uitkering op grond van de [Werkloosheidswet][ref45] gelijkgesteld een uitkering ter zake van ontslag of
      werkloosheid, onder welke benaming dan ook, met uitzondering van een uitkering in verband met functioneel
      leeftijdsontslag of vrijwillig vervroegd uittreden, uit hoofde van een arbeidsverhouding als bedoeld in
      [artikel 1, onderdeel l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref46]. Dit lid vervalt
      op het tijdstip van aanvang van fase 3 van de [Wet overheidspersoneel onder de werknemersverzekeringen][ref47],
      bedoeld in [artikel 54 van die wet][ref48].


