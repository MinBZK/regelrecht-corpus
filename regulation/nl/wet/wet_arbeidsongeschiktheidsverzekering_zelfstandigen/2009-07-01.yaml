  - number: '19'
    text: |-
      1 Het recht op arbeidsongeschiktheidsuitkering eindigt:

      a. met ingang van de eerste dag van de maand, waarin de verzekerde de leeftijd van 65 jaar bereikt;

      b. wanneer de arbeidsongeschiktheid is geëindigd, of beneden 25% is gedaald, met ingang van de dag, aangegeven in
      de daartoe strekkende beschikking van het Uitvoeringsinstituut werknemersverzekeringen.

      2 De arbeidsongeschiktheidsuitkering van de verzekerde die deelneemt aan een voor hem gewenste opleiding of
      scholing, wordt gedurende deze opleiding of scholing niet ingetrokken in verband met een daaruit voortvloeiende
      afneming van de arbeidsongeschiktheid, tenzij artikel 9, derde lid, van toepassing is. Indien de verzekerde tijdens
      de opleiding of scholing inkomsten uit arbeid verwerft, is artikel 58, eerste lid, van overeenkomstige toepassing.

      3 Indien de intrekking van de arbeidsongeschiktheidsuitkering verband houdt met een voltooide scholing of
      opleiding, gaat deze intrekking niet eerder in dan een jaar na voltooiing van die scholing of opleiding. Indien de
      verzekerde eerder inkomsten uit arbeid verwerft, is artikel 58, eerste lid, tot uiterlijk het einde van dat jaar
      van overeenkomstige toepassing.

      4 Het recht op arbeidsongeschiktheidsuitkering eindigt, indien de verzekerde rechtens zijn vrijheid is ontnomen,
      vanaf de dag dat deze vrijheidsontneming één maand heeft geduurd.

      5 Voor de toepassing van het vierde lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met
      een onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0008656/2009-07-01#Artikel19
  - number: 19a
    text: |-
      1 Het recht op arbeidsongeschiktheidsuitkering eindigt indien de verzekerde niet meer in Nederland woont.

      2 [Artikel 7a, tweede, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7a
