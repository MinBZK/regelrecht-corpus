  - number: '48'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen legt een bestuurlijke boete op van ten hoogste € 2 269 ter
      zake van het niet of niet behoorlijk nakomen door de verzekerde of zijn wettelijke vertegenwoordiger van de
      verplichting, bedoeld in [artikel 70][ref1].

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een bestuurlijke boete als
      bedoeld in het eerste lid en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet
      of niet behoorlijk nakomen door de verzekerde of zijn wettelijk vertegenwoordiger van de verplichting, bedoeld
      in [artikel 70][ref2], indien dit niet heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van
      uitkering, tenzij het niet of niet behoorlijk nakomen van de verplichting plaatsvindt binnen een periode van twee
      jaar te rekenen vanaf de datum waarop eerder aan de werknemer een zodanige waarschuwing is gegeven.

      3 Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een bestuurlijke boete indien
      daarvoor dringende redenen aanwezig zijn.

      4 De persoon aan wie een bestuurlijke boete is opgelegd is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.

      5 Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel70
