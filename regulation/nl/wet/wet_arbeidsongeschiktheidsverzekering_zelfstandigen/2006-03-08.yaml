        hoofdstuk: '1'
  - number: '1.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
  - number: 1.2.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
  - number: 1.2.b
    text: 'echtgenoten: geregistreerde partners;'
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
  - number: 1.2.c
    text: 'gehuwd: als partner geregistreerd.'
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
  - number: '1.3'
    text: 'In deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
  - number: 1.3.a
    text: |-
      als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde meerderjarige
      een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
  - number: 1.3.b
    text: als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
  - number: '1.4'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
  - number: '1.5'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben in
      dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
  - number: 1.5.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
  - number: 1.5.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
  - number: 1.5.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
  - number: 1.5.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
  - number: '1.6'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vijfde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
  - number: '1.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
  - number: '2.1'
    text: |-
      Arbeidsongeschikt, geheel of gedeeltelijk, is de persoon die als rechtstreeks en objectief medisch vast te stellen
      gevolg van ziekte, gebreken, zwangerschap of bevalling geheel of gedeeltelijk niet in staat is om met arbeid te
      verdienen, hetgeen gezonde personen, met soortgelijke opleiding en ervaring, ter plaatse waar hij arbeid verricht
      of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel2
  - number: '2.2'
    text: |-
      De verzekerde die op en sedert het tijdstip dat zijn verzekering een aanvang neemt, reeds gedeeltelijk
      arbeidsongeschikt is in de zin van het eerste lid, wordt voor wat de door hem aan deze wet te ontlenen aanspraken
      betreft als geheel of gedeeltelijk arbeidsongeschikt aangemerkt, indien hij als rechtstreeks en objectief medisch
      vast te stellen gevolg van ziekte, gebreken, zwangerschap of bevalling geheel of gedeeltelijk niet in staat is om
      met arbeid te verdienen, hetgeen soortgelijke personen, die in dezelfde mate arbeidsongeschikt zijn in de zin van
      het eerste lid, ter plaatse waar hij arbeid verricht of het laatst heeft verricht, of in de omgeving daarvan, met
      arbeid gewoonlijk verdienen.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel2
  - number: '2.3'
    text: |-
      Indien de bij de aanvang van de verzekering aanwezige arbeidsongeschiktheid in de zin van het eerste lid naderhand
      is afgenomen vindt het tweede lid vervolgens overeenkomstige toepassing, met dien verstande dat voor de aanvang
      van de verzekering in de plaats treedt het tijdstip waarop de arbeidsongeschiktheid in de zin van het eerste lid
      is afgenomen.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel2
  - number: '2.4'
    text: |-
      Onder de in het eerste en tweede lid eerstgenoemde arbeid wordt verstaan alle algemeen geaccepteerde arbeid waartoe
      de verzekerde met zijn krachten en bekwaamheden in staat is.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel2
  - number: '2.5'
    text: |-
      Bij de vaststelling van de mate van arbeidsongeschiktheid wordt buiten beschouwing gelaten of de verzekerde de
      arbeid feitelijk kan verkrijgen.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel2
  - number: '2.6'
    text: |-
      Bij de toepassing van dit artikel wordt buiten beschouwing gelaten, hetgeen wordt of kan worden ontvangen voor
      arbeid verricht bij wijze van sociale werkvoorziening.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel2
  - number: '2.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot het eerste tot en met zesde lid nadere en
      zonodig afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel2
  - number: '2.8'
    text: 'Van een ontwerp van een besluit tot vaststelling, wijziging of intrekking van:'
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel2
  - number: 2.8.a
    text: een algemene maatregel van bestuur als bedoeld in het zevende lid;
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel2
  - number: 2.8.b
    text: |-
      een krachtens de in onderdeel a bedoelde algemene maatregel van bestuur getroffen ministeriële regeling, wordt
      mededeling gedaan in de Staatscourant. Een voordracht tot vaststelling, wijziging of intrekking van een algemene
      maatregel van bestuur als bedoeld in onderdeel a, wordt niet gedaan en de vaststelling, wijziging of intrekking
      van een regeling als bedoeld in onderdeel b, geschiedt niet eerder dan nadat vier weken na die mededeling zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel2
  - number: '2.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent een afwijkende
      wijze van vaststelling van de mate van arbeidsongeschiktheid in gevallen waarin recht bestaat op een
      arbeidsongeschiktheidsuitkering en een uitkering inzake arbeidsongeschiktheid op grond van een andere wettelijke
      regeling ter verzekering tegen geldelijke gevolgen van langdurige arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel2
  - number: '2.10'
    text: |-
      Bij de beoordeling van arbeidsongeschiktheid als bedoeld in deze wet maakt de verzekeringsarts zo veel mogelijk
      gebruik van de bij ministeriële regeling vastgelegde wetenschappelijke inzichten die de beoordeling van
      arbeidsongeschiktheid kunnen ondersteunen.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel2
  - number: '3.1'
    text: |-
      Verzekerd op grond van deze wet is de persoon die vóór de inwerkingtreding van
      [artikel I, onderdeel C, van de Wet einde toegang verzekering WAZ][ref1] als zelfstandige, beroepsbeoefenaar of
      meewerkende echtgenoot arbeidsongeschikt is geworden:


      [ref1]: https://wetten.overheid.nl/BWBR0016985#ArtikelI
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016985
        artikel: I
  - number: 3.1.a
    text: |-
      gedurende de periode waarover hij aanspraak maakt op een arbeidsongeschiktheidsuitkering in verband met die
      arbeidsongeschiktheid, doch uitsluitend omdat de wachttijd, bedoeld in [artikel 7, tweede lid][ref1], op hem van
      toepassing is, geen recht op arbeidsongeschiktheidsuitkering heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 3.1.b
    text: |-
      gedurende vier weken na afloop van de wachttijd, bedoeld in [artikel 7, tweede lid][ref1], betreffende die
      arbeidsongeschiktheid, indien hij na afloop van die wachttijd niet arbeidsongeschikt is, doch dat wel is binnen
      vier weken na afloop van die wachttijd;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 3.1.c
    text: |-
      gedurende de periode waarover hij recht heeft op arbeidsongeschiktheidsuitkering in verband met die
      arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel3
  - number: 3.1.d
    text: |-
      gedurende de periode waarover hem een toelage als bedoeld in
      [artikel 28 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] is toegekend in verband met die
      arbeidsongeschiktheid;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel28
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '28'
  - number: 3.1.e
    text: |-
      gedurende het tijdvak van vier weken, bedoeld in [artikel 20, eerste lid][ref1], indien dat tijdvak is aangevangen
      vóór de inwerkingtreding van [artikel I, onderdeel C, van de Wet einde toegang verzekering WAZ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0016985#ArtikelI
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0016985
        artikel: I
  - number: '3.2'
    text: |-
      Niet verzekerd is de vreemdeling die niet rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '3.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste en tweede lid, uitbreiding dan wel
      beperking worden gegeven aan de kring van verzekerden.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel3
  - number: '3.4'
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in het derde lid, kan worden afgeweken van het tweede lid ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel3
  - number: 3.4.a
    text: vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben verricht;
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel3
  - number: 3.4.b
    text: |-
      vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3a
    text: |-
      Zo nodig in afwijking van [artikel 3][ref1] en de daarop berustende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '3'
        hoofdstuk: '2'
  - number: 3a.a
    text: |-
      wordt als verzekerde aangemerkt de persoon van wie de verzekering op grond van deze wet voortvloeit uit de
      toepassing van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel3a
  - number: 3a.b
    text: |-
      wordt niet als verzekerde aangemerkt de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel3a
  - number: '4'
    text: 'Zelfstandige is de persoon, jonger dan 65 jaar:'
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel4
  - number: 4.a
    text: |-
      die in Nederland woont en die winst uit onderneming geniet, tenzij hij de onderneming niet voor eigen rekening
      feitelijk drijft;
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel4
  - number: 4.b
    text: |-
      die niet in Nederland woont en die winst uit Nederlandse onderneming geniet, tenzij hij de onderneming niet voor
      eigen rekening feitelijk drijft.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel4
  - number: 4a.1
    text: |-
      De beschikking, bedoeld in [artikel 3.156 van de Wet inkomstenbelasting 2001][ref1], waarin de voordelen, die de
      belastingplichtige geniet of zal gaan genieten uit een arbeidsrelatie of uit arbeidsrelaties waarin sprake is van
      hetzelfde soort van werkzaamheden die onder overeenkomstige condities worden verricht, worden aangemerkt als winst
      uit een onderneming, heeft voor de termijn waarvoor deze beschikking geldt als gevolg dat de belastingplichtige,
      met betrekking tot die arbeidsrelaties, wordt aangemerkt als zelfstandige als bedoeld in [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel4
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '4'
        hoofdstuk: '2'
  - number: 4a.2
    text: |-
      Indien de beschikking, bedoeld in het eerste lid, wordt herzien, laat dat het in het eerste lid bedoelde gevolg
      onverlet, voor de termijn waarvoor die beschikking gold.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel4a
  - number: '5'
    text: 'Beroepsbeoefenaar is de persoon, jonger dan 65 jaar, die:'
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel5
  - number: 5.a
    text: anders dan uit dienstbetrekking inkomsten uit tegenwoordige arbeid geniet;
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel5
  - number: 5.b
    text: |-
      anders dan in dienstbetrekking arbeid verricht ten behoeve van een lichaam waarin hij een aanmerkelijk belang
      heeft.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel5
  - number: '6'
    text: |-
      Meewerkende echtgenoot is de persoon jonger dan 65 jaar die anders dan in dienstbetrekking, als zelfstandige of als
      beroepsbeoefenaar, meewerkt in de onderneming van zijn echtgenoot.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel6
  - number: '7.1'
    text: |-
      Recht op arbeidsongeschiktheidsuitkering heeft de verzekerde die arbeidsongeschikt wordt indien hij in de
      52 weken onmiddellijk voorafgaande aan de dag, waarop de arbeidsongeschiktheid is ingetreden, arbeid in het
      bedrijfs- of beroepsleven heeft verricht gericht op het verwerven van winst of inkomsten. Als eerste dag van
      de arbeidsongeschiktheid geldt de eerste werkdag waarop wegens ziekte niet is gewerkt of het werken tijdens de
      werktijd is gestaakt. Bij ministeriële regeling kunnen nadere en afwijkende regels worden gesteld in verband met
      het voor bijzondere gevallen vaststellen van welke dag als eerste werkdag wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7
  - number: '7.2'
    text: |-
      Het recht op arbeidsongeschiktheidsuitkering gaat niet eerder in dan nadat de arbeidsongeschiktheid onafgebroken 52
      weken heeft geduurd en na afloop van dat tijdvak voortduurt.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7
  - number: '7.3'
    text: |-
      Voor het bepalen van het tijdvak van 52 weken, bedoeld in het tweede lid, worden perioden van arbeidsongeschiktheid
      samengeteld, indien zij elkaar met onderbreking van minder dan vier weken opvolgen of indien zij direct
      voorafgaan aan en aansluiten op een periode waarin uitkering in verband met zwangerschap of bevalling op grond van
      [artikel 3:18][ref1] of [3:30, eerste lid, van de Wet arbeid en zorg][ref2] wordt genoten, tenzij de ongeschiktheid
      redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '7.4'
    text: |-
      Recht op arbeidsongeschiktheidsuitkering heeft eveneens de verzekerde die na afloop van het in het tweede lid
      bedoelde tijdvak van 52 weken niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval is binnen vier
      onafgebroken weken na afloop van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7
  - number: '7.5'
    text: |-
      Voor het bepalen van het tijdvak van 52 weken, bedoeld in het tweede lid, worden steeds in aanmerking genomen
      tijdvakken, gedurende welke de verzekerde recht zou hebben gehad op ziekengeld op grond van de [Ziektewet][ref1],
      indien hij op grond van die wet zou zijn verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '7.6'
    text: |-
      Voor de toepassing van het eerste tot en met vierde lid wordt niet als arbeidsongeschikt beschouwd de verzekerde
      die minder dan 25% arbeidsongeschikt is alsmede de verzekerde die een uitkering geniet als bedoeld in het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7
  - number: 7a.1
    text: |-
      De verzekerde, bedoeld in [artikel 7][ref1], heeft geen recht op arbeidsongeschiktheidsuitkering, indien de dag
      waarop het recht op arbeidsongeschiktheidsuitkering zou ingaan, is gelegen in een periode dat hij niet in Nederland
      woont.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7a.2
    text: |-
      Het eerste lid is niet van toepassing indien de verzekerde op die dag woont in een land waarin op grond van een
      verdrag of een besluit van een volkenrechtelijke organisatie recht op arbeidsongeschiktheidsuitkering kan bestaan.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7a
  - number: 7a.3
    text: |-
      De persoon, die op grond van het eerste lid geen recht op arbeidsongeschiktheidsuitkering heeft, heeft vanaf de
      dag:
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7a
  - number: 7a.3.a
    text: dat hij in Nederland woont; of
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7a
  - number: 7a.3.b
    text: |-
      dat hij in een land woont waarmee een verdrag in werking is getreden dan wel een besluit van een volkenrechtelijke
      organisatie van kracht is geworden, op grond waarvan recht op arbeidsongeschiktheidsuitkering kan bestaan;
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7a
  - number: 7a.4
    text: |-
      De persoon, bedoeld in het derde lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten aanzien
      van wie dat wel het geval is binnen vier weken na die dag, heeft met inachtneming van de bepalingen van deze wet
      recht op toekenning van arbeidsongeschiktheidsuitkering. [Artikel 7, zesde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het eerste lid afwijkende regels worden
      gesteld ten gunste van:
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7a
  - number: 7a.5.a
    text: de verzekerde, die tevens werkzaamheden verricht in het algemeen belang en niet in Nederland woont;
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7a
  - number: 7a.5.b
    text: de verzekerde, die in de Nederlandse Antillen of Aruba woont; of
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7a
  - number: 7a.5.c
    text: de gezinsleden van de in de onderdelen a of b bedoelde verzekerde.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7a
  - number: 7a.6
    text: |-
      Onze Minister deelt mede in welke landen op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op arbeidsongeschiktheidsuitkering kan bestaan. In deze mededeling wordt tevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7a
  - number: 7a.6.a
    text: de vindplaats van het desbetreffende verdrag of besluit, en
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7a
  - number: 7a.6.b
    text: de eventueel in dat verdrag of besluit aanwezige beperkingen.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7a
  - number: 7b.1
    text: |-
      De verzekerde, bedoeld in [artikel 7][ref1], heeft geen recht op arbeidsongeschiktheidsuitkering indien de dag
      waarop het recht op arbeidsongeschiktheidsuitkering zou ingaan, is gelegen in een periode dat hem rechtens zijn
      vrijheid is ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7b.2
    text: |-
      De persoon, die op grond van het eerste lid geen recht op arbeidsongeschiktheidsuitkering heeft, heeft
      vanaf de dag dat hij in vrijheid wordt gesteld met inachtneming van de bepalingen van deze wet recht op
      arbeidsongeschiktheidsuitkering, indien hij op die dag arbeidsongeschikt is. [Artikel 7, zesde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7b.3
    text: |-
      Voor de toepassing van het eerste lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7b
  - number: 7b.4
    text: |-
      De persoon, bedoeld in het tweede lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten
      aanzien van wie dit wel het geval is binnen vier weken na die dag, heeft met inachtneming van de bepalingen
      van deze wet recht op toekenning van arbeidsongeschiktheidsuitkering. [Artikel 7, zesde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7b.5
    text: |-
      Het eerste lid is niet van toepassing en het tweede en vierde lid zijn van overeenkomstige toepassing op bij
      algemene maatregel van bestuur aan te wijzen categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf
      of vrijheidsbenemende maatregel buiten een justitiële inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel7b
  - number: '8.1'
    text: De arbeidsongeschiktheidsuitkering wordt berekend naar de grondslag.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
  - number: '8.2'
    text: |-
      Voor de verzekerde, bedoeld in [artikel 4][ref1], is de grondslag:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel4
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '4'
        hoofdstuk: '2'
  - number: 8.2.a
    text: |-
      hetgeen hij in het boekjaar, onmiddellijk voorafgaande aan het intreden van zijn arbeidsongeschiktheid als
      zelfstandige gemiddeld per dag aan winst heeft genoten; of, indien dit leidt tot een hoger bedrag,
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
  - number: 8.2.b
    text: |-
      hetgeen hij in de vijf boekjaren, onmiddellijk voorafgaande aan het intreden van zijn arbeidsongeschiktheid als
      zelfstandige gemiddeld per dag aan winst heeft genoten.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
  - number: '8.3'
    text: |-
      Voor de verzekerde, bedoeld in [artikel 5][ref1], is de grondslag:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel5
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '5'
        hoofdstuk: '2'
  - number: 8.3.a
    text: |-
      hetgeen hij in het kalenderjaar onmiddellijk voorafgaande aan het intreden van zijn arbeidsongeschiktheid als
      beroepsbeoefenaar gemiddeld per dag aan inkomsten heeft genoten; of, indien dit leidt tot een hoger bedrag,
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
  - number: 8.3.b
    text: |-
      hetgeen hij in de vijf kalenderjaren onmiddellijk voorafgaande aan het intreden van zijn arbeidsongeschiktheid als
      beroepsbeoefenaar gemiddeld per dag aan inkomsten heeft genoten.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
  - number: '8.4'
    text: |-
      Voor de verzekerde, bedoeld in [artikel 6][ref1], is de grondslag hetgeen hij over een tijdvak, gelegen in de in
      het tweede lid genoemde perioden, op basis van de geleverde arbeidsinbreng gemiddeld per dag aan inkomsten geacht
      kan worden te hebben genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel6
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '6'
        hoofdstuk: '2'
  - number: '8.5'
    text: |-
      Indien de verzekerde, bedoeld in [artikel 4][ref1] en [6][ref2], tevens verzekerde is op grond van
      [artikel 5][ref3] wordt de grondslag bepaald op een bedrag dat de uitkomst vormt van de samentelling van de
      gemiddelde winst of inkomsten per dag als bedoeld in het tweede lid en vierde lid en de gemiddelde inkomsten per
      dag als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel5
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '5'
        hoofdstuk: '2'
  - number: '8.6'
    text: |-
      Voor personen die op grond van [artikel 3, derde lid][ref1], zijn verzekerd kan bij of krachtens algemene maatregel
      van bestuur, zonodig in afwijking van het tweede tot en met vierde lid, een grondslag worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '3'
        hoofdstuk: '2'
  - number: '8.7'
    text: De grondslag bedraagt ten hoogste het minimumloon.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
  - number: '8.8'
    text: |-
      Onder het in het zevende lid bedoelde minimumloon wordt verstaan het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1], gedeeld door 21,75,
      of, indien het een persoon jonger dan 23 jaar betreft, het minimumloon per maand dat voor zijn leeftijd geldt op
      grond van [artikel 7, derde lid][ref2], en [artikel 8, derde lid, van genoemde wet][ref3], gedeeld door 21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '8.9'
    text: |-
      Indien het minimumloon wordt herzien wordt de grondslag, bedoeld in het tweede tot en met zesde lid naar
      evenredigheid herzien.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
  - number: '8.10'
    text: |-
      Op een beschikking als gevolg van een herziening van de grondslag op grond van het negende lid zijn de
      [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '8.11'
    text: |-
      Indien de verzekerde die recht heeft op een arbeidsongeschiktheidsuitkering met ingang van
      dezelfde dag recht heeft op toekenning van een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt het bedrag van de overeenkomstig het tweede tot en met
      zesde lid vastgestelde grondslag, doch ten hoogste het door Onze Minister in overeenstemming met Onze Minister van
      Financiën bij ministeriële regeling aan te wijzen bedrag, verminderd met een bedrag dat gelijk is aan het dagloon
      dat aan de arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2] ten
      grondslag ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002524
  - number: '8.12'
    text: |-
      Indien de verzekerde die recht heeft op arbeidsongeschiktheidsuitkering bij het intreden van
      de arbeidsongeschiktheid tevens verzekerde was op grond van [artikel 3][ref1], [4][ref2] of
      [5 van de Wet op de arbeidsongeschiktheidsverzekering][ref3], wordt het bedrag van de overeenkomstig het tweede
      tot en met zesde lid vastgestelde grondslag, doch ten hoogste het door Onze Minister in overeenstemming met
      Onze Minister van Financiën bij ministeriële regeling aan te wijzen bedrag, verminderd met een bedrag dat
      gelijk is aan het loon dat hij als werknemer genoot, voor zover dat loon als dagloon aan de toekenning van een
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref4] ten grondslag
      ligt of zou liggen als hij bij het intreden van de arbeidsongeschiktheid tevens arbeidsongeschikt is in de zin van
      [die wet][ref5] dan wel arbeidsongeschikt zou zijn geworden in de zin van [die wet][ref6]. De eerste zin blijft
      buiten toepassing als [artikel 59, eerste of tweede lid][ref7], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0002524
      [ref6]: https://wetten.overheid.nl/BWBR0002524
      [ref7]: https://wetten.overheid.nl/BWBR0008656#Artikel59
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0002524
      - id: ref6
        bwb_id: BWBR0002524
      - id: ref7
        bwb_id: BWBR0008656
        artikel: '59'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '8.13'
    text: |-
      Indien de verzekerde die recht heeft op arbeidsongeschiktheidsuitkering op de dag van het intreden
      van de arbeidsongeschiktheid recht had op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], ziekengeld op grond van de [Ziektewet][ref2], uitkering op
      grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref3] of een uitkering op grond van
      de [Werkloosheidswet][ref4], wordt het bedrag van de overeenkomstig het tweede tot en met zesde lid vastgestelde
      grondslag, doch ten hoogste het door Onze Minister in overeenstemming met Onze Minister van Financiën bij
      ministeriële regeling aan te wijzen bedrag, verminderd met het bedrag van genoemde uitkering op grond van
      de [Wet op de arbeidsongeschiktheidsverzekering][ref5], de [Ziektewet][ref6], de [Wet arbeid en zorg][ref7]
      of de [Werkloosheidswet][ref8] waarop hij recht heeft op de dag voorafgaande aan het intreden van de
      arbeidsongeschiktheid. De eerste zin blijft buiten toepassing als [artikel 59, eerste of tweede lid][ref9], van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0002524
      [ref6]: https://wetten.overheid.nl/BWBR0001888
      [ref7]: https://wetten.overheid.nl/BWBR0013008
      [ref8]: https://wetten.overheid.nl/BWBR0004045
      [ref9]: https://wetten.overheid.nl/BWBR0008656#Artikel59
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel8
    references:
      - id: ref1
