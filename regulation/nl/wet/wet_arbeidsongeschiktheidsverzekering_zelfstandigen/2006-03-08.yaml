  - number: '103'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel103
  - number: '104'
    text: 'Deze wet wordt aangehaald als: Wet arbeidsongeschiktheidsverzekering zelfstandigen.'
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel104
