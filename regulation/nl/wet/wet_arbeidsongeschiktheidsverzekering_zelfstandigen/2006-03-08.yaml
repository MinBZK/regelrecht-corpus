    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
  - number: 1.1.o
    text: |-
      resterende verdiencapaciteit: datgene dat de persoon, die recht heeft op een arbeidsongeschiktheidsuitkering op
      grond van deze wet nog met arbeid kan verdienen en dat bij of krachtens [artikel 2][ref1] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel2
    url: https://wetten.overheid.nl/BWBR0008656/2006-03-08#Artikel1
    references:
      - id: ref1
