  - number: '1.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel1
  - number: 1.2.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel1
  - number: 1.2.b
    text: 'echtgenoten: geregistreerde partners;'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel1
  - number: 1.2.c
    text: 'gehuwd: als partner geregistreerd.'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel1
  - number: '1.3'
    text: 'In deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel1
  - number: 1.3.a
    text: |-
      als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde meerderjarige
      een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel1
  - number: 1.3.b
    text: als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel1
  - number: '1.4'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel1
  - number: '1.5'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben in
      dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel1
  - number: 1.5.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel1
  - number: 1.5.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel1
  - number: 1.5.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel1
  - number: 1.5.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel1
  - number: '1.6'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vijfde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel1
  - number: '1.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel1
  - number: '2.1'
    text: |-
      Arbeidsongeschikt, geheel of gedeeltelijk, is de verzekerde die als rechtstreeks en objectief medisch vast te
      stellen gevolg van ziekte, gebreken, zwangerschap of bevalling geheel of gedeeltelijk niet in staat is om met
      arbeid te verdienen, hetgeen gezonde personen, met soortgelijke opleiding en ervaring, ter plaatse waar hij arbeid
      verricht of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel2
  - number: '2.2'
    text: |-
      De verzekerde die op en sedert het tijdstip dat zijn verzekering een aanvang neemt, reeds gedeeltelijk
      arbeidsongeschikt is in de zin van het eerste lid, wordt voor wat de door hem aan deze wet te ontlenen aanspraken
      betreft als geheel of gedeeltelijk arbeidsongeschikt aangemerkt, indien hij als rechtstreeks en objectief medisch
      vast te stellen gevolg van ziekte, gebreken, zwangerschap of bevalling geheel of gedeeltelijk niet in staat is om
      met arbeid te verdienen, hetgeen soortgelijke personen, die in dezelfde mate arbeidsongeschikt zijn in de zin van
      het eerste lid, ter plaatse waar hij arbeid verricht of het laatst heeft verricht, of in de omgeving daarvan, met
      arbeid gewoonlijk verdienen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel2
  - number: '2.3'
    text: |-
      Indien de bij de aanvang van de verzekering aanwezige arbeidsongeschiktheid in de zin van het eerste lid naderhand
      is afgenomen vindt het tweede lid vervolgens overeenkomstige toepassing, met dien verstande dat voor de aanvang
      van de verzekering in de plaats treedt het tijdstip waarop de arbeidsongeschiktheid in de zin van het eerste lid
      is afgenomen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel2
  - number: '2.4'
    text: |-
      Onder de in het eerste en tweede lid eerstgenoemde arbeid wordt verstaan alle algemeen geaccepteerde arbeid waartoe
      de verzekerde met zijn krachten en bekwaamheden in staat is.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel2
  - number: '2.5'
    text: |-
      Bij de vaststelling van de mate van arbeidsongeschiktheid wordt buiten beschouwing gelaten of de verzekerde de
      arbeid feitelijk kan verkrijgen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel2
  - number: '2.6'
    text: |-
      Bij de toepassing van dit artikel wordt buiten beschouwing gelaten, hetgeen wordt of kan worden ontvangen voor
      arbeid verricht bij wijze van sociale werkvoorziening.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel2
  - number: '2.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot het eerste tot en met zesde lid nadere en
      zonodig afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel2
  - number: '2.8'
    text: 'Van een ontwerp van een besluit tot vaststelling, wijziging of intrekking van:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel2
  - number: 2.8.a
    text: een algemene maatregel van bestuur als bedoeld in het zevende lid;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel2
  - number: 2.8.b
    text: |-
      een krachtens de in onderdeel a bedoelde algemene maatregel van bestuur getroffen ministeriële regeling, wordt
      mededeling gedaan in de Staatscourant. Een voordracht tot vaststelling, wijziging of intrekking van een algemene
      maatregel van bestuur als bedoeld in onderdeel a, wordt niet gedaan en de vaststelling, wijziging of intrekking
      van een regeling als bedoeld in onderdeel b, geschiedt niet eerder dan nadat acht weken na die mededeling zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel2
  - number: '2.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent een afwijkende
      wijze van vaststelling van de mate van arbeidsongeschiktheid in gevallen waarin recht bestaat op een
      arbeidsongeschiktheidsuitkering en een arbeidsongeschiktheidsuitkering op grond van een andere wettelijke regeling
      ter verzekering tegen geldelijke gevolgen van langdurige arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel2
  - number: '3.1'
    text: 'Verzekerd op grond van deze wet is:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3
  - number: 3.1.a
    text: de zelfstandige;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3
  - number: 3.1.b
    text: de beroepsbeoefenaar; en
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3
  - number: 3.1.c
    text: de meewerkende echtgenoot.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3
  - number: '3.2'
    text: 'Tevens is verzekerd de persoon:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3
  - number: 3.2.a
    text: |-
      die aanspraak maakt op een arbeidsongeschiktheidsuitkering, doch uitsluitend omdat de wachttijd, bedoeld in
      [artikel 7, tweede lid][ref1], op hem van toepassing is, geen recht op arbeidsongeschiktheidsuitkering heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 3.2.b
    text: |-
      die na afloop van de wachttijd, bedoeld in [artikel 7, tweede lid][ref1], niet arbeidsongeschikt is, doch ten
      aanzien van wie dit wel het geval is binnen vier weken na afloop van dat tijdvak;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 3.2.c
    text: |-
      die recht heeft op arbeidsongeschiktheidsuitkering dan wel die door de toepassing van
      [artikel 7a, eerste lid][ref1], of [7b, eerste lid][ref2], geen recht heeft op arbeidsongeschiktheidsuitkering doch
      met toepassing van [artikel 7a, tweede of derde lid][ref3], of [7b, tweede of vierde lid][ref4], in aanmerking komt
      voor toekenning van arbeidsongeschiktheidsuitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel7b
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0008656#Artikel7b
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 7a
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: 7b
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: 7a
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0008656
        artikel: 7b
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 3.2.d
    text: |-
      wiens recht op arbeidsongeschiktheidsuitkering is geëindigd op grond van
      [artikel 19, eerste lid, onderdeel b, of vierde lid][ref1], of [19a][ref2] doch met toepassing van
      [artikel 20][ref3], [21][ref4], [21a][ref5] of [21b][ref6] in aanmerking komt voor toekenning of heropening van
      zijn arbeidsongeschiktheidsuitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0008656#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0008656#Artikel21a
      [ref6]: https://wetten.overheid.nl/BWBR0008656#Artikel21b
