  - number: 3.2.e
    text: |-
      die aan het einde van de wachttijd, bedoeld in [artikel 7, tweede lid][ref1], ongeschikt is tot het verrichten
      van zijn arbeid wegens ziekte, gebreken, zwangerschap of bevalling, en met toepassing van [artikel 20][ref2] in
      aanmerking komt voor toekenning van arbeidsongeschiktheidsuitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel20
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3
