        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 3.2.f
    text: |-
      die recht heeft op een uitkering op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 2, van de Wet arbeid en zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013008
        paragraaf: '2'
  - number: 3.2.g
    text: |-
      die recht heeft op een toelage als bedoeld in
      [artikel 28 van de Wet op de (re)integratie arbeidsgehandicapten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel28
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '28'
  - number: '3.3'
    text: |-
      Niet verzekerd is de vreemdeling die niet rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '3.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste en derde lid, uitbreiding dan wel
      beperking worden gegeven aan de kring van verzekerden.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3
  - number: '3.5'
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in het vierde lid, kan worden afgeweken van het derde lid ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3
  - number: 3.5.a
    text: vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben verricht;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3
  - number: 3.5.b
    text: |-
      vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3a
    text: |-
      Zo nodig in afwijking van [artikel 3][ref1] en de daarop berustende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '3'
        hoofdstuk: '2'
  - number: 3a.a
    text: |-
      wordt als verzekerde aangemerkt de persoon van wie de verzekering op grond van deze wet voortvloeit uit de
      toepassing van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3a
  - number: 3a.b
    text: |-
      wordt niet als verzekerde aangemerkt de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel3a
  - number: '4'
    text: 'Zelfstandige is de persoon, jonger dan 65 jaar:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel4
  - number: 4.a
    text: |-
      die in Nederland woont en die winst uit onderneming geniet, tenzij hij de onderneming niet voor eigen rekening
      feitelijk drijft;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel4
  - number: 4.b
    text: |-
      die niet in Nederland woont en die winst uit Nederlandse onderneming geniet, tenzij hij de onderneming niet voor
      eigen rekening feitelijk drijft.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel4
  - number: 4a.1
    text: |-
      De beschikking, bedoeld in [artikel 3.156 van de Wet inkomstenbelasting 2001][ref1], waarin de voordelen, die de
      belastingplichtige geniet of zal gaan genieten uit een arbeidsrelatie of uit arbeidsrelaties waarin sprake is van
      hetzelfde soort van werkzaamheden die onder overeenkomstige condities worden verricht, worden aangemerkt als winst
      uit een onderneming, heeft voor de termijn waarvoor deze beschikking geldt als gevolg dat de belastingplichtige,
      met betrekking tot die arbeidsrelaties, wordt aangemerkt als zelfstandige als bedoeld in [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel4
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '4'
        hoofdstuk: '2'
  - number: 4a.2
    text: |-
      Indien de beschikking, bedoeld in het eerste lid, wordt herzien, laat dat het in het eerste lid bedoelde gevolg
      onverlet, voor de termijn waarvoor die beschikking gold.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel4a
  - number: '5'
    text: 'Beroepsbeoefenaar is de persoon, jonger dan 65 jaar, die:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel5
  - number: 5.a
    text: anders dan uit dienstbetrekking inkomsten uit tegenwoordige arbeid geniet;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel5
  - number: 5.b
    text: |-
      anders dan in dienstbetrekking arbeid verricht ten behoeve van een lichaam waarin hij een aanmerkelijk belang
      heeft.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel5
  - number: '6'
    text: |-
      Meewerkende echtgenoot is de persoon jonger dan 65 jaar die anders dan in dienstbetrekking, als zelfstandige of als
      beroepsbeoefenaar, meewerkt in de onderneming van zijn echtgenoot.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel6
  - number: '7.1'
    text: |-
      Recht op arbeidsongeschiktheidsuitkering heeft de verzekerde die arbeidsongeschikt wordt indien hij in de
      52 weken onmiddellijk voorafgaande aan de dag, waarop de arbeidsongeschiktheid is ingetreden, arbeid in het
      bedrijfs- of beroepsleven heeft verricht gericht op het verwerven van winst of inkomsten. Als eerste dag van
      de arbeidsongeschiktheid geldt de eerste werkdag waarop wegens ziekte niet is gewerkt of het werken tijdens de
      werktijd is gestaakt. Het Uitvoeringsinstituut werknemersverzekeringen kan regels stellen inzake welke dag als
      eerste werkdag wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7
  - number: '7.2'
    text: |-
      Het recht op arbeidsongeschiktheidsuitkering gaat niet eerder in dan nadat de arbeidsongeschiktheid onafgebroken 52
      weken heeft geduurd en na afloop van dat tijdvak voortduurt.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7
  - number: '7.3'
    text: |-
      Voor het bepalen van het tijdvak van 52 weken, bedoeld in het tweede lid, worden perioden van arbeidsongeschiktheid
      samengeteld, indien zij elkaar met onderbreking van minder dan vier weken opvolgen. Bij de vaststelling van de
      periode van vier weken blijven perioden, waarin uitkering in verband met zwangerschap of bevalling op grond van
      [artikel 3:18, eerste lid][ref1], of [3:19 van de Wet arbeid en zorg][ref2] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '7.4'
    text: |-
      Recht op arbeidsongeschiktheidsuitkering heeft eveneens de verzekerde die na afloop van het in het tweede lid
      bedoelde tijdvak van 52 weken niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval is binnen vier
      onafgebroken weken na afloop van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7
  - number: '7.5'
    text: |-
      Voor het bepalen van het tijdvak van 52 weken, bedoeld in het tweede lid, worden steeds in aanmerking genomen
      tijdvakken, gedurende welke de verzekerde recht zou hebben gehad op ziekengeld op grond van de [Ziektewet][ref1],
      indien hij op grond van die wet zou zijn verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '7.6'
    text: |-
      Voor de toepassing van het eerste tot en met vierde lid wordt niet als arbeidsongeschikt beschouwd de verzekerde
      die minder dan 25% arbeidsongeschikt is alsmede de verzekerde die een uitkering geniet als bedoeld in het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7
  - number: 7a.1
    text: |-
      De verzekerde, bedoeld in [artikel 7][ref1], heeft geen recht op arbeidsongeschiktheidsuitkering, indien de dag
      waarop het recht op arbeidsongeschiktheidsuitkering zou ingaan, is gelegen in een periode dat hij niet in Nederland
      woont.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7a.2
    text: |-
      Het eerste lid is niet van toepassing indien de verzekerde op die dag woont in een land waarin op grond van een
      verdrag of een besluit van een volkenrechtelijke organisatie recht op arbeidsongeschiktheidsuitkering kan bestaan.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7a
  - number: 7a.3
    text: |-
      De verzekerde, die op grond van het eerste lid geen recht op arbeidsongeschiktheidsuitkering heeft, heeft vanaf
      de dag:
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7a
  - number: 7a.3.a
    text: dat hij in Nederland woont; of
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7a
  - number: 7a.3.b
    text: |-
      dat hij in een land woont waarmee een verdrag in werking is getreden dan wel een besluit van een volkenrechtelijke
      organisatie van kracht is geworden, op grond waarvan recht op arbeidsongeschiktheidsuitkering kan bestaan;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7a
  - number: 7a.4
    text: |-
      De verzekerde, bedoeld in het derde lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten
      aanzien van wie dat wel het geval is binnen vier weken na die dag, heeft met inachtneming van de bepalingen
      van deze wet recht op toekenning van arbeidsongeschiktheidsuitkering. [Artikel 7, zesde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het eerste lid afwijkende regels worden
      gesteld ten gunste van:
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7a
  - number: 7a.5.a
    text: de verzekerde, die tevens werkzaamheden verricht in het algemeen belang en niet in Nederland woont;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7a
  - number: 7a.5.b
    text: de verzekerde, die in de Nederlandse Antillen of Aruba woont; of
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7a
  - number: 7a.5.c
    text: de gezinsleden van de in de onderdelen a of b bedoelde verzekerde.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7a
  - number: 7a.6
    text: |-
      Onze Minister deelt mede in welke landen op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op arbeidsongeschiktheidsuitkering kan bestaan. In deze mededeling wordt tevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7a
  - number: 7a.6.a
    text: de vindplaats van het desbetreffende verdrag of besluit, en
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7a
  - number: 7a.6.b
    text: de eventueel in dat verdrag of besluit aanwezige beperkingen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7a
  - number: 7b.1
    text: |-
      De verzekerde, bedoeld in [artikel 7][ref1], heeft geen recht op arbeidsongeschiktheidsuitkering indien de dag
      waarop het recht op arbeidsongeschiktheidsuitkering zou ingaan, is gelegen in een periode dat hem rechtens zijn
      vrijheid is ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7b.2
    text: |-
      De verzekerde, die op grond van het eerste lid geen recht op arbeidsongeschiktheidsuitkering heeft, heeft
      vanaf de dag dat hij in vrijheid wordt gesteld met inachtneming van de bepalingen van deze wet recht op
      arbeidsongeschiktheidsuitkering, indien hij op die dag arbeidsongeschikt is. [Artikel 7, zesde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7b.3
    text: |-
      Voor de toepassing van het eerste lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7b
  - number: 7b.4
    text: |-
      De verzekerde, bedoeld in het tweede lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch
      ten aanzien van wie dit wel het geval is binnen vier weken na die dag, heeft met inachtneming van de bepalingen
      van deze wet recht op toekenning van arbeidsongeschiktheidsuitkering. [Artikel 7, zesde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7b.5
    text: |-
      Het eerste lid is niet van toepassing en het tweede en vierde lid zijn van overeenkomstige toepassing op bij
      algemene maatregel van bestuur aan te wijzen categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf
      of vrijheidsbenemende maatregel buiten een justitiële inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel7b
  - number: '8.1'
    text: De arbeidsongeschiktheidsuitkering wordt berekend naar de grondslag.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
  - number: '8.2'
    text: |-
      Voor de verzekerde, bedoeld in [artikel 4][ref1], is de grondslag:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel4
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '4'
        hoofdstuk: '2'
  - number: 8.2.a
    text: |-
      hetgeen hij in het boekjaar, onmiddellijk voorafgaande aan het intreden van zijn arbeidsongeschiktheid als
      zelfstandige gemiddeld per dag aan winst heeft genoten; of, indien dit leidt tot een hoger bedrag,
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
  - number: 8.2.b
    text: |-
      hetgeen hij in de vijf boekjaren, onmiddellijk voorafgaande aan het intreden van zijn arbeidsongeschiktheid als
      zelfstandige gemiddeld per dag aan winst heeft genoten.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
  - number: '8.3'
    text: |-
      Voor de verzekerde, bedoeld in [artikel 5][ref1], is de grondslag:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel5
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '5'
        hoofdstuk: '2'
  - number: 8.3.a
    text: |-
      hetgeen hij in het kalenderjaar onmiddellijk voorafgaande aan het intreden van zijn arbeidsongeschiktheid als
      beroepsbeoefenaar gemiddeld per dag aan inkomsten heeft genoten; of, indien dit leidt tot een hoger bedrag,
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
  - number: 8.3.b
    text: |-
      hetgeen hij in de vijf kalenderjaren onmiddellijk voorafgaande aan het intreden van zijn arbeidsongeschiktheid als
      beroepsbeoefenaar gemiddeld per dag aan inkomsten heeft genoten.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
  - number: '8.4'
    text: |-
      Voor de verzekerde, bedoeld in [artikel 6][ref1], is de grondslag hetgeen hij over een tijdvak, gelegen in de in
      het tweede lid genoemde perioden, op basis van de geleverde arbeidsinbreng gemiddeld per dag aan inkomsten geacht
      kan worden te hebben genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel6
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '6'
        hoofdstuk: '2'
  - number: '8.5'
    text: |-
      Indien de verzekerde, bedoeld in [artikel 4][ref1] en [6][ref2], tevens verzekerde is op grond van
      [artikel 5][ref3] wordt de grondslag bepaald op een bedrag dat de uitkomst vormt van de samentelling van de
      gemiddelde winst of inkomsten per dag als bedoeld in het tweede lid en vierde lid en de gemiddelde inkomsten per
      dag als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel5
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '5'
        hoofdstuk: '2'
  - number: '8.6'
    text: |-
      Voor personen die op grond van [artikel 3, vierde lid][ref1], zijn verzekerd kan bij of krachtens algemene
      maatregel van bestuur, zonodig in afwijking van het tweede tot en met vierde lid, een grondslag worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '3'
        hoofdstuk: '2'
  - number: '8.7'
    text: De grondslag bedraagt ten hoogste het minimumloon.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
  - number: '8.8'
    text: |-
      Onder het in het zevende lid bedoelde minimumloon wordt verstaan het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1], gedeeld door 21,75,
      of, indien het een persoon jonger dan 23 jaar betreft, het minimumloon per maand dat voor zijn leeftijd geldt op
      grond van [artikel 7, derde lid][ref2], en [artikel 8, derde lid, van genoemde wet][ref3], gedeeld door 21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '8.9'
    text: |-
      Indien het minimumloon wordt herzien wordt de grondslag, bedoeld in het tweede tot en met zesde lid naar
      evenredigheid herzien.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
  - number: '8.10'
    text: |-
      Op een beschikking als gevolg van een herziening van de grondslag op grond van het negende lid zijn de
      [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '8.11'
    text: |-
      Indien de verzekerde die recht heeft op een arbeidsongeschiktheidsuitkering met ingang van
      dezelfde dag recht heeft op toekenning van een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt het bedrag van de overeenkomstig het tweede tot
      en met zesde lid vastgestelde grondslag, doch ten hoogste het op grond van [artikel 72, tweede lid][ref2],
      aangewezen bedrag gedeeld door 261, verminderd met een bedrag dat gelijk is aan het dagloon dat aan de
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref3] ten grondslag
      ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '72'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0002524
  - number: '8.12'
    text: |-
      Indien de verzekerde die recht heeft op arbeidsongeschiktheidsuitkering bij het intreden van
      de arbeidsongeschiktheid tevens verzekerde was op grond van [artikel 3][ref1], [4][ref2] of
      [5 van de Wet op de arbeidsongeschiktheidsverzekering][ref3], wordt het bedrag van de overeenkomstig het tweede
      tot en met zesde lid vastgestelde grondslag, doch ten hoogste het op grond van [artikel 72, tweede lid][ref4],
      aangewezen bedrag gedeeld door 261, verminderd met een bedrag dat gelijk is aan het loon dat hij als werknemer
      genoot, voor zover dat loon als dagloon aan de toekenning van een arbeidsongeschiktheidsuitkering op grond
      van de [Wet op de arbeidsongeschiktheidsverzekering][ref5] ten grondslag ligt of zou liggen als hij bij
      het intreden van de arbeidsongeschiktheid tevens arbeidsongeschikt is in de zin van [die wet][ref6] dan wel
      arbeidsongeschikt zou zijn geworden in de zin van [die wet][ref7]. De eerste zin blijft buiten toepassing als
      [artikel 59, eerste of tweede lid][ref8], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0008656#Artikel72
      [ref5]: https://wetten.overheid.nl/BWBR0002524
      [ref6]: https://wetten.overheid.nl/BWBR0002524
      [ref7]: https://wetten.overheid.nl/BWBR0002524
      [ref8]: https://wetten.overheid.nl/BWBR0008656#Artikel59
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0008656
        artikel: '72'
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0002524
      - id: ref6
        bwb_id: BWBR0002524
      - id: ref7
        bwb_id: BWBR0002524
      - id: ref8
        bwb_id: BWBR0008656
        artikel: '59'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '8.13'
    text: |-
      Indien de verzekerde die recht heeft op arbeidsongeschiktheidsuitkering op de dag van het intreden
      van de arbeidsongeschiktheid recht had op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], ziekengeld op grond van de [Ziektewet][ref2],
      uitkering op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref3] of een
      uitkering op grond van de [Werkloosheidswet][ref4], wordt het bedrag van de overeenkomstig het tweede tot
      en met zesde lid vastgestelde grondslag, doch ten hoogste het op grond van [artikel 72, tweede lid][ref5],
      aangewezen bedrag gedeeld door 261, verminderd met het bedrag van genoemde uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref6], de [Ziektewet][ref7], de [Wet arbeid en zorg][ref8]
      of de [Werkloosheidswet][ref9] waarop hij recht heeft op de dag voorafgaande aan het intreden van de
      arbeidsongeschiktheid. De eerste zin blijft buiten toepassing als [artikel 59, eerste of tweede lid][ref10], van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0008656#Artikel72
      [ref6]: https://wetten.overheid.nl/BWBR0002524
      [ref7]: https://wetten.overheid.nl/BWBR0001888
      [ref8]: https://wetten.overheid.nl/BWBR0013008
      [ref9]: https://wetten.overheid.nl/BWBR0004045
      [ref10]: https://wetten.overheid.nl/BWBR0008656#Artikel59
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004045
      - id: ref5
        bwb_id: BWBR0008656
        artikel: '72'
        hoofdstuk: '6'
      - id: ref6
        bwb_id: BWBR0002524
      - id: ref7
        bwb_id: BWBR0001888
      - id: ref8
        bwb_id: BWBR0013008
      - id: ref9
        bwb_id: BWBR0004045
      - id: ref10
        bwb_id: BWBR0008656
        artikel: '59'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '8.14'
    text: |-
      Indien het in het elfde lid bedoelde dagloon, het in het twaalfde lid bedoelde loon of het in het dertiende
      lid bedoelde bedrag van de uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1], de
      [Ziektewet][ref2], de [Wet arbeid en zorg][ref3] of de [Werkloosheidswet][ref4], alsmede het in die leden genoemde
      bedrag van de overeenkomstig het tweede tot en met zesde lid vastgestelde grondslag lager is dan het minimumloon,
      bedoeld in het achtste lid, bedraagt de grondslag voor de arbeidsongeschiktheidsuitkering het minimumloon,
      verminderd met dat dagloon, loon of bedrag, tenzij de grondslag, berekend op grond van het tweede tot en met zesde
      lid tot een lager bedrag leidt, in welk geval laatstgenoemd bedrag als grondslag geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0013008
      [ref4]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0013008
      - id: ref4
        bwb_id: BWBR0004045
  - number: '8.15'
    text: De toepassing van het elfde, twaalfde en dertiende lid geldt onverminderd het zevende lid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
  - number: '8.16'
    text: |-
      Voor de toepassing van het elfde tot en met het dertiende lid wordt onder loon, arbeidsongeschiktheidsuitkering
      op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1], ziekengeld op grond van de [Ziektewet][ref2],
      uitkering op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref3] of uitkering
      op grond van de [Werkloosheidswet][ref4] tevens verstaan de vakantie-uitkering waarop uit hoofde van dat
      loon of die uitkering recht bestaat, voorzover die vakantie-uitkering over dezelfde periode is berekend.
      Voor de toepassing van het veertiende lid wordt onder loon, arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref5], ziekengeld op grond van de [Ziektewet][ref6], uitkering op
      grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref7] of uitkering op grond van de
      [Werkloosheidswet][ref8] niet verstaan de vakantie-uitkering waarop uit hoofde van dat loon of die uitkering recht
      bestaat en wordt onder dagloon verstaan het dagloon maal 100/108.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0002524
      [ref6]: https://wetten.overheid.nl/BWBR0001888
      [ref7]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref8]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004045
      - id: ref5
        bwb_id: BWBR0002524
      - id: ref6
        bwb_id: BWBR0001888
      - id: ref7
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref8
        bwb_id: BWBR0004045
  - number: '8.17'
    text: |-
      Het elfde tot en met veertiende lid is niet van toepassing op de persoon die een uitkering ontvangt op grond van
      de vrijwillige verzekering, bedoeld in [hoofdstuk VI van de Wet op de arbeidsongeschiktheidsverzekering][ref1],
      [hoofdstuk IV van de Ziektewet][ref2] of [hoofdstuk III van de Werkloosheidswet][ref3].
      Het dertiende en veertiende lid is evenmin van toepassing op de persoon die op grond van
      [artikel 3:6, tweede lid, van de Wet arbeid en zorg][ref4] een uitkering ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0001888#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0001888
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004045
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '8.18'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld met
      betrekking tot de winst, de inkomsten en de periode waarover de winst en de inkomsten worden berekend, bedoeld in
      het tweede tot en met het zesde lid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
  - number: '8.19'
    text: |-
      Voor de toepassing van het elfde tot en met het veertiende lid en het zestiende lid wordt met een
      uitkering op grond van de [Werkloosheidswet][ref1] gelijkgesteld een uitkering terzake van ontslag of
      werkloosheid, onder welke benaming dan ook, met uitzondering van een uitkering in verband met functioneel
      leeftijdsontslag of vrijwillig vervroegd uittreden, uit hoofde van een arbeidsverhouding als bedoeld in
      [artikel 1, onderdeel l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref2]. Dit lid vervalt op
      het tijdstip van aanvang van fase 3 van de [Wet overheidspersoneel onder de werknemersverzekeringen][ref3], bedoeld
      in [artikel 54 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0009267#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009267
      [ref4]: https://wetten.overheid.nl/BWBR0009267#Artikel54
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0009267
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0009267
      - id: ref4
        bwb_id: BWBR0009267
        artikel: '54'
  - number: '9.1'
    text: |-
      De arbeidsongeschiktheidsuitkering bedraagt per dag, de zaterdagen en zondagen niet meegerekend, bij een
      arbeidsongeschiktheid van:






                    25–35%:


                    21% van de grondslag;




                    35–45%:


                    28% van de grondslag;




                    45–55%:


                    35% van de grondslag;




                    55–65%:


                    42% van de grondslag;




                    65–80%:


                    50,75% van de grondslag;




                    80% of meer:


                    70% van de grondslag.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel9
  - number: '9.2'
    text: |-
      Bij de vaststelling van de mate van arbeidsongeschiktheid wordt, zoveel doenlijk, rekening gehouden met verkregen
      nieuwe bekwaamheden.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel9
  - number: '10'
    text: |-
      Een arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van 80% of meer, wordt, indien de
      verzekerde verkeert in een althans voorlopig blijvende toestand van hulpbehoevendheid, die geregeld oppassing en
      verzorging nodig maakt, voor de duur van die hulpbehoevendheid tot ten hoogste zijn grondslag verhoogd. De eerste
      zin vindt geen toepassing, indien de verzekerde in een inrichting is opgenomen en de kosten van verblijf ten laste
      van een verzekering inzake ziektekosten komen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel10
  - number: '11.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan met betrekking tot uit deze wet voortvloeiende aanspraken
      geheel of ten dele, tijdelijk of blijvend, buiten aanmerking laten:
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel11
  - number: 11.1.a
    text: gehele arbeidsongeschiktheid, die bestond op het tijdstip, dat de verzekering een aanvang nam;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel11
  - number: 11.1.b
    text: |-
      arbeidsongeschiktheid, die binnen een half jaar na het tijdstip, dat de verzekering een aanvang nam, is ingetreden,
      terwijl de gezondheidstoestand van de verzekerde ten tijde van de aanvang van zijn verzekering het intreden van
      arbeidsongeschiktheid binnen een half jaar kennelijk moest doen verwachten.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel11
  - number: '11.2'
    text: |-
      De in het eerste lid, onderdeel *b*, bedoelde bevoegdheid strekt zich mede uit tot toeneming van de
      arbeidsongeschiktheid, voor zover deze toeneming kennelijk is voortgekomen uit dezelfde oorzaak als de
      arbeidsongeschiktheid die binnen een half jaar na de aanvang van de verzekering is ingetreden.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel11
  - number: '11.3'
    text: |-
      Zolang het Uitvoeringsinstituut werknemersverzekeringen op grond van het eerste lid arbeidsongeschiktheid
      buiten aanmerking laat, vindt [artikel 2, tweede lid][ref1], overeenkomstige toepassing met betrekking tot
      de door de verzekerde aan deze wet nog te ontlenen aanspraken, met dien verstande, dat voor de aanvang van de
      verzekering in de plaats treedt het tijdstip, met ingang waarvan het Uitvoeringsinstituut werknemersverzekeringen
      arbeidsongeschiktheid buiten aanmerking laat.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel2
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '2'
        hoofdstuk: '1'
  - number: '12.1'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt herzien wanneer de verzekerde, aan wie zij is toegekend, op grond van deze
      wet voor een hogere of lagere uitkering in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel12
  - number: '12.2'
    text: |-
      Onverminderd hetgeen overigens in deze wet is bepaald ter zake van herziening of intrekking van de
      arbeidsongeschiktheidsuitkering, beziet het Uitvoeringsinstituut werknemersverzekeringen binnen een jaar na ingang
      van de arbeidsongeschiktheidsuitkering, niet zijnde een voortzetting als bedoeld in [artikel 35, vierde lid][ref1],
      of er gronden aanwezig zijn voor herziening of intrekking van de arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel35
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '12.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, onder goedkeuring van Onze Minister, ten aanzien van bepaalde
      groepen arbeidsongeschikten bepalen dat geen tijdvak geldt dan wel een tijdvak zal gelden, dat afwijkt van het in
      het tweede lid genoemde tijdvak.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel12
  - number: '12.4'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van de arbeidsongeschiktheidsuitkering plaats
      met inachtneming van de [artikelen 13 tot en met 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel13
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '12.5'
    text: |-
      De arbeidsongeschiktheidsuitkering van de verzekerde die deelneemt aan een voor hem gewenste opleiding of scholing,
      wordt gedurende deze opleiding of scholing niet herzien in verband met een daaruit voortvloeiende afneming van
      de arbeidsongeschiktheid, tenzij [artikel 9, derde lid][ref1], van toepassing is. Indien de verzekerde tijdens
      de opleiding of scholing inkomsten uit arbeid verwerft, is [artikel 58, eerste lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel58
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '58'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '13.1'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering,
      berekend naar een arbeidsongeschiktheid van minder dan 45%, onverminderd de artikelen 15 en 16, plaats zodra de
      toegenomen arbeidsongeschiktheid onafgebroken 52 weken heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel13
  - number: '13.2'
    text: |-
      De in het eerste lid bedoelde herziening vindt niet plaats, indien de toeneming kennelijk is voortgekomen uit een
      andere oorzaak dan die waaruit de ongeschiktheid ter zake waarvan uitkering wordt genoten, is voortgekomen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel13
  - number: '13.3'
    text: |-
      Indien de uitkeringsgerechtigde bij het intreden van de toeneming van de arbeidsongeschiktheid of in de 52 weken
      onmiddellijk voorafgaande aan de toeneming van de arbeidsongeschiktheid arbeid verricht of heeft verricht als
      bedoeld in artikel 7, eerste lid, vindt de in het eerste lid bedoelde herziening plaats, ook indien de toeneming
      kennelijk is voortgekomen uit een andere oorzaak dan die waaruit de ongeschiktheid ter zake waarvan uitkering wordt
      genoten, is voortgekomen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel13
  - number: '13.4'
    text: |-
      Voor het bepalen van het tijdvak van 52 weken, bedoeld in het eerste lid, worden perioden van toegenomen
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen.
      Bij de vaststelling van zowel het tijdvak van 52 weken als de periode van vier weken blijven perioden,
      waarin uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:18, eerste lid][ref1], of
      [3:19 van de Wet arbeid en zorg][ref2] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '14.1'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering,
      berekend naar een arbeidsongeschiktheid van ten minste 45%, onverminderd artikel 15, plaats zodra de toegenomen
      arbeidsongeschiktheid onafgebroken vier weken heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel14
  - number: '14.2'
    text: |-
      Indien de arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45%, doch minder
      dan 80%, wegens afneming van de arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder dan
      45%, doch binnen vier weken na de dag, met ingang waarvan die uitkering is herzien, de arbeidsongeschiktheid weer
      toeneemt, is het eerste lid van toepassing, onder afwijking van artikel 13.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel14
  - number: '14.3'
    text: |-
      Voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste en tweede lid, worden perioden van
      toegenomen arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken
      opvolgen. Bij de vaststelling van zowel de eerstgenoemde als de laatstgenoemde periode van vier weken blijven
      perioden, waarin uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:18, eerste lid][ref1],
      of [3:19 van de Wet arbeid en zorg][ref2] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '15.1'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering steeds
      plaats zodra de toeneming van de arbeidsongeschiktheid optreedt, indien deze intreedt:
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel15
  - number: 15.1.a
    text: binnen vier weken na de dag, met ingang waarvan de arbeidsongeschiktheidsuitkering werd toegekend;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel15
  - number: 15.1.b
    text: |-
      binnen vier weken na de dag, met ingang waarvan de arbeidsongeschiktheidsuitkering wegens toegenomen
      arbeidsongeschiktheid werd herzien;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel15
  - number: 15.1.c
    text: |-
      binnen vier weken na de dag, met ingang waarvan de arbeidsongeschiktheidsuitkering, die voordien was berekend
      naar een arbeidsongeschiktheid van 80% of meer, wegens afneming van de arbeidsongeschiktheid is herzien naar een
      arbeidsongeschiktheid van minder dan 80%;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel15
  - number: 15.1.d
    text: binnen een bij ministeriële regeling aan te geven tijdvak in daarbij aan te wijzen gevallen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel15
  - number: '15.2'
    text: |-
      Indien de arbeidsongeschiktheidsuitkering werd toegekend, onderscheidenlijk wegens toegenomen arbeidsongeschiktheid
      werd herzien, met toepassing van [artikel 36, tweede lid][ref1], onderscheidenlijk [artikel 38, tweede lid][ref2],
      geldt met betrekking tot het eerste lid, onderdeel *a* en *b*, als dag met ingang waarvan de
      arbeidsongeschiktheidsuitkering werd toegekend onderscheidenlijk herzien de dag, met ingang waarvan die uitkering
      zou zijn toegekend, onderscheidenlijk zou zijn herzien, indien [artikel 36, tweede lid][ref3], onderscheidenlijk
      [artikel 38, tweede lid][ref4], geen toepassing zou hebben gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0008656#Artikel38
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0008656
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '15.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor gevallen waarbij direct herziening van de
      arbeidsongeschiktheidsuitkering plaatsvindt. Op grond van deze regels kan bedoelde herziening slechts plaatsvinden
      ten behoeve van de verzekerde die bij hervatting van de arbeid in het bedrijfs- of beroepsleven winst of inkomsten
      geniet, die minder bedragen dan evenredig is aan zijn nog bestaande arbeidsgeschiktheid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel15
  - number: '16.1'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid die intreedt binnen vijf jaar na de datum van toekenning
      of herziening van de arbeidsongeschiktheidsuitkering en die voortkomt uit dezelfde oorzaak als die waaruit
      de arbeidsongeschiktheid ter zake waarvan uitkering wordt genoten, is voortgekomen, vindt herziening van de
      arbeidsongeschiktheidsuitkering steeds plaats, zodra de toegenomen arbeidsongeschiktheid onafgebroken vier weken
      heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel16
  - number: '16.2'
    text: |-
      Voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste lid, worden perioden van toegenomen
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen.
      Bij de vaststelling van zowel de eerstgenoemde als de laatstgenoemde periode van vier weken blijven perioden,
      waarin uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:18, eerste lid][ref1], of
      [3:19 van de Wet arbeid en zorg][ref2] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '16.3'
    text: |-
      Dit artikel vindt geen toepassing, indien recht bestaat op herziening van de arbeidsongeschiktheidsuitkering op
      grond van artikel 14 of 15, eerste lid, onderdelen *a* tot en met *c*.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel16
  - number: '17.1'
    text: |-
      Indien wegens toeneming van de arbeidsongeschiktheid herziening van de arbeidsongeschiktheidsuitkering heeft
      plaatsgevonden, vindt hernieuwde vaststelling van een grondslag plaats overeenkomstig [artikel 8][ref1] en
      de daarop berustende bepalingen, mits dat leidt tot een hogere grondslag dan die, welke laatstelijk aan de
      arbeidsongeschiktheidsuitkering ten grondslag werd gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '17.2'
    text: |-
      Voor de toepassing van het eerste lid wordt in [artikel 8][ref1] in plaats van «het intreden van zijn
      arbeidsongeschiktheid» gelezen: de toeneming van zijn arbeidsongeschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '18.1'
    text: |-
      Onverminderd hetgeen overigens in deze wet is bepaald ter zake van herziening of intrekking van een beschikking
      tot toekenning van arbeidsongeschiktheidsuitkering, alsook ter zake van een weigering van een zodanige uitkering,
      herziet het Uitvoeringsinstituut werknemersverzekeringen een dergelijke beschikking of trekt het deze in:
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel18
  - number: 18.1.a
    text: |-
      ter uitvoering van een beslissing als bedoeld in [artikel 11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel11
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 18.1.b
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 45][ref1], [46][ref2] of
      [70][ref3] heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van een uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
  - number: 18.1.c
    text: indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel18
  - number: 18.1.d
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 45][ref1], [46][ref2] of
      [70][ref3] ertoe leidt dat niet kan worden vastgesteld of nog recht op uitkering bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
  - number: '18.2'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van herziening of intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel18
  - number: '19.1'
    text: 'Het recht op arbeidsongeschiktheidsuitkering eindigt:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel19
  - number: 19.1.a
    text: met ingang van de eerste dag van de maand, waarin de verzekerde de leeftijd van 65 jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel19
  - number: 19.1.b
    text: |-
      wanneer de arbeidsongeschiktheid is geëindigd, of beneden 25% is gedaald, met ingang van de dag, aangegeven in de
      daartoe strekkende beschikking van het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel19
  - number: '19.2'
    text: |-
      De arbeidsongeschiktheidsuitkering van de verzekerde die deelneemt aan een voor hem gewenste opleiding of scholing,
      wordt gedurende deze opleiding of scholing niet ingetrokken in verband met een daaruit voortvloeiende afneming van
      de arbeidsongeschiktheid, tenzij artikel 9, derde lid, van toepassing is. Indien de verzekerde tijdens de opleiding
      of scholing inkomsten uit arbeid verwerft, is artikel 58, eerste lid, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel19
  - number: '19.3'
    text: |-
      Indien de intrekking van de arbeidsongeschiktheidsuitkering verband houdt met een voltooide scholing of opleiding,
      gaat deze intrekking niet eerder in dan een jaar na voltooiing van die scholing of opleiding. Indien de verzekerde
      eerder inkomsten uit arbeid verwerft, is artikel 58, eerste lid, tot uiterlijk het einde van dat jaar van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel19
  - number: '19.4'
    text: |-
      Het recht op arbeidsongeschiktheidsuitkering eindigt, indien de verzekerde rechtens zijn vrijheid is ontnomen,
      vanaf de dag dat deze vrijheidsontneming één maand heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel19
  - number: '19.5'
    text: |-
      Voor de toepassing van het vierde lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel19
  - number: 19a.1
    text: Het recht op arbeidsongeschiktheidsuitkering eindigt indien de verzekerde niet meer in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel19a
  - number: 19a.2
    text: |-
      [Artikel 7a, tweede, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7a
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 7a
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '20.1'
    text: 'Indien de verzekerde:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel20
  - number: 20.1.a
    text: |-
      wiens arbeidsongeschiktheidsuitkering wegens afneming van arbeidsongeschiktheid op grond van artikel 19, eerste
      lid, onderdeel *b*, is ingetrokken; of
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel20
  - number: 20.1.b
    text: |-
      die aan het einde van de wachttijd, bedoeld in artikel 7, tweede lid, ongeschikt is tot het verrichten van zijn
      arbeid wegens ziekte, gebreken, zwangerschap of bevalling, maar geen recht had op arbeidsongeschiktheidsuitkering
      omdat hij niet arbeidsongeschikt was;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel20
  - number: '20.2'
    text: |-
      Voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen.
      Bij de vaststelling van zowel de eerstgenoemde als de laatstgenoemde periode van vier weken blijven perioden,
      waarin uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:18, eerste lid][ref1], of
      [3:19 van de Wet arbeid en zorg][ref2] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '20.3'
    text: 'Dit artikel vindt geen toepassing:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel20
  - number: 20.3.a
    text: indien op grond van artikel 21 aanspraak bestaat op heropening van de arbeidsongeschiktheidsuitkering; of
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel20
  - number: 20.3.b
    text: |-
      indien [artikel 29b van de Ziektewet][ref1] toepassing kan vinden, tenzij de toe te kennen
      arbeidsongeschiktheidsuitkering het ziekengeld overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 29b
  - number: '20.4'
    text: |-
      In de gevallen, waarin dit artikel toepassing vindt wordt de grondslag van de toe te kennen
      arbeidsongeschiktheidsuitkering niet lager gesteld dan de grondslag die voor de berekening van de laatstelijk
      ontvangen arbeidsongeschiktheidsuitkering in aanmerking werd genomen, dan wel de grondslag die in aanmerking zou
      zijn genomen, indien na het einde van de wachttijd, bedoeld in artikel 7, eerste lid, recht zou hebben bestaan op
      een arbeidsongeschiktheidsuitkering, zoals die sinds de beëindiging van de uitkering onderscheidenlijk sinds het
      einde van die wachttijd op grond van artikel 8 zou zijn herzien.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel20
  - number: '20.5'
    text: Artikel 7b en de daarop berustende bepalingen zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel20
  - number: '21.1'
    text: |-
      De verzekerde, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45%,
      in verband met artikel 19, eerste lid, onderdeel *b*, is ingetrokken, heeft, indien hij binnen vier weken na de
      dag, met ingang waarvan de uitkering is ingetrokken, weer arbeidsongeschikt wordt, aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel21
  - number: '21.2'
    text: |-
      Het eerste lid is mede van toepassing ten aanzien van de verzekerde, wiens arbeidsongeschiktheidsuitkering,
      berekend naar een arbeidsongeschiktheid van minder dan 45% in verband met artikel 19, eerste lid, onderdeel
      *b*, is ingetrokken, indien hij weer arbeidsongeschikt wordt binnen vier weken na de dag, met ingang waarvan die
      uitkering, die voordien was berekend naar een arbeidsongeschiktheid van ten minste 45%, wegens afneming van de
      arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder dan 45%.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel21
  - number: '21.3'
    text: |-
      De verzekerde, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan 45%,
      in verband met artikel 19, eerste lid, onderdeel *b*, is ingetrokken met ingang van een dag, gelegen binnen vier
      weken na de dag, met ingang waarvan die uitkering werd toegekend of wegens toegenomen arbeidsongeschiktheid werd
      herzien, heeft, indien hij binnen die vier weken weer arbeidsongeschikt wordt, aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering. Artikel 15, tweede lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel21
  - number: '21.4'
    text: |-
      De verzekerde, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan
      45%, in verband met artikel 19, eerste lid, onderdeel *b*, is ingetrokken, heeft, onverminderd het tweede en
      het derde lid, indien hij binnen vier weken na de dag, met ingang waarvan de uitkering is ingetrokken, weer
      arbeidsongeschikt wordt, niet kennelijk uit een andere oorzaak dan die, waaruit de arbeidsongeschiktheid,
      ter zake waarvan de ingetrokken uitkering werd genoten, is voortgekomen, aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel21
  - number: '21.5'
    text: De heropening vindt plaats naar de mate van arbeidsongeschiktheid op de dag, waarop de heropening ingaat.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel21
  - number: '21.6'
    text: |-
      Voor de toepassing van het eerste tot en met vijfde lid wordt niet als arbeidsongeschikt beschouwd de verzekerde
      die minder dan 25% arbeidsongeschikt is.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel21
  - number: '21.7'
    text: Artikel 7b en de daarop berustende bepalingen zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel21
  - number: 21a.1
    text: |-
      De verzekerde, wiens arbeidsongeschiktheidsuitkering in verband met [artikel 19a, eerste lid][ref1], is geëindigd,
      heeft vanaf de dag:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19a
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 19a
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 21a.1.a
    text: dat hij in Nederland woont; of
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel21a
  - number: 21a.1.b
    text: |-
      dat hij in een land woont waarmee een verdrag in werking is getreden dan wel een besluit van een volkenrechtelijke
      organisatie van kracht is geworden, op grond waarvan recht op arbeidsongeschiktheidsuitkering kan bestaan;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel21a
  - number: 21a.2
    text: |-
      Aanspraak op heropening van de arbeidsongeschiktheidsuitkering heeft eveneens de verzekerde, bedoeld in het eerste
      lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval is
      binnen vier weken na afloop van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel21a
  - number: 21a.3
    text: |-
      De [artikelen 7, zesde lid][ref1], [36][ref2] en [37, eerste lid][ref3], zijn van overeenkomstige toepassing met
      betrekking tot de aanspraak op heropening van de arbeidsongeschiktheidsuitkering, bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel37
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 21b.1
    text: |-
      De verzekerde, wiens arbeidsongeschiktheidsuitkering in verband met artikel 19, vierde lid, is geëindigd, heeft
      vanaf de dag dat hij in vrijheid wordt gesteld met inachtneming van de bepalingen van deze wet aanspraak op
      heropening van de arbeidsongeschiktheidsuitkering, indien hij op die dag arbeidsongeschikt is. Artikel 7, zevende
      lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel21b
  - number: 21b.2
    text: |-
      Aanspraak op heropening van de arbeidsongeschiktheidsuitkering heeft eveneens de verzekerde, bedoeld in het eerste
      lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval is
      binnen vier weken na afloop van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel21b
  - number: 21b.3
    text: |-
      De artikelen 7, zevende lid, 36 en 37, eerste lid, zijn van overeenkomstige toepassing met betrekking tot de
      aanspraak op heropening van de arbeidsongeschiktheidsuitkering, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel21b
  - number: 21b.4
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op bij algemene maatregel van bestuur aan te wijzen
      categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel buiten een
      justitiële inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel21b
  - number: '25'
    text: |-
      De verzekerde die over een maand recht heeft op arbeidsongeschiktheidsuitkering, heeft over die maand recht op
      vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel25
  - number: '26.1'
    text: |-
      De vakantie-uitkering bedraagt acht procent van het bedrag aan arbeidsongeschiktheidsuitkering, waarop recht
      bestond in het tijdvak van twaalf maanden, voorafgaande aan de maand mei.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel26
  - number: '26.2'
    text: |-
      Indien [artikel 58][ref1] of [59][ref2] is toegepast, wordt onder het bedrag aan arbeidsongeschiktheidsuitkering,
      bedoeld in het eerste lid, verstaan het bedrag van de arbeidsongeschiktheidsuitkering, nadat dat artikel toepassing
      heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel59
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '58'
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '59'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '26.3'
    text: |-
      Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1], wordt gewijzigd, treedt dit
      gewijzigde percentage in de plaats van het in het eerste lid genoemde percentage. Het gewijzigde percentage wordt
      in aanmerking genomen over de uitkering waarop recht bestaat over het tijdvak aanvangende met de dag waarop de
      wijziging ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '26.4'
    text: |-
      Op de ambtshalve toekenning van een vakantie-uitkering zijn de [artikelen 3:41][ref1] en
      [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '27'
    text: |-
      De [artikelen 25][ref1] en [26, eerste tot en met derde lid][ref2], zijn van overeenkomstige toepassing op de
      overlijdensuitkering, bedoeld in [artikel 61][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel61
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '61'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '29'
    text: |-
      Indien een verzekerde van 45 jaar of ouder die recht heeft op een arbeidsongeschiktheidsuitkering en die als
      verzekerde bedoeld in [artikel 3, eerste lid][ref1], winst of inkomsten gaat genieten in verband waarmee zijn
      arbeidsongeschiktheidsuitkering wordt beëindigd, wordt, indien hij binnen vijf jaar na de datum van aanvang
      van zijn werkzaamheden opnieuw recht heeft op toekenning van een arbeidsongeschiktheidsuitkering, de grondslag
      van die uitkering niet lager gesteld dan de grondslag die voor de berekening van de laatstelijk ontvangen
      arbeidsongeschiktheidsuitkering in aanmerking werd genomen, zoals die sinds de beëindiging van de uitkering op
      grond van [artikel 8][ref2] zou zijn herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '33.1'
    text: |-
      Ten einde een recht op arbeidsongeschiktheidsuitkering geldend te kunnen maken meldt de verzekerde
      zijn arbeidsongeschiktheid binnen dertien weken na het ontstaan van de arbeidsongeschiktheid aan het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel33
  - number: '33.2'
    text: |-
      Voor het bepalen van het tijdvak van dertien weken, bedoeld in het eerste lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen.
      Bij de vaststelling van zowel het tijdvak van dertien weken als de periode van vier weken blijven perioden,
      waarin uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:18, eerste lid,][ref1] of
      [3:19 van de Wet arbeid en zorg][ref2] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '35.1'
    text: |-
      Onverminderd hetgeen in deze wet ter zake van herziening of intrekking van de arbeidsongeschiktheidsuitkering is
      bepaald, wordt de arbeidsongeschiktheidsuitkering op aanvraag toegekend over tijdvakken van drie jaar.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel35
  - number: '35.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt de verzekerde schriftelijk in kennis van de mogelijkheid van
      het doen van een aanvraag uiterlijk vier maanden voor de datum waarop:
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel35
  - number: 35.2.a
    text: |-
      het in [artikel 7, tweede lid][ref1], genoemde tijdvak van 52 weken eindigt;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 35.2.b
    text: een tijdvak van drie jaar als bedoeld in het eerste lid, verstrijkt.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel35
  - number: '35.3'
    text: |-
      Het tweede lid, onderdeel *a*, is niet van toepassing, indien de verzekerde de melding, bedoeld in
      [artikel 33, eerste lid][ref1], niet of niet tijdig heeft gedaan. Indien de verzekerde deze melding
      niet tijdig heeft gedaan, geldt de in het tweede lid bedoelde verplichting voor het Uitvoeringsinstituut
      werknemersverzekeringen uiterlijk drie maanden nadat de verzekerde de melding heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel33
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: '35.4'
    text: |-
      De verzekerde die in aanmerking wenst te komen voor toekenning dan wel voortzetting van de uitkering, doet zijn
      aanvraag binnen negen maanden na aanvang van zijn arbeidsongeschiktheid, onderscheidenlijk uiterlijk drie maanden
      voor het verstrijken van een tijdvak als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel35
  - number: '35.5'
    text: |-
      Indien niet binnen de termijn ingevolge [artikel 95a, eerste lid][ref1], een beschikking is gegeven op een tijdig
      ingediende aanvraag tot voortzetting van de arbeidsongeschiktheidsuitkering wordt de uitkering voortgezet tot het
      tijdstip waarop de beschikking op de aanvraag is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel95a
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 95a
        hoofdstuk: '9'
  - number: '35.6'
    text: |-
      Een aanvraag is tijdig ingediend, indien het Uitvoeringsinstituut werknemersverzekeringen de kennisgeving, bedoeld
      in het tweede lid, niet heeft gedaan dan wel indien bij een latere kennisgeving dan bedoeld in het tweede lid de
      aanvraag wordt ingediend binnen vier weken nadat deze kennisgeving is ontvangen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel35
  - number: '35.7'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, onder goedkeuring van Onze Minister, ten aanzien van bepaalde
      groepen arbeidsongeschikten bepalen dat geen tijdvak geldt dan wel een tijdvak zal gelden dat afwijkt van het in
      het eerste lid genoemde tijdvak.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel35
  - number: '35.8'
    text: |-
      Indien de toepassing van het vierde lid zou leiden tot kennelijke hardheid, is het Uitvoeringsinstituut
      werknemersverzekeringen bevoegd de uitkering ambtshalve toe te kennen of voort te zetten.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel35
  - number: '36.1'
    text: |-
      De arbeidsongeschiktheidsuitkering gaat in op de dag, met ingang waarvan de verzekerde aan de vereisten voor het
      recht op toekenning van die uitkering voldoet.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel36
  - number: '36.2'
    text: |-
      In afwijking van het eerste lid kan de uitkering niet vroeger ingaan dan een jaar voor de dag, waarop
      de aanvraag om toekenning dan wel voortzetting van de uitkering werd ingediend. Het Uitvoeringsinstituut
      werknemersverzekeringen kan voor bijzondere gevallen van de eerste zin afwijken.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel36
  - number: '36.3'
    text: |-
      Toekenning van arbeidsongeschiktheidsuitkering vindt niet plaats, indien deze zou ingaan op of na de in artikel 19,
      eerste lid, onderdeel *a*, bedoelde dag.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel36
  - number: '37.1'
    text: Herziening dan wel heropening van de arbeidsongeschiktheidsuitkering vindt op aanvraag of ambtshalve plaats.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel37
  - number: '37.2'
    text: |-
      Herziening van de arbeidsongeschiktheidsuitkering vindt in elk geval ambtshalve plaats in geval van een beslissing
      op grond van [artikel 12, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel12
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '38.1'
    text: |-
      De herziening van de arbeidsongeschiktheidsuitkering gaat in op de dag, waarop de verzekerde op grond van deze wet
      voor een hogere of lagere uitkering in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel38
  - number: '38.2'
    text: |-
      Met betrekking tot de herziening van de arbeidsongeschiktheidsuitkering, die een verhoging van die uitkering
      tot gevolg heeft, alsmede met betrekking tot de heropening van de uitkering is artikel 36, tweede lid, van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel38
  - number: '38.3'
    text: |-
      De herziening van een arbeidsongeschiktheidsuitkering ter zake van afneming van de arbeidsongeschiktheid gaat in op
      de dag, aangegeven in de daartoe strekkende beschikking van het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel38
  - number: '38.4'
    text: |-
      Indien de herziening van de arbeidsongeschiktheidsuitkering verband houdt met een voltooide scholing of opleiding,
      gaat deze herziening niet eerder in dan een jaar na voltooiing van die scholing of opleiding. Indien de verzekerde
      eerder inkomsten uit arbeid verwerft, is artikel 58, eerste lid, tot uiterlijk het einde van dat jaar van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel38
  - number: '38.5'
    text: |-
      De heropening van de uitkering, bedoeld in artikel 21, gaat in op de dag, met ingang waarvan de verzekerde weer
      arbeidsongeschikt is geworden.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel38
  - number: '38.6'
    text: |-
      Heropening van de arbeidsongeschiktheidsuitkering vindt niet plaats, indien deze zou ingaan op of na de in artikel
      19, eerste lid, onderdeel *a*, bedoelde dag.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel38
  - number: '40'
    text: |-
      De vakantie-uitkering wordt ambtshalve of, ingeval [artikel 60, eerste lid, tweede zin][ref1], toepassing vindt, op
      aanvraag door het Uitvoeringsinstituut werknemersverzekeringen toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel60
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '60'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '41.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, telkens wanneer het dat nodig oordeelt, oproepen of doen
      oproepen en op een door of namens hem te bepalen plaats ondervragen of doen ondervragen:
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel41
  - number: 41.1.a
    text: de verzekerde;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel41
  - number: 41.1.b
    text: de verzekerde, die de wachttijd van 52 weken, bedoeld in artikel 7, tweede lid, doormaakt;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel41
  - number: 41.1.c
    text: de verzekerde, die aanspraak maakt op of recht heeft op een arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel41
  - number: 41.1.d
    text: |-
      de verzekerde ten aanzien van wie of ten behoeve van wie reïntegratie-instrumenten als bedoeld in
      [hoofdstuk 3][ref1] of [hoofdstuk 4 van de Wet op de (re)integratie arbeidsgehandicapten][ref2] zijn toegekend of
      waarvan toekenning wordt overwogen.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009565
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009565
        hoofdstuk: '4'
  - number: '41.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan de in het eerste lid bedoelde personen op een door of namens
      hem te bepalen plaats door een of meer daartoe door hem aangewezen deskundigen doen onderzoeken.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel41
  - number: '41.3'
    text: |-
      De daartoe door het Uitvoeringsinstituut werknemersverzekeringen aangewezen deskundige kan, ook zonder opdracht
      van het Uitvoeringsinstituut werknemersverzekeringen, de in het eerste lid bedoelde personen oproepen, ondervragen,
      doen oproepen, doen ondervragen en onderzoeken of doen onderzoeken door een of meer door hem daartoe aangewezen
      deskundigen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel41
  - number: '42'
    text: |-
      Opgeroepenen en, indien hun toestand geleide nodig maakt, mede hun geleiders, worden reiskosten, verblijfkosten
      en tijdverlies vergoed in de gevallen en volgens regels die door het Uitvoeringsinstituut werknemersverzekeringen
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel42
  - number: '43.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de door hem daartoe aangewezen deskundige kunnen de personen,
      bedoeld in [artikel 41, eerste lid][ref1], voorschriften geven in het belang van een behandeling of van genezing of
      tot behoud, herstel en bevordering van de mogelijkheid tot het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel41
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '43.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan voorschrijven dat de personen, bedoeld in
      [artikel 41, eerste lid][ref1], zich laten registreren als werkzoekende bij de Centrale organisatie werk en
      inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel41
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '44'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan controlevoorschriften vaststellen. Deze voorschriften mogen
      niet verder gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel44
  - number: '45.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen weigert de uitkering tijdelijk of blijvend, geheel of
      gedeeltelijk, indien een verzekerde als bedoeld in [artikel 41, eerste lid][ref1], na tijdig te zijn opgeroepen
      niet is verschenen of heeft geweigerd:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel41
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 45.1.a
    text: |-
      vragen te beantwoorden die zijn gesteld door het Uitvoeringsinstituut werknemersverzekeringen of de door hem
      daartoe aangewezen deskundige;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel45
  - number: 45.1.b
    text: |-
      zich te laten onderzoeken door de door het Uitvoeringsinstituut werknemersverzekeringen daartoe aangewezen
      deskundige; of
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel45
  - number: 45.1.c
    text: |-
      te voldoen aan het voorschrift, gegeven door het Uitvoeringsinstituut werknemersverzekeringen of de door
      hem daartoe aangewezen deskundige, om zich ter observatie te doen opnemen of te verblijven in een aangewezen
      inrichting.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel45
  - number: '45.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig het eerste lid bij toeneming van
      de arbeidsongeschiktheid, voor zover deze toeneming kennelijk is voortgekomen uit dezelfde oorzaak als de
      arbeidsongeschiktheid, ter zake waarvan het niet voldoen aan de oproeping of de weigering plaatsvond.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel45
  - number: '46'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig [artikel 45][ref1], indien de verzekerde:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel45
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 46.a
    text: |-
      de door het Uitvoeringsinstituut werknemersverzekeringen of de door hem daartoe aangewezen deskundige krachtens
      [artikel 43][ref1] in het belang van een behandeling of genezing of tot behoud, herstel of bevordering van de
      mogelijkheid tot het verrichten van arbeid en tot registratie als werkzoekende bij de Centrale organisatie werk en
      inkomen gegeven voorschriften zonder deugdelijke grond niet opvolgt;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel43
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 46.b
    text: |-
      zich niet, zolang als het Uitvoeringsinstituut werknemersverzekeringen of de door hem daartoe aangewezen deskundige
      te kennen heeft gegeven dit noodzakelijk te achten, onder geneeskundige behandeling stelt of indien hij de
      voorschriften van de behandelende arts niet opvolgt;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel46
  - number: 46.c
    text: |-
      zich schuldig maakt aan gedragingen, waardoor zijn genezing wordt belemmerd of nalaat voldoende mee te werken om
      aanpassing aan zijn ziekte of gebrek te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel46
  - number: 46.d
    text: |-
      de controlevoorschriften, bedoeld in [artikel 44][ref1], of de verplichting, bedoeld in
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] niet of niet behoorlijk
      is nagekomen of de verplichting, bedoeld in [artikel 70][ref3], niet binnen de door het Uitvoeringsinstituut
      werknemersverzekeringen daarvoor vastgestelde termijn is nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '44'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
  - number: 46.e
    text: zijn arbeidsongeschiktheid opzettelijk heeft veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel46
  - number: 46.f
    text: |-
      zich niet houdt aan het voorschrift, bedoeld in [artikel 35, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel35
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 46.g
    text: |-
      zonder redelijke gronden niet meewerkt aan een scholing of opleiding die wenselijk wordt geacht voor zijn
      inschakeling in de arbeid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel46
  - number: '47.1'
    text: |-
      Een maatregel als bedoeld in [artikel 45][ref1] of [46][ref2] wordt afgestemd op de ernst van de gedraging en de
      mate waarin de verzekerde de gedraging kan worden verweten. Van het opleggen van een maatregel wordt in elk geval
      afgezien, indien elke vorm van verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel46
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: '47.2'
    text: |-
      Indien het niet tijdig nakomen van de verplichting, bedoeld in [artikel 70][ref1], niet heeft geleid tot het ten
      onrechte of tot een te hoog bedrag verlenen van een uitkering als genoemd in dat artikel, of indien de verzekerde
      zich niet houdt aan het voorschrift, bedoeld in [artikel 35, vierde lid][ref2], kan het Uitvoeringsinstituut
      werknemersverzekeringen afzien van het opleggen van een maatregel en volstaan met het geven van een schriftelijke
      waarschuwing ter zake van het niet tijdig nakomen van de verplichting, of het zich niet houden aan het voorschrift,
      tenzij het niet tijdig nakomen van de verplichting, of het zich niet houden aan de voorschriften, plaatsvindt
      binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de verzekerde een zodanige
      waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel35
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '47.3'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van
      het opleggen van een maatregel af te zien.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel47
  - number: '47.4'
    text: |-
      Het opleggen van een maatregel blijft achterwege, indien voor dezelfde gedraging een boete als bedoeld in
      [artikel 48][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel48
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: '47.5'
    text: Het Uitvoeringsinstituut werknemersverzekeringen stelt nadere regels met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel47
  - number: '48.1'
    text: |-
      Indien de verzekerde of zijn wettelijke vertegenwoordiger de verplichting, bedoeld in [artikel 70][ref1], niet
      of niet behoorlijk is nagekomen, legt het Uitvoeringsinstituut werknemersverzekeringen hem een boete op van ten
      hoogste € 2 269.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
  - number: '48.2'
    text: |-
      De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de verzekerde of zijn
      wettelijke vertegenwoordiger de gedraging verweten kan worden en de omstandigheden waarin hij verkeert. Van het
      opleggen van een boete wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel48
  - number: '48.3'
    text: |-
      Indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 70][ref1], niet heeft geleid
      tot het ten onrechte of tot een te hoog bedrag verlenen van een uitkering als genoemd in dat artikel, kan het
      Uitvoeringsinstituut werknemersverzekeringen afzien van het opleggen van een boete als bedoeld in het eerste lid
      en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet of niet behoorlijk nakomen van
      de verplichting, tenzij het niet of niet behoorlijk nakomen van de verplichting plaatsvindt binnen een periode
      van twee jaar te rekenen vanaf de datum waarop eerder aan de verzekerde of zijn wettelijke vertegenwoordiger een
      zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
  - number: '48.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van
      het opleggen van een boete af te zien.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel48
  - number: '48.5'
    text: |-
      De persoon aan wie een boete is opgelegd is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel48
  - number: '48.6'
    text: Voor zover de boete nog niet is geïnd vervalt zij door het overlijden van de persoon aan wie zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel48
  - number: '48.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel48
  - number: '49.1'
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen jegens de verzekerde of zijn wettelijke vertegenwoordiger
      een handeling verricht waaraan deze in redelijkheid de gevolgtrekking kan verbinden dat hem wegens een bepaalde
      gedraging een boete zal worden opgelegd, is verzekerde of zijn wettelijke vertegenwoordiger niet langer verplicht
      ter zake van die gedragingen enige verklaring af te leggen, voor zover het betreft de boeteoplegging. De verzekerde
      of zijn wettelijke vertegenwoordiger wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt
      gevraagd.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel49
  - number: '49.2'
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen voornemens is aan de verzekerde of zijn wettelijke
      vertegenwoordiger een boete op te leggen, wordt hiervan kennis gegeven aan de verzekerde of zijn wettelijke
      vertegenwoordiger onder vermelding van de gronden waarop het voornemen berust. De kennisgeving is een handeling als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel49
  - number: '49.3'
    text: |-
      Op verzoek van de verzekerde of zijn wettelijke vertegenwoordiger die de kennisgeving, bedoeld in het tweede
      lid, wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt het Uitvoeringsinstituut
      werknemersverzekeringen er zoveel mogelijk zorg voor dat de in die kennisgeving vermelde gronden aan de verzekerde
      of zijn wettelijke vertegenwoordiger worden meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel49
  - number: '49.4'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt het Uitvoeringsinstituut
      werknemersverzekeringen de verzekerde of zijn wettelijke vertegenwoordiger in de gelegenheid om naar keuze
      schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '49.5'
    text: |-
      Indien de verzekerde of zijn wettelijke vertegenwoordiger zijn zienswijze mondeling naar voren brengt, draagt het
      Uitvoeringsinstituut werknemersverzekeringen er op verzoek van de verzekerde of zijn wettelijke vertegenwoordiger
      die de Nederlandse taal onvoldoende begrijpt, zorg voor dat een tolk wordt benoemd die hem kan bijstaan, tenzij
      redelijkerwijs kan worden aangenomen dat daaraan geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel49
  - number: '50.1'
    text: |-
      Het besluit waarbij de boete wordt opgelegd vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald, alsmede de wijze waarop het besluit bij gebreke van tijdige betaling, overeenkomstig [artikel 54][ref1]
      zal worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel54
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '54'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: '50.2'
    text: |-
      Op verzoek van de verzekerde of zijn wettelijke vertegenwoordiger die het in het eerste lid bedoelde besluit
      wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt het Uitvoeringsinstituut
      werknemersverzekeringen er zoveel mogelijk zorg voor dat de in dat besluit vermelde informatie aan de verzekerde of
      zijn wettelijke vertegenwoordiger wordt meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel50
  - number: '50.3'
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel50
  - number: '51.1'
    text: Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel51
  - number: '51.2'
    text: |-
      De oplegging van een boete blijft definitief achterwege indien ter zake van de gedraging tegen de
      verzekerde of zijn wettelijke vertegenwoordiger een strafvervolging is ingesteld en het onderzoek ter
      terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen op grond van
      [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '51.3'
    text: |-
      Het openbaar ministerie doet van een omstandigheid als bedoeld in het eerste en het tweede lid mededeling aan het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel51
  - number: '52.1'
    text: |-
      Een boete wordt opgelegd binnen een jaar nadat het Uitvoeringsinstituut werknemersverzekeringen de verzekerde
      of zijn wettelijke vertegenwoordiger overeenkomstig [artikel 49, vierde lid][ref1], in de gelegenheid heeft
      gesteld zijn zienswijze naar voren te brengen. Indien ter zake aangifte is gedaan of proces-verbaal is opgemaakt
      en ingezonden vangt het tijdvak van een jaar aan op de dag na die waarop het openbaar ministerie aan het
      Uitvoeringsinstituut werknemersverzekeringen heeft meegedeeld dat geen strafvervolging wordt ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel49
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: '52.2'
    text: |-
      Een boete wordt in elk geval niet opgelegd na verloop van vijf jaren nadat de desbetreffende gedraging heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel52
  - number: '53'
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de boete is vastgesteld ook ten nadele van de verzekerde of zijn wettelijke vertegenwoordiger
      wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '54.1'
    text: |-
      Het besluit waarbij een boete is opgelegd levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De titel heeft mede betrekking op de rente en
      kosten, bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '54.2'
    text: |-
      Indien de persoon aan wie een boete is opgelegd een uitkering ontvangt op grond van deze wet, de
      [Werkloosheidswet][ref1], de [Ziektewet][ref2], de [Wet op de arbeidsongeschiktheidsverzekering][ref3],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref5] of de [Wet arbeid en zorg][ref6] of een toeslag op grond
      van de [Toeslagenwet][ref7], wordt het besluit waarbij de boete is opgelegd tenuitvoergelegd door verrekening met
      die uitkering of toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0008657
      [ref5]: https://wetten.overheid.nl/BWBR0002822
      [ref6]: https://wetten.overheid.nl/BWBR0013008
      [ref7]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0008657
      - id: ref5
        bwb_id: BWBR0002822
      - id: ref6
        bwb_id: BWBR0013008
      - id: ref7
        bwb_id: BWBR0004043
  - number: '54.3'
    text: |-
      Indien de persoon aan wie een boete is opgelegd een uitkering ontvangt op grond van de
      [Algemene Ouderdomswet][ref1], de [Algemene nabestaandenwet][ref2], de [Wet werk en bijstand][ref3],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5] of de
      [Wet inkomensvoorziening kunstenaars][ref6], betaalt de Sociale verzekeringsbank, onderscheidenlijk de betrokken
      gemeente het bedrag van die boete, zonder dat daarvoor een machtiging nodig is van hem, op zijn verzoek aan het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0015703
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0004163
      [ref6]: https://wetten.overheid.nl/BWBR0009344
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0015703
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0004163
      - id: ref6
        bwb_id: BWBR0009344
  - number: '54.4'
    text: |-
      Indien de persoon aan wie een boete is opgelegd geen uitkering of toeslag als bedoeld in het tweede of derde lid
      ontvangt, of meer ontvangt, dan wel ten aanzien van zodanige uitkering of toeslag toepassing van het tweede of
      derde lid niet mogelijk is, wordt het besluit waarbij de boete is opgelegd bij gebreke van tijdige betaling met
      toepassing van het [Wetboek van Burgerlijke Rechtsvordering][ref1] op zijn kosten betekend en tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '54.5'
    text: |-
      De tenuitvoerlegging van een besluit waarbij een boete is opgelegd vindt plaats met toepassing van het tweede of
      derde lid, dan wel van het vierde lid, dan wel van het tweede of derde lid in combinatie met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel54
  - number: '54.6'
    text: |-
      Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel54
  - number: '54.7'
    text: |-
      Op het executoriaal beslag op grond van dit artikel door het Uitvoeringsinstituut werknemersverzekeringen
      op loon, sociale uitkeringen of andere periodieke betalingen, die derden verschuldigd zijn of worden
      aan de persoon aan wie een boete is opgelegd, zijn de [artikelen 479b tot en met 479g][ref1] , behoudens
      [artikel 479e, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] van overeenkomstige toepassing.
      De in [artikel 479g][ref3] aan het Landelijk Bureau Inning Onderhoudsbijdragen toegekende bevoegdheid komt
      gelijkelijk toe aan het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel479e
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479b
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 479e
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 479g
  - number: '54.8'
    text: |-
      De tenuitvoerlegging van een besluit met toepassing van dit artikel geschiedt zodanig dat de verzekerde of zijn
      wettelijke vertegenwoordiger blijft beschikken over een inkomen gelijk aan de beslagvrije voet, bedoeld in de
      [artikelen 475c][ref1] tot en met [475e van het Wetboek van Burgerlijke Rechtsvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475e
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475e
  - number: '54.9'
    text: |-
      Het achtste lid geldt niet, zolang de verzekerde of zijn wettelijke vertegenwoordiger zijn verplichting, bedoeld in
      [artikel 48, vijfde lid][ref1], niet of niet behoorlijk nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel48
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: '55.1'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt betaalbaar gesteld door het Uitvoeringsinstituut werknemersverzekeringen.
      De betaling geschiedt als regel in tijdvakken van een maand.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel55
  - number: '55.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan een uitkering als bedoeld in het eerste lid, over een door
      hem te bepalen tijdvak bij wege van voorschot betaalbaar stellen, indien onzekerheid bestaat over het recht op
      of de hoogte van de uitkering of de hoogte van het te betalen bedrag aan uitkering. Een verleend voorschot wordt
      verrekend met het definitief vastgestelde bedrag aan uitkering dat over het desbetreffende tijdvak wordt betaald.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel55
  - number: '55.3'
    text: |-
      Onverminderd het tweede lid, schort het Uitvoeringsinstituut werknemersverzekeringen de betaling van de
      arbeidsongeschiktheidsuitkering op of schorst het de betaling, indien het op grond van duidelijke aanwijzingen van
      oordeel is of het gegronde vermoeden heeft dat:
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel55
  - number: 55.3.a
    text: het recht op uitkering niet of niet meer bestaat;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel55
  - number: 55.3.b
    text: recht op een lagere uitkering bestaat;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel55
  - number: 55.3.c
    text: |-
      de verzekerde of zijn wettelijke vertegenwoordiger een verplichting als bedoeld in [artikel 45][ref1], [46][ref2]
      of [70][ref3] niet of niet behoorlijk is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
  - number: '55.4'
    text: |-
      Ingeval de arbeidsongeschiktheidsuitkering in het buitenland wordt betaald worden de daaraan verbonden kosten van
      overmaking op de uitkering in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel55
  - number: '55.5'
    text: |-
      Wanneer de verzekerde, aan wie een arbeidsongeschiktheidsuitkering is toegekend, een ander machtigt om de uitkering
      in ontvangst te nemen, onderscheidenlijk een verleende machtiging intrekt, wordt daaraan gevolg gegeven met ingang
      van een betalingstijdvak, aanvangende na de dag waarop de machtiging wordt ingediend, onderscheidenlijk waarop
      van haar intrekking mededeling wordt gedaan, doch niet later dan de eerste dag van de tweede maand na de dag van
      indiening onderscheidenlijk de mededeling.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel55
  - number: 55a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van een arbeidsongeschiktheidsuitkering op
      indien de persoon aan wie de uitkering is toegekend een vreemdeling is die niet rechtmatig in Nederland verblijf
      houdt als bedoeld in [artikel 8 van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 55a.2
    text: |-
      De betaling van een arbeidsongeschiktheidsuitkering wordt hervat indien de betrokkene daartoe een aanvraag indient
      en het Uitvoeringsinstituut werknemersverzekeringen is gebleken dat hij feitelijk buiten Nederland woont of
      verblijf houdt.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel55a
  - number: '56'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen houdt op de arbeidsongeschiktheidsuitkering, op de vakantie-
      uitkering en op de toeslag op de uitkering op grond van de [Toeslagenwet][ref1] een bedrag in, dat gelijk is aan
      het bedrag van de premie die een werkgever op grond van de [Werkloosheidswet][ref2] op het overeenkomstige loon van
      een werknemer, die verzekerd is op grond van die wet, inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004043
      - id: ref2
        bwb_id: BWBR0004045
  - number: '57.1'
    text: |-
      Indien de verzekerde, aan wie een arbeidsongeschiktheidsuitkering is toegekend, op grond van
      [artikel 6, derde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1], een bijdrage verschuldigd is in de
      kosten van een verstrekking als bedoeld in de [artikelen 6][ref2] en [11 van die wet][ref3] of een vergoeding als
      bedoeld in de [artikelen 11][ref4] en [12 van die wet][ref5], kan het Uitvoeringsinstituut werknemersverzekeringen
      de uitkering tot het bedrag van die bijdrage in plaats van aan de verzekerde zonder diens machtiging betalen aan
      het College voor zorgverzekeringen, genoemd in [artikel 1a van de Ziekenfondswet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0002614#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0002460#Artikel1a
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '11'
      - id: ref5
        bwb_id: BWBR0002614
        artikel: '12'
      - id: ref6
        bwb_id: BWBR0002460
        artikel: 1a
  - number: '57.2'
    text: |-
      Indien de verzekerde, aan wie een arbeidsongeschiktheidsuitkering is toegekend, in een inrichting ter verpleging
      van geesteszieken of van zwakzinnigen is opgenomen en het Uitvoeringsinstituut werknemersverzekeringen van
      de desbetreffende inrichting of van de gemeente die de opnamekosten betaalt, het verzoek ontvangt om de
      arbeidsongeschiktheidsuitkering aan die inrichting of die gemeente uit te betalen, kan het Uitvoeringsinstituut
      werknemersverzekeringen dat verzoek zonder het stellen van andere voorwaarden inwilligen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel57
  - number: '57.3'
    text: |-
      Indien het eerste lid toepassing vindt, heeft de in het tweede lid bedoelde bevoegdheid betrekking op het
      gedeelte van de arbeidsongeschiktheidsuitkering, dat niet aan het College voor zorgverzekeringen, genoemd in
      [artikel 1a van de Ziekenfondswet][ref1] wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1a
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1a
  - number: '57.4'
    text: |-
      Op de herziening van een beschikking op grond van het eerste lid als gevolg van een wijziging van de verschuldigde
      bijdrage zijn de [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '58.1'
    text: |-
      Indien de verzekerde die recht heeft op een arbeidsongeschiktheidsuitkering inkomsten uit arbeid geniet, wordt,
      zolang niet vaststaat of deze arbeid als arbeid, bedoeld in [artikel 2, vierde lid][ref1], kan worden aangemerkt,
      de arbeidsongeschiktheidsuitkering niet ingetrokken of herzien, doch wordt de uitkering:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel2
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '2'
        hoofdstuk: '1'
  - number: 58.1.a
    text: |-
      niet betaald, indien de inkomsten uit arbeid zodanig zijn, dat als die arbeid wel arbeid als bedoeld in
      [artikel 2, vierde lid][ref1], zou zijn, niet langer sprake zou zijn van arbeidsongeschiktheid van ten minste 25%;
      of


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel2
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '2'
        hoofdstuk: '1'
  - number: 58.1.b
    text: |-
      indien onderdeel a niet van toepassing is, betaald tot een bedrag ter grootte van de
      arbeidsongeschiktheidsuitkering, zoals deze zou zijn vastgesteld, indien die arbeid wel arbeid als bedoeld in
      [artikel 2, vierde lid][ref1], zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel2
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '2'
        hoofdstuk: '1'
  - number: '58.2'
    text: |-
      Toepassing van het eerste lid kan ten hoogste plaatsvinden over een aaneengesloten tijdvak van drie jaar,
      vanaf de eerste dag waarover de inkomsten uit arbeid worden genoten. Dit tijdvak wordt niet onderbroken indien
      gedurende perioden van korter dan vier weken geen inkomsten uit arbeid worden genoten. Na afloop van het in
      de eerste zin genoemde tijdvak wordt de in het eerste lid bedoelde arbeid aangemerkt als arbeid, bedoeld in
      [artikel 2, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel2
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '2'
        hoofdstuk: '1'
  - number: '58.3'
    text: |-
      Indien de verzekerde die recht heeft op een arbeidsongeschiktheidsuitkering, inkomsten uit arbeid geniet ingevolge
      een arbeidsovereenkomst als bedoeld in de [hoofdstukken 2][ref1] en [3 van de Wet sociale werkvoorziening][ref2],
      vindt het tweede lid geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        hoofdstuk: '3'
  - number: '58.4'
    text: |-
      Maandelijks wordt het geraamde bedrag aan arbeidsongeschiktheidsuitkeringen, die op grond van het derde lid niet
      worden uitbetaald wegens het genieten van dat loon, alsmede van de dientengevolge niet uitbetaalde vakantie-
      uitkeringen, vermeerderd met het bedrag aan premies dat het Uitvoeringsinstituut werknemersverzekeringen bij
      uitbetaling daarover op grond van enige wet verschuldigd zou zijn en dat niet op de uitkeringen in mindering kan
      worden gebracht, aan ’s Rijks kas afgedragen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel58
  - number: '58.5'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het eerste lid. Deze regels hebben in elk geval
      betrekking op de gelijkstelling van inkomsten in verband met arbeid met inkomsten als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel58
  - number: '58.6'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het tweede lid geen toepassing vindt ten aanzien van andere vormen
      van arbeid die de verzekerde gaat verrichten.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel58
  - number: '59.1'
    text: 'Indien terzake van arbeidsongeschiktheid recht bestaat op:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel59
  - number: 59.1.a
    text: |-
      zowel herziening van de arbeidsongeschiktheidsuitkering in verband met de
      [artikelen 12 tot en met 17][ref1] als op toekenning van een arbeidsongeschiktheidsuitkering op grond
      van de [Wet op de arbeidsongeschiktheidsverzekering][ref2] uit hoofde van een dienstbetrekking die is
      aangevangen na het intreden van de arbeidsongeschiktheid op grond waarvan recht is ontstaan op eerstbedoelde
      arbeidsongeschiktheidsuitkering; of


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002524
  - number: 59.1.b
    text: |-
      zowel toekenning van arbeidsongeschiktheidsuitkering op grond van [artikel 20][ref1] als toekenning van
      een arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2]
      uit hoofde van een dienstbetrekking die is aangevangen na het intreden van de arbeidsongeschiktheid op
      grond waarvan de arbeidsongeschiktheidsuitkering, bedoeld in [artikel 20, eerste lid, onderdeel a][ref3],
      werd toegekend dan wel tijdens of na de wachttijd, bedoeld in onderdeel b van dat lid; wordt de
      arbeidsongeschiktheidsuitkering uitbetaald voorzover deze de arbeidsongeschiktheidsuitkering op grond van
      de [Wet op de arbeidsongeschiktheidsverzekering][ref4] overtreft. In de situatie, bedoeld onder a, wordt de
      arbeidsongeschiktheidsuitkering in ieder geval uitbetaald tot de hoogte van het bedrag onmiddellijk voorafgaande
      aan de herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002524
  - number: '59.2'
    text: 'Indien terzake van arbeidsongeschiktheid recht bestaat op:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel59
  - number: 59.2.a
    text: |-
      zowel herziening van de arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] in verband met de
      [artikelen 36 tot en met 40 van die wet][ref2] als toekenning van een arbeidsongeschiktheidsuitkering uit hoofde
      van werkzaamheden als verzekerde die zijn aangevangen na het intreden van de arbeidsongeschiktheid op grond waarvan
      recht is ontstaan op eerstbedoelde arbeidsongeschiktheidsuitkering; of


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel36
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '36'
  - number: 59.2.b
    text: |-
      zowel toekenning van arbeidsongeschiktheidsuitkering op grond van
      [artikel 43a van de Wet op de arbeidsongeschiktheidsverzekering][ref1] als toekenning van een
      arbeidsongeschiktheidsuitkering uit hoofde van werkzaamheden als verzekerde die zijn aangevangen na het
      intreden van de arbeidsongeschiktheid op grond waarvan de arbeidsongeschiktheidsuitkering, bedoeld in
      [artikel 43a, eerste lid, onderdeel a, van de Wet op de arbeidsongeschiktheidsverzekering][ref2], werd toegekend
      dan wel tijdens of na de wachttijd, bedoeld in onderdeel b van dat lid; wordt de arbeidsongeschiktheidsuitkering
      uitbetaald voorzover deze de herziene of toegekende arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering overtreft][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref3
        bwb_id: BWBR0002524
  - number: '59.3'
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt onder arbeidsongeschiktheidsuitkering en
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] tevens verstaan
      de vakantie-uitkering waarop uit hoofde van die arbeidsongeschiktheidsuitkeringen recht bestaat, voor zover die
      vakantie-uitkering over dezelfde periode is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: '59.4'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op de persoon die een
      arbeidsongeschiktheidsuitkering ontvangt op grond van de vrijwillige verzekering, bedoeld in
      [hoofdstuk VI van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: VI
  - number: '59.5'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel59
  - number: 59.5.a
    text: met betrekking tot het eerste tot en met derde lid;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel59
  - number: 59.5.b
    text: |-
      ter voorkoming of beperking van samenloop van arbeidsongeschiktheidsuitkering met de in het eerste tot en met derde
      lid bedoelde uitkeringen in situaties waarin deze leden niet of onvoldoende voorzien;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel59
  - number: 59.5.c
    text: |-
      ter voorkoming of beperking van samenloop van arbeidsongeschiktheidsuitkering op grond van deze wet met uitkering
      op grond van andere wetten.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel59
  - number: '59.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ter voorkoming of beperking van samenloop van
      arbeidsongeschiktheidsuitkering met uitkering op grond van de sociale wetgeving van de Nederlandse Antillen, Aruba
      of van een andere Mogendheid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel59
  - number: '60.1'
    text: |-
      De betaling van de vakantie-uitkering vindt eenmaal per jaar plaats in de maand mei over de aan die maand
      voorafgaande 12 maanden, of, indien het recht op uitkering eerder dan in de maand mei eindigt, in de desbetreffende
      maand. Het Uitvoeringsinstituut werknemersverzekeringen kan de vakantie-uitkering op een ander tijdstip betalen,
      mits die betaling plaatsvindt over een of meer voorliggende maanden waarover reeds recht op vakantie-uitkering
      bestaat.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel60
  - number: '60.2'
    text: |-
      De [artikelen 55][ref1], [57][ref2] en [61][ref3] zijn van overeenkomstige toepassing ten aanzien van de vakantie-
      uitkering, voor zover bij of krachtens deze wet niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel61
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '55'
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '57'
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '61'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '61.1'
    text: |-
      Na het overlijden van de verzekerde, aan wie een arbeidsongeschiktheidsuitkering is toegekend, wordt met ingang van
      de dag na het overlijden, de uitkering in de vorm van een overlijdensuitkering betaald:
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel61
  - number: 61.1.a
    text: aan de langstlevende van de echtgenoten;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel61
  - number: 61.1.b
    text: |-
      bij ontstentenis van de in onderdeel *a* bedoelde persoon, de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel61
  - number: 61.1.c
    text: |-
      bij ontstentenis van de in de onderdelen *a* en *b* bedoelde personen degenen ten aanzien van wie de overledene
      grotendeels in de kosten van bestaan voorzag en met wie hij in gezinsverband leefde.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel61
  - number: '61.2'
    text: |-
      Met de verzekerde aan wie een arbeidsongeschiktheidsuitkering is toegekend, wordt voor de toepassing van dit
      artikel gelijkgesteld, de persoon wiens overlijden heeft plaatsgevonden in de maand waarin hij de leeftijd van 65
      jaar zou hebben bereikt, doch voor het bereiken van deze leeftijd is overleden, en die uitsluitend op grond van
      [artikel 19, eerste lid, onderdeel a][ref1], over de dag van zijn overlijden geen recht op uitkering had.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '61.3'
    text: |-
      De overlijdensuitkering is gelijk aan het bedrag van de uitkering over één maand, doch niet over de zaterdagen
      en de zondagen, berekend naar de hoogte van die uitkering op de dag of laatstelijk voor de dag van overlijden van
      de verzekerde.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel61
  - number: '61.4'
    text: |-
      In verband met het overlijden van de verzekerde aan wie een uitkering is toegekend, is
      [artikel 19, eerste lid, onderdeel a][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '61.5'
    text: |-
      De overlijdensuitkering wordt op aanvraag aan de rechthebbende of rechthebbenden, bedoeld in het eerste lid, door
      het Uitvoeringsinstituut werknemersverzekeringen betaald.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel61
  - number: '61.6'
    text: De overlijdensuitkering wordt in een bedrag ineens betaald.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel61
  - number: '61.7'
    text: |-
      Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan arbeidsongeschiktheidsuitkering dat over
      na het overlijden gelegen dagen reeds is betaald.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel61
  - number: '62'
    text: |-
      Uitkeringen op grond van deze wet die niet in ontvangst zijn genomen of zijn ingevorderd binnen twee jaren na de
      dag van betaalbaarstelling, worden niet meer betaald.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel62
  - number: '63.1'
    text: |-
      De uitkering die als gevolg van een besluit als bedoeld in [artikel 18][ref1] onverschuldigd is verstrekt, alsmede
      hetgeen anderszins onverschuldigd is betaald, wordt door het Uitvoeringsinstituut werknemersverzekeringen van de
      belanghebbende teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel18
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '63.2'
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van terugvordering
      of van verdere terugvordering af te zien, indien de belanghebbende:
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel63
  - number: 63.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel63
  - number: 63.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel63
  - number: 63.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel63
  - number: 63.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel63
  - number: '63.3'
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel63
  - number: 63.3.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de [artikelen 475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 63.3.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 70][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
  - number: '63.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel63
  - number: '63.5'
    text: |-
      Het besluit tot terugvordering vermeldt hetgeen wordt teruggevorderd, de termijn of termijnen waarbinnen moet
      worden betaald, alsmede dat het besluit bij gebreke van tijdige betaling zal worden tenuitvoergelegd op de wijze
      als omschreven in [artikel 64][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel64
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '64'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '63.6'
    text: |-
      De persoon van wie of de instelling waarvan wordt teruggevorderd is verplicht desgevraagd aan het
      Uitvoeringsinstituut werknemersverzekeringen de inlichtingen te verstrekken die voor de terugvordering van belang
      zijn.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel63
  - number: '63.7'
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen, onder voorwaarden die Onze
      Minister kan stellen, besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze
      Minister vast te stellen bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel63
  - number: '64.1'
    text: |-
      Het besluit tot terugvordering levert een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van
      Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel64
  - number: '64.2'
    text: |-
      Artikel 54 is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475c][ref1] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan, het Uitvoeringsinstituut
      werknemersverzekeringen de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: '65'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de
      [artikelen 63, eerste, tweede, derde, vierde, vijfde, zesde en zevende lid][ref1], en [64][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel64
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '63'
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '64'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '66.1'
    text: |-
      De arbeidsongeschiktheidsuitkering, de verhoging van de arbeidsongeschiktheidsuitkering, bedoeld in
      [artikel 10][ref1] en de vakantie-uitkering zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel10
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 66.1.a
    text: onvervreemdbaar;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel66
  - number: 66.1.b
    text: niet vatbaar voor verpanding of belening.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel66
  - number: '66.2'
    text: Volmacht tot ontvangst van een uitkering onder welke vorm of welke benaming ook verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel66
  - number: '66.3'
    text: Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel66
  - number: '67'
    text: 'Niet vatbaar voor beslag zijn:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel67
  - number: 67.a
    text: |-
      de verhoging, bedoeld in [artikel 10][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel10
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 67.b
    text: |-
      de overlijdensuitkering, bedoeld in [artikel 61][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel61
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '61'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '68'
    text: |-
      Bij de vaststelling van de schadevergoeding, waarop de verzekerde naar burgerlijk recht aanspraak kan maken ter
      zake van zijn arbeidsongeschiktheid, houdt de rechter rekening met de aanspraken, die hij op grond van deze wet
      heeft.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel68
  - number: '69.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft voor de op grond van deze wet gemaakte kosten verhaal op de
      persoon die in verband met het veroorzaken van arbeidsongeschiktheid jegens de verzekerde naar burgerlijk recht tot
      schadevergoeding is verplicht, doch ten hoogste tot het bedrag, waarvoor deze bij het ontbreken van de aanspraken
      krachtens deze wet naar burgerlijk recht aansprakelijk zou zijn, verminderd met een bedrag, gelijk aan dat van
      de schadevergoeding tot betaling waarvan de aansprakelijke persoon jegens de verzekerde naar burgerlijk recht is
      gehouden.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel69
  - number: '69.2'
    text: |-
      Overeenkomstig door Onze Minister te stellen regels kan het Uitvoeringsinstituut werknemersverzekeringen in plaats
      van het bedrag van de periodieke verstrekkingen de contante waarde daarvan vorderen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel69
  - number: '70.1'
    text: |-
      De verzekerde, diens wettelijke vertegenwoordiger alsmede de instelling, bedoeld in [artikel 57][ref1], waaraan
      arbeidsongeschiktheidsuitkering wordt betaald, zijn verplicht aan het Uitvoeringsinstituut werknemersverzekeringen,
      op zijn verzoek of onverwijld uit eigen beweging alle feiten en omstandigheden mee te delen, waarvan hun
      redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op uitkering, de hoogte van de
      uitkering, het geldend maken van het recht op uitkering of op het bedrag van de uitkering, dat wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel57
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '57'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '70.2'
    text: |-
      Op de verzekerde die aanspraak maakt op of recht heeft op vakantie-uitkering alsmede op diens wettelijke
      vertegenwoordiger, rusten overeenkomstige verplichtingen als omschreven in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel70
  - number: '71.1'
    text: |-
      De verzekerde, bedoeld in [artikel 3, eerste lid, onderdelen a en b, en vierde lid][ref1], is premie verschuldigd
      over zijn premie-inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '3'
        hoofdstuk: '2'
  - number: '71.2'
    text: |-
      De premieplicht eindigt met ingang van de eerste dag van de maand waarin de premieplichtige de leeftijd van 65
      jaar bereikt.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel71
  - number: '72.1'
    text: |-
      Het premie-inkomen is het gezamenlijke bedrag van de in het kalenderjaar genoten winst uit onderneming, winst
      uit Nederlandse onderneming en zuivere inkomsten uit buiten dienstbetrekking verrichte tegenwoordige arbeid. Voor
      de toepassing van dit artikel worden onder zuivere inkomsten uit buiten dienstbetrekking verrichte tegenwoordige
      arbeid verstaan andere dan uit dienstbetrekking genoten inkomsten uit tegenwoordige arbeid nadat deze zijn
      verminderd met de werknemersaftrek bedoeld in [artikel 3.85 van de Wet inkomstenbelasting 2001][ref1], die
      betrekking heeft op de inkomsten uit tegenwoordige arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '72.2'
    text: |-
      Het premie-inkomen wordt voor de premieheffing tot geen hoger bedrag in aanmerking genomen dan het door Onze
      Minister in overeenstemming met de Minister van Financiën bij ministeriële regeling aan te wijzen bedrag.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel72
  - number: 72a.1
    text: |-
      Op aanvraag wordt aan de verzekerde die gedurende een tijdvak van drie aaneengesloten gehele kalenderjaren,
      hierna te noemen het middelingstijdvak, premieplichtig is geweest op grond van deze wet een teruggaaf van premie,
      hierna te noemen een middelingsteruggaaf, verleend. Het kalenderjaar waarin de verzekerde de leeftijd van 65 jaar
      bereikt wordt niet in een middelingstijdvak betrokken. Een kalenderjaar behorende tot een tijdvak waarover een
      middelingsteruggaaf is verleend, wordt niet in een ander middelingstijdvak betrokken.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel72a
  - number: 72a.2
    text: |-
      De teruggaaf van betaalde premie bedraagt het verschil van de premie die over het middelingstijdvak is geheven en
      de premie die verschuldigd zou zijn indien het premie-inkomen in elk van die jaren een derde gedeelte zou bedragen
      van het totaal van de premie-inkomens in die jaren, voor zover dit verschil groter is dan € 545. Voor de toepassing
      van de eerste zin wordt een premie-inkomen in een kalenderjaar ten minste op nihil gesteld.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel72a
  - number: 72a.3
    text: |-
      De aanvraag wordt gedaan bij de inspecteur van de rijksbelastingdienst binnen 36 maanden nadat de op de jaren van
      het middelingstijdvak betrekking hebbende aanslagen inzake premie onherroepelijk zijn geworden. Ingeval over een
      jaar van het middelingstijdvak wordt nagevorderd of bij beschikking een aanslag wordt verminderd, terwijl op het
      tijdstip van het onherroepelijk worden van de navorderingsaanslag of de beschikking de in de eerste zin bedoelde
      termijn van 36 maanden voor meer dan 34 maanden is verstreken, kan een aanvraag van teruggaaf tevens worden gedaan
      binnen twee maanden na dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel72a
  - number: 72a.4
    text: De inspecteur van de rijksbelastingdienst beslist op de aanvraag bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel72a
  - number: '73.1'
    text: |-
      De premie voor de verzekering wordt vastgesteld op een percentage van het in aanmerking te nemen premie-inkomen
      verminderd met een door Onze Minister in overeenstemming met de Minister van Financiën bij ministeriële regeling
      aan te wijzen bedrag dan wel met het bedrag van de inkomsten uit dienstbetrekking indien dit hoger is.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel73
  - number: '73.2'
    text: |-
      Onze Minister stelt het premiepercentage vast, alsmede het tijdvak waarvoor dat percentage geldt, voor de
      verzekering op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel73
  - number: '74'
    text: |-
      Indien een wijziging van een premiepercentage ingaat op een ander tijdstip dan met ingang van 1 januari, wordt bij
      ministeriële regeling, in overeenstemming met de Minister van Financiën, een gemiddeld premiepercentage vastgesteld
      voor door Onze Minister aan te wijzen tijdvakken.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel74
  - number: '75.1'
    text: |-
      De op grond van dit hoofdstuk verschuldigde premie wordt geheven en ingevorderd overeenkomstig de voor de heffing
      en de invordering van de inkomstenbelasting geldende regels, met dien verstande dat de [artikelen 3.154][ref1] en
      [9.4 van de Wet inkomstenbelasting 2001][ref2] buiten toepassing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '9'
  - number: '75.2'
    text: De premie wordt geheven en ingevorderd door de rijksbelastingdienst.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel75
  - number: '75.3'
    text: |-
      De aanslag premie en de aanslag inkomstenbelasting kunnen op een aanslagbiljet worden verenigd. In dat geval worden
      de bedragen van de aanslagen afzonderlijk vermeld.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel75
  - number: '75.4'
    text: |-
      Indien geen aanslag inkomstenbelasting wordt vastgesteld wordt evenmin een aanslag premie vastgesteld. De eerste
      zin is niet van toepassing ingeval aan loonbelasting onderworpen inkomsten uit tegenwoordige arbeid worden genoten,
      anders dan uit dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel75
  - number: '76'
    text: |-
      Indien de premie die op grond van dit hoofdstuk is verschuldigd door de verzekerden,
      bedoeld in [artikel 5][ref1], met uitzondering van de verzekerden die op grond van
      [artikel 6 van de Wet op de arbeidsongeschiktheidsverzekering][ref2] als directeur-grootaandeelhouder worden
      beschouwd, onvoldoende is om de uitgaven, bedoeld in [artikel 80][ref3], met betrekking tot deze verzekerden in een
      kalenderjaar te bekostigen, komt het verschil ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel80
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '80'
        hoofdstuk: '6'
  - number: '77'
    text: |-
      Bij ministeriële regeling kunnen in overeenstemming met de Minister van Financiën nadere en zonodig afwijkende
      regels worden gesteld met betrekking tot de [artikelen 71 tot en met 76][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel71
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '71'
        hoofdstuk: '6'
  - number: '78.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beheert en administreert afzonderlijk de in [artikel 79][ref1]
      bedoelde middelen tot dekking van de uitgaven en de uitgaven, bedoeld in [artikel 80][ref2], alsmede de middelen
      benodigd voor het vormen en in stand houden van een reserve, in de vorm van een Arbeidsongeschiktheidsfonds
      zelfstandigen dat deel uitmaakt van het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel80
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '79'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '80'
        hoofdstuk: '6'
  - number: '78.2'
    text: |-
      De middelen voor het vormen en instandhouden van een reserve worden gevonden uit de ten gunste van het
      Arbeidsongeschiktheidsfonds zelfstandigen komende premies.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel78
  - number: '78.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen bezigt de op grond van het eerste lid gereserveerde gelden niet
      tot bestrijding van uitgaven ten laste van het Arbeidsongeschiktheidsfonds zelfstandigen dan met toestemming van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel78
  - number: '79'
    text: 'Ten gunste van het Arbeidsongeschiktheidsfonds zelfstandigen komen:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel79
  - number: 79.a
    text: |-
      de premie, bedoeld in [artikel 73][ref1], en de premievervangende belasting, bedoeld in [artikel 91][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel91
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '73'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '91'
        hoofdstuk: '8'
  - number: 79.b
    text: |-
      het bedrag, bedoeld in [artikel 56][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel56
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '56'
        hoofdstuk: '3'
        afdeling: '3'
  - number: 79.c
    text: |-
      de boeten, bedoeld in [artikel 48][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel48
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 79.d
    text: |-
      de bedragen die het Uitvoeringsinstituut werknemersverzekeringen ontvangt met toepassing van verhaal als bedoeld
      in [artikel 69][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel69
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '69'
        hoofdstuk: '4'
  - number: 79.e
    text: |-
      de rijksbijdrage, bedoeld in [artikel 76][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel76
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '76'
        hoofdstuk: '6'
  - number: '80'
    text: 'Ten laste van het Arbeidsongeschiktheidsfonds zelfstandigen komen:'
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel80
  - number: 80.a
    text: de op grond van deze wet te betalen uitkeringen;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel80
  - number: 80.b
    text: |-
      de op grond van enige wet over de uitkeringen op grond van deze wet door het Uitvoeringsinstituut
      werknemersverzekeringen verschuldigde premies die niet op deze uitkeringen in mindering kunnen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel80
  - number: 80.c
    text: |-
      het op grond van [artikel 58, vierde lid][ref1], aan 's Rijks kas af te dragen bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel58
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '58'
        hoofdstuk: '3'
        afdeling: '3'
  - number: 80.d
    text: |-
      het op grond van [artikel 42 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] aan het Reïntegratiefonds
      af te dragen bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel42
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '42'
  - number: 80.e
    text: de aan de uitvoering van deze wet verbonden kosten;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel80
  - number: 80.f
    text: |-
      de op grond van [hoofdstuk 3, afdeling 2, paragraaf 2, van de Wet arbeid en zorg][ref1] te betalen uitkeringen en
      de daaraan verbonden uitvoeringskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0013008
        paragraaf: '2'
  - number: '81.1'
    text: |-
      De verzekerde, bedoeld in [artikel 3][ref1], is verzekerd bij het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '3'
        hoofdstuk: '2'
  - number: '81.2'
    text: |-
      In de uitvoering van de in deze wet geregelde verzekering wordt, behoudens de uitvoering die op grond van enig
      artikel van deze wet aan een ander is opgedragen, voorzien door het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel81
  - number: '86'
    text: |-
      De heropende arbeidsongeschiktheidsuitkering wordt beschouwd als een voortzetting van de ingetrokken uitkering.
      Voor de toepassing van de [artikelen 14, tweede lid][ref1], [15, eerste lid, onderdeel c][ref2], en [16][ref3]
      wordt daarbij met herziening van de arbeidsongeschiktheidsuitkering wegens afneming van de arbeidsongeschiktheid
      gelijkgesteld intrekking van de arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel16
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '89.1'
    text: |-
      Van verplichtingen die bij of krachtens hoofdstuk 6 zijn opgelegd, wordt op zijn aanvraag ontheven de persoon, die
      gemoedsbezwaren heeft tegen de in deze wet geregelde verzekering.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel89
  - number: '89.2'
    text: Een ontheffing wordt verleend door het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel89
  - number: '89.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen doet van het verlenen van een ontheffing, alsmede van het
      intrekken van een ontheffing mededeling aan de inspecteur van de rijksbelastingdienst binnen wiens ambtsgebied de
      persoon, ten aanzien van wie ontheffing is verleend dan wel is ingetrokken, woont of is gevestigd.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel89
  - number: '90'
    text: |-
      Indien op grond van artikel 89 ontheffing is verleend, wordt geen premie geheven, doch vindt voor de verzekering
      op grond van deze wet heffing en invordering van een premievervangende inkomstenbelasting plaats op zodanige wijze
      dat van de persoon, van wie anders premie zou worden geheven, inkomstenbelasting wordt geheven tot een bedrag van
      die premie.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel90
  - number: '91'
    text: |-
      De op de voet van artikel 90 verschuldigde premievervangende inkomstenbelasting wordt geheven en ingevorderd op de
      voet van hoofdstuk 6, als ware de premievervangende inkomstenbelasting premie.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel91
  - number: '92'
    text: |-
      Premie voor de verzekering op grond van deze wet, die als gevolg van een ontheffing als bedoeld in artikel 89, niet
      wordt geheven, komt ten laste van het Rijk.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel92
  - number: '93'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot dit hoofdstuk. Deze regels
      betreffen:
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel93
  - number: 93.a
    text: de voorschriften, waaronder een ontheffing wordt verleend;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel93
  - number: 93.b
    text: de verdere gevolgen die voor de toepassing van deze wet aan een ontheffing zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel93
  - number: 93.c
    text: de gevallen, waarin een ontheffing wordt ingetrokken; en
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel93
  - number: 93.d
    text: |-
      de gevolgen die voor de toepassing van deze wet zijn verbonden aan een ontheffing en aan een intrekking van een
      ontheffing.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel93
  - number: '94'
    text: |-
      Bij een besluit op grond van deze wet dat betrekking heeft op het al dan niet bestaan of voortbestaan dan wel de
      mate van arbeidsongeschiktheid is belanghebbende de persoon op wiens aanspraken het besluit betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel94
  - number: '95.1'
    text: |-
      Onverminderd de [artikelen 72a][ref1], [75][ref2] en [95a][ref3], worden de beschikkingen op grond van deze wet en
      de daarop berustende bepalingen gegeven binnen een redelijke termijn na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel72a
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel95a
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 72a
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '75'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: 95a
        hoofdstuk: '9'
  - number: '95.2'
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel95
  - number: '95.3'
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel95
  - number: '95.4'
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen acht weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel95
  - number: 95a.1
    text: |-
      Een beschikking over het verzekerd zijn op grond van deze wet, over de toekenning van een
      arbeidsongeschiktheidsuitkering, over voortzetting van een arbeidsongeschiktheidsuitkering als
      bedoeld in [artikel 35, vierde lid][ref1], dan wel over herziening, intrekking of heropening van een
      arbeidsongeschiktheidsuitkering wordt gegeven binnen dertien weken na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel35
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel95a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 95a.2
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid advies is gevraagd aan een
      deskundige die niet onder verantwoordelijkheid van het Uitvoeringsinstituut werknemersverzekeringen werkzaam is
      en om die reden de beschikking niet binnen dertien weken gegeven kan worden, wordt die termijn verlengd met ten
      hoogste vier weken en wordt de aanvrager van deze verlenging schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel95a
  - number: 95a.3
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen dertien weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel95a
  - number: 95a.4
    text: |-
      Indien een beschikking als bedoeld in het eerste lid om andere dan de in het tweede en derde lid bedoelde redenen
      niet binnen dertien weken kan worden gegeven, wordt de aanvrager daarvan schriftelijk in kennis gesteld onder
      vermelding van een zo kort mogelijke termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel95a
  - number: '96.1'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '96.2'
    text: |-
      Indien bezwaar wordt gemaakt tegen een besluit waaraan een medische of arbeidskundige beoordeling ten grondslag
      ligt, beslist het Uitvoeringsinstituut werknemersverzekeringen binnen zeventien weken of, indien het advies vraagt
      aan een deskundige die niet onder zijn verantwoordelijkheid werkzaam is binnen een en twintig weken, na ontvangst
      van het bezwaarschrift.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel96
  - number: '97'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de behandeling van bezwaarschriften
      tegen besluiten, waaraan een medische of arbeidskundige beoordeling ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel97
  - number: '98.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van de [artikelen 1, derde tot en met zevende lid][ref1], [3 tot en met 6][ref2]
      en de op die artikelen berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '3'
        hoofdstuk: '2'
  - number: '98.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven inzake
      beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats inneemt
      van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel98
  - number: '99'
    text: |-
      Overtreding van bepalingen van een krachtens deze wet uitgevaardigde algemene maatregel van bestuur voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met een hechtenis van ten
      hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel99
  - number: '100'
    text: |-
      Het recht tot strafvordering vervalt indien het Uitvoeringsinstituut werknemersverzekeringen aan de verzekerde of
      zijn wettelijke vertegenwoordiger ter zake van hetzelfde feit reeds een boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel100
  - number: '101'
    text: |-
      De in [artikel 99][ref1] bedoelde strafbare feiten worden als overtredingen beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel99
    url: https://wetten.overheid.nl/BWBR0008656/2004-03-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '99'
        hoofdstuk: '10'
  - number: '102'
    text: |-
      De [Algemene termijnenwet][ref1] is niet van toepassing op de tijdvakken van vier weken, genoemd in de
      [artikelen 7, derde en vierde lid][ref2], [13, vierde lid][ref3], [14][ref4], [15, eerste lid][ref5], [16][ref6],
      [20][ref7] en [21][ref8].


