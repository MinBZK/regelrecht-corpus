  - number: '55'
    text: |-
      1 De arbeidsongeschiktheidsuitkering wordt betaalbaar gesteld door het Uitvoeringsinstituut
      werknemersverzekeringen. De betaling geschiedt als regel in tijdvakken van een maand.

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan een uitkering als bedoeld in het eerste lid, over een door
      hem te bepalen tijdvak bij wege van voorschot betaalbaar stellen, indien onzekerheid bestaat over het recht op
      of de hoogte van de uitkering of de hoogte van het te betalen bedrag aan uitkering. Een verleend voorschot wordt
      verrekend met het definitief vastgestelde bedrag aan uitkering dat over het desbetreffende tijdvak wordt betaald.

      3 Onverminderd het tweede lid, schort het Uitvoeringsinstituut werknemersverzekeringen de betaling van de
      arbeidsongeschiktheidsuitkering op of schorst het de betaling, indien het op grond van duidelijke aanwijzingen van
      oordeel is of het gegronde vermoeden heeft dat:

      a. het recht op uitkering niet of niet meer bestaat;

      b. recht op een lagere uitkering bestaat;

      c. de verzekerde of zijn wettelijke vertegenwoordiger een verplichting als bedoeld in [artikel 45][ref1],
      [46][ref2] of [70][ref3] niet of niet behoorlijk is nagekomen.

      4 Ingeval de arbeidsongeschiktheidsuitkering in het buitenland wordt betaald worden de daaraan verbonden kosten van
      overmaking op de uitkering in mindering gebracht.

      5 Wanneer de verzekerde, aan wie een arbeidsongeschiktheidsuitkering is toegekend, een ander machtigt om de
      uitkering in ontvangst te nemen, onderscheidenlijk een verleende machtiging intrekt, wordt daaraan gevolg gegeven
      met ingang van een betalingstijdvak, aanvangende na de dag waarop de machtiging wordt ingediend, onderscheidenlijk
      waarop van haar intrekking mededeling wordt gedaan, doch niet later dan de eerste dag van de tweede maand na de dag
      van indiening onderscheidenlijk de mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel70
