      1 De verzekerde, bedoeld in [artikel 3][ref1], is verzekerd bij het Uitvoeringsinstituut werknemersverzekeringen.

      2 In de uitvoering van de in deze wet geregelde verzekering wordt, behoudens de uitvoering die op grond van enig
      artikel van deze wet aan een ander is opgedragen, voorzien door het Uitvoeringsinstituut werknemersverzekeringen.


