  - number: '9'
    text: |-
      1 De arbeidsongeschiktheidsuitkering bedraagt per dag, de zaterdagen en zondagen niet meegerekend, bij een
      arbeidsongeschiktheid van:








                    25–35%:


                    21% van de grondslag;




                    35–45%:


                    28% van de grondslag;




                    45–55%:


                    35% van de grondslag;




                    55–65%:


                    42% van de grondslag;




                    65–80%:


                    50,75% van de grondslag;




                    80% of meer:


                    70% van de grondslag.






      2 Bij de vaststelling van de mate van arbeidsongeschiktheid wordt, zoveel doenlijk, rekening gehouden met verkregen
      nieuwe bekwaamheden.
