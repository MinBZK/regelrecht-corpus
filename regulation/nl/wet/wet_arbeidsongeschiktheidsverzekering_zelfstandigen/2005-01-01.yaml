  - number: '59'
    text: |-
      1 Indien terzake van arbeidsongeschiktheid recht bestaat op:

      a. zowel herziening van de arbeidsongeschiktheidsuitkering in verband met de
      [artikelen 12 tot en met 17][ref1] als op toekenning van een arbeidsongeschiktheidsuitkering op grond
      van de [Wet op de arbeidsongeschiktheidsverzekering][ref2] uit hoofde van een dienstbetrekking die is
      aangevangen na het intreden van de arbeidsongeschiktheid op grond waarvan recht is ontstaan op eerstbedoelde
      arbeidsongeschiktheidsuitkering; of

      b. zowel toekenning van arbeidsongeschiktheidsuitkering op grond van [artikel 20][ref3] als toekenning van
      een arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref4]
      uit hoofde van een dienstbetrekking die is aangevangen na het intreden van de arbeidsongeschiktheid op
      grond waarvan de arbeidsongeschiktheidsuitkering, bedoeld in [artikel 20, eerste lid, onderdeel a][ref5],
      werd toegekend dan wel tijdens of na de wachttijd, bedoeld in onderdeel b van dat lid; wordt de
      arbeidsongeschiktheidsuitkering uitbetaald voorzover deze de arbeidsongeschiktheidsuitkering op grond van
      de [Wet op de arbeidsongeschiktheidsverzekering][ref6] overtreft. In de situatie, bedoeld onder a, wordt de
      arbeidsongeschiktheidsuitkering in ieder geval uitbetaald tot de hoogte van het bedrag onmiddellijk voorafgaande
      aan de herziening.

      2 Indien terzake van arbeidsongeschiktheid recht bestaat op:

      a. zowel herziening van de arbeidsongeschiktheidsuitkering op grond van
      de [Wet op de arbeidsongeschiktheidsverzekering][ref7] in verband met de
      [artikelen 36 tot en met 40 van die wet][ref8] als toekenning van een arbeidsongeschiktheidsuitkering uit hoofde
      van werkzaamheden als verzekerde die zijn aangevangen na het intreden van de arbeidsongeschiktheid op grond waarvan
      recht is ontstaan op eerstbedoelde arbeidsongeschiktheidsuitkering; of

      b. zowel toekenning van arbeidsongeschiktheidsuitkering op grond van
      [artikel 43a van de Wet op de arbeidsongeschiktheidsverzekering][ref9] als toekenning van een
      arbeidsongeschiktheidsuitkering uit hoofde van werkzaamheden als verzekerde die zijn aangevangen na het
      intreden van de arbeidsongeschiktheid op grond waarvan de arbeidsongeschiktheidsuitkering, bedoeld in
      [artikel 43a, eerste lid, onderdeel a, van de Wet op de arbeidsongeschiktheidsverzekering][ref10], werd toegekend
      dan wel tijdens of na de wachttijd, bedoeld in onderdeel b van dat lid; wordt de arbeidsongeschiktheidsuitkering
      uitbetaald voorzover deze de herziene of toegekende arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering overtreft][ref11].

      3 Voor de toepassing van het eerste en tweede lid wordt onder arbeidsongeschiktheidsuitkering en
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref12] tevens
      verstaan de vakantie-uitkering waarop uit hoofde van die arbeidsongeschiktheidsuitkeringen recht bestaat, voor
      zover die vakantie-uitkering over dezelfde periode is berekend.

      4 Het eerste en tweede lid zijn niet van toepassing op de persoon die een
      arbeidsongeschiktheidsuitkering ontvangt op grond van de vrijwillige verzekering, bedoeld in
      [hoofdstuk VI van de Wet op de arbeidsongeschiktheidsverzekering][ref13].

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld:

      a. met betrekking tot het eerste tot en met derde lid;

      b. ter voorkoming of beperking van samenloop van arbeidsongeschiktheidsuitkering met de in het eerste tot en met
      derde lid bedoelde uitkeringen in situaties waarin deze leden niet of onvoldoende voorzien;

      c. ter voorkoming of beperking van samenloop van arbeidsongeschiktheidsuitkering op grond van deze wet met
      uitkering op grond van andere wetten.

      6 Bij algemene maatregel van bestuur kunnen regels worden gesteld ter voorkoming of beperking van samenloop van
      arbeidsongeschiktheidsuitkering met uitkering op grond van de sociale wetgeving van de Nederlandse Antillen, Aruba
      of van een andere Mogendheid.


