  - number: '21'
    text: |-
      1 De persoon, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45%, in
      verband met [artikel 19, eerste lid, onderdeel ][ref1], is ingetrokken, heeft, indien hij binnen vier weken na de
      dag, met ingang waarvan de uitkering is ingetrokken, weer arbeidsongeschikt wordt, aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering.

      2 Het eerste lid is mede van toepassing ten aanzien van de persoon, wiens arbeidsongeschiktheidsuitkering, berekend
      naar een arbeidsongeschiktheid van minder dan 45% in verband met [artikel 19, eerste lid, onderdeel ][ref2],
      is ingetrokken, indien hij weer arbeidsongeschikt wordt binnen vier weken na de dag, met ingang waarvan die
      uitkering, die voordien was berekend naar een arbeidsongeschiktheid van ten minste 45%, wegens afneming van de
      arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder dan 45%.

      3 De persoon, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan 45%,
      in verband met [artikel 19, eerste lid, onderdeel ][ref3], is ingetrokken met ingang van een dag, gelegen binnen
      vier weken na de dag, met ingang waarvan die uitkering werd toegekend of wegens toegenomen arbeidsongeschiktheid
      werd herzien, heeft, indien hij binnen die vier weken weer arbeidsongeschikt wordt, aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering. [Artikel 15, tweede lid][ref4], is van overeenkomstige toepassing.

      4 De persoon, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan
      45%, in verband met [artikel 19, eerste lid, onderdeel ][ref5], is ingetrokken, heeft, onverminderd het tweede
      en het derde lid, indien hij binnen vier weken na de dag, met ingang waarvan de uitkering is ingetrokken,
      weer arbeidsongeschikt wordt, niet kennelijk uit een andere oorzaak dan die, waaruit de arbeidsongeschiktheid,
      ter zake waarvan de ingetrokken uitkering werd genoten, is voortgekomen, aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering.

      5 De heropening vindt plaats naar de mate van arbeidsongeschiktheid op de dag, waarop de heropening ingaat.

      6 Voor de toepassing van het eerste tot en met vijfde lid wordt niet als arbeidsongeschikt beschouwd de persoon die
      minder dan 25% arbeidsongeschikt is.

      7 [Artikel 7b][ref6] en de daarop berustende bepalingen zijn van overeenkomstige toepassing.


