  - number: '13'
    text: |-
      1 Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering,
      berekend naar een arbeidsongeschiktheid van minder dan 45%, onverminderd de [artikelen 15][ref1] en [16][ref2],
      plaats zodra de toegenomen arbeidsongeschiktheid onafgebroken 52 weken heeft geduurd.

      2 De in het eerste lid bedoelde herziening vindt niet plaats, indien de toeneming kennelijk is voortgekomen uit een
      andere oorzaak dan die waaruit de ongeschiktheid ter zake waarvan uitkering wordt genoten, is voortgekomen.

      3 Indien de uitkeringsgerechtigde bij het intreden van de toeneming van de arbeidsongeschiktheid of in de 52
      weken onmiddellijk voorafgaande aan de toeneming van de arbeidsongeschiktheid arbeid verricht of heeft verricht
      als bedoeld in [artikel 7, eerste lid][ref3], vindt de in het eerste lid bedoelde herziening plaats, ook indien
      de toeneming kennelijk is voortgekomen uit een andere oorzaak dan die waaruit de ongeschiktheid ter zake waarvan
      uitkering wordt genoten, is voortgekomen.

      4 Voor het bepalen van het tijdvak van 52 weken, bedoeld in het eerste lid, worden perioden van toegenomen
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken
      opvolgen. Bij de vaststelling van zowel het tijdvak van 52 weken als de periode van vier weken blijven
      perioden, waarin uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:18][ref4] of
      [3:30, eerste lid, van de Wet arbeid en zorg][ref5] wordt genoten, buiten beschouwing.


