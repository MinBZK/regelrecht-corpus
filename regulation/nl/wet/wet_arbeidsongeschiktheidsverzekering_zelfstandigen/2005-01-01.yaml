  - number: '40'
    text: |-
      De vakantie-uitkering wordt ambtshalve of, ingeval [artikel 60, eerste lid, tweede zin][ref1], toepassing vindt, op
      aanvraag door het Uitvoeringsinstituut werknemersverzekeringen toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel60
    url: https://wetten.overheid.nl/BWBR0008656/2005-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '60'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '41'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen kan, telkens wanneer het dat nodig oordeelt, de verzekerde
      oproepen of doen oproepen en op een door of namens hem te bepalen plaats ondervragen of doen ondervragen.

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan de in het eerste lid bedoelde personen op een door of namens
      hem te bepalen plaats door een of meer daartoe door hem aangewezen deskundigen doen onderzoeken.

      3 De daartoe door het Uitvoeringsinstituut werknemersverzekeringen aangewezen deskundige kan, ook zonder opdracht
      van het Uitvoeringsinstituut werknemersverzekeringen, de in het eerste lid bedoelde personen oproepen, ondervragen,
      doen oproepen, doen ondervragen en onderzoeken of doen onderzoeken door een of meer door hem daartoe aangewezen
      deskundigen.
    url: https://wetten.overheid.nl/BWBR0008656/2005-01-01#Artikel41
  - number: '42'
    text: |-
      Opgeroepenen en, indien hun toestand geleide nodig maakt, mede hun geleiders, worden reiskosten, verblijfkosten
      en tijdverlies vergoed in de gevallen en volgens regels die door het Uitvoeringsinstituut werknemersverzekeringen
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008656/2005-01-01#Artikel42
  - number: '43'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen en de door hem daartoe aangewezen deskundige kunnen de personen,
      bedoeld in [artikel 41, eerste lid][ref1], voorschriften geven in het belang van een behandeling of van genezing of
      tot behoud, herstel en bevordering van de mogelijkheid tot het verrichten van arbeid.

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan voorschrijven dat de personen, bedoeld in
      [artikel 41, eerste lid][ref2], zich laten registreren als werkzoekende bij de Centrale organisatie werk en
      inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel41
    url: https://wetten.overheid.nl/BWBR0008656/2005-01-01#Artikel43
