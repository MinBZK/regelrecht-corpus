  - number: 21a
    text: |-
      1 De persoon, wiens arbeidsongeschiktheidsuitkering in verband met [artikel 19a, eerste lid][ref1], is geëindigd,
      heeft vanaf de dag:

      a. dat hij in Nederland woont; of

      b. dat hij in een land woont waarmee een verdrag in werking is getreden dan wel een besluit van een
      volkenrechtelijke organisatie van kracht is geworden, op grond waarvan recht op arbeidsongeschiktheidsuitkering
      kan bestaan;

      met inachtneming van de bepalingen van deze wet aanspraak op heropening van de arbeidsongeschiktheidsuitkering,
      indien hij op die dag arbeidsongeschikt is.

      2 Aanspraak op heropening van de arbeidsongeschiktheidsuitkering heeft eveneens de persoon, bedoeld in het eerste
      lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval is
      binnen vier weken na afloop van dat tijdvak.

      3 De [artikelen 7, zesde lid][ref2], [36][ref3] en [37][ref4], zijn van overeenkomstige toepassing met betrekking
      tot de aanspraak op heropening van de arbeidsongeschiktheidsuitkering, bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel7
