  - number: 7a
    text: |-
      1 De verzekerde, bedoeld in [artikel 7][ref1], heeft geen recht op arbeidsongeschiktheidsuitkering, indien de dag
      waarop het recht op arbeidsongeschiktheidsuitkering zou ingaan, is gelegen in een periode dat hij niet in Nederland
      woont.

      2 Het eerste lid is niet van toepassing indien de verzekerde op die dag woont in een land waarin op grond van een
      verdrag of een besluit van een volkenrechtelijke organisatie recht op arbeidsongeschiktheidsuitkering kan bestaan.

      3 De persoon, die op grond van het eerste lid geen recht op arbeidsongeschiktheidsuitkering heeft, heeft vanaf
      de dag:

      a. dat hij in Nederland woont; of

      b. dat hij in een land woont waarmee een verdrag in werking is getreden dan wel een besluit van een
      volkenrechtelijke organisatie van kracht is geworden, op grond waarvan recht op arbeidsongeschiktheidsuitkering
      kan bestaan;

      met inachtneming van de bepalingen van deze wet recht op arbeidsongeschiktheidsuitkering, indien hij op die dag
      arbeidsongeschikt is. [Artikel 7, zesde lid][ref2], is van overeenkomstige toepassing.

      4 De persoon, bedoeld in het derde lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten
      aanzien van wie dat wel het geval is binnen vier weken na die dag, heeft met inachtneming van de bepalingen
      van deze wet recht op toekenning van arbeidsongeschiktheidsuitkering. [Artikel 7, zesde lid][ref3], is van
      overeenkomstige toepassing.

      5 Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het eerste lid afwijkende regels worden
      gesteld ten gunste van:

      a. de verzekerde, die tevens werkzaamheden verricht in het algemeen belang en niet in Nederland woont;

      b. de verzekerde, die in de Nederlandse Antillen of Aruba woont; of

      c. de gezinsleden van de in de onderdelen a of b bedoelde verzekerde.

      6 Onze Minister deelt mede in welke landen op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op arbeidsongeschiktheidsuitkering kan bestaan. In deze mededeling wordt tevens opgenomen:

      a. de vindplaats van het desbetreffende verdrag of besluit, en

      b. de eventueel in dat verdrag of besluit aanwezige beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel7
