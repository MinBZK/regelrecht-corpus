  - number: '5'
    text: |-
      Beroepsbeoefenaar is de persoon, jonger dan 65 jaar, die:

      a. anders dan uit dienstbetrekking inkomsten uit tegenwoordige arbeid geniet;

      b. anders dan in dienstbetrekking arbeid verricht ten behoeve van een lichaam waarin hij een aanmerkelijk belang
      heeft.
    url: https://wetten.overheid.nl/BWBR0008656/2005-01-01#Artikel5
  - number: '6'
    text: |-
      Meewerkende echtgenoot is de persoon jonger dan 65 jaar die anders dan in dienstbetrekking, als zelfstandige of als
      beroepsbeoefenaar, meewerkt in de onderneming van zijn echtgenoot.
    url: https://wetten.overheid.nl/BWBR0008656/2005-01-01#Artikel6
  - number: '7'
    text: |-
      1 Recht op arbeidsongeschiktheidsuitkering heeft de verzekerde die arbeidsongeschikt wordt indien hij in de
      52 weken onmiddellijk voorafgaande aan de dag, waarop de arbeidsongeschiktheid is ingetreden, arbeid in het
      bedrijfs- of beroepsleven heeft verricht gericht op het verwerven van winst of inkomsten. Als eerste dag van
      de arbeidsongeschiktheid geldt de eerste werkdag waarop wegens ziekte niet is gewerkt of het werken tijdens de
      werktijd is gestaakt. Het Uitvoeringsinstituut werknemersverzekeringen kan regels stellen inzake welke dag als
      eerste werkdag wordt aangemerkt.

      2 Het recht op arbeidsongeschiktheidsuitkering gaat niet eerder in dan nadat de arbeidsongeschiktheid onafgebroken
      52 weken heeft geduurd en na afloop van dat tijdvak voortduurt.

      3 Voor het bepalen van het tijdvak van 52 weken, bedoeld in het tweede lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met onderbreking van minder dan vier weken opvolgen. Bij
      de vaststelling van de periode van vier weken blijven perioden, waarin uitkering in verband met zwangerschap of
      bevalling op grond van [artikel 3:18][ref1] of [3:30, eerste lid, van de Wet arbeid en zorg][ref2] wordt genoten,
      buiten beschouwing.

      4 Recht op arbeidsongeschiktheidsuitkering heeft eveneens de verzekerde die na afloop van het in het tweede lid
      bedoelde tijdvak van 52 weken niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval is binnen vier
      onafgebroken weken na afloop van dat tijdvak.

      5 Voor het bepalen van het tijdvak van 52 weken, bedoeld in het tweede lid, worden steeds in aanmerking genomen
      tijdvakken, gedurende welke de verzekerde recht zou hebben gehad op ziekengeld op grond van de [Ziektewet][ref3],
      indien hij op grond van die wet zou zijn verzekerd.

      6 Voor de toepassing van het eerste tot en met vierde lid wordt niet als arbeidsongeschikt beschouwd de verzekerde
      die minder dan 25% arbeidsongeschikt is alsmede de verzekerde die een uitkering geniet als bedoeld in het derde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel318
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel330
