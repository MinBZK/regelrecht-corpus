  - number: '25'
    text: |-
      De verzekerde die over een maand recht heeft op arbeidsongeschiktheidsuitkering, heeft over die maand recht op
      vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0008656/2005-01-01#Artikel25
  - number: '26'
    text: |-
      1 De vakantie-uitkering bedraagt acht procent van het bedrag aan arbeidsongeschiktheidsuitkering, waarop recht
      bestond in het tijdvak van twaalf maanden, voorafgaande aan de maand mei.

      2 Indien [artikel 58][ref1] of [59][ref2] is toegepast, wordt onder het bedrag aan arbeidsongeschiktheidsuitkering,
      bedoeld in het eerste lid, verstaan het bedrag van de arbeidsongeschiktheidsuitkering, nadat dat artikel toepassing
      heeft gevonden.

      3 Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref3], wordt gewijzigd, treedt dit
      gewijzigde percentage in de plaats van het in het eerste lid genoemde percentage. Het gewijzigde percentage wordt
      in aanmerking genomen over de uitkering waarop recht bestaat over het tijdvak aanvangende met de dag waarop de
      wijziging ingaat.

      4 Op de ambtshalve toekenning van een vakantie-uitkering zijn de [artikelen 3:41][ref4] en
      [3:45 van de Algemene wet bestuursrecht][ref5] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel59
