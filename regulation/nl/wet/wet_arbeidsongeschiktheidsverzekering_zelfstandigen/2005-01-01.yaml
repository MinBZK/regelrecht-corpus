        artikel: '54'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: '51'
    text: |-
      1 Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het openbaar ministerie.

      2 De oplegging van een boete blijft definitief achterwege indien ter zake van de gedraging tegen de
      verzekerde of zijn wettelijke vertegenwoordiger een strafvervolging is ingesteld en het onderzoek ter
      terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen op grond van
      [artikel 74 van het Wetboek van Strafrecht][ref1].

      3 Het openbaar ministerie doet van een omstandigheid als bedoeld in het eerste en het tweede lid mededeling aan het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0008656/2005-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '52'
    text: |-
      1 Een boete wordt opgelegd binnen een jaar nadat het Uitvoeringsinstituut werknemersverzekeringen de verzekerde
      of zijn wettelijke vertegenwoordiger overeenkomstig [artikel 49, vierde lid][ref1], in de gelegenheid heeft
      gesteld zijn zienswijze naar voren te brengen. Indien ter zake aangifte is gedaan of proces-verbaal is opgemaakt
      en ingezonden vangt het tijdvak van een jaar aan op de dag na die waarop het openbaar ministerie aan het
      Uitvoeringsinstituut werknemersverzekeringen heeft meegedeeld dat geen strafvervolging wordt ingesteld.

      2 Een boete wordt in elk geval niet opgelegd na verloop van vijf jaren nadat de desbetreffende gedraging heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel49
    url: https://wetten.overheid.nl/BWBR0008656/2005-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: '53'
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de boete is vastgesteld ook ten nadele van de verzekerde of zijn wettelijke vertegenwoordiger
      wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel869
    url: https://wetten.overheid.nl/BWBR0008656/2005-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:69
  - number: '54'
    text: |-
      1 Het besluit waarbij een boete is opgelegd levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De titel heeft mede betrekking op de rente en
      kosten, bedoeld in het zesde lid.

      2 Indien de persoon aan wie een boete is opgelegd een uitkering ontvangt op grond van deze wet, de
      [Werkloosheidswet][ref2], de [Ziektewet][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref6] of de [Wet arbeid en zorg][ref7] of een toeslag op grond
      van de [Toeslagenwet][ref8], wordt het besluit waarbij de boete is opgelegd tenuitvoergelegd door verrekening met
      die uitkering of toeslag.

      3 Indien de persoon aan wie een boete is opgelegd een uitkering ontvangt op grond van de
      [Algemene Ouderdomswet][ref9], de [Algemene nabestaandenwet][ref10], de [Wet werk en bijstand][ref11],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref12], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref13] of de
      [Wet werk en inkomen kunstenaars][ref14], betaalt de Sociale verzekeringsbank, onderscheidenlijk de betrokken
      gemeente het bedrag van die boete, zonder dat daarvoor een machtiging nodig is van hem, op zijn verzoek aan het
      Uitvoeringsinstituut werknemersverzekeringen.

      4 Indien de persoon aan wie een boete is opgelegd geen uitkering of toeslag als bedoeld in het tweede of derde
      lid ontvangt, of meer ontvangt, dan wel ten aanzien van zodanige uitkering of toeslag toepassing van het tweede
      of derde lid niet mogelijk is, wordt het besluit waarbij de boete is opgelegd bij gebreke van tijdige betaling met
      toepassing van het [Wetboek van Burgerlijke Rechtsvordering][ref15] op zijn kosten betekend en tenuitvoergelegd.

      5 De tenuitvoerlegging van een besluit waarbij een boete is opgelegd vindt plaats met toepassing van het tweede of
      derde lid, dan wel van het vierde lid, dan wel van het tweede of derde lid in combinatie met het vierde lid.

      6 Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.

      7 Op het executoriaal beslag op grond van dit artikel door het Uitvoeringsinstituut werknemersverzekeringen
      op loon, sociale uitkeringen of andere periodieke betalingen, die derden verschuldigd zijn of worden aan
      de persoon aan wie een boete is opgelegd, zijn de [artikelen 479b tot en met 479g][ref16] , behoudens
      [artikel 479e, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref17] van overeenkomstige toepassing.
      De in [artikel 479g][ref18] aan het Landelijk Bureau Inning Onderhoudsbijdragen toegekende bevoegdheid komt
      gelijkelijk toe aan het Uitvoeringsinstituut werknemersverzekeringen.

      8 De tenuitvoerlegging van een besluit met toepassing van dit artikel geschiedt zodanig dat de verzekerde of zijn
      wettelijke vertegenwoordiger blijft beschikken over een inkomen gelijk aan de beslagvrije voet, bedoeld in de
      [artikelen 475c][ref19] tot en met [475e van het Wetboek van Burgerlijke Rechtsvordering][ref20].

      9 Het achtste lid geldt niet, zolang de verzekerde of zijn wettelijke vertegenwoordiger zijn verplichting, bedoeld
      in [artikel 48, vijfde lid][ref21], niet of niet behoorlijk nakomt.


