preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om in verband met de intrekking van de Algemene
    Arbeidsongeschiktheidswet een regeling te treffen met betrekking tot een arbeidsongeschiktheidsverzekering alsmede
    om een regeling te treffen ter zake van een uitkering in verband met bevalling voor personen die als zelfstandige
    werkzaam zijn, voor beroepsbeoefenaren en voor meewerkende echtgenoten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008656/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: de Minister van Sociale Zaken en Werkgelegenheid;

      b. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      c. Arbeidsongeschiktheidsfonds: het fonds, bedoeld in
      [artikel 72 van de Wet op de arbeidsongeschiktheidsverzekering][ref2];

      d. verzekerde: de persoon, bedoeld in [artikel 3][ref3];

      e. arbeidsongeschiktheidsuitkering: een arbeidsongeschiktheidsuitkering op grond van deze wet;

      f. dienstbetrekking: een dienstbetrekking in de zin van de [Wet op de arbeidsongeschiktheidsverzekering][ref4];

      g. winst uit onderneming: de belastbare winst uit onderneming, bedoeld in paragraaf 3.2.1 van de
      [Wet inkomstenbelasting 2001][ref5], vermeerderd met de ondernemersaftrek, bedoeld in paragraaf 3.2.4 van
      [die wet][ref6];

      h. winst uit Nederlandse onderneming: de belastbare winst uit Nederlandse onderneming, bedoeld in
      [afdeling 7.2 van de Wet inkomstenbelasting 2001][ref7], vermeerderd met de ondernemersaftrek, bedoeld in paragraaf
      3.2.4 van [die wet][ref8];

      i. aanmerkelijk belang: aanmerkelijk belang als bedoeld in [hoofdstuk 4 van de Wet inkomstenbelasting 2001][ref9];

      j. inkomsten uit tegenwoordige arbeid: het gezamenlijke bedrag van:

      1°. het belastbaar loon uit tegenwoordige arbeid, bedoeld in
      [afdeling 3.3 van de Wet inkomstenbelasting 2001][ref10];

      2°. het belastbaar loon ter zake van het in Nederland verrichten van arbeid, bedoeld in
      [afdeling 7.2 van de Wet inkomstenbelasting 2001][ref11];

      3°. het belastbaar resultaat uit overige werkzaamheden, bedoeld in
      [afdeling 3.4 van de Wet inkomstenbelasting 2001][ref12], behoudens voorzover het een
      werkzaamheid betreft als bedoeld in de [artikelen 3.91, eerste lid, onderdelen a en b][ref13], en
      [3.92 van de Wet inkomstenbelasting 2001][ref14], en

      4°. het belastbaar resultaat uit overige werkzaamheden in Nederland, bedoeld in
      [afdeling 7.2 van de Wet inkomstenbelasting 2001][ref15], behoudens voorzover het een
      werkzaamheid betreft als bedoeld in de [artikelen 3.91, eerste lid, onderdelen a en b][ref16], en
      [3.92 van de Wet inkomstenbelasting 2001][ref17].

      k. vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref18];

      l. rechtens zijn vrijheid is ontnomen: rechtens zijn vrijheid is ontnomen, behoudens de
      gevallen, bedoeld in de Wet bijzondere opnemingen in psychiatrische ziekenhuizen en in
      [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref19];

      m. justitiële inrichting: een penitentiaire inrichting, een inrichting voor
      verpleging van ter beschikking gestelden, of een inrichting als bedoeld in
      [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref20].

      2 In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:

      a. echtgenoot: geregistreerde partner;

      b. echtgenoten: geregistreerde partners;

      c. gehuwd: als partner geregistreerd.

      3 In deze wet en de daarop berustende bepalingen wordt:

      a. als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde
      meerderjarige een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;

      b. als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.

      4 Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben
      en zij blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de
      huishouding dan wel anderszins.

      5 Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben
      in dezelfde woning en:

      a. zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;

      b. uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;

      c. zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of

      d. zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vierde lid.

      6 Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vijfde lid, onderdeel d.

      7 Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vierde lid.


