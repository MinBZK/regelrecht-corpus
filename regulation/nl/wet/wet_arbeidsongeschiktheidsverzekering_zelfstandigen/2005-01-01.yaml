  - number: '35'
    text: |-
      1 De arbeidsongeschiktheidsuitkering wordt op aanvraag toegekend.

      2 Het Uitvoeringsinstituut werknemersverzekeringen stelt de verzekerde schriftelijk in kennis van de mogelijkheid
      van het doen van een aanvraag uiterlijk vier maanden voor de datum waarop het in [artikel 7, tweede lid][ref1],
      genoemde tijdvak van 52 weken eindigt.

      3 Het tweede lid is niet van toepassing, indien de verzekerde de melding, bedoeld in
      [artikel 33, eerste lid][ref2], niet of niet tijdig heeft gedaan. Indien de verzekerde deze melding
      niet tijdig heeft gedaan, geldt de in het tweede lid bedoelde verplichting voor het Uitvoeringsinstituut
      werknemersverzekeringen uiterlijk drie maanden nadat de verzekerde de melding heeft gedaan.

      4 De verzekerde die in aanmerking wenst te komen voor toekenning van de uitkering, doet zijn aanvraag binnen negen
      maanden na aanvang van zijn arbeidsongeschiktheid.

      5 Onverminderd hetgeen in deze wet terzake van herziening of intrekking van de arbeidsongeschiktheidsuitkering
      is bepaald wordt ten aanzien van personen die na 1 juli 1949 zijn geboren, op een bij of krachtens algemene
      maatregel van bestuur bepaald tijdstip door het Uitvoeringsinstituut werknemersverzekeringen bezien of er in
      verband met wijziging van de mate van arbeidsongeschiktheid gronden zijn voor herziening of intrekking van de
      arbeidsongeschiktheidsuitkering. Het tijdstip kan voor verschillende groepen van personen verschillend worden
      vastgesteld. Bij algemene maatregel van bestuur kan worden bepaald dat de eerste zin niet van toepassing is op
      bepaalde groepen van personen.

      6 Een aanvraag is tijdig ingediend, indien het Uitvoeringsinstituut werknemersverzekeringen de kennisgeving,
      bedoeld in het tweede lid, niet heeft gedaan dan wel indien bij een latere kennisgeving dan bedoeld in het tweede
      lid de aanvraag wordt ingediend binnen vier weken nadat deze kennisgeving is ontvangen.

      7 Indien de toepassing van het vierde lid zou leiden tot kennelijke hardheid, is het Uitvoeringsinstituut
      werknemersverzekeringen bevoegd de uitkering ambtshalve toe te kennen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel33
