  - number: '33'
    text: |-
      1 Ten einde een recht op arbeidsongeschiktheidsuitkering geldend te kunnen maken meldt de verzekerde
      zijn arbeidsongeschiktheid binnen dertien weken na het ontstaan van de arbeidsongeschiktheid aan het
      Uitvoeringsinstituut werknemersverzekeringen.

      2 Voor het bepalen van het tijdvak van dertien weken, bedoeld in het eerste lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken
      opvolgen. Bij de vaststelling van zowel het tijdvak van dertien weken als de periode van vier weken blijven
      perioden, waarin uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:18][ref1] of
      [3:30, eerste lid, van de Wet arbeid en zorg][ref2] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel318
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel330
    url: https://wetten.overheid.nl/BWBR0008656/2005-01-01#Artikel33
