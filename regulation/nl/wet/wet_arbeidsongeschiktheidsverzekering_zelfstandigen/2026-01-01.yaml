        hoofdstuk: '3'
        afdeling: '3'
  - number: '29'
    text: |-
      Indien een verzekerde van 45 jaar of ouder die recht heeft op een arbeidsongeschiktheidsuitkering en die als
      verzekerde bedoeld in [artikel 3, eerste lid][ref1], winst of inkomsten gaat genieten in verband waarmee zijn
      arbeidsongeschiktheidsuitkering wordt beëindigd, wordt, indien hij binnen vijf jaar na de datum van aanvang
      van zijn werkzaamheden opnieuw recht heeft op toekenning van een arbeidsongeschiktheidsuitkering, de grondslag
      van die uitkering niet lager gesteld dan de grondslag die voor de berekening van de laatstelijk ontvangen
      arbeidsongeschiktheidsuitkering in aanmerking werd genomen, zoals die sinds de beëindiging van de uitkering op
      grond van [artikel 8][ref2] zou zijn herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '33.1'
    text: |-
      Ten einde een recht op arbeidsongeschiktheidsuitkering geldend te kunnen maken meldt de verzekerde
      zijn arbeidsongeschiktheid binnen dertien weken na het ontstaan van de arbeidsongeschiktheid aan het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel33
  - number: '33.2'
    text: |-
      Voor het bepalen van het tijdvak van dertien weken, bedoeld in het eerste lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen of
      indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering in verband met zwangerschap of
      bevalling op grond van [artikel 3:18][ref1] of [3:30, eerste lid, van de Wet arbeid en zorg][ref2] wordt genoten,
      tenzij de ongeschiktheid redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak. Bij de
      vaststelling van het tijdvak van dertien weken blijven perioden, waarin uitkering in verband met zwangerschap of
      bevalling op grond van [artikel 3:18][ref3] of [3:30, eerste lid, van de Wet arbeid en zorg][ref4] wordt genoten,
      buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
