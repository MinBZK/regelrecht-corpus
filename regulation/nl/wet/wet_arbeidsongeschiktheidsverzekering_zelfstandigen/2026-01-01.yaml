        artikel: '3'
  - number: '35.1'
    text: De arbeidsongeschiktheidsuitkering wordt op aanvraag toegekend.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel35
  - number: '35.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt de verzekerde schriftelijk in kennis van de mogelijkheid
      van het doen van een aanvraag uiterlijk vier maanden voor de datum waarop het in [artikel 7, tweede lid][ref1],
      genoemde tijdvak van 52 weken eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '35.3'
    text: |-
      Het tweede lid is niet van toepassing, indien de verzekerde de melding, bedoeld in [artikel 33, eerste lid][ref1],
      niet of niet tijdig heeft gedaan. Indien de verzekerde deze melding niet tijdig heeft gedaan, geldt de in het
      tweede lid bedoelde verplichting voor het Uitvoeringsinstituut werknemersverzekeringen uiterlijk drie maanden nadat
      de verzekerde de melding heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel33
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: '35.4'
    text: |-
      De verzekerde die in aanmerking wenst te komen voor toekenning van de uitkering, doet zijn aanvraag binnen negen
      maanden na aanvang van zijn arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel35
  - number: '35.5'
    text: |-
      Onverminderd hetgeen in deze wet terzake van herziening of intrekking van de arbeidsongeschiktheidsuitkering
      is bepaald wordt ten aanzien van personen die na 1 juli 1954 zijn geboren, op een bij of krachtens algemene
      maatregel van bestuur bepaald tijdstip door het Uitvoeringsinstituut werknemersverzekeringen bezien of er in
      verband met wijziging van de mate van arbeidsongeschiktheid gronden zijn voor herziening of intrekking van de
      arbeidsongeschiktheidsuitkering. Het tijdstip kan voor verschillende groepen van personen verschillend worden
      vastgesteld. Bij algemene maatregel van bestuur kan worden bepaald dat de eerste zin niet van toepassing is op
      bepaalde groepen van personen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel35
  - number: '35.6'
    text: |-
      Ten aanzien van personen die na 1 juli 1954 maar voor 2 juli 1959 zijn geboren en die voor 22 februari 2007 op
      grond van het vijfde lid zijn herbeoordeeld, wordt door het Uitvoeringsinstituut werknemersverzekeringen bezien
      of er per 22 februari 2007 in verband met een wijziging van de mate van arbeidsongeschiktheid gronden zijn voor
      herziening, heropening of intrekking van de arbeidsongeschiktheidsuitkering. De eerste zin is niet van toepassing
      op personen die op 22 februari 2007 reeds in de hoogste arbeidsongeschiktheidsklasse zijn ingedeeld.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel35
  - number: '35.7'
    text: |-
      Op grond van de beoordeling, bedoeld in het zesde lid, wordt de mate van arbeidsongeschiktheid van de persoon,
      bedoeld in het zesde lid, die niet heeft verzocht om een nieuwe medische beoordeling, niet lager vastgesteld dan de
      mate van arbeidsongeschiktheid die voor die persoon gold op 21 februari 2007.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel35
  - number: '35.8'
    text: |-
      Een aanvraag is tijdig ingediend, indien het Uitvoeringsinstituut werknemersverzekeringen de kennisgeving, bedoeld
      in het tweede lid, niet heeft gedaan dan wel indien bij een latere kennisgeving dan bedoeld in het tweede lid de
      aanvraag wordt ingediend binnen vier weken nadat deze kennisgeving is ontvangen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel35
  - number: '35.9'
    text: |-
      Indien de toepassing van het vierde lid zou leiden tot kennelijke hardheid, is het Uitvoeringsinstituut
      werknemersverzekeringen bevoegd de uitkering ambtshalve toe te kennen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel35
  - number: '36.1'
    text: |-
      De arbeidsongeschiktheidsuitkering gaat in op de dag, met ingang waarvan de betrokkene aan de vereisten voor het
      recht op toekenning van die uitkering voldoet.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel36
  - number: '36.2'
    text: |-
      In afwijking van het eerste lid kan de uitkering niet vroeger ingaan dan een jaar voor de dag, waarop
      de aanvraag om toekenning dan wel voortzetting van de uitkering werd ingediend. Het Uitvoeringsinstituut
      werknemersverzekeringen kan voor bijzondere gevallen van de eerste zin afwijken.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel36
  - number: '36.3'
    text: |-
      Toekenning van arbeidsongeschiktheidsuitkering vindt niet plaats, indien deze zou ingaan op of na de in
      [artikel 19, eerste lid, onderdeel a][ref1], bedoelde dag.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '37'
    text: Herziening dan wel heropening van de arbeidsongeschiktheidsuitkering vindt op aanvraag of ambtshalve plaats.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel37
  - number: '38.1'
    text: |-
      De herziening van de arbeidsongeschiktheidsuitkering gaat in op de dag, waarop de verzekerde op grond van deze wet
      voor een hogere of lagere uitkering in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel38
  - number: '38.2'
    text: |-
      Met betrekking tot de herziening van de arbeidsongeschiktheidsuitkering, die een verhoging van die uitkering tot
      gevolg heeft, alsmede met betrekking tot de heropening van de uitkering is [artikel 36, tweede lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel36
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '38.3'
    text: |-
      De herziening van een arbeidsongeschiktheidsuitkering ter zake van afneming van de arbeidsongeschiktheid gaat in op
      de dag, aangegeven in de daartoe strekkende beschikking van het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel38
  - number: '38.4'
    text: |-
      Indien de herziening van de arbeidsongeschiktheidsuitkering verband houdt met een voltooide scholing of opleiding,
      gaat deze herziening niet eerder in dan een jaar na voltooiing van die scholing of opleiding.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel38
  - number: '38.5'
    text: |-
      De heropening van de uitkering, bedoeld in [artikel 21][ref1], gaat in op de dag, met ingang waarvan de betrokkene
      weer arbeidsongeschikt is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel21
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '38.6'
    text: |-
      Heropening van de arbeidsongeschiktheidsuitkering vindt niet plaats, indien deze zou ingaan op of na de in
      [artikel 19, eerste lid, onderdeel a][ref1], bedoelde dag.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '40'
    text: |-
      De vakantie-uitkering wordt ambtshalve of, ingeval [artikel 60, eerste lid, tweede zin][ref1], toepassing vindt, op
      aanvraag door het Uitvoeringsinstituut werknemersverzekeringen toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel60
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '60'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '41.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, zo dikwijls hij zulks nodig oordeelt de verzekerde oproepen
      of doen oproepen en op een door of vanwege het Uitvoeringsinstituut werknemersverzekeringen te bepalen plaats
      ondervragen of doen ondervragen in verband met de aanspraak op of het genot van arbeidsongeschiktheidsuitkering of
      de toekenning of verstrekking van een reïntegratie-instrument als bedoeld in [hoofdstuk 3A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Hoofdstuk3A
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0008656
        hoofdstuk: 3A
  - number: '41.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan de in het eerste lid bedoelde personen op een door of namens
      hem te bepalen plaats door een of meer daartoe door hem aangewezen deskundigen doen onderzoeken.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel41
  - number: '41.3'
    text: |-
      De daartoe door het Uitvoeringsinstituut werknemersverzekeringen aangewezen deskundige kan, ook zonder opdracht
      van het Uitvoeringsinstituut werknemersverzekeringen, de in het eerste lid bedoelde personen oproepen, ondervragen,
      doen oproepen, doen ondervragen en onderzoeken of doen onderzoeken door een of meer door hem daartoe aangewezen
      deskundigen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel41
  - number: '42'
    text: |-
      Opgeroepenen en, indien hun toestand geleide nodig maakt, mede hun geleiders, worden reiskosten, verblijfkosten
      en tijdverlies vergoed in de gevallen en volgens regels die door het Uitvoeringsinstituut werknemersverzekeringen
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel42
  - number: '43.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen en de door hem daartoe aangewezen deskundige kunnen de personen,
      bedoeld in [artikel 41, eerste lid][ref1], voorschriften geven in het belang van een behandeling of van genezing of
      tot behoud, herstel en bevordering van de mogelijkheid tot het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel41
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '43.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan voorschrijven dat de personen, bedoeld in
      [artikel 41, eerste lid][ref1], zich laten registreren als werkzoekende bij het Uitvoeringsinstituut
      werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel41
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '44'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan controlevoorschriften vaststellen. Deze voorschriften mogen
      niet verder gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel44
  - number: '45.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen weigert de uitkering tijdelijk of blijvend, geheel of
      gedeeltelijk, indien een verzekerde als bedoeld in [artikel 41, eerste lid][ref1], na tijdig te zijn opgeroepen
      niet is verschenen of heeft geweigerd:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel41
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 45.1.a
    text: |-
      vragen te beantwoorden die zijn gesteld door het Uitvoeringsinstituut werknemersverzekeringen of de door hem
      daartoe aangewezen deskundige;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel45
  - number: 45.1.b
    text: |-
      zich te laten onderzoeken door de door het Uitvoeringsinstituut werknemersverzekeringen daartoe aangewezen
      deskundige; of
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel45
  - number: 45.1.c
    text: |-
      te voldoen aan het voorschrift, gegeven door het Uitvoeringsinstituut werknemersverzekeringen of de door
      hem daartoe aangewezen deskundige, om zich ter observatie te doen opnemen of te verblijven in een aangewezen
      inrichting.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel45
  - number: '45.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig het eerste lid bij toeneming van
      de arbeidsongeschiktheid, voor zover deze toeneming kennelijk is voortgekomen uit dezelfde oorzaak als de
      arbeidsongeschiktheid, ter zake waarvan het niet voldoen aan de oproeping of de weigering plaatsvond.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel45
  - number: '46'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig [artikel 45][ref1], indien de verzekerde:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel45
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 46.a
    text: |-
      de door het Uitvoeringsinstituut werknemersverzekeringen of de door hem daartoe aangewezen deskundige krachtens
      [artikel 43][ref1] in het belang van een behandeling of genezing of tot behoud, herstel of bevordering van de
      mogelijkheid tot het verrichten van arbeid en tot registratie als werkzoekende bij het Uitvoeringsinstituut
      werknemersverzekeringen gegeven voorschriften zonder deugdelijke grond niet opvolgt;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel43
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 46.b
    text: |-
      zich niet, zolang als het Uitvoeringsinstituut werknemersverzekeringen of de door hem daartoe aangewezen deskundige
      te kennen heeft gegeven dit noodzakelijk te achten, onder geneeskundige behandeling stelt of indien hij de
      voorschriften van de behandelende arts niet opvolgt;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel46
  - number: 46.c
    text: |-
      zich schuldig maakt aan gedragingen, waardoor zijn genezing wordt belemmerd of nalaat voldoende mee te werken om
      aanpassing aan zijn ziekte of gebrek te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel46
  - number: 46.d
    text: |-
      de controlevoorschriften, bedoeld in [artikel 44][ref1], of de verplichting, bedoeld in
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] niet of niet behoorlijk
      is nagekomen of de verplichting, bedoeld in [artikel 70][ref3], niet binnen de door het Uitvoeringsinstituut
      werknemersverzekeringen daarvoor vastgestelde termijn is nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '44'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
  - number: 46.e
    text: zijn arbeidsongeschiktheid opzettelijk heeft veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel46
  - number: 46.f
    text: |-
      zich niet houdt aan het voorschrift, bedoeld in [artikel 35, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel35
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 46.g
    text: |-
      zonder redelijke gronden niet meewerkt aan een scholing of opleiding die wenselijk wordt geacht voor zijn
      inschakeling in de arbeid;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel46
  - number: 46.h
    text: |-
      indien de belanghebbende zonder redelijke gronden niet meewerkt aan het opstellen van de re-integratievisie,
      bedoeld in [artikel 30a, vierde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] of het re-
      integratieplan, bedoeld in artikel 30a, zesde lid, van die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
  - number: 46.i
    text: |-
      indien de belanghebbende de verplichtingen die zijn opgenomen in de re-integratievisie, bedoeld in
      [artikel 30a, vierde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] of in het re-
      integratieplan, bedoeld in artikel 30a, zesde lid, van die wet niet of niet behoorlijk is nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
  - number: 46.j
    text: |-
      indien de belanghebbende die bij deelname aan een reïntegratietraject zijn reïntegratieverplichtingen niet naleeft,
      de reden daarvan niet onmiddellijk aan het reïntegratiebedrijf heeft medegedeeld;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel46
  - number: 46.k
    text: |-
      zich niet onthoudt van zeer ernstige misdragingen jegens de met de uitvoering van deze wet belaste personen en
      instanties tijdens het verrichten van hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel46
  - number: '47.1'
    text: |-
      Een maatregel als bedoeld in [artikel 45][ref1] of [46][ref2] wordt afgestemd op de ernst van de gedraging en de
      mate waarin de verzekerde de gedraging kan worden verweten. Van het opleggen van een maatregel wordt in elk geval
      afgezien, indien elke vorm van verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel46
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: '47.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een maatregel als bedoeld in het
      eerste lid en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet tijdig nakomen van de
      verplichting, bedoeld in [artikel 70][ref1], indien het niet tijdig nakomen van de verplichting niet heeft geleid
      tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering, of ter zake van het zich niet houden aan het
      voorschrift, bedoeld in [artikel 35, vierde lid][ref2], tenzij het niet tijdig nakomen van de verplichting of het
      zich niet houden aan het voorschrift plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop
      eerder aan de werknemer een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel35
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '47.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een maatregel indien daarvoor
      dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel47
  - number: '47.4'
    text: |-
      Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een bestuurlijke boete als bedoeld
      in [artikel 48][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel48
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: '47.5'
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel47
  - number: '48.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen legt een bestuurlijke boete op van ten hoogste het
      benadelingsbedrag wegens het niet of niet behoorlijk nakomen door de verzekerde of zijn wettelijke
      vertegenwoordiger van de verplichting, bedoeld in [artikel 70][ref1]. Indien de feiten en omstandigheden,
      bedoeld in artikel 70, niet of niet behoorlijk zijn medegedeeld en deze overtreding opzettelijk is
      begaan, bedraagt de bestuurlijke boete ten hoogste het bedrag van de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2]. Indien de feiten en omstandigheden, bedoeld in
      artikel 70, niet of niet behoorlijk zijn medegedeeld en deze overtreding niet opzettelijk is begaan, bedraagt
      de bestuurlijke boete ten hoogste het bedrag van de derde categorie, bedoeld in artikel 23, vierde lid, van het
      Wetboek van Strafrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '48.2'
    text: |-
      In dit artikel wordt onder benadelingsbedrag verstaan het brutobedrag dat als gevolg van het niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in [artikel 70][ref1], ten onrechte of tot een te hoog bedrag aan
      uitkering is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
  - number: '48.3'
    text: |-
      Indien het niet of niet behoorlijk nakomen door de verzekerde of zijn wettelijke vertegenwoordiger van
      de verplichting, bedoeld in [artikel 70][ref1], niet heeft geleid tot een benadelingsbedrag, legt het
      Uitvoeringsinstituut werknemersverzekeringen een bestuurlijke boete op van ten hoogste het bedrag van de tweede
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '48.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een bestuurlijke boete en volstaan
      met het geven van een schriftelijke waarschuwing wegens het niet of niet behoorlijk nakomen door de verzekerde
      of zijn wettelijke vertegenwoordiger van de verplichting, bedoeld in [artikel 70][ref1], in situaties die bij
      algemene maatregel van bestuur worden bepaald, tenzij het niet of niet behoorlijk nakomen van de verplichting
      plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de verzekerde of zijn
      wettelijke vertegenwoordiger een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
  - number: '48.5'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen legt een bestuurlijke boete op wegens het niet of niet
      behoorlijk nakomen door de verzekerde of zijn wettelijke vertegenwoordiger van de verplichting, bedoeld in
      [artikel 70][ref1], als gevolg waarvan ten onrechte of tot een te hoog bedrag aan uitkering is ontvangen, van ten
      hoogste 150 procent van het benadelingsbedrag, met overeenkomstige toepassing van het eerste lid, indien binnen
      een tijdvak van vijf jaar voorafgaand aan de dag van het begaan van de overtreding een eerdere bestuurlijke boete
      of strafrechtelijke sanctie is opgelegd wegens een eerdere overtreding, bestaande uit eenzelfde gedraging, die
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
  - number: '48.6'
    text: |-
      Onder eenzelfde gedraging als bedoeld in het vijfde lid wordt verstaan het niet of niet behoorlijk nakomen van
      de verplichting, bedoeld in de [artikelen 70][ref1] van deze wet of [12 van de Toeslagenwet][ref2], als gevolg
      waarvan ten onrechte of tot een te hoog bedrag aan arbeidsongeschiktheidsuitkering of toeslag is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel12
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '12'
  - number: '48.7'
    text: |-
      In afwijking van het vijfde lid is het in dat lid genoemde tijdvak van vijf jaar tien jaar indien wegens de eerdere
      overtreding, bedoeld in het vijfde lid, de verzekerde of zijn wettelijke vertegenwoordiger is gestraft met een
      onvoorwaardelijke gevangenisstraf.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel48
  - number: '48.8'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een bestuurlijke boete indien
      daarvoor dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel48
  - number: '48.9'
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd, is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van
      belang zijn.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel48
  - number: '48.10'
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel48
  - number: '48.11'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij de bestuurlijke boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel48
  - number: '48.12'
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de verzekerde of zijn wettelijke
      vertegenwoordiger wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '48.13'
    text: |-
      Indien ten aanzien van een overtreding waarvoor een bestuurlijke boete is opgelegd geen sprake is geweest
      van opzet of grove schuld, en voorts is gebleken dat binnen een jaar nadat de bestuurlijke boete is opgelegd
      niet nogmaals een overtreding wegens eenzelfde gedraging als bedoeld in het zesde lid is begaan, is het
      Uitvoeringsinstituut werknemersverzekeringen bevoegd op verzoek van degene aan wie de bestuurlijke boete is
      opgelegd, de bestuurlijke boete geheel of gedeeltelijk kwijt te schelden bij medewerking aan een schuldregeling.
      [Artikel 65a, eerste, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel65a
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 65a
        hoofdstuk: '3'
        afdeling: '3'
  - number: '48.14'
    text: |-
      Het besluit tot kwijtschelding, bedoeld in het dertiende lid, wordt ingetrokken of ten nadele van degene aan wie
      de bestuurlijke boete is opgelegd herzien indien binnen vijf jaar na het besluit tot kwijtschelding wederom een
      overtreding is begaan wegens eenzelfde gedraging als bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel48
  - number: '54.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verrekent de bestuurlijke boete en een
      eerdere bestuurlijke boete wegens eenzelfde gedraging als bedoeld in artikel 48, vijfde lid,
      met een uitkering op grond van deze wet, de [Werkloosheidswet][ref1], de [Ziektewet][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref6], de [Wet inkomensvoorziening oudere werklozen][ref7],
      de [Wet arbeid en zorg][ref8] of een toeslag op grond van de [Toeslagenwet][ref9], die de persoon aan wie een
      bestuurlijke boete is opgelegd ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0008657
      [ref6]: https://wetten.overheid.nl/BWBR0002822
      [ref7]: https://wetten.overheid.nl/BWBR0024394
      [ref8]: https://wetten.overheid.nl/BWBR0013008
      [ref9]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0008657
      - id: ref6
        bwb_id: BWBR0002822
      - id: ref7
        bwb_id: BWBR0024394
      - id: ref8
        bwb_id: BWBR0013008
      - id: ref9
        bwb_id: BWBR0004043
  - number: '54.2'
    text: |-
      Onverminderd het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen de bestuurlijke boete verrekenen
      met een vordering die degene aan wie de bestuurlijke boete is opgelegd op hem heeft.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel54
  - number: '54.3'
    text: |-
      De Sociale verzekeringsbank onderscheidenlijk de gemeente betaalt het bedrag van de bestuurlijke boete, zonder
      dat daarvoor een machtiging nodig is, op zijn verzoek aan het Uitvoeringsinstituut werknemersverzekeringen
      indien de persoon aan wie een bestuurlijke boete is opgelegd een uitkering ontvangt op grond van de
      [Algemene Ouderdomswet][ref1], de [Algemene nabestaanden wet][ref2], de [Participatiewet][ref3], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0015703
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0015703
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0004163
  - number: '54.4'
    text: |-
      De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref1] aan de raad voor de kinderbescherming
      toegekende bevoegdheid komt gelijkelijk toe aan het Uitvoeringsinstituut werknemersverzekeringen. Indien het
      Uitvoeringsinstituut werknemersverzekeringen gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het
      dwangbevel, in afwijking van [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref2], door middel van
      toezending per post aan de persoon aan wie de boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479g
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '54.5'
    text: |-
      Zolang de verzekerde of zijn wettelijke vertegenwoordiger zijn verplichting, bedoeld in
      [artikel 48, negende lid][ref1], niet of niet behoorlijk nakomt:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel48
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 54.5.a
    text: |-
      is het Uitvoeringsinstituut werknemersverzekeringen in afwijking van
      [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref1] bevoegd tot verrekening van de bestuurlijke
      boete voor zover beslag op de vordering van de schuldeiser nietig zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 54.5.b
    text: |-
      geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref2], niet bij de invordering van een bestuurlijke boete bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 54b
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen de verzekerde de uitkering tijdelijk of blijvend, geheel
      of gedeeltelijk heeft geweigerd dan wel hem een bestuurlijke boete heeft opgelegd, stelt het Uitvoeringsinstituut
      werknemersverzekeringen het reïntegratiebedrijf dat ten behoeve van die verzekerde werkzaamheden gericht
      op vergroting van de mogelijkheden tot het verrichten van arbeid of op inschakeling in arbeid verricht, van
      die beschikking in kennis voorzover dat noodzakelijk is voor de uitvoering van de werkzaamheden door het
      reïntegratiebedrijf.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel54b
  - number: '55.1'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt betaalbaar gesteld door het Uitvoeringsinstituut werknemersverzekeringen.
      De betaling geschiedt als regel in tijdvakken van een maand.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel55
  - number: '55.2'
    text: |-
      Onverminderd het tweede lid, schort het Uitvoeringsinstituut werknemersverzekeringen de betaling van de
      arbeidsongeschiktheidsuitkering op of schorst het de betaling, indien het op grond van duidelijke aanwijzingen van
      oordeel is of het gegronde vermoeden heeft dat:
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel55
  - number: 55.2.a
    text: het recht op uitkering niet of niet meer bestaat;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel55
  - number: 55.2.b
    text: recht op een lagere uitkering bestaat;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel55
  - number: 55.2.c
    text: |-
      de verzekerde of zijn wettelijke vertegenwoordiger een verplichting als bedoeld in [artikel 45][ref1], [46][ref2]
      of [70][ref3] niet of niet behoorlijk is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
  - number: '55.3'
    text: |-
      Indien de arbeidsongeschiktheidsuitkering in het buitenland wordt uitbetaald, geschiedt de betaling in afwijking
      van [artikel 4:89, derde lid, van de Algemene wet bestuursrecht][ref1] op het tijdstip waarop de rekening van de
      daartoe door de schuldeiser aangewezen bank wordt gecrediteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '55.4'
    text: |-
      Wanneer de verzekerde, aan wie een arbeidsongeschiktheidsuitkering is toegekend, een ander machtigt om de uitkering
      in ontvangst te nemen, onderscheidenlijk een verleende machtiging intrekt, wordt daaraan gevolg gegeven met ingang
      van een betalingstijdvak, aanvangende na de dag waarop de machtiging wordt ingediend, onderscheidenlijk waarop
      van haar intrekking mededeling wordt gedaan, doch niet later dan de eerste dag van de tweede maand na de dag van
      indiening onderscheidenlijk de mededeling.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel55
  - number: '55.5'
    text: |-
      Indien een reïntegratiebedrijf aan het Uitvoeringsinstituut werknemersverzekeringen heeft gemeld dat het
      gegronde vermoeden bestaat dat een persoon aan wie een uitkering is toegekend onvoldoende medewerking verleent
      aan de op hem betrekking hebbende werkzaamheden van het reïntegratiebedrijf, neemt het Uitvoeringsinstituut
      werknemersverzekeringen een besluit omtrent de gehele of gedeeltelijke opschorting of schorsing van de betaling van
      de uitkering aan die persoon voor de duur van ten hoogste acht weken.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel55
  - number: '55.6'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt het reïntegratiebedrijf in kennis van een besluit tot
      opschorting of schorsing als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel55
  - number: 55a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van een arbeidsongeschiktheidsuitkering op
      indien de persoon aan wie de uitkering is toegekend een vreemdeling is die niet rechtmatig in Nederland verblijf
      houdt als bedoeld in [artikel 8 van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 55a.2
    text: |-
      De betaling van een arbeidsongeschiktheidsuitkering wordt hervat indien de betrokkene daartoe een aanvraag indient
      en het Uitvoeringsinstituut werknemersverzekeringen is gebleken dat hij feitelijk buiten Nederland woont of
      verblijf houdt.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel55a
  - number: 55b.1
    text: |-
      Is van de ontvanger van een arbeidsongeschiktheidsuitkering bij het Uitvoeringsinstituut werknemersverzekeringen
      een adres in Nederland bekend, terwijl in de basisregistratie personen ambtshalve is opgenomen dat hij is
      vertrokken naar een onbekend land van verblijf, dan verzoekt het Uitvoeringsinstituut werknemersverzekeringen hem
      de afwijkende registratie in de basisregistratie personen binnen een redelijke termijn ongedaan te laten maken.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel55b
  - number: 55b.2
    text: |-
      Wanneer na afloop van deze termijn, de afwijkende registratie niet is beëindigd of als uit de basisregistratie
      personen niet blijkt dat het college van burgemeester en wethouders van de desbetreffende gemeente de gegevens over
      het adres in onderzoek heeft genomen, schort het Uitvoeringsinstituut werknemersverzekeringen de betaling van de
      uitkering aan de persoon, aan wie de arbeidsongeschiktheidsuitkering is toegekend, op.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel55b
  - number: 55b.3
    text: |-
      De opschorting wordt beëindigd zodra is vastgesteld dat de persoon, bedoeld in het tweede lid, in het buitenland
      woont of verblijft of dat een adres in Nederland in de basisregistratie personen is opgenomen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel55b
  - number: 55b.4
    text: |-
      Indien het onderzoek van het college van burgemeester en wethouders is afgerond en de persoon, bedoeld in
      het tweede lid, in de basisregistratie personen ambtshalve opgenomen blijft met gegevens over het vertrek uit
      Nederland, schort het Uitvoeringsinstituut werknemersverzekeringen de betaling van de uitkering op tot verblijf in
      het buitenland kan worden vastgesteld of een adres in Nederland in de basisregistratie personen is opgenomen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel55b
  - number: '57.1'
    text: |-
      Indien de verzekerde aan wie een arbeidsongeschiktheidsuitkering is toegekend, aanspraak heeft op verstrekking
      of vergoeding van zorg als bedoeld in de [Wet langdurige zorg][ref1] en op grond van die wet een bijdrage voor
      die zorg verschuldigd is, is het Uitvoeringsinstituut werknemersverzekeringen bevoegd de uitkering tot het bedrag
      van die bijdrage in plaats van aan de verzekerde zonder diens machtiging uit te betalen aan het Zorginstituut
      Nederland, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0035917
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '57.2'
    text: |-
      Indien aan degene aan wie een arbeidsongeschiktheidsuitkering is toegekend, een
      maatwerkvoorziening of persoonsgebonden budget wordt verstrekt voor beschermd wonen als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1], en hij op grond van die [wet][ref2] hiervoor
      een bijdrage is verschuldigd, is het Uitvoeringsinstituut werknemersverzekeringen bevoegd die uitkering tot het
      bedrag van die bijdrage in plaats van aan de verzekerde, aan wie de uitkering is toegekend, zonder diens machtiging
      uit te betalen aan het CAK, genoemd in [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref3], dat voor de
      gemeente de bijdrage int.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035362
      [ref3]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035362
      - id: ref3
        bwb_id: BWBR0035917
  - number: '57.3'
    text: |-
      Indien de verzekerde, aan wie een arbeidsongeschiktheidsuitkering is toegekend, in een inrichting ter verpleging
      van geesteszieken of van zwakzinnigen is opgenomen en het Uitvoeringsinstituut werknemersverzekeringen van de
      desbetreffende inrichting of van het college van burgemeester en wethouders van de gemeente die de opnamekosten
      betaalt, het verzoek ontvangt om de arbeidsongeschiktheidsuitkering aan die inrichting of die gemeente uit te
      betalen, kan het Uitvoeringsinstituut werknemersverzekeringen dat verzoek zonder het stellen van andere voorwaarden
      inwilligen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel57
  - number: '57.4'
    text: |-
      Indien het eerste of tweede lid toepassing vindt, heeft de in het derde lid bedoelde bevoegdheid betrekking op
      het gedeelte van de arbeidsongeschiktheidsuitkering dat niet aan de in het eerste of tweede lid genoemde instantie
      wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel57
  - number: '57.5'
    text: |-
      Een herziening van de uitkering op grond van het eerste of tweede lid als gevolg van een wijziging van de
      verschuldigde bijdrage vindt plaats zonder dat dit bij beschikking is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel57
  - number: '58.1'
    text: |-
      Indien de verzekerde, die recht heeft op een arbeidsongeschiktheidsuitkering, inkomen geniet doordat hij arbeid is
      gaan verrichten, wordt die arbeid gedurende een aaneengesloten tijdvak van vijf jaar niet aangemerkt als arbeid als
      bedoeld in [artikel 2, vierde lid][ref1], en wordt de arbeidsongeschiktheidsuitkering niet ingetrokken of herzien,
      doch wordt de uitkering:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel2
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '2'
        hoofdstuk: '1'
  - number: 58.1.a
    text: |-
      niet betaald, indien het inkomen zodanig is, dat als die arbeid wel arbeid als bedoeld in
      [artikel 2, vierde lid][ref1], zou zijn, niet langer sprake zou zijn van arbeidsongeschiktheid van ten minste 25%;
      of


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel2
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '2'
        hoofdstuk: '1'
  - number: 58.1.b
    text: |-
      indien onderdeel a niet van toepassing is, betaald tot een bedrag ter grootte van de
      arbeidsongeschiktheidsuitkering, zoals deze zou zijn vastgesteld, indien die arbeid wel arbeid als bedoeld in
      [artikel 2, vierde lid][ref1], zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel2
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '2'
        hoofdstuk: '1'
  - number: '58.2'
    text: |-
      Indien degene die recht heeft op een arbeidsongeschiktheidsuitkering in dienstbetrekking arbeid als bedoeld in het
      eerste lid verricht of heeft verricht, wordt het loon geacht te zijn genoten in het aangiftetijdvak waarover de
      werkgever of de inhoudingsplichtige van dat loon opgave heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel58
  - number: '58.3'
    text: |-
      Het in het eerste lid, aanhef, genoemde tijdvak van vijf jaar vangt aan op de eerste dag waarop het eerste lid,
      onderdeel a of b, is toegepast. Indien diegene die recht heeft op een arbeidsongeschiktheidsuitkering en ten
      aanzien van wie het eerste lid, onderdeel a of b, is toegepast andere arbeid gaat verrichten, dan vangt een nieuw
      tijdvak als bedoeld in het eerste lid aan op de eerste dag dat de arbeidsongeschiktheidsuitkering vanwege het
      verrichten van die andere arbeid wordt vastgesteld door toepassing van het eerste lid, onderdeel a of b.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel58
  - number: '58.4'
    text: |-
      Indien op de laatste dag van het in het eerste lid genoemde tijdvak van vijf jaar inkomen wordt genoten, maar geen
      arbeid wordt verricht, wordt dit tijdvak verlengd tot en met de laatste dag waarop dat inkomen wordt genoten.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel58
  - number: '58.5'
    text: |-
      Indien degene, die recht heeft op een arbeidsongeschiktheidsuitkering, inkomen geniet, dat
      bestaat uit loon ingevolge een arbeidsovereenkomst als bedoeld in de [hoofdstukken 2][ref1] en
      [3 van de Wet sociale werkvoorziening][ref2], is het eerste lid voor onbeperkte duur van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        hoofdstuk: '3'
  - number: '58.6'
    text: |-
      Onze Minister kan bepalen dat het eerste lid voor onbeperkte duur toepassing vindt ten aanzien van bepaalde groepen
      personen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel58
  - number: '58.7'
    text: |-
      Bij ministeriële regeling wordt bepaald wat onder inkomen en loon als bedoeld in dit artikel wordt verstaan.
      Daarbij kan tevens worden bepaald dat nader te bepalen inkomen dat gedeeltelijk, niet, of niet langer wordt genoten
      als gevolg van gewijzigde omstandigheden of enig handelen of nalaten van betrokkene in aanmerking wordt genomen
      alsof het wel volledig wordt genoten.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel58
  - number: '58.8'
    text: |-
      Bij de bepaling van de mate van arbeidsongeschiktheid, bedoeld in het eerste lid, kan loon niet meer dan eenmaal in
      aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel58
  - number: '59.1'
    text: |-
      Indien ter zake van arbeidsongeschiktheid een herziening van de arbeidsongeschiktheidsuitkering in verband met de
      [artikelen 12 tot en met 17][ref1] plaatsvindt of een anticumulatie als bedoeld in [artikel 58][ref2] is of wordt
      beëindigd en een recht ontstaat op uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref3] uit
      hoofde van een dienstbetrekking die is aangevangen na het intreden van arbeidsongeschiktheid op grond waarvan een
      recht op arbeidsongeschiktheidsuitkering is ontstaan, wordt de arbeidsongeschiktheidsuitkering uitbetaald voor
      zover deze de uitkering op grond van de Wet werk en inkomen naar arbeidsvermogen overtreft, en in geval van een
      herziening in elk geval uitbetaald tot de hoogte van het bedrag onmiddellijk voorafgaande aan de herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '58'
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0019057
  - number: '59.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder arbeidsongeschiktheidsuitkering en uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref1] tevens verstaan de vakantie-uitkering waarop uit hoofde van die
      uitkeringen recht bestaat, voorzover die vakantie-uitkering over dezelfde periode is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: '59.3'
    text: |-
      Het eerste lid is niet van toepassing op de persoon die een uitkering ontvangt op grond van de vrijwillige
      verzekering als bedoeld in [paragraaf 2.2 van de Wet werk en inkomen naar arbeidsvermogen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Paragraaf2.2
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0019057
        paragraaf: '2.2'
  - number: '59.4'
    text: |-
      Voor de toepassing van het eerste lid wordt als arbeidsongeschiktheidsuitkering van de verzekerde op wie
      [artikel 58][ref1] van toepassing is, in aanmerking genomen het bedrag van die uitkering nadat bedoeld artikel
      toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel58
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '58'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '59.5'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59
  - number: 59.5.a
    text: met betrekking tot het eerste lid;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59
  - number: 59.5.b
    text: |-
      ter voorkoming of beperking van samenloop van arbeidsongeschiktheidsuitkering met de in het eerste lid bedoelde
      uitkeringen in situaties waarin deze leden niet of onvoldoende voorzien.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59
  - number: 59a.1
    text: 'Indien terzake van arbeidsongeschiktheid recht bestaat op:'
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59a
  - number: 59a.1.a
    text: |-
      zowel herziening van de arbeidsongeschiktheidsuitkering in verband met de
      [artikelen 12 tot en met 17][ref1] als op toekenning van een arbeidsongeschiktheidsuitkering op grond
      van de [Wet op de arbeidsongeschiktheidsverzekering][ref2] uit hoofde van een dienstbetrekking die is
      aangevangen na het intreden van de arbeidsongeschiktheid op grond waarvan recht is ontstaan op eerstbedoelde
      arbeidsongeschiktheidsuitkering; of


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002524
  - number: 59a.1.b
    text: |-
      zowel toekenning van arbeidsongeschiktheidsuitkering op grond van [artikel 20][ref1] als toekenning van
      een arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2]
      uit hoofde van een dienstbetrekking die is aangevangen na het intreden van de arbeidsongeschiktheid op
      grond waarvan de arbeidsongeschiktheidsuitkering, bedoeld in [artikel 20, eerste lid, onderdeel a][ref3],
      werd toegekend dan wel tijdens of na de wachttijd, bedoeld in onderdeel b van dat lid; wordt de
      arbeidsongeschiktheidsuitkering uitbetaald voorzover deze de arbeidsongeschiktheidsuitkering op grond van
      de [Wet op de arbeidsongeschiktheidsverzekering][ref4] overtreft. In de situatie, bedoeld onder a, wordt de
      arbeidsongeschiktheidsuitkering in ieder geval uitbetaald tot de hoogte van het bedrag onmiddellijk voorafgaande
      aan de herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002524
  - number: 59a.2
    text: 'Indien terzake van arbeidsongeschiktheid recht bestaat op:'
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59a
  - number: 59a.2.a
    text: |-
      zowel herziening van de arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] in verband met de
      [artikelen 36 tot en met 40 van die wet][ref2] als toekenning van een arbeidsongeschiktheidsuitkering uit hoofde
      van werkzaamheden als verzekerde die zijn aangevangen na het intreden van de arbeidsongeschiktheid op grond waarvan
      recht is ontstaan op eerstbedoelde arbeidsongeschiktheidsuitkering; of


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel36
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '36'
  - number: 59a.2.b
    text: |-
      zowel toekenning van arbeidsongeschiktheidsuitkering op grond van
      [artikel 43a van de Wet op de arbeidsongeschiktheidsverzekering][ref1] als toekenning van een
      arbeidsongeschiktheidsuitkering uit hoofde van werkzaamheden als verzekerde die zijn aangevangen na het
      intreden van de arbeidsongeschiktheid op grond waarvan de arbeidsongeschiktheidsuitkering, bedoeld in
      [artikel 43a, eerste lid, onderdeel a, van de Wet op de arbeidsongeschiktheidsverzekering][ref2], werd toegekend
      dan wel tijdens of na de wachttijd, bedoeld in onderdeel b van dat lid; wordt de arbeidsongeschiktheidsuitkering
      uitbetaald voorzover deze de herziene of toegekende arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering overtreft][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref3
        bwb_id: BWBR0002524
  - number: 59a.3
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt onder arbeidsongeschiktheidsuitkering en
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] tevens verstaan
      de vakantie-uitkering waarop uit hoofde van die arbeidsongeschiktheidsuitkeringen recht bestaat, voor zover die
      vakantie-uitkering over dezelfde periode is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 59a.4
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op de persoon die een
      arbeidsongeschiktheidsuitkering ontvangt op grond van de vrijwillige verzekering, bedoeld in
      [hoofdstuk VI van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: VI
  - number: 59a.5
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt als arbeidsongeschiktheidsuitkering
      onderscheidenlijk uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1]
      van de verzekerde op wie [artikel 58][ref2], onderscheidenlijk [artikel 44][ref3] of
      [65 van de Wet op de arbeidsongeschiktheidsverzekering][ref4] van toepassing is, in aanmerking genomen het bedrag
      van die uitkeringen nadat bedoelde artikelen toepassing hebben gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel44
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel65
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '58'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '44'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '65'
  - number: 59a.6
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59a
  - number: 59a.6.a
    text: met betrekking tot het eerste tot en met derde lid;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59a
  - number: 59a.6.b
    text: |-
      ter voorkoming of beperking van samenloop van arbeidsongeschiktheidsuitkering met de in het eerste tot en met derde
      lid bedoelde uitkeringen in situaties waarin deze leden niet of onvoldoende voorzien;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59a
  - number: 59a.6.c
    text: |-
      ter voorkoming of beperking van samenloop van arbeidsongeschiktheidsuitkering op grond van deze wet met uitkering
      op grond van andere wetten.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59a
  - number: 59a.7
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ter voorkoming of beperking van samenloop van
      arbeidsongeschiktheidsuitkering met uitkering op grond van de sociale wetgeving van Aruba, Curaçao, Sint Maarten,
      een vergelijkbare regeling ten behoeve van de openbare lichamen Bonaire, Sint Eustatius en Saba of van een andere
      Mogendheid.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel59a
  - number: '60.1'
    text: |-
      De betaling van de vakantie-uitkering vindt eenmaal per jaar plaats in de maand mei over de aan die maand
      voorafgaande maanden, of, indien het recht op uitkering eerder dan in de maand mei eindigt, in de desbetreffende
      maand. Het Uitvoeringsinstituut werknemersverzekeringen kan de vakantie-uitkering op een ander tijdstip betalen,
      mits die betaling plaatsvindt over een of meer voorliggende maanden waarover reeds recht op vakantie-uitkering
      bestaat.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel60
  - number: '60.2'
    text: |-
      De [artikelen 55][ref1], [57][ref2] en [61][ref3] zijn van overeenkomstige toepassing ten aanzien van de vakantie-
      uitkering, voor zover bij of krachtens deze wet niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel61
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '55'
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '57'
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '61'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '61.1'
    text: |-
      Na het overlijden van de verzekerde, aan wie een arbeidsongeschiktheidsuitkering is toegekend, wordt met ingang van
      de dag na het overlijden, de uitkering in de vorm van een overlijdensuitkering betaald:
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel61
  - number: 61.1.a
    text: aan de langstlevende van de echtgenoten;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel61
  - number: 61.1.b
    text: |-
      bij ontstentenis van de in onderdeel *a* bedoelde persoon, de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel61
  - number: 61.1.c
    text: |-
      bij ontstentenis van de in de onderdelen *a* en *b* bedoelde personen degenen met wie de overledene in
      gezinsverband leefde.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel61
  - number: '61.2'
    text: |-
      De overlijdensuitkering is gelijk aan het bedrag van de uitkering over één maand, doch niet over de zaterdagen
      en de zondagen, berekend naar de hoogte van die uitkering op de dag of laatstelijk voor de dag van overlijden van
      de verzekerde.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel61
  - number: '61.3'
    text: |-
      In verband met het overlijden van de verzekerde aan wie een uitkering is toegekend, is
      [artikel 19, eerste lid, onderdeel a][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '61.4'
    text: |-
      De overlijdensuitkering wordt ambtshalve of op aanvraag aan de rechthebbende of rechthebbenden, bedoeld in het
      eerste lid, door het Uitvoeringsinstituut werknemersverzekeringen betaald.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel61
  - number: '61.5'
    text: De overlijdensuitkering wordt in een bedrag ineens betaald.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel61
  - number: '61.6'
    text: |-
      Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan arbeidsongeschiktheidsuitkering dat over
      na het overlijden gelegen dagen reeds is betaald.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel61
  - number: '62'
    text: |-
      Uitkeringen op grond van deze wet die niet in ontvangst zijn genomen of zijn ingevorderd binnen twee jaren na de
      dag van betaalbaarstelling, worden niet meer betaald.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel62
  - number: '63.1'
    text: |-
      De uitkering, de loonsuppletie, bedoeld in [artikel 67a][ref1], de inkomenssuppletie, bedoeld in
      [artikel 67b][ref2], en de voorziening, bedoeld in [artikel 67c][ref3] die als gevolg van een besluit als bedoeld
      in [artikel 18][ref4] onverschuldigd is verstrekt, alsmede hetgeen anderszins onverschuldigd is betaald, wordt door
      het Uitvoeringsinstituut werknemersverzekeringen teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel67a
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel67b
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel67c
      [ref4]: https://wetten.overheid.nl/BWBR0008656#Artikel18
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 67a
        hoofdstuk: 3A
      - id: ref2
        bwb_id: BWBR0008656
        artikel: 67b
        hoofdstuk: 3A
      - id: ref3
        bwb_id: BWBR0008656
        artikel: 67c
        hoofdstuk: 3A
      - id: ref4
        bwb_id: BWBR0008656
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '63.2'
    text: |-
      De uitkering die onverschuldigd aan de werkgever is betaald, wordt door het Uitvoeringsinstituut
      werknemersverzekeringen van de werkgever teruggevorderd, indien de werkgever de uitkering op grond van
      [artikel 629, vijfde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] in mindering heeft kunnen brengen op het
      loon.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
  - number: '63.3'
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van terugvordering
      of van verdere terugvordering af te zien, indien degene van wie wordt teruggevorderd:
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel63
  - number: 63.3.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel63
  - number: 63.3.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel63
  - number: 63.3.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel63
  - number: 63.3.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel63
  - number: '63.4'
    text: |-
      De in het derde lid, onderdelen a, b en c, genoemde termijn is tien jaar indien de terugvordering het gevolg is van
      het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 70][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
  - number: '63.5'
    text: 'De in het derde lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel63
  - number: 63.5.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 63.5.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 70][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
  - number: '63.6'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel63
  - number: '63.7'
    text: |-
      De persoon van wie of de instelling waarvan wordt teruggevorderd is verplicht desgevraagd aan het
      Uitvoeringsinstituut werknemersverzekeringen de inlichtingen te verstrekken die voor de terugvordering van belang
      zijn.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel63
  - number: '63.8'
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen, onder voorwaarden die Onze
      Minister kan stellen, besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze
      Minister vast te stellen bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel63
  - number: '64.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan de onverschuldigd betaalde uitkering, bedoeld in
      [artikel 63, eerste en tweede lid][ref1], invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel63
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '63'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '64.2'
    text: |-
      [Artikel 54][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het
      gemiddeld inkomen van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan, het
      Uitvoeringsinstituut werknemersverzekeringen de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '54'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
  - number: '65'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel65
  - number: 65.a
    text: de wijze van tenuitvoerlegging van de beschikking waarbij is vastgesteld dat onverschuldigd is betaald;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel65
  - number: 65.b
    text: |-
      de aanvraag van loonsuppletie als bedoeld in [artikel 67a][ref1], van inkomenssuppletie als bedoeld in
      [artikel 67b][ref2], de termijn waarbinnen die aanvraag wordt ingediend, alsmede de rechtsgevolgen die
      aan overschrijding van die termijn zijn verbonden, en de aanvraag van een voorziening als bedoeld in
      [artikel 67c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel67a
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel67b
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel67c
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 67a
        hoofdstuk: 3A
      - id: ref2
        bwb_id: BWBR0008656
        artikel: 67b
        hoofdstuk: 3A
      - id: ref3
        bwb_id: BWBR0008656
        artikel: 67c
        hoofdstuk: 3A
  - number: 65a.1
    text: |-
      In afwijking van [artikel 63, eerste lid][ref1], kan het Uitvoeringsinstituut werknemersverzekeringen, op verzoek
      van de belanghebbende, besluiten gedeeltelijk van terugvordering of gedeeltelijk van verdere terugvordering af te
      zien door medewerking aan een schuldregeling, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel63
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '63'
        hoofdstuk: '3'
        afdeling: '3'
  - number: 65a.1.a
    text: |-
      redelijkerwijs te voorzien is dat de belanghebbende niet zal kunnen voortgaan met het betalen van zijn schulden of
      indien hij in de toestand verkeert dat hij heeft opgehouden te betalen;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel65a
  - number: 65a.1.b
    text: |-
      redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde vorderingen, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel65a
  - number: 65a.1.c
    text: |-
      een naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen betrouwbaar voorstel voor
      een schuldregeling tot stand is gekomen door tussenkomst van een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel48
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '48'
  - number: 65a.1.d
    text: aannemelijk is dat medewerking aan een schuldregeling niet concurrentieverstorend werkt; en
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel65a
  - number: 65a.1.e
    text: |-
      uitdeling in het kader van de schuldregeling plaatsvindt overeenkomstig
      [artikel 349 van de Faillissementswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel349
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '349'
  - number: 65a.2
    text: |-
      Het eerste lid is niet van toepassing indien een vordering is ontstaan door het opzettelijk of door grove schuld
      niet nakomen door de belanghebbende van de verplichting, bedoeld in [artikel 70][ref1], en hiervoor een boete
      als bedoeld in [artikel 48][ref2] is opgelegd, dan wel indien hiervoor aangifte is gedaan op grond van het
      [Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0001854
  - number: 65a.3
    text: |-
      Het besluit tot het afzien van terugvordering of van verdere terugvordering wordt ingetrokken of ten nadele van
      belanghebbende gewijzigd indien:
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel65a
  - number: 65a.3.a
    text: |-
      niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling tot stand is gekomen die voldoet
      aan de eisen, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel65a
  - number: 65a.3.b
    text: |-
      de belanghebbende zijn schuld aan het Uitvoeringsinstituut werknemersverzekeringen niet overeenkomstig de
      schuldregeling voldoet; of
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel65a
  - number: 65a.3.c
    text: |-
      onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een ander
      besluit zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel65a
  - number: 65a.4
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld ten aanzien van de
      bevoegdheid om mee te werken aan schuldregelingen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel65a
  - number: 65b
    text: |-
      Een vordering van het Uitvoeringsinstituut werknemersverzekeringen als bedoeld in
      [artikel 63][ref1] en [65a][ref2] is bevoorrecht en volgt onmiddellijk na de vorderingen, bedoeld in
      [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel65a
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel288
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel65b
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '63'
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: 65a
        hoofdstuk: '3'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '288'
  - number: '66.1'
    text: 'Onvervreemdbaar en niet vatbaar voor verpanding en belening zijn:'
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel66
  - number: 66.1.a
    text: de arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel66
  - number: 66.1.b
    text: |-
      de verhoging van de arbeidsongeschiktheidsuitkering, bedoeld in [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel10
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 66.1.c
    text: de vakantie-uitkering;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel66
  - number: 66.1.d
    text: |-
      de loonsuppletie, bedoeld in [artikel 67a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel67a
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 67a
        hoofdstuk: 3A
  - number: 66.1.e
    text: |-
      de inkomenssuppletie, bedoeld in [artikel 67b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel67b
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 67b
        hoofdstuk: 3A
  - number: '66.2'
    text: Volmacht tot ontvangst van een uitkering onder welke vorm of welke benaming ook verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel66
  - number: '66.3'
    text: Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel66
  - number: '67'
    text: 'Niet vatbaar voor beslag zijn:'
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67
  - number: 67.a
    text: |-
      de verhoging, bedoeld in [artikel 10][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel10
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 67.b
    text: |-
      de overlijdensuitkering, bedoeld in [artikel 61][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel61
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '61'
        hoofdstuk: '3'
        afdeling: '3'
  - number: 67a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan aan de persoon die recht heeft op een
      arbeidsongeschiktheidsuitkering en die arbeid in dienstbetrekking aanvaardt of verricht op aanvraag loonsuppletie
      toekennen, indien het loon lager is dan zijn resterende verdiencapaciteit.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67a
  - number: 67a.2
    text: |-
      De loonsuppletie wordt verstrekt over perioden waarin loon uit dienstbetrekking wordt ontvangen, doch ten hoogste
      over een periode van vier jaar te rekenen vanaf de dag met ingang waarvan voor de eerste maal loonsuppletie is
      toegekend.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67a
  - number: 67a.3
    text: |-
      Als perioden waarin loon uit dienstbetrekking wordt ontvangen als bedoeld in het tweede lid worden
      eveneens aangemerkt, perioden waarin een uitkering op grond van de [Ziektewet][ref1] of op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref2] wordt ontvangen, tenzij de dienstbetrekking
      is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
        paragraaf: '1'
  - number: 67a.4
    text: |-
      De loonsuppletie wordt voor de toepassing van de wettelijke bepalingen inzake premieheffing aangemerkt als een
      uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 67a.5
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de hoogte van de loonsuppletie.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67a
  - number: 67b.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan aan de persoon die recht heeft op een
      arbeidsongeschiktheidsuitkering en die arbeid als zelfstandige verricht of gaat verrichten op aanvraag
      inkomenssuppletie toekennen, indien zijn inkomen uit het bedrijf of beroep lager is dan zijn resterende
      verdiencapaciteit.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67b
  - number: 67b.2
    text: |-
      De inkomenssuppletie wordt verstrekt over perioden waarin het bedrijf of beroep wordt uitgeoefend, doch ten hoogste
      over een periode van vier jaar te rekenen vanaf de dag met ingang waarvan voor de eerste maal inkomenssuppletie
      is toegekend.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67b
  - number: 67b.3
    text: |-
      De inkomenssuppletie wordt voor de toepassing van de wettelijke bepalingen inzake premieheffing aangemerkt als een
      uitkering op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67b
  - number: 67b.4
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de hoogte van de
      inkomenssuppletie.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67b
  - number: 67d.1
    text: |-
      De zelfstandige die recht heeft op een arbeidsongeschiktheidsuitkering heeft recht op ondersteuning bij
      arbeidsinschakeling en, met inachtneming van de daarvoor geldende wettelijke bepalingen, op de naar het oordeel van
      het Uitvoeringsinstituut werknemersverzekeringen noodzakelijk geachte voorziening gericht op arbeidsinschakeling.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67d
  - number: 67d.2
    text: |-
      Voor de toepassing van het eerste lid wordt voor personen die blijkens een indicatiebeschikking of
      herindicatiebeschikking tot de doelgroep behoren van de [Wet sociale werkvoorziening][ref1] onder een voorziening
      gericht op arbeidsinschakeling mede verstaan een voorziening gericht op het verkrijgen van arbeid in een
      dienstbetrekking als bedoeld in de [artikelen 2][ref2] en [7 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67d
    references:
      - id: ref1
        bwb_id: BWBR0008903
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0008903
        artikel: '7'
  - number: 67e.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, in het kader van de bevordering van de inschakeling in de
      arbeid, toestemming verlenen aan de verzekerde, die recht heeft op een arbeidsongeschiktheidsuitkering om op een
      proefplaats bij een werkgever gedurende maximaal zes maanden onbeloonde werkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67e
  - number: 67e.2
    text: |-
      Tijdens het verrichten van werkzaamheden op een proefplaats als bedoeld in het eerste lid wordt de
      arbeidsongeschiktheidsuitkering niet ingetrokken of herzien.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67e
  - number: 67e.3
    text: 'De onbeloonde werkzaamheden op een proefplaats als bedoeld in het eerste lid zijn:'
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67e
  - number: 67e.3.a
    text: werkzaamheden, waartoe de verzekerde, bedoeld in het eerste lid, met zijn krachten en bekwaamheden in staat is;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67e
  - number: 67e.3.b
    text: |-
      werkzaamheden, waarbij de werkgever, bij wie de proefplaatsing geschiedt, een aansprakelijkheids- en
      ongevallenverzekering ten behoeve van de verzekerde, bedoeld in het eerste lid, heeft afgesloten;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67e
  - number: 67e.3.c
    text: |-
      werkzaamheden, die de verzekerde, bedoeld in het eerste lid, niet reeds eerder onbeloond op een proefplaats bij die
      werkgever of diens rechtsvoorganger heeft verricht; en
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67e
  - number: 67e.3.d
    text: |-
      werkzaamheden, waarbij er, naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen, een reëel
      uitzicht is op een op de onbeloonde werkzaamheden aansluitende dienstbetrekking van dezelfde of grotere omvang voor
      ten minste 6 maanden.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67e
  - number: 67e.4
    text: |-
      Indien de werkzaamheden, bedoeld in het eerste lid, wegens ziekte worden onderbroken, wordt de periode waarin een
      uitkering bij ziekte wordt ontvangen, voor de toepassing van dat lid buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67e
  - number: 67e.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67e
  - number: 67h
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan de persoon, die recht heeft op een
      arbeidsongeschiktheidsuitkering, en voor wie de kans op inschakeling in het arbeidsproces gering is en die
      daardoor vooralsnog niet bemiddelbaar is op de arbeidsmarkt, onbeloonde additionele werkzaamheden laten verrichten
      gedurende maximaal twee jaar. [Artikel 10a, tweede tot en met tiende lid, van de Participatiewet][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel10a
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67h
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 10a
  - number: 67i.1
    text: |-
      De persoon die op 1 juli van het kalenderjaar recht heeft op een arbeidsongeschiktheidsuitkering bij een
      arbeidsongeschiktheid van 35% of meer, heeft recht op een tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67i
  - number: 67i.2
    text: De persoon, bedoeld in het eerste lid, ontvangt per kalenderjaar een tegemoetkoming van € 226,28.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67i
  - number: 67i.3
    text: |-
      Het bedrag, genoemd in het tweede lid, wordt jaarlijks per 1 januari gewijzigd overeenkomstig de
      tabelcorrectiefactor, bedoeld in [artikel 10.2 van de Wet inkomstenbelasting 2001][ref1]. Het gewijzigde bedrag
      wordt door of namens Onze Minister medegedeeld in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67i
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
  - number: 67i.4
    text: |-
      In afwijking van het derde lid kan het bedrag, genoemd in het tweede lid, bij algemene maatregel van bestuur met
      ingang van een bij die maatregel aan te geven datum worden vervangen door een ander bedrag.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67i
  - number: 67i.5
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt de tegemoetkoming ambtshalve in het derde kwartaal van
      het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67i
  - number: 67i.6
    text: De tegemoetkoming is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67i
  - number: 67i.7
    text: |-
      De tegemoetkoming blijft buiten beschouwing bij de verlening van op het inkomen of vermogen afgestemde
      publiekrechtelijke uitkeringen en verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67i
  - number: 67i.8
    text: |-
      De tegemoetkoming is niet vatbaar voor terugvordering of verrekening met openstaande vorderingen in verband met een
      uitkering op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67i
  - number: 67i.9
    text: |-
      De tegemoetkoming wordt slecht één keer uitgekeerd in het geval er tevens aanspraak gemaakt kan worden
      op de tegemoetkoming op grond van [artikelen 63a van de Wet werk en inkomen naar arbeidsvermogen][ref1],
      [65l van de Wet op de arbeidsongeschiktheidsverzekering][ref2] of [3:75 van de Wet werk en arbeidsondersteuning
      jonggehandicapten](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel65l
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67i
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: 63a
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 65l
  - number: 67i.10
    text: De tegemoetkoming en de daarmee gepaard gaande beheerskosten komen ten laste van het Rijk.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel67i
  - number: '68'
    text: |-
      Bij de vaststelling van de schadevergoeding, waarop de verzekerde naar burgerlijk recht aanspraak kan maken ter
      zake van zijn arbeidsongeschiktheid, houdt de rechter rekening met de aanspraken, die hij op grond van deze wet
      heeft.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel68
  - number: '69.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft voor de op grond van deze wet gemaakte kosten verhaal op de
      persoon die in verband met het veroorzaken van arbeidsongeschiktheid jegens de verzekerde naar burgerlijk recht tot
      schadevergoeding is verplicht, doch ten hoogste tot het bedrag, waarvoor deze bij het ontbreken van de aanspraken
      krachtens deze wet naar burgerlijk recht aansprakelijk zou zijn, verminderd met een bedrag, gelijk aan dat van
      de schadevergoeding tot betaling waarvan de aansprakelijke persoon jegens de verzekerde naar burgerlijk recht is
      gehouden.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel69
  - number: '69.2'
    text: |-
      Overeenkomstig door Onze Minister te stellen regels kan het Uitvoeringsinstituut werknemersverzekeringen in plaats
      van het bedrag van de periodieke verstrekkingen de contante waarde daarvan vorderen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel69
  - number: '69.3'
    text: |-
      De in het eerste lid bedoelde aansprakelijke is eveneens verplicht tot vergoeding van de door
      het Uitvoeringsinstituut werknemersverzekeringen gemaakte redelijke kosten ter nakoming van de
      verplichtingen tot inschakeling in de arbeid van de verzekerde, die op het Uitvoeringsinstituut
      werknemersverzekeringen rusten op grond van deze wet en de daarop berustende bepalingen alsmede de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] en de daarop berustende bepalingen. De aansprakelijke
      kan hetzelfde verweer voeren dat hem jegens de verzekerde ten dienste zou hebben gestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: '70.1'
    text: |-
      De verzekerde, diens wettelijke vertegenwoordiger alsmede de instelling, bedoeld in [artikel 57][ref1], waaraan
      arbeidsongeschiktheidsuitkering wordt betaald, zijn verplicht aan het Uitvoeringsinstituut werknemersverzekeringen,
      op zijn verzoek of onverwijld uit eigen beweging alle feiten en omstandigheden mee te delen, waarvan hun
      redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op uitkering, de hoogte van de
      uitkering, het geldend maken van het recht op uitkering of op het bedrag van de uitkering, dat wordt betaald. Deze
      verplichting geldt niet indien die feiten en omstandigheden door het Uitvoeringsinstituut werknemersverzekeringen
      kunnen worden vastgesteld op grond van bij wettelijk voorschrift als authentiek aangemerkte gegevens of kunnen
      worden verkregen uit bij ministeriële regeling aan te wijzen administraties. Bij ministeriële regeling wordt
      bepaald voor welke gegevens de tweede zin van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel57
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '57'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '70.2'
    text: |-
      Op de verzekerde die aanspraak maakt op of recht heeft op vakantie-uitkering alsmede op diens wettelijke
      vertegenwoordiger, rusten overeenkomstige verplichtingen als omschreven in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel70
  - number: '70.3'
    text: |-
      De verzekerde aan wie een reïntegratie-instrument als bedoeld in [hoofdstuk 3A][ref1] is verstrekt of toegekend,
      of aan wie verstrekking of toekenning daarvan wordt overwogen, alsmede diens wettelijk vertegenwoordiger, zijn
      verplicht aan het Uitvoeringsinstituut werknemersverzekeringen op zijn verzoek of onverwijld uit eigen beweging
      alle feiten en omstandigheden mee te delen, waarvan hun redelijkerwijs duidelijk moet zijn dat zij van invloed
      kunnen zijn op de verstrekking of toekenning of op de duur of de hoogte van het reïntegratie-instrument.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Hoofdstuk3A
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0008656
        hoofdstuk: 3A
  - number: '81.1'
    text: |-
      De verzekerde, bedoeld in [artikel 3][ref1], is verzekerd bij het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '3'
        hoofdstuk: '2'
  - number: '81.2'
    text: |-
      In de uitvoering van de in deze wet geregelde verzekering wordt, behoudens de uitvoering die op grond van enig
      artikel van deze wet aan een ander is opgedragen, voorzien door het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel81
  - number: '86'
    text: |-
      De heropende arbeidsongeschiktheidsuitkering wordt beschouwd als een voortzetting van de ingetrokken uitkering.
      Voor de toepassing van de [artikelen 14, tweede lid][ref1], [15, eerste lid, onderdeel c][ref2], en [16][ref3]
      wordt daarbij met herziening van de arbeidsongeschiktheidsuitkering wegens afneming van de arbeidsongeschiktheid
      gelijkgesteld intrekking van de arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel16
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '95'
    text: |-
      Indien in verband met het geven van een beschikking een in het buitenland wonende persoon
      is opgeroepen en om die reden de beschikking niet binnen de redelijke termijn, bedoeld in
      [artikel 4:13, eerste lid, van de Algemene wet bestuursrecht][ref1], gegeven kan worden, wordt die termijn verlengd
      met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 95a.1
    text: |-
      Een beschikking over het verzekerd zijn op grond van deze wet wordt gegeven binnen dertien weken na ontvangst van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel95a
  - number: 95a.2
    text: |-
      Indien een beschikking als bedoeld in het eerste lid niet binnen dertien weken kan worden gegeven, wordt de
      aanvrager daarvan schriftelijk in kennis gesteld onder vermelding van een zo kort mogelijke termijn waarbinnen de
      beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel95a
  - number: '96.1'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken gerekend vanaf de dag na die waarop de termijn
      voor het indienen van het bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '96.2'
    text: |-
      Indien bezwaar wordt gemaakt tegen een besluit waaraan een medische of arbeidskundige beoordeling
      ten grondslag ligt, beslist het Uitvoeringsinstituut werknemersverzekeringen, in afwijking van
      [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1], binnen zeventien weken of, indien het advies
      vraagt aan een deskundige die niet onder zijn verantwoordelijkheid werkzaam is binnen een en twintig weken,
      gerekend vanaf de dag na die waarop de termijn voor het indienen van het bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '96.3'
    text: |-
      Indien in verband met het geven van een beslissing op bezwaar een in het buitenland wonende persoon is opgeroepen
      en om die reden de beslissing op bezwaar niet binnen de in het tweede lid bedoelde termijn gegeven kan worden,
      wordt de beslissing, in afwijking van [artikel 7:10, derde lid, van de Algemene wet bestuursrecht][ref1], verdaagd
      met ten hoogste zes maanden en wordt de aanvrager van deze verdaging schriftelijk in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '97'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de behandeling van bezwaarschriften
      tegen besluiten, waaraan een medische of arbeidskundige beoordeling ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel97
  - number: '98.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van de [artikelen 1, derde tot en met zevende lid][ref1], [3 tot en met 6][ref2]
      en de op die artikelen berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '3'
        hoofdstuk: '2'
  - number: '98.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven inzake
      beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats inneemt
      van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel98
  - number: 98b.1
    text: |-
      Een beschikking tot toekenning van inkomenssuppletie op grond van
      [artikel 29 van de Wet op de (re)integratie arbeidsgehandicapten][ref1], aan de
      persoon die op de dag voorafgaande aan de dag waarop dat artikel op grond van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref2], vervalt, recht
      had op een arbeidsongeschiktheidsuitkering wordt voor de duur waarvoor inkomenssuppletie was toegekend aangemerkt
      als een beschikking tot toekenning van inkomenssuppletie als bedoeld in [artikel 67b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel67b
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0019058
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: 67b
        hoofdstuk: 3A
  - number: 98b.2
    text: |-
      Een beschikking tot toekenning van loonsuppletie op grond van
      [artikel 32 van de Wet op de (re)integratie arbeidsgehandicapten][ref1], aan de
      persoon die op de dag voorafgaande aan de dag waarop dat artikel op grond van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref2], vervalt, recht
      had op een arbeidsongeschiktheidsuitkering wordt voor de duur waarvoor die loonsuppletie was toegekend aangemerkt
      als een beschikking tot toekenning van loonsuppletie als bedoeld in [artikel 67a][ref3].


