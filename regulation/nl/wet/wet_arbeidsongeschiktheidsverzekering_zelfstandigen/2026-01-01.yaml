  - number: 101g
    text: |-
      De [artikelen 7a][ref1], [19a][ref2] en [21a][ref3], zijn niet van toepassing op de persoon op wie die artikelen
      als gevolg van de opzegging van een verdrag, de beëindiging van de voorlopige toepassing van een verdrag dan
      wel de beëindiging van een daarmee gelijk te stellen situatie van toepassing zouden worden, zolang deze persoon
      blijft wonen in hetzelfde land als waar hij op de dag voor buitenwerkingtreding als gevolg van die opzegging
      respectievelijk op de dag voor de beëindiging woonde en blijft voldoen aan de overige voorwaarden voor het recht op
      een arbeidsongeschiktheidsuitkering.


