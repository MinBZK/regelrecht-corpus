  - number: 21d.1
    text: |-
      De persoon, wiens arbeidsongeschiktheid in verband met [artikel 19, achtste lid][ref1], is geëindigd, heeft vanaf
      de dag dat niet langer het gegronde vermoeden bestaat dat hij zich buiten Nederland bevindt met het doel zich aan
      te sluiten bij een organisatie als bedoeld in [artikel 1, eerste lid, onderdeel p][ref2], met inachtneming van
      de bepalingen van deze wet, aanspraak op heropening van de arbeidsongeschiktheidsuitkering, indien hij op die dag
      arbeidsongeschikt is.


