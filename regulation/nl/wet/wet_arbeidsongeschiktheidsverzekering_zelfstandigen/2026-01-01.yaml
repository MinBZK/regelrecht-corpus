        afdeling: '2'
  - number: 21b.1
    text: |-
      De persoon, wiens arbeidsongeschiktheidsuitkering in verband met [artikel 19, vierde lid][ref1], is geëindigd,
      heeft vanaf de dag dat hij in vrijheid wordt gesteld met inachtneming van de bepalingen van deze wet
      aanspraak op heropening van de arbeidsongeschiktheidsuitkering, indien hij op die dag arbeidsongeschikt is.
      [Artikel 7, zesde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel7
