    text: |-
      op 19 december 2005 dit recht op uitkering uitsluitend nog heeft op grond van [artikel 2 van de wet van
      9 december 2004](onbekend), houdende goedkeuring van het voornemen tot opzegging van het op 28 juni 1962 te
      Genève totstandgekomen Verdrag betreffende de gelijkheid van behandeling van eigen onderdanen en vreemdelingen met
      betrekking tot de sociale zekerheid (Verdrag Nr. 118 aangenomen door de Internationale Arbeidsconferentie in haar
      zesenveertigste zitting; Trb. 1962, 122 en Trb. 1964, 23) (Stb. 2004, 715).
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel101b
  - number: 101b.2
    text: |-
      Het eerste lid blijft van toepassing zolang deze persoon blijft wonen in hetzelfde land als het land
      waar hij op 19 december 2005 woonde en blijft voldoen aan de overige voorwaarden voor het recht op
      arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel101b
  - number: 101c
    text: |-
      In gedingen aangevangen voor het van toepassing worden van [artikel 69, derde lid][ref1], bepaalt de rechter
      op verzoek van een van de partijen of ambtshalve een termijn waarbinnen partijen de gelegenheid wordt geboden
      hun stellingen en conclusies voor zover nodig aan te passen aan [artikel 69, derde lid][ref2]. Stelt de rechter
      partijen tot een zodanige aanpassing in de gelegenheid, dan staat tegen die beslissing geen rechtsmiddel open;
      wijst de rechter een daartoe strekkend verzoek af, dan staat een rechtsmiddel daartegen slechts gelijktijdig met de
      einduitspraak open.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel69
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel101c
