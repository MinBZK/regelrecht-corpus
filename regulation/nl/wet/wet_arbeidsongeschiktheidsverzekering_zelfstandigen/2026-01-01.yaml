  - number: '1.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
  - number: 1.2.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
  - number: 1.2.b
    text: 'echtgenoten: geregistreerde partners;'
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
  - number: 1.2.c
    text: 'gehuwd: als partner geregistreerd.'
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
  - number: '1.3'
    text: 'In deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
  - number: 1.3.a
    text: |-
      als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde meerderjarige
      een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
  - number: 1.3.b
    text: als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
  - number: '1.4'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
  - number: '1.5'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben in
      dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
  - number: 1.5.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
  - number: 1.5.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
  - number: 1.5.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
  - number: 1.5.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
  - number: '1.6'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vijfde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
  - number: '1.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
  - number: '1.8'
    text: |-
      Onder bloedverwant in de eerste graad als bedoeld in het derde lid, onderdeel a, wordt mede verstaan een
      meerderjarig aangehuwd kind of een meerderjarig voormalig pleegkind van de ongehuwde meerderjarige.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
  - number: '1.9'
    text: |-
      Onder voormalig pleegkind als bedoeld in het achtste lid wordt verstaan een pleegkind voor wie de ongehuwde
      meerderjarige een pleegvergoeding ontving of ontvangt op grond van de [Wet op de jeugdzorg][ref1] of de
      [Jeugdwet][ref2], of kinderbijslag ontving op grond van de [Algemene Kinderbijslagwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016637
      [ref2]: https://wetten.overheid.nl/BWBR0034925
      [ref3]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016637
      - id: ref2
        bwb_id: BWBR0034925
      - id: ref3
        bwb_id: BWBR0002368
  - number: '2.1'
    text: |-
      Arbeidsongeschikt, geheel of gedeeltelijk, is de persoon die als rechtstreeks en objectief medisch vast te stellen
      gevolg van ziekte, gebreken, zwangerschap of bevalling geheel of gedeeltelijk niet in staat is om met arbeid te
      verdienen, hetgeen gezonde personen, met soortgelijke opleiding en ervaring, ter plaatse waar hij arbeid verricht
      of het laatst heeft verricht, of in de omgeving daarvan, met arbeid gewoonlijk verdienen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel2
  - number: '2.2'
    text: |-
      De verzekerde die op en sedert het tijdstip dat zijn verzekering een aanvang neemt, reeds gedeeltelijk
      arbeidsongeschikt is in de zin van het eerste lid, wordt voor wat de door hem aan deze wet te ontlenen aanspraken
      betreft als geheel of gedeeltelijk arbeidsongeschikt aangemerkt, indien hij als rechtstreeks en objectief medisch
      vast te stellen gevolg van ziekte, gebreken, zwangerschap of bevalling geheel of gedeeltelijk niet in staat is om
      met arbeid te verdienen, hetgeen soortgelijke personen, die in dezelfde mate arbeidsongeschikt zijn in de zin van
      het eerste lid, ter plaatse waar hij arbeid verricht of het laatst heeft verricht, of in de omgeving daarvan, met
      arbeid gewoonlijk verdienen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel2
  - number: '2.3'
    text: |-
      Indien de bij de aanvang van de verzekering aanwezige arbeidsongeschiktheid in de zin van het eerste lid naderhand
      is afgenomen vindt het tweede lid vervolgens overeenkomstige toepassing, met dien verstande dat voor de aanvang
      van de verzekering in de plaats treedt het tijdstip waarop de arbeidsongeschiktheid in de zin van het eerste lid
      is afgenomen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel2
  - number: '2.4'
    text: |-
      Onder de in het eerste en tweede lid eerstgenoemde arbeid wordt verstaan alle algemeen geaccepteerde arbeid waartoe
      de verzekerde met zijn krachten en bekwaamheden in staat is.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel2
  - number: '2.5'
    text: |-
      Bij de vaststelling van de mate van arbeidsongeschiktheid wordt buiten beschouwing gelaten of de verzekerde de
      arbeid feitelijk kan verkrijgen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel2
  - number: '2.6'
    text: |-
      Bij de toepassing van dit artikel wordt buiten beschouwing gelaten, hetgeen wordt of kan worden ontvangen voor
      arbeid verricht bij wijze van sociale werkvoorziening.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel2
  - number: '2.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot het eerste tot en met zesde lid nadere en
      zonodig afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel2
  - number: '2.8'
    text: |-
      De voordracht voor een krachtens het zevende lid vast te stellen algemene maatregel van bestuur, dan wel de
      vaststelling van een ministeriële regeling op basis van een dergelijke algemene maatregel van bestuur, wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel2
  - number: '2.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent een afwijkende
      wijze van vaststelling van de mate van arbeidsongeschiktheid in gevallen waarin recht bestaat op een
      arbeidsongeschiktheidsuitkering en een uitkering inzake arbeidsongeschiktheid op grond van een andere wettelijke
      regeling ter verzekering tegen geldelijke gevolgen van langdurige arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel2
  - number: '2.10'
    text: |-
      Bij de beoordeling van arbeidsongeschiktheid als bedoeld in deze wet maakt de verzekeringsarts zo veel mogelijk
      gebruik van wetenschappelijke inzichten die de beoordeling van arbeidsongeschiktheid kunnen ondersteunen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      Verzekerd op grond van deze wet is de persoon die vóór de inwerkingtreding van
      [artikel I, onderdeel C, van de Wet einde toegang verzekering WAZ][ref1] als zelfstandige, beroepsbeoefenaar of
      meewerkende echtgenoot arbeidsongeschikt is geworden:


      [ref1]: https://wetten.overheid.nl/BWBR0016985#ArtikelI
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016985
        artikel: I
  - number: 3.1.a
    text: |-
      gedurende de periode waarover hij aanspraak maakt op een arbeidsongeschiktheidsuitkering in verband met die
      arbeidsongeschiktheid, doch uitsluitend omdat de wachttijd, bedoeld in [artikel 7, tweede lid][ref1], op hem van
      toepassing is, geen recht op arbeidsongeschiktheidsuitkering heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 3.1.b
    text: |-
      gedurende vier weken na afloop van de wachttijd, bedoeld in [artikel 7, tweede lid][ref1], betreffende die
      arbeidsongeschiktheid, indien hij na afloop van die wachttijd niet arbeidsongeschikt is, doch dat wel is binnen
      vier weken na afloop van die wachttijd;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 3.1.c
    text: |-
      gedurende de periode waarover hij recht heeft op arbeidsongeschiktheidsuitkering in verband met die
      arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel3
  - number: 3.1.d
    text: |-
      gedurende de periode waarover hem een toelage als bedoeld in
      [artikel 28 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] is toegekend in verband met die
      arbeidsongeschiktheid;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel28
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '28'
  - number: 3.1.e
    text: |-
      gedurende het tijdvak van vier weken, bedoeld in [artikel 20, eerste lid][ref1], indien dat tijdvak is aangevangen
      vóór de inwerkingtreding van [artikel I, onderdeel C, van de Wet einde toegang verzekering WAZ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0016985#ArtikelI
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0016985
        artikel: I
  - number: '3.2'
    text: |-
      Niet verzekerd is de vreemdeling die niet rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '3.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste en tweede lid, uitbreiding dan wel
      beperking worden gegeven aan de kring van verzekerden.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel3
  - number: '3.4'
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in het derde lid, kan worden afgeweken van het tweede lid ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel3
  - number: 3.4.a
    text: vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben verricht;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel3
  - number: 3.4.b
    text: |-
      vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3a
    text: |-
      Zo nodig in afwijking van [artikel 3][ref1] en de daarop berustende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '3'
        hoofdstuk: '2'
  - number: 3a.a
    text: |-
      wordt als verzekerde aangemerkt de persoon van wie de verzekering op grond van deze wet voortvloeit uit de
      toepassing van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel3a
  - number: 3a.b
    text: |-
      wordt niet als verzekerde aangemerkt de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel3a
  - number: '4'
    text: |-
      Zelfstandige is de persoondie de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], nog niet heeft bereikt:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 4.a
    text: |-
      die in Nederland woont en die winst uit onderneming geniet, tenzij hij de onderneming niet voor eigen rekening
      feitelijk drijft;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel4
  - number: 4.b
    text: |-
      die niet in Nederland woont en die winst uit Nederlandse onderneming geniet, tenzij hij de onderneming niet voor
      eigen rekening feitelijk drijft.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel4
  - number: 4a.1
    text: |-
      De beschikking, bedoeld in [artikel 3.156 van de Wet inkomstenbelasting 2001][ref1], zoals dat artikel luidt direct
      voorafgaand aan het in [artikel IX, eerste lid, van de Wet deregulering beoordeling arbeidsrelaties][ref2] bedoelde
      tijdstip, waarin de voordelen, die de belastingplichtige geniet of zal gaan genieten uit een arbeidsrelatie of uit
      arbeidsrelaties waarin sprake is van hetzelfde soort van werkzaamheden die onder overeenkomstige condities worden
      verricht, worden aangemerkt als winst uit een onderneming, heeft voor de termijn waarvoor deze beschikking geldt
      als gevolg dat de belastingplichtige, met betrekking tot die arbeidsrelaties, wordt aangemerkt als zelfstandige als
      bedoeld in [artikel 4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037602#ArtikelIX
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel4
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037602
        artikel: IX
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '4'
        hoofdstuk: '2'
  - number: 4a.2
    text: |-
      Indien de beschikking, bedoeld in het eerste lid, wordt herzien, laat dat het in het eerste lid bedoelde gevolg
      onverlet, voor de termijn waarvoor die beschikking gold.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel4a
  - number: '5'
    text: |-
      Beroepsbeoefenaar is de persoondie de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], nog niet heeft bereikt, die:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 5.a
    text: anders dan uit dienstbetrekking inkomsten uit tegenwoordige arbeid geniet;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel5
  - number: 5.b
    text: |-
      anders dan in dienstbetrekking arbeid verricht ten behoeve van een lichaam waarin hij een aanmerkelijk belang
      heeft.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel5
  - number: '6'
    text: |-
      Meewerkende echtgenoot is de persoon die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], nog niet heeft bereikt die anders dan in
      dienstbetrekking, als zelfstandige of als beroepsbeoefenaar, meewerkt in de onderneming van zijn echtgenoot.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '7.1'
    text: |-
      Recht op arbeidsongeschiktheidsuitkering heeft de verzekerde die arbeidsongeschikt wordt indien hij in de
      52 weken onmiddellijk voorafgaande aan de dag, waarop de arbeidsongeschiktheid is ingetreden, arbeid in het
      bedrijfs- of beroepsleven heeft verricht gericht op het verwerven van winst of inkomsten. Als eerste dag van
      de arbeidsongeschiktheid geldt de eerste werkdag waarop wegens ziekte niet is gewerkt of het werken tijdens de
      werktijd is gestaakt. Bij ministeriële regeling kunnen nadere en afwijkende regels worden gesteld in verband met
      het voor bijzondere gevallen vaststellen van welke dag als eerste werkdag wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het recht op arbeidsongeschiktheidsuitkering gaat niet eerder in dan nadat de arbeidsongeschiktheid onafgebroken 52
      weken heeft geduurd en na afloop van dat tijdvak voortduurt.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7
  - number: '7.3'
    text: |-
      Voor het bepalen van het tijdvak van 52 weken, bedoeld in het tweede lid, worden perioden van arbeidsongeschiktheid
      samengeteld, indien zij elkaar met onderbreking van minder dan vier weken opvolgen of indien zij direct
      voorafgaan aan en aansluiten op een periode waarin uitkering in verband met zwangerschap of bevalling op grond van
      [artikel 3:18][ref1] of [3:30, eerste lid, van de Wet arbeid en zorg][ref2] wordt genoten, tenzij de ongeschiktheid
      redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '7.4'
    text: |-
      Recht op arbeidsongeschiktheidsuitkering heeft eveneens de verzekerde die na afloop van het in het tweede lid
      bedoelde tijdvak van 52 weken niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval is binnen vier
      onafgebroken weken na afloop van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7
  - number: '7.5'
    text: |-
      Voor het bepalen van het tijdvak van 52 weken, bedoeld in het tweede lid, worden steeds in aanmerking genomen
      tijdvakken, gedurende welke de verzekerde recht zou hebben gehad op ziekengeld op grond van de [Ziektewet][ref1],
      indien hij op grond van die wet zou zijn verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '7.6'
    text: |-
      Voor de toepassing van het eerste tot en met vierde lid wordt niet als arbeidsongeschikt beschouwd de verzekerde
      die minder dan 25% arbeidsongeschikt is alsmede de verzekerde die een uitkering geniet als bedoeld in het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7
  - number: 7a.1
    text: |-
      De verzekerde, bedoeld in [artikel 7][ref1], heeft geen recht op arbeidsongeschiktheidsuitkering, indien de dag
      waarop het recht op arbeidsongeschiktheidsuitkering zou ingaan, is gelegen in een periode dat hij niet in Nederland
      woont.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7a.2
    text: |-
      Het eerste lid is niet van toepassing indien de verzekerde op die dag woont in een land waarin op grond van een
      verdrag of een besluit van een volkenrechtelijke organisatie recht op arbeidsongeschiktheidsuitkering kan bestaan.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7a
  - number: 7a.3
    text: |-
      De persoon, die op grond van het eerste lid geen recht op arbeidsongeschiktheidsuitkering heeft, heeft vanaf de
      dag:
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7a
  - number: 7a.3.a
    text: dat hij in Nederland woont; of
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7a
  - number: 7a.3.b
    text: |-
      dat hij in een land woont waarmee een verdrag in werking is getreden dan wel een besluit van een volkenrechtelijke
      organisatie van kracht is geworden, op grond waarvan recht op arbeidsongeschiktheidsuitkering kan bestaan;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7a
  - number: 7a.4
    text: |-
      De persoon, bedoeld in het derde lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten aanzien
      van wie dat wel het geval is binnen vier weken na die dag, heeft met inachtneming van de bepalingen van deze wet
      recht op toekenning van arbeidsongeschiktheidsuitkering. [Artikel 7, zesde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het eerste lid afwijkende regels worden
      gesteld ten gunste van:
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7a
  - number: 7a.5.a
    text: de verzekerde, die tevens werkzaamheden verricht in het algemeen belang en niet in Nederland woont;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7a
  - number: 7a.5.b
    text: |-
      de verzekerde, die in Aruba, Curaçao, Sint Maarten of in de openbare lichamen Bonaire, Sint Eustatius en Saba
      woont; of
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7a
  - number: 7a.5.c
    text: de gezinsleden van de in de onderdelen a of b bedoelde verzekerde.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7a
  - number: 7b.1
    text: |-
      De verzekerde, bedoeld in [artikel 7][ref1], heeft geen recht op arbeidsongeschiktheidsuitkering indien de dag
      waarop het recht op arbeidsongeschiktheidsuitkering zou ingaan dan wel de dag na afloop van de toepassing van
      [artikel 7c][ref2] met betrekking tot dat recht op uitkering, is gelegen in een periode dat hem rechtens zijn
      vrijheid is ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel7c
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: 7c
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7b.2
    text: |-
      De persoon, die op grond van het eerste lid geen recht op arbeidsongeschiktheidsuitkering heeft, heeft
      vanaf de dag dat hij in vrijheid wordt gesteld met inachtneming van de bepalingen van deze wet recht op
      arbeidsongeschiktheidsuitkering, indien hij op die dag arbeidsongeschikt is. [Artikel 7, zesde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7b.3
    text: |-
      Voor de toepassing van het eerste lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7b
  - number: 7b.4
    text: |-
      De persoon, bedoeld in het tweede lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten
      aanzien van wie dit wel het geval is binnen vier weken na die dag, heeft met inachtneming van de bepalingen
      van deze wet recht op toekenning van arbeidsongeschiktheidsuitkering. [Artikel 7, zesde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7b.5
    text: |-
      Het eerste lid is niet van toepassing en het tweede en vierde lid zijn van overeenkomstige toepassing op bij
      algemene maatregel van bestuur aan te wijzen categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf
      of vrijheidsbenemende maatregel buiten een justitiële inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7b
  - number: 7c
    text: |-
      De verzekerde, bedoeld in [artikel 7][ref1], heeft geen recht op arbeidsongeschiktheidsuitkering indien en voor
      zolang hij zich op de dag waarop het recht op arbeidsongeschiktheidsuitkering zou ingaan en daarna onttrekt aan de
      tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7d.1
    text: |-
      De verzekerde, bedoeld in [artikel 7][ref1], heeft geen recht op een arbeidsongeschiktheidsuitkering indien hij op
      de dag waarop het recht op arbeidsongeschiktheidsuitkering zou ingaan, een uitreiziger is.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7d.2
    text: |-
      De persoon, die op grond van het eerste lid geen recht op een arbeidsongeschiktheidsuitkering heeft, heeft vanaf
      de dag dat niet langer het gegronde vermoeden bestaat dat hij zich buiten Nederland bevindt met het doel zich aan
      te sluiten bij een organisatie als bedoeld in [artikel 1, eerste lid, onderdeel p][ref1], met inachtneming van de
      bepalingen van deze wet, recht op een arbeidsongeschiktheidsuitkering, indien hij op die dag arbeidsongeschikt is.
      [Artikel 7, zesde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 7d.3
    text: |-
      De persoon, bedoeld in het tweede lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten
      aanzien van wie dit wel het geval is binnen vier weken na die dag, heeft met inachtneming van de bepalingen
      van deze wet recht op toekenning van een arbeidsongeschiktheidsuitkering. [Artikel 7, zesde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '8.1'
    text: De arbeidsongeschiktheidsuitkering wordt berekend naar de grondslag.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
  - number: '8.2'
    text: |-
      Voor de verzekerde, bedoeld in [artikel 4][ref1], is de grondslag:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel4
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '4'
        hoofdstuk: '2'
  - number: 8.2.a
    text: |-
      hetgeen hij in het boekjaar, onmiddellijk voorafgaande aan het intreden van zijn arbeidsongeschiktheid als
      zelfstandige gemiddeld per dag aan winst heeft genoten; of, indien dit leidt tot een hoger bedrag,
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
  - number: 8.2.b
    text: |-
      hetgeen hij in de vijf boekjaren, onmiddellijk voorafgaande aan het intreden van zijn arbeidsongeschiktheid als
      zelfstandige gemiddeld per dag aan winst heeft genoten.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
  - number: '8.3'
    text: |-
      Voor de verzekerde, bedoeld in [artikel 5][ref1], is de grondslag:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel5
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '5'
        hoofdstuk: '2'
  - number: 8.3.a
    text: |-
      hetgeen hij in het kalenderjaar onmiddellijk voorafgaande aan het intreden van zijn arbeidsongeschiktheid als
      beroepsbeoefenaar gemiddeld per dag aan inkomsten heeft genoten; of, indien dit leidt tot een hoger bedrag,
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
  - number: 8.3.b
    text: |-
      hetgeen hij in de vijf kalenderjaren onmiddellijk voorafgaande aan het intreden van zijn arbeidsongeschiktheid als
      beroepsbeoefenaar gemiddeld per dag aan inkomsten heeft genoten.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
  - number: '8.4'
    text: |-
      Voor de verzekerde, bedoeld in [artikel 6][ref1], is de grondslag hetgeen hij over een tijdvak, gelegen in de in
      het tweede lid genoemde perioden, op basis van de geleverde arbeidsinbreng gemiddeld per dag aan inkomsten geacht
      kan worden te hebben genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel6
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '6'
        hoofdstuk: '2'
  - number: '8.5'
    text: |-
      Indien de verzekerde, bedoeld in [artikel 4][ref1] en [6][ref2], tevens verzekerde is op grond van
      [artikel 5][ref3] wordt de grondslag bepaald op een bedrag dat de uitkomst vormt van de samentelling van de
      gemiddelde winst of inkomsten per dag als bedoeld in het tweede lid en vierde lid en de gemiddelde inkomsten per
      dag als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel5
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '5'
        hoofdstuk: '2'
  - number: '8.6'
    text: |-
      Voor personen die op grond van [artikel 3, derde lid][ref1], zijn verzekerd kan bij of krachtens algemene maatregel
      van bestuur, zonodig in afwijking van het tweede tot en met vierde lid, een grondslag worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '3'
        hoofdstuk: '2'
  - number: '8.7'
    text: De grondslag bedraagt ten hoogste het minimumloon.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
  - number: '8.8'
    text: |-
      Onder het in het zevende lid bedoelde minimumloon wordt verstaan het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref1], gedeeld door 21,75,
      of, indien het een persoon jonger dan 21 jaar betreft, op grond van de [artikelen 7, derde lid][ref2], en 8, derde
      lid, van die wet voor zijn leeftijd geldende minimumloon, gedeeld door 21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
  - number: '8.9'
    text: |-
      Indien het minimumloon wordt herzien wordt de grondslag, bedoeld in het tweede tot en met zesde lid naar
      evenredigheid herzien.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
  - number: '8.10'
    text: |-
      Een herziening van de uitkering als gevolg van een herziening van de grondslag van het minimumloon vindt plaats
      zonder dat dit bij beschikking is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
  - number: '8.11'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen betaalt de herziene uitkering, bedoeld in het tiende lid, bij de
      eerstvolgende uitkeringsbetaling nadat de grondslag van het minimumloon is herzien.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
  - number: '8.12'
    text: |-
      Indien de verzekerde die recht heeft op een arbeidsongeschiktheidsuitkering met ingang van
      dezelfde dag recht heeft op toekenning van een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt het bedrag van de overeenkomstig het tweede tot en met
      zesde lid vastgestelde grondslag, doch ten hoogste het door Onze Minister in overeenstemming met Onze Minister van
      Financiën bij ministeriële regeling aan te wijzen bedrag, verminderd met een bedrag dat gelijk is aan het dagloon
      dat aan de arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2] ten
      grondslag ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002524
  - number: '8.13'
    text: |-
      Indien de verzekerde die recht heeft op arbeidsongeschiktheidsuitkering bij het intreden van
      de arbeidsongeschiktheid tevens verzekerde was op grond van [artikel 3][ref1], [4][ref2] of
      [5 van de Wet op de arbeidsongeschiktheidsverzekering][ref3], wordt het bedrag van de overeenkomstig het tweede
      tot en met zesde lid vastgestelde grondslag, doch ten hoogste het door Onze Minister in overeenstemming met
      Onze Minister van Financiën bij ministeriële regeling aan te wijzen bedrag, verminderd met een bedrag dat
      gelijk is aan het loon dat hij als werknemer genoot, voor zover dat loon als dagloon aan de toekenning van een
      arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref4] ten grondslag
      ligt of zou liggen als hij bij het intreden van de arbeidsongeschiktheid tevens arbeidsongeschikt is in de zin van
      [die wet][ref5] dan wel arbeidsongeschikt zou zijn geworden in de zin van [die wet][ref6]. De eerste zin blijft
      buiten toepassing als [artikel 59, eerste of tweede lid][ref7], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0002524
      [ref6]: https://wetten.overheid.nl/BWBR0002524
      [ref7]: https://wetten.overheid.nl/BWBR0008656#Artikel59
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0002524
      - id: ref6
        bwb_id: BWBR0002524
      - id: ref7
        bwb_id: BWBR0008656
        artikel: '59'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '8.14'
    text: |-
      Indien de verzekerde die recht heeft op arbeidsongeschiktheidsuitkering op de dag van het intreden
      van de arbeidsongeschiktheid recht had op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], ziekengeld op grond van de [Ziektewet][ref2], uitkering
      op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref3] of een uitkering op
      grond van de [Werkloosheidswet][ref4], wordt het bedrag van de overeenkomstig het tweede tot en met zesde lid
      vastgestelde grondslag, doch ten hoogste het door Onze Minister in overeenstemming met Onze Minister van Financiën
      bij ministeriële regeling aan te wijzen bedrag, verminderd met het bedrag van genoemde uitkering op grond van
      de [Wet op de arbeidsongeschiktheidsverzekering][ref5], de [Ziektewet][ref6], de [Wet arbeid en zorg][ref7]
      of de [Werkloosheidswet][ref8] waarop hij recht heeft op de dag voorafgaande aan het intreden van de
      arbeidsongeschiktheid. De eerste zin blijft buiten toepassing als [artikel 59, eerste of tweede lid][ref9], van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0002524
      [ref6]: https://wetten.overheid.nl/BWBR0001888
      [ref7]: https://wetten.overheid.nl/BWBR0013008
      [ref8]: https://wetten.overheid.nl/BWBR0004045
      [ref9]: https://wetten.overheid.nl/BWBR0008656#Artikel59
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004045
      - id: ref5
        bwb_id: BWBR0002524
      - id: ref6
        bwb_id: BWBR0001888
      - id: ref7
        bwb_id: BWBR0013008
      - id: ref8
        bwb_id: BWBR0004045
      - id: ref9
        bwb_id: BWBR0008656
        artikel: '59'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '8.15'
    text: |-
      Indien het in het twaalfde lid bedoelde dagloon, het in het dertiende lid bedoelde loon of het in het veertiende
      lid bedoelde bedrag van de uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1], de
      [Ziektewet][ref2], de [Wet arbeid en zorg][ref3] of de [Werkloosheidswet][ref4], alsmede het in die leden genoemde
      bedrag van de overeenkomstig het tweede tot en met zesde lid vastgestelde grondslag lager is dan het minimumloon,
      bedoeld in het achtste lid, bedraagt de grondslag voor de arbeidsongeschiktheidsuitkering het minimumloon,
      verminderd met dat dagloon, loon of bedrag, tenzij de grondslag, berekend op grond van het tweede tot en met zesde
      lid tot een lager bedrag leidt, in welk geval laatstgenoemd bedrag als grondslag geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0013008
      [ref4]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0013008
      - id: ref4
        bwb_id: BWBR0004045
  - number: '8.16'
    text: De toepassing van het twaalfde, dertiende en veertiende lid geldt onverminderd het zevende lid.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
  - number: '8.17'
    text: |-
      Voor de toepassing van het twaalfde tot en met het veertiende lid wordt onder loon, arbeidsongeschiktheidsuitkering
      op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1], ziekengeld op grond van de [Ziektewet][ref2],
      uitkering op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref3] of uitkering
      op grond van de [Werkloosheidswet][ref4] tevens verstaan de vakantie-uitkering waarop uit hoofde van dat
      loon of die uitkering recht bestaat, voor zover die vakantie-uitkering over dezelfde periode is berekend.
      Voor de toepassing van het vijftiende lid wordt onder loon, arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref5], ziekengeld op grond van de [Ziektewet][ref6], uitkering op
      grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref7] of uitkering op grond van de
      [Werkloosheidswet][ref8] niet verstaan de vakantie-uitkering waarop uit hoofde van dat loon of die uitkering recht
      bestaat en wordt onder dagloon verstaan het dagloon maal 100/108.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0002524
      [ref6]: https://wetten.overheid.nl/BWBR0001888
      [ref7]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref8]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004045
      - id: ref5
        bwb_id: BWBR0002524
      - id: ref6
        bwb_id: BWBR0001888
      - id: ref7
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref8
        bwb_id: BWBR0004045
  - number: '8.18'
    text: |-
      Het twaalfde tot en met vijftiende lid is niet van toepassing op de persoon die een uitkering ontvangt op grond
      van de vrijwillige verzekering, bedoeld in [hoofdstuk VI van de Wet op de arbeidsongeschiktheidsverzekering][ref1],
      [hoofdstuk IV van de Ziektewet][ref2] of [hoofdstuk III van de Werkloosheidswet][ref3].
      Het veertiende en vijftiende lid is evenmin van toepassing op de persoon die op grond van
      [artikel 3:6, tweede lid, van de Wet arbeid en zorg][ref4] een uitkering ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0001888#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0001888
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004045
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '8.19'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld met
      betrekking tot de winst, de inkomsten en de periode waarover de winst en de inkomsten worden berekend, bedoeld in
      het tweede tot en met het zesde lid.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
  - number: '8.20'
    text: |-
      Voor de toepassing van het twaalfde tot en met het vijftiende lid en het zeventiende lid wordt met een
      uitkering op grond van de [Werkloosheidswet][ref1] gelijkgesteld een uitkering ter zake van ontslag of
      werkloosheid, onder welke benaming dan ook, met uitzondering van een uitkering in verband met functioneel
      leeftijdsontslag of vrijwillig vervroegd uittreden, uit hoofde van een arbeidsverhouding als bedoeld in
      [artikel 1, onderdeel l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref2]. Dit lid vervalt op
      het tijdstip van aanvang van fase 3 van de [Wet overheidspersoneel onder de werknemersverzekeringen][ref3], bedoeld
      in [artikel 54 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0009267#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009267
      [ref4]: https://wetten.overheid.nl/BWBR0009267#Artikel54
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0009267
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0009267
      - id: ref4
        bwb_id: BWBR0009267
        artikel: '54'
  - number: '9.1'
    text: |-
      De arbeidsongeschiktheidsuitkering bedraagt per dag, de zaterdagen en zondagen niet meegerekend, bij een
      arbeidsongeschiktheid van:






                    25–35%:


                    21% van de grondslag;




                    35–45%:


                    28% van de grondslag;




                    45–55%:


                    35% van de grondslag;




                    55–65%:


                    42% van de grondslag;




                    65–80%:


                    50,75% van de grondslag;




                    80% of meer:


                    75% van de grondslag.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel9
  - number: '9.2'
    text: |-
      Bij de vaststelling van de mate van arbeidsongeschiktheid wordt, zoveel doenlijk, rekening gehouden met verkregen
      nieuwe bekwaamheden.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel9
  - number: '10'
    text: |-
      Een arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van 80% of meer, wordt, indien de
      verzekerde verkeert in een althans voorlopig blijvende toestand van hulpbehoevendheid, die geregeld oppassing en
      verzorging nodig maakt, voor de duur van die hulpbehoevendheid tot ten hoogste zijn grondslag verhoogd. De eerste
      zin vindt geen toepassing, indien de verzekerde in een inrichting is opgenomen en de kosten van verblijf ten laste
      van een zorgverzekering of een verzekering inzake ziektekosten komen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel10
  - number: '11.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan met betrekking tot uit deze wet voortvloeiende aanspraken
      geheel of ten dele, tijdelijk of blijvend, buiten aanmerking laten:
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel11
  - number: 11.1.a
    text: gehele arbeidsongeschiktheid, die bestond op het tijdstip, dat de verzekering een aanvang nam;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel11
  - number: 11.1.b
    text: |-
      arbeidsongeschiktheid, die binnen een half jaar na het tijdstip, dat de verzekering een aanvang nam, is ingetreden,
      terwijl de gezondheidstoestand van de verzekerde ten tijde van de aanvang van zijn verzekering het intreden van
      arbeidsongeschiktheid binnen een half jaar kennelijk moest doen verwachten.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel11
  - number: '11.2'
    text: |-
      De in het eerste lid, onderdeel *b*, bedoelde bevoegdheid strekt zich mede uit tot toeneming van de
      arbeidsongeschiktheid, voor zover deze toeneming kennelijk is voortgekomen uit dezelfde oorzaak als de
      arbeidsongeschiktheid die binnen een half jaar na de aanvang van de verzekering is ingetreden.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel11
  - number: '11.3'
    text: |-
      Zolang het Uitvoeringsinstituut werknemersverzekeringen op grond van het eerste lid arbeidsongeschiktheid
      buiten aanmerking laat, vindt [artikel 2, tweede lid][ref1], overeenkomstige toepassing met betrekking tot
      de door de verzekerde aan deze wet nog te ontlenen aanspraken, met dien verstande, dat voor de aanvang van de
      verzekering in de plaats treedt het tijdstip, met ingang waarvan het Uitvoeringsinstituut werknemersverzekeringen
      arbeidsongeschiktheid buiten aanmerking laat.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel2
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '2'
        hoofdstuk: '1'
  - number: '12.1'
    text: |-
      De arbeidsongeschiktheidsuitkering wordt herzien wanneer de verzekerde, aan wie zij is toegekend, op grond van deze
      wet voor een hogere of lagere uitkering in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel12
  - number: '12.2'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van de arbeidsongeschiktheidsuitkering plaats
      met inachtneming van de [artikelen 13 tot en met 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel13
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '12.3'
    text: |-
      De arbeidsongeschiktheidsuitkering van de verzekerde die deelneemt aan een voor hem gewenste opleiding of scholing,
      wordt gedurende deze opleiding of scholing niet herzien in verband met een daaruit voortvloeiende afneming van
      de arbeidsongeschiktheid, tenzij [artikel 9, derde lid][ref1], van toepassing is. Indien de verzekerde tijdens
      de opleiding of scholing inkomsten uit arbeid verwerft, is [artikel 58, eerste lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel58
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '58'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '13.1'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering,
      berekend naar een arbeidsongeschiktheid van minder dan 45%, onverminderd de [artikelen 15][ref1] en [16][ref2],
      plaats zodra de toegenomen arbeidsongeschiktheid onafgebroken 52 weken heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel16
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '13.2'
    text: |-
      De in het eerste lid bedoelde herziening vindt niet plaats, indien de toeneming kennelijk is voortgekomen uit een
      andere oorzaak dan die waaruit de ongeschiktheid ter zake waarvan uitkering wordt genoten, is voortgekomen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel13
  - number: '13.3'
    text: |-
      Indien de uitkeringsgerechtigde bij het intreden van de toeneming van de arbeidsongeschiktheid of in de 52 weken
      onmiddellijk voorafgaande aan de toeneming van de arbeidsongeschiktheid arbeid verricht of heeft verricht als
      bedoeld in [artikel 7, eerste lid][ref1], vindt de in het eerste lid bedoelde herziening plaats, ook indien de
      toeneming kennelijk is voortgekomen uit een andere oorzaak dan die waaruit de ongeschiktheid ter zake waarvan
      uitkering wordt genoten, is voortgekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '13.4'
    text: |-
      Voor het bepalen van het tijdvak van 52 weken, bedoeld in het eerste lid, worden perioden van toegenomen
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen of
      indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering in verband met zwangerschap of
      bevalling op grond van [artikel 3:18][ref1] of [3:30, eerste lid, van de Wet arbeid en zorg][ref2] wordt genoten,
      tenzij de ongeschiktheid redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak. Bij de
      vaststelling van het tijdvak van 52 weken blijven perioden, waarin uitkering in verband met zwangerschap of
      bevalling op grond van [artikel 3:18][ref3] of [3:30, eerste lid, van de Wet arbeid en zorg][ref4] wordt genoten,
      buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '14.1'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering,
      berekend naar een arbeidsongeschiktheid van ten minste 45%, onverminderd [artikel 15][ref1], plaats zodra de
      toegenomen arbeidsongeschiktheid onafgebroken vier weken heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel15
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '14.2'
    text: |-
      Indien de arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45%, doch minder
      dan 80%, wegens afneming van de arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder dan
      45%, doch binnen vier weken na de dag, met ingang waarvan die uitkering is herzien, de arbeidsongeschiktheid weer
      toeneemt, is het eerste lid van toepassing, onder afwijking van [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel13
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '14.3'
    text: |-
      Voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste en tweede lid, worden perioden van
      toegenomen arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken
      opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering in verband met
      zwangerschap of bevalling op grond van [artikel 3:18][ref1] of [3:30, eerste lid, van de Wet arbeid en zorg][ref2]
      wordt genoten, tenzij de ongeschiktheid redelijkerwijs niet geacht kan worden voort te vloeien
      uit dezelfde oorzaak. Bij de vaststelling van de eerstgenoemde periode van vier weken blijven
      perioden, waarin uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:18][ref3]
      of [3:30, eerste lid, van de Wet arbeid en zorg][ref4] wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '15.1'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering steeds
      plaats zodra de toeneming van de arbeidsongeschiktheid optreedt, indien deze intreedt:
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel15
  - number: 15.1.a
    text: binnen vier weken na de dag, met ingang waarvan de arbeidsongeschiktheidsuitkering werd toegekend;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel15
  - number: 15.1.b
    text: |-
      binnen vier weken na de dag, met ingang waarvan de arbeidsongeschiktheidsuitkering wegens toegenomen
      arbeidsongeschiktheid werd herzien;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel15
  - number: 15.1.c
    text: |-
      binnen vier weken na de dag, met ingang waarvan de arbeidsongeschiktheidsuitkering, die voordien was berekend
      naar een arbeidsongeschiktheid van 80% of meer, wegens afneming van de arbeidsongeschiktheid is herzien naar een
      arbeidsongeschiktheid van minder dan 80%;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel15
  - number: 15.1.d
    text: binnen een bij ministeriële regeling aan te geven tijdvak in daarbij aan te wijzen gevallen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel15
  - number: '15.2'
    text: |-
      Indien de arbeidsongeschiktheidsuitkering werd toegekend, onderscheidenlijk wegens toegenomen arbeidsongeschiktheid
      werd herzien, met toepassing van [artikel 36, tweede lid][ref1], onderscheidenlijk [artikel 38, tweede lid][ref2],
      geldt met betrekking tot het eerste lid, onderdeel *a* en *b*, als dag met ingang waarvan de
      arbeidsongeschiktheidsuitkering werd toegekend onderscheidenlijk herzien de dag, met ingang waarvan die uitkering
      zou zijn toegekend, onderscheidenlijk zou zijn herzien, indien [artikel 36, tweede lid][ref3], onderscheidenlijk
      [artikel 38, tweede lid][ref4], geen toepassing zou hebben gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0008656#Artikel38
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0008656
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '15.3'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid vindt herziening van een arbeidsongeschiktheidsuitkering op
      grond van een herbeoordeling als bedoeld in [artikel 35, zesde lid][ref1], plaats met ingang van 22 februari 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel35
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '15.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor gevallen waarbij direct herziening van de
      arbeidsongeschiktheidsuitkering plaatsvindt. Op grond van deze regels kan bedoelde herziening slechts plaatsvinden
      ten behoeve van de verzekerde die bij hervatting van de arbeid in het bedrijfs- of beroepsleven winst of inkomsten
      geniet, die minder bedragen dan evenredig is aan zijn nog bestaande arbeidsgeschiktheid.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel15
  - number: '16.1'
    text: |-
      Ter zake van toeneming van de arbeidsongeschiktheid die intreedt binnen vijf jaar na de datum van toekenning
      of herziening van de arbeidsongeschiktheidsuitkering en die voortkomt uit dezelfde oorzaak als die waaruit
      de arbeidsongeschiktheid ter zake waarvan uitkering wordt genoten, is voortgekomen, vindt herziening van de
      arbeidsongeschiktheidsuitkering steeds plaats, zodra de toegenomen arbeidsongeschiktheid onafgebroken vier weken
      heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel16
  - number: '16.2'
    text: |-
      Voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste lid, worden perioden van toegenomen
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen
      of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering in verband met zwangerschap
      of bevalling op grond van [artikel 3:18][ref1] of [3:30, eerste lid, van de Wet arbeid en zorg][ref2] wordt
      genoten, tenzij de ongeschiktheid redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak.
      Bij de vaststelling van de eerstgenoemde periode van vier weken blijven perioden, waarin uitkering in verband met
      zwangerschap of bevalling op grond van [artikel 3:18][ref3] of [3:30, eerste lid, van de Wet arbeid en zorg][ref4]
      wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '16.3'
    text: |-
      Dit artikel vindt geen toepassing, indien recht bestaat op herziening van de arbeidsongeschiktheidsuitkering op
      grond van [artikel 14][ref1] of [15, eerste lid, onderdelen a tot en met c, of derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel15
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 16a
    text: |-
      Indien als gevolg van de toeneming van de arbeidsongeschiktheid zowel recht op herziening van de
      arbeidsongeschiktheidsuitkering bestaat of is ontstaan op grond van de [artikelen 13][ref1], [14][ref2],
      [15][ref3] en [16][ref4], als op ziekengeld op grond van de [Ziektewet][ref5], wordt het bedrag waarmee de
      arbeidsongeschiktheidsuitkering is of wordt verhoogd uitbetaald voor zover dit het ziekengeld overtreft, danwel
      zou overtreffen, indien het ziekengeld op grond van [artikel 45 van de Ziektewet][ref6] geheel of gedeeltelijk
      is geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0008656#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0001888
      [ref6]: https://wetten.overheid.nl/BWBR0001888#Artikel45
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0008656
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0001888
      - id: ref6
        bwb_id: BWBR0001888
        artikel: '45'
  - number: '17.1'
    text: |-
      Indien wegens toeneming van de arbeidsongeschiktheid herziening van de arbeidsongeschiktheidsuitkering heeft
      plaatsgevonden, vindt hernieuwde vaststelling van een grondslag plaats overeenkomstig [artikel 8][ref1] en
      de daarop berustende bepalingen, mits dat leidt tot een hogere grondslag dan die, welke laatstelijk aan de
      arbeidsongeschiktheidsuitkering ten grondslag werd gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '17.2'
    text: |-
      Voor de toepassing van het eerste lid wordt in [artikel 8][ref1] in plaats van «het intreden van zijn
      arbeidsongeschiktheid» gelezen: de toeneming van zijn arbeidsongeschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '18.1'
    text: |-
      Onverminderd hetgeen overigens in deze wet is bepaald ter zake van herziening of intrekking van een beschikking
      tot toekenning van arbeidsongeschiktheidsuitkering, alsook ter zake van een weigering van een zodanige uitkering,
      herziet het Uitvoeringsinstituut werknemersverzekeringen een dergelijke beschikking of trekt het deze in:
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel18
  - number: 18.1.a
    text: |-
      ter uitvoering van een beslissing als bedoeld in [artikel 11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel11
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 18.1.b
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 45][ref1], [46][ref2] of
      [70][ref3] heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van een uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
  - number: 18.1.c
    text: indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel18
  - number: 18.1.d
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 45][ref1], [46][ref2] of
      [70][ref3] ertoe leidt dat niet kan worden vastgesteld of nog recht op uitkering bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '70'
        hoofdstuk: '5'
  - number: '18.2'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van herziening of intrekking als bedoeld in het eerste lid af te zien.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel18
  - number: '18.3'
    text: |-
      Een besluit tot toekenning van loonsuppletie als bedoeld in [artikel 67a][ref1] en van inkomenssuppletie als
      bedoeld in [artikel 67b][ref2] wordt ingetrokken of herzien indien die loonsuppletie of de inkomenssuppletie ten
      onrechte of tot een te hoog bedrag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel67a
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel67b
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 67a
        hoofdstuk: 3A
      - id: ref2
        bwb_id: BWBR0008656
        artikel: 67b
        hoofdstuk: 3A
  - number: '19.1'
    text: 'Het recht op arbeidsongeschiktheidsuitkering eindigt:'
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel19
  - number: 19.1.a
    text: |-
      met ingang van de dag waarop de verzekerde de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 19.1.b
    text: |-
      wanneer de arbeidsongeschiktheid is geëindigd, of beneden 25% is gedaald, met ingang van de dag, aangegeven in de
      daartoe strekkende beschikking van het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel19
  - number: '19.2'
    text: |-
      De arbeidsongeschiktheidsuitkering van de verzekerde die deelneemt aan een voor hem gewenste opleiding of scholing,
      wordt gedurende deze opleiding of scholing niet ingetrokken in verband met een daaruit voortvloeiende afneming
      van de arbeidsongeschiktheid, tenzij [artikel 9, derde lid][ref1], van toepassing is. Indien de verzekerde tijdens
      de opleiding of scholing inkomsten uit arbeid verwerft, is [artikel 58, eerste lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel58
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '58'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '19.3'
    text: |-
      Indien de intrekking van de arbeidsongeschiktheidsuitkering verband houdt met een voltooide scholing of opleiding,
      gaat deze intrekking niet eerder in dan een jaar na voltooiing van die scholing of opleiding. Indien de verzekerde
      eerder inkomsten uit arbeid verwerft, is [artikel 58, eerste lid][ref1], tot uiterlijk het einde van dat jaar van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel58
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '58'
        hoofdstuk: '3'
        afdeling: '3'
  - number: '19.4'
    text: |-
      Het recht op arbeidsongeschiktheidsuitkering eindigt, indien de verzekerde rechtens zijn vrijheid is ontnomen,
      vanaf de dag dat deze vrijheidsontneming één maand heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel19
  - number: '19.5'
    text: |-
      Het recht op arbeidsongeschiktheidsuitkering eindigt, indien de verzekerde zich onttrekt aan de tenuitvoerlegging
      van een vrijheidsstraf of vrijheidsbenemende maatregel.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel19
  - number: '19.6'
    text: |-
      Voor de verzekerde die op de dag voorafgaande aan de vrijheidsontneming geen recht heeft op
      arbeidsongeschiktheidsuitkering op grond van het vijfde lid, eindigt het recht op arbeidsongeschiktheidsuitkering,
      in afwijking van het vierde lid, vanaf de dag dat de vrijheidsontneming ingaat.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel19
  - number: '19.7'
    text: |-
      Voor de toepassing van het vierde lid worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel19
  - number: '19.8'
    text: Het recht op een arbeidsongeschiktheidsuitkering eindigt, indien de verzekerde een uitreiziger is.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel19
  - number: 19a.1
    text: Het recht op arbeidsongeschiktheidsuitkering eindigt indien de verzekerde niet meer in Nederland woont.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel19a
  - number: 19a.2
    text: |-
      [Artikel 7a, tweede en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7a
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 7a
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '20.1'
    text: 'Indien de verzekerde:'
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel20
  - number: 20.1.a
    text: |-
      wiens arbeidsongeschiktheidsuitkering wegens afneming van arbeidsongeschiktheid op grond van
      [artikel 19, eerste lid, onderdeel b][ref1], is ingetrokken; of


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 20.1.b
    text: |-
      die aan het einde van de wachttijd, bedoeld in [artikel 7, tweede lid][ref1], ongeschikt is tot het
      verrichten van zijn arbeid wegens ziekte, gebreken, zwangerschap of bevalling, maar geen recht had op
      arbeidsongeschiktheidsuitkering omdat hij niet arbeidsongeschikt was;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '20.2'
    text: |-
      Voor het bepalen van het tijdvak van vier weken, bedoeld in het eerste lid, worden perioden van
      arbeidsongeschiktheid samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen
      of indien zij direct voorafgaan aan en aansluiten op een periode waarin uitkering in verband met zwangerschap
      of bevalling op grond van [artikel 3:18][ref1] of [3:30, eerste lid, van de Wet arbeid en zorg][ref2] wordt
      genoten, tenzij de ongeschiktheid redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak.
      Bij de vaststelling van de eerstgenoemde periode van vier weken blijven perioden, waarin uitkering in verband met
      zwangerschap of bevalling op grond van [artikel 3:18][ref3] of [3:30, eerste lid, van de Wet arbeid en zorg][ref4]
      wordt genoten, buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '20.3'
    text: |-
      Dit artikel vindt geen toepassing indien op grond van [artikel 21][ref1] aanspraak bestaat op heropening van de
      arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel21
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '20.4'
    text: |-
      In de gevallen, waarin dit artikel toepassing vindt wordt de grondslag van de toe te kennen
      arbeidsongeschiktheidsuitkering niet lager gesteld dan de grondslag die voor de berekening van de laatstelijk
      ontvangen arbeidsongeschiktheidsuitkering in aanmerking werd genomen, dan wel de grondslag die in aanmerking zou
      zijn genomen, indien na het einde van de wachttijd, bedoeld in [artikel 7, eerste lid][ref1], recht zou hebben
      bestaan op een arbeidsongeschiktheidsuitkering, zoals die sinds de beëindiging van de uitkering onderscheidenlijk
      sinds het einde van die wachttijd op grond van [artikel 8][ref2] zou zijn herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel8
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '20.5'
    text: |-
      De [artikelen 7b][ref1], [7c][ref2] en [7d][ref3] en de daarop berustende bepalingen zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel7c
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel7d
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 7b
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: 7c
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: 7d
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '20.6'
    text: |-
      Indien de arbeidsongeschiktheidsuitkering op grond van dit artikel wordt toegekend en tevens recht op
      ziekengeld op grond van de [Ziektewet][ref1] bestaat, wordt de arbeidsongeschiktheidsuitkering uitbetaald
      voor zover deze het ziekengeld overtreft, danwel zou overtreffen, indien het ziekengeld op grond van
      [artikel 45 van de Ziektewet][ref2] geheel of gedeeltelijk is geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel45
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '45'
  - number: '21.1'
    text: |-
      De persoon, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van ten minste 45%, in
      verband met [artikel 19, eerste lid, onderdeel b][ref1], is ingetrokken, heeft, indien hij binnen vier weken na de
      dag, met ingang waarvan de uitkering is ingetrokken, weer arbeidsongeschikt wordt, aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '21.2'
    text: |-
      Het eerste lid is mede van toepassing ten aanzien van de persoon, wiens arbeidsongeschiktheidsuitkering, berekend
      naar een arbeidsongeschiktheid van minder dan 45% in verband met [artikel 19, eerste lid, onderdeel b][ref1],
      is ingetrokken, indien hij weer arbeidsongeschikt wordt binnen vier weken na de dag, met ingang waarvan die
      uitkering, die voordien was berekend naar een arbeidsongeschiktheid van ten minste 45%, wegens afneming van de
      arbeidsongeschiktheid is herzien naar een arbeidsongeschiktheid van minder dan 45%.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '21.3'
    text: |-
      De persoon, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan 45%,
      in verband met [artikel 19, eerste lid, onderdeel b][ref1], is ingetrokken met ingang van een dag, gelegen binnen
      vier weken na de dag, met ingang waarvan die uitkering werd toegekend of wegens toegenomen arbeidsongeschiktheid
      werd herzien, heeft, indien hij binnen die vier weken weer arbeidsongeschikt wordt, aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering. [Artikel 15, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel15
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '21.4'
    text: |-
      De persoon, wiens arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van minder dan 45%,
      in verband met [artikel 19, eerste lid, onderdeel b][ref1], is ingetrokken, heeft, onverminderd het tweede en
      het derde lid, indien hij binnen vier weken na de dag, met ingang waarvan de uitkering is ingetrokken, weer
      arbeidsongeschikt wordt, niet kennelijk uit een andere oorzaak dan die, waaruit de arbeidsongeschiktheid,
      ter zake waarvan de ingetrokken uitkering werd genoten, is voortgekomen, aanspraak op heropening van de
      arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '21.5'
    text: |-
      Ten aanzien van degene wiens arbeidsongeschiktheidsuitkering is ingetrokken in verband met
      [artikel 19, eerste lid, onderdeel b][ref1], en die weer arbeidsongeschikt is geworden op grond
      van een herbeoordeling als bedoeld in [artikel 35, zesde lid][ref2], vindt heropening van de
      arbeidsongeschiktheidsuitkering plaats met ingang van 22 februari 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel35
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: '21.6'
    text: De heropening vindt plaats naar de mate van arbeidsongeschiktheid op de dag, waarop de heropening ingaat.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel21
  - number: '21.7'
    text: |-
      Indien zowel recht bestaat of is ontstaan op heropening van de arbeidsongeschiktheidsuitkering op grond van
      dit artikel als op ziekengeld op grond van de [Ziektewet][ref1], wordt de arbeidsongeschiktheidsuitkering
      uitbetaald voor zover deze het ziekengeld overtreft, danwel zou overtreffen, indien het ziekengeld op grond van
      [artikel 45 van de Ziektewet][ref2] geheel of gedeeltelijk is geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel45
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '45'
  - number: '21.8'
    text: |-
      Voor de toepassing van het eerste tot en met zesde lid wordt niet als arbeidsongeschikt beschouwd de persoon die
      minder dan 25% arbeidsongeschikt is.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel21
  - number: '21.9'
    text: |-
      De [artikelen 7b][ref1], [7c][ref2] en [7d][ref3] en de daarop berustende bepalingen zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel7c
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel7d
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 7b
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: 7c
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: 7d
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 21a.1
    text: |-
      De persoon, wiens arbeidsongeschiktheidsuitkering in verband met [artikel 19a, eerste lid][ref1], is geëindigd,
      heeft vanaf de dag:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel19a
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 19a
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 21a.1.a
    text: dat hij in Nederland woont; of
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel21a
  - number: 21a.1.b
    text: |-
      dat hij in een land woont waarmee een verdrag in werking is getreden dan wel een besluit van een volkenrechtelijke
      organisatie van kracht is geworden, op grond waarvan recht op arbeidsongeschiktheidsuitkering kan bestaan;
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel21a
  - number: 21a.2
    text: |-
      Aanspraak op heropening van de arbeidsongeschiktheidsuitkering heeft eveneens de persoon, bedoeld in het eerste
      lid, die op de in dat lid bedoelde dag niet arbeidsongeschikt is, doch ten aanzien van wie dit wel het geval is
      binnen vier weken na afloop van dat tijdvak.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel21a
  - number: 21a.3
    text: |-
      De [artikelen 7, zesde lid][ref1], [36][ref2] en [37][ref3], zijn van overeenkomstige toepassing met betrekking tot
      de aanspraak op heropening van de arbeidsongeschiktheidsuitkering, bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel37
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel21a
    references:
