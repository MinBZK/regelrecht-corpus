  - number: '25'
    text: |-
      De verzekerde die over een maand recht heeft op arbeidsongeschiktheidsuitkering, heeft over die maand recht op
      vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel25
  - number: '26.1'
    text: |-
      De vakantie-uitkering bedraagt acht procent van het bedrag aan arbeidsongeschiktheidsuitkering, waarop recht
      bestond in het tijdvak van twaalf maanden, voorafgaande aan de maand mei.
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel26
  - number: '26.2'
    text: |-
      Indien [artikel 16a][ref1], [21, zevende lid][ref2], [58][ref3], [59][ref4] of [59a][ref5] is toegepast, wordt
      onder het bedrag aan arbeidsongeschiktheidsuitkering, bedoeld in het eerste lid, verstaan het bedrag van de
      arbeidsongeschiktheidsuitkering, nadat dat artikel toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel16a
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0008656#Artikel59
      [ref5]: https://wetten.overheid.nl/BWBR0008656#Artikel59a
    url: https://wetten.overheid.nl/BWBR0008656/2026-01-01#Artikel26
    references:
      - id: ref1
