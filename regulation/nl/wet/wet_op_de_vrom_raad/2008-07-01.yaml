preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een vast college van advies van het Rijk in te
    stellen met betrekking tot hoofdlijnen van het beleid inzake de duurzame kwaliteit van de leefomgeving en over
    andere onderdelen van het rijksbeleid die relevant zijn voor de hoofdlijnen van het beleid op het gebied van
    volkshuisvesting, ruimtelijke ordening en milieubeheer en dat het in verband met artikel 79 van de Grondwet
    noodzakelijk is daartoe wettelijke bepalingen vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008279/2008-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Er is een Raad voor de volkshuisvesting, de ruimtelijke ordening en het milieubeheer, hierna te noemen de VROM-
      raad.
    url: https://wetten.overheid.nl/BWBR0008279/2008-07-01#Artikel1
  - number: '1.2'
    text: De VROM-raad bestaat uit een voorzitter en ten minste 11 en ten hoogste 14 andere leden.
    url: https://wetten.overheid.nl/BWBR0008279/2008-07-01#Artikel1
  - number: '2'
    text: |-
      De VROM-raad heeft tot taak de regering en de beide kamers der Staten-Generaal te adviseren over hoofdlijnen
      van het beleid inzake de duurzame kwaliteit van de leefomgeving en over andere onderdelen van het rijksbeleid
      die relevant zijn voor de hoofdlijnen van het beleid op het gebied van volkshuisvesting, ruimtelijke ordening en
      milieubeheer.
    url: https://wetten.overheid.nl/BWBR0008279/2008-07-01#Artikel2
  - number: '4'
    text: Deze wet treedt in werking met ingang van 1 januari 1997.
    url: https://wetten.overheid.nl/BWBR0008279/2008-07-01#Artikel4
  - number: '5'
    text: 'Deze wet wordt aangehaald als: Wet op de VROM-raad'
    url: https://wetten.overheid.nl/BWBR0008279/2008-07-01#Artikel5
