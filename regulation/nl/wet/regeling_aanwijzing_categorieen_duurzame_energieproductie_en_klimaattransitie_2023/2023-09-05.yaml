  - number: '3'
    text: |-
      1 Van het subsidieplafond is:

      a. € 750.000.000 gereserveerd voor het verlenen van subsidies voor aanvragen binnen het domein hoge-temperatuur-
      warmte;

      b. € 750.000.000 gereserveerd voor het verlenen van subsidies voor aanvragen binnen het domein lage-temperatuur-
      warmte;

      c. € 750.000.000 gereserveerd voor het verlenen van subsidies voor aanvragen binnen het domein moleculen.

      2 De minister verdeelt telkens het gereserveerde bedrag voor het verlenen van subsidies binnen een domein, bedoeld
      in het eerste lid, onderdeel a, b of c, in de volgorde van ontvangst van de aanvragen voor subsidies binnen dat
      domein, tot het gereserveerde bedrag binnen dat domein is bereikt.

      3 Indien honorering van alle aanvragen binnen een domein die op één dag zijn ontvangen ertoe zou leiden dat het
      gereserveerde bedrag voor het verlenen van subsidies binnen dat domein zou worden overschreden, worden telkens de
      aanvragen voor subsidie binnen dat domein met het laagste rangschikkingsbedrag, uitgedrukt in euro per 1.000 kg
      vermindering van broeikasgas, geacht eerder te zijn ontvangen. Bij een gelijk rangschikkingsbedrag stelt de
      minister de volgorde vast door loting.

      4 Indien blijkt dat het totale bedrag van de te verlenen subsidies voor aanvragen binnen een domein als bedoeld
      in het eerste lid, onderdeel a, b of c, lager is dan het voor de aanvragen binnen dat domein gereserveerde bedrag,
      vervalt de reservering voor het overblijvende bedrag en wordt dat overblijvende bedrag verdeeld op de wijze,
      bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048477#Artikel4
    url: https://wetten.overheid.nl/BWBR0048477/2023-09-05#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0048477
        artikel: '4'
        paragraaf: '2'
  - number: '4'
    text: |-
      De minister verdeelt onverminderd [artikel 3][ref1] het subsidieplafond op volgorde van binnenkomst van aanvragen
      voor zowel subsidies buiten de domeinen hoge-temperatuur-warmte, lage-temperatuur-warmte en moleculen, als voor
      subsidies binnen een van deze domeinen, indien in het betreffende domein het gereserveerde bedrag is bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0048477#Artikel3
    url: https://wetten.overheid.nl/BWBR0048477/2023-09-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0048477
        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: |-
      De maximale vermindering van broeikasgas die in aanmerking komt voor subsidies voor de productie van geavanceerde
      hernieuwbare brandstof op grond van [artikel 79, eerste lid][ref1], die worden aangevraagd in de periode, genoemd
      in [artikel 2, eerste lid][ref2], komt overeen met 10.300.000.000 kWh, gerekend voor de hele looptijd van de
      subsidies.


      [ref1]: https://wetten.overheid.nl/BWBR0048477#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0048477#Artikel2
