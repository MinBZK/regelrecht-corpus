  - number: '6'
    text: |-
      1 De minister beslist afwijzend op een aanvraag, indien:

      a. geen toestemming van de eigenaar van de beoogde locatie, geen gedoogplichtbeschikking op grond van
      [artikel 2, vijfde lid][ref1], of [artikel 3, tweede lid, van de Belemmeringenwet Privaatrecht][ref2] voor de
      beoogde locatie en geen afgesloten voorovereenkomst of grondovereenkomst met het Rijksvastgoedbedrijf kan worden
      overgelegd voor het vestigen van de productie-installatie op desbetreffende locatie;

      b. de subsidieaanvrager voor de investering in de productie-installatie beschikt over
      een verklaring van de minister dat sprake is van energie-investeringen op grond van
      [artikel 3.42, eerste lid, van de Wet inkomstenbelasting 2001][ref3]; of

      c. voor dezelfde productie-installatie al subsidie is verstrekt op grond van de
      [Subsidieregeling coöperatieve energieopwekking][ref4].

      2 Bij het overleggen van de toestemming van de eigenaar, bedoeld in het eerste lid, onderdeel a, wordt gebruik
      gemaakt van het middel dat door de minister beschikbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
