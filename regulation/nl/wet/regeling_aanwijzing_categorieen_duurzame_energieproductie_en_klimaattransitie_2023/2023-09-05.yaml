      van vaste of vloeibare biomassa als bedoeld in de NTA 8003:2017, met uitzondering van biomassa als bedoeld in de
      nummers 100, 150, 170 tot en met 179 van de NTA 8003:2017, waarvoor al subsidie op grond van het Besluit SDE is
      verstrekt en ten minste negen jaar van de periode waarover die subsidie is verstrekt, zijn verstreken op het moment
      van het indienen van de aanvraag in een ketel met een nominaal thermisch vermogen van ten minste 5 MWth.

