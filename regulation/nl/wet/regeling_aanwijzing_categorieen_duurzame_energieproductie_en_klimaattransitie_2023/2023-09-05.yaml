      1 De minister verstrekt op aanvraag subsidie aan een producent die met een productie-installatie koolstofdioxide
      afvangt en permanent opslaat of doet opslaan door een houder van een vergunning voor het exploiteren van
      een broeikasgasinstallatie als bedoeld in [artikel 16.5 van de Wet milieubeheer][ref1] in een ondergronds
      opslagvoorkomen voor koolstofdioxide, waarbij:

      a. het aantal subsidiabele vollasturen ten hoogste 4.000 vollasturen per jaar bedraagt, de koolstofdioxide wordt
      afgevangen die ontstaat bij een op het moment van indienen van de aanvraag bestaand proces, en gebruik wordt
      gemaakt van:

      1°. gasvormig transport van koolstofdioxide door een buisleiding, en ten minste de compressor nieuw is;

      2°. vloeibaar transport van koolstofdioxide, en ten minste de vervloeiingsinstallatie nieuw is; of

      3°. vloeibaar transport van koolstofdioxide;

      b. het aantal subsidiabele vollasturen ten hoogste 8.000 vollasturen per jaar bedraagt, de koolstofdioxide wordt
      afgevangen die ontstaat bij een op het moment van indienen van de aanvraag bestaand proces, en gebruik wordt
      gemaakt van:

      1°. gasvormig transport van koolstofdioxide door een buisleiding, en ten minste de compressor nieuw is; of

      2°. vloeibaar transport van koolstofdioxide, en ten minste de vervloeiingsinstallatie nieuw is;

      c. de afgevangen koolstofdioxide bij een op het moment van indienen van de aanvraag bestaand proces wordt
      gezuiverd, en gebruik wordt gemaakt van:

      1°. gasvormig transport van koolstofdioxide door een buisleiding en ten minste de installatie voor de zuivering van
      de afgevangen koolstofdioxide en de compressor nieuw zijn; of

      2°. vloeibaar transport van koolstofdioxide, en ten minste de installatie voor de zuivering van de afgevangen
      koolstofdioxide en de vervloeiingsinstallatie nieuw zijn;

      d. de koolstofdioxide wordt afgevangen die ontstaat bij een nieuw productieproces voor de productie van waterstof
      uit restgassen, de waterstof wordt ingezet in een productieproces voor ondervuring in een ketel, fornuis of
      warmtekrachtkoppeling, en gebruik wordt gemaakt van:

      1°. gasvormig transport van koolstofdioxide door een buisleiding, en ten minste de installatie voor de afvang en
      zuivering van koolstofdioxide en de compressor nieuw zijn; of

      2°. vloeibaar transport van koolstofdioxide, en ten minste de installatie voor de afvang en zuivering van
      koolstofdioxide en de vervloeiingsinstallatie nieuw zijn;

      e. de koolstofdioxide wordt afgevangen die ontstaat bij een op het moment van indienen van de aanvraag bestaand
      verbrandingsproces, en gebruik wordt gemaakt van:

      1°. gasvormig transport van koolstofdioxide door een buisleiding, en ten minste de installatie voor de afvang en
      zuivering van koolstofdioxide en de compressor nieuw zijn; of

      2°. vloeibaar transport van koolstofdioxide, en ten minste de installatie voor de afvang en zuivering van
      koolstofdioxide en de vervloeiingsinstallatie nieuw zijn;

      f. de afgevangen koolstofdioxide in een nieuw proces wordt gezuiverd, en gebruik wordt gemaakt van:

      1°. gasvormig transport van koolstofdioxide door een buisleiding, en ten minste de installatie voor de zuivering
      van de afgevangen koolstofdioxide en de compressor nieuw zijn; of

      2°. vloeibaar transport van koolstofdioxide, en ten minste de installatie voor de zuivering van de afgevangen
      koolstofdioxide en de vervloeiingsinstallatie nieuw zijn;

      g. de afvang van koolstofdioxide gebeurt bij een nieuw verbrandingsproces, en gebruik wordt gemaakt van:

      1°. gasvormig transport van koolstofdioxide door een buisleiding, en ten minste de installatie voor de afvang en
      zuivering van koolstofdioxide en de compressor nieuw zijn; of

      2°. vloeibaar transport van koolstofdioxide, en ten minste de installatie voor de afvang en zuivering van
      koolstofdioxide en de vervloeiingsinstallatie nieuw zijn.

      2 Een productie-installatie als bedoeld in het eerste lid, aanhef en onderdeel a,
      subonderdeel 1°, kan worden gecombineerd met een productie-installatie als bedoeld in
