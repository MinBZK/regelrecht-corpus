    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte geproduceerd door een
      productie-installatie die ingrijpend wordt gerenoveerd en waarmee:

      a. uitsluitend door middel van allesvergisting hernieuwbare warmte wordt geproduceerd, waarvoor al subsidie op
      grond van het Besluit SDE is verstrekt en ten minste negen jaar van de periode waarover die subsidie is verstrekt,
      zijn verstreken op het moment van het indienen van de aanvraag;

      b. uitsluitend door middel van allesvergisting hernieuwbare elektriciteit en hernieuwbare warmte wordt
      geproduceerd, waarvoor al subsidie op grond van het Besluit SDE is verstrekt en ten minste negen jaar van de
      periode waarover die subsidie is verstrekt, zijn verstreken op het moment van het indienen van de aanvraag;

      c. uitsluitend door middel van monomestvergisting met een vermogen kleiner dan of gelijk aan 450 kW hernieuwbare
      warmte wordt geproduceerd, waarvoor al subsidie op grond van het Besluit SDE is verstrekt en ten minste negen jaar
      van de periode waarover die subsidie is verstrekt, zijn verstreken op het moment van het indienen van de aanvraag;
      of

      d. uitsluitend door middel van monomestvergisting met een vermogen kleiner dan of gelijk aan 450 kW hernieuwbare
      elektriciteit en hernieuwbare warmte wordt geproduceerd, waarvoor al subsidie op grond van het Besluit SDE is
      verstrekt en ten minste negen jaar van de periode waarover die subsidie is verstrekt, zijn verstreken op het moment
      van het indienen van de aanvraag.
