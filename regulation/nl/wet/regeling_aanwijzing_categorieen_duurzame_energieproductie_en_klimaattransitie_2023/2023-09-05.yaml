  - number: '73'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door
      een productie-installatie voor de productie van warmte door middel van:

      a. een elektrisch aangedreven gesloten warmtepomp op basis van een halogeenvrij koudemiddel met een COP-waarde
      van ten minste 2,3 en een nominaal thermisch vermogen van ten minste 500 kWth, waarbij het aantal subsidiabele
      vollasturen ten hoogste 8.000 vollasturen per jaar bedraagt;

      b. een elektrisch aangedreven gesloten warmtepomp op basis van een halogeenvrij koudemiddel met een COP-waarde
      van ten minste 2,3 en een nominaal thermisch vermogen van ten minste 500 kWth, waarbij het aantal subsidiabele
      vollasturen ten hoogste 3.000 vollasturen per jaar bedraagt;

      c. een elektrisch aangedreven open warmtepomp met een COP-waarde van ten minste 2,3 en ten hoogste 12,0 en een
      nominaal thermisch vermogen van ten minste 500 kWth, waarbij het aantal subsidiabele vollasturen ten hoogste 8.000
      vollasturen per jaar bedraagt; of

      d. een elektrisch aangedreven open warmtepomp met een COP-waarde van ten minste 2,3 en ten hoogste 12,0 en een
      nominaal thermisch vermogen van ten minste 500 kWth, waarbij het aantal subsidiabele vollasturen ten hoogste 3.000
      vollasturen per jaar bedraagt.

      2 De productie-installatie produceert warmte die op dezelfde locatie wordt gebruikt voor een industriële
      toepassing, niet zijnde tuinbouw, en levert geen koude.

      3 De feitelijke productie van een productie-installatie als bedoeld in het eerste lid, onderdelen b en d, bedraagt
      ten hoogste 4.000 productie-uren per jaar.
    url: https://wetten.overheid.nl/BWBR0048477/2023-09-05#Artikel73
