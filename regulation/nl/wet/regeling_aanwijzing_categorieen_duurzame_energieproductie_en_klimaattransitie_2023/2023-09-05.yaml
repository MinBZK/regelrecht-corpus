  - number: '84'
    text: |-
      1 De subsidie, bedoeld in [artikel 83, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen zes jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 De afgevangen en permanent opgeslagen koolstofdioxide die voor subsidie in aanmerking komt, komt uitsluitend
      voort uit:

      a. een door de subsidieontvanger uitgevoerde economische activiteit met SBI-code 06, 08 tot en met 33 of 38;

      b. een door de subsidieontvanger uitgevoerde economische activiteit met SBI-code 351, indien de koolstofdioxide
      vrijkomt bij de verbranding van een bijproduct afkomstig van door subsidieontvangers uitgevoerde economische
      activiteiten met SBI-code 06, 08 tot en met 33, 352, 353 of 38;

      c. een door de subsidieontvanger uitgevoerde economische activiteit met SBI-code 35111, indien het de productie van
      elektriciteit door een warmtekrachtcentrale betreft die hoofdzakelijk wordt gestookt op aardgas.


      [ref1]: https://wetten.overheid.nl/BWBR0048477#Artikel83
