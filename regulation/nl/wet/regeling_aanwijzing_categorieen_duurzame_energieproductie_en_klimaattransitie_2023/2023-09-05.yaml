  - number: '85'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent die met een productie-installatie koolstofdioxide
      afvangt en gebruikt of doet gebruiken ter vermindering van broeikasgas door middel van nuttig aangewende
      koolstofdioxide, waarbij:

      a. de afgevangen koolstofdioxide bij een op het moment van indienen van de aanvraag bestaand proces wordt
      gezuiverd, en gebruik wordt gemaakt van:

      1°. gasvormig transport van koolstofdioxide door een transportleiding, en ten minste de installatie voor de
      zuivering van de afgevangen koolstofdioxide en de compressor nieuw zijn;

      2°. gasvormig transport van koolstofdioxide door een transportleiding, en ten minste de installatie voor de
      zuivering van de afgevangen koolstofdioxide en de compressor nieuw zijn, en de transportleiding wordt uitgebreid of
      nieuw aangelegd; of

      3°. vloeibaar transport van koolstofdioxide, en ten minste de installatie voor de zuivering van de afgevangen
      koolstofdioxide en de vervloeiingsinstallatie nieuw zijn;

      b. de koolstofdioxide wordt afgevangen bij een op het moment van indienen van de aanvraag bij een bestaand proces,
      en gebruik wordt gemaakt van vloeibaar transport van koolstofdioxide, en ten minste de vervloeiingsinstallatie
      nieuw is;

      c. de afgevangen koolstofdioxide bij een nieuw proces wordt gezuiverd, en gebruik wordt gemaakt van:

      1°. gasvormig transport van koolstofdioxide door een transportleiding, en ten minste de installatie voor de
      zuivering van de afgevangen koolstofdioxide en de compressor nieuw zijn;

      2°. gasvormig transport van koolstofdioxide door een transportleiding, en ten minste de installatie voor de
      zuivering van de afgevangen koolstofdioxide en de compressor nieuw zijn, en de transportleiding wordt uitgebreid of
      nieuw aangelegd; of

      3°. vloeibaar transport van koolstofdioxide, en ten minste de installatie voor de zuivering van de afgevangen
      koolstofdioxide en de vervloeiingsinstallatie nieuw zijn;

      d. de koolstofdioxide die wordt afgevangen ontstaat bij een op het moment van indienen van de aanvraag bestaande
      verbrandingsproces, en gebruik wordt gemaakt van:

      1°. gasvormig transport van koolstofdioxide door een transportleiding, en ten minste de installatie voor de afvang
      en zuivering van koolstofdioxide en de compressor nieuw zijn;

      2°. gasvormig transport van koolstofdioxide door een transportleiding, en ten minste de installatie voor de afvang
      en zuivering van koolstofdioxide en de compressor nieuw zijn, en de transportleiding wordt uitgebreid of nieuw
      aangelegd; of

      3°. vloeibaar transport van koolstofdioxide en ten minste de installatie voor de afvang en zuivering van
      koolstofdioxide en de vervloeiingsinstallatie nieuw zijn;

      e. de koolstofdioxide die wordt afgevangen ontstaat bij een nieuw verbrandingsproces, en gebruik wordt gemaakt van:

      1°. gasvormig transport van koolstofdioxide door een transportleiding, en ten minste de installatie voor de afvang
      en zuivering van koolstofdioxide en de compressor nieuw zijn;

      2°. gasvormig transport van koolstofdioxide door een transportleiding en ten minste de installatie voor de afvang
      en zuivering van koolstofdioxide en de compressor nieuw zijn, en de transportleiding wordt uitgebreid of nieuw
      aangelegd; of

      3°. vloeibaar transport van koolstofdioxide en ten minste de installatie voor de afvang en zuivering van
      koolstofdioxide en de vervloeiingsinstallatie nieuw zijn;

      f. de koolstofdioxide wordt afgevangen die ontstaat bij een in een op het moment van indienen van de aanvraag
      bestaande afvalverbrandingsinstallatie, en gebruik wordt gemaakt van:

      1°. gasvormig transport van koolstofdioxide door een transportleiding, en ten minste de installatie voor de afvang
      en zuivering van koolstofdioxide en de compressor nieuw zijn;

      2°. gasvormig transport van koolstofdioxide door een transportleiding, en ten minste de installatie voor de afvang
      en zuivering van koolstofdioxide en de compressor nieuw zijn, en de transportleiding wordt uitgebreid of nieuw
      aangelegd; of

      3°. vloeibaar transport van koolstofdioxide, en ten minste de installatie voor de afvang en zuivering van
      koolstofdioxide en de vervloeiingsinstallatie nieuw zijn;

      g. de koolstofdioxide wordt afgevangen bij een biomassaverbrandingsinstallatie, en gebruik wordt gemaakt van:

      1°. gasvormig transport van koolstofdioxide door een transportleiding, en ten minste de installatie voor de afvang
      en zuivering van koolstofdioxide nieuw is; of

      2°. vloeibaar transport van koolstofdioxide, en ten minste de installatie voor de afvang en zuivering van
      koolstofdioxide en de vervloeiingsinstallatie nieuw zijn.

      2 Een productie-installatie als bedoeld in het eerste lid, aanhef en onderdeel a,
      c, d, e, f of g, kan worden gecombineerd met een productie-installatie als bedoeld
      in [artikel 81, eerste lid, aanhef en onderdeel a, subonderdeel 1°][ref1] of
      [artikel 83, eerste lid, aanhef en onderdeel a, subonderdeel 1°][ref2].

      3 Een productie-installatie als bedoeld in het eerste lid, aanhef en onderdeel a, subonderdelen 1° of 2°,
      onderdeel c, subonderdelen 1° of 2°, onderdeel d, subonderdelen 1° of 2°, onderdeel e, subonderdelen 1° of 2°,
      onderdeel f, subonderdelen 1° of 2° of onderdeel g, subonderdeel 1° kan worden gecombineerd met een productie-
      installatie als bedoeld in [artikel 81, eerste lid, aanhef en onderdeel a, subonderdeel 2°][ref3] of
      [artikel 83, eerste lid, aanhef en onderdeel a, subonderdeel 2°][ref4].

      4 Een productie-installatie als bedoeld in het eerste lid, aanhef en onderdeel a, subonderdeel 3°,
      onderdeel c, subonderdeel 3°, onderdeel d, subonderdeel 3°, onderdeel e, subonderdeel 3°, onderdeel
      f, subonderdeel 3° of onderdeel g, subonderdeel 2° kan worden gecombineerd met een productie-
      installatie als bedoeld in [artikel 81, eerste lid, aanhef en onderdeel a, subonderdeel 3°][ref5] of
      [artikel 83, eerste lid, aanhef en onderdeel a, subonderdeel 3°][ref6].


