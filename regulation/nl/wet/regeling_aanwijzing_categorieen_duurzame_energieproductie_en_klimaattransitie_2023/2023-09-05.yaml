    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door een
      productie-installatie voor de productie van warmte onttrokken uit oppervlaktewater, drinkwater of zeewater, waarbij
      de warmte wordt opgewaardeerd door middel van een warmtepomp op basis van een halogeenvrij koudemiddel met een COP-
      waarde van ten minste 3,0 met een nominaal thermisch vermogen van ten minste 500 kWth, waarbij:

      a. het aantal subsidiabele vollasturen ten hoogste 6.000 vollasturen per jaar bedraagt, de productie-installatie
      beschikt over een seizoensopslag voor warmte en de productie-installatie uitsluitend warmte levert voor verwarming
      van gebouwde omgeving;

      b. het aantal subsidiabele vollasturen ten hoogste 6.000 vollasturen per jaar bedraagt en de productie-installatie
      uitsluitend warmte levert voor verwarming van gebouwde omgeving;

      c. het aantal subsidiabele vollasturen ten hoogste 3.500 vollasturen per jaar bedraagt, de productie-installatie
      beschikt over een seizoensopslag voor warmte en de productie-installatie uitsluitend warmte levert voor verwarming
      van gebouwde omgeving; of

      d. het aantal subsidiabele vollasturen ten hoogste 3.500 vollasturen per jaar bedraagt en de productie-installatie
      beschikt over een seizoensopslag voor warmte.
    url: https://wetten.overheid.nl/BWBR0048477/2023-09-05#Artikel61
