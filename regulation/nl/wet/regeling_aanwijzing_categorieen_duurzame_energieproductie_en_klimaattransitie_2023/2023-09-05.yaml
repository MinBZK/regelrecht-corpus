  - number: '8'
    text: |-
      1 Als ingrijpend te renoveren productie-installaties waarvoor subsidie kan worden verstrekt als bedoeld in
      [artikel 3, eerste lid, onderdeel c, en derde lid, onderdeel c, van het Besluit SDEK][ref1] worden aangewezen:

      a. productie-installaties waarmee hernieuwbare elektriciteit wordt geproduceerd als bedoeld in
      [artikel 13, onderdeel c][ref2];

      b. productie-installaties waarmee hernieuwbaar gas uit biomassa wordt geproduceerd als bedoeld in
      [artikel 27, onderdelen a en c][ref3];

      c. productie-installaties waarmee hernieuwbare warmte of hernieuwbare elektriciteit en hernieuwbare warmte uit
      biomassa wordt geproduceerd als bedoeld in de [artikelen 37][ref4] en [53, eerste lid][ref5].

      2 Als productie-installaties die als bedoeld in [artikel 3, tweede lid, onderdeel a, van het Besluit SDEK][ref6]
      worden aangewezen:

      a. productie-installaties waarmee hernieuwbaar gas door biomassa wordt geproduceerd als bedoeld in
      [artikel 27][ref7];

      b. productie-installaties waarmee hernieuwbare warmte of hernieuwbare elektriciteit en hernieuwbare warmte uit
      biomassa wordt geproduceerd als bedoeld in de [artikelen 37][ref8], [41][ref9] en [53, eerste lid][ref10];

      c. productie-installaties waarmee broeikasgas wordt verminderd als bedoeld in
      [artikel 81, eerste lid, onderdelen c tot en met g][ref11], indien deze worden gecombineerd met een productie-
      installatie als bedoeld in:

      1°. __REF000___________________________________________________________________________________________________________
      ______________;

      2°. __REF000___________________________________________________________________________________________________________
      ____________________________________________; of

      3°. __REF000___________________________________________________________________________________________________________
      ___________________________________;

      d. productie-installaties waarmee broeikasgas wordt verminderd als bedoeld in:

      1°. [artikel 83, eerste lid, onderdelen c tot en met h][ref15], indien
      deze worden gecombineerd met een productie-installatie als bedoeld in
      __REF001___________________________________________________________________________________________________________
      __________________________; of

      2°. in
      __REF000___________________________________________________________________________________________________________
      ______________________________________.

      3 Als te renoveren productie-installaties waarvoor subsidie kan worden verstrekt als bedoeld in
      [artikel 3, tweede lid, onderdeel c, van het Besluit SDEK][ref18] worden aangewezen:

      a. productie-installaties waarmee hernieuwbaar gas door biomassa wordt geproduceerd als bedoeld in
      [artikel 27][ref19];

      b. productie-installaties waarmee hernieuwbare warmte of hernieuwbare elektriciteit en hernieuwbare warmte uit
      biomassa wordt geproduceerd als bedoeld in [artikel 37][ref20].

      4 Als productie-installaties waarvoor subsidie wordt verstrekt indien deze geheel of deels bestaat uit gebruikte
      materialen als bedoeld in [artikel 3, vierde lid, van het Besluit SDEK][ref21] worden aangewezen:

      a. productie-installaties waarmee hernieuwbare elektriciteit wordt geproduceerd als bedoeld in
      [artikel 13, onderdeel c][ref22];

      b. productie-installaties waarmee hernieuwbaar gas wordt geproduceerd als bedoeld in de [artikelen 25][ref23],
      [27][ref24], [29, eerste lid][ref25], en [31][ref26];

      c. productie-installaties waarmee hernieuwbare warmte, hernieuwbare elektriciteit of hernieuwbare
      elektriciteit en hernieuwbare warmte wordt geproduceerd als bedoeld in de [artikelen 35][ref27], [37][ref28],
      [39, eerste lid][ref29], [41][ref30], [43][ref31], [45][ref32], [47][ref33], [49, eerste lid][ref34], [51][ref35],
      [53, eerste lid][ref36], en [57, onderdeel e][ref37];

      d. productie-installaties waarmee koolstofdioxide-arme warmte wordt geproduceerd als bedoeld in
      [artikel 75][ref38];

      e. productie-installaties waarmee koolstofdioxide wordt afgevangen en permanent opgeslagen als bedoeld in de
      [artikelen 81, eerste lid][ref39], en [83, eerste lid][ref40];

      f. productie-installaties waarmee koolstofdioxide wordt afgevangen en gebruikt als bedoeld in
      [artikel 85, eerste lid][ref41].


