  - number: '7'
    text: |-
      1 Een subsidie als bedoeld in de [artikelen 81][ref1], [83][ref2] en [85][ref3]
      die is afgegeven op een aanvraag voor subsidie die is ingediend met toepassing van
      [artikel 2, vierde lid, van de Algemene uitvoeringsregeling][ref4], of een subsidie van meer dan € 400.000.000,–
      worden verleend onder de volgende opschortende voorwaarden:

      a. binnen twee weken na afgifte van de beschikking tot subsidieverlening is een uitvoeringsovereenkomst tot stand
      gekomen tussen de Staat en de subsidieontvanger;

      b. de subsidieontvanger heeft binnen vier weken na afgifte van de beschikking tot subsidieverlening aangetoond dat
      een bankgarantie als bedoeld in [artikel 2, eerste lid][ref5], van de uitvoeringsovereenkomst is afgegeven.

      2 Voor het opstellen van de uitvoeringsovereenkomst, bedoeld in het eerste lid, wordt gebruik gemaakt van het in
      [bijlage 1][ref6] opgenomen model.

      3 Het eerste lid is niet van toepassing op een productie-installatie als bedoeld in
      [artikel 9b, eerste lid, onderdeel a, van de Elektriciteitswet 1998][ref7].

      4 Indien sprake is van een subsidie voor een productie-installatie voor hernieuwbare warmte of voor hernieuwbare
      elektriciteit en hernieuwbare warmte, wordt voor het berekenen van het bedrag van € 400.000.000, bedoeld in
      het eerste lid, de subsidie meegeteld die eerder voor de productie-installatie is verstrekt op grond van het
      [Besluit SDEK][ref8], het Besluit SDE, de MEP of de OV-MEP, indien de periode waarover de hiervoor bedoelde
      subsidie wordt verstrekt, nog niet is aangevangen.

      5 Indien subsidie wordt verstrekt als bedoeld in
      [artikel 81, tweede, derde, vierde, vijfde, zesde of zevende lid][ref9], of
      [artikel 83, tweede, derde, vierde, vijfde, zesde of zevende lid][ref10], en ook subsidie als bedoeld
      [artikel 85, tweede, derde of vierde lid][ref11], worden voor het berekenen van het bedrag van € 400.000.000,
      bedoeld in het eerste lid, aanhef, beide subsidies bij elkaar opgeteld.


