  - number: '75'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door
      een productie-installatie met een thermisch vermogen van ten minste 2 MWth, waarmee restwarmte, niet zijnde stoom,
      wordt uitgekoppeld en naar een andere locatie wordt getransporteerd, waarbij ten minste de warmtewisselaar bij de
      uitkoppeling nieuw is, en:

      a. de warmte wordt opgewaardeerd met een nieuwe warmtepomp op basis van een halogeenvrij koudemiddel, de
      warmtepomp een nominaal thermisch vermogen van ten minste 500 kWth en een COP-waarde van ten minste 3,0 heeft en
      transport plaatsvindt met behulp van een transportleiding met een verhouding van kilometer nieuw aan te leggen
      transportleiding per MWth outputvermogen van de productie-installatie en andere op de transportleiding invoedende
      installaties van:

      1°. ≥ 0,10 en < 0,20;

      2°. ≥ 0,20 en < 0,30;

      3°. ≥ 0,30 en < 0,40;

      4°. ≥ 0,40; of

      b. de warmte niet wordt opgewaardeerd en transport plaatsvindt met behulp van een transportleiding met een
      verhouding van kilometer nieuw aan te leggen transportleiding per MWth outputvermogen van de productie-installatie
      en andere op de transportleiding invoedende installaties van:

      1°. ≥ 0,10 en < 0,20;

      2°. ≥ 0,20 en < 0,30;

      3°. ≥ 0,30 en < 0,40;

      4°. ≥ 0,40.
