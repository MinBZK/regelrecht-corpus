  - number: '9'
    text: |-
      1 Als productie-installaties waarvoor het verschil in kWh kan worden opgeteld als bedoeld in
      [artikel 15, derde en vierde lid, van het Besluit SDEK][ref1] worden aangewezen productie-installaties
      waarmee hernieuwbare elektriciteit wordt geproduceerd als bedoeld in de [artikelen 13][ref2], [15][ref3],
      [17, eerste lid][ref4], [19, eerste lid][ref5], en [21, eerste lid][ref6]. Het verschil in kWh dat bij het aantal
      geproduceerde kWh van het volgende jaar kan worden opgeteld, bedoeld in artikel 15, vierde lid, van het Besluit
      SDEK, wordt gemaximeerd op 25% van het aantal kWh dat het desbetreffende jaar voor subsidie in aanmerking komt.

      2 Als productie-installaties waarvoor het verschil in kWh kan worden opgeteld als bedoeld in
      [artikel 15, derde en vierde lid, van het Besluit SDEK][ref7] worden aangewezen productie-installaties waarmee
      hernieuwbare elektriciteit wordt geproduceerd als bedoeld in [artikel 23, eerste lid][ref8]. Het verschil in kWh
      dat bij het aantal geproduceerde kWh van het volgende jaar kan worden opgeteld, bedoeld in artikel 15, vierde
      lid, van het Besluit SDEK, wordt gemaximeerd op 25% van het aantal kWh dat het desbetreffende jaar voor subsidie
      in aanmerking komt. Bij de benutting van de opgetelde kWh, bedoeld in artikel 15, vierde lid, van het Besluit
      SDEK, wordt de productie verdeeld in een deel netlevering en een deel niet-netlevering op basis van de verhouding
      tussen de geproduceerde energie die aan het net geleverd is en de energie die niet aan het net geleverd is in het
      voorgaande jaar.

      3 Als productie-installaties waarvoor het verschil in kWh kan worden opgeteld als bedoeld in
      [artikel 32, derde en vierde lid, van het Besluit SDEK][ref9] worden aangewezen productie-installaties waarmee
      hernieuwbaar gas wordt geproduceerd als bedoeld in de [artikelen 25][ref10], [27][ref11], [29, eerste lid][ref12],
      en [31][ref13]. Het verschil in kWh dat bij het aantal geproduceerde kWh van het volgende jaar kan worden opgeteld,
      bedoeld in artikel 32, vierde lid, van het Besluit SDEK, wordt gemaximeerd op 25% van het aantal kWh dat het
      desbetreffende jaar voor subsidie in aanmerking komt.

      4 Als productie-installaties waarvoor het verschil in kWh kan worden opgeteld als bedoeld in
      [artikel 48, derde en vierde lid, van het Besluit SDEK][ref14] worden aangewezen productie-installaties
      waarmee hernieuwbare warmte, hernieuwbare elektriciteit of hernieuwbare elektriciteit en hernieuwbare
      warmte wordt geproduceerd als bedoeld in de [artikelen 33, eerste lid][ref15], [35][ref16], [37][ref17],
      [39, eerste lid][ref18], [41][ref19], [43][ref20], [45][ref21], [47][ref22], [49, eerste lid][ref23], [51][ref24],
      [53, eerste lid][ref25], [55, eerste lid][ref26], en [57][ref27].

      5 Voor de productie-installaties, bedoeld in het vierde lid, wordt het verschil in kWh
      dat bij het aantal geproduceerde kWh van het volgende jaar kan worden opgeteld, bedoeld in
      [artikel 48, vierde lid, van het Besluit SDEK][ref28], gemaximeerd op 25% van het aantal kWh dat het desbetreffende
      jaar voor subsidie in aanmerking komt.

      6 Als productie-installaties waarvoor het verschil in kWh kan worden opgeteld als bedoeld in
      [artikel 55j, derde en vierde lid, van het Besluit SDEK][ref29] worden aangewezen:

      a. productie-installaties waarmee koolstofdioxide-arme warmte wordt geproduceerd als bedoeld in de
      [artikelen 59][ref30], [61][ref31], [63, eerste lid][ref32], [65][ref33], [67, eerste lid][ref34],
      [69, eerste lid][ref35], [73, eerste lid][ref36], en [75][ref37];

      b. productie-installaties waarmee geavanceerde hernieuwbare brandstof wordt geproduceerd als bedoeld in
      [artikel 79, eerste lid][ref38];

      c. productie-installaties waarmee koolstofdioxide wordt afgevangen en permanent opgeslagen als bedoeld in de
      [artikelen 81, eerste lid][ref39], en [83, eerste lid][ref40];

      d. productie-installaties waarmee koolstofdioxide wordt afgevangen en gebruikt als bedoeld in
      [artikel 85, eerste lid][ref41].

      7 Voor de productie-installatie, bedoeld in het zesde lid, wordt het verschil in kg verminderde broeikasgas
      dat bij het aantal kg verminderde broeikasgas van het volgende jaar kan worden opgeteld, bedoeld in
      [artikel 55j, vierde lid, van het Besluit SDEK][ref42], gemaximeerd op 25% van het aantal kg verminderde
      broeikasgas dat het desbetreffende jaar voor subsidie in aanmerking komt.

      8 Als productie-installaties waarvoor het verschil in kWh kan worden opgeteld, bedoeld in
      [artikel 55j, derde lid, van het Besluit SDEK][ref43], worden aangewezen:

      a. productie-installaties waarmee koolstofdioxide-arme warmte wordt geproduceerd als bedoeld in de
      [artikel 71, eerste lid][ref44];

      b. productie-installaties waarmee waterstof wordt geproduceerd als bedoeld in [artikel 77, eerste lid][ref45].


