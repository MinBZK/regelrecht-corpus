    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door
      een productie-installatie waarmee elektriciteit in warmte wordt omgezet, waarbij de vrijkomende warmte direct of
      indirect wordt overgedragen aan een vloeistof voor:

      a. toepassing in stadsverwarming; of

      b. overige toepassingen.

      2 De productie-installatie heeft een nominaal thermisch vermogen van ten minste 2 MWth, waarbij de geproduceerde
      warmte wordt toegepast in een verwarmingssysteem met een aanvoertemperatuur aan de gebruikerszijde van ten minste
      100°C in het stookseizoen of in een stoomsysteem.

      3 Het vermogen van de aansluiting op het elektriciteitsnet is ten minste even groot als het gezamenlijke vermogen
      van de op de locatie aanwezige elektroboilers.
    url: https://wetten.overheid.nl/BWBR0048477/2023-09-05#Artikel71
