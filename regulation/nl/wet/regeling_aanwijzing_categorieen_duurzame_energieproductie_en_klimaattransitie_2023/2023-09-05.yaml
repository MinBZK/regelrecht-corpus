  - number: '69'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van koolstofdioxide-arme warmte geproduceerd door
      een productie-installatie voor de productie van warmte uit zonne-energie en buitenluchtwarmte door middel van
      zonnecollectoren die warmte en stroom produceren, waarbij de warmte wordt aangewend voor de verwarming van gebouwde
      omgeving.

      2 De productie-installatie maakt gebruik van een water-water-warmtepomp op basis van een halogeenvrij koudemiddel
      en de water-water-warmtepomp een minimaal nominaal thermisch vermogen van 500 kWth en een COP-waarde van ten minste
      3,0 heeft.

      3 De oppervlakte aan fotovoltaïsch-thermische panelen bedraagt ten minste 1,2 m2 per kWth nominaal thermisch
      vermogen van de warmtepomp.
    url: https://wetten.overheid.nl/BWBR0048477/2023-09-05#Artikel69
  - number: '70'
    text: |-
      1 De subsidie, bedoeld in [artikel 69, eerste lid][ref1], wordt voor een periode van vijftien jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 De subsidieontvanger draagt er zorg voor dat de opgewekte koolstofdioxide-arme warmte die voor subsidie in
