      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare warmte of hernieuwbare
      elektriciteit en hernieuwbare warmte geproduceerd door een productie-installatie voor de productie van stoom door
      middel van verbranding van houtpellets in een ketel, die wordt gebruikt voor een industriële toepassing, niet
      zijnde tuinbouw, waarbij ten minste de stoomketel nieuw is en het nominale thermische vermogen:

      a. gelijk aan of groter is dan 5 MWth en kleiner dan 50 MWth; of

      b. gelijk aan of groter is dan 50 MWth.

      2 In de ketel worden:

      a. houtpellets geproduceerd uit biomassa als bedoeld in de nummers 110 tot en met 138 van de NTA 8003:2017
      verbrand;

      b. reststoffen die vrijkomen uit bioraffinage als bedoeld in nummer 595 van de NTA 8003:2017 van biomassa als
      bedoeld in de nummers 110 tot en met 138 van de NTA 8003:2017 verbrand voor ten hoogste 25% van het aantal kWh dat
      in een kalenderjaar voor subsidie in aanmerking komt; of

      c. houtpellets geproduceerd uit biomassa als bedoeld in de nummers 160 tot en met 169 van de NTA 8003:2017
      verbrand, voor ten hoogste vijftien vijfentachtigste deel van de som van het aantal kWh dat in een kalenderjaar
      voor subsidie in aanmerking komt, geproduceerd met biomassa als bedoeld in de onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0048477/2023-09-05#Artikel49
  - number: '50'
    text: |-
      1 De subsidie, bedoeld in [artikel 49, eerste lid][ref1], wordt voor een periode van twaalf jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 De subsidieontvanger draagt er zorg voor dat ten minste 97% van de energetische waarde van de jaarlijks in de
      productie-installatie gebruikte brandstof biogeen is.

      4 De subsidieontvanger draagt er zorg voor dat de opgewekte hernieuwbare warmte die voor subsidie in aanmerking
      komt, wordt aangewend als nuttig aangewende warmte.

      5 De subsidieontvanger draagt er zorg voor dat in voldoende mate aannemelijk wordt gemaakt
      dat de gebruikte biomassa voldoet aan de duurzaamheidseisen voor vaste biomassa, bedoeld in
      [artikel 7, van de Algemene uitvoeringsregeling][ref2].

      6 De subsidieontvanger draagt er zorg voor dat de geproduceerde warmte wordt gebruikt voor een industriële
      toepassing, niet zijnde tuinbouw, in een verwarmingssysteem met een aanvoertemperatuur aan de gebruikerszijde van
      ten minste 100°C.


      [ref1]: https://wetten.overheid.nl/BWBR0048477#Artikel49
