  - number: '25'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een productie-
      installatie waarmee hernieuwbaar gas wordt geproduceerd:

      a. uitsluitend door middel van allesvergisting, waarbij ten minste de vergister nieuw is;

      b. uitsluitend door middel van monomestvergisting met een productie-installatie met een vermogen groter dan 450 kW,
      waarbij ten minste de vergister nieuw is; of

      c. uitsluitend door middel van monomestvergisting met een productie-installatie met een vermogen kleiner dan of
      gelijk aan 450 kW, waarbij ten minste de vergister nieuw is.
    url: https://wetten.overheid.nl/BWBR0048477/2023-09-05#Artikel25
  - number: '26'
    text: |-
      1 De subsidie, bedoeld in [artikel 25][ref1], wordt voor een periode van twaalf jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 De subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de in een installatie met een totaal
      nominaal vermogen van de gasopwaardeerinstallatie gelijk aan of groter dan 2 MW gebruikte biomassa voldoet aan de
      duurzaamheids- en broeikasgasemissiereductiecriteria, bedoeld in artikel 29, eerste lid, van de [richtlijn (EU)
      2018/2001](32018L2001).


      [ref1]: https://wetten.overheid.nl/BWBR0048477#Artikel25
    url: https://wetten.overheid.nl/BWBR0048477/2023-09-05#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0048477
        artikel: '25'
        paragraaf: '3'
  - number: '27'
    text: |-
      De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door een productie-
      installatie die ingrijpend wordt gerenoveerd en waarmee:

      a. uitsluitend door middel van allesvergisting hernieuwbaar gas wordt geproduceerd met een productie-installatie,
      waarvoor al subsidie op grond van het Besluit SDE is verstrekt als productie-installatie voor de productie van
      hernieuwbare elektriciteit of hernieuwbare warmte;

      b. uitsluitend door middel van allesvergisting hernieuwbaar gas wordt geproduceerd, waarvoor al subsidie op grond
      van het Besluit SDE is verstrekt als productie-installatie voor de productie van hernieuwbaar gas en ten minste
      negen jaar van de periode waarover die subsidie is verstrekt, zijn verstreken op het moment van het indienen van
      de aanvraag;

      c. uitsluitend door middel van monomestvergisting met een vermogen kleiner dan of gelijk aan 450 kW hernieuwbaar
      gas wordt geproduceerd, waarvoor al subsidie op grond van het Besluit SDE is verstrekt als productie-installatie
      voor de productie van hernieuwbare elektriciteit of hernieuwbare warmte; of

      d. uitsluitend door middel van monomestvergisting met een vermogen kleiner dan of gelijk aan 450 kW hernieuwbaar
      gas wordt geproduceerd, waarvoor al subsidie op grond van het Besluit SDE is verstrekt als productie-installatie
      voor de productie van hernieuwbaar gas en ten minste negen jaar van de periode waarover die subsidie is verstrekt,
      zijn verstreken op het moment van het indienen van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0048477/2023-09-05#Artikel27
  - number: '28'
    text: |-
      1 De subsidie, bedoeld in [artikel 27][ref1], wordt voor een periode van twaalf jaar verstrekt.

      2 De subsidieontvanger neemt de productie-installatie binnen vier jaar na de datum van inwerkingtreding van de
      beschikking tot subsidieverlening in gebruik.

      3 Een subsidieontvanger draagt er zorg voor dat wordt aangetoond dat de in een installatie met een totaal
      nominaal vermogen van de gasopwaardeerinstallatie gelijk aan of groter dan 2 MW gebruikte biomassa voldoet aan de
      duurzaamheids- en broeikasgasemissiereductiecriteria, bedoeld in artikel 29, eerste lid, van de [richtlijn (EU)
      2018/2001](32018L2001).


