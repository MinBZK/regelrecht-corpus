      2 De productie-installatie maakt gebruik van:

      a. een optisch en zonvolgend systeem, waarbij zonlicht wordt geconcentreerd op collectorbuizen met een thermisch
      vermogen dat ten minste vier keer het nominaal thermisch vermogen van de warmtepomp bedraagt; en

      b. een warmtepomp op basis van een halogeenvrij koudemiddel met een COP-waarde van ten minste 5,0 en de warmtepomp
      een nominaal thermisch vermogen heeft van ten minste 500 kWth.

      3 De productie-installatie heeft een seizoensopslag van warmte.

      4 De productie-installatie wordt niet gebruikt voor koudelevering.
