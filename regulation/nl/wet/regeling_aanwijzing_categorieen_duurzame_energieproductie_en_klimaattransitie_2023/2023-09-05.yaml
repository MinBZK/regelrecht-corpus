      van hernieuwbare elektriciteit en hernieuwbare warmte het maximaal aantal vollasturen, bedoeld in
      [artikel 48, vijfde lid, van het Besluit SDEK][ref2], vastgesteld op het in de vierde kolom van onderstaande tabel
      genoemde aantal uren;

      c. de basisenergieprijs, bedoeld in [artikel 45, eerste lid, van het Besluit SDEK][ref3], voor de productie van
      hernieuwbare warmte, hernieuwbare elektriciteit of de gecombineerde opwekking van hernieuwbare elektriciteit en
      hernieuwbare warmte vastgesteld op het in de vijfde kolom van onderstaande tabel genoemde bedrag; en

      d. de correcties op het basisbedrag voor subsidie voor een productie-installatie als bedoeld in het in de eerste
      kolom van onderstaande tabel genoemde artikel, worden voor 2023 vastgesteld op:

      1°. voor de energieprijs, bedoeld in [artikel 47, eerste lid, onderdeel a, van het Besluit SDEK][ref4], het in de
      zesde kolom van onderstaande tabel genoemde bedrag;

      2°. voor de waarde van garanties van oorsprong, bedoeld in
      [artikel 47, eerste lid, onderdeel b, van het Besluit SDEK][ref5], op € 0 per kWh; en

      3°. voor andere correcties als bedoeld in [artikel 47, eerste lid, onderdeel c, van het Besluit SDEK][ref6] het in
      de zevende kolom van onderstaande tabel genoemde bedrag.













