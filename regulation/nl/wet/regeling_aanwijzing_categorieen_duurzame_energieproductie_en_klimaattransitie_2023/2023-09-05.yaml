  - number: '77'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van waterstof geproduceerd door een productie-
      installatie die waterstof produceert met behulp van elektrolyse met een nominale capaciteit van ten minste 500 kW
      met:

      a. een aansluiting op het elektriciteitsnet; of

      b. een directe aansluiting op een productie-installatie die elektriciteit produceert met behulp van windenergie of
      een productie-installatie die elektriciteit produceert uit zonlicht door middel van fotovoltaïsche zonnepanelen.

      2 De productie-installatie is in staat om, terwijl deze gereed is voor gebruik, minder dan 1% elektriciteit te
      verbruiken van het maximale vermogen van de productie-installatie.

      3 Indien sprake is van een productie-installatie met een directe aansluiting als bedoeld in het eerste lid, aanhef
      en onderdeel b, wordt de subsidie uitsluitend verstrekt voor de waterstof die is geproduceerd met de elektriciteit
      die is geproduceerd door een productie-installatie voor wind- of zonne-energie waarvoor geen subsidie voor het
      produceren van die elektriciteit op grond van deze of een andere regeling is verstrekt.

      4 Indien sprake is van een productie-installatie met een directe aansluiting als bedoeld in het eerste lid, aanhef
      en onderdeel b, wordt de subsidie uitsluitend verstrekt voor de waterstof die is geproduceerd met elektriciteit die
      is geproduceerd door de direct aangesloten productie-installatie voor wind- of zonne-energie aangesloten.
    url: https://wetten.overheid.nl/BWBR0048477/2023-09-05#Artikel77
