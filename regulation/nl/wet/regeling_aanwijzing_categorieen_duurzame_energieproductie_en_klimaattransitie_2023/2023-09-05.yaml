  - number: '12'
    text: |-
      Als productie-installaties waarvoor een gebundelde aanvraag kan worden ingediend als bedoeld in
      [artikel 56, tweede lid, van het Besluit SDEK][ref1] worden aangewezen:

      a. productie-installaties waarmee hernieuwbare elektriciteit wordt geproduceerd als bedoeld in de
      [artikelen 17, eerste lid][ref2], [19, eerste lid][ref3], en [21, eerste lid][ref4];

      b. productie-installaties waarmee hernieuwbaar gas wordt geproduceerd als bedoeld in de [artikelen 25][ref5] en
      [27][ref6];

      c. productie-installatie waarmee hernieuwbare warmte, hernieuwbare elektriciteit of hernieuwbare elektriciteit en
      hernieuwbare warmte wordt geproduceerd als bedoeld in de [artikelen 35][ref7] en [37][ref8];

      d. productie-installaties waarmee koolstofdioxide wordt afgevangen en permanent opgeslagen als bedoeld in de
      [artikelen 81, eerste lid][ref9], en [83, eerste lid][ref10];

      e. productie-installaties waarmee koolstofdioxide wordt afgevangen en gebruikt als bedoeld in
      [artikel 85, eerste lid][ref11].


