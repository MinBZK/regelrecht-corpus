  - number: '2'
    text: |-
      1 Het subsidieplafond bedraagt € 8.000.000.000 voor het verlenen van subsidies die worden aangevraagd in de periode
      van 5 september, 9:00 uur, tot 5 oktober, 17:00, voor:

      a. de productie van hernieuwbare elektriciteit op grond van [artikel 13][ref1], [15][ref2], [17][ref3], [19][ref4],
      [21][ref5] of [23][ref6];

      b. de productie van hernieuwbaar gas op grond van [artikel 25][ref7], [27][ref8], [29][ref9] of [31][ref10];

      c. de productie van hernieuwbare warmte of al dan niet gecombineerde opwekking van hernieuwbare elektriciteit
      en hernieuwbare warmte op grond van [artikel 33][ref11], [35][ref12], [37][ref13], [39][ref14], [41][ref15],
      [43][ref16], [45][ref17], [47][ref18], [49][ref19], [51][ref20], [53][ref21], [55][ref22] of [57][ref23];

      d. de vermindering van broeikasgas op grond van [artikel 59][ref24], [61][ref25], [63][ref26], [65][ref27],
      [67][ref28], [69][ref29], [71][ref30], [73][ref31], [75][ref32], [77][ref33], [79][ref34], [81][ref35], [83][ref36]
      of [85][ref37].

      2 Per categorie productie-installaties kan in de periode, genoemd in het eerste lid, per adres waarop een
      productie-installatie wordt geplaatst maximaal één aanvraag worden ingediend.


