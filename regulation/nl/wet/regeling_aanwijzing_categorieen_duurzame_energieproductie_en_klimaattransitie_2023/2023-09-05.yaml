    text: |-
      1 Voor een productie-installatie als bedoeld in het in de eerste kolom van onderstaande tabellen genoemde artikel
      wordt:

      a. het basisbedrag voor subsidie voor de vermindering van broeikasgas, bedoeld in
      [artikel 55f, eerste lid, van het Besluit SDEK][ref1], vastgesteld op het in de derde kolom van onderstaande
      tabellen genoemde bedrag;

      b. voor de vermindering van broeikasgas het maximaal aantal vollasturen, bedoeld in
      [artikel 55j, vijfde lid, van het Besluit SDEK][ref2], vastgesteld op het in de vierde kolom van onderstaande
      tabellen genoemde aantal uren;

      c. het basisbroeikasgasbedrag, bedoeld in [artikel 55g, eerste lid, van het Besluit SDEK][ref3], voor de
      vermindering van broeikasgas vastgesteld op het in de vijfde kolom van onderstaande tabellen genoemde bedrag; en

      d. de correcties op het basisbedrag voor subsidie voor een productie-installatie als bedoeld in het in de eerste
      kolom van onderstaande tabellen genoemde artikel worden voor 2023 vastgesteld op:

      1°. voor de prijs van het primaire product, bedoeld in
      [artikel 55i, eerste lid, onderdeel a, van het Besluit SDEK][ref4], het in de zesde kolom van onderstaande tabellen
      genoemde bedrag;

      2°. voor de correcties, bedoeld in [artikel 55i, eerste lid, onderdeel b, van het Besluit SDEK][ref5], het in de
      zevende kolom van onderstaande tabellen genoemde bedrag; en

      3°. voor andere correcties als bedoeld in [artikel 55i, eerste lid, onderdeel c, van het Besluit SDEK][ref6] het in
      de achtste kolom van onderstaande tabellen genoemde bedrag.














