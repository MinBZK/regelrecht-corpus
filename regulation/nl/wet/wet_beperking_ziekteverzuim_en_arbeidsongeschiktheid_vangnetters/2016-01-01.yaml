preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Ziektewet en enige andere wetten aan te passen
    teneinde ziekteverzuim en arbeidsongeschiktheid van vangnetters te beperken;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032089/2016-01-01#ArtikelAanhef
articles:
  - number: X
    text: >-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0032089/2016-01-01#ArtikelX
  - number: XI
    text: 'Deze wet wordt aangehaald als: Wet beperking ziekteverzuim en arbeidsongeschiktheid vangnetters.'
    url: https://wetten.overheid.nl/BWBR0032089/2016-01-01#ArtikelXI
