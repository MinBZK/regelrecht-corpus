  - number: '25'
    text: |-
      1 De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld, met dien verstande dat de
      [artikelen 7][ref1] en [8][ref2] kunnen terugwerken tot en met een bij dat besluit te bepalen tijdstip

      2 De [artikelen 9][ref3] en [14][ref4] treden in werking met ingang van de dag na de datum van uitgifte van het
      Staatsblad waarin zij worden geplaatst en werken terug tot en met 1 augustus 2000.

      3 De [artikelen 10, tweede lid, van deze wet][ref5] en
      [11a, derde, vierde, vijfde en achtste lid, van de Elektriciteitswet 1998][ref6] vervallen met ingang van 1 januari
      2003.

      4 [Artikel 69, tweede en derde lid, van de Elektriciteitswet 1998][ref7] vervalt met ingang van een bij koninklijk
      besluit te bepalen datum.

      5 [Artikel 11][ref8] vervalt drie jaar na haar tijdstip van inwerkingtreding.


