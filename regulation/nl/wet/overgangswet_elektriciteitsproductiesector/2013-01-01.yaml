  - number: '9'
    text: |-
      1 Iedere afnemer, niet zijnde een beschermde afnemer, is naast hetgeen hij op grond van overeenkomst verschuldigd
      is aan de netbeheerder van het gebied waarin hij is gevestigd, aan die netbeheerder een bedrag van f 0,0117 per kWh
      verschuldigd, berekend over de totale hoeveelheid elektriciteit die die netbeheerder in de periode van 1 augustus
      2000 tot en met 31 december 2000 getransporteerd heeft naar zijn aansluiting.

      2 Iedere beschermde afnemer is naast hetgeen hij op grond van overeenkomst verschuldigd is aan de vergunninghouder
      van het gebied waarin hij is gevestigd, aan die vergunninghouder een bedrag van f 0,0117 per kWh verschuldigd,
      berekend over de totale hoeveelheid elektriciteit die die vergunninghouder in de periode van 1 augustus 2000 tot en
      met 31 december 2000 aan hem geleverd heeft.

      3 Indien een afnemer aan een netbeheerder of een vergunninghouder over het jaar 2000 of een gedeelte daarvan
      reeds een voorschot betaald heeft om het bedrag, bedoeld in het eerste of het tweede lid, te voldoen, verrekent de
      netbeheerder of de vergunninghouder bij de eindafrekening over het jaar 2000 dit voorschot met het totaal aan hem
      verschuldigde bedrag.

      4 De opbrengst van de bedragen die afnemers op grond van het eerste of tweede lid verschuldigd zijn, wordt door de
      netbeheerders, onderscheidenlijk de vergunninghouders voor 1 juli 2001 afgedragen aan de aangewezen vennootschap.

      5 De aangewezen vennootschap doet Onze Minister opgave van de hoogte van de opbrengst,
      bedoeld in het vierde lid, en voegt daarbij een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] omtrent de getrouwheid van de opgave. Indien
      de totale opbrengst meer is dan f 400 000 000, draagt de aangewezen vennootschap het meerdere af aan Onze Minister,
      die dat bedrag bestemt voor de tegemoetkoming in de kosten, bedoeld in [artikel 7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0012088#Artikel7
    url: https://wetten.overheid.nl/BWBR0012088/2013-01-01#Artikel9
