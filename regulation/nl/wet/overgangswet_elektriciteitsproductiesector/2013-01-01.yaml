preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is in verband met de liberalisering van de
    elektriciteitsproductie te voorzien in regels voor de verdeling van rechten en verplichtingen bij de beëindiging
    van de overeenkomst van samenwerking van de elektriciteitsproductiesector, voor de tegemoetkoming in de daarmee
    verband houdende kosten van die sector en voor de overgang van de meerderheid van de aandelen van de vennootschap
    die is aangewezen als netbeheerder van het landelijk hoogspanningsnet naar de Staat;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012088/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet wordt verstaan onder productiebedrijf of aangewezen vennootschap: de rechtspersoon die
      vergunninghouder onderscheidenlijk aangewezen vennootschap als bedoeld in artikel 1 van de Elektriciteitswet 1989
      was, of de rechtsopvolger daarvan.

      2 Onder de overige in deze wet gebruikte termen wordt verstaan hetgeen daaronder verstaan wordt in de
      [Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755
    url: https://wetten.overheid.nl/BWBR0012088/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
  - number: '2'
    text: |-
      1 De productiebedrijven zijn gezamenlijk aansprakelijk voor de kosten, bedoeld in het tweede lid, met inachtneming
      van de volgende onderlinge verdeling:

      a. n.v. Elektriciteits-Produktiemaatschappij Oost- en Noord-Nederland: 29,5%;

      b. n.v. Elektriciteits-Produktiemaatschappij Zuid-Nederland: 28,5%;

      c. n.v. Electriciteitsbedrijf Zuid-Holland: 19,5%;

      d. n.v. Energieproduktiebedrijf UNA: 22,5%.

      2 De kosten waarvoor de productiebedrijven gezamenlijk aansprakelijk zijn, betreffen:

      a. de kosten die voortvloeien uit de exploitatie van de experimentele kolenvergassingsinstallatie Demkolec tot en
      met het tijdstip waarop die installatie wordt overgenomen;

      b. de kosten die voortvloeien uit de aflossing van de lening die de n.v. Gemeenschappelijke Kernenergiecentrale
      Nederland heeft verstrekt aan de aangewezen vennootschap;

      c. de kosten die voortvloeien uit de overeenkomsten tot invoer van gas en elektriciteit die de aangewezen
      vennootschap heeft gesloten, voor zover die nog van kracht zijn;

      d. de kosten die zijn verbonden aan verplichtingen die voor het tijdstip van intrekking van de Elektriciteitswet
      1989 door de aangewezen vennootschap zijn aangegaan met betrekking tot de aanleg van een verbinding voor het
      transport van elektriciteit tussen Nederland en Noorwegen;

      e. de overige kosten die voortvloeien uit de vereffening van de rechten en verplichtingen van de aangewezen
      vennootschap als deze wordt ontbonden.

      3 Indien na de exploitatie van de installatie, bedoeld in het tweede lid, onderdeel a, de aflossing van de lening,
      bedoeld in het tweede lid, onderdeel b, de overdracht van de overeenkomsten, bedoeld in het tweede lid, onderdeel
      c, de nakoming van de verplichtingen, bedoeld in het tweede lid, onderdeel d, en de vereffening van de rechten en
      plichten van de aangewezen vennootschap, bedoeld in het tweede lid, onderdeel e, een batig saldo resulteert, zijn
      de productiebedrijven gerechtigd tot dat saldo met inachtneming van de in het eerste lid bepaalde verdeling.
    url: https://wetten.overheid.nl/BWBR0012088/2013-01-01#Artikel2
  - number: '3'
    text: |-
      1 De aangewezen vennootschap heeft jegens elk van de productiebedrijven een vorderingsrecht tot betaling van
      hetgeen die bedrijven verschuldigd zijn, voor het deel van de totale kosten, bedoeld in [artikel 2][ref1], waarvoor
      elk bedrijf aansprakelijk is.

      2 Betaling geschiedt binnen een termijn die zodanig wordt bepaald door de aangewezen vennootschap,
      dat die vennootschap tijdig kan voldoen aan haar betalingsverplichtingen met betrekking tot de in
      [artikel 2, tweede lid][ref2], bedoelde productiemiddelen en overeenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012088#Artikel2
    url: https://wetten.overheid.nl/BWBR0012088/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012088
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012088
        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      De vorderingsrechten van de productiebedrijven uit hoofde van door hen met de aangewezen vennootschap gesloten
      overeenkomsten inzake de bouw van productiemiddelen vervallen.
    url: https://wetten.overheid.nl/BWBR0012088/2013-01-01#Artikel4
  - number: '5'
    text: |-
      De productiebedrijven hebben naar rato van hun bijdrage in de kosten, bedoeld in
      [artikel 2, tweede lid, onderdelen a en c][ref1], jegens de aangewezen vennootschap recht op levering van de
      elektriciteit die door die installatie wordt geproduceerd, onderscheidenlijk op levering van de elektriciteit die
      of het gas dat ter uitvoering van die overeenkomsten aan die vennootschap wordt geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel2
    url: https://wetten.overheid.nl/BWBR0012088/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012088
        artikel: '2'
        paragraaf: '2'
  - number: '7'
    text: |-
      Onze Minister verstrekt jaarlijks tot 1 januari 2011 een tegemoetkoming:

      a. in de kosten die voortvloeien uit overeenkomsten met betrekking tot stadsverwarming die tussen
      productiebedrijven en leveranciers zijn gesloten voor het tijdstip van intrekking van de Elektriciteitswet 1989,
      voor zover de daarbij overeengekomen projecten in uitvoering zijn genomen voor dat tijdstip, en

      b. in de kosten verbonden aan het vervreemden en overdragen van de aandelen van de n.v. Demkolec of van de
      experimentele kolenvergassingsinstallatie Demkolec.
    url: https://wetten.overheid.nl/BWBR0012088/2013-01-01#Artikel7
  - number: '8'
    text: |-
      1 Overeenkomstig door Onze Minister te stellen regels verstrekt Onze Minister de in [artikel 7][ref1] bedoelde
      tegemoetkoming aan:

      a. de rechtspersonen die de kosten, bedoeld in [artikel 7, onderdeel a][ref2], dragen, waarbij elke rechtspersoon
      ieder jaar dat bedrag ontvangt dat overeenkomt met zijn kosten voor dat jaar, welke kosten berekend worden met
      behulp van de methode van het brandstofprijsrisico die rekening houdt met de warmteproductie per project;

      b. de rechtspersonen die de kosten, bedoeld in [artikel 7, onderdeel b][ref3], dragen.

      2 Onze Minister verstrekt de tegemoetkoming niet aan de rechtspersonen, bedoeld in het eerste lid,
      onderdeel a, dan nadat hij heeft ingestemd met de aan hem verstrekte opgave van de kosten, bedoeld in
      [artikel 7, onderdeel a][ref4], die in dat jaar voor hun rekening zijn, waarbij de desbetreffende rechtspersoon
      tevens aangeeft hoe groot de totale hoeveelheid door hem geproduceerde warmte in TJ is.

      3 Onze Minister verstrekt de tegemoetkoming niet aan de rechtspersonen, bedoeld in het eerste lid,
      onderdeel b, dan nadat de desbetreffende rechtspersonen de aandelen van de n.v. Demkolec of de experimentele
      kolenvergassingsinstallatie Demkolec hebben vervreemd en overgedragen en hij heeft ingestemd met de aan hem
      verstrekte opgave van de kosten die de desbetreffende rechtspersonen dragen vanwege het vervreemden en overdragen
      van de aandelen of de installatie.

      4 Bij de in het eerste lid bedoelde ministeriële regeling wordt in ieder geval bepaald dat geen tegemoetkoming
      wordt gegeven in de kosten waarvoor een bijdrage wordt gegeven door middel van een subsidie of een fiscale
      maatregel.

      5 De in [artikel 7, aanhef][ref5], genoemde periode kan, onder voorbehoud van goedkeuring van de Commissie van de
      Europese Gemeenschappen op grond van artikel 88 van het EG-Verdrag, bij ministeriële regeling worden verlengd met
      een periode waarbij rekening wordt gehouden met de resterende looptijd van de in [artikel 7, onderdeel a][ref6],
      bedoelde overeenkomsten.


