  - number: '23'
    text: |-
      Onze Minister zendt vóór 31 december 2002 aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten in de praktijk van [artikel 10 van deze wet][ref1] en van
      [artikel 11a van de Elektriciteitswet 1998][ref2], waarbij in het bijzonder overwogen zal worden of en onder welke
      voorwaarden aandelen in de netbeheerder van het landelijk hoogspanningsnet door de Staat verkocht kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel11a
