  - number: '22'
    text: |-
      1 Onze Minister stelt binnen vier weken na inwerkingtreding van dit artikel de vergoeding vast die een
      vergunninghouder op grond van [artikel 71 van de Elektriciteitswet 1998][ref1] in 2001 verschuldigd is voor
      het leveren van elektriciteit, opgewekt met een waterkrachtcentrale met een vermogen van ten hoogste 2 MW, een
      installatie waarin biomassa zonder bijstook of bijmenging van kunststoffen thermisch wordt verwerkt onder omzetting
      in elektriciteit met een vermogen van ten hoogste 2 MW, dan wel een installatie voor de opwekking van elektriciteit
      door middel van windenergie of zonne-energie met een vermogen van ten hoogste 8 MW.

      2 De vergoeding, bedoeld in het eerste lid, is gelijk aan de vergoeding die een vergunninghouder op grond van
      [artikel 71 van de Elektriciteitswet 1998][ref2] in 2001 verschuldigd is voor het leveren van elektriciteit,
      opgewekt met een warmtekrachtinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel71
