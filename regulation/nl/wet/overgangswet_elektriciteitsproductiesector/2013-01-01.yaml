  - number: '10'
    text: |-
      1 De Staat is gemachtigd aan de aangewezen vennootschap een redelijke prijs te betalen voor de aandelen in de
      vennootschap die is aangewezen als netbeheerder van het landelijk hoogspanningsnet.
    url: https://wetten.overheid.nl/BWBR0012088/2013-01-01#Artikel10
  - number: '12'
    text: |-
      1 Ten behoeve van de toepassing van het bepaalde bij of krachtens deze wet kan Onze Minister inzage nemen of door
      personen, door hem bij uitdrukkelijke en bijzondere volmacht aangewezen, doen nemen van zakelijke gegevens en
      bescheiden van een producent, een leverancier, een handelaar, een netbeheerder of een afnemer.

      2 [Artikel 5:17, tweede en derde lid, van de Algemene wet bestuursrecht][ref1] en
      [artikel 78, tweede en derde lid, van de Elektriciteitswet 1998][ref2] zijn van overeenkomstige toepassing op een
      verzoek om inzage van gegevens en bescheiden als bedoeld in het eerste lid.

      3 Onze Minister kan de rechtspersonen, bedoeld in [artikel 8, eerste lid][ref3], verzoeken bij de opgave,
      bedoeld in [artikel 8, tweede en derde lid][ref4], een verklaring te voegen van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref5] omtrent de getrouwheid van die opgave.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel517
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel78
