  - number: '21'
    text: |-
      1 De vennootschap die is aangewezen voor het beheer van het landelijk hoogspanningsnet brengt haar statuten
      in overeenstemming met de [artikelen 268 tot en met 274 van Boek 2 van het Burgerlijk Wetboek][ref1] en
      met [artikel 11a van de Elektriciteitswet 1998][ref2] uiterlijk met ingang van de eerste dag van de eerste
      kalendermaand na de inwerkingtreding van dit artikel.

      2 Nadat de termijn, bedoeld in het eerste lid, is verstreken zijn bepalingen in de statuten van de vennootschap
      die is aangewezen voor het beheer van het landelijk hoogspanningsnet, die in strijd zijn met de in het eerste lid
      genoemde bepalingen, nietig en treden de [artikelen 268 tot en met 274 van Boek 2 van het Burgerlijk Wetboek][ref3]
      en met [artikel 11a van de Elektriciteitswet 1998][ref4] daarvoor in de plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel268
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel11a
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel268
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel11a
