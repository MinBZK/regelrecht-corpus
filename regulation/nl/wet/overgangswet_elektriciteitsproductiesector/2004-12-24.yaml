---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: overgangswet_elektriciteitsproductiesector
regulatory_layer: WET
publication_date: '2000-12-28'
valid_from: '2004-12-24'
bwb_id: BWBR0012088
url: https://wetten.overheid.nl/BWBR0012088/2004-12-24
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is in verband met de liberalisering van de
    elektriciteitsproductie te voorzien in regels voor de verdeling van rechten en verplichtingen bij de beëindiging
    van de overeenkomst van samenwerking van de elektriciteitsproductiesector, voor de tegemoetkoming in de daarmee
    verband houdende kosten van die sector en voor de overgang van de meerderheid van de aandelen van de vennootschap
    die is aangewezen als netbeheerder van het landelijk hoogspanningsnet naar de Staat;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet wordt verstaan onder productiebedrijf of aangewezen vennootschap: de rechtspersoon die vergunninghouder
      onderscheidenlijk aangewezen vennootschap als bedoeld in artikel 1 van de Elektriciteitswet 1989 was, of de
      rechtsopvolger daarvan.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel1
  - number: '1.2'
    text: |-
      Onder de overige in deze wet gebruikte termen wordt verstaan hetgeen daaronder verstaan wordt in de
      [Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
  - number: '2.1'
    text: |-
      De productiebedrijven zijn gezamenlijk aansprakelijk voor de kosten, bedoeld in het tweede lid, met inachtneming
      van de volgende onderlinge verdeling:
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel2
  - number: 2.1.a
    text: 'n.v. Elektriciteits-Produktiemaatschappij Oost- en Noord-Nederland: 29,5%;'
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel2
  - number: 2.1.b
    text: 'n.v. Elektriciteits-Produktiemaatschappij Zuid-Nederland: 28,5%;'
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel2
  - number: 2.1.c
    text: 'n.v. Electriciteitsbedrijf Zuid-Holland: 19,5%;'
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel2
  - number: 2.1.d
    text: 'n.v. Energieproduktiebedrijf UNA: 22,5%.'
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel2
  - number: '2.2'
    text: 'De kosten waarvoor de productiebedrijven gezamenlijk aansprakelijk zijn, betreffen:'
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel2
  - number: 2.2.a
    text: |-
      de kosten die voortvloeien uit de exploitatie van de experimentele kolenvergassingsinstallatie Demkolec tot en met
      het tijdstip waarop die installatie wordt overgenomen;
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel2
  - number: 2.2.b
    text: |-
      de kosten die voortvloeien uit de aflossing van de lening die de n.v. Gemeenschappelijke Kernenergiecentrale
      Nederland heeft verstrekt aan de aangewezen vennootschap;
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel2
  - number: 2.2.c
    text: |-
      de kosten die voortvloeien uit de overeenkomsten tot invoer van gas en elektriciteit die de aangewezen vennootschap
      heeft gesloten, voor zover die nog van kracht zijn;
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel2
  - number: 2.2.d
    text: |-
      de kosten die zijn verbonden aan verplichtingen die voor het tijdstip van intrekking van de Elektriciteitswet 1989
      door de aangewezen vennootschap zijn aangegaan met betrekking tot de aanleg van een verbinding voor het transport
      van elektriciteit tussen Nederland en Noorwegen;
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel2
  - number: 2.2.e
    text: |-
      de overige kosten die voortvloeien uit de vereffening van de rechten en verplichtingen van de aangewezen
      vennootschap als deze wordt ontbonden.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel2
  - number: '2.3'
    text: |-
      Indien na de exploitatie van de installatie, bedoeld in het tweede lid, onderdeel a, de aflossing van de lening,
      bedoeld in het tweede lid, onderdeel b, de overdracht van de overeenkomsten, bedoeld in het tweede lid, onderdeel
      c, de nakoming van de verplichtingen, bedoeld in het tweede lid, onderdeel d, en de vereffening van de rechten en
      plichten van de aangewezen vennootschap, bedoeld in het tweede lid, onderdeel e, een batig saldo resulteert, zijn
      de productiebedrijven gerechtigd tot dat saldo met inachtneming van de in het eerste lid bepaalde verdeling.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel2
  - number: '3.1'
    text: |-
      De aangewezen vennootschap heeft jegens elk van de productiebedrijven een vorderingsrecht tot betaling van hetgeen
      die bedrijven verschuldigd zijn, voor het deel van de totale kosten, bedoeld in [artikel 2][ref1], waarvoor elk
      bedrijf aansprakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel2
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012088
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      Betaling geschiedt binnen een termijn die zodanig wordt bepaald door de aangewezen vennootschap,
      dat die vennootschap tijdig kan voldoen aan haar betalingsverplichtingen met betrekking tot de in
      [artikel 2, tweede lid][ref1], bedoelde productiemiddelen en overeenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel2
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012088
        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      De vorderingsrechten van de productiebedrijven uit hoofde van door hen met de aangewezen vennootschap gesloten
      overeenkomsten inzake de bouw van productiemiddelen vervallen.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel4
  - number: '5'
    text: |-
      De productiebedrijven hebben naar rato van hun bijdrage in de kosten, bedoeld in
      [artikel 2, tweede lid, onderdelen a en c][ref1], jegens de aangewezen vennootschap recht op levering van de
      elektriciteit die door die installatie wordt geproduceerd, onderscheidenlijk op levering van de elektriciteit die
      of het gas dat ter uitvoering van die overeenkomsten aan die vennootschap wordt geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel2
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012088
        artikel: '2'
        paragraaf: '2'
  - number: '7'
    text: 'Onze Minister verstrekt jaarlijks tot 1 januari 2011 een tegemoetkoming:'
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel7
  - number: 7.a
    text: |-
      in de kosten die voortvloeien uit overeenkomsten met betrekking tot stadsverwarming die tussen productiebedrijven
      en leveranciers zijn gesloten voor het tijdstip van intrekking van de Elektriciteitswet 1989, voor zover de daarbij
      overeengekomen projecten in uitvoering zijn genomen voor dat tijdstip, en
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel7
  - number: 7.b
    text: |-
      in de kosten verbonden aan het vervreemden en overdragen van de aandelen van de n.v. Demkolec of van de
      experimentele kolenvergassingsinstallatie Demkolec.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel7
  - number: '8.1'
    text: |-
      Overeenkomstig door Onze Minister te stellen regels verstrekt Onze Minister de in [artikel 7][ref1] bedoelde
      tegemoetkoming aan:


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel7
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012088
        artikel: '7'
        paragraaf: '3'
  - number: 8.1.a
    text: |-
      de rechtspersonen die de kosten, bedoeld in [artikel 7, onderdeel a][ref1], dragen, waarbij elke rechtspersoon
      ieder jaar dat bedrag ontvangt dat overeenkomt met zijn kosten voor dat jaar, welke kosten berekend worden met
      behulp van de methode van het brandstofprijsrisico die rekening houdt met de warmteproductie per project;


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel7
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012088
        artikel: '7'
        paragraaf: '3'
  - number: 8.1.b
    text: |-
      de rechtspersonen die de kosten, bedoeld in [artikel 7, onderdeel b][ref1], dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel7
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012088
        artikel: '7'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      Onze Minister verstrekt de tegemoetkoming niet aan de rechtspersonen, bedoeld in het eerste lid,
      onderdeel a, dan nadat hij heeft ingestemd met de aan hem verstrekte opgave van de kosten, bedoeld in
      [artikel 7, onderdeel a][ref1], die in dat jaar voor hun rekening zijn, waarbij de desbetreffende rechtspersoon
      tevens aangeeft hoe groot de totale hoeveelheid door hem geproduceerde warmte in TJ is.


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel7
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012088
        artikel: '7'
        paragraaf: '3'
  - number: '8.3'
    text: |-
      Onze Minister verstrekt de tegemoetkoming niet aan de rechtspersonen, bedoeld in het eerste lid, onderdeel
      b, dan nadat de desbetreffende rechtspersonen de aandelen van de n.v. Demkolec of de experimentele
      kolenvergassingsinstallatie Demkolec hebben vervreemd en overgedragen en hij heeft ingestemd met de aan hem
      verstrekte opgave van de kosten die de desbetreffende rechtspersonen dragen vanwege het vervreemden en overdragen
      van de aandelen of de installatie.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel8
  - number: '8.4'
    text: |-
      Bij de in het eerste lid bedoelde ministeriële regeling wordt in ieder geval bepaald dat geen tegemoetkoming wordt
      gegeven in de kosten waarvoor een bijdrage wordt gegeven door middel van een subsidie of een fiscale maatregel.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel8
  - number: '8.5'
    text: |-
      De in [artikel 7, aanhef][ref1], genoemde periode kan, onder voorbehoud van goedkeuring van de Commissie van de
      Europese Gemeenschappen op grond van artikel 88 van het EG-Verdrag, bij ministeriële regeling worden verlengd met
      een periode waarbij rekening wordt gehouden met de resterende looptijd van de in [artikel 7, onderdeel a][ref2],
      bedoelde overeenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012088#Artikel7
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012088
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012088
        artikel: '7'
        paragraaf: '3'
  - number: '9.1'
    text: |-
      Iedere afnemer, niet zijnde een beschermde afnemer, is naast hetgeen hij op grond van overeenkomst verschuldigd is
      aan de netbeheerder van het gebied waarin hij is gevestigd, aan die netbeheerder een bedrag van f 0,0117 per kWh
      verschuldigd, berekend over de totale hoeveelheid elektriciteit die die netbeheerder in de periode van 1 augustus
      2000 tot en met 31 december 2000 getransporteerd heeft naar zijn aansluiting.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel9
  - number: '9.2'
    text: |-
      Iedere beschermde afnemer is naast hetgeen hij op grond van overeenkomst verschuldigd is aan de vergunninghouder
      van het gebied waarin hij is gevestigd, aan die vergunninghouder een bedrag van f 0,0117 per kWh verschuldigd,
      berekend over de totale hoeveelheid elektriciteit die die vergunninghouder in de periode van 1 augustus 2000 tot en
      met 31 december 2000 aan hem geleverd heeft.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel9
  - number: '9.3'
    text: |-
      Indien een afnemer aan een netbeheerder of een vergunninghouder over het jaar 2000 of een gedeelte daarvan reeds
      een voorschot betaald heeft om het bedrag, bedoeld in het eerste of het tweede lid, te voldoen, verrekent de
      netbeheerder of de vergunninghouder bij de eindafrekening over het jaar 2000 dit voorschot met het totaal aan hem
      verschuldigde bedrag.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel9
  - number: '9.4'
    text: |-
      De opbrengst van de bedragen die afnemers op grond van het eerste of tweede lid verschuldigd zijn, wordt door de
      netbeheerders, onderscheidenlijk de vergunninghouders voor 1 juli 2001 afgedragen aan de aangewezen vennootschap.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel9
  - number: '9.5'
    text: |-
      De aangewezen vennootschap doet Onze Minister opgave van de hoogte van de opbrengst,
      bedoeld in het vierde lid, en voegt daarbij een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] omtrent de getrouwheid van de opgave. Indien
      de totale opbrengst meer is dan f 400 000 000, draagt de aangewezen vennootschap het meerdere af aan Onze Minister,
      die dat bedrag bestemt voor de tegemoetkoming in de kosten, bedoeld in [artikel 7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0012088#Artikel7
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0012088
        artikel: '7'
        paragraaf: '3'
  - number: '10.1'
    text: |-
      De Staat is gemachtigd aan de aangewezen vennootschap een redelijke prijs te betalen voor de aandelen in de
      vennootschap die is aangewezen als netbeheerder van het landelijk hoogspanningsnet.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel10
  - number: '12.1'
    text: |-
      Ten behoeve van de toepassing van het bepaalde bij of krachtens deze wet kan Onze Minister inzage nemen of door
      personen, door hem bij uitdrukkelijke en bijzondere volmacht aangewezen, doen nemen van zakelijke gegevens en
      bescheiden van een producent, een leverancier, een handelaar, een netbeheerder of een afnemer.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel12
  - number: '12.2'
    text: |-
      [Artikel 5:17, tweede en derde lid, van de Algemene wet bestuursrecht][ref1] en
      [artikel 78, tweede en derde lid, van de Elektriciteitswet 1998][ref2] zijn van overeenkomstige toepassing op een
      verzoek om inzage van gegevens en bescheiden als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel78
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '78'
  - number: '12.3'
    text: |-
      Onze Minister kan de rechtspersonen, bedoeld in [artikel 8, eerste lid][ref1], verzoeken bij de opgave,
      bedoeld in [artikel 8, tweede en derde lid][ref2], een verklaring te voegen van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3] omtrent de getrouwheid van die opgave.


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0012088#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012088
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012088
        artikel: '8'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '13.1'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet wijst op aanvraag tot en met 31 maart 2005 ten hoogste 900
      MW en van 1 april 2005 tot en met 31 maart 2009 ten hoogste 750 MW toe aan de aangewezen vennootschap voor het
      transport van elektriciteit, indien dit transport strekt ter uitvoering van de overeenkomsten, gesloten in 1989 en
      1990 tussen de aangewezen vennootschap enerzijds en Electricité de France, Preussen Elektra A.G., onderscheidenlijk
      Vereinigte Elektrizitätswerke Westfalen A.G. anderzijds, zoals deze luidden op 1 augustus 1998 en voor zover deze
      overeenkomsten nog van kracht zijn.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel13
  - number: '13.2'
    text: 'Een aanvraag om transportcapaciteit op grond van het eerste lid heeft betrekking op de toewijzing van capaciteit:'
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel13
  - number: 13.2.a
    text: voor een periode van ten hoogste drie maanden en
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel13
  - number: 13.2.b
    text: |-
      voor ten hoogste de hoeveelheid uren die in de periode van 1 augustus 1999 tot en met 1 augustus 2000 in de
      overeenkomende periode van drie maanden door de netbeheerder van het landelijk hoogspanningsnet werden toegewezen
      voor de nakoming van de desbetreffende overeenkomst.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel13
  - number: '13.3'
    text: |-
      De aangewezen vennootschap is aan de netbeheerder van het landelijk hoogspanningsnet voor iedere MW capaciteit die
      op grond van het eerste lid wordt toegewezen, een bedrag verschuldigd dat gelijk is aan het bedrag dat een afnemer
      verschuldigd is voor een MW capaciteit voor de uitvoering van een jaarcontract die aan hem wordt toegewezen door
      middel van het veilen van capaciteit dan wel het volgens een andere marktconforme methode toewijzen van capaciteit,
      bedoeld in [artikel 31, derde lid, van de Elektriciteitswet 1998][ref1]. Indien geen capaciteit wordt toegewezen
      voor de uitvoering van een jaarcontract, is de aangewezen vennootschap een bedrag verschuldigd dat gelijk is aan
      het bedrag dat een afnemer verschuldigd is voor de uitvoering van een contract dat het meest vergelijkbaar is met
      de in het eerste lid bedoelde overeenkomsten. Het bedrag dat de netbeheerder van het landelijk hoogspanningsnet
      op grond van dit lid verkrijgt, wordt door hem benut bij het doen van een voorstel voor de tarieven die hij ten
      hoogste mag berekenen voor een aansluiting op het landelijk hoogspanningsnet, het transport van elektriciteit over
      dat net of het verrichten van de systeemdiensten, dan wel wordt door hem aangewend ter bekostiging van de taken,
      bedoeld in artikel 16, tweede lid, van de Elektriciteitswet 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '31'
  - number: '13.4'
    text: |-
      Indien de aangewezen vennootschap de overeenkomsten, bedoeld in het eerste lid, overdraagt aan een andere
      natuurlijke persoon of rechtspersoon die een aanvraag doet om toewijzing van transportcapaciteit, wijst de
      netbeheerder van het landelijk hoogspanningsnet de in het eerste lid bedoelde hoeveelheid capaciteit toe aan die
      andere natuurlijke persoon of rechtspersoon. Het tweede en derde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel13
  - number: '13.5'
    text: |-
      De aangewezen vennootschap, dan wel de natuurlijke persoon of rechtspersoon, bedoeld in het vierde lid, kan de
      hem toegewezen capaciteit vervreemden aan derden. Indien hij de hem toegewezen capaciteit gedurende een bepaalde
      periode niet zal gebruiken en hij deze niet heeft vervreemdt, meldt hij dat aan de netbeheerder van het landelijk
      hoogspanningsnet overeenkomstig de procedure die deze hanteert inzake capaciteit die is toegewezen maar die niet
      wordt gebruikt. Na deze melding vervalt de toewijzing van de desbetreffende capaciteit voor de aangegeven periode.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel13
  - number: '13.6'
    text: |-
      Onze Minister kan de netbeheerder van het landelijk hoogspanningsnet opdragen de toewijzing van capaciteit voor
      het transport van elektriciteit op grond van het eerste lid aan de aangewezen vennootschap, dan wel de natuurlijke
      persoon of rechtspersoon, bedoeld in het vierde lid, te beperken tot door hem te bepalen tijdstippen, hoeveelheden
      of overeenkomsten, indien dat nodig is in verband met de opvatting van de Commissie van de Europese Gemeenschappen
      dienaangaande.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel13
  - number: '14.1'
    text: |-
      Het tarief dat door een vergunninghouder in de periode van 1 augustus 2000 tot en met 31 december 2000 in rekening
      wordt gebracht voor het leveren van elektriciteit, gas of warmte aan beschermde afnemers kan ter dekking van de
      in [artikel 10, tweede lid, van de Wet energiedistributie][ref1] bedoelde kosten worden verhoogd met ten hoogste
      5,04%.


      [ref1]: https://wetten.overheid.nl/BWBR0008429#Artikel10
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008429
        artikel: '10'
  - number: '14.2'
    text: |-
      Indien een beschermde afnemer aan een vergunninghouder over het jaar 2000 of een gedeelte daarvan reeds
      een voorschot betaald heeft om de tariefsverhoging, bedoeld in het eerste lid, te voldoen, verrekent
      de vergunninghouder bij de eindafrekening over het jaar 2000 dit voorschot met de totale verschuldigde
      tariefsverhoging.
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel14
  - number: '15'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroep tegen een besluit op grond
      van deze wet de rechtbank te Arnhem bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '21.1'
    text: |-
      De vennootschap die is aangewezen voor het beheer van het landelijk hoogspanningsnet brengt haar statuten
      in overeenstemming met de [artikelen 268 tot en met 274 van Boek 2 van het Burgerlijk Wetboek][ref1] en
      met [artikel 11a van de Elektriciteitswet 1998][ref2] uiterlijk met ingang van de eerste dag van de eerste
      kalendermaand na de inwerkingtreding van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel268
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel11a
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '268'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 11a
  - number: '21.2'
    text: |-
      Nadat de termijn, bedoeld in het eerste lid, is verstreken zijn bepalingen in de statuten van de vennootschap
      die is aangewezen voor het beheer van het landelijk hoogspanningsnet, die in strijd zijn met de in het eerste lid
      genoemde bepalingen, nietig en treden de [artikelen 268 tot en met 274 van Boek 2 van het Burgerlijk Wetboek][ref1]
      en met [artikel 11a van de Elektriciteitswet 1998][ref2] daarvoor in de plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel268
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel11a
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '268'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 11a
  - number: '22.1'
    text: |-
      Onze Minister stelt binnen vier weken na inwerkingtreding van dit artikel de vergoeding vast die een
      vergunninghouder op grond van [artikel 71 van de Elektriciteitswet 1998][ref1] in 2001 verschuldigd is voor
      het leveren van elektriciteit, opgewekt met een waterkrachtcentrale met een vermogen van ten hoogste 2 MW, een
      installatie waarin biomassa zonder bijstook of bijmenging van kunststoffen thermisch wordt verwerkt onder omzetting
      in elektriciteit met een vermogen van ten hoogste 2 MW, dan wel een installatie voor de opwekking van elektriciteit
      door middel van windenergie of zonne-energie met een vermogen van ten hoogste 8 MW.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel71
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '71'
  - number: '22.2'
    text: |-
      De vergoeding, bedoeld in het eerste lid, is gelijk aan de vergoeding die een vergunninghouder op grond van
      [artikel 71 van de Elektriciteitswet 1998][ref1] in 2001 verschuldigd is voor het leveren van elektriciteit,
      opgewekt met een warmtekrachtinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel71
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '71'
  - number: '23'
    text: |-
      Onze Minister zendt vóór 31 december 2002 aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten in de praktijk van [artikel 10 van deze wet][ref1] en van
      [artikel 11a van de Elektriciteitswet 1998][ref2], waarbij in het bijzonder overwogen zal worden of en onder welke
      voorwaarden aandelen in de netbeheerder van het landelijk hoogspanningsnet door de Staat verkocht kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel11a
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012088
        artikel: '10'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 11a
  - number: '24'
    text: 'Deze wet wordt aangehaald als: Overgangswet elektriciteitsproductiesector.'
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel24
  - number: '25.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld, met dien verstande dat de
      [artikelen 7][ref1] en [8][ref2] kunnen terugwerken tot en met een bij dat besluit te bepalen tijdstip


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012088#Artikel8
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012088
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012088
        artikel: '8'
        paragraaf: '3'
  - number: '25.2'
    text: |-
      De [artikelen 9][ref1] en [14][ref2] treden in werking met ingang van de dag na de datum van uitgifte van het
      Staatsblad waarin zij worden geplaatst en werken terug tot en met 1 augustus 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0012088#Artikel14
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012088
        artikel: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012088
        artikel: '14'
        paragraaf: '5'
  - number: '25.3'
    text: |-
      De [artikelen 10, tweede lid, van deze wet][ref1] en
      [11a, derde, vierde, vijfde en achtste lid, van de Elektriciteitswet 1998][ref2] vervallen met ingang van 1 januari
      2003.


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel11a
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012088
        artikel: '10'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 11a
  - number: '25.4'
    text: |-
      [Artikel 69, tweede en derde lid, van de Elektriciteitswet 1998][ref1] vervalt met ingang van een bij koninklijk
      besluit te bepalen datum.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel69
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '69'
  - number: '25.5'
    text: |-
      [Artikel 11][ref1] vervalt drie jaar na haar tijdstip van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0012088#Artikel11
    url: https://wetten.overheid.nl/BWBR0012088/2004-12-24#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012088
        artikel: '11'
        paragraaf: '4'
