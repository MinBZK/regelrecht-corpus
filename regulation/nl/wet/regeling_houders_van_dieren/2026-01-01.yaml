      Indien de situatie dermate spoedeisend is dat de minister een besluit op een aanvraag van een vergunning als
      bedoeld in artikel 23, derde lid, van [verordening (EG) nr. 1/2005](32005R0001) niet tevoren op schrift kan
      stellen, zorgt de minister alsnog zo spoedig mogelijk voor de opschriftstelling en de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      Bij de aanvrager van een certificaat van goedkeuring voor een vervoermiddel als bedoeld in artikel 18, eerste lid,
      of artikel 19, eerste lid, van verordening (EG) nr. 1/2005 wordt een bedrag in rekening gebracht ter vergoeding
      van de kosten van de behandeling van die aanvraag, overeenkomstig de door de Dienst Wegverkeer, bedoeld in
      [artikel 4a van de Wegenverkeerswet 1994][ref1], vastgestelde tarieven met betrekking tot dierenvervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4a
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel4.4
