  - number: 8a.6
    text: |-
      1 De organisator van een keuring, tentoonstelling of wedvlucht als bedoeld in
      [artikel 4.18, tweede lid, van het besluit][ref1]:

      a. doet ten minste acht dagen voorafgaand aan de dag waarop de keuring, tentoonstelling of wedvlucht plaatsvindt
      daarvan een melding als bedoeld in [artikel 4.18, derde lid, onderdeel c, van het besluit][ref2];

      b. laat de uit Nederland afkomstige dieren bij de plaats van aanvoer op zijn kosten onderzoeken door één of meer
      dierenartsen.

      2 In afwijking van het eerste lid, onderdeel a, verstrekt degene die voornemens is postduiven voor een wedvlucht
      bijeen te brengen jaarlijks een overzicht van dit voornemen aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel4.18
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel4.18
