  - number: '3.1'
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *epidemiologische eenheid:* epidemiologische eenheid als bedoeld in artikel 4, punt 44, van verordening (EU)
      nr. 2019/6;
        - *kalf:* rund dat bestemd is voor de productie van vlees en dat ouder is dan veertien dagen en niet ouder is dan
      twaalf maanden;
        - *konijn:* konijn dat bestemd is voor de fokkerij of de productie van vlees;
        - *koppel:* groep dieren met dezelfde gezondheidsstatus die in dezelfde stal of binnen dezelfde ruimte worden
      geplaatst of gehouden en die een epidemiologische eenheid vormen;
        - *rund:* rund dat bestemd is voor de productie van melk of vlees, niet zijnde een kalf.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      De melding, bedoeld in [artikel 1.27, eerste lid van het besluit][ref1] wordt gedaan van de ontvangst van
      antimicrobiële diergeneesmiddelen ten behoeve van toepassing bij:

      a. kippen of kalkoenen indien de houder van deze dieren 250 of meer kippen of kalkoenen houdt ten behoeve van de
      productie van vlees, consumptie-eieren of broedeieren;

      b. runderen, indien de houder van deze dieren 5 of meer runderen houdt ten behoeve van de productie van melk of
      vlees;

      c. kalveren, indien de houder van deze dieren 5 of meer kalveren houdt ten behoeve van de productie van vlees;

      d. varkens, indien de houder van deze dieren 5 of meer varkens houdt ten behoeve van de productie van vlees;

      e. konijnen, indien de houder van deze dieren 250 of meer konijnen houdt ten behoeve van de fokkerij of de
      productie van vlees;

      f. geiten, indien de houder van deze dieren 25 of meer geiten houdt ten behoeve van de fokkerij of de productie van
      melk of vlees.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1.27
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1.27'
  - number: '3.3'
    text: |-
      1 Bij de melding, bedoeld in [artikel 1.27, eerste lid, van het besluit][ref1], worden de volgende gegevens
      verstrekt:

      a. de naam, het adres en de woonplaats van de houder;

      b. het unieke registratienummer of het unieke erkenningsnummer;

      c. de diersoort, diercategorie, subcategorie en leeftijdscategorie van de gehouden dieren;

      d. het gemiddeld aantal dieren per diersoort, diercategorie, subcategorie en leeftijdscategorie dat per dag werd
      gehouden.

      2 Het gemiddeld aantal dieren, bedoeld in het eerste lid, onderdeel d, wordt:

      a. indien het een houder van kippen, kalkoenen of kalveren, en de houder van kalveren een systeem toepast waarbij
      de kalveren tegelijk worden aangevoerd, opgefokt en afgevoerd, betreft, berekend over de periode vanaf het moment
      van aanvoer van een koppel dieren tot het moment van afvoer daarvan;

      b. indien het een houder van runderen, varkens, konijnen, geiten of kalveren, en de houder van kalveren een
      systeem toepast waarbij kalveren van verschillende leeftijden worden gehouden die niet op hetzelfde moment worden
      afgevoerd, betreft, berekend over de periode van twaalf maanden voorafgaand aan het moment waarop de melding wordt
      gedaan.

      3 Indien de melding wordt gedaan ten aanzien van een diergeneesmiddel dat bij kippen of kalkoenen wordt toegepast,
      worden tevens de volgende gegevens verstrekt:

      a. het unieke subregistratienummer, bedoeld in [artikel 5a.1, derde lid][ref2], van de Regeling houders van dieren;

      b. de geboortedatum van het koppel waarbij het diergeneesmiddel is toegepast;

      c. het nummer van de stal waarin het koppel wordt gehouden;

      d. het aantal kuikens dat is opgezet in de stal waarin het koppel wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1.27
      [ref2]: https://wetten.overheid.nl/BWBR0035248#Artikel5a.1
