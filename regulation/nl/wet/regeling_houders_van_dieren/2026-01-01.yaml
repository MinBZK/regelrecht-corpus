        artikel: '3.1'
  - number: 7b.25
    text: |-
      1 De monsters, bedoeld in [artikel 7b.23][ref1], worden uiterlijk op de werkdag na de dag dat ze zijn genomen
      aangeleverd bij de instelling, bedoeld in [artikel 7b.24][ref2].

      2 Bij aanlevering van de monsters worden in ieder geval de volgende gegevens aangeleverd:

      a. gegevens ter identificatie van de houder van de dieren, van degene die het monster heeft genomen en van de
      dieren die zijn bemonsterd;

      b. de dag waarop de monsters zijn genomen;

      c. de dag waarop de monsters worden verzonden; en

      d. de naam en handtekening van de inzender van de monsters.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel7b.23
