  - number: 7b.35
    text: |-
      Van dieren als bedoeld in [artikel 7b.28, derde lid][ref1], is al naar gelang de categorie waartoe zij behoren, de
      in respectievelijk [artikel 7b.31][ref2], [7b.32][ref3], [7b.33][ref4] en [7b.34][ref5] opgenomen verplichting tot
      het nemen van bloedmonsters van overeenkomstige toepassing, met dien verstande dat het bloed wordt afgenomen in de
      periode van 3 tot 4 weken na de datum waarop de dieren zijn gevaccineerd.


