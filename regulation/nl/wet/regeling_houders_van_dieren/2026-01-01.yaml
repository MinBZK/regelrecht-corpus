    text: |-
      1 Exploitanten die runderen houden, vragen een identificatiedocument als bedoeld in artikel 112, onderdeel b, van
      verordening (EU) nr. 2016/429, bij de minister aan met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld.

      2 Een identificatiedocument als bedoeld in het eerste lid blijft drie werkdagen geldig na de uitgiftedatum, vermeld
      op het document.
