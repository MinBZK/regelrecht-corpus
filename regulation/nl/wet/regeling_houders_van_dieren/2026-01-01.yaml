  - number: 5b.68a
    text: |-
      1 De registratie, bedoeld in [artikel 3.30, eerste lid, van het besluit][ref1], vindt plaats binnen een week nadat
      bij de hond een injecteerbare transponder is aangebracht en in ieder geval voordat de hond aan een andere houder
      wordt overgedragen.

      2 Bij de registratie, bedoeld in het eerste lid, wordt vermeld:

      a. de geboortedatum van de hond;

      b. de identificatiecode van de hond;

      c. de identificatiecode van het moederdier van de hond; en

      d. het registratienummer van de houder.

      3 De overdragende houder registreert binnen twee weken na overdracht van de hond bij de minister via een op grond
      van [artikel 3.32 van het besluit][ref2] aangewezen elektronisch portaal:

      a. de datum van overdracht;

      b. de identificatiecode van de hond; en

      c. het registratienummer van de houder, voor zover verstrekt.

      4 De opvolgende houder registreert binnen twee weken na de overdracht van de hond bij de minister via een op grond
      van [artikel 3.32 van het besluit][ref3] aangewezen elektronisch portaal:

      a. de naam en het adres van de houder;

      b. de datum van overdracht;

      c. de identificatiecode van de hond; en

      d. het registratienummer van de houder, voor zover verstrekt.

      5 Binnen twee weken na het overlijden of zo spoedig mogelijk na de blijvende vermissing van een hond doet de houder
      van een hond hiervan een registratie bij de minister via een op grond van [artikel 3.32 van het besluit][ref4]
      aangewezen elektronisch portaal.

      6 Bij de registratie, bedoeld in het vijfde lid, wordt vermeld:

      a. de datum van overlijden of blijvende vermissing;

      b. de identificatiecode van de hond; en

      c. het registratienummer van de houder, voor zover verstrekt.

      7 Indien geen elektronisch portaal is aangewezen, worden de registraties, bedoeld in het derde, vierde en vijfde
      lid, rechtstreeks bij de minister gedaan.


