  - number: 5b.9
    text: |-
      Een bestelling van identificatiemiddelen, slachtmerken of gebruiksmerken voor dieren die op grond van [verordening
      (EU) nr. 2019/2035](32035R2019) geïdentificeerd moeten worden wordt rechtstreeks gedaan bij de leverancier van
      respectievelijk het middel en merk.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.9
  - number: 5b.10
    text: |-
      1 Een leverancier van identificatiemiddelen, slachtmerken of gebruiksmerken voor dieren die op grond van
      [verordening (EU) nr. 2019/2035](32035R2019) geïdentificeerd moeten worden houdt een inzichtelijke administratie
      bij, waaruit per uniek registratienummer van inrichtingen waar landdieren worden gehouden en per besteldatum, is
      opgenomen hoeveel identificatiemiddelen, slachtmerken en gebruiksmerken voor dieren die op grond van [verordening
      (EU) nr. 2019/2035](32035R2019) geïdentificeerd moeten worden door hem aan de inrichting zijn besteld en geleverd.

      2 Wanneer een leverancier identificatiemiddelen heeft geleverd waarop een identificatiecode voor een individueel
      dier staat, is in de administratie, bedoeld in het eerste lid, deze code vermeld bij het geleverde middel.

      3 Dit artikel is niet van toepassing op leveranciers van injecteerbare transponders.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.10
  - number: 5b.10a
    text: |-
      1 De registratie, bedoeld in [artikel 1.58c, vijfde lid, van het besluit][ref1], wordt gedaan via een op grond van
      [artikel 3.32 van het besluit][ref2] aangewezen elektronisch portaal.

      2 In afwijking van het eerste lid wordt de registratie rechtstreeks bij de minister gedaan indien de injecteerbare
      transponder wordt overgedragen door een leverancier van injecteerbare transponders.

      3 In afwijking van het eerste lid wordt de registratie gedaan via een instantie als bedoeld in artikel 4,
      eerste lid, van [verordening (EU) nr. 2021/963](32863R2021), indien de injecteerbare transponder is bestemd voor
      aanbrenging bij een paardachtige.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1.58c
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel3.32
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.10a
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: 1.58c
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '3.32'
  - number: 5b.11
    text: |-
      1 Een leverancier verstrekt aan een exploitant die varkens houdt uitsluitend identificatiemiddelen, slachtmerken en
      gebruiksmerken die zijn voorzien van het unieke registratienummer van de desbetreffende inrichting.

      2 Een leverancier van identificatiemiddelen, slachtmerken of gebruiksmerken voor varkens verstrekt ieder kwartaal
      aan de minister een overzicht van het aantal bestelde en het aantal geleverde identificatiemiddelen of merken per
      uniek registratienummer van inrichtingen, onder vermelding van de op de geleverde identificatiemiddelen of merken
      vermelde gegevens.

      3 Het eerste en tweede lid zijn niet van toepassing ingeval het identificatiemiddel een tatoeage is.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.11
  - number: 5b.13
    text: |-
      1 Het is een exploitant die runderen, paardachtigen, schapen, geiten of varkens houdt, verboden om zonder
      toestemming van de minister identificatiemiddelen, slachtmerken of gebruiksmerken:

      a. aan derden te verstrekken;

      b. van derden aan te nemen;

      c. voorhanden te hebben.

      2 Het eerste lid is niet van toepassing op exploitanten die runderen, schapen of geiten houden, indien degene die
      de middelen of merken verstrekt, daaraan voorafgaand melding heeft gemaakt van de voorgenomen verstrekking aan
      de minister.

      3 De melding, bedoeld in het tweede lid, geschiedt met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.13
  - number: 5b.14
    text: |-
      1 Het aanbrengen en vervangen van een identificatiemiddel dat geen verrichting van een lichamelijke ingreep is,
      geschiedt uitsluitend door:

      a. de exploitant van het te identificeren dier, niet zijnde een exploitant van een slachthuis of van een
      verzamelcentrum of een vervoerder;

      b. een derde die daartoe door de exploitant, bedoeld in onderdeel a, is aangewezen; of

      c. een ambtenaar van de NVWA, dan wel een dierenarts of een ander persoon die voor deze werkzaamheden door de
      minister worden ingezet.

      2 In aanvulling op de [artikelen 2.12, onderdeel b][ref1], [2.28, onderdeel c][ref2], en
      [2.77, onderdelen b, c, en d, van het Besluit houders van dieren][ref3] is het de volgende personen toegestaan de
      daar genoemde identificatiemiddelen aan te brengen en te vervangen bij respectievelijk een varken, rund, schaap
      of geit:

      a. een derde die daartoe door de houder, bedoeld in de in de aanhef genoemde artikelen, van het te identificeren
      dier is aangewezen; of

      b. een ambtenaar, dierenarts of ander persoon als bedoeld in het eerste lid, onderdeel c.

      3 In afwijking van de [artikelen 2.12, onderdeel b][ref4], en
      [2.28, onderdeel c, van het Besluit houders van dieren][ref5] is het een houder niet toegestaan de daar genoemde
      identificatiemiddelen aan te brengen en te vervangen bij respectievelijk een varken of rund indien de houder een
      exploitant van een slachthuis of een verzamelcentrum is, of een vervoerder.

      4 Ingeval artikel 81 van verordening (EU) 2019/2035 van toepassing is, verricht de exploitant, bedoeld in het
      eerste lid, de derde, bedoeld in het eerste of tweede lid, dan wel de houder, bedoeld in het tweede lid, de
      handeling onder toezicht van een ambtenaar, dierenarts of ander persoon als bedoeld in het eerste lid, onderdeel c.

      5 De minister kan een exploitant of houder de bevoegdheid tot het aanbrengen en vervangen van identificatiemiddelen
      en het aanwijzen van een derde om die handelingen te verrichten ontzeggen indien deze naar het oordeel van de
      minister niet langer handelt in overeenstemming met de regels over de identificatie van dieren. In dat geval levert
      de exploitant dan wel de houder alle bij hem in voorraad zijnde nog niet aangebrachte identificatiemiddelen in bij
      de minister, binnen drie werkdagen te rekenen vanaf de dag na de dag waarop de bevoegdheid is ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2.12
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2.28
