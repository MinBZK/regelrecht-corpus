  - number: 5b.72
    text: |-
      Een identificatiedocument wordt bij de slachting of dood van een paardachtige vanwege de bestrijding van een
      ziekte, door de officiële dierenarts ongeldig gemaakt door ten minste op alle bladzijden met een fraudebestendige
      stempel het woord ‘ongeldig’ aan te brengen of door in alle bladzijden een gat te maken waarvan de diameter niet
      kleiner is dan het gat dat door een normale perforator wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.72
  - number: 5b.73
    text: |-
      De exploitant van een reizend circus of dierennummer voor gehouden landdieren doet een aanvraag voor een
      verplaatsingsdocument en, ingeval er voor een dier nog geen identificatiedocument is afgegeven, voor een
      identificatiedocument als bedoeld in de artikelen 77, 78 en 79 van verordening (EU) nr. 2019/2035 met een daartoe
      door de minister beschikbaar gesteld middel.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.73
  - number: 5b.73a
    text: |-
      1 De termijn, bedoeld in [artikel 3.28, tweede lid, onderdeel b, van het besluit][ref1], is uiterlijk zeven weken
      na de geboorte van de hond.

      2 Onverminderd het bepaalde in het eerste lid, wordt de hond in elk geval voorafgaand aan de overdracht voorzien
      van een identificatiedocument.

      3 Voordat een dierenarts een identificatiedocument voor een hond afgeeft identificeert de houder zich bij de
      dierenarts met het registratienummer van de houder.

      4 De dierenarts die een identificatiedocument heeft afgegeven voor een hond registreert binnen twee werkdagen bij
      de minister via een op grond van [artikel 3.32 van het besluit][ref2] aangewezen elektronisch portaal:

      a. de datum waarop het identificatiedocument is afgegeven;

      b. de identificatiecode van het identificatiedocument;

      c. het nummer dat de dierenarts heeft verkregen bij de registratie in het register, bedoeld in
      [artikel 4.3, eerste lid, van de wet][ref3];

      d. het praktijkadres van de dierenarts; en

      e. de identificatiecode van het vorige identificatiedocument, indien van toepassing;

      f. de identificatiecode van de hond;

      g. de geboortedatum van de hond, indien eerder onjuist geregistreerd;

      h. het land van herkomst van de hond of, in voorkomende gevallen, dat het land van herkomst onbekend is; en

      i. het registratienummer van de houder van de hond.

      5 Bij de overdracht van een hond draagt de houder het identificatiedocument van de hond over aan de opvolgende
      houder.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3.28
