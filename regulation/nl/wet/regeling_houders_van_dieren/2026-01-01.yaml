      Indien de aanvrager op grond van [artikel 11 van de Algemene wet erkenning EU-beroepskwalificaties][ref1] een
      proeve van bekwaamheid moet afleggen:

      a. wordt de aanvrager schriftelijk geïnformeerd over de vakken waarop de proeve van bekwaamheid betrekking heeft,
      over de wijze waarop de proeve van bekwaamheid wordt afgenomen en over de kosten van de proeve;

      b. wordt het resultaat van de proeve van bekwaamheid zo spoedig mogelijk meegedeeld aan de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel11
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel8.10
