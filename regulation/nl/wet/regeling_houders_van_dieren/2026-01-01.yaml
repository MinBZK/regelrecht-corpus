      (32329R2016) is niet van toepassing op aquacultuurinrichtingen die voldoen aan artikel 4, eerste lid, onderdelen a
      en b, van [verordening (EU) nr. 2021/2037](32037R2021).

      2 Artikel 188, eerste lid, van [verordening (EU) nr. 2016/429](32329R2016) is niet van toepassing op vervoerders
      van de in artikel 4, tweede lid, van de [verordening (EU) nr. 2021/2037](32037R2021) genoemde categorieën
      waterdieren als aan de in dat lid genoemde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5a.11
  - number: 5b.1
    text: |-
      1 In aanvulling op artikel 102, eerste lid, van verordening (EU) nr. 2016/429, zorgt de exploitant van een
      inrichting waar runderen worden gehouden, voor het bewaren en bijhouden van documentatie over de volgende gegevens
      over de in de inrichting gehouden runderen:

      a. de identificatiecode van de moeder;

      b. het geslacht; en

      c. de haarkleur.

      2 Artikel 102, eerste lid, slotzin, en derde lid, van verordening (EU) nr. 2016/429 zijn van overeenkomstige
      toepassing op de documentatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.1
  - number: 5b.2
    text: |-
      1 In aanvulling op artikel 102, eerste lid, van verordening (EU) nr. 2016/429, zorgt de exploitant van een
      inrichting waar varkens worden gehouden die afkomstig zijn uit een derde land en ten aanzien waarvan de inrichting
      de bestemming is, voor het bewaren en bijhouden van documentatie over de volgende gegevens over die varkens:

      a. het door de bevoegde autoriteit van het derde land toegekende identificatienummer; en

      b. het nummer van het op de inrichting aangebrachte identificatiemiddel.

      2 Artikel 102, eerste lid, slotzin, en derde lid, van verordening (EU) nr. 2016/429 zijn van overeenkomstige
      toepassing op de documentatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.2
  - number: 5b.3
    text: |-
      1 In aanvulling op artikel 102, eerste lid, van verordening (EU) nr. 2016/429, zorgt
      de exploitant van een inrichting waar schapen of geiten worden gehouden die ingevolge
      [artikel 1.46 van het Besluit houders van dieren][ref1] worden gevaccineerd, voor het bewaren en bijhouden van
      documentatie over de volgende gegevens over die schapen en geiten:

      a. de datum waarop deze zijn gedekt of geïnsemineerd; of

      b. wanneer het precieze moment van dekking niet bekend is, het moment waarop de geiten of schapen kunnen worden
      gedekt.

      2 Artikel 102, eerste lid, slotzin, en derde lid, van verordening (EU) nr. 2016/429 zijn van overeenkomstige
      toepassing op de documentatie, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1.46
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.3
