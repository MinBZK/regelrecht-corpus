      1 Een broederij registreert het aantal uitgekomen kuikens dat daadwerkelijk bestemd is om te worden gebruikt,
      bedoeld in artikel 8, eerste lid, van verordening (EG) nr. 617/2008:

      a. via een elektronisch portaal dat op grond van
      [artikel 1.4, derde lid, van de Regeling handhaving en overige zaken Wet dieren][ref1] door de minister is
      aangewezen als elektronisch portaal voor de registratie van die gegevens, of

      b. bij de minister, voor zover voor de registratie van die gegevens geen aanwijzing als bedoeld in onderdeel a
      heeft plaatsgevonden.

      2 De verzender van een partij kuikens registreert de gegevens die het begeleidende document, bedoeld in artikel 5,
      eerste lid, van verordening (EG) nr. 617/2008, bevat overeenkomstig het eerste lid, onderdelen a en b.

      3 In afwijking van het tweede lid wordt de registratie, bedoeld in dat lid, bij ontvangst op een
      vermeerderingsbedrijf van kippen die worden gebruikt als moederdier, gedaan door de ontvanger van die kuikens.


