  - number: 5b.21
    text: |-
      1 Het is de exploitant die runderen houdt, in afwijking van artikel 38, eerste lid, onderdeel c, van verordening
      (EU) nr. 2019/2035, toegestaan om:

      a. bij een rund dat één identificatiemiddel heeft verloren, een identificatiemiddel aan te brengen met dezelfde
      identificatiecode, overeenkomstig artikel 19, tweede lid, onderdeel a, van verordening (EU) nr. 2021/520;

      b. bij een rund dat twee identificatiemiddelen heeft verloren, onder toezicht van

      een ambtenaar van de NVWA, dan wel een dierenarts of een ander persoon die voor deze werkzaamheden door de minister
      worden ingezet, identificatiemiddelen aan te brengen met dezelfde identificatiecode, overeenkomstig artikel 19,
      tweede lid, onderdeel b, van verordening (EU) nr. 2021/520.

      2 [ Artikel 5b.14][ref1] is van toepassing op de handelingen, genoemd in het eerste lid, onderdelen a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.14
