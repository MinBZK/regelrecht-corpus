  - number: 5b.22
    text: |-
      1 Ingeval [artikel 5b.21][ref1] van toepassing is, bestelt de exploitant binnen drie werkdagen, te rekenen vanaf de
      dag na de dag waarop het verlies van het identificatiemiddel van het rund is geconstateerd, een identificatiemiddel
      ter vervanging.

      2 De exploitant, bedoeld in het eerste lid, brengt het vervangende identificatiemiddel aan zodra het
      identificatiemiddel in zijn bezit is en in ieder geval binnen tien werkdagen nadat het verlies van het
      identificatiemiddel van een rund is geconstateerd en voordat het rund de inrichting verlaat.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.21
