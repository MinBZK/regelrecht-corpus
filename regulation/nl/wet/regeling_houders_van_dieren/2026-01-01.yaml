  - number: 5c.1
    text: |-
      1 Evenhoevigen, met uitzondering van varkens, verblijven ten minste 21 dagen op een inrichting, niet zijnde een
      slachthuis, verzamelcentrum of tentoonstelling of keuring, nadat zij op die inrichting bijeengebracht zijn, voordat
      zij worden verplaatst naar een inrichting in Nederland.

      2 Evenhoevigen, met uitzondering van varkens, die voorafgaand aan de aanvoer op een inrichting, niet zijnde
      een slachthuis, verzamelcentrum of tentoonstelling of keuring, zijn verzameld op een vervoermiddel als bedoeld
      in [artikel 1.34 van het besluit][ref1], verblijven ten minste 21 dagen op die inrichting voordat zij worden
      verplaatst naar een inrichting in Nederland.

      3 Ingeval evenhoevigen uit derde landen op een inrichting, niet zijnde een slachthuis, verzamelcentrum,
      tentoonstelling of keuring, zijn aangevoerd, verblijven de andere op de inrichting aanwezige evenhoevigen 30 dagen
      op die inrichting, voordat zij worden verplaatst naar een inrichting in Nederland, te rekenen vanaf de dag waarop
      evenhoevigen uit derde landen op die inrichting zijn aangevoerd.

      4 Het tweede lid is niet van toepassing indien de andere evenhoevigen worden afgevoerd naar een in Nederland
      gelegen slachthuis.

      5 Het tweede lid is niet van toepassing indien de aangevoerde evenhoevigen uit derde landen zodanig gescheiden
      worden gehouden van de andere op de inrichting aanwezige evenhoevigen dat direct en indirect contact wordt
      voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1.34
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5c.1
    references:
