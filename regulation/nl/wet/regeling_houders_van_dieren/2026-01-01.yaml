  - number: '7.3'
    text: |-
      1 De houder van varkens op een A-bedrijf, C-bedrijf, of E-bedrijf, laat eenmaal per maand bloedmonsters nemen van
      de aanwezige varkens overeenkomstig de procedure van [bijlage 10][ref1].

      2 De houder van varkens op een B-bedrijf, F-bedrijf, of D-bedrijf laat iedere viermaandelijkse periode die loopt
      van januari tot en met april, van mei tot en met augustus en van september tot en met december, bloed bemonsteren
      van drie varkens die:

      a. ten minste 25 kg zwaar zijn; of

      b. de zwaarste dieren zijn.

      3 Tijdens de monstername wordt ten minste 8 milliliter bloed per varken afgenomen.

      4 Het is toegestaan om het bloed, bedoeld in het tweede lid, af te laten nemen nadat de dieren zijn gedood.

      5 Het tweede lid is niet van toepassing indien het aantal gehouden varkens, uitgezonderd zogende biggen, gedurende
      de periode, bedoeld in tweede lid, minder dan 31 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0035248
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0035248
  - number: '7.4'
    text: |-
      1 De houder van varkens laat het bloed, bedoeld in [artikel 7.3, eerste of tweede lid][ref1], in een laboratorium
      dat daarvoor op grond van [artikel 3 van de Regeling erkenning veterinaire laboratoria][ref2] is erkend,
      onderzoeken op de aanwezigheid van antistoffen tegen het Aujeszky-virus of het Aujeszky-vaccin.

      2 De monsters worden uiterlijk op de werkdag na de dag dat ze zijn genomen aangeleverd bij het laboratorium,
      bedoeld in het eerste lid.

      3 Bij aanlevering van de monsters worden in ieder geval de volgende gegevens aangeleverd:

      a. gegevens ter identificatie van de houder van de varkens, van degene die het monster heeft genomen en van de
      varkens die zijn bemonsterd;

      b. de dag waarop de monsters zijn genomen;

      c. de afdeling waarin de varkens gehuisvest zijn;

      d. de dag waarop de monsters worden verzonden; en

      e. de handtekening van de inzender van de monsters.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel7.3
      [ref2]: https://wetten.overheid.nl/BWBR0045052#Artikel3
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel7.4
