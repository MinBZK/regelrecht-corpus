        bwb_id: BWBR0030250
        artikel: '2.1'
  - number: '9.3'
    text: |-
      Als voorschrift als bedoeld in [artikel 6.2, eerste lid, van de wet][ref1] wordt aangewezen: artikel
      18 van [verordening (EG) nr. 178/2002](32002R0178) van het Europees Parlement en de Raad van 28 januari
      2002, tot vaststelling van de algemene beginselen en voorschriften van de levensmiddelenwetgeving, tot
      oprichting van een Europese Autoriteit voor voedselveiligheid en tot vaststelling van procedures voor
      voedselveiligheidsaangelegenheden, voor houders van productiedieren die gehouden worden voor de voedselproductie
      (PbEG 2002 L 31).


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel6.2
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel9.3
