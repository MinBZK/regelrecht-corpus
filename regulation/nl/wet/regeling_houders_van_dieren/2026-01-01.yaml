  - number: 8a.1
    text: |-
      In aanvulling op de gegevens, bedoeld artikel 84 van verordening (EU) nr. 2016/429, verstrekt een organisator als
      bedoeld in [artikel 4.15, derde lid, van het besluit][ref1] bij de in dat artikellid bedoelde melding:

      a. het telefoonnummer van de organisator van de tentoonstelling of keuring;

      b. de datum en plaats van de tentoonstelling of keuring, alsmede het unieke registratienummer, bedoeld in artikel
      93, slot, van verordening (EU) nr. 2016/429, of het unieke erkenningsnummer, bedoeld in artikel 2, onderdeel 16,
      van verordening (EU) nr. 2019/2035 dat aan de inrichting waarop de dieren worden gehouden is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel4.15
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel8a.1
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '4.15'
  - number: 8a.2
    text: |-
      De houder van de runderen, schapen of geiten die worden aangevoerd op of afgevoerd van de tentoonstelling of
      keuring, vervoert de dieren met een vervoermiddel waarvoor krachtens de [Wegenverkeerswet 1994](onbekend) een
      kentekenbewijs of registratiebewijs is afgegeven.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel8a.2
  - number: 8a.3
    text: |-
      1 Eenieder die het deel van de plaats van de tentoonstelling of keuring, waar runderen, schapen of geiten
      verblijven, betreedt of verlaat, ontsmet zijn schoeisel door middel van voorzieningen, die duidelijk zichtbaar
      aanwezig zijn bij elke in- en uitgang van voornoemd deel van de plaats.

      2 Voordat een vervoermiddel dat geladen is met runderen, schapen of geiten, de plaats van de tentoonstelling of
      keuring verlaat, worden de kritische delen van het vervoermiddel gereinigd en ontsmet.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel8a.3
  - number: 8a.4
    text: |-
      1 In aanvulling op de gegevens, bedoeld in artikel 102, eerste lid, van verordening (EU) nr. 2016/429 en de
      artikelen 22 en 23 van verordening (EU) nr. 2019/2035 houdt de organisator van de tentoonstelling of keuring, de
      volgende gegevens bij:

      a. indien van toepassing, de kentekens van de vervoermiddelen waarmee runderen, schapen of geiten zijn aan- of
      afgevoerd; en

      b. de resultaten van het klinische onderzoek, bedoeld in [artikel 4.15, vierde lid, van het besluit][ref1].

      2 De organisator bewaart de gegevens, bedoeld in het eerste lid, ten minste drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel4.15
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel8a.4
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '4.15'
  - number: 8a.5
    text: |-
      1 Vogels als bedoeld in [artikel 4.18, tweede lid, onderdeel a of b van het besluit][ref1] die uit Nederland
      afkomstig zijn, worden slechts toegelaten tot een keuring of tentoonstelling onderscheidenlijk wedvlucht indien:

      a. vogels van de orde Galliformes of Struthioniformes, voor zover die vogels ouder zijn dan 30 dagen, ten minste
      twee weken en ten hoogste vijf maanden voor het begin van de tentoonstelling of de keuring zijn gevaccineerd tegen
      Newcastle Disease;

      b. postduiven ten minste twee weken voor het begin van de tentoonstelling, keuring of wedvlucht zijn gevaccineerd
      tegen Newcastle Disease; of

      c. papegaaiachtigen voldoen aan de voorschriften, bedoeld in artikel 59, tweede lid, onderdelen b tot en met d, van
      verordening (EU) nr. 2020/688.

      2 De vogels, bedoeld in het eerste lid, onderdelen a en b, gaan vergezeld van een verklaring van de vaccinatie
      overeenkomstig [bijlage 13][ref2] voor zover het postduiven betreft of [bijlage 14][ref3] voor zover het andere in
      gevangenschap levende vogels betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel4.18
      [ref2]: https://wetten.overheid.nl/BWBR0035248
      [ref3]: https://wetten.overheid.nl/BWBR0035248
