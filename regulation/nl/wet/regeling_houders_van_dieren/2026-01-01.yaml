      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1] wordt ingediend bij de minister.

      2 Bij de aanvraag overlegt de aanvrager:

      a. de documenten, bedoeld in
      [artikel 13, eerste lid, onderdelen a tot en met c, van de Algemene wet erkenning EU-beroepskwalificaties][ref2],
      en

      b. indien de aanvraag en de documenten, bedoeld in
      [artikel 13, eerste lid, onderdelen b en c, van de Algemene wet erkenning EU-beroepskwalificaties][ref3] in een
      andere dan de Nederlandse, Duitse of Engelse taal zijn gesteld, een door een beëdigde tolk of vertaler opgestelde
      vertaling daarvan in één van deze talen.


