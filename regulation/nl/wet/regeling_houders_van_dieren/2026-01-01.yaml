      - id: ref1
        bwb_id: BWBR0030250
        artikel: '6.3'
  - number: '2.2'
    text: |-
      1 Een aanvraag voor aanwijzing van een diersoort of diercategorie als bedoeld in
      [artikel 2.2, eerste lid, van de wet][ref1] of [artikel 4.14, eerste lid, van het besluit][ref2], dan wel tot
      intrekking van een aanwijzing als bedoeld in die artikelen, wordt ingediend met gebruikmaking van een middel dat
      door de Minister beschikbaar is gesteld.

      2 Op de aanvraag wordt binnen een termijn van zes maanden beslist. De Minister kan de beslissing op de aanvraag
      voor ten hoogste drie maanden verdagen. Van de verdaging wordt voor de afloop van de eerste termijn mededeling
      gedaan aan de aanvrager, waarbij een termijn wordt genoemd waarbinnen beslist wordt.

      3 De artikelen [4:2][ref3], [4:3a][ref4], [4:5][ref5], [4:6][ref6] en
      [4:15 van de Algemene wet bestuursrecht][ref7] zijn van overeenkomstige toepassing op de aanvraag.

      4 Voor een aanvraag als bedoeld in het eerste lid is de aanvrager een retributie verschuldigd van € 500.


