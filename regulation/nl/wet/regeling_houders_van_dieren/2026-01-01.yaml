  - number: 7b.47
    text: |-
      1 De houder, bedoeld in deze paragraaf, laat de monsters onderzoeken in een laboratorium dat daarvoor op grond van
      [artikel 3 van de Regeling erkenning veterinaire laboratoria][ref1] is erkend.

      2 De monsters worden uiterlijk op de werkdag na de dag dat ze zijn genomen verzonden aan het laboratorium, bedoeld
      in het eerste lid.

      3 Bij aanlevering van de monsters worden in ieder geval de volgende gegevens aangeleverd:

      a. de volgende gegevens ter identificatie van de houder van de dieren en zijn inrichting:

      1°. naam;

      2°. adres;

      3°. het unieke registratienummer, bedoeld in artikel 93, slot, van verordening (EU) nr. 2016/429, het unieke
      erkenningsnummer, bedoeld in artikel 2, onderdeel 16, van verordening (EU) nr. 2019/2035, dan wel het unieke
      subregistratienummer, bedoeld in [artikel 5a.1, derde lid][ref2], van de Regeling houders van dieren;

      b. gegevens ter identificatie van degene die het monster heeft genomen en ter identificatie van de dieren die zijn
      bemonsterd;

      c. gegevens omtrent de monsters;

      d. de dagtekening;

      e. de naam en handtekening van de inzender van de monsters.


      [ref1]: https://wetten.overheid.nl/BWBR0045052#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035248#Artikel5a.1
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel7b.47
