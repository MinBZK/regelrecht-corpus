  - number: 5b.6
    text: |-
      1 Het is verboden runderen, varkens, schapen, geiten, paardachtigen, kameelachtigen en hertachtigen te
      identificeren met middelen waarvan het model voor de desbetreffende diersoort niet door de minister is goedgekeurd.

      2 Het is verboden papegaaiachtigen als bedoeld in artikel 76, eerste lid, onderdeel b, en honden, katten of fretten
      als bedoeld in artikel 70, van verordening (EU) nr. 2019/2035, te identificeren met een injecteerbare transponder
      waarvan het model voor de desbetreffende diersoort niet door de minister is goedgekeurd.

      3 Een aanvraag tot goedkeuring als bedoeld in het eerste of tweede lid wordt gedaan bij de minister.

      4 De minister keurt een model als bedoeld in het eerste lid of een model voor papegaaiachtigen als bedoeld in het
      tweede lid goed indien het:

      a. identificeren van de desbetreffende dieren met het desbetreffende middel is toegestaan op grond van verordening
      (EU) nr. 2019/2035 en deze regeling;

      b. voldoet aan de in [verordening (EU) nr. 2021/520](32420R2021) respectievelijk [verordening (EU) nr. 2021/963]
      (32863R2021) gestelde regels aan het desbetreffende identificatiemiddel; en

      c. voor zover van toepassing, voldoet aan de in de [artikelen 5b.18][ref1], [5b.24][ref2], [5b.25][ref3],
      [5b.26][ref4], [5b.31][ref5], [5b.32][ref6] en [5b.33][ref7] gestelde regels aan het desbetreffende
      identificatiemiddel.

      5 De minister keurt een model voor honden, katten of fretten als bedoeld in het tweede lid goed indien het model
      voldoet aan bijlage II bij verordening (EU) nr. 576/2013.

      6 De minister trekt een goedkeuring in, indien het model niet meer voldoet aan de in respectievelijk het vierde en
      vijfde lid gestelde eisen aan het desbetreffende identificatiemiddel.

      7 Het derde, vierde en vijfde lid zijn van overeenkomstige toepassing op wijzigingen van een goedgekeurd model.


