  - number: 7b.27
    text: |-
      1 Voor het onderzoek naar de aanwezigheid salmonella-serotypen als bedoeld in
      [artikel 2.76ic, tweede lid, van het besluit][ref1] zijn de soorten en categorieën pluimvee als bedoeld in dat
      artikel, de soorten pluimvee als bedoeld in bijlage II, deel 2, punt 2, onder 2.2, bij verordening (EU) nr.
      2019/2035 voor zover die dieren broedeieren produceren.

      2 De [artikelen 7b.23 tot en met 7b.26][ref2] zijn van overeenkomstige toepassing op een houder als bedoeld in
      [artikel 2.76ic, tweede lid, van het besluit][ref3].


