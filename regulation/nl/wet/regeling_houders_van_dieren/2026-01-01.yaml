    text: |-
      Artikel 97, eerste lid, van verordening (EU) nr. 2016/429 en artikel 5 van verordening (EU) nr. 2019/2035 zijn van
      overeenkomstige toepassing op een verzamelcentrum als bedoeld in [artikel 5c.3, eerste lid][ref1].


