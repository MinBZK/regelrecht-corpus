        artikel: 4a
  - number: '4.6'
    text: |-
      Als bevoegde dierenartsen als bedoeld in bijlage I, hoofdstuk III, onderdeel 1.2, onder b, van [verordening
      nr. 1/2005](32005R0001) worden aangewezen de dierenartsen die zijn verbonden aan de Nederlandse Voedsel- en
      Warenautoriteit van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      1 Een door de Divisie CCV van het Centraal Bureau Rijvaardigheidsbewijzen, bedoeld in
      [artikel 4z van de Wegenverkeerswet 1994][ref1], afgenomen examen wordt aangemerkt als een erkend examen als
      bedoeld in bijlage IV, onderdeel 1, van [verordening (EG) nr. 1/2005](32005R0001).

      2 De Divisie CCV van het Centraal Bureau Rijvaardigheidsbewijzen is belast met het afgeven van een getuigschrift
      van vakbekwaamheid als bedoeld in artikel 17, tweede lid, van [verordening (EG) nr. 1/2005](32005R0001).

      3 Bij de aanvrager van een getuigschrift van vakbekwaamheid als bedoeld in artikel 17, tweede lid, van verordening
      (EG) 1/2005 wordt een bedrag in rekening gebracht ter vergoeding van de kosten van de behandeling van die
      aanvraag, overeenkomstig de door de Divisie CCV van het Centraal Bureau Rijvaardigheidsbewijzen, bedoeld in
      [artikel 4z van de Wegenverkeerswet 1994][ref2], vastgestelde tarieven met betrekking tot dierenvervoer.


