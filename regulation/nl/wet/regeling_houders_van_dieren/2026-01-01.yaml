  - number: '7.2'
    text: |-
      1 Een houder die varkens afvoert van zijn inrichting dient een aanvraag als bedoeld in
      [artikel 2.27p, eerste lid, van het besluit][ref1] in via een elektronisch portaal dat op grond van
      [artikel 1.4, derde lid, Regeling handhaving en overige zaken Wet dieren][ref2] is aangewezen als elektronisch
      portaal voor de melding van de gegevens, bedoeld in de [artikelen 5b.59][ref3] en [5b.60][ref4].

      2 Indien de minister geen portaal heeft aangewezen, dient de houder de aanvraag, bedoeld in het eerste lid, in bij
      de minister met gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld.

      3 De varkenshouder die de aanvraag heeft gedaan bewaart de toestemming tot drie jaren na de datum waarop de varkens
      van de locatie waar zij werden gehouden, zijn afgevoerd.

      4 In geval van een uitbraak van een in artikel 3.1a [Regeling diergezondheid][ref5] aangewezen besmettelijke ziekte
      kan de minister de op dat moment gegeven toestemmingen intrekken.


