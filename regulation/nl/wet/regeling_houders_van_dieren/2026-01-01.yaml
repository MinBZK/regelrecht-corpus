  - number: '2.4'
    text: |-
      1 De aanvraag van een ontheffing van het verbod van [artikel 2.2, eerste lid, van de wet][ref1] wordt met
      gebruikmaking van het daarvoor bestemde aanvraagformulier ingediend en bevat ten minste het volgende:

      a. naam, adres, woonplaats, burgerservicenummer van de aanvrager dan wel het inschrijvingsnummer in het
      handelsregister als de aanvrager een onderneming is, en het adres van de plaats waar de dieren gehouden worden als
      dat niet het woonadres van de aanvrager is;

      b. de redenen waarom de ontheffing wordt gevraagd;

      c. de omschrijving van het belang dat de aanvrager heeft bij de ontheffing;

      d. de soort en het aantal dieren waarvoor ontheffing wordt gevraagd;

      e. een omschrijving van de beschikbare huisvesting en houderijomstandigheden, waarbij wordt aangeduid op welke
      wijze, gelet op de bekende eigenschappen van de soort, schade aan gezondheid en welzijn van het dier wordt
      voorkomen;

      f. de voorgenomen wijze van verzorging.

      2 De Minister beoordeelt de aanvraag aan de hand van de gegevens, bedoeld in het eerste lid onder b, c, d, e en f.

      3 Indien de onderdelen van de aanvraag, genoemd in het eerste lid, onderdeel a, b, c of d onjuist zijn of
      onvoldoende aanleiding geven tot het verlenen van een ontheffing, worden de onderdelen e en f van het eerste lid
      niet beoordeeld.

      4 Voor een aanvraag als bedoeld in het eerste lid is de aanvrager een retributie verschuldigd van € 100.

      5 In afwijking van het vierde lid is geen retributie verschuldigd indien ten behoeve van het
      houden van de dieren van de desbetreffende soort of categorie tevens een aanvraag als bedoeld in
      [artikel 14.43, tweede lid, van de Omgevingsregeling][ref2], is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0045528#Artikel14.43
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel2.4
