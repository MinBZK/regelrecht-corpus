  - number: 7b.1
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder:

      *bruto oppervlakte van de stal:* binnenmaatse oppervlakte van de stal, voor zover het betreft het gedeelte van de
      stal, bestemd voor het houden van vleeskuikens;

      *stal:* ruimte met een omsloten luchtvolume die is bestemd om er uitsluitend één koppel in te houden.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel7b.1
  - number: 7b.2
    text: |-
      1 De kennisgeving, bedoeld in [artikel 2.55, eerste lid, van het besluit][ref1], en de kennisgeving, bedoeld in
      [artikel 2.59, eerste lid, van het besluit][ref2], geschiedt aan de minister.

      2 Voor de kennisgeving, bedoeld in het eerste lid, wordt gebruikt gemaakt van een door de minister ter beschikking
      gesteld middel.

      3 De kennisgeving gaat per stal vergezeld van de volgende gegevens:

      a. het unieke subregistratienummer, bedoeld in [artikel 5a.1, derde lid][ref3];

      b. het relatienummer van de houder;

      c. het stalnummer dat is bevestigd aan de buitenkant van de stal;

      d. de adresgegevens van de stal;

      e. de bruto oppervlakte van de stal in vierkante meters;

      f. het bouwjaar van de stal en, indien van toepassing, het jaar waarin een grondige verbouwing met directe gevolgen
      voor het dierenwelzijn heeft plaatsgevonden.

      4 De houder kan verstrekking van gegevens als bedoeld in het derde lid achterwege
      laten, voor zover deze gegevens zijn gemeld via een elektronisch portaal dat ingevolge
      [artikel 1.4, derde lid, Regeling handhaving en overige zaken Wet dieren][ref4] is aangewezen als elektronisch
      portaal door middel waarvan de registratie, bedoeld in [artikel 5b.66][ref5] plaatsvindt.


