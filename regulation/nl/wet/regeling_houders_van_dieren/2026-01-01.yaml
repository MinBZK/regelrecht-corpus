      [1.61][ref35], [2.76ib, tweede lid][ref36], [2.76ic][ref37],[2.76id, eerste en tweede lid][ref38], [2.76ie][ref39],
      [3.24, derde en vierde lid][ref40], [4.16][ref41] en [4.18, derde lid, van het Besluit houders van dieren][ref42].


