  - number: 7b.8
    text: |-
      1 Ten behoeve van het bepalen van de bezettingsdichtheid draagt de houder, bedoeld in de [artikelen 7b.2][ref1] en
      [7b.3][ref2], er zorg voor dat per koppel de volgende gegevens worden verstrekt aan de minister:

      a. het aantal binnengebrachte vleeskuikens, bedoeld in
      [artikel 2.52, eerste lid, onderdeel a, van het besluit][ref3];

      b. de datum waarop de vleeskuikens die uit de stal zijn verwijderd met het oogmerk om te worden geslacht, in de
      stal zijn geplaatst;

      c. het aantal vleeskuikens dat uit de stal is verwijderd met het oogmerk om te worden geslacht;

      d. het levend gewicht van de vleeskuikens, bedoeld in onderdeel c, op het tijdstip onmiddellijk voorafgaand aan het
      tijdstip waarop zij worden geslacht;

      e. de datum waarop de vleeskuikens, bedoeld in onderdeel c, zijn geslacht;

      f. het resterende aantal vleeskuikens, bedoeld in [artikel 2.52, eerste lid, onderdeel e, van het besluit][ref4].

      2 De gegevens, bedoeld in het eerste lid, worden verstrekt binnen 30 dagen nadat de laatste vleeskuikens van het
      betreffende koppel uit de stal zijn verwijderd met het oogmerk om te worden geslacht.

      3 De houder bewaart de gegevens, bedoeld in het eerste lid, gedurende drie jaren na de datum van de verstrekking
      bij de gegevens die op grond van [artikel 2.52 van het besluit][ref5] worden geregistreerd.

      4 [Artikel 7b.2, tweede en vierde lid][ref6], is van overeenkomstige toepassing.


