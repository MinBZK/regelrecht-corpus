      1 In afwijking van [artikel 1.42 van het besluit][ref1] is het toegestaan om runderen afkomstig van een inrichting
      in Nederland, en die bestemd zijn voor een inrichting in Nederland ten hoogste één keer te verzamelen op een
      verzamelcentrum als bedoeld in [artikel 5c.3, eerste lid][ref2].

      2 In afwijking van [artikel 1.42 van het besluit][ref3] is het toegestaan om runderen jonger dan 12 weken afkomstig
      van een inrichting in Nederland, die bestemd zijn voor een inrichting in Nederland ten hoogste twee keer te
      verzamelen op een verzamelcentrum als bedoeld in [artikel 5c.3, eerste lid][ref4].

      3 Ingeval runderen als bedoeld in het tweede lid, twee keer worden verzameld op een verzamelcentrum als bedoeld in
      [artikel 5c.3, eerste lid][ref5], verstrekken de exploitanten van het eerste en het tweede verzamelcentrum, bedoeld
      in het tweede lid, in afwijking van [artikel 5b.49, tweede lid][ref6], onmiddellijk na respectievelijk voor iedere
      aan- en afvoer van runderen de gegevens, bedoeld in artikel 42 van verordening (EU) nr. 2019/2035, aan de minister.


