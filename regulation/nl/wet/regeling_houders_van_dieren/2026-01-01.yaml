  - number: '9.5'
    text: |-
      1 Een noodsysteem als bedoeld in [artikel 2.5, vijfde lid, van het besluit][ref1], bevat een noodstroomaggregaat
      dat:

      a. na alarmering door het alarmsysteem:

      1° direct in werking treedt in het geval van automatische doorkoppeling; of

      2° onverwijld in werking treedt in het geval van handmatige doorkoppeling, waarbij op geen enkel moment risico’s
      ontstaan voor de gezondheid of het welzijn van de dieren;

      b. direct kan worden aangesloten op een externe aanvoering, voor zover het een handmatig aan te sluiten
      noodstroomaggregaat betreft.

      2 Het noodsysteem wordt maandelijks onbelast getest.

      3 Het noodsysteem wordt ten minste één keer per jaar belast getest.

      4 Direct na het testen worden geregistreerd:

      a. de datum en het tijdstip van testen;

      b. eventuele onregelmatigheden of defecten die zijn geconstateerd; en

      c. uitgevoerde herstelacties.

      5 De registraties, bedoeld in het vierde lid, worden ten minste dertien maanden bewaard.

      6 Het noodstroomaggregaat is in een ruimte opgesteld waar tevens aanwezig is:

      a. een handleiding over de bediening en de aansluiting van het noodstroomaggregaat; en

      b. voldoende brandstof om het noodstroomaggregaat zes uur te kunnen laten draaien.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2.5'
  - number: '9.6'
    text: |-
      1 Een alarmsysteem, bedoeld in [artikel 2.5, zesde lid, van het besluit][ref1]:

      a. heeft ten minste twee parallelle verbindingen om de houder van dieren direct te alarmeren;

      b. functioneert onafhankelijk van netspanning; en

      c. maakt gebruik van een bewaakte verbinding.

      2 Het alarmsysteem wordt maandelijks getest.

      3 Direct na het testen worden geregistreerd:

      a. de datum en het tijdstip van testen;

      b. eventuele onregelmatigheden of defecten die zijn geconstateerd; en

      c. uitgevoerde herstelacties.

      4 De registraties, bedoeld in het derde lid, worden ten minste dertien maanden bewaard.

      5 De houder van dieren zorgt ervoor dat op het bedrijf een actueel alarmplan aanwezig is waarin een beschrijving is
      opgenomen van:

      a. de methode van testen van de verschillende onderdelen van het systeem;

      b. de benodigde hoeveelheid brandstof om het noodstroomaggregaat zes uur te laten draaien;

      c. de wijze van alarmering;

      d. de namen en telefoonnummers van de alarmopvolgers en de volgorde waarin met hen contact wordt opgenomen;

      e. de te treffen handelingen op het moment dat een alarm afgaat; en

      f. de contactgegevens van een elektrotechnische storingsdienst.

      6 De houder van dieren:

      a. informeert de alarmopvolgers over de wijze waarop en plek waar het alarmplan wordt bewaard; en

      b. draagt er zorg voor dat de alarmopvolgers te allen tijde toegang hebben tot het alarmplan.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '2.5'
  - number: '9.7'
    text: |-
      Met een alarmsysteem als bedoeld in [artikel 9.6][ref1] worden gelijkgesteld alarmsystemen die rechtmatig zijn
      vervaardigd of in de handel zijn gebracht in een andere lidstaat van de Europese Unie of in een staat, niet zijnde
      een lidstaat van de Europese Unie, die partij is bij een tot een douane-unie strekkend Verdrag, dan wel rechtmatig
      zijn vervaardigd in een staat die partij is bij een tot een vrijhandelszone strekkend Verdrag dat Nederland bindt,
      en die voldoen aan eisen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met
      de nationale eisen wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel9.6
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel9.7
