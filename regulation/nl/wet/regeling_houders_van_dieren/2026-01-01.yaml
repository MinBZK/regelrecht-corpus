  - number: 5b.31
    text: |-
      1 In aanvulling op artikel 9, eerste lid, van verordening (EU) nr. 2021/520, wordt een model van een conventioneel
      oormerk voor varkens, en wijzigingen daarvan, uitsluitend goedgekeurd indien het voldoet aan de volgende vereisten:

      a. het is vervaardigd van thermoplastisch kunststof;

      b. op het merkdeel van het oormerk dat na aanbrengen van het merk direct zichtbaar is, staan uitsluitend vermeld:

      1°. de letters ‘NL’, gevolgd door het unieke registratienummer van de inrichting waar het varken geboren is, dat
      een minimumhoogte van 7 millimeter en maximumhoogte van 10 millimeter heeft; en

      2°. de aanduiding ‘I&R’ of het logo, bedoeld in bijlage 6;

      c. het merkdeel waarop de gegevens, bedoeld in onderdeel b, staan, heeft een gele kleur;

      d. de informatie op het merk is in zwart schrift aangebracht;

      e. wanneer het een ronde vorm heeft, heeft het een diameter van maximaal 30 millimeter, en wanneer het een
      andere dan ronde vorm heeft, bedraagt de afstand vanaf het hart van de bevestiging tot de buitenrand maximaal 25
      millimeter.

      2 In aanvulling op het eerste lid, onderdeel b, kan op het merkdeel van het oormerk een individueel volgnummer van
      het betreffende dier worden opgenomen.

      3 In afwijking van artikel 52, eerste lid, onderdeel a, van verordening (EU) nr. 2019/2035 is het niet toegestaan
      om op het oormerk het unieke registratienummer van de laatste inrichting van de toeleveringsketen te vermelden.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.31
  - number: 5b.32
    text: |-
      1 In aanvulling op artikel 9, derde lid en artikel 11, eerste lid, van verordening (EU) nr. 2021/520, wordt een
      model van een elektronisch oormerk voor varkens, en wijzigingen daarvan, uitsluitend goedgekeurd indien het voldoet
      aan [artikel 5b.31, eerste lid, onderdelen a tot en met e][ref1].

      2 In aanvulling op het eerste lid, kan op het merkdeel van het oormerk, bedoeld in
      [artikel 5b.31, eerste lid onderdeel b][ref2], een individueel volgnummer van het betreffende dier worden
      opgenomen.

      3 In afwijking van artikel 52, eerste lid, onderdeel a, van verordening (EU) nr. 2019/2035 is het niet toegestaan
      om op het oormerk het unieke registratienummer van de laatste inrichting van de toeleveringsketen te vermelden.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.31
      [ref2]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.31
