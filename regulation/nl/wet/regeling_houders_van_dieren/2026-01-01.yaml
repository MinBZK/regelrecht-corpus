preamble:
  text: |-
    Gelet op richtlijn nr. 2007/43/EG van de Raad van de Europese Unie van 28 juni 2007 tot vaststelling van
    minimumvoorschriften voor de bescherming van vleeskuikens (PbEU L 182), verordening (EG) nr. 178/2002 van het
    Europees Parlement en de Raad van 28 januari 2002, tot vaststelling van de algemene beginselen en voorschriften van
    de levensmiddelenwetgeving, tot oprichting van een Europese Autoriteit voor voedselveiligheid en tot vaststelling
    van procedures voor voedselveiligheidsaangelegenheden, voor houders van productiedieren die gehouden worden voor
    de voedselproductie (PbEG 2002 L 31), verordening (EG) nr. 1/2005 van de Raad van de Europese Unie van 22 december
    2004 inzake de bescherming van dieren tijdens het vervoer en daarmee samenhangende activiteiten en tot wijziging
    van de Richtlijnen 64/432/EEG en 93/119/EG en Verordening (EG) nr. 1255/97 (PbEU 2005 L 3), verordening (EG) nr.
    1099/2009: verordening (EG) Nr. 1099/2009 van de Raad van 24 september 2009 inzake de bescherming van dieren bij
    het doden (PbEU 2009 L 303), de artikelen 2.1, vierde lid, 2.5, eerste lid, 6.2, eerste lid, 6.3, tweede lid, 6.4,
    7.1, 7.6, eerste en tweede lid, 10.1, derde lid, en 10.4 van de Wet dieren en de artikelen 1.22, tweede lid, 1.25,
    2.52, derde lid, 2.54, vijfde lid, 2.55, derde lid, 2.63, eerste lid, 2.65, tweede lid, 2.69, tweede lid, 5.2, 6.2
    en6.3 van het Besluit houders van dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *beer:* geslachtsrijp varken van het mannelijk geslacht, bestemd voor de fokkerij;
        - *besluit:* [Besluit houders van dieren][ref1];
        - *dierennummer:* nummer als bedoeld in artikel 2, onderdeel 35, van verordening (EU) nr. 2019/2035;
        - *eendagskuiken:* kip die nog geen 72 uur oud is;
        - *exploitant:* exploitant als bedoeld in artikel 4, onderdeel 24, van verordening (EU) nr. 2016/429;
        - *fret:* dier als bedoeld in artikel 2, onderdeel 3, van [verordening (EU) nr. 2019/2035](32035R2019);
        - *geautomatiseerd gegevensbestand:* bestand als bedoeld in artikel 109, eerste lid, van verordening (EU) nr.
      2016/429;
        - *gelt:* geslachtsrijp varken van het vrouwelijk geslacht dat nog niet heeft geworpen, bestemd voor de fokkerij;
        - *hond:* dier als bedoeld in artikel 2, onderdeel 1, van verordening (EU) nr. 2019/2035;
        - *identificatiecode:* code als bedoeld in artikel 2, onderdeel 18, van verordening (EU) nr. 2019/2035;
        - *kat:* dier als bedoeld in artikel 2, onderdeel 2, van verordening (EU) nr. 2019/2035;
        - *koppel:* als bedoeld in artikel 2, onderdeel 37, van verordening (EU) nr. 2019/2035;
        - *landdieren:* dieren als bedoeld in artikel 4, onderdeel 2, van verordening (EU) nr. 2016/429;
        - *leghen:* kip bestemd voor de productie van consumptie-eieren;
        - *minister:* Minister van Landbouw, Visserij, Voedselzekerheid en Natuur;
        - *NVWA:* Nederlandse Voedsel- en Warenautoriteit;
        - *registratienummer van de houder:* nummer dat de houder heeft verkregen bij de registratie, bedoeld in
      [artikel 3.29, eerste lid, van het besluit][ref2] of bij een andere registratie als bedoeld in artikel 3.29, tweede
      lid, van het besluit;
        - *reizend circus:* circus als bedoeld in artikel 2, onderdeel 34, van verordening (EU) nr. 2019/2035;
        - *relatienummer:* uniek nummer dat door de minister is toegekend aan een exploitant van een inrichting waar dieren
      worden gehouden;
        - *richtlijn 2007/43/EG:* [richtlijn 2007/43/EG](32007L0043) van de Raad van 28 juni 2007 tot vaststelling van
      minimumvoorschriften voor de bescherming van vleeskuikens (PbEU 2007, L 182);
        - *slachtvarken:* varken dat bestemd is om te worden geleid naar een slachthuis, dan wel naar een verzamelcentrum
      vanwaar het varken nog uitsluitend naar een slachthuis mag worden gebracht.
        - *spenen:* het blijvend onttrekken van biggen aan een zogende zeug.
        - *vermeerderingsdier:* pluimvee bestemd voor de productie van broedeieren;
        - *verordening (EG) nr. 1/2005:* [verordening (EG) nr. 1/2005](32005R0001): [verordening (EG) nr. 1/2005]
      (32005R0001) van de Raad van de Europese Unie van 22 december 2004 inzake de bescherming van dieren tijdens het
      vervoer en daarmee samenhangende activiteiten en tot wijziging van de [Richtlijnen 64/432/EEG](31964L0432) en
      [93/119/EG](31993L0119) en [Verordening (EG) nr. 1255/97](31997R1255) (PbEU 2005, L 3);
        - *verordening (EG) nr. 617/2008:* verordening (EG) nr. 617/2008 van de Commissie van 27 juni 2008 houdende
      bepalingen ter uitvoering van Verordening (EG) nr. 1234/2007 van de Raad, wat betreft de handelsnormen voor
      broedeieren en kuikens van pluimvee (PbEU 2008, L 168);
        - *verordening (EG) nr. 1255/97:* [Verordening (EG) nr. 1255/97](31997R1255) van de Raad van 25 juni 1997
      betreffende de communautaire criteria voor controlepost(en) en tot aanpassing van het in [Richtlijn 91/628/EEG]
      (31991L0628) bedoelde reisschema (PbEG 1997, L 174);
        - *verordening (EU) nr. 999/2001:* [verordening (EG) nr. 999/2001](32001R0999) van het Europees Parlement en
      de Raad van 22 mei 2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van
      bepaalde overdraagbare spongiforme encefalopathieën (PbEU 2001, L147);
        - *verordening (EU) nr. 1308/2013:* verordening (EU) nr. 1308/2013 van het Europees Parlement en de Raad van
      17 december 2013 tot vaststelling van een gemeenschappelijke ordening van de markten voor landbouwproducten en tot
      intrekking van de Verordeningen (EEG) nr. 922/72, (EEG) nr. 234/79, (EG) nr. 1037/2001 en (EG) nr. 1234/2007 van de
      Raad (PbEU 2013, L 347);
        - *verordening (EU) nr. 2016/429:* verordening (EU) nr. 2016/429 van het Europees Parlement en de Raad van 9 maart
      2016 betreffende overdraagbare dierziekten en tot wijziging en intrekking van bepaalde handelingen op het gebied
      van diergezondheid (diergezondheidsverordening) (PbEU 2016, L 84);
        - *verordening (EU) 2016/1012:* verordening (EU) 2016/1012 van het Europees Parlement en de Raad van 8 juni 2016
      betreffende de zoötechnische en genealogische voorwaarden voor het fokken van, de handel in en de binnenkomst in
      de Unie van raszuivere fokdieren, hybride fokvarkens en levende producten daarvan en tot wijziging van Verordening
      (EU) nr. 652/2014, de [Richtlijnen 89/608/EEG](31989L0608) en [90/425/EEG](31990L0425) van de Raad en tot
      intrekking van bepaalde handelingen op het gebied van dierfokkerij (‘Fokkerijverordening’) (PbEU 2016, L 171);
        - *verordening (EU) 2017/1940:* gedelegeerde verordening (EU) 2017/1940 van de Commissie van 13 juli 2017 tot
      aanvulling van verordening (EU) 2016/1012 van het Europees Parlement en de Raad wat betreft de inhoud en vorm
      van zoötechnische certificaten die worden afgegeven voor raszuivere fokpaarden en –ezels, vervat in een uniek,
      levenslang geldig identificatiedocument voor paardachtigen (PbEU 2017, L 275);
        - *verordening (EU) nr. 2019/2035:* verordening (EU) 2019/2035 van de Commissie van 28 juni 2019 tot aanvulling
      van Verordening (EU) 2016/429 van het Europees Parlement en de Raad wat betreft regels voor inrichtingen waar
      landdieren worden gehouden en broederijen, alsmede voor de traceerbaarheid van bepaalde gehouden landdieren en
      broedeieren (PbEU 2019, L 314);
        - *verordening (EU) nr. 2020/688:* verordening (EU) 2020/688 van de Commissie van 17 december 2019 tot aanvulling
      van Verordening (EU) 2016/429 van het Europees Parlement en de Raad wat betreft de diergezondheidsvoorschriften
      voor verplaatsing binnen de Unie van landdieren en broedeieren;
        - *verordening (EU) nr. 2021/520:* verordening (EU) 2021/520 van de Commissie van 24 maart 2021 tot vaststelling
      van uitvoeringsbepalingen voor Verordening (EU) 2016/429 van het Europees Parlement en de Raad wat betreft de
      traceerbaarheid van bepaalde gehouden landdieren (PbEU 2021, L 104);
        - *verordening (EU) nr. 2021/963:* uitvoerings[verordening (EU) 2021/963](32863R2021) van de Commissie van
      10 juni 2021 tot vaststelling van bepalingen ter uitvoering van de [Verordeningen (EU) 2016/429](32329R2016),
      [(EU) 2016/1012](32912R2016) en [(EU) 2019/6](31906R2019) van het Europees Parlement en de Raad wat betreft de
      identificatie en registratie van paardachtigen en tot vaststelling van modelidentificatiedocumenten voor die dieren
      (PbEU 2021, L 213);
        - *verordening (EU) nr. 2021/2037:* [uitvoeringsverordening (EU) 2021/2037](32037R2021) van de Commissie van
      22 november 2021 betreffende uitvoeringsbepalingen voor [Verordening (EU) 2016/429](32329R2016) van het Europees
      parlement en de Raad wat vrijstellingen van de verplichtingen inzake de registratie van aquacultuurinrichtingen en
      de documentatie van exploitanten betreft (PbEU 2021 L 416);
        - *vervoerseenheid:* voertuig dat of aanhangwagen, oplegger of container die deel uitmaakt of kan uitmaken van
      een vervoermiddel;
        - *vleeseend:* eend van 72 uur en ouder die wordt opgefokt of wordt gehouden voor de productie van vlees;
        - *vleeskalkoen:* kalkoen van 72 uur en ouder die wordt opgefokt of wordt gehouden voor de productie van vlees;
        - *vleeskuiken:* kip van 72 uur en ouder die wordt opgefokt of wordt gehouden voor de productie van vlees.

      2 Onder inrichting wordt in de [hoofdstukken 3a][ref3], [4, paragraaf 2][ref4], [5a][ref5], [5b][ref6], [5c][ref7],
      [6][ref8], [7][ref9], en [8a][ref10] verstaan: een inrichting als bedoeld in artikel 4, onderdeel 27, van
      verordening (EU) nr. 2016/429.

      3 Deze regeling berust mede op [artikel 5.10, eerste lid, onder a, en tweede lid, onder d][ref11], in samenhang
      met [artikel 5.1, eerste en derde lid][ref12], en [artikel 7.2, tweede lid, onderdeel e, van de Wet dieren][ref13]
      en de [artikelen 1.37, tweede lid][ref14], [1.39][ref15], [1.40][ref16], [1.41][ref17], [1.48][ref18],
