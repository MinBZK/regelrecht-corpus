        paragraaf: 7b.3
  - number: 7b.31
    text: |-
      In aanvulling op [artikel 7b.29][ref1] laat de exploitant, bedoeld in
      [artikel 2.76id, eerste lid, van het besluit][ref2], van ten minste 30 dieren per stal bloedmonsters nemen van
      vermeerderingsdieren van de soort kip of kalkoen of kippen of kalkoenen die worden opgefokt tot vermeerderingsdier
      op de volgende momenten:

      a. 70 dagen na het uitkomen, tenzij het koppel sinds het uitkomen met tussenpozen van ten hoogste zes weken door
      een dierenarts is gevaccineerd met een levende entstof en die vaccinaties door middel van een spray of aërosol
      zijn uitgevoerd;

      b. binnen zes weken nadat de vaccinatie, bedoeld in [2.76id, eerste lid, van het besluit][ref3], is uitgevoerd;

      c. in de periode van 40 tot 48 weken na het uitkomen, voor zover het dieren, anders dan kalkoenen betreft;

      d. in de periode van 50 tot 58 weken na het uitkomen, voor zover het kalkoenen betreft;

      e. in de periode van 70 tot 75 weken na het uitkomen;

      f. binnen 20 dagen voorafgaand aan een verplaatsing van een koppel naar een ander bedrijf waar dieren als bedoeld
      in [artikel 2.76id, eerste lid, van het besluit][ref4] worden gehouden, voor zover het koppel op de dag van
      verplaatsing 28 dagen of ouder is.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel7b.29
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2.76id
      [ref3]: https://wetten.overheid.nl/BWBR0035217#Artikel2.76id
