      1 Het is de exploitant die varkens houdt, in afwijking van artikel 52, tweede lid, onderdeel b, van
      verordening (EU) nr. 2019/2035, toegestaan om bij een varken dat één identificatiemiddel heeft verloren, een
      identificatiemiddel aan te brengen met hetzelfde unieke registratienummer als het verloren identificatiemiddel,
      overeenkomstig artikel 19, tweede lid, onderdeel c, van verordening (EU) nr. 2021/520.

      2 [Artikel 5b.14][ref1] is van toepassing op de handelingen, genoemd in het eerste lid.


