  - number: 5b.57
    text: |-
      De gegevens, in deze paragraaf, worden doorgegeven met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.57
  - number: 5b.58
    text: |-
      1 De exploitant kan de gegevens die op grond van deze paragraaf zijn doorgegeven, herstellen of intrekken.

      2 Het verzoek tot herstel of intrekking van gegevens, geschiedt met gebruikmaking van een middel dat daartoe door
      de minister beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.58
  - number: 5b.59
    text: |-
      In aanvulling op artikel 3, eerste lid, van verordening (EU) nr. 2021/520, geven exploitanten die varkens houden de
      volgende gegevens door aan het geautomatiseerde gegevensbestand:

      a. de gegevens, bedoeld in artikel 56, onderdeel a van verordening (EU) nr. 2019/2035;

      b. het kenteken van elke vervoerseenheid;

      c. het aantal varkens per soort;

      d. indien de varkens van buiten Nederland worden aangevoerd, of buiten Nederland worden afgevoerd, het land van
      herkomst of het land van bestemming en het nummer van het gezondheidscertificaat; en

      e. hun relatienummer.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.59
  - number: 5b.60
    text: |-
      In aanvulling op artikel 3, eerste lid, van verordening (EU) nr. 2021/520, geven exploitanten die varkens houden,
      ingeval van afvoer van dode varkens, de volgende gegevens door aan het geautomatiseerde gegevensbestand:

      a. het aantal per soort varkens;

      b. de datum; en

      c. hun relatienummer.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.60
  - number: 5b.61
    text: |-
      1 De termijn, bedoeld in artikel 3, eerste lid, van verordening (EU) nr. 2021/520, bedraagt voor een exploitant
      die varkens houdt, twee werkdagen, te rekenen vanaf de dag na de dag waarop de desbetreffende gebeurtenis heeft
      plaatsgevonden.

      2 De termijn waarbinnen de gegevens, bedoeld in de [artikelen 5b.59][ref1] en [5b.60][ref2], worden doorgegeven,
      bedraagt twee werkdagen, te rekenen vanaf de dag na de dag waarop de desbetreffende gebeurtenis heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.59
      [ref2]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.60
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.61
