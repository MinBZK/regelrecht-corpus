  - number: 7b.28
    text: |-
      1 Als soorten en categorieën pluimvee, bedoeld in [artikel 2.76id, eerste lid, van het besluit][ref1] worden
      aangewezen:

      a. vermeerderingsdieren van de soort kip of kalkoen of kippen of kalkoenen die worden opgefokt als
      vermeerderingsdier

      b. leghennen of dieren die worden opgefokt tot leghen;

      c. vleeskuikens;

      d. vleeskalkoenen.

      2 De vaccinatie, bedoeld in [artikel 2.76id, eerste lid, van het besluit][ref2], vindt plaats uiterlijk 18 dagen
      nadat de dieren, bedoeld in het eerste lid, zijn uitgekomen.

      3 Dieren als bedoeld in het eerste lid, die ouder zijn dan 18 dagen en die niet gevaccineerd zijn, omdat zij uit
      een ander land dan Nederland afkomstig zijn, worden onmiddellijk na plaatsing op het bedrijf gevaccineerd.

      4 Met een daartoe door de minister beschikbaar gesteld middel houdt de exploitant, bedoeld in
      [artikel 2.76id, eerste lid, van het besluit][ref3], onmiddellijk na de vaccinatie in ieder geval de volgende
      gegevens bij:

      a. gegevens ter identificatie van de houder van de dieren, de dierenarts die de dieren heeft gevaccineerd of
      hiertoe een diergeneesmiddel heeft afgeleverd en de dieren die gevaccineerd zijn;

      b. gegevens omtrent de aard van de vaccinatie;

      c. gegevens omtrent het vaccin;

      d. de dag waarop er is gevaccineerd; en

      e. de handtekening van de houder en de dierenarts.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2.76id
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel2.76id
      [ref3]: https://wetten.overheid.nl/BWBR0035217#Artikel2.76id
