  - number: 7b.34
    text: |-
      In aanvulling op [artikel 7b.28][ref1] laat de exploitant, bedoeld in
      [artikel 2.76id, eerste lid, van het besluit][ref2], van ten minste 30 dieren, waaronder ten minste 5 dieren per
      koppel bloedmonsters nemen van vleeskalkoenen op de volgende momenten:

      a. vanaf dertien weken na het uitkomen;

      b. binnen 20 dagen voorafgaand aan een verplaatsing van een koppel naar een ander bedrijf waar bedrijfsmatig vogels
      worden gehouden, voor zover het koppel op de dag van verplaatsing 28 dagen of ouder is en het onderzoek, bedoeld in
      onderdeel a, nog niet heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel7b.28
