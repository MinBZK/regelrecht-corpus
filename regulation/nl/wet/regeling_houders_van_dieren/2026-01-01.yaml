  - number: 8.6a
    text: |-
      Als bewijs van vakbekwaamheid als bedoeld in [artikel 3.11, eerste lid, van het besluit][ref1] wordt erkend:

      a. een certificaat als bedoeld in
      [artikel 1, tweede lid, onderdelen b en d, van de Regeling certificaten groen beroepsonderwijs][ref2] of
      een diploma dat mede dat certificaat omvat en dat voldoet aan de op grond van [artikelen 7.2.4][ref3] en
      [7.2.6 van de Wet educatie en beroepsonderwijs][ref4] vastgestelde kwalificaties en beroepsvereisten;

      b. een certificaat wettelijke beroepsvereisten gezelschapsdieren [Besluit houders van dieren][ref5] als
      bedoeld in artikel 1, onderdeel f, van de Regeling certificaten groen beroepsonderwijs, zoals deze regeling
      luidde op 31 augustus 2016, of een diploma dat mede dat certificaat omvat en dat voldoet aan de op grond van
      [artikelen 7.2.4][ref6] en [7.2.6 van de Wet educatie en beroepsonderwijs][ref7] vastgestelde kwalificaties en
      beroepsvereisten;

      c. ten aanzien van de diergroepen hond en kat, overige zoogdieren en vogels, de verleende graad Master op het
      gebied van de diergeneeskunde voor een opleiding in het wetenschappelijke onderwijs door een universiteit dan wel
      de Open Universiteit waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref8] betrekking heeft;

      d. ten aanzien van de diergroepen hond en kat, overige zoogdieren en vogels, het getuigschrift
      waaruit blijkt dat het afsluitend examen van de opleiding diergeneeskunde, bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref9], met goed gevolg is afgelegd.


