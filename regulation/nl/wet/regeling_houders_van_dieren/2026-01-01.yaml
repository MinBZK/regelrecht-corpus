  - number: 7b.38
    text: |-
      1 Indien uit het onderzoek, bedoeld in [artikel 7b.29, eerste lid][ref1], blijkt dat de betreffende waarde,
      genoemd in [bijlage 12][ref2], onderdeel 2, bij een koppel vleeskalkoenen niet wordt behaald, laat de exploitant de
      eerstvolgende twee koppels vleeskalkoenen die op het bedrijf worden gevaccineerd door een dierenarts vaccineren.

      2 Wanneer uit het onderzoek, bedoeld in [artikel 7b.29, eerste lid][ref3], blijkt dat de betreffende waarde,
      genoemd in [bijlage 12][ref4], onderdeel 2, bij een koppel vleeskalkoenen dat overeenkomstig het eerst lid
      gevaccineerd is, niet wordt behaald, laat de exploitant de eerstvolgende drie koppels vleeskalkoenen die op het
      bedrijf worden gevaccineerd door een dierenarts vaccineren.

      3 De exploitant stuurt uiterlijk twee weken na de vaccinatie een kopie van de gegevens,
      bedoeld in [artikel 7b.28, vierde lid][ref5], aan de instelling die op grond van
      [artikel 3.1 van het Besluit diergezondheid][ref6] is aangewezen voor de uitvoering van het monitoringsprogramma
      voor Newcastle disease.


