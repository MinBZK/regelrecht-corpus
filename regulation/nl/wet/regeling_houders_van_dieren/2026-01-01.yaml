      1 Het is verboden om dieren die zijn bestemd voor een in Nederland gelegen inrichting van een inrichting af te
      voeren of in de handel te brengen indien niet voldaan is aan:

      a. [artikel 5b.44, eerste lid, onderdeel a, b, c of d, of tweede lid][ref1];

      b. [artikel 5b.47, eerste lid, onderdeel b, tweede, derde of vierde lid][ref2];

      c. [artikel 5b.48, onderdeel, b, c of d][ref3];

      d. [artikel 5.52][ref4];

      e. [artikel 5b.54, eerste lid, onderdeel b of c, tweede, derde, vierde of vijfde lid][ref5];

      f. [artikel 5b.55][ref6], voor zover het het unieke registratienummer van de inrichting en het relatienummer van de
      exploitant betreft;

      g. [artikel 5b.59, onderdeel b, c, d of e][ref7];

      h. [artikel 5b.66][ref8].

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing ten aanzien van dieren die rechtstreeks van de
      inrichting worden afgevoerd naar een in Nederland gelegen slachthuis of vanaf de inrichting al dan niet via een
      verzamelcentrum rechtstreeks buiten Nederland worden gebracht.

      3 Het eerste lid, en artikel 124, tweede lid, onderdeel b, van verordening
      (EU) nr. 2016/429, zijn van overeenkomstige toepassing op dieren waarop
      [artikel 39a, eerste lid, van de Regeling identificatie en registratie van dieren][ref9], zoals dat luidde op 20
      april 2021, van toepassing was.


