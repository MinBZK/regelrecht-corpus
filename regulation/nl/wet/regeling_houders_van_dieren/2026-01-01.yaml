  - number: 7b.26
    text: |-
      Een houder bewaart de uitslag van het onderzoek, bedoeld in [artikel 7b.23][ref1], ten minste drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel7b.23
