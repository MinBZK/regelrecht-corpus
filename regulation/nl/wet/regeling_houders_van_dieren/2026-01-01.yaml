      1 De minister keurt een opleidingsprogramma als bedoeld in artikel 21, eerste lid, onderdeel c, van [verordening
      (EG) nr. 1099/2009](32009R1099) goed indien:

      a. het programma is opgesteld en wordt uitgevoerd door een instelling die schriftelijk aantoont dat zij beschikt
      over een stelsel van integrale kwaliteitszorg en kwaliteitsborging op grond waarvan zeker is gesteld dat het
      onderricht onafhankelijk, toereikend en doelmatig wordt gegeven door voldoende deskundig personeel op het gebied
      van dieren en dierenwelzijn;

      b. het opleidingsprogramma voorziet in voldoende theoretisch en praktisch onderricht voor het kunnen verrichten
      van activiteiten als bedoeld in artikel 7, tweede en derde lid, van [verordening (EG) nr. 1099/2009](32009R1099)
      en betreffende de onderwerpen in bijlage IV van die verordening voor alle betrokken diersoorten dan wel
      diercategorieën;

      c. het opleidingsprogramma, onverminderd het bepaalde in onderdeel b, voorziet in opleidingsmodules voor
      onderscheiden activiteiten als bedoeld in onderdeel b, of voor specifieke diersoorten of diercategorieën.

      2 Een kwaliteitssysteem dat is gecertificeerd op basis van NEN-EN-ISO 9001:2015 voldoet in ieder geval aan het
      vereiste, bedoeld in het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5.2
  - number: '5.3'
    text: |-
      1 Een examen als bedoeld in artikel 21, eerste lid, onderdeel b, van [verordening (EG) nr. 1099/2009](32009R1099)
      wordt afgenomen door een door de minister aangewezen instelling.

      2 Een aanwijzing als bedoeld in het eerste lid geschiedt uitsluitend indien de betreffende instelling:

      a. schriftelijk aantoont dat zij beschikt over een stelsel van integrale kwaliteitszorg en kwaliteitsborging op
      grond waarvan zeker is gesteld dat examens op onafhankelijke wijze worden afgenomen;

      b. beschikt over een reglement waarin onder meer is vastgelegd aan welke eisen dient te worden voldaan om een
      examen te mogen afleggen, wanneer examens worden afgenomen, de wijze waarop het resultaat wordt beoordeeld, wie
      gerechtigd is het examen bij te wonen en een regeling voor geschillen.

      3 Een kwaliteitssysteem dat is gecertificeerd op basis van NEN-EN-ISO/IEC 17024:2012 voldoet in elk geval aan het
      vereiste, bedoeld in het tweede lid, onderdeel a.

      4 Het reglement, bedoeld in het tweede lid, onderdeel b, behoeft de goedkeuring van de minister.

      5 De minister keurt het reglement, bedoeld in het tweede lid, onderdeel b, goed indien zeker is gesteld dat kennis
      en kunde voor het verrichten van activiteiten als bedoeld in artikel 7, tweede en derde lid, van [verordening (EG)
      nr. 1099/2009](32009R1099) en de onderwerpen in bijlage IV van die verordening, voldoende en door personen met de
      daartoe benodigde expertise wordt getoetst en indien het voldoet aan de overige eisen, bedoeld in het tweede lid,
      onderdeel b.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5.3
