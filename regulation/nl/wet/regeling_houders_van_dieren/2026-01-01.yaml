      1 Een houder van kippen die worden opgefokt tot leghen laat die dieren overeenkomstig [artikel 7b.46][ref1]
      bemonsteren:

      a. in de eerste 3 levensdagen; en

      b. 2 weken voor de overgang naar de legfase of verplaatsing naar een bedrijf waar ze als leghen worden gehouden.

      2 De houder, bedoeld in het eerste lid, laat de monsters onderzoeken op de aanwezigheid van Salmonella enteritidis
      of Salmonella typhimurium.


