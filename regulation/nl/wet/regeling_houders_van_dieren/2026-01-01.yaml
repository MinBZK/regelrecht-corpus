  - number: 5b.68c
    text: |-
      1 De registraties, bedoeld in [artikel 3.29, eerste lid, onderdelen a en b, van het besluit][ref1], vinden plaats
      uiterlijk:

      a. zeven weken na de geboorte van de hond; onderscheidenlijk

      b. twee weken na het in Nederland brengen van de hond.

      2 De registratie van de houder wordt in ieder geval gedaan voorafgaand aan het aanbrengen van de injecteerbare
      transponder bij de hond.

      3 Bij de registratie vermeldt de houder zijn naam, adres en burgerservicenummer.

      4 De registratie wordt gedaan met een middel dat daartoe door de minister ter beschikking is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3.29
