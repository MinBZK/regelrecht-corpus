  - number: '1.2'
    text: |-
      1 Onverminderd [artikel 6.3, tweede lid, van de wet][ref1] is de minister bevoegd uitvoering te geven aan een
      voorschrift van verordening (EG) nr. 1/2005, verordening (EG) nr. 1099/2009, verordening (EU) 2016/1012 en
      verordening (EG) nr. 617/2008, voor zover die verordening betrekking heeft op handelsnormen voor pluimveekuikens,
      waarin een tot de overheid behorend orgaan of een door de overheid aangesteld persoon de opdracht geeft, de keuze
      laat of als ontvanger van informatie aanwijst, indien die uitvoering niet bestaat uit het nemen van een besluit.

      2 Het eerste lid is niet van toepassing, indien in deze regeling anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel6.3
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel1.2
