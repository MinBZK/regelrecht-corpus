  - number: 5b.8
    text: |-
      1 Het is verboden zonder erkenning van de minister een identificatiemiddel, een slachtmerk of een gebruiksmerk
      te verstrekken aan een exploitant die dieren houdt die op grond van [verordening (EU) nr. 2019/2035](32035R2019)
      geïdentificeerd moeten worden.

      2 Het eerste lid is niet van toepassing op de verstrekking van:

      a. injecteerbare transponders;

      b. identificatiemiddelen voor papegaaiachtigen; en

      c. tatoeages.

      3 De minister verleent een erkenning als bedoeld in het eerste lid aan degene die de aanvraag tot goedkeuring van
      het model van het desbetreffende identificatiemiddel of merk heeft gedaan, wanneer hij het model goedkeurt, tenzij
      deze eerder onder toepassing van dit lid is erkend vanwege de goedkeuring van een ander model van respectievelijk
      een identificatiemiddel of merk voor dezelfde diersoort.

      4 De minister schorst een erkenning als bedoeld in het derde lid indien:

      a. de leverancier aan een exploitant als bedoeld in het eerste lid een identificatiemiddel of merk heeft geleverd
      waarvan het model niet is goedgekeurd voor de desbetreffende diersoort;

      b. de leverancier van identificatiemiddelen voor runderen, schapen, geiten, of kameelachtigen of hertachtigen niet
      voldoet aan [artikel 5b.10][ref1];

      c. de leverancier van identificatiemiddelen of merken voor varkens niet voldoet aan [artikel 5b.10][ref2] en
      [5b.11][ref3].

      5 De minister heft een schorsing als bedoeld in het vierde lid op indien desbetreffende leverancier ten genoegen
      van de minister heeft aangetoond dat hij overeenkomstig de bepalingen van deze regeling zal handelen.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.10
      [ref2]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.10
      [ref3]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.11
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.8
