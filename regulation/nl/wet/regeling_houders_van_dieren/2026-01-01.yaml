  - number: 7b.15
    text: |-
      1 In aanvulling op [artikel 7b.13, eerste lid][ref1], laat de houder van:

      a. vleeskuikens, parelhoenders, loopvogels en kwartels, jaarlijks een bloedmonster nemen van ten minste 30 dieren
      met een leeftijd van ten minste vier weken;

      b. vleeseenden of ganzen, jaarlijks een bloedmonster nemen van ten minste 40 dieren met een leeftijd van ten minste
      vier weken;

      c. vleeskalkoenen, bij elke ronde een bloedmonster nemen van ten minste 30 hanen met een leeftijd van 18 weken,
      of indien de houder geen andere vleeskalkoenen dan hennen houdt, laat hij een bloedmonster nemen van ten minste 30
      hennen met een leeftijd van ten minste 13 weken;

      d. vermeerderingsdieren, jaarlijks een bloedmonster nemen van ten minste 30 dieren met een leeftijd van ten minste
      45 weken;

      e. dieren die worden opgefokt tot vermeerderingsdier, per koppel een bloedmonster nemen van ten minste 30 dieren
      met een leeftijd van ten minste 15 weken;

      f. leghennen, jaarlijks een bloedmonster nemen van ten minste 30 dieren met een leeftijd van ten minste 45 weken;

      g. dieren die worden opgefokt tot leghen, per koppel een bloedmonster nemen van ten minste 30 dieren met een
      leeftijd van ten minste acht weken.

      2 Indien de dieren, bedoeld in het eerste lid, onderdelen a, b, c, d en f, gehouden worden in meerdere koppels,
      laat de houder naar evenredigheid van het aantal dieren dat in de koppels wordt gehouden, een bloedmonster nemen
      uit elk koppel waarbij ten minste 5 dieren per koppel worden bemonsterd.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel7b.13
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel7b.15
