  - number: 7c.5
    text: |-
      Een stamboekvereniging en een groep houders van schapen als bedoeld in [artikel 7c.1, eerste lid][ref1],
      rapporteren jaarlijks voor 1 februari aan de minister over:

      a. de resultaten van de genotyperingen, waarbij onderscheid wordt gemaakt tussen rammen en ooien, en tussen dieren
      die de leeftijd van 1 jaar nog niet hebben bereikt en dieren die 1 jaar of ouder zijn;

      b. de resultaten van de steekproeven, bedoeld in bijlage VII, hoofdstuk C, deel 4, punt 2, van [verordening (EG)
      nr. 999/2001](32001R0999);

      c. het aantal houders dat aan het fokprogramma deelneemt.


