  - number: 7b.40
    text: |-
      1 In paragraaf 7b.3.4 wordt verstaan onder:

      a. *verordening (EG) nr. 1190/2012:* verordening (EU) nr. 1190/2012 van de Commissie van 12 december 2012 tot
      vaststelling van een doelstelling van de Unie voor het terugdringen van Salmonella enteritidis en Salmonella
      typhimurium bij koppels kalkoenen, als vastgesteld in [Verordening (EG) nr. 2160/2003](32003R2160) van het Europees
      Parlement en de Raad (PbEU 2012, L 340);

      b. *verordening (EG) nr. 200/2012:* verordening (EU) nr. 200/2012 van de Commissie van 8 maart 2012 tot
      vaststelling van een doelstelling van de Unie voor het terugdringen van Salmonella enteritidis en Salmonella
      typhimurium bij koppels slachtkuikens, als vastgesteld in [Verordening (EG) nr. 2160/2003](32003R2160) van het
      Europees Parlement en de Raad (PbEU 2012, L 71);

      c. *verordening (EG) nr. 517/2011:* verordening (EU) nr. 517/2011 van de Commissie van 25 mei 2011 ter uitvoering
      van [Verordening (EG) nr. 2160/2003](32003R2160) van het Europees Parlement en de Raad wat betreft een doelstelling
      van de Unie voor het verminderen van de prevalentie van bepaalde serotypes van salmonella bij legkippen van Gallus
      gallus en tot wijziging van [Verordening (EG) nr. 2160/2003](32003R2160) en Verordening (EU) nr. 200/2010 van de
      Commissie (PbEU 2011, L 138);

      d. *verordening (EG) nr. 200/2010:* verordening (EU) nr. 200/2010 van de Commissie van 10 maart 2010 ter uitvoering
      van [Verordening (EG) nr. 2160/2003](32003R2160) van het Europees Parlement en de Raad wat betreft een doelstelling
      van de Unie voor het verminderen van de prevalentie van serotypen salmonella bij volwassen vermeerderingskoppels
      van Gallus gallus (PbEU 2010, L 61).

      2 In deze paragraaf wordt onder Salmonella typhimurium mede verstaan: monofasische Salmonella typhimurium met de
      antigene formule 1, 4, [5], 12:i:-.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel7b.40
  - number: 7b.41
    text: |-
      De bemonstering, bedoeld in:

      a. punt 2.1, onderdeel a, onder ii, tweede gedachtestreepje, van de bijlage bij verordening (EU) nr. 1190/2012,
      vindt plaats op het aldaar bedoelde bedrijf;

      b. punt 2.1.1 van de bijlage bij verordening (EU) nr. 200/2010, vindt ten minste driewekelijks plaats op het
      bedrijf, bedoeld in onderdeel b van dat punt.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel7b.41
  - number: 7b.42
    text: |-
      Deze paragraaf is niet van toepassing, indien de minister op het moment van bemonstering, bedoeld in deze
      paragraaf, monsters laat nemen voor het onderzoek op de aanwezigheid van de relevante serotypen salmonella.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel7b.42
  - number: 7b.43
    text: |-
      1 Een houder van kippen die worden opgefokt tot vermeerderingsdier laat die dieren overeenkomstig
      [artikel 7b.46][ref1] bemonsteren:

      a. in de eerste 3 levensdagen;

      b. op een leeftijd van 4 weken; en

      c. 2 weken voor de overgang naar de legfase of verplaatsing naar een bedrijf waar ze als vermeerderingsdier worden
      gehouden.

      2 De houder laat de monsters, bedoeld in het eerste lid, onderzoeken op de aanwezigheid van:

      a. Salmonella enteritidis;

      b. Salmonella typhimurium;

      c. Salmonella hadar;

      d. Salmonella infantis; en

      e. Salmonella virchow.

      3 De houder laat de monsters, bedoeld in het eerste lid, van kippen die worden opgefokt tot vermeerderingsdier voor
      de productie van vleeskuikens onderzoeken op de aanwezigheid van Salmonella java.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel7b.46
