  - number: 5b.43a
    text: |-
      1 Een injecteerbare transponder wordt bij een hond aangebracht uiterlijk:

      a. zeven weken na de geboorte van de hond; of

      b. twee weken nadat de hond is verkregen door een inrichting als bedoeld in [artikel 3.7 van het besluit][ref1],
      waarin gezelschapsdieren worden gehouden ten behoeve van opvang.

      2 Onverminderd het bepaalde in het eerste lid, wordt de injecteerbare transponder aangebracht voordat de hond aan
      een andere houder wordt overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3.7
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.43a
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3.7'
  - number: 5b.43b
    text: |-
      Bij een hond wordt een injecteerbare transponder onderhuids aan de linkerzijde van de hals of aan de dorsale zijde
      tussen de schouderbladen aangebracht.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.43b
  - number: 5b.44
    text: |-
      1 In aanvulling op artikel 3, eerste lid, van verordening (EU) nr. 2021/520, geven exploitanten die runderen houden
      bij de geboorte van een rund de volgende gegevens door aan het geautomatiseerde gegevensbestand:

      a. het geslacht van het rund;

      b. de haarkleur van het rund;

      c. de identificatiecode van de moeder;

      d. het relatienummer van de exploitant;

      e. de gegevens, bedoeld in artikel 42, onderdelen a, b en c, van verordening (EU) nr. 2019/2035.

      2 Wanneer de gegevens over de geboorte van een rund meer dan 80 werkdagen na de dag van geboorte worden
      doorgegeven, gaan de gegevens vergezeld van een schriftelijk verslag van het DNA-onderzoek op basis waarvan kan
      worden geconcludeerd dat de identificatiecode van de moeder van dat rund overeenstemt met de identificatiecode,
      bedoeld in het eerste lid, onder c.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.44
  - number: 5b.45
    text: |-
      In aanvulling op artikel 3, eerste lid, van verordening (EU) nr. 2021/520, geven exploitanten die runderen houden
      bij een geboorte van een kalf na een draagtijd door de moeder van minimaal zeven maanden, waarbij het kalf op het
      moment van geboorte niet levend is, of niet levensvatbaar is en sterft voordat bij het kalf een identificatiemiddel
      is aangebracht, de volgende gegevens door aan het geautomatiseerde gegevensbestand:

      a. de datum waarop de doodgeboorte heeft plaatsgevonden;

      b. de identificatiecode van de moeder;

      c. het relatienummer van de exploitant;

      d. het unieke registratienummer van de betrokken inrichting.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.45
  - number: 5b.46
    text: |-
      In aanvulling op artikel 3, eerste lid, van verordening (EU) nr. 2021/520, geven exploitanten die runderen houden
      bij sterfte, slacht of verlies van een rund de volgende gegevens door aan het geautomatiseerde gegevensbestand:

      a. de gegevens, bedoeld in artikel 42, aanhef, onderdeel e, van verordening (EU) nr. 2019/2035;

      b. de identificatiecode van het rund;

      c. het unieke registratienummer van de betrokken inrichting;

      d. het relatienummer van de exploitant.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.46
  - number: 5b.47
    text: |-
      1 In aanvulling op artikel 3, eerste lid, van verordening (EU) nr. 2021/520, geven exploitanten die runderen
      houden de volgende gegevens over verplaatsing van runderen naar en van de inrichting, door aan het geautomatiseerde
      gegevensbestand:

      a. de gegevens, bedoeld in artikel 42, onderdelen a en d, van verordening (EU) nr. 2019/2035);

      b. het relatienummer van de exploitant.

      2 Wanneer een rund afkomstig is uit een andere lidstaat en wordt verplaatst naar de inrichting van bestemming, niet
      zijnde een slachthuis, geeft de exploitant van die inrichting, in aanvulling op het eerste lid, tevens de volgende
      gegevens, door aan het geautomatiseerde gegevensbestand:

      a. de datum van geboorte van het rund;

      b. het geslacht van het rund;

      c. de haarkleur van het rund;

      d. de identificatiecode van de moeder van het rund, indien beschikbaar;

      e. het land van geboorte van het rund, indien beschikbaar;

      f. het land van herkomst van het rund;

      g. het nummer van het gezondheidscertificaat;

      3 Wanneer een rund afkomstig is uit een derde land en wordt verplaatst naar de inrichting van bestemming, geeft
      de exploitant van die inrichting, in aanvulling op het eerste lid, tevens de volgende gegevens, door aan het
      geautomatiseerde gegevensbestand:

      a. het geslacht van het rund;

      b. de haarkleur van het rund;

      c. de identificatiecode van de moeder van het rund, indien beschikbaar;

      d. het nummer van het gezondheidscertificaat;

      e. de oorspronkelijke identificatie door het derde land;

      f. het land van herkomst van het rund.

      4 Wanneer een rund afkomstig is uit een andere lidstaat en wordt verplaatst naar een inrichting voor het
      verzamelen, van waaruit het rund vervolgens binnen drie dagen na aanvoer wordt verplaatst naar een andere lidstaat,
      geeft de exploitant van die inrichting, in aanvulling op het eerste lid, tevens de volgende gegevens door aan het
      geautomatiseerde gegevensbestand:

      a. het nummer van het diergezondheidscertificaat;

      b. het land van herkomst en bestemming.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.47
  - number: 5b.48
    text: |-
      Exploitanten die runderen houden, geven, wanneer zij toepassing geven aan artikel 19, vierde lid, van [verordening
      (EU) nr. 2021/520](32420R2021) de volgende gegevens door aan het geautomatiseerde gegevensbestand:

      a. de oorspronkelijke en nieuwe identificatiecode van het rund;

      b. de datum van vervanging;

      c. het unieke registratienummer van de inrichting;

      d. hun relatienummer.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.48
  - number: 5b.49
    text: |-
      1 De termijn, bedoeld in artikel 3, eerste lid, van verordening (EU) nr. 2021/520, bedraagt voor een exploitant
      die runderen houdt, drie werkdagen, te rekenen vanaf de dag na de dag waarop de desbetreffende gebeurtenis, heeft
      plaatsgevonden.

      2 Een exploitant die runderen houdt, geeft de in de [artikelen 5b.44][ref1], [5b.45][ref2], [5b.46][ref3], en
      [5b.47][ref4] bedoelde gegevens door aan het geautomatiseerde gegevensbestand binnen drie werkdagen, te rekenen
      vanaf de dag na de dag waarop de desbetreffende gebeurtenis heeft plaatsgevonden.

      3 De geboorte van een rund wordt doorgegeven nadat het rund is geïdentificeerd, binnen de termijn, bedoeld in
      [artikel 5b.19][ref5] of ingeval artikel 5b.19, tweede lid, van toepassing is, na het aanbrengen van het eerste
      identificatiemiddel binnen de in artikel 5b.19, eerste lid, genoemde termijn.

      4 Het derde lid geldt niet voor runderen, bedoeld in [artikel 5b.20][ref6].

      5 Een exploitant die runderen houdt, geeft de in [artikel 5b.48][ref7] bedoelde gegevens door aan het
      geautomatiseerde gegevensbestand binnen drie werkdagen, te rekenen vanaf de dag na de dag waarop de desbetreffende
      gebeurtenis heeft plaatsgevonden of zoveel eerder als het rund wordt afgevoerd van de inrichting.


