      1 Een bedrijfsgezondheidsplan en een bedrijfsbehandelplan als bedoeld in
      [artikel 1.28, eerste lid, van het besluit][ref1], worden opgesteld wanneer een houder van dieren:

      a. 250 of meer hoenderachtigen, eenden of ganzen houdt ten behoeve van de productie van vlees, consumptie-eieren
      of broedeieren;

      b. 5 of meer runderen houdt ten behoeve van de productie van melk of vlees;

      c. 5 of meer kalveren houdt ten behoeve van de productie van vlees;

      d. 5 of meer varkens houdt ten behoeve van de productie van vlees;

      e. 250 of meer konijnen houdt ten behoeve van de fokkerij of de productie van vlees;

      f. 25 of meer geiten houdt ten behoeve van de fokkerij of de productie van melk of vlees.

      2 Een houder van dieren als bedoeld in het eerste lid, laat per diersoort één bedrijfsgezondheidsplan en één
      bedrijfsbehandelplan opstellen.

      3 In afwijking van het eerste lid laat een houder van eenden, ganzen of andere hoenderachtigen dan kippen of
      kalkoenen enkel een bedrijfsgezondheidsplan opstellen. Het tweede lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1.28
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel3.5
    references:
