  - number: 7b.46
    text: |-
      1 Bij de aanvoer van eendagskuikens als bedoeld in de [artikelen 7b.43, eerste lid, onderdeel a][ref1],
      [7b.44, eerste lid, onderdeel a][ref2], en [7b.45, eerste lid][ref3], worden per vrachtwagen of aanhanger 40
      mestmonsters genomen, waarbij de monsters verspreid over die vrachtwagen of aanhanger worden genomen uit de
      onderste kratten, containers of dozen.

      2 De houder van eendagskuikens, bedoeld in het eerste lid, voegt de monsters, bedoeld in het eerste lid, samen tot
      een verzamelmonster.

      3 De houder van kippen als bedoeld in de [artikel 7b.43, eerste lid, onderdelen b en c][ref4], neemt per koppel
      verspreid over de stal:

      a. 150 monsters van blindedarmmest, dan wel, voor zover dat niet of onvoldoende aanwezig is, mest van de cloaca, en
      voegt steeds 25 van die monsters samen tot een verzamelmonster; of

      b. 5 monsters overeenkomstig punt 2.2.2.1, onderdeel b, eerste drie alinea’s en onder i, van de bijlage bij
      verordening (EU) nr. 200/2010.

      4 De houder van kippen als bedoeld in [artikel 7b.44, eerste lid, onderdeel b][ref5], neemt per koppel verspreid
      over de stal 2 monsters overeenkomstig punt 2.2.1 van de bijlage bij verordening (EU) nr. 517/2011 en laat
      die monsters door een laboratorium als bedoeld in [artikel 7b.45, eerste lid][ref6], samenvoegen tot een
      verzamelmonster.


